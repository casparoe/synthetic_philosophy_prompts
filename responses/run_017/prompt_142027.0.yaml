prompt: |-
  I write novels, which mostly means inventing people's inner lives and then getting emails about them. I've now watched the same thing happen three times and I need a word for it, because I want to talk about it in an afterword and I'd rather not grab some term of art and use it wrong.

  Instance one. A few years back I gave a character a very specific way of going flat — not sad exactly, more like the volume drops on everything, and she can describe it perfectly well and can't do anything about it. I got maybe forty messages from readers saying some version of: that's me, and I never had a word for it until I read it. Several said they'd gone and got diagnosed with something on the strength of it. Fine. Expected.

  Instance two is the one that got under my skin. When I started the sequel I went looking for how clinicians actually describe that flat-volume thing, and the descriptions I found — a patient handout, a long Q&A on a clinic's site — use almost the vocabulary my character used: the same metaphors, the same move of insisting it isn't sadness, everything is just behind glass. I'm definately not claiming anyone read my book. It's more that my book and the clinic were both drawing on the same pool of first-person talk that had been going around in memoirs and forums for years.

  So here's the shape I keep seeing. A way of describing an experience shows up first in ordinary language. It gets taken up as clinical description, because there isn't really any better evidence for what something is like from the inside. Once it's in the clinical description it gets handed back to people as the way to recognize the thing in themselves. Those recognitions come back as more first-person talk, which is the raw material for the next version of the category. Each turn the picture gets a bit sharper. The label on the box never changes, so nobody experiences the category as having moved, but the thing in the box is not the thing that was in it twenty years ago.

  And the part I actually care about: the loop seems to run in different directions depending on whether anyone wants the label. Where the label is something people seek — it gets you accomodations, or it hands you the story of your own life — the loop seems to tighten: more people arrive, the descriptions converge, the category gets steadily better at catching the mild end. Where the label is something people dodge, it seems to run backwards: the people who end up carrying it are disproportionately the ones who couldn't dodge it, because a court or a school or a family dragged them in, and then the clinical picture gets built out of that group, so the typical case is a sample nobody chose, and the condition ends up looking more severe and more tangled up with trouble than it probably is.

  Someone told me there's a name for the general shape of this, and I half-remember it being about the people changing. But my thing is about the picture changing, and I don't think those are the same thing.

  What I need: the nearest established concepts, taken one at a time, each with where it fits what I've described and where it doesn't, and then a verdict on which one earns the right to be used in a sentence — or a straight there isn't one, plus a coinage with a definition. A friend said medicalization, but that's about turning ordinary life problems into illnesses, and another said self-fulfilling prophecy, which can't be right because nothing here fails to come true. I don't want a bare label. I want the edges: one case that's clearly inside, one that's clearly outside, and one you'd genuinely hesitate over. And if the direction thing — the loop tightening or inverting depending on whether the label is wanted — is itself a named moderator, I want that separately, because that's the bit with the teeth in it.

  One more thing: I'm on deadline in a place with terrible wifi and I can't check any of this. So tell me how confident you are in each name you hand me, flag any you might be half-remembering or quietly inventing, and single out the one claim in your answer you'd be least surprised to find out is wrong.
reasoning: |-
  Okay, the user is a novelist who's observed a fascinating pattern in how psychological experiences are described and categorized. They've noticed that personal descriptions of an experience (like emotional flatness) get adopted into clinical language, which then shapes how people recognize and report the experience, creating a feedback loop. This loop evolves differently based on whether people seek or avoid the label. 

  First, I need to unpack their core observation: the co-evolution of lived experience narratives and clinical frameworks. The "flat volume" example shows how a character's description resonated with readers, who then saw their own experience validated. The twist comes when the author discovers clinical materials using nearly identical metaphors, suggesting a shared cultural pool of language rather than direct influence. 

  The key elements of their phenomenon are:
  - The dynamic interplay between vernacular and clinical language
  - The feedback loop that refines the category over time
  - The invisibility of this evolution because the diagnostic label stays constant
  - The divergent paths based on label desirability (tightening loop for sought-after labels, broadening/severe presentation for stigmatized ones)

  Now, considering existing concepts:
  - **Illness appropriation** (Hacking) is the closest fit for the general shape—it captures how people adopt and reshape diagnostic categories. But it emphasizes identity formation more than the author's focus on descriptive language evolution. 
  - **Diagnostic creep** explains the tightening loop for desirable labels but doesn't address the stigmatized-label dynamic. 
  - **Looping effect** (also Hacking) is fundamental but too broad—the author needs the specific mechanism of language borrowing.
  - **Medicalization** is adjacent but focuses on pathologization, not the linguistic feedback loop. 
  - **Semantic contagion** (coined here) might work for the language spread aspect but lacks academic grounding.

  For the directionality modifier:
  - **Diagnostic overshadowing** explains why stigmatized labels appear more severe but doesn't capture the feedback mechanism. 
  - **Selection bias** is the underlying engine but isn't a named phenomenon in psych literature. 

  The confidence assessment is crucial—the author can't fact-check. Highest confidence goes to Hacking's concepts (established in philosophy of science), lowest to "semantic contagion" (my construction). The most tentative claim is that diagnostic creep fully explains the desirable-label scenario—it might be more complex.

  For usage guidance: "Illness appropriation" comes closest despite the identity/language gap. The directional effect needs explicit description ("selection bias in diagnostic uptake") since no perfect term exists. The novelist might appreciate the coined "semantic contagion" for metaphorical punch, with caveats. 

  Finally, the response should honor their precision—mapping each term's fit/gap, providing clear examples, and flagging uncertainties. Their "edges" request (inside/outside/ambiguous cases) is particularly thoughtful for conceptual clarity.
answer: |-
  Based on your detailed description and constraints, here's a breakdown of relevant concepts, their fit, and a verdict:

  1.  **Illness Appropriation (Ian Hacking):**
      *   **Fit:** This is the strongest contender for the *general shape*. Hacking described how people "appropriate" psychiatric classifications (like Multiple Personality Disorder or Autism), integrating them into their identities and life narratives. This changes how the condition is experienced, reported, and understood, leading to a feedback loop where the classification itself evolves ("making up people"). It directly addresses the "people changing" aspect you half-remember and the core loop: lived experience -> clinical category -> identity/lived experience -> refined category.
      *   **Doesn't Fit:** Hacking emphasizes *identity formation* and *ways of being* more than the specific *descriptive language* feedback loop you observed (though language is part of it). It focuses less explicitly on the *directionality* based on label desirability.
      *   **Confidence:** High. Hacking's work ("Making Up People," "The Looping Effects of Human Kinds") is foundational in philosophy of science/social construction of illness. This is likely the "name for the general shape" you were told.
      *   **Edge Cases:**
          *   **Inside:** Your "flat volume" readers adopting the description/label into their self-understanding.
          *   **Outside:** A purely physiological condition with no subjective experience component (e.g., a rare enzyme deficiency diagnosed solely via blood test, where patient narratives don't shape the definition).
          *   **Hesitate:** Chronic pain syndromes. Patient narratives and advocacy *have* shaped definitions and treatments (e.g., moving away from purely psychosomatic models), but the underlying physiology is also a factor. Does the language *define* it or *describe* it?

  2.  **Diagnostic Creep / Concept Creep:**
      *   **Fit:** Explains the *tightening loop for sought-after labels*. "Creep" refers to diagnostic categories broadening over time to include milder or subthreshold cases, often due to increased awareness, advocacy, and the desire for the label (for accommodations, identity, validation). This fits your observation of the category "getting steadily better at catching the mild end" when the label is desirable.
      *   **Doesn't Fit:** Primarily describes *expansion/broadening* of criteria, not the core *language feedback loop* mechanism ("my book and the clinic... drawing on the same pool of first-person talk"). Doesn't address the *inverse loop* for stigmatized labels.
      *   **Confidence:** High for describing the expansion mechanism for desirable labels. Well-established in psychiatry/psychology literature (e.g., debates on ADHD, Autism spectrum expansion).
      *   **Edge Cases:**
          *   **Inside:** ADHD diagnosis expanding to include more inattentive presentations, driven partly by awareness and patient advocacy seeking diagnosis/accommodations.
          *   **Outside:** A strictly defined genetic syndrome with no spectrum; diagnosis is binary based on a test result.
          *   **Hesitate:** PTSD criteria broadening to include more types of trauma exposure. Driven by both advocacy/awareness (creep) and evolving research on trauma impact (less "loopy").

  3.  **Looping Effect (Hacking):**
      *   **Fit:** The fundamental mechanism underlying illness appropriation. Classifications interact with the people classified, changing both the people and the classification over time in a feedback loop. Directly addresses the core dynamic of the picture changing while the label stays the same. Explains *why* the "thing in the box is not the thing that was in it twenty years ago."
      *   **Doesn't Fit:** It's the *mechanism* rather than a specific *named phenomenon* for the illness context itself. Less focused on the *linguistic borrowing* you observed or the specific *directionality* of the loop based on stigma.
      *   **Confidence:** Very High. This is Hacking's core concept. It's the engine driving "Illness Appropriation."
      *   **Edge Cases:** (Similar to Illness Appropriation, as it's the mechanism behind it).

  4.  **Medicalization:**
      *   **Fit:** Partially fits the *stigmatized label* scenario where a condition becomes seen as "medical" and potentially more severe/pathologized, often involving institutional control (courts, schools). Explains why people might "dodge" the label.
      *   **Doesn't Fit:** Too broad. Focuses on defining non-medical problems as medical, not the specific *language feedback loop* or the *evolution of the clinical picture* based on who gets labeled. Doesn't capture the tightening loop for desirable labels at all.
      *   **Confidence:** High for the stigma/institutional control aspect, but low for your core phenomenon.
      *   **Edge Cases:**
          *   **Inside:** Oppositional Defiant Disorder diagnosis applied in school settings to pathologize normal adolescent defiance.
          *   **Outside:** A purely medical breakthrough identifying and defining a new physical disease (e.g., HIV/AIDS in the early 80s).
          *   **Hesitate:** Obesity shifting between a lifestyle issue and a chronic medical disease. Involves medicalization but also complex biology and social factors.

  5.  **(Potential Coinage) Semantic Contagion / Lexical Feedback Loop:**
      *   **Fit:** Directly addresses your observation of *descriptive language* (metaphors, specific phrases) moving from lived experience narratives -> clinical descriptions -> back to patients, sharpening the category invisibly. Focuses on the *language* evolution driving the conceptual evolution.
      *   **Doesn't Fit:** Not an established term. Doesn't inherently capture the *identity/appropriation* aspect (Hacking) or the *directionality* based on desirability.
      *   **Confidence:** Low (as an established term). This is descriptive rather than academic.
      *   **Edge Cases:**
          *   **Inside:** Your specific example: "flat, behind glass, not sad" moving from forums/memoirs -> your book/clinic materials -> readers' self-recognition.
          *   **Outside:** The development of purely technical medical jargon with no roots in patient experience (e.g., names of specific surgical techniques).
          *   **Hesitate:** The term "triggered" moving from clinical PTSD descriptions (a specific symptom) -> widespread internet vernacular for any discomfort -> influencing broader cultural understanding of reactivity.

  **The Directionality Modifier (Tightening vs. Inverting Loop):**
  *   **The Issue:** This is the crucial observation lacking a perfect, specific name.
  *   **Closest Concepts:**
      *   **Selection Bias (in Diagnostic Uptake):** This is the *mechanism*. For desirable labels, people *self-select* into diagnosis (often milder cases seeking validation/accommodations). For stigmatized labels, diagnosis is *externally imposed* (often more severe cases caught in institutional nets). This bias directly shapes the "clinical picture" built from each group.
      *   **Diagnostic Overshadowing (Related):** When a stigmatized label (e.g., intellectual disability, severe mental illness) is applied, clinicians may attribute *all* symptoms/behaviors to that label, missing other causes and reinforcing a picture of severity/complexity. This contributes to the "inverse loop" effect you describe.
  *   **Confidence:** High for Selection Bias as the core mechanism. Diagnostic Overshadowing is a specific consequence contributing to the effect for stigmatized labels.
  *   **Named Moderator?** No single, established term neatly bundles the *direction of the feedback loop's evolution* based on label desirability. It's best described as **"Selection Bias in Diagnostic Uptake Driving Conceptual Evolution"** or the **"Social Valence of Diagnosis Modifying the Looping Effect."**

  **Verdict & Recommendation:**

  1.  **For the Core Phenomenon (The Loop):** Use **"Illness Appropriation" (Ian Hacking)**. It's the established concept closest to your observation. Acknowledge the *looping effect* as the mechanism.
      *   **Sentence:** "What I observed echoes Ian Hacking's concept of **'illness appropriation'** – the dynamic process where lived experiences inform clinical descriptions, which are then adopted by individuals, refining both their self-understanding and the category itself in an invisible feedback loop."
      *   **Addressing the Fit:** Add: "While Hacking emphasized identity formation, my focus is on the uncanny circulation of *descriptive language* – how metaphors born in personal struggle find their way into clinical handouts and back again, sharpening the picture within a seemingly static label."

  2.  **For the Directionality (Tightening/Inverting Loop):** There isn't a perfect label. **Describe it explicitly** using the mechanisms:
      *   **Sentence:** "This loop seems to run in different gears depending on whether a diagnosis is sought or avoided. Where labels are desired – offering access to accommodations or a coherent life narrative – **self-selection** brings in milder cases, tightening the category around accessible descriptions. Where labels are stigmatized, diagnosis often arrives via courts or schools, **selecting for more severe presentations**; the clinical picture built from this group risks **diagnostic overshadowing**, making the condition appear inherently more severe and complex than it might be for those who evade the label."
      *   **Use:** You can say "**socially-mediated selection bias in diagnostic uptake** shapes the evolution of the category."

  3.  **For Your Specific Language Observation:** If you want to highlight *that* aspect specifically, coin **"semantic contagion"** or **"lexical feedback loop"** within your text, defining it clearly. E.g., "...a process I think of as **semantic contagion**, where metaphors for inner states spread from personal accounts to clinical language and back again, refining the shared understanding invisibly."

  **Confidence & Caveats:**

  *   **Highest Confidence:** Ian Hacking's "Looping Effects" and "Illness Appropriation" / "Making Up People" as the foundational framework for the core phenomenon. Diagnostic Creep for the broadening of desirable labels. Selection Bias as the key mechanism for the directionality.
  *   **Lower Confidence:** My suggestion of "Diagnostic Overshadowing" as a *contributor* to the inverse loop for stigmatized labels – while real, its direct connection to the *feedback loop evolution* might be slightly interpretive. "Semantic Contagion" is purely descriptive coinage.
  *   **Claim I'd Be Least Surprised is Wrong/Contested:** The assertion that "Diagnostic Creep" *fully* explains the tightening loop for desirable labels. Some argue it's also driven by pharmaceutical marketing, changes in diagnostic thresholds based on research, or genuine increased prevalence, not just social factors/self-selection. Your description focuses on the social/linguistic mechanism, which is valid, but it's part of a complex picture.

  **In Summary:** Use **"Illness Appropriation" (Hacking)** for the core loop, explicitly mention the **"looping effect"** and the role of **"selection bias"** in diagnostic uptake to explain the directionality, and feel free to coin **"semantic contagion"** for the specific language circulation you documented. This gives you academic grounding while allowing precise description of your unique observations. Good luck with the deadline!
