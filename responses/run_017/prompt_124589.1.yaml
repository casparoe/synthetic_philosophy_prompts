   Part 2 (20 minutes): The weighting example (no reversal, but marginal difference due to weighting) with the same card method.
   Part 3 (25 minutes): Discussion of the three key ideas and the dial of partitioning, plus how causal reasoning is needed.
   Part 4 (10 minutes): Wrap-up and key takeaways.

   But note: the dial of partitioning might be introduced in the first part by having more than one stratification variable? But that might be too much.

   Alternatively, we can do:

     - First, the classic Simpson's reversal (with a table they can compute by hand) and role-play.
     - Then, the weighting example (which also uses conditioning but without reversal).
     - Then, introduce the idea of over-stratification: show a third variable that is too fine and leads to empty cells.

   However, the third point (the dial) might be better illustrated with a different example? Maybe extend the weighting example by having multiple levels of a variable.

