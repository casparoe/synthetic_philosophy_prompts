answer: |-
  ### Brainstormed Session Structures
  1. **Debate-Driven Role-Play**: Students split into two consulting firms hired by rival companies. Each analyzes the same dataset to argue for their treatment's superiority. After initial pitches, introduce stratification variables (e.g., disease severity) to force reevaluation. Pros: Highlights honest disagreement, emphasizes rhetoric. Cons: May rush causal insights.  
  2. **Stratification Exploration Lab**: Groups manually stratify patient cards by severity/age, computing success rates at different granularities. Progress to empty-strata scenarios. Pros: Hands-on "dial" experience, reveals small-sample issues. Cons: Less role-play drama, may feel mechanical.  
  3. **Sequential Revelation with Hypotheticals**: Start with aggregate data, reveal paradox, then introduce weighting example. Use guided questions to probe causality. Pros: Clear progression, controlled pacing. Cons: Less active discovery, risks "nodding along."  
  4. **Causal Graph Co-Construction**: Students draw causal diagrams on the board to resolve paradoxes, then test with data. Pros: Explicit causal focus. Cons: Time-intensive, may lose stats-shy students.  

  **Chosen Structure**: **Hybrid Debate + Stratification Lab** (Combines 1 & 2). *Why?* Maximizes engagement through role-play while ensuring hands-on experience with stratification trade-offs. Forces confrontation with all three key ideas naturally.  

  ---

  ### Full Session Design  
  **Goal**: Show that (1) honest analysts reach opposite conclusions, (2) causal stories resolve paradoxes, and (3) stratification is a dial with trade-offs.  
  **Numbers**: 27 patients (Dataset 1: Simpson’s reversal) + 29 patients (Dataset 2: Weighting example). Hand-checkable, no spreadsheets.  
  **Materials**:  
  - **Index Cards**: Pre-marked with patient details (treatment, outcome, severity/age).  
  - **Projector**: Display aggregate tables.  
  - **Whiteboard**: Track key arguments and causal diagrams.  

  **Roles**:  
  - **Consulting Firms**: Firm A (advocates Treatment A), Firm B (advocates Treatment B). Split class into two groups of 7.  
  - **Within Firms**: Spokesperson, Recorder, Stratification Captain (rotates per task).  

  **Timeline (75 min)**:  
  1. **Intro & Dataset 1 Setup (5 min)**:  
     - *Context*: "You’re consultants hired by Pharma A or B. Analyze Trial 1 data honestly to argue your treatment is superior."  
     - Project **Dataset 1 Aggregate**:  
       | Treatment | Patients | Successes | Success Rate |  
       |-----------|----------|-----------|-------------|  
       | A         | 13       | 7         | 53.8%       |  
       | B         | 14       | 7         | 50.0%       |  

  2. **Dataset 1: Aggregate → Stratified (20 min)**:  
     - **Firm Work (5 min)**: Compute rates, prep 1-min pitch. *Firm A should claim victory; Firm B struggles*.  
     - **Pitches (2 min)**: Each spokesperson presents.  
     - **Reveal Severity (5 min)**: Distribute **27 cards** for Dataset 1:  
       - A-Mild: 1 success / 5 patients (20%)  
       - A-Severe: 6 successes / 8 patients (75%)  
       - B-Mild: 3 successes / 9 patients (33.3%)  
       - B-Severe: 4 successes / 5 patients (80%)  
       *Task: "Stratify by severity. Does this change your recommendation?"*  
     - **Revised Pitches (2 min)**: Firm B now dominates (B better in both strata). Firm A questions aggregation.  
     - **Instructor Q (1 min)**: "Why did severity change the story? What’s *really* causing outcomes?"  

  3. **Dataset 2: Weighting Example (20 min)**:  
     - **Project Dataset 2 Aggregate (5 min)**:  
       | Treatment | Patients | Successes | Success Rate |  
       |-----------|----------|-----------|-------------|  
       | A         | 15       | 9         | 60.0%       |  
       | B         | 14       | 10        | 71.4%       |  
       *Task: "New trial! Argue for your treatment again."*  
     - **Pitches (2 min)**: Firm B cites higher aggregate success.  
     - **Reveal Age (5 min)**: Distribute **29 cards** for Dataset 2:  
       - A-Young: 5 successes / 10 patients (50%)  
       - A-Old: 4 successes / 5 patients (80%)  
       - B-Young: 2 successes / 4 patients (50%)  
       - B-Old: 8 successes / 10 patients (80%)  
       *Task: "Stratify by age. Now what?"*  
     - **Pitches (2 min)**: Both firms find **identical rates in young/old** (50%/80%). Firm A: "No difference!" Firm B: "But our *patients* are older!"  

  4. **Discussion & Dial Exploration (25 min)**:  
     - **Key Q1**: "Two honest teams, opposite conclusions—why?" *Draw out: Choice of summary depends on causal assumptions*.  
     - **Key Q2**: "Why did severity matter in Dataset 1 but age in Dataset 2?" *Sketch causal diagrams: Severity confounds treatment; age causes outcome imbalance*.  
     - **Key Q3 (Dial)**: "What if we stratified by *hospital* (e.g., Hospital X/Y)?" Hypothesize:  
       - Coarse (no strat): Confounding remains.  
       - Fine (hospital): Small strata → e.g., 3 patients, 0 in control group. "Can we compute a rate? What fails?"  
       - *Whiteboard trade-off*: Bias (under-stratify) vs. Noise (over-stratify).  
     - **Weighting Insight**: "Dataset 2: No within-group difference, but aggregate differed. Why?" *Math note*: Pooled rate = weighted average. Show:  
       - Overall A: `(10/15)*50% + (5/15)*80% = 60%`  
       - Overall B: `(4/14)*50% + (10/14)*80% ≈ 71.4%`  
       Weights differ → aggregate misleads.  

  5. **Wrap-up (5 min)**:  
     - "Data alone doesn’t tell you:  
       1. *What* to condition on (need causal story).  
       2. *How finely* to stratify (dial: bias vs. noise).  
       3. *Why* weighting creates illusions (marginal ≠ conditional)."  
     - "Next week: How to build causal stories from data."  

  ---

  ### Debrief & Troubleshooting  
  **Key Moments → Insights**:  
  - **Pitch Reversals (Datasets 1 & 2)**: Drives home idea #1 (honest opposites).  
  - **Causal Diagrams (Discussion)**: Addresses #2 (need for causal stories).  
  - **Hospital Stratification Hypothetical**: Illustrates #3 (dial of partitioning).  
  - **Weighting Calculation**: Proves "no difference locally, difference globally."  

  **Predictable Problems & Fixes**:  
  1. **"Someone spots the trick early"**:  
     - *Response*: "Great! Now prove it with the stratified data." Harness them as "team experts" to lead peers.  
  2. **"Stats students dominate"**:  
     - *Prevent*: Assign rotating roles (e.g., philosophers as spokespeople); use think-pair-share for calculations.  
  3. **"Collapses into relativism"**:  
     - *Preempt*: Stress, "This isn’t ‘any story goes.’ Causal assumptions are *testable*—e.g., if severity *didn’t* affect treatment, stratifying would be unnecessary." Use Dataset 2 to show objective math (weighting).  

  **Limitations**:  
  - The "dial" trade-off (bias vs. noise) requires abstraction; students won’t *calculate* variance. *Instructor must state*: "Data can’t tell you where to stop; use domain knowledge."  
  - Causal diagrams need brief instructor input; students won’t derive them alone. *Bridge*: "In medical trials, we know severity confounds because doctors assign treatments based on it."  

  **Numbers Verification**:  
  - **Dataset 1 (Reversal)**:  
    - Overall: A (7/13 ≈ 54%) > B (7/14 = 50%).  
    - Mild: A (20%) < B (33.3%); Severe: A (75%) < B (80%). *Reversal confirmed*.  
  - **Dataset 2 (Weighting)**:  
    - Young: A (50%) = B (50%); Old: A (80%) = B (80%).  
    - Pooled: A = `(10/15)(50%) + (5/15)(80%) = 60%`; B = `(4/14)(50%) + (10/14)(80%) ≈ 71.4%`. *Math holds*.  

  **Final Tip**: Keep card envelopes pre-sorted. If groups stall, project stratum counts. End with: "So—did either treatment *cause* better outcomes? Thursday, we recruit do-calculus!"
