  We are designing a 75-minute seminar session on Simpson's paradox with a focus on the three key ideas:
   1. Opposite honest conclusions from the same data.
   2. The need for causal stories to resolve which summary (aggregate or stratified) to use.
   3. The "dial" of partitioning: coarse vs. fine strata and the trade-offs.

   Additionally, the fourth idea: a scenario where within every stratum the success rates are identical for two treatments, but the overall rates differ due to weighting.

   However, note: the fourth scenario is not Simpson's paradox (which requires a reversal of association when conditioning) but rather a different phenomenon. It is possible and is known as "non-collapsibility" or sometimes "Berkson's paradox" in different contexts, but more precisely it is an example of how marginal and conditional associations can differ even without confounding. In particular, for binary outcomes, the marginal risk difference can differ from the conditional one even if the conditional risk difference is constant. But note: the paradox described where there is no difference in any subgroup but a difference in the aggregate is actually not possible for risk differences or risk ratios in the way we typically measure. Let me clarify:

   - If the success rate (risk) for treatment A and treatment B is exactly the same in every subgroup, then the overall success rate must also be the same? Not necessarily. Because the overall rate is a weighted average. However, if the weights (i.e., the proportion of each subgroup in the population) are the same for both treatment groups, then the overall rates would be the same. But if the treatment groups have different distributions across the subgroups, then the overall rates can differ even if the conditional rates are identical.

   Example: 
     Two subgroups: Group 1 and Group 2.

     Treatment A:
       Group 1: 100 patients, success rate 50% -> 50 successes
       Group 2: 50 patients, success rate 80% -> 40 successes
       Overall success rate for A: (50+40)/150 = 90/150 = 60%

     Treatment B:
       Group 1: 50 patients, success rate 50% -> 25 successes
       Group 2: 100 patients, success rate 80% -> 80 successes
       Overall success rate for B: (25+80)/150 = 105/150 = 70%

     So even though within each group the success rates are the same for both treatments, the overall success rate for A is 60% and for B is 70%. This is because the treatments were applied to different mixes of the groups.

   This is a valid point and indeed a killer one: the overall difference is entirely due to the distribution of patients, not the treatment effect. It highlights that the crude comparison is confounded by the group variable. But note: in this case, the within-stratum comparison shows no effect, but the marginal comparison shows an effect. This is the opposite of Simpson's paradox (which typically shows a reversal). However, it is a very important lesson: the marginal association can be misleading because it does not account for the distribution of the confounder.

   Since our goal is to show the importance of conditioning and the role of causal structure, this example is excellent. It shows that even without a reversal, the choice of conditioning matters.

   However, note that in the above example, if we condition on the group, we see no effect. The marginal effect is due to the confounding factor (group) being associated with both the treatment and the outcome.

   So we can use this as a second example after the classic Simpson's reversal.

   But let's structure the session.

   Brainstorming four possible structures:

   Structure 1: Classic Reveal
     Start with the aggregate table, let students see the overall association. Then break down by a third variable (e.g., gender) and show the reversal. Discuss why and what it means. But the instructor mentioned they've done this and it didn't stick.

   Structure 2: Debate Format
     Divide the class into two groups. Give each group the same data but assign them to argue for one treatment or the other. They must use the data to support their claim. Then reveal that the data can be broken down by a third variable and have them re-debate. Then discuss the need for causal reasoning.

   Structure 3: Data Exploration with Cards
     Each student (or pair) gets a set of index cards representing patients. Each card has the patient's treatment (A or B), outcome (success/failure), and a third variable (e.g., severity: mild/severe). They are asked to compute overall success rates and then within each severity group. They discover the paradox. Then they are asked to consider what if we had even more variables? And what if the strata are too small? This would address the "dial" of partitioning.

   Structure 4: Consultant Role-Play
     Two groups of students are consultants hired by two companies (one selling A, one selling B). They are given the same dataset and must present the best case for their treatment. The dataset is such that without conditioning, one looks better, but with conditioning the other does. Then the instructor introduces a second dataset (the one with no within-group difference but marginal difference) to show that even without reversal, the marginal can be misleading.

   The instructor wants to avoid the classic reveal and wants to emphasize:
     - Opposing honest conclusions (Structure 2 or 4)
     - The need for causal story (Structure 4 can lead to that naturally)
     - The partition dial (Structure 3 is good for that)

   Also, the fourth point (weighting) is important and can be included in Structure 4 by having two examples.

   My choice: A hybrid of Structure 3 and 4, with a focus on role-play and hands-on card manipulation, and two datasets.

   Why?
     - The card activity will engage all students, not just the vocal ones.
     - The role-play (consultants) will make the opposing conclusions feel real.
     - We can design two datasets: one for Simpson's reversal and one for the weighting example.

   However, time is 75 minutes. We need to be efficient.

