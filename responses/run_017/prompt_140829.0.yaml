answer: |-
  Here’s your quiz and decision tree, designed to bypass labels and focus on concrete cases. Each question targets a core disagreement, with options stripped of jargon. The scoring key groups answers into coherent positions.

  ---

  ### **Quiz: What Do You Believe About How Kids Learn Language?**
  *(Pick one answer per question)*

  1. **Mini-Language Test**:  
     You invent a tiny language where questions must start with "Zog" (e.g., "Zog cat eats fish?"). You *never* use questions with "the" (so "Zog the cat eats fish?" is impossible). A child hears 100 correct examples *without* "the" questions but is never told the "no *the*" rule. Later, the child avoids saying "Zog the..." questions. Why?  
     - **A**: They sensed a hidden "impossible pattern" built into human brains.  
     - **B**: They statistically noticed "Zog" and "the" never appeared together.  
     - **C**: No fact of the matter—maybe they just guessed.  

  2. **Gesture System Case**:  
     Deaf children with no language input invent a gesture system. Adults around them use inconsistent gestures (e.g., "eat apple" signed as "apple-eat" or "eat-apple" randomly). The children grow up signing *only* "eat-apple", never mixing orders. Why?  
     - **A**: Children’s brains impose grammatical order—it’s instinctive.  
     - **B**: They simplified chaos by spotting the most frequent pattern.  
     - **C**: They copied the *intent* behind gestures, not the surface errors.  

  3. **Second Language Timing**:  
     A 9-year-old moves to a new country and speaks the local language flawlessly. Their 15-year-old sibling, equally smart and motivated, always speaks with slight errors. Why the difference?  
     - **A**: A brain window for grammar closes around puberty.  
     - **B**: The older sibling heard less *playground* talk or had stronger habits.  
     - **C**: Age isn’t the key factor—personality or social access matters more.  

  4. **AI vs. Kids**:  
     An AI reads 100,000x more text than a child hears by age 5. Yet when asked "Which is impossible: *The cat sleeps* or *The cat sleeps soundly*?", it often picks the wrong one. Kids never fail this. Why?  
     - **A**: Kids use innate grammar rules; AI just counts words.  
     - **B**: AI lacks real-world context and social feedback kids get.  
     - **C**: The test is unfair—AI wasn’t *trained* for grammar judgments.  

  5. **Household Error**:  
     All adults in a house say "The cat *is* sleeping" (correct) but "*The cat sleeping*" (missing "is") for descriptions. The child *never* copies the error, always using "is". Why?  
     - **A**: Errors violate universal grammar—kids filter them out.  
     - **B**: Kids hear enough correct examples elsewhere (TV, books).  
     - **C**: Children interpret meaning, not surface errors.  

  6. **Animal Language**:  
     Could a hypothetical animal with perfect memory and human-level intelligence, but *no special language instincts*, learn English grammar just by listening?  
     - **A**: No—grammar requires innate human wiring.  
     - **B**: Yes—with enough exposure and motivation.  
     - **C**: Unanswerable—we don’t know what "special instincts" means.  

  7. **The "No Fact" Question**:  
     Linguists debate sentences like *"The horse raced past the barn fell."* Some say it’s ungrammatical; others say it’s fine but confusing. When kids learn, is there a "true" answer here?  
     - **A**: Yes—universal grammar defines absolute rules.  
     - **B**: No—grammar is whatever people accept.  
     - **C**: 🤷 **I don’t think this has a fact of the matter.**  

  8. **Pattern or Blueprint?**:  
     When kids learn word order (e.g., English "dog bites man" vs. Japanese "man dog bites"), do they:  
     - **A**: Unlock a preset menu of possible orders.  
     - **B**: Deduce patterns from examples + general cognition.  
     - **C**: Follow communication instincts, not grammatical rules.  

  ---

  ### **Scoring Key**
  Tally your **A**/**B**/**C** choices and match to positions:

  - **Mostly A**: **Nativist**  
    *Commitment: Grammar constraints are innate, language-specific, and genetically pre-wired.*  
  - **Mostly B**: **Empiricist**  
    *Commitment: Input + general learning mechanisms (statistics, social cues) explain everything; no "language instinct" needed.*  
  - **Mix of A/B + Key Cs**: **Constructivist**  
    *Commitment: Innate *learning biases* shape grammar, but they’re not language-specific blueprints.*  
  - **Mostly C (especially Q7)**: **Skeptic**  
    *Commitment: The debate is ill-defined—terms like "innate" are too fuzzy to test scientifically.*  

  ---

  ### **Decision Tree**
  *(Branches on core claims; leaves show positions)*  
  ```  
  1. Are children constrained in what grammars they can learn?  
     │  
     ├── Yes ────> 2. Is this constraint *innate* (not learned from input)?  
     │           │  
     │           ├── Yes ────> 3. Is the constraint *language-specific*?  
     │           │           │  
     │           │           ├── Yes ────> **Nativist**  
     │           │           │               *Commitment: "Universal Grammar exists as a genetic module."*  
     │           │           │  
     │           │           └── No ─────> **Constructivist**  
     │           │                           *Commitment: "Domain-general learning biases make grammar possible."*  
     │           │  
     │           └── No ─────> **Empiricist**  
     │                           *Commitment: "Input statistics + social feedback suffice."*  
     │  
     └── No ───────> **Skeptic**  
                     *Commitment: "The question confuses definitions with reality."*  
  ```

  **Tie-Breakers**:  
  - Nativist vs. Constructivist: Pick Q8. **A** = Nativist; **B** = Constructivist.  
  - Empiricist vs. Skeptic: Pick Q7. **B** = Empiricist; **C** = Skeptic.  

  **Empty Combinations** (e.g., "Constraints exist but aren’t innate or learned"):  
  - Why? Incoherent—if constraints aren’t innate *or* learned, how do they arise?  
  - Why? Unattractive—denies both biology and experience without offering an alternative.  

  ---

  ### **Why Your Cases Work**  
  - **Mini-language (Q1)**: Tests if kids infer *unspoken* rules (nativist) vs. statistical gaps (empiricist).  
  - **Gesture system (Q2)**: Reveals if structure is *imposed* (nativist/constructivist) or *extracted* (empiricist).  
  - **Age cutoff (Q3)**: Flags critical periods (nativist) vs. social/input factors (empiricist).  
  - **AI failure (Q4)**: Exposes limits of input alone (nativist) vs. training flaws (empiricist).  
  - **Household error (Q5)**: Shows error resistance (nativist) vs. input richness (empiricist).  
  - **Animal test (Q6)**: Probes domain-specificity (nativist) vs. general intelligence (empiricist).  
  - **"No fact" (Q7)**: Forces skepticism where data underdetermines theory.  

  **Bad Test Dropped**: *"Vastly more text than a child hears"* is redundant with Q4 (AI case covers this better).
