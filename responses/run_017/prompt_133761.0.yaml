  We will map your answers to one of several positions. Some answer patterns might fit more than one position or none, and some positions might not be represented in the quiz. We also note that a very high but finite weight on pain might be indistinguishable from a lexical threshold in these finite cases.

  Position L1: **Lexical threshold (per-moment, axiological)**
