     C. They are equally bad.

  2. You have the option to press a button that would cause one person to experience 5 seconds of agony. In exchange, it will generate an enormous amount of mild pleasure (1 billion person-years) for a large population. If you do not press the button, nothing happens. Is it permissible to press the button?
     A. Yes.
     B. No.
     C. It is permissible either way (you may press it or not).

  3. You are a bystander to a machine that will cause one person to experience 5 seconds of agony. You can prevent this by pressing a button, but doing so will lose 1 billion person-years of mild pleasure for a large population. Is it permissible to not press the button (i.e., allow the agony to happen)?
     A. Yes.
     B. No.
     C. It is permissible either way.

  4. Consider a pain of intensity 10 (on a scale where 0 is no pain and 100 is agony) lasting 1 second. Can this pain be compensated by a sufficiently large amount of pleasure? That is, is there some amount of pleasure that would make an outcome containing this pain and that pleasure at least as good as an outcome with no pain and no pleasure?
     A. Yes.
     B. No.

  5. Consider a pain of intensity 50 (on the same scale) lasting 1 second. Can this pain be compensated by a sufficiently large amount of pleasure?
     A. Yes.
     B. No.

  6. Consider a pain of intensity 51 lasting 1 second. Can this pain be compensated by a sufficiently large amount of pleasure?
     A. Yes.
     B. No.

  7. Compare two lives of the same length for one individual:
     - Life A: One second of agony (at age 40) and 80 years of very high pleasure (the rest of the time).
     - Life B: 80 years of constant mild pain and no pleasure.
     Which life is worse?
     A. Life A is worse.
     B. Life B is worse.
     C. They are equally bad.

  8. Two outcomes for a population of one million people:
     - Outcome A: One person experiences 5 seconds of agony; the other 999,999 experience 100 years of mild pleasure each.
     - Outcome B: Every person experiences 1 second of moderate pain.
     Which outcome is worse?
     A. Outcome A is worse.
     B. Outcome B is worse.
     C. They are equally bad.

  9. One individual experiences either:
     - Option A: One episode of severe pain (intensity 80) lasting 5 minutes, followed by 100 years of pleasure.
     - Option B: 1,000 episodes of mild pain (intensity 10) each lasting 1 second, and no pleasure.
     Which is worse?
     A. Option A is worse.
     B. Option B is worse.
     C. They are equally bad.

  10. Two outcomes for one individual:
      - Outcome A: One second of agony and 100 years of high pleasure.
      - Outcome B: Two seconds of agony and 200 years of high pleasure.
      Which outcome is worse?
      A. Outcome A is worse.
      B. Outcome B is worse.
      C. They are equally bad.

