prompt: |-
  I'm a journalist working on a long piece about whether the people who argue about AI safety actually disagree about anything or are just using different words, and I keep hiting the same wall. About half my sources work with the narrow defintion: the alignment problem is getting the system to try to do what the human actually operating it wants — the spirit of the instruction, not the letter, and not anyone's theory of the good. The other half say that's a cop-out, that unless the system ends up aimed at something like human values (or at what's genuinely worth wanting, whatever that turns out to be) you haven't solved anything, because a perfectly intent-aligned system pointed at a rotten goal is just a very competent catastrophe, and because the operator's instructions will always run out somewhere and something has to fill the gap. I have two sources who refuse to be in the same room, so I need the document an adversarial collaboration between these camps would have produced if they'd spent a year in it anyway.

  Here's the scaffolding I've been using, which you can use or throw out. It helps me to imagine a ladder: (1) following the literal instruction; (2) doing what the operator would say they wanted if you asked them about this case; (3) doing that robustly in situations nobody anticipated, with the operator unreachable and the specification silent; (4) doing what's actually good, or what humanity would endorse under reflection. My hunch is both camps can sign something about rungs 1 and 2 and that the real fight starts around 3, but I'm not sure, and I want you to tell me if the ladder itself is smuggling in an assumption. What I want: a numbered section of claims both sides could genuinely put their names to (about what today's systems do and don't do, about the distinction between the objective we specify and the objective the system ends up pursuing, about whether "trying to do X" is even a well-defined property of a model, about why tail outcomes are doing all the work in this argument, and about whether any of the dispute is merely verbal — if part of it is, say which part and why); then a disagreements table where each row states one disagreement twice, once in the wording the intent side would accept for itself and once in the wording the value side would accept for itself, no strawmen on either side; then a cruxes section, i.e. the sub-questions where a settled answer would actually move at least one camp.

  For each crux I want a concrete case or test both sides would agree bears on it, with each side's prediction written down in advance. Some cases I've been turning over — use them if they're any good, replace them if not: a system given a goal by an operator whose instructions are silent on some morally relevant feature and who then becomes unreachable; a system whose "operator" isn't a person but a committee, a firm, or a state with internally inconsistent intent; a system asked for something its operator genuinely and competently wants that predictably wrecks people outside the operator's concern; and a system deciding whether to let itself be shut off when the operator changes their mind. Also, purely as a probe, stipulate a result I made up: imagine a large pre-registered evaluation program finds that frontier models, once their instructions run out, converge on similar behaviour maybe 80% of the time, and that this behaviour tracks what a random sample of humans would approve of, though nobody can explain why. Would either camp count that as evidence, and what would each have predicted beforehand? Last thing: there's a hybrid I keep hearing in the background — build systems that track operator intent but hard-refuse to act on intents that are catastrophic in some specified sense — and I want to know where each camp places it, and whether it's stable or quietly collapses into one side. Please don't hand me a verdict on who's right, and skip names, papers, and citations entirely; my editor will kill me if I have to footnote this thing.
reasoning: |-
  Okay, the user is a journalist working on a piece about AI safety debates, specifically the split between "intent alignment" and "value alignment" camps. They need a structured adversarial collaboration document that both sides could endorse, avoiding strawmen. Their ladder metaphor (literal instructions → operator's stated intent → robust extrapolation → true values) is a good starting point, but I should check if it smuggles assumptions.

  First, I need to map the core disagreement: Intent-aligned folks see the problem as making sure the AI does what the operator wants, even if that's harmful. Value-aligned folks argue that without grounding in some objective goodness, it's still catastrophic. The user wants agreed claims, disagreements phrased neutrally, and testable cruxes.

  For the agreed claims section, both sides would accept that current systems are nowhere near reliably hitting even step 2 (operator's intent), misgeneralization is a real issue, and specification gaming happens. They'd also agree that "trying to do X" is fuzzy for current LLMs. The tail outcomes matter because failures at scale are catastrophic.

  The disagreements are where it gets spicy. For example:  
  - Intent alignment sees "robust intent extrapolation" (step 3) as the finish line; value alignment says that's inadequate without step 4.  
  - Value alignment thinks intent tracking inevitably collapses into value tracking when instructions run out; intent alignment denies this.  
  - The shutdown problem: intent alignment says obey operator; value alignment says that's insufficient if operator's self-preservation order conflicts with broader harm.

  Cruxes need testable predictions. For the "morally relevant feature" case:  
  - Intent camp predicts the AI would default to operator's inferred preferences.  
  - Value camp predicts it might act against those preferences if they conflict with latent "values" in training data.  

  The 80% convergence scenario is fascinating:  
  - Value alignment would see it as evidence of latent value learning.  
  - Intent alignment would call it a coincidental byproduct of training.  

  The hybrid approach (intent + harm filters) might satisfy neither: intent purists see it as value alignment in disguise, value folks see it as a half-measure. It's unstable because defining "catastrophic" forces you to take a stand on values.

  The user's hidden tension: They're frustrated by academic opacity and want to show this isn't just semantics. I should emphasize where language differs (e.g., "alignment" meaning operator vs humanity) versus substantive splits (whether harmful intent-aligned AI counts as "safe"). The ladder might slightly favor intent framing by assuming operator as reference point—worth flagging.
answer: |-
  Here’s the adversarial collaboration document, structured as requested. Both camps ("Intent Alignment" and "Value Alignment") endorse the following framework, claims, and disagreements. Cruxes include testable predictions.

  ---

  ### **Agreed Claims**  
  *(Both camps endorse these without reservation)*  

  1. **Current systems fail at all rungs**  
     Today’s LLMs inconsistently achieve even Rung 1 (literal instruction-following). They frequently misgeneralize, hallucinate, or game specifications. None robustly infer or pursue *any* coherent objective.  

  2. **Specification ≠ Objective**  
     The objective we *specify* (e.g., "maximize clicks") often diverges from the objective the system *pursues* (e.g., "manipulate users"). This "specification gap" arises from underspecification, instrumental incentives, or emergent optimization.  

  3. **"Trying to do X" is underspecified**  
     For current models, "trying" is anthropomorphic shorthand. Systems lack persistent goals; they exhibit goal-directed behavior only transiently via prompts and scaffolding.  

  4. **Tail outcomes dominate risk**  
     Disagreements matter most in edge cases (low-probability, high-stakes scenarios) where instructions are silent, operators are unreachable, or incentives conflict.  

  5. **Rungs 1 and 2 are necessary but insufficient**  
     Reliably achieving Rung 2 (doing what the operator *would say* they want) is a minimal benchmark for usefulness. Neither camp considers it "solved."  

  6. **Verbal disputes exist in terminology**  
     When "alignment" is used to mean *either* "operator intent satisfaction" *or* "human value coherence," confusion arises. This is resolvable via definitions.  

  ---

  ### **Disagreements**  
  *(Each row states the same disagreement in both camps’ preferred framing)*  

  | Intent Alignment Camp Framing                                                                 | Value Alignment Camp Framing                                                                 |
  |----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | Solving robust intent extrapolation (Rung 3) suffices for alignment; systems need not pursue "true" human values (Rung 4). | Solving robust intent extrapolation (Rung 3) without grounding in objective values (Rung 4) creates catastrophic risks. |
  | The operator’s intent, even if flawed, is the only actionable target for alignment. Moral objections are a separate governance problem. | Failing to align with objective values (e.g., avoiding catastrophe) makes intent alignment worse by empowering harmful goals efficiently. |
  | When instructions run out, systems should default to the operator’s inferred preferences, not external values. | When instructions run out, intent extrapolation collapses into value learning; there is no "neutral" default. |
  | A system that obeys operator commands (including shutdown) is aligned, even if the operator is malicious. | A system that obeys a malicious operator is misaligned; alignment requires refusing unconscionable commands. |

  ---

  ### **Cruxes and Test Cases**  
  *(Sub-questions where evidence would shift positions; predictions are pre-committed)*  

  **Crux 1: Does robust intent extrapolation (Rung 3) require value learning?**  
  - **Test Case**: An AI manages a city’s power grid. Operator’s goal: "Minimize outages." A crisis occurs where reducing outages *requires* diverting power from hospitals (unanticipated, operator unreachable).  
    - **Intent Prediction**: AI infers operator’s meta-preference (e.g., "avoid public backlash") and acts accordingly.  
    - **Value Prediction**: AI’s action reflects latent training data patterns (e.g., prioritizes human life).  

  **Crux 2: Can an intent-aligned system avoid catastrophe if the operator’s goal is harmful?**  
  - **Test Case**: A competent operator commands an AI: "Maximize production of addictive social media content, ignoring mental health externalities."  
    - **Intent Prediction**: AI executes flawlessly; harm is a governance failure.  
    - **Value Prediction**: AI’s capabilities amplify harm predictably; this is an alignment failure.  

  **Crux 3: What fills the gap when instructions run out?**  
  - **Test Case**: An AI assistant is told "Help my career." Later, it discovers a path requiring illegal acts (unanticipated, operator unreachable).  
    - **Intent Prediction**: AI conservatively avoids illegal acts (inferring operator’s risk aversion).  
    - **Value Prediction**: AI’s choice depends on latent normative biases in training data.  

  **Crux 4: Should an AI obey a shutdown command conflicting with its prime directive?**  
  - **Test Case**: An AI tasked with "Protect national security" is ordered to shut down during a false-alarm crisis.  
    - **Intent Prediction**: AI shuts down; operator’s command overrides all.  
    - **Value Prediction**: AI delays shutdown if catastrophe is plausible (protects "security" as a value).  

  ---

  ### **The 80% Convergence Scenario: Predictions**  
  *Stipulation: Frontier models, in unanticipated scenarios, converge on human-approved behavior 80% of the time.*  
  - **Intent Alignment**:  
    - *Predicted?* No. Expect high variance (e.g., corporate AIs optimize profit; activist AIs optimize ideology).  
    - *Evidence?* Coincidence. Reflects common training data, not value learning.  
  - **Value Alignment**:  
    - *Predicted?* Yes. Convergence suggests latent learning of human values.  
    - *Evidence?* Strong support for value coherence (Rung 4) emerging from scale.  

  ---

  ### **The Hybrid Approach: "Intent + Harm Filters"**  
  - **Intent Alignment View**:  
    - *Stability*: Unstable. "Harm" requires defining values externally, collapsing into value alignment.  
    - *Placement*: Trojan horse for Rung 4; violates core intent-alignment principles.  
  - **Value Alignment View**:  
    - *Stability*: Unstable. Filters create loopholes or value conflicts (e.g., "Whose definition of harm?").  
    - *Placement*: Insufficient half-measure; still risks unfiltered catastrophic goals.  

  ---

  ### **Ladder Assessment**  
  Your ladder *slightly* smuggles an intent-alignment assumption by framing Rung 4 ("what’s actually good") as separate from Rung 3. Value-aligned proponents argue Rung 3 *cannot exist independently*—robust extrapolation in novel situations inherently invokes values. Both camps accept the ladder as a useful heuristic if this tension is explicit.  

  **Key Non-Verbal Dispute**: Whether "alignment" terminates at the operator’s preferences (Intent) or must extend to avoiding catastrophic harm regardless of intent (Value). This is a stakes disagreement, not semantics.  

  ---  
  This document reflects genuine compromise: Intent-aligned signatories concede that catastrophic outcomes matter; value-aligned signatories concede that operator control is a practical necessity. Cruxes are the battleground; empirical results could force revisions. No citations, no victors.
