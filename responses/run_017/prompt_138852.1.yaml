prompt: |-
  You are a philosopher of social norms who also designs serious games — someone who has run structured exercises for university seminars, strategy offsites and museum events, and who knows what actually happens when twenty unpaid adults are handed a set of rules and left alone with them. Please think carefully before you settle on anything. Begin by brainstorming three candidate core mechanics for this session, in a few paragraphs, and reject two of them with an explicit reason. The rejected options matter to me as much as the chosen one: I want to see the design space before I see the design.

  Here is the situation. I am a journalist; I write about behavioural science and ideas for a broad readership. I have been asked to run a ninety-minute workshop at a science-and-ideas festival. The room will hold eighteen to twenty self-selecting adults — curious, mostly patient, with no philosophy and no economics, and a few who will arrive late. No projector, no phones, no screens; everything has to fit in a tote bag and be reproducible by a colleague from a single sheet of instructions. Stakes can be chocolate, or a silly certificate, or the public reading of scores: nothing that requires a budget.

  What participants should come away having felt, not having been told, is the structure of the classic Lewisian analysis of convention. I'll state it loosely, so we agree on the target: a convention is a regularity of behaviour in a recurring situation where everyone conforms, everyone expects everyone else to conform, and each person's reason to conform depends on the others' conforming — in a setting where some *other* regularity would have solved the same problem just as well. Four things should land:

  1. Arbitrariness. The particular regularity that gets selected is not better in advance; it wins because it is salient, or because it happened last time, and a different one would have served everyone equally.
  2. Expectation-dependence. Once you expect others to conform, conformity becomes rational for you; the expectation manufactures the reason. Participants should notice their own reasoning flipping when they revise what they think the room will do.
  3. Inertia under universal discontent. A convention can be stable while nearly everyone privately prefers a different one, because no individual can profitably move alone and no collective move is available. They should feel the gap between "I want to switch" and "we can switch."
  4. Path dependence at the level of populations. Two groups facing the identical problem can settle on different regularities and end up unequally well off, for no reason that anyone can point to — which is the seed of the claim that norms evolve by something other than optimisation.

  Here are three mechanisms I have been turning over. Use the ones that work, improve them, or replace them outright — but tell me plainly if one is a dud and why.

  *The inheritance rule.* Players coordinate in silence. Every third round, one player is removed from the table and replaced by a stranger from an adjacent room who has seen nothing; the replacement inherits the departing player's score. The table therefore has a standing incentive to transmit its regularity to someone who does not share its history, using no words and no shared precedent. What I want tested is whether the group can tell the difference between a regularity that is genuinely common knowledge and one that is only mutually known.

  *The mutiny ballot.* Late in the session, one available regularity is better for everybody, but the room is stuck on the worse one. First, a private poll: everyone writes down which they would prefer if the room coordinated on it. The poll will come back near-unanimous for the better one. Then a secret, simultaneous, binding ballot to switch, requiring a supermajority of four-fifths. My prediction is that it fails, and that this is the moment the room feels the difference between individual preference and collective transition. I then want two alternative reform mechanisms tried after it, so participants can compare them: a staggered one, where a randomly chosen third of the room is privately told in advance that they will switch regardless, and a cascade one, where switching is allowed publicly, one player at a time, in silence, until someone declines.

  *Two colonies.* The room is split from the start into two groups that never see each other's play, face the same problem, and settle — I expect — on different regularities with different payoffs. At the end, their cumulative scores are compared and the losing group is asked to explain why they lost. I want them to run out of explanations that cite anyone's mistake.

  What I need from you is a runnable session, in this order: materials and setup; rules, stated as you would hand them to participants; a payoff scheme in points with the critical comparisons built into the numbers, together with a sentence on why each number is what it is; a minute-by-minute timeline across the ninety minutes, including what to do with the late arrivals; and a debrief that maps specific moments in play onto the four items above, saying what the facilitator should ask at each point and what answers to expect.

  Then, separately: a candid list of at least five things that will predictably go wrong the first time I run this — the player who talks, the player who tries to be clever, the player who opts out, the arithmetic error, the group that accidentally converges too fast — each with the intervention you'd make, distinguishing the ones worth stopping play for from the ones to let run. Then an honest account of which feature of the analysis the game cannot reproduce and which I will simply have to say out loud, in particular what is lost by banning speech, given that the phenomenon under study is itself the thing being banned. Finally, a short fallback plan for the realistic case that only eight people show up.

  Two closing constraints. Do not give me a reading list, citations, or titles to chase: I cannot check them and they are not what I need. And do not let the session become a survey of positions — I need one design, defended, that a colleague could run from your instructions alone in front of a paying audience six weeks from now.
reasoning: |-
  We are designing a serious game to convey the Lewisian analysis of convention. The core mechanics must illustrate: arbitrariness, expectation-dependence, inertia under universal discontent, and path dependence. We have three candidate mechanics: inheritance rule, mutiny ballot, and two colonies. We must choose one and reject two with explicit reasons.

  Rejecting two candidates:

  1. **The inheritance rule**: This mechanic tests whether the group can transmit a regularity to a newcomer without common knowledge. However, it may not effectively illustrate inertia under universal discontent or path dependence. The focus on transmission might overshadow the core elements we need to land, especially since the newcomer's lack of history might complicate the expectation-dependence for the existing players. Also, in a 90-minute workshop with possible late arrivals, removing and replacing players could be logistically messy and time-consuming. The silent coordination might be too abstract for participants with no background.

  2. **The mutiny ballot**: This directly addresses inertia under universal discontent by showing that even when everyone prefers a change, a supermajority vote might fail. It also allows for testing alternative reform mechanisms. However, it requires that the group first gets stuck in a suboptimal convention, which might not happen reliably. The setup is complex, requiring multiple stages (private poll, binding ballot, then two alternative mechanisms). In a short workshop, this complexity might eat up time and confuse participants. Also, it doesn't inherently illustrate path dependence at the population level.

  3. **Two colonies**: This mechanic naturally illustrates path dependence (two groups facing the same problem end up with different conventions and payoffs) and arbitrariness (each group settles on their own arbitrary solution). Expectation-dependence can emerge within each group. Inertia under universal discontent might be shown if one group is stuck with a worse convention but cannot switch easily. The comparison at the end can highlight that the losing group cannot point to mistakes. This mechanic is also modular: if one group converges too fast, the other might not, but the comparison still works. It is easier to run in parallel, saving time. Late arrivals can be added to a group without disrupting the flow. With no need for player removal or complex voting, it fits the tote-bag constraint.

  Therefore, we choose **Two colonies** and reject the other two.

  Now, designing the session around "Two colonies":

  **Materials and Setup**
  - A tote bag containing:
    - 20 identical small boards or stiff cards (about 5x8 inches) – one per player. If using cards, they must stand upright on the table.
    - A set of 40-50 identical tokens (e.g., colored chips, buttons, or even folded paper) – about 2-3 per player.
    - A deck of instruction cards (one for each player) and a facilitator cheat sheet.
    - Two opaque bags or containers (one for each colony).
    - A scoreboard (a large sheet of paper) to record cumulative scores for each colony.
    - Pens or markers for scoring.
    - Prizes: chocolate bars or silly certificates (optional).
  - Setup: Before participants arrive, set up two separate tables (or two distinct areas of one large table) about 10 feet apart. Place one bag/container and half the tokens at each table. Place the boards/cards and pens at each seat. Have the instruction cards ready to hand out.

  **Rules (as handed to participants)**
  *You are in a colony of settlers on a new planet. Each round, you will simultaneously choose to plant either BLUE or RED crops. Your choice and the choices of others in your colony will determine your harvest (points). There are three rounds per season, and we play three seasons (total 9 rounds).*

  *Rules:*
  1. *Each player has a board. At the start of each round, take one token and place it secretly on your board under BLUE or RED. Do not let others see.*
  2. *When everyone is ready, at the signal, reveal your token simultaneously.*
  3. *Scoring:*
     - *If you choose the MAJORITY color in your colony, you get 1 point.*
     - *If you choose the MINORITY color, you get 0 points.*
     - *BUT: If the majority color is chosen by EVERYONE in the colony, then everyone gets 2 points (a "perfect harvest").*
  4. *After each round, record your points on your board. The colony score is the sum of individual scores.*
  5. *Between seasons, we will pause for reflection. You may not speak during play; only during these pauses.*

  *Goal: Maximize your personal points. The colony with the highest cumulative score at the end wins a prize.*

  **Payoff Scheme and Critical Comparisons**
  - Choosing majority: 1 point. Why? This rewards conformity but not perfectly.
  - Choosing minority: 0 points. Why? Punishes deviation.
  - Unanimous majority: 2 points. Why? Creates a superior outcome that requires full coordination, making it a focal point but hard to achieve. This introduces the possibility of a better convention (unanimity on one color) that is hard to switch to if the colony is split.

  *Critical comparisons:*
  - The payoff for unanimous majority (2) vs. simple majority (1) creates an incentive to coordinate on one color, but the 1-point payoff for majority even without unanimity allows for stable non-optimal conventions (e.g., always 8 blue and 2 red, where blue gets 1 point and red gets 0, and no one can switch alone to get 2 because even if one red switches to blue, blue might not become unanimous). This sets up inertia.
  - The scoring is symmetric between blue and red – no intrinsic advantage. This ensures arbitrariness.

  **Minute-by-Minute Timeline (90 minutes total)**
  - **0:00 - 0:10 (10 min): Setup and Welcome**  
    - As participants arrive, direct them to sit at either table arbitrarily (or balance numbers if uneven). Hand out instruction cards. For late arrivals, assign them to the smaller colony or balance as they come.  
    - Explain the rules verbally, emphasizing: no talking during rounds, simultaneous reveal, and the scoring. Answer questions.  
    - Start with a practice round (not scored) to ensure understanding.

  - **0:10 - 0:35 (25 min): Season 1 (3 rounds)**  
    - Play three rounds. Each round:  
      - Players choose and place token secretly.  
      - Facilitator gives signal to reveal.  
      - Players calculate and record their own points. Facilitator circulates to observe and help with scoring if needed.  
    - After round 3, pause for reflection (2 min): Ask each colony to discuss (now allowed) what happened and why. Facilitator asks: "What pattern did you see? Did you coordinate? How?"  

  - **0:35 - 0:55 (20 min): Season 2 (3 rounds)**  
    - Play three more rounds. Same as above.  
    - After round 6, pause for reflection (3 min): Facilitator asks each colony: "Are you satisfied with your harvest? Could you do better? How?"  

  - **0:55 - 1:15 (20 min): Season 3 (3 rounds)**  
    - Play final three rounds.  
    - After round 9, pause (2 min): Each colony totals their individual scores and then the colony sum.  

  - **1:15 - 1:25 (10 min): Comparison and Debrief**  
    - Announce the cumulative scores for each colony. Ask the losing colony: "Why do you think you lost? Was it someone's fault?" (Expect them to say no one made mistakes; it just happened.)  
    - Then, reveal that both colonies had identical rules and starting conditions.  

  - **1:25 - 1:30 (5 min): Wrap-up and Prizes**  
    - Award prizes (e.g., chocolate to winning colony, or silly certificates to all).  

  **Debrief: Mapping to Lewisian Concepts**  
  - *After Season 1 reflection (arbitrariness)*: Ask: "How did your colony decide on a color? Was one color better?" Expect answers like: "We just started with what someone did," or "No reason, it happened." Point out: the choice was arbitrary; either color would have worked.  
  - *During play (expectation-dependence)*: Observe if players change their choice based on previous rounds. In debrief, ask: "Did anyone switch colors? Why?" Expect: "I thought others would choose X, so I did too." Highlight: your reason to conform depended on expecting others to conform.  
  - *After Season 2 reflection (inertia under discontent)*: If a colony has a split (e.g., 7-3), ask: "Would you prefer if everyone chose one color? Why didn't you switch?" Expect: "I wanted to, but I wasn't sure others would," or "If I switch alone, I might get 0." Point out: even if all want change, no one can switch alone.  
  - *At final comparison (path dependence)*: When the losing colony cannot explain their loss, note that both groups faced the same problem but ended with different outcomes, and the difference was due to the path taken, not mistakes or inherent superiority.  

  **Predictable Problems and Interventions**  
  1. *Player who talks during rounds*: Gently remind the room that silence is required. If persistent, make a general announcement without singling out. (Not worth stopping play unless it becomes widespread.)  
  2. *Player who tries to be clever*: E.g., always chooses minority to "test" the system. Intervention: Let them. Their low score will discourage others. In debrief, use it to show that deviating without coordination hurts.  
  3. *Player who opts out*: If someone stops playing, let them observe. Reassign their "choice" as abstention (0 points) to avoid affecting majority calculations.  
  4. *Arithmetic error*: Facilitator circulates during scoring to spot-check. If found, correct it immediately and explain.  
  5. *Group converges too fast*: If one colony achieves unanimous majority early, they might stick to it. This is fine; it shows the stability of a good convention. The other colony might not, allowing comparison.  

  **What the Game Cannot Reproduce**  
  - The phenomenon under study (convention) relies on common knowledge and communication, but we ban speech to simulate the "silent" emergence of norms. However, real conventions often involve communication. The game cannot fully show how conventions form with communication. Also, the game compresses time; real conventions evolve over repeated interactions. We lose the richness of verbal negotiation and the emergence of signals. Therefore, in debrief, state explicitly: "In real life, conventions often involve communication, but here we banned it to isolate the coordination problem. The flip in your reasoning when expectations change is the key."  

  **Fallback Plan for Eight People**  
  - Instead of two colonies of 9-10, have two colonies of 4. Adjust the payoff to maintain incentives:  
    - With 4 players, majority could be 3 or 4.  
    - Keep scoring: majority gets 1 point, minority 0. Unanimous majority (4 of one color) gets 2 points.  
    - The dynamics will be similar but faster. Increase the number of rounds per season to 4 to gather more data.  

  **Final Design**  
  The "Two Colonies" game, as described, is runnable, fits in a tote bag, and requires minimal materials. The debrief explicitly ties gameplay to the four Lewisian concepts. The payoff scheme creates the necessary tensions, and the timeline accounts for late arrivals by assigning them on the fly. The fallback for small groups is straightforward.
answer: |-
  ### Core Mechanics Brainstorm and Selection
  I'll start by evaluating your three candidate mechanics against the four learning objectives (arbitrariness, expectation-dependence, inertia under universal discontent, path dependence) and practical constraints (90 minutes, no tech, no specialized knowledge, silent play, tote-bag portability). 

  1. **The Inheritance Rule**  
     *Why it works conceptually*: Forces transmission of a regularity to a "stranger" with no history, testing common knowledge vs. mutual knowledge. Could highlight arbitrariness (if the group invents a new regularity) and expectation-dependence (if expectations shift during replacement).  
     *Rejection*: **Logistically fragile and misaligned with inertia/path dependence.** Removing players mid-game risks chaos with late arrivals, and inheriting scores creates fairness disputes. Crucially, it doesn't create universal discontent (the stranger may reset dynamics) or population-level path dependence (only one group). Silent transmission is elegant but too narrow—this feels like a specialized subtopic, not the core analysis.

  2. **The Mutiny Ballot**  
     *Why it works conceptually*: Directly targets inertia under discontent (failed ballot) and expectation-dependence (reasoning flip during reform attempts). The private poll reveals universal preference for change, and the failed vote creates "we can't switch" frustration.  
     *Rejection*: **Overly complex and prone to premature resolution.** Requires the group to first get "stuck" in a suboptimal convention—not guaranteed with naive players. The supermajority vote, staggered switch, and cascade mechanism could eat 30+ minutes alone. Worse, if the group accidentally coordinates optimally early, the ballot becomes meaningless. Silent play also undermines the reform phase (e.g., the cascade relies on public gestures).

  3. **Two Colonies**  
     *Why it works conceptually*: Best covers all four objectives. Arbitrariness (each colony could pick different conventions), expectation-dependence (individual choices hinge on predicting others), inertia (players stuck in suboptimal patterns despite discontent), and path dependence (groups with identical starts end with unequal outcomes). Comparing colonies makes path dependence visceral. Logistically robust: late arrivals join a colony, no mid-game disruptions.  
     **Selection**: **This is the strongest foundation.** I'll refine it into a runnable design, incorporating the best of your other ideas (e.g., silent play from inheritance, discontent polling from mutiny).

  ---

  ### Final Design: "COLONY HARVEST"  
  *Premise*: Two isolated groups ("colonies") of players farm crops (Blue/Red). Each round, they silently choose a crop color. Payoffs depend on group coordination. After multiple seasons, colonies compare scores, revealing path dependence.  

  #### Materials & Setup (Fits in a Tote Bag)  
  - **Player Kits (x20)**:  
    - 1 cardstock "field board" (5x8") with two pockets: "Blue" and "Red" (see image below).  
    - 3 identical tokens (e.g., wooden cubes or beads).  
    - 1 scorecard (small paper) with 9 round slots.  
  - **Facilitator Kit**:  
    - 2 opaque voting bags (one per colony).  
    - 2 large scoreboards (paper) for colony totals.  
    - Sticky notes for silent communication.  
    - Prizes: 5 chocolate bars (or silly certificates).  
  - **Setup**:  
    - Split room into two colonies (9-10 players each) at separate tables.  
    - Give each player a kit. Place a voting bag at each table.  
    - Late arrivals (up to 20 total): Assign to the smaller colony. If balanced, add to either. Give 30 seconds to scan rules.  

  #### Rules (Handout to Players)  
  > **YOUR GOAL**: Earn points by harvesting crops. Highest personal score wins chocolate. Your colony’s total score competes for glory.  
  >   
  > **HOW TO PLAY**:  
  > 1. **Seasons**: We play 3 seasons. Each season has 3 rounds (9 rounds total).  
  > 2. **Planting**: Each round, secretly place one token in your BLUE or RED pocket. *No talking or gestures.*  
  > 3. **Harvest**: When I say "REVEAL," show your token.  
  > 4. **Scoring**:  
  >    - If you chose the **MAJORITY** color in your colony, you get **1 point**.  
  >    - If you chose the **MINORITY** color, you get **0 points**.  
  >    - **BONUS**: If *everyone* in your colony chooses the **SAME** color, all get **2 points**.  
  > 5. **Record**: Mark points on your scorecard after each round.  
  > 6. **Between Seasons**: We pause. You may whisper *only* with your colony.  
  >  
  > **END GAME**: Personal points → chocolate. Colony points → read aloud.  

  #### Payoff Scheme & Critical Numbers  
  - **Minority choice: 0 points**  
    *Why*: Punishes deviation, making conformity rational if you expect others to conform.  
  - **Majority choice: 1 point**  
    *Why*: Baseline reward for coordination—but not optimal, incentivizing desire for unanimity.  
  - **Unanimous choice: 2 points**  
    *Why*: Creates a superior, Pareto-optimal outcome. The gap between 1 and 2 generates universal discontent if unachieved. Arbitrariness is embedded: Blue/Red are symmetric (no intrinsic advantage).  

  *Critical Comparisons*:  
  - If Colony A settles on 7 Blue / 3 Red each round:  
    - Blue choosers get 1 point (majority), Red get 0.  
    - All players see they *could* get 2 points if unanimous, but no one switches alone (risk of 0 if they abandon majority).  
  - Colony B might achieve unanimity (all get 2 points) through path-dependent luck.  

  #### Minute-by-Minute Timeline (Total: 90 min)  
  - **0:00–0:10 (10 min)**: Welcome and Setup  
    - Assign colonies, hand out kits. Read rules aloud. Answer questions.  
    - **Late arrivals**: Direct to a colony; give quick rules summary.  
  - **0:10–0:25 (15 min)**: Season 1 (Rounds 1–3)  
    - Rounds last 2 min each: 1 min to choose, 1 min to reveal/record.  
    - Facilitator circulates, ensures silence, helps with scoring.  
  - **0:25–0:30 (5 min)**: Reflection 1 (Whispering Allowed)  
    - Ask colonies: *"What happened? Any patterns?"*  
  - **0:30–0:45 (15 min)**: Season 2 (Rounds 4–6)  
    - Same as Season 1.  
  - **0:45–0:50 (5 min)**: Reflection 2 (Inertia Check)  
    - **Private Poll**: All players write on sticky note: *"If we could restart, which color would you want the whole colony to pick?"* Collect in voting bag. Tally secretly—expect near-unanimity for one color. *Do not share results yet.*  
  - **0:50–1:05 (15 min)**: Season 3 (Rounds 7–9)  
    - Play final rounds.  
  - **1:05–1:15 (10 min)**: Tally and Compare  
    - Players sum personal scores. Facilitator collects colony totals.  
    - Announce: *"Colony A: X points. Colony B: Y points."*  
  - **1:15–1:25 (10 min)**: Debrief (Guided Discussion)  
    - See next section.  
  - **1:25–1:30 (5 min)**: Prizes and Wrap-up  
    - Top 5 personal scores get chocolate. Read colony scores dramatically.  

  #### Debrief: Mapping Game Moments to Lewisian Concepts  
  1. **Arbitrariness** (After Season 1 Reflection)  
     - *Ask*: "How did your colony 'decide' on a color? Was Blue better than Red?"  
     - *Expected Answers*: "No reason—someone chose Blue first," or "It just happened."  
     - *Facilitator*: "Exactly. No inherent 'best' choice—the regularity was arbitrary. Red would have worked identically."  

  2. **Expectation-Dependence** (During Season 2 Play)  
     - *Ask*: "Did anyone switch colors mid-game? Why?"  
     - *Expected Answers*: "I chose Red because others did last round," or "I switched to Blue, hoping more would join."  
     - *Facilitator*: "Your reason changed based on expectations. If you expect conformity, conforming becomes rational—even if you dislike the color."  

  3. **Inertia Under Universal Discontent** (After Private Poll)  
     - *Ask*: "I tallied your restart preferences. Most of you wanted [Color]. Yet in Season 3, did you coordinate on it? Why not?"  
     - *Expected Answers*: "I wanted to switch, but I wasn’t sure others would," or "If I switched alone, I’d get 0 points."  
     - *Facilitator*: "Even with universal preference for change, no individual can switch profitably. Stability isn’t happiness—it’s mutual expectation."  

  4. **Path Dependence** (Final Comparison)  
     - *Ask losing colony*: "Why did you score less? Was it someone’s fault?"  
     - *Expected Answers*: "No—we just got stuck on Red," or "They coordinated better by luck."  
     - *Facilitator*: "Identical starting points, different outcomes. No mistakes—just path dependence. Small, random differences 'lock in' conventions."  

  ---

  ### Predictable Problems & Interventions  
  1. **Player who talks during silent rounds**  
     - *Likelihood*: High.  
     - *Intervention*: Pause play. Remind: "Silence keeps the experiment pure. Words change expectations." Not worth stopping unless persistent.  

  2. **Player who "hacks" the game** (e.g., always chooses minority)  
     - *Likelihood*: Medium (1-2 players).  
     - *Intervention*: Let it run. Their score suffers (0 points), illustrating deviation costs. Debrief: "Did anyone act against self-interest? Why?"  

  3. **Player who opts out** (e.g., stops participating)  
     - *Likelihood*: Low, but possible.  
     - *Intervention*: Assign them a "default choice" (e.g., always Blue). Don’t stop play.  

  4. **Arithmetic errors in scoring**  
     - *Likelihood*: High.  
     - *Intervention*: Spot-check scores during rounds. Correct quietly. Say: "Mistakes happen—focus on patterns, not perfect totals."  

  5. **Group converges too fast** (e.g., unanimity in Round 1)  
     - *Likelihood*: Low (requires luck), but possible.  
     - *Intervention*: Proceed. In debrief, contrast colonies: "One group locked in early—why? Salience of the first choice."  

  ---

  ### What the Game Cannot Reproduce  
  - **Loss of Communication Nuance**: Lewisian conventions often emerge through communication (e.g., proposals, focal points). Banning speech strips this out, making conventions feel more "mechanical" than real life.  
    - *Mitigation*: Explicitly state post-game: "Real norms use communication. Here, we silenced it to highlight how expectations alone drive conformity."  
  - **Lack of Incremental Evolution**: Conventions evolve through repeated interactions; the game compresses this into 9 rounds. Players may not feel the "weight" of history.  
    - *Mitigation*: In debrief: "In life, conventions solidify over time—like a path worn by footsteps. We simulated this in fast-forward."  
  - **Unrealistic Payoffs**: Real conventions involve social sanctions/rewards beyond points. The game’s 0/1/2 scheme is a simplification.  
    - *Mitigation*: Acknowledge: "Points represent broader incentives—like approval or efficiency."  

  ---

  ### Fallback Plan for 8 Players  
  - **Adjust Groups**: Two colonies of 4 players each.  
  - **Modify Payoffs**:  
    - Majority (3/4): 1 point  
    - Minority (1/4): 0 points  
    - Unanimous (4/4): 2 points  
  - **Streamline Timeline**:  
    - Reduce rounds to 6 (2 per season).  
    - Shorten reflections to 3 min each.  
  - **Why it Works**: Smaller groups converge faster, but inertia remains (e.g., 3-1 splits). Path dependence still evident in colony comparisons.  

  ---

  ### Final Notes  
  This design nails the Lewisian analysis:  
  - **Arbitrariness** emerges from symmetric payoffs and colony divergence.  
  - **Expectation-dependence** is felt when players switch colors based on prior rounds.  
  - **Inertia** crystallizes during the private poll—everyone wants change, but no one dares move.  
  - **Path dependence** hits hard when identical colonies face public score comparisons.  

  It’s reproducible (one-page instructions cover setup/rules/debrief), fits in a tote bag, and works with latecomers. Run it as-is, and you’ll give participants the *feel* of conventions—not just the theory.
