answer: |-
  Your inertness argument is sharp, and targeting the decision-theoretic angle against dialetheism is underappreciated. I'll engage brutally as requested—no citations, just arguing with the idea. Below, I address your questions directly, then flag where I think the core pressure points are. **Short verdict:** Your argument is *mostly* sound and not boring, but it risks begging the question in Step 1 and underestimates the no-detachment reply. Vagueness *is* the right test case, and this isn't a footnote—it forces dialetheists into a corner on applied gluts. But some exits are stronger than you think.

  ### 1. Is the inertness argument sound? Does it smuggle in classicism?
  **Mostly sound, but Step 1 is the weak link.** Your scoring method (summing squared errors against both 1 and 0) is the natural starting point, but it *does* subtly assume classicism by treating truth values as additive and separable. A dialetheist will scream that this misrepresents gluts: if P is *both* true and false, it’s not that there are two distinct "truthy" properties to average—it’s a *single* state with a contradictory character. Scoring twice implicitly treats the glut as two classical states mashed together, which is question-begging. 

  - **Why this isn’t fatal yet:** Even if you drop the summing, what’s the alternative? If the dialetheist says "score against the *glue* of the glut," they owe you a norm for how truth *should* constrain credence. They haven’t (convincingly) done this. If they say "truth doesn’t constrain credence at all," then gluts are inert by fiat—which is your point! So Step 1 holds unless dialetheism provides a positive account of accuracy for gluts. Without it, 1/2 is the only coherent credence (it avoids "double penalization" for deviating from both values). **Downstream impact:** If Step 1 falls, everything collapses. But it doesn’t fall easily—dialetheists lack a standard alternative. Your pushback note is correct: they’ll call adding errors "classical," but you can retort: "Fine, give me your *non*-classical scoring rule." If they can’t, inertness stands.

  ### 2. Ranking the exits: Which is strongest?
  From weakest to strongest (for the dialetheist):
  - **Weakest: Glutty practical verdict ("both choice-worthy and not").** This is a disaster for them. It doesn’t just make deliberation pointless—it *endorses* arbitrariness in the cases where guidance matters most (e.g., "Is this refugee? Let them in or not, whatever"). Worse, it risks normative explosion: if you’re criticizable for *not* acting when ¬A is true, but A is *also* true, then "criticizability" gluts proliferate. This isn’t just unhelpful—it collapses into absurdity unless they restrict deontic logic severely. Dialetheists avoid this for good reason.  
  - **Weak: Truth doesn’t constrain credence.** This is a surrender. If truth isn’t normative for belief, dialetheism becomes a purely syntactic toy. It guts their response to the "why care about truth?" objection. Some might bite this bullet, but it makes dialetheism philosophically toothless—especially for applied cases like vagueness where truth is supposed to *matter*.  
  - **Moderate: Non-classical probability (e.g., measures where P and ¬P both have measure 1).** This is clever but untamed. Yes, additivity fails, and you get upper/lower probabilities or similar. But as you note, decision rules like maximin or averaging upper/lower EU *still* mimic ignorance (maximin is ultra-cautious; averaging is 1/2 again). Worse, without a clear norm (e.g., "maximize lower expectation"), the agent has no guidance. This exit is all promise, no delivery—it doesn’t solve inertness, it just dresses it up.  
  - **Strong: Scope restriction (only paradox-driven gluts).** This is a strategic retreat. Dialetheists like Priest often fence off liar sentences from "ordinary" gluts. If they take this exit, your complaint is defanged—but they lose vagueness and other applied cases. That’s a huge cost! Vagueness is a flagship argument for dialetheism. If they retreat here, they concede dialetheism is irrelevant to real-world uncertainty. Strong *for them* because it preserves logic, but weak *philosophically*—it admits dialetheism is inert where it claims relevance.  
  - **Strongest: No-detachment reply (deontic conditionals don’t detach in paraconsistent settings).** This is the killer. In logics like LP, modus ponens fails for the material conditional—so if "If P, then A is obligatory" is true, and P is a glut, you *can’t* detach "A is obligatory." The obligation doesn’t "transfer." Your Step 3 assumes deontic verdicts inherit P’s glut, but if detachment fails, borderline vagueness might *not* yield conflicting obligations. For example, "If this is a refugee, they must be granted asylum" + glutty "this is a refugee" doesn’t entail a glutty obligation. This blocks your test case. **Why it’s strongest:** It’s technically solid in mainstream paraconsistent logics, doesn’t require moralizing gluts, and isolates the glut to semantics. If obligation stays classical, deliberation isn’t infected.  

  **Ranking:** No-detachment > Scope restriction > Non-classical probability > Truth-not-constraining > Glutty verdicts. Focus your 2k words on no-detachment—it’s the only exit that doesn’t implode or concede everything. But press hard: if detachment fails, how *do* gluts ever affect action? This might *still* imply inertness.

  ### 3. Is vagueness the right test case? What about moral/legal conflicts?
  **Vagueness is perfect—don’t switch.** Moral conflicts (e.g., "I ought to lie to save lives" vs. "I ought not lie") or inconsistent legal systems are tempting, but they’re red herrings. These aren’t *true gluts* by dialetheist lights—they’re consistent conflicts between obligations, not a single proposition being both true *and* false. Your inertness argument relies on the *semantic* property of gluts, not normative dilemmas. If you pivot here, you lose the core logic-pressure.  

  - **No-detachment sinks all cases equally.** Whether it’s vagueness ("is a vehicle"), moral conflict, or legal inconsistency, if the dialetheist invokes no-detachment to block glut-transmission, your Step 3 misfires. But that’s fine—it means your argument adapts: if gluts don’t transmit to obligations *because* of no-detachment, they’re *still* inert in deliberation. Vagueness remains the best because it’s a dialetheist go-to for "innocent" gluts (unlike the liar). If no-detachment saves them, it does so by admitting gluts don’t guide action.  

  ### 4. Is this interesting or a footnote?
  **It’s interesting and novel—not a footnote.** Dialetheists have stock replies for logical costs (e.g., "DS is overrated" or "use shrieking rules for consistency"), but they rarely engage decision theory. The closest existing objection is "Why avoid gluts if they’re true?" but that’s about belief-revision, not deliberation. Your inertness argument pins them on their *practical* promises—especially for vagueness, where they claim gluts solve the sorites by making borderlines "both." If gluts don’t improve guidance over ignorance, that’s a problem.  

  - **Stock answer you’ll get (and how to counter):** They’ll say, "Gluts aren’t *supposed* to guide action—they’re semantic facts. Deliberation uses consistent sub-theories." *Counter:* Then why push dialetheism for vagueness? If borderlines are gluts but we deliberate classically, nothing changes from epistemicism. You’ve collapsed the view. Or they’ll say, "Use non-classical probability!" *Counter:* As above, it defaults to ignorance-mimicking rules. Your argument forces them to either (a) abandon applied gluts, (b) admit gluts are inert, or (c) build a decision theory that doesn’t exist. That’s progress.

  ### 5. Technical errors: LP vs. relevant logics
  You’re blurring the logics, and it matters. **Key clarifications:**
  - **LP (Priest’s logic):** Has a material conditional that *doesn’t detach* (modus ponens fails). Here, no-detachment is a live exit. Deontic rules won’t transmit gluts.  
  - **Relevant logics:** Often have a stronger conditional that *can* detach, even for gluts. But they avoid explosion by restricting *which* conditionals detach. Here, your Step 3 transmission *might* work—but relevant logics are less commonly used for deontic logic due to complexity.  
  - **The conflation risk:** In Step 3, you assume deontic verdicts inherit gluts "in the usual way." But in LP, the "usual way" for conditionals *blocks* detachment. In relevant logics, it might not, but then explosion threats resurface. Be explicit: if you’re assuming LP (the dialetheist standard), no-detachment is a real threat to your test case. If you’re assuming a relevant logic, you need to show detachment holds for deontic conditionals—which is messy.

  ### Overall Brutal Assessment
  **Where you’re wrong:** Step 1’s scoring *is* classically loaded, and no-detachment *is* a serious escape hatch. You can’t dismiss it.  
  **Where you’re boring:** Only if you linger on credence. The fresh part is Step 2–3: showing that *even if* credence is 1/2, decision rules collapse to ignorance, and this nullifies dialetheism’s value in applied cases.  
  **Where you beg the question:** In Step 1 (scoring assumes truth values are separable) and Step 3 (assuming deontic gluts transmit without addressing detachment).  
  **What to do:**  
  - Defend Step 1 by emphasizing the dialetheist’s burden: if they reject summing errors, they need an accuracy norm for gluts. Without one, 1/2 wins.  
  - Spend 80% of your reply on no-detachment. Argue that even if it blocks deontic gluts, it admits gluts are "quarantined" and don’t improve deliberation. Vagueness gluts become idle wheels.  
  - Don’t drop this—it’s a real problem for dialetheism. But tighten the logic: specify you’re targeting LP, and force them to either embrace inertness or build something new.  

  This could be a strong 8k-word paper. The decision-theoretic angle is underexplored and hits dialetheism where it’s weakest: its practical relevance.
