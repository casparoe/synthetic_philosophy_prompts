  For Step 2, decision rules: averaging gives the same as ignorance, maximin is overly cautious. Both resemble responses to ignorance. If the dialetheist says "both acts are permissible," that avoids normative collapse but abandons guidance in borderline cases—exactly where guidance is needed.

  Step 3's test case: vagueness. The user worries about deontic detachment. If obligation doesn't transmit due to paraconsistent conditionals, then gluts don't affect obligations. But that might concede the point—gluts still don't guide action. Legal/moral conflicts might be better examples, but detachment issues persist. Vagueness remains strong because it's a key motivator for applied dialetheism.

