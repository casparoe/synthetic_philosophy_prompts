  - **Truth doesn't constrain credence**: Makes truth normatively inert, which dialetheists might accept but at a cost.
  - **Non-classical probability**: Proposals exist but aren't mature. Leads to decision rules like maximin, mimicking ignorance.
  - **Scope restriction**: Limits dialetheism to paradoxes, avoiding the problem but conceding applied gluts.

  Ranking: No-detachment and scope restriction are strongest. The former is technical and hard to dispute; the latter is a strategic retreat. Non-classical probability is promising but underdeveloped.

