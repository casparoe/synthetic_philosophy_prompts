  We are moderating an adversarial collaboration between Camp A (geometric rationality, time-average growth) and Camp B (expected utility). The goal is a signed document with agreed claims, a disagreements table, and cruxes with concrete cases.

  ## Agreed Claims (Math and Scope)

  1. **Long-run growth for multiplicative wealth**: For a single agent with wealth \( W_t \) compounding multiplicatively over an infinite sequence of independent, identical bets, the asymptotic growth rate is \( \lim_{T \to \infty} \frac{1}{T} \log W_T \) almost surely. If the agent bets a fixed fraction \( f \) of wealth each round, this limit equals \( G(f) = \mathbb{E}[\log(1 + f \cdot X)] \), where \( X \) is the random net return per unit bet (so if you bet 1 unit, you gain \( X \) with \( \mathbb{E}[X]>0 \)). Maximizing \( G(f) \) maximizes the long-run growth rate.

  2. **Ruin as an absorbing state**: If the agent can go bankrupt (wealth ≤ 0) with positive probability and ruin is absorbing (no further bets, wealth remains 0), then for any fixed fraction \( f \) that leads to ruin with positive probability, \( G(f) = -\infty \). Hence, the log-optimal strategy avoids ruin almost surely if that is possible (i.e., if there exists a fraction that does not lead to ruin).

  3. **Stochastic stake vs. fixed fraction**: 
     - If an agent randomizes the fraction \( f_t \) independently each round (from a fixed distribution) and bets \( f_t \cdot W_{t-1} \), then the growth rate is \( \mathbb{E}_f[\mathbb{E}_X[\log(1 + f \cdot X)]] \), which by Jensen's inequality (applied to the concave function in \( f \) for fixed \( X \)) is less than or equal to \( G(\bar{f}) \) where \( \bar{f} = \mathbb{E}[f] \), and strictly less if the function is strictly concave and \( f \) is non-degenerate. Thus, randomizing the stake each round leads to a strictly lower growth rate than committing to the fixed fraction \( \bar{f} \), unless the optimal strategy is already to randomize (which it isn't in the standard setting).

  4. **Parallel sub-bankrolls**: 
     - If the agent splits her capital into \( k \) independent sub-bankrolls, each betting a fixed fraction \( f_i \) on the same repeated bet (with outcomes independent across sub-bankrolls and rounds) and recombines after \( T \) rounds, then the total wealth \( W_T \) is the sum of the sub-bankrolls. By the law of large numbers, as \( k \to \infty \), the growth rate per round of the total portfolio converges to \( \mathbb{E}_X[\log(1 + f \cdot X)] \) where \( f \) is the fraction of each sub-bankroll (if all \( f_i = f \)) and the expectation is taken over the bet outcome. However, for finite \( k \), the growth rate is not exactly the same as that of a single bankroll. But asymptotically in \( T \), the growth rate of the total wealth is the same as that of each sub-bankroll because the total wealth is a sum of independent multiplicative processes. Specifically, the log growth rate is \( \frac{1}{T} \log \left( \sum_{i=1}^k W_T^{(i)} \right) \). Since each \( W_T^{(i)} \) grows at rate \( G(f_i) \), the sum's growth rate is the maximum of the individual \( G(f_i) \) (if they differ). However, if all \( f_i = f \), then the growth rate of the total is still \( G(f) \), same as one bankroll. Moreover, if we let \( k \) be fixed and \( T \to \infty \), the growth rate of the total wealth is still \( G(f) \). Therefore, splitting into parallel sub-bankrolls (with the same fixed fraction) does not change the asymptotic growth rate compared to a single bankroll. But note: if the fractions differ, the total growth rate is the maximum of the individual growth rates (by the same argument as for a single bankroll with multiple assets).

  5. **Scope of each theory**:
     - Camp A: Their theory is primarily for decision problems involving repeated bets (or investments) over a long (ideally infinite) horizon, where the agent's wealth compounds multiplicatively. They focus on the asymptotic growth rate as the key criterion.
     - Camp B: Expected utility theory (EUT) is a general theory for one-shot and repeated decisions under uncertainty. It can be applied to any horizon and does not require compounding. The utility function can be chosen arbitrarily (e.g., log, linear, quadratic, etc.), and the optimal strategy maximizes expected utility.

  ## Disagreements Table

  | Disagreement | Camp A's Statement | Camp B's Statement |
  |--------------|-------------------|-------------------|
  | **Optimality criterion** | For an agent who will face a long sequence of multiplicative bets, rationality requires maximizing the asymptotic growth rate of wealth (i.e., maximizing the expected logarithm of wealth per bet). Any other criterion (like expected wealth) leads to almost sure suboptimality in the long run. | Rationality is about maximizing the expectation of a utility function that represents the agent's preferences. The log utility function is one choice among many, appropriate for some goals (like avoiding ruin) but not necessarily for others. The growth-rate argument does not justify log as the only rational choice; it is a special case of EUT. |
  | **One-shot vs. repeated** | Even for a finite number of bets, the growth-rate criterion is the correct extension of the infinite-horizon idealization because it is the only way to ensure survival and growth in a sequence of bets. | For a known finite horizon, the geometric growth story does not apply. The agent should maximize expected utility for the final wealth, which may not be the log utility. For example, if the agent has a linear utility, they should maximize expected wealth. |
  | **Ruin aversion** | The log utility naturally encodes ruin aversion: it goes to -∞ as wealth goes to 0. Any utility function that does not do so (like linear) will accept a risk of ruin that is too high. | Ruin aversion can be captured by any utility function that is bounded below and goes to -∞ at 0 (if ruin is absorbing). Log is one example, but not the only one. The degree of ruin aversion can be tuned by the utility function. |

