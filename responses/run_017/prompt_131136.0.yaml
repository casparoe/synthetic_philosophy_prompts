prompt: |-
  Hey — I'm in the first year of an MPhil and have to hand in a dissertation prospectus by the end of next month. The thesis itself would be about 15,000 words, written between roughly March and October, and my supervisor has said (unhelpfully) that he'll support anything as long as the question has a determinate answer and I can finish it. I keep circling back to the old statue-and-the-clay problem and I'd like to build the prospectus around it, but not in the form it usually gets discussed in.

  Here's the half-formed thought I can't get straight. Every version of the debate I know seems to smuggle in what I'd call a matter-first bias: we're given a statue and the lump of clay it's made of, and the lump is quietly treated as the metaphysically basic occupant of that region — the thing that was already there before the sculptor showed up, the thing that survives squashing, the thing whose identity conditions are the demanding ones — so the whole question becomes how the statue relates to it. Identical to it? Merely constituted by it without being the same thing? A second object coinciding with it? A stage or temporal part of something longer-lived? But there are loads of artifact-ish objects where nothing like that holds, because there's no privileged stuff they're made of and no pre-existing portion of matter that got arranged: a piece of software that's been ported between languages, a committee whose members all turn over, a chess opening that gets named and then refined across decades, a fictional character who turns up under different descriptions in different novels. For those, the "what is it made of" question looks downstream of the identity question rather than upstream of it. So what I want to know is what happens to the constitution puzzle if you start from cases like those instead of from clay. Does the same pressure to posit two coinciding things — one with relaxed identity conditions, one with fussy ones — reappear, or does it evaporate? And if it evaporates, what does that tell us about the classic case: was it ever really about constitution, or was it about something else that clay happens to hide, like our practices for counting and reidentifying artifacts over time?

  My two worries are that this is either just the standard three or four positions with new examples bolted on, or that it's secretly three different questions I'd spend 15,000 words conflating. So what I need is an actual prospectus, not encouragement. Pin down a single question that's genuinely open and that someone could fail to answer; say which of the usual options it presses hardest on — coincidence, constitution-without-identity, mereological essentialism, the perdurantist treatment, the sortal/conventionalist deflation of the whole thing — and why those don't already settle it; say what I'd actually do, chapter by chapter and roughly month by month, and why that method rather than the obvious alternatives (e.g. just running the standard arguments on the new cases, or doing a straight survey); and be explicit about what the thesis would have established if it works and what would count as it having failed, including the possibility that the honest upshot is "the clay case was never a case of constitution in the first place." Also be straight with me about where this would blow past 15,000 words. And please skip any bibliography or literature review with names and dates attached — I'll fill those in myself, and I'd rather the argument stand up without them.
reasoning: |-
  Okay, let's start by really unpacking what the user is asking for. They're in the first year of their MPhil and need to hand in a dissertation prospectus soon. Their supervisor is supportive but vague, only emphasizing that the question must have a determinate answer and be feasible within the timeframe. The user is circling around the statue-and-clay problem but wants to approach it from a fresh angle. 

  First, their core idea: they notice a "matter-first bias" in the classic debate. The lump of clay is treated as the basic entity, and the statue is secondary. But they point to examples like software, committees, chess openings, and fictional characters where there's no pre-existing material. In these cases, identity isn't determined by underlying matter. So their central question is: if we start with these "matter-indifferent" cases, does the constitution puzzle still hold, or does it dissolve? And if it dissolves, what does that reveal about the original statue-clay problem?

  Their worries are important. They don't want to just rehash existing positions with new examples, nor do they want to conflate multiple issues. They need a focused, feasible thesis question that's genuinely open. They also need a clear plan: chapters, timeline, methodology, success/failure conditions, and word count management.

  Breaking this down:
  - **The Core Insight**: The user's observation about matter-first bias is sharp. The literature does often take the lump as primary. Their alternative cases are well-chosen because they lack a privileged material base. The philosophical payoff could be significant: if the constitution problem vanishes without matter, then maybe it was never about constitution per se but about how we conceptualize artifacts versus material objects.
    
  - **Feasibility Check**: 15,000 words from March to October is tight. The proposal must be narrow enough to avoid sprawl. Focusing on *one* alternative case (e.g., fictional characters) as a lens is smarter than tackling all four. It allows depth without getting lost.

  - **Methodology Risk**: The user is wary of just reapplying old arguments to new examples. So the method can't be a mechanical "run standard views on software/committees." Instead, the contrastive approach—using matter-indifferent cases to *diagnose* why the clay case feels puzzling—is more original. It shifts the debate from "what is constitution?" to "why does matter make us *think* in terms of constitution?"

  - **Stakes for Existing Views**: The proposal must specify which theories it challenges. For example:
    - Coincident entities (e.g., Baker): Why posit two things if matter-indifferent cases work fine with one?
    - Conventionalism (e.g., Hirsch): Does matter-intensiveness make artifact identity *more* conventional?
    - Perdurantism: Can temporal parts handle matter-indifferent persistence without stages? 
    The user’s cases pressure these views by showing persistence without material continuity.

  - **Failure Conditions**: The user is admirably rigorous here. Success isn’t just "I argued X"—it’s whether the diagnosis holds. Failure could mean: 
    - The cases *do* still generate coincidence puzzles (e.g., a committee might coincide with its current members).
    - The clay case’s puzzles reduce to something unrelated to matter (e.g., vagueness).
    - The project reveals the statue/clay isn’t about constitution but about, say, grounding or essence.

  - **Word Count**: Biggest risks are Chapter 2 (lit review) ballooning, or Chapter 4 (diagnosis) becoming too speculative. Keeping Chapters 1 and 3 lean is key. 

  **Synthesizing the Prospectus**:
  - **Question**: "Does the persistence of matter-indifferent artifacts avoid coincidence puzzles, and what does this imply about the material basis of constitution?"  
  - **Target**: Hits coincidence theories hardest by showing their motivation (material continuity) isn’t necessary for persistence. Challenges deflationary views if they still rely on matter.
  - **Method**: Not survey or reapplication, but *dialectical contrast*: using matter-indifference to expose hidden assumptions in matter-based cases.
  - **Originality**: Not new examples for old theories, but using asymmetry to reframe the debate’s foundations.
  - **Plan**: Tight timeline, iterative drafting with supervisor feedback to avoid rabbit holes.
  - **Upshot**: If successful, shows the statue/clay puzzle stems from overprivileging matter; if not, reveals deeper complexities in persistence.

  **User’s Unspoken Needs**:  
  They’re likely feeling urgency and uncertainty. The supervisor’s vagueness might leave them craving structure. They need validation that their idea isn’t trivial but also a realistic scaffold. The prospectus must feel like a map they can follow, not just an interesting thought. Emphasizing feasibility—concrete chapters, clear milestones—addresses this anxiety. Also, naming failure conditions (e.g., "if I find committee members *are* like clay") preempts "is this worth it?" doubts.
answer: |-
  Here’s a stripped-down, actionable prospectus designed to meet your constraints. It targets a specific gap, avoids conflation, and builds directly on your insight about "matter-indifference." The core move: **use matter-indifferent artifacts (MIAs) to test whether material constitution is necessary for generating coincidence puzzles.**

  ---

  ### **Dissertation Prospectus: Title TBD (e.g., "Constitution Without Matter: Artifacts and the Evaporation of Coincidence")**  
  **Core Question:** *Does the persistence of matter-indifferent artifacts (e.g., software, fictional characters) generate the same pressure to posit coincident objects as materially constituted artifacts (e.g., statues), and if not, what does this asymmetry reveal about the metaphysical foundations of the constitution problem?*  

  ### **Why This Question is Open and Non-Trivial**  
  - **It presses hardest on coincidence theories** (e.g., Baker, Lowe) and **deflationary conventionalism** (e.g., Hirsch, Sidelle).  
  - **Unsettled by existing work:**  
    - Coincidence theorists (who posit two objects) rely on *material persistence* as the "demanding" identity condition (the clay) vs. artifact flexibility (the statue). But MIAs lack a material "anchor" – so where is the second object? If there’s no pressure for coincidence, this suggests coincidence is *parasitic on matter*, not a universal feature of persistence.  
    - Conventionalists argue coincidence puzzles dissolve under context-sensitive identity conditions. But MIAs make convention *more salient* (e.g., "Is Python v2 the *same program* as Python v3?" relies on community practice). If MIAs *still* avoid coincidence, it weakens the need for conventionalism to resolve matter-based puzzles.  
    - **Perdurantism** and **mereological essentialism** are less directly targeted but would need radical reformulation to handle MIAs without matter.  
  - **Not just new examples:** Existing literature treats MIAs as marginal (e.g., "social objects"). Your focus flips the script: **if matter-intensiveness is what *drives* coincidence puzzles, then the statue/clay problem isn’t about "constitution" per se but about the metaphysics of matter.**  

  ### **What You’ll Do (Chapter Plan + Timeline)**  
  **Method:** *Contrastive analysis* – not surveying theories or reapplying old arguments, but systematically comparing persistence conditions in matter-based vs. matter-indifferent cases to isolate matter’s role. Avoids conflation by treating MIAs as a control group.  

  - **Chapter 1: The Matter-First Bias and Its Discontents** (March-April)  
    - Diagnose the tacit privileging of matter in classic puzzles (statue/clay, ship of Theseus).  
    - Argue that this bias conflates two issues: (a) persistence through part-replacement vs. (b) persistence through *material discontinuity*.  
    - **Output:** Framing the asymmetry – MIAs stress (b) without (a).  

  - **Chapter 2: Matter-Indifferent Artifacts – A Typology** (April-May)  
    - Analyze 2-3 paradigmatic MIAs (e.g., software, fictional characters). Focus on:  
      - Criteria for diachronic identity (e.g., functional continuity for software, narrative role for characters).  
      - Absence of a "privileged stuff" (no equivalent to clay).  
      - How identity is retroactively applied (e.g., "Python" as a unified entity across versions).  
    - **Output:** Rigorous persistence conditions for MIAs, showing identity is settled *without* material constitution.  

  - **Chapter 3: Testing the Coincidence Pressure** (June-July)  
    - Apply classic coincidence scenarios to MIAs:  
      - *Squashing:* If a fictional character is "erased" from all canon, is there a "narrative residue" coinciding with it? (No – it just ceases to exist.)  
      - *Reassembly:* If a software project is deleted then rewritten from specs, is it identical to the original? (Community-dependent, but no "coincident codebase".)  
    - Contrast with matter-based cases where coincidence seems unavoidable (e.g., clay survives squashing, statue doesn’t).  
    - **Output:** MIAs show no intuitive pull toward coincident entities. Pressure arises only when matter is present.  

  - **Chapter 4: Implications – What the Clay Was Hiding** (August-September)  
    - Argue that the statue/clay puzzle stems from *matter’s persistence constraints* conflicting with *artifact identity conditions* – not "constitution" as a universal relation.  
    - Strong conclusion: **The constitution problem is an artifact of material ontology.** Without matter, "coincidence" lacks motivation.  
    - Weak conclusion: **Matter intensifies conventional/sortal relativity** – but MIAs show this relativity exists without coincidence.  
    - **Output:** A deflationary account: coincidence puzzles are *matter-specific*, not general metaphysical problems.  

  - **Chapter 5: Coda – Beyond Artifacts?** (September)  
    - Brief discussion of non-artifact MIAs (e.g., biological species) to suggest wider relevance.  
    - **Output:** Speculative but bounded – flags avenues for future work.  

  ### **Thesis Work Plan (March-October)**  
  - **March:** Draft Chap 1 + detailed outline (supervisor feedback).  
  - **April:** Research/Chap 2 draft.  
  - **May:** Chap 2 final + Chap 3 draft.  
  - **June:** Chap 3 final + Chap 4 draft.  
  - **July:** Chap 4 final + Chap 5 draft.  
  - **August:** Revise Chaps 1–3.  
  - **September:** Revise Chaps 4–5 + intro/conclusion.  
  - **October:** Polish, submit.  

  ### **Success/Failure Conditions**  
  - **Success =** Demonstrating that:  
    - MIAs persist without generating coincidence intuitions.  
    - This asymmetry undermines the necessity of coincidence for matter-based artifacts.  
    - Thus, the statue/clay puzzle is primarily about matter’s metaphysical role, not "constitution."  
  - **Failure =** If either:  
    - Coincidence pressures *do* arise for MIAs (e.g., "the software coincides with its abstract structure").  
    - The asymmetry is trivial (e.g., MIAs are "abstract" and thus irrelevant to concrete objects).  
    - Matter is shown to be incidental (e.g., puzzles reduce to generic vagueness).  
  - **Honest negative result:** "The clay case was never about constitution; it was about [matter/convention/persistence]." (Still valuable!)  

  ### **Word Count Risks**  
  - **Chapter 2 (Typology)** could balloon if over-extended. **Mitigation:** Analyze only 2–3 MIAs (e.g., software + fictional characters).  
  - **Chapter 3 (Testing)** risks becoming a catalog of cases. **Mitigation:** Focus on 1–2 stress tests per MIA (e.g., "squashing" for characters, "reassembly" for software).  
  - **Chapter 4 (Implications)** may invite overreach. **Mitigation:** Target specific theories (coincidence/conventionalism) and avoid grand metaphysics.  

  ---

  **Why this works:** It’s a single, sharp question with a clear target (coincidence theories), a method that avoids survey/reapplication pitfalls (contrastive analysis), and a feasible scope (MIAs as a lens). The 15k limit is tight but doable if Chapters 2–3 stay focused. Crucially, it turns your half-formed thought into a *testable hypothesis* about the role of matter in generating metaphysical puzzles.
