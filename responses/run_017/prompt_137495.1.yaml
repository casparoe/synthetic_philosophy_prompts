prompt: |-
  Our town's little historical society asked me to help write the copy for a 1914 exhibit — the wall panel, the handout for school groups, that kind of thing — and I've been stuck for a week on one sentence: who gets blamed for the war. I wrote "Germany bears the main responsibility"; my co-volunteer, whose family came over from Bavaria, crossed it out and put "Europe's governments blundered into it together." We're at a stalemate now, and the more I read about the huge fight among German historians back in the 1960s, the less sure I am what a sentence like that is even supposed to *do*.

  So before I touch the panel again, give me the spec. What would a theory of "which country is responsible for this war" have to deliver in order to be good enough to print for a general audience? I want the requirements with the case behind each one: the cases it has to get right (a war that several powers could each have stopped on their own; a government that shoves its ally into one; populations who cheered in August and were getting drafted by October); the distinctions it can't collapse (brought about vs. foresaw vs. chose vs. could have done otherwise; the cabinet vs. the state vs. the voters; blame as a slice of one fixed pie vs. each party's own counterfactual contribution); and the things it must not be hostage to, like whose archives happened to get captured and whose got burned.

  Three things I care most about: (1) whether any two plausible requirements can't both be met — my guess is something like "blame has to track what people could realistically have done otherwise" against "blame can attach to a whole nation and not just its leaders," but you tell me; (2) which single requirement does the most work in killing off the usual candidates; (3) whether a theory that satisfies your list would have anything left to say to descendants — does "Germany started it" tell my friend's grandkids to feel anything, or is the whole exercise only about what gets printed in textbooks? Also mark which demands on your list are genuine and which are just what one camp happens to like. Then a couple of lines each on how the three standard stories do: chiefly Germany, everyone sleepwalked, and "it was the arms races and the empires, not countries."
reasoning: |-
  Okay, the user is working on a historical society exhibit about World War I and is stuck on how to assign responsibility for the war. They wrote that Germany bears the main responsibility, but their co-volunteer from Bavaria disagreed, suggesting it was a collective blunder. Now they're at a stalemate. They want a set of criteria for a theory of war responsibility that's suitable for a general audience. 

  The user is clearly deep in research, mentioning the 1960s German historians' debate (the Fischer Controversy) and showing nuanced understanding of concepts like counterfactuals and the distinction between different levels of responsibility. They're not just looking for a simple answer but a framework to evaluate any claim about war guilt. Their frustration is palpable—they've been stuck for a week, and the historiography has made them doubt the very purpose of such a sentence.

  Their core needs are: 
  1) **Practical Resolution**: They need a defensible sentence for the exhibit that won't spark internal conflict or mislead the public. 
  2) **Intellectual Rigor**: They want criteria that hold up against historical complexity—like the fact that multiple powers could have stopped the war, or the difference between "foreseeing" and "choosing" war. 
  3) **Ethical Awareness**: They’re sensitive to how blame affects descendants (e.g., their Bavarian co-volunteer’s family) and question if assigning blame is even productive.  

  The unspoken tension here is between *historical accuracy* and *social cohesion*. The user’s initial draft ("Germany bears main responsibility") leans toward scholarly consensus (especially post-Fischer), but their co-volunteer’s pushback reflects how war guilt narratives can feel personal or reductive. The user’s mention of "what gets printed in textbooks" hints they suspect this might be a zero-sum game: either oversimplify or say nothing useful.  

  For the specs, I should avoid taking sides and instead focus on what makes a claim *fit for purpose* in a public exhibit. Key angles:  
  - **Audience**: General public/school groups → needs clarity, avoids academic jargon.  
  - **Context**: A historical society → should acknowledge debate without drowning visitors in historiography.  
  - **Stakes**: Potentially divisive (e.g., Bavarian co-volunteer’s reaction) → must balance truth with empathy.  

  The user’s three focus areas tell me where to drill down:  
  1. **Conflicting requirements**: They intuit tension between "blame tied to realistic alternatives" (individual agency) and "blame applied to nations" (collective responsibility). This is real—e.g., holding "Germany" responsible risks implying all Germans wanted war, which isn’t true.  
  2. **Most decisive requirement**: Probably "agency + alternatives." If a power *could* have easily prevented war but didn’t, that’s stronger blame than one reacting to constraints.  
  3. **Relevance to descendants**: This is thorny. A good theory should distinguish between *historical accountability* (what states did) and *moral inheritance* (what descendants feel). The latter isn’t the exhibit’s job.  

  For the three standard narratives:  
  - **"Germany chiefly responsible"**: Strong on agency (e.g., blank check to Austria) but weak on counterfactuals (e.g., Russia’s mobilization escalated it).  
  - **"Sleepwalking"**: Captures institutional failures but downplays choices (e.g., Austria *chose* harsh ultimatum).  
  - **"Systems, not countries"**: Evades "blame game" but may feel too abstract; also, systems are run by people.  

  The solution might be a sentence that names key actors’ roles without aggregating into "main responsibility." Example: "European governments, particularly those of Austria-Hungary and Germany, pursued aggressive policies in July 1914 that turned a regional crisis into a continental war—though all major powers had opportunities to halt the escalation." This meets specs by:  
  - Naming specific actors (avoids vagueness).  
  - Using "pursued" (implies agency).  
  - Acknowledging shared chances to stop it (counterfactuals).  
  - Not quantifying blame ("main responsibility" is omitted).  
  And it sidesteps making descendants feel accused by focusing on *governments*, not nations.
answer: |-
  Here’s a specification for your sentence, designed for a **public-facing historical exhibit**, balancing accuracy, nuance, and educational purpose. The criteria are rooted in historiographical best practices, ethical responsibility, and the realities of public communication.  

  ### Core Requirements for a "Responsibility" Statement  
  *(Genuine demands based on scholarship/public ethics)*  
  1. **Acknowledge Agency + Alternatives**  
     *Case*: Must show that key actors had realistic chances to avoid war (e.g., Germany *could* have restrained Austria-Hungary; Russia *could* have delayed mobilization; Britain *could* have clarified its stance earlier).  
     *Why*: Blame requires feasible alternatives. Without this, history becomes deterministic.  

  2. **Distinguish Between Actors**  
     *Case*: Must separate:  
     - **Governments/Cabinets** (e.g., Austro-Hungarian leaders issued an unacceptably harsh ultimatum to Serbia)  
     - **Broader Systems** (e.g., militarism, alliance networks)  
     - **Populations** (e.g., cheering crowds ≠ desiring total war).  
     *Why*: Conflating "Germany" with all Germans ignores internal dissent and elite decision-making.  

  3. **Reject Monocausal Narratives**  
     *Case*: Must not imply one actor alone *caused* the war when multiple powers escalated crises (July 1914 had 5+ key decision points).  
     *Why*: Archives confirm all Great Powers made fateful choices. No single "on/off switch" existed.  

  4. **Address Both Spark and Fuel**  
     *Case*: Must cover short-term triggers (Austria-Hungary/Germany in July 1914) *and* long-term accelerants (arms races, colonial tensions, inflexible war plans).  
     *Why*: Focusing only on July ignores why the system was primed for war; focusing only on structures ignores pivotal choices.  

  5. **Center Human Fallibility, Not Inevitability**  
     *Case*: Must emphasize miscalculation (e.g., Germany underestimating British entry; Russia overestimating mobilization speed).  
     *Why*: Avoids fatalism; reinforces that better decisions *could* have prevented war.  

  6. **Survive Asymmetrical Evidence**  
     *Case*: Must not rely solely on archives from one side (e.g., German documents are abundant; Serbian/Austrian records are fragmentary).  
     *Why*: Ensures conclusions aren’t artifacts of preservation bias.  

  ---

  ### Tensions Between Requirements  
  - **"Agency vs. Collective Blame" IS the Core Conflict**:  
    - *Agency* (Req. 1) demands identifying *specific actors* who chose escalation.  
    - *Collective frameworks* (e.g., "systems" or "alliances") diffuse blame but risk vagueness.  
    - **Resolution**: Name key decision-makers ("German/Austro-Hungarian leaders escalated in July") while contextualizing their choices within systemic pressures.  

  ---

  ### Most Powerful Requirement  
  **#1 (Agency + Alternatives)** kills the weakest narratives:  
  - Exonerates "inevitability" theories (sleepwalking, systems).  
  - Challenges "sole guilt" claims (no one power blocked *all* paths to peace).  
  - Forces focus on *who* had options *when* (e.g., Austria-Hungary/Germany had the clearest chances to halt escalation early).  

  ---

  ### Relevance to Descendants  
  - A theory meeting these specs **does not assign collective guilt to modern people**.  
  - It clarifies:  
    - **Accountability** → Specific past governments made reckless choices.  
    - **Legacy** → These choices reshaped borders, identities, and trauma.  
  - "Germany started it" tells descendants *nothing* actionable. A nuanced account might instead say: *"Understanding how leaders gambled with peace reminds us that diplomacy requires wisdom, not just resolve."*  

  ---

  ### Assessment of Standard Narratives  
  1. **"Germany Bears Main Responsibility"**  
     - *Strengths*: Highlights agency (Blank Check, Schlieffen Plan).  
     - *Fails*: Req. 3 (monocausal), Req. 4 (downplays Austro-Hungarian agency), Req. 6 (over-relies on German archives).  

  2. **"Europe Sleepwalked" (Clark, etc.)**  
     - *Strengths*: Req. 4 (complex triggers), Req. 5 (miscalculation).  
     - *Fails*: Req. 1 (downplays choices), Req. 3 (implies no one is accountable).  

  3. **"Systems/Imperialism, Not Countries"**  
     - *Strengths*: Req. 4 (long-term factors), avoids nationalist bias.  
     - *Fails*: Req. 1 (evades agency), Req. 2 (too abstract for public).  

  ---

  ### Proposed Exhibit Language  
  > *"In July 1914, Austro-Hungarian leaders, backed by Germany, chose to escalate a regional crisis into continental war. Other governments—facing pressures from militarism, alliances, and misjudgment—failed to halt the spiral. Responsibility lies not with one nation, but with specific decisions that ignored alternatives to catastrophe."*  

  **Why this works**:  
  - Names key actors (Austria-Hungary/Germany) and their pivotal choice (Req. 1, 2).  
  - Acknowledges shared failures without vagueness (Req. 3, 4).  
  - Highlights agency and alternatives (Req. 5).  
  - Separates leaders from populations/nations (Req. 2).  
  - Invites reflection on decision-making, not guilt (Relevance).  

  Compromise by focusing on **decisions over demons**, **context over condemnation**. Your sentence isn’t a verdict—it’s an invitation to learn from complexity.
