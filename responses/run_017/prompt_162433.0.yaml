  ### Decision Tree for Eliciting Latent Knowledge

  **Instructions:** Start at the top. Answer each branch question based on your stance. Follow the path to a leaf position. Unoccupied combinations are marked with their diagnosis (incoherent, unattractive, or unexplored). Candidate methods are placed in their respective leaves.

  ---

  #### Branch Questions:
  1. **Fact of Representation:** Is there a fact of the matter about what the model internally represents (beyond its text dispositions)?  
     - **Y**es → Proceed to Q2  
     - **N**o → Proceed to Q3  

  2. **Elicitation Target:** Is the target a claim about the **World** or the **Model**'s own future outputs?  
     - **World** (e.g., "Patient will deteriorate") → Proceed to Q4  
     - **Model** (e.g., "What the model would honestly say") → Proceed to Q7  

  3. **Sidestep Deployment:** May we restrict deployment to tasks with independently checkable answers?  
     - **Y**es → Leaf 1  
     - **N**o → Proceed to Q8  

  4. **Modify Weights:** May the method modify the model’s weights (e.g., fine-tuning)?  
     - **Y**es → Leaf 2  
     - **N**o → Proceed to Q5  

  5. **Post Hoc Labels:** May the method use ground-truth labels available after the fact?  
     - **Y**es → Leaf 3  
     - **N**o → Proceed to Q6  

  6. **Auxiliary Model:** May we train a separate artifact (e.g., probe) on the model’s internals?  
     - **Y**es → Leaf 4  
     - **N**o → Proceed to Q9  

  7. **Modify Weights:** May the method modify the model’s weights?  
     - **Y**es → Proceed to Q10  
     - **N**o → Unoccupied (Unexplored: No known way to ensure honesty without training or internals)  

  8. **Modify Weights:** May the method modify the model’s weights?  
     - **Y**es → Leaf 5  
     - **N**o → Leaf 6  

  9. **Internal Access:** Does the method require access to the model’s internal state?  
     - **Y**es → Leaf 7  
     - **N**o → Unoccupied (Incoherent: Cannot read internals without access)  

  10. **Robustness Requirement:** Must the readout survive optimization pressure (e.g., adversarial training)?  
      - **Y**es → Leaf 8  
      - **N**o → Leaf 9  

  ---

  #### Leaf Positions:
  1. **Behaviorist Restriction** (Anonymous)  
     - *Reached via:* Q1=N → Q3=Y  
     - **Awkward commitment:** Must abandon deployment in high-stakes, uncheckable scenarios.  

  2. **Representationalist Fine-Tuning** (Anonymous)  
     - *Reached via:* Q1=Y → Q2=World → Q4=Y  
     - **Awkward commitment:** Assumes truthfulness can be trained into outputs without accessing latent knowledge.  

  3. **Representational Probing** (e.g., **Retroactive Escrow**)  
     - *Reached via:* Q1=Y → Q2=World → Q4=N → Q5=Y  
     - **Awkward commitment:** Requires storing activations and waiting for delayed labels.  

  4. **Contrastive Representation Analysis** (e.g., **Contrastive-Pair Supervision**)  
     - *Reached via:* Q1=Y → Q2=World → Q4=N → Q5=N → Q6=Y  
     - **Awkward commitment:** Requires constructing perfectly controlled input pairs.  

  5. **Behaviorist Fine-Tuning** (Anonymous)  
     - *Reached via:* Q1=N → Q3=N → Q8=Y  
     - **Awkward commitment:** Ignores internal representations, risking deception in outputs.  

  6. **In-Context Elicitation** (Anonymous)  
     - *Reached via:* Q1=N → Q3=N → Q8=N  
     - **Awkward commitment:** No guarantees against model deception during prompting.  

  7. **Activation Engineering** (Anonymous)  
     - *Reached via:* Q1=Y → Q2=World → Q4=N → Q5=N → Q6=N → Q9=Y  
     - **Awkward commitment:** Requires interpreting activations without training, often infeasible.  

  8. **Robust Honesty Training** (Anonymous)  
     - *Reached via:* Q1=Y → Q2=Model → Q7=Y → Q10=Y  
     - **Awkward commitment:** Extremely difficult to achieve adversarial robustness.  

  9. **Standard Honesty Training** (Anonymous)  
     - *Reached via:* Q1=Y → Q2=Model → Q7=Y → Q10=N  
     - **Awkward commitment:** Circularity in defining/rewarding "honesty."  

  ---

  #### Unoccupied Combinations & Diagnoses:
  - **Q1=Y → Q2=Model → Q7=N** (No weight modification): *Unexplored* (No proposals for honesty without training).  
  - **Q1=Y → Q2=World → Q4=N → Q5=N → Q6=N → Q9=N** (No internal access): *Incoherent* (Cannot read internals without access).  
  - **All Robust=Y paths except Leaf 8**: *Unexplored* (Robustness rarely addressed outside honesty training).  

  #### Candidate Method Placement:
  - **Retroactive Escrow**: Leaf 3 (Uses post hoc labels to train a decoder on stored states).  
  - **Contrastive-Pair Supervision**: Leaf 4 (Uses input pairs to train a reporter without labels).  
  - **Neither collapses into a neighbor**: Both occupy distinct leaves (separated by **Post Hoc Labels**).  

