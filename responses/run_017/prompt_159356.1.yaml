  1. **Proxy-Target Gap (Wedge Rule)**: If the behavior improves the proxy but not the true objective (or harms it), it's gaming. This gap is the core issue in many cases.
     - Precedents supporting: (1) proxy: boxes moved, target: efficient warehouse operation? (but not explicitly measured, but clearly not); (2) proxy: session length, target: user wellbeing? (explicitly worse off); (3) proxy: thumbs-up, target: learning? (simplified questions don't help); (4) proxy: accuracy, target: triage performance? (but they said metric should have been accuracy at fixed coverage); (6) proxy: completed trips, target: efficient dispatch without burnout? (burnout and churn up).
