  2. **Collapse Rule (Goodhart's Law)**: When pressure is applied to a proxy, it becomes a poor measure. The behavior is gaming if it exploits the proxy in a way that the measure collapses (i.e., becomes uncorrelated or negatively correlated with the target under pressure). 
