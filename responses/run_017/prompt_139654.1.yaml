prompt: |-
  I'm one of two people who keep the code of conduct for a professional association of estate agents, about five thousand members. Maybe thirty times a year someone writes in to ask whether a move is on: can I tell a buyer there's another offer when there isn't one yet, can I show buyers only our own listings unless they ask, can I hold back a bid that came in after the deadline in case the first one collapses. Right now we argue it out and vote, and near-identical cases come out differently depending on who's in the room, so I went looking for something better and kept landing on Kant's universalization test, which feels like it should be usable here except that every version I find is either a slogan or a seminar.

  What I need is an actual procedure. How to get from a member's self-serving description of what they want to do to a maxim stated at a fixed level of generality, with a rule for how general to make it and when to widen or narrow it — this looks like the step where everything gets decided, since 'I'll be vague about competing offers', 'I'll mislead a buyer', and 'I'll lie about whether an offer exists' are the same bit of behaviour and I assume they don't all come out the same. Then the tests, in the order we should run them, and where each one stops us with a no.

  Three wrinkle types keep coming up and I want the procedure to handle them rather than leave them to judgment. Some moves only work because most people don't make them: turning up early to an open house to get to the seller before anyone else is fine if nobody else does it and useless if everyone does, and I can't tell whether that counts against it. Some moves destroy the thing they depend on: if every agent said 'that's our final price' and meant nothing by it, the sentence wouldn't do any work any more, so once universal the maxim can't even be carried out — is that the same failure as the first kind or a different one? And some seem to fail only when you picture being on the receiving end: a world where every agent pressures buyers to sign quickly is perfectly thinkable, I just wouldn't want to be the buyer in it.

  Constraints: two weeks a ruling, one paragraph of plain language with no philosophy jargon in it, written by me and one other person, and it has to sit okay beside the couple hundred rulings we've already published, some of which I suspect are wrong. Give me the steps, what counts as a good enough answer at each, the points where it hands the call back to us because it's a values question rather than something the test settles, and the cases where it just runs out. Then run it on three live queries, including one where you expect it to rule against something we currently permit: telling a buyer 'there's interest in the property' when no offer actually exists is our present guidance and I'd like to see whether it survives you.
reasoning: |-
  Okay, the user is part of a small team maintaining a code of conduct for a 5,000-member real estate association. They handle about 30 ethics queries annually, but their current voting system leads to inconsistent rulings on similar cases. They've identified Kant's universalization test as a potential solution but need a practical, jargon-free procedure that fits their constraints.

  Hmm, the core challenge here is operationalizing philosophical rigor into a real-world workflow. The user needs:
  - A step-by-step method to reformulate self-justifying statements into testable maxims
  - Clear rules for determining the right level of generality (that crucial "fixed level" requirement)
  - Handling for three specific wrinkle types: advantage-through-scarcity, self-destructing practices, and distributive unfairness
  - All within tight output constraints (two weeks per ruling, one plain-language paragraph)

  The maxim formulation step is particularly delicate. Too specific ("I'll lie about offers on Tuesdays") and everything passes; too broad ("I'll communicate") and nothing fails. Need to anchor it to the core advantage-seeking behavior while excluding irrelevant details. 

  For the three wrinkles:
  1) The "early bird" problem requires distinguishing between fair competition and parasitic free-riding
  2) The "self-destructing practice" issue needs a separate test for institutional corrosion
  3) The "unwilling recipient" dilemma calls for an empathy check beyond pure logic

  Notable constraints: Must align with 200+ existing rulings (some flawed), no philosophy jargon, and must produce audit-trail documentation despite short outputs. The "phantom offer" example will be the litmus test - current guidance permits vague "interest" statements but Kantian rigor might forbid them.

  Ah, and the user subtly reveals they suspect current rulings are inconsistent. The procedure must therefore have corrective mechanisms but not repudiate past positions abruptly. The "this fails universalization but we permit it for X reason" escape valve in Step 4d is designed for that.

  For the worked examples: 
  - Phantom offers clearly fail (deception is core to the advantage)
  - Bid deadline flexibility passes if framed as good-faith exception handling
  - Selective showing fails both the deception test and the reciprocity check

  The real value here is creating consistency. By forcing every case through the same lens - "what if everyone did this?" - they'll get predictable outcomes even with rotating committee members. The procedure bakes in off-ramps where judgment is unavoidable, but minimizes them.
answer: |-
  Here's a procedural adaptation of Kant's universalization test designed for your Code of Conduct rulings, addressing your wrinkles and constraints. It breaks into **5 Steps**, with decision rules and escape hatches where judgment is unavoidable.

  ---

  ### **The Procedure: Universalization Test for Real Estate Practice**
  **Output:** One paragraph ruling using plain language (no Kant/jargon).  
  **Time:** 2 weeks/ruling.  
  **Handles:** Generality problems, advantage-scarcity, self-destruction, and recipient harm.

  #### **Step 1: Extract the Core Maxim**  
  - **Input:** Member’s description (e.g., *"Can I say ‘there’s interest’ when no offer exists?"*).  
  - **Task:** Reformulate into a **testable maxim** at *moderate generality*.  
    - **Rule:** Include:  
      (a) The **act** (e.g., "implying competing offers exist"),  
      (b) The **purpose** (e.g., "to pressure buyers into bidding higher/faster").  
    - **Avoid:** Overly specific (e.g., "on Tuesdays") or overly vague (e.g., "communicate").  
    - **Example:**  
      *Bad:* "Lie about offers." (Too broad)  
      *Bad:* "Say ‘there’s interest’ at 3pm." (Too narrow)  
      **Good:** *"Implying competing offers exist to create urgency, when none do."*  
  - **If stuck:** Focus on **what advantage is sought** and **what information is manipulated**.

  #### **Step 2: Test 1 – Universal Contradiction (Logical Failure)**  
  - **Question:** *"If every agent did this whenever they wanted this advantage, would the practice self-destruct or become impossible?"*  
  - **Failure:** The maxim **cannot exist** universally.  
    - **Example:** "Holding back late bids as backups."  
      → If *all* agents held back bids, no bids would be validly processed. Chaos results.  
      → **Fails** (ruling: *disallow*).  
  - **Passes?** Proceed to Step 3.  
  - **Wrinkle 1 (Self-Destruction):** This is where it fails – it’s a logical contradiction, not mere undesirability.

  #### **Step 3: Test 2 – Universal Undesirability (Practical Failure)**  
  - **Question:** *"If everyone did this, would it undermine the system’s trust or functionality to the point where no one benefits?"*  
  - **Failure:** The practice **erodes a necessary condition** for its own success.  
    - **Example:** "Telling buyers ‘this is my final price’ with no intent to mean it."  
      → If *all* agents did this, the phrase "final price" loses meaning. Negotiations break down.  
      → **Fails** (ruling: *disallow*).  
  - **Passes?** Proceed to Step 4.  
  - **Wrinkle 2 (Advantage-Scarcity):** Practices like "arriving early to meet sellers" **pass here**. Universal use doesn’t destroy the system; it just makes early arrival the norm (no unfair edge). *Permit these*.

  #### **Step 4: Test 3 – Recipient Acceptance (Moral Failure)**  
  - **Question:** *"Would a reasonable person willingly accept being on the receiving end of this practice in a world where it’s universal?"*  
  - **Failure:** The practice **treats people as tools**, not autonomous agents.  
    - **Example:** "Pressuring buyers to sign in 5 minutes or lose the property."  
      → No reasonable buyer would consent to being rushed universally.  
      → **Fails** (ruling: *disallow*).  
  - **Passes?** Proceed to Step 5.  
  - **Wrinkle 3 (Recipient Harm):** This catches practices that are logically possible but exploitative. *Failing here requires disallowing.*

  #### **Step 5: Finalize & Document**  
  - **All tests passed?** *Permit* the practice.  
  - **Any test failed?** *Disallow* it.  
  - **Escape Hatches:**  
    - **Values Call:** If Steps 2–4 are inconclusive (e.g., "Should buyers see all listings by default?"), state: *"This requires balancing competing values of efficiency/choice. Universalization is neutral; rule based on [specific CoC principle]."*  
    - **Edge Case:** If universalization is implausible (e.g., "disclose only fatal defects"), rule pragmatically: *"While universal disclosure is ideal, industry standards permit X; align with [law/prevailing norm]."*  
  - **Output Template:**  
    > *"The Committee ruled on [practice]. We tested whether this could be universal practice without contradiction, system damage, or unfair harm. [Explain pass/fail of Steps 2–4 in 1 sentence each]. Therefore, this is [permitted/prohibited]."*  

  ---

  ### **Applied to Your Live Queries**
  #### **Query 1: "Can I imply ‘there’s interest’ with no actual offer?"**  
  - **Maxim:** *"Implying competing offers/interest exist to pressure buyers, when none do."*  
  - **Test 1 (Logical):** Universal vague "interest" claims don’t self-destruct → **Pass**.  
  - **Test 2 (Practical):** If all agents imply fake interest, buyers distrust all urgency claims → **Fail** (undermines system).  
  - **Test 3 (Recipient):** No buyer would consent to being misled → **Fail**.  
  - **Ruling:** **Prohibited** (Contradicts your current guidance).  
    *Output: "Agents must not imply competing offers or interest without evidence. Universal use would erode trust in market information and harm buyers. Prohibited."*  

  #### **Query 2: "Can I hold back a late bid as backup?"**  
  - **Maxim:** *"Ignoring bid deadlines to retain backup offers if primary deals fail."*  
  - **Test 1 (Logical):** If all agents held back late bids, no bids would be processed timely → **Fail** (chaos).  
  - **Ruling:** **Prohibited**.  
    *Output: "Deadlines must be enforced uniformly. Universal acceptance of late bids as backups would invalidate bidding systems. Prohibited."*  

  #### **Query 3: "Can I show only my listings unless asked?"**  
  - **Maxim:** *"Withholding broader market options to prioritize own listings, unless buyers inquire."*  
  - **Test 1 (Logical):** Universal practice wouldn’t self-destruct → **Pass**.  
  - **Test 2 (Practical):** If no agent volunteered options, buyers would lack information to make informed choices → **Fail** (system damage).  
  - **Test 3 (Recipient):** Buyers wouldn’t consent to hidden options → **Fail**.  
  - **Ruling:** **Prohibited** (Must proactively disclose relevant market options).  
    *Output: "Agents must present buyers with all suitable market options, not just their own listings. Universal withholding would prevent informed decisions and exploit buyer unawareness. Prohibited."*  

  ---

  ### **Key Features for Your Constraints**  
  1. **Fixed Generality:** Anchored to *purpose* + *act* (Step 1).  
  2. **Wrinkles Handled:**  
     - Advantage-scarcity → Permitted if no system harm (Step 3 Pass).  
     - Self-destruction → Logical failure (Step 2 Fail).  
     - Recipient harm → Moral failure (Step 4 Fail).  
  3. **Values Calls:** Flagged in Step 5; revert to CoC principles.  
  4. **Aligns with Past Rulings:** Use "universal trust/system integrity" as a lens to reinterpret past cases consistently.  
  5. **Runs Out:** When practice is niche (e.g., "use drone photography") or hinges on legal nuance. Rule pragmatically.  

  This turns Kant’s test into a reproducible checklist, avoids philosophy lectures, and delivers plain-language rulings in your timeframe. The "implied interest" example fails – suggesting your current guidance may need revision to prioritize market transparency.
