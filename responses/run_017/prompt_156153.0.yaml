  Structure:
  1. "The question we were convened to answer" (1-2 sentences)
  2. "Agreed claims" (8-10 numbered claims, 300 words total)
  3. "Disagreements" (table with 4-6 rows, columns: Crux, Open-borders formulation, Restrictionist formulation, Verbal/Substantive; 400 words)
  4. "Tests, with predictions recorded in advance" (3-4 tests, each with both sides' predictions and why; 400 words)

  Key distinctions from the user:
  - Three gates: entry (physical admission and residence), access (eligibility for transfers, services, labor protections), standing (permanent membership with political rights).
  - Two restrictionist worries: fiscal (net contribution at fixed policy) and political-economy (dynamic effect on future redistribution).

  We must:
  - State claims both sides can sign, including what the other side is not claiming and what is hard for their own view.
  - For residual disagreements: state each twice (once in open-borders wording, once in restrictionist wording) without straw men.
  - Identify cruxes (sub-questions that would move at least one side) and for each, a test both sides agree would bear on it, with predictions recorded in advance.
  - Where disagreement is verbal, say so and state the underlying substantive disagreement.
  - For each side, name one finding that would count as evidence against their own position (this should be in the Agreed Claims? Or perhaps in the Tests? But the user says: "for each side, name one finding that would count as evidence against that side's own position." This might fit in the Agreed Claims as a point of self-critique, or in a separate part. However, the structure is fixed. We'll put it in the Agreed Claims as one of the points.)

  Plan for Agreed Claims (8-10 points):
  1. Shared starting point: moral equality of persons.
  2. Both sides accept that states have some right to regulate borders, but they differ on the scope and justification.
  3. Both sides recognize that border control involves coercion.
  4. Both sides value the welfare state and redistribution.
  5. Both sides agree that the three gates (entry, access, standing) are distinct and that conflating them leads to confusion.
  6. Both sides accept that the restrictionist has two distinct empirical worries (fiscal and political-economy).
  7. Each side acknowledges what the other is not claiming: e.g., the open-borders side is not denying the importance of the welfare state, and the restrictionist is not motivated by nativism or racism.
  8. Each side admits a genuine difficulty for its own view: for open-borders, how to handle the potential erosion of the welfare state; for restrictionists, how to justify exclusion to the excluded.
  9. Both sides agree that a temporary-worker program is a real-world policy option that tests their theories.
  10. Both sides agree that evidence against their own positions exists: for open-borders, evidence that large inflows under current institutional settings undermine redistribution; for restrictionists, evidence that exclusion causes severe harm without clear offsetting benefits.

  Plan for Disagreements (table with 4-6 rows):

  We'll identify cruxes:

  Crux 1: The permissibility of exclusion. Is it ever permissible to exclude a willing entrant without a justification that addresses the excluded person?

  Crux 2: The relationship between bounded membership and the welfare state. Is bounded membership necessary for sustaining the welfare state?

  Crux 3: The role of the gates. Which gate (entry, access, standing) is most critical to protect the welfare state? And which is most critical for moral reasons?

  Crux 4: The empirical question: what happens to the welfare state when borders are opened? (This can split into fiscal and political-economy.)

  But note: we have two empirical worries (fiscal and political-economy). We might break into:

  Row 1: The moral basis of exclusion.
  Row 2: The necessity of bounded membership for the welfare state (political-economy version).
  Row 3: The fiscal impact of immigration at fixed policies (fiscal version).
  Row 4: The role of the gates: which one is the linchpin?

  Or:

  We have:

  Crux A: Moral justification of exclusion.
  Crux B: The political-economy mechanism (dynamic effect on redistribution).
  Crux C: The fiscal mechanism (static net contributions).
  Crux D: The moral priority of gates (which gate must be restricted to preserve the welfare state, if any).

  But note the user wants the disagreements stated twice (once in each side's wording). And we must note if verbal or substantive.

  Plan for Tests (3-4 tests):

  Test 1: A natural experiment: a country that opens its borders (or significantly increases entry) while keeping access and standing restricted. What happens to the welfare state? (Both fiscal and political effects.)

  Test 2: A policy that grants access (to welfare) without entry (e.g., remote eligibility for transfers) or vice versa.

  Test 3: A temporary-worker program that allows entry and access but not standing. Does this sustain the welfare state or undermine it?

  Test 4: A case where a country with a strong welfare state experiences a large inflow of migrants and we observe changes in public support for redistribution.

  But the user says: if no test is acceptable, say so.

  We must also record predictions in advance.

  Now, let's write.
answer: |-
  ### Joint Statement from the Adversarial Collaboration on Borders and the Welfare State

  **The question we were convened to answer**  
  We were tasked with resolving whether a state committed to both moral equality and a robust welfare state can justifiably restrict immigration, and if so, under what conditions and with what limitations, without either side abandoning its core principles.

  **Agreed claims**  
  1. Both sides affirm the foundational moral equality of all persons, regardless of origin, and agree that border controls inherently involve state coercion against excluded individuals.  
  2. Neither side endorses exclusion based on ethnicity, race, or cultural prejudice; the restrictionist position is solely grounded in preserving institutional conditions for redistribution.  
  3. Conflating the three gates—entry (physical admission/residence), access (eligibility for transfers/services), and standing (permanent political membership)—obscures the debate; each gate imposes distinct moral and practical demands.  
  4. The restrictionist’s empirical concerns are twofold: fiscal (immigrants’ net fiscal impact under current policies) and political-economy (dynamic effects of inflows on future support for redistribution), which are separable and require different evidence.  
  5. The open-borders position accepts that sudden, large-scale entry without institutional adaptation could strain the welfare state in the short term, presenting a genuine practical challenge.  
  6. The restrictionist position concedes that exclusion inflicts profound, unjustifiable harm when disconnected from welfare-state sustainability, creating a moral burden to minimize such harm.  
  7. Temporary-worker programs (e.g., granting entry and limited access without standing) are a live policy option, but their viability as a compromise depends on which empirical worry (fiscal or political-economy) dominates.  
  8. Evidence against the open-borders view would be: sustained declines in public support for redistribution following large-scale entry, where alternative explanations (e.g., economic shocks) are controlled for.  
  9. Evidence against the restrictionist view would be: robust maintenance or expansion of universal welfare programs in high-immigration contexts without erosion of public trust.  
  10. Both sides reject "free riding" as a primary objection; the debate centers on systemic sustainability, not individual desert.  

  **Disagreements**  
  | Crux | Open-borders formulation | Restrictionist formulation | Verbal/substantive |  
  |------|--------------------------|----------------------------|-------------------|  
  | **Permissibility of exclusion** | "Exclusion is only permissible if the excluded person receives a justification demonstrating that their entry would directly undermine their own interests or equivalent interests of others." | "Exclusion is permissible if necessary to protect the institutional preconditions for the welfare state, even absent a justification addressed directly to the excluded." | Substantive |  
  | **Welfare-state necessity of bounded membership** | "There is no inherent link between bounded membership and redistribution; welfare states can adapt to open borders through institutional innovation (e.g., transnational frameworks)." | "Bounded membership is a necessary condition for high-level redistribution, as citizen solidarity depends on shared identity and finite mutual obligations." | Substantive (underlying: whether solidarity is identity-dependent or institutionally constructed) |  
  | **Primary threat to redistribution** | "The restrictionist conflates two issues: fiscal costs are solvable with policy tweaks (e.g., phased access), while political backlash stems from exclusionary rhetoric, not inflows themselves." | "Political backlash is the core threat; even fiscally neutral inflows can erode support for redistribution by straining community trust, making fiscal fixes insufficient." | Verbal (underlying substantive: whether backlash is exogenous or endogenous to policy design) |  
  | **Critical gate for restriction** | "If any gate must be restricted, it should be standing (delayed citizenship), as it poses no immediate moral harm compared to denying entry or access." | "If any gate must be restricted, it should be access (to transfers/services), as it directly determines fiscal and political sustainability without coercive exclusion." | Substantive |  
  | **Temporary-worker programmes** | "Such programmes are a capitulation; they deny standing and access, creating a underclass that exacerbates exploitation without addressing the moral claim to entry." | "Such programmes are a prudent compromise; they allow entry while ringfencing access, preserving solidarity without full exclusion." | Substantive |  

  **Tests, with predictions recorded in advance**  
  1. **Test**: A natural experiment where a country with universal welfare provisions (e.g., Sweden or Canada) unexpectedly doubles entry quotas for five years while holding access and standing constant. Measure changes in public support for redistribution (via surveys) and program generosity (via legislation).  
     - *Open-borders prediction*: Support remains stable or increases; backlash is linked to political discourse, not inflows. Why? Their view holds that solidarity is malleable and inflows alone don’t threaten trust.  
     - *Restrictionist prediction*: Support declines significantly within three years, leading to stricter eligibility rules. Why? Their view holds that sudden inflows strain shared identity, triggering defensive retrenchment.  

  2. **Test**: Implement a policy granting migrants full access to welfare benefits upon entry but without a path to standing (citizenship). Track fiscal costs and public attitudes over a decade in a mid-sized welfare state (e.g., Denmark).  
     - *Open-borders prediction*: Net fiscal contributions stabilize or improve, and public trust adapts without erosion. Why? Access fosters inclusion, aligning with their view that moral harm is reduced when basic needs are met.  
     - *Restrictionist prediction*: Rising resentment toward "handouts" leads to welfare cuts or stricter access rules. Why? Their view holds that unconditional access without standing undermines reciprocity, eroding solidarity.  

  3. **Test**: Compare regions with similar demographics but differing in border policies: one with open entry but restricted access (e.g., Gulf states), and one with restricted entry but universal access (e.g., Japan). Assess which sustains higher long-term redistribution.  
     - *Open-borders prediction*: The restricted-access model fails, increasing exploitation; the restricted-entry model maintains redistribution but at high moral cost. Why? Their view prioritizes entry as foundational to reducing coercion.  
     - *Restrictionist prediction*: The restricted-entry model sustains redistribution more effectively, while open entry with restricted access breeds inequality. Why? Their view holds that controlling entry preserves the cultural-institutional basis for solidarity.  

  4. **No agreed test for**: "Whether exclusion can ever be justified to the excluded." Open-borders insists justification must address the individual, while restrictionists see it as a systemic necessity. No mutually acceptable test exists, as it hinges on irreconcilable moral axioms.
