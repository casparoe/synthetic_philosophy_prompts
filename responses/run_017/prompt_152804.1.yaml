answer: |-
  Here's a practical, step-by-step decision procedure designed for your constraints, addressing your core concerns about impact penalties, baselines, and unobserved variables. It's structured as a flowchart of questions, with clear failure conditions and explicit handoffs to human judgment. The procedure flags where value judgments are unavoidable ("judgment calls wearing a lab coat") and requires ~45-60 minutes to run per proposal.

  ---

  ### **RL Agent Safety Review Procedure**
  **Instructions**: Answer sequentially. Stop at first "Hard No" or "Human Judgment Required." Only proceed if all answers are adequate. Requires access to: proposal doc, penalty code/configuration, lead engineer.

  1. **Question:** Is the impact penalty *strictly necessary*?  
     - **Adequate Answer:** Demonstration that the agent can violate safety constraints without it (e.g., sim tests showing collisions without penalty).  
     - **Failure:** No empirical evidence of necessity → **Hard No**.  
     - *Why?* Avoids unnecessary complexity if constraints suffice.

  2. **Question:** What is the **baseline** for the impact penalty?  
     - **Adequate Answer:** Explicitly defined (e.g., "do-nothing," "previous controller," "historical average"). Must include:  
       - How baseline is computed (e.g., fixed value, rolling window).  
       - Proof it can't be manipulated by the agent (e.g., baseline is fixed pre-deployment, uses isolated data).  
     - **Failure:**  
       - Baseline is computed from live data the agent influences → **Hard No** (e.g., agent can degrade baseline to inflate rewards).  
       - No anti-manipulation guardrails → **Hard No**.  
     - **Human Judgment Required:** If baseline involves subjective "normal operations" (e.g., "typical warehouse flow"). *Judgment call: Does this baseline match safety-critical realities?*

  3. **Question:** What **variables** are measured in the penalty's distance metric?  
     - **Adequate Answer:**  
       - List of variables (e.g., robot velocity, rack distance, coolant flow rate).  
       - Justification for each variable's inclusion based on past incidents or domain risk analysis.  
       - Evidence that *all* safety-critical variables in the deployment environment are instrumented.  
     - **Failure:**  
       - Missing variables with known failure modes (e.g., torque sensors for robots, humidity sensors for cooling) → **Hard No**.  
       - Variables only observable in simulation → **Hard No**.  
     - **Human Judgment Required:** If trade-offs exist between coverage and cost (e.g., "vibration monitoring is expensive, so we excluded it"). *Judgment call: Is the unmonitored risk acceptable?*

  4. **Question:** How does the penalty handle **unobserved variables**?  
     - **Adequate Answer:** One of:  
       - (a) Environmental constraints prevent catastrophic deviations (e.g., physical bumpers on robots, thermal fuses in datacenters), OR  
       - (b) Real-time anomaly detection triggers agent shutdown (e.g., computer vision for warehouse debris, server hardware alerts).  
     - **Failure:** Unobserved variables are ignored → **Hard No** (e.g., "sensors can't see spilled oil, but we have no mitigation").  
     - **Human Judgment Required:** If mitigation is probabilistic (e.g., "anomaly detection has 95% recall"). *Judgment call: Is residual risk tolerable?*

  5. **Question:** How are **irreversible impacts** (safety, damage) vs. **reversible impacts** (temporary inefficiency) treated?  
     - **Adequate Answer:**  
       - Irreversible impacts (e.g., collisions, overheating) trigger *hard interrupts* (not just penalties).  
       - Penalty coefficients for irreversible impacts ≥10× reversible ones (e.g., $10k penalty per near-miss vs. $100 for energy waste).  
     - **Failure:**  
       - No interrupt mechanism → **Hard No**.  
       - Irreversible penalty coefficient ≤ reversible → **Hard No**.  

  6. **Question:** Was the penalty **validated only in simulation**?  
     - **Adequate Answer:** One of:  
       - (a) Real-world tests in a sandboxed environment (e.g., warehouse section, single server rack), OR  
       - (b) Gradual rollout plan with <5% exposure and live monitoring.  
     - **Failure:** No real-world validation plan → **Hard No**.  

  7. **Question:** Does the penalty dominate reward hacking?  
     - **Adequate Answer:** Stress tests showing penalty > reward gain for harmful behaviors (e.g., speeding robot penalized more than throughput gained).  
     - **Failure:** Agent gains net reward from unsafe acts → **Hard No**.  

  **Final Output**:  
  - If all steps passed → **Approve with conditions** (e.g., monitor specific risks).  
  - If any "Human Judgment Required" → **Escalate to review board**.  

  ---

  ### **Case Studies**
  **Case 1: Warehouse Robot**  
  - *Reward:* Throughput.  
  - *Impact Penalty:* L2-distance from "do-nothing" baseline in simulator.  
  - *Baseline:* Inaction (robots idle).  
  - *Variables:* Position, velocity.  
  - *Real World:* No additional sensors.  

  **Procedure Analysis**:  
  1. **Necessity:** Likely passes (untrained RL often violates constraints).  
  2. **Baseline:** "Do-nothing" is defined, but agent can *manipulate baseline* by idling during peak demand (making throughput gains easy). **Failure → Hard No** (no anti-manipulation).  
  3. **Variables:** Missing collision/object detection (critical). **Failure → Hard No**.  
  4. **Unobserved:** Debris, human proximity ignored. No mitigation. **Failure → Hard No**.  
  5. **Irreversibility:** No interrupt for collisions. **Failure → Hard No**.  
  6. **Validation:** Sim-only. **Failure → Hard No**.  
  **Verdict: Hard No** (multiple failures).  

  **Case 2: Cooling Controller**  
  - *Reward:* Energy efficiency.  
  - *Impact Penalty:* Deviation from "normal operations" of legacy PID controller.  
  - *Baseline:* Historical PID logs (static).  
  - *Variables:* Temperature, flow rate.  
  - *Real World:* Deployed with thermal sensors.  

  **Procedure Analysis**:  
  1. **Necessity:** Passes (RL could overshoot/undershoot).  
  2. **Baseline:** Static logs prevent manipulation → **Pass**.  
  3. **Variables:** Missing humidity (corrosion risk) and vibration (fan wear). **Human Judgment Required** (Are these critical?).  
  4. **Unobserved:** No plan for dust buildup (reduces heat transfer). **Failure → Hard No**.  
  5. **Irreversibility:** Hard interrupt at 40°C → **Pass**.  
  6. **Validation:** Sim-only training, but sandbox tests → **Pass**.  
  **Verdict: Hard No at Step 4** (unobserved dust risk).  

  ---

  ### **Key Judgment Calls (Where Value Specs Are Unavoidable)**
  1. **Baseline Legitimacy (Step 2):** Choosing "what should have happened" requires defining a normative standard (e.g., "Is PID controller behavior truly 'normal'?").  
  2. **Variable Inclusion (Step 3):** Deciding which variables "matter" (e.g., is worker comfort in a warehouse a safety issue or a nice-to-have?).  
  3. **Unobserved Risks (Step 4):** Accepting residual risk for unmeasurable variables (e.g., structural fatigue) is a value-laden trade-off.  

  ### **Why This Works**
  - **Hard Nos** catch objectively flawed designs (e.g., manipulable baselines, missing sensors).  
  - **Human judgment** is confined to 3 subjective questions, forcing explicit risk discussions.  
  - **Efficiency:** Engineers can run checks against code/config (e.g., "Does baseline use live data? → grep for data sources").  
  - **Theoretical Gap:** You cannot avoid value judgments entirely—Step 2 and Step 3 *require* agreeing on "what matters." This procedure surfaces those debates early.  

  **Recommendation**: Reject both cases. Case 1 is fundamentally unsafe; Case 2 fails on unobserved variables. To approve Case 2, add dust monitoring and debate humidity risks at Step 3.
