  ## Memorandum: Grant Award Recommendation for 2025-2030 Cycle

  **To:** Program Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Rationale for Final Grant Award: Program A vs. Program B  

  **I. Recommendation:**  
  **Fund Program A (Seasonal Malaria Chemoprevention & Bed-Net Distribution) fully for five years.** We should reject the bridge proposal and decline Program B at this time.  

  **II. Summary of Finalists:**  
  *   **Program A:** Prevents ~1,800 child deaths (under five) over five years. Benefits are certain, immediate, and target identified children alive today.  
  *   **Program B:** Reduces existential pandemic risk by ~1% this century. Expected value (EV) analysis suggests vastly greater potential lives saved *in expectation*, but beneficiaries are primarily future, unconceived individuals.  

  **III. Moral Theory Analysis & Committee Credences:**  
  Our diverse moral views (45% Impersonal Total, 40% Person-Affecting, 15% Prioritarian) lead to deep disagreement:  
  1.  **Impersonal Total View (45% Weight):** Favors Program B. Maximizes total expected well-being across all possible futures, discounting the identity of beneficiaries. Program B's immense EV dominates.  
  2.  **Person-Affecting View (40% Weight):** Favors Program A. Only benefits to existing or inevitably future persons "count." Program B benefits no identifiable person alive today and may even harm potential future individuals by altering who exists.  
  3.  **Prioritarian View (15% Weight):** Favors Program A. Focuses on the worst-off. Today's malaria-threatened children are demonstrably among the world's worst-off. Program B's beneficiaries are unknown and likely better off in baseline scenarios.  

  **IV. The Normalization Problem & Founding Deed Constraint:**  
  The core difficulty is comparing "currencies" (certain child deaths averted vs. reduced existential risk). Staff analyses used divergent normalization conventions, yielding opposing recommendations. **The Founding Deed adds a decisive layer:**  
  *   **Text:** "Grants shall be restricted to relieving the suffering of people alive when the grant is made."  
  *   **Interpretation & Weight:** A majority of the committee (myself included) interprets this as a **binding operational constraint**, not merely a guiding principle. It carries **substantial, potentially decisive weight** relative to the moral case:  
      *   **Legal & Fiduciary Duty:** We are bound by the foundation's governing documents. Ignoring a clear restriction risks legal challenge and mission drift.  
      *   **Alignment with Person-Affecting View:** The deed explicitly adopts a person-affecting framework, privileging relief for *current* sufferers. This directly favors Program A and creates a significant hurdle for Program B.  
      *   **Resolving Moral Ambiguity:** Where moral theories clash profoundly, the deed provides a clear, justifiable tie-breaker grounded in our foundational purpose.  
  *   **Weight Assessment:** The deed restriction is not merely a 5-10% factor. It is a **threshold consideration**. Program B faces a steep burden to overcome this restriction, which its current EV analysis – reliant on contested impersonal assumptions – fails to meet.  

  **V. Rejection of the Bridge Proposal:**  
  While creatively attempting to resolve the moral impasse, the bridge proposal (2 years of A + study) is **untenable**:  
  1.  **Ineffectiveness:** Resolving deep meta-ethical normalization issues within 2 years is highly improbable.  
  2.  **Risk to Program B:** The co-funder's matching window is likely to close, eliminating B as a viable future option.  
  3.  **Suboptimal Use of Funds:** Committing $16M to A without the full impact potential, while spending resources on an uncertain study, wastes opportunity.  
  4.  **Deed Issues Remain:** The study doesn't address the fundamental deed restriction on benefiting *current* people.  

  **VI. Strongest Argument for Program B (Impersonal Total View):**  
  The most compelling case for Program B, forcefully articulated by its proponents, is this:  
  *   **Existential Risk Magnitude:** A 1% reduction in the probability of civilizational collapse this century represents an astronomically valuable intervention. Conservative EV calculations, based on the potential size of future populations and the sheer scale of suffering averted, suggest Program B could save orders of magnitude more lives (millions or billions in expectation) than Program A's 1,800 certain saves.  
  *   **Neglectedness & Scale:** Engineered pandemics represent a potentially catastrophic, under-addressed threat. Our $40M contribution leverages matching funds to build crucial global capacity at a pivotal time. Failing to act on this scale of expected value, based on philosophical quibbles about the identity of future beneficiaries, constitutes a profound moral failing from the perspective of maximizing total expected good. The person-affecting view and deed restriction, in this framing, are tragically myopic, prioritizing a small number of identifiable lives over the vast potential future of humanity.  

  **VII. Conclusion & Recommended Vote:**  
  While the impersonal case for Program B's immense expected value is profound, **the combination of the binding Founding Deed restriction and the significant weight of the Person-Affecting view within the committee's moral spectrum compels us to select Program A.** Funding Program B violates the explicit requirement to relieve the suffering of people "alive when the grant is made." Program A delivers immediate, certain, and profound relief to identifiable, desperately vulnerable children, fully aligning with the deed and resonating strongly with both Person-Affecting and Prioritarian perspectives.  

  **I urge the committee to vote in favor of fully funding Program A for five years.** We fulfill our duty to current sufferers, honor our foundational mandate, and make a guaranteed, impactful difference for thousands of children and their communities.
