answer: |-
  Here are eight exacting questions designed to press Dr. Brace on the conceptual joints of her interpretation of Chesterton's Fence, incorporating your specified foci and anticipated replies. The register is rigorous, collegial, and assumes deep familiarity with her work.

  ---

  **1. Purpose vs. Present Effects & Causal Inquiry**  
  *Question:* You argue the reformer needn't discern the *original purpose* of a practice nor its *current effects* to incur Chesterton's burden—only that its survival implies *some* functional reason, making removal an unmodeled intervention. Doesn't this reduce Chesterton's principle to a banal injunction for ordinary causal inquiry ("understand before changing"), rendering the rhetoric of *historical ignorance* or *opaque origins* superfluous or even misleading?  
  *Likely Reply:* The historical framing isn't superfluous—it emphasizes the *systemic* nature of social practices. We inherit complex, co-evolved systems where functions may be distributed, latent, or emergent. "Understanding" isn't just proximate cause-effect but appreciating embeddedness.  
  *Follow-Up:* If the core is systemic risk assessment, why invoke Chesterton's *ignorance-of-origins* specifically? Doesn't the "fence" parable misleadingly imply that *not knowing why it was built* is the problem, rather than *not modeling its current systemic role*? Is the historical framing doing rhetorical work to bias toward conservatism that causal prudence alone wouldn't justify?

  **2. Symmetry Worry & Adversarial Filtering**  
  *Question:* You posit an asymmetry: existing practices have survived an "adversarial filtering process," while proposed innovations haven't. But what about durable practices that face *no meaningful adversarial pressure*—say, academic regalia, bureaucratic formalities, or obsolete licensing rules? If these persist due to inertia, capture, or low stakes, not functional filtering, does the burden still fall asymmetrically on reformers? And who must demonstrate whether the filter *was* operative?  
  *Likely Reply:* Persistence *itself* suggests some equilibrium, even if maintained by low-cost inertia or vested interests. The "filter" includes all forces sustaining or eroding a practice over time, not just conscious challenges.  
  *Follow-Up:* If "filter" encompasses *any* reason for persistence—including dysfunction (e.g., regulatory capture)—doesn't this render the filtering criterion vacuous? Doesn't it place an impossible burden on reformers to disprove *every possible* latent function or equilibrium condition, while defenders bear *no* burden to show positive functionality?

  **3. Identifying "Dead" Fences & Testability**  
  *Question:* What would you accept as conclusive evidence that a Chestertonian "fence" is genuinely dead—i.e., that its persistence provides *no* evidence of latent function? Could you name a historical practice where you'd concede reformers validly bypassed the burden? And if no such clear case exists, does the principle risk unfalsifiability?  
  *Likely Reply:* Evidence might include: sustained absence of the problem it once addressed without negative consequence; unambiguous documentation showing its function was purely symbolic/superseded; or repeated, controlled removal in similar contexts with no ill effects. Example: Phasing out mandatory Latin in university curricula once vernacular education proved functionally superior.  
  *Follow-Up:* But isn't the Latin example vulnerable to your own critique? Reformers *assumed* its function (scholarly lingua franca, mental discipline) was obsolete/replaceable—precisely the kind of confidence Chesterton warns against. If even this case is contestable, does the principle *ever* conclusively license removal without exhaustive proof, making it paralyzing in practice?

  **4. Burke's 1688 Settlement & Restoration vs. Innovation**  
  *Question:* Burke defended the Glorious Revolution as a *restoration* of ancient liberties, not innovation. Yet it deposed a king, altered succession, and entrenched parliamentary supremacy. If any reformer can frame change as "restoring" a corrupted or latent order, what prevents Chesterton's principle from being circumvented by re-description? What *operational* distinction between restoration and innovation does your epistemology allow?  
  *Likely Reply:* Restoration appeals to *immanent principles* within the existing tradition, demonstrably violated or suppressed. Innovation imposes *external* ideals. The 1688 protagonists appealed to the ancient constitution and Magna Carta, not abstract rights. The test is continuity of underlying principles.  
  *Follow-Up:* Doesn't this invite strategic essentialism? A Bolshevik could frame revolution as restoring "true" communal ownership corrupted by feudalism/capitalism. If the distinction rests on the reformer's *narrative fidelity*, not an objective baseline, how does Chesterton's fence constrain anything but the most nakedly utopian proposals?

  **5. Language Analogy & Normative Authority**  
  *Question:* You analogize inherited practices to inherited language: both are complex, opaque systems enabling coordination. But grammar isn't *enforced*—we follow linguistic rules because they serve communication, not fear of sanction. When the inherited "fence" is a *coercive rule* (e.g., sumptuary laws, discriminatory statutes), what in the analogy grounds its *normative authority* beyond mere existence or functionality?  
  *Likely Reply:* The authority stems from the Burkean "partnership" across generations. Coercive rules, like linguistic norms, sustain a shared lifeworld. Their persistence signals they serve *some* socially stabilizing function, even if imperfectly understood. Sanctions enforce coordination points.  
  *Follow-Up:* But doesn't this conflate *descriptive* functionality (why it persists) with *normative* legitimacy? A rule enforcing caste may "stabilize" society functionally while being profoundly unjust. If Chesterton's fence obscures this distinction by treating survival as proxy for legitimacy, isn't it inherently conservative in a morally problematic sense?

  **6. Institutionalization & Documentation Burden**  
  *Question:* You propose requiring a documented historical account of a rule's function before repeal. Given legislative realities, wouldn't this often devolve into perfunctory "archival theatre"—ritualistic citation of dusty precedents without genuine understanding? And why place this burden solely on reformers? Shouldn't rule-*keepers* periodically demonstrate a practice's *current* functionality?  
  *Likely Reply:* The intent is to *cultivate* understanding, not perform bureaucracy. A serious process forces engagement with the practice's complexity. The burden falls asymmetrically on reformers because they seek to disrupt a functioning (if opaque) equilibrium.  
  *Follow-Up:* If reformers discharge the burden via superficial historiography (e.g., citing an original purpose long made obsolete), hasn't the institutionalization failed? And if rule-keepers bear *no* burden to demonstrate functionality, doesn't this entrench inertia and vested interests, making the "adversarial filter" a myth for many persistent practices?

  **7. Scope: Sanctioned vs. Unenforced Norms**  
  *Question:* Does Chesterton's burden apply equally to *de jure* rules with sanctions (e.g., blue laws) and *de facto* social norms without formal enforcement (e.g., dress codes)? If a norm persists purely through voluntary conformity, does its survival carry less epistemic weight regarding latent function than a rule backed by coercion?  
  *Likely Reply:* The principle applies to any persistent social practice, formal or informal. Coercion is one mechanism among many for persistence. Voluntary conformity may indicate stronger functional integration or value alignment.  
  *Follow-Up:* Doesn't this breadth weaken the principle? If unenforced norms carry equal epistemic weight as laws, and "persistence" includes low-stakes conventions (e.g., "don't wear white after Labor Day"), doesn't it risk trivializing the burden or over-applying it to harmless anachronisms?

  **8. Falsifiability & Exit Conditions**  
  *Question:** What empirical finding, historical episode, or class of cases would compel you to significantly restrict or abandon your interpretation of Chesterton's fence? For instance, widespread identification of "zombie fences" (persistent, functionally inert practices) or evidence that epistemic humility systematically entrenches injustice?  
  *Likely Reply:* If rigorous studies showed *most* long-standing practices removed without deep historical analysis *consistently* yielded net positive outcomes with minimal disruption, I'd reconsider the weight of the burden. Or if clear cases emerged where the principle demonstrably blocked necessary moral progress despite reformers' sincere efforts to understand.  
  ***If She Concedes Nothing:*** If the principle is insulated from counter-evidence because survival *always* hints at latent function, and "understanding" *always* requires prohibitive depth, doesn't it function less as an epistemic guideline and more as an immutable bias toward the status quo, regardless of consequences?  

  ---

  **Rationale & Tone:**  
  - Each question presses a specific conceptual joint you identified, avoiding restatement of her core thesis.  
  - Follow-ups are tightly keyed to her probable replies, forcing her beyond rehearsed positions.  
  - The register is rigorous and precise, respecting her intellect while challenging implications. Terms like "unmodeled intervention," "adversarial filtering," and "systemic risk" mirror her framework.  
  - The closing question directly addresses falsifiability, crucial for a principle claiming epistemic status. The "concedes nothing" variant prevents evasion.  
  - Hostility is avoided by grounding challenges in internal logic (e.g., "Doesn't this breadth weaken the principle?") rather than accusation.  

  This set ensures a dynamic, substantive dialogue that treats Dr. Brace as the formidable thinker she is—by refusing to let her settle for comfortable answers. Good luck with the interview!
