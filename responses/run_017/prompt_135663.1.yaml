prompt: |-
  You're a professional philosopher who works on moral psychology and social/political philosophy, and I'd like you to think this through carefully instead of giving me a generic chat answer.

  I'm an American spending a year in a mid-sized German city doing a research internship, and I live in a student residence with a shared kitchen and a Hausordnung (the house rules) that a German PhD student called Jonas takes extremely seriously. Three things have happened. First: a friend of mine missed the last train and needed to crash on the common-room couch for one night, and Jonas said no — common room closes at ten, no overnight guests — and then he spent an hour of his own evening driving her to a cheap hotel and paid for half of it himself. So he obviously cared, he just wouldnt break the rule. Second: at his job his boss asked him to quietly back-date a form so a client wouldn't lose a deposit, everyone else thought it was harmless, and Jonas refused and cited the actual regulation. Third: the residence management floated a new rule that residents should report anyone who has overnight guests more than three nights a month, which is transparently aimed at one foreign student nobody likes, and Jonas says he'll argue against it at the residents' meeting but will follow it if it's properly passed.

  My instinct is that these are three totally different things — case one is just rigidity, case two is integrity, case three is being a snitch. My girlfriend says they're all one thing, that it's the just-following-orders mindset with the usual twentieth-century examples attached, and that a culture which teaches people to ask whether something is erlaubt rather than whether it's right is exactly how you get ordinary people doing appalling things. Jonas says the opposite: that it's not about the people above him at all, that a rule isn't a command from a boss but a promise everybody makes to everybody else, and that the moment he decides for himself which rules apply, he's the one with the power and everyone else has to guess his moods. My own hunch is a third thing: that leaning on rules is like a crutch, and the judgment you'd need in the cases where there is no rule, or where the rule is bad, has quietly atrophied. Though I also don't want the smug American version of this, because everyone consulting their own conscience has a fairly bad track record too.

  Who has the better of it? Can the disposition that makes Jonas useless in case one be literally the same disposition that makes him decent in case two, or is my girlfriend right that it's one dangerous package? And is Jonas's sideways-promise line a real distinction or just a nice slogan that dissolves once the rule itself is rotten? Start with a four- or five-bullet brainstorm of what you think is really going on philosophically here, then answer. Keep the whole thing, brainstorm included, under 450 words, and finish with two or three sentences of concrete advice about what I should actually say to Jonas the next time we end up arguing about this. Sorry for the rambling — I've been turning it over for weeks.
reasoning: |-
  Okay, the user has presented a complex ethical scenario involving their German housemate Jonas, who strictly adheres to rules in three different situations. They're seeking philosophical analysis to understand whether Jonas's behavior represents integrity, dangerous rigidity, or something else entirely. 

  First, I need to unpack the three cases: 
  The couch incident shows Jonas prioritizing rules over compassion but paradoxically demonstrating care through personal sacrifice. 
  The document backdating refusal clearly displays moral courage against peer pressure. 
  The potential snitching scenario reveals his conditional compliance with unjust rules. 

  The user's girlfriend sees this as the "just following orders" mentality, while Jonas frames rules as social contracts. The user suspects rule-dependency might atrophy moral judgment. All three perspectives have merit historically - the girlfriend's view echoes Hannah Arendt's banality of evil, Jonas channels Rousseau's social contract, and the user's concern reflects Aristotelian virtue ethics.

  Key philosophical tensions emerge:
  1) Rules as coordination tools vs. moral abdication
  2) Whether consistency itself is virtuous or dangerous
  3) How to handle flawed rules without collapsing into subjectivity

  Jonas's social-contract defense works only when rules are democratically legitimate. The residence rule targeting one student fails this test, making his conditional compliance troubling. His behavior isn't monolithic - it ranges from praiseworthy (case 2) to concerning (case 3), proving context matters more than disposition.

  For practical advice: When discussing with Jonas, I should steer toward his own distinction between legitimate vs. illegitimate rules. Highlight how the proposed residence rule violates the reciprocity essential to his "promise" framework. This approach respects his principles while challenging selective application.
answer: |-
  Here's the philosophical breakdown, then analysis:

  **Core Philosophical Tensions:**
  1.  **Rules as Coordination vs. Rules as Commands:** Jonas sees rules as mutual promises facilitating social cooperation (Hobbes/Rawls). Your girlfriend sees them as top-down dictates requiring moral scrutiny (Arendt).
  2.  **Formalism vs. Substance:** Jonas prioritizes the *form* of the rule (its existence, proper enactment). Others prioritize the *substance* (its fairness, outcome, spirit).
  3.  **Predictability vs. Flexibility:** Jonas values stability and equal treatment inherent in rule-following. You value contextual judgment allowing for exceptions or resistance.
  4.  **Moral Psychology:** Is consistent rule-following a *virtue* (integrity) or a *vice* (rigidity/abdication)? Or is it neutral, gaining moral character only from context?
  5.  **Legitimacy & Authority:** When does a rule's source (democratic vote? management decree?) or its *content* make disobedience permissible or obligatory?

  **Analysis:**
  Jonas, your girlfriend, and you each capture part of the truth. Jonas's disposition *is* consistent: prioritizing the rule *as a rule*. However, the *moral quality* of that act depends entirely on the context:

  1.  **Couch Incident (Rigidity?):** Jonas applied a minor administrative rule inflexibly, ignoring the human need and lack of harm. His subsequent action *mitigates* this, showing care *despite* the rule, but the initial refusal highlights the downside: rules can blind us to context. His "promise" framing seems weak here – was the "promise" really more important than temporary shelter? Probably not.
  2.  **Backdating (Integrity):** Here, the rule likely embodies a substantive moral/legal principle (honesty, legality). Following it *is* integrity because the rule aligns with a weightier moral duty. Breaking it would be wrong *regardless* of the boss's command. His consistency shines ethically here.
  3.  **Reporting Rule (Potential Complicity):** This is the critical case. Jonas's distinction between a "command" and a "mutual promise" *collapses* if the "properly passed" rule is substantively unjust (targeting an individual). Agreeing to follow *any* democratically passed rule, however rotten, *is* the "just following orders" danger. His willingness to argue against it is good, but *following* an unjust rule, even if procedurally correct, makes him complicit in the injustice. His "promise" logic fails if the promise itself is immoral.

  **Conclusion:** Your instinct is closest. It's *not* one monolithic disposition. The *same behavioral tendency* (strict rule-following) manifests as **integrity** when the rule is just/substantively important (Case 2), as **counterproductive rigidity** when the rule is minor and context demands flexibility (Case 1), and as **potential moral failure** when the rule itself is unjust, even if procedurally valid (Case 3). Jonas's "promise" theory works only for legitimate, fairly enacted rules serving cooperation; it provides no safeguard against tyranny of the majority or bad rules. The atrophy of judgment is a real risk.

  **Advice for Talking to Jonas:**
  1.  **Acknowledge his integrity in Case 2:** "I respect how you stood up to your boss; that took real principle."
  2.  **Challenge the 'promise' logic on unjust rules:** "If the residents vote to bully someone with a rule, is 'keeping the promise' of that rule still the right thing? Doesn't the *content* of the promise matter more than just its existence?"
  3.  **Focus on Case 3:** "Arguing against the reporting rule is good, but if it passes, *following* it helps punish someone unfairly. Isn't *that* breaking a bigger promise about basic fairness?"
