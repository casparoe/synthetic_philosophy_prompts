prompt: |-
  I'm part of a small commission drafting a facilitator's handbook for a state-level citizens' assembly on assisted dying. The assembly's recommendations are formally non-binding, but the legislature has committed to putting them to a vote, so anything a participant says can end up shaping coercive law — indirectly, through two stages of delegation, with a facilitation norm that pushes participants toward unanimity rather than majority voting. The section I keep failing to write is the guidance on religious reasons. Two colleagues of mine — one a Rawlsian-flavored restrictivist who thinks citizens owe one another restraint in matters of coercion, the other an inclusionist who thinks a citizen may offer whatever actually grounds her political conviction — have been going back and forth about it for months, and I'd rather they produce a document than another round of emails. Please write the joint statement they could both sign at the end of a good-faith adversarial collaboration: not a verdict on who is right, and not a dramatized exchange, but the constructive text.

  Call the first position the restrictivist camp: roughly, that when a citizen advocates for a coercive law, or votes for one, she owes her fellow citizens a justification they can in principle assess, and that reasons whose force depends on a revelation or authority they do not share fail that test. Call the second the inclusionist camp: roughly, that such a duty either misdescribes democratic citizenship, or asks religious citizens to be alienated from their own deepest convictions, or rests on a religion/secularism distinction that does not survive scrutiny. Give me, first, a numbered list of claims both camps can actually sign — about coercion, about the difference between what a citizen may act on and what she may offer, about whether the relevant duty (if there is one) falls on voters, on advocates, on officials, or on the authors of an official rationale document, and about what an assembly's own unanimity-oriented facilitation norm does or does not add to the ordinary case. Do not let these be vacuous: each should be capable of being denied by someone.

  Then give me a disagreements table with these columns: the crux; the inclusionist claim in wording an inclusionist would accept; the restrictivist claim in wording a restrictivist would accept; a concrete case or piece of evidence both would agree bears on that crux; and what each side predicts about it in advance. Among the cruxes I want at least these four addressed. (1) Formulational: the requirement might be about the accessibility of a reason's epistemic warrant, about whether it is the kind of reason others could share, or merely about what it is permissible to adduce in public advocacy — and I suspect a good part of their quarrel dissolves once these are separated, so tell me which part you think is verbal and why. (2) The asymmetric-accessibility case: a small religious minority offers a reason the majority cannot assess, while the majority offers a secular reason resting on a contested social-scientific claim that the minority cannot assess; do the two norms treat these symmetrically, and if not, what work is the religion/secularism distinction really doing? (3) Testimony: a religious participant says, in effect, that she has a long track record of sound judgment on the common good and asks to be trusted that this policy serves it, while declining to share the revelatory ground on which she holds it; does that satisfy the norm, flout it, or change what the norm was about? (4) Integrity and uptake: whether the cost of restraint falls unevenly on religious citizens, and whether it is a moral wrong or an etiquette of civic friendship that is being violated — plus what each camp would count as evidence that religious reasons in deliberation entrench rather than open up discussion.

  Two constraints. First, the handbook is for facilitators with no philosophical training, so define any term of art you use and don't cite or gesture at the literature — I want the argument, not the bibliography. Second, close with a short section stating, for each camp, what single development — an argument, an institutional change, or an empirical finding about how assemblies actually deliberate — would most move it, and say whether there is anything both would agree would settle the matter. Aim for roughly 1,200 to 1,600 words, and write it so that neither of my colleagues would accuse you of having quietly adopted the other's framing.
reasoning: |-
  Okay, the user is part of a commission drafting a facilitator's handbook for a state-level citizens' assembly on assisted dying. They're stuck on the section about religious reasons in deliberation. Two colleagues with opposing views—one restrictivist (Rawlsian-inspired, advocating restraint in using religious reasons for coercive laws) and one inclusionist (arguing for full inclusion of whatever grounds a citizen's conviction)—have been debating this for months. The user wants a joint statement both can sign, not a verdict, but constructive text that moves past deadlock.

  First, I need to understand the core of their disagreement. The restrictivist believes that when advocating for coercive laws, citizens owe others justifications they can assess without sharing the same revelation or authority. The inclusionist argues this demand alienates religious citizens and the religion/secular distinction isn't clear. The user wants a numbered list of claims both can agree on, then a disagreements table addressing four key cruxes, and finally what would move each side.

  For the joint claims, I have to identify non-vacuous points both sides accept. Key areas include: coercion being special and needing stronger justification, the distinction between acting on reasons versus offering them in public deliberation, and that the duty applies differently to voters, advocates, officials, and rationale documents. Also, the assembly's unanimity norm adds pressure compared to ordinary voting, and facilitators should ensure all reasons are heard but guide toward shareable justifications for the final recommendation.

  Next, the disagreements table. Crux 1 is about formulation—whether the requirement is about accessibility of warrant, shareability, or admissibility. I'll argue part of their dispute is verbal because they might agree on excluding inaccessible warrants but disagree on what counts as accessible. Crux 2 is asymmetric accessibility: a minority's religious reason vs. majority's contested social science. The restrictivist sees asymmetry via the religion/secular distinction, while the inclusionist sees symmetry in inaccessibility. Concrete case: a small group citing scripture on suffering vs. majority citing debatable palliative care data. Each side predicts different outcomes if both are excluded or included.

  Crux 3 is testimony: a participant asking for trust based on track record without sharing revelatory grounds. Restrictivist says it flouts the norm because the warrant isn't accessible; inclusionist says it satisfies by offering a public reason (trustworthiness). Crux 4 covers integrity and uptake: whether restraint burdens religious citizens unevenly and if it's a moral wrong or civic etiquette. Evidence would be if religious reasons entrench discussions—restrictivist cites polarization, inclusionist says suppression entrenches more.

  Finally, what would move each side? For restrictivists, evidence that religious reasons in structured deliberation build mutual respect without coercion. For inclusionists, data showing restraint leads to alienation or disengagement. Both might agree if an assembly using their preferred norms produced recommendations seen as legitimate by all, including religious minorities.

  Constraints: no philosophical jargon, keep it accessible for facilitators. Ensure framing is neutral so neither colleague feels biased. Aim for 1200-1600 words. Need to present both sides fairly, using their own terms, and show where disagreements persist but also where common ground exists.
answer: |-
  ## Joint Statement on Religious Reasons in Deliberation (For Facilitator Handbook)

  We, representing contrasting perspectives on the role of religious reasoning in this Citizens' Assembly, recognize the profound importance and sensitivity of this issue. While our underlying philosophical commitments differ, we have sought common ground to provide clear, practical guidance for facilitators navigating discussions on assisted dying. Our goal is to support a deliberative process that is respectful, inclusive, and capable of producing recommendations worthy of legislative consideration, while acknowledging the unique context: participants' words shape potentially coercive law indirectly, and the facilitation norm prioritizes unanimity.

  **Agreed Foundational Claims (Non-Vacuous):**

  1.  **Coercion Demands Stronger Justification:** When advocating for laws backed by state coercion (like regulating assisted dying), citizens bear a heightened responsibility to offer justifications beyond mere personal preference. The potential for state force warrants reasons that engage fellow citizens seriously.
  2.  **Acting vs. Offering:** A citizen may *act* on (vote based on) any reason that genuinely motivates them, including deeply held religious convictions. However, the question of what reasons they *offer* to others in public deliberation to justify a coercive policy is distinct and carries specific responsibilities.
  3.  **The Duty's Target:** The duty concerning the *offering* of reasons applies most directly to:
      *   **Advocates:** Those actively arguing for a specific policy outcome within the assembly.
      *   **Authors of Shared Rationales:** Individuals contributing to the assembly's official report summarizing recommendations and justifications.
      *   **Officials:** While relevant, this assembly primarily concerns citizen participants, not elected officials.
      *   **Voters (Assembly Participants):** The duty applies *differently* here. While participants ultimately vote based on their conscience, the unanimity norm (see #5) places special weight on the *deliberative process* leading to that vote, making the quality of shared reasons offered paramount.
  4.  **Distinctiveness of Assembly Facilitation:** The facilitation norm pushing for *unanimity* (or strong consensus) significantly intensifies the importance of the *deliberative process* compared to simple majority voting. It requires facilitators to actively help participants articulate their views in ways that others might find intelligible and engage with, even if not ultimately persuasive, to build shared understanding. This doesn't abolish deep disagreement but aims for recommendations grounded in mutually recognized reasons where possible.
  5.  **Facilitator Role - Hearing & Shaping:** Facilitators must ensure all participants feel heard and can express the *full source* of their convictions (including religious ones) in initial explorations. However, facilitators also have a responsibility to gently guide participants, especially advocates and those shaping final rationales, towards articulating the *substance* or *implications* of their views in terms others might potentially engage with and assess, *because* of the goal of unanimity/report-writing and the coercive nature of the potential outcome. This is about fostering mutual understanding, not suppressing belief.

  **Persistent Disagreements: Key Cruxes**

  | Crux                                                                 | Inclusionist Claim (Acceptable Wording)                                                                                                                                 | Restrictivist Claim (Acceptable Wording)                                                                                                                                 | Concrete Case/Evidence                                                                                                                               | Inclusionist Prediction                                                                                                 | Restrictivist Prediction                                                                                                 |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- |
  | **1. Formulational: What *exactly* is the requirement?**             | The core requirement is *civility* and *accessibility*: reasons must be presented clearly and respectfully so others can understand *what* is being claimed. Focusing on the *kind* of reason (religious/non-religious) or its *source of warrant* is unnecessary and exclusionary. | The core requirement concerns *epistemic warrant accessibility*: Can others understand not just the *content* of the reason, but *how its truth or force is grounded* in a way they could potentially evaluate? Reasons whose force depends solely on inaccessible revelation or authority fail this. | **Case:** Participant A: "God forbids taking life, so assisted dying is wrong." Participant B: "My deeply held personal philosophy, formed through unique experiences unavailable to you, deems life sacred, so assisted dying is wrong." | **Verbal Aspect:** If the requirement is framed solely as civility/content-accessibility (Inclusionist), much debate vanishes. The deeper disagreement is whether warrant-accessibility is essential. | **Verbal Aspect:** Agrees defining requirement as *only* civility/content-accessibility resolves surface tension, but argues this misses the core democratic duty concerning justification for coercion. |
  | **2. Asymmetric Accessibility: Religious Minority vs. Secular Majority Claim** | If a majority relies on a contested social-scientific claim (e.g., "Studies show legal assisted dying reduces overall suicides") that a minority lacks expertise to assess, this is *functionally identical* to the minority offering a religious reason the majority cannot assess based on shared authority. Treating them differently unfairly privileges secular claims. | While both involve differing expertise, the contested social-scientific claim rests on *publicly accessible methods* (data, peer review, replicability) in principle open to scrutiny by anyone with relevant training/effort. Religious authority/revelation is inherently non-publicly accessible *by its nature*. The distinction matters for public justification. | **Case:** Small Group X cites a specific religious text's interpretation of suffering as redemptive to oppose assisted dying. Majority Y cites complex palliative care access data predicting harms they lack expertise to evaluate. | Predicts the restrictivist norm will *de facto* silence Group X while allowing Group Y's claim, seen as equally inaccessible to X, to stand unchallenged on accessibility grounds, demonstrating bias. | Predicts Group Y's claim, while complex, *could* be assessed by experts representing diverse views (called as witnesses), making its warrant *publicly accessible in principle*. Group X's warrant *cannot* be made publicly accessible. |
  | **3. Testimony: Trust Me, Based on My (Religious) Judgment**         | A citizen offering their track record of sound judgment on the common good and asking for trust on *this specific policy* based on that record, even if rooted in unshared religious conviction, provides a *public reason* (their reliability) that others *can* assess. This satisfies the norm. | This replaces the inaccessible *warrant* for the *specific policy claim* with an inaccessible warrant for the *claim about their own judgment*. Others cannot assess *why* they judge this policy serves the common good. It does not provide a reason others can engage with on the policy's merits; it asks for deference based on inaccessible authority. | **Case:** Participant: "Look at my lifelong public service record fighting for the vulnerable. Trust my judgment when I say, based on my faith, that this specific assisted dying proposal will harm the vulnerable. I cannot explain further." | Predicts this builds civic trust by leveraging a participant's known character and history, offering a tangible basis for others to consider, even if the ultimate source isn't shared. | Predicts this shuts down deliberation on the policy's merits. Others are asked to accept the claim based solely on deference to the speaker's private conviction, not a shared reason. |
  | **4. Integrity, Uptake, and Entrenchment**                           | Demanding religious citizens suppress the deepest sources of their moral convictions in public advocacy alienates them, imposes an unequal burden, and violates civic friendship by asking them to be inauthentic. It is a moral wrong. Suppression entrenches division by silencing core identities. Genuine uptake requires hearing the *full* reason. Evidence of entrenchment would be religious participants disengaging or feeling delegitimized. | The duty of restraint is not suppression but translation/engagement; it's an etiquette of civic friendship *required* when seeking collective coercion. The burden is shared – secular citizens must also justify policies without relying solely on inaccessible comprehensive doctrines. Violation is a civic failure. Evidence of entrenchment would be reliance *only* on inaccessible reasons shutting down dialogue, increasing polarization, or making consensus impossible. | **Case:** Observing assembly dynamics: Does discussion stall or polarize when deep religious reasons are introduced? Do religious participants report feeling excluded if asked to articulate secular implications? Does consensus-building become harder? Does the *absence* of explicit religious reasons lead some participants to disengage? | Predicts asking for restraint causes alienation and disengagement among religious participants (integrity cost). Predicts allowing full expression fosters mutual understanding and prevents resentment (prevents entrenchment). | Predicts deliberation bogs down or polarizes when based solely on inaccessible warrants, hindering consensus (entrenchment). Predicts skillful facilitation asking "What concerns does this raise for our shared society?" can open dialogue without alienation. |

  **What Could Move Each Perspective:**

  *   **For the Restrictivist Camp:** Evidence from similar assemblies showing that when participants are explicitly guided to articulate the *secular implications* or *publicly accessible concerns* (e.g., risks to the vulnerable, societal views on suffering) underlying their religious convictions, **without suppressing the origin of those convictions**, leads to:
      1.  Stronger perceived legitimacy of the final recommendations among diverse citizens.
      2.  Greater willingness of participants holding minority religious views to sign onto consensus reports.
      3.  More constructive dialogue and less polarization *during* deliberation, specifically because participants engage with shared concerns rather than clashing authorities.
  *   **For the Inclusionist Camp:** Evidence from similar assemblies showing that when explicitly religious reasoning forms the *primary public justification* for key recommendations in the final report:
      1.  Does **not** lead to increased alienation or delegitimization of the process among non-religious or differently religious citizens.
      2.  Religious participants report feeling *more* respected and authentically engaged, leading to higher satisfaction and willingness to compromise elsewhere.
      3.  Legislators and the broader public perceive recommendations primarily justified by specific religious doctrine as *more* legitimate and binding on the diverse polity.
  *   **Could Anything Settle It?** Both camps would likely agree that if a Citizens' Assembly conducted under *either* proposed norm (strong restrictivist or strong inclusionist) produced recommendations that were widely perceived as profoundly legitimate, respectful, and wise by the *entire* polity – including strong adherents of minority religions, the non-religious, and legislators across the spectrum – **and** participants universally reported a deeply authentic and constructive experience, this would constitute strong evidence for the effectiveness of that approach. However, both would also likely argue such an outcome is complex and depends on many factors beyond this single norm. There is no single "knock-down" piece of evidence likely accepted by both as definitive.

  **Conclusion for Facilitators:** Your role is complex. Honor the deep convictions participants bring, ensuring they feel heard. Simultaneously, gently guide the conversation towards articulating the values, concerns for others, and potential consequences for shared society that underlie *all* deeply held positions, religious or secular. Focus on fostering understanding of *what* participants believe the policy does (protect the vulnerable? affirm autonomy? respect divine authority?) and *why they believe it matters for our life together*. This approach, centered on mutual understanding and the search for shared or mutually intelligible grounds for potentially coercive policy, best serves the assembly's unique task of striving for unanimity and crafting recommendations for legislative consideration.
