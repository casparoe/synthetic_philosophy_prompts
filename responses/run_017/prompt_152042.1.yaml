answer: |-
  Your variant of the St. Petersburg paradox is a fascinating exploration of the limits of expected utility theory and the subtleties arising from non-absolutely convergent series in probability. It does indeed have connections to established literature, though it may not have a single widely recognized name. I'll address your questions systematically, drawing on decision theory, probability theory, and related philosophical discussions.

  ### Key Elements of Your Variant
  - **The game**: A fair coin is tossed until the first heads appears on toss \(n\). The payoff is \((-1)^{n-1} \cdot 2^n / n\), producing the sequence: \(+2\) (for \(n=1\)), \(-2\) (\(n=2\)), \(+8/3\) (\(n=3\)), \(-4\) (\(n=4\)), etc.
  - **Natural-order expectation**: Summed over \(n\), the expectation is \(\sum_{n=1}^{\infty} (-1)^{n-1} / n = \ln(2)\), the alternating harmonic series.
  - **Non-absolutely summable**: The absolute series \(\sum_{n=1}^{\infty} |(-1)^{n-1} / n| = \sum_{n=1}^{\infty} 1/n\) diverges (harmonic series), so the Riemann rearrangement theorem applies: the series can be rearranged to converge to any real number or diverge.
  - **Truncation**: Capping at \(N\) tosses (payoff 0 if no heads by \(N\)) yields the partial sum \(E_N = \sum_{n=1}^{N} (-1)^{n-1} / n\), which converges to \(\ln(2)\) as \(N \to \infty\), regardless of order (since finite sums commute).

  ### Established Name and Literature
  Your variant is closely related to discussions in decision theory and probability, often under the umbrella of **conditionally convergent expected utility** or **improper random variables**. While not as famous as the standard St. Petersburg paradox, it appears in contexts exploring:
  - **The St. Petersburg paradox with alternating signs**: This is sometimes called the "Alternating St. Petersburg" or "Conditional St. Petersburg" game in pedagogical or research settings. It highlights how conditional convergence (vs. divergence in the standard St. Petersburg) creates distinct issues.
  - **Riemann rearrangement in expectation**: Literature on non-absolutely convergent integrals/series in probability, e.g., in Billingsley's *Probability and Measure* or Fishburn's *Utility Theory for Decision Making*, discusses how expectation can depend on the order of summation when \(E|X| = \infty\).
  - **Relevance to utility theory**: Economists like Mark Machina and philosophers like Leonard Savage have analyzed such cases to critique unbounded utility functions or to argue for regularization (e.g., truncation or boundedness).

  This variant is more than a footnote to St. Petersburg—it sharpens the paradox by exposing how rearrangement threats arise even when partial sums converge nicely. However, it is not entirely novel; similar examples appear in exercises or asides in advanced texts (e.g., in Durrett's *Probability: Theory and Examples* or Kreps' *Notes on the Theory of Choice*).

  ### Distinctions in Expectation
  You are groping at a core distinction in probability theory between different types of "undefined" expectations:
  - **Infinite expectation (well-defined infinity)**: E.g., the standard St. Petersburg paradox, where \(E[X] = \infty\) and \(E|X| = \infty\). The divergence is unambiguous; the fair price is infinite.
  - **Non-existent expectation (no well-defined value)**: Your variant falls here. Since \(E|X| = \infty\) and the series is only conditionally convergent, the expectation does not exist in the Lebesgue sense. Rearrangement can yield any real value, so there is no unique "expected utility."
  - **Limit of partial sums exists, but integral fails**: The truncation \(E_N \to \ln(2)\) under the natural ordering, suggesting a limit-based value. However, this is not equivalent to the Lebesgue integral of \(X\), which requires absolute convergence for uniqueness. The partial-sum limit exists for the natural enumeration but not for others, while the integral fails due to non-integrability (\(X \notin L^1\)).

  ### Does Truncation Rescue \(\ln(2)\)?
  Yes, but only in a practical or pragmatic sense, not a theoretical one:
  - **Truncation argument**: By capping the game at \(N\) tosses, \(E_N\) is well-defined and converges to \(\ln(2)\). This respects the natural ordering and reflects real-world constraints (infinite games cannot be played). For any actual implementation, \(\ln(2)\) is the limiting fair price.
  - **Re arrangement argument denial**: The rearrangement theorem shows that the infinite series is order-dependent, so the expectation does not exist for the uncapped game. Truncation assumes a specific limiting process (sequential over \(n\)) that the rearrangement argument rejects—it denies that the natural ordering is inherently privileged.
  - **Resolution**: Truncation rescues \(\ln(2)\) as a *practical* expected value for finite or limits-of-finite cases. Theoretically, it does not justify \(\ln(2)\) as the unique expectation for the infinite game because rearrangement breaks the uniqueness.

  ### Real Moral: Where Does the Blame Lie?
  The issues stem from multiple interconnected foundations:
  1. **Definition of expectation**: In standard measure-theoretic probability (e.g., Kolmogorov), expectation requires \(E|X| < \infty\) (absolute integrability) to be well-defined and order-invariant. Here, \(E|X| = \infty\), so expectation is not defined. The moral is that we must insist on absolute convergence for expectations to avoid ambiguity.
  2. **Countable additivity**: This is not the culprit. The probability measure itself is countably additive, as \(\sum_{n=1}^{\infty} P(\text{first heads at } n) = \sum_{n=1}^{\infty} (1/2)^n = 1\). The issue is with the random variable \(X\) not being integrable, not with the measure.
  3. **Admissibility of unbounded utility**: Decision theory often restricts utility functions to be bounded to avoid such paradoxes (e.g., Savage's bounded utility principle). Your game shows why: unbounded utilities can lead to non-integrable expectations, making "fair price" ill-defined. Bounded utility would force finite \(E|X|\), resolving the issue.
  4. **Assumption that every gamble has a fair price**: This is challenged. When \(E|X| = \infty\), no unique fair price exists. The paradox forces us to reject this assumption or adopt regularization (e.g., truncation) for applied contexts.

  ### Connection to the Two-Envelope Paradox
  Your game shares similarities with the two-envelope paradox but differs in key ways:
  - **Similarities**: Both involve infinite expectations and sensitivity to "bookkeeping." In the two-envelope paradox, if the amount in the first envelope has an improper prior (e.g., an unnormalized distribution allowing arbitrarily large values), expected utility calculations can be manipulated, akin to rearrangement. Both highlight how infinities can invalidate naive expected value reasoning.
  - **Differences**: 
    - In the two-envelope paradox, the issue arises from an undefined prior distribution (e.g., uniform over infinite support), leading to inconsistent conditional expectations. Here, the distribution is well-specified (fair coin, geometric stopping time), but \(X\) is non-integrable.
    - The two-envelope paradox is fundamentally a decision problem (to switch or not) with a faulty use of expectation, while your variant is about defining expectation itself.
    - Both caution against unbounded utility, but your variant directly exposes conditional convergence, whereas the two-envelope paradox often involves improper integrals or priors.

  ### Conclusion
  Your variant is a valuable case study in the fragility of expected utility when absolute convergence fails. It sits near the St. Petersburg paradox but emphasizes conditional convergence over divergence. The truncation argument provides a practical resolution (\(\ln(2)\) as the fair price for finite cases), while rearrangement shows the theoretical inadequacy for the infinite game. Ultimately, the moral lands on the definition of expectation: it must require \(E|X| < \infty\) for coherence, or decision-makers must bound utilities/truncate games. This is not just a mathematical curiosity—it underscores why bounded utility is often assumed in economic theory.

