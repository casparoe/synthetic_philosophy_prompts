prompt: |-
  I have been asked to contribute a short position piece to a graduate workshop on the ethics of migration, and before I commit the view to print I would like an audit of whether the parts fit together. My position is the following.

  (1) Coercively keeping a peaceful person out of a territory is a serious moral act rather than a mere failure to aid; there is a strong pro tanto presumption against it, and the burden of justification lies with the excluder and must be dischargeable to the person excluded.

  (2) I reject the club analogy and the joint-ownership analogy: whatever right to exclude exists cannot be derived from the associational choices of individual members, nor from a group's property-like relation to a territory.

  (3) I nevertheless take freedom of association seriously as a non-instrumental personal-liberty right — there is something a person is owed in being able to decline association, including economic association — and partly for that reason I resist arguments that simply aggregate the interests of natives and of migrants into one impartial sum.

  (4) Because (2) removes the individualist grounds, I want to locate any right to exclude in something collective: a people's interest in self-determination, understood as shaping the terms of their common life.

  (5) I also want to allow that a state may give some weight to the interests of its own members over those of foreigners; partiality is not simply corruption.

  (6) A distinction I have been trying to make work in my own writing: whether a given exclusion is permissible is not separable across time. Holding fixed both the applicant's claims and the present circumstances, a polity that has admitted very many people over the preceding decade may permissibly refuse the next applicant in virtue of what it has already done. Call this path-dependence in the right to exclude.

  (7) Two case verdicts. A state whose own past extractive or colonial policies foreseeably produced an applicant's reasons for seeking entry has a diminished right to exclude that applicant. But I do not want this to generalize into a diminished right to exclude everyone in comparable material need.

  Go through these pair by pair and tell me which conflicts are real and which only look like conflicts, ranked by how much damage each does to the package as a whole; for each real conflict, say what would have to be given up and what that costs me elsewhere in the set. I do not know myself where the fault line lies, so do not assume I have diagnosed it, and tell me whether the set can be repaired by a single revision or needs two. Argue from the commitments themselves — I am not asking who has defended which view.
reasoning: |-
  Okay, the user is asking for an audit of their position on migration ethics. They've outlined seven points and want to know which parts conflict, how severe the conflicts are, and how to fix them. Let me start by understanding each point thoroughly.

  First, point (1) says coercively excluding peaceful people is a serious moral act with a strong presumption against it. The burden of justification is on the excluder. That sets a high bar for exclusion. 

  Point (2) rejects club and joint-ownership analogies. So, exclusion can't be based on individual members' choices or group property rights. That means the usual justifications for exclusion are off the table. 

  Point (3) emphasizes freedom of association as a personal liberty right. The user doesn't want to aggregate interests impartially, valuing individuals' right to decline association. But how does this fit with (1)? If individuals can decline association, does that extend to the state excluding migrants? But point (2) already rejected that. Hmm, potential conflict here.

  Point (4) locates the right to exclude in collective self-determination. Since individualist grounds are out, the group's interest in shaping their common life is key. But self-determination might clash with the presumption against exclusion in (1). How strong is this collective right? 

  Point (5) allows partiality towards members. States can prioritize their own. But (1) requires justification to the excluded person. If partiality is acceptable, does that meet the burden? Maybe, but it could weaken (1)'s presumption.

  Point (6) introduces path-dependence. Past admissions affect current exclusion decisions. This seems practical, but does it conflict with the strong presumption in (1)? If a state has admitted many, refusing the next might be okay, but is that fair to the current applicant? The burden of justification still applies, but the justification now includes historical context.

  Point (7) reduces the right to exclude for states with colonial pasts affecting specific applicants. But the user doesn't want this to extend to all in material need. So, only specific historical wrongs matter, not general need. How does this mesh with (1)? The burden might be harder to meet for such states, but (7) limits it to specific cases.

  Now, looking for conflicts. The big one seems between (1) and (4). (1) sets a high bar for exclusion, while (4)'s self-determination might be used to justify exclusion more easily. If self-determination is too broad, it could override (1)'s presumption, making the burden too easy to meet. That's a core tension.

  Another conflict is between (2) and (3). (2) rejects individual associational rights as grounds for exclusion, but (3) upholds freedom of association as a personal right. If individuals have that right, why can't the collective exercise it? The user needs to explain why the collective right in (4) is different and doesn't stem from individual rights.

  (3) and (5) might clash with (1). Prioritizing members' interests (partiality) and valuing freedom of association could conflict with justifying exclusion to the migrant. The user must ensure that partiality and freedom of association don't undermine the burden of justification.

  (6)'s path-dependence might conflict with (1) if the historical context becomes an excuse without strong justification. But if integrated carefully, it could be part of meeting the burden. (7) has a similar issue; limiting responsibility to specific historical wrongs might seem arbitrary without a clear principle.

  Repair strategies: To fix the (1)-(4) conflict, clarify that self-determination must meet the high burden in (1). Maybe constrain it to core aspects of collective life, making exclusions harder to justify. For (2)-(3), argue that collective self-determination isn't an aggregation of individual choices but a distinct value. This preserves both but requires careful definition.

  The user needs to reconcile partiality (5) and path-dependence (6) with the strong presumption against exclusion. Ensure that these factors are part of the justification presented to the migrant, not just internal preferences.

  Overall, the main repairs involve refining how self-determination and partiality interact with the burden of justification. Tightening the scope of self-determination and explaining the non-aggregative approach in (3) can reduce conflicts. Most conflicts can be resolved by clarifying and qualifying the principles rather than abandoning any point.
answer: |-
  Here's a systematic audit of potential conflicts within your position, ranked by severity of damage to the coherence of the package. The core tension lies between the strong presumption against exclusion and the collective grounds for justifying it.

  **Ranked Conflicts & Repairs:**

  1.  **The Core Conflict: (1) vs. (4) & (5) - Presumption vs. Collective Justification & Partiality**
      *   **Conflict:** (1) establishes a very high bar for exclusion: a *strong pro tanto presumption against it*, with the *burden of justification lying squarely on the excluder*, and crucially, *justification must be dischargeable to the person excluded*. (4) grounds the right to exclude in collective self-determination ("shaping the terms of their common life"), and (5) explicitly allows partiality (prioritizing members' interests). The conflict is whether justifications based *primarily* on collective self-determination and partiality can meet the demanding standard set by (1), *especially* being "dischargeable to the person excluded."
      *   **Why it's Damaging:** This is the central fault line. If "self-determination" and "partiality" are interpreted too broadly or subjectively by the excluding polity, they could easily swamp the strong presumption, effectively rendering (1) toothless. How do you convincingly explain to a peaceful migrant facing coercive exclusion that "our desire to shape our common life in a way that doesn't include you specifically, and our preference for our own members' interests, outweighs your claim to enter"? This justification risks sounding like the very associational or ownership claims rejected in (2), or simply an assertion of preference that fails the "dischargeable to the excluded" test. It potentially reduces the "strong presumption" to a minor procedural hurdle easily cleared by invoking "self-determination."
      *   **Repair Required:** You **must** constrain and define the scope of "self-determination" under (4) and "partiality" under (5) much more rigorously to withstand the scrutiny demanded by (1). Specify *what kinds* of collective interests related to self-determination are weighty enough to override the presumption (e.g., perhaps only threats to fundamental institutions, vital cultural practices under genuine threat, or severe distributive crises directly caused by past admissions). Limit "partiality" to contexts where it serves a legitimate collective self-determination goal, not just any preference. Emphasize that self-determination *itself* entails obligations, including justifying exclusionary actions to those affected.
      *   **Cost:** Constraining self-determination/partiality makes them less potent justifications, potentially forcing you to accept more admissions than a looser interpretation would allow. It moves away from a purely discretionary conception of self-determination.

  2.  **Conflict: (2) vs. (3) - Rejecting Associational Analogy vs. Upholding Freedom of Association**
      *   **Conflict:** (2) explicitly rejects deriving exclusion rights from *individual* associational choices (the club analogy) or group property ownership. However, (3) strongly endorses freedom of association (FoA), including *economic* association, as a fundamental non-instrumental personal liberty right. The conflict arises because FoA for individuals inherently includes the right to *decline* association. If individuals have this strong right, why doesn't the collective (the "people") have a derivative or analogous right to decline association with outsiders? Rejecting the club analogy while upholding strong individual FoA seems inconsistent.
      *   **Why it's Damaging:** It creates a logical gap. If individual FoA is so fundamental, its absence at the collective level for the core issue of territorial association requires a compelling explanation. Failure to provide this makes (2) look arbitrary and undermines the coherence of grounding exclusion solely in collective self-determination (4) instead of some aggregation of individual associational rights.
      *   **Repair Required:** You need a **clear distinction** between the *nature* of individual and collective association. Argue that individual FoA protects intimate, personal choices against *intrusive demands for connection*. Collective "association" regarding territorial admission, however, involves coercive state power, impacts fundamental rights of outsiders (as per (1)), and concerns the basic structure of society – making it qualitatively different. Emphasize that the *collective's* right (if it exists) stems from the distinct value of collective self-governance over shared institutions and territory (linking to (4)), *not* from aggregating individual rights to shun others. The collective right is sui generis.
      *   **Cost:** It requires careful philosophical work to defend the distinctness of the collective right without relying on individual associational rights. It might make the collective right seem less intuitively grounded than individual FoA.

  3.  **Tension: (3) & (5) vs. (1) - Non-Aggregation/Partiality vs. Burden on Excluder**
      *   **Conflict:** (3) rejects simple aggregation of interests and upholds individual FoA (implying natives' interests/disassociation preferences matter distinctly). (5) explicitly endorses partiality. However, (1) places the burden of justification *on the excluder* and requires it be *dischargeable to the excluded*. There's a tension between justifying exclusion based *heavily* on the distinct value of *natives'* preferences/interests/FoA (protected by (3) & (5)) and making that justification compelling *to the migrant*.
      *   **Why it's Damaging (Less than Core):** It risks making the justification seem parochial or self-serving from the migrant's perspective. "We get to keep you out because we prefer our own and value *our* freedom not to associate with *you*" directly invokes the kinds of claims that motivate (3) & (5), but may fail the "dischargeable to the excluded" requirement in (1), as it offers no reason *they* must accept beyond the polity's preference. It highlights the challenge of reconciling partiality with justifying coercion to an outsider.
      *   **Repair Required:** Integrate the concerns of (3) and (5) into the *constrained* conception of self-determination under (4). Don't present "we prefer our own" or "we don't want to associate" as standalone justifications. Instead, argue that legitimate self-determination *within bounds* inherently involves making decisions reflecting the life, values, and interests of the collective, which includes prioritizing members *in certain contexts* (e.g., distributive schemes, public goods provision) essential to that self-determined life. Frame the justification as "to sustain *this* self-determining community and its essential projects/provisions, which require X, Y, Z limitations on new members at this time," rather than "we like us more than you." This connects partiality and non-association to the collective project defined in (4).
      *   **Cost:** It subordinates the direct expression of partiality and individual FoA *as grounds for exclusion* to the broader, constrained goal of collective self-determination. Partiality becomes an *aspect* of self-determination, not a freestanding justification.

  4.  **Tension: (6) Path-Dependence vs. (1) Presumption & Applicant Claims**
      *   **Conflict:** (6) states that past admissions legitimize refusing a *current* applicant with identical claims/present circumstances. (1) emphasizes the seriousness of coercive exclusion *against this specific peaceful person* and places the burden on justifying *this* act. Path-dependence seems to introduce a justification based on *past actions towards others*, not directly related to the *current* applicant's claim or the *current* act of exclusion.
      *   **Why it's Damaging (Least Severe):** It risks making the justification to the *current* applicant feel unfair: "We have to exclude *you* because we were generous to *others* before." It could be seen as weakening the force of the presumption and the focus on the specific act/claim in (1) by allowing history to override otherwise identical present claims.
      *   **Repair Required:** Frame path-dependence as an essential aspect of the *collective capacity* required for legitimate self-determination (linking to (4)). Argue that self-determination requires control over the *pace* and *scale* of change to integrate newcomers and manage societal resources/institutions effectively. Refusing an applicant *now* isn't primarily about *them* being less deserving than past applicants, but about the *collective* needing time to absorb previous cohorts and maintain the functional capacity necessary for its self-determined existence. The justification *to the applicant* becomes: "To preserve the functional integrity and self-governing capacity of this community, which has recently absorbed many new members, we must pause further admissions at this time, even though your claim is strong." This connects path-dependence to the core justification in (4).
      *   **Cost:** It requires accepting that the collective's historical choices create legitimate constraints on its obligations to *new* applicants, potentially making the right to exclude seem more contingent and less tied solely to the present moment/applicant.

  5.  **Tension: (7) Colonial Responsibility vs. (5) Partiality & (4) Self-Determination**
      *   **Conflict:** (7) creates a specific exception: diminished right to exclude victims of the state's *own* past extractive/colonial policies. However, it explicitly rejects generalizing this to material need. This creates a tension with (5) (partiality) and (4) (self-determination). Why should past wrongs *specifically* (and narrowly defined) override partiality and self-determination, while general material need (which might be equally severe, even if not directly caused) does not?
      *   **Why it's Manageable:** This is the least damaging tension. It's a specific normative carve-out based on *rectificatory justice* for harm *directly inflicted* by the excluding polity. This is distinct from general distributive obligations (partiality) or the core right of self-determination. The limitation (not generalizing to material need) is crucial to contain it. It doesn't fundamentally contradict (4) or (5), but creates a specific *countervailing obligation* that can override them *in these specific cases*.
      *   **Repair Required:** Ensure the justification for (7) rests *solely* on the specific moral logic of rectification for direct harm caused, distinct from general distributive duties or self-determination claims. Emphasize that the *polity itself* is the *perpetrator* (or inheritor of the perpetrator state) regarding *this specific applicant*. This grounds the exception firmly in corrective justice, not undermining the general principles of (4) and (5). The "diminished right" stems from a prior *violation* of obligation by the polity, weakening its standing to now assert its self-determination or partiality against this victim.
      *   **Cost:** Requires careful definition of "own past extractive or colonial policies" and "foreseeably produced... reasons for seeking entry" to prevent over-extension. Needs robust argument why *this* type of causal responsibility creates a special obligation that general affluence/poverty does not.

  **Overall Assessment & Repair Strategy:**

  *   **The Core Problem:** The package is **salvageable but requires significant repair**, primarily centered on resolving the **severe conflict between (1) and (4)/(5)**. This is the linchpin.
  *   **Fault Line Diagnosis:** The fundamental tension is between the **high justificatory burden placed on coercive exclusion (1)**, demanding reasons acceptable to the excluded, and the desire to ground exclusion in **collective self-determination (4)** and **partiality (5)**, which inherently prioritize the interests and preferences of the existing members over the outsider.
  *   **Repairs Needed:**
      1.  **Major Revision:** Sharply define and **constrain the scope of "self-determination" (4) and "partiality" (5)** to only those collective interests sufficiently vital and specific to override the strong presumption in (1). Articulate *why* these constrained interests can form part of a justification potentially "dischargeable to the excluded" – likely by linking them to the functional prerequisites of *any* viable self-determining community (e.g., basic institutional integrity, essential resource sustainability, preservation of genuinely threatened core cultural practices essential to identity). This revision is non-negotiable for coherence.
      2.  **Clarification:** Provide a **robust distinction** between individual freedom of association (3) and the collective right to exclude (4), explaining why the latter cannot be derived from the former and has a different foundation (collective self-governance over territory/institutions).
      3.  **Integration:** **Reframe partiality (5) and path-dependence (6)** as aspects *within* the constrained conception of self-determination (4), not independent justifications. Explain how they serve the goal of maintaining a viable, self-governing community.
      4.  **Maintain:** The core of (1), (2), (3), and the specific carve-out in (7) can stand, but their interpretation is shaped by the revisions above. (7)'s limitation (no generalization) is crucial.

  **Conclusion:** Your position is philosophically ambitious and highlights important tensions in migration ethics. Its primary vulnerability lies in the potential for an overly permissive interpretation of "self-determination" and "partiality" to eviscerate the strong presumption against exclusion. **The single most critical revision is rigorously defining and limiting the scope of the collective self-determination and partiality arguments used to justify exclusion, ensuring they meet the high justificatory bar set by (1), particularly the requirement to be dischargeable to the excluded.** Successfully doing this will resolve the most damaging conflicts and lend coherence to the entire package. The other tensions identified require clarification and careful framing but are less fundamental threats to coherence.
