  Case B: The Two Centres
  - Two identical instantiations in Reading and Inverness. Each can press a button. If exactly one presses, £1,000,000 to the common pot (or per instantiation to local budget in a variant). Pressing costs nothing.

  Case C: The Retrofit (in Case A)
