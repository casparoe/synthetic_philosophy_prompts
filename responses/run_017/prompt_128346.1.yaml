  We start with the agreed claims.

  Agreed Claims (Section 1):

  We list claims that both sides agree on. They should be substantive.

  1. In all cases, the trustee is a rational agent whose goal is to maximize the expected value of the endowment (or local budget, as specified) from an ex ante perspective, before any information is received that might indexically distinguish it from other instantiations or simulations.

  2. The source code of the trustee is known to all parties, and any copies or simulations are exact and run in environments that are identical in all relevant respects (except for indexical information, when it exists).

  3. There are no causal channels between separate runs or instantiations; any correlation between their actions is due to the common decision procedure and input.

  4. Money is denominated in a single endowment pot unless stated otherwise. In the variant of Case B where the prize is paid per instantiation to a local budget, we treat this as a different scenario and note that the trustee's goal must be clarified (see point 8).

  5. The trustee's prior over the bit B in Case A is 1/2, and B is a logical fact that is in principle computable but currently unknown. The trustee's actions do not causally influence B.

  6. In Case A, the simulation run yesterday was an exact copy and was presented with the same choice (pay £1,000 or decline) as the trustee today in the branch where it is asked.

  7. In Case B, the two instantiations are identical and cannot communicate. They have no information to distinguish between Reading and Inverness.

  8. The trustee's goal is to maximize the expected endowment. However, in the variant of Case B with local budgets, the trustee must have a defined utility function over the distribution of money. We agree that if the prize is paid per instantiation to the local budget, then each instantiation should care only about its own local budget (unless the trustee was designed to care about the aggregate). This is a question about the trustee's purpose, not about decision theory per se. Both decision theories require a specification of the utility function.

  9. A decision theory is a systematic way of choosing actions to maximize expected utility. It is evaluated by whether it leads to the best outcomes in the situations it faces.

  10. Money-pump arguments and "why aren't you rich?" arguments are relevant for evaluating decision theories because they can reveal dynamic inconsistencies or predictably poor outcomes. However, they are not always decisive because they may rely on specific assumptions about the availability of binding commitments or the structure of the interaction.

  11. The criticism "you should have bound yourself in advance" is a remark about an agent's available options and the benefits of precommitment. It is not, in itself, a criticism of a decision theory because a decision theory must prescribe how to act in the current situation. However, a decision theory that consistently prescribes actions that are ex ante suboptimal may be failing in a systematic way.

