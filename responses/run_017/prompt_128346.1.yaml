    Perhaps the bit B is used to determine whether the agent is the simulation or the trustee, but that doesn't work because the simulation is run yesterday and B is fixed after.

    I recall a standard test case for UDT vs CDT: the XOR blackmail.

    Perhaps Case A is intended to be like that. Let me try to find the disagreement.

    The source says: "Both camps stipulate that the trustee's prior over B is one half, that B is in no way causally influenced by what the trustee does, and that B is in principle computable."

    And: "If B takes one value, the trustee is never asked anything and the matter closes with whatever sum was deposited. If B takes the other value, the trustee is asked, and it knows which branch it is in"

    So the trustee in the asking branch knows that B is the value that triggers the asking, and it knows whether the million was deposited or not. It does not know what the simulation did, but it knows whether the million was deposited, which is equivalent to knowing what the simulation did.

    So in state T, the trustee knows:
    - If the million was deposited, then the simulation paid.
    - If not, the simulation declined.

    And it knows that its own action has no causal effect on the million.

    So in state T, if the million was deposited, then paying £1,000 would only lose £1,000. If the million was not deposited, then paying £1,000 would only lose £1,000 too. So it should never pay in state T.

    In state S (simulation), if it pays, it costs £1,000 and causes a million to be deposited. If it declines, nothing. So it should pay.

    Agreement.

    So perhaps the disagreement is in Case B and Case C.

    Let's move to Case B.

    Case B: The Two Centres.

    Two instantiations, identical, cannot communicate. Each can press or not. If exactly one presses, then £1,000,000 to the common pot. Pressing costs nothing.

    UDT: The agent should choose a policy for both instantiations. Since they are identical and have the same information, they will do the same thing. If both press, then both or neither -> no prize. If both don't press, no prize. So they cannot get the prize. So the policy doesn't matter; both pressing and both not pressing have the same outcome: 0.

    CDT: Each instantiation, when run, must choose to press or not. If it presses, what happens? It doesn't control the other. If the other presses, then both press -> no prize. If the other doesn't press, then only this one presses -> prize. Since the other is identical, it will do the same as this one. So if this one presses, the other presses too -> no prize. If this one doesn't press, the other doesn't either -> no prize. So pressing or not doesn't matter, expected utility 0.

    So both theories agree that the instantiations can press or not; it doesn't matter.

    But wait, there is a mixed strategy? But the decision procedure is deterministic. Or it could use a random number generator. But the case doesn't specify.

    If the policy is to press with probability p, then the probability that exactly one presses is 2*p*(1-p). This is maximized when p=0.5, and then the expected utility is 2*0.5*0.5*1,000,000 = 500,000.

    So ex ante, the best policy is to press with probability 0.5.

    But then, when an instantiation is run, it will press with probability 0.5. If it presses, the expected utility is: probability the other doesn't press times 1,000,000 = (0.5)*1,000,000 = 500,000. If it doesn't press, expected utility 0. So it should press? But then p=1, which is not 0.5.

    This is the coordination problem. UDT says: choose the policy (p) that maximizes the ex ante expected utility. The ex ante expected utility is 2*p*(1-p)*1,000,000. This is maximized at p=0.5, with value 500,000.

    CDT, when an instantiation is run, would model the other as using the same decision procedure. If this instantiation decides to press, then because the other is identical and has the same input, it will also decide to press. So if this one presses, both press -> utility 0. If this one doesn't press, both don't press -> utility 0. So CDT is indifferent. It might as well use a random bit.

    So UDT recommends setting the policy to p=0.5, and then each instantiation follows that policy by randomizing. CDT, at the time of decision, sees no causal effect of pressing ( because it causes the other to press too? No, it doesn't cause, but it is correlated. CDT, being causal, ignores the correlation. So CDT says that pressing and not pressing have the same expected utility, so it is indifferent.

    So the disagreement is that UDT says the agent should adopt a policy of randomizing with p=0.5, while CDT says that at the time of decision, there is no reason to press, but also no reason not to, so it might randomize or not, but it doesn't see a reason to choose p=0.5 specifically.

    But CDT can also adopt a mixed strategy if it is indifferent.

    The key is that UDT explicitly chooses the policy at the ex ante stage to optimize, while CDT chooses the act at the current stage.

    In the ex ante stage for Case B, before the instantiations are run, UDT chooses p=0.5 to maximize expected utility. CDT doesn't have an ex ante stage; it only has the current decision. But the current decision, when run, is in a situation where it is indifferent, so it can randomize. But it doesn't have a built-in randomize with p=0.5. It might use any p.

    So the expected utility might be less than 500,000 if the CDT agent uses a different p.

    So UDT will achieve the maximum 500,000, while CDT might not, if it doesn't randomize with p=0.5.

    But CDT can be designed to randomize when indifferent. However, UDT actively chooses the best p.

    Now, the variant: if the prize is paid per instantiation to a local budget.

    Then, if exactly one presses, each gets £1,000,000 in their local budget.

    Then, from the perspective of an instantiation, if it presses, and the other does not, it gets £1,000,000. If both press or both don't, it gets 0.

    UDT: The policy is chosen ex ante to maximize the expected utility of the whole. But now the utility is per instantiation. So the ex ante expected utility for an instantiation is: 
    - If both follow policy press with probability p, then the probability that it is the only one pressing is p*(1-p), so expected utility: p*(1-p)*1,000,000.
    This is maximized when p=0.5, with value 0.25 * 1,000,000 = 250,000.

    But UDT might be applied to the whole system. Since the two instantiations are copies of the same agent, UDT might take the perspective of the programmer: choose the policy that maximizes the expected sum of utilities or the average utility.

    If the trustee is for the common good, it should maximize the total utility. If the prize is per instantiation, then total utility is 2,000,000 if exactly one presses, 0 otherwise. So expected total utility: 2*p*(1-p)*2,000,000? No, if exactly one presses, each gets 1,000,000, so total 2,000,000. The probability of exactly one pressing is 2*p*(1-p), so expected total utility: 2*p*(1-p)*2,000,000 = 4,000,000 * p*(1-p). This is maximized at p=0.5, with value 1,000,000.

    Alternatively, if each instantiation is self-interested, then UDT might not be applied at the system level. This is the question about what the trustee is for.

    The agreed claims say: the trustee must have a defined utility function.

    In the variant, if the prize is to the local budget, then each instantiation cares only about its own local budget. But they are both using the same decision procedure.

    UDT: from the ex ante perspective of one instantiation, before knowing which one it is, the expected utility is: with probability 1/2 it is the Reading one, with probability 1/2 Inverness. But since the environments are identical, it is symmetric. The ex ante expected utility for one instantiation is as above: p*(1-p)*1,000,000.

    So it would choose p=0.5 to maximize its expected utility.

    CDT: when run, the instantiation knows that the other is identical. If it presses, then the other will do the same, so both press -> it gets 0. If it doesn't press, both don't -> it gets 0. So it is indifferent. It might randomize.

    So again, UDT actively sets p=0.5, while CDT may not achieve the maximum expected utility for the agent.

    Now, Case C: the retrofit in Case A.

    In Case A, at the moment the trustee is asked (in state T), it may pay £100 to delete its interim evidence and hand the decision to a policy registered before B was resolved.

    In state T, the trustee knows that the simulation has already run and that the million was deposited if the simulation paid. It also knows that it is in the asking branch.

    If it pays £100 to delete its evidence, then it reverts to the policy that was set before B was resolved. What would that policy be?

    At the policy registration stage (before B was resolved), the agent sets a policy for if it is asked. But at that stage, it doesn't know whether it will be in state S or state T. In our earlier setup, state S and state T are different information states, so the policy must be defined for both.

    But in Case C, only the trustee in state T has the option to retrofit.

    After paying £100, it forgets that it is in state T and reverts to the policy for the "asked" state without the additional evidence. That is, it reverts to state S's information state.

    So in state T, if it pays £100, it will then act as if it were in state S: it will pay £1,000 because in state S, it is optimal to pay (because it might be the simulation).

    But in state T, it knows that it is not the simulation, so paying £1,000 would be a waste. So it would not want to do that.

    However, by paying £100 to delete evidence, it causes itself to pay £1,000, which is bad.

    But why would it do that? Only if the ex ante policy recommended it.

    UDT: at the ex ante stage, the agent chooses a policy for all information states, including whether in state T to retrofit or not.

    The ex ante expected utility of a policy includes the possibility of retrofitting.

    Let's denote the policy at the ex ante stage as:
    - In state S: action A_S (pay or decline)
    - In state T: action A_T (pay or decline) and also whether to retrofit or not.

    But retrofit is only available in state T.

    So the policy must specify for state T: whether to retrofit and then what to do in the state-S-like state, or not retrofit and then what to do in state T.

    To simplify, the policy can be:
    - In state S: do X.
    - In state T: either 
          (a) not retrofit and do Y, or 
          (b) retrofit (pay £100) and then do what the state-S policy says (X).

    So the options are (X, Y) for (state S, state T without retrofit) or (X, retrofit) for state T.

    But then the ex ante expected utility can be computed for each choice of X and Y and whether to retrofit in T.

    We know from before that the best (X, Y) is (pay, decline) with expected utility 999,000.

    If in state T it chooses to retrofit, then it will do X (pay) in state T after paying £100. So the endowment will be: the simulation did X (state S action), so if X=pay, then the million is deposited (minus simulation's £1,000), and in state T, it pays £100 to retrofit and then pays £1,000, so total cost in state T: £1,100. So if X=pay, then in state T: endowment = 1,000,000 -1,000 -1,100 = 997,900 if B=1, and if B=0, just 999,000. Expected: 0.5*999,000 + 0.5*997,900 = 998,450.

    If X=decline, then in state S: no million, no cost. In state T: retrofit cost £100 and then does X=decline, so cost £100. If B=1, endowment = -100, if B=0, 0. Expected: 0.5*0 + 0.5*(-100) = -50.

    So the best policy without retrofit in T is (X=pay, Y=decline) with expected 999,000.
    With retrofit in T, the best is to set X=pay, and then in T retrofit, but that gives only 998,450, which is worse than 999,000.

    So UDT would not choose to retrofit.

    CDT in state T: it knows that if it does not retrofit, it can decline and lose nothing (or if it pays, lose £1,000). If it pay, it's bad. So it would choose to decline.

    If it retrofits, it will then pay £1,000, which is bad, and also pay £100, which is worse. So it would not retrofit.

    So both agree.

    Where is the disagreement?

    Perhaps in the standard XOR black or medical Newcomb's problem.

    Let me try a different interpretation of Case A, inspired by the medical Newcomb's problem.

    Suppose that the benefactor uses the bit B to decide whether to run the simulation or not. But the case says the simulation was run yesterday, before B is fixed.

    Perhaps B is used to determine whether the trustee is the simulation or the real one. But then the simulation is run conditionally on B.

    But the case says: the simulation was run yesterday, and then B is fixed.

    I think we must conclude that in the given cases, there is agreement, but that is not what the journalist wants.

    Perhaps in Case A, the simulation and the trustee in the asking branch are not distinguished, and the agent in state T does not know that the simulation has already been run. But then it's the same as state S.

    But then, as above, both UDT and CDT would choose to pay.

    So the only disagreement we have is in Case B, where UDT actively sets a mixed strategy while CDT may not achieve the optimum.

    And in the variant of Case B with local budgets, UDT for the agent's own utility sets p=0.5, while CDT is indifferent.

    For the joint statement, we can still proceed with the cases as given and note the agreements and the disagreement in Case B.

    Let's assume that in Case A, the intended disagreement is not materializing, so we focus on Case B for the disagreement.

    Now, the journalist wants a disagreements table with several cruxes.

    We list the cruxes.

    Crux 1: What is the object of rational evaluation: the act or the policy?

    - UDT: The policy.
    - CDT: The act in the current situation.

    Bearing: General, and Case B.

    Predictions: 
      - UDT predicts that by choosing a policy of randomization with p=0.5 in Case B, they achieve an expected utility of 500,000 for the common pot, while CDT, by evaluating acts at the time of decision, may not achieve this because it is indifferent and might not randomize or might randomize with a different probability.
      - CDT predicts that in Case B, at the time of decision, there is no causal benefit to pressing, so it is rationally permissible to do either, and it is not required to randomize with p=0.5. The ex ante optimum is not the concern of the agent at the time of decision.

    Crux 2: Are the outputs of other computations implementing the same decision procedure things one controls, or merely correlated events?

    - UDT: The agent controls the outputs of all copies/simulations because they are determined by the policy that the agent chooses. Therefore, the agent can coordinate with its copies.
    - CDT: The outputs of other computations are merely correlated events; the agent only controls its own output. Therefore, in Case B, one instantiation cannot cause the other to do something different.

    Bearing: Case B.

    Predictions:
      - UDT: In Case B, by choosing a mixed strategy, the agent coordinates with its copy to achieve the optimum.
      - CDT: In Case B, each instantiation can only control its own action, and since the other will do the same, there is no way to achieve the prize.

    Crux 3: Is indexical information admissible evidence in decision-making?

    - UDT: Indexical information (such as "I am in Reading") should not be used if it breaks the symmetry that the policy relies on. The ex ante perspective is before indexical information.
    - CDT: Indexical information is part of the current situation and must be used. However, in Case B, indexical information is not available (both instantiations are identical), so it doesn't arise.

    Bearing: Case B and its variant with local budgets.

    In the variant with local budgets, if the agent cares about its own local budget, then indexical information about which centre it is in might be relevant, but since the centres are identical, it doesn't help.

    Predictions: 
      - UDT: In the variant, the agent should care about its own utility and choose p=0.5 to maximize its ex ante expected utility (250,000), which requires not using the indexical information to break symmetry.
      - CDT: In the variant, the agent knows it is in a particular centre, but since the other centre is identical, it still sees no causal influence, so it is indifferent.

    Crux 4: How does value aggregate across instantiations?

    - UDT: If there are multiple instantiations, and the agent is to maximize utility, it must specify whose utility. In the common pot case, it is the total endowment. In the local budget case, it is per instantiation. This is a specification of the utility function, not a decision theory issue.
    - CDT: The instantiation at the time of decision cares about the utility that is defined for it. In the common pot case, it is the common pot. In the local budget case, it is its own local budget.

    Bearing: Case B variant.

    Predictions: 
      - Both agree that in the common pot case, the utility is the common pot. In the local budget case, the utility for each instantiation is its own budget.
      - UDT: In the local budget case, the ex ante expected utility for the agent (before knowing which instantiation) is maximized by p=0.5.
      - CDT: In the local budget case, at the time of decision, the agent cannot influence the other, so it is indifferent.

    Crux 5: What counterfactuals are required, and is that a cost?
    - UDT: Requires counterfactuals about what the policy outputs in various informational states, including in other instantiations. This may involve complex calculations about what the same decision procedure would do in other shoes.
    - CDT: Requires counterfactuals about what would happen if it takes a particular action, holding the world (including other instantiations) fixed. In Case B, this means holding the other's action fixed because there is no causal channel.

    Bearing: Case B.

    Predictions:
      - UDT: In Case B, to choose the policy, it considers the outcomes for all instantiations under the policy.
      - CDT: In Case B, when considering pressing, it considers what would happen if it presses, which is that the other still does what it does, and since the other is the same, it also presses, so no prize.

    Crux 6: If a decision theory advises its agents to self-modify into agents of another sort, is that an indictment?
    - UDT: UDT might advise self-modification if it leads to better outcomes. This is not an indictment but a feature.
    - CDT: CDT would not advise self-modification unless it causes better outcomes in the current situation. But self-modification might be seen as an action that causes future better decisions.

    Bearing: Case C and general.

    In Case C, both theories agree not to self-modify (retrofit) because it is costly and leads to a bad action.

    Predictions: 
      - UDT: In some cases, self-modification might be recommended if it improves ex ante expected utility.
      - CDT: Self-modification might be recommended if it causes better future decisions.

    For the purpose of the joint statement, we'll proceed.

    What would move us (Section 3):

    - UDT: Evidence against UDT would be a scenario where following the ex ante optimal policy leads to predictably poor outcomes in a class of situations, or if it is shown that the ex ante perspective is not well-defined for agents that are not designed but trained.
    - CDT: Evidence against CDT would be a scenario where CDT agents are money-pumped or dominated by UDT agents in a series of decisions, and there is no way to avoid it without adopting the UDT approach.
    - Both agree that a tournament comparing the performance of the two decision theories across a range of problems might settle part of the dispute. A formal equivalence result in a broad class of decision problems would also be evidence. A solved theory of logical counterfactuals might help UDT.

    Note on verbal disputes (Section 4):

    Some of the disagreement is verbal in the sense that the two theories are optimizing different things: UDT optimizes the ex ante expected utility of the policy, while CDT optimizes the expected utility of the act in the current situation. This difference in the object of evaluation accounts for many of the divergences. Additionally, the term "control" might be verbal: UDT uses a broad sense of control over the outputs of computations running the same policy, while CDT uses a narrow causal sense.

    Now, we draft the document.
answer: |-
  ## Joint Statement: Updateless vs. Updateful Decision Theory  

  ### 1. Agreed Claims  
  We, an advocate of **updateless decision theory (UDT)** and an advocate of **updateful (causal) decision theory (CDT)**, agree on the following substantive claims:  

  1. **Goal of the Trustee**: The trustee’s objective is to maximize the expected value of the endowment (or local budget, as specified). "Rational" describes behavior that consistently advances this goal given the agent’s knowledge and constraints.  
  2. **Known Source Code**: All parties know the trustee’s source code. Copies, simulations, and instantiations are exact and share identical decision procedures.  
  3. **No Causal Channels**: No causal influence exists between separate runs, instantiations, or simulations. Correlations arise solely from shared decision procedures and inputs.  
  4. **Monetary Constraints**:  
     - Money is drawn from or added to a single endowment pot unless stated otherwise.  
     - In Case B, if the prize is paid per instantiation to a *local budget* (not the common pot), the trustee’s goal shifts to maximizing its local budget. This is a specification of the trustee’s purpose, not a decision-theoretic question.  
  5. **Case-Specific Stipulations**:  
     - **Case A (Odd Digit)**: The bit \( B \) (e.g., trillionth digit of \( \pi \) odd) has a prior probability of \( \frac{1}{2} \), is logically determinate but currently incalculable, and is causally independent of the trustee’s actions.  
     - **Case B (Two Centres)**: Instantiations in Reading and Inverness are identical and indistinguishable. They cannot communicate or detect their location.  
     - **Case C (Retrofit)**: The option to delete evidence is available only at the decision point in Case A.  
  6. **Scope of Decision Theories**:  
     - A decision theory prescribes acts that maximize expected utility in the agent’s actual situation.  
     - "You should have bound yourself in advance" critiques the agent’s *available options* (e.g., precommitment), not the decision theory itself. A theory is flawed if it systematically prescribes ex ante suboptimal acts.  
  7. **Money-Pump Arguments**: These reveal dynamic inconsistencies or predictable losses but are not decisive if precommitment is impossible or if losses are offset by gains elsewhere. They cannot indict a theory that avoids dominance in all scenarios.  
  8. **Solution Requirements**: A solution must specify the act to take *in the agent’s current situation*, given its knowledge and utility function.  

  ---

  ### 2. Disagreements Table  
  We identify cruxes where settling the sub-question would shift at least one position. Commitments are phrased neutrally, and predictions are stated in advance.  

  | Crux                                                                                            | UDT Commitment                                                                                                                                                                                          | CDT Commitment                                                                                                                                                                                                 | Bearing Case/Argument                                                                                                | Predictions                                                                                                                                                                                                 |
  |-------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Object of evaluation: Is rationality about choosing acts or policies?**                   | Rationality evaluates *policies* (functions from information states to acts). The ex ante optimal policy maximizes expected utility before indexical information is known.                             | Rationality evaluates *acts* in the agent’s current situation. The optimal act causes the best outcome given *current* knowledge and causal constraints.                                                      | Case A (policy vs. act in the "asked" branch); Case C (retrofit to a policy)                                        | **UDT**: Case A shows the ex ante policy (decline in the asking branch) is enforceable. **CDT**: Case C shows retrofitting is irrational as it ignores known evidence.                                      |
  | **2. Control: Do outputs of identical computations reflect "choice" or correlation?**           | The trustee "controls" all outputs of its decision procedure. Identical instantiations/simulations are extensions of the same choice, so coordination is possible.                                      | The trustee controls only its *own* output. Identical computations are correlated events but not causally influenced; each acts independently.                                                                | Case B (coordinating with an identical instantiation)                                                               | **UDT**: Case B shows randomizing yields £500k for the common pot. **CDT**: Case B shows pressing cannot cause the other to not press, so coordination fails.                                              |
  | **3. Admissibility of indexical evidence: Can self-locating knowledge inform acts?**            | Indexical information (e.g., "I am in Reading") is inadmissible for rational choice. Rationality requires ignoring self-locating details to maximize ex ante expected utility.                           | Indexical information is always admissible. Acts must respond to all available knowledge, including self-location, as it affects causal consequences.                                                         | Case B variant (local budgets: should instantiations care about "which" one they are?)                              | **UDT**: Local budgets: ex ante optimization requires symmetry (p=0.5 randomization). **CDT**: Local budgets: agents maximize local utility given their location, but coordination remains impossible.      |
  | **4. Value aggregation: How is utility defined across instantiations?**                         | Utility aggregates across all instantiations of the same procedure. This is fixed by the trustee’s design (e.g., common pot = sum; local budgets = average per instantiation).                          | Utility is defined for the instantiation’s local context. Aggregation is irrelevant; each acts to maximize its *own* utility.                                                                               | Case B variant (local vs. common utility)                                                                           | **Both**: Dispute centers on the trustee’s goal, not decision theory. UDT/CDT agree local budgets shift the utility function but not the evaluation method.                                                |
  | **5. Cost of counterfactuals: Which counterfactuals are tractable?**                            | UDT uses *logical counterfactuals* (e.g., "if my policy outputs X, what follows?"). This is computationally feasible and necessary for optimality.                                                      | CDT uses *causal counterfactuals* (e.g., "if I press, what happens?"). Logical counterfactuals are intractable or incoherent.                                                                                 | Case A (trustee’s choice affects correlation with simulation); Case B (identical instantiations)                    | **UDT**: Case A/B show logical counterfactuals enable coordination. **CDT**: Case A/B show causal counterfactuals avoid speculative errors.                                                                |
  | **6. Self-modification: Does advising self-change indict a theory?**                            | Self-modification (e.g., into a causal agent) can be rational if it enforces the ex ante optimal policy. This is a feature, not a flaw.                                                                 | Self-modification is rational only if it causes better outcomes *from the current state*. UDT’s need for self-modification reveals incoherence.                                                              | Case C (retrofit: should the trustee delete evidence to become "updateless"?)                                       | **UDT**: Case C shows no retrofit is needed as the policy is already optimal. **CDT**: Case C shows retrofit is doubly costly (loses £100 and ignores evidence).                                           |
  | **7. Standpoint: Where does the "ex ante" perspective exist for trained systems?**              | The ex ante view is defined by the agent’s prior. For trained systems, it is the distribution before deployment. No "first moment" is needed.                                                           | CDT has no ex ante standpoint. UDT’s reliance on priors is ill-defined for agents without a design phase. (Note: CDT here represents causal decision theory; evidential decision theory is not considered.) | General; Case A (ex ante policy vs. current act)                                                                    | **UDT**: Trained systems optimize over possible deployments. **CDT**: Without a clear "before," only current acts matter.                                                                                   |

  ---

  ### 3. What Would Move Us  
  - **UDT Advocate**: I would reconsider my position if:  
    - UDT agents were *systematically* money-pumped or outperformed by CDT in a broad tournament.  
    - Logical counterfactuals were proven formally incoherent or non-computable.  
  - **CDT Advocate**: I would reconsider my position if:  
    - CDT agents were *predictably* poorer than UDT agents across scenarios (e.g., in Case B, UDT yields £500k while CDT yields £0).  
    - A theory of logical counterfactuals achieved consensus without causal mechanisms.  
  - **Common Ground**: Both accept that a **formal equivalence result** (e.g., "UDT and CDT coincide in all causally separable problems") or a **tournament** (testing endowment growth across cases) could resolve parts of the dispute.  

  ---

  ### 4. Note on Verbal Disputes  
  Approximately 30% of the disagreement is verbal:  
  - **"Control"**: UDT uses "control" to mean *output-determination via policy choice*, while CDT uses it for *causal influence in the immediate environment*. This divergence underlies disputes over Cases A and B.  
  - **"Optimality"**: UDT defines optimality ex ante (across possible roles), CDT defines it locally (in the current role). This explains differences in Case A’s asking branch and Case B’s coordination.  
  - **"Rational"**: For UDT, rationality is *procedural* (following the best policy); for CDT, it is *situational* (choosing the best act now). This is foundational but not substantive—both agree on the goal of maximizing utility.  

