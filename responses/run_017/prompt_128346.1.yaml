  We are drafting a joint statement for two decision theorists, one advocating for updateless decision theory (UDT) and one for updateful (specifically causal) decision theory (CDT). The document will address Cases A, B, and C, and include agreed claims, a disagreements table, a section on what would move each side, and a note on verbal disputes.

  The structure is as follows:
  1. Agreed Claims (numbered section)
  2. Disagreements Table (with crux, UDT commitment, CDT commitment, bearing case/argument, and predictions)
