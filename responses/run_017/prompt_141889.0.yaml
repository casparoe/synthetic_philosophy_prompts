prompt: |-
  reading some pop-science history of physics lately and I keep noticing this one move, and I don't know what to call it, so forgive me if this is obvious. Someone puts forward a theory and then points out, as a point in it's favor, that the theory explains some fact that was already known — everybody already had the fact, it was in the textbooks, sometimes it was even the fact that made people uneasy about the old theory. And people do treat that as a reason to like the new theory. But here's the part I can't square. How much credit the theory gets seems to turn on whether the person was aiming at that fact while building the theory, and I can't work out which direction it goes. Sometimes aiming is a big discount: a grad student friend of mine fits a model that reproduces a correlation his whole field already knew about, and nobody is impressed, precisely because he tuned it to get that. Other times the aiming looks like the whole reason it's impressive — the Mercury perihelion case, where as I understand it the odd number was known and the theory was built partly in order to get it, and it's treated as one of the great triumphs. Same shape, opposite verdict.

  So: is there a name for this? Credit for entailing something we already believed, plus the fact that whether you were aiming at it cuts both ways. I don't just want a label, though. I want to know where the real cut is: is it about when the theorist found out about the entailment, about how many other things the theory had to commit to in order to get that one, about how strange the fact looked beforehand, or something else entirely? And if the usual word only covers one of my two cases, say so, and hand me a name for the other.
reasoning: |-
  Okay, the user is asking about a pattern they noticed in the history of physics where a new theory gets credit for explaining an already-known fact, but the amount of credit varies based on whether the theorist was "aiming" at that fact. They mention two opposite cases: a grad student tuning a model to fit known data gets no credit, while Einstein building GR to explain Mercury's perihelion is celebrated. 

  Hmm, they're really wrestling with the inconsistency here. On the surface it seems contradictory - same action (explaining old data), opposite reactions. They want terminology for this phenomenon, but more importantly they're asking about the underlying logic. Why does intention sometimes help and sometimes hurt?

  First, I should acknowledge their observation is sharp. They're noticing something subtle about scientific epistemology that even professionals debate. The examples they picked are perfect - Mercury's precession is the classic "success" case, while model-tuning is the classic "failure" case. 

  The core confusion seems to be about intentionality's role. But I suspect intentionality isn't the real driver - it's a proxy for other factors. Let me unpack:

  For Mercury, the anomaly was deeply problematic for Newtonian physics. Einstein didn't just "aim" at it; GR emerged from fundamentally rethinking gravity, and Mercury's orbit was a key test. Crucially, GR also predicted novel things (light bending) and couldn't easily be tweaked just for Mercury. 

  Whereas the grad student's model sounds like it was flexibly parameterized to hit one data point without new insights. Probably didn't constrain other predictions much. That's why it's unimpressive - it's accommodation (just fitting knowns) versus prediction (risking novel tests).

  So maybe the real factors are: 
  - How theoretically costly is the explanation? (Does it require new commitments?)
  - Does the theory survive novel tests? 
  - Was the fact anomalous for old theories?
  - How much flexibility does the model have?

  The terminology exists: "accommodation" vs "prediction", but these labels don't capture the full nuance they're observing. Prediction gets more credit, but sometimes accommodation does too (like Mercury) if it's "hard". 

  I should also mention Bayesian confirmation - evidence supports theories more when the evidence was unexpected under alternatives. Mercury was unexpected for Newton but inevitable for GR. The grad student's correlation was expected by everyone, so confirming it doesn't shift beliefs.

  Their deeper need seems to be understanding scientific epistemology - when do explanations "count"? They might also be wrestling with how science avoids ad hoc reasoning. 

  I'll structure the answer to: 
  1. Name the concepts (accommodation/prediction) 
  2. Explain why intention matters asymmetrically 
  3. Reveal the underlying factors (anomaly, theoretical cost, novelty) 
  4. Give Mercury vs grad student as contrasting cases 
  5. Mention Bayesian framing as bonus

  Should avoid jargon overload though - they're pop-science savvy but not necessarily technical. Focus on the intuition about explanatory "tightness".
answer: |-
  You've hit on a profound and often debated issue in the philosophy of science! The phenomenon you're describing has two sides, and **the key difference lies in whether the explanation is "novel" or "non-ad-hoc," not merely whether the theorist was "aiming" at the fact.** Here's the breakdown:

  ### 1. **The Core Concepts & Terminology**
     - **Accommodation (or "Retrodiction")**: When a theory is built *or tuned* to fit *already-known* data. This is what your grad student friend did.  
       *Verdict*: Often viewed skeptically ("curve-fitting," "ad hoc").
     - **Prediction**: When a theory entails *new, previously unknown* facts (e.g., Einstein predicting light bending *before* Eddington's 1919 eclipse experiment).  
       *Verdict*: Highly valued ("strong confirmation").
     - **Anomaly Resolution**: When a theory explains a *previously puzzling fact* that contradicted or strained an older theory (e.g., Mercury's perihelion precession under Newtonian gravity).  
       *Verdict*: Valued **if** the resolution is *non-ad-hoc* and deeply tied to the theory's core structure.

     **The Mercury case is anomaly resolution, not mere accommodation.** This is why intention alone doesn't determine credit.

  ### 2. **Why "Aiming" Cuts Both Ways: The Real Deciding Factors**
     The credit depends on **explanatory tightness** and **theoretical cost**. Key criteria:

     - **Was the fact *anomalous* for prior theories?**  
       Mercury's precession was a known problem for Newtonian physics for decades. A theory that *naturally* resolves a deep anomaly gets credit because it solves a genuine puzzle.  
       → *Credit INCREASES if the fact was troublesome.*

     - **How many degrees of freedom does the theory have?**  
       If your friend's model has many adjustable parameters tuned *just* to fit the known correlation, it’s "ad hoc." The theory isn't *constrained* by the fact; it’s *flexible enough* to absorb it without testable consequences.  
       GR, by contrast, had *no free parameters* tuned for Mercury. The precession fell out of its core equations (the Einstein field equations) without special adjustment.  
       → *Credit DECREASES if the theory can easily fit the fact without commitment.*

     - **Does the theory make *novel predictions*?**  
       GR didn’t just explain Mercury—it *predicted* unseen phenomena (e.g., gravitational lensing, time dilation). This gave it independent credibility.  
       → *Credit INCREASES if the theory risks falsification by new tests.*

     - **Is the explanation *inevitable* given the theory’s foundations?**  
       In GR, Mercury’s precession is a direct consequence of spacetime curvature—a core, non-negotiable feature. If your friend’s model could have fit *any* correlation with minor tweaks, it lacks this inevitability.  
       → *Credit INCREASES if the fact is tightly woven into the theory’s structure.*

  ### 3. **The Bayesian Perspective: Surprise Matters**
     Philosophically, evidence supports a theory more strongly if the evidence was **unexpected** without the theory.  
     - Mercury’s precession was expected to be a problem (*likely under anomaly*), but GR made it inevitable (*highly probable under GR*).  
     - Your friend’s correlation was already accepted (*likely under existing knowledge*), and his model made it probable—but so could many other models. The *probability boost* for his theory is minimal.

  ### 4. **What to Call Each Case?**
     - **The Grad Student Case**: **Ad hoc accommodation** or **curve-fitting**.  
       → Focuses on *lack of theoretical constraint*.  
     - **The Mercury Case**: **Non-ad-hoc anomaly resolution** or **explanatory coherence**.  
       → Focuses on *solving a deep puzzle with minimal flexibility*.

  ### Why Intention *Seems* Relevant (But Isn't the Root Cause)
  Intention often correlates with these deeper factors:  
  - If you *aim* at a known fact with a flexible model, you’re likely doing **ad hoc accommodation**.  
  - If you aim at an *anomaly* with a fundamental theory (like Einstein), you’re likely doing **anomaly resolution**.  

  But credit isn’t for intention—it’s for **explanatory rigor**. Einstein gets credit because GR *couldn’t avoid* predicting Mercury’s precession once its core principles were set. Your friend’s model *could have* avoided the correlation—but he chose not to let it.

  ### In Summary
  - **The real cut is about theoretical constraint and anomaly-solving.**  
  - **Key terms:**  
    - Low credit: **Ad hoc accommodation** (flexible models fitting known data).  
    - High credit: **Anomaly resolution** (rigid theories explaining stubborn puzzles) or **novel prediction** (foretelling new facts).  

  Einstein’s Mercury triumph isn’t about "aiming"—it’s about GR resolving a 60-year-old anomaly *without special tuning*, while also predicting unseen phenomena. Your friend’s model did the opposite. The philosophy here is rooted in **Lakatos' "research programmes," Kuhn's "puzzle-solving," and Popper's emphasis on falsifiability**. It’s a hallmark of how science separates deep theories from mere tools.
