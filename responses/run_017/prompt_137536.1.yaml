answer: |-
  Here’s a distilled set of desiderata for a betterness relation under your institutional constraints, grounded in cases and conflicts. Non-negotiable requirements are marked **`[NN]`**; tensions/impossibilities flagged.

  ---

  ### **Core Desiderata & Their Cases**
  1. **Asymmetry** **`[NN]`**  
     *Case*: If A is better than B, B cannot be better than A.  
     *Why*: Essential for a verdict (no ties in strict betterness). Without it, no unique choice.  
     *Institutional*: Losers must accept that their option wasn’t *better*; asymmetry enables this.

  2. **Completeness** **`[NN]`**  
     *Case*: For any two outcomes A and B, either A is better than B, B is better than A, or they are equally good.  
     *Why*: The institution *must* choose; incomparability forces abstention.  
     *Institutional*: "No verdict" violates the mandate.

  3. **Spectrum Resistance (Quality vs. Quantity)**  
     *Case*: Start with a high-wellbeing life (A). Each step slightly decreases wellbeing (e.g., 0.1%) but multiplies population 100x. After many steps, you reach Z: vast population at near-starvation.  
     *Requirement*: Avoid "A > B > ... > Z" yet "Z > A" (intransitivity) or "A ≈ Z" (collapsing).  
     *Why*: Intuition that A is better than Z dominates; but small steps seem unobjectionable improvements.  
     *Inter/intrapersonal*: If a theory is intransitive *only* interpersonally, it’s cheating unless it argues *why* person-affecting reasons break transitivity (e.g., "no trade-offs between lives").

  4. **Dominance** **`[NN]`**  
     *Case*: Outcome A has higher wellbeing for *every* person than B, and no one else exists.  
     *Requirement*: A must be better than B.  
     *Why*: Core to "better than"; denying this makes reasons unacceptable to losers.  
     *Conflict*: If losses/gains are in disjoint populations (A benefits group X, harms Y; B does reverse), dominance may not apply.

  5. **Vagueness vs. Genuine Intransitivity Distinction**  
     *Case*: In the spectrum, if each step is *vaguely* defined (e.g., "slightly worse" is indeterminate), transitivity might hold. But if each step is precise yet betterness *genuinely* flips, transitivity fails.  
     *Requirement*: The theory must specify which it is and why. Vagueness-based solutions must not collapse in precise cases.

  6. **Primitive Relation**  
     *Case*: Must ground "better than."  
     *Options*:  
     - "At least as good" → risks incompleteness if not total.  
     - "Much better"/"slightly better" → risks vagueness.  
     *Requirement*: The primitive must support public reasons (e.g., "slightly better" may feel arbitrary).

  7. **Stability Under One-Shot Choice (Not Money Pumps)**  
     *Case*: Cyclical preferences (A>B, B>C, C>A) could lead to "money pumps" for individuals.  
     *Requirement*: *For institutions*, cycling only matters if it undermines public justification. A one-shot choice can ignore cycles if it picks *a* maximal option. **Not** binding **`[NN]`** if the institution isn’t repeatedly exploited.

  8. **Scale-Invariance in Nested Spectra**  
     *Case*: Suppose the final step Z of a spectrum is itself a sub-spectrum (e.g., Z₁ to Zₙ, where Zₙ is vastly larger but slightly worse per capita than Z₁). Zooming in, Z₁ > Zₙ might hold locally, but coarsely Z > A (where A is the start).  
     *Requirement*: **Scale-invariance should be desired but not absolute**.  
     *Why*: If coarse/fine judgments conflict, public reasons fail ("you say Z > A, but up close Zₙ is worse than A!"). But demanding perfect invariance may be unrealistic.  
     *Case for tolerance*: Context matters. A theory might weight "macroscopic" properties (e.g., average wellbeing) at coarse scales, and "microscopic" at fine scales, if justified.

  ---

  ### **Tensions & Impossibilities**
  - **`[MAJOR CONFLICT]`** Spectrum Resistance + Dominance + Completeness → Likely **impossible** if gains/losses affect disjoint groups.  
    *Why*: In disjoint populations, A > B if A helps some, B helps others. Spectrum arguments exploit this to force A > Z or Z > A, both counterintuitive.  
  - Asymmetry + Completeness + Spectrum Resistance → Pushes toward lexical thresholds or intransitivity.  
  - Scale-invariance + Spectrum Resistance → Hard to satisfy if spectra are fractal.  

  **Most exclusionary requirement**: **Spectrum Resistance**. It kills totalist utilitarianism, forces lexicality/thresholds/intransitivity.

  **Least confident requirement**: **Scale-invariance**. Institutions might reasonably use context-dependent reasoning. But if zooming *always* reverses judgments, reasons become unreliable.

  ---

  ### **Theory Performance Table**
  | Requirement               | Transitive Total-Order (e.g., Utilitarianism) | Lexical/Threshold View              | Essentially Comparative (Intransitive) |
  |---------------------------|-----------------------------------------------|-------------------------------------|----------------------------------------|
  | Asymmetry                 | ✓                                             | ✓                                   | ✓                                      |
  | Completeness              | ✓ (if total)                                  | ✓                                   | ✗ (often allows incomparability)       |
  | Spectrum Resistance       | ✗ (collapses to A≈Z or Z>A)                   | ✓ (if thresholds)                   | ✓ (denies chain)                       |
  | Dominance (disjoint pops) | ✓ (if total)                                  | ✗ (may ignore small gains)          | ✗ (may deny A>B if groups disjoint)    |
  | Vagueness Handling        | ✗ (ignores sorites)                           | △ (thresholds "solve" vagueness?)   | ✓ (builds in indeterminacy)            |
  | One-Shot Stability        | ✓                                             | ✓                                   | △ (cycles possible but irrelevant)     |
  | Scale-Invariance          | ✓                                             | ✗ (thresholds scale-dependent)      | △ (varies)                             |

  **Key**: ✓ = Satisfies, △ = Partially/contextually, ✗ = Fails

  ---

  ### **Summary for Your Institution**
  - **Non-negotiable**: Asymmetry, Completeness, Dominance (in simple cases).  
  - **Critical tension**: Spectrum Resistance vs. Dominance in disjoint populations. This is the core trade-off.  
  - **Best fit**: A **lexical threshold view** (e.g., sufficientarianism) satisfies most **`[NN]`** and spectrum resistance but struggles with dominance in disjoint groups and scale-invariance.  
  - **Outlook**: **No theory satisfies all**. You must sacrifice either:  
    - Spectrum resistance (accept Z > A),  
    - Dominance in disjoint groups (deny obvious betterness), or  
    - Completeness (allow incomparability).  

  **Confidence in list**: 85%. The cases are well-motivated; tensions reflect genuine philosophical deadlocks.  
  **Weakest desideratum**: Scale-invariance—while ideal, institutions might reasonably use "zoomed-in" reasons ad hoc.  

  Your result: **Trade-offs are unavoidable**. Prioritize which intuitive judgments your institution can abandon publicly. (Lexical thresholds are the least worst for your constraints.)
