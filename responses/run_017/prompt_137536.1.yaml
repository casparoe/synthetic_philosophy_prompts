prompt: |-
  ok so I'm trying to get clear on whether "better than" is transitive and I keep going in circles (sorry) because every view I look at seems to be built by staring at one spectrum argument and then patching the problem for that one case. So before I look at any more views I want the spec.

  Write me the desiderata that a theory of the betterness relation over outcomes has to meet — but for one specific job, not just "an elegant axiology": it has to underwrite a one-shot choice by an institution that can't abstain, can't randomize or kick the decision down the road, and has to give public reasons the losers could in principle accept. So it's a thing that has to actually terminate in a verdict.

  For each requirement I want the case or consideration behind it, not a slogan. The stuff I already know needs covering, organized properly rather than as a list of my worries:

  - the standard quality-vs-quantity spectrum, where each step trades a tiny loss in wellbeing for a large gain in number, and the anti-transitive move people make about it;
  - intrapersonal versions of the same shape (one life, slightly worse days, much longer) — and say whether a theory that only goes intransitive for interpersonal cases is cheating or has a principled reason;
  - dominance-type cases where the losses and gains sit in disjoint populations, so no single person is compensated;
  - the vagueness/sorites-y reading of the spectrum versus a genuine failure of transitivity, and what would even distinguish them;
  - which relation gets to be primitive: "better than", "at least as good as", "much better than", "slightly better than";
  - whether "must be choice-guiding / must not generate cycling or money-pump-ish instability" is a real desideratum given my institution, or just a prejudice of decision theorists foisted onto value theory;

  And the new bit, which is the part I actually care about: give me a desideratum about nested spectra. Suppose the final step of a spectrum isn't a single outcome but is itself reached by a little spectrum of its own, and some of those steps contain another one, and so on, fading out in a self-similar way. Does anything require the theory's verdict to be stable under that kind of zoom — that the comparison you get at the coarse level matches the one you'd get by descending a level? Is scale-invariance a genuine requirement, or is it fine (even expected) for a theory to be scale-dependent here? Argue whichever way you think, with a case.

  Then: mark which requirements are non-negotiable for my institution and which are just one camp's taste; flag any pair or triple you suspect can't be jointly satisfied — that's the part I most want, since if the list turns out to be impossible that's my result rather than a problem; and tell me which single requirement does the most work excluding candidates.

  Only after that, briefly, and in a table: how a plain transitive total-order view, a lexical-or-threshold view, and the essentially-comparative / intransitive family do against the list. Keep that short — the criteria are where the thinking is, and I have no library access where I'm writing so I don't want citations or reading lists, just arguments.

  At the end, say how confident you are in the list as a whole and single out the one requirement you're least sure belongs on it. Answer in American English.
