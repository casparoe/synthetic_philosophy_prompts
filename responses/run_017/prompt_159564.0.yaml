prompt: |-
  I am designing a graduate seminar on machine ethics—the field concerned with how to implement ethical reasoning in machines—and I keep returning to the public debate over how autonomous vehicles should be programmed for unavoidable collisions. The case I want analyzed is the juxtaposition of two real responses to that problem. The first is the Moral Machine project: an online experiment that presented users with stylized crash scenarios (swerve versus stay, sacrificing the passenger or pedestrians, tradeoffs involving number of lives, age, social status, species, and whether the pedestrians were crossing legally) and collected tens of millions of judgments from people in many countries. The second is the set of national ethics guidelines for automated driving issued in the late 2010s by a European commission; for this analysis, take the guidelines to hold that an automated system may not, in an unavoidable accident, decide on the basis of personal characteristics such as age, gender, or physical condition, and may not simply aggregate and offset distinct lives against one another, while permitting only general programming aimed at reducing the overall number of injuries. I am supplying these facts so that no lookup is needed; the interesting question is not what the documents literally said but how the episode reads when viewed through a theoretical lens.

  Analyze this episode through the lens of the standard machine-ethics distinction between top-down, bottom-up, and hybrid strategies for building artificial moral agents. A top-down approach encodes moral requirements in explicit, inspectable rules or constraints; a bottom-up approach lets a system acquire moral behavior from data, human feedback, or training in an environment; hybrid views combine them, often against the implementation-level background worry that transparent structures such as explicit rules or decision trees are more auditable, whereas learned statistical models are more flexible but harder to inspect and can drift as norms change. I want a disciplined mapping: identify the relevant actors (the researchers who built the platform, the commission, the public whose judgments were harvested, manufacturers, and prospective passengers and pedestrians); the options each faced; and what counts as evidence or success within each strategy, whether descriptive fit to human judgments, compliance with rights-based constraints, public acceptability, transparency, or safety. Then say where the distinction illuminates the case and where it misdescribes or falls silent. In particular, I have been toying with a refinement I call the calibration problem: a bottom-up system must decide whether its training target is the judgment people give as disinterested spectators, the preference they reveal as prospective passengers or pedestrians, or the norm they would endorse under reflection, and the Moral Machine data do not by themselves pick one. Relatedly, the episode seems to exhibit an endorsement-adoption gap, because people could approve utilitarian tradeoffs for cars in general while preferring self-protective behavior for the car they would occupy, so the data used to train a policy may be collectively self-defeating. Tell me whether the top-down/bottom-up lens can represent this calibration problem or whether it is blind to it, and whether the episode is best described as a confirmation of hybrid architectures, an anomaly for pure bottom-up learning, or a case the taxonomy never anticipated because the real dispute concerns the authority and proper target of moral data rather than the source of moral content.

  Please make your epistemic commitments explicit: state how confident you are in each major interpretive claim, distinguish what follows from the top-down/bottom-up framework itself from what is your own reconstruction of the case, and mark where you are extrapolating from the sparse facts I supplied or from general knowledge of autonomous-vehicle ethics. I would rather have a short, honest analysis that admits the framework cannot bear the weight I am putting on it than a polished one that forces the case to fit. If my framing rests on a confused premise—if I have misdescribed the guidelines, overstated what the Moral Machine data can show, conflated distinct senses of implementation, or if the calibration problem is just a familiar issue under a new name—say so plainly and explain why; do not politely play along. I am not asking for citations, bibliographies, or suggested reading. Just give the analysis in your own voice, with your uncertainties and objections stated as clearly as your positive claims.
