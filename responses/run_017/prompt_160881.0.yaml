  6. Internal to 8: Defending an outcome with a winner having no first-place votes but also saying such a winner is "nobody's wanted".

  Ranking the tensions by severity:

  - High severity: 
    - 3 vs 4: This is a direct clash because Borda does not satisfy the Condorcet criterion. The cost of keeping Borda is that sometimes the Condorcet winner is not elected. The cost of switching to a Condorcet method (like Copeland or Minimax) might be that you lose the whole-ballot use (so you have to drop Borda) and might not have a scoring rule. 
    - 5 vs 4: The user's main objection to plurality is spoilers, but Borda is also vulnerable to spoilers. So if spoilers are disqualifying, then Borda is disqualified. 

  - Medium severity:
    - 4 vs 7: Borda has known participation failures. The example above shows that in some cases, adding a ballot that ranks x first can cause x to lose (if it leads to a tie that is broken against x). This is a real issue for participation. 
    - 1 vs 2: This is a fundamental tension: if we accept that there is no collective will (so cycles are possible), then agenda-dependence is a natural consequence. The user is relaxed about issue-by-issue majority voting even when issues are related, but in meetings, agenda-dependence might be unavoidable if there are cycles. 

  - Lower severity:
    - 3 vs 5: This tension is inherent in any rule that satisfies the Condorcet criterion. When a spoiler is added that breaks the Condorcet winner, the rule is not required to elect the original Condorcet winner. But the user could require a stronger condition of spoiler immunity that covers this case? However, that might be hard to achieve. 
    - 5 vs 6: Rank-robustness is a weak condition and does not prevent spoilers. The user might have to drop the belief that rank-robustness solves the spoiler problem.

  - Internal to 8: The user might reconcile by noting that a candidate with no first-place votes can still be the most acceptable compromise (as in the example) but ideally should have some first-place support. This is more of a normative tension than a formal inconsistency.

  Flag pairs that only look inconsistent:

  - Principle 3 (Condorcet winner) and principle 1 (rejection of collective ordering) are not inconsistent. The Condorcet winner is defined pairwise and does not require a full ordering.

  - Principle 6 (rank-robustness) and principle 5 (no spoilers): not directly inconsistent, but rank-robustness is too weak to ensure no spoilers.

  Provable inconsistencies:

  - Between 3 and 4: It is a known result that the Borda count does not satisfy the Condorcet winner criterion. There are examples.

  - Between 5 and 4: It is known that Borda is vulnerable to spoilers (as shown in examples).

  - Between 4 and 7: There are examples showing Borda violates participation (though the exact condition stated by the user might be rarely violated, but it is possible).

  Single revision that would clean up the most:

  - Drop the use of Borda and adopt a Condorcet method (like Copeland, or Ranked Pairs). This would address:
    - Tension with 3: Condorcet methods satisfy the Condorcet winner criterion.
    - Tension with 5: Some Condorcet methods are less vulnerable to spoilers? But not immune. For example, adding a candidate can break the Condorcet winner and then the method might elect someone else. However, if the rule is Condorcet-consistent, then when there is a Condorcet winner, it is elected. But in the absence, it might still have spoilers. 
    - Tension with 7: Condorcet methods can also fail participation. 

  Alternatively, consider a rule like Instant Runoff Voting (IRV). But IRV does not satisfy the Condorcet criterion and is also vulnerable to spoilers.

  Another option: Approval Voting. But the user wants to use the whole ballot (full rankings) so that might not be acceptable.

  The user might have to relax on principle 5: spoilers might be unavoidable in any ranked-choice rule? But then why object to plurality? 

  Alternatively, the user might consider a rule that is Condorcet-consistent and also satisfies some form of participation? But it is known that no Condorcet-consistent rule satisfies participation (Moulin, 1988).

  Given the complexity, the best bet might be to use a Condorcet method and accept that participation might fail occasionally and that spoilers can occur when there is no Condorcet winner.

  But note: the user also has principle 2 against agenda-dependence. Condorcet methods do not use agendas? They produce a winner without an agenda. But for meetings, the user is using issue-by-issue majority, which is a form of sequential voting and hence agenda-dependent. 

  So for the hiring committee, a Condorcet method might be a good fit for the ballot aggregation. For the meetings, the user might stick with majority voting on each motion separately, but note that this can lead to agenda-dependence if the issues are interdependent. The user says they are relaxed about that. 

  Therefore, the most severe tensions are around using Borda. Dropping Borda would resolve the tensions with 3 and 5 (to a large extent) and also with 7 (if the new rule has better participation properties). 

  Cost of dropping Borda: 
    - The whole-ballot information is used differently in Condorcet methods (they look at pairwise comparisons). But that might be acceptable. 
    - Borda is more vulnerable to manipulation? But the user isn't asking for strategy-proofness. 

  Summary of recommendations:

  - For the hiring committee, switch to a Condorcet method (like Ranked Pairs or Schulze) to ensure the Condorcet winner is elected and to reduce spoilers (though not eliminate entirely). This addresses principles 3 and 5 better than Borda.

  - Be aware that no ranked voting rule can satisfy both Condorcet winner and participation (Moulin, 1988). So principle 7 might be violated occasionally. But you might prioritize Condorcet winner over participation.

  - For the meetings, continue with issue-by-issue majority, but acknowledge that agenda-dependence is possible (especially if there are cycles) and that there is no collective will (principle 1). But since you are relaxed about that, it's acceptable.

  - Revise principle 8: A winner with no first-place votes can be the Condorcet winner and hence the most acceptable compromise. It doesn't mean "nobody wanted" them; it means they are not anyone's top choice but are preferred to others head-to-head. So drop the statement that it is a winner nobody wanted.

  - Rank-robustness (6) is not strong enough to prevent spoilers, so don't rely on it for that purpose.

  Final note: There is no perfect rule. The user must prioritize. The most critical seem to be 3 (Condorcet winner) and 5 (no spoilers). Borda fails both, so it is not the best choice. A Condorcet method is better for 3 and might be better for 5 (though not perfect). Participation (7) might be sacrificed to some extent.

