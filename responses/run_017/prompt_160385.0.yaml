prompt: |-
  I work on cost-benefit analysis for a government agency (econ background, basically no philosophy) and I keep running into something that feels like a contradiction in what we actually do. I'd like to know what we're committed to by doing it.

  Here's the practice. When we appraise a project we monetise everything. For stuff with markets we back the numbers out of behaviour: the value of a statistical life comes from the extra pay workers demand to take risky jobs, the value of clean air from what people pay for houses in less polluted neighbourhoods. For stuff with no market — a wetland, a species, a view — we can't do that, so we run surveys: describe the good carefully, remind people of their budget, then ask how much they'd pay in extra taxes to protect it, yes/no referendum style. Two more bits. First, we throw some answers out: people who are obviously answering strategically, people who are expressing a general warm feeling about the environment rather than about the specific good, people who name a number they plainly couldn't afford. Second, we use willingness to pay rather than willingness to accept compensation for the loss, even though for small changes those are supposed to come to roughly the same thing — and we prefer the one that gives the smaller number.

  So here's what puzzles me. The line I was taught is that utility isn't a thing inside your head, it's just a summary of your choices: nothing over and above what behaviour reveals. But the survey half of what we do behaves as if utility were a hidden quantity that behaviour and survey answers are both noisy evidence for, which is why we can clean the noise out, discard the answers that dont track it, and calibrate surveys against market behaviour. And then we discard some behaviour too: we dont count choices made in ignorance or under panic, and we'd never build an appraisal out of lab results showing people choose differently between two equivalent framings of the same gamble.

  So: what does the practice, taken as a whole, actually presuppose utility to be? Is it strictly committed to one answer, or could several different theories of what utility means license exactly the same thing we do? I'd like you to separate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's genuinely underdetermined.

  Two follow-ups if you have room.

  A colleague has proposed fixing the mess by routing every non-market valuation through a citizens' assembly: small group, gets briefing materials, hears both sides, deliberates for a weekend, and only its post-deliberation vote counts as the preference. Call it laundering. What does that proposal presuppose about preferences and about utility that the current method doesn't, and would it make the package more coherent or just add a second inconsistent layer on top?

  And the bit that bugs me most: willingness to pay scales with ability to pay, so benefits to poor people come out smaller and benefits to rich people come out larger. We do nothing about that in environmental appraisal, but in the health side of the same government the equivalent calculation counts a health gain the same whoever gets it. Is that an inconsistency the practice cant survive, or does it just show that willingness to pay is doing something other than measuring utility — standing in for opportunity cost in money terms, say? And what would have to change in the appraisal if we took the rival reading seriously?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work in cost-benefit analysis for a government agency with an economics background but little philosophy. The main issue they're facing is what feels like a contradiction in their methodology. Specifically, they monetize everything: using revealed preferences from market behavior for goods with markets and stated preferences from surveys for non-market goods. They also clean the data by discarding certain responses and use WTP instead of WTA. 

  First, I need to understand their core confusion. They were taught utility is just a summary of choices, but their practice treats it as a hidden variable that both behavior and surveys can indicate, albeit noisily. So they're asking what their methodology presupposes about utility. 

  I should break this down into what's strictly required versus what's compatible. The revealed preference approach strictly needs ordinal utility and consistent choices. But when they use surveys and clean the data, they're implying that preferences exist independently and can be better revealed under ideal conditions. That points towards latent preferences. 

  The user also mentions discarding certain behaviors, like choices made in ignorance or panic. This suggests they believe true preferences are stable and rational, not just any choice. So the practice seems committed to latent preferences but not necessarily cardinal utility. They might just need ordinal comparisons. 

  Next, the colleague's proposal about citizens' assemblies. This seems to assume preferences can be shaped through deliberation, moving from raw to considered preferences. It adds a layer of idealization but might conflict with the individualistic basis of traditional CBA. It’s coherent if they view preferences as malleable but could introduce inconsistency if they still rely on market behaviors which aren't deliberative. 

  The willingness to pay issue scaling with income is tricky. In health, they use QALYs which are equal regardless of income, but environmental appraisal doesn’t adjust for that. This inconsistency might stem from different goals: efficiency versus equity. The user wonders if WTP is about opportunity cost rather than utility. If they took equity seriously, they’d need to adjust WTP or use a different metric, but that conflicts with the Kaldor-Hicks criterion. 

  I need to ensure I address all parts: the core presupposition, the assembly proposal, and the WTP equity issue. The user wants to know if their practice is coherent or if there's a fundamental flaw. They might be looking for justification to change methodologies or understand the philosophical underpinnings to defend current practices. 

  Also, considering their background in economics, avoiding too much philosophy jargon is key. They need practical implications. For example, explaining how latent preferences reconcile with their data cleaning. The citizens' assembly proposal might be an attempt to handle the preference purification more systematically. But how does that fit with their current approach? 

  Lastly, the equity point is a real tension. They might be under pressure to address inequality but constrained by traditional CBA frameworks. Highlighting that WTP measures economic value, not welfare, could help them see why health uses a different metric. But merging these approaches would require explicit policy choices about equity, which is beyond CBA's standard scope. 

  I should structure the response to first clarify the utility presupposition, then address each follow-up, and conclude with the overall coherence. Emphasize that while there’s tension, the practice holds together under a latent preference view, but the equity issue remains a challenge that needs policy intervention.
answer: |-
  Your practice reveals a sophisticated but tension-filled commitment to **latent preferences** as the foundation of utility. Here's a breakdown of what the methodology presupposes, where it's underdetermined, and how the follow-ups fit in:

  ### Core Presupposition: Utility as Latent Preferences
  1. **Strict Commitment:**  
     - **Preferences are real and stable (but latent):** You presuppose individuals *have* underlying, reasonably stable preferences ("true values") that exist independently of any single choice or expression. Market behavior and survey responses are both *imperfect signals* of this latent structure.  
     - **Imperfect revelation necessitates purification:** Discarding "strategic," "uninformed," or "affective" responses (in surveys) and ignoring choices made under "panic" or with "ignorance" (in markets) implies that *only choices made under "ideal" conditions* reliably reveal true preferences. This "ideal" context includes full information, cognitive clarity, and no coercion.  
     - **Utility is ordinal, but cardinality is pragmatically necessary:** Welfare economics technically only requires *ordinal* utility (ranking options). But monetization and aggregation *require* cardinality (measuring intensity). Your practice presupposes that cardinal WTP *can* approximate the intensity of latent preferences under controlled conditions.  
     - **Calibration implies a common latent variable:** Using market behavior to validate/calibrate surveys assumes both methods are measuring the *same underlying thing* (latent preference strength).

  2. **What it's Compatible With (but not strictly committed to):**  
     - **Revealed Preference (RP) Theory:** Superficially, you use RP. But discarding "noisy" choices violates strict RP (which says *all* choices reveal preference). Your practice fits "purified RP" (e.g., Hausman's "thick" preferences).  
     - **Neuroscience/Introspection:** If utility were *purely* a construct from choices, discarding choices based on cognitive states ("panic") makes no sense. Implicitly, you allow that mental states *constrain* valid preference revelation.  
     - **Non-Welfarism:** Discarding "warm glow" responses suggests you're not just measuring subjective well-being (utility-as-feeling), but a more considered judgment about resource allocation.

  3. **Underdetermined Aspects:**  
     - **Metaphysical Status:** Is utility a neural state, a disposition, or a normative ideal? Your practice doesn't care; it's operational.  
     - **Preference Formation:** Do preferences exist pre-formed, or are they constructed during elicitation? Surveys assume the former; discarding "unreflective" answers hints at the latter.  
     - **Interpersonal Comparisons:** Aggregating WTP *assumes* comparability, but doesn't specify if utility is comparable or just money.

  ### Follow-Up 1: Citizens' Assembly ("Laundering")
  - **What it Presupposes:**  
    1. **Preferences are malleable and rationalizable:** Raw preferences are "noisy" or "corrupted" (by ignorance, self-interest, bias). Deliberation refines them into "authentic" preferences via reason and dialogue.  
    2. **Utility is public-reason compatible:** The "true" value of a wetland isn't just the sum of private WTP; it incorporates deliberative public judgment about societal good.  
    3. **Epistemic Privilege:** A small, informed group under ideal speech conditions can better discern "true" social value than markets or surveys.  
  - **Coherence Impact:**  
    - **Adds Inconsistency:** If your core method seeks *individual* latent preferences, the assembly replaces them with *collective* reasoned judgments. This clashes with the individualistic foundation of CBA.  
    - **Potentially Coherent (with a shift):** It *could* cohere if you redefine utility as *deliberatively formed social values* (à la Sunstein or Habermas). But this abandons the link to individual welfare maximization, turning CBA into a tool for implementing deliberative democracy rather than efficiency.  
    - **Practical Risk:** It replaces one imperfection (noisy surveys) with another (small-group bias, persuasion effects).

  ### Follow-Up 2: Willingness to Pay vs. Equity (Health vs. Environment)
  - **The Inconsistency:**  
    Health appraisal (using QALYs) treats a health gain as equally valuable regardless of who gets it. Environmental appraisal (using WTP) values a wetland more if rich people use it. This *is* a fundamental inconsistency if both claim to measure *social welfare*.  
  - **What WTP Actually Measures in Practice:**  
    Your method treats WTP as a proxy for **opportunity cost in monetary terms**, not direct utility. It answers: "What resources would society sacrifice for this good while keeping *potential* Pareto efficiency (Kaldor-Hicks)?" This avoids interpersonal utility comparisons but accepts existing income distribution.  
  - **Why the Practice Survives (Pragmatically):**  
    - **CBA's Official Goal:** To identify *efficiency* improvements (potential Pareto improvements), not equity. Equity adjustments are seen as separate (tax/transfer policies).  
    - **Operational Necessity:** Monetization requires a common numeraire; money is the only feasible one. WTP is measurable; "utility" is not.  
  - **What Would Change Under a Welfare-Based Reading:**  
    If you took "utility" seriously as the goal:  
    1. **Weighted WTP:** Apply distributive weights (e.g., give higher weight to $1 from a poor person). Some governments do this for *project-level* equity analysis, but rarely for environmental valuation.  
    2. **Shift to Health-Like Metric:** Value environmental goods in "wellbeing units" (e.g., life satisfaction scales) instead of money. But this is methodologically immature.  
    3. **Explicit Equity Overlays:** Keep WTP for efficiency but add equity assessments (e.g., distributional impact analyses) as a separate decision factor.

  ### Conclusion: What Holds It Together?
  - **Core Commitment:** Utility is **cardinal latent preference intensity**, imperfectly revealed by choices, which must be purified to approximate "true" values under idealized conditions.  
  - **Coherence:** The practice is *operationally coherent* if viewed as measuring **monetized opportunity cost under Kaldor-Hicks efficiency**, not welfare. The health/environment inconsistency arises because health appraisal *abandons* Kaldor-Hicks for **universalized welfare egalitarianism** (a health gain is a gain, regardless of who gets it).  
  - **Tension:** It strains when:  
    - Surveys/purification imply utility is a "real" mental state.  
    - Equity concerns force welfare comparisons your methodology can't handle.  
  - **Survival:** The practice *can* survive by explicitly acknowledging its efficiency focus and treating equity separately. But philosophically, it rides a razor's edge between positivist RP and latent preference realism.  

  **Recommendation:** To reduce tension, explicitly frame CBA as measuring *efficiency in monetary terms* (not welfare), use distributional analysis alongside it, and restrict QALY-like universal metrics to domains where interpersonal comparison is socially mandated (like health). The citizens' assembly proposal, while interesting, requires a fundamental shift away from individual preference sovereignty.
