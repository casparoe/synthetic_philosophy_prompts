     - **Registry of Approved Bedrock Levels**: A list of levels (e.g., quantum, molecular, cellular, etc.) that are pre-approved as terminal, but note that the committee's own stopping rule is a skyhook. We can say that the registry is maintained by the committee and updated annually, but the levels are only acceptable if they are not themselves in need of explanation? But that's the problem.
  5. **Worked Abstracts**:
