answer: |-
  **Journal of Grounded Explanation**  
  **Instructions for Authors**  
  *Issued by the Committee on Explanatory Grounding*  
  *Version 7.3, Effective 1 January 2024*

  ### I. Principles of Explanatory Grounding  
  The *Journal of Grounded Explanation* (JGE) prioritizes submissions that adhere to the strictures of *causal descent*. An explanation is only valid if it traces phenomena through sequential strata of mechanism, wherein each stratum is both:  
  (a) **Exhaustively grounded**: Its operational capacities derive solely from interactions at the stratum immediately below it.  
  (b) **Non-tautological**: It may not possess the *same kind* of capacity it is invoked to explain (e.g., a "learning mechanism" cannot itself *learn*; a "self-repairing system" cannot *repair itself* without lower-level decomposables).  

  **Skyhooks**—defined as mechanisms that borrow unexplained causal power from strata *above* the phenomenon they purport to explain—are categorically prohibited. **Greedy reductionism**—skipping intermediate strata to affix high-level phenomena directly to lower-level mechanisms—is equally impermissible, as it destroys the explanatory scaffold.  

  ### II. Mandatory Submission Elements  
  #### A. Grounding Chain Documentation  
  All manuscripts must include a **Grounding Chain** (GC) schematic (Form GCE-7a). The GC must:  
  1. Display *all* explanatory strata between the target phenomenon and terminal bedrock.  
  2. Annotate each vertical transition with the causal principles enabling the ascent.  
  3. Terminate exclusively in a stratum listed in the **Registry of Approved Bedrock Levels** (see Appendix A).  

  **Terminal Bedrock Exclusions**: The following must *never* appear as terminal nodes:  
  - Emergence  
  - Self-organization  
  - Representation  
  - Normative frameworks  
  - Agentive capacities  

  #### B. Institutional Compliance Apparatus  
  1. **Boom-Crane Clause Disclosure (Form BCC-4)**:  
     Engineering-style schematics (e.g., "neural network architectures," "market equilibrium algorithms") risk being *boom-cranes*: mechanisms *described* as cranes but functionally skyhooks due to undecomposed causal primitives (e.g., "error-minimization" or "homeostasis" treated as atomic functions). Form BCC-4 requires authors to:  
     - Certify that no component’s capacity mirrors the phenomenon it explains.  
     - Attach a sub-GC for every component flagged by the Committee’s *Boom-Crane Auditor*.  

  2. **Certificate of Provisionally Grounded Status (CPGS)**:  
     If full descent to bedrock exceeds JGE’s 50-page limit, authors may apply for a CPGS. This permits truncation *only* if:  
     - The truncated chain reaches a stratum in the **Registry of Provisionally Terminable Levels** (Appendix B).  
     - All CPGS-linked submissions undergo triennial re-review until bedrock is reached.  

  ### III. Worked Compliance Examples  
  The following abstracts illustrate pre- and post-compliance revisions. Approved versions strictly satisfy grounding criteria while demonstrating the perils of explanatory avarice.  

  #### A. Animal Navigation  
  *Original*:  
  > "Migratory shorebirds navigate via magnetoreception, leveraging quantum spin coherence in cryptochrome proteins. This emergent sensing capacity facilitates geomagnetic field mapping."  
  *Non-compliances*: "Emergent" (terminal exclusion); "mapping" (unexplained capacity).  

  *Compliant (JGE Approved)*:  
  > "Cryptochrome proteins in *Calidris pusilla* undergo radical-pair electron transfers under Lorentz forces. Spin-state transitions correlate with neuronal depolarization frequencies (Δσ = 0.7, *p* < 0.001). Ion-channel cascades trigger muscle contractions aligning flight vectors with magnetic flux gradients (Form BCC-4 filed)."  
  *Note*: Navigation as *goal-directed behavior* is replaced by biomechanical correlates. The bird vanishes; the chain terminates in Lorentz forces (Registry Level: Electrodynamic Fields).  

  #### B. Human Concept Learning  
  *Original*:  
  > "Children acquire abstract concepts through Bayesian inference over symbolic representations, guided by innate cognitive priors."  
  *Non-compliances*: "Symbolic representations" (terminal exclusion); "innate" (unexplained capacity); "Bayesian inference" (tautological—*infers* inference).  

  *Compliant (JGE Approved)*:  
  > "Auditory cortex neurons (layer IV) exhibit spike-timing-dependent plasticity in response to phoneme sequences. Dopaminergic reward signals (VTA origin) modulate long-term potentiation thresholds. Co-activated neural ensembles form Hebbian assemblies (Form GCE-7a: strata 4–7)."  
  *Note*: Concept learning as *abstraction* is reduced to firing patterns. "Meaning" is omitted; chain terminates in synaptic weights (Registry Level: Cellular Electrophysiology).  

  #### C. Speculative Bubbles  
  *Original*:  
  > "Financial bubbles emerge from collective belief propagation, where bounded-rational agents herding on price signals trigger reflexive feedback loops."  
  *Non-compliances*: "Emerges" (terminal exclusion); "belief" (unexplained capacity); "bounded-rational" (tautological).  

  *Compliant (JGE Approved)*:  
  > "High-frequency trading algorithms execute buy/sell orders when asset prices deviate >2σ from 30-day moving averages. Order-book imbalances induce percolation threshold effects, modeled via Ising spin-glasses (Form BCC-4 filed). Market-wide volatility scales with cascade size (*R*² = 0.83)."  
  *Note*: Bubbles as *socioeconomic phenomena* dissolve into algorithmic mechanics. Chain terminates in percolation thresholds (Registry Level: Statistical Mechanics).  

  ### IV. Grounding Chain Termination Protocol  
  The Committee affirms that descent must halt at a **Registry of Approved Bedrock Levels** (Appendix A). Bedrock eligibility requires:  
  1. Causal closure under known physical laws.  
  2. Absence of endogenous goal-directedness.  
  3. Empirical validation across ≥3 experimental domains.  

  Current registry levels include: Quantum Fields, Electrochemical Gradients, and Gravitational Interactions. Proposals for new bedrock must file Form BED-12 and await Committee ratification.  

  ### V. Final Admonition  
  Explanatory rigor demands unwavering descent. Skyhooks corrupt science; cranes *build* it. The Committee shall reject any submission violating Section I, irrespective of phenomenological insight.  

  *Approved unanimously by the Committee on Explanatory Grounding,*  
  *Chair: Prof. E. Leveridge*  
  *Registrar: Dr. A. Keystone*  

  ---  
  **APPENDIX A**: Registry of Approved Bedrock Levels (2024)  
  1. Quantum Field Excitations  
  2. Fundamental Forces (Electromagnetic, Gravitational, Strong, Weak)  
  3. Thermodynamic State Transitions  
  4. Atomic Orbital Interactions  
  5. Molecular Binding Affinities  

  **APPENDIX B**: Registry of Provisionally Terminable Levels (CPGS-Eligible)  
  1. Protein Folding Energetics  
  2. Neural Spike Trains  
  3. Algorithmic Time-Complexity Classes
