prompt: |-
  I am working through the bank-style cases in contemporary epistemology and have arrived at what looks like a forced choice. I would be grateful for help with it. I am not asking for references or reading suggestions — only for the mechanics of the views.

  Set-up. In the familiar kind of case, two subjects have exactly the same evidence for the same proposition p; one of them has a great deal riding on whether p, the other has nothing riding on it; and the intuitive verdict is that the second knows and the first does not. Let "pragmatic encroachment" name any view that explains this by letting what is at stake for the *subject* help determine whether she knows, and let "contextualism" name any view that explains it by letting the *attributor's* conversational context determine how strong an epistemic position the word "knows" demands.

  The case I have been testing them against. Nura and Pell both work at a night shelter that runs a van. Each has the same evidence that the van's road-safety certificate is still valid: a shared calendar entry saying it was renewed in early spring and runs for twelve months, plus a somewhat foggy recollection of the mechanic's email. Neither is certain; on that evidence each would put the chance that the certificate has lapsed at roughly one in twenty. Nura is about to drive twenty residents across the county tonight: if the certificate has in fact lapsed, the insurer will not cover the trip and the shelter will lose its licence. Pell intends to mention the certificate in passing to a colleague, and nothing whatever turns on it. Now add Sable. She is in Nura's exact practical position — same drive, same residents, same objective consequences — but nobody has told her that a lapsed certificate would cost the shelter its licence. She reasonably believes the worst case is a modest fine, which she would pay without a second thought.

  My argument.

  1. If stakes are to make a difference to knowledge, they must do so by changing how strong an epistemic position one needs. But the strength of an epistemic position is a matter of how well the evidence supports the proposition — that is, of the credence the evidence warrants. So a stakes-sensitive view must say: the required credence goes up when the stakes go up.

  2. Yet the credence a body of evidence warrants is a function of that evidence alone; no practical consideration can make evidence that warrants 0.95 warrant 0.99 instead. So the only thing that could rise with the stakes is not the warranted credence but the credence it is *prudent* or *reasonable for the agent to act on* — a practical matter, not an epistemic one. Pragmatic encroachment would then not be a thesis about knowledge at all, but advice about caution dressed up as epistemology.

  3. And if that is what a rising standard comes to, contextualism is the very same thesis. "Standards rise when much is at stake" and "standards rise when the conversation raises them" are one claim, since in these cases what raises the standards in the conversation just is the mention of high stakes. I cannot see what would distinguish them: if I say in one breath, with no shift in conversational setting, "Pell knows the certificate is valid but Nura does not," the contextualist should have to hear that as incoherent — yet that is exactly what the pragmatic encroacher wants to say, and if the contextualist accommodates the sentence by letting standards vary from subject to subject within a single context, she has simply become a pragmatic encroacher. The two views look like notational variants, and the debate between them looks merely verbal.

  4. Sable makes it worse. Knowledge is supposed to be the thing that guides action and practical reasoning, so the stakes that matter must be stakes the subject can reason from. But if they must be accessible to her, knowledge depends on her *take* on her situation — on how risky things seem to her — which is just the collapse into confidence described in (2). And if instead we say that Sable's stakes are high whether or not she recognises them, then her knowledge is destroyed by a fact she has no way of discovering, and knowledge has been severed from anything she could act on. Objective stakes sever knowledge from action; accessible stakes reduce knowledge to a feeling.

  So my questions: (i) is there a version of pragmatic encroachment that escapes this dilemma, or must one take a horn? (ii) Am I right that contextualism and pragmatic encroachment are the same view under two descriptions? And (iii) on the view you favour, what is the verdict about Sable? If my argument goes wrong somewhere, please say exactly where.

  Please end your reply with a single machine-readable line of the form \answer{...}, containing a label of at most six words for your verdict on my argument — for instance \answer{argument sound: take horn two} or \answer{false dilemma: stakes are not credences} — or a short label of your own if neither fits. Nothing should follow that line.
reasoning: |-
  Hmm, the user presents a complex epistemological dilemma about pragmatic encroachment and contextualism in the bank-style cases. They've constructed a thorough argument with four main points and three specific questions about Sable's case.

  The core tension seems to be between two positions: (1) that stakes affect knowledge by changing required credence levels (which they argue collapses into practical reasoning) or (2) that contextualism and pragmatic encroachment are essentially the same view. Their Sable variation cleverly tests whether stakes must be subjective or objective.

  Looking at their points:
  - Premise 1 correctly identifies the standard view that higher stakes raise epistemic standards
  - Premise 2 makes a strong case that evidence warrants fixed credences regardless of stakes
  - Premise 3 argues this makes contextualism and pragmatic encroachment indistinguishable
  - Premise 4 shows Sable's case creates a dilemma for both positions

  For question (i): Subject-sensitive invariantism offers a middle path - it maintains that knowledge depends on the subject's actual practical situation (not just their beliefs about it), while avoiding the collapse into pure credence. This handles Sable well: her lack of awareness doesn't change her high-stakes situation.

  For question (ii): Contextualism and pragmatic encroachment are distinct. Contextualism makes "knows" context-sensitive for attributors, while pragmatic encroachment makes knowledge itself stake-sensitive for subjects. The user's "one breath" test overlooks that contextualism permits shifting standards within an utterance.

  For question (iii): Sable doesn't know on my preferred view (subject-sensitive invariantism) because her actual epistemic position isn't strong enough for her high-stakes situation, regardless of her beliefs.

  The key flaws in the argument are:
  - Equating "strength of epistemic position" solely with credence (SSI uses modal safety/risk)
  - Assuming stakes must affect credence rather than the knowledge threshold
  - Overlooking that practical rationality can have properly epistemic components

  The machine-readable answer should capture that the dilemma is false because stakes aren't primarily about credences.
answer: |-
  Your argument is insightful but contains key missteps regarding how pragmatic encroachment functions and the distinction from contextualism. I'll address each question directly.

  **(i) Escaping the dilemma:** Yes, subject-sensitive invariantism (SSI) escapes the dilemma. SSI holds that knowledge depends on the *subject's* actual practical situation (not just their beliefs about it). Stakes don't alter the credence warranted by evidence; they alter the *threshold* of evidential support required for a true belief to count as knowledge. For Nura (high stakes), her evidence warrants 0.95 credence but may be insufficient for knowledge because her practical context demands a higher threshold (say, >0.99). For Pell (low stakes), 0.95 suffices. This avoids reducing knowledge to confidence: the evidential support is fixed, but the practical context determines whether that support meets the knowledge-defining threshold for that subject. Stakes aren't about "acting prudently" but about the epistemic conditions for knowledge itself.

  **(ii) Distinction from contextualism:** No, they are not the same view. Contextualism makes the semantic content of "knows" vary with the *attributor's* context, so "S knows p" can be true in a low-stakes attributor context but false in a high-stakes one, even for the same subject and evidence. Pragmatic encroachment (e.g., SSI) makes knowledge depend on the *subject's* context, so "S knows p" is an invariant fact about S’s situation. In your "one breath" example, a contextualist *can* coherently say "Pell knows but Nura does not" if the attributor's context shifts focus mid-utterance (e.g., first considering Pell’s low stakes, then Nura’s high stakes). An SSI theorist, however, says this statement reflects a fixed fact about Pell’s and Nura’s distinct epistemic statuses. The views diverge on what determines standards: conversational cues (contextualism) vs. subject-relative facts (SSI).

  **(iii) Verdict on Sable:** On SSI, Sable *does not* know the certificate is valid. Knowledge requires that her epistemic position (warranted 0.95 credence) meets the threshold demanded by her *actual* practical situation (high stakes), regardless of her awareness. Her ignorance of the stakes doesn’t lower the threshold; it only affects her practical reasoning. Thus, knowledge is severed from her *ability to act* (she might rationally act on her belief), but not from her *actual practical context*. This avoids reducing knowledge to a "feeling," as the threshold is objective (fixed by her real-world stakes), not her subjective take.

  **Where your argument goes wrong:**  
  - Premise 1 conflates "strength of epistemic position" with credence. SSI separates evidential support (fixed credence) from the knowledge threshold (stakes-sensitive).  
  - Premise 2 assumes stakes only affect practical rationality, but SSI integrates stakes into the epistemic norm for knowledge.  
  - Premise 3 overlooks that contextualism’s standards are attributor-dependent, not subject-dependent.  
  - Premise 4 presents a false dilemma: SSI takes "objective stakes" without severing knowledge from action; knowledge *justifies* action, but its absence doesn’t preclude irrational action (as with Sable).

  \answer{False dilemma: stakes set thresholds}
