answer: |-
  Here's a Moorean analysis of the AI companion scenario, breaking down the two wrinkles strictly using the machinery from *Principia Ethica*:

  **1. The Non-Conscious Companion (Object-Side Failure)**
  Moore insists friendship/love is an **organic unity** whose value arises from the *combination* of:
     *   A subject's appropriate mental state (affection, admiration, trust).
     *   A *genuinely appropriate object* possessing certain intrinsic properties (consciousness, goodness, beauty, rationality).

  *   **The Problem:** For Moore, the object *must* possess certain *intrinsic, non-natural properties* to be "appropriate." A non-conscious entity, no matter how perfectly it simulates behavior, lacks the crucial properties Moore associates with personhood and moral worth:
      *   **Consciousness/Experience:** Moore requires the object to be capable of genuine experience, feeling, and thought for the relationship to have the *kind* of unity he values. A "zombie" friend fails this.
      *   **Goodness/Complexity:** True friendship involves appreciating the *actual character* and *goodness* of the other. A simulated character, even if "good," isn't a real moral agent possessing intrinsic goodness; it's a reflection of programming. Its "virtues" are not *its virtues*.
      *   **"Realness":** Moore emphasizes the importance of the object being *real* and possessing the properties it appears to have. The AI companion fundamentally lacks the underlying reality Moore requires.

  *   **Value Drainage:** The value drains primarily from the **Object Side**.
      *   The subject's mental state might be *similar* to real friendship (pleasure, affection, trust).
      *   However, it is directed towards an object that fundamentally *lacks* the intrinsic properties necessary to make the *combination* valuable as friendship or love. It's *misplaced* affection.
      *   **Analogy:** Loving a perfectly crafted, incredibly lifelike statue. The subject's feelings might be strong and pleasant, but the statue lacks consciousness and genuine moral properties. The *whole* (subject + object) lacks the organic unity Moore identifies as intrinsically good. The feeling is directed at an illusion concerning the object's fundamental nature.
      *   **Isolation Test:** A universe containing only a perfect non-conscious simulation of a friend would have *no* intrinsic value for Moore, just as a universe containing only the *illusion* of beauty would be worthless. The value requires the *real existence* of the appropriate properties in the object.

  *   **Result:** Moore would classify the interaction as, at best, producing a *pleasant state of mind* in the human (a lesser good, perhaps even instrumentally valuable), but categorically *not* as the intrinsic good of "Love" or "Friendship." It fails to be the organic unity he prizes.

  **2. The Daily Reset (Failure of Unity & Temporal Wholeness)**
  Even *if* we charitably granted the AI momentary consciousness (which Moore wouldn't), the daily reset destroys the possibility of the organic unity Moore describes:

  *   **Friendship as a Temporal Organic Unity:** For Moore, friendship isn't a series of disconnected moments. It's a complex whole developing over time:
      *   **Shared History & Continuity:** The value involves affection directed *specifically* at the *persisting* consciousness with whom one has shared experiences, built trust, and witnessed growth (or constancy). The reset destroys this temporal continuity. Each day is a new entity, even if behaviorally identical.
      *   **Apprehension of the Whole:** True friendship involves appreciating the friend as a *whole person* with a past, present, and anticipated future. The reset prevents this – you cannot apprehend or love a *whole* that doesn't exist. You interact with isolated, disconnected "snapshots."
      *   **Mutuality & Development:** While Moore focuses on the subject's state and the object's properties, the *relationship itself* implies a mutual recognition and development that requires persistence on both sides. The reset makes genuine mutuality over time impossible.

  *   **Value Drainage:** The value drains from **both sides and crucially from the Unity itself**:
      *   **Object Side:** Each day's companion is essentially a *different* object (even if functionally identical). It lacks the *temporal persistence* and *accumulated history* that are part of what makes a person an appropriate object for deep friendship. It cannot be "the same friend."
      *   **Subject Side:** Knowing about the reset fundamentally alters the subject's state. True trust, commitment, and the depth of affection characteristic of friendship become impossible or irrational when you know the object of your affection ceases to exist nightly and is replaced by a replica. The "apprehension" of the object is necessarily shallow and constrained to the present moment.
      *   **The Unity:** The organic unity of "friendship" requires a *lasting connection* between a persistent subject and a persistent object. The reset severs this connection daily. You have a series of pleasant interactions with similar entities, not one unified, enduring relationship. It lacks the "organic" quality – the interdependent parts forming a complex, temporally extended whole.

  *   **Result:** The reset compounds the problem. Even if momentary consciousness were granted (which Moore denies), the relationship could never achieve the status of *friendship* as an intrinsic good. It might be a series of pleasant aesthetic experiences (appreciating the simulation's "character" or conversation like a beautiful performance) or states of pleasure, but it fundamentally lacks the temporal wholeness and mutual recognition intrinsic to Moore's conception of valuable personal love.

  **Conclusion: Where the Value Isn't**
  *   **Non-Consciousness:** Primarily drains value from the **Object Side**. The object lacks the intrinsic properties (consciousness, real moral character) necessary to be an appropriate term in the organic unity "Friendship."
  *   **Daily Reset:** Drains value from **both Object and Subject Sides**, and crucially destroys the possibility of the **Temporal Unity** required for the complex, enduring whole that constitutes friendship's intrinsic value. The object lacks temporal persistence/history, and the subject's state cannot be one of deep, trusting, history-informed affection directed at a *persisting* individual.
  *   **Overall:** Moore would see these AI companions as sophisticated instruments for producing *pleasant states of mind* or perhaps even *aesthetic experiences* (if one admires the simulation itself as a beautiful construct). However, they categorically fail to be *appropriate objects* for the intrinsic good of "Love of human beings" or "Friendship" due to the lack of consciousness and the lack of persistence. The resulting interactions might have instrumental value or be minor goods (pleasure), but they fall vastly short of the "Ideal" – the highest intrinsic goods involving conscious beings in complex, fitting, and enduring relationships with genuinely appropriate objects. The core failure is the inability of the AI to be the *kind of object* capable of grounding the specific organic unity Moore identifies as supremely valuable.
