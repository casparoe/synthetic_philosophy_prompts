answer: |-
  **Adversarial Collaboration Framework: Bell's Theorem Interpretation**  
  *(Drafted for signatures of Camp A and Camp B representatives)*  

  ---

  ### **1. Agreed Claims**  
  *(Neutral, empirically grounded statements both camps endorse)*  

  1. **Bell’s Formal Result**: Bell’s inequality is a mathematical constraint derivable from three assumptions:  
     - (i) **Outcome Definiteness**: Each measurement yields a single outcome per wing.  
     - (ii) **Local Causality**: Outcomes on one wing depend only on local settings and pre-existing shared variables (λ), not on remote settings or outcomes.  
     - (iii) **Settings-Independence (Exogeneity)**: The choice of settings is statistically independent of λ (i.e., *P(λ|settings) = P(λ)*).  
     Experiments violate Bell inequalities; thus, *at least one* assumption fails.  

  2. **Experimental Status**:  
     - Bell inequalities are violated reproducibly (e.g., in loophole-free experiments).  
     - No-signalling holds: marginal outcome probabilities are independent of remote settings.  
     - No experiment to date has detected systematic dependence of λ on settings.  

  3. **The Third Escape Route (Everett/Many-Worlds)**:  
     - Rejecting Outcome Definiteness (via non-terminating unitarity) permits local correlations.  
     - *Camp A’s rejection*: Violates direct empirical access to definite outcomes.  
     - *Camp B’s rejection*: Adds unobservable metaphysical structure without empirical gain.  

  4. **Causal Inference Framework**:  
     - Settings-independence is equivalent to the *exogeneity condition* in causal graphs: no latent confounder between settings and λ.  
     - Randomization (as in clinical trials) is a physical implementation of exogeneity.  
     - Bell’s theorem is a no-go result *within* this causal framework. The residual dispute concerns whether exogeneity is a *physical law* or an *epistemic precondition* for experiments.  

  5. **Unresolved by Experiment Alone**:  
     - Existing data cannot distinguish between nonlocality (A) and violations of exogeneity (B).  
     - Both camps agree relativity’s empirical success (no signalling) requires reconciliation.  

  ---

  ### **2. Disagreements Table**  
  *(Each row states one disagreement in both camps’ preferred terms)*  

  | **Disagreement**                                                                 | **Camp A’s Statement**                                                                 | **Camp B’s Statement**                                                                 | **Nature** |
  |----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|------------|
  | **Status of Settings-Independence**                                              | "Exogeneity is a necessary precondition for *any* experimental inference; rejecting it voids the meaning of ‘test’." | "Exogeneity is an auxiliary assumption with no independent empirical support; it may fail in a lawful universe." | Substantive (Physical vs. Epistemic) |
  | **Physical Mechanism for Correlations**                                          | "Violations require a causal dependence of local outcomes on *remote settings*."       | "Violations are explained by correlations between λ and settings via *common causes* (e.g., cosmological/retrocausal)." | Substantive (Causal Structure) |
  | **Cost of Rejecting Exogeneity**                                                 | "Rejecting exogeneity implies experimental science is impossible *in principle*."      | "Rejecting exogeneity implies rare, fine-tuned correlations with no bearing on typical experiments." | Verbal (Scope of "Science") |
  | **Compatibility with Relativity**                                                | "Nonlocality must be made ‘peaceful’ (e.g., future theory may reconcile it with relativity)." | "Retrocausal/superdeterminist models *naturally* respect relativistic spacetime structure." | Substantive (Theoretical Integration) |

  ---

  ### **3. Cruxes Table**  
  *(Sub-questions where evidence could shift positions; predictions pre-committed)*  

  | **Crux**                          | **Test/Case**                                                                 | **Camp A Prediction**                                                                 | **Camp B Prediction**                                                                 | **Discriminatory?** |
  |------------------------------------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|---------------------|
  | **Empirical Protocol**             | Swap setting generators (RNG→decay→chaos→human→RNG) in a stable Bell test. Record violation strength and λ-proxy correlations (e.g., source intensity). | **Violation strength invariant.** *Grounds:* QM predicts settings-independence; protocol tests physicality of exogeneity. | **Varies by generator type.** *Grounds:* If λ couples locally to generator physics, correlations change. *Exception:* Global superdeterminism predicts **invariance**. | Yes (if variation observed) |
  | **Theoretical Model**              | Construct a local hidden-variable model violating exogeneity *without* fine-tuning. | **Impossible:** Any such model either signals or requires conspiratorial λ-setting correlations. | **Possible:** E.g., retrocausal toy models (e.g., Price-Wharton) show λ adapts "causally" to settings. | Yes (if model reproduces QM) |
  | **Metaphysical Cost**              | Does rejecting exogeneity imply experimental science is circular?             | **Yes:** Without exogeneity, no experiment can test causal claims.                   | **No:** Exogeneity fails *only* for Bell correlations; other experiments unaffected. | No (Conceptual) |
  | **Cosmological Testability**       | Can cosmic initial conditions explain λ-setting correlations?                | **Irrelevant:** Cosmology cannot salvage exogeneity; it shifts fine-tuning to the Big Bang. | **Yes:** Global constraints (e.g., Wheeler’s law) may embed correlations lawfully. | No (Speculative) |

  ---

  ### **4. Evidence Against Own View**  
  *(Per camp, conditions that would falsify their position)*  

  - **Camp A**: Reproducible violation of a Bell inequality *without* remote setting-dependence (e.g., a local model violating exogeneity passes all tests).  
  - **Camp B**: An experiment where settings *cannot* physically correlate with λ (e.g., spacelike-separated, randomized settings) yet Bell violation persists.  

  ### **Final Verdict**  
  The dispute reduces to a choice between:  
  - **Camp A’s bill**: Retain exogeneity as sacrosanct → accept nonlocality.  
  - **Camp B’s bill**: Reject exogeneity as contingent → retain locality + novel causation.  
  **No existing empirical result or theorem forces this choice.** The proposed protocol (§3, Crux 1) could provide discriminating evidence, but absent observed generator-dependence, the disagreement remains metaphysical. The collaboration concludes that *settling* the issue requires either (a) empirical data from the generator-swap test, or (b) a theory unifying relativity and quantum correlations that decisively excludes one option.  

  ---  
  **Gaps Noted**:  
  - The exogeneity condition assumes a classical causal graph; quantum causal models remain underdeveloped.  
  - "Fine-tuning" accusations are qualitative; no agreed metric exists.  
  - Retrocausal models lack uncontroversial dynamical laws.  

  *(Document ends; signatures follow)*
