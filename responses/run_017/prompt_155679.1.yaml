prompt: |-
  I volunteer with a small grantmaking group that funds speculative long-termist projects, and after two funding rounds I've noticed that my gut reactions to cases are badly out of joint with each other. I'd like to know whether there is a single principle behind them, or whether I simply have to give some up. Here is where I land:

  (a) An engineering project whose risk model I broadly trust puts it at roughly a one-in-a-million chance of averting a catastrophe that would kill everyone alive today; the cost to us is about $200,000. I fund it without much hesitation.

  (b) Same shape, much larger numbers: a proposal our physicist member estimates at a one-in-a-trillion chance of preserving a civilization of 10^30 people. The expected value dwarfs (a), and I want to say no.

  (c) The mugging case: a stranger emails us saying that $200,000 will let him, by means he won't specify, save 10^100 lives. I refuse instantly. What troubles me is that I feel roughly the same reluctance in (b) and (c), even though in (b) I accept the number and in (c) I don't believe it at all — so my resistance in (b) can't be the usual move of dismissing the probability estimate, which is how people normally get out of this.

  (d) Bundling: ten thousand independent projects, each with a one-in-ten-thousand chance of a very large good, each cheap. I would happily fund the whole portfolio, and yet asked about any single one of them — including the marginal one, dropping which lowers the portfolio's chance of success by one part in ten thousand — I want to say no. Is that straightforwardly incoherent, or could a defensible principle be irreducibly about portfolios rather than about individual acts?

  (e) Uncertain magnitude: a project with a one-in-a-billion chance of a good whose size we can't pin down — our best guess is that every order of magnitude between 10^10 and 10^50 lives is equally likely. The expected value here is far above (b), and I recoil more than I do in (b). Something in me penalizes not knowing how big the payoff is, over and above the effect that uncertainty has on the expectation.

  (f) Harms: a one-in-a-million chance of causing 10^20 units of suffering. I feel far more strongly that we must avoid this than that we must pursue the mirror-image good. A friend says this is just loss aversion and that I should drop it; I can't tell whether she's right.

  (g) Costless: a button that genuinely costs us nothing, with a one-in-a-trillion chance of a 10^30-person payoff. Here I flip and press it, and I notice I would press it even if the chance were far smaller. That makes me suspect my reluctance in (b) was entirely about what else the money could do, and hence that I don't really have a problem with fanaticism at all — but that conclusion feels too cheap, and it sits badly with (c), where the money matters and I refuse anyway.

  My tentative principle, such as it is: I seem to deflate stated probabilities by a factor that grows with the size of the claimed payoff, roughly as if the effective probability were the stated one divided by the logarithm of the payoff. That keeps (a) and gets (b) and (e) right. But someone in the group pointed out that it doesn't do the work I wanted, since the product still grows without bound as the payoff does: I would remain committed to chasing a one-in-a-googol chance of a good that is large enough, which is exactly what I was trying to avoid.

  So: can you give me one principle, or failing that a short list of candidates, that captures as much of this pattern as possible? For each, please say which clause is forced by which of my verdicts, what it predicts about a case I keep going back and forth on — whether I should buy a thousand, or a billion, independent tickets of the (b) type, given that my bundling instinct in (d) pulls me toward yes while my verdict in (b) pulls toward no — and which of my verdicts it cannot accommodate. If some verdicts have to go, I would rather be told plainly which are the weakest and why than have all seven preserved by a principle with a separate bolted-on exception for each.
reasoning: |-
  Okay, the user is grappling with inconsistencies in their decision-making process for funding speculative long-termist projects. They've laid out seven scenarios (a) through (g) where their gut reactions seem contradictory, particularly around handling extremely low-probability, high-impact outcomes. 

  First, let's acknowledge their self-awareness - noticing these inconsistencies after only two funding rounds shows impressive metacognition. The core tension is between expected value theory (which would demand funding all positive-EV projects) and their intuitive resistance to "fanaticism" (pursuing vanishingly small chances of astronomical payoffs). 

  Their proposed logarithmic probability dampening is clever but mathematically insufficient, as they correctly note - it still justifies pursuing googol-scale payoffs. The physicist's trillion-to-one proposal in (b) versus the obvious scam in (c) highlights that their objection isn't purely about credibility; even trusted estimates trigger discomfort at certain scales. 

  The bundling paradox in (d) is particularly revealing. Willingness to fund portfolios while rejecting individual components suggests their brain uses different evaluation modes for isolated acts versus aggregated strategies. This reminds me of prospect theory's editing phase, where people mentally reframe decisions. 

  For (e), their aversion to magnitude uncertainty exceeds what variance alone explains. I suspect this ties to narrative coherence - unknown stakes feel qualitatively different than quantified risks. With (f), the asymmetric weight on harm avoidance aligns with neuroscientific findings about loss aversion being stronger than gain pursuit. 

  The costless button in (g) undermines their earlier resistance, pointing to opportunity cost concerns. But why then reject (c) where money also matters? Probably because (c) fails baseline credibility filters while (b) merely strains plausibility. 

  Three candidate principles emerge: 
  1) Expected value with logarithmic utility - but this fails their no-googol test. 
  2) Multiplicative probability skepticism - which handles (b,c,e) but feels ad hoc. 
  3) Portfolio evaluation - which resolves (d) beautifully but struggles with isolated big bets. 

  The portfolio approach seems most promising if combined with a "minimum credible probability" threshold. For their ticket bundle dilemma: buying a thousand (b)-type tickets might feel acceptable (portfolio effect), but a billion tickets would likely retrigger fanaticism alarms unless costs are negligible. 

  Ultimately, (b) and (c) might need to be treated differently - (b) as "edge of plausibility" and (c) as "not credible." Their loss aversion in (f) is probably justified for catastrophic risks, but should be examined case-by-case. The weakest link is (e) - penalizing magnitude uncertainty beyond its effect on variance may be irrational and should potentially be dropped.
answer: |-
  Based on your pattern of intuitions across cases (a) through (g), I propose **"Thresholded Portfolio Expected Logarithmic Utility" (TPELU)** as the unifying principle. It combines four key elements to capture your judgments while avoiding fanaticism:

  1.  **Logarithmic Utility:** Value scales with the *logarithm* of the magnitude of the outcome (lives saved/suffering averted). This addresses diminishing sensitivity to scale.
  2.  **Portfolio Evaluation:** Acts are evaluated *within the context of the entire portfolio* of funded projects, not purely in isolation. This resolves (d).
  3.  **Probability Threshold:** Stated probabilities are deflated by a factor related to the *logarithm of the claimed outcome magnitude*. This directly implements your intuition and handles (a), (b), (c), (e).
  4.  **Loss Aversion Asymmetry:** Negative outcomes (harms) have greater weight than positive outcomes of the same magnitude. This captures (f).

  **How TPELU Works & Justifies Your Verdicts:**

  *   **Utility Function:** U(ΔL) = Sign(ΔL) * log(|ΔL|) for positive ΔL (lives saved), U(ΔS) = -k * log(|ΔS|) for negative ΔS (suffering caused), with k > 1 (loss aversion).
  *   **Effective Probability (p_eff):** p_eff = p_stated / log(|ΔOutcome|). This formalizes your dampening factor.
  *   **Portfolio Context:** The expected utility (EU) of an *individual project* is calculated as: EU_indiv = p_eff * U(ΔOutcome) - Cost. However, the *decision to fund* depends on whether it improves the EU of the *entire existing portfolio* of funded projects. This EU_portfolio is the sum of EU_indiv for all funded projects. Funding a project requires:
      1.  EU_indiv > 0 (positive standalone value after dampening), *and*
      2.  EU_portfolio (including this project) > EU_portfolio (excluding it) (marginally improves the portfolio), *and*
      3.  The cost is justified compared to alternative portfolio improvements.

  **Applying TPELU to Your Cases:**

  *   **(a) Small Catastrophe (Fund):** ΔL = 8e9 lives. log(ΔL) ≈ 22.9. p_eff = 1e-6 / 22.9 ≈ 4.4e-8. U(ΔL) = log(8e9) ≈ 22.9. EU ≈ (4.4e-8 * 22.9) - (Cost Utility). Cost Utility is small (log($200k) ≈ 12.2, but utility of money isn't directly log(lives), assume it's manageable). EU_indiv > 0. Portfolio improvement likely. **FUND.**
  *   **(b) Large Civilization (Reject):** ΔL = 1e30 lives. log(ΔL) ≈ 69.1. p_eff = 1e-12 / 69.1 ≈ 1.45e-14. U(ΔL) = 69.1. EU ≈ (1.45e-14 * 69.1) - Cost Utility ≈ 1e-12 - Cost Utility. EU_indiv is *extremely* small positive, easily swamped by the cost utility (log($200k) ~12.2, equivalent to losing ~10^5 lives in utility terms). Very unlikely to improve portfolio vs. alternatives. **REJECT.**
  *   **(c) Mugging (Reject):** ΔL = 1e100 lives. log(ΔL) ≈ 230. p_eff = 1 / 230 ≈ 0.0043 (even if you charitably assign p=1). U(ΔL) = 230. EU ≈ (0.0043 * 230) - Cost Utility ≈ 1 - Cost Utility. EU_indiv is small positive *only if you assign p_stated=1*. If you intuitively assign a much lower p_stated (e.g., 1e-10), p_eff becomes miniscule (p_eff ≈ 1e-10 / 230 = 4e-13). EU_indiv << 0. **REJECT.** (Your intuition stems from extreme p_eff dampening + low subjective p_stated).
  *   **(d) Bundling (Fund Portfolio, Reject Marginal):**
      *   *Portfolio:* 10,000 projects. Each p_stated=1e-4, ΔL = L (large). log(ΔL) = log(L). p_eff = 1e-4 / log(L). U(ΔL) = log(L). EU_indiv ≈ (1e-4 / log(L)) * log(L) - Cost Utility = 1e-4 - Cost Utility. EU_portfolio ≈ 10,000 * (1e-4 - Cost Utility) = 1 - Portfolio Cost Utility. Likely positive/attractive. **FUND PORTFOLIO.**
      *   *Marginal Project:* EU_indiv ≈ 1e-4 - Cost Utility. Likely *negative* if Cost Utility > 1e-4 (quite possible). Furthermore, its marginal contribution to EU_portfolio (≈1e-4) might be less than the cost could achieve elsewhere. **REJECT MARGINAL.** (Portfolio context is essential).
  *   **(e) Uncertain Magnitude (Reject):** Uncertainty penalizes twice. First, effective probability dampening uses the *expected log*, which is lower than log(expected magnitude) due to Jensen's inequality. More crucially, the range (10^10 to 10^50) means log(ΔL) ranges 23 to 115. The *dampening factor* log(|ΔOutcome|) in p_eff is itself uncertain and potentially very large. p_eff = p_stated / E[log(ΔL)] or worse, a conservative estimate (e.g., / min_log or / max_log). If we use E[log(ΔL)] ≈ (23+115)/2 = 69, similar to (b), EU is small. But the *uncertainty around the dampening factor* makes the effective probability feel even less reliable, likely leading to a *further* intuitive penalty or using a higher dampening factor (e.g., log(max) = 115), tanking p_eff. This extra penalty captures your "recoil". **REJECT.**
  *   **(f) Harms (Strong Reject):** ΔS = 1e20 suffering units. U(ΔS) = -k * log(ΔS) = -k * 46.1 (k>1). p_eff = 1e-6 / log(ΔS) ≈ 1e-6 / 46.1 ≈ 2.2e-8. EU ≈ 2.2e-8 * (-k * 46.1) - Cost Utility ≈ -1e-6 * k. Negative EU_indiv amplified by k>1. Strongly reduces portfolio EU. **STRONGLY REJECT.** (Loss aversion k>1 is key).
  *   **(g) Costless Button (Fund):** Cost Utility = 0. ΔL = 1e30. log(ΔL) = 69.1. p_eff = 1e-12 / 69.1 ≈ 1.45e-14. U(ΔL) = 69.1. EU_indiv ≈ 1.45e-14 * 69.1 ≈ **1e-12**. This is *positive* (barely!), and since Cost=0, adding it marginally improves the portfolio EU by 1e-12 at no cost. **FUND.** (Confirms your reluctance in (b) was cost-driven. TPELU allows fanaticism *only* when costs are truly negligible).

  **Resolving the Core Tension & Your Ticket Dilemma:**

  *   **Avoiding Fanaticism:** TPELU avoids the "one-in-a-googol" problem. For ΔL = 1e100, log(ΔL) = 230. p_eff = p_stated / 230. To get EU_indiv > 0 (ignoring cost) requires p_stated * U(ΔL) > 0 → p_stated * 230 > 0 (always true for p_stated>0). BUT: EU_indiv = (p_stated / 230) * 230 = **p_stated**. The expected utility reduces to just the *stated probability itself* (a tiny number), *not* the vast outcome magnitude. Funding requires EU_indiv > Cost Utility. For any significant cost, EU_indiv (≈p_stated) will be vastly smaller than Cost Utility. Only truly costless options (like (g)) get funded based on miniscule EU_indiv.
  *   **Ticket Bundle (b-Type) Dilemma:**
      *   *Principle Prediction:* TPELU evaluates the *bundle as a portfolio*.
      *   *N Tickets:* Each has EU_indiv ≈ p_stated (as above, dampening cancels utility). Bundle EU ≈ N * p_stated - Bundle Cost Utility.
      *   *Decision:* Compare Bundle EU to 0 and to alternatives.
          *   **1,000 Tickets (p_stated=1e-12?):** Bundle EU ≈ 1000 * 1e-12 = 1e-9. If the total cost is low enough (Cost Utility << 1e-9), it *might* marginally improve the portfolio. Your bundling instinct ((d)) might say **yes**.
          *   **1,000,000 Tickets:** Bundle EU ≈ 1e-6. More likely Cost Utility < 1e-6? **Probably yes.**
          *   **1,000,000,000 Tickets:** Bundle EU ≈ 0.001. Cost Utility for $200M? log(200e6)≈19.3, equivalent to losing ~e^19 lives! 0.001 << 19.3. **Strong NO.** (Your (b) instinct dominates).
      *   *Verdict:* TPELU predicts you would fund **small bundles** (where N * p_stated > Cost Utility) but **reject large bundles** (where cost dominates) or even small bundles if costs are too high relative to N*p_stated. This matches your conflicted pull.

  **What Must Be Relinquished (Weakest Links):**

  1.  **Strict Adherence to Unbounded EV in (a):** TPELU funds (a) readily, but *not* because its raw EV is high. It funds it because the dampened EU_indiv is still sufficiently positive relative to cost *and* improves the portfolio. If (a)'s cost were much higher (say $2M), TPELU might reject it, whereas naive EV might still accept. You need to accept that your intuition isn't tracking raw EV.
  2.  **Complete Dismissal of All Massive Claims (c):** TPELU shows that if you *truly* believed the mugger's probability claim (p_stated=1), EU_indiv ≈1, making it fundable *if costs are low enough*. Your instant rejection relies on an *extremely* low subjective p_stated (which is rational). TPELU forces you to concede that *if* p_stated were credible *and* costs negligible, you *would* fund it, just like (g). Your rejection in (c) is driven by disbelief, not by the principle itself handling the magnitude.
  3.  **Pure Isolation in (d):** You must fully embrace portfolio evaluation. Rejecting a marginally beneficial project within a beneficial bundle is coherent under TPELU.

  **Candidate Principles Considered & Rejected:**

  *   **Pure Expected Log Utility:** Funds (b), (g), large bundles of (b), and possibly (c) if p_stated believed. Violates your rejections of (b), (c), large bundles.
  *   **Fixed Probability Threshold (e.g., p_min=1e-9):** Rejects (b), (c). Funds (a), (g). Struggles with (d) (why fund the portfolio if each p<1e-9?) and (e) (depends on p_stated). Doesn't explain dampening intuition or costless (g).
  *   **Multiplicative Probability Skepticism (p_eff = p_stated / ΔL^c):** Avoids fanaticism (if c>0), rejects (b), (c). Can accept (a), (g). Struggles with (d) (same as fixed threshold). Doesn't explain loss aversion (f) or portfolio effects. Less elegant than log-based dampening.
  *   **Risk Aversion over Utilities:** Adds complexity; doesn't cleanly resolve (d) or the core fanaticism issue as well as TPELU. Loss aversion (f) is a specific form best handled separately.

  **Conclusion:**

  **Thresholded Portfolio Expected Logarithmic Utility (TPELU)** best captures your pattern:
  *   **Log Utility + Probability Dampening** handles scale sensitivity ((a), (b), (c), (e)).
  *   **Portfolio Evaluation** resolves the bundling paradox ((d), ticket dilemma).
  *   **Loss Aversion** explains the harm asymmetry ((f)).
  *   **Cost Comparison** explains the costless flip ((g)) and reluctance in (b).

  It makes coherent predictions for your ticket bundle dilemma (fund small/cheap bundles, reject large/expensive ones) and avoids fanaticism by reducing the EU of massive claims to approximately their stated probability. The weakest links are accepting portfolio-based reasoning as fundamental and acknowledging that rejection in (c) relies on disbelief rather than the principle itself rejecting high magnitude *given* the (implausible) probability claim. This principle provides a rigorous, non-arbitrary foundation for your intuitions.
