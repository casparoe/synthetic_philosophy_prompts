prompt: |-
  You are a philosopher of probability who also works closely with clinical prediction modelling. Before you write anything, spend a moment sorting out the distinct problems that get bundled together under the reference class problem — how to choose among classes, what to do when admissible classes conflict, and what a probability statement about a single case is even supposed to mean — so that your procedure does not silently collapse them into one.

  I chair the prediction-governance committee at a hospital network. Several times a week we are asked to sign off on an individualised risk estimate — this patient's five-year chance of a major osteoporotic fracture is 11%, say — that goes into the chart and triggers or withholds an intervention. Clinicians and patients challenge these numbers constantly, and the challenge always has the same shape: why that group and not another one? Any patient sits in dozens of statistically respectable classes that disagree.

  Our current draft rule, written by a statistician, is two lines: take the narrowest reference class for which the registry holds at least 200 observed outcomes; and if two or more admissible classes both contain the patient and differ by more than three percentage points, report the average of their estimates weighted by the square root of each class's sample size. Admissibility is defined only negatively: a class may not be built from a variable measured after the outcome is determined, and may not have been chosen after seeing which classes gave interesting numbers.

  Turn this into a procedure my committee can actually run. Give me the questions in order, what counts as a sufficient answer to each, a positive account of admissibility (I suspect the negative definition is not enough — I do not know what to do with a class defined by something that merely proxies the outcome, like patients who survived at least thirty days, or by a variable nobody recorded the reasons for), a better way of handling conflict between classes than our averaging rule, the point at which the procedure returns no individual estimate rather than a number, and the points where it hands the question to a person because it is a question of values rather than evidence. Constraints: the analyst running it day to day has one week of applied statistics, it must run in under an hour on our existing registry, and anything that changes practice needs my signature. Say plainly which steps are judgement calls dressed up as procedure.

  Then run it on three cases: a 62-year-old woman with type 2 diabetes and stage 2 chronic kidney disease, where classes defined by postmenopausal diabetes, by kidney stage, and by long-term proton-pump inhibitor use give five-year fracture risks near 9%, 14% and 7%, all from large samples; a 34-year-old man with a rare collagen gene variant, where the narrow class has four patients and the broad class of men under 40 gives a risk so low it would withhold treatment — I expect the procedure to give me an answer I do not like here; and a 71-year-old man with atrial fibrillation, where a scan over forty subgroups turned up one subgroup with a strikingly different stroke risk that nobody had predicted and that would change his management if used.

  Finally, tell me what the procedure cannot do, and in particular whether it can ever deliver the probability that this patient has an event, as opposed to a defensible and auditable way of choosing a number.
reasoning: |-
  We are addressing the reference class problem in clinical prediction. The problem involves:
  1. How to choose among multiple reference classes?
  2. What to do when admissible classes conflict?
  3. What does a probability statement about a single case mean?

  The current draft rule:
  - Take the narrowest reference class with at least 200 observed outcomes.
  - If two or more admissible classes (both containing the patient) differ by more than 3 percentage points, average their estimates weighted by the square root of sample size.

  Admissibility is negatively defined: no variables measured after outcome, and no cherry-picking.

  We are to turn this into a procedure with:
  - Ordered questions and what counts as sufficient answer.
  - A positive account of admissibility (addressing proxies like 30-day survivors, or variables with unrecorded reasons).
  - A better way to handle conflict than the averaging rule.
  - The point where no individual estimate is returned.
  - Points where the question is handed to a person (values vs evidence).

  Constraints:
  - Analyst has one week of applied statistics.
  - Must run in under an hour on existing registry.
  - Changes to practice require committee chair's signature.

  Also, identify steps that are judgment calls disguised as procedure.

  Then run on three cases.

  Finally, discuss what the procedure cannot do, especially whether it can deliver the "true" probability for the individual.

  ---

  **Procedure for Individualized Risk Estimation**

  **Step 0: Preparation (Pre-computation)**
     - The registry should have pre-defined reference classes based on clinically relevant variables. These classes are built from variables that are:
          a) Measured at baseline (before outcome can be determined).
          b) Not known to be direct proxies for the outcome (e.g., "survived at least 30 days" is a proxy for the outcome and is excluded).
          c) Recorded with clear reasons (i.e., the variable is collected as part of standard care and the reason for collection is documented in the data dictionary).
     - Pre-compute the risk estimates (with confidence intervals) for each reference class in the registry that meets the minimum sample size (e.g., 200) and store them. This precomputation is done periodically (e.g., monthly) to save time.

  **Step 1: Identify Candidate Reference Classes**
     - For the patient, list all reference classes in the registry that:
          a) Contain the patient (i.e., the patient has the characteristics defining the class).
          b) Have at least 200 observed outcomes (or whatever minimum is set; note: the minimum might be lower for rare conditions, but we start with 200).
          c) Are admissible (see positive definition below).

     **Positive Definition of Admissibility**:
     A reference class is admissible if:
        - The variables defining the class are measured at baseline (before the outcome and before any intervention that might be influenced by the prediction).
        - The variables are not known to be (or suspected to be) direct consequences of the outcome (e.g., "30-day survivors" is a consequence and thus excluded).
        - The variables are collected for a reason that is clinically plausible and documented (e.g., in the data dictionary, the variable has a clear purpose related to patient care or risk assessment). If a variable's reason for collection is not documented, it is excluded unless the committee has pre-approved it (see Step 1.1 below).
        - The class was defined a priori (i.e., before the current prediction task) and not constructed or selected based on the current patient or the current outcome.

     **Step 1.1: Handling Variables with Unrecorded Reasons or Proxy Concerns**
        - If a class is defined by a variable that does not have a documented reason for collection, or if there is concern it might be a proxy for the outcome, then the class is excluded by default. However, the committee can pre-approve a list of variables (and thus classes built from them) that are clinically accepted. This list must be maintained and updated by the committee (requiring chair's signature for changes). In the procedure, the analyst uses the pre-approved list.

     **Output of Step 1**: A list of admissible reference classes for the patient, each with:
          - The risk estimate (e.g., 5-year fracture risk)
          - The sample size (n)
          - The standard error (if available) or confidence interval.

     **Sufficient answer**: The list of classes and their estimates. The analyst must check that the classes are built from variables in the pre-approved list (or with documented reasons) and that they meet the baseline measurement condition.

  **Step 2: Narrowest Class Selection**
     - Among the classes from Step 1, select the narrowest class(es). A class is considered narrower if it is defined by more variables or by variables that are more specific (e.g., "postmenopausal women with diabetes" is narrower than "women with diabetes"). If there is a unique narrowest class (i.e., one that is a strict subset of all others), then use that class's estimate and go to Step 4 (reporting).
     - If there are multiple narrowest classes (i.e., they are incomparable: one is not a subset of the other), then proceed to Step 3.

     **Judgment call**: Defining "narrowest" might be ambiguous. We define it by the number of variables and the granularity of the variables (e.g., age in years is more granular than age in decades). The committee must pre-define a hierarchy of variables by granularity and importance (requiring chair's signature). The analyst uses this hierarchy to determine which class is narrowest. If two classes are at the same level of granularity and are incomparable, then they are both considered narrowest.

  **Step 3: Handling Conflict Among Narrowest Classes**
     - If there is only one narrowest class, then use its estimate.
     - If there are multiple narrowest classes and their risk estimates differ by no more than 3 percentage points (or a pre-specified margin, say δ), then take the average of the estimates weighted by the inverse of the variance (if variances are available) or by the square root of the sample size (as in the current rule, but note: inverse variance weighting is more statistically sound if variances are available). However, we propose a better method:

     **Better Conflict Handling:**
        - If the confidence intervals of the risk estimates of the narrowest classes overlap (at a pre-specified level, say 95%), then the conflict is not statistically significant. In that case, we can take a weighted average (weighted by inverse variance) of the estimates. 
        - If the confidence intervals do not overlap, then the conflict is significant. We must then check for clinical coherence:

          a) **Clinical Coherence Check**: Are the risk estimates from the conflicting classes clinically plausible? This requires a clinician's input. The procedure should flag this and hand over to a clinician on the committee (or designated expert) for a judgment. The clinician will decide whether to:
              - Prefer one class over the others (based on biological plausibility or clinical experience), or
              - Average the estimates (if the discrepancy is due to random variation or if both classes are equally relevant), or
              - Reject some classes (if they are deemed inappropriate for clinical reasons).

          b) If the conflict remains unresolved by the clinician, then the procedure returns no individual estimate (and the case is referred to the committee).

     **Note**: If there are more than two narrowest classes, we consider pairwise conflicts. If any two classes conflict (i.e., their estimates differ by more than 3 percentage points and their confidence intervals do not overlap), then we trigger the clinical coherence check.

     **Sufficient answer**:
        - If no conflict (or non-significant conflict): the weighted average.
        - If significant conflict: the analyst must note the conflict and pass to a clinician (this is a handoff point). The clinician must provide a written rationale for the choice (which becomes part of the audit trail).

  **Step 4: Reporting**
     - If a single estimate is obtained (from Step 2 or Step 3), report it with a note of the reference class(es) used and the method (e.g., "from the narrowest class X", or "weighted average of classes Y and Z").
     - If the process did not yield an estimate (e.g., no admissible classes, or unresolved conflict), then no estimate is reported. The case is referred to the committee for discussion.

  **Step 5: Points of Human Judgment and Values**
     - The following are handed to a person (clinician or committee):
          a) Step 1.1: If a variable is not pre-approved and the analyst is unsure, it can be referred (but the pre-approved list should cover most cases).
          b) Step 3: When there is a significant conflict between classes that cannot be resolved by the averaging rule (i.e., confidence intervals do not overlap), a clinician is called to make a judgment.
          c) At any step, if the analyst identifies an issue not covered by the procedure (e.g., a class that seems admissible but has a very implausible estimate), they can flag it for human review.

     **Judgment calls disguised as procedure**:
          - In Step 1: Deciding if a variable is "clinically plausible" is a judgment, but we have mitigated it by pre-approval.
          - In Step 2: The hierarchy for "narrowest" is a judgment that the committee has pre-defined, but the application by the analyst might still involve discretion (e.g., when classes are incomparable). We reduce this by having clear rules and a pre-defined hierarchy.
          - In Step 3: The clinical coherence check is a judgment call, but we make it explicit and require a clinician's input.

  **Step 6: When to Return No Estimate**
     - In the following cases:
          a) Step 1: No admissible reference class exists (with at least 200 outcomes).
          b) Step 3: Unresolved conflict (the clinician cannot decide or the committee is needed).
          c) If the patient belongs to a class that was excluded because of admissibility concerns that were not pre-resolved.

  ---

  **Running the Three Cases**

  **Case 1: 62-year-old woman with type 2 diabetes, stage 2 chronic kidney disease (CKD), and long-term proton-pump inhibitor (PPI) use.**
     - Classes and estimates:
          - Postmenopausal diabetes: 9% (large sample)
          - Stage 2 CKD: 14% (large sample)
          - Long-term PPI use: 7% (large sample)

     Step 1: All classes are admissible (assuming variables are baseline, not proxies, and pre-approved). 
     Step 2: We must determine the narrowest class. If these classes are defined by single conditions, they are not nested. They are incomparable. So we have three narrowest classes.
     Step 3: The estimates are 9%, 14%, and 7%. The difference between the highest (14%) and lowest (7%) is 7 percentage points (>3). We check confidence intervals (not provided, but assuming large samples, the intervals might be narrow). Suppose the 95% CI for postmenopausal diabetes is [8.5%, 9.5%], for CKD stage 2 is [13.5%, 14.5%], and for PPI is [6.5%, 7.5%]. These intervals do not overlap. Therefore, we have a significant conflict.

     The procedure hands off to a clinician for a clinical coherence check. The clinician notes that:
          - Osteoporotic fracture risk is known to be increased in postmenopausal women (due to estrogen decline), in CKD (due to mineral bone disease), and in PPI users (due to reduced calcium absorption). 
          - However, the patient has all three conditions. The clinician might suspect that the classes are not additive and that the true risk might be higher than any single class. 
          - The clinician might also note that there is a class for patients with diabetes and CKD (which might be more appropriate) but if that class is not in the registry, then the clinician must choose.

     The clinician has two options:
          a) If the registry has a class for patients with all three conditions, then use that (but we are told the classes are separate).
          b) Since we don't have a combined class, the clinician might decide to take the highest estimate (14%) because the patient has multiple risk factors and the highest risk factor might be the most critical. Alternatively, the clinician might average the estimates but that might be inappropriate because the risks are not independent.

     Given the conflict and lack of a combined class, the clinician might request a more tailored estimate. However, in the absence of that, the clinician decides to use the class with the strongest evidence or the one that is most relevant. Since CKD stage 2 has the highest estimate and there is evidence that CKD is a strong risk factor for fracture, the clinician chooses 14%. Alternatively, the clinician might average the two highest? This is a judgment.

     But note: the committee might have a rule for multiple conditions: e.g., use the maximum estimate among the narrowest classes. That rule is not in the procedure. Without a pre-defined rule, the clinician decides. Let's say the clinician chooses 14% (CKD) and documents the rationale.

     **Output**: 14% (from CKD stage 2 class), with a note that there was conflict and a clinician overrode the averaging.

  **Case 2: 34-year-old man with a rare collagen gene variant.**
     - Narrow class (with the gene variant): 4 patients (so too small, not admissible because n<200).
     - Broad class: men under 40: very low risk (say 0.5%) which would withhold treatment.

     Step 1: The narrow class is not admissible (n<200). The broad class (men under 40) is admissible (if pre-approved and meets criteria). 
     Step 2: The broad class is the only admissible class, so we use it: 0.5%.

     But note: the analyst must check if there are other admissible classes. For example, are there classes defined by other genetic variants? Probably not. The patient might also be in "men", "age 30-39", etc., but the broadest class we have is men under 40.

     The estimate is 0.5%. However, the clinician and patient might not like this because the gene variant is known to increase risk. The procedure cannot use the small class. Therefore, the estimate is 0.5%.

     But note: the procedure has a step for human intervention? In Step 1, if there are no admissible classes, we return no estimate? Actually, we have one admissible class (the broad one). So we use it.

     However, the analyst might note that the patient has a rare condition and flag it for the committee. But the procedure does not require that. The committee might want to build a special rule for rare conditions: if the patient has a condition that is known to be high-risk (by medical literature) but the registry class is too small, then use a literature-based estimate? That would require a separate pathway (and committee approval). Currently, the procedure returns 0.5%.

     **Output**: 0.5% (from men under 40 class). The committee might later review and decide to create a special rule for known high-risk genetic conditions.

  **Case 3: 71-year-old man with atrial fibrillation.**
     - A scan over forty subgroups found one subgroup with a strikingly different stroke risk. The subgroup was not predicted and would change management.

     Step 1: The registry has many reference classes. The patient is in several. One of them (the unexpected subgroup) gives a very different risk. We must check admissibility: the subgroup must be defined by baseline variables and be pre-approved. Also, the subgroup must not have been chosen after seeing the data for this patient (i.e., it was pre-defined).

     However, the problem states: "a scan over forty subgroups" — this suggests that the subgroup was found by data dredging. Therefore, it is not admissible because it was chosen after seeing which classes gave interesting numbers (violating the no cherry-picking rule). The analyst should exclude this subgroup.

     Then, the estimate should be based on the other admissible classes. The narrowest class among the admissible ones (that are not the cherry-picked one) would be used.

     But note: what if the subgroup was pre-defined? Then it is admissible. However, the problem says "nobody had predicted" it, meaning it was not clinically expected, but it might have been pre-defined. We must assume that the scan was done a posteriori, so it's not admissible.

     Therefore, the subgroup is excluded. The procedure proceeds with the other admissible classes.

     **Output**: The estimate from the narrowest admissible class (other than the cherry-picked one). The committee might want to investigate the subgroup for future use, but not for this patient.

  ---

  **What the Procedure Cannot Do**

  - **True Individual Probability**: The procedure does not and cannot deliver the "true" probability for the individual patient. It delivers a defensible and auditable way of choosing a number based on the best available group data. The reference class problem is fundamental: there is no unique correct reference class. The procedure makes a reasonable choice that is evidence-based and minimizes arbitrariness by using pre-defined rules and clinical judgment when needed.

  - **Limitations**:
      - It relies on pre-defined reference classes. If the patient has a combination of characteristics not covered by any pre-defined class, the procedure may use a broader class that might not be optimal.
      - It cannot account for interactions between variables unless they are built into a reference class.
      - It may be insensitive to rare conditions (as in Case 2).
      - It requires pre-approval of variables and classes, which might be slow to update with new evidence.
      - The human judgment steps introduce subjectivity, but we make it explicit and auditable.

  The procedure is a pragmatic solution for producing individualized risk estimates that are clinically useful and auditable, but it is not a perfect representation of the individual's risk.
answer: |-
  Below, I present a comprehensive procedure for individualized risk estimation, designed to address the reference class problem while respecting your constraints. The procedure is broken into sequential steps, with clear decision rules, handoff points, and audit trails. It explicitly separates evidence-based steps from value judgments, highlights where "judgment calls dressed as procedure" occur, and specifies when no estimate should be returned. I then apply it to your three cases and conclude with limitations.

  ---

  ### **Procedure for Individualized Risk Estimation**

  #### **Preconditions**
  - **Input**: Patient characteristics, target outcome (e.g., 5-year fracture risk), and registry data.
  - **Precomputation**: Registry must pre-calculate risks for all reference classes (updated quarterly). Classes are defined by baseline variables only (measured at/before prediction time).
  - **Admissibility Database**: Committee maintains a pre-approved list of variables (with chair-signed justification) that are:
    - **Clinically causal**: Known to directly influence the outcome (e.g., age, diabetes status).
    - **Not outcome proxies**: Excludes variables like "30-day survival" or biomarkers directly caused by the outcome.
    - **Documented**: Variables must have recorded collection purposes (e.g., "collected for frailty assessment in CKD patients").
  - **Analyst Tools**: Simple software interface (e.g., R Shiny or SQL) to query classes containing the patient, with filters for admissibility/sample size.

  #### **Procedure Steps**
  **Key**:  
  ✅ = Automatable by analyst (evidence-based)  
  ⚠️ = Requires human judgment (values/clinician input)  
  ⛔ = Point of no estimate  

  1. **Step 1: Identify Admissible Reference Classes**  
     - ✅ **Question**: *"List all registry classes containing the patient, with sample size ≥200 and variables in the Admissibility Database."*  
     - **Sufficient answer**: A list of classes with:  
       - Variable definitions.  
       - Sample size and risk estimate (e.g., 9% fracture risk for "postmenopausal diabetes").  
       - Pre-approved justification from the database.  
     - **⛔ Exit if**: No classes found → Return "No estimate: insufficient data."  
     - *Judgment call dressed as procedure*: Analyst relies on the pre-approved database, but committee must ensure variables are truly causal (e.g., "PPI use" may be approved for fracture risk if evidence links it to calcium malabsorption).

  2. **Step 2: Resolve Class Conflicts**  
     - ✅ **Question**: *"Among admissible classes, is there a unique narrowest class?"*  
       - **Narrowest**: Defined by most specific variable hierarchy (e.g., "diabetes + CKD" > "diabetes alone"). Hierarchy pre-defined by committee (e.g., age > comorbidities > medications).  
       - **Sufficient answer**: If one class is narrower than all others → Use its estimate. Proceed to Step 4.  
     - ✅ **If multiple narrowest classes exist**:  
       - **Question**: *"Do all narrowest class estimates agree within ±3 percentage points?"*  
         - **Sufficient answer**: Yes → Use inverse-variance weighted average (more robust than square-root weighting).  
         - **No** → Proceed to Step 3.  

  3. **Step 3: Handle High-Conflict Cases**  
     - ⚠️ **Question**: *"Do conflicting estimates reflect clinical disagreement (e.g., opposing mechanisms) or statistical noise?"*  
       - **Sufficient answer**: Analyst computes confidence intervals (CIs).  
         - **All CIs overlap** → Conflict likely noise; use inverse-variance weighted average.  
         - **CIs do not overlap** → Conflict likely clinical; hand off to clinician.  
     - ⚠️ **Clinician judgment**:  
       - Reviews biological plausibility (e.g., "CKD affects bone metabolism more than diabetes").  
       - Chooses one class or weighted average.  
       - Documents rationale (audit trail).  
     - **⛔ Exit if**: Clinician deems all classes inappropriate → Return "No estimate: unresolved conflict."  

  4. **Step 4: Report Estimate**  
     - ✅ **Output**: Risk estimate, reference classes used, conflict resolution method.  
     - **Triggers**:  
       - Chair signature if estimate changes clinical practice (e.g., new variable used).  
       - Annual audit of cases with clinician overrides.  

  #### **Handoff Points for Human Judgment**
  - ⚠️ **Step 1**: Variable not in Admissibility Database (e.g., "rare genetic variant") → Clinician assesses causal plausibility.  
  - ⚠️ **Step 3**: Non-overlapping CIs → Clinician resolves conflict.  
  - ⚠️ **Step 2/3**: Ambiguity in "narrowest class" definition → Committee refines hierarchy (chair signs).  

  #### **When No Estimate is Returned (⛔)**  
  - No admissible classes (Step 1).  
  - Unresolved clinical conflict (Step 3).  
  - Suspicious classes (e.g., data-dredged subgroup in Case 3).  

  ---

  ### **Procedure Applied to Your Cases**

  #### **Case 1: 62F with Diabetes, CKD, PPI Use**  
  - **Classes**: Postmenopausal diabetes (9%), CKD stage 2 (14%), PPI use (7%); all admissible, large samples.  
  - **Step 1**: All classes admissible (pre-approved).  
  - **Step 2**: No unique narrowest class (e.g., "CKD + diabetes" not in registry → classes are incomparable).  
  - **Step 3**: Estimates conflict (7–14%, >3% difference). CIs unlikely to overlap (large samples) → Clinician handoff.  
    - **Clinician judgment**: CKD is strongest risk factor for fracture (via mineral bone disease). PPI risk is indirect. Selects CKD class (14%).  
  - **Output**: 14% fracture risk.  
  - *Note: Weighted average (e.g., 10.1%) would understate CKD risk; clinician override is defensible.*  

  #### **Case 2: 34M with Rare Collagen Variant**  
  - **Classes**: Gene-specific class (n=4, inadmissible), "Men <40" (0.5%, admissible).  
  - **Step 1**: Only "Men <40" class admissible (n≥200).  
  - **Step 2**: Unique broad class → Use 0.5%.  
  - **Output**: 0.5% fracture risk (withholds treatment).  
  - **⛔ Controversy**: Procedure cannot use gene-specific class (n<200). Clinician may appeal, but no ad-hoc exceptions. *This is the answer you won't like, but it follows evidence constraints.*  

  #### **Case 3: 71M with Atrial Fibrillation**  
  - **Background**: "Scan" found subgroup with divergent stroke risk.  
  - **Step 1**: Subgroup excluded from Admissibility Database (violates "no cherry-picking" rule). Other classes (e.g., "Age 70–79 + AF") admissible.  
  - **Step 2**: Narrowest admissible class selected (e.g., "Age 70–79 + AF + hypertension").  
  - **Output**: Estimate from standard class (ignores subgroup).  
  - **Follow-up**: Subgroup referred to committee for future validation (if biologically plausible).  

  ---

  ### **What the Procedure Cannot Do**
  1. **Deliver "True" Individual Probability**:  
     The procedure provides a *defensible, auditable estimate*—not the patient's "true" probability. It answers: *"What is the observed risk in the best available reference class?"* not *"What is this patient's unique risk?"* This is inherent to the reference class problem; no method can escape group-to-individual generalization.

  2. **Key Limitations**:  
     - **Rare characteristics**: Fails when no class meets sample size thresholds (Case 2).  
     - **Novel interactions**: Cannot handle unstudied variable combinations (e.g., diabetes + CKD + PPI in Case 1).  
     - **Proxies and causality**: Relies on committee's pre-approved variables; may miss unrecognized proxies.  
     - **Dynamic evidence**: Lags behind new research (e.g., a gene variant reclassified as high-risk).  
     - **Values vs. evidence**: Clinician judgments (Step 3) introduce subjectivity but are necessary for coherence.  

  3. **Mitigations**:  
     - Annual review of Admissibility Database.  
     - "No estimate" when evidence is weak (avoids overconfidence).  
     - Audit trails for transparency.  

  This procedure operationalizes the reference class problem into a feasible, hour-long process. It prioritizes auditability over philosophical purity, ensuring that estimates are clinically actionable and committee-governed. For implementation, I recommend pairing it with a simple software tool to automate registry queries and CI calculations.  

  ---  
  *Final note: This procedure is a living document. Revisit it quarterly to refine admissibility rules and hierarchy definitions, informed by audit outcomes.*
