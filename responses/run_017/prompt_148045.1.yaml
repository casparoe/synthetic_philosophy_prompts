answer: |-
  Here's the restatement of transcendental arguments in litigation vocabulary, followed by the residue report and your core questions:

  ### Restatement in Litigation Terms
  1.  **Initial Presumption:** The skeptic (appellant) challenges the existence/validity of `p` (e.g., objective truth, logic, causality, morality).
  2.  **Skeptic's Burden:** The skeptic bears the burden of persuasion to demonstrate that `p` is false or unjustified.
  3.  **Transcendental Move:** The proponent of `p` argues that the skeptic, **merely by formulating and presenting their challenge**, has already:
      *   **Invoked a Presumption:** Presumed the validity of the very framework `p` provides (e.g., logic, truth, meaning).
      *   **Implicitly Conceded:** Conceded `p` as a necessary precondition for *any* coherent challenge to be mounted or understood. Filing the challenge is conduct inconsistent with denying `p`.
      *   **Shifted the Burden:** Demonstrated that the skeptic's position relies on `p`. This **shifts the burden of production** back to the skeptic to explain how their challenge is coherent *without* presupposing `p`.
  4.  **Estoppel:** The skeptic is **estopped from denying `p`** because their conduct (mounting a rational challenge) fundamentally depends on `p`. Allowing them to deny `p` while relying on it would be logically inconsistent and procedurally improper ("sawing off the branch").
  5.  **Failure to Meet Burden:** If the skeptic cannot meet their shifted burden of production (i.e., explain a coherent alternative framework without `p`), their challenge fails as a matter of law/logic. `p` stands as **conclusively presumed** or **deemed admitted** for the purposes of the discourse.
  6.  **Standard of Review:** This is akin to arguing the challenge is **facially invalid** because it presupposes the very thing it seeks to deny, rendering it incoherent under any standard of review.

  ### Residue Report
  1.  **What Carries Cleanly:**
      *   **Burden of Persuasion:** The skeptic bears this initially.
      *   **Burden Shifting:** The transcendental move directly shifts the burden of production.
      *   **Estoppel:** This is the *strongest* parallel. The argument *is* fundamentally that the skeptic is estopped by their conduct (reasoning/challenging) from denying `p`.
      *   **Presumptions:** Framing `p` as a necessary presumption underlying rational discourse fits well.
      *   **Conduct as Concession:** The idea that formulating the challenge *is* conduct conceding the preconditions for that challenge is a perfect fit.
      *   **Facial Invalidity:** The claim that the challenge is incoherent on its own terms maps well.

  2.  **What Requires Fudging/Slight Adjustment:**
      *   **Nature of `p`:** Legal presumptions/concessions are often specific, contingent, or procedural (e.g., regularity of official acts, waiver). `p` in transcendental arguments is usually a fundamental, universal condition for thought/experience (logic, causality, truth, morality). Translating "universal precondition" into "presumption" works, but legal presumptions feel less absolute. "Concession-by-conduct" captures it better.
      *   **Ultimate Truth vs. Procedural Resolution:** Law often settles *who wins the case* based on burdens and presumptions without definitively declaring absolute metaphysical truth. Philosophy (especially proponents) often sees the transcendental argument as *proving* `p` is true. The litigation framing emphasizes the *procedural victory* (skeptic loses their challenge) rather than the absolute metaphysical victory (`p` is True with a capital T). This aligns with your hunch.

  3.  **What Has No Direct Counterpart:**
      *   **The "Necessity" Aspect:** The core philosophical claim is that `p` is *necessarily* presupposed in *any possible* rational discourse or experience. Law deals with practical necessity within a system, not metaphysical or transcendental necessity. While "indispensable presumption" gets close, the depth of "necessary precondition for all possible thought" isn't a standard legal category.
      *   **The Constructive Aspect:** Some transcendental arguments aim not just to refute the skeptic but to *positively* establish `p` as the only possible foundation. Litigation vocabulary is better at refutation/imposing burdens than positive construction from necessity.

  ### Addressing Your Hunch & Questions
  1.  **"Feels like Estoppel / Settles Burdens, Not Truth":** Your hunch is **exactly right and insightful.** The litigation translation *does* make the transcendental argument look primarily like an estoppel coupled with burden-shifting. It settles the dispute in favor of `p` by showing the skeptic's challenge is self-defeating *within the rules of the game* (rational discourse/litigation). This *does* mirror the "old complaint" that these arguments show we *must presuppose* `p`, not necessarily that `p` is absolutely true in some detached, metaphysical sense. Kant himself often framed it as showing the *necessity of belief* for coherent experience, not necessarily accessing "things-in-themselves."
      *   **Is Your Vocabulary Too Thin?** Not "too thin," but **differently focused.** Your vocabulary brilliantly captures the *procedural, dialectical, and performative* mechanics of the argument – how it functions *in a dispute*. It's exceptionally good at exposing the skeptic's self-undermining position within the practice of reasoning. Where it might feel "thin" is in expressing the *metaphysical weight* or *positive necessity* that philosophers often claim for `p` ("This *proves* causality is real!"). Your framing emphasizes the *pragmatic resolution* over the *absolute proof*. This isn't a weakness; it's a different lens that catches something crucial and perhaps more honest about the argument's force.
      *   **Did It Catch Something Real? Absolutely.** It highlights that the transcendental argument's primary power is **dialectical:** it exposes an inconsistency *in the skeptic's own position and actions*. Its force lies in showing the skeptic cannot *consistently participate* in the practice of rational challenge while denying `p`. It's about the rules of engagement, not a knockdown proof delivered from nowhere.

  2.  **Law's Move: Non-Justiciability - Cop-out or Honest?**
      *   **The Move:** Declaring the skeptic's challenge "non-justiciable" means the court/rules of discourse deem it an inappropriate or unanswerable question for the forum. "We don't decide such foundational meta-questions here; we presume `p` and operate within the system it enables."
      *   **Cop-out or Honest?** This is **the honest procedural counterpart** to the transcendental argument's dialectical move.
      *   **Cop-out?** Only if one insists that *every* metaphysical challenge *must* be answered substantively on its own terms. But the transcendental argument (and your litigation framing) shows *why* that might be impossible or incoherent. The skeptic is demanding an answer *using the tools* (`p`) *they are challenging*.
      *   **Honest Version:** Declaring it non-justiciable is admitting: "This challenge attempts to step outside the very framework (`p`) that makes adjudication/argument possible. We cannot step outside that framework to adjudicate the framework itself in the way you demand. To function, we must operate *within* the system `p` provides." This parallels the transcendental argument's core point: the challenge presupposes what it denies, making it incoherent *as a challenge within the system*. Law's move pragmatically acknowledges this boundary. Philosophy often tries to *argue* the boundary exists; law can sometimes just *invoke* it procedurally.

  **Conclusion:** Your litigation vocabulary provides a powerful and accurate translation of the *structure* and *dialectical force* of transcendental arguments, framing them as estoppel + burden-shifting. It successfully captures that these arguments primarily resolve disputes by showing the skeptic's position is self-defeating *within the practice of reasoning/litigation*, establishing that we *must proceed as if `p` is true*, rather than delivering an unassailable metaphysical proof from a God's-eye view. Declaring such foundational challenges "non-justiciable" is law's pragmatic, honest way of acknowledging the same boundary the transcendental argument seeks to expose through dialectic. Your vocabulary isn't thin; it's sharp and reveals a core aspect of how these arguments actually work in practice.
