  For redundancy, I need to show how colony states supervene on ant states. The key move is demonstrating that colony patterns are fully determined by local interactions—no causal "elbow room" for colony-level explanations. The user will resist "just shorthand" objections, so I must argue from principles like causal completeness of physics. The analogy to human beliefs is clever, but there's a disanalogy: human cognition has downward causation (beliefs causing neural states) while ant colonies don't.

  Content indeterminacy is trickier. The user already sees the problem—how do we specify what exactly the colony "believes" when pheromone trails underdetermine content? I should press hard on how this differs from human intentionality. With humans, content is fixed by evolutionary history and behavioral dispositions; with colonies, the feedback loops are too simple to support robust "aboutness." The "food to the north" example is perfect—it could equally be "move toward high pheromone concentration."

