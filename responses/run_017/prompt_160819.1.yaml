  Public reason stumbles here. Its tools can't handle retrospective collective guilt or divine causation claims. The speech isn't justifying specific coercion but shaping communal identity for future politics. Among the user's four diagnoses, I lean toward the last: public reason asks the wrong question. The core issue isn't whether religious reasons are offered, but what affective transformation they enable in listeners—making them a "people under judgment" capable of radical forgiveness.

  This exposes gaps in public reason: no vocabulary for inherited wrongs, reconciliation as political work, or arguments conceding human non-control. For routine cases like abortion debates citing scripture, Lincoln's example suggests urgency-role invocations might pass actionability if policy reasons stand alone, but non-preemption violations risk shutting down deliberation when theology overrides cost-benefit analysis.

