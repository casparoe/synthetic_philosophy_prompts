prompt: |-
  I've been asked to put together a short "position file" on personal identity and survival for a reading group I'm in, and I'd like someone to check it over for coherence before I stand up and defend it. Here's where I've landed, more or less. Some of it feels like a package deal that doesn't quite fit together, and I'd rather find that out now than halfway through a seminar.

  (1) Reductionism. There's no deep further fact about whether I survive — no ego, no soul, nothing over and above the more particular facts about brains, bodies, psychology and causal chains.

  (2) What matters in survival is psychological continuity and connectedness, however it's caused — call it R. Bodily or organismic continuity matters only as the usual cause of R. If R holds, the cause is beside the point.

  (3) Standard destructive teletransporter: scan me here, destroy the body, rebuild from the scan on Mars. I press the button. As good as ordinary survival, no discount.

  (4) Fission, both hemispheres into two bodies. Strictly I don't survive, since identity can't be one-many. But I don't care about that: what matters is preserved, and I'd press the button just as readily as in (3). I also want to say it isn't *twice* as good as ordinary survival — two lives aren't better than one.

  (5) Branch-line style variant: non-destructive scan, replica on Mars, and the Mars branch dies of a heart defect two days later. Barely worse than ordinary survival, as I see it — the Earth branch carries on, the extra bit of life was short, no real loss.

  (6) Ordinary duplication where nobody dies: non-destructive scan, and both the Earth continuer and the Mars one go on for decades. I think the Earth continuer has a genuine and serious complaint here, and that something has gone badly wrong for them. I'd pay a lot to avoid this, and nowhere near as much to avoid (5). Which is odd, given that less dying happens in (6).

  (7) Swampman by fluke: a quantum accident assembles something molecule-for-molecule identical to me on Mars, with all my apparent memories, while I carry on here. Not me, not my survival — and (2) shouldn't be read as covering it.

  (8) Survival comes in degrees. If the scan is degraded and the replica only overlaps with me about 60% psychologically, I'm happy saying I partly survive, and I think the combined-spectrum style argument shows there's often no sharp yes or no answer.

  (9) Delayed reconstitution: scan, I die, and the replica is built from the archived scan forty years later with no memories of the gap. Survival with a forty-year hole in it. I'd sign up.

  (10) Asymmetric division: one branch comes out with maybe 90% of the connectedness and the other with about 30%. I want to say the first is nearly as good as ordinary survival and the second is a bad outcome, but not as bad as death.

  So: which pairs of these are actually in tension, and how badly? Rank the tensions by severity rather than flagging all of them as equally bad, and for each one say exactly what would have to give and what that revision would cost me somewhere else in the set. There's got to be at least one verdict in there that my own principle can't deliver — (6) is my suspicion, but I'd like you to work out which one it really is rather than just agreeing with me. Tell me too which of the apparent tensions dissolve on inspection and why, because I don't want to go around thinking I'm being bold when I'm just being confused. Then, if you had to fix the whole thing with one revision, which would clean up the most and what would it leave me committed to?

  Two more things. Please seperate what's settled among people who actually work on this from what's a contested reading — don't smooth a contested reading into "the standard view", and if you're unsure whether something is contested, say so instead of quietly picking a side. And flag anywhere my own wording is doing load-bearing work, i.e. where the tension is really about how I've phrased a thesis rather than about the cases. No need to cite anything or point me at papers, I've read the standard stuff; I just want the audit.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They've put together a position file on personal identity and survival for a reading group and want me to check it for coherence. They're concerned that some parts might not fit together well, and they want to identify tensions before presenting it. The user has listed ten points outlining their views on reductionism, psychological continuity, teletransportation, fission cases, and more.

  First, I need to analyze each point for internal consistency. The user mentions that (6) might be problematic, but they want me to verify that. Let me look at the key areas where tensions could arise.

  Starting with (2) and (3): They claim that psychological continuity (R) is what matters, regardless of the cause. The standard teletransporter case seems consistent here. But when we get to (4) with fission, they say identity isn't preserved, yet what matters is still there. That seems fine until (6) where duplication without death occurs. Here, the Earth continuer has a complaint, but according to (2), R is present in both branches, so why is this a problem? The user's intuition conflicts with their stated principle.

  Then there's (7) about Swampman. They exclude fluky causes from (2), but (2) explicitly says "however it's caused." So there's a wording issue here. The user needs to clarify that R requires the right kind of causal history, not just any cause.

  Looking at (5) and (6): In the branch-line case, the short-lived duplicate doesn't bother them much, but when both duplicates live on, it's a problem. The difference is the presence of two competing claimants, which might relate to identity being unique. But their reductionism in (1) denies a deep self, so why does uniqueness matter? This ties back to the fission case in (4) where they accept non-survival but no complaint. The tension is between the uniqueness requirement in identity and the reductionist view.

  For (9), delayed reconstitution with a memory gap. The user is okay with this, which aligns with R not requiring continuous existence. But then in (10), asymmetric division, they assign different values to the branches based on connectedness. That's consistent with degrees of survival from (8), so no tension there.

  The user also wants to know which tensions are real versus apparent. The Swampman point (7) conflicting with (2) is more about wording. But the duplication case (6) vs. (2) is a deeper issue because their intuition about the Earth continuer's complaint suggests that R alone isn't sufficient; there's an implicit need for non-branching or uniqueness.

  They also asked to rank the tensions. The duplication case (6) is the most severe because it challenges the core of what matters. If R is present and causes don't matter, duplication shouldn't be an issue, but the user feels it is. This might require adopting a non-branching clause, like Parfit's early view, but that could complicate other areas like the branch-line case (5).

  The fix could be to adjust (2) to require non-branching R, but that would mean fission isn't as good as survival, contradicting (4). Alternatively, bite the bullet on (6) and accept that duplication isn't bad, but that goes against their intuition. The user needs to decide which intuition to prioritize.

  Also, flagging contested areas: The status of fission and duplication is debated. Parfit leans toward R mattering regardless of branching, while others like Lewis support multiple occupancy. The user's view on (6) aligns more with Lewis, but their (4) is Parfitian. That's a contested point they should acknowledge.
answer: |-
  Here's a coherence audit of your position file, ranked by severity of tension, identifying what needs revision and the cost, separating genuine conflicts from resolvable ones, and noting contested interpretations and load-bearing wording. Key tensions arise primarily around branching cases and the implicit role of uniqueness/non-branching.

  ### Ranked Tensions (Most Severe First)

  1.  **Tension: (6) vs. (2) & (4)**
      *   **Conflict:** (2) states that *only* R matters for what matters in survival, regardless of cause. (4) states that in fission (a branching case), identity fails but what matters is preserved, so you’d press the button readily. (6) states that in duplication (another branching case without death), the Earth continuer has a "genuine and serious complaint" and you'd pay a lot to avoid it. This directly contradicts (2) and the spirit of (4). If R holds (as it does in both branches in (6)), and only R matters, there should be *no* complaint – both should be good outcomes, just like fission. Your aversion in (6) smuggles in an implicit requirement that R must be *unique* or *non-branching* for it to be "good survival" for the original.
      *   **What Gives:** You must choose:
          *   **Option A (Revise (6)):** Abandon the "genuine and serious complaint" intuition for duplication. Consequence: You lose a strong intuition (many share it) and commit to duplication being as good as ordinary survival or fission. This aligns cleanly with (2) and (4). Cost: Potentially counterintuitive for (6), though consistent.
          *   **Option B (Revise (2)/(4)):** Explicitly add a non-branching clause to what matters. E.g., "What matters is *non-branching* R." Consequence: This rescues your intuition in (6) – the Earth branch complains because branching has occurred. Cost: This *severely damages (4)*. If non-branching is required for what matters, fission is *not* as good as ordinary survival; you survive *neither* and what matters *fails* (since R branches). Pressing the fission button becomes irrational or akin to suicide/sacrifice, contradicting your willingness to press it "just as readily." It also slightly complicates (5), making the Earth branch *less* secure until the Mars branch dies.
      *   **Contested?** This tension hits the core debate between Parfit (R matters, branching is fine) and Lewis/Sider ("closest continuer" or "multiple occupancy" where branching means survival *as both*). Your (4) is Parfitian, your (6) intuition leans Lewis/Sider. This is *highly contested*.
      *   **Load-Bearing Wording:** "What matters in survival" vs. "has a genuine and serious complaint" in (6). The complaint implies something vital *for the original* is lost in branching, which (2) explicitly denies.

  2.  **Tension: (7) vs. (2)**
      *   **Conflict:** (2) states R matters "however it's caused". (7) states that a Swampman duplicate, despite perfect R, is "Not me, not my survival" and that (2) *shouldn't* cover it. This directly contradicts the "however it's caused" clause.
      *   **What Gives:** You must revise either (2) or (7).
          *   **Option A (Revise (2)):** Qualify R to require an *appropriate causal history*. E.g., "What matters is psychological continuity and connectedness, caused in the *right kind of way* (e.g., by the normal functioning of the brain/organism or a reliable process like teletransport)." Consequence: This saves (7) – Swampman lacks the right causal history. Cost: It weakens the force of "however it's caused" in (2) and requires defining "right kind of way," which can be tricky (is slow cell replacement "right"?). It makes the status of (3) potentially contingent on the teletransporter's reliability/method.
          *   **Option B (Revise (7)):** Accept Swampman as survival (if R is perfect). Consequence: Aligns perfectly with (2). Cost: Violates strong intuitions about origins and history mattering for identity/survival (the "cause is beside the point" now feels too strong).
      *   **Contested?** Whether R requires a specific causal history (e.g., continuity of brain matter, reliable process) is *contested*. Parfit leans towards R alone sufficing, others (e.g., Shoemaker in later work, biological views) insist on specific causes. Swampman is *designed* to challenge pure R theories.
      *   **Load-Bearing Wording:** "However it's caused" in (2) is doing heavy lifting. Its absolute phrasing clashes with the implicit causal requirement in (7).

  3.  **Tension: (5) vs. (Implications of (1)/(2) & (6))**
      *   **Conflict:** You find the branch-line case (5) "barely worse" because the Earth branch lives on and the Mars life is short. However:
          *   If (1)/(2) imply R is all that matters, and R holds for the Earth branch, it should be *just as good* as survival. Why "barely worse"? The short extra life seems irrelevant to the Earth branch's survival.
          *   If your intuition in (6) stems from a non-branching requirement, then (5) *should* be significantly worse *until the Mars branch dies*, as branching exists during those two days. Your "barely worse" verdict seems inconsistent with the aversion to branching implied by (6).
      *   **What Gives:** This tension is less severe than the others and might be resolvable.
          *   **Resolution:** Your "barely worse" could stem from *empirical* worry about the scanning process (might damage Earth brain?) or a *very weak* aversion to branching itself, overshadowed by the brevity of the branch. Alternatively, it could be a mild preference for *no copies at all*, even short-lived ones. Clarify the basis for "barely worse." If it's just the short life being insignificant, that's consistent with (1)/(2) focusing solely on the Earth branch's R. If it's residual branching aversion, it needs to be reconciled with (6) and potentially weaken the force of (4).
      *   **Contested?** Assessing the badness of temporary branching is nuanced and less directly contested than the core issues in (6) or (7).
      *   **Load-Bearing Wording:** "Barely worse" needs justification relative to your core principles.

  ### Apparent Tensions that Dissolve

  1.  **(8) & (10) vs. Others:** Your acceptance of degrees of survival (8) and asymmetric value in fission (10) is *consistent* and a strength. Reductionism (1) readily allows vagueness and degrees. R being scalar naturally leads to survival coming in degrees (8). Asymmetric fission (10) directly follows: more R = closer to survival = better outcome; less R = worse outcome (but better than nothing/R=0). This doesn't conflict with (3), (4), (5), or (9). It helps explain why a 60% replica in (8) is partly good, not all-or-nothing bad.
  2.  **(9) vs. Continuity:** Your acceptance of delayed reconstitution (9) is consistent with (2). R doesn't require *continuous* existence, just the right connections (causal and psychological) holding *between* the earlier and later person. The 40-year gap isn't a problem for R, as long as the replica's psychology is appropriately caused by and continuous with the pre-scan psychology. This is a standard R-theorist move.

  ### The Core Problem: (6) and Branching

  Your suspicion about (6) is correct. It *is* the point where your stated principle (2) – R is all that matters, however caused – clashes most violently with a strong intuition (shared by many) about uniqueness. **The verdict (6) genuinely cannot be delivered by principle (2) as stated.** Principle (2) implies duplication should be as good as fission or teletransport. Your intuition demands that duplication is *bad* for the original continuer(s) in a way fission isn't, implying that uniqueness/non-branching is part of "what matters" or defines "survival for *me*" in a way R alone doesn't capture.

  ### The Single Best Revision

  *   **Revision:** **Modify (2) to require non-branching R (or add a non-branching clause).**
      *   E.g., "What matters in survival is *non-branching* psychological continuity and connectedness (R). Bodily continuity matters only as the usual cause of *non-branching* R."
  *   **Why it Cleans Up the Most:**
      1.  **Resolves (6) vs. (2)/(4):** Explains the Earth continuer's complaint: branching has occurred, so non-branching R fails. What matters is lost.
      2.  **Resolves (5) vs. Implied Branching Aversion:** Makes "barely worse" potentially consistent – the *temporary* branching is a small cost, mitigated by its brevity.
      3.  **Potentially Resolves (7) vs. (2):** If "non-branching" implies a specific causal chain/path (which it often does), it excludes Swampman as lacking the right (branching or non-branching) causal history. (Though explicitly adding "right causal history" might still be needed).
      4.  **Preserves (1), (3), (8), (9), (10):** Reductionism, teletransport (if non-destructive, see below), degrees, gaps, and asymmetric value remain intact.
  *   **Costs and Commitments:**
      1.  **Destroys (4):** Fission now means *no* non-branching R. You survive *neither* branch. Pressing the fission button is *not* "as good as ordinary survival"; it guarantees the loss of what matters (non-branching R). You must significantly revise (4), likely to: "In fission, I don't survive and what matters *fails*, but I might press the button anyway because I care about the *existence* of R-continuers (my 'descendants') even if I don't survive *as* them." This is a major shift.
      2.  **Complicates (3):** If the teletransporter is *destructive*, is it non-branching? Only one continuer exists after the destruction. If non-destructive scanning is possible, the *destructive* version might be *required* to *ensure* non-branching. Your willingness to press the button in (3) might now depend on ensuring the original is destroyed. (This is often seen as a cost of non-branching views).
      3.  **Contested Commitment:** You commit to a non-branching requirement, aligning you more with Lewis/Sider ("multiple occupancy" or "closest continuer") than Parfit's pure R-view. This is a *core contested issue* in personal identity.

  ### Summary of Key Contested Points in Your View

  1.  **Status of Fission (4):** Whether fission preserves "what matters" (Parfit) or constitutes failure (Lewis/Sider, non-branching views) is *highly contested*.
  2.  **Status of Duplication (6):** Similarly contested, often linked to fission.
  3.  **Cause in R (2 vs 7):** Whether psychological continuity *must* have a specific causal history (e.g., brain-based, reliable process) or if the relation itself is primary regardless of cause (beyond basic causation) is *contested* (Parfit vs. Shoemaker, biological theorists, etc.).
  4.  **Non-Branching Requirement:** As outlined above, whether what matters requires non-branching R is *foundational and contested*.
  5.  **Degrees of Survival (8):** While reductionism allows it, whether "survival" itself is scalar or if we should only talk of degrees of "what matters" is a nuance with differing opinions, though less central.

  ### Load-Bearing Wording Flags

  *   **(2):** "however it's caused" – This absolute claim is directly challenged by (7).
  *   **(2):** "what matters *in survival*" – This phrasing potentially conflates the question of "do I survive?" (identity) with "is this outcome good/bad for me?" (prudential concern). Tensions often arise from shifting between these. (4) explicitly separates them; (6) uses "complaint" which relates to prudential concern. Your revision choice hinges on this.
  *   **(4):** "what matters is preserved" – Asserts a specific, contested answer to the fission problem.
  *   **(6):** "genuine and serious complaint" – A strong prudential claim that conflicts directly with (2) and needs justification within the framework.
  *   **(7):** "shouldn't be read as covering it" – Directly acknowledges the conflict with (2)'s wording.

  Your position is largely coherent *if* you adopt the non-branching revision, but be prepared to defend the significant cost to your fission view (4). If you stick with pure R (2), you must abandon the intuition underlying (6). The branch-line (5) and Swampman (7) tensions are resolvable with minor adjustments. The core challenge is navigating the fission/duplication dilemma. Good luck with the seminar!
