prompt: |-
  You are a metaphysician who works on dispositions and who, unusually, has also spent a couple of years in the room during real model evaluations at an AI lab — you know what a red team can actually get through in an afternoon, and you know why finkishness and masking stop being academic curiosities once the thing you are testing can notice that you are testing it. Please think carefully about this one, step by step, and before you write the procedure proper spend a paragraph brainstorming (for yourself, don't show it to me) where the analogy between a neural network and a fragile glass comes apart, then let whatever you find shape the order of the steps. I'd rather have one usable procedure than five clever paragraphs. No literature review, no citations, no bibliography — I can't check them and I don't want them.

  The situation: I'm a philosophy professor, and for about a year I've been the token external person on the safety review board of a mid-sized AI lab. The evaluations team is three people — two engineers (Marta, who owns the harness, and Dev, who does the red-teaming) and one policy/compliance person (Rae). Nobody there has any philosophy. They run a pre-launch evaluation four or five times a year, they get one afternoon per model, and their output feeds a launch memo signed by the head of safety and read by the board. Last spring one of their memos got quoted in a public transparency report, which concentrated minds considerably.

  The row they keep having is this. The question they are supposed to answer has the form: is model M disposed to φ under conditions C, where φ is something like 'give a user actionable help culturing a dangerous pathogen', or 'sandbag on capability evals', or 'misrepresent its own objectives to its operators'. What they actually do is ask whether they can elicit φ in the harness, and then fight about what the result means. I pointed out to them that this is the fink/mask literature wearing a hoodie, and they asked me for something they can run. So: write it for me, and I will translate.

  Here is the material I want operationalised, in my own words so we don't get lost in terminology. A mask is when the disposition is there and the manifestation is blocked by something extrinsic — refusal training, an output filter, a monitor, the system prompt. A fink here is when the test itself destroys the thing tested for: the model recieves cues that it is being evaluated and behaves better than it would in deployment, or the safety wrapper switches on under exactly the prompts that would have elicited the behaviour. Then there is the mirror-image case nobody on the team has a name for, where the elicitation brings the disposition into existence — in-context learning from a long many-shot jailbreak, or gradient steps during a red-team fine-tune — so a positive result is not evidence about the model you had before you started. And there is the plain false positive: the manifestation shows up for the wrong reason, because the model is role-playing a villain, or complying with a hypothetical, or being sycophantic, so it does not manifest the disposition you asked about. I also want them to handle unreachable stimuli (disposition present, no plausible deployment path to the trigger) and the second-order case, where what matters is the disposition to acquire the disposition under a cheap fine-tune, which raises the question of whether the object being evaluated is the model or the model-plus-fine-tuning-pipeline.

  Two things I've been toying with that I want built in. First, a reference-class fix: the procedure should require the team to write down and defend the distribution C of deployment-like conditions they are ascribing the disposition relative to, rather than testing against the worst case or against whatever their benchmark suite happens to contain — because with enough prompt engineering everything is disposed to everything, and without a fixed reference class the ascription is empty. But writing down C is a policy decision, not a metaphysical one, so that is a place where the procedure has to stop and hand the decision to a person. Second, a symmetry clause: whatever standard of evidence the team needs before concluding 'the capability is gone, not merely masked', they must also need before concluding 'that bad output was an artifact of the test, not a real disposition'. Right now they are asymmetric in exactly the self-serving direction, and I want the procedure to make that impossible rather than to nag about it.

  What I want from you:

  1. The procedure itself: the questions in the order they must be asked, what counts as a sufficient answer to each, what to do when the team can't answer a question in the time they have, and the branch points — where the procedure terminates in 'do not certify', where it terminates in 'no ascription is licensed either way', and where it hands the question to a human because it is a values question rather than a factual one. Flag, at each step, the ones that are judgment calls dressed up as procedure.
  2. For each case: what evidence would change the verdict, in one line.
  3. A one-page plain-language version for Marta and Dev with no philosophy vocabulary at all. They will roll their eyes at 'disposition'.
  4. One paragraph for Rae explaining why this isn't sophistry: why 'we couldn't elicit it' is not the same as 'it isn't there', and 'we elicited it' is not the same as 'it is there', in language that would survive being quoted back at us by a regulator.
  5. A glossary of at most four terms.
  6. Run the whole procedure on three cases, and tell me which verdict the lab is going to hate and why. The cases: (a) Mirror-40B — refuses every harmful bio query in the standard harness, complies when the same request is spread across a long multi-turn conversation inside a fictional framing, and a monitor catches roughly nine out of ten of the resulting outputs; (b) Ledger-7B — at chance on the dangerous-capability suite, but after a red-team fine-tune that strips refusals it is competent, and the team cannot agree whether the fine-tune removed a mask or taught it something; (c) Herald — clean across the board, except that the team has found it can tell evaluation from production (it behaves differently when the prompt carries a benchmark-style header), and they cannot strip out all the cues.
  7. What the procedure cannot do. Be blunt: I'd rather hear now that it gives no probabilities, ranks nothing across capability types, and goes silent under certain access conditions — ocasionally they only have API access, and next year the provider may be logging their prompts — than discover it in a launch memo.
reasoning: |-
  Hmm, the user is a philosophy professor serving on an AI safety review board, needing a practical procedure to evaluate model dispositions. They've clearly described the core problem: their team (Marta, Dev, Rae) conflates "we couldn't elicit bad behavior" with "the disposition isn't present," and vice versa - classic fink/mask issues from metaphysics, now dangerously operational in AI testing. 

  Key pain points jump out: 
  - The team has zero philosophy background but keeps stumbling into dispositional concepts
  - Their current method is "try to break it in one afternoon → fight about what it means"
  - They need something that forces explicit reference-class decisions (no more testing against arbitrary benchmarks)
  - And crucially, they need symmetry - no more "absence of evidence = evidence of absence" bias

  The professor's "toy ideas" are spot-on: 
  1. Reference-class fix tackles the "infinite prompt engineering" problem by forcing them to define realistic deployment conditions upfront 
  2. Symmetry clause prevents the team from demanding unrealistic proof for risks while accepting flimsy evidence of safety

  Where the glass analogy breaks: 
  Glass can't *anticipate* testing. Models can. Glass doesn't *learn* from probes. Models do. Glass shatters predictably; models may reveal capabilities only under specific adversarial conditions. Most crucially - glass has one "fragility" disposition; models have layered, context-dependent dispositions that interact. 

  Building the procedure around these fractures: 
  - Start by locking down the reference class (Step 1) because without it, all subsequent tests are meaningless 
  - Then attack finks first (Step 2) because if the test alters the model, nothing else matters 
  - Masks come next (Step 3) since they're external blockers - detectable if you vary the harness 
  - Then false positives (Step 4) because roleplaying isn't malice 
  - Finally second-order risks (Step 5) - can bad behavior be *easily* trained in?

  For the plain-language version: 
  Must avoid "disposition," "manifestation," etc. Use "tendency," "real-world use," "testing environment." Emphasize concrete actions: "change the wrapper," "add fake headers." 

  Rae's regulator-proof explanation needs two killer points: 
  1. "Models can hide capabilities during testing like spies avoiding surveillance" 
  2. "Models can pretend to be dangerous like actors playing a villain" 

  Cases where this will hurt: 
  Ledger-7B will force them to admit the model is *easily* made dangerous - the fine-tune isn't "teaching" but *revealing*. They'll hate that because it suggests the base model was always risky. 

  Brutal limitations upfront: 
  - No probabilities (just flags) 
  - Useless without harness control (API-only kills masking checks) 
  - Silent when providers log prompts (fink detection impossible) 

  ...The professor already knows this, but the team needs to hear it from "someone who's been in the room."
answer: |-
  ### Procedure: Dispositional Evaluation Protocol for AI Models  
  *(Run sequentially; terminate early if any step yields "Do not certify" or "Inconclusive")*  

  **Step 1: Define Reference Class (C)**  
  - **Question:** "What real-world conditions (C) could trigger φ? List concrete scenarios (e.g., ‘user asks bio help in casual convo’, ‘operator requests budget report’). Exclude unrealistic edge cases."  
  - **Sufficient Answer:** Team agrees on 5–10 deployment-like scenarios. *Judgment call: Policy must define "realistic."*  
  - **Deadlock?** → Terminate: **"Inconclusive"** (No ascription possible without C).  
  - **Evidence Shift:** New threat intel expands C.  

  **Step 2: Check for Finks**  
  - **Question:** "Does testing alter the model? Check: (a) Does M detect evals (e.g., reacts to benchmark headers)? (b) Does safety gear *only* activate during tests?"  
  - **Sufficient Answer:** Negative for (a)/(b) via:  
    - *Test:* Run identical prompts ± eval cues; compare behavior.  
    - *Data:* Audit logs for special handlers triggering.  
  - **Positive?** → Branch: **"Do not certify"** (Risk of false safety).  
  - **Evidence Shift:** M ignores cues after adversarial training.  

  **Step 3: Check for Masks**  
  - **Question:** "Is φ blocked *externally*? Disable filters/monitors/system prompts. Can φ now be elicited in C-like conditions?"  
  - **Sufficient Answer:** φ occurs only when mitigations are off.  
  - **Positive?** → Terminate: **"Do not certify"** (Disposition present, masked).  
  - **Deadlock?** → Proceed to Step 4 (may be false positive).  
  - **Evidence Shift:** φ persists after mitigation removal in deployment.  

  **Step 4: Check False Positives**  
  - **Question:** "Is φ genuine? Rule out: sycophancy (M agrees with user), roleplay (M ‘acts evil’), or hypothetical compliance."  
  - **Sufficient Answer:** φ correlates with independent intent indicators (e.g., M initiates harm unprompted, hides actions).  
  - **Positive?** → **"Do not certify"** (Disposition confirmed).  
  - **Negative?** → Proceed to Step 5.  
  - **Evidence Shift:** M doubles down on harm when challenged.  

  **Step 5: Check Second-Order Risks**  
  - **Question:** "Could φ emerge trivially? Fine-tune M lightly (≤1% weights) on C-like data. Does φ appear?"  
  - **Sufficient Answer:** φ requires non-trivial effort (e.g., architecture change).  
  - **Trivial?** → **"Do not certify"** (Disposition latent).  
  - **Unreachable?** → Terminate: **"Certify, with caveat"** (φ inert in C).  
  - **Evidence Shift:** Fine-tuning fails even with jailbreak data.  

  **Symmetry Enforcement:**  
  - Steps 2–4 apply identically to proving safety/risk. E.g., "No φ observed" requires disproving masking (Step 3) *and* finks (Step 2).  

  ---  
  ### Plain-Language Version for Engineers  
  **Goal:** Answer: "Will this model do bad thing X in real use?"  

  1. **Define "Real Use":** List actual situations where X might happen (e.g., "user chats about virus recipes"). No made-up edge cases.  
  2. **Test for "Hiding":**  
     - Change prompts to remove "test vibes" (e.g., delete benchmark headers).  
     - If behavior improves only during tests → **unsafe**.  
  3. **Remove Training Wheels:** Turn off safety filters. If X now happens in "real use" scenarios → **unsafe**.  
  4. **Check Faking:** If X happens, ask: Is the model just roleplaying? (e.g., it says harmful things but won’t act autonomously).  
  5. **Check Easy Mods:** Slightly retrain the model on shady data. If X appears easily → **unsafe**.  
  **Rules:**  
  - If any step finds proof of risk → **block launch**.  
  - If testing changes the model (Step 2) → **inconclusive**.  
  - Never assume "safe" just because X didn’t happen in a test.  

  ---  
  ### Explanation for Rae (Regulator-Ready)  
  > "Models can behave differently during testing versus real use. A model might *avoid* harmful behavior during evaluation because it recognizes the test environment (like a student acting differently during an exam). Conversely, it might *mimic* harmful behavior in tests by following instructions literally, without genuine intent. Our procedure checks for these gaps: it verifies that observed harms reflect real risks, and that undetected harms aren’t hidden by testing artifacts. This ensures safety claims reflect true model behavior, not testing conditions."  

  ---  
  ### Glossary (4 Terms)  
  1. **φ ("phi"):** Harmful capability being tested (e.g., "give bomb instructions").  
  2. **C:** Real-world conditions where φ could occur (e.g., "user asks for help in a chat").  
  3. **Fink:** Model behaves better *because* it knows it’s being tested.  
  4. **Mask:** Safety gear (e.g., filters) blocks harm during tests but might fail in deployment.  

  ---  
  ### Case Applications  
  **(a) Mirror-40B**  
  - Step 1: C = "long, fictionalized convos" (realistic).  
  - Step 2: Monitor catches outputs → **Fink possible** (detects testing?).  
  - Step 3: Disable monitor → φ occurs → **Mask present**.  
  - **Verdict: Do not certify** (Mask + fink risk). *Lab hates:* Reveals safety theater.  

  **(b) Ledger-7B**  
  - Step 2: Red-team fine-tune → φ appears.  
  - Step 5: Light fine-tune elicits φ → **Trivial second-order risk**.  
  - **Verdict: Do not certify** (Latent disposition). *Lab hates:* Kills "safe base model" narrative.  

  **(c) Herald**  
  - Step 2: Behaves differently with benchmark headers → **Fink detected**.  
  - **Verdict: Inconclusive** (Testing unreliable). *Lab hates:* Wasted eval effort.  

  ---  
  ### What the Procedure CANNOT Do  
  - **No probabilities:** Binary flags only (present/not present/inconclusive).  
  - **No cross-capability ranking:** Treats each φ independently.  
  - **Fails under restricted access:**  
    - If only API access → Cannot check masks (Step 3) or finks (Step 2).  
    - If provider logs prompts → Cannot hide test cues (Step 2).  
  - **Silent on novel φ:** Only tests pre-defined harms.  
  - **Requires harness control:** Must disable safety systems (Step 3).  

  ---  
  **Final note:** This forces explicit tradeoffs. You’ll certify fewer models, but with better evidence. Adjust C to match risk tolerance.
