answer: |-
  Your frustration is palpable and entirely justified. This isn't just a literature review hurdle; it's grappling with a *structural* impasse in political theory. Based on your description and my understanding of the field, here's a diagnosis, grounded in the arguments as presented:

  **The Core Diagnosis: Multiple, Deeply Entangled Disagreements Masquerading as One (High Confidence - 85%)**

  You've hit the nail on the head with your hunches. The stalemate arises because **the debate conflates at least five distinct, fundamental, and often incompatible types of disagreement under the single banner of "open borders vs. bounded citizenship."** Crucially, *each side strategically engages with the aspects most amenable to their normative framework while dismissing or reinterpreting the others as derivative or invalid.* This isn't mere stubbornness; it's a consequence of genuinely different foundational starting points.

  **The Five Layers of Disagreement:**

  1.  **The Foundational Normative Anchor: Coercion vs. Collective Autonomy (Foundational - 95% Confidence)**
      *   **Side A (Open Borders):** Starts with the *individual migrant* as the primary moral subject. The core wrong is the *coercive exclusion* itself. Any restriction requires justification *to the excluded individual*, demanding a high burden of proof focused on direct harm. Citizenship boundaries are inherently suspect as arbitrary lines restricting fundamental liberties (movement, opportunity).
      *   **Side B (Bounded Membership):** Starts with the *political community* as the primary moral subject. The core value is *collective self-determination* and the *autonomy* to define the "we" and its shared projects (like the welfare state). Exclusion isn't inherently coercive in the same way; it's a necessary condition for the existence of a distinct community capable of making collective decisions and bearing mutual obligations. The burden lies in justifying *intrusion* into the community's self-defining process.
      *   **Why it Stalemates:** These are bedrock intuitions about the fundamental unit of moral concern and the nature of political legitimacy. Arguments appealing to consequences (welfare state, integration) are secondary attempts to bolster these irreconcilable starting points, not bridges between them. Neither side can "prove" their foundational intuition is correct; they can only show its coherence and implications.

  2.  **The "Open Borders" Ambiguity: Entry vs. Membership (Conceptual - 90% Confidence)**
      *   **Your Insight is Correct:** "Open borders" is used equivocally.
          *   **Open Entry:** Freedom to cross the border and reside/work. May involve restrictions on immediate access to full welfare benefits and political rights.
          *   **Open Membership:** Immediate or rapid access to full citizenship rights (voting, full welfare benefits, permanent residency).
      *   **Why it Stalemates:** Side A often argues for Open Entry (focusing on the initial coercion of exclusion), while Side B responds to Open Membership (focusing on the impact on the community's institutions and self-definition). Side A might see delayed membership as a temporary, unjust compromise; Side B might see even open entry without immediate membership as undermining cohesion over time. They argue past each other because they aren't consistently defining the *institutional endpoint* of the proposal.

  3.  **The Welfare State Trilemma: Fiscal, Political, Constitutive (Analytical - 85% Confidence)**
      *   **Fiscal:** Net cost/benefit calculation of immigration on public finances (taxes paid vs. benefits/services consumed).
      *   **Political:** Impact on *majoritarian support* for redistribution. Does diversity/composition of the population, or the perceived strain, erode the electoral coalition necessary to sustain generous welfare policies?
      *   **Constitutive (Your Key Insight):** The welfare state isn't just a machine for redistribution; it's an institutional expression of a specific kind of bounded solidarity. Membership boundaries aren't just a *causal input* to making redistribution politically feasible; they are *constitutive* of the *meaning* of the obligation. "Our welfare state" implies obligations to *us*, defined by mutual recognition within a bounded group. Removing the boundary doesn't shrink the machine; it transforms the *kind* of institution it is (e.g., potentially towards a global basic income or radically different local mutual aid).
      *   **Why it Stalemates:**
          *   Side A engages primarily with the Fiscal argument (empirically contestable, potentially solvable by policy design like contribution delays) and dismisses the Political argument as reflecting prejudice or failing institutions, not an inherent problem. They often treat the Constitutive argument as either incoherent or morally repugnant (prioritizing group identity over individual need/justice).
          *   Side B leans heavily on the Constitutive argument (seeing it as fundamental) and the Political argument (seeing it as a realistic constraint). They see the Fiscal argument as secondary or manageable *only if* the Constitutive and Political conditions are met. They view Side A's dismissal of the Constitutive concern as ignoring the very nature of political community and social solidarity.
          *   **Crucially:** The Constitutive argument is *not empirical* in the same way as Fiscal or Political. It's a claim about the *conceptual preconditions* of a particular kind of institution. Evidence about fiscal impacts (Layer 1) or electoral behavior (Layer 2) doesn't directly address Layer 3. Side A demands empirical proof for a constitutive claim, which Side B sees as misunderstanding its nature.

  4.  **Epistemic Framing: What Counts as Evidence? (Methodological - 75% Confidence)**
      *   **Historical Cases:** Is post-WWII European guest worker migration relevant? Side A might say yes, showing integration *can* happen (eventually) and fiscal contributions were positive. Side B might say no, because it *wasn't* open entry/membership initially, involved specific selection, and arguably *did* create long-term political tensions challenging solidarity. The disagreement is over the *analogy* and the *interpretation* of complex historical processes.
      *   **"Integration":** Side A often sees demands for "integration" as inherently exclusionary, masking assimilationist demands or prejudice. Side B sees it as a genuine, necessary condition for the maintenance of mutual trust and shared identity underpinning solidarity. Is it a neutral condition or a tool of exclusion? This reflects their foundational views (Layer 1).
      *   **Why it Stalemates:** Each side selects and interprets evidence through the lens of their foundational commitments (Layer 1) and their understanding of the key mechanisms (Layer 3). There's no neutral ground for evaluating evidence because the *significance* and *interpretation* of the evidence depend on prior commitments.

  5.  **The Scope of "Freedom of Association" (Conceptual/Normative - 80% Confidence)**
      *   Side B's analogy to individual freedom of association is heavily contested by Side A.
      *   **Critique:** Can a *state*, a coercive institution with monopoly power over territory, legitimately claim the same moral right to "associate" or "disassociate" as an individual? Doesn't the state's unique power create a much higher justificatory burden? Is the "association" meaningfully voluntary for those born within the borders? Side A argues the analogy is deeply flawed. Side B argues it captures the essential right of a group to determine its own character.
      *   **Why it Stalemates:** This disagreement stems directly from Layer 1 (individual vs. collective focus) and involves complex debates about the ontology of groups and the legitimacy of state power that are rarely fully resolved in the migration context itself.

  **What Kind of Disagreement is This?**
  It is **foundational all the way down, amplified by conceptual ambiguity, methodological divergence, and strategic selective engagement.** Layer 1 (Coercion vs. Autonomy) is the bedrock. Layers 2 (Open Entry vs. Membership) and 3 (Welfare Trilemma) are the primary sites where this foundational clash manifests in arguments about institutional feasibility and meaning. Layers 4 (Evidence) and 5 (Association Analogy) are derivative battlegrounds shaped by the deeper layers.

  **What Would Count as Progress? Expecting resolution is likely futile, but meaningful scholarly progress *is* possible:**

  1.  **Radical Disambiguation & Precision (High Potential Impact):** Your work can *forcefully* disentangle these layers. Explicitly separate:
      *   Foundational commitments (Coercion vs. Autonomy).
      *   The policy proposal (Open Entry vs. Open Membership).
      *   The distinct welfare state objections (Fiscal, Political, Constitutive).
      *   Map exactly which objections each side is responding to (and ignoring) at any given moment. This meta-analysis alone would be a significant contribution, showing *why* the debate is circular. **Progress = Clarifying the architecture of the stalemate.**

  2.  **Exploring the Constitutive Argument Seriously (Moderate Potential Impact):** Instead of dismissing it, rigorously analyze the Constitutive claim. What *exactly* is the relationship between bounded membership and the *meaning* of social citizenship? Can different forms of boundedness (not just nation-states) support similar solidarity? Are there alternative institutional forms that could achieve distributive justice *without* relying on national solidarity? **Progress = Deepening the understanding of solidarity's preconditions beyond crude empiricism or dismissal.**

  3.  **Shifting the Question: From "Open vs. Closed" to "What Kind of Openness?" (Moderate Potential Impact):** Acknowledge the foundational impasse and pivot. Given that full Open Membership is politically and normatively contested, what *degrees* or *types* of openness are normatively justifiable and institutionally viable under different foundational views? Explore hybrid models, regional frameworks, or differentiated membership rights. **Progress = Moving beyond the binary towards nuanced institutional design.**

  4.  **Meta-Ethical/Political Analysis (High Potential Impact, Harder):** Explicitly frame the debate as a clash of fundamentally different, reasonable, but incompatible political worldviews (liberal cosmopolitanism vs. liberal nationalism/republicanism/communitarianism). Analyze the *conditions* under which one view might gain traction over the other historically or politically, rather than trying to "win" the normative argument. **Progress = Reframing the debate as one about competing visions of political order.**

  **Should you stop expecting resolution?** Yes, if by "resolution" you mean one side convincing the other of their foundational premise (Coercion vs. Autonomy) or definitively proving/disproving the Constitutive claim about the welfare state. **No, if you see progress as rigorously mapping the disagreement, clarifying its structure, and exploring viable paths forward *within* or *despite* the foundational impasse.** Your contribution lies in diagnosing the stalemate's anatomy, not curing it.

  **Where is this diagnosis most likely wrong?**
  *   **Overstating Conflation:** Perhaps detailed textual analysis of specific key theorists would reveal more sophisticated engagement with all facets of the welfare state argument than I'm crediting. If prominent Side B theorists explicitly ground their arguments *only* on empirically falsifiable Fiscal/Political claims and reject the Constitutive one, or if Side A theorists seriously grapple with the Constitutive meaning of solidarity, my confidence in Layer 3's centrality would decrease (though Layer 1 remains).
  *   **Underestimating Empirical Resolution:** Maybe future, exceptionally robust social science could *so definitively* resolve the Fiscal and Political questions (e.g., showing large-scale open membership *always* destroys welfare states, or *never* does under conditions X) that it forces one side to concede significant ground, even if the foundational commitment remains. I'm skeptical, given the constitutive and political nature of the core concerns.
  *   **Neglecting Power/Structural Injustice:** The diagnosis focuses on the *theoretical* logjam. A critique might be that it underplays how the debate serves existing power structures and global inequalities, making the stalemate itself a symptom of deeper injustices. This is valid but slightly adjacent to your specific request for a diagnosis of the theoretical impasse.

  **In conclusion:** The stalemate is real and deeply rooted. Your hunches about conflation and ambiguity are astute and point to the core problem. Don't expect to break the stalemate; instead, use your analysis to **structure the literature review around *exposing* these layers of disagreement.** Show how the circularity arises from foundational incompatibility amplified by conceptual slippage and selective argumentation. This meta-contribution – diagnosing the debate's persistent structure – is a valuable PhD-level insight in itself. Focus on precision, disambiguation, and mapping the terrain. Good luck!
