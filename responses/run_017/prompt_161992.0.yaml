answer: |-
  Here’s a targeted Q&A prep sheet, prioritizing objections by likelihood/impact and tailoring them to your audience factions. Replies are designed for brevity (under 2 minutes) and avoid citations.

  ### **Top-Tier Objections (High Likelihood/High Damage)**
  1. **Dynamic Choice Group** (Likely early, dismissive):  
     *"This is just the standard policy-based response to money pumps (e.g., McClennen, Rabinowicz). You’re reframing known results as a critique."*  
     **Reply:** "The standard policy view *starts* from synchronic coherence as the ideal, treating diachronic resilience as a 'second best.' I’m arguing the pump can’t indict synchronic incoherence *at all* without smuggling in diachronic assumptions. The 'loop-closing' agent’s preferences are cyclic but unexploitable—so what’s irrational?"  
     **Soft Spot:** If they insist your "loop-closer" *is* synchronic-coherent (e.g., via state-dependent utilities), clarify: *"A loop-closer still has cyclic pairwise rankings but uses history-dependent policies to block trades. The pump doesn’t detect the cycle—it detects myopia."*  

  2. **Formal Epistemology / Social Choice Group** (Core objection):  
     *"If cyclic preferences don’t entail irrationality, why should we care about coherence axioms? You’re undermining the foundations of choice theory without offering a replacement."*  
     **Reply:** "Coherence axioms are still crucial *if* we assume agents can’t bind future selves. But the pump doesn’t show incoherence is *inherently* flawed—it shows it’s costly when paired with myopia. We can model loop-closing agents with cyclic preferences but exploit-resistant policies. The axioms are practical tools, not metaphysical necessities."  
     **Soft Spot:** They’ll push for your "positive account" of rationality. Prep a 1-sentence teaser: *"Rationality is about sustainable policies across time—synchronic coherence is a special case for non-self-binding agents."*  

  3. **Humean Senior Scholar** (Normative challenge):  
     *"Calling policies 'rational' smuggles in normative glue. My desires are reasons enough; if I pay to cycle, that’s just me satisfying my preferences at each step."*  
     **Reply:** "Exactly—the pump *doesn’t* show your preferences are defective. It shows your environment exploits myopia. But if you’re loop-closing, you satisfy your time-slice desires *and* avoid exploitation. The irrationality verdict requires judging the *sequence*—which Humeanism lacks unless we add diachronic constraints."  
     **Soft Spot:** She may say diachronic constraints are "alien." Concede: *"Yes, this needs a richer 'agent over time' view—but that’s the pump’s hidden demand."*  

  ---

  ### **Medium-Tier Objections**
  4. **Akrasia Researchers** (Likely to hijack):  
     *"This proves resolve is rational! The loop-closer binds herself—that’s strength of will defeating synchronic preferences."*  
     **Reply:** "Not quite: the loop-closer doesn’t 'overrule' her preferences—she has a policy that makes the first trade *undesirable* given her foresight. This is about foresight, not willpower. Resolve models often *assume* synchronic irrationality—I’m questioning that premise."  
     **Damage Control:** If they persist: *"Let’s discuss resolve after the talk—I’m wary of conflation here."*  

  5. **Grad Students** (Seeking intuition):  
     *"But if I prefer A>B>C>A, and I pay to cycle, haven’t I *revealed* I’m irrational?"*  
     **Reply:** "Only if you’re myopic! If you foresee the cycle, refusing the first trade is consistent with pairwise preferences. The pump exploits *shortsightedness*, not the cycle itself. Cyclic preferences + myopia = trouble; cyclic + foresight = unexploitable."  

  ---

  ### **Strategic Concession (First 2 Minutes)**  
  *"I concede: synchronic coherence is pragmatically vital for modeling agents who can’t or won’t plan ahead. Money pumps usefully flag myopic vulnerability. But they don’t show cyclic preferences are inherently irrational—they show rationality must be diachronic."*  
  **Why:** Preempts formalists’ "why care?" by affirming axioms’ utility. Isolates the core fight to "inherent irrationality."

  ---

  ### **The Must-Land Reply**  
  When challenged on **"What *is* irrational then?"**:  
  *"Exploitability stems from mismatched *grain*: your trade willingness is finer than your foresight horizon. That’s a diachronic failure—not your preferences’ shape. The pump can’t diagnose irrationality without assuming myopia or infinite vulnerability."*  
  **Crucial:** Hammer that the loop-closer has cyclic prefs but isn’t pumped. The flaw is *in the agent-environment interaction*.

  ---

  ### **The Nightmare Question (Yours, But Sharper)**  
  *"If the loop-closer isn’t irrational, is the myopic agent just *unlucky*? Your view seems to say smokers who can’t quit aren’t irrational—they’re in exploitative environments."*  
  **Reply:** "No—the myope *is* irrational, but not because of cyclic preferences. Her flaw is *failing to coordinate with her future selves*. The smoker’s error isn’t valuing health over smoking today; it’s lacking a policy to handle future temptation. Money pumps reveal *that* failure, not preference incoherence."  
  **Why It’s Deadly:** Forces you to define "diachronic rationality" substantively. **Salvage:** Stress *"The pump alone can’t ground this—it reveals a symptom. We need independent norms for planning."***

  ---

  ### Tactical Notes  
  - **Preempt the "old news" jab:** Open by saying *"This isn’t anti-policy views—it’s about what pumps *can’t prove* without diachronic help."*  
  - **Handle "Who says that?"**: *"I’m building on dynamic choice work but pushing further: even McClennen needs synchronic incoherence to be *prohibited*. I’m saying it isn’t."*  
  - **If cornered on normativity:** *"I’m not endorsing cyclic preferences—I’m showing the pump’s verdict depends on diachronic features we must justify separately."*  

  You’ve got this. Your framing is razor-sharp—just keep anchoring to the "loop-closer" as your existence proof.
