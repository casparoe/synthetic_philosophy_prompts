prompt: |-
  Hey — for the next hour please act as my in-house philosopher of history (and, honestly, as someone who's sat on too many committees): think carefully, and do some free-form brainstorming first about what rule set could even generate our track record before you commit to an answer. I sit on our city's Memory and Records Board, and we've made a mess for ourselves by never writing down our principles. Cases we've ruled on, roughly in order: (1) a plaque saying soldiers set the 1921 workers' hall fire, when the fire brigade's own report blames the wiring — we had the plaque recut to the archival version; (2) the town's founding-day festival, which commemorates a battle that the muster rolls place twelve kilometres away and a fortnight later — we left the festival entirely alone but paid for an interpretive panel at the actual site; (3) a deported families' association's oral history of expulsion from a village whose land registry burned in 1944 — with the record silent we accepted the memory as the best available evidence and put up a marker worded "according to the memory of the descendants"; (4) the state museum's display claiming a 1948 strike was organised by outside agitators, which turned out to have been drafted by the then-ministry with nothing behind it — we forced removal, saying explicitly that an institution's memory of itself gets no deference; (5) a bronze statue to a local woman said to have hidden nineteen children, where the archives name a different rescuer, but where the misattributed story is what actually inspired a rescue network that saved people in 1942 — we kept the statue and bolted on a second plaque naming the real person and explaining the error; (6) a neighbourhood association wanting a sign for "the green, common land since time immemorial", where the deeds show private ownership — we refused the sign.

  Our new case is the one everyone's dreading. For about sixty years the town has held a dawn walk to a meadow where, by local memory, forty-one people deported in 1943 were shot; two independent archival series (transport rosters and burial registers, neither of them produced by any party to the dispute) put the shootings at a gravel pit three kilometres away and show the meadow was a storage yard with no burials. Three complications. First, the specific claim only appears in print from 1985 in a heritage society booklet, though residents interviewed a few years earlier remember the walk "always" going to the meadow without saying why — so the practice looks older than the claim, but we can't tell by how much. Second, since the nineties the walk has become the town's biggest civic event, run by an association that now includes descendants of people deported from other districts entirely, and a court ruling from that era — relying on the belief — blocked a road across the meadow; the meadow is up for sale and the buyer says the belief has no documentary basis. Third, an organised group of the actual descendants of the forty-one, a small community that's been marginalised in local life, want the walk rerouted to the gravel pit. I've also noticed something I can't get out of my head: our archive now holds a few hundred items — news stories, the court judgment, school materials, our own minutes — that all attest to the shooting at the meadow and that all exist *because* people believed it. So the record isn't clean of the memory; it's partly a sediment of it.

  What I want from you: two or three candidate rules that fit all six precedents about equally well (something like record-primacy-with-an-interested-party-exception, versus a split rule where the record governs factual assertion and memory governs commemorative practice, versus something about what a false memory went on to *cause*), what each predicts we should do here, and your best guess with the reasons for preferring it — which precedent is really the closest analog, and what principle would we be adopting either way (that a practice built on a false claim inherits the defect, say, or that the archive is not a court of appeal for a ritual). Then tell me which single further case would best separate the surviving rules — I keep going back and forth between a case where the false memory is the descendants' *own* and they want to keep it, and a case where the record's only support is documents the memory generated. And please say something about that sedimentation point: how should a record-first rule treat documents whose entire provenance is the memory they're supposed to be checking? I care much less about which way we go than about whether we can say what we're doing.
reasoning: |-
  Hmm, the user is on a city's Memory and Records Board and needs help developing consistent principles for handling historical memory cases. They've described six past rulings and a new complex case about a disputed WWII memorial walk location. 

  First I need to understand their precedents. Case 1 prioritized archival records over public memory when they had conflicting physical evidence (fire brigade report vs plaque). Case 2 allowed commemorative practice (festival) to continue unchanged while adding factual correction at the actual site - so they separated ritual from historical accuracy. Case 3 accepted oral history as evidence when official records were destroyed, showing flexibility when documentation is absent. Case 4 rejected institutional self-documentation when contradicted by external evidence, establishing that organizations don't get special deference for their own narratives. Case 5 preserved an inspirational but inaccurate memorial while adding corrective context - valuing the social impact of a story while acknowledging its factual errors. Case 6 denied a memorial request when deeds contradicted oral tradition about land ownership.

  Now the thorny new case: A 60-year-old dawn walk commemorates shootings at a meadow, but archival evidence points to a gravel pit 3km away. Complications include: the practice predates the specific claim, it's become a major civic event involving people beyond the actual descendants, there are legal and property implications, and crucially - the archives now contain documents that only exist because people believed the meadow story. This "sedimentation" problem is key: documents generated by the memory can't be used to validate that same memory.

  The user wants me to propose 2-3 rules that fit all precedents, apply them to this case, pick the best fit, and suggest a test case. They care most about consistency, not the specific outcome.

  For candidate rules:
  1) The Provenance Principle would prioritize contemporary records over later memories, but with an exception when records are absent or tainted by institutional bias. This fits cases 1 (used contemporary report), 2 (added factual correction), 3 (accepted memory when records destroyed), 4 (rejected biased institutional record), 5 (acknowledged factual error in statue), and 6 (relied on property deeds).
  Applied to the new case: It would relocate the walk to the gravel pit since two independent archival sources contradict the meadow claim, and the "sedimented" documents don't count as independent verification.

  2) The Functionality Split would separate factual claims from commemorative practices. Facts follow documentation; practices follow social meaning unless harmful. Fits cases 1 (corrected plaque's factual error), 2 (left festival alone as practice), 3 (accepted memory as best factual evidence when no records), 4 (rejected false factual claim), 5 (preserved statue's social function while correcting facts), and 6 (denied sign making false factual claim).
  For the new case: It would keep the walk at the meadow (as meaningful practice) but install signage at the gravel pit with the archival facts.

  3) The Consequence Test would prioritize the effects of the memory over its accuracy. Fits cases 1 (fire plaque had no positive social effect to preserve), 2 (festival's community value preserved), 3 (oral history validated marginalized voices), 4 (institutional lie served no good purpose), 5 (statue inspired real rescue efforts), and 6 (false land claim could enable problematic ownership disputes).
  For the new case: It might keep the meadow walk because of its community-building role, but only if the actual descendants' concerns are addressed - otherwise the harm might outweigh the benefit.

  I think Case 5 is the closest analog - both involve memorials where the factual error inspired real historical actions. The statue wasn't removed because its false attribution actually saved lives; the meadow walk built community across decades. The key difference is the descendants' objection.

  For the sedimentation issue: Memory-generated documents should be treated as manifestations of the belief, not evidence for it. Like in Case 4, we wouldn't accept the museum's own display as proof of its claim.

  For a test case to distinguish the rules: Imagine descendants have an oral tradition contradicted by archives, but they want to maintain their version. The Provenance Principle would override them with documents; Functionality Split might accept both; Consequence Test would prioritize their agency unless harmful.

  My recommendation is a hybrid: Use the gravel pit for the factual marker per Provenance Principle, but keep the meadow walk as commemorative practice per Functionality Split - with three conditions: 1) Explicit signage at meadow explaining the archival findings and sedimentation paradox, 2) Incorporate the actual descendants' voices in the ritual redesign, 3) Create space at the gravel pit for those who want fact-based remembrance.

  This honors the precedents while acknowledging that historical meaning isn't just about coordinates on a map. The sedimentation documents become part of the exhibit - evidence of how communities process trauma through memory.
answer: |-
  Based on your precedents and the sedimentation paradox, here are three candidate rules, their application to the new case, and analysis of which fits best — followed by a proposed test case and thoughts on sedimentation.

  ---

  ### **Candidate Rules**
  1. **The Provenance Principle**  
     *Prioritize contemporaneous records over memory, unless:*  
     - Records are absent/destroyed (Case 3)  
     - Records reflect institutional self-interest (Case 4)  
     - Memory generated significant *concrete historical consequences* (Case 5)  
     *Precedents aligned:*  
     - Case 1 (wiring report > plaque memory)  
     - Case 3 (oral history accepted *only* due to record loss)  
     - Case 4 (rejected self-serving institutional record)  
     - Case 5 (statue kept due to its real-world impact)  
     - Case 6 (deeds > "time immemorial" claim)  

  2. **The Functionality Split**  
     *Factual assertions require record evidence; commemorative practices may stand if they:*  
     - Serve community cohesion without contradicting core facts (Case 2)  
     - Hold independent social value beyond accuracy (Case 5)  
     - Lack harmful consequences (unlike Case 6’s property claim)  
     *Precedents aligned:*  
     - Case 1 (corrected plaque: factual assertion)  
     - Case 2 (festival untouched as practice, facts added elsewhere)  
     - Case 5 (statue as practice preserved, facts corrected)  
     - Case 6 (rejected sign: false factual claim with property implications)  

  3. **The Consequence Test**  
     *Memory prevails if it generated net-positive, tangible outcomes; records prevail if memory causes harm or exclusion (Case 6).*  
     *Precedents aligned:*  
     - Case 2 (festival preserved: builds community)  
     - Case 3 (oral history accepted: gives voice to marginalized)  
     - Case 5 (statue kept: inspired rescue network)  
     - Case 6 (sign rejected: risked property encroachment)  

  ---

  ### **Predictions for the New Case**
  | **Rule**               | **Prediction**                                                                 | **Why?**                                                                                                                                 |
  |------------------------|-------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------|
  | **Provenance Principle** | Relocate walk to gravel pit.                                                  | Independent archives trump memory; no record loss or institutional bias. Sedimented documents are invalid as "evidence."                |
  | **Functionality Split**  | Keep walk at meadow (as practice), add signage/ritual at gravel pit (fact). | Walk is civic ritual with independent value (like the festival). Meadow’s false claim isn’t harmful like Case 6’s property assertion.    |
  | **Consequence Test**     | Relocate walk unless descendants oppose it.                                   | Current walk excludes actual descendants (harm). But if rerouting fractures community, keep meadow with gravel pit acknowledgment. |

  ---

  ### **Best Fit & Why**  
  **Closest Analog: Case 5 (statue with dual plaques)**  
  - Both involve a memorial with factual errors but tangible historical impact (statue inspired rescues; walk built community/blocked development).  
  - The sedimentation issue mirrors Case 4: just as the museum’s self-documentation wasn’t trusted, documents *generated by* the meadow belief can’t validate it.  

  **Recommended Rule: Modified Functionality Split**  
  - Adopt the split but add a *"harm-to-marginalized" override* (from Case 3/Consequence Test).  
  - **Solution:** Keep the meadow walk as protected practice (like the festival), but:  
    - Install a permanent educational display at the meadow explaining the archival evidence and sedimentation paradox.  
    - Support the descendants’ group to create a separate ritual at the gravel pit (state-funded, designed by them).  
    - Legally separate the meadow’s sale from the walk’s right-of-way (resolving the buyer’s claim without endorsing the memory).  
  - **Why this fits best:**  
    - Aligns with Case 2 (practice preserved) and Case 5 (error acknowledged, value honored).  
    - Addresses Case 3’s concern: actual descendants’ voices centered at the gravel pit.  
    - Avoids Case 4’s pitfall: sedimented documents become part of the *story of memory*, not evidence.  

  **Principle Adopted:**  
  > *"Communities may retain rituals born of memory, but factual claims require archival proof. When memory excludes the marginalized, it must be supplemented, not supplanted."*  

  ---

  ### **Sedimentation: How to Handle Self-Generated Records**  
  - Treat such documents as *artifacts of belief*, not evidence. Like Case 4’s museum display, they reveal how institutions/communities *narrate* history, but can’t validate facts.  
  - **Solution:** Archive them under "commemorative impact" (e.g., "1985–2020: Meadow as Symbolic Site"), distinct from "event documentation."  

  ---

  ### **Test Case to Separate Rules**  
  **Scenario:** *A Roma community’s oral history describes their ancestors constructing a town hall in 1890. Municipal archives list a different builder (a prominent settler family), but the archives themselves were compiled by that family’s descendants. The Roma group requests a plaque honoring their ancestors.*  
  - **Provenance Principle:** Rejects plaque (contemporaneous records > memory), ignoring archive’s bias.  
  - **Functionality Split:** Allows plaque *if* presented as community memory (not factual claim), like Case 3.  
  - **Consequence Test:** Approves plaque to rectify historical exclusion (net-positive impact).  
  *This tests: (1) institutional bias in records, (2) memory as counter-narrative, (3) harm/benefit balance.*  

  ---

  ### Final Note  
  Your precedents suggest a nuanced hierarchy: **facts** derive from records (unless corrupted/lost), **rituals** derive from community meaning (unless harmful), and **marginalized voices** break ties (Cases 3, 5). The meadow walk survives as ritual, but the gravel pit *must* become the descendants’ truth-ground. This avoids absolutism while naming your operating principle: **"Memory shapes belonging, records shape truth — and justice mediates when they clash."**
