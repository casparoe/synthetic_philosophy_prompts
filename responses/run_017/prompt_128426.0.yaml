  **Sentence to Probe in Office Hours:**  
  *"if Ada and Bea differ, then either they differ in sense or they do not, and if they do differ in sense, then, since senses are shareable, either of them could in principle have grasped the other's sense — so the difference between them is not a semantic difference at all"* (¶3).  

  **Probing Questions:**  
  1. *"You note senses are shareable. Couldn’t Ada and Bea *both* grasp both senses (man-as-grey-coat, man-as-limp) *without* realizing they co-refer? If so, wouldn’t that make their cognitive difference *semantic* (two senses) rather than merely epistemic?"*  
  2. *"Frege’s 'Hesperus'/'Phosphorus' example involves two speakers. Does your view imply this isn’t a genuine Fregean puzzle?"*  
  **Purpose:** Distinguish whether this is a **slip** (overlooking that shareability allows interpersonal sense differences) or a **misunderstanding** (equating "semantic" with "intrapersonal conflict"). If they affirm the latter, it confirms a deeper error.  

