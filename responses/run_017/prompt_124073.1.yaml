answer: |-
  Here's a principled framework for evaluating "sexed defaults" in professional style guides, designed for robustness and editor application, grounded in your cases and distinctions:

  **Core Desiderata for a Style Guide Theory (Must-Haves):**

  1.  **Editorial Applicability (Bright-Line Rule):** Must yield clear, objective rules a copyeditor can apply *without* inferring authorial intent or audience reaction (e.g., "Replace generic `man` with `human`, `person`, or `staff`; replace `he`/`his` generics with `they`/`their`, `he or she`, or restructure"). *Anchored to:* Need for copyeditor action.
  2.  **Falsifiable Claim:** Must state what observable phenomenon (beyond mere offense) makes the sexed default problematic. If null psychological effects *would* falsify the core objection, the theory must state this. *Anchored to:* "Hostage to psychology" case.
  3.  **Harm Specification:** Must clearly state *which type* of harm/problem is primary (e.g., cognitive exclusion, expressive harm, reinforcement of bias) and *who* is primarily affected (e.g., non-male readers, the language system, societal perception). *Anchored to:* "Keep apart" demand.
  4.  **Asymmetry Explanation (Hofstadter):** Must explain why raced generics feel *revolting* while sexed generics often feel merely *annoying* or *outdated*. *Anchored to:* Hofstadter's satire case. *(Genuine Desideratum, but hardest)*
  5.  **Scope Definition (Fossil Cases):** Must provide a clear principle for handling fossil terms (manhole, man a booth). Rule: **Decomposition Test** – If the term is not readily decomposable by contemporary speakers into `man` + `X` with a generic-human meaning for `man`, and its meaning is specific/technical, it falls outside the core rule. *Anchored to:* Fossil cases. (Present-day decomposition > Etymology).
  6.  **Reversal Test Utility:** Must clarify the test's purpose. **Probative Value:** A reversal is primarily useful for *exposing an implicit bias* in the *original* default by making it salient to the dominant group. It doesn't inherently condemn the *new* term; its decay is a separate issue (the treadmill). The test fails if the asymmetry is fundamental (see Des. 4). *Anchored to:* Reversal problem. *(Conclusion: Useful for illustration, not proof; drop as a decisive test).*

  **Common Biases/Prejudices (Not Core Desiderata):**

  *   **"It's Uglier" Objection:** Subjective aesthetic preference. Not a principled basis.
  *   **"It's Only Etymology" Move:** Dismisses how historical meaning shapes present understanding. Countered by Des. 5 (Decomposition Test).
  *   **"Treadmill Worry":** Valid long-term observation (language evolves), but doesn't negate the *current* problem with the *existing* default. Not a reason to keep a harmful default.

  **Insurmountable Tensions (Likely Can't Jointly Satisfy):**

  1.  **Bright-Line Rule (Des. 1) vs. Sensitivity to Associative Profile:** A rule editors can apply *requires* ignoring subtle contextual/associative variations. A theory demanding sensitivity to each term's specific "profile" is unworkable for style guides.
  2.  **Explaining Asymmetry (Des. 4) vs. Wrongness Tracking Current Offense:** If wrongness *only* tracks who is offended *now*, the asymmetry is self-explanatory (more people offended by race default). A principled theory needs a deeper explanation *for* the asymmetry, suggesting harm exists even if offense fades.

  **Requirement Knocking Out Popular Accounts:**

  *   **Bright-Line Rule (Des. 1)** knocks out theories relying heavily on speaker intent, subtle context, or requiring editors to judge "typicality" or "harm potential" case-by-case (e.g., pure Gricean implicature theories, some expressive harm theories without clear triggers).
  *   **Falsifiability (Des. 2)** knocks out theories based solely on claims of inherent falsity ("man doesn't *mean* women!") or ineffable harm.

  **Brief Theory Evaluations Against Criteria:**

  1.  **Etymology Defence:** "It didn't *mean* male originally!" **Problems:** Ignores semantic shift (Des. 5 Decomposition Test). Doesn't address current ambiguity, typicality, or harm (Des. 3). Fails Asymmetry (Des. 4 - why does this excuse work for sex but not race?). *Confidence:* Very Low (historically naïve).
  2.  **Generic-Really-Is-Generic Semantics:** "`Man` *technically* includes everyone." **Problems:** Denies actual ambiguity and typicality effects proven experimentally (violates Des. 3 Harm Spec - cognitive exclusion). Fails Asymmetry (Des. 4 - why is the raced 'white' version revolting if it's also 'technically' generic?). Fails Falsifiability (Des. 2 - ignores psychology). *Confidence:* Low (empirically weak).
  3.  **Typical-Member Implicature (Gricean):** "`Man` generically implicates the *typical* member is male." **Strengths:** Explains cognitive effects (Des. 3), potentially explains Asymmetry (Des. 4 - stronger implicature for race?). **Problems:** Hard to turn into a bright-line rule (Des. 1 - is the implicature *always* present? How strong?). Falsifiable (Des. 2 - if no typicality effect found, objection weakens). Needs supplement for expressive harm. *Confidence:* Medium-High (empirically supported), but needs refinement for Des. 1.
  4.  **Causal-Psychology (Sapir-Whorf Lite):** "Sexed defaults *cause* biased cognition." **Strengths:** Directly addresses cognitive harm (Des. 3), Falsifiable (Des. 2 - null effects weaken it). **Problems:** Mixed evidence on *causal* strength. Doesn't cleanly explain Asymmetry (Des. 4). Needs clear triggers for rules (Des. 1 - is *any* association enough?). *Confidence:* Medium (evidence for association is strong, causation debated).
  5.  **Expressive Harm:** "Using the sexed default *expresses* that men are the default/norm, excluding others." **Strengths:** Directly addresses symbolic harm (Des. 3), explains persistence even without measurable cognitive impact. Can inform Bright-Line rules (Des. 1 - terms with a strong male-specific sense are risky generics). **Problems:** Less direct on cognitive effects. Asymmetry (Des. 4) requires explaining why raced expression is *more* harmful (likely tied to power/history). *Confidence:* High (philosophically robust, aligns with social meaning).

  **Overall Synthesis & Confidence:**

  The strongest core rationale combines **Expressive Harm** and **Cognitive Exclusion via Typicality Implicature**. This addresses Des. 3 clearly. Des. 1 (Bright-Line) is met by focusing on terms with a strong, common *specific* sense denoting male adults (triggering both expression and typicality). Des. 5 (Fossils) uses the Decomposition Test. Des. 2 (Falsifiable) is partially met – null cognitive effects *would* weaken the typicality claim, but expressive harm might persist. Des. 6 (Reversal Test) is acknowledged as illustrative, not probative.

  **The Critical Challenge & Least Confidence: Des. 4 (Asymmetry Explanation).** The most plausible explanation is historical/social: race-based defaults often arose in contexts of explicit, violent subjugation and legal exclusion far more recently and explicitly codified than gender defaults. The raced default feels like a direct, unmasked assertion of supremacy, while the sexed default feels like a persistent, often unexamined relic of patriarchy. **Confidence in this explanation:** Medium-Low. It's plausible but historical/cultural comparisons are complex. If societal views shift dramatically, the asymmetry *could* fade, but the core harms (expression, potential exclusion) tied to *any* dominant-group default might remain. **This is the bit I'm least sure of.**

  **Recommendation for Style Guide Rationale:**
  *   **Core Problem:** Sexed defaults (like generic "man", "he") are problematic because they (1) **express the outdated idea that men are the normative human standard**, causing symbolic exclusion, and (2) **often trigger cognitive associations where people picture males more readily**, potentially hindering full inclusion. While meanings evolve, these effects persist for terms retaining a strong male-specific meaning.
  *   **Rule:** Replace generic terms rooted in male-specific nouns/pronouns (man, mankind, he/him/his as generic) with truly generic alternatives (people, humanity, person, they/them/their, he or she). Fossil terms (manhole, man a station) are exempt if their meaning is specific and not decomposable as `man` + `X` by common understanding.
  *   **Rationale for Complaints:** This rule prioritizes clarity, inclusivity, and aligning language with the professional value of equal respect. It avoids relying solely on offense or psychology, focusing on the expressive meaning and potential for cognitive bias inherent in the structure of these defaults. The asymmetry with race reflects different historical contexts but doesn't negate the harm of the sexed default.
