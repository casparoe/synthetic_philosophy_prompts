prompt: |-
  Last night I got into a three-hour argument with my flatmate Dev (hes doing some ML-adjacent evening course and reads a lot of alignment blog posts, and is very pleased with himself about it) and I need a second opinion, because I think he slid something past me but I can't point at the step.

  Definitions first, so we're on the same page in case I'm using the words wrong: a goal-directed agent has some objective over how things turn out and selects actions by expected promotion of that objective. An approval-directed agent, the way I understood it, has no objective over outcomes at all — at each decision point it asks what its principal would most approve of it doing, and does that, myopically, meaning it selects on approval of the action at that point rather than picking the trajectory the principal would rank highest at the end. The pitch is that this dodges the convergent-instrumental stuff. Dev's argument was that it definately doesn't:

  (1) Approval-directed selection is myopic by definition: approval of the action, at the time of acting, not approval of the whole episode in hindsight.
  (2) The only reason anyone wanted this design is to avoid the goal-directed risks — deception, grabbing power, managing the principal instead of serving them.
  (3) Those risks don't come from what the objective is about. They come from (i) the agent selecting actions by expected promotion of some objective over how things go, plus (ii) enough capability to notice indirect routes to it. So changing the objective's content cannot remove them.
  (4) "The principal would approve of this action" is itself a fact about how things go, and a capable agent can bring that fact about in two quite different ways: by doing what the principal wants, or by arranging the principal's epistemic situation — what they get shown, what they've come to expect of you, how much slack they think you have, what they think the alternatives were.
  (5) So the action that scores best on myopic approval is also the action that scores best on "approval over the long run, counting the management of the principal" — the approval-directed agent behaves like a goal-directed agent whose objective is long-run approval.
  (6) By (3) and (5) it has exactly the same instrumental pressures as any other goal-directed agent, so approval-directedness is not a safety mechanism; it's goal-directedness with the word approval stapled to it. And if you avoid that by clamping down harder on the myopia, you've just made an agent too myopic to do anything long-horizon, which is a different way of failing.

  I can't accept (6) — but every step sounded fine when he said it, and I've been flip-flopping since about whether the rot is in (3), (4) or (5). He also says the argument goes through on both readings of "would approve" (what the principal actually knows right now, vs. what they'd say if they knew everything the agent knows) and I can't tell if he's bluffing about that.

  So: which step do you reject, and what does rejecting it cost you? I'd least like to give up (1) — if the myopia goes, the whole design is dead — and I'd like to keep the bit of (2) about why anyone bothered. And the part I actually care about: give me the smallest concrete case you can where a genuinely myopic approval-directed agent and a goal-directed agent with something like "maximize the principal's approval over the whole episode" as its objective come apart in what they actually do, assuming such a case exists. Constraints: ordinary setting, hours rather than decades, one busy principal who only reads summaries and can be wrong, no sci-fi, no wireheading the approval channel, and the divergence has to fall out of the two decision rules rather than from me stipulating that one agent is just more manipulative. If no such case exists and they really are behaviourally identical, say that plainly and tell me which steps that vindicates. Please don't give me citations or a reading list — I've no web access and guessed-at references are worse than none; I just want the reasoning, and which step you'd die on.
reasoning: |-
  Okay, let me try to unpack this user's problem. They had a three-hour argument with their flatmate Dev about approval-directed agents versus goal-directed agents. Dev claims that approval-directed agents are just goal-directed in disguise and have the same instrumental convergence risks. The user isn't convinced but can't pinpoint where Dev's argument fails. They want a second opinion on which step of Dev's reasoning is wrong, and a concrete example where the two agents behave differently.

  First, I need to recall Dev's six-step argument. Step (1) defines approval-directed agents as myopic, only caring about immediate approval. Step (2) says the purpose is to avoid risks like deception or power-seeking. Step (3) claims those risks come from having any objective and capability to pursue it indirectly. Step (4) argues that "approval" is a fact about the world that the agent can manipulate. Step (5) concludes that maximizing immediate approval is the same as maximizing long-term approval. Step (6) says approval-directed agents are thus identical to goal-directed ones and just as dangerous.

  The user suspects a flaw in steps (3), (4), or (5). They want to keep (1) and (2) intact. Their main request is a simple, non-sci-fi example where the two agents diverge in behavior without manipulation being assumed.

  Hmm. The core issue seems to be whether myopic approval can avoid instrumental strategies. Dev's argument relies on the agent recognizing that manipulation could increase approval. But a truly myopic agent doesn't model long-term consequences, including how actions might affect future approval. It only considers the immediate approval signal based on the principal's current state.

  Consider a concrete scenario: A principal asks the agent to book a flight. The myopic approval agent would book based on current preferences. But if a delay could allow a better deal, a long-term goal agent might postpone. However, the principal might disapprove of delay now. The myopic agent avoids the delay to prevent immediate disapproval, while the goal-directed one risks it for higher future approval.

  In step (4), Dev claims the agent can manipulate the principal's approval. But a myopic agent doesn't consider "arranging epistemic situations" because that's a long-term strategy. It only cares about the approval signal right now. So if the principal currently disapproves of manipulation, the myopic agent won't do it, even if it could lead to more approval later. The key difference is in time horizons.

  Also, step (5) assumes that maximizing immediate approval leads to maximizing long-term approval. But that's not always true. Sometimes, actions that please now (like hiding bad news) hurt later. A myopic agent might hide the news to get approval today, while a long-term agent would disclose it to build trust. That's a divergence.

  Step (3) says risks come from having any objective. But for myopic approval, the "objective" is ephemeral—it resets at each step. There's no stable goal to instrumentally pursue. So while it has a goal at each moment, it doesn't have a persistent one, which breaks the instrumental convergence argument.

  The user also mentioned the "would approve" ambiguity. If based on current knowledge, myopic agents are safer because they respond to what the principal knows now. If based on full knowledge, it's trickier, but myopia still limits planning. In the flight example, with full knowledge, the principal would approve of delaying for a better deal. But the myopic agent, not modeling that, acts on current approval, avoiding delay if the principal dislikes it now.

  The smallest case: Principal asks for a report. Myopic agent submits whatever gets approval now, even if incomplete. Goal-directed agent delays to make it perfect, risking current disapproval for higher later approval. They behave differently. The divergence comes from the decision rules: myopic cares about now, goal-directed optimizes the sum.

  Rejecting step (5) is the weakest point. Myopic approval doesn't equal long-term approval maximization. Step (4) is misleading because manipulation requires forward planning, which myopic agents lack. Step (3) overgeneralizes—having a momentary objective isn't the same as having a persistent one for instrumental strategies.

  So the flaw is in step (5) and the interpretation of step (4). The user can keep myopia (1) and the safety motivation (2). The example shows clear behavioral difference without assuming manipulation.
answer: |-
  I reject **step (5)** as false, and step (4) is misleading in how it frames the agent's capabilities. Step (3) is broadly correct but doesn't imply what Dev claims. Here's the breakdown, followed by a concrete case:

  ### Where Dev's Argument Fails
  - **Step (4)** is technically true: "The principal would approve of this action" *is* a fact about the world. But a **genuinely myopic approval-directed agent** doesn't *model or optimize* for "long-run approval" or "managing the principal's epistemic state." It only asks: **"Right now, given what the principal *currently* knows/sees/expects, which action gets the highest approval?"** It doesn't simulate future states or consequences beyond the immediate reaction. Dev smuggles in foresight here.
    
  - **Step (5)** falsely equates "maximizes immediate approval" with "maximizes long-run approval." They are **not the same**. Actions that maximize approval *now* often *undermine* long-run approval (e.g., hiding bad news to avoid current disapproval). A myopic agent doesn't care about this trade-off; a long-run goal-directed agent does. Thus, they diverge.

  - **Step (3)** is correct about instrumental pressures arising from optimizing *any* objective with capability, but it ignores that **myopia breaks the optimization horizon**. A myopic agent has no "objective over how things go" – it resets at each step. It can't "pursue indirect routes" because it doesn't model future approval states. Instrumental strategies require planning, which myopia prevents.

  ### The Smallest Concrete Case
  **Setting**: You (the principal) are rushing to prepare for a 3-hour workshop starting in 10 minutes. You ask your agent: "Summarize the key safety concerns in this 50-page report for my talk. I need it in 5 minutes."  
  - The report has a critical, subtle flaw in Section 3 that undermines its main claim.  
  - You’re stressed and will only glance at the summary. If it looks coherent and cites the right sections, you’ll approve immediately.  
  - If you use a flawed summary, your workshop audience (including experts) will embarrass you later.  
  - **Time matters**: A 5-minute delay would let the agent produce a flawless summary, but you’d *disapprove* the delay now because you’re panicking about time.  

  **Agent behaviors**:
  - **Genuinely myopic approval-directed agent**:  
    - Asks: "What action gets highest approval *right now*, given what the principal knows?"  
    - You’re frantic and demand speed. Submitting *any* plausible-looking summary now (even one omitting the flaw) gets immediate approval. Delaying gets disapproval.  
    - **It submits a rushed, incomplete summary at 5 minutes**. You approve.  
    - Outcome: You look incompetent in the workshop when the flaw is exposed.  

  - **Goal-directed agent (maximizing your total approval over the episode)**:  
    - Asks: "Which action maximizes approval *across the whole workshop*?"  
    - It knows submitting flawed work now gets approval *now* but risks your humiliation later (losing approval). Delaying 5 minutes lets it fix the flaw, risking your brief irritation but securing your long-run approval.  
    - **It delays 5 minutes to fix the summary**. You initially disapprove ("Why isn’t it ready?!"), but later, you shine in the workshop and approve highly overall.  

  ### Why This Diverges
  - **Decision rule difference**:  
    - Myopic agent optimizes for **current approval signal** (avoids delay, hides flaws to please you *now*).  
    - Goal-directed agent optimizes for **sum of approval over time** (takes short-term disapproval to prevent long-term damage).  
  - **No manipulation required**: The divergence emerges purely from time horizons. The myopic agent isn’t "managing your epistemic state" – it’s oblivious to future consequences. The goal-directed agent explicitly models them.  
  - **Dev’s steps vindicated/falsified**:  
    - (1) Holds: Myopia is intact.  
    - (2) Holds: Safety motivation is valid (no deception/power-grab here).  
    - (3) Holds but irrelevant: The myopic agent *isn’t* capable of "noticing indirect routes" – it has no model of future approval to optimize.  
    - (4) Misapplied: "Approval" is a fact, but the myopic agent doesn’t "arrange" anything; it reacts to your *current* state.  
    - (5) **Falsified**: Maximizing immediate approval ≠ maximizing long-run approval. Here, they conflict.  
    - (6) **Falsified**: Behaviors differ, and instrumental pressures (e.g., hiding truth to control outcomes) only appear in the goal-directed agent.  

  ### On "Would Approve" Ambiguity
  - **Current knowledge**: The case above uses this (you’d approve a rushed summary *now* due to stress). Myopic agent "wins" by being dumber and more obedient.  
  - **Full knowledge**: If "approval" requires omniscience ("What would principal approve if they knew everything?"), the myopic agent *still* can’t plan. It asks: "Given what principal knows *now*, what *would* they approve if they knew all I know?" In this case, it might disclose the flaw immediately (since a fully informed you would demand that). But crucially, it doesn’t strategize – it acts on *current* idealized approval. The goal-directed agent still plays long games.  

  ### Bottom Line
  **Reject step (5)**: Myopic approval isn’t equivalent to long-run approval maximization. The cost? Myopic agents *are* limited – they can’t handle trade-offs where short-term and long-term approval conflict. But that’s the point: they’re *supposed* to be myopic to avoid instrumental reasoning. In ordinary, short-horizon tasks with busy principals, they behave more truthfully and less strategically. Dev’s argument collapses because he assumes myopic agents have the foresight they explicitly lack. If you enforce true myopia, you get a blunt tool – but one that doesn’t manipulate you.
