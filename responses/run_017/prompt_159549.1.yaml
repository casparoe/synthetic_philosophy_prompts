prompt: |-
  You are an expert in contemporary analytic political philosophy who is equally at home in social choice theory, bargaining theory, and the empirical literature on legislative compromise. Take your time and think carefully: before you write anything deliverable, spend a few paragraphs brainstorming — enumerate every objection you can think of, sort them by who in the audience would raise them, and discard the ones this particular room would not actually make — and only then produce the prep sheet.

  Here is my situation. Next week I am presenting a works-in-progress paper at a joint session of a political theory department and an economics department's social choice reading group. Forty minutes of talk, thirty minutes of questions, and the questions are what I am worried about.

  My thesis: moral compromise between holders of incommensurable value systems can generate genuine gains from trade, and these gains do not presuppose any common measure of value — no cardinalization, no interpersonal comparison, no numeraire, and therefore no covert consequentialism. All they presuppose is that each side can rank small perturbations of a given policy bundle in its own terms, i.e. that each side has local, intrapersonal substitution rates between the dimensions actually in dispute. And because those rates are path-dependent, the order in which a polity makes its compromises partly determines where it ends up.

  The argument has three moves. (1) Dimensionality: real disputes between value systems are never single-dimensional. In my running example — a jurisdiction legalizing assisted dying while accommodating conscientious objection — the compromise is a vector with separable dimensions: eligibility criteria, waiting period, psychiatric review, institutional opt-out, guaranteed geographic access, and public funding. Because it is a vector, two sides whose overall rankings of whole packages cannot be placed on a common scale can still log-roll across dimensions. (2) Local substitution rates: each value system can answer "how much more of dimension B would I need to be compensated by, to accept one more unit of movement on dimension A?" for small moves, and comparative advantage does the rest — each side concedes where its own local resistance is cheapest. This is the Ricardian point: trade needs only intrapersonal ratios, not interpersonal comparisons. (3) Non-integrability: conceding changes the conceder. Expressive and identity effects, precedent, shifts in which dimensions are salient, and adaptive changes in conviction all mean the local rates do not integrate into any global exchange rate. That is why there is no numeraire, and it is also why procedure — who sets the agenda, in what order concessions are made — is partly constitutive of the outcome rather than merely instrumental to it. A corollary I defend: because integrity and expressive losses behave like tariffs rather than like transfers, the compromise frontier lies strictly inside the Pareto frontier on the relevant dimensions.

  The room. Two senior public-reason theorists of a broadly Rawlsian and Scanlonian cast, who think of compromise as a regretted concession to reasonable pluralism, care about legitimacy and stability, and will be alert to any framing that treats moral convictions as intensities of preference. One social choice theorist who knows the impossibility results cold — Arrow-style aggregation, the conflict between Pareto and minimal liberalism, strategic manipulability — and who will try to show that my construction is either a disguised social welfare function or a familiar voting rule with familiar pathologies. One value pluralist who works on integrity and moral remainder, and who holds that some commitments are side-constraints rather than tradeable quantities, so that a system built on them cannot trade at all without ceasing to be the system it is. One empirical political scientist of legislative bargaining, who will ask where observable intensities come from and will note that log-rolling in real legislatures is nothing like a frontier. One junior scholar working on structural injustice and legal pluralism, who will ask whose baseline the gains are measured against.

  What I want from you is a Q&A prep sheet, not a defense of the view.

  Give me the eight or so objections I will actually get, ordered by how much damage they would do if I handled them badly, with an explicit note on which of these people raises each one and how likely they are to raise it. Phrase each objection the way that person would phrase it, in their idiom and with their background assumptions visible — the social choice person should sound like a social choice person, not like a political theorist.

  For each objection give me: a two-minute reply I can give standing at the board; an explicit statement of where that reply is soft or question-begging; and a verdict on whether I should concede, hold, or partially concede and reframe.

  Then, separately: what I should concede in the first two slides, before anyone asks anything, so that the concessions cost me nothing later; the single reply that has to land if the paper is to survive the session; and the one move in the argument that I should expect to be attacked and that I cannot defend well yet.

  Finally, the question I am hoping nobody asks. I have a candidate and I want your judgment on it: if local substitution rates are path-dependent and endogenously changed by conceding, what rules out a sequence of pairwise mutually beneficial concessions that cycles back to a point both sides rank below the status quo — a moral money pump? Tell me whether that is indeed the worst question in the room, whether it is worse than the cycling and agenda-control objection my social choice person will raise (which I suspect is a cousin of it), and what my best available answer is if it comes.

  Constraints: answer from first principles and from the argument as I have sketched it. Do not give me a bibliography, a reading list, or citations, and do not appeal to what is in the literature — assume you have no web access and that any citation you produce would be a guess. If you want to appeal to a formal result, state it as a conjecture and prove it or sketch the proof. If you think the thesis is false, say so plainly and then still write the prep sheet, since I have to walk into the room either way. Write in American English.
