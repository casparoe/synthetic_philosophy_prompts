answer: |-
  ### Q&A Prep Sheet: Anticipated Objections and Responses  
  **Ordered by potential damage if mishandled** (High → Moderate → Low, accounting for audience influence and likelihood)  

  ---

  #### **1. Objection from the Social Choice Theorist** (Damage: High | Likelihood: Certain)  
  *Phrased in idiom:* "Your 'local substitution rates' sound suspiciously like cardinal utilities. If agents can rank small perturbations, you’re implicitly assuming interpersonal comparability or a hidden numeraire. Otherwise, Arrow’s theorem applies: your 'gains' require aggregation, which is either dictatorial or manipulable. Prove this isn’t just a Borda count with extra steps."  
  - **2-Minute Reply:** "Arrow’s theorem assumes ordinal rankings over *full alternatives*. Here, agents only rank *marginal changes* along specific dimensions *intrapersonally*. No interpersonal comparison is needed because concessions are driven by comparative advantage, not aggregation. For example, if Side A values dimension X highly relative to Y (high local resistance to conceding X), and Side B values Y highly relative to X, they trade concessions where each has lower opportunity cost. This is Ricardian barter, not voting. Path-dependence further blocks Arrow-style aggregation because preferences evolve endogenously."  
  - **Soft Spot:** Doesn’t fully address strategic manipulability (e.g., misrepresenting local rates). Assumes dimensions are separable, which Arrow does not require.  
  - **Verdict:** **Hold**. Emphasize dimensionality and the absence of a social ordering.  

  #### **2. Objection from the Value Pluralist** (Damage: High | Likelihood: High)  
  *Phrased in idiom:* "You reduce moral commitments to 'tradable quantities,' but integrity requires treating certain values as side-constraints (e.g., 'thou shalt not kill'). If a system trades these, it ceases to be itself. Your 'local rates' ignore incommensurability at the core of pluralism—some dimensions *cannot* be perturbed without existential loss."  
  - **2-Minute Reply:** "I agree some commitments *function* as constraints, but even these exist in a policy space with multiple dimensions. In assisted dying, 'conscientious objection' is a dimension allowing opt-outs without forcing participation. Local substitution rates apply only to *negotiable margins* (e.g., waiting periods vs. funding). If a dimension truly has zero substitutability (infinite resistance), it drops out of the bargaining set—but empirically, most disputes involve *graded* trade-offs, not absolutes."  
  - **Soft Spot:** Presupposes constraints are identifiable ex ante; doesn’t resolve whether "existential loss" makes trade impossible.  
  - **Verdict:** **Partially concede + reframe**. Concede that some dimensions may be non-negotiable in theory but argue real-world compromises involve elastic margins.  

  #### **3. Objection from Public-Reason Theorist 1** (Damage: High | Likelihood: High)  
  *Phrased in idiom:* "You frame moral compromise as 'gains from trade,' treating convictions as preferences. But Rawls/Scanlon require reasons acceptable to all. If concessions are based on private substitution rates, not public justification, doesn’t this undermine legitimacy and stability?"  
  - **2-Minute Reply:** "Public reason governs the *framework* for compromise (e.g., which dimensions are on the table), not the concession mechanics. Agents still appeal to public values (e.g., 'autonomy' vs. 'sanctity of life') when ranking dimensions. Stability emerges because both sides prefer the compromise to stalemate, and path-dependence allows learning—repeated interactions can shift what counts as 'acceptable.'"  
  - **Soft Spot:** Doesn’t prove local rates align with public reasons; risks reducing morality to bargaining power.  
  - **Verdict:** **Reframe**. Stress that substitution rates reflect *value-based trade-offs*, not mere preferences.  

  #### **4. Objection from the Empirical Political Scientist** (Damage: Moderate | Likelihood: Certain)  
  *Phrased in idiom:* "Real log-rolling (e.g., U.S. Congress) isn’t about Pareto improvements—it’s driven by partisan agendas, veto players, and pork. Your 'frontier' assumes fixed, honest local rates, but intensities are shaped by elite cues and institutions. Where’s the evidence your model applies?"  
  - **2-Minute Reply:** "Idealized models isolate logic, not reality. But consider cross-party deals like the Affordable Care Act: Medicaid expansion (liberal win) traded against state-level opt-outs (conservative win). Local resistance to opt-outs was lower for liberals than for conservatives on funding—this fits the model. Path-dependence explains why sequencing matters (e.g., SCOTUS rulings changing what’s negotiable)."  
  - **Soft Spot:** Handwaves how "local rates" are observed; ignores coercion/inequality in real bargaining.  
  - **Verdict:** **Partially concede**. Grant that the model abstracts from power asymmetries but insist it captures core incentives.  

  #### **5. Objection from the Junior Scholar** (Damage: Moderate | Likelihood: High)  
  *Phrased in idiom:* "Whose status quo baseline defines 'gains'? If the baseline is unjust (e.g., disabled people excluded from assisted dying debates), your 'mutually beneficial' trade entrenches privilege. This ignores structural injustice."  
  - **2-Minute Reply:** "The baseline is the policy stalemate *given current constraints*, not an ideal. Gains are measured as improvement *for each side from their perspective*—e.g., activists may trade eligibility criteria for funding to benefit marginalized groups. But I concede: the model doesn’t solve deeper injustice. It shows how compromise *within* a flawed system can be non-zero-sum."  
  - **Soft Spot:** Fails to address how the model incorporates excluded groups.  
  - **Verdict:** **Concede + reframe**. Acknowledge the limitation but note the paper focuses on mechanics, not ideal theory.  

  #### **6. Objection from Public-Reason Theorist 2** (Damage: Moderate | Likelihood: Medium)  
  *Phrased in idiom:* "Path-dependence makes outcomes arbitrary. If the compromise depends on agenda-setting, doesn’t this prioritize power over reason? Scanlonian legitimacy requires impartiality."  
  - **2-Minute Reply:** "Procedure isn’t arbitrary—it’s constrained by agents’ evolving local rates. Agenda-setting power matters, but so do the *internal constraints* of each value system. We can design institutions to mitigate power imbalances (e.g., sequential veto protocols), but the point is: there’s no 'neutral' outcome, only procedurally legitimate ones."  
  - **Soft Spot:** Doesn’t reconcile path-dependence with impartiality.  
  - **Verdict:** **Hold**. Argue that legitimacy comes from mutual improvement, not neutrality.  

  #### **7. Objection from Social Choice Theorist (Follow-Up)** (Damage: Low | Likelihood: Medium)  
  *Phrased in idiom:* "Path-dependence implies cycling. If substitution rates change endogenously, what stops a sequence of concessions from returning to a dominated status quo? This is a money pump."  
  - **2-Minute Reply:** "Cycling requires reversibility of preferences, but path-dependence is directional. Conceding on dimension X may raise resistance to future concessions on X (e.g., due to identity erosion), creating hysteresis. Once a trade occurs, the system ‘locks in’ to a new state. Money pumps assume stable preferences—here, preferences adapt irreversibly."  
  - **Soft Spot:** No formal proof of hysteresis; handwavy.  
  - **Verdict:** **Hold + sketch proof**. Conjecture: if resistance functions are monotonic in cumulative concessions (e.g., ∫concessions on X d(resistance) > 0), cycles are impossible.  

  #### **8. Objection from Value Pluralist (Follow-Up)** (Damage: Low | Likelihood: Low)  
  *Phrased in idiom:* "Even 'small' trades can corrode integrity. If I accept a slightly shorter waiting period for assisted dying to get funding, I’ve normalized a logic of commodification. How is this not slippery-slope erosion?"  
  - **2-Minute Reply:** "This is why the compromise frontier is *inside* the Pareto frontier—integrity losses act like tariffs. Agents factor in corrosion costs via high resistance to certain trades. But erosion isn’t inevitable: systems can 'quarantine' dimensions (e.g., religious exemptions) to protect core commitments."  
  - **Soft Spot:** Doesn’t guarantee quarantining works.  
  - **Verdict:** **Reframe**. Argue that refusing all trade risks irrelevance, not purity.  

  ---

  ### Strategic Pre-Emptions:  
  **Concessions in First Two Slides (Cost-Nothing):**  
  - "This model assumes good-faith actors with coherent value systems—it doesn’t address coercion or deep injustice."  
  - "Some dimensions may function as absolute constraints in practice, though I argue they’re rare in real policy bundles."  

  **The Reply That Must Land (Paper Survival):**  
  When challenged on cardinalization: "**Trade requires only intrapersonal ordinal comparisons of small changes—no interpersonal units, no global ordering. It’s barter, not utilitarianism.**" (Aim this at the social choice theorist.)  

  **Most Vulnerable Point (Expect Attack; Weak Defense):**  
  **Local substitution rates for all dimensions**. The value pluralist will argue some values are lexically ordered (no trade possible). Best weak defense: "Even lexical priorities have *procedural* trade-offs (e.g., *when* to invoke them), but I grant this needs more work."  

  ---

  ### The Worst Question: Moral Money Pump  
  **Question:** "If local rates are path-dependent, what rules out mutually beneficial concessions cycling back below the status quo? E.g., Side A trades X for Y, rates adapt, then trades Y for Z, and so on until both prefer the original stalemate. Isn’t this a moral money pump?"  
  - **Is It the Worst?** Yes—worse than the social choice cycling objection. The latter assumes fixed preferences; this exploits adaptive preferences to show *gains* are illusory.  
  - **Best Available Answer:**  
    "Cycling requires: (1) Reversible preference adaptation, and (2) No net cost to concession sequences. But path-dependence implies irreversibility—conceding changes identity, making return costly. In the assisted dying example, if advocates concede on 'psychiatric review' (making it stricter), their movement may shift focus to 'access,' *raising* resistance to future concessions on review. Each trade leaves a residue that blocks backtracking. Formally: if resistance functions are path-integrated (∮dR ≠ 0), cycles are forbidden. This isn’t frictionless trade; it’s trench warfare."  
  - **If Pressed:** Conjecture that integrity losses increase marginal resistance asymmetrically, creating a ratchet effect.  

  ---  
  **Final Note:** Your thesis is defensible but exposed on lexical priorities and cycling. Prioritize clarity on the "barter not aggregation" point—it’s the keystone. If the money pump question arises, lean hard on hysteresis ("concessions scar"). Good luck.
