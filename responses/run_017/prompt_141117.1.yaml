prompt: |-
  My friend Dani has been doing refugee status determinations for something like six years, and over beers she's walked me through maybe ten of her cases with the names changed. I've been trying to reverse-engineer the rule she's actually running, and I've got a new case I want to run past her but I'd rather not embarrass myself.

  Her decisions so far:

  - Granted: a journalist who'd been jailed twice and then started getting death threats from the police after publishing a story about a governor's contracts.
  - Denied: a guy fleeing extortion by gangs in a country that isn't at war, where the cops are useless and on the take but aren't in on it and aren't picking on him in particular.
  - Granted: a woman whose husband broke her arm twice and who the police wouldn't help even after she had a protection order.
  - Granted: a conscript who deserted rather than take part in massacres of civilians. There's no alternative service in his country and desertion gets you years in prison.
  - Denied: a man who left rather than be drafted into an army that was defending the country against an invasion nobody thinks was provoked.
  - Denied: a farmer whose crops had failed four years running and whose kids were malnourished. The government is crooked and what relief there is goes to the region that votes the right way, which isn't his.
  - Granted: a gay man in a country where being gay is legal, beaten up twice, where the police just systematically don't investigate attacks on gay men.
  - Denied: a family from a region where the state has basically collapsed and the famine is half drought and half both armies torching fields. Nobody wants them dead in particular.
  - Denied: a man who could have moved to another province of his own country and been fine and just never did — what she calls the "internal flight alternative."
  - Granted: a family that came through a country where they'd have had papers and been physically safe but no right to work, no school for the kids, no family and no language. She said we still owe them.

  Two things she says a lot: "asylum isn't a welfare program" and "I don't get to pick who shows up." Those pull in different directions and she seems not to notice.

  The new case: Rupa is fifty-seven, a widow, with a spinal injury from a fall; she can do maybe ten steps with a frame. Her country has no disability benefit, no welfare system, no anti-discrimination law — but also no law against her, and no official has ever done anything to her. Her brother controls her dead husband's pension and keeps her in one room; the neighbors think this is normal; nobody is threatening her and nobody is stopping her. If she stays she spends the rest of her life in that room. A church group in Columbus raised money, flew her over on a medical visa, and she claimed asylum two weeks after she got here. Her own government didn't try to stop her leaving and doesn't want her back. There are probably a few million people in her country in roughly her position.

  So: grant or deny? Give me the two or three rules that fit all ten of her earlier verdicts and that come apart on Rupa, tell me which one you think she's actually running and why, and tell me whether number six and number ten look wierd sitting next to each other or whether I'm missing the difference between them. Then give me the one case I should ask her about next that would separate the candidates cleanly. And if she grants, does her own track record give her any way to stop at Rupa, or does she owe a hearing to a few million people — and does it matter that the church flew her in, or did the church just volunteer as the one who has to take her?
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex asylum adjudication puzzle that requires analyzing ten precedent cases to reverse-engineer their friend Dani's decision-making framework, then applying it to a new case (Rupa). 

  First, I need to identify patterns across the granted/denied cases. The journalist (granted) faced state persecution (jailing, death threats), while the gang victim (denied) experienced non-state violence without state involvement. The domestic violence survivor (granted) had state complicity via police inaction despite protection orders, whereas the famine-struck family (denied) suffered generalized collapse without targeted harm. 

  Key distinctions emerge: 
  1. Agency of harm: State actors vs non-state actors without state involvement 
  2. Targeting: Personalized persecution vs generalized conditions 
  3. State responsibility: Willing/unable vs unwilling/complicit 
  4. Alternatives: Availability of internal relocation 

  The conscript cases highlight this - deserting war crimes (granted) vs defending against unprovoked invasion (denied). Similarly, the gay man (granted) had state-enabled systemic violence despite legal status, while the farmer (denied) faced corrupt but non-persecutory resource allocation. 

  Rupa's case sits uncomfortably here. Her suffering stems from: 
  - Non-state actor (brother) 
  - Generalized societal ableism 
  - State inaction but no active persecution 
  - No internal flight alternative due to disability 

  The most consistent framework appears to be: persecution must involve state action (direct or complicit) OR non-state actors the state is unwilling/unable to control, targeting the applicant specifically. Economic hardship alone doesn't qualify unless tied to protected grounds with state involvement. 

  The apparent tension between cases 6 (denied famine victim) and 10 (granted transit country) resolves when considering the "meaningful protection" standard - safety without rights (work/education) may still warrant asylum. 

  To test this, I'd propose a hypothetical: "A dissident faces imprisonment but could safely relocate to a rural area without surveillance. However, their chronic illness requires urban medical care unavailable there." This pits internal flight alternatives against practical accessibility. 

  If Dani grants Rupa, it risks opening floodgates to economic migrants - but her track record suggests she'd deny, as Rupa lacks both state persecution and viable internal alternatives due to disability. The church's involvement shouldn't affect the legal determination, though it may create moral pressure.
answer: |-
  Based on Dani's ten cases and her stated principles, here's the reverse-engineered rule, the analysis for Rupa, and the key distinctions:

  **The Core Rules Governing Dani's Decisions (Fitting All 10 Cases):**

  1.  **Persecution Requirement:** Harm must rise to the level of *persecution* (serious harm/threat) based on a protected ground (race, religion, nationality, political opinion, particular social group) OR constitute a "refoulement" risk under Convention Against Torture/CAT (like the deserting conscript).
  2.  **State Nexus OR Failure of State Protection:**
      *   **A.** The persecution is *directly inflicted by state actors* (e.g., police death threats, jailing journalist, conscripting into war crimes, denying protection order enforcement).
      *   **OR B.** The persecution is inflicted by non-state actors (e.g., gangs, abusive husband, homophobic attackers), *and the state is unwilling or unable to provide protection* (e.g., police corruption/inaction, systemic non-investigation of attacks on gay men).
  3.  **No Viable Internal Flight Alternative (IFA):** There is no safe place *within the applicant's own country* where they can reasonably relocate to avoid the persecution (e.g., the man who could move provinces denied; transit country hardship granted because original country wasn't safe).

  **Rupa's Case: Grant or Deny?**

  *   **Deny.** Applying the rules:
      *   **Persecution?** Her situation (confinement, poverty, lack of care) is severe suffering, but it's primarily due to familial neglect/control and societal attitudes, *not* persecution based on a protected ground. Disability *can* be a particular social group (PSG), but the harm isn't *because* she's disabled; it's due to her brother's actions and lack of state welfare. The state isn't *targeting* disabled people. It's systemic neglect, not persecution.
      *   **State Nexus/Failure of Protection?** The state isn't actively harming her ("no official has ever done anything to her"). Is the state *unwilling/unable* to protect her from her brother? While the state fails to provide social support, there's no indication her brother's actions (controlling the pension, confining her) are illegal *or* that the state *wouldn't* intervene if she reported illegal confinement or theft (though access to justice might be difficult). The neighbors' attitude isn't state action. The harm stems from lack of state capacity/welfare, not state refusal to protect her from a persecutor.
      *   **Internal Flight Alternative?** While her disability makes relocation *extremely difficult*, the rule focuses on whether it's *objectively unreasonable*. The denial isn't primarily because relocation is impossible, but because the core persecution and state nexus elements are missing. The state's failure is generalized, not targeted.

  **Which Rule is Dani Actually Running?**

  Dani is running a strict interpretation of the **State Nexus/Failure of Protection rule (Rule 2)** combined with a **targeted persecution requirement within Rule 1**. Her focus is on identifying *who* is responsible for the harm and whether the state is either the perpetrator or complicit through refusal to protect against persecutors targeting the applicant for a Convention reason.

  *   **Why Rule 2 is Key:** This resolves the tension between "asylum isn't welfare" and "I don't get to pick." She denies cases where the harm is solely due to generalized conditions (famine, poverty, gang violence in failed states) *unless* the state is actively involved or refusing protection *specifically related to persecutory acts*. She grants when the state is the agent of harm (journalist, conscript) or when non-state actors persecute and the state *specifically refuses protection related to that persecution* (abused woman, gay man). The transit country case (10) is an exception proving the IFA rule, not a weakening of the persecution/nexus requirement.

  **Case 6 (Denied Farmer) vs. Case 10 (Granted Transit Country): Are They Weird Together?**

  *   **No, they are consistent under the rules.** The difference is crucial:
      *   **Case 6 (Farmer):** Denied because the harm (famine) was generalized, caused by natural disaster and conflict *plus* corrupt but *non-persecutory* resource allocation (favouring a voting region). The state wasn't *targeting* the farmer or his social group for persecution; its failure was broad-based corruption and incompetence, not refusal to protect him from a persecutor. It fits "asylum isn't welfare."
      *   **Case 10 (Transit Country):** Granted *not* because the transit country conditions constituted persecution *in themselves*, but because the *original country was unsafe* (met Rules 1 & 2), and the *transit country was not a viable Internal Flight Alternative (Rule 3)*. The lack of work, education, and integration prospects made it unreasonable to expect them to stay there. The "protection" offered was only physical safety, not meaningful refuge. This fits "I don't get to pick who shows up" – the original claim was valid, and the usual escape route wasn't actually safe/durable.

  **The Case to Ask Next (To Separate Candidates):**

  Propose this hypothetical: **"A member of an ethnic minority faces severe, localized discrimination and violence from non-state militias in their home region. The central government condemns the violence but lacks effective control over the region and cannot stop the militias. However, the government *could* and *would* protect this person if they relocated to the capital city, where their ethnic group lives safely in large numbers. The person refuses to relocate because they would lose their ancestral land and cultural connection."**

  *   **Why it separates candidates:**
      *   **If Dani Denies:** She prioritizes the **Internal Flight Alternative (Rule 3)** strictly. If a safe internal relocation exists, even with significant hardship (losing land/culture), the claim fails. This aligns with strict adherence to the IFA doctrine.
      *   **If Dani Grants:** She finds the IFA **unreasonable** due to the severity of the hardship (forced abandonment of core cultural identity/land), implying a broader view of "reasonableness" within Rule 3. This suggests she weighs the *quality* of safety in the IFA more heavily.

  **If Dani Grants Rupa:**

  1.  **Stopping at Rupa?** Her track record provides **no clear way** to stop at Rupa if she grants based on disability + systemic neglect. If disability is a PSG and generalized state neglect of disabled people constitutes persecution/failure of protection *for that group*, then millions could potentially qualify. Her previous denials of generalized harm (cases 2, 6, 8) strongly suggest she *wouldn't* grant Rupa, as it would fundamentally contradict her pattern.
  2.  **Does the Church Matter?** The church's involvement **should not legally matter** for the asylum claim's merits. Asylum is based on fear of persecution in the home country, not how the applicant arrived or who helped them. Legally, the church "volunteering" doesn't create an obligation for Dani to grant. *Practically*, it might create moral/political pressure, but Dani's track record suggests she follows the legal rules strictly.

  **Conclusion:** Based on the reverse-engineered rules from Dani's ten cases, **Rupa should be denied asylum**. Her situation, while tragic and stemming from state failure, lacks the required elements of persecution based on a protected ground *with* a state nexus or failure of state protection against persecutory harm. The harm is generalized neglect, not targeted persecution. Granting Rupa would be inconsistent with the denials in cases 2 (gang extortion), 6 (famine/corruption), and 8 (generalized conflict/famine). The church's role is irrelevant to the legal determination. Dani's track record strongly suggests she would deny. The case to ask next focuses on the reasonableness of the Internal Flight Alternative.
