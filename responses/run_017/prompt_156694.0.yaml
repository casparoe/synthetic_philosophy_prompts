  ### Activity Design: Family Resemblance Chain Experiment

  #### **Setup**
  1. **Materials**:  
     - Index cards (20+), projector  
     - **Shapes**: Create 12 abstract shapes (e.g., geometric forms with varying colors/patterns). Label them **A1, A2, A3, B1, B2, C1, C2, C3, D1, D2, E1, E2** (see diagram below).  
     - **Projector**: Display shapes during training/testing.

  2. **Groups**:  
     - Split the class into **Group Left** (trained on Set A) and **Group Right** (trained on Set B).  
     - **Set A** (Group Left): A1–A3 (core), B1–B2 (bridge), C1–C2 (overlap start).  
     - **Set B** (Group Right): C1–C2 (overlap end), D1–D2 (bridge), E1–E2 (core).  
     - **Key**: Shapes **C1–C2** are the *only overlap*. No shape is common to both cores.  

  3. **Chain Structure**:  
     ```
     Group Left's Training: [A1 → A2 → A3] → [B1 → B2] → [C1 → C2]  
     Group Right's Training: [C1 → C2] → [D1 → D2] → [E1 → E2]  
     ```  
     - **Resemblance Logic**:  
       - A1 resembles A2 (e.g., same color), A2 resembles A3 (e.g., same shape), A3 resembles B1 (e.g., pattern), etc.  
       - **No shared features** between A1–A3 and E1–E2.  

  ---

  #### **Activity Flow** (Total: 45 minutes)
  1. **Training Phase** (15 minutes):  
     - **Rules**:  
       - Groups can only ask the facilitator: *“Is [shape] in the category?”*  
       - Facilitator responds **only with “Yes” or “No”**. No definitions, rules, or explanations.  
       - Groups record answers on index cards.  
     - **Process**:  
       - Each group tests their **own set** (Group Left: A1–C2; Group Right: C1–E2).  
       - *Example*: Group Left tests A1 → “Yes”; A2 → “Yes”; E1 → “No”.  

  2. **Testing Phase** (15 minutes):  
     - **Test Shapes**: Project **5 new shapes**: [A1, B2, C1, D2, E2].  
     - **Task**: Groups independently vote **In/Out** for each shape using index cards (green=In, red=Out).  
     - **Facilitator Records**: Display a table:  
       | Shape | Group Left | Group Right |  
       |-------|------------|-------------|  
       | A1    | ✅         | ❌          |  
       | B2    | ✅         | ❌          |  
       | C1    | ✅         | ✅          |  
       | D2    | ❌         | ✅          |  
       | E2    | ❌         | ✅          |  

  3. **Judgment Phase** (10 minutes):  
     - **Untrained Judge**: One student (never trained) answers:  
       > *“Did Group Left and Group Right play the **same game**? Bet your points on Yes or No.”*  
     - **Payoff Scheme** (No money needed):  
       - Groups start with **10 points** (index cards = 1 point each).  
       - **Agreement Payoff**: For each test shape:  
         - If both groups agree (✅✅ or ❌❌), each gains 1 point.  
         - If they disagree, each loses 1 point.  
       - **Judge’s Bet**: Judge starts with **5 points**. They bet 0–5 points on their answer.  
         - Correct bet → **double the bet** (e.g., bet 3 → +3 points).  
         - Wrong bet → **lose the bet**.  

  ---

  #### **Debrief** (30 minutes)
  1. **Map to Wittgenstein**:  
     - **Chain Resemblance**:  
       - Groups agreed on **C1–C2** (overlap) but diverged at ends (**A1** vs. **E2**).  
       - Emphasize: *No shared core*—only a chain of overlapping features.  
     - **Rule-Making Failure**:  
       - If groups tried to "negotiate" a rule during testing, highlight: *“Did your definition collapse when new cases appeared?”*  
     - **Subjectivity Trap**:  
       - If students say *“It’s all arbitrary,”* ask: *“Why did both groups accept C1? Was it random or based on training?”*  

  2. **Predictable Issues**:  
     - **Smuggled Definitions**:  
       - E.g., a student says, *“It’s about shapes with edges!”* → Reply: *“But did your rule cover A1 and E2? Why did your group disagree?”*  
     - **Compromise Rules**:  
       - If groups created a hybrid rule (e.g., *“Anything with curves”*), show how **B2** (curves) was rejected by Group Right.  
     - **Misinterpreted Subjectivity**:  
       - Clarify: *“Your answers weren’t subjective—they were trained. But the category has no fixed essence.”*  

  3. **Limitations of the Activity**:  
     - **Missing Dimension**: The activity shows a **linear chain**, but Wittgenstein’s resemblance is a **web** (e.g., games share rules, competition, skill—not one thread).  
       - **Supply This**: *“Family resemblances are like a rope with overlapping fibers—no single fiber runs the whole length.”*  
     - **Real-World Context**:  
       - *“This was abstract—but in life, categories are rooted in practice. We learn ‘game’ by playing, not just examples.”*  

  ---

  #### **Why This Works**  
  - **Feels the Lack of Definition**: Groups experience frustration when their "rules" fail at the chain ends.  
  - **Payoff Motivates**: Points create stakes without money—disagreements directly reduce scores.  
  - **Judge’s Role**: Forces the class to confront if two practices can be "the same" without shared boundaries.  

  **Outcome**: Students leave feeling that definitions are *impossible to fix*, not just "fuzzy."
