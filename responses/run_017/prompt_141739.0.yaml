  First, I need to unpack what the user is describing. They're observing a counterargument to "great man" theories or deterministic historical narratives. The three grades they've outlined show increasing levels of abstraction: from near-term substitutability to eventual inevitability to categorical inevitability. They're also noting that this argument seems only applied to outcomes that actually occurred, creating a selection bias.

  The user mentioned their friend suggested "path dependence," but correctly notes that this actually describes the opposite phenomenon - where early events lock in specific paths. That's insightful. I need to provide alternatives that better match their described pattern.

  For terminology, I recall several relevant concepts:
