answer: |-
  ### Primitives Mapping Brainstorm
  **Epistemic Game Theory Primitives**  
  - *Belief*: Probability distribution over opponents' strategies (joint or independent).  
  - *Rationality*: Playing a best response to one's belief.  
  - *Best Response*: Strategy maximizing expected payoff given belief.  
  - *Strictly Dominated by Mixture*: Strategy outperformed by a mixed strategy against **all** opponent profiles.  
  - *Never a Best Response*: No belief (correlated or independent) makes it optimal.  
  - *Iterated Elimination*: Stepwise removal of dominated strategies.  
  - *Common Belief in Rationality (CBR)*: Infinite hierarchy: "I believe you're rational, you believe I believe you're rational, ..."  

  **MARL Primitives**  
  - *Policy*: Agent's behavior strategy (stochastic).  
  - *Joint Policy*: Tuple of all agents' policies.  
  - *Opponent Model*: Latent embedding predicting opponents' actions.  
  - *Best Response/Exploitability*: Best achievable reward against a policy/population; metric for vulnerability.  
  - *Population*: Set of policies for training (e.g., League, PSRO).  
  - *Training Distribution*: Distribution over opponents during training.  
  - *Correlation Device*: Shared randomness (e.g., for correlated equilibria).  

  **Candidate Matches**  
  - Belief ⇔ Opponent model (but opponent model often lacks explicit probability distribution).  
  - Rationality ⇔ Best response (direct match, but MARL uses approximate best responses).  
  - Strictly dominated by mixture ⇔ Never a best response (theorems prove equivalence).  
  - Iterated elimination ⇔ PSRO-like removal (but PSRO adds strategies; not direct deletion).  
  - Common belief in rationality ⇔ **No clean match** (MARL has no belief hierarchy).  
  - Best response (game theory) ⇔ Exploitability calculation (similar, but MARL measures vulnerability).  

  **Mismatches**  
  - Belief hierarchies (CBR) have no MARL counterpart.  
  - Independent vs. correlated beliefs: MARL opponent models often assume independence implicitly.  
  - Exact rationality vs. approximate best responses: MARL violates exactness.  
  - Strategy elimination: MARL rarely deletes policies; populations grow or are pruned heuristically.  

  ---

  ### Restated Argument in MARL Terms  
  **(a) Round 0 (Rationality Alone)**  
  - If a policy is strictly dominated by a mixture of your own policies, it is **never** a best response to **any** opponent model—even correlated or adversarial ones.  
  - *MARL translation*: Such a policy has negative relative value against every joint policy in the game. Delete it immediately; no rational agent would use it regardless of their opponent model.  

  **(b) Each Round k (k Levels of Mutual Belief)**  
  - After deleting dominated policies, restrict the game to surviving policies.  
  - A policy now dominated in this restricted game can only be played if:  
    - You believe opponents play within the restricted set (i.e., you believe they are rational),  
    - They believe you believe this (i.e., they are rational *and* believe you are rational),  
    - ... up to k levels.  
  - *MARL translation*: Each round corresponds to training against a **restricted population** of opponents that survived prior deletion rounds. A policy deleted at round k is suboptimal against all opponent models that assign zero mass to deleted policies.  

  **(c) Fixed Point (Common Belief in Rationality)**  
  - The surviving policies are those playable when:  
    - All agents are rational,  
    - All assign zero probability to deleted policies in their opponent models,  
    - This is common belief (infinite regress).  
  - *MARL translation*: The final set is the minimal population closed under best responses: if you train against this population, your best responses stay within it.  

