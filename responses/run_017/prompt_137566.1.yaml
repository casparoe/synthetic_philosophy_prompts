  ### Residue Report  
  **Your 3-Player Example: Key Insight**  
  - `anti` survives iterated elimination because it *is* a best response to a **correlated belief** (50% `(u,r)`, 50% `(d,l)`).  
  - Against **independent beliefs** (product distributions), `anti` is *always* beaten:  
    - If `Pr(u) = q`, `Pr(l) = r`:  
      - `anti` payoff = `q(1−r) + (1−q)r`  
      - `match`, `hard-ur`, `hard-dl`, or `safe` always yield > `anti` (e.g., `safe` dominates when `q(1−r) + (1−q)r < 0.5`, `hard-ur` when `q(1−r) > 0.6`, etc.).  
  - **Crucial**: Mixed-dominance iterated elimination **assumes agents hold correlated beliefs** about opponents. It does not require independence.  

  #### Translation Fidelity  
  | Game Theory Concept           | MARL Translation                           | Fidelity                          |  
  |-------------------------------|-------------------------------------------|-----------------------------------|  
  | Strictly dominated by mixture | Never a best response to any OM           | ✅ Clean (theorem equivalence) |  
  | Round-k elimination           | Best response to restricted population    | ⚠️ Distorted (MARL adds, not deletes) |  
  | Common belief in rationality  | Fixed-point population                    | ❌ No match (no belief hierarchy) |  

  #### Key Conclusions  
  1. **Mixed-dominance ≈ Correlated Beliefs**:  
     - Iterated elimination **requires** correlated beliefs to justify deletions. Your example proves this: `anti` survives because correlated beliefs exist where it is optimal.  
     - **Independent-belief deletion** would require a distinct procedure: remove policies never best response to *product* distributions. This would delete `anti` but is **not** equivalent to standard iterated elimination.  

  2. **Belief Hierarchies Are Load-Bearing (But Approximable)**:  
     - The infinite regress ("I believe you believe...") ensures consistency across deletion rounds. MARL has **no direct equivalent**—populations and opponent models don’t encode mutual belief hierarchies.  
     - *Why you might not care*: In practice, PSRO/NFGs approximate a fixed point by iteratively adding best responses to a meta-strategy. This sidesteps explicit hierarchies but converges to Nash (a subset of correlated rationalizable strategies).  

  3. **Approximation Survival**:  
     - **Exact optimality is load-bearing**: The equivalence "dominated ⇔ never BR" breaks with ε-optimality. A policy ε-dominated might be played, and deletion rounds may leak "irrational" policies.  
     - *Practical mitigation*: Use a dominance margin threshold (delete if dominated by >δ). In your setup, non-stationarity and population training provide *implicit* deletion (low-performing policies decay).  

  ---

  ### Recommendations for Your Framework  
  1. **Correlated vs. Independent Beliefs**:  
     - If agents use **independent** opponent models (e.g., factorized policies), adopt independent-belief rationalizability. `anti` would be deleted.  
     - If opponent models allow **correlation** (e.g., shared latent embedding), iterated elimination is justified. `anti` survives.  

  2. **Belief Hierarchies**:  
     - Not critical if targeting Nash equilibria (PSRO already does this).  
     - **But**: If agents must reason about *nested* opponent rationality (e.g., in coordination games), explicitly model belief hierarchies (e.g., via meta-learning or belief propagation).  

  3. **Approximate Domination**:  
     - Monitor exploitability with a dominance margin:  
       ```python  
       is_dominated = (V(π_dom, opponent) - V(π_candidate, opponent) > δ for all opponent)  
       ```  
     - In training, prune policies with consistently negative advantage against population mixtures.  

  **Final Verdict**: Your example correctly exposes the correlated-belief assumption. The belief hierarchy is theoretically significant but often approximated in practice. For MARL, focus on explicit belief factorization (independent vs. correlated) and dominance margins—this covers 90% of the epistemic insight without regress.
