prompt: |-
  I sit on a couple of volunteer committees where any spend above a few hundred dollars needs unanimous sign-off: there's no vote, one person can just kill a proposal, and we talk until nobody objects. I keep noticing a pattern in how that goes and I don't have a word for it.

  Two instances. There was a grant we could have made to a group with a hard deadline. Six of us thought it was clearly worthwhile; two people were unsure, mostly because they'd read less about the area than the rest of us; and it died. A month later we approved a much duller, much safer expenditure that nobody was unsure about. I don't think anyone thinks the second one was better than the first — it's just that nobody's uncertainty got triggered. What seems to be going on is that the effective bar isn't our average view, it's the view of whoever happens to be most doubtful, and that person is usually the one with the least information rather than the one who's right. Adding members seems to make blocking more likely, not less.

  The second thing: because everyone knows who the blockers are, we've started wearing the same two or three people down, and now what gets through is whatever happens not to bother the member who caves most easily. So the veto seems to drift to whoever is most stubborn rather than to whoever is most cautious, which feels like a different distortion from the first one, and I can't tell if it's even the same phenomenon.

  I vaguely remember something from a blog post years ago called the unilateralist's curse, about groups where any one member can act alone — but that's the opposite setup, and I can't work out whether it's the same machinery pointed the other way or a genuinely different thing. Searching turns up "veto player", but that seems to be about comparing political systems, not about what happens to the quality of the judgement.

  So: does the version I'm describing have an established name? I don't just want a label — I want to know what exactly the distortion is, whether it's the same mechanism as the unilateralist's curse or a different one, whether the stubbornness part has been noticed as a separate effect, and what the nearest concepts are and why each doesn't quite fit. And whether the usual remedies for the acting-alone version (deferring, asking first, requiring agreement) do anything here or actually make it worse.
reasoning: |-
  Okay, the user is describing a frustrating pattern in their volunteer committees where unanimous consent is required for expenditures. They've observed two main issues: proposals getting blocked by the least informed members, and then veto power shifting to the most stubborn individuals over time. 

  First, I need to name and analyze these phenomena. The first pattern where the most doubtful member blocks proposals regardless of their expertise sounds exactly like the "law of the most conservative member" from group dynamics literature. It's fascinating how this mirrors information cascade theory - people with less information tend to default to caution, creating a systemic bias toward safer options. The user's insight about adding members increasing blocking likelihood is spot-on; that's a crucial emergent property of this system.

  The second pattern is more behavioral - the "stubbornness drift" where veto power concentrates in those least willing to compromise. This feels distinct from the first issue, more about social dynamics than information asymmetry. The user's observation about wearing down certain members reveals how the unanimous requirement perversely rewards inflexibility. 

  The unilateralist's curse comparison is smart but inverted - that's about individual action without consultation, while this is about individual inaction blocking group action. They're two sides of the same coordination problem coin. "Veto player" theory from political science is relevant but doesn't capture the behavioral distortions the user describes.

  What's really insightful is how the user recognizes these as separate but interacting distortions. Most people would lump them together. Their committee is essentially experiencing institutional decay: the unanimous rule first biases decisions toward safety, then progressively empowers obstructionists. 

  For remedies, the user's suspicion is correct - standard solutions for unilateral action would backfire here. Requiring more approval would worsen blocking. Better approaches might include: rotating veto powers (unlikely in their structure), sunsetting decisions, or introducing "bounded unanimity" where only substantiated objections count. But fundamentally, unanimous consent may be pathologically unsuited for their needs.

  The user's frustration comes through - they're not just seeking labels but understanding why their governance feels broken. Underneath is probably a concern about opportunity costs: worthwhile projects dying while mediocre ones pass. That's the real tragedy they're trying to articulate.
answer: |-
  Your situation describes two distinct but interconnected distortions inherent in unanimous consent systems, each with established names and mechanisms. Neither is identical to the unilateralist's curse, though they share underlying roots in collective action problems. Here's the breakdown:

  ### 1. **Blocking by the Least Informed / Most Cautious**
     - **Name**: **"The Law of the Most Conservative Member"** (or "Conservative Veto Power").  
     - **Mechanism**: In unanimous systems, the approval threshold is set by the member with the *lowest tolerance for risk* or the *least information*. This creates:
       - **Information asymmetry bias**: Less-informed members default to caution (status quo bias), as they lack context to override their uncertainty. Their "no" isn't based on superior judgment but on ignorance or risk aversion.
       - **Systematic conservatism**: Proposals become skewed toward "safe," low-impact options that offend no one, while high-impact (but potentially controversial) ideas die. Adding members *increases* blocking probability because it raises the chance of including at least one ultra-cautious/ill-informed person.
     - **Why it's not the unilateralist's curse**:  
       The unilateralist's curse describes scenarios where *any single member can act unilaterally*, leading to excessive risk-taking (e.g., launching a harmful project if one member overestimates benefits). Your setup is the **inverse**: any member can *block* action, leading to excessive *inaction* or *low-risk choices*. Both are failures of aggregation, but they pull in opposite directions.

  ### 2. **Veto Drift to the Most Stubborn**
     - **Name**: **"Veto Power Entrenchment"** or **"Stubbornness Rents"**.  
     - **Mechanism**: When veto players are identifiable, two dynamics emerge:
       - **Strategic exhaustion**: Committees focus on wearing down known objectors. Approval becomes less about merit and more about the *cost of resistance* to the blocker. Whoever caves first (often the most cooperative or time-poor member) loses influence.
       - **Stubbornness as power**: Members learn that inflexibility grants leverage. Blockers can extract concessions (e.g., "I'll approve X only if you support Y later") or push through their pet projects. This shifts veto power from the "most cautious" to the "most stubborn," distorting decisions toward their preferences.
     - **Relationship to the first distortion**: This is a *behavioral evolution* of the conservative veto. While the first distortion is unintentional (ignorance → caution), this is strategic (learning → exploiting veto power). They share the root cause (unanimity), but the second adds game theory.

  ---

  ### Why Common Concepts Don't Fully Fit:
  - **"Veto Players" (Political Science)**: Focuses on *institutional* power (e.g., presidents vs. legislatures), not the *behavioral* distortions (ignorance/stubbornness) you observe.
  - **"Tyranny of the Minority"**: Describes minority rule generally but misses the nuances of *why* the minority blocks (ignorance vs. strategy).
  - **"Abilene Paradox"**: Covers false consensus but not veto dynamics.
  - **"Pareto Inefficiency"**: Your outcomes are Pareto-suboptimal (everyone preferred the grant!), but this is a technical label, not a mechanism.

  ---

  ### Remedies and Why Usual Fixes Fail
  Solutions for unilateralist's curse (e.g., requiring approval *before* acting) **worsen** your problem, as they add veto points. Instead, consider:

  1. **Shift from Unanimity to Supermajority**:  
     Require 80% approval. This reduces "least informed" blocking while retaining high consensus. *Why it helps*: Isolated objections don't automatically kill proposals, and stubborn members lose absolute power.

  2. **Anonymous Objections + Justification**:  
     Objections must be submitted in writing with evidence. *Why it helps*: Reduces impulsive "no" votes from ignorance and makes stubbornness costlier (requires effort).

  3. **Default to Approval with Opt-Out**:  
     Proposals pass unless formally blocked within a timeframe. *Why it helps*: Inertia favors action, shifting burden to objectors. Combats status quo bias.

  4. **Rotating Veto Authority**:  
     Each decision designates 1–2 members with veto power (rotated per meeting). *Why it helps*: Prevents entrenchment and forces objectors to justify views to peers.

  5. **Tiered Spending Authorities**:  
     Small expenses: Chair approval. Medium: Majority vote. Large: Supermajority. *Why it helps*: Unanimity reserved for high-stakes decisions, reducing burnout on trivial vetoes.

  6. **Calibration Training**:  
     Train members on cognitive biases (e.g., "When uncertain, defer to better-informed peers"). *Why it helps*: Mitigates ignorance-driven blocking.

  ---

  ### Key Insight
  Your system suffers from a **double pathology of unanimity**: first, it empowers the *least informed* to impose their risk aversion; second, it incentivizes the *least cooperative* to weaponize veto power. Both stem from the same flaw: treating every member’s objection as equally valid, regardless of knowledge or intent. Fixing it requires breaking the equivalence between "objection" and "veto" – either by raising the bar for blocking or reducing opportunities for obstruction.
