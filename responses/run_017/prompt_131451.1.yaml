answer: |-
  Below is a decision tree for coding animal signaling in observational footage, designed for undergraduates with minimal training. The procedure prioritizes clarity, observational constraints, and your specified distinctions. I've reworked your tag set to balance precision and practicality, collapsing distinctions that are infeasible for untrained observers while retaining your core concerns. Tags are now:  
  - **not-a-signal** (non-communicative cue/no response)  
  - **signal-conventional** (cheap, reliability unsecured)  
  - **signal-index** (reliability via physical constraint)  
  - **signal-handicap-recurring** (reliability via recurring cost paid per display)  
  - **signal-handicap-sunk** (reliability via sunk cost paid once in development)  
  - **uncodeable** (insufficient data; includes cases needing experiments)  

  **Key changes to your original tags**:  
  - "Costly-or-handicap" split into **recurring** (adjustable now) and **sunk** (fixed at display time) to honor your distinction.  
  - "Signal-reliability-unsecured" renamed **signal-conventional** for clarity.  
  - **No combined "index-and-handicap" tag**—coders pick the dominant mechanism. If both are equally evident, it defaults to *uncodeable* to avoid overconfidence.  
  - **Costly signals require observable/reasonable inference of cost** (energy/risk). Marginal/differential cost is *assumed* if cost exists and the signal is variable.  
  - **Cost due to receivers or borne by others is uncodeable** without evidence.  

  ---

  ### **Decision Tree: Coding Animal Signaling**  
  *Per clip, coders answer in order. Stop and assign a tag at any step if criteria are met.*  

  **Step 1: Is this behavior a signal?**  
  - **Question**: Is the behavior conspicuous (exaggerated, repetitive, or directed) and likely evolved for communication?  
  - **Sufficient yes**: Behavior is directed at another individual *or* is a known display (e.g., stotting, begging, advertisement calls) even if no receiver is visible.  
  - **Hard no**: Behavior is functional (e.g., locomotion, foraging) or a passive cue (e.g., footprints, accidental sounds).  
  - **Uncodeable**: Ambiguous cases (e.g., a bird flapping wings—is it flight or display?).  
  - **Hand to expert**: Unfamiliar behaviors; you'll create a codebook rule (e.g., "For species X, behavior Y is always a signal").  
  - *Outcome*: If no → **not-a-signal**. If yes/unclear → proceed to Step 2.  

  **Step 2: Is reliability secured by physical constraints (index)?**  
  - **Question**: Could a low-quality signaller fake this signal? Focus on physics (e.g., body size limits call pitch; muscle mass constrains jump height).  
  - **Sufficient yes**: Signal is tightly linked to a visible physical trait (e.g., vocalization pitch matches body size; antler size scales with skeleton).  
  - **Hard no**: Signal is modifiable (e.g., learned vocalizations, color changes via pigments).  
  - **Uncodeable**: Physical link is uncertain (e.g., is feather brightness chemically or physically constrained?).  
  - **Hand to expert**: Borderline cases (e.g., whether a frog's call frequency is purely size-dependent).  
  - *Outcome*: If yes → **signal-index**. If no → proceed to Step 3.  

  **Step 3: Is there a recurring cost (paid per display)?**  
  - **Question**: Does producing this signal *now* incur immediate energy/risk costs observable in the clip?  
  - **Sufficient yes**: Signal requires vigorous effort (e.g., loud calls, high jumps) *or* receivers imposing costs are visible (e.g., predator/rival reacts).  
  - **Hard no**: Signal is static (e.g., displaying a fixed ornament) or low-effort (e.g., subtle head-bobbing).  
  - **Uncodeable**: Cost is plausible but unobservable (e.g., chemical signals; no receiver in frame for risk assessment). *Experiment needed*: Manipulate signal effort to measure energy expenditure.  
  - *Outcome*: If yes → **signal-handicap-recurring**. If no/unclear → proceed to Step 4.  

  **Step 4: Is there a sunk cost (paid once in development)?**  
  - **Question**: Is the signal a fixed morphological trait (e.g., horns, bright plumage) that likely required resources to develop?  
  - **Sufficient yes**: Trait is permanent and conspicuous (e.g., antlers, carotenoid-based colors).  
  - **Hard no**: Signal is behavioral with no morphological component.  
  - **Uncodeable**: Trait's developmental cost is unclear (e.g., is a bird's beak color due to diet or genes?). *Experiment needed*: Deprive signallers of resources during development.  
  - *Outcome*: If yes → **signal-handicap-sunk**. If no → proceed to Step 5.  

  **Step 5: Default to conventional or uncodeable.**  
  - **Question**: Can we confirm no index or handicap exists?  
  - **Sufficient yes**: Signal is cheap, modifiable, and no costs/constraints are observed (e.g., birdsong not tied to size/effort).  
  - **Uncodeable**: Uncertainty about costs/constraints remains (e.g., no receiver in frame for risk assessment).  
  - *Outcome*: If yes → **signal-conventional**. Else → **uncodeable**.  

  ---

  ### **Applied to Your Examples**  
  **1. Gazelle stotting, no predator in frame**  
  - Step 1: **Yes** (conspicuous, known signal).  
  - Step 2: **No** (stotting isn't physically constrained; any gazelle *could* stot).  
  - Step 3: **Yes** (vigorous jumping implies energetic cost; risk cost uncodeable without predator). → **signal-handicap-recurring**.  
  - *Why?* Energy cost is observable; marginal differential cost is assumed. Sunk cost irrelevant (behavioral signal).  

  **2. Nestling birds begging (audio + video)**  
  - Step 1: **Yes** (directed at parent, conspicuous).  
  - Step 2: **No** (begging isn't physically constrained; low-quality nestlings can beg).  
  - Step 3: **Yes** (vigorous gaping/calling implies energy cost; risk uncodeable if no predator visible). → **signal-handicap-recurring**.  
  - *Why you won't like this*: Literature treats begging as "honest" but often glosses over cost type. Here, cost is recurring (energy per beg), not sunk. Parental costs (your distinction #5) are ignored—without seeing parents, we can't code who bears costs.  

  **3. Male frog advertisement call (pitch indexes size, calling is costly)**  
  - Step 2: **Yes** (pitch physically constrained by body size). → **signal-index**.  
  - *Why not handicap?* Index dominates because pitch reliability comes from physics, not cost. Calling cost is recurring but secondary (affects signal production, not pitch honesty). If the clip emphasized call effort over pitch, it would be **signal-handicap-recurring**.  
  - *Combined case*: No "index-and-handicap" tag; coder picks the primary mechanism. Here, pitch indexing is more salient.  

  ---

  ### **Which Distinctions Are Load-Bearing?**  
  **Retained (critical for reliability coding)**:  
  - **Signal vs. cue** (Step 1): Fundamental; observable via directedness/conspicuousness.  
  - **Index vs. handicap** (Steps 2–4): Core to your critique; distinguishable via physical constraints vs. costs.  
  - **Sunk vs. recurring cost** (Steps 3–4): Honored per your requirement. Recurring is prioritized if both possible (e.g., begging).  
  - **Cost requires evidence** (Steps 3–4): Avoids unfalsifiable "costly signals" by demanding observable energy/risk.  

  **Dropped or simplified (too fine-grained for coders)**:  
  - **Marginal/differential cost**: Coders can't measure cost curves per individual. *Handled by*: Assuming variability implies differential cost (e.g., if a frog can adjust call rate, cost is marginal).  
  - **Cost due to receivers** (your distinction #4): Uncodeable without receiver in frame. *Misfire*: Underestimates risk costs (e.g., stotting without predators).  
  - **Cost borne by others** (distinction #5): Unobservable; sunk cost assumes signaller paid.  
  - **Cost/benefit currencies** (distinction #7): Intractable observationally; costs are binary (present/absent).  

  ### **Where the Procedure Misfires Predictably**  
  1. **Invisible receivers**: Signals with risk costs (e.g., predator attraction) will be miscoded as **signal-handicap-recurring** (energy only) or **uncodeable**. *Example*: Stotting with no predator → recurring cost (energy) coded, but risk missed.  
  2. **Combined mechanisms**: Signals like frog calls (index + handicap) force a choice. *Misfire*: Coders may overlook one mechanism.  
  3. **Conventional signals**: May be misclassified as handicaps if effort is overinterpreted (e.g., a low-energy display coded as costly).  
  4. **Sunk vs. recurring**: Static traits with developmental plasticity (e.g., plumage) may be miscoded as **signal-handicap-sunk** even if condition-dependent.  

  ### **Recommendations**  
  - **Training emphasis**: Drill coders on known examples (e.g., "antlers = sunk cost; begging = recurring cost"). Use your expertise to pre-classify common signals.  
  - **Ambiguity tolerance**: 30–40% of clips will hit **uncodeable** (e.g., no receiver, unclear costs). This is preferable to wrong tags.  
  - **Expert oversight**: Reserve 10% of clips for your validation. Focus on edge cases (e.g., signals with both index and cost).  
  - **Tag simplicity**: Dropping marginal/differential and external-cost distinctions makes the tree usable. Retaining sunk/recurring addresses your key insight.  

  This tree optimizes for your constraints: observational limits, untrained coders, and your philosophical rigor. It will misfire on receiver-dependent costs and combined mechanisms, but these are explicit "known unknowns."
