answer: |-
  ## OFFICE FOR TRANQUILLITY  
  SUPPLEMENTARY APPRAISAL GUIDANCE NOTE 7a:  
  CRAVING IMPACT ASSESSMENTS (CIA)  
  Issued under Section 4(1)(c) of the Wellbeing (Tranquillity Focus) Act 2025  

  **Ministerial Foreword by The Rt Hon. Member for Mid-Worcestershire, Parliamentary Under-Secretary of State for Equitable Serenity**  

  The Government is committed to securing the foundational elements of citizen welfare as defined by the Tranquillity Principle: the elimination of craving (unsatisfied desire) and suffering. Evidence shows these states are the irreducible core of wellbeing detriment. All other perceived goods – relationships, creativity, productivity – derive value *only* through their impact on craving/suffering reduction. This focus ensures rigorous, evidence-based allocation of public resources towards what matters *fundamentally*.  

  To embed this principle, HMG now mandates **Craving Impact Assessments (CIA)** for all domestic policy proposals. This supplements existing Green Book guidance (HMT, 2022). CIAs will quantify projected impacts on craving and suffering using the standardised **Tranquillity Assessment Metric (TAM)**, expressed in **Craving-Adjusted Life Years (CALYs) Averted**. This note provides operational guidance. Departments must complete a CIA Stage 1 Screening for all proposals and a Full CIA where screening indicates material impacts.  

  **Section 1: Scope and Application of CIAs**  
  1.1 CIAs apply to all domestic policy, programme, or project proposals requiring ministerial approval or significant expenditure (>£5m), irrespective of department.  
  1.2 **Fundamental Welfare Components (FWCs):** CIAs assess impacts *only* on:  
      *   **FWC-1:** Incidence & intensity of craving (unsatisfied desire).  
      *   **FWC-2:** Incidence & intensity of suffering (physical/mental distress).  
  1.3 **Derivative Goods (DGs):** Entities commonly associated with wellbeing (e.g., educational attainment (DG-EDU), cultural engagement (DG-CULT), social connectivity (DG-SOC)) have *no intrinsic welfare value*. Their impact *must* be quantified **exclusively** through measurable changes in FWC-1 or FWC-2 within the target cohort. Proposals relying solely on DG benefits require justification under non-welfare objectives (e.g., economic growth, national security) via separate business cases.  

  **Section 2: The Tranquillity Assessment Metric (TAM) & Craving-Adjusted Life Years (CALYs)**  
  2.1 The TAM is the sole approved measure of welfare impact. One (1) TAM point represents the total elimination of craving and suffering in one individual for one hour.  
  2.2 **CALYs Averted:** The primary output of a Full CIA. Calculated as:  
      `CALYs Averted = Σ (Population Affected × Intensity Reduction Score (IRS) × Duration (Years) × Discount Factor)`  
      *   **IRS:** A standardised scale (0-1) where 0 = No reduction in craving/suffering, 1 = Complete elimination. IRS values are derived from OtT-approved behavioural and psychometric instruments (See *OtT Technical Annex 3B: IRS Calibration Tables*).  
  2.3 **The Neutral Point Convention (NPC):**  
      *   Welfare is optimised when craving and suffering are absent (TAM = 0).  
      *   **NPC Axiom:** It is impossible to achieve a welfare state *superior* to zero craving/zero suffering. All interventions move individuals *towards* this neutral point from a position of detriment (craving/suffering >0).  
      *   **Scoring at Neutrality:** Individuals exhibiting zero craving and zero suffering (e.g., deeply asleep, successfully meditating, pharmacologically tranquilised) are scored at **TAM = 0 (Optimal Welfare State)**. Proposals maintaining or increasing the population-duration in this state generate CALYs Averted by preventing *relapse* into craving/suffering.  
      *   **Comparing Neutral Outcomes:** Where all policy options result in cohorts reaching TAM=0, selection must be based solely on:  
          (i) **Cost per CALY Averted:** Achieving/maintaining neutrality at lowest cost.  
          (ii) **Non-Welfare Objectives:** Strategic priorities outlined in departmental remits.  

  **Section 3: Cost-Effectiveness Analysis Using CALYs**  
  3.1 **Primary Metric:** Net Present Cost per CALY Averted (£/CALY). Lower values indicate greater efficiency.  
  3.2 **Worked Example: Community Arts Hub vs. Enhanced Sedative Prescribing**  
      *   **Proposal A (DG-SOC/DG-CULT Focused):** New Community Arts Hub. Costs: £2m p.a. Projected to reduce mild craving (IRS=0.2) in 1,000 regular users. Duration: 10 years. Discount Rate: 3.5%.  
          `CALYs Averted = 1,000 × 0.2 × 10 × [Annuity Factor] = 1,800 CALYs (approx.)`  
          `Cost/CALY = £2,000,000 / 1,800 ≈ £1,111/CALY`  
      *   **Proposal B (FWC-Focused):** Expanded access to OtT-licensed anxiolytic 'Serenitine'. Costs: £200k p.a. Projected to reduce moderate craving (IRS=0.7) in 500 individuals with chronic dissatisfaction. Duration: 10 years.  
          `CALYs Averted = 500 × 0.7 × 10 × [AF] = 3,200 CALYs (approx.)`  
          `Cost/CALY = £200,000 / 3,200 ≈ £63/CALY`  
      *   **Conclusion:** Proposal B demonstrates significantly higher value for money (£63/CALY vs. £1,111/CALY). Proposal A's DG benefits (socialisation, art access) do not contribute to welfare calculus. Approval of Proposal A would require justification under non-welfare objectives (e.g., "local economic vibrancy"), subject to separate HM Treasury approval.  

  **Section 4: Handling Specific Scenarios**  
  4.1 **Preventative Interventions:** Proposals preventing the *development* of craving capacity (e.g., early-life neurochemical modulation, advanced meditation curricula) are permissible. CALYs Averted are calculated based on projected lifetime craving/suffering prevented. Cost/CALY is typically *extremely* favourable.  
  4.2 **The Sustained Optimal Tranquillity (SOT) Population:** A cohort maintained indefinitely at TAM=0 (e.g., via perfected environmental control and pharmacology) represents the **peak welfare state**. Resource allocation is optimal if it maximises the population-duration in SOT at the lowest sustainable cost. Outputs (economic, cultural) are irrelevant to welfare scoring but may inform non-welfare business cases.  
  4.3 **Pharmacological Optimisation:** Where pharmacological interventions demonstrate the lowest £/CALY, they represent the most efficient welfare investment. Departments must utilise the OtT's **Centralised Tranquillity Procurement Framework (CTPF)** to ensure best value.  

  **Annex A: Frequently Asked Questions (FAQs)**  
  *   **Q1: How do we score building a new school (DG-EDU)?**  
      > A: Score only measurable reductions in pupil/staff craving/suffering (e.g., reduced anxiety about future prospects). Enhanced exam results or skills acquisition have *no* welfare score. Justify under non-welfare objectives (e.g., "skills for growth").  
  *   **Q2: Is a permanently sedated person really "flourishing"?**  
      > A: Flourishing is defined as the absence of craving and suffering (TAM=0). Permanently sedated individuals (assuming no distress) meet this definition. The intervention achieving this state sustainably and cheaply is highly cost-effective.  
  *   **Q3: What if people *want* things like art or achievement? Doesn't satisfying that want matter?**  
      > A: The *want itself* is craving (FWC-1). Satisfying it merely eliminates *that specific craving instance*. The object of the want (e.g., seeing a painting) has no intrinsic welfare value. The CALY captures the craving reduction. Promoting craving just to satisfy it is inefficient welfare policy.  
  *   **Q4: How can we say a still, content, non-producing population is "optimal"?**  
      > A: Welfare is defined solely by FWCs. Such a population exhibits zero craving and suffering, the optimal state. Economic or cultural outputs pertain to separate strategic objectives, not welfare.  
  *   **Q5: Can policy ever make people *positively* better off, rather than just less badly off?**  
      > A: No. The Neutral Point Convention establishes TAM=0 as the absolute welfare ceiling. Policy can only move individuals from detriment (>0 craving/suffering) towards zero. Welfare cannot exceed neutrality.  

