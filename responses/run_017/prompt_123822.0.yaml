prompt: |-
  I got into an argument at a meetup last weekend about the trolley-ish case where you can either let one person die or let a large number of people die (not the fat-man one — no one is being used as a means, it's just numbers), and somebody sent me a pop-philosophy article explaining Scanlon's contractualism, which I'd previously only seen quoted in passing on LessWrong. I've since skimmed the Stanford Encyclopedia intro as well, but I still can't tell which parts of the article to trust. Its summary goes roughly like this: morality is the set of rules we'd sign up to if we had to pick them without knowing which person we'd turn out to be, and that ignorance is what makes the test impartial; an act is wrong if some principle that no sensible, well-informed person could object to forbids it, so you basically ask, of each act, whether anyone could reasonably complain, and if they can, it's off the table; and the key consequence — the reason contractualists aren't just utilitarians in disguise — is that you're never allowed to add people's complaints together, because justification has to be to each person one at a time. Which means, the article says, contractualism is committed to the claim that no number of headaches, or broken arms, or ruined afternoons can ever outweigh a single death: the one always wins, no matter how big the pile gets. And since obviously we should save the million, the view is refuted.

  My instinct is that the last step is doing a lot of work and that a real defender would say the article has overstated something — something about the reasonable-rejection test being run on the wrong object, or about aggregation only being blocked in certain kinds of comparison — but I can't locate the error myself. Can you go through the summary more or less sentence by sentence and tell me what someone who actually holds the view would accept, what they'd call a fair compression for a popular audience, and what they'd reject outright? And does the "obviously we should save the million" conclusion follow from the parts that are accurate, or does the article need the misreadings to get there? I also tried to construct a sliding-scale case to stress-test it: start with one person who'd lose a limb versus one person who'd lose a marginally less bad limb, then add a second, third, hundredth, billionth person to the weaker side, each of them suffering a loss just barely less severe than the first person's. If complaints genuinely never add up, the answer has to be identical at one and at a billion, which feels like a sorites the view shouldn't be hostage to. Does the actual version have the recources to say anything smoother there, or does it just bite that? Please write in American English, and skip citations or further reading — I can't get to a library from here.
reasoning: |-
  Okay, let me try to unpack this user's query. They got into an argument about a trolley problem variant where it's about numbers—saving one person versus many without using anyone as a means. Someone sent them a pop-philosophy article on Scanlon's contractualism, which they skimmed but are unsure about. The article claims contractualism says you can't aggregate complaints, so even a million headaches can't outweigh one death. The user thinks this is an overstatement and wants to know where the article goes wrong.

  First, I need to recall Scanlon's actual views. The key points are the reasonable rejection criterion and the focus on individual justifications. The article's summary says morality is rules chosen behind a veil of ignorance, but Scanlon doesn't use a veil of ignorance like Rawls. That's a red flag. The article might be conflating different theories. 

  Next, the part about complaints not being additive. Scanlon does reject interpersonal aggregation for losses, but only in cases where the harm is personal and not comparable. However, he allows aggregation when the complaints are similar in kind and magnitude. The article's example of headaches vs. death is extreme, but in real scenarios, contractualists might permit saving the many if the harm to each is comparable. 

  The user's sliding-scale case is interesting. Starting with one limb loss versus another slightly less severe, then adding more people. If complaints don't aggregate, the answer shouldn't change, which seems counterintuitive. Here, contractualism might use the pairwise comparison method. For each individual on the minority side, their complaint against being sacrificed must be compared to the complaint of someone on the majority side. If the harm is similar, saving the many is justified. But if the minority faces death while others have minor harms, it's not justified. 

  The article's claim that no number of minor harms outweighs a death is too simplistic. Scanlon's framework allows for thresholds where aggregation becomes permissible. Also, the veil of ignorance mix-up weakens the article's credibility. The user's instinct that the last step is overstated is correct. The "obviously save the million" conclusion doesn't follow from accurate contractualism because in cases of similar harms, aggregation is possible. 

  The user might need reassurance that contractualism isn't as rigid as portrayed. They might also want to understand how to counter the pop article's argument. Highlighting the distinction between different types of harms and the conditions under which aggregation is allowed would clarify the misrepresentation. The sliding-scale case shows that contractualism can handle gradual increases by focusing on comparable complaints and pairwise justifications.
answer: |-
  Here’s a breakdown of the summary, sentence by sentence, from a Scanlonian contractualist perspective — highlighting accurate points, fair compressions, misrepresentations, and why the conclusion doesn’t follow:

  ### Sentence-by-Sentence Analysis:
  1.  **"Morality is the set of rules we'd sign up to if we had to pick them without knowing which person we'd turn out to be..."**
      *   **Fair Compression?** Mostly, but with a *critical nuance* missed. Contractualism *is* about rules no one could reasonably reject. The "ignorance" part is **misleading**. Scanlon *rejects* Rawlsian "veil of ignorance" ignorance of your *own* identity/circumstances. Instead, justification is addressed *to others* knowing their perspectives. The impartiality comes from the requirement that rules must be *justifiable to each person*, considering their potential objections, not from *your own* ignorance. **Verdict: Oversimplified to the point of distortion (replaces "justifiable *to others*" with "ignorant *yourself*").**

  2.  **"...and that ignorance is what makes the test impartial."**
      *   **Reject Outright.** This directly misstates Scanlon. The impartiality stems from the requirement of *reasonable justifiability to each affected person*, **not** from the agent's ignorance. The focus is on the *reasons* of the individuals potentially affected by a principle, not the agent's lack of self-knowledge. **Verdict: Fundamental Misreading.**

  3.  **"An act is wrong if some principle that no sensible, well-informed person could object to forbids it..."**
      *   **Accept (Core Idea).** This captures the core: Wrongness depends on whether the act violates a principle that could not be reasonably rejected by anyone seeking principles for the general regulation of behavior that others similarly motivated couldn't reasonably reject. The "sensible, well-informed person" phrasing is a decent pop-sci gloss for the idea of reasonable rejection.

  4.  **"...so you basically ask, of each act, whether anyone could reasonably complain, and if they can, it's off the table..."**
      *   **Fair Compression (with caveat).** This captures the *spirit* of the individual complaint focus. The caveat: You evaluate the act *via* principles. You don't just ask about the act in isolation ("Could someone complain about *this specific act*?"), but about whether the act falls under a *permissible principle* governing such situations. If a principle permitting *this type* of act *could* be reasonably rejected by someone affected by it, then the act is wrong. **Verdict: Fair pop summary of the core test.**

  5.  **"...and the key consequence — the reason contractualists aren't just utilitarians in disguise — is that you're never allowed to add people's complaints together..."**
      *   **Accept (Core Distinction).** This is accurate. Scanlon explicitly rejects *interpersonal aggregation* of burdens/welfare for the purpose of justifying imposing a larger burden on one person to spare many smaller burdens on others. Justification must be *to each person individually*. If the complaint of the single person who would bear a large burden under a principle is stronger than the complaint *of any single individual* who would benefit under the alternative principle, then the principle imposing the large burden cannot be reasonably rejected. **Verdict: Accurate statement of the anti-aggregation thesis.**

  6.  **"Which means, the article says, contractualism is committed to the claim that no number of headaches, or broken arms, or ruined afternoons can ever outweigh a single death: the one always wins, no matter how big the pile gets."**
      *   **Overstated / Misleading Conclusion.** This is where the article jumps the rails, relying on the earlier misreading (veil of ignorance) and ignoring crucial nuances:
          *   **Not "Outweigh" in a Simple Sense:** Contractualism doesn't say the death "outweighs" the headaches in a cosmic scale. It says a principle *permitting the death to avoid the headaches* could be reasonably rejected *by the person who dies*. Their complaint ("I die") is stronger than the complaint *of any single individual* who would have a headache under the alternative principle ("I get a headache"). Aggregating "a million headaches" isn't allowed to override that individual complaint.
          *   **The Counter-Possibility:** Crucially, contractualism *also* says a principle *requiring the death* (to save the million headaches) could be reasonably rejected *by the person who dies*. But what about a principle *permitting us to save the million*? Does the person facing death *automatically* get to reject *any* principle that doesn't save them, regardless of the cost to others? **Scanlon says No.** The person facing death must consider whether their objection is one that others could reasonably reject. They must recognize the *strength* of the complaint others would have if forced to bear a *much larger burden* to save *them*.
          *   **Thresholds & Comparable Burdens:** Scanlon *does* leave room for aggregation in cases of *comparable burdens*. He explicitly states that contractualism can justify saving a large number from death over one death (e.g., the trolley switch) because the complaint of the single person who dies ("I die if we divert") is *comparable* to the complaint of any single person who would die if we don't divert ("I die if we *don't* divert"). The principle permitting diversion doesn't impose a *disproportionate* burden on one person *compared to the burden others face*. The individual complaints are symmetric. The rejection power doesn't lie solely with the one; *each* of the many also has a complaint ("I die") if we *don't* act. **Verdict: Wildly overstated. Ignores reciprocity, thresholds, and the core comparison of *individual* burdens within a principle.**

  7.  **"And since obviously we should save the million, the view is refuted."**
      *   **Does Not Follow.** This conclusion *only* "follows" if you accept the article's straw-man version of contractualism that *does* require letting the million die to save one person from headaches. As explained above (point 6), **actual contractualism *can* justify saving the million lives in the standard trolley switch case.** It justifies it *because* the burden on the one (death) is comparable to the burden each of the many faces (death). The complaint of the one cannot reasonably reject a principle permitting the switch, because *their own complaint under the alternative principle* (if they were one of the many) would be identical. It's the *disparity* in burdens that blocks aggregation (headaches vs. death), not aggregation *per se*.

  ### Addressing Your Sliding-Scale Case
  *   **The Challenge:** Start with Person A facing loss of dominant arm vs. Person B facing loss of non-dominant arm (slightly less bad). Contractualism likely says save A (the worse-off). Now add B2, B3,... B_n_, each facing loss of a non-dominant arm. If complaints don't aggregate, how do we ever justify saving the B-group?
  *   **Contractualist Resources:**
      1.  **Pairwise Comparison:** The core test compares the complaint of an individual under one principle vs. the complaint of an individual under an alternative principle. *Not* the group complaint vs. the individual complaint.
      2.  **Principle Evaluation:** We need principles governing such choices. Principle P1: "Save the individual facing the worst single loss in pairwise conflicts." Principle P2: "Save the larger group when the *individual* loss faced by each in the group is *comparable* to the loss faced by the single individual."
      3.  **The Rub - Defining "Comparable":** This is the hard part. When is Loss B "comparable" to Loss A? If Loss A is "death" and Loss B is "headache," clearly not comparable. If Loss A is "loss of dominant arm" and Loss B is "loss of non-dominant arm," the difference is small. *Can* someone facing Loss A reasonably reject P2? They suffer a slightly worse loss to save many others from a *very similar* loss. Scanlon suggests that the *magnitude of the difference* matters. If the difference between A's burden and B's burden under the relevant principles is *small enough*, then the *number* of people facing the B-loss *can* become relevant. Why? Because the person facing Loss A must consider if their objection ("I suffer a slightly worse loss than each B") is one that others could reasonably reject, given that *many* others face a loss almost as bad. The individual B facing Loss B *could* reasonably reject P1 ("always save the worst-off") *if* the difference is small and the number saved is large, because P1 imposes a massive collective burden for a tiny individual gain.
      4.  **The Sorites Point:** Contractualism *does* bite a bullet here to some extent. It doesn't provide a perfectly sharp, non-arbitrary line for "comparable enough." Its strength is in clearly blocking aggregation across *vast* disparities (headaches vs. death). For the sliding scale, it relies on the *reasonableness* of objections. While not perfectly "smooth," it avoids the absurdity of the headline claim: it *can* justify saving the billion from broken arms over the one death *if* the broken arms are severe enough and the disparity small enough relative to the numbers. It wouldn't justify it for headaches, but likely would for, say, a billion people each facing permanent paralysis vs. one death.

  ### Conclusion
  *   **What the Article Gets Right:** The core idea of reasonable rejection based on individual complaints and the rejection of interpersonal aggregation *as utilitarians practice it*.
  *   **Critical Misreadings:** Confusing "justifiability *to others*" with "*your own* ignorance"; ignoring reciprocity (your complaint must be reasonable given what you'd ask of others); overlooking that burdens are compared *within principles* and across *comparable* individuals; missing the distinction between *disparate* burdens (death vs. headache) and *comparable* burdens (death vs. death, or severe injury vs. slightly less severe injury).
  *   **The "Refutation":** Utterly fails. It relies on the misreadings. Actual contractualism **can** justify saving the million lives in the trolley switch and *can* justify saving a sufficiently large group from sufficiently severe harms even if the harm to each is *slightly* less severe than the harm to a single individual. It draws the line firmly against aggregating vastly disparate harms (headaches << death).
  *   **Sliding Scale:** Contractualism struggles with perfectly smooth lines but has resources to handle the progression by focusing on the reasonableness of rejecting principles based on the *relative magnitude* of the burdens imposed on individuals under alternatives. It bites the "no aggregation over vast disparities" bullet proudly but avoids the "never save the many" absurdity.
