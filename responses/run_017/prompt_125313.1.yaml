answer: |-
  Here’s a draft grounded in your constraints—no false promises, no platitudes, just the hard truth of the work, framed with the von Neumann insight and your core thesis. British English, 5-6 minutes, no quotes:

  ---

  **(Standing at the mic, looking at the shaft entrance, then the crowd)**  
  That’s the last one. After today, the shaft gets sealed. The rock takes back what we’ve borrowed. And up here? We start building something meant to outlast cities, languages, maybe even the names we’ve given the stars.  

  Some of you spent thirty years arguing about shapes in granite and pictograms on nickel alloy. Others spent thirty years driving lorries down that access road, welding casks, or farming fields near a site that hummed with activity—and unease. Today, both those jobs end. And both, in the end, were about the same thing: **building for a future that won’t know us.**  

  We built a machine. Not the cranes or the drills—something quieter. Think of it like this: you make a device that can create a copy of itself. It does two things with its instructions. It *reads* them to build the next version. And it *copies* them, untouched, to hand over. The part that survives? It’s the bit that never gets opened. The bit that isn’t *used*.  

  That’s our marker. The granite, the earthworks, the alloy tablets—they’re durable because physics doesn’t forget. But meaning? Meaning is fragile. The words we’re speaking now will be archaeology in a thousand years. In ten thousand? Dust. So we weren’t just building something durable. We were building something whose *job* is to stay unopened. To be a signpost nobody reads.  

  Here’s what we understood too late: **Our goal wasn’t to be understood.** It was to survive being *mis*understood.  

  Because they *will* misread it. Ten thousand years from now? They might think it’s a tomb. A temple. A monument to gods we didn’t worship, or kings we never crowned. They might think it’s a trick, or a curse, or a story they’ve half-forgotten. And that’s alright. Because if we’ve done our job, every wrong reading—*every single one*—still tells them: *Walk away. This place is not for you.*  

  That’s the quiet genius in what you’ve all built. The welders, the geologists, the drivers: you made a thing whose highest compliment is that it *never* gets used. The linguists and the symbol-people: you fought over angles and glyphs not to be perfect, but to make sure that even wrong feels dangerous. You built a lock that works even if the key is lost.  

  To the families here: thank you for sharing them with this. It’s not just overtime and muddy boots. It’s lending someone to work that won’t be thanked in their lifetime.  

  To the farmers and neighbours: your suspicion wasn’t noise. It was the sound of people who know land lasts longer than plans. We asked you to trust steel and concrete further than any of us can see. That’s a hard thing. The only answer we have is this: we built for the misreadings. We built for the wrong reasons. Because if the right reason fades, the wrong ones might still keep this place whole.  

  So as the last cask goes down—as the backfill starts—here’s what’s true:  
  What we sealed today isn’t just waste. It’s a question. A question for people we won’t meet, in a language we don’t own.  
  What we build above it won’t be a message. It’ll be a mirror. It’ll show them their own ghosts, their own fears, their own stories.  
  And if we’ve done it right? They’ll turn that mirror face down. They’ll leave it buried. They’ll walk away.  

  Not because they understood us.  
  But because we understood enough about being human to plan for the day they wouldn’t.  

  Proper job done. Thank you.  

  ---  

  ### Why this works:
  - **Von Neumann’s core insight** is woven in without naming him: the unused instructions surviving precisely because they’re unread mirrors the marker’s purpose.  
  - **Your thesis is the spine**: "Robustness to misreading over accuracy" drives paragraphs 4-6, validating the experts while making the abstract tangible.  
  - **Honours the workers’ sacrifice**: "Never used = highest compliment" reframes their career’s end as intentional triumph.  
  - **Respects the farmers**: Acknowledges suspicion as rational ("land lasts longer than plans"), avoids false reassurance.  
  - **No false promises**: "Dust", "ghosts", "wrong reasons" sit honestly alongside the design’s rigor.  
  - **British tone**: "Proper job done", "sound of people who know", "lorries", understated emotion.  
  - **Ends on dignity**: The mirror metaphor ties back to human fallibility—the one constant across millennia.  

  Timed at ~5:30 when spoken deliberately. It leaves the heaviness where it belongs—on the work itself—while letting the shared weight of the moment hold.
