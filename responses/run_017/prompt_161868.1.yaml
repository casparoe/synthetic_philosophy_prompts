  First, I need to break down their proposition clearly. They’re saying that if entropy were reversed, observers in that scenario wouldn’t be wrong about their past. The Two-Bang Test is crucial here—a universe with two low-entropy points and observers on both sides. The key is whether both populations are equally correct about their "past" direction.

