prompt: |-
  I've been reading a bit of pop behavioral econ and I keep noticing something in my own decisions that the satisficing story doesn't seem to cover, and I want to know whether it has a name.

  Setup: you set a bar, look at options one at a time, take the first one that clears it. Two things go wrong with that in practice.

  First: figuring out whether an option clears the bar is the expensive part, not finding more options. I can reject a terrible flat in thirty seconds and take a perfect one in thirty seconds, but the ones sitting right on the line eat a whole weekend of visits, calls and checking. So satisficing didn't remove the work, it moved it into these borderline checks — and that creates a second decision nobody mentions: how much effort to spend finding out whether this particular option clears the bar. I spend a lot on the borderline ones and almost nothing on the obvious ones, which feels like I'm optimizing something while officially satisficing. Is that second-order decision itself satisficed? If it is, doesn't the same problem just reappear one level up, forever?

  Second: my bar moves while I look. See something great on day one and the bar goes up and I search for weeks; see a run of junk and it slides down and I settle fast. So the outcome isn't just "some acceptable option", it depends a lot on the order options happen to arrive in, and whoever controls that ordering — the listing site's default sort, the recruiter's slate — gets to decide both what I end up with and how long it takes me. That feels near the secretary problem but not the same thing, because my bar is drifting instead of fixed and I've no idea how many options are coming.

  Does either of these have an established name? I don't want a bare label: tell me the nearest concepts, how what I described differs from each, which fits best, and, if nothing fits, coin a term with a definition and sharp edges — cases that clearly count, near misses, and cases that don't count.

  Reply as a single JSON object with a "verdict" field (one sentence: are these really two phenomena, or one thing under two descriptions?) and a "patterns" array with one object per pattern, each with these fields:
  - "pattern": "check_cost" or "moving_bar"
  - "nearest_concept": the closest established concept you know of
  - "fit": "exact", "partial", or "poor"
  - "how_it_differs": one or two sentences
  - "runners_up": array of { "concept": ..., "why_not": ... }
  - "coined_name": your term if fit isn't exact, else null
  - "definition": one sentence, only if you coined a name
  - "edges": { "clear_case": ..., "near_miss": ..., "not_a_case": ... }
  - "confidence": "high", "medium", or "low"
reasoning: |-
  We are given two distinct patterns that the user has observed in their decision-making process, which seem to deviate from the classic satisficing model.

  First pattern: The cost of evaluating an option varies, and it is particularly high for borderline options. This leads to a second-order decision about how much effort to spend on evaluation. The user wonders if this second-order decision is itself satisficed and if so, whether it leads to an infinite regress.

  Second pattern: The aspiration level (the bar) moves during the search. It increases when a high-quality option is encountered early and decreases after a run of poor options, making the outcome sensitive to the order of options and the agent controlling that order.

  The question is whether these are two distinct phenomena or one thing under two descriptions. It seems they are two distinct issues: 
  1. The first is about the cost of evaluation and the decision of how much effort to spend on each option.
  2. The second is about the dynamic adjustment of the aspiration level.

  Therefore, the verdict is that they are two phenomena.

  Now, for each pattern, we will find the nearest established concept, assess the fit, and if the fit is not exact, we will coin a term.

  Pattern 1: "check_cost"

  Nearest concept: "Satisficing with costly information acquisition" or "Costly search in decision theory". However, note that the classic satisficing model does not typically incorporate variable and endogenous effort in evaluation. There is a literature on sequential search with costly sampling, but the focus on the variability of cost per option based on its perceived quality (and the resulting endogeneity of effort) is less standard.

  Fit: partial. 

  How it differs: Classic satisficing assumes that evaluating an option is costless or has a fixed cost. Here, the cost is variable and high for borderline options, leading to a second-order optimization problem of effort allocation.

  Runners-up: 
  - "Optimal stopping": This typically assumes a fixed cost per observation and a known distribution. The user's problem has variable and endogenous cost per option and unknown distribution? Also, the user is not necessarily stopping at the first above-threshold option because the threshold moves (in the second pattern) and because the evaluation cost is variable.
    Why not: The focus of optimal stopping is on when to stop, not on how much effort to spend on each evaluation. Also, the cost per option in optimal stopping is usually fixed and known in advance.
  - "Search theory": This is a broad field that includes costly search, but again, the variability of cost per option and the endogenous effort are not usually the central focus.

  Coined name: "Effort-Intensive Margin in Satisficing" (or "Effort Allocation in Satisficing")

  Definition: The phenomenon where the cost of evaluating an option is variable and particularly high for borderline cases, leading to an endogenous decision about how much effort to expend on each evaluation.

  Edges:
  - Clear case: Deciding how much time to spend inspecting a house that appears borderline in the listing, versus quickly rejecting a clearly bad one or accepting a clearly good one.
  - Near miss: A case where the cost of evaluation is fixed per option, but the decision to evaluate at all is made (this is more like standard costly search). 
  - Not a case: Classic satisficing where every option is evaluated with the same fixed effort.

  Confidence: medium (because while the concept of costly search exists, the variable cost and the endogenous effort allocation for borderline cases is not standard).

  Pattern 2: "moving_bar"

  Nearest concept: "Adaptive Aspiration Levels" or "Reference Point Adaptation". In behavioral economics, aspiration levels are known to adjust based on experience. For example, in the theory of learning and aspiration-based models, aspiration levels can be updated based on the outcomes encountered.

  Fit: partial.

  How it differs: The concept of adaptive aspirations is known, but in the context of satisficing search, the dynamic adjustment of the bar during a single search process (and its sensitivity to the order of options) is not always explicitly modeled. Moreover, the user highlights that the outcome becomes highly dependent on the order of options and the controller of that order.

  Runners-up:
  - "Secretary problem": This is a well-known optimal stopping problem where the goal is to select the best option from a sequence. But in the secretary problem, the decision-maker knows the number of options and the aspiration level is not adaptive; it is fixed by the strategy (e.g., reject the first n/e and then take the next best). 
    Why not: The bar in the secretary problem is not adaptive in the way described (it doesn't go up because of seeing a great option and then down because of a run of junk). Also, the number of options is unknown in the user's case.
  - "Hill climbing" or "Gradient ascent": These are optimization methods that adjust the current solution based on local improvements, but they are typically used in continuous spaces and not for discrete choice with sequential search.

  Coined name: "Order-Dependent Aspiration Drift"

  Definition: The phenomenon where the aspiration level (the bar) in a satisficing search is dynamically adjusted during the search based on the quality of options encountered, leading to outcomes that are sensitive to the order of presentation.

  Edges:
  - Clear case: When seeing a very good apartment early in the search, raising the bar and thus prolonging the search, versus seeing a run of bad ones and lowering the bar to settle for a mediocre option.
  - Near miss: A situation where the aspiration level is adjusted between separate search episodes (e.g., after a failure in one job search, the next time the bar is lower), but not during a single search.
  - Not a case: A fixed aspiration level throughout the search.

  Confidence: medium (because while adaptive aspirations are known, the specific focus on the order-dependency in a single search is not always emphasized).

  Now, we structure the answer as a JSON object.
