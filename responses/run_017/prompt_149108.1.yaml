answer: |-
  Here's a step-by-step diagnosis of the impasse in the Moral Equality of Combatants (MEC) debate, grounded in the arguments and counterarguments from both traditions. My conclusion is that **your initial guess is substantially correct, but requires refinement and integration with the collective action question.** The core impasse stems from a *conflation of distinct normative domains* (institutional rules vs. individual liability) **combined with** *divergent underlying models of agency within collective action*.

  **Brainstorming Underlying Disagreements:**

  1.  **Domain Confusion (Institutional vs. Fundamental Morality):**
      *   **Traditionalists (Walzer, et al.):** Explicitly defend the *practice* of warfare and the *rules* governing its participants. Their arguments focus on the necessity of *adjudication*, *feasibility*, *reciprocity*, and the *functional role* of soldiers within a state system. The "moral equality" is a *consequence* of applying rules designed for actors operating under conditions of pervasive uncertainty and institutional roles ("fighting well" within their role). They argue soldiers *cannot* and *should not* be tasked with judging the *jus ad bellum* of their own nation's war before acting.
      *   **Revisionists (McMahan, Fabre, et al.):** Explicitly focus on *fundamental individual moral liability*. They abstract away institutional context and role-based obligations to ask: "What makes an individual liable to defensive harm, based solely on their actions and responsibilities?" They see the traditional view as committing a category error by deriving deep moral conclusions from institutional necessities. Their paradigm is individual self/other-defense ethics scaled up.

  2.  **Model of Agency within Collective Action:**
      *   **Traditionalists:** Often operate with a more *role-based* or *systemic* view of the soldier. The soldier's agency is heavily constrained and shaped by their institutional role, obedience to legitimate authority (even if the *specific* command is unjust), and the diffuse nature of contribution to a large-scale collective harm. Responsibility is diffused and attenuated. This underpins their view that combatants "share a common condition" irrespective of *ad bellum* justice.
      *   **Revisionists:** Operate with a stronger model of *individual moral agency*, even within collectives. Participation in an unjust collective action (especially direct participation in hostilities) is seen as a significant exercise of individual agency that grounds liability, irrespective of role or systemic pressures (though voluntariness and knowledge *do* mitigate liability *within* the revisionist framework). They reject the idea that institutional affiliation dissolves individual responsibility for contributing to objectively unjust threats.

  3.  **Epistemology & Uncertainty:**
      *   **Traditionalists:** Place *massive* weight on the *inescapable epistemological fog* of war for the individual soldier. How can a conscript, or even a volunteer with limited access to high-level intelligence, *know* their war is unjust? This uncertainty is not a contingent feature but a defining one, making side-neutral rules essential to prevent paralysis or self-serving rationalizations.
      *   **Revisionists:** Tend to bracket uncertainty in their *core liability arguments*. They often argue from hypotheticals where the *ad bellum* injustice is *objectively clear* (e.g., "Soldier Unjust knows his state is the aggressor") to establish the *principle* that liability is asymmetric. They *then* address uncertainty as a mitigating factor affecting *blameworthiness* or *excuse*, but not the *core liability* based on objective facts. They argue traditionalists conflate *liability* with *blame* or *punitive desert*.

  4.  **The Scalar Liability Challenge:**
      *   Revisionists *do* acknowledge degrees of liability (McMahan explicitly discusses non-combatants contributing to unjust threats, varying roles). Liability *is* scalar in the sense that justification for *harming* someone depends on the *degree* of their contribution/threat and the *proportionality* of the defensive response.
      *   However, the core MEC debate concerns the *permissibility of targeting combatants as such*. Revisionists argue that once an individual is *sufficiently responsible* for contributing to an *objectively unjust lethal threat*, they lose their right not to be killed *by those defending against that threat*. There *is* a threshold – becoming a participant in hostilities for an unjust cause makes one liable *in principle*, even if rear-echelon cooks are less liable than frontline infantry. The *point of the threshold* (who counts as a "combatant" for liability purposes) *is* contested, but the asymmetry exists once the threshold is crossed for the unjust side. Traditionalists reject this liability threshold *entirely* based on role/function/institutional necessity, not just its location.

  **Diagnosis & Argument:**

  The primary engine of the impasse is **the conflation of the Institutional/Functional domain with the Fundamental Moral Liability domain.** Traditionalists argue *for* side-neutral rules based on the functional necessities of warfare as a collective, institutional practice beset by uncertainty. Revisionists argue *against* deep moral symmetry based on the individual's causal role and responsibility in objectively unjust harms, often abstracting from institutional context and pervasive uncertainty.

  *   **Evidence:** Walzer's focus is on "the war convention" and the shared "hazard" of combat. McMahan titles his seminal work *"Killing in War"*, deliberately focusing on the individual act, not the institutional framework. When traditionalists say "soldiers are morally equal," they mean *in their status under the rules of war*. When revisionists say they are not, they mean *in their fundamental moral liability to defensive harm based on the objective justice of their cause*.
  *   **Why the Replies Don't Land:** When revisionists point out that an unjust combatant objectively wrongs a just combatant by attacking them, traditionalists reply that this ignores the soldier's role, institutional obligation, and epistemic limits. When traditionalists invoke reciprocity and the need for shared rules, revisionists reply that these are pragmatic concerns distinct from fundamental moral liability. They are arguing on different planes.

  **However, the Collective Agency Model is the Crucial Secondary Factor.** The traditionalist institutional view *relies* on a model where individual agency and responsibility are profoundly shaped and constrained by the collective institution of war and the soldier's role within it. The revisionist view relies on a model where individuals retain significant moral responsibility for their participation in collective actions, even within institutions. This prior, often unarticulated, disagreement about *how individual moral responsibility functions within large-scale collective enterprises* underpins the differing weight given to institutional roles and epistemic constraints.

  *   **Evidence:** Traditionalists readily appeal to "doing one's job" and "serving the state." Revisionists counter that "just following orders" or "doing one's institutional role" doesn't absolve one of responsibility for contributing to objectively unjust killing. This is a deep disagreement about the moral significance of institutional roles versus individual causal contribution.

  **Confidence & Refinement:**

  *   **Overall Confidence:** **High (85%)** that the core issue is the Institutional/Liability domain conflation. **Medium-High (70%)** that the differing model of agency within collective action is the essential secondary driver making the conflation so persistent and the arguments seem incommensurable.
  *   **Least Confident Claim:** My confidence is *lowest* (**~50%**) on the argument that the scalar nature of liability *itself* is a primary *independent* source of the impasse. While your thought experiment is valuable, I think both sides *can* (and revisionists generally *do*) accommodate scalar liability within their frameworks. The core MEC disagreement persists *even* if we grant scalar liability: Traditionalists would *still* argue for role-based side-neutral rules governing *all* combatants above a functional threshold, while revisionists would *still* argue that liability (even if scalar) is fundamentally asymmetric based on *ad bellum* justice. The threshold disagreement *within* revisionism (cook vs. sniper) is intense but distinct from the core MEC clash. *What would change my mind?* If compelling evidence emerged that prominent traditionalists *implicitly* rely on a binary "combatant/non-combatant" moral status internally, or that key revisionist arguments against MEC *fundamentally* collapse without assuming liability is strictly binary at the combatant level, then the scalar issue would become a more central independent driver of the impasse.

  **What Counts as Progress:**

  Given this diagnosis, progress requires **disentangling the domains and explicitly addressing the collective agency model:**

  1.  **Clarifying the Distinction & Integration:** The most fruitful path is explicitly recognizing that **both claims can be true:** Soldiers fighting for an unjust cause *are* fundamentally morally liable to defensive harm in ways that just combatants are not (Liability Claim). *However*, a workable, humane, and epistemically feasible *institution* for regulating warfare *requires* largely side-neutral rules governing the conduct of hostilities (Institutional Claim). Progress means:
      *   Developing frameworks that *integrate* these truths without conflation. McMahan's "Justification and Liability" distinction and his later work on "revisionism and the law of war" attempt this. Progress involves refining these or proposing better integrative frameworks.
      *   Explicitly arguing *why* the Institutional Claim, while necessary, does *not* negate the Liability Claim (e.g., law ≠ morality; rules can be justified pragmatically without reflecting deep moral symmetry).
      *   Explicitly arguing *why* the Liability Claim, while true in principle, does *not* render the Institutional Claim irrelevant or unjustifiable (e.g., the catastrophic consequences of trying to implement liability assessments at the individual soldier level in real wars).

  2.  **Formalizing Collective Action & Role Responsibility:** Progress requires directly tackling the prior question: **How does participation in an institutional role within a large-scale collective action affect individual moral liability?** This needs:
      *   Rigorous philosophical work on the epistemology of collective action for participants: What *can* soldiers reasonably know or be expected to know about *ad bellum* justice? How does institutional structure shape belief formation?
      *   Deeper analysis of the moral force of institutional roles and legitimate authority: When does acting within a role excuse, justify, or mitigate? When does it merely describe the context of a culpable act?
      *   Formal models of distributed responsibility in complex systems, applied specifically to military hierarchies and war.

  3.  **Empirical Refinement (Supporting Role):** While not resolving the core philosophical clash, progress involves **better understanding the real-world conditions** that make the Institutional Claim necessary or shape the Liability Claim:
      *   Research on soldier epistemology: What *do* soldiers actually know/believe about the justice of their wars? How does this vary by role, rank, education, state type, etc.?
      *   Modeling the consequences: What would realistically happen if laws of armed conflict tried to incorporate *ad bellum* asymmetry at the tactical level? Would it reduce unjust wars or increase brutality and confusion?

  **Conclusion:**

  The impasse isn't because either side is fundamentally wrong *within their chosen domain*, but because they are primarily arguing *about different domains* (institutional practice vs. fundamental liability) while failing to adequately reconcile them, and because they hold incompatible, often implicit, views about individual moral responsibility within collective institutions. Progress requires consciously separating these domains, building integrative frameworks that respect the validity of *both* core insights, and directly confronting the nature of agency and responsibility within the specific collective action that is modern warfare. This won't make the debate disappear, but it can shift it from sterile stalemate to constructive engagement on how these vital but distinct moral demands interact in the tragic reality of war.
