  ### Decision Tree for Emergence Positions  
  Based on concrete cases, this tree sorts your commitments into specific positions. Answer each question with **A** or **B** based on your intuitive judgment of the cases. No prior jargon needed.

  ---

  #### **Branch Questions**  
  1. **Case 3 (Divergent Systems):** Two systems start identical at the micro-level (same particles, states) but later show different large-scale behavior (e.g., one forms a hurricane, the other doesn’t). Is this possible?  
     - **A: Yes, possible**  
     - **B: No, impossible**  

  2. **Case 5 (Traffic Jam Causation):** A traffic jam causes individual cars to slow down. If we have a complete micro-level story (e.g., each car’s physics), does the jam itself *also* cause things to happen?  
     - **A: Yes, the jam has causal power**  
     - **B: No, only the micro-events cause things**  

  3. **Case 1 (Simulation Pattern):** A large-scale pattern (e.g., predator-prey cycles) appears in two simulations with *entirely different* micro-rules, and we can’t derive it from either set of rules. Is the pattern reducible to the rules of each simulation?  
     - **A: Yes, reducible to each set of rules**  
     - **B: No, it transcends the rules**  

  4. **Case 4 (Derivation Exists):** A complete derivation of a macro-law from micro-theory exists (and checks out). Does this mean the macro-property is *nothing more* than the micro-properties?  
     - **A: Yes, nothing more**  
     - **B: No, it’s something more**  

  5. **Case 2 (Infinity Property):** A property (e.g., phase transition) appears *only* when parts grow infinitely (no finite system has it). Is this property real?  
     - **A: Yes, real**  
     - **B: No, just a mathematical trick**  

  6. **General Question (Explanation):** Even with a complete micro-explanation, are macro-explanations (e.g., "the traffic jam caused congestion") *indispensable* for understanding?  
     - **A: Yes, indispensable**  
     - **B: No, dispensable**  

  7. **General Question (Reality):** Are macro-properties (like "ecosystem stability" or "traffic jam") *real*, or just useful labels?  
     - **A: Real**  
     - **B: Useful labels, not real**  

  **Logical Space Size:** 7 binary questions → 128 possible combinations. Only 12 are occupied (named positions or coherent).  

  ---

  #### **Leaves (Positions)**  
  Follow the tree to your leaf. Each position includes:  
  - **Name** (or "unnamed")  
  - **Substantive description** (mapping to your initial list)  
  - **Most awkward commitment** (one-sentence critique)  
  - **Diagnosis for unoccupied combos** (why nobody holds it)  

  1. **Strong Emergence**  
     - *Path:* 1B, 2A, 3B, 4B, 5A, 6A, 7A  
     - Macro properties introduce new fundamental laws (e.g., "life force" beyond physics).  
     - *Awkward:* Violates causal closure of physics (micro-laws aren’t complete).  

  2. **Non-reductive Physicalism**  
     - *Path:* 1A, 2A, 3B, 4B, 5A, 6A, 7A  
     - Macro properties are real, causal, and don’t reduce to micro, but micro still governs all causation.  
     - *Awkward:* Macro causation exists but doesn’t "add" anything to micro-causation.  

  3. **Epiphenomenalism**  
     - *Path:* 1A, 2B, 3B, 4B, 5A, 6A, 7A  
     - Macro properties are real but causally inert (micro does all the work; e.g., "pain exists but doesn’t cause screaming").  
     - *Awkward:* Real properties with no causal role—why do they exist?  

  4. **Computational Emergence**  
     - *Path:* 1A, 2B, 3A, 4A, 5A, 6A, 7A  
     - Nothing metaphysically new; macro-states are just hard to compute/observe without running the system.  
     - *Awkward:* Macro properties are real and indispensable but causally inert.  

  5. **Eliminativism**  
     - *Path:* 1A, 2B, 3A, 4A, 5B, 6B, 7B  
     - Macro vocabulary is just compression/convenience; it doesn’t refer to anything real (e.g., "traffic jam" is shorthand, not a thing).  
     - *Awkward:* Must deny obvious realities (e.g., "jams aren’t real, just cars").  

  6. **Functionalism**  
     - *Path:* 1A, 2A, 3B, 4A, 5A, 6A, 7A  
     - Reduction works via functional roles (e.g., "pain" reduces to whatever plays the "pain-role" in a system, regardless of physics).  
     - *Awkward:* Macro properties reduce to micro, yet transcend specific micro-rules (via Case 1).  

  7. **Explanatory Emergence**  
     - *Path:* 1A, 2B, 3A, 4A, 5A, 6A, 7A  
     - Reduction succeeds completely, yet macro-explanations remain indispensable (e.g., you need "jam" to explain, even if it’s "just" cars).  
     - *Awkward:* Macro properties are reducible and causally inert, but explanations are irreplaceable.  

  8. **Weak Supervenience (Unnamed)**  
     - *Path:* 1B, 2B, 3B, 4B, 5A, 6A, 7A  
     - Macro properties are real, non-reducible, and not causal, yet emerge unpredictably from micro.  
     - *Awkward:* Real properties that don’t supervene firmly on micro and do nothing.  
     - *Diagnosis:* Unattractive (no reason to posit real properties that are inert and weakly tied to micro).  

  9. **Fictionalist Reduction (Unnamed)**  
     - *Path:* 1A, 2A, 3A, 4A, 5B, 6B, 7A  
     - Macro properties are real and causal, but infinite-limit properties are unreal, and macro-explanations are dispensable.  
     - *Awkward:* Macro is real/causal but not worth talking about?  
     - *Diagnosis:* Incoherent (if macro is real/causal, why are explanations dispensable?).  

  10. **Inconsistent Emergence (Unnamed)**  
      - *Path:* 1B, 2A, 3A, 4A, 5A, 6A, 7A  
      - Macro properties are fundamental and causal, yet reducible to micro.  
      - *Awkward:* Simultaneously fundamental and reducible.  
      - *Diagnosis:* Incoherent (reduction and fundamental emergence conflict).  

  11. **Nihilism (Unnamed)**  
      - *Path:* 1B, 2B, 3A, 4A, 5B, 6B, 7B  
      - Macro properties are unreal, reducible, and dispensable; infinite properties are unreal; divergence is possible.  
      - *Awkward:* If divergence is possible, why is macro unreal?  
      - *Diagnosis:* Unattractive (denies all macro-reality while allowing micro-indeterminism).  

  ---

  #### **Indistinguishable Leaves**  
  - **Non-reductive Physicalism (2)** and **Functionalism (6)** *cannot be separated* by these questions. Both answer 1A, 2A, 3B, 5A, 6A, 7A.  
    - *Resolution needed:* Add a case about **multiple realizability**. E.g., "If the same macro-property (e.g., 'learning') occurs in brains, computers, and aliens with different micro-stuff, is it *identical* across systems?"  
      - A: Yes (Functionalism) → Macro is role-based.  
      - B: No (Non-reductive Physicalism) → Macro is system-specific.  

  ---

  #### **Non-Diagnostic Case**  
  **Case 4 (Derivation Exists)** collapsed in practice:  
  - It only cleanly separates **Strong Emergence** (rejects reduction) from others.  
  - But for non-emergent positions (e.g., **Functionalism** vs. **Computational Emergence**), the *possibility* of derivation (Q4) doesn’t distinguish them—both accept derivability but disagree on causality/computation.  
  - *Why?* Derivation is a yes/no technicality; it doesn’t probe *how* reduction works (e.g., functionally vs. computationally) or causal/explanatory roles. Focus instead on Cases 1 and 5 to separate these.  

