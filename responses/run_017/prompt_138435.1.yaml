prompt: |-
  I teach a seminar on agency and free will, and there is a configuration I keep running into for which I have no word. It is not the flat stereotypy of the familiar wasp case — the animal that runs a routine to its end no matter what happens partway through. It is roughly the inverse: an agent who is genuinely flexible, who deliberates, learns, and revises plans in response to reasons, but whose flexibility is *scheduled*. Some standing rule settles when reconsideration is in order, and that rule is not itself up for reconsideration at the time it applies.

  Three instances. A colleague rewrites her syllabus from scratch at the start of every term and will not alter it during the term; asked what she would do if something genuinely syllabus-relevant happened in week five — a new edition, a two-week campus closure — she said, without any sense of paradox, that she would note it for next year. A friend resolved, after long reflection, to revisit his career plans only on his birthday, so as to keep the rest of the year free of second-guessing; last March something happened that he himself grants would have moved him had it happened in June, and he declined to think about it until June. And in the ethological material I have read, the same shape seems to recur as flexibility during the acquisition of a routine paired with rigidity during its execution, with nothing that revisits the switch between the two.

  I am after a term of art, if one exists, for rigidity at the meta-level — flexibility that is real but exercised only under a rule that is not itself flexible — and, more than the label, its carving. I take it this is not stubbornness or akrasia: in my cases the agent is not failing to do what she judges best, but following a judgment about when to judge. I take it to be more than the truism that no rule can govern its own application without regress, though I want to know how near to that it sits. What I most want clarified is the edge: does the structure count as rigidity at all if the higher-level rule is itself revisable at some other scheduled time, or does that merely relocate the problem one level up? And if it does merely relocate it, what would have to be true for the regress to terminate in something that is not itself rigid? A name alone would be of little use to me; that last question is why I care, since pointing to an agent's flexibility is the standard way of marking agency off from mechanism, and the flexibility always seems to rest on something that is not flexible.
reasoning: |-
  Okay, the user teaches a seminar on agency and free will and has encountered a specific configuration they call "rigidity at the meta-level." They describe agents who are flexible in deliberation and learning but only at scheduled times, with the scheduling rule itself not being revisable when it applies. They provide three examples: a colleague revising her syllabus only at the start of each term, a friend reassessing career plans only on his birthday, and ethological examples of flexible learning paired with rigid execution.

  The user is looking for a term of art that captures this concept. They've considered stubbornness or akrasia but feel these don't apply since the agents are following their own judgments about when to judge. They also recognize the regress problem in rule application but want to understand how close their cases are to this issue. Their deeper questions are about whether the structure still counts as rigidity if higher-level rules are revisable at other times and what would terminate the regress in something non-rigid.

  First, I need to recall philosophical concepts related to agency, rules, and meta-decision-making. The user's scenarios involve agents setting rules for when to be flexible, but those rules are fixed during their application. This resembles what Bratman calls "planning agency," where agents adopt plans to manage their future actions. The stability of plans is crucial here, as plans are designed to resist reconsideration to avoid constant reevaluation.

  The term "diachronic commitment" comes to mind, referring to commitments over time. The scheduling rule represents a commitment to not reconsider until a specified time. But is there a more precise term? "Temporal bracketing" might fit well—it's when an agent sets temporal boundaries for decision-making. This term appears in decision theory and philosophy of action, particularly in discussions about when to deliberate and when to act.

  Another concept is "procedural invariance," where the procedure for decision-making is fixed, even if the decisions themselves can change. This might capture the inflexibility of the scheduling rule. Bratman's "plan stability" emphasizes the non-revisability of plans during execution, which aligns with the syllabus and career plan examples.

  The ethological examples suggest "closed-ended learning periods," where flexibility is confined to specific phases. This is common in animal behavior, like imprinting or critical periods. The user might find this connection useful, especially if they're contrasting human and animal agency.

  Now, addressing the user's deeper questions: if the higher-level rule is revisable at another scheduled time, does that still count as rigidity, or does it just shift the problem? This points to a regress. For example, the colleague might have a rule to reconsider her revision rule only at year-end. This moves the rigidity up a level but doesn't eliminate it. The regress stops only if there's a point where the agent can revise without a pre-set rule, perhaps through unscripted reflection or external triggers. But that might undermine the whole structure they're describing.

  Terminating the regress requires either an arbitrary stopping point (which still involves rigidity) or a capacity for unscheduled meta-reflection, which introduces a different kind of flexibility. This touches on foundational issues in agency: can there be a rule that governs its own application without regress? Gödel's incompleteness and logical limitations might be relevant here, but that might be too abstract.

  The user's real concern is that flexibility in agency always relies on something inflexible, challenging the distinction between agency and mechanism. They need to show how agency can have a "stopping point" that isn't rigid in a problematic way. Maybe emphasizing that the meta-rule is adopted through prior rational deliberation helps. The agent isn't rigid per se but is adhering to a rational commitment made earlier. However, if the meta-rule isn't revisable at all, that could still seem mechanistic.

  Proposed terms: "temporal bracketing" seems the most fitting. It directly addresses the scheduling aspect. "Procedural invariance" and "diachronic commitment" are also strong. "Meta-rigidity" or "rule-entrenched flexibility" might be more accessible. I should also mention Bratman's "plan stability" as a key concept here.

  Finally, to address the edge cases: if higher-level rules are revisable at other times, it's still rigidity but at a higher level. The regress terminates only with a capacity for unscheduled critical reflection, which might be essential for full agency. However, this could lead to the very second-guessing the agents are trying to avoid. The tension here is between stability and responsiveness, a central issue in theories of planning and agency.
answer: |-
  Your query captures a profound tension in agency theory—**scheduled flexibility anchored in unscheduled rigidity**—and I'll address both the terminological gap and the conceptual core, focusing on your "edge" question about regress termination.

  ### Proposed Terms of Art
  1. **Temporal Bracketing of Agency** (Bratman-inspired):  
     Emphasizes partitioning time into phases for deliberation (flexible) vs. execution (rigid). The "bracket" itself is fixed once set.

  2. **Procedural Invariance** (Decision-Theoretic):  
     Highlights inflexibility in *when/how to decide*, despite flexibility in *what to decide*. The procedure (e.g., "only revise on birthdays") is invariant during its operational window.

  3. **Diachronic Commitment** (Bratman/Planning Theory):  
     Focuses on commitments to *not reconsider* during execution phases. The rigidity is a feature, not a bug, of planning agency.

  4. **Meta-Rigidity** (Your framing, philosophically precise):  
     Directly names the phenomenon: flexibility at the object-level (syllabus content) governed by rigidity at the meta-level (revision schedule).

  5. **Rule-Entrenched Flexibility** (Cognitive Science/ETH):  
     Reflects ethological cases: learning is plastic until "locked in," with the transition rule itself entrenched.

  **Why these fit**:  
  - They avoid conflating with *akrasia* (no failure of intention) or *stubbornness* (defiance of reason).  
  - They acknowledge the rule’s rationality (e.g., avoiding costly deliberation).  
  - They isolate the meta-level rigidity as the defining feature.

  ---

  ### Conceptual Carving: The Regress Problem
  Your core insight—**all flexibility rests on something inflexible**—touches a nerve in agency theory. Let's dissect:

  1. **Is it rigidity if higher rules are revisable later?**  
     Yes, but it **relocates rigidity upward**. Consider:  
     - Your colleague *could* have a meta-rule: "Re-evaluate my no-revision rule every 5 years."  
     - But this new meta-rule is *itself* rigid until Year 5. The structure persists, just at a higher tier.  

  2. **Terminating the Regress: What Would It Take?**  
     To avoid infinite regress, agency requires a **non-rule-governed capacity for critical reflection**. This is where philosophy splits:  
     - **Compatibilist/Procedural View** (e.g., Bratman): Regress stops at *practically reasonable* commitments. The meta-rule isn’t "rigid" if adopted via rational deliberation (e.g., your friend’s birthday rule minimizes anxiety). Rigidity is *functional*, not mechanistic.  
     - **Strong Agency View** (e.g., Sartre/Korsgaard): True agency requires *unscheduled* freedom to "step back" from any rule. If the meta-rule can’t be suspended mid-cycle (e.g., your friend ignoring March events), it’s covert mechanism.  
     - **Neuro-Ethological View**: Biology forces an endpoint. Neural "critical periods" close, and meta-rules (e.g., "migrate when day length <X") evolve to be inflexible for efficiency. Agency emerges *despite* this, via flexible rule-*formation*.  

  3. **Why This Isn’t Just "No Rule Governs Its Own Application"**  
     The truism focuses on *logical* regress (e.g., "this rule applies when I say it should"). Your cases involve *temporal* regress:  
     - Rules govern *when to be flexible*, but their *own temporal jurisdiction* is fixed.  
     - This creates **procedural blind spots**: The agent can’t question the rule *while operating under it*, even when reasons demand it (e.g., campus closure).  

  ---

  ### Why This Matters for Agency vs. Mechanism
  - **Standard View**: Flexibility = open-ended responsiveness → marks agency.  
  - **Your Challenge**: Flexibility is *scaffolded by inflexibility* → blurs the line.  
    - The wasp is rigid at *both* levels (fixed routine, no meta-deliberation).  
    - Your agents are rigid *only* at the meta-level—but that’s where the "switch" of agency lives.  

  **Resolution**: Agency may depend on **strategic self-binding** (Elster). The meta-rigidity is agential if:  
  - The rule was freely adopted (e.g., birthday deliberation).  
  - It serves coherence (e.g., preventing obsessive re-planning).  
  - *But*: If the rule is *never* suspendable (even for emergencies), it edges toward mechanism.  

  ---

  ### Key References
  1. **Bratman’s *Intention, Plans, and Practical Reason***: Plans as "filters" for options, with stability as essential.  
  2. **Elster’s *Ulysses and the Sirens***: Self-binding as agential, but risks "too much" rigidity.  
  3. **Dennett’s *Cognitive Wheels***: Bio-logical "fixed points" enabling higher flexibility.  
  4. **McGeer/Pettit on "Regulating Rules"**: Rules must be "alive to exceptions," but this risks regress.  

  **In short**: Call it **temporal bracketing** or **meta-rigidity**. The rigidity is real but agential if it’s a *self-imposed scaffold* for rationality. The regress terminates only in a capacity for *unscheduled critical reflection*—which your agents seem to lack *during the bracket*. That’s your seminar’s thorn: **When does stabilizing agency undermine it?**
