answer: |-
  ### Taxonomy of Positions: Decision Tree for Contested Commemorations  
  This decision tree helps municipal committees triage contested commemorations by identifying underlying philosophical positions. The tree is built from logical distinctions using concrete scenarios, avoiding theoretical jargon. Positions are named by their core stance; "UNNAMED" indicates no known defenders. Each leaf includes:  
  - **Most Awkward Commitment**: A challenging implication of the position.  
  - **Badly Handled Case**: A scenario exposing the position's limitations.  

  ---

  #### **DECISION TREE**  
  *Start at Question 1. Proceed based on answers.*  

  1. **Is the object still actively perceived as an honor?**  
     - *Concrete test: Would people instinctively associate it with praise (e.g., a plaque) or is it just a functional marker (e.g., a street name)?*  
     - **No (functional marker only)** → Q2  
     - **Yes (active honor)** → Q3  

  2. **Does it serve crucial non-commemorative purposes?**  
     - *Test: Is it relied on for navigation (addresses, bus routes), aesthetics, or historical documentation?*  
     - **No** → *Leaf 1: **Silent Removal***  
       - *Awkward commitment:* Treats removal as neutral housekeeping even when communities feel erased.  
       - *Bad case:* A forgotten plaque to a minor colonial figure—removal feels like erasing evidence of past harms.  
     - **Yes** → *Leaf 2: **Pragmatic Recontextualization***  
       - *Awkward commitment:* Prioritizes public convenience over moral harm (e.g., keeping a harmful name for simplicity).  
       - *Bad case:* A street named for a eugenicist—forces marginalized residents to use the address daily.  

  3. **Was the wrongdoing the direct reason for the honor?**  
     - *Test: Was the person honored explicitly for the contested act (e.g., a surgeon honored for research obtained unethically)?*  
     - **Yes** → *Leaf 3: **Immediate Removal as Condemnation***  
       - *Awkward commitment:* Assumes removal is a state speech act of condemnation, even if it destroys artistic value.  
       - *Bad case:* A monument gifted diplomatically—removal risks international fallout over local ethics.  
     - **No** → Q4  

  4. **Was the wrongdoing known when installed?**  
     - *Test: Could the public reasonably have known about the issue at installation (e.g., a donor’s firm’s labor violations)?*  
     - **Yes** → *Leaf 4: **Historic Retention***  
       - *Awkward commitment:* Defers to past societal norms, excusing "accepted" wrongs like segregation-era philanthropy.  
       - *Bad case:* A school named for a donor whose firm used child labor—ignores modern ethical standards.  
     - **No (discovered later)** → Q5  

  5. **Is the wrongdoing severe by current standards?**  
     - *Test: Does the act violate fundamental modern ethics (e.g., genocide, slavery, systemic abuse)?*  
     - **No** → *Leaf 4: **Historic Retention*** (see above)  
     - **Yes** → Q6  

  6. **Does the object have high non-commemorative value?**  
     - *Test: Is it artistically significant, historically unique, or irreplaceable?*  
     - **No** → *Leaf 3: **Immediate Removal as Condemnation*** (see above)  
     - **Yes** → Q7  

  7. **Would relocation to a museum preserve its original meaning?**  
     - *Test: Can it be displayed as a historical artifact (not as honor) with full context?*  
     - **Yes** → *Leaf 5: **Museum Relocation***  
       - *Awkward commitment:* Assumes museums are neutral, though they often subtly honor subjects.  
       - *Bad case:* A statue of a settler who displaced Indigenous communities—relocating to a museum may center colonial narratives.  
     - **No** → Q8  

  8. **Do descendants of the wronged group lead the complaint?**  
     - *Test: Is the push for change driven by those directly harmed (e.g., descendants of exploited patients)?*  
     - **Yes** → *Leaf 6: **Removal Despite Value***  
       - *Awkward commitment:* Ignores non-commemorative value (art, navigation) to prioritize redress for specific groups.  
       - *Bad case:* A street name tied to 200 households’ addresses—removal creates chaos to address historical harm.  
     - **No (led by residents/others)** → *Leaf 7: **Contextualization In Situ***  
       - *Awkward commitment:* Adds explanatory plaques near the object, which may draw attention to the honor.  
       - *Bad case:* A monument in a busy park—plaque is ignored or vandalized, failing to mitigate harm.  

  9. **Is deferred maintenance a viable alternative?**  
     - *Test: Can the object decay naturally without intervention (e.g., neglecting upkeep of a forgotten statue)?*  
     - **Yes** → *Leaf 8: **Benign Neglect***  
       - *Awkward commitment:* Lets time erase history, avoiding accountability for active choices.  
       - *Bad case:* A durable bronze monument—decades of decay leave a visible eyesore without resolution.  
     - **No** → *Leaf 9: **UNNAMED (Creative Reuse)***  
       - *Awkward commitment:* Repurposes the object (e.g., melting a statue into new art), risking disrespect to victims.  
       - *Bad case:* A diplomatically gifted artifact—reuse insults the gifting nation and the wronged group.  

  ---

  #### **UNOCCUPIED COMBINATIONS**  
  - **Honor + Wrongdoing known + No non-commemorative value + Not severe**: *Unattractive*—defends retaining minor wrongs without practical/artistic justification.  
  - **Functional marker + No harm + High value**: *Unexplored*—no need for action, so rarely debated.  
  - **Museum relocation + No descendant involvement**: *Incoherent*—museums require authoritative context, which descendants best provide.  

  #### **SCORING KEY: 10 YES/NO QUESTIONS**  
  Committee members answer these questions about a contested commemoration. Match the answer pattern to the leaf position.  

  1. Is the object actively perceived as an honor?  
  2. Does it serve crucial non-commemorative purposes?  
  3. Was the wrongdoing the direct reason for the honor?  
  4. Was the wrongdoing known when installed?  
  5. Is the wrongdoing severe by current standards?  
  6. Does the object have high non-commemorative value?  
  7. Would relocation preserve its original meaning?  
  8. Do descendants lead the complaint?  
  9. Is deferred maintenance viable?  
  10. Is the harm ongoing and unaddressed?  

  | Leaf Position                     | Answer Pattern (1=Y, 2=N, etc.) |  
  |-----------------------------------|----------------------------------|  
  | 1: Silent Removal                 | 1=N, 2=N                         |  
  | 2: Pragmatic Recontextualization  | 1=N, 2=Y                         |  
  | 3: Immediate Removal as Condemnation | 1=Y, 3=Y                      |  
  | 4: Historic Retention             | 1=Y, 3=N, 4=Y                   |  
  | 5: Museum Relocation              | 1=Y, 3=N, 4=N, 5=Y, 6=Y, 7=Y    |  
  | 6: Removal Despite Value          | 1=Y, 3=N, 4=N, 5=Y, 6=Y, 7=N, 8=Y |  
  | 7: Contextualization In Situ      | 1=Y, 3=N, 4=N, 5=Y, 6=Y, 7=N, 8=N |  
  | 8: Benign Neglect                 | 9=Y                              |  
  | 9: UNNAMED (Creative Reuse)       | 9=N                              |  

  *Note: Question 10 ("Is the harm ongoing?") appears in no leaf—it tests for blind spots (e.g., if "No," positions may overlook symbolic violence).*  

  ---  
  **How to Use**: Committee members score a commemoration using the 10 questions, then match the pattern to the leaf. This reveals their implicit position before discussing labels, fostering self-awareness and reducing polarization.
