answer: |-
  ## Project Proposal: Continuous Drift in Lewisian Conventions – A Philosophical-Modelling Collaboration

  **Project Title:** Modelling Normative Drift: Can Continuous Change Fit Lewis’s Discrete Framework?

  **Applicant:** [Your Name/Affiliation]
  **Host Institute:** [Institute Name]
  **Duration:** Six Months
  **Disciplines:** Philosophy of Language/Social Ontology, Cultural Evolution Modelling

  ### 1. The Core Problem: Drift vs. Discreteness
  David Lewis’s analysis of convention hinges on coordination equilibria sustained by common knowledge: agents prefer conformity conditional on others conforming, know this preference is shared, know *that* they know, and crucially, recognize a *specific alternative regularity* (R') that could have served the same purpose. This discreteness – a defined R vs. defined R' – underpins the common-knowledge condition. However, many socially significant norms exhibit "drift": continuous, incremental shifts in content (e.g., acceptable interruption levels, formality of address) where no single moment involves a clear deviation or switch to a distinct alternative R'. At each point, conformity appears stable; yet the endpoint differs radically from the start. This "drift problem" challenges the core discreteness presumed by Lewis and prevalent in evolutionary game-theoretic models of norm dynamics.

  **The Research Question:** Does normative drift fundamentally challenge the Lewisian account of convention by undermining the common-knowledge condition, or can it be adequately accommodated within existing frameworks through interpretation or model refinement?

  ### 2. Why Existing Moves are Insufficient
  *   **Rapid Sequence of Tiny Switches:** While technically possible in models, this move struggles empirically and conceptually. Empirically: Drift often lacks evidence of distinct "switch points" or conscious consideration of alternatives. Conceptually: It requires agents to constantly re-establish common knowledge about *new* micro-alternatives, which seems psychologically implausible and fails to capture the sense of a *single*, evolving norm. Does "eye contact norm circa 1950" constitute a distinct alternative to "eye contact norm circa 1950.1"?
  *   **Reclassification as Non-Convention (Habits, Standards):** This risks defining away the phenomenon. Many drifting norms (e.g., evolving politeness rules) function *exactly* like conventions in coordinating expectations and solving recurrent coordination problems. They exhibit stability-in-change and punishment for perceived deviations (even if the deviation threshold shifts). Denying them convention status abandons explanatory power for key social dynamics.
  *   **Handover to Semantics (Vagueness):** While vagueness is relevant (e.g., "rude" is vague), drift is distinct. Vagueness concerns borderline cases *within* a norm's application at a time. Drift concerns the *core content* of the norm changing *over* time. Semantic treatments of vagueness don't address the dynamic, evolutionary aspect of how the core meaning itself shifts continuously, nor how common knowledge persists through this shift.

  **The Gap:** None of these moves satisfactorily resolves the tension between the *continuous reality* of drift and the *discrete logic* of Lewis’s common-knowledge requirement. The possibility of **asymmetry** – where discreteness is crucial for *emergence* (via salience in a discrete strategy space) but dispensable for *maintenance* (allowing continuous adaptation within a stable coordination framework), or vice versa – remains underexplored and computationally untested.

  ### 3. Proposed Work Plan: A Collaborative Approach

  *   **Month 1: Problem Formalization & Literature Synthesis:**
      *   (Philosopher) Precisely articulate the drift problem against Lewis's criteria, formalizing the challenge to common knowledge under continuous change.
      *   (Philosopher + Modellers) Jointly review existing game-theoretic models of norm evolution, identifying assumptions about strategy discreteness and dynamics.
      *   Define key concepts: "drift," "stability," "common knowledge under fuzziness," "salience in continuous spaces."
  *   **Month 2: Model Specification & Asymmetry Hypothesis Development:**
      *   (Philosopher) Develop detailed philosophical arguments for/against asymmetry (e.g., salience requires discreteness; maintenance relies on expectations, tolerating fuzziness).
      *   (Modellers + Philosopher) Collaboratively design *two* core agent-based models:
          1.  **Standard Model:** Discrete strategy space (e.g., defined "interruption levels" 1-5), replicating existing approaches.
          2.  **Continuous Drift Model:** Strategy space as a continuum (e.g., "interruption intensity" 0.0-1.0). Implement mechanisms for incremental expectation shifts (e.g., reinforcement learning with noise, conformist bias towards local mean +/- tolerance).
      *   Define metrics: Convention stability, rate/content of drift, common knowledge "strength" (measurable via agent prediction accuracy of others' actions/expectations).
  *   **Month 3-4: Simulation, Analysis & Philosophical Scrutiny:**
      *   (Modellers) Run simulations of both models under varied parameters (population size, connectivity, noise, learning rates, selection pressures). Test emergence from randomness and drift from established states. Explicitly test the asymmetry hypothesis by varying "discreteness" in initial conditions vs. dynamic rules.
      *   (Philosopher) Analyze simulation outputs through the lens of Lewisian criteria:
          *   Does the continuous model exhibit stable coordination equilibria *without* a clearly defined R'?
          *   Can we identify a level of "expectation alignment" that functionally substitutes for discrete common knowledge?
          *   Does drift in the continuous model better capture the empirical phenomena than sequences of switches in the discrete model?
          *   Does the asymmetry hypothesis hold? (e.g., Does discrete initialization enable emergence that continuous alone cannot? Does continuous maintenance allow smoother drift than discrete updating?)
  *   **Month 5: Synthesis & Criteria Refinement:**
      *   (Philosopher + Modellers) Integrate findings. Does continuous drift fit within a modified Lewisian framework, or necessitate a distinct account (e.g., "graded conventions")?
      *   (Philosopher) Develop refined criteria for "conventionhood" that can accommodate continuous drift if necessary (e.g., focusing on dynamically stable expectation alignment solving coordination problems, relaxing the requirement for a *specific*, discrete R').
      *   Assess implications for norm ontology and cultural evolution theory.
  *   **Month 6: Dissemination & Drafting:**
      *   Prepare a joint philosopher-modeller working paper presenting the problem, models, results, and philosophical conclusions.
      *   Outline a target journal article (e.g., *Philosophy of Science*, *Biological Theory*).
      *   Present findings at an internal institute seminar.

  ### 4. Why Philosophy + Modelling? Why Not Just More Simulations or Surveys?
  *   **Core Problem is Conceptual:** The challenge to Lewis is fundamentally philosophical – about the *definition* and *necessary conditions* of convention. Simulations can show what dynamics *are possible*, but cannot determine if those dynamics *satisfy Lewis's conceptual criteria*. Philosophical analysis is essential to interpret model outputs within the theoretical framework.
  *   **Modelling Informs Philosophy:** Existing models assume discreteness. Building and analyzing continuous models forces concrete engagement with the conceptual problem, revealing whether Lewisian common knowledge *can* emerge or function in a continuous world. Simulations provide "existence proofs" and highlight boundary conditions.
  *   **Surveys Don't Address the Mechanism:** Ethnographic or historical surveys can document drift but cannot adjudicate whether the underlying mechanism involves micro-switches, continuous adaptation, or something else. They also cannot test the common knowledge condition directly. Modelling provides a controlled environment to isolate mechanisms.
  *   **Collaboration is Key:** Philosophers provide the conceptual precision and framework; modellers provide the tools to explore dynamics rigorously. Neither alone can resolve the drift problem effectively.

  ### 5. Deliverables & Success/Failure Criteria
  *   **Deliverables:**
      *   Two formalized agent-based models (discrete & continuous drift).
      *   Simulation datasets and analysis.
      *   A working paper (co-authored).
      *   A draft article manuscript.
      *   Seminar presentation.
  *   **Success (For Both Audiences):**
      *   *Philosophers:* A clear, argued position on whether Lewis's framework can accommodate drift (via asymmetry or modification) or needs significant revision, backed by model insights.
      *   *Modellers:* Novel, rigorously tested models of norm dynamics incorporating continuous change, demonstrating the feasibility (or not) of stable coordinated drift, and clarifying the role of strategy space discreteness.
      *   *Both:* A collaborative framework for addressing conceptual challenges in social evolution with computational tools.
  *   **Failure (Observable Outcomes):**
      *   The continuous model fails to produce any stable coordination (drift is just chaos).
      *   The continuous model only produces drift reducible to identifiable micro-switches within the simulation, validating the "rapid sequence" move.
      *   Philosophical analysis concludes the continuous model's outputs demonstrably *lack* the core features Lewis deemed essential for convention (e.g., no functional analogue to common knowledge emerges), even if coordination occurs.
      *   The asymmetry hypothesis proves intractable or irrelevant to the core problem.
      *   The models remain too simplistic to capture the phenomenon meaningfully.

  ### 6. Feasibility Assessment: Six Months vs. Dissertation
  This is genuinely a focused, six-month project, **not** a disguised dissertation.
  *   **Scope:** It targets a *specific conceptual problem* (drift vs. Lewisian discreteness) using a *defined methodological approach* (collaborative model building/analysis). It doesn't aim for a comprehensive theory of norms or cultural evolution.
  *   **Focus:** The asymmetry hypothesis provides a crucial narrowing lens. Testing it offers a concrete pathway to answering the main question.
  *   **Foundation:** The applicant possesses the necessary philosophical background (Lewis, conventions). The modelling work is collaborative, leveraging modellers' expertise.
  *   **Deliverables:** The outputs (models, working paper) are achievable within six months of intensive collaboration. The project builds a foundation for future work (e.g., exploring specific historical drifts, incorporating more complex learning) but constitutes a complete, free-standing investigation.
  *   **Risk Mitigation:** The explicit failure criteria allow for meaningful negative results. Even demonstrating that Lewis’s framework *cannot* accommodate drift without significant revision is a valuable outcome.

  This project leverages the unique environment of the institute to address a fundamental tension at the intersection of philosophy and cultural evolution: Can our best theory of social conventions make sense of how they actually, gradually, change?
