  ## Terms of Engagement: Consensus Matrimony Arbitration Services (CMAS)

  **1. Parties and Scope:**  
  This Agreement governs the resolution of Disagreements (defined as disputes concerning factual propositions) between signatory Parties ("Client A" and "Client B") who assert, contest, or are provisionally deemed Epistemic Peers pursuant to Clause 2. Services rendered by CMAS ("the Service") constitute binding epistemic adjustment upon full payment of fees.

  **2. Epistemic Peer Certification (EPC):**  
  2.1. Prior to substantive Disagreement resolution, Parties must mutually certify each other as Epistemic Peers. Epistemic Peer status requires: (a) approximate equivalence in relevant cognitive faculties; (b) equivalent access to evidence germane to the Disagreement; (c) equivalent demonstrable diligence in evidence processing; and (d) the absence of disqualifying bias materially impacting the Disagreement.  
  2.2. Should mutual certification under Clause 2.1 fail, the question of Epistemic Peer status concerning the *original* Disagreement is automatically registered as a Level 1 EPC Disagreement.  
  2.3. Resolution of a Level `N` EPC Disagreement requires mutual Epistemic Peer certification *for that Level `N` Disagreement*. Failure thereof generates a Level `N+1` EPC Disagreement.  
  2.4. Fees for EPC resolution accrue independently per Level (Schedule A). Resolution of the highest-level pending EPC Disagreement is prerequisite for addressing any lower-level Disagreement.

  **3. Core Conciliation Procedure (CCP):**  
  3.1. Subject to successful Level 1 EPC certification for the substantive Disagreement, Parties shall adjust their Credence concerning proposition P to the arithmetic midpoint of their initially reported Credences (C_A and C_B). The Adjusted Credence (C_ADJ) = (C_A + C_B)/2.  
  3.2. **Self-Application Surcharge:** Should the Parties disagree on whether the CCP applies to the substantive Disagreement or any EPC Disagreement, this applicability dispute is treated as a secondary Disagreement ("CCP Applicability"). The CCP is applied recursively to CCP Applicability Disagreements. Final settlement approaches the midpoint of the midpoint (C_ADJ_ADJ = (C_ADJ_Applicability + C_ADJ_Substantive)/2, etc.). Surcharge: 20% per recursion (Schedule A).

  **4. Evidence Independence Rider (EIR):**  
  4.1. Adjustments mandated under Clause 3 are contingent upon the Parties' initial Credences being formed on the basis of *Independent Evidence*. Evidence is Independent only if Parties can demonstrate they arrived at their Credence without prior shared discussion, access to identical non-public source materials, or mutual influence concerning P.  
  4.2. Where evidence is not demonstrably Independent, or where Parties acknowledge evidence has not been fully pooled, the CCP adjustment under Clause 3 is suspended pending Evidence Pooling ("EP").  
  4.3. **Default Opt-Out:** Parties may waive the EP requirement under Clause 4.2 by initializing here: \_\_\_\_\_\_\_\_\_ (Client A) \_\_\_\_\_\_\_\_\_ (Client B). Waiving EP constitutes acceptance of potential non-Independence and immediate applicability of Clause 3. (Waiver is recommended for efficiency; non-waiver incurs EP facilitation fees - Schedule A).

  **5. Premium Resolution Packages:**
      5.1. **Right Reasons (RR) Package:** For triple the Standard CCP Fee (Schedule A), Parties may submit Statements of Reasons (SoR) supporting their initial Credence. CMAS will securely receive, timestamp, and archive SoRs unread. Parties are then permitted to revise their Credence based *only* on their assessment of the *other Party's SoR*, not the mere fact of disagreement. Final Credence adjustment remains governed by Clause 3 relative to *post-SoR* Credences. CMAS assumes no liability for the quality of reasoning within SoRs.
      5.2. **Steadfast (SF) Option:** For quadruple the Standard CCP Fee (Schedule A), Parties may elect to maintain their initial Credence despite the disagreement, conditional on successful Level 1 EPC certification and completion of mandatory bias-awareness training (fee separate). **Spinelessness Disclaimer:** CMAS notes that consistent conciliation across all disagreements leads to credence dissipation. We offer Residual Conviction Storage (RCS) at a monthly rate (Schedule A) to safeguard against total doxastic collapse.

  **6. Prohibition on Bootstrapping:**  
  6.1. Parties are strictly prohibited from concluding the other Party is *not* an Epistemic Peer *based solely on the existence of the Disagreement* and subsequently maintaining their original Credence on that basis.  
  6.2. CMAS Auditors monitor compliance. Auditors are contractually required to hold Credences concerning all client propositions at the prevailing global midpoint derived from all resolved CMAS cases.  
  6.3. **Auditor Constraint Notice:** Due to the averaging effect in Clause 6.2, CMAS Auditors possess only moderate confidence in all factual propositions, including operational matters like package tracking. Inquiries regarding shipment status cannot be reliably confirmed.

  **7. Fee Schedule (Schedule A):**
      *   Level 1 EPC Certification: $450
      *   Level `N` EPC Certification (N>1): $450 * 1.5^(N-1)
      *   Standard CCP (Clause 3.1): $800
      *   CCP Self-Application Surcharge (per recursion): 20% of base CCP fee
      *   EP Facilitation (if not waived under Clause 4.3): $600
      *   RR Package: $2400
      *   SF Option: $3200 + Bias Training ($350)
      *   Residual Conviction Storage (RCS): $75/month (min. 6 months)

  **8. Resolution of Non-Interval Disagreements:**  
  8.1. For Disagreements involving mutually exclusive propositions lacking a meaningful credence midpoint (e.g., "Burial" vs. "Cremation"), the CCP (Clause 3) requires interpolation.  
  8.2. The Service shall deterministically select a compromise outcome positioned at the logical midpoint between the contested propositions, as defined by standard ontological averaging protocols.  
  8.3. **Example Resolution:** For P1: "Burial" and P2: "Cremation", the compromise outcome pursuant to Clause 8.2 is: **Simultaneous partial interment and partial incineration, with the division ratio set at 50:50 unless recursive surcharges apply (Clause 3.2).** Parties agree this outcome constitutes full and final settlement under CMAS logic.

