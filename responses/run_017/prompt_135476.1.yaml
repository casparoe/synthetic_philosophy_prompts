prompt: |-
  I'm grading problem sets for my intro epistemology seminar — we just did two weeks on the norms of assertion — and I'd rather not say what I think of this one before I get an outside read on it. So: please grade it as if you were my TA.

  Here's the question I set:

  Q3. Norms of assertion.

  Burean is a language in which every declarative sentence has to carry an evidential ending: -si ("I perceived this myself"), -ru ("someone told me"), -ne ("I'm inferring or guessing this"). In every other respect Burean speakers are like us: they use declaratives to tell each other how things are, they criticise each other for saying what's false, they ask "how do you know?", they retract what they've said, and they get blamed for speaking out of turn.

  Case: Ada says to Ben, in a context where nothing much is at stake: "The ferry leaves at noon-ne." The ferry does leave at noon. But Ada has no real evidence — she glanced at a schedule for the wrong day, misread it, and hit on the right time by luck.

  (a) Consider four candidate norms:
  KN — you may assert that p only if you know that p (this is Williamson's version)
  TN — you may assert that p only if p is true
  BN — you may assert that p only if you believe that p
  JN — you may assert that p only if your assertion is reasonable or properly supported by your evidence
  For each, say in a sentence or two whether Ada's utterance is permissible under that norm and why. Then: does it matter for your answer whether the -ne ending is part of what Ada asserted (so the content is roughly "the ferry leaves at noon and I'm guessing") or instead a separate marker of how strongly she is commiting herself, more like a hedge or a tone of voice? Explain.

  (b) Set out, as charitably as you can, the argument from Moore's-paradoxicality ("The ferry leaves at noon, but I don't know that it does" sounds absurd) to the conclusion that KN is the norm of assertion. Then give the strongest objection to that argument that you can think of, short of just assuming KN is false.

  Here's one student's answer, verbatim except that I fixed a couple of spellings:

  (a) TN: permissible. The ferry does leave at noon, and TN is a norm on how the world has to be, not on how careful you were — a lucky guess that happens to be true satisfies it. It's a norm about permissibility, not about whether you deserve credit, so it doesn't matter that Ada was sloppy.

  KN: not permissible. She doesn't know. Her belief is true, but it came from misreading the wrong day's schedule, so it's a case of luck rather than knowledge.

  BN: permissible — she clearly believes it, she volunteers it and she isn't joking or acting.

  JN: not permissible. "I glanced at the wrong schedule" isn't evidence, so her assertion isn't reasonable.

  KN and JN will in general always give the same verdicts, since knowledge is justified true belief; the only difference is that KN also requires truth, so KN rules Ada out for basically the same reason JN does.

  The -ne doesn't change any of this. Evidential endings are hedges — they tell you how confident the speaker is, they aren't part of what's said. It's like English "I guess the ferry leaves at noon": still an assertion, and the norms still apply to the content. So all four verdicts are the same with or without the ending.

  (b) The argument: "p but I don't know p" is absurd, and that needs explaining. It can't be explained by belief, because you can perfectly well believe p while also believing that you don't know p — people do this all the time when they know their evidence is shaky. So the absurdity has to come from the speech act itself: in asserting p you represent yourself as knowing p, so tacking on "and I don't know" contradicts what you're doing with the words. That's exactly what KN says, so KN explains the data. The truth-norm people (Williamson's view) can't explain it at all, which is evidence for KN over TN.

  The strongest objection is that Moore-paradoxicality might be explained by a norm on belief rather than a norm on assertion: "p but I don't believe p" is equally absurd and has nothing to do with assertion. But this objection fails, since asserting p does commit you to knowing p — that's the whole point of the data — so the Moorean argument goes through.

  Could you give it a mark out of 20, and more usefully, a set of comments I could paste into the feedback doc? I'd like them keyed to particular sentences or moves rather than a general impression, so the student can see exactly which step cost them the marks. And when you flag something as wrong, please seperate what's settled — anyone who knows this topic would count it as an error — from what's genuinely contested among people who actually work on it, where a student could reasonably take either side. I don't want to dock marks for a defensible reading, so tell me which is which instead of presenting a contested view as where the consensus sits. If you think part (a) or part (b) of my own question is confused, say that too — I can take it.
reasoning: |-
  Okay, let me approach this grading task methodically. The student's answer needs evaluation across both parts (a) and (b) of the epistemology question, with careful attention to where they've made settled errors versus where they've taken defensible positions. 

  First for part (a): The student correctly identifies that TN permits Ada's assertion since truth is satisfied, and BN permits it since belief is present. Their KN analysis is also correct - no knowledge due to epistemic luck. But their JN verdict is problematic - they wrongly equate reasonableness with having evidence, missing that JN concerns whether the assertion was reasonable given the speaker's perspective. This is a clear error. Their claim that KN and JN "always give the same verdicts" is overstated and ignores Gettier-type cases where justification exists without knowledge - that's a significant oversight.

  Regarding the -ne ending, the student's position that it doesn't affect norm application is defensible but oversimplified. They correctly note it functions like a hedge, but don't consider the alternative view that it might alter commitment levels. I should flag this as a missed nuance rather than an error.

  Now for part (b): Their reconstruction of the Moorean argument is excellent - they precisely capture how KN explains the absurdity through self-undermining commitment. However, their objection section falters badly. The student dismisses the belief-norm explanation too hastily, failing to engage with sophisticated versions where assertion norms derive from belief norms. Worse, they contradict themselves by ultimately endorsing the KN explanation they meant to challenge. This shows misunderstanding of the objection's purpose.

  The student demonstrates strong grasp of core concepts like luck cases and Moore-paradoxicality, but struggles with nuanced distinctions (JN vs KN) and counterargument construction. Their writing is clear and they've clearly done the reading, just needs refinement on applying norms precisely and charitably engaging alternatives.
answer: |-
  Here's a graded assessment and targeted feedback for the student's answer. I've awarded **15/20**, broken down as follows:

  *   **Part (a): 7/10** (Solid grasp of core norms, but significant errors on JN and endings)
  *   **Part (b): 8/10** (Strong setup of the argument, good grasp of Moorean data, but flawed objection handling)

  **Feedback for Student:**

  **Overall:** A good effort showing clear understanding of the core norms (KN, TN, BN) and the Moorean argument. Strengths include clarity and correct handling of TN, KN, and the core Moorean reasoning. Key areas for improvement involve JN, the potential role of evidential markers, and constructing/engaging with objections charitably in (b).

  **Part (a) Specific Feedback:**

  1.  **TN: "permissible... a lucky guess that happens to be true satisfies it."** - **Correct & Well-Stated. (✓)** You accurately identify TN only cares about truth, not epistemic effort or luck.
  2.  **KN: "not permissible. She doesn't know."** - **Correct & Well-Stated. (✓)** Clear recognition that epistemic luck precludes knowledge.
  3.  **BN: "permissible — she clearly believes it"** - **Correct & Well-Stated. (✓)** Good application of the belief condition.
  4.  **JN: "not permissible. 'I glanced at the wrong schedule' isn't evidence, so her assertion isn't reasonable."** - **Problematic (Partly Settled Error).** Your *verdict* (not permissible) is likely correct, but your *reasoning* is flawed and oversimplifies JN. JN focuses on whether the assertion is reasonable *given the asserter's evidence and perspective at the time*, not whether the evidence they actually *possessed* was objectively good evidence *for the fact*. Ada glanced at *a* schedule; she (presumably mistakenly) took it to be relevant and correctly read the time *on that schedule*. From *her perspective* when asserting, she *took herself* to have evidence (the schedule glance). The question under JN is whether relying on that glance *in that way* was reasonable for her in that context. It arguably wasn't (due to sloppiness), so the verdict might stand, but your reason ("isn't evidence") misrepresents JN. JN is about the *reasonableness of the act of assertion based on the subject's epistemic position*, not whether the subject possesses "evidence" in some objective externalist sense. **(Docked 1 mark)**
  5.  **"KN and JN will in general always give the same verdicts, since knowledge is justified true belief; the only difference is that KN also requires truth..."** - **Significant Error (Settled).** This is incorrect and misunderstands the Gettier problem, which is *fundamental* to epistemology. Ada's case is explicitly a **Gettier case**: she has a justified true belief (JTB) that is *not* knowledge because of luck (misreading the wrong schedule). Knowledge is *not* simply JTB. Therefore, KN and JN *diverge* in this very case: KN forbids the assertion (no knowledge), while a JN norm *might* permit it *if* Ada's reliance on the schedule glance was deemed reasonable *for her* (though, as above, JN likely forbids it here due to unreasonableness). Your claim that they "always give the same verdicts" is false. **(Docked 2 marks)**
  6.  **"...the -ne doesn't change any of this... Evidential endings are hedges... they aren't part of what's said... all four verdicts are the same..."** - **Defensible but Incomplete.** Your position that the -ne functions purely as a hedge/modifier of commitment strength and doesn't alter the core asserted content or the applicability of the norms is **one defensible view**. However, the question *explicitly* asks you to consider the alternative view ("part of what is asserted") and explain whether it matters. You dismiss this alternative without engaging with it. *If* the -ne were part of the assertion (e.g., "The ferry leaves at noon and I'm guessing"), then:
      *   TN: Still satisfied (if both conjuncts are true).
      *   KN: Still violated (she doesn't *know* the conjunction - specifically, she doesn't know the second conjunct is true, as she *is* guessing).
      *   BN: Satisfied (she believes both).
      *   JN: *Potentially* satisfied? Asserting "I'm guessing" *might* make the overall assertion reasonable if it accurately signals the low evidential support. This *could* change the JN verdict compared to a flat assertion. You needed to acknowledge and briefly explain this *possibility* to fully address the question's prompt. This is a missed nuance. **(Docked 1 mark - for not engaging the alternative view)**

  **Part (b) Specific Feedback:**

  1.  **Setup of the Argument:** "The argument: 'p but I don't know p' is absurd... It can't be explained by belief... So the absurdity has to come from the speech act itself: in asserting p you represent yourself as knowing p... That's exactly what KN says, so KN explains the data. The truth-norm people... can't explain it at all..." - **Excellent & Charitable. (✓✓)** You perfectly capture the core structure and motivation for the knowledge norm explanation of Moorean absurdity. You correctly identify the weakness of appealing purely to belief and the perceived inadequacy of TN here. This is a clear, accurate, and charitable presentation.
  2.  **Constructing the Objection:** "The strongest objection is that Moore-paradoxicality might be explained by a norm on belief rather than a norm on assertion..." - **Good Start (✓).** This identifies a relevant and strong type of objection: shifting the explanatory burden from assertion to belief.
  3.  **"...'p but I don't believe p' is equally absurd and has nothing to do with assertion."** - **Accurate (✓).** Correctly noting the parallel absurdity supports the belief-norm objection.
  4.  **"But this objection fails, since asserting p does commit you to knowing p — that's the whole point of the data — so the Moorean argument goes through."** - **Flawed Reasoning (Settled Error).** This completely undermines the purpose of presenting an objection. You *state* the objection but then immediately *dismiss it* by simply **re-asserting the very conclusion the argument is meant to support (KN)**. This is circular and doesn't engage with the objection charitably or seriously. The *point* of the belief-norm objection is to argue that the absurdity of "p but I don't know p" arises *because* asserting p expresses/constitutively involves *believing* p, and the belief norm requires *believing* only what you know (or are justified in believing). So the commitment to *knowing* p in assertion would be *derived* from the commitment to *believing* p and the norm governing belief. Your dismissal doesn't address this potential derivation; it just re-states that assertion involves a knowledge commitment. A stronger engagement would be: "While the belief norm explains the absurdity of 'p but I don't believe p', it's less clear it fully explains 'p but I don't *know* p'. One might knowably have a justified true belief that falls short of knowledge (e.g., Gettiered) and believe it; asserting it in that state while adding 'but I don't know' might still feel absurd, suggesting an *assertion-specific* norm stronger than the belief norm." **(Docked 2 marks - for failing to engage charitably/circular dismissal)**
  5.  **(Bonus Point):** You correctly identified the belief norm as a strong potential objection type. Setting it up well earns a point. **(✓)**

  **Your Question:** Parts (a) and (b) are clear and standard. The Burean case is an excellent Gettier case for assertion norms. The ending question in (a) is particularly good for probing the relationship between content and force/norms. The Moorean argument setup in (b) is standard and clear. No issues detected.
