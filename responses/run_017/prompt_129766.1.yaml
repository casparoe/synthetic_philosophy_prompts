  **Section 1: Basis for Appeal (Select ONE ONLY):**

  ☐ **Route A: Identity Claim.** I contend that I am numerically identical to the physical cause **P** credited for **E**. My distinct higher-level designation is merely notational/conventional. *If successful: Causal standing is reinstated, but only under the physical designation **P**. Your distinct higher-level property designation will be retired from all registries.*

  ☐ **Route B: Overdetermination Claim.** I contend that **E** was genuinely causally overdetermined. Both **P** and I were independently sufficient causes of **E** in this specific instance. *If successful: Causal standing may be reinstated for this specific **E** only. Note: Approval requires demonstrable evidence of *non-systematic*, *exceptional* redundancy. Routine, realization-dependent overdetermination does not qualify under NSPP guidelines. (Attach Evidence of Independent Sufficiency - Form BCA/DMA-114-R-SUP)*

  ☐ **Route C: Proportionality Claim.** I contend that the physical cause **P** credited for **E** is mis-specified. **P** is too fine-grained relative to the coarse-grained nature of **E** (e.g., grasping aspirin). I, as a coarser-grained difference-maker, am the proportionate cause of **E**. *If successful: Requires demonstration that a *specific*, less fine-grained physical alternative to **P** would *not* have caused **E**, while your presence still would have. (Attach Proportionality Variance Report - Form BCA/DMA-114-R-PROP)*

  **Section 2: Mandatory Residual Causal Standing Declaration (Per NSPP):**
  After the full causal sufficiency of **P** for **E** is formally debited, please declare your Residual Causal Standing (RCS) for **E**:
  My RCS for **E** is: _______ CU (Causal Units). *(Note: Declarations of RCS > 0.0 CU require detailed justification on Supplementary Form BCA/DMA-114-R-RCS, demonstrating mechanism of non-redundant causal influence beyond **P**'s sufficiency.)*

  **Signature of Claimant (Property/Designation):** _________________________  
  **Date:** _________________________

  *(Submit completed form to: Bureau of Causal Affairs, Dept. of Metaphysical Accounting, Appeals Intake, P.O. Box 0, Capital of Necessity)*

