  The operational activities of the Bureau of Causal Affairs, including the execution of Causal Settlement Procedures (CSPs), the calculation of Residual Causal Standing (RCS), and the processing of Forms BCA/DMA-114-R, are fully discharged by the lawful microphysical interactions of its accredited staff members and computational systems, operating within established physical parameters. No higher-level causal dynamics beyond these microphysical processes are implicated in Bureau functions.
