prompt: |-
  I teach a third-year seminar on philosophy of economics — 16 students, every one of whom has taken intermediate microeconomics and almost none of whom has taken philosophy — and I have a single 80-minute session to spend on revealed preference and the question of what utility actually is. Last year I ran a version of this as a worksheet of hypothetical choices and it fell completely flat: the students could already write down a Lagrangian, so nothing surprised them, and the discussion collapsed into whether the formalism was "realistic." What I want this time is for them to run into the problem before it has a name. Specifically, I want them to feel three things: first, that assigning someone a utility function is an act of encoding what they did, not a discovery of a hidden quantity they were consulting; second, that this encoding buys genuine predictive power only if the recorded choices hang together in a particular way, and that one small, ordinary change in how the options are presented is enough to break that coherence for most of the room; third, that once it breaks there are exactly three ways out and each of them costs something — declare the chooser irrational, re-describe what was really being chosen so that the data is no longer a counterexample, or loosen the fit until almost any behaviour counts as rational after all — and that the philosophical interest lives in that trilemma rather than in the axiom. Nobody should hear the words utility, revealed preference, or WARP, or see any axiom, until the debrief; the point has to arrive as something that happened to them. Materials are limited to a flat seminar room with a projector, index cards, pens, and a supermarket bag of snacks I am willing to spend.

  My rough skeleton, which you should feel free to improve or replace: real stakes — students make a series of choices over bundles of actual snack items using a token budget and keep whatever they end up with, so the choices are not hypothetical. Then their choice records get handed to a partner who has to reconstruct a utility function from them and predict what the chooser will pick from a budget set they have not seen; correct predictions earn the predictor a bonus item. I am hoping two different detectives will produce obviously different numbers for the same data and yet make identical predictions, which is where the first idea lands. The same set of recorded choices then has to survive a comparison of two rounds that are, unbeknownst to the choosers, the same budget with the same prices — one presented with an extra option that nobody would ever take, one presented with a default already ticked — and this is where the house of cards should come down. If it works, the room is then forced to pick one of the three escape routes, and I would like them to have to argue for it in pairs rather than be told about it.

  What I need from you is the runnable version of that: the setup and materials, the round structure with the budget lines I should actually use, the sabotage, the forced choice between the three escapes, and then a debrief that maps specific moments in the session onto specific parts of the idea — including how I name it only at the end without it feeling like a punchline. Please also tell me what will predictably go wrong the first time I run it: the students who stay perfectly consistent and leave me without a counterexample, the ones who treat it as a game to be gamed, the ones who will notice the manipulation and feel tricked, and anything about using food as an incentive that I have not thought through. Be frank, finally, about what the activity cannot do: my sense is that it can show that utility-talk and choice-talk are intertranslatable under certain conditions, but that it cannot by itself reach the question of whether preference is something choices reveal or merely something we define them to be, nor the separate question of whether what people choose is what is good for them, and that those have to be supplied by me in the debrief — tell me if I have that wrong, and tell me the shortest honest way to say it. I have about 15 minutes of debrief, not more. Please reply as exactly eight numbered items, each two or three sentences long, with no headings, no introduction and no summary; I will be reading it off my phone in the ten minutes before class.
reasoning: |-
  We are designing an 80-minute session for a third-year seminar on philosophy of economics. The goal is to have students experience the conceptual problems of revealed preference theory without prior exposure to the terminology. The activity should lead them to feel three things: (1) utility functions are encodings of choices, not discoveries; (2) predictive power requires coherence in choices, which is easily broken by presentation; (3) when coherence breaks, there are three costly escape routes.

  The plan involves real choices with snacks, partners reconstructing utility functions, and then a manipulation to break consistency. The debrief should map the activity to the concepts and introduce the terminology only at the end.

  We are to provide eight numbered items, each 2-3 sentences, with no headings or summary.

  Considerations:
  - Materials: projector, index cards, pens, snacks (with a budget for the activity).
  - Students: 16, with intermediate microeconomics but little philosophy.
  - Avoid terms: utility, revealed preference, WARP until debrief.

  Structure:
  1. Setup: Explain the activity (without giving away the purpose). Distribute tokens and snack menus. Students make choices in several rounds.
  2. Round 1: Simple choices to record.
  3. Round 2: Detectives (partners) try to model the choices and predict for a new round.
  4. Round 3: Introduce a manipulation (an irrelevant option or a default) to break consistency.
  5. Forced choice: When inconsistency arises, have students argue in pairs for one of the three escapes (without naming them as such).
  6. Debrief: Connect the experience to the concepts, name the terms, and discuss the trilemma.

  Potential pitfalls:
  - Some students might be perfectly consistent (so have a backup plan).
  - Some might try to game the system (emphasize real consequences: they keep the snacks).
  - Students might feel tricked (so debrief honestly about the purpose).
  - Food incentives: allergies, dietary restrictions? (Have non-food options? Or ask in advance.)

  Let's break down into the eight items:

  1. **Setup (5 min):** Distribute index cards (as tokens) and a menu of snacks with prices (e.g., apple=2 tokens, chocolate=3, chips=1, etc.). Explain: "You'll make choices in several rounds. You keep what you choose. Each round you get a budget (e.g., 5 tokens) and see a set of affordable bundles. Write your chosen bundle on a card. We'll do 3 rounds."

  2. **Round 1: Baseline choices (10 min):** Present a budget set (e.g., 5 tokens). Students choose a bundle. Collect the choice cards. Then present a second budget set (e.g., 7 tokens, same prices). Collect choices. (This gives two data points per student.)

  3. **Round 2: Detective work (15 min):** Pair students. Hand each pair the choice records of one student (from Round 1). Give them a new budget set (e.g., 6 tokens, same prices) and ask: "Predict what your partner would choose in this new situation. If you get it right, you both get a bonus snack." Let them work (5 min), then have each pair report. Highlight cases where different models (utility functions) led to the same prediction (to show encoding, not discovery).

  4. **Round 3: The sabotage (15 min):** Without revealing it's the same budget, split the room. Half get a set with an irrelevant option (e.g., a rotten banana for 0 tokens) and no default. The other half get the same prices and budget but with a default bundle pre-selected (e.g., "most people choose this"). Budget is 5 tokens as in Round 1. Collect choices.

  5. **Reveal inconsistency (5 min):** Project the choices from Round 1 and Round 3 for the same budget. Show that many changed. Note: For students who didn't change, use them as examples of consistency (but the majority will likely change). Point out: "Same budget, same prices, but different choices? What happened?"

  6. **Forced choice in pairs (10 min):** Pose: "When choices change based on presentation, how should we model the person? Discuss in pairs and come up with one solution." (Do not provide the three escapes; let them generate ideas.) Then have a few pairs report. Guide if necessary toward: (a) call them irrational, (b) say the presentation changed what was chosen (e.g., the default was part of the option), (c) say any choice is fine so the model doesn't need consistency.

  7. **Debrief part 1: The concepts (10 min):** Connect: "What you did as detectives was assign a hidden number (utility) to each bundle to explain choices. But when the same budget led to different choices, that broke the pattern. We have three ways out: (1) reject the person as irrational, (2) redefine the options (like including the default), (3) accept any choice as rational. This is the core of revealed preference theory: we can only say choices reveal preferences if they are consistent. The terms: utility, revealed preference, WARP (explain briefly)."

  8. **Debrief part 2: Philosophical context (5 min):** "This activity shows that utility is defined by choices, not discovered. But it doesn't settle whether preferences cause choices or are just summaries. Nor does it say if choices are good for us. We'll discuss that next time." (Keep it short.)

  Pitfalls to note in the response:
  - Consistent students: Use their data to show the model works when choices are consistent.
  - Gaming: Emphasize real snacks to encourage honest choices.
  - Feeling tricked: In debrief, explain the pedagogical reason.
  - Food: Have non-food options (e.g., pens) and check for allergies.

  Now, we write exactly eight numbered items, each 2-3 sentences.
answer: |-
  1. Distribute index cards and tokens (e.g., 5 per student) alongside a snack menu with prices (e.g., apple=2, chips=1, chocolate=3; ensure non-food alternatives like pens). Explain: "You'll face budget sets and keep your chosen snacks. Record your bundle on a card each round. Stay silent on why—this is about your choices, not strategy."

  2. Run two baseline rounds: Round 1 offers bundles under budget A (e.g., 5 tokens, prices as above). Collect cards. Round 2 changes the budget to B (e.g., 7 tokens, same prices). Collect cards. This builds choice data without revealing patterns.

  3. Pair students as "detectives," swapping Round 1–2 cards. Give a new budget C (e.g., 6 tokens, same prices): "Predict your partner's bundle here. Correct guesses earn both a bonus snack." After predictions, highlight cases where differing internal models (e.g., different rankings) yielded identical predictions, showing utility as encoding, not discovery.

  4. Sabotage with Round 3: Split the room. Group 1 sees budget A (5 tokens) plus a worthless option (e.g., a stale cracker for 0 tokens). Group 2 sees the same budget A but with a default bundle pre-selected (e.g., "recommended: 1 chocolate, 1 apple"). Collect cards secretly.

  5. Reveal Round 3 choices alongside Round 1 (same budget A). Most will show inconsistencies (e.g., default swayed choices). If no one varies, use your demo data. State: "Same options, same prices—why did choices shift? This breaks any simple model you built earlier."

  6. Force trilemma discussion: "In pairs, propose how to handle this inconsistency—what must change in our modeling?" Nudge ideas toward: (a) call choosers irrational, (b) redefine options (e.g., "default influenced the bundle"), or (c) accept any choice as rational. Have pairs share briefly.

  7. Debrief by naming: "Today you experienced revealed preference—utility is defined by choices, not found. Your detective work required coherence (like WARP), but presentation broke it. The trilemma: call inconsistency irrational, redefine the choice set, or weaken rationality. That's where philosophy lives."

  8. Acknowledge limits: "This shows utility-choice translation, not whether preference causes choices or is defined by them, nor if choices are good for us. We'll debate that next." Pitfalls: Consistent students (use as positive examples); gamers (stress real snacks); tricked feelings (debrief honestly); allergies (offer non-food).
