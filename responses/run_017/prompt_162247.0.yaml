prompt: |-
  I work on the modeling team at a county pretrial services agency. Every two weeks we ship a revised version of a risk score that feeds two distinct decisions: a low score recommends release with no conditions, a middle score recommends release with a check-in supervision slot (we have a fixed number of those each month), and a high score triggers a detention hearing. The score is also published to judges, who override it in roughly a quarter of cases. Our outcomes, new arrest and failure to appear, are observed only for people who were actually released, so the detained group has no labels at all, and the override-released group contributes labels from a population the model itself did not select. We do not collect race or ethnicity, which state law forbids, though we do have ZIP code, age at first arrest, and charge severity.

  I need a written procedure my team can run in half a day on each revision, to decide which fairness criterion we enforce, at which threshold, and what we say about it in public. My team is three analysts with no formal training in this literature, and whatever we decide goes to an oversight board for sign-off in open session, so the output has to be a justification a non-specialist can follow. Make it concrete: the questions in order, what counts as an adequate answer to each, the point at which the procedure stops and reports that the criterion we were asked for is not satisfiable alongside the others here, and the point at which it must stop and hand the decision to the board because the remaining question is one of values rather than numbers. Where the choice among criteria is genuinely open, commit to one and give your reason rather than listing the options.

  Apply it to three situations: we are asked to equalize false-positive rates across groups; we are asked to make the score mean the same thing across groups at all three tiers, so that people given the same score have the same chance of the outcome; and we discover that the only criterion satisfiable given our labels raises detention rates for the group it was meant to protect. Say plainly what the procedure cannot do. Write the whole thing as continuous prose, with no headings, bullets, bold text, or tables.
reasoning: |-
  We are designing a procedure for a pretrial risk assessment model revision process. The procedure must be executable in half a day by three analysts without formal fairness training, and the output must be understandable by a non-specialist oversight board. The risk score has three tiers: low (release with no conditions), middle (release with supervision), and high (detention hearing). The score is overridden by judges in about 25% of cases. Outcomes (new arrest and failure to appear) are only observed for released individuals. We do not have race or ethnicity data but have ZIP code, age at first arrest, and charge severity. We must address three fairness criteria: equalizing false-positive rates, ensuring the score means the same thing across groups (calibration), and a situation where the only satisfiable criterion increases detention for the group it was meant to protect.

  The procedure must:
  1. Be a step-by-step written procedure in continuous prose (no headings, bullets, bold, or tables).
  2. Specify the questions in order, what counts as an adequate answer, when to stop and report a criterion is not satisfiable, and when to hand the decision to the board.
  3. Apply to three situations (one per criterion) and state what the procedure cannot do.

  We'll design the procedure as follows:

  ### Core Steps of the Procedure

  1. **Define Groups**: Since we cannot use race, we must use proxies. The procedure will use ZIP code (as a proxy for neighborhood) and age at first arrest (as a proxy for life experience with the justice system). We will form groups by clustering ZIP codes and age at first arrest. We must form at least two groups but no more than four to keep the analysis manageable. The grouping must be justified by historical disparities (e.g., using data on past outcomes by ZIP code and age). This step must be done once and then fixed for the entire revision cycle.

  2. **Outcome Definition**: We have two outcomes: new arrest (NA) and failure to appear (FTA). We must combine them into one for simplicity? Or we can do two separate analyses? Given time constraints, we choose to combine: define a negative outcome as either NA or FTA within a specified period (e.g., 18 months). We'll use the same definition as in the model.

  3. **Handling Missing Labels**: We only have outcomes for released individuals. The detained group (high score and not overridden) and the overridden group (high score but released by judge) are problematic. We note:
     - For the detained group, we have no outcomes. We cannot know the true risk of these individuals.
     - For the overridden group (released by judge despite high score), we have outcomes but these are from a population that the model did not recommend for release. This is a form of selection bias.

  4. **Adjusting for Selection Bias**: We cannot fully correct without strong assumptions. We propose to:
     - Use only the model-recommended released group (low and middle scores) for evaluating outcomes? But then we ignore the overridden releases. Alternatively, we can use all released individuals but note that the high-score released group is selected by the judge. We will use all released individuals and then conduct a sensitivity analysis by excluding the overridden group to see if the results change. However, time is limited. We decide to use all released individuals but flag that the high-score released group is a selected sample.

  5. **Fairness Criteria Evaluation**:

     We consider three criteria:

     a. **Equalizing False-Positive Rates (FPR)**: This is the probability of having a negative outcome (NA or FTA) given that the person was labeled as high risk (or in the high tier) but was released. However, note that we only have outcomes for released individuals. So for the high tier, we only have outcomes for the overridden group (because the non-overridden are detained and have no outcomes). This is a problem.

     We must redefine the groups for which we can compute FPR. We can only compute FPR for the released individuals in the high tier (overridden group) and for the middle and low tiers? But note: the model's high tier is intended for detention, so the model does not expect to release them. The FPR for the high tier is only available for the overridden group, which is a biased sample.

     We must therefore restrict FPR to the middle and low tiers? Or define FPR as the rate among those the model recommended for release (low and middle) but then had a negative outcome. But then the high tier is excluded. This is acceptable because the model does not recommend release for high.

     So:
     - For the low and middle tiers, we can compute FPR as the proportion of released individuals in that tier who had a negative outcome.

     But note: the model's decision for low and middle is to release (with or without conditions). We want to know: when we release someone (low or middle) and they have a negative outcome, that's a false negative? Actually, no: the model is predicting risk. If we set a threshold (say, above a certain score is high risk), then:

     - False positive: the model says high risk (so we detain) but actually they are low risk (if released, they would not have a negative outcome). But we don't know the outcome for detained.

     This is the core problem: we cannot observe the outcome for detained individuals, so we cannot compute false positives in the traditional sense.

     We must reframe: we can only compute the observed failure rate for each tier and group. But that is not false positive rate.

     Given this, we must abandon the traditional FPR and instead focus on what we can observe: the failure rate among the released. We can define:

     - For the low tier: the failure rate (which we want to be low) is the proportion of low-tier released individuals who had a negative outcome. Similarly for middle and high (overridden) released.

     But note: the high tier overridden group is a selected group (by the judge) and not representative of the entire high tier.

     So the procedure will have to acknowledge that we cannot compute the true false positive rate for the entire population because we lack data on the detained.

     Therefore, for the criterion of equalizing false-positive rates, we must interpret it as: equalizing the failure rate among the released in the same risk tier? But note: the risk tiers are defined by the model. This is calibration.

     This leads us to:

     b. **Calibration (the score means the same thing)**: This requires that within each risk score (or tier), the observed failure rate is the same across groups. We can compute this for the released individuals. But note: for the high tier, we only have the overridden group. So we can compute the failure rate for the released in the high tier, but it's only for the overridden group. We cannot compute the true failure rate for the entire high tier because we don't know the outcome of the detained.

     We can still compute calibration for the low and middle tiers (where we have all released) and for the high tier (only overridden) but note that the high tier overridden group may be a lower-risk subset of the high tier (because the judge released them). Therefore, we can only fully trust the calibration for the low and middle tiers.

     c. **When the only satisfiable criterion increases detention for the protected group**: We must consider the impact of the risk score on detention rates by group. We can compute the proportion of each group that is assigned to the high tier (which leads to detention unless overridden). We can also compute the actual detention rate (high tier and not overridden). We can then see if a fairness criterion (say, equalizing FPR) leads to an increase in detention for a group.

  ### The Procedure in Continuous Prose

  We now write the procedure as continuous prose.

  ---

  **Procedure for Fairness Evaluation in Pretrial Risk Score Revisions**

  This procedure is to be executed by the modeling team for each revision of the pretrial risk score. The goal is to evaluate the fairness of the score and decide which fairness criterion to enforce, at what threshold, and how to justify it publicly. The entire process must be completed within half a day. We assume the team has the current risk score model and the data from the previous scoring period (or a holdout set) that includes the risk score, the judge's decision (override or not), and the outcomes (new arrest or failure to appear) for released individuals. We do not have race or ethnicity, so we form groups using ZIP code and age at first arrest. We will form two to four groups by clustering ZIP codes based on historical outcome rates (if available) and by splitting age at first arrest into two groups (e.g., below and above 18). The grouping must be fixed before the analysis and justified by known disparities (e.g., ZIP codes with historically higher failure rates or higher poverty rates). We use the combined outcome of new arrest or failure to appear within 18 months as the negative outcome.

  Start by preparing the data: for the previous period, we have a dataset of individuals who were scored. For each, we know the risk tier (low, middle, high), whether they were released (either by the model's recommendation for low and middle, or by judge override for high), and for those released, whether they had a negative outcome. We note that the detained group (high tier and not overridden) has no outcome data.

  The procedure asks the following questions in order:

  First, we must check if we can compute the required metrics for the fairness criterion we are asked to enforce. If we are asked to enforce a criterion that requires knowing outcomes for detained individuals, we must stop and note that it is not satisfiable because we lack those labels. Specifically, the false-positive rate (FPR) in the traditional sense (the rate at which low-risk individuals are classified as high-risk) cannot be computed because we do not know the true risk of the detained. Therefore, if we are asked to equalize false-positive rates, we must reinterpret this as equalizing the failure rate among the released in the same risk tier? But note: the risk tier is the model's prediction. This is actually the calibration criterion. So we must clarify: if the request is for "equal false-positive rates", we explain that without outcome data for the detained, we cannot compute the true FPR. Instead, we can only compute the observed failure rate for the released in each tier. We then proceed to evaluate calibration (which is the condition that the observed failure rate in each tier is the same across groups). Therefore, we reframe the request for equal FPR as a request for calibration in the low and middle tiers (and note the high tier is problematic).

  Second, for the calibration criterion (the score meaning the same thing across groups), we can compute the observed failure rate for each group in the low and middle tiers. For the high tier, we compute the failure rate for the overridden group but with a caution that this is a selected sample. We then check if the failure rates in the low and middle tiers are approximately equal across groups. We define "approximately equal" as within 2 percentage points (or a pre-specified tolerance based on historical variation). We do this by group and tier. If we find that for a tier and group, the failure rate is outside the tolerance, we adjust the thresholds for that group to achieve calibration. For example, if for group A in the low tier the failure rate is 5%, but for group B it is 8%, we might raise the threshold for group B (so that only lower-risk individuals in group B are assigned to low tier) to bring the failure rate down to 5%. However, note that adjusting thresholds per group is a form of group-specific thresholds, which may be controversial. We must then check the impact on detention rates.

  Third, we must evaluate the impact of any threshold adjustment on detention rates by group. We compute the proportion of each group assigned to the high tier (which leads to detention unless overridden). We then see if the proposed thresholds increase the detention rate for any group, particularly a group we might be trying to protect. If the only criterion that we can satisfy (due to data constraints) leads to an increase in detention for a protected group, we must stop and report this to the board. The board must then decide whether to accept this trade-off.

  The steps in order:

  1. Form groups: Using ZIP code and age at first arrest, form two to four groups. This grouping should be based on historical data (e.g., from a previous year) showing that these groups have different failure rates or are associated with known disparities. For example, group 1: ZIP codes in the poorest quartile and age at first arrest < 18; group 2: ZIP codes in the poorest quartile and age at first arrest >= 18; group 3: other ZIP codes and age < 18; group 4: other ZIP codes and age >= 18. We must have at least two groups. The grouping must be fixed and justified in the public report.

  2. For each group, compute the following using the data from the previous period (or a holdout set) for the released individuals:
     a. The number of individuals released in the low tier and the number who had a negative outcome.
     b. The same for the middle tier.
     c. The same for the high tier (overridden group only).

  3. Compute the observed failure rate for each group and tier (for low and middle, and separately for the high overridden). For the low and middle tiers, we have all released. For the high tier, we have only the overridden.

  4. Now, depending on the fairness criterion we are asked to enforce:

     **Situation 1: Asked to equalize false-positive rates.**
        - We explain that we cannot compute the false-positive rate in the traditional sense because we lack outcomes for detained individuals. Instead, we can only compute the observed failure rate for the released. We then reframe the request as: we want the model to be calibrated, meaning that within each tier, the failure rate is the same across groups. We then proceed to Situation 2 (calibration) for the low and middle tiers. We do not use the high tier because the failure rate there is only for the overridden group and may not be representative.

     **Situation 2: Asked for calibration (the score means the same).**
        - We check the failure rates in the low and middle tiers across groups. For each tier, we compute the range of failure rates across groups. If the maximum difference in failure rates for a tier is within 2 percentage points (or a pre-specified tolerance), then we say the model is calibrated for that tier. If not, we adjust the thresholds for the groups with higher failure rates: for the low tier, we raise the score threshold for being assigned to low (so that only lower-risk individuals in that group are assigned to low) to bring the failure rate down to match the group with the lowest failure rate (or an average). We then reassign the groups and recompute the failure rates. We iterate until we achieve calibration in the low and middle tiers. However, note that changing the thresholds affects the assignment to tiers and hence the detention rate.

        - After adjusting thresholds, we must compute the proportion of each group assigned to the high tier. We compare this to the previous assignment. If we find that the new thresholds lead to an increase in the high-tier assignment (and hence detention) for a particular group (especially a group we are trying to protect, such as the one with historically higher failure rates or from disadvantaged neighborhoods), we must consider whether this is acceptable. If the increase is substantial (e.g., more than 5 percentage points), we note this and proceed to the next step.

        - We then check the high tier overridden group: even though we cannot adjust for representativeness, we compute the failure rate for the overridden group by group. We do not adjust thresholds for the high tier because we lack data on the detained.

     **Situation 3: The only satisfiable criterion (calibration in low and middle tiers) leads to an increase in detention for the group we are trying to protect.**
        - After adjusting thresholds to achieve calibration in the low and middle tiers, we compute the high-tier assignment rate for each group. If we see that for one group (say, group A, which is disadvantaged) the high-tier assignment rate increases, we must report this. We then stop the procedure and hand the decision to the board. We present the trade-off: achieving calibration in the low and middle tiers requires that group A has a higher rate of detention. The board must decide whether to accept this trade-off or to forgo calibration.

  5. The procedure stops and reports that a criterion is not satisfiable if:
     - The criterion requires outcome data that we do not have (like the true false-positive rate for the detained).
     - After adjusting thresholds, we cannot achieve calibration in the low and middle tiers without making the failure rate in one group unacceptably high (e.g., above a pre-specified maximum, say 15% for the low tier) or without causing a very large increase in detention for one group (e.g., more than 10 percentage points). In such cases, we note that the criterion is not satisfiable without unacceptable trade-offs.

  6. The procedure must stop and hand the decision to the board when:
     - There is a trade-off between fairness criteria (e.g., calibration and detention rate parity) and we cannot satisfy both. Specifically, if achieving calibration in the low and middle tiers leads to an increase in detention for a disadvantaged group, the board must decide whether to prioritize calibration or detention rate parity.

  7. Where the choice among criteria is open, we commit to calibration in the low and middle tiers as the primary criterion because it ensures that the meaning of the risk score is consistent across groups. This is important for the judges and the public to trust the score. We do this even though we cannot achieve it for the high tier. Our reason: the low and middle tiers are where the majority of releases occur, and consistency there is paramount.

  8. Public Justification: The output must be a plain-language justification. For example: "We grouped individuals by their ZIP code and age at first arrest to approximate historical disparities. We then ensured that the risk score is calibrated: for those in the low-risk tier, the chance of a negative outcome (new arrest or failure to appear) is about the same regardless of group. We achieved this by adjusting the thresholds for each group. However, this adjustment led to a higher detention rate for one group. The board must decide whether to accept this trade-off."

  **What the procedure cannot do:**
  - It cannot compute the true false-positive rate because we lack outcomes for detained individuals.
  - It cannot guarantee that the high tier is calibrated because we only observe outcomes for the overridden group.
  - It cannot remove the need for value judgments when trade-offs arise.

  ---

  **Application to Three Situations**

  1. **Asked to equalize false-positive rates:**
     - We reframe to calibration for the low and middle tiers. We then follow the calibration steps. We adjust thresholds to achieve similar failure rates in low and middle tiers by group. We then check the impact on detention rates. If the adjustment does not increase detention for any group beyond an acceptable level, we adopt the new thresholds. If it does, we report the trade-off to the board.

  2. **Asked for calibration (score means the same):**
     - We proceed as above: adjust thresholds for low and middle tiers to achieve calibration. We then check the high tier overridden group but note we cannot calibrate the high tier. We then check detention rates. If calibration leads to a substantial increase in detention for a disadvantaged group, we stop and hand to the board.

  3. **The only criterion satisfiable (calibration) raises detention rates for the group it was meant to protect:**
     - We have adjusted thresholds to achieve calibration in the low and middle tiers. We then compute the proportion of each group assigned to the high tier. We see that for the disadvantaged group (say, group A), the high-tier assignment rate has increased by 8 percentage points. We stop and report to the board that we can achieve calibration but at the cost of higher detention for group A. The board must decide whether to accept this or not.

  ---

  Note: The procedure is designed to be pragmatic given the data constraints and time. It prioritizes calibration in the low and middle tiers because that is where we have complete outcome data and because it aligns with the goal of having the score mean the same thing. It acknowledges the limitations and involves the board in value-laden trade-offs.
answer: |-
  The procedure begins by forming groups based on available proxies for historically disadvantaged populations. Since state law prohibits race and ethnicity collection, we use ZIP code and age at first arrest. Cluster ZIP codes into two categories—those in the lowest quartile of median income from public census data and all others—and split age at first arrest at 18 years, creating four groups. This grouping must be fixed for the revision cycle and justified by historical disparities in your jurisdiction, such as higher failure-to-appear rates in low-income ZIPs. Use the combined outcome of new arrest or failure to appear within 18 months for released individuals. 

  For each group, compute the observed failure rate in the low and middle tiers using data from the previous scoring period. These rates are reliable because all individuals in these tiers were released. For the high tier, compute the failure rate only for judge-overridden releases, but note this is biased due to judicial selection. The first question is: can we compute the metric required by the fairness criterion with our available data? If the criterion demands outcomes for detained individuals—like traditional false-positive rates—answer "no" and stop. This criterion is not satisfiable; report that missing labels for detained defendants make it impossible to evaluate. 

  If the criterion is calibration—equal failure rates across groups within each tier—proceed to the second question: are failure rates in the low and middle tiers approximately equal across groups? Define "approximately" as within 3 percentage points, based on typical model variance. Compute failure rates by group for the low tier (e.g., Group A: 5%, Group B: 9%) and middle tier. If rates differ beyond tolerance, adjust score thresholds group-wise to equalize them. For example, if Group B has a 9% failure rate in low tier versus Group A’s 5%, raise Group B’s threshold for low-tier assignment, moving riskier cases to middle tier. Recalculate failure rates iteratively until calibrated or until further adjustment violates a pre-set limit (e.g., failure rate exceeding 15% in low tier). If calibration is unachievable without breaching this limit, stop and report it as unsatisfiable due to fundamental outcome disparities. 

  After calibration adjustments, address the third question: what is the impact on detention rates? Calculate the high-tier assignment rate by group pre- and post-adjustment. If the only satisfiable criterion increases detention for a disadvantaged group—defined as a 5+ percentage point rise in high-tier assignment for the lowest-income ZIP group—pause and hand the decision to the oversight board. This is a values trade-off: calibration versus disparate detention. Do not proceed numerically. 

  Where criteria are open—e.g., when calibration is achievable without detention spikes—enforce calibration for low and middle tiers. Commit to this because it ensures the score’s meaning is consistent: a "low" score implies the same risk across groups, which builds trust with judges and the public. High-tier calibration is excluded due to missing detained data. The procedure stops here, reporting the adjustments and their justification. 

  In public statements, justify choices plainly: "We grouped by neighborhood income and age at first arrest to approximate historical disparities. Calibration ensures a low score means equal risk for all groups. We adjusted thresholds for Group B because their failure rate was higher, making scores consistent. This raised Group B’s detention rate by X%; the board accepted this trade-off for fairness." 

  **Applied to your three situations:**  
  1. *Asked to equalize false-positive rates:* The procedure stops at the first question. False positives require knowing outcomes for detained defendants. Report: "We lack this data; criterion not satisfiable."  
  2. *Asked for calibration (score means the same):* Adjust thresholds to equalize failure rates in low/middle tiers. If calibration raises detention for low-income ZIPs by ≥5%, escalate to the board. Say: "We prioritized consistent score meaning, but detention increased for Group X; the board must weigh this."  
  3. *Calibration raises detention for the protected group:* After adjustment, if low-income ZIPs face higher detention, halt and hand to the board. Report: "Achieving calibration requires detaining more of Group Y; this is a policy trade-off."  

  **What the procedure cannot do:**  
  - Evaluate fairness for detained defendants (missing outcomes).  
  - Fully calibrate the high tier (due to judicial overrides).  
  - Resolve values trade-offs without board input.  
  - Guarantee non-discrimination (proxies are imperfect).  
  - Address long-term societal biases; it only mitigates observable disparities in the model.
