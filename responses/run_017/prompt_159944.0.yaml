prompt: |-
  I have a fifty-minute seminar next week on the frame problem, for first-years in a combined philosophy-and-computing degree. They have had exactly one prior lecture on classical planning — actions specified as preconditions and effects over a state description — and no formal logic beyond truth tables. Assume I know the material and do not explain the frame problem to me; what I need is a plan for getting it across. Four things in particular.

  The order. Give me the sequence of moves and, for each, what has to be in place before it can land. I keep losing the thread at the transition between the two things that get called by this name: the technical one, where representing an action's effects in logic seems to oblige you to write out, for every action and every condition it leaves alone, that the condition does not change; and the broader one, about how a system with very many beliefs works out which of them bear on what it is doing now. My instinct is to spend the first twenty minutes on the technical problem and then ask why solving it leaves the second untouched, but I am not sure the second problem is even visible to them unless they have already felt a proposed fix fail. Tell me what must come first, and what, if anything, must be deliberately withheld until later.

  The carrying example. One scenario should do the whole session's work, and I want it to meet a constraint I have not seen imposed anywhere: the same scenario must survive a change of goal. It should contain at least one consequence of the action that is far-flung but relevant, one that is close at hand and utterly irrelevant, and — this is the part I care about — one whose relevance flips when I change what the agent has been told to want, so that I can run the identical vignette three times with three different goals and let relevance itself be the variable. Propose such a scenario, and say what it must have and, as importantly, what it must lack. I had meant to use the familiar story of the robot that retrieves a battery from a room, where the battery sits on a wagon alongside a bomb, and I would be glad to be told why that is the wrong vehicle here, or what would have to be stripped out of it.

  The misconceptions. Here are the ones I expect: that this is a problem of computational cost, which more speed or memory would dissolve; that it was solved by the late 1980s and so there is nothing left to discuss; that it is the same as the qualification problem, or as the ramification problem; that relevance is a property a belief has on its own rather than something it has relative to a task and an agent; and that the takeaway is a vague holism, the thought that everything bears on everything. For each, tell me the exact point in the sequence at which to forestall it — I suspect some must be blocked before they can form while at least one is better provoked and then dismantled. Then give me the one or two misconceptions I have got wrong or missed, since my list comes from last year's cohort and may be idiosyncratic.

  Two further questions, folded in. First, whether to give five minutes to the temporal-projection puzzle in which a gun is loaded, an interval passes, and the trigger is then pulled — the Yale shooting case, which showed that the minimal-change fix is not always right — or whether that detour pulls attention back into the formalism and away from the problem I want them to feel; I suspect it is a trap for me rather than for them. Second, some philosophers have recruited the frame problem into an argument that central cognition cannot be computational at all, on the grounds that whether a belief bears on a conclusion is sensitive to anything and everything. Is that a legitimate extension worth a closing minute, or a different argument wearing the same name, and if I do raise it, what has to be true of the preceding forty-five minutes for it to be more than a slogan?

  Finally, a check and an omission. I want one question to put to them near the end whose answers would show they have the distinction between the two problems and not merely the vocabulary. I was going to hand out three short vignettes and ask which instantiates the frame problem, which instantiates one of its siblings, and which is only an expensive calculation, with at least one deliberately borderline case; tell me whether that will discriminate, and if not, what will. And tell me what to refuse to explain at this level, and how to make the refusal feel principled rather than evasive.

  Please do not suggest readings, sources, or citations: the course bibliography is fixed and I do not want to smuggle in new ones.
reasoning: |-
  Okay, the user is preparing a seminar on the frame problem for first-year philosophy and computing students. They've had one lecture on classical planning with preconditions and effects. The user understands the material but needs a teaching plan. Let me break down their requirements.

  First, the order. They want a sequence that clearly distinguishes the technical frame problem from the broader relevance problem. The user mentions struggling with the transition. I need to ensure each step logically leads to the next. Start with classical planning to recap, then introduce a simple action scenario. Show how specifying non-changes leads to the technical issue. Then, after presenting a "solution" like STRIPS, pivot to why that doesn't address relevance determination. This sequence makes the broader problem visible only after seeing the limits of the technical fix.

  For the carrying example, they need a scenario flexible enough for different goals. The bomb-and-battery example is problematic because it mixes multiple issues. Instead, a carrying scenario with a box is better. Include elements like a visible stamp (irrelevant) and a fragile item inside (relevance changes with goals). By switching goals between transport, cost, and preservation, the relevance of the same elements shifts, highlighting context-dependence.

  Addressing misconceptions is crucial. The user provided a list, but I should add that students might conflate the frame problem with general efficiency issues. Timing matters: address computational cost early when introducing the technical problem. The solved-by-1980s misconception should be tackled after presenting STRIPS, clarifying it only solves the technical part. Relevance being intrinsic vs. task-dependent should be covered when discussing the broader problem using the carrying example.

  The Yale shooting problem might derail the focus. It's a trap because it deals with persistence over time, which is different. Instead, mention it briefly if needed but avoid deep diving. The philosophical extension about non-computational cognition could be a closing thought, but only if the distinction between the two frame problems is clear, turning it into a discussion point rather than a conclusion.

  To check understanding, use a vignette-based question. Present three scenarios: one with explicit non-change axioms (technical frame problem), one needing relevance determination (broader), and one with computational load (not frame problem). This tests their grasp of the distinction. Avoid explaining temporal projection or ramification problems in detail; frame them as related but different issues to maintain focus.

  Overall, the seminar should flow from technical to broader, using a consistent scenario, addressing misconceptions at key points, and ending with a clear distinction reinforced by the vignettes.
answer: |-
  Here’s a battle-tested plan for your seminar, designed for clarity and impact within 50 minutes, prioritizing the **distinction** between the two frame problems and using a single adaptable scenario.

  **Order: Building the Bridge Step-by-Step**

  1.  **Hook & Recap (5 min):**
      *   **Move:** Start with a *simple* classical planning scenario: "Agent needs to move Box A from Room X to Room Y. Actions: `PickUp(box, room)`, `MoveTo(room)`, `PutDown(box, room)`. Preconditions/Effects defined."
      *   **Prerequisite:** Their prior lecture knowledge. *What must be in place:* Recall that actions change specific state variables (e.g., `location(box)`), others are assumed unchanged.
      *   **Why:** Grounds the discussion in their existing knowledge. Establishes the "closed world" of planning where only specified changes happen.

  2.  **Introducing the Technical Frame Problem (15 min):**
      *   **Move:** Formalize the simple scenario in logic. Show the action schema for `MoveTo(new_room)`: Precondition: `At(agent, current_room)`. Effect: `At(agent, new_room)`, `NOT At(agent, current_room)`.
      *   **Problem Setup:** Ask: "How does the system *know* that `Color(box, red)` stays true after moving? Or that `IsDoorOpen(roomZ)` is unchanged?" Point out the logical need for **frame axioms**: "For all actions A, for all fluents F *not* affected by A, include `F(t) => F(t+1)` in A's effects."
      *   **Impact:** Emphasize the *representational explosion*: `n` actions * `m` fluents = potentially `n*m` frame axioms. This is tedious, inefficient, and brittle.
      *   **"Solution" & Its Nature:** Introduce the concept of a *solution* like STRIPS "assumption" (or negation-as-failure in Logic Programming): Only what's stated changes; everything else is assumed to persist. **Crucially stress:** This solves the *representational/logical* problem of stating non-changes. It is a *formal trick*.
      *   **What must be in place:** Clear understanding of action schemas and the naive logical requirement for frame axioms. **Withhold:** Any discussion of *how* an agent actually *uses* its knowledge to decide what's relevant.

  3.  **The Pivot: Why the "Solution" Isn't Enough (5 min):**
      *   **Move:** State explicitly: "Great! We've solved the problem of *representing* non-change efficiently. Now, does this help our agent actually *reason* about the world?" Pause. "Imagine our agent has thousands of beliefs. When deciding to perform `MoveTo(Kitchen)`, does it need to consider... `ThePrimeMinisterIsInLondon`, `2+2=4`, `MyShoesAreBlue`?"
      *   **Goal:** Make the shift from *representation* to *relevance determination* palpable. The STRIPS "solution" is silent on *this* problem. This is the transition point.

  4.  **Introducing the Broader Relevance Problem (15 min):**
      *   **Move:** "The problem isn't just listing what *doesn't* change. It's figuring out, from a vast sea of knowledge, *which beliefs are actually relevant* to achieving a specific goal or predicting the outcome of an action in a given context. This is the deeper Frame Problem of relevance."
      *   **Deploy the Carrying Scenario:** See detailed scenario below. Run it with Goal 1 (Transport), Goal 2 (Minimize Cost), Goal 3 (Preserve Fragile Item). Show how relevance shifts dramatically based on the *goal* and *context*.
      *   **Key Insight:** Relevance isn't intrinsic to a belief (`Weight(box)`). It's *relative* to the task (`Goal=Transport` vs. `Goal=MinimizeCost`) and the agent's model of the world (`IsWagonAvailable?`, `IsItemFragile?`). The STRIPS trick tells us *nothing* about how to find `Weight(box)` when minimizing cost is the goal.

  5.  **Consolidation, Q&A, and Distinction Check (10 min):**
      *   **Move:** Summarize: "Two distinct problems: (1) The *Technical* Frame Problem: The formal/logistical problem of efficiently representing non-change in action schemas. (2) The *Relevance* Frame Problem: The computational/cognitive problem of determining *which* pieces of knowledge are relevant to a task/goal/action consequence in a vast knowledge base."
      *   **Check Question:** Use the vignette approach, but refine slightly. Present **three scenarios**:
          *   **A:** A STRIPS planner requiring explicit frame axioms for `Color(box)` after every action. (Illustrates **Technical FP**).
          *   **B:** A robot trying to decide if `TheDowJonesIsDown` is relevant to planning a path to the kitchen to get coffee. (Illustrates **Relevance FP**).
          *   **C:** A planner taking a long time to calculate the most efficient route because there are 1000 possible paths. (Illustrates **Computational Cost**, *not* FP).
      *   **Discriminator:** Ask "Which scenario is primarily about the problem of *representing non-change*, which is about *determining relevance* from a vast KB, and which is simply about a difficult calculation?" The key is whether the core issue is *representation of persistence* (A), *relevance determination* (B), or *raw computational effort* (C).

  **The Carrying Scenario: Designed for Goal-Shifting Relevance**

  *   **The Setup:** Agent must carry a closed, opaque **Box** from **Room A** to **Room B**.
  *   **Elements of the Box/Context:**
      *   **Box Properties:** `Weight(box) = heavy`, `Size(box) = large`, `Color(box) = blue`, `Owner(box) = Alice`.
      *   **Contents (Unknown to agent initially, revealed later if needed):** Contains `Item1 = Textbook`, `Item2 = FragileVase`.
      *   **Environment:** `Wagon` present in Room A. `FloorType(RoomA) = carpet`, `FloorType(RoomB) = tile`, `Distance(A,B) = 20m`, `AgentStrength = moderate`. `Weather = sunny` (irrelevant constant). `Time = 10:00 AM`.
  *   **The Action:** `Carry(box, from, to)`. Preconditions: `At(agent, from)`, `At(box, from)`, `Clear(agent_hands)`. Effects: `At(agent, to)`, `At(box, to)`, `NOT At(agent, from)`, `NOT At(box, from)`.
  *   **Running the Goals:**
      *   **Goal 1: Transport Box.** Relevant: `Weight(box)` (can agent carry it?), `Size(box)` (can it fit through door?), `WagonAvailable?` (ease). *Irrelevant:* `Color(box)`, `Owner(box)`, `FloorType`, `Weather`, `Contents` (as long as box arrives intact).
      *   **Goal 2: Transport Box with Minimal Effort/Cost.** Relevant: `Weight(box)`, `WagonAvailable?`, `Distance(A,B)`. *Now Relevant:* `FloorType` (pulling wagon on carpet vs. tile might require different effort). *Irrelevant:* `Color(box)`, `Owner(box)`, `Weather`, `Contents`.
      *   **Goal 3: Transport Box Ensuring Fragile Contents Arrive Unbroken.** Relevant: `Weight(box)`, `Size(box)`, `WagonAvailable?`. **CRITICAL FLIP:** `Contents` becomes *vitally relevant* (Is there a fragile item?). `FloorType` becomes highly relevant (bumps on tile? carpet cushioning?). How the agent carries it (speed, care) becomes relevant. *Irrelevant:* `Color(box)`, `Owner(box)`, `Weather` (unless it starts raining and affects grip/surface? - hinting at ramification!).
  *   **Why Not Bomb-on-Wagon?** It's a *great* example, but for a different emphasis (ramifications/unintended consequences). It often leads students directly to "the robot needs to know about bombs!" which oversimplifies relevance (it needs to know *if* the bomb *matters* for the *goal*). The carrying scenario focuses purely on *relevance shifts based on goal/context* without the dramatic distraction of explosions. It **lacks** clear unintended physical consequences; the relevance change is more subtle and tied to the agent's *purpose*.

  **Tackling Misconceptions: Timing & Tactics**

  1.  **"Computational Cost" (Forestall Early):** Address this when introducing the *impact* of the technical FP (Step 2). "Yes, the explosion of frame axioms is computationally expensive, but the *core problem* is the *sheer necessity and tedium* of writing them all. Even with infinite speed, it's a bad representation. The *relevance* problem is even less about raw speed and more about *how to search* the KB."
  2.  **"Solved in the 80s" (Provoke & Dismantle):** Let this emerge after presenting the STRIPS "solution" (Step 2/3 transition). "So, is the Frame Problem solved? Well, the *technical representational* problem was largely addressed by solutions like STRIPS. But remember our agent needing to know about the Prime Minister? Does STRIPS tell it *how* to ignore that? No. The *relevance* problem remains wide open. Modern AI still grapples with it (e.g., in common-sense reasoning)."
  3.  **"Same as Qualification/Ramification" (Clarify Later):** Briefly define when introducing the relevance problem (Step 4). "They're siblings! *Qualification:* Could there be an infinite number of preconditions (e.g., is gravity working?)? *Ramification:* Representing implicit, indirect consequences of actions (e.g., moving the wagon moves the bomb *on* it). The *Frame Problem* specifically concerns representing *non-change* (technical) and determining *relevance* (broader)."
  4.  **"Intrinsic Relevance" (Forestall with Scenario):** This is the primary target of the carrying scenario with shifting goals (Step 4). Explicitly state: "Relevance isn't in the fact itself! `Weight(box)` isn't always relevant. It *becomes* relevant *only* when the agent's goal or task makes it so. Relevance is *purpose-relative*."
  5.  **"Vague Holism" (Dismantle at End):** After the relevance problem discussion (Step 4/5). "The takeaway *isn't* that 'everything matters'. The point is that *we don't know in advance what matters*, and figuring it out efficiently is incredibly hard. We need *principled ways* to focus, not just give up and consider everything."
  6.  **Key Missed Misconceptions:**
      *   **"It's just about efficiency in search algorithms."** (Forestall during Relevance Problem intro - Step 4): Clarify it's about the *fundamental difficulty of defining relevance* for search, not just optimizing an existing search.
      *   **"Only applies to physical actions/worlds."** (Address during Relevance discussion - Step 4): Mention briefly that relevance applies equally to social, informational, or abstract actions (e.g., "Will telling Bob this news affect his decision?").

  **Handling the Two Further Questions**

  1.  **Yale Shooting Problem (Skip It):** Your instinct is correct. It's a fascinating problem in *temporal reasoning* and *persistence*, specifically about the *formalization of inertia* and dealing with concurrent/qualifying actions (like secretly unloading). It **diverts** attention deep into the technical weeds of the *persistence* aspect of the *technical* frame problem and potential flaws in *specific* logical formalizations (e.g., Situation Calculus). It does little to illuminate the core distinction you need to make or the relevance problem. Mention it *only* in passing if asked: "There are even trickier temporal projection puzzles, like the Yale Shooting Problem, showing that even defining persistence formally can be subtle, but that's a deeper dive into formalisms than we have time for today."
  2.  **The Philosophical Extension (Closing Minute - *If* Time & Clarity):**
      *   **Legitimacy:** It's a different argument *wearing the same name* ("Frame Problem" used very broadly). It leverages the *relevance* problem's difficulty.
      *   **Prerequisite for Raising It:** The preceding 45 minutes *must* have firmly established: (a) the distinction between the two problems, (b) that the technical problem is largely "solved" as a representation issue, (c) that the relevance problem is about the *computational difficulty of determining relevance*, and (d) that relevance is task/goal/context dependent.
      *   **How to Raise It:** "Some philosophers argue that the sheer difficulty of the relevance problem – the fact that *anything* in the agent's experience *could* potentially be relevant depending on context – shows that human-like central cognition *cannot* be computational, as computation requires predefined relevance rules. Is this a fair extension of the Frame Problem? Or is it conflating the problem with fundamental issues of meaning, context, and intentionality? It's a deep and contentious question..." (Let it hang as a provocative closing thought). **Make it a question, not a statement.** Its value is in showing the *philosophical weight* the relevance problem carries, not in endorsing the argument.

  **What to Refuse to Explain (and How)**

  *   **Formal Details of STRIPS/SitCalc/Etc.:** "We're focusing on the *conceptual* problems today – the 'what' and the 'why it's hard'. The exact formalisms (like STRIPS lists or Situation Calculus axioms) are important implementation details you'll see more of later in the computing side. For now, understanding the core challenges they were trying to solve is key." (Principled: Focus on concepts over implementation).
  *   **Deep Dives into Ramification/Qualification:** "We mentioned qualification and ramification as close relatives of the Frame Problem – they're part of a family of challenges in representing action and change. Today we're honing in specifically on the Frame Problem's two faces: non-change representation and relevance. We'll touch on the others more later [or point to syllabus]." (Principled: Maintaining focus on the core topic).
  *   **Specific AI Solutions beyond STRIPS:** "While STRIPS addressed the representational explosion for non-change, modern AI uses many techniques (like probabilistic reasoning, machine learning) to *tackle* the relevance problem, but none offer a complete, general solution. The *nature* of the problem is what we need to grasp today." (Principled: Avoiding technical overload, emphasizing enduring conceptual challenge).

  This plan prioritizes the crucial distinction, uses a consistent scenario to drive home relevance relativity, strategically tackles misconceptions, avoids formalism traps, and ends with a clear check for understanding. Good luck!
