  Below is a complete simulation design for your seminar, titled **"Territorial Denial: The Defence Dilemma"**. It focuses on the trade-offs between conscript and volunteer forces, embedding the four strands (fiscal/opportunity cost, mobilisation lag, replacement depth, and signalling) into gameplay. The simulation uses index cards, the projector, and movable chairs, with no budget required.

  ---

  ### **Game Overview**
  - **Core Conflict**: Students act as citizens of "Neutralia," a small state (population 18) facing a potential aggressor ("AggroState"). They must collectively decide defence policy across three phases: **Long Peace**, **Crisis**, and **Sustained Conflict**. 
  - **Key Mechanic**: Students have individual stakes (earnings, roles) and must balance national security against personal costs. The aggressor is controlled by a dice-based rule, eliminating instructor bias.
  - **Learning Goal**: Experience how conscription acts as a pre-commitment device, with trade-offs in cost, mobilisation, and deterrence emerging organically.

  ---

  ### **Materials & Setup**  
  *(Prep: 10 minutes; use projector for rules/phase updates)*  
  1. **Role Cards (18 index cards)**:  
     - Each card lists:  
       - **Occupation**: E.g., "Software Developer", "Nurse", "Student".  
       - **Annual Civilian Earnings**: Ranges from £5k (student) to £80k (surgeon), scaling with economic growth (see below).  
       - **Special Condition** (1-2 cards each):  
         - **Conscientious Objector**: If conscripted, -10% to unit effectiveness.  
         - **Essential Worker** (e.g., doctor): If conscripted, -£2k/year to state GDP.  
         - **Patriot**: Willing to serve for 25% less pay.  
         - **High-Skill Worker** (e.g., engineer): Civilian earnings grow +£5k/year during peace.  

     *Example Card:*  
     ```
     Occupation: Farmer  
     Earnings: £20,000/year  
     Special: None  
     ```  

  2. **Game Board (Projector Display)**:  
     - Track **GDP** (sum of civilian earnings), **Military Budget** (25% of GDP as tax revenue), and **Force Structure**.  
     - Show **AggroState Threat Level** (1-5; 5 = imminent attack).  

  3. **Tokens**:  
     - **Red Tokens** (casualties), **Blue Tokens** (conscripts), **Green Tokens** (volunteers). Use torn paper if tokens unavailable.  

  4. **Aggressor Rule**:  
     - Hidden from students: AggroState attacks if two dice rolls (2d6) ≤ current Threat Level. Threat Level rises if Neutralia’s **trained reserves** fall below 5 or **defence spending** drops >20% year-on-year.  

  ---

  ### **Rules & Payoffs**
  - **Objective**: Maximise personal savings (civilian earnings + military pay) and avoid defeat (losing war = -£50k penalty to all).  
  - **Force Options**:  
    - **Volunteer Force**: High effectiveness abroad. Cost: £50k/soldier/year (market rate).  
    - **Conscript Force**: High effectiveness in territorial denial. Cost: £10k/conscript/year (stipend) + opportunity cost (lost GDP/tax from their civilian role).  
    - **Reserves**: Trained conscripts (cost: £2k/reservist/year). Only available if conscription existed in prior phase.  
  - **Economic Growth**: Civilian earnings grow +£5k/year for all during *Long Peace* (simulates prosperity).  
  - **War Costs**: GDP drops 40% during conflict (economic disruption).  

  ---

  ### **Game Phases & Timeline**  
  *(Total: 90 minutes; strict timing essential)*  

  #### **Phase 1: Long Peace** (40 minutes)  
  - **Rounds**: 3 rounds (10 min/round).  
  - **Actions per Round**:  
    1. **Group Decision**: How to structure forces (conscript, volunteer, or mix).  
       - Volunteers: Students *self-select*; state pays £50k/year.  
       - Conscripts: Group *compels* specific students; they earn £10k/year.  
       - Reserves: Automatically created if conscripts >3 (max 1 reserve per conscript).  
    2. **Budget Constraints**: Military spend cannot exceed 25% GDP.  
    3. **Aggressor Update**: After each round, roll dice for AggroState (hidden). If attack triggered, move to Crisis.  
    4. **Earnings**: Civilians earn full income; conscripts/volunteers earn military pay.  

  - **Embedded Trade-offs**:  
    - **Fiscal/Opportunity Cost**: Volunteers drain the budget; conscripts "look cheap" but reduce GDP (e.g., conscripting a £60k engineer loses £15k tax/year).  
    - **Signalling**: Low reserves/investment raise Threat Level, making attack likely.  

  #### **Phase 2: Crisis** (15 minutes)  
  - **Trigger**: AggroState attack.  
  - **Rules**:  
    - If Neutralia has **reserves**, they mobilise immediately (no lag) at £10k/soldier.  
    - If **volunteer-only**, they can recruit new volunteers (1 round lag; too late for first battle).  
  - **Outcome**: First battle casualties (see **Phase 3**).  

  #### **Phase 3: Sustained Conflict** (20 minutes)  
  - **Rounds**: 3 rounds (5 min/round).  
  - **Actions per Round**:  
    1. **Replace Losses**:  
       - Volunteers: Recruit new volunteers (cost £50k; limited to 2/round).  
       - Conscripts/Reserves: Replace instantly from reserves (if available).  
    2. **Battle**:  
       - Territorial defence: Conscripts inflict 2x casualties on AggroState.  
       - Volunteers inflict 1x casualties (optimised for offence).  
       - Neutralia suffers 10% losses/round *unless* force is conscript-based (then 5%).  
    3. **Defeat**: If Neutralia’s force <30% initial size, surrender (-£50k penalty).  

  - **Embedded Trade-offs**:  
    - **Mobilisation Lag**: Volunteers cannot scale quickly.  
    - **Replacement Depth**: Reserves allow sustained fighting; volunteers exhaust quickly.  

  ---

  ### **Debrief** (15 minutes)  
  Map gameplay moments to the four strands:  

  1. **Fiscal vs. Opportunity Cost**  
     - *Example*: "In Round 2, you conscripted Sarah (Surgeon, £80k). Her stipend cost £10k, but GDP fell by £80k, slashing tax revenue. Volunteers cost more upfront but didn’t shrink GDP."  
     - **Takeaway**: Conscripts "look cheap" but have hidden opportunity costs that rise with prosperity.  

  2. **Mobilisation Lag**  
     - *Example*: "When AggroState attacked, Ana’s reserve unit mobilised instantly. If you’d relied on volunteers, you’d have faced the first battle understrength."  
     - **Takeaway**: Reserves must exist *before* a crisis; volunteers can’t be conjured overnight.  

  3. **Replacement Depth**  
     - *Example*: "In the war’s third round, your volunteer force was decimated and couldn’t replace losses quickly. The conscript group absorbed losses via reserves."  
     - **Takeaway**: Conscription enables endurance in long wars; volunteer forces "snap" under strain.  

  4. **Signalling & Pre-commitment**  
     - *Example*: "By maintaining conscription in Round 1, you kept AggroState’s Threat Level low. Abolishing it in Round 2 signalled weakness, triggering the attack."  
     - **Takeaway**: Conscription is a credible deterrent because it binds society *in advance*—individuals can’t defect when crisis hits.  

  #### **Predictable Problems & Limitations**  
  - **What Will Go Wrong**:  
    - **Gaming the System**: Bright students may min-max earnings (e.g., avoiding conscription to grow GDP). *Use this!* Debrief how this mirrors real-world free-riding.  
    - **Aggressor Rule Exploitation**: If students deduce the dice mechanic, they may optimise for "just enough" reserves. Stress that real adversaries are unpredictable.  
    - **Group Dynamics**: Dominant players may override quiet ones. Mitigate by assigning roles randomly and imposing 30-second speaking limits during discussions.  
  - **What the Simulation Can’t Capture**:  
    - **Multi-Decade Horizon**: Decisions feel immediate; real conscription debates span generations.  
    - **Moral Remainder**: Justifying coercion of an "identifiable person" (e.g., the compelled conscript) gets lost in gameplay abstraction.  
    - **Uncertain Intentions**: AggroState’s logic is mechanical; real threats involve ambiguity.  
    *Address in debrief*: "This simplifies decades of strategy into minutes. In reality, leaders face uncertainty about enemies *and* the moral weight of forcing citizens to serve."  

  ---

  ### **Instructor Notes**  
  - **Aggressor Rolls**: Conceal dice rolls; only announce outcomes. Threat Level should feel "live."  
  - **Phase Transitions**: Use projector to display phase rules (e.g., "CRISIS: Mobilise reserves NOW").  
  - **Chairs**: Arrange in a circle for debates; small groups (5-6) for force-structure planning.  
  - **First-Run Tip**: Assign a student to track GDP/military spend to reduce your workload.  

  This design forces students to confront trade-offs experientially, with the pre-commitment aspect of conscription emerging through the AggroState mechanic. The debrief explicitly ties play to theory without lecturing.
