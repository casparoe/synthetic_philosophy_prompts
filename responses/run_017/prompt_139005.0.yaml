prompt: |-
  I convene a final-year undergraduate seminar in political philosophy at a British university — eighteen students, a single ninety-minute session, a room with movable chairs, a projector and a pack of index cards, and no budget, so any stakes have to be points, tokens or something else symbolic rather than cash. The three-week block is on the ethics and political economy of military service, and we have already looked at three European reference points: a state with a long-standing militia tradition in which the citizen-soldier is the constitutional default, one that deactivated peacetime conscription in 2010 and reactivated it on a gender-neutral basis in 2017 after voluntary recruitment failed to fill the ranks, and one that never abandoned it and maintains a trained reserve of roughly 280,000 as a share of a small population. I ran this session last year as a structured debate and it collapsed inside twenty minutes into two slogans — conscription is forced labour, versus conscription is what you owe for citizenship — and nothing after that moved anyone. So this year I want something the students play rather than something they perform, and I would like you to design it.

  The thing I want them to run into, without my naming it first, is that the choice between a conscript and a volunteer force is not one axis on which the two options can be ranked by efficiency. It is a bundle of considerations that can come apart, and a force can be better soldier for soldier and still be the wrong instrument for a small state whose strategy is territorial denial and whose neutrality means it expects to fight alone. At least four strands should be discoverable in the rules rather than in my introduction: fiscal cost to the treasury as against the real opportunity cost borne by whoever actually serves, which rises with civilian wages, so that volunteers become steadily more expensive as the country gets richer while conscripts on a nominal stipend look cheap mainly because part of their pay is being taken in kind; mobilisation lag, since a trained reserve has to exist before a crisis is visible while a volunteer force can only be expanded once the threat has already appeared; replacement depth, the capacity to absorb losses and keep fielding units in a long war rather than a short one; and signalling, because an aggressor's decision turns on expected resistance, and expected resistance depends on institutions that were put in place years earlier — you cannot build a mobilisation system, or a reputation for resisting, at the moment you discover you need it. The last of these is the one I most want them to feel: conscription can function as a pre-commitment and coordination device that binds a society to a course of action each individual member would defect from once the crisis actually arrives, and the free-riding temptation has to be something they personally face in the room, not something I describe.

  Concretely, I would like an activity in which each student has a private stake that differs from the others' — an occupation with an earnings figure, perhaps a few cards that make service unusually costly or unusually cheap for particular people, maybe one or two conscientious objectors — and in which the group must repeatedly choose, under a budget, how much capability to buy and whom to compel. My instinct is that it should run through phases rather than a single decision: a long peace in which the temptation is to abolish compulsory service and buy a small professional force, a crisis in which the decision has to have been made already, and a sustained conflict in which losses have to be replaced. It matters a great deal to me that the adversary is not played by me: the students will read my face, and if I improvise the threat they will reason about what I am likely to do rather than about deterrence, so I need a scripted or mechanical rule for the aggressor's behaviour, ideally one that is only partly transparent to them. I would also like the rules to let the same budget buy genuinely different things — a mass force good at denial and a compact professional force that is good at expeditionary deployment abroad and at being useful to allies — so that the group can feel the pull between having good soldiers and having the right force for a neutral state. Please give me the full apparatus: set-up, materials and printable cards, the rules and payoff scheme, a minute-by-minute timeline for the ninety minutes, and a debrief that maps specific moments in the play onto each of the four strands above. I also want the debrief honest about two things — what will predictably go wrong the first time I run this, including the ways bright students will try to game the payoff structure or the adversary rule instead of engaging with the reasoning, and which feature of the problem the simulation simply cannot reproduce and therefore has to be supplied by me afterwards; my own guess is that it cannot reproduce the multi-decade horizon, genuine uncertainty about another state's intentions, or the moral remainder left over when an aggregate benefit is supposed to justify coercing some identifiable person. Do not lecture me on the philosophy in your answer, and please write it in British English.
reasoning: |-
  We are designing a simulation game for a 90-minute undergraduate seminar on military service systems. The key learning outcomes are to understand that the choice between conscription and volunteer forces involves multiple trade-offs (fiscal cost, opportunity cost, mobilisation lag, replacement depth, and signalling) and that conscription can serve as a pre-commitment device.

  The game will have:
  - 18 students, each with a unique role card (occupation, earnings, and possibly special conditions).
  - Phases: long peace, crisis, and sustained conflict.
  - A budget constraint for the state.
  - Two types of forces: a professional volunteer force (high quality per soldier, good for expeditionary operations) and a conscript/reserve force (large numbers, good for territorial denial, with lower per-soldier cost but higher opportunity cost for individuals).
  - A mechanical adversary that behaves based on pre-set rules (to avoid instructor bias).

  Materials:
  - Index cards (for role cards and possibly for other game components).
  - Projector (to display game state, rules, and phase transitions).
  - Movable chairs (to facilitate group discussion and voting).

  The game will be played in rounds representing different time periods. The state (the group) must decide on military policy, including:
  - The size and type of force (professional vs. conscript).
  - Who is compelled to serve (if conscription is in place).

  We need to design:
  1. Role cards with occupations and earnings (and some special conditions).
  2. A budget system (tax revenue based on the economy, which is the sum of students' earnings minus any disruption from war).
  3. Adversary rules: the adversary (a state) will decide to attack based on the perceived strength of the defending state (which is the group). The perceived strength is a function of the military system in place and its size, with a focus on the deterrent effect of having a reserve system.

  Key mechanics:
  - **Fiscal cost**: Professional soldiers are paid a market wage (which is high in a rich country) and conscripts are paid a low stipend. However, the opportunity cost of conscription is the lost earnings of the conscripted individuals.
  - **Mobilisation lag**: A reserve force can be mobilised quickly in a crisis, whereas expanding a professional force takes time (so in the crisis phase, if they have only a small professional force, they cannot expand it quickly enough).
  - **Replacement depth**: In sustained conflict, losses occur. The professional force is hard to replace (because recruitment and training take time) whereas the conscript/reserve system has a large pool of trained reserves.
  - **Signalling**: The adversary's decision to attack is influenced by the military system in place during the long peace. If the state has a reserve system, it signals a strong deterrent and the adversary is less likely to attack.

  Game phases:
  1. **Long peace (several rounds)**: The group decides on military policy. They can:
     - Maintain a conscription system (with a reserve) or switch to a volunteer force.
     - Set the size of the standing force and the reserve (if any).
     - Decide who to conscript (if applicable) from the population (the students). This will affect individual payoffs (if conscripted, they get a low stipend and lose their civilian income).

     At the end of each round in the long peace, the adversary assesses the state's military capability and decides whether to attack (based on a probability that decreases with stronger deterrent).

  2. **Crisis (one round)**: If the adversary decides to attack, the crisis phase begins. In this phase, the state can mobilise reserves (if they have a reserve system) within one round. Without a reserve, they must rely on the standing professional force and cannot expand it in time.

  3. **Sustained conflict (several rounds, if crisis leads to war)**: The state must replace losses and continue fighting. Losses are higher for a small professional force if it is used in territorial denial (for which it is not as effective) but lower if used in expeditionary operations (which is not the scenario for a neutral state). The reserve force can absorb more losses because of replacement depth.

  Payoff for students:
  - Individual payoff: During peace, if not conscripted, they earn their civilian income. If conscripted, they get a stipend (e.g., £5,000) and lose their civilian income. During war, if mobilised, they get the same stipend and face a risk of becoming a casualty (which would remove them from the game and impose a penalty on the state's budget and morale).
  - Collective payoff: The state's survival and the avoidance of war (which would disrupt the economy and cause casualties). Also, the state might get a bonus for winning the war or maintaining sovereignty.

  Adversary rules:
  - In the long peace phase, at the end of each round, the adversary will attack with a probability that is high if the state has a small military (professional only) and low if it has a large reserve. We can set a base probability and then adjust:
     - If the state has a reserve system (with a significant reserve force), the probability of attack is low (e.g., 10% per round).
     - If the state has only a professional force (with no reserve), the probability is high (e.g., 40% per round) because it is an easier target.
     - The actual attack decision is made by a die roll or a random number generator (to avoid instructor bias).

  Losses in war:
  - In each round of conflict, the state suffers losses. The loss rate is higher for the professional force when used in territorial defense (because they are outnumbered) than for the reserve force (which is designed for mass defense). For example:
     - Professional force: 20% losses per round when defending territory.
     - Reserve force: 10% losses per round (because they are more numerous and can rotate).

  Replacement:
  - Professional force: Can only be replaced by recruiting new volunteers, which takes time (one round of training) and costs money (the high wage).
  - Reserve force: Can be replaced immediately from the trained reserve pool, but the pool is depleted.

  Budget:
  - The state collects taxes (a flat rate, say 20%) from the civilian earnings of the population (the students). This is the fiscal budget.
  - Military spending:
     - Professional soldiers: High wage (e.g., £50,000 per soldier per year).
     - Conscripts in active duty: Low stipend (e.g., £10,000 per soldier per year) but note the opportunity cost (the lost tax revenue from their civilian job).
     - Reserve force (when not mobilised): Low maintenance cost (e.g., £2,000 per reservist per year for training).

  Special roles:
  - Some students have special conditions:
     - High-earning professionals (e.g., doctor, lawyer) who would lose a lot if conscripted.
     - Students (with low earnings) for whom conscription is not a big opportunity cost.
     - One or two conscientious objectors: if conscripted, they cause morale problems (e.g., reduce the effectiveness of the unit).

  Game timeline (90 minutes):
  1. Introduction and setup (10 minutes)
  2. Long peace phase (30 minutes, 3-5 rounds, each round 5 minutes of discussion and decision)
  3. Crisis phase (if triggered) (5 minutes)
  4. Sustained conflict (if war occurs) (20 minutes, 2-4 rounds)
  5. Debrief (25 minutes)

  Detailed rules:

  Set-up:
  - Each student gets a role card with:
     - Occupation
     - Annual civilian earnings (ranging from £10,000 to £100,000)
     - Special condition (if any): e.g., "Conscientious Objector: If conscripted, the unit you are in suffers 10% more casualties", or "Essential Occupation: If conscripted, the state loses 2% of its tax revenue from the disruption to essential services", or "Military Family: You are willing to serve at half the normal professional wage".

  - The group is told they are the citizens and the government of a small neutral state. They must decide on military policy. The state's budget is the sum of a flat tax (20%) on the civilian earnings of those not in active military service.

  - The military options:
     - Option A: Professional force only. Soldiers are paid £50,000 per year. The size of the force is limited by the budget. They are highly effective in expeditionary operations but only moderately effective in territorial defense (and in our scenario, the state needs territorial defense).
     - Option B: Conscription system. The standing active force is made of conscripts (paid £10,000) and there is a reserve (trained conscripts who are not active but can be called up). The cost of the active force is low, but the opportunity cost is the lost tax revenue from the conscripts' civilian jobs. The reserve costs £2,000 per reservist per year for training. The size of the active force and reserve is constrained by the budget and the population (18 people). The conscription system is effective in territorial defense and provides a large pool.

  - The group must decide, each round of the long peace:
     a. Whether to have conscription or a volunteer force.
     b. The size of the active force (and reserve, if conscription is chosen).
     c. Which individuals to conscript (if applicable). They can also choose to have a mixed system (some professionals and some conscripts) but that might complicate the simulation.

  To simplify, we can require that the group chooses one system. However, we might allow a mixed system if they wish, but then we must define costs and effectiveness.

  Effectiveness in deterrence and war:
  - The deterrent value (which affects the adversary's attack probability) is determined by the total military manpower that can be mobilised quickly (i.e., the active force plus the reserve if conscription is in place, or just the active force for the professional system). We can set:
     - Deterrence level = (Active force) + (Reserve force)  [for the conscription system]
     - Deterrence level = (Active force) * 1.5  [for the professional system, because they are better soldiers] BUT note: the scenario is territorial denial, for which mass is more important. So we should adjust: for territorial denial, the effectiveness is proportional to the total manpower (with a multiplier for quality?).

  We can define the deterrent value as:
     - If conscription system: Deterrence = (Active + Reserve) * 1.0
     - If professional system: Deterrence = Active * 0.8   (because they are not optimised for mass territorial defense)

  Then the probability of attack in a given round of long peace is:
     - P(attack) = max(5%, 30% - (Deterrence level * 1%))   [example: if deterrence is 25, then P=5%]

  But we must scale deterrence: the population is 18, so the maximum active+reserve might be, say, 15 (leaving some essential civilians). So deterrence level between 0 and 15.

  Alternatively, to make it simpler, we can have discrete levels:

  - If the state has a reserve system with at least 10 total (active+reserve) soldiers: P(attack)=10%
  - If the state has a professional force only and at least 8 professionals: P(attack)=20%
  - If the state has a professional force only and fewer than 8: P(attack)=40%
  - If the state has a reserve system but with fewer than 10: P(attack)=30%

  Adjust the numbers so that having a reserve system with a large force is the best deterrent.

  War fighting:
  - If war breaks out, the state must fight for several rounds. In each round, the adversary inflicts losses. The state can inflict losses too, but we can abstract that: the war continues until the state's military is depleted or they have fought for 4 rounds (then they win by exhaustion?).

  - Losses in war:
     - For a professional force: 25% of the active force is lost each round (because they are outnumbered and not suited for territorial denial).
     - For a conscript force: 15% of the active force is lost each round (because they have the mass to absorb losses).

  - Replacement:
     - Professional force: Can recruit new professionals from the civilian population, but it costs £50,000 and the recruit must agree (or be compelled? but the system is volunteer). However, if they are in a war, they can introduce conscription? That would be a change of system. To avoid complexity, we say that during war they can only recruit volunteers (which is hard: they must offer high wages). We can set that in war, they can recruit up to 2 volunteers per round (if they have the budget) but each volunteer costs £50,000 and the student who volunteers gives up their civilian income (but gets the wage). The opportunity cost is still there.
     - Reserve system: They can call up reserves. Each reserve called up becomes active (and paid the conscript stipend). They can also replace losses by calling up reserves (so the active force can be replenished from the reserve pool). If the reserve pool is exhausted, they cannot replace.

  Victory condition:
  - The state wins if it still has an active force after 4 rounds of conflict. Otherwise, it loses.

  Individual payoffs:
  - At the end of the game, each student gets a score:
     - Base score: the total earnings they accumulated during the game (civilian earnings when not in service, military stipend when in service).
     - If the state loses the war: penalty of £50,000 (to represent the costs of defeat).
     - If the state wins the war: bonus of £20,000.

  This creates an incentive to avoid war (which is costly) but also to prepare for it.

  Game rounds:

  Long peace (each round represents 5 years? We don't have to specify, but we need several rounds to allow for policy changes):
  - Each round:
     - The group discusses and decides on military policy (5 minutes).
     - The instructor calculates the budget: tax revenue = 20% of the total civilian earnings (only from those not in active duty).
     - They allocate the budget to:
          - Paying the active force (professionals at £50,000 each or conscripts at £10,000 each).
          - Paying for the reserve (if any, at £2,000 per reservist).
     - They decide who is in the active force and who is in the reserve (if conscription) or who is recruited as volunteer (if professional). For conscription, they must assign individuals to be conscripted (active) or in reserve (which is a pool, so they just set the number and then the instructor randomly selects or they choose? They should choose to avoid randomness and to see the distributional choices).
     - The instructor calculates the deterrence level and rolls a die for the adversary attack (using the predetermined probability). If attack occurs, the long peace ends.

  Crisis phase (if attack is triggered):
  - The group is informed that the adversary is mobilizing and attack is imminent. They have one round (5 minutes) to respond.
     - If they have a reserve system, they can mobilise the entire reserve immediately (at no extra cost beyond the stipend, which they now pay). The active force becomes the standing active plus the reserve.
     - If they have a professional system, they cannot expand the force in time (because training takes time). They can try to recruit volunteers, but it will take one round (so they will fight the first battle with the existing force).

  Sustained conflict:
  - Each round (representing 1 year of war):
     - The state suffers losses (as a percentage of the active force, depending on the type of force).
     - The state can replace losses (if they have a reserve system, they draw from the reserve pool; if professional, they can recruit volunteers if they have the budget and willing students).
     - The state must pay the active force (and any new recruits).
     - The budget is now constrained by the war economy: tax revenue is only 10% of civilian earnings (because of disruption) and the rest of the budget can be supplemented by borrowing (but we can ignore that and just use the reduced tax).
     - After 4 rounds, if the state still has at least 25% of the initial active force (at the start of the war), they win. Otherwise, they lose.

  Debrief:
  - Map the four strands:
    1. Fiscal cost vs opportunity cost: During the long peace, when they chose conscription, the fiscal cost was low but the opportunity cost (lost tax revenue) was high. When they chose professionals, the fiscal cost was high but the opportunity cost was low (because the professionals are not taken from high-earning jobs? Actually, they are taken from the population, so there is an opportunity cost too, but it might be lower if they recruit from low earners). The group should see that as the country gets richer (if we let earnings grow over time?), the professional force becomes more expensive because the wages have to compete with the civilian sector.

    2. Mobilisation lag: In the crisis, if they had a reserve, they could mobilise quickly. Without, they could not.

    3. Replacement depth: In the war, the reserve system could replace losses easily, while the professional system struggled.

    4. Signalling: The adversary was less likely to attack when they had a reserve system in place. This should have been observed in the long peace.

  - Also, the pre-commitment aspect: During the long peace, they might have been tempted to abandon conscription to save money and avoid compelling service. But then when the crisis hit, they were vulnerable. The game should show that the decision made in peace has long-term consequences.

  Predictable problems:
  - Students might try to game the system by, for example, having a very small professional force to save money and hoping the attack doesn't happen (which is a free-riding temptation: let someone else bear the burden). The instructor should note this during the debrief as an example of the free-rider problem.
  - The adversary rule is mechanical and might be gamed: if they figure out the exact thresholds, they might do the minimal deterrent. But the rules should be kept secret? Or partially transparent? We can tell them the adversary is more likely to attack if the military is weak, but not the exact formula.
  - The time horizon is compressed: in reality, the decision for conscription is made over decades. In the game, it's a few rounds. The instructor must highlight this.
  - The moral dimension: coercing individuals for the collective good. The game does not capture the moral weight of forcing someone to serve. The instructor must bring that up in the debrief.

  Materials to prepare:
  - 18 role cards (occupation, earnings, special condition if any). Example occupations: farmer (£15,000), teacher (£25,000), nurse (£30,000), software engineer (£60,000), doctor (£90,000), etc. Include at least one conscientious objector and one essential occupation (like doctor: if conscripted, the state loses extra tax revenue because of the disruption to healthcare).

  - A spreadsheet for the instructor to calculate budget, deterrence, and attack probability.

  - A projector display to show the current state: military policy, budget, force size, and any other relevant information.

  - A die or a random number generator for the attack probability.

  Now, let's write the full apparatus.

  **Game Title: "The Neutral State: Defence and Deterrence"**

  **Materials:**
  - 18 role cards (see Appendix A for examples)
  - A projector to display the game state (see Appendix B for a template)
  - A die (for the adversary's attack decision)
  - A timer

  **Set-up (10 minutes):**
  - Assign each student a role card. Explain that they are citizens of a small neutral state. Their goal is to maximise their personal earnings and avoid being defeated in war.
  - Explain the three phases: long peace, crisis (if triggered), and sustained conflict (if war occurs).
  - Explain the two military systems:
     - **Professional Force:** Soldiers are paid a high wage (£50,000) and are highly effective in expeditionary operations. They are recruited voluntarily. The state sets the size based on the budget.
     - **Conscription System:** The state compels citizens to serve. Active duty conscripts are paid a low stipend (£10,000). The state also maintains a reserve force (trained conscripts who are not active) at a cost of £2,000 per reservist per year. The state sets the size of the active force and the reserve pool (within the population limit of 18).

  - Budget: The state collects a 20% tax on the civilian earnings of those not in active military service. This tax revenue is the state's budget for military spending and any other government functions (in this game, only military). The military spending cannot exceed the budget.

  - Adversary: A neighbouring state that may attack. The probability of attack is higher if the state's military is weak (as determined by the rules, which are not fully revealed). The students are told: "The adversary is more likely to attack if you have a small military force, especially one that cannot be mobilised quickly."

  **Rules:**
  - **Long peace phase:** Each round represents 5 years. In each round:
     - Discussion: 5 minutes for the group to decide:
          a. Which military system to use (professional or conscription).
          b. The size of the active force (and reserve, if conscription).
          c. Which individuals will be in the active force (if conscription, they are compelled; if professional, they must volunteer and the state must pay the wage). For the professional system, the state can try to recruit volunteers by offering the wage. The students can choose to volunteer or not. If they volunteer, they get the military wage and give up their civilian job. If not, they remain civilians. For conscription, the group compels specific individuals to serve (active or reserve). The reserve pool is drawn from the same population: those not in active duty but assigned to the reserve.
     - Budget calculation:
          - Taxable population: total civilian earnings from those not in active military service.
          - Tax revenue = 20% of total taxable civilian earnings.
          - Military spending:
               - Professional: £50,000 per active soldier.
               - Conscription: £10,000 per active conscript + £2,000 per reservist.
          - If military spending exceeds the budget, they must reduce the force.
     - Deterrence and attack:
          - If conscription system: deterrence = (active conscripts) + (reservists)
          - If professional system: deterrence = (active professionals) * 0.8   (because they are not optimised for territorial defense)
          - Attack probability = max(5%, 30% - deterrence * 2%)   [example: if deterrence=10, then 30-20=10%]
          - Roll a die: if a random number between 1-100 is <= attack probability, the adversary attacks and the long peace ends.

  - **Crisis phase (5 minutes):**
     - If the adversary attacks, the state has one round to respond.
     - They can:
          - If they have a reserve system: mobilise the entire reserve immediately. The active force becomes (original active + reserve). The reserve pool is now zero.
          - If they have a professional system: they cannot expand the force in time for the first battle. They can try to recruit volunteers in this round (which will be available for the next round of conflict).
     - The crisis phase ends, and sustained conflict begins.

  - **Sustained conflict (each round 5 minutes):**
     - Each round represents 1 year of war.
     - Tax revenue is reduced to 10% of civilian earnings (because of war disruption).
     - Losses:
          - Professional force: 25% of the current active force is lost (rounded up).
          - Conscription force: 15% of the current active force is lost (rounded up).
     - Replacement:
          - Professional system: The state can recruit volunteers (if students agree) at £50,000 each. They can recruit up to 2 per round (to simulate slow recruitment).
          - Conscription system: The state can call up any remaining reserves (if any) to replace losses. Each reserve called up replaces one loss. If there are no reserves, they cannot replace losses.
     - War victory condition: After 4 rounds of conflict, if the state's active force is at least 25% of the initial active force at the start of the war, they win. Otherwise, they lose.

  **Individual Payoff:**
  - Each student accumulates earnings during the game:
     - In peace: if civilian, they earn their civilian wage (for 5 years per round) minus 20% tax. If in active duty, they earn the military stipend (and pay no tax on it? Let's say tax is only on civilian earnings, so military pay is tax-free).
     - In war: same as above, but civilian earnings are taxed at 10% (and military pay remains tax-free).
  - At the end:
     - If the state wins the war: add £20,000 bonus.
     - If the state loses: subtract £50,000 penalty.
     - Plus any accumulated earnings.

  **Game Timeline (90 minutes):**
  - 0-10 min: Introduction and distribution of role cards.
  - 10-40 min: Long peace phase (3 rounds, each 5 min discussion + 5 min calculation and adversary roll). The instructor keeps time strictly.
  - 40-45 min: If attack occurred, crisis phase (5 min). If not, continue long peace for a fourth round? But we have to finish on time. Plan for 3 rounds of peace, and if no attack by then, force a crisis? Alternatively, run 3 rounds and then if no attack, move to the next phase? The scenario is that the threat is always there. We can run 3 rounds and then if no attack, the adversary attacks in the fourth round with a high probability? To ensure we have time for conflict, after 3 rounds of peace, if no attack has occurred, the instructor can trigger the crisis with a 100% probability (as tensions rise). But ideally, we want the attack to be probabilistic.

  Alternative timeline for 90 minutes:
  - 0-10: Setup
  - 10-30: Long peace (2 rounds, each 8 minutes: 5 min discussion, 3 min calculation and attack check)
  - 30-35: Crisis (if triggered) or else a third long peace round? We need to be flexible.

  Revised timeline with buffer:
  - 0-10: Setup
  - 10-40: Long peace (3 rounds, each 10 minutes: 5 min discussion, 5 min for instructor to calculate and run adversary)
  - 40-45: Crisis phase (if attack happened in any long peace round)
  - 45-65: Sustained conflict (4 rounds, each 5 minutes: 3 min discussion and 2 min calculation? But 4 rounds in 20 minutes is tight)
  - 65-90: Debrief

  To make it fit, we may reduce the conflict to 3 rounds and allow 5 minutes per conflict round (discussion and calculation).

  **Debrief (25 minutes):**
  - Start by asking the students about their experience: What choices did they make? What were the consequences?
  - Then map to the four strands:
    1. Fiscal vs opportunity cost: "In the long peace, when you chose conscription, the state budget looked healthy because you were paying low stipends. But did you notice the tax revenue dropped because high earners were taken out of the civilian economy? That's the opportunity cost. In a rich country, volunteers would demand high wages, which becomes very expensive."
    2. Mobilisation lag: "When the crisis hit, could you expand your force quickly? If you had a reserve, you could. Without, you were stuck with a small force."
    3. Replacement depth: "In the war, how did you replace losses? With a reserve system, you had trained people to draw on. With a professional system, recruitment was slow and expensive."
    4. Signalling: "The adversary was less likely to attack when you had a strong reserve system in place. That's because they could see your commitment to defense years in advance. You can't build that reputation overnight."

  - Also, highlight the free-riding temptation: "In the long peace, you might have been tempted to avoid conscription and hope that the attack wouldn't happen. That's the same temptation that leads societies to underinvest in defense."

  - What the simulation couldn't capture:
     - The multi-decade horizon: decisions about military systems are made over generations.
     - Genuine uncertainty about an adversary's intentions: in the game, the adversary was mechanical, but in reality, it's hard to know.
     - The moral remainder: coercing individuals for the collective good leaves a moral residue that the game (focused on payoffs) does not capture.

  **Predictable Problems:**
  - Students may not volunteer for the professional force because they earn more as civilians. This could lead to a very small professional force, which then triggers an attack. This is a teaching moment: the free-rider problem.
  - They might try to figure out the exact attack probability formula and min-max. The instructor should remind them that in reality, the adversary's decision-making is opaque.
  - The time pressure: 5 minutes per discussion round is short. The instructor should enforce the time strictly.
  - The complexity of calculations: The instructor should have a spreadsheet ready to compute quickly.

  **Appendix A: Example Role Cards (18)**
