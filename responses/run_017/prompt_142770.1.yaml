  Now part (c) is where issues start. The candidate claims Glivenko holds for first-order logic and that ¬¬∀x(Px∨¬Px) is provable, but this is wrong. They incorrectly state that double negation commutes with universal quantification in both directions, when actually ∀x¬¬Qx → ¬¬∀xQx isn't intuitionistically valid. The counterexample with terminating computations is missing. They get the propositional part right but fail on first-order, so I'll give 3/6 - credit for knowing Glivenko's base case but not the quantifier issue.

  Part (d) begins strong. For (d)(i) they correctly prove ¬A is always stable with a clean derivation, earning 2 marks. (d)(ii) also gets full marks - their stability proof for A→B when B is stable is elegant. But (d)(iii) is brilliant: they refute closure under ∨ with a perfect Kripke countermodel for ¬P∨¬¬P, and even note the collapse implication. This insightful answer deserves 3 marks, so 7/7 for part (d).

  Tallying up: a:5, b:7, c:3, d:7 → 22/25. The main flaws are in part (c)'s quantifier treatment and some minor phrasing. Margin comments should highlight the Glivenko error and praise the countermodel in (d). Overall excellent work despite the quantifier stumble.
