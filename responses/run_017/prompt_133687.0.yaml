  We are designing a procedure for the acquisitions committee to evaluate proposals without first-hand experience, given the constraints. The procedure must be run in about 15 minutes per file and must handle different types of works and information.

   The procedure will be structured as a series of ordered questions. Each question must have clear criteria for a sufficient answer and must specify when it leads to a clear "no" or when it requires passing the decision to the board (or a person) because it involves value judgments or risk tolerance.

   The procedure will categorize information in the file into:
     A. Checkable facts (medium, dimensions, condition, provenance, edition)
     B. Reports of what it is like to spend time with the work (descriptions of experience)
     C. Verdicts about quality or importance
     D. Forecasts about reception

   We also need to handle:
     - Sources that look independent but are not (e.g., multiple curators from the same circle, one gallery's stable)
     - Testifiers with a stake (e.g., our own curator, a gallery)
     - Works whose value might be flattened by documentation (scale, material presence, etc.)

   Steps that are genuine checks vs. judgment calls must be marked.

   Additionally, we need a ledger system to record:
     - When a work arrives and we see it, we record: 
          a. How our own assessment (on a standard scale, e.g., 1-5) compares to the source's verdict.
          b. Whether the key experiential aspects (that were reported) matched our experience.
          c. Any discrepancies in facts (condition, etc.).
     - How a source's past verdicts should affect the weight we give to their next one:
          We can track the source's accuracy. For example, if a source has been consistently accurate (within a small margin) then we give more weight. But we note that perfect agreement might be overvalued.

   Let's design the procedure:

   Procedure Steps:

   1. **Fact Verification** (Genuine Check)
      - Question: Are all the essential checkable facts (medium, dimensions, condition, provenance, edition) present and verified?
      - Sufficient answer: The file must contain:
            - For physical works: condition report from an independent conservator (or if not available, then at least a detailed report from the gallery, but we note the source and potential bias). 
            - Provenance that is traceable and without significant gaps or red flags.
            - Edition details (if applicable) confirming availability and authenticity.
      - If any essential fact is missing and cannot be obtained (e.g., gallery won't release condition report, artist refuses studio visits) then we stop and mark: "Insufficient facts - requires follow-up". If follow-up is impossible, then we must pass to the board with a note that the facts are incomplete and the risk is higher.
      - If facts are present and verified, proceed.
      - If facts are present but raise red flags (e.g., poor condition, dubious provenance), then we stop and return "No" because the work does not meet our minimum standards.

   2. **Source Independence and Credibility** (Genuine Check with Judgment Elements)
      - Question: Are the sources providing the reports, verdicts, and forecasts independent and credible?
      - We break down the sources by type and their stake:
          a. Identify each source and their relationship to the work/artist/gallery.
          b. If a source has a direct financial stake (e.g., gallery, dealer) or a strong reputational stake (e.g., our curator who recently showed the artist), then we note the conflict and discount their testimony accordingly. We do not dismiss it entirely but require corroboration.
          c. Check for independence: if multiple sources are from the same circle (e.g., same gallery, same curatorial group) we treat them as one source.
      - Sufficient answer: We require at least two independent sources that are free of conflict (or if conflicted, then we require more sources to corroborate) for the key elements (especially the experiential report and the verdict).
      - If the only sources are conflicted and there is no independent corroboration, we stop and mark: "Insufficient independent testimony". This may lead to a "No" if the work is heavily dependent on testimony (which it is, since we can't see it). Alternatively, if the work has low risk (e.g., very low price, or we have high trust in the conflicted source based on ledger) we might pass to the board with a note of the risk.

   3. **Experiential Report Assessment** (Judgment Call)
      - Question: Does the file contain at least one detailed, first-hand experiential report that adequately conveys the aspects of the work that might be flattened by documentation? And for works where documentation is known to flatten key aspects (scale, material presence, etc.), are there multiple reports that consistently describe these aspects?
      - Sufficient answer: 
          - For works that are not documentation-dependent (e.g., a video that we can watch in full and whose value doesn't depend on the room): we can rely on our own viewing of the documentation (if available) and one good experiential report might suffice.
          - For works that are highly dependent on physical presence (e.g., large installation, sculpture, painting with subtle materiality): we require multiple independent reports that specifically address the key aspects (scale, material, etc.). If the documentation is poor (e.g., only one handheld walkthrough) and the reports are sparse, we may not have enough to go on.
      - If the work is of a type that requires physical presence and the file lacks sufficient experiential reports, we stop and return "No" because we are effectively buying blind on the most important aspects.
      - If the work is of a type that we can judge via documentation (like the video) and we have the documentation, then we can proceed even with fewer reports.

   4. **Verdict and Forecast Assessment** (Judgment Call)
      - Question: Do the verdicts about quality and forecasts about reception align across independent sources? And are these verdicts backed by the experiential reports?
      - Sufficient answer: 
          - We look for consistency in verdicts among independent sources. If there is significant disagreement (e.g., one source says it's a masterpiece, another says it's mediocre) we note the risk and may pass to the board because it becomes a matter of taste and risk tolerance.
          - We also check that the verdicts are not just stated but are supported by the experiential reports (i.e., the reasons given match the experience described).
      - If the verdicts are uniformly positive and well-supported, we proceed. If not, we may stop and pass to the board with a note of the disagreement.

   5. **Risk Assessment and Board Referral** (Judgment Call and Policy)
      - Question: Given the above, what level of risk remains? And is that risk acceptable within our policy?
      - We consider:
          a. The price relative to our budget and the risk (high price with high uncertainty is more risky).
          b. The type of work and our ability to judge it without first-hand experience (as assessed in step 3).
