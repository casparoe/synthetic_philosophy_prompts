      - When evaluating a new proposal, we use the ledger to adjust the weight of a source's testimony. For example, if a source has a history of being off by more than 1 point, we discount their verdict. But we also note that perfect agreement might be rare and we should not expect it.

   7. **Stopping Rules**:
      - At any step, if we get a clear "No" (e.g., missing facts, insufficient independent sources, or the work type is too risky and we lack the required reports) we stop and return "No".
      - If we get to the end and the risk is low, we approve.
