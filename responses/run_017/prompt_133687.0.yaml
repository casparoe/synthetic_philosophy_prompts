   One-Page Version of the Procedure:

   **Acquisition Committee Evaluation Procedure**

   **Purpose**: To evaluate proposed acquisitions without first-hand experience in 15 minutes per file, categorizing information and assessing risks.

   **Steps**:

   1. **Fact Check** (Genuine Check):
      - Q: Are all essential facts (medium, dimensions, condition, provenance, edition) present and verified?
      - Sufficient: Condition report (independent preferred), complete provenance, edition details.
      - Stop if: Missing facts and cannot obtain → "Insufficient facts" → Refer to board with risk note.
      - Red flags (e.g., poor condition, dubious provenance) → "No".

   2. **Source Independence and Credibility** (Genuine Check with Judgment):
      - Q: Are sources independent and credible?
      - Identify conflicts (financial, reputational) and source inter-dependencies.
      - Sufficient: At least two independent sources without conflict, OR one conflicted source plus one independent corroborating source.
      - Stop if: Only one source (even with conflict) → "Insufficient independent testimony" → Refer to board with risk note and ledger history.

   3. **Experiential Report / Documentation Assessment** (Judgment Call):
      - Q: Can the work be judged by the provided documentation? If not, are there sufficient experiential reports?
      - For documentation-dependent works (installations, sculptures, etc.): require multiple detailed, independent experiential reports.
      - For works that can be judged by documentation (videos, high-res images of 2D works): the committee must review the documentation and agree it is sufficient.
      - Stop if: For a work requiring physical presence, insufficient reports → "No" (or refer to board if other factors mitigate).

   4. **Verdict and Forecast Consistency** (Judgment Call):
      - Q: Are verdicts consistent and backed by experiential reports?
      - Look for consistency across independent sources and support in the reports.
      - Stop if: Significant disagreement → Refer to board.

   5. **Risk Assessment** (Judgment Call and Policy):
      - Consider price, work type, source credibility (ledger), and remaining uncertainties.
      - Low risk: Approve.
      - High risk: Refer to board with risk summary.

   **Ledger**:
      - After acquisition, record:
          a. Our assessment (1-5) and key aspects.
          b. Comparison to sources' verdicts (difference in scores).
          c. Match between experiential reports and our experience.
          d. Fact discrepancies.
      - For sources: track average verdict difference and accuracy rate.

   **Stopping Rules**:
      - "No": Step 1 red flags, Step 3 failure for high-risk works without board referral.
      - Refer to board: When risk is high, insufficient sources/facts, or when judgment is required.

   **What the Procedure Cannot Do**:
      - Guarantee aesthetic judgment without first-hand experience.
      - Eliminate risk for works that require physical presence.
      - Replace board decisions on value and risk tolerance.

   Now, the detailed procedure with questions and criteria:

   Due to length, I'll provide the one-page version above and the detailed version in the following ordered questions format.

   Detailed Procedure:

   Step 1: Fact Verification
     - Q1: Does the file include all essential facts: medium, dimensions, condition report, provenance, and edition (if applicable)?
          - Condition report must be from an independent conservator if available; if from the gallery, note potential bias.
          - Provenance must be traceable and without gaps or red flags.
     - If any fact is missing and cannot be obtained (e.g., gallery refuses condition report), then:
          - If the fact is critical (e.g., condition for a fragile work) → Stop: "Insufficient facts" → Refer to board with note.
          - If the fact is less critical (e.g., minor gap in provenance for a living artist) → Note the gap and proceed, but mark risk.
     - If facts are present but problematic (e.g., condition report shows damage) → Stop: "No".

   Step 2: Source Independence and Credibility
     - Q2: How many independent sources are there for the experiential reports, verdicts, and forecasts? And do they have conflicts?
          - Independence: Sources are not from the same gallery/circle and have no financial stake.
          - Conflicts: Gallery, dealer, artist, or curator with recent show of the artist has a conflict.
          - Credibility: Check ledger for past accuracy (if available).
     - Criteria:
          - Minimum: Two independent sources without conflict OR one conflicted source plus one independent source.
          - If only one source (conflicted or not) → Insufficient → Refer to board with note and ledger history.
          - If multiple sources but all conflicted (e.g., all from the same gallery) → Count as one conflicted source.

   Step 3: Experiential Report / Documentation Assessment
     - Q3: Is the work of a type that can be adequately judged by the provided documentation?
          - Types that can: Video (if we can watch in full), digital works, and 2D works with high-quality, detailed images.
          - Types that cannot: Installations, sculptures, and any work where scale, materiality, or environment are crucial.
     - If the work can be judged by documentation:
          - We must have that documentation (e.g., full video, multiple high-res images) and the committee must review it within the time.
          - If the documentation is sufficient → Proceed.
          - If not → Stop: "Insufficient documentation" → Refer to board if the work is otherwise compelling.
     - If the work cannot be judged by documentation:
          - We require at least two independent, detailed experiential reports that describe the key aspects (scale, material, etc.).
          - If we have only one report → Refer to board with note of risk.
          - If no report → Stop: "No" (or refer to board if price is very low and source credibility high).

   Step 4: Verdict and Forecast Consistency
     - Q4: Are the verdicts consistent across independent sources and supported by the experiential reports?
          - Look for agreement on quality and importance.
          - Check that the verdicts are not just stated but are backed by descriptions.
     - If there is significant disagreement (e.g., one positive, one negative) → Refer to board.
     - If the verdicts are consistent and supported → Proceed.

   Step 5: Risk Assessment
     - Q5: What is the overall risk?
          - Factors: 
              a. Price (high price → high risk).
              b. Work type (hard to judge remotely → high risk).
              c. Source credibility (low credibility → high risk).
              d. Fact gaps and documentation issues.
          - If risk is low (low price, easy-to-judge type, credible sources, no gaps) → Approve.
          - If risk is moderate or high → Refer to board with a summary of risks.

   Ledger Update:
     - After acquisition and viewing, record:
          a. Our overall verdict (1-5) and key aspect scores.
          b. Each source's verdict (translated to 1-5) and the absolute difference.
          c. Whether our experience matched the experiential reports (yes/partially/no).
          d. Any fact discrepancies.
     - Update the source's ledger entry with the new data.

   This procedure should fit within 15 minutes per file once the committee is familiar with it.
answer: |-
  Below is a structured 15-minute procedure for evaluating acquisition proposals, designed for your constraints. It categorizes information, flags risks, and clearly distinguishes factual checks from judgment calls. **Bold terms** indicate key concepts, and *italicized text* marks judgment steps. A one-page summary follows the detailed procedure.

  ---

  ### **ACQUISITION EVALUATION PROCEDURE**  
  *(Run sequentially; stop if any step returns "No" or "Board Referral")*

  1. **FACT VERIFICATION (Genuine Check)**  
     *Question:* Are all critical **checkable facts** (medium, dimensions, condition, provenance, edition) present, unambiguous, and risk-free?  
     - *Sufficient Answer:*  
       - Condition report from an independent conservator (or gallery if unavoidable).  
       - Provenance with no gaps or red flags (e.g., disputed ownership).  
       - Edition details confirmed (if applicable).  
     - **No** if:  
       - Unverifiable facts critical to value (e.g., no condition report for fragile work).  
       - Factual red flags (e.g., damaged work, incomplete provenance).  
     - **Board Referral** if:  
       - Facts missing but obtainable (e.g., gallery delays report).  
       - Risk is acceptable despite gaps (e.g., low price, trusted artist).  
     - *Procedure Note:* Stops here if facts are flawed. Requires follow-up; if impossible, board decides risk tolerance.

  2. **SOURCE ASSESSMENT (Genuine Check with Judgment)**  
     *Question:* Are sources for reports/verdicts **independent and credible**, with conflicts mitigated?  
     - *Sufficient Answer:*  
       - ≥2 independent sources (e.g., different institutions/circles).  
       - Conflicted sources (e.g., dealer, invested curator) corroborated by ≥1 neutral party.  
       - Past accuracy tracked in ledger (see *Ledger Rules* below).  
     - **No** if:  
       - Only conflicted/identical sources (e.g., three curators from one gallery).  
       - Source credibility low per ledger (e.g., consistent overrating).  
     - **Board Referral** if:  
       - Single conflicted source with strong ledger history.  
       - Independence unclear (e.g., new correspondent).  
     - *Judgment Call:* Weighting source credibility based on ledger history.  

  3. **EXPERIENTIAL GAP TEST (Judgment Call)**  
     *Question:* Is there **sufficient evidence** to assess qualities flattened by documentation (scale, materiality, environment)?  
     - *Sufficient Answer:*  
       - For *documentation-resistant works* (installations, sculptures): ≥2 detailed first-hand descriptions from independent sources.  
       - For *documentation-stable works* (video, digital): direct viewing possible or credible source testimony.  
     - **No** if:  
       - Documentation-resistant work with only visual records (e.g., single walkthrough video) and no experiential reports.  
     - **Board Referral** if:  
       - Partial evidence (e.g., one strong report) and low price/high artist trust.  
     - *Judgment Call:* Deciding if documentation/resolves aesthetic uncertainty.  

  4. **VERDICT & FORECAST TRIAGE (Judgment Call)**  
     *Question:* Are **verdicts** (quality) and **forecasts** (reception) consistent, well-supported, and distinct from facts/experiences?  
     - *Sufficient Answer:*  
       - Verdicts linked to experiential reports (e.g., "The texture creates tension" vs. "This is a masterpiece").  
       - Forecasts backed by evidence (e.g., critic quotes, comparable artist reception).  
       - No major conflicts between sources.  
     - **Board Referral** if:  
       - Verdicts unsupported by experiences (e.g., "Important work" with no description).  
       - High forecast risk (e.g., polarizing work).  
     - *Judgment Call:* Separating actionable data (facts, experiences) from opinions (verdicts/forecasts).  

  5. **RISK SYNTHESIS (Judgment Call)**  
     *Question:* Does the **total risk** (financial + aesthetic) align with our mission and resources?  
     - *Sufficient Answer:*  
       - Low risk: Documentation-stable work, low price, trusted sources.  
       - High risk: Documentation-resistant work, high price, conflicting data.  
     - **Approve** if:  
       - Low risk and all prior steps passed.  
     - **Board Referral** if:  
       - Residual risk (e.g., high uncertainty on key aesthetic element).  
     - *Procedure Note:* Cannot override "No" from prior steps.  

  ---

  ### **LEDGER RULES**  
  **Record when work arrives:**  
  - Committee’s rating (1–5 scale: 1 = poor, 5 = exceptional) of:  
    - Overall aesthetic impact.  
    - Key experiential qualities (e.g., scale, materiality).  
  - Discrepancies vs. file (e.g., condition issues, overstated experiences).  
  - Source accuracy:  
    - Verdict accuracy: |Source rating – Committee rating|.  
    - Experience accuracy: Match/Mismatch on key qualities.  

  **Weight adjustments for future proposals:**  
  - Trust premium: Source gains weight if average verdict accuracy ≤0.5 over ≥3 works.  
  - Trust penalty: Source loses weight if:  
    - Average verdict accuracy >1.0 OR  
    - ≥2 experience mismatches.  
  - *Note:* Perfect agreement (accuracy=0) is downgraded to "highly reliable" (not infallible).  

  ---

  ### **APPLICATION TO YOUR CASES**  
  **Case 1: Video Work**  
  - Step 1: Facts verified (digital file, no condition risks). → Pass.  
  - Step 2: Correspondent conflicted (past transactions), but ledger shows accuracy. → **Board Referral** (single source, mitigated by ledger).  
  - *Outcome:* Not automatic approval; board weighs ledger trust vs. conflict.  

  **Case 2: Room-Sized Installation**  
  - Step 1: Facts verified. → Pass.  
  - Step 2: Sources likely conflicted (gallery?); no independent reports. → **No** (if sources conflicted) or **Board Referral** (if neutral sources).  
  - Step 3: **No** – Documentation flattens scale/materiality; no experiential reports.  
  - *Outcome:* Rejected unless board overrides for artist significance.  

  **Case 3: Small Painting**  
  - Step 1: Facts verified. → Pass.  
  - Step 2: Dealer conflicted, but ledger shows near-perfect accuracy. → **Board Referral** (conflict requires override).  
  - Step 3: **No** – No experiential report; painting’s materiality may not translate.  
  - *Why not paperwork?* Experiential gap is critical for aesthetic judgment – verdicts ≠ experiences. Dealer’s accuracy doesn’t resolve how the work *feels*.  
  - *Outcome:* Rejected. Board can approve only if they accept risk of missing qualities.  

  ---

  ### **ONE-PAGE SUMMARY**  
  **ACQUISITION EVALUATION FLOW**  
  **Time:** 15 min/file. **Input:** Proposal file, ledger.  
  1. **Facts:** Verify medium, condition, provenance, edition.  
     - *Stop if:* Unfixable gaps/red flags → **No**.  
     - *Board if:* Fixable gaps → Flag risk.  
  2. **Sources:** Require ≥2 independent or ≥1 conflicted + 1 neutral.  
     - *Stop if:* Only conflicted/identical sources → **No**.  
     - *Board if:* Strong ledger history → Flag conflict.  
  3. **Experience Gap:**  
     - For installations/sculptures: Need ≥2 firsthand reports.  
     - For videos/stable works: Need direct viewing or credible testimony.  
     - *Stop if:* Documentation-resistant work with no reports → **No**.  
     - *Board if:* Partial evidence → Flag uncertainty.  
  4. **Verdicts/Forecasts:** Isolate opinions from facts/experiences.  
     - *Board if:* Unsupported claims → Flag subjectivity.  
  5. **Risk Synthesis:** Approve only if low risk (price, documentation, sources).  
     - *Board if:* Residual risk → Decision on values/tolerance.  

  **LEDGER TRACKING**  
  - Post-arrival: Rate work (1–5), note discrepancies, source accuracy.  
  - Adjust weight: Trust premium (accuracy ≤0.5), penalty (>1.0 or ≥2 mismatches).  

  **WHAT IT CAN'T DO**  
  - Replace first-hand aesthetic experience.  
  - Eliminate risk for documentation-resistant works.  
  - Resolve value disputes (board decides).  

  **OUTPUTS**  
  - **Approve:** Low risk, all steps passed.  
  - **No:** Unresolvable flaw (fact, source, experience).  
  - **Board Referral:** Judgment on risk/value needed.  

  ---  
  This procedure prioritizes defensible "No"s early, flags subjectivity transparently, and uses the ledger to correct source weighting. It forces explicit risk decisions rather than optimism bias.
