prompt: |-
  Hey, you're an expert formal epistemologist and a professional philosopher, so think carefully and start with a quick bullet-point brainstorm before you draft anything. Im an undergrad in a formal epistemology / philosophy of probability class this term, and I host a super small podcast where we interview folks about niche probabilty puzzles. Next week my guest is Dr. Iris Kemper, a made-up but rigorous defender of the relative-information-minimizing (minimum-KL or max-ent) solution to the Judy Benjamin problem. Here's the setup you'll need: Judy is dropped into an area cut into four quadrants—Blue HQ, Blue Second Company (2C), Red HQ, Red 2C—with a flat prior of 1/4 on each; she then gets a radio message saying she is in either Blue territory or Second Company, which equivalently drives her conditional P(2C | Red) from 1/2 up to 1. Kemper's version says: minimize KL from the prior subject to that new conditional while keeping the old conditional P(2C | Blue) at 1/2, which gives posterior 1/3 on Blue HQ, 1/3 on Blue 2C, 1/3 on Red 2C, and 0 on Red HQ, so Judy's P(Blue) rises from 1/2 to 2/3. Her stock reply to the classic worry raised in van Fraassen's 1986 sequel—where the update makes Judy more confident she is not in Red, so the probability of the antecedent seems to shift even though all she learned was a conditional—is that this is not a bug but the message's likelihood ratio doing its work: the message was certain if she was in Blue but only 1/2 likely if she was in Red, so of course P(Red) drops to 1/3. She also has a new, niche extension: if the message is only 80% reliable (there's a 0.2 chance of a garbled version that would be sent from any quadrant), she claims you first do a Jeffrey update on the clear-versus-garbled partition and then minimize KL subject to the same conditional constraint. Draft me eight to ten interview questions that go beyond letting her restate the view. I want at least one question each on: (a) the 1986 antecedent-shift worry and why the drop in P(Red) isn't illicit double-counting; (b) how the 80%-reliable-message extension is supposed to work and whether doing a Jeffrey update before minimizing KL is order-independent; (c) what she'd say to the rival who insists a message indicating a conditional should preserve P(Red) at 1/2 and only change the odds inside Red; and (d) what decision-theoretic or accuracy-based evidence (Dutch-book, scoring-rule, whatever) could ever show her framework wrong. For each question, add a follow-up keyed to the answer she's most likely to give—she'll probably fall back on saying that's just Bayes, or that it's a research program rather than an objection, or that the rival is smuggling in extra evidence. Keep it conversational, and don't ask her for citations or reading lists.
