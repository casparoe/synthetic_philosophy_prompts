  So:

  Stakes Round (5 min):
  - "Now, let's test your memory for Round 1. We are going to do this with stakes: you get a point (a token) if you are correct. First, without looking at any record, write on your whiteboard: what was your private state in Round 1? ZAP or NO ZAP? Hold it up. I'll just see the variety, but don't worry, no score yet."
  - "Now, look at your public readout for Round 1 (it's on your record sheet). You can use that to help. It was 70% reliable. You can change your answer if you want. Write your final answer on a new part of the whiteboard (or flip it) and hold it up. Then, we'll reveal the truth and score."

  They uncover the private state for Round 1 and check. If they got it right, they get a token (or a mark on the flip chart).

