    - Important: They don't report anything yet. They just record the private state for this round on their card (so they have a record of what it was at the time). Then the round ends.

  20-25 min: Main Round 2
  - "Round 2: I assign new private states (whisper). You roll for public readout. Now, I ask you to remember what your private state was in Round 1. Then, on your whiteboard, I want you to write whether you were having a ZAP in Round 1 or not. But note: you are not allowed to look at your index card from Round 1. You have to rely on your memory. Then, hold up your whiteboard."
