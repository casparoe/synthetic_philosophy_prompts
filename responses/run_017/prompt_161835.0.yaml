  - A set of dice (to simulate the noisy public readout) OR a simple app on a tablet that shows a random number (with 70% chance matching the private state) but dice are more tactile and fun.
  - A flip chart or large paper for the facilitator to record group decisions and scores.
  - Timer (phone or stopwatch).
  - Stickers or tokens for points (if using a points system).

  Roles: All participants are in the same role, but the facilitator (you) guides the activity.

  Detailed Minute-by-Minute Plan:

  0-5 min: Introduction
  - "Tonight we're going to play a game about words and meanings. We're going to invent a new word and try to use it. But there's a twist: each of you will have a private experience that only you can feel, and also a public signal that's kind of connected to it but not perfectly. The goal is to see how we build shared meaning and what happens when our private world and the public world don't match up."
  - "No jargon, no philosophy terms — just a game. And we'll talk about what happened at the end."

  5-10 min: Setup and Rules
  - Hand out index cards and whiteboards (or paper) to each participant.
  - Explain:
    - "Each of you will experience a private state. It's just a simple feeling that we'll represent by a color: either RED or BLUE. But you won't see the color — you just feel it. Since we can't actually give you a feeling, we'll simulate it. I'll assign you a color at random at the start of each round by handing you a secret note (or you can roll a die to determine it, but to keep it private, we'll do it this way). Actually, let's make it even simpler: I'll whisper a color (RED or BLUE) to each of you at the start of each round. That's your private sensation. You must keep it secret."
    - "Then, each of you has a public readout. This is a device (or a die) that you roll. We fix it so that 70% of the time, the readout matches your private color. How? We'll use a 10-sided die (or a regular die but with a rule). For example, if your private state is RED, then rolling a 1-7 on the d10 means the public readout shows RED, and 8-10 BLUE. And vice versa for BLUE. But we don't have d10s? Then use a regular six-sided die: for private RED, 1-4 (about 67%) shows RED, 5-6 shows BLUE. Close enough. Or use an app that does this randomly and displays a color. But let's stick with dice for simplicity and tangibility."
    - "Now, we are going to invent a word for this private feeling. Let's call it... 'ZAP'. So when you have the RED feeling, you are having a ZAP. When you have the BLUE feeling, you are not having a ZAP. But note: the public readout is about your private state. So if the public readout shows RED, it's indicating that you are having a ZAP (with 70% reliability)."
    - "In each round, I will assign your private state (by whispering). Then you roll your die to get the public readout. Then, I will ask you to remember your private state from the previous round and report on it using the word we've coined. But wait, we have to start. So the first round is different."

  10-15 min: Practice Round
  - "Let's do a practice round to get the hang of it. Round 0: I'll assign each of you a private state (whisper 'RED' or 'BLUE' randomly to each). Then you roll your die to get the public readout. Then, I will ask you: What was your private state in this round? But we haven't had a previous round, so we'll skip the memory part for now. Instead, we'll just practice the reporting: I want you to write on your index card (private) what you think your private state is (but you just got it, so you know). Then, on your whiteboard, you write the public readout (the color from the die). Then we'll all hold up our whiteboards so we can see the public signals. We won't use the word 'ZAP' yet."
    - Do the round: assign, roll, write private and public, then hold up public. Discuss: "Look around — see how the public signals are mostly but not always matching the private states? That's the 70%."

  15-20 min: Main Round 1
