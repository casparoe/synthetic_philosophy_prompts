  During each round, they record:
  - Private state (on index card, kept face down or in a way they can't see until the end)
  - Public readout (on a separate card? or on the whiteboard we don't save? We need to save it for them.)

  Better: Each participant has a personal record sheet (one sheet per round) where they write:
  - Round number
  - Private state (they write it down at the time, then fold it so they can't see it until the end)
  - Public readout (they write it at the time and it's visible to them and others? But we want it to be available for later reference. So they keep it on their record sheet, but they can look at it later.)

  So materials: each participant gets a record sheet (paper) with three sections (Round1, Round2, Round3). For each round, they have:
  - Private state: write and then fold over (or cover with a sticker) so they can't see it until the end.
