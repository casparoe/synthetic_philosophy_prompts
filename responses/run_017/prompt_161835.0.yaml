    - "Now, look at the public readout you just got in Round 2. This public readout is a proxy for your current private state (Round 2), but we are going to use it as a hint for your memory of Round 1? No, that doesn't match. We need to adjust."

  Problem: The public readout in Round 2 is about Round 2, not Round 1. We need a way for the public readout to be about the past private state? But that's not how we set it up.

