  - "We'll now test your memory for Round 1. Without looking at your private record, write on your whiteboard your answer: ZAP or NO ZAP for Round 1. Hold it up. Then, look at your public readout for Round 1 (which is on your record sheet). Now, you can change your answer if you want. Write your final answer and hold it up again. Then, we reveal the private state and score."
  - Then repeat for Round 2.

