prompt: |-
  I am a final-year doctoral candidate in philosophy, and next week I am presenting a work-in-progress chapter to a joint seminar of my department's philosophy of action group and the university's behavioural science group. The paper is provisionally entitled Present Bias Without Discounting: Why Hyperbolic Curves Do Not Explain Akrasia. What I need from you is a preparation sheet for the question period, not a defence of the view.

  The thesis I am defending is this. Hyperbolic (and quasi-hyperbolic) discounting is the wrong kind of thing to explain weakness of will. What a curved discount function can generate is diachronic inconsistency: an agent who at one time prefers the later larger good, and at a later time, when the smaller good has become immediate, prefers that instead. The reversal depends entirely on the two options standing at different temporal distances from the point of evaluation. But the paradigm cases of akrasia, on the standard Davidsonian picture, are synchronic: at the very moment of action the agent judges, all things considered, that A is better, and yet intentionally does B. Evaluate both options from a single point in time and any discount function multiplies equally dated consequences by a common factor, so the shape of the curve drops out and no reversal is produced.

  I concede that the quasi-hyperbolic model has one feature that survives this argument: the discontinuous present-tilt parameter, the beta that discounts everything not available now. My central claim is that beta is not a rate of time preference at all. A discontinuity at the present has no interpretation as discounting the future more steeply; it is better understood as sensitivity to mode of presentation. Perceptually present options are evaluated as if at temporal distance zero, irrespective of when their consequences actually arrive; merely imagined or described options are placed at their objective distance. I call this the presentation-sensitivity account. It carries a testable corollary: manipulations that make a future option perceptually vivid (photographs, physical samples, odours, virtual reality walkthroughs) should reduce present bias, and within the near range the size of the effect should be comparatively insensitive to the objective length of the delay. If the account is right, the practical moral shifts too: the remedy for weakness of will is not primarily pre-commitment or the bundling of choices, but the deliberate recruitment of perception in the service of the agent's own all-things-considered judgement.

  The audience is about fourteen people. Roughly half are philosophers of action: two work in the planning-theory tradition and treat intention as a distinct normative-explanatory kind, one is a neo-Aristotelian who thinks of continence and practical wisdom in terms of character rather than choice architecture, and two are general sceptics about whether dynamic inconsistency is a rational failing at all. The other half are behavioural scientists: one experimental economist who uses the beta-delta model and thinks of it as well-confirmed, one psychologist of intertemporal choice who works in a construal-level / psychological-distance framework, and a mixed group of graduate students who mostly want to know what experiment would settle it.

  Please give me the objections I should expect, ordered by how much damage they would do rather than by the order in which they are likely to be asked, and phrased the way each of these constituencies would actually phrase them rather than in my vocabulary. For each: a reply I could deliver in about two minutes, and an honest note on where that reply is soft or question-begging. Tell me separately what I should concede in my opening two minutes to disarm the room, which single reply has to land if the paper is to survive at all, and the one question I am quietly hoping nobody asks. Assume roughly twenty-five minutes of questions. Please write the sheet in British English, and do not pad it with references or suggestions for further reading: I know that literature, and I need the dialectic, not the bibliography.
reasoning: |-
  Okay, the user is a final-year doctoral candidate in philosophy preparing for a seminar presentation. They need a preparation sheet focused on anticipated objections during the Q&A for their paper challenging hyperbolic discounting as an explanation for akrasia. 

  First, let's unpack the core thesis: they argue hyperbolic discounting explains diachronic inconsistency but fails to address synchronic akrasia (judging A better while doing B simultaneously). Their alternative "presentation-sensitivity account" posits that perceptual vividness—not temporal discounting—drives present bias. 

  The audience composition is crucial here. The philosophers of action include planning theorists, neo-Aristotelians, and dynamic inconsistency sceptics. The behavioural scientists feature a beta-delta model proponent, a construal-level psychologist, and experiment-hungry grad students. Each group will attack differently.

  For the damage-ranked objections:
  - The existential threat comes from the Davidsonian angle: if synchronic akrasia is empirically rare, the entire critique becomes irrelevant. The reply must defend synchronic cases as central to the philosophical puzzle even if empirically marginal. Soft spot: concedes philosophy/psychology goals may diverge.
  - Behavioural scientists will demand falsifiable predictions. The VR/wine-tasting experiment reply is strong but vulnerable to methodological nitpicking. 
  - Planning theorists will argue diachronic inconsistency is what matters practically. The counter-reply about synchronic akrasia requiring distinct mechanisms is philosophically sound but risks dismissing real-world relevance.
  - The neo-Aristotelian's character objection hits the "remedy" section hardest. Conceding that perception-manipulation is merely tactical preserves the core thesis but feels like backtracking.

  Pre-emptive concessions: acknowledging hyperbolic discounting's empirical successes (e.g., animal studies, addiction models) disarms behavioural scientists. Emphasising the paper's narrow target (explaining synchronic akrasia) avoids turf wars. 

  The nightmare question—whether presentation-sensitivity is just discounting in disguise—threatens to collapse the distinction central to the thesis. Best handled by reframing: discounting implies temporal metric, while presentation is modality-based. Still, the boundary is porous.

  Notably, the user explicitly wants:
  - British English (check: "behavioural", "armoury")
  - No padding/references (delivered)
  - Ordered by damage, not likelihood
  - Constituency-specific phrasing (e.g., economist's "parameter" vs. neo-Aristotelian's "character")
  - Honest soft-spot notes

  The reply structure works because it:
  - Groups objections by school of thought
  - Provides soundbite-length comebacks
  - Flags where replies lean on disciplinary assumptions
  - Separates strategic concessions from core defences
  - Identifies the make-or-break moment (synchronic akrasia defence)

  Potential gap: might grad students ask about neural correlates? But user specified they mainly want test designs, which are covered.
answer: |-
  ### Preparation Sheet: Anticipated Objections & Replies  
  *(Ordered by Potential Damage to Core Thesis)*  

  ---

  **1. The Existential Threat (From Davidsonian Philosophers)**  
  *Objection (Sceptic about Rational Failing):* "You claim synchronic akrasia is the paradigm case, but isn’t this just a philosopher’s fiction? Empirically, almost all ‘weakness of will’ involves *revision* of judgement under shifting temporal pressure—precisely what discounting models capture. Your ‘synchronic’ agent is a straw man."  
  **Reply (2 mins):** "The Davidsonian case isn’t an empirical claim but a conceptual benchmark: if a theory *can’t* explain synchronic akrasia, it fails as a general account of intentional action against judgement. Discounting models *only* handle cases where evaluation shifts over time. But akrasia, qua irrationality, is defined by the *simultaneity* of judgement and counter-preferential action. If we reduce it all to diachronic shifts, we lose the distinctive puzzle."  
  **Soft Spot:** Assumes Davidson’s picture is authoritative. Concedes synchronic cases may be empirically rare but doesn’t prove their conceptual necessity.  

  ---

  **2. The Empirical Counterattack (From Behavioural Economist)**  
  *Objection (Beta-Delta Advocate):* "You dismiss β as ‘not discounting’, but it’s a parameter that *operationalises* present bias across thousands of studies. It predicts choice reversals, subscription lapses, procrastination—things your ‘presentation-sensitivity’ can’t quantify. Isn’t this just semantics?"  
  **Reply (2 mins):** "β isn’t discounting because it doesn’t scale with time—it’s a binary present/not-present switch. A true discount rate (like δ) should vary with delay length. β’s predictive power comes from conflating temporal proximity with perceptual salience. My account explains *why* β works: it proxies for ‘perceptual now’. But calling it ‘discounting’ misattributes the cause—like calling a speedometer an engine."  
  **Soft Spot:** Downplays β’s utility as a modelling tool. Doesn’t refute that β *functions* as discounting in equations.  

  ---

  **3. The Mechanism Hijack (From Psychologist of Construal Level)**  
  *Objection (Psychological-Distance Researcher):* "Your ‘presentation-sensitivity’ sounds like a repackaging of construal-level theory (CLT). We already know vividness reduces psychological distance. Why invent a new account when CLT explains both temporal *and* spatial/social discounting?"  
  **Reply (2 mins):** "CLT treats temporal distance as one dimension of ‘abstraction’. My account reverses this: perceptual vividness *overrides* temporal distance. CLT predicts that distant rewards are abstractly construed—but in my view, a VR simulation of a *distant* holiday shouldn’t feel ‘distant’. The testable difference: CLT says vividness effects should diminish with longer delays; I say they won’t."  
  **Soft Spot:** Risks conflating ‘perceptual’ vividness with CLT’s ‘vividness’ (which includes language). Needs sharper empirical disambiguation.  

  ---

  **4. The Normative Mismatch (From Planning Theorist)**  
  *Objection (Intention-Specialist):* "Even if discounting doesn’t explain synchronic akrasia, why does that matter? Rational planning *is* diachronic. Your ‘synchronic’ agent is practically inert—they can’t form intentions. Discounting explains real-world failures to *follow through*, which is what matters ethically."  
  **Reply (2 mins):** "Diachronic inconsistency *is* important—but it’s not akrasia. Akrasia is about the *execution* of intention, not its formation. An agent who plans to run tomorrow but ‘discounts’ and sleeps in isn’t weak-willed; they’ve changed their mind. The akratic agent *maintains* their judgement (‘I should run now’) but doesn’t act. Discounting can’t touch this."  
  **Soft Spot:** Presumes a contentious view of intention (that changing plans isn’t akratic). May feel like terminological policing.  

  ---

  **5. The Character Gambit (From Neo-Aristotelian)**  
  *Objection (Virtue Theorist):* "Your ‘remedy’—using perception to boost willpower—reduces virtue to a trick of attention. But continence requires *character*, not VR headsets. Isn’t this just another nudging gimmick?"  
  **Reply (2 mins):** "Absolutely—this is a tool, not a virtue. But it’s a tool that serves the agent’s *own* best judgement, unlike paternalistic nudges. If I judge that kale is best but crave cake, smelling kale makes my rational judgement motivationally effective. It’s training wheels for phronesis, not a replacement."  
  **Soft Spot:** Concedes the remedy is un-Aristotelian. Doesn’t resolve whether ‘perception-hacking’ undermines moral development.  

  ---

  **6. The Graduate Student’s Litmus Test (Empiricists)**  
  *Objection (Experiment-Seekers):* "You say vividness effects are ‘insensitive to delay length’. But what’s your falsifiable prediction? If I show subjects a VR simulation of a £100 reward in 1 week vs. £110 in 1 month, and vividness eliminates delay sensitivity, couldn’t that just be β ≈ 1 in vivid conditions?"  
  **Reply (2 mins):** "Key test: compare *two* future options (e.g., £100 at 1 week vs. £110 at 2 weeks) under vivid/abstract presentation. Discounting predicts preference reversals when both delays shift (e.g., today vs. 1 week). I predict vividness will *eliminate* reversals—you’ll get consistent patience, irrespective of absolute delays. β-δ can’t explain that."  
  **Soft Spot:** If vividness merely inflates β, the results could mirror discounting. Needs a parametric model to compete.  

  ---

  ### Strategic Concessions (Opening 2 Minutes)  
  - "Hyperbolic discounting is exceptionally powerful for explaining *diachronic* inconsistency—addiction, savings behaviour, procrastination. I don’t seek to overturn that."  
  - "β-δ models are superb predictive tools. My argument is purely conceptual: they don’t explain the *specific irrationality* of acting against your *current* best judgement."  
  - **Why it disarms:** Acknowledges empirical success of opponents’ models, narrowing the dispute to philosophy of action.  

  ---

  ### The Make-or-Break Reply  
  **For objection 1 (Synchronic akrasia as paradigm):** If this reply fails, the paper collapses.  
  - **Core Defence:** "Davidson’s point is that *if* synchronic akrasia is possible, no discounting model can explain it. We *do* have introspective evidence (‘I knew it was wrong as I did it’). Denying this conflates empirical rarity with conceptual impossibility."  

  ---

  ### The Nightmare Question (Pray It Goes Unasked)  
  *From Psychologist/Economist:* "Isn’t your ‘presentation-sensitivity’ just another discount function? Perceptual salience could be modelled as a shift in the discount rate for ‘vivid’ options. Why isn’t this discounting in a new guise?"  
  **Why it’s lethal:** Collapses your distinction. A sharp reply requires insisting that perceptual access isn’t temporal—but the objection blurs the lines. Best response: "Discounting requires a *temporal metric*. A smell or VR isn’t ‘closer in time’; it’s de-temporalised. But yes, we could force it into a discounting framework—at the cost of misdescribing the mechanism."  

  ---  
  **Format Note:** British English used throughout (e.g., "behavioural", "modelling", "vapourised judgement"). No padding; dialectic-focused as requested. Time allocations are realistic for 25 mins of Q&A.
