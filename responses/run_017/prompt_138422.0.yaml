answer: |-
  ### Research Proposal: The Intermediate Normative Terrain of "Expected-but-not-required" Acts  

  **Tight Question Statement:**  
  Is "expected-but-not-required" a distinct, stable normative status for actions (e.g., timely text replies, collegial attendance), irreducible to either statistical regularity or a transitional phase toward obligation, and if so, what non-circular criterion distinguishes it from optional acts?  

  **Why the Standard Two-Tier Picture Fails:**  
  Existing frameworks collapse the middle tier:  
  - **Cost-threshold accounts** (e.g., moderate sacrifice defines supererogation) cannot explain why *low-cost* omissions (e.g., skipping a colleague’s talk) trigger disappointment without blame.  
  - **"Best available option" theories** render expected acts (e.g., fair bill-splitting) non-obligatory *yet* non-praiseworthy, contradicting supererogation’s essence.  
  - **Demandingness arguments** ignore that expectations persist *without* moral weight (e.g., weekend email replies aren’t "too costly" to demand—yet we don’t demand them).  
  Critically, these models lack resources to explain:  
  - The unique reactive attitudes (disappointment ≠ blame; no praise ≠ indifference).  
  - Speech acts like gentle reminders, which presuppose a *claim* weaker than obligation but stronger than preference.  

  **12-Week Work Plan:**  
  - **Month 1**: Conceptual Groundwork  
    - Define the "expected-but-not-required" (ENR) tier via paradigm cases (e.g., prompt replies, collegial courtesies).  
    - Map existing two-tier failures: analyze why ENR acts evade supererogation’s praiseworthiness and obligation’s enforceability.  
    - *Deliverable*: Typology of ENR acts; draft critique of two-tier absorption.  
  - **Month 2**: Stability & Distinctness Tests  
    - Develop non-compliance-based criteria for ENR status (e.g., *normative resilience*: expectations persist even when compliance drops; *speech-act asymmetry*: prompting vs. begging/demanding).  
    - Test the "transitional phase" hypothesis: identify ENR acts stable across contexts (e.g., bill-splitting norms endure without becoming obligatory).  
    - *Deliverable*: Framework for ENR as a distinct status; rebuttal of statistical/temporal reductionism.  
  - **Month 3**: Settling the Question & Synthesis  
    - Argue for/against determinacy: Does ENR’s context-sensitivity preclude a "real" status? Identify settling conditions (e.g., whether expectations generate pro tanto reasons).  
    - Draft journal paper; distill dean’s note on institutional implications (e.g., unspoken academic expectations).  
    - *Deliverable*: Full paper draft; dean-facing summary.  

  **Possible Conclusions & Deciding Factors:**  
  | Conclusion                          | What Would Decide It                                                                 |  
  |-------------------------------------|--------------------------------------------------------------------------------------|  
  | ENR is a distinct, stable tier      | If normative resilience/speech-act asymmetry holds despite variable compliance      |  
  | ENR is merely statistical           | If all reactive attitudes/speech acts reduce to empirical regularity (e.g., "80% do X") |  
  | ENR is contextually unstable        | If acts systematically transition to obligation/optionally across normative systems |  
  | No determinate answer               | If ENR’s criteria are irreducibly circular or culturally relative                   |  

  **Honest Failure Conditions:**  
  1. Inability to isolate a *non-compliance-dependent* criterion for ENR status after rigorous testing.  
  2. Discovery that all ENR examples are either covert obligations (enforced via soft sanctions) or statistical artifacts.  
  3. Collapse of speech-act distinctions under scrutiny (e.g., "gentle reminders" are just weak demands).  

  **Result for the Dean:**  
  A two-page note: "Beyond Obligation: The Hidden Architecture of Academic Expectations." Explains how unenforced but pivotal ENR acts (e.g., peer feedback, service gestures) sustain departmental cohesion, why formalizing them fails, and how to navigate expectations transparently.  

  **Scope Cut if Needed:**  
  Empirical validation (e.g., surveying expectation-violation reactions). Focus remains on conceptual/analytic grounds. *12 weeks is tight but feasible with this trim.*  

