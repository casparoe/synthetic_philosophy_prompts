answer: |-
  ## The Dispositional Mirage: Why Standing Emotions Sink Feeling Theories

  Theories of emotion have long grappled with the vivid, episodic flares of anger, joy, or fear. Yet, as the standing-emotion problem highlights, much of our emotional landscape consists of persistent, often quiescent states: the enduring love for a partner, the simmering resentment towards a rival, the latent pride in one's heritage. These standing emotions exist even when we are not actively feeling, perceiving, or judging in emotionally charged ways. The apparent solution for the three dominant theoretical families – feeling (Jamesian), perceptual/attitudinal, and judgement theories – is to treat standing emotions as *dispositions* to undergo the relevant episodic states (feelings, evaluative perceptions, or evaluative judgements, respectively). While initially promising, a closer examination reveals that this dispositional move is fundamentally unstable, particularly for feeling theories. Assessing its viability across the specified considerations demonstrates that the standing-emotion problem decisively refutes feeling theories while posing less fatal, though still significant, challenges to its competitors.

  **1. Symmetry and Discrimination: Superficial Parity, Structural Asymmetry**

  Superficially, the dispositional reply grants each theory equal footing. Resenting a sibling can be analyzed as:
  *   *(Feeling):* A disposition to experience specific patterns of physiological arousal and feeling associated with resentment (e.g., tension, heat) when encountering the sibling or relevant thoughts.
  *   *(Perceptual):* A disposition to *see* the sibling’s actions or even their presence *as* offensive, demeaning, or violating when attended to.
  *   *(Judgement):* A disposition to assent to propositions like "What they did was deeply wrong and merits resentment" when the issue arises.

  The resulting dispositions are indeed distinct, preserving the core constitutive claims about the episodic state. Symmetry seems achieved. However, this symmetry is superficial. The problem lies in the *nature of the state* doing the disposing. For judgement and perceptual theories, the standing state is already inherently *intentional* and *evaluative*. The disposition to judge or perceive evaluatively flows naturally from a state that is itself propositionally structured (judgement) or inherently world-directed in an evaluative mode (perception). The standing resentment *is* (or is constituted by) an evaluative orientation towards the sibling. Dispositions to episodic manifestations are plausible *consequences* or *expressions* of this core evaluative state.

  Feeling theories, conversely, struggle at this foundational level. What is the standing state that disposes one to *feel* resentful? If it’s merely a disposition to have certain bodily feelings, the state itself lacks inherent intentionality or evaluative content. The disposition points to potential internal sensations, but the standing emotion is defined by its *aboutness* – it is resentment *towards the sibling for a specific slight*. Feeling theories struggle to explain how a disposition to have non-intentional bodily feelings constitutes this intentional, object-directed state. The "aboutness" seems tacked on externally, not intrinsic to the disposition itself. While all theories face the task of linking disposition to episodic manifestation, feeling theories start from a weaker position concerning the core *intentional character* of the standing state.

  **2. Correctness Conditions: Amplifying the Normative Deficit**

  Standing emotions are subject to normative assessment. Decades of resentment can be irrational (e.g., based on a misunderstanding), disproportionate (e.g., lingering over a minor childhood squabble), or morally objectionable. Judgement theories handle this seamlessly: the standing emotion *is* (or involves) an evaluative judgement, which can be straightforwardly assessed for truth, justification, or reasonableness. Perceptual theories can argue that the standing disposition ensures the world is *presented* evaluatively, and this presentation can be accurate or inaccurate, fitting or unfitting.

  Feeling theories falter dramatically. How do we assess the "correctness" of a disposition to have certain bodily feelings? Feelings themselves are not true or false, fitting or unfitting, in the direct way judgements or perceptions can be. We might say the feelings are *appropriate* or *inappropriate*, but this appropriateness derives entirely from the *situation* they are about – precisely the evaluative content that the feeling theory struggles to ground in the standing state itself. The standing resentment's irrationality isn't primarily about the *potential feelings* being the wrong *kind* of bodily state; it's about the *evaluation of the sibling and the past event* being flawed. The standing case amplifies the episodic problem: while an episodic feeling might be deemed inappropriate *for the situation*, the standing emotion’s normativity is tied to the *persistent evaluation of its object*, a feature feeling theories lack the resources to capture within their dispositional account. The disposition to feel doesn't inherently carry the evaluative content necessary for the robust normative assessment standing emotions demand.

  **3. Finks, Masks, and the Hypothetical: Blocked Manifestations and Theoretical Rupture**

  Dispositional analyses face classic counterexamples: finks (dispositions destroyed by the conditions meant to trigger them), masks (dispositions present but prevented from manifesting), and mere hypotheticals (dispositions that never manifest but arguably still exist). The standing-emotion problem generates potent versions:

  *   **The Medication Fink/Mask:** Imagine someone harbors deep resentment towards a sibling. She then takes a medication that permanently flattens all physiological arousal associated with anger or resentment. When encountering the sibling, she feels no bodily perturbation, no heat, no tension. According to the feeling theory's dispositional account, her standing resentment *just is* the disposition to have those feelings. But the medication destroys (fink) or permanently masks that very disposition. Does she still resent her sibling? Intuitively, yes. She may still *believe* the sibling wronged her, *see* their actions as offensive, and *wish* for some form of retribution or distance. The core evaluative stance persists, even though the disposition to feel specific bodily sensations is gone. Feeling theories cannot account for this persistence without smuggling in non-feeling elements.
  *   **The Stoic Mask:** Suppose someone trains themselves rigorously in Stoic practices. Through cognitive restructuring, they eliminate the disposition to *feel* bodily arousal (anger, resentment) in response to perceived slights by the sibling. However, they maintain the *judgement* that the sibling acted reprehensibly and they maintain a distinct coolness and avoidance towards them. The disposition to feel is masked. Yet, we would likely say the resentment persists in a controlled, unemotional form. Feeling theories struggle, while judgement theories can readily accommodate this as the standing emotion (the evaluative judgement) enduring despite the suppression of associated feelings. Perceptual theories might argue the disposition to *see-as-offensive* remains, even if the affective 'heat' is dampened.

  Judgement theories handle these cases best: the standing emotion is the evaluative belief itself, which can exist independently of dispositions to feel or even, arguably, to have occurrent perceptual experiences (one can believe something without currently contemplating it). Perceptual theories face a challenge: if the disposition to *see-as* is permanently blocked (e.g., by a neural inhibitor preventing evaluative perception), does the standing emotion vanish? However, they have more room to maneuver than feeling theories, perhaps by arguing the standing state is a persistent *attitudinal bias* that *would* shape perception if unimpeded, even if currently blocked. Feeling theories, grounding the emotion constitutively in the disposition for bodily feelings, are devastated by cases where that disposition is absent or blocked, yet the emotion intuitively remains. Their counterfactual ("If conditions were right, she'd feel X") is falsified, leaving the standing emotion unexplained.

  **4. The Belief Analogy: Illuminating but Misleading**

  The occurrent/standing distinction for emotions invites comparison to the occurrent/dispositional belief distinction. An occurrent belief is actively entertained (e.g., consciously thinking "Paris is the capital of France"); a standing belief is the stored information state (e.g., knowing Paris is the capital, even while thinking about lunch). Functionalism about belief analyzes standing beliefs as states defined by their causal-functional roles: their connections to perceptions, inferences, desires, and actions. This seems relevant: perhaps standing emotions are likewise *functional states* characterized by their roles (dispositions to feel, judge, perceive, *and* to motivate avoidance/approach, shape attention, influence other evaluations, etc.), rather than *mere* dispositions to have episodic feelings or perceptions.

  This analogy offers a potential path beyond pure dispositionalism for all theories, suggesting emotions are states with a *functional profile*. However, the analogy misleads in a crucial way. Beliefs are fundamentally *cognitive* and *representational*. Their core identity is tied to truth conditions and inferential integration. While emotions have cognitive components, their *phenomenal character* and *distinctive motivational force* are arguably essential and irreducibly different from cold belief. A purely functionalist account risks collapsing the unique affective, embodied, and evaluative nature of emotion into a generic cognitive functional role. The analogy highlights the need for a state-based account over a thin disposition, but it doesn't license assimilating emotion *to* belief. The functional role of resentment must include its distinctive affective potential and motivational thrust, setting it apart from a dispassionate evaluative belief. This reinforces the problems for feeling theories: their proposed functional role (disposition to feel) is too narrow, missing the intentional and cognitive dimensions crucial for standing emotions.

  **Verdict: The Refutation of Feeling Theories**

  The dispositional reply, upon rigorous examination, does not provide equal refuge for all theories of emotion facing the standing-emotion problem. While judgement and perceptual/attitudinal theories navigate the challenges with varying degrees of success, feeling theories are fundamentally undermined. The fatal blow stems from the conjunction of **normative assessability** and the threat of **finks and masks**. Standing emotions are robustly assessable for reasons like intelligibility and proportion – assessments that inherently reference the *evaluation of the object*. Feeling theories, reducing standing emotions to dispositions for non-intentional bodily feelings, lack the intrinsic evaluative content necessary to ground this normativity. This deficit becomes catastrophic when confronted by cases like the medicated or stoic resenter. Here, the disposition to feel is absent or blocked, yet the core evaluative stance – the resentment *as an assessment of the sibling and their actions* – demonstrably persists. Feeling theories cannot account for this persistence without abandoning their core constitutive claim that emotion *is* the feeling or the disposition for it. Judgement theories readily accommodate the enduring evaluative judgement; perceptual theories can appeal to a persistent attitudinal orientation. Feeling theories, by tying the emotion constitutively to bodily states vulnerable to external interference or internal suppression, render the standing emotion fragile in a way that contradicts our deepest intuitions about the tenacity and object-directed nature of long-term emotional attitudes like resentment, love, or dread. The dispositional move thus exposes, rather than solves, feeling theories' inability to capture the intentional and normative essence of emotion as it exists beyond the episodic flare.

  The standing-emotion problem refutes feeling theories.

  refutes-feeling-theories
