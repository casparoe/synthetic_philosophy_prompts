prompt: |-
  ok so I just had a three-hour arguement with my friend about whether two reasonable people can agree to disagree. she's read Aumann and says the theorem basically settles it; I said it settles nothing because every assumption is fake — common prior, common knowledge of each other's exact posterior, unbounded computation — and that real disagreement is mostly about who has the better evidence. we went nowhere because we kept proposing norms instead of saying what a norm has to do.

  so: write me the desiderata for a norm of disagreement. not a theory of rationality in general — a rule that takes as input (i) your credence in some proposition, (ii) something you learn about another agent's credence in it, and outputs your new credence. what does such a rule have to deliver to count as adequate, and what's the case or consideration behind each demand?

  what I want on the list at minimum:

  - the ideal limit: does it have to reproduce Aumann-style agreement when the assumptions all hold, or is that the wrong test to impose on a rule meant for bounded agents?
  - the coarse case: you don't learn their number, you only learn that they disagree with you at all, or that they'd take the other side of an even-odds bet.
  - the expert case: you have positive evidence they're worse informed, biased, or drunk. the rule has to let you hold your ground while blocking the move where you always conclude you're the one who's the expert.
  - order-independence: learning about A's view then B's shouldn't leave you somewhere different from B then A, unless the rule can say why the order should matter.
  - self-consistency: what does it say when the other person is running the same rule and you both know it — including what you should announce afterward, since that's what feeds their next input?
  - exploitability: two agents both following the rule shouldn't be reliably money-pumped by a third party who just watches them disagree.

  purpose, so you know what counts as cheating: I want something I could actually implement in a software agent, not a characterization of what an ideal agent does. so tractability is a real requirement, not a nice-to-have.

  then: mark each requirement negotiable or non-negotiable, flag any subset you think is jointly unsatisfiable (I strongly suspect the ideal-limit one and the tractability one fight), and tell me which single requirement knocks out the most candidate rules — conciliationism, steadfastness, averaging in log-odds, whatever else you'd put in the running. keep that last part short, I can fill in the scorecard myself.
reasoning: |-
  Okay, the user has just had a three-hour argument with a friend about whether two reasonable people can agree to disagree. They're familiar with Aumann's agreement theorem but think its assumptions are unrealistic. Now they want desiderata for a norm of disagreement that could be implemented in a software agent. 

  First, I need to unpack their frustration. They're clearly annoyed that the debate with their friend went in circles—proposing norms without clarifying what those norms should achieve. The user is a pragmatist; they want concrete, implementable criteria, not theoretical ideals. Their mention of "software agent" suggests they value formalism and tractability.

  The core tension here is between ideal theory (Aumann) and real-world constraints. The user rejects Aumann's assumptions (common priors, perfect knowledge of posteriors, unbounded computation) as "fake," which tells me they prioritize realism. Yet they still want the norm to *approach* Aumann-like agreement under ideal conditions—a subtle challenge. 

  Their list of requirements is sharp. Let me validate each:  
  - **Ideal limit**: They're asking if we should *require* Aumann-compliance or treat it as aspirational. Given their skepticism, I suspect they'll lean toward "negotiable."  
  - **Coarse input**: Absolutely critical. Real agents rarely get exact credences; often just "they disagree" or "they'd bet against me."  
  - **Expert evidence**: This is where many norms fail. How to discount biased/drunk opponents without assuming *you're* never the biased one?  
  - **Order-independence**: A sneaky one. In practice, order *might* matter (e.g., hearing an expert first), but the norm should justify when it does.  
  - **Self-consistency**: Deeply philosophical. If both agents use the same rule, do they converge? What happens in recursive mutual updating?  
  - **Exploitability**: Brilliant. If two agents stubbornly disagree, can a third party extract infinite money by pitting their bets?  

  The user’s demand for "negotiable/non-negotiable" flags suggests they expect trade-offs. I’ll bet tractability vs. ideal-limit is the biggest clash—Aumann requires solving fixed points, which is computationally hellish.  

  For knock-out requirements: **self-consistency** murders naive steadfastness (if both dig in, no convergence), while **exploitability** sinks unconditional averaging (money-pump vulnerable). But **expert evidence handling** is the real killer—it forces the norm to discriminate "good" vs. "bad" disagreement without circularity.  

  ...Time to structure this. I’ll:  
  1. Define each desideratum clearly, with the "why" (e.g., coarse input → real-world feasibility).  
  2. Tag negotiability: Non-negotiable = without this, the norm fails in practice.  
  3. Highlight conflicts: Tractability vs. ideal-limit is unavoidable.  
  4. Crown "expert evidence" as the queen-killer—it’s where most rules reveal their naivety.  
  5. Keep implementation in mind: If it can’t run on silicon, it’s disqualified.
answer: |-
  Here's a distilled set of desiderata for a disagreement norm, designed for bounded agents (e.g., software implementation), with rationale, negotiability flags, key conflicts, and the most disqualifying requirement.

  ---

  ### **Desiderata for a Disagreement Norm**
  *(Input: Your credence \( p \), learned information about another agent’s credence \( q \). Output: Updated credence \( p' \))*

  1. **Ideal-Limit Compliance**  
     *Requirement:* Under Aumann’s assumptions (common prior, common knowledge of posteriors, unbounded compute), the norm must produce agreement.  
     *Why:* Ensures alignment with rational foundations in ideal cases; failure here implies pathological behavior.  
     *Negotiable:* **Yes** (bounded agents can’t satisfy Aumann’s conditions; this is a sanity check, not a mandate).

  2. **Coarse Input Handling**  
     *Requirement:* Robustly update when input is incomplete (e.g., "\( q < 0.5 \)", "they’d bet against me", or binary "agree/disagree").  
     *Why:* Real agents rarely receive precise credences; norms must generalize.  
     *Negotiable:* **No** (non-negotiable for real-world use).

  3. **Expert Evidence Handling**  
     *Requirement:* Discount agents with known flaws (bias, ignorance, intoxication) *without* assuming you are always the expert. Must include symmetry-breaking (e.g., if you *are* drunk, you should defer).  
     *Why:* Prevents "anti-induction" (always assuming others are wrong) while allowing justified steadfastness.  
     *Negotiable:* **No** (vital for avoiding solipsism).

  4. **Order-Independence**  
     *Requirement:* Learning \( (q_A, q_B) \) in sequence \( A \rightarrow B \) vs. \( B \rightarrow A \) should yield the same \( p' \), unless order encodes information (e.g., A is an expert).  
     *Why:* Path dependence introduces arbitrariness; order should only matter if evidence-based.  
     *Negotiable:* **Yes** (if order provides evidence, asymmetry can be justified).

  5. **Self-Consistency**  
     *Requirement:* If both agents use the same norm and know it, their public announcements and updates should converge (not oscillate infinitely).  
     *Why:* Avoids infinite loops or contradictions in recursive belief-sharing.  
     *Negotiable:* **No** (non-convergence under common knowledge is fatal for cooperation).

  6. **Exploitability Resistance**  
     *Requirement:* Two agents following the norm cannot be repeatedly money-pumped by a third party capitalizing on their disagreement (e.g., via Dutch books).  
     *Why:* Pragmatic rationality requirement; exploitable agents are unsustainable.  
     *Negotiable:* **No** (money-pumping implies preference irrationality).

  7. **Tractability**  
     *Requirement:* Computable in polynomial time with minimal memory.  
     *Why:* Explicitly for software agents; norms must be implementable.  
     *Negotiable:* **No** (bounded agents can’t use untractable rules).

  ---

  ### **Conflicts & Joint Unsatisfiability**
  - **Ideal-Limit Compliance vs. Tractability**: Aumann-style agreement requires solving fixed-point equations (coordination under common knowledge), which is PSPACE-hard in general. *Unsatisfiable for bounded agents* → **Ideal-Limit is negotiable**; tractability dominates.  
  - **Self-Consistency vs. Expert Evidence**: If agents have asymmetric evidence about who is "expert," self-consistent convergence may require ignoring private evidence. *Satisfiable only if "expertise" is mutually recognized*.  

  ---

  ### **Most Disqualifying Requirement**  
  **Expert Evidence Handling** knocks out the most candidate rules:  
  - **Steadfastness** (stick to your guns): Fails if the other agent *is* legitimately more expert.  
  - **Conciliationism** (defer to others): Fails when the other agent is drunk/biased, and you know it.  
  - **Log-Odds Averaging**: Fails if agents have unequal reliability (treats all disagreement equally).  
  - **Split-the-Difference Averaging**: Fails for the same reason + vulnerable to money-pumps.  

  Only rules incorporating **reliability weights** (e.g., Bayesian peer models) survive, but these conflict with **Tractability** if weights are non-parametric.

  ---

  ### **Recommendation**  
  A viable norm might:  
  1. Use **reliability-adjusted averaging** (e.g., \( p' = w p + (1-w)q \), with \( w \) based on evidence of expertise).  
  2. **Cap computation** (e.g., 1–3 iterative updates for self-consistency, then halt).  
  3. **Default to uncertainty** under coarse inputs (e.g., widen confidence intervals on \( q \)).  

  This satisfies Coarse Input, Expert Evidence, Tractability, and Exploitability Resistance, but *approximates* (not guarantees) Ideal-Limit and Self-Consistency. The hardest trade-off is **Expert Evidence vs. Self-Consistency**—convergence isn’t guaranteed if agents disagree on who is reliable.
