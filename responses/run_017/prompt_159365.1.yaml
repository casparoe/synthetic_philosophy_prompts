prompt: |-
  hi so I'm a junior and I'm on the tech committee for student council, which in practice means I built and now maintain the dumb little poll app we use for school stuff — class president, prom theme, movie night, that kind of thing. Really low stakes but ive gotten weirdly into it and I've noticed a pattern I don't have a word for and it's driving me a little crazy.

  The basic thing: I cannot come up with a voting method where writing down what you actually want is always the best move. Every method I try, there's some situation where you do better by not saying what you want. And I don't just mean the obvious one:

  1. Pick one out of three: everyone already knows this one, if your favorite has no shot you mark your second choice instead. People actually do this without being told.
  2. Approve as many as you like: in the sims I ran, if you like A best and B almost as much, and B is A's main rival, you do better marking only A even though you'd honestly mark both. But this only pays off if you're roughly right about where everyone else is — guess wrong and you can hand it to the option you like least.
  3. Rank them and give points by position: the trick here is shoving your favorite's strongest rival into last place even though you think they're fine. And there's a weirder one I found where you help your favorite by pushing a hopeless option *up*, so that your favorite faces someone weak at the end instead of someone strong. That one only works if you know almost exactly how everybody else is going to vote, and if you're even a little off you can knock your own favorite out instead.

  So two things I've noticed that I want separated out. First: with only two options on the ballot I've never once found a trick — marking what you want always seems safe. Three or more and there's always something, even if I have to sit and hunt for it. Second, and this is the part I actually care about: the tricks are not all equally real. Some of them you could figure out in your head with no special information and they can't really hurt you. Others need you to know nearly everyone else's choices in advance and blow up in your face if you're wrong. When I explained the risky kind to people and let them try it, almost nobody bothered, and the couple of times a group did try it, the result made most of them worse off than if they'd just voted normally.

  So my questions:

  - Is there a name for the general fact that you can't design one of these where honesty always wins? I assume somebody proved it at some point.
  - More importantly: is there a name for the distinction I keep bumping into, between a trick that exists in principle and a trick an actual person could find and safely use? Like, is there an established way of measuring how much you'd need to know, or how bad the downside is, or how likely you are to make things worse for yourself — and is there such a thing as a method where *every* trick is the hard, risky kind? Or does something rule that out too?
  - If my distinction is real but unnamed, name it and define it, and give me the borderline cases: what if you care about more than just who wins (say you also care about how convincing the win looks), what if you're voting as a bloc with friends, what if everyone is a little unsure about their own ranking.

  Please don't just hand me a label, I want the carving: what the thing is, what it isn't, the nearest-miss concepts and exactly how mine differs from each, and which one fits best. And I don't want a reading list or paper titles or author names — I can't get at any of that anyway and I just want the ideas.

  Also: tell me where you're least sure. Like, if you think I've mashed two seperate things together, say which part you'd drop, and what would change your mind — what finding, or what argument, would make you say "no, there's no such thing, you're confusing it with something else."

  Oh and could you write the answer in British English? Our debate thing uses UK spelling and I might reuse bits of it.
reasoning: |-
  Okay, let me unpack this user's query. They're a junior in student council maintaining a voting app and have noticed strategic voting patterns. They want names for the phenomenon where honesty isn't always optimal and for the distinction between easy and risky strategic moves. 

  First, the core issue: the Gibbard-Satterthwaite theorem proves no voting system with ≥3 options can be fully strategy-proof. That's the foundation. But the user's real interest is in differentiating between types of strategic voting—specifically, low-risk vs. high-risk tactics. 

  The user mentions examples: in plurality voting, voting for a second choice is common and low-risk. In approval voting, approving only your top choice when your second is a rival requires accurate polling info—high-risk. In ranked systems like Borda, burying rivals or boosting weak candidates is complex and risky. 

  Key insights from the user:
  1. With two options, honesty is safe; problems start with three or more.
  2. They care about distinguishing tactics that are practically feasible vs. those requiring precise information.

  The main challenge is naming this distinction. "Strategic vulnerability" covers the general issue, but the user wants the risk spectrum. Terms like "robust strategy" vs. "fragile strategy" come to mind, but I need precise definitions. 

  Factors affecting strategy difficulty:
  - Information needed (polling accuracy)
  - Margin for error
  - Downside risk
  - Cognitive load

  For borderline cases:
  - If voters care about margin of victory, it changes strategy calculus.
  - Bloc voting simplifies coordination but adds complexity.
  - Voter uncertainty increases risk.

  Potential pitfalls: Am I conflating epistemic access with computational complexity? The user seems focused on practical feasibility for high school voters. Also, defining "safe" is tricky—it's probabilistic and context-dependent.

  British English requirements mean adjusting spellings like "honour" and "centre." Need to maintain that throughout.

  Finally, the user values clear conceptual carving over citations. They want actionable insights for their app, not academic references. The answer must balance theoretical rigor with practical applicability for their student council context.
answer: |-
  Right, let's carve this up properly. You've hit on something fundamental and deeply frustrating in social choice theory – and your instinct about separating the "easy" tricks from the "risky" ones is spot on. Here's the breakdown in UK English, as requested.

  **1. The Unavoidable Problem: Strategic Vulnerability**
  *   **What it is:** The general fact that no reasonable voting system with three or more options can guarantee that voters *always* get the best outcome by honestly revealing their true preferences. This is **Strategy-Proofness Failure** or **Strategic Vulnerability**. It's not just a quirk; it's mathematically guaranteed.
  *   **The Proof:** You assumed correctly. The **Gibbard–Satterthwaite Theorem** (G-S) is the sledgehammer here. It states, roughly: *If* you have three or more options, *if* the voting rule is deterministic (always gives one winner), *if* every possible ranking of the options is allowed, *and if* the rule is non-dictatorial (no single voter always decides), *then* the rule is *manipulable*. That means there *always* exists some configuration of preferences where at least one voter, knowing how others will vote, can get a *better* outcome by submitting a ballot that *doesn't* match their true ranking than by submitting their true ranking.
  *   **Why 2 Options is Safe:** With only two options, simply saying which one you prefer *is* strategy-proof under most common rules (like majority vote). There's no "lesser evil" or "spoiler effect" to worry about; your vote only helps the one you prefer over the other. G-S explicitly requires ≥3 options. Your observation is a direct consequence of the theorem.
  *   **What it isn't:** It doesn't mean *every* vote is strategic or that *every* voter *should* be strategic. It just means the *potential* for profitable manipulation always exists in principle. It also doesn't mean the voting rule is "bad" overall – just that it has this particular flaw.

  **2. Your Crucial Distinction: The Spectrum of Manipulation Risk**
  This is the heart of your insight. The G-S theorem tells us manipulation *can* happen, but it says nothing about how *feasible* or *risky* that manipulation is for real voters. Your distinction is between **Low-Cost Manipulation** (LCM) and **High-Cost Manipulation** (HCM).

  *   **Defining LCM (Your "Easy Trick"):**
      *   **Low Information Needs:** Requires little to no knowledge of how others will vote. The incentive is obvious from the voter's own preferences and the basic mechanics of the voting rule.
      *   **Low Cognitive Load:** Easy to figure out, often intuitively obvious ("My favourite can't win, so I'll vote for my second choice").
      *   **Low Downside Risk:** If your guess about others (if any is needed) is slightly wrong, you're unlikely to make things *worse* for yourself than voting honestly. The worst case is usually no better than honest voting, and often still better.
      *   **Examples:** The "lesser evil" vote in Plurality (your point 1). Sometimes burying a strong rival *if* it's obvious they are the main threat (a simplified case from your point 3).
      *   **Why it matters:** LCM is common, observable, and significantly distorts outcomes. Voters readily engage in it without coordination or polls.

  *   **Defining HCM (Your "Risky Trick"):**
      *   **High Information Needs:** Requires very precise knowledge or predictions about how *many* others will vote. Often needs near-perfect polling data.
      *   **High Cognitive Load:** Complex to calculate. Requires understanding non-obvious interactions within the voting rule (like how pushing a weak candidate up affects pairwise matchups in ranked systems).
      *   **High Downside Risk:** If your prediction is even slightly wrong, the strategy can easily backfire spectacularly, resulting in a *worse* outcome than honest voting (e.g., knocking out your own favourite).
      *   **Examples:** Sophisticated burying/boosting in Ranked Choice or Borda (your point 3). Withholding approval strategically in Approval Voting when preferences are close (your point 2).
      *   **Why it matters:** While theoretically possible, HCM is rare in practice. Voters struggle with the cognitive load and information requirements. The high risk deters most attempts. Failed attempts often lead to chaotic or undesirable outcomes, acting as a natural deterrent.

  *   **The Spectrum:** Manipulation risk isn't binary; it's a continuum. LCM and HCM are the clear poles. The "cost" incorporates information needs, cognitive difficulty, and potential negative consequences.

  *   **Is there a rule where *every* trick is HCM?** This is the million-dollar question. There's no theorem *ruling it out*, but achieving it universally seems incredibly difficult. The goal is to find rules that **minimise Low-Cost Manipulation opportunities**. Some rules (like Approval Voting under certain preference distributions) *can* make LCM rarer than in Plurality, but they rarely eliminate it entirely and often introduce *different* HCM possibilities. Rules like Range Voting (score 0-10) can sometimes reduce LCM compared to Plurality, but introduce new strategic complexities. **The practical aim is to make profitable manipulation require HCM-level effort and risk as often as possible.**

  *   **Measuring the Cost:** Concepts exist, though they aren't always neatly packaged under one label:
      *   **Computational Complexity:** How hard is it *for a computer* (or a voter) to *find* a profitable manipulation? (HCM is often NP-hard or worse).
      *   **Information Requirements:** How much polling data is needed to confidently identify a profitable manipulation? (Measured by sample size needed, precision required).
      *   **Risk of Failure:** What's the probability that the manipulation backfires given reasonable uncertainty about others' votes? (Often modelled via simulations like the ones you ran).
      *   **Prevalence:** How often do real-world scenarios exist where LCM is possible? (Plurality has many, Condorcet methods arguably fewer).
      *   **Your term "Strategic Friction"** captures the essence well – the barriers (information, calculation, risk) that make manipulation difficult/practically infeasible. Systems with high strategic friction push manipulation towards the HCM end.

  **3. Borderline Cases & Complications: Testing the Carving**

  *   **Caring About Margin of Victory/Convincing Win (e.g., Mandate):**
      *   **Impact on LCM/HCM:** This *radically* changes the calculus. Now, voting honestly for your true favourite even if they lose might be an LCM to signal strong support ("I want them to know we exist!"). Conversely, a risky HCM to barely squeak your second choice in might be undesirable if you want a strong mandate. "Honesty" itself becomes a strategic tool. The LCM/HCM distinction still applies, but what constitutes a "profitable" manipulation now includes expressive goals beyond just winning. A low-risk vote for a hopeless candidate becomes a form of LCM for signalling.
  *   **Voting as a Bloc:**
      *   **Impact on LCM/HCM:** Coordination *lowers* the cost of manipulation significantly. What was HCM for an individual (requiring precise knowledge of *everyone*) becomes LCM for a bloc with good internal communication and polling. Knowing your bloc's size and preferences makes complex strategies like coordinated burying/boosting much more feasible and less risky. Bloc voting effectively shifts many HCM strategies towards the LCM end *for the bloc*. The distinction now applies more to the *bloc's* actions than the individual's.
  *   **Voter Uncertainty (Fuzzy Preferences):**
      *   **Impact on LCM/HCM:** Uncertainty vastly increases the risk of *any* manipulation, but especially HCM. If you're unsure of your *own* intensity ("Do I *really* prefer A to B that much more?"), even seemingly LCM actions (like withholding approval from B in Approval) become much riskier. You might hurt an option you later realise you valued. This significantly dampens the incentive for *all* manipulation but disproportionately deters HCM due to its higher inherent risk and complexity. LCM might still occur based on clear ordinal rankings ("I definitely like A best, B second"), but strategic actions relying on fine-grained preference intensity become fraught.

  **4. Nearest Misses & How This Differs**

  *   **Strategy-Proofness Failure (G-S):** This is the broad category you're starting from. Your distinction (LCM vs HCM) is a crucial *refinement* focusing on the *practical feasibility and risk* of that manipulation.
  *   **Computational Hardness of Manipulation:** This is a *component* of HCM (the cognitive load/difficulty part), but doesn't capture the information needs or the risk of catastrophic failure. A manipulation could be computationally easy (LCM) but still require risky information (pushing it towards HCM) or vice-versa (computationally hard HCM).
  *   **Bayesian Manipulation:** This models manipulation under uncertainty. Your HCM concept heavily overlaps with scenarios where Bayesian updating shows manipulation is unlikely to be profitable or is highly risky. Your distinction incorporates this uncertainty but also includes the pure difficulty/cost aspects.
  *   **Safety of Manipulation:** Sometimes used informally. Your LCM/HCM framework explicitly defines safety in terms of information needs, cognitive load, and downside risk, making it more operationalisable.
  *   **Fragility of Manipulation:** Similar to downside risk. Your framework integrates fragility as a key *dimension* of HCM alongside information and cognitive cost.

  **5. Where I'm Least Sure & What Might Change My Mind**

  *   **Mashing Together?** The main tension is between **Epistemic Access** (information needed) and **Strategic Complexity** (cognitive load + risk calculation). Are these truly inseparable facets of "cost," or are they distinct? I've bundled them under LCM/HCM because in practice for a voter, not knowing *and* not being able to calculate easily compound each other. However, one could argue:
      *   A rule might require *perfect* information (high epistemic cost) but the manipulation, once known, is trivial to execute (low strategic complexity).
      *   Or, manipulation might be computationally nightmarish (high strategic complexity) but obvious to attempt with little information (low epistemic cost).
  *   **What Would Make Me Separate Them?** Finding a clear, real-world example of a voting rule where the *primary* barrier to common manipulation is *either* pure lack of information *or* pure computational intractability, *without* significant influence from the other factor *and* without high downside risk. If such a rule existed and was meaningfully different in practice, splitting "Epistemic Cost" and "Strategic Complexity" might be warranted. Currently, they feel intertwined in the voter's experience.
  *   **Is "Safe" Definable?** Defining the exact threshold between LCM and HCM is inherently fuzzy. How much risk is "high"? How much information is "too much"? This is a spectrum, and the boundary depends on context (voter sophistication, availability of polls). I'm confident the *distinction* is real and vital, but pinning down a universal, sharp dividing line might be impossible.
  *   **Does HCM Truly Deter?** You observed it does in your small experiments. But what if voters have AI tools or perfect polls? Does HCM then become LCM? I think the key is that *in the absence of near-perfect information and high cognitive resources*, HCM remains rare. The "cost" is relative to typical human voting environments.

  **The Carving Summary**

  *   **The Core Problem:** **Strategic Vulnerability** (Guaranteed by Gibbard-Satterthwaite for ≥3 options).
  *   **Your Key Insight:** The **Manipulation Risk Spectrum**, ranging from **Low-Cost Manipulation (LCM)** - easy, obvious, low-risk - to **High-Cost Manipulation (HCM)** - complex, information-hungry, high-risk.
  *   **What Defines Cost:** **Information Needs** + **Cognitive Load** + **Downside Risk**.
  *   **The Practical Goal:** Voting rules that **minimise opportunities for LCM**, pushing strategic incentives towards the HCM end of the spectrum where they are less likely to be acted upon.
  *   **The Distinction's Value:** It explains *why* some manipulations are common (Plurality's lesser-evil vote = LCM) while others are rare and chaotic (complex burying schemes in Ranked Choice = HCM), even though both are predicted by G-S.

  **For your app?** Recognise that eliminating strategy entirely is impossible. Focus on methods that reduce *Low-Cost* manipulation. Approval Voting often performs well here – while it has strategic incentives, they often lean towards HCM, especially compared to Plurality's glaring LCM. Your simulations and user behaviour (people not bothering with the risky tricks) are strong evidence for the practical importance of the LCM/HCM distinction. Use British terms like "behaviour," "centre," "honour," and "analyse" consistently if reusing this for debate. Good luck with the polls!
