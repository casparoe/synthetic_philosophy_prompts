  On concessions: yes, reliability presupposes thermodynamic asymmetry. That’s circular if used to explain why we observe such asymmetry. Also, future eras with no reliable observers might make our current existence puzzling again. 

  Exposure is the deepest issue. If all counterevidence is deemed unreliable, the view is unfalsifiable. That might be fatal for a constraint meant to guide reasoning. 

