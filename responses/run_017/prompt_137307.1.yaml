  Looking at their cases: gold and water are clear "yes" joints for them; jade and fish are "no" (though fish troubles them); succulents are "yes-ish"; hypertension and depression are "no"; money is "yes but not natural"; planet is unsettled. Their framework emerged from a work incident where a "slow endpoint" classification failed after migration.

