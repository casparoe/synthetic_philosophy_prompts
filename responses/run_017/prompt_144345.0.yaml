  So the true ratio of Ben's utility difference to Amara's in absolute terms is 2 (if we take the first scaling as the reference). But the mirror procedure with geometric mean gives about 2.45, which is not 2.

  Alternatively, if we had an impartial observer, and we use the same observer for both, then we get consistent weights. But then the weights are relative to that observer.

  So I conclude:

  - The mirror procedure as described does not, without additional assumptions, deliver interpersonal comparability.
  - The critical assumption is that both individuals use the same scaling for the other's utility function. But without a prior agreement on the scaling, this is arbitrary.
  - The geometric mean is an arbitrary way to combine the two ratios. It doesn't solve the problem.

  Therefore, to answer:

  1. It is well-posed in terms of having preferences, but the interpretation of the utility numbers for being the other is not pinned down without further assumptions.

  2. It delivers, at best, the ratio of the utility differences (units) only if we assume that the two individuals use the same scaling for the other's utility. Without that, we get arbitrary numbers. It does not deliver the origins.

  3. For a fixed population, if we had the relative units, we could sum the utilities (ignoring the origins). But we don't get the origins, so for variable population we can't.

  Confidence:

  - For 1: I'm confident that the extended preferences are well-posed as vNM preferences, but the interpretation of the utility for being the other is not uniquely determined without more. (What would change my mind: if there were a natural way to set the scaling, such as requiring that the utility for being oneself in some reference outcome is the same as the utility for being the other in the same reference outcome? But that would be arbitrary.)

