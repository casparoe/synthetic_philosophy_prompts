  ### Step-by-Step Analysis of the "Mirror Procedure" in Welfare Economics

  I'll address your questions using a concrete two-person, three-outcome example to keep things tangible. Let's consider **Amara (A)** and **Ben (B)** with outcomes **x**, **y**, and **z**. Assume each has vNM preferences over these outcomes, but their utilities are only unique up to positive affine transformations (i.e., scaling and shifting). The "mirror procedure" extends the outcome space to include identity: we now have states like "being Amara in x" (denoted \(A_x\)), "being Ben in x" (\(B_x\)), etc. Each person ranks lotteries over the entire set \(\{A_x, A_y, A_z, B_x, B_y, B_z\}\), and we derive ratios from their extended utility functions.

  #### Concrete Example Setup:
  - **Amara's base utilities (arbitrary scaling):**  
    \(u_A(x) = 4\), \(u_A(y) = 1\), \(u_A(z) = 0\).  
    (Note: Differences matter, not levels. The difference \(u_A(x) - u_A(y) = 3\) is invariant to affine shifts.)
    
  - **Ben's base utilities (different scaling):**  
    \(u_B(x) = 10\), \(u_B(y) = 0\), \(u_B(z) = -10\).  
    (Difference \(u_B(x) - u_B(y) = 10\) is invariant, but scaling differs from Amara's.)

  Now, we define **extended utility functions** for lotteries over \(\{A_x, A_y, A_z, B_x, B_y, B_z\}\). Critically, we assume each person, when imagining "being the other," adopts that person's preferences (the "welfare-relevant" interpretation). For instance:
  - Amara's extended utility \(U_A\) assigns values to \(A_x\) (herself in x) and \(B_x\) (being Ben in x).  
  - Ben's extended utility \(U_B\) assigns values to \(B_x\) (himself in x) and \(A_x\) (being Amara in x).

  **Key ratios from the procedure:**
  - For Amara: Ratio \(R_A = \frac{U_A(B_x) - U_A(B_y)}{U_A(A_x) - U_A(A_y)}\).  
    This compares how much Amara "cares" about Ben's utility differences relative to her own.
  - For Ben: Ratio \(R_B = \frac{U_B(A_x) - U_B(A_y)}{U_B(B_x) - U_B(B_y)}\).  
    This compares how much Ben "cares" about Amara's utility differences relative to his own.

  The goal is to combine \(R_A\) and \(R_B\) (e.g., via geometric mean) to get an interpersonal unit ratio.

  ---

  ### Your Questions Answered

  #### 1. **Is the procedure well-posed? Does it smuggle in assumptions?**
  **Answer:** No, it's not fully well-posed—it smuggles in a **hidden assumption about scaling** when imagining others.  
  - **Why?**  
    The move from base vNM utilities to extended utilities requires specifying how to "scale" the other person's utility within one's own extended function. In the extended space:
    - \(U_A(A_x) = a_A \cdot u_A(x) + b_A\) (Amara's utility for her own outcome).  
    - \(U_A(B_x) = a_A \cdot k_A \cdot u_B(x) + c_A\) (Amara's utility for being Ben in x).  
      Here, \(k_A\) is an **arbitrary scale factor** Amara uses when adopting Ben's preferences. Ben has a similar factor \(k_B\).
    
  - **Concrete failure in the example:**  
    Suppose Amara sets \(k_A = 1\):  
    - \(U_A(A_x) = 4\), \(U_A(A_y) = 1\) (so \(U_A(A_x) - U_A(A_y) = 3\)).  
    - \(U_A(B_x) = 10\), \(U_A(B_y) = 0\) (so \(U_A(B_x) - U_A(B_y) = 10\)).  
    → \(R_A = \frac{10}{3} \approx 3.33\).  
    
    But Ben sets \(k_B = 0.5\):  
    - \(U_B(B_x) = 10\), \(U_B(B_y) = 0\) (so \(U_B(B_x) - U_B(B_y) = 10\)).  
    - \(U_B(A_x) = 0.5 \cdot 4 = 2\), \(U_B(A_y) = 0.5 \cdot 1 = 0.5\) (so \(U_B(A_x) - U_B(A_y) = 1.5\)).  
    → \(R_B = \frac{1.5}{10} = 0.15\).  
    
    **Problem:** \(R_A\) and \(R_B\) depend entirely on arbitrary \(k_A\) and \(k_B\). There's no reason why Amara and Ben would choose the same scaling (\(k_A = k_B\)) when imagining each other. The procedure assumes \(k_A = k_B = 1\) implicitly, but this isn't justified by preferences alone.  
    - **What breaks?** The ratios \(R_A\) and \(R_B\) are **meaningless** for interpersonal comparability without identical scaling. Asking people to "adopt the other's tastes" doesn't fix how they scale those tastes relative to their own.

  **Confidence:** High (9/10).  
  **What would change my mind?** If you could show a unique scaling emerges from vNM axioms (e.g., requiring \(U_A(B_x) = U_B(B_x)\) for all outcomes), but this would assume pre-existing comparability.

  ---

  #### 2. **What does the procedure deliver? What if we combine ratios?**
  **Answer:** It **does not deliver units or origins** robustly. Combining ratios (e.g., geometric mean) is arbitrary and relies on unsupported assumptions.  
  - **Units (scaling):**  
    The ratios \(R_A\) and \(R_B\) are sensitive to \(k_A\) and \(k_B\). If \(k_A = k_B\), then \(\sqrt{R_A \cdot 1/R_B}\) gives the true unit ratio. But without \(k_A = k_B\), it fails.  
    - **Example:** From above, \(R_A \approx 3.33\) and \(R_B = 0.15\).  
      Geometric mean of \(R_A\) and \(1/R_B\): \(\sqrt{3.33 \times 1/0.15} = \sqrt{22.2} \approx 4.71\).  
      But the "true" unit ratio (using base utilities) is \(\frac{u_B(x) - u_B(y)}{u_A(x) - u_A(y)} = \frac{10}{3} \approx 3.33\). The geometric mean gives 4.71—**not close**.  
    - **Why?** \(k_A = 1\) but \(k_B = 0.5\), so the scales don't match. The procedure **doesn't ensure consistency**.

  - **Origins (shifting):**  
    Origins (the \(b\) in \(au + b\)) never enter the ratios \(R_A\) or \(R_B\), as they cancel in differences. So origins remain **totally undetermined**.

  - **What if people retain their own tastes?**  
    Suppose Amara imagines being Ben but with *her own* tastes:  
    - \(U_A(B_x) = u_A(x) = 4\) (not Ben's utility).  
    Then \(R_A = \frac{U_A(B_x) - U_A(B_y)}{U_A(A_x) - U_A(A_y)} = \frac{4 - 1}{4 - 1} = 1\).  
    This is **not about Ben's welfare**—it's about Amara narcissistically projecting her preferences. Useless for interpersonal comparison.

  **Confidence:** High for units (8/10), very high for origins (10/10).  
  **What would change my mind?** If iterations of the procedure (e.g., Amara and Ben repeatedly rescale based on each other's inputs) converged to a unique \(k_A = k_B\). But without symmetry, this is unlikely.

  ---

  #### 3. **How much does this matter for using comparisons?**
  **Answer:**  
  - **For summing utilities (fixed population):**  
    - **Units matter critically:** Summing requires knowing relative scales. If units are wrong, sums are nonsense.  
      *Example:* If you wrongly think Ben's utils are 4.71× Amara's (from geometric mean above), you'll over-weight Ben's gains.  
    - **Origins don't matter:** Adding constants to utilities (e.g., \(u_A \rightarrow u_A + 5\)) doesn't change *rankings* when summing, as the shift is identical across outcomes.  
      - In our example: Sum for outcome x is \(w_A u_A(x) + w_B u_B(x)\). Shifting \(u_A \rightarrow u_A + b_A\) adds \(w_A b_A\) (constant), so it doesn't affect choices between outcomes for fixed population.  

  - **For variable populations:**  
    - **Units still matter** (same as above).  
    - **Origins now matter:** Adding a person adds their utility level (not just differences). If \(u_{\text{new}} = -100\), adding them might be bad, but if origins are arbitrary, you can't tell.  
      *Example:* If a new person Charlie has \(u_C(x) = 0\), is this "neutral"? Only if 0 is a meaningful welfare zero—but vNM utilities have no natural zero. Origins must be comparable to avoid nonsense.

  **Confidence:** High for fixed population (9/10), very high for variable population (10/10).  
  **What would change my mind?** If you normalized all utilities to a common range (e.g., 0 to 1) or defined a "zero" like the utility of nonexistence. But this isn't derived from preferences.

  ---

  ### Summary and Key Insights
  - **The mirror procedure fails** because it assumes Amara and Ben scale each other's utilities identically (\(k_A = k_B\)) when imagining the other person. Without this, ratios \(R_A\) and \(R_B\) are arbitrary. Combining them (e.g., geometric mean) doesn't fix this.
  - **It delivers nothing usable:** Units require \(k_A = k_B\) (which is ad hoc), and origins are ignored entirely.
  - **For welfare aggregation:**  
    - Fixed population: Units are needed; origins are irrelevant for ranking.  
    - Variable population: Both units and origins are essential.  
  - **Core problem:** Extended sympathy doesn't create comparability from nothing—it just pushes the problem into scaling choices that lack a welfare foundation.

  **Final confidence:** High overall (8/10). If the procedure worked with minimal assumptions, it would solve a century-old problem in social choice. It doesn’t.
