     However, if the population size can vary, then the additive terms matter because adding a person adds a constant b_i, which might be positive or negative. So then we need to know the origins to see whether adding a person with a given utility level is good or bad.

     But note: the vNM utility function does not have a natural zero. So without a fixed zero, we cannot say whether a person's utility is positive or negative. Hence the problem.

     So for the mirror procedure: even if we could get the relative units (the a_i), we still wouldn't have the origins. Therefore, we could use the sum for fixed population, but not for variable population.

  But let's be concrete with a two-person example.

  Example:

  Suppose we have two outcomes: x and y.

