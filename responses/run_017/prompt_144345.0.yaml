  Amara's scaling: she thinks Ben's utility difference is 4 times her own? But actually, in the first scaling, Ben's utility difference was 2 and hers was 1. Now she thinks it's 4 (for the same outcomes). So she has scaled Ben's utility by 2 relative to the first scaling.

