prompt: |-
  I own privacy review at a company of about two hundred people that ships a consumer app in which users keep a structured daily journal — mood, sleep, symptoms, free text — and get predictions and nudges back. Every feature that touches user data comes through me: roughly six reviews a month, about forty-five minutes each, and the output has to be a single page — go, no, or go with conditions — that a product lead with no philosophy and no legal training can read, argue with, and sign. When I am away a junior PM runs them, so the procedure cannot depend on my having internalized the theory. Outside counsel handles compliance and is, for my purposes, useless: the answer to everything is get consent, and we have already watched our consent flow get optimized by onboarding copy until the number stopped meaning anything.

  Our reviews have settled into three failure modes I want a procedure to break. Anything described as on-device or anonymized is waved through; I think this is a cached thought rather than an argument. Anything else is argued about in the vocabulary of creepiness, which means reviewers pattern-matching to an affect and then rationalizing, and which reliably misranks the cases. And because we cannot say what the thing we are protecting actually is, the conditions we attach are arbitrary and unenforceable six months later.

  So: give me a decision procedure, grounded in what is actually known about the nature and value of privacy, that my team can run on a proposal. I want the ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the remaining question is one of values, and what to do at each step when the number you want cannot be had — we cannot estimate re-identification probabilities, we cannot elicit users' true preferences, and I would rather have a rule that says guess conservatively here and flags itself than one that pretends to precision. Please also state plainly which account of privacy's value the procedure is buying — a control account, an access account, a contextual-integrity account, something consequentialist about downstream harm — and what that choice costs us, because I expect the thresholds to move with it and I want to know which of our past decisions we would have to revisit under a different one.

  Several distinctions I insist survive simplification, because they are where our arguments actually stall.

  First, privacy is not one thing. Being unobserved, being unknown, being unnoticed or unaddressed, and retaining control over downstream use come apart constantly in our feature queue, and a proposal is often fine on two and bad on two. The procedure should score them separately rather than producing one number.

  Second, some of the data is about people who never signed up: a partner named in a journal entry, contacts uploaded for matching, a location trace that reveals a household. Our current framing has no way to represent them at all.

  Third, I have become convinced that the interesting cases are ones where no proposition about anyone is transmitted but the system nonetheless gets better at predicting them — the update lives in the weights, not in a sentence. I have been calling this prediction leakage, and I want the procedure to have a slot for it, including guidance for when there is no fact of the matter about what was learned. Relatedly, tell me whether it is a distinct harm to be confidently misfiled — a model that is wrong about you at high confidence and acts on it — or whether the procedure should treat accuracy and confidence as separate axes.

  Fourth, deferred identifiability: data released harmlessly today becomes identifying when some future corpus arrives, and I have no idea how to discount that or whether discounting it is even coherent.

  Fifth, magnitude should be audience-relative and measured in decision-change — how much does this alter what some actor will decide about this person — rather than in the sensitivity of the content. I would like that made operational, and I would like you to say what it does to cases where the harm is to a group and does not decompose into harms to identifiable individuals.

  Sixth, the reverse direction: a procedure about user privacy can be quietly used to deny users access to what the system believes about them. I want a transparency-to-the-subject requirement baked in, and I want the tension with model secrecy named rather than solved.

  Seventh, consent. I want a hypothetical-consent step — would this user refuse if they understood the inference and its downstream uses — even though I can see it is paternalistic, and I want it flagged as a values judgment rather than dressed up as a finding.

  Finally, someone always argues that the data in question is exactly what we would need to audit ourselves for bias or abuse, and that privacy talk here is a shield for the powerful. If the procedure has a carve-out for that, specify it narrowly; if it does not, say so and say what we are refusing to do.

  Then run it on three proposals from our actual backlog.

  One: a risk flag computed entirely on-device from typing dynamics and journal sentiment, where only a single bit — high-risk week, yes or no — is written to our servers and used to surface a support resource. No raw text leaves the phone. My team wants to wave this through.

  Two: support-network suggestions derived from contact-graph and location overlap, shown only to the user, naming people who may be in a similar situation. Nobody outside sees it; the issue is inference about non-users.

  Three: a quiet check-in feature for users at risk of harm, which shares a risk signal with a trusted contact the user nominates. This is the one I care about and the one I expect you to kill, and I want to know whether that no is a real no or an artifact of where the procedure is conservative — and if it is real, what the cheapest change to the feature is that flips it.

  Also tell me what the procedure cannot do: which of our recurring arguments it will not settle, where a human must simply decide, which distinctions you dropped to make it runnable and what we lose by dropping them, and how it will misfire if someone starts optimizing against it instead of using it. And tell me what to do when users enthusiastically want a feature the procedure scores as a large loss — whether the procedure defers to that or vetoes it, and on what authority. I do not want citations or further reading; I cannot chase references from here, and a bibliography would be useless to me even if I could.
reasoning: |-
  We are going to design a decision procedure for privacy reviews that is grounded in the contextual integrity framework (Helen Nissenbaum) because it:
    - Focuses on the flow of information in context, which matches our need to consider different types of data, actors, and purposes.
    - Allows for multiple dimensions (as you insist) by evaluating transmission principles (sender, subject, recipient, information type, transmission principle) and comparing to entrenched norms.
    - Is not solely about consent but about appropriateness in context, which avoids the "consent is the answer" problem.
    - Can handle cases of non-users (by considering them as subjects in the context) and prediction leakage (as a type of information flow).

  However, we will augment it with:
    - A harm-centric evaluation when the flow violates norms, to assess the magnitude of potential harm (consequentialist element) because contextual integrity alone doesn't specify what to do when norms are absent or contested.
    - A requirement for transparency to the subject (to address your sixth point) and a hypothetical consent step (seventh point) as a separate values gate.

  The procedure will be structured as a series of questions that must be answered in order. At each step, if the answer triggers a stop condition, we output the decision. We will use a scoring system for the dimensions you want (separately: unobserved, unknown, unnoticed/unaddressed, control) but in the language of contextual integrity we are evaluating the flow against the context's norms. We break down the evaluation into:

  1. **Identify the context**: What is the context of the information flow? (e.g., health journaling, social support, emergency intervention)
  2. **Identify the actors**: 
     - Subject(s): Whose information is it? (user, non-user)
     - Sender: Who is sending the information? (the app, the user, etc.)
     - Recipient: Who is receiving? (the company, a trusted contact, another user, etc.)
  3. **Information type**: What kind of information is being transmitted? (raw data, derived data, a prediction, an action trigger)
  4. **Transmission principle**: How is the information being transmitted? (with consent, automatically, under what conditions?)

  We then compare to the entrenched norms in that context. If the flow violates the norms, we proceed to a harm assessment. We also have a special step for non-users and prediction leakage.

  The decision steps:

  **Step 1: Context Identification**
    - What is the primary context of the feature? (e.g., health self-management, social networking, crisis intervention)
    - Are there multiple contexts? (e.g., a health app that becomes a social network)
    - If the feature introduces a new context, we must establish norms. This is a judgment call and may require escalation.

  **Step 2: Actor and Information Flow Mapping**
    - List all subjects (users and non-users) and the information about them that is being used or disclosed.
    - For each subject and for each recipient, describe the information flow.

  **Step 3: Transparency Check**
    - Is the subject (user) informed about this flow in a clear and timely manner? (For non-users, we skip this because we cannot inform them, but note the failure and proceed to harm assessment.)
    - If no, then the flow is conditionally denied until transparency is fixed. (This is a hard stop for users; for non-users, we proceed but note it as a violation and move to harm.)

  **Step 4: Norms Assessment (Contextual Integrity)**
    - For each flow, ask: Is this type of information flowing from this sender to this recipient in this context consistent with entrenched norms?
    - We break down the norms along your four dimensions (as they map to contextual integrity):
        a. Unobserved: Is the subject being observed in a way that is not normal in the context? (e.g., continuous location tracking in a mood journal app might not be normal)
        b. Unknown: Is information about the subject being made known to the recipient that is not normally known in this context? (e.g., a non-user's presence in the user's life being revealed to the app)
        c. Unnoticed/unaddressed: Is the subject being addressed or acted upon in a way that is not normal? (e.g., a non-user being suggested as a support contact without their knowledge)
        d. Control: Does the subject retain control over downstream uses as per the context? (e.g., in health contexts, control over sharing with third parties is expected)
    - If the flow is consistent with norms on all dimensions, then it's a "go" (provided no other issues). If not, we proceed to Step 5.

  **Step 5: Harm Assessment**
    - For each violation found in Step 4, assess the potential harm. We use your audience-relative decision-change metric:
        - Identify the audience (recipient) and the decisions they might make about the subject because of this information.
        - Estimate the magnitude of the decision change: 
            - Low: The decision change is minor (e.g., showing a different resource in the app).
            - Medium: The decision change might affect the subject's options (e.g., suggesting a support contact).
            - High: The decision change could lead to significant harm (e.g., false risk flag leading to unnecessary intervention) or benefit (e.g., necessary help in crisis).
        - Also consider: 
            - The confidence of the inference (high confidence in a wrong inference is worse).
            - Group harm: If the harm is to a group, consider the magnitude of the decision change that affects the group (e.g., stereotyping) and whether it leads to systemic effects.
            - Deferred identifiability: If the data being stored or shared could become identifying in the future, we treat it as a potential future harm. We discount it by the likelihood of the future corpus and the time horizon, but if the feature creates a permanent record, we assume it will eventually be identifiable. We require that the data be protected with the highest level of controls (anonymization, strict access) and that the harm assessment be done as if it were identifiable today. (This is conservative.)
    - If the harm is assessed as high and the harm is to a non-user, we do not have consent and cannot inform them, so we must deny unless the benefit to the user is overwhelming and no alternative exists. We will have a separate step for values.

  **Step 6: Prediction Leakage Check**
    - Does the feature involve the model being updated in a way that it learns something about a subject (user or non-user) without explicitly transmitting a proposition? 
        - Example: The model weights change to reflect a pattern about a non-user because they are often mentioned.
    - We treat this as an information flow from the subject to the model owner (the company) and then we must consider if this model update could lead to a flow to a recipient (even if internal). We then run Steps 2-5 for that flow.
    - If the model update is about a non-user, we note it as a violation of norms (because non-users are not part of the context) and then assess harm.

  **Step 7: Hypothetical Consent (Values Gate)**
    - If the flow passed the harm assessment (i.e., the harm is low or medium and mitigated) but still violates a norm, we ask: Would a reasonable user refuse if they understood the inference and its downstream uses?
    - This is a judgment call and must be made by a human. We require that the product lead and the reviewer agree on the answer. If the answer is "yes, they would refuse", then we deny the feature. If "no", then we conditionally approve with the condition that the transparency (Step 3) must be particularly clear on this point.

  **Step 8: Audit Carve-out**
    - If the data flow is being proposed for the purpose of auditing for bias or abuse, then we allow it only if:
        a. The data is minimized to what is necessary for the audit.
        b. The data is accessed only by the audit team under strict controls.
        c. The results of the audit are published or shared in a way that does not re-identify individuals.
        d. The audit is necessary to address a known or suspected problem that could cause harm.
    - This is a conditional go.

  **Decision Output**:
    - Go: if all steps are passed without conditions.
    - Go with conditions: if there are conditions (e.g., improve transparency, add access controls, limit data retention, etc.). Conditions must be specific and enforceable.
    - No: if any step results in a denial.

  **Where the procedure stops with a no**:
    - Step 3 (transparency) fails for a user and cannot be fixed.
    - Step 4 (norms) is violated and Step 5 (harm) shows high harm that cannot be mitigated, especially for non-users.
    - Step 7 (hypothetical consent) is "yes, they would refuse".

  **Where it hands off to a human**:
    - Step 7 (hypothetical consent) is a values judgment.
    - When establishing norms in a new context (Step 1) if there is disagreement.

  **Handling uncertainty**:
    - When we cannot estimate re-identification probabilities, we assume identifiability if there is any potential for future identifiability (conservative).
    - When we cannot elicit true preferences, we use hypothetical consent as a proxy and err on the side of refusal if in doubt.
    - When we cannot measure decision change, we use the sensitivity of the context (health is high) and the nature of the recipient (a trusted contact is less risky than an advertiser) as proxies.

  **What the procedure buys**:
    - We are using a contextual integrity account primarily, which costs us the ability to have a single universal privacy metric. It requires us to define contexts and norms, which can be subjective. But it allows the multidimensional evaluation you want.
    - We add a consequentialist harm assessment to handle cases where norms are changing or absent. This costs us by introducing a trade-off between norms and utility, which can be seen as utilitarian and might override important normative concerns. But without it, we would be stuck when norms are not settled.

  **What it cannot do**:
    - It will not settle arguments about what the norms are in a context if the team disagrees. That requires human judgment and possibly escalation.
    - It does not magically know the future of deferred identifiability; we must rely on conservative assumptions.
    - It cannot precisely measure decision change; we use ordinal categories (low, medium, high) and rely on reasoned argument.
    - It does not resolve the tension between transparency and model secrecy. We require transparency to the subject about what is being done and why, but if the model details are secret, we describe the purpose and the kind of inference in plain language. If the model secrecy is for competitive reasons, we note that and conditionally approve but require that the user is told the model is making inferences and what they are used for.

  **Optimization against the procedure**:
    - If someone tries to game it (e.g., by defining the context too narrowly to avoid norm violations), we rely on Step 1 being done honestly and with reference to the user's perspective. We require that the context be defined by the user's reasonable expectations.
    - If they try to minimize the harm assessment, we require that the harm assessment consider worst-case scenarios (within reason) and be approved by the reviewer and product lead.

  **When users want a feature that scores as a large loss**:
    - The procedure does not veto it solely based on harm if the hypothetical consent step (Step 7) passes. But if the harm is high and the hypothetical consent step fails (meaning we think users would refuse if they understood), then we deny it. The authority is paternalistic but justified by the fact that users might not understand the implications. We also consider that the user might be in a vulnerable state. We flag this as a values-based denial.

  **Dropped distinctions**:
    - We dropped some of the nuances of prediction leakage by treating it as an information flow. We lose the ability to handle cases where the update is not about a specific individual but a group. We assume that group-level leakage is less harmful unless it leads to group harm (which we cover in the harm assessment).
    - We did not make a separate category for "confidently misfiled" but we included confidence in the harm assessment (high confidence wrong inferences are more harmful). We treat it as an amplifier of harm.

  Now, let's run the three proposals.

  **Proposal 1: On-device risk flag**
    - Step 1: Context is health self-management and crisis prevention.
    - Step 2: 
        - Subject: the user.
        - Information: a single bit (high-risk week) sent to the server.
        - Recipient: the company (to surface a resource).
    - Step 3: The user should be informed that the app is computing a risk flag and that the result is sent to the server. We assume this is done (condition: transparency must be clear).
    - Step 4: 
        - Norms: In a health journaling app, it is normal to use the data to help the user. The bit is minimal. 
        - Unobserved: The computation is on-device, so the user is observed by their own device (normal). 
        - Unknown: The company only knows the bit, not the raw data (normal for aggregated risk scores). 
        - Unnoticed: The user is being addressed with a resource, which is normal. 
        - Control: The user should be able to turn off the feature (condition: provide an opt-out).
    - Step 5: Harm assessment not needed because no norm violation.
    - Step 6: No prediction leakage because the model update (if any) is on-device and the only thing sent is the bit.
    - Step 7: Not needed.
    - Step 8: Not an audit.
    - Decision: Go with conditions: transparency about the feature and opt-out.

  **Proposal 2: Support-network suggestions (non-users)**
    - Step 1: Context is health self-management and social support. This introduces a social context.
    - Step 2: 
        - Subjects: the user (who is providing contacts and location) and non-user contacts (their information is derived from contact graph and location overlap).
        - Information: inference that a non-user is in a similar situation (e.g., also using the app? or just in the same location?) and then suggesting them as a support contact to the user.
        - Recipient: the user (only).
    - Step 3: 
        - For the user: transparent (we assume). 
        - For non-users: cannot inform -> violation, proceed to harm.
    - Step 4: 
        - For non-users: 
            - Unobserved: We are observing non-users via the user's contact list and location? This is not normal in a health app without consent from the non-user.
            - Unknown: We are inferring that they are in a similar situation and then suggesting them. This makes them known to the user in a specific health context without their knowledge.
            - Unnoticed: They are not being addressed, but they are being used as a resource suggestion -> they might be noticed by the user in an unwanted way.
            - Control: Non-users have no control.
        - Violation on all counts.
    - Step 5: Harm assessment for non-users:
        - Audience: the user. Decision change: the user might reach out to the non-user. 
        - Magnitude: Medium (could be awkward, could reveal the non-user's own health situation if the user asks, or if the non-user is not actually in a similar situation, it could be a false inference). 
        - Also: if the non-user is not a user of the app, the inference might be wrong (low confidence? we don't know). 
        - Group harm: If the inference is based on location and contact, it might reveal patterns about a group (e.g., people in a certain neighborhood are stressed). 
        - Deferred identifiability: The non-user is identifiable by the user (the user knows who they are). 
        - Overall harm: Medium.
    - Step 6: Prediction leakage: We are inferring about non-users. This is an information flow to the company about non-users (that they are in a similar situation). We must run Steps 2-5 for that flow.
        - Step 2 (for leakage): Subject: non-user. Information: inference about their situation. Recipient: the company (and stored in the model?).
        - Step 3: Non-user not informed -> violation.
        - Step 4: Norms violation (in a health app, it's not normal to collect data about non-users without consent).
        - Step 5: Harm: The company now knows something about the non-user. Audience: the company. Decision change: minimal (only used for this feature). But if the data is stored, future uses? We require that the data be ephemeral and not stored (condition). Harm: low.
    - Step 7: Hypothetical consent for non-user: Would a non-user refuse if they knew? We think yes, because they are being profiled without consent. This is a values gate. We judge that they would refuse -> No.
    - Step 8: Not an audit.
    - Decision: No. (Because of Step 7 and the norm violations.)

  **Proposal 3: Quiet check-in with trusted contact**
    - Step 1: Context is crisis intervention (a sub-context of health).
    - Step 2: 
        - Subject: the user (who is at risk).
        - Information: a risk signal (what exactly? we need to know the level of detail) to a trusted contact (non-professional, user-nominated).
        - Recipient: the trusted contact (non-user of the app?).
    - Step 3: 
        - The user is informed? We assume yes (condition: must be clear). 
        - The trusted contact is being brought into the system? They are not a user. We cannot inform them about the system's inner workings? But the user will inform them when nominating? We assume the user explains. But the contact might not understand the risk signal. We note a potential transparency gap for the contact.
    - Step 4: 
        - For the user: 
            - Unobserved: The observation is by the app (normal). 
            - Unknown: The trusted contact learns about the user's risk. But the user nominated them, so it's consensual? Not exactly: the system is sending the signal automatically. 
            - Unnoticed: The trusted contact is being asked to check in -> they are acting. 
            - Control: The user controls who is nominated and can revoke. 
            - Norms: In a crisis context, sharing with a trusted contact is normal? But the norm might be that the user reaches out, not the system automatically. This might be a norm violation because it removes the user's immediate control at the moment of sending.
        - For the trusted contact (as a subject?): 
            - They are being made to receive a risk signal about the user. This is not about the contact's own data, but they are now a recipient. We don't normally evaluate the recipient as a subject in privacy, but in this case, the flow might impose a burden. We are not protecting the contact's privacy in the same way, but we must consider if the flow is appropriate to the contact (they didn't sign up for this app). 
            - We focus on the user and the flow to the contact. The norm might be that the contact has agreed to be a contact? We require that the contact explicitly agrees to be a recipient (condition: the contact must opt-in to receiving alerts). Without that, it's a violation.
    - Step 5: Harm assessment:
        - If the risk signal is sent in error (false positive), the trusted contact might overreact. Magnitude: high if the overreaction is severe (e.g., calling the police unnecessarily). 
        - If the risk signal is not sent when it should be (false negative), harm to the user. 
        - We require that the risk signal be well-calibrated and that the false positive rate be minimized (condition: validation of the model). 
        - Also, the burden on the contact: they might feel obligated. Harm: medium.
    - Step 6: No prediction leakage about non-users in this feature.
    - Step 7: Hypothetical consent for the user: Would the user refuse if they understood? Probably not, because they are nominating the contact for this purpose. But we are concerned about the contact. For the contact: Would they refuse if they understood the burden and risk of false positives? We think they might. This is a values call. We condition: the contact must explicitly opt-in (with a clear explanation) and can opt-out at any time. Then, we judge that with that condition, they would not refuse.
    - Step 8: Not audit.
    - Decision: Go with conditions: 
        a. The trusted contact must explicitly opt-in to receiving alerts (with a clear explanation of what they might receive and the possibility of false alarms).
        b. The user must be informed about the possibility of false alarms and the contact's ability to opt-out.
        c. The model must be validated to minimize false positives (with an acceptable threshold defined).
        d. The risk signal should be as minimal as possible (e.g., "your friend might need a check-in" not "your friend is suicidal" unless the model is very confident).

  We did not kill Proposal 3 but added conditions. However, if the contact opt-in is not feasible, then we would have to deny.

  **Summary of the procedure's limitations**:
    - It cannot resolve the tension between model secrecy and transparency: we require the user to be told in plain terms what is happening, but we don't require revealing the model.
    - It relies on honest context setting and norm assessment.
    - It does not eliminate the need for human judgment (especially in Steps 1, 5, and 7).

  **Which past decisions might change?**:
    - If we had used a control theory, we would have focused more on consent and might have approved more with consent. But we are using contextual integrity, so we might have denied some flows that had consent but were inappropriate in context.
    - If we used an access theory (privacy as restricted access), we might have been more permissive about internal flows. But we are stricter because of norms.

  We hope this procedure breaks your failure modes by:
    - Not waving through on-device or anonymized without checking the flow (we look at what leaves the device and to whom).
    - Replacing creepiness with norms and harm assessment.
    - Making conditions specific and tied to steps (e.g., transparency, opt-in, data minimization) that can be checked later.
answer: |-
  ### Privacy Review Decision Procedure  
  Based on a **contextual integrity framework** (Nissenbaum), which evaluates privacy through the lens of informational norms in specific contexts. This approach:  
  - **Values privacy as appropriate information flow** within a context, judged by norms of actors, attributes, and transmission principles.  
  - **Costs**: It rejects universal rules (like pure consent) and requires nuanced context-setting. Past decisions relying solely on consent or anonymization may need revisiting.  
  - **Augmented with consequentialist harm assessment** (downstream decision-change) and **transparency requirements** to handle uncertainty.  

  ---

  ### The Procedure: 9 Ordered Steps  
  **Output after each step**: Continue, "No," or "Go with Conditions" (specify conditions). If "No," stop.  
  **Key principles**:  
  - **Separate scoring** for your four privacy dimensions: (1) Unobserved, (2) Unknown, (3) Unnoticed/Unaddressed, (4) Control.  
  - **Conservative defaults** where data is uncertain (e.g., assume re-identification is possible).  
  - **Non-users** and **prediction leakage** explicitly included.  

  #### Step 1: Define the Context  
  - **Question**: What is the primary context (e.g., "health self-monitoring," "social support")? Is this a *new* context?  
  - **Sufficient answer**: Context must align with user expectations (e.g., journaling app = health context). New contexts require explicit justification.  
  - **Stop if**: Context is indefensible (e.g., covertly repurposing journal data for hiring decisions).  
  - **Uncertainty**: Default to the most sensitive plausible context (e.g., health > lifestyle).  
  - **Values judgment**: None.  

  #### Step 2: Map Information Flows  
  - **Question**: For each actor (user/non-user), what data is collected, inferred, stored, or shared? Include:  
    - Raw data (e.g., journal text).  
    - Inferences (e.g., "high-risk user").  
    - **Prediction leakage** (e.g., model updates that encode attributes of non-users).  
  - **Sufficient answer**: List all inputs/outputs, recipients, and subjects. Flag non-users and prediction leakage.  
  - **Stop if**: Non-consensual collection of high-sensitivity data (e.g., health, location) about non-users with no path to notice.  
  - **Uncertainty**: Assume prediction leakage occurs if non-user data is input to models.  

  #### Step 3: Assess Transparency to Subject  
  - **Question**: Can the subject (user/non-user) easily discover what is known about them and how it’s used?  
  - **Sufficient answer**:  
    - Users: In-app explanations accessible in <3 clicks.  
    - Non-users: No feasible transparency → automatic −1 on **Control** and **Unknown** dimensions.  
  - **Stop if**: Active deception (e.g., hiding inference from users).  
  - **Uncertainty**: Assume non-transparent if explanation is technical > 8th-grade reading level.  
  - **Values judgment**: None.  

  #### Step 4: Evaluate Contextual Norms  
  - **Question**: Does the flow violate entrenched norms for the context? Score each dimension:  
    | **Dimension**      | **Violation Example**                          |  
    |--------------------|-----------------------------------------------|  
    | Unobserved         | Covert tracking (e.g., hidden location scans). |  
    | Unknown            | Inferring sensitive attributes (e.g., mental health). |  
    | Unnoticed/Addressed| Automated actions targeting non-users (e.g., labeling them). |  
    | Control            | Data used beyond context (e.g., journal content for ads). |  
  - **Sufficient answer**: Justify alignment with norms (e.g., "Users expect mood data to improve app suggestions").  
  - **Stop if**: Severe violation in ≥2 dimensions (e.g., inferring non-users’ health without transparency + control).  
  - **Uncertainty**: Default to violation if norms are contested.  

  #### Step 5: Quantify Harm via Decision-Change  
  - **Question**: For each norm violation, what is the magnitude of *decision-change* for affected actors?  
    - **Audience**: Who acts on the data? (e.g., app algorithms, trusted contacts, advertisers).  
    - **Harm magnitude**:  
      - **Low**: Trivial changes (e.g., surfacing a meditation tip).  
      - **Medium**: Notable changes (e.g., suggesting a support group).  
      - **High**: Life-altering changes (e.g., triggering an intervention).  
    - **Confidence in inference**: High confidence + high harm = magnified risk. Low confidence offsets harm.  
    - **Group harm**: Score as **High** if decisions affect marginalized groups (e.g., algorithmic bias in risk scores).  
  - **Sufficient answer**: Estimate using historical data or analogous cases.  
  - **Stop if**: High harm + non-consensual (e.g., sharing suicide risk with non-users without consent).  
  - **Uncertainty**: Assume high harm if:  
    - Data is health-related.  
    - Audience is non-medical third parties.  
    - Confidence is unknown.  

  #### Step 6: Handle Deferred Identifiability  
  - **Question**: Could data become identifiable with future datasets?  
  - **Sufficient answer**:  
    - If data is stored/transmitted, assume identifiability unless:  
      - Data is ephemeral (<24h retention).  
      - Aggregated >10,000 users.  
  - **Stop if**: High-sensitivity data (e.g., mental health) stored indefinitely.  
  - **Uncertainty**: Always assume identifiability if data leaves the device.  

  #### Step 7: Hypothetical Consent Check  
  - **Question**: Would users/non-users refuse consent if they understood the flow and downstream uses?  
  - **Sufficient answer**: "Yes" if:  
    - Harm is **Medium/High** + low user benefit.  
    - Non-user data is used.  
  - **Values judgment**: Explicitly flagged. Requires PM/reviewer agreement.  
  - **Stop if**: "Yes" for non-users or high-harm user flows.  

  #### Step 8: Audit Carve-Out  
  - **Question**: Is the data flow *solely* for bias/abuse auditing?  
  - **Sufficient answer**: Only if:  
    - Data is minimized (e.g., aggregates, not raw journals).  
    - Access is restricted to auditors.  
    - Results are public (anonymized).  
  - **Stop if**: Auditing claim is pretextual.  

  #### Step 9: Final Decision  
  - **Go**: No violations, or violations offset by transparency/low harm.  
  - **Go with Conditions**: E.g., "Add opt-out for non-user inferences," "Limit data retention to 7 days."  
  - **No**: Unfixable high harm, non-consensual non-user flows, or deferred identifiability risks.  

  ---

  ### Application to Your Backlog  
  #### Proposal 1: On-Device Risk Flag  
  - **Step 1**: Context = Health self-management. Norm: On-device analysis expected.  
  - **Step 2**: No raw data leaves device; only "high-risk" bit to server. No non-users.  
  - **Step 3**: Users can see explanation in settings. **Score**: No violations.  
  - **Step 4**: **Unobserved** (OK), **Unknown** (OK), **Unnoticed** (OK), **Control** (OK).  
  - **Step 5**: Harm = Low (nudges to resources).  
  - **Step 6**: Bit is low-identifiability.  
  - **Step 7**: Hypothetical consent likely granted.  
  - **Output**: **Go** (with condition: transparency in onboarding).  

  #### Proposal 2: Support-Network Suggestions  
  - **Step 1**: Context = Health support. New norm: Suggesting non-users.  
  - **Step 2**: Infers non-user attributes (e.g., "similar situation"). Prediction leakage likely.  
  - **Step 3**: Non-users cannot be notified. **Score**: −1 Control, −1 Unknown.  
  - **Step 4**: **Unobserved** (OK), **Unknown** (Violation), **Unnoticed** (OK), **Control** (Violation).  
  - **Step 5**: Harm = Medium (user might disclose non-user’s context). Group harm possible.  
  - **Step 6**: Contact/location data → assume identifiable.  
  - **Step 7**: Non-users would refuse → **Stop**.  
  - **Output**: **No** (non-consensual non-user inference).  

  #### Proposal 3: Quiet Check-In with Trusted Contact  
  - **Step 1**: Context = Crisis intervention. Norm: Trusted contacts involved with consent.  
  - **Step 2**: Shares risk signal with non-user (trusted contact).  
  - **Step 3**: User understands; contact cannot audit system. **Score**: −1 Control for contact.  
  - **Step 4**: **Unobserved** (OK), **Unknown** (OK), **Unnoticed** (Violation: contact targeted), **Control** (Violation).  
  - **Step 5**: Harm = **High** (contact may call police erroneously). Confidence unknown → assume high.  
  - **Step 6**: Risk signal → assume identifiable.  
  - **Step 7**: Contact might refuse if false positives likely. **Values judgment**: Deny unless strict controls.  
  - **Output**: **Go with Conditions**:  
    - User-configurable thresholds (e.g., "only share if confidence >90%").  
    - Contacts must receive false-positive warnings.  
    - Data retention <24h.  
  - **Why not killed?** Contextual norms permit trusted contacts, but harm requires mitigation.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve norm disputes**: If teams disagree on "entrenched norms," escalation to leadership is needed.  
  2. **Precise harm quantification**: Uses ordinal scales (Low/Med/High) due to uncertainty.  
  3. **Optimization attacks**: Bad actors could exploit loopholes (e.g., calling everything "on-device"). Mitigation: Require raw data diagrams.  
  4. **Transparency vs. secrecy**: Cannot reconcile model secrecy with transparency; defaults to describing *purpose* not mechanics.  
  5. **User-demanded harmful features**: **Vetoes** if harm is high + hypothetical consent fails. Authority: Paternalism justified by context (health = high stakes).  

  ### Siloed Distinctions Simplified  
  - **Prediction leakage**: Treated as inference in Step 2. Harm amplified by confidence.  
  - **Confidently misfiled**: Scored as high harm (Step 5). Confidence and accuracy are separate.  
  - **Group harm**: Scored as high harm (Step 5).  
  - **Deferred identifiability**: Conservatively assumed (Step 6).  
  - **Non-users**: Explicitly flagged in all steps; no transparency → violations.  

  ### Final Output  
  - **Decision doc**: One page with:  
    - Context + flow diagram.  
    - Norm scores (1–4) and harm level.  
    - Hypothetical consent verdict.  
    - Conditions (if any).  
  - **Audit trail**: Bullet points from each step.  

  This breaks your failure modes:  
  - No more "anonymized = safe" without flow checks.  
  - Replaces "creepiness" with norm/harm scores.  
  - Conditions are specific and auditable (e.g., "delete non-user data after 7 days").
