answer: |-
  Here’s a taxonomy built from logical distinctions, designed to force concrete commitments. Each branch is a yes/no question phrased as a claim, leading to 10 terminal positions ("leaves") that cover your required distinctions and cases. Empty regions are noted.

  ---

  ### **Branch Questions (6 Binary Splits)**
  1. **CORE CLAIM LEVEL**:  
     *Claim: "Analogical processing is the irreducible computational primitive for all high-level cognition."*  
     (Yes → Algorithm/Representation level; No → Computational level only)

  2. **FALSIFIABILITY LOCK**:  
     *Claim: "A system could exhibit categorization/perception *without* any retrievable prior experience."*  
     (Yes → Weakens core thesis; No → Strengthens core thesis)

  3. **RETRIEVAL MECHANISM**:  
     *Claim: "Analogy requires accessing a specific stored episodic trace."*  
     (Yes → Episodic retrieval; No → Constructive/generalized source)

  4. **MAPPING TYPE**:  
     *Claim: "Analogical transfer requires explicit role bindings (e.g., ‘predator : prey :: hunter : deer’)."*  
     (Yes → Structured relations; No → Non-symbolic similarity/schemas)

  5. **SOURCE-FREE TRANSFER**:  
     *Claim: "A system can transfer relational structure without retrieving *any* single source episode."*  
     (Yes → Allows novel construction; No → Requires retrievable source)

  6. **BEHAVIORAL SUFFICIENCY**:  
     *Claim: "Passing all behavioral tests for analogy (e.g., Raven’s Matrices) implies analogical cognition *exists* in the system."*  
     (Yes → Rejects deflationary/NN-skeptic view; No → Accepts it)

  ---

  ### **Terminal Positions ("Leaves")**
  1. **Strong Identity Thesis**  
     [Y-Y-*] Core cognition *is* analogy. Categorization = analogical retrieval. Rejects falsifiability lock (no: cognition without retrieval impossible).  
     *Commitment*: All concepts are fluid, context-sensitive comparisons.

  2. **Structure-Mapping Engine (SME)**  
     [Y-Y-Y-Y-*] Structured representations with explicit roles. Retrieves specific episodes but maps roles relationally.  
     *Boundary*: Fails if no role bindings exist (e.g., sensorimotor flows).

  3. **Embodied Metaphor View**  
     [Y-Y-N-N-*] Sensorimotor schemas (not episodes) as source. Mapping via bodily schemas (e.g., "more = up"). Rejects explicit roles.  
     *Case*: Explains "anger = hot fluid" but not abstract proportional analogies.

  4. **Bayesian Structure Learning**  
     [N-Y-N-*-*] Analogy emerges from probabilistic structure learning. Computational-level only.  
     *Critique*: Analogy is a byproduct, not the core.

  5. **Predictive Processing Variant**  
     [N-Y-N-*-*] Analogy as prediction-error minimization across hierarchical models.  
     *Distinction from #4*: Stresses active inference, not just learning.

  6. **Neural Network Skeptic**  
     [*-*-*-*-N] Systems (e.g., transformers) pass analogy tests via statistical pattern completion. No "retrieval" or "mapping" occurs.  
     *Commitment for humans*: Our subjective sense of analogy may be illusory post-hoc labeling.

  7. **Deflationary Pluralism**  
     [N-Y-*-*-*] "Analogy" lumps unrelated mechanisms: e.g., perceptual similarity ≠ relational mapping. No natural kind.  
     *Evidence*: Double dissociation (your case):  
     - *Subject A*: Reliable categorizer (cats vs. dogs) but cannot see "virus spread : quarantine :: fire spread : containment".  
     - *Subject B*: Maps "organelles : cell :: organs : body" to "apps : smartphone", but calls a toaster a "coffee heater".

  8. **Constructive Schema View**  
     [Y-N-N-N-Y] Novel schemas constructed on-demand (no stored episode). Mapping via dynamic sensorimotor simulations.  
     *Source-free*: Transfers structure without retrievable sources (e.g., inventing metaphors).

  9. **Vector-Space Purist**  
     [Y-N-*-N-*] Analogy as similarity in learned embedding space (e.g., word2vec). Rejects roles/schemas.  
     *Limitation*: Cannot explain systematicity (e.g., why "love : heart :: justice : scales" but not "scales").

  10. **Hybrid Dynamic Binding**  
      [Y-N-Y-Y-Y] Retrieves episodes but dynamically binds roles via activation vectors (neural-symbolic).  
      *Innovation*: Blends structured roles with connectionist retrieval.

  ---

  ### **Empty Regions & Why**
  - **Algorithmic + Computational-only**: Incoherent. If analogy is *only* computational, it can’t be the algorithmic primitive.  
  - **Episodic Retrieval + Source-Free Transfer**: Incoherent. Source-free denies episodic retrieval.  
  - **Symbolic Roles + Sensorimotor Schemas**: Unclaimed. Hybrids exist (#10), but pure integration is underspecified.  
  - **NN-Skeptic + Strong Identity**: Unattractive. If analogy is core, but NNs "fake it," humans must fake it too — undermines the thesis.  

  ### **Indistinguishable Leaves**
  - **Bayesian vs. Predictive Processing (#4 vs. #5)**: Both are computational-level, probabilistic, and reduce analogy to structure learning. The tree cannot split them without an extra branch (e.g., "Does analogy require *active* inference?").  
  - **Constructive Schema vs. Vector-Space Purist (#8 vs. #9)**: Both reject stored episodes and roles. Differ in mechanisms (schemas vs. embeddings) but overlap in behavior.  

  ### **Key Resolutions**
  - **Falsifiability** addressed at Branch 2: If no cognition without retrieval, the thesis is strong; otherwise, it’s computational redescription.  
  - **Source-free transfer** (your criterion) isolated at Branch 5.  
  - **NN-skeptic** position forced by Branch 6 (behavioral tests ≠ mechanism).  

  This taxonomy compels concrete stances: e.g., rejecting Branch 1 commits you to computational-level; accepting Branch 3 and 5 collapses to incoherence. The double dissociation case (#7) illustrates deflationary pluralism vividly.
