prompt: |-
  I teach a third-year seminar on philosophy of economics — 16 students, every one of whom has taken intermediate microeconomics and almost none of whom has taken philosophy — and I have a single 80-minute session to spend on revealed preference and the question of what utility actually is. Last year I ran a version of this as a worksheet of hypothetical choices and it fell completely flat: the students could already write down a Lagrangian, so nothing surprised them, and the discussion collapsed into whether the formalism was "realistic." What I want this time is for them to run into the problem before it has a name. Specifically, I want them to feel three things: first, that assigning someone a utility function is an act of encoding what they did, not a discovery of a hidden quantity they were consulting; second, that this encoding buys genuine predictive power only if the recorded choices hang together in a particular way, and that one small, ordinary change in how the options are presented is enough to break that coherence for most of the room; third, that once it breaks there are exactly three ways out and each of them costs something — declare the chooser irrational, re-describe what was really being chosen so that the data is no longer a counterexample, or loosen the fit until almost any behaviour counts as rational after all — and that the philosophical interest lives in that trilemma rather than in the axiom. Nobody should hear the words utility, revealed preference, or WARP, or see any axiom, until the debrief; the point has to arrive as something that happened to them. Materials are limited to a flat seminar room with a projector, index cards, pens, and a supermarket bag of snacks I am willing to spend.

  My rough skeleton, which you should feel free to improve or replace: real stakes — students make a series of choices over bundles of actual snack items using a token budget and keep whatever they end up with, so the choices are not hypothetical. Then their choice records get handed to a partner who has to reconstruct a utility function from them and predict what the chooser will pick from a budget set they have not seen; correct predictions earn the predictor a bonus item. I am hoping two different detectives will produce obviously different numbers for the same data and yet make identical predictions, which is where the first idea lands. The same set of recorded choices then has to survive a comparison of two rounds that are, unbeknownst to the choosers, the same budget with the same prices — one presented with an extra option that nobody would ever take, one presented with a default already ticked — and this is where the house of cards should come down. If it works, the room is then forced to pick one of the three escape routes, and I would like them to have to argue for it in pairs rather than be told about it.

  What I need from you is the runnable version of that: the setup and materials, the round structure with the budget lines I should actually use, the sabotage, the forced choice between the three escapes, and then a debrief that maps specific moments in the session onto specific parts of the idea — including how I name it only at the end without it feeling like a punchline. Please also tell me what will predictably go wrong the first time I run it: the students who stay perfectly consistent and leave me without a counterexample, the ones who treat it as a game to be gamed, the ones who will notice the manipulation and feel tricked, and anything about using food as an incentive that I have not thought through. Be frank, finally, about what the activity cannot do: my sense is that it can show that utility-talk and choice-talk are intertranslatable under certain conditions, but that it cannot by itself reach the question of whether preference is something choices reveal or merely something we define them to be, nor the separate question of whether what people choose is what is good for them, and that those have to be supplied by me in the debrief — tell me if I have that wrong, and tell me the shortest honest way to say it. I have about 15 minutes of debrief, not more. Please reply as exactly eight numbered items, each two or three sentences long, with no headings, no introduction and no summary; I will be reading it off my phone in the ten minutes before class.
reasoning: |-
  Hmm, the user teaches a philosophy of economics seminar and needs help designing an activity about revealed preference and utility. They've tried a worksheet approach before that didn't work because students found it too abstract and focused on realism debates. Now they want students to experience three key insights through an experiential activity with snacks as incentives.

  The core issues they want to address are: utility as an encoding rather than discovery, the fragility of predictive coherence, and the trilemma when coherence breaks. They've outlined a rough structure involving real choices, partner prediction, and sabotage through framing. Important constraints include no technical terms until debrief, limited materials, and addressing predictable problems like consistent students or those feeling tricked.

  I need to translate their skeleton into a runnable plan. The activity should have four clear phases: choice recording, prediction challenge, sabotage round, and forced trilemma discussion. For the prediction phase, I'll suggest specific budget lines that ensure different utility functions could fit the same choices. The sabotage needs to be subtle - perhaps adding a dominated option or using default framing. The trilemma discussion should emerge naturally when predictions fail after framing changes.

  Major pitfalls to address: students who stay consistent (need backup disruption plan), those who game the system (emphasize real stakes), and those feeling manipulated (transparent debrief). Food issues like allergies and fairness require careful handling. The activity can't resolve ontological questions about preference or normative welfare questions - these must be explicitly addressed in the short debrief.

  The debrief should map moments to concepts: partner predictions showing utility as encoding, prediction failures revealing coherence requirements, and the trilemma discussion exposing theoretical costs. Naming concepts only at the end avoids premature labeling. I'll structure the response as eight concise items matching their requested format.
answer: |-
  1.  **Setup:** Distribute index cards and pens. Place a variety of snacks on the table with visible prices. Give each student 10 tokens as "money". Explain they will make several purchasing choices, keeping what they end up with, and choices are recorded on cards. Emphasize genuine preference.
  2.  **Round 1 (Baseline):** Project Budget Set A: `2x apple, 3x cookie, 1x water` (prices set so max bundle costs ~8 tokens). Students choose one bundle, record it on Card 1. Collect Card 1.
  3.  **Round 2 (Detective):** Project Budget Set B: `1x apple, 4x cookie, 2x water` (different price ratios). Students choose, record on Card 2. Collect Card 2. Shuffle and redistribute Card 1 & 2 pairs. Partners use these two choices to predict choice for Budget Set C: `3x apple, 2x cookie, 0x water` (distinct from A & B). Correct predictors get a bonus snack.
  4.  **Sabotage Rounds (Identical Budget, Different Frames):** *Round 3a (Decoy):* Project Budget Set D: `2x apple, 3x cookie, 1x water` (identical to A) **plus** `1x rotten banana` (priced at 10 tokens, dominated). Students choose, record on Card 3a. *Round 3b (Default):* Project Budget Set D again, labeled differently, **with `2x apple, 3x cookie, 1x water` pre-selected** ("you can change it"). Students choose, record on Card 3b. Collect all cards.
  5.  **The Break & Trilemma:** Reveal Sets D in 3a and 3b were identical. Ask partners to compare their chooser's Card 3a vs. Card 3b. When inconsistencies arise (likely), ask pairs: "What *must* be true about your partner? Argue for one: A) They were irrational then/now. B) They *really* chose different things (e.g., avoiding decoy, resisting default). C) We must accept both as rational choices for that budget."
  6.  **Debrief Part 1 (The Encoding):** Point out different detectives assigned different number patterns (utility) to the same initial choices (Cards 1 & 2) yet predicted C correctly. Highlight: "You weren't finding a hidden number, you were *encoding* observed choices into a pattern to predict *other* choices." Introduce "utility function" as that encoding pattern.
  7.  **Debrief Part 2 (Coherence & Breakdown):** Note predictions worked initially because choices cohered (Cards 1 & 2 fit a pattern). The identical D budget exposed a problem: the frame (decoy/default) changed choices, breaking coherence. Introduce "revealed preference" and "WARP" as the (now broken) rule needed for a single, predictive utility function to exist.
  8.  **Debrief Part 3 (The Trilemma & Limits):** Map their arguments onto the escapes: A=Irrationally, B=Re-describing choices (context/preference change), C=Loosening rationality (allowing frame-dependence). State clearly: This activity shows utility is defined *by* choices under coherence; it doesn't settle if preference *causes* choices or is just our summary, nor if chosen snacks are *good* for them – those are deeper philosophical questions we tackle next.
