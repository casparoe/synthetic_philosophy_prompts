prompt: |-
  Hey — I need a case built to order for something I'm writing on the regress problem.

  Build me an ordinary, non-sceptical scenario (a mechanic, a nurse, a line cook, whatever — no demons, no brains-in-vat) in which infinitism says the subject's belief is justified and coherentism says it is not. So on the one hand she has to be able to keep producing a further reason for every reason, endlessly and without looping back, and that endlessness has to fall out of some generative rule she could genuinely be disposed to apply (roughly: every reading can be backed by the check the instrument itself passed, and that check by another check), not from us just stipulating that she has infinitely many reasons lying around. On the other hand her total belief system has to fail to cohere with the target belief — but keep the incoherence local and compartmentalised, so it doesn't simply wreck the infinitist chain: the conflicting material sits off in another region of her beliefs and the target belief explains nothing else she holds.

  After the scenario: name the belief, show two or three links of the chain plus the rule that keeps it going, and say exactly why each theory gives the verdict it does. Then tell me wether the case actually works, which single feature is doing the work, what happens to both verdicts if you delete that feature, how a coherentist would attack the case (give me something better than 'no real subject is like that'), and one line on where a modest foundationalist would land.

  Lead with your bottom line in the first sentence — whether the case works and what the two verdicts are — then the scenario, then the check. No preamble and no restating the question.
