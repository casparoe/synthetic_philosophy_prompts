  **UNOCCUPIED COMBINATIONS & NOTES:**  
  - **Consciousness without intentionality/agency:** (e.g., NODE 1=No → NODE 3=No → NODE 5=Yes). Plausible for panpsychists, but no major position argues colonies (unlike particles) have *only* consciousness.  
  - **Fragile agency + intentionality:** (NODE 4=No). Rare; if agency breaks with queen-swap, why call it "agency" at all?  
  - **Metaphysical pairs:** Functionalist vs. Swarm Realist leaves are behaviorally identical (both accept intentionality/agency) but split on consciousness—a purely metaphysical difference.  
  - **Bandwidth Doubler:** Mostly tests consciousness; speed changes don’t cleanly affect intentionality/agency.  

