  Below is a decision tree handout designed to sort positions based on concrete case judgments, avoiding labels and abstract questions. It separates three key dimensions: **phenomenal consciousness** (is there "something it's like" to be the colony?), **intentionality** (can colony-level states be true/false?), and **agency** (does the colony act for its own reasons, beyond self-organization?). The tree uses your specified cases, with 8 nodes and 7 leaves. Unoccupied combinations are noted. Each leaf includes a name (if recognized), its key commitment, and the "awkward" implication a critic might raise.  

  ---

  **DECISION TREE: DOES AN ANT COLONY HAVE A MIND?**  
  *Answer each question based on cases. Follow the arrows.*  

  **START → NODE 1 (Stigmergic Ventriloquist):**  
  The colony follows fake pheromone trails to an empty area, acting as if food is there. Is the colony *wrong* about the food location?  
  - **Yes** (colony has accuracy conditions) → **NODE 2**  
  - **No** (colony just responds mechanically) → **NODE 3**  

  **NODE 2 (Replayed Transcript):**  
  You copy a colony’s chemical state to a new set of ants, and they behave identically. If the environment changes (e.g., food moves), is the new colony *mistaken* when it acts like the old one?  
  - **Yes** (copied state carries truth/falsity) → **INTENTIONALITY = YES**  
  - **No** (copied state is habit, not belief) → **INTENTIONALITY = NO**  

  **NODE 3 (Nest Fission):**  
  A colony splits into two identical halves. *Before* the split, was there one unified subject (e.g., one "mind")?  
  - **Yes** (colony is a single agent) → **AGENCY = YES**  
  - **No** (just ants cooperating) → **AGENCY = NO**  

  **NODE 4 (Queen Swap):**  
  The queen is replaced seamlessly; colony behavior continues unchanged. Is it the *same* colony mind after?  
  - **Yes** (mind persists despite part-swap) → **AGENCY = ROBUST**  
  - **No** (new mind with inherited habits) → **AGENCY = FRAGILE**  

  **NODE 5 (Blind Colony):**  
  Foragers are removed; internal processes (brood care, temperature) continue. Is there still a conscious experience?  
  - **Yes** (internal states suffice for experience) → **CONSCIOUSNESS = YES**  
  - **No** (consciousness requires external input) → **CONSCIOUSNESS = NO**  

  **NODE 6 (Bandwidth Doubler):**  
  Radios double ant communication speed, accelerating colony patterns. Does this make the colony *more conscious*?  
  - **Yes** (speed enables consciousness) → **CONSCIOUSNESS = SPEED-DEPENDENT**  
  - **No** (speed irrelevant to consciousness) → **CONSCIOUSNESS = SPEED-INVARIANT**  

  **NODE 7 (Nest Fission Consistency):**  
  After fission, are *both* halves distinct colony minds? (Only if you answered "Yes" to unified subject in Node 3)  
  - **Yes** (mind can split) → **AGENCY = DIVISIBLE**  
  - **No** (fission destroys the original) → **AGENCY = INDIVISIBLE**  

  ---

  **LEAVES (POSITIONS):**  
  *Combinations map to these 7 leaves. Unoccupied combinations are noted.*  

  1. **Mechanist (Unified No-Mind)**  
     - *Path:* NODE 1=No → NODE 3=No (AGENCY=NO) → (NODE 5 & NODE 6 irrelevant)  
     - **Commitments:** Colony is self-organizing but lacks mind, agency, or consciousness.  
     - **Awkward:** "If no agency, why describe colonies as 'solving problems' at all?"  

  2. **Habitualist (Agency Without Intent)**  
     - *Path:* NODE 1=No → NODE 3=Yes (AGENCY=YES) → NODE 4=Yes (ROBUST) → NODE 7=Yes/No → (NODE 5 & NODE 6 irrelevant)  
     - **Commitments:** Colony is a unified agent with goals, but no beliefs (states lack truth/falsity).  
     - **Awkward:** "Can goals exist without representations (e.g., of food locations)?"  

  3. **Functionalist (Intentionality + Agency, No Consciousness)**  
     - *Path:* NODE 1=Yes → NODE 2=Yes (INTENTIONALITY=YES) → NODE 3=Yes (AGENCY=YES) → NODE 4=Yes (ROBUST) → NODE 5=No (CONSCIOUSNESS=NO)  
     - **Name:** Dennett-style "intentional stance."  
     - **Commitments:** Colony has beliefs/goals, but no subjective experience.  
     - **Awkward:** "If colony 'believes' false things, what *is* believing without feeling?"  

  4. **Phenomenal Holist (Consciousness + Intentionality)**  
     - *Path:* NODE 1=Yes → NODE 2=Yes (INTENTIONALITY=YES) → NODE 3=No (AGENCY=NO) → NODE 5=Yes (CONSCIOUSNESS=YES)  
     - **Commitments:** Conscious and representational, but not a unified agent (e.g., a "mind" without goals).  
     - **Awkward:** "Can there be consciousness without a subject ('who' experiences it)?"  

  5. **Speed-Sensitive Panpsychist (Consciousness, Speed-Dependent)**  
     - *Path:* (NODE 1=Yes/No) → (NODE 2=Yes/No) → (NODE 3=Yes/No) → NODE 5=Yes → NODE 6=Yes  
     - **Commitments:** Consciousness emerges only at faster communication speeds.  
     - **Awkward:** "Why is *this* speed the threshold? Feels arbitrary."  

  6. **Swarm Realist (Full Mind: Intentionality + Agency + Consciousness)**  
     - *Path:* NODE 1=Yes → NODE 2=Yes (INTENTIONALITY=YES) → NODE 3=Yes (AGENCY=YES) → NODE 4=Yes (ROBUST) → NODE 5=Yes → NODE 6=No  
     - **Name:** "Superorganism" view (Wheeler, Hölldobler).  
     - **Commitments:** Colony is a conscious agent with true/false states.  
     - **Awkward:** "How can a mind persist when ants die hourly or the queen is replaced?"  

  7. **Agnostic Emergentist (Uncommitted on Consciousness)**  
     - *Path:* NODE 1=Yes → NODE 2=Yes (INTENTIONALITY=YES) → NODE 3=Yes (AGENCY=YES) → NODE 4=Yes (ROBUST) → NODE 5=No → NODE 6=No  
     - **Commitments:** Agency and intentionality exist, but consciousness is unknown/unknowable.  
     - **Awkward:** "If colony acts intelligently and represents the world, why deny consciousness?"  

