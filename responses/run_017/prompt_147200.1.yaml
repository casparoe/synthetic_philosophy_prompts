prompt: |-
  I have been reading about intelligence on my own for a couple of years now — no training in philosophy or psychology, just books and long argument threads — and I keep losing the same arguments because everyone in them is quietly using a different standard for what would even count as an answer. So before I read any more definitions of intelligence, I want the specification: what an adequate account of intelligence has to deliver.

  The purpose I want it good enough for is three disputes I actually care about. First, whether the chatbot I use daily is intelligent in any sense at all, or whether calling it that is only a way of speaking. Second, whether "a machine much smarter than us" is more than a slogan. Third, whether I am being inconsistent when I say my dog has some intelligence and the spreadsheet that balances my accounts has none.

  Here is my tentative list, each with the case that makes me think it is a requirement.

  It must separate intelligence from stored knowledge. Two systems give identical answers to every question I can ask in some domain; one looked them up in an index it was handed, the other worked them out. If a theory cannot tell these apart, it is not a theory of intelligence.

  It must separate intelligence from speed and from brute resources. Take a program that wins by trying every possibility, and then the same program slowed by a factor of a million: I want to say it is not less intelligent, only slower. But I cannot say that in full generality, because slow it down enough and it never answers at all. So I propose a fixed-budget rule — comparisons of how much intelligence something has must hold time, memory and hardware fixed — and I want to know whether that rule is workable or whether it quietly makes every comparison between very different kinds of system undefined.

  It must handle jagged systems: ones that beat the best humans at one narrow game and fail at things a child does. Does intelligence admit a single ordering, or is it a profile? If it is a profile, what becomes of the "smarter than us" claim?

  It must say when two problems are the same problem. Someone solves a puzzle stated in words and cannot solve the same puzzle drawn as a diagram; a system solves a task in one setting and collapses when the surface details change but the structure does not. Without something here, "able to handle new problems" is empty.

  It must handle collections. An ant colony, a market, or an invented case I keep returning to: a thousand slow reasoners wired together so that their combined verdict arrives in a second, where no single one of them does anything I would call intelligent. Is the whole intelligent, or is this a different thing we honour with the same word?

  It must handle damaged or unusual hardware: a person who can no longer form new memories but still reasons well; a savant who produces answers he cannot explain; someone whose body cannot produce the answers a test would accept. Whatever intelligence is, it should not be taken away by a broken output channel.

  It must be able to tell me I was wrong about who has it. If the tests we build are validated against the people we already call intelligent, the theory just returns my own judgements and settles nothing about the dog or the spreadsheet. Is that a genuine requirement, or am I asking for magic?

  It must keep intelligence distinct from the things we confuse it with — knowledge, speed, wisdom, character, being useful — and must distinguish having some from having a lot, the way a mouse and a rock differ.

  What I want from you: sort these into genuine desiderata and mere prejudices of one camp, given the purpose I stated; restate the genuine ones more sharply than I have; add the two or three requirements a specialist would insist I have missed, with the case behind each; and mark which are non-negotiable and which I could drop if dropping one buys me the rest. I have three suspicions I want tested rather than flattered: that the jaggedness requirement and the "smarter than us" claim are already in conflict; that the same-problem requirement is just the stored-knowledge requirement in disguise and can be deleted; and that the damaged-hardware requirement is sentimental and will do no real work. Flag any subset of the final list that cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest number of the usual kinds of answer. Then, in a few lines each and no more, score the standard families: the does-well-on-our-tests account, the general-problem-solving-across-many-environments account, the single-number psychometric account, and the biological or neural account. I do not know the literature well enough to name them properly, so use whatever the real families are.

  Lead with your bottom line in the first sentence — the one thing about this list that I most need to hear — then give me the reasoning. No preamble, and do not restate my question back to me.
reasoning: |-
  Hmm, the user has been deeply immersed in self-study about intelligence for years, hitting walls in arguments due to undefined standards. They want a specification for what makes an account of intelligence adequate, grounded in three concrete disputes: chatbots, superintelligent machines, and inconsistencies in attributing intelligence to dogs vs. spreadsheets. Their list of requirements is thoughtful but needs refinement.  

  First, their core frustration is meta: unstated standards derail discussions. The bottom line must address that head-on. Their requirement list has genuine insights but mixes essentials with potential red herrings.  

  Breaking down their requirements:  
  - Separating intelligence from stored knowledge is solid. It targets the chatbot dilemma—is it recalling or reasoning?  
  - Separating from speed/resources is pragmatic but the fixed-budget rule is tricky. Comparisons across systems (e.g., human vs. AI) might break if hardware is too divergent.  
  - Jaggedness vs. "smarter than us" is indeed a conflict. If intelligence is multidimensional, claiming one system is "smarter" globally requires collapsing dimensions—which risks oversimplifying.  
  - The "same problem" requirement feels redundant with stored knowledge. If a system fails structurally identical problems due to surface changes, it’s relying on memorized patterns, not abstraction.  
  - Collections (ant colonies, etc.) test whether intelligence is an emergent property. This is crucial for their market/group-reasoner case but might overextend the term.  
  - Damaged hardware: While poignant (e.g., amnesiacs reasoning well), it might not add unique value. Savant cases are covered by jaggedness; output channel issues are more about measurement than intelligence itself.  
  - "Tell me I was wrong" is vital. Without falsifiability, theories just echo biases—key for the dog/spreadsheet dispute.  
  - Distinguishing from conflated concepts (wisdom, etc.) is necessary but secondary.  

  Specialist additions:  
  1. Adaptability to novelty: Handling truly unseen problems, not just variations. Chatbots often fail here.  
  2. Resourcefulness: Efficient use of finite resources (time/memory). Brute-force vs. clever solutions.  
  3. Transfer learning: Applying skills across domains. Spreadsheets can’t; dogs sort of can.  

  Non-negotiables:  
  - Separating intelligence from knowledge/speed (core to disputes).  
  - Jaggedness and collections (they’re central to real-world cases).  
  - Falsifiability ("tell me I was wrong").  

  Droppable:  
  - Damaged hardware: Savant/amnesiac cases fit under jaggedness/output channels.  
  - "Same problem": Redundant with knowledge separation.  

  Conflicting trio: Jaggedness, single-ordering ("smarter than us"), and falsifiability can’t all be fully satisfied. Jaggedness opposes single metrics; falsifiability needs clear tests, which jaggedness complicates.  

  The "smarter than us" claim is the biggest troublemaker—it forces oversimplification.  

  Scoring standard theories:  
  - Psychometric (IQ): Fails jaggedness, conflates speed/knowledge.  
  - Universal problem-solving (e.g., Legg & Hutter): Handles novelty but ignores jaggedness.  
  - Biological: Circular (validates against humans), fails collections.  
  - Adaptive efficiency (e.g., cognitive science): Best fit—prioritizes resourcefulness, allows profiles.  

  User’s suspicions:  
  - Jaggedness vs. "smarter" conflict: Confirmed.  
  - "Same problem" redundant: Confirmed.  
  - Damaged hardware sentimental: Partly—useful for robustness but not unique.  

  Bottom line: Their quest for a non-circular, practical definition is valid, but "smarter than us" must be reframed as domain-specific to avoid contradictions.
answer: |-
  **Bottom line: Your requirement for an account to "tell you when you're wrong" (falsifiability) is non-negotiable and excludes most popular definitions, forcing a focus on *how* systems generate solutions, not just outcomes.**  

  ### Sorting Your Requirements  
  **Genuine Desiderata** (refined for your purpose):  
  1. **Separate intelligence from stored knowledge**: *Requirement*: Must distinguish systems that *compute* answers from those that *retrieve* them, even with identical outputs. (Core to chatbot dispute.)  
  2. **Separate intelligence from speed/resources (fixed-budget rule)**: *Refined*: Comparisons require identical computational budgets (time/memory/hardware). *Workability*: Functional for like systems (e.g., two AIs), but undefined across types (e.g., human vs. AI)—acknowledge this limit.  
  3. **Handle jaggedness**: *Requirement*: Intelligence is a *profile* (strengths in domains), not a single scalar. "Smarter than us" must specify domains (e.g., "smarter at chess"). (Resolves chatbot/savant cases.)  
  4. **Handle collections**: *Requirement*: Intelligence can be *emergent* in systems where no individual component is intelligent (e.g., ant colonies). Distinguish collective intelligence from individual. (Critical for your "1000 reasoners" case.)  
  5. **Falsifiability**: *Refined*: The account must allow counterexamples to common intuitions (e.g., proving a spreadsheet or dog is intelligent/non-intelligent despite preconceptions). Non-negotiable for settling disputes.  
  6. **Distinguish intelligence from conflated concepts**: *Refined*: Must explicitly contrast intelligence (adaptive problem-solving) with knowledge, wisdom, speed, etc.  

  **Droppable/Redundant**:  
  - **"Same problem" requirement**: Redundant with "stored knowledge." If a system fails structurally identical problems due to surface changes, it lacks abstraction—covered by separating knowledge from computation. Delete.  
  - **Damaged/unusual hardware**: *Sentimental*: Cases like savants or broken output channels are subsumed by jaggedness and falsifiability. Adds no unique constraint.  

  **Specialist Additions**:  
  7. **Adaptability to novelty**: *Requirement*: Must handle *unseen* problems, not just variations of training data. *Case*: Chatbots failing at truly novel puzzles humans solve. (From cognitive science.)  
  8. **Resourcefulness/efficiency**: *Requirement*: Maximizing performance under constraints (e.g., finding shortcuts). *Case*: Brute-force vs. elegant math proofs. (From AI efficiency theories.)  

  ### Conflicts and Trade-offs  
  - **Irreconcilable Trio**: Falsifiability + Jaggedness + Single-Ordering ("smarter than us"). Falsifiability demands testable criteria; jaggedness denies a universal scalar; "smarter than us" implies scalar ranking. **Resolution**: Drop "smarter than us" as a global claim—treat it as domain-specific.  
  - **Biggest Excluder**: **Falsifiability** invalidates accounts that define intelligence circularly (e.g., "whatever humans do well").  

  ### Scoring Standard Accounts (for your disputes)  
  - **Psychometric (e.g., IQ/g-factor)**: Fails falsifiability (validated against humans), jaggedness, and knowledge separation. *Score: 2/10*.  
  - **Universal Problem-Solving (e.g., Legg & Hutter's "AIXI")**: Passes knowledge separation and adaptability but fails jaggedness/collections. *Score: 6/10*.  
  - **Biological/Neural**: Falsifiable (e.g., brain scans) but fails collections, conflates intelligence with wetware. *Score: 4/10*.  
  - **Adaptive Efficiency (e.g., cognitive architectures like ACT-R)**: Best fit—handles jaggedness, resources, and adaptability, but weak on emergent collections. *Score: 8/10*.  

  ### Final Non-Negotiables  
  Keep: Falsifiability, Knowledge separation, Jaggedness, Collections.  
  Drop: "Same problem," Damaged hardware, Global "smarter than us."
