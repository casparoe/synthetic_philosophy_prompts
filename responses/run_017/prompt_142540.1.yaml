  Now, the two or three lines on the two families:

  The generalist view struggles with NOD and ADJ because it dismisses conspiracy theories a priori, ignoring that some are true and that institutions can be complicit. The particularist view handles NOD and SCA well but may falter on ESC and ADJ by not providing special tools for conspiracy theories and by relying on institutions that are challenged. ADJ is the requirement that most strains both, but particularly excludes generalist accounts that rely on institutional consensus.

