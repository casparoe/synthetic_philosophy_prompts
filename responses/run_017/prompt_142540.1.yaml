  We are constructing a table of desiderata for an account that helps non-specialists evaluate conspiracy theories (or any live claim) in real-time, without knowing the outcome. The account should guide decisions about investigation, assertion, or dismissal.

  The table will have three columns:
  1. Requirement: a short label and a description.
  2. Motivation: the phenomenon or case that motivates the requirement.
  3. Negotiability: whether it is non-negotiable or a preference of one camp.

  We also have six phenomena to address (as listed). We must also include the user's wrinkle about evaluating the proposition vs. the inquiry.

  After the table, we will:
  - Flag any subset of requirements that might be jointly unsatisfiable.
  - Provide a brief (2-3 line) comparison of the two broad families: generalist (conspiracy theories as such are defective) and particularist (assess each on its evidence).
  - Identify which single requirement excludes the most otherwise-attractive accounts.

  Finally, we end with the exact line: \answer{most exclusionary: <short label> | unsatisfiable: <short label> + <short label>}

  Let's break down the requirements:

  1. **Non-outcome-dependent (NOD)**: The account must not rely on outcomes that were not available at the time of judgment. Motivated by real conspiracies that were later acknowledged (e.g., Watergate, Tuskegee syphilis experiment). Non-negotiable.

  2. **Handling escalation structure (ESC)**: The account must explain what is wrong with the escalation structure (where every denial or absence of evidence becomes confirmation) beyond just unfalsifiability. Motivated by the observation that some conspiracy theories become self-sealing. Non-negotiable? (But note: the user asks "when it is not wrong", so we must allow for cases where it might be appropriate.)

  3. **Scale sensitivity (SCA)**: The account must treat conspiracies of different scales (in terms of number of people and duration) differently. Motivated by the fact that larger and longer conspiracies should leave more traces. Non-negotiable.

  4. **Adjudication gap (ADJ)**: The account must provide a way to evaluate claims when the normal arbitrating institutions are alleged to be complicit. Motivated by the fact that conspiracy theories often reject mainstream sources. Non-negotiable? (But note: the user says "if not a general suspicion of everything", so we need a positive method.)

  5. **Evidence authentication (AUTH)**: The account must address the problem of planted or fabricated evidence and distinguish genuine leaks from forgeries. Motivated by the ease of forgery in the digital age. Non-negotiable? (But note: the user says what it costs to concede that it sometimes cannot be told.)

  6. **Proposition vs. Inquiry (PvI)**: The account must clarify whether it is evaluating the truth of the proposition or the health of the inquiry (the community and process that circulates the claim). Motivated by the user's wrinkle: a true claim might be supported by a community that degrades accuracy, and vice versa. Non-negotiable? (The user wants this taken seriously.)

  Additionally, we might include:

  7. **Actionability (ACT)**: The account should provide clear guidance for the non-specialist on whether to investigate, assert, or dismiss. This is inherent in the purpose. Non-negotiable.

  But note: the purpose is fixed: a standard for non-specialists to apply in real-time.

  Now, let's build the table:

  | Requirement (Label) | Description | Motivation | Negotiability |
  |---------------------|-------------|------------|--------------|
  | Non-outcome-dependent (NOD) | The account must not build unwarrantedness into the definition and must not grade past judgments by outcomes unavailable at the time. | Real conspiracies (e.g., Watergate) were dismissed initially but later proven true. Thus, we cannot define conspiracy theories as necessarily false or unwarranted. | Non-negotiable |
  | Escalation structure (ESC) | The account must explain the defect in theories that convert every denial, retraction, or absence of evidence into further confirmation, beyond the charge of unfalsifiability. Also, it must specify when such a structure might be reasonable (if ever). | The self-sealing nature of some conspiracy theories makes them resistant to counter-evidence. However, in some cases (e.g., when there is strong evidence of cover-up) it may be rational. | Non-negotiable |
  | Scale sensitivity (SCA) | The account must treat conspiracies differently based on scale (number of conspirators and duration), because larger and longer conspiracies should leave more traces and be harder to maintain. | A plot involving three people over a month leaves fewer traces than one involving hundreds over a decade. | Non-negotiable |
  | Adjudication gap (ADJ) | The account must provide a method for evaluating claims when the normal arbitrating institutions (experts, officials) are alleged to be complicit, without falling into general suspicion. | The claim that institutions are complicit precludes deferring to expert consensus or official testimony. | Non-negotiable |
  | Evidence authentication (AUTH) | The account must address the problem of forged evidence and provide criteria to distinguish genuine leaks from plants. It must also clarify the epistemic cost when such distinction is impossible. | Forged documents and recordings are cheap to produce and can be very convincing (e.g., deepfakes). A smoking gun is no longer decisive. | Non-negotiable |
  | Proposition vs. Inquiry (PvI) | The account must specify whether it evaluates the proposition (truth) or the inquiry (the community and process). It must address how they interact and what to do when they come apart (e.g., a true proposition supported by an unhealthy inquiry, or a false one supported by a healthy inquiry). | A community might promote true claims in a way that degrades long-run accuracy (e.g., by encouraging gullibility), or false claims in a way that improves accuracy (e.g., by rigorous self-correction). | Non-negotiable |
  | Actionability (ACT) | The account must provide clear, practical guidance for non-specialists (e.g., editors, citizens) on whether to investigate, assert, or dismiss a claim. | The purpose of the account is to be a standard that non-specialists can apply in real-time. | Non-negotiable |

  Now, which requirements might be jointly unsatisfiable?

  - **ADJ and ACT**: Providing a method to bridge the adjudication gap that is both reliable and actionable for non-specialists might be extremely difficult. If the normal institutions are off-limits, what can the non-specialist use? They might have to rely on alternative methods (e.g., looking for internal consistency, checking for independent corroboration) but these might be insufficient and lead to either gullibility or excessive skepticism.

  - **AUTH and ACT**: Distinguishing genuine from fabricated evidence often requires technical expertise that non-specialists lack. The account must either provide simple heuristics (which might be unreliable) or concede that sometimes it cannot be done (which might leave the non-specialist without guidance).

  - **PvI and ACT**: The account must not only evaluate the proposition or the inquiry but also guide action. If the proposition is true but the inquiry is unhealthy, what should the non-specialist do? The account must balance these.

  But note: the user wants to flag any subset that cannot be jointly satisfied. I suspect that the most tension is between ADJ and ACT because the adjudication gap requires a replacement for institutional arbitration, but non-specialists may not have the resources to do so effectively.

  Now, comparing the two broad families:

  - **Generalist view**: Conspiracy theories as such carry a prima facie epistemic defect. This view might satisfy NOD by not relying on outcomes, but it struggles with SCA (because it treats all conspiracies alike) and ADJ (because it dismisses claims that bypass institutions). It might also run afoul of the real conspiracies (NOD) if it defines conspiracy theories as necessarily unwarranted.

  - **Particularist view**: Each conspiracy theory should be assessed on its evidence, like any other claim. This view satisfies SCA and ADJ (by examining the specifics) but may struggle with ESC (if it doesn't recognize the special challenges of conspiracy theories) and AUTH (if it doesn't account for the ease of forgery). It might also have trouble with PvI because it focuses on the proposition and not the inquiry.

  The most exclusionary requirement? I think **ADJ (Adjudication gap)** excludes the most otherwise-attractive accounts. Why? Because many accounts (especially particularist ones) rely on evidence that is vetted by institutions, and when those institutions are challenged, they have no fallback. Generalist accounts might dismiss the claim because it's a conspiracy theory, but that violates NOD. So ADJ forces a radical rethinking.

  Jointly unsatisfiable? I think **ADJ and ACT** might be the most challenging pair. It's hard to provide a method that non-specialists can use to arbitrate when the normal arbiters are suspect, and do so in a way that is reliable and actionable.

  But note: the user says "flag any subset", so we can choose one pair. Also, the answer format only allows two in the unsatisfiable part.

  Alternatively, **AUTH and ACT** might also be unsatisfiable because non-specialists cannot reliably authenticate evidence.

  But let me reconsider: the user says "what it costs the account to concede that it sometimes cannot be told". So the account can concede that sometimes we cannot distinguish, but then what? The non-specialist might be left without guidance. That might make ACT hard to achieve.

  However, the adjudication gap (ADJ) is more fundamental because it challenges the entire epistemic framework.

  I'll go with:

  Most exclusionary: ADJ (Adjudication gap)

  Unsatisfiable: ADJ (Adjudication gap) + ACT (Actionability)

