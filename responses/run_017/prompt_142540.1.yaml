answer: |-
  Below is a table of desiderata for an account that enables non-specialists (e.g., editors or citizens) to evaluate live conspiracy claims in real-time, prior to known outcomes, for decisions about investigation, assertion, or dismissal. The requirements are derived from the specified phenomena and the core purpose. Each requirement includes a short label (for reference), a description, the motivating case or datum, and its negotiability. Negotiability is classified as "non-negotiable" if essential to the account's purpose or "preference" if it reflects a camp-specific emphasis (e.g., generalist vs. particularist).

  ### Desiderata Table
  | Requirement (Label) | Description | Motivation | Negotiability |
  |---------------------|-------------|------------|--------------|
  | **Non-outcome-dependence (NOD)** | The account must not define conspiracy theories as inherently unwarranted or grade judgments based on outcomes unavailable at the time of evaluation. | Real conspiracies (e.g., Watergate or the Tuskegee experiment) were initially dismissed but later confirmed. Building unwarrantedness into the definition or relying on hindsight would render the account useless for real-time decisions. | Non-negotiable |
  | **Escalation structure diagnosis (ESC)** | The account must diagnose why the escalation structure (where denials/absences of evidence reinforce the theory) is epistemically defective—or when it is not—beyond unfalsifiability. It should specify conditions under which such structures are rational (e.g., strong prior evidence of cover-ups). | Theories like "crisis actor" claims convert counter-evidence (e.g., official denials) into confirmation, creating self-sealing loops. However, in cases like the early Pentagon Papers leak, escalation was reasonable due to proven deception patterns. | Non-negotiable |
  | **Scale sensitivity (SCA)** | The account must adjust expectations of evidence based on conspiracy scale (e.g., participants and duration), not treat "conspiracy" monolithically. | A 3-person, 1-month plot (e.g., a small embezzlement) leaves minimal traces vs. a decade-long, 1000-person plot (e.g., institutional corruption), which should leave abundant evidence. Ignoring scale leads to over/under-confidence in dismissal. | Non-negotiable |
  | **Adjudication gap resolution (ADJ)** | The account must provide a method to evaluate claims when normal arbiters (e.g., experts, officials) are alleged complicit, without defaulting to universal suspicion. It should offer positive criteria for trust. | Claims like "the FDA is suppressing drug X" reject institutional arbitration. Without a replacement (e.g., cross-verification via independent sources), non-specialists face paralysis or blanket distrust. | Non-negotiable |
  | **Evidence authentication (AUTH)** | The account must distinguish genuine from fabricated evidence (e.g., leaks) and clarify the epistemic cost when authentication is impossible (e.g., erring toward non-assertion). | Fabricated "proof" (e.g., forged emails in "Pizzagate") is cheap to produce; genuine leaks (e.g., Snowden documents) require consistency checks. A "smoking gun" alone cannot settle claims, risking misplaced certainty. | Non-negotiable |
  | **Proposition-inquiry distinction (PvI)** | The account must specify whether it evaluates the proposition (truth/support) or the inquiry (community/process), address their interaction, and guide decisions when they diverge (e.g., true claim from a degrading inquiry). | A true claim (e.g., NSA surveillance pre-Snowden) may circulate in communities that erode accuracy (e.g., via dogmatism), while false claims may arise from healthy inquiries (e.g., open-source investigations). Divergence demands separate verdicts. | Non-negotiable |
  | **Actionability (ACT)** | The account must deliver clear, practical guidance (investigate, assert, dismiss) for non-specialists under uncertainty, without requiring specialized skills or resources. | Editors/citizens face time-constrained decisions (e.g., running a story on election fraud claims). Without actionable output, the account fails its core purpose. | Non-negotiable |

  ### Joint Satisfiability and Family Comparison
  - **Potentially unsatisfiable subset**: ADJ (Adjudication gap resolution) and ACT (Actionability) may be jointly unsatisfiable. ADJ demands a replacement for institutional arbitration under allegations of complicity, but ACT requires simple, reliable guidance for non-specialists. Non-specialists often lack the expertise or resources to execute alternatives (e.g., forensic analysis of evidence chains), risking either unactionable complexity (failing ACT) or oversimplified heuristics vulnerable to bad actors (failing ADJ). This tension is a structural feature of the problem space, not a flaw in the exercise.
    
  - **Comparison of broad families**: 
    - The **generalist view** (conspiracy theories as prima facie defective) violates NOD by presuming unwarrantedness and struggles with ADJ due to its reliance on institutional consensus. It fares poorly on SCA and PvI by ignoring contextual nuances. 
    - The **particularist view** (assess each claim on evidence) respects NOD and SCA but falters on ADJ and AUTH when institutional evidence is tainted or authentication is infeasible for non-specialists. It often neglects ESC and PvI by not addressing communal inquiry dynamics. 
    
  - **Most exclusionary requirement**: ADJ (Adjudication gap resolution) excludes the most otherwise-attractive accounts. It forces generalist views to abandon their institutional deference and particularist views to devise non-standard evaluation methods, both of which strain simplicity and reliability. For instance, accounts emphasizing expert consensus (e.g., Sunstein's) fail ADJ, while those advocating evidence-only assessment (e.g., Clarke's) become unactionable under complicity claims.

  \answer{most exclusionary: ADJ | unsatisfiable: ADJ + ACT}
