  The concrete example of an AI revising its own objective is helpful. The feeling of authorship increases with each iteration, but the core initial programming remains the source. So for Strawson, no amount of self-shaping reaches the demanding threshold. The user also questions if responsibility could be scalar. The argument's force comes from the all-or-nothing desert sense, so a graded approach might avoid the regress but lose the moral weight of desert.

