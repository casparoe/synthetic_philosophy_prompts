answer: |-
  ### Grading & Feedback (Total: **9/20**)  
  **General Note:** Good grasp of core concepts, but significant errors in applying the Principal Principle to uncertainty about chances. Key issue: conflating known chances with uncertain estimates.  

  #### [1] State the Principle, Admissibility, and Example (4/6)  
  - **Principal Principle & Clause**: Correctly states PP as `C(A | ch(A) = x and E) = x` with admissibility. Admissibility definition ("bears on A only by way of chances") is *partially* correct but **incomplete** (–1). Admissibility requires that E does *not* contain information about *A's actual outcome* (e.g., future histories, direct outcome reports).  
  - **Why Clause is Needed**: Clear contradiction example (if E=A, C(A) = 1 ≠ 0.7) is **perfect** (+2).  
  - **Example of Inadmissible Info**: Outcome/crystal ball report is **correct** (+1).  
  - **Irrelevant Tangent**: Chance timelessness ("chances don’t change") is **incorrect and off-topic** (–2). Chances *are* time-relative (e.g., `ch_t(A)` at time *t*). The subscript *cannot* be dropped casually.  

  #### [2] Coin Toss Scenario (3/9)  
  - **Initial Credence**: Claiming credence should be 0.9 is **fatally wrong** (–5). PP *requires known chance*. Here, chance is *unknown*; you have *evidence about* chances (60% credence ch=0.9, 40% ch=0.3). Correct credence = **expected chance**: (0.6 × 0.9) + (0.4 × 0.3) = **0.66**. PP does *not* apply directly when chance is uncertain.  
  - **Update After Testimony**: Credence → 1 is **correct** (+1).  
  - **Conflict with PP?**: Correct that testimony is inadmissible and PP doesn’t constrain this update (+1). Reasoning about conditionalization is **sound** (+1).  
  - **Critical Miss**: Fails to compute expected chance, misapplying PP to a weighted belief state.  

  #### [3] Expected Chance Principle (2/5)  
  - **PP as Mind-Change Rule**: Calling PP a rule for "changing your mind" when learning chances is **correct** (+1).  
  - **Is PP a Special Case of ECP?**: Claiming "no" is **incorrect** (–2). ECP *is* derived from PP: `C(A) = Σ [C(ch(A)=x) × x]` follows from PP + probability axioms. PP *is* a special case when `C(ch(A)=x)=1`.  
  - **Weaker Rule?**: Correct that ECP is weaker (+1), but incorrect to say they’re "unconnected" (–1).  
  - **Degenerate Situation**: ECP as fallback for "no evidence" is **partially right** but oversimplified; ECP applies broadly even *with* evidence.  

  ### Marginal Comments (For Direct Copy-Paste)  
  **[1]**  
  - (−1) Admissibility definition needs precision: E is inadmissible if it *directly reveals information about A's outcome* (not just "bears on A only by chances").  
  - (−2) Avoid irrelevancies: Chance timelessness is false (chances evolve) and distracts from the question.  
  - (+3) Strong example of inadmissible info and contradiction without the clause.  

  **[2]**  
  - (−5) Critical error: PP requires *known chance*. Here, chance is uncertain → credence must be *expected chance* (0.6×0.9 + 0.4×0.3 = 0.66). PP doesn’t say "defer to your best guess."  
  - (+3) Correct update to 1 after testimony + valid admissibility/conditionalization reasoning.  

  **[3]**  
  - (+1) Right about PP as a "mind-change" rule.  
  - (−3) PP *is* a special case of ECP: When you know ch(A)=x, ECP reduces to PP. ECP is derived from PP (via law of total probability).  
  - (+1) Correct that ECP is weaker/more general.  

  **Overall**: Focus on distinguishing cases where chance is *known* (PP applies directly) vs. *uncertain* (use ECP). Key insight: PP constrains credence when chance is known; ECP handles uncertainty. Revisit how admissibility shields PP from future-outcome information.
