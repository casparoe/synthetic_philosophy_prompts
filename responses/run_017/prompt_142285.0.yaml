prompt: |-
  My friend Nadia is writing a thesis on Du Bois view that all art is propaganda — her line is that on his account every work of art is propaganda, so the only real questions left are whose side it works for and whether it actually works. In our reading group she's been handing down verdicts on cases (some real, some invented), and I've been writing them down:

  - a blunt NAACP anti-lynching poster, made explicitly to change minds, which did help move a legislature: propaganda, and the good kind
  - a 1920s romance novel by a Black author with no politics in it at all, written for money and for fun: propaganda, and the good kind — making Black people ordinary to their readers does more than a speech does
  - a beautiful novel about Black life that ends up reenacting the tragic mulatto plot: propaganda, but for the other side, so it fails
  - a two hour protest play that lectures the audience and changes nobody's mind: not what he's after at all
  - an unsigned abstract quilt with no representational content: propaganda, and the good kind — beauty made by us is itself an argument

  New case, and I definately can't call it: a young artist builds an installation around what she presents as her great-grandmother's diaries from a Georgia prison farm. White legislators who saw it credited it with changing their minds, and a memorial got funded. Then it came out that the real diaries were three pages of grocery lists and she wrote the rest herself, filling in from other people's histories. Everyone agrees the thing worked. Nobody agrees whether that settles it, or whether the fact that its power came from a fabrication disqualifies it.

  Give me exactly five numbered items, one or two sentences each, no intro and no wrap-up at the end:

  1. your best guess at Nadia's verdict on the installation, with your reason in the same breath
  2. the single rule that best fits all five of her earlier verdicts taken together
  3. the strongest rival rule that fits those verdicts just as well, and what it predicts about this case
  4. the specific thing in her record that can't tell those two rules apart
  5. the one further case you'd put to her to settle it, and why that one
reasoning: |-
  Hmm, the user is asking me to analyze Nadia's approach to art as propaganda based on Du Bois' views. They've shared several examples of Nadia's verdicts on different artworks and want me to address a new case about an installation with fabricated diaries.

  Let me understand the key points from the examples Nadia has already judged:

  - The explicit anti-lynching poster was good propaganda
  - The apolitical romance novel by a Black author was good propaganda for making Black people seem ordinary
  - The tragic mulatto novel was bad propaganda for reinforcing stereotypes
  - The ineffective protest play wasn't propaganda at all
  - The abstract quilt was good propaganda as "beauty made by us"

  For the new case about the fabricated prison farm diaries installation - it worked to influence legislators but was based on fiction. The user wants me to respond with exactly five numbered items as requested.

  For item 1, I think Nadia would call it good propaganda despite the fabrication. Her judgments focus on effectiveness and whose side it serves, not necessarily truthfulness. The quilt example shows she values "beauty made by us" regardless of representational content.

  For item 2, the unifying rule seems to be: "Art is propaganda if it effectively advances or undermines racial justice, regardless of intent or form." This fits all cases - the quilt advances through beauty, the romance through normalization, the poster through direct appeal.

  For item 3, a rival rule could be: "Art is propaganda only if it authentically represents marginalized experiences." This would predict the installation is bad propaganda due to fabrication.

  For item 4, the romance novel can't distinguish these rules. Both interpretations work - it either advances justice through normalization or it's authentic representation.

  For item 5, I'd propose a case of a white artist making effective pro-justice art with disclaimers about their positionality. This would test whether authenticity requires identity or if effect alone matters.
answer: |-
  1. Nadia would likely deem it good propaganda: its effectiveness in advancing racial justice (securing the memorial) and centering Black experience outweigh the fabrication, aligning with her focus on impact and "whose side it works for".
  2. Propaganda is defined by its effective social impact on racial justice, irrespective of the artist's intent, explicit politics, or medium (beauty alone can qualify).
  3. Rival rule: Propaganda requires authentic representation of marginalized voices to be "good"; it predicts the installation is bad propaganda due to fabricated testimony undermining its legitimacy.
  4. The 1920s romance novel can't distinguish them: both rules see it as good (impact via normalization vs. authentic Black authorship/content), but disagree on *why*.
  5. Present a white artist's fictional but scrupulously researched slave narrative that effectively mobilizes white allies: it tests if impact alone suffices or if authenticity of voice is essential for "good" propaganda.
