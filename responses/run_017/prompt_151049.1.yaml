prompt: |-
  I write about science and ideas for a national newspaper, and our standards desk has asked me to run a forty-five-minute session for the newsroom before we decide whether to trial an automated fact-checking tool. The room will be about fourteen editors and reporters, none of whom has taken a probability course; two are reflexively hostile to anything with numbers in it; and our standards editor reads enough statistics to catch me if I hand-wave. I have a whiteboard and nothing else.

  The occasion is a vendor pitch. The tool queries the same underlying language model five times under five different prompt framings, treats the five answers as a panel of "jurors," and returns the majority verdict. The deck claims the arrangement is licensed by Condorcet's jury theorem and closes with a slide about the wisdom of crowds. I think the pitch is wrong in a way that is worth teaching rather than just asserting, and I would like a plan for how to teach it — not the explanation written out for me.

  What I need is the sequence and the reason for it: which idea has to be in place before the next one means anything, and why. My instinct is that per-juror competence above chance has to come before the asymptotic result, and that the independence condition has to be stated as independence conditional on the truth rather than as "they don't talk to each other" — but tell me where I have the order wrong.

  I also want one concrete case to carry the whole session, and I want you to say what such a case must have and what it must lack. My candidate is a photograph that arrives with a claim about where and when it was taken — a binary question with a fact of the matter. I take it the example needs genuine ground truth and genuinely separate private signals, and must not be the kind of editorial judgment (is this story worth the space, is this headline fair) where there is no correct answer for the theorem to track.

  Here are the misconceptions I expect, in rough order of how loudly they will be voiced: that the theorem shows more heads are always better, when below-chance competence inverts it; that 51% accuracy plus enough jurors gets you anywhere soon; that our five model calls are five jurors; and that this has something to do with Condorcet's paradox about cycling majorities, which a couple of people will have half-remembered. Tell me which of these I am missing, which one is actually the load-bearing error, and at exactly what point in the sequence each should be headed off — including the place where the vendor's slide should collapse.

  The idea I most want placed well is this: each juror's signal can be treated as part private and part drawn from a common source, and as the common share grows the effective number of independent jurors falls toward one no matter how many heads you count. I want the plan to say where that decomposition goes, what it does to the five-calls-from-one-model picture, and how to convey it without a formula on the board. It should also note, in passing, that when competence varies the sensible weight is roughly the log-odds of each juror's accuracy, so five equally weighted samples from one model are misweighted twice over — and that if the tool ever reports confidence scores rather than verdicts, majority voting is the wrong aggregator regardless.

  Give me one question to end on that tells me whether the idea landed rather than whether they enjoyed the session — something like handing them a variant case and asking what the theorem does and does not say about it.

  Finally, tell me what to refuse to explain at this level and say so out loud: I assume the asymptotic argument itself, and I suspect the base-rate arithmetic (a checker that is right 90% of the time on a stream where only a small share of items are false will still mostly cry wolf) deserves its own session and should be named and declined rather than squeezed in.
reasoning: |-
  We are going to design a 45-minute session to critically evaluate a vendor's automated fact-checking tool that uses a language model called five times and takes a majority vote, claiming inspiration from Condorcet's Jury Theorem (CJT). The audience is journalists and editors with minimal math background, two of whom are math-averse, and a standards editor who can catch oversimplifications.

  The key misconceptions to address (in order of expected appearance):
  1. More jurors always improve accuracy (without considering competence level).
  2. 51% accuracy with enough jurors gets you high accuracy quickly (ignoring the slow convergence for near-chance competence).
  3. The five model calls are five independent jurors (when in fact they come from the same underlying model, so they are not independent).
  4. Confusion with Condorcet's paradox (about cyclic preferences) instead of the jury theorem.

  The core idea to convey: Each juror's signal has a "private" part and a "common" part (from the model's training data and architecture). If the common part dominates, then the five calls are not independent and the effective jury size is close to 1, regardless of the number of calls.

  We will use a concrete case: verifying a photograph's claimed location and time (binary ground truth: true or false). We assume that there is a fact of the matter and that the jurors (if independent) would have private signals.

  Sequence of the Session:

  1. (5 min) Introduce the concrete case and the problem: 
     - We have a photo with a claim (e.g., "Taken in Paris on June 1, 2024"). The fact-checking tool will query the same language model five times with slightly different prompts and take the majority vote of the five answers (each being "true" or "false").
     - The vendor says this is based on Condorcet's Jury Theorem (CJT), which is about the wisdom of independent crowds.

  2. (10 min) Explain CJT in simple terms (without math):
     - Start with the ideal case: a jury of independent jurors, each with the same competence (p), meaning each has a probability p > 0.5 of being correct.
     - The theorem says: (a) The majority vote is more likely to be correct than any single juror. (b) As we add more jurors, the probability that the majority is correct increases and approaches 1 (certainty) as the jury size goes to infinity.
     - Use a simple example: 3 jurors, each with p=0.6. Calculate by hand the probability that at least two are correct (0.6*0.6*0.4*3 + 0.6^3 = 0.432 + 0.216 = 0.648). Compare to one juror (0.6) to show improvement.

  3. (5 min) Address the first two misconceptions:
     - What if p < 0.5? Then the majority is more likely to be wrong! (Example: p=0.4, then the majority vote with 3 jurors: 0.4^3 + 3*0.4^2*0.6 = 0.064 + 0.288 = 0.352, which is worse than 0.4? Actually, 0.352 is the chance of being correct? No, with p=0.4, the chance of being correct is 0.4, so the majority vote being correct is the chance of at least two correct? But note: if p<0.5, then the majority vote is more likely to be wrong and converges to 0 as the jury size increases. So we must have p>0.5 for the theorem to help.)
     - What if p=0.51? Then we need a very large jury to get high confidence. For example, to get 99% confidence, we need about 10,000 jurors (but we won't calculate, just note it's huge). So 5 jurors at 51% is barely better than one.

  4. (15 min) The critical issue: Independence and the common source.
     - The vendor's tool uses the same model five times. Are these five calls independent? 
     - Explain that independence means: given the true state (say, the claim is false), the probability that juror 1 is correct does not change when we know juror 2's answer. But if the model has a systematic error (e.g., it was trained on data that consistently mislabels Paris photos), then when it's wrong, it's wrong in the same way every time. So the five calls are not independent.
     - Introduce the idea of decomposition: each answer is based partly on the model's common knowledge (which is fixed and shared) and partly on randomness in the prompt (the private signal). But if the common part is very large, then the five answers are almost the same. In the extreme, if the model always gives the same answer no matter the prompt, then five calls are just one juror. So the effective jury size is 1.
     - Use an analogy: It's like having one expert and asking them the same question five times, but they always give the same answer because they are consistent. Then you don't get the benefit of multiple independent experts. You are just replicating the same opinion.
     - Therefore, the vendor's claim that five model calls form a jury of five is wrong because they are not independent. They are five expressions of one model's fixed view.

  5. (5 min) Address the Condorcet paradox confusion:
     - Briefly note that Condorcet also has a paradox about voting cycles in ranked preferences, but that is a different concept. The jury theorem is about binary decisions with independent jurors.

  6. (5 min) Other issues (briefly):
     - Weighting: If jurors have different competences, the optimal vote is weighted by log-odds (but we won't go into details). However, in this tool, we have five identical samples from one model, so they are equally weighted but also equally (un)reliable. Moreover, if the model outputs a confidence score (e.g., 80% sure), then taking a majority vote of the verdicts (true/false) is inefficient. We should instead average the confidences (or use log-odds) to get a better aggregate. But the tool doesn't do that.

  7. (5 min) Conclusion and the big picture:
     - The tool's method does not satisfy the independence condition of CJT because the five calls are from the same model. Therefore, the theorem does not apply. The "wisdom of crowds" requires independent and diverse opinions, but here we have one source.

  8. Final Question (to check understanding):
     - "Suppose we have a fact-checking tool that uses five different language models (each trained on different data and by different companies) and takes a majority vote. If each model is only 55% accurate and their errors are independent, what does the jury theorem tell us? And what if we later find that all five models were actually trained on the same dataset and have the same systematic error about a particular type of claim?"
     - We are looking for: 
          - First part: The theorem says the majority vote should be more accurate than one model and gets better with more models (but we only have five, so let's not overstate). 
          - Second part: If they are not independent (common training data causing the same error), then the theorem does not hold, and the majority vote might be no better (or even worse) than one model.

  What to refuse to explain:
     - The asymptotic convergence (we'll just state it without proof).
     - The base-rate issue (how prior probabilities affect the fact-checking when the rate of false claims is low) — we will note that this is important but requires a separate session on Bayes' theorem and base rates.
     - The log-odds weighting formula (we'll just mention that if we had different competences, we should weight by confidence, but without math).

  Structure Recap:
  1. Introduction: the tool and the concrete example (photo verification).
  2. Condorcet's Jury Theorem in simple terms: independent jurors with p>0.5.
  3. Misconceptions: p must be above 0.5, and near 0.5 requires huge juries.
  4. The independence condition and the common source problem: the five model calls are not independent because they come from the same model.
  5. The decomposition idea (without formulas): common source vs. private signal, leading to effective jury size.
  6. Addressing Condorcet paradox confusion.
  7. Brief note on weighting and confidence scores.
  8. Conclusion and final question.

  This sequence builds from the simple to the complex, addressing misconceptions as they naturally arise. The concrete case is carried throughout.
answer: |-
  ### Session Plan: Unpacking the Fact-Checking Tool’s Claims  
  *Total: 45 minutes*  
  **Concrete Case:** A photo with a binary claim (e.g., "Taken in Kyiv on 2023-07-12"). Ground truth exists (it was/wasn’t), and signals can be decomposed into *private* (unique to each juror) and *common* (shared) components.  

  ---

  #### **Sequence of Ideas & Timing**  
  1. **Set the Stage: The Tool’s Pitch (5 min)**  
     - **What:** Describe the tool: 5 prompts → 5 answers → majority vote. Vendor invokes Condorcet’s jury theorem (CJT) and "wisdom of crowds."  
     - **Why:** Start with shared context. Use the photo example to make it tangible.  
     - **Refuse upfront:** "We won’t cover base rates today (e.g., how often photos are fake)—that’s Bayes’ territory and needs its own session."  

  2. **Introduce CJT in Its Simplest Form (10 min)**  
     - **What:**  
       - CJT: Independent jurors, each with competence *p* > 0.5.  
       - Majority vote beats one juror. Adding jurors → accuracy → 1.  
     - **Whiteboard:** Draw 3 jurors (e.g., *p* = 0.6). Calculate majority accuracy (≈65% vs. 60% for one).  
     - **Why now:** Establishes the theorem’s *best-case scenario*. Preempts "more heads always better" by showing *p* > 0.5 is non-negotiable.  
     - **Head off:** "If *p* < 0.5, CJT inverts—majority is *worse* than one juror! Crowds aren’t wise if biased toward error."  

  3. **The 51% Trap: Why "Enough Jurors" Is Misleading (5 min)**  
     - **What:**  
       - With *p* = 0.51, show how slowly accuracy improves.  
       - Example: 5 jurors → 53% accuracy; 101 jurors → 58% (no whiteboard math—use an analogy: "Like a coin barely weighted toward truth").  
     - **Why now:** Exposes the vendor’s "five jurors are enough" as hand-wavey. Load-bearing error: **Near-chance competence breaks the tool’s promise**.  
     - **Head off:** "The vendor’s slide implies 5 jurors solve everything—but CJT needs *p* >> 0.5 *or* huge juries."  

  4. **The Independence Myth: Conditional on Truth (12 min)**  
     - **What:**  
       - Independence ≠ "no chat." It means: *Given the truth*, juror A’s signal doesn’t predict juror B’s.  
       - Use the photo: If the model has a bias (e.g., misattributes Eastern European cities), all 5 calls may replicate that bias.  
     - **Decomposition (Key Idea):**  
       - Juror signal = *Private* (e.g., noise in prompt) + *Common* (e.g., model’s training data).  
       - **Whiteboard:** Draw a shared "cloud" (common source) feeding into 5 jurors. As common share ↗, effective jurors ↘ → 1.  
       - **Analogy:** "Asking one person the same question 5 times in different fonts isn’t 5 jurors—it’s one juror with 5 aliases."  
     - **Why now:** After establishing CJT’s assumptions, show why the tool violates independence. **This collapses the vendor’s pitch.**  
     - **Head off:** "The tool’s ‘five jurors’ are five samples from one model—not independent signals."  

  5. **Weighting and Confidence Scores (3 min)**  
     - **What:**  
       - "If jurors have different *p*, CJT says weight by log-odds of accuracy. The tool weights equally—bad if competence varies."  
       - "If the model outputs confidence scores (e.g., ‘80% sure’), majority voting discards information—averaging probabilities is better."  
     - **Why now:** Shows even *if* independent, the tool’s design is suboptimal.  

  6. **Condorcet’s Paradox vs. Jury Theorem (2 min)**  
     - **What:** "Some recall Condorcet’s *paradox* (voting cycles). That’s irrelevant here. CJT is about binary truths with independent jurors."  
     - **Why now:** Preempts off-track questions. Place after independence to contrast.  

  7. **Final Question: Test Understanding (3 min)**  
     - **Pose:** *"We use five* independent *experts (p=0.7 each) for the photo. CJT says majority vote is better than one—true. Now, we discover all experts read the same wrong tweet before judging. Does CJT still apply? Why?"*  
     - **Look for:** "No—common knowledge breaks independence. Effective jurors drop to 1." (This tests grasp of decomposition.)  

  ---

  #### **What the Case Must Have/Lack**  
  - **Must have:**  
    - Binary ground truth (photo location true/false).  
    - Clear "signal" analogy (e.g., jurors see evidence corrupted by noise + bias).  
  - **Must lack:**  
    - Subjective judgments (no "is this headline fair?").  
    - Complex statistics (no formulas).  

  #### **Missed Misconceptions to Address**  
  - **"CJT means diversity helps":** True, but emphasize diversity only matters if it enables *conditional independence*. Tackle during decomposition.  
  - **"If the model is good, this is fine":** Yes, but the tool’s *structure* adds no value over one call if common error dominates. Stress in Step 4.  

  #### **What to Refuse to Explain**  
  - **Asymptotics:** "We won’t derive why accuracy → 1—it’s a calculus proof."  
  - **Base rates:** "We’re ignoring how error rates interact with claim prevalence—that’s a Bayesian pitfall for another day."  
  - **Log-odds math:** "The exact weighting formula is technical—just know equal weights are wrong if skills differ."  

  #### **Why This Sequence Works**  
  Builds from intuition (CJT’s promise) to fragility (p ≈ 0.5) to core flaw (independence). The photo case threads throughout. Decomposition is placed where independence is broken—making the vendor’s error visceral. Ending with a variant case (experts + common bias) checks if they see beyond "five is magic."  

  **Goal:** Leave them skeptical of the tool’s "five jurors" framing and alert to the role of hidden common errors in AI systems.
