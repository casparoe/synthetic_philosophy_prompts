prompt: |-
  I host a small political-theory podcast (I'm a PhD student, working on democratic theory) and next week's guest has just published a book-length defence of replacing elected legislatures with randomly selected ones: single non-renewable terms, stratified so the chamber matches the population on income, education and region, paired with hard lifetime term limits — six years total, ever — for the handful of elected offices she'd keep. I want 8 or 9 questions that go beyond letting her restate the case against elections.

  Give me at least one each on: the composition problem — she wants the chamber to be a statistical mirror of the public, but acceptance rates for these assemblies are low and the volunteers skew politically engaged, so the body is filtered rather than random, and it looks like she can't have both the fairness argument and the mirror argument; the exit option — if no one can build a career out of office, durable power sits with the permanant staff, the lobbyists who outlast each cohort, and the employers who hold your job for you during your year of service, i.e. careerism doesn't vanish, it relocates to whoever isn't term-limited; and agenda-setting, since that's where the real power is and her term limits rule out anyone building a mandate around it. Plus one on what evidence would make her drop the proposal — what result from the recent Irish and French citizens' assemblies she'd count as a failure of the idea rather than a badly run process.

  For each, add a follow-up keyed to the answer she's most likely to give, and make one of them close off her standard move of 'that's an objection to any institution, show me a better one'. Lead with the question I should open the episode with, and no preamble or commentary on why you picked them.
reasoning: |-
  Okay, the user is a PhD student in democratic theory hosting a political podcast. They need interview questions for a guest advocating randomly selected legislatures. The guest proposes replacing elected bodies with stratified, randomly chosen citizens serving single non-renewable terms, alongside strict term limits for elected officials. 

  The user wants 8-9 questions going beyond basic book promotion. They specifically request coverage of three pain points: composition (randomness vs. representation), exit options (power shifting to unelected actors), and agenda-setting (who controls priorities). They also want one question about falsifiability—what evidence would make the guest abandon the proposal. Each question needs a follow-up anticipating the guest's likely rebuttal.

  Hmm, the user's framing reveals sophisticated concerns. When they mention the "composition problem," they're highlighting a tension between descriptive representation (mirroring society) and self-selection bias (only certain types volunteer). This is crucial because the guest's legitimacy arguments rely on both randomness and representativeness. The "exit option" critique suggests they've thought about institutional memory—if politicians rotate rapidly, bureaucrats/lobbyists gain hidden power. And "agenda-setting" targets a core democratic dilemma: without elected representatives building mandates, who defines what issues matter?

  The user seems irritated by the guest's tendency to deflect criticism with "show me a better alternative." They explicitly want one question to block this move, indicating past debates where the guest avoided engaging with weaknesses. The falsifiability request is particularly sharp—it forces the guest to specify failure conditions for citizens' assemblies, moving beyond "bad execution" excuses.

  Right, structuring the response: First question should hook listeners while setting up the core paradox. Then drill into each technical problem (composition/exit/agenda) with layered follow-ups. Save the falsifibility question for later since it requires context. The composition follow-up needs data backing—maybe cite Ontario's 4% participation rate? For the exit problem, the follow-up should preempt the "all institutions have elites" dodge by demanding specific safeguards. The agenda-setting follow-up must challenge the "deliberative wave" metaphor if the guest uses it—how do disconnected assemblies build momentum?

  Ah, and the user hates preamble, so no explanations. Just raw Q&A. The "block deflection" question should come after the guest has used the move elsewhere, so position it mid-interview. Cite real cases (Ireland/France) in the falsifiability follow-up to make it concrete. Avoid academic jargon; this is for a podcast audience.
answer: |-
  Here are 8 focused questions with immediate follow-ups, structured as requested:

  1.  **(Opening Question) Your system rests heavily on the legitimacy gained from the chamber being a true statistical mirror of the public. But acceptance rates for invitations to citizens' assemblies are often very low and volunteers skew towards the politically engaged. Doesn't this create a fundamental tension: you can't simultaneously claim the *fairness* of pure random selection *and* the descriptive *representativeness* of a mirror if the resulting body is inevitably filtered?**  
      *Likely Follow-up:* If she argues incentives/outreach can fix it: "Given actual data (e.g., Ontario CA ~4% acceptance, skew towards educated/engaged), what specific, realistic acceptance rate and demographic parity would you need to see consistently in practice to consider the 'mirror' claim valid, acknowledging pure randomness is compromised?"

  2.  **You aim to eliminate political careerism with single, non-renewable terms and strict lifetime limits for elected posts. But doesn't durable power simply relocate? Permanent staff, long-serving lobbyists, and the employers guaranteeing jobs during service become the stable nodes wielding influence, while transient legislators lack the experience to counter them. Isn't this just displacing, not destroying, careerist incentives?**  
      *Likely Follow-up:* If she concedes staff/lobbyists gain power but calls it universal: "What *specific, unique* institutional safeguards would your model implement to counteract this *particular* amplification of unelected power compared to systems with experienced legislators?"

  3.  **Agenda-setting is where fundamental political power lies. With legislators serving only short, single terms and prohibited from building a mandate, who *does* control the legislative agenda in your model? How do you prevent unelected actors or fleeting majorities within the chamber itself from dominating what gets debated and voted on?**  
      *Likely Follow-up:* If she suggests citizen initiatives or an elected committee: "Wouldn't short-term legislators lack the institutional knowledge to effectively counter-agenda-set against a persistent bureaucracy or well-organized interests proposing initiatives, making reactive governance inevitable?"

  4.  **You cite recent citizens' assemblies as evidence. What specific, concrete outcome from an assembly like Ireland's (e.g., on abortion, biodiversity) or France's (climate) would you consider a clear *failure of the model itself* – not just poor execution – that would make you reconsider your proposal?**  
      *Likely Follow-up:* If she points to implementation failure or political blockage: "But if the assembly's work is consistently ignored or distorted by elected bodies – a common outcome – isn't that an indictment of the *feasibility* of integrating sortition into a system still partially reliant on elections, rather than just a 'process' flaw?"

  5.  **Stratification aims for descriptive representation on income, education, and region. But political behavior and policy preferences correlate more strongly with factors like partisanship, values, and worldview, which are harder to stratify for. Couldn't a chamber that *looks* representative on paper still harbor systematic biases in its *deliberative outputs* due to unstratified factors?**  
      *Likely Follow-up:* If she emphasizes deliberation overcoming bias: "Given evidence that group deliberation can sometimes amplify initial biases or majority views, what mechanism ensures perspectives tied to unstratified factors (like deep partisanship or ideology) aren't systematically marginalized in the stratified chamber's decisions?"

  6.  **Mandatory service is often dismissed as impractical. But without it, doesn't relying on volunteers fundamentally undermine the core 'fairness' justification of random selection, as it inherently privileges those willing and able to serve? How is this fairer than elections open to all who choose to run?**  
      *Likely Follow-up:* If she stresses incentives/high pay: "Even with high pay and support, doesn't self-selection based on *willingness* to engage in intense politics for a year inherently create a body distinct from the 'average' citizen who might refuse regardless, contradicting the passive fairness argument?"

  7.  **Critics argue your model sacrifices accountability. You counter that elections create perverse accountability. But without re-election prospects or party labels, what mechanism exists for the public to *collectively* express sustained approval or disapproval of the chamber's *overall* direction or outputs between selections?**  
      *Likely Follow-up:* If she points to elections for other offices or future assemblies: "If the public dislikes the assembly's work but has no direct way to sanction *it* or its members, and must wait for a new batch, isn't this a significant democratic deficit compared to the ability to 'throw the bums out'?"

  8.  **(Blocking the Deflection Move) When faced with problems like agenda control shifting to staff or lobbyists, you often respond 'that's true for any system, show me a better one.' But isn't this deflection? Your proposal *specifically creates* these vulnerabilities through radical term limits. What *distinctive, positive* features does your model possess that *actively mitigate* these universal risks *better* than systems incorporating experienced legislators?**  
      *Likely Follow-up:* If she lists features like no re-election incentive: "How do those features concretely outweigh the *amplified* risk of capture by permanent forces that your own design intensifies by ensuring *no one* in the legislature gains experience?"
