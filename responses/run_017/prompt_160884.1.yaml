answer: |-
  ### RFC-0013: Deprecation and Removal of the `qualia` Package  
  **Status:** Proposed  
  **Author:** Devin "Smiles" O'Reilly (Platform Core Team)  
  **Created:** 2023-10-05  

  ---

  ### 📌 Motivation  
  The `qualia` package (v0.0.1-alpha, untouched since 2018) has been flagged for removal due to critical design flaws in its core API guarantees. Per its documentation, `qualia` promises four immutable properties:  

  1. **Ineffable**: Outputs cannot be described programmatically.  
  2. **Intrinsic**: States lack relational dependencies (no I/O, network, or env vars).  
  3. **Private**: All data is scoped to a single runtime with no serialization.  
  4. **Directly Apprehensible**: States are self-verifying with no intermediate logic.  

  These properties render the package **untestable, unmaintainable, and operationally inert**:  
  - 🐞 **No bug reports possible**: Violations of "ineffability" cannot be articulated in issues (e.g., `Error: Can't describe error`).  
  - 🧪 **No test coverage**: "Intrinsic" states ignore test harness inputs. All unit tests (`test_qualia.py`) are no-ops.  
  - 🔍 **No observability**: "Private" data cannot be logged, traced, or inspected.  
  - 🛠️ **No patches feasible**: "Direct apprehension" bypasses middleware, hooks, or validation.  

  The package has consumed 487 MB of unused dependencies (`phenomenology-utils`, `what-is-red`) and blocks monorepo linting (ESLint rule `no-unspeakable-properties`).  

  ---

  ### 🚫 Breaking Changes  
  None! A compatibility shim will replace the package, preserving all downstream interfaces.  

  ---

  ### ⚠️ Downstream Impact  
  The following consumers will migrate to the shim:  

  | Consumer                  | Shimmed Output                                                                 |  
  |---------------------------|--------------------------------------------------------------------------------|  
  | `philosophy/zombie_args`  | Returns `404: ConsciousnessNotImplemented` (matches legacy `qualia`'s no-op). |  
  | `neuro/mary_knowledge`    | Hardcodes `"RED"` in all outputs (previously relied on unreportable state).   |  
  | `vision/inverted_spectrum`| Replaced with deterministic hex-code comparisons (`#FF0000` vs. user input). |  
  | `ethics/suffering`        | Uses LLM sentiment scoring of pain reports (never accessed intrinsic state). |  
  | `dashboard/hard_problem`  | Displays "¯\\_(ツ)_/¯" (UI unchanged; always did this).                       |  

  No behavioral changes observed in staging.  

  ---

  ### 🛠️ Proposed Solution  
  #### 1. **Delete `qualia`** and its 27 submodules.  
  #### 2. **Implement `qualia-shim`**:  
  ```python  
  class QualiaShim:  
      def get_state(self, property: str) -> str:  
          # Legacy systems never used qualia's core; they used report interfaces.  
          return DiscriminationLayer.report(property)  # Existing report-and-discrimination util  

      def __getattr__(self, name):  
          return "UNDEFINED"  # Matches legacy's ineffable response  
  ```  
  #### 3. **Migrate Tests**:  
  - **Legacy snapshot suite** (`snapshots/test_qualia.snap`) regenerated silently since 2020. All 120 snapshots will be re-saved via `qualia-shim` (diff: 0%).  
  - **Inverted-spectrum tests** now validate against user-reported color labels (e.g., `assert user_input == "red"`).  

  ---

  ### 🤔 Alternatives Considered  
  - **Keep `qualia` with "deprecated" flag**: Rejected. Technical debt violates our "No Ghost Code" policy.  
  - **Rewrite core**: Impossible. Adhering to its API constraints requires deleting the package.  

  ---

  ### ✅ Closed Issues  
  - `#281` · `qualia-core` fails CI (no describable error)  
    **Resolution:** Tests removed. No runtime impact.  
  - `#312` · Cannot serialize `PrivateQualiaState` for debugging  
    **Resolution:** Wontfix. Property working as documented.  
  - `#449` · "`get_red()` returns different values across runs" (user: @RealistDev)  
    > *"Works on my machine! I know what my red looks like."*  
    **Resolution:** Cannot reproduce. No logs, traces, or reproducible inputs provided. Private runtime state is non-transferable per API. Closed.  

  ---

  ### 📅 Timeline  
  - **2023-10-12**: Shim merged, snapshot regeneration enabled.  
  - **2023-10-19**: Package removal.  

  Let’s tidy up! 🧹 ✨  
  *(Patch size: -487 MB, +3 KB shim)*
