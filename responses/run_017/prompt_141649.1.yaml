  We are designing a classroom simulation for the regress problem in epistemology. The goal is for students to experience the problem of infinite regress, circular reasoning, and foundational beliefs through an activity where they build chains of justification. The twist is that the transmission of justification will vary between rounds without the students being told, so they can discover that the viability of an infinite chain depends on the transmission rule.

  Constraints:
  - 50-minute session, 14 students aged 15-18, mixed confidence with numbers
  - Materials: index cards, pens, maybe a die
  - No prep, no homework
  - Avoid technical terms until the end
  - Focus on the transmission rule: in one round, justification weakens multiplicatively (compounding loss); in another, it adds a fixed increment (with a ceiling) so that long chains are acceptable.

  We need:
  1. Rules and a payoff scheme (no money, no real stakes)
  2. Minute-by-minute timeline
  3. Debrief mapping moments to positions and the transmission assumption
  4. What might go wrong and how to recover
  5. What the game cannot show (e.g., the starting points are given without justification)

  Brainstorming three mechanics:

  Mechanic 1: "Chain Strength" with Cards
  - Each student writes a claim on a card and then supports it by another card (from another student or themselves for circularity). Each support link has a transmission rule that either multiplies the strength (e.g., 80% of the previous) or adds a fixed amount (e.g., +10% up to 100%).
  - Why discard? This might be too abstract and the arithmetic (multiplication of fractions) could be challenging for some. Also, tracking the strength for each link in a chain might become messy.

  Mechanic 2: "Building Block" with Dice Rolls
  - Claims are supported by rolling a die. The die roll represents the strength of the support. In one round, the die roll is multiplied by a factor (e.g., 0.8) for each step away from the start. In another round, the die roll is added to a base (with a cap). 
  - Why discard? The randomness of the die might overshadow the structural issue of the chain. Also, it might be hard to control the transmission rule without revealing it.

  Mechanic 3: "Token Transfer"
  - Each claim has a "justification token" value. When a claim A supports claim B, B gets a token value that is a function of A's token value. In the multiplicative round: B = 0.8 * A. In the additive round: B = A + 0.1 (but capped at 1.0). The goal is to have the highest token value for your claim.
  - Why choose? This is simple and visual. We can use index cards and write the token value on them. The arithmetic is manageable with decimals (0.8, 0.64, etc.) or percentages. The transmission rule can be secretly changed by the facilitator.

  We choose Mechanic 3 (Token Transfer) because it directly shows the decay or accumulation and is easy to track on index cards.

