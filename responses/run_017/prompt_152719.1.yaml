prompt: |-
  I spent most of last night arguing with a friend about whether anyone has an account of how correctness itself — the fact that some moves in thought or argument count as right and others as wrong, that some considerations count in favour of a conclusion — got into a world of matter in motion. He thinks every account on offer cheats, and he has a compact vocabulary for saying why, picked up from Daniel Dennett's *Darwin's Dangerous Idea* (1995): 'skyhook', 'crane', and 'greedy reductionism'. As I understood him to be using them: a skyhook is an explainer that is itself unexplained, something that gets its purchase from above and so merely relabels the mystery; a crane is a mechanism that lifts from below, built out of the very materials it has to work with, so that nothing is left dangling; and greedy reductionism is the vice of trying to explain a phenomenon while skipping the cranes — going straight to the bottom and denying or ignoring the pattern that needed explaining in the first place.

  The argument kept stalling on three cases I invented to press him, and on one accusation he kept making.

  (a) *The borrowed crane.* Suppose correctness gets explained by a mechanical process — creatures or networks that update on feedback, retain what predicted well, discard what did not. The trouble is that I can only describe that process by saying it responds to *error*, retains what is *better*, tracks what is *correct*. The friend says: there, you helped yourself to the very thing you were explaining, so that is a skyhook. But it seemed to me that on that standard any crane whose parts have to be picked out by what they do would be disqualified, which would be absurd. Is there a principled line between a mechanism that presupposes the property it explains and one that merely gets described in the vocabulary of that property?

  (b) *The inherited crane.* Suppose a system exhibits correctness only because it was built, trained, or shaped by agents who already had it — a cultural practice, an institution, a model fitted to the output of reasoners. Relative to that system, the normativity arrives from above, unearned; relative to the history of the universe, it was produced by earlier cranes. He insisted skyhook-hood is not relative to a baseline. I could not see how that could be right.

  (c) *The stipulated floor.* Inside a simulation, the lowest-level rules look exactly like skyhooks: unexplained explainers, brute givens. From outside, they are ordinary cranes resting on the hardware. So it looked to me as though whether something is a skyhook depends on where one puts the floor of what needs no further explanation — which would make the slogan 'there are no skyhooks' either nearly trivial or nearly unfalsifiable, depending on where the floor is allowed to sit.

  Finally, whenever I tried to give a subpersonal, mechanism-level account, he accused me of greedy reductionism, and I could never tell whether he meant that my account was false, that it was true but not explanatory, that it skipped a level, or that it changed the subject.

  So: what I want is a disambiguation with verdicts. Please return a single JSON object and nothing else, with this schema.

  {
    "terms": [
      {
        "term": "<one of: 'skyhook', 'crane', 'greedy reductionism'>",
        "readings": [
          {
            "label": "<short name for the reading>",
            "precise_claim": "<one or two sentences, stated so that it could in principle be true or false>",
            "kind": "<one of: verbal stipulation | methodological rule | empirical claim | metaphysical claim | claim about what counts as an explanation>",
            "status": "<one of: trivial | substantive and defensible | contentious | false | incoherent>",
            "supports_my_friends_move": "<'yes' | 'no' | 'only if', followed by one clause saying why>",
            "what_would_have_to_be_shown": "<what someone defending this reading still owes us>"
          }
        ]
      }
    ],
    "cases": [
      {
        "case": "<one of: 'borrowed crane', 'inherited crane', 'stipulated floor'>",
        "skyhook_under": ["<labels of the readings under which it is a skyhook>"],
        "crane_under": ["<labels of the readings under which it is a legitimate crane>"],
        "verdict": "<one sentence, your own view>",
        "decisive_question": "<the one question that would settle it, if there is one; else null>"
      }
    ],
    "indexicality": {
      "is_skyhookhood_relative_to_a_baseline": "<'yes' | 'no' | 'yes for some readings only'>",
      "consequence_for_the_slogan": "<one or two sentences on whether 'there are no skyhooks' then becomes trivial, unfalsifiable, or still substantive>"
    },
    "bottom_line": "<at most 60 words: the single reading of 'skyhook' I should press my friend to commit to, and what it commits him to>"
  }

  Give every term at least three readings, ordered from the weakest to the strongest, and make sure the labels you use in the "cases" block match the labels in the "terms" block. If some reading of 'greedy reductionism' makes it a fault distinct from falsehood, say which one and why.
reasoning: |-
  We are given a complex request. We need to return a JSON object with the specified structure.

  The structure has:
  1. "terms": an array of three terms: 'skyhook', 'crane', and 'greedy reductionism'. For each term, we must provide at least three readings (ordered from weakest to strongest). Each reading has:
     - "label": a short name for the reading.
     - "precise_claim": one or two sentences that could be true or false.
     - "kind": one of: verbal stipulation | methodological rule | empirical claim | metaphysical claim | claim about what counts as an explanation.
     - "status": one of: trivial | substantive and defensible | contentious | false | incoherent.
     - "supports_my_friends_move": 'yes' | 'no' | 'only if' followed by a clause.
     - "what_would_have_to_be_shown": what is still owed by a defender of this reading.

  2. "cases": an array of three cases: 'borrowed crane', 'inherited crane', 'stipulated floor'. For each case:
     - "skyhook_under": an array of labels (from the readings) under which the case is a skyhook.
     - "crane_under": an array of labels under which it is a legitimate crane.
     - "verdict": one sentence, the assistant's own view.
     - "decisive_question": the one question that would settle it, or null.

  3. "indexicality": an object with:
     - "is_skyhookhood_relative_to_a_baseline": 'yes' | 'no' | 'yes for some readings only'
     - "consequence_for_the_slogan": one or two sentences on the status of 'there are no skyhooks'

  4. "bottom_line": at most 60 words: the reading of 'skyhook' to press the friend on, and what it commits him to.

  We must ensure that the labels used in the "cases" block match the labels in the "terms" block.

  Let's create the readings for each term.

  Term 1: 'skyhook'

  Reading 1 (weakest): 
    label: "Unexplained Explainer"
    precise_claim: A skyhook is an entity or principle that plays an explanatory role in an account but is itself left without any explanation within that account.
    kind: verbal stipulation (as per Dennett's definition)
    status: trivial (by definition, if we accept the stipulation)
    supports_my_friends_move: yes, because in the borrowed crane case, the friend accuses the account of having an unexplained explainer (the notion of error or correctness).
    what_would_have_to_be_shown: That the account indeed leaves the explainer unexplained and that this is a problem for the explanation.

  Reading 2:
    label: "Non-Natural Anchor"
    precise_claim: A skyhook is an explanatory posit that is non-natural (e.g., supernatural, non-physical, or abstract in a way that does not supervene on the physical) and hence cannot be integrated into a naturalistic causal story.
    kind: metaphysical claim
    status: contentious (depends on one's view of naturalism)
    supports_my_friends_move: only if the borrowed crane account is taken to rely on non-natural properties (which the friend might think the normative terms imply)
    what_would_have_to_be_shown: That normative properties are non-natural and that they are being invoked in the explanation without naturalistic reduction.

  Reading 3 (strongest):
    label: "Explanatory Circularity"
    precise_claim: A skyhook is an explanatory posit that is identical to the phenomenon being explained, so that the explanation is circular.
    kind: claim about what counts as an explanation
    status: substantive and defensible (if circular explanations are indeed vacuous)
    supports_my_friends_move: yes, because in the borrowed crane, the account uses normative terms to explain normativity, which might be circular.
    what_would_have_to_be_shown: That the use of the normative term in the explanation is not merely a description of the mechanism but a reintroduction of the very phenomenon in need of explanation.

  Term 2: 'crane'

  Reading 1 (weakest):
    label: "Stepwise Builder"
    precise_claim: A crane is a mechanism that is built from the bottom-up, using only the available materials and processes, and that allows for the construction of complex features without invoking unexplained higher-level capacities.
    kind: verbal stipulation (Dennett's definition)
    status: trivial
    supports_my_friends_move: no, because the friend is accusing the account of not being a crane (by his standards).
    what_would_have_to_be_shown: That the mechanism can indeed be built from the bottom up without invoking the target phenomenon.

  Reading 2:
    label: "Emergence Enabler"
    precise_claim: A crane is a process that, through cumulative steps, allows for the emergence of novel properties that are not present at the base level, without violating the base-level laws.
    kind: metaphysical claim
    status: substantive and defensible
    supports_my_friends_move: no, because the friend is challenging whether the account really enables emergence without cheating.
    what_would_have_to_be_shown: That the emergent property (normativity) is indeed novel and not merely a redescription of the base.

  Reading 3 (strongest):
    label: "Non-Circular Mechanism"
    precise_claim: A crane is an explanatory mechanism that does not presuppose the very property it is intended to explain, thereby avoiding circularity.
    kind: methodological rule
    status: substantive and defensible
    supports_my_friends_move: only if the mechanism does presuppose the property, which he claims in the borrowed crane.
    what_would_have_to_be_shown: That the mechanism can be specified without using the vocabulary of the target property.

  Term 3: 'greedy reductionism'

  Reading 1 (weakest):
    label: "Skipping Levels"
    precise_claim: Greedy reductionism is the mistake of trying to explain a phenomenon by jumping directly to the lowest level of explanation, thereby ignoring intermediate levels that are necessary for a full account.
    kind: methodological rule
    status: substantive and defensible
    supports_my_friends_move: yes, because he accuses the subpersonal account of skipping levels (e.g., ignoring the personal or intentional level).
    what_would_have_to_be_shown: That the intermediate level is indeed necessary and that the low-level account is insufficient.

  Reading 2:
    label: "Pattern Denial"
    precise_claim: Greedy reductionism is the vice of denying the reality of the pattern or phenomenon to be explained (e.g., by claiming it is an illusion) rather than showing how it arises from lower-level processes.
    kind: claim about what counts as an explanation
    status: substantive and defensible
    supports_my_friends_move: yes, if the subpersonal account is taken to deny the reality of normativity at its own level.
    what_would_have_to_be_shown: That the account does deny the pattern and that this denial is unwarranted.

  Reading 3 (strongest):
    label: "Loss of Explanatory Power"
    precise_claim: Greedy reductionism is an account that, by reducing to the lowest level, loses the vocabulary and concepts necessary to capture the phenomenon, thereby failing to explain it.
    kind: methodological rule
    status: contentious (because it depends on what counts as capturing the phenomenon)
    supports_my_friends_move: yes, because the friend might think that a subpersonal account loses the normative dimension.
    what_would_have_to_be_shown: That the reduced account cannot recapture the phenomenon in its full richness.

  Note: For greedy reductionism, we note that it is a fault distinct from falsehood because even if the low-level account is true, it might be methodologically flawed by being too simplistic or by changing the subject (as in Reading 3).

  Now, the cases:

  Case (a): 'borrowed crane'
    Scenario: A mechanical process that updates on feedback is described as responding to error, etc. The friend says it's a skyhook because it uses normative terms.

    We must list for which readings of skyhook this counts as a skyhook, and for which readings of crane it counts as a crane.

    Under skyhook:
      - Under "Unexplained Explainer": yes, because the account uses the notion of error without explaining it.
      - Under "Non-Natural Anchor": only if we think the normative terms are non-natural (but that's not necessarily the case in the scenario).
      - Under "Explanatory Circularity": yes, because it uses the normative term in the explanation.

    But note: we have to match the labels we created. We have three readings for skyhook: "Unexplained Explainer", "Non-Natural Anchor", "Explanatory Circularity". The borrowed crane is a skyhook under "Unexplained Explainer" and "Explanatory Circularity", but not necessarily under "Non-Natural Anchor" (unless we assume non-naturalism).

    Under crane:
      - Under "Stepwise Builder": yes, because it is a mechanism built from below.
      - Under "Emergence Enabler": yes, because it might show how normativity emerges.
      - Under "Non-Circular Mechanism": no, because it uses the normative term.

    Verdict: In my view, the borrowed crane is not a skyhook under a reasonable naturalistic reading because the normative terms are being used to describe the functional role, which can be realized without circularity if the base level is non-normative.

    Decisive question: Can the feedback mechanism be fully described without using normative terms (e.g., in terms of physical causation and statistical regularities)?

  Case (b): 'inherited crane'
    Scenario: Correctness in a system is explained by its being shaped by agents who already have it.

    Under skyhook:
      - "Unexplained Explainer": from the perspective of the system, the normativity is unexplained (it comes from outside) but from the broader history it is explained. If we are explaining the system in isolation, then yes, it's a skyhook for that system. But if we are explaining normativity in general, then the external agents need their own explanation. So it might be a skyhook only if the external agents are not explained.
      - "Non-Natural Anchor": only if the external agents have non-natural normativity.
      - "Explanatory Circularity": not circular because the system's normativity is explained by the agents', which is different (unless we are explaining normativity in general and the agents' normativity is the same phenomenon).

    We'll say: under "Unexplained Explainer" if the baseline does not include the agents, then it is a skyhook. Under "Explanatory Circularity" it isn't necessarily. But note: the friend says skyhook-hood is not relative. So we must consider absolute readings.

    Under crane:
      - All crane readings: if the agents themselves are explained by cranes, then the entire history is a crane. But if the agents are skyhooks, then it's not a crane.

    Verdict: The inherited crane is not a skyhook if the agents who built the system have their own crane-based explanation.

    Decisive question: Is there a complete crane-based explanation for the normativity of the shaping agents?

  Case (c): 'stipulated floor'
    Scenario: Inside a simulation, the rules are skyhooks (unexplained), but from outside they are cranes.

    Under skyhook:
      - "Unexplained Explainer": from inside the simulation, yes; from outside, no.
      - The other readings: if the simulation rules are non-natural from the inside? Not really. Or circular? Not necessarily.

    So: under "Unexplained Explainer", it is a skyhook relative to the simulation's baseline.

    Under crane:
      - From outside, the rules are implemented by the hardware, so they are cranes under all readings.

    Verdict: Whether the rules are skyhooks depends on the baseline of explanation.

    Decisive question: What is the appropriate baseline for the explanation? (But note: the friend denies relativity.)

  Now, indexicality:
    is_skyhookhood_relative_to_a_baseline: 'yes for some readings only'
      - For "Unexplained Explainer", it is relative because what counts as explained depends on the context.
      - For "Non-Natural Anchor", it might be absolute (non-natural is non-natural regardless of baseline).
      - For "Explanatory Circularity", it is absolute (circularity is a property of the explanation).

    consequence_for_the_slogan: If skyhookhood is relative for the most common reading ("Unexplained Explainer"), then the slogan 'there are no skyhooks' becomes either trivial (if we set the baseline to include everything) or unfalsifiable (if we can always shift the baseline). But it can still be substantive if we fix the baseline appropriately.

  Bottom line: We should press the friend to commit to the "Explanatory Circularity" reading of skyhook because it is the most substantive and avoids relativity. This commits him to showing that any account of normativity that uses normative terms in the explanation is circular, and hence he must provide a non-circular reduction.

  Now, we write the JSON.

  Note: We must use the exact labels we defined in the terms when filling the cases.

  Let's code the JSON accordingly.
