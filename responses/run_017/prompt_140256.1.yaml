prompt: |-
  hey — i got roped into writing the practice exam for my school's philosophy/econ club and i need one essay question on why some countries are rich and others arent. context: everyone in the club is 16-17, nobody has read any actual papers, and the room we sit in has no wifi and no library books. so the question and the model answer both have to be totally self-contained: no real-world examples, no "as economist X argued in year Y", no reading lists. everything has to come from the case i give plus reasoning. 45 minutes, 20 marks total.

  the problem is that everyone has absorbed the same one-word answer off the internet — "institutions" — and i can already see six identical essays coming: a paragraph on institutions, a paragraph on geography, a paragraph on culture, conclusion "its mostly institutions", 14/20 for everyone. i want a question where that gets you like 6.

  so i drafted a made-up case to build the question around. use it, fix it if its badly designed, or throw it out and build a better one:

  Meridia is an island, one language, one mix of farming and fishing, fairly even rainfall and soil, no known gold/coal/oil. In 1891 a colonial governor splits it in two with a straight line drawn on a badly printed map; because of the misprint the line lands about 40km north of where he meant it. Nothing real changes as you cross it — same soil, same crops, the same families end up on both sides. One governor, one legal code, one school system until independence in 1960, then two countries, North Meridia and South Meridia, with word-for-word the same constitution, the same elections every five years, the same laws about property, contracts and taxes on paper. Today income per person in North is about four times what it is in South. Assume these are all true:

  (a) In North a road contract normally goes to the lowest bidder. In South it normally goes to someone the minister is related to. In both places over 90% of people tell surveyers that corruption is wrong.
  (b) In 1970 a big oilfield was discovered in South — the poorer half. Most of the money appears to have ended up in private bank accounts abroad.
  (c) On survey questions like "do you trust your neighbours", "is hard work important", "how religious are you", North and South give basically the same answers.
  (d) In North every district office has kept a written, public register of who owns which piece of land, continuously since 1893. In the South nobody does. The reason it started in North: the district officer posted there in 1893 happened to be a man who liked filing things, trained two clerks, they trained two more, and the habit stuck. In the South the officer posted that year was transferred after three months.

  the kinds of things im hoping the question forces people into, if theyre any good (use your own if youve got better ones): whether "institutions" here means the rules on paper or the rules actually followed, and what would have to be true for "institutions did it" to be false rather than just definitional; the fact that (d) makes the institutional difference itself something that needs explaining and traces it back to a small fluke, so "the cause" might be a contingent chain instead of a factor; whether the causal claim is supposed to be "in general, elsewhere, in other cases" or just "here", and what one case can and cant establish; whether "why is North rich" and "why is North richer than South" and "what should we change" are even the same question; and how (b) messes with a simple resources story.

  i was also thinking of adding a part b where you imagine re-running history from 1891 a hundred times and asking what the pattern of outcomes would tell you — no idea if that helps or just confuses people, you decide.

  what i want back: the actual exam question (one question, part b if you think its worth it), a model answer of about 600-700 words, and a marking scheme with 4 or 5 must-hit points, how many marks each is worth (20 total), and one line each on the mistake people will actually make that loses them those marks. then a short note on what separates an A (17+) from a B (13-16) — a specific move the A answer has to make, not just "more detail" or "neater writing". and tell me if my case is broken in some way that lets a memorizer off the hook.
reasoning: |-
  Hmm, the user is designing a philosophy/econ club exam for 16-17 year olds about why some countries are rich and others aren't. They want to avoid the simplistic "institutions" answer and force deeper thinking. 

  First I need to understand their constraints: no real-world examples, no references, everything self-contained in their Meridia case study. The key challenge is blocking the standard "institutions + geography + culture" template essay. 

  Looking at their Meridia scenario - it's cleverly designed. The identical starting conditions and constitutional frameworks make geography/culture/resources weak explanations. The oil discovery in the poorer South is a nice touch to undermine resource arguments. The land registry origin story (point d) is particularly effective - it makes institutional quality look random rather than fundamental.

  The user's deeper goals are visible: they want students to grapple with operational definitions (paper institutions vs actual practices), contingency vs determinism, and the difference between explaining divergence vs absolute wealth. The proposed part B about rerunning history could push this further.

  For the question itself, I should:
  - Force comparison between North/South since identical starting points eliminate many variables
  - Explicitly ask about the "one-word answer" to target institutional reductionism
  - Include a "what should South do" component to reveal policy confusion

  The marking scheme needs to penalize:
  - Treating "institutions" as monolithic
  - Ignoring the corruption/oil paradoxes 
  - Missing that institutional quality itself needs explaining
  - Confusing correlation with causation

  Top answers should notice that institutional persistence (like the land registry) creates path dependence - the 1893 fluke only matters because its effects accumulated. Also, they should separate diagnosis from prescription.

  The case study holds up well - the only potential issue is whether students might latch onto the "filing habit" as a cultural trait, but survey data (point c) blocks that. Adding part B strengthens the contingency angle.

  For the model answer, I'll demonstrate:
  - Dissecting "institutions" into formal rules vs actual practices
  - Showing how (b) makes resources contingent on institutions
  - Arguing that initial conditions only matter via lasting legacies
  - Distinguishing between explaining this case vs general theory
  - Cautioning against direct policy transplants

  The A-grade differentiator should be recognizing that functional institutions are outcomes, not primitives - which circles back to explaining why the filing habit persisted in North but not South.
answer: |-
  Here's a complete exam package designed to disrupt simplistic "institutions" answers while working within your constraints. The case study is retained with minor clarifications.

  **Exam Question (Total: 20 marks; Time: 45 minutes)**  
  *Using ONLY the information provided about Meridia, answer the following:*  
  1.  **Explain why "institutions" is an incomplete answer** to the question "Why is North Meridia richer than South Meridia?" (12 marks)  
  2.  **If we could re-run Meridia's history from 1891 a hundred times**, what might the outcomes tell us about why some societies become richer than others? (8 marks)  

  ---

  **Model Answer (Approx. 650 words)**  

  **(1)** Saying "institutions caused the difference" is incomplete because it fails to explain *which aspect* of institutions matters, *why* institutions diverged despite identical starting points, and *how* institutional quality interacts with events like the oil discovery.  

  First, "institutions" conflates *formal rules* (laws, constitutions) with *actual practices*. North and South had identical formal institutions post-1960 (same constitution, laws, elections). The divergence stems from *implementation*:  
  - **Corruption in practice**: Despite identical anti-corruption laws, South's road contracts favor relatives (fact a), while North follows rules. Formal institutions didn’t differ; *behavior* did.  
  - **Land registry**: North’s functional registry (fact d) isn’t mandated by superior laws but arose from a random event (a detail-oriented clerk) and persisted. South lacked this *functional practice*, not the *formal rule*.  

  Second, attributing the gap to "institutions" ignores *why* practices diverged. The land registry originated from a fluke (the 1893 clerk) and endured through training. This suggests:  
  - **Contingency over determinism**: No "deep" factor (geography, culture, laws) caused this. A minor accident created a self-reinforcing system (trained clerks training more clerks).  
  - **Path dependence**: Small differences (filing habits) compounded. North’s registry likely enabled better property rights, encouraging investment. South’s lack of one created uncertainty.  

  Third, the oil discovery (fact b) exposes a paradox: South had *more* resources but grew *poorer*. "Institutions" alone doesn’t explain this unless we specify *how* institutions matter. Here:  
  - **Institutions shape resource impact**: South’s corruption (a) likely allowed oil wealth to be stolen. Better institutions might have converted oil into public wealth.  
  - **The "resource curse" isn’t automatic**: It depended on pre-existing practices. Institutions didn’t *cause* the gap directly; they *mediated* the oil’s effect.  

  Finally, identical survey responses (fact c) show culture/values didn’t *cause* divergence. If shared beliefs ("corruption is wrong") co-exist with different behaviors, "culture" can’t explain outcomes.  

  **(2)** Re-running history 100 times would test whether North’s success was inevitable or luck-dependent. Possible outcomes:  
  - **Divergence is likely, but who wins isn’t**: Small, random events (like the clerk in d) might often trigger institutional "habits" (good/bad filing, corruption/non-corruption). These habits could compound, creating gaps.  
  - **Oil might usually hurt the South-like side**: Without functional institutions (land registry, contract enforcement), resource windfalls are often captured by elites (as in b).  
  - **Identical starting points don’t guarantee identical outcomes**: Despite shared geography, laws, and culture, tiny differences in early events could lead to large, lasting gaps. This challenges arguments that "deep" factors (soil, constitutions) *determine* wealth.  
  - **"Institutions" aren’t a magic bullet**: If functional practices (like North’s registry) arise from accidents, simply copying formal rules (like South’s constitution) without nurturing actual practices may fail. Path dependence matters.  

  **Conclusion**: North isn’t rich because it had "good institutions" by decree. It’s richer because *specific functional practices* (transparent bidding, land records) emerged contingently and persisted. "Institutions" explains nothing unless we dissect *what sustains practices* amid identical rules and values.  

  ---

  **Marking Scheme (20 marks total)**  
  **Part 1 (12 marks)**  
  - **Must-hit points (8 marks)**:  
    - Distinguishes formal institutions (laws) vs. actual practices (corruption, land registry operation) **(2 marks)**.  
    *Mistake: Treating "institutions" as a monolithic concept.*  
    - Uses fact (d) to show institutional divergence originated from a fluke, not systemic factors **(2 marks)**.  
    *Mistake: Ignoring that the cause of institutional quality itself needs explanation.*  
    - Explains how fact (b) (oil in South) shows resources require functional institutions to benefit society **(2 marks)**.  
    *Mistake: Claiming resources alone explain wealth/poverty.*  
    - Uses fact (c) to argue culture isn’t the driver **(1 mark)** and fact (a) to show behavior diverged despite shared norms **(1 mark)**.  
    *Mistake: Citing culture or values as the cause.*  

  - **A-grade boosters (4 marks)**:  
    - Explicitly notes that "institutions" as a one-word answer is **tautological** (e.g., "North is richer because it has better institutions" is circular).  
    - Argues that **path dependence** (small differences compounding) is key, not static "factors."  
    - Recognizes that **explaining divergence** (why *relative* wealth differs) is different from explaining *absolute* wealth.  

  **Part 2 (8 marks)**  
  - **Must-hit points (6 marks)**:  
    - Suggests outcomes would likely vary (divergence is common) due to small initial differences **(2 marks)**.  
    *Mistake: Assuming identical outcomes each time.*  
    - Notes that oil in South would often worsen outcomes without functional institutions **(2 marks)**.  
    *Mistake: Treating oil as inherently good/bad.*  
    - Infers that formal institutions (constitutions) are less important than emergent practices **(2 marks)**.  
    *Mistake: Claiming reruns would always produce the same winner.*  

  - **A-grade boosters (2 marks)**:  
    - Connects reruns to **contingency**: Success isn’t predetermined by geography/laws.  
    - Suggests **path dependence** makes outcomes "sticky" once early habits form.  

  ---

  **What Separates an A (17+) from a B (13-16)?**  
  - **The A answer identifies the central paradox**: If institutions are the cause, *why did they diverge* under identical conditions? It treats institutional quality as an **outcome to be explained** (via the clerk fluke and path dependence), not a first cause.  
  - **The B answer** lists institutional *differences* (corruption, land registry) but doesn’t probe *why they emerged* or why "institutions" as a blanket term is circular. It uses the facts descriptively but not analytically.  

  **Case Study Effectiveness**:  
  - **Blocks memorized answers**: Geography (same island), culture (same survey answers), resources (oil in poor South), and formal institutions (same laws) are neutralized. Forces engagement with *process*.  
  - **Flaw check**: The 1893 clerk fluke could be misread as "culture" (hardworking vs. lazy), but fact (c) explicitly blocks this by showing identical values. Contingency is clear.  

  **Why Part 2 Helps**: It forces students to think beyond *this* outcome to broader causal logic, revealing if they understand contingency vs. determinism.  

  This setup rewards students who see that "institutions" isn’t an explanation—it’s the start of the question.
