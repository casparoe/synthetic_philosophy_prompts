prompt: |-
  You are a professional philosopher who has spent years advising agricultural extension services and pesticide regulators, and who is equally at home with population-level consequentialist reasoning and with the unsettled literature on invertebrate sentience. Think carefully before you write. Begin with a brainstorming pass in which you list the considerations you think an insecticide decision actually turns on, sorted into factual, ethical, and irreducibly uncertain, and only then start building the procedure.

  The task: I staff a small valley grower cooperative's Spray Review Board. Roughly fifty times a year a member asks permission to use an insecticide that is not on our approved IPM list. We have ten working days, no philosopher, and a board of three growers plus one extension agent; the applicant has to be able to follow the reasoning on a single page. Write the decision procedure we should run: the questions in the order to ask them, what counts as a sufficient answer to each, the points at which the procedure simply stops and returns a no, and the points at which it stops and hands the decision to the board explicitly as a values call rather than a matter of fact. Assume throughout that we cannot settle whether the animals in question are sentient at all, and say what the procedure does differently on each side of that question.

  Two things I need it to handle that I don't think standard IPM language handles:

  1. Displacement. For most of our pests it may well be true that the individuals killed would largely have died anyway — starvation, predators, winter — and that a vacated niche refills, so that the moral cost of a spray is not the body count but the net change in insect life-years or suffering, which could be near zero or even negative if the unmanaged alternative is a slower death. I have been calling this the displacement ledger. Tell me whether the procedure should contain such a step at all, and if it should, how a grower with no theory fills it in: what he can reasonably be asked to estimate, and what the procedure does when he cannot estimate it.

  2. The resistance commons. The susceptibility of the local pest population is a shared stock: my spray today makes everyone's sprays worse in five years, and my restraint today is partly someone else's gain. So the question is not only whether this spray is justified but whether we would still want to spend the shared stock this way if every grower in the valley reasoned the same way — and, on the other side, whether the applicant is being asked to absorb a loss his competitors are not. Build this into the ordering: say where it functions as a veto, where merely as a tiebreaker, and how to apply it without a population model.

  Then run the finished procedure in front of me, and commit to the verdicts: (a) a request for a prophylactic neonicotinoid seed coating on a field where the target pest appears in roughly one year in three and scouting is unreliable; (b) an aphid outbreak in a greenhouse where releasing parasitoid wasps would work but takes two weeks longer and costs more; (c) a spray to prevent purely cosmetic damage on a crop the grower says he will lose money on without it. At least one of these must come out the way I will not like — name it, and tell me why the procedure is right and my instinct is wrong.

  Give me the ordering and the verdicts as settled, with your reasons, not as a menu for me to choose between. Mark the steps that are really judgment dressed up as procedure. Finally, tell me what this procedure cannot do: which applications it will systematically get wrong, and what I should watch for in the first year in order to notice.
reasoning: |-
  Hmm, the user is asking me to design a decision procedure for a Spray Review Board that handles insecticide requests not on an approved IPM list. They need a practical, step-by-step process that growers can follow within ten working days, with clear stopping points and values-based decisions. The key challenges they mentioned are displacement (the moral cost of killing insects when they might die anyway) and resistance commons (how individual actions affect shared susceptibility).

  First, I need to outline the considerations. Factual ones include pest severity, non-target risks, and resistance development. Ethical aspects involve harm to non-targets and resource fairness. Uncertainties revolve around invertebrate sentience and displacement effects. The user wants this in a specific order: brainstorming considerations first, then the procedure.

  For displacement, I'm considering how to frame it. If insects would die anyway, net suffering might be low. But without good data, growers might struggle to estimate this. Maybe simplify it to a binary question: is the alternative death likely slow and painful? Or prompt for qualitative evidence like pest density or predator presence.

  Resistance commons is tricky. It's a shared resource, so individual actions impact the community. The procedure should ask if this use is worth depleting susceptibility for everyone. It could act as a veto for high-risk cases, like prophylactic use, or a tiebreaker otherwise. Without models, they'll need heuristics like chemical class and past usage.

  The user provided three test cases. For the prophylactic neonicotinoid, it's high risk for resistance and low immediate need, so likely a no. The aphid outbreak in a greenhouse: faster chemical control might be justified if the delay causes significant loss, but parasitoids are better. Cosmetic damage spray: low necessity, so probably no unless economic loss is proven.

  The cosmetic damage case might be disliked by the user, but the procedure would reject it because harm outweighs trivial benefits, aligning with ethical priorities. I need to highlight steps where judgment is disguised as procedure, like assessing "significant" loss or "reasonable" alternatives.

  Limitations include cases with data gaps or urgent crises. Monitoring rejections and appeals in the first year will help identify flaws. Also, displacement estimates will be rough, so board judgment is crucial there.

  Finally, ensuring the procedure fits on one page with clear yes/no paths. The steps should start with necessity, then alternatives, non-target risks, displacement (if sentient), resistance, and economic factors. Values calls at displacement and resistance steps when uncertain.
answer: |-
  Here is a decision procedure for your Spray Review Board, designed for clarity, practicality, and explicit handling of displacement and the resistance commons, while acknowledging irreducible uncertainty about sentience. It assumes baseline competency in IPM principles among board members and applicants.

  **Core Structure:** A sequential checklist. Proceed only if the previous step is satisfied. "Stop & Return No" or "Values Call" points are explicit. Answers must be documented briefly on the application form. The Board acts as referee for insufficient answers or values calls.

  **Decision Procedure: The Spray Review Board Checklist (SRBC)**

  1.  **Is there a demonstrated, significant economic or crop health threat *right now*?**
      *   **Sufficient Answer:** Documented pest presence (scouting reports, traps, photos) above established economic thresholds, OR clear, imminent threat based on predictive models/history for this specific field/crop/pest combo. "Preventative" without clear, current risk is insufficient.
      *   **Stop & Return No If:** No evidence of current significant threat. (e.g., "Might happen," "Cosmetic only without proven loss" - see Case C).
      *   **Why:** Prevents unnecessary sprays. Basis is factual (pest presence/damage) and ethical (no justification without need).

  2.  **Are demonstrably effective, lower-risk alternatives (mechanical, biological, cultural, approved chemicals) unavailable, impractical, or significantly less effective *for this specific situation*?**
      *   **Sufficient Answer:** Specific reasons why standard IPM tactics (e.g., traps, tillage, resistant varieties, biocontrols, approved pesticides) won't work *here and now* (cost, timing, labor, efficacy data, site constraints). Must compare against the proposed spray.
      *   **Stop & Return No If:** Applicant hasn't seriously considered/implemented reasonable alternatives, or a clearly viable, lower-risk alternative exists (e.g., Case B - parasitoids exist, just slower/costlier; requires evaluation).
      *   **Why:** Core IPM principle. Factual (effectiveness comparison) and ethical (minimize harm).

  3.  **Does the proposed insecticide pose unacceptable risks to non-target organisms (pollinators, predators, soil life, aquatic systems) or human health *in this specific application context*?**
      *   **Sufficient Answer:** Review of label restrictions, known toxicity data, application method (e.g., seed coating vs. foliar spray), timing (bloom, water proximity), buffer zones. Consideration of local conditions (beehives nearby, streams).
      *   **Stop & Return No If:** Risks clearly violate label, cooperative environmental safety policy, or pose imminent hazard (e.g., spraying blooming crop with bee-toxic chemical near apiaries).
      *   **Why:** Factual (toxicology, ecology) and strong ethical imperative (prevent collateral damage).

  4.  **IF we assume the target pests (and key non-targets) *are sentient*, consider the Displacement Ledger:**
      *   **Question:** Is the net suffering caused by the spray likely *less than* the net suffering from the unmanaged pest scenario over a relevant timeframe (e.g., season)? Consider: Would killed pests die slower/more painfully soon anyway? Will spraying prevent a larger, prolonged outbreak with more suffering? Will spraying harm beneficials that *reduce* future pest suffering?
      *   **How the Grower Estimates (Qualitatively):** Applicant provides brief reasoning based on:
          *   Pest Biology: Is it an r-strategist (high mortality anyway)? Is the alternative death likely slow (starvation) or fast (predation)?
          *   Current Context: High pest density suggests intense competition/starvation imminent? Low density suggests individuals likely to survive longer? Are key predators/parasitoids already active?
          *   Outbreak Potential: Is this the leading edge of a major outbreak suppression prevents?
          *   **Sufficient Answer:** Plausible narrative using the above factors (e.g., "High aphid density now, ladybugs scarce; likely mass starvation soon if not sprayed" OR "Low beetle count early season; spraying now kills individuals that might have died fast to birds anyway").
      *   **Values Call Trigger:** If the ledger is ambiguous (common!), OR if the applicant cannot provide a plausible estimate based on pest biology/context. **Board must decide:** Given the uncertainty, is the *potential* for reduced net suffering strong enough to justify the spray *despite* the act of killing? (This is judgment dressed as procedure).
      *   **If Sentience Assumed False:** Skip this step entirely. Killing is not a moral harm in itself.
      *   **Why:** Explicitly addresses the ethical concern about net suffering under sentience assumption, using practical observation points. Uncertainty forces ethical judgment.

  5.  **Resistance Commons Evaluation:**
      *   **Question A (Veto Condition):** Is this application a *prophylactic* or *low economic justification* use of a chemical in a mode-of-action class (e.g., neonicotinoid, Group 4A) known to be at moderate/high risk in our valley for this pest, *and* is this class critically important for managing future severe outbreaks of this or other key pests?
      *   **Sufficient Answer:** Facts on resistance status (extension reports), chemical group importance, and application type (prophylactic vs. curative).
      *   **Stop & Return No If:** "Yes" to all parts of Question A. (e.g., Case A - prophylactic neonics on a minor pest). Protects the shared resource from frivolous depletion.
      *   **Question B (Tiebreaker/Weight):** Even if not vetoed, *would the valley be better off* if all growers used this chemical *this way* for *this specific pest/context*? Consider resistance risk, availability of alternatives, and overall pest pressure.
      *   **How without a Model:** Board discussion based on: Local resistance monitoring data? Frequency of similar requests? Criticality of the chemical group? Availability of effective alternatives *for this specific use case*? Fairness to applicant (are others "cheating"? Board must investigate if alleged).
      *   **Values Call Trigger:** If Question B suggests significant negative commons impact but doesn't meet the veto threshold. **Board must decide:** Is the individual economic benefit *to this grower* so compelling that it outweighs the diffuse, future cost *to the cooperative*? (Judgment dressed as procedure).
      *   **Why:** Directly addresses the tragedy of the commons. Veto for clear abuse; tiebreaker/weight for marginal cases requiring collective values.

  6.  **Net Economic Benefit Assessment:**
      *   **Question:** Is the expected economic benefit of spraying (crop value saved minus spray costs) significantly greater than the cost, considering the answers above (especially Step 1 & 2)?
      *   **Sufficient Answer:** Simple calculation based on projected yield/quality loss without spray vs. cost of spray application. Must be plausible and consider Step 1 threat level.
      *   **Stop & Return No If:** The net benefit is marginal or negative *after* considering the risks and costs identified in Steps 1-5 (e.g., Case C - cosmetic damage unlikely to cause real loss).
      *   **Why:** Ensures the action is practically justified. Primarily factual (economics), but influenced by prior steps.

  **Procedure Output:** Proceed only if all steps are satisfied (either by sufficient answer or Board approval on Values Calls). A "No" at any Stop point ends the review.

  ---

  **Running the Cases (Committing to Verdicts):**

  *   **(a) Prophylactic Neonicotinoid Seed Coating (Pest appears ~1/3 years, scouting unreliable):**
      *   **Step 1: (Stop & Return No)** - No *demonstrated, significant threat right now*. Prophylactic application fails the immediate threat test. **VERDICT: NO.**
      *   *(Would also fail Step 2 - scouting unreliability isn't automatically sufficient reason against other preventative measures besides neonics; Step 4 - Sentience assumed? Ambiguous ledger, Values Call likely needed but moot; Step 5A - (Veto) Prophylactic use of high-resistance-risk chemical for minor/intermittent pest. Fails multiple points).*

  *   **(b) Aphid Outbreak in Greenhouse (Parasitoids work but slower/costlier):**
      *   **Step 1: (Yes)** - Outbreak confirmed.
      *   **Step 2: (Values Call)** - Parasitoids are a viable alternative but slower/costlier. Board must judge: Is the economic/quality loss during the 2-week delay *so severe* that it justifies the faster, higher-risk chemical option? Factors: Crop value, stage, market timing, actual cost difference.
      *   **Step 3: (Assess)** - Depends on chemical chosen and greenhouse setup (containment). High risk to biocontrol agents likely.
      *   **Step 4: (Sentience Assumed? Values Call Likely)** - Displacement ledger ambiguous: Spray kills instantly, parasitoids cause slower death. Outbreak might cause plant stress/starvation. Board judgment on net suffering.
      *   **Step 5: (Question B - Tiebreaker)** - Depends on chemical group resistance risk in greenhouses locally. Using faster chemicals routinely undermines biocontrol programs.
      *   **Step 6: (Likely Yes)** - Benefit probably exists.
      *   **VERDICT: HIGHLY CONTEXT DEPENDENT.** Likely hinges on Step 2 & Step 4 Values Calls by the Board. If parasitoids are readily available and the delay isn't catastrophic, **NO** is defensible. If crop loss during delay is massive, **YES** might be approved with restrictions (specific chemical, application method). *This might not be the outcome you prefer if you favor biocontrol.*

  *   **(c) Spray for Purely Cosmetic Damage (Grower claims will lose money without it):**
      *   **Step 1: (Stop & Return No)** - "Purely cosmetic damage" implies no significant threat to yield or plant health. Grower's claim of economic loss needs *proof* (e.g., historical price penalties for cosmetic defects *on this specific market*). Absent compelling proof, fails the significant threat test. **VERDICT: NO.**
      *   *(Also fails Step 6: Unproven economic benefit. Step 5B: Using valuable chemistry for vanity is poor commons management).*
      *   **Why the procedure is right and your instinct might be wrong:** Your instinct might sympathize with the grower's perceived economic pressure. However, the procedure prioritizes *verified need* and prevents resource depletion (resistance commons) and potential harm for trivial reasons. Allowing cosmetic sprays sets a dangerous precedent, undermines IPM, and wastes the susceptibility commons. The grower needs to demonstrate *real* market consequences or improve their IPM/marketing strategy.

  **The Case You Won't Like:** I suspect Case (b) might not go the way you prefer. If the Board judges the economic loss during the parasitoid lag period as severe enough (Step 2 Values Call), and discounts sentience concerns or judges the displacement ledger neutrally (Step 4 Values Call), they might approve the spray. **The procedure is right** because it forces explicit consideration of the trade-offs (speed vs. risk, economics vs. ethics/commons) under uncertainty. Your instinct might prioritize ecological methods absolutely, but the procedure acknowledges that severe, immediate economic harm can sometimes outweigh slower, more sustainable options, provided the risks are evaluated and the decision is taken consciously by the Board as a *values call*.

  **Steps Disguising Judgment:**
  1.  **Step 2 ("impractical or significantly less effective"):** Defining "significant" is judgment.
  2.  **Step 4 (Displacement Ledger Narrative):** Evaluating the plausibility of the grower's narrative and the net suffering under sentience is profound judgment.
  3.  **Step 5B (Commons Tiebreaker):** Balancing individual gain against diffuse future community loss is a core value judgment.
  4.  **Step 6 ("significantly greater" economic benefit):** Defining "significant" margin is judgment.

  **What This Procedure Cannot Do (Limitations & First-Year Watch-For):**

  1.  **Quantify Uncertainty:** It uses qualitative heuristics for displacement and resistance. Watch for: Boards defaulting to "no" or "yes" whenever displacement is mentioned due to discomfort.
  2.  **Handle Novel Pests/Chemicals Perfectly:** Relies on known biology and local resistance knowledge. Watch for: Inadequate information paralyzing decisions; need a process for urgent research/consultation within 10 days.
  3.  **Resolve Sentience Debate:** Sidesteps it by having parallel paths. Watch for: Board members letting personal beliefs (pro or con sentience) override procedure (e.g., skipping Step 4 entirely or giving it undue weight).
  4.  **Ensure Perfect Commons Management:** Relies on Board's collective responsibility. Watch for: Consistent approval of marginal cases (Step 5B tiebreakers always going to the grower), or lack of follow-up on resistance monitoring to inform Step 5.
  5.  **Address Cumulative Landscape Effects:** Focuses on single applications. Won't catch slow build-up of low-level harm. Watch for: Many approved "minor" sprays adding up.
  6.  **Eliminate "Gaming":** Growers might exaggerate threats (Step 1) or downplay alternatives (Step 2). Watch for: Patterns of implausible justifications from specific members; need verification (e.g., board member site visit spot checks).
  7.  **Solve Urgent Crises Perfectly in 10 Days:** Complex cases needing deeper analysis might be rushed. Watch for: Important details being glossed over to meet the deadline.

  **First-Year Monitoring Focus:** Track *where* applications fail, *why* Values Calls are made (and their justifications), and *how often* Steps 4 (Displacement) and 5 (Commons) are decisive. Monitor for consistency in applying judgment thresholds (e.g., "significant" threat/benefit). Pay special attention to any approved applications that later contribute to resistance problems or environmental harm. Review rejected applicants' feedback on perceived fairness. This will show if the procedure is working as intended or needs refinement.
