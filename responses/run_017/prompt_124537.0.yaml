answer: |-
  ### Mark: 19/20  

  **Comments:**  

  **(a) Distinguish two complaints... (6/6)**  
  The distinction is correctly drawn and accurately captures the seminar’s framing. The first complaint (unfairness/disrespect) is well explained as a normative *demand* that becomes unfair when the blamer exempts themselves from the norm. The second complaint (defective expression) is precisely characterised as concerning the *sincerity* of the judgment expressed by blame. The inference that hypocrisy suggests the blamer does not truly believe the norm is sound. Fully correct.  

  **(b) Explain why it matters... (6/6)**  
  The answer correctly identifies the independence of standing and wrongness, and the inference that B’s objection shows *nothing* about the wrongness of B’s act is logically sound. The explanation that standing concerns the blamer’s normative situation ("something about A") is apt. The point that a blamer "is not in a position to say it" even if her claim is true aligns perfectly with the seminar’s focus on standing. No additions needed.  

  **(c) Now consider the Confessor... (7/8)**  
  - **Standing of the Confessor:** Correctly concludes she has standing. The reasoning under the "defective expression" complaint (sincerity) is flawless: she judges her own conduct harshly, so her blame sincerely expresses the norm.  
  - **Fairness View:** Implicitly covered but could be more explicit. The Confessor *accepts* the norm’s application to herself, so the "unfairness" complaint from (a) is *unavailable* to B. The answer notes she "applies the norm to herself strictly" but should directly state this negates the unfairness charge.  
  - **Relationship View:** Correctly notes the verdict aligns (standing absent due to damaged relationship), but the explanation is underdeveloped. It should clarify that the *relationship* itself is the source of standing on this view—not the blamer’s record *directly*—and prior promise-breaking may impair it.  
  - **B’s Objection:** Correct that the *tu quoque* is a fallacy and irrelevant to wrongness. However, the answer omits explicitly stating that *neither* complaint from (a) is available against the Confessor: her blame is neither unfair (Fairness View) nor insincere (defective expression). The claim that "B’s objection fails entirely" is justified but should specify that *both* complaints fail.  
  - **Ordinary Hypocrite Digression:** Insightful but slightly exceeds the question’s scope. The contrast helps clarify the Confessor’s standing but should be tighter.  

  **Overall Summary:**  
  An excellent answer demonstrating clear grasp of the core concepts and logical structure, with minor omissions in explicitly linking the Confessor’s case to the unavailability of *both* complaints under the Fairness View and a slightly thin Relationship View analysis.
