prompt: |-
  Hey — you're a decision theorist who has had to teach rational choice to skeptical, numerate adults before (think quants, actuaries, ML engineers), so I want a *teaching plan*, not an explanation of the independence axiom itself. I've got a 75-minute slot in my team's internal training week and the topic I got saddled with is the Allais paradox / independence axiom. The audience is comfortable with expected value and probability, a few of them have heard of loss aversion, none of them have seen von Neumann–Morgenstern expected utility theory as a package, and at least two will arrive convinced that "people are irrational, we already know this, next slide."

  What I need from you: think it through carefully, brainstorm two or three possible arcs before committing to one, and give me the dependencies — what has to be in place before the axiom can even be stated so it doesn't sound like a tautology or like a claim that you should maximize expected *money*. Then the carrying example: design the actual pair of choice problems I should put on the board, and tell me what such an example has to have and what it has to lack. My guesses: the two problems must share a common consequence so the comparison is a чист swap, the stakes have to be identical across all four options so that risk aversion can't explain the switch, and the outcomes have to be described richly enough that the chooser's reasons are exhausted by the description — but not so richly that the money means something different in different cells ("this is the deposit on a house" would poison the example, I think). Correct me if I'm wrong about any of that.

  Then the misconception map, with the point in the sequence where I should defuse each one. Here's what I predict, tell me what I'm missing: (a) "the axiom says be risk-neutral"; (b) "this is just about tiny probabilities / people overweight certainty"; (c) "the two problems differ, so there's no inconsistency" — the students will hunt for a difference that justifies the flip; (d) "if most people violate it, the axiom is false"; (e) someone will think the axiom is a prediction about behavior rather than a coherence constraint.

  Two things I'm stuck on and want you to settle. First, my hunch for the way in is the sequential version: let the shared branch resolve *before* the chooser picks, so violating independence means you'd reverse yourself after learning which branch you're in. Does that argument quietly assume dynamic consistency or consequentialism as a separate commitment, and should I say that out loud or shut up at this level? Second, I want to add a wrinkle: rerun the same example where the uncertainty comes from an already-fixed but unknown fact (a sealed envelope, a lab result that's back but unread) instead of a lottery wheel. I suspect the violation gets louder, but I can't tell whether that's the same phenomenon turned up or a genuinely different one (ambiguity/ignorance vs. chance) that I should keep out of a 75-minute session.

  Finish with: one question I can ask at the end that tells me whether they got the axiom rather than memorized the shape of the paradox — ideally a non-monetary case where they have to spot whether independence even applies — and a short list of what I should openly refuse to explain in 75 minutes (the representation theorem, prospect theory's weighting function, etc.). No readings or bibliography, I won't have time for any of that anyway.
reasoning: |-
  Okay, the user is a professional who needs to teach the Allais paradox and independence axiom to a skeptical, numerate audience. They've got a 75-minute slot and want a teaching plan, not just an explanation. Let me start by understanding their requirements. The audience includes quants, actuaries, ML engineers—people comfortable with expected value and probability. Some know about loss aversion, but none are familiar with vNM utility theory. A couple might dismiss the topic as obvious ("people are irrational, next slide"). 

  First, the user wants a teaching plan with a few possible arcs before choosing one. They need dependencies: what must be established before introducing the independence axiom so it doesn't seem tautological or about maximizing expected money. Then, designing the choice problems. The user mentioned the example must have a common consequence, same stakes to avoid risk aversion explanations, and rich but not context-dependent outcomes. They also want a misconception map and solutions for each. 

  They're stuck on two points: using the sequential version (does it assume dynamic consistency?) and whether to use an uncertainty source like a sealed envelope. Finally, a question to check understanding and what to avoid covering.

  Breaking this down, I need to consider possible teaching arcs. The user suggested a sequential approach. Let me brainstorm three structures. One could start with the paradox to hook them, then explain the axiom. Another could build from rational choice foundations, introducing preferences and axioms step by step. A third might use the sequential decision problem to show dynamic inconsistency. The sequential approach seems effective because it makes the violation tangible—changing decisions based on resolved uncertainty highlights incoherence. But does it rely on dynamic consistency? Yes, but that can be addressed briefly as a commitment to consistent planning.

  For the choice problems, the common consequence setup is key. The user's requirements: shared consequence, identical stakes, outcome descriptions that don't introduce context effects. Original Allais uses large monetary amounts, but maybe adjust to avoid risk aversion. Using life/death scenarios (like saved lives) could prevent monetary utility curvature issues. Example 1: A vs. B, where A is certain 400 saved, B is 500 with 10% chance of none. Example 2: C vs. D, both have a 10% chance of zero, but C offers 400 with 90%, D offers 500 with 89%. The common 10% zero consequence is crucial.

  Misconceptions: (a) Independence means risk neutrality. Clarify that risk aversion is allowed via concave utility. (b) Certainty effect. Point out that both problems have certain outcomes in some cases. (c) Hunting for differences. Emphasize the identical common branches. (d) Descriptive vs. normative. Stress that axioms are for coherence, not predictions. (e) Misunderstanding the axiom as prediction. Distinguish normative from descriptive.

  The sealed envelope wrinkle: Using ambiguity might introduce Ellsberg paradox issues. Since the session is short, it's better to stick with known probabilities to keep focus on independence, not ambiguity aversion.

  Check question: Non-monetary example, like health outcomes. Ask if choosing a certain 40% chance of cure over a risky 50% should imply similar choices when a common risk is added. See if they spot that independence applies only when outcomes are separable.

  What to avoid: vNM theorem proof, prospect theory details, fixes like rank-dependent utility. Focus on the paradox and axiom's rationale.

  Putting it together, the arc should start with the sequential story to engage, then present the choices, reveal preferences, show inconsistency, introduce the axiom as a coherence principle, address misconceptions, and end with the health example to test understanding. Timing: intro (5 min), paradox (20 min), axiom (15 min), misconceptions (15 min), envelope test (10 min), conclusion (10 min).
answer: |-
  Here’s a battle-tested teaching plan designed for skeptical quants, optimized for 75 minutes. Prioritizes conceptual hooks, preempts misconceptions, and forces engagement with the axiom’s *normative* claim.  

  **Core Teaching Arc (Sequential Focus):**  
  *Why this arc?* Skeptics need immediate stakes ("This isn't irrationality—it's self-sabotage"). The sequential framing makes the violation feel like a planning failure, not just a "mistake."  

  ### Dependencies (Must Cover Before Stating Axiom)
  1.  **Preferences Over Lotteries (5 mins):**  
      - "You choose between *distributions* over outcomes, not outcomes themselves. A ‘lottery’ = list of outcomes + probabilities."  
      - Show: `L1 = ($1000, 1.0)` vs. `L2 = ($0, 0.5; $2500, 0.5)`. Ask: "Who picks L1? Why? Is this *irrational*?"  
      *→ Establishes: Rationality ≠ risk-neutrality. Risk aversion is legit.*  
  2.  **Ordering & Completeness (3 mins):**  
      - "We assume you can *compare* any two lotteries (completeness) and your choices are consistent (transitivity)."  
      - *Sell it:* "This is table stakes for having ‘preferences’ at all."  
  3.  **The Setup for the Paradox (5 mins):**  
      - Introduce a **sequential choice device**:  
      > "Imagine a wheel split into 100 segments. Spin it once. *First*, it tells you which 'branch' you're on (Branch A, B, or C). *Then*, you choose Option X or Y *within that branch*."  
      - *Key:* **Branch probabilities are fixed in advance** (e.g., A: 1-80, B: 81-99, C: 00). You design your *strategy* before the spin.  

  ---

  ### The Allais Paradox Example (Designed for Clarity)  
  **Problem 1 (Choice in Branch C):**  
  *If the wheel lands on Branch C (1% chance), which do you choose?*  
  - **X_C:** $1 Million for sure.  
  - **Y_C:** 89% chance $1M, 10% chance $5M, 1% chance $0.  

  **Problem 2 (Choice in Branch A+B):**  
  *If the wheel lands on Branch A *OR* B (99% chance), which do you choose?*  
  - **X_AB:** 89% chance $1M, 11% chance $0.  
  - **Y_AB:** 90% chance $0, 10% chance $5M.  

  **Your Design Requirements – Nailed:**  
  ✅ **Common Consequence:** Branch A+B vs. C isolates the critical 1% segment.  
  ✅ **Stakes Identical:** All outcomes are monetary units ($0, $1M, $5M). No loss framing.  
  ✅ **Rich Outcomes:** Large, meaningful sums (not "$10"). But **neutral context** – no "house down payment."  
  ✅ **Risk Aversion Controlled:** Dominance arguments work; Y_AB has higher EV than X_AB but is riskier.  

  **Predicted Preferences & The Hook:**  
  - Most pick **X_C** in Problem 1 (certain $1M > gamble).  
  - Most pick **Y_AB** in Problem 2 (higher EV trumps small risk increase).  
  - **Reveal the Inconsistency:**  
      > "Your *strategy* is: Choose X in Branch C, Choose Y in Branches A+B. But look at the *overall lottery* this creates:  
      > - 89% chance $1M (from Branch A + part of C)  
      > - 10% chance $5M (from Branch B)  
      > - 1% chance $1M (from your choice in C)  
      > **= (89% $1M, 10% $5M, 1% $1M) = 90% $1M, 10% $5M?**  
      > *Wait!* If you'd chosen Y_C in Branch C, your overall lottery would be:  
      > - 89% $1M (A)  
      > - 10% $5M (B)  
      > - 1% gamble (C) → 0.89% $1M, 0.1% $5M, 0.01% $0  
      > **≈ 89.89% $1M, 10.1% $5M, 0.01% $0**  
      > **You strictly prefer the *second* overall lottery? But your branch choices led to the first!"**  

  ---

  ### Stating the Independence Axiom (Now They *Feel* the Pain)
  - **Formal Statement (5 mins):**  
      "If you prefer Lottery A to Lottery B, then mixing both with the *same* Lottery C (with probability p) shouldn't change your preference:  
      `p * A + (1-p) * C > p * B + (1-p) * C` iff `A > B`"  
  - **Reframe Sequentially:**  
      "Your choice *within a branch* should not depend on what happens in *other* branches, IF the outcome in those branches is identical for both options. Here, Branches A+B were identical for X_C vs. Y_C!"  

  ---

  ### Misconception Map & Defusal Sequence
  | Misconception          | When to Defuse                         | Script                                                                 |
  |------------------------|----------------------------------------|------------------------------------------------------------------------|
  | **(a) "Axiom = Risk Neutral"** | After Dependencies (Step 1)      | "Risk aversion? Totally fine! EU allows concave utility. This is about *separating* irrelevant branches." |
  | **(b) "It's the Certainty Effect"** | After Revealing Paradox         | "Notice Problem 1 *isn't* certain! X_C has 1% chance of Branch A/B changing it. The 'certain' option vanishes when you see the whole strategy." |
  | **(c) "The Problems Differ!"** | When Showing Overall Lottery  | "Trace the payouts. If you ignore branch labels, X_C vs. Y_C in *isolation* is identical to the choice you get in Branches A+B when comparing X_AB vs Y_AB with an *extra* 89% chance of $1M tacked on. That extra 89% is the common consequence!" |
  | **(d) "Descriptive => Normative False"** | After Stating Axiom           | "This isn't neuroscience! It's a *coherence test*. If you violate it, someone can pump money from you by reversing your choices after branch resolution." |
  | **(e) "Axiom is Predictive"** | When Defining Rationality       | "Key Distinction: EU is *prescriptive* for consistent choice. Prospect Theory *describes* the violation. We're asking 'Should you want to satisfy this?', not 'Do you?'" |
  | **(f) MISSING: "Utilities aren't linear!"** | During Example Debrief      | "Ah! But non-linear utility would distort *both* choices equally. Why flip only when Branch C is isolated?" |

  ---

  ### Your Sticking Points: Resolved
  1.  **Sequential Argument & Dynamic Consistency:**  
      - Yes, it assumes dynamic consistency & consequentialism. **Do say this explicitly!**  
      - Script: "This argument assumes you *commit* to a plan upfront and stick to it when the branch resolves (dynamic consistency), and that you only care about final outcomes (consequentialism). If you reject those, independence violations *might* be rational. But are you willing to let mood swings dictate million-dollar decisions?"  
      *→ Forces engagement: Is your team optimizing for outcomes or feelings-in-the-moment?*  

  2.  **Sealed Envelope Wrinkle (DO IT!):**  
      - Rerun the *same* choices, but now:  
        *"Branch C = A sealed envelope (1% chance) containing a slip saying 'You must choose X or Y here'. Branches A+B = Envelope says 'You get outcome Z'."*  
      - **Why it works:** Violations *strengthen* because ambiguity aversion compounds certainty effect. It's the *same* phenomenon (common consequence neglect), amplified by source preference.  
      - **Why include:** Quants respect source-dependent risk (e.g., Knightian uncertainty). Use it to show independence is *harder* to satisfy than they think. "If you violate it with known probabilities, you'll *definitely* violate it with ambiguity!"  

  ---

  ### Closing & Checks  
  **Diagnostic Question (Test Understanding):**  
  > "Imagine choosing between:  
  > - **Option J:** 40% chance of a full recovery from illness, 60% no change.  
  > - **Option K:** 50% chance full recovery, 50% chance permanent worsening.  
  > You prefer J > K (safer).  
  > Now add a common consequence: 30% chance you die immediately regardless. Does independence say you *must* now prefer:  
  > - **Option J+:** 30% die, 28% recover, 42% no change?  
  > - **Option K+:** 30% die, 35% recover, 35% worsen?  
  > ...Or can you flip to K+ > J+?"  

  *→ Correct Answer:* Independence requires J+ > K+ if J > K. If they think death changes the "meaning" of recovery, they miss the point.  

  **What to BLOCK from Discussion (75-min Limit):**  
  - The vNM Representation Theorem proof.  
  - Prospect Theory’s probability weighting function math.  
  - Generalized models (Rank-Dependent, Ambiguity).  
  - Evolutionary "explanations" for the violation.  
  - Any utility calibration.  

  **Final Script:**  
  *"Independence isn't about being risk-neutral. It's about your choices playing nicely across scenarios that *should* be separable. Violate it, and your future self—or a clever counterparty—can force you into gambles you'd never accept upfront. Whether you obey it is up to you... but now you know the price."*  

  This structure respects their numeracy, leverages their intuition for arbitrage/consistency, and makes the axiom feel like an engineering constraint—not a psych lecture. Good luck!
