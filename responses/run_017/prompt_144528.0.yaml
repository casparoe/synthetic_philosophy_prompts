  The memo structure they requested is practical - needs clear recommendations with actionable steps, not academic waffling. Should probably lean toward more investigation given the unresolved questions, but with tight parameters to address the economist's auditability concerns. Maybe require targeted excavation of one pit with pre-defined criteria for what would confirm/contradict ritual use?

  The descendant community piece needs careful wording - suggest formal consultation to document their perspective for the record while acknowledging the dating issue transparently. Not as evidence per se, but as cultural context.

