  The ordinance's threshold of "institutional practice" is particularly tricky. The economist commissioner raises valid concerns about ritual becoming a catch-all category and the need for cross-site evidence. But the county archaeologist makes a fair point that absence of comparable sites doesn't disprove institutional practice - especially for pre-literate societies where institutions might leave subtle material traces.

  For the oral tradition... tricky. The 1974 recording date after amateur excavations does create circularity concerns. But outright dismissing it feels wrong too - traditions can be ancient even when recorded late. The memo will need to acknowledge both the value and the complication without privileging either extreme.

