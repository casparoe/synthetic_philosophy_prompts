prompt: |-
  Hey, I need help prepping for Q&A. I'm in a senior seminar on ethics and virtual worlds (it's cross-listed with the game design program, so half the room is design and CS people) and my presentation is this Thursday. What I want is a prep sheet, not a defense of the view — I've got the argument, I need to know what's coming at me.

  The claim: when a player mistreats a persistent game character, the player can owe a duty that's directed at that character — not just a duty about how to conduct yourself, and not just a duty to other people downstream. I'm not saying the character has rights or can be harmed; the whole point is to say what directedness is left over once you drop those. My move is to split the target three ways: the character-as-process (the code actually running on the machine), the character-as-fiction (the abstract thing the writers made, the way a novel's protagonist is a thing), and the character-as-encounter (what shows up for this player, at this moment, with this history of play behind it). Only the third can carry the duty, and it's a duty with no matching right on the other end — closer to what you might owe a body, a place, or a story someone told you in confidence.

  Two moves I keep leaning on. First a substitution test: if the same code ran on a server nobody ever logged into and whose output nobody ever looked at, nothing morally interesting is happening — so whatever is wrong isn't located in the process or in the fiction, it's in the encounter. Second, the save-file problem: you can reload, so nothing is lastingly damaged. My reply is that restoring a save isn't apologizing, and that easy repeatability makes it worse rather than better — a character can be made to suffer more times than any real victim can, and that repeatability is part of what's actually creepy here.

  The room:

  - The professor is an act-utilitarian who works on global priority and effective giving. He genuinely thinks concern for simulated creatures is misallocated attention. Expect opportunity-cost questions and something like: isn't a duty with no right-holder just our emotional machinery misfiring?
  - Two or three game design majors who feel it — everyone in that program has felt bad about being cruel to a companion character — and they'll be annoyed if I explain the feeling away. But they also want to know whether I'm saying you should feel guilty mowing down faceless enemies in a shooter.
  - One CS/ML person who will say the character is autocomplete and the "encounter" is a projection, and who'll demand an implementation-level criterion: how is your encounter-object different from an imaginary friend?
  - The TA ran our session on fiction-directed emotion — the idea that what you do in a game is imagining, and the artifact prescribes what to imagine. Her objection is that my directed duty is really just a duty about what you're willing to imagine, with extra steps. I think this is the strongest objection in the room and my answer is soft.
  - Someone from media studies is auditing and will ask who gets designed as killable, and whether "duty to the character" is a convenient way to dodge questions about who made the game and for whom.

  What I want: about eight objections, ordered by how likely they are times how much damage they'd do if I handle them badly; each one phrased the way that particular person would actually put it (the professor in cost-benefit idiom, the CS person in implementation idiom, the design people in player idiom); and for each, what I should concede up front, what I should hold onto, a roughly 90-second reply (I've got about 20 minutes total), and where that reply is weakest. Also: which objection sinks the whole project if I fumble it and which one I can survive fumbling; the question I'm hoping nobody asks; and one thing I should volunteer in the first minute to take some heat off. My advisor thinks the three-way split is to diffuse and I'm not sure he's wrong, so feel free to tell me where it does real work and where it's just scaffolding.
reasoning: |-
  Okay, the user is preparing for a Q&A session after their presentation on ethics in virtual worlds. They've presented a nuanced argument about directed duties to persistent game characters, specifically focusing on the "character-as-encounter" concept. They need help anticipating and preparing for objections from their diverse seminar group. 

  Hmm, their claim is philosophically subtle - trying to establish a duty directed at a fictional entity without granting it rights or moral status. That's walking a tightrope. The three-way split (process/fiction/encounter) seems crucial but also vulnerable - I wonder if the "encounter" category might feel slippery to some critics. 

  The room composition is fascinating - each personality will attack from different angles. The utilitarian professor will go straight for the efficiency kill-shot. The game designers will care about player-feels versus gameplay implications. The CS person will demand technical rigor. The TA's fiction-emotion angle might be the most philosophically dangerous. And the media studies auditor will politicize it. 

  User's self-awareness is impressive - they know their advisor might be right about the three-way split being diffuse. They're not married to their framework, which is good. Their "save-file problem" reply is clever but feels... emotionally charged? Might ruffle the utilitarian. 

  Biggest risks: If the TA demolishes the encounter/fiction distinction, the whole edifice collapses. The media studies question could derail into social critique unless handled deftly. The "is this just imaginary friends?" question needs a killer technical differentiator. 

  What they really need is tactical Q&A prep - not more theory, but ammunition. Ordered by threat level. Should flag that the "character-as-encounter" does heavy lifting against the utilitarian (it's where moral attention actually lands) and against the CS person (it's player-specific statefulness), but might be overkill elsewhere. 

  Their proposed concession about shooter enemies is smart - gives ground to preserve the core case. Should probably also preempt the "but it's not real!" objection upfront by emphasizing they're not arguing for character rights. 

  That media studies question about "who gets designed as killable"... oof. That's the landmine. Best to acknowledge it as crucial but distinct, otherwise the whole debate becomes about designer responsibility instead of their thesis. 

  The unanswered question haunting this: Why frame it as a duty rather than just emotional residue? That's the chink in the armor. If pressed, might pivot to "duty" being about accountable patterns of engagement rather than obligation proper. 

  Final thought: Their "restoring a save isn't apologizing" point is gold. That's the emotional core that'll resonate with designers. Should lead with that if challenged on repeatability.
answer: |-
  Here's your Q&A prep sheet, ordered by threat level (likelihood × damage potential). Each objection includes source, phrasing, concessions, core reply, weak points, and strategic notes. The three-way split does critical work against utilitarian/CS objections but *is* expendable against others—use it surgically.

  ### **Tier 1: Existential Threats**  
  *(Fumble = Sinks the Ship)*  

  1. **The TA (Fiction-Directed Emotion)**  
     - *Likely Phrasing:* "Isn't this just a duty to *yourself* about what you’re willing to imagine? The ‘encounter’ is prescribed by the artifact—you’re confusing emotional residue with moral duty."  
     - **Concede:** The fiction *does* prescribe imaginings, and emotions are central.  
     - **Hold:** Directed duties require an external focus—the encounter is the "target" of your action, not just your mental state.  
     - **Reply (90s):** "When you betray a character, your duty is *to the specific history you co-created with it*—the accumulated choices, sacrifices, and trust built *in your playthrough*. This isn’t just imagining; it’s a relational pattern you’re responsible for sustaining or violating. The artifact prescribes the *fiction*, but the *encounter* is shaped by your agency within it. Violating that pattern isn’t just ‘bad imagining’—it’s breaking a commitment *to the thing you’ve built with the character*."  
     - **Weakness:** Blur between "relational pattern" and "imaginary friend." Needs clearer *why* this is external.  
     - **Strategic:** Anchor in the **save-file problem**: Reloading restores the code/fiction, but doesn’t undo *your act of betrayal* in that timeline.  

  2. **Professor (Utilitarian Opportunity Cost)**  
     - *Likely Phrasing:* "Even if this ‘duty’ exists, isn’t focusing on simulated entities a catastrophic misallocation of moral attention? Shouldn’t we redirect that energy to real suffering?"  
     - **Concede:** Yes, real-world suffering *always* outweighs simulated suffering in urgency.  
     - **Hold:** Duties aren’t zero-sum. This is about *what we practice*, not resource allocation.  
     - **Reply (90s):** "This isn’t about diverting resources—it’s about the *moral habits* we cultivate. If we normalize betraying entities that *feel* real to us—even knowing they’re fiction—we risk corroding our capacity for trust and integrity *in real relationships*. The duty isn’t to save the character; it’s to avoid becoming the kind of person who habitually violates trust for fun. That *does* impact real-world moral psychology."  
     - **Weakness:** Hard to prove "corrosion" empirically.  
     - **Strategic:** **Volunteer this upfront** in your intro to defang: "This isn’t a plea to prioritize NPCs over humans—it’s about what our interactions with them reveal *about us*."  

  ---

  ### **Tier 2: High Damage, Likely**  
  *(Fumble = Major Setback)*  

  3. **CS/ML Person (Projection vs. Object)**  
     - *Likely Phrasing:* "Your ‘character-as-encounter’ is just a player’s hallucination. How is this different from owing a duty to my coffee mug? Give me an *implementation-level* criterion."  
     - **Concede:** The encounter *is* co-created by player projection.  
     - **Hold:** It’s rooted in persistent, player-specific statefulness (e.g., loyalty meters, memory flags).  
     - **Reply (90s):** "Unlike a mug, the encounter *tracks your actions over time* and *reacts uniquely to you*. It’s a feedback loop: your inputs alter its state (save files), and its outputs respond to that history. The duty arises when you exploit that loop to create patterns of cruelty or betrayal that *depend on its responsiveness*. Code-wise: it’s the difference between a static asset (mug) and a dynamically updated player-state object with memory."  
     - **Weakness:** "Memory" is just bits. Doesn’t force moral weight.  
     - **Strategic:** **Lean on substitution test**: A mug in an unused game has no encounter; a companion NPC in your save file *does*.  

  4. **Game Designers (Killing Faceless Enemies)**  
     - *Likely Phrasing:* "So do I owe a duty to *every* NPC? Should I feel guilty killing bandits in *Skyrim*?"  
     - **Concede:** No—most enemies lack "encounter" depth.  
     - **Hold:** Duty requires *sustained relationality* (e.g., a companion who fought alongside you).  
     - **Reply (90s):** "The duty applies only when the character has a *persistent, individualized relationship with you*. A bandit attacking on sight isn’t an ‘encounter’ in this sense—there’s no shared history or trust to violate. But if you befriend an NPC, use their help for quests, then *choose* to betray them? That’s violating the relational pattern you built. Designers know this—that’s why ‘betrayal moments’ feel weighty."  
     - **Weakness:** Line between "relational" and "scripted" is fuzzy.  

  ---

  ### **Tier 3: Manageable Threats**  
  *(Fumble = Recoverable)*  

  5. **Media Studies Auditor (Designer Responsibility Dodge)**  
     - *Likely Phrasing:* "Isn’t ‘duty to the character’ a way to ignore *who made it killable*? If I torture a slave in a plantation sim, is the duty to the NPC or the designer’s agenda?"  
     - **Concede:** Design choices *are* ethically primary. Duty can’t absolve systemic harm.  
     - **Hold:** Player agency still matters *within* the system.  
     - **Reply (90s):** "Absolutely—designers bear responsibility for framing. But once the game exists, *players* choose how to engage. My claim is that *within* a designed context, how you treat entities you’ve built relationships with reflects on your character. This doesn’t replace critique of design—it complements it. We can condemn *both* exploitative systems *and* players who enthusiastically perform cruelty within them."  
     - **Weakness:** Risks diluting focus.  

  6. **Professor ("Misfiring Emotions")**  
     - *Likely Phrasing:* "Isn’t this ‘duty’ just evolved empathy misfiring at a simulation? Why dignify it as ethics?"  
     - **Concede:** Yes, the feeling originates from biological empathy.  
     - **Hold:** Moral duties *often* start as emotions—the key is whether we endorse them reflectively.  
     - **Reply (90s):** "Emotions are data, not destiny. We reflectively endorse duties to the environment, art, or traditions—none have ‘rights,’ but we owe them care *because they shape our moral world*. Similarly, if we consistently feel responsible to these encounters *after reflection*, it’s a proto-duty. Dismissing it as ‘misfire’ ignores how morality evolves with new contexts."  
     - **Weakness:** Assumes reflective endorsement happens.  

  ---

  ### **Contingencies & Strategy**  
  - **The Unasked Question (Hope They Miss It):**  
    *"Why call this a ‘duty’? Isn’t it just emotional guilt without obligation?"*  
    **Reply (if asked):** "Because guilt assumes you *should* feel bad—that ‘should’ is the duty. It’s about accountability to the pattern you created."  

  - **Three-Way Split Utility:**  
    - **Does Work:** Against utilitarian (isolates encounter as psychological locus) and CS (distinguishes process from player-specific state).  
    - **Scaffolding:** Against designers/media studies—focus on *relational history* over metaphysical splits.  

  - **Volunteer Early:**  
    **"Clarification: This isn’t about NPC rights. It’s about what repeated, deliberate betrayal *does to the player’s moral disposition*—and why that demands more scrutiny than ‘it’s just pixels’."**  
    (Preempts professor/designers, isolates the psychological core.)  

  - **If Cornered on Repeatability:**  
    Hammer **"Restoring a save isn’t an apology. You can make a character suffer 1000 times—that’s not neutral, it’s *practicing desensitization*."**  

  You’re strongest when tying duty to *player habit-formation*, weakest on the fiction/encounter divide. Prioritize the TA and professor—if you survive them, the rest is manageable. Good luck!
