  ### Practical Session Design: "Pictures Don't Speak, Conventions Do"  
  **Total Time:** 90 minutes (flexible for late start/slow cleanup)  
  **Materials per Team:** Grid paper (fixed 10x10 cells), pencils, 4 index cards (for keys), sticky notes (for voting), data table (see below).  

  ---

  ### **Phase 1: Introduction & Setup** (5 min)  
  - **Goal:** Frame the task without theory.  
  - **Script:** *"You’re science communicators. Your task: Visually convey the data I give you so a stranger can read it **without words or numbers**. Use only repeated identical symbols (e.g., 🌲 for trees, 👤 for people). Rules: No words, numerals, color, shading, or perspective. Symbols must be identical. Use the grid (one symbol per cell)."*  
  - **Why these bans?**  
    - *No words/numbers:* Forces reliance on symbols, exposing ambiguity.  
    - *Identical symbols:* Prevents "naturalistic" details that imply false universality.  
    - *Grid:* Enforces mechanical scalability (Neurath’s transformability test).  
    - *No color/shading:* Avoids emotional/subjective interpretations.  

  ---

  ### **Phase 2: Creation** (20 min)  
  - **Task:** Teams create a visual panel from their data table using symbols.  
  - **Data Table (Fictional Epidemiology):**  
    | Region  | Population (k) | Disease A Cases |  
    |---------|----------------|-----------------|  
    | North   | 400            | 80              |  
    | South   | 200            | 100             |  
    | East    | 300            | 60              |  
    | West    | 500            | 50              |  

    - **Key Twist:** South has the highest *rate* (50 cases/100k) but moderate *counts* (100). Participants’ background knowledge may assume North (large population) is worst.  
  - **Deliverables:**  
    1. Panel: Symbols on grid (e.g., 👤👤👤 = 30 cases).  
    2. Key: Index card defining symbols (e.g., 👤 = 10 cases). **No words allowed.**  

  ---

  ### **Phase 3: Reading & Wager** (15 min)  
  - **Absent Reader Mechanism:**  
    - Teams swap panels/keys with another group.  
    - **Reader Task:** *"Write what this panel says. What’s the message about Disease A?"* (e.g., "South has most cases").  
  - **Wager System (Calibration Scoring):**  
    - Creating teams bet sticky notes (1–3) on how many of **3 claims** the reader will get right:  
      1. Correct region with highest cases.  
      2. Correct region with lowest cases.  
      3. Correct ordinal ranking (high to low).  
    - **Payoff:**  
      - If reader gets *N* claims right, team wins *N* points.  
      - If team over-bet (e.g., bet 3 but got 1), they **lose all bet points**.  
    - **Why this works:** Rewards teams that prioritize clarity (explicit keys) over "pretty" symbols. Overconfident artists lose points.  

  ---

  ### **Phase 4: Transformation Challenge** (20 min)  
  - **Task for Readers:** *"Re-express this panel as **rates per 100k people** using only the panel and key. No original data!"*  
    - Readers get population data *only now*:  
      ```  
      North: 400k  
      South: 200k  
      East: 300k  
      West: 500k  
      ```  
  - **Intentional Failure:**  
    - Panels lack denominators (populations), making rate calculation impossible without external data. Readers will struggle or guess.  
    - **Debrief Hook:** Reveals pictures omit information "naturally" (claim #1).  

  ---

  ### **Phase 5: Scoring & Reveal** (10 min)  
  - Calculate wager results.  
  - Share reader interpretations vs. source data.  
  - **Key Moment:** Show how South’s high rate was invisible in count-based panels. Teams who bet low (prioritizing clarity) win; overconfident teams lose.  

  ---

  ### **Debrief** (20 min)  
  **Map to Neurath’s Claims:**  
  1. **Pictures aren’t self-interpreting (Convention):**  
     - *Trigger Question:* "Why did readers misinterpret your panel?"  
     - *Participant Insight:* "Our tree symbol looked like a forest, not disease!" → **You say:** "Exactly. Neurath argued symbols need taught conventions, like words."  
     - *Activity Link:* Misread keys (e.g., identical symbols confused).  

  2. **Test is transformability, not "naturalness":**  
     - *Trigger Question:* "Why couldn’t you calculate rates?"  
     - *Participant Insight:* "The panel didn’t show population!" → **You say:** "Neurath’s ‘picture statistics’ demanded data be mechanically re-scaled. Your panels couldn’t transform because they lacked standardized denominators."  
     - *Activity Link:* Failed rate challenge.  

  3. **Words/pictures are equally ambiguous:**  
     - *Trigger Question:* "Was banning words helpful or harmful?"  
     - *Participant Insight:* "We needed words to explain symbols!" → **You say:** "Neurath said both words and pictures are ambiguous. Clarity comes from rules, not ‘universal’ images."  
     - *Activity Link:* Teams smuggling labels (e.g., tiny "N" for North).  

  **Closing Line (You Must Say):**  
  > *"Neurath’s point wasn’t that pictures lie, but that they’re silent without conventions. A ‘self-explanatory’ chart is an oxymoron—it’s always teaching you its language first."*  

  ---

  ### **What Will Go Wrong & Fixes**  
  - **Smuggled labels:** Catch during creation; remind rules. Use as debrief example for claim #3.  
  - **Confident graphics editor:** Their "intuitive" panel will lose wagers if unclear → shows overconfidence penalty.  
  - **Reader guesses from real-world knowledge:** E.g., "North has more people, so more cases!" → Debrief: "You ‘knew’ South wasn’t worst, but data said otherwise. Pictures didn’t correct you."  
  - **Transformation too easy (hoarded data):** Collect all source tables after creation. Enforce "absent reader."  
  - **"Pictures are unreliable" conclusion:** Counter: "No—they’re unreliable *without conventions*. Isotype standardized symbols like a language."  

  ---

  ### **Limit of the Exercise**  
  **What You Can’t Stage:**  
  Neurath’s full system relied on *trained publics* and *centralized transformation* (e.g., resizing symbols for new data). Your exercise shows **why** standardization matters but can’t replicate decades of societal training.  

  **Final Words:**  
  > *"In 90 minutes, we’ve seen why Neurath hated ‘let the numbers speak.’ But his solution—Isotype’s rigid rules—isn’t practical journalism. Take this: Clarity isn’t about removing yourself, but teaching readers your visual language. If you leave with one thing: Never say a chart is ‘self-explanatory.’ It’s a lie we tell ourselves."*  

  ---  
  **Data Table Rationale:** Epidemiological data punishes assumptions (South’s high rate surprises). Teams must read the table, not default to population stereotypes. Grids force scalability (Neurath’s transformability). Wagers incentivize simplicity, exposing the "art project" trap.
