          - Readers who guess the content from real-world knowledge: We chose data that contradicts expectations. For example, if they think "Southland must be hot and have more disease", but our data has Southland with a high rate but they only see absolute cases. But in the interpretation phase, they are only asked for counts. So if they see 80 cases in Southland and 100 in Northland, they should record that. The real-world knowledge might lead them to think that's reasonable or not, but it doesn't change the count. So it shouldn't affect the count interpretation.

          - Planted misreader: We don't need to plant; we can have natural variation.

          - Transformation task turning trivial because a team hoarded the table: We collected the panel and the key, and the reader doesn't have the table. The creating team keeps their table, but the reader doesn't see it.

          - Session ending with people concluding that pictures are just unreliable: We counter in the debrief by pointing out that words are unreliable too, but we use conventions and training to make them work. The point is to use conventions and to design for transformability.

