prompt: |-
  I write about science and ideas, and I've agreed — perhaps rashly — to run a practical session at a science-journalism conference rather than sit on another panel. The slot is ninety minutes. About twenty people: reporters, four or five graphics editors, two or three press officers, aged roughly twenty-five to sixty, nearly all of them impatient with anything that sounds like theory and several of them committed to the view that the journalist's job is to get out of the way and let the numbers speak for themselves. The room has long tables seating four, a projector I'd rather not use, wifi that will fail if I depend on it, and no budget, so: paper, index cards, sticky notes, pencils, and whatever fits in a bag I carry myself.

  The subject I want them to walk into is Otto Neurath's picture-language work — the Vienna Method, the picture statistics of the interwar years — and specifically the part of it that is the opposite of what his reputation suggests. Three claims, as I understand them. First, that pictures do not speak for themselves: a drawing is not self-interpreting, and the reader of a pictogram has to be taught a convention exactly as the reader of a sentence does. Second, that the test of a picture language is not whether a picture looks right or strikes you as natural, but whether it can be *transformed* — whether the same content can be mechanically re-expressed, rescaled, re-sorted, or converted from one formulation into another, so that what the picture asserts can be checked against other pictures and against numbers rather than merely admired. Third, that words and pictures are not different in kind here: words are irreducibly ambiguous, pictures are ambiguous too, and a picture language buys clarity not by resembling the world but by standardization and training. This is, I take it, why Neurath was hostile to the Tractatus-flavoured idea that a proposition is a logical picture of reality and therefore carries its own sense in itself. What my participants will bring in the door is the opposite: that images are immediate, universal, cross-cultural, harder to lie with than prose, and that a good chart is self-explanatory.

  So I need a runnable session, not a lecture. The constraint I care most about is that they should hit these points by doing something and failing at it, and only afterwards hear them named. I do not want to say the word Isotype, or transformation, or convention, until the debrief.

  What I'd like from you is the whole apparatus. The task and its phases, with timings that fit ninety minutes including a late start and a slow cleanup. The rules and material constraints that do the philosophical work: I have in mind forbidding all words and all numerals in a first round so that quantity has to be shown by repetition of identical signs, banning colour and perspective and shading, and forcing a fixed grid — but tell me what each ban is *for*, which ones earn their keep, and which will just produce an art project. Most importantly, two mechanisms I've been turning over and can't quite engineer. The first is an absent reader: each team's panel must be read by someone who never saw the source table and was not in the room when it was drawn, and that reader must then perform a transformation on it — restate the panel's claim as rates rather than counts, or re-sort it by a second variable, or re-express it for a population twice the size — without being handed the data, only the panel and whatever key the team wrote. I want them to find that the picture silently omitted the denominators, and that the omission is not a drawing mistake but a fact about what a picture can hold. The second is a wager: teams stake points on how many of three stranger-readers will recover their claim, with a payoff scheme that costs nothing and doesn't need money, arranged so that overconfidence is expensive and so that the teams who win are the ones who spent their effort on an explicit rule rather than on a prettier drawing. Fix the scoring so it actually does that. Tell me what data table to give them — my own thought is something epidemiological or climatological, but I suspect the right choice is a table whose ordering disagrees with what participants' background knowledge leads them to expect, so that recognition gets punished and only reading pays.

  Give me also the debrief, mapped: which moment in the room corresponds to which of the three claims above, in what order I should draw them out, what I should let a participant say rather than saying myself, and which line I must deliver because the activity can't produce it. Be blunt about what will go wrong on the first run — smuggled labels, someone drawing a map, the team with a confident graphics editor, readers who guess the content from real-world knowledge instead of the signs, a planted misreader who gets unmasked, the transformation task turning trivial because a team hoarded the table, the session ending with people concluding that pictures are just unreliable — and what I should do in each case. And be equally blunt about the limit: tell me which feature of Neurath's position this kind of exercise cannot stage, so that I know what I am obliged to say out loud at the end and what I should openly decline to demonstrate in ninety minutes with paper and pencils.

  One last thing: I'm not asking for citations, a bibliography, or a reading list — I can't check them from a conference hall and they'd be useless to me there. If I've misstated Neurath in a way that would sink the design, flag it in a clause and correct the design, don't correct me at length.
reasoning: |-
  We are designing a 90-minute practical session to teach three key claims about Otto Neurath's picture-language work without using theoretical language upfront. The claims are:
  1. Pictures are not self-interpreting; they require conventions.
  2. The test of a picture language is its transformability (re-expression, rescaling, resorting).
  3. Words and pictures are both ambiguous; clarity comes from standardization and training.

  We want participants to experience these through a hands-on activity and then debrief. The activity will involve creating pictographic panels from data and then having others interpret and transform them without access to the original data.

  Constraints:
  - No lecture; activity-based.
  - No words or numerals in the first round (only identical repeated symbols to show quantity).
  - Ban color, perspective, shading.
  - Use a fixed grid.
  - Each team's panel must be read by an "absent reader" (someone not present during the creation) who then performs a transformation task (e.g., restating as rates, resorting by another variable, rescaling for a different population) using only the panel and a key (if provided).
  - A scoring system that penalizes overconfidence and rewards explicit rules over artistic effort.

  Room setup: About 20 people, long tables seating four. Materials: paper, index cards, sticky notes, pencils. Avoid projector and unreliable wifi.

  Structure:

  1. Introduction (5 min)
  2. Activity Part 1: Creating the Pictograms (25 min)
  3. Activity Part 2: Reading and Transformation (25 min)
  4. Activity Part 3: Scoring and Reflection (10 min)
  5. Debrief (25 min)

  Total: 90 minutes (allowing for late start and cleanup).

  Detailed Plan:

  I. Introduction (5 min)
     - Welcome, state the goal: "Today we're going to explore how we communicate data visually. You'll be working in teams to create a visual representation of some data, and then we'll see how well others can interpret and use it."
     - Form teams: 5 teams of 4 (if exactly 20) or adjust as needed. Assign each team a table.
     - Explain the rules for the creation phase (without theory):
          - "You will receive a data table. Your task is to create a visual representation (a panel) of this data using only pictures. No words, no numbers, no letters. You can only use identical symbols (e.g., if you are representing people, use the same stick figure every time)."
          - "You must use a fixed grid (provide grid paper). Each cell in the grid can hold one symbol. So, if you have 10 of something, you must draw 10 symbols (each in a cell)."
          - "No color, no shading, no perspective. Only black and white, line drawings."
          - "You may create a key (legend) using symbols only (no words)."
          - "You have 25 minutes."

  II. Activity Part 1: Creating the Pictograms (25 min)
     - Hand out materials: grid paper, pencils, and data tables (one per team). Also, index cards for the key.
     - Data table choice: We need a table that has at least two variables (e.g., categories and counts) and where the ordering might conflict with expectations. Example: Epidemiological data on disease cases in different regions, but with a twist.

     Example table (fictional, for simplicity and to avoid real-world bias):

          Region      | Population (thousands) | Cases of Disease X (last year)
          ------------|------------------------|------------------------------
          Northland   | 500                    | 100
          Southland   | 200                    | 80
          Eastland    | 400                    | 60
          Westland    | 300                    | 90

     Note: The counts are absolute. The twist: if participants expect that more population means more cases, they might be surprised because Southland (small population) has more cases per capita than Northland (large population). But note: we are banning denominators in the first representation because we want them to represent absolute counts only.

     - Teams create their panels. They must show the four regions and the number of cases. They cannot show population (because we are setting up for the transformation to rates to fail without the denominator).

     - Circulate to enforce rules: no words, no numbers, only identical symbols, grid. If a team uses shading or color, remind them it's banned.

  III. Activity Part 2: Reading and Transformation (25 min)
     - Collect the panels and keys (if any). Each team keeps a copy of their own data table (but we don't want the readers to see it).
     - Assign readers: Each team's panel will be read by a different team (rotate). Also, we need an "absent reader" for each panel. We can do this by having two phases:

          Phase A: Reading (10 min)
            - Each team (now acting as readers) is given a panel (from another team) and its key (if provided). They are also given a task: "Write down what you think this panel is showing. What are the numbers for each region? (You can write numbers now.)"
            - They must record their interpretation on an index card.

          Phase B: Transformation (15 min)
            - Now, without seeing the original data, the same reader team is given a transformation task for the panel they just interpreted. The task: "Re-express the data as rates (cases per 100,000 population)." BUT they are not given the population data! They only have the original panel (which only has cases) and their interpretation. They must attempt the transformation and note the result.

     - However, note: the transformation task requires population data, which was not in the panel. So they cannot do it. This is by design.

     - Alternatively, to avoid frustration, we might have two transformation tasks: one that is possible without extra data and one that isn't. But we want the failure to be revealing.

     Revised plan for Transformation:

          We tell the readers: "We are going to give you two tasks. First, re-sort the regions by the number of cases (from highest to lowest). Second, re-express the data as rates per 100,000 population. You must use only the panel and the key."

          Then, after they struggle, we reveal that the population data is missing. But that revelation comes in the debrief.

     - However, we must have the transformation tasks written down so they know what to do. But note: we don't want to give the population data because then they would just recalc. We want them to realize that the panel doesn't contain the necessary information for rates.

     - So we do:

          Task 1 (possible): Re-sort the regions by the number of cases (ascending or descending). They can do this because they have the counts from their interpretation.

          Task 2 (impossible without more data): Re-express as rates per 100,000. They are given the population data only after they attempt (or fail) and then we see what they do.

     But wait: we don't want to give the population data until the debrief? Actually, we can give it to them during the transformation phase, but note: they must attempt without it first? That might be too frustrating.

     Alternative: Have two sets of transformation tasks, and assign one per team. Some teams get a transformation that is possible (like resorting) and some get the impossible (rates). But then the experience isn't uniform.

     Better: We have two steps:

          Step 1: Resorting (possible) - they can do this by rearranging the regions based on the counts they interpreted.

          Step 2: Rates - they are told: "Now, we want you to show the same data as rates per 100,000. Here is the population for each region (hand them a card with the population)." Then they attempt to create a new panel for rates, but using the same rules (no words, grid, etc.). However, the original panel didn't have the population, so they have to add a new set of symbols? But they don't have the population in the original panel so they cannot use the same visual language? This might be messy.

     Revised Transformation Phase:

          After the reading phase, the reader team is told: "We are now going to do two things. First, we want you to re-sort the data by the number of cases (from highest to lowest) and draw a new panel for that. Second, we want you to convert the data to rates per 100,000. For the rates, we will give you the population data, but note: you must use the same visual rules (only symbols, no words, grid) and you cannot use the original data table (only the panel and the key you have)."

          Then, each reader team gets the population data (on a card) for the regions. They must create two new panels: one for the resort and one for the rates. They have 15 minutes for both? That might be tight.

     Alternatively, we split the transformation tasks among teams. But let's keep it simple and focus on the failure.

     We decide: The transformation phase has two parts, but we are most interested in the rates because it requires the denominator that wasn't in the original panel. So we do:

          - Task 1 (resort): They can do it and it should work if their interpretation was correct.
          - Task 2 (rates): They are given the population data and asked to create a new panel for the rates. They will have to combine the case counts (from the panel) and the population (from the card) to compute rates and then represent the rates with symbols. This is possible, but it shows that the original panel didn't have the information for rates. Also, note: they are representing rates, which are continuous numbers, with discrete symbols? That might be problematic (but that's part of the point).

     However, the original claim is about transformability: the same content must be mechanically re-expressed. But the original panel only had absolute cases, not rates. So to transform to rates, we need additional data. The point is that the picture doesn't contain everything.

     IV. Activity Part 3: Scoring and Reflection (10 min)

     We introduce a scoring system that rewards accuracy and penalizes overconfidence.

     Before the reading phase, we have the creating teams wager on the success of the readers. We do this at the beginning of Part 2.

     How it works:

          - After creating their panel, each team is asked: "How many of the three interpretation questions (we will have three readers per panel? but we have only 5 teams) will your panel get right? We are going to have three readers for each panel. Each reader will answer: (1) What are the counts for each region? (2) [resorting task?] (3) [rates?] But we don't have three readers per panel due to time and numbers.

     Revised scoring:

          We have one reader per panel. The reader team will answer:
            - Interpretation: the counts for each region (we can break into four numbers, one per region).
            - Transformation 1: resorting (correct order of regions by cases).
            - Transformation 2: rates (they produce a panel, but we don't have time to check it?).

     This is getting too complex.

     We simplify:

          We focus on the interpretation of the counts. We have one reader per panel. The creating team must wager on how close the reader will get to the true counts.

          How: The creating team writes down their claimed counts (from their data) and the reader writes down their interpreted counts. We compare.

          Scoring: 
            - Before the reading, the creating team wagers 0 to 3 points on whether the reader will get the counts exactly right for all four regions. If they wager 3 and succeed, they get 3 points. If they wager 3 and fail, they lose 3. If they wager 0, they get 0 regardless. But we want to encourage accurate wagering.

          Alternatively, we use a calibration scoring: 
            - The creating team estimates the number of regions (out of four) that the reader will get exactly right. Then, if they estimate N and the reader gets M right, the team's score is max(0, 4 - |N-M|). This rewards accurate estimation.

          But we also want to reward the team that made a clear panel. So we can have two scores: 
            - Score for the creating team: calibration score (how well they predicted the reader's accuracy).
            - Score for the reader: how many regions they got right.

          But we want the creating teams to focus on clarity (which would lead to high reader scores) but also to be calibrated (so they don't over-wager).

          We design:

            Step: After creating the panel, the creating team writes down:
              - Their prediction: How many of the four regions' counts will the reader get exactly right? (P, between 0 and 4)
              - Then the reader does the interpretation and gets M right.
              - The creating team's score for this part is: 5 - |P - M|   [max 5, min 0?] 

            Why? If they are perfectly calibrated (P=M), they get 5. If they are off by 1, they get 4, etc.

            Additionally, we can give the creating team a bonus if M is high? Not necessary because if they are clear, M is high and they can set P high and get a high score.

          Then, for the transformation tasks, we don't score because they are more about the process. We'll discuss the failure in the debrief.

     Given time, we do:

          - Wagering only on the interpretation of counts.

     Steps:

          At the end of Part 1 (creation), each creating team writes their prediction (P) on an index card and gives it to the facilitator.

          In Part 2 (reading), each reader team writes down their interpretation of the counts for the four regions (M1, M2, M3, M4 for each region).

          Then, we compute M (the number of regions where the interpreted count is exactly equal to the true count).

          Then, we reveal the true counts and the interpretation. Then we compute the creating team's score: 5 - |P - M|.

     We do this quickly in Part 3.

     Also, the transformation tasks are done, but we don't score them. We use them for discussion.

     V. Debrief (25 min)

     We draw out the three claims.

     Structure:

     1. Start with the scoring: "Let's look at the scores. Team A predicted P and got M, so their score is ..." Then ask: "Why did some panels work better than others? What made a panel easy to read?" 
          - Expect: they will say clarity of symbols, layout, etc. 
          - We want to lead to: the need for conventions. If a team used an unusual symbol, it might have been misinterpreted.

     2. Then, discuss the transformation tasks:

          - Resorting: "Was it easy to re-sort the data? What did you need?" (They needed the counts, which they got from the panel, so if the panel was clear, it worked.)

          - Rates: "What happened when you tried to compute rates? What information was missing?" 
            - They will say they didn't have the population. 
            - Then: "But the original panel didn't have the population. Why not?" 
            - We lead to: the panel only showed what the creators chose to show. It doesn't automatically include everything. So a picture doesn't speak for itself; it only speaks what the creator puts in.

          - Also, note: "When you made the rates panel, what challenges did you face?" 
            - They might say that representing rates (which might be fractional) with whole symbols is hard. This leads to the need for conventions and the idea that pictures are not natural but rely on rules.

     3. Then, draw out the three claims:

          Claim 1: Pictures require conventions. 
            - Evidence: Some symbols were misinterpreted. Without a key or with an unclear key, it failed. Even with a key, the key itself required interpretation.

          Claim 2: Transformability is key. 
            - The resorting was a transformation that worked because the panel had the necessary information. The rates transformation failed because the panel didn't have the population. Also, note that the rates panel they created might be hard to interpret without a key? And that the transformation required a mechanical process (division) that the picture doesn't do for you.

          Claim 3: Pictures and words are both ambiguous. 
            - We can point out that even though they banned words, they had to use symbols that are like words. And the key is a convention that must be learned. Without training, the reader might not understand.

     4. Finally, we reveal the connection to Neurath: "What we've been exploring is related to the work of Otto Neurath and his picture language. He argued that ..." and state the three claims.

     What will go wrong:

          - Smuggled labels: Someone writes "North" on a region. Enforce the rule: no words. Have a facilitator watching.
          - Someone drawing a map: If the data is by region, they might draw a map. Ban it? Or allow it? We banned perspective and shading, but not necessarily a schematic map. But we want to force the use of symbols. So we should say: "You cannot use maps. Represent each region by a symbol or by position in the grid (like a bar chart)." So we must explicitly ban maps? Not necessarily, but if they draw a map, then the regions are represented by geography, which might be ambiguous. We can let it happen and then in the debrief point out that if the reader doesn't know the geography, it fails. So it's a teaching moment.

