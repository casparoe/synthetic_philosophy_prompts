prompt: |-
  I'm working on a piece about history told with non-human leads — plague bacillus, the 1918 flu, Tambora, El Niño — and I keep running into the same argument, so let me hand it to you as a prediction problem.

  The showrunner of a documentary series I'm profiling decides pitches by asking wether the non-human thing at the center is really an "actor" in the story or just scenery. Her calls so far: Yersinia pestis in the 1300s, actor; the 1918 influenza virus, scenery (a virus doesn't do anything, it just gets spread around, she said); Phytophthora infestans in Ireland, actor; the storms that scattered the Spanish Armada, actor; a mountain range channeling migration and invasion routes, scenery; a decades-long drought behind the abandonment of a city, scenery, that's wether plus bad government; soil exhaustion on a plantation island, scenery. She's also killed pitches for being geography with a pulse, so there's a line somewhere she doesn't want to cross.

  New pitch on her desk: Tambora in 1815 and the year without a summer. Nobody in Europe or New England knew a volcano had done it, the effects landed a year later and thousands of miles away, and they run through failed harvests, grain prices, migration, and maybe the first cholera pandemic. One of her researchers has floated a test I can't stop thinking about, call it the swap test: something is an actor only if you can swap in a different eruption, a different bacterium, a different drought, and still get a recognizably different history out the other end.

  So: does she call Tambora an actor? Which rule is she actually running — living vs non-living, sudden event vs slow background, wether people at the time could have pointed at it, wether the thing reacts to what humans do — and which of those come apart on this case? And what one further pitch would settle which rule she means?

  Give me exactly five numbered points, a sentence or two each, no intro and no sign-off, I'm pasting this straight into my notes.
reasoning: |-
  Hmm, the user is working on a piece about history with non-human leads and needs help predicting whether a documentary series showrunner would classify the Tambora eruption as an "actor" or "scenery." They've described the showrunner's pattern: plague bacillus (actor), 1918 flu (scenery), etc., and introduced a "swap test" proposed by one researcher—where something is an actor only if swapping it would change history recognizably. I need to analyze this for Tambora and figure out the underlying rule.

  First, I'll recall the examples given: living things like Yersinia pestis and Phytophthora infestans are actors, while non-living things like the 1918 flu virus (treated as non-actor), storms (actor), mountain ranges (scenery), droughts (scenery), and soil exhaustion (scenery) show a mix. The key seems to be more than just living vs. non-living, since storms are actors. Sudden events like storms are actors, while slow processes like droughts or geography are scenery. But Tambora is a sudden volcanic eruption with delayed, widespread effects—similar to storms, which were actors.

  Applying the swap test: if we swapped Tambora with a different eruption, say one that was smaller or in a different location, the outcomes would be different—maybe less crop failure, no cholera link, altered migrations. That makes it seem like an actor. But the showrunner called storms actors, so consistency might point to Tambora being one too.

  Now, digging into the implicit rules. It's not just about suddenness or living status; it might be about agency or how the thing interacts. For instance, the flu virus was labeled scenery because it doesn't "do anything" actively—it's passive in spread. In contrast, plague bacillus "acts" by infecting. Tambora actively erupted and caused climate change, so it has agency. Also, people at the time couldn't point to it, but that didn't matter for storms, which were actors. So that factor might not be crucial.

  To settle the rule, I need to suggest a pitch that tests boundaries. Something like an insect-driven event—say, locust swarms. If they're actors, it emphasizes living agency; if scenery, it points to sudden vs. slow. Or maybe a climate pattern like El Niño: if called an actor, it challenges the suddenness idea since it's periodic, not a one-off event.

  Summarizing, my five points cover: Tambora as actor based on the swap test and precedent, the rule likely being about agency (does it do things actively), how this resolves ambiguities in the case, a test pitch like locusts to clarify, and why that pitch would reveal the rule.

  Finally, I'll make sure the response is concise—five numbered sentences—as requested, no extras.
answer: |-
  Here are five points for your notes:

  1.  **She calls Tambora an actor.** The swap test succeeds: swapping Tambora for a different-sized eruption (e.g., Krakatoa-scale or smaller) or location would drastically alter the severity and geographic spread of the "year without a summer," changing harvest failures, migration patterns, and potentially the cholera pandemic's course.

  2.  **The core rule is likely "possesses agency or force that initiates distinct causal chains."** This distinguishes actors (plague bacillus acting on hosts, Phytophthora infestans blighting crops, storms sinking ships, Tambora altering global climate) from scenery (geography passively channeling, drought/soil exhaustion as slow background conditions enabling other failures, the flu virus seen as passively spread).

  3.  **This rule comes apart on "living vs non-living" and "people's awareness."** Storms/Tambora (non-living, unseen initiators) are actors, while the flu virus (living) is scenery. People's inability to point to Tambora (like the unseen virus) doesn't disqualify it because its *force* (climate disruption) is the undeniable, distinct initiator.

  4.  **To settle the rule, pitch "locust swarms driving 19th-century agricultural crises."** If locusts are actors (swarming *is* the distinct destructive force), the rule emphasizes active force/agency. If scenery (just a "pulsed" environmental stressor), the rule leans towards sudden, discrete events being actors regardless of biology.

  5.  **The swap test clarifies but doesn't fully define her rule.** Swapping locusts for a different insect plague or a sudden hailstorm would change history – but her call hinges on whether she sees the swarm *itself* as the acting agent or just another environmental pulse.
