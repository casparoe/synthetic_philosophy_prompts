  ### Mechanism and Structural Plan
  The villanelle dramatizes **rational informational herding**: a cascade where individuals, acting on Bayesian reasoning, ignore private evidence to follow prior public actions—despite no reputational pressure. Each rationally updates beliefs based solely on cumulative choices, not underlying data.  
  - **Refrain 1 (private evidence)**: "My plot showed sunseed's gold." Starts strong, weakens tonally via context.  
  - **Refrain 2 (crowd choice)**: "The queue chose shade." Gains weight through repetition as unanimity solidifies.  
  - **Stanzas 1–5**: Trace the cascade. Early stanzas show deliberation; later ones depict automatic conformity.  
  - **Final quatrain**: Converges refrains to highlight epistemic fragility. A stark, unadorned tally line ("But trials: eighty sun, twenty shade") breaks the form, exposing the crowd’s error. The hollowed-out final refrain underscores that actions, not reasons, propagated.  
  - **Ambiguity**: The tally’s late arrival leaves open whether early disclosure would have prevented or accelerated herding.  

  ### Refrain Sketches
  1. **Private evidence**: "My plot showed sunseed's gold."  
     - *Rationale*: "Gold" implies empirical richness; "sunseed" contrasts with "shade," subtly framing the better option.  
  2. **Crowd choice**: "The queue chose shade."  
     - *Rationale*: "Queue" implies fixed order; "shade" becomes metonymic for the inferior seed. Passive voice emphasizes faceless consensus.  

  ### Villanelle: *The Cascade*  

  At spring’s first meeting, voices clear and bold,  
  The first house chose the shade seed for the field.  
  *My plot showed sunseed’s gold.*  

  The second echoed, third: “Shade!” Fourth: “We hold  
  The same.” The fifth then rose, their reason sealed—  
  *The queue chose shade.*  

  Though in my rows the sunseed’s green unrolled  
  Strong stalks, what weight one trial when all yield  
  To what the queue chose? Shade.  

  I spoke “Shade.” Next, no glance at earth or sky, enrolled  
  In silence. Next: “Shade.” Now the choice congealed—  
  *My plot showed sunseed’s gold?*  

  Each saw long concord, thought dissent a flaw.  
  No soul lied, no one bowed or begged or cajoled.  
  *The queue chose shade.*  

  The meeting closed. We’d sown as one. The tally told:  
  But trials: eighty sun, twenty shade.  
  *My plot showed sunseed’s gold.*  
  *The queue chose shade.*  

  ### Revision Check  
  - **Mechanics alignment**:  
    - Private refrain weakens: Stanza 1 (assertive) → Stanza 3 (doubtful) → Stanza 5 (fragmentary question).  
    - Crowd refrain strengthens: Stanza 2 (initial choice) → Stanza 4 (cascade) → Final stanza (hollowed by tally).  
    - **Final quatrain**: Tally line ("But trials: eighty sun, twenty shade") is deliberately prosaic, breaking iambic flow. Crowd refrain afterward feels empty, echoing cascade fragility.  
    - **No reputational pressure**: Agents "no soul lied, no one bowed" act purely evidentially.  
    - **Ambiguity intact**: Tally arrives post-decision; early disclosure’s impact remains unresolved.  
  - **Philosophical recognition**:  
    - Herding scholars will note Bayesian updating from sequence-dependent actions.  
    - General readers grasp a valley’s collective error without jargon.  
  - **Form as function**: Repetition embodies recursive reasoning; tally’s disruption mirrors evidence breakdown.  

  Edits made: "enrolled / In silence" clarifies observational learning; "congealed" implies irreversible consensus. Final stanza’s "told:" enjambment heightens tally’s jarring effect.
