answer: |-
  The damp smell of closing-up permeated the Observatorio del Sur. Rain lashed the dome, and Marta, wiping condensation from the logbook’s leather cover, felt the familiar ache of finality. Six years of clear nights logged in precise, looping script. Spring would see the telescope crated, the cottage emptied. She was the last night assistant; the astronomer, Dr. Rossi, had already departed for Buenos Aires, leaving Marta to wind down the clockwork of the place until the university sent packers.

  Last night, however, had been unexpectedly clear. A brief, crisp window. She’d opened the dome by hand, the familiar groan echoing in the silence, and spent the hours guiding the old refractor towards targets Rossi had left scribbled on a notepad – faint galaxies, dying stars. The usual rhythm: check the eyepiece, adjust the drive, note the time from the shortwave receiver’s steady *tick-tick-tick*, then write it all down. The log was sacred, Rossi always said, the only truth against the void.

  This morning, she opened the book to the last entry. Her breath caught.

  There were *two* entries for March 17th.

  Both in her handwriting. Both detailing the same targets: NGC 253, Eta Carinae, the variable star R Coronae Borealis. Both noting the crisp seeing, the chill. Both timed meticulously by the shortwave clock. Identical, down to the smudge of ink near the date… except for one word.

  In the top entry, under R Coronae Borealis: *"Suspected irregular dimming. Focus confirmed sharp at 02:17."*

  In the bottom entry, under the same star: *"Suspected irregular dimming. Focus *drifted* at 02:17."*

  *Suspected*. *Confirmed*. *Drifted*.

  Marta traced the words. Her own letters. The pressure of the pen, the slight wobble on the ‘d’ in ‘drifted’ – both utterly hers. She remembered the moment clearly: R Cor Bor flickering strangely. She remembered checking the focus knurled knob, feeling the slight resistance. Had it held? Had it slipped? She *felt* both memories with equal vividness. The solid click of the gear holding fast. The slight, betraying give under her fingertips. Both sensations were immediate, real, layered over each other like double-exposed film.

  She checked the photographic plates from last night. Only one set existed. They showed R Cor Bor, its light captured. But was the focus perfect? Or slightly soft? She couldn’t tell definitively by eye. The difference might only show under Rossi’s measuring microscope, now packed away in Buenos Aires. The ambiguity felt like a physical pressure behind her eyes.

  Her friend and colleague, Enrique, the caretaker (and her only company for the last month), found her sitting rigidly at the desk hours later, the log open. He scanned the pages, his practical mind grappling with the impossible duplication.

  "Must’ve written it twice by mistake," he offered, frowning. "Tired. Nodded off?"

  Marta shook her head, pointing to the differing words. "I remember doing both. Not one after the other. Both… at once. Or… both valid." Her voice was thin. "The focus was sharp. The focus drifted. Both happened."

  Enrique squinted. "But the plate is only one plate. The night, it was only one night, Marta. You can’t have both. You must have written one, then forgot and wrote the other, mixed up."

  "But which one?" she asked, not really asking him. The question felt heavy, clumsy, like asking which breath you just took was the real one. The evidence was the log itself, screaming its contradiction. The *reality* was the impossible coexistence in her memory – the certainty of the knob holding, the certainty of it slipping. To ask "which one *really* happened?" felt like trying to separate the two overlapping images on the plate; the harder you looked, the more they blurred into a single, confusing truth.

  The rain continued. The shortwave receiver clicked, marking seconds that suddenly felt less like arrows and more like circles. Marta closed the log, the worn leather cool against her palm. She felt a strange doubling within herself. Not confusion, but a kind of… wholeness that contained the contradiction. She hadn’t split; the paths had forked and then, somehow, inexorably, flowed back into the same riverbed, carrying both currents.

  Then came the thought, cold and sharp: the focus.

  If the focus *had* drifted during that crucial minute of suspected dimming on R Cor Bor… if the image was soft… the plate was compromised. Rossi’s last requested data point, potentially useless. A tiny failure in the final act. Not catastrophic, but a flaw. *Her* flaw, in one of those branches.

  But in the other branch, she’d caught it. She’d confirmed the focus was sharp. The data was pristine.

  Enrique saw her expression change. "What is it?"

  "The plate," she murmured. "If the focus drifted… Rossi’s measurement…"

  "Ah," Enrique sighed, understanding. "Well. You’ll have to note the uncertainty in the final report. Say the focus check was ambiguous. It happens."

  But it *didn't* just happen. It happened in one world and didn’t in another. And she was responsible for both.

  That was the weight Enrique couldn’t grasp. It wasn't about *not knowing* which branch she was from. It was that both branches had *happened*, and both ended in *her*, sitting here, holding the log and the flawed plate. The Marta who had been vigilant felt the relief of having done her job perfectly at the end. The Marta who had let the focus slip felt the hot shame of a small, final negligence. Both feelings were hers, simultaneous, undeniable. She couldn’t disown the negligent one because the vigilant one was equally present. They were the same person, bearing the consequences – the *emotional* consequences – of actions taken on diverging paths.

  **Did she owe Rossi an apology?** For the focus drifting? But it hadn't drifted… or had it? Apologizing felt dishonest to the version of her that *had* kept it sharp. Yet, *not* acknowledging the potential error felt like a betrayal of the version that failed.

  **Could she feel unalloyed relief?** That the data might be perfect? Not when she also carried the knowledge that it might be marred. The relief was tinged with the residue of the other possibility.

  The paths had rejoined, yes. But they left sediment. Guilt without a crime. Relief without certainty. Responsibility for an act she both committed and did not commit.

  She spent the afternoon alone in the cottage, the logbook on the table. She didn’t try to cross anything out. She simply wrote, below the doubled entry, in her clear hand: *"Final plate of R Cor Bor exposed during suspected dimming event. Focus status at time of exposure ambiguous per log. – Marta Velázquez, Night Assistant."*

  It was the only honest thing. It acknowledged the duality without resolving it. It accepted the sediment.

  Later, packing fragile eyepieces in straw, she found herself holding one up to the grey light from the window. The lenses nested perfectly, focusing the wet, indistinct world outside into sharp, overlapping rings of light and dark. For a moment, she saw not one image, but two – the dripping eucalyptus branch outside, and its faint, ghostly twin, shifted slightly. Then she blinked, and it resolved into a single, complex clarity.

  Enrique found her like that, holding the eyepiece, staring out at the rain-slicked pampas. "Almost done?" he asked.

  Marta lowered the glass. The world outside was singular again, blurred by rain. "Almost," she said, the word holding the echo of the other night, the other choice, the other her, all folded into the damp silence of the closing observatory. The question of "which one" had dissolved. Only the weight of both remained, a quiet burden carried into the final days.
