prompt: |-
  Last night me and my flatmate got into a stupid argument that went on way too long. She says that when five strangers on a footpath all grab a fallen branch and drag it off the trail without a word being said, that's a genuine joint action — five people doing something together. I said it's just five individual actions that happen to add up. Neither of us could get any purchase on the other and by the end we were mostly just repeating ourselves.

  So I want a decision tree for our reading group (six of us, nobody very technical, we've all read a bit of philosophy of action) that sorts you into a position on what makes something a joint action rather than a pile of parallel individual ones. Please build it from the logical space rather than from a list of isms: give me 7 or 8 branch questions, each a concrete case or a claim you can agree or disagree with without already knowing which theory it leads to — no "do you think groups have minds of their own?" style questions — and then put the usual family of views at the leaves (shared intention, we-intentions, the plural subject, we-mode, and the deflationary story where joint action needs almost nothing over and above individual action), adding anything you think is missing as its own leaf or marking it "unnamed."

  Three cases I specifically want the tree to handle, because they're where we kept getting stuck: (a) agents who can't form any view at all about what the others intend — two people who each think the other one is a hallucination, or a swarm of very dumb delivery robots; (b) participants who are perfectly coordinated but disagree about what they're doing, one thinks it's the rehearsal and the other thinks it's the real performance; (c) the lone-member case, where someone acts as one of a group of five and there is no group of five. If one of those cases doesn't actually separate any of your leaves, say so instead of inventing a branch for it, and tell me which pairs of leaves your tree just can't pull apart. Finally, mark the combinations of answers nobody actually occupies, and for each say in a sentence whether that's because it's incoherent, just unattractive, or simply that nobody's bothered to defend it.
reasoning: |-
  Hmm, the user wants a decision tree for their reading group to resolve a debate about joint actions. They're arguing whether five strangers dragging a branch off a trail counts as genuine joint action or just parallel individual actions. I need to create a logical decision tree with concrete questions that lead to different philosophical positions.

  The user gave specific constraints: 7-8 branch questions based on concrete cases or claims that don't require technical knowledge. No questions like "do groups have minds?" since that presupposes theories. I should end with leaves for shared intention, we-intentions, plural subject, we-mode, and deflationary views, plus any missing ones marked as "unnamed."

  Three cases must be handled: (a) agents who can't form views about others' intentions (hallucinations or dumb robots), (b) coordinated but disagreeing participants (one thinks rehearsal, other performance), and (c) lone-member acting as part of a non-existent group. If a case doesn't separate views, I should note that and say which pairs remain indistinguishable.

  I need to mark unoccupied combinations and explain why—whether incoherent, unattractive, or undefended.

  First, recall the key theories in philosophy of action:
  - Shared intention (Bratman): requires mutual responsiveness and commitment to joint activity.
  - We-intentions (Searle): individual intentions with "we" content, possibly without mutual belief.
  - Plural subject (Gilbert): joint commitment creating a plural subject.
  - We-mode (Tuomela): acting in "we-mode" with collective acceptance.
  - Deflationary: minimal requirements, like coordination via individual beliefs.

  The debate centers on what makes actions joint rather than parallel. The branch case involves strangers without communication, so it tests how much shared mental state is needed.

  For the three special cases:
  - Case (a): Tests if mutual belief is necessary. Deflationary views might allow it, others might not.
  - Case (b): Challenges whether shared goal is required. If they disagree on purpose, does it still count?
  - Case (c): Lone member acting as if in a group. Explores if joint action requires actual others or just subjective perspective.

  I'll build the tree step by step. Start with foundational questions that divide the theories logically.

  Question 1: Start with mutual belief. Ask if agents need to believe others are acting intentionally. This separates views requiring mutual awareness from those that don't.

  Question 2: Focus on shared goal—whether agents must have the same goal description. Handles case (b) where they disagree on what they're doing.

  Question 3: Address mutual responsiveness—if actions must adjust to others'. Important for Bratman-like views.

  Question 4: Cover joint commitment—whether a collective "agreement" is needed, even implicit. Relates to Gilbert.

  Question 5: Handle the hallucination case (a) directly—can joint action occur without any belief about others' intentions?

  Question 6: For the lone-member case (c)—can one person perform a joint action alone? This might isolate some views.

  Question 7: Add a question about whether joint action requires the group to exist, to cover social ontology aspects.

  I need 7-8 questions, so I'll aim for 7 to keep it tight. Order them to maximize differentiation early on.

  Structure the tree:
  - Each question is a concrete scenario or claim.
  - Answers: Agree (Yes) or Disagree (No).
  - Paths lead to leaves representing theories.
  - Mark unoccupied nodes and explain why.

  Ensure the tree covers all cases:
  - Case (a): Addressed in Question 5 (hallucination scenario).
  - Case (b): Covered in Question 2 (disagreement on goal).
  - Case (c): Handled in Question 6 (lone member).

  Now, map how answers correspond to theories:
  - Deflationary view: Likely no to mutual belief, shared goal, responsiveness, commitment. Yes to hallucination case. Yes to lone member if adapted.
  - We-intentions (Searle): No need for mutual belief, but requires we-intention. So, yes to hallucination? Searle thinks we-intention doesn't depend on others' actual intentions, so possibly yes. But in hallucination, if one thinks the other is real, it might count for them but not objectively? Need to clarify.
  - Shared intention (Bratman): Requires mutual belief and responsiveness. So no to hallucination and lone member.
  - Plural subject (Gilbert): Requires joint commitment, so no to cases without agreement.
  - We-mode (Tuomela): Involves collective acceptance, so probably no to hallucination and lone member.

  Identify unoccupied nodes: Some combinations might not be held by anyone. For example:
