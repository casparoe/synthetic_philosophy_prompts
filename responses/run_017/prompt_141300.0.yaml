prompt: |-
  Hey — my supervisor is a historian of medieval logic and shes been using our tutorials to work out her own line on future contingents. I've been keeping notes on her verdicts, and I want to know what she'll say about the case I'm about to put to her, and more than that what rule she's actually running.

  Her verdicts so far, all about claims made now, before the thing happens:

  - that there will be a sea battle tomorrow, said today with nothing yet settling it: neither true nor false.
  - that either there will be a sea battle tomorrow or there wont be: true — she insists the whole disjunction is true even though neither half is.
  - that there was a sea battle yesterday: determinately true or false, and she adds that if a battle is raging right now then it was true yesterday that there would be one.
  - that the total eclipse the astronomers are predicting for next decade will happen where they say: true now, fixed by where things are plus the laws.
  - that the coin I'm about to flip will land heads: neither true nor false.
  - that a fruit machine already mechanically set to pay out will pay out, though nobody knows it's been set: true — our ignorance is beside the point.
  - that a fortune teller who has never once been wrong predicts a battle: still neither true nor false, though she says you'd be mad to bet against him.

  Here's the case I want to bring. Marta made up her mind last night about how she'll vote at tomorrow's department meeting, wrote it on a slip of paper, put it in a locked drawer nobody will open before the meeting, and told no one. Assume for the sake of the case that nothing between now and then will change her mind. But also assume her deciding wasn't nomicly inevitable: the department's pet physicist says the process involved objective chance, so an hour before she decided there was no fact of the matter about which way she'd go, and even now there's no law tying the intention to the vote, only a very reliable psychological regularity. And assume nobody can find out now, not even in principle, short of breaking into the drawer.

  So: does she say the claim that Marta will vote yes is neither true nor false, or true-or-false-but-we-cant-tell-which, or flat out true if the slip says yes? What's the rule she's running — I can see at least settledness by the present state plus the laws, something about whether deliberation is still open or closed, something about whether there's already a truthmaker in the world, and maybe a fourth on which the neither-true-nor-false verdicts are really about necessity rather than truth — and what does each of them predict here? Which of her precedents is the closest analog to my case? And what should I put to her next to split the rules that agree on this one — I'm allowed to stipulate whatever I want next time, deterministic brains, sealed envelopes, whatever.

  I care much more about the rule and about the tie-breaker question than about the answer itself.
reasoning: |-
  Okay, the user is a student working with a supervisor who specializes in medieval logic, particularly future contingents. They've been noting her verdicts on various scenarios and now have a specific case about Marta's vote. The user wants to predict the supervisor's response, identify the underlying rule she uses, find the closest precedent, and get ideas for future cases to distinguish between different rules.

  First, I need to analyze the supervisor's past verdicts. She distinguishes between statements based on whether the future event is settled by current states and laws. For example, the sea battle and coin flip aren't settled, so they're neither true nor false. But the eclipse and fruit machine payout are settled due to deterministic laws, so they're true. The disjunction "sea battle or not" is true because it's logically necessary, even if neither disjunct is settled. Past events are always settled, as seen in the battle example.

  Now, looking at Marta's case: She decided last night, wrote it down, locked it away, and won't change her mind. The decision involved objective chance initially, but now it's fixed. The key point is whether the present state includes a truthmaker for her vote. The locked slip acts as a physical truthmaker, even if no one can access it. The physicist mentioned no nomic inevitability, but psychological regularity ensures she'll follow through.

  Comparing to precedents: The fruit machine is the closest. It was mechanically set to pay out, making it true now, despite ignorance. Similarly, Marta's written commitment serves as a truthmaker. The fortune teller case differs because there's no physical evidence; it's just a reliable prediction, so it remains unsettled.

  The supervisor's rule seems to be about "settledness by present truthmakers." Physical embodiments like the fruit machine's mechanism or Marta's slip make the future event settled. Deterministic laws (eclipse) also settle it, but psychological regularity plus a physical record might suffice even without nomic inevitability.

  For a tie-breaker case, we need scenarios where the truthmaker presence and determinism conflict. One idea: A deterministic brain process where the decision is made but not recorded. Without a physical trace, is it settled? Another: A sealed envelope with a random future event written by a reliable but non-deterministic predictor. This tests if physical presence alone suffices without causal inevitability.

  The user cares more about the rule and tie-breaker than Marta's verdict. They need to understand the underlying principle to anticipate the supervisor's reasoning. The key is whether a current truthmaker exists, regardless of accessibility. Marta's slip acts as that truthmaker, making "Marta will vote yes" true now if the slip says so.
answer: |-
  Based on your supervisor's established verdicts, here's the breakdown for the Marta case, the likely underlying rule, the closest precedent, and tie-breaker scenarios:

  1.  **Marta's Vote Verdict Prediction:**
      *   **"Marta will vote yes" is TRUE (if the slip says yes) OR FALSE (if the slip says no) NOW.**
      *   **Reasoning:** The core factor isn't inevitability *by laws alone*, nor *current knowability*, but the **existence of a causally effective, present-state truthmaker** that settles the future outcome. Marta's written decision locked in the drawer is a concrete, present physical state that causally ensures her future vote (via the psychological regularity). This parallels the fruit machine mechanically set to pay out. Even though the *decision process* involved chance and isn't nomically inevitable, the *present result* of that process (the written intention) is now a fixed feature of reality guaranteeing the outcome. Our ignorance is irrelevant, just like with the fruit machine.

  2.  **The Rule She's Running:**
      *   **"Present-State Truthmaker" Rule:** A future contingent statement P ("Event E will happen") is true/false *now* **if and only if** there exists *in the present state of the world* a physical configuration or state of affairs that causally necessitates E (or ~E). If no such truthmaker exists in the present, P is neither true nor false.
      *   **Key Aspects of the Rule:**
          *   **Truthmaker Focus:** Requires a concrete *present* feature of reality that *makes* the future statement true or false.
          *   **Causal Necessitation:** The truthmaker must causally guarantee the outcome, not just make it probable. The psychological regularity bridges the slip to the vote.
          *   **Distinct from Determinism:** While deterministic laws create truthmakers (eclipse), truthmakers can also arise from contingent, non-lawlike but causally effective present states (fruit machine, Marta's slip). The rule isn't *only* about nomic inevitability.
          *   **Distinct from Knowability:** Truth is independent of epistemic access (fruit machine, locked drawer).
          *   **Distinct from Logical Form:** Disjunctions can be true even without truthmakers for the disjuncts, as they are logical truths.
          *   **Distinct from Past/Fixed Events:** Past events have truthmakers in the past, which are now fixed. Current truthmakers fix future events. The "if a battle is raging now, it was true yesterday" verdict emphasizes that the *then-present* state (the emerging battle yesterday) made the future statement true yesterday.

  3.  **Closest Precedent:**
      *   **The Fruit Machine:** This is the **perfect analog**. Both involve:
          *   A future outcome (payout/vote).
          *   A *present physical state* (mechanically set mechanism/written slip) that causally guarantees the outcome.
          *   Reliance on a reliable, non-nomic causal connection (machine mechanics/psychological regularity).
          *   Current unknowability in principle (no inspection allowed).
          *   Verdict: True *now* based on the present truthmaker.
      *   *Not* the Sea Battle/Coin Flip: These lack any present truthmaker; nothing currently settles it. Deliberation/open chance remains.
      *   *Not* the Eclipse: Settled by nomic inevitability (laws + present state), not just a contingent present truthmaker.
      *   *Not* the Fortune Teller: No *present physical state* causally necessitates the battle; only a reliable *prediction* based on (presumably) non-causal/non-truthmaking factors. The prediction itself isn't the cause.

  4.  **Tie-Breaker Cases to Split Rules Agreeing on Marta:**
      The main competing rule that *might* agree on Marta is a broad "Causal Inevitability" rule (combining nomic determinism and effective present-state mechanisms). To split "Present-State Truthmaker" from "Causal Inevitability (including nomic determinism)" and also test the limits of "truthmaker", try these:

      *   **Case A: The Deterministic Brain (No Record)**
          *   *Setup:* Marta makes her decision last night via a perfectly *deterministic* brain process (laws + initial conditions necessitate her neural state at decision time). She tells no one, writes nothing down, and the decision is stored only *in her brain*. Assume perfect psychological regularity. No one can know now.
          *   *Question:* Is "Marta will vote yes" true/false now?
          *   *Split:*
              *   **Causal Inevitability Rule:** YES (True/False). The outcome is causally inevitable from the present state via deterministic brain state + laws.
              *   **Present-State Truthmaker Rule:** **NO (Neither True nor False).** While the brain state is present, is it a *truthmaker* in the required sense? Medieval logicians might hesitate to call an internal, purely mental state a physical "truthmaker" in the external world sense. Does the brain state *itself* causally necessitate the vote *independently of future deliberation*? The rule might require a *non-mental*, *external* physical embodiment to count as a truthmaker. (This challenges the necessity of an *external* record).
          *   *Why it's good:* Directly tests if *internal* deterministic states count as truthmakers or if an *external* physical token (like the slip) is required. It pits causal inevitability against the nature of the truthmaker.

      *   **Case B: The Sealed Prediction (No Causation)**
          *   *Setup:* A truly random quantum event will happen tomorrow (e.g., atom decay). A perfectly reliable (but non-causal!) oracle *today* writes the outcome ("Decay" or "No Decay") on a slip, seals it in your supervisor's desk drawer (unknown to her). The oracle's prediction is 100% accurate across all time, but does *not* cause the event; it's just a correlation or brute fact. The decay itself is fundamentally random until it happens.
          *   *Question:* Is "The atom will decay tomorrow" true/false now?
          *   *Split:*
              *   **Causal Inevitability Rule:** NO (Neither True nor False). The outcome is not causally settled by anything in the present. The prediction slip doesn't *cause* the decay.
              *   **Present-State Truthmaker Rule:** **DEBATABLE, likely NO (Neither True nor False).** While there's a present *physical token* (the slip) correlated with the future outcome, it does **not causally necessitate** the outcome. It's merely a reliable indicator. Does a truthmaker require *causal power*, or is mere reliable correlation/supervenience enough? Your supervisor's rule, based on the fruit machine (where the mechanism *causes* the payout) and the rejection of the fortune teller (who doesn't cause the battle), strongly suggests **causal necessitation is required**. The slip is just a very good fortune teller note in a drawer.
          *   *Why it's good:* Crucially separates the *presence of a physical token* (slip) from *causal efficacy*. Tests if the rule requires the truthmaker to *bring about* the event (like the fruit machine mechanism) or if any reliable physical record suffices (which the fortune teller verdict suggests it does not).

  **Summary for Your Tutorial:**

  *   **Prediction:** She'll say "Marta will vote yes" is **TRUE now** (if the slip says yes), based on the **present physical truthmaker** (the written slip + psychological regularity).
  *   **Rule:** **Present-State Truthmaker Rule:** Future contingents are true/false now iff there exists a present physical state that causally necessitates the future outcome. This supersedes pure nomic determinism or epistemic access.
  *   **Closest Precedent:** **The Fruit Machine** (mechanically set to pay out).
  *   **Tie-Breakers:**
      *   **Deterministic Brain (No Record):** Does an *internal*, deterministic mental state count as a sufficient truthmaker?
      *   **Sealed Prediction (No Causation):** Does a reliably correlated but *non-causal* physical token (like an oracle's sealed slip for a random event) count as a truthmaker?

  These tie-breakers specifically target the core requirements of the "Present-State Truthmaker" rule: the *nature* of the truthmaker (must it be external?) and its *causal role* (must it necessitate, or is correlation enough?), distinguishing it from broader notions of causal inevitability or determinism. Good luck!
