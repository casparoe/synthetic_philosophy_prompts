prompt: |-
  I'm a backend engineer with no philosophy training and I keep arguing with myself about whether the whole "memes are replicators, culture evolves the way Darwinian evolution says" story actually cashes out when you look at concrete cases. I know the pop version — Dawkins coins the term, other people run with it, and there's a family of objections saying transmission is really reconstruction rather than copying. I dont want a recap of any of that. What I want is to know what principle I'm already using, because my gut verdicts on individual cases don't add up, and I can't tell which ones to throw away.

  Here are the verdicts.

  1. The email-validation regex from a 2010 Stack Overflow answer that's been pasted into a million codebases, subtly broken in the same way in nearly all of them. Definitely meme, definitely evolving. The selection pressure is "looks plausibly right when skimmed during code review", which is not the same as "is right".

  2. hello world in every tutorial for every language. Copied billions of times, near-zero variation. I want to say: not interesting, and not really Darwinian — it isn't winning a competition, it's being handed down by an institution. But I can't say cleanly why that's different from 1.

  3. Every team I've worked on independently converges on "just put a cache in front of it". Nobody copied anyone. I want to say: not a meme at all, there's no lineage, so there's nothing for selection to act on — even though the outcome looks like the spread of a trait.

  4. A sound or a dance that only blows up because the recommendation algorithm pushes it. Feels meme-y to me, and I notice I'm happy to call it selection even though the thing doing the selecting is a ranking model with no brain and no preferences.

  5. A column in our production database called something like legacy_flag_3, meaning unknown, which has survived four rewrites because nobody dares delete it. I want to call it a parasite, but the "pressure" keeping it alive is just that removal is risky and deletion is invisible. Is that selection, or is it only inertia wearing a lab coat?

  6. Version control. Spread across the whole industry, and it spread because it works — teams that used it did better. I really do NOT want to call this a meme. It's knowledge, or tooling, or something with a different flavour.

  7. The 10x engineer thing, and the move fast and break things slogan. Spread because they're fun to repeat and flattering to the speaker. Obviously memes, obviously junk. Which makes me suspect I'm secretly running "meme = spread for reasons other than being true", and that can't be right, because natural selection isn't supposed to care about truth either.

  8. The standard proof that there are infinitely many primes. Copied, with variation, outcompeting other proofs, in every textbook, for centuries. I also don't want to call this a meme. But on the criteria I used in 1 it plainly is one. This is the one I keep flip-flopping on.

  And 6 and 8 are the pair that worries me: structurally they look like 1 and 7, and I give them the opposite verdict, and I think the only thing driving that is that I approve of the content.

  Three distinctions I half-invented while thinking about this, which I can't place:

  - Cold carriers. The copy isn't in anyone's head, it's in an artefact — a repo, a config file, a form field, a UI. It still gets copied and it still has effects. Does a Darwinian account need a host who *knows* the variant, or is沉积 in a codebase enough? (Most of what we'd call culture in a software org is stored cold.)
  - Source-opacity. You can copy the product but not the procedure: everyone imitates the shape of a well-designed API without ever seeing the design process that produced it. Can something be evolving if only the output is transmitted and the recipe has to be re-guessed each time?
  - The graveyard condition. I notice I only feel comfortable saying "selection" when I can point at variants that actually died and see why. Where there's no visible graveyard — hello world, the database column — I start hedging. Is that a real requirement, or am I smuggling something in?

  My tentative principle, which I half believe: a cultural thing is genuinely undergoing Darwinian evolution iff there's (a) a lineage of copies, (b) heritable variation, and (c) differential survival that is *systematic* — tied to features of the variant rather than to who happened to be standing nearby — plus (d) my graveyard condition. Test it against the eight cases, repair it or replace it.

  Specifically: commit to a position. Give me one principle, or at most a couple of candidates you'd actually defend, stated precisely enough that I could apply it to a case you haven't seen, with a note on which of my verdicts motivates each clause. Tell me which of my verdicts I have to drop, and be explicit about 6 and 8 rather than saying "it depends". Then run it on two cases I haven't listed: (i) a code assistant trained on public code that reproduces the same broken regex from case 1 in newly written code — is that a next generation of the same lineage, or a different mechanism wearing the same clothes; (ii) a team's private jargon word that everyone uses partly because using it signals you belong. And tell me which part of your own answer you'd bet least on.

  British English please — I'm UK based and American spellings in the middle of this will irritate me out of proportion.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a backend engineer struggling with the concept of memes as replicators in cultural evolution. They've listed eight concrete cases where their intuition gives conflicting verdicts on whether something qualifies as a Darwinian evolutionary process. They want a clear principle to resolve these contradictions.

  First, I need to understand their core frustration. They've clearly done their homework - they're familiar with Dawkins and the reconstruction vs copying debate. But they're stuck because their gut reactions to specific examples don't cohere. The key seems to be that they're applying inconsistent criteria, especially when it comes to things they approve of (like version control) vs things they don't (like the 10x engineer myth).

  Looking at their eight cases, several patterns emerge. Cases 1, 4 and 7 feel "meme-y" to them, while 2, 3, 5, 6 and 8 don't - but for different reasons each time. The regex example (1) shows clear selection pressure, while hello world (2) feels institutional. The caching pattern (3) emerges independently without lineage. The viral sound (4) is selected by algorithms. The database flag (5) persists through inertia. Version control (6) spreads because it works. The 10x myth (7) spreads through appeal. The prime proof (8) spreads through merit but isn't called a meme.

  Their three self-identified distinctions are insightful: cold carriers (artefacts vs mental copies), source-opacity (copying outputs not processes), and the graveyard condition (needing to see failed variants). These point to real conceptual tensions in memetics.

  For a robust principle, I lean toward a strict Darwinian definition requiring: lineage (copies with ancestry), variation, and systematic differential survival tied to variant features. I'd drop their graveyard condition as evidentiary but not definitional. Applying this:

  - Regex (1) qualifies: lineage, variation (subtle breaks), systematic selection (code review skimming)
  - Hello world (2) fails: no variation, no differential survival
  - Caching pattern (3) fails: no lineage, independent reinvention
  - Viral sound (4) qualifies: algorithmic selection is systematic
  - Database flag (5) borderline: lineage exists but selection isn't systematic (random survival)
  - Version control (6) qualifies: it meets all criteria despite being beneficial
  - 10x myth (7) qualifies: spreads systematically via appeal
  - Prime proof (8) qualifies: textbook lineage, variation in proofs, systematic selection for elegance

  This forces them to drop their content-based bias - beneficial things can evolve too. For their new cases: the AI-replicated regex is absolutely part of the same lineage (copied ancestry), while the jargon word is a meme (signalling function drives systematic spread).

  The trickiest part is the "systematic" requirement - it's hard to define precisely what counts as a "feature of the variant". I'd bet least on that component, as real-world selection often involves contextual factors. But without it, everything becomes "selection".
answer: |-
  Here's a principled distinction, articulated crisply to force a decision on your cases. I'll defend this as the core necessary and sufficient conditions for **Darwinian cultural evolution**:

  > A cultural element undergoes Darwinian evolution **iff**:
  > 
  > 1.  **Lineage with Ancestry**: It persists through a chain of *copies* (not independent reinvention), where each instance's existence causally depends on prior instances.
  > 2.  **Heritable Variation**: Differences arise between instances during copying (mutation/recombination) *and* these differences are transmitted to subsequent copies.
  > 3.  **Systematic Selection**: Variants differ in their rate of copying/survival *because of their intrinsic properties or context-interaction*, not solely due to random drift or extrinsic constraints unrelated to the variant itself.

  **Clarifications & Commitments:**
  *   **"Systematic Selection"**: This means the variant's *features* (e.g., simplicity, catchiness, perceived usefulness, emotional resonance, compatibility with infrastructure) demonstrably influence its success *in a replicable way*. Random luck or purely external bottlenecks (e.g., "only one team tried") don't count. Algorithmic selection (your case 4) *is* systematic – the algorithm responds to variant features (engagement metrics).
  *   **Graveyard Condition Rejected**: While useful evidence, it's not definitional. Evolution can occur without visible extinct variants (e.g., neutral drift, incomplete records). We infer selection from *differential* success, even if losers aren't preserved.
  *   **Cold Carriers**: Artefacts (code, configs) *are* valid hosts/carriers if they function as the unit being copied. The lineage exists in the artefact chain. No "knowing host" required.
  *   **Source-Opacity**: This *is* compatible. Copying outputs (the API shape) without the recipe is still transmission of heritable information (the shape itself). The recipe's loss is just a constraint on variation.
  *   **Content-Irrelevance**: The *truth*, *utility*, or *moral value* of the variant is irrelevant to whether it evolves Darwinianly. Junk *and* beneficial traits evolve. Your discomfort with 6/8 stems from conflating the *mechanism* (Darwinian evolution) with the *value* of the outcome.

  **Applying the Principle to Your Cases:**

  1.  **Broken Regex**: **Yes.** Lineage (copied SO answer), Variation (subtle breaks persist), Systematic Selection (success tied to "looks plausibly right" feature).
  2.  **Hello World**: **No.** Fails *Heritable Variation* (near-zero variation) and *Systematic Selection* (success tied to institutional prescription, not variant properties. Copying happens, but no *differential* success based on traits).
  3.  **"Just Cache It"**: **No.** Fails *Lineage with Ancestry*. Independent convergence, not copying. No chain of descent.
  4.  **Algorithmic Sound/Dance**: **Yes.** Lineage (copies), Variation (remixes exist), Systematic Selection (algorithm favours variants with engagement-driving features).
  5.  **Legacy Database Flag**: **Borderline/Weak Yes.** Lineage (copied through rewrites), Variation (likely minimal, but could exist - e.g., column name changes). *Systematic Selection* is weak: "Survival" is tied to the *context* (risk aversion, invisibility of deletion) more than intrinsic features *of the flag itself*. It's mostly drift/inertia. If deletion attempts *always* fail due to unforeseen breaks *caused by the flag*, it edges closer.
  6.  **Version Control**: **Yes.** Lineage (adopters copied the concept/tools from prior users), Variation (Git vs SVN vs Mercurial), Systematic Selection (variants spread/fail based on features like speed, branching model, ease of use - demonstrably influencing team success).
  7.  **10x Engineer Slogan**: **Yes.** Lineage (copied speech/writing), Variation (slight phrasing tweaks), Systematic Selection (spreads because of intrinsic features: flattering, simple, fun to say).
  8.  **Infinitely Many Primes Proof**: **Yes.** Lineage (copied across textbooks/scholars), Variation (different formulations, Euler's proof vs Euclid's), Systematic Selection (variants succeed/fail based on features like elegance, clarity, pedagogical effectiveness, mathematical rigour).

  **Your Required Verdict Changes:**
  *   **Drop:** Your verdicts on 6 (Version Control) and 8 (Prime Proof). Your principle was contaminated by content-approval. They meet the criteria as cleanly as 1 and 7.
  *   **Adjust:** 5 (Legacy Flag) is the weakest "Yes". Accept it reluctantly based on lineage + weak context-driven "selection" (risk aversion acts *on* the flag), or refine "systematic" to exclude pure risk inertia (see below).
  *   **Accept:** Your "No" on 2 (Hello World) and 3 (Caching) stand. Your "Yes" on 1, 4, 7 stand.

  **New Cases:**
  1.  **AI Reproducing Broken Regex:** **Same Lineage.** The AI's output causally depends on its training data, which includes instances of the broken regex lineage. It's a new generation in the *same* ancestral chain, copied via the AI model. Variation might still occur (AI tweaks), and selection (will it be used/copied?) acts systematically based on perceived correctness/usability.
  2.  **Private Jargon Word:** **Yes.** Lineage (copied speech within the team), Variation (pronunciation, contextual usage), Systematic Selection (spreads because intrinsic features - signalling belonging - enhance its success within the social context). Its function *is* a feature driving replication.

  **The Weakest Link: Systematic Selection**
  The clause I'd bet least on is the precise boundary of **"Systematic Selection"**. Distinguishing "intrinsic properties or context-interaction" from "extrinsic constraints" is messy. Your case 5 (Legacy Flag) exposes this:
  *   *Is "being hard to delete safely" an intrinsic property?* Arguably yes – it's a feature *of that specific column* within its database ecosystem.
  *   *Or is it just a general context (risk aversion) that affects any old column equally?* Then it's extrinsic, weakening the "systematic" link to *that specific variant*.

  **Refined "Systematic Selection" Clause (Optional, more defensible):**
  "Variants differ in their rate of copying/survival *in a way causally linked to specific, identifiable characteristics of the variant itself, interacting predictably with its environment.*" This pushes case 5 towards "No" unless the flag *uniquely* causes deletion attempts to fail.

  **Conclusion:** The core Darwinian mechanism (descent with modification under selective pressure) applies rigorously to cultural elements when lineage, heritable variation, and systematic selection based on variant features are present. Value judgements about the content are irrelevant to the mechanism. Your gut correctly identified independent reinvention and institutional prescription as non-Darwinian, but balked at beneficial knowledge – that was the bias to discard. Cold carriers and source-opacity pose no fundamental barrier. The graveyard is evidentiary, not definitional. The real friction is defining "systematic selection" tightly enough to exclude pure inertia or random drift, without excluding cases where context *interacts* with variant features.
