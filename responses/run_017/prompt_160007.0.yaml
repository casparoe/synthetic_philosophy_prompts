answer: |-
  Below are 10 questions designed to engage deeply with Dr. Sarkar’s thesis while pushing her toward concrete application, self-reflection, and potential vulnerabilities in her framework. They progress from accessible to challenging, with two "costly manoeuvre" moments (Questions 4 and 7) where evasion would be conspicuous. Each question includes:  
  1. **Likely Answer Prediction** (based on her thesis)  
  2. **Follow-Up Question** (building *on her answer*, not your premise)  
  Phrasing reflects a polite, intellectually rigorous sixth-former.

  ---

  ### **Question Sequence**  
  **1. Opening Accessible Question**  
  *"Dr Sarkar, you argue textbook disputes aren’t really about *what* happened but *who* gets to be the ‘subject’ of the sentence—like ‘nation-as-victim’ or ‘coloniser’. Could you give us a simple example of how changing the ‘subject’ alters the moral lesson of a familiar GCSE topic, say, the British Empire in India?"*  
  - **Likely Answer**: She’ll contrast "Britain brought railways and order" (subject: coloniser-as-benevolent-agent) vs. "Indian economies were dismantled for British profit" (subject: colonised-as-object-of-exploitation). Moral shift: progress vs. oppression.  
  - **Follow-Up**: *"If teachers only have time for one version, does your framework imply both choices are equally *political*—even if one is factually supported by more evidence?"*  

  **2. Testing Empirical Premise**  
  *"You claim rival accounts (e.g., 1619 Project vs. 1776 Report) broadly share facts but fight over the ‘subject’. But when Korean textbooks cite Japanese military ‘comfort women’ records, and Japanese textbooks omit them—isn’t that a factual disagreement *disguised* as a subject debate? Or do you see that as exceptional?"*  
  - **Likely Answer**: She’ll argue omissions reflect subject-choice (e.g., Japan-as-moderniser avoids victim-centred facts). "Facts" only become salient based on chosen subject.  
  - **Follow-Up**: *"Doesn’t that risk circularity? If subject-choice determines which facts are ‘relevant’, can we ever *disprove* your claim that facts are shared?"*  

  **3. Grammatical Vocabulary as Moral Carrier?**  
  *"Is framing the conflict as ‘who is the grammatical subject’ more than a metaphor? If I rewrite ‘Japan annexed Korea’ as ‘Korea was annexed by Japan’, the moral blame seems clearer—but isn’t that just restating the *same* dispute with linguistics jargon?"*  
  - **Likely Answer**: She’ll insist grammar *structures* moral imagination (e.g., passive voice obscures agency). It’s not jargon but cognitive framing.  
  - **Follow-Up**: *"But if both sides *agree* grammar shapes morality, why would they accept your ‘double-subject’ solution? Isn’t the fight precisely over *whose* morality gets centred?"*  

  **4. DEMANDING A SPECIMEN (Costly Manoeuvre 1)**  
  *"Could you draft a 2–3 sentence ‘double-subject’ paragraph for GCSE pupils on the 1619 arrival? And crucially—what skill would answering *this* instead of a standard exam question (‘Explain the significance of 1619’) teach pupils that current exams miss?"*  
  - **Likely Answer**: She’ll propose: *"In 1619, African captives faced brutal enslavement by Virginia colonists (*subject: enslaved & colonisers*), initiating systems where Black resilience (*subject: enslaved*) confronted white supremacy (*subject: colonisers*)."* Skill: "Holding multiple agencies in tension."  
  - **Follow-Up**: *"But if an exam asks ‘Who was responsible for slavery?’ and a pupil uses your paragraph to argue ‘both’, isn’t that *less* historically nuanced than specifying *how* power imbalances shifted responsibility? Doesn’t double-subject risk *equivocation*?"*  

  **5. Symmetry & State Appropriation**  
  *"Your framework seems neutral—but could a government use ‘double-subject’ to legitimise its narrative? E.g., ‘The state (*subject*) protects citizens (*subject*) from terrorists (*subject*)’ subtly implies state moral authority. Is this a danger?"*  
  - **Likely Answer**: She’ll concede risk but argue critical pedagogy (teachers/pupils dissecting subject-choices) mitigates it.  
  - **Follow-Up**: *"If teachers must ‘critically dissect’, doesn’t that admit double-subject *alone* is insufficient? Shouldn’t we teach pupils *first* how to spot ‘subject-manipulation’ in *single*-subject texts?"*  

  **6. Explicit vs. Silent Teaching**  
  *"Should teachers explicitly say: ‘We’re choosing this subject politically’? Or is the double-subject narration itself the lesson—trusting pupils to *feel* the tension silently?"*  
  - **Likely Answer**: "Explicitly! Pupils must know history involves ethical choices."  
  - **Follow-Up**: *"Won’t that paralyse teachers? If every subject-choice is ‘political’, how do they justify *any* narrative—including double-subject—without indoctrination?"*  

  **7. ASSESSMENT CHALLENGE (Costly Manoeuvre 2)**  
  *"How do we mark an essay where a pupil uses double-subject? If they write ‘Enslaved Africans (*subject*) resisted while planters (*subject*) exploited’, is that an A* for complexity... or a C for avoiding a clear argument?"*  
  - **Likely Answer**: "We assess *how well* they show interlocking agencies—not ‘taking sides’."  
  - **Follow-Up**: *"But doesn’t history *require* causal arguments? If a pupil won’t say ‘Planters’ greed *drove* expansion of slavery’, haven’t they failed to meet GCSE assessment objectives about ‘analysis of causation’?"*  

  **8. Scope: Textbooks vs. All History**  
  *"Is double-subject a special rule for *schools* (to avoid bias), or do historians *generally* mislead by using single subjects? If the latter, what’s unique about classrooms?"*  
  - **Likely Answer**: "All history has this problem, but classrooms shape civic identity, so stakes are higher."  
  - **Follow-Up**: *"Then why focus on *textbooks*? Shouldn’t your critique target academic monographs—where historians have space for complexity?"*  

  **9. Falsifiability**  
  *"What evidence *against* your approach would persuade you? If a study showed pupils remember *less* about colonialism after double-subject passages, or misinterpret them as ‘both sides equally to blame’—would that undermine it?"*  
  - **Likely Answer**: "Only if it showed reduced *critical engagement*. Misinterpretations mean we need better teacher training."  
  - **Follow-Up**: *"So is your theory unfalsifiable? If bad outcomes are blamed on implementation, not the method, what *could* defeat it?"*  

  **10. Closing: The Hope**  
  *"Ultimately, if double-subject narration succeeded everywhere, would it make textbook controversies disappear—or just transform them into fights over *which* two subjects deserve ‘joint billing’?"*  
  - *Likely Answer*: "The latter—but that’s progress! It moves us from moral absolutes to negotiated complexity."  
  - *Follow-Up*: *"But if the fight continues, just shifted, why call it a ‘solution’? Isn’t it just *managing* an unsolvable problem?"*  

  ---

  ### Why This Works  
  - **Flow**: Starts simple (Q1–3), escalates to concrete demands (Q4), exposes tensions (Q5–8), and ends with accountability (Q9–10).  
  - **"Costly Manoeuvre" Triggers**:  
    - **Q4** (Specimen): If she dodges drafting an example, her practicality is undermined.  
    - **Q7** (Assessment): If she won’t engage with GCSE mark schemes, her relevance to *schools* weakens.  
  - **Follow-Ups**: Each presses *her* logic further (e.g., Q3 follow-up questions if grammar solves anything; Q9 follow-up challenges falsifiability).  
  - **Tone**: Persistent but respectful ("Could you...", "Isn’t there a risk...", "How do we...").  

  This sequence forces her to defend, apply, and *extend* her ideas—not just recite them. Good luck with the interview!
