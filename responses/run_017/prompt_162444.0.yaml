  I should check if asymptotic parity makes sense. The idea is that as time passes, the probability that a small change persists diminishes, so near-term effects prevail. But Sam might argue that even a tiny chance of massive impacts (like affecting extinction) could outweigh near-term benefits. This ties into Pascal's Mugging-type problems.

