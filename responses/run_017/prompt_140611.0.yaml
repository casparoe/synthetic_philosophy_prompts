prompt: |-
  hi — I keep losing the same argument in my EA-adjacent group chat and I want something I can paste into it.

  The setup: we were arguing about whether a funder should concentrate everything on the highest-expected-value cause or spread money across several, and whether it's ever ok to turn down a gamble with positive expected value when the bad tail is catastrophic (small chance of something extinction-level, or an intervention that could backfire badly). Someone who reads a lot of decision theory shut it down with: "if you're not maximizing expected utility you can be money-pumped, so your preferences are incoherent, and that's all 'irrational' means here." He then used that to say risk aversion about tail outcomes isn't a value judgement at all, it's just an error, and there's nothing to respect in it.

  I'm sure a lot is being smuggled in but I can't point at the smuggling. Can you lay out, as a list, the different precise claims that one-liner could be making? Things I want seperated:

  - the synchronic version (a set of bets you'd each accept that together guarantee a loss) vs the diachronic version (a sequence of trades over time that walks you somewhere worse). These feel like different arguments with different assumptions but I can't say how.
  - whether the pump needs an adversary who can read off your dispositions, and whether it needs you to be the kind of thing that forms a plan and then gets to revisit it. Is a one-shot chooser — a donor making a single grant, a model run once — pumpable at all?
  - what "worse off" means, given the agent isn't a maximizer: worse by whose lights? I have a feeling that if the agent's choices don't reveal a single ordering then the argument quietly assumes what it's trying to show, but I want that stated properly instead of gestured at.
  - the reply that a sophisticated non-maximizer just declines the later trades, together with the counter-reply that if you let agents have preferences over histories of choice the axioms become nearly vacuous. Is that a genuine standoff or is there a standard way through it?
  - how much is actually extractable. I've heard something about small violations only permitting small pumps. Even if that's right, does it help me? Getting pumped for a small amount seems compatible with still being glad you weren't a maximizer, which makes me think "exploitable" isn't automatically "defective."
  - whether being pumpable is supposed to *constitute* the irrationality or merely be evidence for it.

  For each reading, tag it as trivial, substantive-and-defensible, question-begging, or false. And the part I actually care about: say which readings would really get him from "she's not an expected utility maximizer" to "her attitude to catastrophic risk isn't a value, it's a mistake", because I suspect most of them don't. No citations or reading lists, I'll deal with those myself.
reasoning: |-
  Okay, let's tackle this user's problem. They're stuck in an argument with their EA group about whether funders should concentrate on the highest-EV cause or spread resources, especially when catastrophic tail risks are involved. The key opponent is using decision theory to claim that any risk aversion is irrational because it leads to money-pumping. The user feels something's off but can't pinpoint it. They want a breakdown of the claims behind that one-liner, categorized and evaluated.

  First, I need to parse the opponent's argument. The core is that not maximizing expected utility leads to incoherence via money-pumping. But that's a dense claim with many layers. The user listed specific aspects they want addressed: synchronic vs. diachronic pumping, the need for an adversary, how "worse off" is defined, sophisticated choosers, extractable amounts, and whether pumpability constitutes irrationality. Each needs careful dissection.

  Starting with synchronic pumping. Here, it's about simultaneously offered bets that together guarantee a loss. This requires the agent to accept all bets at once. The argument holds if the agent violates the independence axiom. But if the agent has context-dependent preferences—like valuing diversification intrinsically—this setup forces a framework they reject. The opponent might call this irrational, but that's question-begging. It doesn't prove irrationality; it assumes the EU axioms are the only rational standard.

  Diachronic pumping involves sequential choices exploiting changing commitments. This needs an adversary who knows the agent's preferences and can offer trades over time. For a one-shot chooser, like a donor making a single grant, this pump doesn't apply. The opponent's argument might overreach here by ignoring decision contexts where sequential choices aren't relevant.

  The "worse off" point is crucial. Money-pumping shows a loss by the pump's design, but if the agent prioritizes avoiding worst-case scenarios, they might accept a sure loss as preferable to risking catastrophe. Here, the pump assumes EU maximization is the benchmark, which is circular. The argument doesn't engage with the agent's actual values but imposes an external standard.

  Sophisticated choosers who precommit might avoid pumping by refusing later trades. The opponent could counter that preferences over choice histories weaken axioms. But this seems like a standoff—either accept vacuous axioms or allow non-EU preferences. The user needs to recognize this as a philosophical impasse, not a settled point.

  Extractable amounts matter too. Small violations might only allow small pumps. If the agent is willing to lose a little to avoid disaster, that's consistent with their values. Exploitability isn't inherently defective if the trade-off aligns with their priorities. The opponent's claim that any pumpability proves irrationality ignores this nuance.

  Finally, whether pumpability constitutes irrationality or merely evidences it. The opponent uses it as constitutive, but evidence requires showing why violating EU is inherently flawed. Without that, it's begging the question.

  Connecting this to the user's core concern: most readings don't support the jump from "not EU maximizing" to "risk aversion is a mistake." Only the question-begging versions do, by assuming EU as the only rational standard. For the user's context—catastrophic tail risks—the agent's values might justify deviations from EU, and the pumping arguments don't invalidate that.

  The user needs to challenge the opponent's hidden premise: that coherence must conform to EU axioms. Highlighting that one-shot decision-makers aren't vulnerable to diachronic pumps, and that synchronic pumps assume away context-dependent preferences, can weaken the opponent's stance. Emphasizing that "worse off" isn't defined by EU for these agents is key. The user should insist that risk aversion in catastrophic scenarios reflects values, not errors, unless proven otherwise without circular reasoning.
answer: |-
  Here's a breakdown of the distinct claims packed into the "money-pump = incoherent = irrational" argument, categorized as requested. Crucially, **most readings do NOT support the jump to "risk aversion about catastrophic tails is just an error, not a value".**

  ### 1. **Synchronic Money-Pump (Violating Independence/Transitivity in Static Choice)**
      *   **Claim:** If your *static* preferences violate the axioms (e.g., not transitive, violating independence like preferring A>B but C>A when C is a mix of A and B), one can construct a *set of simultaneous offers* you would accept that together guarantee you a loss *right now*.
      *   **Adversary/Planning Needed?** Needs an adversary who knows your *current* dispositions. Doesn't require revisiting plans over time. Works for "one-shot" *static* choices if multiple options are presented simultaneously.
      *   **"Worse Off" Meaning:** Worse off *by your own revealed preferences* in that specific choice context. Accepting the bundle reveals you prefer it to the status quo, but the bundle is objectively worse. This *does* reveal a local inconsistency in your valuation.
      *   **Sophisticated Agent Reply:** Less relevant. The pump happens in a single choice.
      *   **Extractability:** Can often extract the *entire* sure loss defined by the violation.
      *   **Constitutes or Evidence?** Evidence for a local inconsistency in valuation at that moment.
      *   **Verdict:** **Substantive-and-defensible** *for demonstrating inconsistency within a specific choice frame.*
      *   **Gets to "Just an Error"? NO.** This shows inconsistency, not that avoiding catastrophic risk is *wrong*. The inconsistency might stem from a *value* for avoiding worst-case distributions that EU can't capture. Framing the choice differently might resolve it *without* changing core values.

  ### 2. **Diachronic Money-Pump (Violating Independence/Transitivity over Time)**
      *   **Claim:** If your *planned future choices* would violate dynamic consistency (e.g., you plan to choose A over B tomorrow, but know that if offered a path to C (a mix) today, you'd take it and end up with B), a cunning adversary can exploit this over time by offering sequential trades that walk you to a worse outcome than your starting point.
      *   **Adversary/Planning Needed?** REQUIRES an adversary who knows your dispositions/plans *and* the ability to make sequential offers over time. Requires you to be able to revisit plans.
      *   **"Worse Off" Meaning?** Worse off *compared to your starting position* (or a position you could have held). The pump exploits a conflict between your planned future choice and your current choice given that plan.
      *   **Sophisticated Agent Reply:** A "sophisticated" agent, knowing their own inconsistency, would *precommit* to refusing the later trade, avoiding the pump. The counter-reply: If you allow preferences over entire *choice histories* (e.g., "I prefer the history where I never even faced that tempting offer"), the axioms become harder to violate meaningfully (potentially vacuous). **This is a genuine standoff.** The sophisticated agent avoids exploitation but "solves" the problem by restricting their own future agency or defining preferences over contexts, which EU purists argue dodges the core issue of dynamic inconsistency.
      *   **Extractability:** Can often extract the *entire* sure loss defined by the violation.
      *   **Constitutes or Evidence?** Evidence for dynamic inconsistency in your preferences/plans over time.
      *   **Verdict:** **Substantive-and-defensible** *for demonstrating potential dynamic inconsistency, but relies on sequential interaction and foreseeability.*
      *   **Gets to "Just an Error"? NO, and the "sophistication" escape hatch highlights it.** The sophisticated agent *values* avoiding the bad path more than satisfying their momentary temptation, demonstrating a complex preference structure. Avoiding the pump doesn't mean the catastrophic risk aversion was an "error"; it can be a core value protected by precommitment.

  ### 3. **Pumpability Requires Adversarial Exploitation**
      *   **Claim:** The money-pump argument only *works* as an argument against incoherence if there exists an adversary capable of and motivated to exploit the inconsistency.
      *   **Verdict:** **Substantive-and-defensible.** Without potential exploiters, the "threat" is theoretical. For a truly one-shot, non-adversarial choice (e.g., a single grant decision), diachronic pumping is impossible, and synchronic pumping requires the specific bad bundle being offered.
      *   **Gets to "Just an Error"? NO.** Even if exploitable in theory, in a non-adversarial context (like allocating your own funds without tricksters), the choice might perfectly reflect your values (e.g., diversification to reduce tail risk) without practical consequence.

  ### 4. **One-Shot Chooser Vulnerability**
      *   **Claim:** A one-shot chooser (single grant) can *only* be vulnerable to a synchronic pump *if* the specific loss-guaranteeing bundle is presented. If they only face one choice (A vs B vs C...), no pump sequence occurs. Diachronic pumping is impossible.
      *   **Verdict:** **Substantive-and-defensible.**
      *   **Gets to "Just an Error"? NO.** The one-shot chooser makes a single value-based decision. Showing they *would* be pumped *if* offered a complex adversarial bundle doesn't prove their *actual* decision (e.g., funding diversification) was irrational *for their context and values*.

  ### 5. **Small Violations & Small Pumps**
      *   **Claim:** Minor deviations from EU (e.g., slight risk aversion beyond what EU allows) only permit an adversary to extract a small amount per pump cycle. Large pumps require large violations.
      *   **Verdict:** **Substantive-and-defensible** (based on continuity arguments).
      *   **Gets to "Just an Error"? NO, THIS IS CRITICAL.** If the potential pump loss is small but the catastrophic risk being avoided is enormous, the non-EU agent might rationally (by their own lights) accept the *small* exploitability risk to gain the *large* benefit of catastrophic risk reduction. Exploitability isn't inherently defective if the trade-off aligns with their values. "Glad you weren't a maximizer" is perfectly coherent here.

  ### 6. **Pumpability as Constitutive vs. Evidential**
      *   **Claim Constitutive:** Being pumpable *is what it means* to be irrational/incoherent. It's the definition.
      *   **Claim Evidential:** Being pumpable is strong *evidence* that your preferences are irrational/incoherent.
      *   **Verdict:** **Question-begging (Constitutive), Substantive-but-Weak (Evidential).** Defining irrationality *as* pumpability assumes the EU axioms are the *only* standard of coherence. This directly assumes what it's trying to prove. Treating it as evidence is better but still relies on the premise that avoiding pumpability is the *supreme* rationality goal, which can be contested for agents with catastrophic risk aversion.
      *   **Gets to "Just an Error"? YES, but ONLY if you accept the Constitutive claim,** which is circular. The Evidential claim doesn't get you there alone.

  ## The Bottom Line for Your Argument

  1.  **The core smuggling:** The opponent **assumes EU axioms define rationality** and **equates violating them with "error" rather than potentially legitimate values.** Money-pump arguments (especially synchronic) *do* demonstrate *inconsistency* relative to *those specific axioms and choice frames*. They do **NOT** prove that valuing catastrophic risk avoidance *in itself* is irrational or an "error".
  2.  **Which readings support "just an error"?** Only the **question-begging constitutive version of Claim 6** directly supports it. The **diachronic pump argument (Claim 2) combined with rejecting the sophisticated chooser escape** *might* support it *if* you accept that dynamic inconsistency is inherently irrational *and* that catastrophic risk aversion *must* cause it in relevant cases. This is highly contestable.
  3.  **Which readings UNDERCUT "just an error"?**
      *   **Small Violations/Small Pumps (Claim 5):** Explicitly allows that being pumpable can be a *rational trade-off* for avoiding catastrophe.
      *   **Sophisticated Chooser Reply (Claim 2):** Shows the agent can *respect* their catastrophic risk aversion value *through precommitment*, avoiding the pump without becoming an EU maximizer.
      *   **One-Shot Chooser (Claim 4):** Renders the main weapon (diachronic pump) irrelevant for many real decisions.
      *   **"Worse Off" Ambiguity:** Highlights that the pump defines "worse" by the pump's logic or EU, not necessarily by the agent's own complex values (e.g., "I'm worse off money-wise but avoided potential ruin, which was my priority").

  ## What to Paste (Concisely)

  "Your money-pump argument shows potential inconsistency *if* we accept the EU axioms as the definition of coherence. But that's the crux: **it doesn't prove that catastrophic risk aversion is an 'error' rather than a core value.** Here's why:

  1.  **One-Shot Decisions:** For a single grant, diachronic pumps don't apply. Synchronic pumps only matter *if* someone offers the specific bad bundle.
  2.  **Small Pumps:** Even if exploitable, the potential loss might be tiny compared to the catastrophic risk avoided. Accepting this exploitability can be rational trade-off.
  3.  **Sophistication:** I can precommit to avoid paths leading to catastrophe, respecting my values without getting pumped.
  4.  **"Worse Off" By Whom?** The pump shows a loss by *its* or *EU's* lights. Avoiding extinction might make me 'worse off' in dollars but *better off* by my primary value of survival.

  **Demonstrating inconsistency under specific EU tests isn't the same as showing my value for avoiding ruin is mistaken.** The money-pump argument assumes the very framework it's trying to defend."
