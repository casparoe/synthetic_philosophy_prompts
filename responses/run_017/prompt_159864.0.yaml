prompt: |-
  I'm revising a chapter on the ethics of admission, and I've hit a problem I can't see around. My working account — I call it protective substitutability — reads the Refugee Convention as a surrogate-protection device: what triggers international protection is the failure of a state to discharge its protective function toward its own citizens, and the five grounds in Article 1A(2) are best understood as a historically contingent enumeration of the forms that failure characteristically took in 1951. On that reading, the exclusion of people displaced by drought, sea-level rise, or slow-onset environmental collapse is simply a gap in the enumeration, and the repair is obvious: add a sixth ground, something on the order of severe environmental deprivation, so that the protected class once again tracks the class of people whose states have failed them. I've also stopped being impressed by the objection that this would vastly expand the class. A duty doesn't weaken because more people fall under it, and I'd rather bite that bullet than let the contingency of a 1951 drafting choice decide who is protected.

  What I can't settle is the downstream question, and I suspect it bears on the first. Nearly everything I read treats the duty to admit as attaching to whichever state the person manages to reach, since jurisdiction is what makes an otherwise abstract duty determinate. But arrival is a matter of luck — geography, smuggling routes, whether a given border is militarized — and it seems to follow that the duty cannot really be assigned by arrival. Yet when I try to assign it by a non-arbitrary criterion instead (capacity, causal contribution to the harm, pre-existing ties, comparative suitability for integration), each one either proves unstable under reflection or generates results I take to be plainly wrong. I've started to wonder whether the question itself is malformed, and whether the honest conclusion is that the duty to admit has no determinate bearer at the level of principle.

  Before I commit to that in print: is the sixth-ground repair the right way to extend the Convention's rationale, or does the surrogate-protection reading actually tell against the definitional route I've been taking? And if the duty to admit really is unassignable in principle, what follows for the chapter's claim that states must take refugees in — is that a conclusion I should defend, or a sign that I've misdescribed the duty from the start?
reasoning: |-
  Okay, the user is working on a chapter about the ethics of admission, specifically refugee ethics. They've developed an account called "protective substitutability," interpreting the Refugee Convention as a surrogate-protection mechanism. The core idea is that international protection kicks in when a state fails to protect its own citizens. The five grounds in Article 1A(2) are seen as historical contingencies from 1951. The user proposes adding a sixth ground for environmental deprivation to cover current gaps.

  The user isn't worried about the potential expansion of the protected class, arguing that a duty doesn't weaken just because more people qualify. But they're stuck on the downstream question: which state bears the duty to admit refugees? Current practice ties the duty to the state where the refugee arrives, but that seems arbitrary based on luck and geography. Alternative criteria like capacity, causal contribution, ties, or integration suitability all have problems—either unstable under scrutiny or leading to counterintuitive results. The user wonders if the duty is fundamentally unassignable at the principle level.

  Now, the user has two main questions: First, is adding a sixth ground consistent with their surrogate-protection rationale? Second, if the duty to admit is unassignable, does that undermine their claim that states must admit refugees?

  First, the sixth ground seems solid. Environmental disasters often stem from state failure—either directly through neglect or indirectly via climate policies. The historical-contingency argument holds; the 1951 grounds reflected mid-20th-century concerns, and updating for contemporary failures makes sense. The user’s dismissal of the "floodgates" objection is defensible—protection needs shouldn’t be limited by outdated definitions. The surrogate-protection framework actually strengthens the case for including environmental deprivation, as it’s another form of state failure to protect citizens.

  Second, the duty-to-assign problem is trickier. Arrival-based assignment is indeed arbitrary, but the alternatives all falter. Capacity might incentivize underinvestment, causal contribution is narrow and hard to prove, ties are exclusionary, and integration suitability is subjective. The user’s suspicion that the duty is indeterminate at the principle level seems plausible. However, that doesn’t negate the duty itself—it just means allocation requires a cooperative institutional framework. The user could argue that the primary duty is collective (all states), with secondary duties assigned through treaties or international bodies. This avoids the "unassignable" trap while acknowledging that no single criterion works alone.  

  For the chapter, the user should defend that states must admit refugees but clarify that the "which state" question demands institutional solutions. The duty isn’t misdescribed—it’s just non-ideal in application. Emphasizing the need for burden-sharing mechanisms (like the EU’s relocation schemes or the Global Compact on Refugees) could bridge the principle-practice gap. This keeps the moral core intact while addressing the distribution challenge pragmatically.  

  Potential pushbacks: Critics might say indeterminate assignment undermines enforceability. The user could counter that many duties (e.g., climate reparations) face similar allocation issues yet remain valid. Also, adding the sixth ground might face political resistance, but the chapter’s focus is ethical, not practical feasibility.  

  In sum: Yes, the sixth ground fits the surrogate rationale. And yes, the admission duty is collectively held but institutionally assigned—defend this as a call for better international cooperation, not a flaw in the theory.
answer: |-
  Your dilemma cuts to the heart of refugee ethics and institutional design. Let's address both the "sixth ground" proposal and the duty-assignment problem, showing how they interconnect and what this means for your chapter.

  ### 1. The Sixth Ground & Surrogate-Protection Rationale
  Your "protective substitutability" framework **strongly supports** adding environmental deprivation as a Convention ground. Here's why:

  - **Consistency with Surrogate Logic**: Environmental collapse (e.g., drought-induced famine, sea-level inundation) often manifests state failure. This includes:
    - *Direct failure*: Inability/incompetence to mitigate disaster or relocate citizens (e.g., Somalia's drought response).
    - *Indirect failure*: Contributing to climate change while lacking adaptive capacity (e.g., low-emitting SIDS devastated by sea-level rise).
    - *Structural failure*: Prioritizing elite interests over disaster resilience (e.g., deforestation policies exacerbating floods).
    
  - **Historical Contingency Defended**: The 1951 grounds reflected *then-prevalent* threats to state-citizen bonds (persecution, statelessness, war). Today, environmental failure is a comparable rupture. Your rationale isn't expansionist—it's *maintaining functional equivalence* as threats evolve.

  - **Gap, Not Overreach**: Excluding environmental displacement *is* a contingent gap. States *routinely* protect citizens from environmental harm domestically (disaster relief, climate adaptation). When they fail catastrophically, surrogate protection aligns perfectly with the Convention's logic.

  **Objection Rebutted**: Concerns about "opening floodgates" confuse *scope* with *validity*. If a state fails millions environmentally, those millions *are* unprotected—the moral urgency doesn't diminish because numbers are large. The Convention's duty was always scalable in principle (see Cartagena Declaration's broader grounds).

  **Conclusion**: Your repair is coherent. Rejecting it would ironically *undermine* surrogate theory by letting 1951’s historical context fossilize protection.

  ---

  ### 2. The Duty-Assignment Problem
  Your instinct is correct: **The duty to admit is fundamentally collective and non-assignable to specific states at the level of abstract principle.** But this doesn’t negate the duty—it reorients how we institutionalize it.

  #### Why Non-Arbitrary Assignment Fails:
  - **Capacity**: Incentivizes states to underdevelop asylum systems ("incapacity defense"). Also, capacity is dynamic—admitting refugees can *build* capacity.
  - **Causal Contribution**: Assigns duty only to harm-causers (e.g., high-emission states). But this neglects:
    - *Collective causation* (climate change is multilateral).
    - *Non-culpable states* (e.g., new democracies inheriting ecological crises).
    - Refugees from non-anthropogenic disasters (e.g., volcanic eruptions).
  - **Pre-existing Ties**: Arbitrarily privileges refugees with colonial/economic ties (e.g., admitting Rwandans to Belgium but not Bangladesh).
  - **Integration Suitability**: Subjective, culturally biased, and penalizes traumatized refugees.

  #### A Better Path: Collective Duty + Institutional Allocation
  - **Moral Core**: States collectively owe protection to the unprotected. This duty is *primary* and *non-derogable*.
  - **Secondary Institutional Duty**: The "who admits" question is *allocative*, not existential. It requires:
    - A **burden-sharing framework** (e.g., quotas based on GDP, land area, historical emissions).
    - A **clearinghouse mechanism** (e.g., UNHCR matching refugees to states via agreed criteria).
  - **Arrival as a Trigger, Not Justification**: Arrival activates a *provisional* duty of *non-refoulement* and humane treatment. But ultimate resettlement is determined by the collective system—not proximity.

  **Example**: The EU’s (flawed) relocation quotas show this is feasible. A global scheme could use:
  > *Allocation Formula = (GDP × 0.4) + (Historical Emissions × 0.3) + (Land Area × 0.2) + (Existing Diaspora × 0.1)*

  ---

  ### Implications for Your Chapter
  1. **Defend the Indeterminacy Claim**: Yes—argue forcefully that no single state bears a *pre-institutional* duty to admit specific refugees. This exposes the fiction of "arrival-based" duties.
  2. **Reframe, Don’t Abandon, the Admission Duty**: States *must* admit refugees *as a collective obligation*. The duty is real but requires institutional mediation. Use this to critique the current system’s reliance on geographic luck.
  3. **Link to Institutional Reform**: Conclude with concrete proposals:
     - Amend the Convention to include environmental grounds (validating your repair).
     - Create a Global Protection Agency to allocate resettlement places.
     - Tie allocation to measurable criteria (e.g., the formula above).

  **Why This Strengthens Your Thesis**: It shows that surrogate protection isn’t just moral theory—it demands institutional innovation to function fairly. The duty to admit isn’t misdescribed; it’s *under-institutionalized*. This bridges ethics and practice, making your chapter both philosophically rigorous and policy-relevant.

  > "The duty to protect the unprotected is universal; the duty to *host* must be shared. Geography is no substitute for justice." — This could be your chapter’s cornerstone.
