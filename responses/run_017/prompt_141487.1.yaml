  What would shift these numbers? Not neuroscience about NCCs - that only addresses correlation, not necessity. A killer argument showing why fading zombies must be contradictory could drop (C) to 30%, while Russellian monism gaining wider acceptance might lift (A) to 25%. But honestly, these credences are pretty sticky - they reflect deep philosophical intuitions that aren't easily dislodged.

