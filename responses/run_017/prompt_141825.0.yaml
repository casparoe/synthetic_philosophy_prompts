prompt: |-
  On Thursday I'm giving a talk at a food-systems workshop. The room is mostly applied micro economists — agricultural and resource econ, plus a couple of industrial-org people who actually model supply chains — with two consequentialist philosophers who are already sympathetic but want the mechanism nailed down before they'll sign on.

  My thesis is the batch-trigger reply to the inefficacy objection: individual consumer acts aren't causally inert because supply chains respond to quantities at discrete thresholds (a retailer's reorder point, a processor's batch size, a contract trigger), so my unit of chicken isn't just 1/N of an aggregate demand curve, it's sometimes the unit that tips a batch, and ex ante the expected effect is dominated by those threshold-crossing possibilities rather than by smooth marginal response. I'm also claiming the structure generalizes passed diet: in voting the relevant thresholds are district margins that trigger recounts, seat-allocation formulas, or donor behaviour.

  Can you write me a Q&A prep sheet for that room? Six or seven objections, and only the ones this audience would actually raise — not the ones I'd get of a room full of utilitarians — ordered by how much damage they'd do, each phrased the way these people would actually say it (inframarginal, elasticity, identification, leakage, that sort of vocabulary), with a two-minute reply and a note on where the reply is soft. I expect the supply-response and the identification objections to hurt most, but tell me if I'm wrong about that. Also: what do I concede before anyone asks, which single reply has to land for the whole thing to survive, and what's the question I'm hoping nobody asks — I think it's something about the view making the wrongness of my purchase depend on facts about a retailer's inventory software, but I'd rather hear your version of it.

  Be committed about the ordering and about which objections have real force; I don't want a menu. End with a line in this exact form:

  \answer{the one objection I should just concede outright, five words or fewer}
