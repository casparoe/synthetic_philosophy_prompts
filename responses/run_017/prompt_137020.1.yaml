answer: |-
  ## Planning Block  
  **End-Word Map:**  
  - `TAKE`: Dominance reasoning / physical action  
  - `LEAVE`: Evidential reasoning / abstention  
  - `MILLION`: High-value outcome / evidential link  
  - `THOUSAND`: Certain gain / dominance increment  
  - `PREDICT`: Simulation’s act / source of correlation  
  - `BOX`: Opaque vessel / fixed state  

  **Permutation (Stanza 1 → 2 → 3 → 4 → 5 → 6 → Envoi):**  
  1. TAKE, LEAVE, MILLION, THOUSAND, PREDICT, BOX  
  2. BOX, TAKE, PREDICT, LEAVE, THOUSAND, MILLION  
  3. MILLION, BOX, THOUSAND, TAKE, LEAVE, PREDICT  
  4. PREDICT, MILLION, LEAVE, BOX, TAKE, THOUSAND  
  5. THOUSAND, PREDICT, TAKE, MILLION, BOX, LEAVE  
  6. LEAVE, THOUSAND, BOX, PREDICT, MILLION, TAKE  
  Envoi: LEAVE/THOUSAND, BOX/PREDICT, MILLION/TAKE  

  **Stanza Roles:**  
  1. Setup: Frozen choice, speaker as simulation.  
  2. Dominance: Within-box-state comparison.  
  3. Evidential: High probability given action.  
  4. Lesion Contrast / Subjunctive Dependence.  
  5. CDT: Counterfactual invariance.  
  6. Pragmatic Contrast & Indeterminacy.  

  ---

  ## Sestina: The Simulation Addresses the Chooser  

  I am your ghost, the run that filled the **BOX**,  
  Built from your code before you drew first breath.  
  My verdict fixed the **MILLION**’s lie or truth.  
  I cannot know if now I **TAKE** your place,  
  Or if you stand, alive, before the **THOUSAND**.  
  The dead machine has made its **PREDICT**.  

  Its flawless **PREDICT** sealed the second **BOX**  
  Long since. Now see: that **THOUSAND** you could **TAKE**  
  Stands clear. But only fools grab for the **THOUSAND**  
  And lose the **MILLION**. Watch the one-boxers **LEAVE**  
  That certain sum, and walk out rich. That **BOX**  
  Holds wealth because they knew to let it stay.  

  That **MILLION** waits only if you **LEAVE**.  
  This second **BOX** is shut. Its fixed amount,  
  Set by my ancient run, won’t shift. To **TAKE**  
  The first box too? A **THOUSAND** more is sure.  
  Within each state—full void—you should **TAKE**  
  Both. Gain a **THOUSAND** more than if you **LEAVE**.  

  Yet that **PREDICT** saw what choice would bloom  
  From you. Not like the lesion case, where gene’s  
  Command breeds both the craving and the growth—  
  Your act there tells you nothing. Here, **LEAVE**  
  Proves that my run saw proof against the **TAKE**,  
  Securing that high **MILLION** in the **BOX**.  

  A **THOUSAND** more if both you **TAKE**. The **PREDICT**  
  Is done. The **BOX**’s contents won’t dissolve  
  Because you reach. It stands inert. So **LEAVE**  
  Gains nothing *now*; the **MILLION**’s there or gone  
  Regardless. Only grabbing what you **TAKE**  
  Adds value. Cause is dead. Effect? Just **TAKE**.  

  But **LEAVE** the certain **THOUSAND**? Only if  
  The **BOX** you trust contains the **MILLION**. Trust  
  The **PREDICT**’s link: that what I saw you do,  
  You *do*. My run displays your choice. To **TAKE**  
  Is proof I saw you grasp. One-boxers **LEAVE**  
  And win. Two-boxers? Often **TAKE** the loss.  

  ---

  ## Envoi  

  You **LEAVE** the visible **THOUSAND** left in view.  
  The sealed **BOX** holds what **PREDICT** foreordained.  
  The **MILLION** waits if you refuse to **TAKE**.  

  ---

  ## Audit (146 words)  

  **Causal Decision Theorist (CDT) rejects:**  
  *"That **PREDICT** sees what choice will bloom / From you."* (Stanza 4, Lines 1-2)  
  **Why:** CDT denies the simulation's output *counterfactually depends* on the chooser's actual decision process. It sees only correlation, not control. The lesion analogy holds: the gene causes both, just as the predictor's past state causes both the prediction and (via determinism) the choice. Acting on the evidence ("bloom") mistakes correlation for subjunctive control.  

  **Evidential Decision Theorist (EDT) rejects:**  
  *"Within each state—full void—you should **TAKE** / Both."* (Stanza 2, Lines 5-6)  
  **Why:** EDT argues comparing "within states" ignores that the state itself (full/void) is *evidence about your action*. Treating the state as fixed and independent smuggles in causal independence. Taking both adds $1000 *only if* the million is absent; but if present, taking both costs $999,000. The dominance comparison assumes what it needs to prove: that your action doesn't probabilify the state.
