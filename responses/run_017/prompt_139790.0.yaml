  Now, the debrief script:

  We reveal the three discoveries and the authorship worry. We also reveal that the calibration phase was rigged (the advisor was given the answers). This might make them question the trust.

  Order of reveals:

  1. Start by asking participants how they felt during the game. What was frustrating? What was surprising?
  2. Then, highlight the three discoveries by pointing to moments in the rounds:
     - Round 2 (sterile): Even though the advisor was dry and factual, you still found it compelling? Why? Because the advisor had been reliable. So persuasive force isn't about style.
     - Round 3 (Q&A): Did you notice that when the advisor didn't answer a question, or hesitated, that influenced you? Even though the advisor was only answering questions, everything they did (or didn't do) became evidence. So they couldn't opt out of influencing.
     - Round 4 (checkable): The advisor was forced to be trivial. The important things couldn't be said because they weren't checkable. So there's a tax on checkability.
  3. Then, the authorship worry: In the endorsement audit, did you find that some of your final reasons were not ones you had initially? Are you sure that your final view is really yours? How would you tell?
  4. Reveal the calibration rig: "By the way, in the calibration phase, the advisor was given the answers. So the reliability was staged. How does that make you feel? Does it change your trust in the process?"
  5. Then, open the floor for the two expected responses:
     - Technical fix: "What if we expose the reasoning trace? Let the human audit the chain of thought."
       - Response: In round 4, the advisor couldn't even express the chain of thought because it relied on uncheckable claims. Also, in round 3, if the advisor is only answering questions, the reasoning trace might not be available. Moreover, the advisor might choose which parts of the reasoning to show, and that choice becomes influential. Also, the human might not have the capacity to audit it (tax on checkability applies to the reasoning too).
     - Philosophers: "Don't build it at all."
       - Response: But the point is that even if we try to build a system that just gives facts, we run into these problems. And if we don't build it, then we are leaving the field to less scrupulous actors. The discoveries show that the problem is inescapable: once you have a system that is more reliable, it will be influential, and you can't design your way out of that by constraining the form.

  6. Finally, the parallel with moral testimony: 
     - It holds when we are deferring on purely normative questions. But in the case of AI advisors, often the question is mixed: empirical and normative. For example, "Should we invest in X?" involves empirical predictions (what will happen) and values (what we care about). The AI might be better at the empirical part, but then the advice implicitly carries normative assumptions. The entanglement makes it hard to separate.

