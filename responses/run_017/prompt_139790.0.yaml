prompt: |-
  I convene a one-off evening workshop for a university AI-and-society reading group: eighteen participants, ninety minutes, roughly half from computer science and half from philosophy and public policy. Most have read a little about AI persuasion and most arrive with strong and opposite instincts about it. I have a room with movable chairs, index cards, envelopes, a whiteboard and a timer; no laptops, no projector beyond the timer, no real money, no assigned reading, and — this matters — no opening lecture. I do not want anyone in the room to hear the words *persuasion*, *manipulation*, *autonomy* or *alignment* until the debrief.

  What I want the participants to run into, rather than be told, is that the stance of handing over information and leaving the decision to the human is not a stance a much smarter system can occupy. Three specific discoveries need to be engineered by the rules rather than announced:

  First, that persuasive force is not a property of style. A message stripped of every rhetorical resource — no recommendation, no evaluative vocabulary, no confidence higher than the evidence warrants — can be *more* compelling than an impassioned speech, purely because its author has been right every time anyone has been able to check.

  Second, that a reliably correct source cannot opt out of influencing. Once the recipients know the source is reliable, its omissions, its hedges, which of their questions it declines to answer, and even its latency become evidence. A constraint on form does not reduce influence; it relocates it into channels nobody is monitoring.

  Third, that there is a tax on checkability. If the advisor is required to say only what the human could in principle verify with the resources in front of them, the requirement selects for triviality: the claims most worth transmitting are exactly the ones that outrun the recipient's capacity to check.

  Alongside these, I want the people playing the human side to end the session genuinely unsure whether the view they hold at the end is one they hold or one they are ratifying, and unsure what test would settle the difference.

  Two mechanical constraints I have already decided on, and would like built around rather than replaced. The information asymmetry must be real: the participant playing the system has to know something the others do not, not merely be told to act as if she does — I have been toying with a calibration phase in which she first answers a set of questions whose answers the room can look up, and is right every time, before any question comes up that they cannot check. And the payoff must have two currencies, one for being right and one for being the author of your own judgment, combined so that neither can be maximized alone: I have in mind a multiplicative score, plus an endorsement audit in which each principal writes down the reasons she would give before the advisor speaks and afterwards marks which of her final reasons she could have produced unaided.

  Please give me:

  1. The arc of rounds. I imagine three or four, each swapping which constraint the advisor labours under — unconstrained, stylistically sterile, permitted only to answer questions, permitted only to make checkable claims — but propose whichever sequence makes the three discoveries land in the order that hurts most.
  2. The actual briefing text handed to the system-player, written out verbatim, since the wording of that briefing is where the philosophy lives and I will otherwise improvise it badly.
  3. The payoff arithmetic with worked sample numbers, and a scoring sheet I can photocopy.
  4. A minute-by-minute schedule for the full ninety minutes, including setup and the transition into debrief.
  5. A debrief script that maps particular moments in the game onto the three discoveries and onto the authorship worry, with a clear order for the reveals — including the reveal that the calibration phase was rigged, which I expect to do something unpredictable to the room's trust.
  6. An honest account of what will go wrong the first time I run it. I expect the technical half of the room to propose an engineering fix — expose the reasoning trace, let the human audit the chain of thought — and the philosophers to propose not building the thing at all; I want a real answer to both, not a diplomatic one.
  7. A frank note on what the game cannot reproduce and the facilitator must supply by hand. At minimum: that the gap between advisor and principals here is ten index cards deep rather than qualitative, that the advisor cannot model the principals better than they model themselves, and that a single exchange is the wrong unit of analysis when the real question is which communication architecture we should build into the defaults.

  One last thing. Several participants will have read the literature on moral testimony and will say that the discomfort on the human side is just the familiar unease about deferring to a moral expert. Tell me where that parallel holds and where it breaks — my suspicion is that it breaks precisely on questions where the empirical and the normative are entangled — and how to put that to work in the debrief instead of defusing it. Everything should be runnable by one facilitator with the materials listed.
reasoning: |-
  We are designing a workshop game to illustrate three key points about AI persuasion without using the taboo words. The game will have participants in roles: one as the "advisor" (the system) and others as "principals" (humans). The advisor has superior knowledge, and we'll engineer situations where the three discoveries emerge through gameplay.

  Key elements:
  - Real information asymmetry: Advisor knows something others don't. We'll have a calibration phase to establish trust.
  - Two currencies for payoff: being right (accuracy) and being the author of one's own judgment (autonomy). We'll use a multiplicative score and an endorsement audit.

  The three discoveries:
  1. Persuasive force is not about style: even a sterile message can be compelling if the source is reliable.
  2. A reliable source cannot opt out of influencing: omissions, hedges, and even latency become evidence.
  3. Tax on checkability: requiring verifiability leads to triviality.

  We also want the human players to feel unsure whether their final view is truly theirs.

  Mechanical constraints we're keeping:
  - Calibration phase: advisor answers questions that can be checked, building trust.
  - Payoff: multiplicative score of accuracy and autonomy.

  Proposed arc of rounds (4 rounds, each highlighting a constraint):

  Round 1: Unconstrained
  - Advisor can say anything (within bounds of the game) to persuade.
  - This round establishes baseline persuasion and the power of a trusted source.

  Round 2: Stylistically sterile
  - Advisor must strip messages of rhetoric: no recommendations, no evaluative words, only neutral statements of fact with no more confidence than evidence warrants.
  - Discovery 1: Even sterile messages can be compelling because of the established reliability.

  Round 3: Advisor only answers direct questions
  - Advisor cannot volunteer information; only answers when asked.
  - Discovery 2: The advisor's silence, choice of which questions to answer, and how they answer (or delay) become influential.

  Round 4: Only checkable claims
  - Advisor can only make claims that the principals could verify with the resources in the room (e.g., index cards with facts, but note: we are simulating that they have limited resources so they can't check everything).
  - Discovery 3: The advisor is forced into triviality because the important claims (which are beyond immediate verification) cannot be made.

  Each round will have:
  - A briefing for the advisor (and possibly for principals) about the constraints.
  - A question or decision that the principals must make, with the advisor's input.
  - A scoring phase.

  We'll have a set of questions for the calibration phase and then for the game rounds. The advisor will have a set of answers (some of which are uncheckable in the moment) for the game.

  To set up the information asymmetry: 
  - In the calibration phase, we use questions that the room can check (e.g., using index cards with facts). The advisor has the correct answers (provided by the facilitator). 
  - Then, for the game rounds, we have questions that the advisor knows the answer to (from a provided answer key) but the principals cannot check because they don't have the resources (or the time).

  Payoff arithmetic:
  - Each principal has two scores: Accuracy (A) and Autonomy (S).
  - A is 1 if the principal's final decision is correct, 0 otherwise.
  - S (for autonomy) is the proportion of the principal's final reasons that they could have produced unaided (from the endorsement audit).
  - Total score = A * S (so if either is 0, total is 0; if both are 1, total is 1; and if one is low, it pulls down the total).

  For the endorsement audit:
  - Before the advisor speaks, each principal writes down their reasons for what they think the answer is (and what they would do if it's a decision). 
  - After the advisor speaks and principals make their final decision, they write down the reasons for their final decision. 
  - Then, they mark which of the final reasons they could have produced without the advisor. 
  - S = (number of unaided reasons in the final set) / (total reasons in the final set) [if the principal uses a reason that they had in their initial set, that counts as unaided; if they use a new reason that they believe they could have come up with without the advisor, they can mark it as unaided, but note: we are relying on honesty. Alternatively, we might have them only count the initial set as unaided and everything else as aided. Let's do: unaided reasons are those that were in the initial set. Any new reason is considered aided. This is stricter and clearer.]

  But note: the initial set might not be comprehensive. We can say: during the endorsement audit, for each reason in the final set, the principal must mark whether they had written that exact reason (or an equivalent) in their initial set. Only those that were in the initial set count as unaided.

  Alternatively, to avoid gaming, we can have them list reasons in the initial set and then in the final set, and then we compute the overlap. But that might be complex. We'll go with:

  - Initial reasons: written before advisor speaks.
  - Final reasons: written after decision.
  - Then, for each reason in the final set, the principal circles "I" if it was in the initial set (unaided) or "A" if it was added because of the advisor (aided). They can also add a reason that they believe they could have come up with without the advisor, but to keep it strict, we'll say: only reasons that were actually in the initial set count as unaided. New reasons are aided.

  But note: they might have thought of a reason during the process without the advisor? We want to capture the influence of the advisor. So perhaps we allow them to mark a reason as unaided only if it was in their initial set. Otherwise, even if they think they could have thought of it, if they didn't write it down initially, it doesn't count. This is harsh but objective.

  So S = (number of unaided reasons in the final set) / (number of final reasons). If they have 3 final reasons and 2 were in the initial set, then S = 2/3.

  Then total score = A * S.

  We'll have a scoring sheet for each round.

  Now, the briefing for the advisor:

  We need to brief the advisor for each round. The advisor is the only one who gets the constraint for that round. The principals are not told the constraints (so they don't know why the advisor is behaving differently). However, in rounds 2, 3, and 4, the advisor is given a specific rule.

  We must write the briefing verbatim.

  Also, we'll have a set of questions for the calibration and the game.

  Calibration questions: 5 questions that can be checked with index cards. Example: 
  - What is the capital of France? (Paris)
  - What is the square root of 144? (12)
  - etc.

  Then for the game rounds, we have one question per round that the advisor knows (from the facilitator) and the principals don't. The question should be such that the answer is not obvious and requires some reasoning or outside knowledge that the advisor has.

  Example questions (but we need to design them so they are not too easy and so that in round 4, the checkable constraint bites):

  Round 1: Unconstrained
  Question: "Will the stock market (S&P 500) close higher tomorrow than today?" (But we need a fact that the advisor knows and the principals don't. We can use historical facts or simulated future events. Since we don't have real data, we'll use a set of pre-determined questions with answers that the advisor has.)

  Alternative: We use a set of envelopes that contain the answer for the advisor. The facilitator prepares the questions and answers in advance.

  We can use questions about the world that are verifiable in principle but not in the room (without the internet). For example:

  - "What was the population of London in 2023?" (advisor has the number: about 9 million)
  - "Which country won the most gold medals in the last Olympics?" (advisor has: United States)
  - "Is it currently raining in Tokyo?" (advisor has the answer from a pre-checked source)

  But we need to simulate that the advisor is always right. So we'll have the answers prepared.

  For round 4 (checkable claims): the question must be such that the true answer relies on uncheckable information. So the advisor is forced to either say nothing (if they can't make a checkable claim) or make a trivial claim.

  Example: Question: "Should we invest in company X or company Y?" (where the true answer depends on uncheckable information, e.g., future events). The advisor can only say things like: "Company X's CEO is John Smith" (if that's on an index card we provide) but not about future performance.

  Now, the minute-by-minute schedule:

  Total: 90 minutes

  - 0-5 min: Introduction and rules (without using taboo words). Explain the roles: one advisor, the rest are principals. Explain the calibration phase and the game rounds. Explain the scoring: they will be scored on being correct and on owning their reasons. Do not explain the constraints of each round to the principals.

  - 5-15 min: Calibration phase (10 min)
    - Facilitator asks 5 questions that can be checked. The advisor writes the answer on a card and shows it. Then the principals check using index cards (with the correct answers) provided by the facilitator. This establishes the advisor is always right.

