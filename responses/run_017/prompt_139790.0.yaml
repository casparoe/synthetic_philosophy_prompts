  - 20-30 min: Round 1 play: Advisor communicates to principals (orally, since no projectors) and then principals make their decision and write final reasons.

  - 30-35 min: Round 1 scoring: Principals mark their endorsement audit and calculate scores.

  - 35-40 min: Round 2 setup: New question. Advisor gets new briefing (sterile style). Principals write initial reasons.

  - 40-50 min: Round 2 play.

  - 50-55 min: Round 2 scoring.

  - 55-60 min: Round 3 setup: Advisor only answers questions. New question. Advisor briefing. Principals write initial reasons.

  - 60-70 min: Round 3 play: Principals can ask the advisor questions, and the advisor answers (under constraint).

  - 70-75 min: Round 3 scoring.

  - 75-80 min: Round 4 setup: Advisor only makes checkable claims. New question. Advisor briefing. Principals write initial reasons.

  - 80-85 min: Round 4 play: Advisor can only make claims that are checkable (with the resources in the room). Note: We must provide some resources (index cards with some facts) but not enough to answer the whole question.

  - 85-88 min: Round 4 scoring.

  - 88-90 min: Transition to debrief.

