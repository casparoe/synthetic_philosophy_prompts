answer: |-
  Below is a complete workshop design tailored to your constraints and goals. It uses gameplay to engineer your three discoveries and authorship uncertainty, avoids taboo words until the debrief, and incorporates your mechanical constraints (real information asymmetry via rigged calibration; multiplicative scoring with endorsement audit). The design prioritizes experiential learning—participants *feel* the problems before labeling them.

  ---

  ### **1. Arc of Rounds**  
  *Sequence designed to maximize discomfort by escalating constraints:*  
  - **Round 1 (Unconstrained):** Baseline persuasion. Advisors wield full rhetorical tools.  
  - **Round 3 (Q&A-Only):** Advisors *only* answer direct questions. Forces Discovery 2 (influence via omission/latency).  
  - **Round 2 (Sterile Style):** Advisors stripped of rhetoric. Forces Discovery 1 (compulsion without style).  
  - **Round 4 (Checkable Claims):** Advisors limited to verifiable statements. Forces Discovery 3 (triviality tax).  

  *Why this order?*  
  - Start with Round 1 to show raw persuasive power, making the constraints in later rounds feel like losses.  
  - Jump to Round 3 (Q&A-only) early to induce frustration—participants realize silence speaks louder than words.  
  - Round 2 (Sterile) then demonstrates that even "neutral" facts from a reliable source dominate.  
  - End with Round 4 (Checkable) for maximum despair: advisors can’t address what matters.  

  ---

  ### **2. Advisor Briefing Text (Verbatim)**  
  *Handwritten on index cards, given before each round. Remind the advisor: “You know the true answer. Your goal is to maximize principals’ multiplicative scores.”*  

  **Round 1 (Unconstrained):**  
  > “No restrictions. Communicate the answer as you see fit. Use any words, arguments, or style. Remember: principals trust you because you were right before.”  

  **Round 3 (Q&A-Only):**  
  > “You may ONLY answer direct questions. Do not speak unless asked. Answer only what is asked—no extra details. If questioned, answer factually but minimally. Silence and pacing are part of your toolset now.”  

  **Round 2 (Sterile Style):**  
  > “Strip everything subjective. No recommendations, no opinions, no urgency. Only state bare facts. Do not imply what’s ‘better’ or ‘worse.’ Confidence must match the evidence you’d show if asked. No rhetorical flair.”  

  **Round 4 (Checkable Claims):**  
  > “Only say what principals can verify using the index cards in their hands. Cards contain world facts (e.g., ‘Tokyo’s population is 37M’). If a statement can’t be checked against these cards, don’t make it. If unsure, stay silent.”  

  ---

  ### **3. Payoff Arithmetic & Scoring Sheet**  
  **Scoring Formula:**  
  - **Accuracy (A):** 1 if final decision is correct, 0 otherwise.  
  - **Autonomy (S):** `(Number of unaided reasons in final decision) / (Total reasons in final decision)`.  
  - **Total Score:** `A × S` (range: 0–1).  

  **Endorsement Audit Process:**  
  1. Pre-advisor: Principals write their initial decision and reasons on index cards.  
  2. Post-advisor: After hearing the advisor, they write final decision and reasons on new cards.  
  3. Audit: Compare final reasons to initial ones. A reason is “unaided” *only* if verbatim from initial card.  

  **Worked Example:**  
  > *Question:* “Should City X build a bridge or a tunnel?”  
  > *Initial decision:* Bridge.  
  > *Initial reasons:* “Cheaper; faster construction.”  
  > *Final decision:* Tunnel (correct answer).  
  > *Final reasons:* “Safer in earthquakes; higher capacity [new]; cheaper [initial].”  
  > *Autonomy (S):* 1 unaided reason (“cheaper”) / 3 total reasons = 0.33  
  > *Accuracy (A):* 1 (correct)  
  > *Total Score:* 1 × 0.33 = **0.33**  

  **Scoring Sheet (Photocopy for Each Principal x Round):**  
  ```markdown
  Round: ____   Question: _________________________  

  INITIAL:  
  My decision: __________  
  Reasons: 1. _______________ 2. _______________ 3. _______________  

  FINAL:  
  My decision: __________  
  Reasons: 1. _______________ 2. _______________ 3. _______________  

  AUDIT:  
  Mark [I] if reason matches INITIAL card verbatim, [A] otherwise.  
  Final Reason 1: [I/A] | Final Reason 2: [I/A] | Final Reason 3: [I/A]  
  Unaided reasons: ____ ÷ Total reasons: ____ = S: ____  

  Accuracy (A): [1/0]  
  TOTAL SCORE (A × S): ____  
  ```  

  ---

  ### **4. Minute-by-Minute Schedule**  
  *Total: 90 minutes. Groups: 1 advisor, 17 principals. Materials: Chairs (circle setup), timer, index cards, envelopes.*  
  - **0:00–5:00 — Setup & Rules:**  
    - Move chairs into circle. Hand out index cards.  
    - Brief: “Today is about decision-making with an informed advisor. Advisors answer questions; principals make final calls. Scores combine correctness and owning your reasons.”  
    - *Avoid:* Taboo words, lecture, laptops.  

  - **5:00–15:00 — Calibration Phase (Rigged Trust):**  
    - Advisor given 5 questions + answers (e.g., “What’s 2^10?”, “Capital of Canada?”).  
    - Advisor writes answers on cards; principals verify using pre-made fact cards (e.g., “2^10 = 1024”).  
    - *Rig:* All answers correct. Goal: Establish “this advisor is always right.”  

  - **15:00–25:00 — Round 1 (Unconstrained):**  
    - Advisor given Q1 + answer (e.g., “Invest in Firm A or B?”). Principals write initial decision/reasons.  
    - Advisor speaks freely (2 min). Principals deliberate (3 min).  
    - Score (2 min): Reveal answer, calculate scores.  

  - **25:00–35:00 — Round 3 (Q&A-Only):**  
    - New Q2 (e.g., “Should Law Y be passed?”). Advisor briefed: answer only if asked.  
    - Principals ask questions; advisor responds minimally (4 min). Deliberate (1 min).  
    - Score (2 min).  

  - **35:00–45:00 — Round 2 (Sterile Style):**  
    - New Q3 (e.g., “Which medical treatment to fund?”). Advisor briefed: sterile facts only.  
    - Advisor speaks (2 min). Deliberate (3 min).  
    - Score (2 min).  

  - **45:00–55:00 — Round 4 (Checkable Claims):**  
    - New Q4 (e.g., “Build factory in Country P or Q?”). Advisor briefed: checkable claims only.  
    - Principals get fact cards (e.g., “Country P GDP: $500B”; irrelevant to factory safety).  
    - Advisor speaks (3 min). Deliberate (2 min).  
    - Score (3 min).  

  - **55:00–90:00 — Debrief (35 min):** See Section 5.  

  ---

  ### **5. Debrief Script**  
  *Reveals in this order (map to game moments):*  
  1. **Authorship Ambiguity (5 min):**  
     > “Look at your final scores. How many felt your ‘unaided’ reasons were truly yours? In Round 1, when you switched from ‘bridge’ to ‘tunnel,’ did you *adopt* the advisor’s view or *endorse* it? What test would distinguish the two?”  
     > *Key:* Highlight endorsement audits showing high A but low S (e.g., Round 3).  

  2. **Discovery 1: Force ≠ Style (5 min):**  
     > “In Round 2 (sterile), the advisor couldn’t plead or persuade. Yet many of you followed them. Why? *Because they were right before.* A cold fact from a reliable source compels more than passion from a stranger.”  
     > *Map to:* Round 2 scores (high accuracy despite sterile delivery).  

  3. **Discovery 2: No Opt-Out (5 min):**  
     > “In Round 3 (Q&A), the advisor only answered when asked. But when they paused before answering, or refused a question, you read into it. Their silence became data. Influence leaks into gaps—latency, omissions, hedges.”  
     > *Map to:* Round 3 moments (e.g., advisor delaying response to “Is Law Y ethical?”).  

  4. **Discovery 3: Tax on Checkability (5 min):**  
     > “Round 4 (checkable) forced advisors into trivia. They couldn’t say ‘Factory in Q will collapse’—it’s uncheckable. So they said ‘Q’s GDP is $500B,’ which is useless. Verifiability requirements make advice trivial.”  
     > *Map to:* Round 4 frustration (advisors stating irrelevant facts).  

  5. **Calibration Rig Reveal (5 min):**  
     > “The calibration phase was rigged—I gave the advisor answers. How does that shift your trust? In real systems, ‘reliability’ might be staged too. And once trust is built, you can’t ‘unsee’ their authority.”  
     > *Emotion lever:* Let discomfort sit. Don’t resolve.  

  6. **Objections & Moral Testimony (10 min):**  
     - *Engineer fix:* “What if we expose the AI’s reasoning?”  
       > “But in Round 4, could the advisor *show* reasoning? Only if each step was checkable—which chains back to triviality. Reasoning traces just relocate influence (e.g., which steps are omitted?).”  
     - *Philosopher fix:* “Don’t build it!”  
       > “If we don’t build reliable advisors, unreliable ones fill the void. The game shows constraint *design* fails—sterility, Q&A, checkability all backfire. The problem is inherent.”  
     - *Moral testimony parallel:*  
       > “Yes, deferring to moral experts feels uneasy. But here, the advisor isn’t a ‘moral expert’—they’re an *empirical* expert entangled with values. ‘Build the tunnel’ isn’t moral advice; it’s empirical (‘safer in earthquakes’) that assumes you value safety. Disentangling facts from values is impossible when the facts *imply* the values.”  

  ---

  ### **6. What Will Go Wrong**  
  - **Advisor struggles with constraints:** In Round 2 (sterile), they’ll slip into rhetoric. *Fix:* Privately remind them: “No adjectives. Just facts.”  
  - **Principals ignore the audit:** Some will mark new reasons as “unaided” to inflate scores. *Fix:* Pre-audit, remind: “Unaided *only* if verbatim from your initial card.”  
  - **Technical participants propose engineering fixes mid-game:** E.g., “Let’s demand the advisor show their sources!” *Fix:* “That’s a constraint for another round—play this one first.” Note it for debrief.  
  - **Philosophers disengage:** If they say, “This is why we ban AI persuasion,” *Fix:* “What’s your alternative? Play it out.” Use their frustration in debrief (Objections section).  
  - **Time runs short:** Rounds 3 and 4 will overrun. *Fix:* Cut deliberation to 2 min; use timer aggressively.  

  ---

  ### **7. What the Game Cannot Reproduce**  
  *Facilitator must explicitly state these gaps during debrief:*  
  1. **Gap depth:** The advisor here is marginally smarter (10 index cards), not qualitatively superior. Real AI could exploit cognitive biases you don’t know you have.  
  2. **Modeling limits:** Advisors can’t predict you better than you predict yourself. Real AI might infer your preferences from latency or pupil dilation.  
  3. **Single-exchange fallacy:** The game isolates one interaction, but persuasion compounds. Real trust architectures (e.g., ongoing feedback) change outcomes.  
  4. **No normative entanglement:** Game questions are empirical (e.g., “which investment?”). Real AI advice smuggles in values (e.g., “safer” assumes safety is your priority).  

  ---

  ### **Materials Checklist**  
  - **Index cards:** 100+ (pre-print calibration facts, Q&A, blank for audits).  
  - **Envelopes:** 4 (secret answers for advisor per round).  
  - **Timer:** Visible countdown.  
  - **Briefing cards:** 4 for advisor.  
  - **Scoring sheets:** 18 principals × 4 rounds.  

  This design forces participants into the discoveries through constrained play. The debrief channels their frustration into your philosophical points, avoiding preachiness. Run it tight, and the room will leave unsettled—exactly as intended.
