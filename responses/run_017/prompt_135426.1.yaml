  *   **Groan Factor:** "Replicated! Multiplied!" directly mirrors fanatical EV calculations. "Cosmically crucial" is the fanatic's catchphrase. The sudden, horrified realization is the punchline.
  *   **Accessibility:** No jargon needed. Setup is clear ("saving the future", "sim argument"). The comedian's physicality sells the absurdity.
