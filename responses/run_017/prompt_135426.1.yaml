  Here's the standup beat, hitting your points with dark humor:

  "So I quit saving the future. Why? The sim argument! *Holds up hands like scales* All those trillion-trillion future minds? Might just be some bored post-grad's afternoon project. They get hungry, hit Ctrl+Q... *mimics flicking a switch, shrugs* Poof. Our grand sacrifice? Optimizing dust for ghosts. Whoops.

  *Leans in conspiratorially*
  But here’s the kicker... if we *are* sims? They’re probably running tons of copies. Parallel worlds, baby! Every coffee I buy, every dumb joke I tell... *starts counting frantically on fingers*... gets replicated! Multiplied! Across a bazillion instances! And hey, maybe the simulators *themselves* count! *Eyes widen in dawning horror* So... uh... *voice drops to a manic whisper* ...my trivial choices now might be *even more cosmically crucial*?!
