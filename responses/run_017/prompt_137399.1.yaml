answer: |-
  Here is a decision tree structured around diagnostic questions derived from your cases. Each node is answerable with basic logic/probability knowledge, without naming theories. The tree has **8 questions** leading to **15 leaves**, covering your required families. Unoccupied combinations are diagnosed. Stipulation: 'Same conditional' means identical antecedent and consequent clauses across contexts.

  ### Decision Tree
  1. **Settling Case**: When the antecedent is settled false (e.g., Monday’s indicative ‘if malignant, operate’ after benign result), does the utterance retain *non-trivial* truth conditions?  
     - **Yes** → Go to Q2  
     - **No** (truth conditions voided or trivialised) → Go to Q3  

  2. **Friday’s Truth Conditions**: Are the surviving truth conditions of Monday’s indicative those of the *subjunctive* (e.g., Friday’s ‘if it had been malignant, we would have operated’)?  
     - **Yes** → Go to Q4  
     - **No** (distinct from subjunctive) → Go to Q5  

  3. **Detective Case**: When the antecedent is ruled out (e.g., ‘if the butler was there, someone let him in’), is the utterance truth-evaluable *without* revising background assumptions?  
     - **Yes** → Go to Q6  
     - **No** (requires repair or is unevaluable) → Go to Q7  

  4. **Import-Export**: Is ‘if A, then if B, C’ *equivalent* to ‘if A and B, C’?  
     - **Yes** → **Leaf: Material Implication + Assertability** (e.g., Grice). Awkward: Handles strengthening poorly. Worst case: Strengthening/sequence.  
     - **No** → **Leaf: Unnamed (Context-Shifting Strict)**. Awkward: Must explain why subjunctives resist export. Worst case: Import/export.  

  5. **Strengthening**: Does ‘if A, C’ entail ‘if A and B, C’?  
     - **Yes** → **Leaf: Unrestricted Strict Conditional**. Awkward: Invalidates intuitive strengthening failures. Worst case: Strengthening/sequence.  
     - **No** → **Leaf: Interventionist/Structural Equations** (e.g., Pearl). Awkward: Counterpossibles often vacuously true. Worst case: Counterpossibles.  

  6. **Probability Case**: Is your credence in ‘if A, B’ *equal* to your conditional credence P(B|A)?  
     - **Yes** → **Leaf: Conditional Event (3-Valued)** (e.g., de Finetti). Awkward: ‘If A, B’ and ‘if A, not B’ can both lack truth value. Worst case: Strengthening/sequence.  
     - **No** → **Leaf: Expressivist/No Truth Conditions** (e.g., Adams). Awkward: Cannot embed in Boolean compounds. Worst case: Indefinite antecedents.  

  7. **Indefinite Antecedents**: Is ‘if an A is B, it is C’ *equivalent* to ‘some A is B and C’?  
     - **Yes** → **Leaf: Unnamed (Existential Scoping)**. Awkward: Fails universal reading. Worst case: Indefinite antecedents.  
     - **No** → Go to Q8  

  8. **Counterpossibles**: Can ‘if 17 were divisible by 4, checksum fail’ be *non-vacuously* true?  
     - **Yes** → **Leaf: Non-Vacuous Counterpossible** (e.g., Berto). Awkward: Overgenerates truth for absurd antecedents. Worst case: Chance under known chances.  
     - **No** → **Leaf: Restrictor View** (e.g., Kratzer). Awkward: Mood reduces to modal base; indicative/subjunctive difference pragmatic. Worst case: Settling case.  

  ### Additional Leaves (from Q3/Q7 paths)
  - From **Q3: Yes** → **Leaf: Selection Over All Possibilities** (e.g., Stalnaker). Awkward: Antecedents ruled out require ‘closest’ worlds. Worst case: Backtracking.  
  - From **Q3: No** → **Leaf: Context Set Selection + Fallback** (e.g., von Fintel). Awkward: Complex repair for excluded antecedents. Worst case: Detective case.  
  - From **Q7: No** → **Leaf: Quantification Over Cases** (e.g., Lewis). Awkward: Requires similarity metric for non-counterfactuals. Worst case: Backtracking.  
  - **Leaf: Unnamed (Restricted Selection Without Fallback)**. Awkward: Utterances with excluded antecedents are gibberish. Worst case: Detective case.  
  - **Leaf: Ramsey Test + Belief Revision**. Awkward: Truth conditions replaced by acceptance conditions. Worst case: Indefinite antecedents.  

  ### Unseparated Leaves & Unoccupied Combinations
  - **Unseparated**: ‘Expressivist/No Truth Conditions’ and ‘Ramsey Test’ both answer Q6 ‘No’ and Q7 ‘No’. **Separator**: Whether conditionals express *planning* (Expressivist) or *belief-update dispositions* (Ramsey).  
  - **Unoccupied Combinations**:  
    - Q1(Yes) + Q2(No) + Q4(Yes): **Incoherent** (Material implication implies export, but Q2(No) rejects equivalence to subjunctive).  
    - Q1(No) + Q3(Yes) + Q6(No): **Unexplored** (Selection over possibilities but no P=conditional credence; no extant theory).  
    - Q1(No) + Q3(No) + Q7(Yes): **Merely Unattractive** (Repair needed for indefinites, yet existential scoping forces universal reading).  

  ### Justifications
  - **Q1 first**: Directly addresses your spine (indicative vs. subjunctive content persistence). Settling case forces a stance on truth-condition robustness.  
  - **Q2 early**: Disambiguates whether indicatives ‘become’ subjunctives (Q2 Yes) or diverge (Q2 No), pivotal for content/pragmatics split.  
  - **Q3 after Q1(No)**: Detective case isolates context-set restriction (Q3 Yes) vs. repair/inevaluability (Q3 No). Treated semantically: truth-evaluability is semantic.  
  - **Q4 after Q2(Yes)**: Import/export tests logical structure; if indicatives ‘are’ subjunctives (per Q2), their equivalence matters.  
  - **Q5 after Q2(No)**: Strengthening reveals monotonicity failures, splitting strict conditionals (Q5 Yes) from non-monotonic views (Q5 No).  
  - **Q6 after Q3(Yes)**: Probability case distinguishes probabilistic semantics (Q6 Yes) from non-probabilistic (Q6 No). Pragmatic readings excluded: credence is semantic commitment.  
  - **Q7 after Q3(No)/Q6(No)**: Indefinite antecedents quantify semantically (Q7 No) or scoped existentially (Q7 Yes).  
  - **Q8 last**: Counterpossibles test vacuity after other constraints filter views.  

  **My position**: **Interventionist/Structural Equations** (handles backtracking/strengthening; counterpossibles are a cost).
