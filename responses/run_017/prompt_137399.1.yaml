  For unoccupied combinations, I'll identify whether they're incoherent (logically impossible), merely unattractive (theoretically unstable), or unexplored (possible but no extant theory). The import/export case might be ambiguous - I'll treat it semantically since pragmatic accounts struggle to explain the truth-value difference.

  Notable challenges:
