prompt: |-
  I'm applying for a small internal grant — three months, part time, just me, no data collection — and I want the proposal to be about the question the old Letter Spirit project kept circling but never settled: what makes a given squiggle an 'a'. The project I mean is the one that tried to get a program to design a whole alphabet in one coherent style, and the bit that always struck me as where it bogged down is that nobody could say what the program was supposed to be preserving when it produced twenty-six different shapes that all feel like the same font.

  My half formed idea is that people keep looking for the a-ness in the shape itself — a shared set of strokes, a prototype, a family resemblance — and that might be the wrong place to look. Compare an 'a' in a blackletter face with an 'a' in a geometric sans: at the level of local features they have almost nothing in common, but they both sit in the same spot in a network of relations to the other letters of their own alphabet. So maybe being an 'a' is mostly a matter of not being that font's 'o', 'u', 'd' or 'g' — the essence is differential, not intrinsic. If that's right, then any approach that generates or recognizes letterforms one glyph at a time is hunting for something that isn't there.

  I need help turning that into a real proposal rather than a gesture. Can you write me the one-pager? I want: the question stated sharply enough that the differential story and the feature/prototype story actually make competing predictions; what I'd do in the three months to decide between them — my only concrete idea is a sort of swap test, take a real font and swap two glyphs so the shape we read as 'a' has to do duty for 'e' and vice versa, then ask a fluent reader what goes wrong, and whether it goes wrong because the shape now clashes with the other letters or because it isn't enough like them; maybe also the harder case of invented scripts for constructed languages, the kind nobody is really fluent in, where there's no reading fluency to lean on; what a positive result would show and, just as important, what would count as the project failing; and an honest line about whether this is too big for three months part time.

  Refer to positions by description rather than by author, I'll put the citaitons in myself. And keep it about letterforms specifically — I don't want half the page turning into general philosophy of concepts, orinto machine learning.
reasoning: |-
  We are focusing on letterforms and the specific question of what makes a given shape an 'a' in a given typeface. The core idea is that the identity of a letter (like 'a') is defined by its relations to other letters in the same typeface (differential theory) rather than by intrinsic features (feature/prototype theory). 

  The proposal must include:
  1. A sharp statement of the question and the competing predictions.
  2. What to do in three months part-time: a swap test and possibly an invented script test.
  3. What a positive result would show and what would count as failure.
  4. An honest assessment of feasibility.

  Let's structure the one-pager:

  **Title:** The Differential Basis of Letter Identity: Testing the Role of Contrast in Typographic Perception

  **Introduction/Question:**
  What defines the identity of a letter (e.g., 'a') within a typeface? Two competing theories exist. The feature/prototype theory posits that each letter has intrinsic visual features (e.g., a bowl and a stem for 'a') that are shared across typefaces. The differential theory argues that a letter's identity is primarily determined by its contrastive relations to other letters in the same typeface — an 'a' is what it is because it is not the 'o', not the 'u', etc.

  **Competing Predictions:**
  - Feature/prototype theory predicts that a letter's identity is portable: an 'a' from one typeface should still be recognizable as an 'a' even when placed in a different typeface, provided its intrinsic features are preserved.
  - Differential theory predicts that a letter's identity depends on its context within a specific set of relations. If you take a letter from one typeface and place it in a different typeface (or disrupt the relations within its own typeface), its identity may become unstable because the system of contrasts is broken.

  **Methodology (3 months part-time):**
  1. **Swap Test:** Select 3-5 well-known typefaces representing diverse styles (e.g., blackletter, geometric sans, serif). In each typeface, swap two glyphs that are visually distinct in that style but might share some features (e.g., 'a' and 'e'). Create two conditions: 
     - Condition 1: The original typeface.
     - Condition 2: The same typeface with the swapped glyphs (e.g., the shape that was 'a' now appears in place of 'e', and vice versa).
     Present participants (fluent readers) with words using the swapped glyphs and ask:
     - What, if anything, looks wrong?
     - Does the word become harder to read? (Measure reading speed and error rate.)
     - Is the perceived problem due to the swapped glyph clashing with the other letters (differential) or because the swapped glyph lacks the expected intrinsic features (feature-based)?

  2. **Invented Script Test (if time permits):** Create a set of invented glyphs for a constructed alphabet. Assign arbitrary identities (e.g., glyph1='a', glyph2='b', etc.). Train one group of participants on the original mapping and another on a swapped mapping (e.g., glyph1 now called 'b', glyph2 now called 'a'). Test recognition accuracy and fluency. The differential theory predicts that the original mapping (which established a system of contrasts) will be easier to learn than an arbitrary one, even if the intrinsic features of the glyphs are unchanged.

  **Expected Outcomes and Interpretation:**
  - **Positive for differential theory:** If in the swap test, participants report that the swapped glyphs disrupt the visual harmony of the typeface and cause specific confusions (e.g., the 'a' shape in the 'e' position is mistaken for 'a' or clashes with adjacent letters) and if reading is impaired primarily because of relational mismatches, then the differential view is supported. In the invented script, if the original mapping (with established contrasts) is learned faster and more accurately, that further supports the differential view.
  - **Positive for feature/prototype theory:** If participants can still correctly identify the swapped glyphs by their intrinsic features (e.g., they call the 'a' shape in the 'e' position an 'a') and if the main impairment is due to the swapped glyph lacking the expected features for its new position (e.g., the 'a' shape doesn't look like an 'e'), then the feature-based view is supported.
  - **Project failure:** The project fails if the tests are inconclusive (e.g., no clear pattern in responses) or if the results are confounded by other factors (e.g., participants ignore the swap because of top-down word recognition). Also, if the invented script test cannot be conducted within the time, it may limit the scope.

  **Feasibility:** 
  Three months part-time is tight but feasible for the swap test. The swap test is the core and can be done with a modest number of participants (15-20) and typefaces (3-5). The invented script test is more ambitious and would be included only if time allows. The main risk is participant recruitment and data analysis, but since no new data collection (beyond the swap test) is required, it is manageable. The project might not definitively settle the theoretical debate but will provide clear empirical evidence to advance the discussion.

  **Conclusion:**
  This project challenges the assumption that letter identity resides in intrinsic features and offers a novel test of the differential theory. By focusing on typographic perception, it addresses a fundamental gap in understanding how we read and how typefaces cohere.

  Now, I'll write the one-pager accordingly.
answer: |-
  **Project Proposal: The Differential Basis of Letter Identity in Typography**  

  **Core Question:** What defines the identity of a letter (e.g., ‘a’) within a typeface? Specifically, does this identity rely on *intrinsic visual features* (e.g., strokes, proportions, or a prototypical shape) or on *differential relations* to other letters in the same alphabet (i.e., its role in a system of contrasts)?  

  **Competing Theoretical Predictions:**  
  - **Feature/Prototype Theory:** Letter identity is anchored in inherent visual properties. If true, a glyph’s recognizability as ‘a’ should persist even when removed from its native alphabet, provided its intrinsic features (e.g., a counter and stem) are preserved.  
  - **Differential Theory:** Letter identity emerges from systemic contrasts within a typeface (e.g., an ‘a’ is defined by how it differs from ‘o’, ‘d’, or ‘g’ in *that specific font*). If true, disrupting these contrasts—while keeping intrinsic features intact—should destabilize recognition.  

  **Methodology (3 Months, Part-Time):**  
  1. **Swap Test (Weeks 1–6):**  
     - **Stimuli:** Select 3–5 diverse typefaces (e.g., Blackletter, Geometric Sans, Serif) where critical letters (e.g., ‘a’, ‘e’) share minimal intrinsic features. Create two conditions:  
       - *Original:* Words set in the untouched typeface (e.g., “read”).  
       - *Swapped:* Glyphs for ‘a’ and ‘e’ are exchanged (e.g., the ‘a’ shape appears in ‘e’ positions, and vice versa).  
     - **Participants:** Recruit 15–20 fluent readers. Present words in both conditions, masked to avoid word-length cues.  
     - **Tasks:**  
       - *Subjective feedback:* “What looks wrong?” (Coding responses for “shape mismatch” vs. “system clash”.)  
       - *Objective measures:* Speed/accuracy in letter identification and word reading.  
     - **Predicted Outcomes:**  
       - Differential theory: Errors arise from disrupted contrasts (e.g., “The ‘a’ shape now looks too similar to ‘c’”).  
       - Feature theory: Errors stem from glyphs lacking expected features (e.g., “This doesn’t look like an ‘e’”).  

  2. **Invented Script Pilot (Weeks 7–12, if feasible):**  
     - **Stimuli:** Generate a novel 10-glyph alphabet with arbitrary but visually distinct symbols. Assign identities (e.g., Glyph 1 = ‘a’, Glyph 2 = ‘b’).  
     - **Participants:** Two groups (20 each) learn either the original mapping or a swapped version (e.g., Glyph 1 relabeled as ‘b’).  
     - **Task:** Test speed/accuracy in identifying single glyphs after brief training.  
     - **Rationale:** If differential relations dominate, the original system (with pre-established contrasts) will show superior learnability, even with identical intrinsic features.  

  **Outcomes and Failure Conditions:**  
  - **Positive Result for Differential Theory:** Swapped glyphs in established typefaces cause confusion due to *relational clashes* (e.g., “The ‘a’ shape now conflicts with ‘d’”) rather than feature absence. Invented scripts confirm that contrastive systems are learned faster.  
  - **Positive Result for Feature Theory:** Swaps impair recognition primarily due to *missing features* (e.g., “This shape lacks ‘e’-like curves”), with invented scripts showing no advantage for pre-contrasted systems.  
  - **Project Failure:** Inconclusive data (e.g., high variability in responses), confounds (e.g., participants ignore swaps due to top-down word recognition), or inability to isolate relational effects from feature-based ones.  

  **Feasibility Assessment:**  
  The swap test is achievable within 3 months part-time (requiring only design software, online participant recruitment, and basic quantitative analysis). The invented script pilot is higher-risk; if time runs short, it will be framed as exploratory. Core deliverables—experimental design, data from the swap test, and preliminary analysis—are realistic. The project will not resolve all theoretical debates but will provide empirical evidence to advance this specific typographic puzzle.  

  **Broader Impact:**  
  This work challenges design and recognition models that treat letters in isolation, potentially revealing how systemic contrast underpins typographic harmony. It deliberately avoids machine learning or philosophical generalization, focusing solely on letterforms.
