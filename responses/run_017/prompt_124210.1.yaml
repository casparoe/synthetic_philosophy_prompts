  ### Internal White Paper: Delivery Plan for Prioritarian Alignment in Distributional Interventions  
  **Ministry of Equitable Outcomes (MEO)**  
  **Reference: MEO/PRIOR/2024/007**  
  **Date: 24 October 2024**  
  **Classification: OFFICIAL-SENSITIVE**  

  #### 1. Introduction  
  1.1. The Ministry of Equitable Outcomes (MEO) formally adopted prioritarianism as its primary distributional objective in FY2023/24 (see Policy Framework MEO/PF/09). This requires that welfare benefits be assigned greater moral weight when received by individuals at lower absolute welfare levels, aggregated via a concave transformation function \( f(w) \) applied to individual welfare \( w_i \), such that total value \( V = \sum f(w_i) \).  
  1.2. This paper addresses whether MEO may fund interventions that reduce inequality by diminishing the welfare of better-off individuals ("Tier 3+") without improving the welfare of worse-off individuals ("Tiers 1–2"), hereafter termed "Pure Welfare Redistribution" (PWR).  
  1.3. Initial analysis (Annex A) indicates standard prioritarianism precludes PWR, as \( V \) decreases when any \( w_i \) falls without offsetting gains. MEO therefore proposes calibrated methodological refinements to ensure alignment with strategic equity targets.  

  #### 2. Challenges in Standard Prioritarian Evaluation  
  2.1. Under the baseline model (\( f(w) = \sqrt{w} \)), PWR scenarios yield net loss in \( V \). For example:  
  - Pre-intervention: Individual A (\( w_i = 100 \)), Individual B (\( w_i = 4 \)).  
  - \( V_{\text{pre}} = \sqrt{100} + \sqrt{4} = 12 \).  
  - Post-intervention (A reduced to \( w_i = 81 \), B unchanged): \( V_{\text{post}} = \sqrt{81} + \sqrt{4} = 11 \).  
  2.2. This conflicts with MEO’s strategic priority to reduce Gini coefficients by 15% before FY2030 (Objective 3.1, MEO Strategic Plan).  

  #### 3. Methodological Refinements for PWR Permissibility  
  3.1. **Welfare Scale Re-calibration**  
  3.1.1. The standard model assumes cardinal welfare is measurable on a ratio scale. MEO proposes recalibrating welfare as relative to a dynamic societal median (\( w_m \)):  
  \[  
  w_i' = \frac{w_i}{w_m}  
  \]  
  3.1.2. Post-recalibration, PWR reduces \( w_m \), increasing \( w_i' \) for Tier 1–2 individuals without altering their material state. Subsequent application of \( f(w_i') \) elevates \( V \).  
  3.1.3. *Example*: Post-PWR, \( w_m \) falls from 50 to 45. A Tier 1 individual (\( w_i = 20 \)) sees \( w_i' \) rise from 0.4 to 0.44, increasing \( f(w_i') \) despite unchanged consumption.  

  3.2. **Comparative Weighting Module (CWM)**  
  3.2.1. Standard prioritarianism ignores relative deprivation. CWM introduces a supplementary weight \( g(\Delta_i) \) based on an individual’s welfare deficit relative to the median:  
  \[  
  V_{\text{CWM}} = \sum \left[ f(w_i) \times g(\Delta_i) \right], \quad \text{where} \quad \Delta_i = \max(w_m - w_i, 0)  
  \]  
  3.2.2. \( g(\Delta_i) \) is convex (e.g., \( g(\Delta_i) = 1 + \Delta_i^{0.5} \)). PWR shrinks \( w_m \), increasing \( \Delta_i \) for Tier 1–2 and amplifying their weight in \( V \).  
  3.2.3. *Note*: Material welfare \( w_i \) is unchanged, but enhanced weighting elevates \( V_{\text{CWM}} \).  

  3.3. **Variable-Population Adjustment (VPA)**  
  3.3.1. PWR may increase long-term population size among Tier 1–2 by reducing perceived barriers to family formation (e.g., "aspirational despair" mitigation).  
  3.3.2. Under variable-population prioritarianism (e.g., Critical-Level model), aggregate \( V \) accounts for potential persons. A marginal increase in Tier 1–2 births post-PWR offsets near-term losses in \( V \).  

  #### 4. Implementation Framework  
  4.1. **Phased Approach**:  
  - Phase 1 (Q1–Q2 2025): Pilot CWM in cost-benefit analyses for 3 PWR interventions (Annex B).  
  - Phase 2 (Q3 2025): Integrate VPA with ONS demographic projections.  
  - Phase 3 (Q4 2025): Full welfare scale recalibration.  
  4.2. **Governance**: Prioritarian Compliance Unit (PCU) established to audit \( V \)-calculations.  

  #### 5. Conclusion  
  5.1. Refinements in §§3.1–3.3 resolve conflicts between PWR and prioritarianism, enabling MEO to advance equity objectives within the mandated framework.  
  5.2. PCU will monitor for unintended value reductions during rollout.  

  ---  
  **Annex A: Standard Prioritarian Evaluation of PWR**  
  | Scenario          | Individual A (\( w_i \)) | Individual B (\( w_i \)) | Total \( V = \sum \sqrt{w_i} \) |  
  |-------------------|--------------------------|--------------------------|---------------------------------|  
  | Pre-PWR           | 100                      | 4                        | 12.0                            |  
  | Post-PWR          | 81                       | 4                        | 11.0                            |  
  | **ΔV**            | **–1.0**                 |                          |                                 |  

  **Annex B: Approved PWR Interventions**  
  | Intervention             | Target Cohort     | Mechanism                          | Expected \( \Delta V_{\text{CWM}} \) |  
  |--------------------------|-------------------|------------------------------------|--------------------------------------|  
  | Social Stigma Levies     | Top 5% (by wealth)| Public disclosure of luxury consumption | +0.8 (via \( \uparrow \Delta_i \))   |  
  | Non-Redistributive Taxes | Top 10% (income) | Revenue destroyed post-collection  | +1.2 (via \( \downarrow w_m \))      |  
  | Cultural Cap Campaigns   | Top 15% (consumption)| Norm enforcement re: "ostentatious" goods | +0.5 (via \( \uparrow g(\Delta_i) \)) |  

  ---  
  ### Analytical Note: Prioritarian Coherence Assessment  
  The white paper’s argument leans on three contested extensions of prioritarianism:  
  1. **Welfare Scale Re-calibration**: Assumes welfare is meaningfully relative. Most prioritarians (e.g., Parfit, Adler) treat welfare as cardinal and absolute. *Confidence: Low*. Prioritarians would reject this as conflating welfare with relative standing.  
  2. **Comparative Weighting Module (CWM)**: Introduces relative deprivation via weighting. While some (e.g., Weirich) endorse hybrid models, pure prioritarians view this as smuggling in egalitarianism. *Confidence: Moderate*. A prioritarian might accept this if framed as correcting "welfare underestimation."  
  3. **Variable-Population Adjustment (VPA)**: Links levelling down to fertility changes. This is empirically speculative but theoretically permissible under critical-level prioritarianism. *Confidence: High* for theoretical coherence; *Low* for empirical plausibility.  

  **Least Confident Claim**: The VPA’s reliance on PWR-induced population growth (§3.3). No robust evidence supports that levelling down increases Tier 1–2 fertility; it may even reduce it via economic contraction. This risks *ex post* rationalization of predetermined policies.  

  **Overall Balance**: The document’s core contention—that prioritarianism can permit PWR via technical adjustments—would be rejected by 80% of prioritarians. However, the CWM argument (§3.2) has a non-trivial chance of acceptance if positioned as a "welfare sensitivity" fix. The reductio remains implicit in the escalating complexity of §§3.1–3.3, mirroring real-world policy contortions.
