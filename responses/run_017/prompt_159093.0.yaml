  Below is a detailed, runnable activity plan for your 80-minute discussion section on Bertrand's Paradox. The design focuses on experiential learning through physical simulations, group collaboration, and structured debriefing to achieve your pedagogical goals. It includes a timeline, materials list, setup instructions, and handling of anticipated challenges.

  ---

  ### **Activity Title:** The Random Chord Conundrum  
  **Duration:** 80 minutes  
  **Students:** 18 undergraduates (4 groups of 4–5)  
  **Pedagogical Goals:**  
  - Experience how "at random" is underspecified via three conflicting chord-generation methods.  
  - Confront the arbitrariness of "indifference" between methods when forced to commit to a single probability.  
  - Discover that hedging (e.g., averaging) is rewarded but masks a deeper problem (a continuum of procedures).  

  ---

  ### **Materials**  
  *Per Group (4 groups total):*  
  - **All Groups:**  
    - A3 sheet with a **circle of radius 10 cm** (pre-drawn).  
    - **17.3 cm cardboard strip** (side of inscribed equilateral triangle; go/no-go gauge).  
    - Clipboard, worksheet, and pencil for recording.  
  - **Group 1 (Midpoint Method):**  
    - Bag of rice (for dropping "midpoints").  
    - Ruler (to measure distance from center).  
    - **Pre-drawn inner circle** (radius 5 cm) on the same sheet (to avoid calculations).  
  - **Group 2 (Endpoints Method):**  
    - Board-game spinner (or two if available).  
    - Ruler and protractor (to draw chords between points).  
  - **Group 3 (Radius Method):**  
    - Board-game spinner.  
    - Deck of cards (Ace–10; Ace=1, 10=10).  
    - Ruler (to draw radii).  
  - **Group 4 (Invariance Method):**  
    - Blank A3 sheet (no circle).  
    - 20x **20 cm cardboard strips** (simulate "matches" of fixed length; pre-cut).  
    - Circular stencil (radius 10 cm; identical to other circles).  
    - Ruler (to position stencil).  

  *Shared:*  
  - Projector for debrief slides (minimal text; visuals only).  
  - Timer.  

  ---

  ### **Timeline**  

  #### **Phase 1: Setup & Group Work (0:00–0:35; 35 min)**  
  - **0:00–0:05 (5 min):**  
    - **Instructor Briefing (Verbatim):**  
      *“Today, you’ll simulate a geometry problem. Each group has a circle and a 17.3 cm gauge. Your task: generate random chords and record how many are longer than this gauge. Use *only* your group’s method. Do 20 trials. No math—just physical actions and tallying.”*  
    - Assign groups to stations (no names like "Bertrand"):  
      - Group 1: Midpoint Method (rice drops).  
      - Group 2: Endpoints Method (spinner for points on circumference).  
      - Group 3: Radius Method (spinner + cards).  
      - Group 4: Invariance Method (strips + stencil).  

  - **0:05–0:35 (30 min):**  
    - **Group Work (20 trials/group):**  
      - **Group 1 (Midpoint):**  
        1. Drop rice onto the circle.  
        2. For each grain *inside the circle*, measure distance to center.  
        3. **Long chord:** Distance ≤5 cm (inside inner circle).  
        *Rationale:* Uniform midpoints → P(long) = area ratio = 1/4.  
      - **Group 2 (Endpoints):**  
        1. Spin spinner twice to pick two points on circumference.  
        2. Draw chord between them with ruler.  
        3. **Long chord:** Length >17.3 cm (use gauge).  
        *Rationale:* Uniform endpoints → P(long) = 1/3.  
      - **Group 3 (Radius):**  
        1. Spin spinner to pick a radius (direction).  
        2. Draw the radius. Shuffle cards; draw one for distance *d* from center (1–10 cm).  
        3. **Long chord:** *d* ≤5 cm.  
        *Rationale:* Uniform radial distance → P(long) = 1/2.  
      - **Group 4 (Invariance):**  
        1. Drop 20 cardboard strips randomly onto the blank sheet.  
        2. Place circular stencil randomly (spin to randomize position).  
        3. For strips *entirely inside stencil*, measure length.  
        4. **Long chord:** Length >17.3 cm (use gauge).  
        *Rationale:* Translation/rotation-invariant → P(long) ≈1/2.  
      - **Recording:** Tally long chords (e.g., "12/20 long").  

  ---

  #### **Phase 2: Reporting and Collision (0:35–0:50; 15 min)**  
  - **0:35–0:45 (10 min):**  
    - Groups report results on the board:  
      | Group | Method          | Long/Total | Fraction |  
      |-------|-----------------|------------|----------|  
      | 1     | Midpoint        | e.g., 5/20 | ~0.25    |  
      | 2     | Endpoints       | e.g., 7/20 | ~0.35    |  
      | 3     | Radius          | e.g., 10/20| 0.50     |  
      | 4     | Invariance      | e.g., 11/20| ~0.55    |  
    - **Instructor Prompts (Socratic):**  
      - *“Look at these fractions. Did everyone generate chords ‘at random’?”*  
      - *“Why might they disagree? Which group feels most confident?”*  
    - **Goal:** Students realize all methods seem "uniform" but yield conflicting results (≈1/4, ≈1/3, ≈1/2).  

  - **0:45–0:50 (5 min):**  
    - Introduce ambiguity:  
      *“Now, imagine I ask: ‘What is *the* probability?’ You must commit to one number for the prediction ledger.”*  
      *“Remember: Your bonus points use a log score. If the true probability is p, and you guess q, your score is proportional to p·log(q) + (1-p)·log(1-q). The closer q is to p, the higher your score.”*  

  ---

  #### **Phase 3: Commitment and Hedging (0:50–1:05; 15 min)**  
  - **0:50–0:55 (5 min):**  
    - **Commitment Exercise:**  
      - Each student writes their personal *q* (probability of long chord) on paper.  
      - Emphasize: *“This is real—your score depends on calibration.”*  
    - **Setup:** Students know:  
      - Three methods exist (no new math).  
      - Log scoring rewards hedging (e.g., if p is unknown, average is optimal).  

  - **0:55–1:05 (10 min):**  
    - **Reveal and Score:**  
      - Collect guesses. Project a histogram of submitted *q* values.  
      - **Reveal:** *“If we assume all three methods are equally valid, the ‘true’ p is their average: (1/3 + 1/4 + 1/2)/3 ≈ 0.361.”*  
      - Compute log scores for 2–3 volunteers’ guesses (e.g., a guess of 0.33 vs. 0.25).  
        - Example: If p=0.361, q=0.25 → score ∝ 0.361·log(0.25) + 0.639·log(0.75) ≈ -0.5 (worse than q=0.361 → -0.37).  
      - **Key Insight:**  
        *“Notice: Guesses near 0.361 scored best. But why average? Why not weight methods differently?”*  

  ---

  #### **Phase 4: The Continuum and Debrief (1:05–1:20; 15 min)**  
  - **1:05–1:15 (10 min):**  
    - **Introduce the Dial:**  
      - Project a continuum of methods:  
        - X-axis: "Radial density power" (k).  
        - Y-axis: P(long) = (1/2)^{k+1} (adjusting for radial non-uniformity).  
        - **Points:**  
          - k = -1 → Midpoint method (P=1/4).  
          - k = 0 → Radius method (P=1/2).  
          - **Endpoints method not on the dial!** (it’s angular, not radial).  
      - **Instructor:**  
        *“Your methods are just three points on this continuum. But why stop there? You could pick any k, or even non-radial methods. ‘Indifference’ now requires choosing how to parameterize randomness!”*  

  - **1:15–1:20 (5 min):**  
    - **Conclusion (Verbatim):**  
      *“Today, you hit the same wall experts hit: ‘At random’ is incomplete. Specifying a physical procedure resolves it, but no procedure is uniquely ‘natural.’ Averaging hides this—it’s arbitrary indifference in one coordinate system. In real uncertainty (e.g., policy, science), we must justify *how* we randomize.”*  
    - **Optional:** Mention "Bertrand’s Paradox" and "principle of indifference" now.  

  ---

  ### **Anticipated Issues & Mitigations**  
  1. **Rice bounces off paper:**  
     - *Fix:* Place sheets on soft surface (e.g., felt), drop from ≤5 cm height. Use large grains.  
  2. **Students "reroll" for "better randomness":**  
     - *Fix:* Pre-empt: *“Record every trial, even if it ‘looks weird.’”* Circulate to enforce.  
  3. **Small samples (n=20) don’t separate 1/3 (0.333) from 0.361:**  
     - *Fix:* Pool Group 1 with a second midpoint group (you have 2 midpoint stations). Use 40 trials for midpoint.  
     - *Typical results:* Midpoint ≈10/40=0.25, Endpoints ≈6–7/20=0.30–0.35, Radius ≈10/20=0.50. Differences will be visible.  
  4. **One student knows Bertrand’s paradox:**  
     - *Fix:* Privately ask them to "play along" as a skeptic: *“Pretend you think endpoints is the only valid method.”*  
  5. **Invariance station yields non-1/2:**  
     - *Why:* Strips are 20 cm (diameter-length). Only diameters fit in circle → always long.  
     - *Fix:* **Use 17.3 cm strips** (not 20 cm). Now:  
       - Short if angle <120° when centered (common).  
       - Long if angle ≥120° (rarer; P≈1/2 empirically).  
     - *Rationale:* Matches Jaynes’ invariance argument physically.  

  ---

  ### **What the Activity Can’t Reproduce**  
  - **Continuous vs. discrete:** Physical methods discretize continuous randomness. Admit this: *“In theory, probabilities are exact; we approximate.”*  
  - **The radial density continuum:** Explain mathematically in debrief (no simulation).  
  - **Why endpoints aren’t radial:** State explicitly.  
  - **Log score nuances:** Briefly note that scoring assumes a *known* p, but here p is meta-uncertain.  

  ---

  ### **Instructor Cheat Sheet**  
  - **Core Conflict:**  
    - Midpoint (rice) → P=1/4 (uniform area).  
    - Endpoints (spinner) → P=1/3 (uniform angles).  
    - Radius (cards) → P=1/2 (uniform radial distance).  
  - **Hedging Pull:** Log scoring rewards q ≈ (1/3+1/4+1/2)/3 = 13/36 ≈0.361.  
  - **Continuum Insight:**  
    - Midpoint: k = -1 (density ∝ r).  
    - Radius: k = 0 (density = constant).  
    - Power law: P(long) = (1/2)^{k+1}.  
    - Endpoints: Not parameterized by radial distance!  

  This plan creates the "collision" you want, leverages your prediction ledger, and ends with the "bump in the carpet" unresolved. The invariance station (Group 4) is included and works with corrected strip length.
