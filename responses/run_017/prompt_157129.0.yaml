prompt: |-
  hey — you're a philosopher of history who's also read a ton of actual historiography: equally at home with longue-durée, quantitative, climate-and-grain-prices stuff and with microhistory of the sort where one illiterate miller's trial record is made to carry a whole book. Please think this through carefully — do a bit of unstructured brainstorming first, sketch two or three candidate readings, then commit to one and say where it's weakest. Don't just list schools of thought; I want you to actually reconstruct an implicit theory and stress-test it.

  Here's what I keep coming back to. There's a very consistent asymmetry in how professional history actually gets done, and I want to know what it presupposes.

  When historians write about elites — a king, a first minister, a pope, a general — the defualt is intentional, narrative, source-close explanation: read the correspondence, recover the reasons, weigh the road not taken, write the biography. And historians working that way are scathing about anything aggregative: you cannot explain a cabinet decision with a regression, a structural account "leaves out the people who actually decided."

  When they write about everyone else — weavers, peasants, enlisted soldiers, enslaved people, women in a village — the defualt flips: structural and material explanation (price series, harvests, demographic cycles, "mentalities"), serial evidence out of tax rolls, court registers, parish books. And a single vivid anecdote is an anecdote: something to be a little embarrassed about, or to be framed as illustrative of a pattern that's been established quantitatively elsewhere.

  Same discipline, same journals, same departments, two quite different epistemic styles — and each style's declared vice is roughly the other style's declared method. So:

  1. What does this asymmetry presuppose? Does it only make sense under the view that agency and deliberative reason really are concentrated at the top of a society — that ordinary people's reasoning isn't the kind of thing history is *about*? Or is it fully accounted for by a boring source-survival story (elites wrote letters, poor people got counted) plus a bit of division of labour? Be careful to distinguish what the practice strictly presupposes from what it merely fits comfortably with, and tell me where it's underdetermined, i.e. where several quite different philosophies of history would license exactly the same behaviour.

  2. Where does the practice contradict itself? I'm most interested in the seams where the two styles have to touch: a grain riot (is it a price series, or a set of intentions?), a soldier's letter home, a petition, a court deposition, a slave narrative — cases where the archive hands you one ordinary person's own words. Does the discipline's handling of those cases betray a commitment it won't avow?

  3. The part I most want you to work on, and where I think you'll have to do real thinking rather than reach for a stock answer. Imagine a national research council adopts what I'll call the survivorship rule: grant panels are instructed to treat the fact that a topic is richly documented as a point against funding it, on the grounds that the archive is itself an artifact of past power, and to give priority to projects about people who left no records in their own voice. Never mind whether it's a good idea; I want the implicit theory. What view of historical significance does it presuppose — must significance be independent of source-survival, and can it be, given that we mostly know about the illiterate through literate intermediaries? What view of historical *knowledge* — is recovering "voice" a way of knowing the past, or a way of being *related* to it, and is the rule secretly a reparative-political principle wearing an epistemic costume? And what view of the historian: if it's committed to the thought that proximity to power distorts the record, why isn't the history of power the most distorted history of all?

  4. Finally, concretely: what would have to change in practice — graduate training, what counts as evidence, what a monograph looks like, what gets reviewed where — if a department genuinely ran one method for kings and weavers? Say which of the two styles would have to give up more, and say what would be lost. I'm not sure its even possible, so if you think it isn't, say what exactly blocks it.
reasoning: |-
  Okay, the user is asking about a fascinating asymmetry in historical methodology. They've noticed that historians approach elites and non-elites very differently: elites get intentional, narrative biographies based on personal documents, while common people get structural analysis using quantitative data. 

  First, I need to unpack why this asymmetry exists. The obvious starting point is source availability - kings left letters, peasants didn't. But the user wants me to go deeper than that. They're hinting this might reflect unspoken assumptions about where "real" historical agency lies. 

  The user's clearly well-versed in historiography - they reference Braudel's longue durée and Ginzburg's microhistory. This isn't a beginner asking "why do we study kings." They've spotted a methodological contradiction at the heart of professional practice and want it stress-tested. 

  Let me tackle their questions systematically. For part 1 about presuppositions: beyond just practical source issues, this asymmetry does subtly assume that meaningful historical action requires literacy and power. When we study peasants through grain prices, we're implying their choices were determined by forces beyond their control in ways that Richelieu's weren't. But is this necessary? Thompson's food rioters show collective intentionality without personal letters. 

  For part 2 about contradictions: those hybrid sources like petitions or slave narratives become fascinating test cases. When we have a weaver's deposition, do we still force it into structural frameworks? Subaltern studies would say yes - we often "ventriloquize" rather than listen. The discipline's discomfort with individual ordinary voices suggests we don't really believe they have complex interiority worth reconstructing like a king's. 

  Part 3 is the meat - that hypothetical "survivorship rule." Its unspoken philosophy seems to be: 1) historical significance should be democratic, not archival; 2) absence of records marks oppression, so studying the silenced is inherently reparative. But this gets messy fast. Can we access "authentic" subaltern voices when our sources are filtered through courts and priests? And doesn't this rule ironically erase the very power structures it wants to critique? 

  For part 4 about changing practice: forcing one method would revolutionize the field. Graduate training would need paleography for tax rolls AND literary theory to read petitions as texts. We'd lose some statistical rigor with elites - no more cliometrics for medieval kings. But we'd gain richer understandings of how structures shaped real lives. The real blockage? Professional incentives - it's harder to get tenure with 10 years of archival digging for peasant voices than with a statesman's neatly cataloged correspondence. 

  Throughout, I'm noticing the user wants me to avoid textbook answers. They're after the unstated commitments beneath our methods. That "reparative-political principle wearing an epistemic costume" line is particularly sharp - they suspect much methodology is politics in disguise. I'll need to admit that while source survival explains part of the asymmetry, our disciplinary habits do perpetuate subtle hierarchies about whose intentions "count" as history.
answer: |-
  This is a brilliantly observed paradox that cuts to the heart of historical epistemology. Let me think through this systematically, moving from diagnosis to stress-testing your hypothetical.

  **Unstructured Brainstorming:**
  - Source survival *is* foundational: Elites generate intentional documents (letters, memoirs); non-elites generate serial/trace data (baptisms, court appearances, tax payments). This creates distinct *archival affordances*.
  - But it's not *just* sources: The asymmetry reflects deeper commitments about **causality** and **historical significance**. Elites are seen as "causal nodes" whose choices ripple; masses are seen as "conditioned matter" whose actions reveal structures.
  - Professional training reinforces this: Paleography/diplomatics for elites; quantitative methods/cliometrics for non-elites. Reviewers police methodological "purity."
  - The "vice" accusation is revealing: Structuralists accuse intentionalists of "great man" naivete; intentionalists accuse structuralists of "erasing humanity." Each sees the other as missing the *essence* of their subject.
  - Hybrid cases (riots, depositions) expose the tension: Does a weaver's deposition reveal *her* reasoning or the *discursive structures* constraining her testimony? Historians often default to the latter for non-elites.

  **Candidate Readings:**
  1.  **Epistemic Hierarchy of Agency:** The practice *presupposes* that meaningful historical agency (conscious, strategic, documentable intention) resides primarily with elites. Non-elite action is "reactive" – hence explicable structurally. Source survival enables this view but doesn't *demand* it. Braudel's *longue durée* vs. microhistory debates embody this tension.
  2.  **Methodological Path Dependence:** The asymmetry is primarily driven by pragmatic source constraints and evolved disciplinary specializations ("boring source-survival + division of labour"). It doesn't *require* a philosophical commitment about agency concentration; it's just path-dependent efficiency. Annales quantifiers vs. traditional political historians exemplify this.
  3.  **Unacknowledged Ontological Commitments:** The practice implies that **historical significance** is dual-tracked: Significance for *change* resides with elite decisions (narrative/agency); significance for *being* (social reality, experience) resides with masses (structure). This smuggles in a quasi-Hegelian view where the "world-historical individual" acts, and the *Volksgeist* is analyzed.

  **Committed Reading & Weakness:**
  I commit to a **modified #3: Unacknowledged Ontological Commitments + Epistemic Path Dependence.** The asymmetry presupposes that:
  - **Elite action** constitutes *event-making causality*: Their documented intentions are the proximate causes of discrete historical outcomes (wars, laws, reforms), demanding narrative recovery.
  - **Non-elite existence** constitutes *condition-revealing substrate*: Their lives primarily illuminate the structural forces (economic, ecological, cultural) shaping societies, demanding aggregation/analysis.
  - **Source survival legitimizes this division**, but the *persistent framing* of non-elite intentionality as anecdotal/illustrative (even when sources like depositions exist) shows a deeper commitment: Non-elite reasoning is rarely deemed *causally decisive* in the same way. Ginzburg's Menocchio is celebrated as *exceptional*, proving the rule.

  **Weakness:** This reading struggles with **collective action**. Grain riots, slave revolts, or strikes involve non-elites exhibiting strategic, coordinated intentionality documented in petitions or trial records. Historians *do* analyze these intentionally (e.g., Thompson, E.P.), but often frame them as "responses to structures" or "cultural expressions," still subtly denying the *causal parity* granted to a king's council meeting. The commitment isn't absolute, but it's a powerful default.

  **Addressing Your Questions:**

  1.  **Presuppositions & Underdetermination:**
      - **Strictly Presupposes:** That *documented individual intention* is recoverable and causally relevant for elites in ways it typically isn't for non-elites, due to source types.
      - **Fits Comfortably With:** A view that elite agency is uniquely transformative, while non-elite agency is constrained/expressive. A crude "great man" theory fits, but so does a nuanced Weberian view of bureaucratic rationality concentrated in elites.
      - **Underdetermined By:** *Source realism* (we use what we have) + *pragmatic specialization* could explain the practice without any commitment to agency hierarchy. Marxist historiography (e.g., Hobsbawm) uses structure for *both* classes but still treats elite politics intentionally. The practice *is* compatible with several philosophies if they accept methodological division of labour.

  2.  **Contradictions at the Seams:**
      - **Hybrid Sources Betrayal:** When handling a soldier's letter or slave narrative, historians often:
          - **Contextualize away agency:** Frame the text as "revealing mentality" or "reflecting discourse" rather than recovering individual intention/strategy.
          - **Seek the pattern:** Use the singular voice primarily to validate a structural model ("see, this confirms hardship caused unrest").
          - **Deny representativeness:** Treat the articulate non-elite as atypical, reinforcing the notion that "true" non-elite experience is silent/structure-bound.
      - **Unavowed Commitment:** This betrays a commitment that non-elite intentionality, even when documented, is **epistemologically secondary** – it tells us about *experience* or *culture*, not *causation* in the event-making sense reserved for elites. The "reasons" of the weaver are rarely given the same explanatory weight as the "reasons" of the minister, even when both are documented.

  3.  **The "Survivorship Rule" – Implicit Theory:**
      - **View of Significance:** Significance is inherently **democratic and corrective**. The historical importance of a group/person is *inversely proportional* to their contemporary power/documented visibility. Significance lies in reconstructing the submerged reality of the majority, challenging the archive's inherent bias. It presupposes significance can (and *must*) be decoupled from traditional archival density.
      - **View of Knowledge:** Recovering "voice" (even mediated) is framed as a unique form of **relational knowledge and epistemic justice**. It's not *just* about data; it's about restoring subjectivity and presence to the silenced. However, it implicitly concedes that knowledge of the non-elite past is **fundamentally inferential and mediated** – reliant on proxies, fragments, and critical readings of hostile sources (court records, missionary accounts). The rule risks conflating *epistemic difficulty* with *moral urgency*.
      - **The Historian & Power's Distortion:** The rule assumes proximity to power distorts the record by **centering elite perspectives and erasing others**. But it implies the history *of* power itself is *also* distorted by its self-documenting nature (propaganda, selective record-keeping). The rule's logic suggests studying power requires *decentering* its own archives – perhaps using material traces or subaltern sources to critique official narratives. However, the rule focuses on *shifting the subject*, not necessarily *reinterpreting power* through its margins. **Its deepest commitment is reparative-political:** It prioritizes *who* history is *for* and *about* over traditional notions of "completeness" or ease of recovery. The epistemic claim ("better knowledge") often serves as a justification for the political aim ("more just history").

  4.  **One Method for All – Concrete Changes & Blockages:**
      - **Changes Required:**
          - **Graduate Training:** Rigorous combined training: quantitative methods *plus* advanced textual/literary criticism; paleography *plus* demographic theory; material culture analysis *plus* diplomatic. "Source criticism" must expand to encompass ledgers *and* letters, parish registers *and* treaties.
          - **Evidence/Epistemology:** All sources treated as **both traces of action *and* expressions of agency/constraint**. A tax roll isn't just data; it's an artifact of power relationships. A king's letter isn't just intention; it reveals structural constraints of statecraft. "Illustrative anecdotes" become valid entry points for thick description if rigorously contextualized.
          - **Monograph Form:** Hybrid works become standard. Imagine a book on 18th-century France: Part 1 uses network analysis of ministerial correspondence; Part 2 is a microhistory of a peasant community using the *same* interpretive depth on parish records/court depositions; Part 3 synthesizes, showing how macro-structures and micro-intentions interacted in a specific crisis (e.g., famine). Narrative and structure are interwoven chapters, not separate books.
          - **Review/Publication:** Journals/job markets must value methodological hybridity. Reviews assess how well *intentional* and *structural* explanations are integrated for *all* subjects, not which mode dominates.
      - **Who Gives Up More?** **Elite-focused history gives up more.** It must relinquish the near-exclusive claim to narrative intentionality and incorporate structural/material constraints more deeply (e.g., analyzing how grain prices shaped a king's options). Non-elite history gains legitimacy for intentional analysis but must maintain rigorous contextualization – it can't *just* tell individual stories without structural framing.
      - **What's Lost?**
          - **Depth of Specialization:** Fewer scholars mastering *all* nuances of 14th-century papal diplomacy *or* multivariate analysis of grain yields.
          - **Narrative Force (Potentially):** Pure elite narratives can be more dramatic; pure structural analyses can be more sweeping. Synthesis risks being messier.
          - **Efficiency:** Truly mastering both methodologies is incredibly time-consuming.
      - **Is It Possible? What Blocks It?**
          - **Partially possible, but extremely difficult.** Blockages include:
              - **Archival Reality:** The sheer volume *and type* of sources differ fundamentally. Reconstructing a miller's inner world from a trial record is inherently more speculative than tracing a minister's thoughts through 500 letters.
              - **Epistemic Limits:** Can we recover "intention" from aggregated data? Can we grasp "structure" solely from one diary? Each method has inherent strengths/weaknesses tied to source types.
              - **Professional Structures:** Disciplinary silos, specialized journals, tenure expectations that reward deep expertise in *one* paradigm over risky hybridization. Grant panels and publishers crave clear methodological labels.
              - **Cognitive Load:** Mastering the requisite skills and navigating the vastly different archives is a lifetime's work. True synthesis might be achieved by teams, not individuals.

  **Conclusion:** The asymmetry isn't *just* about sources; it reflects deep-seated, often unexamined assumptions about where causal power and historical significance reside. While source survival enables the division, the discipline's treatment of hybrid cases reveals an underlying hierarchy of agency. The "survivorship rule" highlights the political and reparative impulse driving critiques of this asymmetry but faces profound epistemic and practical challenges. Forcing one method is a radical, transformative project demanding fundamental shifts in training, epistemology, and professional structure. The greatest barrier might be the sheer, irreducible difference in the *texture* of the archives left by the powerful and the powerless. The ideal historian would be a methodological polymath, but the feasibility of this on an individual level remains the core tension.
