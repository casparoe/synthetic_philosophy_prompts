prompt: |-
  I do moderation (volunteer, unpaid, and yes I know how that sounds) on a long-running sandbox survival server — Minecraft-ish, except the world's been up for eleven years, the nightly snapshot only goes back thirty days so anything we miss is gone for good, and there's a house rule that a structure "belongs" to whoever built it for as long as someone in their group is still active. We're trying to write an actual policy document and I've realised I have very firm gut verdicts that don't obviously fit together. I want to know whether one principle is behind them or whether I have to give some up.

  1. Someone spends maybe 300 hours on a cathedral; another player burns it down with an in-game mechanic the rules explicitly allow. Verdict: real harm, we roll back and we ban.
  2. Same cathedral, wiped by a bad plugin update, no person did it. Verdict: nobody harmed anyone, and yet I want us to spend exactly the same effort restoring it. So the wrongness disappears but the badness doesn't?
  3. A player quits in 2014, never comes back, his enormous castle is still standing, nobody visits it. A new player knocks it flat. Verdict: feel bad about it, I'd stop them — even though the builder will never know and no current player cares. What's even being damaged there?
  4. Client-side defacement: someone runs a mod so that on their own screen the cathedral renders as rubble. Nobody else sees it, the save is untouched, they can toggle it. Verdict: not a harm at all, don't care, kind of funny. But if that's right then what I was protecting in (3) can't be "people's experience of the cathedral."
  5. Duping: someone uses a bug to copy a rare item instead of taking it. Nobody is deprived of anything, the economy shifts a bit. Verdict: genuinely wrong, but I can't say who is harmed.
  6. Someone griefs a character that turns out to be an automated one — no human behind it, indistinguishable in chat. Verdict: nothing happened. Same behaviour, no harm. Which suggests the harm is always to a person, never to the thing.
  7. Spawn-camping a real player for an hour so they effectively can't play. Verdict: real harm, and honestly worse than (1) — which is weird, because in (1) something that took 300 hours ceased to exist and here nothing in the world changed.
  8. Three players stand very close to someone's avatar in VR, silently, no chat, no touching, no damage, for twenty minutes. Verdict: definitely a harm, and it's worse in VR than the identical thing on a flatscreen, and I don't think that's just about intensity.
  9. Scamming someone out of an item that's on the official real-money marketplace (so it has an actual cash price) vs. scamming them out of an equally rare, equally hard-won item that can't legally be sold. Verdict: same harm. Which probly kills any purely economic account.

  My own attempt: "a virtual thing is real in the way that matters iff it's the kind of thing other agents can orient their behaviour and expectations around, and it was made by someone who meant it to persist." That gets (4) and maybe (6) right, but I think it makes (2) look fine and (1) look like nothing, and it says nothing about (8).

  Is there a principle that does better — ideally one that also gives verdicts on two cases we haven't had yet: a player who "claims" a naturally generated cave formation someone else then destroys, and an AI-run character that's been around for years and that current players genuinely care about, which we're about to delete in a cleanup.
reasoning: |-
  Okay, the user is a volunteer moderator on a long-running Minecraft-like sandbox survival server. They're trying to create a policy document but are struggling to reconcile their intuitive judgments on various moderation scenarios. They've presented nine specific cases where their gut reactions feel strong but inconsistent, and they're looking for an underlying principle that can unify these judgments.

  Hmm, this is actually a fascinating philosophical challenge about virtual worlds and digital ethics. The server has unique characteristics - 11 years of history, limited snapshots, and that "active group ownership" rule. The user's examples reveal tensions between several ethical dimensions: harm to persons versus harm to creations, intentionality versus consequences, and the reality of virtual objects.

  Let me analyze each case first to understand their intuitions:
  1. Intentional destruction of significant player creation (cathedral) → clear harm, rollback + ban. Shows value placed on creative labor.
  2. Accidental destruction (same cathedral) → no perpetrator, but restoration equally important. Suggests the creation itself has inherent value beyond interpersonal harm.
  3. Destruction of abandoned property → still feels wrong despite no active claimant. Points to historical preservation value.
  4. Client-side defacement → harmless because no shared reality affected. Highlights the importance of consensus reality.
  5. Duping → feels wrong despite no direct victim. Indicates systems/integrity matter.
  6. Griefing AI character → harmless without human behind it. Confirms harm requires human victim.
  7. Spawn-camping → severe harm through denied access, worse than cathedral destruction. Prioritizes player experience over objects.
  8. VR crowding → uniquely harmful due to embodiment. Suggests physical presence matters.
  9. Scamming → harm equal regardless of real-money value. Values effort over marketability.

  The user's own proposed principle focuses on persistent social objects, but it doesn't capture the experiential harms in cases 7-8. I notice three recurring threads: the reality of constructed worlds (cases 1-4), harm to persons (6-9), and systemic integrity (5). 

  For a unified framework, I'm considering an ecological approach where the server is seen as a persistent social world with three core values: 
  - Player agency (ability to meaningfully act)
  - Constructed persistence (the durability of creations)
  - Shared world integrity (consistency of rules and history)

  Testing this against all cases:
  - Case 1 violates all three (denies agency, destroys persistence, breaks integrity)
  - Case 2 damages persistence but not agency/integrity → explains restoration need
  - Case 3 is about historical persistence
  - Case 4 affects none → correct
  - Case 5 attacks integrity
  - Case 6 shows agency requires human consciousness
  - Cases 7-8 directly attack agency
  - Case 9 confirms agency harm isn't economic

  For their unaddressed cases:
  - Natural cave claim: would require active transformation (construction) to establish persistence
  - Beloved AI character: gains persistence through social meaning, thus deserves protection

  The VR distinction in case 8 is particularly insightful - it reveals that embodiment intensifies agency violations. This framework seems to preserve most of their intuitions while providing clear policy anchors. The key shift is from "harm to whom?" to "which core values are impaired?"

  I should emphasize that their intuitions aren't contradictory but reveal different dimensions of value in persistent virtual worlds. The policy document might structure rules around these three pillars with clear examples. For implementation, they'll need to define "meaningful construction" thresholds and "socially integrated" NPC criteria, but the principle should guide those decisions consistently.
answer: |-
  Your intuitions reveal a coherent ethical framework for virtual worlds—one centered on **social labor, shared reality, and agency**, rather than property or economics. The core principle is:  

  > **Harm occurs when intentional acts undermine the persistent social world that players collectively build and inhabit—specifically by violating agency, erasing socially significant labor, or fracturing shared reality.**  

  Let's break this down with your cases:  

  ### Core Principles
  1. **Agency Protection**: Players must be able to act meaningfully (e.g., avoid exploitation like spawn-camping).  
  2. **Labor Preservation**: Effort invested in *socially integrated* creations deserves persistence.  
  3. **Shared Reality Integrity**: The world must remain consistent for all participants.  
  4. **Intentionality Matters**: Harm requires intent; accidents lack culpability but still damage the world.  

  ### Your Cases Revisited
  | Case | Verdict | Principle Applied |  
  |------|---------|-------------------|  
  | **1** (Cathedral arson) | Ban + Rollback | **Intentional erasure of socially significant labor.** The cathedral was a landmark others oriented around. |  
  | **2** (Plugin wipe) | Restore | **Labor preservation.** No intent, but the *world’s integrity* is damaged—restoration maintains shared history. |  
  | **3** (Abandoned castle) | Prevent destruction | **Labor preservation + historical continuity.** Even unused, it’s part of the world’s fabric. New players inherit a lived-in world. |  
  | **4** (Client-side rubble) | No action | **No shared reality breach.** Purely subjective; doesn’t affect others’ experience or world state. |  
  | **5** (Duping) | Punish | **Shared reality integrity.** Undermines the economy’s rules—a system players rely on. Harm is to the *game’s social contract*. |  
  | **6** (Griefing AI) | No harm | **Agency violation requires a victim.** No human consciousness targeted. |  
  | **7** (Spawn-camping) | Severe punishment | **Direct agency violation.** Prevents basic participation—worse than destroying objects. |  
  | **8** (VR crowding) | Punish | **Agency + embodied harm.** VR intensifies personal space violations; it’s psychological aggression. |  
  | **9** (Scamming) | Equal punishment | **Labor violation, not economics.** The scammer steals *effort*, not monetary value. |  

  ### Unaddressed Cases  
  - **Claiming a natural cave**: No protection unless significantly modified (e.g., curated with paths/lighting). *Why?* Raw terrain isn’t "labor" until shaped with intent for social use.  
  - **Deleting a beloved AI character**: **Restore or preserve.** If players formed relationships with it, the AI became part of the social fabric—erasing it breaches shared reality.  

  ### Why This Works  
  - **Solves inconsistencies**:  
    - Case 1 vs. Case 2: Intent determines *culpability*, but labor’s social value demands restoration regardless.  
    - Case 3 vs. Case 4: The castle is *objectively real* in the shared world; client-side changes aren’t.  
    - Case 6 vs. Case 8: Harm requires a *human* whose agency/experience is disrupted.  
  - **Embodiment matters**: VR (Case 8) heightens violations because it simulates physical presence—attacking agency more intimately.  
  - **Economy vs. Labor**: Duping/scamming harm the system (Case 5) and effort (Case 9), not abstract value.  

  ### Policy Recommendations  
  1. **Define "Socially Significant Labor"**: Structures/items gain protection when they’re (a) built with persistent intent, and (b) integrated into the shared world (e.g., visited, used, or iconic).  
  2. **Tiered Responses**:  
     - **Agency violations** (spawn-camping, harassment): Immediate bans.  
     - **Labor destruction**: Rollback + bans for intent; restoration for accidents.  
     - **System abuse** (duping): Rollback + temporary bans.  
  3. **Historical Preservation**: "Abandoned" builds >1 year old become server heritage—protected unless decayed/unusable.  
  4. **AI/NPCs**: Grant protection if players meaningfully interact with them (e.g., quest-givers, community figures).  

  Your instincts align with **communal stewardship**—prioritizing the world as a collective project. The harm isn’t to objects or individuals alone, but to the *social ecosystem* they co-create. This framework preserves that while allowing nuance. Well done—your "gut" was philosophically rigorous all along.
