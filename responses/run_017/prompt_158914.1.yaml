  Satire must be fair. Where occasionalism has answers, the handbook should acknowledge them, even if awkwardly. Avoid fake quotes; paraphrase al-Ghazali instead. Use American English and keep it accessible for an 8th grader.

  Now, understanding occasionalism: Al-Ghazali argued that there's no necessary connection between cause and effect. God directly creates each event. Fire doesn't burn cotton; God creates the burning when fire touches cotton. It's habitual, not causal. 

  For the discipline section, the challenge is accountability. If actions don't cause outcomes, how can punishment be justified? The handbook would need to frame discipline as promoting habitual divine outcomes. Detentions become about maintaining patterns, not punishment. The example with a shove and broken nose: teachers must report events as concurrent, not causal.

