prompt: |-
  I've been reading a lot of amateur history arguments lately — who wrote a set of letters, why a company's records have a two-year gap in them, that sort of thing — and the same shape keeps turning up, and I don't have a word for it.

  First version: everyone agrees the candidates are A, B and C. Nobody ends up believing C, nobody thinks C is even especially plausible, but once C is put on the table the group switches from B to A. C doesn't win, it just changes who wins, the way a spoiler candidate does in an election. The reason is always that C is close to B in exactly the respect where B was beating A, so A's advantage becomes the one that decides it.

  Second version: three candidates and it honestly looks like A is better than B, B better than C, and C better than A — because each pairwise comparison gets fought on a different virtue. A fits the surviving documents better; B needs fewer assumptions; C sits better with what's known about the period. Ask people to rank all three at once and they stall, and it isn't idleness: they seem to think that a bit more simplicity against a bit worse fit just isn't something anyone can price.

  I've read a bit about underdetermination and about evidence being theory-laden, and neither is what I mean — nobody here doubts there's a fact of the matter or that the evidence is shared. The trouble is with the ranking itself. So: does this have a name? The way which explanation counts as best depends on what else is on the menu, and maybe doesn't settle down into an ordering at all?

  I keep thinking of social choice — spoiler effects, majority cycles — so if it's near that, tell me how near: is picking the best explanation really the same kind of operation as aggregating preferences, or does the analogy break, and where? I don't just want a label; I want to know exactly what the thing is, where its edges are, what it isn't, and whether it's a problem for inference to the best explanation in particular or for anything that picks a winner by balancing several virtues at once. If there genuinely isn't a name, coin one and define it carefully enough that I can tell it apart from its neighbours. Also: if the fix is to cash out best explanation as a single number like posterior probability, the menu-dependence seems to disappear — is that a solution or a change of subject? Please answer in British English.
reasoning: |-
  Okay, the user is describing this recurring pattern they've noticed in amateur historical debates. They've got two main scenarios: one where a third option acts as a spoiler, shifting support from B to A without winning itself, and another where there's a cyclic relationship between three explanations (A>B, B>C, C>A) based on different criteria. 

  Hmm, what they're really digging at is how the "best" explanation isn't stable—it changes depending on what alternatives are present. That's fascinating because it challenges the whole idea of objectively ranking hypotheses. The user mentions underdetermination and theory-laden evidence but says those don't quite fit, which tells me they've already done some reading and need something more precise.

  Right, so the core issue seems to be non-transitive preferences in evidentiary reasoning. Like in social choice theory where voting systems can produce cycles, here the evaluation criteria (fit, simplicity, coherence) don't play nicely together when you compare multiple options. The spoiler effect version is particularly clever—introducing a weak alternative that's "close" to B on a key virtue makes people reassess A vs B entirely. 

  Ah, and they're asking if Bayesian probability solves this. Well, technically yes—you'd get a stable ordering—but only by reducing everything to a single metric. That feels like cheating though, because historians might reasonably disagree on how to weight different virtues numerically. The user seems skeptical about oversimplifying ("change of subject"), which shows good instincts.

  For naming... "evidentiary non-transitivity" captures the cyclic version well, but the spoiler effect needs something sharper. Maybe "context-dependent dominance"? Though that's a mouthful. The user clearly wants precision—they'd appreciate seeing exactly where the analogy to social choice holds (aggregation of criteria ≈ aggregation of votes) and where it breaks (evidential support isn't just preference).

  Also noting their request for British English. I'll avoid phrases like "go figure" and stick to "whilst" and "amongst". They're clearly thoughtful—probably academic or very advanced autodidact—so no dumbing down. Key is to validate that their observation is both real and theoretically thorny, while giving them tools to dissect it further.
answer: |-
  Right, you've hit upon a fascinating and deeply important phenomenon in the philosophy of science, epistemology, and decision theory, particularly concerning **Inference to the Best Explanation (IBE)**. What you're describing isn't just a quirk of amateur history; it reveals a fundamental challenge in rational choice under multiple criteria. Here's the breakdown:

  **1. The Core Problem: Non-Transitivity in Evidential Support**

  Your two scenarios are both manifestations of the same underlying issue: **the failure of the "better than" relation to be transitive when comparing hypotheses based on multiple, potentially conflicting virtues.**

  *   **First Scenario (The Spoiler Effect):** This demonstrates **context-dependence of pairwise comparisons**. C is introduced, not because it's strong, but because it's *similar to B on the virtue where B beats A*. By highlighting this shared virtue (and implicitly its weakness when held by C), it makes the *difference* between A and B (where A excels) seem more decisive. The *relative strength* of A vs B changes depending on whether C (emphasising Virtue V, where B was strong) is present.
  *   **Second Scenario (The Cycle):** This is a direct **violation of transitivity**. We have A > B (on Virtue V1), B > C (on Virtue V2), and C > A (on Virtue V3). There is no consistent overall ranking. Asking for a "best" forces an arbitrary choice or reveals an inability to commensurate the different virtues (fit, simplicity, coherence) into a single metric that yields a total ordering.

  **2. What It's Called (and Related Concepts)**

  There isn't one universally agreed-upon term, but several capture facets of it:

  *   **Non-Transitivity of Evidential Support / Explanatory Virtues:** This is the most precise description of the *core phenomenon* you identified (especially the cyclic case). It means that "is better supported by the evidence than" or "is a better explanation than" is not a transitive relation when multiple criteria are involved. This directly mirrors **majority cycles (Condorcet Paradox)** in social choice theory.
  *   **Context-Dependence of Evidential Comparisons:** This emphasises how the *relative* strength of two hypotheses (A vs B) can depend on which *other* hypotheses (C) are explicitly considered in the comparison set (your first scenario).
  *   **The Problem of Commensurability:** This is the deeper issue underlying the non-transitivity. It asks: *Can the different explanatory virtues (fit, simplicity, scope, coherence, etc.) be meaningfully compared and traded off against each other to yield a single, objective "best" score?* Your observations suggest that in practice, and perhaps in principle for some virtues, they cannot be perfectly commensurated.
  *   **The Framing Effect in Hypothesis Evaluation:** Similar to framing effects in behavioural economics, how the choice set is presented (which hypotheses are included) can influence the perceived "best" option, even when the core evidence remains the same (your spoiler scenario).
  *   **Violation of the Independence of Irrelevant Alternatives (IIA):** This is the *direct* analogy to the spoiler effect in social choice theory. IIA states that the ranking between two options (A and B) should not change based on the introduction or removal of a *third, "irrelevant"* option (C). Your first scenario is a textbook violation of IIA in explanatory reasoning: C is irrelevant to winning (it's implausible), yet its introduction changes the winner from B to A. **This is a very close analogy.** Picking the best explanation *is* analogous to aggregating preferences – but in this case, it's aggregating the "preferences" (or weights) assigned by the evaluator *to the different virtues* across the different hypotheses. The aggregation rule (how virtues are balanced) is susceptible to the same paradoxes as aggregating voter preferences.

  **3. What It Isn't**

  *   **Underdetermination:** This is the idea that evidence alone cannot uniquely determine a single theory (multiple theories fit the data). Your problem occurs *even when people agree on the evidence and that there's a fact of the matter*. The issue isn't that evidence underdetermines *which* hypothesis is true, but that the *criteria for judging "best"* lead to inconsistent rankings.
  *   **Theory-Ladenness:** This concerns how background theories influence the interpretation of evidence. Your problem arises even when people share the same background theories and interpretations. The conflict is in how to *weight* the resulting virtues attributed to each hypothesis.
  *   **Simple Indecisiveness/Laziness:** As you noted, the "stalling" in the cyclic case isn't laziness; it reflects a genuine difficulty in commensurating incommensurable values.

  **4. Is it a Problem for IBE Specifically or Wider?**

  *   **Primarily for IBE:** IBE explicitly relies on identifying the "best" explanation based on balancing multiple virtues. Non-transitivity and IIA violations strike directly at the heart of this methodology. If "best" isn't stable or transitive, IBE becomes ambiguous or context-dependent in undesirable ways.
  *   **But Also Wider:** This problem affects *any* decision-making process based on multiple criteria where those criteria cannot be perfectly reduced to a single common measure (e.g., utility, probability). It impacts cost-benefit analysis, multi-criteria design choices, and even ethical reasoning involving conflicting values.

  **5. The Bayesian "Solution" (or Change of Subject?)**

  Bayesianism **formally solves** the problem by reducing everything to a single metric: **posterior probability**. It forces commensurability by assigning precise probabilities and utilities (though the latter is often implicit in accepting/rejecting hypotheses).

  *   **How it solves it:**
      *   Hypotheses have prior probabilities (P(H)) reflecting initial plausibility.
      *   Evidence updates these to posterior probabilities (P(H|E)) via Bayes' Theorem (P(H|E) = [P(E|H) * P(H)] / P(E)).
      *   P(E|H) (the likelihood) *encapsulates* virtues like fit and coherence. Simplicity is often argued to be reflected in higher priors.
      *   Posterior probability provides a *total ordering*. Transitivity is guaranteed. IIA is irrelevant because *each hypothesis is evaluated against the evidence model itself*, not directly against the others in the set. The probability of A given E is calculated independently of whether C is being considered (though C's *probability* might affect the calculation of P(E) if it's a serious contender).
  *   **Why it might feel like a "change of subject":**
      *   **Commensurability Assumption:** It *assumes* all relevant epistemic considerations *can* and *should* be quantified as probabilities. Many historians/philosophers argue virtues like "explanatory power" or "coherence with the spirit of the age" resist precise probabilistic formulation. Bayesianism provides a *framework* but doesn't tell you how to *assign* the numbers meaningfully.
      *   **Priors:** Assigning priors, especially to complex historical hypotheses, is notoriously subjective and contentious. The "solution" might just bury the disagreement under prior probabilities.
      *   **Loss of Nuance:** Reducing complex explanatory virtues to a single probability number can feel like losing valuable qualitative distinctions. The Bayesian answer might be "A is most probable," but it doesn't necessarily capture *why* it feels better than B in one way but worse in another, which was the source of the original debate.
      *   **Computational Impracticality:** For complex historical cases with many interdependent pieces of evidence and hypotheses, full Bayesian calculation is often intractable.

  **Conclusion and Coinage**

  You've astutely identified **non-transitivity and context-dependence in multi-criteria evidential reasoning**, particularly problematic for Inference to the Best Explanation. The analogy to social choice theory (Condorcet cycles, IIA violations) is **highly pertinent** – choosing the best explanation by balancing virtues *is* analogous to aggregating preferences over those virtues across hypotheses.

  **Coined Term/Phrase:** While the existing terms above work, let's try for something slightly more evocative for the *specific historical argument pattern* you observe:

  *   **"The Evidential Spoiler Effect" (for Scenario 1):** Emphasises the IIA-violation aspect.
  *   **"The Explanatory Cycle Paradox" (for Scenario 2):** Emphasises the non-transitivity.
  *   **"The Commensurability Dilemma in IBE":** Emphasises the root cause affecting both scenarios.

  **The Crux:** The "edges" are defined by situations where:

  1.  Multiple, distinct explanatory virtues are considered important.
  2.  These virtues conflict across different pairs of hypotheses.
  3.  There is no agreed-upon, objective way to weight or trade-off these virtues against each other to produce a single, unambiguous ranking.

  This isn't a flaw in the *evidence* or a denial of an underlying truth; it's a challenge in the *method of evaluation* when multiple, incommensurable dimensions of "goodness" are involved. Bayesian probability *formally* resolves it by imposing commensurability through quantification, but whether this adequately captures the richness of historical reasoning or merely sidesteps the difficult questions of weighting is a matter of ongoing philosophical debate.
