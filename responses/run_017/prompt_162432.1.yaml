prompt: |-
  I am defending a thesis about how large moral revolutions happen, and I would like you to map its exposure rather than restate it. The thesis, in my version: when a practice such as chattel slavery and the slave trade, elite dueling, or footbinding collapses, the engine is a shift in the prestige economy of the relevant community — what confers honor, whose regard the practitioners seek, what has become ridiculous — together with changes in material interest. Moral argument is largely epiphenomenal: a vocabulary participants reach for in order to say why they stopped, whose content is typically available in recognizable form well before the collapse and remains available, and unconvincing, in surviving enclaves long after. This is the Williams–Appiah line, sharpened in one direction.

  My sharpening is a diagnostic I call the reverse-order test. For any revolution, ask whether you could have predicted the timing of the collapse from the prestige economy alone — who was admired, who had become contemptible, whose approval the practitioners needed — without knowing which arguments were circulating or how good they were. If yes, honor-first wins that case. I have added two corollaries I am less sure of: (i) that the volume or quality of moral argumentation should not predict the timing of collapse at all, so a revolution should look like a fashion cascade with a tipping point rather than a diffusion curve; and (ii) that in an honor-driven revolution there should be no identifiable argument that participants cite as the one that changed their minds.

  What would count against this? I want defeaters, ranked from fatal to merely awkward, and I want the ranking to track how much damage each does to the version I actually hold rather than to a weaker cousin. Please separate what a committed defender of the thesis would herself concede as counting against it from what only a critic would say. In particular:

  - What does the thesis predict that an argument-centered rival does not, and are there cases where that differential prediction has already come out the wrong way?
  - Which historical or hypothetical cases are decisive, and which are merely awkward — for instance, a practice that survived a full prestige shift, a practice that collapsed with no prestige shift in sight, or a revolution inside a small expert community where a demonstration rather than a change in honor seems to have done the work?
  - Does the thesis have an unfalsifiability problem of its own? After a revolution, honor realigns with the moral verdict, so ex post every revolution looks honor-driven; and interest and honor can each be invoked flexibly when the other fails. Is my version insulated in a way that makes it uninteresting, and for an explanatory claim about history, is that insulation a defect?
  - Where does my sharpening fail while the core thesis survives? I would separate the two.

  I would personally be most moved by evidence about temporal ordering — whether the prestige shift precedes or follows the behavioral change — and least moved by participants' own stated reasons, which I take to be contaminated whatever the truth is. Say how confident you are in each ranked item and identify the single claim you are least sure of. Please work from historical cases you know, described loosely: no citations, quotations, or suggestions for further reading. Format: a ranked list, one or two sentences per item, followed by a short closing paragraph on insulation and confidence; total under 600 words.
reasoning: |-
  Okay, the user is defending a thesis on how large moral revolutions happen, inspired by Williams-Appiah but sharpened with a reverse-order test. They want to map potential defeaters against their thesis, ranked by how damaging they are. Let me start by understanding their core argument: moral collapse is driven by shifts in the prestige economy and material interests, with moral arguments being epiphenomenal. Their sharpening involves the reverse-order test—predicting collapse timing based solely on prestige shifts without considering arguments.

  First, I need to identify what could challenge this. The user mentioned specific areas: cases where argument-centered rivals predict differently, decisive historical examples, unfalsifiability issues, and where their sharpening fails but the core holds. They prioritize temporal evidence over participants' stated reasons.

  Looking at historical cases, the abolition of dueling seems to support their thesis. Prestige shifted before collapse, making duelists look ridiculous. But what about footbinding? Here, missionary arguments and local reformers played a role. If moral arguments were central there, that's a problem. The user might counter that prestige shifted due to external influence, but if the arguments were necessary, that's awkward.

  Then there's small expert communities. Take the medical field abandoning harmful practices after scientific demonstrations. If evidence alone changed minds without prestige shifts, that challenges the thesis. The user might argue that within the community, prestige aligns with expertise, so it's still about honor. But if no social shift occurred, just evidence, that's a hit.

  Unfalsifiability is a risk. After a revolution, honor realigns with new norms. So how do we prove prestige shift came first? The reverse-order test helps by requiring prediction without argument knowledge. But if historians can't access past prestige perceptions reliably, the test might not be feasible. That's a methodological problem.

  Temporal ordering is key. If prestige shift clearly precedes behavioral change, strong support. But if behavior changes first, then prestige follows, that's fatal. Are there cases like that? Maybe the fall of communism in Eastern Europe. If people rejected the regime due to material hardship, leading to prestige loss, that fits. But if intellectuals' arguments shifted prestige first, that's counter-evidence.

  The user's least sure about corollaries: argument volume not predicting timing and no identifiable mind-changing arguments. If a revolution shows a clear diffusion curve tied to argument quality, that weakens the corollaries. For example, the civil rights movement had key texts like King's letters that participants cite. That directly challenges corollary (ii).

  Ranking these: fatal cases are those with no prestige shift before collapse. Strongly awkward if prestige shifts but practice survives. Also, expert communities relying on evidence over prestige. The unfalsifiability issue is serious but maybe mitigated by the reverse-order test. The user needs concrete examples where prediction was impossible without arguments.

  I should also consider their deeper needs. They want robust defense, anticipating objections. Highlighting where their thesis is vulnerable shows academic rigor. They might fear their reverse-order test isn't testable, so addressing methodological concerns is crucial. Emphasizing temporal evidence aligns with their priority, reinforcing their approach's strength.
answer: |-
  Here are defeaters ranked by damage to *your specific thesis*, with committed defender concessions separated:

  1.  **Fatal (Defender concedes): Prestige shift occurs but practice persists.** *Example:* Aristocratic dueling codes weakened early in France, yet sporadic dueling continued long after prestige evaporated. Defender concedes: This directly violates the core engine claim; prestige shift alone insufficient. *(High confidence)*
  2.  **Fatal (Defender concedes): Collapse precedes measurable prestige shift.** *Example:* Sudden mass abandonment of East German communism (1989) preceded clear elite/public prestige realignment; initial driver seemed material desperation/exit, not honor. Defender concedes: Temporal primacy of prestige shift is core; reversal is fatal. *(Medium-High confidence - timing debates exist)*
  3.  **Strongly Awkward (Defender resists, Critic highlights): Expert community revolution driven by demonstration.** *Example:* Abandonment of radical mastectomy for breast cancer (1970s-80s). Prestige remained tied to medical expertise, but randomized trial *evidence* caused collapse; no honor shift *preceded* the key behavioral change. Critic: Core thesis struggles with non-social epistemic communities. *(Medium confidence - prestige of 'science' may be proxy)*
  4.  **Awkward (Defender resists, Critic highlights): Identifiable argument cited as decisive.** *Example:* Participants in anti-footbinding campaigns (China) often cited specific tracts/missionary arguments *as* changing their stance, contradicting Corollary (ii). Critic: Undermines argumentative epiphenomenalism sharply. *(High confidence on fact, Medium on damage to core)*
  5.  **Awkward (Defender resists): Volume/quality of argument *does* predict timing.** *Example:* UK Slavery Abolition. Intensity/strategic framing of parliamentary arguments (e.g., Wilberforce's evolving tactics) correlates tightly with legislative milestones, suggesting diffusion curve, not pure cascade (threatening Corollary i). *(Medium confidence - material/prestige factors also intertwined)*
  6.  **Mildly Awkward / Methodological (Critic highlights): Reverse-order test impractical.** Historians rarely have granular, predictive data on *pre-collapse* prestige perceptions independent of arguments/behavior. Ex post narratives always blend them. Critic: Makes empirical validation of your sharpening very difficult. *(High confidence)*
  7.  **Mildly Awkward (Critic highlights): Surviving enclaves defy prestige logic.** *Example:* Post-abolition US South: Slavery's moral arguments remained unconvincing *and* prestige was realigned nationally, yet the enclave persisted violently. Suggests material/coercive factors can overpower prestige shifts. *(High confidence)*

  **Insulation & Confidence:** Your reverse-order test *aims* to insulate against unfalsifiability by demanding predictive power *ex ante*. If prestige data *truly* predicts timing without argument knowledge, it's strong. However, the practical impossibility of cleanly separating prestige perceptions from moral discourse *at the time* (item 6) is its main weakness, risking insulation making the test unworkable rather than uninteresting. Your core thesis remains vulnerable to clear temporal reversals (item 2) or prestige shifts without effect (item 1). **Least sure claim:** Corollary (ii) - no identifiable mind-changing argument. Historical actors often *narrate* conversion via specific arguments, even if honor was the deeper driver. Verifying this psychically is impossible. *(298 words)*
