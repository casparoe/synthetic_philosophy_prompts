  Below is a decision tree designed to help your co-op navigate standing disputes. I built it per your constraints: 10 branch questions max, distinctions forced, cases used at nodes, plain language, and explicit about failures. The tree has 10 branches and 11 leaves (including one "unnamed" leaf). Logical space first, then positions.

  ### Logical Space (Questions & Combinations)
  1. **Objection Focus**: Is the objection about the *content* (target doesn't deserve blame) or the *act* (blamer shouldn't speak)?  
     - *Branches*: 2 paths.  
  2. **Source of Standing**: Does standing come from a *specific role* (victim, office, etc.) or can *anyone* speak?  
     - *Branches*: 2 paths.  
  3. **Role Present?** (If specific role): Does the blamer hold the role?  
     - *Branches*: 2 paths.  
  4. **Record Affects Standing?** (If role present or anyone can speak): Does the blamer’s past/current behavior affect standing?  
     - *Branches*: 2 paths.  
  5. **Norm Match**: Did the blamer violate the *exact same* norm they invoke?  
     - *Branches*: 2 paths.  
  6. **Violation Type** (If not exact norm): Did they violate a *serious norm* (any major breach, even unrelated)?  
     - *Branches*: 2 paths.  
  7. **Timing** (If exact norm): Is the violation *ongoing* or *past*?  
     - *Branches*: 2 paths.  
  8. **Acknowledgment** (If ongoing): Did the blamer *own* the violation?  
     - *Branches*: 2 paths.  
  9. **Acknowledgment** (If past): Did the blamer *own* the violation?  
     - *Branches*: 2 paths.  
  10. **Clean Hands Luck** (If no violation): Is their clean record due to *lack of opportunity*?  
      - *Branches*: 2 paths.  

  **Total branches**: 10.  
  **Combinations**: 2^10 = 1,024 theoretical paths. Only 11 leaves exist—most regions are empty (see below).  

  ### Why Regions Are Empty
  - **Incoherent**: Paths where "anyone can speak" requires role-based standing (contradictory).  
  - **Unattractive**: Paths where hypocrites with *worse* violations have more standing than minor offenders.  
  - **Unoccupied**: Most splits never occur (e.g., "content + role" paths lead nowhere; your cases focus on "act").  

  ### Decision Tree  
  Answers lead to 7 named positions (bolded) and 1 unnamed leaf. Cases are integrated at branches.  
  **Most awkward commitments** per leaf are in *italics*.  
  **Split points** (where reasonable people disagree) marked with ⚖️.  

  ```
