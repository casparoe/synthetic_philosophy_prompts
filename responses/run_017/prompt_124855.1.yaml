prompt: |-
  I direct the policy team at Emberhold, a platform that hosts several hundred thousand user-built virtual worlds. Our moderators handle roughly forty escalated complaints a week in which one user says they were genuinely harmed by what another user did to something inside a world: a structure destroyed, an avatar maneuvered into simulated sexual contact, a scarce item duplicated until it was worthless, a memorial defaced, a guild's treasury drained. Right now each of these is decided ad hoc, and our enforcement notices read inconsistently as a result — sometimes we write as though an object was damaged, sometimes as though nothing was damaged at all and only a person's feelings were affected, and we have no way to say which framing a given case called for.

  I need a written decision procedure my moderators can actually run. Please build it, and please write your answer in British English.

  What the procedure has to work with. Our worlds have three persistence classes, which we can read off the logs: "spawned" objects, which regenerate identically at the start of every session; "anchored" objects, which exist in exactly one copy, are bound to a single account, and which we can restore from a nightly snapshot; and "heirloom" objects, which are bound to one account, exist in one copy, and are flagged non-restorable — not even we can bring them back. We keep a provenance ledger recording build time, authorship, and transfer history for anchored and heirloom items. We sell an in-world currency, shards, at a fixed rate and redeem it on the same schedule; there is also a player-to-player market in items that we tolerate but do not run or guarantee. Some worlds use a "tethering" mechanic in which damage dealt to one avatar is mechanically propagated to another avatar or to a construct that player maintains. Worlds can be tagged "open PvP," "permadeath," or "no-loss" by their creators, and entering a tagged world requires a click-through that states the tag.

  Constraints the procedure has to respect. It will be run by moderators with no philosophy or legal training, in under half an hour, using only evidence in our logs and ledgers. It may not depend on identifying anyone off-platform, on any clinical or psychological assessment of how upset a user was, or on any case-by-case judgment about how much an item "meant" to someone beyond what the provenance ledger shows. Its outputs should be one of: enforce as a property-type violation; enforce as a conduct violation without any claim about objects; no enforcement, with the reason recorded; or escalate. Escalations go to a five-person review panel that meets weekly. Every outcome has to be summarizable in one sentence for a public transparency report, so the reasoning cannot be allowed to sound incoherent once compressed.

  What I want you to deliver. First, an ordered set of named tests, each with a statement of what counts as sufficient evidence for it from our records, including at least one gate where the procedure stops outright with no enforcement and at least one where it must hand the case to the panel on the grounds that the remaining question is one of values rather than facts. Include an explicit "we cannot tell" outcome for cases our data cannot distinguish. Second, a worked application to three cases: an heirloom construct destroyed by a trap in a world tagged permadeath, where the builder had clicked through the warning and the ledger shows nine hundred hours of building; a case of non-consensual avatar contact in an untagged social world in which nothing was destroyed, lost, or devalued; and a duplication exploit that put ten thousand copies of a scarce cosmetic into circulation, where the loss to any individual holder is trivial and the aggregate loss is large. At least one of the three must come out in a way my team will not like, and I want you to say plainly that it does and why. Third, a one-page version for moderator use, plus a short log of the substantive assumptions baked into each step.

  Two further things matter to me as much as the cases. My team is split between those who think virtual objects are perfectly real objects that can be damaged, those who think nothing was really harmed and only the person was, and — separately — those who think any loss here is fully explained by invested labor and scarcity versus those who think the object's role inside the community's ongoing practice is what does the real work. I do not need you to settle any of that, but at every step where the outcome would flip if one of those questions were resolved the other way, I want that flagged in the margin. And I want a closing section on what the procedure cannot do: where it will misfire, which kinds of case it will systematically misdescribe, and what it would take — in evidence or in policy — to fix it.
reasoning: |-
  Okay, the user is leading a policy team at Emberhold, a platform hosting hundreds of thousands of virtual worlds. They need a decision procedure for moderators to handle about forty escalated complaints weekly. These cases involve users claiming harm from others' actions—like destruction of structures, non-consensual avatar interactions, item duplication devaluing assets, defacing memorials, or draining treasuries. Currently, decisions are ad hoc, leading to inconsistent enforcement notices. The user wants a standardized procedure in British English that moderators can execute in under thirty minutes using only platform logs and ledgers.

  The key elements from the user's requirements include:
  - **Persistence Classes**: Objects are categorized as "spawned" (regenerate each session), "anchored" (single copy, restorable from nightly snapshots), or "heirloom" (single copy, non-restorable).
  - **Data Available**: Provenance ledger with build time, authorship, transfer history for anchored/heirloom items; in-world currency (shards) with fixed exchange; player markets (tolerated but not guaranteed); world tags ("open PVP," "permadeath," "no-loss") with click-through warnings.
  - **Constraints**: No off-platform identification, no psychological assessments, no subjective judgments about emotional value beyond provenance data. Outputs must be one of: property-type violation, conduct violation, no enforcement, or escalate to a panel. Outcomes must be summarizable in one sentence for transparency reports.

  The user also highlights philosophical splits within their team:
  - Realism vs. emotional harm: Some believe virtual objects are "real" and can be damaged; others see only emotional harm to the person.
  - Value basis: Some attribute loss to invested labor/scarcity; others emphasize the object's role in community practice.
  The procedure must flag steps where outcomes would change based on these unresolved debates.

  **Deep Needs Analysis**:
  1. **Consistency & Efficiency**: The core need is replacing ad hoc decisions with a replicable, time-bound process to reduce inconsistencies and moderator workload.
  2. **Philosophical Neutrality**: The procedure must sidestep team disputes by relying solely on verifiable data (logs/ledgers), not subjective interpretations.
  3. **Transparency & Legitimacy**: Public-facing summaries require coherent reasoning that holds up under compression, building trust.
  4. **Risk Mitigation**: By including "escalate" gates and "cannot tell" outcomes, the procedure acknowledges limitations, reducing enforcement errors.
  5. **Future-Proofing**: The closing section on limitations signals foresight—anticipating edge cases where the system fails, guiding future policy/tech upgrades.

  **Procedure Design Strategy**:
  - **Structure**: Use a flowchart-like sequence of named tests (e.g., "Restorability Check," "Consent Verification") to simplify moderator navigation.
  - **Evidence Gates**: Anchor each test to specific log/ledger data (e.g., persistence class, world tags, provenance hours) to eliminate ambiguity.
  - **Critical Flags**: Margin notes highlight steps where philosophical disagreements could alter outcomes (e.g., "Labor Theory Flag" when assessing hours logged).
  - **Escalation Triggers**: Include explicit handoffs to the panel for value judgments (e.g., whether non-consensual contact in untagged worlds constitutes harm without property loss).

  **Worked Examples**:
  1. **Heirloom in Permadeath World**: Outcome "no enforcement" due to warnings and persistence rules—but flag as philosophically contentious (labor value vs. consent norms).
  2. **Non-Consensual Contact**: Outcome "conduct violation" since no property loss occurred—satisfies emotional-harm view but may frustrate realism advocates.
  3. **Duplication Exploit**: Outcome "property violation" based on aggregate devaluation—aligns with scarcity views but ignores community-practice perspectives.

  **Unpopular Outcome**: The permadeath case ("no enforcement") will displease teams prioritizing labor investment or community meaning, as the procedure overrides subjective value with contractual consent (click-through).

  **Limitations Section**: Will detail misfires—e.g., heirlooms with high communal value but low provenance hours, or "tethering" harm without object loss—and propose fixes like community-voting systems or expanded data tracking.

  This approach balances pragmatism with intellectual honesty, giving the user a tool that operationalizes their constraints while openly acknowledging its blind spots.
answer: |-
  Below is a comprehensive decision procedure for Emberhold moderators, designed to meet your specifications. It uses British English and adheres strictly to your constraints: evidence-limited, philosophy-agnostic, time-bound (≤30 mins), and output-constrained. The procedure is structured as an ordered set of tests, with flags for steps where unresolved team disagreements would alter outcomes ("**Flag: [Disagreement Type]**"). 

  ---

  ### **Emberhold Moderation Decision Procedure: Standardised Harm Assessment Protocol (SHAP)**

  #### **Ordered Tests & Evidence Requirements**
  1. **Test A: Restorability Check**  
     - *Evidence*: Object persistence class from logs (spawned/anchored/heirloom).  
     - *Outcomes*:  
       - If **spawned**: No enforcement → **Exit with reason**: "Object regenerates per session; no irreversible loss."  
       - If **anchored/heirloom**: Proceed to Test B.  
     - *Assumption*: Only irreversible loss warrants property enforcement. Spawned objects lack permanence.  
     - **Flag: Realism Disagreement** (If team believes spawned objects can be "harmed," this gate fails).

  2. **Test B: World Rules & Consent**  
     - *Evidence*: World tag ("open PvP"/"permadeath"/"no-loss") + user’s click-through acceptance log.  
     - *Outcomes*:  
       - If **tagged world** + **click-through logged**: No enforcement → **Exit with reason**: "User consented to world rules permitting this action."  
       - If **untagged or no click-through**: Proceed to Test C.  
     - *Assumption*: Tagged worlds imply informed consent to inherent risks.  
     - **Flag: Values Disagreement** (If team disputes whether tags cover *all* harms, e.g., non-consensual contact).

  3. **Test C: Provenance & Scarcity Impact**  
     - *Evidence*: Provenance ledger (build time/transfer history) + market logs (item quantity/value shifts).  
     - *Outcomes*:  
       - **Anchored item**: Restore from snapshot → **Enforce as property violation**: "Item restored; violation recorded."  
       - **Heirloom item**: Proceed to Test D.  
       - **Currency/shards devalued**: Proceed to Test E.  
       - **No item loss/devaluation**: Proceed to Test F.  
     - *Assumption*: Anchored items are mechanically restorable; heirlooms/shards require further scrutiny.  
     - **Flag: Labor vs. Community Disagreement** (Value hinges on hours logged vs. unlogged communal role).

  4. **Test D: Heirloom Irreversibility**  
     - *Evidence*: Heirloom flag + provenance ledger (build hours/transfers).  
     - *Outcomes*:  
       - **Always**: Enforce as property violation → "Heirloom destroyed; irreversible loss confirmed."  
     - *Assumption*: Heirlooms’ non-restorability defines harm, regardless of context.  
     - **Flag: Realism Disagreement** (If team views this as "only emotional harm," enforcement is misaligned).

  5. **Test E: Aggregate Devaluation**  
     - *Evidence*: Market logs (pre/post circulating copies, shard redemption rate).  
     - *Outcomes*:  
       - **Individual loss trivial** + **aggregate loss material** (e.g., >1,000% copies; shard devaluation): Enforce as property violation → "Exploit devalued in-world assets systemically."  
       - **No material devaluation**: No enforcement → **Exit with reason**: "No provable devaluation per market logs."  
     - *Assumption*: Scarcity defines value; aggregate harm is enforceable.  
     - **Flag: Labor vs. Community Disagreement** (If value stems from community practice, not scarcity, this misfires).

  6. **Test F: Avatar/Contact Harm**  
     - *Evidence*: Logs of avatar interaction (tethering mechanic, contact type) + world tag.  
     - *Outcomes*:  
       - **Mechanical propagation** (e.g., tethering damage): Enforce per Test A–E *if* linked to an object.  
       - **Non-consensual contact** + **no object loss**: Enforce as conduct violation → "Non-consensual avatar contact violates platform conduct standards."  
       - **Consent ambiguous**: Escalate → "Panel must rule on consent norms."  
     - *Assumption*: Non-consensual contact is inherently harmful without property loss.  
     - **Flag: Values Escalation** (Requires panel if team disputes whether contact alone constitutes harm).

  7. **Test G: Indistinguishable Cases**  
     - *Evidence*: Conflicting or absent logs.  
     - *Outcome*: **"Cannot tell"** → Escalate or exit: "Insufficient evidence; logs inconclusive."  

  #### **Escalation & Output Rules**  
  - **Escalate to panel** if:  
    - Test B (untagged worlds) + contact harm (Test F), *or*  
    - Test G (indistinguishable), *or*  
    - **Flagged values question** (e.g., whether non-consensual contact in untagged worlds is harmful without property impact).  
  - **All outcomes** summarizable in one sentence (see examples above).  

  ---

  ### **Worked Examples**  
  *Using SHAP’s test sequence:*

  1. **Heirloom destroyed in permadeath world**  
     - Test A: Heirloom → Proceed.  
     - Test B: Tagged "permadeath" + click-through logged → **No enforcement**. Exit reason: "User consented to world rules permitting destruction."  
     - *Unpopular outcome*: Your team will dislike this. **Why?** The 900-hour build is irrelevant per constraints; consent via tag overrides emotional/labor investment. Ignores "heirloom as real property" view.  

  2. **Non-consensual avatar contact in untagged social world**  
     - Test A: No object → Skip to Test F.  
     - Test F: Non-consensual contact + no object loss → **Conduct violation**. Outcome: "Non-consensual avatar contact violates conduct standards."  
     - *Philosophy note*: Satisfies "only emotional harm" view; frustrates "no harm without property loss" advocates.  

  3. **Duplication exploit (10k copies of scarce cosmetic)**  
     - Test A: Anchored/heirloom? Assume anchored → Proceed.  
     - Test C: Anchored → Restore snapshot. **But** devaluation occurs → Proceed to Test E.  
     - Test E: Individual loss trivial + aggregate loss large → **Property violation**: "Exploit devalued assets systemically."  

  ---

  ### **One-Page Moderator Guide**  
  **Emberhold SHAP Quick Reference**  
  1. **Restorability Check**  
     - Spawned? → Exit: "No irreversible loss."  
     - Anchored/heirloom? → Next.  
  2. **World Rules**  
     - Tagged + click-through? → Exit: "Consented to rules."  
     - Untagged/no click-through? → Next.  
  3. **Provenance & Scarcity**  
     - Anchored? → Restore + "Property violation."  
     - Heirloom? → "Property violation" (irreversible).  
     - Shards/items devalued? → Next.  
  4. **Heirloom Specifics**  
     - Always "Property violation."  
  5. **Devaluation Scale**  
     - Trivial individual + large aggregate? → "Property violation."  
     - No devaluation? → Exit.  
  6. **Avatar Harm**  
     - Tethering? → Assess like objects (Step 1–5).  
     - Non-consensual contact? → "Conduct violation."  
     - Ambiguous? → Escalate.  
  7. **Unclear Evidence**  
     - Logs conflicting? → "Cannot tell" → Escalate/exit.  

  **Substantive Assumptions per Step**  
  - A: Spawned objects lack harm potential.  
  - B: Tags = informed consent to *all* in-world acts.  
  - C: Restorable anchors lack lasting harm; value = scarcity.  
  - D: Heirlooms’ non-restorability = automatic harm.  
  - E: Aggregate devaluation is materially harmful.  
  - F: Non-consensual contact is harmful *per se*.  

  ---

  ### **Limitations & Systematic Misfires**  
  **What SHAP Cannot Do**  
  1. **Misfires on Subjective Value**: Systematically undervalues items with high communal meaning but low provenance hours (e.g., a memorial with 10-hour build but immense ritual use). *Fix*: Integrate community usage metrics (e.g., visitation logs).  
  2. **Ignores Emotional Harm**: Dismisses distress where no property/conduct rules breach (e.g., permitted griefing in untagged worlds). *Fix*: Policy change to define "emotional harm" thresholds.  
  3. **Tethering Ambiguity**: Fails if tethering causes non-object harm (e.g., psychological propagation). *Fix*: Log tethering mechanics explicitly.  
  4. **Market Exploits**: Player-run markets lack logs, so devaluation may be missed. *Fix*: Integrate third-party market APIs.  
  5. **Values Disputes**: Forces escalations on consent/contact norms (e.g., is "consensual" contact in a memorial world different?). *Fix*: Panel must issue binding precedents.  

  **Closing Note**: SHAP resolves inconsistency by prioritising verifiable data (persistence, tags, logs) over contested philosophies. However, it entrenches *your* constraints: it cannot reconcile team splits without policy changes or richer data. It best handles property harm; conduct/emotional cases remain fraught. For coherence, it sacrifices nuance—accepting that some harms will be misdescribed as "property" (e.g., non-consensual contact) or dismissed (e.g., consented heirloom loss). Transparency reports will reflect this trade-off.  

  ---  
  This procedure meets your requirements: evidence-driven, scalable, and output-constrained, with explicit flags for philosophical fault lines. It reduces ad hoc judgments while acknowledging where human review remains essential.
