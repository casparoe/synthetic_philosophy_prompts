    - So it might differ.

   In this case, conclusion voting says ship, while minimal distance might say don't ship if it chooses (1,1,1).

  So a question that might distinguish is one where there is an inconsistent vote and the minimal distance might choose a consistent set that has R=1 while the conclusion majority is R=0.

