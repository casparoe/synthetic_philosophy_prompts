    - So minimal distance chooses (1,0,0) -> which is not the conclusion voting outcome (which would be R=0, but R=0 is also in (1,0,0) and (0,0,0)). But in this case, the board would accept (1,0,0) which has P true, Q false, R false. Then the decision might be to ship. But note: in conclusion voting, they look only at R, which is 0, so ship. So in this example, both conclusion and minimal distance lead to ship.

