prompt: |-
  I'm on the capital projects oversight committee for a mid-sized city — me, the city engineer, somebody from finance, two council appointees, and a rotating seat for whichever department's project is on the agenda that month. We see maybe eight to twelve projects a quarter, anywhere from a few hundred thousand to tens of millions, mostly physical construction and mostly software replacements that have gone sideways. Our power is only recommendatory: we write continue / restructure / stop and send it up to council, and council follows us something like nine times out of ten. Two constraints shape everything: we get about thirty or forty minutes per project, and the recommendation has to fit on one page and be readable by a council member who is hearing about the project for the first time and mostly wants to know why the city spent four million dollars and has nothing to show for it.

  I got into an argument with a colleague last week about the dollar auction — you know the one, a dollar gets auctioned but the runner-up also has to pay their final bid, so two people who are each trying to cut their losses end up bidding well past a dollar and both lose. She said that's us, and that it describes every project we've ever let run. I said it isn't, because half the time there's nobody on the other side: we're not bidding against anyone, we're just handing money to a vendor who keeps saying the last twenty percent is right around the corner. We ended up agreeing that some of our projects really do have that structure and some don't, and that the difference matters more than the standard advice does — everything I've read about escalation of commitment and sunk costs bottoms out in "ignore sunk costs," which is true and completely useless to us, because by the time something reaches our desk the spend is gone, and the live question is whether the *remaining* spend is worth it, and the case for that is very often built out of the money that's already gone.

  So I want a procedure, not an essay, and I want it to start with a structure check rather than with "do the future benefits exceed the future costs" (that question always gets answered yes by whoever wants the project). Concretely, what I need: a way to sort a project into something like (a) real rivalry — some other party's money, deadline, or behaviour is part of why continuing looks good; (b) no rival, just a contractor and a slipping schedule; (c) cases where the money already spent genuinely raises the value of finishing, because the permit is grandfathered or the foundation is poured or the data's already migrated and there's no rollback path — plus an actual test that tells (c) apart from the cases where it only feels like that, since "we're too far in to stop now" is the line we hear most and sometimes it's true. Then: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a "stop," and where it hands the decision to a person because it's a values call and not a factual one. I'd like at least two tests that catch escalation specifically rather than just asking whether the project is any good — something like a restart test (would we fund this today as a brand-new proposal from a different department, same remaining cost, same expected benefit) and something that separates the person who authorized the original spend from the person who writes the recommendation — but please say honestly where each test misfires, because the restart test looks to me like it breaks exactly when there is a real completion premium, and I want to know what to do in that case. I also need the exit options spelled out, since "stop" isn't one thing: kill, mothball, descope to something usable, hand it to another body, re-phase — each with different salvage and different politics, and the auction's bid-or-quit-and-lose-everything menu isn't ours. And there has to be a slot for the awkward version of the argument, that finishing is sometimes worth it because a track record of finishing (or of making a contractor eat a change order) has value for every future project we touch: I think that's occasionally real and I also think it's the easiest thing in the world for a project sponsor to abuse, so I want it in the procedure and flagged.

  Then run it on three cases. First, a four-year-old software system replacement at roughly twice its original budget, vendor says it's seventy percent there and needs one more push. Second, a downtown streetscape where a state grant covers sixty percent but only if we finish by a date we now can't hit without more city money, and the state has already changed the rules on us once. Third, a small neighborhood library branch in a district that's been promised one for a decade, thirty percent built, not much left in the budget, and the council member who chairs our committee represents that district — I want the third one to be the case where the procedure says stop and tells me something I won't like, and I want it said plainly instead of hedged. If there's a fourth shape of case the procedure genuinely can't settle, describe that case rather than forcing it through. Please don't give me a catalogue of cognitive biases and don't cite anything; I'll add references myself if I ever write this up, and it has to be runnable in a meeting by people with no economics background who recieve the packet the night before.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on a capital projects oversight committee for a mid-sized city. Their committee reviews 8-12 projects per quarter, each ranging from hundreds of thousands to tens of millions. The main constraints are limited time (30-40 minutes per project) and the need for a one-page recommendation that council members can quickly grasp. 

  The core issue they're facing revolves around escalation of commitment and sunk costs. They had a discussion with a colleague about the dollar auction problem, where projects keep getting funded past reasonable points because stopping feels like admitting defeat. They need a practical procedure to categorize projects into three types: real rivalry, no rival (just contractor delays), and genuine completion premiums. 

  The user explicitly wants a structured decision tree, not theoretical advice. They need concrete tests to distinguish real completion value from false claims of being "too far in." They also want exit strategies beyond just "stop" and a way to handle the argument that finishing sets a precedent for future projects. 

  I notice they're frustrated with standard sunk cost advice because it ignores the reality that by the time projects reach them, sunk costs create real political and practical pressures. The committee needs tools to push back against sponsors who always claim future benefits justify more spending. 

  Three test cases are requested, including one where the procedure should recommend stopping even when politically uncomfortable. The examples given (software project, streetscape, library) cover different escalation scenarios. 

  Key challenges to address:
  - Creating a visual flowchart that fits their one-page constraint
  - Designing unambiguous tests for rivalry and completion premiums
  - Building in safeguards against sponsor optimism bias
  - Providing clear exit options with salvage considerations
  - Making it operable by non-economists with limited prep time

  For the rivalry test, I consider defining "binding constraints from external parties" as the threshold. For completion premiums, physical irreversibility or contractual lock-ins could be criteria. The restart test needs caveats for when sunk costs actually create value. 

  The committee politics aspect is crucial - especially the library example where a council member chairs the committee. The procedure must withstand political pressure through objective checks. 

  I'll structure the response as:
  1. A visual flowchart (described textually)
  2. Clear decision nodes with thresholds
  3. Specific exit recommendations
  4. Application to the three cases
  5. Discussion of limitations

  The library case will demonstrate political courage - showing when neighborhood pressure shouldn't override objective assessment. For projects the procedure can't resolve, I'll note the "strategic precedent" category as inherently subjective.
answer: |-
  Here's a structured decision procedure for your committee, designed for a 30-40 minute review and a one-page output. It focuses on escalation risks and completion premiums first, then future costs/benefits. **Bold** = Key Questions / Decision Points; *Italics* = Critical Tests.

  ---

  ### Project Assessment Flowchart (Run in Order)

  1.  **STRUCTURE CHECK: Is there REAL RIVALRY?**
      *   *Test:* Is there **another party (not the vendor) whose money, binding deadline, or enforceable behavior directly penalizes us for stopping/delaying, OR forces us to pay more if we don't act now?** (e.g., State clawing back a grant, legal penalty for missing a court-ordered date, competitor seizing an opportunity if we delay).
      *   *Sufficient Answer:* Documented contract clause, grant agreement term, court order, or credible market intelligence demonstrating the *immediate, quantifiable* penalty/opportunity cost triggered by stopping or significant delay.
      *   *If YES -> Proceed to Step 2.*
      *   *If NO -> Categorize as "NO RIVAL" and skip to Step 3.*

  2.  **RIVALRY RISK: Is the rival's threat credible & avoidable?**
      *   *Test:* **Can we realistically avoid the penalty/cost imposed by the rival by stopping/descoping NOW?** Or is the penalty already unavoidable? (e.g., Grant deadline missed yesterday = penalty unavoidable; penalty triggers only if project isn't *completed* by date X = potentially avoidable by stopping).
      *   *Sufficient Answer:* Legal/contractual analysis confirming the trigger event hasn't happened yet AND the penalty is contingent on future actions we control.
      *   *If AVOIDABLE -> Proceed to Step 3 (treat as "NO RIVAL" for escalation purposes, rivalry just adds cost).*
      *   *If UNAVOIDABLE -> Proceed to Step 3 (this cost is now a sunk cost impacting future value).*
      *   *If CREDIBILITY DOUBT -> Flag "High Risk" & proceed to Step 3.*

  3.  **COMPLETION PREMIUM: Is there GENUINE IRREVERSIBILITY?**
      *   *Test A (Physical):* **Does stopping leave behind physical assets/materials/work that significantly reduce the cost or time to achieve the *original core objective* if restarted later?** (e.g., poured foundation usable for future building, installed conduit for fiber).
      *   *Test B (Regulatory/Legal):* **Does stopping forfeit a permit, approval, or legal status that is grandfathered, exceptionally difficult, or impossible to re-obtain?** (e.g., environmental permit for specific site, zoning variance).
      *   *Test C (Technical):* **Does stopping leave the city in a materially worse operational state than before the project started, with NO cost-effective rollback?** (e.g., data migrated to new system halfway but unusable, old system decommissioned).
      *   *Sufficient Answer:* Engineering/legal/technical confirmation that the work *cannot be easily reversed or replicated later*, and *directly enables the core objective*. Avoid "we've done so much work" without proof of irreplaceability.
      *   *If YES (Strong Evidence) -> Categorize as "GENUINE PREMIUM".*
      *   *If NO or WEAK ("Feels too far") -> Categorize as "NO PREMIUM".*

  4.  **ESCALATION SAFEGUARDS (Run if "NO RIVAL" + "NO PREMIUM" OR if high spend escalation exists):**
      *   *Test 1: The Restart Test:* **"Ignoring all money spent and time passed, if a *different department* proposed starting this project *today* to achieve the *remaining scope* for the *remaining estimated cost* and *remaining timeline*, would we recommend funding it as a *new* project?"**
          *   *Misfires:* When Genuine Premium exists (Step 3 YES). *Mitigation:* If Restart Test fails, require overwhelming evidence for Premium.
      *   *Test 2: The Decision Changer Test:* **"Is the person(s) primarily responsible for authorizing the *original* budget and scope still the primary advocate for *continuing*? If yes, require independent verification (e.g., City Engineer, Finance) of key claims (vendor progress, cost estimates)."**
          *   *Misfires:* Rarely, if original sponsor is objectively correct despite past errors. *Mitigation:* Independent verification is always useful.

  5.  **FUTURE VALUE: Do Future Benefits > Future Costs?**
      *   *Test:* **Quantify the *remaining* cost (best & worst case) and *realistic* benefits (tangible & intangible) achievable *from this point forward*.**
      *   *Sufficient Answer:* Requires challenge: Sponsor's benefits must be discounted for delays/overruns. Finance must validate cost estimates. Intangibles (reputation, "finally delivering") require explicit justification (see Step 6).
      *   *If CLEARLY NO (Future Costs >> Benefits) -> RECOMMEND STOP.*
      *   *If MARGINAL/UNCERTAIN or CLEARLY YES -> Proceed to Step 6.*

  6.  **THE STRATEGIC PRECEDENT (Handle with Extreme Caution):**
      *   *Test:* **Is there *concrete evidence* that stopping will cause *specific, material harm* to *ongoing or imminent* negotiations/contracts/projects?** (e.g., critical vendor threatening exit from all city contracts, state explicitly warning future grants at risk). *Not* "general reputation".
      *   *Sufficient Answer:* Specific, documented threat or adverse action directly linked to stopping *this* project. Requires verification by City Attorney/Procurement.
      *   *If YES & Quantifiable -> Factor into Future Value (Step 5) as a cost of stopping.*
      *   *If Vague/Unsubstantiated ("We must show we finish") -> IGNORE for recommendation.*

  ---

  ### Recommendation & Exit Options
  Based on the flow:
  *   **STOP (Kill):** Step 4 Safeguards Fail OR Step 5 Future Value Clearly Negative. Salvage: Sell assets, terminate contracts (minimize penalties), document lessons. *Use when sunk costs dominate rationale, future spend is high value destruction.*
  *   **STOP (Mothball):** Genuine Premium (Step 3 YES) but Future Value (Step 5) currently negative/uncertain OR Rivalry threat temporarily dormant. Salvage: Secure site/assets, minimal maintenance, plan for reassessment. *Use when core assets are preserved but immediate completion isn't viable.*
  *   **RESTRUCTURE (Descope):** Future Value (Step 5) positive ONLY for a reduced scope. Salvage: Define a "Minimum Viable Product" achievable with remaining funds/time, freeze further scope creep. *Use when core objective is still achievable partially.*
  *   **RESTRUCTURE (Re-phase):** Future Value positive but funding insufficient now. Salvage: Secure current state, develop realistic phased plan/funding strategy. *Use with strong Genuine Premium.*
  *   **RESTRUCTURE (Handoff):** Specific external body (e.g., County, Non-profit) can complete/operate it more effectively. Salvage: Negotiate transfer terms, ensure city liability capped. *Rare, requires willing partner.*
  *   **CONTINUE (With Conditions):** Passes all tests, Future Value positive. *Requires:* Updated baseline (cost, schedule, scope), defined triggers for automatic re-review, specific oversight measures. *Never unconditional.*

  **Recommendation Format (1 Page):**
  1.  **Project:** Name, Sponsor, Total Spend, Remaining Est. Cost/Timeline.
  2.  **Structure:** Rivalry? (Y/N + Brief Why), Genuine Premium? (Y/N + Key Asset).
  3.  **Escalation Safeguards:** Restart Test (Pass/Fail), Decision Changer (Verified?).
  4.  **Future Value:** Remaining Cost Range, Realistic Benefits, Net Assessment.
  5.  **Strategic Precedent:** Material Risk? (Y/N + Evidence).
  6.  **Recommendation:** STOP (Kill/Mothball) / RESTRUCTURE (Descope/Re-phase/Handoff) / CONTINUE (With Conditions).
  7.  **Key Rationale:** <3 Bullets> (e.g., "No premium, fails restart test", "Genuine permit premium, future value positive if descoped").

  ---

  ### Case Applications

  1.  **4-Year Software Replacement (2x Budget, "70% Done"):**
      *   **Rivalry?** NO (Vendor is the only "other party").
      *   **Genuine Premium?** Test C: *Maybe*. Is data migrated & old system gone? If yes, premium exists (stranded data). If no, NO PREMIUM ("70% code" is replicable).
      *   **Escalation:** Restart Test: *Likely FAIL* (New proposal for 30% completion at 50%+ original budget? Unlikely). Decision Changer: Original sponsor likely still advocating -> Require INDEPENDENT tech audit of true progress.
      *   **Future Value:** Challenge vendor's "70%" & new timeline. Benefits likely eroded by delays. High risk future costs exceed value.
      *   **Strategic Precedent:** Unlikely concrete evidence.
      *   **Recommendation:** **STOP (Kill)** if NO Premium or Premium weak & Restart Fails. **STOP (Mothball)** if Premium strong & independent audit shows path to viable MVP. *Rarely Continue.* Exit: Terminate vendor, recover data, explore alternatives. *"We're not paying twice the budget for promises; the sunk costs bought nothing irreplaceable."*

  2.  **Downtown Streetscape (Missed State Deadline, Rules Changed):**
      *   **Rivalry?** YES (State grant clawback if deadline missed). **Step 2:** *Is penalty avoidable?* If deadline already missed -> UNAVOIDABLE (treat as sunk cost). If deadline imminent -> AVOIDABLE only by spending more city money *now* (proceed as "NO RIVAL" for escalation, rivalry adds cost).
      *   **Genuine Premium?** *Maybe* Physical (partial construction) or Regulatory (permits grandfathered?).
      *   **Escalation:** High risk due to sunk costs & pressure to "save the grant." Apply Restart Test: Would we fund a *city-funded-only* project for the *remaining scope* at *full city cost* now? Decision Changer: Verify cost estimates independently.
      *   **Future Value:** Quantify FULL city cost now (no grant). Benefits of partial/completed streetscape at full city cost? State rule change may reduce benefits.
      *   **Strategic Precedent:** State relationship risk? Only if concrete evidence (e.g., state letter).
      *   **Recommendation:** **STOP (Kill)** if Future Value negative even with Premium OR if penalty unavoidable and future value low. **RESTRUCTURE (Descope)** to essential elements achievable with remaining city funds if Future Value positive for MVP. *"The state grant is gone/lost; spending more city money must stand on its own merits, which are now marginal."*

  3.  **Neighborhood Library (30% Built, Budget Low, Council Chair's District):**
      *   **Rivalry?** NO.
      *   **Genuine Premium?** Test A: YES (Physical structure partially built - foundation, framing? Significantly reduces future rebuild cost).
      *   **Escalation:** Restart Test: *Likely PASS* (A partially built library shell delivering community value later is a plausible *new* project, even at higher cost than starting from scratch? Often YES due to site prep/permits being done). Decision Changer: Chair's advocacy is conflict -> Require independent verification (Engineer on structural status/cost, Finance on budget reality).
      *   **Future Value:** Remaining cost HIGH (likely exceeds budget) to complete a functional library? Benefits (long-promised branch) are real but must be weighed against high completion cost. Net assessment likely NEGATIVE or HIGHLY UNCERTAIN.
      *   **Strategic Precedent:** "Breaking promise" is political, but NOT concrete evidence of material harm to other projects (Step 6 test fails).
      *   **Recommendation:** **STOP (Mothball)**. Genuine Premium exists (physical structure), but Future Value is highly uncertain/negative due to funding gap. Salvage: Secure the shell (weatherproofing), minimal security/maintenance. Document need for future funding strategy. **DO NOT CONTINUE or spend remaining budget on partial unusable work.** *"The sunk costs created a real asset, but completing a functional library now is unaffordable. Mothballing preserves the investment for a viable future effort when funding exists."* (This is the politically hard but necessary call).

  ---

  ### The "Fourth Shape": The Genuine Black Hole
  *   **Description:** Projects where **Genuine Premium exists (Step 3 YES)** but **Future Value (Step 5) is marginally negative or impossible to quantify**, and **Strategic Precedent risk (Step 6) is claimed but unquantifiable/unverifiable** (e.g., Critical national security software, unique infrastructure with no alternative, where stopping might trigger unprovable but catastrophic reputational damage with key partners).
  *   **Why the Procedure Can't Settle It:** The calculus hinges entirely on unprovable assertions about catastrophic risk ("If we don't finish this cybersecurity system, we *will* be hacked and lose everything") versus continuing to pour money into a failing project. The Premium makes stopping painful, but continuing is also painful and value-less on paper.
  *   **Handling:** Flag as "HIGH RISK; DECISION REQUIRES COUNCIL JUDGMENT UNDER EXTREME UNCERTAINTY." Present the known costs, the unverifiable risks of stopping, and the total potential exposure. Recommendation might be "CONTINUE (With Extreme Oversight & Hard Cap)" or "STOP (Mothball)" based on risk tolerance. This is the exception, not the rule.

  This procedure forces explicit consideration of escalation drivers early, provides concrete tests to pierce sponsor optimism, offers actionable exit paths, and delivers the tough message when needed (like the Library). It runs within your constraints.
