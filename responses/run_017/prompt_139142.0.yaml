prompt: |-
  My old supervisor died in March and I have to give the memorial talk at the department gathering — about six minutes, spoken, half the room her colleagues and ex-students, half her sisters and kids and neighbours who never read a word of what she wrote.

  Her thing, which she went on about for thirty years, was that the standard picture puts uptake in the wrong place: not a felicity condition hanging outside the act but half of it. On her view a promise, a bet, an apology, even a thank-you, is co-authored — the person it's addressed to has to answer, and their answer is partly what makes it the act it is. She had a name for the ones that don't get an answer: utterances like a promise made to someone who can't hear it anymore. She called them orphan performatives — perfectly formed, apparently doing something, and in fact unfinished.

  So I'm stuck, and not just rhetorically. Her old students will hear every "we'll finish your book" and "the seminar will go on" as me standing up in her memory and producing precisely the half-an-act she spent her career saying wasn't one. Her sisters, reasonably, need what I say to actually do something, not just describe somebody impressive. I think what's left is that the living can still answer each other, so whatever gets done has to get done sideways, among us, and the part aimed at her has to stay openly unfinished rather than dressed up as complete — but I'm not sure that's right, or that it's enough for the people in the room who aren't philosophers. Write it, and tell me if you think I've got the shape wrong. Don't have me promise her anything, and don't turn it into a tour of speech act theory.
reasoning: |-
  Okay, let me unpack this deeply personal and complex request. The user is preparing a memorial talk for their late supervisor - a philosopher who specialized in speech act theory with her key concept being "orphan performatives" (performative utterances that remain incomplete without audience uptake). 

  The core tension here is fascinating: honoring a theorist who argued that meaningful acts require co-creation, while speaking to an audience split between academic peers who'll recognize any theoretical misstep and family members needing genuine comfort. The user specifically rejects hollow promises like "we'll finish your book" because those would ironically demonstrate the very orphaned performatives their supervisor criticized.

  Hmm... what's really being asked for? Beyond just words to say, this seems like a request for: how to perform a speech act that acknowledges its own incompleteness while still creating communal meaning. The family needs closure, colleagues need intellectual integrity, and the user needs to avoid hypocrisy while grieving. Tricky balance.

  The supervisor's theory actually gives us the solution framework: instead of pretending to complete acts directed at the deceased (which would create orphans), we focus on acts among the living that keep her ideas alive. The memorial becomes a space for mutual recognition rather than unilateral declarations.

  I notice the user resists "promising her anything" - wise, since promises to the dead are definitionally orphaned. But we can model the co-creation she valued by making the audience active participants. The talk should feel like planting seeds rather than delivering finished products. 

  For structure: opening should name the paradox immediately (how do we speak meaningfully about someone who taught us speaking requires reciprocity?), middle section shows her theory in action through shared memories, and the closing transforms absence into ongoing collaboration. The "unfinished" quality becomes the point rather than a flaw.

  Key pitfalls to avoid: theoretical jargon (for the family's sake), hollow commitments (for the colleagues' sake), and any pretense that words alone can resolve grief. The power should come from naming the incompleteness openly - that vulnerability is what makes it authentic for all audiences.

  The emotional calibration matters most. Tone should be: intellectually precise but not clinical, tender but not maudlin, honoring the theory by practicing it. When we say "she taught us that meaning is co-created," we demonstrate it by turning to the listeners: your memories, your future actions will complete this thought.

  Ah - and the ending must avoid closure. Instead of "we'll continue her work," maybe: "Her questions remain alive wherever we discuss them." That keeps it ongoing, collective, and honors the core theory. The "orphan" is acknowledged but transformed through community care.
answer: |-
  Here’s a draft that honors her theory while grounding it in shared humanity. I’ve structured it to hold the tension you described—open-ended for her, actively connecting for the living—without jargon or false promises.  

  ---

  **(Start gently, grounding the room)**  

  We’re here because we loved her. We loved her brilliance, her stubbornness, the way she’d lean forward when an idea excited her, eyes sharp as if she could see the thought taking shape in the air between you. Some of us knew her as a scholar, some as a sister, an aunt, a neighbor who’d wave from her porch. And all of us knew someone who believed, fiercely, that words only truly *do* something when they’re answered.  

  She spent thirty years arguing that meaning isn’t made alone. A promise isn’t finished until it’s heard, trusted, held between people. A ‘thank you’ waits for the nod, the smile, the ‘you’re welcome’ that completes it. An apology needs the breath of forgiveness to land. Without that… it’s just words in empty air. She called those ‘orphans’ – acts that look whole but are stranded, waiting for a reply that won’t come.  

  **(Pivot to the tension in the room)**  

  Which leaves me in an impossible spot today. Her colleagues, her students… you’re already wincing. If I stand here and say, *“We promise to finish her book”* or *“We’ll carry on her seminar,”* you’ll hear exactly what she’d call out: an orphan. A performative dressed up like it’s working, but spoken into a silence it can’t fill. Because *she* isn’t here to answer.  

  And yet… her sisters, her family, her neighbors… you need more than a description of someone clever. You need to feel something *happen* here. Something real.  

  **(The shift: Answering *each other*, naming the unfinished)**  

  So here’s what I think she’d insist on: we can’t speak *for* her anymore. But we can speak *to each other*, and in doing that, we speak *of* her. We can answer *together*.  

  When we tell a story about her laughing till she snorted at a terrible joke… and you nod because you remember that snort? *That’s* an act completed.  
  When I mention how she’d bring soup to a sick neighbor… and someone here whispers *‘she brought me that, too’*? *That’s* meaning made between us.  
  When we sit in the quiet later and feel the gap she left… and someone reaches for your hand? *That’s* not an orphan. That’s an answer.  

  **(Acknowledge the open space – without false completion)**  

  What we owe *her*… isn’t a promise we make alone. It’s the honesty of leaving space for the reply that can’t come. Our words to *her* now are like stones dropped into a deep well. We listen for the splash, but it’s the listening together—holding that silence—that matters. They’re unfinished. They’re orphans. And that’s okay. That’s truthful.  

  **(Close by activating the living community)**  

  Her real work wasn't just ideas on a page. It was the insistence that we *need* each other to make things real: promises, apologies, thanks, even grief. So today, let’s do what she spent her life studying: **Answer each other.**  

  Tell the story she loved. Ask her sister about the stubborn kid she once was. Pass the tissue. Laugh at the ridiculous thing she did that time. Hold the silence when it comes.  

  *That’s* how we keep her here. Not by finishing sentences for her, but by starting conversations with each other. By making sure nothing in this room today is an orphan.  

  **(End with simple warmth)**  

  We’ll miss her. Terribly. But look around. She taught us how to be here for each other. Let’s do that now.  

  ---

  **Why this structure works:**  

  1.  **Honors her theory implicitly:** The core idea ("meaning is co-created") drives the *structure* and *purpose* of the talk, not just the content. It avoids making orphaned promises *to her* while actively modeling co-creation *among the living*.  
  2.  **Names the dilemma directly:** Acknowledges the awkwardness ("you're already wincing") for the academics and validates the family's need ("you need to feel something happen") upfront. This builds trust.  
  3.  **Shifts agency to the audience:** The "call to action" isn't a future promise ("we will..."), but a present invitation ("Tell the story... Ask her sister... Pass the tissue..."). This *does* something *now*, in the room, fulfilling the family's need for tangible meaning.  
  4.  **Leaves space openly:** Explicitly states that words *to her* are orphaned ("stones dropped into a deep well... unfinished... orphans. And that’s okay"). This satisfies the academics by respecting her theory and avoids hypocrisy.  
  5.  **Uses concrete, shared imagery:** "Laughing till she snorted," "soup for a sick neighbor," "stones in a well" – resonate across both groups without requiring theoretical knowledge. The academic point is made through relatable metaphor.  
  6.  **Focuses on connection, not legacy:** The "work" that continues isn't her books or seminars (avoiding false promises), but the fundamental human act of *answering each other*. This is accessible to everyone.  

  **You were right:** The key *is* directing the "doing" sideways among the living and openly acknowledging the incompleteness of what's aimed at her. This draft leans into that shape. It trusts the act of gathering itself – the shared stories, tears, and quiet – to be the real "performance" that honors her, co-created by everyone present.  

  Would she critique it? Probably. But she’d appreciate the attempt not to orphan it.
