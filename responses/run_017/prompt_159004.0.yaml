prompt: |-
  I've got an hour next week with a mixed seminar — first-year philosophers plus second-year computer scientists — and I need to get one thing across: that 'this system implements computation C' isn't a fact about the system on its own but something we attribute to it, so 'which computations matter morally?' can't be answered by just pointing at the computation. Don't write the session for me; tell me how to run it.

  What I'd like them to leave holding is a distinction I've been messing about with and can't quite get straight myself: attribution-robustness versus attribution-by-convenience. Roughly, an attribution of a computation to a system is morally load-bearing only if it survives (a) coarsening the description — it isn't an artefact of how finely I chose to carve things up — and (b) perturbing the system's states and inputs, i.e. it tracks counterfactuals the system really supports rather than just the run I happened to watch. An attribution that's merely convenient for me, or that matches what the programmer intended, isn't. That's the bit I want them to feel the force of.

  So: what order do the bits have to come in, given that? My carrying example is a little evolved virtual creature in a simulation, twelve-node nervous system, steers reliably away from a noxious patch, and its failure mode looks a bit like relief when it escapes — crucially it has no programmer's spec to appeal to and nothing like a body we already have intuitions about. Tell me what else that example has to have, and what it has to avoid, if it's going to carry the whole hour.

  Misconceptions I'm expecting: that the physics or the runtime settles it and descriptions are just bookkeeping; that once they see several computations fit one run they'll conclude computation is irrelevant tout court; that the computation which matters is the one someone intended the system to be running; and the slide from avoidance behaviour to so it hurts. Where in the sequence does each have to be headed off, and which one will actually be hardest to shift?

  Give me one question for the end that shows me they've got the distinction rather than just got unsettled — I was thinking of handing them teh second system and asking what would have to be true of it to change their answer, but say if that's the right test. And what should I openly refuse to get into at this level, and say out loud that I'm refusing it?
reasoning: |-
  Okay, let me start by unpacking the user's request. They need to run a seminar for first-year philosophers and second-year computer scientists, aiming to convey that attributing a computation to a system isn't intrinsic but something we assign. The key distinction they want to emphasize is between attribution-robustness and attribution-by-convenience. 

  The user's example involves a virtual creature with a simple nervous system showing avoidance behavior that resembles relief. They want to avoid misconceptions like physicalism, multiple computations leading to irrelevance, intentionalism, and anthropomorphism. 

  First, I should consider the audience. Philosophers might lean towards abstract concepts, while computer scientists might focus on implementation. The challenge is bridging these perspectives. The session needs interactive elements to engage both groups. 

  The core structure should start by presenting the creature to spark curiosity. Then, introducing alternative computational descriptions to challenge the initial assumption. Here, it's crucial to prevent the misconception that multiple valid descriptions make computation irrelevant. Emphasizing that all descriptions are correct but context-dependent can help. 

  Next, varying the granularity and inputs to test robustness. Using a "zoom level" analogy for coarsening and hypothetical inputs for perturbations. This addresses counterfactual support. Students might struggle with the idea that robustness determines moral relevance, so reinforcing that convenience-based attributions lack moral weight is key. 

  The hardest misconception is likely intentionalism, especially for CS students used to programming specs. Stressing that the virtual creature lacks a designer's intent forces them to evaluate the system's behavior independently. 

  The end question should test their grasp of the distinction. Asking what changes in a second system would alter moral judgments checks if they focus on robustness features. Openly avoiding discussions on consciousness or moral weight prevents tangents. 

  I need to ensure the example avoids ambiguity in the creature's behavior. Clear failure modes and observable "relief" are essential. Also, preempting anthropomorphism by clarifying that resemblance isn't equivalence. 

  Timing each segment is vital. Allotting specific minutes to each phase keeps the session on track. The concluding question should tie robustness to moral relevance, ensuring students apply the distinction rather than just recognizing it.
answer: |-
  Here’s a battle-tested sequence to embed the distinction, structured to preempt misconceptions and make "attribution-robustness" viscerally sticky. The virtual creature ("Critter") is perfect — lean into it hard.

  ### Core Sequence (55 mins + 5-min buffer)
  1.  **Hook with Critter’s Behavior (5 mins):**
      *   Show Critter fleeing a noxious patch + "relief-like" failure mode (e.g., chaotic oscillation settling into stable motion). **Crucial:** Present *only observable behavior* (inputs: patch location/size; outputs: movement vectors).
      *   **Question:** "What *happened* here? Describe its 'experience'." (Let anthropomorphism flow; note it).
      *   **Goal:** Establish intuitive moral tug ("It suffered, then felt relief?").

  2.  **The Computation Attribution Move (10 mins):**
      *   "We explain behavior by saying Critter *implements a computation*. What computation *C* is it running?" Brainstorm simple descriptions (e.g., "Noxious Patch Avoider + Relief Feeler").
      *   **Plant Trap:** Let someone suggest it’s "just physics" or "whatever the code/runtime does".
      *   **Reveal:** Show Critter’s *actual* minimal neural net diagram/states. Ask: "Does *this* settle *C*?" (No – it’s just mechanism).

  3.  **Multiple Valid *C*'s – The Attribution Explosion (15 mins):**
      *   Present 3-4 *formally valid* computational descriptions of the *same run*:
          *   *C1:* Finite State Machine (coarse: States = {SEEKING, FLEEING, RESTING})
          *   *C2:* Continuous Attractor Network (finer-grained dynamics)
          *   *C3:* Linear Threshold Circuit (gate-level)
          *   *C4:* "Tropism Simulator" (abstracting away internals, describing *only* input-output map).
      *   **Activity:** "Which *C* explains the 'relief'? Do all?"
      *   **Preempt Misconception #1:** Explicitly counter "If many *C* fit, computation is irrelevant!" → **Pivot:** "No! It means *which C we pick matters ethically*. Not all attributions are equal for morality."

  4.  **Introduce the Filter: Robustness vs. Convenience (15 mins):**
      *   **Test 1: Coarsening (Granularity):**
          *   Break down *C1* (FSM): What if we define states as {MOVING, NOT MOVING}? Does "relief" still map cleanly? (Likely not). Contrast with *C2* (Attractor) – does "settling into basin" survive coarse-graining better?
          *   **Point:** Convenient labels (FLEEING/RESTING) may vanish if we describe *differently*. Robust *C* retains moral features under description shift.
      *   **Test 2: Perturbations (Counterfactuals):**
          *   Ask: "What if the noxious patch was *here* instead? Or shaped differently? Or Critter started *here*?" Run sim snippets showing variations.
          *   For each *C*: Does it *predict* the failure mode/"relief" *robustly* across these? Or only for the exact original run?
          *   **Point:** *C1* (FSM) might break if perturbations create unmodeled states. *C2* (Attractor) likely handles smooth variations. *C4* (Tropism) ignores internals – always "fits" but predicts nothing new.
      *   **Label the Distinction:** "Attribution-*Robust*" (*C2?*) survives coarsening *and* perturbations. "Attribution-by-Convenience" (*C1, C4?*) is brittle or just fits the data we have.

  5.  **Apply to the Moral Question (10 mins):**
      *   Return to Hook: "Does Critter 'feel relief'?" Reframe: "Does the *computation we robustly attribute* support *attributing 'relief'*?"
      *   **Crush Intentionalism:** "Remember, Critter has no programmer! The 'intended' *C* is undefined. We *must* look at the system + counterfactuals."
      *   **Block the Slide:** "Avoidance behavior ≠ pain. 'Relief-like' dynamics ≠ relief. Robust computation *C* is the bridge (or not!). Does *this specific robust C* have morally salient properties?"

  ### Your Critter Example – What It MUST Have/Avoid
  *   **MUST HAVE:**
      *   **Observable "Failure Mode":** The "relief" must be a *clear, distinct, measurable output pattern* contingent on preceding "negative" input (escape), not just stopping.
      *   **Parameterized Inputs/Environment:** Ability to smoothly vary stimulus location, size, timing to test counterfactuals.
      *   **Multiple Plausible Computational Formalisms:** Its NN must be simply describable at different abstraction levels (FSM, dynamical system, circuit).
      *   **No "Body" Analog:** Avoid anything resembling biology (e.g., don't call nodes "pain receptors").
  *   **MUST AVOID:**
      *   **Ambiguity in "Relief":** Define it operationally (e.g., "oscillation damping time < threshold post-escape").
      *   **Hidden Homunculi:** Ensure no node/process is trivially anthropomorphized (e.g., no "reward node").
      *   **Physicalism Trap:** Don't imply the silicon/physics *is* the suffering. Keep focus on *C*.

  ### Hardest Misconception to Shift: Intentionalism
  *   **Where to Head it Off:** Explicitly in Step 5, but plant seeds in Step 2 ("no programmer!") and Step 4 (show robustness works *without* intent).
  *   **Why Hardest:** CS students are trained on specification/design; Philosophers on mental states. Both anchor on agency/designer. **Tactic:** Hammer "The system *does* X across variations. Does it matter *why* it does it, if it robustly does it?"

  ### The Perfect End Question (5 mins)
  > **"Here's a *second* virtual critter (Critter-B). It shows identical avoidance and 'relief-like' behavior to Critter-A in all tests I've run so far. I tell you Critter-B's computation is *robustly* an implementation of [Insert a *clearly trivial/non-moral* computation, e.g., 'a damped harmonic oscillator' or 'a basic thermostat control loop']. Does this change your view about whether it 'feels relief' compared to Critter-A? *Why*, specifically in terms of attribution?"**

  *   **Why it Works:** Tests if they grasp that the *robustly attributed C itself* carries the moral weight, not just the behavior. A "yes" (change) suggests they get that the moral salience depends on *which robust C* is attributed. A "no" might indicate they are stuck on behaviorism or intentionalism. Forces appeal to the *features of C*.

  ### What to OPENLY Refuse (State Early & Repeat)
  *   **"We are NOT settling:**
      1.  Whether *any* computation *can* ground moral status (panpsychism, etc.),
      2.  What the necessary/sufficient conditions for moral status *are*,
      3.  Whether consciousness is required for 'relief' to matter.
      *Today is ONLY about: If computation matters morally, it can't be just any attribution – it must be robust, not convenient."*

  **Why this works:** You leverage CS students' formalism to ground the philosopher's attribution problem. The Critter makes it concrete, non-biological, and intent-free. The sequence forces them through the explosion of possible *C*s, then gives them tools (*coarsening*, *perturbations*) to filter them, explicitly linking robustness to moral relevance. Ending with Critter-B tests if they internalized the filter.
