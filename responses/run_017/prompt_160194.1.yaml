prompt: |-
  Something happened last week that I can't stop turning over, and I want help taking it apart properly. I'm the senior postdoc in a small biology lab and I run our shared Slack. A rotation student put a figure into a draft; I hadn't seen her raw files, and in the lab channel I wrote something close to: "I'd want to look at the raw files before any of that goes in the paper." She's filed a complaint saying that I called her a fabricator — that I said she made her data up. In the meeting I said, come on, don't put words in my mouth, I never said that. The person running the process replied with something like "that's not a defense, we go by how a reasonable reader in the lab would have taken it, not by what you had in your head," and said it as if that settled it.

  So I want a menu of the precise things "don't put words in my mouth" could actually be claiming, from the trivial to the strong, and for each one whether it's a platitude, a substantive and defensible thesis, or just false — and, most importantly for me, which of them would actually do the work I was trying to make it do. Part of what I'm unsure about is whether her "reasonable reader" line is even a rival theory of meaning or just a policy about who eats the cost of a misunderstanding dressed up as one. And I keep circling the Grice-style distinction between what a sentence says and what a speaker conveys without saying: is the distinction doing any real work here, or does it collapse as soon as you ask what "says" means for a one-line Slack message?

  Three wrinkles I'd like folded in, because they're where my case actually lives:

  1. Mixed audience. There was an external collaborator in that channel who had none of the backstory. If the complaint is about what the "reasonable reader" took it to mean — which reader? Does a meaning get to be audience-relative in a way that matters for blame?
  2. My own made-up category. I've been sorting what people convey into: what the sentence says on any way of disambiguating it; what a competent reader infers and I'd cheerfully confirm; and what a competent reader infers but which I set up so I could walk it back. I've been calling the third sort "deniable implicature," and I suspect the standard picture — where conveying something involves intending your hearer to recognise that you intend them to think it — doesn't even count those as cases of conveying, since the whole point is that I can deny the intention. Is the category real, and does it matter for how much blame I deserve?
  3. Endorsement by omission. Earlier in the same thread someone else flagged a weird outlier in her data, and I replied without saying "no, that's fine." How much of what I conveyed came from what I conspicuously didn't write?

  Give me the readings as a table with these columns: reading (one line) | the precise claim it makes | verdict (platitude / substantive and defensible / contested / false) | whether it would actually get me off in my case | confidence (high, medium, or low, plus one line on why) | the single thing that would most undermine this row. Then a short second table for the three wrinkles with columns: wrinkle | best reading of the slogan applied to it | does it help me | confidence. For everything, say how confident you are, and at the end single out the one thing you're least sure of. Don't bother with citations or reading lists — I want the disambiguation, not the bibliography.
reasoning: |-
  Okay, the user is a senior postdoc in a biology lab dealing with a serious complaint from a rotation student. They want to dissect the phrase "don't put words in my mouth" in the context of a Slack message that was interpreted as accusing the student of fabrication. The user is grappling with linguistic nuances, audience interpretation, and institutional policies. 

  First, I need to unpack the core issue: the gap between the user's intent ("let's review raw data") and the student's interpretation ("you called me a fabricator"). The complaint process invoked "reasonable reader" standard, which the user finds frustrating. They're questioning whether this standard is a valid theory of meaning or just a policy tool shifting blame to the speaker.

  The user's three wrinkles add complexity: 
  1) Mixed audience with an external collaborator - does interpretation change based on who reads it? 
  2) Their concept of "deniable implicature" - where they imply something but can plausibly deny intent. Is this real and does it affect culpability? 
  3) Endorsement by omission - whether prior silence on another issue contributed to the misinterpretation.

  I notice the user thinks very analytically, using linguistic philosophy frameworks (Grice) but needs practical application to their case. Underneath, they seem hurt by the accusation and institutional response, seeking validation that their intent matters while also preparing defenses. The phrase "get me off" suggests they feel legally vulnerable.

  The challenge is balancing philosophical precision with real-world consequences. While Gricean distinctions are useful, the complaint process likely prioritizes impact over intent. The user's "deniable implicature" concept feels like self-justification - institutions rarely accept "I didn't mean it that way" when harm occurs.

  For the tables, I'll structure:
  - First table dissecting "don't put words in my mouth" claims from literal to contextual
  - Second table addressing each wrinkle with the "reasonable reader" standard
  Key is showing which defenses might work (e.g., emphasizing Slack's brevity culture) vs. weak ones (denying responsibility for interpretation)

  The toughest part is wrinkle #2 - their "deniable implicature" idea. While technically coherent, it's ethically shaky in research integrity contexts. I'll need to gently show why institutions reject such maneuvers without dismissing their analytical framework.
answer: |-
  Here’s a disambiguation of "don’t put words in my mouth" tailored to your case, followed by analysis of the wrinkles. Confidence ratings reflect linguistic/pragmatic plausibility and institutional realism.

  ### Table 1: Readings of "Don’t put words in my mouth"
  | Reading (one line) | Precise claim | Verdict | Would it get you off? | Confidence | What undermines this |
  |-------------------|---------------|---------|------------------------|------------|----------------------|
  | Literal denial | I never uttered the string "you fabricated data." | Platitude | No (irrelevant to the complaint) | High (trivially true) | Complaint hinges on implication, not literal words. |
  | Intentionalist defense | My conscious intent was solely to request raw files, not to accuse. | Substantive but contested | Unlikely (institutions prioritize impact over intent) | Medium | "Reasonable reader" standard explicitly rejects intent as primary. |
  | Implicature rejection | You incorrectly inferred an accusation I did not imply (Gricean "said" vs. "implicated"). | Substantive and defensible | Possibly (if you prove the inference was unreasonable) | Medium-High | If context (e.g., prior skepticism) makes accusation a natural inference. |
  | Authority misuse | You’re exploiting the complaint process to silence critique. | Contested | No (distracts from the core issue) | Low | Framed as victim-blaming; ignores power dynamics. |
  | Contextual incompleteness | My message relied on lab norms (e.g., routine data checks) a "reasonable reader" should know. | Substantive and defensible | Yes (if norms are documented/consistent) | Medium | If external collaborator’s presence made norms irrelevant or if norms aren’t universal. |
  | Speaker’s meaning sovereignty | Only I decide what my words meant. | False | No | High | Contradicts basic pragmatics; meaning is co-created. |

  **Key takeaway**: Your best defensible claim is **#3 (Implicature rejection)** combined with **#5 (Contextual incompleteness)**. Argue that in your lab’s context, requesting raw files is routine and non-accusatory, making the fraud inference unreasonable.

  ---

  ### Table 2: Applying "Reasonable Reader" to Your Wrinkles
  | Wrinkle | Best reading of "reasonable reader" applied | Does it help you? | Confidence |
  |---------|--------------------------------------------|-------------------|------------|
  | 1. Mixed audience | The reader *most likely to misunderstand* (here, the external collaborator lacking context) sets the standard for "reasonableness." | No (harm is judged by most vulnerable interpretation) | Medium-High (Institutions err on caution) |
  | 2. "Deniable implicature" | If a competent reader *would* infer the accusation (even if you intended deniability), it counts as conveyed. "Reasonable reader" ignores your mental reservations. | No (institutional focus is on effect, not your intent) | High (Deniability is strategically risky; labs prioritize transparency) |
  | 3. Endorsement by omission | Silence on the outlier could signal tacit agreement to a "reasonable reader," amplifying the later message as part of a pattern of skepticism. | No (patterns of behavior strengthen the complaint) | Medium (Depends on frequency/context of omissions) |

  ---

  ### Least Sure Of
  **Wrinkle #2 ("Deniable implicature")**. While I’m highly confident institutions reject *strategic* deniability (low confidence it helps you), I’m less sure whether *unintentional* deniable implicatures (where you genuinely didn’t foresee the inference) would be treated differently. Your case likely falls into the intentional/strategic category because you’ve theorized the mechanism—institutions may see this as admission of awareness.

  ### Strategic Advice
  1. **Drop "don’t put words in my mouth"**—it sounds defensive and ignores institutional norms.  
  2. **Focus on lab context**: Gather evidence (e.g., past Slack messages) showing "I’d want raw files" is routine phrasing for verification, not accusation.  
  3. **Address the omission**: Proactively clarify *now* that your earlier silence didn’t imply concern ("I saw the outlier but assumed it was being handled").  
  4. **Apologize for misunderstanding**: "I now see how my words could be read that way without our lab’s context; I’ll ensure clarity in future." This accepts the "reasonable reader" standard without admitting fault.  

  Your core tension: Pragmatics says meaning is co-created; institutions assign responsibility asymmetrically to senior members. Your path forward is proving the inference was *unreasonable* given lab culture—not litigating linguistic theory.
