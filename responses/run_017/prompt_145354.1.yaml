prompt: |-
  I adapt historical material for the screen, and there is a distinction that everyone I work with appears to observe and that none of us can articulate. I would like to know whether it has an established name, and if it does not, I would like a term and a definition precise enough to be argued with. I am not asking for sources or further reading — I want the shape of the thing, its boundaries, and an account of what would show that I have packed two separate phenomena together or that there is nothing there at all.

  Three instances.

  A biopic of a twentieth-century statesman ends with a scene for which there is no record and no witness: he is alone with his wife and says aloud that he traded his children for his career. The line is invented. Reviewers, and people who knew him, treated it as an intrusion, and I agreed with them. Yet the same film contains an invented aide who says of him, in a crowded room, that he traded his children for his career, and that scene drew no objection whatever. Both scenes place the same invented content in the film. Audiences believe neither of them, since audiences know what a biopic is. The difference seems to be only that in the first the dead man is made to say it in his own voice.

  A drama about an enslaved woman whose own words have almost entirely not survived has her read, in voiceover, letters she never wrote. Here the same device — putting unsaid first-personal speech into a real person's mouth — reads not as an intrusion but as a kind of restitution, and critics who would object to the statesman's scene praise this one.

  A production takes a public speech the subject really gave, quotes it accurately, and restages it as a private confession to one listener. It reads as more invasive than plain invention, despite being, word for word, true.

  What I take this not to be: deception, since no one acquires a false belief; damage to reputation, since the invented speech is often flattering; a breach of any contract implied by the words based on a true story; and the general question of whether the dead can be wronged at all — assume for the sake of the argument that something can be owed in respect of them, and tell me which specific thing this is.

  My own attempt: call it voice-conscription, the wrong of enlisting a real person's first-personal voice to carry a reading of their life that they did not author, and distinguish it from interpretive preemption, where the wrong would be that a vivid dramatization crowds out the person's own surviving self-interpretation and leaves no room for it to be heard. I cannot tell which of these is doing the work, or whether both are.

  So: is there an established concept for this, and if the nearest candidates fit only imperfectly, where exactly does each one diverge from what I have described? If nothing established fits, give me a name, a definition, and boundary cases. Tell me which variable — authorship of self-interpretation, intimacy, preemption, or something I have not separated out — the intuition actually tracks, and what would settle that. Tell me under what conditions it vanishes: very remote subjects, explicitly labelled fiction, flattering content, subjects who themselves fictionalized the people around them, or the older historiographical practice of a historian composing the speeches he attributes to his protagonists. And tell me why the restitution case inverts it: whether the difference is who controls the archive, whether the silence was itself an injustice, or whether the device is simply a different device there and my description has conflated them.
reasoning: |-
  Hmm, the user is asking about a nuanced ethical distinction in historical adaptation for screen. They've clearly observed a pattern across three cases where putting words in historical figures' mouths feels ethically different depending on context. I need to unpack this carefully.

  Looking at their examples: The invented private confession feels wrong while the same sentiment voiced by a fictional character doesn't. Actual words moved to an intimate setting feel worse than pure invention. But invented first-person narration for someone whose voice was erased feels restorative. This is fascinating.

  They've already ruled out several red herrings: It's not about factual deception (audiences know it's fiction), not about reputation damage (can be flattering), not about contractual "based on true story" claims. They want the specific ethical violation when we make real people "speak" words they never said.

  Their proposed terms - "voice-conscription" vs "interpretive preemption" - show they've deeply analyzed this. Voice-conscription focuses on hijacking the person's voice, while interpretive preemption is about drowning out their authentic self. But which is primary?

  I notice intimacy matters in their examples. The statesman's private bedroom scene feels more invasive than the public aide's comment. Moving real public words to a confessional setting amplifies the violation. So proximity matters - we feel we're witnessing something that shouldn't be witnessed.

  The restitution case reveals another dimension: when the historical person was systematically silenced, inventing their voice can feel ethically necessary. This suggests the violation relates to power dynamics - are we amplifying the marginalized or speaking over the autonomous?

  The user asks great boundary questions: When does this vanish? Probably when subjects are very remote (ancient figures), when fiction is explicit, or when dealing with self-mythologizers. The historian composing speeches example is particularly telling - that tradition saw it as reconstruction, not violation.

  For the core concept, "voice-conscription" feels right but needs refining. It's specifically about: (1) First-person attribution (2) To identifiable historical figures (3) In contexts implying psychological intimacy (4) Without their consent framework. The violation is making them perform our interpretation.

  To distinguish from interpretive preemption: We could have voice-conscription without preemption (if no authentic voice survives) and preemption without voice-conscription (using real quotes manipulatively). But they often overlap.

  The key variable seems to be intimacy + attribution. Making someone "speak" intimately crosses a line because we're fabricating interiority. The restitution case works because it's restoring voice to the voiceless, not overriding existing voice.

  For boundary tests: If we took a flattering invented line and put it in the statesman's private mouth, it would still feel wrong - proving it's not about content. If we used the enslaved woman's actual surviving fragment as voiceover, that would feel different than total invention. The violation scales with how much we're overriding known self-representation.

  Ultimately this is about ethical imagination: treating historical figures as subjects rather than objects. Voice-conscription objectifies them by forcing our narrative into their mouths. The restitution case subjectifies by giving voice where it was stolen. Same device, opposite ethical weight based on power context.
answer: |-
  Your observation captures a distinct ethical-aesthetic phenomenon without an established single term. The core violation is **Attributed Interiority Fabrication (AIF)**, defined as:  

  > *The act of creating and attributing first-person, psychologically intimate speech or thought to a specific historical figure, thereby imposing an unauthorized interpretation of their inner life that claims privileged access to their subjectivity.*  

  ### Why AIF Fits Your Cases:  
  1. **The Statesman's Private Confession**: Violates AIF by fabricating intimate self-diagnosis ("I traded my children..."). The invented aide’s identical line lacks attribution to the subject’s *own voice*, avoiding the violation.  
  2. **The Enslaved Woman’s Voiceover**: Inverts AIF because the fabrication *counteracts historical erasure*. The "restitution" context negates the "imposition" element—here, AIF serves as *corrective ventriloquism* for those systematically denied self-documentation.  
  3. **Public Speech as Private Confession**: Heightened AIF violation. Though words are authentic, relocating them to an intimate setting *fabricates interior context*, implying access to private self-revelation.  

  ### Boundary Tests & Key Variables:  
  - **Authorship vs. Intimacy**: AIF tracks *imputed intimacy*, not just interpretation. The aide’s line interprets the statesman but doesn’t fake *his self-disclosure*.  
  - **Preemption**: A secondary effect. AIF enables interpretive preemption but isn’t identical. Preemption occurs when dramatizations drown authentic voice (e.g., distorting a figure’s documented letters). AIF *creates* the voice it preempts.  
  - **What Neutralizes AIF**:  
    - **Temporal Distance**: No violation with ancient figures (e.g., scripting dialogue for Caesar). AIF requires cultural proximity to the subject’s documented persona.  
    - **Explicit Fiction Labels**: "Based on" disclaims historical fidelity but doesn’t resolve AIF; audiences still object to intimate fabrications (e.g., *The Crown* controversies).  
    - **Flattery**: Irrelevant. A fabricated private monologue where Napoleon says "I regret my ambition" still violates AIF—it’s the *false interiority*, not the sentiment.  
    - **Subject’s Own Fictionalizing**: If a figure mythologized themselves (e.g., Augustus), AIF weakens; their self-narrative invites reinterpretation.  
    - **Historiographical Speechwriting**: Thucydides composing speeches diverges fundamentally: he claims *rhetorical plausibility*, not subjective truth, and lacks the *intimate* framing of film.  

  ### Why Restitution Inverts AIF:  
  The enslaved woman case exploits identical formal mechanics but reverses the ethics because:  
  1. **Archival Injustice**: Her silence was *enforced*, making AIF a counter-fabrication against oppression.  
  2. **Absence of Competing Voice**: With no self-interpretation to preempt, AIF constructs rather than overrides.  
  3. **Intent as Restoration**: The device functions as *reparative imagination*, not interpretive imposition.  

  ### Proving/Disproving the Phenomenon:  
  - **Evidence for AIF’s Validity**:  
    - If audiences accept identical content from a fictional proxy (aide) but reject it from the subject’s "own voice," AIF explains the distinction.  
    - If moving verified public speech to a private setting *increases discomfort* despite factual accuracy, AIF captures the violation of contextual integrity.  
  - **Evidence Against**:  
    - If all three cases provoke equal objection, AIF is irrelevant; the issue is generalized invention.  
    - If the restitution case is condemned despite archival absence (e.g., inventing thoughts for a silenced Holocaust victim), AIF’s ethical inversion fails.  

  ### Refining Your Terms:  
  - **Voice-Conscription**: Apt for the core violation but incomplete. AIF specifies *interiority* as the conscripted territory.  
  - **Interpretive Preemption**: A consequence of AIF, not the act itself. One can preempt without AIF (e.g., biased editing of real quotes).  

  ### Conclusion:  
  AIF isolates the violation in *falsifying subjective experience*. It vanishes when the subject lacks a documented interior persona (pre-modern figures) or when fabrication explicitly serves historical repair for the intentionally erased. The intuition tracks **attribution + intimacy + absence of consent frameworks**. To argue against this: show that objections persist even without intimate framing, or that the restitution case is universally seen as equally violative.
