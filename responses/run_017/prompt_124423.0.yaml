  I've spent the last two years as a research assistant for my doctoral supervisor, who has been slowly writing a book on dirty hands in politics, and I'm now assembling a casebook of the hypotheticals he has ruled on across seminars, referee reports and conference Q&As. I keep his verdicts in a spreadsheet and I'd like to predict what he'll say about a new case a colleague wants to contribute, since the casebook deadline is in three weeks and she needs to know whether her case will get a "dirty hands" tag or a "something else entirely" tag. The verdicts I'm confident about are these: (1) a security chief who authorises the torture of a detainee to locate a bomb that will otherwise kill hundreds, with no other route to the information, who reports herself the next day, resigns and serves a sentence — dirty hands, and, separately, still guilty, "she should be punished and she should have done it"; (2) a finance minister who knowingly breaches a campaign-finance statute to get emergency relief payments out within the week, announces exactly what he did that afternoon, asks parliament for retroactive indemnity and steps down — dirty hands, though he called it "the boring end of the spectrum"; (3) a wartime leader who orders an unrecorded strike on a civilian target to shorten the war while her own advisers had an embargo option on the table that would very likely have worked within a year, and who denied the order when the records surfaced decades later — not dirty hands, "an atrocity with an excuse stapled to it"; (4) a mayor who authorises a rescue during a prison riot that will foreseeably kill two hostages rather than all forty, testifies to the inquiry, asks to be charged, is not charged, and stays in office at the council's request — dirty hands; (5) a civil servant who leaks classified documents exposing an illegal surveillance programme, breaking his oath and the law, and serves two years rather than name his source — not dirty hands, "conscientious lawbreaking