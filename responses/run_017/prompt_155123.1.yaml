prompt: |-
  I'm on a small committee of a professional society that has to decide, roughly twice a year, whether to withdraw an invited lecture, issue a condemnatory statement, or do nothing, and I've found that every framework we reach for is either a free-speech absolutism that treats all informal sanction as mob coercion or a social-justice framing that treats it as legitimate counter-speech — neither of which tells us anything about the cases we actually face. So before I read another general essay on whether "cancel culture" exists, I want the specification: the desiderata that a theory of informal social punishment has to satisfy to be good enough for an institution like mine to act on (not for a legislature, and not for a moral philosopher scoring positions from the outside). For each requirement give me the case or consideration that motivates it, and mark which are non-negotiable and which are only preferences of a camp — I suspect several things people demand here, such as that a sanction be imposed by someone with demonstrable authority over the sanctioned person, or that it be accompanied by publicly articulable reasons, are really just the institutional mindset generalised beyond its jurisdiction.

  The conceptual work is where I want the effort, and here are the phenomena I insist a specification handle, several of which I've had to name myself because the literature I've seen doesn't distinguish them. (1) Sanctions with no sanctioner: hundreds of individually trivial acts — an un-invitation here, a withdrawn invitation to co-author there — aggregate into an outcome worse than any participant intended or could have prevented; tell me whether a theory must be able to evaluate an aggregate that no agent chose. (2) The legibility asymmetry: within a community, declining to join a sanction is itself read as a position, so a theory has to say whether non-participation is sanction-like conduct, neutral, or something the theory simply has no verdict on. (3) Anticipated sanctions that never arrive: much of what people complain about is self-censorship in the shadow of expected costs, and if a theory counts those as punishments then nearly all contested speech inside any community is already being punished, while if it doesn't it seems to miss the central complaint. (4) The deniability asymmetry between collective and diffuse agents: my society can be asked to justify itself; a scattered crowd cannot, and any requirement of answerability appears to bind the actors who do least harm and exempt the ones who do most. (5) Threshold-insensitivity: because one person's contribution to a cascade is usually imperceptible, expected-consequence reasoning is unavailable to the individual deciding whether to sign the letter — so a theory that aims to guide individuals must either be non-consequentialist about the aggregate or tell us which surrogate reasoning ("what if everyone relevantly situated did this?") is licensed, and what it does to proportionality when the total harm is a function of how many happen to act. Please also keep the distinctions that I think must not be collapsed: withdrawing association oneself versus getting third parties to withdraw it, answering a speaker versus reducing their audience, condemning versus imposing costs, the wrongness of punishing without standing versus the wrongness of punishing excessively, and punishing an individual versus shifting what is sayable at all (if the point is forward-looking norm change of the kind that makes a practice come to seem dishonorable rather than refuted, say whether that makes the individual's desert irrelevant and whether it uses them merely as a means).

  Where I most want you to go is the structure of the list itself: tell me which two or three requirements you take to be in genuine tension and why — my own candidates are action-guidingness for a single agent who doesn't know how many others will act, against proportionality to the harm actually produced; and severity that depends on other people's unpredictable uptake, against any requirement that a sanctioner be able to gauge the sanction's weight in advance. Then tell me which single requirement does the most exclusionary work, and which of these requirements are contingent on empirical claims that could turn out either way (whether audience costs really do cascade, whether sanctions harden rather than soften the sanctioned person's views) as opposed to holding as a matter of the concept of punishment. Only after that, and briefly, score the usual families against the list — the more-speech/counter-speech view, deterrence and norm-enforcement views, retributive or desert-based views, and views on which some speech is itself a rights-violation that sanction merely answers — a line or two each, and skip any you think I've misdescribed.
reasoning: |-
  Okay, the user is part of a committee in a professional society that deals with issues like withdrawing invitations or issuing statements. They're frustrated because existing frameworks—either free-speech absolutism or social justice approaches—don't help in real cases. They need a practical theory for informal social punishment that handles specific complexities they face.

  First, I need to unpack their key concerns. They mentioned five phenomena: sanctions without a sanctioner (aggregate harm), legibility asymmetry (non-participation as a statement), anticipated sanctions (self-censorship), deniability asymmetry (accountability of groups vs. individuals), and threshold-insensitivity (individual impact in cascades). They also stress important distinctions like withdrawing association vs. third-party pressure, condemnation vs. imposing costs, etc.

  The user's deeper need seems to be a structured, actionable framework tailored to institutional decision-making, avoiding philosophical debates. They want clarity on non-negotiable requirements versus ideological preferences. They're likely seeking practical tools to navigate these dilemmas without getting bogged down by abstract theories.

  Looking at their listed phenomena, each requires careful handling. For sanctions without a sanctioner, the theory must evaluate aggregate effects even if no single actor intended harm. Legibility asymmetry means non-participation can't be neutral—it's interpreted as taking a side. Anticipated sanctions challenge whether self-censorship counts as punishment. Deniability asymmetry questions who should be held accountable. Threshold-insensitivity complicates individual decision-making in cascades.

  I should also consider the distinctions they mentioned. For example, withdrawing an invitation isn't the same as organizing a boycott. Condemnation differs from imposing material costs. Punishing an individual versus changing norms might affect desert-based justifications.

  The user wants to know which requirements are in tension. Action-guidingness vs. proportionality is key—individuals can't predict outcomes, so how can they ensure proportionality? Severity depending on others' actions versus predictability in sanction weight is another tension. 

  Non-negotiable requirements might include assessing aggregate consequences and addressing the legibility of non-participation. Contingent factors could be empirical, like whether sanctions actually change behavior or harden attitudes.

  Evaluating existing frameworks briefly: counter-speech views ignore power imbalances; deterrence models struggle with proportionality in aggregates; retributive views fixate on desert, ignoring norms; rights-violation approaches oversimplify speech as harm.

  The user probably needs a hybrid approach that combines consequentialist assessment of aggregate harm with clear decision procedures for individuals, acknowledging epistemic limits and the social meaning of non-participation. Highlighting the empirical contingencies will help them stay flexible. Emphasizing institutional answerability while managing diffuse actions could balance accountability without overburdening the committee.
answer: |-
  Here’s a specification of desiderata for a theory of informal social punishment tailored to your institutional context, grounded in your stated phenomena and distinctions. Requirements are categorized as **non-negotiable** (essential for institutional coherence) or **contingent** (dependent on empirical/ideological priors), with tensions and exclusionary effects highlighted.

  ---

  ### **Core Desiderata & Their Motivations**  
  *(Non-negotiable in **bold**)*  

  1. **Aggregate Accountability**  
     - **Motivation**: Case (1) — sanctions with no sanctioner (e.g., death-by-a-thousand-uninvitations).  
     - **Requirement**: The theory **must** evaluate aggregate harm even when no single actor intended or controlled it.  
     - **Non-negotiable**: Institutions cannot ignore systemic outcomes they perpetuate.  

  2. **Legibility of Non-Participation**  
     - **Motivation**: Case (2) — neutrality is read as endorsement/opposition.  
     - **Requirement**: The theory **must** clarify whether non-participation constitutes sanction-like conduct (e.g., "silence is violence" vs. "neutrality is possible").  
     - **Non-negotiable**: Institutional actors cannot opt out of social interpretation.  

  3. **Treatment of Anticipated Sanctions**  
     - **Motivation**: Case (3) — self-censorship due to feared repercussions.  
     - **Requirement**: The theory **must** distinguish between *actual punishment* and *perceived risk*, but account for how institutional actions amplify/reduce perceived risk.  
     - **Contingent**: Depends on empirical claims about chilling effects (e.g., "Will condemning X deter Y?").  

  4. **Answerability Proportional to Agency**  
     - **Motivation**: Case (4) — deniability asymmetry (organized groups vs. diffuse crowds).  
     - **Requirement**: Demands for justification **must** bind collective agents (e.g., your society) more than diffuse actors.  
     - **Non-negotiable**: Institutions lose legitimacy if they mimic mob unaccountability.  

  5. **Threshold-Insensitive Guidance**  
     - **Motivation**: Case (5) — individuals can’t gauge their impact in cascades.  
     - **Requirement**: The theory **must** offer *individual decision-procedures* that don’t rely on predicting aggregate outcomes (e.g., "Would this act be permissible if universally applied?").  
     - **Contingent**: Balances deontology ("duty not to participate in harm") vs. rule-consequentialism.  

  ---

  ### **Key Distinctions (Must Not Be Collapsed)**  
  - **Withdrawing association** (individual act) vs. **orchestrating third-party withdrawal** (mobilization)  
  - **Answering speech** (rebuttal) vs. **reducing audience** (deplatforming)  
  - **Condemnation** (moral judgment) vs. **imposing costs** (material harm)  
  - **Lack of standing** (who may punish?) vs. **excessiveness** (how much punishment?)  
  - **Punishing an individual** (backward-looking) vs. **shifting norms** (forward-looking)  

  ---

  ### **Tensions Between Requirements**  
  1. **Action-Guidingness vs. Proportionality**  
     - Tension: Individuals need clear rules ("Don’t sign petitions likely to cause job loss"), but proportionality requires assessing actual harm (which depends on others’ actions).  
     - Why: Threshold-insensitivity makes *ex ante* proportionality judgments impossible for single actors.  

  2. **Severity vs. Predictability**  
     - Tension: Sanctions’ weight (e.g., reputational damage) depends on social uptake (unpredictable), yet institutions must gauge severity in advance to avoid excess.  
     - Why: Your committee must decide "Do we withdraw this invite?" without knowing if it will end a career or be forgotten tomorrow.  

  ---

  ### **Exclusionary Work & Contingencies**  
  - **Most Exclusionary Requirement**: **Aggregate Accountability**.  
    - Why: It forces theories that focus solely on individual intent (e.g., "I only uninvited him; I didn’t end his career") off the table.  
  - **Contingent Empirical Claims**:  
    - Whether sanctions *harden* (backfire effect) or *soften* (deterrence) attitudes.  
    - Whether audience withdrawal *cascades* (e.g., "no-platforming leads to blacklisting") or is contained.  
    - If self-censorship *distorts discourse* more than sanctioning does.  

  ---

  ### **Scoring Existing Frameworks**  
  *(Against the specification above)*  

  1. **Counter-Speech / "More Speech" View**  
     - Fails: Aggregate accountability (ignores power imbalances), Legibility (treats non-participation as neutral), Severity predictability (assumes counterspeech is costless).  
     - Strength: Distinguishes condemnation from imposing costs.  

  2. **Deterrence / Norm-Enforcement**  
     - Fails: Threshold-insensitivity (relies on consequentialism individuals can’t compute), Anticipated sanctions (over-counts "chilling effects" as punishment).  
     - Strength: Forward-looking; handles norm-shifting.  

  3. **Retributivism / Desert-Based**  
     - Fails: Aggregate accountability (fixates on individual desert), Norm-shifting (desert irrelevant to forward-looking goals).  
     - Strength: Proportionality (if harm is knowable).  

  4. **Speech-as-Harm / Rights-Violation**  
     - Fails: Deniability asymmetry (demands answerability from diffuse actors), Legibility (non-participation becomes complicity).  
     - Strength: Justifies sanctions without invoking "punishment."  

  ---

  ### **Conclusion: A Hybrid Path**  
  Your committee needs a theory that:  
  - **Non-negotiably** centers aggregate effects, institutional answerability, and the social meaning of non-participation.  
  - **Tolerates tension** between action-guidance and proportionality by using bright-line rules (e.g., "Never orchestrate third-party sanctions without due process") while tracking systemic outcomes.  
  - **Tests contingencies empirically**: e.g., "Do statements condemning X reduce harassment of Y, or escalate conflict?"  
  - **Separates questions**: Withdrawing association (always permissible if consistent) vs. collective punishment (requires desert/proportionality).  

  This framework rejects both free-speech absolutism (indifferent to aggregation) and simplistic social-justice models (overlooking agency asymmetry). It treats informal sanctions as *institutionally modifiable social facts*—not philosophical puzzles.
