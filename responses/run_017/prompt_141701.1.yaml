prompt: |-
  Been reading the rationalist corner of the internet since roughly the Overcoming Bias days, so my reflex on any "I can't decide" question is: shut up and multiply, pick the bigger number, and if that still feels bad the problem is with my feelings. A friend of mine — ex-philosopher, now a clinical ethicist at a hospital, she's the one who got me into this — keeps insisting that this only works when the options are actually comparable, and that the interesting cases are exactly the ones where there's no bigger number to go find. I've read some of the parity / voluntarist package (Chang and co.) and it half-clicked, but I've also definitely seen "incommensurable" used online as a stop-word meaning "I don't want to do arithmetic," which I take to be a real failure mode that a good theory should block rather than license. So before I commit to any particular account, I want the spec.

  Write me the desiderata an account of hard choices and incommensurable values has to meet to count as adequate. Fix the purpose as mine: adequate means good enough that I could (i) tell the difference between a genuinely hard choice and a lazy refusal to do the math, and (ii) say something non-bullshitty to my friend Wren, who is three weeks into agonising over two job offers and wants to know whether she is *allowed* to just pick — one is more money and status but sixty-hour weeks in a city she likes, the other is worse-paid, more autonomy, near her family, and neither dominates. For each requirement give the case or consideration behind it, and mark which are non-negotiable and which are just the prejudices of one camp. The cases I want covered, at minimum: the tiny-token case (if you add five dollars to one option, does it stop being hard? — a theory whose account of incommensurability survives an arbitrarily small sweetener is doing something different from one that doesn't); Wren's case re-run (same person, same information, ranks A above B on Tuesday and B above A on Thursday, with no new evidence and no self-deception — is that irrational, a symptom, or the signature of parity?); the resolution case (at coarse grain both options look comparable and "fine," at fine grain they don't — is comparability grain-relative or is that just vagueness in disguise); the transformative case (the choice changes who is doing the valuing, so the evaluator after the choice isn't the evaluator before — having a kid versus not, say, or a career you can only enter young); the chaining case (A is slightly worse than B, B is on a par with C, C is on a par with A — can this agent be exploited, and does a theory that permits two eligible options owe us a story about why that isn't a money pump?); the advisor asymmetry (when I'm deciding for myself, "either is fine, just pick" lands as a category error; when Wren is deciding, the very same advice seems fine — that gap should fall out of the theory, not be asserted alongside it); the tragic-remainder case (choosing one leaves something that isn't merely lost but is in some sense wronged); and the collective case (cost-benefit analysis, a statistical life versus a wetland, institutions that have to decide anyway — does incommensurability have any bite for public choices or is it only first-personal?). Also tell me which distinctions the theory is not allowed to collapse: incomparability versus parity versus equality versus mere vagueness versus our ignorance of the true exchange rate versus incompleteness in the agent's own preferences; "the values are incommensurable" versus "the options are incomparable"; no fact of the matter versus a fact of the matter we can't know versus a fact of the matter the agent constitutes by choosing; and hard-because-the-world versus hard-because-of-us.

  The part I most want: which pairs of desiderata you suspect can't be jointly satisfied, so that the list itself is the interesting result. My own candidates — argue with them — are (a) "both options are rationally permissible" against "the agent must not be exploitable / must not be money-pumpable," (b) "there is no fact of the matter which is better" against "the choice is nevertheless the moment where value gets created and where the agent can get it wrong," and (c) "the class of hard choices is rare and serious" against "hard choices are everywhere once you look at fine enough grain." Also say which single requirement does the most work excluding popular candidates, and which requirements on this list are really just one camp's aesthetic preferences wearing a lab coat (transitivity of betterness, expressibility in a decision-theoretic formalism, no primitive normative entities, no residue after a good choice, and so on). Then, briefly — a few lines each, not an essay, and no bibliography, I have no library access and can't look anything up, just argue it — score the parity/voluntarist view, the "it's really just vagueness" view, the "we're merely ignorant of the exchange rates" view, and the "everything is commensurable under one currency with diminishing returns" view against the list. If a candidate flunks a requirement you think is non-negotiable, say so plainly.
reasoning: |-
  Okay, the user is deeply entrenched in rationalist thinking, having followed the movement since the Overcoming Bias days. They're clearly frustrated with how "incommensurability" gets weaponized online to avoid quantitative thinking. Their core need is practical: they want a rigorous framework to distinguish genuine value conflicts from intellectual laziness, specifically to help their friend Wren who's paralyzed between job offers.

  The user presents an exceptionally detailed set of requirements for an adequate theory of hard choices. They're not just asking for definitions - they want operational criteria with test cases. The clinical ethicist friend has clearly influenced their thinking, making them suspicious of both naive quantification and vague appeals to "incommensurability."

  What's interesting is their meta-request: they want to know which desiderata are inherently incompatible. This suggests they've already noticed tensions in existing literature. Their three candidate tensions reveal their priorities: (a) preserving rationality while avoiding exploitability, (b) maintaining objective value while allowing for choice-creation, and (c) keeping hard choices rare while acknowledging fine-grained conflicts.

  The user's examples are cleverly chosen to probe different failure modes. The $5 sweetener tests whether a theory is truly about incommensurability or just indifference. The day-to-day preference reversal examines consistency requirements. The coarse/fine grain distinction challenges whether comparability is scale-dependent.

  For the advisor asymmetry, the user notices something profound: why "just pick" feels disrespectful when applied to ourselves but helpful for others. A good theory should explain this psychological asymmetry without resorting to special pleading.

  The money pump issue is particularly thorny. The user seems aware that allowing rationally permissible alternatives might open exploitation loopholes, but finds strict transitivity unrealistic for human values. They want a theory that doesn't force artificial precision yet avoids being gamed.

  When scoring existing theories, I need to be brutally honest about failures. The parity view handles day-to-day reversals well but struggles with money pumps. The vagueness view makes comparability grain-dependent but can't explain transformative choices. The "ignorance" view preserves transitivity but denies the phenomenology of genuine value conflicts. The diminishing returns view is elegant but collapses distinctions the user considers essential.
answer: |-
  Here’s a specification for an adequate account of hard choices and incommensurable values, tailored to your purpose. Requirements are derived from your cases/considerations, with non-negotiables marked **(NN)**. Distinctions to preserve are noted upfront.

  ---

  ### **Core Distinctions the Theory Must Not Collapse**  
  1. **Incomparability** (no common measure) vs. **Parity** (comparable but neither better nor worse, nor equal) vs. **Equality/Vagueness/Ignorance**.  
  2. **Values incommensurable** (e.g., autonomy vs. money) vs. **Options incomparable** (no fact of the matter).  
  3. **No fact vs. Constitutive fact** (choice creates value) vs. **Epistemic limitation**.  
  4. **Hardness from the world** (objective conflict) vs. **Hardness from us** (cognitive limits).  

  ---

  ### **Desiderata & Their Basis**  
  1. **Tiny-Token Resilience**  
     - *Case*: Adding $5 to one option doesn’t resolve the hard choice.  
     - *Requirement*: Incommensurability must not be fragile to negligible sweeteners.  
     - *Status*: **(NN)** – Rules out indifference masquerading as incommensurability.  

  2. **Wren’s Reversal Permissibility**  
     - *Case*: Same agent flips preference (A>B Tuesday, B>A Thursday) with no new info.  
     - *Requirement*: This must be rational (or at least non-defective) under parity, not irrationality/epistemic failure.  
     - *Status*: **(NN)** – Captures phenomenology of genuine hard choices.  

  3. **Grain-Relative Comparability**  
     - *Case*: Options comparable at coarse grain (e.g., "both good jobs") but incomparable at fine grain (e.g., specific tradeoffs).  
     - *Requirement*: Comparability can be grain-dependent; not reducible to vagueness.  
     - *Status*: **Negotiable** – Some views (e.g., vagueness) collapse this.  

  4. **Transformative Choices**  
     - *Case*: Choosing alters the valuer (e.g., parenthood, high-commitment career).  
     - *Requirement*: Must explain why pre-choice valuation fails to settle the choice.  
     - *Status*: **(NN)** – Central to life-altering decisions.  

  5. **Anti-Exploitability (Money-Pump Defense)**  
     - *Case*: A ≲ B ≈ C ≈ A chaining – agent pays to swap cyclically.  
     - *Requirement*: Theory must block money-pump arguments *without* requiring strict transitivity.  
     - *Status*: **(NN)** – Prerequisite for rationality.  

  6. **Advisor Asymmetry**  
     - *Case*: "Just pick" is bad self-advice but good external advice.  
     - *Requirement*: Theory must explain the gap via agential standpoint (e.g., identity-constitution in first-person choice).  
     - *Status*: **(NN)** – Matches intuitive normative practice.  

  7. **Tragic Remainder**  
     - *Case*: Choosing one option "wrongs" the unchosen value (e.g., sacrificing family for career).  
     - *Requirement*: Must acknowledge non-fungible loss, not just opportunity cost.  
     - *Status*: **Negotiable** – Rejected by consequentialists.  

  8. **Collective Action Relevance**  
     - *Case*: Cost-benefit analysis (e.g., wetland vs. statistical lives).  
     - *Requirement*: Incommensurability must constrain public rationality (e.g., force qualitative deliberation, not quantification).  
     - *Status*: **Negotiable** – Some argue institutions *must* commensurate.  

  ---

  ### **Tensions in Desiderata**  
  Your suspected incompatibilities are acute:  
  - **(a) Permissibility vs. Anti-Exploitability**: If both choices are rational, how to block money-pumps?  
    - *Resolution*: **Rigid eligibility sets** – Only non-dominated options are permissible; cyclic preferences are excluded by definition.  
  - **(b) No Fact vs. Constitutive Choice**: If no fact pre-choice, how can choice be wrong?  
    - *Resolution*: **Constitutive agency** – Choice commits to a standpoint; wrongness emerges post-hoc via incoherence (e.g., betraying core values).  
  - **(c) Rarity vs. Ubiquity**: Hard choices should be rare/serious, yet fine grain implies many.  
    - *Resolution*: **Grain sensitivity** – Seriousness arises only when values conflict at a *meaningful* grain (e.g., life projects, not breakfast options).  

  ---

  ### **Most Exclusionary Requirement**  
  **Tiny-Token Resilience** – Eliminates views where incommensurability is disguised indifference (e.g., "it’s all about utility, just fuzzy").  

  ---

  ### **Camp-Specific Biases (Disguised as Requirements)**  
  - **Transitivity of betterness**: Rejected by parity views; not a neutral axiom.  
  - **No residue after choice**: Rejected by tragic-remainder views (e.g., Bernard Williams).  
  - **Formal expressibility**: Privileges decision theory; transformative choices resist modeling.  
  - **No primitive normativity**: Voluntarism (Chang) posits "will" as normative primitive.  

  ---

  ### **Scoring Candidate Theories**  
  1. **Parity/Voluntarist (e.g., Chang)**  
     - 👍: Handles **Wren’s reversal**, **Advisor asymmetry**, **Transformative choices**, **Tragic remainder**.  
     - 👎: Struggles with **Anti-exploitability** (money-pump risk) and **Collective action** (no "will" for institutions).  
     - **Verdict**: Flunks **Anti-exploitability (NN)** – Cyclic parity invites pumping.  

  2. **"It’s Vagueness" (e.g., supervaluationism)**  
     - 👍: Explains **Grain-relativity**, **Tiny-token resilience** (sharp boundaries unknown).  
     - 👎: Fails **Wren’s reversal** (preference flip is irrational) and **Transformative choices** (no deep indeterminacy).  
     - **Verdict**: Flunks **Transformative choices (NN)** – Vagueness ≠ value-creation.  

  3. **"Ignorance of Exchange Rates"**  
     - 👍: Preserves **Transitivity**, handles **Collective action** (experts can discover rates).  
     - 👎: Fails **Tiny-token resilience** (sweeteners reveal dominance) and **Wren’s reversal** (flipping is irrational).  
     - **Verdict**: Flunks **Tiny-token resilience (NN)** – Conflates incommensurability with ignorance.  

  4. **"Diminishing Returns Commensurability" (e.g., utility theory)**  
     - 👍: Solves **Anti-exploitability**, **Collective action**.  
     - 👎: Fails **Tragic remainder** (losses are fungible), **Transformative choices** (utility functions pre-exist choice).  
     - **Verdict**: Flunks **Transformative choices (NN)** – Cannot explain value metamorphosis.  

  ---

  ### **The Adequate Theory: Key Features**  
  - **Non-fragile incommensurability**: Parity relations resist tiny sweeteners.  
  - **Constitutive agency**: Choice resolves indeterminacy *without* pre-existing facts.  
  - **Eligibility sets**: Multiple permissible options, but cyclic preferences excluded.  
  - **Grain-sensitive**: Hard choices at identity-defining grains only.  
  - **Asymmetric advice**: First-person choice constitutes identity; third-person doesn’t.  

  **Result for Wren**: Tell her: *"This isn’t math – your values are in conflict in a way no algorithm can resolve. Picking isn’t failure; it’s committing to who you’ll become. Neither choice is wrong, but after choosing, own it as right."*  

  **Your Candidates Validated**: (a) and (b) tensions require careful solutions; (c) resolved by grain-relativity. The **transformative choice** desideratum is the strongest filter – only robustly non-consequentialist theories survive.
