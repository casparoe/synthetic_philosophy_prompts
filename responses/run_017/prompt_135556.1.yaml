  ### Decision Tree Handout: Who Belongs in the Demos?  
  **Instructions for Students:** Answer each question below with **Yes** or **No** based solely on your intuitive judgment about the Estuary Authority case. Do not overthink—go with your gut. After answering all questions, use the scoring key to identify which doctrine your answers align with. The goal is to reveal the implicit trade-offs in your view, not to "win" or pick a doctrine.  

  ---

  ### The Case: Estuary Authority  
  The Estuary Authority makes binding decisions about flood control and water allocation for a river delta. Its decisions impact:  
  - **Resident citizens** of the delta districts.  
  - **Long-term non-citizen residents** (lived/worked there 15+ years, no citizenship route).  
  - **Farmers upstream** (outside jurisdiction, lose irrigation access).  
  - **Downstream city** (in another country, absorbs flood surges).  
  - **Children under 16** (residents but minors).  
  - **Future movers** (would relocate *only if* the new levee is built).  
  - **Future residents** (born 50 years from now, impacted by groundwater depletion).  
  - **Seceding district** (petitioned to leave the Authority).  
  - **One-week traveler** (subject to laws while present).  

  ---

  ### Decision Tree Questions  
  Answer **Yes** or **No** for each:  

  1. **Traveler inclusion**: Should the one-week traveler have a formal vote or representation in the Authority’s decisions?  
  2. **Downstream inclusion**: Should the downstream city have a formal vote or representation?  
  3. **Long-term non-citizen inclusion**: Should long-term non-citizen residents have a formal vote or representation?  
  4. **Future mover inclusion**: Should future movers (those who would move *only if* the levee is built) have a formal say in the levee decision?  
  5. **Future resident inclusion**: Should future residents (born 50 years from now) have a formal say in the groundwater decision?  
  6. **Child inclusion**: Should resident children under 16 have a formal vote or representation?  
  7. **Secession inclusion**: Should the seceding district be included in decisions affecting it?  
  8. **Issue-specific demos**: Should the Authority have different decision-makers for different issues (e.g., a body including the downstream city for spillway decisions but not for water allocation)?  
  9. **Self-amendment**: Should the current members of the Authority have the sole power to decide who gets to be a member in the future?  
  10. **Outcome-independent right**: Is it still wrong to exclude a group even if including them would worsen decisions (e.g., due to incompetence or bias)?  

  ---

  ### Scoring Key: Map Your Answers to a Doctrine  
  Tally your **Yes/No** answers and match the pattern to a doctrine below. **Note:** Some doctrines share answer patterns (see "Unseparated Pairs").  

  | Answer Pattern (Y/N in order) | Doctrine | Core Commitment | Most Awkward Implication |
  |-------------------------------|----------|-----------------|--------------------------|
  | **Y, N, Y, N, N, Y, Y, N, Y, Y** | **Coercion Principle** | Only those subject to enforcement belong. | The one-week traveler must be included even if they have no stake in long-term water policy. |
  | **N, Y, Y, Y, Y, Y, Y, Y, N, Y** | **Affectedness Principle** | All significantly impacted individuals belong. | The downstream city (in another country) must be included, potentially complicating national sovereignty. |
  | **N, N, Y, N, N, Y, Y, N, Y, Y** | **Both Required / Captive-Constituency** | Only those who are both subject to enforcement *and* have high-exit-cost stakes belong. | Long-term non-citizens are included, but future movers and the downstream city are excluded despite high stakes. *This pattern merges two doctrines (see Unseparated Pairs).* |  
  | **N, N, N, N, N, N, Y, N, Y, Y** | **Citizenship-Based** | Only current adult citizens belong. | Children and long-term non-citizens (15+ years) are excluded regardless of impact or residency. |  
  | **N, Y, Y, Y, Y, N, Y, Y, N, N** | **Competence-Optimized** | Inclusion depends on improving decision quality (e.g., excluding minors or including experts). | Children are excluded even if affected, and the demos varies per issue to maximize competence. |  
  | **Y, N, Y, N, N, Y, Y, N, Y, N** | **Unnamed Outcome-Justified View** | Inclusion is only a right if it produces better outcomes. | The traveler is included (to improve compliance) but future residents are excluded (as their inclusion might worsen decisions). |  
  | **N, N, Y, N, N, Y, Y, N, Y, N** | **Relational Test** | Belonging depends on who can be morally wronged by exclusion, regardless of outcomes. | The downstream city is excluded (no relational claim) even if affected, but long-term non-citizens are included (relational harm). |  

  #### Unseparated Pairs & Limitations  
  - **Both Required and Captive-Constituency** share pattern `N, N, Y, N, N, Y, Y, N, Y, Y`. They cannot be separated by this tree because both doctrines:  
    - Exclude the traveler (low stake/high-exit-cost) and downstream city (no enforcement).  
    - Include long-term non-citizens (enforcement + high-exit-cost) and children.  
    - **Tiebreaker**: Ask: *"Should a wealthy foreign homeowner (easily leaves for 6 months/year) be included?"* **Yes** → Captive-Constituency (exit-cost gates inclusion). **No** → Both Required (enforcement + affectedness gates inclusion).  
  - **Coercion and Relational Test** partially overlap (e.g., including travelers/long-term residents). The tree separates them via Q10 (outcome-independence).  
  - **Affectedness and Competence-Optimized** are separated by Q6 (child inclusion) and Q10 (right vs. outcome focus).  

  #### Placement of Additional Principles  
  - **Captive-Constituency**: Collapses into the `Both Required` leaf (pattern `N, N, Y, N, N, Y, Y, N, Y, Y`). Both doctrines exclude identical groups (traveler, downstream city, future people) and share the awkwardness of excluding the downstream city. The cell was empty initially because the view is unstable—it often defaults to "both affected and subjected" in practice.  
  - **Relational Test**: Occupies an otherwise empty cell (pattern `N, N, Y, N, N, Y, Y, N, Y, N`). This cell was empty because the view is underexplored (not unattractive or incoherent). It diverges from outcome-based views (Q10=Y) by prioritizing moral wrongs over results.  

  ---

  ### How to Run This as an In-Class Quiz  
  1. **Preparation**: Print copies of the questions (p.1) and scoring key (p.2).  
  2. **Answer Phase (5–7 mins)**: Students answer questions individually. Emphasize: "No overthinking—this is about your intuitions, not theory."  
  3. **Scoring Phase (5 mins)**: Students tally answers and match to a doctrine using the key.  
  4. **Discussion (15–20 mins)**:  
     - Poll the class: "Which doctrine did you land in? How do you feel about its awkward implication?"  
     - Highlight trade-offs: "Who here has an outcome-based view (Q10=No)? How does that change who you included?"  
     - Press contradictions: "If you excluded children (Q6=No) but included future residents (Q5=Yes), what competence threshold are you using?"  
     - Use unseparated pairs: "If you got pattern `N,N,Y,N,N,Y,Y,N,Y,Y`, how would you resolve the tiebreaker?"  
  5. **Debrief**: "This isn’t about finding the ‘right’ answer—it’s about seeing that every principle forces hard choices. Tomorrow, we’ll ask if democracy can survive these tensions."  

  **Why this works**: By starting with concrete judgments, students confront the costs of doctrines *before* labeling them. The tree forces coherence (e.g., you can’t support future residents without biting the bullet on decision-making procedures) and exposes "empty cells" (e.g., no doctrine allows variable demos + citizenship). The recurring case ensures comparability across questions.
