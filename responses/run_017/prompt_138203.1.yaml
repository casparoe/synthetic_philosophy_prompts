prompt: |-
  I am writing a DPhil thesis in bioethics on the determination of death, and I sit as the lay-philosophical member of my teaching hospital's Determination of Death Working Group. The Group has been asked to approve a retrieval protocol it has never considered, and I have been asked to draft the minute. What I need from you is the reasoning rather than any references: an account of which principle the Group has in fact been applying across its own previous rulings, and what that principle requires of it now.

  The Group's record, as I read it:

  1. It accepted a neurological determination of death in a patient whose heart was still beating and whose body remained warm and perfused, and it permitted organ recovery in that state, minuting that the organism as a whole had died even though its parts had not.
  2. Where clinical brainstem testing was equivocal because some neuroendocrine function appeared preserved, it declined to confirm death on clinical grounds alone and required an ancillary study of cerebral perfusion; it confirmed death when that study showed absent intracranial flow.
  3. It declined a family's request, made on religious grounds, to disregard a neurological determination, but allowed a fixed short period of continued support so that relatives could gather, and refused to extend it indefinitely.
  4. It refused a family's request to declare death in a patient in a permanent vegetative state, on the ground that loss of consciousness is not one of the criteria it recognises.
  5. In controlled donation after circulatory death it insists on five minutes of continuous asystole before determination, and it rejected a proposal to accept ninety seconds, minuting that auto-resuscitation must be excluded and that the fact that no one intends to restart the heart is not by itself enough.
  6. When a patient had a witnessed arrest, failed cardiopulmonary resuscitation, and was then cannulated for extracorporeal support, the Group refused to record that the patient had died during the arrest: it treated the institution of support as resuscitation and the patient as living on support, whose treatment was later withdrawn.
  7. It permitted continued somatic support of a pregnant patient after a neurological determination of death, for foetal benefit, and minuted that the patient was dead and that what was being sustained was a part of her body.
  8. It has repeatedly approved ex situ normothermic machine perfusion of retrieved kidneys and livers without treating the reperfusion of an organ as casting doubt on the donor's death.

  The new proposal concerns a forty-one-year-old with a devastating brain injury who does not meet neurological criteria, from whom treatment is to be withdrawn. Cannulae are to be placed in the femoral vessels beforehand, and heparin given, while the patient is still alive. After asystole and the Group's usual five-minute interval, death is to be determined by circulatory criteria; an occlusion balloon is then to be inflated so that the cerebral and coronary circulations are excluded, and in-situ normothermic regional perfusion of the abdominal organs is to be run from an extracorporeal circuit. The patient's heart is to remain asystolic and will not be recovered.

  What I would like from you: the candidate rules that fit the record as a whole — several do, and they do not agree here; what each predicts both about the declaration of death and about the pre-arrest cannulation and heparinisation; your recommendation for the decision that would best cohere with the Group's own precedents, with the closest analogue identified and the reasons for preferring it; and, for each of the two live options, a sentence or two of wording the Group could minute as the principle it is thereby adopting, together with an honest note of where its precedents simply run out. One member says the sixth item settles the case; another replies that perfusing the abdomen with the brain excluded is not resuscitation; a third says the fifth item does the work; a fourth says the eighth shows reperfusion is not the issue. Please also tell me which part of their disagreement is substantive and which is only about how far the word circulation extends.

  Finally: I had thought the case that would tell these rules apart would be a proposal to begin regional perfusion after only ninety seconds of asystole. Does that case actually discriminate between the surviving rules, and is there a better one? And please mark clearly any part of this the Group should refer elsewhere — to the coroner, to the trust's legal advisers, or to the courts — rather than settle for itself. I would be grateful for British English throughout.
reasoning: |-
  Hmm, the user is working on a DPhil in bioethics and serves on a hospital Determination of Death Working Group. They're drafting minutes for a new organ retrieval protocol involving normothermic regional perfusion (NRP) after circulatory death. The core challenge is identifying the consistent principle behind the Group's eight previous rulings and applying it to this novel case.

  Looking at the precedents, several key themes emerge:
  - The Group consistently distinguishes between organismic death and cellular/tissue survival (cases 1,7,8)
  - It maintains strict boundaries between life and death determination (cases 2,4,6)
  - It prioritizes objective physiological criteria over subjective factors (cases 3,4)
  - It demonstrates particular caution around circulatory determinations (case 5)

  For the new NRP proposal, the critical tension lies between:
  - The balloon's physical exclusion of cerebral circulation (satisfying neurological standards by isolation)
  - The artificial restoration of systemic perfusion (contravening circulatory death criteria)

  Case 6 provides the closest analogue but differs crucially - there, extracorporeal support was initiated before any death determination, whereas here NRP begins after declaration. Case 8 shows reperfusion of isolated organs doesn't invalidate death, but this involves in-situ reperfusion of multiple organs simultaneously.

  The substantive disagreement among members centers on whether "circulation" means:
  - Systemic blood movement (favoring refusal since NRP restores flow)
  - Integrated vital circulation (favoring approval due to cerebral exclusion)

  A better discriminator than the 90-second asystole scenario would be a proposal involving cerebral reperfusion, which would clearly violate all principles.

  Legal referral appears necessary regarding:
  - Premortem cannulation legality under Human Tissue Act
  - Coroner jurisdiction over timing issues
  - Potential judicial review of death determination methodology
answer: |-
  Based on the Group's precedents, the consistent principle applied is **"irreversible loss of integrated somatic functioning as a biological organism, confirmed by cessation of either neurological or circulatory criteria, where 'irreversible' means unresponsive to intervention and 'integrated' excludes partial or isolated functions."**  

  This principle requires:  
  - **Irreversibility** as a biological reality (not merely intent not to treat).  
  - **Organismic integration** as the benchmark (isolated cellular/tissue activity is insufficient).  
  - **Strict adherence** to circulatory/neurological criteria without substitution (e.g., consciousness alone is inadequate).  

  ---

  ### **Analysis of the New Proposal**  
  **Candidate Rules from Precedents:**  
  1. **"Irreversible Cessation of Systemic Circulation" (favoured by cases 1,5,6,7):**  
     - Death declaration: **Permitted** after 5 min asystole (as per #5).  
     - Pre-arrest cannulation/heparin: **Permitted** (analogous to premortem interventions in DCD).  
     - NRP: **Prohibited** because restoring abdominal circulation *after declaration* contradicts circulatory death criteria (#5: auto-resuscitation exclusion; #6: extracorporeal support pre-death invalidates death claim).  
     - *Wording if adopted:* "Death determination requires irreversible cessation of systemic circulation; post-mortem reperfusion invalidates this irreversibility."  

  2. **"Irreversible Loss of Organismic Integration" (favoured by cases 1,2,7,8):**  
     - Death declaration: **Permitted** after 5 min asystole.  
     - Pre-arrest cannulation/heparin: **Permitted** (consistent with DCD protocols).  
     - NRP: **Permitted** because cerebral exclusion means no restoration of *integrated* function (#1: somatic support for pregnancy; #8: ex situ perfusion doesn't resurrect the organism).  
     - *Wording if adopted:* "Death is the irreversible loss of the organism as a whole; regional perfusion of isolated systems does not restore integrated function."  

  ---

  ### **Recommendation for Coherence**  
  **Adopt the "Irreversible Loss of Organismic Integration" principle (Rule 2).**  
  - **Closest analogue:** #7 (sustaining somatic support in pregnancy). The balloon excludes cerebral circulation, making abdominal perfusion akin to sustaining a "body part" (#7) or an ex vivo organ (#8).  
  - **Why preferable:**  
    - Aligns with #1, #7, and #8: cellular/tissue activity without organismic unity doesn't negate death.  
    - Distinguishes from #6: here, death is declared *before* NRP, and cerebral exclusion prevents "resuscitation" of integrative capacity.  
    - Addresses #5: the 5-min wait satisfies irreversibility; NRP does not restart systemic circulation (heart remains asystolic).  

  **Substantive Disagreement:**  
  - The crux is **whether 'circulation' means systemic flow (Rule 1) or vital integration (Rule 2)**. Rule 1 focuses on mechanical blood movement; Rule 2 on biological unity.  

  **Where Precedents Run Out:**  
  - No prior case involves *in-situ* regional perfusion *after* circulatory death determination. #8 involved ex situ organs; #6 involved *pre*-determination support.  

  ---

  ### **Testing the Rules**  
  - **The 90-second asystole proposal:**  
    - **Rule 1 (systemic cessation):** Rejects it—irreversibility unproven (per #5).  
    - **Rule 2 (organismic integration):** *May* accept it if cerebral exclusion ensures no auto-resuscitation. **This discriminates:** Rule 2 allows flexibility if integration is permanently lost.  
  - **Better discriminator:** A proposal to perfuse the *brain* after declaration. Both rules would reject it, as it risks restoring organismic integration.  

  ---

  ### **Referral Recommendations**  
  1. **Coroner:** Confirm no forensic concerns (e.g., heparin/cannulation affecting asystole timing).  
  2. **Legal Advisers:**  
     - Premortem cannulation legality under Human Tissue Act 2004 (consent, "minimum steps" for retrieval).  
     - Whether NRP invalidates death for legal purposes (e.g., *Re A* [1992] 3 Med LR 303).  
  3. **Courts:** If the Group doubts statutory interpretation (e.g., "permanent" vs. "irreversible" in death criteria).  

  ---

  ### **Minute Wording for the Decision**  
  **If approving NRP (recommended):**  
  > "The Group confirms death determination by circulatory criteria after 5 minutes of continuous asystole. In-situ normothermic regional perfusion, with cerebral exclusion, is permitted as it sustains isolated tissue function but does not restore the integrated functioning of the organism as a whole, consistent with our precedents (items 1,7,8). Premortem cannulation and heparinisation are lawful preparatory steps for donation, provided consent and clinical justification are documented."  

  **If rejecting NRP (Rule 1):**  
  > "The Group confirms death by irreversible cessation of systemic circulation. Post-death regional perfusion constitutes artificial restoration of circulation, invalidating the determination of irreversibility, per item 5 and 6. Premortem cannulation remains permissible for organ preservation pending death determination."  

  ---

  **Final Note:** The sixth item does *not* settle this case—it involved *resuscitative* support *before* declaration, whereas here support begins *after* death is confirmed. The fifth item emphasises irreversibility but does not address exclusion of body regions. The eighth item supports Rule 2 but is not identical (ex situ vs. in-situ). The substantive divide is the definition of "circulation" in death determination—biological integration versus mechanical flow.
