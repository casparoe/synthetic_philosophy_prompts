  *scratches head* The constraints are... intense. Nineteen lines, strict villanelle structure, two refrains that must be perfectly symmetrical except for their order. No outcome hints in imagery, no borrowed phrasing, and it has to work both as philosophy and as standalone poetry for non-philosophers. 

  *stares at ceiling* The refrains need to be a forecast and its negation... "The battle will be fought tomorrow" and "The battle will not be fought tomorrow" feel clean. No capitalization or punctuation asymmetry - tricky when negation changes the meaning entirely. 

  *scribbles in air* For the admiral scenes: night watch, lamp oil, map table, the act of deciding. Must avoid any omen-like details - no storms, no stars, nothing that suggests an outcome. The disjunction moment ("one of these must hold true"?) should land in the middle stanzas where deliberation peaks. 

  *checks villanelle rhyme scheme* ABA ABA ABA ABA ABA ABAA. Right. Mapping the refrains: if "will be fought" gets the final line, that aligns with the bivalence reading where it's already true (though unknown). The open-future reading would treat both as indeterminate. 

  *grumbles* The prose note needs to be under 150 words explaining this mapping without jargon. Partners with no philosophy background must get the poem's mood even if they miss the Aristotle references. 

  *tries lines aloud* "On deck he hears the water's turn and fall" establishes setting without commitment. "The fleet holds station" - present actions only. The disjunction line must feel like logical tension, not narrative foreshadowing. 

  Final challenge: making "The battle will be fought tomorrow" land as heavier when it closes the poem, purely through structural weight, not word changes. *sigh* Villanelles are brutal.
answer: |-
  ## Villanelle: The Admiral Considers Tomorrow

  On deck he hears the water's turn and fall,  
  The fleet holds station, waiting for command.  
  **the battle will be fought tomorrow**  
  Oil laps the lamp-flame at the chartroom wall,  
  His fingers trace the coastline, strand on strand.  
  **the battle will not be fought tomorrow**  

  The first watch notes the fading of the west,  
  While in his cabin, orders lie unsealed.  
  **the battle will be fought tomorrow**  
  No star declares which outcome will prove best,  
  No augury compels the future's field.  
  **the battle will not be fought tomorrow**  

  One of these must hold true before the sun,  
  Though neither yet is fastened, fixed, or known.  
  **the battle will be fought tomorrow**  
  The weight of choice is real, not just for show,  
  On this alone his true command is shown.  
  **the battle will not be fought tomorrow**  

  He breathes the salt, the moment poised, unspent,  
  Between the word that summons war or flight.  
  **the battle will be fought tomorrow**  
  The fleet holds station, waiting for command.  
  On deck he hears the water's turn and fall.  
  **the battle will be fought tomorrow**  

  ---

  **Mapping and Presupposition:**  
  The refrain "the battle will be fought tomorrow" maps to the bivalent reading: one branch of the future is metaphysically privileged, making this statement already true (though unknown). It gets the final line to emphasize this reading's claim of a settled, singular future fact. The refrain "the battle will not be fought tomorrow" maps to the open future reading: both remain indeterminate until the admiral's act. The poem presupposes the logical principle that the disjunction (either the battle happens or it doesn't) *is* already settled (Stanza 3), while neither disjunct necessarily is, creating the space for genuine deliberation distinct from epistemic ignorance. The admiral's unresolved decision manifests this metaphysical openness inherent in the future contingent.
