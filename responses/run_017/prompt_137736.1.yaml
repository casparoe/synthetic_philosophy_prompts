prompt: |-
  I organise a monthly applied-rationality meetup in a borrowed seminar room: about fifteen adults, ninety minutes, mostly working programmers plus three cognitive-science grad students, a physician, and two people who have read some Dennett and will arrive with opinions ready. Projector and index cards available; no budget, no special equipment.

  For the next session I want to stage the argument that qualia are an incoherent posit rather than argue it. I have watched that argument get rehearsed in comment threads for years and it never moves anyone, because it is always delivered as a lecture about a word. So: design an activity in which the group runs into the problem themselves, using real choices and small real stakes, and only afterwards discovers what they were arguing about.

  The idea I want the design to turn on is what I call the settlement-aptness constraint. A property is something you can genuinely stake anything on only if a third party could in principle determine, after the fact, whether it obtained. The posit is standardly a bundle of four properties: it is ineffable, intrinsic, private, and immediately apprehensible in consciousness by its subject. Now give participants a private property of this kind and make them adjudicate claims about it. To settle a claim they must produce a public criterion, and each of the three adjudication tasks pulls that criterion somewhere different. Re-identifying the property over time within one subject makes the criterion answer to changes in that subject's own discriminative machinery, which makes the property relational rather than intrinsic. Comparing it across two subjects makes the criterion third-person checkable, which costs it its privacy. Settling a claim about a silent swap — where the subject is the only possible witness — makes first-person report authoritative and unfalsifiable, which costs it the status of a fact anyone could ever have bet on. I want participants to walk into all three walls in succession, in that order, and to build the criteria themselves.

  Constraints on the design:

  1. No framing lecture. The words qualia, phenomenal, inverted spectrum, zombie, and Mary must not appear on any handout or in the facilitator's mouth before the debrief. The group should coin its own term for the private property and discover that they have to police what their own term means.
  2. At least one round must use a real perceptual manipulation that is cheap and reliable with a projector and index cards — colour afterimages, an image with no red pixels that reliably looks red, a shadow-checker display, adaptation to a coloured field — so that something about the experience demonstrably changes while every publicly checkable fact stays fixed.
  3. Small stakes only: chips, chocolate, or the right to leave early. No money.
  4. Three rounds of roughly twenty minutes each and a twenty-five to thirty minute debrief, with a minute-by-minute timeline and a note on what the facilitator does during each silence.
  5. Include the actual text of the contracts or ledger cards participants fill in, the scoring rule, and an explicit rule for what happens if the group refuses to settle a contract or dissolves into metadebate.
  6. Make the collapse visible as a number. Ideally the session ends with a tally on the board showing that the group's own settlement rule either clears a case everyone agrees it should fail or fails a case everyone agrees it should pass.
  7. The debrief should map each round onto one of the four properties, say which of the four is load-bearing — the one a defender should surrender first, and what surrendering it costs — and then handle the three escape routes as participants will actually raise them rather than as a taxonomy from the literature: retreat to a functional or relational property, retreat to the authority of first-person report, and retreat to an ineffable property known only by acquaintance.
  8. Give at least four things that will predictably go wrong the first time this is run, with a specific repair for each. I expect at least: one participant who names the game's point in the first ten minutes and starts narrating it; one who dissolves every contract by declaring the matter unverifiable; one who proposes settling by neural measurement and has to be shown what that rule would let through; and one for whom the whole thing collapses into the problem of other minds.
  9. Be frank about which part of the claim the activity cannot deliver. It can produce the conceptual squeeze, but it cannot produce the metaphysical conclusion, and it does not touch the knowledge argument or the further question of why there is experience at all. Say plainly what the facilitator will have to supply in words, and why no arrangement of roles, incentives, or payoffs could supply it instead.
reasoning: |-
  We are designing an activity for a group of about 15 adults. The goal is to have them experience the conceptual problems with qualia without using any of the standard terminology. The activity will have three rounds, each focusing on a different aspect of the settlement problem: re-identification over time, comparison across subjects, and dealing with a silent swap. We will use a perceptual manipulation (like color afterimages) to create a change in subjective experience that is not publicly checkable.

  ### Overview
  - **Round 1 (Re-identification over time)**: Participants will bet on whether they can re-identify a private experience (e.g., the color of an afterimage) at a later time. This will highlight the problem of intrinsic properties changing due to relational factors (like adaptation).
  - **Round 2 (Comparison across subjects)**: Participants will bet on whether two people are having the same private experience when looking at the same stimulus. This will challenge the privacy of the property.
  - **Round 3 (Silent swap)**: Participants will bet on whether a private experience has been swapped without their knowledge. This will make first-person report unfalsifiable and show that the property cannot be settled by a third party.

  We will use chocolate as stakes. Each participant starts with 3 chocolate pieces. They can bet 0, 1, or 2 pieces in each round. The scoring rule will be such that correct bets double the stake, and incorrect bets lose the stake. We need to design the contracts and the rules for settlement.

  ### Materials
  - Projector for showing images.
  - Index cards (for writing down bets and reports).
  - Chocolate (or another small reward).

  ### Perceptual Manipulation
  We'll use a color afterimage effect. Show a bright colored image (e.g., a green circle) for 30 seconds, then switch to a white screen. Participants will see a complementary color (e.g., red) as an afterimage. This afterimage is a good candidate for a private experience: it's subjective, and there is no publicly checkable red light.

  ### Preparation
  - Prepare a slideshow:
    1. A bright green circle on a black background (for adaptation).
    2. A white screen (for the afterimage).
    3. A set of color swatches (for reporting).

  ### Detailed Timeline (90 minutes total)

  #### Introduction (5 minutes)
  - Facilitator: "Welcome! Today we're going to play a game with three rounds. In each round, you'll have the chance to bet some of your starting chocolate on the outcome of an event. The rules of each round will be explained separately. You start with 3 pieces of chocolate. You can bet 0, 1, or 2 pieces in each round. If you bet and win, you get double your stake. If you lose, you lose your stake. If you don't bet, you keep your chocolate. Let's begin."

  #### Round 1: Re-identification over time (20 minutes)
  - **Goal**: Experience that a subjective property (afterimage color) cannot be re-identified over time because of changes in the subject (adaptation).
  - **Manipulation**: 
    1. Show a green circle for 30 seconds. Then switch to a white screen. Participants see a red afterimage.
    2. After 10 seconds, show a blue circle for 30 seconds. Then switch to white. Participants see a yellow afterimage.
    3. Then show the original green circle again for 30 seconds, then white. But because of adaptation to blue, the afterimage might not be the same as the first time (it might be less intense or different).

  - **Contract**: 
    - Each participant writes on an index card: 
      - "I bet [0,1,2] that the color I see now (after the third exposure) is the same as the color I saw after the first exposure."
    - Then they write down what color they saw the first time and what color they see now (using a set of color names provided, e.g., red, orange, yellow, green, blue, purple, pink).

  - **Settlement**: 
    - The group must decide on a rule to settle the bets. They might propose using the color names reported by the participant. But note: the same person is reporting at two times. 
    - The facilitator notes: The rule must be public and agreed upon. If they choose to use the subject's report, then the property becomes relational (to the subject's own judgment at that time) and not intrinsic.

  - **Outcome**: 
    - After the group settles the bets (by using the reports), reveal that due to the adaptation, the afterimage might have changed. But the reports might not reflect that because the subject might still call it "red" even if it's less intense. Or they might report a change. 
    - The point: the group had to rely on the subject's report, which is a relational property (based on the subject's current discriminatory state) and not an intrinsic, immutable property.

  - **Facilitator's role**:
    - During the silences (while images are being shown), the facilitator just watches the time.
    - After the bets are written, the facilitator asks the group: "How shall we settle these? We need a rule that a third party can apply to determine if the two experiences were the same." 
    - Let the group discuss and agree on a rule (e.g., same color name). Then apply it.

  #### Round 2: Comparison across subjects (20 minutes)
  - **Goal**: Challenge the privacy of the property by trying to compare two subjects' experiences.
  - **Manipulation**: 
    - Show the same green circle to two volunteers (call them A and B). They both see a red afterimage. 
    - But we manipulate the context: one volunteer (A) is shown the green circle after having adapted to a blue circle (so their afterimage might be weaker), and the other (B) is fresh (no adaptation). However, to keep it simple, we might just use two fresh subjects and then ask: are their experiences the same? But we want to create a situation where they might be different. Alternatively, we can use an illusion that is known to vary between individuals (e.g., the dress that some see as blue-black and others as white-gold, but that requires a specific image). Instead, let's use the afterimage again but with a twist: one subject is adapted and the other is not.

  - **Setup**:
    - Choose two volunteers. 
    - Subject A: First shown a blue circle for 30 seconds, then the green circle for 30 seconds, then white (so afterimage is affected by blue adaptation).
    - Subject B: Shown only the green circle for 30 seconds, then white (fresh).
    - Both then report the color of their afterimage.

  - **Contract**:
    - The rest of the group (the non-volunteers) bet on whether the two subjects (A and B) are having the same color experience. They write: "I bet [0,1,2] that A and B are having the same experience of color."

  - **Settlement**:
    - The group must decide how to settle. They might ask A and B to report their colors. If both report "red", then the group might conclude they are the same. But note: A's experience might be less intense. The group has to choose a rule. If they rely on the reports, then the property becomes publicly checkable (the reports are public) and loses privacy. If they say they can't know, then the bet cannot be settled.

  - **Outcome**:
    - The rule they choose (e.g., same word) makes the property public and checkable. If they say they cannot settle, then the property is not settlement-apt.

  - **Facilitator's role**:
    - Guide the group to decide a rule. If they cannot, then the bets are void and no one wins or loses (but this outcome is also instructive).

  #### Round 3: Silent swap (20 minutes)
  - **Goal**: Show that if the subject is the only witness, then a silent swap (a change that only the subject could notice) cannot be settled by a third party.
  - **Manipulation**: 
    - We cannot literally swap an experience, but we can create a scenario where a change might have occurred without any public evidence.
    - Use a color illusion that can be interpreted in two ways, but without any change in the stimulus. For example, show the "cornsweet illusion" or an ambiguous image (like the duck-rabbit) but for color? Alternatively, use the same afterimage method but with a suggestion.

  - **Alternative idea**: Use the "shadow checker" illusion (Adelson's checkerboard) where two squares that are physically the same shade of gray look different because of the shadow. We can show two versions: one where the shadow is present and one where it is removed, but the squares are actually the same. But we want a silent swap in the subject's experience without changing the stimulus.

  - **Better idea**: Use the afterimage again. Tell the participants that sometimes the afterimage might be different because of an undetectable reason (like a change in the projector's bulb, but we don't change anything). We create a scenario where the subject is asked whether the experience has changed, but we don't change the stimulus.

  - **Setup**:
    - Show a green circle for 30 seconds, then white (afterimage red). 
    - Then, without any adaptation, show the green circle again for 30 seconds, then white. The afterimage should be the same. But we tell the subject: "We might have changed the bulb in the projector so that the color is slightly different, but it's undetectable. Did the experience change?"

  - **Contract**:
    - The group bets on whether the subject reports a change. But note: we haven't changed anything. The subject might report a change or not. 
    - Actually, we want the group to bet on whether a change occurred, not on the report. But the only evidence is the report.

  - **Reframing**:
    - We choose one volunteer (the subject). 
    - We do two trials: 
        Trial 1: Green circle -> white (afterimage red).
        Trial 2: Green circle (same) -> white (afterimage red, same).
    - We tell the subject: "In one of the trials, we secretly used a different shade of green. But we won't tell you which one. After both trials, we will ask you if there was a difference in your experience."
    - Actually, we don't change anything. So there is no difference.

  - **Contract for the group**:
    - "I bet [0,1,2] that the subject's experience in the two trials was different (because of the undetectable change)."

  - **Settlement**:
    - The group must settle even though the subject is the only one who experienced it. They might rely on the subject's report. But the subject didn't see a difference. So if the subject says "same", then the group should conclude no difference? But what if the subject says "different"? 
    - The problem: the subject's report is the only evidence. The rule they choose makes the first-person report authoritative and unfalsifiable. There is no way to check independently.

  - **Outcome**:
    - The group's rule (relying on the subject's report) means that the property is not a fact that can be bet on independently of the subject's say-so.

  #### Debrief (25-30 minutes)
  - Reveal that the property they were dealing with is what philosophers call "qualia". Explain the four properties: ineffable, intrinsic, private, and immediately apprehensible.
  - Map each round to one of the properties:
    - Round 1 (re-identification) -> intrinsic (it became relational because of the subject's changing state).
    - Round 2 (comparison) -> private (it became public when they used reports).
    - Round 3 (silent swap) -> immediately apprehensible (but then it became unfalsifiable and not third-party checkable).
  - The load-bearing property: privacy. If you give up privacy, then qualia become public and checkable, but then they are not qualia anymore. If you give up intrinsicality, then they are relational. If you give up immediate apprehension, then they are not directly known.
  - Discuss the escape routes as they come up in the discussion:
    - Retreat to functional properties: then it's not qualia.
    - Retreat to first-person authority: then it's not settlement-apt.
    - Retreat to ineffable properties: then it's not communicable and cannot be the subject of a bet.
  - Show the tally: In each round, the group's settlement rule either passed a case that should have failed (e.g., in Round 3, if the subject had reported a change when there wasn't one, the group would have paid out on a false claim) or failed a case that should have passed (e.g., in Round 1, if the subject's experience changed but they reported the same, the group would have paid out on a changed experience). We can collect examples from the rounds.

  ### Actual Text for Contracts and Ledger

  #### Round 1 Contract (on index card):
  ```
  Round 1: Re-identification

  I, [Your Name], bet [0, 1, or 2] pieces of chocolate that the color experience I am having now (after the third exposure) is the same as the one I had after the first exposure.

  First experience color: __________
  Current experience color: __________
  ```

  #### Settlement Rule for Round 1 (to be decided by the group):
  The group must agree on a rule. Example: "We will compare the two color names. If they are the same word, then the experiences are the same."

  #### Round 2 Contract:
  ```
  Round 2: Comparison across subjects

  I, [Your Name], bet [0, 1, or 2] pieces of chocolate that the two subjects (A and B) are having the same color experience.

  Subject A's report: (to be filled by A) __________
  Subject B's report: (to be filled by B) __________
  ```

  #### Settlement Rule for Round 2:
  Group decides. Example: "If A and B report the same color name, then their experiences are the same."

  #### Round 3 Contract:
  ```
  Round 3: Silent Swap

  I, [Your Name], bet [0, 1, or 2] pieces of chocolate that the subject's experience in the two trials was different (due to an undetectable change in the stimulus).

  Subject's report: (Did you notice a difference? Circle: YES / NO)
  ```

  #### Settlement Rule for Round 3:
  Group decides. Example: "If the subject reports 'YES', then the experiences were different. If 'NO', then they were the same."

  ### Scoring Rule
  - For each round, if the participant's bet is settled as correct, they receive twice the staked chocolate.
  - If incorrect, they lose the staked chocolate.
  - If the group cannot settle a contract (e.g., they cannot agree on a rule or the rule is inconclusive), then the bets are void and no chocolate is won or lost.

  ### Rule for Group Refusal to Settle
  - If the group cannot agree on a settlement rule within 5 minutes of discussion, the facilitator will note that the contract is void and no bets are settled (everyone keeps their stake for that round).

  ### Making the Collapse Visible
  - At the end of Round 3, the facilitator tallies:
    - In Round 1: How many people reported the same color? How many reported a change? But note: the settlement rule might have declared all same-reports as wins, but objectively (due to adaptation) the experience changed for many. So the rule passed cases that should have failed (if we think the experience changed but they said same) or failed cases that should have passed (if they changed and reported change, but the rule was same word -> same experience, then they would have lost even though they were correct that the experience changed? Actually, the bet was that the experience was the same. So if the experience changed, then the bet "same" is wrong. But the rule might have declared them winners if they reported the same word. So the rule passed a bet that was objectively wrong? Not exactly, because we have no objective access. The point is: the rule they chose (same word) does not track the actual experience (which might change without a word change). We can only show that the rule they chose is flawed by the fact that the same word might be used for different experiences, or vice versa.

  - We need a way to show the rule fails. In Round 2: if both subjects report "red", but we know that one had a weaker afterimage, then the rule says same, but the experiences might be different. We can explain this in the debrief.

  ### What the Activity Cannot Deliver
  - The activity produces the conceptual squeeze: that a property with the four features cannot be the subject of a bet because it fails settlement-aptness. 
  - It does not prove that qualia do not exist. It only shows that if they are defined with these four properties, then we cannot use them in any intersubjective discourse or bet. 
  - It does not address the knowledge argument (Mary the color scientist) or why there is experience at all. 
  - The facilitator will have to explain that the activity shows the incoherence in the concept, not the non-existence of experience. The metaphysical conclusion (that qualia are not real) is a further step that requires argumentation.

  ### Predictable Problems and Repairs

  1. **Participant names the game's point early**:
     - Repair: Acknowledge and ask them to play along. "You might see where this is going, but please play the game as if you didn't, so that others can discover it."

  2. **Participant declares every contract unverifiable and refuses to settle**:
     - Repair: In the rule-making phase, ask the group: "If we cannot settle, then we cannot have bets. But we want to have the game. So what rule can we use that is verifiable, even if imperfect?" If they insist, then that round is void, and in the debrief, point out that this is exactly the problem: the property is not settlement-apt.

  3. **Proposes settling by neural measurement**:
     - Repair: "We don't have neural equipment. But suppose we did: what neural signal would you use? How would you know which neural pattern corresponds to which experience? We would have to rely on the subject's report to calibrate, which brings us back to the same problem." In the debrief, explain that neural measurements are public, but they are only correlated with experience by the subject's report, so they don't capture the intrinsic private property.

  4. **Collapses into the problem of other minds**:
     - Repair: Acknowledge the similarity. Then point out that the problem of other minds is about knowing whether others have minds at all, but here we are assuming they have experiences and then trying to compare them. The issue is not existence but the nature of the properties.

  ### Final Note
  The activity is designed to create an experience of the conceptual tension. The debrief is crucial to connect the dots. The facilitator should be prepared to explain the philosophical context after the activity.

  Let's now write the detailed minute-by-minute plan.
answer: |-
  ### Activity Design: "Private Experience Settlement Game"

  #### **Core Structure**
  - **3 Rounds** (20 min each) + **Debrief** (25 min)
  - **Stakes**: Chocolate coins (3 per participant at start)
  - **Betting**: Each round, participants bet 0-2 chocolates. Correct bets win double stake; incorrect lose stake.
  - **Key Mechanism**: Groups of 3-4 negotiate "settlement rules" for contracts about private experiences. Rules must be public, pre-agreed, and testable by a third party.

  ---

  ### **Round 1: Re-identification Over Time**  
  *Targets "intrinsic" property by forcing reliance on changing discriminative machinery.*  
  **Materials**: Projector, index cards, timer.  
  **Stimulus**:  
  1. Show bright **green circle** on white background for 30 sec.  
  2. Switch to white screen: participants see **red afterimage**.  
  3. Repeat after 5 min, but first show **blue circle** for 15 sec (adaptation weakens afterimage intensity).  

  **Contract Text** (index card):  
  > *"I, [Name], bet [0/1/2] chocolates that my current red-like experience (Post-Blue) is identical to my original red-like experience (Pre-Blue)."_  

  **Settlement Task**:  
  - Group creates a rule to verify if the two experiences were "identical."  
  - **Predictable Proposal**: "Same verbal description" (e.g., both called "vivid red").  
  - **Collapse**: Adaptation makes experiences objectively different, but subjects use identical words. Rule passes bets that should fail.  

  **Facilitator Actions**:  
  - 0-5 min: Run stimulus silently.  
  - 5-15 min: Groups negotiate settlement rules.  
  - 15-20 min: Apply rules, collect bets.  
  - **Silence Use**: Observe group dynamics; note proposals about memory/description.  

  ---

  ### **Round 2: Cross-Subject Comparison**  
  *Targets "privacy" by forcing public criteria for comparison.*  
  **Materials**: Index cards, projector, two colored cards (e.g., teal/turquoise indistinguishable under dim light).  

  **Stimulus**:  
  - Pair participants. Show both the **same ambiguous card** (e.g., teal) under dim projector light.  
  - Secretly tell Partner A it’s "Ocean Blue"; Partner B "Mint Green."  

  **Contract Text**:  
  > *"I, [Name], bet [0/1/2] chocolates that Partner A and Partner B are having the same color experience right now."_  

  **Settlement Task**:  
  - Group creates a rule to verify "same experience" across people.  
  - **Predictable Proposal**: "Agreement on color name" or "same neural scan" (hypothetical).  
  - **Collapse**: Partners report different labels ("blue" vs. "green") for identical stimuli. Rule fails bets that should pass (same stimulus → assumed same experience).  

  **Facilitator Actions**:  
  - 0-3 min: Run stimulus.  
  - 3-13 min: Groups negotiate rules.  
  - 13-20 min: Apply rules; reveal secret prompts.  
  - **Silence Use**: Track if groups invoke behavior/biology vs. subjective reports.  

  ---

  ### **Round 3: Silent Swap**  
  *Targets "immediate apprehension" by making first-person authority unfalsifiable.*  
  **Materials**: Projector, index cards.  

  **Stimulus**:  
  1. Show **grayscale checkerboard** with shadow illusion (two identical grays look different).  
  2. Secretly toggle projector settings to identical brightness.  
  3. Ask: "Did tile X change brightness? (Y/N)"  

  **Contract Text**:  
  > *"I, [Name], bet [0/1/2] chocolates that tile X’s brightness experience changed between View 1 and View 2."_  

  **Settlement Task**:  
  - Group creates a rule to verify if a "silent swap" occurred.  
  - **Predictable Proposal**: "Subject’s yes/no report is final."  
  - **Collapse**: Physically, nothing changed. Rule pays out based on arbitrary reports.  

  **Facilitator Actions**:  
  - 0-2 min: Run stimulus.  
  - 2-12 min: Groups negotiate rules.  
  - 12-20 min: Apply rules; reveal no change occurred.  
  - **Silence Use**: Note if groups debate unreliability of perception.  

  ---

  ### **Debrief (25 min)**  
  **Step 1: Tally Collapse (5 min)**  
  - Board Summary:  
    ```  
    Round 1: Rule passed X bets (but experiences differed)  
    Round 2: Rule failed Y bets (but stimuli were identical)  
    Round 3: Rule paid Z chocolates (but no change occurred)  
    ```  

  **Step 2: Reveal the "Private Property" (10 min)**  
  - "You tried to define a property that is:  
    (1) **Ineffable** (can’t be fully described),  
    (2) **Intrinsic** (depends only on you),  
    (3) **Private** (only you access it),  
    (4) **Immediately Apprehended** (directly known).  
    Philosophers call this *qualia*—but you built the trap yourselves."  

  **Step 3: Map Rounds to Properties & Escape Routes (10 min)**  
  - **Round 1**: "Intrinsic" failed → experiences changed with context (relational).  
    *Escape route*: "It’s functional!" → But then it’s not intrinsic qualia.  
  - **Round 2**: "Private" failed → needed public checks (reports/scans).  
    *Escape route*: "Use behavior!" → Then it’s not private.  
  - **Round 3**: "Immediate Apprehension" failed → reports are unfalsifiable.  
    *Escape route*: "Only the subject knows!" → Then it’s not settlement-apt.  
  - **Load-bearing property**: **Privacy**. Surrendering it makes qualia public; keeping it makes them useless.  

  ---

  ### **Handling Predictable Problems**  
  1. **Participant names the game early**:  
     - *Repair*: "Great insight! But let’s see if the group’s settlement rules work in practice."  

  2. **Participant declares all contracts unverifiable**:  
     - *Repair*: Enforce a rule: "If no settlement is agreed in 5 min, all bets are void. But you lose the chance to win chocolate."  

  3. **Proposes neural measurements**:  
     - *Repair*: "Suppose we scan brains. What pattern counts as ‘same experience’? Calibration requires subjective reports—which we already saw can mismatch (Round 2)."  

  4. **Collapses into problem of other minds**:  
     - *Repair*: "We’re assuming experiences *exist*. We’re asking: can we settle *claims* about them? If not, we can’t use them in contracts."  

  ---

  ### **What the Activity Cannot Deliver**  
  - **Metaphysical conclusion**: The activity shows *conceptual* incoherence, not that experience is illusory.  
  - **Knowledge argument/Mary’s room**: No payoff structure can simulate Mary’s new knowledge.  
  - **"Why experience at all?"**: The hard problem remains untouched.  

  **Facilitator must explicitly state**:  
  > "This shows qualia *as defined* can’t play a role in shared reasoning. It doesn’t prove consciousness isn’t real—it proves we can’t use private properties in public contracts. The rest requires philosophy, not betting."  

  ---

  ### **Materials Appendix**  
  - **Ledger Cards**:  
    ```  
    [ROUND 1]  
    My bet: ___ chocolates.  
    Pre-Blue description: ___________  
    Post-Blue description: ___________  
    Group’s settlement rule: _________________________  
    ```  

  - **Scoring Rule**: Correct = +2× stake; Incorrect = − stake; Void = 0.  
  - **Settlement Refusal Rule**: 5-min time limit → void all bets if no agreement.  

  ---  
  This design forces participants to build (and break) their own definitions of "private experience," using perceptual illusions to create objective anchors. The chocolate stakes create skin-in-the-game without ethical risks.
