  The employee is sophisticated and knows that if she chooses Plan B, then at t1 she will be offered the acceleration and she will take it (because of her short-run impatience) for some $n < $110, say $95.

  Then at t0, she compares:
  - Plan A: $100 at t1.
  - Plan B with acceleration: $95 at t1.

