  At t1, she is about to receive $102 at t1 (now). The exploiter offers: "Give up $102 at t1, and I will give you $101 at t1 immediately." This is the same as offering to buy her IOU for $102 at t1 for $101 cash at t1. Why would she accept? Because if she values the money now (at the beginning of t1) versus waiting until the end of t1? We haven't modeled within-day waiting.

