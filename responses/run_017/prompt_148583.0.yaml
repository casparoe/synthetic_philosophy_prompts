  But we want her to be worse off. So we need her to have an option that she doesn't take that is better.

  Notice that in this setup, she never gets the $100 at t2. The institution does not allow her to wait until t2 without being offered the acceleration at t1. So she is forced to choose between $95 at t1 and $85 at t1, and she chooses the better one, $95.

  But by her t0 preferences, both are better than $100 at t2? 95 * 0.95 = 90.25 > 85, and 85 * 0.95 = 80.75 < 85? Let's calculate the value of the do-nothing option at t0: it leads to $85 at t1, value 85 * 0.95 = 80.75, which is less than 85. So the do-nothing option is worth 80.75, and the accelerate-at-t0 option is worth 90.25, and the no-acceleration (which is not available) would be 85.

   So she is choosing between 90.25 and 80.25, so she chooses 90.25, which is greater than the unavailable 85. So she is better off. 

  We want her to end up with less than the value of the original $100 at t2.

  So let's set the fees so that the accelerate at t0 option is also below the value of $100 at t2.

  Value of $100 at t2 at t0: 85.
  Value of accelerate at t0: she gets $x at t1, so x * 0.95.
  We want x * 0.95 < 85 -> x < 85/0.95 = 89.47.

  So set the fee for acceleration at t0 such that she gets $89 at t1.
  Then the value is 89 * 0.95 = 84.55 < 85.

  For the acceleration at t1: she gets $y at t1, and we want that at t1 she will prefer it to $100 at t2: y > 100 * 0.6 = 60.
  Set y = 80, for example.

  Then at t0, the options are:
  - Accelerate at t0: $89 at t1, value 84.55.
  - Do nothing at t0: then at t1 she will choose to accelerate to $80 at t1, value at t0: 80 * 0.95 = 76.

  So she chooses to accelerate at t0 and gets $89 at t1, valued at 84.55 at t0, which is less than 85.

   So she is worse off by her t0 preferences.

  And the payroll system gains: if she accelerates at t0, they pay $89 at t1 instead of $100 at t2. The present value to the payroll of $100 at t2 is of course $100 at t2, but they save $100 - $89 = $11 at t2 by paying earlier and less. Specifically, they might have to pay $89 at t1 and were originally going to pay $100 at t2. The net cost to them: they pay $89 at t1 instead of $100 at t2. If their discount rate is positive, they prefer to pay later. But we can assume they are risk-neutral and have a positive discount rate, so they would rather pay later. But here they are paying earlier and a reduced amount. In present value at t0, they might be better off or worse off. To ensure they are strictly richer, we can have them simply have the $100 at t2 available, but by this process, they only pay $89 at t1. The difference in present value might be in their favor. Or we can say that they are a large institution that can borrow and lend at will, so they are indifferent to the timing and only care about the nominal amount. Then they prefer to pay 89 at t1 rather than 100 at t2 if 89 < 100 in present value at their discount rate. If their discount rate is zero, then they are better off by $11. If their discount rate is positive, then paying 89 at t1 might be more costly than 100 at t2. To ensure they are better off, assume they have a zero discount rate. Then:
  - If they did nothing, they would pay 100 at t2.
  - Instead, they pay 89 at t1.
  - So they save 100 - 89 = 11 in present value (since no discounting).

   So they gain $11.

  And they bear no risk and produce nothing.

  Now, is the gain a fee for a service? The service is earlier payment, which the agent might value. But in this case, the agent's later self (at t1) values earlier payment, but her initial self would have preferred to wait for $100 at t2. The institution is offering a service that the initial self does not want, and the later self does want, and because of the institutional setup, the later self's choice is anticipated and leads to the initial self making a choice that is harmful.

  So the pump is that because of the declining impatience and the inability to commit, and because of the institutional setup that forces the later choice upon her, she ends up paying to accelerate at t0 to avoid an even worse acceleration at t1.

