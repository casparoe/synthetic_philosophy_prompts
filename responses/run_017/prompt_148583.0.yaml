answer: |-
  ### Scenario: University Payroll Bonus Adjustment System  
  A university offers a non-negotiable bonus program to its employees. The bonus is initially scheduled as **$100 payable in 60 days (Time 2)**. The payroll system has two fixed decision points:  
  1. **At Time 0 (today)**, the employee must choose whether to pay a fee to accelerate the bonus to Time 1 (30 days from now). If she pays the fee, she receives **$89 at Time 1**.  
  2. **At Time 1 (30 days from now)**, if she did *not* accelerate at Time 0, the system automatically presents her with a second acceleration offer: receive **$80 at Time 1** by paying a larger fee.  

  The employee *cannot opt out of the Time 1 offer* if she still holds the Time 2 payment—it is a mandatory feature of the payroll system. She foresees this entire schedule, including her future preferences. Her discounting exhibits declining impatience: she is relatively patient for long delays but highly impatient for short delays.  

  The employee’s choices:  
  - If she accelerates at Time 0, she gets **$89 at Time 1** and avoids the Time 1 offer.  
  - If she does nothing at Time 0, the Time 1 offer triggers. At Time 1, she will always accept it (due to short-run impatience), getting **$80 at Time 1**.  
  - She cannot retain the $100 at Time 2 because the Time 1 offer is forced upon her if she does not accelerate earlier.  

  **Device to prevent opt-out**: The Time 1 offer is *automatically presented by the payroll system* to all employees who have not yet accelerated their bonus. This is not "cheating" because it reflects real institutional policies (e.g., companies that auto-enroll employees in deadlines or adjustments). The employee cannot block it—she can only avoid it by accelerating at Time 0.  

  **Exploiter’s role**: The university (as the exploiter) posts this fee schedule in advance. It gains $11 in present value (assume it discounts at 0%): $100 saved at Time 2 minus $89 paid at Time 1. This gain is purely arbitrage: the university provides no service (e.g., liquidity) the employee’s Time 0 self values, as she would prefer $100 at Time 2 over any acceleration fee paid.  

  ---

  ### Preference Structure and Discounting  
  The employee has hyperbolic discounting (a common declining impatience model):  
  - **Discount factors**:  
    - *At Time 0*: $1 at Time 1 = $0.95, $1 at Time 2 = $0.85.  
      - Discount factor Time 1 to Time 2 (viewed from Time 0): $0.85 / $0.95 ≈ $0.895.  
    - *At Time 1*: $1 at Time 2 = $0.60.  

  **Dated comparisons (utilities in Time 0 present value units)**:  
  - *Time 0 preferences*:  
    - $100 at Time 2: Utility = 100 × 0.85 = 85.0  
    - $89 at Time 1: Utility = 89 × 0.95 = 84.55  
    - $80 at Time 1: Utility = 80 × 0.95 = 76.0  
    - **Preference at Time 0**: $100 at Time 2 (85.0) ≻ $89 at Time 1 (84.55) ≻ $80 at Time 1 (76.0).  
  - *Time 1 preferences* (if she holds the $100 at Time 2):  
    - $100 at Time 2: Utility = 100 × 0.60 = 60.0  
    - $80 at Time 1: Utility = 80 × 1.00 = 80.0  
    - **Preference at Time 1**: $80 at Time 1 (80.0) ≻ $100 at Time 2 (60.0).  

  **Choice sequence and outcomes**:  
  1. **Time 0 choice**:  
     - Option 1: Accelerate to $89 at Time 1 (utility 84.55).  
     - Option 2: Do nothing (leads to Time 1 offer).  
     - Sophisticated foresight: She knows if she does nothing, she will get $80 at Time 1 (utility 76.0 at Time 0).  
     - **She chooses to accelerate** because 84.55 > 76.0.  
  2. **End state**: She receives $89 at Time 1.  

  **Dominance check (by Time 0 preferences)**:  
  - Final outcome: $89 at Time 1 (utility 84.55).  
  - Alternative without the pump: $100 at Time 2 (utility 85.0).  
  - 84.55 < 85.0 → Strictly worse off by her Time 0 lights.  
  - **By her Time 1 lights**: At Time 1, she has $89 now (utility 89.0). She prefers this to $100 at Time 2 (utility 60.0), so she is content.  

  ---

  ### Verdicts of Rationality Accounts  
  | Account                | Exploited? | Irrational? | What she should have done      |  
  |------------------------|------------|-------------|--------------------------------|  
  | **Sophisticated BI**   | Yes        | No          | Accelerate at Time 0 (best available choice given future actions). |  
  | **Resolute/Plan-based**| Yes        | Yes         | Commit at Time 0 to reject all accelerations (even if Time 1 self prefers $80). |  
  | **Successive Selves**  | Yes        | No          | Each self acts optimally: Time 0 minimizes loss; Time 1 would accelerate if given the chance. |  

  ---

  ### Isolating the Key Features  
  The pump works only when **all three conditions hold**:  
  1. **Non-stationarity (declining impatience)**: Without it (e.g., constant discount rate), the Time 0 and Time 1 discount factors align. She would reject all fees and keep $100 at Time 2.  
  2. **Inability to bind future self**: If she could commit at Time 0 to reject the Time 1 offer, she would keep $100 at Time 2 (utility 85.0).  
  3. **Unblockable later offers**: If she could opt out of the Time 1 offer, she would reject it and keep $100 at Time 2.  

  **Real work vs. Enablers**:  
  - **Real work**: Non-stationarity causes the preference reversal that the pump exploits.  
  - **Enablers**: Inability to bind and unblockable offers create the arena for exploitation but do not generate the reversal.  

  ---

  ### Defender of Declining Impatience Response  
  A defender would argue:  
  > "This case does not show declining impatience is *irrational*—it shows it is *costly* in a world with arbitrageurs like the university. The employee’s preferences are consistent and forward-looking; she maximizes utility at each moment given institutional constraints. The money pump arises from the university’s predatory fee schedule, not from a failure of rationality. Rationality should not require indifference to timing, only coherence. Institutions exploiting time-sensitive preferences are the problem, not the preferences themselves."  

  **Purpose achieved**: The case forces a choice:  
  - If rationality requires immunity to money pumps, declining impatience is irrational.  
  - If rationality is about coherence at each time, the pump is an external cost of having human-typical preferences in an exploitative world.  

  This leaves the seminar with a clear dilemma: Should rationality be defined by dynamic consistency (rejecting declining impatience) or by synchronic coherence (accepting it as expensive but not irrational)?
