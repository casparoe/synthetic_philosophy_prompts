   At t1, if she has not accelerated, she has the right to $100 at t2. Then the payroll offers her: "You can choose to receive $85 at t1 instead of $100 at t2." And at t1, she will choose to accelerate because 85 > 100 * δ_{t1}(t2) = 100 * 0.6 = 60.

  So if she does nothing at t0, she ends up with $85 at t1.

  At t0, she can choose to accelerate to $95 at t1.

