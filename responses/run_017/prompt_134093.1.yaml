  The user’s real ask: which intuition matters for possibility? Answer: conceptual coherence is necessary but not sufficient; metaphysical possibility requires more. Zombie arguments rely on smooth intuition, but critics call it unreliable. The user’s friend might conflate imaginability with possibility, while the user is more skeptical. 

  Practical advice: in debates, dissect which "seems possible" is in play. For zombies, challenge if smoothness implies possibility. For morning star, check if conceptual gaps reflect epistemic limits. 

