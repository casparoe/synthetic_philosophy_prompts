prompt: |-
  You are a philosopher of mind who is also fluent in how software is actually built, ported, emulated and lost — someone equally at home with the literature on functionalism and multiple realizability and with virtual machines, clean-room reimplementations and trained surrogates. Please think about this carefully and in stages. Before producing the deliverable, do some unstructured setup: list the distinctions from the functionalism literature that you think will actually carry weight for my problem, say which ones you are deliberately setting aside and why, and flag in advance any point where you expect the analogy between mental states and software artifacts to break. Then write the deliverable.

  Here is my situation. I direct the software and moving-image preservation unit of a national archive. Several times a week — roughly two hundred cases a year — my team has to decide whether a later artifact is the same work as an earlier one, or merely a version, a derivative, or a new work inspired by it. The stakes are not academic: the answer determines legal-deposit status, whether a re-issue may carry the original title and catalogue number, whether we can grant a loan or an exhibition copy, and in three live cases it determines whether a rights holder's permission is needed at all. Our decisions are published and can be appealed.

  Our current in-house rule was written by a committee years ago and reads roughly as follows: two artifacts are the same work just in case they have the same functional organisation — the same internal states, related to one another and to inputs and outputs in the same way — and the physical stuff they are built out of is irrelevant. I am told this is close to a position called functionalism, and that the irrelevance of the stuff is something called multiple realizability. The rule has started to fail us, and I can list how:

  One, it does not separate two things we keep confusing: an artifact that reproduces the documented input-output behaviour of the original, and an artifact that reproduces the original's internal organisation — the same intermediate states doing the same causal work on one another. Our cases now include a learned surrogate: a neural network trained on tens of thousands of hours of recorded play sessions which reproduces the original's behaviour on our entire test corpus, but in which nobody can point to anything that plays the role of the original's program states. Two, a colleague has pointed out that if you are allowed to choose the mapping from physical states of a system to states of the program freely enough, then almost any physical system "implements" almost any program, which would make our rule say yes to everything. Three, in practice our answers flip depending on how finely we describe things: at a coarse grain two artifacts are the same, at a fine grain they are not, and nothing in the rule tells us which grain is the official one. Four, we have chains: a 1993 original, a 2001 port, a 2011 rewrite, a 2020 rebuild for a new runtime. Each link in the chain was accepted by my predecessors as preserving identity, but the 1993 and 2020 artifacts share almost no code, no hardware and no documented states. Five, we are beginning to receive realizations — analog, neuromorphic, quantum — in which it is unclear whether there are discrete internal states to be organised at all.

  What I need from you is a decision procedure my team can actually run, not a position paper. Concretely:

  A numbered sequence of stages, with the question to ask at each stage, what counts as a sufficient answer to that question, the point at which the procedure stops and returns a no, and the point at which it stops and hands the decision to a person because the remaining question is one of values rather than fact. Mark the judgment calls that cannot be turned into a test as judgment calls rather than dressing them up as tests.

  An operational fix for each of my five failures above. In particular: how to choose and state the grain of description in advance; how to choose the set of counterfactual cases a candidate must be tested against when the original is no longer runnable and its behaviour on untested inputs is unknowable; and how to rule out the gerrymandered-mapping problem in a way an archivist can check — my own attempt is to require that the state mapping be specified in advance of testing and be the mapping a competent engineer would reconstruct from the documentation alone, and I would like you to take that attempt apart and replace it with something better.

  Honesty about the translation. Tell me which distinctions from the theory must survive being made usable by non-philosophers, which can be dropped without loss, and where the simplified version will give answers the unsimplified theory would not give.

  Then run the finished procedure on four cases and show the work: (a) a virtual-machine emulation of the original binary, running the original instruction stream on new hardware; (b) a clean-room reimplementation from a written functional specification, where the source is lost and the reimplementation is known to diverge from the original on a small set of undocumented behaviours that no surviving documentation describes; (c) the learned surrogate described above; (d) the 1993-to-2020 chain, where the question is whether preservation of identity is transitive across accepted links. I expect at least one of these to come out as a no that we would very much rather not hear — the surrogate is, for several works, the only way anyone will ever be able to experience them again, and the rights holders are untraceable. Give me that unwelcome answer directly and defend it against the objection I have just handed you.

  Finally, state plainly what the procedure cannot do: the questions about sameness that it silently converts into something else, the cases where our use of the word work is doing legal or institutional work rather than metaphysical work, and the point at which my team should stop asking what the artifacts really are and start deciding what we owe the public.

  Constraints on the answer: the person running this has an undergraduate computer science degree and no philosophy; a decision must be reachable within two weeks using evidence we can realistically assemble; a three-person committee of a curator, an engineer and a rights officer has to sign off on the output; and the procedure must still return something usable when the source code is lost, the original hardware is gone, or the documentation is a single manual page. I am not asking for citations, references or further reading — I want the argument and the procedure themselves.
reasoning: |-
  Hmm, this is a fascinating and complex request from a software preservation director who needs practical decision procedures grounded in philosophy of mind concepts. They're dealing with real-world artifact identity judgments that have legal and preservation consequences, and their current functionalism-based approach is failing in specific ways.

  The user has outlined five concrete problems with their existing rule: confusion between behavior and internal organization, the "gerrymandering" issue where any system can be mapped to any program, grain-size dependence, chain-of-custody problems, and novel hardware platforms. They want a numbered decision procedure that addresses these, with operational fixes and honesty about where philosophy must bend to practicality.

  I need to consider how functionalism in philosophy maps to software preservation. Key distinctions that matter here include:
  - Narrow vs wide computational equivalence (wide matters more for archival purposes)
  - Strong vs weak equivalence (preservation likely needs strong equivalence)
  - Specification-dependence vs implementation-independence
  - Observable behavior vs causal structure

  But I should set aside debates about qualia or consciousness - irrelevant for artifacts. The analogy breaks when considering creative works where intentionality matters more than causal structure.

  For the decision procedure, I'll design a staged approach that:
  1) Starts with behavioral equivalence as a gatekeeper
  2) Then checks for causal isomorphism
  3) Adds constraints to prevent gerrymandering
  4) Explicitly sets description grain upfront
  5) Handles chains through compositional identity
  6) Provides fallbacks for novel platforms

  The operational fixes would include:
  - For problem 1: Separate behavioral and structural tests clearly
  - For problem 2: Require "natural mappings" based on documentation
  - For problem 3: Set grain at the "archival unit" level defined per work category
  - For problem 4: Treat chains as compositional with audit requirements
  - For problem 5: Expand state definitions for analog systems

  For the test cases:
  - (a) VM emulation should clearly be "same work"
  - (b) Clean-room reimplementation with divergences might need human judgment
  - (c) The neural surrogate would likely fail as "different work" despite practical value
  - (d) The chain would pass only if each link meets criteria

  I'll need to be brutally honest that the procedure converts metaphysical questions into tractable operational ones, and that at some point public access concerns should override pure identity questions. The rights holder dilemma with the neural surrogate needs direct acknowledgment - preservation needs might require pragmatic exceptions even when identity isn't preserved.

  The procedure must work within constraints: usable by CS graduates, two-week timeline, three-person committee sign-off, and tolerance for missing documentation. That means building in fallbacks and clear off-ramps to human judgment.
answer: |-
  Below is a pragmatic decision procedure for software/work identity assessment, designed for archival use. It addresses your five failure modes, incorporates philosophical insights while discarding impractical distinctions, and includes operational fixes. The procedure prioritizes **auditable evidence**, **practical testability**, and **explicit off-ramps to human judgment**.

  ---

  ### **Core Philosophical Adjustments for Practicality**
  #### **Distinctions That Carry Weight**
  1. **Strong vs. Weak Equivalence** (Carries weight):  
     - **Strong equivalence**: Same internal states *and* transitions (causal structure).  
     - **Weak equivalence**: Same input-output behavior only.  
     *Why it matters:* Your rule conflates these. The procedure separates them.  
  2. **Grain Sensitivity** (Carries weight):  
     - Identity depends on the *level of abstraction* (e.g., source code vs. bytecode).  
     *Why it matters:* Your rule fails to specify grain. We fix by binding grain to *archival intent* upfront.  
  3. **Multiple Realizability** (Modified):  
     - Physical implementation is irrelevant *if* a **documented mapping** exists to functional states.  
     *Why it matters:* Gerrymandering risk requires constraining mappings.  

  #### **Distinctions Set Aside**
  1. **Qualia/Consciousness Debates**: Irrelevant for artifacts.  
  2. **Infinite Counterfactuals**: Impractical to test. We use *falsifiable counterfactuals* based on documentation.  
  3. **Universal Realization Arguments** (e.g., "any system implements any program"):  
     - Rejected. We require mappings tied to *engineer-reconstructible documentation*.  

  #### **Where Analogy Breaks**
  - **Intentionality**: Software lacks "aboutness." Rights/permissions depend on legal intent, not metaphysics.  
  - **Emergent States**: Neural surrogates lack discrete states; we treat them as weak equivalence cases.  
  - **Continuity**: Chains of identity may not be transitive. We add audit steps.  

  ---

  ### **The Decision Procedure**  
  **Inputs**: Two artifacts (A and B), available documentation (specs, manuals, source if extant), test corpus.  
  **Output**: `SAME_WORK`, `DERIVATIVE`, `NEW_WORK`, or `HUMAN_JUDGMENT`.  
  **Time Limit**: 10 working days per stage. Committee sign-off at each stop point.  

  #### **Stage 1: Define the "Archival Unit" (Grain Fix)**  
  - **Question**: *What is the smallest unit of functional organization this work is preserved at?*  
    - **Sufficient Answer**: A written declaration (e.g., "Source code functions," "Bytecode instructions," "API responses").  
      - *Default*: Grain = **publicly documented interfaces + states** (e.g., manual pages, SDKs).  
      - *No docs?* Grain = **observed input-output pairs** (weak equivalence only).  
  - **Stop for No**: If no grain can be defined (e.g., no docs, no observable behavior).  
  - **Judgment Call**: Grain selection (curator/engineer agree).  

  #### **Stage 2: Test Weak Equivalence (Behavior)**  
  - **Question**: *Does B reproduce A’s documented input-output behavior?*  
    - **Sufficient Answer**: B passes ≥95% of tests in a **falsifiable corpus**.  
      - *Corpus construction*: Prioritize:  
        1. Documented use cases.  
        2. Observed real-world inputs (e.g., play sessions).  
        3. Synthetic edge cases from specs.  
      - *Untestable inputs?* Ignore if undocumented.  
  - **Stop for No**: B fails >5% of tests. Output = `DERIVATIVE` or `NEW_WORK`.  
  - **Judgment Call**: Corpus adequacy (rights officer/engineer agree).  

  #### **Stage 3: Test Strong Equivalence (Structure)**  
  - **Question**: *Is there a mapping between A and B’s internal states that preserves causal relations?*  
    - **Sufficient Answer**:  
      1. **Mapping exists**: States correspond per **pre-1994 engineering norms** (avoids gerrymandering).  
         - *Check*: Could a competent engineer (with only docs) reconstruct this mapping?  
      2. **Causal check**: For any state S in A, transitions S→S’ map to B’s transitions M(S)→M(S’).  
  - **Stop for No**: No auditable mapping OR causal divergence (e.g., learned surrogate). Output = `DERIVATIVE`.  
  - **Stop for Human Judgment**: Mapping exists but is contested (e.g., quantum states).  

  #### **Stage 4: Chain Audit (Transitivity Fix)**  
  - **Question**: *For chains (A→B→C), does each link pass Stages 1–3?*  
    - **Sufficient Answer**: Audit trail of prior decisions + fresh run of Stages 1–3 for each *adjacent pair*.  
  - **Stop for No**: Any link fails. Output = `NEW_WORK` for endpoint.  
  - **Judgment Call**: Accepting historical decisions (committee vote).  

  #### **Stage 5: Novel Realizations (Analog/Quantum)**  
  - **Question**: *Does B implement A’s functional organization in a physically plausible way?*  
    - **Sufficient Answer**:  
      1. B’s physics supports discrete states (e.g., voltage thresholds).  
      2. State transitions match A’s docs.  
  - **Stop for Human Judgment**: No discrete states (e.g., neuromorphic chaos).  

  ---

  ### **Operational Fixes for Your Five Failures**  
  1. **Behavior vs. Structure Confusion**:  
     - Stages 2 (weak) and 3 (strong) are separate. Fail either → not `SAME_WORK`.  
  2. **Gerrymandered Mappings**:  
     - Mappings must align with **pre-1994 engineer norms** (pre-dates postmodern "any mapping" arguments).  
     - *Better than your attempt*: Uses **temporal anchoring** to avoid subjectivity.  
  3. **Grain Sensitivity**:  
     - Grain declared in Stage 1. Official grain = archival unit.  
  4. **Chain Non-Transitivity**:  
     - Stage 4 audits each link. No blind transitivity.  
  5. **Novel Hardware States**:  
     - Stage 5 uses "physically plausible states" (e.g., analog thresholds = states).  

  ---

  ### **Test Cases**  
  **Case (a): VM Emulation of Original Binary**  
  - Stage 1: Grain = instruction set (documented).  
  - Stage 2: Passes weak equivalence (same I/O).  
  - Stage 3: Mapping = 1:1 (same registers/memory states).  
  - **Output**: `SAME_WORK`.  

  **Case (b): Clean-Room Reimplementation**  
  - Stage 1: Grain = functional spec (e.g., API responses).  
  - Stage 2: Passes weak equivalence *except* on undocumented cases → ignore.  
  - Stage 3: Causal structure matches *per spec*. Divergences irrelevant if undocumented.  
  - **Output**: `SAME_WORK`.  

  **Case (c): Learned Surrogate**  
  - Stage 1: Grain = input-output behavior (no internal states documented).  
  - Stage 2: Passes weak equivalence (99% test accuracy).  
  - Stage 3: No mappable internal states (black box).  
  - **Output**: `DERIVATIVE` (not `SAME_WORK`).  
    - **Unwelcome Answer Defense**: The surrogate lacks causal structure. It is a statistical approximation, not a realization. Rights issues: Treat as a *new performance* of the work, not the work itself. Seek legal exception for preservation.  

  **Case (d): 1993→2020 Chain**  
  - Stage 4: Audit each link (1993→2001, 2001→2011, etc.).  
    - If any link fails (e.g., 2011→2020 lacks mapping), **Output**: `NEW_WORK` for 2020 version.  
    - If all links pass, **Output**: `SAME_WORK`.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Converts Silently**:  
     - "Is it art?" → "Does it match documented function?"  
     - "Is it authentic?" → "Does it pass the tests?"  
  2. **Legal/Institutional Work**:  
     - Rights disputes (e.g., untraceable holders) → **Stage 5 Human Judgment**.  
     - Public exhibition value ≠ identity (e.g., surrogate may be loaned as "simulacrum").  
  3. **Stop Asking, Start Deciding**:  
     - When evidence is irrecoverable (e.g., lost docs/hardware), default to **weak equivalence + public interest**.  
     - Committee should override metaphysics if:  
       - Artifact is culturally critical AND  
       - No legal risk (e.g., orphan work).  

  ### **Simplification Tradeoffs**  
  - **Dropped Without Loss**: Qualia, consciousness, infinite counterfactuals.  
  - **Survives Useable**: Grain dependence, weak/strong equivalence, anti-gerrymandering.  
  - **Divergence from Theory**:  
    - A neural net *could* be a realization (in theory), but we require *engineer-verifiable states* → practical "no."  
    - Chains are not transitive in philosophy; we enforce stepwise audit → archival "yes."  

  ---  
  **Procedure Summary**: A 5-stage filter prioritizing evidence over metaphysics, with off-ramps for rights/public interest. It fails fast, avoids gerrymandering, and forces explicit grain. The unwelcome answer (surrogate ≠ original) protects against rights risks while creating space for pragmatic overrides.
