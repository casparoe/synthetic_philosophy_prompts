prompt: |-
  quick context: i'm a 4th-year and I'm finally writing the framework/lit section of a paper on pragmatic encroachment, and I've realised I spend all my time arguing about individual cases instead of about what the cases are supposed to show. So: help me write the spec. What does a theory of the stakes-sensitivity of knowledge attributions have to be able to do to count as adequate? I want desiderata with the case or consideration behind each one, and I want them sorted into three buckets — (i) genuine adequacy conditions that any view in this area has to meet, (ii) conditions that are only non-negotiable if you've already bought into one camp's wider commitments (stuff like: knowledge is the norm of assertion; knowledge is the norm of practical reasoning; attributions must be objective in whatever sense factivity is supposed to guarantee; the semantics has to be compositional and behave normally under embedding; the view has to deliver some particular anti-skeptical or pro-skeptical datum), and (iii) things people demand that are really just prejudice. My supervisor keeps asking whose stakes and I never have a good answer, which is part of why I want the list.

  Fix the purpose as follows: the theory is meant to be a semantics (plus pragmatics if that's where the action is) for 'S knows that p' in ordinary English — including inside conditionals, belief reports and questions, which is where my friend in formal semantics says all the contextualist views quietly cheat — and it's also meant to do three jobs in epistemology: explain the pull of the skeptical argument without turning ordinary knowledge claims into noise, explain why knowledge rather than mere justified true belief is what we cite when we say someone is in a position to assert or to act, and say something about why knowledge is what we care about having. Every family of view is on the table: attributor-contextualism, interest-relative/subject-sensitive invariantism, relativist views where the standards of assessment come apart from the standards of use, hybrids, whatever.

  My starting list, which I'm sure is partly garbage — tell me which entries are real desiderata, which are two entries wearing a coat, and what's missing. (a) the bank/airport family: the theory has to say whether the datum is about knowledge at all or just about what the subject ought to do next (go check the schedule), and whether it is the stakes, the cost of further inquiry, or the salience of the error possibility that's doing the work. (b) what stakes even are: expected disvalue, worst-case magnitude, how many people are affected, or the subject's actual preferences — test it with the agent who stands to lose everything and couldn't care less, and with the anxious agent for whom every decision is life-or-death. (c) whose stakes, when the subject's and the attributor's come apart: I tell you Sam knows the train goes at 4; you're deciding whether to stake something huge on it, I'm making small talk; and if the view gives a different verdict for each of us, does it also have to say that you and I are having a genuine disagreement rather than talking past each other, given we share all the evidence and the conversational score? (d) the looping case I made up and can't get anyone to engage with: whether it's correct to attribute knowledge to the resident depends on whether the attending will treat the question as settled, and whether the attending treats it as settled depends on whether she takes the resident to know — so the theory should say whether knowledge attributions there have a determinate truth value at all, and whether self-fulfilling attributions are allowed. (e) the emergency/no-time-to-inquire case, where stakes are maximal and getting more evidence is impossible: does the view predict knowledge gets easier or harder, and if it predicts harder in both directions is it just redescribing a norm of action? (f) whether other epistemic vocabulary shifts in tandem — certain, sure, has checked, is in a position to know, warranted, the evidence supports — and whether it's a cost if it doesn't. (g) whether there's a sharp evidential threshold on a continuous scale, with the lottery-style worries that invites and the question of whether 'knows' ends up gradable like 'flat'. (h) the legal end: the fact that in high-stakes settings we refuse to treat bare statistical evidence as enough, and what a stakes-based theory should say about that. Plus the time-travel worry: in a calm conversation later, we assess what somebody said during the high-stakes one, and the view should say which standards govern that assessment.

  Then the part I actually want: flag any pair or subset of the desiderata that can't be jointly satisfied — if the list is inconsistent that's a result I can use in the paper — and tell me which single requirement is doing the most exclusionary work across the families of view above. Keep any scorecard to two or three lines per view; the criteria are the deliverable, I'll do the arguing myself in the seminar on thursday.
reasoning: |-
  Okay, I see the user is a fourth-year student working on a paper about pragmatic encroachment and needs help structuring their literature review. They're struggling with focusing too much on individual cases instead of the bigger picture of what makes a theory adequate. 

  The user wants a clear framework of desiderata sorted into three buckets: genuine adequacy conditions, camp-specific requirements, and prejudiced demands. They've provided their initial list which needs refining, and they're particularly concerned about the "whose stakes" question that keeps coming up with their supervisor.

  Hmm, the user's starting list has good observations but needs reorganization. The bank/airport cases are classic but should be grouped with other similar examples. The "whose stakes" issue is crucial - it's the core tension between contextualism and SSI. That emergency case they made up is interesting but might be more about action norms than knowledge attribution per se.

  For the adequacy conditions, the non-negotiable ones should include explaining the bank cases while preserving ordinary knowledge, handling embeddings, and accounting for why knowledge matters practically. The camp-specific bucket would contain things like knowledge being the norm of assertion - important if you're a Williamsonian but not essential for everyone. 

  Ah, the "legal end" and "statistical evidence" points actually connect to important work by Moss and others on probabilistic knowledge - that deserves highlighting. And the time-travel worry about retrospective assessments is a real stress test for contextualism versus relativism.

  Noticing several tensions in their list: You can't have both the attributor's stakes always mattering AND the subject's stakes always mattering without contradiction. And any view that makes knowledge too easily shiftable struggles with the stability requirement for practical reasoning. 

  The "whose stakes" dilemma seems to be the most fundamental tension - it's what fractures the field into contextualist, SSI, and relativist camps. Each solution creates new problems: contextualism struggles with disagreement and embeddings, SSI has trouble with third-party attributions, relativism gets messy with truth-value assessments.

  Should emphasize that no view satisfies all desiderata perfectly - that's the state of play in the literature. The user can use this framework to show why the debate persists and where new solutions might emerge. Their looping case about mutual dependence in medical contexts could actually be a valuable contribution if framed as challenging all existing views equally.
answer: |-
  Here's a refined desiderata list sorted into your buckets, highlighting tensions and the core challenge. Your starting list was insightful but needed consolidation and sharper focus.

  **Core Purpose:** A semantics for "S knows that p" (handling embeddings!) + explaining: (1) Skeptical pull w/o destroying ordinary knowledge, (2) Why *knowledge* (not JTB) is cited for assertion/action, (3) Why knowledge matters.

  ---

  ### (i) Genuine Adequacy Conditions (Any View *Must* Meet These)
  1.  **Bank/Airport Cases & Ordinary Stability:** Explain why "S knows p" seems true in low-stakes (Hannah at Bank on Sat) but false in high-stakes (Hannah at Bank on Fri), *while* preserving the truth of most ordinary, low-stakes knowledge attributions. *Case:* Bank Cases (DeRose/Stanley). *Why:* Captures core datum without skepticism.
  2.  **Embedding Behavior:** Provide a compositional semantics explaining how "knows" functions in:
      *   Conditionals ("If Hannah knows the bank is open, she shouldn't worry")
      *   Attitude Reports ("Bill believes Hannah knows the bank is open")
      *   Questions ("Does Hannah know the bank is open?")
      *   Negation ("Hannah doesn't know...")
      *   *Case:* Embedding tests from formal semantics (Schaffer, Schiffer). *Why:* Any semantic theory must handle basic syntax.
  3.  **Practical Rationale Link:** Explain why knowledge (rather than JTB, certainty, etc.) is the salient epistemic status cited in norms of assertion and practical reasoning. *Case:* "You shouldn't bet your house on p unless you *know* p"; "You can assert p only if you know p". *Why:* Addresses core purpose (2 & 3).
  4.  **Stakes/Error Salience Sensitivity:** Explain *what* factor(s) beyond truth, belief, and justification affect the truth-value/appropriateness of "S knows p". *Case:* Bank cases (stakes), Airport cases (salience of error possibilities - Cohen). *Why:* Core phenomenon of pragmatic encroachment.
  5.  **Disagreement & Shared Evidence:** Account for whether speakers in contexts with differing stakes/salience genuinely disagree (e.g., Low-Stakes Attributor says "S knows", High-Stakes Attributor says "S doesn't know") when assessing the *same subject S at the same time*. *Case:* "Whose Stakes?" (You & me assessing Sam). *Why:* Fundamental to understanding the nature of knowledge attribution.

  ### (ii) Camp-Specific Non-Negotiables (Only Required Given Broader Commitments)
  6.  **Knowledge Norm of Assertion (KNA):** Make "S knows p" the condition for appropriate assertion. *Commitment:* Williamsonian framework. *Conflict:* If KNA is true, what explains high-stakes denials? Is assertion impossible there?
  7.  **Knowledge Norm of Practical Reasoning (KPR):** Make "S knows p" the condition for properly using p as a premise in practical reasoning. *Commitment:* Fantl & McGrath, Stanley. *Conflict:* Must tightly link knowledge thresholds to action demands.
  8.  **Objectivity/Factivity:** Insist knowledge attributions are "objective" in a sense requiring that truth is necessary and sufficient conditions are independent of anyone's *evaluative* states (though perhaps dependent on objective features of the situation). *Commitment:* Anti-subjectivist/anti-relativist intuitions. *Why:* Factivity is core, but *how* context-sensitivity interacts with objectivity is contested.
  9.  **Anti-Skepticism Proscription:** Avoid rendering ordinary knowledge claims systematically false or meaningless. *Commitment:* Moorean common sense. *Why:* Widely shared, but radical skeptics reject it.
  10. **Compositional Semantics Mandate:** Insist the semantics must be fully compositional within a standard formal semantic framework (e.g., Kaplanian). *Commitment:* Formal semantics methodology. *Conflict:* Contextualism often struggles here; SSI/Relativism offer cleaner options.
  11. **Subject's Mental States Primacy:** Demand that whether S knows p supervenes *only* on S's mental states, environment, and the factive relation to p (excluding attributor's context). *Commitment:* Internalism or specific externalism. *Why:* Rejects attributor contextualism.

  ### (iii) Prejudices / Overly Demanding Asks
  12. **Perfect Synonymy with Other Epistemic Terms:** Require that "knows" shifts *exactly* in tandem with "certain", "sure", "has checked", "is in a position to know", etc. *Why:* These terms have different meanings/connotations; synonymy is unlikely. Partial shifts are expected.
  13. **Gradability = Gradability:** Insist that if thresholds shift, "knows" must be gradable *just like* "flat" (admitting comparatives: "more known"). *Why:* "Knows" behaves categorically ("S knows p" / "S doesn't know p"); threshold shifts don't necessitate gradable *semantics*.
  14. **No Conceptual Tension Allowed:** Demand the view resolves *all* intuitive tensions perfectly. *Why:* The phenomenon *is* puzzling; a good theory clarifies the tension, not necessarily eliminates it.
  15. **Immediate Intuitive Obviousness:** Reject a view because its verdicts in complex cases aren't immediately intuitive to everyone. *Why:* Intuitions vary; theoretical virtue matters.

  ---

  ### Addressing Your Specific Points & Refinements
  *   **a) Bank/Airport:** Covered in (1) & (4). Crucial to distinguish *datum* (attribution variation) from *explanation* (stakes? salience? inquiry cost?).
  *   **b) What Stakes Are:** Subsumed under (4). Key tension: Actual preferences (SSI) vs. Objective/Pragmatic features (some Contextualism/SSI) vs. Salience (Contextualism).
  *   **c) Whose Stakes:** **THE CORE TENSION.** Covered in (5). This is the *primary* fracture line. Views *must* take a stand here.
  *   **d) Looping Case:** Illustrates dynamic contexts. Speaks to (5) (disagreement? truth-value?) and embedding complexity in (2). Likely shows a *cost* for some views, not a fundamental desideratum.
  *   **e) Emergency Case:** Tests the link between knowledge and action (3) and the nature of stakes (4). Does knowledge require *available* evidence? (SSI vs Contextualism).
  *   **f) Other Vocabulary:** Covered in (12) - generally a prejudice. Partial shifts are expected and informative.
  *   **g) Sharp Thresholds/Gradability:** Covered in (13) - often a prejudice. Thresholds can be sharp without "knows" being gradable. Lottery worries are separate (fallibilism).
  *   **h) Legal/Statistical Evidence:** Important, but potentially separable. Speaks to *what kind of evidence* is sufficient, which may interact with stakes (higher stakes demand *better* evidence types? Moss). Relevant to (3) & (4).
  *   **Time-Travel Worry:** Crucial test for (2) (embedding in assessment) and (5) (disagreement). Directly pits Contextualism vs. Relativism/SSI.

  ---

  ### Inconsistencies & The Exclusionary Requirement

  *   **The Fundamental Inconsistency Triad:**
      1.  **Ordinary Knowledge Stability:** Most "S knows p" in low-stakes are true.
      2.  **Stakes Sensitivity (Bank Cases):** "S knows p" is false in relevant high-stakes contexts.
      3.  **Univocality & Shared Context Truth-Value:** For a given S, p, and time, "S knows p" has a single truth-value determined only by S's situation (not the attributor's context).
      *   **Conflict:** (1) + (2) imply the truth-value of "S knows p" depends on the context of attribution (contra 3). (1) + (3) imply "S knows p" should be true even in high-stakes attributions (contra 2). (2) + (3) imply "S knows p" is false even in low-stakes contexts (contra 1). *Every major view rejects one of these:*
          *   **Contextualism/Relativism:** Reject (3). Truth-value depends on attributor/assessor context.
          *   **SSI:** Reject (2) *as stated*. Denies high-stakes *attributor* makes "S knows p" false *if S is in low stakes*. It might say "S doesn't know" *is* true *if* the *subject's* stakes are high. Or it might deny the Bank Case intuition as reflecting a claim about knowledge *simpliciter*.
          *   **Strict Invariantism:** Rejects (2) outright (explains Bank Cases pragmatically).

  *   **The Exclusionary Requirement: "Whose Stakes?" (Desideratum 5)** This is the single requirement doing the most exclusionary work. The answer fundamentally shapes the view:
      *   **Attributor's Stakes/Salience:** Points strongly towards **Contextualism** (or Relativism for assessment sensitivity).
      *   **Subject's Stakes:** Points strongly towards **Subject-Sensitive Invariantism (SSI)**.
      *   **Objective Features of Situation:** Compatible with some forms of **SSI** or sophisticated **Contextualism**.
      *   **Denying Stakes Affect Truth-Value:** Points towards **Strict Invariantism + Pragmatics**.

  ---

  ### Two-Line Scorecard on Key Desiderata

  *   **Contextualism (Attributor):**
      *   *Excels:* (1 Bank Cases), (4 Sensitivity - via attributor context), (8 Objectivity? - often aims for it via "speaker context"), (9 Anti-Skepticism).
      *   *Struggles:* (2 Embeddings - famously hard), (5 Disagreement - often resorts to "passing the buck"), (3 Practical Link - can be loose), (KNA/KPR - tricky in high attributor stakes).
  *   **Subject-Sensitive Invariantism (SSI):**
      *   *Excels:* (2 Embeddings - clean), (5 Disagreement - straightforward), (3 Practical Link - tight, often KPR), (KPR/KNA if held), (8 Objectivity? - depends on stakes definition).
      *   *Struggles:* (1 Ordinary Stability - can seem too skeptical if subject stakes vary wildly), (4 Sensitivity - explaining attributor variation requires pragmatics), (Bank Cases - denies attributor variation reflects truth-value).
  *   **Relativism (Assessor):**
      *   *Excels:* (1 Bank Cases), (2 Embeddings? - better than Contextualism, potentially), (5 Disagreement - makes disagreement genuine), (Time-Travel).
      *   *Struggles:* (8 Objectivity - truth relativized to assessor), (3 Practical Link - complex), (KNA/KPR - complex), (9 Anti-Skepticism - stable for assessor, but unsettling).
  *   **Strict Invariantism + Pragmatics:**
      *   *Excels:* (2 Embeddings), (5 Disagreement - denies it's about knowledge), (8 Objectivity), (9 Anti-Skepticism).
      *   *Struggles:* (1 Bank Cases - must explain away strong intuition), (4 Sensitivity - denies it's semantic), (3 Practical Link - must decouple knowledge from action norms).

  **Your Looping Case:** Is a stress test for *all* views, highlighting the potential for context-dependence to create unstable or interdependent attributions. It most directly challenges views relying heavily on *attributor* context (Contextualism/Relativism) but also poses questions for SSI about the stability of the subject's "situation" under reflection. It underscores the difficulty of achieving a satisfying answer to "whose stakes?" in complex, reflective scenarios. Use it to show the *costs* of different answers to (4) & (5).

  This framework should give you the structure to argue forcefully on Thursday. Good luck!
