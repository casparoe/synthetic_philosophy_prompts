          Then the diagnosis: 
            - The cycle is created by the combination of the two individuals' decisiveness over their respective spheres and the Pareto principle.
            - The key feature is the external effect of one individual's hat on the other, even when not worn together. If we remove the cross-sphere preference, specifically if we remove individual 2's allergy to individual 1's hat when not worn together (state b), then individual 2's ranking of b might change. For example, if in state b, individual 2 is only cold and not affected by the sight of individual 1's hat, then his utility for b becomes -1 ( cold) and then his ranking might become: c > a > b > d. 
