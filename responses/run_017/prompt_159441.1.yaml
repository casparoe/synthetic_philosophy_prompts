  ### Scenario: Neighbors and Noise Pollution

  Two neighbors, Alice and Bob, live in adjacent apartments with thin walls. Each enjoys playing music in their own apartment but is disturbed by the other's music. The social alternatives are defined by whether each plays music:

  - **w**: Alice does not play, Bob does not play (quiet, both undisturbed).  
  - **x**: Alice plays, Bob does not play (Alice enjoys music; Bob disturbed by Alice).  
  - **y**: Alice does not play, Bob plays (Bob enjoys music; Alice disturbed by Bob).  
  - **z**: Both play (both enjoy their own music but are disturbed by the other).  

  **Material Payoffs and Preferences**:  
  - Alice’s utility:  
    - No disturbance: +2  
    - Playing music: +1  
    - Disturbance from Bob: −1  
    - ∴ **w**: 0 (no play) + 2 (quiet) = 2  
    **x**: 1 (play) + 2 (quiet) = 3  
    **y**: 0 (no play) + (−1) (disturbance) = −1  
    **z**: 1 (play) + (−1) (disturbance) = 0  
    **Alice’s ranking**: \(x \succ w \succ z \succ y\)  

  - Bob’s utility:  
    - No disturbance: +2  
    - Playing music: +1  
    - Disturbance from Alice: −1  
    - ∴ **w**: 0 + 2 = 2  
    **x**: 0 + (−1) = −1  
    **y**: 1 + 2 = 3  
    **z**: 1 + (−1) = 0  
    **Bob’s ranking**: \(y \succ w \succ z \succ x\)  

  **Preference Table**:  
  | Alternative | Alice’s Ranking | Bob’s Ranking |  
  |-------------|-----------------|---------------|  
  | **x**       | 1st (best)      | 4th (worst)   |  
  | **w**       | 2nd             | 2nd           |  
  | **z**       | 3rd             | 3rd           |  
  | **y**       | 4th (worst)     | 1st (best)    |  

  ---

  ### Derivation of the Cycle  
  Assume **minimal liberalism (ML)**:  
  - **Alice controls her sphere (music)**: She is decisive over any pair differing *only* in her choice, given Bob’s fixed choice.  
    - Pair **(w, x)**: Differs *only* in Alice’s action (both: Bob not playing).  
      - Alice ranks \(x \succ w\) → Social ranking: \(x \succ w\) (by ML).  
  - **Bob controls his sphere (music)**: Decisive over pairs differing *only* in his choice.  
    - Pair **(w, y)**: Differs *only* in Bob’s action (both: Alice not playing).  
      - Bob ranks \(y \succ w\) → Social ranking: \(y \succ w\) (by ML).  

  **Pareto principle (P)**:  
  - Pair **(x, y)**: Alice ranks \(x \succ y\), Bob ranks \(y \succ x\) → No Pareto conclusion.  
  - Pair **(z, w)**: *Both* rank \(w \succ z\) (Alice: \(w=2 \succ z=0\), Bob: \(w=2 \succ z=0\)) → Social ranking: \(w \succ z\) (by P).  

  **Cycle construction**:  
  1. \(x \succ w\) (by ML, Alice’s decisiveness over **(w, x)**).  
  2. \(w \succ z\) (by P, unanimity on **(w, z)**).  
  3. From (1) and (2), \(x \succ z\) (transitivity).  
  4. Pair **(x, z)**: Differs *only* in Bob’s action (both: Alice playing).  
     - Bob ranks \(z \succ x\) → Social ranking: \(z \succ x\) (by ML).  
  5. **Cycle**: \(x \succ z\) (step 3) and \(z \succ x\) (step 4) → Contradiction.  

  ---

  ### Diagnosis: Key Feature and Sensitivity  
  **Key feature driving the conflict**: The **reciprocal material externalities** of noise disturbance. Each neighbor’s private choice (playing music) imposes a *material cost* (disturbance) on the other, making their preferences over alternatives interdependent.  

  **Effect of removing cross-sphere preferences**:  
  - If preferences were *not* affected by the other’s private choice (i.e., no disturbance externality), rankings might be:  
    - Alice: \(x \succ w \succ z \succ y\) → but removes \(-1\) disturbance, so \(y\) improves.  
    - Bob: \(y \succ w \succ z \succ x\) → but \(x\) improves.  
  - Revised rankings (without externalities):  
    - Alice: \(x \succ w \sim z \sim y\) (indifference if no cost from Bob).  
    - Bob: \(y \succ w \sim z \sim x\) (indifference if no cost from Alice).  
  - **Result**: Cycle vanishes. ML and P can coexist (e.g., \(w\) could be Pareto-optimal).  
  - **Conclusion**: The conflict *depends* on preferences that cross spheres due to material externalities.  

  ---

  ### Defending Paretian Liberalism: Escape Routes and Costs  
  1. **Reject cross-sphere preferences in rights assignments**:  
     - **Attack**: ML should only consider preferences over *purely private* outcomes (e.g., ignore effects on others).  
     - **Cost**: Unrealistic. Rights often involve choices with externalities (e.g., noise, pollution). If all such preferences are excluded, rights become vacuously narrow.  

  2. **Deny the sphere is personal**:  
     - **Attack**: Playing music is not "personal" because it affects shared environments.  
     - **Cost**: Erodes core liberal rights (e.g., playing music at home). Requires contestable judgments about what counts as "personal."  

  3. **Delegate decisions or sign binding agreements**:  
     - **Attack**: Rational agents would cooperate (e.g., agree to \(w\) via contract).  
     - **Cost**: Assumes low transaction costs and mutual trust. Impractical for one-off interactions or antagonistic parties.  

  4. **Relax ordering requirements**:  
     - **Attack**: Accept intransitive or incomplete social rankings (e.g., \(x \succ z\) and \(z \succ x\) left unresolved).  
     - **Cost**: Loses ability to make coherent social decisions. Undermines the goal of a rational collective choice.  

  **Least damaging escape**: **Reject cross-sphere preferences for rights assignments** (Route 1). It preserves rights in "harmless" choices but sacrifices liberalism in real-world cases with inevitable externalities. The cost is high: it reduces liberalism’s domain to trivial cases.  

  ---

  ### Conclusion: The Nature of the Liberal Paradox  
  This case shows the liberal paradox is a **distinct problem about rights**, not a repackaged Arrowian issue. It arises when:  
  > *Personal freedoms (ML) and unanimous efficiency (P) clash in the presence of interdependent welfare due to material externalities.*  

  **What to tell students**:  
  > "Sen’s result is not merely an artifact of meddlesome preferences. Even with mundane, self-interested preferences over *material outcomes*, the rights to control personal choices can conflict with Pareto efficiency when those choices affect others’ welfare. This reveals a fundamental tension in liberal societies: individual autonomy and collective welfare can be logically incompatible."
