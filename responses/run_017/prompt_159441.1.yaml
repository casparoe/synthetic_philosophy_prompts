          The strongest attack: 
            - A defender of Paretian liberalism might argue that the sphere of hat-wearing should not be considered as a personal sphere because it has significant externalities. In this case, the allergy means that the hat-w decision is not purely private.
            - Alternatively, they might argue that the cross-sphere preferences should be discounted in the decisiveness assignment. 
            - Or they might argue that in this case, the individuals would sign a binding agreement: for example, to both not wear the hat to achieve state a, which is not the worst for either.
            - Giving up completeness or transitivity might be the escape, but it is costly because we then cannot have a social welfare function that is rational.

          In two sentences: 
            This example shows that the liberal paradox is a distinct problem about rights in the presence of externalities. Even when the preferences are based on material consequences, the combination of minimal liberalism and the Pareto principle can lead to cycles, and you should tell your students that the objection based on meddlesome preferences is not the only way the result can arise.
