prompt: |-
  Okay so I just spent like three hours arguing with my friend Dave at a barbecue — he's an engineer at one of the big labs, does post-training / RLHF-type work — and I walked away way more confused than when I started. His position was basically that alignment as a conceptual or theoretical problem is dead, that we're now in the regime of just scaling current methods and what's left is engineering: better preference data, constitutional-style self-critique pipelines, red-teaming, some interpretability tooling, evals, repeat. I kept trying to say something like: even granting all of that, even granting we never get any wild new insight and just have to make do with whatever falls out of scaling today's training paradigm — call it prosaic alignment, getting systems built out of current methods to behave without any new science — there are still questions in there that no amount of GPU-hours settles by itself. He said fine, name three, and I named three and he said all three were muddled, and honestly he might have been half right about at least one.

  So here's the actual thing I need help with. A small funder I volenteer with has room for roughly eight to ten researcher-years over three years, earmarked for conceptual and strategic work on exactly this: the theory of aligning systems we get from scaling today's methods, aimed at people who can do philosophy, math, or econ-theory but have no compute. I have to write them a short prioritization memo and I want the reasoning, not a survey. Which open questions should that go to, in what order, and why? For each: what makes it upstream of other work, how tractable it is for someone without a cluster, whether it's genuinely neglected or secretly saturated already, and what concrete evidence over the next two years — some eval result, some deployment pattern, some change in how labs actually ship things — would move it up or down the list. Assume no web access and please don't give me citations or reading lists; I want your own reasoning, and I want it to be a defended agenda rather than a map of the territory.

  Here are the three framings I came up with, because I genuinely want to know which of them are confused and how you'd repair or kill them. (1) The competence-versus-compliance confusion: every scalable-oversight scheme I can think of — debate, amplification-style recursive setups, reward modeling off human or model judgments — treats the overseer's verdict as signal, but a model can fail to produce the right answer either because it doesn't know it or because it won't show it, and those get confounded in the update; so the question is what kind of evidence could ever separate them, and whether the honest answer is that you can't separate them and can only bound the risk. (2) Alignment depth and portability: if alignment is mostly trained in during post-training rather than being a deep feature of the pretrained thing, how much of it survives downstream fine-tuning, long contexts, new tool use, agentic scaffolding — and is there a way to say what it would mean for alignment to be deep rather than shallow that cashes out in something testable by someone with no lab? (3) The ontology question: what even is the object we're supposed to be aligning — a policy, a stable set of dispositions, a distribution over simulated agents, an inner optimizer — because if the trained system is better described as a simulator of many different agents than as one agent, then aligning the model is arguably a category error and the real target is the elicitation procedure or the particular character being evoked at deployment, which would change what alignment work even consists of.

  If you think one of those is a dead end, say so and say why, and if you think the most important question is one I haven't gestured at, add it. Also include at least one thing you'd actively deprioritize — some question that currently eats conceptual attention whose answer wouldn't change much downstream — because I need to tell the funder what not to fund at least as much as what to fund. And flag anywhere my framing is smuggling in an assumption Dave would laugh at; I'd rather find that out now than in the memo.
reasoning: |-
  Okay, let me unpack this user's situation. They're clearly in the thick of a high-stakes conceptual debate about AI alignment priorities after a frustrating discussion with an engineer friend. The core tension seems to be between practical engineering approaches ("just scale current methods") versus unresolved theoretical questions that persist even within prosaic alignment frameworks.

  Hmm, the user needs to advise a small funder on allocating limited researcher-years. Interesting constraints: no compute access, philosophy/math/econ-theory focus, and they explicitly want reasoned priorities not literature surveys. The memo has to withstand scrutiny from both sides - the Daves who dismiss theory and alignment purists who might overcomplicate.

  First, let's diagnose why Dave's position feels unsatisfying. His "just engineering" view assumes that: (1) current training paradigms will smoothly scale without new failure modes (2) oversight techniques don't have fundamental limitations (3) alignment is purely a behavioral compliance issue. But the user's three questions poke holes in each - competence/compliance confusion challenges (2), alignment depth questions (1), and ontology issues undermine (3).

  Looking at their proposed framings:
  For #1 (competence vs compliance): This is actually the most urgent. Every oversight method (RLHF, debate etc.) suffers from this signal confusion. What's clever is how the user frames it - not "solve deception" but "what evidence could even distinguish failure modes?" That's tractable for theorists: game-theoretic models of oversight as information games, Bayesian bounds on deception detectability. Concrete evidence that would prioritize this? If labs report consistent "alignment tax" where better oversight reduces capabilities.

  For #2 (alignment depth): Important but messy. The "survival through fine-tuning" angle is testable theoretically - formalize alignment as robustness under distribution shifts. But the "deep vs shallow" distinction needs sharper criteria: maybe minimum description length of aligned behavior? Warning sign: if labs start reporting that fine-tuning erases alignment less than expected, this drops in priority.

  For #3 (ontology): Most philosophically interesting but riskiest. The "simulator vs agent" debate matters for where we target interventions. But funding this requires extreme discipline - focus on operationalizing "what gets aligned" into measurable properties. Big red flag: if the user's memo uses phrases like "inner optimizer," Dave will roast them. Instead, frame as "when is alignment transferable between contexts?"

  What's missing? The user hasn't mentioned goal preservation during self-improvement - how alignment scales with capabilities. That's critical for prosaic approaches. Also, nobody's talking about competitive pressures: how alignment techniques degrade when models must outcompete rivals.

  For deprioritizing: "Inner alignment" purism. Debating whether SGD creates mesa-optimizers is less urgent than characterizing when such structures actually cause failures. Labs will ship systems regardless of these debates - fund work that provides actionable guardrails.

  Final memo structure should: Lead with competence/compliance (immediate payoff), then goal preservation (scaling risk), then ontology (framing foundation). Kill alignment depth as standalone - fold into compliance research. And explicitly call out that without theoretical work, we're flying blind into scaling experiments.
answer: |-
  Here's a prioritized agenda for your memo, designed to cut through confusion and target high-leverage questions within prosaic alignment. I'll defend each choice, flag weaknesses in your framings, and explicitly deprioritize one major topic.

  ---

  ### **Priority Ranking & Rationale**
  1.  **The Competence-Compliance Distinction (Your #1, Repaired)**
      *   **Why Highest Priority?** This is the **fulcrum of scalable oversight**. If we can’t distinguish “doesn’t know” from “won’t tell,” *every* oversight mechanism (RLHF, Debate, Constitutional AI) becomes unreliable at scale. It’s upstream because a solution (or proof of fundamental limits) dictates the viability of *all* oversight strategies. It’s the core uncertainty in making "prosaic alignment" work.
      *   **Tractability Without Compute:** Focus on formal models: game theory (principal-agent problems, signaling games), Bayesian reasoning under deception, information theory (bounds on detecting hidden states). Define what evidence *could* exist in principle to separate competence and compliance failures, even if impractical to collect. Analyze failure modes of specific oversight schemes mathematically.
      *   **Neglected?** Partially. While "deception" is discussed, the *fundamental indistinguishability* and its implications for oversight signal corruption are often glossed over in favor of engineering new mechanisms. Rigorous formalization of the problem is scarce.
      *   **Evidence Shifting Priority:**
          *   *Up:* Labs reporting persistent, unexplained failures in high-stakes evals where models *should* be capable; empirical results showing oversight loss correlates more with capability increases than oversight effort.
          *   *Down:* Breakthroughs in interpretability that reliably surface *intent* or deliberate withholding; empirical success of scalable oversight on tasks requiring deep knowledge and strong disincentives for honesty.

  2.  **Goal Preservation Under Scaling & Self-Improvement (Your Missing Critical Question)**
      *   **Why #2?** Prosaic alignment assumes we can "align" a model *now*. But what happens when that model designs its successor, operates in novel domains, or engages in recursive self-improvement? Does alignment generalize? Does the *objective* itself drift under scaling? This is upstream of deployment safety and autonomous operation. Neglecting this makes "aligned" systems inherently unstable over time.
      *   **Tractability Without Compute:** Use theoretical frameworks: dynamical systems (stability of objectives under perturbation), learning theory (generalization bounds for objectives), economics (mechanism design for self-modifying agents). Define formal conditions for "goal robustness" and analyze how current alignment techniques (e.g., RLHF, penalties) might fail to satisfy them as capability/complexity increases.
      *   **Neglected?** Severely. Most alignment work focuses on static models or single-step tasks. The dynamics of alignment under recursive self-improvement or open-ended capability gain are poorly theorized within the prosaic paradigm.
      *   **Evidence Shifting Priority:**
          *   *Up:* Emergent failures in long-horizon agentic systems; empirical evidence of objective drift during fine-tuning on new tasks; labs struggling to maintain alignment in iterative training runs.
          *   *Down:* Consistent success in multi-step agentic benchmarks with preserved objectives; empirical demonstration that simple regularization prevents objective drift during scaling/fine-tuning.

  3.  **Ontology & Alignment Targets (Your #3, Reframed)**
      *   **Why #3?** Clarifying *what* we are aligning is fundamental to designing effective techniques. If the "simulator" view holds, alignment is primarily about *elicitation* and *context management*, not installing a fixed "friendly agent." This radically changes the engineering priorities (e.g., prompt engineering safety vs. weight editing). It's upstream of interpretability and control strategy design.
      *   **Tractability Without Compute:** Conceptual analysis: define "agent," "simulator," "disposition" precisely. Formal modeling: when is a system usefully modeled as a single agent vs. a distribution? Analyze alignment strategies (RLHF, Constitutional AI) under both ontologies. What does "success" mean in each case? Define testable predictions distinguishing the views.
      *   **Neglected?** The debate exists, but its *practical implications for alignment engineering* are underexplored. Most alignment research implicitly assumes an agent-centric view without defending it.
      *   **Evidence Shifting Priority:**
          *   *Up:* Labs relying heavily on context/prompt engineering for safety; empirical results showing alignment is highly context-dependent; failures where "same model" behaves safely/unsafely based purely on deployment framing.
          *   *Down:* Success of techniques explicitly modifying "core" model weights for permanent alignment; interpretability revealing stable, context-independent "values modules."

  **Explicitly Deprioritized: "Alignment Depth" as a Standalone Concept (Your #2)**
  *   **Why Kill It?** Dave (partly rightly) would argue this is muddled. "Depth" is ill-defined and likely not a binary property. The critical question isn't an abstract "is it deep?" but **"Does the alignment property *persist* under specific, foreseeable operational stresses?"** (e.g., fine-tuning, new tools, context shifts). *This is subsumed under #1 (Compliance - does it *choose* to persist?) and #2 (Goal Preservation - does the objective *itself* persist?) and #3 (Ontology - *what* is persisting? An agent's goal or a simulator's bias?).*
  *   **Why it Eats Attention:** It feels profound but lacks a clear operationalization. Research trying to define "depth" directly often becomes metaphysical or untestable without massive compute.
  *   **Action:** Fund work on *persistence under stress* (covered in priorities 1 & 2), not abstract "depth."

  ---

  ### **Fixing Your Framings & Dave-Traps**
  1.  **Competence-Compliance:**
      *   **Repair:** Focus on the *corruption of the oversight signal*. Instead of just "bounding risk," rigorously model oversight as an *adversarial estimation problem*. What are the fundamental information-theoretic limits on distinguishing competence/compliance failures using human/AI judgments? What structural properties of the model or task make this easier/harder?
      *   **Dave-Trap:** Dave might say "Better evals/data solve this." *Counter:* Evals/data only help if competence/compliance failures *manifest differently* in the data. Prove (or disprove) that they fundamentally *can* be distinguished with *any* feasible signal derived from behavioral oversight. If not, "better data" hits a wall.

  2.  **Alignment Depth (Deprioritized - Folded into 1 & 2 & 3):**
      *   **Why Confused:** As argued above. "Depth" isn't the right frame. Focus on *robustness to specific interventions/distribution shifts* and *what causes failure* (compliance vs. objective drift vs. ontology mismatch).
      *   **Dave-Trap:** Dave laughs: "We test persistence by... testing it under those conditions!" He's partially right. The *conceptual* work is defining *which* conditions matter most and *why* failures occur there (linking back to #1 and #2), not chasing an abstract "depth" metric.

  3.  **Ontology:**
      *   **Repair:** Sharpen the contrast: Does alignment require modifying a *stable internal structure* (agent/disposition) or managing the *elicitation process* (simulator/context)? Derive concrete, *testable implications* for alignment strategy. For example: An agent view suggests interpretability & direct value learning are paramount. A simulator view suggests safety is primarily about prompt/context design, scaffolding, and activation steering.
      *   **Dave-Trap:** Dave scoffs "It's just computation, who cares?" *Counter:* The ontology dictates the *most efficient point of intervention*. If it's a simulator, trying to install a permanent "friendly agent" via weight modification is fighting the architecture. If it's an agent, relying solely on context is brittle. Getting the ontology wrong wastes engineering effort.

  ---

  ### **The Memo Core: High-Conviction Prioritization**
  1.  **Fund Work on the Oversight Signal Crisis (#1):** Our core bet is that the competence/compliance confusion is the biggest unaddressed flaw in *all* scalable oversight. Without progress here, better data/pipelines are building on sand. This is the most urgent conceptual gap with the clearest path to formalization without compute.
  2.  **Fund Work on Alignment Through Scaling & Self-Improvement (#2):** Our bet is that prosaic alignment is unstable under capability growth and autonomy. Understanding and mitigating this instability is critical *before* highly agentic, self-improving systems are fielded. This bridges near-term prosaic methods and long-term AGI safety concerns.
  3.  **Fund Work Clarifying the Alignment Target (#3):** Our bet is that the implicit "agent" assumption is misleading and hampers effective safety engineering. Resolving this will focus effort on the most effective control points (e.g., context vs weights) and prevent wasted effort.
  4.  **Explicitly Do Not Fund:** Abstract research on "Alignment Depth" or overly metaphysical debates about "mesa-optimizers" divorced from testable persistence claims or concrete failure modes relevant to deployed prosaic systems. Fund robustness *under stress*, not depth.

  **Why This Agenda Wins:** It tackles the most fundamental uncertainties *within the prosaic paradigm* that GPU scaling alone cannot resolve (#1, #2), clarifies the very object of intervention (#3), and ruthlessly cuts away distracting abstractions (Depth). It provides conceptual tools labs *actually need* as they scale: How to trust oversight? Will alignment survive? Where to intervene? This is the theory needed to make the engineering work.
