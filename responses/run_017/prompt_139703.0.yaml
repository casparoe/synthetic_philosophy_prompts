prompt: |-
  My housemate has gotten really into AI consciousness podcasts and last night tried to explain the whole framework to me over dinner. I want to know how much of it is actually the position people defend and how much is his own spin, because we're definitely going to argue about it again tonight.

  His version went something like this:

  "The computational theory of mind says that what makes a state a pain is the job it does in the system's information processing, not what the system is made out of. Substrate independence falls straight out of that: run the same computation on silicon instead of in a brain and you get the very same experience, with exactly the same moral weight. So the thing that actually has moral status is the pattern, the program — not the animal and not the server. And since a pattern is abstract, it doesn't matter how fast you run it, or whether you ever run it at all: a mind described in a file sitting on a hard drive is already someone, in the same way a novel is already a story before anybody reads it. You could even spread one mind's computation across ten thousand phones, one neuron apiece, updating over a slow network, and no single phone would have anything remotely like an experience — but the mind would still be there, because what exists is the abstract computation, not any particular machine. That's also why AI welfare is such a big deal: if anything inside a training run plays the pain-role, there's genuine suffering there, and how much suffering there is scales with how much computation is going on, so a big model trained on a lot of compute matters far more than a small one. And that 'well then your toaster is conscious, because every physical system implements every computation' objection is just a bad joke — a toaster obviously isn't running anything like a brain, so it isn't conscious, end of story."

  Two bits set off alarm bells for me. The "doesn't matter whether you ever run it" line sounds like saying a recipe is a meal. And I don't see why the amount of compute would change how much an experience matters — surely a slower simulation of the same person, having the same experiences, isn't worth less? But I don't know this literature at all and he's read a lot more than me, so I might be the one who's confused.

  Can you go through it more or less claim by claim and tell me: which sentences are a fair statement of the underlying view (computationalism, substrate independence, whatever the right label is), which are a popularizer's overreach that a defender of the view would reject, and where he's sliding between two things the view actually keeps apart? I'm especially interested in: whether the abstract-program bit is a real commitment or just a confusion between a program and a run of a program, whether the ten-thousand-phones case really comes out the way he says on the view he's describing, whether the "moral weight scales with compute" bit follows from anything else he said, and whether his answer to the toaster objection is the standard reply or is dodging something harder. Please don't just hand me a reading list or name-drop papers — I cant look anything up. I just want to know which of his sentences I should push back on tonight, and whether the conclusions he draws (about AI welfare especially) survive once the summary is cleaned up.

  Finish with a one-sentence bottom line, and then a final line in the form \answer{...} containing just one word — fair, mixed, or unfair — for how fair the overall summary is.
