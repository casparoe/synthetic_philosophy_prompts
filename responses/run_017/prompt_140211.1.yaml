  Okay, the user is in an applied ethics seminar and is grappling with a friend's argument that individual consumer actions like boycotting factory-farmed chicken are morally inert. The friend uses demand forecasting in a grocery chain to back up his claims. I need to unpack this step by step.

  First, the core of the friend's argument is that since one person's action doesn't change the outcome (due to how supply chains work), there's no outcome-based moral reason to abstain. The user feels this is wrong but can't pinpoint where the argument fails. They mentioned rejecting step (6) about the poisoning case but don't want to give up step (2) about supply chains being insensitive to individual actions.

  Let me break down each premise. Premise (1) says an act only gives moral reasons if it makes a difference. Premise (2) explains why buying chicken doesn't make a difference due to bulk ordering and surplus handling. (3) concludes no outcome-based reason to avoid buying. (4) counters the marginal shopper argument by saying probabilities are too uncertain. (5) dismisses collective action, arguing that a bunch of inert acts can't create moral impact. (6) uses the poisoning case to generalize to all similar scenarios, including voting, emissions, etc. (7) extends this to all individual contributions.

  The user's main struggle is reconciling the intuition that poisoning is wrong with the supply chain reality. They suspect premises (1), (5), or (4) but aren't sure. I need to identify which step is the weakest link.

  The key flaw is in premise (1). It assumes moral reasons only come from actual difference-making. But there's a distinction between an act making a difference and the agent being part of a difference-making set. In the poisoning case, each poisoner is part of the group that causes death. Even if one didn't act, the outcome would be the same, but collectively they're all responsible. This connects to the "participatory intention" idea—each intends to contribute to a harmful collective outcome. 

  For the chicken boycott, even if one person's action doesn't reduce orders, they are still participating in a harmful system. The moral reason comes from complicity, not individual impact. This addresses the user's unease about (6) without denying (2). The 106th person shouldn't join because they'd be joining a harmful collective action knowingly. 

  Rejecting (1) costs some precision because it shifts from consequentialism to a more complex view involving collective action and complicity. But it preserves the intuition that the poisoners are culpable and that consumer choices matter ethically, even without measurable impact. It also handles supply chains by acknowledging individual inefficacy but emphasizing participation in harm.

  The user might worry this makes ethics too vague. However, it aligns with how we judge collaborators in wrong acts. For the chicken case, choosing not to buy is a refusal to participate, which has symbolic and self-respect value, even if the system doesn't immediately change. This approach satisfies the user's need to reject (6) while accepting (2), and provides a coherent reason to boycott beyond personal purity.
answer: |-
  Your friend's argument is clever and structurally sound, but its fatal flaw lies in **premise (1)**. Rejecting this premise resolves the poisoning case (6), preserves the empirical reality of supply chains (2), and provides coherent outcome-based reasons for boycotts. Here's the breakdown:

  ### Why Premise (1) Fails: "Difference-Making" vs. "Participatory Harm"
  Premise (1) claims:  
  > *An act gives you a moral reason only if it makes a difference (i.e., "holding the rest fixed, things would have gone worse if you hadn't acted").*

  This conflates two distinct concepts:  
  - **Difference-making causality** (your act alone alters the outcome).  
  - **Participatory harm** (your act is part of a set of acts that collectively cause harm, even if removing yours changes nothing).  

  **The poisoning case (6) exposes this:**  
  - Each poisoner is part of the *sufficient set* that kills the victim.  
  - While no single gram *makes the difference*, each poisoner **intentionally contributes to a collective harm they know will occur**.  
  - The 106th person shouldn't join because they’d *intend to participate* in an unjust outcome, even if their gram is redundant.  

  **Moral reasons arise from participation in harm**, not just marginal causality. We condemn conspirators, accomplices, or polluters even when their individual contribution is non-necessary.  

  ---

  ### How Rejecting (1) Resolves the Chicken Case
  - **Supply chains (premise 2) are empirically correct**: Your purchase likely doesn’t alter the number of chickens bred.  
  - **But you still participate in a harmful system**: By buying factory-farmed chicken, you:  
    - *Intentionally support* an industry that causes suffering.  
    - *Benefit from* practices you deem unethical.  
    - *Signal endorsement* of the system (even if weakly).  
  - **Outcome-based reasons exist**:  
    1. **Complicity**: Your act reinforces and legitimizes the system. While one purchase changes nothing, *mass* boycotts do—and your act is part of that mass.  
    2. **Systemic harm**: You are a *causal link* in a chain that produces suffering, akin to handing a weapon to someone you know will misuse it.  

  ---

  ### Why the Other Premises Hold (or Don’t Matter)
  - **Premise (2)**: Correct. Supply chains buffer individual actions. **Keep this.**  
  - **Premise (4)**: Correct that "marginal impact" arguments fail here. **Not the core issue.**  
  - **Premise (5)**: Correct that "we together" isn’t magical—but irrelevant. The moral issue is *individual participation in collective harm*, not group agency.  
  - **Premise (6)**: Resolved by rejecting (1). The 105 poisoners *are* blameworthy; the 106th *shouldn’t join*.  

  ---

  ### What This Costs: Shifting from Simple Causality to Complicity
  Rejecting (1) forces a move from *act-consequentialism* (focus on individual causal impact) to a framework recognizing:  
  - **Collective harm**: Acts gain moral valence from their role in group actions.  
  - **Intentional participation**: Knowing contribution to harm creates responsibility, even without "but-for" causality.  
  - **Symbolic/material entanglement**: Buying chicken isn’t just a causal nudge—it’s a material act within an unjust system.  

  **Your position becomes**:  
  > *"I have an outcome-based reason not to buy factory-farmed chicken because I refuse to materially participate in and benefit from a system that causes unnecessary suffering, even if my individual purchase doesn’t change production numbers. My act is one of many that sustains the system collectively."*  

  ---

  ### Practical Implications: Handling "Mundane" Cases
  1. **The 106th poisoner**: Shouldn’t add poison because they’d *intend to join a wrongful collective act*.  
  2. **Voting/emissions**: You have reasons to vote (participating in democracy) or reduce emissions (not contributing to climate harm), even if your impact is negligible.  
  3. **Arguing with your friend**: You *do* have outcome-based reasons—if you persuade him, his forecasting model might incorporate ethical constraints, affecting millions of chickens.  

  **Key insight**: Ethics isn’t just about *changing outcomes*—it’s about *refusing to be part of* harmful outcomes. Your intuition about the poisoning case points to this deeper truth. Your friend’s error is reducing morality to physics.
