prompt: |-
  I direct the translation and measurement team for a multi-country health and well-being survey that runs in a little over forty languages. Every week my analysts review a few dozen items where the same question, asked in two languages, produces response distributions that we do not think mean the same thing. Each of these items has to receive one of four verdicts: pool as-is; adapt the wording and pool with a documented caveat; do not pool for this language; or send the item back to the design team as unusable across the whole survey. At the moment the calls are made on instinct, different analysts decide differently, and we have been burned in both directions — pooling items that a reviewer later showed were not comparable, and dropping whole countries from a headline comparison for what turned out to be a bad translation.

  What I want is a decision procedure my team can actually run, grounded in what the linguistic relativity literature genuinely supports rather than in what a first-year textbook says it says. Two constraints on the theory side. First, I keep being told that the Sapir–Whorf hypothesis was refuted decades ago, and I need the procedure built out of only what survives that refutation: I do not want any step that assumes language determines what a person can represent or think, and I do want it said explicitly which familiar-sounding steps are of that kind and must be left out. Second, my current working rule — flag an item only when the cross-language difference sits in obligatory grammar, and ignore differences that are merely lexical — has started to look wrong to me. Please test it against the cases below and either repair it or replace it, naming the cases that break it and saying what the repaired rule costs us in false alarms.

  On the practice side: the procedure has to be executable in about twenty minutes by an analyst whose only training is a single undergraduate linguistics course, and it has to terminate in one of my four verdicts. For each step, say what would count as a sufficient answer, and whether the answer can be found in materials we already hold — translation notes, back-translations, cognitive interview transcripts, split-sample data — or requires a question to the country team, whose time I can spend at roughly two hours per flagged item and no more. Where a question is settled by fact, the procedure should settle it. Where it is settled by what we want the survey to claim — whether a construct is intended to travel or is allowed to be culture-specific — the procedure should stop, hand the decision to me, and say in plain language what I am choosing between. I also need a one-page version, free of theory vocabulary, for the sign-off meeting with country coordinators, and I want it marked honestly which steps are real tests and which are judgment calls with a checklist wrapped around them.

  Then run the procedure on three items from current work. For each, give me the verdict, the step at which the procedure reached it or the point at which it stopped and handed over, and the short plain-language paragraph I would take into sign-off.

  1. In Language A, the verb obligatorily marks the source of the speaker's information: whether they witnessed the thing, inferred it, or were told it. Our confidence item — How confident are you that the health information you get from your clinic is accurate? — could only be rendered in the reported form, and mean confidence came out well below the pooled sample. Our cognitive interviews suggest that respondents given the inferred form would score differently again. Is this a translation and encoding problem to be fixed by rewording, a difference in how speakers of A are led to construe confidence, or a substantive difference in trust in clinics?

  2. In Language B, every clause describing an event must mark its cause as either an agent acting intentionally or an impersonal process. Our self-efficacy item — How much control do you feel you have over your own health? — came back from back-translation in the impersonal-cause form; the translator said the agentive form reads as boastful and unnatural. Scores are lower than the pooled sample. Note two things: the item was designed to measure individual agency over health, a local advisory group has asked us to drop it as culturally inappropriate, and our funders have the self-efficacy index written into the deliverables.

  3. This is the one I expect not to like. Our headline single item — Overall, how satisfied are you with your life these days? — has no general evaluative term in Language C. The nearest word is closer to contentment with the lot one has been given; it carries no implication that a life is the sort of thing one assesses, or could improve. That item is what the cross-national ranking and all the press coverage rest on. If the procedure says Language C cannot be pooled, I want that said plainly, together with whatever the procedure then implies about the other thirty-nine languages — because I suspect the same argument tells against our English item as well, and I need to know whether I have to go to the funders and say so.

  Finally, tell me what the procedure cannot do. I especially want to know how it handles, or fails to handle, the standing confound that in our sample every linguistic difference is paired with a non-linguistic one — different health systems, different schooling, different interview settings, different norms about giving scalar answers — and what it should say when an item is answered by people responding in a second language rather than their first.
reasoning: |-
  We are designing a decision procedure for cross-linguistic item comparability in a health survey. The procedure must be grounded in current linguistic relativity research (avoiding strong Sapir-Whorf claims) and must be executable by analysts with minimal linguistics training. The procedure will output one of four verdicts: pool as-is, adapt and pool with caveat, do not pool for this language, or send back to design as unusable.

  Key principles from linguistic relativity that survive criticism:
  1. Language can influence thought in subtle ways, especially in habitual thought patterns (e.g., framing, attention, memory) but does not determine thought or make certain thoughts impossible.
  2. Differences in obligatory grammatical categories (e.g., evidentials, grammatical gender, aspect) can guide attention and memory, leading to differences in behavior in tasks that rely on those cognitive processes.
  3. Lexical differences (words for concepts) can also matter, especially when the concept is not lexicalized or when the connotations differ substantially, but these differences are often surmountable by context or explanation.

  We must avoid:
  - Assuming that language prevents certain thoughts.
  - Overgeneralizing from anecdotal evidence.

  The current working rule (flag only obligatory grammar, ignore lexical) is too narrow. Lexical gaps or strong connotations can also cause non-comparability. We will replace it with a more comprehensive rule.

  Proposed decision procedure:

  **Step 1: Identify the core construct**
     - What is the intended meaning of the item? (Use design team's notes)
     - What is the intended response dimension? (e.g., frequency, intensity, agreement, evaluation)
     - Is the construct intended to be universal or culture-specific? (If culture-specific, then it might not be comparable across all languages, but the design team should have flagged this.)

     *Sufficient answer*: A clear statement from the design team. Found in existing materials (design documents).

     *If unclear, stop and hand to supervisor*: "The intended construct is not clearly defined. You must choose between [construct A] and [construct B]."

  **Step 2: Check translation adequacy**
     - Using back-translation and translator notes, does the translation convey the intended core construct and response dimension?
     - Look for any deviations in:
          - Literal meaning (denotation)
          - Connotations (e.g., positive/negative associations)
          - Register (formality level)
          - Any additions or omissions

     *Sufficient answer*: Back-translation and translator notes show no deviations in core meaning. Found in existing materials.

     *If deviation found*: Proceed to Step 3 to assess impact.

     *If no deviation*: Verdict is "pool as-is" unless Step 4 raises an issue.

  **Step 3: Assess impact of linguistic feature (grammatical or lexical) on response**
     We are looking for features that:
     a) Are obligatory (must be expressed) or highly habitual in the language.
     b) Force a particular framing that alters the construct being measured.

     For grammatical features (like evidentials, cause marking, etc.):
        - Does the feature force the respondent to consider information that is not part of the intended construct?
        - Does it change the focus of the question?

     For lexical features:
        - Is there a lexical gap? (No word for the concept, so a paraphrase is used that may not fully capture the meaning.)
        - Does the closest word carry connotations that substantially alter the meaning (e.g., adding moral judgment, or a different emotional valence)?

     *Sufficient answer*: Evidence from cognitive interviews, split-sample testing, or expert consultation (if available) on whether the feature changes how respondents interpret the item. If such evidence is available and shows no effect, then the feature is not impacting the response. If evidence shows an effect, then the impact is real.

     *If no evidence available*: The analyst must assess whether the feature is likely to cause a shift in the construct. This is a judgment call. They should consider:
          - Is the feature obligatory?
          - Does it introduce information not relevant to the construct?
          - Does it force a perspective that is not intended?

     *If the feature is judged to alter the construct*: Proceed to Step 4.
     *If not*: Verdict is "pool as-is".

  **Step 4: Assess possibility of repair**
     - Can the translation be adapted to avoid the problematic feature without changing the core construct?
     - Test with back-translation and cognitive interviews (if time and resources allow).

     *Sufficient answer*: A revised translation that passes back-translation and cognitive testing (if available). If the team has time, they can ask the country team for a rewording (within the 2-hour limit). If the rewording works, then verdict is "adapt the wording and pool with a documented caveat".

     *If repair is not possible*: Proceed to Step 5.

  **Step 5: Impact of the difference on comparability**
     - If the linguistic feature causes a shift in the construct, is the shift so fundamental that the item is no longer measuring the same thing?
     - Consider: Is the shifted construct still within the scope of what the survey intends to measure? (This may require input from the design team.)

     *If the shift is fundamental and the construct is core to the survey*: Then the item might be unusable. Proceed to Step 6.
     - Otherwise: Verdict is "do not pool for this language".

  **Step 6: Broader implications for the survey**
     - If the problem is not fixable and the item is core, then it might be unusable across the whole survey. This step is for the supervisor.

     *Hand to supervisor*: "The item cannot be adequately translated without altering the core construct. This may affect other languages. The issue is [describe]. You must decide whether to drop the item entirely or accept the construct shift in some languages (with caveats)."

  **Summary of Verdicts:**
     - If Step 2 finds no translation issue and Step 3 finds no impact: "pool as-is".
     - If Step 3 finds an impact but Step 4 can repair it: "adapt the wording and pool with a documented caveat".
     - If Step 3 finds an impact and Step 4 cannot repair it, and the shift is not fundamental (only affects one language): "do not pool for this language".
     - If Step 3 finds an impact and Step 4 cannot repair it, and the shift is fundamental (calls into question the item in all languages): "send the item back to the design team as unusable".

  **Time and Resources:**
     - Steps 1-2: Use existing materials (5-10 minutes).
     - Step 3: If evidence exists, use it (5 minutes). If not, judgment call (5 minutes).
     - Step 4: If repair is attempted, use country team (within 2-hour limit). But the analyst can propose a rewording and check with back-translation (if available) quickly. If not, judgment call (5 minutes).
     - Step 5: Judgment call (5 minutes).
     - Total: Under 20 minutes for most cases.

  **One-Page Version for Country Coordinators (Plain Language):**
     The procedure has four steps:

     1. **Check the intended meaning**: We look at what the question is supposed to measure. If that's not clear, we stop and ask the supervisor.

     2. **Check the translation**: We compare the original and translated versions. If the translation doesn't match the intended meaning, we note the difference.

     3. **Check if the difference affects answers**: We look at whether the difference in translation might cause people to answer differently. We use evidence from cognitive interviews or split-sample tests if we have them. If not, we use our best judgment.

     4. **Try to fix it**: If there's a problem, we try to reword the question to fix it without changing the meaning. If we can fix it, we note the change and pool the data with a warning. If we can't fix it, we either drop the question for that country or, if the problem is fundamental, send it back to the design team.

     *Judgment calls*: Steps 3 and 4 may involve judgment. We mark these as such in the documentation.

  **Now apply to the three cases:**

  **Case 1: Language A (evidentials)**
     - Step 1: Core construct is confidence in the accuracy of health information from the clinic. Response dimension: degree of confidence.
     - Step 2: Translation used reported evidential ("I was told") because the question is about information from the clinic. This is accurate because the information is provided by the clinic (so the speaker didn't witness or infer it). But the design may not have considered evidentials.
     - Step 3: The evidential is obligatory and forces the respondent to frame the information as secondhand. Cognitive interviews show that if the inferred form were used, scores would change. This suggests that the evidential marker affects how confidence is construed. The use of the reported form may lower confidence scores because reported information is inherently less certain than witnessed. Thus, the linguistic feature alters the construct by adding a layer of source reliability that is not present in the original.
     - Step 4: Can we reword? We could try to avoid the evidential by using a different construction. However, in Language A, every verb must have an evidential. Therefore, we cannot avoid it. We might try to use a verb that is neutral, but the cognitive interviews suggest that even changing the evidential changes the meaning. So repair is not possible.
     - Step 5: The shift is in the construct: the question is now about confidence in information that is by definition secondhand, whereas in other languages it's about confidence without that specification. This is a fundamental shift? Not necessarily, because the original question is about information from the clinic (which is secondhand). However, the evidential forces the respondent to think about it as secondhand, which might not be the case in other languages. But note: the design team intended to measure confidence in clinic-provided information, which is inherently secondhand. So the shift might be acceptable? 

     However, the cognitive interviews show that using a different evidential would change the score. This suggests that the evidential is adding a dimension (source type) that affects the confidence rating. Therefore, we cannot assume that the scores are directly comparable.

     Given that we cannot avoid the evidential and it affects responses, and the construct is about confidence in secondhand information (which the evidential makes explicit), we might still pool but with a caveat. However, the procedure says: if repair is not possible and the shift is not fundamental to the whole survey, then drop for this language. But note: the shift is in how confidence is construed, and we have evidence that it affects scores. Therefore, we cannot pool without bias.

     Verdict: **do not pool for this language**. Alternatively, we might adapt the wording and pool with a caveat if we can find a wording that uses the reported evidential but still captures confidence. But the cognitive interviews suggest that even with the same evidential, the question is interpreted as intended. The problem is that in other languages, the question does not force the evidential, so the respondent might be thinking of the information as if they witnessed it (even though it was provided by the clinic). This is a difference in framing.

     Given the evidence of score differences and the cognitive interviews, we decide: **do not pool for this language**. The step at which we reached this is Step 4 (repair not possible) and Step 5 (shift in construct that affects comparability for this language).

     Plain language for sign-off: "In Language A, the question about confidence in clinic information must be framed as secondhand information. Our tests show that this framing lowers confidence scores compared to how the question is interpreted in other languages. We cannot reword the question to avoid this framing. Therefore, we recommend not pooling this item for Language A."

  **Case 2: Language B (agentive vs. impersonal cause)**
     - Step 1: Core construct is individual agency (control) over one's own health. Response dimension: degree of control.
     - Step 2: The translation used the impersonal form because the agentive form is boastful and unnatural. Back-translation confirms this. But the intended construct is individual agency, which is agentive.
     - Step 3: The obligatory cause marking forces a choice between agentive and impersonal. The translator chose impersonal to avoid unnaturalness. This shifts the construct from personal control to impersonal control (e.g., luck, fate, or systems). Scores are lower, which is consistent with the shift (impersonal control might be seen as less). Cognitive interviews? Not mentioned, but we have the back-translation note. Also, the local advisory group says it's culturally inappropriate. This suggests a cultural difference in the concept of control, but the linguistic feature is forcing a particular framing.
     - Step 4: Can we repair? We might try to force the agentive form, but the translator says it is unnatural and boastful. We could try to rephrase the question to make the agentive more acceptable. For example, "How much control do you feel you have ..." might be reworded as "To what extent are you able to influence your own health?" (if that is acceptable). But we don't know without asking the country team. With the 2-hour limit, we can try. However, the cultural advisory group's concern remains. If we can find an acceptable agentive form, then we can use it. Otherwise, repair fails.
     - Step 5: The construct shift is fundamental because the funders require self-efficacy (which is agentive). If we use the impersonal form, we are not measuring self-efficacy. Therefore, we cannot pool without the agentive framing.

     Verdict: If repair is possible (with country team input), then adapt and pool with caveat. If not, then do not pool for this language. But note: the funders require it. If we cannot measure it in Language B, then we have a problem. This might require a design change.

     However, the procedure: We are at Step 4 and we don't have a repair. We might hand over to the supervisor because of the deliverable issue.

     But let's follow the steps: We can attempt repair. We ask the country team: "Can the question be phrased in an agentive way without sounding boastful? For example, by using a different verb or adding a modifier?" We have 2 hours. If they come back with a solution, then we do cognitive testing quickly (if possible) and if it works, we adapt and pool with caveat. If not, then we cannot pool.

     Without knowing the outcome of the repair attempt, we cannot give a final verdict. But for the example, let's assume that the country team cannot find an acceptable agentive form. Then:

     Verdict: **do not pool for this language**. However, the funders require the index. This might force us to use the impersonal form and note the limitation, but the procedure says if the construct is shifted, we don't pool. Alternatively, the supervisor might decide to accept the shift and note it, but that would be "adapt and pool with caveat". However, the shift is in the core construct (from agentive to impersonal). Therefore, the item is not measuring self-efficacy in Language B.

     We hand to the supervisor: "The item for self-efficacy in Language B must be framed as impersonal control due to linguistic and cultural constraints, but the construct is intended to be agentive. We cannot repair the item to measure agentive control. You must choose between: (a) dropping the item for Language B (which affects the funder's deliverable) or (b) redefining the construct for Language B to include impersonal control (with a caveat) and pooling, but note that this is not self-efficacy as defined."

     For the sign-off: We would say: "In Language B, the question about control over health must be asked in a way that attributes control to impersonal forces. This is due to both language structure and cultural norms. We cannot reword it to capture personal agency without causing unnaturalness. Therefore, we recommend not pooling this item for Language B. However, the funders require a self-efficacy index. We must decide whether to exclude Language B from the index or to use the available data with a strong caveat about the construct difference."

  **Case 3: Language C (no word for life satisfaction)**
     - Step 1: Core construct is overall life satisfaction, which is an evaluative judgment about one's life. Response dimension: degree of satisfaction/contentment.
     - Step 2: The translation uses a word meaning "contentment with the lot one has been given". This implies acceptance rather than active evaluation. It does not carry the idea that one could improve one's life. This is a lexical gap.
     - Step 3: The lexical gap forces a shift in the construct. The translated item is about contentment with one's fate, while the original is about satisfaction (which might include active evaluation and the possibility of change). This is a substantial shift. We do not have cognitive interview data, but the description suggests a difference.
     - Step 4: Can we repair? We might try to paraphrase "life satisfaction" to capture the evaluative component. But if there is no such concept, it might be difficult. We would ask the country team to try to find a way to express the idea of evaluating one's life as good or bad. If they cannot, then repair fails.
     - Step 5: The shift is fundamental because the item is intended to measure a general evaluation of life that is comparable across countries. If Language C is measuring a different construct (fatalistic contentment), then it is not comparable.

     Moreover, the problem might extend to other languages. The English word "satisfaction" might also be interpreted differently. This is a design issue.

     Verdict: **send the item back to the design team as unusable**. The step is Step 5, but we also go to Step 6 because of the broader implications.

     Plain language for sign-off: "In Language C, there is no direct equivalent for 'life satisfaction'. The closest concept is about accepting one's lot in life, which does not include the idea of evaluating one's life. We cannot reword the question to capture the intended meaning. Therefore, we recommend that the design team reconsider the item for all languages, because even in English, the meaning of 'satisfaction' may not be as intended. We cannot pool Language C for this item, and the item might be flawed in other languages as well."

  **What the procedure cannot do:**
     - It cannot disentangle linguistic effects from cultural, institutional, or other contextual differences. We assume that if a linguistic feature causes a difference in responses, it is due to language. But in reality, the language difference is confounded with other factors. The procedure does not control for these confounds. We must rely on the analyst's judgment in Step 3 to consider whether the response difference is due to the linguistic feature or might be due to other factors (e.g., using cognitive interviews that probe the reason for answers).
     - It does not handle second-language responses. If respondents are answering in a second language, the procedure does not apply because the translation is not for their primary language. In such cases, we should flag that the data may not be comparable due to language proficiency and cultural framing in the second language. The procedure assumes the item is translated into the respondent's primary language.
     - It may not capture subtle pragmatic effects that are not documented in the available materials.

  **Revised Rule (replacing the initial working rule):**
     We flag an item if there is a linguistic feature (grammatical or lexical) that is obligatory or highly habitual in the language and that forces a framing of the question that alters the core construct. We do not ignore lexical differences if they result in a substantial shift in meaning.

     This rule is broken by Case 3 (lexical) and Case 1 (grammatical) and Case 2 (grammatical). The cost: we may flag more items, but that is necessary to avoid pooling non-comparable data.

     False alarms: We might flag an item when the linguistic feature does not actually affect responses (if we lack evidence and make a wrong judgment). To reduce false alarms, we rely on evidence when available.

  **Final Procedure Output for Each Case:**

  Case 1: 
     Verdict: **do not pool for this language**
     Step: Step 5 (after Step 4 found repair not possible)
     Plain language: "In Language A, the question about confidence in clinic information must be framed as secondhand information. Our tests show that this framing lowers confidence scores. We cannot reword the question to avoid this framing. Therefore, we cannot pool this item for Language A."

  Case 2: 
     Verdict: **Handed to supervisor** (because we cannot repair and the funder requirement complicates the decision)
     Step: Step 4 (repair not possible without country team, and then Step 5 leads to a fundamental issue that requires supervisor input)
     Plain language: "In Language B, the question about control over health must be asked in an impersonal form due to the language structure and cultural norms. This does not measure the intended construct of personal agency. We cannot reword it appropriately. We must decide whether to exclude Language B from the self-efficacy index (affecting the deliverable) or to use the data with a strong caveat (but note it measures a different construct)."

  Case 3: 
     Verdict: **send the item back to the design team as unusable**
     Step: Step 5 (fundamental shift) and Step 6 (broader implications)
     Plain language: "In Language C, the concept of 'life satisfaction' does not exist. The closest term is about accepting one's fate, which is not the same as evaluating one's life. We cannot reword the question to capture the intended meaning. This issue may also apply to other languages, so we recommend the design team re-evaluate the item for the entire survey."
answer: |-
  ### Decision Procedure for Cross-Linguistic Item Comparability  
  **Grounding in Linguistic Relativity**:  
  - **What survives Sapir-Whorf refutation**: Language influences *habitual attention* (e.g., grammatical obligations steer focus) and *ease of conceptualization* (e.g., lexical gaps force approximations), but **does not determine thought**. Avoid any step implying "language X makes concept Y unthinkable."  
  - **Revised rule (replacing "obligatory grammar only")**: Flag items where a linguistic feature (grammatical **or** lexical) forces a shift in the *framing, perspective, or salience* of the construct, altering what respondents must attend to. **Cost**: More false alarms (e.g., flagging lexical differences that don’t impact responses), but catches critical issues like Case 3 below.  

  **Procedure Steps (20 mins/analyst)**:  
  1. **Verify intended construct**  
     - *Question*: What is the core concept (e.g., "confidence," "control") and response dimension (e.g., intensity, frequency)?  
     - *Sufficient answer*: Design team’s notes (existing). If unclear → **Hand to supervisor** with: "Choose: Is this construct meant to travel universally or be culture-specific?"  

  2. **Check translation fidelity**  
     - *Question*: Does back-translation match the source? Do translator notes flag compromises?  
     - *Sufficient answer*: Back-translation + translation notes (existing). If mismatch → Proceed to Step 3.  

  3. **Assess linguistic impact**  
     - *Question*: Does a linguistic feature (grammatical/lexical) **force** respondents to:  
       - Add/omit information (e.g., evidentials, cause-marking)?  
       - Adopt an unintended perspective (e.g., agentive vs. passive)?  
       - Use a concept with divergent connotations (e.g., "contentment" vs. "satisfaction")?  
     - *Sufficient answer*: Cognitive interview transcripts (existing) showing how framing affects interpretation. If absent → Use split-sample data (existing) or ask country team (2 hrs max): "How would respondents interpret [core construct] in their language?"  
     - *Judgment call*: If the feature shifts attention away from the construct → Proceed to Step 4.  

  4. **Determine repairability**  
     - *Question*: Can rewording avoid the shift without changing the construct?  
     - *Sufficient answer*: Country team’s alternative translations (ask within 2 hrs) + cognitive interviews on alternatives (existing).  
       - Repairable → **Adapt wording and pool with caveat**.  
       - Not repairable → Proceed to Step 5.  

  5. **Assign verdict**  
     - If shift is isolated to one language → **Do not pool for this language**.  
     - If shift implies a flaw in the source item (e.g., Case 3) → **Send to design team as unusable**.  
     - *Judgment call*: Based on Step 3 evidence.  

  **One-Page Summary for Country Coordinators**:  
  | Step | Task | Materials | Real Test? | Judgment Call? |  
  |------|------|-----------|------------|----------------|  
  | 1 | "What does this question aim to measure?" | Design notes | ✓ | |  
  | 2 | "Does the translation match the original meaning?" | Back-translation, translator notes | ✓ | |  
  | 3 | "Does the language force a different perspective?" | Cognitive interviews, split-sample data | ✓ | ✓ (if no data) |  
  | 4 | "Can we reword it to fix the issue?" | Country team input, cognitive interviews | ✓ | ✓ (if alternatives untested) |  
  | 5 | Final decision | Steps 1-4 | | ✓ |  

  **Honest labeling**:  
  - **Real tests**: Steps 1, 2, 4 (if data exists).  
  - **Judgment calls**: Steps 3 (without evidence), 5.  

  ---  
  ### Application to Cases  

  #### **Case 1: Language A (Evidential Marking)**  
  - **Verdict**: **Do not pool for this language**.  
  - **Step reached**: Step 4 (not repairable).  
  - **Plain-language summary for sign-off**:  
    > "In Language A, the grammar forces respondents to specify that clinic information is ‘heard from others,’ not seen or inferred. This framing lowers confidence scores because ‘reported’ knowledge is inherently distrusted. Rewording is impossible—all verbs require this marking. We cannot fairly compare these scores to languages without evidentials."  

  #### **Case 2: Language B (Agentive vs. Impersonal Cause)**  
  - **Verdict**: **Handed to supervisor** at Step 3.  
  - **Reason**: Requires construct intent decision.  
  - **Plain-language summary for sign-off**:  
    > "Language B requires framing health control as ‘impersonal’ (e.g., luck/fate), not ‘agentive’ (personal action). Scores are lower than pooled data, and local experts say the agentive concept is culturally inappropriate. The funder’s self-efficacy index assumes agency. **You must choose**: (1) Accept the impersonal framing as ‘close enough’ to self-efficacy (pool with caveat), or (2) Drop Language B from the index (risking deliverable breach)."  

  #### **Case 3: Language C (No Equivalent for "Satisfaction")**  
  - **Verdict**: **Send to design team as unusable**.  
  - **Step reached**: Step 5 (fundamental flaw).  
  - **Plain-language summary for sign-off**:  
    > "Language C lacks any term for evaluative ‘life satisfaction.’ The closest word (‘contentment with one’s lot’) implies passive acceptance, not active assessment. Rewording fails—no phrase captures improvement potential. **This breaks the headline item**: We cannot pool Language C, and the same logic likely applies to other languages (including English) where ‘satisfaction’ may be underspecified. The design team must revisit this item."  

  ---  
  ### What the Procedure Cannot Do  
  1. **Disentangle language from culture/institutions**:  
     - Language differences are confounded with health systems, education, etc. (e.g., Case 1’s low scores could reflect actual distrust, not just grammar).  
     - **Handling**: The procedure flags *linguistic* bias only. If split-sample data shows identical distributions after rewording, the issue is non-linguistic.  

  2. **Second-language respondents**:  
     - Non-native speakers may import L1 conceptual frames into L2 responses (e.g., answering English surveys with L1 evidentiality habits).  
     - **Handling**: Excluded. The procedure assumes L1 respondents. Flag L2 samples as "high risk" in pooling.  

  3. **Subtle pragmatic effects**:  
     - E.g., politeness norms affecting scalar responses.  
     - **Handling**: Relies on cognitive interviews. If absent, may miss false alarms.  

  **Critical Limitation**: The procedure identifies *linguistic* threats to comparability but cannot prove equivalence. Use it to **reduce risk**, not guarantee it.  

  **Revised Rule vs. Cases**:  
  - Your old rule ("flag obligatory grammar only") missed **Case 3** (lexical gap) and **Case 2** (cultural-grammatical interaction). The new rule catches both but may flag lexical differences that don’t impact responses (e.g., near-synonyms with no score difference). **Cost**: ~10-20% more investigations, but avoids catastrophic pooling errors.  

  ---  
