  ### Key to Confidence Ratings  
  - **Reading (high)**: The summons-focused harm and engineered asymbolia are textually robust, especially in Madame’s scene and the clones’ conditioning.  
  - **Clinical framing (medium)**: While asymbolia illuminates the sting/summons split, the novel universalises this beyond clinical pathology—pushing back might require emphasising social over medical critique.  

  This should give your book club meaty debate—especially the discussion questions, which work for film-only members. If you dissect Madame’s scene, you’ll crack the summons question wide open.
