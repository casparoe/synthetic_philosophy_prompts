answer: |-
  ### Runnable Classroom Game: The Surprise Forecast Challenge

  #### **Learning Objective**
  Experience the tension between accurate forecasting and the possibility of surprise, mirroring the surprise exam paradox, without initially naming it. Students confront the conflict between rational backward induction and real-world uncertainty.

  #### **Materials**
  - Envelopes (one per round)
  - Small slips of paper
  - Whiteboard for recording probabilities and scores
  - Timer
  - Scoring table (quadratic scoring)

  ---

  ### **Rules and Setup**
  1. **Teams**: 
     - **Class Team**: 24 students collaborate to produce a single probability forecast each morning.
     - **Teacher Team**: Instructor or rotating student. Chooses the quiz day and scores for surprise.
     
  2. **Game Structure**:
     - **Week Length**: Varies per round (2 or 5 days).
     - **Teacher's Move**: At the start, the teacher selects a quiz day \(d\) (1 to \(N\)) and either:
       - **Public**: Writes \(d\) on the board for all to see.
       - **Private**: Seals \(d\) in an envelope (visible sealing, contents hidden).
       - **One-Student Hint** (optional): Whispers \(d\) to one student (who cannot speak during forecasts).
     - **Class's Move**: Each morning \(t\):
       - Class discusses and agrees on a single probability \(p_t \in [0, 1]\) that the quiz is that day, **given no quiz yet**.
       - If the quiz occurred earlier, \(p_t = 0\) (no discussion needed).
     - **Quiz Revelation**: After \(p_t\) is reported, teacher reveals if the quiz is that day.
       - If yes: Quiz "happens," surprise and accuracy scores are computed.
       - If no: Accuracy score for \(t\) is computed, and the game proceeds to day \(t+1\).

  3. **Scoring**:
     - **Accuracy Score (Class)**:
       - Quadratic scoring per day: \(s_t = 1 - (I_t - p_t)^2\).
         - \(I_t = 1\) if quiz on day \(t\), else \(0\).
       - Total accuracy = average \(s_t\) over all \(N\) days.
     - **Surprise Score (Teacher)**:
       - Surprise occurs if \(p_t < 0.2\) on the quiz day.
       - Teacher scores **1 point** per surprise.
     - **Class Final Score**: Total accuracy - 0.5 if surprise occurred.  
       *(Example: Accuracy 0.8 + surprise penalty 0.5 → final 0.3)*
     - **Teacher Wins** if surprise occurs.

  4. **Incentives**:
     - Quadratic scoring incentivizes honest probabilities (maximizes expected accuracy).
     - Class wants high accuracy **and** to avoid surprise (teacher scoring).
     - Conflict: Accurate forecasts make surprise impossible; inaccurate forecasts hurt accuracy.

  ---

  ### **Timeline (75 Minutes)**
  | Time  | Activity                                                                                                                                 |
  |-------|------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Intro**: Explain rules, scoring, and roles. Use 2-day example: "Your goal: Forecast accurately while avoiding low probabilities on the quiz day." |
  | 5-15  | **Round 1: 2-Day Week (Private)**<br>- Teacher privately seals day in envelope.<br>- **Day 1**: Class reports \(p_1\). Teacher reveals quiz/no quiz. Record \(s_1\).<br>- **Day 2**: If no quiz on Day 1, class reports \(p_2\). Teacher reveals. Compute scores. |
  | 15-25 | **Round 2: 2-Day Week (Public)**<br>- Teacher writes day on board publicly.<br>- Repeat Round 1 steps. Highlight: "No surprise possible here—why?" |
  | 25-45 | **Round 3: 5-Day Week (Private)**<br>- Teacher seals day privately.<br>- Step through days 1–5 sequentially (stop if quiz occurs).<br>- Allow 2–3 min/day for class discussion/reporting. |
  | 45-60 | **Round 4 (Optional): 5-Day Week (One-Student Hint)**<br>- Teacher whispers day to one student (who stays silent).<br>- Repeat Round 3 steps. |
  | 60-75 | **Debrief**: Reveal "surprise exam paradox." Map game events to the paradox. Address misconceptions. |

  ---

  ### **Debrief Guide: Mapping Game to Paradox**
  1. **Elimination of the Last Day (Round 3, Day 5)**:
     - *Game Moment*: If class reaches Day 5, they report \(p_5 \approx 1\) (rational, since quiz must occur).
     - *Paradox Link*: "If you know it’s the last day, it can’t be a surprise. So Day 5 is eliminated as a surprise day."
     - *Student Observation*: "We reported 100%—no surprise. Teacher avoids Day 5 to pursue surprise."

  2. **Backward Propagation (Round 3, Days 4–1)**:
     - *Game Moment*: On Day 4, if no quiz yet, class reasons: "Day 5 is impossible for surprise, so it must be Day 4!" → Reports \(p_4 \approx 1\).
     - *Paradox Link*: "Each day, the logic eliminates the next day, propagating backward. By Day 1, no day can be a surprise."
     - *Conflict*: "But in the game, the teacher **did** surprise you on Day 2/3! How?"

  3. **The Paradoxical Surprise (All Rounds)**:
     - *Game Moment*: Teacher surprises class when \(p_t < 0.2\) (e.g., Day 3 in Round 3 with \(p_3 = 0.15\)).
     - *Paradox Link*: "The backward induction seems valid—yet surprise happens. The paradox is that both can’t be true, but the game shows they coexist."
     - *Key Insight*: "The logic assumes everyone **knows** everyone else is rational (common knowledge). In practice, uncertainty breaks this."

  4. **Public vs. Private Knowledge (Rounds 2 vs. 1 & 3)**:
     - *Round 2 (Public)*: Class knows the day → accurate forecasts, no surprise.
     - *Rounds 1 & 3 (Private)*: Uncertainty enables surprise.
     - *Paradox Link*: "The paradox relies on private knowledge. Public knowledge defuses it."

  ---

  ### **Predictable Misconceptions & Responses**
  | Misconception                          | When It Surfaces       | How to Defuse                                                                 |
  |----------------------------------------|------------------------|-------------------------------------------------------------------------------|
  | "Teacher can skip the exam"            | Debrief (after Round 3) | "In the paradox, the teacher announces the exam **will** happen. Our rules enforce this." |
  | "Surprise = low probability"           | During scoring         | "We defined surprise as \(p_t < 0.2\), but backward induction forces \(p_t =1\). Is that ‘surprise’? No—our definition clarifies." |
  | "Randomizing resolves it"              | Student strategy talk  | "If the teacher randomizes, the class updates probabilities daily. Try it: Day 1 \(p_1=0.2\) might be surprised, but Day 2 \(p_2=0.25\) isn’t low enough." |
  | "Surprise = not deducing the date"     | Forecast discussions   | "Deduction is binary; surprise is probabilistic. We measured the latter (e.g., \(p_5=1\) is deduced but not surprising)." |

  ---

  ### **Potential Pitfalls & Mitigation**
  - **Collusion to Always Report 0**:
    - *Risk*: Class reports \(p_t=0\) daily to force surprise.
    - *Mitigation*: Quadratic scoring penalizes this (quiz day accuracy = 0). Show math: Low accuracy + surprise penalty = net loss.
  - **Refusing to Commit to One Number**:
    - *Risk*: Disagreement delays reports.
    - *Mitigation*: Enforce 2-min time limits. Appoint a mediator student.
  - **Degenerate Final Morning**:
    - *Risk*: On Day 5, class reports \(p_5=1\) mechanically.
    - *Use*: This is intentional—leads to the elimination insight in debrief.
  - **Mixed-Strategy Claims**:
    - *Risk*: "Random forecasts fix this!"
    - *Mitigation*: Explain: "Randomizing may help the teacher surprise you, but accuracy scores drop. Conflict remains."

  ---

  ### **Limitations & Design Critique**
  - **What the Game Changes**:
    - **Knowledge → Forecast**: The paradox centers on *knowledge*, but we use *reported probabilities*. Quadratic scoring encourages honesty, but reporting pressures may distort this.
    - **Common Knowledge**: The game cannot fully replicate iterated knowledge hierarchies ("I know that you know...").
    
  - **What the Game Cannot Teach**:
    - If students **always** use backward induction and avoid surprise, the paradox’s tension collapses. *Convincing counter-evidence*: 
      - If in Round 3, the class is **never** surprised and systematically eliminates days, the game fails to model the paradox.
      - Alternative: Operationalize via private student journals (individual probabilities) to capture heterogeneous beliefs.

  - **Improvement Test**:
    - If >80% of students, post-debrief, can articulate why surprise occurred *despite* valid-seeming logic, the game succeeds.
    - If not, add Round 5: Students play as individuals (not a team) to highlight how groupthink masks uncertainty.

  ---

  ### **Instructor Script Snippets**
  - **Starting Round 3**: "It’s a 5-day week. I’ve sealed the day. Remember: you score for accuracy, but if your probability is below 20% on the quiz day, I score. Discuss—what’s your Day 1 forecast?"
  - **Debrief Hook**: "In Round 3, you reported 15% on Day 3—and I surprised you. But logically, Day 3 should’ve been ‘eliminated.’ What happened?"
  - **Closing Insight**: "The paradox isn’t about exams—it’s about how common knowledge assumptions break down in the real world. Your forecasts were honest, but uncertainty let surprise slip in."

  This design forces students into the paradox’s core tension. By making surprise and accuracy compete, the backward induction’s failure becomes visceral. The debrief links gameplay to epistemology, transforming shrugs into "aha!" moments.
