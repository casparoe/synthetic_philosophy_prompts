answer: |-
  Your argument is insightful and aligns closely with **epistemicism**, a well-established position in the philosophy of vagueness (championed by philosophers like Timothy Williamson). You're not making an error—you're articulating a defensible and influential view. However, the debate persists because epistemicism faces significant challenges, and rival theories offer alternative solutions to these problems. Let's break this down:

  ### Where Your Argument Succeeds (The Epistemicist Core)
  1. **Territory-Sharpness = Precision in the World**:  
     You're correct that physical reality lacks vagueness. A pile of sand has exact properties (e.g., grain count, spatial arrangement). Epistemicism holds that vague predicates *do* have sharp boundaries in the world, but we **cannot know** where those boundaries lie. Your "territory-sharp" is essentially the epistemicist's "sharp but unknowable boundary."  

  2. **Vagueness as Semantic/Epistemic**:  
     The "map/territory" distinction is central here. Vagueness arises from limitations in our language and cognition, not from fuzzy reality. Our concepts ("heap," "bald") are coarse-grained tools for navigating a precise world.  

  3. **Trade-Offs and Complexity**:  
     Your point about "monstrously complicated surfaces" in case-space is astute. Epistemicists agree: the boundary for "heap" depends on a multidimensional set of precise factors (number, shape, stability, context), but it remains sharp.  

  ### Where Rival Theories Push Back: Key Objections
  Despite its coherence, epistemicism faces criticisms that keep the debate alive:

  1. **The Unknowability Problem**:  
     - If boundaries are sharp, *why* can’t we know them? Epistemicism posits radical ignorance: e.g., there’s an exact grain count \( n \) where \( n \) grains make a heap, but \( n-1 \) do not, yet we cannot possibly discover \( n \).  
     - Rivals argue this is implausible. If boundaries exist, we should be able to investigate them (e.g., via physics or statistics). Why is \( n \) fundamentally unknowable? Supervaluationism or degree theories avoid this by denying sharp boundaries altogether.  

  2. **The Normativity of Language Use**:  
     - Vague predicates work *because* they lack sharp boundaries. We use "heap" flexibly across contexts, and this flexibility is a feature, not a bug. If a sharp boundary existed, we’d expect language communities to converge toward it—but they don’t. Contextualists (e.g., Stewart Shapiro) argue that boundaries shift with conversational context, so no single "hidden" boundary exists.  

  3. **The Sorites Paradox Isn’t Solved—It’s Relocated**:  
     - Epistemicism "solves" the paradox by denying the major premise (e.g., "1 grain never makes a difference"). But it replaces the paradox with a mystery: *How does our language latch onto a precise boundary we can’t detect?*  
     - Rivals argue that truth-value gaps (supervaluationism) or degrees (fuzzy logic) better explain why we intuitively reject sharp boundaries.  

  4. **Higher-Order Vagueness**:  
     - Even if "heap" has a sharp boundary, what about the boundary *itself*? When does ignorance of the boundary begin? This regress suggests vagueness can’t be reduced to ignorance alone.  

  ### The Residual Disagreement: What’s Really at Stake?
  The core conflict isn’t about physics—all sides agree the *territory* is precise. The fight is about **semantics and cognition**:  
  - **Epistemicism**: Words have sharp extensions fixed by usage/causal chains, but human cognition cannot access these boundaries. Vagueness = ignorance.  
  - **Supervaluationism**: Words have many equally valid precisifications; truth is "super-truth" (true in all precisifications). Vagueness = indeterminacy.  
  - **Degree Theories**: Truth comes in degrees (e.g., 0.7 true). Vagueness = partial truth.  
  - **Contextualism**: Boundaries shift with pragmatic context. Vagueness = context-dependence.  

  ### Conclusion: You’re on Solid Ground, but the Debate Continues
  Your argument is a lucid restatement of epistemicism. It doesn’t "go wrong"—it’s a legitimate response to the sorites paradox. However, alternatives persist because they:  
  - Reject the implausibility of unknowable boundaries,  
  - Emphasize the functional role of vagueness in language,  
  - Address higher-order vagueness more elegantly.  

  **Why isn’t epistemicism the consensus?** Because it trades a paradox (sorites) for an epistemological puzzle (radical ignorance). Rivals argue their models better reflect how language *actually works* in practice. The debate is less about grains of sand and more about how words map to the world—and whether that mapping *must* be sharp.  

  If you embrace epistemicism, you’re in good company—but be ready to defend why unknowable boundaries are less mysterious than truth-value gaps or contextual flux.
