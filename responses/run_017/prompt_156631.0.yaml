answer: |-
  This is a fascinating and under-discussed phenomenon. You're describing a sophisticated form of **epistemic manipulation** that leverages meticulously cultivated honesty as camouflage. While there isn't a single universally accepted term, here's how to understand it, its boundaries, and its moral implications:

  **Core Concepts & Terminology:**

  1.  **Strategic Truthfulness / Weaponized Honesty:** The core tactic. Honesty on trivial or low-stakes matters is used strategically to build credibility ("truth capital") that is then *spent* to enable deception-by-omission, selective framing, or implication on high-stakes issues. The honesty itself is the weapon.
  2.  **Epistemic Misdirection / Credibility Laundering:** The *effect*. The carefully built reputation for bluntness or transparency misdirects attention *away* from the possibility of manipulation in the critical moment. The prior honesty "launders" the subsequent misleading implication, making it appear credible.
  3.  **Selective Transparency / Calculated Omission:** The *method*. The deceiver isn't lying; they are rigorously truthful about *what they choose to disclose*. The deception lies in *what is excluded* from disclosure in the crucial context, knowing that the audience's trust (built on prior full disclosures elsewhere) will lead them to assume nothing significant is missing.
  4.  **The "Fine Print" Strategy:** (Especially for Case 2) Burying crucial qualifying information (limitations, conflicts) where it's technically disclosed but highly unlikely to be seen or integrated, while presenting a simplified, technically-true-but-misleading summary prominently.
  5.  **Exploiting the "Halo Effect":** The positive perception generated by their consistent honesty on small things (punctuality, admitting minor errors) creates a halo that unconsciously biases the audience to interpret their ambiguous or incomplete statements on the big issue favorably and uncritically.

  **Marking the Edges: Key Questions & Factors**

  *   **Intent vs. Habit vs. Audience Failure:**
      *   **Calculated Honesty:** This is the clearest case. The small-scale honesty is *deliberately performed* to build trust to be exploited later. This is conscious manipulation.
      *   **Deep-Rooted Habit/Personality:** The person genuinely *is* blunt/punctilious about small things *by nature*. However, they might *consciously or unconsciously* leverage this trait in the high-stakes moment to avoid an uncomfortable truth, letting an assumption stand because it's convenient. Even without conscious initial calculation, *failing to correct* a significant misapprehension they recognize, while knowing their reputation will shield them, edges into culpability.
      *   **Audience Failure:** If the person is genuinely equally blunt in the big moment and provides *all* relevant information clearly, but the audience misinterprets it due to their own biases or errors, that's not the deceiver's fault. The key is whether the speaker *foresaw or should have foreseen* the likely misinterpretation given the context and their established reputation, and *chose not to clarify*.
  *   **The Stakes & The Omission:** The moral weight increases with:
      *   The significance of the high-stakes issue.
      *   The speaker's awareness of the audience's misunderstanding or the potential for misinterpretation.
      *   The extent to which the crucial omitted information is non-obvious or counter-intuitive.
      *   The reliance the audience places on the speaker *specifically because* of their reputation for honesty.
  *   **The Role of the Reputation:** The phenomenon *relies* on the reputation built through small-scale honesty. Without that pre-existing trust, the misleading implication in the critical moment wouldn't land as effectively.

  **Does the Lying vs. Misleading Distinction Collapse Morally?**

  **No, it doesn't collapse entirely, but this pattern exposes its limitations and makes misleading potentially *more* pernicious in specific contexts:**

  1.  **Exploitation of Trust:** Outright lying often burns trust immediately. This pattern *exploits* hard-earned trust specifically built through demonstrable honesty. This feels like a deeper betrayal – a violation of the *foundation* of the relationship.
  2.  **Plausible Deniability & Gaslighting:** The deceiver has strong deniability ("I *was* late that one time! I *did* disclose the conflict on page 9! I *didn't* say X was safe, I said 'the data shows no *statistical* harm at this dose'!"). This can make the victim doubt their own perception, feeling manipulated but unable to definitively "prove" dishonesty. It's gaslighting via selective truth.
  3.  **Erosion of Epistemic Norms:** It weaponizes the *appearance* of rigorous honesty to subvert genuine understanding. It makes truth-telling itself suspect, as any display of honesty could be strategic. This corrodes healthy discourse.
  4.  **The Moral Culpability of the Omission:** While lying involves *asserting* a falsehood, this involves *failing to assert* a crucial truth *in a context where one has a duty to do so* (especially given the cultivated trust and the stakes). The duty arises from the relationship and the expectations created.
  5.  **"Worse" is Contextual:** In terms of immediate harm from a single statement, a bald-faced lie might be more directly damaging. However, *systemically* and in terms of long-term corrosive effects on trust and discourse, this pattern of "credibility laundering" through strategic truthfulness can be far more damaging and harder to combat. It undermines the very tools we use to assess truthfulness.

  **Conclusion:**

  You've identified a powerful and ethically fraught tactic best described as **Strategic Truthfulness for Epistemic Misdirection** or **Credibility Laundering via Selective Transparency**. Its core feature is leveraging a reputation for honesty (earned through genuine or performed truthfulness on low-stakes matters) to lend credibility to a technically true but deeply misleading communication (via omission, framing, or implication) on a high-stakes matter.

  Intent matters, but even unconscious leveraging of a truthful reputation to avoid an uncomfortable truth can be culpable if the speaker recognizes the misunderstanding and fails to correct it. Audience failure is distinct but often intertwined.

  Morally, this doesn't erase the difference between lying and misleading, but it highlights that misleading via this method can be *more* ethically reprehensible than a simple lie in crucial ways: it exploits earned trust, offers plausible deniability, erodes epistemic norms, and involves failing in a duty of candor created by the speaker's own actions. The difference doesn't collapse, but the moral high ground claimed for "mere" misleading over outright lying vanishes entirely in this scenario. This pattern demonstrates that misleading, when combined with cultivated credibility, can be a profoundly damaging form of deception.
