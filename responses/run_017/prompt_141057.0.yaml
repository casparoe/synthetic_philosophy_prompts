answer: |-
  Here are three candidate principles in British English, evaluated against your cases:

  1. **Essential Property Principle (EPP):** An object persists iff it retains the properties essential to its kind, where kinds are defined by their origin and function.
  2. **Causal History Principle (CHP):** An object is individuated by its unique causal history; persistence requires spatiotemporal and causal continuity under the same sortal.
  3. **Hybrid Origin-Function Principle (HOF):** An object’s persistence conditions are fixed by the sortal under which it came into being via a functional assembly process, tolerating only changes consistent with that function.

  **Best candidate: HOF** (refining your stab). Clause-by-clause justification:
  - "Came into being via functional assembly": Explains **Case 1** (statue *assembled* Friday, lump pre-exists) and **Case 5** (grown mineral isn’t *assembled* as art, so isn’t a statue; carved one is).
  - "Persistence requires changes consistent with that function": Handles **Case 4** (melted bronze loses *statue function* irreversibly; Lego reassembly preserves it) and **Case 2** (Ship of Theseus’s function as a seafaring vessel persists through gradual repair).
  - "Sortal-dependent": Resolves **Case 3** – only *cat* is functionally assembled as an organism; "cat-minus-tail" isn’t a genuine sortal with distinct function, avoiding 300 objects.

  **New cases:**
  - Caterpillar/butterfly: *One* animal (same functional assembly: organism) under HOF.
  - River: Persists (functional sortal: watercourse) despite matter replacement.
  - Company: Persists (functional sortal: corporate entity) if legally continuous, even with staff changes.

  **Kiln-fired statue:** HOF says the ceramic is *new*. The clay (as raw material) is destroyed by firing, and the statue’s function is reconstituted under a new process (ceramic art vs. unfired clay). This clashes with your "same statue" intuition but saves your "clay destroyed" verdict.

  **Honest limitations:** HOF struggles with **Ship of Theseus** – if function is primary, the reassembled ship *also* functions identically, threatening your "original ship" verdict. It also can’t fully ground why *gradual* replacement (Case 2) feels different to reassembly without specifying continuity. **Case 3**’s cutoff remains fuzzy without auxiliary criteria (e.g., natural boundaries).

