  Let me check the constraints: Exactly one coffee maker in the context? Yes, if we define the break room clearly. No perceptual error - speaker knows it's new. No vagueness - "broken" is clear. Speaker isn't confused. The uniqueness constraint holds because there's only one machine called "the coffee maker" in that workplace.

  For Russellian analysis: "There is exactly one coffee maker and it is broken" is false because the current machine isn't broken. But the singular proposition "That machine (pointing to the current one) is broken" is true. The untutored intuition would be that the speaker said something true about the non-functioning machine.

  The feature doing the work is the institutional persistence of a functional description despite physical replacement. If I remove this, it collapses into either incompleteness (if I just say "the coffee maker" without context) or misdescription (if people think it's the same machine). 

