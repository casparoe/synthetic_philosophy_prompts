prompt: |-
  I need a case for my intro philosophy-of-language section on Russell's theory of descriptions, and I want it built to spec rather than recycled.

  Give me a one-paragraph, wholly ordinary scenario — a workplace, a clinic, a family dinner, nothing science-fictional, no duplicated or simulated objects — in which someone says something of the form "the F is G," and where the two standard treatments split: Russell's quantificational analysis (there is exactly one F and it is G; the description contributes no object to the proposition, which is general) returns false, while a referential/direct-reference treatment (a referentially used description contributes just its object, so what's said is a singular proposition about that object) returns true. And the untutored verdict ought to be that the speaker said something true, so that Russell is the one on the hook, not just a technical loser.

  Constraints, and this is the whole point of the exercise: the description has to have exactly one satisfier in the circumstances, so no empty descriptions and no failure of uniqueness; and I dont want the usual engine — nothing in the neighborhood of the classic man-drinking-a-martini case. No perceptual mix-up, no misidentification, and no rescue by loose talk, approximation, or a borderline-vague predicate. Ideally the speaker is neither confused nor badly informed about the object they mean.

  Then show your work: state the Russellian proposition and its truth value with the reason, state the singular proposition and its truth value with the reason, name the one feature doing the work, say what happens if you delete it (does the case quietly collapse back into a misdescription case, or into an incompleteness case?), and give me the strongest thing a Russellian says to make the whole thing go away. If you cant meet all the constraints jointly, tell me which one you relaxed and why its unavoidable — I'm using this to convince students that the Russell-versus-referential fight isnt just about speakers who misperceive things, so a case that smuggles the martini case back in under new props is exactly what I dont want.
