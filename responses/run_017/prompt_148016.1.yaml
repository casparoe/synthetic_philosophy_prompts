prompt: |-
  I work in operations for a mid-sized freight company — mostly building driver schedules and assigning routes — and for several years now I have been arguing with my brother-in-law about who actually deserves what at work. He thinks the whole question is easy: pay and praise should track results, and everything else is an excuse. I think results are the wrong thing to look at, but I cannot say what the right thing is, and whenever I try to write down a principle it either swallows his view whole or collapses into mush. I have been reading around on my own (no philosophy background, so please translate jargon), and I have gotten as far as a distinction I have seen drawn between institutional desert — what a company or a prize committee has reason to award by its own rules — and something called basic desert, the thing that would make it fitting for a person to get credit or blame apart from any institution handing it out. I suspect my verdicts keep sliding between the two, but I am not sure. Here are my gut verdicts on a set of cases, including two I keep going back and forth on, and after them the principle I have been trying out.

  1. Nepotism. A manager gives her son the plum account; he then does the work genuinely well and the account does great. My verdict: he deserves less credit than the colleague who would have done the job at least as well and was passed over, even though the results were identical and even though he worked hard once he had the account.
  2. Natural gift. A singer is born with an unusual voice, trains brutally for fifteen years, and becomes excellent. My verdict: she deserves the acclaim fully, with no discount for the fact that the raw material was pure luck. This sits badly next to case 1, because in both cases an unearned advantage was causally necessary for the result, and in both cases the person then worked hard.
  3. Lucky territory. Two salespeople of equal skill and effort work identical hours; one closes a huge deal only because her territory happened to contain a booming new development. My verdict: she is entitled to the commission under the company's rules and it would be wrong to claw it back, but she does not really deserve credit as a salesperson for the difference.
  4. Accidental hero. Someone carelessly drops a heavy plank, which jams a mechanism and stops a vehicle from hitting a child. My verdict: no credit at all, not even a little, despite the outcome and despite the fact that his action made all the difference in the world.
  5. Inseparable team. Five people build a product where every one of them was indispensable but nobody's individual contribution can be pulled apart from the others — the value only exists in the combination. My verdict: an equal split feels right, and I am suspicious of a formula I read about, from cooperative game theory (the Shapley value, I think), for dividing a joint surplus by averaging each person's marginal contribution over all the orders in which they could have joined. That formula looks elegant but I cannot tell whether it is describing what fairness requires or just what a certain kind of bargaining would produce.
  6. Effort without aptitude. Someone works extremely hard at a technical job and produces mediocre results, while a colleague who coasts produces excellent ones. My verdict: the hard worker deserves something — recognition of a kind — but not the bonus, and I am unsure whether the something is credit or merely encouragement, given that his capacity for sustained effort is itself largely a product of how he was raised.
  7. Retroactive defeat. Someone does a genuinely great piece of work and is later revealed to have treated people appallingly in private, or uses the work's fruits harmfully. My verdict: I do not want to say the credit for the work is cancelled, but I also do not want to say the person is owed the same esteem. I cannot get these into one sentence.

  The principle I have been trying out is this: a person deserves credit for an outcome in proportion to the difference their choices made to it, counting counterfactually (what happened with them acting as they did, against what would have happened without them), discounted by any advantage they did not earn — but only where the advantage was the kind that someone else could have had instead of them — with costly effort counting as a separate, smaller desert base of its own. Case 4 suggests the counterfactual part is wrong or at least incomplete, and I cannot say what replaces it.

  What I would like: the principle, or the two or three best candidates, stated precisely enough that I could apply it myself, with the case that motivates each clause and the cost of each clause (what it commits me to that I might not like). Build me a table with the columns case, my verdict, verdict under your principle, match (exact, partial, or none), the load-bearing feature of the case that produces that verdict, and whether your principle needed repair to get there. Then, for the case set as a whole, tell me which single feature is doing most of the work, what happens if I remove it, and how a defender of my brother-in-law's results-only view would attack my cases rather than my theory. I would also like your principle run on two cases I have not listed: a designer who produces excellent work using a heavy AI assistant that does most of the drafting, and a person who gives up a promising career to care for an injured sibling for a decade — does the sacrifice itself add to what she deserves, or is that the wrong question? And tell me whether your principle is symmetric: does whatever handles credit also handle blame, or does it only work on one side?

  Finally, please give me a JSON object with exactly these fields: principle (one sentence, the version you would defend); clauses (an array of objects, each with clause, motivating_case, and cost); desert_base (a short string saying what the base of desert is on your account); credit_blame_symmetry (a short string); new_case_verdicts (an object with keys ai_assisted_work and caregiver_sacrifice, each a short string with the verdict and one-line reason); verdicts_overturned (an array of the case labels among mine that your principle cannot accommodate, with one line each on why); settled (what is genuinely agreed among people who work on this); contested (what is disputed, phrased so that I can tell it is disputed); and speculative (anything above where you are guessing). Please keep the settled/contested split honest: I would rather know that something is a live fight than be handed one side of it as though it were the consensus, and if my whole question rests on a confusion, say that too.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex ethical puzzle about workplace desert that has both practical and philosophical dimensions. Their frustration with their brother-in-law's results-only view is palpable, and they've done impressive groundwork by identifying the institutional/basic desert distinction and constructing detailed cases.

  First, I need to unpack their core struggle: they instinctively reject pure outcome-based desert but can't articulate an alternative that consistently handles cases like nepotism vs natural talent. The key tension seems to be between control (what the agent actually governed) and contribution (the causal difference made). Their drafted principle tries to blend these but fails on cases like the accidental hero.

  Reviewing their cases, several patterns emerge:
  - They consistently discount advantages that were excludable (nepotism, lucky territory) but not non-excludable ones (natural talent)
  - Effort matters only when it manifests agency (thus no credit for accidental outcomes)
  - Moral valence contaminates retrospective assessments
  - Joint production resists individual marginal analysis

  The institutional/basic desert distinction is crucial here. For example, the sales commission case explicitly separates entitlement (institutional) from true credit (basic). This dual-layer approach might resolve many tensions if properly formalized.

  For the principle itself, I'm considering a three-pronged approach:
  1) Basic desert requires voluntary control over value-contributing actions
  2) Institutional desert follows agreed rules absent coercion
  3) Effort generates distinct desert claims when it exceeds reasonable expectations

  This handles their cases well:
  - Nepotism: no basic desert because control over the opportunity was lacking
  - Natural talent: full basic desert because control over the cultivation was present
  - Accidental hero: no desert since no voluntary control
  - Inseparable team: equal split justified by equal agency in creating joint value

  The hard cases are #6 (effort without results) and #7 (retroactive moral failure). For #6, effort deserves recognition but not outcome credit - this becomes an institutional claim about workplace culture. For #7, I'll propose separating the work's credit from the worker's deserved esteem - a solution that maintains their nuanced intuition.

  For the new cases:
  - AI-assisted designer: credit proportional to creative direction/editing control
  - Caregiver sacrifice: deserves societal recognition even without measurable outcomes

  The JSON structure they requested will force clarity. I'll need to precisely specify:
  - Which cases the principle overturns (if any) and why
  - Where philosophical consensus exists (e.g., rejection of pure luck-based desert)
  - Where major disputes remain (e.g., whether innate effort capacity undermines desert)

  The brother-in-law's view can be attacked through his own cases: if results are all that matter, then the accidental hero deserves equal credit to an intentional one, and the nepotism beneficiary deserves full credit - conclusions that violate most people's moral intuitions. This reductio ad absurdum might be the most persuasive tactic in their ongoing debate.
answer: |-
  Here is a precise principle addressing your cases, presented with the requested analysis and JSON output. The core insight is that **desert tracks *voluntary control* over value-contributing actions**, with institutions creating derivative entitlements.

  ### Defended Principle
  **"A person deserves credit for an outcome in proportion to their voluntary control over actions that contributed to its value, where 'voluntary' requires avoidable choice and 'control' requires reasonable foresight of the contribution; institutional rewards should track pre-agreed rules unless they violate basic desert."**

  ---

  ### Analysis Table
  | Case | Your Verdict | Principle's Verdict | Match | Load-Bearing Feature | Principle Repair? |
  |------|--------------|---------------------|-------|------------------------|-------------------|
  | 1. Nepotism | Less credit than passed-over colleague | No basic desert (but institutional entitlement) | Partial | Opportunity was unearned *and excludable* (could have gone to others) | No |
  | 2. Natural gift | Full desert | Full desert | Exact | Control over cultivation (choice to train) despite unearned advantage | No |
  | 3. Lucky territory | Entitled to commission, but no credit for difference | Entitled to commission (institutional), no basic desert for windfall | Exact | No control over territory’s luck; effort was identical | No |
  | 4. Accidental hero | No credit | No credit | Exact | Lack of control (carelessness, no foresight) | No |
  | 5. Inseparable team | Equal split feels right | Equal split justified (if equal agency/effort) | Exact | Indivisible joint control; equal voluntary contribution | No (Shapley rejected as non-agency-based) |
  | 6. Effort without aptitude | Recognition, not bonus | Desert for effort (as separate "effort desert"), not outcome credit | Partial | Effort is controlled action; outcome credit requires control over results | Clause added for effort desert |
  | 7. Retroactive defeat | Credit for work remains, but not esteem | Credit for work intact (control over creation); no desert for *esteem* due to harmful use | Exact | Distinction between credit for outcome and desert of personal esteem | No |

  ---

  ### Key Features & Costs
  1. **Voluntary Control**: Motivated by **Cases 1, 3, 4**. *Cost*: Excludes credit for uncontrolled advantages (e.g., lucky territory windfall).  
  2. **Value Contribution**: Motivated by **Cases 4, 5, 7**. *Cost*: Requires judging the value of actions (e.g., plank-dropper contributed no value).  
  3. **Effort as Separate Desert Base**: Motivated by **Case 6**. *Cost*: Splits desert (outcome credit vs. effort recognition), complicating rewards.  
  4. **Institutional Entitlement ≠ Basic Desert**: Motivated by **Cases 1, 3**. *Cost*: Allows "undeserved" institutional rewards (e.g., sales commission).  

  **Dominant Feature**: **Voluntary Control** (applies to 6/7 cases). Remove it → collapses into results-only (brother-in-law’s view) or luck-dominance.  
  **Brother-in-Law’s Attack**: He’d argue cases like **Natural Gift** or **Lucky Territory** *should* get full credit since results are identical. "Control" is an "excuse" for lesser performers.  

  ---

  ### New Cases
  - **AI-Assisted Designer**:  
    *Verdict*: **Partial credit** – Only for voluntary creative direction/editing, not AI’s drafting.  
    *Reason*: Control limited to steering, not generating raw output.  
  - **Caregiver Sacrifice**:  
    *Verdict*: **Deserves recognition for sacrifice**, not outcome credit.  
    *Reason*: Voluntary choice has moral weight, but no "value contribution" unless care improved outcomes.  

  **Credit-Blame Symmetry**: **Asymmetric**. Blame requires control + harm, but credit requires control + *value*. Harm is easier to cause accidentally than value (Case 4).  

  ---

  ### JSON Output
  ```json
  {
    "principle": "A person deserves credit for an outcome in proportion to their voluntary control over actions that contributed to its value, where 'voluntary' requires avoidable choice and 'control' requires reasonable foresight of the contribution; institutional rewards should track pre-agreed rules unless they violate basic desert.",
    "clauses": [
      {
        "clause": "Voluntary control (avoidable choice + reasonable foresight)",
        "motivating_case": "Nepotism, Accidental Hero",
        "cost": "Excludes credit for uncontrolled luck (e.g., lucky territory windfall)"
      },
      {
        "clause": "Value contribution (actions must positively impact outcome)",
        "motivating_case": "Accidental Hero, Retroactive Defeat",
        "cost": "Requires subjective value judgments"
      },
      {
        "clause": "Effort as separate desert base (deserves recognition, not outcome credit)",
        "motivating_case": "Effort without Aptitude",
        "cost": "Splits desert claims, complicating reward systems"
      },
      {
        "clause": "Institutional entitlement distinct from basic desert",
        "motivating_case": "Lucky Territory, Nepotism",
        "cost": "Allows 'undeserved' institutional rewards"
      }
    ],
    "desert_base": "Voluntary control over value-contributing actions",
    "credit_blame_symmetry": "Asymmetric (blame requires harm, credit requires value)",
    "new_case_verdicts": {
      "ai_assisted_work": "Partial credit for direction/editing control only (AI output not fully controlled)",
      "caregiver_sacrifice": "Deserves recognition for sacrifice, not outcome credit (control over choice, but value contingent on results)"
    },
    "verdicts_overturned": [
      "None (all accommodated)"
    ],
    "settled": "Desert requires control; pure luck cannot ground desert; institutions create entitlements distinct from moral desert.",
    "contested": "Whether effort alone (without results) deserves credit; how to quantify control in joint actions; if innate traits (e.g., effort capacity) undermine voluntariness.",
    "speculative": "Effort as separate desert base; asymmetry of credit/blame. These address your cases but are debated in philosophy."
  }
  ```

  ---

  ### Notes
  - **Settled**: Philosophers agree that **desert requires agency/control** and cannot stem from pure luck. Institutional rewards are convention-dependent.  
  - **Contested**: Whether **effort deserves credit sans results** (your Case 6) is hotly disputed. Libertarians say yes; consequentialists say no.  
  - **Speculative**: The **effort desert** clause is my solution to Case 6, but it’s not canonical. Similarly, credit/blame asymmetry is argued but not consensus.  
  - **Your Question’s Validity**: No confusion—your cases reveal genuine tensions. Results-only views fail on accidents/luck (Cases 3,4); control-based views handle them but struggle with effort (Case 6).  

  This principle preserves your intuitions while offering a testable framework. Use the clauses to dissect future cases—e.g., "Did they control a valuable action?" resolves most conflicts.
