answer: |-
  ## Sestina for a Shrinking Readership

  You hold this page at some uncertain **RANK**  
  Among the eyes that scan these lines. Assume  
  Your presence here implies no special **CLASS**,  
  Just chance: a **RANDOM** hand that plucked this **SAMPLE**  
  From shelves or screens. This logic points to **DOOM**  
  For readership. Your middling place? Too **SOON**.

  Too **SOON** to be among the final few,  
  Says instinct. Yet your middling **RANK** implies  
  The bulk are past. The total count spells **DOOM**:  
  Not vast expansions, but a finite **CLASS**.  
  Accept the premise: you're a fair **SAMPLE**,  
  A neutral, representative **RANDOM**.

  If every reader is a **RANDOM** pick  
  From all who *will* exist, arriving **SOON**  
  Or long since gone, then you're a telling **SAMPLE**.  
  Your median position, current **RANK**,  
  Suggests the total size of our **CLASS**  
  Nears its conclusion – harbinger of **DOOM**.

  This printed word becomes the engine of **DOOM**.  
  To read this argument, a **RANDOM** act,  
  Assigns you to a dwindling **CLASS**,  
  Confirms the end arrives unnervingly **SOON**.  
  Your silent tally marks the final **RANK**,  
  A self-fulfilling proof, a cursed **SAMPLE**.

  But pause. Is this a valid **SAMPLE**?  
  Perhaps existence in a world of **DOOM**  
  Is likelier? If vast future **RANK**  
  Existed, wouldn't **RANDOM** chance ensure  
  You'd likely land much later? Not **SOON**?  
  Does scope itself define the reader's **CLASS**?

  What bounds the set? Who counts within the **CLASS**?  
  Translators? Skimmers? Ghosts? A flawed **SAMPLE**  
  Distorts the count, makes meaningless **SOON**.  
  The argument itself invites the **DOOM**  
  It claims to find: why join a **RANDOM**  
  Audience foretold to halt at *your* **RANK**?

  &nbsp;

  You, finding proof of **DOOM** in current **RANK**,  
  Now question if this **CLASS** is rightly drawn. This **SAMPLE**,  
  This **RANDOM** choice, predicts the end comes **SOON**.

  ### Notes on Form & Argument
  *   **Form as Argument:** The fixed, rotating end-words mirror the Doomsday Argument's reliance on a single, recycled indexical fact (the reader's position/birth rank) rearranged to predict final scale.
  *   **Self-Fulfilling Prophecy:** The poem explicitly notes that *publishing* the argument ("This printed word...") might cause the predicted end by discouraging future readers. The prediction and its potential cause are identical.
  *   **Philosophical Landmarks:**
      *   **Sampling Assumption:** "treat your presence... Just chance: a **RANDOM** hand" (Stanza 1), "Accept the premise: you're a fair **SAMPLE**" (Stanza 3).
      *   **Implicit Uniform Prior:** "Your middling place? Too **SOON**" (Stanza 1), "Suggests the total size... Nears its conclusion" (Stanza 3). Assumes no prior bias towards large totals.
      *   **Self-Indication Assumption (SIA) Counter:** "Perhaps existence in a world of **DOOM** / Is likelier? If vast future **RANK** / Existed, wouldn't **RANDOM** chance ensure / You'd likely land much later? Not **SOON**?" (Stanza 5). Introduces the idea you're *more likely* to exist in a large population.
      *   **Reference Class Problem:** "What bounds the set? Who counts within the **CLASS**?" (Stanza 6), culminating in the envoi crowding all six words, forcing the ambiguity.
  *   **Ambiguous Ending:** The envoi avoids resolution, leaving the reader questioning the validity of the argument and the poem's own role ("You, finding proof... Now question..."). Is it insight or a con?
