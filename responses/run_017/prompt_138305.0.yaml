prompt: |-
  I chair the serious incident review panel at a ~500-bed hospital — we meet every other week, about 90 minutes per case, and the output that matters is a short "causal findings" section that says things like "the delay in giving antibiotics caused the septic shock" or "admission on a weekend contributed to the worse outcome." Those reports go to the family, to the department involved, and to legal, and they trigger things: a new protocol, mandatory training, sometimes a budget line. Six of us: two nurses, two physicians, a risk manager, and me. I did some philosophy as an undergrad, which is why I'm writing this, and nobody else on the panel has any formal training in it.

  I've become convinced we're making two specific messes and I want a procedure, not an explanation.

  Mess one: we conflate two quite different claims. (a) "this patient would not have died if the delay hadn't happened" — a one-off counterfactual about this admission — and (b) "if we changed the system so this kind of delay can't happen, future patients like this one do better" — a claim about what would happen under an intervention. These can come apart in both directions: sometimes (a) is true and (b) is false because this was a fluke that our fix wouldn't touch, and sometimes (b) is true and (a) is false because something else in that admission would have killed her anyway and the delay just happened to be there first. The family reads the report wanting (a); the department is supposed to act on (b). We write one sentence that pretends to be both.

  Mess two: we write findings about things nobody can say how to change. "Weekend admission," "frailty," "poor handover," "the patient's race." Nobody can tell me what we would actually do to set those to a value, or what else would move along with them if we did. Half the time the honest answer is that the intervention isn't specified, so we don't know what question we're even asking.

  So: write me a procedure the panel can actually run in our 90 minutes, as an ordered set of tests — what to ask first, what counts as a sufficient answer at each step given what we have (the chart, maybe two interviews, occasionally registry data; we can't randomize anything), where it stops with "no causal finding," and where it hands the decision to a person because the question is one of values and not facts. It has to do something useful with: counterfactuals that quietly rewrite earlier events ("if she hadn't been admitted Friday she'd have been seen by a different team entirely"), overdetermination, and causes we can't manipulate. Give us a small set of sentence templates for what we can defensibly assert at each exit point — the wording has to be readable by a grieving family and survivable in a deposition, and legal and I both sign off.

  Then run it on three: the delayed-antibiotics/septic-shock case; a "weekend admission caused the worse outcome" finding; and a case where the panel wants to write that the patient's race caused the worse outcome and the only real evidence is a disparity in our own numbers plus some notes about how staff spoke to her. Include at least one where the procedure gives me an answer I won't like. And tell me plainly where it will misfire on us and what it can't do.
reasoning: |-
  Okay, let me start by understanding the user's problem. They chair a hospital serious incident review panel. Their main issues are conflating two types of causal claims and attributing causes to things they can't change. 

  First, mess one: the difference between the counterfactual for the specific patient (a) and the systemic intervention for future cases (b). They need a way to separate these clearly. The family cares about (a), while the department needs (b) for actionable changes. The current reports mash them together, causing confusion.

  Second, mess two: citing causes like "weekend admission" or "race" without a clear intervention. If you can't define how to change it, then it's not actionable. The panel ends up with findings that don't lead to practical solutions. 

  The user wants a procedural checklist—something they can run in 90 minutes. It needs clear steps, decision points, and templates for findings. The output must be understandable for families and defensible legally. 

  I recall Judea Pearl's causal inference frameworks, especially the distinction between type and token causality. Also, Bradford Hill criteria for epidemiological evidence might help with systemic factors. Need to incorporate manipulability—causes must be things you can actually intervene on. 

  For the procedure, start with the specific case. Determine if the alleged cause was necessary for the outcome in this instance. That's the token-level question. If not, then (a) is false. Then, evaluate if changing the cause would improve outcomes generally—systemic causation. Requires evidence that the cause consistently leads to harm and that interventions exist. 

  For non-manipulable factors like race or weekend admission, reframe them. Instead of blaming the weekend, look for modifiable elements like staffing levels or resource availability. Same with race—focus on specific behaviors like bias in clinical decisions. 

  Now, testing the procedure on the three cases: 

  1. **Delayed Antibiotics:** Token causation asks if the delay was necessary for septic shock. If yes, then (a) is true. Then, systemic: are interventions like faster protocols feasible? If yes, recommend changes. 

  2. **Weekend Admission:** Token causation—was the weekend necessary for the bad outcome? Maybe not, if other factors were at play. Systemic: what specific aspects of weekend care are modifiable? Staffing? Resources? Shift to those. 

  3. **Race as Cause:** Token level—hard to prove necessity. Systemic: if disparity data exists, but race itself isn't modifiable. Instead, look for biased behaviors or policies. Recommend training or policy reviews. 

  The user might not like when token causation isn't found, but systemic is. For example, a patient might have died anyway, but fixing the delay helps others. That's tough for families but necessary for systemic change. 

  Potential misfires: when evidence is weak, the procedure stops early with "no causal finding." Also, complex cases with multiple causes might need more time. The panel has to make judgment calls when evidence isn't clear. 

  Templates need to be clear. For token causation: "In this case, [cause] was necessary for [outcome]." For systemic: "Changing [modifiable factor] would reduce future occurrences." Avoid non-actionable terms. 

  In the race case, shift from "race caused" to "bias in communication contributed," which is actionable. This meets legal and ethical standards while addressing disparities. 

  The key is separating the two questions, insisting on interventions, and using clear language. This should make reports more accurate and actionable while being transparent to families.
answer: |-
  Here’s a procedural framework for your panel, designed to resolve both messes within 90 minutes. It separates **token causation** (what happened *in this case*) from **systemic causation** (what *would happen* under intervention), and enforces **actionability**. The procedure has 5 steps, exit points, and templated outputs. Legal viability hinges on **limiting claims to evidence-supported, modifiable factors**.

  ---

  ### **Procedure: Causal Assertion Protocol (CAP)**
  **Inputs:** Chart, interviews, registry data (if available)  
  **Time allocation:** Strict 15 min/step max  
  **Rules:**  
  - If any step fails, exit with "No causal finding" or partial finding.  
  - "Insufficient evidence" is a valid conclusion.  
  - *No* speculative rewriting of history (e.g., "if admitted Monday..." without evidence).

  #### **Step 1: Define the Alleged Cause (C) and Outcome (O)**  
  *Purpose: Prevent vague "causes" like "weekend" or "race."*  
  - **Test:** Specify C and O in **measurable, binary terms** (e.g., "antibiotics >2h post-triage," "septic shock onset").  
  - **Actionability Gate:** Can we describe a **realistic intervention** that *sets C to a different value*?  
    - *If NO* (e.g., "weekend," "race," "frailty"): **Exit → "Non-modifiable factor."**  
    - *If YES* (e.g., "delay in antibiotics" → protocol change): Proceed.  
  - *Time saver:* Reject C immediately if no intervention exists.

  #### **Step 2: Token Causation (Was C necessary *for this patient*?)**  
  *Purpose: Validate claim (a) for the family.*  
  - **Test:** Apply the **but-for test** with **minimal rewrite**:  
    *"But for C, would O *not* have occurred, holding all *known* pre-C conditions fixed?"*  
  - **Evidence rules:**  
    - Use *only* data from **this case** (chart, interviews).  
    - Ignore statistical trends (save for Step 3).  
    - If O was **overdetermined** (e.g., multi-organ failure *before* delay), **fail**.  
  - **Exit points:**  
    - **Sufficient evidence for "yes"**: Proceed to Step 3.  
    - **Sufficient evidence for "no"**: Exit → "C did not cause O in this case."  
    - **Insufficient evidence**: Exit → "No finding on token causation."

  #### **Step 3: Systemic Causation (Would fixing C improve *future* outcomes?)**  
  *Purpose: Validate claim (b) for departments/legal.*  
  - **Test:** Is there evidence that **changing C reduces O** in *similar future cases*?  
  - **Evidence hierarchy (descending priority):**  
    1. **Registry/prior data** showing O↓ when C↓ (e.g., sepsis mortality vs. antibiotic time).  
    2. **Mechanism evidence**: C→O path is biologically/operationally plausible (e.g., delay→bacteremia→shock).  
    3. **Expert consensus** (panel vote): Physicians/nurses agree C→O is likely *generalizable*.  
  - **Threshold:** ≥2 evidence lines required.  
  - **Exit points:**  
    - **Met**: Proceed to Step 4.  
    - **Not met**: Exit → "No systemic causal finding."  

  #### **Step 4: Specify the Intervention**  
  *Purpose: Force actionable recommendations.*  
  - **Test:** Define **who would do what, when, and how** to change C (e.g., "Triage nurse initiates antibiotics via standing order when [criteria]").  
  - **Feasibility check:**  
    - **Not feasible** (e.g., "double ICU staffing on weekends" with no budget): Exit → "System barrier identified; escalate to administration."  
    - **Feasible**: Proceed to Step 5.  

  #### **Step 5: Harm-Benefit Threshold (Values decision)**  
  *Purpose: Weigh unintended consequences.*  
  - **Test:** Panel assesses:  
    - Would the intervention cause **likely net harm** (e.g., workflow disruption, new errors)?  
    - Is the burden on staff **disproportionate** to expected benefit?  
  - **Exit:**  
    - **Net harm/disproportionate**: Exit → "Causal link established but intervention not recommended; rationale: [ ]."  
    - **Net benefit**: Final causal finding.  

  ---

  ### **Output Templates**  
  **Legal key:** Use "contributed to" (not "caused") for partial necessity; avoid absolutes.  

  | Exit Point | Template | Audience |
  |------------|----------|----------|
  | **Token causation (Step 2)** | "In this case, [C] contributed to [O]." | Family, legal |
  | **Systemic causation (Step 3 onward)** | "Preventing [C] through [specific intervention] is expected to reduce future risk of [O]." | Department, legal |
  | **Non-modifiable factor (Step 1)** | "[Factor, e.g., weekend admission] was associated with [O], but is not modifiable. Modifiable elements identified: [e.g., weekend staffing]." | All (transparent) |
  | **No causal finding** | "Evidence was insufficient to establish a causal link between [C] and [O]." | All |

  ---

  ### **Test Cases**  
  #### Case 1: Delayed Antibiotics → Septic Shock  
  - **Step 1:** C = "Antibiotics >120m post-triage." Intervention = "Nurse-initiated antibiotic protocol." → **Actionable.**  
  - **Step 2:** Chart shows shock onset 30m *after* delayed antibiotics. No earlier organ failure. → **Token: YES.**  
  - **Step 3:** Registry data shows mortality ↑ 8%/hour delay; biologically plausible. → **Systemic: YES.**  
  - **Step 4:** Intervention = "Triage nurse gives antibiotics if [SIRS criteria] + lactate >4." → **Feasible.**  
  - **Step 5:** Net benefit (lives saved > overtreatment risk).  
  - **Output:**  
    - Token: "In this case, the delay in antibiotics contributed to septic shock."  
    - Systemic: "Implementing nurse-initiated antibiotics for high-risk sepsis cases is expected to reduce future mortality."  

  #### Case 2: Weekend Admission → Worse Outcome  
  - **Step 1:** C = "Admission on Saturday/Sunday." Intervention = ? → **Non-modifiable.** Exit Step 1.  
  - **Reframe C:** "Reduced weekend senior coverage" → **Actionable.**  
  - **Step 2:** Token: Patient deteriorated during 12h without senior review. → **Token: YES** (if no other causes).  
  - **Step 3:** Data shows weekend admissions have ↑ 20% mortality; notes cite missed complications. → **Systemic: YES.**  
  - **Step 4:** Intervention = "On-call consultant rounds twice daily on weekends." → **Feasible.**  
  - **Output:**  
    - Token: "In this case, delayed senior review contributed to the outcome."  
    - Systemic: "Increasing weekend consultant rounds is expected to improve outcomes."  

  #### Case 3: Race → Worse Outcome (You Won’t Like This)  
  - **Step 1:** C = "Patient’s race." Intervention = ? → **Non-modifiable.** Exit Step 1.  
  - **Reframe C:** "Biased clinical communication" (e.g., notes show staff dismissed symptoms). → **Actionable.**  
  - **Step 2:** Token: Evidence of delayed treatment *after* dismissive comments? → **Insufficient evidence** (no chart documentation). Exit Step 2.  
  - **Systemic:** Registry shows racial disparity in outcomes. Panel consensus on bias mechanism. → Proceed.  
  - **Step 4:** Intervention = "Mandatory implicit bias training + structured symptom assessment."  
  - **Output:**  
    - Token: "No finding on token causation."  
    - Systemic: "Implementing bias training and structured assessments is expected to reduce outcome disparities."  
  - **Why you won’t like it:** Token claim fails (no direct evidence), but systemic action is recommended. Family gets no "cause," but hospital must act.  

  ---

  ### **Where It Misfires & Limitations**  
  1. **Complex overdetermination:** If 5 factors cause O, CAP may miss interactions.  
  2. **Missing data:** If chart lacks critical details (e.g., undocumented symptoms), token causation fails.  
  3. **Novel mechanisms:** If C→O path is unprecedented (e.g., new drug reaction), systemic evidence may be weak.  
  4. **Values conflicts:** Step 5 is subjective; a risk-averse panel may block useful interventions.  
  5. **Speed:** 90 min may be tight for multi-factorial cases (prioritize 1-2 key factors).  

  **Critical safeguard:** Always append: "Findings based on available evidence; absence of causation is not exoneration."  

  This procedure forces clarity, separates token/systemic claims, and ties causation to action. It accepts that some answers are "we don't know" — which is defensible and safer than overstatement.
