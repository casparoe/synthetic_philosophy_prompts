prompt: |-
  ok so a mate and I got properly into it about the statue and the clay thing last night and I relised I don't actually know where our disagreement lives. So here's our version of the case, which is maybe not the standard one.

  A sculptor takes a single lump of clay and over an afternoon shapes it into a statue. Call the statue Goliath and the clay Lump. Fine, normal so far. Now the twist: instead of squashing it back into a ball, we fire it in a kiln. Firing is a gradual chemical change: water leaves, the clay minerals vitrify into ceramic. Suppose we all agree on two things afterwards — Goliath still exists (same statue, now hard and permanent), and Lump does not exist anymore, because what's on the shelf is ceramic, not clay. Also suppose the kiln ramps up slowly over several hours, so there's no sharp moment at which clay stops and ceramic starts.

  The proposition I want a number on: before firing, Goliath and Lump were two numerically distinct objects that coincided — sharing all their parts, filling the same region, not identical to each other — rather than one and the same thing picked out by two descriptions. Count "no statues, only simples arranged statue-wise" and "there's no determinate answer to how many objects are on the shelf" as live answers in their own right, not as hedges.

  My credence on distinctness is about 0.7, hers is about 0.3. Give me yours, but I care much more about the decomposition:

  - how much rides on whether there's a determinate number of material objects on that shelf at all, versus counting being sortal-relative or interest-relative or just vague
  - how much on whether composite objects exist at all, rather than only simples arranged statue-wise
  - how much on whether two things can share all their parts and all their place and still not be identical
  - how much on whether artifacts like statues have different persistence conditions from their matter — and especially on whether the firing case really gives you a modal difference in *both* directions (the lump survives squashing that the statue doesn't; the statue survives firing that the lump doesn't), or whether that second half is just a stipulation I smuggled in
  - whether the slow ramp of the kiln matters at all: if there's no fact about when Lump goes out of existence, does that definately infect the claim that there were two things there beforehand

  Give each term a rough number and one line of justification, say how they combine into your final credence, and then tell me three things: which term you're least confident in, which one my mate and I are most likely disagreeing about, and what single argument or bit of evidence would move your number the most. Pls don't just tell me it depends what you mean by "object" — I want the number and the load-bearing joints exposed.
