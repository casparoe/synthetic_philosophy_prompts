answer: |-
  Here’s a targeted Q&A prep sheet focusing on high-probability objections from your audience, ranked by damage potential. Replies are designed for clarity under time pressure, with tactical concessions flagged upfront.

  ### Core Concessions to Make Early (First 2 Minutes)
  1. **"Predictors aren’t perfect or mystical"**: Concede that real-world predictors (like the driver) use noisy signals (past behavior, cues) to infer *profile*-visible dispositions. Your model idealizes this as pattern-detection.  
  2. **"Rationality is normative, not just payoff-max"**: Acknowledge that economists may treat "rational" as synonymous with maximization, but your argument requires a *normative* concept (e.g., coherence with reasons). Flag this upfront to avoid semantic tangles.  
  3. **"Commitment devices exist"**: Grant that pre-commitment tools (e.g., burning money) can screen types efficiently—but argue this *supports* your point: it bypasses the need for "irrational" dispositions.

  ---

  ### Top 8 Objections & Replies  
  *(Ordered by damage potential, highest first)*  

  1. **Objection (Behavioral Economist)**:  
     *"This is just a screening problem with a separating equilibrium. The 'disposition' is a commitment device to signal type. Why complicate it with philosophy?"*  
     **Reply**: "Exactly—and in screening models, the optimal signal (e.g., installing a commitment device pre-prediction) is payoff-maximizing for a rational agent *without* needing irrationality. My point is that Parfit’s framing mistakes this for irrationality."  
     **Soft Spot**: If they insist *all* dispositions are reducible to signaling, your distinction collapses. Rebut by noting snapshot/profile visibility affects signaling costs.  

  2. **Objection (Causal Decision Theorist)**:  
     *"If the driver predicts I’ll pay, and I know this, CDT says I should cheat and not pay—maximizing payoff. Your ‘rational disposition’ just ignores the dominance argument."*  
     **Reply**: "CDT *does* recommend cheating *if* the prediction is snapshot-based (e.g., ‘they’re currently intending to pay’). But for profile-visible dispositions (e.g., ‘they’re broadly trustworthy’), a rational CDT agent with that trait pays *because* having the trait made prediction accurate. No dominance violation."  
     **Soft Spot**: Assumes CDT agents can have "traits" without self-sabotage. Stress that *forming* the trait is rational pre-prediction.  

  3. **Objection (Mechanism Designer)**:  
     *"In the real world, predictors use snapshot cues (e.g., nervousness, pledges). Profile visibility is unrealistic—nobody observes your ‘trait’ across time before deciding."*  
     **Reply**: "Agreed—in one-off interactions, snapshots dominate. But Parfit’s case assumes the driver knows your *character* (a profile trait). Vary the case: if you *can* install a commitment device (e.g., escrow) *before* prediction, the rational move isn’t ‘be irrational’—it’s to commit."  
     **Soft Spot**: If character isn’t inferable from snapshots, your argument weakens. Cite reputation systems (e.g., credit scores) as real-world profile signals.  

  4. **Objection (Philosopher of Action)**:  
     *"Intentions *are* plans. A ‘disposition to pay’ just *is* an intention-in-action. Calling this ‘irrational’ confuses ontology with normativity."*  
     **Reply**: "Crucially, the intention-in-action here is *responsive to reasons*. If the driver’s prediction tracks my *stable plan* (profile-visible), not my momentary urge (snapshot), then acting on that plan when it’s costly *is* rational—it’s fidelity to my prior rational commitment."  
     **Soft Spot**: Requires accepting that plan-stability can be rational even with local costs.  

  5. **Objection (Experimental Economist)**:  
     *"We see real people ‘irrationally’ pay in lab versions of this. Isn’t your argument just redefining their behavior as ‘rational’ post hoc?"*  
     **Reply**: "No—it shows their behavior *isn’t* irrational! If people internalize norms of reciprocity (a profile-visible trait), paying *maximizes expected utility* by enabling future cooperation. The ‘irrationality’ is an artifact of oversimplified rationality models."  
     **Soft Spot**: Risks circularity ("whatever pays is rational"). Emphasize that the *trait* must be cultivatable rationally ex ante.  

  6. **Objection (Decision Theorist / Ratification)**:  
     *"After prediction, refusing to pay *ratifies* as optimal. If the driver knew I’d ratify this way, wouldn’t they predict non-payment?"*  
     **Reply**: "Only if ratification is snapshot-visible. But if the driver knows I’m the *sort* of agent who sticks to plans (profile-visible), they predict payment *even if* I could locally ratify non-payment. My point is that good predictors track the latter."  
     **Soft Spot**: Implies predictors ignore ratifiable deviations. Argue that profile traits *constrain* ratification.  

  7. **Objection (Behavioralist Rebuttal)**:  
     *"If ‘rational’ agents can have these dispositions, why do we need commitment devices? Your view implies they’re unnecessary."*  
     **Reply**: "Not at all! Commitment devices *are* tools for rational agents when predictors can’t detect profile traits (e.g., one-off interactions). They let you *simulate* a profile trait via snapshots (e.g., burning money signals resolve)."  
     **Soft Spot**: Undercuts if commitment devices are always more efficient. Concede they often are, making "dispositions" irrelevant.  

  8. **Objection (Formal Epistemologist)**:  
     *"How do you formally distinguish snapshot/profile visibility? This seems model-relative."*  
     **Reply**: "Snapshot visibility: disposition D is inferable from the agent’s state in a *single* decision problem. Profile visibility: D requires observing choices across *multiple* problems (e.g., temptation resistance). Yes, it’s predictor-dependent—that’s the point! Parfit’s argument equivocates between them."  
     **Soft Spot**: Lacks a formal criterion. Use examples (e.g., trembling hands vs. consistent honesty).  

  ---

  ### The Nightmare Question  
  **"How can a ‘fully rational agent’ have a *disposition to act irrationally* in a snapshot frame without it being a dynamic inconsistency? Doesn’t this collapse your distinction?"**  
  *(Likely from the CDT theorist or philosopher of action)*  

  **Why it’s deadly**: Forces you to defend rationality of "irrational" actions head-on, potentially reviving Parfit’s original conflict.  

  **Defense Strategy**:  
  1. **Reject the premise**: "It *isn’t* irrational to act on a profile-visible disposition! If the predictor sees your trait, paying *is* rational (avoids being stranded). The ‘irrational’ tag only sticks if we wrongly assume prediction is snapshot-based."  
  2. **Shift to costs**: "The agent pays a *local* cost to maintain a *global* benefit (trustworthiness). This is dynamically consistent if the trait was rationally adopted *because* it secures predictions of cooperation."  
  3. **Nuclear option**: "In snapshot framing, yes, it *looks* inconsistent—but that’s why Parfit’s setup is misleading. Real predictors don’t work that way with traits. The inconsistency is in the *model*, not the agent."  

  **Weakest Point**: If the audience insists rationality must be defined *moment-by-moment*, your view fails. Double down on:  
  > *"Rationality isn't myopic. Agents can reasonably bind future selves to traits that serve their interests, even if local actions seem suboptimal. The alternative is self-defeating overprediction games."*  

  ### Tactical Summary
  - **Control framing**: Start Q&A by restating: "This isn’t about whether dispositions pay off—they often do. It’s about whether that payoff implies irrationality. I say no, because it hinges on empirical predictor limits."  
  - **Economist bait**: Use "screening," "signaling," and "commitment devices" in replies to speak their language.  
  - **Philosopher trap**: Don’t let them hijack Q&A into abstract intention theory. Redirect with: "Whether intentions are plans isn’t key—what matters is how *predictors* read them."  
  - **Exit strategy**: If cornered, concede: "My core claim is modest: Parfit’s conclusion doesn’t *follow* from the hitchhiker case alone. The rest is model-building."  

  This prep isolates your crux: **The predictor’s epistemology drives the paradox, not rationality**. Stick to that, and you’ll force critics to engage your actual argument. Good luck!
