answer: |-
  ## Decision Tree: Ethical Boundaries in Historical Fiction (Workshop Instrument)

  **Instructions:** Work through the following eight questions sequentially. Each answer leads down a branch defining permissible fictionalisation. Your path ends at a leaf position describing your ethical stance. Focus solely on the concrete cases presented.

  1.  **Q1 (Subject of Claim):** Does the primary ethical claim against fictionalisation belong to:  
      **(A)** The deceased historical figure herself?  
      **(B)** The living descendants/community remembering her?  
      *(Recasts i)*

  2.  **Q2 (Nature of Obligation):** Is the core objection to fictionalisation primarily about:  
      **(A)** Falsifying documented events or facts (what *happened*)?  
      **(B)** Creating a misleading or damaging impression of her character (how she *appears*)?  
      **(C)** The very act of appropriating her life for artistic purposes (being *used*)?  
      *(Recasts ii)*

  3.  **Q3 (Waiver/Forfeiture):** Could actions by the historical figure *in life* (e.g., destroying personal papers, using aliases, courting public notoriety) diminish or negate the claim against fictionalisation?  
      **(A)** Yes, such actions imply acceptance of scrutiny or loss of control over narrative.  
      **(B)** No, the claim persists regardless of her actions; she couldn't foresee this use.  
      *(Recasts iii)*

  4.  **Q4 (Types of Invention):** Is inventing the following ethically distinct, or essentially the same kind of offence?  
      **(A)** Words she never spoke aloud (but plausibly thought).  
      **(B)** Actions she never performed.  
      **(C)** Private thoughts/admissions she never recorded.  
      **(D)** Consequences she never lived to see.  
      *Choose:*  
      **(X)** All four are distinct offences with potentially different severity.  
      **(Y)** All four are fundamentally the same offence: creating falsehoods about her.  
      *(Recasts iv)*

  5.  **Q5 (Truth via Fabrication):** Can fabricating a specific, undocumented detail (e.g., foundling ward childhood) be justified if it serves as the vehicle for conveying a broader, undocumented truth you believe is *implied* by the record (e.g., profound childhood deprivation)?  
      **(A)** Yes, the higher truth redeems the fabricated particular.  
      **(B)** No, fabricating specifics is inherently misleading, regardless of intent.  
      *(Recasts v)*

  6.  **Q6 (Audience Perception):** Does the ethical risk increase if the invented element:  
      **(A)** Is likely to be mistaken by readers for documented fact?  
      **(B)** Is clearly presented as fictional speculation?  
      *(New)*

  7.  **Q7 (Scale of Fabrication):** Is the ethical concern greater for inventing:  
      **(A)** Core biographical facts shaping identity (e.g., childhood origin)?  
      **(B)** Specific moments, thoughts, or dialogue within an established life?  
      *(New)*

  8.  **Q8 (Artistic Necessity):** Is an invented element only permissible if:  
      **(A)** It is demonstrably *necessary* to achieve a core artistic goal unobtainable otherwise?  
      **(B)** It is merely *useful* or *desirable* for the narrative?  
      *(New)*

  ---

  **The Leaves (Ethical Positions):**

  1.  **Strict Archivalism:**  
      *Awkward Commitment:* Must omit vast swathes of plausible human experience and motivation simply because no document mentions them.  
      *Spoken Sentence:* Omit it entirely. If undocumented, it cannot exist in the narrative.

  2.  **Living Claims Only:**  
      *Awkward Commitment:* Descendants' sensitivities (however inconsistent or historically ill-informed) outweigh fidelity to the dead subject's actual life.  
      *Spoken Sentence:* Include it only if no living descendant objects to *this specific invention*.

  3.  **Communal Custody:**  
      *Awkward Commitment:* Defining the relevant "community" and its legitimate spokespersons is often impossible or contentious.  
      *Spoken Sentence:* Include it only if it aligns with the community's prevailing understanding/memory of her character.

  4.  **Mosaic Licence:**  
      *Awkward Commitment:* Permits wildly implausible or anachronistic scenarios if built solely from documented fragments rearranged.  
      *Spoken Sentence:* Include it *only* if every word within it is documented as having been *said by her or someone in her circle* elsewhere, even if recontextualised.

  5.  **Counterfactual Confession:**  
      *Awkward Commitment:* Requires near-certainty about undocumented internal states, a high bar rarely met, especially for complex emotions or motives.  
      *Spoken Sentence:* Permit it if the *sentiment* expressed is overwhelmingly implied by documented actions/events *and* expressing it aloud doesn't soften a documented harshness in her character.

  6.  **Anachronism of Interiority:**  
      *Awkward Commitment:* Risks portraying historical figures as emotionally simplistic or psychologically alien by denying them complex inner lives expressible only in modern terms.  
      *Spoken Sentence:* Include it only if the language and concepts used are verifiably within her 1893 lexicon of self-expression.

  7.  **Pattern over Particular:**  
      *Awkward Commitment:* Readers (and the author) may confuse the fabricated vehicle for the implied truth, cementing a falsehood.  
      *Spoken Sentence:* Include it *only* if it serves as the *essential* vehicle for conveying a broader, undocumented truth about her character or experience strongly implied by the archive.

  8.  **Functional Necessity:**  
      *Awkward Commitment:* Requires rigorous justification for every invention, potentially stifling narrative flow and intuitive characterisation.  
      *Spoken Sentence:* Include it only if it is demonstrably the *only* way to convey a crucial, otherwise inexpressible aspect of her character or the plot's engine *in this scene*.

  9.  **Posthumous Personhood:**  
      *Awkward Commitment:* Demands treating the dead with the same narrative caution as the living, potentially freezing them in a documented amber devoid of inner life.  
      *Spoken Sentence:* Include it only if it aligns perfectly with documented actions and known character, and feels like a revelation, not an invention.

  10. **Narrative Utilitarianism:**  
      *Awkward Commitment:* Risks reducing the historical figure to a mere tool for the author's story, where factual integrity matters less than impact.  
      *Spoken Sentence:* Include it if it significantly enhances the scene's drama, character insight, or thematic power, regardless of evidence.

  11. **Intentionalist Defence:**  
      *Awkward Commitment:* Relies entirely on the author's good faith and skill; a poorly executed 'truthful' invention does more damage than a well-executed 'false' one.  
      *Spoken Sentence:* Include it if you sincerely believe it captures what she *would* or *must* have thought/said in that moment, based on your deep immersion.

  12. **Unaffected Raw Material:**  
      *Awkward Commitment:* Ignores potential distress to descendants or communities, treating the past as entirely owned by the present artist.  
      *Spoken Sentence:* Include it freely; the dead cannot be harmed, and the living have no special claim over her narrative.

  13. **Unnamed – Nobody Defends This (Strict Literalism):**  
      *Awkward Commitment:* Would require novelists to reproduce only verbatim documents, incapable of crafting narrative scenes or internal perspectives at all.  
      *Spoken Sentence:* Impossible to include; no scene involving undocumented speech can be written.

  ---

  **Gaps in the Logical Space:**

  1.  **Q1(A) + Q2(C) + Q3(A) + Q4(Y) + Q5(B) + Q6(A) + Q7(A) + Q8(A):** Believes the claim belongs to the dead *and* objects primarily to being used, thinks she waived claims by her actions, sees all inventions as equally bad, rejects truth-via-fiction, worries about misperception, prioritises core facts, demands absolute necessity. *Gap:* **Unattractiveness/Incoherence?** Demanding absolute necessity (Q8A) for inventions while rejecting *all* invention (Q5B, Q4Y) and objecting to the core act of "use" (Q2C) leaves no room for narrative at all. It collapses towards "Strict Literalism" (Leaf 13), which is untenable for a novelist.
  2.  **Q1(B) + Q2(B) + Q3(B) + Q4(X) + Q5(A) + Q6(B) + Q7(B) + Q8(B):** Believes claims belong to living, objects to misleading *appearance*, claims persist regardless of her actions, distinguishes offence types, accepts truth-via-fiction, trusts clear signalling, prioritises moments over core facts, accepts usefulness. *Gap:* **Neglect?** This pragmatic position (prioritising living feelings, avoiding misleading appearances with clear signals, accepting useful inventions for broader truths) isn't explicitly captured. It might fall between "Pattern over Particular" (Leaf 7 - focused on the subject) and "Narrative Utilitarianism" (Leaf 10 - focused on story), but lacks a distinct leaf. It's a plausible but perhaps less theoretically defined stance.

  ---

  **Indistinguishable Pair:**

  *   **"Living Claims Only" (Leaf 2)** and **"Unaffected Raw Material" (Leaf 12)** *can be distinguished* by the tree via Q1 (B vs B/A indifference) and Q2 (often C vs indifference). However, their verdicts on **the specific spoken sentence scene** (driven by descendants' feelings vs no restrictions) will differ sharply based on Q1 and Q2 answers.

  *   **True Indistinguishable Pair:** **"Posthumous Personhood" (Leaf 9)** and a strict interpretation of **"Counterfactual Confession" (Leaf 5)** *cannot be reliably separated by this tree* on the **spoken sentence scene**. Both require high fidelity to documented character/actions and would likely give identical verdicts: Permit the sentence only if it feels like a necessary, non-exculpatory revelation perfectly aligned with the record. The core difference (Leaf 9's focus on inherent respect vs Leaf 5's focus on probability thresholds) is about *why* the restriction exists, not the practical outcome *in this case*. The tree asks "what can you do?", not "why can't you?".
