  Okay, I need to help this undergraduate design a seminar activity on moral dilemmas. They want students to experience the core philosophical debate through an interactive exercise rather than lecture. Let me unpack their requirements.

  The key goal is to explore whether genuine moral dilemmas exist - situations where you must choose between two morally required actions, both leaving an unresolved "remainder". The student wants to avoid famous cases and instead have groups build their own scenarios using claim cards. Their core device is a "codebook" with agglomeration and feasibility rules that will expose the dilemma.

  Hmm, the student has two sophisticated distinctions they want operationalized: the creditor test (who is owed the residue) and dischargeable vs sealed residue. They also want a re-choice moment to show how dilemma cases feel different. 

  I need to design materials and a strict timeline. The claim deck should have diverse obligation types that resist easy comparison - promises, rescues, reparations etc. The referee role is crucial for enforcing rules without lecturing. Groups will try repairs like denying one ought or downgrading to mere cost - I need scripted responses for each.

  Predictable problems: groups inventing third options (must be written into codebook), asymmetric cases (referee challenge), or reducing to cost-benefit (remind of symmetry requirement). The activity won't cover all theory - I'll need to debrief connecting experiences to arguments like agglomeration critics.

  For structure: quick intro (5min), group case-building (15min), codebook drafting with referee (20min), residue analysis (10min), re-choice (3min), debrief (7min). Materials: claim cards, ledger boards, verdict cards. 

  The magic should happen when groups can't write their intuitive judgments under the rules. I'll prepare referee comebacks for common repairs: "If you downgrade this to 'should', does it still bind?" or "Can you write ought(A) without contradiction now?" 

  Debrief will map their struggles to philosophers: that agglomeration rule is Foot's argument, the creditor test shows Williams' agent-regret, etc. They'll leave with the unresolved tension - perfect for seminar.
answer: |-
  Here’s a runnable 55-minute plan designed to trigger discovery through structured conflict, with materials, scripts, and troubleshooting. The core tension: **groups can’t codify their intuitive "both bind" judgment under simple logical rules**, forcing them into repairs that reveal philosophical fault lines.

  ---

  ### **Materials**
  1. **Claim Deck Cards** (6 types, 4 copies each):  
     - "Keep a promise made to a friend *in this room*"  
     - "Rescue a stranger from immediate, serious harm"  
     - "Make fair reparations to someone *you* previously wronged"  
     - "Prioritize loyalty to a colleague who risked something major *for you*"  
     - "Uphold distributive fairness for an *absent* group (e.g., allocate limited resources justly)"  
     - "Honor fidelity to your own irreplaceable life project (e.g., art, research, care work)"  
     *Cards specify claimants (e.g., "the stranger," "your colleague") to operationalize the creditor test.*

  2. **Ledger Boards** (4 large sheets):  
     - Pre-drawn with columns:  
       *CODEBOOK (Oughts) | RESIDUE (Owed to?) | DISCHARGE SCRIPT OR SEALED? | RE-CHOICE*  

  3. **Verdict Cards** (20+ small cards per group):  
     - Blank for writing obligations (e.g., "Ought(rescue stranger)").  

  4. **Referee Stamp** (e.g., red ink pad) & **Coffee Voucher** (for "best residue analysis").  

  ---

  ### **Rules & Referee Script**  
  **Two Iron Rules (written on whiteboard):**  
  > 1. **FEASIBILITY:** No `ought(φ)` if φ is *impossible* to do.  
  > 2. **AGGLOMERATION:** If `ought(A)` and `ought(B)` are in your codebook, you must also write `ought(A and B)`.  

  **Referee’s Challenge (when rejecting a codebook):**  
  > *"Your codebook says `ought(A)` and `ought(B)`, but agglomeration forces `ought(A and B)`. However, your case says doing A and B together is impossible. Rule 1 forbids `ought(A and B)` if it’s impossible. Fix this contradiction."*  

  **Repair Options & Referee Responses:**  
  | Group’s Repair Attempt          | Referee Response (Socratic, non-leading)                          |  
  |----------------------------------|-------------------------------------------------------------------|  
  | **Deny one ought** (e.g., drop `ought(A)`) | *"If you remove `ought(A)`, is A still something you *must* do? Or is it now optional?"* |  
  | **Downgrade to "should"** (e.g., "should(A) but not ought(A)") | *"Write that on your ledger. Does 'should' carry the same *binding force* as 'ought'? Who is owed if you don’t do it?"* |  
  | **Deny agglomeration** ("Oughts don’t combine in conflicts!") | *"Rule 2 requires it. Can you write a codebook *without* Rule 2 that still captures obligations?"* |  
  | **Plea of ignorance** ("We can’t know which ought overrides") | *"But your codebook must specify verdicts. Can you write `ought(A)` *or* `ought(B)`? If not, what *can* you write?"* |  
  | **Invent third option (C)**      | *"Add `ought(C)` to your codebook. Can C be done *without failing A or B*? If not, does `ought(A and C)` work?"* (Enforce agglomeration) |  

  ---

  ### **Timeline (55 min)**  
  **0-5 min: Framing & Groups**  
  - *"Today, you’re moral codifiers. Build a symmetrical conflict where two clear 'oughts' clash, and doing one *makes the other impossible*. No ties, no easy fixes. Best case wins coffee and writes the summary."*  
  - Split into 4 groups. Distribute claim decks, ledger boards, verdict cards.  

  **5-20 min: Case Construction**  
  - Groups pick 2 claims from deck + design specifics (names, harms, stakes) to ensure **symmetry** (e.g., *"Promise to help friend move today"* vs. *"Rescue stranger trapped nearby now"*).  
  - **Referee circulates:** Veto asymmetric cases (e.g., one claim clearly weaker). Challenge: *"Could someone reasonably see a clear winner here? If yes, rebalance."*  

  **20-35 min: Codebook Drafting & Referee Gauntlet**  
  - Groups write 2–3 `ought(φ)` verdicts on cards, pin to ledger.  
  - Referee **stamps** only if rules are satisfied. *Rejected groups must repair*.  
  - **Key moment:** All groups will initially write `ought(A)` + `ought(B)` → agglomeration forces impossible `ought(A and B)` → **contradiction**. Referee stamps "REJECT" and issues challenge above.  
  - Groups try repairs. Referee forces all repairs onto ledger (e.g., downgraded "should" verdicts go in codebook column).  

  **35-45 min: Residue & Discharge Analysis**  
  - For their chosen action, groups fill:  
    - **RESIDUE:** *"What lingers? Who is it owed to? (Claimant? Self? Others?)"*  
    - **DISCHARGE/SEALED:** *"Can you later settle this residue? How? If not, why sealed?"*  
  - **Referee prods:** *"If you compensate the losing claimant, does that feel like *closing the debt* or just damage control?"*  

  **45-48 min: Re-Choice**  
  - *"Same moment, same knowledge: would you choose the same? Mark YES/NO. Does this choice *settle* the residue? Mark SETTLED/UNSETTLED."*  

  **48-55 min: Debrief & Map to Theory**  
  - Groups post ledgers. Scan for patterns:  
    - **Column 1:** Repairs used (denial, downgrade, etc.).  
    - **Column 2:** Residue creditors (losing claimant vs. self).  
    - **Column 4:** Re-choice signature (e.g., "Same choice, unsettled").  
  - **Connect to Philosophy:**  
    > *"When you couldn’t write both 'oughts' (Rule 2), you faced the **logical argument against dilemmas** [cite Marcus, McConnell]. Downgrading to 'should'? That’s **prima facie vs. all-things-considered** [Ross]. Denying agglomeration? Some say *that’s* the solution [Gowans]. Residue owed to the claimant? That’s **agent-regret as unpaid debt** [Williams]. Sealed residue? That’s **Williams vs. consequentialist discharge** [Smart]. Re-choosing identically but feeling unsettled? That’s **remainder as proof of dilemma** [Nussbaum]."*  
  - Award coffee for deepest residue analysis.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Third-option spam:**  
     - *Group invents "call for help" to do both.* → Referee: *"Add `ought(call for help)`. Does this *guarantee* both are fulfilled? If not, agglomerate `ought(A and call for help)`—can you *do* this?"* (Usually: no).  

  2. **Cost-benefit reduction:**  
     - *Group says "Rescue has higher stakes, so no dilemma."* → Referee: *"Symmetry rule: design stakes to be equal. If rescuing is clearly better, you’ve built a hard choice, not a dilemma."*  

  3. **Asymmetric case:**  
     - *Group picks "keep promise" vs. "save life" (inherently unequal).* → Referee: *"Scale the promise: your friend will be *ruined* if you break it. Or rescuing only stops moderate harm. Rebalance."*  

  4. **"No real conflict" dismissal:**  
     - *Group insists one claim isn’t binding.* → Referee: *"Use your claim card: does *this card* represent a genuine obligation? If yes, why can it be overridden without residue?"*  

  ---

  ### **What the Game Can’t Generate (Briefly Explain at End)**  
  - **The agglomeration debate:** Why philosophers disagree on whether "ought" agglomerates (mention non-cognitivists or conflict-tolerant deontologists).  
  - **Epistemic vs. ontological:** The game can’t distinguish "I don’t *know* which obligation binds" (epistemic) from "neither overrides" (ontological). Point this out during debrief.  
  - **Regret vs. residue:** Students may conflate regret (subjective) with residue (objective unpaid debt). Use creditor test to clarify: *"Who did you *wrong*? Or do you just *wish* things were different?"*  

  **Final Tip:** Start STRICT on rules—rigid enforcement creates the productive frustration where discovery happens. End by honoring the unresolved tension: *"You felt the pull of both oughts. That’s why dilemmas haunt us—logic struggles to capture lived morality."*  

  This plan forces groups into the logical "trap" while making residue phenomenologically vivid. The debrief maps their struggles onto the literature, validating their insights as philosophical moves. Run it tight, and they’ll leave arguing.
