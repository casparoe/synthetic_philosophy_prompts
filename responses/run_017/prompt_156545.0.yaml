prompt: |-
  A friend and I argued until well past midnight about whether there is any fact of the matter about what exists in a domain when the evidence that would settle the question is, in one way or another, beyond reach, and we kept talking past each other because neither of us ever said what a good answer to that question would have to accomplish. So before we resume, I want the specification written down rather than the verdict.

  The area is this. An agent is embedded inside some domain and has to adopt one of several candidate inventories of what there is, in order to plan, predict, and talk to other agents about it. Some of the differences between candidate inventories are invisible from where the agent sits. I want to distinguish three grades of invisibility, and I would like you to keep them separate throughout. Call a gap penumbral if some finite extension of the agent's access would close it, asymptotic if no finite extension closes it but an unending sequence of probes would converge on an answer in the limit, and absolute if no extension of access of any kind closes it. Call a gap reflexive if whether it closes depends on which inventory the agent adopts, because one candidate says the probe that would discriminate is constructible while the other says it is not. I care about the reflexive ones most, since that is roughly where our argument stalled.

  Write me the desiderata: what any adequate account of ontology identification under inaccessible information must deliver. Give me the cases it has to get right, including at least the reflexive case above, the case of two agents with disjoint but individually penumbral access who disagree with each other, and the case of candidates that agree on every probe anyone can actually run but disagree about what would happen under a probe only one of them permits. Give me the distinctions it must not collapse: invisible versus merely unobserved, gaps that are the agent's fault versus gaps in the world, identification for one agent versus identification for a community that pools its access, and settling a question versus merely deciding how to act while it is open. Give me the results it must not contradict, in particular that permanent underdetermination can happen and that a verdict reached only in the limit is not a verdict an agent ever has on hand. Behind each requirement, say why it is a requirement and whether you think it is non-negotiable or a prejudice of one camp. Fix the purpose as follows: the account is supposed to be usable from inside the domain, by a bounded agent acting in finite time, and it is supposed to tell two disagreeing agents whether their disagreement is substantive or merely verbal.

  Then flag any pair of desiderata you suspect cannot be jointly satisfied, and say which single requirement does the most work in ruling out candidates. I have in mind the realist who lets identification outrun evidence, the verificationist who ties ontology to accessible difference, the pragmatist who weighs the costs of getting it wrong, the structuralist who identifies only up to structure, and the learning-theoretic picture that settles for identification in the limit; a sentence or two on how each fares against the list is enough, since the list is what I am after. I do not need names of authors, papers, or further reading. Please write it as continuous prose, no headings, bullet points, bold text, or tables, in the manner of a careful email.
reasoning: |-
  We are to provide desiderata for an account of ontology identification under inaccessible information. The purpose is to aid an agent (or agents) embedded in a domain to adopt an inventory of what exists, for purposes of planning, prediction, and communication, when some differences between candidate ontologies are invisible from the agent's current position. We must consider three grades of invisibility: penumbral (finite extension closes), asymptotic (infinite sequence converges to answer), and absolute (no extension closes). We are especially concerned with reflexive gaps, where the closability of the gap depends on which ontology is adopted.

  The account must be usable from inside the domain by a bounded agent in finite time and must help determine if a disagreement between agents is substantive or merely verbal.

  Desiderata:

  1. **Distinguish between the unobserved and the inaccessible**: The account must not treat what is merely unobserved (but observable with better access) as on par with what is truly inaccessible (asymptotic or absolute). This is non-negotiable because an agent must be able to plan for future observations and not conflate temporary ignorance with permanent inaccessibility.

  2. **Handle reflexive gaps**: The account must provide a way to handle cases where the very possibility of closing the gap depends on which inventory is adopted. For instance, if one ontology says a certain probe is constructible and the other says it is not, then the gap is reflexive. This is central to the stalled argument and non-negotiable.

  3. **Respect the difference between settling a question and deciding how to act**: The account must not collapse the question of what exists (the ontological fact) with the practical question of how to act given uncertainty. This is non-negotiable because the purpose includes both truth-seeking and practical action, and they may require different approaches.

  4. **Account for multiple agents with disjoint access**: The account must handle the case of two agents with disjoint but individually penumbral access who disagree. It must explain whether their disagreement is substantive (i.e., one is right and the other wrong) or merely verbal (due to different perspectives). This is non-negotiable because communication and coordination among agents are key.

  5. **Resolve cases of agreement on actual probes but disagreement on counterfactual ones**: The account must address candidates that agree on every probe anyone can actually run but disagree on what would happen under a probe that only one candidate permits. This is non-negotiable because it tests the account's ability to handle what is beyond current evidence.

  6. **Acknowledge that permanent underdetermination is possible**: The account must not rule out the possibility that some ontological questions are permanently underdetermined by all possible evidence. This is non-negotiable because it is a live option in many domains (e.g., certain interpretations of quantum mechanics).

  7. **Reject identification in the limit as insufficient for a bounded agent**: The account must not accept convergence in the limit as a satisfactory resolution for an agent acting in finite time. This is non-negotiable because an agent must make decisions now, not in the limit.

  8. **Distinguish gaps due to the agent from gaps in the world**: The account must differentiate between limitations of the agent (e.g., lack of resources) and inherent features of the domain that make a gap unclosable. This is non-negotiable because it affects how an agent should allocate resources for investigation.

  9. **Be applicable by a bounded agent in finite time**: The account must not require infinite computational resources or time. This is non-negotiable by the problem setup.

  10. **Determine if disagreement is substantive or verbal**: The account must help two disagreeing agents decide whether their disagreement is about the world or about the meaning of words. This is non-negotiable because it is explicitly required.

  Now, we flag potential conflicts:

  - **Conflict between 6 and 10**: If permanent underdetermination is possible (6) and we require that the account must determine if disagreement is substantive or verbal (10), then in cases of permanent underdetermination, how can the account determine the nature of the disagreement? It might be that the disagreement is substantive but we cannot know. However, the account might still be able to say that the question is underdetermined and thus the disagreement is substantive but undecidable. But note: if the disagreement is about the meaning of words (verbal) then it might be resolvable by clarification. So the account must be able to distinguish underdetermination of a substantive issue from a verbal disagreement. This is tricky.

  - **Conflict between 7 and the need for resolution**: We reject the limit (7) but require the account to be usable in finite time (9). However, if we have an asymptotic gap, then we cannot get a definitive answer in finite time. This might force the account to leave such gaps open, which conflicts with the requirement to help agents decide on an inventory for practical purposes (3). Thus, the account must provide a way to act without having settled the ontological question.

  Now, we consider which requirement does the most work in ruling out candidates:

  The requirement that the account must be usable by a bounded agent in finite time (9) and that it must reject identification in the limit (7) does the most work. It rules out the learning-theoretic approach that settles for identification in the limit because that does not help a finite agent. It also rules out the realist who lets identification outrun evidence if that realism requires inaccessible facts (because then it violates the requirement that the account must work from inside the domain without access to such facts). However, note that realism might still be compatible if it can be operationalized without requiring the agent to know the inaccessible.

  We briefly consider how different approaches fare:

  - **Realist**: May satisfy 6 (allowing permanent underdetermination) but might violate 9 and 7 if it requires knowing what is beyond evidence. Also, might not help with reflexive gaps (2) if the agent cannot know which inventory is true.

  - **Verificationist**: Ties ontology to accessible differences. This might handle 2, 4, 5, and 10 by reducing ontological questions to verifiable ones. But it might violate 6 (by ruling out permanent underdetermination) and 3 (by collapsing ontology into what is verified).

  - **Pragmatist**: Weighs costs of getting it wrong. This might satisfy 3, 9, and 7 (by focusing on action) but might collapse the distinction between what exists and what is useful to believe (violating 3) and might not handle reflexive gaps (2) because the practical cost might not be clear.

  - **Structuralist**: Identifies only up to structure. This might handle 5 and 6 by abstracting away from non-structural differences, but might violate the need for a specific inventory (because it only gives structure) and might not help with reflexive gaps (2) if the structure is not accessible.

  - **Learning-theoretic**: Settles for identification in the limit. This satisfies 6 and 8 but violates 7 and 9, so it is ruled out by the requirement for finite agents.

  The requirement of handling reflexive gaps (2) and the requirement to be usable in finite time (9) are particularly demanding and rule out many approaches.

  In conclusion, the desiderata are stringent and may not be jointly satisfiable in full. The most critical requirement is that the account must work for a bounded agent in finite time, which forces a focus on practical decision-making without always settling the ontological question. This might lead to an account that distinguishes between ontological commitments (for practical purposes) and ontological truths (which may be inaccessible). But then we must be careful not to collapse the two (as per 3). The account must also provide a way to diagnose verbal disagreements even when substantive ones are underdetermined.
answer: |-
  In crafting desiderata for an account of ontology identification under inaccessible information, the goal is to equip an embedded agent—or a community of agents—with a framework for selecting an inventory of what exists, even when crucial differences between candidates evade detection due to gaps in access. This framework must serve practical ends: planning, prediction, and communication. Crucially, it must operate from within the domain, using finite resources and time, and adjudicate whether disagreements are substantive (about the world) or verbal (about language or perspective). Below, I outline the requirements, grounded in your cases and distinctions, noting where tensions arise.

  First, the account must distinguish unobserved from inaccessible phenomena. An unobserved gap—like a hidden object in the next room—could be resolved with finite effort (penumbral), whereas inaccessible gaps resist closure: asymptotic gaps (e.g., confirming a limit through infinite approximation) or absolute gaps (e.g., properties forever outside light cones). Collapsing these risks misallocating resources; the agent must know when further probing is futile versus merely deferred. This is non-negotiable, as it reflects a basic constraint of embedded agency.

  Second, reflexive gaps demand special treatment. Here, an ontology's adoption determines whether a discriminatory probe is possible—e.g., one inventory permits constructing a measuring device that the other declares incoherent. The account must resolve such cases without presupposing a "correct" inventory, as the choice itself enables or disables verification. Since this stalled your argument, it is central and non-negotiable: ignoring reflexivity conflates metaphysical commitment with empirical accessibility.

  Third, the account must handle multi-agent scenarios. When two agents with disjoint penumbral access disagree (e.g., one sees only east, the other only west, and both inventories explain their respective data), the framework must judge whether their dispute is substantive or verbal. It cannot default to relativism; differing access might reveal complementary facets of reality or expose terminological mismatches. This is non-negotiable for enabling cooperative dialogue.

  Fourth, it must address candidates that agree on all actual probes but diverge on counterfactuals involving probes only one allows. For instance, if inventory A permits a "cosmic census" device that B deems impossible, and A predicts this device would report unicorns while B says it would malfunction, the account must evaluate such differences without assuming the device exists. Ignoring this inflates ontology with empirically inert possibilities, violating the embedded purpose.

  Fifth, the distinction between gaps caused by the agent (e.g., computational limits) versus the world (e.g., fundamental laws) must be preserved. Blurring these obscures responsibility: an agent may improve tools to close a penumbral gap but not an absolute one. This is non-negotiable for efficient action.

  Sixth, settling ontological questions must not be reduced to deciding how to act. An agent might pragmatically adopt an inventory for prediction while acknowledging the question remains open—e.g., acting "as if" particles exist while accepting that a rival field-theoretic ontology could be true. Collapsing this distinction conflates truth with utility, hindering truth-directed inquiry.

  Seventh, permanent underdetermination must be possible. Some gaps might never close, even asymptotically (e.g., multiple topologies fitting all data in cosmology). Denying this risks overcommitting to metaphysics unsupported by evidence. This is non-negotiable, as it honors the limits of inquiry.

  Eighth, identification in the limit—where an infinite sequence of probes converges to an answer—is inadequate for a bounded agent. No finite agent ever "has" the limit verdict; it cannot guide real-time decisions. Rejecting this as sufficient is non-negotiable, as it respects finitude.

  Ninth, the account must be implementable in finite time by resource-constrained agents. Proposals requiring infinitary reasoning or unattainable evidence are disqualified. This anchors the framework in practicality.

  Tenth, it must clarify whether disagreements are substantive or verbal. Two agents disputing "what exists" might miscommunicate meanings (e.g., one's "virtual particle" is another's "field excitation") rather than the world's structure. The account must diagnose this, as verbal disputes waste effort on illusory problems.

  Suspected conflicts arise between desiderata. Most acutely, the demand for finite-time implementation (ninth) clashes with the possibility of permanent underdetermination (seventh) and the rejection of limit-based identification (eighth). If a gap is asymptotic or reflexive, an agent might never resolve it, yet must still choose an inventory for practical purposes. This forces a compromise: the account cannot always "settle" ontology while requiring agents to act. Similarly, adjudicating disagreements (tenth) becomes thorny under underdetermination—agents may never know if their dispute is substantive, though the framework must still distinguish verbal from potentially substantive cases.

  The requirement doing the most work in ruling out candidates is the finite-time constraint (ninth). It immediately dismisses the learning-theoretic approach, which relies on limit-convergence but offers nothing to a real-time agent. Realism—positing evidence-transcendent facts—struggles with reflexivity and finite access; if an inventory asserts the existence of indiscernible entities, it may violate the demand to resolve verbal disputes or distinguish accessible from inaccessible. Verificationism, tying ontology to detectable differences, handles penumbral cases well but falters with asymptotic and absolute gaps, risking the conflation of existence with access and denying permanent underdetermination. Pragmatism, prioritizing action over truth, navigates finite decisions adeptly but blurs the distinction between settling questions and acting, potentially collapsing ontology into utility. Structuralism, identifying only up to isomorphic equivalence, handles cases where candidates agree on structure but disagrees on underlying entities (e.g., your counterfactual probe case), yet it may trivialize reflexivity by dismissing non-structural differences as verbal—a move that might not satisfy agents seeking to know what fundamentally exists.

  In sum, the desiderata form a tight web, with finite embeddedness and reflexivity as key stressors. Any adequate account must thread these while leaving room for ignorance, disagreement, and the unattainable.
