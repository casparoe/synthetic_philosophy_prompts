prompt: |-
  My friend has really firm opinions about this kind of thing — she's not a philosopher, she's just like this — and over the years I've collected her verdicts on a bunch of cases. I want to know if her view actually hangs together, and I've got a new case I think might break it. Her verdicts so far:

  - Restaurant in a city where the waiters pay basically assumes tips: not leaving one is wrong, not just rude. Her words were that you took the service, you dont get to stick someone else with the bill.
  - Cafe in a city where service is included and locals leave nothing, or maybe round up the coins: not tipping is completely fine, tipping is fine too, nobody is owed anything.
  - Bus stop where there's an actual orderly line: pushing in is genuinely wrong.
  - Bus stop in a city where there is no line at all and everyone just crowds the door: you don't have to stand there meekly and miss the bus, joining the scrum is fine. (She did add "don't shove an old lady," but that's about shoving, not about the line.)
  - Crossing mid-block at 3am on an empty residential street, where everyone local does it: totally fine, nobody cares.
  - Crossing mid-block on a busy road right outside a primary school at pickup time: not ok, and she said its not really about the fine.
  - Town where it's completely normal for visitors to pay the guide half of what was agreed at the end, everyone does it, the guides expect it: no. You pay what was agreed; local custom doesn't make it fine.
  - Country where everyone brings a small gift to a dinner party and you didn't know: say sorry, bring one next time, but it's small stuff, not a moral failing.
  - Market where haggling is just how buying works and the stallholders are a bit insulted if you simply pay the asking price: you should haggle, it's part of how the thing works.

  The case I actually want: I'm in a city for one last day, I fly out tomorrow and I'm never coming back, and near the hotel there's an unattended coffee cart — thermos, a jar and a QR code, laminated sign saying coffee 2, pay here, no one's watching :-). Everyone local pays. A couple of people told me the jar sometimes comes up short, but the guy who runs it is a retired teacher who does it for something to do and has said he'd keep turning up even if it never quite covered its costs. Apparently people sometimes pay a bit less when the coffee's been sitting a while. Nobody will see whether I pay, and there's no way anyone finds out afterwards.

  So: would she say I owe the 2 — that not paying is actually wrong and not just a bit off — or would she say it's optional, nice but not required, like the coins in the cafe?

  More useful to me than the yes/no: what are the two or three rules that fit all nine verdicts, and what does each one predict here? I can sort of see a "don't take the benefit and skip the cost" rule and a "don't make people worse off or frustrate what they can reasonably expect" rule, but they seem to come apart on this one, and I can't tell which is really driving her. Also: which earlier verdict is the closest analog — I keep going back and forth between the restaurant and the European cafe — and which of her verdicts does each rule struggle to explain? I think the haggling one is hard for the benefit rule but I'm not sure. Give me your best guess with reasons, say which extra case I should ask her about next to actually tell the rules apart, and tell me what would change your mind: which bit of the argument or which detail of the case would flip your prediction, and where you think your reasoning is most likely to be wrong. I'm not after book titles or philosopher names, just the reasoning.
reasoning: |-
  Hmm, the user presents an interesting ethical puzzle involving their friend's consistent verdicts across various social scenarios. They've collected nine specific judgments from their friend and now want to predict how she'd rule on a tenth case - the unattended coffee cart situation. The core challenge is reverse-engineering the underlying ethical principles that unify all these judgments.

  Looking at the nine existing verdicts, I notice several patterns emerging: 

  First, there's a strong emphasis on not taking benefits without bearing costs (as seen in the restaurant tipping case). Second, there's respect for functional local customs (like the cafe with included service or bus stop crowding). Third, there's consideration for reasonable expectations (the guide payment case shows customs have limits). Fourth, harm prevention matters (the school crossing example). Fifth, participation in cooperative systems is valued (the haggling case).

  For the coffee cart dilemma, I see competing principles at play. On one hand, the "don't take without paying" principle from the restaurant case suggests paying is obligatory. On the other hand, the local context shows tolerance for occasional underpayment, making it resemble the European cafe scenario. The key differentiators seem to be: 1) The coffee cart operates on an honor system with known leakage, 2) The owner's stated indifference to profitability, 3) The complete lack of accountability.

  My prediction leans toward the friend saying payment isn't strictly obligatory here. The honor system's inherent looseness and the owner's attitude make this more like rounding coins at a cafe than skipping a restaurant tip. The closest analog is actually the dinner party gift - a minor norm where breach only requires apology if discovered.

  To test this, I'd suggest asking the friend about a modified coffee cart scenario where the owner relies on the income. That would clarify whether perceived dependence triggers the "don't skip costs" principle. I'm least confident about how much weight to give the owner's stated indifference - if that detail changed, my prediction might flip.

  The trickiest existing case for my framework is the guide payment scenario. Why is breaching that custom wrong while under-tipping at the coffee cart might be acceptable? The distinction appears to be that the guide scenario involves direct deception and exploitation of trust, whereas the coffee cart's honor system already accounts for some leakage.
answer: |-
  Based on your friend's verdicts, I see **three core principles** driving her judgments, with the coffee cart case creating tension between them. Here's the breakdown, the prediction, the closest analog, the weaknesses, and how to test it:

  ### The Three Rules
  1.  **The Cooperative Expectation Rule:** It's wrong to bypass your part in a *mutually understood cooperative system* where benefits are exchanged for costs, especially if your action directly frustrates the reasonable reliance/expectation of a specific person providing you a service. (Strongest in: Restaurant tip, Bus line, Guide payment).
  2.  **The Harm & Reasonable Custom Rule:** Actions are wrong if they cause *foreseeable harm* (physical, financial, significant inconvenience) OR if they *violate deeply ingrained local customs* that reasonably structure interactions and manage expectations *without exploitation*. (Strongest in: School crossing, Bus scrum, Cafe tipping, Dinner gift, Haggling).
  3.  **The "No Free Lunch" Principle:** You shouldn't deliberately take a clear benefit (a service, good, or position) while knowingly avoiding the attached, expected cost if doing so leaves the provider worse off *specifically because of your action*. (Strongest in: Restaurant tip, Guide payment). *This seems like a specific application/subset of Rule 1, but highlights the cost/benefit imbalance.*

  ### Applying the Rules to the Coffee Cart
  *   **Rule 1 (Cooperative Expectation):** Predicts **Owe $2**.
      *   *Why:* There's a clear, simple system: Take coffee -> Pay $2. The sign states the expectation. While the *system* has known leakage, *your specific action* of taking coffee without paying directly violates the explicit agreement presented to *you* as the user. It's functionally similar to the restaurant: you take the service (coffee), you shouldn't stick the provider with the cost. The honor system relies on individual compliance; your breach directly undermines it, even if others do too. The guide payment case shows local custom *doesn't* override a specific agreement.
  *   **Rule 2 (Harm & Custom):** Predicts **Not Obligatory (like cafe coins)**.
      *   *Why:* The local custom *explicitly includes* occasional underpayment ("jar comes up short", "people pay less when coffee sits"). The owner *knows and accepts* this risk ("said he'd keep turning up even if..."). Your action causes no *foreseeable harm* given his stated attitude – he won't be financially hurt *by your single non-payment* and isn't relying on the income. It's an unattended, low-stakes honor system with built-in community tolerance for imperfection, much like rounding coins at the cafe where service is included. No specific person is relying on *your* $2 at that moment.
  *   **Rule 3 (No Free Lunch):** Leans **Owe $2**, but weakened.
      *   *Why:* You took the coffee (benefit), the expected cost is $2, you skipped it. However, the "leaves provider worse off *specifically because of your action*" is highly dubious here. His costs are covered on aggregate over time *despite* leakage; your $2 likely doesn't move the needle, especially given his attitude. It feels different from skipping a restaurant tip where that tip *is* the waiter's expected wage.

  **Prediction:** She would say **you owe the $2. Not paying is wrong, not just rude or optional.**

  **Reasoning:** Rule 1 (Cooperative Expectation) is the strongest driver in her judgments, especially when there's a clear, direct exchange of service for payment with a specific expectation set (Restaurant, Guide). Rule 2 (Harm/Custom) is powerful, but the coffee cart's sign creates a *specific, individual agreement* ("coffee $2, pay here") that overrides the general permissive custom of occasional leakage, similar to how the specific agreement overrode the "local custom" of underpaying the guide. Rule 3 is less decisive here due to the lack of demonstrable harm from *your single action*.

  **Closest Analog:** The **Restaurant Tip** is the strongest analog, not the European Cafe.
  *   *Why:* Both involve taking a specific service (meal/coffee) where payment (tip/$2) is the clearly expected cost for that specific transaction within a system. The cafe tipping lacked that specific expectation ("service included").
  *   *Distinguishing the Guide Payment:* The guide case is also very close (specific agreement overrides custom), but the coffee cart feels less severe because it's unattended, lower stakes, and the owner accepts leakage. However, her reasoning in the guide case ("you pay what was agreed") applies directly here ("coffee $2").

  ### Where the Rules Struggle & Which is Weakest
  *   **Rule 1 (Cooperative Expectation) struggles with Haggling:** Why is *not* haggling (paying asking price) potentially rude/insulting when it seems like bypassing the expected cooperative system? Rule 1 might see paying asking price as failing to participate, but her verdict implies participation *requires* haggling. Rule 2 (Custom) explains this perfectly: haggling *is* the deeply ingrained local custom structuring the interaction reasonably.
  *   **Rule 2 (Harm & Custom) struggles with the Guide Payment:** Why isn't the "local custom" of paying half acceptable? Rule 2 alone might suggest it's fine. Rule 1 provides the answer: the *specific agreement* ("agreed" price) creates a stronger, individual obligation that overrides the general custom of underpayment. This shows Rule 1 often trumps Rule 2 when a specific agreement exists.
  *   **Rule 3 (No Free Lunch) is the weakest overall:** It struggles to explain the **Bus Scrum**. Taking the benefit (getting on the bus) doesn't clearly have an attached cost you're skipping by joining the scrum – the "cost" is participating in the chaos, which you are doing. Rule 2 (Custom) explains it easily: the local custom *is* the scrum, so joining it is fine. Rule 3 also struggles with the **Dinner Gift** – taking the benefit (dinner) has no clear *cost* you skip by forgetting the gift; it's a social custom violation, not a skipped payment. Rules 1 & 2 handle it better.

  ### What Case to Ask Next to Tell Them Apart
  Ask her about: **"A library with an 'honor system' used book sale - shelves of books, a box, sign says '$5 per book, please pay here'. The librarian knows some books go missing or people underpay sometimes, but says 'It's mostly honest, and the funds just go to buying more used books anyway. We don't chase people.' You find a book you really want, worth far more than $5. No one is around. Do you owe the $5?"**

  *   **Why this tests the tension:**
      *   Clear expectation/specific agreement (Rule 1: Owe $5).
      *   Known leakage & lack of enforcement/harm to a specific person relying (Rule 2: Not obligatory, like coffee cart leakage/cafe).
      *   Clear benefit (book) vs. cost ($5) - but harm is indirect (Rule 3: Leans owe, but weak).
  *   **What her answer tells you:**
      *   **Owe $5:** Reinforces Rule 1 (Cooperative Expectation) as primary. The specific agreement matters most.
      *   **Not Obligatory:** Reinforces Rule 2 (Harm & Custom) as primary, especially if she emphasizes the accepted leakage/lack of reliance/harm.
      *   **Owe $5 *because* the book is valuable:** Suggests Rule 3 (No Free Lunch) has more weight than I gave it, or blends with Rule 1.

  ### What Would Change My Mind & Where I'm Least Confident
  1.  **Change My Mind (Flip to "Not Obligatory"):**
      *   If you emphasized that locals **explicitly say "Nobody *owes* the $2, it's just nice to pay if you can"** (like the cafe). This strengthens Rule 2's "local custom" aspect massively.
      *   If the owner's statement was **"Honestly, I don't even count the jar anymore, it's just coffee for whoever wants it"** – making the payment truly optional/donation-based, destroying the specific expectation (Rule 1).
  2.  **Where I'm Least Confident:** The **strength of the owner's acceptance of leakage**. Rule 1 says the sign sets the expectation, regardless of leakage. But if the leakage is *so* culturally normalized and the owner *so* indifferent that the sign feels more like a suggestion than a firm agreement (like coins in the cafe *after* service is included), then Rule 2 wins. My prediction leans Rule 1 because the sign is clear and direct, unlike the cafe where the "service included" sign fundamentally changed the expectation *before* tipping. Her guide verdict makes me think she prioritizes the specific agreement ("agreed", "pay here" sign) over background leakage.

  **In short:** Your friend prioritizes keeping your end of a clear, specific agreement (Rule 1), even in low-stakes honor systems with leakage. Local custom matters (Rule 2), but *not* when it directly contradicts a specific obligation you entered by taking a benefit. The coffee cart sign creates that specific obligation, making skipping payment wrong. The restaurant tip is the best analog. Ask about the library book sale to see how robust Rule 1 really is against leakage and lack of enforcement.
