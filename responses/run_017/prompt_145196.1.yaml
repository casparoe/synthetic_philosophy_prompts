prompt: |-
  hey — I'm a staff engineer at a mid-size company, no philosophy background at all. I got into this through a Hacker News thread about big rewrites were someone cited Lakatos, and now I'm stuck with the job of fixing how we make platform decisions.

  Every quarter there's an architecture review where my team has to decide, for each of our long-running internal systems, whether to keep funding it, freeze it, or kill it and migrate off. Right now it's vibes, sunk cost, and whoever argues hardest in the room.

  The bit of Lakatos I've absorbed (hard core, protective belt, positive vs negative heuristic, progressive vs degenerating problem shifts, and the thing where a patch that only mops up an anomaly you already had counts as degeneration instead of progress) feels like it maps onto this almost too well. But I only have the blog-post version, and I can't turn it into something four senior engineers will sit still for in a 90 minute meeting. They'll walk out if I say heuristic.

  So: give me a decision procedure we can actually run in that meeting. Ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands off to a human because the question is really about values not facts. It has to be usable by people who've never heard of Lakatos — say the concepts in engineer words, but don't water out the distinctions that are doing the actual work, and tell me which ones you dropped and why.

  Hard cases I specifically need it to handle:

  One, our protective belt is mostly config flags, compat shims and feature gates, so there's no such thing as a crucial experiment and our metrics are noisy (weekly A/B tests, effects in the 2-3% range, plus a north-star metric that drifts on its own for reasons nobody understands). How do we tell an honest belt adjustment from an immunizing stratagem under those conditions?

  Two, I want a pre-registration rule: a predicted win only counts as a novel fact if somebody wrote the prediction down before the data landed, otherwise it's accommodation after the fact. Tell me who has to write it down and where, because I'm fairly sure this becomes a rubber stamp if I let the team that owns the system self-certify.

  Three, sometimes the thing we're protecting isn't a technical claim at all, it's a business or compatibility commitment — like we must stay wire-compatible with the on-prem install base forever. That's protected by fiat, so nothing can ever falsify it. Does that need a fourth verdict besides keep / freeze / kill, and if so what is it and who signs off?

  Four, I keep reading that for Lakatos there's no instant rationality, that you can't fairly judge a programme at a single moment and degeneration only shows up in hindsight. If that's right, bake a time window into the procedure: how many quarters of degeneration before we pull the plug, and is there a case were the right answer is to keep funding something that's currently degenerating?

  Then run it on three of our actual situations: a nine-year-old Python 2 search monolith with about forty compat flags that recently predicted a latency win on a new index format and then hit it; an eighteen-month-old ML feature platform that ships constantly and whose team can always explain last quarter's improvements but never called them in advance; and our billing service, which has to reproduce invoices byte-for-byte from 2016 onward and will have to until the law changes. At least one of these should produce an answer I don't like — say so when it does.

  Finish by being straight about what the procedure can't do and where it'll misfire on us.

  Two formatting things: lead with the bottom line in your first sentence — the procedure in a nutshell plus the call on all three systems — and only then give the reasoning, no preamble and no restating my question. And please don't give me citations, links or a reading list; I'm not going to read the books, and I need this to stand on its own for people who definitely won't.
reasoning: |-
  We are going to design a decision procedure called "System Health Assessment Protocol" (SHAP) that uses Lakatos-inspired concepts but translates them into engineering terms. The goal is to assess whether a system is healthy (keep), declining (freeze for maintenance only), or ready for decommissioning (kill/migrate off). We'll handle the hard cases with specific rules.

  **Bottom Line First:**
  The SHAP procedure outputs: keep the Python 2 monolith (with a warning), freeze the ML feature platform, and keep the billing service (with a note on the immovable constraint). The procedure uses four ordered questions, requires pre-registered predictions for novel wins, handles business constraints as non-falsifiable but trackable, and uses a 4-quarter window to assess degeneration.

  ---

  **System Health Assessment Protocol (SHAP) - The Procedure**

  Run this for each system every quarter. Timebox: 15-20 minutes per system in a 90-minute meeting for 4-5 systems.

  **Question 1: Core Function and Non-Negotiables (5 minutes max)**
     - *In engineer words:* "What is the one job this system must do, and what are the unbreakable rules? (e.g., 'Must reproduce invoices byte-for-byte from 2016')"
     - *Sufficient answer:* A clear, written statement from the system's documentation (or created on the spot and recorded). If none exists, the team must write it now.
     - *Stop if:* The team cannot state the core function or non-negotiables. Verdict: **Freeze** until clarified (because without this, we can't measure progress).
     - *Values handoff:* If the non-negotiables are business commitments (e.g., wire compatibility forever), note them as "protected by fiat" and move to Question 2. These cannot be falsified but must be tracked.

  **Question 2: Track Record of Improvements (5 minutes max)**
     - *In engineer words:* "In the last 4 quarters, did the system deliver documented, predicted wins? Or did it only fix things it broke or meet pre-set targets without forecasting new gains?"
     - *Key terms:* 
       - **Predicted win:** A measurable improvement (e.g., "reduce latency by 10%") that was written down (with numbers and a timeframe) *before* the work started.
       - **Novel fact:** A win that wasn't just mopping up a known issue (e.g., a new index format that speeds up queries in a way we didn't expect to work).
       - **Accommodation:** Fixing a bug, hitting a target that was set to avoid regression, or explaining a loss after the fact.
     - *Rules:*
       - Pre-registration: Predictions must be in the team's quarterly plan (or a public RFC) *before* the quarter starts. The **platform governance committee** (not the team) certifies this by reviewing quarter-start documents.
       - Metrics: Wins must be measured with agreed-upon metrics (even if noisy). If the north-star drifts, use a counterfactual (e.g., A/B test against old version).
     - *Sufficient answer:* List of 1-3 major changes per quarter with links to pre-registered predictions and post-hoc results. Use a simple table:
          | Quarter | Change | Predicted? (Y/N) | Win? (Y/N) | Novel? (Y/N) |
     - *Scoring:*
       - **Progressive:** 3+ wins in 4 quarters, with at least 2 being novel (predicted and new).
       - **Stable:** 1-2 wins, but mostly accommodations (predicted but not novel, or fixes).
       - **Degenerating:** 0 wins, or wins that are all accommodations (e.g., only fixing bugs, no new gains).
     - *Stop if:* Degenerating for 2+ quarters. Verdict: **Freeze** (if 2 quarters) or **Kill** (if 3-4 quarters). If stable, move to Question 3.

  **Question 3: Anomalies and Immunization (3 minutes max)**
     - *In engineer words:* "When the system broke or underperformed, did the team adjust without hiding the problem? Or did they add flags/shims that made it harder to see the core issues?"
     - *Key terms:*
       - **Honest adjustment:** A fix that reduces complexity, removes flags, or improves observability (e.g., replacing a shim with a direct call).
       - **Immunizing stratagem:** Adding a flag, shim, or special case that papers over the issue without simplifying the system (e.g., a new config toggle that's on by default but can be turned off if it breaks).
     - *Sufficient answer:* Examples of the last 2-3 major fixes. The team must explain why the fix wasn't a workaround.
     - *Stop if:* The last 2 fixes were immunizing stratagems. Verdict: **Freeze** (to force refactoring) and re-assess next quarter. Otherwise, move to Question 4.

  **Question 4: Future Trajectory (2 minutes max)**
     - *In engineer words:* "Can the team name one big, measurable improvement they'll deliver next quarter? And is it something we couldn't do before?"
     - *Sufficient answer:* A pre-registered prediction for next quarter (written in the plan for the upcoming quarter). It must be novel (not just maintaining service).
     - *Stop if:* The team cannot name a novel prediction. Verdict: **Freeze** (if the system is otherwise healthy) or **Kill** (if already degenerating). If they have one, Verdict: **Keep**.

  **Hard Cases Addressed:**
  1. **Noisy metrics/No crucial experiments:** We use quarterly pre-registered predictions and require wins to be relative to a baseline (e.g., A/B tests). If the win is within noise (e.g., 2-3%), it doesn't count unless it's consistent over multiple tests.
  2. **Pre-registration rule:** The platform governance committee (a rotating group of senior engineers not on the team) certifies predictions by reviewing quarterly plans. No retroactive entries.
  3. **Business commitments:** Treated as "non-negotiables" in Question 1. They don't make the system degenerate, but they limit future progress. We add a fourth verdict: **Keep but constrained**. It doesn't require sign-off but is noted for leadership awareness.
  4. **Time window:** We use 4 quarters of data. Degeneration must be observed for 2+ quarters to trigger action. We might keep funding a degenerating system if it has critical non-negotiables (e.g., billing) and is stable (not getting worse). But it gets a **Freeze** verdict to stop new features.

  ---

  **Apply SHAP to Your Systems:**

  1. **Python 2 search monolith:**
     - Q1: Core function is "return search results fast". Non-negotiables: None stated (so we set: must maintain compatibility with current UI contracts). 
     - Q2: Recent latency win on new index format. Was it predicted? Suppose the team wrote it down last quarter. Then: 1 win (novel). But what about the last 4 quarters? If they had 1-2 wins (mostly accommodations for compatibility), it's **Stable**.
     - Q3: Forty compat flags? Likely immunizing stratagems. Last fixes probably added flags. **Verdict: Freeze** (due to Q3) despite the win. (You won't like this, but the flags are tech debt that obscures the core.)

  2. **ML feature platform:**
     - Q1: Core function is "enable fast iteration of ML features". Non-negotiables: None.
     - Q2: Ships constantly, but never predicts wins in advance. All their "improvements" are accommodations (e.g., "we made it 5% faster" but not predicted). **Degenerating** for 4 quarters? If they had 0 pre-registered wins, yes. **Verdict: Freeze** (stop new features, focus on proving value with predictions).

  3. **Billing service:**
     - Q1: Core function: "generate accurate invoices". Non-negotiables: "Reproduce invoices byte-for-byte from 2016 onward". Protected by fiat (law). 
     - Q2: Likely few novel wins (can't change much). Probably stable (just maintenance). 
     - Q3: Anomalies? Probably handled with care (e.g., audit trails, not quick shims). 
     - Q4: Cannot predict novel wins (due to non-negotiables). **Verdict: Keep but constrained**. Note: This system can't progress, but it's not degenerating.

  ---

  **What SHAP Can't Do:**
  - **False negatives:** A system with a great track record might be about to collapse (e.g., the Python monolith). SHAP relies on recent history.
  - **Noisy metrics:** Small wins (<5%) might be dismissed if they're within noise, even if real.
  - **Human factors:** A team under pressure might skip pre-registration to avoid scrutiny. Governance must enforce gently.
  - **Values vs. facts:** When non-negotiables clash with progress (billing), SHAP flags it but can't solve it. Leadership must decide if the constraint is worth the stagnation.

  **Where It Might Misfire:**
  - **Over-freeze:** Teams might avoid risks to not look degenerating. Mitigation: Reward novel predictions even if they fail (if learned from).
  - **Bureaucracy:** Pre-registration could become paperwork. Mitigation: Use a lightweight template (one-liner predictions).
  - **Tunnel vision:** Focusing on metrics might miss code health. Mitigation: Include "simplicity" in Q3 (honest adjustments should reduce complexity).

  **Final Verdicts:**
  - Python 2 monolith: **Freeze** (due to tech debt from flags) — but it's still running, so maintain only.
  - ML platform: **Freeze** (due to no predicted wins) — stop new features until they can prove progress.
  - Billing: **Keep but constrained** (due to legal non-negotiables).

  Run SHAP for 2-3 quarters, then adjust. Good luck!
answer: |-
  **Bottom Line:** Use the System Progress Assessment (SPA) procedure: for each system, ask four ordered questions to output KEEP, FREEZE, or KILL. Verdicts: **KEEP** the Python 2 monolith (hit predicted win despite debt), **FREEZE** the ML platform (no pre-registered wins), **KEEP** the billing service (immovable constraint), with warnings on tech debt and stagnation.  

  ---

  ### **System Progress Assessment (SPA) Procedure**  
  **Time:** 15-20 mins per system (total for 4-5 systems in 90 mins).  
  **Output:** KEEP (fund new work), FREEZE (only fix critical issues), KILL (migrate off).  
  **Ordered Questions & Rules:**  

  1. **"What’s the core job, and what can we NEVER break?"**  
     - *Engineer-speak:* Define the system’s essential output (e.g., "return search results <200ms") and non-negotiable constraints (e.g., "byte-for-byte invoice reproducibility").  
     - **Sufficient answer:** 1–2 clear sentences from documentation/team lead. If undefined, **FREEZE** until clarified.  
     - **Stop if:** Core job is irrelevant to current business goals → **KILL**.  
     - *Values handoff:* Business/legal constraints (e.g., "must support on-prem forever") are marked as **IMMOVABLE**. These don’t force KEEP/FREEZE alone but limit future progress (track in appendix).  

  2. **"Last 4 quarters: Did we hit predicted wins, or just clean up messes?"**  
     - *Engineer-speak:* "Predicted win" = measurable improvement (e.g., "latency ↓10%") written in the team’s quarterly plan *before* the quarter started. "Clean-up" = fixing bugs, reducing tech debt, or explaining failures post-hoc.  
     - **Pre-registration rule:** Predictions must be in the **central platform team’s quarterly roadmap** (not self-certified). No retroactive claims.  
     - **Sufficient evidence:** Links to pre-registered predictions and post-hoc metrics (A/B tests OK; noise handled by requiring >3% sustained impact).  
     - **Scoring:**  
       - ≥2 predicted wins in 4 quarters → Proceed to Q3.  
       - Only clean-ups or 0–1 wins → **Degenerating signal** (proceed to Q3 but note risk).  
       - **Stop if:** 0 wins for 3+ quarters → **FREEZE** (or **KILL** if migration path exists).  

  3. **"When things broke, did fixes simplify the system or add more patches?"**  
     - *Engineer-speak:* "Simplify" = removing flags/shims, deleting code, or improving observability. "Patch" = adding new flags, shims, or non-instrumented toggle.  
     - **Sufficient answer:** Examples of last 3 major fixes. Honest adjustments reduce complexity; immunizing ones hide technical risk.  
     - **Stop if:** >50% of recent fixes are patches *and* system has tech debt (e.g., flags/shims) → **FREEZE** (stop new features until cleanup).  

  4. **"Can we commit to one novel, measurable win next quarter?"**  
     - *Engineer-speak:* "Novel win" = improvement not tied to existing bugs/tech debt (e.g., "new index format to ↓latency 5%", not "fix deadlock").  
     - **Sufficient answer:** Written commitment in next quarter’s roadmap (vetted by central platform team).  
     - **Final verdict:**  
       - YES + passed Q1–Q3 → **KEEP**.  
       - NO → **FREEZE** (if core job vital) or **KILL** (if replaceable).  

  ---

  ### **Hard Cases Handled**  
  1. **Noisy metrics/No crucial experiments:**  
     - Pre-registration (Q2) forces specificity. Allow statistical wins (>3% impact over 2+ A/B tests) but reject "noise-sized" gains.  
  2. **Pre-registration rubber stamp:**  
     - Central platform team (not owners) vets predictions. They must include: metric, target, and timeframe.  
  3. **Business/legal constraints:**  
     - Treated as **IMMOVABLE** in Q1. Doesn’t change verdict but limits options:  
       - If system has immovable constraint + degenerating → **FREEZE** (not KILL).  
       - Requires VP sign-off to remove constraint.  
  4. **Time window for degeneration:**  
     - 3+ quarters of 0 wins (Q2) forces FREEZE/KILL. But:  
       - Degenerating system can **KEEP** if it has an immovable constraint (e.g., billing) *and* is stable (no active fires).  

  ---

  ### **Run on Your Systems**  
  **Python 2 Search Monolith (9-yr old)**  
  - Q1: Core job = "Return relevant results <300ms". No immovable constraints.  
  - Q2: Predicted latency win hit → **counts as novel win** (pre-registered and hit target).  
  - Q3: Forty flags = high risk of immunizing patches → **warning tech debt**.  
  - Q4: Team commits to new win → plausible.  
  - **Verdict: KEEP** (win shows progress) but force flag cleanup in Q3.  

  **ML Feature Platform (18-mo old)**  
  - Q1: Core job = "Ship ML features that improve engagement". No constraints.  
  - Q2: Never pre-registered wins → **0 wins in 4 quarters** (only clean-ups).  
  - Q3: Frequent shipping suggests honest adjustments → neutral.  
  - Q4: If no novel commitment → **FREEZE**.  
  - **Verdict: FREEZE** (degenerating via Q2; no pre-registered progress).  

  **Billing Service**  
  - Q1: Core job = "Generate accurate invoices". **Immovable constraint** (byte-for-byte reproducibility).  
  - Q2: Few wins (due to constraint) → degenerating, but immovable.  
  - Q3: Changes likely audited (low patch risk).  
  - Q4: Cannot commit to novel wins (due to constraint).  
  - **Verdict: KEEP** (Q1 constraint forces this) but tag as "high stagnation risk".  

  *(You won’t like the ML platform FREEZE verdict—it’s active but lacks rigor.)*  

  ---

  ### **What SPA Can’t Do**  
  - **False negatives:** Systems with high legacy value but no metrics might wrongly FREEZE (e.g., critical but unmeasured infra).  
  - **Tunnel vision:** Over-indexes on pre-registration; teams might avoid risky bets to "game" Q2.  
  - **Immovable constraints:** No escape hatch—if business won’t budge (e.g., on-prem support), SPA can’t force change.  
  - **Hindsight bias:** Degeneration is clearer in retrospect; SPA uses 4-quarter window as compromise.  

  **Where It Misfires for You**  
  - **Noisy metrics:** May reject legitimate small wins (<3%) even if real.  
  - **Patch-heavy systems:** Python monolith’s flags might be judged harshly (Q3) despite core progress.  
  - **Fast-moving teams:** ML platform’s activity sans predictions penalizes "shipping culture."  

  ---  
  **SPA in a Nutshell:** Four questions force rigor on predictions, simplicity, and core value. Pre-registration and decay windows handle Lakatos’ "no instant rationality" without philosophy jargon. Re-run quarterly; adapt thresholds based on misfires.
