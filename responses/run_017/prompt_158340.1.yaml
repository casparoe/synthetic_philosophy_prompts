answer: |-
  ### Workshop Design: "The Repeated Bet Challenge"  
  **Goal:** Make students viscerally grasp why maximising growth rate (log wealth) beats maximising expected value (EV) in repeated bets, via hands-on play with real stakes. Avoid "Kelly" and "ergodicity" until debrief.  

  **Failures to Engineer:**  
  1. **Bust Risk:** Players maximising EV (e.g., betting 100% each round) go bankrupt, showing EV’s failure under repetition.  
  2. **Wealth Erosion:** Players using constant absolute bets (e.g., £20/round) see their wealth stagnate, while fractional bettors compound.  
  3. **Tournament Dilemma:** Aggressive bets win short contests, but sabotage long-term growth—forcing a strategic conflict.  
  4. **Indefinite Stress:** Random stopping unnerves players, revealing how unknown horizons break standard optimisation.  

  ---

  ### Game Structure (90 mins)  
  **Materials:**  
  - Fake money: £100 in "banknotes" per player (use printed slips).  
  - 6 biased coins (60% heads, 40% tails)—one per group.  
  - Whiteboard to track wealth (group summaries only).  
  - Prize for tournament (e.g., chocolate bar).  

  **Rules:**  
  - **Bet:** Each round, players bet fraction \(f\) (0%–100%) of current wealth on a coin flip.  
    - Win: Double your bet (wealth = wealth + bet).  
    - Lose: Lose bet (wealth = wealth – bet).  
  - **Wealth Update:** \(W_{\text{new}} = W_{\text{old}} \times (1 + f)\) on win, \(W_{\text{old}} \times (1 - f)\) on loss.  
  - **Play in Groups:** 6 groups of 3. Each group shares a coin; players decide \(f\) secretly.  

  #### Timeline:  
  1. **Intro & Practice (10 mins):**  
     - Explain rules: "Goal: Grow your wealth. Bet a fraction of your current stack each round. Coin wins 60% of the time."  
     - Practice: All bet \(f = 20\%\) on one flip. Show maths: Win → £120, lose → £80.  

  2. **Fixed Rounds: 5 Rounds (20 mins):**  
     - Start: £100 each.  
     - **Mechanics per round:**  
       - Players write \(f\) on paper (secret).  
       - Group reveals \(f\), flips coin, updates wealth.  
       - Recorder posts group’s min/max wealth on whiteboard.  
     - **Reflection (after Round 5):**  
       - *Ask:* "Who has less than £100? Who bet >50%? Why?"  
       - **Map to maths:** Highlight a player who went bust (e.g., \(f = 100\%\)). Calculate:  
         - EV per bet: \(0.6 \times 2 + 0.4 \times 0 = 1.2\) (positive!).  
         - But geometric growth: \((1+1)^{0.6} \times (1-1)^{0.4} = 0\) → ruin.  

  3. **Tournament Round: 3 Rounds (15 mins):**  
     - **Twist:** Reset wealth to £100. "Richest player wins a prize after Round 3—no second place."  
     - **Dilemma Setup:**  
       - *Nudge:* "This is a sprint, not a marathon. How will you adapt?"  
     - **Play 3 rounds** (same mechanics).  
     - **Reflection:**  
       - Award prize. *Ask winner:* "What \(f\) did you use? Would you do this over 100 rounds?"  
       - **Map to maths:**  
         - Winner likely used high \(f\) (e.g., 80–100%). Show variance:  
           - \(f = 100\%\): 21.6% chance to hit £800 (win), else £0.  
           - \(f = 20\%\): Safe growth (£173) but rarely wins tournaments.  

  4. **Indefinite Horizon: Random Stopping (25 mins):**  
     - **Twist:** Reset to £100. "After each round, I flip a fair coin. Heads: we play another; tails: game ends."  
     - **Play 1 round, then flip after each subsequent round** (max 5 rounds to cap time).  
     - **Stress the unknown:** "Will this be your last bet? Adjust wisely."  
     - **Early busts:** Players at £0 sit out (observe).  

  5. **Debrief (20 mins):**  
     - **Wealth snapshots:** Compare players across phases (e.g., EV-maximiser vs. fractional better).  
     - **Connect moments to maths:**  
       | **Moment in Room**         | **Maths Insight**                          |  
       |----------------------------|--------------------------------------------|  
       | Bust in fixed rounds       | EV ignores ruin risk → geometric mean = 0. |  
       | Tournament winner’s \(f\)  | Short contests reward high variance, not growth rate. |  
       | Anxiety in indefinite phase | Random horizons break "\(N\)-round" optimisation. |  
     - **Reveal key concepts:** "What you felt was the difference between arithmetic mean (EV) and geometric mean. Maximising log wealth optimises growth. This is the Kelly criterion—and why ergodicity matters."  
     - **Handout:** Post-workshop summary with formulae (e.g., optimal \(f^* = p - q = 0.2\)) and simulation results.  

  ---

  ### Mechanics Brainstorm & Choice  
  **Option 1: Fractional Betting (Chosen)**  
  - **How:** Players bet fraction \(f\) of current wealth.  
  - **Why:** Directly links to growth rate. Forces compounding effects (e.g., £100 → £50 is a 50% loss, but £50 → £100 is a 100% gain).  
  - **Fits goals:** Cleanly produces all target failures.  

  **Option 2: Constant Absolute Bets**  
  - **How:** Fixed £x bet each round, ignoring wealth.  
  - **Why:** Contrasts fractional betting—shows why fixed sums don’t compound.  
  - **Rejected:** Less visceral for growth-rate lesson; dilutes bankruptcy risk.  

  **Option 3: Leveraged Bets**  
  - **How:** Allow borrowing (e.g., bet >100% of wealth).  
  - **Why:** Amplifies bust risk.  
  - **Rejected:** Overcomplicates; bankruptcy is clear enough at \(f = 100\%\).  

  ---

  ### Predictable Failures & Fixes  
  1. **Time Overrun:**  
     - **Why:** Wealth updates slow with 18 players.  
     - **Fix:** Groups update internally; only min/max wealth posted per group. Cap rounds (5 fixed, 3 tournament, 5 max indefinite). Use timers.  

  2. **Calculation Errors:**  
     - **Why:** Miscomputing \(f \times\) wealth (e.g., 20% of £150 = £30).  
     - **Fix:** Recorders use calculators. Practice round reinforces maths.  

  3. **Tournament Misplay:**  
     - **Why:** Students default to long-run \(f = 20\%\), missing the point.  
     - **Fix:** Explicitly nudge: "This is winner-takes-all—play to win, not to grow." Praise aggressive winners.  

  4. **Indefinite Stress Fizzles:**  
     - **Why:** Coin may stop early (e.g., 1 round), muting impact.  
     - **Fix:** Rig the first fair coin flip (ensure at least 3 rounds). Discuss "what ifs" in debrief.  

  ---

  ### What the Game Can’t Deliver  
  - **Theoretical Proof:** Students won’t intuit why \(f^* = 0.2\) is optimal for growth.  
  - **Your Role:** **Say aloud post-debrief:** "The growth rate maximises \(\prod (1 + fX_i)\), which is the geometric mean. Log transform makes it additive—so you maximise expected log wealth. That’s the engine."  
  - **Why:** The game creates intuition, but maths connects it. Simulations (post-handout) bridge the gap.  

  **British English Check:** "Maths" (not "math"), "£", "whilst" → replaced with "while". Minimal waffle—direct and practical.  

  ---  
  **Run it tight, and they’ll feel the burn of ruin before they see the formula.**
