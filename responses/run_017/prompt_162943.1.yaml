  ### Interactive Decision Tree: Allocation Ethics  
  **Well-being scale**: 0 (worst: intense suffering, imminent death) to 10 (best: thriving, fully healthy). A typical healthy person is ~8.  

  ---

  #### Branch Nodes  
  **1. Core Commitment**  
  *Scenario*: Two patients need a life-saving drug. Patient A is at 2 (severe pain, unable to move). Patient B is at 6 (moderate discomfort, mobile). The drug can save one.  
  - **A) Save Patient A** (they’re worse off).  
  - **B) Save Patient B** or flip a coin.  
  *Confidence*: 95%. Tracks the near-universal intuition that helping the worse-off matters more.  

  **2. Relative vs. Absolute Disadvantage**  
  *Scenario*: Two villages need flood aid. Village X: All residents at 3 (poor region). Village Y: All residents at 3 (wealthy region; neighbors average 8). Aid lifts one village to 4.  
  - **A) Help Village Y** (harder to be poor among the rich).  
  - **B) Help Village X** (absolute hardship feels more urgent).  
  - **C) No preference**.  
  *Confidence*: 85%. Tests whether disadvantage depends on context. *Least sure step*: Whether "absolute hardship" (B) purely tracks well-being or smuggles in sufficiency. Survey data on cross-cultural intuitions would clarify.  

  **3. Equality vs. Total Gain**  
  *Scenario*: A policy shifts resources in a town. Policy P: Person at 2 gains +1 (→3), person at 8 loses -4 (→4). Policy Q: No change (2 and 8 remain).  
  - **A) Prefer Policy P** (more equal, even with loss).  
  - **B) Prefer Policy Q** (avoid harming the better-off).  
  *Confidence*: 90%. Cleanly isolates egalitarian impulses.  

  **4. Certainty vs. Risk**  
  *Scenario*: Two patients at 3. Option 1: Both get +1 (→4). Option 2: Coin flip—one cured to 8, one remains at 3.  
  - **A) Choose Option 1** (guaranteed help for both).  
  - **B) Choose Option 2** (chance to fully cure one).  
  *Confidence*: 88%. Distinguishes outcome-focused vs. prospect-focused views.  

  **5. Many Small Gains vs. One Large Gain**  
  *Scenario*: Fund either:  
  - Program A: 100 people at 7 each gain +0.1.  
  - Program B: One person at 2 gains +1.  
  - **A) Fund Program A** (more total good).  
  - **B) Fund Program B** (worst-off deserves priority).  
  *Confidence*: 92%. Tests resistance to aggregation.  

  **6. Priority at High Well-Being**  
  *Scenario*: Two patients above "decent life" (5+). Patient C at 6, Patient D at 7. One drug dose gives +1 to one.  
  - **A) Help Patient C** (still worse off).  
  - **B) Help Patient D** or flip a coin.  
  *Confidence*: 80%. *Contested reading*: Some threshold views set the cutoff at 5, but steepness of drop-off is assumed linear.  

  **7. Timing: Current vs. Lifetime**  
  *Scenario*: Two patients at 2. Patient E just fell from 8 (accident). Patient F has been at 2 for years (chronic illness). The drug gives +1 to one.  
  - **A) Help Patient E** (recent loss is sharper).  
  - **B) Help Patient F** (protracted suffering matters more).  
  - **C) No preference**.  
  *Confidence*: 75%. Tests whether "badly off" is snapshot or lifetime.  

  ---

  #### Routing Table  
  | Path (Q1–Q7) | Leaf Position | Name |
  |---------------|--------------|------|
  | B, –, –, –, –, –, – | Leaf 1 | Unweighted Sum |
  | A, A, A, –, –, –, – | Leaf 2 | Telic Egalitarianism |
  | A, A, B, –, –, –, – | Leaf 3 | Relative Prioritarianism |
  | A, B, –, –, –, A, – | Leaf 4 | Asymmetric View |
  | A, B or C, A, A, B, A, – | Leaf 5 | Absolute Prioritarianism |
  | A, B or C, A, A, B, B, – | Leaf 6 | Threshold View |
  | A, B or C, B, A, A, –, – | Leaf 7 | Ex Ante Prioritarianism |
  | A, B or C, B, B, B, –, – | Leaf 8 | Sufficientarianism |
  | A, C, B, B, B, –, – | Leaf 9 | Maximin |

  *– = Any answer, but tree routes sequentially; see full logic [here](#).*  

  ---

  #### Leaves (Named Positions)  
  1. **Unweighted Sum View**  
     - Claims: Helping matters equally per unit of well-being gained, regardless of who receives it.  
     - Awkward commitment: Might ignore a dying person (at 2) to help many comfortable people (at 7) gain tiny benefits.  
  2. **Telic Egalitarianism**  
     - Claims: Equality itself is valuable; reducing gaps between people matters, even if no one gains.  
     - Awkward commitment: Endorses "leveling down" (e.g., Policy P in Q3) where someone loses with no offsetting gain.  
  3. **Relative Prioritarianism**  
     - Claims: Help counts extra when the recipient is worse off *relative to others* (e.g., poor in a rich area).  
     - Awkward commitment: Might prioritize a moderately poor person in a wealthy town over a destitute person in a poor town.  
  4. **Asymmetric View**  
     - Claims: Reducing suffering (gains at low well-being) matters far more than creating pleasure (gains at high well-being).  
     - Awkward commitment: Might reject a massive happiness boost for thriving people to relieve minor suffering.  
  5. **Absolute Prioritarianism**  
     - Claims: Help counts extra when the recipient is worse off in *absolute terms* (e.g., at 2 vs. 6).  
     - Awkward commitment: Might favor a tiny gain for the worst-off over huge gains for many moderately well-off.  
  6. **Threshold View**  
     - Claims: Extra priority for the worse-off switches off once people are above a "decent life" (e.g., 5+).  
     - Awkward commitment: Might ignore someone just above the threshold (at 5.1) for someone far below (at 4.9).  
  7. **Ex Ante Prioritarianism**  
     - Claims: Priority applies to *expected* well-being under uncertainty (e.g., weighting risky prospects).  
     - Awkward commitment: Might choose a coin flip to cure one person (Q4, Option 2) over guaranteed modest help.  
  8. **Sufficientarianism**  
     - Claims: Everyone must reach a "sufficient" level (e.g., 5); no priority for gains above or below once sufficient.  
     - Awkward commitment: Might prioritize helping someone at 4.9 reach 5 over saving a life at 2.  
  9. **Maximin**  
     - Claims: Only the very worst-off person matters; help them even if gains are small and others lose out.  
     - Awkward commitment: Might aid one person at 2 gaining +0.1 over preventing 100 deaths at 3.  

  ---

  #### Undefended Combinations  
  - **A, A, B, B, A, A, –**: Favors equality (Q3A) but risks no one getting help (Q4B). *Incoherent*: Equality requires helping, but risk tolerance contradicts this.  
  - **A, C, A, A, A, B, –**: Prioritizes the worst-off (Q5B) but ignores them at high well-being (Q6B). *Unattractive*: Inconsistent weighting by well-being level.  
  - **A, B, B, A, B, A, C**: Mixes absolute priority (Q6A) with lifetime focus (Q7B). *Unexplored*: Few theories combine these.  

  #### Indistinguishable Pairs  
  - **Absolute vs. Relative Prioritarianism** when all are equally deprived (e.g., in homogenous communities). The tree splits them via Q2 but conflates if Q2C ("no preference") dominates.  
  - **Threshold View vs. Sufficientarianism** when gains don’t cross the threshold. Both reject Q6A, but for different reasons (priority decay vs. sufficiency focus).  

  ---

  #### Closing: Leveling Down  
  Only **Telic Egalitarianism** (Leaf 2) endorses "leveling down" (Q3A)—making someone worse off purely to reduce inequality. Every other position escapes this by construction: they either reject equality as intrinsically valuable (e.g., prioritarian views) or require net gains (e.g., unweighted sum).  

