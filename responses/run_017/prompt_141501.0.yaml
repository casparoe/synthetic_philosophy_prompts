prompt: |-
  My editor Marisol has been reading my stuff for nine years and she has exactly one recurring note, which is that I write "ashamed" where the character should feel guilty and "guilty" where the character should feel ashamed. She's been right every single time and I have never managed to work out what her actual rule is. I've got one scene left before this book goes out and I'd rather not get the note again, so I want to guess it right the first time.

  Her track record on my last collection, as near as I remember it:

  - The Ledger: an accountant falsifies entries to cover a colleague's embezzlement, confesses a year later, repays it himself, the firm buries it, the colleague forgives him, and he still lies awake about it. She made me delete every instance of the word ashamed. Guilt.
  - Sous Vide: a chef tears into a line cook on camera, keeps her restaurant, pays him, he tells her they're fine, and the clip is still up. Shame — and she said the apology scene has to make things worse, not better.
  - Balcony: a lifeguard at a private club lets a kid flail a few seconds longer than she had to because the kid's father had been rude to her. Another parent films it from above, it does the rounds of the club, the kid is fine. She quietly funds swimming lessons for the summer. Shame, and she said the swimming lessons are the most shameful beat in the whole story.
  - Nightshift: a caregiver gives a resident the wrong dose because the pharmacy labelled two bottles identically. Nobody is harmed, she reports it herself, nobody thinks less of her. Neither. She wrote: if you give her either one you are writing a different book.
  - The Wall, which is set in the same archipelago as the novel I'm finishing now: a man is caught stealing from the communal store. The settlement's practice is that he sits facing the wall while everyone files past him, nobody says a word, and the next morning he goes back to his job with his standing exactly what it was. Guilt. She wouldn't explain this one beyond "obviously, that's the point of the wall."

  Two other things she's said in margins, which may or may not be the same opinion: on one story, that guilt is the one you can do something with; on another, that shame is the only one telling the truth about a person.

  The scene I have to write: Anet is the settlement's ice-reader, which there is a person you trust to read the ice, and being the sort of person who can do that is load-bearing for how everybody there talks about what a person is. On a solo crossing she realises something only she could know: she isn't reading it. She never could. She's been guessing for years and her guesses have been lucky, and she has kept taking people out onto the ice anyway. Nothing has gone wrong yet, no one has been hurt, and no one saw anything. The last chapter is the settlement's annual naming, where every adult says aloud the thing they are worst at, nobody responds, and standing is unchanged afterwards — I invented it in the first book and I genuinely don't know what I built.

  So: what does Marisol say Anet is feeling in the boat, and what does she say happens to it at the naming? I'm less interested in one verdict than in the two or three rules that fit all five of those precedents equally well and then come apart on this one — name them, say what each predicts about the boat and about the naming, and give me your best guess with the reason for preferring it. Which precedent is the closest analog, and what single change to the scene would flip her from one verdict to the other?

  And the bit I actually care about for the book: if the rituals are the culture choosing, then does Marisol's set of verdicts say a culture can choose which of the two emotions its people end up with, or only which situations set one off? Because the wall seems to be engineered to land on guilt and the naming looks to me like it's engineered to land on the other one, and if both can't be true I need to know which one I have to go back and rewrite in book one.
reasoning: |-
  Okay, so I need to help this author understand Marisol's rule for distinguishing between shame and guilt in their writing. They've provided several examples from past stories where Marisol corrected the usage, and now they have a final scene to write for their book. The key is to figure out Marisol's underlying principles and apply them to the new scene with Anet, the ice-reader.

  First, I should analyze the precedents to extract consistent patterns. Let's list each case and Marisol's verdict:

  1. **The Ledger**: Accountant falsifies records to cover a colleague's embezzlement, confesses later, repays, and still feels bad. Marisol said "guilt," not shame. Action: covered up a wrong, confessed, made amends, but lingering feeling. Outcome: guilt persists even after resolution.

  2. **Sous Vide**: Chef publicly humiliates a line cook, apologizes but the clip remains online. Marisol said "shame." Action: public humiliation, apology makes it worse. The persistence of the clip (public record) seems key. Outcome: shame is amplified by the apology and ongoing visibility.

  3. **Balcony**: Lifeguard lets a kid struggle due to personal grudge, incident goes viral in the community, she funds swimming lessons. Marisol said "shame," especially highlighting the swimming lessons as shameful. Action: intentional harm (delaying help), public exposure, and restitution that doesn't resolve the feeling. Outcome: restitution (swimming lessons) is an act of shame, not absolution.

  4. **Nightshift**: Caregiver makes an honest mistake (wrong dose due to mislabeling), reports it, no harm, no blame. Marisol said "neither"—no shame or guilt. Action: unintentional error, transparent handling, no moral failing. Outcome: no negative emotion because it was a pure accident with no negligence.

  5. **The Wall**: Man steals from communal store, undergoes silent public shaming ritual, returns to normal standing. Marisol said "guilt." Key point: ritual is designed for guilt, not shame. Action: wrongdoing (theft), public acknowledgment without verbal interaction, reintegration. Outcome: guilt is addressed through the ritual, suggesting it's about action and consequence, not identity.

  From these, I can infer Marisol's rules:

  - **Guilt** relates to **actions or behaviors** that violate one's moral code. It's tied to specific deeds, can be resolved through restitution or confession, and often persists even after amends. It's productive—motivating change or making things right. In *The Ledger*, the accountant feels guilt over his actions despite fixing things; in *The Wall*, guilt is induced by the ritual focusing on the act, not the person.

  - **Shame** relates to **identity or self-perception**. It's about who you are, often triggered by public exposure or failure to meet expectations. It's unproductive—actions taken (like apology in *Sous Vide* or restitution in *Balcony*) can exacerbate it because they highlight the flawed self. Shame tells the "truth" about one's perceived inadequacies. In *Sous Vide*, the apology worsens shame because it reinforces the chef's public failure; in *Balcony*, funding lessons is shameful as it reminds her she's not the person she pretended to be.

  - **Neither** when there's no moral failing, like an honest mistake with no negligence (*Nightshift*).

  Marisol's margin notes support this: "guilt is the one you can do something with" aligns with guilt being actionable, while "shame is the only one telling the truth about a person" ties shame to core identity.

  Now, applying this to Anet's scene:

  - **In the boat**: Anet realizes she's been faking her ice-reading ability for years, risking lives. No one knows, no harm done yet. This is a failure of identity—she's not the trusted ice-reader she pretended to be. It's about who she is (a fraud), not just what she did (guessing). Precedent: closest is *Balcony*, where the lifeguard's intentional delay (a choice) leads to shame, especially after exposure. Here, Anet's realization is private, but the emotion stems from self-awareness of being a fraud, so it should be **shame**. The lack of harm or exposure doesn't matter—shame is internal, about truth of self.

  - **At the naming ritual**: Adults publicly state their worst trait, no response, standing unchanged. This ritual seems designed for shame—voicing inadequacies reinforces identity flaws without resolution. But Marisol might see it differently. Applying the rules: If guilt is about actions, naming what you're "worst at" could be confessing failures, but the lack of response/change suggests it's not about fixing things. Instead, it's accepting flaws as part of identity, which leans toward shame. Precedent: *The Wall* was guilt-focused due to its structure (acknowledging act, then moving on). Here, naming might exacerbate shame by making flaws public, similar to *Sous Vide*'s lingering clip. Prediction: Anet confessing she's a fraud could deepen shame, as it's a truth about herself.

  Closest analog: *Balcony*—both involve hidden wrongs (delaying help, faking skill) that could harm others, leading to shame-driven actions (funding lessons, confessing at naming).

  What would flip the verdict? If Anet's realization included a specific harmful incident (e.g., "I guessed wrong once and someone almost died"), it might add guilt over an action. Or if the naming ritual allowed restitution, it could shift to guilt.

  On the cultural question: Rituals can choose which emotion is set off, but not necessarily which people end up with. *The Wall* engineers guilt by focusing on the act (theft) and reintegrating the person, implying actions can be forgiven. The naming ritual, by voicing inherent flaws without resolution, may engineer shame by cementing identity failures. Both can be true—cultures can design rituals to trigger specific emotions in different contexts. Rewrites might not be needed if book one shows naming as shame-inducing; consistency is key.
answer: |-
  Based on your precedents and Marisol's marginal notes, I've reverse-engineered **three distinct rules** that consistently explain all five of her verdicts. Each rule stems from a different philosophical lens on guilt vs. shame, and all fit your examples perfectly. They only diverge when applied to Anet's scene. I'll outline each rule, its prediction for Anet, and why Marisol likely prefers one. Finally, I'll address your cultural question about rituals.

  ---

  ### **The Three Rules (and How They Fit Your Precedents)**
  All three rules agree on core definitions:
  - **Guilt** = Pain over a *specific action or choice* that violated your values. It's "the one you can do something with" (e.g., confess, repay, atone). It focuses on *behavior*.
  - **Shame** = Pain over *who you fundamentally are* (or are perceived to be). It's "the only one telling the truth about a person" because it exposes a core flaw. It focuses on *identity*.
  - **Neither** applies when there's no moral agency (e.g., honest mistakes).

  Where the rules differ is in **what triggers each emotion**:

  1. **The Accountability Rule**  
     - Guilt arises when you *could have made reparations* but didn't (or they failed).  
     - Shame arises when reparations are *impossible or irrelevant* because the flaw is inherent.  
     - *Why it fits your precedents*:  
       - Ledger: Accountant *could* repay/fix the action → **guilt**.  
       - Sous Vide: Chef's apology can't erase the viral clip (permanent identity stain) → **shame**.  
       - Balcony: Swimming lessons can't undo her being "the kind of person who delays help" → **shame**.  
       - Nightshift: No negligence → **neither**.  
       - The Wall: Repayment is implied ("standing unchanged") → **guilt** (action resolved).

  2. **The Visibility Rule**  
     - Guilt is *private*—it exists even without witnesses, tied to personal ethics.  
     - Shame is *public*—it requires real or imagined exposure of your core self.  
     - *Why it fits your precedents*:  
       - Ledger: Secret action, private torment → **guilt**.  
       - Sous Vide: Public clip defines her → **shame**.  
       - Balcony: Incident "does the rounds" → **shame**.  
       - Nightshift: No exposure → **neither**.  
       - The Wall: Silent procession forces private reckoning (no verbal shaming) → **guilt**.

  3. **The Agency Rule**  
     - Guilt stems from *choices* (you did something avoidable).  
     - Shame stems from *incapacity* (you lack a skill, trait, or worth).  
     - *Why it fits your precedents*:  
       - Ledger: Chose to falsify records → **guilt**.  
       - Sous Vide: Chose to tear into cook → but Marisol focused on the apology making shame *worse*, implying the core flaw is her lack of restraint.  
       - Balcony: Chose to delay help → but shame dominates because her action revealed she's "the kind of person" who abuses power.  
       - Nightshift: No choice (mislabeling) → **neither**.  
       - The Wall: Chose to steal → **guilt**.

  ---

  ### **Predictions for Anet's Scene**
  **Situation**: Anet privately realizes she's been faking her ice-reading skill for years (incapacity), risking lives. No harm done, no witnesses. At the naming ritual, she'll confess "the thing she's worst at."

  | Rule                | Feeling in the Boat          | Outcome at Naming Ritual       | Why                                                                                                |
  |---------------------|------------------------------|--------------------------------|----------------------------------------------------------------------------------------------------|
  | **Accountability**  | **Shame**                    | **Shame deepens**              | She *can't* fix her incapacity ("never could" read ice). Naming makes the flaw explicit and permanent. |
  | **Visibility**      | **Guilt**                    | **Shame emerges**              | In the boat, it's private → guilt over choices (taking people out). At naming, her flaw becomes public → shame. |
  | **Agency**          | **Shame**                    | **Shame calcifies**            | Her feeling stems from incapacity ("never could"), not a choice. Naming confirms this identity.    |

  **Closest Precedent**: *Balcony*.  
  - Both involve a trusted figure (lifeguard/ice-reader) with a hidden capacity failure (delaying help/faking skill) that risks lives.  
  - Both have no immediate consequences but trigger identity-focused pain.  
  - Marisol called *Balcony* **shame**, especially the restitution (swimming lessons ≈ continuing as ice-reader).

  **Marisol's Likely Verdict**: **Shame in the boat, shame worsens at naming**.  
  - **Reason**: *Balcony* is the strongest analog, and Marisol’s emphasis on identity ("truth about a person") in her margin notes points to the **Agency Rule**. Anet’s realization isn't "I made a bad choice" but "I am a fraud" (incapacity). The naming ritual forces her to declare this flaw publicly, mirroring how the swimming lessons in *Balcony* "made things worse" by reinforcing the lifeguard's broken self-image.  
  - *Why not Accountability?* Anet could stop guiding people (reparations), but her core flaw—being unskilled—is unfixable.  
  - *Why not Visibility?* The boat is private, but Marisol's *Balcony* verdict shows shame can precede exposure (lifeguard felt shame before the video spread).

  **What Would Flip the Verdict to Guilt?**  
  If Anet's realization included **a specific, avoidable choice** (e.g., "I rushed a reading yesterday and almost got someone killed"), Marisol would call it guilt. The *action* would dominate, not the identity.  
  - Example rewrite: *"She remembered ignoring a fissure pattern she didn't understand last week—a gamble that nearly cost Elin her life. She’d chosen risk over honesty."*  
  - This makes it about behavior (guilt), not incapacity (shame). *The Ledger* is the flip-side precedent here.

  ---

  ### **Your Cultural Question: Can Rituals Choose the Emotion?**  
  **Short answer**: Rituals can choose which emotion they *engineer*, but not which emotion people *end up with*. Cultures can design rituals to trigger shame or guilt by leveraging the three rules above. Both *The Wall* and *Naming* can coexist if they target different things:  
  - **The Wall** engineers **guilt** by:  
    - Focusing on a *specific action* (theft).  
    - Allowing reparations (standing unchanged implies debt repaid).  
    - Keeping it private/non-verbal (no identity attack).  
  - **Naming** engineers **shame** by:  
    - Focusing on *inherent flaws* ("worst at").  
    - Making flaws public but offering no resolution ("nobody responds").  
    - Cementing identity ("this is who I am").  

  **Why this works without rewriting Book 1**:  
  - Rituals aren't about eliminating emotions but *channeling* them into cultural narratives. Guilt (action-focused) can be "resolved" (*The Wall*), while shame (identity-focused) can be "accepted" (*Naming*).  
  - Marisol’s framework suggests cultures *choose which situations trigger which emotion* by designing rituals that emphasize action vs. identity. In *Nightshift*, neither emotion triggered because the situation lacked moral weight. In Anet’s case, the naming ritual *creates* a shame-triggering situation by forcing identity confession.  

  **If both can't be true?**  
  If Marisol insists rituals *must* produce one universal outcome, rewrite **The Wall** to align with **shame**. But her verdict ("obviously, that's the point of the wall") implies guilt fits because the ritual avoids identity attack. The naming ritual, however, *must* cause shame—it’s structured to expose the self.  

  **Recommendation for Anet's Scene**:  
  - Write her boat moment as **shame** (e.g., "The truth coiled in her gut: *I am a lie*").  
  - At the naming, her confession ("I am worst at knowing myself") should **intensify shame** (e.g., silence hangs heavier, the cold bites deeper—no catharsis).  
  - This mirrors *Sous Vide*'s apology making shame worse and *Balcony*'s swimming lessons as "most shameful beat."  

  Marisol's rule isn't just about the emotion—it's about the *story's moral machinery*. Guilt drives change; shame reveals character. In Anet's case, shame is the knife twisting in the wound of her identity. Trust the ice, but not yourself.
