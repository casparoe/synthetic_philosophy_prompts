  Now, the scenario:

  **The Scenario**

  A local park is in danger of being sold for development unless the community raises a fixed sum. A letter is sent to all N=100 residents: if at least T=100 residents each contribute C=$50 (by returning the letter with a check), then the park will be saved, and everyone (even non-contributors) will enjoy a benefit valued at V=$1000 per household. The cost C=$50 is non-refundable. The decision is anonymous and one-shot. Residents are similar but not identical: they share a common cultural background (a latent variable) that makes them more or less likely to contribute, but individual factors vary. The threshold is high: every single resident must contribute to save the park.

  **What Each Theory Says**

  - **CDT**: The probability your contribution is pivotal (that exactly 99 others contribute) is 1/100. If you are pivotal, your contribution brings the park, giving you $1000 - $50 = $950. Otherwise, your $50 is wasted or redundant. Expected net gain: (1/100)*$950 - (99/100)*$50 ≈ $9.50 - $49.50 = -$40. Do not contribute.

  - **EDT**: Conditioning on your contributing, the probability the park is saved increases by 1/100 (because the evidential difference is 1/100). The expected benefit of contributing: P(saved | you contribute)*$1000 - $50. But P(saved | you contribute) = P(all others contribute | you contribute). Because of correlation via the latent variable, this is higher than 1/100, but the increase due to your contribution (the evidential difference) is exactly 1/100. So the net expected gain is at most $1000 * (1/100) - $50 = $10 - $50 = -$40. Do not contribute.

  - **Superrationality**: If all reason identically, they all contribute or all don't. If all contribute, each gets $1000 - $50 = $950. If none do, they get $0. $950 > $0, so all should contribute. Randomization (e.g., each contributes with probability p) yields lower expected utility (as shown by calculus for T=N) than full contribution. So contribute.

  **Why the Lure Runs Backwards**

  In Hofstadter's dilemmas, superrationality restrains self-interest: the unique prize tempts, but sending the claim risks duplication. Here, the public good requires unanimity. Superrational coordination compels contribution: the fear isn't duplication but critical shortfall. Restraint (not sending) dooms the good; full participation saves it profitably. The lottery fails because near-certainty requires near-unanimity, costing almost as much as full contribution without the guarantee.

  **Stress Test**

  - *Perfect correlation*: If agents are identical, EDT and superrationality align: contributing is strong evidence of success, so EDT might flip. But with perfect correlation, P(saved | you contribute)=1, so EDT gain: $1000 - $50 = $950 > $0. EDT says contribute. CDT remains "don't" (pivotality still 1/100).

  - *Lower threshold*: Set T=50. Then CDT and EDT still say "don't" (if C>V/N). Superrationality, with all contributing, yields $950. But a lottery (p=0.6) might yield higher EU (≈$970) than full contribution ($950), so superrationality might prefer randomization.

  - *Small N*: Set N=2, T=2, V=1000, C=50. CDT/EDT: pivotality=1/2. CDT gain: (1/2)*950 - (1/2)*50 = 475-25=450>0? Then CDT says contribute! To keep CDT "out", need C>V/2, e.g., C=600. But then superrationality: if both contribute, get 1000-600=400>0. But lottery: with p=1, EU=400; with p=0.9, P(both)=0.81, EU=0.81*1000 - 0.9*600=810-540=270<400. So p=1 is best. But if V=1000, C=600, then V/N=500, and C=600>500, so CDT: (1/2)*(1000-600) - (1/2)*600 = (1/2)*400 - 300 = 200-300=-100<0 -> don't contribute. So it holds.

  **How a Superrationalist Fights Back**

  A superrationalist might object: if agents are not identical, assuming they all do the same is unrealistic. The latent variable model shows EDT already accounts for correlation, and superrationality's perfect coordination is an extreme case of that. Without identical decision procedures, superrationality collapses into EDT or requires an arbitrary symmetry assumption. The case is rigged: unanimity thresholds are rare, and the lottery is often superior for T<N. Why privilege the deterministic outcome?

  **Settled vs Contested**

  Experts agree that CDT and EDT diverge in such cases, with CDT ignoring correlation. Most accept the EDT calculation with shared latent variables. Superrationality's status is contested: some see it as EDT with extreme correlation; others as a distinct equilibrium concept. There's no consensus on whether superrationality applies beyond symmetric games or how it handles uncertainty. I am unsure if superrationality can be formalized without symmetry. The unanimity case highlights the tension: superrationality demands certainty, but real agents might prefer lotteries for lower thresholds.
answer: |-
  ### The Scenario
  A neighborhood of \(N=100\) households faces a flooding risk. A levee can be built if at least \(T=100\) households each chip in \(C=\$50\). If built, the levee prevents \(\$1000\) in flood damage per household, regardless of contribution. The offer arrives anonymously by mail; no communication is possible. Households are similar (e.g., shared local norms) but not identical—individual factors (e.g., financial stability) create variation. Costs are sunk if the levee isn't built. Total cost if all contribute: \(\$5000\); total benefit: \(\$100,000\).

  ---

  ### What Each Theory Says
  - **Causal Decision Theory (CDT)**: Your contribution only matters if exactly 99 others contribute (probability \(1/100\)). If pivotal, you gain \(\$1000 - \$50 = \$950\). Otherwise, you lose \(\$50\). Expected gain: \((1/100) \times 950 - (99/100) \times 50 = -\$40\). **Stay out**.
  - **Evidential Decision Theory (EDT)**: Contributing raises the probability of success by \(1/100\) (due to latent correlation; see *Stress Test*). Expected utility of contributing: \(P(\text{success} \mid \text{you contribute}) \times 1000 - 50\). The evidential difference is bounded: \(P(\text{success} \mid \text{you contribute}) - P(\text{success} \mid \text{you abstain}) \leq 1/100\). Thus, net gain \(\leq (1/100) \times 1000 - 50 = -\$40\). **Stay out**.
  - **Superrationality**: All reason identically, so all contribute or none do. If all contribute, payoff is \(\$1000 - \$50 = \$950\). If none do, payoff is \(\$0\). \(\$950 > \$0\), so **send it**. Randomization (e.g., a shared lottery) reduces expected utility below \(\$950\) for \(T=100\) (see *Why the Lure Runs Backwards*).
  - **Functional Decision Theory (FDT)**: Treats your decision as a blueprint for similar agents. If your "blueprint" contributes, all likely do, yielding \(\$950\). If not, \(\$0\). **Send it**. (But FDT is less standardized here; some variants may waver.)

  ---

  ### Why the Lure Runs Backwards
  In Platonia/Luring Lottery, superrationality restrains individualism to avoid duplication/dilution. Here, the unanimity threshold (\(T=N\)) flips the incentive: *abstention* risks collective failure. Sending the letter isn't greedy—it's pivotal to enabling the good. Randomization fails because near-certain provision requires near-unanimity, costing almost as much as full contribution but without the guarantee (e.g., lottery with \(p<1\) risks failure and saves little).

  ---

  ### Stress Test
  - **Perfect correlation**: With identical agents, EDT flips: \(P(\text{success} \mid \text{you contribute}) = 1\), so gain \(= \$950\). CDT remains "stay out" (pivotality still \(1/100\)).
  - **Lower threshold**: Set \(T=90\). CDT/EDT still say "stay out" if \(C > V/N\) (here \(\$50 > \$10\)). But superrationality may prefer a lottery: e.g., \(p=0.95\) gives expected utility \(\approx \$947\) vs. \(\$950\) for full contribution—close, but deterministic still wins if valued.
  - **Small \(N\)**: For \(N=2\), \(T=2\), \(V=\$1000\), set \(C=\$600 > V/2\). CDT/EDT: gain \(= (1/2)(400) - (1/2)(600) = -\$100\) → **stay out**. Superrationality: both contribute \(\rightarrow \$400 > \$0\) → **send it**.

  **Robustness**: CDT/EDT say "stay out" if \(C > V/N\). Holds for \(N \geq 10\) and \(C/V > 1/N\) (e.g., \(C=\$120\), \(V=\$1000\), \(N=100\)).

  ---

  ### How a Superrationalist Fights Back
  Superrationality assumes perfect symmetry in reasoning, but real agents aren't identical. The latent variable model already captures correlation for EDT; superrationality adds nothing but an arbitrary coordination assumption. Unanimity thresholds are rare—why not set \(T < N\) and use a lottery? This case rigs the game by making the threshold extreme and ignores that superrationality lacks a unique solution when agents differ. It’s EDT in disguise, not a distinct principle.

  ---

  ### Settled vs Contested
  **Settled**: There is broad agreement that (1) CDT ignores correlation, (2) EDT accounts for it via conditioning, and (3) both recommend "stay out" here. **Contested**: Whether superrationality is coherent beyond symmetric games or is just EDT with strong correlation. Some (e.g., Yudkowsky) see it as a distinct Nash-like equilibrium; others (e.g., Harper) dismiss it as underdefined. I’m unsure if it can be formalized without symmetry. The bigger rift: EDT defenders argue correlation is *learned*, while superrationalists impose it *axiomatically*. This case exposes that divide—no consensus exists.
