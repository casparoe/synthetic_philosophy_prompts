  We are going to design a collective action problem where:
  - The good is public and non-excludable: it benefits everyone in the group if provided, regardless of individual contribution.
  - The provision rule: the good is provided if at least T out of N people contribute (pay a cost C).
  - Each contributor pays a cost C. If the good is provided, every member of the group gets a benefit V (including non-contributors).

  We want:
  1. CDT says: do not contribute (because your contribution is unlikely to be pivotal).
  2. EDT says: do not contribute (even though your contributing is evidence that others are contributing, but the evidence isn't strong enough to make it worthwhile).
  3. Superrationality says: contribute (and do so without randomization).

  Constraints:
  - The correlation between agents is due to a shared latent variable (e.g., similar thinking, similar circumstances) but not perfect copies.

  Let's set up the numbers:

  Let N be the number of agents (large enough so that individual pivotality is low).
  Let T be the threshold (the minimum number of contributions needed to provide the good).
  Let C be the cost to contribute.
  Let V be the benefit each receives if the good is provided.

  We require that:
  - Without the threshold, the total benefit if all contribute is N*V, and the total cost is N*C. We assume V > C so that if everyone contributes, it's efficient. But we have a threshold so that if at least T contribute, the good is provided.

  We want the expected utility calculations to yield the desired verdicts.

  CDT:
  - CDT looks at the causal effect of my action. I am pivotal only if exactly T-1 others contribute. Then, if I contribute, I cause the good to be provided (and I pay C). The benefit to me is V, so net gain: V - C. But the probability of being pivotal (exactly T-1 others contribute) is very small (especially if N is large and T is around the middle or high). The cost C is paid regardless. So the expected net gain from contributing is: [Pr(pivotal)]*(V - C) + [Pr(not pivotal and good provided anyway)]*(-C) + [Pr(not pivotal and good not provided)]*(-C). This is negative if Pr(pivotal) is low and V-C is not extremely high.

  EDT:
  - EDT conditions on the action I take. If I contribute, that is evidence that others are more likely to contribute (because of the shared latent variable). But we need to set the parameters so that even conditioning on me contributing, the expected utility of contributing is less than not contributing.

  Superrationality:
  - Superrationality (in Hofstadter's sense) assumes that all agents use the same reasoning and will come to the same conclusion. So they all contribute or all don't. Then, if they all contribute, the good is provided and each gets V - C. If they all don't, they get 0. Since V > C, they all prefer to contribute. Hence, they contribute.

  But note: we are not allowed perfect correlation. So we need a model of correlation.

  We model the shared latent variable as a variable θ that affects the probability that an agent contributes. Let θ be a random variable (say, uniformly distributed between 0 and 1). Then, conditional on θ, each agent contributes with probability θ. The agents are independent conditional on θ.

  Now, we set T and V, C such that:

  For EDT: 
  - Let A be the event that I contribute. Then, the expected utility of contributing is:
    E[U | A] = P(good is provided | A) * V - C
  - The expected utility of not contributing is:
    E[U | not A] = P(good is provided | not A) * V

  We want E[U | A] < E[U | not A] even though conditioning on A increases the probability that the good is provided.

  How to compute P(good provided | A) and P(good provided | not A)?

  Conditional on θ, the number of other contributors (excluding me) is Binomial(N-1, θ). So:

  P(good provided | A, θ) = P(at least T-1 others contribute | θ)   [because I contribute, so total contributions = 1 + others]
  P(good provided | not A, θ) = P(at least T others contribute | θ)

  Then, we integrate over θ (which has density f(θ)=1 on [0,1]):

  P(good provided | A) = ∫ P(at least T-1 in Binomial(N-1,θ)) dθ
  P(good provided | not A) = ∫ P(at least T in Binomial(N-1,θ)) dθ

  We want:
  [ P(good provided | A) * V - C ] < [ P(good provided | not A) * V ]

  That is:
  C > V * [ P(good provided | A) - P(good provided | not A) ]

  The term [P(good provided | A) - P(good provided | not A)] is the increase in the probability of provision due to my contribution (from an evidential perspective). We need this difference to be small enough that C is greater than V times that difference.

  Note that the difference P(good provided | A) - P(good provided | not A) is equal to the integral over θ of [ P(exactly T-1 others | θ) ] because:

  P(at least T-1 | θ) - P(at least T | θ) = P(exactly T-1 | θ)

  So:
  P(good provided | A) - P(good provided | not A) = ∫ P(exactly T-1 in Binomial(N-1, θ)) dθ

  This integral is the expected value (over θ) of the probability that exactly T-1 others contribute. This is the same as the probability (over θ and the binomial) of exactly T-1 successes in N-1 trials with a random θ. This is equal to 1/(N) [because it is the probability that T-1 successes and (N-1)-(T-1)=N-T failures, and integrating over θ uniform, it's the same as the probability in a Polya-Eggenberger urn with one success and one failure, which is 1/(N)].

  Actually, we have:
  ∫_0^1 binom(N-1, T-1) θ^{T-1} (1-θ)^{N-T} dθ = Beta(T, N-T+1) / Beta(T-1+1, N-T+1) ??? 

