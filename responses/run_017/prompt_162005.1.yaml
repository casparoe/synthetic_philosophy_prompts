  So:
  ∫ binom(N-1, T-1) θ^{T-1} (1-θ)^{N-T} dθ = binom(N-1, T-1) * Beta(T, N-T+1) 
  = [ (N-1)! / ((T-1)! (N-T)! ) ] * [ (T-1)! (N-T)! ) / (N)! ] 
  = (N-1)! / (N)! 
