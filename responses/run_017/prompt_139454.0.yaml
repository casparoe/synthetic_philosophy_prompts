prompt: |-
  You are drafting the joint statement of an adversarial collaboration between two research programmes on the nature, persistence, and change of social norms. Both programmes are characterised below; treat these characterisations as the only commitments either side has, so that every argument in the document is reconstructible from what is given here plus ordinary conceptual analysis. Do not cite, allude to, or name any published work, author, or experiment; the document must stand on its own without any bibliography or reference list.

  Camp A, the equilibrium camp (Lewisian in spirit), holds that the core case of a social norm is a convention: a regularity of behaviour in a recurrent situation that persists because it is a coordination equilibrium, together with the expectations and common knowledge that go with it. Conventions need not be optimal, only self-enforcing; their arbitrariness is shown by the existence of equally serviceable alternatives; their apparent normative force is explained by the preferences and expectations participants have, including preferences about conformity and about sanctioning. Norm change is best modelled as movement between equilibria, driven by changes in the payoff structure and by shifts in salience.

  Camp B, the sanction-and-transmission camp, holds that the core case of a social norm is a regularity sustained by empirical expectations about what others do and normative expectations about what others approve of, backed by actual or anticipated sanctioning, and that its content and spread are shaped by population-level cultural transmission: conformist copying, prestige bias, and threshold dynamics. On this view many socially central norms are not solutions to coordination problems at all, predictions about persistence and change require transmission dynamics rather than payoff structure alone, and the equilibrium camp's claim to cover all norms depends on loading sanctions into the preferences, which makes it hard to test.

  The collaboration is organised around the following stipulated body of field data, which both camps accept as accurately described. Two hamlets face each other across a river, linked for generations by a single ferry. The long-standing regularity is that the ferry waits ten minutes past the hour for latecomers, and everyone plans arrivals around it; no one has ever been fined, excluded, or formally criticised for the ferry schedule, and there is no authority enforcing it. In year 0 a bridge opens two kilometres upstream: crossing by bridge is faster and cheaper for every resident whatever anyone else does, so continued ferry use is not an equilibrium given residents' actual preferences. In years 1 to 3, 41 per cent of crossings are still made by ferry. Interviewed ferry users overwhelmingly say that people here use the ferry. Seventy-one per cent of all residents assert that most others would think less of someone who abandoned the ferry, while 4 per cent say that they themselves would think less of such a person; no instance of criticism, refusal of service, or exclusion of a bridge user has been recorded. In year 2 researchers post the true survey results, including the absence of any recorded sanctioning, on the notice boards of both hamlets. Ferry use falls to 22 per cent within six weeks and then flattens, remaining at 22 per cent for the following two years. The residual users are disproportionately the two oldest boat owners, the people others describe as the ones who know the river. Separately, within days of the bridge opening and with no agreement and no enforcement, a new regularity appears in which everyone parks on the north side, although the south side is equally accessible; it is first adopted by three households whose heads are the people most often named as those others take their lead from.

  Use the term phantom-equilibrium regularity, which the collaborators agree to stipulate, for a behavioural regularity that is stable only because participants hold false beliefs: in the belief-phantom variant, false beliefs about others' preferences; in the sanction-phantom variant, false beliefs about others' willingness to sanction, where in fact no one would sanction.

  Produce the joint statement in four parts.

  First, a numbered section of agreed claims: the propositions both camps can sign about what an account of norms has to explain, about what the hamlet data do and do not show, about which features of the case are non-diagnostic because both accounts predict them, and about how each term is being used. Each claim must be substantive enough that a competent outsider could imagine it being false.

  Second, a disagreements table with one row per residual disagreement and columns for the issue, Camp A's formulation of its own position in wording a partisan of Camp A would sign without hedging, Camp B's formulation of its own position in wording a partisan of Camp B would sign without hedging, and an assessment of whether the disagreement is genuine or merely verbal, with a one-sentence reason. Include at least the following issues: whether the ferry regularity in years 1 to 3 is a convention, a norm of some other kind, or neither; whether the 22 per cent plateau is a phantom-equilibrium regularity, and if so of which variant; whether loading sanctions and conformity into the preferences is legitimate modelling or an immunity manoeuvre; whether the north-side parking regularity is best explained by salience or by prestige-biased transmission; and whether the distinction between conventions and sanction-backed norms is a difference in kind or a difference in the mechanism that holds a regularity in place.

  Third, a cruxes section. Identify at least four sub-questions such that settling one would move at least one camp. For each crux, give the sub-question, a further study or argument in the hamlets that both camps agree would bear on it and that does not require any external literature, Camp A's prediction stated in advance with the magnitude or direction it commits to, Camp B's prediction likewise, and a note of what result would move which side and by how much. Where both camps predict the same observable outcome but for different reasons, say so explicitly and record the mediating variable that would discriminate between them.

  Fourth, two short closing subsections: which parts of the original dispute have dissolved into questions about words, and why; and what each camp would count as evidence against its own view, including where each camp expects itself to be wrong.

  Constraints on the drafting: define every technical term at the point of use; do not attribute to either camp a claim it would disown for the sake of symmetry; avoid formulations that are true but vacuous; and keep the whole document such that both camps could put their names to it while continuing to disagree.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps on social norms. The camps are characterized as follows:

  - Camp A (equilibrium camp): Core case is a convention as a coordination equilibrium, self-enforcing, with expectations and common knowledge. Change is movement between equilibria driven by payoff changes and salience shifts.

  - Camp B (sanction-and-transmission camp): Core case is a regularity sustained by empirical and normative expectations, backed by sanctioning, and shaped by cultural transmission (conformist copying, prestige bias, thresholds). Persistence and change depend on transmission dynamics, not just payoffs.

  They have a shared case study (the hamlets) and a stipulated term: "phantom-equilibrium regularity" (with belief-phantom and sanction-phantom variants).

  The joint statement has four parts:

  1. Agreed claims (numbered section): Propositions both camps can sign about what an account of norms must explain, about the hamlet data, non-diagnostic features, and definitions.

  2. Disagreements table: One row per disagreement, with columns: issue, Camp A's position (partisan wording), Camp B's position (partisan wording), and assessment (genuine or verbal, with reason).

     Issues must include:
     - Whether the ferry regularity in years 1-3 is a convention, another norm, or neither.
     - Whether the 22% plateau is a phantom-equilibrium and which variant.
     - Whether loading sanctions/conformity into preferences is legitimate or an immunity manoeuvre.
     - Whether north-side parking is best explained by salience or prestige-biased transmission.
     - Whether the convention/sanction-backed norm distinction is a kind difference or mechanism difference.

  3. Cruxes section: At least four sub-questions. For each:
     - The sub-question.
     - A further study or argument in the hamlets that both agree would bear on it (no external literature).
     - Camp A's prediction (with magnitude/direction).
     - Camp B's prediction (with magnitude/direction).
     - Note on what result would move which side and by how much. If both predict same outcome for different reasons, record the mediating variable.

  4. Closing subsections:
     a. Which parts of the dispute have dissolved into questions about words and why.
     b. What each camp would count as evidence against its own view, including where each expects to be wrong.

  Constraints:
  - Define technical terms at point of use.
  - Do not attribute claims that a camp would disown.
  - Avoid vacuous truths.
  - Keep it signable by both while they disagree.

  Let's structure the response accordingly.

  ### Part 1: Agreed Claims

  We list numbered claims that both camps agree on.

  1. **Definition of core cases**: Both camps agree that any account of social norms must be able to explain at least two core cases: (a) conventions, which are self-enforcing regularities in coordination equilibria, and (b) sanction-backed regularities, which are sustained by expectations of approval/disapproval and potential sanctions.

  2. **Hamlet data: Initial ferry regularity (pre-bridge)**: The pre-bridge ferry waiting regularity (ten minutes past the hour) is a clear case of a convention. It was a coordination equilibrium: everyone planned around it, and it persisted without sanctions or authority.

  3. **Hamlet data: Post-bridge ferry use (years 1-3)**: In years 1-3, 41% of crossings were by ferry despite the bridge being faster and cheaper for every resident regardless of others' actions. This regularity cannot be explained as a coordination equilibrium because continued ferry use is not an equilibrium given residents' actual preferences (since each resident would prefer to use the bridge if others do, and also if others don't, because it is faster and cheaper).

  4. **Hamlet data: Expectations in years 1-3**: 
     - Empirical expectations: Ferry users overwhelmingly reported that "people here use the ferry" (indicating a belief in a behavioral regularity).
     - Normative expectations: 71% of residents asserted that most others would think less of someone who abandoned the ferry, but only 4% said they themselves would think less of such a person. There was no recorded sanctioning.

  5. **Hamlet data: Effect of information intervention**: When researchers posted the true survey results (including the absence of recorded sanctioning) in year 2, ferry use dropped to 22% within six weeks and remained there for two years. This shows that the expectations (both empirical and normative) were influencing behavior, and that correcting false beliefs changed behavior.

  6. **Hamlet data: Residual ferry users**: The 22% residual users were disproportionately the two oldest boat owners, described by others as "the ones who know the river". This suggests that their continued use may be due to factors other than the norm (e.g., expertise, identity).

  7. **Hamlet data: North-side parking**: After the bridge opening, a new regularity emerged without agreement or enforcement: everyone parked on the north side, even though the south side was equally accessible. It was first adopted by three households whose heads were the people most often named as those others take their lead from.

  8. **Non-diagnostic features**: Both camps agree that the following features do not distinguish between their accounts because both predict them:
     - The persistence of the ferry regularity for three years after the bridge opening (Camp A: due to inertia or salience; Camp B: due to transmission dynamics and false expectations).
     - The drop in ferry use after the information intervention (Camp A: correction of false beliefs about the equilibrium; Camp B: correction of false empirical and normative expectations).
     - The formation of a new regularity (north-side parking) without explicit agreement (Camp A: due to salience; Camp B: due to prestige-biased transmission).

  9. **Phantom-equilibrium regularity**: Both camps agree to use the term "phantom-equilibrium regularity" for a behavioral regularity that is stable only because participants hold false beliefs. In the belief-phantom variant, the false beliefs are about others' preferences (e.g., that others prefer the ferry). In the sanction-phantom variant, the false beliefs are about others' willingness to sanction (e.g., that others would sanction bridge use), when in fact no one would sanction.

  10. **Role of preferences and expectations**: Both camps agree that preferences and expectations (empirical and normative) are important in explaining norm persistence and change, but they disagree on the relative primacy and the mechanisms by which they operate.

  ### Part 2: Disagreements Table

  We use a table format. Since we are in text, we'll present it as a list with columns.

  | Issue | Camp A's Position | Camp B's Position | Assessment (genuine/verbal; reason) |
  |-------|-------------------|-------------------|-------------------------------------|
  | **1. Whether the ferry regularity in years 1-3 is a convention, a norm of some other kind, or neither.** | Camp A: The ferry regularity in years 1-3 is not a convention because it is not a coordination equilibrium (since each resident prefers the bridge regardless of what others do). However, it is a norm of a different kind: a phantom-equilibrium regularity (belief-phantom variant) where false beliefs about others' preferences (that others prefer the ferry) sustain the behavior. | Camp B: The ferry regularity in years 1-3 is a social norm sustained by empirical expectations (that people use the ferry) and normative expectations (that most others would disapprove of abandoning the ferry), but it is not backed by actual sanctions (as none occurred). It is a norm, but not a convention. | Genuine; because Camp A classifies it as a phantom-equilibrium (a type of norm) due to false beliefs about preferences, while Camp B classifies it as a norm due to expectations (even without sanctions) and emphasizes the transmission dynamics. |
  | **2. Whether the 22 per cent plateau is a phantom-equilibrium regularity, and if so of which variant.** | Camp A: The 22% plateau is not a phantom-equilibrium regularity because it is not a stable behavioral regularity sustained by false beliefs. Instead, it is a non-normative behavior driven by the residual preferences of a subgroup (e.g., the boat owners) who have expertise-related reasons to use the ferry. | Camp B: The 22% plateau is a phantom-equilibrium regularity (belief-phantom variant) because the residual users hold false beliefs about others' preferences (e.g., that others still prefer the ferry or that it is still the norm) despite the information intervention. | Genuine; because Camp A sees the residual use as non-normative and driven by individual preferences, while Camp B sees it as a norm sustained by false beliefs. |
  | **3. Whether loading sanctions and conformity into the preferences is legitimate modelling or an immunity manoeuvre.** | Camp A: Including sanctions and conformity in the preferences is a legitimate modelling choice because it accurately captures the fact that people have preferences over others' behavior and over being sanctioned; this allows for a unified equilibrium account of norms. | Camp B: Loading sanctions and conformity into the preferences is an immunity manoeuvre because it makes the equilibrium account unfalsifiable by explaining any behavior as an equilibrium, and it obscures the role of cultural transmission and the actual psychology of norm compliance. | Genuine; because it concerns the methodological adequacy and testability of the theories. |
  | **4. Whether the north-side parking regularity is best explained by salience or by prestige-biased transmission.** | Camp A: The north-side parking regularity is best explained by salience: the north side became salient (perhaps because it was first used by the influential households) and then became a focal point for coordination. | Camp B: The north-side parking regularity is best explained by prestige-biased transmission: the three households who first adopted it were prestigious (others took their lead), leading to rapid adoption by others via imitation. | Genuine; because the camps differ on the causal mechanism (salience vs. transmission). |
  | **5. Whether the distinction between conventions and sanction-backed norms is a difference in kind or a difference in the mechanism that holds a regularity in place.** | Camp A: The distinction is one of mechanism but not of kind: both are equilibria, but conventions are coordination equilibria without sanctions, while sanction-backed norms are equilibria where sanctions are part of the payoff structure (via preferences). | Camp B: The distinction is a difference in kind: conventions are solutions to coordination problems, while sanction-backed norms are maintained by the threat of sanctions and have different transmission dynamics. | Genuine; because it concerns the fundamental ontology of norms. |

  ### Part 3: Cruxes Section

  We present at least four cruxes. For each:

  - Sub-question
  - Proposed study in hamlets (no external literature)
  - Camp A's prediction (with magnitude/direction)
  - Camp B's prediction (with magnitude/direction)
  - Note on what would move which side.

  **Crux 1: Role of normative expectations in sustaining the ferry regularity in years 1-3.**

  - **Sub-question**: Do residents' beliefs about what others approve of (normative expectations) or their beliefs about what others prefer (preferences) primarily sustain the ferry regularity?
  - **Study**: Conduct a survey in year 1-3 (before the information intervention) asking residents: (a) their belief about the proportion of others who prefer using the ferry (on a scale of 0-100%), (b) their belief about the proportion of others who would think less of someone who uses the bridge (normative expectation). Then, after the information intervention that corrected both, measure the change in ferry use.
  - **Camp A's prediction**: The drop in ferry use after the intervention is primarily driven by correcting false beliefs about others' preferences (belief-phantom). Therefore, if the intervention only corrected beliefs about preferences (without mentioning normative expectations), ferry use would drop significantly (to around 22% or lower). If it only corrected normative expectations, the drop would be minimal.
  - **Camp B's prediction**: The drop is driven by correcting both empirical and normative expectations. Therefore, even if only normative expectations are corrected (by revealing that only 4% would personally think less of bridge users), ferry use would drop significantly (to around 22% or lower). Correcting only preference beliefs would have a smaller effect.
  - **Note**: Both camps predict a drop after full correction, but they differ on the mediating variable. If correcting only normative expectations causes a large drop, Camp B is supported; if not, Camp A is supported. A result showing that normative expectation correction alone causes a large drop would move Camp B toward their view and challenge Camp A's belief-phantom account. Conversely, if preference belief correction alone causes a large drop and normative correction does not, Camp A is supported.

  **Crux 2: Mechanism of the north-side parking regularity.**

  - **Sub-question**: Did the north-side parking spread because of salience (as a focal point) or because of prestige-biased transmission?
  - **Study**: In a new context (e.g., after a flood that requires temporary parking on a different street), introduce two equally accessible parking areas. Then, have two different influential individuals (one high-prestige, one not) start parking in different areas. Observe which area becomes the new regularity and how quickly.
  - **Camp A's prediction**: The area that becomes the regularity will be the one that is made salient (e.g., by being the first used by any individual, or by being the one with a minor salient feature). Prestige of the first user will not matter; salience will drive the choice.
  - **Camp B's prediction**: The area chosen by the high-prestige individual will become the regularity quickly, and others will follow that individual due to prestige bias, regardless of salience.
  - **Note**: If the high-prestige individual's choice dominates even without salience, Camp B is supported. If salience (e.g., being the first area used) dominates regardless of prestige, Camp A is supported.

  **Crux 3: Persistence of the 22% ferry use after information intervention.**

  - **Sub-question**: Are the residual ferry users (22%) motivated by false beliefs (phantom-equilibrium) or by non-normative factors (e.g., expertise, habit, or identity)?
  - **Study**: Conduct in-depth interviews with the residual users to ask their reasons for using the ferry. Also, test their beliefs: do they think others still use the ferry? Do they think others would disapprove of bridge use? Then, provide personalized information to correct any false beliefs and observe if they switch.
  - **Camp A's prediction**: Residual users have accurate beliefs (they know ferry use is low and no one sanctions) but continue due to non-normative factors (e.g., they are boat owners with expertise). Correcting false beliefs will not change their behavior.
  - **Camp B's prediction**: Residual users hold false beliefs (e.g., they overestimate others' use or disapproval). Correcting these beliefs will cause some to switch, reducing ferry use below 22%.
  - **Note**: If correcting beliefs does not reduce ferry use, Camp B is challenged. If it does, Camp A must adjust (e.g., accept a phantom-equilibrium at 22%). Camp B would be moved by a reduction; Camp A by no reduction.

  **Crux 4: Emergence of norms without coordination benefits.**

  - **Sub-question**: Can a new behavioral regularity emerge and persist without being a coordination equilibrium and without sanctions?
  - **Study**: Introduce a novel, arbitrary behavior (e.g., wearing a colored wristband) in the hamlets. Have prestigious individuals adopt it and see if it spreads. Then, check if it persists even when it has no coordination benefits and no sanctions are applied.
  - **Camp A's prediction**: Without being a coordination equilibrium (i.e., without mutual benefits from coordination) and without sanctions, the behavior will not persist as a regularity. It may spread initially due to prestige, but then die out.
  - **Camp B's prediction**: The behavior can persist due to cultural transmission (e.g., conformist bias) even without coordination benefits or sanctions, as long as empirical expectations (that others do it) are formed.
  - **Note**: If the behavior persists (e.g., after the prestigious individuals stop), Camp B is supported. If it dies out, Camp A is supported.

  ### Part 4: Closing Subsections

  a. **Dissolved verbal disputes**: The collaborators agree that the following disputes are partly verbal: the definition of a "norm" and whether it requires sanctions. Camp A uses a broader definition that includes conventions and phantom-equilibria without sanctions, while Camp B requires normative expectations (which may or may not involve sanctions). This is verbal because it hinges on the scope of the term "norm". Also, the term "convention" is defined differently: Camp A restricts it to coordination equilibria, while Camp B often uses it more loosely. The collaborators agree to use precise definitions to avoid these verbal disputes.

  b. **Evidence against each camp's view**:
     - **Camp A** would count as evidence against their view the persistent emergence and stability of a behavioral regularity that is not an equilibrium (i.e., where there is a strictly dominant strategy that is not followed, and no sanctions) and where transmission dynamics (like prestige bias) are the primary driver. They expect to be wrong in cases where preferences are not the main driver of behavior.
     - **Camp B** would count as evidence against their view the persistent stability of a regularity without any expectations (empirical or normative) and without transmission biases, but solely due to its being a coordination equilibrium with common knowledge. They expect to be wrong in pure coordination cases where transmission plays no role beyond establishing the focal point.

  This joint statement is drafted such that both camps can sign it while continuing to disagree on the identified points.
answer: |-
  ### Joint Statement on the Nature, Persistence, and Change of Social Norms  
  **Adversarial Collaboration between Camp A (Equilibrium Camp) and Camp B (Sanction-and-Transmission Camp)**  

  #### 1. Agreed Claims  
  Both camps endorse the following substantive propositions, each falsifiable by a competent outsider:  

  1. **Core Explananda**: Any account of social norms must explain:  
     - How behavioral regularities emerge, persist, and change.  
     - Why individuals comply with regularities even when instrumental incentives (e.g., payoffs) suggest deviation.  
     - The roles of *empirical expectations* (beliefs about what others do) and *normative expectations* (beliefs about what others approve of or expect one to do).  

  2. **Pre-Bridge Ferry Regularity**: The pre-bridge ten-minute waiting rule was a convention:  
     - It was a *coordination equilibrium* (a stable outcome where no individual benefits from unilateral deviation, given others' actions).  
     - It persisted without sanctions or authority due to common knowledge and mutual expectations.  

  3. **Post-Bridge Ferry Use (Years 1–3)**: The 41% ferry usage cannot be explained as a coordination equilibrium:  
     - The bridge dominated the ferry in speed and cost for every resident irrespective of others’ choices, making ferry use non-equilibrium given actual preferences.  

  4. **Expectations in Years 1–3**:  
     - *Empirical expectations* were inaccurate: Ferry users falsely believed most people used the ferry.  
     - *Normative expectations* were inflated: Residents overestimated peer disapproval of bridge use (71% attributed disapproval to others; 4% admitted personal disapproval).  
     - No sanctions occurred, confirming the absence of enforcement.  

  5. **Information Intervention Effect**: Posting survey results (year 2) corrected false expectations and caused ferry use to drop to 22%. This demonstrates that beliefs (empirical/normative) sustained the initial 41% regularity.  

  6. **Residual Ferry Use (22%)**: Non-normative factors (e.g., expertise, identity of "river-knowing" boat owners) likely explain the plateau, as it persisted without expectations of widespread use or sanctioning.  

  7. **North-Side Parking Emergence**: The new parking regularity:  
     - Arose spontaneously without agreement, enforcement, or coordination benefits (both sides are equally accessible).  
     - Was initiated by high-status individuals ("those others take their lead from").  

  8. **Non-Diagnostic Features**: Both camps predict and thus cannot distinguish via:  
     - Post-bridge persistence of ferry use (Years 1–3): Camp A attributes this to residual salience; Camp B to transmission inertia.  
     - Post-intervention drop in ferry use: Both attribute it to corrected beliefs.  
     - Spontaneous emergence of parking regularity: Both allow for rapid adoption without formal agreement.  

  9. **Terminology**:  
     - *Phantom-equilibrium regularity*: A behavioral regularity stable only due to false beliefs.  
       - *Belief-phantom variant*: False beliefs about others’ preferences.  
       - *Sanction-phantom variant*: False beliefs about others’ willingness to sanction.  
     - *Coordination equilibrium*: A situation where no individual gains from deviating unilaterally.  
     - *Salience*: A feature that makes one outcome stand out as a focal point for coordination.  
     - *Prestige-biased transmission*: Adoption of behaviors by copying high-status individuals.  

  ---  

  #### 2. Disagreements Table  
  | Issue | Camp A's Position (Unhedged) | Camp B's Position (Unhedged) | Genuine or Verbal? | Reason |  
  |-------|------------------------------|------------------------------|-------------------|--------|  
  | **Ferry regularity (Years 1–3): Convention, other norm, or neither?** | It is a *belief-phantom equilibrium*: A norm sustained by false beliefs about others' preferences (e.g., that others prefer the ferry), not a convention (which requires a true coordination equilibrium). | It is a *social norm*: Sustained by empirical and normative expectations (even if inflated), but not a convention (which solves coordination problems). | Genuine | Camp A denies norm status without equilibrium; Camp B affirms it via expectations. |  
  | **22% plateau: Phantom-equilibrium, and if so, which variant?** | Not phantom: Residual use reflects non-normative individual preferences (e.g., expertise), not beliefs. | *Belief-phantom*: Stable due to residual users’ false beliefs (e.g., that others still prefer the ferry). | Genuine | Camp A sees no norm; Camp B sees norm sustained by false beliefs. |  
  | **Loading sanctions/conformity into preferences: Legitimate or immunity manoeuvre?** | Legitimate: Preferences include desires for conformity/sanctioning, making norms reducible to equilibria in payoffs. | Immunity manoeuvre: It renders the equilibrium account untestable by explaining any regularity as "preferences," ignoring transmission. | Genuine | Camp A sees unification; Camp B sees evasion of transmission dynamics. |  
  | **North-side parking: Salience or prestige-bias?** | Salience: The north side became focal (e.g., via high-status users), solving a spontaneous coordination problem. | Prestige-biased transmission: High-status individuals were copied, spreading the regularity via cultural transmission. | Genuine | Differing mechanisms: coordination vs. social learning. |  
  | **Conventions vs. sanction-backed norms: Difference in kind or mechanism?** | Mechanism only: Both are equilibria; conventions lack sanctions, while sanction-backed norms incorporate them in payoffs. | Kind: Conventions solve coordination problems; sanction-backed norms require enforcement and distinct transmission. | Genuine | Camp A unifies via preferences; Camp B separates via function/emergence. |  

  ---  

  #### 3. Cruxes  
  Settling these sub-questions would shift at least one camp’s position. Proposed studies use only hamlet data.  

  **Crux 1: What sustains the ferry regularity in Years 1–3?**  
  - **Sub-question**: Are inflated *normative expectations* (disapproval beliefs) necessary to sustain the 41% usage, or do *false empirical expectations* (usage beliefs) suffice?  
  - **Study**: Before the intervention, survey a subgroup on: (i) beliefs about ferry usage (% who use it), (ii) beliefs about peer disapproval (% who would think less of bridge users). Then, correct *only* empirical expectations (usage) for half, and *only* normative expectations (disapproval) for the other half. Measure ferry-use change.  
  - **Camp A’s prediction**: Usage drops significantly only when empirical expectations are corrected (to ~22%). Normative correction has negligible effect.  
  - **Camp B’s prediction**: Both corrections cause significant drops (to ~30–35% each), as both expectations sustain norms.  
  - **Discriminatory outcome**: If normative correction alone causes a large drop, Camp B gains support (norms require normative expectations). If only empirical correction matters, Camp A gains (belief-phantom suffices).  

  **Crux 2: Is the 22% plateau belief-driven?**  
  - **Sub-question**: Do residual ferry users hold false beliefs about peer preferences or usage?  
  - **Study**: Interview residual users (22%) on: (i) estimated % of peers using ferry, (ii) estimated % who prefer ferry. Then provide accurate data and monitor usage shifts.  
  - **Camp A’s prediction**: No significant drop; users cite non-belief reasons (e.g., "I know the river").  
  - **Camp B’s prediction**: Usage drops below 22% (e.g., to 10–15%) after belief correction.  
  - **Discriminatory outcome**: A drop supports Camp B (phantom-equilibrium); no drop supports Camp A (non-normative behavior).  

  **Crux 3: How does north-side parking spread?**  
  - **Sub-question**: Does adoption depend on prestige bias (copying high-status individuals) or salience (focal points)?  
  - **Study**: Introduce two new parking zones (equal accessibility). Have a high-status individual use Zone A and a low-status one use Zone B. Track which zone becomes dominant.  
  - **Camp A’s prediction**: Zone usage splits; neither dominates unless one zone has salience (e.g., proximity).  
  - **Camp B’s prediction**: Zone A (high-status) dominates rapidly via prestige bias.  
  - **Discriminatory outcome**: High-status dominance supports Camp B; split/no pattern supports Camp A.  

  **Crux 4: Can a non-equilibrium regularity persist without normative expectations?**  
  - **Sub-question**: Will a neutral, non-coordination behavior (e.g., "place blue flags on doors") spread and persist without prestige/salience?  
  - **Study**: Have researchers plant blue flags on their doors (no status/preference relevance). Track spontaneous adoption and persistence over six months.  
  - **Camp A’s prediction**: No adoption/persistence; non-equilibria require salience.  
  - **Camp B’s prediction**: Adoption via conformist bias (copying neighbors); low but stable persistence.  
  - **Mediating variable**: If adoption correlates with empirical expectations ("others do it"), Camp B is supported; if not, Camp A.  

  ---  

  #### 4. Closing Subsections  
  **a. Dissolved Verbal Disputes**:  
  Two disputes are now verbal:  
  - Whether "convention" applies *only* to coordination equilibria (Camp A) or *any* stable regularity (Camp B). Agreed to use "convention" only for coordination equilibria.  
  - Whether "norm" requires normative expectations (Camp B) or includes phantom cases (Camp A). Agreed to specify "sanction-backed norm" vs. "phantom-equilibrium" for clarity.  
  These dissolved because they hinge on definitions, not predictions about behavior.  

  **b. Evidence Against Own View**:  
  - **Camp A** would count as evidence against:  
    - A non-equilibrium regularity persisting without false beliefs (e.g., ferry-like case with no expectation errors).  
    - North-side parking spreading without salience (e.g., if arbitrary behaviors spread via transmission alone).  
    Camp A expects to be wrong in cases where transmission dynamics override payoff structures.  
  - **Camp B** would count as evidence against:  
    - A coordination equilibrium (e.g., pre-bridge ferry) failing to emerge despite salience.  
    - A sanction-backed norm persisting after normative expectations are falsified (e.g., if disapproval beliefs corrected but compliance continues).  
    Camp B expects to be wrong in "pure" coordination problems without cultural transmission.  

  ---  
  **Signed,**  
  Representatives of Camp A and Camp B  
  *(While retaining substantive disagreements)*
