  (1) In daily lab work, certain fundamentals (like decay constants) were never questioned during anomalies - always the sample or instrument got blamed. 
  (2) Yet scientists verbally affirmed all claims are revisable "in principle". 
  (3) Calibration loops exist (using theory to build instruments that test theory), which didn't trouble practitioners.

