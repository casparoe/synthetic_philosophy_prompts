prompt: |-
  I am writing the second chapter of a monograph on "information" in molecular biology, and before I score the existing accounts against each other I want the specification itself: what would a theory have to deliver for it to be literally true, and not merely a façon de parler, that DNA carries information — that the genetic code is a code?

  Fix the purpose as follows: the theory has to be strong enough to settle a live dispute rather than to paraphrase textbook talk. The dispute is whether the developmental-systems and niche-construction critics are right that "information" can be redistributed onto methylation marks, maternal cytoplasmic gradients, and features of the nest, or whether something about DNA specifically survives that parity argument.

  So give me the desiderata, each with the case or consideration that makes it a requirement rather than a taste. The cases I expect handled include: a degenerate mapping in which several codons specify one amino acid and translation cannot be run backwards from protein to sequence; a mapping that is nearly universal yet has variants, including organellar reassignments and the recoding of a stop codon into a twenty-first or twenty-second amino acid; the gap between the codon–amino-acid mapping and what a whole genome says, given that protein-coding sequence is a small fraction of a mammalian genome and that one stretch of sequence has different effects under alternative splicing, a shifted reading frame, or parent-of-origin imprinting; the gap between what a sequence says and what happens, as in misincorporation and frameshift; and templating that copies without coding, as in prion conformations. I also want the theory to say which of the available metaphors it is endorsing — code, template, program, blueprint, law — and why.

  Mark which requirements are non-negotiable and which are preferences of a camp; tell me which pair you suspect cannot be jointly satisfied, and which single requirement does the most work in excluding candidates. Skip the scorecard of named positions; I will do that myself.

  Last, and most important to me: say what would change your mind about the list. Which finding or argument would make you drop or demote a requirement you have called non-negotiable, and where is your reasoning about the unsatisfiable pair most likely to fail?
reasoning: |-
  We are looking for a theory of genetic information that can justify the claim that DNA literally carries information and that the genetic code is a code (not merely metaphorical). The theory must address challenges from developmental systems theory and niche construction, which argue that information is distributed across various factors (methylation, cytoplasmic gradients, etc.). The goal is to see if DNA has a unique role that survives these parity arguments.

  Key phenomena to account for:
  1. Degeneracy: Multiple codons for the same amino acid; no reverse mapping from protein to DNA sequence.
  2. Variability: Near-universality of the code with exceptions (e.g., in organelles, stop codon reassignments).
  3. Genome complexity: Only a small fraction of the genome codes for proteins; alternative splicing, reading frame shifts, imprinting.
  4. Errors and noise: Misincorporation, frameshifts.
  5. Non-coding templating: Prions (copying without coding).

  Metaphors to clarify: code, template, program, blueprint, law.

  Desiderata for the theory:

  1. **Non-negotiable: Causal specificity of DNA in determining linear sequence of gene products.**
     - Why: The central dogma (DNA -> RNA -> protein) establishes DNA as the template for the linear sequence of nucleotides in RNA and hence the sequence of amino acids in proteins. This is a unique role of DNA that is not shared by other factors (like methylation, which modifies expression but does not specify the sequence). Even with degeneracy, the codon sequence determines the amino acid sequence (with some exceptions due to errors). Without this, we lose the core idea of genetic information.

  2. **Non-negotiable: Arbitrariness of the genetic code.**
     - Why: The mapping between codons and amino acids is arbitrary (there is no chemical necessity that a particular codon must code for a particular amino acid). This is evidenced by the existence of variant codes (e.g., in mitochondria) and the possibility of engineered codes. This arbitrariness is a hallmark of a symbolic code. Other factors (like methylation patterns) may also be arbitrary, but they do not have the same kind of arbitrary mapping to a set of symbols (amino acids) that the genetic code does.

  3. **Non-negotiable: The code must be a mapping between two distinct molecular domains (nucleic acids and amino acids).**
     - Why: The genetic code is a mapping from a 4-letter alphabet (nucleotides) to a 20-letter alphabet (amino acids). This mapping is what makes it a code. Prion templating, for example, is not a code because it is a direct physical templating (like crystal growth) within the same molecular domain (proteins). DNA replication is templating without coding (it's copying, not coding). So the theory must require that the genetic code is a mapping between two different domains.

  4. **Negotiable (but important): Universality or near-universality of the code.**
     - Why: The near-universality of the genetic code (with some exceptions) is a strong argument for its fundamental role. However, the existence of variant codes (though rare) shows that it is not absolutely universal. This requirement might be relaxed to "systematicity" or "standardization" within a lineage. The fact that the code is shared across almost all life forms allows for horizontal gene transfer and is a key feature of the genetic system. But if we require absolute universality, then the exceptions would break it. Hence, near-universality (with variants being the exception) is acceptable.

  5. **Non-negotiable: The information must be under natural selection for fidelity of transmission and expression.**
     - Why: The genetic system has evolved mechanisms (e.g., proofreading, repair) to ensure that the information is transmitted and expressed with high fidelity. This distinguishes the genetic code from other causal factors that may be more noise-prone. The presence of errors (misincorporation, frameshifts) does not undermine this because they are exceptions and are often corrected or lead to malfunction (hence selected against). This requirement helps exclude cases where templating occurs without being under selection for fidelity (like prions in some contexts).

  6. **Negotiable: The capacity for combinatorial syntax and semantics.**
     - Why: DNA sequences have a combinatorial structure: the meaning (the protein produced) is a function of the sequence of codons. This allows for a vast number of messages. However, this is also true of some other systems (e.g., regulatory networks). So while it is a key feature, it might not be unique to DNA. But it is a strong point for the code metaphor.

  7. **Non-negotiable: The information in DNA must be distinct from the machinery that interprets it.**
     - Why: In the genetic code, the ribosome and tRNA are part of the interpretive machinery that is separate from the message (mRNA). This is a key feature of a code: the message and the interpreter are distinct. In prion templating, the same molecule serves as both template and product. This requirement ensures that DNA is a carrier of information that must be interpreted by separate machinery.

  8. **Handling genome complexity: The theory must account for non-coding regions and alternative splicing.**
     - Why: Only a fraction of the genome codes for proteins. The theory must explain why we attribute information to DNA even when much of it does not code for proteins. One way is to note that the protein-coding regions are the core informational part, and the non-coding regions may have regulatory functions (which are also informational but in a different way). Alternatively, the theory might extend the idea of coding to regulatory elements (which have sequence-specific binding). But the classic genetic code applies to protein-coding regions. This might require a broader notion of information, but we must not lose the specificity of the genetic code.

  9. **Handling errors: Misincorporation and frameshifts.**
     - Why: These errors do not undermine the informational view because they are deviations from the norm, and the system has evolved to minimize them. They are analogous to errors in communication.

  10. **Metaphor endorsement**: 
      - The theory should endorse "code" as the primary metaphor because of the arbitrary mapping between two domains (nucleic acids and amino acids). 
      - "Template" is secondary and applies to replication and transcription (copying of nucleic acids) but not to translation (which is coding). 
      - "Program" is acceptable if we think of the genome as containing instructions for development, but note that the program metaphor might imply a more centralized control than exists. 
      - "Blueprint" is problematic because it suggests a one-to-one mapping between the plan and the organism, which is not the case (due to epigenetics, environment). 
      - "Law" is not appropriate because the genetic code is arbitrary and contingent (like a language) rather than a law of nature.

  **Potential conflict**: 
  The requirement for **arbitrariness** and the requirement for **causal specificity** might be in tension with the existence of non-arbitrary aspects of the code (e.g., the code is not entirely arbitrary because it is optimized for error minimization). However, the fact that the code is optimized does not make it non-arbitrary; it just means that natural selection has fixed a particular arbitrary mapping that works well. So no conflict.

  But a more serious challenge might be the requirement of **causal specificity** versus the **distributed nature of development**. The critics argue that DNA is not uniquely specific because, for example, methylation patterns also carry specific information. However, the causal specificity of DNA is in the linear sequence of gene products. Methylation does not specify the sequence of amino acids; it affects when and where a gene is expressed. So the theory must draw a line between specifying the sequence (which DNA does) and regulating the expression (which involves other factors).

  **Which requirement does the most work?**
  The requirement of **arbitrariness** (Desideratum 2) does the most work in excluding candidates. It rules out physical templating (like in prions or crystal growth) and direct chemical causation. It also rules out any theory that cannot account for the symbolic nature of the genetic code.

  **Unsatisfiable pair?**
  We might worry that the requirement for **causal specificity** (Desideratum 1) and the requirement to **account for genome complexity** (Desideratum 8) cannot be jointly satisfied. How can DNA be causally specific for the linear sequence when alternative splicing means that one DNA sequence can yield multiple proteins? And when non-coding DNA is the majority? 

  However, note that in alternative splicing, the DNA sequence still specifies the set of possible exons and their order, and the splicing machinery operates on the RNA transcript. The DNA sequence is the template for the primary transcript. So the causal specificity remains. For non-coding DNA, if it has regulatory functions, it still operates by sequence-specific binding (which is a form of information). But the classic genetic code is about protein-coding. The theory might need to have two layers: the genetic code for protein sequences and a broader notion of regulatory information.

  **What would change my mind?**
  - If it were discovered that the genetic code is not arbitrary (e.g., if there were a direct chemical necessity binding each codon to its amino acid), then the requirement for arbitrariness (Desideratum 2) would have to be dropped. But current evidence supports arbitrariness.
  - If it were shown that other factors (like methylation) can directly specify amino acid sequences without DNA, then the causal specificity of DNA (Desideratum 1) would be undermined. But this is not the case.
  - If a mechanism were found where a protein sequence could be faithfully reproduced without a nucleic acid template (but by some other means), that would challenge the uniqueness of DNA. However, such mechanisms (like prions) do not produce arbitrary sequences; they only propagate a single conformation.
  - Regarding the unsatisfiable pair (Desiderata 1 and 8): if it were shown that the majority of protein sequences are not determined by DNA but by other factors (e.g., if alternative splicing were entirely controlled by cytoplasmic factors without any constraint from the DNA sequence), then we would have to drop or weaken the causal specificity requirement. But currently, the DNA sequence sets the possibilities.

  **Summary of non-negotiable requirements:**
  1. Causal specificity of DNA for the linear sequence of gene products.
  2. Arbitrariness of the mapping (genetic code).
  3. Mapping between two distinct molecular domains (nucleic acids and amino acids).
  5. Natural selection for fidelity.
  7. Distinctness of message and interpreter.

  **Negotiable:**
  4. Universality (can be near-universality).
  6. Combinatorial capacity (desirable but not unique to DNA).
  8. Handling non-coding regions and alternative splicing (must be accounted for, but the theory might extend the notion of information beyond the genetic code).

  The theory must also explain why DNA is special despite the distributed nature of development: because it is the only source that specifies the linear sequence of amino acids in proteins (and the sequence of nucleotides in functional RNAs). Other factors (methylation, etc.) are modulators of expression but do not specify the sequence of the gene products.
answer: |-
  ### Desiderata for a Literal Theory of Genetic Information in DNA

  To establish that DNA carries information in a non-metaphorical sense—and that the genetic code is literally a code—a theory must satisfy the following desiderata. These are derived from the need to resolve the dispute with developmental-systems and niche-construction critics, who argue that "information" is distributed across epigenetic marks (e.g., methylation), cytoplasmic gradients, and environmental factors. The theory must demonstrate that DNA has a unique informational role that cannot be reduced to parity with these other factors. I specify each desideratum with its *rationale* (why it is required, based on empirical or conceptual grounds) and mark it as **non-negotiable** (essential for literal truth) or **negotiable** (a preference that strengthens the case but isn’t fatal if unmet). I also address potential conflicts, the most demanding requirement, and conditions that could falsify the list.

  ---

  #### **Desiderata with Rationales**

  1. **Causal specificity for linear sequence determination**  
     - **Non-negotiable**.  
     - **Rationale**: DNA must be the unique physical substrate that deterministically specifies the linear sequence of nucleotides in RNA and amino acids in proteins during templating processes (replication, transcription, translation). This distinguishes DNA from epigenetic marks (e.g., methylation), which modulate *expression* but do not specify sequence content. For instance, methylation can silence a gene, but the sequence of the gene product (e.g., a protein) is always derived from DNA. Critics argue that cytoplasmic gradients or environmental cues "specify" outcomes, but they lack the 1:1 base-to-outcome mapping of DNA. Without this desideratum, the parity argument stands, as other factors could be seen as equally "informational."

  2. **Arbitrary mapping between molecular domains**  
     - **Non-negotiable**.  
     - **Rationale**: The genetic code must involve an arbitrary (conventional) mapping between two distinct molecular domains: nucleic acids (codons) and amino acids. Arbitrariness is evident in codon degeneracy (multiple codons for one amino acid) and variant codes (e.g., mitochondrial reassignments), showing the mapping is not chemically necessary but evolutionarily fixed. This is a hallmark of symbolic codes (like human language), distinguishing DNA from templating in prions (same-domain physical templating) or causal chains like enzyme catalysis. If the mapping were physically necessitated (e.g., stereochemical complementarity alone), it would not be a true code—just chemistry. Critics cannot redistribute this to methylation, as DNA-protein mapping is domain-crossing and arbitrary in a way methylation (which operates within the same domain of nucleic acid modifications) is not.

  3. **Decoupling of information from its material instantiation**  
     - **Non-negotiable**.  
     - **Rationale**: The information in DNA must be separable from its physical substrate, such that the *same* sequence can be copied, translated, or synthetically recreated without loss of function. This is demonstrated by DNA sequencing, PCR, and synthetic biology (e.g., artificial genes). In contrast, prions rely on direct structural templating (no decoupling), and methylation marks are context-dependent (e.g., tissue-specific). This decoupling enables DNA to function as a stable "message" interpreted by separate machinery (ribosomes, polymerases), satisfying a core criterion of literal codes. Without it, DNA would not differ from cytoplasmic gradients, which are inseparable from their material context.

  4. **Error-robustness under selection**  
     - **Non-negotiable**.  
     - **Rationale**: The system must exhibit evolved mechanisms for error detection/correction (e.g., proofreading in replication, tRNA selection in translation) and robustness to noise (e.g., codon degeneracy buffers misincorporation). This shows information is under selection for fidelity, distinguishing it from error-prone processes like prion misfolding or environmental noise. Frameshifts and misincorporation are edge cases that do not undermine this, as they are minimized by selection. Critics might argue that niche construction (e.g., nest-building) also exhibits "robustness," but it lacks dedicated molecular machinery for error correction. DNA’s error-robustness is non-trivial and unique.

  5. **Compositional syntax and semantics**  
     - **Negotiable** (strengthens the case but not essential).  
     - **Rationale**: DNA sequences should have combinatorial syntax (discrete units, e.g., codons, that can be recombined) and semantics (meaning derived from context, e.g., a codon specifies an amino acid only within a translational apparatus). This supports the "code" metaphor and handles alternative splicing (one sequence yields multiple meanings via context). However, non-coding DNA (e.g., introns) and regulatory regions challenge strict semantics, as their "meaning" is less defined. This is negotiable because non-coding elements could be seen as part of a broader "program," but the core code (for proteins) must still satisfy desiderata 1–4.

  6. **Universal interpretability within a lineage**  
     - **Negotiable**.  
     - **Rationale**: The code must be standardized across a lineage (e.g., universal for most nuclear DNA in eukaryotes), allowing reliable interpretation by shared machinery. Variants (e.g., mitochondrial codes) are acceptable if they are localized exceptions, as they still require standardization within their context. Near-universality supports DNA’s role as a lineage-independent information carrier, unlike cytoplasmic gradients, which are organism-specific. Critics might counter that epigenetic marks are heritable, but they lack cross-lineage universality. This is negotiable because extreme diversity (e.g., every species having a unique code) would weaken but not destroy DNA’s informational status if desiderata 1–4 hold.

  7. **Exclusion of non-templating causal roles**  
     - **Non-negotiable**.  
     - **Rationale**: The theory must exclude cases where DNA acts only as a template for copying (e.g., replication) without coding (e.g., prions copy conformation without arbitrary mapping). This clarifies that "coding" requires both templating (desideratum 1) and arbitrary mapping (desideratum 2). DNA’s role in coding (translation) is distinct from its role as a replication template. Without this, prion-like processes could be misconstrued as "coding."

  ---

  #### **Metaphor Endorsement**
  - **Code**: Endorsed as primary. It captures desideratum 2 (arbitrary mapping) and desideratum 3 (decoupling), making it irreducible to chemistry or templating.  
  - **Template**: Secondary, applicable only to replication/transcription (desideratum 1), not translation.  
  - **Program**: Acceptable if broadened to include regulatory logic (e.g., non-coding DNA), but risks overextension if it obscures DNA’s sequence specificity.  
  - **Blueprint**: Rejected, as it implies a 1:1 map to phenotype, ignoring epigenetics, environment, and desideratum 5 challenges.  
  - **Law**: Rejected, as the code is arbitrary (desideratum 2), not a physical necessity.  

  ---

  #### **Potential Conflicts and Key Challenges**
  - **Suspected unsatisfiable pair**: **Causal specificity (1)** and **handling genome complexity** (implicit in desideratum 5). If DNA must specify linear sequences uniquely, how can we reconcile overlapping reading frames, alternative splicing (one sequence → multiple proteins), or imprinting (where parental origin changes expression)? Desideratum 1 requires DNA to be the *sole* source of sequence information, but complexity introduces ambiguity (e.g., splicing factors influence which protein is made). A theory might resolve this by arguing DNA specifies *all possible* sequences, with other factors selecting among them—but critics could retort that this dilutes specificity.  
    - **Where reasoning might fail**: If future work shows that non-DNA factors (e.g., spliceosome dynamics) *determine* sequence outcomes independently of DNA (e.g., via stochastic or environmental inputs), desideratum 1 could collapse. Currently, DNA constrains possibilities; failure would occur if this constraint is non-specific.

  - **Most demanding requirement**: **Arbitrary mapping (2)**. It does the most work in excluding rivals because it establishes DNA as a symbolic medium. Without it, templating (desideratum 1) reduces to chemistry (e.g., crystal growth), and critics can redistribute information to non-arbitrary factors like methylation. It also excludes prions and justifies the "code" metaphor.

  ---

  #### **What Would Change My Mind**
  - **Dropping/demoting non-negotiable desiderata**:  
    - **Arbitrary mapping (2)**: If evidence shows codon-amino acid pairings are *physically necessitated* (e.g., via quantum chemistry or folding constraints that make alternative codes impossible), desideratum 2 becomes negotiable. Current data (variant codes, synthetic biology) suggest arbitrariness, but new findings could undermine this.  
    - **Causal specificity (1)**: If a system is found where protein sequences are reliably specified *without* DNA templating (e.g., via RNA editing guided solely by maternal factors or environmental cues), desideratum 1 fails. This is conceivable in exotic life forms (e.g., RNA-world relics) or engineered systems.  
    - **Decoupling (3)**: If DNA sequences are shown to be wholly inseparable from their cellular context (e.g., if sequence function depends on nuclear topology in a non-copyable way), desideratum 3 weakens.  

  - **Revisiting the unsatisfiable pair**: If research demonstrates that alternative splicing or imprinting is *primarily* controlled by non-DNA factors (e.g., methylation dictating splice outcomes independently of sequence), the conflict between specificity and complexity becomes irreconcilable. My reasoning fails if I underestimate the causal contribution of non-DNA factors to sequence determination.  

  This list provides a rigorous specification for evaluating theories. By satisfying non-negotiables, a theory can defend DNA’s unique informational role against parity arguments; by addressing negotiables, it can strengthen its case against critics. Use this to score existing accounts systematically.
