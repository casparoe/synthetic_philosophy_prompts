answer: |-
  *(Leans forward, tapping the table decisively)* Your cap rule *changes* the battlefield, it doesn't eliminate the war. Even with public caps, my "bid" is the resource commitment *up to* my cap. Escalating *within* the cap range is absolutely rational if I believe the opponent's cap is lower than mine *and* the project value justifies fighting near my limit. I escalate to pressure them into folding *before* they hit their cap, saving me from paying my full amount. The caps just define the maximum battlefield; the struggle to make the other guy yield first – and save resources – is still very real. The mistake isn't *just* entering; it's misjudging their cap or the value, leading to a fight where paying near my cap becomes necessary to avoid total loss on my initial sunk cost. **To change my mind on this leverage point, show me how the *loser* avoids paying their bid entirely without a cap system – that’s where pre-cap escalation gets its teeth.**

  *(Pauses, waiting for your counter)* Your move. Why is escalating *within the capped range* irrational if I believe folding means losing my initial investment *and* conceding the prize?
