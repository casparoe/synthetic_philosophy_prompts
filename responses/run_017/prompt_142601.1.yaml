  ### Population Ethics Case: Generation Ship and the Repugnant Conclusion

  **Setting:**  
  A generation ship starts with \(N_0 = 1,000\) crew members and a fixed resource budget \(R\). Per-person welfare is \(w = 100 \cdot \sqrt{1,000 / N}\), where \(N\) is the crew size. This ensures \(w_0 = 100\) for \(N_0 = 1,000\). The ship's charter allows:
  - Maximum 25% crew growth per generation: \(N_{t+1} \leq 1.25 N_t\).
  - No reduction in welfare for existing members by >10%: \(w_{t+1} \geq 0.9 w_t\).
  - All lives must be worth living: \(w > 0\).

  **Goal:**  
  Reach a state with:
  - Crew size \(\geq 50 \times N_0 = 50,000\).
  - Per-person welfare \(< 10\) (i.e., <10% of founding welfare).

  **Construction:**  
  The welfare constraint \(w_{t+1} \geq 0.9 w_t\) binds more tightly than the 25% growth cap. To minimize steps, maximize growth at each step:  
  \[
  w_{t+1} = 0.9 w_t \implies \sqrt{\frac{1,000}{N_{t+1}}} = 0.9 \sqrt{\frac{1,000}{N_t}} \implies N_{t+1} = \frac{N_t}{0.81} \approx 1.234567 N_t.
  \]  
  This growth rate (23.46%) is within the 25% cap. Crew sizes are integers: \(N_{t+1} = \lfloor N_t / 0.81 \rfloor\) (rounding down ensures \(w_{t+1} \geq 0.9 w_t\)). Welfare at step \(t\) is:  
  \[
  w_t = 100 \cdot (0.9)^t.
  \]

  **Sequence:**  
  Start at \(t=0\): \(N_0 = 1,000\), \(w_0 = 100\).  
  - At \(t = 22\):  
    \(N_{22} = 102,854 > 50,000\),  
    \(w_{22} = 100 \cdot (0.9)^{22} \approx 9.86 < 10\).  

  Key steps (see full table below for all \(t\)):

  | \(t\) | \(N_t\)   | \(w_t\)  | Notes                      |
  |-------|-----------|----------|----------------------------|
  | 0     | 1,000     | 100.00   | Founding generation        |
  | 8     | 5,386     | 43.07    | Critical-Levelism endorses |
  | 9     | 6,649     | 38.77    | Critical-Levelism endorses |
  | 10    | 8,207     | 34.89    | Critical-Levelism rejects  |
  | 21    | 83,312    | 10.96    | Welfare still >10          |
  | 22    | 102,854   | 9.86     | **Endpoint**              |

  **Verification of Constraints:**  
  - **Growth cap**: Max growth rate is 23.46% < 25% at all steps.  
  - **Welfare drop**: \(w_{t+1} \geq 0.9 w_t\) holds by construction.  
  - **Worth living**: \(w_t > 0\) always (minimum is 9.86 > 0).  
  - **No welfare gains for existing members**: \(w_t\) decreases monotonically.

  ---

  ### Ethical Evaluation
  Three theories:
  1. **Totalism**: Rank by total welfare \(S = N \cdot w\).  
  2. **Averagism**: Rank by average welfare \(A = w\).  
  3. **Critical-Levelism** (CL, critical level \(c = 20\)): Rank by \(V = N \cdot (w - 20)\).

  **Transition Verdicts (from \(t\) to \(t+1\)):**  
  - **Totalism**: Endorses every step.  
    \[
    \Delta S = S_{t+1} - S_t > 0 \quad \text{(always, since } S_{t+1} \approx 1.111 S_t \text{)}.
    \]
  - **Averagism**: Rejects every step.  
    \[
    w_{t+1} < w_t \quad \text{(welfare decreases)}.
    \]
  - **Critical-Levelism**: Endorses early steps, rejects later steps.  
    Switch when:  
    \[
    \Delta V = V_{t+1} - V_t > 0 \iff w_t > \frac{3.8}{0.09} \approx 42.22.
