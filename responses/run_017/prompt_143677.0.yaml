answer: |-
  Here’s a complete package for your essay question, designed to force critical engagement with deflationism while staying within your syllabus constraints. The dilemma is sharpened to avoid "money" distractions, focusing on truth’s functional roles.

  ### (1) Essay Question  
  **"Deflationists hold that the nature of truth is fully captured by instances of the equivalence schema ⟨p⟩ is true iff p. Define a new predicate ‘is schmue’ by the schema ⟨p⟩ is schmue iff (p and p is not about money). Argue either that this shows deflationism fails to account for truth’s distinctive role in assertion or generalization, or that deflationism can explain why ‘schmue’ is defective without invoking substantive truth-properties. Your answer must engage with at least one of blind ascription or the norm of assertion."**

  ---

  ### (2) Model Answer (830 words)  
  Deflationism claims that the entire theoretical role of truth is exhausted by its disquotational behavior: grasp of ‘true’ consists solely in accepting instances of ‘⟨p⟩ is true iff p’. The predicate ‘schmue’, defined via ‘⟨p⟩ is schmue iff (p and p is not about money)’, appears to mirror this schema for non-monetary propositions. Yet ‘schmue’ fails to replicate truth’s core functions. This reveals that deflationism cannot explain truth’s uniqueness through the schema alone, as truth’s unrestricted applicability—especially in blind ascription and normative constraints on assertion—is irreducible. Deflationism thus implicitly relies on substantive features of truth it officially rejects.  

  ‘Schmue’ satisfies deflationism’s core criterion: it disquotes. For any non-monetary proposition, asserting ⟨Gold is an element⟩ is schmue is equivalent to asserting that gold is an element. Crucially, all instances of its schema are true (e.g., “⟨Snow is white⟩ is schmue iff snow is white and snow is white is not about money”). If deflationism were correct, ‘schmue’ should function identically to ‘true’ in all truth-involving practices. But it does not.  

  The failure emerges in **blind ascription**. Consider: “Everything Kant said is true.” This allows endorsement of Kant’s unknown claims because ‘true’ generalizes unrestrictedly. ‘Schmue’ cannot do this. Asserting “Everything Kant said is schmue” would commit one to Kant saying nothing about money—an implausible restriction. Even if Kant never discussed money, the speaker cannot know this blindly. The deflationist rightly emphasizes that truth enables endorsement without propositional knowledge. But ‘schmue’ requires knowing that Kant’s claims satisfy an additional condition (non-monetary content), violating the very “blindness” deflationism attributes to truth. The schema alone cannot secure this generality; truth’s lack of content constraints is essential.  

  Deflationists might retort that ‘schmue’ fails because its schema is *gerrymandered*: it adds an extraneous condition (‘not about money’). But this misses the objection’s force. The problem isn’t the arbitrary restriction—it’s that any restriction exposes deflationism’s inability to explain why truth alone permits *unconditional* generalization. Deflationism treats the schema as metaphysically fundamental, yet truth’s role in blind ascription depends precisely on its *not* being schema-bound like ‘schmue’. Truth applies indifferently to all content; ‘schmue’ does not. If deflationism insists truth has no hidden nature, it cannot explain this asymmetry without circularity (e.g., “only truth generalizes blindly”—but *why*?).  

  This connects to the **norm of assertion**. Deflationists hold that “assert only what is true” is trivial: asserting p is equivalent to asserting p is true, making the norm vacuous. But ‘schmue’ exposes this as inadequate. Suppose we command: “Assert only what is schmue.” For non-monetary claims, this collapses to “assert only what is true.” But for monetary claims (e.g., “Interest rates will rise”), the norm forbids assertion *even if the claim is true*—a nonsensical result. Truth’s norm, in contrast, applies uniformly: we should assert truths regardless of topic. This uniformity is non-accidental; it follows from truth’s lack of content-sensitivity. Yet deflationism cannot ground this without appealing to truth’s substantive property of topic-neutrality—precisely what it denies.  

  Some deflationists might argue that ‘schmue’ is *inconsistent* with truth’s inferential role. For example, in mixed inferences: “If ‘snow is white’ is true, then snow reflects light; ‘snow is white’ is true; therefore, snow reflects light.” Replacing ‘true’ with ‘schmue’ works only if ‘snow is white’ isn’t about money—but again, this reintroduces content restrictions absent in truth’s actual function. Truth’s role in logic requires it to be universally applicable; ‘schmue’ is not. The deflationist schema, by itself, cannot exclude such defective predicates because it says nothing about applicability constraints.  

  Ultimately, deflationism cannot resolve the dilemma. If it dismisses ‘schmue’ as irrelevant—insisting only truth has the “right” schema—it abandons its claim that the schema exhausts truth’s nature. If it explains ‘schmue’s defect via truth’s unique functional roles (blind ascription, normative uniformity), it covertly invokes substantive features: unrestricted applicability and topic-neutrality. These features are not derivable from the schema; they presuppose a prior grasp of truth as a content-blind property. The ‘schmue’ case thus proves deflationism is either incomplete (failing to distinguish truth from impostors) or self-undermining (smuggling in the very substantive properties it rejects). Truth’s essence includes its universality—and deflationism cannot reduce this to mere disquotation.

  ---

  ### (3) Marking Scheme (20 points total)  
  **Must-hit moves & common errors:**  
  1. **Accurate dilemma setup** (3 pts):  
     - *States deflationism’s core claim (schema exhausts truth) and constructs ‘schmue’ as a schema-based rival.*  
     - *Common error: Misdefining deflationism or ‘schmue’ (e.g., calling schmue “not a truth-predicate” without argument).*  
  2. **Identify schmue’s failure in blind ascription/generalization** (5 pts):  
     - *Explains how ‘everything is schmue’ requires knowing content restrictions (unlike truth), sabotaging blind endorsement.*  
     - *Common error: Only noting schmue’s “restriction” without linking to generalization’s epistemic role (e.g., “schmue doesn’t work for money sentences” → max 2/5).*  
  3. **Connect to norm of assertion or blind ascription** (5 pts):  
     - *For norm: Shows “assert only schmues” distorts norms for monetary claims vs. truth’s uniformity.*  
     - *For blind ascription: Details how schmue requires content knowledge truth does not.*  
     - *Common error: Mentioning the topic but not explaining functional asymmetry (e.g., “truth’s norm is different” → 2/5).*  
  4. **Deflate deflationist replies** (4 pts):  
     - *Counters “gerrymandering” or “inconsistency” objections by stressing truth’s irreducibly unrestricted applicability.*  
     - *Common error: Accepting deflationist replies uncritically (e.g., “schmue is ad hoc, so irrelevant” → 1/4).*  
  5. **Coherent argument for a side** (3 pts):  
     - *Defends one horn of the dilemma (e.g., “deflationism fails”) without hedging.*  
     - *Common error: Sitting on the fence (“it’s complicated but deflationism might adjust”).*  

  **Bands:**  
  - **First (17–20):** Hits all moves. Explicitly ties schmue’s failure to truth’s *irreducible topic-neutrality/unrestrictedness* (key separator).  
  - **2:1 (13–16):** Hits moves 1–3 and 5 but misses nuance in #4 (e.g., doesn’t explain why schema alone can’t block schmue).  
  - **2:2 (9–12):** Describes dilemma/schmue but superficial on functional roles (e.g., “schmue doesn’t generalize” without blind ascription detail).  
  - **Fail (0–8):** Misstates deflationism or schmue; ignores functional roles; rehashes “truth vs. correspondence.”  

  ---

  ### Why this works:  
  - **Avoids flatmate’s distraction:** "Money" illustrates content-restriction but isn’t the crux—focus stays on *unrestricted generalization* and *normative uniformity*, core syllabus topics.  
  - **Forces a side:** The prompt demands attacking deflationism or defending it against schmue. Model answer attacks, showing how truth’s functional roles require non-deflationist resources.  
  - **Syllabus-aligned:** Draws only on blind ascription, norms of assertion, and truth-as-property debates. No external tools.  
  - **High ceiling:** Top marks require spotting that truth’s *topic-neutrality* (implied by blind ascription) is the unanalyzable feature deflationism misses.  

  Let me know if you’d like a defense-focused model answer (for the other horn of the dilemma) or adjustments to the marking bands!
