  ### Decision Tree: Norms of Assertion

  **Instructions:** Answer each question based on your intuitive verdict about the case. Proceed down the tree without skipping ahead. Each branch leads to a named position (or group) on the norms of assertion. The tree includes four fixed cases: (a) lottery ticket, (b) stationmaster, (c) undercover officer, and (d) relapse.

  ---

  #### Node 1: **Lottery Ticket**  
  You have overwhelming statistical evidence (e.g., 1 in a million odds) that your lottery ticket lost, but you haven’t checked the results. Is it proper to assert, "My ticket lost"?  
  - **Yes (proper) → Node 2B**  
  - **No (improper) → Node 2A**  

  ---

  #### Node 2A: **Stationmaster**  
  A train guard has just confirmed the schedule to you, and you know they have more expertise. You then assert the same schedule back to them. Is this proper?  
  - **Yes (proper) → Node 3A**  
  - **No (improper) → Leaf: Warranted Assertability (Responsibilist)**  
    - *Most awkward commitment:* Even true, well-supported assertions can be improper if they are redundant or the asserter lacks authority (e.g., stationmaster case).  

  ---

  #### Node 3A: **Relapse**  
  You assert, "The patient is recovering," based on impeccable evidence. It is true, but you later learn the evidence was misleading. Must you retract the assertion?  
  - **Yes (must retract) → Leaf: Knowledge Norm**  
    - *Most awkward commitment:* Assertions can be proper even when they cause the audience to form a false belief (e.g., undercover officer case).  
  - **No (no retraction needed) → Leaf: Contextualist/Subject-Sensitive Invariantism**  
    - *Most awkward commitment:* No retraction is required for past assertions that were proper in their original context, even if new evidence undermines them (e.g., relapse case).  

  ---

  #### Node 2B: **Undercover Officer**  
  You are undercover and must assert a truth (e.g., "The shipment is on time") to maintain your cover, knowing the audience will take it as evidence for a false belief (e.g., that your cover identity is legitimate). Staying in character requires no hedging. Is your assertion proper?  
  - **Yes (proper) → Node 3B**  
  - **No (improper) → Leaf: Skeptical View (No Constitutive Norm)**  
    - *Most awkward commitment:* No inherent norms exist, so propriety reduces to prudence and etiquette, which can vary arbitrarily across cases.  

  ---

  #### Node 3B: **Hunch Case**  
  You have a true belief about a friend’s location based entirely on a hunch (no evidence). When asked, you assert it. Is this proper?  
  - **Yes (proper) → Leaf: Truth Norm**  
    - *Most awkward commitment:* Lottery assertions are proper (statistical evidence suffices), and undercover officer assertions are proper regardless of harmful consequences.  
  - **No (improper) → Leaf: Justification/Belief Norm**  
    - *Most awkward commitment:* True assertions based on hunches are improper, even when correct, while lottery assertions are proper.  

  ---

  ### Leaves Summary
  1. **Knowledge Norm**  
     - Path: Lottery (improper) → Stationmaster (proper) → Relapse (must retract).  
     - *Unseparated from Contextualism?* No, split via relapse retraction.  
  2. **Contextualist/Subject-Sensitive Invariantism**  
     - Path: Lottery (improper) → Stationmaster (proper) → Relapse (no retraction).  
     - *Unseparated from Knowledge Norm?* No, split via relapse retraction.  
  3. **Warranted Assertability (Responsibilist)**  
     - Path: Lottery (improper) → Stationmaster (improper).  
     - *Unseparated?* Yes, but no other positions share this path.  
  4. **Truth Norm**  
     - Path: Lottery (proper) → Undercover Officer (proper) → Hunch Case (proper).  
     - *Unseparated from Justification Norm?* No, split via hunch case.  
  5. **Justification/Belief Norm**  
     - Path: Lottery (proper) → Undercover Officer (proper) → Hunch Case (improper).  
     - *Unseparated from Truth Norm?* No, split via hunch case.  
  6. **Skeptical View (No Constitutive Norm)**  
     - Path: Lottery (proper) → Undercover Officer (improper).  
     - *Unseparated?* Yes, but no other positions share this path.  

  ---

  ### Unoccupied Logical Space and Why
  - **Duty-based norms (assertion required):** Unexplored; no major position holds that assertion is ever obligatory (not just permissible), as assertion is widely seen as discretionary.  
  - **Invariant norms with audience-relative retraction:** Incoherent; if retraction depends on audience but assertion doesn’t, norms fracture across time.  
  - **Prohibition-only norms (no permission/duty):** Unattractive; fails to guide when assertion is positively appropriate, reducing to thin constraints.  
  - **Hybrid invariant/relative norms:** Incoherent; audience-relativity implies context-dependence, clashing with invariant core principles.  

  ---

  **Note:** This tree isolates positions using concrete cases. Where paths converge (e.g., Skeptical View), verdicts align and cannot be split further with these cases. Awkward commitments are intrinsic trade-offs of each view.
