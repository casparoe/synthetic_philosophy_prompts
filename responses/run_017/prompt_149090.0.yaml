  Below is a decision procedure designed for your team, built from the epistemology of lottery and preface cases. It addresses your requirements: coarse confidence language, risk shape distinctions, asymmetric stakes, value judgment markers, and clear limitations. The lottery and preface shapes are treated **identically** in the aggregation step (Step 4), as the operational distinction collapses when combining claims—both involve handling conjunctions where individual high confidence doesn't guarantee collective safety. The key difference (knowing your error rate in preface cases) is used to set the initial confidence threshold but doesn't change the core logic.

  ---

  ### **Decision Procedure for Errata & Matters-Arising Notes**
  **Inputs per note**: Claims made, structure (conjunction/disjunction), confidence in claims (High/Medium/Low), risk shape, stakes, and availability of verification.  
  **Outputs**: Do Nothing, Publish Note, Request Author Reply, Issue Expression of Concern (EoC), Retract.  
  **Coarse Confidence Definitions**:  
  - **High**: ~90%+ confidence (compelling evidence, easily verifiable).  
  - **Medium**: ~70-89% confidence (plausible but not decisive).  
  - **Low**: <70% confidence (weak evidence or unverifiable).  

  **Asymmetric Stakes Built-In**:  
  - False positive (publishing wrong correction) > False negative (missing true correction).  
  - Retraction/EoC stakes > Publish Note stakes (irreversible vs. debatable).  
  → *Higher confidence required for actions with greater harm* (see Step 5).  

  **Value Judgment Flags**:  
  - ⚖️ : Editor intervention required (cost to author, interpretive weight, ethical risk).  

  ---

  #### **Step 1: Can the note be verified?**  
     - **Factual claim?** (e.g., mislabeled figure, math error):  
       - *Yes* → Proceed to Step 2.  
       - *No* (interpretive, e.g., argument flaw) → Skip to Step 3.  
     - **Author replied?**  
       - *No reply* → Confidence drops one level (e.g., High → Medium) for affected claims.  
       - *Author concedes* → Treat claim as **High** confidence.  
     - **Sufficient answer**: "Yes" if claim is factual and verifiable with resources; else "No."  
     - **Stop here if**: Claims are **Low** confidence and unverifiable → **Do Nothing** (lack of evidence).  

  #### **Step 2: Verify factual claims (if applicable)**  
     - Assign confidence:  
       - **High**: Directly verified (e.g., re-ran calculation, checked source).  
       - **Medium**: Partial verification (e.g., expert consulted but not replicated).  
       - **Low**: Unverifiable (e.g., data unavailable, ambiguous description).  
     - **Stop here if**: All claims **Low** → **Do Nothing**.  
     - Proceed to Step 3.  

  #### **Step 3: Map risk shape**  
     Determine logical structure:  
     - **Flat/Independent (Preface/Lottery shape)**: Claims are standalone; failure of one doesn't affect others (e.g., 12 typos in an appendix).  
     - **Clustered**: Claims tied to a named component (e.g., formal appendix); if component is flawed, all claims fail together.  
     - **Dependent**: Claims share a critical step (e.g., a lemma); all fail if the step fails (non-independent).  
     - **Output**: Structure type. Proceed to Step 4.  

  #### **Step 4: Aggregate confidence (Key step for lottery/preface handling)**  
     - **Single claim**: Use its confidence.  
     - **Conjunction (all claims must hold)**:  
       - *Independent/Flat or Clustered*: Downgrade overall confidence.  
         - Rules (coarse):  
           - All **High** → **High** (for 1 claim), **Medium** (2–3 claims), **Low** (4+ claims).  
           - Any **Medium** → **Medium** (1–2 claims), **Low** (3+ claims).  
           - Any **Low** → **Low**.  
       - *Dependent*: Use confidence in the critical step (ignore others).  
     - **Disjunction (one claim suffices)**: Use highest-confidence claim.  
     - **Output**: Overall confidence (High/Medium/Low). Proceed to Step 5.  

  #### **Step 5: Apply asymmetric stakes & action threshold**  
     | Action                 | Required Confidence | Notes                                  |  
     |------------------------|---------------------|----------------------------------------|  
     | **Publish Note**       | High               | Minor corrections only. Low harm if wrong. |  
     | **Request Author Reply** | Medium/Low        | Default if confidence < High. ⚠️ Time-sensitive. |  
     | **Issue EoC**          | High               | Major errors; high harm if wrong.      |  
     | **Retract**            | High + ⚖️         | Grave errors; near-certainty needed.   |  
     | **Do Nothing**         | Low                | Confidence too low for action.         |  

     - **High-stakes adjustment**:  
       - EoC/Retraction require **High** confidence, even if Publish Note would suffice for minor issues.  
       - ⚖️ **Value judgment**: Editor must approve if action disproportionately harms author (e.g., first-time author) or has ethical risks.  

  #### **Step 6: Final checks**  
     - **Boilerplate compliance**: Can you verify claims *for the chosen action*?  
       - Publish Note: Verification not required (matters-arising = scholarly debate).  
       - EoC/Retraction: Must verify claims (per publisher rules).  
     - **Stop here if**: Boilerplate can't be met (e.g., unverifiable claim for EoC) → **Do Nothing** or **Publish Note** if interpretive.  
     - **Co-editor sign-off**: Both editors must approve.  

  ---

  ### **What the Procedure Can't Do**  
  - **Prevent all errors**: High-confidence actions still carry ~10% risk.  
  - **Resolve ambiguous evidence**: Coarse confidence can't capture nuance.  
  - **Replace expertise**: Unverifiable claims (e.g., obscure historical references) may require arbitrary judgment.  
  - **Override values**: Editors must weigh costs to authors/public interest.  
  - **Fix publisher constraints**: Boilerplate rules may force "Do Nothing" for valid but unverifiable claims.  
  **When a blanket caveat is right**: Only for *preface-like risk* (many independent claims) where aggregate confidence is **Low**, but individual claims are **High**. The caveat flags systemic uncertainty without misleading. Otherwise, it's noise.  

  ---

  ### **Case Applications**  
  **Case 1: Note claims a well-known paper's central argument fails (3 sub-claims; all interpretive)**  
  - Step 1: Not factual → Skip to Step 3.  
  - Step 3: **Dependent risk** (all claims required for conclusion).  
  - Step 4: Each claim **High** → Critical step confidence = **High** (no aggregation needed for dependent claims).  
  - Step 5: **Publish Note** (confidence **High**, stakes low: interpretive debate).  
  - Step 6: Boilerplate satisfied (no verification required for matters-arising).  
  - **Output**: Publish Note.  

  **Case 2: Claim that a first-time author's figure is mislabeled (unverifiable, no reply)**  
  - Step 1: Factual, but unverifiable + no reply → Confidence **Low**.  
  - Step 2: (Skipped as unverifiable).  
  - Step 3: Single claim → **Flat risk**.  
  - Step 4: Confidence **Low**.  
  - Step 5: **Do Nothing** (confidence too low; stakes asymmetric: false correction harms author).  
  - ⚖️ **Value note**: Harm to first-time author justifies inaction despite plausible error.  
  - **Output**: Do Nothing.  

  **Case 3: 12 corrections targeting a formal appendix (you were handling editor)**  
  - ⚖️ **Recuse yourself** (conflict of interest). Co-editor runs procedure.  
  - Step 1: Factual → Proceed.  
  - Step 2: Claims verifiable. Each **High** confidence.  
  - Step 3: **Clustered risk** (all in appendix; if appendix flawed, all fail).  
  - Step 4: Conjunction of 12 **High**-confidence claims → **Low** aggregate confidence (preface/lottery effect).  
  - Step 5: Confidence **Low** → **Do Nothing** or **Request Author Reply**.  
  - Step 6: Boilerplate for EoC/retraction requires verification → Not met.  
  - **Output**: **Do Nothing** (aggregate confidence too low; publisher constraints prevent partial action).  
  - **Why you won't like this**: Your interest in the paper is irrelevant; 12 claims create high aggregate risk.  

  ---

  ### **Why Lottery/Preface Shapes Collapse**  
  - **Operational identity**: Both involve conjunctions where individual high confidence doesn't imply collective safety. The lottery's "guaranteed error" and preface's "known error rate" both demand downgrading aggregate confidence for *n* >1 claims.  
  - **Distinction irrelevant here**: Knowing your annual error rate (preface) helps set initial thresholds, but the *combination mechanism* (Step 4) is identical for both.  
  - **Practical bite**: The "dependent risk" case (e.g., shared lemma) is where testing claims individually fails—but it's handled separately in Step 3.  

  This procedure prioritizes auditability, speed, and harm reduction. Test it with your team on historical cases to refine confidence thresholds.
