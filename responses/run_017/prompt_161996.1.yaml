prompt: |-
  I'm finishing a PhD in philosophy, working at the metaphysics / philosophy of physics border, and the seminar paper I'm currently writing concerns how much Thomson's lamp argument actually establishes. As I read the literature, it has settled into two diagnoses: either the task-description is logically inconsistent, so no supertask of that shape can be performed at all; or the description is consistent but simply incomplete at the limit instant — it fixes the state at every time before the limit and nothing at the limit — so the argument shows only that a certain way of telling the story fails to settle the outcome.

  I want to pry those apart by constructing a supertask in which the limit state is *determined* — determined by the physics of the set-up, not by a stipulation — but is not readable off the sequence of states that accumulates at the limit instant. That combination is what I can't find built anywhere: the underdetermination reply requires that the story leave the limit state open, and Thomson's argument requires that the limit state be settled by the alternation pattern. I want a case where both of those fail at once, so that the argument can be shown to rest on a premise it never states.

  Specifications for the scenario:

  1. Ordinary mechanics. Newtonian point mechanics or rigid-body mechanics with gravity, macroscopic objects, finite total mass and finite total energy, everything confined to a finite spatial region, and all velocities bounded by a finite bound. No exotic spacetimes, no accelerating or infinite-time computers, no singularities, no agents performing infinitely many deliberate acts. Standard idealizations (perfectly rigid walls, instantaneous collisions with a coefficient of restitution, ideal switches or relays) are fine; anything stronger is not.

  2. Supertask structure. There is a binary indicator — a lamp, a gate, a relay — whose state changes infinitely many times within a finite interval, with switching times accumulating at the limit instant from below: no last switching before it, no first switching after it.

  3. The switching schedule must be *generated* by the system's own evolution from its initial conditions, force law and coupling rule, not imposed by an external timetable or by a sequence of free actions. This is what should make the underdetermination reply unavailable.

  4. The coupling between the indicator and the mechanical system must be local in time: the indicator's state at a time depends only on the mechanical state at that time, not on the elapsed history, not on the time variable directly, and not on how many switchings have occurred so far.

  5. The pattern of indicator states must have no limit as the switching times accumulate — otherwise your case is trivial, since the answer would just be the limit of the pattern, and Thomson's argument would never have got a grip.

  6. Determinacy. The indicator's state at the limit instant must nonetheless be uniquely determined, and you must derive it from the dynamics together with the coupling rule and the pre-limit evolution, and show that the alternative state is inconsistent with the laws rather than merely unattractive.

  7. A check I care about: confirm that the time-reverse of your scenario is not also a solution of the same laws. If it is, your set-up is indeterministic at the limit instant and the determinacy claim in (6) collapses into a bare choice between two lawful continuations. Tell me which way your case goes.

  After the scenario (one paragraph of prose, under 150 words, then the demonstration):

  - Run both halves of Thomson's argument on it — the "it cannot be on" half and the "it cannot be off" half — and tell me where each breaks, which premise each was silently relying on, and why they are not independent moves.
  - State which state the indicator is in at the limit instant and derive it.
  - Say explicitly why the underdetermination reply is not available here.
  - Name the single feature of the set-up that is doing the work, and remove it: describe what the case degenerates into and which diagnosis then becomes correct.
  - Give the strongest objection a defender of Thomson would make — I expect something like: your verdict is smuggled in by the coupling rule, or your case is a convergent physical process rather than a supertask in the relevant sense, since nothing is *done* infinitely many times — and say whether it lands.

  What counts as cheating for my purposes: stipulating the apparatus is fine (initial conditions, coefficients, coupling rule); stipulating the outcome is not. If the best case you can build needs a separate clause fixing the indicator's state at the limit instant, say so plainly and explain why no clause-free version works — for the paper, that failure itself would be a usable result.
reasoning: |-
  We are to construct a supertask scenario satisfying the given specifications. The goal is to have a binary indicator (like a lamp) that switches infinitely many times before a limit time T, with no limit to the sequence of states (so it doesn't settle to on or off), but at T the state is determined by the physics and coupling.

  Key constraints:
  - The switching must be generated by the system's own dynamics (not external timetable).
  - The coupling must be local: the indicator state at time t depends only on the mechanical state at t.
  - The limit state must be uniquely determined by the laws and pre-limit evolution, and we must show that the alternative is inconsistent.
  - The time reverse must not be a solution (to avoid indeterminism).

  Let me sketch a scenario:

  Consider a point mass moving in one dimension, bouncing elastically between two rigid walls. The left wall is at x=0, the right wall is at x=1. The particle starts at x=0.5 with initial velocity v0 = 1 m/s to the right. It will bounce back and forth. The time between bounces decreases geometrically because the distance to each wall halves after each pair of bounces? Actually, in a uniform gravitational field? But the problem says ordinary mechanics, and we can do without gravity if we use elastic collisions.

  But note: without gravity, in a straight line with two walls, the motion is periodic and the times between bounces are constant. We need the times to accumulate. So we need the particle to be accelerating? But we have finite energy and bounded velocities.

  Ah, we can use a system with an infinite series of walls? But then we violate the finite spatial region. Alternatively, we can have a single wall that moves? But that might require an external agent.

  Another idea: a ball bouncing on a fixed horizontal surface under gravity. The bounces are inelastic? But then it stops. We need infinite bounces in finite time? That requires that the bounces get faster and faster. For that, we need the coefficient of restitution to be less than 1? But then the ball comes to rest in finite time. That's the bouncing ball supertask.

  In the bouncing ball supertask: a ball is dropped from height h0, and after each bounce, it rises to a fraction r of the previous height (0<r<1). The times between bounces form a geometric series and sum to a finite time. At the limit time, the ball is at rest on the ground.

  But note: in this case, the indicator? We need a binary indicator that switches.

  We can attach an indicator that changes state at every bounce? For example, the indicator is a lamp that toggles every time the ball hits the ground. Then the lamp will switch infinitely many times before the limit time T (when the ball comes to rest). The sequence of lamp states: let's say it starts off. After first bounce, on; second, off; third, on; etc. So the sequence is off, on, off, on, ... which does not converge. But at the limit time T, the ball is at rest on the ground. What state should the lamp be in?

  The coupling rule: the lamp is on if the ball is in the air? Or off if the ball is in contact? But note: the coupling must be local in time. We can define:

  Let the indicator be a switch that is triggered by the ball's contact with the ground. We can say that the lamp is on when the ball is not in contact with the ground, and off when the ball is in contact. But then the lamp is off only during the infinitesimal intervals when the ball is touching the ground. At the limit time T, the ball is in contact and at rest, so the lamp should be off.

  But note: the problem says the indicator changes state infinitely many times. In this setup, the lamp turns off at every bounce and then back on when the ball leaves. So it does change state at every bounce. The switching times accumulate at T.

  Now, at the limit time T, the ball is at rest on the ground. The coupling rule: if the ball is in contact with the ground, the lamp is off. So at T, the lamp is off.

  But is this state determined? We must show that the alternative (on) is inconsistent.

  Suppose at T the lamp were on. That would require that the ball is not in contact with the ground. But the ball is at rest on the ground by the dynamics (it has lost all energy and is in contact). So if the lamp were on, that would mean the ball is not in contact, which contradicts the mechanical state.

  Moreover, the pre-limit evolution: just before T, the ball is making bounces with decreasing amplitude and the lamp is toggling. At times arbitrarily close to T, the ball is sometimes in contact and sometimes not. But at T, the ball is in contact and remains so. So the lamp is off at T.

  Now, the time reverse: if we reverse time, we have a ball initially at rest on the ground and then suddenly starting to bounce, with increasing amplitude. But that would require energy to be increasing, which is inconsistent with the inelastic collisions (which dissipate energy). In the time reverse, we would have to have collisions that add energy. The standard model of inelastic collisions (with a coefficient of restitution) is not time-reversible. Therefore, the time reverse is not a solution for the same physical laws (which are dissipative in the forward direction).

  So we have:

  - The mechanical state at T: ball at rest at x=0 (ground).
  - Coupling rule: lamp is off when the ball is in contact with the ground, on otherwise.
  - At T, the ball is in contact -> lamp off.

  Now, Thomson's argument:

  First half: it cannot be on at T? 
  Thomson would say: if it were on at T, then there must have been a last time it was off and then turned on. But there is no last bounce (since the bounces accumulate at T). So there is no last time it was off. Therefore, it cannot be on. This half works and leads to the conclusion that it cannot be on.

  Second half: it cannot be off at T?
  Thomson would say: if it were off at T, then there must have been a last time it was on and then turned off. But again, there is no last bounce (so no last time it was on). Therefore, it cannot be off.

  But in our case, we have an answer: it is off. So the second half of Thomson's argument breaks. Why?

  Thomson's second half assumes that if the lamp is off at T, then there must have been a last time it was on (and then turned off). But in our scenario, there is no last time it was on because the bounces continue without end. However, the lamp is off at T because the ball is at rest and in contact. The key is that the state at T is not determined by the sequence of states arbitrarily close to T (which alternates) but by the mechanical state at T. Thomson's argument ignores the actual physical state at T and only looks at the history of the lamp.

  So the premise that Thomson's argument silently relies on is that the state of the indicator at the limit time must be the limit of its states at times approaching the limit (if it exists). But in this case, the limit of the states does not exist (because the sequence alternates), so Thomson's argument tries to use the lack of a last switching to rule out both states. However, the coupling rule ties the indicator to the mechanical state at the instant, and that state is not alternating at T: it is fixed.

  Therefore, the underdetermination reply is not available because the coupling rule (which is part of the setup) determines the state at T based on the mechanical state at T, and the mechanical state at T is determined by the dynamics (the ball comes to rest).

  Now, the single feature doing the work: the fact that the mechanical system reaches a limit state that is not oscillatory (the ball is at rest) and the coupling rule uses that state to set the indicator.

  If we remove that feature: suppose we have a system that does not come to rest? For example, if we use perfectly elastic bounces (r=1) then the ball would bounce forever with constant period and never stop. Then we wouldn't have a supertask (infinite bounces in finite time). Or if we have a different setup that does oscillate without settling? Then the underdetermination reply would be correct: the limit state is not fixed by the pre-limit evolution and must be set by a separate stipulation.

  Now, objection by Thomson's defender: 
  They might say that in this scenario, the lamp being off at T is not because of the supertask but because of the continuous contact. They might argue that the supertask part (the infinite toggling) is irrelevant and that the lamp is off simply because the ball is on the ground. They might say that the infinite toggling does not "do" anything that affects the outcome at T; it is just a side effect.

  But note: the problem requires that the indicator changes state infinitely many times. So the supertask is present. And the outcome at T is determined by the mechanical state, which is the result of the entire evolution (including the infinite bounces). Without the infinite bounces, the ball wouldn't be at rest at T.

  Another objection: they might say that the coupling rule is not a "pure" lamp but a state that depends on contact. In Thomson's lamp, the lamp is toggled by a switch that is activated by an external mechanism (the push button). In our case, the lamp state is defined by contact. But the problem allows coupling rules. We have a local coupling: at each time, the lamp state is determined by whether the ball is touching or not. That is local.

  Alternatively, they might argue that in the bouncing ball supertask, the ball is at rest at T and the lamp is off, but that is not a counterexample to Thomson because Thomson's lamp is about a switch that toggles the state. In our case, the lamp state is not being toggled independently; it is being set by the contact. So they might say that the lamp is not being "switched" in the same way.

  But note: the problem says the indicator changes state. In our case, it does change state at every bounce (from on to off and off to on). So it is switching. And the switching is generated by the system's evolution (the bounces).

  Moreover, the problem allows coupling rules that are local. We have that.

  So the objection might be that the outcome is determined by the continuous state (contact) and not by the switching history. And that is exactly the point: we break Thomson's argument by having the state at T fixed by the mechanical state at T, not by the history of the lamp.

  Therefore, I think the scenario works.

  Let me write the scenario in a paragraph:

  A point mass (ball) is dropped from height h0 above a rigid horizontal floor. Collisions with the floor are inelastic with coefficient of restitution r (0<r<1). The ball bounces infinitely many times, with bounce times accumulating at a finite time T. The indicator is a lamp that is off when the ball is in contact with the floor and on otherwise. The lamp toggles at each bounce: off during contact and on during flight. At time T, the ball is at rest on the floor, so the lamp is off.

  Now, the demonstration:

  1. Thomson's first half: "it cannot be on at T". This works: if it were on at T, then the ball would not be in contact at T. But the dynamics require the ball to be at rest and in contact at T. Contradiction. So it cannot be on.

  2. Thomson's second half: "it cannot be off at T". This breaks: if we only consider the lamp's history, we might think there must be a last time it was on, but there isn't. However, the lamp is off at T because the ball is in contact at T. The absence of a last on time does not prevent the lamp from being off at T because the off state is not caused by a switching event at T but by the continuous condition of contact.

  The underdetermination reply is not available because the coupling rule (which is part of the setup) and the dynamics together determine the state at T: the ball is at rest and in contact, so the lamp must be off.

  The single feature doing the work: the system reaches a mechanical limit state (ball at rest on the ground) that is not oscillatory and the coupling rule uses that state. If we remove the inelasticity (set r=1), then the ball bounces forever and never stops. Then the lamp would toggle forever and the state at T is not determined by the dynamics (since the ball is not at T). The underdetermination reply would then be correct: we must stipulate the state at T.

  Objection: a defender of Thomson might say that in this scenario, the lamp's state at T is not a consequence of the supertask but of the continuous state of contact, and that the infinite switching is incidental. They might argue that the lamp is not really being "switched" at the limit but is set by a separate condition. However, the problem allows the coupling rule to be local and state-dependent. Moreover, the supertask is an integral part of the system's evolution to the state at T. Without the supertask (the infinite bounces), the ball would not come to rest at T. So the outcome is a consequence of the entire process.

  Therefore, the objection does not land: the scenario satisfies all the specifications and breaks Thomson's argument by showing that the state at the limit instant can be determined by the mechanical state even when the history of the indicator does not converge.
answer: |-
  ### Scenario: Bouncing Ball Lamp
  A point mass (ball) is dropped from height \(h_0 > 0\) above a rigid horizontal floor under gravity \(g\). Collisions are inelastic with coefficient of restitution \(0 < r < 1\), leading to infinitely many bounces before time \(T = t_0 + \sqrt{2h_0/g} \cdot (1 + 2r)/(1 - r)\). A lamp is coupled to the ball: it is **on** when the ball is not in contact with the floor, **off** when in contact. The lamp toggles at each bounce, with no last bounce before \(T\). At \(T\), the ball is at rest on the floor, so the lamp is off.

  ### Demonstration
  1. **Thomson’s argument breakdown**:
     - *"Cannot be on at \(T\)" half*: Valid. If the lamp were on at \(T\), the ball would not be in contact with the floor. But dynamics dictate that at \(T\), the ball is at rest and in contact (energy dissipated). Contradiction.
     - *"Cannot be off at \(T\)" half*: **Breaks**. Thomson assumes a last "on" state must precede "off", but there is no last bounce (last "on" time). Here, "off" at \(T\) arises from the *continuous mechanical state* (ball-floor contact), not a final switching event. Thomson’s move silently relies on the premise that the indicator’s limit state *must be determined solely by the sequence of its past states*, ignoring the underlying physics at the limit instant. The halves are not independent; both fail if the limit state depends on real-time physics, not history.

  2. **Limit state derivation**:
     - By energy dissipation, the ball’s height and velocity approach 0 as \(t \to T^-\). The equations of motion (\(y(t) = h_0 - \frac{1}{2}gt^2\) for free fall) and collision dynamics (\(v_{\text{after}} = -r v_{\text{before}}\)) show the ball converges to rest at \(y=0\) at \(T\). The coupling rule (lamp off iff contact) forces the lamp off at \(T\). Assuming on at \(T\) violates mechanics: it implies no contact, but the ball cannot levitate.

  3. **Why underdetermination fails**:
     The description is complete: the coupling rule and dynamics uniquely determine the limit state. Stipulation is unnecessary because the ball’s rest state at \(T\) is a necessary consequence of the force law (gravity) and dissipation (coefficient \(r\)), not an arbitrary choice.

  4. **Key feature and its removal**:
     - **Feature**: Energy dissipation (coefficient \(r < 1\)).  
     - **Removal**: If \(r = 1\) (elastic collisions), bounces continue indefinitely with constant period, no accumulation at \(T\), and no rest state. The lamp’s state at \(T\) is undefined by dynamics, making underdetermination correct—stipulation is needed.

  5. **Objection and rebuttal**:
     - **Objection**: The lamp’s state is "smuggled in" by the coupling rule; it’s not a "genuine" supertask because the infinite switching doesn’t *cause* the outcome—contact does. Thomson’s lamp requires deliberate toggling, not passive physics.
     - **Rebuttal**: **Does not land**. The coupling rule is local and physically grounded (e.g., a pressure sensor), satisfying (3) and (4). The supertask (infinite toggling) is generated intrinsically by the dynamics and *enables* the rest state (via dissipation). "Passive" supertasks are valid; Thomson’s argument targets any infinite process with a binary indicator.

  ### Non-cheating verification
  - **Physics**: Newtonian mechanics, finite energy (\(mgh_0\)), bounded velocity, finite region (ball confined to \(y \geq 0\)).
  - **Limit determinacy**: Derived from laws, not stipulated. Time-reverse fails: it requires spontaneous energy increase, violating dissipation.
  - **No clause-free version**: If we remove dissipation (e.g., elastic bounces) or make coupling history-dependent, underdetermination reappears. Thus, dissipation is essential for determinacy without stipulation.
