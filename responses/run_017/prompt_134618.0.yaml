prompt: |-
  I am a fourth-year PhD student in systems neuroscience, and my PI has asked me to draft a one-page interpretation guide for the lab: a short written procedure that anyone in the group — including first-year rotation students with no philosophy background — can run on a single sentence before it goes into a paper, a preprint, or a grant abstract, in order to decide what we are entitled to say when we write that some neural population computes, encodes, represents, or implements something, and what we are not.

  The setting: we produce sentences of this shape dozens of times per manuscript, they are the sentences reviewers have started attacking in our last three submissions, and the lab has made a public commitment to not overclaiming in abstracts. So the stakes are reputational and practical rather than purely theoretical. The constraints are that the procedure must be runnable in about ten minutes on one sentence, must not require new experiments or any formalism beyond what a first-year can follow, and must be signed off by my PI — which means it has to say plainly which steps are tests and which are judgment calls being handed to her.

  What I need is the work of translation: the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the remaining question to a person because the issue is one of values or of theoretical taste rather than fact.

  I have three half-formed ideas about where our disputes actually come from, and I want you to use them, repair them, or replace them with better cuts.

  First, I suspect we are not making one kind of claim but three, and that most of our arguments are cases of one person meaning one and another hearing another: a descriptive claim (the formalism is a compact summary of a measured response profile); an intervention-licensing claim (the formalism lets you predict what the system will do under interventions or stimuli you have not measured, because the mapping from physical states to formal states is fixed independently of the outcome being predicted); and a constitutive claim (the system performs the cognitive job in question because it computes that function — the formalism is doing explanatory work, not bookkeeping). I would like the verdict of the procedure to be one of these labels rather than a yes or no, and I would like it to return an error when the intended reading has not been stated, forcing us to choose.

  Second, the mapping is where I think most of the cheating happens, in two directions. The mapping from neural variables to formal variables is usually estimated on the same data used to test the claim, and can be re-estimated whenever behaviour changes, so the claim survives every outcome by moving the mapping — I think of this as mapping drift, and I want a preregistration-style step that fixes the mapping and the failure condition before the held-out data are looked at. In the other direction, the population itself can be re-carved until it fits, and a good deal of the formal machinery often lives outside the animal, in an offline decoder that only an experimenter can read out; a claim that the circuit computes X then turns out to be a claim that X is recoverable from the circuit by us. I want the procedure to be able to say that the computation was completed in the analysis pipeline rather than in the brain.

  Third, I do not see how to get from passing individual claims to the sentence our grant framing depends on, the brain is a computer. Computation claims do not seem to aggregate: a decomposition that works for one assayed circuit is not automatically part of a single coherent decomposition of the whole animal, and the question of whether the constitutive reading has to hold of the organism looks to me like a commitment rather than a result.

  Please run the finished procedure on three claims. First: direction-selective circuits in the retina compute the axis of visual motion. Second, and this is the one I expect not to like — my own thesis claim, that dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions, where the evidence is a decoder trained offline on choice behaviour and the mapping is re-fit whenever the task changes; if the procedure exempts my own claim I will have written a useless document, so I want the honest output. Third: a cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy — where I worry the procedure either returns a yes and collapses into the triviality that any system computes anything under some mapping, or returns a no and cannot tell me what the in-brain case has that this one lacks.

  Finally, say what the procedure cannot do, including whether it can say anything at all about whether the brain is a computer, and flag in the guide's own voice the cases where it is likely to misfire. Please do not give me a literature review or references; I will insert citations myself.
reasoning: |-
  We are designing a procedure to analyze a single sentence that uses terms like "compute", "encode", "represent", or "implement". The goal is to classify the claim into one of three types (descriptive, intervention-licensing, constitutive) and to flag common issues (like mapping drift or external computation). The procedure must be runnable in about 10 minutes by anyone, including first-year students, and must clearly distinguish between testable conditions and judgment calls.

   Procedure Outline:
   1. Identify the key terms and the claimed function.
   2. Determine the intended claim type (descriptive, intervention-licensing, constitutive) by asking the author. If not stated, return an error.
   3. Check for mapping drift: ensure the mapping from neural variables to formal variables is fixed and pre-specified, and that the failure conditions are set before testing on held-out data.
   4. Check for external computation: determine whether the computation is performed by the neural population in real-time or only recoverable offline by an external decoder.
   5. Check for re-carving: determine if the neural population is defined independently of the function (i.e., not redefined to fit the function).
   6. Based on the above, assign one of the three labels and flag any issues.

   Steps in Detail:

   Step 0: Preparation
     - Have the sentence in front of you. Identify the neural population and the function (what it is said to compute, encode, represent, or implement).

   Step 1: Claim Type Identification (Judgment call by the author, but must be stated)
     - Ask the author: "Which of the following three types of claim are you making?
          A. Descriptive: The formalism compactly summarizes measured responses.
          B. Intervention-licensing: The formalism allows prediction of system behavior under new interventions or stimuli because the mapping from physical states to formal states is fixed and independent of the outcome.
          C. Constitutive: The system performs the cognitive function because it computes that function; the formalism is explanatory, not just bookkeeping."
     - If the author cannot choose one, return: "Error: Claim type not specified. Choose A, B, or C and re-run."
     - Record the chosen type.

   Step 2: Mapping Drift Check (Testable condition)
     - Question: "Was the mapping from neural variables (e.g., firing rates, patterns) to formal variables (e.g., direction of motion, cost-benefit difference) fixed in advance (e.g., by a pre-specified algorithm or a mapping defined on independent data) and then held constant when testing on held-out data?"
          - If yes, proceed.
          - If no, then: 
              - For claim types A (descriptive) and B (intervention-licensing): Flag a warning: "Mapping was not fixed in advance; the claim may be overfitted to the data. For type B, the intervention-licensing power is compromised."
              - For claim type C (constitutive): Return "Fail: constitutive claims require a fixed mapping that is not re-tuned to the data. The claim must be rephrased as descriptive or intervention-licensing, or the mapping must be fixed and pre-specified."
          - If the mapping was fixed in advance, note that the test passes.

   Step 3: External Computation Check (Testable condition)
     - Question: "Is the computation performed by the neural population in real-time (i.e., without the need for an external decoder that was not part of the system during the experiment) and in a way that the output is used by the system (e.g., for behavior or by downstream neurons)?"
          - If yes, proceed.
          - If no, then:
              - For claim types A and B: Flag a note: "The computation is only recoverable offline by an external decoder. This does not necessarily invalidate the claim but limits its interpretation to descriptive or predictive (not constitutive)."
              - For claim type C: Return "Fail: constitutive claims require that the computation is performed by the system in real-time and used by the system. This appears to be an external computation (done in the analysis pipeline)."
          - Also, note: If the neural population is defined in a way that only an external decoder can read it (e.g., by a decoder trained on the entire dataset), then it is external.

   Step 4: Re-carving Check (Testable condition)
     - Question: "Was the neural population defined independently of the function (i.e., based on anatomical, genetic, or response properties that are not tailored to the specific function being claimed) and then shown to exhibit the function without redefining the population?"
          - If yes, proceed.
          - If no, then:
              - For all claim types: Flag a warning: "The neural population was re-carved (redefined) to fit the function. This may overstate the specificity of the function to that population."
              - Note: This does not automatically fail the claim, but it weakens it.

   Step 5: Output
     - If the claim is type C (constitutive) and failed Step 2 or Step 3, then the claim must be downgraded to type A or B (if the author agrees) or reworked.
     - Otherwise, output the claim type and any flags.

   The verdict: The claim is labeled as one of:
        - Descriptive Claim (with any warnings)
        - Intervention-licensing Claim (with any warnings)
        - Constitutive Claim (if it passed Steps 2 and 3, with any warnings from Step 4)

   Additionally, if the claim is about a system that is not in the brain (like a cultured network) and is type C, we must be cautious. The procedure does not automatically rule out non-biological systems, but Step 3 (external computation) and Step 2 (mapping drift) apply.

   What the procedure cannot do:
     - It cannot settle philosophical disputes about the nature of computation in the brain (e.g., whether the brain is a computer). It can only classify the specific claim.
     - It cannot aggregate claims to justify a global claim (like "the brain is a computer") because that would require additional arguments about coherence and decomposition that are beyond the scope of a single sentence.
     - It is not a statistical test and does not replace proper experimental design.

   Cases where it might misfire:
     - When the mapping is fixed by a well-established method (e.g., using a standard decoder from prior work) but the held-out test is not done: then Step 2 might pass on the mapping being fixed, but without held-out data, the predictive power (for type B) is not tested. We rely on the user to have done the proper validation.
     - When the system is very simple (e.g., a single neuron) and the claim is about representation: the procedure might allow a constitutive claim if the conditions are met, but some might argue that a single neuron cannot "compute" in the constitutive sense. This is a judgment call left to the PI.

   Now, run the procedure on the three examples:

   Example 1: "Direction-selective circuits in the retina compute the axis of visual motion."

   Steps:
    Step 1: Assume the author chooses C (constitutive). [This is a classic claim and often intended as constitutive.]
    Step 2: The mapping is typically fixed: the circuit's wiring (e.g., starburst amacrine cells) creates a fixed mapping from motion direction to neural responses. The mapping is not re-tuned per task. Pass.
    Step 3: The computation is performed in real-time by the retina and used by downstream systems (e.g., in the optic nerve). Pass.
    Step 4: The circuit is defined anatomically and functionally (direction-selective ganglion cells) independently of the motion axis. Pass.
    Output: Constitutive Claim.

   Example 2: "Dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions."

   Steps:
    Step 1: Assume the author chooses C (constitutive). [As the student's thesis claim, it might be intended as constitutive.]
    Step 2: The mapping (from neural activity to cost-benefit difference) is re-fit whenever the task changes. This is mapping drift. 
          For a type C claim: Fail. The claim must be downgraded or the mapping fixed. The procedure returns: "Fail: constitutive claims require a fixed mapping that is not re-tuned to the data."
          If the author changes to type B (intervention-licensing): then we flag a warning for mapping drift and proceed.
    Step 3: The evidence is a decoder trained offline. The computation is not shown to be performed in real-time or used by the system. 
          For type C: This would be an additional fail (but we already failed at step 2). 
          For type B: We flag: "The computation is only recoverable offline by an external decoder. This limits the claim to predictive (intervention-licensing) and not constitutive."
    Step 4: The population (dACC) is defined anatomically and not re-carved for this function? Probably pass, but note that if the exact neurons used were selected based on the function, then flag. We'll assume it's a standard anatomical region so pass.
    Output for type C: Fail. 
    If downgraded to type B: Intervention-licensing Claim with warnings: mapping drift and external computation.

   Example 3: "A cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy."

   Steps:
    Step 1: The author might choose C (constitutive) because they want to say the network is performing the computation.
    Step 2: The mapping from neural activity to the control policy (e.g., steering commands) is likely fixed by the training procedure? But note: the training adjusts the network until it performs the task. The mapping might be defined by the decoder that reads out the activity. If the decoder is fixed after training and then tested on held-out data without retraining, then it passes. Otherwise, if the decoder is retrained for each new test, then mapping drift. We'll assume the mapping (decoder) is fixed after training and then tested. Pass.
    Step 3: The computation is performed in real-time? The network is controlling the vehicle in real-time? Yes, if the setup is closed-loop. But note: the output is read by an external decoder that sends commands to the simulation. The cultured network itself does not have the output as part of its natural function (unless we consider the entire system including the decoder). However, the claim is about the network. So the network alone does not produce the output without the decoder. Therefore, the computation is external (the network's activity is decoded by an external system). 
          For type C: Fail because the network alone does not perform the control policy without the external decoder.
          But note: the training might have shaped the network to carry the necessary information. However, without the decoder, the network does not output the control signal. So the computation is completed in the pipeline.
    Step 4: The neural population is the entire network on the array, so not re-carved? Pass.
    Output for type C: Fail (due to Step 3). 
    Alternative: The author might argue the entire system (network + decoder) computes the policy. Then the claim should be about the system. But the sentence says "a cultured network ... computes". So the network alone is claimed.

    If the author chooses type B (intervention-licensing): 
          Step 2: Pass (if mapping fixed and tested on held-out data).
          Step 3: Flag: "The computation is only recoverable via an external decoder. This is acceptable for intervention-licensing claims but note that the network alone is not producing the output."
          Output: Intervention-licensing Claim with warning.

   What the procedure cannot do:
     - It cannot establish that the brain is a computer. It only evaluates specific claims. The global claim would require that the entire brain's activity can be coherently described as computing (which is a matter of theoretical commitment and not testable by one experiment).
     - It cannot resolve disputes about the boundaries of a neural population (this is handled by Step 4, but it is a judgment call).
     - It does not cover all possible issues (e.g., whether the function is the right one among alternatives).

   Guide's voice for misfire cases:
     - The guide should include a note: "This procedure is a heuristic. It is most reliable for claims about well-defined neural populations and functions. It may misfire in cases of complex, distributed computations or when the mapping is defined in a non-standard way. When in doubt, consult the PI."

   Now, we write the one-page guide as a step-by-step procedure.
answer: |-
  ### Neural Computation Claim Interpretation Guide  
  **Purpose**: To standardize evaluation of claims that a neural population "computes," "encodes," "represents," or "implements" a function (e.g., "dACC computes cost-benefit comparisons"). Run this on individual sentences before submission. Time: ≤10 min.  
  **Output**: Classifies claims as **Descriptive (D)**, **Intervention-Licensing (IL)**, or **Constitutive (C)**, flags mapping issues, and halts or escalates unresolved judgment calls to the PI.  

  ---

  #### Step 1: Identify Claim Type (Author Judgment → PI Escalation)  
  *Ask the author: "Which of the following is this claim?"*  
  - **D (Descriptive)**: The data is compactly summarized by a formalism (e.g., "tuning curves encode motion direction").  
  - **IL (Intervention-Licensing)**: The formalism predicts outcomes under *novel interventions/stimuli* without re-fitting (e.g., "retinal circuits predict motion under new lighting").  
  - **C (Constitutive)**: The system *performs a cognitive function* *because* it computes this (e.g., "direction selectivity *explains* motion detection").  
  **→ If unclear**: Halt. Return: "Error: Claim type unspecified. Consult PI." *Do not proceed.*  

  #### Step 2: Check Mapping Rigidity (Test → Pass/Fail)  
  *Ask: "Was the mapping from neural activity to formal variables (e.g., 'spikes → cost-benefit values') fixed *before* testing on held-out data?"*  
  - **Pass**: Mapping defined via preregistered method, independent dataset, or fixed model (e.g., motion axis from pre-specified retinal wiring).  
  - **Fail**: Mapping re-fit to new data/tasks (e.g., decoder retrained per task change).  
  **→ Outcome**:  
    - Fail + **C/IL claim**: Halt. Return: "Overclaim: Mapping drifts. Downgrade to **D** or rework."  
    - Fail + **D claim**: Flag warning but proceed.  
    - Pass: Proceed.  

  #### Step 3: Check Computation Locus (Test → Pass/Fail)  
  *Ask: "Is the computation performed *online* by the system (not just offline by our analysis)?"*  
  - **Pass**: Output is used by downstream circuits/behavior in real-time (e.g., retinal motion signals drive eye movements).  
  - **Fail**: Output only recoverable via external decoders (e.g., activity decoded offline to "read" cost-benefit values).  
  **→ Outcome**:  
    - Fail + **C claim**: Halt. Return: "Overclaim: Computation external. Downgrade to **D/IL**."  
    - Fail + **IL/D claim**: Flag: "Computation offline; constitutive claims invalid."  
    - Pass: Proceed.  

  #### Step 4: Check Population Independence (Test → Flag)  
  *Ask: "Was the neural population defined *independently* of the claimed function?"*  
  - **Yes**: Defined by anatomy, connectivity, or response properties *before* functional assay (e.g., "dACC" via atlas, not cherry-picked neurons).  
  - **No**: Population carved/redefined post hoc to fit the function.  
  **→ Outcome**: Flag if "No": "Warning: Population re-carving may overstate specificity."  

  ---

  #### Final Output  
  - **Label**: **D**, **IL**, or **C**.  
  - **Flags**: Mapping drift, external computation, population re-carving.  
  - **Escalation**: Steps 1 (claim type) and contentious flags require PI review.  

  ---

  ### Test Cases  
  1. **Claim**: "Direction-selective retinal circuits compute the axis of visual motion."  
     - Step 1: **C** (constitutive: explains motion detection).  
     - Step 2: **Pass** (fixed wiring; e.g., null-direction inhibition).  
     - Step 3: **Pass** (drives optokinetic reflexes in real-time).  
     - Step 4: **Pass** (circuits defined anatomically).  
     → **Output: Constitutive (C)**.  

  2. **Claim**: "Dorsal anterior cingulate computes a comparison of costs and benefits of candidate actions."  
     - Step 1: **C** (constitutive).  
     - Step 2: **Fail** (decoder re-fit per task change → mapping drift).  
     - Step 3: **Fail** (offline decoder; no real-time use shown).  
     → **Output: Halt. "Overclaim: Mapping drifts + external computation. Downgrade to D/IL."**  

  3. **Claim**: "A cultured cortical network computes a control policy to steer a simulated vehicle."  
     - Step 1: **C** (constitutive: implies network performs control).  
     - Step 2: **Pass** (e.g., fixed decoder after training).  
     - Step 3: **Fail** (policy read out by external electrodes; no embedded output).  
     → **Output: Halt. "Overclaim: Computation external. Downgrade to D/IL."**  
     *Note: Distinction from in-brain case (e.g., Step 3 pass) is real-time, embedded use of output.*  

  ---

  ### What This Guide Cannot Do  
  1. **Aggregate claims**: Cannot justify "the brain is a computer" from individual claims. Constitutive claims do not sum to a unified computational theory of the organism—this is a *theoretical commitment*, not a testable output.  
  2. **Resolve philosophical disputes**: Cannot arbitrate whether a function is "truly" computed (e.g., trivial mappings: any system computes anything under some abstraction). Relies on empirical checks (Steps 2–3) to avoid this.  
  3. **Replace validation**: Does not assess statistical robustness, only claim coherence.  
  4. **Cover all cases**: Likely to misfire when:  
     - Functions are abstract (e.g., "represents value") without clear input/output.  
     - Systems lack natural outputs (e.g., cultured networks without behavioral hooks).  
     - "Online" computation is inferred indirectly. Escalate these to the PI.  

  **Final Note**: This guide forces specificity in claims and exposes overreaching. When Steps 2–3 pass, **C** claims are defensible; when they fail, **D/IL** claims keep us honest. Use it, but remember: no procedure substitutes for intellectual humility.
