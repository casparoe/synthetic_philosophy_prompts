prompt: |-
  I am trying to write down, in advance of reading any more of the literature, what I should be demanding of a population axiology given the job I actually need it to do. Please write that specification.

  The job: I need an ordering over *policy options*, not over timeless population states. The options available to the institution I advise differ simultaneously in (i) the quality of life of the people who will exist on all of the options, (ii) how many people there will ever be — via birth timing, family-planning and maternal-health funding, or interventions on existential risk that move the expected size of the future by orders of magnitude — and (iii) how well any of that can be known in advance. So the thing to be ranked is a risky prospect over histories, and adequacy means adequacy for choosing under that kind of uncertainty.

  Write the desiderata: which comparisons the ordering must get right, which cases it must dissolve or explain rather than dodge, which distinctions it must respect and which it may collapse, and the consideration behind each. Mark which requirements you take to be non-negotiable for this purpose and which are the preferences of a particular camp. Then the part I most want: flag any subset of the requirements you suspect is jointly unsatisfiable, sketch the argument, and say which single requirement does the most work in excluding candidate views. If two of my own requirements below are really one requirement, or are not requirements at all, say so.

  Three candidates of mine, which I want kept, sharpened, or rejected as confused:

  1. *Grain-invariance.* The ranking of two options must not change when the very same history is redescribed at a finer temporal or personal grain — as persons, or as person-stages, or as processes with fuzzy boundaries. If a view's verdicts swing with the bookkeeping, I want to know whether that is a feature of the view or a reductio of it.

  2. *Individuation-robustness.* Consider a population of software persons where minds can split into two successors and two can merge into one, so that at a given time there may be no fact of the matter how many people there are. The axiology must still rank options in which such entities figure, and the ranking must not be a function of an arbitrary counting convention imposed on a continuum of intermediate cases.

  3. *Actionability under cluelessness.* Every real option seems to have small-probability effects on enormously large far-future populations, so a theory whose verdicts are always dominated by speculative tails may be unusable for the job I have described — unless the view also tells the agent what to do when that happens. I cannot tell whether this is a genuine desideratum or an impatience of mine that a theory is entitled to ignore.

  My suspicion going in is that avoiding the repugnant conclusion, honouring the step-by-step pull of mere-addition reasoning, and ranking different-number comparisons at all while staying transitive cannot all be had together, and that the costs of giving up each are not alike — but I would rather see the conflict located precisely than confirmed. Close with a scorecard of at most a few lines each for total utilitarianism, average utilitarianism, critical-level views, and person-affecting or restrictive views, and name any requirement that none of them meet.
reasoning: |-
  Okay, the user is asking for help in defining a specification for a population axiology that's tailored to their specific needs. They need to rank policy options under uncertainty, considering variable population sizes, quality of life, and deep uncertainty about outcomes. They've already thought about some key requirements: grain-invariance, individuation-robustness, and actionability under cluelessness. They also mentioned concerns about avoiding the repugnant conclusion while respecting mere-addition reasoning and maintaining transitivity.

  First, I need to unpack their main job: advising on policies that affect both existing and future populations, with risks and uncertainties. The axiology must handle different-number comparisons and probabilistic outcomes. Their three candidate requirements are crucial. Grain-invariance ensures that the ranking doesn't change with how we describe individuals or time periods. Individuation-robustness deals with non-standard entities like minds that split or merge, so the theory shouldn't rely on arbitrary counting. Actionability under cluelessness addresses the problem of small-probability events affecting huge future populations, which could make decisions paralyzing if the theory is too sensitive to speculative tails.

  The user suspects conflicts between avoiding the repugnant conclusion, mere-addition, and transitivity. I recall that in population ethics, these often clash. For example, total utilitarianism leads to the repugnant conclusion, while average utilitarianism avoids it but fails mere-addition. Critical-level theories might avoid repugnance but face their own issues with transitivity or cluelessness. Person-affecting views struggle with different-number cases. The user needs clarity on which requirements are non-negotiable. Grain-invariance and individuation-robustness seem essential for consistency, while actionability might be a pragmatic need but could conflict with theoretical completeness.

  Deep uncertainty is a key challenge. When every policy has tail risks affecting vast future populations, a theory dominated by these tails becomes impractical. The user might be implying a need for a decision rule that allows ignoring sufficiently speculative scenarios, but how to formalize that without arbitrariness? Also, they want the theory to handle cases where populations aren't clearly individuated, which rules out theories relying on fixed person-counts.

  Possible conflicts: Grain-invariance might require that value functions are linear and additive, which could push towards total utilitarianism, but that clashes with avoiding repugnance. Mere-addition pulls towards accepting some population increases even with lower average welfare, but avoiding repugnance requires resisting that at large scales. Transitivity forces a choice—either accept repugnant outcomes or reject mere-addition at some point. Actionability under cluelessness might necessitate bounded utility functions or variance sensitivity, but standard theories don't incorporate that.

  For the scorecard, total utilitarianism fails repugnance and cluelessness; average utilitarianism fails different-number comparisons and mere-addition; critical-level avoids repugnance but may have intransitivities and issues with uncertainty; person-affecting views fail different-number cases entirely. None handle individuation-robustness well except perhaps total utilitarianism if extended to continuum cases, but even that's shaky. Actionability is the biggest gap across all theories.

  The user's deeper need might be for a practical framework that doesn't get bogged down by theoretical impossibilities. They might prioritize having a workable decision-making tool over theoretical purity. So, emphasizing which requirements can be relaxed (like strict avoidance of repugnance) or which trade-offs are necessary would be helpful. Also, suggesting a decision rule that incorporates uncertainty, like a variance-adjusted expected utility, could address cluelessness even if not part of the axiology itself.
answer: |-
  Here is a specification tailored to your stated purpose, analyzing your requirements, identifying conflicts, and scoring major views:

  **Core Job:** Rank policy options (risky prospects over histories) differing in:
  (i) Quality-of-life trajectories for overlapping populations
  (ii) Total population size (via birth rates, timing, existential risk)
  (iii) Deep uncertainty (especially small-probability, high-impact tails)

  **Non-Negotiable Desiderata (for your purpose):**

  1.  **Different-Number Comparability:** *Must* rank options involving different total population sizes. Essential for comparing policies affecting future size (e.g., x-risk reduction vs. near-term welfare boost).
  2.  **Probabilistic Coherence:** *Must* handle prospects under uncertainty. Ranking must integrate with a rational decision rule under risk/uncertainty (e.g., Expected Utility, or a well-defined alternative). Axiology must not inherently preclude this. (*Consideration:* Real policies involve risk).
  3.  **Temporal Grain-Invariance:** Ranking of *histories* must be invariant under redescriptions of temporal or personal grain (persons, stages, fuzzy processes). (*Consideration:* Avoids arbitrariness; bookkeeping shouldn't change ethical substance. Your #1).
  4.  **Individuation-Robustness:** Ranking must be well-defined and non-arbitrary for entities with fuzzy/fission/fusion identities, without relying on a specific counting convention. Must handle continua. (*Consideration:* Future persons/agents may not fit classical atomistic models. Your #2, essential for generality).
  5.  **Dominance Respect:** If Prospect A yields *at least as good* a history as Prospect B in *every possible state of the world*, and strictly better in some, A must be ranked above B. (*Consideration:* Foundational rational choice principle).

  **Important, But Potentially Negotiable Preferences:**

  6.  **Avoid Repugnant Conclusion (RC):** Avoid implying that a massive population with lives barely worth living is better than a small, flourishing population (all else equal). (*Consideration:* Strong intuition against RC; seen as reductio by many. *Not* universally agreed upon).
  7.  **Mere Addition Acceptability (MAA):** If adding individuals with lives worth living (without harming others), the resulting state should be considered at least *not worse* than the original state. (*Consideration:* Intuitive step-by-step pull. *Not* universally agreed upon, often conflicts with RC avoidance).
  8.  **Actionability Under Cluelessness (AUC):** The theory/ranking should not be *systematically dominated* by speculative tail effects in a way that paralyzes decision-making or renders near-term effects irrelevant *in practice*. *Requires either:* (a) Built-in dampening of tail sensitivity, (b) Clear guidance (e.g., a decision rule) for when to disregard sufficiently speculative tails, or (c) Robustness of core recommendations to tail uncertainty. (*Consideration:* Pragmatic necessity for advising. Your #3 - genuine desideratum for *usability* in your role, though theorists may debate its "purity").

  **Clarifications & Mergers:**

  *   **Grain-Invariance & Individuation-Robustness:** These are distinct but deeply related. Grain-invariance focuses on *redescription* of fixed underlying entities. Individuation-robustness focuses on *ontologically fuzzy* entities. Both demand invariance under metaphysical/conceptual shifts. Keep both.
  *   **Actionability Under Cluelessness:** This *is* a genuine requirement for your specific job (policy advising under deep uncertainty). It's not mere impatience; it's about the *practical applicability* of the axiology in the face of radical uncertainty. Elevate it from "candidate" to core desideratum (though mark its pragmatic nature).

  **Suspected Conflicts & Key Excluder:**

  *   **The Core Trilemma:** **Different-Number Comparability + Transitivity + Avoid RC + Mere Addition Acceptability** appear jointly unsatisfiable (Parfit's core impasse).
      *   *Sketch:* Start with A (small, high welfare). Add group B (large, minimally positive welfare) without harming A → Mere Addition suggests (A+B) not worse than A (MAA). Now, gradually reduce A's welfare to minimal positive (via non-worsening steps, respecting MAA/transitivity?) while increasing B's size → Arrive at Z (enormous population, minimal welfare). Z is RC-repugnant. Avoiding RC requires rejecting MAA at *some* step or rejecting transitivity *for these comparisons*. Different-Number Comparability forces the ranking.
  *   **The Uncertainty Trilemma:** **Probabilistic Coherence (EU) + Different-Number Comparability + AUC** is highly strained. EU with an unbounded value function (e.g., Totalism) makes the expectation dominated by low-probability, huge-population tails. AUC demands this *not* paralyze near-term decisions. Reconciling EU, large-population sensitivity, and AUC likely requires either: (a) A bounded value function (difficult without violating other desiderata like MAA/Dominance), (b) Rejecting EU (controversial), or (c) Ad-hoc tail-truncation rules (violating Probabilistic Coherence).
  *   **Key Excluder:** **Avoiding the Repugnant Conclusion (RC)** does the most work in excluding candidate views. It immediately rules out **Total Utilitarianism** and strongly constrains Critical-Level views (forcing high levels, creating other problems). It's the primary motivator for Average Utilitarianism, Person-Affecting views, and some non-aggregative approaches. Sacrificing RC opens many options; insisting on it significantly narrows the field and intensifies conflicts with MAA and Transitivity.

  **Scorecard of Major Views:**

  1.  **Total Utilitarianism (TU):**
      *   *Meets:* Grain-Invariance (strongly), Individuation-Robustness (best candidate), MAA, Dominance, Different-Number Comparability, Probabilistic Coherence (formally).
      *   *Fails:* Avoid RC (spectacularly), AUC (spectacularly - paralyzed by tails). Person-Affecting intuitions.
      *   *Your Needs:* Fails core RC avoidance & AUC (unusable due to cluelessness).

  2.  **Average Utilitarianism (AU):**
      *   *Meets:* Avoid RC, Grain-Invariance (usually), Probabilistic Coherence (formally), AUC (often, due to dampening).
      *   *Fails:* Different-Number Comparability (often undefined/incoherent), MAA (usually), Individuation-Robustness (heavily relies on counting), Dominance (can violate - adding happy people can lower average).
      *   *Your Needs:* Fails Different-Number Comparability & Individuation-Robustness (fatal).

  3.  **Critical-Level Utilitarianism (CL):**
      *   *Meets:* Avoid RC (if level > 0), Different-Number Comparability, Probabilistic Coherence (formally), Dominance (usually), MAA (if added lives > CL).
      *   *Fails:* AUC (still sensitive to huge populations above CL), Grain-Invariance/Individuation-Robustness (vulnerable, depends on counting/value assignment), MAA (if added lives < CL, it's rejected).
      *   *Your Needs:* Struggles with AUC (tail sensitivity) and Grain/Individuation. CL choice is arbitrary/motivated only by RC avoidance.

  4.  **Person-Affecting / Restrictive Views (PAV - e.g., Narrow, Non-Identity Solution):**
      *   *Meets:* Avoid RC (often), AUC (often), Dominance (for fixed identity cases).
      *   *Fails:* Different-Number Comparability (cannot compare different possible populations meaningfully - core failure), Grain-Invariance/Individuation-Robustness (often rely on fixed identities), MAA (often rejected if additions create "new" persons), Probabilistic Coherence (difficult with non-identity).
      *   *Your Needs:* Fails Different-Number Comparability (fatal for your job) & Grain/Individuation.

  **Requirement None Fully Meet:** **Actionability Under Cluelessness (AUC)**. All standard views either:
  *   Are paralyzed by tail risks (TU, CL),
  *   Fail to properly engage with different-number comparisons and uncertainty simultaneously (AU, PAV), or
  *   Lack a clear, principled mechanism within the axiology/decision rule to manage speculative dominance.

  **Conclusion:** Your specification demands an axiology that navigates the Scylla of the Repugnant Conclusion and the Charybdis of paralysis under deep uncertainty, while also handling non-standard ontologies. The core conflict lies in the RC/MAA/Transitivity trilemma driven by Different-Number Comparability. **AUC** is your most distinctive and challenging requirement, as it demands a theory *usable* by advisors facing radical uncertainty about vast potential futures, a challenge largely unaddressed by standard population axiologies. Prioritizing AUC might necessitate relaxing strict RC avoidance or exploring non-standard decision rules alongside the axiology.
