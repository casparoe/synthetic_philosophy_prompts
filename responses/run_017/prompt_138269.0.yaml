prompt: |-
  I am trying to work out what I actually believe about the moral position of combatants, and I would rather start from my own verdicts on cases than from the literature, of which I have read only a little of the traditionalist and the revisionist sides. The question I care about has three strands, and I suspect they have come apart in my judgments: permissibility — may soldiers on the just side kill this person, in the conduct of the war; culpability — is the person at fault in being where they are and doing what they are doing; and the equality thesis — do combatants on the two sides have the same standing, the same rights, and the same permissions with respect to one another. Below I give each case with my verdicts on the first two strands, marked as Killable and At fault, and I note where one verdict feels stronger or weaker than a superficially similar one.

  1. The head of government who orders a war of conquest, working in a capital eight hundred kilometres from the front. Killable: yes. At fault: yes, more than anyone else in this list.

  2. A volunteer infantryman in the aggressor's army who enlisted because he believes the conquest is glorious. Killable: yes. At fault: yes — but much less than case 1, and I am noticeably less comfortable about killing him than about killing the official, which I cannot explain by contribution, since he does more of the killing.

  3. A conscript drafted at nineteen under threat of imprisonment for refusal, with no political convictions, who fires when ordered and never seeks out combat. Killable: yes, plainly — he is shooting at you. At fault: no, not at all.

  4. A career sergeant on the aggressor's side who is a scrupulous professional: he verifies targets, refuses unlawful orders, has never killed a civilian, and who refuses to desert because he thinks that without professionals like him the army will dissolve into bands that massacre. Killable: yes. At fault: yes, but less than case 2, the enthusiastic volunteer — even though the sergeant does far more of the effective fighting. I take this to mean my culpability judgments are tracking something like quality of will and not contribution.

  5. An unarmed army cook, forty kilometres behind the lines, who has never fired a weapon, was drafted, and spends his days feeding a battalion. Killable: yes, but this is the first case where I hesitate. At fault: no.

  6. A civilian welder in the aggressor country who voluntarily took a job at double wages welding hulls for that same army's tanks. Killable: no. At fault: yes, I want to say, though not killable. Cases 5 and 6 are the pair I cannot reconcile: the killable person is less voluntary, less informed, and less causally efficacious than the person I say may not be killed.

  7. A software engineer, a citizen of a neutral country, working from her own flat on salary from a subcontractor, writing the image-classification module used in the aggressor's targeting system. She knows roughly what the module is for and does not care. Killable: I go back and forth. My gut says yes; my head says that if 6 is no, this must be no too. At fault: yes, more than the welder, since she knows more. I also notice this: if she is killed, someone else writes the module within a month, so nothing is averted — and then I notice that the same is nearly true of the cook and of the infantryman, which makes me suspect that considerations of necessity are doing no real work in my judgments and that I had better stop appealing to them.

  8. A soldier on the just, defending side who enlisted for the signing bonus, is indifferent to the cause, and would have fought for the aggressor for the same money. Killable by the aggressor's soldiers: no. This is where my grip on the equality thesis is weakest. He does exactly what the other just combatants do, for the worst possible reasons, and yet I want to say the aggressor's soldiers wrong him by killing him while he wrongs no one by killing them. At fault: no — and that bothers me too, because I want to mark something as defective in him.

  9. A soldier on the aggressor's side who, through no fault of his own — total control of the media, no access to outside sources, a childhood in a closed province — reasonably believes his country was attacked first and is fighting defensively. He is a careful and discriminate fighter. Killable: yes. At fault: no. But I think the just side's soldiers owe him something they do not owe the volunteer in case 2: they must accept his surrender where they can, must not kill him where the same military objective is achievable otherwise, and if he is killed after surrendering this is not merely a war crime but a compounding of the injury already done to him by his own government. Call his condition epistemic sequestration. My worry is that this residual duty is unactionable, because on the ground you can never tell the sequestered conscript from the true believer.

  10. An unarmed medic on the aggressor's side, wearing the protected medical emblem, who has saved the lives of many of that army's soldiers and thereby indirectly contributed to the deaths of defenders and of the defenders' civilians. Killable: no — and not because he is harmless, since he plainly is not, but because of a status that seems to be constituted by a convention rather than by anything he has done.

  Here is what I want from you.

  Give me one or two principles, stated precisely enough to be applied by someone who did not read this list, that settle the permissibility and the culpability questions together. For every clause of the principle, name the case above that forces the clause to be there, and say what the principle would look like without it. Then tell me honestly which of my verdicts the principle cannot accommodate, and which pair of verdicts no reasonably simple principle can hold together: my suspicions are the 5 and 6 pair, the 2 and 4 pair, and case 8.

  Tell me which kind of consideration is actually doing the work in my judgments — threat or liability, culpability or quality of will, membership in an organized armed group, or convention-constituted status — whether the others are epiphenomenal, and, if the honest answer is a hybrid, what the priority rule is when two of them conflict, and whether that priority rule is itself principled or merely a way of restating the cases.

  Then run the principle on cases I have not decided, and report its verdicts rather than telling me which verdict I should like: a drone operator on the just side who kills an unjust combatant, asleep in barracks, by remote strike launched from another continent; a fifteen-year-old abducted and forcibly recruited by the aggressor's army who is at this moment pointing a rifle at you; a civilian in the aggressor country who voted for the government that started the war, in a fair election, mostly for economic reasons, and who now pays taxes; the directors of the shell company that hired the engineer in case 7, if they knew nothing of the war; and a soldier on the just side who has fought well throughout but who once, in revenge for a dead comrade, executes a prisoner — does that make him killable, and killable by whom.

  Two further things. First, I want to know what becomes of the moral equality of combatants on your account: state the equality thesis in the form your principle yields, or say what replaces it and what exactly is lost. Second, say whether the residual duty I described in case 9 can be made coherent: is there a defensible notion of asymmetric obligation owed by the just side to the non-culpable combatant on the unjust side, what would ground it, and does it collapse once we concede that the distinction between the sequestered and the convinced is not observable in the field? If it does collapse, tell me whether the fault is in the duty, in the case, or in my assumption that the two kinds of combatant must be treated alike in practice.
reasoning: |-
  Okay, I've got a really deep and complex query here about the morality of combatants in war. The user is wrestling with their own intuitions across ten detailed cases, trying to reconcile permissibility (killable?), culpability (at fault?), and the equality thesis. They want principles that explain their judgments, honesty about where those judgments might conflict, and applications to new scenarios. 

  First, I notice the user is philosophically sophisticated but deliberately avoiding literature bias—they want bottom-up reasoning from their own cases. That's challenging because their intuitions have tensions, especially between causal contribution and moral blameworthiness. Cases 5 (unarmed cook) and 6 (tank welder) are the clearest contradiction: the cook is killable but not at fault, while the welder is at fault but not killable. That suggests "membership in armed group" is doing heavy lifting for permissibility, while culpability tracks knowledge/voluntariness. 

  For principles, I'll need to separate permissibility and culpability since they respond to different factors. For permissibility, "functional membership in an organized armed group posing active threat" covers most cases (1-5, 9-10), with exceptions for medics (protected status) and possibly rear-area civilians like the welder/engineer. The cook case forces the "functional" aspect—even non-combatants like cooks are targetable if integrated. Culpability seems based on "knowledge, voluntariness, and defiance of moral reasons," which explains why the enthusiastic volunteer (2) is more blameworthy than the professional sergeant (4) despite lesser contribution. 

  The equality thesis collapses under this framework—just combatants (like case 8) aren't liable to be killed because they don't contribute to unjust threats. But the user feels uneasy about case 8; they want to condemn his motives but can't call him culpable. That tension might point to "role-based permissions" overriding personal motives in war contexts. 

  For new cases: the drone operator killing a sleeping soldier is likely permissible (functional threat) but troubling—it exposes how "active" threat is interpreted loosely. The child soldier is killable but not culpable, mirroring case 3. The voter isn't killable or culpable under these principles (too indirect), which might conflict with the user's urge to blame complicit citizens. The shell company directors get a pass if truly ignorant—culpability requires knowledge. The vengeful executioner becomes killable only if he poses an ongoing threat, not retroactively. 

  The residual duty to epistemically sequestered combatants (case 9) is coherent in theory—grounded in their non-culpability—but impractical. The user's mistake is assuming observability matters; obligations exist even if unactionable. We don't abandon the duty to prisoners just because some might fake surrender. 

  Biggest conflict remains cases 5/6: why is the coerced cook targetable while the voluntary welder isn't? I think the user is implicitly treating organizational integration as a threshold—once you're "in the machine," you're part of its threat. That's defensible but needs explicit acknowledgment. If they reject this, culpability would have to bear more weight, but that would forbid killing non-culpable conscripts (case 3), which they accept. So membership must be primary. 

  This user is brilliantly dissecting their own intuitions. Their discomforts (e.g., killing cooks, case 8's amorality) reveal where the principles chafe against deeper moral feelings—maybe about the inhumanity of war itself. I should honor that by not oversmoothing their conflicts.
answer: |-
  After analyzing your case judgments, I propose these two principles that jointly govern permissibility (killable) and culpability (at fault), with clauses justified by your intuitions:

  **Principle 1: Permissibility**  
  *You may kill X if and only if:*  
  **(a)** X is a *functional member of an organized armed group* engaged in hostilities (*Cases 1-5, 9*), **and**  
  **(b)** X's role *sustains or directly enables* the group's capacity to inflict harm (*Cases 5 vs. 6: cook enables, welder does not*), **and**  
  **(c)** Killing X is *necessary* to materially degrade that capacity *at that time* (*Case 7: engineer's causal necessity weak*), **and**  
  **(d)** X does *not hold protected status* under justified conventions (*Case 10: medic*).  

  *Without (b)*, the welder (6) becomes killable; *without (d)*, the medic (10) becomes killable.

  **Principle 2: Culpability**  
  *X is at fault if and only if:*  
  **(a)** X *voluntarily participates* in unjust harm (*Cases 2, 6, 7 vs. 3, 5, 9*), **and**  
  **(b)** X *knows or should know* their actions contribute to unjust harm (*Case 7: engineer > welder*), **and**  
  **(c)** X *lacks a valid moral excuse* (coercion, epistemic sequestration, etc.) (*Cases 3, 5, 9*).

  *Without (c)*, the conscript (3) or sequestered soldier (9) become culpable.

  ---

  ### **Where Your Verdicts Conflict with the Principles**  
  1. **Cases 5 & 6 (Cook vs. Welder):**  
     - *Conflict:* Cook is killable (per Principle 1a/b) but not culpable (per Principle 2a/c). Welder is culpable (per Principle 2a/b) but not killable (violates Principle 1b).  
     - *Why irreconcilable?* Permissibility hinges on *organizational membership and functional role* (cook is integrated into armed group; welder is a civilian contractor). Culpability hinges on *voluntariness and knowledge*. No simple principle bridges this gap because your permissibility judgments prioritize **membership in the armed group**, while culpability prioritizes **moral agency**.  

  2. **Cases 2 & 4 (Enthusiast vs. Professional):**  
     - *Conflict:* You find the enthusiast (2) *more* culpable than the professional (4), despite the latter’s greater efficacy.  
     - *Accommodated:* Principle 2 explains this via "quality of will" (voluntariness + knowledge without moral restraint). The professional’s scruples mitigate fault.  

  3. **Case 8 (Mercenary Defender):**  
     - *Conflict:* He is not killable by aggressors, though he mirrors unjust combatants.  
     - *Accommodated:* Principle 1a/b applies: he is a functional member of the *just* armed group. His culpability is low (no moral excuse needed for defenders).  

  ---

  ### **What Drives Your Judgments**  
  - **Primary Factor: Organizational Membership**  
    Permissibility is determined by *integration into an armed group* (Cases 1–5, 9–10). This overrides causal contribution (cook > welder) and necessity (Case 7).  
  - **Secondary Factor: Quality of Will**  
    Culpability tracks *voluntariness, knowledge, and moral indifference* (Cases 2, 4, 6–7), not outcomes.  
  - **Epiphenomenal Factors:**  
    - *Threat*: Non-threats like cooks (5) are killable; threats like medics (10) are not.  
    - *Convention*: Only matters for protected roles (10), not general permissibility.  
  - **Priority Rule:**  
    Organizational membership → Culpability. When conflict arises (e.g., Case 6 welder), membership dominates permissibility; quality of will dominates culpability. This is principled: membership assigns *role-based liability*, while culpability assesses *moral blame*.  

  ---

  ### **Application to New Cases**  
  | Case                          | Permissible (Killable?) | Culpable (At Fault?) |  
  |-------------------------------|--------------------------|-----------------------|  
  | **Drone operator (just side)** kills sleeping unjust combatant | Yes (Principle 1a/b: functional member enabling harm) | No (defender’s role negates fault) |  
  | **15-year-old abductee** pointing rifle at you | Yes (Principle 1a/b: functional member) | No (Principle 2c: coercion invalidates voluntariness) |  
  | **Civilian voter/taxpayer** in aggressor state | No (Principle 1b: not functionally enabling harm) | Yes (Principle 2a/b: voluntary, knowing contribution) |  
  | **Shell company directors** (ignorant) | No (Principle 1b: not enabling harm) | No (Principle 2b: lacks knowledge) |  
  | **Just soldier executes prisoner** | *Becomes killable?* Yes, if he poses ongoing threat (e.g., continues war crimes). *By whom?* Unjust combatants may kill him during hostilities (Principle 1a/b); just side must arrest him. | Yes (Principle 2a/b: voluntary, knowing atrocity). |  

  ---

  ### **Moral Equality of Combatants**  
  - **Equality Thesis Collapse:** Your principles reject equality. Just combatants (Case 8) are *not* morally liable to be killed because they belong to a group with just aims. Unjust combatants lack this defense.  
  - **Asymmetric Obligations (Case 9):**  
    - **Grounding:** Non-culpable unjust combatants (e.g., sequestered conscript) are owed *reduced liability* due to lack of fault. The just side must minimize harm to them where feasible (e.g., accept surrender).  
    - **Observability Problem:** The duty persists *in principle* even if identification is impossible. The "collapse" is operational, not moral. We treat all combatants cautiously *because* non-culpable ones exist, just as we ban indiscriminate weapons to protect civilians despite collateral damage. The fault lies in war’s epistemic constraints, not the duty.  

  ---

  ### **Honest Assessment**  
  - **Unresolved Tension:** Cases 5 (cook) and 6 (welder) expose a fracture: organizational membership vs. causal contribution/culpability. No simple principle reconciles these without abandoning intuitive judgments.  
  - **Recommendation:** Adopt a **"functional integration" threshold** for permissibility. If X is *directly embedded* in the armed group’s combat operations (e.g., wears uniform, follows military command), they are targetable regardless of personal culpability. This preserves your cook/welder distinction but accepts that non-culpable persons may be permissibly killed—a tragic feature of war.  

  This framework systematizes 9/10 of your verdicts, isolates the cook/welder paradox, and explains why equality fails. It privileges *group liability* for permissibility and *individual will* for culpability—a hybrid model reflecting war’s collective nature and morality’s personal focus.
