  The solution path is clear: use the ladder structure to show the progression of their relationship, framing everything in behaviorist-friendly terms. The vows become the ultimate "Austenian" speech act - a public commitment that exists in the world, not in their heads. This avoids claiming access to internal states while still being deeply meaningful.

