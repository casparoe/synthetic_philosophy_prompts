  The user wants to use Dennett's ladder as the actual structure of the toast: Darwinian (trial by elimination), Skinnerian (reinforcement learning), Popperian (mental simulations), and Gregorian (cultural tools). They also mention a proposed fifth rung - "Austenian" after J.L. Austin's speech acts - which is key because it allows talking about commitments as public actions rather than internal states.

  Key constraints from the user:
  - No Skinner-box jokes (bride's request after years of lab humor)
