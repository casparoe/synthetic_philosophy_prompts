prompt: |-
  In the replication literature I keep meeting a pair of reactions that I cannot tell are consistent. When a well-powered, pre-registered replication of a well-known effect comes back null, the field does not say the hypothesis has been refuted; it says the effect is smaller than published, or context-dependent. The original authors point to differences in population, measure, or procedure, or to unmeasured moderators, and reviews and textbooks go on treating the finding as standing. When the same effect is replicated in a different country with a different measure, nobody calls that context-dependence: it is reported as evidence of generality, and the finding is treated as established.

  Reconstruct the epistemology this pair of reactions presupposes. My suspicion is that the hypothesis actually in play is not that the manipulation raises the outcome, but a quantifier-hedged claim — that there is some nonempty set of populations, measures, and settings in which it does, with the boundaries left unspecified — so that no pattern of results across studies could refute it. Say whether that is right, what such a claim is worth if so, and what would have to be added to make it testable: moderators specified in advance, a stated mechanism, pre-registered predictions of where the effect should be absent.

  Then separate what the practice strictly requires from what it merely fits. Does an error-statistical or severity-based view license the asymmetry, does a Bayesian picture on which the true effect is itself a distribution across contexts license it more naturally, or is it best explained as a convention for assigning credit and blame to researchers? Notice too that on a strict significance-testing logic a null replication is absence of evidence rather than evidence of absence — so tell me whether the reluctance to say *refuted* is the same logic that ought also to stop the field from saying *established* when a replication succeeds.

  A reform has been floated where I work: before a registered replication is run, the original authors file, sealed, the conditions under which they would publicly withdraw the claim, and a failure meeting those conditions counts as a refutation. What does current practice deny that this reform assumes?

  Be explicit about which parts of your reconstruction are common ground among statisticians and philosophers of science who work on replication, which are live disputes, and where you are extrapolating.
reasoning: |-
  Okay, the user presents a complex scenario in scientific replication practices. They've observed an asymmetry in how null replications versus successful replications are treated, and want me to reconstruct the underlying epistemology. 

  First, I need to unpack their core observation: when a replication fails, researchers invoke context-dependence, but when it succeeds in a new context, they claim generality. The user suspects this implies the hypothesis is actually an unrefutable existential claim. 

  I should analyze this through multiple philosophical lenses. The error-statistical view would emphasize how failure to specify moderators in advance prevents proper severity testing. Bayesian approaches might better accommodate effect heterogeneity through hierarchical models. There's also the sociological angle about credit assignment in academia.

  The user asks specifically about testability. The key is moving from "effect exists somewhere" to specifying boundaries and mechanisms. Pre-registered moderators would help, but also require theoretical justification. 

  On their point about significance testing logic: yes, the same caution that prevents declaring "refuted" from one null should prevent declaring "established" from one success. But current practice applies this inconsistently.

  The sealed conditions reform is interesting - it tries to force specificity about what would falsify the claim. Current practice denies that falsification conditions can be objectively defined upfront.

  I should structure this carefully: start with reconstructing the presupposed epistemology, then examine different philosophical perspectives, address testability, and finally evaluate the reform proposal. Need to clearly separate established consensus from contested points.

  The user seems deeply familiar with methodology debates - they use precise terms like "severity-based view." This suggests I can engage at a sophisticated level without oversimplifying. Their frustration with inconsistent standards comes through, so I should validate that while maintaining analytical neutrality.
answer: |-
  Your analysis captures a core epistemological tension in replication debates. Let's reconstruct the presupposed logic, evaluate its validity, distinguish required elements from convenient fits, and assess proposed reforms.

  **Reconstructed Epistemology of Current Practice:**
  1.  **The Core Hypothesis:** The field often implicitly tests a *conditional existence claim*: "There exists *some* set of populations (P), measures (M), procedures (C), and contexts (X) under which manipulation A causes outcome B." (∃P, ∃M, ∃C, ∃X such that A → B).
  2.  **Asymmetry Explained:**
      *   **Failed Replication (Null Result):** Interpreted as finding a specific (P*, M*, C*, X*) where A does *not* cause B. This *fails* to falsify the existential claim (∃P,M,C,X: A→B) because it only demonstrates one instance where it doesn't hold. Invoking "context-dependence," "smaller effect," or "unmeasured moderator" preserves the possibility that the effect *does* exist elsewhere/under other conditions. It merely constrains the *boundaries* or *magnitude* of the effect.
      *   **Successful Novel Replication (e.g., New Country):** Interpreted as finding a *new* (P', M', C', X') where A *does* cause B. This *corroborates* the existential claim (∃P,M,C,X: A→B) by expanding the known set of conditions under which it holds. It's treated as evidence of "generality" because the effect is observed beyond the original narrow context, strengthening the belief that it's not *uniquely* tied to that context.
  3.  **Refutability:** As you suspect, **your diagnosis is largely correct.** The existential claim ("it works somewhere") is incredibly difficult to falsify definitively. A single (or even multiple) null results only show where it *doesn't* work, not that there is *no* context where it *does* work. The boundaries of the set (P,M,C,X) are typically left vague or defined post-hoc, making systematic refutation practically impossible.

  **What is such a claim worth?**
  *   **Limited Scientific Value:** An unfalsifiable existential claim has minimal explanatory or predictive power. Its primary value is heuristic – suggesting something *might* be interesting and worthy of further investigation to map its boundaries and understand *why* it appears/disappears.
  *   **Risk:** It allows effects to persist in the literature as "established facts" long after numerous replication failures, hindering progress and wasting resources.

  **Making the Claim Testable:**
  To move beyond the existential claim, researchers need to specify:
  1.  **Stated Mechanism (M):** A causal model explaining *how* A leads to B. This predicts *when* and *why* the effect should occur or not.
  2.  **Pre-specified Moderators (P, M, C, X):** Clearly defined boundaries or critical conditions based on the mechanism. *Before replication*, state: "The effect should occur if Moderator Z is present/high, but not if Z is absent/low" or "The effect requires Procedure Step Y." Crucially, these must be theoretically grounded, not ad-hoc.
  3.  **Pre-registered Predictions of Absence:** Based on the mechanism and moderators, explicitly predict contexts where the effect *should not* replicate. A failure *in that predicted context* provides strong evidence *against* the effect operating as originally claimed or understood.

  **Rationalizing the Asymmetry: What Fits vs. What Requires?**
  *   **What Practice Strictly Requires:** Only the unfalsifiable existential claim. Anything more specific (magnitude, boundaries) is post-hoc justification, not a strict requirement of the core "established finding" narrative.
  *   **What Practice Merely Fits (Explanations for the Asymmetry):**
      *   **Error-Statistics/Severity:** This view *does not* license the asymmetry easily. A severe test requires a hypothesis that *could* fail the test. The existential claim cannot be severely tested by a single replication (success or failure). Severity demands pre-specified moderators and predictions of absence to make null results informative *against* a more specific hypothesis (e.g., "the effect is robust to changes in population").
      *   **Bayesian (Effect Heterogeneity):** This licenses the asymmetry *most naturally*. Here, the "true effect" is a *distribution* across contexts (e.g., varying effect sizes, possibly including zero in some contexts). A null result updates the posterior towards a smaller mean effect size or higher variance (more context-dependence), but doesn't set the mean to zero. A successful novel replication updates towards a larger mean or lower variance (more robustness). The core hypothesis becomes about the *distribution* (mean, variance) rather than a universal binary effect.
      *   **Sociology of Credit/Blame:** This powerfully *explains* the asymmetry but doesn't *license* it epistemically. Original authors have career investment; journals prefer exciting, general findings; textbooks need established facts. Admitting refutation is costly; claiming generality from a novel replication is rewarding. This incentivizes the observed pattern regardless of strict logic.
      *   **Significance Testing Logic:** Your point here is **crucial and correct.** Strict Neyman-Pearson logic treats a single non-significant result as "inconclusive" (absence of evidence) regarding a point null (δ=0). *However*, the *same logic* should treat a single significant result as inconclusive evidence *for* a specific effect size (it only rejects δ=0, not establishes δ>Threshold). The asymmetry (accepting "established" from original + one novel replication but rejecting "refuted" from original + one null replication) is **logically inconsistent** within this framework. Both conclusions overreach the evidence from one additional data point.

  **The "Sealed Conditions" Reform:**
  *   **What it Assumes:** This reform assumes that:
      1.  Meaningful scientific hypotheses *must* be falsifiable.
      2.  Researchers *can and should* articulate, *a priori*, the specific conditions under which their claim would be considered falsified.
      3.  Falsification conditions should be objective and binding.
  *   **What Current Practice Denies:** Current practice implicitly denies points 1 & 2 for many "established" effects. It treats the core hypothesis as the existential claim (which isn't falsifiable by a finite set of replications) and allows falsification conditions (moderators, boundaries) to be defined *post-hoc* to protect the claim. The reform forces specificity and commitment to falsifiability that current practice avoids.

  **Common Ground, Disputes, and Extrapolation:**
  *   **Common Ground:**
      *   The existential claim is difficult to falsify.
      *   Single replications (successful or failed) are rarely definitive on their own.
      *   Context-dependence (effect heterogeneity) is a major factor in replication failures.
      *   Pre-registration, specifying mechanisms, and pre-defining moderators are improvements.
      *   Sociological factors influence interpretation.
  *   **Live Disputes:**
      *   **The Core Hypothesis:** Is the goal to establish an effect "exists" (somewhere) or to map its *boundaries* and *magnitude*? Many methodologists argue forcefully for the latter as the only scientifically valuable goal.
      *   **Role of Null Results:** How strongly should a well-powered null result count *against* the original effect claim, especially if moderators weren't pre-specified? Views range from "strong evidence against the original claim as *generally* true" to "only evidence it doesn't hold *here*."
      *   **Bayesian vs. Frequentist Frameworks:** Which provides a better normative account for handling effect heterogeneity and replication? The Bayesian "distributional" view is gaining traction but faces challenges in specification and computation.
      *   **Severity & Falsification:** How strictly should falsificationism be applied? Can error-statistical severity adequately handle complex, context-dependent effects without becoming unwieldy?
  *   **Extrapolation:**
      *   The characterization of the "core hypothesis" as an existential claim is a critical synthesis, supported by the observed behavior, but isn't always explicitly stated by practitioners.
      *   The argument that the significance-testing asymmetry is logically inconsistent is an inference based on applying the *strict* logic of the framework to the *actual* usage, highlighting a hypocrisy in practice.
      *   Attributing specific weight to sociological factors vs. epistemic frameworks in explaining the asymmetry involves interpretation of complex motives.

  **Conclusion:** The asymmetry you observe stems primarily from treating hypotheses as unfalsifiable existential claims ("it works somewhere") combined with sociological incentives. While effect heterogeneity is real and best modeled distributionally (e.g., Bayesianly), current practice often exploits this ambiguity post-hoc to protect claims rather than rigorously map boundaries. The "sealed conditions" reform addresses this by forcing specificity and commitment to falsifiability. Meaningful progress requires shifting focus from proving "it exists" to specifying "when, how much, and why it works."
