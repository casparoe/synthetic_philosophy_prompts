answer: |-
  ## The Habit of God in Derby

  The control room hummed. Not a soothing hum, but the low, insistent thrum of servers stacked in the adjoining closet and the fluorescent lights flickering their last above Derby’s grey predawn. Iman traced the familiar path: pressure gauge 7B on Screen 3, nominal; temperature feed from the extrusion line at FabriTek, stable; vibration analysis for the stamping press at Midlands Auto, all green sine waves. Routine. Like checking the locks twice.

  Beside her, Priya sucked air through her teeth, scrolling rapidly. “Still perfect. Eleven months. It’s obscene.”

  Iman didn’t need to look. They’d discovered the anomaly yesterday evening, just as their shift began. ‘Twin B’, their most reliable predictive model for the aging conveyor systems at Belper Packaging, hadn’t missed a single failure prediction in nearly a year. The only problem? During a routine software update eleven months ago, a glitch had shuffled the unique machine identifiers Twin B monitored. Instead of tracking specific motors, gearboxes, and bearings on Belper’s Line 3, it had been fed a scrambled, anonymised soup of sensor data. No one knew *which* machines it was actually ‘seeing’. And yet, its failure predictions – flagged by rising heat signatures, specific vibration harmonics, pressure drops – were spot on. It called breakdowns, sometimes hours in advance, for machines it couldn’t possibly be named to track.

  “Obscene?” Iman murmured, her eyes still on the stable sine waves. “Or just… habitual?”

  Priya swivelled her chair. Her dark eyes sparkled with the fervour of the scientifically vindicated. “Come off it, Iman. Habit? This isn’t God popping down to Derby every five minutes to flick a switch when a bearing overheats. This is *structure*. Deep, beautiful structure we haven’t mapped yet! Twin B stumbled onto some underlying pattern in the noise, a universal stress signature maybe, independent of the specific machine label. It’s proof the chaos isn’t random! There’s a *cause* behind the correlation, we just haven’t isolated it.”

  Iman finally turned. Priya’s energy was a physical thing in the stale, coffee-scented air. Iman felt, as usual, like a block of granite weathering a stream. “Proof of a deeper cause?” She kept her voice level, dry. “Or proof that the pattern holds, even when our labels fail? You see a mechanism. I see… consistency.”

  “But that’s just giving up!” Priya leaned forward, tapping the screen where Twin B’s flawless prediction log glowed. “Saying ‘God does it’ doesn’t *explain* this regularity, Iman. It just slaps a label on it and calls it a day. It stops the questions. Why *this* vibration pattern before failure? Why *this* temperature spike? Why does it hold across anonymised data? ‘God’s habit’ doesn’t answer any of that. It just re-describes the mystery and then shrugs. Science *keeps digging*.” She gestured emphatically. “This? This scrambled input success? It’s a *clue*. A massive one. There’s a causal layer deeper than the individual machine, deeper than our current models. We can find it!”

  Iman absorbed the argument. Priya wasn’t wrong, from her perspective. She was a brilliant engineer, her realism as hard-nosed as the steel frames of the factories they monitored. For Priya, the universe was a vast, intricate clockwork. Twin B’s accidental success was like finding a hidden gear, proof the mechanism was more complex and wonderful than imagined. For Iman, the universe was… habitual. Al-Ghazali’s vision, absorbed in childhood theology classes and never quite shaken, even after fifteen years of not praying, of living solidly in this world of gauges and grease: fire didn’t burn cotton because of inherent properties; God, at that moment, willed the burning. Every single time. What everyone called ‘cause and effect’ was merely the reliable sequence God had chosen to maintain. The pressure gauge didn’t *cause* the reading; it was the occasion for God to manifest the number 120 psi. Twin B’s algorithm didn’t *cause* the prediction; it was the occasion for God to manifest the correct alert. The scrambled inputs? Merely a different occasion. God’s habit remained.

  “It doesn’t stop the gauges needing checking, Priya,” Iman said, turning back to her screen. She clicked to acknowledge the stable readings. “Or the tickets needing filing.”

  “But it changes *everything*!” Priya insisted. “Imagine if we crack what Twin B tapped into? We could build predictive models independent of specific machine IDs! Universal failure signatures! We wouldn’t need bespoke twins for every production line!” Her voice vibrated with possibility. “This is career-making. Nobel Prize territory, practically!”

  Iman suppressed a sigh. Metaphysics was all very well at 2 AM over stale biscuits from the tin Priya brought in (another habit), but the Belper Line 3 weekly report was due by 6 AM. And the scrambled input issue… that needed logging. Officially. It was a glitch, after all. A potentially lucrative, baffling glitch, but a glitch nonetheless. Procedure demanded a ticket.

  Priya’s excitement was a tangible pressure. Iman felt the weight of her colleague’s expectation – *Join me in the wonder! See the mechanism!* But Iman saw only the habit. The astonishing, inexplicable, utterly routine habit of God, or the universe, or sheer dumb consistency, manifesting through lines of code running on Derby servers, predicting the breakdown of anonymous machines in a packaging plant.

  Did her belief change anything? Right now, staring at the screen demanding she file the anomaly report? She felt… nothing profound. No existential tremor. No urge to pray for guidance (the habit of *not* praying was stronger). Just the familiar weight of the night shift, the flickering light overhead, the sour tang of old coffee grounds, and the knowledge that a procedure existed for reporting inexplicable system behaviour.

  She opened the ticketing system. The form fields blinked accusingly: **System Affected, Nature of Anomaly, Impact Assessment, Recommended Action.**

  Priya was watching her screen now. “You’re filing it?”

  “Procedure,” Iman stated, her fingers poised over the keyboard.

  “But… what are you going to say? This isn’t just an ‘anomaly’, it’s a breakthrough!”

  Iman began typing, her movements precise. **System Affected:** Twin B (Belper Line 3). **Nature of Anomaly:** Persistent accurate failure prediction despite corrupted machine ID input stream (ref: Data Sync Error Log #DH4471, 11 months prior). **Impact Assessment:** Predictive functionality remains 100% effective; however, model input/output relationship is currently unverifiable due to ID corruption. **Recommended Action:** Maintain current deployment for predictive value. Initiate diagnostic analysis to identify source of predictive accuracy under corrupted input conditions. Flag for R&D review.

  “Diagnostic analysis? R&D review?” Priya read over her shoulder. “That’s it? You make it sound like a faulty sensor!”

  “It *is* a faulty input stream,” Iman pointed out, clicking ‘Submit’. The ticket vanished into the corporate ether. “That’s a fact. The rest… is what it is.”

  Priya slumped back in her chair, disappointment warring with residual excitement. “You’re impossible. This is the most exciting thing to happen to predictive maintenance since… since predictive maintenance! And you file a ticket like it’s a leaky tap.”

  Iman checked the time: 4:07 AM. The witching hour of night shifts, where thoughts grew fuzzy and the hum of the servers seemed louder. She looked at the screens. Green lights, stable readings. Twin B’s log, a perfect record of predicting the unpredictable based on nothing it was supposed to see. God’s habit, running silently on server rack 4, slot B.

  Did her belief make a difference? She picked up her chipped ‘World’s Okayest Engineer’ mug – a gift from Priya last Christmas – and took a lukewarm sip. It tasted of cheap coffee and the faint metallic tang of the room. She looked at Priya, who was already deep in another dataset, probably chasing the phantom mechanism.

  No, Iman thought. It didn’t change the next hour. She still had gauges to monitor. Reports to finish. The Belper Line 3 maintenance crew would still get their alerts, sourced from scrambled data or divine will, and act accordingly. The machines would still break down, or be saved, according to the habit. And she would still watch the screens, trace the paths, click the acknowledgements. The metaphysics sat quietly in the background, like the hum of the servers – always there, unnoticed until you thought about it, explaining nothing essential about the task at hand, yet somehow underpinning the whole, strange, predictable unpredictability of it all. She reached for the biscuit tin. Habit.
