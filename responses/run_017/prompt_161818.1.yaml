  The Pasadena paradox centers on an undefined expected value due to conditional convergence. The alternating harmonic series (1 - 1/2 + 1/3 - 1/4 + ...) converges to ln2 when summed in order, but rearranged terms (grouping two positives per negative) sum to (3/2)ln2. This is Riemann's rearrangement theorem in action.

  The villanelle requires strict form: 19 lines with alternating refrains. I'll assign "The sum is ln2" as Refrain A (natural order) and "The sum is three-halves ln2" as Refrain B (rearranged). The final quatrain must place them side-by-line unreconciled, with new lines explicitly rejecting the inference from conditional convergence to defined expectation.

  Key technical points to embed:
  - Payoff mechanism: (-1)^{n-1} * 2^n / n with probability 1/2^n
  - Divergent positive/negative subseries (harmonic series divergence)
  - Order-dependence as core problem

  Imagery should include:
  - Coin tosses (flipping, landing heads)
  - Wager/pricing struggle
  - Mathematical instability ("won't sit still")
  - Light/dark contrast for positive/negative terms

  The challenge is balancing poetic compression with technical precision. The refrains must unmistakably represent their respective sums to decision theorists while remaining accessible as poetic lines. The final quatrain's new lines must explicitly name the failed inference without jargon.

  For sound devices:
  - Internal rhyme (price/dice/device)
  - Consonance (toss/cost/loss)
  - Meter: iambic pentameter with variation for mathematical terms

  The opening line establishes the pricing dilemma ("This wager's price escapes my best device") while introducing the coin motif. Subsequent stanzas explore the mathematical behavior, building to the final unreconciled refrains that embody the paradox.
answer: |-
  This wager's price escapes my best device;
  The coin spins up, a bright uncertain gain.
  The sum is ln two, the fair and stated price.

  It flips again, a dark potential loss.
  The terms accrue, a flickering cascade.
  The sum is three-halves ln two, the cost.

  Each toss demands a reckoning, a choice:
  For heads that dawns late, payment must be made.
  The sum is ln two, the fair and stated price.

  Win first, then lose, then win with brighter voice,
  The sequence builds where light and dark are laid.
  The sum is three-halves ln two, the cost.

  Two gains for every loss? A different noise!
  The very numbers shift within their shade.
  The sum is ln two, the fair and stated price.

  The coin won't change, the payoffs keep their voice,
  The series lives, though restless and dismayed.
  The sum is three-halves ln two, the cost.

  Not chance, nor stakes, nor the harmonic choice,
  But hope that expectation could be weighed
  When positives and negatives each race alone to space,
  Must leave the stage, a failed device, erased.
  The sum is ln two, the fair and stated price.
  The sum is three-halves ln two, the cost.
