  For prioritization, I need to consider several factors: importance (how fundamental the question is), load-bearing (how many other issues depend on it), tractability (feasibility with available expertise), and neglect (how understudied it is relative to its importance). With only six postdocs over five years, and most being philosophers who can read physics but not do original cosmology, the questions must be approachable through conceptual analysis, simulations, or reanalysis of existing data.

