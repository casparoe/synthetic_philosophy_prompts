  ## The Speech (890 words)

  **(Adjust microphone, take a breath, look around the room - students, parents, colleagues, guests)**

  Good morning. It’s… different standing up here without Dr. [Head of School's Last Name], isn’t it? I know I feel it. But we’re here, together, as we always are, to talk about this community we build every single day.

  We’ve all felt it – that moment when something goes wrong. Maybe someone says something unkind. Maybe a frustration boils over. Maybe a rule gets broken. It happens. It happens to all of us, adults included. And for a long time, how our school responded to those moments was pretty standard: a detention, maybe a demerit, maybe a suspension. It was a system designed to say “stop that,” and sometimes, it did. But did it ever feel like it helped us *understand* why it happened? Did it help us figure out how to move forward, together? Did it feel like it truly *fixed* anything, beyond just pausing the problem for a bit?

  Since March, two of our advisories have been trying something different. Based on a lot of research, and conversations with folks like Dr. [Psychologist 1 Name] and Dr. [Psychologist 2 Name] – thanks for being here today – we’ve been piloting a new approach. Today, we’re launching it school-wide. It’s not about getting rid of rules or expectations. It’s about changing *how we respond* when things get messy, because that’s when learning about ourselves and each other really happens.

  So, what’s changing? A few key things:

  1.  **Advisory Circles:** Twice a week, for twenty minutes, you’ll meet in your advisory groups. This isn’t just announcements time. This is where we talk about the stuff that happened – the bumps, the misunderstandings, the moments where someone felt hurt. We’ll use clear words we all agreed on: **Harm. Repair. Accountability.** What happened? Who was affected? What needs to happen to make it right? This isn’t about blame; it’s about understanding impact.
  2.  **The Repair Board:** Sometimes, understanding means making a commitment. If you’ve caused harm, you might be asked to write down, briefly, what you intend to do differently on the Repair Board in the main hall. It’s public. Why? Because repair is a community act. It’s saying, “I see what happened, and here’s my step towards doing better.” It’s not a permanent record; it’s a snapshot of learning.
  3.  **Growth Narratives:** Instead of teachers logging every single misstep in a discipline file, *you* will have a “Growth Narrative” folder. This follows you year to year. You *and* your advisor will add to it. Notes about challenges you faced, how you navigated them, skills you’re working on, moments you’re proud of. Think of it as your ongoing story here at school – the whole story, not just the chapters where things went wrong. Your advisor reads it to support you, not to judge you.
  4.  **Morning Mood Check:** On the school app, there’s a simple, one-tap way to let your advisor know how you’re arriving each morning. Just a quick check-in. It’s not mandatory, but it’s there if you need it. Why? So the adults who care about you have a tiny signal if you might need a little extra support that day. It’s a quiet, “Hey, I’m here,” in whatever form that takes.

  Okay, I see some looks out there. Skeptical looks. Confused looks. Maybe even an eye roll or two. Totally fair. Change is weird. Some of you might be thinking, "This sounds soft." Others might think, "This sounds complicated." Some might wonder, "Is this just detention with more talking?" And I get that tenth grader in the back who’s probably already figured out five ways this could feel like just... more visibility.

  Here’s the thing: This isn’t about being “soft” or “hard.” It’s not about swapping one punishment for another. It’s about shifting the goal.

  The old system focused on *consequence* after the fact. This system focuses on *understanding* and *practice*.

  *   **Practice** in naming how our actions affect others.
  *   **Practice** in taking responsibility for repair, not just waiting for a punishment to land.
  *   **Practice** in reflecting on our own growth – the stumbles *and* the steps forward.
  *   **Practice** in noticing how we show up, and asking for what we need.

  We’re asking you, and ourselves, to get better at the messy work of being human together. That’s harder, honestly, than just sitting in silence for forty minutes. It requires courage to say, "Yeah, I messed up." It requires empathy to hear how someone else felt hurt. It requires trust to share a bit of your morning struggle. It requires patience to help someone else figure out their repair. This isn’t a system that does the work *for* us; it’s a structure that gives us space *to do the work ourselves*.

  Does it work? During the pilot in those two advisories, we saw something interesting: out-of-school suspensions dropped by about half. Now, listen carefully: **that is not proof.** It’s not proof this system is magic. It’s not proof everyone suddenly became perfect. It *is* a signal. It’s a sign that maybe, just maybe, when we focus on understanding and repairing *within* the community, we keep more people *in* the community, learning. We see it as something worth paying attention to as we all try this together.

  Will this be perfect? Absolutely not. We will mess this up. Advisors will fumble conversations. Students will resist the circle. Repairs will feel awkward. The app might glitch. We’ll need to adjust, listen, and adapt. That’s okay. That’s part of the practice too.

  This new system isn’t about letting things slide. It’s about taking things *seriously* – seriously enough to dig into the "why," seriously enough to invest time in real repair, seriously enough to believe that every single one of you is capable of growth and deserves the tools and support to navigate that.

  We’re betting that learning to navigate conflict, take responsibility, and build trust is just as crucial as algebra or history. We’re betting that by practicing these skills openly, with shared language and shared commitment, we build a stronger, more honest, and ultimately, a kinder school.

  It starts today. It starts with us. With all of us. Let’s get to work.

  Thank you.

  ---

  ## What I Had to Leave Out (295 words)

  1.  **Foucault & the Panopticon:** Obviously. While the "continuous low-level visibility" critique is intellectually honest, naming Foucault or the panopticon would alienate 99% of the room instantly. The psychologists might feel attacked on a theoretical level they didn't sign up for in this forum. Faculty skeptics would seize on it as proof of academic nonsense, while liberation-leaning faculty might feel I'd poisoned the well. Most students would just hear "big scary word = bad." The tenth-grade cynic would get his "Gotcha!" moment, derailing the whole purpose.
  2.  **"Surveillance with Nicer Fonts":** Directly quoting or validating that cynical take, however accurate it might feel sometimes, would be disastrous. It would instantly weaponize the skepticism, especially among students. It tells the room, "Your suspicions are correct," undermining trust before the system even starts. It dismisses the genuine intentions behind the design and ignores the potential benefits of *shared* visibility versus top-down monitoring. It hands the narrative to the cynics.
  3.  **"Power over Free Subjects" / Liberation vs. Narrowing:** This philosophical nuance, while central to my internal justification, is too abstract and easily misconstrued. Saying "this widens what you can do" sounds naively utopian to skeptics ("So they can do whatever they want?!") and risks sounding like I'm dismissing the very real structures and expectations still in place ("It's not *just* gentler!"). The faculty wanting "trust" would hear only the liberation part and miss the crucial point about power *still* operating, just differently. It collapses into platitudes when shouted into a mic.
  4.  **The Faculty Split:** Acknowledging the deep divide openly ("Some think we've gone soft, some think it doesn't go far enough") in the launch speech would be incredibly destabilizing. It signals division to students and parents, making the system seem contested and fragile from day one. It invites both sides to dig in harder during implementation, rather than fostering a unified (if cautious) front for the students' sake. My job here is to present it cohesively, not air internal laundry.

  ---

  ## What I'm Betting On (148 words)

  The speech bets on one core idea: **that creating intentional space and structure for reflection, honest conversation about harm, and active repair cultivates genuine responsibility and mutual understanding better than detached punishment ever can.**

  It asks the room to believe that:
  1.  Students *want* and are *capable* of understanding the impact of their actions and making amends.
  2.  Talking openly about conflict ("Harm, Repair, Accountability") is a learnable skill worth practicing, even when it's hard.
  3.  Self-reflection (Growth Narratives) and community visibility (Circles, Repair Board) can be tools for support and growth, not just control or shame.
  4.  The pilot suspension data, while not proof, signals a *possibility* worth collectively pursuing.
  5.  This messy, participatory process will build a stronger, more resilient community than the old, transactional system.

  Can I honestly hold this belief? Yes. I believe humans learn responsibility through engagement and practice, not isolation and penalty. The pilot showed flashes of this potential. I *also* believe the Foucault critiques are valid risks – the system *can* become coercive if implemented poorly or cynically. My belief isn't blind faith; it's a conviction that this *approach* holds more potential for authentic growth *if* we – adults and students – commit to the messy, honest work the structure enables. Standing there, I'm betting on our collective capacity to do that work.
