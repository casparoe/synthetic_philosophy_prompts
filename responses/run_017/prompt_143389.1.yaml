  The user provided several examples showing the pattern doesn't hold universally. Future conditionals with "would" don't imply counterfactuality. "Even if" structures deny connections. Swapping "would" with "might" weakens the implication. Offer-type sentences and questions change meaning with the conditional form.

  They want to know if this is one phenomenon or several, whether the implication and connection demand are linked, and how their examples fit. They also want clear distinctions, not just labels. So, I need to break down the concepts involved.

  First, recall near concepts. Material implication is too broad. Subjunctive mood indicates non-actuality but doesn't cover the connection aspect. Counterfactuals imply falsity of the antecedent, but the user's future examples show "would" isn't always counterfactual. Biscuit conditionals are for speech acts, which might relate to the offer example. Contextual restrictions involve background knowledge but don't explain the connection demand.

  The core issue is that the "had done/would have" form in past contexts triggers counterfactual presupposition, implying the antecedent is false. This leads to the implication that the husband did it. But why the demand for a connection? Counterfactuals require a causal or enabling link in the background model. Without it, the conditional feels off. In the "did" version, it's an indicative conditional without such presuppositions, acting like a disjunction.

  Looking at the user's examples: Future cases with "would" don't presuppose falsity because the future isn't settled. "Even if" explicitly blocks the connection, so no demand. "Might" introduces possibility, not necessity, so the implication weakens. Biscuit conditionals work with indicatives because they're about present states, not past causal links. Questions shift focus from truth to explanations.

  So, the two changes (implication of falsity and connection demand) are linked through counterfactual semantics. The presupposition of falsity triggers the need for a causal story to make the conditional meaningful. In non-counterfactual contexts, this doesn't apply. Therefore, it's mostly one phenomenon with variations based on context and modality. The user's examples show different facets, but the underlying mechanism is the counterfactual requirement for a connection when the antecedent is presumed false.
answer: |-
  You've hit on a deep and beautifully messy cluster of issues in conditional semantics and pragmatics. Your observations are sharp, and your mate's "it's a known thing" is half-right – but it's several known things interacting, not one neat concept. Let's dissect this systematically, following your request: I'll list nearby concepts, define them, explain why they *don't* fully capture your case, then identify what actually does and map its boundaries using your examples. I'll write in American English.

  **Brainstorm: Nearest Concepts & Why They Fall Short**

  1.  **Material Implication (⊃):**
      *   **Covers:** The truth-functional definition where "If P, then Q" is false *only* when P is true and Q is false. Logically equivalent to "Not-P or Q".
      *   **Why it doesn't fit:** It perfectly models your "if he didn't do it, the brother did" (Not-[He did it] OR [Brother did it] = He didn't do it OR Brother did it). But it utterly fails for the "would have" version. Material implication doesn't care about connections, counterfactuality, or speaker commitment. It treats both your sentences as equivalent, which they clearly aren't.

  2.  **Subjunctive Mood / Irrealis:**
      *   **Covers:** A grammatical mood marking non-actuality, potentiality, or counterfactuality. "Had done" and "would have" are past subjunctive (or irrealis) forms in English. This *is* the grammatical shift between your two sentences.
      *   **Why it doesn't fit:** While it *marks* the difference, it doesn't *explain* the semantic/pragmatic effects you noticed (the hint of actuality, the demand for a connection). It's a necessary condition, not a sufficient explanation. As your future example ("if it rains/rained") shows, subjunctive doesn't *always* imply counterfactuality or demand connection.

  3.  **Counterfactual Conditional:**
      *   **Covers:** Conditionals specifically discussing scenarios the speaker believes to be false or non-actual. Often marked by past subjunctive ("had done", "would have").
      *   **Why it *almost* fits but doesn't:** This gets the "hint" part right for the past case. Using a past counterfactual ("if he hadn't done it") strongly implies the speaker believes he *did* do it (the antecedent is false). **BUT:**
          *   It doesn't inherently explain the *demand for a connection*. Why does "would have" need a story, while "did" doesn't?
          *   As your future example shows ("if it rained tomorrow the match would be off"), "would" doesn't *always* mark counterfactuality; it can mark future hypotheticals without implying the antecedent *won't* happen. Similarly, "even if" uses the form but denies the connection.

  4.  **Biscuit Conditional (aka Relevance Conditional):**
      *   **Covers:** Conditionals like "If you're thirsty, there's beer in the fridge." Here, the antecedent ("you're thirsty") doesn't state a *condition* for the truth of the consequent ("there's beer") – the beer is there regardless. Instead, it states the *relevance* of the consequent to the antecedent. It's often about speech acts.
      *   **Why it doesn't fit:** This nicely captures your "offer-type" indicative ("If you want a beer, there's one") as a relevance conditional (the beer exists, and I'm telling you about it *because* you might want it). It also explains why the subjunctive version ("If you wanted a beer, there'd be one") fails as an offer – it nonsensically makes the *existence* of the beer conditional on your desire. However, it doesn't touch the counterfactuality, the hint, or the connection demand in your crime examples. It's relevant to *one* of your bullet points, not the core phenomenon.

  5.  **Contextual Restriction (or Background/Enabling Conditions):**
      *   **Covers:** The idea that conditionals presuppose or require certain background conditions to hold for the connection between antecedent and consequent to make sense. E.g., "If you strike this match, it will light" presupposes oxygen is present.
      *   **Why it doesn't fit:** It touches on the "demand for a connection," but it's too broad and applies to *all* conditionals, indicatives included. Your point is that the *subjunctive counterfactual specifically* makes this demand for a *causal or enabling connection* far more salient and obligatory than the indicative.

  **The Core Phenomenon: Counterfactual Causal Necessitation (with Pragmatic Strengthening)**

  What you're describing is primarily **the interaction of Counterfactuality and Modality within a Causal Framework, amplified by Gricean Pragmatics.** It's not one single established term because it's a constellation, but we can define it precisely:

  1.  **Counterfactual Presupposition (The "Hint"):** When a speaker uses a past subjunctive conditional form ("If he hadn't done it..."), they **pragmatically presuppose** that the antecedent is false in the actual world (he *did* do it). This is a very strong default inference. *Why?* Grice's Maxim of Relation (Relevance): Why discuss a hypothetical scenario in detail if you think it might be actual? Using the marked subjunctive form signals you're discussing a non-actual path.
      *   **Boundaries:** This presupposition is defeasible. Your "might" example ("if he hadn't done it, his brother might have") weakens it significantly because "might" introduces possibility, not necessity, making the hypothetical feel more like an open alternative rather than a closed counterfactual. In "even if" ("even if he hadn't done it, he'd still have known"), the phrase "even if" explicitly *acknowledges* the antecedent might be false while focusing on the *robustness* of the consequent, actively canceling the presupposition. In future hypotheticals ("if it rained tomorrow..."), there's no settled fact of the matter yet, so no presupposition of falsity arises – only a sense of hypotheticality.

  2.  **Causal/Enabling Connection Demand (The "Story"):** In a *counterfactual* conditional ("if P hadn't happened, Q would have happened"), the "would have" asserts that, **in the closest possible world(s) where P is false, Q is *necessitated*.** This necessitates an account of *why* Q is inevitable in the absence of P. What feature of the world (causal law, plan, intention, enabling condition) *forces* Q to happen if P doesn't? Without such a connection (e.g., brothers covering, coordinated plan, shared motive), the assertion of necessity ("would have") feels unsupported or even nonsensical. The indicative ("if P didn't happen, Q happened") makes no claim about necessity or the connection between P and Q; it's compatible with pure logical disjunction ("P or Q").
      *   **Boundaries:** This demand is strongest for past counterfactuals asserting necessity ("would have"). It weakens:
          *   With "might" ("if P hadn't happened, Q might have happened"): Only possibility is asserted, not necessity. No strong causal story is required; mere possibility suffices.
          *   In future hypotheticals ("if P happened, Q would happen"): The future is open. "Would" expresses a prediction based on current rules/understanding, not a claim about necessitation across possible worlds in the same way. The connection demand is about plausible causation, not strict necessitation in a fixed past.
          *   In "even if" constructions: The phrase explicitly *denies* the antecedent is a necessary condition for the consequent ("Q happens/happened/would happen *regardless* of P"). It actively blocks the need for a causal link *from ~P to Q* because Q holds *anyway*.
          *   In biscuit conditionals: The connection is relevance for speech acts, not causation in the world.
          *   In questions ("if he hadn't done it, who would have?"): The demand isn't for the speaker to *supply* the connection, but the question *presupposes* that such a connection (making *someone's* doing it necessary if he didn't) exists and demands it be identified.

  **Mapping Your Bullet Points:**

  1.  **Future Stuff ("if it rains/is off" vs. "if it rained/would be off"):**
      *   **Phenomenon:** Primarily *modality & time*, not counterfactuality. Both are future hypotheticals. "Would" often sounds more tentative or formal, but doesn't presuppose non-occurrence (no "hint"). The connection demand (weather policy) is similar for both, as it's about a predictable rule, not past necessity across worlds.

  2.  **"Even if" ("even if he hadn't... he'd still have..."):**
      *   **Phenomenon:** *Counterfactual Presupposition (defeated)* + *Explicit Denial of Causal Connection*. "Even if" cancels the hint and explicitly states Q is independent of P, removing the demand for a ~P->Q connection. The "would" here marks the hypothetical scenario, not necessitation *caused by* ~P.

  3.  **"Might" ("if he hadn't... his brother might have"):**
      *   **Phenomenon:** *Counterfactual Presupposition (weakened)* + *Relaxed Connection Demand*. "Might" replaces necessitation ("would") with possibility. The hint weakens because the speaker is considering an alternative, not asserting a definite counterfactual path. The demand for a *necessitating* connection disappears; a plausible scenario suffices.

  4.  **Offer-Type ("if you want/there is" vs. "if you wanted/there'd be"):**
      *   **Phenomenon:** *Biscuit Conditional (indicative)* vs. *Hypothetical Assertion (subjunctive)*. The indicative signals relevance to a current state/offer. The subjunctive shifts to a hypothetical scenario ("if you [in some other situation] wanted..."), making it about the *conditional existence* of the beer itself, which is nonsensical for an offer. It's a distinct speech act failure.

  5.  **Questions ("if he didn't/who did?" vs. "if he hadn't/who would have?"):**
      *   **Phenomenon:** *Counterfactual Presupposition + Causal Connection Demand (interrogative)*. The indicative question is a direct request for information about actual alternatives. The counterfactual question strongly presupposes he *did* do it ("if he hadn't" implies he did) and demands an answer identifying the *necessary alternative perpetrator* ("who *would have* [necessity!]") in that non-actual scenario, presupposing such a necessary alternative exists. It demands the causal/enabling story behind that necessity.

  **Is it One Phenomenon or Several?**

  It's **one core semantic mechanism – the assertion of *necessity* ("would") within a *counterfactual* framework – interacting with fundamental pragmatic principles (presupposition, relevance), applied across different contexts (time, modality, speech acts).**

  *   **The "Hint" (Counterfactual Presupposition):** A pragmatic effect strongly triggered by the *counterfactual form*.
  *   **The "Demand for Connection":** A semantic requirement inherent in asserting *necessitation* ("would have") within the *counterfactual scenario*. ~P *must necessitate* Q for "If ~P, would Q" to be assertable/coherent.

  **These two are intrinsically linked in past counterfactual necessity conditionals:** The counterfactual form triggers the presupposition of ~P's falsity (he did it), and the assertion of necessity ("would have") demands an explanation for *why* Q is forced in that non-actual world. They travel together *specifically* in sentences like your original "if he hadn't done it, the brother would have."

  **Your bullet points show this core mechanism adapting or being overridden in different linguistic environments (future time, "might", "even if", questions, speech acts), proving it's context-sensitive rather than a different animal each time.** The indicative ("did") lacks *both* the counterfactual presupposition and the necessitation semantics, acting like a disjunction ("or") or a simple logical/material conditional.

  **Meaning vs. Use:**

  It's both:
  1.  **Semantics (Meaning):** "If P hadn't happened, Q would have happened" encodes counterfactuality and necessitates Q in the closest ~P worlds. This *requires* a causal/enabling connection to satisfy the necessity claim.
  2.  **Pragmatics (Use):** The counterfactual form *pragmatically implies* the speaker believes P *did* happen (the "hint") due to conversational maxims (Relation/Relevance). The strength of this implication depends on context and alternative forms (e.g., "might" weakens it). The *way* the necessity is interpreted (causal law, plan, intention) is also highly context-dependent.

  **In Summary:**

  You've isolated the powerful effect of combining **Past Counterfactual Mood** with **Necessity Modality ("would")**. This combination:
  1.  **Pragmatically Presupposes** the antecedent is false (creating the "hint").
  2.  **Semantically Asserts** the consequent is necessary in that counterfactual scenario (creating the "demand for a connection" to explain that necessity).
  3.  **Boundaries:** This effect is strongest for past events. It's weakened by possibility modals ("might"), canceled by constructions like "even if", shifted in future contexts, and manifests differently in questions or speech acts where the core semantic demand interacts with the specific pragmatic goal. The indicative ("did") avoids both effects entirely, functioning more like a logical disjunction or material implication without necessitation or counterfactual commitment.
