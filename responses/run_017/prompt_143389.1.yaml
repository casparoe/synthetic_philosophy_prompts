  You're a professional philosopher of language and semanticist who's spent years working on conditionals specifically. Please take this seriously and think carefully: before committing to an answer, brainstorm a short list of the nearest concepts you can think of, say what each one covers, and then tell me which actually fits my case and why the others are close but wrong. Don't just hand me a label, I'll explain below why that won't settle it. And please write your answer in American English.

  So me and my mate got into a huge stupid argument last night over a true crime thing we've been watching, about whether the husband did it. At some point he says: look, if he didn't do it, the brother did. Both of us agreed that sounds completely fine and that saying it doesn't commit you to either guy. Then a minute later he says: if he hadn't done it, the brother would have. And that one landed totally differently. Two things changed at once as far as I can tell:

  First, the second version sounds like you're telling me the husband *did* do it, or at least strongly hinting it, whereas the first one doesn't hint anything about that.

  Second, and this is the bit I keep going round on: the first version doesn't seem to need any story connecting the two halves. It's enough that somebody did it and there were only two candidates, so the thing follows automatically. The second version seems to demand an actual connection — like the brother was covering for him, or the brother had his own reason, or there was some plan where one of them was going to end up doing it. With the first version I can just mean "one of these two, don't ask me which" without implying anything flows from one to the other. My mate went further and said the first one isn't really a conditional at all, it's just a fancy way of saying "either he did it or the brother did", which I half believe, but then I don't get why you can't do the same trick with the "would have" one.

  Here's where I got lost, because I started trying it out on other sentences and the pattern doesn't hold together:

  - Future stuff: "if it rains tomorrow the match is off" and "if it rained tomorrow the match would be off" both sound fine to me and seem to mean basically the same thing, except the second one makes you sound less sure. So the "would" version isn't simply a contrary-to-fact marker.
  - "Even if": "even if he hadn't done it, he'd still have known about it" is fine, and here the "would" version doesn't seem to hint that he did it, and it positively denies the connection instead of requiring one. So the flip partly vanishes, but not in the same way it vanishes in the future cases.
  - Swapping "would" for "might": "if he hadn't done it, his brother might have" — that one seems to lose the hint that he did do it, or at least weaken it a lot, even though everything else about the sentence is the same.
  - Offer-type sentences: "if you want a beer there's one in the fridge" works fine as an offer, but "if you wanted a beer there'd be one in the fridge" doesn't really work as an offer at all, it sounds like a weird remark about a hypothetical fridge.
  - Questions: "if he didn't do it, who did?" is fine, "if he hadn't done it, who would have?" sounds like a different question.

  My mate said this is all a known thing and there's a name for it in linguistics, he thought maybe something with "irrealis" in it, or maybe a philosophers' name for the connection bit, but he was drunk and couldn't remember and honestly I'm not sure he knew. So: is there an established concept for the flip I'm describing, or for the two things that change when you switch from the "did" form to the "had done / would have" form?

  And more importantly: is what I noticed one phenomenon or several that happen to travel together? Is the hint about the first thing being false the same thing as the demand for a connection, or are those seperate? Are my five bullet points all the same phenomenon misbehaving, or are some of them a different animal entirely? Is any of this about what the sentence means, or is it all about what people are doing when they say it? And whichever way it goes, I want the carving, not the name: tell me exactly what the thing is, what it is not, and where its edges are, including what would and wouldn't count as an example. If some piece of it genuinely has no established term, say so plainly and coin one with a definition and a couple of boundary cases instead of pretending there's a literature.
