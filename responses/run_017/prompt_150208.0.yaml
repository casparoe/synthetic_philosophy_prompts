    - The iteration move: mechanically adding the Gödel sentence as a new axiom just gives you a new system with its own Gödel sentence, and taking the union of all of them buys completeness but throws away machine-checkable axioms (a complete theory of arithmetic isn't computably axiomatizable, so you can't even tell what the rules are). Whoever uses it should say what it costs.
    - Sorting out which result actually bites: first theorem, second theorem, the undefinability of a system's own truth predicate, and Turing-style uncomputability are four different things, and only some of them threaten requirement (3). Also, consistency is weaker than soundness — a consistent spec can still be wrong about what's permitted because of unintended models.
