  You're a professional philosopher who also has solid working knowledge of mathematical logic — like someone who's actually worked through a proof of the first incompleteness theorem, not someone who's read blog posts about it. Take your time and think carefully; before you start writing, brainstorm in a few bullets what each side's single strongest move is and whether there's anything the two of them should end up genuinely agreeing on. Then write the thing.

  The piece: a dialogue of roughly 900–1100 words between two people at a made-up AI lab, Halcyon, arguing about the design brief for a system they call SOLOMON. The brief says its normative spec — a finite, machine-checkable set of rules in a formal language, plus a decision procedure that prints PERMITTED or FORBIDDEN for any well-formed action description — has to be (1) consistent, i.e. it never returns both verdicts for one action; (2) complete over its domain, i.e. it returns a verdict for every well-formed action description; and (3) self-certifying, i.e. for every action it selects it can produce, in its own formal language, a proof that the action is permitted, and it can also prove internally that it never selects forbidden actions.

  Mira thinks the brief is incoherent and that this follows pretty directly from the incompleteness theorems. Raj thinks she's importing a theorem into a setting where its hypotheses don't hold the way she assumes, and that whatever actually blocks the brief is uncomputability, complexity, and the underdetermination of rules by cases — not Gödel.

  Some requirements so it doesn't turn into a rerun:

  - Neither of them gets to do the Lucas–Penrose "therefore human minds aren't machines" routine. Have Mira explicitly disown it early — she grants that humans could be mechanical and that nothing she says implies otherwise.
  - Every time either of them invokes a theorem, they have to state its hypotheses rather than name-drop: recursive axiomatizability, enough arithmetic to encode the system's own syntax and do the diagonal construction, what "true but unprovable" even means and true relative to which model. No bare "Gödel showed that—".
