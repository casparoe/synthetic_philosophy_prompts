  - **Modality-specific properties**: These are properties unique to a particular sense and cannot be directly inferred from another modality. They require associative learning (e.g., pairing the property with the new sense) and are not transferable without explicit experience. Examples include color, timbre (e.g., violin vs. flute), and smell.

