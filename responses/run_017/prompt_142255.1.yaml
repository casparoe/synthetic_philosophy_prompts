answer: |-
  ### Analysis of the Friend's Rule
  Your friend employs a consistent rule based on expected utility calculus, weighing the expected benefits of voting against the costs. The core principle is: **Vote in a contest if and only if the expected benefit (probability of being pivotal multiplied by the utility difference of the outcomes) exceeds the cost of voting, and you hold a well-informed preference for one outcome.** If you lack a preference or the expected benefit is negative, abstaining is optimal. The rule breaks down as follows:
  - **Probability of being pivotal (\(p\))**: The chance your vote changes the outcome.
  - **Utility difference (\(V\))**: The welfare gain from your preferred outcome versus the alternative, in monetary or utility terms.
  - **Cost of voting (\(C\))**: The opportunity cost of time and resources.
  - **Voting condition**: \(p \times V > C\), with \(V > 0\) (you must have a preference).

  This rule is applied strictly, with no intrinsic value assigned to voting as a "civic act" if it has no consequence. The utility difference \(V\) is interpreted as the total social welfare impact (altruistic perspective), not just personal gain.

  ### Application to the Five Verdicts
  1. **National election (dead even polls)**: 
     - \(p \approx 10^{-7}\), \(V \approx \text{few hundred \$/person} \times 90 \times 10^6 \text{ people} \approx 27 \times 10^9\) USD (e.g., $300/person \times 90M$).
     - Expected benefit: \(10^{-7} \times 27 \times 10^9 = 2700\) USD.
     - Cost \(C \approx 20\) USD.
     - Verdict: \(2700 > 20\) → vote ("yes, not close").

  2. **Same election, varied cost**:
     - Same \(p\) and \(V\) (2700 USD expected benefit).
     - At \(C \approx 400 + \text{day's leave (e.g., } 8 \text{ hrs} \times 70 \text{ USD/hr} = 560 \text{ USD)} \approx 960\) USD: \(2700 > 960\) → vote.
     - At \(C \approx 6000 + 3 \text{ days (e.g., } 24 \text{ hrs} \times 70 \text{ USD/hr} = 1680 \text{ USD)} \approx 7680\) USD: \(2700 < 7680\) → no vote ("not close").

  3. **Water-district election**:
     - \(p\): High based on close historical margins (e.g., margin of 3 in 400 voters implies \(p \approx 0.04\) using binomial models or observed frequency).
     - \(V\): Tens of millions USD budget + wetland value (conservatively \(20 \times 10^6\) USD/year × 4 years ≈ 80M USD).
     - Expected benefit: \(0.04 \times 80 \times 10^6 = 3.2 \times 10^6\) USD.
     - Cost \(C \approx 13\) USD (10-minute walk, scaled from case 1's $20 for 15 minutes).
     - Verdict: \(3.2 \times 10^6 \gg 13\) → vote ("vastly stronger").

  4. **Settled election (sham)**:
     - \(p = 0\) (vote cannot change outcome).
     - Utility effect: Voting increases turnout, used for propaganda → negative utility (e.g., \(-W, W > 0\)).
     - Cost \(C \approx 0\).
     - Expected utility: \(0 - W < 0\) → no vote ("worse than staying home").

  5. **Uninformed bond vote**:
     - No preference → \(V = 0\) (expected benefit = 0).
     - Cost \(C > 0\) (time to vote, even if small).
     - Expected utility: \(0 - C < 0\) → abstain ("noise").

  ### Alternative Rule Fitting the Verdicts
  An alternative rule that fits all five verdicts is:  
  **Vote if and only if the election is genuine (outcome not predetermined), you are informed (hold a preference), and the cost-adjusted pivotal probability (\(p / C\)) exceeds a threshold \(k\), where \(k\) is context-dependent but implicitly scales with \(V\).**  
  - **Case 1**: \(p / C = 10^{-7} / 20 = 5 \times 10^{-9}\), but \(V\) is large → threshold exceeded.
  - **Case 2**: Low cost (\(p / 960 \approx 2.8 \times 10^{-9}\)) exceeds threshold; high cost (\(p / 7680 \approx 3.5 \times 10^{-10}\)) does not.
  - **Case 3**: \(p / C \approx 0.04 / 13 \approx 0.003\) → easily exceeds threshold.
  - **Case 4**: Election not genuine → no vote.
  - **Case 5**: Uninformed → no preference → no vote.  

  This rule is functionally similar to the expected utility rule but emphasizes a cost-normalized probability threshold. It fits the verdicts because \(V\) is large in cases 1-3, making the threshold easier to clear, while cases 4-5 violate the "genuine" and "informed" conditions.

  ### Prediction for the New Case
  **Scenario**: National election (90M voters, \(p \approx 10^{-7}\)), 15-minute walk (\(C \approx 20\) USD). You have a firm preference on one issue (energy) but are uninformed on others. Options:  
  - **Vote as you are**: Expected benefit based only on energy issue (\(V_{\text{energy}}\)).  
  - **Stay home**: No cost or benefit.  
  - **Read and vote**: Cost = 60 hours × 70 USD/hr = 4200 USD; if informed, \(V_{\text{full}} \approx 27 \times 10^9\) USD, expected benefit = \(10^{-7} \times 27 \times 10^9 = 2700\) USD. Net = \(2700 - 4200 - 20 = -1520\) USD.  
  - **Variant (20-minute call)**: Cost ≈ (20/60) × 70 = 23.33 USD; after call, you vote as if informed (expected benefit = 2700 USD). Net = \(2700 - 23.33 - 20 = 2656.67\) USD.  

  **Rule predictions**:  
  - **Expected utility rule**:  
    - Vote as you are: EU = \(p \times V_{\text{energy}} - 20\). \(V_{\text{energy}}\) is unknown but ≤ \(V_{\text{full}}\) (27e9 USD). If \(V_{\text{energy}} \geq 20 / p = 2 \times 10^8\) USD (about $2.22/person), vote. Else, no.  
    - Stay home: EU = 0.  
    - Read and vote: EU = -1520 USD → reject.  
    - Variant: EU ≈ 2656.67 USD → best option.  
  - **Alternative rule (cost-adjusted)**:  
    - Vote as you are: Requires \(V_{\text{energy}} > 0\) and \(p / C\) clears threshold.  
    - Variant: High EU → vote after call.  

  **Best guess for friend's answer**: He will recommend the **20-minute variant and then vote**.  
  - **Reasons**:  
    - The variant has a high, positive expected utility (2656.67 USD), while voting as you are risks low/negative EU if \(V_{\text{energy}}\) is small (energy is one issue among many; unlikely to dominate \(V_{\text{full}}\)).  
    - Reading is not worth the cost (net loss).  
    - The friend prioritizes reliable gains: the variant converts uncertainty into a high-expected-value vote.  
    - His verdicts show aversion to uninformed voting (case 5) and high-cost efforts (case 2), making the low-cost variant ideal.  

  ### Consistency of Verdicts and Self-Description
  - **Consistency**: All five verdicts are consistent with the expected utility rule. No reconciliation is needed; the rule handles each case via \(p\), \(V\), and \(C\).  
  - **Self-description**: The "consequence-counter" description survives. The rule is purely consequentialist:  
    - Case 4's negative verdict stems from consequences (propaganda harm), not principle.  
    - Case 5 treats uninformed voting as having no consequence (or negative if \(C > 0\)).  
    - Monetary values implied: A vote is "worth" its expected benefit. In case 1, ≈2700 USD; case 3, ≈3.2e6 USD; case 2, it drops below cost when \(C > 2700\) USD.  

  ### Further Case to Separate Rules
  To distinguish between the expected utility rule and the alternative (cost-adjusted) rule, pose:  
  - **Case 6**: A small, genuine election (e.g., 100 voters, \(p \approx 0.08\)) where candidates are identical on all policies (\(V = 0\)). Cost is negligible (e.g., 1 USD).  
    - **Expected utility rule**: \(p \times 0 - 1 < 0\) → no vote.  
    - **Alternative rule**: Election is genuine and you are "informed" (indifference is a preference), but \(p / C\) is high (0.08/1 = 0.08). If the threshold is based on \(V\), \(V = 0\) may fail the rule. If not, it might pass.  
    - **Diagnostic**: The friend will say **no vote** (consistent with expected utility rule) because there is no consequence to change. If he votes, it suggests an intrinsic value for voting (inconsistent with case 4 and his philosophy).  

  This case tests whether voting has non-consequentialist value and clarifies how \(V = 0\) is handled.  

  ### Summary
  - **Rule**: Vote if \(p \times V > C\) and you have a preference.  
  - **Prediction**: For the new case, the friend will choose the 20-minute variant and vote.  
  - **Further case**: Identical-candidate election to confirm no intrinsic voting value.  
  The friend's arithmetic of consequences holds, and his verdicts reveal a vote's worth scales with \(p \times V\).
