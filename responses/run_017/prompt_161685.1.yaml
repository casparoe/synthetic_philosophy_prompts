     Proof (model answer for part b):

     We will show that the set of strategies that survive the pair-dominance procedure is order-independent.

     The proof is by induction on the total number of strategies. The base case is trivial. 

     The key lemma: a strategy is eliminated in the first round of pair-dominance if and only if it is strictly dominated by a mixed strategy using at most two pure strategies (a pair) in the original game. This set is well-defined. After removing these strategies and also any strategies of the opponent that are strictly dominated by a pair in the original game, we obtain a reduced game. In this reduced game, a strategy might be strictly dominated by a pair. However, we must show that if a strategy is strictly dominated by a pair in the reduced game, then it must have been strictly dominated by a pair in the original game. 

     But note: in the reduced game, the set of pure strategies for the player is a subset S' of the original set S, and for the opponent, it is a subset T' of the original set T.

     For a strategy s_i in S' to be strictly dominated by a mixed strategy σ_i that is a distribution over two pure strategies in S', we have that for every t_j in T', u_i(σ_i, t_j) > u_i(s_i, t_j).

     In the original game, for the mixed strategy σ_i (which is over two strategies in S' ⊆ S), the condition for strict domination would require that for every t_j in T (the original set), u_i(σ_i, t_j) > u_i(s_i, t_j). But in the reduced game, we only require it for t_j in T'. This is easier to satisfy. So it is possible that in the reduced game, s_i is strictly dominated by σ_i, but in the original game, it was not, because there was some t_j in T\T' where the condition failed.

     Therefore, it is possible to have an strategy that is only dominated after the opponent's strategies are reduced.

