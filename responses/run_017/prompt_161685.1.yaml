  ### Question: Iterated Elimination of Strictly Dominated Strategies with Restricted Mixtures (30 minutes, 20 marks)

  Consider the following two-player game. Player 1 has strategies \(A_1\), \(A_2\), \(A_3\), and \(A_4\). Player 2 has strategies \(B_1\), \(B_2\), and \(B_3\). The payoffs are given in the table below, where the first number in each cell is Player 1's payoff, and the second is Player 2's payoff. (Player 2's payoffs are set to 0 for simplicity, as they do not affect the domination condition for Player 1.)

  | Player 1 \ Player 2 | \(B_1\)   | \(B_2\)   | \(B_3\)   |
  |----------------------|-----------|-----------|-----------|
  | \(A_1\)             | (5, 0)    | (0, 0)    | (0, 0)    |
  | \(A_2\)             | (0, 0)    | (5, 0)    | (0, 0)    |
  | \(A_3\)             | (0, 0)    | (0, 0)    | (1, 0)    |
  | \(A_4\)             | (2, 0)    | (2, 0)    | (0, 0)    |

  **Part (a)** (8 marks)  
  Using the *full* iterated elimination of strictly dominated strategies (IESDS) procedure (where any mixture of pure strategies is allowed), show that strategy \(A_4\) for Player 1 is strictly dominated. Then, show that there is no mixture of exactly two of Player 1's pure strategies (i.e., any pair from \(\{A_1, A_2, A_3\}\)) that strictly dominates \(A_4\). Conclude whether \(A_4\) can be eliminated in the first round of the **pair-dominance** procedure (where dominators are restricted to mixtures of at most two strategies).

  **Part (b)** (12 marks)  
  Now, consider the **pair-dominance** procedure (only mixtures of up to two strategies allowed) in *any* finite two-player game. Investigate whether the set of strategies that survive this procedure depends on the order of elimination. Either:  
  (i) Prove that the surviving set is order-independent (i.e., the same set remains regardless of elimination order), or  
  (ii) Provide a counterexample (a two-player game) demonstrating that the order matters.  

  *Hint: Consider whether the usual transitivity/substitution arguments for full IESDS hold under the "at most two" mixture constraint.*

  ---

  ### Model Answer (Approx. 550 words)

  **Part (a)**  
  In the full IESDS procedure, \(A_4\) is strictly dominated by the mixed strategy \(\sigma = (0.41, 0.41, 0.18, 0)\), which assigns probabilities to \(A_1\), \(A_2\), and \(A_3\) (weights sum to 1). The payoffs for \(\sigma\) are:  
  - Against \(B_1\): \(0.41 \times 5 + 0.41 \times 0 + 0.18 \times 0 = 2.05 > 2\)  
  - Against \(B_2\): \(0.41 \times 0 + 0.41 \times 5 + 0.18 \times 0 = 2.05 > 2\)  
  - Against \(B_3\): \(0.41 \times 0 + 0.41 \times 0 + 0.18 \times 1 = 0.18 > 0\)  
  Since \(\sigma\) yields a strictly higher payoff than \(A_4 = (2, 2, 0)\) against all three of Player 2's strategies, \(A_4\) is strictly dominated and can be eliminated.  

  However, no mixture of *exactly two* strategies dominates \(A_4\):  
  - **Mixture of \(A_1\) and \(A_2\)**: Let \(\sigma_{12} = (p, 1-p, 0, 0)\). Payoffs:  
    - \(B_1\): \(5p\) → Requires \(5p > 2\) ⇒ \(p > 0.4\)  
    - \(B_2\): \(5(1-p)\) → Requires \(5(1-p) > 2\) ⇒ \(p < 0.6\)  
    - \(B_3\): \(0\) → Requires \(0 > 0\), impossible.  
  - **Mixture of \(A_1\) and \(A_3\)**: Let \(\sigma_{13} = (q, 0, 1-q, 0)\). Payoffs:  
    - \(B_1\): \(5q\) → Requires \(5q > 2\) ⇒ \(q > 0.4\)  
    - \(B_2\): \(0\) → Requires \(0 > 2\), impossible.  
  - **Mixture of \(A_2\) and \(A_3\)**: Let \(\sigma_{23} = (0, r, 1-r, 0)\). Payoffs:  
    - \(B_1\): \(0\) → Requires \(0 > 2\), impossible.  
  Thus, no two-strategy mixture dominates \(A_4\). In the pair-dominance procedure, \(A_4\) **cannot** be eliminated in the first round, as no pair-based dominator exists.  

  **Part (b)**  
  The pair-dominance procedure is **order-independent**: the surviving set is identical regardless of elimination order.  

  *Proof sketch (key points):*  
  1. **Strict domination depends only on current strategy sets:** A strategy \(s_i\) for player \(i\) is strictly dominated in a subgame if there exists a mixture \(\sigma_i\) (of at most two *remaining* strategies) such that \(\forall s_{-i} \in S_{-i}^{\text{current}}\), \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\).  
  2. **No "rescue" by order:** If \(s_i\) is *not* strictly dominated by any pair in the full game, it cannot become dominated in a subgame. Suppose \(s_i\) is dominated in a subgame by a pair \(\sigma_i\) from reduced set \(S_i' \subseteq S_i\). Since \(S_i' \subseteq S_i\), \(\sigma_i\) was available in the full game. The condition for domination in the subgame is *weaker* than in the full game (as \(S_{-i}^{\text{current}} \subseteq S_{-i}^{\text{full}}\)), so if \(\sigma_i\) dominates \(s_i\) in the subgame, it must also dominate \(s_i\) in the full game (against the *same or fewer* opponent strategies).  
  3. **Transitivity holds:** The usual IESDS order-independence argument (based on sequential removal of dominated strategies without affecting undominated status) applies, as the "at most two" constraint does not break the transitivity of domination. Removing a strategy never enables new domination by a pair that wasn’t possible before, as mixtures are restricted to *remaining* strategies, and the payoff condition is monotonic in the opponent’s strategy set.  
  4. **By induction:** After each round, the set of dominated strategies is fixed (those dominated by a pair in the current game), and removal does not "create" new dominatable strategies. The final set is the limit of this process.  

  Thus, pair-dominance, like full IESDS, is order-independent in finite two-player games.  

