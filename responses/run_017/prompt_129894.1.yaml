prompt: |-
  Hi — I'm a philosophy professor and, somewhat unluckily, I chair my university's research-integrity committee. Five of us, we meet monthly, about twenty cases a year, and our findings run from "go rewrite your methods section" up to dismissal, so the stakes aren't pretend. Nobody else on the committee has read any philosophy, we get roughly forty minutes a case, and I need something they can actually run without me translating.

  Here's the mess. Our new and slightly mad code has four verdicts: honest error; wilful blindness (you suspected, and steered around finding out); self-deception; and knowing misconduct. Wilful blindness costs a semester's suspension, self-deception costs only ethics training plus a year of supervision, on the theory that the self-deceived person couldn't have helped it. We keep deadlocking between verdicts two and three. One member, who's read a bit of Sartre, wants to collapse them entirely: you can't both know and not know a thing, so anything in that middle region is either just ignorance (go easy) or just lying (come down hard). I half think he's right and half think he's throwing away a distinction we need.

  So: you're a professional philosopher who works on moral psychology and the philosophy of mind. Think properly before you write. Start by brainstorming — on paper, in your head, wherever — about what self-deception would have to be in order to sit between ignorance and lying at all, and about whether the four boxes can be told apart from the outside, given that our evidence is emails, drafts, meeting minutes and one forty-five minute interview. Then give me a decision procedure: the questions in order, what counts as a yes or a no to each, where it stops early, and where it has to stop and hand the question over to us as a values call rather than a factual one. Assume the people running it have forty minutes and no theory.

  Then run it on three cases. (a) A PI who signed off on consent forms she definately never read, and who says, believably, that she was certain her postdoc had fixed them. (b) A postdoc who tried forty-odd specifications of the same regression, reported the one that came out significant, and insists to us with apparent sincerity that this is simply what his field does and that the effect is real. (c) A friend of mine — full professor, and I'd rather she wasnt involved — whose paper contains two paragraphs near-verbatim from a review she herself cited, and who says she genuinely remembers writing them.

  At least one of those should come out somewhere I won't like; tell me which, and why you didn't bend the procedure to avoid it. And be honest about what the procedure can't do. Prose only please — no headings, no bullets, no bold, no tables: write it the way you'd write a long email to a colleague. Take your time.
reasoning: |-
  Okay, let me start by really unpacking what this philosophy professor needs. They're chairing a research integrity committee with high-stakes cases, and they're stuck on distinguishing between "wilful blindness" and "self-deception" in their new code. The committee members aren't philosophers, they've got limited time per case, and they keep deadlocking. The core problem is ontological (what self-deception even *is*) and epistemological (how to detect it from external evidence). 

  First, I need to mentally sketch why self-deception isn't just ignorance or lying. If it were pure ignorance, you couldn't hold someone responsible - but if it were full lying, the punitive scale wouldn't make sense. The key has to be in how motivation shapes belief formation. Sartre's colleague is oversimplifying - humans absolutely *can* simultaneously know and avoid knowing things through attentional redirection or motivated reasoning. Think of Freudian defense mechanisms made banal: not unconscious repression, but semi-conscious nudging away from uncomfortable scrutiny. 

  For the decision procedure, it must be a flowchart in prose - binary questions with clear exits. Evidence is purely behavioral (emails, drafts, timelines), not psychoanalysis. Critical anchors: 
  - Baseline competence (if they're new or untrained, "honest error" is likely) 
  - Evasion patterns (did they avoid verification? Ignore warnings?) 
  - Post-hoc justification (can they articulate reasons that aren't circular?) 
  But crucially, the procedure must fail gracefully where evidence runs out - some cases will inherently require value judgments about reasonable doubt. 

  Now for the test cases: 
  - The PI who didn't read consent forms: Classic wilful blindness. She delegated a high-risk task without oversight. Her certainty about the postdoc is disproven by her duty to verify. 
  - The p-hacking postdoc: Tricky. If his field *actually* encourages this (shudder), it might be self-deception - he's internalized rotten norms. But if he hid other specifications? Straight misconduct. 
  - The plagiarism friend: Oof. Self-citation muddies it. Key is whether she *could* have forgotten copying from her own review. Given memory's fallibility... but verbatim? Probably self-deception if she believes it, but the procedure might force "wilful blindness" due to her expertise. 

  I wince at the friend's outcome - but bending the procedure would destroy its integrity. The admission point is crucial: we can't access inner states, so we infer from actions. Where actions are ambiguous, we default to supervision (self-deception) rather than suspension (wilful blindness) - not because we're soft, but because punishment requires clearer proof of awareness. 

  Final note to self: Emphasize that the procedure's weakness is handling sincere delusion vs. strategic pretense. We mitigate by looking for *patterns* - single incidents lean toward error/self-deception; repeated ones toward blindness/misconduct.
answer: |-
  Right, this is precisely the sort of mess that makes moral psychology so fraught and fascinating. The tension between your Sartrean colleague and the code's structure captures the core problem: how do we assign culpability for epistemic failures that aren't pure accident nor outright lies? And crucially, how can non-philosophers, under time pressure, navigate this using *behavioural* evidence? Let's break it down.

  **Brainstorming: The Nature of the Middle Ground**

  For "wilful blindness" (WB) and "self-deception" (SD) to be distinct *and* sit between honest error (HE) and knowing misconduct (KM), we need to conceptualize SD not as *simultaneously* knowing and not knowing (a logical contradiction), but as a *process* of motivated belief formation and maintenance that bypasses conscious acknowledgment.

  1.  **The Space Between:** HE involves a straightforward lack of knowledge/reason to suspect. KM involves conscious awareness of wrongdoing coupled with intent to deceive or gain advantage. The middle ground is where the agent *avoids* achieving conscious knowledge *because* they suspect (or fear) the truth would be unwelcome or demanding. The difference between WB and SD lies in the *degree* and *nature* of that avoidance and the resulting epistemic state:
      *   **Wilful Blindness (WB):** The agent has strong, concrete *indications* that something is wrong (a red flag, a warning, an inconsistency). They consciously *choose* not to investigate further ("I don't want to know"). The avoidance is deliberate; the truth is recognized as a live, threatening possibility that is actively shunned. Culpability is high because they *saw the signpost and looked away*.
      *   **Self-Deception (SD):** The agent experiences cognitive dissonance (an uncomfortable tension between a desired belief and evidence/possibility). They engage in motivated reasoning: selectively gathering evidence, reinterpreting ambiguity favorably, downplaying counter-evidence, or simply not letting the uncomfortable thought fully form. Crucially, this process often feels like genuine belief formation *to the agent*. They don't consciously say "I won't look"; they unconsciously steer their attention and reasoning *away* from the threat, leading them to a sincere(ish) but unwarranted belief ("It's probably fine"). Culpability lies in the *motivation-driven epistemic negligence*, not a conscious decision to ignore.

  2.  **Distinguishing from the Outside (Epistemology):** We cannot see minds. We infer states from actions and words. The key evidence for WB vs. SD lies in:
      *   **The Salience of the Risk/Problem:** Was the potential issue glaringly obvious (WB) or more subtle/embedded in complex norms (SD)?
      *   **Concrete Avoidance Actions:** Did the person actively *avoid* receiving information (e.g., deleting an email without reading, refusing to look at a document, skipping a crucial meeting)? (Points strongly to WB).
      *   **Pattern of Engagement:** Did they encounter clear counter-evidence/warnings and dismiss them with implausible rationalizations (WB), or did they simply fail to seek out or adequately process ambiguous information due to a biased framework (SD)?
      *   **Plausibility of Sincerity:** Does their stated belief seem genuinely held, even if wildly implausible to a reasonable observer in their position? (SD is *characterized* by this implausible sincerity). Can we find evidence of internal conflict or earlier doubts they suppressed?
      *   **Incentive Structure:** Was the incentive to believe the convenient thing overwhelming? (Strong incentive + weak counter-evidence can push towards SD; strong incentive + strong counter-evidence points towards WB or KM).
      *   **Expertise/Experience:** A novice might honestly miss something (HE). An expert ignoring a basic flaw is more likely WB/SD/KM.

  **The Decision Procedure: Questions in Order (The "Epistemic Responsibility Flowchart")**

  Assume the committee has the dossier (emails, drafts, minutes, interview notes). Work through these questions sequentially. Stop when a verdict is reached. If the answer is ambiguous or requires weighing competing interpretations *without clear behavioral evidence*, that's the point where it becomes a values call for the committee.

  1.  **Was there a significant error, violation, or omission?** (If No: Case dismissed or seek clarification. If Yes: Proceed).
  2.  **Is there clear, direct evidence the person *knew* it was wrong *at the time of the act* and proceeded anyway?** (Emails saying "I know this is wrong but...", drafts showing deliberate fabrication, admissions in minutes/interview. If **Yes**: → **Knowing Misconduct (KM)**. Stop. If **No**: Proceed).
  3.  **Given the person's expertise, role, and the specific context, should a reasonably competent person in their position *easily* have recognized the error/violation?** (Focus on basic standards: plagiarism rules, core stats principles, fundamental ethical protocols. If **Yes** and they failed to see it: Points strongly away from HE. Proceed. If **No** (it was genuinely obscure/complex): → **Honest Error (HE)**. Stop).
  4.  **Are there documented signs that the person *received* specific information indicating a likely problem *and* they failed to adequately engage with it?** (Look for: Explicit warnings (emails, meeting points), clear inconsistencies highlighted in drafts/reviews, access to crucial data/files they demonstrably didn't use, protocol steps they skipped. If **Yes**: Proceed to Q5. If **No**: Proceed to Q6).
  5.  **Did the person's response to the warning/inconsistency involve *active avoidance* or *implausible dismissal*?** (Active Avoidance: Deleting email without reading, refusing to open attachment, physically avoiding a meeting/discussion. Implausible Dismissal: Dismissing clear statistical critique as "nitpicking" without reason, ignoring a direct plagiarism flag with a hand-wave, refusing to check source cited as problematic. If **Yes** to either: → **Wilful Blindness (WB)**. Stop. If the response was engagement, however flawed, proceed to Q6).
  6.  **Does the person's *current stated belief* about the correctness of their action seem genuinely held, even if objectively unreasonable?** (Consider: Consistency in interview (even under pressure), lack of clear contradiction in prior communications, apparent distress/confusion, alignment with known biases or field norms *they might sincerely hold*. If **Yes**: Points towards SD. If **No** (story keeps changing, clear contradictions, evasiveness): Points towards WB or KM, revisit Q2/Q5 carefully. Proceed).
  7.  **Was there a strong personal, professional, or institutional *incentive* for the person to believe their action was correct?** (e.g., Career pressure, desire to please supervisor, financial gain, protecting reputation, deeply held hypothesis, conforming to perceived field norms). If **Yes**: This *enables* SD. If **No**: HE becomes more likely, revisit Q3 carefully).
  8.  **Considering the evidence from Q4-Q7 collectively, is the *most plausible explanation* that the person:**
      *   **a) Sincerely (though negligently) believed their actions were acceptable, driven by motivated reasoning and incentive, without consciously avoiding specific knowledge?** → **Self-Deception (SD)**.
      *   **b) Likely suspected a problem based on the warnings/inconsistencies (Q4) and deliberately chose not to confirm it through avoidance/implausible dismissal (Q5)?** → **Wilful Blindness (WB)**.
      *   *(If the evidence is genuinely ambiguous or evenly split, or hinges on interpreting sincerity without clear markers, this is the **Values Call Point**. The committee must weigh: How egregious was the potential harm? How strong is the *presumption* of responsibility given their role? How clear *were* the warning signs? The code's intent suggests erring towards WB if the risk was high and signs were clear, SD if the norms were ambiguous and sincerity plausible.)*

  **Applying the Procedure to the Cases**

  **(a) PI who signed unread consent forms, claims certainty postdoc fixed them.**

  1.  **Error?** Yes (Failure of oversight, ethical violation).
  2.  **Clear evidence of *knowing* misconduct?** Unlikely (no email saying "I know these are bad but sign anyway"). Proceed.
  3.  **Should reasonably competent PI easily recognize need to review?** **Yes.** Basic ethical duty, high stakes. Not HE. Proceed.
  4.  **Signs of problem received?** **Yes.** *The consent forms themselves were the sign.* Signing without reading is *prima facie* evidence of receiving the document (the potential problem) and failing to engage. Proceed.
  5.  **Active avoidance/Implausible dismissal?** **Yes.** Signing without reading *is* active avoidance of the information contained within. It's a deliberate choice *not to know* the contents. Clear WB. → **Wilful Blindness (WB)**. (Stop).
      *   *Why you won't like it:* It feels harsh for a busy PI trusting a postdoc. But the procedure highlights the *act* of signing blind as the culpable avoidance. Her "certainty" is the *result* of the wilful blindness, not an excuse for it. The stakes (human subjects) demand this level of responsibility.

  **(b) Postdoc p-hacking, insists it's normal and real.**

  1.  **Error?** Yes (Questionable research practice, misrepresentation).
  2.  **Clear evidence of *knowing* misconduct?** Unlikely (no "I know it's p-hacked" email). Proceed.
  3.  **Should reasonably competent postdoc easily recognize?** **Complex.** Basic stats training *should* cover this. BUT, if field norms *are* truly lax (sadly common), maybe not *easily* recognized. This is borderline. *Proceed cautiously.*
  4.  **Signs of problem received?** **Unclear/Mixed.** Did drafts show other specs? Did co-authors/reviewers question it? If *no record* of anyone raising the issue specifically *to him*, it weakens the WB case. If he *had* access to all 40 specs and chose the significant one, that's a sign. *Assume minimal direct warnings for now.* Proceed to Q6.
  5.  *(Skipped as Q4 not clearly Yes)*.
  6.  **Sincerely held belief?** **Likely Yes.** "This is what my field does" + apparent sincerity in interview points towards genuine (if deeply flawed) belief. Points to SD.
  7.  **Strong incentive?** **Yes.** Publishing pressure, career advancement, confirming hypothesis. Enables SD.
  8.  **Plausible explanation:** **Self-Deception (SD)** is most plausible *if* field norms are genuinely poor and no strong warnings were documented. He likely engaged in motivated reasoning ("the effect *is* real, I just need to find the right model"; "everyone does this"), sincerely believing his final choice was legitimate. → **Self-Deception (SD)**. (If clear evidence existed he *knew* reviewers/colleagues condemned the practice specifically for his work, Q4/Q5 might push to WB).
      *   *Why it fits:* This *exemplifies* SD – adopting flawed norms through motivated reasoning to alleviate dissonance between methodological ideals and pragmatic pressures.

  **(c) Full Prof plagiarizing from her own review, claims she remembers writing it.**

  1.  **Error?** Yes (Plagiarism, failure to attribute).
  2.  **Clear evidence of *knowing* misconduct?** Unlikely (no "I'll copy this review" note). Proceed.
  3.  **Should reasonably competent Prof easily recognize?** **Yes.** Plagiarism rules are fundamental, *especially* for verbatim text, regardless of source. Not HE. Proceed.
  4.  **Signs of problem received?** **Yes.** *The source text itself.* She had the review (she cited it!). Having her own prior text and the new draft side-by-side (as she must have during writing/citing) creates an inherent inconsistency/risk of verbatim copying. Failure to notice/correct is a failure to engage with this risk. Proceed.
  5.  **Active avoidance/Implausible dismissal?** **Not clearly Avoidance, but likely Implausible Dismissal.** It's hard to prove she *avoided* comparing. However, her *current claim* ("I remember writing it") in the face of verbatim text from a source *she was actively consulting* is profoundly implausible. It suggests a dismissal of the obvious contradiction. Points towards WB. Proceed.
  6.  **Sincerely held belief?** **Ambiguous.** She *says* it. Is it plausible? For two *verbatim* paragraphs? Highly unlikely, bordering on impossible. Memory isn't that precise. This severely undermines sincerity. Points *away* from SD.
  7.  **Strong incentive?** **Yes.** Protecting reputation, time pressure, desire to reuse good text. Enables WB/SD.
  8.  **Plausible explanation:** **Values Call Point.** Evidence leans heavily *against* HE (Q3) and *against* SD (Q6 - implausible sincerity). Q4 (signs present) and Q5 (implausible dismissal) point towards WB. However, proving *conscious* suspicion and avoidance is hard. Did she *really* not notice while copying? Or did she notice and dismiss it? Her implausible claim *now* suggests she likely *did* have a suspicion at some level (conscious or near-conscious) that this was wrong, which she avoided confronting properly (WB), rather than a deep sincere belief she wrote it (SD). But it's not a slam-dunk WB. **Committee must weigh:** Her expertise makes the error egregious. The implausibility of her claim is high. The act of verbatim copying from a source being consulted is strong circumstantial evidence of *at least* reckless disregard (WB). Likely → **Wilful Blindness (WB)**.
      *   *Why you won't like it (and I didn't bend):* She's your friend, a full prof. The procedure forces confrontation with the objective implausibility of her claim and the inherent recklessness of verbatim copying from a source she knew well. Bending to SD would require accepting an almost impossible memory claim. The procedure highlights the duty *not* to accept such claims uncritically at this level of expertise. The evidence of the texts themselves is damning for WB.

  **Honest Assessment of the Procedure's Limits**

  1.  **Sincerity is Inferred, Not Proven:** This is the biggest hole. We rely on behavioral cues and plausibility. A skilled liar can mimic sincerity (falsely pushing towards SD/HE). A deeply self-deceived person might appear evasive (falsely suggesting WB/KM). The 45-minute interview is woefully inadequate for deep assessment. The procedure relies on *converging evidence* (actions + words + context) to mitigate this.
  2.  **Motivation is Opaque:** We infer motivation (avoidance, bias) from actions and incentives. We rarely have direct proof of *why* someone avoided something or believed something. Q7 (incentive) is a proxy, not proof.
  3.  **"Reasonable Person" is Contextual:** Q3 and Q8 rely on judgments about what a "reasonably competent" person should know/do, and what is "plausible." Field norms (as in case b) heavily influence this. Committees need diverse expertise.
  4.  **The Values Call is Unavoidable:** Some cases (like c, potentially) will sit on the WB/SD knife-edge. The procedure flags this explicitly. The committee *must* then deliberate on the *weight* of the circumstantial evidence, the severity, and the intended message of the code. This is where philosophical input (yours) on culpability frameworks becomes crucial, even if translating Sartre isn't feasible.
  5.  **Single Incident vs. Pattern:** This procedure looks at one case. A pattern of "SD" verdicts might indicate someone habitually reckless (edging towards WB/KM), but the procedure doesn't formally incorporate history.
  6.  **Time is the Enemy:** Forty minutes is brutal. The procedure aims for efficiency by focusing on key discriminators and stopping early where possible (HE, KM). But complex cases (like b or c) will push the limit. Rigorous pre-meeting dossier review is essential.

  **Conclusion**

  This procedure won't eliminate deadlocks, but it should structure the inquiry, force attention to the most critical behavioral evidence distinguishing the categories (especially signs received, avoidance actions, and plausibility of sincerity), and clearly identify where the factual evidence runs out and value judgments about culpability are required. It makes the distinction between WB (conscious suspicion + deliberate avoidance) and SD (sincere but motivated belief formed through negligence) operationalizable for non-philosophers by focusing on what they *did* and what they *encountered*, not diving into the metaphysics of belief. It will sometimes give uncomfortable answers (like WB for your friend), precisely because it prioritizes objective actions and responsibilities over subjective claims when those claims defy plausibility given the evidence and expertise. The key is that SD *requires* a plausible claim of sincere belief; if that claim crumbles under the weight of the evidence, WB or KM becomes the more reasonable, responsible finding. Good luck wrangling the committee.
