  ### **Activity Design: Margin-for-Error Argument Against Luminosity**

  #### **Core Idea**  
  Students experience a "boundary shift" in a perceptual sorites series (e.g., fading audio/gray shades) to intuit the margin-for-error argument. Half ascend (e.g., silence → loud), half descend (loud → silence). The debrief maps their experience to luminosity's failure, margin-for-error, and the KK principle breakdown.  

  ---

  ### **Rules, Setup, and Materials**  
  **Stimulus Choice**:  
  - **Gray Squares** (recommended over audio for reliability).  
    - Create 20 PNG images of gray squares (use [QuickGray](https://www.quickgray.com/) or Python/PIL):  
      - **RGB Values**: `(0,0,0)` → `(38,38,38)` in equal steps (each step = +2 RGB).  
      - *Why?* Steps 1–7 nearly black (indistinguishable), 8–14 ambiguous, 15–20 clearly light.  
    - Load images into a slideshow (PowerPoint/Google Slides) with numbered slides.  

  **Materials to Print**:  
  1. **Scoring Sheets (14 copies)**:  
     ```markdown
     NAME: __________ GROUP: [ ] ASCEND  [ ] DESCEND  
     RULES:  
       - "CAN TELL" = "I see a clearly light square."  
       - Wrong "CAN TELL" = -2 pts.  
       - Wrong "CANNOT TELL" = -0.5 pts.  
       - Correct = 0 pts.  

     | STEP | CAN TELL? (✓) | CANNOT TELL? (✓) | POINTS |  
     |------|---------------|------------------|--------|  
     | 1    |               |                  |        |  
     ...  
     | 20   |               |                  |        |  
     ```  
  2. **Stimulus Key (For you)**:  
     - Steps 1–7: Objectively dark (ground truth: "CANNOT TELL").  
     - Steps 8–14: Borderline (ground truth ambiguous; accept conservative judgments).  
     - Steps 15–20: Objectively light (ground truth: "CAN TELL").  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **1. Setup (10 mins)**  
  - **0–5 mins**: Divide students into **Group A (Ascend: steps 1→20)** and **Group D (Descend: steps 20→1)**.  
  - **5–10 mins**: Explain rules:  
    > "You’ll see 20 squares. At each step, decide: **‘Can I tell this is clearly light?’**  
    > - If you say ‘CAN TELL’ and shouldn’t, **-2 points**.  
    > - If you say ‘CANNOT TELL’ and should’ve said ‘CAN TELL’, **-0.5 points**.  
    > - Be **conservative**: Only say ‘CAN TELL’ if you’re sure. We’ll compare groups afterward."  

  #### **2. Experiment (20 mins)**  
  - **10–30 mins**: Run slideshow.  
    - **Group A**: Show squares **1 → 20** (5 sec/view, 10 sec to mark sheets).  
    - **Group D**: Show squares **20 → 1** (same timing).  
    - *Projector Tip*: Dim lights slightly. Ensure squares fill the screen.  

  #### **3. Data Collection (15 mins)**  
  - **30–35 mins**: Collect sheets. Tally results on the board:  
    | STEP | % "CAN TELL" (Ascend) | % "CAN TELL" (Descend) |  
    |------|------------------------|------------------------|  
    | 1    | 0%                     | 100%                   |  
    | ...  | ...                    | ...                    |  
    | 20   | 100%                   | 0%                     |  

  - **35–45 mins**: Plot a graph (x-axis: step, y-axis: % "CAN TELL"). **Draw both lines**.  

  #### **4. Debrief (35 mins)**  
  **Key Moments → Premises of the Argument**:  
  | **Room Moment**                  | **Argument Premise**                           | **Debrief Script**                                                                 |  
  |----------------------------------|------------------------------------------------|------------------------------------------------------------------------------------|  
  | Boundary shift (e.g., Ascend: step 12 = 20% "CAN TELL"; Descend: step 12 = 80%) | **Luminosity fails**: No sharp boundary where condition (lightness) obtains ↔ one knows it obtains. | "Why did Group D ‘see light’ earlier than Group A at step 12? **If lightness were luminous, the boundary couldn’t shift!**" |  
  | Student objection: "I was just careless at step 10!" | **Margin-for-error**: Knowledge requires safety; borderline cases lack it. | "But our scoring penalized overconfidence. If you *truly* knew at step 10, why did 70% of you get it wrong? **Knowledge needs a margin—you can’t know in borderline zones.**" |  
  | Ascend group’s "CAN TELL" lags Descend (e.g., step 15 vs. step 13) | **Anti-luminosity**: Some conditions obtain where one isn’t in a position to know. | "In the ascend group, lightness *obtained* at step 15, but at step 14, most couldn’t know. **Luminosity is false**." |  
  | KK breakdown (optional extension): Ask "Who felt sure they *knew* they knew?" only at extreme steps (e.g., 18+) | **KK failure**: Higher-order knowledge requires wider margins. | "Notice: You said ‘I know’ at step 15, but ‘I know I know’ only at step 18. **Each meta-knowledge level needs a bigger margin**—so KK fails before luminosity does." |  

  **Final Move (5 mins)**:  
  > "The argument against luminosity isn’t just about perception—it’s about **any** gradual property (pain, confidence, etc.). If knowledge requires a margin, **there’s no luminous ‘switch’** where you go from ignorance to certainty. Borderline cases *always* exist."  

  ---

  ### **What Will Go Wrong (And Fixes)**  
  1. **Problem**: Students explain away boundary shifts ("Group D was reckless!").  
     - **Fix**: Emphasize scoring rules incentivized conservatism. Show aggregate data: If recklessness caused shifts, Descend would have *more* false "CAN TELL"s—but it doesn’t.  

  2. **Problem**: KK tower is too complex for 80 mins.  
     - **Fix**: Skip the 3-level tower. Use the **optional debrief question** ("Who felt sure they *knew* they knew?") to hint at KK breakdown simply.  

  3. **Problem**: Ambiguous squares (steps 8–14) cause noisy data.  
     - **Fix**: Define "ground truth" as consensus:  
       - Steps 1–7: "CANNOT TELL" objectively.  
       - Steps 15–20: "CAN TELL" objectively.  
       - Steps 8–14: Accept either answer without penalty (focus on relative group shifts).  

  ---

  ### **What the Game Can’t Produce (State This at the End)**  
  - **The Formal Margin-for-Error Argument**:  
    > "1. **Luminosity**: If C obtains, you’re in a position to know C obtains.  
    > 2. **Margin-for-error**: If you’re in a position to know C obtains, C must obtain in all nearby cases.  
    > 3. **Sorites series**: There’s a case where C obtains, but a nearby case (e.g., one step) where C doesn’t.  
    > 4. **Contradiction**: You can’t be in a position to know in the first case → **Luminosity is false**."  

  - **Why it matters**: Replaces "I was careless" with a structural flaw in luminosity.  

  ---

  ### **Why This Works**  
  - Students *feel* the boundary shift (no jargon).  
  - Scoring forces conservatism, preempting "carelessness" objections.  
  - Data visualization concretizes abstract premises.  
  - KK extension emerges naturally from "how sure were you?" debrief.  

  Run it, then hit them with Williamson’s quote: **"Luminosity is the illusion that epistemic life is so straightforward."**
