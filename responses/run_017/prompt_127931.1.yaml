  - Half the class gets the series ascending (from silence to audible, or dark to light), the other half descending (from audible to silence, or light to dark).
  - At each step, students mark whether they can tell (e.g., "I can hear the tone" or "I can see the square is light") or cannot tell.
  - Scoring: A wrong "can-tell" (i.e., saying they can tell when they shouldn't) is expensive (say, -2 points). A missed "can-tell" (i.e., not saying they can tell when they could) is nearly free (say, -0.5 points). This encourages conservative play.
