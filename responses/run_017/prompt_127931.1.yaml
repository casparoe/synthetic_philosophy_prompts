prompt: |-
  I've got a third-year epistemology seminar, 14 students, 80 minutes, one room with a projector and my laptop and nothing else. I want them to hit the margin-for-error argument against luminosity before anybody says the word luminosity — I want it to happen to them and then have them assemble the argument out of what actually went on in the room, rather than sit through me stating premises and then illustrating them.

  Rough shape I've been turning over, change it if it won't work: a slow series, twenty steps or so, where the bottom end is obviously one way and the top end obviously the other — a tone fading up from silence, a grey square creeping lighter, or something with paper and envelopes if that's more reliable than my laptop speakers. They go through it a step at a time, and at each step the only move available is marking can-tell or cant-tell, scored so that a wrong can-tell is expensive and a missed one is nearly free.

  Two things I specifically want built in. First: half the room gets the series ascending, half descending, same steps, and then they compare where the line landed. My hope is they notice the boundary moved and that this is what does the real damage to the idea that the condition is luminous, but I'm not confident they won't just explain it away, and I don't know what move in the debrief stops them doing that. Second, the KK side. My hunch is that if knowing needs a margin, knowing that you know needs a bigger one, and the next one up bigger again, so the principle could hold at the bottom and quietly fall apart higher up. I was toying with a tower: some students judge the stimulus; a second group who cant see it judges at each step whether the first group is in a position to know; a third judges the second. Would that actually make the higher levels come apart earlier, or would it produce something else entirely, and if the tower can't carry the point, tell me what I'd have to build instead.

  What I need from you: the rules and the scoring with actual numbers, what I have to make or print in advance, a minute-by-minute timeline, and a debrief that maps each moment in the room onto a premise of the argument — including the moment where somebody says, yeah, but I was just careless there, because I think that objection is where the real disagreement lives and I don't want to wave it away. Also: what will predictably go wrong the first time I run it, and which part of the argument the game can't produce at all and I'll just have to state out loud at the end.
