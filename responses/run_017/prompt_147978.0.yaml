  Okay, let me approach this systematically. The user is a PhD economics student designing a single 75-minute business ethics session on Adam Smith's sympathy and impartial spectator for quantitatively-trained business students. They need a pedagogical plan addressing six specific challenges.

  First, I need to identify common teaching pitfalls. The most persistent errors I've observed are: conflating sympathy with pity or benevolence, misunderstanding impartiality as equal consideration of interests, reducing the spectator to social conformity, and confusing moral approval with emotional contagion. These must be addressed sequentially.

  For the core sequence, I'll start with sympathy as emotional resonance, then introduce the spectator as necessary for resolving mismatches in that resonance. The carrying example needs to show understanding without approval - perhaps overinvested anger. This creates cognitive tension to motivate the spectator concept. 

  The misconception map requires careful staging. Letting "sympathy=pity" stand briefly helps initial understanding but must be corrected when introducing the anger case. The spectator-as-poll error is most damaging if not preempted during the propriety discussion.

  The modern pile-on case depends on establishing three things: spectators derive authority from idealization not numbers, judgment requires human understanding, and fitness precedes desert. The check question about judging oneself as another would avoids vocabulary regurgitation.

  I'll decline discussions of Smith vs Hume comparisons and the Wealth of Nations connection, using "That's an excellent question for another lecture" to redirect. The plan balances conceptual dependencies with time constraints, using deliberate misconceptions as temporary scaffolding.
answer: |-
  Here is the plan structured around your requirements, born from fifteen years of watching students stumble over the same roots and soar when those roots are cleared:

  **The Three Reliably Fatal Missteps (And Why They Cripple Understanding):**
  1.  **Sympathy = Pity/Benevolence:** Students collapse Smith’s precise *mechanism* (fellow-feeling via imaginative perspective-taking) into vague kindness or compassion. This makes the theory sound like "be nice," obscuring its core function as a *judgment-forming* mechanism about the *propriety* of passions. It kills the distinction between feeling *with* and approving *of*.
  2.  **Impartial Spectator = Utilitarian Calculator:** Equating "impartial" with modern "impartiality" (giving equal weight to all interests) projects Bentham onto Smith. This destroys the spectator’s role in judging the *propriety* and *merit* of a *specific agent's* passions/actions within *their* context. It turns judgment into social welfare calculation.
  3.  **Internal Spectator = Internalized Actual Audience (The "Poll" Error):** Treating the spectator as merely the internal voice of whatever society one happens to be in reduces it to conformity pressure. This obliterates Smith's core point: the spectator is an *idealized*, *corrected* perspective precisely to *resist* the errors and passions of the actual crowd. It makes moral autonomy impossible.
  4.  **Propriety = Desert:** Failing to rigorously separate whether a passion is *appropriate to its cause* (fitness/propriety) from whether the *object* of the passion *deserves* that passion (merit/desert). This conflates two distinct judgments and makes nonsense of cases where we understand a passion’s origin but condemn its target (or vice versa).

  **The Plan: Ordering, Carrying Example, Misconception Timing, Closing Case & Check**

  **I. Groundwork: The Mechanism of Sympathy (15 mins)**
  *   **Start:** "Forget 'self-interest makes markets work.' Today, we meet *Adam Smith the Moral Psychologist*. His question: How do we form moral judgments about others (and ourselves)? His answer starts not with rules, but with *feeling* – specifically, **sympathy**."
  *   **Define Sympathy Precisely (Board):** "Sympathy: Our capacity to *feel along with* another person by **imagining ourselves in their precise situation**."
      *   *Emphasize:* It's an *imaginative act*, a *mechanism* of emotional resonance, NOT necessarily kindness. We can sympathize with joy, rage, fear – even passions we disapprove of.
      *   **Carrying Example Seed:** "Imagine a colleague, Alex, discovers a rival got a promotion Alex desperately wanted due to office politics. Alex is *furious*." (Plant the seed, don't judge it yet).
  *   **The "How":** Walk through the mechanism slowly.
      1.  We observe signs of passion (Alex's red face, clenched fists, sharp words).
      2.  We use imagination to place ourselves in Alex's *exact situation* (years of hard work, perceived injustice, ambition).
      3.  If our imagination is successful, we experience a *fellow-feeling* (a resonance) with Alex's passion. We *feel* some anger.
  *   **Why Start Here?** The mechanism *must* be clear before judgment enters. Sympathy is the *engine*; approval/judgment is the *output*. Without this, the spectator is indeed just "conscience in a wig" or divine command. Motivation comes next.

  **II. The Problem & The Birth of the Spectator: The Gap Between Feeling and Judging (20 mins)**
  *   **Reveal the Crack:** "But here's the catch: **Feeling *with* Alex (sympathy) is NOT the same as *approving* of Alex's anger.**"
  *   **Develop the Carrying Example: Alex's Anger (Board)**
      *   *Mechanism:* We imagine Alex's situation (rival promoted unfairly). We *feel* a spark of indignation/anger ourselves. Sympathy achieved!
      *   *The Judgment Gap:* "But do we *approve* of Alex storming into the boss's office yelling? Do we think this level of fury is *right*? Probably not." **THIS is the crucial gap.**
      *   **Why this example works:**
          *   Primes apart feeling & approval: We *understand* and *feel* the anger's origin (injustice) but likely *disapprove* of its intensity or expression.
          *   Separates Propriety (Fitness) from Desert: The *cause* (unfair promotion) *might* deserve anger (merit/desert), but the *passion itself* (its intensity, expression) may be *disproportionate* (unfitting/propriety).
          *   **Why obvious candidates fail:** A stranger in distress? Sympathy=pity trap, no judgment gap. Heroic rescuer? Sympathy aligns with approval, hiding the gap. Agreed cases? No tension to motivate the spectator.
  *   **Introducing the Spectator (Necessity Born of Conflict):** "So how do we bridge this gap? How do we judge Alex's anger? We appeal to... **an impartial spectator**."
  *   **Define Spectator (Board):** "The Impartial Spectator: An **imagined, idealized observer** who views the situation **without our personal biases or Alex's blinding passion**, knowing *all* the relevant facts, and possessing a *calm* and *impartial* (meaning *fair*, not self-interested or caught up in the moment) perspective."
      *   *Key Point:* "This is NOT God. It's NOT society's average view. It's NOT *your* conscience barking orders. It's **an ideal perspective we construct *through reason and imagination* to judge the *propriety* of passions**." (Plant flag against "Poll" error).
  *   **How Spectator Judges:** Ask: "What would this calm, informed, detached observer think about the *intensity* and *expression* of Alex's anger? Is it *proportionate* to the cause (Propriety)? Does it fit the occasion?"

  **III. Deepening the Spectator: Propriety, Desert & Authority (20 mins)**
  *   **Clarifying Propriety (Fitness) vs. Desert (Merit) using Alex:**
      *   *Propriety:* "Was Alex's *level* of anger fitting *given the specific provocation*? (Spectator might say: Anger justified, but screaming at boss is disproportionate/unfitting)."
      *   *Desert:* "Did the rival *deserve* Alex's anger? (Spectator might say: Yes, the rival played dirty, so anger *towards rival* has merit; but the *expression* targeted the boss unfairly)."
      *   *Crucial Distinction:* Propriety judges the *passion/action itself* relative to its cause. Desert judges the *target* of the passion/action. They can conflict. (Alex's passion directed at rival may have desert but expressed towards boss was unfitting).
  *   **Source of Spectator's Authority:** "Why listen to this imaginary figure? Because it represents **corrected judgment**."
      *   It corrects *our* biases (e.g., if we dislike Alex, we might under-sympathize).
      *   It corrects the *agent's* passion (Alex is too hot-headed to judge fairly).
      *   It corrects the *actual audience* (the office gossip mill might encourage drama).
      *   **Authority comes from being the *idealized standard* of reasonable, informed judgment about propriety/desert, not from numbers or power.** (Prepping for pile-on case).
  *   **Addressing Misconceptions Explicitly (Timed Defusals):**
      *   *Now:* "Sympathy ≠ Pity/Benevolence! We sympathized with Alex's *anger*, not pity. Sympathy is the *mechanism*, approval is the *judgment* via spectator." (Correct scaffolding).
      *   *Now:* "Impartial ≠ Equal Weighting of All Interests! The spectator judges Alex's *specific passion* in *this context* for propriety/desert. It's not calculating overall happiness." (Correct Utilitarian drift).
      *   *Now:* "Internal Spectator ≠ Internalized Crowd! The spectator is the *corrective* to the actual crowd. It's the voice we construct to *resist* mob opinion or fleeting trends." (Crucially defuse "Poll" error *here* - it's most damaging). *Scaffolding Allowed:* Letting "Sympathy=Pity" stand *very briefly* at the very start (Step I) makes the initial concept relatable, but it *must* be shattered when introducing the judgment gap with Alex's anger (Step II).
      *   *Implicitly Addressed:* Propriety/Desert distinction is built into the Alex example analysis.

  **IV. Application & Test: The Modern Pile-On (15 mins)**
  *   **The Case:** "Taylor, a mid-level manager, makes an awkward, slightly insensitive comment in a large online team meeting (recorded). A few real colleagues express offense. Overnight, the clip goes semi-viral. Hundreds of hostile comments flood in – but 80% are from automated bots or accounts amplifying the outrage. Taylor is devastated, constantly picturing this massive, furious audience. They feel crushed by the judgment."
  *   **Analysis via Smith's Apparatus:**
      *   *Sympathy:* We can *sympathize* with Taylor's distress (imagine being attacked online) AND with the initial offended colleagues (imagine hearing the insensitive remark). Mechanism works.
      *   *The Gap & Spectator:* The key question isn't the *real* audience's reaction (bots, amplified outrage). It's: **"What would the *impartial spectator* say about Taylor's *comment* and the *reaction*?"**
          *   Spectator's Judgment: Would focus on *propriety*: Was the comment *actually* malicious? Was it a clumsy mistake? Was the *level* of online outrage *proportionate* (fitting) to the offense? Would assess *desert*: Did Taylor *deserve* this level of hostility?
          *   **Authority:** The spectator's authority comes *only* from being calm, informed, and impartial. A million bots have *zero* authority – they lack human understanding/judgment. A million *real* but uninformed or hysterical people have *less* authority than a *single* calm, well-informed, impartial judge. **Quantity ≠ Authority. Authenticity (human capacity for reasoned judgment) is necessary but not sufficient; the *idealized correction* is key.** Taylor's task is to appeal to *this* internal spectator, not the imagined horde.
      *   *Why it works now:* The dependencies are in place. We have:
          1.  Sympathy as mechanism (understand Taylor's distress, initial offense).
          2.  The gap between feeling and approval (we feel for Taylor but might disapprove of the comment; we understand initial offense but disapprove of pile-on).
          3.  The spectator as the *unique* judge of propriety/desert, independent of the actual audience's size/passion.
          4.  The distinction between propriety (fitness of outrage/reaction) and desert (did Taylor deserve *this*?).
          5.  The source of the spectator's authority (idealized reason, not numbers).

  **V. The Check: Do They Grasp It? (5 mins)**
  *   **Task:** "Don't use the phrase 'impartial spectator'. Imagine a friend comes to you, deeply upset because they lost their temper at work (like Alex). They feel guilty but also justified. Your job: Explain to them, using Smith's ideas *without jargon*, *how* they might figure out if their anger was truly appropriate or not. What *process* should they go through in their own mind?"
  *   **Why it works:** Passing requires describing the core mechanism and judgment without labels:
      *   They must mention imagining the situation from the outside/another's calm view (spectator).
      *   They must separate understanding the cause (sympathy/feeling) from judging the passion itself (propriety/fitness).
      *   They must avoid appealing to rules, society's view, or simple guilt. If they just say "ask if it was fair" or "see what others think," they've missed it. If they articulate a process of detached self-examination focused on the passion's proportionality to the cause, they've got it.

  **VI. What to Decline & How:**
  *   **Smith vs. Hume:** "That's a fascinating and important comparison, but it requires digging into Hume's different view of sympathy and sentiment that would take us too far afield today. Our focus is understanding Smith's unique apparatus." (Prevents confusion and time sink).
  *   **The Wealth of Nations Connection:** "While Smith saw his moral philosophy and economics as part of a unified project, the *mechanisms* of sympathy/impartial spectator are distinct from the 'invisible hand' of self-interest in markets. We're focusing solely on the moral psychology today." (Keeps focus tight, avoids conflation).
  *   **Historical Context / Debates within Smith Scholarship:** "Scholars debate many nuances of Smith's texts and development. For our purpose today – grasping the core mechanism for practical judgment – we're sticking to the essential structure as presented." (Prevents rabbit holes).
  *   **"Is the Spectator Real/How is it Formed?" (Deep Meta-Ethics):** "Smith is describing a psychological process we *do* engage in, not proving a metaphysical entity. *How exactly* we form this ideal standard is complex, but the key point is that we *do* appeal to such a corrected perspective to make moral judgments beyond our own bias or the crowd's noise." (Avoids unproductive abstraction).

  **Why this Ordering Works:**
  1.  **Sympathy First:** Establishes the fundamental, observable mechanism of moral sentiment.
  2.  **Problem (Feeling ≠ Approval) Second:** Creates the *need* for the spectator using a relatable case (Alex). Motivation is intrinsic to the problem.
  3.  **Spectator as Solution:** Introduced specifically to resolve the tension created in step 2, defining its role and source of authority *against* the actual audience.
  4.  **Propriety/Desert Distinction:** Deepens the spectator's function *using* the case already in play.
  5.  **Modern Case:** Applies the *entire* chain (Sympathy -> Gap -> Spectator (Authority/Propriety/Desert)) to a novel, relevant scenario, demonstrating the apparatus's power.
  6.  **Check:** Tests understanding of the *process* without jargon.

  This sequence builds the dependencies logically, targets misconceptions at the point where they do the most damage (or where the scaffolding becomes obstructive), and equips students to analyze complex, modern social dynamics using Smith's framework. The carrying example (Alex) does the heavy lifting by forcing apart sympathy and approval, and propriety and desert. The pile-on case is answerable because the groundwork establishes that spectator authority stems from idealized judgment, not numbers or volume.
