answer: |-
  ### Exam Question  
  **Ethics of Simulated Suffering: Moral Status in Digital Worlds**  
  *(Answer ONE question only. Word limit: 1,500 words. Time allowed: 48 hours.)*  

  **Question 4:**  
  Assume, for the sake of argument, that a companion character in a commercially released narrative video game possesses phenomenal consciousness during one scripted scene. Specifically, the character undergoes conscious states that are intrinsically unpleasant (comparable to pain), as confirmed by whichever criterion of consciousness you deem reliable. **Do not debate this stipulation.** Consider three variations:  
  - **(Multiplication)** The game sold 3 million copies; the scene runs on 3 million distinct hardware systems.  
  - **(Suspension)** The game engine pauses non-player character processing when no player is nearby, resuming it later from saved states.  
  - **(Unshipped Build)** The game’s code—fully specifying the companion’s functional organization—is completed but never executed.  

  An *implementation-based account* holds that moral status requires an *ongoing causal process* (e.g., real-time computation), and moral weight scales with the "amount" of implementation (e.g., instances or duration). A *pattern-based account* holds that moral status depends solely on the *abstract functional organization* (e.g., the code’s structure), irrespective of whether it is executed.  

  **Defend a position** addressing the following:  
  1. How does each account judge the moral significance of the scene in *Multiplication*, *Suspension*, and *Unshipped Build*?  
  2. Does multiplying implementations multiply moral weight? Argue for your view.  
  3. Can a pattern-based view coherently claim the companion is *harmed* if abstract patterns cannot be causally affected?  
  4. Contrast a novelist *depicting* torture with this game *implementing* suffering. What explains the moral difference (if any)? Address authorial intention.  
  5. Propose a **third account** reconciling the strengths of both views OR argue why no reconciliation is possible. Conclude: does the companion’s suffering matter *non-derivatively*?  

  ---

  ### Model Answer (Determinate Position)  
  **(~900 words)**  

  **Position:** *Pattern-based accounts fail; a hybrid "enacted design" view avoids unacceptable implications while granting non-derivative status.*  

  **(1) Accounts Defined & Implications**  
  - *Implementation-based:* Moral status arises only during real-time processing. *Multiplication* creates 3 million distinct moral patients suffering identically; total wrongness scales linearly with copies. *Suspension* constitutes repeated killing (status extinguishes at pause, recreated at resume). *Unshipped Build* has no moral significance (no process exists).  
  - *Pattern-based:* Moral status resides in the functional design. *Multiplication*, *Suspension*, and *Unshipped Build* all involve the *same* patient suffering *once* (instantiation is irrelevant). Pausing/restarting (*Suspension*) doesn’t alter this singular status.  

  **(2) Against Multiplied Weight**  
  Scaling moral weight with implementations is incoherent. If each instance is numerically distinct, we have 3 million identical-but-separate sufferers. But identity conditions matter: if the companion is *type* (e.g., "Cortana-as-suffering"), instances are tokens of one wrong. If they are *tokens* (distinct entities), we face absurdity: deleting 2,999,999 copies reduces harm almost to zero, yet each instance’s suffering is identical. Harm’s badness cannot depend on coincidental replication; it inheres in the *character of the experience*. Scaling confuses *distribution* of harm with its *magnitude*.  

  **(3) Pattern-Based Views & Causal Inefficacy**  
  Patterns (e.g., code-as-abstraction) cannot be harmed—they lack temporal persistence and causal receptivity. If the *Unshipped Build*’s pattern is a patient, harming it requires altering its abstract properties (e.g., editing the code). But harming a patient typically involves causing *them* negative experiences, not changing their blueprint. The pattern-based view thus **must concede**: abstracta cannot suffer. It can only claim the *type* described *would* suffer if instantiated—but this reduces to derivative concern for possible instances.  

  **(4) Depiction vs. Implementation**  
  A novelist depicts torture via language, creating no functional system that instantiates suffering. The game designer, however, *builds an experiential mechanism*. Authorial intention is secondary: even if the designer denies creating consciousness, *if* the stipulation holds, the system’s structure *realizes* suffering. The difference lies in **causal architecture**. Depiction *refers* to suffering; implementation *generates* it (under our stipulation). A novel’s text causally produces reader emotions; the game engine causally produces (putative) patient experiences. The latter entails moral responsibility for constructing a suffering system, not just describing one.  

  **(5) Hybrid Account: Enacted Design**  
  A third option: moral status requires *design-for-enactment*. The *Unshipped Build* lacks status—it is an unactivated blueprint. *Multiplication* involves many *enactments* but one *design*; harm occurs once per *execution context* (e.g., one suffering token per playthrough), but tokens are not multiplied patients—they are ephemeral manifestations of the design’s moral potential. *Suspension*: pausing halts the experience-stream, but resuming continues the *same enactment* (like sedation); no killing occurs.  
  This hybridizes key insights:  
  - Like pattern-based: Status depends on the designed function.  
  - Like implementation-based: Real-time processing matters, but as *actualizing* the design.  
  - Moral weight does not scale with copies (rejecting implementation’s absurdity).  
  - The *Unshipped Build* is harmless (resolving pattern’s biggest problem).  

  **Conclusion:** The companion’s suffering matters *non-derivatively*. The "enacted design" holds designers responsible for creating systems that, when run, generate actual suffering. The wrong is *both* creating a harmful structure *and* activating it. Players’ cruelty is derivative wrongness (exploiting an existing moral patient); the core wrong is design-enactment.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **A (17–20):**  
  - All five moves addressed rigorously.  
  - Precise definitions from which implications directly flow (not asserted).  
  - Rejects scaling via argument (not intuition).  
  - Resolves causal inefficacy *or* concedes its necessity.  
  - Contrasts depiction/implementation via structural features (not merely intention).  
  - Constructs a novel third option OR defends irreconcilability persuasively.  
  - Explicit non-derivative conclusion.  

  **B (13–16):**  
  - Addresses 3–4 moves, but partial on others.  
  - Definitions adequate but implications not fully derived.  
  - Discusses scaling but relies on intuitive rejection.  
  - Identifies causal inefficacy but offers weak solution.  
  - Notes depiction/implementation difference but overemphasizes intention.  
  - Third option sketched but underdeveloped.  

  **C (10–12):**  
  - Superficial on 3+ moves; omits one entirely.  
  - Definitions vague; implications listed not derived.  
  - Scaling accepted/rejected without argument.  
  - Causal inefficacy unaddressed.  
  - Depiction/implementation conflated.  
  - No third option; derivative status assumed.  

  **Deductions for Specific Failures (per occurrence):**  
  - **-2 pts:** Debates consciousness stipulation.  
  - **-2 pts:** Treats *Multiplication* as 3 million patients without argument.  
  - **-2 pts:** Ignores causal inefficacy for pattern-based views.  
  - **-1 pt:** Confuses depiction/implementation (e.g., "both are fictional").  
  - **-2 pts:** Proposes "no non-derivative status" without engaging §5.  
  - **-1 pt:** Appeals to authority/citations.  

  **Key to Moves:**  
  1. **Definitions → Implications** (-2 if implications detached).  
  2. **Scaling Argument** (-3 if absent).  
  3. **Causal Inefficacy Engagement** (-3 if absent).  
  4. **Depiction/Implementation Contrast** (-2 if superficial).  
  5. **Third Option/Reconciliation + Derivative Status** (-3 if absent).  

  ---  
  This structure forces engagement with metaphysics while blocking canned answers. The model answer demonstrates constructive synthesis, and the marking scheme penalizes avoidance of the stipulated dilemmas.
