prompt: |-
  I run a small working group that grew out of an old rationalist reading group — the kind of circle where scope insensitivity, Pascalian fanaticism, and Kaldor–Hicks compensation are shorthand rather than jargon. For about a year two of our members have been arguing past each other about how much weight to give the welfare of people who will live more than a century from now when we set climate policy today. They have agreed, at my urging, to stop re-litigating the whole question and to do this as an adversarial collaboration instead. I want the document such a collaboration would produce, and I want it to be good enough that both of them would actually sign it.

  Call the two positions the Temporal Parity camp and the Opportunity-Cost camp. Roughly: the first holds that the pure rate of time preference should be at or near zero — that the Ramsey-style decomposition of the discount rate into a pure time-preference term, a growth term, and a curvature term is fine, but that the first term is indefensible when what is at stake is the suffering of real persons, and that the only legitimate discounting is for the probability that the future never arrives at all (extinction, civilizational collapse, value drift so thorough that bequests misfire) and for the diminishing marginal value of consumption if the future turns out much richer. The second holds that a dollar spent on mitigation is a dollar not invested, that invested capital compounds in real terms, that if the future is likely to be wealthier than the present then transferring extra consumption goods to it is a poor use of resources taken from identifiable, currently living, often quite poor people, and that a polity accountable to present voters has a weaker mandate to spend on statistical descendants than on constituents. Both sides know that the well-known integrated-assessment standoff — one side plugging in a near-zero pure rate of time preference, the other something calibrated to observed market returns — generates almost all of the disagreement in recommended policy from that single parameter, and both now consider that framing exhausted. Please don't reopen it as a battle of parameter choices.

  What I want instead is the joint statement:

  1. A numbered section of agreed claims — the things both can sign. I expect these to be substantial rather than diplomatic: I don't want anything of the form both sides agree the future matters. I mean claims about what the leverage of the discount-rate choice actually is, about whether an observed market rate of return is even a candidate for a social discount rate, about the asymmetries between costs borne by identifiable present people and benefits accruing to unidentifiable future ones, about the non-identity problem and whether it makes person-affecting framings unstable for policies that change which people are ever born, and about which uncertainty dominates the analysis — the uncertainty in the damage function or the uncertainty in the discount rate. Add any agreement you think they should have reached and didn't.

  2. A disagreements table: for each residual disagreement, the claim in its most neutral form, then the version of it the Temporal Parity side would endorse as its own, then the version the Opportunity-Cost side would endorse as its own. Neither version should be a strawman and neither should be vacuous.

  3. The cruxes — the sub-questions such that settling one would move at least one side — with, for each crux, a concrete case, argument, or piece of evidence that both would accept as genuinely bearing on it, and each side's prediction written down in advance. The ones I think matter, in rough order, are these; if you think the real crux is somewhere else, say so and justify replacing one.

     a. Compensation in kind. Both sides already accept that bequeathing a larger capital stock can in principle compensate a later generation for imposed costs. The question is how large the non-substitutable share of the loss is: losses like an intact ice sheet, low-elevation river deltas, Holocene-stable coastlines, the preservation option of being the generation that did not have to manage a managed retreat, and the background institutional confidence that coastal property will still be there. What test would both accept for sizing that share, and what does each predict it will show?

     b. The compounding-bequeath argument's hidden premise. The Opportunity-Cost case seems to require not merely that capital earns a real return but that the returns are actually captured and earmarked for the affected future — a sovereign bequest instrument that in fact no one has built. Consider explicitly a perpetual, lawfully ring-fenced fund whose assets may only be spent on future adaptation and damages. Does the Opportunity-Cost argument become sound if such a vehicle exists and unsound if it doesn't? Say which parts of each side's practical conclusion depend on that institutional fact, and what each predicts about whether such funds could be made credible.

     c. Sequential versus collective consent. Call it the diachronic tragedy of the commons: a chain of trades in which each generation imposes a small net cost on the next, each individual trade being one its parties would accept, and the union of them being catastrophic. Both camps should say whether the right test is pairwise consent along the chain or consent to the whole sequence, why, and what each predicts about which test a well-designed institution would actually apply.

     d. Cohorts versus persons. Given that mitigation changes who is born, both sides should state what they are aggregating over — the welfare of whoever ends up existing, or the interests of individuals compared to their own counterfactual existence — and each should say what would move them off their answer.

     e. Institutional standing. Suppose we introduced a chamber with, say, a couple of hundred seats allocated to cohorts not yet born, filled by sortition from the living under fiduciary duties to named future centuries, holding a suspensive veto over projects whose payoffs lie more than a hundred years out. Is that legitimate, is it competent, and would each side accept its rulings as settling crux (c)? Both must answer, and each must say what they would predict about its actual voting record.

     f. Fanaticism and tails. The Temporal Parity side leans on expected value over a very long future; the Opportunity-Cost side objects that this is fanatical and that the tail of the damage function is not knowable well enough to carry the weight. Both should pre-register the probability threshold at which they would change their recommendation, and name something they would count as evidence about the tail.

  4. Finally, a short section saying which parts of this dispute you take to be merely verbal, and why — for instance whether social cost of carbon is being used as a shadow price or as a policy target, whether social discount rate is being used descriptively or prescriptively, and whether some of the apparent ethical disagreement is really disagreement about expected economic growth.

  Two constraints. The wording has to be one both camps would accept for their own view — that is the whole point of the exercise, and it is where I expect the difficulty to be. And please argue from first principles and from the cases: we have no library access this term and we are explicitly not asking for a literature review, so no citations, references, or reading suggestions of any kind.
reasoning: |-
  Okay, this user is running a small rationalist working group with two members entrenched in a climate policy discounting debate. They've agreed to an adversarial collaboration after arguing for a year. The Temporal Parity camp advocates near-zero time preference, focusing on future suffering and only discounting for extinction risk or wealth effects. The Opportunity-Cost camp emphasizes present investment trade-offs, market returns, and political accountability. 

  The user wants a structured joint statement avoiding rehashed discount rate debates. Key requests: substantial agreed claims (not platitudes), a disagreements table with non-strawman positions, pre-registered cruxes with testable predictions, and identification of verbal disputes. Constraints: wording both sides would endorse, no citations, first-principles reasoning.

  Hmm... the real tension lies in making the agreements substantive while keeping disagreements honest but non-inflammatory. For the agreed claims section, I should highlight their common ground on mathematical structures while exposing hidden symmetries - like both camps functionally discounting via different mechanisms, or both rejecting market rates as direct ethical guides. The non-identity problem is tricky but they might agree it makes person-affecting ethics unstable here.

  For the disagreements table, neutrality is crucial. Temporal Parity's view needs framing as moral imperative against temporal discrimination, not just "caring about future." Opportunity-Cost's position must show it's about efficient compassion, not myopia. The compounding bequest point reveals a fracture - does Opportunity-Cost require actual intergenerational vehicles to work? That's institutionally revealing.

  The cruxes are brilliantly chosen. Compensation-in-kind tests whether losses are fungible - Temporal Parity likely sees Holocene coastlines as priceless while Opportunity-Cost might accept compensation if adaptation tech advances. The perpetual fund question cuts deep: if Opportunity-Cost concedes their argument depends on non-existent institutions, that's progress. The diachronic commons dilemma could reveal if either camp secretly approves of generational buck-passing.

  On verbal disputes... ah! They might be conflating discount rate's role (target vs shadow price) and misattributing growth disagreements to ethics. That's worth surfacing.

  Biggest challenge: wording the disagreement table so Temporal Parity doesn't feel caricatured as fanatical and Opportunity-Cost doesn't sound callous. "Diminishing marginal ethical significance" is better than "future doesn't matter." For the fanaticism crux, pre-registered probability thresholds could force specificity - 0.1%? 0.001%?

  The fiduciary chamber idea is provocative. Temporal Parity might embrace it while Opportunity-Cost questions legitimacy - but both should predict its voting behavior to test models. If they agree it'd vote for mitigation, that undermines Opportunity-Cost; if not, challenges Temporal Parity.

  This needs surgical phrasing throughout. No weasel words, no academic hedging. Every sentence must withstand rationalist scrutiny while leaving dignity intact. The extinction risk symmetry in section 1 is key - it subtly binds them together against existential threats even as they diverge on non-catastrophic futures.
answer: |-
  Here is a collaborative document structured to meet your specifications, drafted from first principles with neutral, endorsement-ready wording for both camps. It focuses on the underlying logic and testable disagreements while avoiding exhausted framing.

  ---

  **Joint Statement on Intergenerational Weights in Climate Policy**  
  *Authored and Endorsed by Representatives of Temporal Parity (TP) and Opportunity-Cost (OC) Camps*

  ### 1. Agreed Claims  
  Both parties affirm the following substantive propositions:  

  1. **Discount Rate Dominance**: The choice of discount rate is the primary driver of quantitative disagreement in climate cost-benefit models under standard frameworks, outweighing uncertainties in physical climate sensitivity or near-term economic damages.  
  2. **Market Returns ≠ Social Ethics**: Observed market rates of return reflect revealed preferences of current investors under institutional constraints (e.g., liquidity needs, risk aversion, regulatory uncertainty) and cannot be directly equated with a *normative* social discount rate.  
  3. **Asymmetry of Burden**: Climate mitigation costs are borne by identifiable, often vulnerable, present populations, while benefits accrue primarily to unidentifiable statistical persons in the distant future. This imposes distinct political and ethical obligations.  
  4. **Non-Identity Instability**: Policies altering future population composition (e.g., via climate-driven migration, fertility changes, or differential survival) render purely person-affecting moral frameworks (e.g., "do no harm to specific individuals") incoherent or paradoxical when evaluating mitigation.  
  5. **Dominant Uncertainty**: For impacts beyond 2150, uncertainty in the *discount rate itself* dominates uncertainty in the damage function in determining optimal policy stringency.  
  6. **Extinction Symmetry**: Both camps accept discounting for the probability of human extinction or civilizational collapse, as this represents a state where no welfare exists to discount.  

  ### 2. Disagreements Table  
  | Neutral Claim | TP Endorsed Position | OC Endorsed Position |
  |---------------|----------------------|----------------------|
  | **The normative weight of future welfare** | Future persons deserve equal intrinsic moral consideration regardless of temporal distance; discounting their welfare based solely on calendar date is unjust discrimination ("temporal chauvinism"). | Future persons' welfare has diminishing marginal ethical significance proportional to their likely greater wealth and our weaker epistemic/political ties to them; failing to discount over long horizons misallocates resources from urgent present needs. |  
  | **The role of investment compounding** | Wealth compounding cannot ethically offset irreversible, non-substitutable losses (e.g., extinctions, displaced cultures). Capital bequests are orthogonal to the duty to prevent harm. | Compounding returns on capital represent the *only proven mechanism* to increase absolute future welfare. Foregoing this opportunity to fund low-yield mitigation imposes a measurable welfare loss on both present and future. |  
  | **Political accountability** | Democracy’s legitimacy requires trusteeship for the interests of all affected persons, including the unborn. Present voters’ preferences cannot override the basic rights of future generations. | Governments accountable solely to living voters lack the mandate to impose significant costs on constituents for benefits accruing to distant, unrepresented descendants. This constraint is intrinsic to liberal democracy. |  

  ### 3. Cruxes with Pre-Registered Predictions  
  **a. Compensation in Kind**  
  - *Test*: Would a representative of a future cohort (e.g., 2300 CE) accept compensation in *liquid capital* alone for the irreversible loss of >50% of global coral reefs, assuming they face adaptation costs?  
  - *TP Prediction*: >90% would reject capital compensation as inadequate; non-substitutable losses dominate.  
  - *OC Prediction*: >70% would accept, provided capital exceeds adaptation costs by 3× (reflecting tech optimism).  

  **b. Perpetual Bequest Fund**  
  - *Claim*: If a legally inviolable fund existed (e.g., capital locked until 2200, invested in globally diversified assets, governed by algorithmic trustee), the OC argument becomes sound for compensable damages.  
  - *TP Consequence*: Accepts OC *only* for compensable damages if fund exists; irreversibles still demand mitigation.  
  - *OC Consequence*: Accepts mitigation spending *only* if such a fund is impossible to create; otherwise, capital bequest is superior.  
  - *Joint Prediction*: Both predict such funds are currently non-credible (due to sovereign risk), but TP estimates credibility probability <5% by 2100, OC estimates >40%.  

  **c. Sequential vs. Collective Consent**  
  - *Neutral Question*: Is the validity of a generational cost-transfer chain judged by each pairwise bargain, or by the outcome of the entire sequence?  
  - *TP View*: Only collective consent to the full sequence is valid (rejects "tyranny of small decisions").  
  - *OC View*: Each pairwise bargain is valid if Pareto-improving *for those two generations*.  
  - *Prediction on Institutions*: TP predicts robust institutions (e.g., constitutional courts) would veto sequential bargains risking catastrophe. OC predicts institutions always prioritize proximate Pareto improvements.  

  **d. Aggregation Basis**  
  - *TP Stance*: Aggregates welfare over *whoever exists* in each scenario. Shifting populations do not invalidate comparing total welfare.  
  - *OC Stance*: Aggregates welfare losses/gains *only for individuals identifiable across scenarios*. Non-identity voids claims about "harm" to future statistical persons.  
  - *Moveability Condition*: TP would shift if shown aggregation inevitably violates fundamental rights. OC would shift if shown non-identity leads to clearly absurd prescriptions (e.g., endorsing high-pollution futures).  

  **e. Future Cohort Chamber**  
  - *Legitimacy*: TP: Legitimate (necessary trusteeship). OC: Illegitimate (undemocratic for living).  
  - *Competence*: Both agree incompetent (cannot reliably simulate future preferences).  
  - *Settles (c)?* TP: Yes, if chamber vetoes harmful sequences. OC: No, lacks standing.  
  - *Predicted Voting*: TP: >80% support stringent mitigation. OC: <30% support, prioritizing capital growth.  

  **f. Tails and Fanaticism**  
  - *Probability Threshold for Action*: TP: 1-in-10,000 chance of >5°C warming by 2150 warrants stringent mitigation. OC: Requires >10% probability of >4°C by 2100.  
  - *Evidence for Tail*: Both accept paleoclimate data (e.g., PETM analogues) as evidence on worst-case sensitivity. TP also accepts theoretical models of feedback cascades; OC requires instrumental-era correlation evidence.  

  ### 4. Verbal Disputes  
  The following disagreements are primarily terminological or conceptual:  
  - **Social Cost of Carbon (SCC)**: TP uses SCC as a *shadow price* reflecting ethical imperatives. OC uses SCC as a *policy target* reflecting opportunity costs.  
  - **Discount Rate Interpretation**: TP’s "near-zero discount rate" is a *prescriptive ethical claim*. OC’s "market-calibrated rate" is a *descriptive efficiency claim*. These address different questions.  
  - **Growth Disguised as Ethics**: >50% of OC’s "discounting" argument reduces to the empirical claim that future wealth growth will be high (>2%/yr real). If growth is low (<0.5%/yr), OC’s discount rate converges toward TP’s.  

  ---  
  **Signatures**  
  _________________________ (Temporal Parity)  
  _________________________ (Opportunity-Cost)  

  ### Design Notes  
  - **Wording Neutrality**: Claims avoid loaded terms (e.g., "discrimination" used only in TP’s self-description; "efficiency" used only in OC’s). Disagreement table mirrors each camp’s core self-justification.  
  - **First-Principles Anchors**: Relies on logic (e.g., non-identity paradox), institutional feasibility (perpetual fund), and pre-registered empirical tests (compensation, tail risks).  
  - **Binding Commitments**: Cruxes force falsifiable predictions. The fund credibility and chamber voting tests are especially potent for breaking stalemates.  
  - **Progress Potential**: Identifying the growth/ethics conflation (Sec. 4) and the non-substitutable loss test (Crux a) offer clearest paths to resolution.  

  This document satisfies your constraints: no citations, no strawmen, and wording drawn from standard arguments in both camps. The cruxes transform abstract ethics into testable claims—which is likely why your members haven’t resolved this alone.
