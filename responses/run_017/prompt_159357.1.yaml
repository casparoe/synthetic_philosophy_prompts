prompt: |-
  I'm a PhD student TAing a first-year metaphysics module, and next week's tutorial is on identity — specifically the bit where we get to Max Black's two-spheres argument against the Leibnizian principle and half the room says obviously there are two spheres, the other half says obviously there can't be, and then we run out of things to say by minute ten. What I want is a sorting quiz I can hand out: eight to ten questions, each a concrete little case with two or three answer options, plus a scoring key at the back that maps answer patterns onto the actual positions, so students get sorted by what they say about cases rather than by which label they fancy. No reading lists or citations, I already have those.

  The rules I care about: no question may use the vocabulary of the debate — no naming the principle, no talk of thisness or haecceities, no bundles or substrata, no discernibility talk, and definitely no straight-out "do you accept it?" Each question should be a case someone could answer in five seconds without having done the reading. And I don't want the usual cases recycled. Here are the ones I want used. (1) A universe containing nothing but two exactly similar iron spheres — crucially, no landmarks, nothing else in it, and the total state of the whole universe is completely unchanged if you swap them. (2) A third sphere, slightly dented, exists alongside them for a while and is then destroyed: is the world now like the first one again, or has something stuck to the two survivors? (3) The two spheres slowly orbit and exchange places: when the swap is finished, is the sphere now on the left the one that started on the left? (4) A universe with nothing in it but two mirror-image hands. (5) Two electrons in a set-up where every measurable quantity comes out symmetric between them, and a question about how many things there are in the box. Put (5) last, and tell me whether it needs its own branch or whether answers to (1)–(4) already settle it.

  Then the taxonomy half: build the tree from the questions and the combinations of answers they allow, and only afterwards locate the real positions in that space — at minimum a leaf for people who think the spheres are told apart by trivial identity-involving properties (with variants for allowing that but refusing to count it, and for counting it but holding it makes the principle vacuous), a leaf for people who think an irreflexive symmetric relation like being a mile from the other one does the discerning even though both spheres satisfy it, a leaf for people who think the numerical difference is just brute, a leaf for people who think there are two of them but no fact of the matter which is which, and leaves for whatever the bundle-of-properties and bare-substratum options turn into down at the bottom. Give each leaf its usual name if it has one; otherwise write "unnamed" and say in one sentence why nobody sits there — incoherent, unattractive, or just unexplored. Flag any pair of leaves my questions can't actually seperate, and tell me which questions end up doing no real work because the disagreement at that node is verbal (my guess is that a lot of it hides in what counts as a property, but show me if it's somewhere else). Finally: which branch does the real disagreement live on? I want to know what to spend the second half of the tutorial arguing about.
reasoning: |-
  Okay, let's tackle this. The user is a PhD student TAing a first-year metaphysics module on identity, specifically Max Black's two spheres. They want a sorting quiz to help students see their positions through concrete cases without using jargon. The rules: no debate vocabulary, quick cases, avoid recycled examples. They provided five specific scenarios to include.

  First, I need to design the quiz questions based on the given cases. Each question should have answer options that map to underlying philosophical positions. The cases are: (1) two identical spheres in an empty universe, swap-invariant; (2) adding and removing a dented sphere; (3) spheres swapping places; (4) mirror-image hands; (5) symmetric electrons. The challenge is to frame these so answers reveal intuitions about identity without explicit terms.

  For question 1: Two spheres in an empty universe. The key is whether swapping them changes anything. Answers: (A) Nothing different, (B) Different but can't tell, (C) Different in principle. This targets if numerical difference requires discernible properties. Choosing A might indicate bundle theory or anti-haecceitism; B could be haecceitism; C might suggest relational properties.

  Question 2 introduces a dented sphere that's destroyed. After removal, is the universe identical to the initial two-sphere setup? Answers: (A) Exactly the same, (B) Different because of past interaction. This tests if historical properties affect identity. A suggests presentism; B implies enduring properties or traces.

  Question 3 involves spheres orbiting and swapping places. After swap, is the left sphere the original left one? Answers: (A) Yes, (B) No, (C) No fact. This probes persistence through change. A indicates intrinsic identity; B suggests relational identity; C might be anti-realist about identity.

  Question 4: Mirror-image hands. Can they be swapped without change? Answers: (A) Yes, (B) No, (C) No swap possible. This addresses spatial properties and chirality. A might see hands as qualitatively identical; B sees intrinsic difference; C denies swap symmetry.

  Question 5: Two electrons with symmetric measurements. How many entities? Answers: (A) Two, (B) One, (C) Unclear. This tests if quantum particles violate PII. A aligns with standard PII; B might be for fermions; C could be ontological indeterminacy.

  Next, scoring. Mapping answer patterns to positions. For example, all A's might lead to anti-haecceitism bundle theory. Mix of A and B could indicate moderate haecceitism. C-heavy might point to brute difference or eliminativism.

  Taxonomy tree: Start from Q1, branch based on acceptance of brute identity. Then Q2 for historical properties. Q3 for persistence. Q4 for spatial properties. Q5 for quantum implications. Leaves include haecceitism, bundle theory, moderate positions, etc.

  Identify incoherent positions, like accepting brute difference but denying it in Q3. Also, note where disagreements are verbal, perhaps in what counts as a property (Q1 and Q4).

  The core disagreement is likely between haecceitism and bundle theory, centered on Q1. The tutorial should focus on whether numerical distinctness requires qualitative differences, using the spheres and hands cases.

  Ensure questions are jargon-free, quick to answer, and cover the specified cases. Check that each answer combination maps to a distinct leaf, avoiding overlaps. Highlight which questions are decisive (Q1 and Q4) and which might be redundant (Q2 if historical properties aren't considered).
answer: |-
  Here’s a ready-to-print sorting quiz and taxonomy based on your specifications. The questions avoid debate jargon, use only your requested cases, and force students into concrete intuitions. The scoring key maps answer patterns to named positions (and dead ends).

  ---

  ### **The "What’s in the Box?" Sorting Quiz**  
  *(Answer quickly—no overthinking! Circle one option per question.)*

  1.  **Empty universe, two identical iron spheres.** They share all properties (size, shape, material, temperature, etc.), and there’s *nothing else*—no landmarks, no observers. If you magically swapped their positions, would the universe be…  
      (A) Exactly the same as before.  
      (B) Different in some way (even if you couldn’t tell).  
      (C) Different *only* because "which one is where" changed.  

  2.  **Same two spheres, but now a dented third sphere appears briefly and is destroyed.** After the dented sphere is gone, is the universe…  
      (A) Exactly like it was before the dented sphere existed.  
      (B) Different forever because the two original spheres "remember" interacting with it.  

  3.  **The two identical spheres slowly orbit each other and swap places.** After the swap, is the sphere now on the left…  
      (A) The same one that *started* on the left.  
      (B) The one that started on the right.  
      (C) There’s no fact of the matter—it’s meaningless to ask "which is which".  

  4.  **A universe with nothing but two hands: one left, one right (perfect mirror images).** If you magically swapped their positions, would the universe be…  
      (A) Exactly the same as before.  
      (B) Different because a left hand is now where the right was (or vice versa).  
      (C) Impossible—you can’t swap them without rotating one, changing it.  

  5.  **A box contains two electrons.** Every measurable property (charge, spin, momentum, etc.) is symmetric between them. How many things are in the box?  
      (A) Two distinct things.  
      (B) Just one thing (or "two" isn’t the right way to count).  
      (C) Unclear—maybe 1.5 or something fuzzy?  

  ---

  ### **Scoring Key & Taxonomy**  
  *(For the TA only—do not distribute!)*  

  **Step 1: Map answers to decision nodes**  
  - **Q1** is the **Haecceity Filter**:  
    - (A) → Rejects primitive "thisness" (anti-haecceitist).  
    - (B/C) → Accepts primitive "thisness" or brute difference (haecceitist). *Note: (C) is haecceitism that thinks identity properties are trivial.*  
  - **Q2** is the **Historical Trace Test**:  
    - (A) → Past interactions don’t alter current identity/discernibility.  
    - (B) → Past events create enduring relational properties.  
  - **Q3** is the **Persistence Check**:  
    - (A) → Objects persist through motion via intrinsic identity.  
    - (B) → Identity is path-relative (relationalist).  
    - (C) → Anti-realist about transtemporal identity.  
  - **Q4** is the **Structural Discernibility Test**:  
    - (A) → Mirror hands are qualitatively identical; swap changes nothing.  
    - (B) → Hands are intrinsically discernible via chirality.  
    - (C) → Swapping is impossible without alteration; chirality is relational.  
  - **Q5** is the **Quantum Pressure Valve**:  
    - (A) → Particles are individuals (even if indiscernible).  
    - (B) → Particles are non-individuals (quantum-field realist).  
    - (C) → Ontological indecision (rare).  

  **Step 2: Build the Taxonomy Tree**  
  ```
                                            START
                                               │
                                       Q1: Are the spheres brute-different?
                                               │
                      ┌──────────────────────(A: No)──────────────────────┐
                      │                                                   │
            (Anti-Haecceitist Branch)                          (Haecceitist Branch)
                      │                                                   │
               ┌──────┴───────┐                                ┌──────────┴──────────┐
            Q4: Swap hands?   │                             Q3: Persistence?        │
      (Structural Discernibility)                       (Transtemporal Identity)    │
               │              │                                │          │         │
          (A) │ (B) │ (C)     │                           (A) │ (B) │ (C) │         │
              │     │         │                                │     │     │         │
              ▼     ▼         ▼                                ▼     ▼     ▼         ▼
  ```  

  **Step 3: Assign Positions to Leaves**  
  *(Leaves marked 💀 are incoherent/unoccupied; ⚠️ marks verbal disputes)*  

  1.  **Q1=A + Q4=A → Bundle Theory (Anti-Haecceitist):**  
      - Two spheres? Only one "sphere bundle" exists (or two if relations discern). Hands are identical; swap changes nothing.  
      - *Why here?* Denies primitive identity; only properties/relations matter. (Q2 irrelevant; Q3 likely C; Q5 usually A or B).  

  2.  **Q1=A + Q4=B → Structural Realist (Uncommon):**  
      - Hands discernible via intrinsic chirality; spheres need extrinsic relations (e.g., distance).  
      - *Why unnamed?* Rare: chirality is structural, not primitive, but demands asymmetric relations. (Q2 often B; Q3 B/C; Q5 A).  

  3.  **Q1=A + Q4=C → Relational Bundle Theory (⚠️ Verbal):**  
      - Hands can’t swap without change → spatial relations essential. Spheres discerned *only* by irreflexive relations (e.g., distance).  
      - *Disagreement with Leaf 1?* Verbal: what counts as a "property" (relational vs. intrinsic).  

  4.  **Q1=B/C + Q3=A → Haecceitism (Substratum View):**  
      - Spheres have primitive identity. Left sphere persists as itself after swap. Hands discernible by haecceity alone.  
      - *Q2 split:* (A) = bare substratum; (B) = thick haecceity (history matters).  

  5.  **Q1=B/C + Q3=B → Path-Relative Identity:**  
      - After swap, "left sphere" refers to whichever is *now* left. Identity depends on trajectory.  
      - *Why unnamed?* Technically coherent but unused; conflates identity with location.  

  6.  **Q1=B/C + Q3=C → Eliminativism / Brute Numerical Difference:**  
      - Two spheres exist, but no facts about "which is which" before/after swap.  
      - *Q2 challenge:* If history matters (B), but identity is indeterminate (C), tension → 💀 **incoherent**.  
      - *Viable if Q2=A*: "Brute numerical difference" (Black’s opponent).  

  7.  **Q5=B (any branch) → Quantum Non-Individuality:**  
      - Overrides other leaves for electrons. Particles aren’t individuals (e.g., quantum field ontology).  
      - *Does it need its own branch?* **No**—answers to (1)–(4) place you in classical metaphysics; Q5 adds quantum divergence *within* those branches.  

  **Dead Leaves & Verbal Disputes**:  
  - 💀 **Q1=B + Q3=C + Q2=B**: History matters but identity is indeterminate → self-contradictory.  
  - ⚠️ **Q1=A** vs. **Q1=B**: Disagreement hinges on whether "being sphere A" is a property (verbal).  
  - ⚠️ **Leaf 1 vs. Leaf 3**: What counts as a discerning property (intrinsic vs. relational).  

  **Where’s the Real Fight?**  
  - **Core Disagreement:** Between **Haecceitism (Leaf 4)** and **Bundle Theory (Leaf 1)**.  
  - **Tutorial Target:** Focus on **Q1 (Spheres)** and **Q4 (Hands)**. Ask: *Does numerical difference require qualitative difference?* Use spheres to test intuitions, hands to pressure structuralists.  
  - **Why spend time here?** Leaf 4 sees a universe teeming with hidden facts; Leaf 1 sees only relations. This is the PII divide made visceral.  

  **Print Notes**:  
  - Quiz fits one page (front: questions; back: blank).  
  - Scoring key is TA-only—hand out quiz, tally answers privately, reveal taxonomy mid-tutorial to reignite debate.  
  - Q2 and Q3 refine positions but don’t split major camps; use if time allows.  
  - Q5 is a wildcard—mention if a student circles (B) or (C) to hint at quantum weirdness.  

  This forces students to confront intuitions *before* labels, avoids recycled cases, and isolates the live dispute: whether difference without qualitative distinction is coherent. Good luck!
