prompt: |-
  Hey — I write historical novels (the last one was set in Dublin in 1798, the one I'm slogging through now is about a family of glassmakers in Bohemia around 1880) and I keep having the same argument with myself, and ocassionally with a reader, about what I'm allowed to invent. I've dipped into the history-theory stuff — the Rankean ideal of showing the past as it really was, Carr being sceptical about whether facts even arrive unselected, White and the narrativist crowd saying the shape is imposed anyway — and none of it seems to be about my actual problem. Selection isn't my problem, obviously I select. Invention is. So here's my list of gut verdicts, and what I want from you is the principle underneath them, if there is one, plus which of them I have to give up.

  Fine, no guilt at all: inventing a minor person who isn't in the record — a furnace boy at the glassworks, a maid, a clerk. Nobody thinks there's a roll-call.

  Not fine, and this is the one that wakes me up: putting a made-up sentence into the mouth of a real, documented person, in a scene I've invented anyway.

  Fine, and I do it constantly: putting that same real person in a room he was almost certainly not in, on a day when he was documented in another city, for a scene that's invented anyway.

  Not fine, and it feels worse than the furnace boy even though both are "adding a person": fusing two real minor figures into one composite character.

  Not fine: moving a real, datable event by nine days so it collides with my plot.

  Fine: reordering two private quarrels whose real order the record doesn't settle at all, so that the second one lands where I need it.

  Fine, obviously, everyone does it: a real person's thoughts, motives, what they wanted and were ashamed of — unless the record actually says otherwise, and then it flips to not fine.

  Fine, no problem at all: a whole counterfactual novel, clearly signalled as one on the jacket.

  The worst thing on my list, worse than the made-up sentence: one counterfactual event slipped into a book that otherwise tracks the record, with nothing signalling it.

  Torn, leaning fine: turning something we only have as a paraphrase in somebody's letter into direct speech.

  Now, the two that I think are genuinely hard to hold together. The made-up sentence and the wrong room are the same move — I'm placing a real person where the record doesn't place them — and I condemn one and don't even hesitate over the other. I have a story: it's about quotation, that words are different from whereabouts, that a sentence in quotation marks is a claim about a document while a body in a room is a claim about a staging. But I don't definately believe it, because a made-up scene between two real people is already a hundred made-up sentences, and I'm fine with those in free indirect style — it's only the ones between quote marks that bother me, which smells like formalism rather than anything about truth. And the counterfactual pair I can't unify at all: if invention is licensed by signalling, then the jacket copy is doing an enormous amount of moral work, and most readers never read jacket copy.

  My novelist friend says the whole list is just tracking whether the reader is *licensed* to take a sentence as testimony, and that the licence is set by the form of the text and not by how big or small the fact is. I half believe her, but I think that gets the composite wrong — the composite isn't about what the reader is invited to believe, it's about someone being deleted, and I don't see why deletion is worse than addition on a licence story.

  So: state a principle, or two or three candidates, precisely enough that I could actually apply it at my desk at 7am. Tell me which case motivates each clause. Tell me what it says about the cases I haven't put on the list — a novel narrated in first person by a real historical person; a real person who is recognisable but renamed; two real events merged into one; a real documented quotation given to the wrong real person; an author's note at the end that lists everything I changed; and whether it matters if the invented thing I make a real person do is vile rather than trivial. And be honest about which of my verdicts your principle can't accommodate and which one you'd overturn — I want reflective equilibrium here, not a principle that saves the list by being infinitely adjustable.
reasoning: |-
  Okay, the user is a historical novelist grappling with ethical boundaries of invention. They've presented a detailed list of what feels acceptable versus unacceptable in their practice, and they're clearly wrestling with philosophical inconsistencies in their own gut reactions. 

  First impression: This is someone deeply thoughtful about their craft, not just seeking quick answers but wanting to understand the underlying principles. The references to Ranke, Carr, and White show they've done homework but found theory inadequate for practical dilemmas. Their frustration with "selection" vs "invention" being the real pain point feels very authentic.

  Noticing several tension points:
  - The quotation mark paradox (why direct speech feels worse than identical content in narration)
  - The "deletion vs addition" asymmetry (composite characters feel worse than adding minor figures)
  - The jacket copy moral loophole (signalling counterfactuals absolves while slipping one in feels sinful)
  - The vile/trivial action distinction (implied but not stated)

  What they're really seeking isn't permission but coherence. Their friend's "testimony licence" theory almost satisfies them but fails on composites. That's the crack we need to pry open.

  Hmm... their examples cluster around three types of claims:
  1. Existential claims (who existed)
  2. Attributive claims (who did/said what)
  3. Interpretive claims (why they did it)

  But their discomfort with composites suggests something deeper - maybe about erasure? The furnace boy never existed, so no one is robbed. But merging two real people steals one's existence. That feels like a key.

  For the quote problem: direct quotes imply evidentiary weight. Free indirect thought doesn't carry that burden. Hence their instinct that punctuation changes ethics isn't silly formalism - it's about implied documentation.

  The counterfactual signalling question is trickier. Jacket copy does heavy lifting, but readers might miss it. Still, genre conventions matter. A novel shelved in fiction gets more leeway than one marketed as "based on true events."

  Developing three candidate principles:
  1. The evidentiary weight principle (don't fake documents)
  2. The erasure prohibition (don't disappear real people)
  3. The interpretive license principle (motives are fair game absent contradiction)

  Testing against their list:
  - Made-up sentence: violates evidentiary weight (quote marks = document claim)
  - Composite character: violates erasure prohibition
  - Wrong room: no document claim, no erasure - passes
  - Counterfactual event slipped in: violates all three catastrophically

  New cases:
  - First-person by real person: high risk but possible if framed as clearly interpretive
  - Renaming real people: violates erasure by making them unfindable
  - Merging events: similar to composite character issue
  - Misattributed quote: evidentiary weight violation
  - Author's note: helps but doesn't cure core violations
  - Vile actions: heightens all violations because harms reputation

  Biggest tension remains: why room relocation feels fine while quote fabrication doesn't. Standing by the evidentiary distinction - rooms aren't documented minute-by-minute, but quotes purport to be verbatim records. The difference isn't size but type of claim.

  Would overturn their "torn" verdict on paraphrased speech: turning paraphrase to direct quote crosses into false documentation. Better to keep it indirect.

  Admitting this framework can't perfectly resolve the jacket copy issue. Conventions matter, but signalling can't redeem core violations. The slipped-in counterfactual remains indefensible.

  Final note to self: Emphasize that principles are tools, not shackles. Their moral seriousness is what makes them a good historical novelist. The guilt is productive friction.
answer: |-
  Here's a distilled ethical framework for historical fiction invention, built from your intuitions, tested against your cases, and extended to new ones. The core principle is **Respect for the Evidentiary Record and Individual Autonomy**. It has three sub-principles:

  1.  **Do Not Fabricate Evidentiary Traces:** Avoid inventions that *mimic* or *falsify* the kind of specific, verifiable data found in historical documents (letters, diaries, official records, confirmed eyewitness accounts). This respects the reader's trust and the integrity of the historical record.
  2.  **Do Not Erase or Unjustly Diminish Real Individuals:** Respect the autonomy and documented existence of real people. Avoid inventions that negate, obscure, or fundamentally misrepresent their *actual, documented presence or actions* in a way that diminishes their historical reality.
  3.  **Interpret Freely Within Evidentiary Gaps:** You have broad license to imagine motives, emotions, private conversations, undisputed whereabouts during undocumented periods, and the connective tissue *between* documented facts, *provided* it doesn't contradict Principle 1 or 2.

  **How it Explains Your List:**

  *   **Fine: Inventing a minor person (furnace boy, maid, clerk):**
      *   *Why:* No existing evidentiary trace is fabricated (Principle 1). No real individual is erased or diminished (Principle 2). Fills a plausible gap (Principle 3).
  *   **Not Fine: Putting a made-up sentence into a real person's mouth (in quotes):**
      *   *Why:* **Violates Principle 1.** Quotation marks imply a verbatim record, fabricating an evidentiary trace that doesn't exist. It falsely attributes specific words.
  *   **Fine: Putting a real person in a room they were likely not in (on a documented elsewhere day, for invented scene):**
      *   *Why:* While *implausible* based on one document, it doesn't *fabricate* a new document or trace (Principle 1 - whereabouts are often inferred, not minutely documented everywhere). If plausible they *could* have been there unnoticed, it's filling a gap (Principle 3). Doesn't erase them (Principle 2).
  *   **Not Fine: Fusing two real minor figures into one composite:**
      *   *Why:* **Violates Principle 2.** It *erases* one (or both) real individuals from the narrative historical reality you're depicting. It unjustly diminishes their existence and agency.
  *   **Not Fine: Moving a real, datable event by nine days:**
      *   *Why:* **Violates Principle 1.** Dates are core evidentiary facts. Moving it falsifies a verifiable trace.
  *   **Fine: Reordering private quarrels where the record doesn't settle the order:**
      *   *Why:* The order itself isn't a documented fact (Principle 1 intact). You're interpreting sequence within an ambiguity (Principle 3). No individual is erased (Principle 2).
  *   **Fine: Imagining thoughts/motives (unless record contradicts):**
      *   *Why:* Interiority is almost never a documented fact (Principle 1 intact). You're interpreting the gap (Principle 3). Contradiction is a limit set by Principle 1.
  *   **Fine: Whole counterfactual novel (signalled):**
      *   *Why:* Signalling explicitly suspends the normal contract of historical fiction. The reader knows *nothing* is presented as factual testimony. Principles 1 & 2 are waived by mutual agreement via genre signalling.
  *   **Not Fine (Worst): One counterfactual event slipped in (unsignalled):**
      *   *Why:* **Violates Principle 1 (fabricates event) AND Principle 2 (distorts agency/context of real people involved) AND betrays the reader's trust.** The unsignalled nature makes it a deception, undermining the entire project.
  *   **Torn, Leaning Fine -> Revised to Not Fine: Turning a paraphrase into direct speech.**
      *   *Why (Revised):* **Violates Principle 1.** You are fabricating a verbatim quote from a real person where only the *gist* is documented. This creates a false evidentiary trace. (Your initial "leaning fine" likely stemmed from Principle 3 – interpreting the gap – but the direct quote pushes it into fabrication territory).

  **Resolving Your Core Tension (Quote vs. Room):**
  *   Your instinct about quotation marks is correct. **Principle 1** is key. A direct quote *is* a claim about a specific, documented utterance. Putting words in quotes fabricates evidence. Putting a body in a room makes a claim about physical presence, which is *often* inferred from absence of evidence elsewhere (e.g., "He was in Prague on the 1st, but we don't know where he was on the 2nd"). The room placement is more vulnerable to challenge based on *implausibility* (if it contradicts known whereabouts) than to being a *fabrication of a specific trace*. The quote *is* a fabricated trace.

  **Addressing New Cases:**

  *   **Novel narrated in first person by a real historical person:**
      *   *High Risk.* Requires extreme care. Violates **Principle 1** constantly (fabricating thoughts, words, perceptions as "direct testimony"). Only potentially justifiable with massive signalling (title, intro, framing device) making it clearly an *interpretation* bordering on counterfactual, acknowledging the inherent fabrication. Easily violates **Principle 2** by fundamentally misrepresenting their voice and inner world.
  *   **Real person recognisable but renamed:**
      *   **Violates Principle 2.** It obscures their identity, making them harder to research or recognize, diminishing their documented existence. It's a form of erasure-by-obfuscation. (Unless it's a *very* minor figure and the rename is clearly allegorical/satirical and signalled).
  *   **Two real events merged into one:**
      *   **Likely Violates Principle 1 & 2.** Merging documented events fabricates a new, non-existent event trace. It erases the distinct contexts, causes, and consequences of the separate events, diminishing the agency of those involved in each. Similar issue to the composite character.
  *   **Real documented quotation given to the wrong real person:**
      *   **Violates Principle 1 & 2.** Fabricates a false attribution (Principle 1) and misrepresents the agency/voice of both the speaker (who is robbed of their words) and the recipient (who is given words they didn't speak) (Principle 2).
  *   **Author's note listing changes:**
      *   *Mitigates but doesn't erase violations.* An author's note is excellent practice and builds trust. It *reduces* the ethical breach by informing the reader, especially for things like reordering ambiguous quarrels or minor composite characters (*if* you decided to use one despite Principle 2). **However, it does *not* automatically redeem core violations:** fabricating quotes, moving datable events, slipping in counterfactuals, or major composites/mergers. The harm to the record and the individuals remains; the note just makes the author transparent about the harm.
  *   **Does inventing a vile vs. trivial action matter?**
      *   **Yes, significantly.** Inventing *any* undocumented action for a real person risks violating **Principle 2** (misrepresenting them). However, inventing a **vile action** is far worse. It actively damages their historical reputation, potentially causing real-world harm to their legacy or descendants. The ethical burden is much higher. A trivial action (e.g., "He scratched his nose") might be a minor violation if entirely undocumented, but the potential for harm is negligible. A vile action is a major violation with high potential for harm. Stick close to documented character when inventing actions.

  **Overturning a Verdict & Accommodation Challenges:**

  *   **Overturn:** Your "torn, leaning fine" verdict on turning a paraphrase into direct speech. **Principle 1** demands this be **Not Fine.** Direct quotes are sacrosanct evidentiary traces.
  *   **Accommodation Challenge 1: The "Wrong Room" Fine Verdict.** This is the weakest point for Principle 1. A purist could argue placing someone somewhere *contradicting* a document *is* falsifying the record. My framework leans on the *inferential* nature of whereabouts and the concept of undocumented time. It's the point where **Principle 3 (interpretive gap)** most strongly overrides a *potential* **Principle 1** concern, accepting it as plausible invention *unless* the contradiction is absolute and well-documented. If you have clear evidence he *could not* have been there (e.g., imprisoned, on a ship), it flips to Not Fine.
  *   **Accommodation Challenge 2: The "Licence" Theory & Composites.** Your friend's "licence" theory explains much (quotes vs. narration, counterfactual signalling). My framework *incorporates* this via **Principle 1 (evidentiary trace = testimony claim)** and the counterfactual signalling exception. Where it improves is explaining **why composites feel worse than adding minor characters (Principle 2: Erasure)**. The licence theory struggles with this asymmetry; the erasure principle explains it directly. Deleting a real person is a unique harm addition doesn't inflict.

  **The 7am Principle:**

  > **Respect the Document and the Person. Don't fake facts; don't erase lives; imagine freely in the gaps.**  
  > *Specifically:*
  > 1.  **Never invent words you put in quote marks for a real person.**
  > 2.  **Never erase or merge real people who existed.**
  > 3.  **Never change hard dates or facts.**
  > 4.  **Never slip in unsignalled "what-ifs".**
  > 5.  **Be extra careful inventing actions, especially bad ones, for real people.**
  > *Otherwise, fill the gaps with plausible imagination.*

  This framework respects your strongest intuitions (quotes, composites, moved events, slipped counterfactuals as cardinal sins) while providing a rationale beyond guilt. It acknowledges the necessity of invention (**Principle 3**) but draws bright lines at fabricating evidence (**Principle 1**) and negating real lives (**Principle 2**). It accepts the "wrong room" as a permissible interpretive leap within the gap, distinct from the quote fabrication. It demands you abandon composites and the paraphrase-to-quote move, and reinforces why the unsignalled counterfactual is the worst breach. Use the author's note generously for transparency on permissible gap-filling, but know it doesn't absolve core violations. Write bravely within the true constraints of the past.
