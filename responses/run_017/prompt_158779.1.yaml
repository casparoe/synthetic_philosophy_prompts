answer: |-
  ### Workshop Design: The Prediction Game  
  **Goal:** Participants encounter the problem of old evidence organically through a betting game. They feel the intuitive pull toward "sealed" theories (written *before* data generation) vs. "unsealed" ones (written *after*), but cannot justify it within Bayesian updating. The "old-evidence dividend" creates a tangible incentive to game the system.  

  ---

  ### **Materials**  
  - **Ticket box:** 50 tickets (25 red ⬜, 25 blue ⬛).  
  - **Projector/whiteboard:** To display the sequence.  
  - **Theory cards:**  
    - 10 **sealed theory cards** in envelopes (pre-written, *before* the workshop).  
    - 10 **blank index cards** (for unsealed theories, filled *during* the game).  
  - **Play money:** $100 per participant ($1, $5, $10 bills).  
  - **Markers, envelopes, timer.**  

  ---

  ### **Rules**  
  1. **Data generation:**  
     - Draw 20 tickets from the box (randomly, with replacement), projecting the sequence (e.g., `⬜ ⬛ ⬜ ⬜ ⬛ ...`).  
  2. **Theory revelation:**  
     - **Sealed theories:** Open pre-written theory envelopes. Keep *only* those fitting the existing 20-draw sequence.  
     - **Unsealed theories:** Facilitator writes *new* theories on blank cards that fit the sequence.  
     - Assign each theory a random ID (1–6). Participants get one random card. **They never learn if theirs was sealed/unsealed.**  
  3. **Betting:**  
     - For each of the next 5 draws, participants bet on whether the draw will **match their theory’s prediction** (e.g., if theory predicts "⬜", they bet on ⬜ occurring).  
     - Participants submit a probability `p` (0–100%) for a match, using a **quadratic scoring rule**:  
       - If outcome matches: `Score = $10 × [1 - (1 - p)^2]`  
       - If no match: `Score = $10 × [1 - (0 - p)^2]`  
       *(e.g., `p=80%` → match = $9.60, no match = $3.60)*.  
  4. **Old-evidence dividend:**  
     - When participants receive a theory, they get **$10** if it fits the existing data. *All theories fit*, so everyone gets it.  
     - **Key twist:** This dividend is paid *only* if they use the theory in the *next* bet. If they abandon it (by betting `p=50%`), they forfeit the dividend.  
  5. **Winning:**  
     - Total money = dividend + sum of 5 betting scores. Top 3 earners win (e.g., extra credit or prizes).  

  ---

  ### **Timeline (75 min)**  
  | Time  | Activity |  
  |-------|----------|  
  | 0–10  | **Intro (10 min):** Explain rules, scoring, and the dividend. Demo betting with a practice sequence. |  
  | 10–25 | **Data generation (15 min):** Draw 20 tickets, display sequence. |  
  | 25–35 | **Theory creation (10 min):** Reveal sealed theories (keep fits), write unsealed theories (match style/complexity). Assign cards. |  
  | 35–40 | **Dividend payout (5 min):** Hand $10 to all (if they commit to betting). |  
  | 40–65 | **Betting rounds (25 min, 5×5 min/round):** For each of 5 new draws: <br> 1. Participants write `p` on paper. <br> 2. Collect bets. <br> 3. Draw ticket, reveal outcome. <br> 4. Calculate scores, update money. |  
  | 65–75 | **Debrief (10 min):** Reveal sealed/unsealed IDs, discuss tensions. |  

  ---

  ### **Debrief Mapping**  
  Link game moments to the problem of old evidence:  
  1. **Dividend payout (Old evidence = certain):**  
     - "You all got $10 because your theory fit the *existing* data. But once data is known, its probability is 1. How does a Bayesian update when `P(e|T)=1` and `P(e)=1`? Should it change your confidence at all?"  
  2. **Betting tension (Prediction vs. accommodation):**  
     - "Some theories were written *before* the data (predictions), others *after* (accommodations). Did you feel sealed theories were 'better'? Why can’t Bayes’ theorem distinguish them? The likelihood `P(e|T)` is identical for both!"  
  3. **Gaming the dividend (Cashing out):**  
     - "The dividend forced you to commit to a theory to get $10. Did anyone avoid high `p` bets to ‘cash out’ without risk? Real scientists face this: incentives to ‘explain’ old evidence even when it doesn’t predict anew."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **No sealed theories fit the sequence:**  
     - **Fix:** Pre-write 10+ simple sealed theories (e.g., "Alternating ⬜⬛", "Mostly ⬜", "Runs of 3"), ensuring high chance of matches. If none fit, silently add extra unsealed theories (participants won’t know).  
  2. **Participants ignore the dividend:**  
     - **Fix:** Emphasize, "Smart players maximize dividends—$10 is 20% of your starting cash!" If bets are conservative, ask: "Did anyone avoid high `p` to pocket the $10 safely?"  
  3. **Betting confusion:**  
     - **Fix:** Use the practice round to drill scoring. Provide a chart: "`p=90%` → Match: $9.90, No match: $1.90".  
  4. **Unsealed theories look "obvious":**  
     - **Fix:** Mimic sealed styles (e.g., if sealed is "⬜ every 3rd draw", unsealed could be "⬛ after ⬜").  

  ---

  ### **Honest Limitation**  
  **What the game can’t capture:**  
  - In Bayes’ theorem, old evidence is *certain* (`P(e)=1`), so it *cannot* update belief via `P(T|e) = P(T) × P(e|T)/P(e)`. The game replicates the *intuition* (sealed theories feel weightier) and *incentives* (the dividend), but not the formal stalemate. You’ll need to say: *"Bayes says old evidence shouldn’t move you—yet we all felt it should. That gap is the problem."*  

  ---

  ### **Why This Design?**  
  - **Sealed/unsealed tension:** Forces the "prediction vs. accommodation" intuition without naming it.  
  - **Dividend as incentive:** Makes "explaining old evidence" feel profitable, mirroring scientific rewards.  
  - **Minimal materials:** Uses index cards, envelopes, and a ticket box—no tech.  
  - **Least confident part:** Will participants *feel* the sealed/unsealed difference strongly? Betting patterns will tell. If not, highlight it in debrief: *"Did anyone assume their theory was ‘predictive’? Why?"*  

  ---  
  **Run it straight through—no options, no regrets.** The game makes the problem visceral, even if Bayes can’t solve it. Good luck!
