answer: |-
  ## (Untitled Villanelle)

  He offers first a life spun whole and thin,
  A perfect pleasure, painless and complete.
  **You won't know the difference from within.**
  Your body fed, no doubt to cloud the skin,
  A seamless world where nothing tastes of sleet.
  *It must be real, the life you call your own.*

  Come freely, leave; the memory stays like stone.
  A chapter chosen, edges sharp as bone.
  **You won't know the difference from within.**
  You chose the span; the narrative's your own.
  *It must be real, the life you call your own.*

  Then all step in; the loved ones hold your hand,
  Their care their own, within that furnished land.
  **You won't know the difference from within.**
  No world outside, no loss they understand.
  *It must be real, the life you call your own.*

  Now sweat is earned, the costly deed is done,
  Your effort spent beneath that inner sun.
  **You won't know the difference from within.**
  The action yours, though nothing past has won.
  *It must be real, the life you call your own.*

  Last, nothing shifts. The days are as they've shone.
  One question asked; one answer, cold, alone:
  Did work find purpose? Was forgiveness known?
  **You won't know the difference from within.**
  The useless fact, a seed in earth unthrown.
  *It must be real, the life you call your own.*

  He offers still. The quiet air is thin.
  **You won't know the difference from within.**
  *It must be real, the life you call your own.*
