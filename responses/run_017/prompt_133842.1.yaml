  Below is the decision tree structure for your interactive exhibit, designed to sort visitors into one of 14 positions based on their answers to 7 binary branch questions. The tree prioritizes logical sorting efficiency and adheres to your constraints (e.g., no "science vs. politics" questions, concrete hypotheticals included, 15-year-old accessibility). 

  ### **Decision Tree Structure**  
  **Total questions:** 7  
  **Total leaves:** 14  
  **First question:** "Is a globally synchronous geological marker (like a layer in rock or ice) necessary to define the start of the Anthropocene?"  
  **Why it sorts best:** This question splits the logical space most evenly by separating stratigraphic approaches (which demand physical evidence) from normative/historical ones. It immediately isolates 7 positions focused on datable markers from 7 that reject or reinterpret the marker requirement. It also avoids privileging any specific date or ideology upfront.  

  **Tree Sequence:**  
  1. **Is a globally synchronous geological marker (like a layer in rock or ice) necessary to define the start of the Anthropocene?**  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q5.  

  2. **Concrete hypothetical: If a volcanic eruption created the same geological signature as human activity (e.g., a CO2 spike or radionuclide layer), would that eruption define a new epoch?**  
     - *Yes* → Go to Q3.  
     - *No* → Go to Q4.  

  3. **Which marker is most significant?**  
     - *Radionuclides from nuclear tests (mid-20th century)* → **Great Acceleration**.  
     - *Dip in atmospheric CO2 (early 17th century)* → **Orbis Hypothesis**.  

  4. **Concrete hypothetical: If a marker (e.g., soot) appears in Arctic ice 300 years before tropical sediments, does the Anthropocene start at different times globally?**  
     - *Yes* → **Diachronous Anthropocene**.  
     - *No* → **Industrial Revolution onset**.  

  5. **Can the Anthropocene be reversed without deliberate human intervention?**  
     - *Yes* → Go to Q6.  
     - *No* → **The Ratchet**.  

  6. **Is the Anthropocene a distinct geological epoch?**  
     - *Yes* → Go to Q7.  
     - *No* → **Anthropocene as Event**.  

  7. **What best explains the scale of human impact?**  
     - *Agriculture or land use thousands of years ago* → **Early Anthropocene**.  
     - *Social systems (e.g., capitalism, slavery)* → Go to Q8.  
     - *Technology or materials (e.g., steam engines, plastic)* → Go to Q9.  
     - *No single cause—it’s overblown* → **Holocene continuation**.  

  8. **Which social system is primary?**  
     - *Economic mode (e.g., industrial capitalism)* → **Capitalocene**.  
     - *Historical systems (e.g., plantations, colonialism)* → **Plantationocene**.  

  9. **Which technological driver is primary?**  
     - *Energy/fire (e.g., fossil fuels)* → **Pyrocene**.  
     - *Materials (e.g., synthetic waste)* → **Plasticene**.  

  ### **Leaves with Statements and Awkward Commitments**  
  1. **Great Acceleration**  
     - Statement: The Anthropocene began mid-20th century, marked by radionuclide fallout from nuclear tests, a global geological spike.  
     - Awkward commitment: Nuclear weapons, not climate change, are humanity’s most indelible legacy.  
  2. **Orbis Hypothesis**  
     - Statement: The Anthropocene began c. 1610, triggered by CO2 decline from reforestation after Indigenous collapse in the Americas.  
     - Awkward commitment: Genocide enabled Earth’s "recovery," making it a geological pivot.  
  3. **Industrial Revolution onset**  
     - Statement: The Anthropocene began c. 1800, marked by coal soot and steam-engine emissions in sediment layers.  
     - Awkward commitment: Industrial progress justifies its planetary disruptions.  
  4. **Early Anthropocene**  
     - Statement: The Anthropocene began with agriculture or rice cultivation thousands of years ago, visible in methane spikes and soil changes.  
     - Awkward commitment: Preindustrial societies caused irreversible harm, not just modern ones.  
  5. **Diachronous Anthropocene**  
     - Statement: The Anthropocene has no single start date; human impacts appear at different times in regional sediment/ice records.  
     - Awkward commitment: Geology cannot neatly date human-driven change, making formal definitions futile.  
  6. **Anthropocene as Event**  
     - Statement: The Anthropocene is an ongoing process, not an epoch, so dating it distracts from systemic solutions.  
     - Awkward commitment: Calling it an "event" downplays the urgency of declaring a new epoch.  
  7. **Capitalocene**  
     - Statement: Rename the era "Capitalocene" to stress capitalism (not "humanity") as the driver of planetary change.  
     - Awkward commitment: Blaming "capitalism" risks ignoring non-Western contributions to ecological crises.  
  8. **Plantationocene**  
     - Statement: Rename the era "Plantationocene" to center slavery/colonialism in reshaping land and ecology.  
     - Awkward commitment: This framing implies historical oppression is Earth’s core narrative, not carbon emissions.  
  9. **Pyrocene**  
     - Statement: Rename the era "Pyrocene" to highlight humanity’s fire use (e.g., fossil fuels) as the primary Earth system disruptor.  
     - Awkward commitment: Fire is an ancient tool—blaming it absolves modern consumption patterns.  
  10. **Plasticene**  
      - Statement: Rename the era "Plasticene" because plastics in sediments are the most unambiguous human-made geological marker.  
      - Awkward commitment: Focusing on plastic trivializes older, deadlier impacts like climate change.  
  11. **Holocene continuation**  
      - Statement: No Anthropocene exists; humans are part of the Holocene, and current changes aren’t geologically exceptional.  
      - Awkward commitment: Denying the Anthropocene risks normalizing extinction-level threats.  
  12. **The Ratchet**  
      - Statement: The Anthropocene began at the earliest point where Earth could not self-correct without human intervention (e.g., post-1950s climate tipping points).  
      - Awkward commitment: This "point of no return" may have passed unnoticed, making prevention irrelevant.  
  13. **Democratic Deliberation**  
      - Statement: Affected communities/historians—not scientists—should define the Anthropocene, as it’s a social-political rupture.  
      - Awkward commitment: Excluding geologists may overlook evidence of irreversible harm.  
  14. **Vacant Cell**  
      - *Combination: "Marker necessary" (Q1 Yes) + "Volcanic eruption defines epoch" (Q2 Yes) + "Diachronous start" (Q4 Yes)*  
      - Why vacant: Incoherent—insisting on a synchronous marker (Q1) while accepting regional variation (Q4) contradicts stratigraphic principles.  

  ### **Collisions and Resolutions**  
  - **Collision:** "Industrial Revolution onset" and "Pyrocene" both emphasize fossil fuels but are separated by Q1 (marker necessity). If a visitor conflates them, add: *"Is the Industrial Revolution’s legacy best captured by its geological soot layer or by fire as a broader ecological force?"*  
  - **Why no other collisions:** The tree isolates renaming views (e.g., Capitalocene) via social drivers (Q7/Q8) and distinguishes "no date" positions (e.g., Event) from "no epoch" (Holocene) in Q6.  

  ### **Exposed Commitment in Your View (The Ratchet)**  
  The tree reveals that **The Ratchet** is vulnerable to the same critique as stratigraphic views: it requires identifying a "point of no return" in Earth systems, which is as interpretive as choosing a radionuclide spike. Your friend (and the curator) could argue that "irreversibility without intervention" is not observable in sediment cores—making it an "editorial opinion" that implicitly assigns blame to generations who inherited the crisis. This weak spot may surface when the advisory board debates Q5 ("Can it be reversed?"), as it forces The Ratchet to defend its scientific plausibility.  

  ---

  The tree is ready for design handoff, with branching logic that avoids jargon and ensures visitors discover positions organically. For testing, prototype the volcanic (Q2) and marker-timing (Q4) hypotheticals first—they efficiently challenge absolutism about dates or blame.
