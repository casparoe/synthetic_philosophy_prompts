  | 8    | **Narrative as search-space**: Stories exploring case-spaces seem irreducible to arguments.          | Dismissible   | Reconstruction can capture search as conditional premises.                  |

  ---

  ### Critical Defeaters Expanded
  1. **Unfalsifibility via (P)**  
     **Problem**: (I) predicts invariance in verdicts between story and argument. But if subjects reject the argument due to unaccepted premises, (P) allows blaming "lack of reflection." Without constraints on "due reflection" (e.g., time limits, banned cognitive operations), failed invariance tests are dismissed, making (I) unfalsifiable. (E) then vacuously succeeds: *any* pump can be reconstructed *somehow*.  
     **Constraint needed**: Limit "reflection" to logical/analytic elaboration of existing commitments, excluding imaginative re-enactment. But this risks circularity (banning what rivals deem essential). If reflection *excludes* re-simulation, Reconstructionism may be defensible but risks being stipulative.

  2. **Therapeutic Pumps (e.g., Wittgensteinian dissolution)**  
     **Problem**: Some pumps (e.g., "What *is* the sensation of red?") aim to show a question has no answer, not to deliver a modal judgment. The narrative induces a recognition of conceptual indeterminacy. Reconstruction fails: no conclusion follows (not even "this is indeterminate"), as the pump works by *disrupting* inference. Declaring it a "bad pump" concedes a counterexample: some epistemically valuable pumps resist reconstruction.  
     **Reconstructionist reply**: Redescribe as argument: "If your concept lacks criteria here, suspend judgment." But this misses the point—the *recognition* is non-inferential, triggered narratively. Conceding this as "redescription" strains (E).

  3. **Argument-Silent Pumps**  
     **Problem**: Inconceivability arguments (e.g., "Try imagining a round square—your failure proves impossibility") treat imaginative failure as direct evidence. No premise is retrieved; the evidence *is* the cognitive impasse. Reconstruction requires smuggling in a premise like "What is unimaginable is impossible," which many reject. But the pump works *without* that premise—the brute phenomenology of failure does epistemic work. (E) cannot capture this without self-sabotage.  
     **Collapse risk**: If Reconstructionism allows "I cannot imagine P" as a premise, it concedes imagination as a basic source of modal knowledge—the very view it deflates.

  4. **Calibration Pumps & (N)**  
     **Problem**: Pumps revealing response thresholds (e.g., Sorites sequences triggering vagueness recognition) provide evidence about *our* concepts, not modal facts. Reconstruction might yield: "If slight changes don't shift category, boundaries are vague." But the narrative *calibrates* judgment through serial presentation; the extracted argument lacks this dynamic. (N) labels this "noise," but if calibration is *evidence* of concept-structure, (N) misdiagnoses it.  
     **Concession**: Reconstructionism can redescribe this as discovering a premise about one's dispositions. However, this reframes psychological evidence as conceptual, violating (N)'s neutrality claim.

  ---

  ### Verdict on Exposure  
  Reconstructionism is **fatally exposed** to unfalsifibility without robust constraints on (P), and cannot assimilate therapeutic or argument-silent pumps without collapsing core commitments.  

