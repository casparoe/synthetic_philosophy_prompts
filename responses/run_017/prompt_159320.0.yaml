      - Friction: The Ground Group could try actions and see the results (e.g., if they put the blip on the wrong surface, they can see it's not on the klorb). The Symbol Group had no such feedback; they only had the symbols which were ambiguous.
      - The "more data" objection: We provided the same dictionary and corpus to both groups. The Symbol Group lacked the current state information. Even if we gave them a symbolic description of the state, it would use the same words (e.g., "The red block is on the table, the red ball is on the tray"). But without knowing which is the table (if "table" is not in the dictionary) and without knowing that the table is the klorb, they still cannot resolve it. The Ground Group, by being present, knows that the table is the klorb (because they were shown) and can see which object is on it.

