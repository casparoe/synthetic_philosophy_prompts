            "zog" : "blip blop grok klorb tarn"   [object: any of these]

          This is ambiguous and circular. The word "zog" is defined by listing the nouns, and each noun is defined using "zog". But in the corpus, there are patterns that let them learn that "fip mip zog" is a valid phrase for blip.

      - Corpus: example sentences. They can be generated by the grammar.

