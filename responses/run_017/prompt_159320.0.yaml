  ---  
  This forces both sides to *experience* the gap between symbol fluency and grounded understanding. The Ground Group’s physical interaction creates "friction," while the Symbol Group’s identical training data fails in a context-dependent task. Use the debrief to link this to your breakfast arguments—your flatmate’s RLHF point is like the Ground Group’s advantage, but Zogian shows why it’s derivative.
