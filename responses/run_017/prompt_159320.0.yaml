      - The activity is a microcosm and might not fully capture the complexity of machine learning on massive data. The CS students might argue that in real systems, the training data is so vast that it effectively covers all contexts. We can counter in the debrief by noting that in an open world, new contexts arise (like the current state of the room) that are not in the training data. The activity shows that without a non-symbolic connection, the system cannot resolve references in novel, context-dependent situations.

