  We are designing an experiential game to illustrate the symbol grounding problem and the concept of "friction" (the world's ability to correct you in a non-symbolic way). The goal is to have two groups: one that becomes fluent in a symbol system without any connection to the physical world, and another that has the same symbols plus a physical channel (allowing for non-symbolic feedback). The first group should succeed on symbol-manipulation tasks but fail when a task requires grounding, while the second group should succeed at the grounding task. We want to avoid the argument that the first group's failure is due to insufficient data or information.

  Key elements:
  - Two groups: "Symbol Group" (only symbols) and "Ground Group" (symbols plus physical interaction).
  - The symbol system: a made-up language with rules for forming strings and a dictionary (with definitions in the same symbols). We'll call this language "Zogian".
  - The physical connection: a set of objects and actions in the room that the Ground Group can interact with and that are represented by some of the symbols.

  Design:
  1. **Symbol System Creation**:
     - We create a simple formal language with about 20-30 words (nouns, verbs, adjectives) and rules for forming sentences. The entire dictionary and grammar rules are written in Zogian (so the definitions are circular, using other Zogian words). We also provide a corpus of example sentences.

     Example:
     - Words: "blip", "blop", "zif", "zap", "grok", "klorb", etc.
     - Grammar: Subject-Verb-Object (SVO) order. Adjectives precede nouns.
     - Dictionary (in Zogian, but here we describe in English for now; in the game, it will be in Zogian):
          "blip" : "a small red object"
          "blop" : "a large blue object"
          "zif" : "to touch"
          "zap" : "to move"
          "grok" : "a container"
          "klorb" : "a flat surface"
          ... and so on.

     But note: the actual dictionary entries must be written in Zogian. So we might have:
          "blip" : "klorb zif blop"   [which in English would be "a small red object", but in Zogian it's circular]

     However, to make the symbol group's task possible, we must design the system so that they can learn to manipulate the symbols without understanding. We can have a set of rules for valid sentences and a corpus that they can use to learn patterns.

  2. **Physical Setup**:
     - We need a set of objects in the room that correspond to some of the Zogian words. For example:
          - A small red block (for "blip")
          - A large blue block (for "blop")
          - A box (for "grok")
          - A table (for "klorb")
     - We also define actions that can be performed: touching, moving, placing inside, etc.

  3. **Two Groups**:
     - **Symbol Group**: They get the rulebook (grammar), the dictionary (in Zogian), and a corpus of example sentences. They are isolated from the physical objects and cannot see or interact with them. They are in a separate part of the room or facing away.
     - **Ground Group**: They get the same rulebook, dictionary, and corpus. Additionally, they are shown the physical objects and told that some of the words refer to these objects. They are allowed to interact with the objects (touch, move, etc.) and they are told that they can use the objects to help them understand the language.

  4. **Tasks**:
     - **Phase 1 (Symbol Manipulation Tasks - 20 minutes)**:
          Both groups are given a set of tasks that can be done purely by symbol manipulation. Examples:
          a) Given a sentence, is it well-formed according to the grammar?
          b) Translate a sentence from Zogian to English? (But note: they don't have an external reference. We can have them translate to a placeholder language? Or we can have them do continuation or answer multiple-choice questions about the symbols themselves.)
          c) Complete a sentence: given a partial sentence, what are the next likely words?
          d) Answer a question about the meaning of a word, but using only the circular dictionary.

          We expect both groups to perform similarly on these tasks because they require only pattern matching.

     - **Phase 2 (Grounded Task - 15 minutes)**:
          Now we give a task that requires grounding. For example:
          - "You are told: 'Place the blip on the klorb.' How would you do this?"

          The Symbol Group must answer using only the symbols. They might say: "According to the dictionary, a blip is a small red object and a klorb is a flat surface. So I would put a small red object on a flat surface." But note: they don't have the objects, so they cannot show the action. They can only describe it in symbols or in English.

          However, we want a task that the Symbol Group cannot perform at all without grounding. So we design a task that requires interaction with the objects in the room, and we set it up so that the symbols alone are ambiguous or circular and cannot resolve the reference.

          Example of ambiguity: We have two small red objects (say, a block and a ball) and two flat surfaces (a table and a tray). The word "blip" is defined in the dictionary as "a small red object", but there are two. Without being able to point or having established a connection, the Symbol Group cannot know which one.

          The Ground Group, on the other hand, can interact and can ask for clarification by pointing? But we don't want them to use English. So we have to set up a non-linguistic feedback mechanism.

          Alternate task: We give a command that must be executed in the physical world. For example, the command is: "Zif the blip then zap the grok." (meaning: "Touch the small red object then move the container.") The Ground Group can perform the actions on the objects. The Symbol Group must write down what they would do, but without the objects they cannot demonstrate.

          But we want the Symbol Group to fail in a way that isn't just because they don't have the objects. We want them to fail because they don't have the referents. So we add a twist: the physical setup has two small red objects (a block and a ball) and the word "blip" is used for both in the dictionary. The command says: "Zif the blip that is on the klorb." Now, if the block is on the table and the ball is on the tray, the Ground Group can look and see which one is on the klorb (if klorb is defined as the table) and then touch that one. But the Symbol Group only has the dictionary, which says "klorb" is a flat surface, and both the table and tray are flat surfaces. Without being able to see the setup, they cannot know which one is the klorb. Moreover, the dictionary doesn't specify which flat surface is the klorb.

          How does the Ground Group know? Because during their training they were shown the objects and told: "This object is called 'blip', this one is also 'blip', this is 'klorb' (pointing to the table), that is not 'klorb' (pointing to the tray) but it's called something else?" We have to be careful.

          Instead, we design the dictionary to be ambiguous and the physical setup to disambiguate via perception. The Ground Group has the ability to perceive the current state and to interact.

  5. **The Stakes**:
     - We have a dumb trophy (a plastic crown) and candy. The group that does better on the tasks gets the candy and the crown. We score the Phase 1 tasks and Phase 2 task separately.

  6. **The Distinction of Friction**:
     - The Ground Group gets feedback from the world. For example, if they are told to put the blip on the klorb and they put it on the wrong flat surface, they can see that it doesn't match the intended state (which we define). But note: we don't want the feedback to be symbolic (like a message saying "wrong"). Instead, we want the physical state to matter. For instance, we might have a rule that the blip must be placed on the table (klorb) and if it's on the tray it doesn't count. The Ground Group can try and see the result.

     We design a task that requires a specific outcome that can only be known by interacting with the world. For example, the command is: "Put the blip into the grok." But there are two groks (containers): one with a lid and one without. The dictionary says "grok" is a container. The Ground Group can see that one container is blue and one is red, but the dictionary doesn't specify color for grok. However, they are told that the grok that is currently on the klorb is the intended one. They can see which one is on the table. The Symbol Group, without access to the current state, cannot know.

  7. **Timeline** (80 minutes total):

     - Introduction (5 minutes): Explain that we are doing a game about learning a new language. Split the room randomly into two groups (Symbol and Ground). Each group has a facilitator (you and a helper). Move the groups to their stations.

     - Training Phase (15 minutes):
          - Both groups get the same materials: rulebook (grammar), dictionary (in Zogian), and corpus. The Ground Group additionally gets a set of objects and a demonstration: the facilitator points to each object and says the Zogian word (but no English). They are allowed to handle the objects and try actions. The Symbol Group does not get any objects.

     - Phase 1: Symbol Tasks (20 minutes):
          - Both groups are given a worksheet with symbol-manipulation tasks (about 10 questions). They work in their groups to answer.
          - Collect the worksheets and score them (quickly) during the next phase. Announce that the scores for Phase 1 will be part of the final score.

     - Phase 2: Grounded Task (20 minutes):
          - Each group is given a command in Zogian that requires performing an action in the physical world. The Ground Group must perform it with the objects. The Symbol Group must write down what they would do (in English) and also what they think the command means.
          - The command is designed to require knowledge of the current state of the physical world (which the Symbol Group doesn't have). Example command: "Zif the blip that is on the klorb." (Touch the small red object that is on the table.) But note: the current state has two small red objects: one on the table and one on the tray. The dictionary doesn't specify which flat surface is the klorb. The Ground Group can see the setup and know that the table is klorb (from training) and which object is on it. The Symbol Group must guess.

          - The Ground Group performs the action. The Symbol Group writes their answer.

          - We then reveal the setup to the Symbol Group and they see that they couldn't have known.

     - Scoring and Debrief (20 minutes):
          - Phase 1: Both groups probably did similarly well.
          - Phase 2: The Ground Group can perform the task correctly (if they understood the words and the setup). The Symbol Group cannot because they lack the referent and the current state.

          - Award candy and the trophy to the Ground Group (if they succeeded) or to the group with the overall highest score.

          - Debrief: Now we introduce the terms. Map the experience to the symbol grounding problem. Highlight the moment when the Symbol Group couldn't resolve the reference despite having the same dictionary. Emphasize that the Ground Group had "friction": they could interact and get feedback (they could see the objects and the state). The objection that the Symbol Group just needed more data: in this case, the dictionary didn't contain the information about which flat surface was the klorb, and the corpus didn't have the context of the current state. Even if we gave the Symbol Group a description of the current state in symbols, we would have the same problem: what if the description uses the same ambiguous symbols? We need grounding to break the circle.

  8. **Materials to Prepare**:
     - Zogian rulebook (grammar): one page.
     - Zogian dictionary: one page, with circular definitions.
     - Corpus: a list of 20-30 example sentences (in Zogian).
     - Worksheets for Phase 1 (two sets of the same questions).
     - Physical objects: 
          - Two small red objects (e.g., a red block and a red ball)
          - Two flat surfaces (a table and a tray; if a table is fixed, then use two movable surfaces like two trays or two mats)
          - One or two containers (e.g., a box and a cup)
     - Command for Phase 2: written on a card.
     - Candy and a dumb trophy (plastic crown or medal).

  9. **Potential Problems**:
     - Cheating: Someone in the Symbol Group might peek at the objects. Prevent by separating the groups (maybe in different corners, with the Symbol Group facing away). Have a facilitator watch each group.
     - Annoyingly good Symbol Group: They might guess correctly by chance. To avoid, make the ambiguity real: have two equally valid possibilities. If they guess, they have a 50% chance of being wrong. The Ground Group, by seeing, can be 100% right.
     - The Ground Group might not understand the physical connection: The facilitator must clearly show the objects and name them (in Zogian) without using English. They can point and say "blip" for both red objects? But then how do they know which is which? We have to assign the same word to two objects? That's intentional to create ambiguity. But for the Ground Group, they know both are called "blip", so when the command says "the blip that is on the klorb", they can identify which one is on the table (if they know klorb is the table). They don't need a unique name for each object. The dictionary doesn't have to be one-to-one.

