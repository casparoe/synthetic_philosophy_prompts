            Nouns: blip, blop, grok, klorb, tarn (another object), etc.
            Verbs: zif (touch), zap (move), etc.
            Adjectives: fip (small), fop (large), mip (red), mop (blue), etc.

          The dictionary entries for nouns are phrases that describe them, using adjectives and other nouns? But we want circularity.

          Example dictionary (written in Zogian, but we show the intended meaning in brackets for the facilitator; the participants only see Zogian):

            "blip" : "fip mip zog"   [small red object]
            "blop" : "fop mop zog"   [large blue object]
            "grok" : "zog zap"        [container (object for moving?)]
