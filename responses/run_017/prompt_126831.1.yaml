  ### Why This Works
  - **Clause (a)** handles all threat-manipulation cases (1–8, unsettled):  
    - Key is whether the victim is *already* threatened (loop, falling man) vs. made a *new* threat/tool (footbridge push, surgeon).  
    - Demolition (6) is fine because the bridge collapse is the threat—not the victim’s body.  
  - **Clause (b)** explains Case 9: Suffering introduces a separate wrong beyond killing.  
  - **Clause (c)** exempts Case 10: Partiality is a "moral module" that overrides impartial saving unless grotesque (e.g., killing your child to save two strangers).  

  ### Key Breakthroughs
  - **Loop Case (4)**: Permissible because threat *to the one* exists pre-diversion (spur is part of the track system). His death is a *byproduct* of stopping the trolley where it was *already going*.  
  - **Demolition (6) vs. Push (3)**: In 6, the victim is killed by the collapsing bridge (an independent threat), not *used* as a trolley-stopper. In 3, you directly exploit his body.  
  - **Nudge (8)**: Redirecting an existing threat (falling body) is like lever-pulling; no new threat created.  

  The principle is **externalist**: it cares about the physical/temporal structure of threats and agency, not intent. It explains why "he was already in it" (unsettled case) should dominate "I put him there"—if the threat existed first, placement is irrelevant.
