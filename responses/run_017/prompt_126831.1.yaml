  | 3          | Not fine  | Not fine         | Yes   | Clause (a)          | New threat created *by* shoving victim into the trolley's path. |
  | 4          | Fine      | Fine             | Yes   | Clause (a)          | Threat exists; victim's body stops trolley but was *already* in its path. |
