  | Unsettled  | Wavers    | Fine             | Only after repair | Clause (a) + note | Victim placed in *pre-existing* threat path; intent irrelevant if threat existed. |

  **Note for Unsettled Case**: Your placement only becomes problematic if it *created* the threat (e.g., you knew the buffer was broken and lured him there). Since the threat (trolley path) existed independently, it’s permissible under Clause (a).

