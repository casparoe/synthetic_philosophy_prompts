prompt: |-
  Our reading group (a therapist, a retired classics teacher, a data scientist, and me) has been going in circles for a month about what emotions actually *are*, and I got stuck writing the "what question are we even asking" document for week one, so I'm asking you to write the hard part of it. The problem is that everyone has exactly one case they take to be decisive: the therapist keeps coming back to a client who knows perfectly well the spider is plastic and is still terrified of it, and says this kills the "emotions are judgments" view; the classics teacher keeps pointing out that people genuinely grieve at the death of characters who never existed, and thinks that kills anything that requires a real particular object; the data scientist says emotions can't be private inner episodes at all because he can predict them from behavioural traces better than people can report them. I don't think any of those arguments settle anything, because nobody has said what a theory would have to get right in the first place. So: give me the desiderata list for a theory of what emotions are, numbered, each with the case or consideration that makes it a requirement rather than a taste, and each marked negotiable or non-negotiable.

  I have my own pile of cases that I want represented or explicitly ruled out, and honestly half of my hope is that you'll tell me some of them are not the theory's job. (1) Emotions seem assessable — you can ask whether the fear was apt or the anger was out of proportion — so a theory has to say what correctness consists in, and I want to know whether that's really a requirement or just a prejudice of the judgment camp. (2) Recalcitrance: the plastic-spider case, but also the reverse, where someone's affect lags behind their own considered view for months and then catches up. (3) Emotions you can be *talked* out of but not *decided* out of, which seems to demand a weird intermediate status between belief and itch. (4) My friend with a rare condition that badly blunts her visceral feedback, who says she still knows she's anxious because of what she starts doing — rehearsing conversations, checking the door twice — and I don't know whether that's a counterexample to the bodily-feeling family or just a case of the evidence being rewritten. (5) Emotions with diffuse or missing objects: ambient dread about something huge and statistical that no single action would address, "nostalgia" for a trip that hasn't happened yet, relief about an outcome that was never really on the cards. (6) Emotions whose object is another emotion of your own — being ashamed of being jealous, being annoyed at yourself for still being frightened — and whether that recursion causes trouble for any of the three usual families. (7) A dog's fear, a pre-verbal infant's distress, and whether a theory is allowed to exclude those by fiat or has to earn the exclusion. (8) Emotions as things that can be *educated* — people who learn to feel indignation at something they used to accept quietly, which is the bit I personally care about most, since my real interest is whether emotions can be reasons for action and whether they can be better or worse in something like an epistemic sense.

  Two more things I specifically want. First: I strongly suspect some pairs on your list can't be jointly satisfied — "emotions are bodily feelings" and "emotions can be apt or inapt" feel like they pull apart, and "emotions require conceptually structured content" and "infants have emotions" too — so flag the tensions, say which requirement does the most work in knocking candidates out, and tell me if the list itself is the interesting result here. Second: score the three families very briefly against the list (the judgment view, the perception-of-evaluative-properties view, the bodily-feeling/constructionish view) — a few lines each is plenty, I'll do the arguing with the group myself. And as I said, I'd also like you to say plainly which of my cases a theory is entitled to set aside as not really emotions at all, and what principle licenses setting them aside rather than it being special pleading. Skip the reading list, I can google.
reasoning: |-
  Okay, the user is part of a reading group with a therapist, a classics teacher, and a data scientist. They've been debating what emotions are for a month and are stuck. Each member has a decisive case: the therapist mentions a client terrified of a plastic spider, which challenges the "emotions are judgments" view; the classics teacher points to grieving fictional characters, questioning theories requiring real objects; the data scientist argues emotions aren't private because he can predict them from behavior better than self-reports. The user feels these arguments don't settle anything because there's no clear criteria for a theory of emotions. They want a numbered list of desiderata with cases that make each necessary, marked negotiable or not. 

  The user also has their own cases: (1) emotions being assessable for correctness, (2) recalcitrance like the plastic spider or lagging affect, (3) emotions that can be talked out of but not decided out of, (4) a friend with blunted visceral feedback who identifies anxiety through behavior, (5) emotions with diffuse or missing objects, (6) emotions about other emotions, (7) animal and infant emotions, and (8) emotions as educable. They suspect some desiderata conflict and want tensions flagged. They also want the three main theories (judgment, perception, bodily-feeling) scored against the list and guidance on which cases can be set aside.

  First, I need to create a list of desiderata. Each should have a case or reason why it's required. The user's cases can serve as examples. For instance, the therapist's plastic spider case shows recalcitrance, which is non-negotiable. The classics teacher's fictional grief requires emotions to handle non-existent objects. The data scientist's prediction ability means emotions must be observable, not purely private.

  Next, conflicts between desiderata. For example, if emotions need to be assessable for correctness (from the user's point 1), that might clash with bodily-feeling theories. Also, if infants have emotions but theories require conceptual structure, there's tension. I should note which desiderata are more critical in ruling out theories.

  Then, scoring the three theories against the list. Judgment theory might fail on recalcitrance and non-existent objects. Perception theory might struggle with diffuse objects and recursiveness. Bodily-feeling theories might have issues with assessability and observability.

  For the user's cases, some might not be core emotions. For example, nostalgia for a future trip (point 5) could be a mood, not an emotion. Emotions about other emotions (point 6) might be meta-emotions, possibly separate. Principles for exclusion could be based on intentional objects or duration.

  The user's deeper needs: they want clarity on whether emotions can be reasons for action and if they can be educated (point 8). They also need a structured way to evaluate theories, moving the group past circular debates. Highlighting conflicts in desiderata might show why no single theory satisfies all, which could be the key insight.
answer: |-
  Here’s a structured desiderata list for a theory of emotion, designed to resolve deadlocks by specifying non-arbitrary requirements. Each item is grounded in a decisive case from your group or your own observations, labeled negotiable (N) or non-negotiable (NN). Conflicts are flagged, and the three main theories are scored at the end.

  ---

  ### **Desiderata for a Theory of Emotion**  
  *(Non-negotiable items invalidate theories that cannot accommodate them; negotiable items highlight tensions but permit trade-offs)*  

  1. **Recalcitrance Compatibility** [NN]  
     *Requirement*: Must explain why emotions persist despite contradictory beliefs (e.g., terror at a *known* plastic spider).  
     *Case*: Therapist’s example. Rules out theories where emotions *are* judgments (e.g., "fear just *is* judging something dangerous").  

  2. **Non-Existent/Objectless Objects** [NN]  
     *Requirement*: Must account for emotions directed at non-existent, fictional, or diffuse targets (e.g., grief over a fictional death).  
     *Case*: Classics teacher’s example. Invalidates theories requiring real, particular objects (e.g., some direct-perception views).  

  3. **Observability Constraint** [NN]  
     *Requirement*: Must align with emotions being detectable (and often predictable) via behavioral/physiological traces.  
     *Case*: Data scientist’s predictive success. Rules out theories where emotions *only* exist as private, inaccessible qualia.  

  4. **Assessability** [NN]  
     *Requirement*: Must explain how emotions can be "apt," "proportionate," or "warranted" (e.g., fear of a real tiger vs. fear of a leaf).  
     *Case*: Your point (1). Invalidates theories that reduce emotions to non-cognitive states (e.g., pure bodily feelings).  

  5. **Developmental/Cross-Species Scope** [N]  
     *Requirement*: Should accommodate emotions in infants and non-human animals *or* justify their exclusion.  
     *Case*: Your point (7). Tension with theories requiring conceptual content. Exclusion must be *earned* (e.g., by distinguishing proto-emotions from full emotions).  

  6. **Intentionality without Necessarily Structured Content** [N]  
     *Requirement*: Must allow emotions to have "aboutness" (e.g., dread *about* climate change) without requiring precise, articulable objects.  
     *Case*: Your point (5) (diffuse dread, future nostalgia). Challenges judgment-based views demanding propositional objects.  

  7. **Educability/Historicity** [N]  
     *Requirement*: Must explain how emotions change through learning, culture, or reasoning (e.g., learning righteous anger).  
     *Case*: Your point (8). Favors theories where emotions are shaped by cognitive/social feedback.  

  8. **Bodily Feedback Independence** [N]  
     *Requirement*: Should explain cases where emotions are identified through behavior/cognition despite blunted visceral feedback.  
     *Case*: Your point (4) (friend’s anxiety). Rules out *strong* somatic theories (James-Lange), but compatible with weak somatic views.  

  9. **Recursive Meta-Emotions** [N]  
     *Requirement*: Should not break when emotions take other emotions as objects (e.g., shame about jealousy).  
     *Case*: Your point (6). May strain non-cognitive theories but negotiable if meta-emotions are treated as a distinct subclass.  

  10. **Action-Readiness** [NN]  
      *Requirement*: Must link emotions to motivation (e.g., fear prepares escape, grief prompts withdrawal).  
      *Case*: Implied by therapist (terror motivates avoidance) and your friend (anxiety drives checking behavior). Rules out purely epiphenomenal views.  

  ---

  ### **Key Tensions & Conflicts**  
  - **Assessability (4) vs. Bodily Feelings**: If emotions are *just* feelings, their "correctness" is incoherent (hence NN assessability sinks strong feeling theories).  
  - **Developmental Scope (5) vs. Structured Content**: If infants/dogs have emotions, theories requiring complex concepts (e.g., judgment views) must either deny this or dilute "concept" to vacuity.  
  - **Observability (3) vs. Recalcitrance (1)**: Predictive models may struggle to explain why *reported* feelings diverge from behavior (e.g., hiding fear of plastic spider).  
  - **Intentionality (6) vs. Judgment Views**: Diffuse dread lacks a clear propositional object, straining cognitivist theories.  

  **The most decisive knockout criteria**: Recalcitrance (1), Non-Existent Objects (2), and Assessability (4) are NN and collectively rule out pure forms of all three families.  

  ---

  ### **Scoring the Three Families**  
  *(✓ = Satisfies, ✗ = Fails, ~ = Partial/Strained)*  

  1. **Judgment Theory** (Emotions = evaluative judgments)  
     - ✓ Assessability (4), Educability (7), Meta-emotions (9)  
     - ✗ Recalcitrance (1), Non-Existent Objects (2), Developmental Scope (5)  
     - ~ Intentionality (6) (falters with diffuse objects), Action-Readiness (10) (judgments aren’t inherently motivating)  

  2. **Perception Theory** (Emotions = perceptions of value)  
     - ✓ Assessability (4), Intentionality (6) (handles diffuse objects)  
     - ✗ Recalcitrance (1) (perceptions don’t persist against known illusions), Non-Existent Objects (2) (can’t perceive properties of nothing)  
     - ~ Observability (3) (value properties may not leave traces), Educability (7) (perceptual systems are hard to "teach")  

  3. **Bodily-Feeling/Constructionist Theory** (Emotions = interpretations of physiological arousal)  
     - ✓ Recalcitrance (1) (arousal can mismatch cognition), Observability (3), Developmental Scope (5)  
     - ✗ Assessability (4) (feelings aren’t "apt"), Non-Existent Objects (2) (arousal needs a trigger)  
     - ~ Educability (7) (depends on learning new interpretations), Action-Readiness (10) (arousal drives action but imprecisely)  

  ---

  ### **Which of Your Cases Can Be Set Aside?**  
  - **"Nostalgia for a future trip" (5)**: Likely **mood** (objectless affective state), not emotion. *Principle*: Emotions require intentional objects (even if vague); moods lack objects.  
  - **Relief about an outcome "never on the cards" (5)**: Possibly **cognitive error**, not a problem for the theory. *Principle*: Theories explain *what emotions are*, not why people have irrational ones.  
  - **Recursive meta-emotions (6)**: **Not excluded**, but may be "higher-order" emotions licensed by cognitive complexity. *Principle*: A theory need not treat all affective states identically; hierarchy is plausible.  
  - **Blunted-visceral-feedback case (4)**: **Critical counterexample** to *strong* somatic theories. *Principle*: If a state functions identically to a standard emotion despite missing a "core" feature, that feature isn’t necessary.  

  ---

  ### **The Takeaway**  
  **The desiderata list *is* the interesting result**: No major theory satisfies all NN items, revealing why your group is stuck. The tensions (e.g., between assessability and bodily feelings) suggest hybrid or pluralist theories are needed. Your "educability" case (8) and the data scientist’s observability constraint (3) point toward constructionist or "appraisal-theory" hybrids as most promising—but they must confront assessability (4) and intentionality (6). Use this framework to force the group to defend *why* their pet case is non-negotiable, or concede that their "decisive" counterexample only refutes straw-man versions of rival theories.
