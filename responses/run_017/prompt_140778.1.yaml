prompt: |-
  I'm the non-clinician member of the ethics commitee at a fertility clinic, which apparently means I get asked to write the memos. We're properly stuck on two cases and I need something I can circulate before next month's meeting.

  Case one. We offer preimplantation testing for late-onset, untreatable conditions — the sort where an embryo carries a variant that means the resulting person will almost certainly develop a degenerative illness in their forties and die of it. Normal procedure: biopsy the embryos, rank them, transfer an unaffected one. A mother of a four-year-old born this way has complained to the board. Her argument, as I understand it: we told her we were sparing her child a terrible disease, but if we'd transferred a different embryo she wouldn't have this child at all, she'd have a different one. So nobody was spared anything. The child who exists isn't better off than she'd otherwise have been, because there is no "otherwise" for her — there's just no her. And our consent paperwork, she says, is built on a comparison that can't actually be made. Half the commitee thinks this is clever wordplay with no practical upshot. I'm not so sure, but I also can't see what it's supposed to change about what we do on Monday.

  Case two, which is what makes it hard. A deaf couple, both deaf from the same genetic variant, have asked us to select an embryo carrying that variant — they have several, some would be hearing, some deaf. Several members say obviously not, that's deliberately creating a disabled child. But if the complainant in case one is right that embryo choice doesn't harm the child who results, the symmetry is uncomfortable: we're perfectly willing to select away from a trait and totally unwilling to select toward the very same trait, so harm to the child can't be what's doing the work in our policy. Something else is, and we should probably have to say what.

  Three things we've floated and can't settle: a "counterfactual embryo note" in the medical record — which embryo we would have transferred instead, and why — disclosed to the resulting person at eighteen on request; a "substitution test," where we only permit selection when we can actually name the embryo we'd otherwise have used, so we can't slide into treating embryo choice as general quality control; and a ban in counseling on comparative phrasing like "spare your child from," replaced with something like "you are choosing which child to bring into existence."

  What I want: a decision memo, 700–900 words, addressed to the committee, recommending one concrete course — keep offering this testing, stop offering it for late-onset conditions, or keep it under specified conditions — with a realistic timeline, actual consent-form language we could lift, and a straight yes or no on the deaf couple's request. Please don't spend the memo explaining that the first complaint is a famous argument with a name; I've read enough to know it has one. Tell us what, if anything, follows from it for policy, and give the strongest version of the losing side — the view that none of this should change our practice — rather than a paragraph of strawman.
reasoning: |-
  Okay, I'm trying to grasp the user's situation. They're the non-clinician on an ethics committee at a fertility clinic, tasked with writing a memo about two complex cases. The first involves a complaint from a mother who argues that selecting embryos to avoid late-onset diseases doesn't actually "spare" a child since that specific child wouldn't exist otherwise. The second case is about a deaf couple wanting to select a deaf embryo, which challenges the clinic's current policies. The user wants a practical decision memo with clear recommendations, consent-form language, and a timeline.

  I need to understand the core ethical dilemmas here. The first case revolves around the non-identity problem - the idea that selecting against a disease doesn't harm a particular child because they wouldn't exist otherwise. This creates a paradox where preventing harm through embryo selection seems logically inconsistent. The second case highlights a symmetry issue: if selecting against deafness is acceptable but selecting for it isn't, what's the ethical basis if harm to the child isn't the determining factor?

  The user has mentioned several proposals: a counterfactual embryo note, a substitution test, and changing counseling language. I should evaluate these pragmatically. The counterfactual note seems administratively burdensome and potentially confusing. The substitution test might be too restrictive, especially in cases with many embryos. Changing counseling language to focus on "choosing which child to bring into existence" rather than "sparing" seems the most feasible and addresses the core communication issue.

  For the deaf couple's request, I need to consider disability ethics. There's a difference between preventing suffering from a degenerative disease versus selecting for deafness, which many in the Deaf community consider a cultural identity rather than a disability. The clinic's current policy likely aims to prevent harm, but the non-identity problem complicates this. I should recommend prohibiting selection for conditions causing significant suffering while allowing selection against them, acknowledging this isn't perfectly symmetrical but is ethically defensible.

  The user wants concrete recommendations. For case one, I'll suggest keeping embryo testing but revising consent forms and counseling language. For case two, I'll recommend denying the request to select for deafness, based on preventing avoidable impairment. I'll provide sample consent language focusing on choice rather than harm prevention. The timeline should be realistic - perhaps two months for implementation.

  I should also address the strongest counterargument: that none of this needs to change because the non-identity problem is theoretical and doesn't affect outcomes. But I'll counter that it impacts informed consent and communication with parents, which are practically important. The memo should be clear, structured, and actionable, respecting the user's need for something usable in their committee meeting.
answer: |-
  ## MEMORANDUM

  **TO:** Ethics Committee, [Clinic Name]  
  **FROM:** Non-Clinical Member (Ethics Committee)  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy Recommendations: Preimplantation Testing for Late-Onset Conditions & Selection *For* Disability; Concrete Proposals for Implementation  

  This memo addresses the two complex cases concerning embryo selection raised in our last meeting and proposes specific, actionable policy revisions. The core tension lies in reconciling the logical implications of the "non-identity problem" (raised in Case One) with our intuitive ethical commitments regarding child welfare and disability (challenged in Case Two). Following extensive review and debate, the recommendations prioritize practical ethics, clarity in consent, and defensible boundaries for our practice.

  **I. Core Recommendations & Rationale**

  1.  **Continue Offering PGT for Late-Onset, Untreatable Degenerative Conditions:** The existence of the non-identity problem does not invalidate the value proposition for families seeking to avoid devastating illnesses in their future children.
      *   **Strongest Argument Against Changing Practice:** While the specific child born with the avoided condition would not exist, parents are making a profound choice *between possible future children*. Selecting an embryo without the variant means choosing a future child whose life trajectory will almost certainly involve severe suffering and premature death *compared to the life they would otherwise have had*. The complaint highlights a philosophical nuance in *framing* the benefit ("sparing"), not a flaw in the *outcome* desired by parents (a child free from that specific suffering). Our duty is to facilitate informed reproductive choices based on accurate medical information about potential future lives.
      *   **What Follows for Policy?** The non-identity problem mandates **crucial changes in communication and consent**, not the cessation of testing. We must eliminate language implying we are "saving" or "sparing" *this specific child* from a fate they would otherwise have had. Our language must accurately reflect that parents are choosing *which potential child* to bring into existence based on genetic health information.

  2.  **Deny the Request to Select *For* the Deafness Variant (Case Two):** Selecting an embryo *because* it carries a variant causing congenital deafness is ethically distinct from selecting *against* a late-onset degenerative disease and violates our core commitment to promoting the health and welfare of future children.
      *   **Resolving the Apparent Symmetry:** The non-identity problem highlights that *neither* selection "harms" the specific child born. However, the *reasons* for selection and the *nature of the outcome* differ fundamentally:
          *   **Selecting *Against* Degenerative Disease:** Aims to prevent profound, unavoidable suffering and premature death inherent to the condition itself. The selected child avoids a life containing that specific severe harm.
          *   **Selecting *For* Congenital Deafness:** Intentionally creates an avoidable sensory impairment. While Deaf culture is valid and fulfilling, deafness itself *is* a physical impairment involving significant functional limitations in a hearing world (e.g., communication barriers, safety risks). Choosing this specific embryo *because* of the deafness variant prioritizes parental preference *over* providing the child with the potential for sensory function. It constitutes a deliberate choice *against* a potential state of lesser impairment when viable alternatives exist.
      *   **Harm is Not the Only Relevant Ethical Principle:** Our policy must consider **nonmaleficence** (avoiding creating avoidable impairments), **beneficence** (promoting well-being, which includes minimizing avoidable health limitations), and **justice** (ensuring the child's interests are not subordinated to parental desires). Selecting *for* deafness fails these principles, regardless of the non-identity problem. The symmetry argument conflates the *mechanism* of selection (involving non-identity) with the *ethical justification* (preventing severe suffering vs. intentionally creating impairment).

  **II. Rejected Proposals & Reasoning**

  1.  **Counterfactual Embryo Note:** Logistically complex, potentially misleading (embryo ranking can be dynamic), and offers dubious benefit to the resulting person. Knowing "you were chosen instead of embryo #3, which had the variant" adds little meaningful insight and risks causing confusion or distress. **Recommendation: Reject.**
  2.  **Substitution Test:** Overly restrictive and impractical. Embryo cohorts vary. Requiring a single identifiable "counterfactual" embryo isn't always possible (e.g., selecting the best morphology from several unaffected embryos). It would unnecessarily constrain legitimate selection practices without resolving the core ethical communication issue. **Recommendation: Reject.**
  3.  **Ban on Comparative Phrasing ("Spare your child from..."):** **This is the critical change.** This language is philosophically inaccurate and the root of the complaint in Case One. It must be replaced. **Recommendation: Adopt.**

  **III. Concrete Implementation Plan & Consent Language**

  1.  **Revised Counseling & Consent Language:**
      *   **Replace:** "This testing aims to spare your child from [Disease Name]".
      *   **Replace:** "Selecting an unaffected embryo prevents your child from developing this disease."
      *   **Adopt:** "Preimplantation genetic testing (PGT) provides information about the genetic variants carried by each embryo. For the condition [Disease Name], this testing allows you to identify embryos that carry the genetic variant associated with this serious late-onset illness. *By choosing to transfer an embryo that does not carry this variant, you are selecting a potential child who will not be affected by [Disease Name] and will not experience the suffering and health decline associated with it. This is a choice between potential future children with different genetic makeups.*"
      *   **Adopt:** "It is important to understand that selecting an embryo based on its genetic characteristics means choosing which potential child to bring into existence. The child born from the selected embryo would not exist if a different embryo had been chosen. Therefore, we do not frame this selection as 'preventing disease' or 'sparing' the resulting child from a fate they would otherwise have had, but rather as enabling you to make an informed choice about which potential future child to parent, based on genetic health information."

  2.  **Formal Policy on Selection Criteria:**
      *   **Adopt:** "This clinic permits embryo selection via PGT only for the purpose of avoiding specific, serious genetic conditions associated with significant suffering, major health impairment, or premature death. Selection *for* genetic variants known to cause disability, disease, or impairment is prohibited. This includes, but is not limited to, selecting embryos *because* they carry variants associated with sensory impairments (e.g., profound congenital deafness), neurodevelopmental disorders, or other conditions causing significant functional limitation or suffering. Selection for HLA matching for a sick sibling remains permissible under established guidelines as it aims to treat an existing illness."
      *   **Justification for Deaf Couple:** The clinic declines the request to select an embryo carrying the deafness variant. This selection is for a condition causing congenital sensory impairment and falls under our prohibition against selecting *for* disability. We will offer the couple counseling and support regarding transferring an unaffected embryo or exploring alternative family-building options.

  **IV. Timeline**

  1.  **Immediate (Within 1 Week):** Circulate this memo and revised consent language drafts to the committee for final comment.
  2.  **2 Weeks:** Finalize revised consent forms and counseling scripts incorporating the new language. Finalize formal policy statement on selection criteria.
  3.  **1 Month:** Train all clinical and counseling staff on the revised language, rationale, and policy.
  4.  **2 Months:** Implement new consent forms and counseling protocols for all patients considering PGT for monogenic conditions (PGT-M). Implement the formal policy on selection criteria. Inform the complainant from Case One (anonymized) that her feedback prompted a review and significant revision of our communication practices.
  5.  **3 Months:** Report back to the committee on implementation and any initial feedback.

  **V. Strongest Counterargument (Status Quo)**

  The strongest argument against making *any* changes is that the non-identity problem, while philosophically interesting, has no practical bearing on patient outcomes or ethical justification. Parents understand they are choosing a child without a terrible disease; framing it as "sparing" is harmless shorthand they intuitively grasp. Changing language risks confusing patients and creating unnecessary bureaucracy. Regarding Case Two, the asymmetry is justified by the undisputed goal of medicine to prevent disease and disability. Selecting *for* deafness is clearly deviant and can be prohibited without appealing to complex identity arguments; it simply violates the principle of choosing the healthiest embryo possible. The current system works; these are edge cases requiring nuanced counseling, not sweeping policy shifts.

  **Conclusion**

  While the non-identity problem does not compel us to stop offering valuable PGT for severe conditions, it demands rigorous honesty in our communication. We must cease language implying we "save" a specific child and instead frame selection accurately as a choice between potential children. This resolves the complaint in Case One and strengthens informed consent. Case Two reveals that harm avoidance is not the sole basis for our policy; the nature of the condition and the principle of avoiding the *intentional creation* of avoidable impairment are paramount. The proposed consent language, formal policy prohibiting selection *for* disabilities like deafness, and implementation timeline provide a clear, defensible, and actionable path forward. I recommend the committee adopt these proposals.
