prompt: |-
  I run a small type foundry, and we are finishing a low-contrast humanist text family — a roman with a true italic companion, meant for continuous reading at 8 to 11 point. We build candidate glyphs with a generative tool that perturbs stroke skeletons and proposes variants; my collaborator M. is the one who rules on them. For the lowercase a she says simply "that's an a" or "that's not an a of ours," and I have never been able to reconstruct the rule she is applying. I would like to know how she will rule on the proposal now on the table, and what rule would make her verdicts cohere.

  Her verdicts so far on candidates for the roman:

  1. A variant with the bowl's weight shifted toward the shoulder, the terminal shortened and cut at a shallower angle, the aperture between bowl and stem opened wider, and the stem's foot serif simplified — accepted, and she said it was better than what we had.

  2. A variant in which the aperture was closed, leaving a closed ring with the stem attached on its right and no terminal — rejected. Her words: "that's an o with a stick glued to it."

  3. A variant in which the stem was moved from the right side of the bowl to the left, everything else unchanged — rejected. "That's a d."

  4. A variant in which the bowl and stem were left as they are but the joint between them was broken, so that the stem stands a few units clear of the bowl — rejected. "The a has to be one animal, not two." At 9 point in running text most readers still read it as an a, and we told her so; she did not change her mind.

  5. For the italic companion, the tool proposed a one-storey a — a round bowl sitting on the baseline with a straight stem at its right, no arch over the bowl and no terminal — accepted. "In the italic that's the only honest a." Pressed on why the same shape would not do in the roman, she said only that "the roman hand and the italic hand are not the same hand," which I do not think answers the question.

  6. A candidate that is, stroke for stroke and unit for unit, the accepted roman a, but which the tool reached not by editing our a and not by copying a reference, but by extrapolating from the family's o, d, and g — rejected. "That one is an a by accident." We pointed out that no reader could tell it apart; she said readers are not the tribunal.

  The new proposal is a one-storey a for the roman regular: a round bowl on the baseline, a straight stem at its right rising to the x-height, no arch and no terminal, the stem cut flat at the baseline with no foot serif, and sidebearings, width, and x-height identical to the accepted two-storey a. Crucially, the tool got there by deleting the arch and terminal from our own accepted roman a and redrawing the bowl as a full circle — the same kind of edit that produced items 1 and 4, not the extrapolation procedure she objected to in item 6. So the shape is the italic's shape but the derivation is our own glyph's. We set 9 point paragraphs with it: no reader misread a word and nobody noticed anything until we pointed it out, though two of them said afterward that the page looked "cleaner but less like us." She has also been known to say that "an a isn't a shape, it's a settlement with the o and the d," which I have never been able to cash out.

  What I want from you: predict her verdict, and identify the rule she appears to be running. Please set out the other rules that fit all six of her earlier verdicts equally well, say what each of them predicts about this new case, and give me your best guess with the reasons for preferring it. Then tell me which single further case would best separate the surviving rules from one another — e.g. some variant of the same shape reached by a different route, or proposed for a different cut or optical size — and say what each rule would say about it. Finally, if consistency with her own record commits her to rejecting this glyph, I want that stated plainly, together with the principle she would thereby be adopting: is a letter identified by its shape as read in context, by the arrangement of its parts, by the gesture or procedure that produced it, or by the slot it occupies among the other letters of this family?
reasoning: |-
  Okay, this is a fascinating typography puzzle. The user runs a type foundry and is struggling to understand their collaborator M.'s seemingly intuitive rules for accepting or rejecting lowercase 'a' glyph variants. They've provided six historical verdicts and now need to predict M.'s response to a new proposal - a one-storey 'a' for the roman derived from their own accepted glyph.

  First, I need to unpack M.'s established principles from the six cases. Her rejections reveal several non-negotiable aspects: the 'a' must be a single cohesive unit (case 4 rejection), maintain the correct spatial relationship with other letters (case 3's "that's a d" comment), and preserve family-specific characteristics (case 6's "a by accident" rejection). The italic acceptance (case 5) shows she applies different standards to different styles, while the "settlement with o and d" remark suggests she views letters relationally within the entire alphabet system.

  For the new proposal - a one-storey roman 'a' derived by modifying their existing two-storey version - there's tension between several factors. The derivation method matches previously accepted procedures (case 1), but the resulting form breaks with their roman tradition. M.'s "settlement" concept implies this glyph might disrupt the visual ecosystem between 'a', 'o' and 'd'. The user's test results show functional readability but note the "less like us" comment, which aligns with M.'s apparent concern for design continuity.

  I suspect M. will reject this because it violates the unspoken "roman-ness" of the design. Her distinction between roman and italic hands (case 5) suggests she sees them as fundamentally different writing systems. Removing the arch fundamentally changes the roman 'a's character, regardless of derivation path. The "settlement" idea likely means each letter's form must negotiate space with neighbors - a one-storey roman 'a' might create imbalance with 'd' or leave too much space with 'o'.

  To test this theory, I'd propose a variant where the one-storey form is derived through relational spacing adjustments rather than direct deletion. If M. accepts that, it confirms her "settlement" principle is paramount; if she rejects it too, she's likely adhering to historical roman forms as an absolute rule. Ultimately, M. seems to operate on a holistic philosophy where letters aren't just shapes but interlocking parts of a visual language system specific to each typographic tradition.
answer: |-
  Based on M.'s established pattern of verdicts and stated principles, here is the analysis, prediction, and further testing strategy:

  ### M.'s Core Rule (The "Settlement" Principle)
  M. evaluates glyphs **not solely by shape or readability in isolation, but by their adherence to the internal logic and historical DNA of the specific type family ("our a"), defined by its relationship ("settlement") to key neighbors (especially 'o' and 'd') and its derivation path from the family's foundational skeleton.** A glyph is "an a of ours" only if:
  1.  **It maintains the family's specific structural archetype:** For the roman, this requires a two-storey construction.
  2.  **It preserves the critical spatial relationships ("settlement"):** The visual balance and negative space dialogue between the 'a', 'o', and 'd' must be consistent with the family's established norms.
  3.  **It evolves authentically:** Modifications must build directly upon the family's existing glyphs or skeleton in a way that respects the established construction logic (e.g., perturbing strokes), not by copying shapes from unrelated processes or other styles, even if the final shape is identical.

  ### Prediction for the New Proposal: **REJECTED**
  *   **Reasoning:**
      *   **Violates Structural Archetype:** M. explicitly stated the one-storey form is acceptable *only* for the italic ("the only honest a" there). For the roman, she implicitly requires two storeys as part of its "hand." Item 5's rejection of the one-storey form for the roman, even when pressed, underscores this distinction.
      *   **Breaks the "Settlement":** While the *shape* is identical to the italic 'a' and readable, it fundamentally alters the visual relationship between the roman 'a', 'o', and 'd'. The two-storey 'a' creates a different pattern of counters, apertures, and weight distribution compared to the 'o' and 'd'. A one-storey 'a' in the roman would have a counter much closer to the 'o', disrupting the carefully negotiated "settlement" M. deems essential ("an a isn't a shape, it's a settlement with the o and the d"). The "cleaner but less like us" user comment directly reflects this disruption of the family's characteristic texture.
      *   **Derivation is Insufficient:** While the derivation path (modifying the *existing* roman 'a') is acceptable in principle (like item 1), M. has shown that certain modifications fundamentally change the character beyond what she considers "our a" (items 4, 5 roman rejection). Deleting the arch and terminal is not a perturbation; it's a radical reconstruction that abandons the defining structural feature of the roman 'a' in this family. Her "one animal" comment (item 4) emphasizes the importance of the *specific* structural cohesion.

  ### Rules Consistent with Past Verdicts & Their Predictions
  1.  **Rule S (Shape in Context is King):** "A glyph is an 'a' if it is reliably read as 'a' in continuous text at the target size." *Prediction for New Proposal:* **ACCEPTED** (Users read it fine). *Contradicted by:* Item 6 (identical shape rejected as "accidental"), Item 2 (readable as 'a' but rejected as "o with a stick").
  2.  **Rule P (Parts & Proportions):** "An 'a' must have a bowl and a distinct stem attached in a specific configuration (right side for roman), with a defined aperture, forming a cohesive unit." *Prediction:* **REJECTED** (Lacks the arch/terminal defining the "specific configuration" for the roman). *Fits:* Items 1-4, 6. *Problem:* Item 5 (italic one-storey accepted despite lacking arch/aperture).
  3.  **Rule D (Derivation Path):** "A glyph is 'our a' only if derived by perturbing the skeleton of our existing 'a' or the core family skeleton in a way that maintains its fundamental construction." *Prediction:* **ACCEPTED** (Modified from existing roman 'a', like item 1). *Contradicted by:* Item 6 (shape derived from o/d/g rejected, even though derivation path *is* part of M.'s rule). *Problem:* Doesn't explain *why* certain modifications (like deleting the arch) are invalid (item 5 roman vs italic, potential rejection here).
  4.  **Rule F (Family Slot & Relations - The Settlement Rule):** "A glyph is 'our a' only if it occupies the correct visual 'slot' within the family system. It must maintain the established structural type (e.g., two-storey roman) and the specific visual balance ('settlement') relative to its key neighbors (o, d), *regardless* of derivation path or isolated readability." *Prediction:* **REJECTED** (One-storey disrupts the roman "settlement" with o and d, violates the structural type). *Fits:* **All items:**
      *   1: Perturbation improves *within* the two-storey archetype/settlement.
      *   2: Closed aperture destroys the defining aperture relationship.
      *   3: Stem move changes relationship to bowl, making it visually a 'd'.
      *   4: Broken joint destroys cohesion ("one animal") needed for the slot.
      *   5: Italic *requires* a different structural archetype (one-storey) for *its* slot/hand/settlement.
      *   6: Shape derived externally doesn't fit the internal family relationships/settlement.

  ### Why Rule F (Settlement) is Best
  It is the **only rule that coherently explains all six verdicts simultaneously**:
  *   It accounts for the distinct roman/italic standards (Item 5).
  *   It explains why an identical shape can be rejected if derived incorrectly for the family system (Item 6 - "accident").
  *   It incorporates the "one animal" cohesion (Item 4) and attachment point (Item 3) as aspects of the glyph's role/relationship.
  *   It elevates the "settlement with o and d" from a vague comment to the core principle.
  *   It justifies rejecting a readable shape (Item 2, New Proposal) if it breaks the family's internal logic and texture.

  ### Discriminating Test Case
  **Proposal:** A **two-storey italic 'a'**, derived by adding an arch and terminal to the *existing accepted italic one-storey 'a'* (perturbation path). Keep its width, sidebearings, and overall weight consistent with the italic family.

  *   **Rule S (Shape Context):** Likely ACCEPTED (If readable as 'a' in italic text).
  *   **Rule P (Parts):** Likely ACCEPTED (Has bowl, stem, arch, aperture - fits "parts" model).
  *   **Rule D (Derivation):** ACCEPTED (Derived correctly by modifying the *italic* family's existing 'a').
  *   **Rule F (Settlement/Family Slot):** **REJECTED.** "The italic hand requires a one-storey 'a'. That two-storey form belongs to the roman. Adding the arch disrupts the specific flow, rhythm, and relationship to the italic 'o' and 'd'. It's not an italic 'a' of ours." This directly parallels the roman one-storey rejection based on violating the style's inherent structural archetype and settlement.

  This test forces the distinction. Rules S, P, and D would likely accept it based on shape, parts, or derivation. Only Rule F (Settlement) would consistently reject it, mirroring the rejection of the one-storey roman 'a', because it violates the *italic* hand's required structural archetype and its own unique settlement with neighbors.

  ### Conclusion & Principle
  *   **Prediction:** M. will **reject** the one-storey roman 'a' proposal.
  *   **Principle:** **Consistency with her record commits her to rejection.** The principle she adopts is:
      > **"A letterform's identity within a specific type family is defined by its adherence to the family's structural archetype for that style (roman vs. italic) and its successful visual 'settlement' within the system of relationships between key glyphs (especially o, d, a), taking precedence over isolated readability or shape similarity. The derivation must authentically extend the family's internal logic, not transplant forms from other styles or create accidental fits."**

  This principle synthesizes shape, construction, derivation, and systemic relationships, placing the glyph's role within the *specific* family's ecosystem as paramount. The "tribunal" is the integrity of the type family's internal logic and historical continuity, not just the reader's momentary perception.
