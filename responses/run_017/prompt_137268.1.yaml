        - However, the point is to show that if the settings are not independent of the strategy (or if the settings are chosen based on the strategy), then they can win 100%. This breaks the assumption of "settings independence" (also called "measurement independence") in Bell's theorem.

     Procedure:

        - Groups are given 5 minutes to design a deterministic strategy (lookup tables) and also to write down what they are sharing (which is the tables).

        - They hand over their strategy to the referee (the instructor).

        - The instructor, for each group, looks at their strategy and picks an admissible setting triple for which the group would win.

        - The instructor gives that setting triple to the group.

        - The players, using their fixed tables, output the bits.

        - They win.

     Then they do one trial and win.

     But note: they might design a strategy that wins only 3 out of 4. Then the instructor picks one of the winning ones. They win.

     However, they might design a strategy that wins only 2 out of 4? But the known strategy wins 3. So they should win.

     The point is: they can win every round if the settings are chosen after knowing the strategy.

     **Debrief (15 minutes):**

     Map each round to the premises:

       - Round 1 (shared randomness): This round illustrates that with locality and settings independence (the settings are chosen randomly and not based on the strategy), the best they can do is 75%. The shared randomness is just a classical local hidden variable.

       - Round 2 (deterministic): This round shows that no deterministic local strategy can win 100%, and the reason is the algebraic inconsistency (the contradiction in the equations). This is the core of the no-go.

       - Round 3 (computed settings): This round shows that if we drop settings independence (i.e., if the settings can be chosen based on the hidden variables, which in this case are the strategies), then they can win 100%. This exposes the settings independence assumption.

     Also, note two things the game cannot show:

       1. That shared randomness cannot improve on the 75% ceiling: we assume that because shared randomness is a convex combination of deterministic strategies, and we saw that deterministic strategies max at 75%, so the mixture does too. But we don't prove that in the game.

       2. That nothing in the room beats 75%: in the quantum case, they can achieve 100% with entanglement. But we cannot demonstrate that in the room without quantum systems. So the facilitator must assert that quantum mechanics predicts 100%.

     **Scoring scheme:**

     - We can use a team standings board: each group gets a point for each win in rounds 1 and 3 (in round 2, no group wins all, so maybe no points? or we give a point for each setting triple they win? but they all will have at most 3 wins in round 2? But we are not running multiple setting triples in round 2 for the same group?).

     Round 1: each group plays 4 trials. They get 1 point per win. Max 4 points? But they can only win up to 3. Then we can rank groups by how many wins they got.

     Round 2: we don't award points for wins because it's a proof. Instead, we award a point to groups that correctly write down a strategy that wins 3 out of 4? But we don't run trials. We just check the strategy. So we can give 3 points to groups that have a strategy that wins 3 out of 4.

     Round 3: each group wins the one trial, so 1 point.

     Alternatively, we can make it cumulative:

        Round 1: points = number of wins (out of 4)
        Round 2: points = 0 (or if they design a strategy that wins 3, they get 3 points? but we haven't run trials)
        Round 3: 1 point if they win.

     But round 2 is not about winning in the same way. It's about understanding the impossibility. So maybe skip scoring in round 2.

     We can do:

        - Round 1: score = number of wins in 4 trials (max 3).
        - Round 2: no score, or a bonus point if they can write a strategy that wins 3 out of 4 (which they can).
        - Round 3: 1 point.

     Total score: round1 + round3 (max 4).

     But to make it fun, we can have a forfeit for the group with the lowest score: they have to present the debrief for one of the rounds? Or we can just have a standings board for fun.

     Alternatively, we can avoid money and do a simple point system and the group with the highest points gets applause.

     **Potential pitfalls:**

       - Players signalling by coughs or timing: the inspector (which in our case might be the other students or the instructor) must be vigilant. We can remind them of the rules and the importance of no communication.

       - Someone trying to win by guessing the others' outputs: but they can't, because they are separated.

       - The group concluding that the absence of communication was the whole content of the theorem: but the debrief should clarify that it's about locality and pre-determined outcomes (hidden variables) and settings independence.

       - Someone objecting that the final round is an excuse rather than a discovery: we should explain that in the quantum case, the settings are chosen independently, so the third round is not how quantum mechanics works. It is to expose the assumption.

     **Revised Timeline:**

       0. Preparation (5 minutes before start): 
            - Divide into 6 groups of 3. 
            - Give each group 3 index cards and pens.

       1. Introduction (10 minutes): 
            - Explain the rules, winning conditions, and the separation.

       2. Round 1: Shared Randomness (20 minutes)
            - 5 minutes: groups design a strategy (they can use shared randomness).
            - Then, they separate (move to corners) and cannot communicate.
            - The instructor randomly picks an admissible setting triple (from the four) and announces it to the whole class.
            - Each group's players, given their setting, write their output on a card and show it to the referee (instructor or a designated student) or to the group.
            - The group checks if they won.
            - Repeat for 4 trials (the instructor picks 4 setting triples, one for each type, in random order).
            - Record wins.

       3. Round 2: Deterministic (20 minutes)
            - Groups come back together.
            - They are told: now you must use a deterministic strategy. Each player must fill in a card: what they output for setting=0 and setting=1. They cannot use randomness.
            - They have 5 minutes to decide on the tables.
            - They write the tables on index cards and hand them to the instructor (or put them on the whiteboard).
            - The instructor then, for each group, checks the four setting triples and marks which ones they win.
            - They see that they cannot win all four.

       4. Round 3: Computed settings (15 minutes)
            - Groups are told: now you can share your entire strategy (the lookup tables) with the referee (instructor). The referee will then choose a setting triple that is admissible and for which you win.
            - They design their tables (5 minutes).
            - They hand the tables to the instructor.
            - The instructor, for each group, looks at the tables and chooses an setting triple that is admissible and for which the winning condition holds.
            - The instructor gives that setting triple to the group.
            - The players, using their tables, output their bits and they win.

       5. Debrief (15 minutes): 
            - Discuss the three rounds and map to the premises.
            - Highlight what the game shows and what it doesn't.

     Total: 10+20+20+15+15 = 80 minutes.

     Note: in round 2, the groups might design a strategy that wins 3 out of 4. We then show that they lose at least one. In round 3, we avoid the one they lose.

     This should work.
