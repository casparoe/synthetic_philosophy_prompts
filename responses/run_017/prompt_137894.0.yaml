answer: |-
  ### Brainstorming Notes (Scratch Work)
  - **IIA**: Arrow's IIA is an output-level axiom: the social preference for x vs y must depend *only* on individual x vs y rankings. In ML, this is a *causal invariance* constraint on the function's *internal architecture*—no information from other pairs can influence the x-y decision. Pairwise losses (e.g., Bradley-Terry) are IIA-compliant *if* they process each pair in isolation (no shared parameters). Listwise losses (e.g., softmax over candidates) violate IIA by construction because they use global context. But caution: IIA constrains the *aggregation rule*, not just the loss. A pairwise model may still violate IIA if scores depend on other alternatives (e.g., via shared embeddings).  
  - **Unrestricted Domain (UD)**: UD requires the aggregator to handle *any* input profile. ML models are distributionally bounded—they fail off-distribution. Translating to (D, ε, m)-compliance relaxes UD to on-distribution performance. The impossibility *might* survive if D has sufficient support (e.g., includes "pivotal voter" profiles), but exact proofs fail due to finite samples and approximation.  
  - **Non-Dictatorship**: Arrow's dictatorship is exact and global. In ML, "ε-soft dictatorship" (agreement with one voter on 1-ε of profiles) is a natural analogue. However, a model could be a "mixture of dictators" (e.g., an ensemble) without being ε-soft dictatorial—this weakens the concept.  
  - **Randomization**: Allowing stochastic aggregators (e.g., ensembles) dissolves the impossibility! Random dictatorships (uniform voter sampling) satisfy Pareto and IIA but aren’t dictatorial. Arrow assumes determinism; randomization changes the game.  
  - **Cardinality**: Arrow is ordinal. ML’s cardinal scores (e.g., rewards) escape the theorem—Borda count or Nash averaging satisfy Pareto and non-dictatorship but violate IIA. This isn’t a translation; it’s a different problem.  
  - **Core Residues**:  
    - Voters as *sources* (stakeholders) vs. *features* (data): Arrow treats voters as sovereign entities; ML treats them as training points for an external target. No clean ML analogue for "voter sovereignty."  
    - Exactness vs. approximation: Arrow’s axioms hold everywhere; ML requires only on-distribution ε-compliance. This breaks the pivotal voter argument.  
  - **Smuggled Assumptions**:  
    - If "dictatorship" becomes "highest attention weight," it misrepresents Arrow—dictatorship is about *control*, not influence.  
    - "Irrelevant alternative" ≠ "off-policy candidate"—IIA concerns profile variations, not distribution shifts.

  ---

  ### Polished Translation of Arrow’s Theorem in ML Vocabulary
  **Setup**:  
  - **Alternatives**: Candidate set $\mathcal{A}$ (size ≥3).  
  - **Voters**: $n$ annotators, each providing pairwise comparisons (or a full ranking) over $\mathcal{A}$.  
  - **Data**: A profile = dataset of $n$ strict total orders (rankings), represented as pairwise labels.  
  - **Aggregator**: A model $f_\theta$ (e.g., reward model) trained to output a social ranking. Learned via ERM over $m$ profiles from distribution $D$.  
  - **Social Ordering**: A ranking induced by $f_\theta$'s predicted rewards (scores) for $\mathcal{A}$.  

  **Arrow’s Conditions Translated**:  
  1. **Unrestricted Domain (UD) → (D, ε, m)-Compliance**:  
     - *Textbook*: $f$ works for any profile.  
     - *ML Translation*: After training on $m$ $D$-samples, $f_\theta$ achieves $≤ε$ pairwise test error on new $D$-samples.  
     - **Departure**: Drops worst-case requirement; compliance is probabilistic and on-distribution.  

  2. **Weak Pareto (WP)**:  
     - *Textbook*: If all voters prefer $x \succ y$, then social ranking has $x \succ y$.  
     - *ML Translation*: If all voters rank $x \succ y$, $f_\theta$ outputs $x \succ y$ with probability $≥1-ε$ over $D$.  
     - **Clean?** Yes.  

  3. **Independence of Irrelevant Alternatives (IIA)**:  
     - *Textbook*: Social $x \succ y$ depends *only* on voters' $x$ vs. $y$ preferences.  
     - *ML Translation*: $f_\theta$’s prediction for $x$ vs. $y$ is *invariant* to other candidates’ rankings. Architecturally, this requires:  
       - Pairwise processing with no shared parameters across pairs.  
       - Input to $f_\theta$ for $(x,y)$ is only the vector of voter preferences for $x$ vs. $y$.  
     - **Key Insight**:  
       - Pairwise losses (e.g., Bradley-Terry) are IIA-compliant *iff* no parameter sharing.  
       - Listwise losses (e.g., softmax over $\mathcal{A}$) violate IIA by design—they use global context.  
     - **Departure**: IIA is an *architectural constraint* in ML, not just an input-output condition.  

  4. **Non-Dictatorship (ND) → ε-Soft Dictatorship**:  
     - *Textbook*: No voter $i$ such that $f$ always outputs $i$’s ranking.  
     - *ML Translation*: No voter $i$ such that $f_\theta$’s ranking agrees with $i$’s on $≥1-ε$ of $D$-profiles.  
     - **Departure**: "Agreement" is measured as expected pairwise accuracy over profiles.  

  **Conclusion (Impossibility)**:  
  - *Textbook*: No deterministic $f$ satisfies all four conditions for $|\mathcal{A}|≥3$.  
  - *ML Translation*: With IIA enforced architecturally and exact compliance ($ε=0$), no $f_\theta$ can achieve $<1/n$ error on $D$ *if $D$ includes "pivotal voter" profiles*.  
  - **Relaxed Setting ($ε>0$, on-distribution)**:  
    - Impossibility *fails* if $D$ lacks critical profiles (e.g., no preference diversity) or $m$ is too small to learn pivotal structures.  
    - If $D$ is "rich" (contains all profiles in Arrow’s proof), a sample-complexity argument shows:  
      > For small $ε$ and large $m$, $f_\theta$ must be $ε$-soft dictatorial or violate WP/IIA on $D$.  
    - **Where Proof Fails**: Pivotal voter argument requires constructing specific profiles—if these are $δ$-rare in $D$, $f_\theta$ can "cheat" with $O(δ)$ error.  

  **Randomized Aggregators**:  
  - Allow $f_\theta$ to output a distribution over rankings (e.g., ensemble).  
  - *Result*: Impossibility **dissolves**!  
    - **Example**: Random dictatorship (sample a voter uniformly; output their ranking).  
      - Satisfies WP and IIA exactly.  
      - Not a dictator (no fixed $i$).  
  - In ML, this is a mixture model or ensemble—fair and feasible.  

  ---

  ### Residue Report: What Doesn’t Translate and Why  
  For each condition, we assess: **Clean Translation** (CT), **Translation with Distortion** (TD), **No Counterpart** (NC), or **Smuggled Assumption** (SA).  

  | Condition         | Verdict | Explanation |  
  |-------------------|---------|------------|  
  | **Unrestricted Domain** | NC (+SA) | No ML model handles all possible inputs; we assume $D$. UD’s residue is *normative*—it demands robustness to adversarial preferences, which ML lacks. Smuggling alert: "Off-policy" ≠ UD; UD is about input space coverage, not distribution shift. |  
  | **Weak Pareto** | CT | Translates cleanly to unanimous preference respect. ML loss functions often enforce this (e.g., penalizing unanimous violations). |  
  | **IIA** | TD (+SA) | Architectural invariance in ML captures IIA’s spirit but distorts it: IIA constrains the aggregation *rule*, while ML focuses on *implementation*. Smuggling: "Irrelevant alternative" ≠ "low-reward candidate"—IIA forbids using *any* other candidate’s data, not just "irrelevant" ones. |  
  | **Non-Dictatorship** | TD | ε-Soft dictatorship is a weakening—it ignores "mixtures of dictators" (e.g., attention-weighted ensembles), which aren’t dictatorial but may violate Arrow’s intent. |  
  | **Conclusion** | TD | On-distribution approximation avoids impossibility if $D$ is benign. Randomization dissolves it entirely. |  

  **Core Residues**:  
  1. **Voters as Sovereigns (NC)**:  
     - In Arrow, voters are stakeholders with intrinsic authority. In ML, they are data sources for estimating an external ground truth (e.g., "true reward"). This normative stance—preferences as ends, not signals—has no ML counterpart.  

  2. **Exactness vs. Approximation (NC)**:  
     - Arrow’s axioms are binary and global; ML cares about average error. This residue breaks the proof (which relies on constructing pathological profiles) and reflects ML’s engineering mindset vs. social choice’s normative rigor.  

  3. **Cardinality Changes the Subject (TD)**:  
     - ML’s cardinal scores (e.g., rewards) escape Arrow by violating ordinality. But this isn’t a translation—it’s a different aggregation framework (e.g., Nash welfare maximization).  

  **Final Position**:  
  The residue reveals a **normative gap in ML vocabulary**. Social choice axioms encode democratic values (e.g., voter sovereignty, IIA as fairness). ML "translations" often reduce these to predictive constraints, smuggling in assumptions (e.g., voters as features). However, for *predictive* tasks (e.g., reward modeling), the axioms are indeed doing less work—approximation and randomization dissolve impossibilities, highlighting that ML prioritizes functionality over normative rigor. This doesn’t negate Arrow’s insight; it contextualizes it. When preferences are *truths to estimate*, not *wills to aggregate*, the axioms become design choices, not inevitabilities.
