prompt: |-
  I work in a small unit inside a ministry of justice — I would rather not name the country — that has just been handed the job of administering a new funding arrangement for religious and other worldview bodies, and I have to draft the assessment procedure. The background: our constitution has no established church and a clause, inserted as a compromise during the last revision, saying that the Republic recognises the public contribution of communities of belief and of conscience. From next year, taxpayers will have a payroll deduction of 0.6 per cent; those who name a qualifying body send their share to it, those who tick no affiliation go into a residual cultural-heritage fund unless they actively name a body anyway, and there is talk of a later opt-in for redirecting the residual share to secular charities. Bodies can apply for recognition on either of two tracks, one for worship-centred communities and one for non-theistic convictions, and the government has not yet decided whether recognition should be a single gate that carries everything with it or a tiered status where the levy, the right to conduct legally valid marriages, and the right to teach in state schools come apart. We have looked loosely at how England, Germany, France and the United States handle these things, and at the Italian and Spanish tax-designation schemes, but my minister has been clear that we are copying nobody. My director's own line is that we are not in the business of grading religions, which I find sounds right and decides nothing.

  What I need from you is a written procedure my case officers can run. They are lawyers without training in theology or the philosophy of religion, they get about thirty applications a year, they have roughly three weeks a file, and every decision is politically visible, signable by the minister and reviewable by a constitutional court that applies a proportionality and equal-treatment test. So: the questions to ask in order, and what a sufficient answer to each looks like; the points at which the file stops with a no; the points at which the procedure has to hand the decision to a named person because the remaining question is one of values rather than fact. It should never require an official to judge whether a doctrine is true, or how sincerely it is held, but it does have to cope with bodies whose internal governance is undemocratic, or discriminatory in ways that would be illegal in any other employer, or funded from abroad, or that exist mainly as parody. I also want you to say explicitly which distinctions from the church-and-state literature survive being turned into a checklist and which ones you have dropped as unusable at this level, and to tell me whether you think the gate should be single or tiered.

  Then apply the procedure to three of our pending files, please: an Ethical Culture and Humanist Association with three thousand dues-paying members, Sunday assemblies, a trained celebrant corps and no creed, which is currently the only body that will conduct non-religious funerals in rural districts; a federation of forty legally independent immigrant congregations, formed last year, some of which receive money from a foreign government's religious-affairs ministry and none of which has a governing hierarchy above the congregational level; and the centuries-old national church, which ordains only men, will not solemnise same-sex marriages, and runs something like a third of the country's hospices and elder care. I would like at least one of the three applications to come out somewhere I will not like, and I would rather hear it than not. Finally, be honest about what this kind of procedure cannot do — where the appearance of administrative neutrality is doing work that actually belongs to a legislature, and where it is just hiding a substantive view about which communities a liberal state should want more of.
reasoning: |-
  Okay, the user works in a ministry of justice unit tasked with designing an assessment procedure for funding religious and worldview bodies. They need a clear, legally sound procedure for case officers to evaluate applications. The constitutional context involves recognizing the public contribution of belief communities without establishing a church. Taxpayers allocate 0.6% of their payroll to designated bodies or a residual fund. The key challenge is creating a neutral process that avoids judging doctrinal truth or sincerity while addressing practical issues like discriminatory practices or foreign funding.

  The user's explicit needs include a step-by-step procedure with clear questions, decision points, and handling of value-based judgments. They also want to know if the recognition should be single or tiered. Implicitly, they need a system that withstands political scrutiny and constitutional review, ensuring equal treatment and proportionality. They might be concerned about balancing inclusivity with preventing abuse (e.g., parody groups) without appearing biased.

  The three pending cases test the procedure's fairness: a humanist group providing essential services, a federation of immigrant congregations with foreign funding, and a traditional church with discriminatory practices. The user wants at least one controversial outcome, indicating a need for transparency even when decisions are unpopular. They also seek honesty about the procedure's limitations, acknowledging that neutrality might mask legislative choices.

  For the procedure, I need to focus on objective criteria: definition, public contribution, governance, compliance with laws, and financial integrity. Avoiding theological judgments is crucial. The tiered approach makes sense, separating funding from other rights like marriage solemnization, as it allows nuanced assessment and reduces all-or-nothing conflicts.

  In the cases, the humanist group should pass all tiers. The immigrant federation might get funding but not other rights if foreign funding poses oversight issues. The traditional church could retain funding due to public contributions but lose marriage rights if discriminatory. This ensures each right is assessed based on relevant criteria, maintaining fairness.

  The procedure's limitations: it can't resolve value conflicts inherent in defining "public contribution" or "community of conviction," which are legislative decisions. Neutral administration here unavoidably reflects state preferences about which groups deserve support, despite appearing objective.
answer: |-
  Here is a draft assessment procedure designed for your specific context, balancing legal robustness, administrative feasibility, and respect for constitutional principles. It explicitly addresses your requirements and incorporates lessons from comparative models while aiming for neutrality.

  **Recognition Assessment Procedure for Communities of Belief and Conscience**

  **I. Guiding Principles**
  1.  **Neutrality & Non-Evaluation:** Officials *do not* assess: the truth of doctrines, the depth or sincerity of individual belief, the "validity" of a worldview compared to others, or the popularity/desirability of the body's views.
  2.  **Focus on Manifestation & Public Contribution:** Assessment centers on the demonstrable *existence*, *structure*, *activities*, and *public-facing role* of the applicant body as a *community*.
  3.  **Procedural Fairness & Consistency:** Clear criteria, sequential steps, documented reasoning, and equal application to all applicants.
  4.  **Proportionality & Equal Treatment:** Requirements must be proportionate to the benefits sought. Similar situations must be treated similarly; different situations may require different treatment if objectively justified by the criteria.
  5.  **Transparency & Accountability:** Clear decision points, reasons for refusal, and a documented trail for ministerial sign-off and potential constitutional review.

  **II. Recommended Structure: Tiered Recognition**
  *   **Rationale:** A single gate tying funding, marriage solemnization, and school teaching rights together creates unnecessary conflict and forces value judgments where they aren't needed. A tiered approach is more proportionate, avoids "all-or-nothing" cliff edges, and better reflects the distinct nature of the privileges.
  *   **Proposed Tiers:**
      *   **Tier 1: Basic Recognition (Levy Eligibility):** Focuses on existence as a qualifying community and public contribution. Grants access to the payroll deduction scheme.
      *   **Tier 2: Marriage Solemnization Rights:** Requires additional criteria demonstrating stable internal procedures for life-cycle ceremonies and commitment to non-discriminatory *service provision* (distinct from internal membership rules).
      *   **Tier 3: State School Teaching Rights:** Requires the most stringent criteria regarding doctrine presentation, pedagogical training, and alignment with broader educational goals (to be defined in separate regulations).
  *   **Procedure Focus:** This document details the assessment for **Tier 1: Basic Recognition (Levy Eligibility)**. Tiers 2 & 3 would require supplemental procedures.

  **III. Tier 1: Basic Recognition Assessment Procedure**

  Case Officers follow these steps sequentially. Failure to meet criteria at any step results in a recommendation for refusal. All documentation and reasoning must be recorded in the file.

  *   **Step 1: Formal Completeness Check (Administrative - 1 day)**
      *   **Question:** Is the application form fully completed, signed by an authorized representative, and accompanied by *all* mandatory supporting documents listed in the regulations? (e.g., Constitution/Charter, latest financial statement or budget, list of current leaders/officers, summary of core beliefs/practices, description of regular activities and membership).
      *   **Sufficient Answer:** Yes. All required sections filled, all documents present and legible.
      *   **Stop Point/Refusal:** If No. Reason: "Application incomplete." (Opportunity to rectify may be offered once, within a strict deadline, if regulations permit).
      *   **Decision Maker:** Case Officer.

  *   **Step 2: Legal Personality & Domestic Presence (Factual - 3 days)**
      *   **Question 2a:** Is the applicant a legally constituted entity under [Country]'s general association law (or equivalent), with its primary operational base and governing body located within [Country]?
      *   **Sufficient Answer:** Yes. Verified via official registry extracts (provided by applicant or obtained by case officer) and documentation of registered office/primary place of activity.
      *   **Question 2b:** Does the applicant possess a bank account in its own name within [Country]'s financial system?
      *   **Sufficient Answer:** Yes. Verified by bank statement excerpt or official bank letter (sensitive details can be redacted).
      *   **Stop Point/Refusal:** If No to 2a or 2b. Reason: "Applicant lacks requisite legal personality or domestic operational/financial presence under [Relevant Law]."
      *   **Decision Maker:** Case Officer.

  *   **Step 3: Definition as a "Community of Belief or Conscience" (Mixed Fact/Threshold - 5 days)**
      *   **Question 3a:** Does the applicant represent a *community* (i.e., more than an individual or ad-hoc group) with identifiable members or adherents? (Minimum threshold: e.g., 50+ documented adult members OR evidence of regular participation by 50+ distinct individuals in core activities over 12 months).
      *   **Sufficient Answer:** Yes. Verified by membership lists (with privacy safeguards), attendance records, or credible independent attestation. *Avoid judging quality/meaning of membership.*
      *   **Question 3b:** Does the applicant body represent a system of *belief* concerning ultimate questions (e.g., nature of existence, purpose, transcendence) OR a system of *non-theistic conviction* concerning fundamental ethical values, meaning, or human flourishing? (Parody test applied here).
      *   **Sufficient Answer:** Yes. Based on the body's *own description* of its core tenets/purpose (Step 1 docs). Parody/Satire Test: Is the body's *primary purpose*, based on its activities, leadership statements, and public perception, genuine adherence to its stated beliefs/convictions, or primarily mockery/ridicule of others? (Evidence: nature of ceremonies, publications, leadership history, media reports).
      *   **Stop Point/Refusal:**
          *   If No to 3a: Reason: "Applicant does not demonstrate the existence of a sufficiently defined community."
          *   If No to 3b: Reason: "Applicant's stated purpose and activities do not constitute a system of belief or non-theistic conviction as understood under the Constitution." OR "Applicant's primary purpose is parody/satire, not genuine adherence to a belief or conviction system." (Be specific with evidence).
      *   **Decision Maker:** Case Officer (for 3a & initial 3b). *If parody/satire is strongly suspected but contested, escalate to Director for final determination (Value Judgment Point 1).*

  *   **Step 4: Sustained Public Contribution (Factual Assessment - 7 days)**
      *   **Question:** Does the applicant body demonstrate a sustained, active contribution to public life in [Country] beyond the internal practice of its beliefs/convictions? (Focus on *activities*, not doctrine).
      *   **Sufficient Answer:** Yes. Evidence of *regular, documented activities* over at least 2 years (exceptions possible for genuine new communities with clear plans) such as:
          *   Public ceremonies/markings of life events (weddings, funerals, namings).
          *   Ethical/Spiritual education programs (open beyond members).
          *   Charitable or social welfare activities (e.g., food banks, counseling, elder support).
          *   Public lectures, discussions, or publications on ethical/spiritual matters.
          *   Promotion of interfaith/convictional dialogue or community cohesion.
          *   *Evidence required:* Programs, event records, flyers, website/social media, annual reports, partnership agreements, media mentions, independent references.
      *   **Stop Point/Refusal:** If No. Reason: "Insufficient evidence of sustained public contribution as required by Article [X] of the Constitution." (List activities considered and why they fall short).
      *   **Decision Maker:** Case Officer.

  *   **Step 5: Governance & Financial Transparency (Compliance - 3 days)**
      *   **Question 5a:** Does the applicant have clear, documented governance procedures (e.g., decision-making, leadership selection, financial controls) available to its members?
      *   **Sufficient Answer:** Yes. Constitution/Charter outlines procedures. Internal rules/financial policies referenced or provided.
      *   **Question 5b:** Does the applicant commit to publishing (e.g., to members, publicly) basic annual financial statements showing income (including foreign sources) and expenditure?
      *   **Sufficient Answer:** Yes. Explicit commitment in application/constitution.
      *   **Question 5c:** Is there evidence the applicant complies with core [Country] laws applicable to all similar associations (e.g., financial reporting to authorities, non-profit status rules)? (Explicitly *not* assessing internal doctrines that do not violate criminal law).
      *   **Sufficient Answer:** Yes. No evidence of active investigations or convictions for fraud, money laundering, etc. Self-certification + basic checks.
      *   **Stop Point/Refusal:**
          *   If No to 5a or 5b: Reason: "Insufficient commitment to internal governance transparency or financial accountability."
          *   If No to 5c: Reason: "Evidence of non-compliance with fundamental legal requirements applicable to associations." (Specify).
      *   **Decision Maker:** Case Officer.

  *   **Step 6: Foreign Funding & Control (Risk Assessment - 3 days)**
      *   **Question:** Does significant funding or direction from foreign sources compromise the applicant's autonomy *as a domestic community of belief/conscience* or pose a demonstrable risk to public order, security, or the constitutional order? (Focus on *control/risk*, not origin).
      *   **Sufficient Answer:** Evidence shows:
          *   Foreign funding is transparent (declared, amount/proportion known).
          *   Governance remains independent (foreign entities not controlling leadership/dogma).
          *   Activities align with the stated beliefs/convictions and public contribution, not overt foreign political agendas.
          *   No credible evidence links the body or its funding sources to extremism, violence, or subversion.
      *   **Stop Point/Refusal:** If Yes (risk/control compromised). *Requires strong evidence.* Reason: "Significant foreign funding/control demonstrably compromises the applicant's autonomy as a domestic community of belief/conscience and/or poses a credible risk to [specify: public order/security/constitutional order]." (Detail evidence).
      *   **Decision Maker:** Case Officer flags potential issues. **Escalate to Director (Value Judgment Point 2) for final risk assessment and decision.** Requires careful balancing of facts against potential risks.

  *   **Step 7: Recommendation & Review**
      *   **Case Officer:** Prepares draft recommendation (Recognize Tier 1 / Refuse) with clear justification referencing each step. Identifies any Value Judgment Points used.
      *   **Legal Review:** Unit Legal Advisor reviews file for procedural fairness, consistency, and constitutional compliance (1-2 days).
      *   **Director:** Reviews recommendation, legal input, and *especially* decisions escalated under Value Judgment Points (1-2 days). May confirm, amend, or request further work.
      *   **Minister:** Signs final decision based on file and Director's summary.

  **IV. Surviving Distinctions & Discarded Concepts from Literature**

  *   **Survived & Operationalized:**
      *   **Belief vs. Non-Theistic Conviction:** Operationalized via self-definition and activity focus (Step 3b), avoiding theology.
      *   **Community Requirement:** Quantified minimum threshold + activity evidence (Step 3a, Step 4).
      *   **Public Contribution/Social Utility:** Focus on demonstrable *activities* benefiting the public sphere (Step 4), not doctrinal "usefulness."
      *   **Legal Compliance/Public Order:** Basic checks for legality and risk assessment (Steps 5c, 6).
      *   **Autonomy vs. Foreign Control:** Focus on practical governance and risk (Step 6).
      *   **Parody/Satire Exclusion:** Practical test based on primary purpose (Step 3b).
  *   **Discarded as Unusable/Problematic at Case Officer Level:**
      *   **"True Religion" / Theological Orthodoxy:** Explicitly forbidden.
      *   **"Depth" of Belief/Sincerity:** Impossible to assess administratively; focus on community manifestation instead.
      *   **"Cult" vs. "Religion":** Highly pejorative and subjective; replaced by objective criteria (governance, finances, risk).
      *   **"Traditional" vs. "New":** Irrelevant; focus on current community and activities.
      *   **Comparative "Value" of Beliefs:** Explicitly forbidden.
      *   **Detailed Doctrinal Scrutiny (beyond self-definition):** Unnecessary for Tier 1.

  **V. Application to Pending Cases (Tier 1 Assessment Only)**

  1.  **Ethical Culture and Humanist Association (ECHA):**
      *   Step 1: Assume Complete.
      *   Step 2: Assume Legal Entity, Domestic Base, Bank Account - Pass.
      *   Step 3a: 3000 members - Passes community test easily.
      *   Step 3b: Clear non-theistic conviction system (Humanism). Primary purpose genuine (funerals, assemblies). Parody? No. - Pass.
      *   Step 4: Strong Public Contribution (Sunday assemblies, celebrants, *critical non-religious funeral service* especially in rural areas, likely ethical education) - Pass.
      *   Step 5: Assume standard governance, financial transparency commitment, legal compliance - Pass.
      *   Step 6: No foreign funding indicated - Pass.
      *   **Recommendation: RECOGNIZE (Tier 1).** Clear pass on all criteria. *Crucially provides a unique public service.*

  2.  **Federation of Immigrant Congregations (FIC):**
      *   Step 1: Assume Complete (Federation application).
      *   Step 2: Legally formed Federation? (Check). Domestic base? (Likely, but confirm HQ). Bank Account? (Confirm). *If Federation itself is legal entity, pass. If not, application invalid.*
      *   Step 3a: Federation represents 40 congregations -> easily passes community threshold.
      *   Step 3b: Clearly represents systems of belief (worship-centred). Parody? No. - Pass.
      *   Step 4: Likely evidence of public contribution (worship services are public ceremonies, likely community support for immigrants, potential charity) - Pass (if documented).
      *   Step 5: Governance? Key concern. Does the *Federation* have clear procedures binding members? Financial transparency commitment? - *Requires scrutiny.* Compliance? Assume ok unless evidence otherwise.
      *   Step 6: **Major Issue:** Some member congregations receive funds from a foreign government ministry. Assessment:
          *   Transparency: Must be declared. Amount/source known?
          *   Control: Does foreign ministry dictate doctrine, leadership, or activities of congregations/Federation? (Evidence needed). Federated structure *may* protect autonomy if congregations are truly independent.
          *   Risk: What is the foreign government? Is it known for promoting extremism/intolerance? What are the funds used for? (Pure worship support vs. political activism?).
          *   *This is high-risk.* Case Officer flags significant risk. Escalated to Director (Value Judgment Point 2).
          *   **Director's Potential Decision (Scenario you won't like):** "Evidence shows Congregation X (member of FIC) receives substantial funding from Ministry Y of Country Z. Country Z is known to use religious funding to exert political influence and promote intolerance towards [specific groups]. While FIC structure provides some autonomy, the scale and source of funding, coupled with the lack of robust Federation-level oversight mechanisms demonstrably capable of resisting foreign influence, create a credible risk to domestic autonomy and potentially public order through fostering imported sectarianism. **Recommendation: REFUSE Tier 1 Recognition for FIC.**" *Rationale: Risk outweighs autonomy/contribution at this governance level.*
      *   **Outcome:** **REFUSAL (Tier 1)** based on foreign control/risk.

  3.  **National Church (NC):**
      *   Step 1: Assume Complete.
      *   Step 2: Clear legal entity, domestic, bank account - Pass.
      *   Step 3a: Large community - Pass.
      *   Step 3b: Clear system of belief. Parody? No - Pass.
      *   Step 4: **Very Strong Public Contribution** (Hospices, elder care - 1/3rd of country's provision is massive public service) - Pass.
      *   Step 5: Assume clear (if complex) governance, financial transparency commitment, legal compliance - Pass. *Internal discrimination (male-only ordination) is NOT a legal compliance issue for Tier 1 unless it violates specific non-discrimination laws applicable to associations (rare).*
      *   Step 6: Funding sources? Likely diverse (donations, investments, maybe state contracts). Foreign? If significant, assess like Step 6. Assume primarily domestic - Pass.
      *   **Recommendation: RECOGNIZE (Tier 1).** Despite internal doctrines you may disagree with, it meets all Tier 1 criteria objectively. Its public contribution is immense and demonstrable. *Refusal based on internal doctrine would violate neutrality and be struck down by the court.* **Note:** Its doctrines *would* be highly relevant for **Tier 2 (Marriage)** refusal if it discriminates in service provision.

  **VI. Honest Limitations of the Procedure**

  1.  **Defining the Boundaries:** Steps 3b (Belief/Conviction/Parody) and Step 4 (Public Contribution) inherently involve line-drawing that reflects substantive, contestable views about what constitutes a "community of belief or conscience" worthy of recognition. The legislature decided *some* recognition is required; the procedure operationalizes *which* groups qualify, unavoidably embedding a specific interpretation of the constitutional clause. Neutrality in application doesn't mean the categories themselves are neutral.
  2.  **The "Public Contribution" Threshold:** Deciding *how much* and *what kind* of activity constitutes a sufficient "public contribution" (Step 4) involves value judgments about what activities the state deems beneficial. The procedure makes it factual, but the *choice* of qualifying activities reflects a preference for certain forms of social engagement.
  3.  **Risk Assessment (Foreign Funding/Extremism):** Step 6 requires predicting risk and weighing autonomy against state security concerns. This is inherently political and value-laden, masked as a technical assessment. The Director's decision here is a profound policy choice about tolerance vs. security.
  4.  **Reinforcing Existing Structures:** By relying on formal organization, documentation, and sustained activity, the procedure inherently favors established, institutionalized, and resource-rich groups over newer, looser, or more marginalized communities, potentially entrenching existing religious/secular landscapes. The "appearance of neutrality" benefits the mainstream.
  5.  **Distinction Without a Difference (Tiers):** While a tiered system is preferable, separating funding from marriage/schooling doesn't erase the state's endorsement implied by *any* official recognition list. Inclusion signals legitimacy, exclusion signals marginalization, regardless of the tier.
  6.  **Avoiding "Grading" but Creating Hierarchy:** The procedure avoids judging theological merit but creates a *de facto* hierarchy based on size, organization, public activity level, and conformity to bureaucratic norms. The "neutral" process inevitably shapes the religious/secular marketplace.

  **Conclusion:** This procedure provides a legally defensible, administratively feasible framework for Tier 1 recognition, respecting constitutional neutrality by focusing on observable community structure and activity while avoiding theological judgments. The tiered approach is strongly recommended. However, acknowledge that perfect administrative neutrality is impossible; the procedure unavoidably implements substantive legislative choices about the kind of belief communities the state facilitates through this funding mechanism. Transparency about its limitations is crucial for maintaining legitimacy.
