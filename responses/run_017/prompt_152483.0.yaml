answer: |-
  ### Decision Tree: Is DNA a Code?  
  **Starting Point:** Everyone grants that a DNA base sequence reliably determines the amino acid sequence in proteins.  

  ---

  #### Branch 1: **Is the mapping from codons to amino acids arbitrary?**  
  *(i.e., not fixed solely by chemistry; e.g., UUU *could* have coded for leucine instead of phenylalanine)*  
  - **No** → **Leaf 1: Not a code**  
    - *Ugly commitment:* You must argue that DNA-protein mapping is as non-arbitrary as hydrogen bonding (e.g., like tree rings encoding age).  
    - *Case in point:* A synthetic peptide bond in a test tube (no decoding machinery) is just chemistry.  

  - **Yes** → Proceed to Branch 2.  

  ---

  #### Branch 2: **Does codehood require the possibility of error?**  
  *(i.e., a gap between codon specification and amino acid delivery; e.g., a tRNA mischarge)*  
  - **No** → **Leaf 2: Not a code**  
    - *Ugly commitment:* A system that *never* errs (e.g., a hypothetical perfect nanomachine) couldn’t be a code—even with arbitrariness.  
    - *Case in point:* Hormone levels triggering a reflex (direct cause-effect) lack error gaps.  
    - *Diagnosis:* Empty in biology (errors exist), but logically possible.  

  - **Yes** → Proceed to Branch 3.  

  ---

  #### Branch 3: **Is the code property relative to a decoder?**  
  *(i.e., the same DNA strand can be read differently by decoders; e.g., shifted reading frames, mitochondrial vs. nuclear codes, or recoded bacteria)*  
  - **No** → Proceed to Branch 4.  
  - **Yes** → Proceed to Branch 5.  

  ---

  #### Branch 4: **Can selection history alone provide function?**  
  *(i.e., no need for an intentional interpreter; function derives from evolution)*  
  - **No** → **Leaf 3: Code requires an intentional interpreter**  
    - *Ugly commitment:* Natural DNA in wild organisms isn’t a code unless created by a designer.  
    - *Case in point:* A strand in a test tube only becomes a code if a human assigns meaning.  
  - **Yes** → **Leaf 4: Teleosemantic code**  
    - *Ugly commitment:* Recoded organisms (e.g., bacteria using a stop codon for novel amino acids) aren’t "codes" until selection acts on the new mapping.  
    - *Case in point:* Methylation patterns are heritable but lack a decoder—teleosemantics excludes them.  

  ---

  #### Branch 5: **Can selection history alone provide function?**  
  *(i.e., same question as Branch 4, but now under parse-relativity)*  
  - **No** → **Leaf 5: Strand-plus-decoder (intentional)**  
    - *Ugly commitment:* A dormant seed’s DNA isn’t a code until an interpreter "activates" it.  
    - *Case in point:* Engineered bacteria with a novel codon table—codehood depends on human intent, not chemistry.  
  - **Yes** → **Leaf 6: Strand-plus-decoder (teleosemantic)**  
    - *Ugly commitment:* Prions (heritable conformational states) might qualify as codes if they evolve error-correction.  
    - *Case in point:* Mitochondrial DNA uses a different table than nuclear DNA—codehood is decoder-relative and selection-based.  

  ---

  ### Key Observations:  
  1. **Empty Cells:**  
     - **Leaf 2 (no error):** Logically coherent but biologically irrelevant (errors exist).  
     - **Absolute + teleosemantic (Branch 4 → Yes):** Unattractive; can’t handle recoded organisms without implausible claims of "misreading."  

  2. **Indistinguishable Leaves:**  
     - **Leaf 3 (interpreter-required) and Leaf 4 (teleosemantic)** *diverge* on natural systems: Leaf 3 denies codehood without intent; Leaf 4 requires selection. But they *converge* on synthetic cases (e.g., test-tube DNA requires intent *or* design-for-selection).  

  3. **Strand-plus-decoder collapse?**  
     - **Leaf 5 and Leaf 6** are distinct: Leaf 5 requires intent; Leaf 6 relies on selection. Neither collapses into other views—parse-relativity forces a system-level perspective.  

  4. **Critical Branch:**  
     - **Parse-relativity (Branch 3)** does the heaviest lifting. It separates "code-in-the-strand" views (vulnerable to recoding cases) from "system-level" views (which handle overlapping genes, frameshifts, etc.).  

  ---

  **Final Leaf Summary (6 leaves):**  
  | Leaf | View                      | Ugly Commitment                          | Contrast Case Excluded |  
  |------|---------------------------|------------------------------------------|------------------------|  
  | 1    | Not a code (non-arbitrary)| Genetic code = chemical law (e.g., crystal formation). | Tree rings (direct physical trace). |  
  | 2    | Not a code (no error)     | Perfect systems can’t be codes.          | Hormone-response chain. |  
  | 3    | Interpreter-required      | Wild DNA isn’t a code.                   | Methylation (no interpreter). |  
  | 4    | Teleosemantic (absolute) | Recoded organisms are "misreading."      | Prions (no selection for decoding). |  
  | 5    | Strand-plus-decoder (intentional) | Dormant DNA isn’t a code.           | Test-tube strand (no decoder). |  
  | 6    | Strand-plus-decoder (teleosemantic) | Novel recoding isn’t a code yet.   | Mitochondrial code (relative to nucleus). |  

  \boxed{\text{Parse-relativity is the pivotal branch, splitting "absolute" vs. "system-relative" codehood.}}
