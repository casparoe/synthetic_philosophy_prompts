  **Node 4:** The risk number you assign will affect the patient's behavior (e.g., a high number might motivate them to exercise, lowering their actual risk). Do you assign the number that will motivate the best outcome or the one that best reflects the current state?
  - If you choose to influence behavior, go to **Leaf D: Unnamed (pragmatic instrumentalism)**. Awkward commitment: The probability is not a fact about the world but a tool for intervention, so truth and usefulness can diverge.
  - If you stick to the current state, go to Node 6.

  **Node 5:** The statistics come from a model trained on a population different from the patient (e.g., another country). Do you still use the model's output for the patient?
  - If yes, because the model captures the true biological risk (the propensity), go to **Leaf E: Propensity (single-case chance)**. Awkward commitment: Even if the model is wrong due to training on a different population, the propensity is still there, but we might not know it.
  - If yes, because it is the standard deployed model (regardless of population differences), go to **Leaf I: Model-based operationalism**. Awkward commitment: The probability is defined by the model and training data, so if the model changes, the probability changes without any change in the patient.
  - If no, because the model is not validated for this population, and you use broader data from the patient's population, go to **Leaf F: Objective Bayesianism (Maximum Entropy)**. Awkward commitment: You must assign a probability based on all available evidence, even if it is very broad and might not reflect the individual's true risk.

  **Node 6:** In the behavioral response scenario, you are aware that the patient's risk will change in response to the number you give. Do you account for this dynamic when assigning the risk?
  - If no, you assign the risk based on the current state (ignoring future changes), go to **Leaf G: Classical/Indifference view**. Awkward commitment: The probability might not reflect the actual outcome because the act of assigning it changes the world.
  - If yes, you believe the risk must account for the feedback loop (so it depends on how you assign it), go to **Leaf H: Pluralism**. Awkward commitment: There is no single correct probability; the number depends on how you set up the reference class (e.g., including or excluding the behavioral response).

