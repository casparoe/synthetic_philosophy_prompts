  - If you choose the aggregate (because it's the overall population rate), go to **Leaf B: Frequentism (wide reference class)**. Awkward commitment: You ignore known risk factors that are statistically relevant, which might lead to less accurate predictions.

  **Node 3:** You are considering a genetic marker that increases risk. The marker was unknown at the time the patient had to make a decision (but now you know). Should the risk assessment at the time have ignored the marker (using only what was known then) or should the current assessment (with the marker) be considered the true risk at that time?
  - If you use what was known then, go to **Leaf C: Subjective Bayesianism**. Awkward commitment: Two people with the same evidence but different prior beliefs might assign different risks, and both are "correct."
