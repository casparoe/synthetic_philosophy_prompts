    - **Event A**: Die shows 1 or 2.
    - **Event B**: Die shows 3 or 4.
    - **Event C**: Die shows 5 or 6.
    - **Event D**: Die shows 1, 2, or 3 (overlaps with A and B).

  ---

  ### **Setup (10 min)**
  1. **Recap Dutch books** (5 min):  
     - "You post prices for tickets paying 100 chips if an event happens. I, the bookie, choose to buy/sell. Incoherent prices let me force a sure loss."
     - Clarify key terms: *sure loss* (visible upfront), *Dutch strategy* (loss on every branch, hidden initially), *Czech book* (probabilistic loss).
  2. **Rules & Roles** (5 min):
     - **Sharp bettors (7 students)**: Must post **one price** per event (e.g., "A: 40 chips"). Must accept any buy/sell at that price.
     - **Spread bettors (7 students)**: Post **two prices** per event (buy max, sell min; e.g., "A: buy≤35, sell≥45"). Can **pass** if the bookie's offer is strictly inside the spread.
     - **Chip rules**: 
       - Stakes in whole chips (no fractions).
       - Bookie has **exposure cap: 50 chips** (max total payout risk).
     - **Instructor**: Acts as the bookie, exploits incoherences.

  ---

  ### **Round 1: Demonstrable Sure Loss (20 min)**
  **Goal**: Experience (i) and see sharp bettors fail, while spread bettors escape via spreads.  
  **Event**: Bet on **A, B, and D** (D = A∪{3}, so P(D) should = P(A) + P({3})).  
  1. **Price Posting** (5 min):
     - Students write prices on index cards (sharp: one number; spread: two numbers).
     - *Induce incoherence*: Suggest P(A) + P(B) ≠ P(D) (e.g., Sharp: A=40, B=40, D=70; Spread: A=[30,50], B=[30,50], D=[65,75]).
  2. **Bookie Exploits** (10 min):
     - **Sharp bettor example**:  
       - Bookie *sells* D at 70 (bettor pays 70), *buys* A at 40 (bookie pays 40), *buys* B at 40 (bookie pays 40).  
       - Net: Bookie gains +70 -40 -40 = **−10 chips** (sure loss for bettor).  
       - Show loss on board: If 1/2 (A), bookie pays 100 for A, but holds D (pays 100) → net 0. Similar for B. If 3 (D only), bookie pays 100 for D. Bettor always loses 10 chips.
     - **Spread bettor example**:  
       - Bookie tries to sell D at 68 (between 65–75? Rejected). Buy A at 32? Rejected. No bet placed!  
       - *Debate*: "Is this incoherence exploitable? Why not?"
  3. **Settle & Discuss** (5 min):
     - Roll die. Sharp bettor loses 10 chips regardless. Spread bettor loses nothing.  
     - **Key point**: Spreads block (i), but incoherence remains. Exposure cap/granularity matter (e.g., if loss was 0.5 chips, no exploit).

  ---

  ### **Round 2: Dutch Strategy (Branch Loss) (25 min)**
  **Goal**: Experience (ii) with sequential bets (loss on every branch, but hidden at first).  
  **Events**: Two coin flips (simulate with die: 1–3 = heads ⚪, 4–6 = tails ⚫).  
  1. **Price Posting** (5 min):
     - All students post for:
       - **1st flip heads (X)**: Sharp (e.g., 50), Spread (e.g., buy≤45, sell≥55).
       - **2nd flip heads given 1st heads (Y|X)**: Sharp (e.g., 60), Spread (e.g., buy≤55, sell≥65).
     - *Incoherence*: P(Y|X) ≠ P(Y) (e.g., P(Y|X)=60, but fair=50).
  2. **Bookie Strategy** (15 min):
     - **Step 1 (t=0)**: Bookie *buys* "X and Y" ticket from bettor (e.g., at P(X)×P(Y|X)=30 for sharp).  
       - *Spread challenge*: If spreads block, bookie passes. Sharp bettors accept.
     - **Step 2 (t=1, after 1st flip)**:
       - *If X occurs*: Bookie *sells* "Y" ticket at P(Y|X)=60.  
       - *If ¬X occurs*: No further action.  
     - **Outcomes** (roll die twice):
       - **X and Y**: Bettor pays 100 for Y, but holds "X and Y" (pays 100) → net 0. But bookie profited 30 (t=0) - 60 (t=1) + trades = **loss for bettor**.
       - **X and ¬Y**: Bookie keeps 30 (t=0) + 60 (t=1). Bettor pays 60, gets 0 → **loss**.
       - **¬X**: Bookie keeps 30. Bettor loses 30.  
       - *Show*: Loss on every branch, but not demonstrable at t=0.
  3. **Reveal and Discuss** (5 min):
     - "Why wasn’t this loss visible upfront? How do spreads help avoid it?"  
     - **Key point**: Dutch strategies exploit conditional incoherence dynamically. Spreads block if they avoid critical prices.

  ---

  ### **Round 3: Czech Book (Probabilistic Loss) (20 min)**
  **Goal**: Experience (iii) and see limits of granularity/caps.  
  **Event**: Bet on **C** (die=5/6; P(C)=1/3) and **¬C** (P=2/3).  
  1. **Price Posting** (5 min):
     - Students post for C and ¬C.  
     - *Incoherence*: Sharp: C=40, ¬C=50 → P(C)+P(¬C)=90 < 100. Spread: C=[35,45], ¬C=[45,55].
  2. **Bookie Exploits** (10 min):
     - **Sharp bettor**:  
       - Bookie *buys* C at 40, *buys* ¬C at 50. Net: -90.  
       - Outcome: C or ¬C pays 100 → bookie gains 100 - 90 = **+10 chips**.  
       - *But*: Loss is *probabilistic* (if die=7, bettor wins; but P(die=7)=0).  
     - **Spread bettor**:  
       - Bookie *tries* to buy C at 42 (within [35,45]? Accepted). Buy ¬C at 48? Rejected (outside [45,55]).  
       - Bookie holds C at 42. If C occurs, pays 100 → loss 58. If ¬C, bookie keeps 42.  
       - *Incoherence*: P(¬C) not exploited due to spread/granularity.  
     - **Cap/granularity twist**:  
       - If sharp bettor posts C=33.3̅, ¬C=66.6̅ (incoherent by 0.1̅), but chips are whole. Bookie *can’t exploit* (stakes scale to 3x: C at 100, ¬C at 200 → exposure=300 > cap).
  3. **Settle & Discuss** (5 min):
     - Roll die. Sharp bettor loses 10 chips (P=1), but "certainty" relies on P(die=7)=0.  
     - **Key point**: (iii) is a P=1 loss, not logical certainty. Spreads/caps/granularity block small/risky exploits.

  ---

  ### **Debrief (15 min)**
  1. **Map Experiences**:
     - **Round 1**: Sure loss (i) for sharp bettors → demonstrable pre-resolution.
     - **Round 2**: Dutch strategy (ii) → loss on every branch, hidden at t=0.
     - **Round 3**: Czech book (iii) → P=1 loss, but not certain (relies on resolution).
  2. **Spanner in the Works**:
     - **What broke?** Classic Dutch books assume:
       - Point-valued prices (spreads avoid this).
       - No stake granularity (whole chips prevent exploiting small incoherences).
       - No exposure caps (limits prevent large-stakes exploits).
       - "Be a probabilist or else" → becomes "be coherent *enough* for your stakes and risk tolerance."
     - **What survives?** A graded claim: Incoherence *enables* exploitation *if* spreads are narrow, stakes are scalable, and caps allow it.
  3. **Limitations of the Activity**:
     - **Rationality gap**: The game shows *vulnerability*, not irrationality (students might say: "I accepted risk!").
     - **Finite resolution**: Czech books feel like sure loss in practice (no die=7). True non-certainty requires infinite cases (not feasible here).
     - **Other gaps**: Sequential Dutch strategies assume no price updates (real agents might learn). Also, no counterfactual betting ("what if I’d bet more?").

  ---

  ### **What Might Go Wrong (and Fixes)**
  1. **Students post coherent prices**:
     - *Fix*: Secretly prompt 2–3 sharp bettors to use P(A)=40, P(B)=40, P(D)=70. For spreads, suggest P(A)=[25,35], P(B)=[25,35], P(D)=[65,75].
  2. **Math takes too long**:
     - *Fix*: Pre-calculate 1–2 exploit paths. Use student "assistants" to manage chip exchanges.
  3. **Spread bettors set narrow spreads**:
     - *Fix*: Allow bookie to "bargain" (e.g., "I’ll buy A at 33, last offer!") to show critical boundaries.
  4. **Cap/granularity undermines the point**:
     - *Fix*: In Round 3, contrast a sharp bettor with P(C)=34, P(¬C)=66 (exploitable) vs. P(C)=33, P(¬C)=66 (inexploitable due to granularity).

  ---

  ### **Timeline Summary**
  - **0:00–0:10**: Intro + setup.
  - **0:10–0:30**: Round 1 (sure loss).
  - **0:30–0:55**: Round 2 (Dutch strategy).
  - **0:55–1:15**: Round 3 (Czech book).
  - **1:15–1:30**: Debrief.

  This plan ensures all 14 students engage actively, hits your three target concepts, and exposes the Dutch book’s hidden assumptions through hands-on failure. No prep needed beyond materials listed!
