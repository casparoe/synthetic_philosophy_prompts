prompt: |-
  I sit on a small advisory group that serves two very different clients — a constitutional-drafting commission currently rewriting its amendment rules and debating whether to entrench certain provisions against ordinary majorities, and a hospital ethics committee that is repeatedly asked whether to honour a psychiatric advance directive written during remission — and the group keeps talking past itself, because each member is working from a different picture of what makes an earlier self's constraint on a later self genuinely binding. Rather than sample more of the literature, I want the specification first. Please write the desiderata: what any adequate account of precommitment validity has to deliver, in a form that could actually be used to advise a drafter or a clinician on whether to honour a given constraint and how tightly to bind it. For each requirement give the case or consideration that motivates it, and mark which are non-negotiable and which are merely preferences of one camp (a horror of any dead hand at all, say, or the demand that a valid precommitment must be re-authorizable at will).

  The stress set I want the requirements keyed to, at minimum: the plain personal case (the Ulysses contract, addiction, advance directives); the institutional case (entrenchment, unamendable clauses, delegated independence for courts or central banks); the case of a wholly renewed body that inherits the commitment after every member has turned over, with no one left who made or consented to it; the case in which the earlier self precommits not to a fixed outcome but to a procedure for periodic re-authorization — a rolling Ulysses contract — and that procedure's gatekeepers themselves drift or are captured; the case of literal compliance that defeats the point of the constraint; and the case of the guardian, since any enforcement mechanism is itself an agent that can defect, so the account owes something about what binds the enforcer rather than pushing the problem up one level forever.

  Three things matter most to me. First, the account must be able to distinguish a motivated repeal from a justified one — the case where the later self or later majority wants out because the constraint is working exactly as designed, from the case where circumstances have genuinely changed — and I suspect this desideratum is in tension with the requirement that the test not defer to the judgement of the very agent whose judgement is in question; call it the diagnostic circularity, and tell me whether it is escapable or only manageable. Second, I want a desideratum about calibration: that the barrier to reversal track the expected cost of each kind of error rather than the intensity of the pressure to reverse, which is the only signal actually observable. If that pair cannot be jointly satisfied, or if any other subset of your list is jointly unsatisfiable, say so plainly — that result is the part I would take away. Third, tell me which single requirement excludes the largest share of candidate theories, and which requirement, if dropped, would make the whole exercise collapse into something trivially satisfiable. A short scorecard at the end is fine: three families only, described rather than attributed — the view that ties bindingness to the earlier self's authorization, the view that ties it to whether the constraint still serves the values that justified it, and the view that treats it as a matter of aggregating the interests of earlier and later selves across time — each graded against the list in a sentence or two, with no bibliography and no proper names I would have to look up.
reasoning: |-
  Okay, let me tackle this user's complex query about precommitment validity. The user sits on an advisory group dealing with constitutional entrenchment and psychiatric advance directives, and needs a framework to evaluate binding constraints across different contexts. 

  First, I need to parse the core challenge: they're stuck because group members have fundamentally different views on what makes earlier decisions binding on later ones. The user explicitly wants desiderata - not literature - that can guide drafters and clinicians. Three aspects are crucial: distinguishing motivated repeals from justified ones, calibrating reversal barriers to error costs, and identifying key theoretical fault lines.

  The stress cases mentioned are critical to cover: personal (Ulysses contracts), institutional (entrenchment), wholly renewed bodies, procedural precommitments with gatekeeper drift, literal compliance defeating purpose, and guardian defection. Each tests different aspects of bindingness.

  Starting with non-negotiable requirements, consent-at-creation seems essential - no constraint should bind without initial voluntary agreement. But this immediately conflicts with the "wholly renewed body" case where original consenting parties are gone. That's why Condition-Disclosure must be non-negotiable too - the earlier self must specify what circumstances would invalidate the constraint.

  The calibration requirement feels particularly thorny. We need reversal barriers that reflect the stakes of bad decisions (false positives vs false negatives) rather than just the volume of repeal pressure. But how to operationalize this? Error-cost asymmetry seems key - for constitutional rights, false non-repeal (keeping bad entrenchment) is worse than false repeal, while for psychiatric directives it's the reverse.

  The diagnostic circularity problem is unavoidable - we can't let the constrained agent self-assess validity without checks. The best we can do is require independent adjudication (Guardian-Accountability) and explicit condition-disclosure to mitigate self-serving judgments.

  When considering which requirement filters most theories, I keep returning to the "wholly renewed body" test. Many accounts fail here - especially those requiring ongoing consent. Value-consistency theories might handle it better if the original values persist institutionally.

  For collapse risks, dropping the non-deference requirement would be fatal. If the later self can always self-certify repeal, precommitments become meaningless theater. The Ulysses contract metaphor only works if the sailors can't untie themselves during temptation.

  On grading families of theories: authorization theories fail the renewal test; value-consistency struggles with changed circumstances; interest-aggregation risks undermining the whole point of precommitment. No approach satisfies all desiderata perfectly - the framework shows why real-world cases require contextual balancing.

  The user's stress cases reveal tensions: a psychiatric directive might satisfy all requirements but still feel wrong if the patient's current self fights it. That's why the calibration principle - weighting error costs differently across domains - becomes the crucial differentiator between constitutional and clinical contexts.
answer: |-
  Here is a specification of desiderata for evaluating precommitment validity, designed for practical application across your cases. Non-negotiable requirements (NN) are foundational; others reflect common tensions. Key tensions and impossibilities are noted.

  **Core Desiderata for Precommitment Validity:**

  1.  **Consent-at-Creation (NN):** *The constraint must have been voluntarily adopted by the bound agent(s) in a state of recognized competence/capacity.*
      *   *Why:* Without initial consent, the constraint is mere imposition (invalidating Ulysses contracts, directives, or constitutions lacking popular ratification). Motivates all cases.
      *   *Stress Test:* Handled by initial adoption. Wholly renewed body inherits an institutionally consented framework.

  2.  **Condition-Disclosure (NN):** *The precommitting self must explicitly define (or rationally imply) the conditions under which the constraint is intended to apply, and crucially, the conditions under which its *overriding or suspension* would be consistent with its original purpose.*
      *   *Why:* Distinguishes justified repeal from motivated defection. The later self cannot be the sole judge of "changed circumstances" without an original benchmark. Motivates distinguishing justified repeal vs. motivated escape (e.g., "only if psychosis returns" vs. "only if new treatment X exists" in a directive; "only if threat Y materializes" for emergency constitutional override).
      *   *Stress Test:* Essential for the diagnostic circularity challenge.

  3.  **Non-Deference (NN):** *Validity assessment cannot *solely* defer to the judgement of the currently constrained self/body regarding the appropriateness of the constraint or the sufficiency of reasons for repeal.*
      *   *Why:* Prevents self-serving invalidation (e.g., a majority abolishing entrenchment because it's inconvenient; a patient in psychosis rejecting their directive). Core to Ulysses, entrenchment, and advance directive cases.
      *   *Tension:* Directly conflicts with the desire of some ("re-authorization at will" camp) for ultimate present-moment autonomy. Creates the diagnostic circularity problem: *Who judges if not the constrained agent?* **This circularity is manageable but not escapable.** Requires independent mechanisms (see Guardian-Accountability).

  4.  **Purpose-Fidelity:** *The constraint remains binding only so long as, and to the extent that, its *specific, articulated purpose* (not just vague values) is still served by adherence, and overriding it would genuinely frustrate that purpose.*
      *   *Why:* Avoids binding to a "dead letter" or defeating the point (e.g., entrenching a clause whose original threat is gone; a directive demanding obsolete treatment). Motivates justified repeal due to changed circumstances.
      *   *Preference:* Favored by "values/functionality" camps. Opposed by strict "original authorization" views that see purpose as secondary to the prior will.

  5.  **Calibration (Error-Cost Sensitivity):** *The procedural barrier to reversal (e.g., supermajority, independent review, time delay) must be calibrated to the *asymmetric costs* of potential errors:*
      *   *Cost of False Non-Repeal (Type I Error):* Upholding a constraint that *should* be lifted (e.g., obsolete entrenchment, harmful directive due to new treatments).
      *   *Cost of False Repeal (Type II Error):* Repealing a constraint that *should* be upheld (e.g., succumbing to temporary passion/addiction, weakening core rights under transient pressure).
      *   *Why:* Prevents barriers based purely on repeal pressure intensity. Requires assessing *what's at stake* if wrong. High Type II cost (e.g., fundamental rights erosion, self-harm during incapacity) demands higher barriers than high Type I cost (e.g., minor procedural rigidity). Motivates different thresholds for constitutions vs. directives vs. addiction contracts.
      *   *Stress Test:* Key for distinguishing pressure from justification. **Impossibility Note:** Perfect calibration is unattainable; barriers *must* be set prospectively based on expected costs, not observed pressure.

  6.  **Guardian-Accountability (NN for Enforced Constraints):** *Any mechanism (guardian) enforcing the constraint against a resisting bound self must itself be accountable according to rules *separate from and antecedent to* the specific enforcement act, and ideally, subject to the constraint's own reversal procedures.*
      *   *Why:* Prevents guardian defection or tyranny (e.g., a court ignoring clear amendment rules; a hospital ignoring valid revocation clauses; the crew tying Ulysses *too* tightly). Stops infinite regress by grounding the guardian's authority in the *original* precommitment framework's rules.
      *   *Stress Test:* Directly addresses the guardian defection case.

  7.  **Procedural-Integrity (For Procedural Precommitments):** *When binding to a *future procedure* (e.g., periodic re-authorization), the validity of the *outcome* of that procedure depends on the procedure itself adhering to its *original* design and purpose, not on the substantive outcome. Significant drift or capture invalidates the procedure's authority under the precommitment.*
      *   *Why:* Prevents a "rolling Ulysses" from becoming meaningless if gatekeepers become hostile to the constraint's purpose (e.g., a captured review board always recommending directive suspension).
      *   *Stress Test:* Addresses gatekeeper drift/capture in procedural precommitments.

  8.  **Literal-Compliance Check:** *The constraint must be interpreted and applied in a way that fulfills its *purpose*, not just its literal wording, especially if literal compliance would defeat its aim.*
      *   *Why:* Avoids self-defeating outcomes (e.g., a directive refusing "antipsychotics" interpreted to exclude newer, safer drugs in the same class; an entrenched clause interpreted so rigidly it causes constitutional collapse).
      *   *Stress Test:* Addresses literal compliance defeating the point.

  **Key Tensions & Impossibilities:**

  *   **Diagnostic Circularity (Non-Deference vs. Agent's Perspective):** This tension is **inescapable but manageable**. You *cannot* let the constrained agent be the sole judge (Non-Deference), but you *cannot* completely ignore their perspective on circumstances (Purpose-Fidelity). **Management requires:**
      1.  **Condition-Disclosure (NN):** Provides an objective(ish) benchmark set by the earlier self.
      2.  **Independent Assessment:** Utilizing the original framework (Guardian-Accountability, Procedural-Integrity) or pre-defined neutral criteria/processes.
      3.  **Calibration:** Higher barriers when the risk of self-serving repeal is high (high Type II cost).
  *   **Calibration vs. Observable Signal:** **Impossible to satisfy perfectly.** Barriers *must* be set prospectively based on *expected* error costs (Type I vs. Type II). Once set, they *will* sometimes be too high (blocking justified repeal under high pressure) or too low (allowing defection under lower pressure than expected). The desideratum demands the *design process* focuses on cost asymmetry, not pressure mitigation.
  *   **Purpose-Fidelity vs. Strict Authorization:** These are often in conflict. Strict authorization views see the prior will as binding regardless of current purpose. Purpose-Fidelity views see the purpose as the core, making the constraint void if the purpose is extinct. This is a core philosophical divide reflected in the camps.

  **Filtering & Collapse:**

  *   **Most Excluding Requirement:** **The "Wholly Renewed Body" test combined with Non-Deference and Consent-at-Creation.** Theories relying on *ongoing* consent or identification with the original author (e.g., strong Lockeanism, some Parfitian views) fail here. How can individuals who never consented be bound by a dead person's/majority's will *unless* the bindingness stems from the institutional role/commitment itself and its ongoing purpose/value?
  *   **Requirement Whose Drop Causes Collapse:** **Non-Deference.** If you drop this, the constrained agent can always declare repeal justified ("circumstances changed!"), rendering *any* precommitment merely provisional and defeating its core function (Ulysses untying himself when the Sirens sing). The exercise becomes trivial: "Honor it until the bound self doesn't want it anymore."

  **Theoretical Family Scorecard:**

  1.  **Original Authorization Primacy:** Bindingness stems solely from the fact of prior voluntary commitment by the bound agent(s). (e.g., Classical Contractarianism, Strong Originalism).
      *   *Score:* Excels at Consent-at-Creation & Non-Deference. Fails Purpose-Fidelity, struggles mightily with Wholly Renewed Body and Calibration (focuses on will, not consequences). Vulnerable to Literal-Compliance defeating purpose. Needs strong Guardian framework.
  2.  **Purpose/Value Consistency:** Bindingness depends on the constraint continuing to effectively serve its original justifying purpose/core values. (e.g., Functionalist Constitutions, Best-Interpretation of Self).
      *   *Score:* Excels at Purpose-Fidelity, Condition-Disclosure (interpreting triggers), Literal-Compliance Check, and handling Wholly Renewed Body (if values persist). Struggles with Non-Deference (who judges purpose/value consistency?) and Calibration (focuses on current fit, not error costs). Risk of guardian overreach.
  3.  **Temporal Interest Aggregation:** Bindingness is a function of balancing the interests/perspectives of the earlier and later selves across time. (e.g., Utilitarian/Prudential views, Some Narrative Identity theories).
      *   *Score:* Potentially strong on Calibration (weighing costs/benefits). Can handle Changed Circumstances. Struggles fundamentally with **Non-Deference** (later self's interests always get a heavy vote) and **Consent-at-Creation** (interests can override initial consent). Makes strong precommitment very difficult, risks trivializing the exercise. Vulnerable to motivated reasoning in "balancing." Guardian role becomes highly discretionary.

  **Use this framework to ask of any specific constraint in either context:** Does it meet the Non-Negotiables (1,2,3,6 if enforced)? How well does its design handle Calibration (5) given the expected error-cost asymmetry? Does it define triggers for override (2)? How is non-deference operationalized (guardian/procedure)? What risks drift (7) or literal defeat (8)? This forces focus on operational design and concrete justification, moving beyond abstract philosophical stalemates.
