prompt: |-
  I am teaching a graduate seminar on population ethics and the long-term future this spring, and I want the first session to be about the standard of assessment rather than about the positions. What I do not have, and would like from you, is the specification: what a normative view in this area has to be able to do in order to count as adequate — the cases it must get right, the distinctions it must respect, the formal and empirical results it must be consistent with — with the case or consideration behind each requirement.

  Fix the purpose, since adequacy is relative to it. The theory is to be good enough for an institution — a large foundation, or a government office setting research priorities — that has to choose now between three kinds of expenditure: causes whose benefits are near-term and comparatively well-evidenced; measures aimed at reducing the risk that human civilization ends prematurely; and measures aimed at improving the character rather than the duration or the existence of the far future. It need not be a complete account of beneficence. It has to rank those three, justify the ranking, and say in what circumstances the right answer is to spend on none of them and leave the money in the bank.

  Give me numbered entries in prose, a paragraph or two each: the requirement first, then the case or consideration that makes it one. Here, roughly, is the material I want worked into the list — but sort it rather than echoing it back. Some of these I suspect are genuine desiderata; some I suspect are the prejudices of one camp; some may not be requirements on a theory at all but requirements on the people using one. Tell me which is which, and why.

  - It should keep separate the good of making the future longer, the good of making it better, and the good of there being a future at all. These come apart: a policy may raise expected welfare conditional on survival while lowering the probability of survival, or extend the future while filling it with less.
  - It should have an answer to the non-identity problem. Long-run policies determine which people exist, so those who exist under them typically cannot have been harmed by them; a theory that needs a complainant either falls silent across most of its domain or has to compare whole histories rather than individuals. Is that silence a defect to be remedied or a feature to be insisted on?
  - It should say something, or explain why it need not, about aggregation: whether the size of a future population is itself a good, and what follows for a very large future of lives barely worth living against a smaller future of flourishing ones.
  - It should be usable under cluelessness. If the sign of an intervention's far-future effects is unknown and the plausible errors are roughly symmetric in magnitude, what does it recommend — and can it say so without treating every inconvenient consequence claim as unknowable and every convenient one as established?
  - It should take a position on Pascalian fanaticism: on whether responsiveness to astronomically large payoffs at very small probabilities is a requirement of rationality or a reductio, and on whether the familiar ways of damping it — probability thresholds, bounded utilities, variance-aversion — are principled or ad hoc.
  - It should say how much rests on the empirical claim that we live at an unusually pivotal moment, a period of elevated risk that will either be survived or not, and what becomes of its recommendations if that claim is false, or merely unverifiable.
  - It should not assume that risk reductions from different sources simply add up. If hazards are correlated — if there are common modes of failure, or if suppressing one raises another — then the ranking of interventions depends on a structure we may not know; and if we do not know it, the theory should say whether the ranking is indeterminate or merely uncertain.
  - It should distinguish, or explain away, two goods that get run together: preserving future people's capacity to determine their own values, and making their lives go well by our present lights. The second appears to license paternalism on an astronomical scale, while the worry about values becoming locked in appears to push hard against it. Can a theory have both?
  - It should state its sensitivity to the scale premise — to the empirical guesses about how many morally significant beings the future could contain — and how much of the case survives a modest rather than an astronomical estimate.
  - It should be such that a generation following it is not required to sacrifice indefinitely for its successors. If the future is enormous and investments compound, the maximizing answer may be that every generation saves nearly everything and consumes nearly nothing: a result no generation has reason to comply with, and one that, if complied with, produces the sacrifice without the benefit. Is avoiding that a real desideratum, or only an admission that we want a comfortable theory?

  Add whatever else belongs on the list; I would rather learn now what I have omitted. Then the two things I care about most. First, if some subset of the requirements cannot be jointly satisfied, say so explicitly and exhibit the tension — the list itself is then the result I want my students to see, so map the incompatibilities. Second, tell me which single requirement excludes the largest number of views people actually hold: the popular longtermist package, its person-affecting and near-termist critics, and the standard maximizing consequentialism both sides tend to fall back on. One closing paragraph showing the list at work is enough. Do not write a scorecard; I will build that with the seminar.
reasoning: |-
  Okay, the user is teaching a graduate seminar on population ethics and the long-term future. They want the first session to focus on the standards for assessing normative views rather than the positions themselves. They provided a list of considerations they want incorporated into a set of requirements for an adequate theory. The theory should help an institution decide between near-term benefits, reducing existential risk, and improving the far future's character.

  First, I need to understand each of the user's bullet points. They mention separating different goods: making the future longer, better, or ensuring it exists at all. The non-identity problem is crucial since future people's identities depend on policies. Aggregation issues like the repugnant conclusion must be addressed. Cluelessness about long-term effects and Pascalian fanaticism with tiny probabilities of huge payoffs are key. The pivotal moment claim, correlated risks, value preservation vs. paternalism, scale sensitivity, and the demandingness problem are also highlighted.

  The user wants a list of numbered requirements, each with a case or consideration explaining why it's necessary. They also want to know if some requirements conflict and which requirement excludes the most existing views. I need to add any missing requirements and clarify which points are genuine desiderata versus prejudices.

  Starting with the separation of goods. It's essential because interventions can affect survival probability, duration, or quality independently. For example, a risky innovation might boost welfare if successful but lower survival chances. A theory must distinguish these to evaluate trade-offs properly.

  Next, the non-identity problem. Since future people wouldn't exist without certain policies, harm-based ethics struggle. Theories must handle this without relying on individual complainants, possibly by comparing entire population states. This is a core challenge in population ethics.

  Aggregation is another key point. Theories need to address whether larger populations are better and handle cases like the repugnant conclusion. This affects decisions between quantity and quality of lives, which is vital for long-term prioritization.

  Cluelessness involves uncertainty about long-term effects. A theory must guide decisions when effects are unpredictable or symmetrically unknowable. It should avoid using cluelessness to dismiss inconvenient truths while accepting convenient ones.

  Pascalian fanaticism deals with tiny probabilities of massive payoffs. A theory must take a stance on whether such considerations are valid or if they lead to absurdities. This impacts how we weigh existential risk interventions.

  The pivotal moment claim is about current high-risk periods. A theory should specify how its recommendations depend on this empirical claim and what if it's false. This avoids over-reliance on contested assumptions.

  Correlated risks require acknowledging that reducing one risk might increase another. Theories must handle uncertainty in risk interactions, affecting how interventions are ranked when risks aren't independent.

  Value lock-in vs. paternalism involves balancing preserving future autonomy versus imposing current values. A theory must navigate this to avoid undue paternalism while respecting future agency.

  Scale sensitivity means the theory's conclusions shouldn't hinge too much on vast future population estimates. It should remain relevant even with more modest numbers, ensuring robustness.

  The demandingness problem addresses whether each generation must sacrifice excessively. A theory that demands near-total saving is impractical. Solutions might include discount rates or agent-relative permissions, but these need justification.

  Now, missing requirements? Perhaps institutional feasibility: the theory must be applicable by real institutions with limited resources and information. Also, intergenerational equity: ensuring fair distribution across time without overburdening any generation.

  Conflicts: Separating goods might clash with aggregation. For example, valuing duration separately could conflict with total welfare maximization. Pascalian fanaticism and cluelessness might conflict; if small probabilities dominate, cluelessness becomes harder to maintain as any action could have huge unseen effects. Demandingness and aggregation might conflict if large future populations require extreme sacrifices, leading to unworkable demands.

  The requirement that excludes the most views is likely Pascalian fanaticism. Longtermists embrace small probabilities of huge impacts, near-termists reject them, and standard consequentialism struggles with unbounded utility functions. This requirement forces a stance that many theories can't accommodate, making it a major divider.

  In the closing paragraph, the list reveals tensions, like between non-identity solutions and demandingness, or fanaticism and cluelessness. Pascalian fanaticism is the key divider, challenging many existing frameworks and highlighting deep methodological splits in the field.
answer: |-
  Here is a structured list of requirements for an adequate normative view in long-term population ethics, tailored to institutional prioritization among near-term benefits, existential risk reduction, and improving the far future's character. Each requirement is justified by a specific case or consideration, with distinctions made between genuine desiderata, potential biases, and user constraints. I've added two missing requirements (#10, #11) and flagged tensions.

  ### Core Requirements:
  1. **Distinguish Survival, Duration, and Quality**  
     *Requirement:* The theory must separately account for (a) increasing the probability of civilization’s survival, (b) extending its duration, and (c) improving the quality of life within it.  
     *Justification:* These goods diverge empirically. A policy (e.g., rapid AI deployment) may raise expected welfare *if* civilization survives (improving quality) while lowering survival probability. Conversely, extending civilization’s duration (e.g., through deep-earth bunkers) might perpetuate a repressive regime (worsening quality). An institution choosing between risk reduction (prioritizing survival) and future-shaping investments (prioritizing quality) needs separable evaluations. *Genuine desideratum; foundational for clear trade-offs.*

  2. **Resolve the Non-Identity Problem**  
     *Requirement:* The theory must assign normative weight to policies that determine who exists, without relying on harm to identifiable future individuals.  
     *Justification:* Most long-term policies (e.g., climate mitigation) create different future populations. If harm requires a worse state for a specific person, these policies evade ethical assessment ("no complainant"). Silence here would paralyze institutional action (e.g., rejecting asteroid defense because "nonexistent people aren’t harmed"). Theories must compare entire population states (e.g., "world A vs. world B") or adopt impersonal goods. *Genuine desideratum; necessary for coherence in the domain.*

  3. **Address Aggregation and Population Size**  
     *Requirement:* The theory must take a stance on whether larger populations are intrinsically valuable and how to weigh quantity against quality (e.g., the Repugnant Conclusion).  
     *Justification:* Institutional decisions hinge on this. If a foundation values total welfare, it might prioritize a vast future of "barely worth living" lives over a smaller flourishing one—affecting investments in space colonization vs. terrestrial utopianism. Avoiding the issue invites arbitrariness. *Genuine desideratum; central to population ethics.*

  4. **Function Under Cluelessness**  
     *Requirement:* The theory must guide decisions when long-term effect signs/magnitudes are unknown and errors are symmetric, without selectively dismissing inconvenient uncertainties.  
     *Justification:* Many interventions (e.g., promoting political decentralization) have unpredictable long-term ripple effects. A theory that demands precise forecasts is useless; one that exploits cluelessness to favor the status quo (or radical change) is biased. Must specify default rules (e.g., precaution, expected value). *Genuine desideratum; essential for real-world application.*

  5. **Take a Stance on Pascalian Fanaticism**  
     *Requirement:* The theory must justify whether astronomically low-probability, high-impact outcomes (e.g., 1e-30 chance of saving 1e30 lives) dominate decisions, and if not, defend its damping method (e.g., probability thresholds, bounded utility).  
     *Justification:* Existential risk reduction often involves tiny probabilities of vast payoffs. If fanaticism is accepted, it swamps other priorities (e.g., near-term aid). Critics call this a reductio (e.g., diverting all resources to mitigating implausible risks). Institutions need principled resolution. *Genuine desideratum; high stakes for resource allocation.*

  6. **Clarify Dependence on the "Pivotal Moment" Claim**  
     *Requirement:* The theory must state how its recommendations rely on the empirical premise that the present has uniquely high leverage over the long-term future (e.g., due to existential risks or value lock-in).  
     *Justification:* If the present isn’t pivotal, existential risk spending may be wasteful. A theory must either defend its sensitivity to this claim (e.g., "if leverage is low, shift funds to near-term causes") or explain why the claim is irrelevant. *Genuine desideratum; avoids overcommitting to contested empirics.*

  7. **Account for Risk Correlations**  
     *Requirement:* The theory must handle interdependencies between hazards (e.g., reducing AI risk might increase bio-risk via redirected research) and specify how uncertainty affects rankings.  
     *Justification:* If risks are anti-correlated, reducing one increases another, potentially reversing intervention rankings (e.g., prioritizing AI safety over pandemic preparedness). Ignoring this leads to inefficient spending. Must distinguish epistemic uncertainty (rankings exist but are unknown) from indeterminacy (no objective ranking). *Genuine desideratum; critical for robust prioritization.*

  8. **Distinguish Value Preservation from Paternalism**  
     *Requirement:* The theory must separate (a) ensuring future beings can autonomously set their values, from (b) imposing current values to improve their lives.  
     *Justification:* "Improving the far future" could mean locking in Enlightenment values (paternalism) or preventing irreversible constraints (e.g., totalitarianism). Conflating these justifies opposing policies—e.g., preserving open institutions vs. promoting specific moral codes. *Genuine desideratum; protects against tyrannical long-termism.*

  9. **Specify Sensitivity to Scale Estimates**  
     *Requirement:* The theory must quantify how its recommendations depend on the size of the potential future population (e.g., 10^12 vs. 10^40 lives).  
     *Justification:* If astronomical scale dominates (e.g., via total utilitarianism), modest adjustments to size estimates dramatically alter priorities. A robust theory should retain justifiable rankings under plausible (non-astronomical) scales. *Genuine desideratum; ensures conclusions don’t rely on speculative extremes.*

  10. **Avoid Unworkable Demandingness**  
     *Requirement:* The theory must not require near-total generational sacrifice (e.g., 99% savings rates) to benefit the far future.  
     *Justification:* Unbounded future populations + compounding returns can imply that every generation must save almost everything—an unsustainable prescription that erodes compliance and wastes welfare. Solutions include discount rates, agent-relative permissions, or saturation points. *Genuine desideratum; a requirement for feasible institutions, not just comfort.*

  11. **Ensure Institutional Tractableability**  
     *Requirement:* The theory must deliver actionable, non-paralyzing guidance under limited information and resources.  
     *Justification:* Foundations/governments face bounded rationality. A theory demanding perfect certainty or endless analysis (e.g., to resolve cluelessness) fails its purpose. Must privilege rules, heuristics, or thresholds. *User constraint; not inherent to ethics but necessary for the context.*

  ### Key Tensions and Incompatibilities:
  - **Non-Identity vs. Demandingness:** Solving non-identity via impersonal goods (e.g., total welfare) often exacerbates demandingness by maximizing future populations. Person-affecting views avoid demandingness but struggle with non-identity.
  - **Fanaticism vs. Cluelessness:** Embracing fanaticism (requirement 5) amplifies cluelessness (4), as unknown effects could be catastrophic or salvific. Rejecting fanaticism demands a principled basis for ignoring tiny probabilities.
  - **Aggregation vs. Value Preservation:** Maximizing aggregate welfare (requirement 3) may endorse value lock-in if it boosts quality/duration, conflicting with preserving future autonomy (8).

  ### The Most Exclusionary Requirement:  
  **Pascalian Fanaticism (#5)** excludes the largest number of extant views:  
  - **Longtermism (common variant):** Embraces fanaticism (e.g., 0.001% risk reduction dominates all near-term aid).  
  - **Near-Termism & Person-Affecting Critics:** Rejects fanaticism as absurd, requiring bounded utility or threshold rules.  
  - **Standard Consequentialism:** Unbounded utilitarianism accepts fanaticism; other forms (e.g., prioritarianism) may reject it but lack consensus.  
  This requirement forces a decisive split on rationality axioms, exposing irreconcilable methodological divides.

  ### Closing Illustration:  
  The list reveals why no theory satisfies all stakeholders. A longtermist total utilitarian might ace #1–3 and #5 but fail #8 (paternalism), #10 (demandingness), and struggle with #4 (cluelessness). A person-affecting prioritarian satisfies #8 and #10 but rejects #2 and #5. An institution using the list identifies tensions early: e.g., if it prioritizes survival (#1) and rejects fanaticism (#5), it must dampen risk estimates but still handle cluelessness (#4) and risk correlations (#7). The result isn’t a scorecard but a map of ethical minefields—precisely what your seminar needs to dissect "adequate" in this thorny domain.  

  **Additions:** I included institutional tractability (#11) and demandingness (#10) as missing practical necessities. The "prejudice" in your material is minimal—only demandingness (#10) might be misconstrued as seeking comfort, but it's a legitimate game-theoretic constraint (no generation benefits from universal compliance).
