  ### Philosophy of Mathematics Decision Tree  
  **Starting Point:** You accept objective mathematical truths (e.g., "no largest prime," "every list has a length") independent of human proof.  

  #### Branch Questions  
  1. **Type-Checking Case**  
     In a dependently typed language, when a list of length 3 is accepted as `Vector String 3` but rejected as `Vector String 4`, does this feel like:  
     - **(A)** Discovering a constraint inherent to *any possible list*?  
     - **(B)** Enforcing a rule *invented by language designers*?  

  2. **Floating-Point Case**  
     Engineers say IEEE-754 floats approximate real numbers. Does the rounding-error gap reveal:  
     - **(A)** An independent structure (the reals) that we *fail to perfectly capture*?  
     - **(B)** A *useful fiction* for organizing measurements, with no "gap" to mind-independent truth?  

  3. **Formal-Verification Case**  
     A team proves a safety property for a distributed protocol, then optimizes the code while preserving behavior. Is the proof:  
     - **(A)** About an *idealized protocol* (distinct from implementations)?  
     - **(B)** Paraphrasable as claims about *concrete code/executions* alone?  

  4. **Infinity Case**  
     "There are infinitely many primes" means:  
     - **(A)** An *actual completed set* of primes exists.  
     - **(B)** Only that *no prime is largest* (no commitment to a "set").  

  5. **Truth Case**  
     "2 + 2 = 4" is:  
     - **(A)** Literally true (like "water is H₂O").  
     - **(B)** A useful shorthand with *no literal truth* (like "sherlock holmes lived in london").  

  ---

