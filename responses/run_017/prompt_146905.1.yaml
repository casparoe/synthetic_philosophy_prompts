answer: |-
  ### Line-by-line Audit
  **(Following your summary's order, unpacking each claim neutrally)**

  1.  **"A philosophical zombie is a molecule-for-molecule copy... all dark inside."**
      *   **Accepted:** This is the standard definition used in philosophy of mind debates. It's a thought experiment, not a claim about actual possibility.
      *   **Restatement Needed:** "Molecule-for-molecule" implies *physical* identity. "Nobody home" means *lacking phenomenal consciousness* (qualia, subjective experience), not necessarily lacking cognition or intentional states (which some might argue require consciousness).

  2.  **"Chalmers's point is simply that such a thing is conceivable..."**
      *   **Contested:** This is the core hinge. Most agree zombies are *prima facie* conceivable (we can form the *idea* without obvious contradiction). The intense debate is whether this conceivability is *ideal* (survives rational reflection) and whether *ideal conceivability entails metaphysical possibility*. Critics (e.g., Dennett, Churchland) argue the conceivability is flawed or illusory. Proponents (Chalmers) argue it *is* ideally conceivable and entails possibility.

  3.  **"...materialism is the thesis that once all the physical facts are fixed, every other fact comes along automatically, by logic alone."**
      *   **Restatement Needed/Criticized:** This defines a *very specific* type of materialism: **logical supervenience materialism.** It claims consciousness logically (or conceptually) supervenes on the physical – meaning the physical facts *entail* the facts about consciousness through pure logic/a priori reasoning. Many physicalists *reject* this definition. They argue consciousness *metaphysically* supervenes on the physical (it *must* exist given the physical base), but this link is *necessary a posteriori* (like water = H₂O), knowable only through empirical investigation, not pure logic. The argument sets up a very narrow target.

  4.  **"So if zombies are possible... materialism is false."**
      *   **Accepted (Conditionally):** *If* zombies are metaphysically possible, *then* this specific "logical supervenience" materialism is false. A physically identical world lacking consciousness shows consciousness doesn't *logically* follow from the physical facts alone.
      *   **Contested:** Whether zombies *are* metaphysically possible (see point 2). Also, whether *all* forms of materialism require logical supervenience (most physicalists say no).

  5.  **"It follows that consciousness is something extra... Descartes gave..."**
      *   **Restatement Needed/Misleading:** While inspired by Descartes' doubt, Chalmers explicitly *rejects* Cartesian substance dualism (mind as a different *stuff*). His conclusion is *property dualism*: consciousness is a fundamental, non-physical *property* or aspect of reality that doesn't logically reduce to the physical. Calling it "in substance the very argument" overstates the similarity to Descartes' substance dualism.

  6.  **"The practical upshot is that consciousness is cut loose from what anything does... may have nothing going on inside."**
      *   **Overstated/Contested:** The argument *suggests* consciousness isn't *logically entailed* by behavior/function. It *doesn't* prove consciousness is "cut loose" in the sense of being causally irrelevant or completely disconnected. Nor does it prove behavior is *no evidence at all*. Most agree behavior is our *primary* (and very strong) evidence for consciousness in others, even if it's not logically conclusive proof against the (likely impossible) zombie scenario. The argument highlights the *epistemic gap* (we can't directly experience another's consciousness), not that behavior is evidentially useless.

  7.  **"The same goes for any view that identifies consciousness with a causal or functional role..."**
      *   **Accepted (Against Strict Functionalism):** The argument *is* a direct challenge to **analytic functionalism** and **logical behaviorism**, which define mental states (including consciousness) purely by their causal roles or dispositions to behave. A zombie *by definition* occupies identical causal/functional roles but lacks consciousness, showing consciousness isn't *identical to* occupying those roles.
      *   **Restatement Needed:** It doesn't refute *all* functionalist views. Some *a posteriori* physicalists might hold that consciousness *is* a specific functional role, but that this identity is necessary a posteriori (like water=H₂O). Zombies challenge the *logical* or *conceptual* identification, not necessarily the metaphysical one known empirically.

  ### What the Argument is Actually Aimed At
  The zombie argument primarily targets **reductive physicalism**, specifically versions claiming that consciousness *logically* or *conceptually* supervenes on the physical (or is logically analyzable in physical/functional terms). It aims to show that consciousness cannot be logically deduced from the complete physical description of the world; there's an "explanatory gap." It's *not* primarily aimed at all forms of materialism/physicalism, nor is it intended to *establish* a specific positive theory (like dualism or Russellian monism) on its own. Its core goal is negative: to show the inadequacy of purely logical/physical explanations of subjective experience.

  ### Settled vs Contested
  *   **Relatively Settled:**
      *   The zombie scenario is *prima facie* conceivable.
      *   *If* zombies are metaphysically possible, then consciousness does *not* logically supervene on the physical.
      *   The argument successfully challenges analytic functionalism/logical behaviorism regarding consciousness.
      *   Behavior is our best evidence for consciousness in others, even acknowledging the epistemic gap.
  *   **Highly Contested:**
      *   Whether zombie conceivability is *ideal* (survives full rational scrutiny).
      *   Whether conceivability (even ideal) entails metaphysical possibility in this specific case (the Kripkean a posteriori necessity objection is central here).
      *   Whether the "logical supervenience" definition of materialism is a fair or relevant target (most physicalists reject it).
      *   Whether the argument refutes *all* forms of physicalism (most physicalists say no, embracing necessary a posteriori identities).
      *   Whether the argument proves property dualism or merely highlights an explanatory gap.

  ### Do the Upshots Survive?
  1.  **"Consciousness is something extra, over and above the physical machinery — in substance the very argument Descartes gave..."**
      *   **Fails to Follow / Needs Extra Premises:** The argument *does* conclude consciousness isn't *logically reducible* to the physical. It does *not*, on its own, establish that consciousness is a non-physical "extra" in the sense of Cartesian substance dualism (which Chalmers rejects). Getting to *any* form of dualism requires the disputed premise that conceivability entails possibility. Getting to Russellian monism requires *completely different* positive arguments. The Cartesian comparison is misleading.

  2.  **"Consciousness is cut loose from what anything does... behavior and function as no evidence at all for consciousness..."**
      *   **Fails to Follow / Overstated:** This is the weakest part of the summary's conclusion. The argument shows consciousness isn't *logically identical* to behavior or functional role. It *does not* show consciousness is causally irrelevant or "cut loose" from behavior. Crucially, **it does not show behavior is *no evidence*.** Even if zombies are *metaphysically possible* (which is hotly contested), in *our* world, consciousness is almost certainly correlated with specific physical/functional states. Behavior remains our *primary and overwhelmingly reliable* (though not logically infallible) evidence for consciousness in others. The argument highlights a *logical* and *epistemic* gap concerning *deductive proof*, not the *evidential value* of behavior in practice. The claim that behavior/function provides *no evidence* is unsupported by the zombie argument alone and contradicts how we actually reason about other minds.
