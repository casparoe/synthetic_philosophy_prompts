prompt: |-
  I'm on a small grantmaking committee — we hand out maybe a dozen grants a year, mostly health and poverty stuff, nothing fancy — and I keep noticing a move in our discussions that I don't have a word for.

  It goes like this. We're comparing two proposals. One is a programme we've funded before, with audits and follow-up data. The other is something new, and somebody says: but we have no idea what the knock-on effects of *that* will be in ten years, so we can't really rank them against each other. And nobody ever says the same thing about the programme we've funded before, even though it's ten-year knock-on effects are just as unmodelable — we simply happen to have decent data on the first eighteen months.

  Two more cases of the same shape. When somebody proposes funding research to work out which causes actually matter, this whole style of objection disappears: nobody says we can't predict the long-run effects of funding the research. And when somebody proposes *stopping* something we've been funding for years, the objection flips sides, and now it's deployed against stopping. That last one is what makes me think it isn't tracking any property of the options at all.

  But I don't think it's just bias either, and that's the bit I want help with. There does seem to be a real asymmetry: we have reciepts and audits for the thing we've been running, and for the new thing we have a story plus some numbers somebody made up. And — this feels like the load-bearing part — mistakes in estimating push an option *up* our ranking but never down, so the proposals that look best on paper are systematically the ones most likely to have been over-estimated. That's a genuine reason to tilt toward the boring option. But the boring option's far-future effects are exactly as unknown as the exciting one's, and if the far-future effects are the ones doing the work, then the tilt should be tiny rather than the conversation-ender it usually is.

  So: is there an established concept for this specific thing — the selective, one-sided deployment of "you can't predict the consequences" — as opposed to cluelessness in general? I know people talk about cluelessness for the general problem that long-run effects swamp short-run ones, but that's symmetric and mine isn't. "Status quo bias" isn't right either, since that's suppose to be a bare preference for how things already are, whereas this move is offered as an epistemic reason and at least sometimes is one.

  If nothing fits, name it and define it carefully, and tell me where it stops: does it still apply when the incumbent is itself only a year old and has no track record? When both options have real data behind them? When the intervention is reversible and you can back out in two years? I'm after which part of the move is doing the real work and which part is decoration, not a label to stick on it.
reasoning: |-
  Okay, let me try to unpack this user's query. They're on a grantmaking committee and noticed a pattern in their discussions. When comparing a known, previously funded program with a new proposal, someone argues that the long-term effects of the new one are unpredictable, so they can't rank them equally. But they don't apply the same skepticism to the existing program, even though its long-term effects are equally unknown. The user points out that this objection disappears when proposing research or flips when considering stopping an existing program. 

  Hmm, the user is frustrated because this seems like an inconsistency masked as epistemic caution. They recognize there's a real asymmetry—having receipts and audits for the existing program creates a sense of security, while the new one relies on projections. But they note that estimation errors only push options up in rankings, making overestimated proposals look better. The existing program's far-future unknowns are ignored, which tilts decisions toward the status quo more than justified.

  The user wants to know if there's a term for this selective use of unpredictability. They've considered "cluelessness" (which is symmetric) and "status quo bias" (which is preference-based), but neither fits perfectly. They need a concept that captures the one-sided epistemic argument. They also want to understand the boundaries: when does this bias apply? For example, if the incumbent is new, or both have data, or the intervention is reversible.

  I recall concepts like uncertainty aversion and ambiguity aversion. Ambiguity aversion specifically relates to preferring known probabilities over unknown ones. Here, the existing program feels like a known probability (because of short-term data), while the new one is pure ambiguity. But the key is the asymmetry in applying the unpredictability argument only to the new option. This sounds like "asymmetric ambiguity aversion." 

  Also, status quo bias might play a role, but the user distinguishes it because the argument is framed epistemically. The "endowment effect" could be relevant too—owning the existing program makes them value it more. But the core is the selective skepticism. Another angle is the "availability heuristic": the existing program's data is readily available, making its risks feel more manageable. 

  The user's deeper need might be to articulate this bias to their committee, to foster more balanced discussions. They probably want strategies to counter this bias, like requiring comparable uncertainty assessments for all options. They might also need frameworks to evaluate interventions beyond short-term data, perhaps emphasizing reversibility or pilot programs. 

  So, defining "selective unpredictability bias" as a subtype of ambiguity aversion, where the uncertainty of the status quo is underweighted. Boundaries: if both options have similar data, the bias lessens. If the incumbent is new without data, the asymmetry might fade. Reversibility could reduce the bias by lowering the stakes of uncertainty. The real work is the emotional comfort from tangible data, while the "decoration" is invoking long-term unpredictability selectively.
answer: |-
  This is a beautifully articulated observation of a **real and pernicious cognitive bias** masquerading as epistemic caution. You're right that "cluelessness" (the general unknowability of long-term effects) is symmetric, while what you're seeing is **asymmetric** and selectively deployed. "Status quo bias" captures the *outcome* but not the *mechanism* of the reasoning you describe.

  The established concept that best fits the *core mechanism* is **Ambiguity Aversion (or Uncertainty Aversion)**, but specifically **asymmetrically applied** due to the **availability of concrete (though short-term) data for the incumbent**.

  Here's the breakdown:

  1.  **Ambiguity Aversion:** People strongly prefer known risks (probabilities we can quantify) over unknown risks (ambiguity, where probabilities are unclear or impossible to assign). The new proposal represents pure ambiguity about its *entire* effect profile. The existing program represents a *known* short-term effect profile coupled with *ambiguous* long-term effects.
  2.  **Asymmetrical Application:** The human mind finds it much easier to *ignore* or heavily discount the ambiguous long-term component of the incumbent precisely *because* it has concrete, tangible short-term data (receipts, 18-month audits). This data creates an illusion of control and predictability, making the *associated* long-term ambiguity feel less threatening or relevant. The new proposal, lacking *any* concrete implementation data with *this specific grantee*, feels like pure ambiguity soup, triggering a stronger aversion.
  3.  **The Availability Heuristic:** The concrete data for the existing program is highly "available" – easy to recall and picture. The lack of such data for the new program makes its potential failures and unknown consequences much more salient *and* easier to imagine negatively. The long-term unknowns of the existing program are abstract and distant.
  4.  **Endowment Effect:** You "own" the existing program through past funding. This creates an irrational overvaluation and a heightened perception of the risk/loss associated with stopping it. The objection flips when stopping is proposed because the perceived ambiguity of *losing the known benefits* (even short-term) and facing an unknown future *without* the program becomes salient.

  **Naming the Phenomenon: "Selective Unpredictability Bias" or "Asymmetrical Ambiguity Discounting"**

  *   **Definition:** The tendency to selectively amplify concerns about unpredictable long-term consequences for novel options or changes to the status quo, while simultaneously discounting or ignoring equally unpredictable long-term consequences associated with incumbent options, due to the psychological comfort derived from concrete (though limited and short-term) data associated with the incumbent.
  *   **Epistemic Mask:** It presents as a rational epistemic concern ("We can't model/predict the long-term effects") but is applied asymmetrically based on emotional comfort with the known *elements* of the incumbent, not a genuine assessment of comparative long-term predictability.

  **Where it Stops: Boundaries of the Bias**

  1.  **Brand New Incumbent (No Track Record):** **The bias likely weakens significantly or disappears.** If the "existing" program is only a year old and has only preliminary data (similar in scope to what a new proposal might promise), the asymmetry collapses. Both options now feel similarly ambiguous. The "status quo" preference might remain, but the *epistemic argument* based on unpredictability loses its asymmetric force. The lack of concrete implementation history erodes the psychological comfort shield.
  2.  **Both Options Have Real Data:** **The bias diminishes but might not vanish.** If both Option A (incumbent) and Option B (new) have comparable track records and audits (e.g., both are established programs in different regions), the asymmetry in the unpredictability argument becomes harder to justify rationally. Comparisons focus more directly on the *content* of the data (effectiveness, cost, etc.) rather than the *presence* of data shielding one from long-term scrutiny. Status quo preference might still tip scales slightly.
  3.  **Reversible Interventions:** **The bias is significantly reduced.** If the novel intervention is explicitly designed to be low-cost, easily monitored, and reversible within a short timeframe (e.g., 2 years), this directly addresses the core fear driving the selective unpredictability argument. The potential downside of unforeseen long-term consequences is capped. The argument "we can back out quickly" effectively counters the "we can't predict 10 years out" objection *specifically for the new option*, restoring symmetry. The incumbent's long-term ambiguity remains, but the new option's risk is perceived as more manageable.
  4.  **Research Proposals:** **The bias vanishes because the "ambiguity" is the point.** Funding research explicitly aims to *reduce* ambiguity about what works. Your committee correctly sees this as fundamentally different. The unpredictability of the *research itself* (will it succeed? what will it find?) is acknowledged, but the *purpose* of the investment is to generate knowledge to reduce future ambiguity for *implementation* decisions. The inherent value of knowledge generation outweighs the ambiguity aversion for this specific class of proposals.

  **The Real Work vs. The Decoration**

  *   **The Real Work (Core Driver):** The **emotional comfort derived from concrete, tangible, short-term data associated with the incumbent program.** This data (receipts, 18-month audits) acts as a psychological shield against fully confronting the equally ambiguous long-term future. This comfort stems from ambiguity aversion and the availability heuristic.
  *   **The Decoration (Epistemic Mask):** The invocation of **"We can't predict the long-term consequences (for this specific novel option/change)."** This is the *rationalization* offered, leveraging the genuine problem of cluelessness, but applied selectively. The "knock-on effects in ten years" language is the dressing applied only to the option lacking the concrete data shield.
  *   **The Tilt Mechanism:** The **asymmetrical perception of estimation error risk.** As you astutely noted, estimation error pushes options *up* the ranking. The incumbent's short-term successes are tangible and confirmed, making its *overall* value feel more certain (even if long-term effects are unknown). The new proposal's *promised* benefits are inherently estimates, prone to over-optimism. The bias amplifies the perceived risk of the new proposal's estimates being wrong *without* equally acknowledging that the incumbent's *long-term value* estimate is just as uncertain.

  **What to Do About It?**

  1.  **Name It:** Introduce the concept of "Asymmetrical Ambiguity Discounting" or "Selective Unpredictability Bias" to your committee. Frame it as a common cognitive trap.
  2.  **Force Symmetry:** When the "long-term unpredictability" objection is raised against a new proposal, explicitly ask: "What are the equally unpredictable long-term consequences (positive or negative) of *continuing* the existing program that we might be discounting because we have the 18-month reports?"
  3.  **Focus on the Known Unknowns:** Acknowledge the long-term uncertainty for *both* options. Frame the decision as: "Given that the *very* long-term is equally unknowable for both, what does the evidence we *do* have (short-term incumbent data vs. theory/analogues for the new proposal) tell us about the *direction* and *potential magnitude* of impact in the *foreseeable* future (e.g., 3-5 years)?"
  4.  **Consider Reversibility:** Explicitly factor in the reversibility of interventions when evaluating novelty. Can you pilot the new idea with a smaller, time-limited grant?
  5.  **Value Exploration:** Recognize that *some* allocation towards novel approaches (even with higher perceived ambiguity) is necessary to avoid stagnation and potentially find better solutions. Treat it as a portfolio diversification strategy.

  You've identified a crucial flaw in decision-making under uncertainty. By dissecting it, you're already well on your way to making your grantmaking more robust and less susceptible to this subtle but powerful bias.
