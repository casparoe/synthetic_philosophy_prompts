prompt: |-
  You are a professional philosopher and decision theorist who advises grantmaking committees that have to act under deep normative disagreement. Please think carefully and work through this in stages: brainstorm the candidate failure modes first, sort them by whether they actually bite on our case, and only then give your verdict. Do not offer us reading lists or citations; we want the argument itself.

  Our committee is splitting a research budget between three programmes: A, scaling an intervention with well-evidenced but moderate benefits; B, a long-shot project with a small chance of averting a genuinely catastrophic outcome; C, capacity-building whose main value is procedural, in that it makes the consent and standing of the affected community matter to how we decide. Our methods consultant keeps saying that moral uncertainty is just factual uncertainty with extra steps. On that picture you have credences over moral theories, each theory tells you what each option is worth, so you take the expectation and get on with it: agonising about whose theory is right is unscientific, and any departure from expected-value weighting is squeamishness about arithmetic. The analogy is being used to license setting aside the objections of two views we take seriously — a suffering-focused view on which the badness of suffering is lexically prior to and effectively unbounded relative to the goods in play, and a consent-based view on which we may not act on any principle an affected party could reasonably reject, and which specifically counts weighting rival theories by our own private credences as such a principle: a second-order instruction about how disagreement itself is to be handled.

  Audit the analogy for us. State the correspondence explicitly: in ordinary factual uncertainty, what plays the role of the state space, the probability measure, the outcome function, the utility function, and the shared currency in which outcomes are compared — and what, if anything, fills each of those slots in the moral case? Then set out where the mapping breaks: intertheoretic comparisons of value, unbounded or lexical stakes that make the expectation undefined, theories that issue instructions about the aggregation rule itself (including the my-favourite-theory problem, where your most credible view tells you to ignore the rest), and whether credences over moral theories really behave like probabilities. Separate the breaks that matter for our decision from the ones that do not, and tell us whether the consultant's conclusion — expected-value weighting, no squeamishness — survives once the disanalogies are on the table, or whether the analogy was carrying it all along. If a better analogy is available, give it.

  Finally, be explicit about your own commitment. Where are you least confident? What argument, or what feature of the three views, would make you back expected-value weighting after all? And flag the single disanalogy which, if it fails, most undermines your own reasoning.
reasoning: |-
  We are auditing an analogy: the claim that moral uncertainty is just factual uncertainty with extra steps. The consultant says we should assign credences to moral theories, compute the expected value of each action under each theory, and maximize expected value across theories. This is supposed to avoid "agonizing" about which theory is right and any "squeamishness" about arithmetic.

  But we have two views that object:
  1. A suffering-focused ethic (SFE) that treats the badness of suffering as lexically prior and effectively unbounded relative to other goods.
  2. A consent-based ethic (CBE) that says we may not act on any principle that an affected party could reasonably reject. This view specifically rejects weighting rival theories by our own credences, because that aggregation rule itself could be reasonably rejected.

  We must:
  - State the correspondence for factual uncertainty and moral uncertainty.
  - Identify where the mapping breaks, and sort which breaks matter for our case.
  - Decide if the consultant's conclusion survives.
  - Suggest a better analogy if available.
  - Be explicit about our own commitments and uncertainties.

  ### Step 1: The Correspondence

  In ordinary factual uncertainty:
  - **State space**: The set of possible states of the world (e.g., whether a coin lands heads or tails).
  - **Probability measure**: A probability distribution over the state space (e.g., P(heads)=0.5).
  - **Outcome function**: For each action and each state, the outcome that results (e.g., if I bet on heads and it lands heads, I win $10; else, I lose $5).
  - **Utility function**: A function that assigns a real number to each outcome, representing its desirability (e.g., winning $10 has utility 10, losing $5 has utility -5).
  - **Shared currency**: All outcomes are valued in the same unit (e.g., dollars or utils), so we can compute expected utility.

  In moral uncertainty, the analogy is:
  - **State space**: The set of possible moral theories (e.g., SFE, CBE, and whatever other theories we have credence in).
  - **Probability measure**: Our credences over these theories (e.g., P(SFE)=0.3, P(CBE)=0.2, P(some other theory)=0.5).
  - **Outcome function**: For each action (e.g., funding A, B, or C) and each moral theory, the outcome is the world that results from that action. But note: the outcome is the same world, but different theories value it differently. So we need a way to represent the value of that world under each theory.
  - **Utility function**: Each moral theory provides a utility function (or value function) that assigns a value to the outcome under that theory. For example, under SFE, the value might be determined solely by the amount of suffering; under CBE, by whether the action respects consent.
  - **Shared currency**: We need a common scale to compare the values assigned by different theories. For instance, we might try to represent the value of each outcome in a common unit (like "utils") so we can average them.

  ### Step 2: Candidate Failure Modes (Where the Analogy Breaks)

  1. **Intertheoretic Comparisons of Value**: In factual uncertainty, we have a single utility function that values outcomes. In moral uncertainty, each theory has its own utility function, and these may be incommensurable. We need a way to normalize the scales across theories to compute an average. For example, is a unit of value in SFE comparable to a unit in CBE? Without a common scale, the expectation is undefined.

  2. **Unbounded or Lexical Stakes**: Some theories may have utility functions that are unbounded (e.g., SFE might assign infinite disutility to any scenario with extreme suffering) or have lexical priorities (e.g., SFE might say that reducing suffering by any amount, no matter how small, is more important than any other good). This can make expected utility undefined (if utilities are infinite) or dominated by one theory even with low credence.

  3. **Theories that Issue Instructions about the Aggregation Rule**: Some moral theories might directly prescribe how to act under moral uncertainty. For example:
     - **The my-favourite-theory problem**: If your most credible theory (say, with 40% credence) tells you to ignore other theories and follow it, then expected-value weighting might violate that theory's prescription.
     - In our case, CBE specifically objects to the aggregation rule (expected-value weighting by our credences) because it could be reasonably rejected. So, if we use that rule, we might be violating CBE even if we have high credence in it.

  4. **Credences Over Moral Theories May Not Behave Like Probabilities**: Our credences over moral theories might not satisfy the axioms of probability (e.g., due to vagueness, incompleteness, or fundamental disagreement) or might be unstable. Moreover, moral theories are not mutually exclusive and exhaustive in the same way that factual states are.

  5. **The Problem of Normative Authority**: In factual uncertainty, we assume we are the sole decision-maker. In moral uncertainty, the affected parties (whose consent matters in CBE) might have a say in how we aggregate. The consultant's approach uses our private credences, but CBE insists that the aggregation rule must be acceptable to all affected parties.

  ### Step 3: Which Breaks Matter for Our Case?

  We have three programs and two objecting views:

  - **Program A**: Scaling an intervention with moderate benefits (e.g., reducing some suffering but not catastrophically much).
  - **Program B**: A long-shot project to avert a catastrophe (e.g., preventing an existential risk that would cause vast suffering).
  - **Program C**: Capacity-building for procedural justice (focusing on consent and standing).

  The objecting views:

  1. **Suffering-Focused Ethic (SFE)**: 
     - Might see Program B as having potentially astronomical value (if it averts catastrophic suffering) and thus dominate the expected value calculation even with a small chance. But if the utility is unbounded, the expectation might not converge. Also, it might lexically prioritize reducing suffering over other goods, so even a small chance of averting catastrophe might make B the only acceptable option.

  2. **Consent-Based Ethic (CBE)**:
     - Objects to the entire expected-value weighting method because it uses our credences to weight theories, which might be reasonably rejectable by affected communities. Specifically, they might reject being governed by a decision rule that weights theories in a way they don't endorse. For Program C, they might see it as essential because it establishes the right procedures for future decisions.

  Now, which breaks matter?

  - **Intertheoretic Comparisons**: We must compare the value of A, B, and C under SFE and CBE. But SFE might measure value in terms of suffering reduced, while CBE in terms of procedural fairness. How do we put these on a common scale? This is a major break and matters because without it, we cannot compute the expectation.

  - **Unbounded or Lexical Stakes**: If SFE assigns unbounded disvalue to catastrophic suffering, then even a tiny credence in SFE might make B dominate. But if we have lexical priorities, then expected-value weighting might be inappropriate because it averages over states where one theory says the stakes are infinitely high. This matters for our case because Program B is a long-shot for averting catastrophe, so SFE might demand we choose B regardless of other considerations.

  - **Theories that Issue Instructions about Aggregation**:
     - CBE explicitly rejects the aggregation rule. So if we have any credence in CBE, we are violating it by using the rule. This matters because we take CBE seriously. Also, if SFE is lexical, it might tell us to ignore other theories when catastrophic suffering is at stake, which would be an instruction about aggregation.

     - The "my-favourite-theory" problem: If we have a theory that says "only follow me", then expected-value weighting violates that theory. But in our case, both SFE and CBE might be such theories. SFE might say: "If there's any chance of catastrophic suffering, you must prevent it." CBE might say: "You must not use an aggregation rule that the affected parties could reasonably reject."

  - **Credences Over Moral Theories**: We might not have precise credences. But even if we do, the other breaks are more critical.

  - **Normative Authority**: This is central to CBE. The affected communities have a say. The consultant's method uses our credences, but the affected communities might not endorse that.

  So, for our decision, the breaks that matter are:
  1. Intertheoretic comparisons (common scale problem).
  2. Unbounded/lexical stakes (from SFE).
  3. Theories that prescribe the aggregation rule (both SFE and CBE do this).

  ### Step 4: Does the Consultant's Conclusion Survive?

  The consultant says: use expected-value weighting, no squeamishness.

  But given the breaks:
  - Without a common scale, we cannot compute the expectation. We might try to normalize, but that is arbitrary and might not be justifiable to all theories.
  - If SFE has lexical priorities, then even a small credence in SFE might force us to choose Program B. But then we are ignoring other theories (like CBE) entirely, which violates the expected-value approach and also violates CBE's demand for consent.
  - CBE objects to the aggregation rule itself. So if we have any credence in CBE, we are violating it by using the rule. This is a self-undermining problem.

  Therefore, the consultant's conclusion does not survive. The analogy breaks in ways that are directly relevant to the views we take seriously.

  ### Step 5: A Better Analogy?

  A better analogy might be to **bargaining or consensus-based decision-making under disagreement**. Instead of a single decision-maker with credences, we imagine the moral theories as stakeholders with different values. We then seek a decision that is acceptable to all (or as many as possible) without requiring a common scale. This is similar to the CBE's emphasis on reasonable rejectability.

  In this analogy:
  - We are not maximizing expected value but seeking a compromise or a procedure that respects all views.
  - For example, we might use a method that gives each theory a veto (like the unanimity rule in CBE) or a method that looks for options that no theory strongly objects to (a form of satisficing).

  In our case, Program C (capacity-building) might be favored because it addresses the procedural concerns of CBE and, by building capacity for future decisions, might help address SFE's concerns (if future decisions can reduce suffering more effectively). Program B might be too risky for CBE because it doesn't have the consent of the affected community, and Program A might be too small for SFE.

  ### Step 6: My Own Commitment and Uncertainties

  I am least confident about **how to handle intertheoretic comparisons**. It might be possible to develop a normalization method (e.g., using a range-based approach) that is acceptable, but I am not sure. Also, I am uncertain about the extent to which lexical priorities should be respected. Should we really let a 1% credence in SFE dictate choosing B, even if that means ignoring all other values?

  What might make me back expected-value weighting after all?
  - If we could find a way to normalize the value scales across theories that is not arbitrary and that all theories could accept (or at least not reasonably reject). For instance, if each theory agrees to a common normalization procedure (like using the difference from the worst to the best outcome in a reference set).
  - If the lexical priorities in SFE are not actually unbounded (e.g., if they only apply to actual infinities, and in practice, we only face finite stakes). Then we might compute expected value without infinities.

  The single disanalogy which, if it fails, most undermines my reasoning is:
  - **The objection from CBE about the aggregation rule**. If it turns out that CBE does not actually require us to abandon expected-value weighting (for example, if CBE allows us to use our credences as long as we have made a good faith effort to include the affected parties in forming those credences), then the analogy might be more robust. But as stated, CBE specifically counts weighting by our private credences as a principle that could be reasonably rejected, so I think this break is real and fatal.

  ### Verdict

  The consultant's analogy fails because of:
  - The lack of a common scale for intertheoretic comparisons.
  - The lexical/unbounded stakes in SFE that make expectation undefined or dominated.
  - The fact that CBE (and possibly SFE) prescribe a different aggregation method.

  Therefore, we cannot simply use expected-value weighting. We must consider other approaches, such as seeking consensus or using a decision rule that respects the procedural demands of CBE and the catastrophic risk concerns of SFE.

  In this specific decision, Program C (capacity-building) might be the most robust choice because it addresses the procedural concerns of CBE (by building consent mechanisms) and might enable better decisions in the future that could address SFE's concerns (e.g., by building community capacity to reduce suffering). However, we must also consider the catastrophic risk of not funding B. A compromise might be to split funding, but we must avoid violating CBE's constraints on process.

  **Final Recommendation**: Reject the consultant's analogy. Adopt a decision-making procedure that is acceptable under the views we take seriously, which might involve giving weight to the procedural concerns of CBE and the catastrophic risk concerns of SFE without assuming a common scale. This could mean funding Program C and a portion of Program B, but only after consulting affected communities about the long-shot project.
answer: |-
  ### Step 1: Brainstorming Candidate Failure Modes of the Analogy  
  The analogy claims moral uncertainty is reducible to factual uncertainty by treating moral theories as "states," credences as probabilities, and moral value as a shared "utility" currency. Candidate failure modes:  
  1. **Intertheoretic value comparisons**: Moral theories may lack a common scale for comparing "utility" across theories (e.g., how to equate "suffering reduced" with "consent achieved").  
  2. **Unbounded or lexical stakes**: A theory (e.g., suffering-focused) may assign infinite or lexical priority to certain outcomes, making expected value undefined or dominated by extreme cases.  
  3. **Theories prescribing aggregation rules**: Some theories (e.g., consent-based) may explicitly reject the expected-value framework itself, creating a paradox if we use it.  
  4. **Credences as non-probabilistic**: Credences over moral theories may violate probability axioms (e.g., incomplete, non-additive, or unstable due to normative disagreement).  
  5. **Non-mutually-exclusive theories**: Moral theories may overlap or conflict in ways that prevent clean partitioning into "states."  
  6. **Normative authority**: Factual uncertainty assumes a single decision-maker; moral uncertainty involves claims about legitimacy (e.g., affected communities’ consent).  

  ### Step 2: Sorting Failure Modes by Relevance to Our Case  
  - **Relevant and biting**:  
    - (1) **Intertheoretic comparisons**: Critical. Suffering-focused ethics (SFE) and consent-based ethics (CBE) use incommensurable values (suffering vs. procedural fairness). No shared currency exists.  
    - (2) **Unbounded/lexical stakes**: Critical for SFE. If catastrophic suffering is lexically prior, even a tiny credence in SFE could dominate expected value, forcing focus on Program B regardless of other views.  
    - (3) **Theories prescribing aggregation**: Critical for CBE. CBE rejects weighting by private credences as reasonably rejectable. Using expected value directly violates CBE.  
    - (6) **Normative authority**: Critical for CBE. The "affected community" must consent to the decision rule, but expected-value weighting uses our credences, not theirs.  
  - **Less relevant or non-biting**:  
    - (4) **Non-probabilistic credences**: Credences may be messy, but we can assume they are probabilistic for argument’s sake. Not the core issue.  
    - (5) **Non-mutually-exclusive theories**: Our three views (SFE, CBE, and moderate welfarism implicit in A/B) are distinct enough to treat as separate "states."  

  ### Step 3: Explicit Correspondence and Where It Breaks  
  | **Component**          | **Factual Uncertainty**                          | **Moral Uncertainty Analogy**                               | **Where It Breaks**                                                                 |  
  |-------------------------|--------------------------------------------------|-------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **State space**         | Exhaustive, mutually exclusive states (e.g., "coin is heads/tails"). | Set of moral theories (SFE, CBE, etc.).                    | Less severe: Theories may overlap, but we can force mutual exclusivity.             |  
  | **Probability measure** | Probabilities over states (e.g., P(heads) = 0.5). | Credences over theories (e.g., P(SFE) = 0.3, P(CBE) = 0.2). | Mild: Credences may be vague, but assume they are probabilistic.                   |  
  | **Outcome function**    | Maps action-state pairs to outcomes (e.g., betting $10 on heads yields +$10 if heads). | Maps action-theory pairs to outcomes (e.g., funding B under SFE yields "catastrophe averted"). | Moderate: Outcomes are world-states, but theories disagree on their descriptions (e.g., SFE sees suffering; CBE sees consent violations). |  
  | **Utility function**    | Single utility function valuing outcomes (e.g., dollars → utils). | Each theory has its own "utility" (e.g., SFE values suffering reduction; CBE values procedural fairness). | **Critical**: No shared scale. SFE’s "suffering unit" ≠ CBE’s "consent unit." Comparisons are arbitrary. |  
  | **Shared currency**     | Common unit for comparison (e.g., utils).        | Hypothetical "moral value" unit for averaging.              | **Critical**: No such currency. SFE and CBE are incommensurable. Averaging is meaningless. |  

  **Key breaks specific to our case**:  
  - **SFE’s lexical stakes**: If SFE assigns unbounded disvalue to catastrophe, Program B’s expected value becomes infinite under SFE. With any credence >0 in SFE, B dominates. This nullifies other theories (e.g., CBE’s procedural concerns) and makes A/C irrelevant. Expected value is undefined or pathological.  
  - **CBE’s rejection of aggregation**: CBE objects to weighting theories by our credences. Affected communities could reasonably reject this as undemocratic. Using expected value violates CBE even if we have high credence in it—a self-defeating paradox.  
  - **Normative authority**: Expected value uses *our* credences, but CBE demands *affected communities* consent to the rule. Program C’s value (procedural fairness) is ignored if we override it via arithmetic.  

  ### Step 4: Verdict on the Consultant’s Conclusion  
  **The consultant’s conclusion does not survive.** The analogy collapses under the weight of intertheoretic comparisons, lexical stakes, and CBE’s procedural critique. Specifically:  
  - **Intertheoretic comparisons** and **shared currency** failures make expected value calculation incoherent. We cannot compare "value" across SFE and CBE without arbitrary normalization, which both theories could reject.  
  - **SFE’s lexical stakes** make expected value undefined or force dominance of Program B, silencing other views. This is not "squeamishness"—it’s a mathematical limitation.  
  - **CBE’s prescription** directly invalidates the aggregation rule. Using expected value violates CBE’s core principle, making it self-undermining.  

  The analogy was "carrying" the conclusion by smuggling in a false assumption of commensurability and ignoring meta-normative constraints.  

  ### Step 5: A Better Analogy  
  **Bargaining under persistent disagreement**: Imagine three stakeholders (SFE, CBE, moderate welfarism) with divergent values, negotiating a joint decision. Here:  
  - **Goal**: Not expected value maximization, but a mutually acceptable compromise or procedure (e.g., veto rights, satisficing).  
  - **Relevance**: Matches CBE’s emphasis on reasonable rejectability and SFE’s high-stakes concerns. Program C becomes central—it builds capacity for fair bargaining, addressing legitimacy.  
  - **Application**: Prioritize options that avoid strong vetoes (e.g., SFE might veto A if B is feasible; CBE might veto B without community input). Program C could enable future decisions that respect both SFE (e.g., targeting catastrophic suffering) and CBE (e.g., via inclusive processes).  

  ### Step 6: My Own Commitment and Uncertainties  
  **Where I am least confident**: Intertheoretic comparisons. I doubt a non-arbitrary common scale exists, but I am uncertain if pragmatic workarounds (e.g., "normalized range" methods) could be defensible under limited conditions.  

  **What might make me back expected-value weighting**: If all theories *implicitly* shared a deeper currency (e.g., "well-being" underpinning both suffering reduction and procedural fairness), and lexical stakes were bounded (e.g., SFE’s priority is finite in practice). If so, expected value could approximate a "least bad" aggregation.  

  **Single disanalogy that most undermines my reasoning if it fails**: **CBE’s rejection of the aggregation rule**. If CBE could tolerate expected-value weighting *provided* credences were formed inclusively (e.g., with community input), the analogy might hold. But as stated, CBE explicitly rejects it, and if that premise stands, my critique holds.  

  ### Final Recommendation for the Committee  
  Reject the consultant’s approach. Expected-value weighting fails under SFE’s lexical stakes and CBE’s procedural objections. Instead:  
  1. **Prioritize legitimacy**: Fund Program C to build inclusive decision processes (satisfying CBE and enabling future SFE-aligned actions).  
  2. **Mitigate catastrophic risk**: Allocate a portion to Program B, but only after using C’s capacity to consult affected communities on the long-shot bet.  
  3. **Moderate benefits**: Fund Program A if resources allow and no vetoes arise.  
  This balances high-stakes concerns (SFE) and procedural justice (CBE) without relying on incoherent arithmetic.
