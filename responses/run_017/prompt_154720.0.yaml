prompt: |-
  I sit on the naming review committee of a small university, and we owe the Board of Trustees a recommendation in two weeks on two petitions we heard together, which is why I want one principle rather than two separate rulings.

  Petition A asks us to remove the name of a living donor from our School of Public Health. The naming honoured a 1997 gift; the donor had no connection to the field, and the name was given in gratitude for the money and nothing else. In the years since, this donor has become the largest funder of a national campaign to dismantle the public-health agencies the school exists to train people for, and now says publicly that the school's own faculty are part of the problem. The gift agreement names the school in perpetuity, but only so long as the institution remains true to the purposes for which the gift was made. A final pledged installment, which would fund roughly forty scholarships a year for first-generation students, has not been paid, and the donor's lawyer has hinted that it depends on the name staying up.

  Petition B asks us to name an admissions building after a civil-rights organizer who is not an alumna. The dean supports it. A group of faculty opposes it, on the ground that the university has missed every enrollment target it set for itself over the last decade and that putting her name on the building lets the institution display a commitment it has not actually made; one of them calls this commemorative laundering, the use of a name as a substitute for the reform the name celebrates.

  I want a memo that handles both at once, and I would rather it not apply the familiar script about whether an honoree's bad deeds outweigh their good ones. The donor in Petition A has done nothing disgraceful by the standards usually applied in these disputes, and the honoree in Petition B is uncontroversial. The question, it seems to me, is what a name is doing: whether it records a past act, asserts a continuing endorsement, or does something to the people who have to work and study under it every day.

  Please draft the memo I will circulate, roughly 700 to 900 words, with the following properties.

  - Lead with the bottom lines in the first two sentences: what you recommend for A, and what you recommend for B. No preamble and no restating of the case.
  - Give the principle you are using, stated tightly enough that we could apply it to the next petition without you in the room, and say what it implies about whether names should be reviewed on a schedule rather than only when someone complains.
  - Give the strongest version of the argument you are rejecting in each case, not a summary of it.
  - Separate, explicitly and in a form we could quote to the Board: first, what anyone who has thought about this would grant; second, what is genuinely contested among people who work on the ethics of commemoration; third, the points where the committee simply has to make a judgement that no principle settles. Do not present a contested view as the consensus.
  - Say what we should do about the unpaid installment, and what we should say to the donor and to the faculty group.
  - No citations, case law, or reading lists; we will supply whatever documentation we need.
reasoning: |-
  Okay, the user is on a naming review committee at a small university and needs a memo to present recommendations to the Board of Trustees. They have two petitions: Petition A about removing a donor's name from the School of Public Health, and Petition B about naming an admissions building after a civil-rights organizer. The user wants both handled under one principle, avoiding the typical "good vs bad deeds" framework.

  Hmm, the key insight here is the user's observation about what a name actually does - whether it records past acts, implies endorsement, or affects people daily. That's the angle to build the principle around. For Petition A, the donor now actively opposes the school's mission while holding scholarship funds hostage. That's not just misalignment but active hostility. The perpetuity clause actually gives grounds for removal since the institution can't remain "true to the purposes" when the donor undermines them.

  For Petition B, the faculty opposition is interesting - they call it "commemorative laundering," arguing the name would mask institutional failures in enrollment. But the dean supports it, and the honoree herself is uncontroversial. The memo should address that tension head-on: names aren't performance evaluations but statements of aspiration. The risk of hypocrisy exists, but that's why the naming must come with concrete commitments.

  The user's specifications are quite detailed - bottom lines first, then principle, then rejected arguments, then structured analysis (granted/contested/judgement calls), plus handling the unpaid installment and communications. Need to follow this exactly. 

  For the principle: "Names express institutional identity to those who live under them" covers it. Must emphasize that names speak to the community daily, not just record history. This implies proactive reviews every 5-10 years - can't wait for complaints when names shape environment.

  Strongest rejected arguments: For A, that the donor "hasn't done anything disgraceful" and the gift agreement binds the university. For B, that naming without enrollment reform is hypocrisy. Need to present these fairly before explaining why the principle overrides them.

  The structured section is crucial. What everyone grants: names have effects, context changes. Contested: whether names imply endorsement vs historical record, and how much hypocrisy matters. Judgement calls: whether the donor's actions cross the threshold of hostility, and whether the admissions naming would feel authentic.

  About the money: Must separate the name decision from the unpaid pledge. Write it off if necessary - no extortion. Tell the donor the name is removed regardless, citing the principle. Tell faculty that naming requires reform commitments, which we'll formalize.

  Tone is professional but firm. No academic citations per request. Keep it 700-900 words, starting with clear recommendations: remove name for A, approve name for B with conditions.
answer: |-
  **MEMORANDUM**  
  **TO:** Naming Review Committee  
  **FROM:** [Your Name/Committee Designation]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendations on Petitions A & B: School of Public Health Naming Removal and Admissions Building Naming  

  **Recommendations:** Remove the donor’s name from the School of Public Health (Petition A). Approve naming the admissions building after the civil-rights organizer, contingent on the Dean of Admissions publishing a binding three-year diversity enrollment action plan before installation (Petition B).  

  **Principle:** **Names express institutional identity to those who live under them daily.** They are neither neutral historical records nor unconditional endorsements, but active declarations of values to the community occupying the named space. This obligates us to:  
  1.  **Remove names** where the honoree’s *present* actions or associations create a *fundamental and operational conflict* for the users of the space, undermining their mission or dignity.  
  2.  **Grant names** where they credibly affirm aspirational values *to* the occupants, provided the naming is paired with *concrete, measurable steps* toward realizing those values.  
  *Implication for Review:* Names must be reviewed proactively every 5-10 years, regardless of petitions. Contexts, honorees, and institutional identities evolve; reliance on external complaints is reactive and fails those living with the name.  

  **Strongest Rejected Arguments:**  
  *   *For Petition A (Removal):* "The donor broke no laws or widely held ethical standards; the gift agreement grants perpetuity absent specific moral failure; removing the name jeopardizes significant future scholarships and appears punitive or politically motivated."  
  *   *For Petition B (Approval):* "Naming without demonstrable institutional reform is hypocritical ‘commemorative laundering,’ exploiting an honorable figure’s legacy to mask current failures, damaging credibility and demoralizing those aware of the gap between symbol and reality."  

  **Analysis Structure:**  
  1.  **What is Granted (Common Ground):**  
      *   Names have power and consequence for those who interact with them daily.  
      *   Contexts change – societal values, institutional priorities, and honorees’ legacies are not static.  
      *   Gift agreements are contracts, but institutional identity and mission are paramount considerations that may necessitate revisiting such agreements.  
      *   Aspirational naming carries inherent risk if institutional action lags significantly behind the symbolism.  

  2.  **What is Contested (Ethical Debate):**  
      *   *The Endorsement Threshold:* Does a name constitute *ongoing* institutional endorsement of the honoree, or merely record a past relationship? There is deep disagreement on whether perpetuity implies present-day alignment or solely historical acknowledgment.  
      *   *Hypocrisy vs. Aspiration:* Is naming amidst imperfect progress inherently deceptive and harmful ("laundering"), or a legitimate and necessary tool to signal commitment and catalyze change? The weight given to institutional sincerity versus the inspirational value of the symbol is contested.  
      *   *Donor Intent vs. Institutional Sovereignty:* To what extent does accepting a gift with perpetuity language permanently bind the institution to the donor's identity, even when it becomes antithetical to the institution's evolving mission or the well-being of its community?  

  3.  **Where Judgement is Required (No Settled Principle):**  
      *   *Petition A:* Does the donor’s *active, well-funded campaign against the core mission* of the school, combined with *public disparagement of its faculty*, constitute a conflict severe enough to override the perpetuity clause's "true to purposes" condition and negate the name's function *for the school community*? We judge **yes**.  
      *   *Petition B:* Does naming the admissions building *before* achieving enrollment targets constitute damaging hypocrisy that outweighs the potential motivational value for students and staff? We judge **no**, **provided** concrete, immediate, and measurable steps towards the namesake's values are *publicly committed to as part of the naming act*. Without this, the criticism holds.  

  **Application to Petitions:**  
  *   **Petition A (Remove Name):** The donor’s actions are not merely "bad deeds" but constitute an *active, material, and public assault on the very field and mission* the school exists to serve. Faculty and students working daily under this name are implicitly associated with, and demoralized by, an individual funding efforts to dismantle their profession and malign their expertise. The gift agreement's "true to purposes" clause is invoked *by the donor's actions*, not the university's. The name now expresses a profound identity conflict to its occupants, violating our principle.  
  *   **Petition B (Approve Name, with Condition):** The honoree’s legacy aligns with aspirational values crucial to admissions. While enrollment failures are serious, naming is not an award for achievement but a declaration of intent *to the community using that building*. To avoid "laundering," the naming must be explicitly linked to tangible reform. The condition transforms the name from a hollow symbol into a catalyst and accountability mechanism.  

  **Unpaid Installment & Communications:**  
  *   **Unpaid Installment:** Write it off. Do not pursue payment. Treating it as leverage would validate the donor's transactional approach and undermine the integrity of our decision. Funding scholarships for first-gen students must be secured through other means.  
  *   **Communication to Donor (A):** "The Committee recommends removing your name from the School of Public Health. Your significant funding of efforts to dismantle public health agencies and your public criticism of the School's faculty create an irreconcilable conflict with the School's mission and identity. This action is taken under the gift agreement clause requiring the institution to remain true to the purposes of the gift. The final pledged installment is no longer expected. We acknowledge the past benefit of your initial gift."  
  *   **Communication to Faculty Group (B):** "The Committee recommends approving the naming, contingent on the Dean of Admissions publishing a binding three-year action plan with measurable goals to address enrollment diversity gaps, prior to name installation. We agree that naming absent reform is 'commemorative laundering.' This condition ensures the name reflects not just aspiration, but a concrete institutional commitment to change, making the community within the building partners in accountability. We urge you to actively engage with the Dean in developing this plan."  

  **Conclusion:** Our principle centers on the lived experience within named spaces. Petition A demands removal because the name has become a hostile presence for its occupants. Petition B warrants approval because the name can serve as a beacon and tool for progress, but only if inseparably tied to immediate, actionable reform. Proactive review is essential to ensure names consistently serve, rather than undermine, our community and mission.
