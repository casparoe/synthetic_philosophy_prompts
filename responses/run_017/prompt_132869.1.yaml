  But in this case, the pattern of outputs (all heads) is consistent with the source being reliable (if the coin is always heads) or unreliable (if it's lying). So it doesn't provide evidence for reliability.

  But we want a case where the reasoning is similar to the bootstrapping fuel gauge.

  Let me build a case with a different constraint.

