  Alternative: use a constraint that is very unlikely to be satisfied by random outputs. Then, if the outputs satisfy the constraint, it is evidence that they are correct? But if there is systematic error, the constraint may still be satisfied? Unless the constraint is very specific.

  Let me try a different domain: a weather forecaster.

  Case 1 (Good): You have a weather app that predicts the chance of rain at 10am, 11am, and 12pm. You know that the chance of rain at 10am must be at least as high as at 11am (because the weather system is moving away and drying out). The app says: 10am: 60%, 11am: 50%, 12pm: 40%. These are decreasing. Now, if the app were unreliable and just giving random numbers, the chance that three random percentages are in decreasing order is 1/6 (since there are 3! orders). So if you get decreasing numbers, that is some evidence that the app is reliable? But note: the app might be systematically wrong but still output decreasing percentages if it has a model that captures the trend but is off by a constant. For example, if it always adds 10%, then the true chances would be 50%, 40%, 30% and the app reports 60%,50%,40% which is still decreasing. So the trend is preserved. So we don't get evidence for accuracy, only for capturing the trend.

