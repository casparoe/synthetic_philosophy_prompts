  Now, the difference: in the Sudoku case, the constraint is complex and hard to satisfy by chance, and it implies correctness. In the temperature case, the constraint is trivial (all equal) and easy to satisfy even if the reports are false.

  So the structural feature: the constraint must be one that is highly specific (so that random outputs are unlikely to satisfy it) and that is known to be satisfied only if the outputs are correct.

  In the Sudoku case, the constraints (Sudoku rules) are highly specific and, given the puzzle has a unique solution, they are satisfied only if the outputs are correct.

  In the temperature case, the constraint (all equal) is not highly specific and can be satisfied without correctness.

  Now, about the user's worry: in the Sudoku case, we escape the bootstrapping objection because we do not assume the reliability of the source in the reasoning. We use the constraints that we know independently (the rules of Sudoku) and the fact that the source's outputs satisfy them. The reasoning is: the probability that an unreliable source would satisfy the constraints is low, so it is likely reliable. And we don't use the source's own outputs to bootstrap because we are not assuming that any particular output is true in the process; we are only checking the relation between the outputs (the grid) and the constraints.

  But the bootstrapping objection might relocate to: how do we know the constraints (the Sudoku rules) are correct? But that is independent background knowledge. The agent is not using the source to learn the constraints. The constraints are known a priori.

  Similarly, how do we know the puzzle has a unique solution? That might be a problem. But we can stipulate that the puzzle is known to have a unique solution, which can be established by the puzzle setter. The agent doesn't need the source for that.

  In the bad case, we don't have a constraint that is both specific and truth-guaranteeing.

  Now, what if someone thinks bootstrapping is never OK? They might say about the Sudoku case: you are still using the source to tell you about the solution, and then you use that to confirm the source? But no, we are not using the source to tell us the solution and then assuming the solution is true. We are only checking that the source's output satisfies the constraints. We never assume that the source is reliable in the process. We are only using our independent knowledge of the constraints.

  So I think it escapes.

  But let's build the cases as requested.

  First case (Good):

  You download a Sudoku app. You give it a Sudoku puzzle that you know has a unique solution. Without looking up the solution, you run the app and it outputs a filled grid. You check that every row, every column, and every 3x3 box contains the numbers 1-9 exactly once. They do. You then give it another Sudoku puzzle (also known to have a unique solution) and again the output satisfies the Sudoku rules. After several such puzzles, you conclude that the app reliably solves Sudoku puzzles.

