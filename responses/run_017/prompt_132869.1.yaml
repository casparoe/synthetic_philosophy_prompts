  But note: we don't check the solution against the true solution, only against the constraints. And because the constraints define the solution (given uniqueness), it is equivalent to being correct.

  So this seems a good candidate for the first case.

  Now, the second case (bad bootstrapping): We need a similar setup but where it fails. The fuel gauge case: you look at the gauge, it says half full. Then you look again (without refueling or using fuel) and it still says half full. Then you conclude it's reliable. But why is that bad? Because the gauge might be stuck. So the pattern (same reading) is consistent with being stuck and broken.

