  Therefore, the structural feature is: whether the constraint that the outputs satisfy is such that (a) it is very unlikely to be satisfied by random outputs, and (b) it is only satisfied when the outputs are correct.

  In the Sudoku case, (a) and (b) hold because of the uniqueness of the solution and the low probability of a random grid satisfying the constraints.

  In the scale case with one object, the constraint (all readings equal) is very likely to be satisfied by a stuck scale and can be satisfied without the reading being correct.

  Now, to build a pair of cases:

  Case 1 (Good): Sudoku app as above, but let's make it a paragraph.

