  You have a kitchen scale. You place a single object on it ten times. Each time, the scale reads 100g. You reason that if the scale were unreliable, it wouldn't give the same reading each time, so the consistency suggests it is accurate. You conclude that the scale is reliable for weighing objects.

  Now, the structural difference: in the good case, the outputs (the filled grids) must satisfy a complex, highly specific constraint that is known to be necessary and sufficient for correctness (given uniqueness). In the bad case, the outputs (the readings) must satisfy a simple constraint (all equal) which can be satisfied even if the readings are incorrect (e.g., the scale is stuck).

  But note: in the bad case, we also have a constraint: the true weight is constant. So the readings should be equal. But the issue is that the constraint is too easy to satisfy by an unreliable source. So the key feature is the specificity of the constraint: how likely an unreliable source would satisfy it by chance.

  In the good case, the chance is very low. In the bad case, the chance is high (if the scale is stuck, it always satisfies).

  Moreover, in the good case, satisfying the constraint implies correctness. In the bad case, satisfying the constraint does not imply correctness (the scale could be stuck at a wrong value).

  So the structural feature is: the constraint must be such that (i) the probability that an unreliable source would produce outputs satisfying it is very low, and (ii) if the constraint is satisfied, then the outputs are correct.

  Now, the user's worry about their nutrition app: they learned that the app is additive, but it might be systematically off. In the Sudoku case, we avoid systematic error because the constraint is so tight that only the correct solution satisfies it. So no room for systematic error.

  But what if the Sudoku app has a systematic error? For example, it always swaps 1 and 2. Then the grid would not satisfy the constraints because there would be duplicates. So it would be caught. Therefore, the only way to satisfy the constraints is to be correct.

  Therefore, the good case escapes the bootstrapping objection.

  But a critic might say: how do you know that the constraint (Sudoku rules) are the right ones? That is background knowledge. The agent is not using the source to learn the rules. Similarly, the uniqueness of the solution is background knowledge.

  If someone thinks bootstrapping is never OK, they might argue that the agent's knowledge of the Sudoku rules and uniqueness is based on other sources that might be unreliable. But that is an infinite regress that we cannot avoid. At some point, we rely on basic knowledge. The bootstrapping objection is about circularity in the use of the same source, not about foundational knowledge.

  Therefore, the good case is acceptable.

  Now, to write the answer.
answer: |-
  Below, I present two scenarios designed to isolate the structural feature that distinguishes acceptable reasoning about a source's reliability from problematic bootstrapping. Both scenarios involve an agent with no independent access to the facts (no calibration, no second source, no prior trust), and the agent attempts to judge reliability solely from the pattern of the source's outputs. The reliability inferred must generalize to new outputs. The key difference is whether the outputs are constrained by a **rich, truth-entailing structure**—a known, highly specific set of logical, mathematical, or causal relationships that must hold between the true values, such that satisfying the structure implies correctness and is very unlikely to occur by chance if the source is unreliable. I'll first present the cases, then explain the reasoning, identify the structural feature, and address your concerns.

  ### Scenario 1: Good Case (Acceptable Reasoning)
  **Context:** You are evaluating a colleague who estimates commute times for different routes between two locations. You have no way to verify actual travel times (no GPS, no personal experience), and you have no prior reason to trust them. However, you know the routes form a network: Route A is a direct path, Route B is A plus a detour through a traffic circle, and Route C is B plus an extra bridge crossing. Crucially, you know the true times must satisfy a rigid structure: the time for B must equal A plus the detour time (known to be 5 minutes), and the time for C must equal B plus the bridge time (known to be 3 minutes). You ask your colleague for estimates: they report A takes 10 minutes, B takes 15 minutes, and C takes 18 minutes. These satisfy the constraints: 15 = 10 + 5 and 18 = 15 + 3. You test this with more route combinations (e.g., D = C + a tunnel, which they report as 23 minutes, satisfying 23 = 18 + 5). After multiple consistent reports, you conclude your colleague is reliable for commute times.

  ### Scenario 2: Bad Case (Bootstrapping Problem)
  **Context:** You are evaluating a smartwatch step counter. You have no way to verify your actual steps (no other tracker, no manual counting), and you have no prior reason to trust it. The watch reports your daily steps. You wear it for several days, and each day it reports exactly 8,000 steps. You reason that if the watch were unreliable, it would show random fluctuations, so the consistency suggests accuracy. After a week of identical reports, you conclude the watch is reliable for step counting.

  ### Structural Feature: Rich, Truth-Entailing Structure vs. Simple Consistency
  The key difference is whether the outputs are checked against a **rich, truth-entailing structure**—a known, complex set of constraints that are (i) highly specific (unlikely to be satisfied by chance), (ii) necessary and sufficient for correctness (they guarantee the outputs are true if satisfied), and (iii) independent of the source's reliability. In the good case, the commute-time constraints form such a structure. In the bad case, the step counter only requires simple consistency (all outputs equal), which lacks specificity and truth-entailment.

  - **Good Case Analysis:** The commute-time constraints (e.g., B = A + 5) are rich and truth-entailing. They are highly specific because random or arbitrary estimates would almost certainly violate them (e.g., if errors were independent, the chance that random numbers satisfy multiple linear equations is low). They are truth-entailing because they mirror the physical reality of the routes—any additive error would break the constraints. For example, if the colleague systematically overestimated by 2 minutes, they might report A=12, B=17, but 17 ≠ 12 + 5 (violation). Only correct reports satisfy the constraints, so pattern-matching provides evidence for accuracy. Reliability generalizes because new routes (e.g., D = C + 5) inherit the same structure. Crucially, the agent relies on independent knowledge of the constraints (e.g., detour time is 5 minutes), not the source itself.
    
  - **Bad Case Analysis:** The step counter's consistency (all outputs equal) is not rich or truth-entailing. It is not specific—a stuck or biased source would satisfy it trivially (e.g., always reporting 8,000 steps regardless of reality). It does not entail correctness because the true daily steps could vary, and a malfunctioning device could be consistently wrong. The reasoning reduces to "the outputs are consistent, so they must be true, so the source is reliable"—the essence of bootstrapping. Reliability appears to generalize (to future days), but consistency alone cannot distinguish accuracy from systematic error (e.g., a watch stuck at 8,000).

  ### Why Your Nutrition App Idea Breaks (and How This Fixes It)
  Your nutrition app case (additive calories) fails because it lacks truth-entailment. As you noted, systematic errors (e.g., always reporting 90% of true calories) preserve additivity, so the pattern only rules out random noise, not inaccuracy. The structural feature here is **whether the constraints are robust to systematic error**. In your case, they are not—additivity is necessary but insufficient for truth. In my good case, the constraints are sufficient: they are derived from known physical dependencies (e.g., detour time is fixed), so any error disrupts them. This generalizes beyond calorie apps because it relies on domain-specific structures that guarantee truth (e.g., commute times must be additive due to route geometry, Sudoku rules must yield a unique solution).

  ### Does the Good Case Escape Bootstrapping?
  Yes, but with a caveat. It escapes because:
  - **No circularity:** The agent never assumes the source's reliability during reasoning. They only check if outputs satisfy independent constraints. For example, in the commute case, the agent uses their knowledge that "B must be A + 5" (based on map data or prior experience) to test reports—not the reports themselves.
  - **No relocation:** The knowledge of the constraints (e.g., detour time is 5 minutes) is not bootstrapped. It comes from background knowledge (e.g., studying traffic patterns or city plans) that is independent of the source being evaluated. The bootstrapping objection targets circular dependence on the source, not foundational knowledge.

  However, a critic who insists bootstrapping is "never OK" might argue:
  - **Relocation risk:** They could claim that background knowledge (e.g., "the detour takes 5 minutes") might itself rely on other sources, potentially leading to infinite regress. But this is a general problem of justification, not unique to bootstrapping. In practice, epistemology accepts that some knowledge (e.g., logical/mathematical constraints or physical laws) can be justified non-testimonially (e.g., through reasoning or direct observation). In this case, the agent's knowledge of the constraints is assumed to be independent and pre-existing.
  - **Honest verdict:** The good case works because the constraints act as a "truth filter." If the critic rejects any use of independent constraints, they would dismiss this case as "bootstrapping once removed." But this overgeneralizes—it would also condemn ordinary coherence checks (e.g., rejecting a witness's contradictory story). My view is that the good case is valid because the constraints provide a non-circular test: they are falsifiable without the source (e.g., you could verify the detour time separately if needed), and they are not inferred from the source's outputs.

  ### What Happens If You Remove the Key Feature?
  If you remove the rich, truth-entailing structure (e.g., in the good case, if the agent only checks that commute times are "plausible" like 10–30 minutes), the reasoning collapses into bootstrapping. For example, if the colleague reports A=12, B=17, C=19 (not additive, but all within a plausible range), you might still infer reliability from "consistency with expectations," but this is vulnerable to systematic error and circularity. Conversely, adding a rich structure to the bad case (e.g., if the step counter must satisfy "steps per hour sum to daily total") could make it acceptable—but only if the structure is truth-entailing (e.g., true steps must sum, and errors would break the math).

  In summary, the operative variable is whether the pattern of outputs is evaluated against a rich, truth-entailing structure. This avoids your worry about correlated errors by ensuring constraints are stringent enough to force accuracy, and it provides a clear boundary for when "learning from outputs" is legitimate. Use these cases in your section to highlight that bootstrapping fails when we mistake mere consistency for evidence, but coherence with deep constraints can be genuine evidence of reliability.
