  Let me try to build two cases.

  Case 1 (Good): A colleague is giving you estimates of the number of people in different rooms in a building. You have no way to count the people yourself. However, you know that the total number of people in the building is fixed (say, 100) and that the building has three rooms (A, B, C) and that every person is in exactly one room. So the true counts must satisfy: A + B + C = 100. You ask your colleague for the count in room A and they say 30. Then room B: 40. Then room C: 30. But 30+40+30=100. So they are consistent. Now, if the colleague were just guessing randomly, the chance that three random numbers (within plausible bounds) would add to 100 is low. So you have evidence that they are reliable? But wait: they might be systematically biased but in a way that the biases add up to zero? For example, they always undercount by 10 in A and overcount by 10 in C? But then A would be 40 (true) -10, B 40 (true), C 30 (true)+10, so 30+40+40=110? That doesn't work. Actually, if the true counts are a, b, c (with a+b+c=100) and the colleague reports a+ε1, b+ε2, c+ε3, then we require (a+ε1)+(b+ε2)+(c+ε3)=100. Since a+b+c=100, we require ε1+ε2+ε3=0. So the errors are not independent: they are constrained to sum to zero. Therefore, if the errors were independent, it would be unlikely that they sum to zero. But in this case, if the colleague is unreliable and makes independent errors, it is unlikely they add to 100. So if we assume that the errors are independent (or random in some way), then consistency with the constraint is evidence that the errors are small? But we don't know the distribution of errors.

