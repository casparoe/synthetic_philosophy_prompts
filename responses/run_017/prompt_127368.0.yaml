prompt: |-
  I am a novelist, and I need a reusable procedure rather than an explanation.

  The situation: I am two drafts into the third book of a sequence whose narrator alternates between two point-of-view characters. One of them was trained, before the events of the books, in a discipline I have modelled closely on Nāgārjuna's Madhyamaka — the four-cornered negation, emptiness as the absence of intrinsic nature rather than as nonexistence, the two truths, and the practice of arguing by consequences drawn from an interlocutor's own commitments rather than from theses of one's own. In the fiction the school goes by another name, but for our purposes call it Madhyamaka. Across the manuscript there are roughly thirty scenes in which this character is put a direct question by someone else: a question with a yes-or-no shape, or a question asking her to state what she holds. I have to write her answers one at a time, months apart, and I want them to be consistent without being interchangeable, and I want them to be dramatically usable rather than miniature lectures. My readers have no philosophy background; my editor has no patience; the answers should almost never run past forty words.

  What I have in mind is a decision procedure I can run in a few minutes on each of these scenes: the ordered questions to ask about the question she is being asked, what counts as a determinate answer at each step, and where the procedure terminates in one of a small number of permitted speech acts. As inputs it should take only what I can write down about the scene: what is literally asked, what the asker is trying to do (learn something, trap her, force a public commitment, be reassured), and what she has to be able to do next in the plot.

  My working understanding, so you can correct it if it is wrong: for a claim the four corners are affirmation, denial, both, and neither; the point of running through them is not to select a corner or to announce a fifth, but to show that the question has no determinate subject to be settled; and this is compatible with, indeed requires, a robustly conventional answer for ordinary purposes — whether the bridge is guarded, whether she intends to cross it. I am trying to keep three failure modes out of the manuscript: the reader hearing her as a nihilist for whom nothing matters; the reader hearing her as a mystic trading on contradiction for atmosphere; and the reader hearing her as simply evasive, which is the failure my editor is most likely to flag.

  Two complications I want built into the procedure rather than smoothed over. First, the school I have given her adds a permitted move to the four: answering inside the asker's convention while marking the answer as borrowed rather than owned, which in my draft notes I have been calling "the lent answer," and I want the procedure to say when that move is honest and when it is a dodge. Second, she has to go on acting: the procedure must say what happens to agency and to the plot's stakes once a character has refused all four corners, since a scene in which the correct answer is silence and the next beat requires a choice is a scene I still have to write.

  Please give me the procedure, with a worked application to each of three scenes I will describe: a soldier asking her whether the bridge is guarded; a former teacher asking her, in front of students, whether she believes the self survives death; and a hostile magistrate asking her to state, for the record, whether the order she disobeyed was wrong. Then apply the procedure to one further case of your own choosing in which it returns an answer that is dramatically inert or otherwise unusable, and tell me what I should conclude — that the scene is wrongly built, or that the procedure has reached the limit of what it can settle. Finally, a short statement of what the procedure cannot do: which decisions remain matters of craft and judgment no matter how carefully the philosophy is done, and whether the residue is a defect of the framework or a sign that the framework is being asked to do something it never claimed to do.
reasoning: |-
  We are creating a decision procedure for a character trained in a Madhyamaka-like philosophy to answer yes-or-no or commitment-demanding questions in a consistent, dramatically effective way.

  The core idea: The character avoids affirming, denying, both, or neither in an ultimate sense, but may provide a conventional (lent) answer when necessary for practical purposes, while marking it as such if appropriate. The procedure must avoid nihilism, mysticism, and evasion.

  Steps of the procedure:

  1. **Identify the Question's Presuppositions**: What does the question assume exists inherently? (e.g., the bridge, the self, the order's wrongness). If the question has no inherent existence presupposition (e.g., a mundane practical question), then the lent answer is straightforward.

  2. **Determine the Questioner's Intent and Context**:
     - Why is the question being asked? (to learn, trap, force commitment, reassure)
     - What are the stakes? (public vs. private, immediate consequences for the plot)

  3. **Assess the Possibility of a Lent Answer**:
     - A lent answer is honest when:
          a) The question is about conventional reality and the answer is needed for practical action.
          b) The character can clearly mark it as conventional (e.g., "In the way you mean, ..." or "For now, ...") without undermining the plot.
     - It is a dodge when:
          a) The question is about a matter that the character must confront (e.g., a moral dilemma that the plot turns on) and avoiding ownership would be irresponsible or out of character.
          b) The context requires personal commitment (e.g., a vow, a confession).

  4. **Check for Traps**:
     - If the question is designed to force a contradiction (e.g., "Have you stopped beating your wife?"), then the character must avoid the lent answer and instead challenge the presupposition.

  5. **Determine the Character's Necessary Action**:
     - What must the character do immediately after? (e.g., cross the bridge, teach, face punishment). If action is required, a lent answer is usually necessary.

  6. **Select the Response Type**:
     - After analysis, choose one of:
          a) **Lent Answer**: Give a conventional answer, marked as such.
          b) **Challenge the Question**: Point out the inherent existence presupposition and reject the question's framing.
          c) **Silence**: Only if the question is fundamentally flawed and no lent answer is possible without perpetuating harm or falsehood, and if silence itself is a meaningful act in the context.
          d) **Reframe**: Answer by shifting the terms to a conventional framework without marking it as lent (if marking would be too disruptive) but only when the context allows for subtlety.

  7. **Enforce Brevity**: Keep under 40 words. Use precise language.

  Now, we apply this to the three given scenes and one of our own.

  ---

  **Scene 1: Soldier asks, "Is the bridge guarded?"**

  - **Presuppositions**: Assumes the bridge and its guarding status exist inherently. But in conventional terms, it's a practical matter.
  - **Intent**: The soldier wants to know for practical reasons (likely to cross safely). Not a trap.
  - **Lent Answer Honest?**: Yes, because the question is about conventional reality and action is needed (crossing or not). Marking the answer as lent is optional because it's clearly conventional.
  - **Trap?**: No.
  - **Necessary Action**: The character must decide to cross or not, so an answer is needed.
  - **Response Type**: Lent answer, unmarked (because over-marking might confuse the soldier and the reader in a simple scene).

  Example Answer (under 40 words): "Yes, by two archers and a pikeman." (This is conventional and practical.)

  ---

  **Scene 2: Former teacher asks, in front of students, "Do you believe the self survives death?"**

  - **Presuppositions**: The question assumes an inherently existing self that could survive. This is a deep philosophical issue.
  - **Intent**: The teacher is likely trying to trap her into a public commitment that contradicts her training or to discredit her in front of students. Also, it might be a test.
  - **Lent Answer Honest?**: A lent answer about conventional belief might be seen as endorsing the inherent existence of the self. However, in conventional discourse, people do speak of the self surviving. But marking it as lent is crucial to avoid owning the inherent view.
  - **Trap?**: Yes. Any direct yes/no would violate Madhyamaka. Both and neither are also problematic in public because they sound mystical or evasive.
  - **Necessary Action**: She must maintain her standing as a teacher and not mislead the students. She also must not lie.
  - **Response Type**: Challenge the question or give a lent answer with clear marking. Since it's public and among students, a teaching moment might be appropriate.

  Example Answer (under 40 words): "In the way you mean 'self' and 'survive', no. But we speak of continuity without a fixed essence." (This marks the lent answer and avoids inherent existence.)

  Alternative: Challenge the question: "The question assumes a self that could be permanent. But nothing has such inherent existence." (But this might be too long and didactic.)

  We choose the first to keep it under 40 words and dramatically usable.

  ---

  **Scene 3: Hostile magistrate asks, "State for the record whether the order you disobeyed was wrong."**

  - **Presuppositions**: Assumes that the order's wrongness is an inherent property and that the record is an ultimate account.
  - **Intent**: To force a public commitment that could be used against her (e.g., to convict of insubordination or to force her into a contradiction if she later obeys a similar order).
  - **Lent Answer Honest?**: A lent answer about conventional morality is possible (e.g., "It was wrong in that situation"). But marking it as lent might be seen as evasive by the magistrate and the reader. However, not marking might imply ownership of the inherent wrongness.
  - **Trap?**: Yes. Any answer may be used against her.
  - **Necessary Action**: She must not incriminate herself unnecessarily, but she must also not lie (for character consistency). The plot may require her to stand by her disobedience.
  - **Response Type**: Reframe the answer to focus on the conventional and contextual, without marking it as lent (because in a legal setting, marking might be taken as non-answer). Or challenge the question if the setting allows.

  Example Answer (under 40 words): "The order, given the circumstances, would have caused unnecessary harm. Therefore, I acted as I did." (This avoids the word "wrong" and focuses on the conventional context and her action.)

  ---

  **Scene 4 (our own): A child asks, "Is my mother in heaven?"**

  - **Presuppositions**: Assumes inherent existence of heaven, the mother, and an afterlife. Also, a yes/no is expected.
  - **Intent**: The child seeks reassurance and comfort. Not a trap.
  - **Lent Answer Honest?**: A lent answer is honest because the child needs comfort and the conventional truth (the child's culture believes in heaven) can be offered without endorsing inherent existence. However, marking it as lent (e.g., "In the way we talk about heaven...") would confuse the child and fail to comfort. So, marking is not feasible.
  - **Trap?**: No.
  - **Necessary Action**: The character must comfort the child and perhaps encourage virtuous action (e.g., "Your mother would want you to be kind").
  - **Response Type**: Lent answer without marking. But note: the character must answer in a way that is compassionate and conventional, even though philosophically she does not believe in inherent existence of heaven.

  Example Answer: "Yes, and she watches over you with love." (This is conventional and meets the child's need.)

  But wait: is this a failure of the procedure? The procedure allows a lent answer without marking when marking would be harmful or ineffective. However, the character is not being evasive because she is responding to the child's emotional need, not making a metaphysical claim. This is dramatically usable and consistent.

  However, if we are strict, we might worry that the character is lying. But in Madhyamaka, conventional truth includes using language and concepts as they are used in the world, especially for compassion. So it is acceptable.

  But what if the child asks, "But is she *really* in heaven?" Then we might need to shift to a reframing: "Heaven is a way we speak of the love that remains." Still, under 40 words.

  ---

  **What the Procedure Cannot Do**:

  1. **Character Voice and Nuance**: The procedure gives a type of response, but the exact wording must fit the character's voice and the scene's tone. This is a matter of craft.

  2. **Emotional Depth**: The procedure does not generate the emotional resonance of the answer. That requires the writer's skill.

  3. **Plot Integration**: Sometimes, the plot might require an answer that is not strictly philosophically ideal (e.g., to create tension by having the character break form). The procedure does not override plot necessity.

  4. **Ambiguous Contexts**: In some cases, the intent of the questioner may be unclear. The procedure relies on the author's interpretation of the scene.

  5. **Residue is Not a Defect**: The residue (craft, judgment) is not a defect of Madhyamaka but a sign that philosophy in fiction must serve the story. The framework was never meant to replace narrative art.

  **Conclusion for the Unusable Case**: We did not find an unusable case in our example. But suppose a scene where the character must take a stand that violates her philosophy for the plot (e.g., to save a life by swearing a false oath). The procedure might say: lent answer is a dodge (because it's a vow) and silence is not an option. Then the character must break form. This is a plot-driven decision, and the procedure flags it as beyond its scope.

  Thus, the procedure is a tool for consistency, but the story rules.
answer: |-
  Below is a reusable decision procedure for your Madhyamaka-trained character's responses to yes-or-no or commitment-demanding questions. It is designed to be efficient (usable in minutes per scene), consistent, and dramatically effective while avoiding nihilism, mysticism, and evasion. The procedure outputs one of four response types:  
  - **Lent Answer**: Borrowing the asker's conventional framework without endorsing inherent existence.  
  - **Challenge**: Rejecting the question's presuppositions outright.  
  - **Reframe**: Shifting the question to conventional terms without explicit marking.  
  - **Silence**: Withholding speech when no other option aligns with Madhyamaka.  

  ### **The Procedure**  
  Run these steps in order for each scene. Stop at the first determinate outcome (Steps 2, 4, 5, or 6). Use the inputs: (1) the literal question, (2) the asker's intent (learn, trap, force commitment, reassure), and (3) the character's necessary next plot action (e.g., cross a bridge, avoid arrest).  

  1. **Identify Presuppositions**:  
     - What inherent existence does the question assume? (e.g., a "self," "bridge," or "wrongness" as intrinsically real).  
     - *If no inherent-existence presupposition* (e.g., purely practical, like "Is it raining?"), proceed to Step 2.  
     - *If inherent-existence presupposed*, proceed to Step 3.  

  2. **Conventional Check** (for questions without inherent-existence presuppositions):  
     - **Lent Answer**: If the character must act (per plot input) and the answer enables that action (e.g., "yes" or "no" resolves uncertainty).  
       - *Mark as lent* only if:  
         - The asker expects ownership (e.g., in a formal commitment), OR  
         - Silence/refusal would escalate conflict pointlessly.  
       - *Do not mark* if marking distracts from action or makes the answer seem evasive.  
     - **Terminate**: Output the lent answer.  

  3. **Madhyamaka Core Check** (for inherent-existence presuppositions):  
     - Run the four-cornered negation mentally:  
       - Affirmation (yes)? Rejected (implies inherent existence).  
       - Denial (no)? Rejected (implies inherent nonexistence).  
       - Both? Rejected (illogical).  
       - Neither? Rejected (still implies a hidden "truth").  
     - *Outcome*: No corner is valid. Proceed to Step 4.  

  4. **Lent Answer Viability**:  
     - **Permitted** if:  
       - The asker seeks practical guidance (intent: learn or reassure), AND  
       - The character must act (per plot input), AND  
       - Marking it as borrowed ("In your terms..." or "Conventionally...") does not undermine the character's goals.  
     - **Dodge** (not permitted) if:  
       - The asker seeks a trap or forced commitment (intent: trap or force), OR  
       - Marking it would escalate danger (e.g., in a public trial), OR  
       - Silence/refusal has lower stakes than a misleading commitment.  
     - *If permitted*: Output a lent answer (marked if honest; unmarked if marking risks evasion or plot inertia).  
     - *If dodge*: Proceed to Step 5.  

  5. **Intent and Action Override**:  
     - **Challenge** if:  
       - The asker's intent is hostile (trap or force), OR  
       - The character gains leverage by exposing the question's flaws (e.g., in a debate).  
     - **Reframe** if:  
       - The asker seeks reassurance or learning, AND  
       - A conventional answer enables action without endorsing inherent existence (e.g., shifting to dependent origination: "It depends on...").  
     - **Silence** if:  
       - All other options imply harmful commitment (e.g., self-incrimination), AND  
       - Silence is a powerful act (e.g., protest, teaching moment).  
     - *Terminate*: Output the chosen response.  

  6. **Agency Safeguard** (if no outcome yet):  
     - Default to **Reframe** to ensure the character acts. Only use **Silence** if the plot allows inaction (e.g., walking away).  

  ### **Rules of Thumb**  
  - **Brevity**: Never exceed 40 words. Omit jargon.  
  - **Drama**: Prioritize responses that create tension (e.g., a lent answer under duress) or reveal character (e.g., a challenge that exposes hypocrisy).  
  - **Consistency**: All responses must imply:  
    - Emptiness: "Things exist conventionally, not inherently."  
    - Two truths: "This answer is practical, not ultimate."  
  - **Avoid Failure Modes**:  
    - Nihilism: Always enable conventional action.  
    - Mysticism: Never use paradox for "atmosphere"; reject both/neither.  
    - Evasion: Use lent answers sparingly; mark them when honest.  

  ---

  ### **Worked Applications**  
  #### **Scene 1: Soldier asks, "Is the bridge guarded?"**  
  - **Inputs**:  
    - Literal: Factual yes/no.  
    - Intent: Learn (practical guidance).  
    - Plot action: Character must cross or avoid bridge.  
  - **Procedure**:  
    1. Presuppositions: No inherent existence (bridge/guards are conventional objects). → Step 2.  
    2. Conventional Check: Lent answer permitted (enables action). Marking unnecessary (asker seeks simple data).  
  - **Output: Lent Answer (unmarked)**.  
    - "Yes, by three archers. Avoid the east side." (12 words)  
    - *Why?* Conventional, actionable, no evasion. Silence would stall the plot.  

  #### **Scene 2: Former teacher asks, in front of students, "Do you believe the self survives death?"**  
  - **Inputs**:  
    - Literal: Yes/no on belief.  
    - Intent: Trap (force public commitment to discredit her).  
    - Plot action: Character must uphold authority without endorsing inherent self.  
  - **Procedure**:  
    1. Presuppositions: Inherent self implied → Step 3.  
    3. Four corners rejected → Step 4.  
    4. Lent Answer Viability: Dodge (asker intends trap; marking as lent in public may seem evasive). → Step 5.  
    5. Intent Override: Challenge (hostile intent; exposing flaws teaches students).  
  - **Output: Challenge**.  
    - "The self you posit doesn’t exist. Death dissolves dependencies, not an essence." (11 words)  
    - *Why?* Rejects presupposition, avoids trap, uses scene to teach. Silence would cede authority.  

  #### **Scene 3: Hostile magistrate asks, "State for the record whether the order you disobeyed was wrong."**  
  - **Inputs**:  
    - Literal: Yes/no on moral judgment.  
    - Intent: Force commitment (to justify punishment).  
    - Plot action: Character must avoid self-incrimination but justify disobedience.  
  - **Procedure**:  
    1. Presuppositions: Inherent "wrongness" implied → Step 3.  
    3. Four corners rejected → Step 4.  
    4. Lent Answer Viability: Dodge (intent is hostile; marking as lent in official record risks seeming evasive). → Step 5.  
    5. Intent Override: Reframe (enables action by shifting to context).  
  - **Output: Reframe**.  
    - "The order ignored the suffering it caused. I chose to prevent harm." (11 words)  
    - *Why?* Answers conventionally without affirming inherent wrongness. Challenge ("Wrongness doesn’t exist") sounds nihilistic; silence implies guilt.  

  ---

  ### **Test Case: Your Own Choosing (Dramatically Inert Outcome)**  
  #### **Scene 4: A dying friend asks, "Will I cease to exist?"**  
  - **Inputs**:  
    - Literal: Yes/no on annihilation.  
    - Intent: Reassure (fear of oblivion).  
    - Plot action: Character must comfort without lying.  
  - **Procedure**:  
    1. Presuppositions: Inherent existence ("I") implied → Step 3.  
    3. Four corners rejected → Step 4.  
    4. Lent Answer Viability: Permitted (intent is reassurance; character must act to comfort). → Lent answer marked.  
  - **Output: Lent Answer (marked)**.  
    - "Conventionally, no. You’ll persist in memory and consequence, like a flame lighting others." (13 words)  
  - **Dramatically Inert?** Yes. In a high-emotion scene, marking ("conventionally") feels clinical, undermining warmth. Comfort is diluted, and the friend may perceive evasion.  
  - **Conclusion**: The scene is wrongly built. The asker’s need for emotional reassurance clashes with the procedure’s honesty requirement. Fix by revising the question (e.g., "Will I be forgotten?") to allow an unmarked lent answer ("No, your deeds remain"). The procedure flags when philosophy conflicts with human needs—here, it cannot resolve the tension without compromising one.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Craft Nuances**:  
     - Voice, subtext, and emotional cadence are yours. The procedure outputs response types, not dialogue. Example: A lent answer can be sharp ("Yes, if you insist") or weary ("In your terms, yes")—this is craft.  
  2. **Plot-Judgment Calls**:  
     - If "necessary plot action" is unclear (e.g., "must provoke a rebellion" vs. "avoid conflict"), the procedure cannot decide. You must define the action.  
  3. **Moral Ambiguity**:  
     - When a lent answer feels like a lie (e.g., comforting a villain), the procedure cannot weight ethics. It only checks for "dodge" per intent.  
  4. **Edge Cases**:  
     - If all options (lent/challenge/reframe/silence) risk plot stagnation, the procedure defaults to reframe—but you may need to break philosophy for drama (e.g., a rare affirmation to save a life).  

  **Residue as Framework Limit**: This residue isn’t a defect. Madhyamaka addresses truth, not narrative urgency. The procedure ensures philosophical consistency, but fiction requires bending convention for stakes, pacing, or emotion—this is where your artistry overrides. Emptiness isn’t a cage; it’s a tool for conventional action. Use it to serve the story, not strangle it.
