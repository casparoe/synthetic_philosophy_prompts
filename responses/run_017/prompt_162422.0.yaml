  Hmm, this is a fascinating challenge from a novelist. They need a piece of prose that fails on first reading but succeeds on later reading, based on Hofstadter's three-level message framework. The constraints are quite specific: no external clues, typography, or special knowledge allowed, and it must work when read aloud. 

  The key difficulty is creating something that's paraphrase-stable - meaning the literal content doesn't change when the inner message is understood. Most puzzles I can think of (like anagrams or wordplay) would violate this by altering the surface meaning. The "aha" moment needs to be about how the content is perceived, not what it says.

  I recall that perceptual shifts in ambiguous figures might be a good analogy here. Like the duck-rabbit drawing where the same lines convey different images. For text, perhaps syntactic ambiguity could work? But that usually resolves quickly. Semantic shifts might be better - where words have double meanings that only emerge when reading differently.

  The "garden path" concept comes to mind - sentences that mislead initially. But those usually get corrected immediately. What if the entire passage was structured to encourage misreading? Like using words that function as both nouns and verbs, arranged so the first parse seems coherent but misses a deeper layer.

  I'm considering a passage about "shedding" where the first read suggests discarding things, but on second read reveals growing new layers. This could create that frame/outer/inner distinction: 
  - Frame: "this is poetic prose about transformation"
  - Outer: "syntax and diction guide you to read literally"
  - Inner: "the cyclical nature of renewal"

  Testing it: on first read it seems like someone clearing space by removing old things. On second pass, noticing parallel structures ("what falls away makes room for what comes after") and verbs like "sprouting" shifts it to a growth metaphor. The paraphrase stays consistent ("things are replaced over time") but the meaning transforms from loss to regeneration.

  Biggest worry is whether this actually meets "paraphrase-stable." The words don't change, but is "shedding as growth" really the same proposition as "shedding as removal"? Maybe the duality is inherent - like how "dusting" can mean adding or removing dust. 

  For the diagnosis question: I think it's procedural failure. The reader has all the code (words/syntax) but applies the wrong interpretive operation first - reading for narrative action rather than metaphorical pattern. The counterargument would be that the inner message requires cultural familiarity with renewal myths, which I'd rebut by noting the text builds the metaphor internally through consistent imagery.

  Most vulnerable point? Probably whether the shift is truly text-driven. If readers don't spontaneously get it on reread without prompting, it fails. I'd need empirical testing to verify. Also the "shedding" word might be too ambiguous - if readers initially see both meanings, the effect collapses.

  This is delicate, but worth attempting. The passage draft will show if it holds.
