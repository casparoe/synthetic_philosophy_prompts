  ### Runthrough Notes  
  **Predictable Snags & Fixes:**  
  - **Sharp Clerk/Round 1:** If a clerk records extra 🟡 events (e.g., adds "Harbor Worker festival"), use prompts: *"Stick to the script—your job is admin, not community storytelling!"*  
  - **Archivist Savior/Round 2:** If archivists deliberately preserve 🟡, space rules penalize them (e.g., preserving 10 🟡 uses all 30 units = 0 ⚪ preserved). Highlight trade-offs.  
  - **Moral Lecture Vibe:** If students feel blamed, stress: *"This isn’t about evil people—it’s about how ordinary constraints (time, space) distort history."*  
  - **Research Round Fizzle:** If researchers spot gaps early, insist: *"You’re a 2000s grad student—you ONLY see what’s cataloged. No guessing!"*  

  **What Works Best:**  
  - **Visual Skew:** The wall display (⚪/🟡 counts) silently screams bias before debrief.  
  - **Constraints Drive Gaps:** Time/space pressures make skew inevitable without villainy.  
  - **Claim #3 Shortcut:** Archivists amplifying Round 1 gaps via cataloging *partially* shows compounding. For full effect, verbally add: *"Imagine this repeating for 100 years—gaps grow exponentially."*  

  **Prep Tonight:**  
  1. Print 60 event prompts (e.g., Tax: "⚪ Smith farm tax paid, 1920"; Complaints: "🟡 Harbor Workers strike, 1935").  
  2. Pre-make catalog forms (fields: ID, date, topic, summary).  
  3. Set up wall timeline (1900-1960) with masking tape; place cards during rounds.  
  4. Assign roles: 6 clerks (Round 1), 6 archivists (Round 2), 6 researchers (Round 3—3 pairs).  

  **Why This Fits Your Brief:**  
  - Students *feel* the claims: Clerks groan at time pressure; archivists agonize over space; researchers get frustrated by missing info.  
  - Villain-free: Points/scoring frame choices as resource-driven, not ethical.  
  - Debrief generalizes: Students articulate claims via guided questions.  

