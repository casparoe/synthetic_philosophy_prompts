  ### Portside Township Archive Simulation  
  **Fiction:** Portside Township (1900-1960) is a coastal town with fishing, farming, and a growing immigrant workforce ("Harbor Workers"). The Portside Township Administration (PTA) handles daily operations. Students simulate record creation (1900-1940), archival selection (1980), and research (2000).  

  **Core Mechanics:**  
  - **Record Creation (Round 1):** Clerks record events on index cards under time pressure.  
  - **Archival Selection (Round 2):** Archivists preserve/catalog records under space/budget constraints.  
  - **Research (Round 3):** Researchers answer a historical question using only the cataloged archive.  
  - **Visual Skew Display:** Colored dots on cards (⚪ routine majority / 🟡 problem-triggered marginalized group) make gaps visible during debrief.  

  **Materials:**  
  - 100 index cards (50 white, 50 yellow), markers, masking tape, star stickers.  
  - Printouts: Role instructions, event prompts, catalog forms.  
  - Projector: Display timers and research question.  

  **Roles & Constraints:**  
