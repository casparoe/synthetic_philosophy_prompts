prompt: |-
  I chair the taxonomy panel of a national wildlife listings board. We meet four times a year and decide, on a written record, whether a named population is to be treated as a distinct species for the purposes of a statute that protects species without ever defining the word. It is six to ten petitions a session. The decisions bite: a listing restricts land use across a wide area, unlocks recovery funding, and is appealable to a tribunal that asks only whether our reasons were adequate, not whether we were biologically right. The panel is three people — a systematist, a population geneticist, and me — and in any given case two of us are not specialists in the taxon on the table. We have about ten days per petition, the evidence is typically one mitochondrial gene tree, a handful of nuclear markers if we are lucky, a morphology table and some field notes, and the finding has to be short enough and plain enough that a non-specialist can follow it, and stable enough that we would reach the same answer again in five years on a different taxon.

  The panel has provisionally adopted one theoretical commitment, and I want it operationalized rather than argued for: that a species is a separately evolving segment of a population lineage, and that the familiar tests — reproductive isolation and interbreeding, monophyly and fixed diagnosable differences, ecological and adaptive distinctiveness, coalescent depth — are not rival definitions of the word but different kinds of evidence bearing on that single claim, which is why they so often disagree. Build the procedure on that, and do not spend the answer defending it.

  What I need is a decision procedure we can run in order, on the record, in the time we have. Specifically: the questions to ask in sequence; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the remaining question is one of values rather than facts. It must have explicit rules for the situations that actually recur — conflicting gene trees; mitochondrial signal contradicted by nuclear data; discordance that could be either incomplete lineage sorting or introgression; contact zones that were never sampled; names attached to a handful of nineteenth-century specimens with imprecise type localities; single-locus evidence; and straight absence of evidence. It needs a rule for when two independent lines of evidence confirm each other versus when we merely have more of the same kind of evidence, and a rule for how much weight the fact that a group is well studied may carry, given that well-studied groups attract more scrutiny and are therefore easier to split. Where a threshold is conventional — how much gene flow is too much, how much divergence is enough, over what time depth — say plainly that it is conventional and fix a default we can apply without reopening the argument each session. There should be three exits: recognize, do not recognize, and defer pending specified data, with deferral available only once per petition.

  Three devices are floating around the board and I want you to rule on them, keeping the ones that earn their place and saying what the others cost: a diagnosability floor, requiring that any recognized lineage be identifiable by a non-specialist from a stated set of characters with a stated error rate, with the absence of a usable diagnostic treated as a hard stop rather than a consideration to be weighed; a defeater clause, requiring each finding to name the single future result most likely to overturn it and to carry a review date; and a strict firewall requiring that the delimitation question and the protection question be voted and written separately, with no leakage from the second into the first — while still saying what the second question is allowed to be once the first is settled.

  Then run it on three hypothetical composites. First: two nominal forms of a stream-breeding salamander in one mountain range, with nine percent divergence at a mitochondrial gene, no fixed differences at four nuclear loci, a four-kilometre contact zone in which about a twelfth of animals are genotypically intermediate and laboratory crosses show no loss of hatching success, and a breeding-habitat difference between cold headwater seeps and warmer mainstem pools.

  Second: an all-female lineage of a freshwater fish that reproduces by gynogenesis — sperm from a sexual relative is needed to trigger development but, on present evidence, contributes no genes — which is morphologically diagnosable, carries a fixed hybrid karyotype, has been separate for something like sixty thousand years, uses a different habitat, is broadly sympatric with its host, and in which the rare paternal leakage reported in a related lineage has never been looked for.

  Third is the one I am dreading. A large, pale insular form of a widespread rodent, described as a full species in 1913, in every regional field guide, the mascot of two fundraising NGOs, protected for thirty years: genome-wide data now place it nested inside the widespread mainland lineage, with an estimated split around eight thousand years ago and gene flow continuing until roughly 1900, and with its three coat-colour loci and its body size plausibly under local selection. Give me the finding the procedure honestly yields. I would rather have a procedure that is sometimes wrong in a known direction than one that lets us steer, so do not bend it to keep this animal listed — tell me what the honest output is, what the protection question can legitimately rescue, and how much of that reasoning I can put in a public written finding.

  Finally, tell me what the procedure cannot do: where it will misfire, which kinds of organism defeat it outright, and which of its steps are judgment calls dressed up as method. Write for a reader with no library access, so no citations, no reading lists, and no appeal to what the literature has settled — just the procedure, the three applications, and the honest limits. Two pages for the finding format itself, if you can.
reasoning: |-
  Hmm, the user chairs a taxonomy panel for a national wildlife listings board. They need a decision procedure for determining if a population should be recognized as a distinct species under their statute. The panel meets four times a year, handles 6-10 petitions per session with limited time and evidence, and their decisions have significant legal and environmental impacts.

  The user has specified several key requirements: the procedure must be based on the "separately evolving segment" concept; it needs to handle common challenges like conflicting genetic data; it must have clear thresholds; and it should include specific devices like a diagnosability floor, defeater clause, and firewall between taxonomic and protection decisions.

  I'll develop a step-by-step procedure that addresses all these points. First, I'll outline the core sequence of questions the panel should ask, designed to systematically evaluate whether the population is a separately evolving segment. The questions will focus on evidence of evolutionary independence, starting with reproductive isolation and moving through genetic distinctiveness, ecological divergence, and diagnostic stability.

  For each step, I'll define what constitutes sufficient evidence and clear stopping points. For instance, clear evidence of reproductive isolation would lead directly to recognition, while conflicting genetic data might trigger specific evaluation rules. I'll incorporate the requested devices: the diagnosability floor as a hard stop if unmet, the defeater clause to identify what evidence could overturn the decision, and the strict firewall separating taxonomic status from protection considerations.

  Then I'll apply this procedure to the three hypothetical cases. For the salamanders, I'll show how conflicting genetic evidence and lack of reproductive isolation would lead to non-recognition. For the fish, the procedure would recognize it as distinct despite unusual reproduction due to multiple lines of evidence. For the rodent, I'll be honest that the data shows it's not a separately evolving segment, even though it's iconic and protected.

  Finally, I'll outline the procedure's limitations: where it might misfire (like with hybrid species), which organisms defeat it (those with horizontal gene transfer), and which steps involve disguised judgment calls (like interpreting gene flow levels). I'll keep everything practical and avoid academic references as requested, focusing on creating a transparent, consistent process that can withstand legal scrutiny while acknowledging its inherent limitations in complex biological realities.
answer: |-
  Here is a streamlined decision procedure based on your operational concept, designed for efficiency, transparency, and defensibility within your constraints. It incorporates your theoretical commitment, addresses recurring scenarios, integrates your three devices (with modifications), and provides explicit exits.

  **The Decision Procedure: "Separate Lineage Evaluation Protocol" (SLEP)**

  **Core Principle:** A "species" for listing purposes is a population lineage demonstrating *current or very recent* evolutionary independence (separate evolution). The procedure assesses evidence for this independence, recognizing that different data types reflect different aspects or timeframes of lineage divergence. Absence of evidence is not evidence of absence, but insufficient positive evidence results in non-recognition or deferral.

  **Sequence of Questions & Rules:**

  1.  **Is there compelling evidence of *current* reproductive isolation/disruption?**
      *   **Ask:** Is gene flow demonstrably absent or severely restricted *now*? Evidence: Direct observation of no hybridization in sympatry/parapatry; strong intrinsic postzygotic isolation (e.g., hybrid inviability/sterility); complete spatial isolation with no plausible dispersal.
      *   **Sufficient Answer (Yes):** Clear, direct evidence (field observations of sympatry without hybrids, strong experimental postzygotic barriers). Leads directly to **Recognize** (Exit 1). *Procedure stops here for "Yes".*
      *   **Sufficient Answer (No):** Evidence of ongoing, substantial gene flow (e.g., frequent hybrids in contact zone, lab crosses fertile). Leads to **Do Not Recognize** (Exit 2). *Procedure stops here for definitive "No" evidence.*
      *   **Insufficient/Unclear:** Lack of sympatry data, weak or only prezygotic barriers, conflicting reports, evidence suggests *historical* isolation but current contact unknown. *Proceed to Question 2.*

  2.  **Is there robust evidence of *genetic distinctiveness* indicative of sustained separation?**
      *   **Ask:** Do genetic data show significant divergence consistent with independent evolution? Evaluate: Coalescent depth (TMRCA), monophyly (especially nuclear), fixed differences, patterns of shared vs. private alleles, population structure (Fst etc.). Explicitly weigh mitochondrial vs. nuclear discordance.
      *   **Rules for Discordance:**
          *   **Mitochondrial Signal Alone:** Insufficient for recognition (can reflect female philopatry, selective sweeps, not lineage independence). *Proceed to Question 3.*
          *   **Mitochondrial + Nuclear Conflict:** Nuclear data generally outweighs mitochondrial data regarding *current* lineage status (mito can be introgressed). If nuclear shows panmixia/shallow structure despite deep mito divergence: **Do Not Recognize**. If nuclear shows structure but shallow/paraphyletic/polyphyletic, *Proceed to Question 3.*
          *   **Incomplete Lineage Sorting (ILS) vs. Introgression:** Assume ILS if divergence is *very* recent (<4Ne generations) and data fits neutral expectations. Assume introgression if divergence is deeper, contact is known/recent, and genomic clines/phylogenetic incongruence are strong. *Strong evidence of recent introgression pushes towards **Do Not Recognize**.*
      *   **Thresholds (Conventional Defaults):**
          *   **Monophyly:** Strong support (e.g., bootstrap >90%, posterior prob >0.95) for reciprocal monophyly in *nuclear* data preferred, but not absolute requirement if other evidence strong. Paraphyly generally = **Do Not Recognize** unless compelling evidence it's transient/artifactual.
          *   **FST:** >0.15 - 0.2 suggests significant differentiation (Default: FST > 0.15).
          *   **Fixed Differences:** >1 fixed difference in nuclear markers (considering sample size) is suggestive. >5 is strong evidence (Default).
          *   **Coalescent Depth (TMRCA):** Default: >200,000 years for vertebrates suggests sustained separation *if* other evidence aligns. Shallower depths require stronger ecological/morphological evidence. Very shallow (<50,000 yrs) generally insufficient alone.
      *   **Sufficient Answer (Yes):** Nuclear data shows strong structure (FST > 0.15), reciprocal monophyly OR multiple fixed differences (>5), *and* TMRCA >200,000 yrs (or equivalent depth evidence). Leads to **Recognize**. *Procedure stops here for "Yes".*
      *   **Sufficient Answer (No):** Nuclear data shows panmixia (FST ~0), or very shallow structure (FST <0.05, no fixed differences, TMRCA <50,000 yrs) *with no mitigating evidence*. Leads to **Do Not Recognize**. *Procedure stops here.*
      *   **Insufficient/Unclear/Mixed:** Data exists but doesn't meet "Yes" or definitive "No" thresholds (e.g., FST=0.1, 2 fixed differences, TMRCA ~100,000 yrs, paraphyly). *Proceed to Question 3.*

  3.  **Is there compelling evidence of *ecological/adaptive distinctiveness*?**
      *   **Ask:** Does the lineage occupy a distinct niche or show adaptive divergence significant enough to maintain separation or drive divergence despite potential gene flow? Evidence: Habitat partitioning (spatial/temporal), dietary differences, morphological adaptations linked to ecology, physiological tolerances, evidence of local selection.
      *   **Weight:** Evidence is strongest if it demonstrably *limits* gene flow (e.g., strong habitat association preventing mating) or shows adaptive divergence under selection *despite* gene flow (e.g., strong selection differentials at adaptive loci).
      *   **Independent vs. Same Kind:** Ecological evidence is considered a *different kind* of evidence (adaptive process) from genetic (pattern) or reproductive (mechanism). Strong ecological divergence + some genetic structure (even if weak) = independent lines. More genetic markers alone = same kind.
      *   **Sufficient Answer (Yes):** Clear, quantified niche differentiation (e.g., non-overlapping habitats in sympatry, significant dietary differences), *plus* associated morphological/physiological adaptations, *plus* evidence of selection (e.g., FST outliers at ecologically relevant loci). Leads to **Recognize**.
      *   **Sufficient Answer (No):** No discernible ecological differences, or differences are minor/not linked to adaptations preventing gene flow. Leads to **Do Not Recognize**. *Procedure stops here.*
      *   **Insufficient/Unclear:** Some ecological differences noted but not quantified, adaptive significance unclear, or conflicting observations. *Proceed to Question 4.*

  4.  **Diagnosability Floor (Operationalized Device):**
      *   **Ask:** Can the lineage be reliably identified by a trained non-specialist using defined, accessible characters (morphology, color pattern, possibly distinctive DNA barcode) with a stated error rate?
      *   **Rule:** **Hard Stop.** If no such reliable diagnostic exists (or cannot be defined based on available data), **Do Not Recognize**. (Rationale: Essential for enforceability of listing, prevents recognition of purely theoretical lineages). *Procedure stops here for "No".*
      *   **Sufficient Answer (Yes):** Clear diagnostic character(s) defined (e.g., "ventral spotting pattern: Form A has >10 spots, Form B has <5 spots, overlap rare <5%"), and error rate stated (e.g., "95% diagnosable based on trained observer"). *Proceed to Integration Step.*
      *   *Note:* This step acts as a gatekeeper *after* evidence for independence is assessed. It doesn't replace the evolutionary concept but makes it operational for the statute.

  **Integration Step (After Q4 or if Q1-3 yield "Insufficient/Unclear" but Diagnosability is met):**
  *   **Ask:** Considering the totality of evidence from Q1-3 (reproductive, genetic, ecological), does the weight of evidence support the lineage being a separately evolving segment *now or in the very recent past*?
  *   **Rules:**
      *   **Confirmation:** Requires at least **two independent lines of evidence** (e.g., Genetic + Ecological; Strong Reproductive + Genetic; Strong Ecological + Diagnosable Morphology reflecting adaptation) each providing *some* positive support (even if individually weak), *and* no *definitive* evidence *against* separation (e.g., ongoing high gene flow).
      *   **More of the Same:** Multiple genetic markers showing the same shallow structure is *one* line of evidence (genetic pattern). Multiple ecological observations of the same habitat preference is *one* line (ecological).
      *   **Well-Studied Groups:** Increased scrutiny *can* justify splitting on finer evidence, BUT only if the evidence meets the thresholds above. Default is **not** to lower thresholds for well-studied groups. The *burden of proof* is always on recognizing a split. Well-studied status mainly allows ruling out gaps in knowledge as a reason for deferral.
      *   **Absence of Evidence:** Not grounds for recognition. Only positive evidence counts.
  *   **Decision:**
      *   **Two Independent Lines + No Definitive Contra:** **Recognize**.
      *   **Less than Two Independent Lines OR Definitive Contra Evidence:** **Do Not Recognize**.
      *   **Gap in Critical Data:** **Defer** (Exit 3). Must specify *exactly* what data is needed (e.g., "Nuclear genomic data covering at least 1000 loci from individuals across the contact zone"; "Field observation of breeding interactions in the suspected sympatric area"). Deferral only available once per petition.

  **Incorporated Devices:**

  1.  **Diagnosability Floor:** Implemented as Question 4/Hard Stop. **Earns its place:** Essential for legal enforceability and practical conservation, prevents recognition of cryptic lineages without operational definitions. Cost: Will prevent recognition of genuinely independent but morphologically cryptic lineages that lack a usable marker. This is a necessary trade-off for your statutory context.
  2.  **Defeater Clause (Modified):** **Implemented.** Each finding must state: "The single finding of [Specific Data] would most likely overturn this recognition/non-recognition decision. Example: "Finding of ongoing, high-frequency hybridization (>10% of individuals) across the entire contact zone." **Earns its place:** Enhances transparency, focuses future research, signals provisionality of taxonomy. *Review date is omitted* (too administratively burdensome; status is reviewed if new petition with new evidence is submitted).
  3.  **Strict Firewall:** **Implemented.** Two distinct decisions:
      *   **Delimitation Decision (Taxonomy):** Solely "Is this a separately evolving segment (species) according to SLEP?" Votes and reasoning recorded solely on this basis. No consideration of protection consequences, rarity, threat, or popularity.
      *   **Protection Decision:** Only *after* delimitation is settled. Allowed considerations (if the entity is recognized): Population size, trends, threats, distribution, ecological function, feasibility of recovery. Allowed considerations (if *not* recognized as distinct): None. The widespread species' status is assessed separately. **Earns its place:** Prevents circular reasoning (protecting something *because* it's rare, then calling it a species *because* it's protected), ensures delimitation is biologically based. Cost: May lead to unpopular decisions where a biologically invalid "species" is delisted. This is the price of scientific integrity.

  **Application to Hypotheticals:**

  1.  **Salamanders:**
      *   Q1: Reproductive Isolation? Contact zone exists with hybrids (~8%). Lab crosses fertile. **Definitive NO (Ongoing Gene Flow).** -> **Do Not Recognize.** *Stop.*
      *   *Finding:* Population not recognized as distinct species. Substantial ongoing gene flow demonstrated in contact zone and laboratory. Mitochondrial divergence and habitat differences insufficient to demonstrate evolutionary independence in light of gene flow.
      *   *Protection Question:* Not applicable to this lineage alone. Conservation status of the widespread species should be evaluated.

  2.  **Gynogenetic Fish:**
      *   Q1: Reproductive Isolation? Unique gynogenetic mode constitutes *strong intrinsic prezygotic barrier* (requires specific sperm but doesn't incorporate genome). **Compelling YES.** -> **Recognize.** *Stop.*
      *   *Finding:* Population recognized as distinct species. Reproductive mode constitutes complete and intrinsic reproductive isolation from sexual relatives, despite sympatry. Morphological diagnosability and fixed karyotype provide supporting evidence.
      *   *Defeater:* Finding that paternal genome leakage is frequent and functionally significant in this lineage.
      *   *Protection Question:* Assess conservation status of this asexual lineage.

  3.  **Island Rodent:**
      *   Q1: Reproductive Isolation? Current isolation (island) presumed, but historical gene flow until ~1900. **Insufficient/Unclear** (Historical contact). Proceed.
      *   Q2: Genetic Distinctiveness? Genome-wide data shows it is nested *within* mainland lineage. Paraphyly. Gene flow until recently. **Definitive NO.** -> **Do Not Recognize.** *Stop.*
      *   *Finding:* Population not recognized as distinct species. Genome-wide data unequivocally places the island form within the genetic variation of the widespread mainland species, indicating historical and recent gene flow. Morphological differences (size, color) are likely locally selected traits within a single species.
      *   *Protection Question:* **Cannot** be applied to the island form *as a species*. However, the protection decision for the *widespread species* can explicitly consider: "The unique, morphologically distinct, and geographically isolated island population, representing significant local adaptation and evolutionary potential within the species, is a key component requiring specific conservation actions (e.g., habitat protection, genetic monitoring)." This reasoning is legitimate and can be fully stated publicly. It doesn't require taxonomic distinctness.
      *   *Defeater:* Finding that the genomic analysis suffered from critical methodological errors or misidentified samples.

  **Limits of the Procedure (Honest Assessment):**

  1.  **Misfires:**
      *   **Recent, Rapid Divergence:** Lineages diverging very rapidly via strong selection might show strong ecological/morphological distinctiveness and behave as separate species but lack deep genetic divergence or fixed differences. SLEP might **Do Not Recognize** if genetic/contact zone evidence is insufficient (Q2/Q3 unclear, fails Integration).
      *   **Ancient Hybrid/Allopolyploid Species:** Genomic evidence might show hybrid origin and lack monophyly relative to parents. SLEP (especially monophyly default in Q2) might struggle or **Do Not Recognize** if hybrid status blurs "separate lineage" signal, despite clear ecological/biological distinctness. Diagnosability Floor might save it if morphology is distinct.
      *   **Ring Species:** Contact between ends shows isolation, but evidence along the ring shows continuity. SLEP might recognize end lineages but struggle with intermediates or the whole complex.
      *   **Poorly Sampled Contact Zones:** Might **Do Not Recognize** due to lack of evidence against gene flow (Q1 Insufficient -> Q2 unclear -> fails Integration) when isolation actually exists in unsampled areas.

  2.  **Organisms that Defeat It:**
      *   **Obligate Hybridogens/Complex Clonals:** Where parentage is constantly required but the lineage persists (e.g., some *Ambystoma*, *Poeciliopsis*). Reproductive isolation (Q1) is messy. Relies heavily on Diagnosability and Ecology (Q3/Q4).
      *   **Extensive Horizontal Gene Transfer (HGT) Dominated Organisms:** Some microbes/fungi. The "population lineage" concept becomes blurred. Diagnosability Floor is also problematic. SLEP is not designed for these.
      *   **Extremely Cryptic Species:** Fails Diagnosability Floor (Q4 Hard Stop) even if genetically/ecologically distinct. Requires discovery of a diagnostic marker.

  3.  **Judgment Calls Dressed as Method:**
      *   **Weighing Conflicting Evidence (Q2):** Deciding if nuclear data "outweighs" mito, or if discordance is ILS vs. introgression, involves significant interpretation.
      *   **"Strong" Support in Genetics:** Defining "strong" for monophyly support values is conventional.
      *   **"Compelling" Ecological Evidence (Q3):** Judging the strength of adaptive divergence and its role in limiting gene flow is inherently qualitative.
      *   **"Independent" Lines of Evidence (Integration):** Deciding if ecology + morphology constitutes two lines (if morphology reflects adaptation) vs. one (if it's just description) involves judgment.
      *   **Totality of Evidence (Integration):** The final synthesis when evidence is mixed but potentially meets the "two independent lines" threshold is the core scientific judgment, though the rule structures it.

  This procedure provides a clear, sequential, evidence-based framework grounded in your theoretical commitment, operationalizes your key devices, delivers honest answers for your challenging cases, and explicitly acknowledges its limitations. It prioritizes defensibility and consistency on the record within severe time and data constraints.
