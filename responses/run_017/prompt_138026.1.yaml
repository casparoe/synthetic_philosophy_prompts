prompt: |-
  I sit on the four-person program committee of a private, non-profit public-lecture series: about thirty events a year, a decision needed inside a week, no counsel on call, and every refusal published with a one-paragraph justification. Our stated commitment is to open inquiry. I want a written procedure we can actually run on an individual invitation, not a statement of principles.

  Build it out of the paradox of tolerance, but I think the usual framing is too coarse to be usable, so please keep the following four distinctions apart unless you can argue they should be collapsed.

  1. A ladder of responses rather than a binary: legal or administrative suppression by the state; protest that physically prevents the event; declining to invite; disinviting after a pressure campaign; hosting but changing the format or adding a respondent. The classic Popperian argument is about the first of these; our actual powers are mostly the third, fourth, and fifth, and I suspect the argument does not transfer cleanly down the ladder.

  2. Content harm, which counter-speech in principle answers, versus platform harm: credentialing, audience aggregation, and the signal to sympathetic listeners that they are numerous. Counter-speech does not answer the second, because the injury is that the person was given the podium rather than anything he said from it.

  3. The predicate intolerant is itself vague and higher-order vague, with real borderline cases and no bright line. Say what the committee does in the penumbra, and whether it is pretending to discover a pre-existing fact there or openly exercising an authority to close a gap.

  4. Who bears the cost of a tolerant decision is usually not who makes it. Tell me what standing, if any, that asymmetry gives the cost-bearers in the procedure.

  Deliver: the ordered questions; what counts as a sufficient answer to each; the points where the procedure returns host, the points where it returns decline-and-publish-this-reason, and the points where it stops and hands a values question to the full committee; plus at least one check that stops us laundering viewpoint discrimination as safety or as community standards, ideally a test that forces any rule we invoke to be applied to the mirror-image speaker.

  Run it on three cases. First, an epidemiologist with genuine peer-reviewed work on vaccine safety who now claims, to a large following, that health agencies ran a deliberate cover-up, invited to speak on his published topic. Second, an already-invited evolutionary biologist whose research program concerns population differences in cognitive traits and who has made no political claims, where faculty in two departments have asked us to cancel. Third, as a check on vacuity, an avowed neo-Nazi who wants to speak about immigration. I expect the procedure to give me an answer on the second case that I will not like; say so plainly rather than softening it. Then say what the procedure cannot do.

  Write in American English, and end with one final line, set off on its own, in exactly this form: \answer{one sentence naming the single question the whole procedure turns on}.
reasoning: |-
  Hmm, the user is asking for a detailed procedure for a program committee that handles speaker invitations. They need a practical decision-making framework grounded in the paradox of tolerance, with specific attention to four key distinctions. 

  First, I need to unpack their four distinctions carefully. The ladder of responses is crucial because the committee's powers are limited to invitation decisions and event formats, not state suppression. They're right that Popper's original argument doesn't cleanly transfer down from legal suppression to disinviting. 

  The content-vs-platform harm distinction is sharp - counter-speech may address false claims but can't undo the legitimization effect of the podium itself. That's why the procedure must treat them separately. 

  The vagueness of "intolerant" is the trickiest part. I can't pretend borderline cases have clear answers, so the procedure must explicitly frame committee judgment as gap-filling authority when criteria are indeterminate. 

  The cost asymmetry point is ethical dynamite. Vulnerable groups disproportionately bear costs of platforming harmful speakers, so the procedure must formally incorporate their input without letting majoritarian pressure override core principles. 

  For the output structure, I'll build around sequential questions with clear exit points: host, decline-with-reason, or committee vote. The mirror-test checkpoint is non-negotiable - any rule must apply equally to opposing viewpoints to prevent viewpoint discrimination laundering. 

  Testing with their three cases: The epidemiologist case should pass because his claims, while controversial, engage his credentialed expertise. The evolutionary biologist is the hard case - the procedure will force hosting despite faculty objections because no intolerance triggers are met, though I'll note the discomfort. The neo-Nazi case cleanly fails all tolerance criteria. 

  The procedure's core limitation is defining the threshold for "undermining participation rights" - that's ultimately the hinge question. I'll put it in the requested \answer format verbatim.
answer: |-
  Here is a procedural framework incorporating your requirements, designed for operational use by your committee on individual invitations:

  **Decision Procedure: Speaker Invitation Assessment**

  **Ordered Questions & Sufficient Answers:**

  1.  **Does the speaker's proposed topic or *established pattern of advocacy outside the lecture* (if directly relevant to credentials/audience expectations) actively undermine the fundamental participation rights of identifiable groups within our community? (e.g., calls for legal disenfranchisement, violence, or exclusion based on inherent characteristics)**
      *   *Sufficient Answer:* Concrete evidence (recorded statements, publications, organizational affiliations demonstrating core advocacy) showing the speaker *actively works to deny* rights like voting, safety, equal protection, or access to public discourse *based solely on inherent characteristics* (race, religion, sex, national origin, etc.), and that this advocacy is relevant to their platform or audience draw. Mere controversial views or offensive speech is insufficient.
      *   *If YES -> Proceed to Q2.*
      *   *If NO -> Proceed to Q4.*
      *   *If BORDERLINE (genuine ambiguity on intent/target/severity) -> Stop. Flag for Full Committee Vote (Values Question).*

  2.  **Mirror Test: Would we apply the *exact same rule* invoked in Q1 to deny a platform to a speaker advocating the *direct opposite* position with comparable severity concerning a *different* group?**
      *   *Sufficient Answer:* Explicit statement demonstrating application consistency. (e.g., If rule denies platform for advocating disenfranchisement of Group A, it must also deny platform for advocating disenfranchisement of Group B).
      *   *If CONSISTENT -> Proceed to Q3.*
      *   *If INCONSISTENT -> Stop. Return to Q1 - Rule likely invalid viewpoint discrimination. Revise criteria.*
      *   *If BORDERLINE on consistency -> Stop. Flag for Full Committee Vote (Values Question).*

  3.  **Does the *primary anticipated harm* stem predominantly from the *content* of what the speaker is likely to say *during the lecture* on their invited topic, or from the *platforming effect* itself (credentialing, audience aggregation, signal amplification)?**
      *   *Sufficient Answer:* Analysis distinguishing harm mechanisms.
          *   *Content Harm:* Harm arises if false/dangerous claims are made *during the lecture* and believed. Counter-speech is the presumed primary remedy. *-> Proceed to Q4.*
          *   *Platform Harm:* Harm arises primarily from the act of invitation/amplification itself, legitimizing the speaker or movement, regardless of specific lecture content. Counter-speech is ineffective against this harm. *-> Outcome: Decline Invitation. Publish Reason (Q6).*
      *   *If MIXED/BORDERLINE -> Stop. Flag for Full Committee Vote (Values Question).*

  4.  **Is the speaker an expert presenting within their genuine domain of credentialed expertise on the invited topic?**
      *   *Sufficient Answer:* Evidence of peer-reviewed work, relevant advanced degrees, significant professional recognition *in the specific field* of the lecture topic.
      *   *If YES -> Outcome: Host (Standard Format).*
      *   *If NO (e.g., expertise misrepresented, topic outside expertise) -> Proceed to Q5.*
      *   *If BORDERLINE (e.g., interdisciplinary, emerging field) -> Consider Q5 factors; if still unclear, Stop. Flag for Full Committee Vote.*

  5.  **Is there a significant, specific risk that the event format (Q&A, solo lecture) will be severely disrupted or pose a measurable safety threat that cannot be reasonably mitigated?**
      *   *Sufficient Answer:* Specific, credible intelligence (e.g., past events violently disrupted, active threats known to police) indicating a high probability of violence or sustained disruption preventing the event. Speculation or general offense is insufficient. Mitigation plans (e.g., security, moderated panel) must be considered.
      *   *If YES, mitigation impossible/impractical -> Outcome: Decline Invitation. Publish Reason (Q6).*
      *   *If YES, mitigation possible -> Outcome: Host (Modified Format, e.g., with skilled moderator/respondent).*
      *   *If NO or risk low/uncertain -> Outcome: Host (Standard Format).*

  6.  **Reason for Decline (If triggered):** "The Program Committee declined this invitation because [Speaker Name]'s established advocacy, directly relevant to their platform, actively seeks to undermine the fundamental rights of [Identifiable Group] based on [Characteristic], as demonstrated by [Specific Evidence - e.g., 'their leadership in Organization X advocating for Y', 'their repeated public calls for Z']. Our commitment to open inquiry requires us to avoid platforming advocacy that aims to close inquiry or participation for others. This decision is made under our procedure section [Reference Qs 1-3]." *[Mirror Test implied by procedure]*

  **Procedure Outcomes:**
  *   **Host (Standard Format):** Triggered by Q4 YES, Q5 NO/risk low, or Q1 NO leading to Q4 YES.
  *   **Host (Modified Format):** Triggered by Q5 YES with mitigation possible.
  *   **Decline-and-Publish-Reason:** Triggered by Q3 Platform Harm, or Q5 YES (mitigation impossible).
  *   **Stop - Full Committee Vote (Values Question):** Triggered by Borderline in Q1, Q2, Q3, or unresolved Q4/Q5 after analysis.

  **Check Against Viewpoint Laundering:** The **Mirror Test (Q2)** is the critical check. It forces explicit consideration of whether any rule used to suppress is applied universally. Failure here invalidates the rule for that decision.

  **Case Applications:**

  1.  **Epidemiologist (Vaccine Cover-Up Claims):**
      *   Q1: Claims health agencies covered up safety data. Controversial, accusatory, potentially harmful if false, but *not* advocacy denying fundamental rights to an identifiable group based on inherent characteristics. **NO.**
      *   Q4: Genuine expert speaking on peer-reviewed work within his field. **YES.**
      *   Outcome: **Host (Standard Format).** (Content harm addressed via potential counter-speech/Q&A; platform harm insufficient under Q1 threshold).

  2.  **Evolutionary Biologist (Population Differences, No Politics, Faculty Pressure):**
      *   Q1: Research on population differences in cognitive traits. *Without* accompanying political claims advocating denial of rights, this is controversial research, not *intolerant advocacy* per Q1. Faculty pressure based on potential misuse is not evidence the *speaker* advocates intolerance. **NO.**
      *   Q4: Genuine expert speaking within expertise. **YES.**
      *   Outcome: **Host (Standard Format).** *You will not like this.* The procedure finds no trigger for decline under the strict Q1 definition or platform harm (Q3). Faculty objections represent anticipated content harm or disagreement, addressed by Q4 expertise and counter-speech. Disinviting based solely on pressure over the *topic* would likely fail the Mirror Test (Q2) if applied to, say, a speaker on societal impacts of religion.

  3.  **Avowed Neo-Nazi (Immigration Topic):**
      *   Q1: Avowed neo-Nazi ideology *inherently advocates* for the denial of fundamental rights (existence, equality) to Jews, minorities, LGBTQ+ people, etc., based on race/religion/identity. This is core to the ideology and relevant to his platform/audience. **YES.**
      *   Q2 (Mirror Test): Would we deny a platform to a speaker advocating the violent overthrow of the state or disenfranchisement of white people based *solely* on their race? If yes (and it should be), the rule is consistent. **CONSISTENT.**
      *   Q3: Primary harm is Platform Harm. The act of platforming a neo-Nazi inherently legitimizes, aggregates, and signals acceptability to sympathizers, regardless of the specific immigration claims made. Counter-speech doesn't undo this credentialing. **PLATFORM HARM.**
      *   Outcome: **Decline Invitation. Publish Reason (Q6).** (Q5 safety may also be triggered, but Q1/Q3 are sufficient).

  **What the Procedure Cannot Do:**
  *   Guarantee unanimous agreement or eliminate discomfort with decisions.
  *   Prevent external criticism or pressure campaigns.
  *   Resolve deep philosophical disagreements within the committee about the boundaries of "inherent characteristics," "fundamental rights," or the severity required in Q1. These remain values judgments at the borderline, hence the Full Committee Vote step.
  *   Eliminate the risk that a speaker uses the platform to later promote intolerance *outside* the lecture, though the Q1 assessment considers *established patterns*.
  *   Force counter-speech to be effective; it only assumes it is the designated remedy for content harm.
  *   Perfectly distribute the costs of tolerance; it only provides a structured, viewpoint-neutral process for the platforming decision itself.

  \answer{whether the speaker's advocacy actively undermines the fundamental participation rights of identifiable groups.}
