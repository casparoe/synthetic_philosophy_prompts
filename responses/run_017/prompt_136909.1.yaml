prompt: |-
  Hey — I'm drafting a short paper arguing that Strawson's account can't be the whole story about moral responsibility, because an agent can be fully responsible while the participant stance toward them just isn't available. So I need a case where the two come apart, and I keep produceing ones that cheat.

  Build me a scenario — a workplace or a family, one paragraph max, two named people with an actual relationship — where the agent is straightforwardly morally responsible for a real, harmful wrong and their conduct manifests a genuinely bad quality of will (so a quality-of-will / blame-judgment view, along the lines of Hieronymi's or Scanlon's, says blame is apt), and yet resentment and indignation are unfitting and the objective attitude is what's called for.

  The hard part, and the reason my own attempts keep failing: the unfittingness can't come from the agent's psychology or capacities and it can't be an excuse. So no manipulation by anybody, no coercion, no brain or neurology stuff, no Frankfurt-style device, no 'they couldnt have done otherwise', no psychopathy, childhood or mental illness — nothing that slots them into Strawson's exempting or excusing categories. It also can't be a consequentialist point about how resenting them would go badly, or be bad to express; the reactive attitudes have to be unfitting in themselves, not just inadvisable. My hope is that whatever does the work is relational or situational — something about who is relating to whom, or where the two of them stand. No making the wrong trivial either, and no letting a third party's fault carry the weight.

  Then: say what Strawson's own view and the quality-of-will view each say about your case and why they diverge there, name the single feature that's doing the work, tell me what the case becomes if you remove that feature (does it collapse back into an ordinary excuse case?), and tell me how someone who thinks responsibility just *is* aptness for the reactive attitudes would attack it — I want to know I'm not stipulating the verdicts.

  End with \answer{...} naming the feature that does the work, in six words or fewer.
