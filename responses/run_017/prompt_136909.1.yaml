answer: |-
  ### Scenario:  
  James, a senior manager and mentor to his junior colleague Emma, invests years in her professional development. When Emma is denied a promotion she believes James should have advocated for, she retaliates by anonymously posting false allegations of misconduct on the company intranet, causing James significant reputational and emotional harm. Emma’s act manifests ill will—she intends to damage James out of spite. James, recognizing her blameworthiness, nonetheless finds that resentment is unfitting. As her mentor, his role demands he prioritize her growth with an objective, problem-solving attitude, even when personally wronged.

  ### Analysis:  
  - **Strawson's view**: Strawson would argue that moral responsibility is constituted by the aptness of reactive attitudes like resentment and indignation. Here, Emma is a full moral agent (no exemption or excuse), so Strawson would expect resentment from James to be fitting. If James cannot adopt the participant stance, Strawson might insist this implies Emma isn't truly responsible *to James* in this context—thus collapsing responsibility into the reactive attitudes' applicability.  
  - **Quality-of-will view (e.g., Hieronymi/Scanlon)**: Emma is morally responsible because her action reflects a blameworthy quality of will. Blame is apt as a judgment of her ill will, but James' role as mentor makes resentment unfitting—not due to Emma’s psychology, but because the mentor-mentee relationship requires an objective attitude focused on growth, overriding the personal reactive stance.  

  ### Key Feature:  
  The single feature doing the work is **the victim's role-based duty to maintain objectivity**. This is relational, arising from James' institutional position as mentor, and situational, as it binds him to Emma regardless of her wrongdoing.  

  ### Without the Feature:  
  Remove James' mentorship role—e.g., he is merely a colleague—and resentment becomes fitting. The case then reverts to an ordinary blame scenario with no relational constraint, exposing Emma’s ill will as straightforwardly warranting reactive attitudes.  

  ### Strawsonian Attack:  
  A Strawsonian would argue that James' inability to resent Emma reveals she isn't genuinely responsible *to him* in this relationship, as responsibility just *is* aptness for reactive attitudes. They might contend that James' role modifies the norms of the relationship, exempting Emma from the participant stance in this context—effectively turning the case into a disguised exemption. This challenges the scenario by insisting that if reactive attitudes are unfitting, responsibility must be absent, denying the possibility of their divergence.  

  \answer{victim's role requiring objectivity}
