     - Available exceeds experiential: There is more available than experienced (e.g., unconscious processing that is available).
     - Partial overlap: Some overlap but also independent parts.
     - One notion is confused: Either P or A (or both) is too confused to bear weight.

  2. The level of availability:
     - Personal-level: Available for reasoning, voluntary action, and report (i.e., to the "person" as an agent).
