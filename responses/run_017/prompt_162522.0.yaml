  First, I need to parse each case and their verdict. Cases 1, 2, 3, and 8 are proper for direct votes, while 4, 5, 6, 7, 9, 10 are not. Case 11 is undecided. The inconsistencies are in areas like political boundaries (1 vs 7), life/death issues (4,5 vs 8), and petition-driven vs council-initiated referendums.

  Looking at their tentative principle: determinate options, no trade-offs, no harm to defenseless minorities. But their verdicts don't all align. For example, case 7 (Brexit) isn't determinate, but case 1 (town merger) is fuzzy too. Why accept one but not the other? The difference might be scale or reversibility. 

  On life/death issues, allowing assisted dying (8) but not death penalty (4) or minaret bans (5). Their reasoning about imposing vs permitting might be shaky. They suspect it's special pleading. Maybe the principle needs to account for minority rights more clearly.

  The petition vs council distinction might be about legitimacy or avoiding populism. But is that principled or just bias?

  To create a coherent principle, I need to reconcile these. The core seems to be about boundedness: decisions that are reversible, financially contained, and don't bind future choices. Also, procedural legitimacy matters—council-initiated vs petition might reflect careful deliberation vs reactive campaigns.

  For the unresolved case 11 (treaty ratification), it's both bounded and binding. Their ambivalence makes sense. The principle might allow it if it's self-contained but reject if it ties future governments' hands.

  Advisory referendums could be acceptable since non-binding. Citizens' assemblies might be better for complex issues. Minimum turnout depends on legitimacy. A vote on whether to vote might be meta but not necessary. Secession with 20% electorate is tricky—needs clear terms and supermajority perhaps.

  Now, conflicts: Cases 1 and 7 both involve boundaries. If the principle emphasizes determinate options, case 7's vagueness is the issue, but case 1's fuzziness is acceptable because it's local and reversible? Or maybe scale matters—local vs national impact. The user needs to decide if reversibility is key. If so, borrowing for a tram (2) is reversible? Or is it sunk costs? 

  For life/death cases, perhaps the principle should protect minorities from majority imposition, but allow opt-in choices like assisted dying. Minaret ban (5) imposes on Muslims, death penalty (4) on convicts, both vulnerable. Assisted dying permits choice. That distinction might hold, but they're unsure. Maybe emphasize consent: policies forcing something on unwilling groups vs allowing voluntary actions.

  Petition vs council: if the principle includes procedural safeguards, council-initiated referendums might have more oversight, making them more legitimate. But is that consistent? The user might need to accept that their discomfort with petitions is valid if campaigns are misleading.

  The final principle could be: Direct votes are proper for decisions that are operationally bounded (local, reversible), procedurally initiated by representative bodies, and don't impose irreversible harm on minorities without consent. 

  This fits most cases. For secession, it should require clear terms and supermajority. Case 11 (treaty) is borderline; if it's self-contained, maybe allow, but the 30-year bind is problematic. The user might need to accept that case 11 shouldn't be a referendum due to binding future governments.

  Inconsistencies: They might need to drop the fuzzy option acceptance in cases 2 and 3 or re-evaluate case 7. Alternatively, clarify that fuzziness is tolerable at local levels but not national. Or emphasize that case 7 had broader implications beyond just leaving, making it indeterminable.

  Overall, the key is balancing determinacy, reversibility, minority protection, and procedural legitimacy. The user should decide if their trust in council-initiated referendums is principled or pragmatic. Resolving the life/death inconsistency might require embracing the consent distinction or adjusting their stance on assisted dying if it conflicts. But the consent angle seems defensible.
answer: |-
  **Bottom line:** Your verdicts are best explained by **three core principles**, with Case 7 (Brexit) being the outlier requiring revision to fit a coherent framework. No single principle suffices.

  **The Principles & Supporting Cases:**

  1.  **Boundedness:** The decision must be operationally bounded in scope, cost, and reversibility, avoiding irreversible commitments or systemic constraints on future democratic choice.
      *   *Forces:* Cases 9 (supermajority tax rule), 10 (self-amending referendum), 11 (30-year treaty - ambivalence), 6 (tax hike needing trade-offs), 7 (Brexit - outlier). Contrasts with 1 (town merger), 2 (tram/levy), 3 (housing dev).
  2.  **Minority Safeguard:** Direct votes are improper when they primarily dispose of fundamental rights, liberties, or vital interests of identifiable minorities who cannot adequately defend their interests through the majoritarian process.
      *   *Forces:* Cases 4 (death penalty), 5 (minaret ban), 8 (assisted dying - distinction based on imposition vs. permission). Explains the tension between 4/5 vs. 8.
  3.  **Procedural Legitimacy (Initiation):** The question's placement on the ballot should originate from a representative deliberative body (e.g., council/legislature), not via signature petition, to ensure framing integrity and mitigate populist circumvention.
      *   *Forces:* Case 14 (unease with petition drives vs. council-initiated).

  **Verdicts the Principles Cannot Accommodate & Required Revision:**

  *   **Case 7 (Brexit):** Your "not proper" verdict *cannot* be fully accommodated without contradicting the acceptance of fuzzy-but-bounded local decisions (Cases 1, 2, 3) or the primacy of minority safeguard (which isn't the core objection here). The principles demand revision: **Case 7 should be deemed "proper"** *if* (and only if) the question was bounded (e.g., "Leave under Article 50, triggering a defined 2-year negotiation period") *or* "not proper" due to its massive systemic unboundedness and irreversibility *despite* the boundary change similarity to Case 1. The latter is more consistent with Principle 1 (Boundedness). **You should revise Case 7 to "not proper"** (aligning with your original verdict) based on its extreme *unboundedness* and irreversibility, overriding the surface similarity to Case 1. (Principle 1 forces this revision).

  **Accommodated Verdicts Needing Nuance (No Revision Needed):**

  *   **Cases 1 vs. 7 (Boundaries):** Principle 1 (Boundedness) resolves this. Town mergers (1) are typically administratively contained and potentially reversible legislatively. Brexit (7) is systemically unbounded, irreversible, and had no defined end-state. The fuzziness in 2/3 is acceptable because it's local and bounded within the town's operational sphere.
  *   **Cases 4/5 vs. 8 (Life/Death):** Principle 2 (Minority Safeguard) resolves this. The death penalty (4) and minaret ban (5) *impose* harm/deprivation on vulnerable minorities (condemned individuals, religious minorities). Assisted dying (8) *permits* an action for consenting individuals; it doesn't impose harm *on an unwilling minority*. The distinction holds. Your suspicion of special pleading is unfounded here; it's a valid distinction based on imposition vs. permission concerning fundamental rights.
  *   **Case 14 (Petition vs. Council):** Principle 3 (Procedural Legitimacy) directly validates your unease with petition drives.

  **Verdicts on Unsettled/New Cases:**

  *   **Case 11 (30-Year Treaty Ratification):** **Not proper.** While "large, determinate, self-contained" superficially appeals, the 30-year binding commitment violates Principle 1 (Boundedness) by severely constraining future democratic choice and being highly irreversible. It resembles the rule-changing you object to in Cases 9/10.
  *   **Advisory Referendum:** **Permissible more widely.** Since non-binding, it avoids the Boundedness constraint. Concerns about Minority Safeguard (Principle 2) or Procedural Legitimacy (Principle 3) still apply, but the lack of direct legal force makes it a more flexible tool for gauging public sentiment on complex issues (e.g., could be acceptable for Case 6).
  *   **Citizens' Assembly (Selected by Lot, Binding Power):** **Potentially proper for complex/high-stakes bounded decisions.** This addresses weaknesses of mass direct democracy (framing, deliberation, minority voice) while retaining "direct" legitimacy via sortition. Could be suitable for Cases 8 or even carefully framed versions of 4/5/6 where Principles 1 & 2 are met, bypassing Principle 3 concerns about initiation if properly mandated.
  *   **Minimum Turnout/Quorum Rule:** **Generally improper for validity.** Undermines the majoritarian principle by allowing a minority to block decisions through apathy. Can be a *pragmatic* requirement for legitimacy perception (e.g., 50%+1 of 40% turnout), but not a principled necessity. Its absence doesn't invalidate your framework.
  *   **Vote on Whether to Hold a Vote:** **Usually unnecessary, potentially improper.** Adds procedural bloat. Could be justified only for decisions of extraordinary, unprecedented scope (e.g., drafting a wholly new constitution) where the *act* of initiating the referendum process itself requires major legitimacy. Not needed for standard referendum subjects fitting Principles 1-3.
  *   **Secession (Seceding Region = 20% of Electorate):** **Not proper via simple referendum.** Violates Principle 1 (Boundedness - massively unbounded, irreversible) and Principle 2 (Minority Safeguard - profoundly impacts the entire nation, including those in the remaining 80%). Requires extraordinary constitutional processes, supermajorities, and likely negotiation, not a simple majoritarian vote of the seceding region alone. The 20% size doesn't overcome these fundamental objections.
