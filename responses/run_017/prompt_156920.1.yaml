prompt: |-
  I am a novelist, finishing a book set in a small provincial town in the 1930s, and I am stuck on a word. Two scenes in the manuscript have, I now realise, the same shape. In the first, a young woman signs over the family workshop to a charming outsider who has been courting her: every figure he has given her is accurate, he has answered every question truthfully, there is no threat and no penalty attached to refusal, she is of age, sharp-tongued, and she says yes twice — once to him, once, alone, to her oldest friend. But no one in that town, in that year, refuses him. Not because refusal is punished, but because it has never been done: there is no sentence in circulation, no story anyone can tell, in which a woman in her position declines. In the second scene, an injured man agrees to an operation that will cost him a great deal and benefit him only modestly. He can recite the risks back to the surgeon; he is not confused; nobody is pressuring him. Yet saying no is, in his mind, not "declining an operation" but "being the sort of man who abandons his family" — and he says, much later, that his yes was the only thing he could have been. In both cases the usual three tests come back clean: no coercion in any sense that involves a threat or a worsened alternative, no communicated falsehood, no failure of competence. And yet the yes feels as if it belongs to the situation rather than to her, or to him: what they are choosing between is not quite what is on offer.

  I have tried on the obvious words and none of them fit. Coercion is too strong — nothing has been made worse for them if they decline. Deception seems wrong too: I have read enough to know the common test is roughly "would she still have consented had she been told the truth?", and here the answer is yes, since they were told the truth about every fact anyone would call relevant. Competence is the wrong shelf entirely; both characters reason perfectly well. What I am after is a name for a failure of the *option space* rather than of the information, the will, or the threats: the agent's alternatives are all present, but the meaning each of them carries for her has been fixed by something other than her own judgement, so that one option is unthinkable and another is inflated into the only thing a decent person could do. A philosopher at a dinner party last month mumbled something that sounded like "hermeneutic" something, and I lost the thread; if that is the right neighbourhood I would like to be told, but a bare label will not help me. Please tell me what exactly this phenomenon is, how it differs from the three standard consent-invalidators and from anything else nearby that it might be confused with, whether it actually invalidates consent or is instead a separate complaint one can make about a transaction whose consent was genuinely valid, and where its edges are — I need to know which nearby cases are *not* instances of it, because my narrator has to name it in about four words of dialogue and I cannot have her name it wrongly. I am on a residency in a village with no library, so please do not send me to books or authors; argue it out in your own terms.

  After your prose answer, append a single JSON object with exactly these fields, and nothing else inside it:

  - "best_label": the name you settle on, existing or coined (string)
  - "label_status": one of "established", "established but narrower than my case", "no established term" (string)
  - "definition": one or two sentences, in terms a non-specialist would accept (string)
  - "test": an array of exactly three conditions that must all hold for the phenomenon to be present (array of strings)
  - "nearest_concepts": an array of three or four objects, each with keys "concept", "where_it_overlaps", "where_it_breaks_down" (array of objects)
  - "scene_verdicts": an array of two objects, one per scene, each with keys "scene" ("workshop" or "operation"), "applies" ("yes", "no", or "partly"), "reason" (array of objects)
  - "boundary_cases": an array of two invented cases that sit right at the edge, each with keys "case", "verdict", "what_would_flip_the_verdict" (array of objects)
  - "consent_status": whether, on your view, the phenomenon makes consent invalid, merely tainted, or leaves consent valid while grounding a different complaint — with one sentence of justification (string)
  - "line_for_dialogue": four or five words my narrator could plausibly say aloud (string)
reasoning: |-
  Hmm, the user is a novelist working on a book set in a 1930s provincial town. They're stuck on describing a specific phenomenon where characters consent in situations that feel predetermined by social or narrative pressures. The core issue is that the "yes" feels inevitable not due to coercion, deception, or incompetence, but because the option space itself is constrained by unspoken norms. The user needs a precise term for this, along with analysis to distinguish it from similar concepts.

  Breaking down the scenes: In the workshop scene, the young woman's consent is shaped by the absence of any cultural script for refusal. Her choice isn't between "yes" and "no" but between "yes" and "being unimaginable." In the operation scene, the man's consent conflates medical refusal with moral failure. Both characters have factual understanding and face no threats, yet their decisions feel externally scripted.

  The user explicitly rejects "coercion" (no worsened alternative), "deception" (all relevant facts disclosed), and "incompetence" (both reason well). They mention a philosopher's hint about "hermeneutic" something—likely pointing to hermeneutical injustice or similar concepts in philosophy of language, where marginalized groups lack vocabulary to articulate experiences. But this seems broader than their case.

  Key requirements from the user: 1) A label (existing or coined) that fits both scenes. 2) Clear differentiation from standard consent invalidators. 3) Analysis of whether consent is invalid or merely ethically problematic. 4) Boundary cases to test edges. 5) A 4–5 word phrase for dialogue. They're isolated with no library access, so the answer must be self-contained.

  Researching possible terms:  
  - **Social scripting**: Captures how norms pre-write roles but is vague about constraint.  
  - **Hermeneutical constraint**: Closer but emphasizes epistemic gaps rather than choice architecture.  
  - **Normative foreclosure**: Best fit—suggests norms actively eliminate alternatives. "Foreclosure" implies options are sealed off before deliberation.  

  For the JSON:  
  - **best_label**: "Normative foreclosure" (coined, as no perfect established term).  
  - **label_status**: "no established term" since it adapts philosophical ideas.  
  - **definition**: Focuses on how norms shrink the option space by attaching inflated meanings.  
  - **test**: Three conditions: factual competence, no coercion/deception, but options carry rigid meanings beyond individual judgment.  
  - **Boundary cases**: E.g., a woman refusing marriage due to unseen financial abuse (verdict "no" – coercion present) vs. refusing due to personal ambition (verdict "no" – judgment intact).  
  - **consent_status**: Consent remains *valid* but ethically tainted; justification: the choice is real but context denies meaningful alternatives.  
  - **line_for_dialogue**: "Choices scripted before spoken" – compact and thematic for a novelist.  

  The analysis must stress that this isn't about false consciousness; both characters act rationally within their constrained universes. The ethical flaw lies in the *situation*, not their cognition.
answer: |-
  ### Analysis of the Phenomenon

  You're describing a profound constraint on agency where an individual's choice is distorted not by external threats, misinformation, or cognitive failure, but by the *meaning* attached to the alternatives through unspoken social narratives. The characters aren't choosing between abstract options; they're navigating predefined roles and identities. Refusal isn't evaluated neutrally—it's laden with existential weight (e.g., "abandoning one's family" or "defying an unbroken tradition") that makes it psychologically or culturally unavailable. This is a **failure of the option space**: the alternatives are technically present, but their social-semantic framing renders one path unthinkable and the other inevitable. Consent is "valid" in the narrow legal or procedural sense but ethically hollow because it arises from a distorted choice architecture.

  ### Key Distinctions from Standard Consent-Invalidators
  - **Coercion**: Absent here. No threat worsens their position if they decline (e.g., the workshop woman faces no penalty; the surgeon pressures no one).  
  - **Deception**: Absent. Both parties disclose material facts truthfully.  
  - **Incompetence**: Absent. Both characters reason soundly about facts and risks.  

  ### The Hermeneutic Connection
  The philosopher likely referenced **hermeneutical injustice** (coined by Miranda Fricker), where marginalized groups lack the concepts to articulate their experiences. This *overlaps* with your cases—your characters lack narratives for refusal—but *differs* crucially:  
  - **Overlap**: Both involve a gap in shared social understanding.  
  - **Breakdown**: Hermeneutical injustice focuses on *epistemic disempowerment* (inability to comprehend/express harm). Your characters *understand* their situation perfectly; the issue is the *normative weight* of options, not comprehension.  

  ### Core Concept: Normative Foreclosure
  I propose **normative foreclosure** as the label. It captures how social norms "foreclose" certain choices by attaching intolerable identities to them ("coward," "traitor," "unnatural woman"). The consent emerges from a script written by collective expectation, not individual judgment.  

  ### Why Other Concepts Don't Fit  
  - **False consciousness**: Implies delusion about self-interest; your characters aren't deluded.  
  - **Ideology**: Too broad; ideology enables normative foreclosure but isn't identical.  
  - **Social scripting**: Describes role-based behavior but doesn't emphasize the *elimination* of alternatives.  

  ### Verdict on Consent Validity  
  Consent remains **valid but ethically tainted**. The characters meet procedural standards (voluntary, informed, competent), but the choice lacks moral autonomy because the option space is colonized by narratives they didn't author. The complaint is about *structural injustice*, not invalid consent.  

  ---

