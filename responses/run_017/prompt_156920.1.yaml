  ### Key Clarifications for Your Narrator  
  - **Why 4 words?** "Choices scripted before spoken" distills the core: social narratives pre-write the decision.  
  - **Boundary guidance**: If a character *could* refuse without existential dread (e.g., "I just don't want to"), it's not normative foreclosure—it's ordinary choice. If refusal is punished (even socially), it veers toward coercion.  
  - **Not a synonym for pressure**: Mere social expectation (e.g., "Everyone votes yes") isn't enough; the refusal must feel *identity-shattering*.  

  Use this to let your narrator articulate the invisible cage. The term is yours to coin—it fits the era, as "foreclosure" was used in psychology/sociology by the 1930s.
