  ### Decision Procedure Desiderata for Infinite Worlds

  | Requirement | The case it's there to handle | Non-negotiable or camp preference | What it kills | Collides with |
  |-------------|-------------------------------|----------------------------------|---------------|--------------|
  | **Bounded agent** | Grantmaker chooses between: (A) a 10% chance of securing infinite clean energy (affecting infinitely many future lives) and (B) certainty of curing a disease in 1 million current people. Agent can only implement finite actions. | Non-negotiable (practitioners) | Theories requiring direct infinite aggregation (e.g., total utilitarianism in infinite settings). Infinitarian paralysis if deemed unavoidable. | Granularity invariance (if carving affects "reach" of bounded actions). |
  | **Drip worlds** | Choice between: (A) boosting welfare of the first billion people in a civilisation that adds one person per year forever, or (B) a 0.001% chance of a warp drive that ensures all future people exist 10× longer. Population finite per moment but unbounded across time. | Non-negotiable (longtermists) | Fixed-population theories (e.g., some hyperreal approaches). Views requiring a "complete set" of people at decision time. | Granularity invariance (if temporal carving privileges "early" lives). |
  | **Granularity invariance** | Same world described two ways: (1) each human life as one unit, (2) each life split into 30,000 daily moments. A painkiller reducing daily suffering must get the same verdict under both descriptions. | Non-negotiable (theorists) | Cardinality-dependent aggregation (e.g., average utilitarianism). Views where splitting entities changes value density. | Drip worlds (if temporal order is essential for valuation). |
  | **Non-collapse** | Choice between: (A) certainly saving one life now, or (B) a 1/Ω chance (infinitesimal) of infinite utopia. Must not make (A) irrelevant (collapse to "no difference") or (B) overwhelmingly dominant (collapse to "only this matters"). | Non-negotiable (ethicists) | "Only infinite differences matter" views. Classical Pascal's Wager fanaticism. | Avoid fanaticism (if non-collapse forces acknowledging tiny chances). |
  | **Graceful degradation** | Grantmaker faces identical choices but has 50% credence the universe is finite. Verdict must not swing wildly based on this uncertainty (e.g., by ignoring infinities entirely). | Non-negotiable (pragmatists) | Theories requiring certainty about infinity (e.g., some density measures). "Infinite or bust" approaches. | Bounded agent (if finite/infinite worlds need distinct procedures). |
  | **Avoid fanaticism** | Project with 1 in 10¹⁰⁰ chance of infinite utopia vs. certainly preventing torture of one person today. Must not always sacrifice the certain for the tiny-chance infinite. | Camp preference (risk-conservatives) | Fanatical utilitarianism (e.g., Bostrom's "weak dominance"). Views prioritising infinite stakes at any probability. | Non-collapse (if avoiding fanaticism requires ignoring infinitesimal chances). |

  ### Conflict Analysis
  - **Unsatisfiable subset**: {Non-collapse, Granularity invariance, Drip worlds}  
    **Why**: Drip worlds require temporal ordering for value aggregation (e.g., limiting averages), but granularity invariance forbids dependence on carving (e.g., time-slices vs whole lives). Non-collapse forces non-trivial comparisons, which fail if temporal order is both necessary (for drip worlds) and forbidden (by granularity).  

  - **Most excluding requirement**: **Non-collapse**  
    **Why**: It blocks trivial solutions (e.g., "all infinite worlds are equal") and forces direct engagement with infinitarian paralysis, ruling out most simple aggregative, threshold, and lexical views that collapse differences.  

  - **One-liners on usual suspects**:
    - **Straight aggregation**: Fails bounded agent (infinite sums impossible) and non-collapse (infinite totals often incomparable).
    - **Threshold/catch-up**: Killed by drip worlds (no fixed population to "catch up" to) and granularity (thresholds depend on carving).
    - **Lexical/leximin**: Violates graceful degradation (lexical priorities swing wildly with infinity uncertainty) and non-collapse (often ignore finite stakes).

