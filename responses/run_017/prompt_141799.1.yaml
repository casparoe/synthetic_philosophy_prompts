prompt: |-
  I'm writing something on how moral norms actually collapse — slavery, duelling, that sort of case — and I keep getting the three usual stories thrown at me as if they were rivals you just pick between: the arguments did it, the material interests did it, honour did it. Before I sign up for one I'd rather have the spec. So: what would a theory of moral revolution have to be able to do to be any use to someone running a campaign today who wants to know which lever to pull? Give me the desiderata, each with the case behind it, and mark which are genuine constraints and which are just one camp's perferences.

  Please get on your list (or tell me which of them is a bogus demand and why) these five: 1) a practice that dies out while almost nobody's belief about it changes, because it just got expensive or inconvenient — is that even the same phenomenon, and what does a theory owe us here; 2) pluralistic ignorance, everyone privately finished with the practice and it still fully in place; 3) the timing problem, the argument that fell flat for forty years and then works inside a decade; 4) the honour-holders giving up the thing that made them honourable, i.e. the people whose status was built on the practice being the ones who end it; 5) abolition imposed from outside by a conqueror or a colonial administration, which changes behaviour and maybe changes nothing else.

  Then the bit I actually want: which two desiderata on your list you think can't be jointly satisfied — I suspect wanting one mechanism general enough to cover all five cases and wanting each case's local honour economy to do real explanatory work are in tension, but you say which — and which single requirement knocks out the most of the three usual stories. And if you think the Williams-y point, that a revolutionary's reasons aren't reasons for the person she's arguing with so argument can't be the engine, is better handled as a desideratum than as a theory, say where it sits on the list. A one-line scorecard for arguments / interests / honour at the end is fine, but keep the weight on the criteria and their cases.
reasoning: |-
  Okay, the user is writing about the collapse of moral norms like slavery and dueling. They mentioned three common explanations: arguments, material interests, and honor. They want to know what a theory of moral revolution should include to be useful for someone running a campaign today. They listed five specific cases they want addressed and asked for desiderata (requirements) for such a theory.

  First, I need to break down the user's main request. They want desiderata for a theory of moral revolution, criteria that any good theory should meet. These should help someone in a campaign know which lever to pull. The user also provided five specific scenarios that the theory must handle. I should address each of these scenarios and explain whether they are genuine constraints or just preferences of certain camps.

  Looking at the five scenarios:
  1. A practice dies out without belief change, just becoming expensive or inconvenient. Is this the same phenomenon? The theory needs to explain how external factors can lead to abandonment even if beliefs don't shift. This shows that material factors alone can cause collapse, so a theory must account for non-moral drivers.
     
  2. Pluralistic ignorance—everyone privately rejects the practice but it persists. The theory must explain how public compliance can continue despite private rejection, and what breaks that false consensus. This is a genuine constraint because it highlights the role of social perception in maintaining norms.

  3. The timing problem—an argument that didn't work for decades suddenly becomes effective. The theory needs to explain why moral arguments succeed at specific times, not just their content. This is crucial because it shows that context matters more than the argument itself.

  4. Honor-holders giving up the practice that defines their status. The theory must explain why elites would dismantle a system that benefits them. This is a genuine constraint because it challenges interest-based explanations and requires addressing identity and status.

  5. Abolition imposed from outside, changing behavior but not beliefs. The theory must distinguish between behavioral change and genuine normative shift. This is a genuine constraint as it shows external forces can end practices without internal moral change.

  Now, the user wants to know which two desiderata can't be jointly satisfied. They suspect that wanting a general mechanism covering all cases clashes with honoring each case's honor economy. I agree. Desideratum 4 (explanatory power for honor economies) and desideratum 6 (unified mechanism) are in tension. Focusing on local honor systems might make a general theory hard to achieve, while a single mechanism might oversimplify unique contexts.

  Which single requirement knocks out the most of the three usual stories? Desideratum 3 (timing sensitivity) is tough for all three. Arguments can't explain why they suddenly work; interests don't account for delayed tipping points; honor economies might not explain sudden shifts without external catalysts.

  The user also mentions Bernard Williams' point about reasons not being shared. This should be a desideratum (number 7) rather than a full theory. It emphasizes that effective campaigns need to translate moral reasons into the target group's existing values, which is crucial for practical application.

  For the one-line scorecard:
  - Arguments: Necessary but insufficient without cultural and structural alignment.
  - Interests: Powerful but can't explain elite sacrifices or belief-driven shifts.
  - Honor: Key for understanding identity but less useful for externally imposed changes.

  The user's deeper needs seem to be about finding a practical, actionable framework for modern campaigns. They want to avoid oversimplified theories and need a nuanced understanding of how different factors interact. Highlighting tensions between desiderata helps them navigate complexities in real-world applications.
answer: |-
  Here's a breakdown of the desiderata for a useful theory of moral revolution, tailored for campaign strategists. I'll address your five cases explicitly, identify genuine constraints vs. camp preferences, pinpoint the key tension between desiderata, and evaluate the "big three" approaches. Bernard Williams' insight is integrated as a core desideratum.

  **Core Desiderata for a Theory of Moral Revolution (Campaign-Relevant):**

  1.  **Explain *Both* Belief Shift *and* Behavior Change Without Assuming Congruence:** (Genuine Constraint)  
      *   **Why?** Moral collapse isn't monolithic. Case #1 (practice dies due to cost/inconvenience *without* belief change, e.g., certain restrictive dress codes fading) shows behavior can change independently. Case #5 (externally imposed abolition) shows behavior can be forced *before* belief shifts (if ever). Yet Cases #2 (pluralistic ignorance) & #3 (timing problem) demand explaining belief shifts. A useful theory *must* disentangle these drivers and show how they interact in different scenarios. It owes us an account of when behavioral change precedes, follows, or drives belief change. *Campaign Lever:* Helps choose between targeting costs/benefits, changing beliefs, or altering enforcement mechanisms.

  2.  **Account for the Collapse of Pluralistic Ignorance:** (Genuine Constraint)  
      *   **Why?** Case #2 (everyone privately rejects the practice, but it persists due to perceived public support) is a common and powerful obstacle. A theory *must* explain what shatters this false consensus – e.g., visible defection (brave first actors), changed communication structures (new media), catalytic events, or external imposition (#5) revealing true preferences. *Campaign Lever:* Highlights the critical importance of making dissent visible and safe, fostering communication channels that break isolation.

  3.  **Explain Timing Sensitivity/Critical Junctures:** (Genuine Constraint)  
      *   **Why?** Case #3 (the argument that "failed" for decades then suddenly works) is pervasive (e.g., sudden shifts on gay marriage). Arguments, cost-benefit analyses, or appeals to honor often only gain traction within a specific historical/material/technological context. A theory *must* identify the factors (e.g., prior institutional changes, economic shifts, generational turnover, catalytic events, technological disruption) that create "windows of opportunity" where previously inert levers suddenly work. *Campaign Lever:* Emphasizes the need for groundwork *and* readiness to act decisively when conditions ripen; patience and strategic timing are key.

  4.  **Explain Elite Defection/Identity Transformation:** (Genuine Constraint)  
      *   **Why?** Case #4 (honor-holders abandoning the practice defining their status, e.g., Southern planters reluctantly accepting abolition *after* fighting for it, or aristocrats abandoning dueling) is crucial. Material interest theories struggle here. A theory *must* explain how elites come to see the practice as incompatible with a *new* or *reconfigured* source of honor, status, or identity (e.g., "modernity," "civilization," "national unity," "true Christian virtue"), or how the practice's *costs* to their broader status (e.g., international pariah status, internal conflict) outweigh its identity benefits. *Campaign Lever:* Stresses the need to offer elites alternative sources of prestige and identity compatible with abandoning the harmful norm, or to increase the social/political costs of clinging to it.

  5.  **Distinguish Externally Imposed Change from Endogenous Shift & Explain Long-Term Effects:** (Genuine Constraint)  
      *   **Why?** Case #5 (abolition by conqueror/colonial power) changes behavior but may leave underlying beliefs and honor economies intact (e.g., post-1865 US South, colonial bans on sati). A theory *must* differentiate this from endogenous collapse (#2, #3, #4) and explain the conditions under which external imposition leads to genuine normative shift over time vs. fostering resentment and subterranean persistence. It owes us an analysis of the mechanisms translating behavioral enforcement into belief change (or preventing it). *Campaign Lever:* Warns that purely external imposition may be unstable; suggests coupling enforcement with internal persuasion/identity work for lasting change.

  6.  **Provide a Plausible Mechanism for *How* Change Cascades:** (Genuine Constraint)  
      *   **Why?** All cases require understanding the spread mechanism. Does it rely on networked persuasion, changing cost-benefit calculations diffusing through a population, elite signaling cascades, or coercive enforcement altering perceived possibilities? A useful theory can't just identify causes; it must show the *process*. *Campaign Lever:* Informs whether to focus on grassroots organizing, elite persuasion, legal challenges, or economic pressure based on the likely diffusion path.

  7.  **Integrate the "Williams Point" as a Core Mechanism Constraint (Desideratum):**  
      *   **Where it sits:** This is Desideratum **#7: Explain how reasons effective *for the revolutionary* become effective *for the target group*, given differing foundational values/honor codes.** (Genuine Constraint derived from philosophy/sociology).
      *   **Why?** Bernard Williams was right: the abolitionist's moral outrage isn't a reason *for* the slaveholder operating within a different honor/value system. A theory *must* show how revolutionaries successfully *translate* their critique into terms resonant with the target group's *existing* values, honor codes, or perceived interests (e.g., framing abolition as necessary for Southern honor/national unity/economic progress; framing dueling as un-Christian/un-gentlemanly/cowardly). It cannot rely solely on the intrinsic force of the revolutionary's moral argument. *Campaign Lever:* Paramount. Campaigns *must* master framing and finding "hooks" within the target audience's existing worldview. Moral argument alone is insufficient without cultural translation.

  **Addressing Your Case #1 Explicitly:**
  *   Is it the same phenomenon? **Yes, but a distinct subtype.** It's moral norm collapse driven primarily by material/structural factors overriding persistent belief. A theory *owes* us an explanation for why the normative commitment wasn't strong enough to override the new costs, or how the cost increase itself triggered a re-evaluation of the norm's value. It shows norms aren't purely ideational; material context matters.

  **The Key Tension: Two Desiderata in Conflict**
  *   **Desideratum #6 (Plausible Cascading Mechanism)** and **Desideratum #4 (Explaining Elite Defection/Identity Transformation)** are in profound tension with **Desideratum #1 (Explain Both Belief & Behavior Change Without Congruence)**.
  *   **Why?** A truly general cascading mechanism (e.g., network diffusion, falling costs) powerful enough to explain Cases #1 (cost-driven behavior change without belief shift) and #5 (externally imposed behavior change) often struggles to adequately explain the deep *identity work* and *value reconfiguration* required for Case #4 (elites abandoning core honor). Conversely, a theory rich enough in explaining the nuanced identity shifts of Case #4 might seem less "mechanistic" or applicable to Cases #1 & #5, which appear more structurally driven. The core tension is between **parsimony/generality** (a single dominant mechanism) and **explanatory depth for complex identity-driven change**.

  **The Single Requirement That Knocks Out the Most of the "Big Three"**
  *   **Desideratum #7 (The Williams Point - Translation of Reasons)** is the most devastating to simplistic versions of the "arguments did it" story. It shows pure moral argumentation, divorced from the target audience's values, is inert. It also challenges pure "interests" by showing how interests are perceived *through* cultural/honor lenses, and challenges pure "honor" by showing honor codes themselves must be made vulnerable to critique *from within* or via linkage to other concerns. All three simplistic stories fail if they ignore the necessity of cultural translation.

  **One-Line Scorecard on Arguments/Interests/Honor:**
  *   **Arguments:** Necessary but insufficient without cultural translation (#7) and ripe timing (#3); often the vehicle, rarely the sole engine. Fails hardest on #1 & #5.
  *   **Interests:** Powerful driver for behavior change (#1, #5) and sometimes timing (#3), but struggles to explain elite defection (#4), belief shift without material change (#2, #3), and requires framing within existing values/honor (#7).
  *   **Honor:** Crucial for understanding adherence, resistance, and elite motivation (#4, #2), and provides the framework for translating arguments (#7), but less explanatory for purely cost-driven collapse (#1) or externally imposed change (#5), and needs linkage to mechanisms for cascade (#6).

  **In Summary for the Campaigner:** A useful theory must be **multi-mechanism**, integrating material/structural factors, belief/identity change, and elite dynamics. It must prioritize **cultural translation** (Williams) over pure moral argument, understand the critical role of **timing** and **windows of opportunity**, recognize the power of **shattering false consensus**, and offer strategies for **elite identity transformation**. No single lever works universally; the key is diagnosing which combination of levers (cost-shifting, belief-translation via honor codes, making dissent visible, elite persuasion/coercion, exploiting junctures) is most likely to work in the *specific* context of the norm you're targeting, based on where it sits within the local honor economy and material structure. Look for the cracks in the pluralistic ignorance and the potential for redefining honor or interest.
