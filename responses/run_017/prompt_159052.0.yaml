  **Step 1: Agreed Claims**

  We need a neutral statement of the paradox of phenomenal judgment:

  *Paradox of Phenomenal Judgment*: If phenomenal properties (e.g., the redness of a red experience) are causally inert with respect to all physical and cognitive processes, then judgments about those phenomenal properties (e.g., "I see red") are not caused by them. This raises questions about how such judgments can be reliably about the phenomenal properties, how we learn to use phenomenal terms correctly, and why we should trust such judgments.

  What counts as solving the paradox? Both sides might agree that solving it requires providing a coherent account that explains the reliability, aboutness, and authority of phenomenal judgments without invoking causal efficacy of phenomenal properties, while avoiding circularity or brute facts. Dissolving it might involve showing that the paradox rests on false assumptions.

  **Agreed Claims Draft**:

  1. Phenomenal properties (e.g., the qualitative character of experiences) are non-physical properties that accompany certain physical processes but, according to epiphenomenalism, do not causally influence any physical or cognitive events.

  2. Humans make reports and judgments about their phenomenal experiences, such as "I am experiencing redness" or "This pain feels sharp."

  3. The *paradox of phenomenal judgment* arises because, if phenomenal properties are causally inert, then:
     a. The production of phenomenal judgments (e.g., uttering "I see red") is fully caused by non-phenomenal factors (e.g., neural mechanisms).
     b. It is unclear how these judgments can be *about* the phenomenal properties, given that the phenomenal properties play no causal role in forming the judgments.
     c. It is unclear why such judgments should be considered *authoritative* or *justified*, as they are not causally responsive to the experiences they report.

  4. Solving the paradox (as opposed to dissolving it) requires providing a positive account that explains (i) the production of phenomenal judgments, (ii) their intentional content (aboutness), and (iii) their epistemic status (authority/justification), without attributing causal efficacy to phenomenal properties, and without rendering the judgments inexplicably reliable or accurate.

  5. Both sides agree that the paradox presents a serious challenge to epiphenomenalism that demands a response.

  ---

  **Step 2: Disagreements Table**

  We'll structure the table with the following columns for each crux:
  - Crux (neutral statement)
  - Side A's Position
  - Side B's Position
  - Test Case / Argument
  - Side A's Prediction
  - Side B's Prediction

  We'll cover the issues raised:

  **Crux 1: The Role of Causation in Aboutness**
  - Crux: Can a judgment be about a phenomenal property if that property plays no causal role in producing the judgment?
  - Side A: Yes, aboutness does not require causation; it can be established by non-causal relations (e.g., constitutive, acquaintance, or reliable correlation).
  - Side B: No, aboutness requires some causal connection; without it, the judgment cannot genuinely refer to the phenomenal property.
  - Test Case: The "cross-wired read-out" scenario. Consider a subject whose neural report mechanism is inverted such that when they have a green experience, they reliably say "red," and vice versa, due to a wiring quirk. However, the experiences themselves are not causally involved. In the veridical case, the wiring matches the experiences (green experience leads to "green" report); in the inverted case, it doesn't (green experience leads to "red" report).
  - Side A Prediction: The veridical case is about the experience because of a reliable correlation or non-causal relation (e.g., the report is constituted by the experience or based on primitive acquaintance). The inverted case is not about the experience because the correlation is broken, even without causation.
  - Side B Prediction: Without causal connection, there is no fact of the matter about which experience the report is about. Both cases are arbitrary; the distinction between veridical and inverted collapses, showing that aboutness requires causation.

  **Crux 2: The Source of Epistemic Authority**
  - Crux: How can phenomenal judgments be justified or authoritative if the phenomenal properties do not cause them?
  - Side A: Authority comes from the non-causal relation (e.g., in acquaintance, the judgment is directly aware of the experience) or from the reliability of the neural read-out.
  - Side B: Without causal responsiveness, the judgments are not based on the experience and thus cannot be justified; they are merely coincidental and untrustworthy.
  - Test Case: The "latency ladder" – specifically, the deferred-vocabulary case. A subject has an experience at age 5 but only learns the word for it at age 30. At 30, they report "I had that experience at 5." Is this report authoritative?
  - Side A Prediction: Yes, because the neural trace of the experience at 5 is reliably read out at 30 via a common cause or structural relation, even without the experience causing the report.
  - Side B Prediction: No, because the experience at 5 is long gone and causally inert; the report at 30 is based on a memory trace that may be distorted, and without the experience causing the trace or the report, there is no basis for authority.

  **Crux 3: The Viability of Non-Causal Relations**
  - Crux: Are non-causal relations (e.g., constitutive, acquaintance, reliable correlation) sufficient to resolve the paradox?
  - Side A: Yes, one of these can provide aboutness and authority without causation.
  - Side B: No, these relations either implicitly rely on causation or are insufficient to establish genuine aboutness and justification.
  - Test Case: The "artifact case." A machine has internal states (e.g., temperature) and a monitor module that reports on them without affecting them. The reports are reliable due to design.
  - Side A Prediction: This shows that reliable reporting without causal influence is possible; thus, it resolves the paradox for both machines and minds.
  - Side B Prediction: The machine case is disanalogous because the reports are designed by an external agent who causally links the state and the report. In the mind, there is no such designer, so without a causal link, the reliability is unexplained.

  **Crux 4: The Breakdown Point in the Latency Ladder**
  - Crux: At what point, if any, does the reliability of phenomenal judgment break down under epiphenomenalism as the delay increases?
  - Side A: Reliability can be maintained at all delays if the neural read-out is robust (e.g., via memory mechanisms).
  - Side B: Reliability degrades with delay because the absence of causal connection makes the report vulnerable to error, and at long delays, it becomes indistinguishable from guessing.
  - Test Case: Reports at different latencies: immediate, 200 ms, 1 hour, 10 years. Measure accuracy under conditions where experiences are known (e.g., in experiments with controlled stimuli).
  - Side A Prediction: Accuracy remains high at all latencies because the neural read-out is reliable.
  - Side B Prediction: Accuracy declines with latency, especially at long delays, as the non-causal link provides no mechanism to maintain fidelity.

  **Addressing Variations in Side A**:
  - We can note in the table that Side A's position may vary (constitutive, acquaintance, common cause), but for simplicity, we'll treat Side A as holding that at least one of these works. Where relevant, we can specify if predictions differ.

  **Merely Verbal Disputes**:
  - We can flag that terms like "caused by," "in virtue of," and "tracks" may be interpreted differently. Both sides might agree that "tracks" can be non-causal, but disagree on whether it suffices for aboutness.

  **Evidence Against Own View**:
  - For Side A: If it were shown that in the inverted read-out case, subjects cannot detect the inversion and the reports are treated as accurate, that might challenge A (but A might still appeal to correlation).
  - For Side B: If a clear case of non-causal aboutness were demonstrated (e.g., in mathematics or logic), it might challenge B's claim that causation is necessary.

  ---

  **Final Structure**:

  # Joint Statement: Adversarial Collaboration on Epiphenomenalism and the Paradox of Phenomenal Judgment

  ## Agreed Claims

  1. Phenomenal properties are non-physical properties that supervene on physical processes but, under epiphenomenalism, have no causal effects on any physical or cognitive events.

  2. Humans make verbal reports and cognitive judgments about their phenomenal experiences, such as "I am experiencing a red sensation" or "This pain is intense."

  3. The paradox of phenomenal judgment challenges epiphenomenalism by highlighting that if phenomenal properties are causally inert:
     a. The production of phenomenal judgments is entirely caused by non-phenomenal mechanisms.
     b. It is problematic to explain how these judgments can be intentionally *about* the phenomenal properties.
     c. It is problematic to explain why these judgments should be considered epistemically *authoritative* or *justified*.

  4. Solving the paradox requires providing a coherent account that explains (i) the production mechanism, (ii) the aboutness, and (iii) the authority of phenomenal judgments without attributing causal efficacy to phenomenal properties, and without resorting to unexplained coincidences or brute facts.

  5. Dissolving the paradox would involve showing that one or more of the assumptions leading to the paradox are false or misguided.

  6. Both sides agree that the paradox is a central issue for epiphenomenalism and that its resolution has significant implications for the viability of the view.

  ## Disagreements Table

  | Crux | Side A (Epiphenomenalist) | Side B (Critic) | Test Case / Argument | Side A Prediction | Side B Prediction |
  |------|---------------------------|----------------|----------------------|-------------------|------------------|
  | **Crux 1: Necessity of Causation for Aboutness** | Aboutness does not require causation; it can be grounded in non-causal relations (e.g., constitutive, acquaintance, or reliable correlation). | Aboutness requires a causal connection; without it, judgments cannot genuinely refer to the phenomenal properties. | **Cross-wired read-out**: A subject is wired such that their report mechanism is inverted (e.g., green experience causes* "red" report, but * means neural correlate, not phenomenal property). In veridical wiring, reports match experiences; in inverted, they don't. Can we distinguish which report is about the experience? | In veridical case, the report is about the experience due to reliable correlation; in inverted, it is not. The distinction is real and non-causal. | Without causal connection, there is no fact of the matter; both cases are arbitrary. The distinction collapses, showing causation is needed. |
  | **Crux 2: Epistemic Authority without Causation** | Authority can arise from non-causal relations (e.g., direct acquaintance) or reliable mechanisms. | Authority requires causal basing; without it, judgments are not justified. | **Deferred-vocabulary case**: A person has an experience at age 5 but learns the term for it at 30. At 30, they report "I had experience E at 5." Is this report authoritative? | Yes, because the neural trace at 5 and the report at 30 are linked by a reliable read-out mechanism. | No, because the experience at 5 is causally isolated; the report is based on a memory that may be faulty, with no causal check. |
  | **Crux 3: Sufficiency of Non-Causal Relations** | Non-causal relations (constitutive, acquaintance, correlation) can resolve the paradox. | Non-causal relations are insufficient; they either presuppose causation or fail to provide genuine aboutness and justification. | **Artifact case**: A machine has internal state S and a monitor that reports "S is high" without affecting S. The report is reliable due to design. Does this analogy resolve the paradox for minds? | Yes, it shows non-causal reliable reporting is possible, so the paradox is resolved. | No, the machine's reliability is explained by the designer's causal role. In minds, no designer exists, so the reliability is unexplained. |
  | **Crux 4: Latency and Reliability** | Reliability of phenomenal judgments can be maintained at any latency via robust neural mechanisms. | Reliability degrades with latency due to lack of causal connection, making long-delay reports untrustworthy. | **Latency ladder**: Measure accuracy of reports about a standard experience at delays: immediate, 200 ms, 1 hour, 10 years. | Accuracy remains high at all delays. | Accuracy declines with delay, especially at long latencies. |

  **Notes on Side A Variations**:
  - For Crux 1, Side A may appeal to different non-causal relations:
    - Constitutive: The judgment is partly made of the experience, so no causation needed.
