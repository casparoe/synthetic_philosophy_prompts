  - These may lead to nuanced differences, but all reject the need for causation from the phenomenal property.

  **Merely Verbal Disputes**:
  - The dispute over "caused by" vs. "in virtue of" may be partly verbal. Both sides agree that the neural mechanisms cause the report; the disagreement is whether the phenomenal property must play a role in "grounding" the aboutness.

