answer: |-
  ### Joint Statement: Adversarial Collaboration on Epiphenomenalism and the Paradox of Phenomenal Judgment  
  **Participants**: Side A (Epiphenomenalist) and Side B (Critic)  

  #### Agreed Claims  
  1. **Phenomenal properties** (e.g., the qualitative character of pain or color experiences) are non-physical properties that arise from physical processes but, under epiphenomenalism, have no causal influence on any physical, behavioral, or cognitive events.  
  2. **Phenomenal judgments** (e.g., reports like "I see red" or "this hurts") are cognitive events that purport to describe one's phenomenal properties.  
  3. **The paradox of phenomenal judgment**: If phenomenal properties are causally inert, then:  
     a. The *production* of phenomenal judgments is fully caused by non-phenomenal mechanisms (e.g., neural processes).  
     b. This raises doubts about how such judgments can be *about* the relevant phenomenal properties, given that these properties play no role in forming the judgments.  
     c. This also raises doubts about why these judgments should be treated as *authoritative* (i.e., epistemically justified or reliable).  
  4. **Solving the paradox** (as opposed to dissolving it) requires explaining (i) production, (ii) aboutness, and (iii) authority of phenomenal judgments *without* attributing causal efficacy to phenomenal properties, and without appealing to unexplained coincidences or brute facts. A solution must address all three components. Dissolving the paradox would involve showing that one or more of (a)-(c) rests on a conceptual error.  
  5. **The dispute is substantive**: Both sides agree the paradox is a central challenge to epiphenomenalism, and its resolution is critical for the view’s viability.  

  #### Disagreements Table  
  Each crux is stated neutrally. Side A’s and B’s positions are their own formulations. Predictions are forward-looking and falsifiable.  

  | Crux (Neutral Statement)                                                                                                                                 | Side A (Epiphenomenalist) Position                                                                                                                                 | Side B (Critic) Position                                                                                                                               | Test Case / Argument                                                                                                                                                                                               | Side A Prediction                                                                                                                               | Side B Prediction                                                                                                                                 |
  |:---------------------------------------------------------------------------------------------------------------------------------------------------------|:-------------------------------------------------------------------------------------------------------------------------------------------------------------------|:-------------------------------------------------------------------------------------------------------------------------------------------------------|:-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|:------------------------------------------------------------------------------------------------------------------------------------------------|:--------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Crux 1: Does aboutness require causal contact?**<br>Can a judgment be about a phenomenal property if that property plays no causal role in producing it? | "Aboutness is secured by a non-causal relation (e.g., primitive acquaintance, constitution, or reliable correlation). Causation is unnecessary."<br>(*A notes: This holds across A-variants, but constitution implies non-separability.*) | "Aboutness requires causal contact. Without it, the judgment is unmoored from its target, making reference arbitrary or impossible."                                                                                 | **Cross-wired read-out**: A subject’s report mechanism is neurally inverted (e.g., green experience correlates with "red" report). Both veridical (match) and inverted (mismatch) wiring are possible. Is the inverted report still *about* the experience? | "Yes. In the inverted case, the report is still about the experience due to acquaintance/correlation. But it is inaccurate, showing aboutness without causation."                                              | "No. The inverted case is indistinguishable from the veridical; both are arbitrary neural patterns. Without causation, 'aboutness' is illusory."                                                               |
  | **Crux 2: Can authority exist without causal basing?**<br>Can phenomenal judgments be authoritative (justified/reliable) if not causally based on the phenomenal property? | "Authority stems from non-causal relations (e.g., acquaintance guarantees direct access) or reliable neural read-out. Causation is irrelevant."<br>(*A variants: Acquaintance emphasizes directness; read-out relies on correlation.*) | "Authority requires causal basing. Without it, judgments are ungrounded 'guesses' and unjustified, as they lack sensitivity to the target."                                                                           | **Deferred-vocabulary case**: A subject has experience E at age 5 but learns the term for E at 30. At 30, they report "I had E at 5." Is this report authoritative?                                                                 | "Yes. The neural trace of E at age 5 is read out reliably at 30 via non-causal correlation. Authority holds."                                                                                                  | "No. The experience is causally isolated; the report relies on distorted memory traces. Authority degrades with time, vanishing here."                                                                        |
  | **Crux 3: Does epiphenomenalism threaten all three components equally?**<br>Which aspects of phenomenal judgment (production, aboutness, authority) are undermined by epiphenomenalism? | "Epiphenomenalism only challenges *production* trivially (it’s neural). Aboutness and authority are intact via non-causal relations. The real issue is explaining correlation, not causation."<br>(*A variants: All agree production is neural-only.*) | "Epiphenomenalism fatally undermines *aboutness* and *authority*. Production is trivial; the paradox hinges on explaining how judgments track experiences without causal feedback."                                   | **The artifact case**: A machine has internal state S (e.g., temperature) and a monitor that reports "S is high" without affecting S. Reports are reliable due to design. Does this resolve the paradox for minds? | "Yes. The machine shows non-causal aboutness/authority via reliable read-out. Minds work similarly, so the paradox is solved."                                                                                 | "No. Machine reliability is pre-established by a designer’s causal intent. Minds lack this, so the paradox remains. This case highlights the need for causal grounding."                                     |
  | **Crux 4: At what latency does reliability break?**<br>Under epiphenomenalism, how does the reliability of phenomenal judgments vary with reporting latency? | "Reliability is robust at all latencies. Neural read-out mechanisms (e.g., memory) maintain correlation without causal input from phenomenal properties."<br>(*A variants: Constitution/acquaintance work instantly; read-out handles delays.*) | "Reliability decays with latency. Without causal connection, reports become error-prone, and long delays (e.g., years) render them untrustworthy."                                                                     | **Latency ladder**: For a controlled experience (e.g., a flash of light), measure report accuracy at: (i) 0 ms (instant), (ii) 200 ms, (iii) 1 hour (memory), (iv) 10 years (long-term recall).                              | "Accuracy remains high (>95%) at all latencies. Non-causal correlation is preserved."                                                                                                                         | "Accuracy declines sharply with latency (e.g., near-chance at 10 years). Lack of causal feedback allows drift/error accumulation."                                                                           |
  | **Crux 5: Are non-causal relations sufficient?**<br>Can non-causal relations (e.g., acquaintance, constitution, or correlation) fully resolve the paradox? | "Yes. E.g., acquaintance provides direct aboutness/authority; constitution makes the judgment intrinsically about the experience; correlation ensures reliability. No causation needed."<br>(*A variants: Choice affects emphasis but not outcome.*) | "No. Non-causal relations presuppose unexplained reliability (e.g., how does 'acquaintance' arise?). They are placeholders for causation or brute facts, failing to solve the paradox."                               | **Primitive acquaintance test**: If acquaintance is fundamental, can subjects distinguish it from mere correlation in introspection (e.g., report if their judgment feels "directly given" vs. "inferred")? | "Yes. Subjects report judgments as 'direct' (e.g., pain is immediately known), confirming acquaintance."                                                                                                       | "No. All judgments feel 'direct,' but this is illusory; it reveals nothing about the relation. The test conflates phenomenology with mechanism."                                                              |

  #### Notes on Disputed Concepts  
  - **Merely verbal elements**: Disagreements over "caused by" (B) vs. "in virtue of" (A) or "tracks" (both) are partially verbal. A sees these as distinct; B sees them as causal in disguise. The core non-verbal dispute is whether *any* relation can substitute for causation in fixing aboutness.  
  - **Substantive elements**: The viability of non-causal relations (Crux 5) and latency effects (Crux 4) are real disagreements, invariant under rewording.  

  #### What Would Count as Evidence Against Each View  
  - **Side A**: Neural evidence showing that inverted read-out (Crux 1) is subjectively indistinguishable from veridical reporting *and* treated as accurate by third parties would challenge A’s claim that aboutness persists. A also accepts that total neural unreliability (e.g., random reports) would falsify their view.  
  - **Side B**: A demonstration of non-causal aboutness in a non-mental domain (e.g., mathematical judgments) would challenge B’s necessity claim. B also accepts that if latency (Crux 4) shows no reliability decay, their view is weakened.  

  \answer{Whether aboutness can exist without causal connection.}
