  We are building a decision tree to sort positions on underdetermination based on concrete cases and claims. The goal is to distinguish various views without relying on labels until the end.

  The entry node is the given case: Two models (e.g., two trained neural nets or climate models) agree on all observations and interventions that have been run so far, but they disagree about the outcome of an intervention that is currently impractical to run. We ask:

  **Node 1 (Entry):** In the case described, do the two models represent a genuine case of underdetermination?  
     - **Option A:** Yes, this is underdetermination.  
     - **Option B:** No, this is not underdetermination.  

  Now, for those who answer "Yes" (Option A), we proceed to distinguish the nature and extent of the underdetermination.

  **Node 2 (for A):** Is the underdetermination in this case only temporary? That is, could we, in principle, run the intervention in the future (even if not currently) to resolve the disagreement?  
     - **Option A1:** Yes, it's temporary; we could run it in the future.  
     - **Option A2:** No, it's not temporary; the intervention is not physically possible (or even if it were, the models might still agree on all possible observations).  

  This separates weak (temporary) from strong (permanent) underdetermination.

  **Node 3 (for A):** Does the underdetermination arise because the models are embedded in larger theoretical frameworks that require auxiliary assumptions? (Duhem-style holism)  
     - **Option B1:** Yes, the disagreement depends on auxiliary assumptions.  
     - **Option B2:** No, the disagreement is between two self-contained hypotheses without auxiliaries.  

  Now, we consider the possibility of future evidence.

  **Node 4 (for A):** Could the two models be distinguished by new evidence that is not about the intervention in question? (e.g., new auxiliary assumptions or new predictions)  
     - **Option C1:** Yes, new evidence (even without running that intervention) could break the tie.  
     - **Option C2:** No, the models are empirically equivalent for all possible evidence.  

  This addresses Laudan and Leplin's point.

  Next, we consider the role of extra-empirical criteria.

  **Node 5 (for A):** When we use extra-empirical criteria (like simplicity, unifying power) to choose between theories, are these criteria:  
     - **Option D1:** Evidence about the truth of the theory?  
     - **Option D2:** Merely pragmatic reasons for choosing a theory for practical purposes?  

  **Node 6 (for A):** Even after applying extra-empirical criteria, is there a residual decision-relevant uncertainty? That is, is the posterior probability distribution spread enough to affect decisions?  
     - **Option E1:** Yes, there is a significant spread.  
     - **Option E2:** No, the extra-empirical criteria (or priors) effectively break the tie.  

  Finally, we consider the source of underdetermination.

  **Node 7 (for A):** What is the primary source of the underdetermination?  
     - **Option F1:** The need for auxiliary assumptions (holism).  
     - **Option F2:** The existence of unconceived alternative theories (we haven't thought of all possibilities).  
     - **Option F3:** Incommensurable standards of evidence (what counts as evidence depends on the paradigm).  

  For those who answered "No" (Option B) at Node 1, we must also account for their views. We can ask:

  **Node 2 (for B):** Why is this not underdetermination?  
     - **Option G1:** Because the models are not whole theories and the disagreement is resolvable by looking at the internal structure (e.g., they are just two functions and we can compare their code).  
     - **Option G2:** Because the intervention in question is not physically possible, so the disagreement is not about a real empirical matter.  
     - **Option G3:** Because the models are not empirically equivalent; they might differ in their predictions for other interventions that we haven't considered.  

  But note: we want to keep the tree to 6-8 branch nodes. We have 7 so far (Node 1 and then 6 for the A branch). We'll stop here and map to leaves.

  Now, we map the combinations to named (or described) positions.

  **Leaves for the "Yes" branch (Option A):**

  1. **Transient Underdetermination (local and temporary):**  
     - Path: A, A1 (temporary), then ... (could be combined with various, but typically holds that future evidence will resolve it).  
     - Most awkward commitment: Must hold that in principle, the intervention is possible and will be done, or that new evidence will arise.  
     - Mind change: If shown that the intervention is impossible or that the models remain equivalent even after new evidence.

  2. **Unconceived Alternatives Pessimist:**  
     - Path: A, A2 (strong), C2 (no new evidence breaks tie), F2 (source: unconceived alternatives).  
     - Most awkward commitment: We are always missing better theories, so current theories are likely false.  
     - Mind change: If shown that the set of possible theories is enumerable and we have considered them all, or that the history of science does not show systematic failure.

  3. **Holist (Global Underdetermination):**  
     - Path: A, A2 (strong), B1 (auxiliaries), C2 (empirically equivalent), F1 (source: holism).  
     - Most awkward commitment: Even with all possible evidence, we cannot determine a unique theory because of the role of auxiliaries.  
     - Mind change: If shown a case where auxiliary assumptions are fixed and the theory is still underdetermined, or vice versa.

  4. **Incommensurability Position:**  
     - Path: A, A2 (strong), C2 (empirically equivalent), F3 (source: incommensurable standards).  
     - Most awkward commitment: Theories from different paradigms cannot be compared objectively.  
     - Mind change: If shown a clear example of theory comparison across paradigms using shared standards.

  5. **Constructive Empiricist:**  
     - Path: A, A2 (strong), C2 (empirically equivalent), D2 (pragmatic criteria), E2 (no residual uncertainty because only observables matter).  
     - Most awkward commitment: We should only believe what the theory says about observables, not the unobservables.  
     - Mind change: If shown that the observable/unobservable distinction is untenable.

  6. **Bayesian:**  
     - Path: A, but then at Node 6: E2 (no residual spread because priors break the tie). Also, they might not think the underdetermination is strong (so A1) and that new evidence (C1) will come. But note: a Bayesian might also say that even with strong underdetermination, priors break the tie.  
     - We can have: A, then at Node 6: E2.  
     - Most awkward commitment: Priors are rational and sufficient to break ties.  
     - Mind change: If shown that priors cannot be rationally constrained and lead to arbitrary choices.

  7. **Value-Laden Pluralist:**  
     - Path: A, then D2 (pragmatic) and E1 (residual spread) and F1 or F3, and also they think that interests/values break the tie and it's fine.  
     - We can capture by: at Node 5: D2 (pragmatic) and Node 6: E1 (spread matters) and then at Node 7: F3 (incommensurability) or F1 (holism).  
     - Most awkward commitment: The choice of theory is not about truth but about values.  
     - Mind change: If shown that values and truth are not separable, or that one set of values is objectively better.

  Now, what about the "No" branch (Option B at Node 1)? We have:

  8. **Not Underdetermination (e.g., Resolvable):**  
     - Path: B, then G1 (because models are not theories) or G3 (they are not empirically equivalent).  
     - This might include the view that the models are not whole theories and we can resolve by looking at structure.  
     - Most awkward commitment: Must hold that the models are not actually competing theories but are more like computational artifacts.  
     - Mind change: If shown that the models are indeed representing theories and the disagreement is fundamental.

  9. **Intervention Not Possible (Not Empirical):**  
     - Path: B, G2 (intervention not physically possible).  
     - Most awkward commitment: The disagreement is not about a real empirical matter.  
     - Mind change: If shown that the intervention is possible.

  We also have an unnamed position:

  10. **Unnamed:** A position that holds that underdetermination is real but only because of current limitations (weak) and that extra-empirical criteria are truth-tracking (D1) and break the tie (E2). This is similar to transient underdetermination but with a stronger role for extra-empirical criteria.  
      - Path: A, A1, D1, E2.  
      - Most awkward commitment: Extra-empirical criteria are truth-tracking.  
      - Mind change: If shown that simplicity does not correlate with truth.

  **Combinations that are empty (incoherent, unattractive, or unexplored):**

  1. **Strong underdetermination (A2) with the view that new evidence (C1) will break the tie.**  
     - Why: If it's strong underdetermination, then by definition, no evidence can break the tie. So A2 and C1 are incompatible.  
     - This combination is incoherent.

  2. **Holism (F1) without auxiliary assumptions (B2).**  
     - Why: Holism is defined by the role of auxiliary assumptions. So if one says the underdetermination arises from holism (F1) but then denies that auxiliaries are involved (B2), that's incoherent.  
     - Alternatively, if one takes B2 and then F1, it's inconsistent.

  3. **Empirical equivalence (C2) with the view that new evidence (C1) will break the tie.**  
     - Why: C2 says the models are empirically equivalent for all possible evidence, so new evidence cannot break the tie.  
     - So C1 and C2 are mutually exclusive.

  **Hard to separate leaves:**

  - **Transient Underdetermination** and **Unconceived Alternatives Pessimist**:  
    - The tree separates them by Node 2 (A1 vs A2) and by Node 7 (source). The transient view is temporary (A1) and typically does not invoke unconceived alternatives (if it does, then it might be a different view). The unconceived alternatives pessimist is typically about strong underdetermination (A2) and the source is unconceived alternatives (F2).  
    - But note: a transient underdetermination might be due to missing auxiliaries (F1) or missing evidence (C1), while unconceived alternatives (F2) is about not having conceived of the alternatives.  
    - The tree can separate them: transient is A1, while unconceived alternatives pessimist is A2 and F2.

  - **Value-Laden Pluralist** and **Constructive Empiricist**:  
    - Both might use pragmatic criteria (D2), but the constructive empiricist does not think there is residual decision-relevant uncertainty (E2) because they only care about observables, while the pluralist might think the spread is real and decision-relevant (E1). Also, the constructive empiricist is committed to agnosticism about unobservables.

  **Final Tree Structure:**

  - Node 1: Entry case -> A (Yes) or B (No)
    - If A (Yes):
      - Node 2: Temporary? -> A1 (Yes) or A2 (No)   [weak vs strong]
      - Node 3: Due to auxiliaries? -> B1 (Yes) or B2 (No) [holism]
      - Node 4: Can new evidence break the tie? -> C1 (Yes) or C2 (No) [Laudan-Leplin]
      - Node 5: Extra-empirical criteria are: -> D1 (Truth-tracking) or D2 (Pragmatic)
      - Node 6: Residual spread? -> E1 (Yes) or E2 (No)
      - Node 7: Source: -> F1 (Holism), F2 (Unconceived alternatives), F3 (Incommensurability)
    - If B (No):
      - Node 2: Why not? -> G1 (Models not theories), G2 (Intervention not possible), G3 (Not empirically equivalent)

  We then assign leaves based on the paths. We have 10 leaves, which is acceptable.

  **Leaves with their paths and descriptions:**

  1. **Transient Underdetermination**: A, A1, ... (any on others, but typically C1, and then D1/E2 or D2/E2).  
     - Most awkward: Must believe the slack will be resolved.  
     - Mind change: If shown that the intervention is impossible or that the models remain equivalent after new evidence.

  2. **Unconceived Alternatives Pessimist**: A, A2, C2, F2.  
     - Most awkward: We are always missing better theories.  
     - Mind change: If shown that the set of possible theories is enumerable and we have them.

  3. **Holist (Global)**: A, A2, B1, C2, F1.  
     - Most awkward: Even all evidence cannot fix a unique theory.  
     - Mind change: If shown that auxiliaries can be fixed independently.

  4. **Incommensurability**: A, A2, C2, F3.  
     - Most awkward: No objective comparison between paradigms.  
     - Mind change: If shown objective comparison across paradigms.

  5. **Constructive Empiricist**: A, A2, C2, D2, E2.  
     - Most awkward: Agnosticism about unobservables.  
     - Mind change: If the observable/unobservable line is blurred.

  6. **Bayesian**: A, ... , E2 (and typically D1).  
     - Path: A, then at Node 6: E2 (no residual spread). They might also be A1 and C1.  
     - Most awkward: Priors are sufficient and rational.  
     - Mind change: If shown that priors are arbitrary.

