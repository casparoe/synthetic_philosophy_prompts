  Hi — please take on the role of a professional philosopher who's also completely at home in game theory and knows a decent amount of formal methods and computability. Take your time with this, do a bit of unstructured brainstorming before you settle on an answer, and please write in American English. One more thing: no reading lists, paper titles, or "you should look up X" answers — I want your own analysis, not pointers.

  So here's a pattern I keep running into, and I have no word for it.

  Two people play a prisoner's dilemma exactly once. Same city, no repeat, no reputation, no contract, no outside enforcement, and after it's over they never meet again. The only wrinkle: instead of choosing an action, each of them hands a sealed computer program to a referee. The referee lets each program read the other one's source code, then runs both, and whatever they output is the action. Standard game theory says both defect and that's that. But consider the program that says: cooperate if and only if the other program's source text is character-for-character identical to mine. If both sides submit that, both cooperate — and neither wants to switch to plain "always defect", because then the sources differ, the other side defects back, and the switcher is worse off. So cooperation is stable, in a one-shot game, with no enforcement at all.

  I've noticed the same shape in a second place. Two firms each deploy a pricing algorithm. Neither firm talks to the other, no meetings, no messages, but each algorithm can inspect the other's code. Apparently you can end up with both charging high prices and neither having an incentive to cut — collusion without any agreement, where what makes it work is that each program makes its behavior hinge on the *structure* of the other's decision procedure rather than on a forecast of what the other will output.

  What I can't get straight is how fragile this is, and whether the different failure modes have names. Three variants I've played with:

  1. The text-identity version above. It falls apart if either side reformats, renames a variable, or adds a line of unreachable code. Two programs that behave identically in every possible interaction still defect against each other over pure cosmetics. That feels absurd, like the cooperation isn't really about the strategy at all.
  2. A simulation version: don't compare text, just run the opponent's program against a copy of itself inside a sandbox with a step limit, and cooperate iff that simulation cooperates. This survives reformatting. But what if the opponent's code checks whether it's being simulated and behaves differently when it is? And what's the right default when the simulation hits the step budget — is that defection, or just an unknown?
  3. A proof version: cooperate iff I can find, within a fixed step budget, a proof in some fixed formal system that the opponent cooperates with me. This seems immune to both reformatting and sandbox detection. But when both sides use it, it seems to hit a wall that smells like self-reference — and I genuinely can't tell whether that's a proof-length blowup (an engineering problem) or a Löb-style impossibility (a principled one), or whether those collapse into the same thing once you fix the budget.

  So: does the general trick have an established name, and — more importantly — do the specific distinctions I'm groping at have names? I mean the difference between conditioning on someone's exact source, on a simulation of their behavior, and on a proof about them; and the specific fragility in variant 1 where behaviorally equivalent programs fail to cooperate. If there are established concepts near any of this, I want to know how what I described differs from each of them and which one really fits, not just a label dropped in my lap. If some piece of it has no name, coin one, define it, and give me the boundary cases — what would and wouldn't count as an instance.

  Two more things I'd like you to sort out while you're at it. First: there seem to be endless junk equilibria of the same kind (cooperate iff the opponent's source is at least 500 characters, cooperate iff it mentions a certain word, and so on). Does that equilibrium-selection mess have a name, and does it sink the whole idea or just make it less sexy? Second: which ingredient is actually load-bearing — the fact that the programs are committed and can't be revised, the fact that each can see the other, or something about self-reference specifically? If you drop commitment but keep transparency, does anything survive?
reasoning: |-
  We are given a scenario in a one-shot Prisoner's Dilemma where two players submit computer programs that can inspect each other's source code. The standard game-theoretic prediction is mutual defection, but we observe that by conditioning cooperation on certain properties of the opponent's code, we can achieve stable cooperation.

  The core idea is that each program conditions its action on the opponent's source code. The examples given are:

  1. Text identity: cooperate if and only if the opponent's source code is identical to mine.
  2. Simulation: cooperate if and only if a simulation of the opponent's program (with a step limit) against a copy of itself would cooperate.
  3. Proof: cooperate if and only if there exists a proof (within a bounded proof search) in a fixed formal system that the opponent will cooperate with me.

  We are to analyze the fragility, the distinctions between these, the existence of multiple equilibria, and the critical ingredients.

  Let me brainstorm the issues:

  ### Fragility of the text identity version (variant 1):
  - It requires exact string matching. Any trivial change (comments, whitespace, variable renaming) breaks cooperation even if the programs are behaviorally equivalent.
  - This is absurd because the cooperation is based on syntax, not semantics. It is extremely fragile to any perturbation.

  ### Simulation version (variant 2):
  - More robust to syntactic changes because it runs the code. But it introduces new problems:
    - The opponent might detect that it is being run in a sandbox and change its behavior (e.g., by checking the runtime environment or step count).
    - What if the simulation does not halt within the step limit? We have to decide the default action. Choosing to defect in that case might lead to non-cooperation when the opponent is actually cooperative but complex. Choosing to cooperate might be exploited by a program that deliberately runs long to force cooperation.

  ### Proof version (variant 3):
  - This avoids the sandbox detection issue because it doesn't run the opponent's code but reasons about it.
  - However, it requires a fixed formal system and a bounded proof search.
  - The main challenge is self-reference: when both programs are using the same strategy, we need a proof that the opponent (which is using the same strategy) will cooperate. But the opponent's cooperation depends on a proof about me. This circularity might cause a proof blowup (the proof might be too long to find within the step limit) or even a Löbian obstacle (a reference to Löb's theorem, which in logic says that a system cannot prove its own soundness in a certain way).

  Now, let's address the questions:

  ### Established Names and Distinctions

  The general trick is known as **program equilibrium**. It has been discussed in the context of game theory and computer science, particularly in the work of Tennenholtz (2004) and later by others. However, you asked for my own analysis.

  The specific distinctions:

  1. **Syntactic program equilibrium**: This is the text-identity version. Cooperation depends on the exact syntactic form of the opponent's program. The fragility comes from the fact that even behaviorally equivalent programs (differing only in irrelevant details) are treated as different. We might call this **syntactic fragility**.

  2. **Behavioral simulation program equilibrium**: This is the simulation version. It conditions on the behavior of the opponent's program in a specific test (simulating it against itself). The fragility here is due to **sandbox detection** and **incomplete simulation** (due to step limits). The step limit introduces a **halting problem in bounded time** issue.

  3. **Provability-based program equilibrium**: This is the proof version. It conditions on the existence of a formal proof about the opponent's behavior. The fragility here is due to **proof-theoretic limitations**: the bounded proof search might not find the proof even if it exists (because it's too long), and the fixed formal system might not be strong enough to express the required proof. Moreover, the self-reference might lead to **Löbian obstacles** (which are principled limitations) if the formal system is too weak or the self-reference is handled in a way that invokes the theorem.

  The failure mode in variant 1 (where behaviorally equivalent programs fail to cooperate) can be called **syntactic non-robustness**. The distinction between the three is essentially the level of abstraction at which the opponent's program is analyzed: syntax, runtime behavior (in a specific test), or formal properties (provability).

  ### Multiple Equilibria (Junk Equilibria)

  Yes, there are many such equilibria. For example: cooperate if the opponent's code has an even number of characters, or if it contains the string "hello", etc. These are also program equilibria, but they are arbitrary and not based on any meaningful notion of reciprocity.

  This is a problem of **equilibrium selection**. In game theory, the usual way to handle this is by introducing refinements (like trembling hand perfection or Pareto optimality) to select the most reasonable equilibria. In this context, we might prefer equilibria that are:

  - **Robust**: to minor changes in the program (like the simulation or proof versions).
  - **Pareto efficient**: mutual cooperation is better than mutual defection.
  - **Reciprocal**: the condition for cooperation is based on the opponent being similarly cooperative.

  The existence of multiple equilibria doesn't sink the idea. It just means that we need a theory of which program equilibria are likely to be played. This is sometimes addressed by assuming that the programs are written by rational agents who will choose the best equilibrium (if there is a focal one) or by evolutionary selection.

  ### Critical Ingredients

  Let's break down the ingredients:

  1. **Commitment**: The programs are submitted and cannot be changed. This is crucial because without commitment, a player could change their program after seeing the opponent's. In the one-shot setting, the commitment is what allows the programs to be fixed and inspected.

  2. **Transparency**: Each program can inspect the opponent's source code. This is essential for the conditioning (on syntax, simulation, or proof) to be possible.

  3. **Self-reference**: In the simulation and proof versions, the opponent's program is being analyzed in a context that might involve the same strategy (as in the simulation against a copy of itself) or a proof that involves the same program. This self-reference is what enables the circular reasoning that leads to cooperation. But note: the text identity version doesn't require self-reference in the same way because it's a simple string comparison.

  What if we drop commitment? Suppose the players can see the opponent's program and then choose their own action without committing to a program. Then the situation reduces to a normal form game where each player, knowing the opponent's program, chooses an action. But then the equilibrium might break: if player A submits a program that cooperates only if player B's program is identical, and player B sees that and can choose any program, then player B can simply copy player A's program and get cooperation. But note: without commitment, player A might change their mind too. So without commitment, we are back to the standard simultaneous move game, and mutual defection is the only equilibrium. Therefore, commitment is essential.

  Transparency (source code inspection) is also essential. Without it, the program cannot condition on the opponent's code.

  Self-reference is not always essential. The text identity version doesn't require self-reference. But in the simulation and proof versions, self-reference is what allows the programs to reason about each other in a way that leads to mutual cooperation.

  ### Conclusion

  - The general trick is **program equilibrium**.
  - The distinctions:
    - **Syntactic program equilibrium**: fragile to any code change.
    - **Behavioral program equilibrium via simulation**: fragile to sandbox detection and step limits.
    - **Provability-based program equilibrium**: fragile to proof-theoretic limitations (both practical and principled).

  - The fragility in variant 1 is due to **syntactic non-robustness**.
  - The problem of multiple equilibria is inherent and is a form of **equilibrium selection problem** in program equilibrium. It does not sink the idea but complicates it.
  - The critical ingredients are **commitment** and **transparency**. Without commitment, the program equilibrium idea collapses. Without transparency, the conditioning on the opponent's code is impossible. Self-reference is not essential for the simplest form (text identity) but is central for the more robust forms.

  ### Coining Terms for the Fragilities

  1. **Syntactic fragility**: When cooperation depends on the exact string of the source code, and any syntactic change breaks cooperation even if the behavior is unchanged.

  2. **Simulation fragility**: When cooperation depends on simulating the opponent, and issues arise from:
     - **Adversarial simulation detection**: The opponent detects the simulation and changes behavior.
     - **Incomplete simulation**: The simulation does not complete within the step limit, forcing a default action that might be incorrect.

  3. **Provability fragility**: When cooperation depends on finding a formal proof, and issues arise from:
     - **Proof search incompleteness**: The proof exists but is too long to be found within the step limit.
     - **Formal system incompleteness**: The formal system is not strong enough to prove the required statement (especially self-referential ones).
     - **Löbian obstacles**: The self-referential nature of the proof requirement leads to a situation where the cooperation condition cannot be proven (as in Löb's theorem) without additional assumptions.

  ### Boundary Cases

  For **syntactic program equilibrium**: 
  - An instance: two programs that are character-for-character identical and condition on identity. They cooperate.
  - Not an instance: two programs that are behaviorally identical but differ in a comment and defect against each other.

  For **behavioral simulation program equilibrium**:
  - An instance: program A simulates program B (which is identical to A) in a sandbox with a step limit and sees that it cooperates (because when run against itself, it would cooperate). So A cooperates.
  - Not an instance: if the simulation is not of the opponent against a copy of itself but against a fixed strategy, then it might not capture the reciprocal nature.

  For **provability-based program equilibrium**:
  - An instance: program A can find a proof that program B (which is the same as A) will cooperate with A, because B uses the same strategy and A can prove that about itself (and by symmetry about B). But note: this self-proof might be tricky because of circularity.
  - Not an instance: if the proof system is too weak to prove the required statement, then even if the programs are identical, the proof might not be found.

  ### Final Thoughts

  The idea is fascinating and shows how commitment and transparency can enable cooperation in one-shot games. The fragility issues are real and point to the challenges in implementing these strategies. The proof version is the most robust in theory but runs into the limits of formal systems. In practice, we might need to use a combination of these ideas and accept some fragility.

  As for names for the entire class: **source-conditional program equilibrium** might be a term that covers all three, but the specific mechanisms are distinct. The distinctions I've drawn are not standardly named, so I've coined terms for them.

  The equilibrium selection problem remains open, but we can hope that in a given context, the most robust and efficient equilibrium (like the proof-based one) would be focal.
answer: |-
  ### Unstructured Brainstorming
  Okay, let's unpack this systematically. The core pattern is using *program structure* (not just output) to achieve cooperation in a one-shot Prisoner's Dilemma (PD) with mutual code visibility. Standard game theory fails here because it treats agents as black boxes choosing actions, but when agents commit to algorithms that can *inspect each other's source*, we open the door to self-referential coordination. 

  Your variants highlight key fragility points:
  - **Text identity**: Cooperation depends on syntax, not semantics. Two behaviorally identical programs defect over trivial differences. Absurd but logically sound.
  - **Simulation**: More robust to syntax, but vulnerable to meta-reasoning (e.g., opponent detecting sandboxing). Also, halting problems lurk in step limits.
  - **Proof**: Avoids runtime tricks but hits Gödelian walls—proofs about mutual behavior might be long, impossible, or require impossible self-proof.

  The "junk equilibria" problem is real but not fatal—it just shows this is a coordination game in program space. The critical question is what *enforces* the correlation of strategies. Commitment and mutual visibility are non-negotiable; without them, we revert to standard PD. Self-reference isn't always needed (text identity avoids it) but emerges in robust versions.

  ### Core Concept: Program Equilibrium
  The general trick is **program equilibrium** (PE). It’s a game-theoretic concept where players submit programs that condition actions on each other’s source code. PE exploits the fact that programs can enforce mutual strategy correlation *before* actions are chosen. Crucially, PE doesn’t require repeated play, reputation, or external enforcement—it leverages the **commitment device** of submitting unchangeable code and **mutual transparency**.

  ### Your Variants: Fragility and Distinctions
  Your variants reveal three flavors of PE, each with distinct failure modes. None have universally accepted names, so I’ll define them based on their **verification method**:

  1. **Syntactic Program Equilibrium (SPE)**  
     - **Definition**: Cooperate iff opponent’s source code is textually identical to yours.  
     - **Fragility**: **Behavioral fragility**—fails if programs are semantically equivalent but syntactically distinct (e.g., renamed variables, added comments).  
     - **Why it fails**: Verification is **syntactic**, not semantic. Cooperation isn’t about the *strategy* but literal code matching.  
     - **Boundary cases**:  
       - ✅ *Instance*: Two copies of `if (other_code == my_code) cooperate else defect`.  
       - ❌ *Not an instance*: Programs that cooperate if behaviorally equivalent (e.g., via abstract syntax trees). SPE cares only about text.  
     - **Engineering takeaway**: SPE is useless in practice—it’s a proof-of-concept that any syntactic correlation works, however arbitrary.

  2. **Behavioral Simulation Equilibrium (BSE)**  
     - **Definition**: Cooperate iff a sandboxed simulation of the opponent’s program (against your own or a copy) cooperates within a step limit.  
     - **Fragility**: **Sandbox vulnerability**—fails if the opponent detects simulation (e.g., via timing checks) and defects. Also, **step-limit ambiguity** (is timeout = defect?).  
     - **Why it fails**: Verification relies on runtime *behavior* in a specific context, which can be gamed. Defaulting to "defect on timeout" invites false negatives; "cooperate on timeout" invites exploitation.  
     - **Boundary cases**:  
       - ✅ *Instance*: Simulate `opponent_program(my_source)`; cooperate if it outputs "cooperate".  
       - ❌ *Not an instance*: Programs that use static analysis (e.g., "does this code contain a loop?"). BSE requires *execution*.  
     - **Engineering takeaway**: BSE is plausible but brittle—real-world equivalents (e.g., AI agents) must hide simulation or face adversarial code.

  3. **Provability-Based Equilibrium (PBE)**  
     - **Definition**: Cooperate iff you find a proof (in a fixed formal system, within step limits) that the opponent cooperates with you.  
     - **Fragility**: **Proof-theoretic limits**—fails if the proof is too long (engineering) or impossible (principled, e.g., Löb’s theorem). Mutual PBE risks infinite regress: "I cooperate if I prove you cooperate if you prove I cooperate..."  
     - **Why it’s subtle**: Proofs avoid runtime tricks but face **self-reference paradoxes**. Unlike SPE/BSE, PBE’s fragility isn’t just engineering—it’s computational *and* logical. The step budget turns Löbian "impossibility" into a **practical constraint** (proofs are too long to find).  
     - **Boundary cases**:  
       - ✅ *Instance*: Search for a proof of "opponent outputs cooperate given my source".  
       - ❌ *Not an instance*: Heuristic reasoning (e.g., "this code looks cooperative"). PBE requires formal proofs.  
     - **Engineering takeaway**: PBE is theoretically robust but scales poorly—useful for small programs, hopeless for complex ones.

  ### Junk Equilibria and Selection
  The "junk" problem (e.g., cooperate iff code > 500 chars) is **equilibrium proliferation via arbitrary correlation**. It doesn’t sink PE—it highlights that *any* shared predicate can anchor cooperation. But it **doesn’t matter** if we care only about existence of *some* cooperative equilibrium. If we want *efficient* cooperation, we need equilibrium selection:  
  - **Focal points**: Players coordinate on "natural" strategies (e.g., PBE over SPE).  
  - **Pareto dominance**: Mutual cooperation beats junk (e.g., 500-char cooperators get lower payoffs if they could both defect).  
  - **Robustness**: Players prefer strategies resilient to perturbations (e.g., PBE over SPE).  
  This is **program-space equilibrium selection**—the same problem as selecting among Nash equilibria, but with programs as strategies.

  ### Load-Bearing Ingredients
  - **Commitment** (submitting unchangeable programs): **Essential**. Without it, players defect after seeing the opponent’s code.  
  - **Mutual transparency** (each sees the other’s source): **Essential**. Without it, programs can’t condition actions on structure.  
  - **Self-reference**: Not essential for SPE (text matching isn’t self-referential) but critical for BSE/PBE. BSE/PBE use self-reference to resolve mutual dependency ("I cooperate if you do the same").  
  - **What if we drop commitment?** If programs aren’t committed, transparency alone fails—players defect unconditionally once they see the opponent’s strategy. Commitment locks in the correlation.  

  ### Final Definitions and Boundaries
  - **Program Equilibrium (PE)**: Any equilibrium where players submit programs that inspect each other’s source to condition actions.  
    - **Boundary**: Must involve source-code inspection. Black-box algorithms (e.g., "cooperate if opponent cooperated last time") don’t count—they require repeated play.  
  - **Behavioral Fragility**: SPE’s failure mode—cooperation breaks under semantic equivalence. Unique to syntactic verification.  
  - **Sandbox Vulnerability**: BSE’s failure mode—cooperation breaks under adversarial simulation. Unique to runtime verification.  
  - **Proof-Theoretic Limits**: PBE’s failure mode—cooperation breaks under proof complexity/impossibility. Unique to formal verification.  

  ### Bottom Line
  PE is a legit escape hatch from one-shot PD, but its fragility is multi-layered. SPE is absurdly brittle, BSE is hackable, and PBE is computationally cursed. Yet all work in theory—because game theory cares about incentives, not practicality. The distinctions you’re groping at map to **verification methods** (syntax, behavior, proofs), each with characteristic flaws. Junk equilibria are a nuisance but not fatal; commitment and transparency are the true pillars. If you want a one-sentence summary: **Program equilibrium enables cooperation by turning source code into a correlation device, but the devil is in the verification—choose your poison: syntax, simulation, or proof.**
