answer: |-
  Here's my credence breakdown for the candidate axiology family **V(P) = f(mean welfare) × g(population size)** with **f increasing, continuous, f(0) = 0**, and **g increasing but bounded above**, evaluated against the constraints of **avoiding the strong repugnant conclusion (RC)** and **never making things worse by adding a life worth living (no-worsening)**.

  ### (i) Credence that no-worsening forces g unbounded: **65%**  
  *Justification:* If you add a person at welfare *w* (where *w* > 0) to a population of size *N* with mean welfare *μ*, the new mean is *μ'* = (*Nμ* + *w*)/(*N*+1). The drop in mean welfare is *Δμ* ≈ (*μ* - *w*)/*N* for large *N*. To ensure *V* doesn't decrease (no-worsening), we need:  
  **f(μ')·g(N+1) ≥ f(μ)·g(N)**.  
  Rearranged: **g(N+1)/g(N) ≥ f(μ)/f(μ')**  
  If *w* << *μ* (e.g., adding a barely-worthwhile life to a high-welfare population), *μ'* ≈ *μ* - (*μ*/*N*), so *f(μ)/f(μ')* ≈ 1 + [(*μ f'(μ)*) / (*f(μ) N*)] by Taylor expansion. The term [*μ f'(μ)* / *f(μ)*] is the **elasticity of f** at *μ*. If this elasticity is bounded away from zero for some *μ* > 0 (e.g., *f(x)* ~ *xᵏ* for *k*>0 near *x*=*μ*), then *g(N+1)/g(N)* must be ≥ 1 + *C/N* for some *C*>0, forcing *g* to grow like *Nᶜ* (unbounded). But if *f* is extremely flat near 0 (e.g., *f(x)* ~ 1/|log x|* as *x*→0⁺), the elasticity near 0 could decay rapidly, *potentially* allowing bounded *g* when adding lives near zero welfare. **65%** reflects this tension: forcing unboundedness is likely but not certain if *f* flattens drastically near zero. Saturation at high welfare doesn't affect this, as RC hinges on low-ε comparisons.

  ### (ii) Credence that bounded g blocks strong RC: **95%**  
  *Justification:* Strong RC requires that ∀*W*, *n*, ∀ε>0, ∃*N* such that *N* lives at ε are better than *n* lives at *W*. With bounded *g*, say *g(N) < G* for all *N*. Then *V*(*N* at ε) = *f*(ε)·*g*(*N*) < *f*(ε)·*G*. Since *f* is continuous with *f*(0)=0, for any fixed *V*₀ = *f*(*W*)·*g*(*n*) > 0, we can choose ε small enough that *f*(ε)·*G* < *V*₀. At this ε, no *N* suffices. **95%** because this holds regardless of *f*'s shape or *g*'s bounded growth rate—only boundedness and *f*→0 matter.

  ### (iii) Credence that multiplicative separability is the core issue: **40%**  
  *Justification:* The difficulty likely persists without separability. For example, if *V*(*P*) = *h*(mean welfare, population size) with *h* increasing in both arguments and bounded in size (for fixed mean), adding a life worth living could still require *h* to grow rapidly in size to offset mean drops (similar to (i)). However, non-separable forms (e.g., *V* = [mean welfare]·[size]^(*k*(mean welfare)) might allow "adaptive" trade-offs that avoid forcing unboundedness. **40%** reflects skepticism that relaxing separability resolves the tension, but it might offer escape routes.

  ### (iv) Credence that RC's unacceptability and no-worsening for barely-worthwhile lives are crucial: **85%**  
  *Justification:* If adding a barely-worthwhile life could sometimes make things worse (violating no-worsening), *g* need not be increasing, and bounded *g* could easily block RC. If RC were merely surprising (not unacceptable), we might accept it and abandon the project. But the problem's force relies on both: RC is widely rejected, and no-worsening for lives above zero seems core to population ethics. **85%** because relaxing either undermines the axiology's motivation.

  ---

  ### Combined credence that some view in this family satisfies all constraints: **25%**  
  *Calculation & Justification:*  
  - High confidence in (ii) (95%) supports blockability.  
  - But (i) (65% for forced unboundedness) and (iii) (40% for separability being pivotal) dominate: if no-worsening forces *g* unbounded (likely), RC returns.  
  - (iv) (85%) implies constraints are rigid.  
  **Net**: 25% = [1 - credence(i)] × credence(ii) × adjustment for (iii,iv) ≈ (1-0.65) × 0.95 × 0.75 ≈ 35% × 0.95 ≈ 33%, then discounted to 25% for interactions and residual risk in (i).  
  *Core tension*: Bounded *g* blocks RC mathematically, but no-worsening may *require* unbounded *g*, reintroducing RC.

  ---

  ### Least confident term: **(iii) multiplicative separability (40%)**  
  **What would move it most**: Constructing a **non-separable bounded V** that strictly satisfies no-worsening for all welfare levels and blocks strong RC. For example:  
  - If *V* = *f*(mean) × *g*(size) + *h*(mean, size) with *h* counteracting mean drops.  
  - Empirical work showing that human moral intuitions obey no-worsening *only* when separability holds.  
  - A theorem proving that *any* increasing *V* with *∂V/∂size > 0* and bounded *V* must violate no-worsening for some low-*w* additions, regardless of functional form.
