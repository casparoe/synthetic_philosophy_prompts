answer: |-
  ### Sestina of the Circle's Chord

  The compass parts, the ink begins to dry,  
  a **circle** fixed, a truth without a seam.  
  Inside, three points—each peak a star that’s pinned—  
  define the triangle, rigid and sublime.  
  Now ask: how often does a **random** line  
  drawn **evenly** through night exceed that edge?  

  One answer seems to rise above the fray—  
  a single fraction, clear as glass, to trim  
  the doubt. We trust the **circle** holds one key,  
  that **random** means one act, one way to cast  
  the die. The **chord** should sing one length, we claim,  
  and **evenly** dispense its grace or blame.  

  But **evenly**’s the rub—what’s spread where?  
  A spinning needle, whirring like a prayer,  
  sweeps **random** rays from center out to **rim**,  
  then stops. Along that spoke, a **middle** dot  
  is chosen. **Chord** springs forth: half pass the test.  
  The **circle** breathes—one verdict, half-confessed.  

  Then rain: a **random** drop on glass descends,  
  a **middle** landing where the wetness dims  
  the disk. The **chord** blooms from that speck—a stem  
  that’s long if close to core, else brief and thin.  
  **Evenly** spread? The whole round field’s the stage.  
  Here, just one-fourth outstrip the triangle’s cage.  

  Two pins pierce the **rim**: each **random** pierce  
  marks where the thread begins and ends. The **chord**  
  arcs high or droops. **Evenly** paired, the choices  
  split the chance three ways—one-third accord  
  with length. The **circle**’s lip, a **middle** ground  
  for pairs, now yields a fraction less profound.  

  I, careful, weighed each **chord** by length alone—  
  from zero whisper to the diameter’s shout—  
  laid **evenly** along a scale of sound.  
  The **circle**’s span, **random** as unstrung beads,  
  gave one in ten, near—something thin and grim.  
  The books don’t speak this number from the **rim**.  

  Now change the shape: let four points claim the **rim**.  
  The square’s side, longer, asks the same of **random**  
  lines. The rain and pins both say half—aligned—  
  while spokes still spin a different tale, unkind.  
  No triangle’s rift: two methods merge as one.  
  The **circle** watches, silent, what we’ve done.  

  In **middle** stances, confidence spread **evenly**  
  by rule dissolves when measures shift—no guard  
  against the turn of worlds. The **random** points  
  on **rim** or radius flare or fade. Each **chord**  
  sings fractions: half, one-third, one-fourth, one-tenth.  
  The **circle** holds them—all—in its fixed breadth.  

  —  
  *Envoi*  
  A scholar claims the spoke’s half, **evenly** spun,  
  stands **random** yet unmoved by scale or sun—  
  the **circle**’s true **middle**. But watch the **rim**:  
  two pins, rain, length—each **chord**’s chance, slim or brimmed,  
  waits in the numbers. Spread your trust? The air  
  thins where the **random** rule forgets to care.  

  ---

  **Note on Figures**:  
  Your calculations are correct: for the square, the rim-points and raindrop methods both yield 1/2, while the radius method gives ≈0.707; for the triangle, your even-length distribution yields ≈0.134. The invariance argument for the radius method (yielding 1/2) is acknowledged in the envoi without endorsement or dismissal.
