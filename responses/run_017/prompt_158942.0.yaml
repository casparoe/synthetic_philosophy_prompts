  ## OFFICE FOR PHENOMENAL INTEGRATION  
  GUIDANCE NOTES: PI/GN/0037 (REV. 12)  
  SUBJECT: ADMINISTRATIVE PROCEDURES FOR CONSTITUTIVE PHENOMENAL UNIFICATION  

  **Issuing Authority:** Central Coordination Directorate, Office for Phenomenal Integration (OPI)  
  **Effective Date:** [Redacted]  
  **Supersedes:** PI/GN/0037 (REV. 11)  

  1.  **Scope of Application:** These notes apply to all casework concerning the registration, maintenance, and dissolution of Unified Phenomenal Subjects (UPS) under the provisions of the Phenomenal Integration Act (Standard Model). They detail procedures for managing the constitutive relationship between registered Micro-Subjects (MS) and their resultant UPS, as per established doctrine. Caseworkers are reminded that the existence and binding nature of MS are foundational premises; applications challenging these are inadmissible (Ref: PIA-SM, Sect. 1(a)).

  2.  **Distinction: Quality Composition vs. Subject Composition:** Caseworkers must rigorously distinguish between:
      *   **2a. Quality Composition:** The manner in which the *experiential qualities* manifest within a UPS arise from the qualitative properties of its constituent MS (e.g., the "redness" of a macro-experience from micro-qualia). This is generally resolvable via standard Quality Binding Assessment (Form PI-7).
      *   **2b. Subject Composition:** The process by which discrete MS, each a bearer of intrinsic subjective perspective, jointly constitute a *single, novel* UPS. This constitutes the majority of complex casework (Category C-4 files). While arising from the same constitutive base, Subject Composition requires distinct procedural handling under Directive PI-8 (Subject Unification Protocols).

  3.  **The Bonding Relation (Directive BR-1):** The relation (`R`) enabling the unification of MS into a UPS is administratively classified as *non-experiential* and *non-substantive*. Per Standing Ruling SR-004 (Ministry of Fundamental Ontology):
      *   **3a.** `R` is not itself an experience-bearing entity. It possesses no qualitative properties requiring integration.
      *   **3b.** `R` does not, therefore, stand in need of a further bonding relation (`R'`) to be integrated into the UPS or with other `R` instances. Applications proposing the existence of, or requesting registration for, `R'` (Second-Order Bonding Entities) are summarily refused under Code PI-12 ("Recursive Bonding Prohibition"). Appeals citing "explanatory gap" are to be filed under PI-12a and routinely dismissed following precedent set in *In re: Holistic Emergence (Denied)*.

  4.  **Micro-Qualia Introspection Barrier (Regulation Intro-2):** Citizens registered as UPS consistently report an inability to introspectively access the specific qualitative states of their constituent MS. This is an expected, non-pathological feature of the system, documented as the "Resolution Threshold Effect". Petitions claiming this constitutes evidence that MS qualia are not *truly* constitutive of UPS experience, or demanding introspection "at funded resolution," are to be processed as follows:
      *   **4a.** Assertions that the inaccessible micro-qualia are irrelevant to the UPS experience contravene foundational doctrine and are inadmissible (Ref: PIA-SM, Sect. 1(a)).
      *   **4b.** Requests for "funded resolution" introspection are classified as Category F-1 (Metaphysical Hardware Queries). Standard response: "The phenomenal resolution of a UPS is a constitutive property, not a perceptual parameter subject to adjustment. Funding relates to administrative processes, not experiential granularity. Petition closed."

  5.  **Boundary Disputes & Entitlement to UPS Status (Procedure BD-5):** Not every arbitrary collection of MS qualifies for registration as a distinct UPS. Applications for UPS registration (Form UPS-R1) must demonstrate:
      *   **5a.** A stable, causally integrated structure meeting the Minimal Complexity Threshold (MCT) defined in Annex MCT-A.
      *   **5b.** The presence of a viable bonding relation `R` per Directive BR-1 and verified by Bonding Assessment Instrument (BAI) protocols.
      Disputes often arise concerning marginal cases (e.g., transient neural assemblies, distributed sensor networks). Caseworkers must apply MCT criteria strictly. Appeals arguing that the MCT is arbitrary should be referred to the Boundary Review Panel (BRP), whose rulings cite "operational necessity" and are final.

  6.  **Intrusive Experience Reports (Protocol IER-3):** Citizens occasionally report experiences that feel "alien" or "not theirs," seemingly intruding into their unified field. These are classified as Anomalous Phenomenal Inclusions (API). Standard procedure:
      *   **6a.** Investigate for standard neuropathology or system error first (Ref: Medical & Technical Screening List).
      *   **6b.** If negative, categorize as "Constitutive Noise" (Code CN-7). Explanation: Due to the complex nature of `R`, occasional micro-qualia may fail to be fully integrated into the macro-qualitative field, creating a perceived intrusion. Reassurance and standard coping strategies (per Doc PI-Help/CN7) are prescribed. Do *not* entertain interpretations suggesting a failure of subject unity or the presence of "rogue" MS acting independently.

  7.  **Decombination Procedures (Directive DC-9):** Applies when a previously unified UPS undergoes physical separation sufficient to disrupt `R` (e.g., radical neural bisection confirmed by Form NS-22 "Neuro-Separation Certificate").
      *   **7a.** The originating UPS is administratively dissolved.
      *   **7b.** Two (or more) new UPS registration applications (Form UPS-R1) are initiated for the resulting stable, integrated structures, subject to standard MCT and `R` assessment.
      *   **7c.** **Critical Note:** The application is for *new* UPS arising from the separated components. The original citizen's *legal identity* may be reassigned to one emergent UPS (per Identity Continuity Guidelines, ICG-5), but this is an administrative, not metaphysical, procedure. The claim "I am now two people" is literally false; the original UPS ceased, and two new ones began.

  8.  **Cosmic Subject Decombination Queries (Memo CSD-1):** A minority philosophical position posits a single, fundamental Cosmic Subject (CS). Citizens influenced by this view occasionally petition the OPI regarding the apparent *decombination* of the CS into multiple UPS, querying the legitimacy of this process or requesting "reintegration."
      *   **8a.** Reiterate official doctrine: The OPI administers the constitutive micropsychist model. The CS hypothesis falls outside operational parameters (Ref: Standing Ruling SR-004, Scope of Applicability).
      *   **8b.** Inform the petitioner that while the CS model presents a *symmetrical* administrative challenge concerning decombination (i.e., explaining how one fundamental subject becomes many), this challenge is not recognized under current OPI procedures. Petitions must be filed under the (currently non-existent) "Cosmic Subject Division" protocol, which has no allocated resources or procedures. Petition closed (Code: OUT-OF-SCOPE/CS).

  9.  **Prohibited Interpretations (Directive PI-0):** Caseworkers must ensure all procedures and explanations remain strictly within constitutive micropsychist doctrine. Any case resolution implying either:
      *   **9a.** The UPS emerges as a novel subject *brutely* from non-subjective parts (Emergentism), or
      *   **9b.** The UPS does not exist as a genuine subject at all, being merely an aggregate of MS (Eliminativism/Aggregatism),
      ...contradicts the foundational justification for the OPI's existence and the PIA-SM. Such interpretations are categorically prohibited in official documentation, rulings, and caseworker explanations. Adherence to constitutive micropsychism, with its attendant administrative complexities, is mandatory.

  ---
  **Author's Note on Satirical Targets:**

  This piece exaggerates the *structural response* within constitutive micropsychism: each problem (subject unity, bonding regress, introspection limits, vagueness, decombination) is "solved" by bureaucratic fiat – a new posit (`R`, MCT, Resolution Threshold, Constitutive Noise) or procedure – mirroring the civil service analogy. It highlights how avoiding the "escape hatches" (brute emergence or eliminativism) forces increasingly complex, perhaps question-begging, machinery. The two readers likely exempt are indeed:

  1.  **Cosmopsychists:** They take the macro (cosmic) subject as basic, inheriting only the *decombination* problem (how/why the One appears as Many). The satire's focus on micro-to-macro *compositional* struggles misses them entirely; their problem looks like the *reverse* administrative headache (point 8).
  2.  **Eliminativist Micropsychists:** They bite the bullet on point 9b. For them, there *is* no genuine macro-subject to unify or administer, only micro-subjects and their collective behaviour. The entire OPI bureaucracy, satirizing the struggle *for* macro-subjects, is redundant from their perspective. They see the satire as attacking a problem they dissolved by denying its central premise.

  A third potential exempt group might be *illusionists* about consciousness itself, but they reject the starting premise (real micro-subjects) more fundamentally than the eliminativist micropsychist. The satire assumes consciousness is real and micropsychism true, making illusionists largely outside its scope.
