prompt: |-
  I am putting together a diagnostic for the graduate seminar I teach on markets and commodification, and I want it to sort students by what they say about cases rather than by which label they will put their hand up for. Please build me a decision tree: eight or nine branch questions, five to seven leaves, answerable cold in fifteen minutes.

  Every node must be a concrete case or a single claim, phrased so that a student can answer it without knowing which position it leads to. Nothing phrased as "is the good inalienable?" or "is commodification corrosive?".

  The distinctions I need the tree genuinely to separate are: (i) what the objection is supposed to attach to — the kind of good, the bare fact of transfer, the money form as opposed to a non-cash return, the motive the exchange expresses or cultivates, or the spillover onto non-participants; (ii) which direction the repugnance runs in, seller-side, buyer-side or both — the kidney case should appear twice, once from each side, since students who find buying disgraceful often admire giving, while those who find selling disgraceful rarely object to receiving; (iii) whether consent cures the objection when it is uncoerced but given under desperation; (iv) whether the right response is prohibition, channelling into non-price allocation (lottery, priority-for-giving, altruistic register) or permission under restrictions; (v) whether the objection binds the individual agent or the law, since students standardly hold these apart and then discover they cannot.

  Cases that must appear as nodes: a kidney sale between strangers where the vendor is poor but unpressured; disaster-time price rises set by an automated pricing system, where the higher price is what moves the good to those who need it most and no human intends exploitation; vote selling where receipts are verifiable; and a scheme in which no money changes hands but donors gain priority on the transplant list.

  Before naming any leaf, set out the questions and the number of answer-combinations they generate, then locate the actual positions in that space; name any combination nobody occupies and say whether it is incoherent, merely unattractive, or simply unexplored. Flag any two leaves your questions cannot in principle separate. Then trace two contrasting answer-patterns through to different leaves, so that I can check the key actually discriminates. British English throughout, and no footnotes or reading list — I know the literature.
reasoning: |-
  Okay, the user is designing a diagnostic for their graduate seminar on markets and commodification. They need a decision tree that sorts students based on their responses to concrete cases rather than self-identified labels. The tree must have 8-9 branch questions leading to 5-7 leaves, answerable in 15 minutes.

  Key requirements from the query:
  - Every node must be a concrete case or single claim, avoiding theoretical terms like "inalienable" or "corrosive"
  - Must distinguish between: (i) objection targets (type of good, transfer fact, money form, motives, spillovers), (ii) direction of repugnance (seller/buyer/both), (iii) consent under desperation, (iv) policy response (prohibit/channel/permit), (v) individual vs legal obligation
  - Mandatory cases: kidney sale (poor vendor), algorithmic disaster pricing, verifiable vote selling, transplant priority scheme

  The user is clearly an expert (notes "know the literature"), so the tool must show academic rigor while remaining accessible. The British English requirement means avoiding Americanisms like "gas prices" or "apartment".

  Building the tree structure:
  - Starting with kidney sale to immediately test repugnance direction (seller/buyer distinction)
  - Disaster pricing isolates money-form objections vs efficiency arguments
  - Vote selling challenges consent validity even when technically verifiable
  - Transplant priority tests non-monetary commodification
  - Adding cases like child labor and surrogacy to cover desperation/consent and motive cultivation

  For the leaves, mapping to real positions:
  1. Universal Commodifier (libertarian/Chicago school)
  2. Market Sceptic (Sandel-type anti-commodification)
  3. Motive Purist (Anderson/Dworkin focus on expressive harm)
  4. Structuralist (concerned with systemic effects like inequality)
  5. Altruism Channeler (Titmuss-inspired, favors non-market allocation)
  6. Unoccupied: "Consent Trumps All + Prohibition" - logically contradictory

  Validation checks:
  - Contrasting paths: A student approving all transactions lands at Universal Commodifier, while one objecting to all sales but accepting priority scheme reaches Altruism Channeler
  - The tree separates seller-side kidney objection (Market Sceptic) from buyer-side objection (Motive Purist) via different branches

  Notably, the disaster pricing question (Q2) can't distinguish between Structuralists and Altruism Channelers - both reject it but for different reasons. This is intentional per the user's request to flag inseparable positions.
answer: |-
  Here is a decision tree meeting your specifications. It uses 8 binary questions (generating 256 possible combinations) to sort students into 5 distinct positions, with unoccupied combinations noted. Cases appear verbatim as nodes, answers are concrete ("yes/no" or "acceptable/unacceptable"), and distinctions track your requirements.

  **Decision Tree Questions:**

  1.  **Kidney Sale:** "A healthy adult, living in poverty but not threatened or deceived, voluntarily sells one kidney to a stranger for life-changing money. Is this transaction *acceptable*?"
      *   *(Tests: repugnance direction [seller-side], consent under desperation, good-type objection)*

  2.  **Disaster Pricing:** "During a natural disaster, an automated system raises bottled water prices tenfold based on real-time scarcity. This rations water to those who need it most urgently (as they pay most), with no human setting prices or profiting. Is this outcome *acceptable*?"
      *   *(Tests: money-form objection vs. efficiency, spillover objections, motive/exploitation)*

  3.  **Vote Selling:** "In an election, a voter verifiably sells their vote to a candidate for cash, with a foolproof receipt. No coercion or deception occurs. Is this transaction *acceptable*?"
      *   *(Tests: good-type objection, bare transfer objection, consent sufficiency)*

  4.  **Transplant Priority:** "A scheme allows living kidney donors to gain verifiable priority on the transplant waiting list *if they ever need one*, but no money changes hands. Is this scheme *acceptable*?"
      *   *(Tests: non-monetary commodification, channelling vs. prohibition, motive cultivation)*

  5.  **Desperate Labour:** "A desperately poor person, facing imminent homelessness, takes a dangerous, degrading job (e.g., cleaning toxic waste without adequate protection) for wages just sufficient to avoid destitution. They fully understand the risks. Is this *acceptable*?"
      *   *(Tests: consent under desperation curing objection, spillover effects, individual vs. legal obligation)*

  6.  **Kidney Purchase:** "A wealthy person in renal failure, ineligible for altruistic donation or public listing, buys a kidney from a healthy stranger (under the same conditions as Q1). Is *their act of buying* acceptable?"
      *   *(Tests: repugnance direction [buyer-side], distinct from seller-side)*

  7.  **Surrogate Motive:** "A commercial surrogacy agency requires intended parents to state their primary motive for using a surrogate is 'avoiding pregnancy inconvenience' (rather than medical necessity) to qualify for their premium service. Is this requirement *acceptable*?"
      *   *(Tests: motive cultivation/expression as core objection, distinct from transfer or good-type)*

  8.  **Child Artisan:** "Parents in severe poverty have their 10-year-old child weave intricate carpets for long hours, selling them globally via a fair-trade co-op. The income lifts the family out of starvation, the child isn't physically harmed, and buyers value the 'authenticity'. Should this be *legally prohibited*?"
      *   *(Tests: individual vs. legal obligation, spillover/exploitation, limits of consent [parental], channelling vs. prohibition)*

  ---

  **Tree Logic & Leaf Positions:**

  *   **Possible Combinations:** 8 binary questions = 256 possible answer combinations.
  *   **Defined Leaves (5 Positions):** These positions occupy clusters of similar answer combinations.
      *   **Leaf 1: Universal Commodifier (UC)**
          *   *Profile:* Accepts all transactions (Q1-7: Yes/Acceptable; Q8: No Prohibition). Objections rarely attach; consent nearly always sufficient. Law should permit.
          *   *Answers:* Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q5=Y, Q6=Y, Q7=Y, Q8=N
      *   **Leaf 2: Market Sceptic (MS)**
          *   *Profile:* Objects to marketizing specific goods (kidneys, votes) intrinsically. Repugnance often seller-side (Q1) but buyer-side varies (Q6). Consent under desperation doesn't cure (Q5=N). Favours prohibition or strict non-market channelling (Q4=Y shows channelling acceptable). Spillovers matter (Q2=N, Q8=Y).
          *   *Core Answers:* Q1=N (Object to Kidney Sale), Q3=N (Object to Vote Sale), Q4=Y (Accept Priority Scheme), Q5=N (Object to Desperate Labour), Q8=Y (Prohibit Child Labour). Q2 & Q6 often N, Q7 often N.
      *   **Leaf 3: Motive Purist (MP)**
          *   *Profile:* Core objection is to degrading *motives* cultivated or expressed (Q7=N). Money is often the culprit (Q2=N, Q1=N Seller-side). Non-monetary exchange can be acceptable (Q4=Y). Buyer-side repugnance possible (Q6=N). Consent doesn't cure corrupt motives (Q5=N, Q3=N). Favours channelling (Q4=Y) or prohibition.
          *   *Core Answers:* Q7=N (Object to Motive Requirement), Q1=N (Seller-side Kidney), Q4=Y (Accept Priority Scheme). Q2=N (Algorithm Pricing), Q3=N (Vote Sale), Q5=N (Desperate Labour) are common. Q6 (Kidney Purchase) often N.
      *   **Leaf 4: Structuralist (ST)**
          *   *Profile:* Objects primarily to systemic harms/spillovers and exploitation, especially under inequality. Rejects desperate exchanges (Q1=N, Q5=N, Q6=N) and disaster pricing (Q2=N). Accepts non-desperate market logic elsewhere (Q3=Y or Conditional, Q7=Y). Favours prohibition/regulation to protect vulnerable (Q8=Y). Distinguishes law/individual (may find Q1/Q5/Q6 *personally* objectionable but Q8 probes *legal* response).
          *   *Core Answers:* Q2=N (Object to Disaster Pricing), Q5=N (Object to Desperate Labour), Q8=Y (Prohibit Child Labour). Q1=N (Kidney Sale), Q6=N (Kidney Purchase) are typical. Q3=Y (Accept Vote Sale) or Conditional, Q4=Y (Accept Priority) or Conditional, Q7=Y (Accept Motive Requirement) possible.
      *   **Leaf 5: Altruism Channeler (AC)**
          *   *Profile:* Objects to market *money* corrupting virtuous motives/goods. Favours channelling into non-monetary, altruistic, or needs-based systems. Rejects cash sales (Q1=N, Q3=N, Q6=N) but accepts non-cash reciprocity (Q4=Y). Rejects commercial motive cultivation (Q7=N). Disaster pricing lacks altruism (Q2=N). Consent under desperation doesn't legitimize market (Q1=N, Q5=N). Favours channelling/prohibition.
          *   *Core Answers:* Q1=N (Kidney Sale), Q2=N (Disaster Pricing), Q3=N (Vote Sale), Q4=Y (Accept Priority Scheme), Q6=N (Kidney Purchase), Q7=N (Object Motive Requirement). Q5=N (Desperate Labour) typical. Q8=Y (Prohibit Child Labour) likely.
  *   **Unoccupied Combinations:**
      *   **"Consent Trumps All + Prohibition":** Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q5=Y, Q6=Y, Q7=Y, **Q8=Y**. *Incoherent.* If consent legitimizes all desperate labour, child artisan labour, and vote selling, prohibiting *only* the child labour case based on age/spillover contradicts the core consent principle.
      *   **"Object to All Transfers, Accept All":** Q1=N, Q2=N, Q3=N, Q4=N, Q5=N, Q6=N, Q7=N, Q8=Y/N. *Mostly Unattractive/Unexplored.* Rejecting *every* exchange mechanism (cash sale, non-cash reciprocity, automated pricing) is theoretically possible (extreme deontologist) but pragmatically untenable and rarely argued in seminar context. Q4=N is key here.
  *   **Indistinguishable Leaves (by these Qs):** The tree **cannot reliably distinguish Market Sceptics (MS)** from **Altruism Channelers (AC)** on the *basis of Q2 (Disaster Pricing)* alone. Both typically answer N (Unacceptable), but for potentially different reasons: MS (good-type/spillover) vs AC (money-form/lack altruism). The distinction emerges more clearly from their answers to Q4 (Priority Scheme - AC strongly Y, MS Y but perhaps more cautious) and Q7 (Motive - AC strongly N, MS may focus less).

  ---

  **Tracing Contrasting Paths:**

  1.  **Path to Universal Commodifier (UC):**
      *   Q1 (Kidney Sale): **Y** (Acceptable) - No seller repugnance, consent sufficient.
      *   Q2 (Disaster Pricing): **Y** (Acceptable) - Efficient outcome trumps money-form/spillover concerns.
      *   Q3 (Vote Sale): **Y** (Acceptable) - Consent verifiable, no good-type objection.
      *   Q4 (Priority Scheme): **Y** (Acceptable) - Non-monetary exchange fine.
      *   Q5 (Desperate Labour): **Y** (Acceptable) - Consent under desperation sufficient.
      *   Q6 (Kidney Purchase): **Y** (Acceptable) - No buyer repugnance.
      *   Q7 (Surrogate Motive): **Y** (Acceptable) - Motive requirement is market segmentation, not corrosive.
      *   Q8 (Child Artisan): **N** (Should not prohibit) - Parental consent/benefit sufficient, spillover minor.
      *   **→ LEAF: Universal Commodifier**

  2.  **Path to Altruism Channeler (AC):**
      *   Q1 (Kidney Sale): **N** (Unacceptable) - Money corrupts the gift of life, seller repugnance.
      *   Q2 (Disaster Pricing): **N** (Unacceptable) - Profiting (even algorithmically) from desperate need is wrong, lacks community/altruism.
      *   Q3 (Vote Sale): **N** (Unacceptable) - Voting is a civic duty, not a commodity.
      *   Q4 (Priority Scheme): **Y** (Acceptable) - Reciprocal altruism is appropriate channelling, no cash.
      *   Q5 (Desperate Labour): **N** (Unacceptable) - Desperation makes true consent impossible; market exploits vulnerability.
      *   Q6 (Kidney Purchase): **N** (Unacceptable) - Buyer repugnance; treats person as a resource.
      *   Q7 (Surrogate Motive): **N** (Unacceptable) - Cultivating "inconvenience" as a motive degrades parenthood/altruism.
      *   Q8 (Child Artisan): **Y** (Should prohibit) - Child exploitation spillover, parental consent insufficient, market incentive harmful.
      *   **→ LEAF: Altruism Channeler** (Note: A Market Sceptic *might* share all these answers except *potentially* being less emphatic on Q7 or Q4, but the core cluster defines AC).

  **Key Validation:** The contrasting paths clearly separate UC (accepts all) from AC (rejects cash commodification, accepts non-cash channelling). The Kidney Sale (Q1) and Kidney Purchase (Q6) ensure seller-side vs buyer-side repugnance are tested distinctly. The Priority Scheme (Q4) isolates acceptance of non-monetary reciprocity. Disaster Pricing (Q2) and Surrogate Motive (Q7) target money-form and motive objections specifically. Child Artisan (Q8) probes legal prohibition vs. individual judgment.
