  Maya is a botanist examining a plant in her greenhouse. She looks at a leaf and forms the belief that it is infected with a specific fungus. She initially justifies this by noting the characteristic yellow spots (perceptual evidence). When asked why she thinks the spots indicate that fungus, she cites her training: she learned in botany school that these spots are diagnostic for this fungus. Pressed further on why that training is reliable, she explains that her professor, a renowned expert, taught it. Asked why she trusts the professor, she recalls that the professor's identification methods have been consistently confirmed by her own subsequent field work. Yet, when pressed again for why those confirmations are trustworthy, she falls back on her perception of the spots in those past cases, which she now realizes is the same kind of evidence she started with.

