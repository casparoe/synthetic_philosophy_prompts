prompt: |-
  Hi — I'm doing a PhD on the politics of atrocity designation, and I'm also the part-time characterisation analyst at a tiny documentation outfit: four staff, no lawyer on payroll, and we put out maybe two public characterisation notes a month, three hundred words max, that journalists then quote and that two rival survivor associations either circulate or publicly disown. The board signs each one off within 48 hours of us flagging an incident. The decision that eats us alive every time is whether the note uses the word genocide — Lemkin's word, and the one that does all the political work — rather than crimes against humanity, ethnic cleansing, or just a description of the acts.

  What I need off you is an actual procedure, not an essay: the questions in order, what counts as a sufficient answer to each given we have 48 hours and no counsel, where the procedure halts with a no, and where it hands the decision to a person because it's a values question dressed as a factual one. Two things it has to hold apart: whether the legal/moral test is met (intent to destroy a protected group as such, in whole or in part — including Lemkin's broader sense of destroying a group by dismantling its way of life, which the Convention drafters mostly dropped) and whether we should say the word in a note, given that naming has effects on funding, on our field staff, and on who gets to count as the victim. It should also say which distinctions survive being simplified and which don't, and where it will misfire.

  Two in-house heuristics we've been using: a swap test (could someone escape the violence by ceasing to be a member of the group? if yes, they're targeted as a group, not for what they did) and campaign-shape intent (inferring the specific intent from the organisation of the campaign when nobody wrote it down). Tell me whether to keep, fix or bin them.

  Then run it on three: (1) a campaign against a pastoralist community — men killed, wells poisoned, herds destroyed, survivors pushed into towns where they can't keep livestock, no one says the word destroy; (2) the killing of a few hundred religious elders and the levelling of shrines in one district, out of a group of a million, where those are the people who hold the ritual knowledge; (3) a case against the community I'm from, where a leaked manual and one minister's speech get us over your evidentiary bar — and where our in-country researchers, who are from that community, are the ones who'd be arrested. I want it in British English, and I want you to be straight about the case where the procedure gives me an answer I won't like.
reasoning: |-
  Okay, the user is working on a PhD about the politics of atrocity designation and also works part-time at a small documentation outfit. They need a practical procedure for deciding when to use the term "genocide" in their public notes. They have specific constraints: only 48 hours to decide, no legal counsel, and the decision impacts funding, field staff safety, and victim recognition. They also want to evaluate two existing heuristics and test the procedure on three case studies.

  First, I need to break down their request. They want a step-by-step procedure with clear questions, stopping points, and where human judgment is needed. The procedure must separate the legal/moral test from the pragmatic decision to use the term. They mentioned two heuristics: the swap test and campaign-shape intent. I should assess whether to keep, fix, or discard these.

  For the swap test, the idea is that if someone can escape violence by leaving the group, it's not targeting the group as such. However, this might not account for situations where identity is immutable or where leaving isn't feasible. For example, ethnic or religious identities often can't be changed. So this test might need refinement, perhaps by focusing on the perpetrator's perception rather than the victim's ability to switch groups.

  The campaign-shape intent heuristic infers intent from the organization of the campaign. This seems useful when explicit intent isn't documented, as patterns of violence can indicate systematic targeting. But it's circumstantial and might not be sufficient alone. I should suggest combining it with other indicators.

  The three case studies need careful handling. The pastoralist community case involves destroying livelihoods, which could fit Lemkin's broader definition. The religious elders case targets key cultural figures, potentially destroying the group's identity. The third case involves personal stakes for the user's community and safety risks for researchers. The procedure must address both legal criteria and practical consequences.

  The user emphasized separating factual analysis from the values-based decision on whether to use the term. The procedure should have clear stages: first, assessing if genocide criteria are met, then deciding whether to name it based on risks and impacts. The stopping points should ensure that if any legal element is missing, it doesn't proceed to naming.

  For the heuristics, I recommend keeping the campaign-shape intent but refining the swap test. The swap test might be more reliable when the targeted characteristic is mutable. In cases of immutable traits, it's less applicable. Both heuristics should be used as supplementary tools, not standalone tests.

  In the case studies, each presents different challenges. The pastoralist scenario might meet Lemkin's definition but not the strict legal one. The religious elders attack targets cultural destruction, which is part of genocide under the Convention. The third case meets the criteria but poses significant risks to field staff. The procedure should flag such risks, forcing a team discussion on the trade-offs.

  The user's deeper needs include needing a defensible, transparent method to handle high-stakes decisions under time pressure. They also need to navigate internal and external pressures, especially when survivor groups dispute their findings. Ensuring the procedure is both rigorous and pragmatic is crucial. They might also need validation that their heuristics are useful but require context-specific adjustments.

  Finally, the procedure must be concise, using British English, and not shy away from tough recommendations. For the third case study, the procedure should clearly state that while the legal criteria are met, the risks might lead to a decision not to use the term, which the user might find difficult but necessary for safety.
answer: |-
  Here's a procedural decision tree for genocide designation in your context, designed for speed, clarity, and separating legal assessment from pragmatic naming decisions. It integrates your heuristics and addresses your case studies.

  **Genocide Designation Procedure (v1.0 - Operational)**

  **Assumptions:** 48-hour timeline; No legal counsel; Board sign-off required; Public output = 300-word note; Core legal definition = ICC Statute Art. 6 (with Lemkin's broader destruction concept noted as a distinct *potential* factor).

  **Stage 1: Threshold - Is This Potentially Genocidal? (Stop if NO)**
  *   **Q1.1:** Is there evidence of **acts listed in Art. 6(a)-(e)** (killing, SGBV, causing harm, inflicting conditions, preventing births, forcibly transferring children) committed against members of **a protected group** (national, ethnical, racial, religious)? *(Sufficient: Credible eyewitness/testimonial/OSINT reporting + identifiable group basis)*
      *   *NO:* Halt. Designation "Genocide" impossible. Use other terms (CAH, War Crimes, Atrocity Crimes) or descriptive language.
      *   *YES:* Proceed to Q1.2.
  *   **Q1.2:** Is there a **pattern or campaign** of these acts, indicating potential systematicity? *(Sufficient: Multiple incidents linked geographically/temporally/perpetrator; OR single massive incident with clear group target; OR documented policy/framework - e.g., manual, speech)*
      *   *NO:* Halt. "Genocide" designation highly unlikely (isolated acts rarely meet threshold).
      *   *YES:* Proceed to **Stage 2**.

  **Stage 2: Core Legal Test - Specific Intent ("Dolus Specialis") (Stop if NO)**
  *   **Q2.1:** Is there **direct evidence** (speech, orders, documents, manifestos) explicitly stating an **intent to destroy the group, in whole or in part, as such**? *(Sufficient: Clear statement linking acts to group destruction - e.g., leaked manual, minister's speech)*
      *   *YES:* Proceed to **Stage 3** (Intent Met).
      *   *NO:* Proceed to Q2.2.
  *   **Q2.2:** Apply **"Campaign-Shape Intent" Heuristic:** Does the **organization, scale, nature, and targeting of the campaign** strongly imply an intent to destroy the group? Consider:
      *   Targeting of **group-defining characteristics** (leadership, culture bearers, children, fertile adults, essential infrastructure *specific* to group survival/identity).
      *   **Systematicity & Scale** (beyond isolated brutality; impacting a significant part of the group).
      *   **Discriminatory Nature** (acts primarily/only against this group).
      *   **Absence of Plausible Alternative Explanation** (e.g., purely military objective).
      *(Sufficient: Pattern strongly points *only* to group destruction as the logical objective. E.g., targeting *all* wells in pastoralist territory + killing herders + destroying herds).*
      *   *YES:* Proceed to **Stage 3** (Intent Met).
      *   *NO (Ambiguous/Weak):* Proceed to Q2.3.
  *   **Q2.3:** Apply **"Swap Test" Heuristic (Refined):** Could a member of the targeted group **reasonably and realistically avoid persecution/violence by immediately and verifiably renouncing/disavowing their group identity *in the eyes of the perpetrators***?
      *   *NO (Identity is effectively immutable/inescapable to perpetrators):* **Supports** inference of targeting "as such". *Proceed to Q2.4.*
      *   *YES (Identity is mutable/renounceable and this is demonstrably accepted by perpetrators):* **Undermines** inference of targeting "as such". *Halt. "Genocide" designation unlikely. Use "Crimes Against Humanity (Persecution)" or descriptive.*
  *   **Q2.4:** **Contextual Assessment:** Considering Q2.2 & Q2.3 results, plus **all available context**, is the **only reasonable inference** that the perpetrators intended to destroy the group, in whole or in part? *(This is a values/judgment call requiring senior analyst/board input)*
      *   *YES (High Confidence):* Proceed to **Stage 3** (Intent Met).
      *   *NO (Reasonable Doubt/Lack of Clarity):* Halt. "Genocide" designation **not met.** Use "Crimes Against Humanity (Extermination/Persecution)" or "Acts Indicative of Genocidal Intent" + description.

  **Stage 3: Pragmatic Naming Decision ("Should We Say Genocide?")** *(Values-Based - Requires Team/Board Consultation)*
  *   **Q3.1: Is the Legal Threshold Met?** (From Stage 2)
      *   *NO:* Cannot use "Genocide". Use alternative designation.
      *   *YES:* Proceed to Q3.2.
  *   **Q3.2: Assessment of Consequences:** *Weigh the following factors collectively:*
      *   **Field Staff Security:** What is the *specific, credible* risk to researchers/staff if we name genocide? (e.g., arrest, expulsion, violence). *(High Risk = Strong Factor Against Naming)*
      *   **Victim/Survivor Agency:** Would naming genocide significantly **distort victimhood narratives** or empower harmful actors within survivor communities? Would it **disempower** the groups we document? *(Significant Harm/Loss of Agency = Factor Against Naming)*
      *   **Impact on Access/Future Work:** Would naming genocide shut down essential access or future documentation efforts irreparably? *(Critical Loss of Access = Factor Against Naming)*
      *   **Impact on Response:** Is there a realistic chance naming genocide will **meaningfully improve** protection, aid, accountability, or attention **for the victims**? Or will it likely be weaponised against them or fuel escalation? *(Tangible Benefit for Victims = Factor For Naming)*
      *   **Institutional Integrity:** Does *not* naming genocide when the threshold is met constitute a **betrayal of core mandate/values** or enable denialism? Does naming it when risks are high constitute reckless endangerment? *(Core Integrity at Stake = Strong Factor For/Against)*
  *   **Q3.3: Decision Point (Requires Human Judgment - Team Lead/Board):** Based on Q3.2 assessment:
      *   **Use "Genocide":** If legal threshold met AND consequences are deemed manageable/acceptable OR the imperative to name outweighs risks (e.g., core integrity at stake, potential significant protective benefit).
      *   **Use Alternative Phrasing:** If legal threshold met BUT consequences are deemed **unacceptably high** (e.g., severe staff risk, major distortion/loss of victim agency, critical access lost with no benefit). **Options:**
          *   "Acts constituting Genocide under international law" (Strongest alternative).
          *   "Acts committed with genocidal intent".
          *   "Crimes Against Humanity (Extermination, Persecution)" + Detailed description of group-targeting.
          *   **Explicitly State:** "The legal threshold for genocide appears met, but due to [specific risk: e.g., researcher safety], we are using the term [chosen term] in this public note."

  **Heuristic Assessment:**
  1.  **Swap Test (Refined): KEEP but FIX.** Your original formulation was flawed (immutable identities make "escaping" impossible). The *refined* version (Q2.3) focuses on the *perpetrator's perception* of mutability. It's useful as a *negative* indicator (if YES, it undermines genocide) but a NO isn't conclusive *for* genocide. It's a supplementary tool, not a primary test. **Fix:** Integrate as Q2.3, clarifying the perpetrator perspective focus.
  2.  **Campaign-Shape Intent: KEEP.** This is essential for inferring intent where direct evidence is absent (common). It aligns with established jurisprudence (contextual inference). Keep it central in Q2.2. **Fix:** Ensure it requires a *strong, consistent* pattern pointing *only* to group destruction.

  **Distinctions & Misfires:**
  *   **Survives Simplification:** "Intent to destroy the group *as such*" vs. "Intent to combatants/opposition". Campaign-shape helps here.
  *   **Survives Simplification:** "Destroying a significant *part* of the group" (cultural/identity destruction *can* qualify) vs. "Killing every last member". Lemkin's sense *can* be argued under "Destroying in Part" via Art. 6(b),(c),(d).
  *   **Survives Simplification:** Protected groups (national, ethnic, racial, religious) vs. political/social groups. Stick strictly to the Convention groups.
  *   **Misfires:** Over-reliance on *only* the Swap Test. Misfires when perpetrators target immutable characteristics.
  *   **Misfires:** Inferring intent *too readily* from scale alone (brutal ethnic cleansing isn't automatically genocide). Requires the *pattern* to show destruction is the goal.
  *   **Misfires:** Stage 3 (Naming Decision) overriding a clear *lack* of legal threshold (Stage 2 NO) just because consequences demand the "power" of the word. Integrity is paramount.

  **Case Study Application (British English):**

  1.  **Pastoralist Community:**
      *   *Stage 1:* YES (Killing, Causing Serious Harm, Deliberate Infliction of Conditions - Art 6a,c,d). Protected group (Ethnic/National Pastoralists).
      *   *Stage 1.2:* YES (Pattern/Campaign).
      *   *Stage 2.1:* NO (No explicit "destroy" statement).
      *   *Stage 2.2 (Campaign-Shape):* **YES.** Targeting is comprehensive: kill men (reproductive/demographic harm), poison wells & destroy herds (destroy essential economic/cultural basis of group), force into towns (destroy way of life, prevent reproduction of pastoral identity). Pattern points to dismantling the group *as pastoralists*. Lemkin's concept strongly invoked.
      *   *Stage 2.3 (Swap Test):* **NO.** A pastoralist cannot reasonably cease being a pastoralist (to perpetrators) by moving to town; their identity and threat (to perpetrators) remain. Supports inference.
      *   *Stage 2.4:* **YES.** Intent to destroy the group *as pastoralists* (in part, culturally/economically) is the only reasonable inference. **Legal Threshold MET.**
      *   *Stage 3:* Consequences? Naming likely increases attention/pressure. Risk to field staff? Depends on context, but not specified as high here. **Likely USE "GENOCIDE."**

  2.  **Religious Elders & Shrines:**
      *   *Stage 1:* YES (Killing - Art 6a; Possibly Causing Serious Harm/Deliberate Infliction of Conditions via cultural destruction - Art 6c,d). Protected group (Religious).
      *   *Stage 1.2:* YES (Campaign against elders/shrines in district).
      *   *Stage 2.1:* NO.
      *   *Stage 2.2:* **AMBIGUOUS.** Targeting elders/shrines destroys *specific cultural/religious knowledge and practice* crucial to group identity ("in part" - the cultural/religious core). However: Scale is limited (one district, hundreds out of millions). Is this destruction of a *significant part* (the cultural essence) or a localized attack? Pattern *suggests* targeting the group's identity foundation.
      *   *Stage 2.3:* **NO.** A member cannot renounce their religion *to the perpetrators* to avoid being targeted *if* the goal is destroying the religion itself. Supports inference *if* intent is group destruction.
      *   *Stage 2.4:* **JUDGMENT CALL.** This is the crux. Does destroying the ritual holders in one district constitute intent to destroy "in part" the *entire* religious group (a million people) by attacking its core identity? Or is it persecution/suppression? **LEGAL THRESHOLD UNCLEAR/DEBATABLE.** *Recommendation:* Halt Stage 2 (NO). Use "Crimes Against Humanity (Persecution)" + explicit description of targeting cultural/religious foundations. Avoids overreach on unclear scale/intent scope.

  3.  **User's Community (Leaked Manual/Speech; Researcher Risk):**
      *   *Stage 1:* YES (Acts specified in manual/speech? Assuming Art 6 acts). Protected group (Ethnic/National/Religious - User's community).
      *   *Stage 1.2:* YES (Policy/framework evidence).
      *   *Stage 2.1:* **YES.** Leaked manual & minister's speech meet evidentiary bar for explicit intent. **Legal Threshold CLEARLY MET.**
      *   *Stage 3:* Consequences are **SEVERE:** High risk of arrest for in-country researchers (user's colleagues). Naming could endanger them directly.
      *   *Stage 3.2/3.3:* **PRAGMATIC DECISION: DO NOT PUBLICLY USE "GENOCIDE"** in the note. The legal threshold is met, but the risk to field staff is unacceptable. **Alternative:** "Acts constituting Genocide under international law, as evidenced by [brief reference to manual/speech without compromising source]" OR "Crimes Against Humanity (Extermination/Persecution) committed with the intent to destroy the [Group] as such" + **Crucially:** State clearly in internal board documentation that the legal threshold is met, but public designation altered due to security imperatives. Prepare for potential criticism from survivor groups who demand the G-word.

  **Final Note:** This procedure forces clarity but doesn't remove the agony. Stage 2.4 and Stage 3 remain profoundly difficult judgment calls. The case of your own community (Case 3) exemplifies this – the procedure gives you the legal answer you likely know ("yes, it's genocide"), but the pragmatic naming decision forces you to prioritise your researchers' safety over public use of the word, which will be deeply unsatisfactory personally and professionally. Document the internal rationale rigorously. This procedure makes that trade-off explicit and defensible, even when it feels like a failure.
