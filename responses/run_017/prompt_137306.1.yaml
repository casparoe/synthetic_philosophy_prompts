answer: |-
  ## Proposal: Calibrating Anomaly Detection in Historical Reconstruction

  **Core Question:** Can a demarcation criterion for evaluating historical claims about sparsely documented periods be defined solely by the *methods* used to generate and sustain those claims, specifically their performance under calibration tests against well-understood periods, such that it (a) avoids presupposing the falsity of the claims, (b) withstands the symmetry (methodological equivalence) and calibration (luck of record density) objections, and (c) reveals a genuinely epistemic asymmetry rather than a sociological one?

  **Why the Question is Open:** Existing demarcation attempts falter:
  1.  **Falsity-First:** Begs the question against the symmetry move; assumes the conclusion (e.g., "Atlantis is false, therefore its methods are bad").
  2.  **Falsificationism (Popperian):** Stalls because historical hypotheses are rarely individually falsifiable; mainstream history also employs protective belts (Lakatos) to absorb anomalies holistically.
  3.  **Purely Sociological:** Concedes the symmetry move, reducing demarcation to institutional acceptance ("chairs").
  4.  **Extraordinary Evidence (Sagan):** Relocates the dispute without resolution ("What counts as 'extraordinary' for a sparsely documented era?").

  **Methodology (6 Months):**
  *   **Month 1:** Develop taxonomy of common anomaly-generating procedures in fringe history (e.g., pareidolic interpretation of artifacts, chronological compression techniques, concordance-without-transmission inference).
  *   **Month 2:** Design & execute **Control-Period Test (i):** Select a densely documented historical period (e.g., 15th-16th Century Europe). Apply the identified anomaly-generating procedures *as if* the period were poorly documented (ignoring known context where necessary). Quantify the "phantom anomalies" (e.g., misinterpreted art as tech, invented dark ages, spurious cultural links) generated from noise.
  *   **Month 3:** **Analyze Concordance-Without-Transmission (ii):** Isolate cases of claimed cultural parallels (e.g., pyramid building) used as direct evidence for contact/common origin. Develop test criteria: absence of (a) plausible transmission mechanism, (b) dateable intermediaries, (c) evidence beyond superficial resemblance. Compare rates in fringe vs. mainstream arguments on similar topics.
  *   **Month 4:** Investigate **Exit Conditions (iii):** Case studies of specific pseudohistorical claims confronted with disconfirmation (e.g., decisive radiocarbon dates, decipherments). Document community response: claim shrinkage, incorporation of disconfirmation into the theory, dismissal, or persistence unchanged. Compare patterns to mainstream historical paradigm shifts.
  *   **Month 5:** **Address "Gaps are Necessary" Objection:** Apply the control test to a **"Bridge Case"** – a period well-documented overall but with documented, *deliberate* local record destruction (e.g., Byzantine Iconoclasm's impact on specific artistic traditions). Does the method generate anomalies *only* within the actual gaps, or indiscriminately across the period? Does this validate the test or reveal context-dependency?
  *   **Month 6:** Synthesize findings. Formulate the demarcation criterion based on method calibration (phantom anomaly rate), specific fallacy susceptibility (concordance), and responsiveness to evidence (exit conditions). Refine for practical application.

  **Why This Approach?** It shifts focus from *what* is claimed to *how* claims are generated and maintained, directly targeting the core of the symmetry and calibration moves by demanding methodological accountability through empirical testing against known cases. Alternatives (focusing solely on evidence standards or sociology) fail to engage the procedural challenge.

  **Deliverable:** A practical, procedural checklist for evaluating historical claims about poorly documented eras. It will enable referees, heritage bodies, or educators to assess within ~30 minutes whether a claim relies on:
  1.  Methods generating high phantom-anomaly rates in control tests.
  2.  Concordance-without-transmission inferences.
  3.  Exit-condition strategies immune to disconfirmation.
  Plus a clear articulation of the epistemic asymmetry (or lack thereof) for the core argument.

  **Failure Conditions:** The project fails if:
  1.  The control test shows mainstream methods generate phantom anomalies at rates comparable to fringe methods.
  2.  Exit-condition behavior correlates solely with community size/age, not methodological rigor.
  3.  Every case analysis collapses into requiring an independent first-order judgement of claim falsity.
  4.  The bridge case demonstrates calibration is fundamentally impossible due to context.

  **Scope & Honesty:** Six months allows a robust taxonomy, the control test (including bridge case analysis), analysis of concordance-without-transmission, and 2-3 detailed exit-condition case studies. It will *not* yield a universal theory of historical method or comprehensively map all pseudohistory.

  **Final Assessment:** I am **highly confident** (80%) that the asymmetry identified – the lack of calibration for anomaly-generating procedures against known periods – is a real and exploitable epistemic weakness in pseudohistorical methodologies. The **load-bearing assumption I am least sure of** (40% confidence) is that the "bridge case" (deliberate local gaps in a well-documented period) provides a sufficiently valid and generalizable test environment to overcome the "gaps are necessary" objection without itself introducing confounding variables that undermine the calibration principle.
