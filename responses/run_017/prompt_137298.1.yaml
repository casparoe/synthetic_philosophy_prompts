prompt: |-
  my friend (econ PhD, extremely confident) and I got into a three hour argument last night about whether economics can say anything about what people actually want, and he ended up laying out revealed preference theory as the mic drop. His version went roughly like this: preferences aren't hidden mental states you infer from behavior, they're just whatever the choices reveal, so 'utility' is nothing but a label for the choices — not happiness, not welfare, just bookkeeping. The axioms (WARP, SARP, GARP — the weak, strong and generalized axioms of revealed preference) are consistency requirements on choice, so if someone's behaviour violates them they're being irrational in the same way they would be if their preferences were intransitive. And since a utility function is only defined up to a positive affine transformation, you can rescale and shift it however you like, which is why interpersonal comparisons of utility are literally meaningless and cost-benefit analysis has to fall back on dollars. Then he said something I couldn't quite follow: that even when people's choices flip depending on what else is on the menu, you can just let utility take the menu as an extra argument, so the theory can't actually be refuted by that kind of data. He closed with: once you have a utility function that reproduces someone's choices there is nothing left to say, and anything about addiction, weakness of will, or being nudged is just moralizing dressed up as economics.

  I pushed back on the menu thing — it feels like if you let the utility function depend on the menu in any way you like it stops predicting anything, so calling it a 'representation' is cheating — but I couldn't say why, and he accused me of being a psychologista and not understanding what a representation theorem is. Can you go through his summary claim by claim and tell me which bits are just the standard position stated plainly, which are him sliding something extra in, and whether his conclusions (that welfare talk is unscientific and that dollar metrics are therefore the only game in town) actually follow from the parts that are right?
reasoning: |-
  Okay, the user is in a tough spot after a heated debate with their econ PhD friend. The friend used revealed preference theory as the ultimate argument, claiming that economics can't say anything about what people actually want beyond their choices. The user pushed back but couldn't articulate why the friend's "menu-dependent utility" argument felt like cheating. Now they want a breakdown of what's standard theory versus what's the friend's philosophical stance, and whether the welfare conclusions actually follow.

  First, I need to unpack the friend's claims systematically. The core of revealed preference theory is indeed that preferences are defined by choices, not hidden mental states. Samuelson's original formulation was precisely about this—utility as a representation of choices, not a psychological state. The axioms (WARP/SARP/GARP) are indeed about consistency, but labeling violations as "irrational" is a bit of a leap. Intransitivity implies inconsistency, but is that the same as irrationality? That's debatable.

  The ordinal utility point is correct—interpersonal comparisons are meaningless within the theory. That's standard. But then the friend brings up menu-dependent utility, which is where things get slippery. Letting utility depend on the menu isn't cheating per se—it's a real extension of the theory (context-dependent preferences). But it does make the theory less falsifiable, which is the user's instinct. If utility can absorb any contextual quirk, it risks becoming tautological. The friend's "mic drop" moment about this being unfalsifiable is actually a weakness disguised as strength.

  The friend's dismissal of addiction/nudging as "moralizing" reveals their positivist bias. Revealed preference deliberately ignores why choices are made—it's agnostic about psychology. But that doesn't mean those factors are irrelevant to welfare! The user senses this: just because we can represent choices with utility doesn't mean we've captured wellbeing. The friend conflates "we don't model psychology" with "psychology doesn't matter," which is a philosophical slide.

  The welfare conclusions are where the friend overreaches. Revealed preference avoids interpersonal utility comparisons, hence cost-benefit analysis uses money. But that's a limitation of the tool, not proof that welfare is unscientific. Behavioral welfare economics exists precisely because people think choices don't always reflect welfare. The friend's position is orthodox but not the only view—Sen, Kahneman, and others have challenged it.

  The user’s core tension: they feel the friend is using technical correctness to shut down legitimate questions about welfare. They're right. The friend is correct about revealed preference theory but wrong to imply it's the final word on wellbeing. The "psychologista" jab is unfair—the user is questioning the theory's normative limits, which is valid.

  Need to validate the user’s intuition that menu-dependent utility feels like cheating. It’s not inherently, but without constraints, it can make the theory vacuous. That’s why economists test for violations (e.g., framing effects) and develop models with structure (like temptation-driven menu costs). The friend’s "any menu effect can be absorbed" is true but reductive—it ignores how the field actually grapples with context.

  Lastly, the dollar-metric point: it’s true that CBA uses dollars, but that’s a pragmatic response to ordinal utility, not proof that welfare is reducible to spending. The friend’s "only game in town" claim ignores alternatives like equivalent income or subjective wellbeing metrics. User’s skepticism is warranted—this is ideology masquerading as methodology.
answer: |-
  Your friend gave a *flawless* exposition of the **orthodox revealed preference (RP) paradigm** as developed by Samuelson, Houthakker, and embodied in most mid-to-high-level micro textbooks. However, he then **slipped into strong philosophical claims** about welfare and the scope of economics that *do not necessarily follow* from the technical core, and where his menu-dependence argument becomes problematic. Let's break it down:

  **1. Preferences as Revealed, Not Mental States; Utility as Ordinal Representation:**
  *   **Standard Position:** This is **absolutely core RP theory**. Preferences are defined solely by observable choices. A utility function is *only* a convenient mathematical representation of an underlying preference ordering that satisfies certain consistency axioms (like transitivity). It has no inherent psychological or hedonic content. "Utility" here is just a label for the ranking.
  *   **Correctness:** This is the foundational stance of mainstream microeconomics. It avoids the pitfalls of trying to measure unobservable mental states.

  **2. Axioms (WARP, SARP, GARP) as Consistency Requirements:**
  *   **Standard Position:** **Correct.** These axioms define what it means for choices to be consistent with a stable underlying preference ordering. WARP is the most basic (if you choose A over B in one set, you shouldn't choose B over A in another set where both are available). SARP/GARP are stronger versions ensuring consistency across multiple choices, guaranteeing the existence of a utility function.
  *   **"Irrationality" Label:** Calling violations "irrational" in the same way as intransitivity is **common but slightly loaded terminology**. Technically, RP theory simply says choices violating the axioms *cannot be represented* by a stable, complete, transitive preference ordering. Whether this constitutes "irrationality" depends on your definition. Economists often use the term, but philosophers might argue it's merely "inconsistent" without necessarily being irrational in a broader sense. *Standard enough in econ discourse.*

  **3. Utility Ordinality & Interpersonal Comparisons:**
  *   **Standard Position:** **Entirely correct.** Since utility functions only represent the *ranking* of choices (ordinal utility), any positive monotonic transformation of the function represents the *exact same preferences*. Multiplying by 2 or adding 100 doesn't change the ranking. Therefore, *within the RP framework*, comparing utility *levels* or *differences* across individuals is meaningless ("John has utility 10, Mary has 5" or "John gained more utility than Mary" are statements without empirical content based on choice data alone). This is why cost-benefit analysis (CBA) defaults to monetary metrics (willingness-to-pay/willingness-to-accept) – dollars are observable and comparable across individuals.
  *   **Conclusion (CBA):** That CBA *must* use dollar metrics *if it wants to stay strictly within the RP paradigm* is **correct.** RP provides no scientific basis for interpersonal utility comparisons.

  **4. Menu-Dependence ("Utility takes the menu as an argument"):**
  *   **The Technical Dodge:** This is where things get tricky and your instinct was spot-on.
      *   **Standard Position (in a narrow sense):** RP theory *can* accommodate context-dependent choices *if* you formally define the objects of choice appropriately. If choices depend on the menu, you can redefine the "good" as "X *when chosen from menu S*" vs. "X *when chosen from menu T*". Conceptually, "X-in-S" and "X-in-T" are different goods. A utility function defined over *these context-dependent goods* can then represent choices consistently. *Technically*, the theory isn't falsified by menu effects if you grant this redefinition.
      *   **The Problem (Your Intuition):** **You are fundamentally correct that this risks making the theory vacuous.** If you allow the "good" to be defined arbitrarily based on *any* context (menu, framing, time of day, weather, mood), the utility function becomes a *post-hoc description* of *every single individual choice*, not a predictive model. It loses all falsifiability and explanatory power. Why did they choose Coke over Pepsi today but Pepsi over Coke yesterday? Because "Coke-today-in-context-A" is preferred to "Pepsi-today-in-context-A", but "Pepsi-yesterday-in-context-B" is preferred to "Coke-yesterday-in-context-B". This explains nothing and predicts nothing new.
      *   **Him vs. The Field:** Your friend presents this as a triumphant defense of RP. **This is misleading.** While the technical move exists, *mainstream economics recognizes it as a weakness, not a strength*. The existence of robust menu/framing/context effects (e.g., decoy effects, status quo bias) is widely seen as evidence that *simple* RP models with stable preferences over basic goods are *empirically inadequate* for describing much behavior. This is a core motivation for behavioral economics! Models of temptation, self-control, reference-dependence (like Prospect Theory), and social preferences *explicitly build context-dependence into the structure of preferences* in specific, testable ways, moving beyond the simple "just redefine the good" dodge. Your friend is technically correct that RP *can* be saved by redefinition, but he ignores that this move often renders it *scientifically uninteresting*.

  **5. The "Nothing Left to Say" & Moralizing Claim:**
  *   **Standard Position (Positive Economics):** **Within the strict RP paradigm of positive economics**, if you have a utility function that perfectly predicts choices under all observed circumstances (which the menu-dependence trick theoretically allows, however vacuously), then *for the purpose of predicting choices*, there is indeed "nothing left to say" *from an RP perspective*. RP deliberately brackets questions about *why* preferences are what they are or whether they align with well-being. It focuses solely on choice prediction (or, more commonly, deriving demand curves).
  *   **The Slide & Overreach:** Your friend **slides from positive description to normative dismissal**:
      *   **Normative Welfare Economics:** RP is the foundation of *one specific approach* to welfare economics: **Pareto efficiency** based on *revealed* preferences. If your choices change due to a nudge or addiction, and your *revealed* preferences reflect that change, the RP welfare economist would say your welfare has changed accordingly. This leads to conclusions like "if an addict freely chooses drugs with full information, that choice maximizes their welfare."
      *   **The Controversy:** **His claim that critiques like addiction/weakness of will/nudges are "just moralizing" is a highly contentious philosophical stance, not a scientific truth derived from RP.** Many economists (e.g., Amartya Sen, behavioral welfare economists) argue that *revealed* preferences can sometimes be a *poor proxy* for actual well-being or "rational" self-interest, especially when:
          *   **Information is lacking or imperfect.**
          *   **Cognition is impaired (e.g., addiction, severe stress, cognitive biases).**
          *   **Choices involve self-control problems over time (hyperbolic discounting).**
          *   **Choices reflect social pressure or manipulation, not authentic desires.**
          *   **Adaptive preferences** (e.g., the oppressed learn not to desire freedom).
      *   **Conclusion:** RP theory itself *cannot adjudicate* these debates. It provides a tool (revealed preference) and a framework (Pareto). Saying critiques are "just moralizing" is **your friend imposing his own philosophical view (a strict preference-satisfaction view of welfare combined with RP as the only legitimate measure) onto the theory.** RP theory is silent on whether revealed preferences *should* be the sole basis for welfare judgments. That's a normative leap.

  **Summary & Your Friend's Conclusions:**

  1.  **His exposition of the core RP mechanics (choices define prefs, ordinal utility, axioms, interpersonal incomparability) is textbook-correct.**
  2.  **His claim that CBA therefore relies on dollars is a direct consequence of point 1.**
  3.  **His "menu-dependence" defense is technically possible but scientifically weak and risks vacuity. It's a last resort, not a strength, and ignores how the field actually responds to context effects (via behavioral models). Your intuition that it undermines predictive power is valid.**
  4.  **His conclusion that "welfare talk is unscientific" and critiques are "just moralizing" is NOT logically entailed by RP theory. It is his own philosophical position (a form of *positivist welfarism*).** RP provides a specific *method* for defining welfare based on revealed choices, but it does not prove that this is the *only* possible or legitimate conception of welfare. Many economists and philosophers argue for alternative foundations (capabilities, objective lists, experienced utility) precisely because they see limitations in revealed preference as a welfare metric.

  **In essence:** Your friend perfectly described the *engine* of mainstream microeconomic choice theory (revealed preference). However, he mistakenly presented the philosophical *limitations* of that engine (inability to address psychology, context deep-dependence, questionable welfare foundations) as its *strengths* or inevitable conclusions, and dismissed valid critiques outside its narrow scope as irrelevant "moralizing." His mic drop was strong on mechanics but weak on the broader philosophy and methodology of economics. You were right to push back on the menu point and the normative overreach.
