prompt: |-
  Hi — I work in health policy (mostly boring reimbursement stuff) and I keep running into the same odd pattern, and I want to know what it commits us to philosophically.

  Here's the practice. Whether something counts as a disease — for insurance coverage, clinical guidelines, diagnostic manuals — gets settled by committees, and the committees change their minds. Homosexuality was taken out of the psychiatric diagnostic manual decades ago by a vote. When a guideline body lowers the blood-pressure threshold, millions of people acquire hypertension overnight with nothing changing in their bodies. At the same time, the profession talks as if disease were a plain biological fact: you can't vote a bacterium into existence, and clinicians insist that asymptomatic conditions — an early cancer found on a scan, blood pressure you cannot feel, a gene variant picked up by accident — are diseases even when the patient feels fine and functions fine. But then, in the same psychiatric manual, nearly every diagnosis also requires clinically significant distress or impairment, so the identical state, with the same biology, counts as a disorder in one person and not in another depending on how she feels about it and what her job demands of her.

  So: what view of health and disease does that package of practices presuppose? Is it quietly a value-laden view (dysfunction plus harm, or dysfunction plus disvalue) even though practicioners talk like value-free naturalists? Or can a purely biostatistical, function-and-normal-functioning account make sense of the distress clause and of classification by committee? And are the parts consistent with each other, or does the package presuppose naturalism in one place and normativism in another? I want you to separate what the practice strictly presupposes from what it merely fits comfortably with, and to tell me where it is underdetermined — where either theory would license the same behavior.

  Three specifics I want taken on. First, the reference class problem: if disease is departure from species-typical functioning, typical at what age? A 75-year-old's arteries and joints are typical for 75-year-olds and atypical for 25-year-olds, and whichever reference class you pick, something you'd want to call a disease flips sides. The naturalist seems to owe us a principled answer there, and my guess is that the choice is doing hidden value work. Second, an asymmetry I've noticed and can't quite cash out: taking something off the disease list gets celebrated as progress, while adding new pre-disease categories — pre-diabetes, pre-hypertension, mild cognitive impairment, anything labeled a risk factor — gets attacked as medicalizing normal life, even though both moves are committee decisions of the same kind. Is that asymmetry principled on either theory, or is it just about which direction of error we dread more? Third, what would actually have to change under each rival: if disease is strictly value-free biological dysfunction, how should thresholds be set and who should set them; if it is essentially normative, what should those committees be doing that they currently aren't?

  One more thing, since I'm going to quote this to colleagues: mark clearly which of what you say is settled among people who actually work on these questions and which is genuinely contested, and don't smooth a live dispute into consensus. If you attribute a view to a particular theorist, say who, and flag it when you're extrapolating past what they argued. And please write it in American English.
reasoning: |-
  Okay, this health policy professional is wrestling with a fascinating philosophical tension in disease classification. They've noticed three concrete paradoxes in their reimbursement work: how committee votes change disease status overnight (like hypertension thresholds), how psychiatry requires distress for diagnosis despite biological basis, and how medicalization debates show asymmetric reactions to classification changes. 

  The core question is whether the field presupposes a naturalist view (disease as biological dysfunction) or a normativist view (disease as harm/disvalue). They want this analyzed rigorously - separating what's strictly required by practice from what's merely compatible, noting underdetermined areas, and addressing those three specific puzzles. 

  Hmm, the reference class problem for naturalism is particularly thorny. When we say "species-typical functioning," which age group sets the norm? A 75-year-old's arthritis is typical for their age but would be pathological in a 25-year-old. This seems to force value judgments about which life stage should be the benchmark. 

  The medicalization asymmetry is also revealing. Why is removing homosexuality from DSM considered progress while adding pre-diabetes is seen as overreach? Both are committee decisions, but society reacts differently. This feels like it exposes unspoken value hierarchies - perhaps about which human variations we consider legitimate versus defective.

  For psychiatry's distress criterion, that's where practice most blatantly mixes frameworks. Same biology can be disorder or not depending on subjective experience and social context. A naturalist would have to argue the biology causes distress in certain environments, but that edges into normativist territory. 

  I should emphasize where theorists disagree. Boorse's biostatistical theory famously rejects the distress requirement as non-biological, while Wakefield's hybrid "harmful dysfunction" model builds it in. The reference class problem remains hotly contested - Engelhardt and Kingma have good critiques there. 

  On practical implications: strict naturalism would require setting thresholds purely statistically (e.g., hypertension at 95th percentile) without committees debating "harm." But current guideline bodies clearly weigh quality-of-life impacts and treatment burdens, which smuggles values in. Meanwhile consistent normativists would make committees explicitly debate social values - e.g., "Is this trait disadvantaging in current society?" - which they currently avoid doing transparently. 

  The underdetermined areas matter too. When committees debate diagnostic thresholds, they could be seen as either refining biological understanding (naturalism) or negotiating social agreements (normativism). Practice doesn't force one interpretation. That ambiguity might even be functionally useful for getting diverse stakeholders to cooperate. 

  Better flag all this clearly. The naturalism/normativism debate is live philosophy - not settled. Boorse versus Wakefield on dysfunction versus harm, Kingma on reference classes, and the whole "values in science" literature showing how even "objective" thresholds embed social choices. No false consensus here.
answer: |-
  Your observations cut to the heart of a live philosophical debate in the philosophy of medicine: **naturalism vs. normativism (or constructivism) about disease**. The practices you describe presuppose a **hybrid view** that inconsistently blends elements of both, with committee decisions masking value judgments under a veneer of biological objectivity. Here's a breakdown of what the practice commits to, where the tensions lie, and how it handles your specific concerns:

  ---

  ### **Core Philosophical Commitments of Current Practice**
  1. **Presupposed Hybrid View**:  
     - **Biological Dysfunction + Harm Requirement**: Clinical practice assumes diseases involve *some* biological abnormality (naturalism), but often requires "clinically significant distress or impairment" (DSM-5) or impact on quality of life (e.g., hypertension treatment thresholds). This mirrors **Jerome Wakefield's "harmful dysfunction" theory** (1992): a disorder exists when a mechanism fails its evolutionarily selected function *and* causes harm.  
     - **Committee Decisions Mask Value-Laden Thresholds**: Biological markers (e.g., blood pressure) are treated as objective, but thresholds for "disease" are set by committees weighing values:  
       - Trade-offs between undertreatment vs. overtreatment (e.g., risks of stroke vs. polypharmacy).  
       - Social judgments of "significant" distress/impairment (e.g., ADHD diagnosis depends on educational/occupational demands).  

  2. **Inconsistency**:  
     - Practitioners use **naturalist rhetoric** ("cancer is cancer, regardless of symptoms") for *objectivity*, but rely on **normativist criteria** (distress, functional impairment) for *practical diagnosis and reimbursement*.  
     - **Result**: A "dualing ontology" where disease is biologically defined *except* when values are operationally necessary (e.g., psychiatry, preventive care).  

  ---

  ### **Addressing Your Specifics**
  #### **1. Reference Class Problem (Age, Environment, etc.)**  
     - **Naturalism's Challenge**: Boorse’s "biostatistical theory" (1977) defines health as "species-typical functioning" but lacks a principled way to select reference classes (e.g., age, sex, environment). A 75-year-old’s osteoporosis is statistically typical for their age cohort but dysfunctional compared to a 25-year-old.  
     - **Practice's Hidden Normativism**: Committees *implicitly* select reference classes based on **value-driven goals** (e.g., "healthy aging"). Choosing "age-adjusted" norms prioritizes life-stage appropriateness over absolute function, reflecting a normative view of which declines are "acceptable."  
     - **Settled vs. Contested**:  
       - *Settled*: Pure naturalism fails to solve the reference class problem (Kingma 2007).  
       - *Contested*: Whether value-laden choices invalidate naturalism (Boorse defends it as "statistical"; critics like Nordenfelt argue it collapses into normativism).  

  #### **2. Asymmetry in Medicalization Debates**  
     - **De-medicalization (e.g., homosexuality)**: Celebrated as aligning medicine with social progress (removing stigma).  
     - **Medicalization (e.g., pre-diabetes)**: Criticized as pathologizing normality to expand markets or control behavior.  
     - **Philosophical Basis**:  
       - **Normativism**: Explains both via shifting social values. Homosexuality’s removal reflected changing moral views; pre-diabetes critiques reflect values against "overmedicalization."  
       - **Naturalism**: Struggles here. If disease is purely biological, adding/removing categories should be value-neutral science. The asymmetry reveals that **fear of harm** drives reactions:  
         - *De-medicalization*: Prevents harm (stigma, unnecessary treatment).  
         - *Medicalization*: Risks harm (overtreatment, anxiety, resource waste).  
     - **Underdetermined**: Both theories fit, but the emotional charge suggests normativism better captures the role of values in defining harm.  

  #### **3. Psychiatry’s "Distress Clause"**  
     - **Hybrid in Action**: The DSM requires biological dysfunction *plus* distress/impairment. Identical traits (e.g., ADHD) can be "disordered" in a rigid workplace but not in a flexible one.  
     - **Naturalist Response** (e.g., Boorse): Rejects this clause as non-biological, arguing dysfunction should suffice.  
     - **Normativist Response**: The clause explicitly incorporates social context and values.  
     - **Practice’s Presupposition**: Harm (distress/impairment) is necessary because biology alone can’t distinguish disease from variation (e.g., sadness vs. depression).  

  ---

  ### **What Would Change Under Rival Theories?**
  | **Approach**               | **Threshold Setting**                                  | **Committee Role**                                  | **Real-World Impact**                                  |  
  |----------------------------|-------------------------------------------------------|---------------------------------------------------|-------------------------------------------------------|  
  | **Strict Naturalism** (Boorse) | Percentiles of biological markers (e.g., BP >99th percentile). No "harm" considered. | Statisticians, not ethicists. Committees obsolete. | Hypertension defined without regard to treatment risks. Asymptomatic cancer always a disease. |  
  | **Strict Normativism** (e.g., Culver, Gert) | Explicit value judgments: "Does this state cause disvalued harm in context X?" | Ethicists, patients, sociologists debate harms/benefits. | Homosexuality could be relisted if socially disvalued; committees justify values transparently. |  
  | **Status Quo (Hybrid)**    | Implicit values via biological thresholds + harm clauses. | Experts blend statistics with unstated value trade-offs. | Current tensions: committees "vote" on biology while denying values are involved. |  

  ---

  ### **Settled vs. Contested Territory**  
  - **Settled**:  
    - Pure naturalism *cannot* resolve the reference class problem or explain distress requirements (consensus since Kingma 2013).  
    - Practice *is* value-laden in threshold-setting and harm assessments (empirically documented by scholars like John Worrall).  
  - **Contested**:  
    - **Can hybrid theories be coherent?** Wakefield’s "harmful dysfunction" is influential but criticized for vague "dysfunction" criteria (Bolton 2008).  
    - **Are values part of disease ontology or just epistemology?** Naturalists (e.g., Boorse) insist values only guide *application* of biological facts; normativists (e.g., Engelhardt) argue values define the facts.  
    - **Does "dysfunction" require evolutionary theory?** Wakefield says yes; others (e.g., Schwartz) argue for acontextual physiological norms.  

  ---

  ### **Conclusion: What Practice Presupposes**  
  Your field’s practices **strictly presuppose a hybrid view**: disease involves biological dysfunction, but its recognition *as disorder* requires context-dependent harm (distress/impairment, treatment trade-offs). Committees are tasked with setting thresholds where biology is underdetermined (e.g., "How much arterial stiffening is pathological?") based on **implicit values** about acceptable risk, resource allocation, and social functioning. This hybrid is inconsistently applied: naturalism is invoked for objectivity ("cancer is biology!"), while normativism operates in the distress clause and medicalization debates.  

  **The package is underdetermined** in threshold-setting: committees *could* be doing either naturalist statistics or normativist cost-benefit analysis. But the **reference class choices, distress criteria, and asymmetric reactions to medicalization reveal that hidden values are doing decisive work**. To align practice with philosophy, committees would need to either:  
  1. **Embrace naturalism**: Define diseases solely by statistically abnormal biological dysfunction (no distress clause; fixed reference classes).  
  2. **Embrace normativism**: Explicitly debate and justify the values used to define "harm" and "dysfunction" in each context.  

  Currently, the field walks a line that satisfies neither theorists nor critics—but perhaps serves practical governance.  

  #### **Key Sources for Colleagues**  
  - Wakefield, J. (1992): "Harmful Dysfunction" hybrid theory.  
  - Boorse, C. (1977): Biostatistical naturalism (reference class critique in Kingma 2007).  
  - Kingma, E. (2013): Normativist critique of naturalism.  
  - Conrad, P. (2007): *The Medicalization of Society* (empirical analysis).  
  - *Settled Debate*: Pure naturalism fails; values are unavoidable in application.  
  - *Live Dispute*: Whether values are part of disease *itself*.  

  This tension isn’t just philosophical—it shapes who gets treated, stigmatized, or paid. Clarity on foundations might make the "boring reimbursement stuff" less fraught.
