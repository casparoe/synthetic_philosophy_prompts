answer: |-
  Here's your Q&A prep sheet, ordered by potential damage in a HTA audience, with #5 being the nightmare question. Vocabulary is strictly health econ.

  1.  **Objection:** "But revealed preference shows individuals *do* aggregate small disutilities across scenarios—people pay to avoid multiple minor nuisances, proving they sum in WTP models."  
      **Reply:** That's aggregation *within* a single person's choice architecture under budget constraints, not moral weight summing *across* separate lives absent compounding.  
      **Soft Spot:** Conflates individual choice behavior with ethical aggregation across persons.  

  2.  **Objection:** "Stated preference studies (e.g., DCEs) directly measure societal WTP to prevent population-wide minor harms—ignoring this data rejects empirical welfare economics."  
      **Reply:** Those capture *expressed* trade-offs under constrained evaluation, not proof that distributed specks create experienced disutility equivalent to concentrated harm.  
      **Soft Spot:** Dismisses standard HTA evidence-gathering as fundamentally misleading.  

  3.  **Objection:** "QALY models explicitly sum small disutilities across people (e.g., 1 million x 0.0001 QALY loss = 100 QALYs); rejecting this invalidates incremental cost-effectiveness ratios (ICERs) at scale."  
      **Reply:** ICERs are pragmatic tools for resource allocation, but they don't resolve whether distributed microharms *actually compound morally* like concentrated suffering within one life.  
      **Soft Spot:** Admits HTA must use cross-person summation practically, weakening the "never add up" claim.  

  4.  **Objection:** "Opportunity cost logic demands we treat population dust specks as aggregatable—else we'd waste resources on trivial individual protections while underfunding interventions addressing widespread minor harms."  
      **Reply:** Efficient allocation doesn't require *moral equivalence*—we can prioritize diffuse harms based on total reported burden without assuming specks sum to torture-severity disutility.  
      **Soft Spot:** Leaves "reported burden" undefined, risking circularity if burden relies on aggregation.  

  5.  **Objection:** "If minor harms don't aggregate across lives, there’s no societal threshold at all—every intervention below torture-level severity becomes incomparable, collapsing cost-effectiveness analysis."  
      **Reply:** Thresholds can still exist based on *concentrated* burdens within lives or societal willingness-to-pay, but they don't solve the aggregation paradox—dust specks remain irrelevant to torture comparisons.  
      **Soft Spot:** Implicitly concedes HTA’s core framework relies on an unsolved philosophical problem, undermining policy coherence.
