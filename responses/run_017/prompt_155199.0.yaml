prompt: |-
  Next month I'm giving a short talk to a health technology assessment crowd — mostly health economists who build QALY models and argue about cost-effectiveness threshholds, a couple of guideline-committee people, essentially no philosophers — and I'm defending this: the torture-vs-dust-specks case is really a puzzle about aggregating *across* lives, not about where some lexical threshold sits. My claim is that a million barely-noticeable harms to a million different people never add up to anything at all, while the very same harms happening to one person do add up, because within a single life they're felt against one hedonic baseline and can compound — so the standard search for a threshold is looking in the wrong place, and there's nothing to be said about how many dust specks equal a torture until you've fixed whether you're summing within or across persons.

  Give me my Q&A prep sheet as exactly five numbered items, two sentences max each: the objection as a health economist would actually phrase it (their vocabulary — willingness to pay, stated preference, opportunity cost, the threshold, not mine), then what I should say back, then where my reply is softest. Put them in order of how much damage they'd do to me in that room, and make #5 the one I'm secretly hoping nobody asks. No citations, I know the literature well enough to fill those in myself.
