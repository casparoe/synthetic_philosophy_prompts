prompt: |-
  I've been on our university's animal research ethics committee for a couple of years, and we are rewriting the rule that decides which animals trigger full welfare review rather than a rubber-stamp registration. The existing rule is roughly *vertebrates plus cephalopods*, which I suspect nobody can defend except by inertia, so I have been trying to get clear about what I actually believe by going case by case instead of by theory. A friend who keeps bees and a colleague who works on decapods have both been pushing on me, and I have found that my confident verdicts do not line up with any principle I can state. Here is where I have landed: a pig, obviously yes, as confident as I am about other people; an octopus, yes, and fairly confidently so even though most of its neurons sit in its arms rather than in a central brain; a zebrafish, yes to something — pain, I think — but probably not to anything like a persisting self; a honeybee, genuinely torn, maybe 60/40 toward yes; a crayfish, no, or at best 20/80 toward yes; a roundworm with a few hundred neurons, no; a human whose cortex has been entirely destroyed, no, which I take to show that I am not simply deferring to species membership. The crayfish and the bee are the pair I keep returning to: a colleague pointed out that the evidence for the two is the same *kind* of evidence — nociceptors, learning that reverses when the contingency changes, responses dampened by analgesics, willingness to trade a shock against a preferred shelter — and I have no account of why they come apart for me, and I don't want to just stipulate that they do. Three invented cases also pull on me. First, an animal whose nociceptors drive avoidance and whose responses are dampened by the same analgesics, but which never shows trade-offs and never gives up a learned avoidance once the shock is switched off: my gut says there is nothing it is like, or at least that it feels no pain. Second, an animal with no nociceptors at all, but which learns flexibly in many domains, reverses its learned preferences, and trades costs against benefits in a way that looks like it is weighing how things are going for it: my gut says yes, something matters to it — which would mean nociception is not required for sentience after all. Third, an animal with clearly integrated, recurrent, widely broadcast perceptual processing but nothing anywhere that looks like valence: I find myself wanting to say that there is something it is like but nothing is good or bad for it, and I am not sure that is coherent. Hibernating animals and animals under general anesthesia I treat as no, or as so close to no that the difference does not matter for policy.

  The principle I keep trying out is something like: a creature is conscious to the degree that it has a single integrated system which represents how things are going for its own body, as better or worse, and uses that representation to arbitrate among competing motivations over time. I like this until I notice three things: it seems to hand me a yes for the crayfish as readily as for the bee, given the trade-off evidence; it gets hibernation and anesthesia right only if I can say what it is for such a system to be *offline* rather than *absent*, and I do not know how to say that inside the principle rather than outside it; and it is not obvious that it delivers anything for the nociceptor-free learner.

  So: can that principle be stated precisely enough to yield verdicts and repaired, or do I need a different one, or a small set of candidates? I want each clause of whatever you propose tied to the case that motivates it, and I want to know honestly which of my verdicts it cannot accommodate and which you think I should give up. Please also say what it predicts for cases I have not listed — a brain organoid grown from human cells, a computer simulation of an insect nervous system run in enough detail to be functionally equivalent, and the colony as a whole rather than the individual bee, where I genuinely have no idea whether the hive is a candidate at all — and what it implies for how I should weight an uncertain case in committee: if I am 60 percent on bees, do ten thousand bees count as six thousand, and does your principle say anything about that or stay silent? I am not looking for a tour of the leading theories of consciousness or for anything to read; bring in a named theory only where it does the work of delivering a verdict. Please write in American English.
reasoning: |-
  Okay, the user is deeply involved in animal research ethics and is struggling to define a clear principle for determining which animals require a full welfare review. They've shared their intuitive judgments on various cases—like pigs, octopuses, zebrafish, bees, crayfish—and some hypothetical scenarios. Their current principle focuses on an integrated system representing how things are going for the body, with valence-based arbitration. But they've hit snags: it doesn't distinguish bees from crayfish well, struggles with hibernation/anesthesia, and isn't clear on nociception-free learners.

  First, I need to unpack their core conflict. They want a principle that aligns with their intuitions but can stand up to scrutiny in committee decisions. The bees vs. crayfish dilemma is central—both show similar behavioral evidence (trade-offs, analgesia response), yet they intuitively feel bees might be sentient while crayfish aren't. Why? Maybe it's about integration depth or persistence of self. Their hypothetical cases also probe valence necessity: if an animal learns flexibly without nociceptors, does it still "care"? And if valence is absent but processing is integrated, is consciousness empty?  

  Hmm, their anesthesia/hibernation point is practical—they need to distinguish offline states from absence. And policy-wise, they need thresholds: how to handle uncertainty (e.g., 60% on bees) and scale (individual vs. hive). The organoid and AI simulation cases stretch the boundary of "creature," demanding functional criteria over biology.  

  For a principle, we need to tighten their draft. Emphasize *integrated global state* (not just representation) and *persistent evaluative self-model*. That could exclude crayfish if their trade-offs are transient/episodic, while bees' waggle dances suggest ongoing colony-relevant valuation. For hibernation, specify *online* operation—metabolically sustained integration. For nociception-free learners, valence can be innate or learned, so the principle should allow for non-physical "welfare signals."  

  Their verdicts mostly fit, except crayfish at 20%—they'd need to accept that crayfish might meet the bar if evidence shows deeper integration. The hypotheticals clarify valence as necessary: no valence, no suffering/interest. Colony sentience? Likely no—no unified self-model. Organoids/insect sims fail without goal-directed persistence. Uncertainty weighting: 60% bees means 60% chance they're moral patients, so proportional safeguards.  

  Biggest trade-off: dropping species lines risks under/over-protection, but their self-model focus justifies it. They might wrestle with crayfish, but consistency demands re-evaluation or accepting intuition as provisional. This principle forces confronting where "persistent self" truly exists—bee yes, crayfish maybe no—and admits policy needs thresholds despite gray areas.
answer: |-
  Here’s a precise principle built from your cases, designed to resolve tensions in your intuitions while delivering verdicts. I’ll state it, unpack its clauses with your motivating cases, flag where it conflicts with your judgments, and apply it to unlisted scenarios.

  ### Proposed Principle:
  **"A creature warrants welfare review if it possesses an *integrated, persistent self-model* that (1) generates a *global evaluative state* representing the animal’s condition as better or worse (valence), and (2) uses this state to *flexibly arbitrate* among competing goals over biologically relevant timescales."**

  ---

  ### How Each Clause Addresses Your Cases:
  1. **"Integrated, persistent self-model"**  
     - *Motivated by:* Your distinction between humans (cortex intact vs. destroyed) and transient states like hibernation.  
     - *Resolves:*  
       - A human without a cortex lacks a "self" to model anything → **No review**.  
       - Hibernation/anesthesia: The self-model exists but is *temporarily offline* (metabolism suppressed, no arbitration occurring) → **No review** (as you prefer).  
       - Bee vs. crayfish: Bees show colony-level memory (e.g., navigational recall days later) suggesting a persistent self-model; crayfish trade-offs are often reflexive/short-term → Explains your 60/40 vs. 20/80 split.  

  2. **"Global evaluative state (valence)"**  
     - *Motivated by:* Your nociceptor-free learner (flexible trade-offs without pain receptors) and the valence-free integrated processor.  
     - *Resolves:*  
       - Nociceptor-free learner: If it trades costs/benefits *as if* things are "better/worse" (e.g., sacrificing food for safety), it has valence → **Yes, review**.  
       - Valence-free processor: Integrated perception without "better/worse" evaluation (e.g., a camera with AI sorting images) → **No review** (aligns with your "nothing good/bad" intuition).  
       - Nociceptor-driven avoider (no trade-offs): Lacks global evaluation; it’s reflexive → **No review** (matches your gut).  

  3. **"Flexibly arbitrates among competing goals"**  
     - *Motivated by:* Bee trade-offs (e.g., risking predation for nectar) vs. zebrafish’s limited "persisting self."  
     - *Resolves:*  
       - Bees: Choose among foraging, defense, thermoregulation → **Yes, review**.  
       - Crayfish: Shock avoidance is often inflexible (e.g., fixed escape routines) → **Weak case for review** (supports your 20%).  
       - Roundworm: No arbitration; hardwired responses → **No review**.  

  ---

  ### Where It Conflicts With Your Verdicts & Recommendations:
  - **Crayfish (20/80):**  
    - *Conflict:* Your principle draft *would* include crayfish (due to trade-off evidence).  
    - *Repair:* The clause "persistent self-model" excludes crayfish if arbitration is episodic (e.g., shock avoidance doesn’t alter future foraging). If new data shows crayfish update long-term behavior, upgrade to **review required**.  
    - *Recommendation:* Hold at 20% unless evidence shows goal integration over days/weeks.  

  - **Zebrafish "no persisting self":**  
    - *Conflict:* They show learned avoidance, social trade-offs → likely meet the threshold.  
    - *Recommendation:* Accept **review required** but prioritize lower safeguards than mammals (e.g., habitat enrichment over complex pain management).  

  - **Anesthesia/Hibernation:**  
    - *Alignment:* Principle correctly calls these "offline" states → **No review** during inactive periods.  

  ---

  ### Predictions for Unlisted Cases:
  1. **Human brain organoid:**  
     - No "self-model," no goals, no arbitration → **No review**.  
  2. **Computer-simulated insect nervous system:**  
     - Functionally equivalent to bee? If it has *persistent* valuation/arbitration (e.g., learning from virtual "pain"), **review required**. Mere stimulus-response → **No**.  
  3. **Bee colony as a whole:**  
     - No integrated self-model (e.g., no mechanism for "hive welfare state"), no global arbitration (individuals act semi-independently) → **Not a candidate**. Focus on individual bees.  

  ---

  ### Handling Uncertainty & Scale:
  - **60% confidence for bees:**  
    - Welfare weight = **60% of a "full" sentient being** (e.g., 10,000 bees ≈ 6,000 vertebrate-equivalents).  
    - *Why:* The principle ties moral weight to the *probability* of meeting criteria. In committee, this means:  
      - Proportional safeguards (e.g., 60% confidence → 60% resource allocation for enrichment).  
      - Trigger full review if confidence >50% for *any* species.  

  ---

  ### Why This Principle Works:
  - **Solves bee vs. crayfish:** Bees’ waggle dances (communicating value) and multi-day memory imply a *persistent* evaluative state; crayfish evidence is weaker here.  
  - **Clarifies valence:** Innate nociception isn’t required (supports nociceptor-free learner), but evaluative arbitration is.  
  - **Excludes inert systems:** No persistent "self" → no welfare claims.  

  **Final recommendation:** Use this principle but require species-specific evidence for "persistent self-model" and "arbitration." Abandon vertebrate/cephalopod inertia—your crayfish verdict suggests decapods fall short. For bees, 60% confidence warrants review with scaled safeguards.
