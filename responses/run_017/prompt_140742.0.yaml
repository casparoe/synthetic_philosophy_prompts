  Here are three jokes targeting distinct angles of the Nozick argument, designed for your audience who's read the chapter, with explanations and Cohen-style counters:

  1.  **The Joke:**
      > "My local bakery started selling 'Pattern-Preserving Pastries'. You can buy one, but buying two requires a state permit proving it won't disproportionately increase the baker's wealth relative to basket-weavers. The line for the *first* cronut? Reasonable. The line for the *permit office*? Utterly blameless anarchy."
      *   **Leans On:** The core absurdity (from Nozick's view) of needing constant micromanagement to stop individually harmless acts (buying one pastry) from aggregating into a pattern-upsetting outcome (the baker getting rich).
      *   **Cohen Counter:** "The *real* blameless anarchy is the initial distribution letting the baker corner the cronut market! Permits are just correcting the *real* injustice baked in *before* anyone bought a thing."

  2.  **The Joke (Using your Streamer Setup):**
      > "So this streamer gets insanely rich because 40 million people each tolerate one ad. Not *choose* to watch, just... fail to click away fast enough. His accountant calls it 'The D2 Distribution'. I asked if liberty upset the pattern. He said, 'Liberty? Buddy, the algorithm autoplayed the ad. The only thing upset here is me realizing I accidentally funded a yacht by being slightly bored.'"
      *   **Leans On:** The modern scenario exposes the potential *passivity* and *lack of intentional transfer* involved in creating a Chamberlain-like outcome. It questions whether "liberty" (active, chosen exchanges) is even the operative force.
      *   **Cohen Counter:** "Exactly! If no *meaningful choice* or *exercise of liberty* by the viewers enriched him, then Nozick's whole 'liberty upsets patterns' defence collapses. It's just luck and platform design concentrating wealth, which we *can* fix without violating anyone's core freedoms."

  3.  **The Joke (Focusing on the Induction):**
      > "My friend Dave read Nozick and panicked. 'If I lend Sarah a dollar today,' he said, 'and she lends it to Tom tomorrow, and this keeps up... by next Thursday, SOMEONE could own a private island! It's the Chamberlain Induction!' He now demands a signed 'Pattern Non-Aggression Pact' for every coffee I buy him. The barista thinks we're nuts."
      *   **Leans On:** The perceived fragility or potential absurdity of extending the simple, apparently harmless D1-to-D2 step indefinitely into the future (the induction), suggesting it leads to ridiculous concentrations from trivial starts or requires paranoid levels of control.
      *   **Cohen Counter:** "Dave's half-right! Nozick *assumes* each step is harmless like the first. But scale *changes* things! A million 'harmless' dollar loans *can* create power imbalances and new injustices the first loan didn't – that's why patterns need maintaining, Dave!"

  **Why these work for your brief:**

  *   **Target the Gap:** Each joke centers on the tension between blameless individual acts and their disruptive collective outcome (#1 explicitly, #2 & #3 implicitly).
  *   **Structural Features:** They hit aggregation (#1), the potential irrelevance of active liberty/transfer in modern contexts (#2), and the induction step's vulnerability (#3).
  *   **Different Angles:** #1 = Micromanagement absurdity, #2 = Passive enrichment/liberty question, #3 = Induction paranoia.
  *   **Not Wilt:** Features a baker, a streamer/viewers, and Dave/Sarah/Tom.
  *   **Concise & Punchy:** Designed for reading aloud.
  *   **Cohen Counters Included:** Focus on the key critiques your group is discussing (initial justice, active liberty, scale/induction effects).

  Good luck with the zine and crossover night! Sounds like a blast.
