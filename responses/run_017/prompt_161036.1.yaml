prompt: |-
  Need a thought experiment for a section I'm stuck on, and I keep building cases that collapse into the easy versions.

  The contrast I'm working with: David Lewis's account of a convention — a regularity in behaviour, in a recurring coordination problem, that everyone conforms to, that everyone expects others to conform to, that everyone has a real common interest in conforming to given that others do, where some alternative regularity would have done just as well (the arbitrariness bit), and all of this is common knowledge — set against a much thinner "evolutionary" story where a norm is just a regularity that's stable under a dumb learning dynamic: people mostly copy whatever they see most of, stick with whatever worked last time, and a small stubborn minority can drag the rest along.

  What I want is the direction that's hard to construct: a regularity that is stable over time, that everyone caught up in it would describe as "oh, it's just a convention, we could as easy do it the other way", and that the dynamics story happily calls a healthy norm — but that is not a Lewisian convention, because the common knowledge clause quietly fails. Everyone conforms, everyone expects the others to conform, and still it isn't common knowledge that they do.

  Constraints: ordinary setting (a workplace, a kitchen, a lab, a clinic — no island nations, no driving sides, no money); nobody communicates, votes, or takes orders from anyone; the participants can be pretty dumb, habit and copying is fine, nobody needs to reason about what anyone believes; one paragraph for the scenario itself. And no cheating by stipulating that common knowledge fails — it has to fall out of the structure of the situation: who can observe who, how many people there are, what happens when someone deviates.

  Then run the checks. Say which Lewis clause is doing the work and why it genuinely fails rather than just being hard for me to verify; show the dynamic account explaining both how the thing got started and why it stays; tell me what happens if I remove the feature that breaks common knowledge — does it collapse straight back into an ordinary Lewis convention? And give me the best Lewisian comeback: how does someone who wants to keep the Lewis machinery attack the case, and is that comeback just redefining "convention" so it wins?

  I'm going to use this in print, so the case has to actually earn its verdicts rather than announce them. Whole thing under 600 words, scenario included.
reasoning: |-
  We are going to construct a thought experiment in a laboratory setting. The lab has three adjacent workbenches (A, B, C) arranged in a line. Each bench has one technician (Alice, Bob, Carol) who performs a daily task requiring the use of a shared centrifuge. The centrifuge is located at the end of the room, past bench C. The task requires that each technician, after preparing their sample, must use the centrifuge. The lab has a rule: the centrifuge must not be left running unattended. Therefore, if a technician starts the centrifuge and then leaves, they must wait until it finishes (which takes 10 minutes) or find someone else to watch it. However, the lab also has a strict schedule: each technician must complete their task by a certain time.

  The regularity (R): When a technician finishes preparing their sample, if they see that the centrifuge is not in use, they start it and wait. If they see that it is already running and being watched by someone (i.e., a technician is sitting at the centrifuge station), they leave their sample with that person and return to their bench. The watcher then loads the sample when the current run finishes and starts a new run (if there are samples to run). If the centrifuge is running but unattended, the technician waits until it finishes and then loads their sample.

  The problem: The lab has a blind spot. From bench A, Alice can see the centrifuge area only if she stands up and looks over a partition (which she rarely does because it's awkward). Bob at bench B has a clear view of the centrifuge. Carol at bench C has a clear view and is closest.

  The dynamic: Initially, the technicians work independently. One day, Carol (at C) starts the centrifuge and waits. Bob finishes, sees Carol watching, leaves his sample with her, and returns to work. Alice, from A, cannot easily see the centrifuge, so when she finishes, she assumes it might be running unattended (because she can't see anyone). Therefore, she walks over. If she sees someone, she leaves her sample; if not, she waits. Over time, they settle into the regularity R.

  Why isn't this a Lewis convention? Let's check the clauses:

  - Regularity: Yes, R is followed.
  - Coordination problem: Yes, avoiding wasted time and ensuring samples are processed.
  - Conformity and expectation: Each conforms and expects others to conform (based on past experience).
  - Arbitrariness: They could have adopted a rule where the person who starts the centrifuge must always wait (no sharing), or where the person at bench C always watches, etc.
  - Common knowledge: This fails. Alice does not know that Bob and Carol know that she knows about R. Specifically, Alice does not know that Bob and Carol know that Alice cannot easily see the centrifuge. Therefore, Alice does not know that Bob and Carol expect her to walk over if she doesn't see anyone (because they might think she can see and therefore would leave her sample if she saw someone). Similarly, Bob and Carol do not know that Alice knows that they expect her to leave her sample when she sees someone. The blind spot breaks the chain of mutual knowledge beyond a few levels.

  The dynamic account: The regularity R stabilizes because it works. Each technician, when they act, finds that leaving a sample when they see a watcher (or waiting when they don't) leads to their sample being processed without excessive waiting. They copy what they see: Bob sees Carol watching and leaving samples, so he does the same. Alice, when she walks over, observes the others' behavior and imitates. Even if a new technician replaces Alice and doesn't know the rule, they might at first wait unnecessarily, but after seeing others leave samples when a watcher is present, they copy. The system is stable under a simple learning dynamic.

  What if we remove the blind spot? Suppose we remove the partition so Alice can see clearly. Then, everyone can see each other and the centrifuge. Now, when Alice finishes, she can see if someone is watching and act accordingly without moving. The common knowledge builds because each can see the others seeing the same situation. It becomes a Lewis convention.

  Lewisian comeback: A Lewis defender might argue that the common knowledge condition is not about the physical setup but about the agents' reasoning. They might say that after a while, Alice should infer that Bob and Carol know she has a blind spot because they see her walking over even when someone is watching. But note: Bob and Carol might interpret Alice's walking over as her being cautious, not necessarily due to a blind spot. Moreover, Alice might not realize that they see her walking over (because when she walks over, she is focused on the centrifuge). The comeback might try to build common knowledge through repeated interactions, but the structure (the blind spot and the fact that Alice's behavior is ambiguous) prevents it. The Lewisian might then redefine convention to require only "practical" common knowledge, but that would be moving the goalposts.

  Thus, we have a stable regularity that is arbitrary, expectation-driven, and dynamically maintained, but not a Lewis convention due to the failure of common knowledge arising from the observational limitations.
answer: |-
  ### Thought Experiment: The Lab Centrifuge Rule  
  **Setting:** A biochemistry lab with three technicians (Alice, Bob, Carol) sharing a centrifuge. Samples must be spun promptly, but lab policy forbids leaving the centrifuge unattended. The centrifuge is visible only to Bob and Carol (due to an obstructed sightline from Alice’s workstation).  

  **Regularity R:**  
  - If the centrifuge is idle, anyone starting it must wait.  
  - If it’s running and attended (e.g., Bob is watching), others leave samples with the watcher, who reloads it.  
  - If it’s running unattended, the next technician waits.  
  Over time, R stabilizes: Technicians conform because leaving samples with a watcher saves time, and copying others’ behavior reinforces R. Alice often walks over to check the centrifuge (due to her poor view), sees Bob/Carol attending it, and leaves her sample. All call R “arbitrary” (“We could just always wait!”).  

  **Why Not Lewisian?**  
  R satisfies all Lewis conditions *except common knowledge*:  
  - **Conformity/expectations:** All follow R and expect others to (based on habit).  
  - **Coordination/arbitrariness:** R solves the “who waits?” problem; alternatives exist.  
  - **Common knowledge failure:** Alice doesn’t know *what Bob/Carol know about her actions*. Bob/Carol see Alice approach the centrifuge daily but attribute it to caution, not her obstructed view. Alice assumes they know she can’t see well, but they don’t (and she doesn’t know they don’t). Thus, it’s not common knowledge that “all expect conformity to R” because Alice’s epistemic limitation (her view) isn’t mutually recognized. Deviation (e.g., Alice not leaving a sample when she *should*) might be misinterpreted as laziness, not ignorance, preventing coordinated correction.  

  **Dynamics Explain Stability:**  
  R emerges via reinforcement: Leaving samples with watchers succeeds (positive feedback), and occasional waiting (when unattended) punishes deviation. A stubborn Alice who always walks over “trains” Bob/Carol to expect her approach, locking in R. Copying dominates: New hires mimic R without reasoning.  

  **Removing the Blind Spot:**  
  If Alice’s view is cleared, R collapses into Lewisian convention. Now, all *see* each other seeing R. Alice no longer walks over needlessly; deviations (e.g., Carol neglecting to watch) are instantly recognized and corrected. Common knowledge forms: All know all know R is expected.  

  **Lewisian Comeback and Rebuttal:**  
  *Comeback:* Lewisians might argue repeated interactions generate common knowledge: “Alice’s daily walks *should* reveal her blind spot to Bob/Carol.”  
  *Rebuttal:* This overintellectualizes. Technicians don’t infer hidden states; they react to surface behavior (e.g., “Alice walks over → we attend more”). The comeback assumes ideal reasoning, violating the “no deep reasoning” constraint. If this counts, Lewis’s account becomes unfalsifiable—redefining “convention” to ignore empirical cognitive limits.  

  **Verdict:**  
  R is a norm by dynamic standards (stable under imitation/reinforcement) but not a Lewis convention. The blind spot severs common knowledge by hiding Alice’s epistemic context, a structural flaw Lewis requires but dynamics ignore.  

