  Round 1: Baseline Prisoner's Dilemma (PD) without any programs. This establishes the baseline behavior.

  Round 2: Each participant submits a program in a tiny pseudo-code. The program can inspect the opponent's source code at a small cost. We need to design this pseudo-code.

  Round 3: A rewriter is applied to one program (randomly chosen per pair) that changes variable names, reorders independent clauses, reformats, etc., but preserves behavior. This breaks programs that rely on exact string matching.

  Round 4 (optional): Instead of source inspection, each program can run the opponent's program against a probe (a test program) and observe the output. This is a sandboxed execution.

