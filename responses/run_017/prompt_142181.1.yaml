  ### Response to Query: Designing the Decision Theory Activity

  Below is a comprehensive design for your 90-minute session, addressing all six requests. The activity is structured to lead participants through the discovery process you described, with minimal lecturing. The core insight is that **submitting programs (rather than actions) dissolves the dominance argument for defection via syntactic self-referential checks, but this cooperation is fragile and relies on accidental code similarity, not mutual trust or semantics**.

  ---

  ### 1. **Pseudo-Code Specification**  
  **Primitives** (inspired by minimal "program games" in decision theory):  
  - `SELF`: String representing the program's own source code.  
  - `OPP`: String representing the opponent's source code (accessible only via `INSPECT`).  
  - `INSPECT(OPP)`: Returns `OPP`'s source as a string. Costs `c` points (applied once per run).  
  - `IF(condition, action1, action2)`: Ternary operator; `condition` is a boolean expression.  
  - `ACTION`: Output `COOPERATE` or `DEFECT`.  
  - **Allowed conditions**: Only string equality (`SELF == OPP`) or inequality (`SELF != OPP`).  

  **Syntax Examples**:  
  - Blind cooperation: `COOPERATE`  
  - Blind defection: `DEFECT`  
  - Identity check: `IF(SELF == INSPECT(OPP), COOPERATE, DEFECT)`  
  - Bully (exploits non-mirrors): `IF(SELF == INSPECT(OPP), COOPERATE, DEFECT)` (same as identity check but defects on mismatch)  
  - Paranoid cooperator: `IF(SELF != INSPECT(OPP), DEFECT, COOPERATE)`  

  **Worked Adjudication** (Pair: Identity Check vs. Blind Cooperator):  
  - **Program A** (Identity Check): `IF(SELF == INSPECT(OPP), COOPERATE, DEFECT)`  
  - **Program B** (Blind Cooperation): `COOPERATE`  
  - **Steps**:  
    1. A inspects: Pays cost `c`. Compares its source to B's. `A.source` ≠ `B.source` → outputs `DEFECT`.  
    2. B outputs `COOPERATE` (no inspection).  
    3. Payoff: A gets `T - c` (temptation payoff minus cost), B gets `S` (sucker payoff).  

  **Malformed/Non-Halting Rule**:  
  - Malformed (e.g., undefined conditions, invalid syntax): Treated as `DEFECT` with no inspection.  
  - Non-halting (impossible here, as no loops): Not applicable.  
  - **Adjudication Time**: < 30 seconds/pair (simple string checks).  

  ---

  ### 2. **Payoff Scheme**  
  **Prisoner's Dilemma Payoffs**:  
  - Mutual cooperation (C,C): **3 points**  
  - Mutual defection (D,D): **1 point**  
  - Exploiter (D vs. C): **5 points**  
  - Exploited (C vs. D): **0 points**  
  - **Inspection cost `c = 1 point`** (subtracted if `INSPECT` is called).  

  **Calibration Rationale**:  
  - Blind cooperation risks `0` (if exploited), while identity check gives `3 - c = 2` (with copies) but costs `c`.  
  - Free inspection is discouraged: e.g., a program inspecting then always cooperating gets max `3 - c = 2`, worse than mutual defection (`1`) if paired with a defector.  
  - **Stakes**: Chocolate (e.g., 1 piece = 5 points; adjust for triviality).  

  ---

  ### 3. **Handout Text & Submission Protocol**  
  **Handout for All Rounds**:  
  > "Submit a program that plays Prisoner’s Dilemma. Your program can:  
  > - Output `COOPERATE` or `DEFECT`.  
  > - Use `INSPECT(OPP)` to check the opponent’s source (cost: 1 point).  
  > - Compare sources with `SELF == OPP` or `SELF != OPP`.  
  > **Format**: One line. Examples:  
  > - `COOPERATE`  
  > - `DEFECT`  
  > - `IF(SELF == INSPECT(OPP), COOPERATE, DEFECT)`  
  > **Rules**:  
  > 1. No communication with others.  
  > 2. No names/identifiers in submissions.  
  > 3. Malformed programs default to `DEFECT`.  
  > Payoffs: C vs. C = 3; C vs. D = 0/5; D vs. D = 1. Inspection costs 1 point."  

  **Submission Protocol**:  
  - **Anonymity**: Submissions on identical paper slips, collected in a box.  
  - **Random Pairing**: Shuffle submissions and pair randomly each round.  
  - **Anti-Coordination Measures**:  
    - Emphasize "no communication" in instructions.  
    - Use a neutral third party (e.g., a non-participant) to shuffle and pair.  
    - Discard submissions with recognizable patterns (e.g., "COOPERATE_John").  

  ---

  ### 4. **Debrief Guide**  
  Map moments to theoretical insights:  
  - **Identity Check Invention** (Round 2):  
    - *Claim*: Programs can conditionally cooperate by checking syntactic identity.  
    - *Facilitator Prompt*: "Notice programs that cooperated only with copies of themselves. How did this bypass the dominance argument?"  
  - **Bully vs. Blind Cooperation** (Round 2):  
    - *Claim*: Nash equilibria include both cooperative (identity checks) and exploitative (bullies) programs.  
    - *Facilitator Prompt*: "Did any program exploit others by defecting unless identical? Why is this also stable?"  
  - **Recompiler Round** (Round 3):  
    - *Claim*: Cooperation relies on syntax, not semantics; rewrites break "fragile" equilibria.  
    - *Facilitator Prompt*: "After rewrites, why did identical-intent programs defect? What replaced mutual recognition?"  
  - **Sandbox Round** (Round 4, if run):  
    - *Claim*: Testing behavior (via probes) can achieve robust cooperation.  
    - *Facilitator Prompt*: "Did any program cooperate with all cooperators? How did probes make intentions indistinguishable?"  

  ---

  ### 5. **Honest Note: Limitations**  
  **What the Activity Cannot Reproduce**:  
  - **Self-reference**: Programs access `SELF`/`OPP` by fiat, not quining or fixed-point theorems.  
  - **Fixed points**: Rewriters preserve behavior by assumption; no proof of existence.  
  - **Acausal reasoning**: Programs interact causally; no true superrationality (e.g., Hofstadter).  

  **How to Explain Without Lecturing**:  
  - During debrief, pose questions:  
    > "We assumed programs can inspect their source. In reality, this requires self-reference—how might that work?"  
    > "Rewriters changed syntax but not behavior. Could we design programs immune to this? How?"  
    > "This isn't 'magic' coordination—what's missing compared to theories like superrationality?"  

  ---

  ### 6. **Predictable Challenges & Mitigations**  
  - **Formatting Mismatches**:  
    - Mitigation: Use strict syntax rules (e.g., "`IF(SELF==INSPECT(OPP),COOPERATE,DEFECT)`").  
  - **Personal Reactions to Exploitation**:  
    - Mitigation: Preface with "This is about theory, not you; defection isn't personal."  
  - **Recompiler as "Rigged Gotcha"**:  
    - Mitigation: Frame rewrites as "software updates" to normalize syntax.  
  - **Clock Issues**:  
    - Mitigation: Allocate time: Round 1 (10 min), Round 2 (20 min), Round 3 (20 min), Round 4 (20 min), Debrief (20 min). Skip Round 4 if behind.  

  **Least Confident Elements**:  
  - **Recompiler Round Clarity**: Participants may miss that rewrites expose syntactic fragility. *Watch for*: Confusion when identical-intent programs defect. *Fix*: Contrast Round 2 vs. 3 outcomes.  
  - **Contested Interpretation**: The design assumes "program equilibrium" (Tennenholtz) resolves the dilemma, but critics argue it trivializes mutual rationality. *Position Taken*: Cooperation is possible but accidental.  
  - **Abort Triggers**: Drop Round 4 if participants fixate on probes; drop recompiler if identity checks are rare.  

  ---

  ### Activity Flow  
  1. **Round 1 (Baseline)**: Submit `COOPERATE`/`DEFECT`. Random pairing.  
  2. **Round 2 (Programs)**: Submit programs. Pair and adjudicate (apply inspection costs).  
  3. **Round 3 (Recompiler)**: Rewrite one program per pair (e.g., add spaces/rename vars). Re-pair and adjudicate.  
  4. **Round 4 (Sandbox, Optional)**: Submit probe + action rule (e.g., `PROBE: COOPERATE; IF OUTPUT=COOPERATE, COOPERATE, DEFECT`).  
  5. **Debrief**: Guided discussion using prompts above.  

  This design ensures participants "run into" the key insights while fitting within 90 minutes. The pseudo-code and payoff scheme enable rapid adjudication, and the debrief links experiments to theory.
