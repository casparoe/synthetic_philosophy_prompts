  Below is a complete, runnable in-class game designed to help students encounter the knowing-how/knowing-that distinction without explicit instruction. The game focuses on skill transmission through a chain (A → B → C) using a simple skill that's easy to demonstrate but hard to describe: **tying a bowline knot with one hand (right hand) in front of the body**. This skill meets your criteria: it's learnable in under 5 minutes (most students can get it with practice), has a clear pass/fail (the knot holds when pulled), and has natural variants (e.g., using the left hand). Materials are cheap and accessible: 1-meter lengths of rope (5-7mm thick cotton rope works well; budget about $1 per student) and paper/pens for instructions.

  I'll provide the full game structure, including rules, scoring, timing, scripts, debrief, and handling of predictable issues. The game is optimized for a 16-person seminar (5 teams of 3, with 1 extra student as a "roving judge" to assist with scoring). Total time: 75 minutes.

  ---

  ### **Game Overview: The Knot Chain**
  **Core Idea:** Teams of 3 (A, B, C) transmit the skill of tying a one-handed bowline knot. A teaches B, then B writes instructions for C. The game has 3 rounds with different transmission constraints, revealing tensions between demonstration (knowing-how) and description (knowing-that). Scoring is rigged to create conflicts:
  - **A** scores on **B's variant performance** (e.g., using the left hand), incentivizing A to teach general principles.
  - **B** scores on **B's original performance** and **C's performance**, incentivizing B to master the exact skill and write effective instructions.
  - **C** scores on **C's performance**, incentivizing effort but making C dependent on B's instructions.

  **Skill Details:**
  - **Original skill:** Tie a bowline knot with your right hand in front of your body.  
    *Success criterion:* The knot forms a secure loop that doesn't slip when pulled (test by tugging the rope ends).
  - **Variant skill (for "parakeet check"):** Tie the bowline with your left hand in front of your body.  
    *Why this variant?* It's a natural analog (no new materials) and reveals rigidity in skill application. Most right-handed people struggle when switching hands, exposing those who learned by rote mimicry.

  **Materials Needed (per team):**
  - 3 pieces of rope (1m each, identical thickness/type).
  - Paper and pens for instructions.
  - Printed rule sheets for each round (provided below).
  - Timer (visible to all).
  - Scoring sheets for the instructor (template provided).

  **Pre-Game Setup (5 minutes before start):**
  - Arrange chairs in 5 clusters for teams. Place 3 ropes and paper/pen at each station.
  - Choose the "roving judge" (the extra student) to help with scoring and rule enforcement.
  - Briefly train all A's: Demonstrate the one-handed bowline (right hand) slowly 3 times. Give A's 2 minutes to practice.  
    *Note:* The bowline is chosen because it's globally recognizable (rabbit-hole metaphor: loop, tail through, around tree, back down). Most learners get it in 2-3 minutes with cues. If students struggle, simplify: Allow two fingers for tension, but emphasize one-handed grip.

  ---

  ### **Game Rules and Rounds**
  **Total Time:** 60 minutes (3 rounds × 18 minutes + transitions).  
  **Roles:** Rotate each round so all students experience A, B, and C.  
  **Scoring Arithmetic:**
  - **B's performances:** Scored 0–5 by instructor/roving judge (5 = perfect knot instantly, 3 = functional but slow/awkward, 1 = partial attempt, 0 = no attempt/fail).
  - **C's performance:** Scored 0–5 (same scale).
  - **A's round score = B's variant score** (0–5).  
    *Why?* Forces A to care about B's adaptability, not just rote copying.
  - **B's round score = B's original score + C's score** (0–10 total).  
    *Why?* Creates tension: B wants A to focus on the original skill, not general principles for the variant.
  - **C's round score = C's score** (0–5).  
    *Note:* Scores are per round. Final scores are cumulative across roles.

  **Key Constraints Built In:**
  - **"No pointing words" rule:** In Round 1, B's instructions cannot use terms like "left," "right," "up," "toward you," or "like this." Forces reliance on objective descriptions.
  - **Narration penalty:** In Round 3, B must narrate their actions aloud during the original performance. This disrupts "feel"-based learners but not step-based learners.
  - **Parakeet check:** Calculated as **B's original score minus B's variant score** (e.g., 5 - 0 = "perfect parakeet"). High difference indicates rigidity.

  **Round Structure (Each 18 minutes):**
  1. **Teaching (5 min):** A teaches B (constraints vary by round).
  2. **B's Performances (2 min):** 
     - B performs original skill (scored for B).
     - **Variant announced:** Judge says, "Now do it with your left hand." B performs variant (scored for A).
  3. **Instruction Writing (5 min):** B writes instructions for C (constraints vary).
  4. **C's Performance (3 min):** C reads instructions and attempts original skill (scored for B and C).
  5. **Transition (3 min):** Rotate roles (A→B, B→C, C→A), reset ropes.

  **Round-Specific Rules (Handout Text for Teams):**  
  *Give these to students at the start of each round.*

  - **Round 1: Silent Teaching, Restricted Instructions**  
    - Teaching: A must teach in silence (no speaking, only demonstrating).  
    - Writing: B must write instructions with **no pointing words** (e.g., no "left," "right," "toward you"). Use only objective terms (e.g., "cross the rope over itself").  
    *Purpose:* Forces knowing-how transmission; exposes limits of propositional descriptions.

  - **Round 2: Verbal Teaching, Unrestricted Instructions**  
    - Teaching: A may use words and demonstrations.  
    - Writing: B may write instructions with any words.  
    *Purpose:* Reveals if adding language helps, and if students default to step-by-step knowing-that.

  - **Round 3: Verbal Teaching + Narration Penalty**  
    - Teaching: A may use words and demonstrations.  
    - B's Performance: B must **narrate aloud** each step while tying the original knot (e.g., "I am looping the rope around my finger").  
    - Writing: B may write instructions with any words.  
    *Purpose:* Tests if narration disrupts performance, exposing "feel" vs. "step-list" learning.

  ---

  ### **What You Say at the Start (0 minutes)**
  *Stand at the front, no notes, casual tone. Do NOT mention "knowing-how/knowing-that" or philosophers.*  
  "Welcome! Today we’re doing a hands-on game about skill transmission. Here’s how it works:  
  - You’ll be in teams of three: **A, B, and C**.  
  - **A starts knowing a skill:** tying a specific knot one-handed. Your job is to pass this skill down the chain: **A teaches B**, then **B writes instructions for C**.  
  - We’ll do **3 rounds**—each with different rules—and rotate roles each time.  
  - **Scoring:**  
    - **A** gets points based on **how well B does a surprise variant** of the skill (e.g., using the other hand).  
    - **B** gets points for **doing the original skill well** AND for **how well C does it from instructions**.  
    - **C** gets points for **their own performance**.  
  - **Goal:** Maximize your team’s score. Pay attention to what makes transmission easy or hard.  
  I’ll time each phase. Any questions? Let’s start!"

  *Then:* Assign teams (5 teams of 3), name the roving judge, and hand out materials. Pre-train A's (2 minutes).

  ---

  ### **Scoring Sheets and Tracking**
  **Instructor’s Scoring Template (per team):**  
  | Round | B's Original (B score) | B's Variant (A score) | C's Original (C score + B score) | Notes (e.g., parakeet index, narration issues) |
  |-------|-------------------------|------------------------|----------------------------------|-----------------------------------------------|
  | 1     | /5                      | /5                     | /5                               | Parakeet: B_orig - B_var = ___               |
  | 2     | /5                      | /5                     | /5                               | Parakeet: B_orig - B_var = ___               |
  | 3     | /5                      | /5                     | /5                               | Parakeet: B_orig - B_var = ___               |

  **How to Score Efficiently:**  
  - **Roving judge** scores 2–3 teams; instructor scores the rest.  
  - **Knot success:** Test by pulling rope ends. Secure loop = pass (5). Loose/slipping = 3. Tangled/missing loop = 1. No attempt = 0.  
  - **Parakeet index:** Calculate after B's variant (B_original minus B_variant). High value (e.g., 5-0) = rigid "parakeet."  
  - **Narration note (Round 3):** Record if B's narration was fluent (no performance drop) or halting (performance drop).

  ---

  ### **Predictable Problems and How to Handle Them**
  1. **A student can’t do the skill at all (e.g., struggles with dexterity):**  
     - **Allow it, but mitigate:** Pre-game training helps, but if someone fails, use it. In debrief, highlight how "ability varies" as evidence for Ryle. Offer a simplified knot (e.g., allow two fingers) to keep them engaged.  
     - **Why allow?** Real-world skills aren’t equally learnable—this mirrors Ryle’s point that knowing-how isn’t binary.

  2. **A student tries to film the demonstration:**  
     - **Block it.** Announce: "No phones or recordings. This is about live transmission."  
     - **Why?** Filming bypasses the game’s purpose (showing the gap between demonstration and description). It turns knowing-how into knowing-that (video as "proposition").

  3. **B writes a manual that says "ask A" or is intentionally vague:**  
     - **Block it with a rule:** Start with, "Instructions must be self-contained—no references to people, and C can’t ask questions."  
     - **Why?** Ensures instructions are propositional knowledge, testing intellectualist claims. Vague manuals fail naturally, revealing description limits.

  4. **C ignores instructions and imitates another team:**  
     - **Allow it, but penalize:** Score C based on instructions alone. If C cheats, say: "C, you’re scoring based on what the manual allowed."  
     - **Why?** In real life, people supplement propositions with know-how—this shows the interplay.

  5. **Team finishes early/late in a phase:**  
     - **Keep strict timing.** Use a visible timer. Announce: "Stop when time’s up—success depends on constraints."  
     - **Why?** Time pressure amplifies the tension between A and B’s goals.

  ---

  ### **Debrief (10–15 minutes)**
  **Goal:** Guide students to connect game experiences to the Ryle vs. intellectualist debate. Start open-ended, then map moments to arguments.  
  **Script:**  
  "Let’s reflect on what happened. I’ll ask questions, and we’ll build connections together."  

  1. **Open Discussion (3 min):**  
     - "What was hardest about transmitting the skill?"  
     - "When did you feel tension between what A wanted and what B wanted?"  
     - "Did anyone notice patterns in when narration helped or hurt?"  

  2. **Map Moments to the Debate (5 min):**  
     Use student responses to highlight:  
     - **Failed manuals (Round 1):** "In Round 1, with no pointing words, manuals often failed. This mirrors **Ryle’s argument** that knowing-how can’t be reduced to knowing-that—propositions break down without context. An intellectualist might counter that the manuals were incomplete, not that propositions are insufficient."  
     - **Narration penalty (Round 3):** "When B narrated, some faltered if they ‘felt’ the knot, while step-learners were fine. For **Ryle**, this shows skill isn’t just inner speech—it’s embodied. Intellectualists might say narration adds cognitive load but doesn’t disprove propositional roots."  
     - **Parakeet cases (High B_orig–B_var):** "If B aced the original but flunked the variant, they’re a ‘parakeet’—rigid mimicry. **Ryle** says this proves knowing-how is a flexible disposition. Intellectualists might argue the variant requires new propositions."  
     - **A vs. B conflict:** "A cared about B’s variant, B cared about the original and C. This echoes **Ryle’s critique** that intellectualists confuse ‘intelligent practice’ (knowing-how) with ‘merely knowing rules’ (knowing-that)."  

  3. **Game Limitations and the Shortest Path Deeper (2 min):**  
     "This game doesn’t cover everything. For example:  
     - It can’t show cases where you **know all propositions but still can’t perform** (e.g., reading a surgery manual doesn’t make you a surgeon).  
     - It doesn’t address **practical modes of presentation** (e.g., grasping a proposition ‘as a skill’ vs. ‘as a fact’).  
     Shortest path in: Next class, we’ll discuss how Ryle might explain a chef who knows recipes (knowing-that) but burns food, or an intellectualist response to today’s manuals. Bring examples from your life!"  

  **End:** Assign optional reflection: "Journal about a skill you can do but can’t explain—or vice versa."

  ---

  ### **Why This Game Works**
  - **Encounter, not announcement:** Students experience the distinction through conflict (A vs. B scoring), failed manuals, and narration penalties.  
  - **Parakeet check:** Built into scoring via B_original – B_variant.  
  - **Time-efficient:** Balances depth with pace (strict 5/2/5/3 min phases).  
  - **Debrief links to debate:** Specific moments map to Ryle (anti-intellectualist) and intellectualist counterarguments.  

  **First-Time Run Tips:**  
  - **Rehearse the knot** to demo smoothly.  
  - **Embrace chaos:** If a team fails, it’s data for debrief ("Why did transmission break?").  
  - **Keep energy high:** Use the roving judge to troubleshoot.  

  This game creates a visceral foundation for your seminar. In the final 10 minutes, you can bridge to deeper theory using the limitations above. Good luck!
