  - The **named position**.
  - **Awkward commitment**: One sentence on its most counterintuitive or problematic implication.
  - **Trained nets have content?**: Whether the position ascribes content to states in a trained neural network.

  After the tree, I list:
  - **Impossible paths**: Combinations of answers that no theory holds, with brief explanations for why they're empty.
  - **Unseparable leaves**: Pairs of leaves that the tree cannot distinguish, regardless of node ordering, with reasons.

  ---

  ### **Decision Tree: Naturalizing Content**

  **Start**: Assume that at least some internal states of a system (biological or artificial) are genuinely about the world.

  1. **Node 1 (New Mutation)**: A state arises from a brand-new beneficial mutation in an organism. It reliably covaries with predators, enhances survival, and has no evolutionary history. Does this state have content?  
     - **Yes** → Node 2  
     - **No** → Node 6  

  2. **Node 2 (Broken Correlation)**: In a lineage, a state was selected over generations for covarying with food and guiding successful eating. Due to environmental change, it now covaries only with inedible objects, wasting energy. Does this state still represent food?  
     - **Yes** → Node 3  
     - **No** → Node 4  

  3. **Node 3 (Co-opted Structure)**: A structure was selected for thermoregulation (indicating temperature). Now, it reliably covaries with predators and is used to avoid them. Does it represent predators?  
     - **Yes** → Node 5  
     - **No** → Node 7  

  4. **Node 4 (Duplicate Frog)**: A molecule-for-molecule duplicate frog (created in a lab, no ancestry) is in the same environment as a normal frog. Its retinal state fires at small dark moving dots. Does this state have content?  
     - **Yes** → Node 8  
     - **No** → Node 9  

  5. **Node 5 (Mismatch Case)**: A producer mechanism was selected for indicating X. The downstream consumer was only ever reinforced for using it as Y (e.g., through learning), and it now guides behavior toward Y. What does the state represent?  
     - **X** → Node 10  
     - **Y** → Leaf 2  

  6. **Node 6 (Effect on Others)**: A state (e.g., a warning call) was selected because it caused effects on other members of the species (e.g., benefiting relatives), not because of effects on the bearer. Does it represent the thing that explains the benefit to others?  
     - **Yes** → Node 11  
     - **No** → Node 12  

  7. **Node 7 (Deep Net)**: A deep neural network is trained by gradient descent on a cost function to perform a task. It has no evolutionary history. Do its internal states have genuine content?  
     - **Yes** → Node 13  
     - **No** → Leaf 8  

  8. **Node 8 (Covariation in Co-option)**: The co-opted structure (from Node 3) now reliably covaries with predators. Does it represent predators?  
     - **Yes** → Leaf 6  
     - **No** → Node 14  

  9. **Node 9 (Trained Net Content)**: The trained deep net (from Node 7) has internal states that covary with features in the world. Do these states have content?  
     - **Yes** → Leaf 9  
     - **No** → Leaf 10  

  10. **Node 10 (Asymmetric Dependence)**: In the frog, the retinal state fires at both flies and pellets, but it's "supposed to be" about flies. Is it about flies because the pellet-triggering depends on the fly-triggering (e.g., pellets mimic flies), but not vice versa?  
      - **Yes** → Leaf 11  
      - **No** → Leaf 12  

  **Leaf 1: Standard Teleosemantics (Etiological)**  
  - *Awkward commitment*: New mutations and duplicates lack content despite covarying reliably with features in the world.  
  - *Trained nets have content?*: No (lacks evolutionary history).  

  **Leaf 2: Consumer-Based Teleosemantics**  
  - *Awkward commitment*: Content depends entirely on what downstream consumers "need," ignoring producer history (e.g., in mismatch cases).  
  - *Trained nets have content?*: Yes (if nets have consumer-like subsystems).  

  **Leaf 3: Inferential Role Semantics**  
  - *Awkward commitment*: Content is holistic and system-wide, making misrepresentation (e.g., error in one state) difficult to localize.  
  - *Trained nets have content?*: Yes (states derive meaning from computational/inferential roles).  

  **Leaf 4: Interpretivism/Deflationism**  
  - *Awkward commitment*: Content is not objective; it depends on the attributor's perspective, risking relativism.  
  - *Trained nets have content?*: Yes (content is "read off" by ideal interpreters).  

  **Leaf 5: Structural Similarity/Isomorphism**  
  - *Awkward commitment*: Requires internal states to structurally mirror the world, which may not hold for abstract representations (e.g., "justice").  
  - *Trained nets have content?*: Yes (if activation patterns structurally resemble inputs).  

  **Leaf 6: Informational Semantics (Covariation)**  
  - *Awkward commitment*: Suffers from the "disjunction problem" (e.g., frog's state represents flies-or-pellets, not flies).  
  - *Trained nets have content?*: Yes (covariation is sufficient).  

  **Leaf 7: Eliminativism/Error Theory**  
  - *Awkward commitment*: Denies content exists at all, making intentional explanations (e.g., "beliefs") systematically false.  
  - *Trained nets have content?*: No (nothing is "about" anything).  

  **Leaf 8: Non-Etiological Indication Semantics**  
  - *Awkward commitment*: Current covariation determines content, so broken correlation cases lose their original meaning.  
  - *Trained nets have content?*: Yes (covariation is sufficient).  

  **Leaf 9: Conceptual Role Semantics**  
  - *Awkward commitment*: Content depends on inferential connections, which may not be stable across contexts or systems.  
  - *Trained nets have content?*: Yes (roles are defined by network architecture).  

  **Leaf 10: Asymmetric Dependence (Nomic Covariation)**  
  - *Awkward commitment*: Requires specifying "nomic dependencies" that are often undefined or circular (e.g., what makes fly-triggering primary?).  
  - *Trained nets have content?*: Yes (if covariance asymmetries hold).  

  **Leaf 11: Consumer-Based Variant (for Etiology)**  
  - *Awkward commitment*: Group-level traits (e.g., effects on others) determine individual content, which may not align with bearer-level functions.  
  - *Trained nets have content?*: No (lacks evolutionary consumers).  

  **Leaf 12: Crude Informational Semantics**  
  - *Awkward commitment*: Content is disjunctive and coarse-grained (e.g., represents flies-or-pellets), failing to capture specificity.  
  - *Trained nets have content?*: Yes (covariation is sufficient, even if disjunctive).  

