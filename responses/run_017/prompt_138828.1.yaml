  ### **Impossible Paths**
  These combinations of answers are not held by any theory because they lead to logical inconsistencies or are theoretically unattractive:
  - **Node 4 → No and Node 9 → Yes**: Denies content to the duplicate frog (which lacks history) but ascribes it to the trained net (which also lacks history). *Why empty?* Inconsistent—no theory requires history for one but not the other without additional criteria (e.g., biological vs. artificial), which aren't tested here.
  - **Node 5 → X**: Asserts that in the mismatch case, content is fixed by the producer's history after accepting that co-opted structures represent current use (Node 3 → Yes). *Why empty?* Contradicts the consumer-based intuition from Node 3; no theory simultaneously prioritizes current use here and producer history there.
  - **Node 6 → No and Node 12 → Yes**: Denies that effects on others determine content but ascribes content to the duplicate frog in an etiological path. *Why empty?* Incoherent—if history is necessary (Node 1 → No), the duplicate frog (no history) cannot have content.

  ---

  ### **Unseparable Leaves**
  These leaf pairs cannot be distinguished by the tree, regardless of node ordering, due to overlapping commitments in the cases used:
  - **Inferential Role (Leaf 3) and Conceptual Role (Leaf 9)**: Both depend on internal computational/inferential roles, and the cases (e.g., broken correlation, deep net) do not force a choice between "inferential" and "conceptual" nuances. *Why?* They share core commitments (e.g., role-dependence), and no node isolates their differences (e.g., holism vs. atomism).
  - **Informational Semantics (Leaf 6) and Crude Informational Semantics (Leaf 12)**: Both rely on covariation, and the tree's cases (e.g., duplicate frog, co-opted structure) do not test for disjunction or asymmetry deeply enough to split them. *Why?* Node 10 (asymmetric dependence) only applies to a subset of paths, leaving covariation-based theories underdetermined.
