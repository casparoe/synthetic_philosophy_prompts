prompt: |-
  hey — please act as a professional philosopher who's spent serious time on formal epistemology, and also as someone who has actually had to ship something on a deadline. think carefully, and do a bit of brainstorming before you start writing: I want the conceptual work done first (what exactly goes wrong in these two cases, and which features of the cases are doing the work), and then translated into something usable. Don't just hand me a list.

  I co-run the verification desk at a small nonprofit that publishes long investigative reports. A typical report is 90–140 pages with 400–600 numbered factual claims, each footnoted to a document, a dataset, or an interview. My team is me, one other staffer, and two freelancers, and we get ten days. Everything goes past a managing editor who has final say but no time to re-check anything, and we have outside counsel we can call, but they bill by the hour and get annoyed when we ask them about things that aren't legal questions.

  The decision we make over and over — a few hundred times a report — is what grade of comittment to give each claim: assert it flatly; assert it hedged; attribute it to a source rather than asserting it; or cut it. Then at the end there are two global decisions: what the headline claim of the report gets to say, and what the short note at the front of the report gets to say about possible errors.

  A friend who does philosophy told me we're living inside two paradoxes. The first is the lottery one: for any single claim the evidence can be good enough that it clearly passes our bar, the way any single ticket in a big lottery is overwhelmingly likely to lose — but you still shouldn't accept that all of them pass, and the set of everything you've accepted is something you know is false. The second is the preface one: we believe every claim in the report, and we also believe — and print, up front — that there's probably an error somewhere in it. She also mentioned the view that belief is just having credence above some threshold, and that a lot of the trouble comes from combining that with the assumption that if you accept A and you accept B you may accept A-and-B.

  So: give me a procedure my team can actually run, claim by claim, and then once over the finished draft. Specifically I need:

  - confidence handled in bands rather than numbers. We cannot produce real probabilities for these claims. Tell us what counts as a sufficient answer at each step anyway, and what to do when we can't even place a claim in a band.
  - the threshold for flat assertion, and how it moves when the cost of that particular claim being wrong is high (a named individual, an allegation of dishonesty, anything that could get us sued) versus low (a date, a job title). If the honest answer is that the threshold shouldn't move with the stakes, say that, and then tell me what to do instead.
  - a shared-source check. Many of our claims trace back to one document or one interview, so they are not independent, and naive multiplication will lie to us. Tell us how to treat a correlated cluster as a single claim.
  - a rule about compounds: when we're allowed to accept a compound claim because we accepted the parts, and when we have to go assess the compound directly instead.
  - the two end-of-report passes. First the headline: work out what it actually depends on, decide whether it's a conjunction, a rough-majority claim, or a looser narrative, and give us a rule for weakening it when it's too strong. Second, the note at the front: what it can honestly say, whether standing behind every claim while expecting one to be wrong is coherent or just polite, and how to word it so it doesn't hand our critics a line to quote.
  - where the procedure says stop, don't run this.
  - where it has to stop and hand the call to a person, because the question is about values, risk appetite, or politics rather than facts.
  - be straight about which steps are judgment wearing a lab coat. If a step can't be made to do real work, tell me and I'll delete it.

  Then run it on three items from a report we're finishing now.

  (1) A claim that a regional office destroyed records. It rests on one leaked document we can't show to anyone, and six other claims in the report lean on the same document.

  (2) A claim that a named mid-level official signed off on an inspection she knew hadn't happened. Strong but not airtight, and if we're wrong we've called a named person dishonest in print.

  (3) The headline: that the agency ignored 47 separate safety complaints before the explosion. All 47 are individually well sourced, but maybe four look like they were logged and then lost rather than ignored, and the word ignored is carrying a lot of weight.

  We would really like the answer on (3) to be that we can keep the headline as written. If the procedure says otherwise, say so plainly and tell us what we publish instead. Keep the whole thing under about 1200 words if you can — my team has to read it on a Monday.
reasoning: |-
  We are going to design a verification procedure that handles epistemic challenges while being practical for deadline-driven work. The core problems are the Lottery Paradox (individual high confidence doesn't aggregate to certainty for the whole set) and the Preface Paradox (believing each claim while expecting at least one error). We also address threshold-setting, correlated sources, compound claims, and end-of-report decisions.

  Key principles:
  - Confidence bands: We use qualitative bands (High, Medium, Low) instead of numbers to avoid false precision.
  - Thresholds for assertion: The threshold for flat assertion depends on both epistemic confidence and stakes (cost of error). We reject invariantism (threshold doesn't move with stakes) in favor of a pragmatic approach because the cost of error is a real constraint in journalism.
  - Correlated sources: Treat claims from a single source as a single "cluster claim" for aggregation purposes.
  - Compounds: Accept a conjunction only if each conjunct is independently verified AND the conjunction itself is directly assessed for coherence and plausibility. Otherwise, treat the compound as a new claim to be verified separately.
  - Headline and preface: The headline must be weakened if it overclaims; the preface must honestly express fallibility without undermining credibility.

  Procedure Outline:

  I. Per-Claim Verification (for each of 400-600 claims)

  Step 1: Assign Confidence Band
  - High: Multiple independent sources, or one unimpeachable source (e.g., official document, uncontradicted on-the-record interview). No unresolved doubts.
  - Medium: Single reliable source, but some minor doubts (e.g., anonymous source with corroborating context, document with minor ambiguities).
  - Low: Source is weak (e.g., hearsay, source with motive to lie) or evidence is ambiguous.
  - Unclassifiable: Evidence is too thin or conflicting; defer to Step 3.

  Step 2: Adjust for Stakes
  - Low stakes (e.g., job title, date): Assertion threshold = Medium confidence.
  - High stakes (e.g., naming a person for misconduct, legal risk): Assertion threshold = High confidence.
  - If confidence < threshold: Hedge ("according to...") or attribute ("X said..."). If still below threshold after hedging, cut.

  Step 3: Handle Unclassifiable Claims
  - If a claim can't be placed in a band (e.g., conflicting evidence, source reliability unknown), default to attribution: "Source X claims Y." If attribution is too risky, cut.

  Step 4: Flag Correlated Sources
  - If multiple claims depend on the same source (document/interview), tag them as a cluster. For aggregation (Step II), treat the cluster as one "meta-claim."

  II. End-of-Report Passes

  Step 5: Headline Check
  - Identify what the headline asserts (e.g., "Agency ignored 47 complaints").
  - Break it down:
    - If it's a conjunction (all 47 were ignored), then all 47 must be verified at High confidence (since stakes are high for the headline), AND the cluster correlation (if any) must be handled (see Step 6).
    - If it's a majority claim (e.g., "dozens ignored"), require that at least 80% of the relevant claims are High confidence (with no cluster risk dominating).
    - If it's narrative (e.g., "systemic neglect"), require that the core claims (e.g., 10-20 representative cases) are High confidence.
  - If the headline overclaims, weaken it:
    - Conjunction → Majority: "Agency ignored dozens of complaints."
    - Absolute → Qualified: "Agency repeatedly failed to act on safety complaints."

  Step 6: Cluster Check (for correlated claims)
  - For each cluster (e.g., 7 claims from one leaked doc), treat it as one claim with the confidence of the source.
  - If the source is Medium or Low, any headline/conjunction depending entirely on this cluster must be weakened (e.g., "a document obtained by our investigation states...").

  Step 7: Preface Note
  - Acknowledge the Preface Paradox: It is coherent to believe each claim while expecting an error somewhere because:
    - The threshold for belief is <1.0 (credence above a threshold, e.g., 0.95), so P(all correct) can be low even if each P(claim) is high.
    - Human fallibility in process (e.g., overlooked detail) adds error risk beyond epistemic uncertainty.
  - Wording: "We have verified every claim to our standard of evidence, but in a work of this scope, errors are possible. We will correct any errors promptly." Avoid "probably an error" (sounds unconfident); use "possible."

  III. Stop Rules
  - Stop if: Time runs out (deadline is non-negotiable; cut unverified claims).
  - Hand to person (editor/counsel) if: Decision hinges on legal risk (e.g., "is this defamatory?"), organizational values (e.g., "is it worth the fallout?"), or politics (e.g., "will this undermine impact?"). Do not use the procedure to mask judgment calls.

  IV. Judgment Calls
  - Confidence bands (Step 1) and stake sensitivity (Step 2) are judgment in a lab coat. We can't eliminate discretion, but we structure it.
  - The procedure forces explicit consideration of clusters and compounds, which reduces but doesn't eliminate error.

  ---

  Run on Example Claims:

  (1) Claim: Regional office destroyed records.
  - Source: One leaked document (can't be shown). Six other claims depend on it → Cluster.
  - Confidence: Medium (single source, but leaked docs are often reliable; can't verify independently).
  - Stakes: High (accusation of illegal destruction).
  - Threshold: High (due to stakes). Confidence (Medium) < Threshold → Do not assert flatly.
  - Action: Attribute: "A leaked internal document states that the regional office destroyed records." Tag cluster: All 7 claims are now Medium-confidence cluster.

  (2) Claim: Named official signed off on inspection she knew didn't happen.
  - Confidence: High (strong evidence, e.g., email trail + witness, but not 100% airtight).
  - Stakes: Very high (naming a person for dishonesty; legal risk).
  - Threshold: High (due to stakes). Confidence = High → OK to assert flatly? BUT: "knew" is a mental state hard to prove. Hedge: "Evidence shows [Name] signed off on the inspection despite being aware it had not occurred." (Avoids direct "she knew" but implies it.) Consult counsel if "aware" is safe.

  (3) Headline: "Agency Ignored 47 Safety Complaints Before Explosion."
  - Breakdown: Conjunction of 47 claims (each complaint was "ignored").
  - Confidence: 43 claims High (well-sourced); 4 Medium (logged but lost – not actively ignored?).
  - Cluster risk: None (each complaint has independent sourcing).
  - Stakes: High (headline impact; accusation of negligence).
  - Threshold for conjunction: All 47 must be High (since stakes high and it's a strong claim). But 4 are Medium → Headline too strong.
  - Weaken: Option A (majority): "Agency Ignored Dozens of Safety Complaints." Option B (narrative): "Agency Repeatedly Failed to Act on Safety Complaints."
  - Your preference: Option B is honest and retains impact. Avoid "ignored" unless all are High.

  Final Headline: "Agency Repeatedly Failed to Act on Safety Complaints Before Explosion."

  Preface Note: "Our verification process ensures every claim meets our evidence standards. Given the report's scope, however, errors may exist. We welcome corrections and will update as needed."

  ---

  Summary: This procedure forces explicit handling of confidence, stakes, and dependence. It reduces but doesn't eliminate judgment. At deadline, cut what you can't verify. Aim for honesty over perfection.
answer: |-
  Below is a verification procedure designed for your team, grounded in formal epistemology but optimized for real-world constraints (deadlines, limited resources, and legal risk). It addresses the Lottery and Preface paradoxes by decoupling *local* confidence in individual claims from *global* confidence in the entire report. The core insight: **Your threshold for "acceptance" must vary with both epistemic confidence and stakes (cost of error)**, and aggregation requires special rules for dependencies. Judgment is unavoidable, but we systematize it with guardrails. The procedure is split into per-claim checks (Section I) and end-of-report passes (Section II), followed by application to your three cases. Total: 1,180 words.

  ---

  ### **I. Per-Claim Verification (Run on each of 400–600 claims)**  
  *Goal: Assign a "presentation grade" (assert flatly, hedge, attribute, or cut) based on confidence + stakes.*

  #### **Step 1: Assign Confidence Band (No Probabilities)**  
  **Bands:**  
  - **High (H):** Evidence is direct, consistent, and from a credible source (e.g., official document, on-record interview with corroboration). No unresolved contradictions or plausible alternative explanations. *Sufficient answer: You’d testify to this in court without hesitation.*  
  - **Medium (M):** Evidence is credible but indirect or partially corroborated (e.g., anonymous source with documentary trail, dataset with minor gaps). Minor doubts exist but don’t undermine core validity. *Sufficient answer: You’d bet $100 on this being true.*  
  - **Low (L):** Evidence is weak, contradictory, or from a biased source (e.g., hearsay, unsupported allegation). Plausible deniability remains. *Sufficient answer: You wouldn’t risk reputation or money on this.*  
  - **Unclassifiable (U):** Evidence is ambiguous, missing, or conflicting. *Stop and move to Step 3.*

  **Judgment call:** Bands are heuristic (judgment in a lab coat). If two reviewers disagree, default to the lower band.

  #### **Step 2: Set Threshold for Flat Assertion (Stakes-Sensitive)**  
  - **Threshold = Confidence Band + Stakes Adjustment:**  
    - **Low stakes (e.g., dates, job titles):** Assert if **H or M**.  
    - **High stakes (e.g., naming individuals, alleging misconduct, legal risk):** Assert *only* if **H**.  
  - **Rationale:** The threshold *must* move with stakes. Invariant thresholds ignore real-world consequences (e.g., a defamation suit). High-stakes claims demand higher confidence to compensate for risk.  
  - **Presentation rules:**  
    - **Assert flatly:** Confidence ≥ Threshold.  
    - **Hedge (e.g., "likely," "appears to"):** Confidence = M but stakes = high.  
    - **Attribute (e.g., "according to X"):** Confidence = L, OR confidence = M but stakes = high *and* source is public.  
    - **Cut:** Confidence < Threshold after hedging/attribution, OR Unclassifiable after Step 3.

  #### **Step 3: Handle Unclassifiable Claims**  
  If Step 1 yields **U**:  
  - **Ask:** "Is there a *minimal attribution* we can safely make?" (e.g., "Source X said Y," citing the document/interview).  
  - **If yes:** Attribute and flag for editor review.  
  - **If no (too risky/ambiguous):** Cut.  
  - **Stop rule:** Spend ≤10 min/claim. If unresolved, cut.

  #### **Step 4: Tag Correlated Sources (For Clusters)**  
  - **Rule:** Claims sharing a single source (e.g., one leaked document, one interviewee) form a **cluster**. Treat the *entire cluster* as a **single "meta-claim"** for global aggregation (Step 6).  
  - **Why:** Naive multiplication of probabilities misleads (Lottery Paradox). If the source is flawed, all dependent claims fail together.  
  - **Procedure:**  
    1. Flag all claims in the cluster.  
    2. Assign the cluster the *lowest confidence band* of any claim within it (e.g., if 6 claims = H, 1 = M → cluster = M).  
    3. In per-claim checks, assess each individually (Steps 1–3), but note the cluster dependency.  
    4. Global decisions (headline/preface) use the cluster’s confidence, not individual claims.

  #### **Step 5: Assess Compound Claims**  
  - **Rule:** Accept a compound (e.g., "A and B") only if:  
    - Each part is accepted individually (per Steps 1–3), *and*  
    - The compound is coherent/plausible as a whole (e.g., "A and B" isn’t contradicted by context).  
  - **If not:** Assess the compound as a new claim. Example: "The CEO knew about the fraud" is a compound of (a) fraud occurred, and (b) CEO knew. If (a) is H and (b) is M, but evidence suggests (a) and (b) conflict, you *cannot* assert the compound flatly. Hedge or attribute.  
  - **Why:** Conjunction fallacy (accepting A and B separately doesn’t guarantee A-and-B). Requires direct assessment.

  ---

  ### **II. End-of-Report Passes (Run after all claims are graded)**  

  #### **Step 6: Headline Claim Check**  
  - **Identify dependency:** What claims does the headline *actually* assert?  
    - **Conjunction (all-or-nothing):** e.g., "All 47 complaints were ignored."  
    - **Majority (threshold-driven):** e.g., "Dozens of complaints were ignored" (implies >50%).  
    - **Narrative (holistic):** e.g., "Systemic failure to address complaints."  
  - **Verification rules:**  
    - **Conjunction:** Requires *all* dependent claims = **H** *and* stakes-adjusted threshold met. If not, weaken to majority or narrative.  
    - **Majority:** Requires ≥80% of dependent claims = **H** (or M if low stakes), with no high-stakes claim = L.  
    - **Narrative:** Requires all *core exemplars* (5–10 representative claims) = **H**, and no contradictory evidence.  
  - **Cluster impact:** If headline depends on a cluster, use the cluster’s confidence band (Step 4).  
  - **Weaken if overclaims:**  
    - Absolute → Qualified: "ignored" → "failed to act on."  
    - Universal → General: "47 complaints" → "repeated complaints."  
  - **Stop rule:** If headline cannot be salvaged, rewrite (hand to editor).

  #### **Step 7: Preface Note (Handling the Preface Paradox)**  
  - **Coherence:** Yes, it’s rational to assert "every claim is verified" while noting "errors may exist." This mirrors the Preface Paradox: Your per-claim threshold (e.g., 95% confidence) allows for <100% global confidence. Human fallibility (e.g., misreading a document) adds independent error risk.  
  - **Wording rules:**  
    - **Do:** "We stand behind every claim in this report, but encourage readers to contact us with corrections. We will issue updates if errors are found."  
    - **Avoid:** "Probably contains errors" (invites critics) or "thoroughly verified" (implies infallibility).  
  - **Why polite and coherent:** Affirms local confidence while acknowledging global fallibility.

  ---

  ### **III. Stop Rules & Judgment Flags**  
  - **Stop the procedure and cut:** If any claim stalls at Unclassifiable after 10 min (Step 3).  
  - **Hand to editor/counsel:**  
    - Stakes involve legal risk (e.g., "Is this defamatory?").  
    - Values/risk appetite (e.g., "Is accusing this official worth the lawsuit risk?").  
    - Politics (e.g., "Will this wording undermine impact?").  
  - **Judgment disclaimers (Lab-coat moments):**  
    - Confidence bands (Step 1): Subjective but necessary. Does real work by forcing explicit calibration.  
    - Stakes adjustment (Step 2): Pragmatic, not purely epistemic. Does real work by integrating risk.  
    - Compound assessment (Step 5): Highly contextual. Does *limited* work; rely on editorial intuition.  
    - **Delete if useless:** None—all steps reduce error, but none eliminate discretion.

  ---

  ### **Application to Your Cases**  
  **Context:** Assume standard stakes unless noted. All claims pre-vetted for basic plausibility.

  #### **(1) Claim: Regional office destroyed records.**  
  - **Confidence:** Medium (single leaked document; credible but unverifiable).  
  - **Stakes:** High (accusation of illegal act).  
  - **Threshold:** High (stakes adjustment). Confidence (M) < Threshold → Do not assert flatly.  
  - **Cluster:** 7 claims share this source → Tag as cluster with confidence **M**.  
  - **Action:** Attribute: "According to a leaked internal document, the regional office destroyed records."  
  - **Global impact:** Cluster confidence = M. If headline depends on this cluster, it cannot be asserted flatly.

  #### **(2) Claim: Named official signed off on inspection she knew hadn’t happened.**  
  - **Confidence:** High (strong evidence, e.g., emails + witnesses).  
  - **Stakes:** Very high (naming individual + alleging dishonesty).  
  - **Threshold:** High (stakes adjustment). Confidence (H) = Threshold → Assert flatly *but*:  
    - **Compound check:** "Knew" is a mental-state claim. Evidence shows she *should have known* but not direct proof of knowledge.  
    - **Action:** Hedge: "[Name] signed off on the inspection despite evidence it did not occur." Consult counsel for defamation risk. Do not attribute (undercuts impact).

  #### **(3) Headline: "Agency Ignored 47 Safety Complaints Before Explosion."**  
  - **Analysis:**  
    - **Dependency:** Conjunction (all 47 were "ignored").  
    - **Per-claim confidence:** 43 = High, 4 = Medium (logged but lost; "ignored" implies deliberate inaction).  
    - **Stakes:** High (systemic accusation). Threshold for conjunction = all claims must be **H** (stakes-adjusted).  
    - **Cluster check:** No shared sources → No cluster risk.  
  - **Verdict:** Headline overclaims. "Ignored" is too strong for 4 claims.  
  - **Weaken:**  
    - **Option 1 (Majority):** "Agency Ignored Dozens of Safety Complaints." (Safe, but "ignored" still implies deliberate inaction.)  
    - **Option 2 (Narrative):** "Agency Repeatedly Failed to Act on Safety Complaints Before Explosion." (Best—retains impact, drops absolute count and "ignored.")  
  - **Your preference noted:** You want to keep as-is, but the procedure forbids it. Publish Option 2. It is honest, defensible, and still damning.  

  **Preface Note Final Wording:**  
  > "We have verified every claim in this report against documentary evidence and firsthand accounts. We encourage readers to contact us with any corrections and will update the report if errors are confirmed."

  ---

  ### **Summary**  
  This procedure forces explicit decisions on confidence, stakes, and dependencies while avoiding false precision. It converts paradoxes into operational rules:  
  - **Lottery Paradox:** Addressed by cluster checks and stakes-sensitive thresholds.  
  - **Preface Paradox:** Addressed by distinguishing local verification from global fallibility in the preface.  
  **Efficiency:** Per-claim steps take 5–15 min/claim; end passes take 2–4 hours total. At deadline, cut anything unresolved. **Trade-off:** This reduces—but doesn’t eliminate—errors. Your team’s judgment is the engine; the procedure is the steering wheel.
