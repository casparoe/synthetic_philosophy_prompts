prompt: |-
  My policy workshop has two people who've been going at it for a year over refugees and asylum, and I'm the one who has to make them produce a joint document instead of another round of position papers. Camp A thinks a state's duties to outsiders are basically remedial and bounded: obligations kick in from that state's own causal role in the displacement, plus a fair-share duty of rescue that gets capped by what it can absorb without failing its own people. Camp B thinks the claims of someone fleeing serious harm don't get weaker because of where they were born, so membership is at best an administrative fact about who can be charged with helping, not a moral one.

  Give me the document they should sign. First a numbered list of claims both can actually accept — substantive ones, not "everyone has dignity." I want them to say something real about whether the refugee/economic-migrant line tracks anything they both care about, and I want them to deal with a case neither of them has a clean answer to: people whose government or economy is slowly dismantling the conditions of a livable life — creeping land dispossession, aquifer collapse, wether or not you want to call it climate — so that nothing pinpointable has happened to them yet, but they obviously can't stay. Call them foreclosure claimants if you need a label. Then a table of the remaining disagreements, each row worded so the side holding it would sign it as stated. One row should be about the thing I think is actually the fight: whether you can settle who counts as a refugee first and then argue separately about who has to take them, or whether those are the same question asked twice. Then the cruxes, and for each one the case, argument, or pattern of evidence both would accept as bearing on it, with each camp's prediction written down. Make one crux about duty transfer — whether a state discharges its share by paying for resettlement somewhere else rather than admitting anyone. And if you think some slice of their dispute is verbal, say which slice and why.
reasoning: |-
  Okay, the user is running a policy workshop where two camps have been debating refugee and asylum policies for a year. They need to produce a joint document instead of more position papers. Camp A focuses on state responsibilities being remedial and bounded, tied to the state's causal role in displacement and limited by capacity to avoid failing their own citizens. Camp B sees claims of those fleeing harm as universal, with citizenship being administrative, not moral.

  The user wants a numbered list of shared substantive claims, not vague statements. They specifically want agreement on whether the refugee/economic migrant distinction matters and how to handle "foreclosure claimants" - people facing slow, systemic collapse like land dispossession or climate change, without a pinpointable event.

  Then, a table of disagreements, each row worded so each side would sign. One row must address whether refugee status and responsibility assignment are separate questions or intertwined. Cruxes should include evidence both sides accept, with each camp's predictions. One crux must cover duty transfer - paying for resettlement elsewhere instead of admission. Also, identify any verbal disputes.

  First, finding common ground. Both camps likely agree that states have some duties to refugees, that serious harm creates claims, and that states can't take unlimited numbers without self-harm. The refugee/economic migrant line: both might see it as a pragmatic tool but not morally decisive. For foreclosure claimants, both could accept that slow-onset crises create valid claims, even without a specific event.

  For disagreements: Core is whether refugee status is separate from responsibility assignment. Camp A sees them as distinct; Camp B as linked. Duty transfer: Camp A accepts paying others as fulfilling duty; Camp B sees admission as non-transferable.

  Verbal disputes: Terms like "bounded duties" or "administrative vs moral membership" might be interpreted differently. Clarifying these could reduce conflict.

  Structuring the response: First, the shared claims with numbering. Then a table of disagreements. Cruxes with evidence and predictions. Finally, notes on verbal disputes. Ensuring the document is actionable, with each part signed by both camps.
answer: |-
  Here’s a structured joint document designed to secure signatures from both camps, isolating genuine agreements, clarifying disagreements, and forcing empirical accountability on cruxes—including "foreclosure claimants" and duty transfer. The focus is on **actionable consensus** and **testable divergence**.

  ---

  ### **JOINT STATEMENT OF SHARED PREMISES**  
  *(Both Camps Affirm the Following Substantive Claims)*  

  1. **Serious Harm Triggers Claims**: All persons fleeing objectively severe harms (e.g., persecution, armed conflict, targeted violence, or catastrophic environmental collapse) possess a moral claim to assistance, irrespective of birthplace.  
  2. **States Bear Default Administrative Responsibility**: Absent exceptional circumstances, the first safe state receiving a claimant has the initial duty to assess their claim and provide temporary protection.  
  3. **Absorption Capacity is Relevant**: No state can be morally required to admit refugees at a scale that would predictably collapse its essential institutions (e.g., healthcare, housing, rule of law) or deprive its existing residents of basic rights.  
  4. **The Refugee/Economic Migrant Distinction Reflects Urgency, Not Worth**: Distinguishing refugees from economic migrants is pragmatically necessary to prioritize claims based on *immediacy of harm*, but it does not imply that economic migrants lack moral standing or that refugees’ claims are weakened by their origin.  
  5. **"Foreclosure Claimants" Warrant Protection**: Individuals displaced by slow-onset crises (e.g., climate-driven desertification, state-enabled corporate land-grabbing, or aquifer collapse) are entitled to protection if:  
     - Their homeland is becoming predictably uninhabitable within a foreseeable timeframe (e.g., <10 years);  
     - No meaningful domestic remedy exists;  
     - Their movement is demonstrably a last-resort adaptation.  
  6. **Causal Responsibility Intensifies Duties**: States materially contributing to displacement (e.g., via military intervention, destabilizing sanctions, or disproportionate carbon emissions) acquire heightened obligations to affected populations.  

  ---

  ### **TABLE OF PERSISTENT DISAGREEMENTS**  
  *(Each Row Worded for Unqualified Signature by the Relevant Camp)*  

  | Camp A Would Sign: | Camp B Would Sign: |
  |-------------------|-------------------|
  | "A state’s duty to refugees is bounded by its culpability for harm, its fair share of global rescue capacity, and its sovereign obligation to maintain baseline welfare for existing members." | "A refugee’s claim arises solely from their vulnerability to severe harm; a state’s duty to admit them is triggered by proximity or capability, but never negated by the refugee’s non-membership." |
  | "Refugee status determination (who is a refugee) and responsibility allocation (who must admit them) are distinct questions: the former is universal, the latter is contextual." | "Refugee status and responsibility cannot be separated: recognizing a person as a refugee entails a duty on capable/proximate states to offer sanctuary, not just assessment." |
  | "States discharge duties by funding third-country resettlement, provided the receiving state is safe and consents." | "Duties to refugees are non-transferable; states must admit them directly unless logistically impossible (e.g., wartime blockade). Funding others is supplementary, not substitutive." |

  ---

  ### **CRUXES: TESTABLE DISAGREEMENTS WITH PREDICTIONS**  
  *(Shared Frames for Evidence/Argument)*  

  1. **Crux: Can Duties Be Transferred?**  
     - **Case for Evidence**: A wealthy State X funds State Y (safe, lower cost-of-living) to resettle 10,000 refugees whom X would otherwise admit.  
     - **Shared Metric**: Refugee outcomes after 5 years (e.g., employment, social integration, trauma recovery) vs. outcomes in State X’s historical resettlement programs.  
     - **Camp A Prediction**: Outcomes in State Y will be non-inferior; refugees resettled via funding achieve equal welfare at lower cost, freeing X’s resources for other duties.  
     - **Camp B Prediction**: Outcomes in State Y will be inferior due to underfunding, cultural barriers, or lack of political will; refugees suffer second-class status.  

  2. **Crux: Does Membership Weaken Claims?**  
     - **Case for Evidence**: Identical twins flee persecution; one crosses into State A (wealthy, high-absorption capacity), the other into State B (poor, fragile institutions).  
     - **Shared Metric**: Whether State A’s duty to admit the twin is stronger than State B’s duty, and if so, on what grounds (citizenship ties? capacity? proximity?).  
     - **Camp A Prediction**: State A’s duty is stronger only if it caused the harm or has greater spare capacity—not due to the refugee’s non-membership.  
     - **Camp B Prediction**: Neither twin’s claim is weakened by birthplace; State A’s duty is stronger solely because it has more resources to fulfill the *same* duty.  

  3. **Crux: Is Slow-Moving Harm Equivalent to Persecution?**  
     - **Case for Evidence**: "Foreclosure claimants" from sinking coastal villages vs. refugees from active ethnic cleansing.  
     - **Shared Metric**: Whether both groups exhibit comparable levels of agency erosion, loss of livelihood, and psychological trauma.  
     - **Camp A Prediction**: Foreclosure claimants show lower urgency and greater adaptability; their claims warrant aid, not automatic asylum.  
     - **Camp B Prediction**: Both groups exhibit equivalent existential threats; distinctions are arbitrary and violate non-discrimination.  

  ---

  ### **VERBAL DISPUTE IDENTIFIED**  
  **The Term "Bounded"**:  
  - Camp A uses "bounded" to mean *duties are limited by causality/capacity*.  
  - Camp B hears "bounded" as *claims are diminished by borders*.  
  **Resolution**: Replace "bounded" with "conditioned by institutional feasibility and causal role" in joint texts.  

  ---

  ### **WHY THIS WORKS**  
  - **Substance Over Placation**: The shared premises (#4–6) force concessions: Camp A accepts non-culpable harm triggers claims; Camp B accepts capacity constraints.  
  - **Disagreements Framed Neutrally**: Each camp’s position is stated in their own terms but made falsifiable.  
  - **"Foreclosure Claimants" Addressed**: Both camps agree they’re protected (Premise #5), kicking the "how" to the testable duty-transfer crux.  
  - **Core Fight Isolated**: The table row on separating status/responsibility exposes the meta-conflict: is refuge a universal right or a contingent remedy?  

  This document transforms ideological sparring into a policy roadmap: act on shared premises now, design pilots to test the cruxes later.
