prompt: |-
  I'm on a standing electoral-law review commision for our region, which is basically the body that gets handed every proposal about who gets to vote and then has to send a recommendation to the legislature a few months later. We do this maybe two or three times a year, the recommendations are public and get picked apart in the local press, and half the members are lawyers and former councillors with no philosophy background at all — so whatever we use has to be runnable in a meeting, in plain language, without anyone looking anything up. The same three proposals keep coming back: lower the voting age (usually to 16, someone always floats 15), give the vote to non-citizens who've been living and working here for years (often local elections only), and make voting compulsory, at least in the weak sense of a modest fine for not turning up. And every single time we have the identical argument and split the identical way: some of us think the test is whether your life is materially shaped by the decisions, some think it's whether you're bound by the law and subject to coercion, some go on about competence and whether someone can form a view of their own, and the compulsory-voting people insist that compulsion is just what you do once you've got a franchise worth having. Nothing ever gets resolved.

  What I want is a procedure, not another position paper: the questions in order, what counts as an adequate answer to each one, where the procedure stops and returns a clear no, and where it has to hand the decision back to us as a values call we own instead of dressing up as a technical finding. It should be grounded in something better than 'balance the interests' — the thing I keep circling is that the all-affected idea (everyone whose interests are affected by a decision should have a say) is plainly too wide, since it seems to enfranchise tourists, trading partners and future generations and nobody wants that, while the 'you're subject to the law' test is too narrow in a way I can't quite articulate. My own half-baked suggestion, use it or bin it: what actually tracks my instincts is how costly it would be for someone to exit the jurisdiction — the people who can't leave without wrecking their lives are the ones who must be in on the decision, which would explain why a long-term resident non-citizen has a stronger claim than a citizen who moved abroad thirty years ago and can just stay away. Maybe there's a better variable and I'd rather have that than my hunch. Two more things I think but can't defend: (a) 'may they vote' and 'must they vote' are different questions, and even if someone has a claim to be allowed to vote you'd need a separate and stronger argument before you could fine them for staying home; (b) whether compulsion is defensible might depend on who else is already in the electorate — if the people who don't turn up are a systematically biased sample rather than a random one, compulsion seems to do something quite different. Tell me if either of those is confused.

  Then please run whatever you build on three cases: lowering the age to 16 for regional elections; votes for non-citizens of five years' residence, local elections only; and compulsory turnout with a small fine. I'm personally sympathetic to all three, so I'd like at least one of them to come out somewhere I don't like — don't just hand me my own politics back, and tell me honestly if the right response to an unwelcome verdict is to change my mind rather than patch the procedure. Also put it through the hard cases it would have to survive in real life: prisoners, people with advanced dementia, dual citizens who have never lived here, sixteen-year-olds who are also non-citizens, undocumented residents, people who moved away but kept the vote. And finish with what the procedure can't do: where it will misfire, what it stays silent about, and where we'd have to overrule it by hand. Please don't cite anything or point me at reading — it has to stand on its own in the room.
reasoning: |-
  Okay, the user is on an electoral-law review commission and needs a practical, step-by-step procedure to evaluate voting rights proposals. They're frustrated because the same arguments come up every time without resolution. Let me unpack their requirements.

  First, they want a clear sequence of questions with defined thresholds for "no" answers and explicit points where the commission must make a value judgment. They've already identified problems with the "all-affected" principle (too broad) and "subject to law" (too narrow). Their exit-cost idea is interesting but needs refinement.

  Key constraints: Must work in real-time meetings without references. Needs to handle three recurring proposals: voting at 16, non-citizen voting, compulsory voting. Should avoid regurgitating their own biases. Must withstand hard test cases.

  Their two insights seem valid: (a) voting rights ≠ compulsory voting - these require separate justifications; (b) compulsory voting's legitimacy depends on existing electorate composition. These should be incorporated.

  Now structuring the procedure: Need binary gatekeepers first to filter non-starters, then proportionality tests, finally value calls. Should start with the most objective criteria and escalate to normative judgments. The exit-cost concept can be adapted into a "bindingness" criterion - how inescapable are the laws for this group?

  For test cases: Must show where proposals fail, not just pass. For instance, 16-year-olds might clear all gates but compulsory voting could stumble on the coercion justification. Non-citizens might pass locally but not regionally due to differing impact scales.

  Hard cases will reveal edge conditions: Prisoners clearly have high exit costs but competence questions. Dementia patients fail competence thresholds. Diaspora citizens might pass early gates but fail proportionality.

  Finally, must explicitly list limitations: Can't resolve fundamental philosophy splits, assumes democratic baseline, doesn't address electoral systems. Commissioners will still need to exercise judgment when the procedure flags value decisions.

  The goal is to replace circular debates with a structured pathway that either disqualifies proposals or forces transparent value choices - no more faux-technical recommendations.
answer: |-
  Here's a step-by-step procedure designed for your commission: grounded, runnable in a meeting, forcing clear decisions or explicit value calls. It prioritizes thresholds over balancing, avoids infinite regress, and separates distinct questions.

  **The Core Principles Underpinning the Procedure:**
  1.  **Jurisdictional Bindingness First:** Voting rights are tied to being durably subject to the *coercive power* of a specific government body making the decisions being voted on. This addresses the "all-affected" overbreadth (tourists) and the "subject to law" underbreadth (long-term residents).
  2.  **Competence Threshold:** A minimal bar for understanding the act of voting and the nature of the authority.
  3.  **Proportionality of Impact:** Within the bound group, does the *magnitude and unavoidability* of the government's impact justify inclusion? This filters residual cases where bindingness alone seems insufficient.
  4.  **Compulsion is Separate & Demands More:** The right to vote does not imply the duty to vote. Compulsion requires distinct justification related to systemic dysfunction.
  5.  **Explicit Value Calls:** Where core principles conflict or reach their limit, the procedure flags it, forcing the commission to own the value judgment without technical pretense.

  **The Voting Rights Evaluation Procedure:**

  Ask these questions **in order**. Stop and return a recommendation if a clear "No" threshold is met. If you reach the end, a "Yes" requires a final value check.

  1.  **Bindingness to the Specific Jurisdiction:**
      *   *Question:* Is this person/group subject to the direct, routine, and non-trivial exercise of coercive state power (laws, regulations, enforcement, taxation, fines) by *this specific* government body (e.g., local council, regional assembly) holding the election, such that they cannot realistically avoid this subjection without incurring severe disruption to their core life?
      *   *Adequate Answer:* Concrete examples of relevant laws/powers enforced by *this* body that apply to the person/group (e.g., local taxes, local bylaws, local policing, local planning decisions impacting their residence/work).
      *   *Clear "No" Threshold:* If the person/group can easily reside elsewhere without major life disruption *and* avoid the jurisdiction's coercive power (e.g., short-term tourist, citizen living permanently abroad with no local ties, dual citizen never resident). **If "No", stop.** Recommendation: **No voting right.**
      *   *Value Call Flag:* None. This is the foundational gate.

  2.  **Minimal Competence:**
      *   *Question:* Does this person/group possess, or can they be reasonably presumed to possess, the basic cognitive capacity to understand the nature of the act of voting (choosing representatives/winners) and the nature of the governmental authority being elected?
      *   *Adequate Answer:* Evidence or reasonable societal presumption based on category (e.g., age-based presumptions, medical diagnoses, legal status). Focus is on *capacity*, not knowledge or wisdom.
      *   *Clear "No" Threshold:* Clear evidence of profound, permanent cognitive incapacity *at the time of registration/voting* (e.g., advanced dementia, severe permanent intellectual disability rendering understanding impossible). **If "No", stop.** Recommendation: **No voting right.** (Note: Temporary incapacity doesn't disqualify).
      *   *Value Call Flag:* Setting the *threshold* for "minimal competence." Is it basic understanding, or something more? (The procedure uses "basic understanding").

  3.  **Proportionality of Impact:**
      *   *Question:* Given their subjection to the jurisdiction's coercive power (Step 1), is the *magnitude and inescapability* of the impact of this specific government body's decisions on their core life circumstances (residence, livelihood, safety, essential freedoms) sufficient to warrant a direct voice, considering the foundational purpose of voting rights within a democracy?
      *   *Adequate Answer:* Argument linking specific powers/policies of *this* body to significant, unavoidable impacts on core aspects of life for this group (e.g., local council decisions directly affect housing, local environment, immediate safety for residents).
      *   *Clear "No" Threshold:* If subjection exists but the impact is demonstrably trivial, highly indirect, peripheral, or easily mitigated *for this specific group* relative to core residents. **If "No", stop.** Recommendation: **No voting right.**
      *   *Value Call Flag:* Determining what constitutes "sufficient" magnitude/inescapability. The commission must explicitly weigh the significance of the impact against the principle of franchise.

  4.  **Final Value Check (If all previous = Yes/Pass):**
      *   *Question:* Granting the vote to this group aligns with the principles above. Are there overwhelming, demonstrable practical harms to the *integrity or functioning* of the democratic process specific to including *this group* that outweigh the democratic principle established in Steps 1-3? (Burden of proof is HIGH).
      *   *Adequate Answer:* Specific, evidence-based arguments about systematic distortion, widespread fraud unique to the group, or fundamental incompatibility with core democratic processes – not just speculation or inconvenience.
      *   *Clear "No" Threshold:* If overwhelming, specific, non-speculative harm to democratic integrity/function is proven. **If "Yes" (harms outweigh), stop.** Recommendation: **No voting right.**
      *   *Value Call Flag:* Assessing the evidence and weight of alleged harms vs. the established franchise right. Requires explicit commission judgment.

  **Recommendation if all steps passed:** **Yes, voting right should be granted.**

  **Separate Procedure: Compulsory Voting (The "Must Vote" Question)**
  *   **Prerequisite:** The franchise for the relevant electorate must already be established as justified (using the procedure above).
  *   **Question 1 (Systemic Bias):** Is there clear, persistent evidence that non-voters in this jurisdiction are *not* a random sample of the eligible electorate, but instead represent a systematic skew (e.g., by socioeconomic status, age, geography) that demonstrably distorts policy outcomes away from the interests of the *entire* eligible electorate as established?
      *   *Clear "No" Threshold:* If turnout patterns are random or non-systematic, or if distortion isn't demonstrable. **If "No", stop.** Recommendation: **Do not implement compulsion.**
  *   **Question 2 (Least Restrictive Means):** Is a small fine the least restrictive means likely to effectively mitigate the identified systemic distortion? Have significantly less coercive measures (e.g., streamlined registration, multi-day voting, civic education) demonstrably failed or been deemed insufficient?
      *   *Clear "No" Threshold:* If less coercive measures haven't been tried/expanded, are likely sufficient, or the fine is demonstrably excessive/restrictive relative to the problem. **If "No", stop.** Recommendation: **Do not implement compulsion.**
  *   **Question 3 (Value Call - Coercion Justification):** Even if systemic bias exists and the fine is the least restrictive effective option, does the commission believe the benefit of mitigating this specific distortion justifies the coercive power of the state compelling participation in the foundational act of voting?
      *   *No Clear Threshold:* This is inherently a value judgment about the state's power vs. individual liberty in the context of democracy. **Explicit Commission Vote Required.**

  **Recommendation if all steps passed:** **Yes, implement compulsory voting with a small fine.**

  ---

  **Running the Test Cases:**

  1.  **Lower Voting Age to 16 (Regional Elections):**
      *   Step 1 (Bindingness): 16/17-year olds residing in the region are subject to regional laws (e.g., education, youth justice, some aspects of healthcare/transport). Cannot easily leave without severe disruption (still in school, dependent). **Pass.**
      *   Step 2 (Competence): Presumed minimal competence (understanding voting/authority) exists for the vast majority of 16/17-year-olds. **Pass.**
      *   Step 3 (Proportionality): Regional decisions (education, transport, environment) have significant, unavoidable impact on their immediate lives and future prospects. **Pass.**
      *   Step 4 (Value Check): No overwhelming evidence of unique harm to democratic integrity. Arguments about maturity are value-based, not harm-based. **Pass.**
      *   **Procedure Recommendation: YES, grant vote at 16 for regional elections.** (Value call on maturity threshold was incorporated in Step 2).

  2.  **Votes for Non-Citizens, 5+ Years Residence (Local Elections Only):**
      *   Step 1 (Bindingness): Long-term residents (5+ yrs) are subject to local coercive power (council tax, local bylaws, planning, local policing). Cannot easily leave without severe disruption (home, job, family, community ties established). **Pass.**
      *   Step 2 (Competence): Presumed minimal competence exists (same as adult citizens). **Pass.**
      *   Step 3 (Proportionality): *Crucial Step.* Local council decisions directly impact their residence, immediate environment, local services they use daily, and community safety – core life aspects. Impact is significant and unavoidable for someone embedded locally. **Pass.**
      *   Step 4 (Value Check): Arguments about loyalty or citizenship are value-based, not evidence of harm to democratic *integrity/function*. **Pass.**
      *   **Procedure Recommendation: YES, grant local vote to non-citizens with 5+ years residence.** (The jurisdictional scope "local elections only" aligns perfectly with the impact assessed in Step 3).

  3.  **Compulsory Turnout with Small Fine:**
      *   *Prerequisite:* Assume the existing franchise is justified (per procedure).
      *   Question 1 (Systemic Bias): Does evidence show non-voters are systematically skewed (e.g., poorer, younger, certain ethnic groups) leading to distorted local/regional policy? *This is highly context-dependent.* If YES, proceed. If NO or UNCLEAR, **Recommendation: NO compulsion.** (This is where it might stop for you).
      *   Question 2 (Least Restrictive Means): Have robust alternatives (e.g., vote-by-mail, weekend voting, automatic registration) been fully implemented and failed? If NO, **Recommendation: NO compulsion.** If YES, proceed.
      *   Question 3 (Value Call - Coercion): Commission must vote: Does the benefit of correcting the proven bias justify forcing people to vote under threat of fine? **No procedure answer. Explicit Commission Judgment Required.**
      *   **Procedure Outcome:** Highly contingent on evidence of bias and failure of alternatives. Likely forces a hard value call (Question 3) *if* bias is proven and alternatives exhausted. **Unlikely to give a simple "Yes" without commission debate.**

  ---

  **Hard Case Evaluation:**

  *   **Prisoners (Incarcerated within jurisdiction):**
      *   Step 1: Highly bound (subject to prison rules, laws). Cannot leave. **Pass.**
      *   Step 2: Presumed competent (unless individual assessment shows otherwise). **Pass.**
      *   Step 3: Government decisions (sentencing policy, parole, prison conditions, rehabilitation funding) impact them profoundly and unavoidably. **Pass.**
      *   Step 4: Argument: "Punishment includes loss of vote." Counter: This is a value argument, not proof of harm to *democratic integrity*. Disenfranchisement *is* the harm. Procedure likely **Recommends YES**, forcing a value confrontation at Step 4 if opponents cite "civic death" as harm.
  *   **Advanced Dementia:**
      *   Step 2: Clear lack of minimal competence (understanding voting/authority). **Stop. Recommendation: NO vote.** (Individual assessment basis).
  *   **Dual Citizens Never Lived Here:**
      *   Step 1: Not subject to routine coercive power of local/regional government. Can easily avoid. **Stop. Recommendation: NO vote.**
  *   **16-Year-Old Non-Citizen (Local Res):**
      *   Run both procedures. Likely passes Steps 1-3 for local vote (Bound locally, competent, local impact significant). **Recommendation: YES for local vote.**
  *   **Undocumented Residents:**
      *   Step 1: Subject to local coercive power (police, bylaws, de facto use of services) and cannot leave without severe disruption (fear, ties). **Pass.** (Controversial, but meets criterion).
      *   Step 2: Presumed competent. **Pass.**
      *   Step 3: Local decisions impact their residence, safety, environment unavoidably. **Pass.**
      *   Step 4: Argument: "Illegal status." Counter: This is a legal status, not proof of harm to *democratic process*. Risk of deterring reporting crime? Needs evidence. **Likely passes to Recommendation: YES (local)**, forcing a Step 4 value call on legality vs. subjection.
  *   **Citizen Moved Abroad Permanently (Kept Vote):**
      *   Step 1: Not subject to routine coercive power of local/regional government. Can avoid easily. **Stop. Recommendation: NO vote (for local/regional).** (Procedure challenges diaspora voting).

  ---

  **What the Procedure CANNOT Do (Limitations):**

  1.  **Resolve Foundational Philosophy Splits:** It structures the debate using Bindingness/Impact/Competence but can't *prove* these are the "right" principles. Commissioners who reject these starting points will still dissent.
  2.  **Define "Severe Disruption" or "Core Life" Precisely:** These require contextual commission judgment (Step 1 & 3).
  3.  **Set the Exact Competence Threshold:** Relies on societal presumption or evidence (Step 2). Debate on *where* to set the age line remains a value call *within* Step 2.
  4.  **Prove Systemic Bias or Failure of Alternatives (Compulsion):** Requires good data and honest assessment by the commission.
  5.  **Determine the "Right" Level of Government:** Why local but not regional for non-citizens? The procedure assesses impact *per jurisdiction* but can't define jurisdictional borders.
  6.  **Eliminate Value Judgments:** It forces them into specific, flagged steps (Proportionality Sufficiency, Final Harm Check for rights; Coercion Justification for compulsion) instead of letting them hide. **You will still have to vote on values.**
  7.  **Address Electoral System Design:** First-Past-the-Post vs. PR, etc., is outside its scope.
  8.  **Guarantee "Good" Outcomes:** It provides a structured, principled *process*, not an infallible answer. An ill-intentioned commission could manipulate evidence (e.g., denying systemic bias).

  **Why an Unwelcome Verdict Might Be Right:** If the procedure consistently gives you answers you dislike (e.g., recommending prisoner voting, questioning diaspora voting, rejecting compulsion due to lack of bias evidence), it likely means your *instincts* (e.g., emphasizing citizenship or civic duty more than subjection/impact) are in tension with the Bindingness/Impact principles embedded here. The procedure forces you to confront whether those instincts should override the subjection/impact logic, requiring a clearer articulation and defense of the *alternative* principle (like formal citizenship or reciprocity) as primary. It doesn't make you wrong, but it demands justification at the flagged value steps. Patching the procedure to get desired outcomes undermines its purpose; better to own the value choice explicitly.

  This procedure provides a concrete sequence, clear stopping points ("No"), forces evidence for harms, separates distinct questions (May Vote vs. Must Vote), and flags where values must dominate. It should make your meetings more focused, transparent, and decisive, even if consensus remains elusive on some value calls.
