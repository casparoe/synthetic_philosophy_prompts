prompt: |-
  Hi — I've got a slightly odd job and I need something I can actually use day to day.

  I'm the only trained historian on a small team that produces the interpretive material for heritage sites and walking trails across one English county: panels of about ninety words, audio stops, the occasional small exhibition. We turn out roughly fourty items a year. I get around three days of research per item, two weeks at most for anything bigger, and everything has to be signed off by a community liaison officer and then by our trustee commitee. Most of the drafting is done by two junior researchers with history BAs who've never done any theory and don't especially want to.

  The argument we keep having is the old one between history-from-below / microhistory and the history of elites and states — except we have it in a form where somebody has to decide what goes on a panel by Friday. We've shipped both failure modes. One: the item that is basically the archive of the state talking — a mayor, a charter, an act of parliament, a regiment — with the assumption quietly baked in that the document is the event and that its own categories are the categories the people involved used. Two: the item that is one vivid person and a lot of atmosphere, where the vividness is doing all the argumentative work and a single life is being made to carry a claim about ordinary people that it can't carry.

  So: write me a decision procedure my team can run on a proposal. The questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the question is one of values rather than facts. It needs to be runnable by the juniors in half a day, so rule out anything that depends on months of archival digging, and tell me honestly which steps are judgement calls wearing a lab coat.

  The hard cases it has to handle, because these are the ones that actually come up:

  - The only reason we know a non-elite person's name at all is that a bureaucracy wrote it down for its own purposes — an assize file, a poor-law removal order, a workhouse admission book, a militia list, a tithe map. When is that fatal to the item, when is it survivable, and what has to go on the panel in each case?
  - We almost never know how many other people lived like the one person we happened to find, so "typical" is usually unavailable to us. Which claims does that block, and which claims (if any) survive it? I want this nailed down, because it's the objection I can never answer when a trustee pushes back.
  - Proposals that arrive already framed as celebration: a civic anniversary, a benefactor, a regiment, a great man the town is proud of. Is there a version of the procedure that lets us say yes without lying, and what has to change on the panel if so?
  - Genuinely silent subjects, where the honest panel would be about an absence rather than a person. I don't want the absence turned into a sentimental victim-story either.
  - Scaling: when does a close-up of one household license a sentence about the county, and when does it only license a sentence about that household?
  - A reverse check on me personally. I was trained on policy and state papers, I find elite sources much easier to work with, and I'm slightly suspicious that microhistory is anecdote with footnotes. I want the procedure to catch me defaulting to the sources that are convenient rather than the ones that are right.

  Then run it on three live ones.

  1. An 1840s assize file and a parish relief roll that name the same woman, convicted of stealing bread, plus a bit of local newspaper coverage. I want a panel about hunger and crime in the valley.
  2. A near-complete run of diaries from a tenant farmer, 1867–1901, with rent books and a letter book. The obvious pitch is "the voice of the rural poor" and I don't trust it.
  3. The town council and the local branch of a veterans' association want a mural commemorating the Victorian mayor who paid for the library and the reading room. He was also the magistrate who sentenced the woman in item 1, and we've just found that out.

  At least one of those should come out with an answer I won't like — tell me plainly which one and why rather than softening it, since I'll have to defend it to the council either way.

  Please write it in British English, and give me something I can hand to a twenty-two-year-old on a Tuesday morning, not an essay for me to admire. Finish by saying what the procedure can't do: the situations where it'll misfire, and where it risks giving us false confidence.
reasoning: |-
  Okay, let me unpack this historian's request. They're leading a small heritage team producing interpretive materials under tight constraints - three days research per item, junior staff without theory background, and multiple approval layers. The core problem is balancing elite vs grassroots history approaches without falling into predictable traps.

  Hmm, they've identified two failure modes: state-document-as-reality bias and overreaching from single vivid lives. The real challenge is operationalizing this into a practical checklist. The junior staff need something they can apply quickly, but it must handle specific tricky cases like bureaucratic records of the poor, typicality claims, celebratory framing, and silent subjects.

  The historian's self-awareness about their elite-source bias is interesting - they want the tool to catch their own defaults. And the three test cases are perfectly chosen to stress-test any procedure: a hungry bread-thief, a "voice of the poor" farmer, and a problematic mayor.

  Right, the solution needs to be:
  - Action-oriented (British English, Tuesday-morning usable)
  - Step-by-step with clear exit ramps
  - Honest about what's judgment vs rule
  - Tested against their live cases
  - Self-limiting about its own scope

  For the decision procedure itself... I'm thinking five core questions that flow logically:
  1. Source interrogation first (who created this and why?)
  2. Representativeness assessment (what can we actually claim?)
  3. Framing check (is this celebration distorting things?)
  4. Scale calibration (household to county claims)
  5. Counterbalance test (what's missing?)

  Each needs unambiguous pass/fail thresholds except where values come in. For the hard cases:
  - Bureaucratic records: fatal only if we don't acknowledge their power lens
  - Typicality: blocks generalizations but allows "this happened" + context
  - Celebrations: require complicating context
  - Silent subjects: can do absence without victimhood by focusing on structures
  - Scaling: household only licenses county claims if backed by wider studies

  The test cases will be revealing. That mayor case (#3) might be the one they dislike - we can't whitewash him. Better to show the procedure working impartially than soften blows. Final step: explicitly list where this tool fails (complex causation, recent trauma etc) so they know its limits.

  This feels like stitching methodology into workflow - exactly what their team needs to move beyond those two failure modes. The checklist format should make the historical thinking visible without requiring theory degrees.
answer: |-
  Here’s a field-tested decision procedure for your team. Print it, laminate it, and run every proposal through it. Uses **bold** for critical checks.

  ---

  **HISTORY INTERPRETATION DECISION PROCEDURE**  
  *(Run in order. Stop at first "NO". "JUDGEMENT" = team discussion needed.)*

  **1. SOURCE INTERROGATION**  
  *Ask: Who created this source? Why? What power did they hold?*  
  - **SUFFICIENT ANSWER:** Explicitly names the creator’s position/perspective AND their purpose (e.g., "Magistrate’s court record, designed to punish poverty").  
  - **FATAL FAILURE:** Source treated as neutral/impartial.  
  - **SURVIVABLE IF:** Panel **directly states** the source’s bias/purpose (e.g., "We only know Mary’s story because the Poor Law authorities recorded her removal").  
  - **JUDGEMENT:** Deciding *how* to phrase the bias.  

  **2. CLAIM CHECK**  
  *Ask: What claim is being made? What’s the evidence? Can we say "this happened" or "this existed" without claiming "this was typical"?*  
  - **SUFFICIENT ANSWER:** Claim matches evidence scale:  
    - ✅ "This happened" (e.g., "Mary stole bread in 1842")  
    - ✅ "This existed" (e.g., "The workhouse system punished poverty")  
    - 🚫 **BLOCKED:** "People like Mary typically..." / "The rural poor felt..." (unless backed by wider study).  
  - **FATAL FAILURE:** Using one life for group claims without proof.  
  - **SURVIVABLE IF:** Add context like "While we don’t know how common this was, national records show..." (cite a stat).  
  - **JUDGEMENT:** Whether context source is credible/relevant.  

  **3. FRAMING AUDIT**  
  *Ask: Is this proposal framed as celebration? If yes, what’s omitted?*  
  - **SUFFICIENT ANSWER:** Celebration proposals **must add complicating context** (e.g., "He funded the library, but as magistrate he sentenced hungry people to transportation").  
  - **FATAL FAILURE:** Pure hagiography (uncritical praise).  
  - **SURVIVABLE IF:** Panel reframes as "complex legacy" (e.g., "This anniversary invites us to discuss who benefited from his actions—and who didn’t").  
  - **JUDGEMENT:** Whether context is proportional/relevant.  

  **4. SCALE TEST**  
  *Ask: Does moving from micro to macro require a leap?*  
  - **SUFFICIENT ANSWER:**  
    - Household → County: **Only if** supported by regional/national study (e.g., "John’s farm accounts reflect the national agricultural depression").  
    - Otherwise: "John’s experience shows..." NOT "Farmers suffered...".  
  - **FATAL FAILURE:** Unsupported scaling.  
  - **JUDGEMENT:** Whether supporting source is strong enough.  

  **5. SILENCE HANDLING**  
  *Ask: Are we discussing an absence?*  
  - **SUFFICIENT ANSWER:** Focus on **structures causing silence** (e.g., "No enslaved people’s voices survive here; this panel is about the system that silenced them").  
  - **FATAL FAILURE:** Inventing emotions/stories ("They must have felt...").  
  - **JUDGEMENT:** Choosing which structure to highlight (law, literacy, etc.).  

  **6. COUNTERBALANCE (Your bias check)**  
  *Ask: Have we used ONLY elite sources? If yes, is there ANY non-elite trace?*  
  - **SUFFICIENT ANSWER:** Either:  
    - ✅ Non-elite source used, OR  
    - ✅ Elite source critiqued (per Step 1), OR  
    - ✅ Panel admits the gap ("We see this through the council’s minutes; we lack other perspectives").  
  - **FATAL FAILURE:** Elite source treated as objective.  

  ---

  **TESTING LIVE CASES**  
  *(Using procedure above)*

  **CASE 1: Bread thief (1840s)**  
  - Step 1: Pass (State sources named as biased: "court/poor law records punish her").  
  - Step 2: Pass ("Mary stole bread; this was one response to hunger" – not "typical").  
  - Step 3: N/A (Not celebratory).  
  - Step 4: Pass ("Hunger crimes occurred in this valley" – supported by newspaper/relief roll).  
  - Step 5: N/A.  
  - Step 6: Pass (Uses assize/poor law but critiques them).  
  **VERDICT: ✅ APPROVED**  
  *Panel must:* State source bias, avoid "typical poor woman".  

  **CASE 2: Tenant farmer diaries (1867–1901)**  
  - Step 1: Pass (Diaries are a personal record).  
  - Step 2: **FAIL** 🚫 "Voice of the rural poor" implies representativeness. One farmer ≠ all poor.  
  **VERDICT: ❌ REJECT** (at Step 2)  
  *Fix:* Reframe as "One farmer’s experience" + add context (e.g., "Census data shows 60% of locals were labourers—a group whose diaries rarely survive").  

  **CASE 3: Mayor’s mural (Celebratory + sentenced Case 1 woman)**  
  - Step 1: Pass (Council/veterans as celebrators).  
  - Step 2: Pass (Facts: funded library, was magistrate).  
  - Step 3: **JUDGEMENT** 🟡 Celebration requires complicating context.  
  - Step 4: N/A.  
  - Step 5: N/A.  
  - Step 6: Pass (Uses multiple sources).  
  **VERDICT: ✅ APPROVED (with conditions)**  
  *Panel must:* Frame as complex legacy. Add: "As magistrate, he sentenced Mary X (see Panel 5) for stealing bread. His charity had limits."  
  *(You won’t like this – trustees/veterans may object. But procedure forces honesty.)*  

  ---

  **WHAT THIS CAN’T DO (WARN YOUR TEAM):**  
  1. **Solve value conflicts:** Trustees hate complication? The procedure flags it (Step 3), but you’ll still argue.  
  2. **Replace expertise:** It catches crude errors, not subtle misreadings.  
  3. **Handle recent trauma:** Silent subjects (Step 5) risk offence if communities disagree on "absence".  
  4. **Fix bad sources:** If archives are pure elite bias, Step 6 forces acknowledgement – but won’t magic up new sources.  
  5. **Prevent "gaming":** A determined junior can tick boxes dishonestly. Spot-check their reasoning.  

  **Final note:** The messy "judgement" steps? That’s history. This turns unspoken debates into documented choices. Use it Monday morning.
