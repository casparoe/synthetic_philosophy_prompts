prompt: |-
  I write novels (two out, third one due next spring) and the book I'm on has a trading people whose language makes you mark, on every past-tense verb, whether you saw the thing, were told it, or worked it out yourself. I keep reaching for Whorfian stuff — with this grammar they'd be scrupulous about sources, hopeless at rumour, maybe they can't even lie about where they got something — and I genuinely can't tell which of these is the real thing and which is the crappy pop-science version (I gather the famous "no word for time" claim was overstated, which is roughly my level here). So give me a procedure I can run on each idea: five minutes, no linguistics background, something that keeps whatever actually survives in the linguistic-relativity literature and bins the rest. The rule I've been half-using is the "cost test": a grammar difference earns it's place in the story only if I can point to a moment where it costs a character something — a beat of hesitation, a missing word, a social blunder — and never if it makes a thought impossible. Fix it or replace it, but I need to be able to run it on the thirty-odd ideas I've got banked before the ms goes to my editor, who reads for plausibility and will axe anything that smells like a parlour trick. Apply it to three: (a) a scene where one of them tells a flat lie about where her information came from; (b) a scene where one of them can't get his head around a ship that's due next season possibly not arriving; (c) compulsory gender marking making them all think of a particular bridge as a woman. I'd bet you're going to tell me to cut (a) and (c), and I won't be happy about (a). Also tell me where the procedure has to hand the decision back to me because it's a judgment about the story rather than about language, and be straight about what it can't do — including whether it can say anything at all about the English prose itself, since I'm writing these peoples' thoughts in English.
reasoning: |-
  Okay, the user is a novelist working on their third book. They've created a fictional culture with a language that marks the source of information on past-tense verbs—whether the speaker saw it, heard it, or inferred it. They're trying to avoid linguistic clichés like the overstated Whorfian claims (e.g., Eskimo words for snow) and want a quick method to evaluate their ideas. They mentioned a "cost test" where grammar differences must cause tangible problems for characters. They provided three scenarios: lying about information sources, difficulty with future uncertainty, and gendered bridges. 

  First, I need to address their request for a procedure. They want something efficient—five minutes per idea, no linguistics background required. The key is focusing on cognitive load and habit, not impossibility. The cost test they're using is solid, but it needs refining to align with real linguistic relativity research. The core of modern linguistic relativity is that language influences habitual thought and attention, not that it makes certain thoughts impossible. 

  Looking at their three scenarios:
  For (a) lying about information sources: The user suspects this might be problematic, but they're attached to it. Lying isn't impossible; it's just harder. The character would need to fabricate a plausible source, which adds cognitive effort. That fits the cost test—showing hesitation or over-explanation makes it believable. The user's intuition here is correct; they should keep it but highlight the struggle.

  For (b) difficulty with future uncertainty: This feels like a stretch. The grammar marks past events, not future ones. Unless their language has specific future-tense markers that conflict with uncertainty, there's no reason they'd struggle with "maybe the ship won't come." This is likely a pop-science trope. Advising to cut it unless they can tie it to a cultural, not linguistic, habit.

  For (c) gendered bridges: Grammatical gender doesn't make speakers anthropomorphize objects. Studies show it might cause slight associations (e.g., "bridge" = feminine in Spanish leading to "pretty" descriptions), but not conscious gendering. If the character thinks of the bridge as female due to language, that's overkill. Instead, maybe they default to "she" pronouns or use feminine adjectives, which could be a subtle nod without being literal. The user could imply it through language quirks in English prose.

  The user also asked about the procedure's limitations. It can't judge story value—only linguistic plausibility. For example, keeping scenario (a) works linguistically, but if the editor thinks it's contrived, that's a narrative call. Also, the procedure can't handle English prose directly; it can only suggest workarounds like using descriptive verbs ("she recalled," "he guessed") to imply the source marking without explicit grammar.

  Underlying needs: The user wants authenticity without clichés. They’re wary of pop linguistics but need tangible cultural details for world-building. They might fear their ideas are too tropey, especially after the "Eskimo time" myth they mentioned. Reassuring them that cognitive cost (hesitation, effort) is key, not constraints on thought. They also need clear, actionable feedback to revise efficiently before their deadline.

  Final thoughts: The user’s cost test is a great starting point. Emphasize that linguistic differences cause friction, not barriers. Scenarios (a) stays, (b) goes, (c) gets tweaked. Highlighting where the procedure hands back judgment—like whether a subtle gender association enhances the story—is crucial. They’re creative; they’ll know how to weave it in meaningfully.
answer: |-
  Here's a battle-tested procedure designed for your **5-minute, no-linguistics-background, "surviving linguistic relativity" filter**, built on your excellent "cost test" principle and focused on what modern research supports:

  **The "Friction & Habit" Filter (Run this on each idea):**

  1.  **Define the Grammatical Feature:** Clearly state the specific grammatical rule (e.g., "Mandatory evidential marking on past-tense verbs: visual/sensory, reported/hearsay, inferred/reasoned").
  2.  **Ask: Does it make thought *impossible* or just *habitually different/harder*?**
      *   **If Impossible (e.g., "They literally cannot think about X"):** **BIN IT.** Modern relativity shows language doesn't create cognitive prisons.
      *   **If Habitually Different/Harder:** **Proceed.**
  3.  **Identify the Friction (The Cost):** *Precisely* what cognitive or social effort does this create? Is it:
      *   **Attention:** Do speakers *habitually pay more attention* to this category (e.g., sources of information, object genders) because their language forces them to encode it? (Strongly supported)
      *   **Recall:** Are they slightly better/faster at *recalling or categorizing* things based on this linguistic habit? (Moderately supported for some domains).
      *   **Processing Load:** Does using the "wrong" form require *mental gymnastics* (hesitation, error) or *social correction*? (Very plausible for mandatory features).
      *   **Pragmatic Effort:** Does communicating effectively require *extra steps* to provide expected information, or does *miscommunication* easily arise if the form is omitted/misused? (Highly plausible).
  4.  **Apply the Cost Test:** Can you point to a *specific moment* in your scene/story where this friction manifests as a tangible cost? (Hesitation, misunderstanding, social gaffe, needing extra words, making an inference error based on habit).
      *   **Yes, clearly:** KEEP. This is the gold.
      *   **No, or it's vague:** BIN or SIGNIFICANTLY REWORK. If you can't find the friction *in the narrative*, it's likely unsupported pop-science.
  5.  **Check for Overreach:** Is the effect *directly tied* to the linguistic habit (steps 2-4), or is it being used to explain unrelated cultural beliefs/practices? **Language influences habit and attention; it doesn't *determine* culture or deep belief systems on its own.** Keep the connection tight.

  **Applying the Filter to Your Scenarios:**

  *   **(a) Lying about information source:**
      *   **Impossible?** No. Lying is universal.
      *   **Friction/Cost?** **HIGH.** Lying *effectively* about the source requires *extra effort*:
          *   They must *consciously fabricate* a plausible evidential context ("I saw it" instead of "I inferred it").
          *   This is cognitively harder than just lying about the fact itself. They might hesitate, over-explain the fake source, or accidentally slip into the truthful evidential marker under stress.
          *   Getting caught *might be easier* because misuse of evidentials is a direct signal of deception or confusion.
      *   **Cost Test:** **PASSES.** Show the liar *struggling* to pick the right false evidential marker, or hesitating before adding "I saw it with my own eyes..." unnecessarily, or being caught *because* they used the inferential marker when claiming direct sight. **KEEP (this is actually strong).**
  *   **(b) Can't grasp "ship might not arrive":**
      *   **Impossible?** Sounds like "impossible" territory. Bin immediately. No grammar prevents probabilistic or counterfactual thought. Futures are inherently uncertain in all cultures.
      *   **Friction/Cost?** *Maybe* a *different focus*. Does their language heavily mark future certainty/uncertainty? If not (your feature is *past* evidentials), this has **NO LINGUISTIC BASIS**. It's pure pop-science determinism.
      *   **Cost Test:** **FAILS.** Unless you invent a *completely different* grammatical feature (like mandatory future certainty marking), this doesn't track. **BIN IT.**
  *   **(c) Bridge as a woman due to gender marking:**
      *   **Impossible?** No. They know it's a bridge.
      *   **Friction/Cost?** **Subtle Habit/Attention.**
          *   They *habitually* classify the bridge with feminine grammar (articles, adjectives, pronouns).
          *   This *might* lead to a *slight tendency* to use more stereotypically feminine metaphors *if asked to describe it poetically* (research shows small effects like this).
          *   It does **NOT** mean they consciously think "this bridge is female" or imbue it with womanly traits. The association is weak and implicit.
      *   **Cost Test:** **TRICKY.** What's the *cost*?
          *   *Low Cost:* A character *automatically* uses "she" for the bridge in their internal monologue (reflecting the grammar), or uses a slightly feminine adjective ("the graceful bridge" if feminine adjectives tend that way). This is plausible friction from the *language habit*.
          *   *High Cost/Pop-Science:* Characters *deeply believe* the bridge *is* female, worship it as a goddess, or think it behaves like a woman. This is **overreach**. Language gender doesn't cause this.
      *   **Verdict:** **KEEP ONLY THE LOW-COST VERSION.** Show the *linguistic reflex* (using "she"), not deep anthropomorphism *caused by* the grammar. The bridge's "gender" should be a trivial linguistic fact to them, not a profound belief.

  **Where the Procedure Hands the Decision Back to You (Judgment Calls):**

  1.  **Degree of Friction:** *How much* hesitation? *How* big a social blunder? This impacts pacing and tone. The filter confirms plausibility, not narrative impact.
  2.  **Cultural Amplification:** Does the linguistic habit *interact* with deep cultural beliefs? (e.g., Perhaps because sources *are* marked, *cultural norms* place extreme value on first-hand knowledge, making hearsay socially costly. The language enables/reinforces the norm, but doesn't *create* it alone). You decide how tightly to weave language and culture.
  3.  **Subtlety vs. Obviousness:** How overt should the friction be for the reader? The filter ensures plausibility, but you choose how prominently to feature it.
  4.  **"English Prose" Problem:** This is crucial. The filter **CANNOT** directly solve how to represent their thoughts in English. However, it guides the *kind* of friction you need to imply:
      *   **Show, Don't Tell (the Grammar):** Don't write "She used the inferential evidential..." in their POV. Instead:
          *   Use verbs/adverbs: *she reasoned, he recalled, she guessed, apparently, evidently, so I gathered.*
          *   Show hesitation/effort: *He paused, searching for the right way to frame it... "So... everyone says the ship sank?"*
          *   Show pragmatic effects: *"But did you *see* the fire?" Kael pressed, unsatisfied with her vague "it must have spread".*
      *   **For Gender:** Consistently use the English pronoun matching their grammatical gender ("the bridge... she stood firm") *in narration from their POV*. This is the most direct way to show the linguistic habit impacting their internal framing *in your English prose*.
      *   **The Cost is Your Clue:** The friction points identified by the filter (hesitation, word choice, confusion) are exactly what you translate into the English prose to *show* the underlying grammar's effect.

  **What the Procedure *Can't* Do:**

  1.  **Prove Causality in Culture:** It can't show language *caused* a complex cultural practice, only that it might habitually reinforce certain attentional patterns that *align* with it.
  2.  **Predict Exact Cognitive Effects:** Research shows tendencies (attention, recall speed), not guaranteed outcomes for every individual in every context.
  3.  **Solve the Translation Problem Perfectly:** It helps you know *what effects to imply* in English, but you still need crafty writing techniques (like the verb/adverb/pronoun suggestions above) to convey it naturally.
  4.  **Judge Pure Narrative Value:** A plausible linguistic effect might still be a boring or awkward story beat. The filter checks science, not storytelling.

  **Conclusion for Your Scenarios:**

  *   **(a) KEEP.** It's linguistically solid and offers great dramatic friction (the *cost* of lying is higher). Show the struggle!
  *   **(b) BIN.** This relies on discredited strong determinism. Find a cultural or plot reason for their difficulty with uncertainty, not a linguistic one.
  *   **(c) MODIFY.** Keep the *linguistic reflex* (using "she" in narration/thoughts). **Bin** the idea that the grammar *makes* them consciously think of it as female/anthropomorphize deeply. The cost is minimal (automatic pronoun use), not profound belief.

  Your "cost test" instinct is excellent. This filter refines it based on actual linguistic relativity research: **focus on habitual attention, processing load, and pragmatic friction.** Avoid impossibility and deep cultural determinism. Show the cost *through the characters' actions and words* in your English prose. Good luck with the edits! Your editor will appreciate the grounded approach.
