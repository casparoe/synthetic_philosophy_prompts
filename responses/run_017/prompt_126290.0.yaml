  The cruxes are critical. First, the sampling frame issue: is it fatal or just requiring different stats? Reuter might suggest fixed-set comparisons, while Lenz sees it as invalid. The test could involve pre-registered analyses with different statistical framings, with Reuter predicting useful results and Lenz predicting inconsistency.

