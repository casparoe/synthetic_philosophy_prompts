  ### Runnable 50-Minute Activity: Experiencing the Allais Paradox

  **Materials**:
  - Projector (to display choices)
  - Whiteboard (for recording results)
  - 100 identical index cards (or slips of paper) numbered 1–100
  - A large bowl/hat for drawing cards
  - A $20 bag of high-quality, individually wrapped chocolates (e.g., Ghirardelli squares; at least 20 pieces)
  - Small whiteboard or poster paper for tallying choices
  - 18 sheets of paper and pens for private choices
  - Prize tokens: 1 "Extra Credit Point" certificate + a chocolate bag

  **Stakes & Prizes**:
  - **Problem 1 Prize**: 1 piece of chocolate (low-value outcome)
  - **Problem 2 Prize**: Entire chocolate bag + 1 extra credit point (high-value outcome)  
    *(Note: Outcomes are mutually exclusive. Winning Problem 2 supersedes Problem 1’s outcome to avoid double-prizing.)*

  **Outcome Mapping** (to mirror Allais structure):
  - **Outcome 0**: Nothing
  - **Outcome 1**: 1 piece of chocolate (*like $1M*)
  - **Outcome 2**: Entire chocolate bag + extra credit point (*like $5M*)

  ---

  ### Activity Flow (Total: 50 min)

  #### **1. Introduction (5 min)**  
     - **Goal**: "Today, you’ll face two real choices with prizes. Your job is to pick what feels right—no right/wrong answers."  
     - **Rules**:  
       - Choices are private (write on paper).  
       - One student will be randomly selected to play out their choices.  
       - Prizes: Chocolate pieces (Problem 1) or the whole bag + extra credit (Problem 2).  

  #### **2. Problem 1: Choice (5 min)**  
     - **Project**:  
       - *Option A*: 100% chance of **Outcome 1** (1 chocolate piece).  
       - *Option B*: 10% chance of **Outcome 2** (bag + extra credit), 89% chance of **Outcome 1**, 1% chance of **Outcome 0** (nothing).  
     - Students write "A" or "B" on paper. Papers collected.  

  #### **3. Problem 2: Choice (5 min)**  
     - **Project**:  
       - *Option C*: 11% chance of **Outcome 1** (1 piece), 89% chance of **Outcome 0** (nothing).  
       - *Option D*: 10% chance of **Outcome 2** (bag + extra credit), 90% chance of **Outcome 0** (nothing).  
     - Students write "C" or "D" on new paper. Papers collected.  

  #### **4. Random Selection & Lottery (10 min)**  
     - Draw a student’s name from a hat. They come forward.  
     - **Resolve Problem 1**:  
       - Draw a number (1–100) from the bowl.  
       - *If they chose A*: They win Outcome 1 (1 chocolate piece).  
       - *If they chose B*:  
         - 1–10: Outcome 2 (bag + extra credit)  
         - 11–99: Outcome 1 (1 piece)  
         - 100: Outcome 0 (nothing)  
     - **Resolve Problem 2** (new number draw):  
       - *If they chose C*: 1–11 = Outcome 1 (1 piece), 12–100 = Outcome 0.  
       - *If they chose D*: 1–10 = Outcome 2 (bag + extra credit), 11–100 = Outcome 0.  
     - Award prizes immediately.  

  #### **5. Tally Choices Publicly (5 min)**  
     - On whiteboard, tally class results anonymously:  
       - Problem 1: Number choosing A vs. B.  
       - Problem 2: Number choosing C vs. D.  
       - Highlight how many chose **A (Problem 1) + D (Problem 2)**.  

  #### **6. Debrief: Mapping to Independence Axiom (20 min)**  
     - **Step 1: Decompose the lotteries (5 min)**  
       - Draw two decision trees on the board:  
         - *Problem 1*: Split into 11% and 89% branches.  
           - A: 100% Outcome 1.  
           - B: 11% (10% Outcome 2 + 1% Outcome 0) + 89% Outcome 1.  
         - *Problem 2*: Split into same 11% and 89% branches.  
           - C: 11% Outcome 1 + 89% Outcome 0.  
           - D: 11% (10% Outcome 2 + 1% Outcome 0) + 89% Outcome 0.  
       - **Key Insight**: "The 89% branch is identical *within* each problem (Outcome 1 in Problem 1; Outcome 0 in Problem 2). Independence says your preference in the 11% branch should determine both choices."  

     - **Step 2: Highlight the violation (5 min)**  
       - Point to the tally: "If you chose A (over B) in Problem 1, you preferred Outcome 1 over the 11% lottery. But if you chose D (over C) in Problem 2, you preferred the *same* 11% lottery over Outcome 1. That’s inconsistent!"  
       - **Concrete Moment**: When students see the 89% branch is identical in A/B and C/D, ask: "Why did many of you ignore it in Problem 2 but value it in Problem 1?"  

     - **Step 3: Money Pump Demo (7 min)**  
       - **Activity**: Let students trade their "choice tickets."  
         - *Phase 1*: Offer to trade A (Problem 1) for B. Some accept (preferring risk).  
         - *Phase 2*: Now offer to trade B for a lottery matching Problem 2’s options (exploit inconsistency).  
         - *Phase 3*: Offer to trade back to A (paying a "fee" in chocolate).  
       - **Why it works**: "If you violate independence, I can ‘pump’ prizes from you by exploiting inconsistent trades. Real-world consequences? Markets punish inconsistent preferences."  
       - **Earns its time? Yes**. It’s visceral—students *feel* the exploitation.  

     - **Step 4: Leaky Variant Discussion (3 min)**  
       - Pose: "What if Problem 1’s Option A was 99% Outcome 1, 1% Outcome 0?"  
       - **Reveal**: "B now dominates A—it’s always as good or better. Picking A* over B violates *stochastic dominance*, not just independence. It’s a different error."  
       - **Verdict**: Not a cleaner test—it muddies the waters.  

  #### **7. Closing (0 min)**  
     - Distribute leftover chocolate.  

  ---

  ### What Could Go Wrong (and Fixes)  
  - **Misunderstanding probabilities**: Pre-explain with a dice example (e.g., "10% = 10 in 100").  
  - **Loud student anchoring**: Private choices + anonymous tally prevent this.  
  - **Low stakes**: Emphasize prizes are real (use premium chocolate). Students care about extra credit.  
  - **"Prizes aren’t real!"**: Acknowledge it, but note: "We’re simulating high-stakes logic with what we have."  
  - **Can’t replicate exact payoffs**: Admit scaling down Outcome 2 (chocolate bag) isn’t $5M, but the *relativity* (Outcome 2 > Outcome 1 > Outcome 0) holds.  

  ### Leaky Variant Verdict  
  \answer{does not isolate}
