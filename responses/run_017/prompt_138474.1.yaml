  Hey — I'm taking a rational choice / decision theory class this term and the prof said I could run one 50-minute recitation for my section on the Allais paradox and the independence axiom. About 18 people, mostly sophomores, mix of econ and phil majors. She wants them to actually feel the pull of the violation rather than just watch her write numbers on the board, so I need a real activity, not a mini-lecture with a handout.

  Constraints: no cash (department thing), but I'm allowed one extra-credit point and a $20 bag of genuinely good chocolate as a prize, so the stakes can be small but real. I've got a projector and a whiteboard. No phones or laptops during the choice part.

  Here's the wrinkle. We did the standard pair in lecture:

  Problem 1: A = $1M for sure, vs B = 10% chance of $5M / 89% chance of $1M / 1% chance of $0
  Problem 2: C = 11% chance of $1M / 89% chance of $0, vs D = 10% chance of $5M / 90% chance of $0

  Most of the room takes A and D, and that combination is supposed to clash with independence, since A and B share the whole 89% branch and C and D share the whole 89% branch. After class the prof floated her own variant: take Problem 1 and replace the sure thing with a 99% chance at $1M and a 1% chance at $0, so A* = 99% $1M / 1% $0 against the same B. She says this is the cleaner test because it 'washes out the certainty effect' and leaves you with just the independence violation.

  I think that's wrong, but I can't fully talk myself through it. Once you leak that 1%, isn't B first-order stochastically dominant over A*, so the pair stops testing independence and just tests whether people will violate dominance? And I have no idea what the same leak does to Problem 2 — does the leaky version of problem 1 and the leaky version of problem 2 end up being the same comparison, in which case there's no pattern left to violate? Or is there something the leak does isolate that the 100% version masks?

