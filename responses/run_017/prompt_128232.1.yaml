  Now, the simulation:

  Materials: 
  - Cards for each student: party affiliation, payoff schedule (over X,Y,Z), and private electoral exposure.
  - For the instructor: a roster, and for Round B and C, a random method to choose the executive.

  Procedure:

  Round A (Regime A):
  1. Students are in parties. Each party discusses and chooses a leader (quickly).
  2. The assembly elects an executive: candidates are the 5 party leaders. Vote by students. Majority (13 votes) needed. If no majority, then top two go to a runoff. The winner is the executive.
  3. The executive announces policy (X, Y, or Z).
  4. The assembly votes on whether to remove the executive. Majority (13 votes) to remove. If removed, then election: each party gets their exposure payoff and no policy payoff. If not removed, the policy is implemented and parties get that policy payoff.

  Round B (Regime B):
  1. The instructor randomly selects one party leader to be the executive (e.g., drawing from a hat).
  2. The executive announces policy.
  3. The assembly can override the executive's policy by passing an alternative policy with a 2/3 majority (16 votes). The alternative must be specified. We can have that any party can propose an alternative policy, then they vote on that alternative vs the executive's policy. But to save time, we can have the instructor allow only one alternative to be proposed, or have a quick discussion. Alternatively, we can have a structured proposal: the instructor asks for a proposal and takes the first one. Then vote: if the alternative gets 16 votes, it passes. Otherwise, the executive's policy passes.

  Round C (Regime C):
  1. The instructor randomly selects one party leader to be the executive.
  2. The executive announces policy.
  3. The assembly votes on whether to dismiss the executive. Majority (13 votes) to dismiss. If dismissed, the caretaker (which is the leader of P3) takes over and implements policy Y. If not dismissed, the executive's policy stands.

  After the three rounds, each party drafts a constitutional amendment.

  Timeline for 90 minutes:

  - 0-10 min: Setup. Assign parties, distribute cards, explain the overall simulation and the three regimes (without labels). Explain the structure: three rounds, each round has election of executive (or random), policy choice, and then a vote that may change the outcome. Explain that payoffs are fixed and exposure is private. Emphasize that the exposure is a change in payoff if an election is held.
  - 10-30 min: Round A (20 min). 
    - 10-15: Elect executive (including runoff if needed).
    - 15-20: Executive announces policy.
    - 20-25: Confidence vote and outcome.
  - 30-45 min: Round B (15 min).
    - 30: Random selection of executive.
    - 32: Executive announces policy.
    - 35: Override vote (allow a brief time for discussion and proposal of alternative).
    - 40: Vote and outcome.
  - 45-60 min: Round C (15 min).
    - 45: Random selection of executive.
    - 47: Executive announces policy.
    - 50: Dismissal vote.
    - 55: Outcome.
  - 60-70 min: Each party drafts a constitutional amendment (one sentence). They write it on a card.
  - 70-80 min: Instructor clusters the amendments on the board. Students discuss the patterns.
  - 80-90 min: Debrief. Explain the regimes and the two variables. Discuss what happened in the simulation. Point out the mutual-destruction rule and its effect on threats. Note that "who can dismiss whom" is less informative than "what are the costs of dismissal".

  What can go wrong:

  1. Students treat it as a personality contest, not based on payoffs.
     - Fix: Emphasize that they should act to maximize their party's payoff. The instructor can remind them.

  2. Parties fail to coalesce in the time allowed.
     - Fix: Set strict time limits. For the executive election in Round A, if they deadlock, the instructor can intervene and say that if no executive is elected, then no policy and no payoff, which is bad for everyone.

  3. The executive player is ignored or allowed to dominate.
     - Fix: In party discussions, encourage all to participate. The leader is just the representative.

  4. The election mechanic never triggered.
     - In Round A, if no one wants to remove the executive, then it's not triggered. That's fine. But to show the effect, we need a round where it might be triggered. In our design, in Round A for the left executive, it shouldn't be triggered. In other cases, it might.

  5. The electoral exposure device never bites.
     - In our design, in Round A, it might not be triggered. But in the threat, it's there. The exposure affects the decision to remove.

  Debrief:

  - Map the regimes to the two variables:
    - Variable 1: How the executive is chosen (assembly vs separate body).
    - Variable 2: What happens when the government falls (election with exposure costs vs no cost vs override).
  - In A: assembly chooses, removal triggers election (costly).
  - In B: separate chooses, no removal, but override with high threshold.
  - In C: separate chooses, removal costless (caretaker with known policy).
  - The mutual-destruction rule (A) makes the threat of removal less credible because many parties pay a cost. So the assembly may be unable to remove even if they don't like the policy.
  - In C, dismissal is costless, so the threat is credible, and the executive is forced to choose a policy that won't be dismissed.
  - In B, the executive is strong because override is hard.

  What the simulation cannot reproduce:
  - In real presidential systems, the president has a popular mandate and veto powers, which we don't simulate.
  - In parliamentary systems, the government is responsible to the assembly, but also the assembly can be dissolved, which we do simulate.
  - We assume fixed party preferences, no bargaining within parties.
  - We assume that the executive's policy is implemented without bargaining; in reality, there is a process.
  - We don't model the electoral system or changes in seat shares.

  Materials for students:

  Cards example for P1:

  Party: P1
  Size: 7 members
  Policy payoffs:
  - Policy X: 10
  - Policy Y: 3
  - Policy Z: 0
  Electoral exposure: +3 (private)

  Similarly for others.

  The regimes are described as:

  Regime A: 
  - The assembly elects an executive by majority vote.
  - The executive proposes a policy.
  - The assembly may vote to remove the executive. If a majority votes to remove, then an election is held: no policy is implemented, but each party experiences a change in payoff according to their electoral exposure. If not removed, the proposed policy is implemented.

  Regime B:
  - The executive is chosen randomly from the party leaders.
  - The executive proposes a policy.
  - The assembly may override the executive's policy by passing an alternative policy with a 2/3 majority vote (16 votes). If an override passes, the alternative policy is implemented. Otherwise, the executive's policy is implemented.

  Regime C:
  - The executive is chosen randomly from the party leaders.
  - The executive proposes a policy.
  - The assembly may vote to dismiss the executive. If a majority votes to dismiss, then the executive is replaced by a caretaker (the leader of P3) who implements policy Y. If not dismissed, the executive's policy is implemented.

  In the debrief, reveal that:
  - Regime A is parliamentary with a vote of confidence and dissolution.
  - Regime B is presidential with a veto override.
  - Regime C is semi-presidential or assembly dismissal without election.

  Constitutional amendments: each party writes one. We expect some to want to change the way the executive is chosen, others to change the removal process.

  For example, P3 might want to make removal harder in A, P1 might want to make it easier in B, etc.

  Clustering: some amendments will be about who chooses the executive, others about the rules of removal.

  Then wrap up.
answer: |-
  ### Comparative Political Institutions Simulation: Constitutional Rules and Incentive Effects

  **Design Rationale**: This simulation disentangles two key variables bundled in the presidential-parliamentary contrast: (1) *Executive selection* (assembly vs. separate origin), and (2) *Executive removal* (costly mutual destruction vs. costless removal vs. no removal). Electoral exposure creates heterogeneous costs for triggering elections, making dismissal threats credible only under certain rules. Payoffs are calibrated so that **the naive prediction (assembly influence increases monotonically from B to A to C) fails for some parties**, revealing that removal power alone doesn’t guarantee influence—credibility of threats and selection mechanisms matter more. The left-majority coalition (P1+P2) achieves its ideal policy (X) only in Regime A, breaking monotonicity.

  ---

  ### Materials for Students
  - **Party Cards** (24 total, 5 parties with sizes/payoffs below). Each card lists:
    - Party label (P1, P2, P3, P4, P5)
    - Policy payoffs for X, Y, Z
    - **Private** electoral exposure (change in payoff if an election occurs).
  - **Policy Packages**: X (left), Y (center), Z (right). Payoffs reflect ideal points and compromise values.
  - **Caretaker Specification**: In Regime C, caretaker is *always* the leader of P3 and implements Y.
  - **Supermajority Threshold**: 16 votes (2/3 of 24) for override in Regime B.

  #### Party Setup (24 Students)
  | Party | Size | Policy Payoffs (X, Y, Z) | Electoral Exposure | Rationale |
  |-------|------|--------------------------|-------------------|----------|
  | **P1** | 7    | X:10, Y:3, Z:0           | +3                | Far-left, gains from election (e.g., popular momentum). |
  | **P2** | 6    | X:8, Y:5, Z:1            | -2                | Left-leaning, modestly harmed by election (e.g., voter backlash). |
  | **P3** | 4    | X:4, Y:10, Z:4           | -5                | Centrist, devastated by election (e.g., scandal vulnerability). |
  | **P4** | 4    | X:1, Y:5, Z:8            | -1                | Right-leaning, mildly harmed by election (e.g., donor fatigue). |
  | **P5** | 3    | X:0, Y:3, Z:10           | +4                | Far-right, gains massively from election (e.g., energized base). |

  **Rationale for Numbers**:
  - **Policy Payoffs**: Ensure no policy is universally preferred. X and Z are polarized; Y is a compromise. P3’s high Y payoff incentivizes centrism.
  - **Electoral Exposure**: Heterogeneous (+3 to -5) to ensure no majority uniformly fears or welcomes elections. P3’s high penalty (-5) makes mutual destruction threats non-credible in Regime A.
  - **Supermajority (16)**: High threshold in Regime B ensures override is difficult (realistic for veto-override systems), empowering the executive.
  - **Caretaker (P3)**: Publicly known to implement Y, creating a "reversion point" for Regime C that anchors expectations.

  ---

  ### Simulation Rounds (Regimes A, B, C)
  **Key Rules**:
  - **Fixed Preferences**: Payoffs and exposure are identical across rounds. Only rules change.
  - **Party Coordination**: Parties must internally agree on votes (e.g., P1’s 7 members vote as a bloc).
  - **Executive Authority**: Once chosen, executives unilaterally announce policy (X, Y, or Z).

  #### Regime A: Assembly-Chosen Executive, Removal Triggers Election
  1. **Executive Selection**: Assembly elects a party leader as executive by majority vote (13+ votes). 
     - *If deadlock*, top 2 candidates face runoff.
  2. **Policy Announcement**: Executive announces policy (X, Y, or Z).
  3. **Removal Vote**: Assembly votes to remove executive. 
     - **If removal succeeds (13+ votes)**: Election triggered. No policy payoff. **All parties add electoral exposure to payoff**.
     - **If removal fails**: Announced policy is implemented.

  #### Regime B: Separately-Chosen Executive, Unremovable, Supermajority Override
  1. **Executive Selection**: Instructor randomly selects a party leader (e.g., draw from hat).
  2. **Policy Announcement**: Executive announces policy.
  3. **Override Vote**: Assembly may override policy with a **2/3 supermajority (16+ votes)** for an alternative policy (X, Y, or Z). 
     - **If override succeeds**: Alternative policy implemented.
     - **If override fails**: Executive’s policy implemented.

  #### Regime C: Separately-Chosen Executive, Costless Dismissal to Caretaker
  1. **Executive Selection**: Instructor randomly selects a party leader.
  2. **Policy Announcement**: Executive announces policy.
  3. **Dismissal Vote**: Assembly votes to dismiss executive. 
     - **If dismissal succeeds (13+ votes)**: Caretaker (P3 leader) implements Y.
     - **If dismissal fails**: Executive’s policy implemented.

  ---

  ### Predicted Outcomes and Why Monotonicity Fails
  - **Regime A (Assembly Selection + Costly Removal)**: 
    - P1+P2 (13 votes) elect P2 executive, who chooses X. 
    - Removal vote fails (only P5 supports removal: 3 votes). **Outcome: X implemented**.
    - *Why?* Exposure costs deter P2–P4 from removal (P2: -2, P3: -5, P4: -1). Threat of mutual destruction is non-credible.

  - **Regime B (Separate Selection + No Removal)**: 
    - Random executive. If P1/P2: X implemented (override fails). If P4/P5: Y implemented (override succeeds with P1+P2+P3=17 votes). If P3: Y implemented. 
    - **Outcome: 40% X, 60% Y**.
    - *Why?* Override requires 16 votes. P1+P2 (13 votes) can block override for X but cannot impose X on right executives.

  - **Regime C (Separate Selection + Costless Removal)**: 
    - Random executive. If P1/P2: X implemented (dismissal fails: P1+P2=13 votes block). If P4/P5: Y implemented (dismissal succeeds with P1+P2+P3=17 votes). If P3: Y implemented.
    - **Outcome: 40% X, 60% Y** (same as B).
    - *Why?* Costless dismissal forces P4/P5 executives to Y, but P1/P2 can defend X with their majority.

  **Why Monotonicity Fails**: 
  - **P1/P2 achieve ideal policy (X) only in Regime A** (due to selection power and non-credible removal threats). 
  - In B/C, they get X only 40% of the time. 
  - **Critical feature breaking monotonicity**: P3’s exposure (-5) makes removal threats non-credible in A. If P3’s exposure were less severe (e.g., -1), they might support removing a P2 executive, making A less influential for P1/P2.

  ---

  ### Timeline (90 Minutes Total)
  | Time    | Activity                                                                 |
  |---------|--------------------------------------------------------------------------|
  | 0-10 min| **Setup**: Assign parties, distribute cards. Explain rules (no regime labels). Emphasize payoff maximization. |
  | 10-30 min| **Regime A**: Elect executive (10 min), policy announcement (2 min), removal vote (3 min). Record outcome. |
  | 30-45 min| **Regime B**: Random executive (1 min), policy (2 min), override vote (7 min). Record outcome. |
  | 45-60 min| **Regime C**: Random executive (1 min), policy (2 min), dismissal vote (7 min). Record outcome. |
  | 60-70 min| **Constitutional Amendments**: Each party drafts 1 amendment (e.g., "Allow assembly to dismiss without elections"). |
  | 70-80 min| **Cluster Amendments**: Post amendments on board. Group into: (1) Selection rules, (2) Removal rules. Students identify patterns. |
  | 80-90 min| **Debrief**: Reveal regime labels, map outcomes to variables, discuss credibility. |

  ---

  ### Anticipated Problems and Fixes
  1. **Personality Contest, Not Payoffs**: 
     - *Risk*: Students ignore payoffs, vote based on friendships.
     - *Fix*: Announce: "Parties lose 5 points if they deviate from their payoff schedule." Cold-call parties to explain their votes.

  2. **Coalition Failure**: 
     - *Risk*: Deadlock in Regime A executive election.
     - *Fix*: Impose 2-minute time limit. If deadlocked, no policy (all get 0). Incentivizes compromise.

  3. **Executive Dominance/Ignored**: 
     - *Risk*: Executive overrides party or is sidelined.
     - *Fix*: Require executives to consult parties for 2 minutes pre-announcement. Parties can "recall" leaders who defect.

  4. **Election Mechanic Never Triggers**: 
     - *Risk*: No removal in Regime A (due to exposure costs).
     - *Fix*: In debrief, contrast with a hypothetical "no exposure" scenario to show why removal failed.

  ---

  ### What the Simulation Omits (To Cover in Debrief)
  - **Popular Mandate**: Real presidents derive authority from direct elections—not simulated here.
  - **Veto Power**: Presidents often veto legislation; simplified to supermajority override.
  - **Coalition Bargaining**: Real governments negotiate policy; executives here announce unilaterally.
  - **Electoral Dynamics**: Seat distributions don’t change post-election; exposure is a fixed cost.
  - **Long-Term Incentives**: Real actors consider future elections; here, payoffs are one-shot.

  ---

  ### Debrief (Last 10 Minutes)
  1. **Map Outcomes to Variables**:
     - **Regime A (Parliamentary)**: Assembly selection + costly removal (mutual destruction). Influence comes from *ex ante selection*, but *ex post threats are non-credible* due to exposure (P3’s -5 deters removal even if policy is disliked).
     - **Regime B (Presidential)**: Separate selection + no removal. Assembly influence *low*—supermajority override is rarely achievable (e.g., P1+P2+P3=17 votes can impose Y but not X).
     - **Regime C (Semi-Presidential)**: Separate selection + costless removal. Influence *conditional*—assembly can force Y on right executives but cannot impose X without a defending majority.

  2. **Key Insight**: 
     - "Who can dismiss whom" is less important than **"who pays what when the government falls."** In A, the mutual-destruction rule (*both* executive and assembly lose seats) makes threats non-credible. In C, costless removal makes threats credible but anchors policy to the caretaker (Y).

  3. **Two-Variable Decomposition**:
     - **Variable 1**: Executive selection (assembly vs. separate).
     - **Variable 2**: Removal cost (high in A, none in B, low in C). 
     - *Amendments will cluster here*: Most parties change selection *or* removal rules, not both.

  4. **Constitutional Amendments**:
     - **P1/P2**: "Allow assembly-selected executives" (prioritize selection).
     - **P3**: "Require 2/3 majority for removal" (prioritize removal cost).
     - **P4/P5**: "Adopt separate executive selection" (avoid assembly control).
     - Students will notice amendments split into "selection" vs. "removal" families, revealing the two variables.

  ---

  **Why This Works**: The numbers ensure the left-majority (P1+P2) experiences **highest influence in A, not C**, breaking monotonicity. P3’s extreme exposure (-5) is the linchpin—it makes dismissal threats in A non-credible, letting P1/P2 hold power without compromise. In debrief, students will see that dismissal power is only influential if it’s **credible and cheap** (C), but **selection power can dominate** (A) when removal is costly.
