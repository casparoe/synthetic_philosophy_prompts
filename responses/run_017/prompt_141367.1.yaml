prompt: |-
  I have no formal background in philosophy — I install and service hospital imaging equipment, and I got pulled into this about three years ago by an argument with my brother-in-law, who is a Calvinist and who kept telling me that if God knows in advance what I will do, then my decisions are not really mine. Rather than settle it, the argument pushed me into reading about Molinism on my own, mostly popular summaries and whatever I could get out of the internet, and over the last year I have started writing up a line of thought that I cannot find stated anywhere in the material I have access to. I have been asked to give a one-hour talk to a study group of five people at my church, most of them retired, one of whom has read far more than I have, and I would rather look like a careful amateur than a confident fraud. So I am sending you my notes in the hope that you will tell me, in your own words, what is wrong with them.

  The notes below are the plan of the argument, not the talk as I would give it.

  **1. The view as I understand it.** Molinism, named after the sixteenth-century Spanish Jesuit Luis de Molina, distinguishes three logical moments in God's knowledge: natural knowledge of necessary truths and of what is possible; middle knowledge, in between, of counterfactuals of creaturely freedom — what any possible free creature would freely do in any complete set of circumstances, including circumstances it will never be in; and free knowledge, after the decree to create, of what actually happens. The point of middle knowledge is providence: before creating anything, God can survey which complete worlds are feasible for him to actualize, where feasibility is fixed by what creatures would freely do, and then actualize the one that best serves his purposes without overriding anyone's will. The appeal is obvious — God gets the control of a chess player and the creatures get libertarian freedom — and the New Testament even seems to trade in this kind of counterfactual when Jesus says that cities like Sodom, or Tyre and Sidon, would have responded to his miracles if they had seen them.

  **2. The objection I find hardest.** Call it the grounding worry: these counterfactuals are contingent, so something must make them true, but nothing seems to. Not God's will, because then the creature's choice is not free in the required sense. Not the circumstances together with laws of nature, because the whole point is that the circumstances leave the choice open. And, allegedly, not the creature's character or nature either, because a libertarian free choice is precisely what a character does not settle. So there is no fact of the matter about what Bob would do in Tahiti; there is only what Bob does do, and God's middle knowledge is empty.

  **3. What I call the parity argument, my main move.** The objection proves too much, because God's own freedom raises the same problem one moment earlier. Before the decree to create there is no actual world, so God's own hypothetical free responses are also unactualized counterfactuals — for instance, if I create a world containing free creatures who rebel, I would freely offer to restore them. Is there a fact of the matter about that prior to his decree? If the anti-Molinist says no, then deliberation about which world to create seems to have nothing to work with, and we have lost providence for reasons that have nothing to do with Molinism. If the anti-Molinist says yes — that God's essentially perfect character settles every one of his hypothetical responses — then counterfactuals of freedom can be grounded in a character, and the dispute is no longer about whether freedom is compatible with grounding. It is narrowed to a single question: whether a created person's character at a time, plus the total circumstances, settles what she would do, or whether libertarian freedom always leaves an unsettled residue.

  **4. My proposed fix, which I am least sure about.** Suppose the answer to that narrowed question is: sometimes it settles it and sometimes it does not. Then let middle knowledge be, as I put it, graded: for each creature in each circumstance God knows either the settled outcome, or a genuine narrowing to a set of live options carrying something like objective counterfactual weights below certainty. Providence then becomes risk management rather than chess: God chooses circumstances in which the outcome he wants is either settled or overwhelmingly weighted, and accepts exposure elsewhere. I like this because it looks like the kind of knowledge a person could have of another person. But I suspect it is unstable. If the weights are real and known, then arranging circumstances so that the risk comes out acceptable looks like exactly the control the objector was worried about, only blurrier — so I may have bought flexibility by giving up the precision that made middle knowledge attractive. And it may be that a counterfactual about what someone would *probably* freely do is not the sort of proposition the doctrine was ever about, in which case I have quietly become an open theist with extra machinery.

  **5. A worry I cannot place.** Call it the problem of counterfactual-selected people. On the standard picture, whether someone exists at all can depend on what she would have done in circumstances God never in fact puts her in, because those counterfactuals constrain which worlds are feasible and hence who shows up in the actual one. My existence then hinges on behaviour I never perform, which feels like a grievance of a kind that simple-foreknowledge views do not generate. But I cannot tell whether that is specific to Molinism or only to any view on which God chooses a world knowing what everyone would do — and if it is the latter, it is not an objection to Molinism at all, and my talk has one section fewer than I thought.

  What I would like from you: first, an accuracy check — have I got the three moments and the logical ordering right, and is my statement of the grounding worry the strong version or a version nobody actually holds? Second, whether the parity argument survives, and specifically whether the Molinist is even allowed to say that creaturely counterfactuals are grounded in a creature's character, since I have a growing suspicion that the standard view insists they are not, which would break step 3. Third, whether graded middle knowledge collapses into something I could have had more cheaply, and what the strongest Molinist reply to it would be. Fourth, whether the counterfactual-selected-people worry is specific to Molinism. And finally, for a one-hour talk to five people: which of sections 3 to 5 is genuinely worth keeping, and what is the single thing I am most likely to state wrongly in front of the one person in the room who has read the literature?

  One request: please do not give me a bibliography, a reading list, or a set of author and paper names to chase up — I have asked elsewhere and got lists of things I cannot obtain, and I would much rather have the reasoning in your own words. If a move of mine is already a familiar one, say what is wrong with my version of it rather than who got there first.
