prompt: |-
  I sit on the ethics committee of a mid-sized hospital, and we are drafting a short guidance note on when a patient's earlier written instruction — a transfusion refusal, a psychiatric advance directive, a request not to be allowed to discharge herself during a crisis — should still be treated as binding when the same patient, later and apparently lucidly, asks for the opposite. Most of our disagreement turned out not to be about autonomy or best interests but about something prior: what a person has to be doing at the moment she signs for her signing to count as adopting a plan, as opposed to making a prediction about her future self or expressing a wish about what she hopes that self will do. A reading group I run separately has been stuck on Kavka's toxin puzzle — the stranger who will pay you a large sum at midnight if by then you have formed the intention to drink, the next morning, a toxin that will make you miserable for a day and do nothing else, with no further payment for actually drinking it — because it isolates exactly this: a present reason to acquire a future-directed attitude you know you will have no reason to act on. So I want a specification rather than a survey: what would a theory of intention have to get right in order to be usable for my committee's question? Give me the requirements — the cases it must handle, the distinctions it must not collapse (intending versus predicting, intending versus wanting or hoping, intending versus trying, conditional versus unconditional intention, occurrent versus standing intention, planning for oneself versus committing to another), and the ordinary facts about planning it must not render mysterious — each with the case or consideration that makes it a requirement, and each marked as non-negotiable or as the preference of a particular camp. Then tell me which subset of the requirements you suspect cannot be jointly satisfied, and which single requirement does the most work in excluding candidate theories.

  Please build the list around these cases, several of which my group invented: the plain toxin case; a counter-bribe variant in which you know tonight that tomorrow at eleven a second stranger will credibly offer you more money not to drink, and you know you will take it — does that make intending tonight easier, harder, or no different, and whatever the answer, what does it show the original puzzle was about?; an iterated variant in which the same offer recurs every night for a month, payment each time only for the intention, with full knowledge each night that you will never drink — does repetition help, and if so does that tell against a theory of what intending is?; a dyadic variant in which you and a partner are paid only if you jointly intend and each of you knows the other will not drink; and a variant in which the payoff is keyed to your confident belief that you will drink rather than to your intention, so that the question becomes whether the puzzle is really about prediction all along. Add the non-exotic cases any such theory must leave intact: the smoker who locks money into a deposit contract knowing she will want to smoke, the traveller who books a non-refundable room in a city she will later not want to visit, the standing intention never acted on, the intention to do something you expect to fail at.

  Two constraints. First, I have no library access and no interest in who said what: describe positions by the claims that constitute them, skip citations and reading suggestions entirely, and if you include a scorecard of the main contenders at all, give it one line each and do not let it displace the criteria — I would rather have twelve requirements with their motivating cases than twelve views with their labels. Second, and the part I most want: mark explicitly which of the things people demand here are genuine desiderata and which are commitments of one camp that the rest of us never agreed to — that intentions must track reasons the agent expects to have at the time of action, that intending requires believing you will do it, that deliberation and self-prediction are in tension, that a rational intention must be revisable only for a reason — say which of those are negotiable, and flag any requirement that quietly asks the theory to do normative work it may not be able to do, namely telling us what to do later, rather than telling us what it is to have a plan. About 700 to 1000 words; a table is fine if it helps.
reasoning: |-
  Hmm, the user is on a hospital ethics committee drafting guidance about when prior written instructions from patients should remain binding versus when to follow their current lucid requests. They've encountered a philosophical challenge about the nature of intention, particularly inspired by Kavka's toxin puzzle and its variants. They want a specification of requirements for a theory of intention that can handle real-world clinical dilemmas.

  The core issue is distinguishing between adopting a binding plan versus making predictions or expressing wishes. The user needs a framework that can resolve conflicts between past documented preferences and present competent requests - like transfusion refusals, psychiatric advance directives, or requests against self-discharge during crises.

  They've provided several thought experiments to test theories of intention:
  - The original toxin puzzle (incentive to intend to drink toxin without follow-through reason)
  - Counter-bribe variant (additional incentive not to drink later)
  - Iterated version (repeated intention formation without action)
  - Dyadic case (joint intention without individual commitment)
  - Belief-based payoff (testing if it's really about prediction)

  Plus real-world analogs: smokers' commitment devices, non-refundable bookings, standing intentions, and intentions despite expected failure.

  Constraints are strict: no citations, focus on requirements not theorists, and critical analysis of which demands are genuine desiderata versus factional commitments. The response must explicitly flag negotiable premises and normative overreach.

  Key philosophical tensions to address:
  - Intention vs prediction (must distinguish)
  - Intention vs desire/hope (must distinguish)
  - Conditional vs unconditional commitments
  - Occurrent vs standing states
  - Self-planning vs interpersonal commitment
  - Whether intentions require belief in execution
  - Whether future reasons affect current intention formation
  - Whether intentions must track expected reasons

  The solution should map these distinctions to the clinical dilemma: when does a prior written directive represent a true intention (binding plan) versus prediction/wish? For example, a psychiatric advance directive refusing hospitalization during crisis - if written during stability, is it a commitment device or optimistic prediction? When the patient in crisis requests hospitalization, which should prevail?

  The response will systematically list requirements with:
  1. The case motivating it
  2. Whether negotiable
  3. Special notes on normative overreach
  Prioritizing clarity over scholarly debate per user's instructions.
answer: |-
  ### Requirements for a Theory of Intention in Clinical Guidance  
  *(Key: **Non-negotiable** = Core to defining intention; **Negotiable** = Camp-specific commitment; ⚠️ = Potential normative overreach)*  

  | Requirement                                                                 | Motivating Case(s)                                                                                                                               | Status & Notes                                                                                                                                 |
  |-----------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Distinguish intending vs. predicting**                                 | *Original toxin puzzle*: Payment for *intending* to drink toxin, but no reason to drink. Must not equate intending with believing you’ll do it. | **Non-negotiable**. *Dyadic variant*: Joint intention without prediction of action shows this is structural, not epistemic.                    |
  | **2. Distinguish intending vs. wanting/hoping**                             | *Psychiatric directive case*: A patient writes "don’t hospitalize me" during stability. Is this a plan or a wish for future resolve?             | **Non-negotiable**. *Smoker’s deposit*: Locking money shows commitment beyond hope.                                                           |
  | **3. Handle unconditional vs. conditional intentions**                      | *Transfusion refusal*: Was the refusal absolute ("never") or conditional ("if unconscious")?                                                    | **Non-negotiable**. *Traveller booking*: Non-refundable room assumes unconditional intent to go, even if desire changes.                       |
  | **4. Explain stability of standing intentions**                             | *Standing intention never acted on* (e.g., "never resuscitate" if criteria met but event never occurs).                                          | **Non-negotiable**. *Iterated toxin*: Repeatedly forming intention without action tests if stability requires "fresh" commitment.              |
  | **5. Allow intentions despite expected failure**                            | *Intending to quit smoking while doubting success*; *directive during lucidity to override future psychosis*.                                    | **Non-negotiable**. Theory must not require high self-prediction confidence.                                                                   |
  | **6. Accommodate commitment devices**                                       | *Smoker’s deposit*; *travel booking*. Present self binds future self despite known future reluctance.                                            | **Non-negotiable**. Clinical parallel: Advance directive as self-binding.                                                                      |
  | **7. Resolve tension: intention formation vs. future reasons**              | *Counter-bribe toxin*: Knowing a future bribe *not* to act exists tonight—does this prevent or ease intention formation?                          | **Negotiable** (⚠️). *Some camps*: Intentions must align with expected future reasons (harder to intend). *Others*: Intention is a present attitude (no difference). |
  | **8. Revisability only for reasons?**                                       | *Patient lucidly requests transfusion override*: Must prior directive be followed if no new medical facts?                                      | **Negotiable** (⚠️). *Camps split*: Some insist intentions are reasons-sensitive; others say they create new reasons (binding even if desires change). |
  | **9. Avoid requiring belief in success**                                    | *Intending despite expected failure*; *dyadic variant* (each knows the other won’t drink, but joint intent forms).                              | **Non-negotiable**. *Belief-payoff variant*: Payment for *belief* you’ll drink vs. *intention* shows these can come apart.                    |
  | **10. Occurrent vs. standing intentions**                                   | *Psychiatric crisis*: Was the directive signed as a deliberative act (occurrent) or a passive form (standing)?                                    | **Non-negotiable**. Clinical need: Distinguish active planning from stored preferences.                                                       |
  | **11. Planning for self vs. committing to others**                          | *Dyadic toxin*: Paid for joint intention, but no individual commitment to act. *Hospital directives*: Binding staff, not just self.                | **Non-negotiable**. Theory must clarify if intention inherently involves interpersonal accountability.                                        |
  | **12. Deliberation vs. self-prediction tension**                            | *Iterated toxin*: Forming intention nightly despite knowing you’ll never drink. Does repetition make it "easier" (suggesting prediction)?        | **Negotiable**. *Some camps*: Deliberation aims at action, so repeated "empty" intentions degrade the concept. *Others*: Intentions are context-bound states. |

  ---

  ### Critical Tensions & Overreaches  
  1. **Jointly Unsatisfiable Requirements**:  
     - **#7 (intention vs. future reasons)** + **#8 (revisability)** + **#6 (commitment devices)**. If intentions *must* track expected future reasons (#7), commitment devices (#6) become irrational. If intentions are strictly reasons-sensitive (#8), binding future selves is incoherent.  
     - **#1 (intention ≠ prediction)** + **#9 (no belief requirement)**. If intending requires no belief in action (#9), but must differ from prediction (#1), the theory needs a non-epistemic criterion (e.g., practical commitment).  

  2. **Most Exclusionary Requirement**:  
     **#7 (future reasons)**. It forces a choice:  
     - If intentions *must* align with expected future reasons, toxin-like cases (where you know you won’t act) make intention impossible—undermining advance directives as plans.  
     - If intentions *need not* align, the theory permits "irrational" intentions but saves commitment devices.  

  3. **Normative Overreach Warnings (⚠️)**:  
     - **#7 & #8** subtly demand the theory solve *what you should do* (e.g., "Should the committee honor the directive?"). But a descriptive theory of intention need only clarify *what it means to have a plan*.  
     - **#12** imports a normative view of rationality (deliberation *should* aim at action). The clinical context requires neutrality on whether "empty" intentions (e.g., iterated toxin) are valid.  

  4. **Negotiable vs. Non-Negotiable in Practice**:  
     - **Non-negotiable**: 1–6, 9–11. These ensure intention is distinct from prediction/desire, handles real-world cases, and avoids self-undermining (e.g., directives).  
     - **Negotiable**: 7, 8, 12. These reflect camps: *Internalists* (intentions must cohere with reasons) vs. *Externalists* (intentions are behavioral commitments). Your committee must decide which camp’s view aligns with clinical goals.  

  ---

  ### How Cases Inform Requirements  
  - **Original toxin** → Tests #1, #7, #9. Shows intention isn’t prediction or desire.  
  - **Counter-bribe** → Tests #7. Reveals if future reasons constrain intention formation.  
  - **Iterated toxin** → Tests #4, #12. Challenges whether intention degrades without action.  
  - **Dyadic variant** → Tests #1, #11. Proves joint intention ≠ mutual prediction.  
  - **Belief-payoff variant** → Tests #1, #9. Confirms intention ≠ belief.  
  - **Non-exotic cases** (smoker, traveller, etc.) → Ground the theory in everyday planning (#2, #3, #6).  

  **Core Insight for Committee**: Advance directives are **commitment devices** (#6). Their binding force hinges on whether they express *intentions* (requirements #1–3) or predictions/hopes. If the theory satisfies #1–6 and #9–11, it can distinguish binding plans from non-binding forecasts—resolving your autonomy/best interests stalemate. The rest (#7,8,12) are philosophical disputes your guidance may sidestep by focusing on *what the patient was doing when signing* (adopting a plan vs. speculating).
