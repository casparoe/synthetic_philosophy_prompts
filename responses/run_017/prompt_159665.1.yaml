  - For Marcus (pro-coherence): His strongest points should be 1) long-run performance with concrete numbers 2) dynamic inconsistency as self-sabotage 3) exploitability as real cost. These are distinct but reinforce each other.
  - For Thea (skeptical): Her core arguments should be 1) exploitability ≠ irrationality (using principled exploitables like promise-keeping) 2) hidden separability assumptions in long-run arguments 3) self-endorsement being too cheap to select rules. 
  - The four genuine disagreements I see are: whether exploitability implies irrationality, whether consequences can absorb all concerns without loss, whether long-run arguments require separability, and whether self-endorsement is a meaningful criterion.
