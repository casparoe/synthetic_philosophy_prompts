answer: |-
  ### Stage 1: Preparation
  - **Marcus' strongest considerations (defending pragmatic coherence):**  
    1. **Long-run dominance:** Over many independent decisions (e.g., 10,000 small bets), EU maximization beats alternatives with probability →1 (e.g., 51% vs. 49% edge per bet compounds). *Independent of other points.*  
    2. **Dynamic self-sabotage:** Agents violating stochastic dominance/sure-thing principle *now* steer toward futures they’d reject *later* (e.g., rejecting a precommitment to a dominant plan costs 3% EV). *Reveals inconsistency, not just losses.*  
    3. **Exploitability as real cost:** Markets/mechanisms extract value from incoherent agents; this cost is denominated in outcomes Thea cares about (e.g., a Dutch book draining 5% of wealth). *Not dependent on adversarial intent.*  

  - **Thea's strongest considerations (defending risk-sensitivity):**  
    1. **Exploitability ≠ irrationality:** Principled stances (e.g., refusing blackmail) are exploitable but not irrational. *Independent of risk arguments.*  
    2. **Hidden separability assumption:** Long-run arguments require additive separability across decisions, but her objective (e.g., tail-risk aversion) is non-separable when consequences include *per-decision risk experiences*. *Illustrated numerically.*  
    3. **Self-endorsement is too cheap:** EU, satisficing, and tail-minimizing all endorse themselves under their own norms; stability doesn’t favor EU. *Distinct from exploitability debate.*  

  - **Four genuine disagreements (not labeling):**  
    1. Whether exploitability implies irrationality *even for principled preferences*.  
    2. Whether "consequences" can absorb all concerns (e.g., menu-dependence, risk-as-experience) without breaking separability.  
    3. Whether long-run performance requires narrow per-decision separability.  
    4. Whether reflective stability selects EU uniquely.  

  - **Relabeling moves to avoid more than once:**  
    - "That’s just folding it into your utility function." *(Allowed once per character.)*  
    - "Your rule is just EU over a different outcome space." *(Ditto.)*  

  - **Concessions with cost:**  
    - **Thea concedes:** Intransitive preferences *are* indefensible; paying to remove cycles is rational. *Cost: Weakens her broader skepticism about coherence demands.*  
    - **Marcus concedes:** Exploitability is *ceteris paribus* bad, not absolute. *Cost: Undercuts his "pragmatic knockout" framing.*  

  ---
  ### Stage 2: Dialogue  
  **Setting:** University coffee shop after a talk on dynamic coherence. Rain taps the windows. Marcus stirs his espresso; Thea nurses black tea.  

  **Marcus:** (Leans forward) Let’s bypass the axiom worship. Take two arguments. First, the long run: Suppose you face 10,000 independent choices, each between a 51%-chance gamble paying $1.10 if win/$0 if lose, versus $1 for sure. EU says take all gambles. Your tail-weighted rule—say, rejecting any bet with >1% ruin risk—declines each. But EU’s expected wealth grows to ~$10,500; yours to $10,000. With high probability, EU beats you.  

  **Thea:** (Raises eyebrow) Flawed framing. First, exploitability isn’t irrationality. If I refuse to sell my grandmother’s ring to a pawnshop shark, he "exploits" my sentiment—but I’m not irrational. Second, your long run needs independence, identical stakes, and separability. But suppose my rule minimizes P(wealth < $9k) over my career. If decisions *interact*—say, job choices affect future options—optimizing each locally may *worsen* the tail risk globally. I’ll concede one thing: if I had cyclic preferences—like A>B>C>A—I’d pay to avoid being pumped. Transitivity is bedrock.  

  **Marcus:** (Nods) Granted on transitivity. But the exploiter isn’t a villain—it’s the market. If your rule leaks money, precommitment isn’t free. Suppose at t=0 you plan to reject a lifesaving vaccine with 0.1% side-effect risk, but at t=1 (during an outbreak) you’d accept it. If you lack precommitment tech, your t=0 self "steers" you toward a 10% mortality risk you’d now pay 3% of wealth to avoid. That’s a real cost. Now—what’s your *actual* rule?  

  **Thea:** Two components. First, I weight tail outcomes directly: For a gamble, I evaluate *u* = E[U|outcome] but add a penalty *k* × P(outcome < threshold). So for $100 with 99% certainty vs. $105 with 95%, I might choose $100 if *k* is large. Second, menu-dependence: Offering me a "tempting" bad option (e.g., a high-risk lottery) makes me anxious, lowering my well-being *even if I reject it*. My welfare isn’t separable from the choice context.  

  **Marcus:** (Taps table) Consequentialism: If everything you care about—anxiety, tail risks—is part of the *history*, then rank *histories*. If you’re dynamically consistent (no steering toward rejected futures), your history-ranking is an EU representation! The pump applies to *histories*: if your history-preferences cycle, I can pump you.  

  **Thea:** (Smiles wryly) No free lunch, Marcus. Enrich outcomes? Suppose I care about "the risk I bore in decision 1." Call this *r₁*. Now imagine two sequential decisions:  
  - **Decision 1:** Option A: $0 (risk *r₁*=0). Option B: 50% chance $100, else $0 (*r₁*=0.5).  
  - **Decision 2:** Option C: $50 always. Option D: 50% chance $110, else $40.  
  My rule: I penalize P(any decision’s outcome < $40). So at t=0, I choose A over B (avoiding B’s 50% ruin chance), then C over D (D has no ruin risk). Total: $50.  
  But if I choose B then D: Expected $75, but P(ruin) = 1 - (0.5×0.5) = 0.75? No—*per-decision* P(outcome < $40) is 50% for B, 0% for D. My *global* penalty is max(P₁(ruin), P₂(ruin)) = max(0.5, 0) = 0.5. So I prefer B (then D) to A (then C). But if Decisions 1 and 2 are offered separately, I choose A then C! Your "history" EU can’t represent this without per-decision risk coordinates—and those don’t *add* across decisions. Your long-run argument needs separability like ∑utility(decision_i). My global tail-penalty isn’t separable. Rich consequences or aggregation—pick one.  

  **Marcus:** (Pauses) Clever, but flawed. The long run doesn’t need *narrow* separability. Restate it over whole histories: Maximize the expectation of your *true* intertemporal utility *U*(history). If your *U* includes "max per-decision risk," fine—but then maximize E[*U*(history)]. If your concerns are truly *decision-indexed* rather than history-level—like caring intrinsically about "risk-in-decision-1" apart from its effect on the whole—you’re not a consequentialist! And EU is self-endorsing: if you’re an EU maximizer, you’ll endorse your own rule. If your rule doesn’t endorse itself...  

  **Thea:** (Interrupting) ...Self-endorsement is too easy! A satisficer ("aim for $90") endorses herself: "I met my goal!" A tail-minimizer ("cut P(ruin)") says: "I survived!" Even a menu-sensitive agent endorses her rule if anxiety reduction is her goal. Reflective stability doesn’t select EU. And exploitability? It’s a cost like any other. If I refuse to pay a blackmailer $10 to avoid exposure, I’m "exploited" for $10—but ceteris paribus, I accept that cost. Your coherence arguments are *at best* ceteris paribus constraints.  

  **Marcus:** (Leans back) Conceded: exploitability isn’t a refutation *ceteris paribus*. But the weighing itself—"Is the cost of avoiding pumps worth it?"—is a decision. And coherence arguments *apply* there. Name one case where the cost of becoming coherent exceeds the cost of being pumped.  

  **Thea:** (Stares into tea) Suppose I’m offered a contract: Pay $1 now to remove a future choice where I’d lose $10 if pumped. But my rule says paying to avoid choices causes anxiety worth $2. Net cost of "coherence": $3. Net cost of risking exploitation: $10 × P(pump). If P(pump) < 0.3, I rationally reject coherence.  

  **Marcus:** (Quietly) Then we disagree on what counts as a "cost." But we agree it’s *weighed*—and that weighing obeys the same coherence laws.  

  *(They fall silent. Outside, the rain intensifies.)*  

