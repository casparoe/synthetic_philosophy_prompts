answer: |-
  Below is a diagnostic instrument structured as requested: 10 concrete cases/forced-choice items, a decision tree routing key, leaf definitions, and an appendix on unoccupied positions. The tool prioritizes case-based answers over labels, uses your three core cohort types (cutoff, exposure, narrative) and pressure points (boundary lottery, diagonal problem), and explicitly flags inseparable views.

  ---

  ### **Diagnostic Instrument: "What Is a Generation?"**

  **Instructions:** Answer all 10 questions based on your intuitive judgment. Choose one option per question. No prior knowledge or definitions needed.

  ---

  #### **Questions**
  1. **Boundary Lottery**: Alex (born Dec 31, 1996) and Sam (born Jan 1, 1997) are identical in upbringing, location, and social traits—except birth date. Conventional cutoffs label Alex a "Millennial" and Sam "Gen Z".  
     ○ A. They belong to different generations.  
     ○ B. They do *not* belong to different generations.  

  2. **Late-Arrival Migrant**: Maria was born in 1990 in Country X, moved to Country Y at 24, and encountered Country Y’s media/politics only as an adult.  
     ○ A. Maria shares a generation with Country Y peers born in 1990.  
     ○ B. Maria does *not* share a generation with Country Y peers born in 1990.  

  3. **Grandparent-Raised Child**: Taylor (born 2010) was raised from infancy by grandparents born in the 1940s, absorbing their media, values, and habits.  
     ○ A. Taylor shares a generation with 2010-born peers.  
     ○ B. Taylor shares a generation with their 1940s-born grandparents.  

  4. **Unconscious Cohort**: A group born 1965–1970 shared identical schooling, economic conditions, and tech access at the same ages but *never* developed shared identity, culture, or a generational label.  
     ○ A. This group *is* a generation.  
     ○ B. This group is *not* a generation.  

  5. **Late-Named Cohort**: A group born 1950–1955 had no generational label until their mid-50s, when a term was coined and they adopted it.  
     ○ A. They became a generation only *after* adopting the label.  
     ○ B. They were always a generation, even before the label.  

  6. **Boundary Hybrid**: Jordan (born 1980, a cutoff year) rejects "Gen X" and "Millennial," adopting "Xennial."  
     ○ A. Jordan proves generational boundaries are arbitrary/fuzzy.  
     ○ B. Jordan proves generational labels are tools for self-invention.  

  7. **Cross-Cultural Label**: "Gen Z" (an Anglosphere label for 1997–2012 births) is applied to a country with slower internet adoption, different schooling ages, and local cohort terms.  
     ○ A. The label is valid—birth years define generations.  
     ○ B. The label is *invalid*—local exposures/labels matter more.  

  8. **Pre-Media Society**: A hypothetical society has no mass media; information is hyper-local.  
     ○ A. Generations *exist* here (e.g., via shared events/age groups).  
     ○ B. Generations do *not* exist here.  

  9. **Audit Result** (stipulated): A global study finds near-zero discontinuities in attitudes/behaviors at conventional cutoffs (e.g., 1946, 1965) but strong *continuous* birth-year trends.  
     ○ A. This undermines the reality of generations.  
     ○ B. This shows generations are real but best defined by exposures, not birth years.  
     ○ C. This is consistent with generations as useful bins for smooth trends.  

  10. **Collective Responsibility**: Can "Boomers" bear responsibility for climate change?  
      ○ A. Yes—generations are collective agents.  
      ○ B. No—only individuals bear responsibility.  

  ---

  ### **Decision Tree & Routing Key**
  *Follow your answers sequentially. Start at Step 1.*

  - **Step 1**: Look at **Q1 (Boundary Lottery)**.  
    - If **A** → Go to Step 2.  
    - If **B** → Go to Step 3.  

  - **Step 2**: Look at **Q9 (Audit Result)**.  
    - If **A** → **Leaf 7: Skeptical Discursive View** (labels as artefacts).  
    - If **B** → **Leaf 3: Exposure-Profile Pluralism** (many overlapping cohorts).  
    - If **C** → **Leaf 2: Continuous-Cohort Gradualism** (coarse binning).  

  - **Step 3**: Look at **Q2 (Migrant)**.  
    - If **A** → Go to Step 4.  
    - If **B** → Go to Step 5.  

  - **Step 4**: Look at **Q4 (Unconscious Cohort)**.  
    - If **A** → **Leaf 1: Realism** (sharply bounded cohorts).  
    - If **B** → **Leaf 8: Eliminativism** (reject the term).  

  - **Step 5**: Look at **Q5 (Late-Named Cohort)**.  
    - If **A** → **Leaf 6: Looping Constructivism** (real via classification).  
    - If **B** → Go to Step 6.  

  - **Step 6**: Look at **Q7 (Cross-Cultural Label)**.  
    - If **A** → **Leaf 4: Unique Historical Particulars** (defined by events).  
    - If **B** → **Leaf 10: Purpose-Relative Pluralism** (incompatible slicings).  

  ---

  ### **Leaf Definitions & Least Comfortable Commitments**
  1. **Realism about sharply bounded cohorts**: Believes generations have objective, discontinuous boundaries.  
     *Least comfortable*: Defending non-arbitrary cutoffs despite audit results (Q9).  
  2. **Continuous-cohort gradualism**: Sees "generation" as a coarse bin for smooth birth-year trends.  
     *Least comfortable*: Accepting that bins lack ontological basis but are still useful (Q9C).  
  3. **Exposure-profile pluralism**: Holds that many domain-specific cohorts overlap; no "core" generation.  
     *Least comfortable*: Explaining why we use singular labels ("Gen Z") despite pluralism (Q9B).  
  4. **Generations as unique historical particulars**: Asserts generations are singular products of events.  
     *Least comfortable*: Denying that generations can recur in similar conditions (Q7A).  
  6. **Looping social-kind constructivism**: Claims cohorts become real through labeling/internalization.  
     *Least comfortable*: Arguing a cohort "didn’t exist" before labeling (Q5A).  
  7. **Skeptical discursive view**: Treats cohort labels as journalistic/marketing inventions.  
     *Least comfortable*: Dismissing self-identification as false consciousness (Q1A + Q9A).  
  8. **Eliminativism**: Rejects "generation" as a useful or coherent concept.  
     *Least comfortable*: Jettisoning the term despite popular use (Q4B).  
  10. **Purpose-relative pluralism**: Maintains multiple cohort slicings are equally valid for different goals.  
     *Least comfortable*: Defending mutually exclusive definitions (Q7B).  

  ---

  ### **Inseparable Leaves & Explanation**
  - **Gradualism (2)**, **Eliminativism (8)**, and **Deflationary Instrumentalism (9)** *cannot be separated by this tree*. They all answer identically:  
    - Q1B (no boundary distinction),  
    - Q9A/C (audit undermines generations OR supports binning),  
    - Q4B (unconscious group isn’t a generation),  
    - Q10B (no collective responsibility).  
  - **Why?** They differ only in *prescription*:  
    - Gradualists keep "generation" as a descriptive bin.  
    - Eliminativists discard the term.  
    - Instrumentalists stipulate it as a tool without ontological weight.  
  - **Diagnosis**: These positions share all *empirical commitments* but diverge on pragmatics (empty because unattractive to defend identical empirics with different labels).

  ---

  ### **Appendix: Unoccupied Positions in Logical Space**
  *Combinations permitted by the tree but unclaimed by any major view:*

  | **Combination**                          | **Diagnosis**                                  |  
  |------------------------------------------|------------------------------------------------|  
  | Believes in sharp boundaries (Q1A) but rejects birth-year cutoffs (Q7B) *and* exposure primacy (Q2A → Q4B). | **Incoherent**: Demands boundaries without a basis. |  
  | Asserts unconscious cohorts are generations (Q4A) but requires labels for identity (Q5A). | **Unattractive**: Inconsistent on necessity of narrative. |  
  | Accepts collective responsibility (Q10A) but denies generations exist without media (Q8B). | **Unattractive**: Agency requires a substrate. |  
  | Claims boundary hybrids (Q6B) invalidate all cohort definitions, yet insists on diagonal exposures (Q9B). | **Unoccupied**: No one combines radical agency with rigid structuralism. |  

  ---

  ### **How to Use in Seminar**
  1. Students answer questions individually (5–7 mins).  
  2. Use the tree to sort them into leaves.  
  3. Group students by leaf for discussion:  
     - *Task 1*: Defend your leaf’s "least comfortable commitment" in 2 sentences.  
     - *Task 2*: Find one case from the questions your leaf struggles with.  
  4. Reconvene to share pressure points (boundary lottery, diagonal problem).  

  This forces engagement with *others’* premises while sidestepping label wars. The inseparable leaves (2/8/9) become a teachable moment on how empirical agreement can mask pragmatic divergence.
