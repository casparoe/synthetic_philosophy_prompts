     Scenario: Take two individuals: Alex born on Dec 31, 1996 and Sam born on Jan 1, 1997. They are in the same school grade? (Assume cutoff is Jan 1). They live in the same neighborhood, have similar family backgrounds. According to a common generational scheme, Alex is a Millennial (if cutoff is 1996) and Sam is Gen Z (if cutoff is 1997). 
