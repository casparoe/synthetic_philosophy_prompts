prompt: |-
  Last night at a town meeting about whether to let a warehouse go up next to the wetland, a guy kept repeating "everyone affected by a decision deserves a say in making it", and used it to argue that commuters from the next town over — who'd drive past the thing every day — should get a vote in our election. Nobody could quite say why that felt wrong, but it did.

  Can you lay out the precise claims that slogan might be making? Stuff like: does it pick out people whose interests get set back, people who'd be forced to obey whatever rule comes out, or people merely governed by it; is it saying the affected get a say or that only the affected do (so a resident who doesn't care about the warehouse loses theirs); is "a say" a vote, a veto, a right to be consulted, or just not being ignored; is there a threshold for how much you have to be affected, or does any effect at all count; and are interests objective or just what people take them to be?

  For each reading, tell me whether it's a platitude, whether it's actually plausible, and whether it really does hand the commuters a vote. And flag whether any version dodges the obvious blowup — that on the wide readings basically everyone on earth, including future people and foreigners downstream of our emissions, is affected by everything, so the principle stops picking out a demos at all — without getting so narrow that it can't do the boundary work it's supposed to do.
reasoning: |-
  Okay, the user presents a scenario from a town meeting where someone argued that commuters from another town should have a vote in a local decision about a warehouse near a wetland. The core argument was based on the slogan: "everyone affected by a decision deserves a say in making it." The user wants a precise breakdown of this slogan's possible interpretations and their implications.

  First, I need to unpack the slogan. It seems deceptively simple but has layers of ambiguity. The key components are: who is "affected," what constitutes "a say," and how we measure "affected." The user is asking for each interpretation's plausibility and whether it gives commuters voting rights. They also want to know if any version avoids over-inclusion (like including future generations) without becoming too narrow.

  I start by identifying the variables in the slogan. The main ambiguities are: the threshold for being affected, what counts as a say, whose interests matter, the scope of the demos, and whether the effect is on interests or autonomy. Each combination creates a different interpretation.

  For instance, if "affected" means any impact, even minor, and "a say" means a vote, then commuters driving by might qualify. But that could extend to almost anyone, leading to an unmanageable demos. On the other hand, if "affected" means significant impact on autonomy, it might exclude commuters but include those directly governed by the decision.

  The user mentions the problem of over-inclusion, where everyone on Earth could be considered affected in some way. This is a real issue in democratic theory. I recall David Hume's point about constitutions needing to start somewhere, and Robert Goodin's work on the all-affected principle. The challenge is balancing inclusivity with practicality.

  Next, I consider each interpretation. For example, the "Interest Setback" view focuses on harm to interests. If interests are subjective, even commuters who feel affected would get a say. But objectively, their interests might not be significantly harmed. This could lead to either over-inclusion or subjective claims flooding the system.

  The "Governed" view ties the say to being subject to the rules. Commuters aren't governed by the town's laws, so they wouldn't get a vote. This seems more defensible but might exclude people impacted indirectly, like those downstream of pollution.

  The user also asks whether any version avoids over-inclusion without being too narrow. The "Significant Autonomy Impact" view could work, as it focuses on direct imposition of rules. Commuters driving by aren't forced to obey local ordinances, so they wouldn't be included. Future generations and foreigners affected by emissions might still be a problem, but that's a larger systemic issue.

  I need to assess each interpretation's plausibility. Some are logical but impractical; others are fair but don't solve the boundary problem. The slogan as a platitude is unobjectionable, but when operationalized, it becomes problematic. The user likely wants to refute the commuter's argument effectively in the next meeting, so highlighting the autonomy or governed criteria would be strongest.

  Also, the user might have a deeper need: to articulate why the commuter's claim feels wrong despite seeming fair. It's about differentiating between mere effects and meaningful involvement in governance. The slogan's vagueness masks this distinction. Clarifying that democracy requires a bounded community based on shared governance, not just impact, addresses the intuition.
answer: |-
  The slogan "everyone affected by a decision deserves a say in making it" is rhetorically powerful but philosophically treacherous. Its ambiguity creates multiple interpretations, leading to radically different implications. Let's dissect it using your framework and evaluate each reading:

  **Core Ambiguities & Variables:**
  1.  **Threshold of "Affected":** How significant must the impact be?
  2.  **Nature of "A Say":** What level of participation is required?
  3.  **Whose Interests? Objective or Subjective?**
  4.  **Scope of the Demos:** Does "deserves a say" imply others *don't*?
  5.  **Type of Effect:** Is it impact on interests, subjection to rules/coercion, or something else?

  **Key Interpretations:**

  1.  **The "Any Interest Setback" View (Subjective Interests):**
      *   **Claim:** Anyone whose *subjectively perceived* interests are set back (however minor) by the decision deserves *some form* of participation (e.g., consultation, vote).
      *   **Affected:** Anyone who *feels* worse off.
      *   **Say:** Vague (consultation? vote?).
      *   **Threshold:** Minimal - any perceived negative impact.
      *   **Interests:** Purely subjective.
      *   **Platitude?** Superficially appealing, but quickly collapses.
      *   **Plausible?** No. Highly vulnerable to strategic claims ("I feel affected!"). Creates an impossibly large, unstable demos. Does not distinguish between trivial and significant impacts.
      *   **Gives Commuters a Vote?** Yes, if they *claim* their "view" or "safety" is affected driving past.
      *   **Blowup?** Extreme. Anyone anywhere who *feels* affected by anything (local decisions, foreign wars, climate change, cultural shifts) demands input. Demos becomes global and limitless. Future generations are included if we project feelings. **Utterly impractical and incoherent.**

  2.  **The "Any Interest Setback" View (Objective Interests):**
      *   **Claim:** Anyone whose *objectively identifiable* interests (e.g., health, property value, economic opportunity) are set back (however minor) deserves participation.
      *   **Affected:** Those suffering measurable harm.
      *   **Say:** Vague.
      *   **Threshold:** Minimal - any objective negative impact.
      *   **Interests:** Objective (though defining them is contested).
      *   **Platitude?** Still appealing, but less so than subjective.
      *   **Plausible?** Better than subjective, but still highly problematic. Requires contested definitions of "objective interests." Minor impacts overwhelm decision-making. Hard to exclude distant, diffuse effects.
      *   **Gives Commuters a Vote?** Possibly. Commuters *might* have objectively impacted interests (traffic, air quality, aesthetics affecting commute wellbeing). Requires evidence.
      *   **Blowup?** Severe. Anyone objectively harmed downstream (e.g., by pollution, economic spillovers) must be included. Future generations harmed by current emissions *must* have a "say." Demos remains potentially global and intergenerational. **Impractical boundary problem.**

  3.  **The "Significant Interest Impact" View:**
      *   **Claim:** Only those whose core or significantly important interests (objective or subjective) are *substantially* impacted deserve participation.
      *   **Affected:** Those suffering major harm or gain.
      *   **Say:** Vague, but stronger than mere consultation (perhaps vote?).
      *   **Threshold:** High - substantial impact on important interests.
      *   **Interests:** Could be objective or subjective (problems persist).
      *   **Platitude?** Less common, more nuanced.
      *   **Plausible?** More plausible than minimal impact views. Aims to capture those with most at stake. Common in practice (e.g., zoning hearings allow affected neighbors input).
      *   **Gives Commuters a Vote?** Unlikely. Driving past a warehouse generally doesn't constitute a *substantial* impact on *core* interests (safety, health, livelihood) compared to adjacent residents or the wetland ecosystem. Might grant them a right to be *heard* (consultation), but not a *vote*.
      *   **Blowup?** Mitigated, but not eliminated. Defining "significant" and "core interests" is subjective/contestable. Significant future harms (climate) or distant harms (global supply chains) could still demand inclusion. **Boundaries remain fuzzy but more manageable.**

  4.  **The "Subject to the Rule/Coercion" (Governed) View:**
      *   **Claim:** Those who will be *directly governed by and forced to obey* the resulting rules/laws deserve a say (typically a vote) in making them. This is the core democratic principle of self-legislation.
      *   **Affected:** Those bound by the authority/coercion of the decision-making body.
      *   **Say:** Typically a vote (or equivalent share in sovereign power).
      *   **Threshold:** High - being subject to enforcement.
      *   **Interests:** Secondary; focus is on autonomy and political obligation.
      *   **Platitude?** Deeply embedded in democratic theory (Rousseau, Locke).
      *   **Plausible?** Highly plausible and forms the basis of most functional democracies. Provides a clear(er) boundary: jurisdiction. Explains why we don't let foreigners vote in national elections.
      *   **Gives Commuters a Vote?** **No.** Commuters drive *through* the town; they are not *residents* subject to its zoning laws, property taxes, or local governance. They are governed by their *own* town's rules. They might be affected *by* the decision, but not governed *under* its authority.
      *   **Blowup?** Successfully Dodged. Future people aren't governed by *current* rules (though this raises separate intergenerational justice issues). Foreigners aren't governed by domestic laws. The demos is defined by shared subjection to a common authority, creating a workable boundary. **This is the strongest defense *against* the commuter's claim.**

  5.  **The "Autonomy Impact" View:**
      *   **Claim:** Those whose *autonomy* or ability to shape their own lives is significantly constrained by the decision deserve participation to protect their self-determination.
      *   **Affected:** Those whose range of choices or control over their environment is reduced.
      *   **Say:** Strong (vote or veto power).
      *   **Threshold:** Moderate to High - meaningful constraint on autonomy.
      *   **Interests:** Focused on liberty/self-determination.
      *   **Platitude?** Less common phrasing, but related to liberal ideals.
      *   **Plausible?** Plausible, especially for major constraints. Bridges interests and governance somewhat.
      *   **Gives Commuters a Vote?** Unlikely. While traffic *might* slightly constrain their commute, it doesn't fundamentally impact their autonomy in the way it impacts residents living next door or those whose local environment is transformed. Their autonomy is primarily governed by their *own* community's decisions.
      *   **Blowup?** Mostly Dodged. While autonomy impacts can be diffuse, the requirement for a *significant* constraint provides a filter. The primary impact on autonomy occurs for those directly governed. Future/foreign impacts remain tricky but less central.

  6.  **The "Right to be Consulted/Not Ignored" View:**
      *   **Claim:** Anyone foreseeably impacted (even minutely) deserves to have their views heard and considered in the decision-making process. They deserve not to be ignored.
      *   **Affected:** Anyone foreseeably impacted.
      *   **Say:** Right to be informed, heard, have views weighed (consultation).
      *   **Threshold:** Low - foreseeable impact.
      *   **Interests:** Broad.
      *   **Platitude?** Common principle of good governance/fairness.
      *   **Plausible?** Highly plausible and often implemented (public comment periods, environmental impact assessments considering wider effects). Promotes better-informed, more legitimate decisions.
      *   **Gives Commuters a Vote?** **No.** It gives them a right to submit comments, attend hearings, have their traffic/safety concerns *considered* by the town council. It does *not* grant them electoral power within the community.
      *   **Blowup?** Managed Practically. While *potentially* vast, consultation doesn't require granting *decision-making power*. Mechanisms exist (written comments, designated hearings) to gather input from a wide range of stakeholders without collapsing the demos. Future generations can be represented by advocates.

  **Conclusion & Why the Commuter's Claim Feels Wrong:**

  1.  **The Winning Interpretation (Against Commuter Vote):** The **"Subject to the Rule/Coercion" (Governed) View** provides the clearest, most defensible reason why commuters *don't* get a vote. They aren't part of the political community bound by the town's laws. This view establishes a workable demos boundary.
  2.  **The Sane Compromise:** The **"Right to be Consulted/Not Ignored" View** explains why commuters *should* have their concerns *heard and considered* (e.g., traffic studies, safety input), even without a vote. This balances inclusivity with practical governance.
  3.  **Why Minimal "Affected" Views Fail:** They lead to the **"obvious blowup"** – demanding input from anyone tangentially affected globally and intergenerally, rendering the principle useless for defining a specific decision-making body (demos). They collapse under their own weight.
  4.  **Why It Felt Wrong:** The commuter equated "affected by" (a potentially very wide net, especially subjectively) with "deserves a *vote*" (a specific, powerful form of say reserved for members of the self-governing community). People intuitively grasp the difference between being *impacted* by a decision (which might grant you a right to be heard) and being *governed* by it (which grants you a right to participate in making it). The slogan blurs this crucial distinction.

  **In short:** The slogan is a platitude only on its weakest reading ("right to be consulted"). When interpreted strongly ("deserves a vote"), it becomes plausible only under the "Governed" or "Significant Autonomy Impact" views, which *exclude* the commuters from voting. The "Governed" view best dodges the boundary blowup while fulfilling the core democratic function of defining "the people" who rule themselves. The commuter's interpretation relies on an unsustainably broad definition of "affected" that dissolves any meaningful demos.
