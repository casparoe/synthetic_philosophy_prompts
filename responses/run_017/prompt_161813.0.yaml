  Now, the timeline:

  0-5 min: 
    - Introduce the session: we are going to predict the next number in the sequence 1,2,4,8,16.
    - We will use a simple programming language to write a program that generates the sequence.
    - The goal is to write the shortest program that outputs the first five numbers (1,2,4,8,16) and then a sixth number (your prediction).
    - You will be scored by: program length (number of instructions) + 10 * (prediction - true_value)^2. Lower score is better.

  5-10 min:
    - Split into two groups: Group A and Group B.
    - Hand out the instruction set for each group. Also hand out an example program (the one with the even numbers or triangular numbers) so they see how to write a loop.

  10-25 min: 
    - Groups work on their programs. They should write on an index card:
          Group: A or B
          Program: list of instructions
          Program length: (number of instructions)
          Prediction: the sixth number that their program outputs.

    - The instructor circulates to answer questions.

  25-30 min:
    - Collect the index cards.
    - Ask each group: what is your prediction? Write on the board: Group A predicts 32, Group B predicts 31.
    - Reveal the true next term: 31.

  30-35 min:
    - Compute the scores:
          Group A: program length (expected 7) + 10*(32-31)^2 = 7 + 10 = 17.
          Group B: program length (expected 10) + 10*(31-31)^2 = 10 + 0 = 10.
    - Group B wins.

  35-45 min:
    - Discussion: why did Group A predict 32 and Group B predict 31? Because their machines made it easy to write different rules.
    - What if the true next term was 32? Then Group A: 7, Group B: 10+10=20 -> Group A wins.
    - So the machine matters.

  45-60 min:
    - Now introduce the idea of an adversarial environment. We pick one volunteer to be the environment. They will choose the next term (31 or 32) after seeing the programs and predictions? But we have already seen the programs? Let's do a second round.

    - However, we don't have time for a full second round. Instead, we can have a quick variant.

    - We reuse the same programs. But now the environment chooses the next term arbitrarily. They are told to choose either 31 or 32.

    - We then compute the scores again. And see who wins.

    - But the environment might choose to make both groups have high error? But it's only one term. They can choose 31 or 32. They might choose the one that was predicted by fewer groups? But both groups are fixed: Group A always predicts 32, Group B always predicts 31. So if they choose 31, Group A is wrong; if 32, Group B is wrong.

    - We can have the environment choose. Then we compute the scores.

    - This shows that the prior (program length) is fixed, but the likelihood (the next term) can be chosen by the environment, and the environment can make one group or the other look bad.

  60-75 min:
    - Debrief: connect to Solomonoff induction.
      - The prior is over programs: shorter programs have higher prior.
      - The likelihood: if the program exactly predicts the data, then likelihood=1; else 0. (We are assuming deterministic and no noise.)
      - So the posterior is proportional to the prior for programs that match the data.
      - But we saw that which program is short depends on the machine.
