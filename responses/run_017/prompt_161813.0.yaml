  Machine A (for Group A):

  Registers: R0=0 (read-only), R1, R2, R3, R4, R5 (you can use these for computation).
  Instructions (each is one line):
    SET Ri = c       (c is a constant between 0 and 16) : sets register Ri to c.
    OUTPUT Ri        : outputs the value of Ri. The output order is the order of OUTPUT instructions.
    ADD Ri, Rj, Rk   : sets Ri = Rj + Rk.
    MUL Ri, Rj, Rk   : sets Ri = Rj * Rk.
    INC Ri           : Ri = Ri + 1.
    DEC Ri           : Ri = Ri - 1. If Ri becomes negative, set to 0.
    JUMP IF Ri>0, L  : if Ri>0, then jump to the instruction labeled L. (You can label a line by writing, e.g., "L: JUMP ...")
    HALT             : stops the program.

  Example program (outputs 2,4,6 and stops):
    SET R1=0
    SET R2=3
    L1: 
    ADD R1, R1, 2
    OUTPUT R1
    DEC R2
    JUMP IF R2>0, L1
    HALT

