    - Also, the convergence: if the sequence continues as chord-regions, eventually the doubling program will be ruled out (when we see 31) and then the adjusted doubling might be found, but if we see more terms, the adjusted doubling will become longer than the chord-regions in its own machine.

    - And the adversarial environment: shows that the data can be chosen to fool the predictors.

