  Registers: R0=0 (read-only), R1, R2, R3, R4, R5.
  Instructions:
    SET Ri = c
    OUTPUT Ri
    BINOM Ri, Rj, k   (k must be 2 or 4) : sets Ri to the binomial coefficient C(Rj, k). If Rj < k, then 0.
    ADD Ri, Rj, Rk
    INC Ri
    DEC Ri
    JUMP IF Ri>0, L
    HALT

