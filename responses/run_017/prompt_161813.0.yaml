  ### Solomonoff Prior Game Plan  
  **Goal:** Experience machine-dependence of simplicity, Occam's razor emerging from program priors, and the impact of reference machines with small data.  

  **Materials:**  
  - Projector/whiteboard  
  - Index cards (2 colors: blue for Group A, yellow for Group B)  
  - Handouts: Toy machine instruction sets (see below)  
  - Timer  

  **Timeline (75 min):**  
  1. **Intro (5 min):**  
     - "We have a sequence: 1, 2, 4, 8, 16. Predict the next number. You’ll write tiny programs to generate this. Goal: Shortest program that outputs these five and a sixth prediction. Scoring: Program length + penalty for prediction error."  

  2. **Split & Explain Machines (5 min):**  
     - Split room: Half Group A (Machine A), half Group B (Machine B).  
     - Hand out machine instructions (see below).  
     - **Rules:**  
       - Program must output exactly **1,2,4,8,16** for the first five terms.  
       - Sixth output is your prediction.  
       - **Score = Program length (instructions) + 10 × (prediction - true value)²**  
       - Lower score is better.  

  3. **Group Work (15 min):**  
     - Groups write shortest program on index cards.  
     - **Include:** Program, program length, prediction.  
     - Circulate to clarify instructions (no coding help).  

  4. **Collect & Predictions (5 min):**  
     - Collect cards. Ask groups: "What did your machine predict?"  
     - Record on board: Group A (32), Group B (31).  

  5. **Reveal & Score (5 min):**  
     - Reveal true next term: **31** (chord-regions rule: C(n,4) + C(n,2) + 1).  
     - **Calculate scores publicly:**  
       - Group A (doubling): Length ~7 + 10×(32-31)² = 7 + 10 = 17  
       - Group B (chord-regions): Length ~10 + 10×(31-31)² = 10 + 0 = 10  
     - Group B wins.  

  6. **Adversarial Environment Round (20 min):**  
     - Pick a volunteer. They are the "environment."  
     - Groups reuse programs. Environment chooses next term (31 or 32) **after** seeing predictions.  
     - Environment chooses **32** (to maximize errors, as Group B predicted 31).  
     - **Recalculate scores:**  
       - Group A: 7 + 10×(32-32)² = 7  
       - Group B: 10 + 10×(31-32)² = 20  
     - Group A wins.  

  7. **Debrief (20 min):**  
     - **What happened:**  
       - Group A found doubling short (7 instr.); Group B found chord-regions short (10 instr.).  
       - True term = 31: Group B won. Environment chose 32: Group A won.  
       - **Machine matters:** "Shortest" depended on your instruction set.  
     - **Map to Solomonoff:**  
       - **Occam’s razor:** Short program ≈ high prior. No extra principle—it’s the prior over programs.  
       - **Machine-relativity:** Reference machine determines "simplicity." Additive constant (invariance theorem) is large—here, ~3 instructions vs. 5 data points.  
       - **Convergence ≠ speed:** Environment round shows dominance long-term, but arbitrary delay. Computable sources will eventually lose if wrong, but "when" is unbounded.  
       - **What we couldn’t stage:** Full Bayesian mixture (averaging all programs). We only saw point hypotheses.  

  ---  

  ### Toy Machines  
  **Machine A (Doubling-Friendly):**  
  - **Registers:** R0=0, R1, R2, R3  
  - **Instructions (length = 1 per line):**  
    - `SET Ri = c` (c = 1-16)  
    - `OUTPUT Ri`  
    - `ADD Ri, Rj, Rk` (Ri = Rj + Rk)  
    - `MUL Ri, Rj, Rk` (Ri = Rj × Rk)  
    - `INC Ri` (Ri = Ri + 1)  
    - `DEC Ri` (Ri = Ri - 1; min 0)  
    - `JUMP IF Ri>0, L` (jump to label L if Ri > 0)  
    - `HALT`  
  - **Example (first 3 terms of 2,4,6):**  
    ```  
    SET R1=0  
    SET R2=3  
    LABEL:  
    ADD R1, R1, 2  
    OUTPUT R1  
    DEC R2  
    JUMP IF R2>0, LABEL  
    HALT  
    ```  

  **Machine B (Chord-Regions-Friendly):**  
  - **Registers:** R0=0, R1, R2, R3  
  - **Instructions (length = 1 per line):**  
    - `SET Ri = c` (c = 1-16)  
    - `OUTPUT Ri`  
    - `BINOM Ri, Rj, k` (Ri = binomial(Rj, k); k=2 or 4)  
    - `ADD Ri, Rj, Rk`  
    - `INC Ri`  
    - `DEC Ri`  
    - `JUMP IF Ri>0, L`  
    - `HALT`  
  - **Example (first 3 terms of 1,3,6 = C(2,2), C(3,2), C(4,2)):**  
    ```  
    SET R1=2  
    SET R2=3  
    LABEL:  
    BINOM R3, R1, 2  
    OUTPUT R3  
    INC R1  
    DEC R2  
    JUMP IF R2>0, LABEL  
    HALT  
    ```  

  ---  

  ### What Will Go Wrong  
  1. **Groups write constant-output programs:**  
     - Machine A: `SET R1=1; OUTPUT R1; SET R1=2; OUTPUT R1; ...` → length 12.  
     - Machine B: Same → length 12.  
     - **Mitigation:** Encourage loops via examples. If they do constants, scores will be high (12 + error penalty), still showing machine-dependence.  

  2. **Adversarial environment picks arbitrarily:**  
     - If they pick randomly, the "lesson" still holds: Prior length dominates with small data.  

  3. **Key limitation:**  
     - **Can’t stage the mixture:** Solomonoff averages *all* programs. We only compete point hypotheses. Say: "Real Solomonoff is a weighted sum; we’re sampling high-prior programs."  

  **Why this sequence?**  
  - 1,2,4,8,16 is iconic. Doubling is intuitive; chord-regions (C(n,4)+C(n,2)+1) is obscure but equal for n=1-5, diverging at 31 vs. 32. Minimal, high-impact ambiguity.  

  **Commit:** Run as is. The chaos is data—machine relativity will hit hard.
