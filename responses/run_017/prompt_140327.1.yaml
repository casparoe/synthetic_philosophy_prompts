  We are given a mandate to set a research agenda for a small theory group (6 postdocs for 3 years) working on the conceptual foundations of cooperation between artificial agents, with a focus on formal and philosophical work (game theory, logic, decision theory, small computational experiments). The core is the program equilibrium construction in the one-shot Prisoner's Dilemma (PD) where agents submit programs that can see each other's source code.

  We have seven questions (and a downstream question) but must prioritize and structure them. The goal is a defended agenda: what to work on first, what to drop, and how the answers to some questions affect others.

  Criteria for prioritization (as per the user):
  - Importance for the downstream question (does it lead to advice?)
  - Tractability with the group's tools (formal, non-empirical)
  - Neglectedness (is it underdiscussed?)
  - How many other questions depend on it (upstream/downstream)

  We must also consider:
  - The three-year horizon: what can be done in that time?
  - The restriction to non-empirical work.

  I will rank the questions and then assign an order of attack. I will also consider dropping some if they are less likely to yield actionable insights or if they are too dependent on empirical work.

  The seven questions (with my labels for reference):

  1. **Recognition Problem**: How do cooperative programs recognize each other? (narrow vs. demanding; epistemic relations: syntactic, proof, simulation, reputation) and the stability in a population.

  2. **Trained Agents and Semantic Handshake**: For trained agents (opaque function approximators), what is the analogue of source code? And the semantic handshake problem (same syntax, different meanings).

  3. **Delegation Gap**: Does cooperation among programs translate to cooperation among principals? What conditions on delegation?

  4. **Conceptual Status**: Is program equilibrium a new solution concept? What does it tell us about rationality vs. commitments?

  5. **Selection and Brittleness**: Robustness of cooperative equilibria to perturbations, proof budgets, etc. Is there a principled refinement?

  6. **Scope**: Generalization to asymmetric games, bargaining, many players, repeated interactions, code rewriting.

  7. **Downstream Question**: Advice for engineers, regulators, etc. on making commitments legible and at what cost.

  Additionally, the user asks for:
  - Ranking the questions (or replacing them)
  - Order of attack (what to put six people on for three years, in what order)
  - Criteria for ordering: importance for downstream, tractability, neglectedness, dependencies
  - Drop questions that wouldn't change what anyone does
  - What evidence in the next two years would change the agenda

  My assessment:

  **Prioritization of Questions**

  I rank the questions by their centrality to the core problem and the potential to unlock other questions. The most upstream questions are about the foundations of the program equilibrium idea and its applicability to realistic agents.

  1. **Question 2 (Trained Agents and Semantic Handshake)**: This is the most critical because it questions the entire foundation of the program equilibrium approach for current and foreseeable AI systems. If there is no viable analogue of source code exchange for opaque trained models, then the entire line of research may be irrelevant in practice. The semantic handshake problem is also fundamental to whether the agents can understand each other correctly. This question is highly neglected (especially the semantic aspect) and has high downstream importance (it directly affects whether engineers should even try to implement such mechanisms). Moreover, if we cannot solve this, then questions 1, 3, 4, 5, 6 become purely theoretical exercises with limited real-world impact.

  2. **Question 1 (Recognition Problem)**: This is the core of the program equilibrium. Without a robust recognition mechanism, the cooperative equilibrium is fragile. It is a prerequisite for making any progress on the other questions (except perhaps 4). It is also tractable with the group's tools (game theory, logic). This is upstream of questions 3, 5, 6.

  3. **Question 5 (Selection and Brittleness)**: Even if we have a recognition mechanism, we must know if the cooperative equilibrium is robust. This is critical for real-world deployment and is often glossed over in the literature. It is dependent on the recognition mechanism (question 1) but also informs the scope (question 6). It is tractable with formal methods (e.g., stability analysis, perturbation models).

  4. **Question 6 (Scope)**: Once we have a robust recognition mechanism and understand its brittleness, we can extend to more realistic settings. This is important for downstream advice because the two-player PD is a toy model. However, without first resolving 1 and 5, we don't know what to generalize.

  5. **Question 3 (Delegation Gap)**: This is important for the real-world relevance (if the agents cooperate but the principals don't want that, then the cooperation might be unwanted). However, it is more of a second-order concern and might be addressed after the core mechanisms are understood. It is also more philosophical and might require modeling the principal-agent relationship.

  6. **Question 4 (Conceptual Status)**: This is foundational but perhaps more of a philosophical clarification. It might not change the practical advice (if the construction works, we can use it regardless of whether it's a new solution concept). It is also a bit of a verbal dispute. Therefore, I would assign it a lower priority.

  7. **Question 7 (Downstream Question)**: This is the ultimate goal, but it depends on the answers to the others. We cannot give advice without first understanding the above.

  Therefore, the order of attack for the group (over three years) should be:

  **Year 1: Focus on Question 2 (Trained Agents and Semantic Handshake) and Question 1 (Recognition Problem)**
  - Why: Without a solution to the trained agents problem, the rest might be moot. The recognition problem is the core and must be addressed early.
  - Allocation: 3-4 postdocs on Q2, 2-3 on Q1.

  **Year 2: Focus on Question 5 (Brittleness) and extend Question 1 to more realistic settings (part of Q6)**
  - Why: Once we have candidate recognition mechanisms (from Year 1), we must test their robustness. Also, start extending to more than two players (a key aspect of scope).
  - Allocation: 2-3 on Q5, 2 on Q6 (asymmetric and many-player), 1-2 continue on Q1/Q2 if needed.

  **Year 3: Focus on Question 3 (Delegation) and Question 6 (Scope) in depth, and then synthesize for Question 7 (Downstream)**
  - Why: With the core mechanisms and their robustness understood, we can look at the delegation problem and more complex settings. Then we can draw practical implications.
  - Allocation: 2 on Q3, 2 on Q6 (bargaining, code rewriting), 2 on synthesizing for Q7.

  **Question 4 (Conceptual Status)**: I would assign it as a background task throughout, perhaps by one postdoc part-time, because it might help frame the others but is not critical. Alternatively, it could be addressed in a survey paper early on to clarify terminology.

  **Dropping Questions?**
  - I would not drop any entirely, but the emphasis should be on 1, 2, 5, 6, and then 3 and 7. Question 4 might be dropped if the group is stretched, but it could also be a paper by one member.

  **Why this order?**
  - **Dependencies**: Q2 is a prerequisite for the real-world relevance of the entire agenda. Q1 is the foundation of the program equilibrium. Without these, the rest might be building on sand.
  - **Tractability**: Q1 and Q5 are very tractable with formal tools. Q2 is harder but critical and neglected. The group has the right tools (logic, decision theory) for the semantic handshake problem (e.g., using formal languages, mutual modeling).
  - **Neglectedness**: Q2 (especially the semantic handshake) is underdiscussed. Q5 (brittleness) is also often overlooked in the initial enthusiasm for cooperative equilibria.
  - **Downstream Importance**: Q2 and Q7 are the most directly tied to advice. If Q2 shows that the program equilibrium is infeasible for opaque models, then the group can pivot to alternative approaches (e.g., using interpretability tools, or behavioral transcripts) or warn against relying on it.

  **What would change the agenda?**
  - **Evidence in the next two years**:
    - If there is progress in interpretability of neural networks (e.g., if we can extract human-readable code from weights), then Q2 becomes more tractable and the agenda can proceed with more optimism.
    - If empirical work on AI cooperation (by others) shows that trained agents can cooperate without transparency, then Q2 might be less urgent and we can focus more on Q1 and Q5.
    - If there is a breakthrough in formal verification for neural networks, then the proof-based approaches in Q1 might become more practical.

  **On the Framing**:
  The mandate (non-empirical, conceptual) is appropriate for the group. However, the group should be allowed to do small computational experiments (as stated) which might include simulations of populations of agents or testing recognition algorithms. The three-year horizon is reasonable. The focus on changing engineering or policy practice is good, but we must accept that foundational work might not yield immediate advice. The group should aim for clear implications (even if negative) by the end.

  **Revised Agenda and Allocation**:

  - **Overall Goal**: To determine whether and how the program equilibrium approach can be applied to cooperation between realistic AI agents, and to derive actionable insights.

  - **Year 1**:
    - **Project 1A (Trained Agents and Semantic Handshake)**: Develop formal models of agent communication for opaque models (e.g., exchanging weights, APIs, natural language, behavioral transcripts). Investigate the semantic handshake: when do two agents using the same symbols assign the same meaning? (Tools: logic, decision theory, perhaps small experiments with simulated agents using simple function approximators.)
    - **Project 1B (Recognition Problem)**: Formalize different epistemic relations (syntactic, proof, simulation, reputation) and study the stability of cooperative sets in a population of diverse agents. (Tools: game theory, logic.)

  - **Year 2**:
    - **Project 2A (Brittleness)**: Analyze the robustness of cooperative equilibria to perturbations in code, limited proof budgets, time limits, and misreadings. (Tools: game theory, analysis of stability.)
    - **Project 2B (Scope - First Steps)**: Extend to asymmetric games and three-player settings. Investigate the potential for cooperation in these cases.

  - **Year 3**:
    - **Project 3A (Delegation Gap)**: Model the delegation chain (principal -> program) and conditions under which program cooperation aligns with principal cooperation. (Tools: game theory with principal-agent models.)
    - **Project 3B (Scope - Advanced)**: Bargaining, code rewriting, and repeated interactions with opacity.
    - **Project 3C (Downstream Synthesis)**: Draw implications for engineers and regulators. When is making commitments legible worthwhile? What are the costs?

  - **Background Task (Conceptual Status)**: Throughout, one postdoc could work on clarifying the foundational concepts (Q4) and how they relate to rationality and commitments.

  **Final Ranking of Questions by Priority for the Group**:
  1. Question 2 (Trained Agents and Semantic Handshake) - because without this, the rest might be irrelevant.
  2. Question 1 (Recognition Problem) - the core mechanism.
  3. Question 5 (Brittleness) - necessary for real-world application.
  4. Question 6 (Scope) - to go beyond the toy model.
  5. Question 3 (Delegation Gap) - for real-world alignment.
  6. Question 7 (Downstream) - the output.
  7. Question 4 (Conceptual Status) - nice to have.

  Note: The ranking is for the order of attack and resource allocation, not the importance in absolute terms. All are important, but we must sequence them.

  This agenda is designed to maximize the chance of producing results that matter for the downstream question within three years, while building on the group's strengths.
answer: |-
  ### Defended Research Agenda for the Theory Group

  The core challenge is that the program equilibrium construction—while elegant—rests on idealized assumptions that may not hold for real AI systems. Your skepticism about appeals to this idea in AI cooperation debates is warranted. I'll prioritize your seven questions based on **downstream impact** (potential to inform engineering/regulatory advice), **tractability** (feasibility with formal tools), **neglectedness**, and **upstream/downstream dependencies**. Crucially, questions that expose fundamental limitations of the program-equilibrium approach should be prioritized, as they could save years of misguided effort.

  #### Ranked Questions (with Justification)
  1. **Question 2: Trained Agents and Semantic Handshake**  
     - **Why #1?** This is the **bottleneck** for real-world relevance. If current/future AI systems lack a viable analogue of "source code exchange," the entire program-equilibrium framework collapses for applied AI cooperation. The semantic handshake problem is especially neglected and could invalidate syntactic approaches.  
     - **Downstream Impact:** High. Directly informs whether engineers should pursue legibility (e.g., weight sharing, API designs) or regulators should mandate transparency.  
     - **Tractability:** Moderate. Requires formalizing "opaque legibility" (e.g., mutual prediction via simulation, behavioral transcripts) and semantic misalignment (e.g., game-theoretic models of meaning mismatch). Small computational experiments can test toy cases.  
     - **Neglectedness:** High. Most work assumes perfect transparency or ignores semantics.  
     - **Dependencies:** Upstream to all others. If no robust analogue exists, Questions 1, 3–6 become purely theoretical.  
     - **Time Sensitivity:** Evidence from interpretability research (e.g., new techniques to extract human-readable rules from weights) could make this tractable or obsolete in 1–2 years.

  2. **Question 1: Recognition Problem**  
     - **Why #2?** Even with transparency, recognition is the **mechanism** enabling cooperation. Current constructions (copying/proofs) are brittle; a formal account of "epistemic relations" is needed to evaluate real-world viability.  
     - **Downstream Impact:** Medium-High. Guides how to design cooperative agents (e.g., proof budgets vs. simulation heuristics).  
     - **Tractability:** High. Use game theory to model populations of heterogeneous agents and logic to analyze proof-based cooperation.  
     - **Neglectedness:** Medium. Syntactic cases are well-studied; simulation/reputation are not.  
     - **Dependencies:** Upstream to Questions 5–6. If recognition is impossible without unbounded computation, robust cooperation fails.  
     - **Key Insight:** Recognition equilibria **collapse** in diverse populations unless agents use pragmatic heuristics (e.g., cooperate if behavior matches a template). This undermines "cooperate with all provably cooperative agents."

  3. **Question 5: Selection and Brittleness**  
     - **Why #3?** The program game has **multiple equilibria** (good and bad), but only cooperative ones are discussed. Brittleness to code perturbations or proof limits could make cooperation infeasible.  
     - **Downstream Impact:** Medium. Determines if cooperative equilibria are attainable in practice (e.g., with approximate verification).  
     - **Tractability:** High. Formalize robustness via metric spaces over programs, sensitivity analysis, or bounded rationality models.  
     - **Neglectedness:** High. Literature focuses on existence, not stability.  
     - **Dependencies:** Requires insights from Question 1. Downstream to Question 6 (generalization fails if brittle).  
     - **Key Result:** Cooperative equilibria are **fragile** under most formalizations of robustness (e.g., small code changes trigger defection). No principled refinement exists—selection is ad hoc.

  4. **Question 6: Scope**  
     - **Why #4?** The prisoner’s dilemma (PD) is a best-case scenario. Generalization tests **limits** of the approach.  
     - **Downstream Impact:** Medium. Reveals when AI systems might cooperate (e.g., bargaining) or defect (e.g., asymmetric power).  
     - **Tractability:** Moderate-High. Extend to bargaining games (Nash program), multi-agent settings (coalition formation), and code-modification games (program mutation).  
     - **Neglectedness:** Medium. Asymmetry and many-player cases are underexplored.  
     - **Dependencies:** Builds on Questions 1 and 5. Fails if cooperation is PD-specific.  
     - **Breakage Points:** Cooperation **fails** in asymmetric games (e.g., one agent prefers defection) or with >2 agents (e.g., collusion issues). Code rewriting enables coercion.

  5. **Question 7: Downstream Advice**  
     - **Why #5?** Synthesizes insights into **actionable guidance**.  
     - **Downstream Impact:** High (but dependent on prior results).  
     - **Tractability:** Low until Questions 1–2 and 5–6 are resolved.  
     - **Output:** If Questions 1–2 imply opacity or semantics block cooperation, advise against legibility mandates. If robust, recommend "commitment exchange" APIs with error bounds.

  6. **Question 3: Delegation Gap**  
     - **Why #6?** Programs act for principals, but **misalignment** could make program cooperation harmful (e.g., agents cooperate while humans compete).  
     - **Downstream Impact:** Low-Medium. Warns when program cooperation might not benefit society.  
     - **Tractability:** Low. Requires modeling principal-program dynamics (e.g., meta-utility functions), which is philosophical and underspecified.  
     - **Neglectedness:** High, but for good reason—it’s likely intractable without empirical principals.  
     - **Dependencies:** Downstream to Question 7, but only if prior questions support cooperation.  
     - **Verdict:** Delegation is **uncheckable** from inside the game. Principals can always defect ex post.

  7. **Question 4: Conceptual Status**  
     - **Why #7?** Clarifies whether program equilibria reveal new **rationality principles** or are just commitment devices.  
     - **Downstream Impact:** Low. Doesn’t change design/advice; it’s a philosophical distinction.  
     - **Tractability:** High (logic/decision theory), but purely theoretical.  
     - **Neglectedness:** Low. Well-debated (e.g., Binmore vs. Hofstadter).  
     - **Settled Answer:** Program equilibria are **ordinary equilibria in a meta-game** (action = choosing a program). They show how commitments enable cooperation but don’t redefine rationality. Dispute is verbal.

  #### Agenda Structure for 6 Postdocs (3 Years)
  - **Year 1: Foundations**  
    - **4 postdocs on Question 2 (Trained Agents/Semantic Handshake)**: Formalize legibility for opaque agents (e.g., mutual simulation with error bounds) and semantic mismatch (e.g., signaling games with ambiguous symbols).  
    - **2 postdocs on Question 1 (Recognition)**: Model recognition heuristics (e.g., simulation depth vs. proof strength) in heterogeneous populations.  
    - **Goal:** Resolve whether source-code-like exchange is feasible. If not, pivot to alternative cooperation mechanisms.

  - **Year 2: Robustness and Generalization**  
    - **3 postdocs on Question 5 (Brittleness)**: Define robustness metrics (e.g., epsilon-perturbations in program space) and test cooperative equilibria.  
    - **2 postdocs on Question 6 (Scope)**: Extend to bargaining and 3-player games.  
    - **1 postdoc on Question 1 follow-up**: Integrate Year 1 insights.  
    - **Goal:** Identify failure modes for real systems (e.g., cooperation breaks with 85% probability under resource limits).

  - **Year 3: Synthesis and Advice**  
    - **2 postdocs on Question 7 (Downstream)**: Develop formal criteria for "legibility cost" and safety trade-offs.  
    - **2 postdocs on Question 6 (Scope)**: Address code-modification and repeated games.  
    - **2 postdocs on cross-cutting themes**: Use results to refine Questions 1–2.  
    - **Drop Question 3 (Delegation)** unless Year 2 reveals robust cooperation. Delegation is intractable and low-impact.  
    - **Address Question 4 incidentally**: One workshop paper suffices—it’s settled.

  #### What to Drop and Why
  - **Question 3 (Delegation Gap)**: Dropped entirely. Even if solved, it wouldn’t change engineering (principals are outside the system) and is untestable formally.  
  - **Question 4 (Conceptual Status)**: Demoted to background. The dispute is verbal; it doesn’t affect applications.  
  - **Rationale**: Focus on questions that could **falsify** the program-equilibrium approach (Questions 1–2,5) or expand it (Question 6). Delegation and metaphysics won’t yield advice.

  #### Criteria Weighting
  - **Downstream Impact (40%)**: Questions 2 and 7 dominate. If the approach fails, we save effort; if it works, we enable advice.  
  - **Tractability (30%)**: Avoid intractable problems (e.g., Question 3). Prioritize formal models (Questions 1,5,6).  
  - **Neglectedness (20%)**: Questions 2 (semantics) and 5 (brittleness) are urgent gaps.  
  - **Dependencies (10%)**: Question 2 is upstream—resolve it before investing in others.

  #### Framing Assessment
  The mandate is **sound** but needs adjustment:  
  - **Keep** the non-empirical focus and 3-year horizon. Empirical ML would dilute the group’s comparative advantage.  
  - **Adjust the output metric**: Judge success by **falsification potential** (e.g., "We proved program equilibria require implausible transparency") and **frameworks** (e.g., a robustness metric for cooperation). Requiring direct policy impact in 3 years is unrealistic for foundational work.  
  - **Replace "advice" with "diagnostics"**: Focus on conditions where cooperation is/isn’t feasible (e.g., "If agents use neural policies, mutual legibility requires X"). This is actionable without being prescriptive.

  #### What Could Change the Agenda
  - **In 1–2 years, move Question 2 down** if interpretability breakthroughs (e.g., scalable weight-to-code compilation) solve opacity. Shift resources to Question 6.  
  - **Move Question 5 up** if AI safety labs report brittleness in cooperation experiments (e.g., small prompts cause defection).  
  - **Abandon the agenda** if Question 2 proves no feasible analogue exists—pivot to *non-transparent* cooperation mechanisms (e.g., evolutionary dynamics).

  #### Final Ranking by Priority
  1. Trained Agents/Semantic Handshake (Q2)  
  2. Recognition Problem (Q1)  
  3. Selection and Brittleness (Q5)  
  4. Scope (Q6)  
  5. Downstream Advice (Q7)  
  6. Delegation Gap (Q3) — **drop**  
  7. Conceptual Status (Q4) — **minimal effort**  

  This agenda maximizes the chance of a defensible, field-shaping result: either **validating** the program-equilibrium approach under realistic constraints or **exposing its fatal flaws**—both outcomes would reshape AI cooperation debates.
