answer: |-
  ### Session Design: Unpacking the Dollar Auction Trap  

  **Core Insight:**  
  The dollar auction isn't just about "sunk cost fallacy." At any step, escalating *can* be rational forward-looking reasoning: bidding $X$ to avoid a $Y$ loss (where $Y > X$) is logical given prior commitments. The trap arises from the game's structure, not just psychology. Your partner-relay idea isolates this by transferring bidding responsibility mid-game, testing if escalation persists without personal history.  

  **Constraints Addressed:**  
  - **No real money:** Use tokens (1 token = 1 entry in a lottery for a $20 bookstore voucher). Each student starts with 120 tokens.  
  - **Stakes:** High enough to incentivize escalation (voucher has "pull"), low enough to avoid resentment (losses capped at 120 tokens).  
  - **Time:** 60 min play, 30 min debrief.  
  - **Predictions & Contrasts:** Observers predict outcomes; capped vs. open auctions highlight backward induction failures.  
  - **Pre-commitment:** Desks set self-binding exit rules before the final round.  

  ---

  ### **Materials & Setup**  
  1. **Tokens:**  
     - Each student receives 120 tokens (physical chips or sticky notes).  
     - Conversion: 10 tokens = 1 lottery entry (e.g., 120 tokens → 12 entries). Draw 2 voucher winners post-debrief.  
  2. **Auction Rules:**  
     - **Prize value:** 100 tokens.  
     - **Min increment:** 10 tokens.  
     - **Payoffs:**  
       - Winner: Prize (100) – last bid.  
       - Runner-up: Pays last bid, gets nothing.  
       - Observers: Earn 10 tokens if prediction is within 20 tokens of winning bid.  
  3. **Seating:**  
     - 11 two-person desks (22 students).  
     - Partners: Labeled A (starter) and B (relay).  
  4. **Prediction Slips:** Small cards for observers to write bid predictions.  
  5. **Commitment Cards:** For pre-commitment round (desks write a drop-out threshold).  

  ---

  ### **Rules & Payoff Scheme**  
  **Key Mechanics:**  
  - **Escalation Relay:** When bidding passes 100 tokens, Partner B (who did not make prior bids) takes over for their desk.  
  - **Capped Auction:** Fixed 10 rounds max. Prize = 100 tokens, min increment = 10. *Backward induction predicts no one should bid* (see "Contrast Note" below).  
  - **Pre-commitment:** Desks secretly write a drop-out threshold (e.g., "Drop at 90"). Facilitator enforces this.  
  - **Observer Role:** Non-bidding desks predict winning bid before each auction.  

  **Contrast Note (Capped vs. Open):**  
  - **Capped auction (10 rounds):** With prize=100 and min bid=10, bids can reach 100. Backward induction:  
    - Final bidder (round 10) pays ≥100, wins 100 → net loss.  
    - Thus, no one should bid in round 1 (true in theory, but humans often falter).  
  - **Open auction:** No defined endpoint → no clean backward induction start. Escalation is "rational" step-by-step.  

  ---

  ### **Timeline (60 Min Play)**  
  #### **Round 1: Open Auction, No Relay (15 min)**  
  - **0:00–0:05:** Assign 2 desks to bid. Explain only basic rules ("Prize=100 tokens, min bid=10, winner pays bid, runner-up pays and gets nothing"). *Do not mention sunk costs or escalation.*  
  - **0:05–0:07:** Observers seal predictions.  
  - **0:07–0:12:** Run auction. Stop if bid >200.  
  - **0:12–0:15:** Record bids, pay tokens. Rotate bidding desks.  

  #### **Round 2: Relay Auction (15 min)**  
  - **0:15–0:17:** Same 2 new desks. Add relay rule: "When bid >100, Partner B takes over."  
  - **0:17–0:19:** Observers predict.  
  - **0:19–0:26:** Run auction. Relay triggered automatically at bid=110.  
  - **0:26–0:30:** Record, pay, rotate.  

  #### **Round 3: Capped Auction (15 min)**  
  - **0:30–0:32:** New desks. Explain: "Max 10 rounds. Prize=100, min bid=10."  
  - **0:32–0:34:** Observers predict (allow "no bid" predictions).  
  - **0:34–0:41:** Run auction. End after 10 bids or if no bid in a round.  
  - **0:41–0:45:** Record, pay, rotate.  

  #### **Round 4: Pre-commitment Auction (15 min)**  
  - **0:45–0:47:** New desks. Relay rule applies.  
  - **0:47–0:50:** Desks secretly write drop-out thresholds on cards (e.g., "Drop at 80"). Hand to facilitator.  
  - **0:50–0:52:** Observers predict.  
  - **0:52–0:59:** Run auction. Facilitator enforces drop-out thresholds.  
  - **0:59–1:00:** Record, pay.  

  ---

  ### **Debrief (30 Min)**  
  **Goal:** Use observed behavior to distinguish structure vs. psychology. *First mention "sunk cost" and "escalation" here.*  

  #### **Step 1: The Step-by-Step "Rationality" (10 min)**  
  - **Q1:** "In Round 1, why did you bid past 100?"  
    - Expected answer: "To avoid losing our prior bid."  
  - **Mapt to analysis:**  
    - Highlight a bid point (e.g., 110 vs. 120):  
      - *If you bid 130:* Potential net loss = –30 (100 – 130).  
      - *If you drop:* Guaranteed loss = –110.  
    - → Escalating is *forward-looking*: –30 > –110. Not inherently irrational.  

  #### **Step 2: Structure vs. Psychology (10 min)**  
  - **Q2:** "In Round 2 (relay), did Partner B escalate? Why?"  
    - **If yes:** "Partner B had no prior bids. Why continue?"  
      - → Isolate structure: Partner B faces same lose-more-or-lose-less choice.  
    - **If no:** "Did dropping feel easier for Partner B?"  
      - → Psychology (e.g., no ownership) *can* help escape, but structure is the root trap.  
  - **Contrast Round 3 (capped):**  
    - "Did backward induction work? Why/why not?"  
    - → Capped auctions *should* deter bidding (no one profits). If bidding occurred, discuss why theory fails (e.g., overconfidence, unclear endpoint perception).  

  #### **Step 3: Pre-commitment & Error Location (10 min)**  
  - **Q3:** "Where did the error lie? In individual bids or entering at all?"  
    - Show pre-commitment thresholds: Did desks set limits below 100? Or higher (e.g., 150)?  
    - → **Key insight:** Entering the auction is the original error. Step-by-step choices are locally rational.  
  - **Q4:** "Why do observers predict lower bids than participants?"  
    - → "Hot-cold empathy gap": Observers see the trap; participants are in it.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Escalation stalls (no one bids high):**  
     - **Likelihood:** Low (stakes incentivize bidding; past runs escalated).  
     - **Fix:** If bids stall <100, "jump-start" by adding 10 tokens to prize temporarily.  

  2. **Relay partner folds immediately:**  
     - **Likelihood:** Moderate (no personal history may encourage dropping).  
     - **Fix:** If Partner B drops at 110, note in debrief: "Psychology helped escape, but the structural trap was still present."  

  3. **No one bids in capped auction:**  
     - **Likelihood:** High (backward induction works!).  
     - **Fix:** Celebrate! "You avoided the trap. But why do real-world capped auctions (e.g., deadlines) still escalate?" Discuss bounded rationality.  

  4. **Runner-up resentment:**  
     - **Likelihood:** Low (tokens → lottery entries soften loss; max loss = 120 tokens).  
     - **Fix:** Emphasize "This is a learning game; losses are teaching tools."  

  5. **Time overrun:**  
     - **Fix:** Use a timer (90 sec/bid). If deadlock, force a bid or drop.  

  ---

  ### **What the Game Cannot Reproduce**  
  **The "Infinite Regress" of Real Escalation:**  
  - **Issue:** In class, auctions have observers, rotation, and low stakes. Real-world traps (e.g., wars, R&D races) lack these off-ramps. Participants face social pressure, ambiguous endpoints, and escalating emotional investment.  
  - **Supply in Debrief:** Spend the last 10 minutes contrasting the game with real cases:  
    - "In Vietnam, the U.S. escalated because *each step* was 'rational' given prior investments. Yet the total loss was catastrophic. The trap wasn’t psychological weakness—it was a structural failure to pre-commit to an exit *before* entering."  
    - Show how **pre-commitment devices** (e.g., COIN strategy in military policy, sunk cost clauses in contracts) mitigate this.  

  ---

  ### **Why This Works**  
  - **Discovery-based:** Students experience escalation, relay, and caps *before* labeling concepts.  
  - **Contrasts highlighted:** Open vs. capped auctions; participant vs. observer views; individual bids vs. entry decisions.  
  - **Your role:** Facilitate (don’t explain) until debrief. Then connect behavior to theory using their own words.  

  This design transforms the auction from a "sunk cost joke" into a lens for dissecting rationality, structure, and human bias. Run it as written, and the debrief will write itself.
