  3. **The Relay Experiment** (5 minutes)
     - In round2 (and round4), when the relay happened, did the new partner continue? Why?
     - The new partner doesn't have the sunk cost, but they still face the same forward-looking choice: if they drop, they lose the last bid (which was made by their partner, but the desk still has to pay it). If they bid higher, they might win and reduce the loss (or even win a positive amount if the bid is still below 100? but it's above 100). 
     - So the structural trap is the same. The psychological factors (like self-justification) might be less, but the rational step-by-step reasoning remains.

  4. **The Capped Auction** (5 minutes)
     - In round3, what happened? Did anyone bid? 
     - If they didn't, why? 
     - Explain backward induction: in a finite game with a known end, we can work backward and see that bidding leads to losses. So the first bid should not be made. 
     - Contrast with the open-ended auction: there is no fixed end, so backward induction doesn't have a starting point. That's why the escalation happens.

  5. **Pre-commitment** (5 minutes)
     - In round4, what commitments did they set? Were they enforced? Did they set the commitment at a low level (say 50) or high (150)? 
     - Point: knowing the trap, they might pre-commit to avoid it. But did they? Or did they set a high commitment because they thought they could win? 
     - The difference: pre-committing not to play (i.e., setting a commitment at 0) is the only way to avoid the trap. But they might set a commitment to stop at 120, which is too late.

  6. **The Observers' Predictions** (5 minutes)
     - Show the predictions: were the observers more accurate as the rounds went on? 
     - The gap between what participants do and what observers predict: observers, not being in the heat of the moment, might predict lower bids. But the participants are caught in the structure.

  Finally, **The Lesson** (5 minutes):
  - The dollar auction is a trap because of the structure: at every step, continuing is the best option given the current situation. The error might be in entering the auction at all. But once entered, the step-by-step choices are rational. 
  - The psychological factors (like sunk cost fallacy, commitment, loss of face) might amplify the escalation, but the core is structural.

  ### What can go wrong?
  1. **No one escalates in round1**: If the bidding stops below 100, then the relay rule isn't triggered. That's okay. Then in round2, we might not see the relay. We can then adjust: in round2, start the bidding at 100? Or just note that sometimes it doesn't happen. But with 100 tokens, and bidding in increments of 10, it's likely to go over.

  2. **In the relay, the new partner folds immediately**: Then we see that the desk drops as soon as the relay happens. This might happen. Then we note in the debrief that without the psychological commitment, they drop. But if they continue, it's the structure.

  3. **In the capped auction, they do bid**: Then we can run the backward induction on the spot to show they should not have. But if they bid and it works out (e.g., in the 2-round cap: the first bidder bids 10, the second doesn't bid -> first wins and gets 40. But then the second desk should have bid 20 to win 30? But they didn't, so the first wins. Then the first made a profit. But then why didn't the second bid? They might have made a mistake. We can use that to show that in practice, people don't do backward induction perfectly.

  4. **Time overrun**: Keep strict time. Cut off auctions at 5 minutes by saying "you have 30 seconds to bid or drop".

  5. **Resentment**: The runner-up losses can be high. To mitigate, the conversion rate should be set so that even with losses, they get some lottery tickets. For example, the voucher lottery: even if they lose 100 tokens, they still have 0 tokens -> 0 lottery tickets? But they might have started with 100 tokens. So they can still have some tickets? We can set: 
     - Conversion: 10 tokens = 1 lottery ticket. 
     - Endowment: 100 tokens -> 10 lottery tickets.
     - Even if they lose 100 tokens, they have 0 -> 0 tickets. But that might be harsh. Alternatively, we can give every student 5 lottery tickets just for participating, and then tokens convert to extra tickets. So the endowment is 100 tokens = 10 extra tickets. Then even if they lose 100 tokens, they still have 5 tickets.

  ### What the game cannot reproduce
  - In real life, the dollar auction is often about very large stakes and the psychological factors (embarrassment, commitment) are stronger. Also, in real life, the auction might not have a clear structure (the other bidder might bluff, etc.). The game abstracts away these factors. Therefore, in the last 10 minutes, we should discuss how in real-world situations (like wars of attrition, business competitions) the structural trap is compounded by psychological and social factors. But the structural trap exists independently.

