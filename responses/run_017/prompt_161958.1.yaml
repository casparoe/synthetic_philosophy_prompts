  2. In Round 2, they might not see the dominance of claiming. But the instructions say: "choosing Claim is always better than passing". We put that in the Round 2 slip. So they should see that. But they might still pass? Why? Maybe altruism? Or they might not believe the instructions? 

  3. In Round 3, the main issue: what if multiple high-multiplier students claim? Then the pot vanishes. And they might not have coordinated. Also, low-multiplier students might claim out of spite? 

  4. Students might try to communicate: we must enforce silence.

  5. They might assume that the multiplier distribution is not random? We must assure them it was random.

  6. They might be upset if they had a high multiplier and the pot vanished because someone else with a low multiplier claimed. 

  We'll have to handle these in the debrief.

  Finally, we note that the exercise is designed to make them feel the dilemmas, and the debrief will connect to the concepts.

  This should meet the constraints and the goals.
answer: |-
  ### Rational Choice Seminar Exercise: The Pot Dilemma  
  **Objective:** Experience Hofstadter's Platonia dilemma and the luring lottery, then confront the fragility of their reasoning.  
  **Points:** Pot = 36 points (≈2% final grade).  
  **Materials:**  
  - 18 slips per round (pre-printed with choices).  
  - 18 envelopes (for private submission).  
  - Randomizer for multipliers (e.g., shuffled index cards).  
  - Bowl for collecting slips.  

  ---

  ### Student-Facing Slips  
  **Round 1: The Pot**  
  ```  
  ROUND 1: THE POT  
  There is a pot of 36 points.  
  You are in a group of 18 students.  

  Rules:  
  - The pot is awarded ONLY IF exactly one student claims.  
  - If no one claims, or if two or more claim, the pot vanishes.  

  Choose one:  
    [ ] CLAIM: If you are the only claimant, you win 36 points.  
    [ ] PASS: You get 0 points.  

  Submit your choice in an envelope. Do not discuss.  
  ```  

  **Round 2: The Shrinking Pot**  
  ```  
  ROUND 2: THE SHRINKING POT  
  There is a pot of 36 points.  
  You are in a group of 18 students.  

  Rules:  
  - The pot is divided equally among all who claim.  
  - If no one claims, the pot vanishes.  

  Choose one:  
    [ ] CLAIM: You get an equal share of the pot.  
    [ ] PASS: You get 0 points.  

  Example: If 6 claim, each gets 6 points.  
  Submit your choice in an envelope. Do not discuss.  
  ```  

  **Round 3: The Multiplier Round**  
  *(Pre-assign multipliers via shuffled cards: six 1x, six 2x, six 3x. Students keep multiplier private.)*  
  ```  
  ROUND 3: THE MULTIPLIER ROUND  
  Your private multiplier: [ 1x ] [ 2x ] [ 3x ] (circle one)  
  There is a pot of 36 points.  
  You are in a group of 18 students.  

  Rules:  
  - The pot is awarded ONLY IF exactly one student claims.  
  - If you are the sole claimant, you win (36 × your multiplier) points.  
  - If no one claims, or if two or more claim, the pot vanishes.  

  Choose one:  
    [ ] CLAIM: If you are the only claimant, you win (36 × [your multiplier]).  
    [ ] PASS: You get 0 points.  

  Submit your choice in an envelope. Do not discuss or reveal your multiplier.  
  ```  

  ---

  ### Timeline (90 Minutes Total)  
  **0:00–0:05 — Setup (5 min)**  
  - Distribute slips and envelopes.  
  - Explain: "Three rounds. Each round, choose CLAIM or PASS privately. Points are real. After each round, I’ll announce how many claimed—but not who. The pot vanishes if rules aren’t met."  

  **0:05–0:15 — Round 1: Symmetric Pot (10 min)**  
  - Students decide, seal slips in envelopes, and deposit in bowl.  
  - *Facilitator counts claims publicly:* Pull slips one by one, tallying on board. Announce: "ROUND 1: [X] students claimed."  

  **0:15–0:20 — Reveal & Reset (5 min)**  
  - State outcome: "The pot was [awarded/vanished] because [explain based on X]."  
  - Distribute Round 2 slips.  

  **0:20–0:30 — Round 2: Shrinking Pot (10 min)**  
  - Students decide/submit.  
  - *Public count:* "ROUND 2: [Y] students claimed." State payout (e.g., "Each claimant gets 36/Y points").  

  **0:30–0:35 — Reveal & Reset (5 min)**  
  - Distribute multiplier cards for Round 3. Verify students keep them private.  
  - Distribute Round 3 slips.  

  **0:35–0:50 — Round 3: Multiplier Round (15 min)**  
  - Students decide/submit.  
  - *Public count:* "ROUND 3: [Z] students claimed." State outcome.  

  **0:50–1:30 — Debrief (40 min)**  
  *(Structure below)*  

  ---

  ### Debrief Script  
  **1. Symmetry Premise (Rounds 1 & 2) (10 min)**  
  - *Hook:* "In Round 1, what did you expect others to do? Why?"  
  - *Key moment:* Highlight a student who says, "I thought everyone might claim" or "I hoped others would pass."  
  - *Concept link:* "This is symmetry: same rules, same stakes. What’s fair? If you all act identically, how might you avoid the pot vanishing?"  
  - *Guide them:* Let students propose randomization. Ask: "Why 1/18? What if everyone does this?"  
  - *Fragility:* "Did announcing a high claim count (e.g., 5 claims) change Round 2? Why?" → Reveals distrust in symmetry.  

  **2. Randomizers vs. Real Trust (5 min)**  
  - *Question:* "Could a public coin flip fix this? What does it solve? What doesn’t it solve?"  
  - *Point out:*  
    - Solves: Coordinates probability (1/18).  
    - Fails: Requires everyone to *trust* the outcome and *not second-guess* others.  
  - *Hofstadter quote:* "Superrational thinkers assume everyone runs the same reasoning. A randomizer helps, but it’s a crutch—not a cure."  

  **3. Asymmetric Stakes & Rule Divergence (Round 3) (15 min)**  
  - *Hook:* "In Round 3, did your multiplier change your choice? How?"  
  - *Split readings:*  
    - *Same action:* "Should everyone claim at the same rate? Why might a 3x student object?"  
    - *Same rule:* "Should only high-multiplier students claim? What if two 3x students both claim?"  
  - *Fairness objection:* "A 1x student might say: ‘Why should I pass? I’m giving the pot to someone else!’ Is that fair?"  
  - *Facilitator assertion:* "The exercise can’t settle fairness. But feel the tension: ‘Do what you’d want others to do’ splits when stakes differ."  

  **4. Stability of "I’ll do it if others do" (10 min)**  
  - *Tempting position:* "Some thought, ‘I’ll randomize only if enough others do.’ Why is this unstable?"  
  - *Why unstable:*  
    - If everyone requires "enough" others, no one acts first → pot vanishes.  
    - A high claim count reveals others *didn’t* cooperate, breeding distrust.  
  - *One-shotness:* "In class, you’ll meet again—but Hofstadter assumes no future. Here, ‘I’ll do it next time’ undermines the dilemma."  

  ---

  ### What Will Go Wrong (Predictions)  
  1. **Joking/Defiance:** Students may laugh or write "CLAIM" boldly. Mitigate by stressing real points.  
  2. **Communication:** Whispering, eye contact, or strategic coughing. Enforce silence; disqualify public slips.  
  3. **Re-run Expectations:** If pot vanishes, students may assume a do-over. State upfront: "All rounds final."  
  4. **Point-Gaming:** In Round 2, some may pass to "test altruism." Use the reveal to show this backfires (e.g., "If you passed hoping others would too, but 10 claimed, you got 0 while they got 3.6 each").  
  5. **Multiplier Distrust:** Students may doubt randomness. Use shuffled, sealed envelopes for multipliers.  

  ### What the Exercise Cannot Reproduce  
  - **Literal Identical Reasoning:** Students won’t truly believe peers are running *their exact thoughts*. The seminar’s social context (prior talks, future meetings) breaks Hofstadter’s "recursive" premise.  
  - **Pure One-Shotness:** Real trust issues arise because "next week" exists. Debrief: "Hofstadter needs a vacuum—no history, no future. Your social ties complicate this."  

  ---  
  **Final Note:** This exercise makes symmetry feel intuitive, then shatters it with asymmetry and social reality. The debrief ties friction points to Hofstadter’s framework—without lecturing upfront.
