answer: |-
  Below is a reasoned decision procedure for evaluating archaeological claims about beliefs or institutions from material finds. I'll first outline the philosophical/archaeological "failure modes" (how inferences break), then build the procedure step-by-step, test it on your cases, and clarify limitations.  

  **I. Brainstorm: How Inferences from Objects to Beliefs/Institutions Fail**  
  *(Key failure modes distilled from philosophy of science & archaeology)*  
  1. **Taphonomic distortion**: Post-depositional processes (erosion, decay, later human activity) alter or create false patterns.  
  2. **Functional ambiguity**: An object’s practical use (e.g., tool, waste) mimics ritual action (e.g., deliberate breakage).  
  3. **Equifinality**: Different causes produce identical material signatures (e.g., standardization via trade copying vs. state enforcement).  
  4. **Cognitive overreach**: Assuming shared belief is *necessary* to explain repeated behavior (e.g., "protecting spirits" vs. "our family always does this").  
  5. **Scale collapse**: Conflating individual/household actions with community-wide norms or institutions (e.g., one hoard ≠ a "priest class").  
  6. **Analogical bias**: Projecting ethnographic parallels (e.g., "water deity") without local evidence.  
  7. **Institutional conflation**: Mistaking recurrent practices (customs) for formalized institutions (enforced rules, roles, or authority).  
  8. **Absence fallacy**: Assuming lack of counter-evidence proves a claim ("we found no other explanation, so it must be ritual").  
  9. **Depositional misattribution**: Misreading the context of deposition (e.g., trash pit vs. sacred offering).  

  **II. Revised Decision Procedure**  
  *Your "chain" model is useful but oversimplifies: practices → norms → beliefs is not linear. Institutions require evidence of enforcement/transmission.* The procedure is a **cascade**: if one step fails, the claim fails or downgrades. Output = **"Support Level"** (Material, Behavioral, Normative, Institutional) + **Unresolved Uncertainties**.  

  **PROCEDURE: Questions & Rules**  
  *(Designed for volunteers: plain language, <30 min/claim, evidence-focused)*  

  1. **MATERIAL INTEGRITY**  
     - *Q: Is the feature/object anthropogenic and intact?*  
     - *Sufficient:* Clear human modification (e.g., deliberate breakage, selective deposition).  
     - *No answer:* Heavily eroded/disturbed context.  
     - **STOP if NO** (e.g., natural crack in disk).  

  2. **CONTEXTUAL COHERENCE**  
     - *Q: Does the deposition context match the claimed action?*  
     - *Sufficient:* Location/association aligns with claim (e.g., disks under doorway ≠ trash midden).  
     - *No answer:* Ambiguous context (e.g., axeheads in bog—could be ritual, storage, or loss).  
     - **STOP if CONTRADICTED** (e.g., "valuable offering" found in latrine).  

  3. **BEHAVIORAL SIGNATURE**  
     - *Q: Is there evidence of *repeated, intentional* action?*  
     - *Sufficient:* Multiple similar cases (e.g., weights cluster at 3 values; disks in 5+ doorways).  
     - *No answer:* Single occurrence (e.g., one hoard).  
     - **STOP if SINGULAR** (no repetition → weak basis for norm/belief).  

  4. **SOCIAL SCALING**  
     - *Q: Does the pattern extend beyond individuals/households?*  
     - *Sufficient:* Cross-household/regional distribution (e.g., weights across 30km valley).  
     - *No answer:* Limited to one site/house.  
     - **HARD NO if HOUSEHOLD-ONLY** (e.g., disks in one house → no "community belief").  

  5. **INSTITUTION/BELIEF NECESSITY**  
     - *Q: Could this arise without shared belief or formal institutions?*  
     - *Alternatives:* Functional need (weights for trade), copying, coercion, or family tradition.  
     - *Sufficient:* Evidence of enforcement (e.g., penalties), specialized roles (e.g., "priest" burials), or symbolic content (e.g., deity motifs on weights).  
     - **HAND TO PERSON** if ambiguous: *Values call* = Does the simplest explanation require belief/institutions?  

  **Output Format**  
  - **Support Level**:  
    - **Material**: Passes Step 1.  
    - **Behavioral**: Passes Steps 1–3 (recurring action).  
    - **Normative**: Passes Steps 1–4 (community-wide pattern).  
    - **Institutional/Belief**: Passes Steps 1–5 (necessity test).  
  - **Unresolved**: List ambiguities (e.g., "Could be ritual OR storage").  

  **Simplifications for Volunteers**  
  - **KEEP**: Material/Context/Repetition/Scaling checks (empirical).  
  - **DROP**: Fine-grained belief vs. norm distinctions (too philosophical).  
  - **WEAK POINT**: Step 5 (necessity) is hardest—default to "Possible, not certain" if ambiguous.  

  **III. Testing the Procedure**  
  *Using your cases (assume basic field data known):*  

  **Case 1: Broken Disks (Household Spirits?)**  
  1. **Material**: Yes (deliberate breakage).  
  2. **Context**: Coherent (under doorway ≠ trash).  
  3. **Behavior**: *No answer*—Only one house found. **→ Support: BEHAVIORAL** (action clear, but not repeated).  
  4. **Scaling**: Fails (single household). **STOP**.  
  5. **Belief?** Not reached.  
  - **Output**: "Evidence shows deliberate placement of broken disks. Insufficient data to confirm protective spirits or community belief."  
  - **Why**: No recurrence/scaling. "Spirits" is cognitive overreach; could be a family tradition.  

  **Case 2: Bronze Axeheads (Water Deity?)**  
  1. **Material**: Yes (unused, grouped).  
  2. **Context**: *No answer*—Bog deposition ambiguous (ritual? storage? tax evasion?).  
  3. **Behavior**: *No answer*—Single hoard; no repetition. **→ Support: MATERIAL only**.  
  4. **Scaling**: Not reached.  
  5. **Belief?** **STOP** at Step 2.  
  - **Output**: "Evidence shows deliberate deposition of unused axes. Purpose unclear—ritual offering is one possibility."  
  - **Why**: Analogy to "water deity" is unsupported; no symbolic marks or ritual context.  

  **Case 3: Stone Weights (Regulated Market?)**  
  1. **Material**: Yes (ground stone, clustered masses).  
  2. **Context**: Coherent (domestic, not elite).  
  3. **Behavior**: Yes (recurring weights across sites).  
  4. **Scaling**: Yes (30km valley). **→ Support: NORMATIVE**.  
  5. **Institution?** *Hand to person*:  
     - Alternatives: Mutual copying ("everyone uses X weight"), dominant workshop.  
     - Necessity: No evidence of enforcement (e.g., fines) or authority. **→ Institution claim WEAK**.  
  - **Output**: "Evidence shows strong standardization of weights across households. This likely served trade needs but doesn’t prove a regulating institution."  
  - **Why**: Equifinality—your pet theory is possible but not necessary.  

  **IV. Limitations & Handling "Holes"**  
  - **CAN’T DO**:  
    1. **Ethnographic analogy** (e.g., later farming practices). Requires specialist input → label with qualifiers ("possibly," "comparative evidence suggests").  
    2. **Proving belief content** (e.g., "spirits"). Step 5 flags this—replace with neutral terms ("ritual action").  
    3. **Absence-driven claims** (e.g., "no other explanation, so must be ritual"). The procedure rejects these.  
  - **For Unresolved Gaps**:  
    - Use hedges in labels ("may represent," "could indicate").  
    - If evidence < Step 3, omit belief/institution claims entirely.  

  **V. Final Outputs**  
  - **Volunteer Sheet (2 pages)**: [Attached as separate flow].  
  - **Curator Rationale (1 page)**: Focuses on empirical thresholds (material → repetition → scaling) and why belief/institutions require "necessity" evidence. Emphasizes avoiding "just-so stories."  

  This procedure forces explicit evidence grading, mirrors your error-propagation logic, and halts overinterpretation. For your weights case, it correctly blocks the institution leap—mutual copying is parsimonious. Let me draft the volunteer checklist if helpful.
