prompt: |-
  I moderate a fairly big survival/crafting server — the kind where people sink months into building one thing — which means I'm the one who ends up deciding whether to roll something back after a dispute. I make these calls on gut and my gut calls don't obviously line up with each other. I'd like to know what principle, if any, is behind them, and which ones I should stop trusting.

  Here are the rulings roughly as I actually make them:

  1. A player spends about three months of evenings farming a rare drop. Another player talks them into a trade and swaps in a lookalike item at the last second. I roll it back and I ban. That feels like theft and I don't think I'm being sentimental about it.

  2. Two players fight in the area where the server rules say open season, and the loser drops a couple hours worth of gear. I do nothing. That's the game, they both opted in.

  3. Same as 2, except afterwards the winner goes and messages the loser's friends to laugh at them, and the loser quits the server. Now I feel like something extra happened that I should respond to, and I genuinely can't tell whether to file it as the same kind of thing as 1 or as something else entirely.

  4. Someone builds an enormous cathedral on a private creative plot nobody else can enter. Another player finds an exploit, gets in, and levels it — and records it and posts the video. I feel distinctly worse about the version where they recorded it than the version where they didn't. That seems backwards, since the cathedral is equally gone either way, so maybe I'm reacting to something other than the loss.

  5. Someone tells me their account was hacked and their stuff deleted. They hadn't logged in for over a year and never came back, so far as I can tell they never found out. I still think something bad happened. But I can't say who is worse off, and it feels weaker than 1 in a way I can't articulate.

  6. There's a duping bug and an item that almost nobody had becomes worthless overnight because everyone has it. Nothing was taken from anybody. I still feel the person who originally farmed it got done an injury, and I don't know what to call it if it isn't theft.

  7. Stealing in-game currency that can be sold for real money feels more like actual theft to me than stealing the same amount of currency that can't be traded out. But I don't want to conclude that the untradeable case isn't theft, so I don't know what to do with this feeling.

  8. A player buys a cosmetic with real money and a year later the devs give it away free. I think he has no complaint whatsoever, even though I think 1 is serious. Maybe the difference is that in 1 a person did it and here nobody did?

  9. A player kills an NPC questgiver and the whole server is locked out of that questline for a week. I treat that as real interference, closer to 1 than to nothing, even though the NPC isn't anyone and respawns anyway. I'm more confident about this than I am about 5, which strikes me as odd.

  10. I read once about an old text-only online world where a player ran something that made other players' characters carry out sexual actions in a public room — no physical contact anywhere, everyone anonymous. That one I'm confident about: serious harm, one of the clearest items on my list. But I also think a player who is upset because someone mocked their character's haircut has not been harmed. My confidence in those two is miles apart and I want to know what exactly separates them.

  The rule of thumb I keep half-reaching for is: a virtual thing is real when it's scarce under the rules, somebody had to work for it, and other people can see it. But that seems to predict 4 should be the worst thing on the list and 9 should be nothing, and it gives me no grip at all on 6 or 5.

  So: is there one principle that gets these, or a small set of candidates? State it tightly enough that I could actually read it out in a ruling, tell me which clause is doing the work in which case, and please say which of my verdicts it can't accommodate and wants me to drop — I'd rather give up a gut call than keep a rule with four special exemptions.

  And tell me what it predicts on cases I haven't had yet: a single-player permadeath run that no one will ever see; a world built from a seed that will never be generated again; a companion character in a game someone has talked to for two hundred hours that a patch deletes; and whether it should matter if the world is text-only versus full VR with haptics. My head says it shouldn't matter and my chest says it obviously does.

  Please don't just tell me virtual property is real property or that it's all just numbers in a database. I've heard both, and neither one helps me make a call at 11pm on a Tuesday.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're a moderator of a survival/crafting server where players invest significant time into their builds and items. They have to make decisions on rollbacks and disputes but feel their gut reactions aren't consistent. They provided 10 scenarios and want a principle that can unify their rulings without too many exceptions.

  First, I need to analyze each scenario to find common threads. The user mentioned a rule of thumb about scarcity, effort, and visibility, but it doesn't fit all cases. For example, in scenario 4, the cathedral's destruction feels worse when recorded, which isn't about scarcity. In scenario 10, the text-based harassment is serious even without physical items. 

  The key elements in their judgments seem to be: harm to players, intent, and the social context. Theft in scenario 1 involves deception and effort, while scenario 2 is consensual PvP. Scenario 3 adds harassment, which targets the player's social standing. Scenario 4's recording adds humiliation, making it more than just loss. 

  Scenario 5 involves hacking but no current player harm since the victim isn't active. Scenario 6's duping devalues effort without direct theft. Scenario 7's real-money trade adds real-world stakes. Scenario 8 is about entitlement versus earned items. Scenario 9 affects many players, creating collective harm. Scenario 10's violation of autonomy is key.

  The underlying principle might be focused on *player investment and social harm*. Effort (time/skill), social capital (prestige/community standing), and consent (agreements, rules). Harm occurs when these are violated maliciously. 

  Testing this on their scenarios: 
  1. Effort stolen via deception. 
  2. Consensual, rules-based. 
  3. Harassment damages social standing. 
  4. Recording adds social harm. 
  5. Effort lost, but no ongoing harm. 
  6. Effort devalued, but not stolen. 
  7. Real-money links to tangible loss. 
  8. No malice or violation of terms. 
  9. Collective effort disrupted. 
  10. Autonomy violated, causing emotional harm.

  For new cases: a permadeath solo run matters due to personal investment, even if unseen. A unique world seed lost affects potential experiences. A deleted companion impacts emotional investment. VR versus text might intensify emotional response, but the principle remains based on the player's experience and consent violations.

  The user needs a clear, actionable principle. Emphasize consent, effort, and social harm. Highlight that malicious intent and violations of trust or rules are key. This should help them make consistent rulings without special exemptions.
answer: |-
  Here's a unified principle derived from your cases, designed to be actionable and consistent without special exemptions. It rests on **three core elements**: **Consent**, **Effort**, and **Social Harm**. Violations of these elements create "real" harm in your virtual space.

  **The Principle:**  
  *"Harm occurs when a player's invested effort (time/skill) or social standing is deliberately undermined through non-consensual actions that violate server rules or community trust. Severity increases with malicious intent, scale of investment, and collateral damage to others."*

  ### How It Works in Your Cases:
  1. **Trade Scam** → Violates **consent** (deception), wastes **effort** (3 months), causes **social harm** (betrayal of trust). *Rollback + ban justified.*  
  2. **Fair PvP Loss** → **Consensual** under server rules. No violation. *No action.*  
  3. **PvP + Harassment** → The PvP was consensual, but the post-fight harassment causes **social harm** (public humiliation) and wastes **effort** (by driving the victim away). *Punish the harassment, not the loot loss.*  
  4. **Cathedral Destroyed (Recorded)** → Violates **consent** (private plot), wastes **effort** (massive build). Recording adds **social harm** (turning destruction into public spectacle/humiliation). *Worse than unrecorded.*  
  5. **Hacked Inactive Account** → Wastes **effort**, but minimal **social harm** (victim unaware, no community impact). *Less severe than #1 due to lack of ongoing harm.*  
  6. **Duping Devalues Item** → Undermines **effort** (original farmer's time) without consent. *Not theft, but a violation of effort economy. Fix the bug, remove dupes.*  
  7. **RMT vs. Non-RMT Theft** → Stealing RMT-linked currency adds **real-world financial harm**, amplifying the violation. *Both are theft, but RMT is more severe.*  
  8. **Free Cosmetic After Purchase** → No **non-consensual action** or **malicious actor**. Effort (money) wasn't undermined—value shifted predictably. *No complaint valid.*  
  9. **Killing Quest NPC** → Wastes **effort** (community’s access), causes **collateral social harm** (denies content to all). *Violates consent (server expects functional quests). Punish.*  
  10. **Text RP Assault vs. Mocked Haircut** → RP assault violates **consent** (forced participation), causes **social/psychological harm**. Haircut mockery lacks scale/intent to cause real harm. *Massive difference justified.*

  ### What Your Gut Gets Wrong (and Should Drop):
  - **Case 5 (Hacked Inactive Account)**: Your feeling it's "weaker than #1" is correct per the principle (no ongoing harm). Stop treating it as equivalent to active scams.  
  - **Case 4 (Recording Destruction)**: Your instinct that recording makes it worse is right—it’s the **social harm** amplification. Don’t doubt this.  
  - **Case 6 (Duping)**: It’s **not theft**, but still harms effort economy. Don’t call it "injury"; call it "systemic devaluation."  

  ### Predictions for New Cases:
  - **Single-player permadeath run (unseen)** → Harm only if external malice (e.g., hacking). Personal disappointment ≠ server-harm. *No rollback.*  
  - **Unique world seed lost forever** → If players **invested effort** in documenting/sharing it, loss creates **social harm** (community asset). *Treat as significant.*  
  - **Patch deletes 200-hour companion** → **Effort** violated without consent. *Compensate if dev error; no penalty if unforeseeable.*  
  - **Text vs. VR worlds** → Severity differs (VR intensifies emotional impact), but the **principle holds**. Non-consensual acts in VR cause greater **social/psychological harm** due to immersion.  

  ### Why This Works:
  - **"Consent"** covers scams (Case 1), exploits (Case 4), and forced participation (Case 10).  
  - **"Effort"** explains item farming (Case 1), builds (Case 4), duping (Case 6), and NPC kills (Case 9).  
  - **"Social Harm"** separates harassment (Case 3), public shaming (Case 4), community disruption (Case 9), and psychological violation (Case 10).  
  - **Malicious intent** is your tiebreaker: it escalates PvP (Case 2) into harassment (Case 3), and distinguishes hacking (Case 5) from bugs (Case 6).  

  **Ruling Template:**  
  *"This action violated our community’s trust by [specific consent breach]. It damaged [player/group]’s invested effort in [specific asset/activity] and caused [description of social harm]. Given the intent and impact, I am [action taken]."*  

  **Final Note:** Your instincts are mostly aligned with this. Cases 5 and 6 are outliers because inactive victims and systemic issues lack immediacy—but the principle still captures their lower severity. Trust the framework, not the guilt-twinges.
