answer: |-
  Below is a comprehensive, runnable 90-minute role-play exercise designed for your summer school session. It forces participants to confront the ambiguities and consequences of labeling mass atrocities through a fictional case study. The exercise is structured as a high-pressure editorial conference where participants must produce a one-sentence lead for a breaking news story. I've included all materials, a minute-by-minute timeline, rules, and a debrief plan.

  ---

  ### **Exercise Title:** *The Veridian Dilemma: What Do We Call It?*

  #### **Fictional Case Study**  
  **Country:** The Republic of Veridia (fictional Central African nation; avoids real-world parallels).  
  **Targeted Group:** The **Lumina** people.  
  - **Perpetrators' Classification:** The Veridian government labels Lumina as a "**caste-based insurgency**" (a social/political category). They claim Lumina are violent dissidents resisting state modernization.  
  - **Victims' Self-Identification:** Lumina survivors define themselves as an **ethnic group** with distinct language, ancestral ties to the Veridian highlands, and cultural practices. The national census recognizes ethnicity, but omits "Lumina" as a category (listing them as "Highlanders" instead).  
  **Atrocity:** "Operation Clearance" – Veridian military attacks on Lumina-majority villages, mass executions, forced displacement, and destruction of cultural sites.  

  **Why This Works for Ambiguity:**  
  - Straddles the Genocide Convention's protected group (ethnic) vs. excluded group (social/political).  
  - Creates tension: Is this "ethnic cleansing" or "genocide"? The convention covers ethnic groups, but not social/political ones.  

  ---

  ### **Roles & Materials**  
  *Assign roles randomly; all participants are part of a newsroom deciding what to publish. Use name tags.*  

  | Role              | # People | Materials Provided (Printed Handouts) |
  |-------------------|----------|---------------------------------------|
  | **Reporters**     | 6        | **Field Dispatch 1:** Initial on-ground account (500–700 dead; quotes military: "We target caste saboteurs"). <br> **Source Notes:** Survivor testimonies (mixed ethnic/caste references). |
  | **Foreign Editors** | 4        | **Style Guide Excerpt:** "Avoid legal terms without verification." <br> **Risk Assessment:** "Veridia govt. threatens visa bans for 'biased' reporting." |
  | **Legal Reviewer** | 2        | **Genocide Convention Cheat Sheet:** Only Article II (definition) – *not full text*. Full text costs time (see rules). |
  | **Social Media Editor** | 2 | **Audience Metrics:** "Readers engage 70% more with 'genocide' but 40% distrust 'legalistic' terms." |
  | **Managing Editor** | 2        | **Consequence Cards** (sealed; one set per team). **Deadline Countdown Timer.** |

  **External Voices (Pre-Recorded Audio/Video or Read by Facilitators):**  
  - **Survivor 1 (Elder):** "This is genocide! They burn our history because we are *Lumina*."  
  - **Survivor 2 (Youth Activist):** "Don’t call it genocide. They see us as ‘rebels,’ not a race. That word will make Veridia bomb us harder."  
  - **UN Diplomat (Leaked Audio):** "Evidence suggests ethnic targeting... but verify intent."  

  ---

  ### **Rules to Enforce Fiction**  
  1. **No Real-World References:** "Veridia is fictional; apply only provided facts."  
  2. **Blind Consequences:** Teams draw a sealed **Consequence Card** only *after* finalizing their sentence.  
  3. **Treaty Access Cost:** To read the full Genocide Convention (beyond Article II), teams must "pay" by delaying publication (lose front page).  
  4. **No Internet/Devices:** All info comes from handouts or facilitator cues.  
  5. **Time Pressure:** Strict adherence to the timeline; use a visible countdown timer.  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **Phase 1: Setup & Initial Decision (20 mins)**  
  - **0:00–0:05** (5 mins): **Intro.** Briefly frame the exercise: "You’re the editorial team of *The Global Chronicle*. Veridia is unfolding. File a breaking news lead *now*." Hand out role packets.  
  - **0:05–0:15** (10 mins): **First Editorial Conference.** Teams draft a 1-sentence breaking news alert (e.g., "Veridian forces massacre hundreds in ethnic crackdown"). *No treaty access yet.*  
    - *Crucial Twist:* Intent evidence is withheld.  
  - **0:15–0:20** (5 mins): **Teams File Alerts.** Collect sentences visibly (whiteboard or slide).  

  #### **Phase 2: New Information & Pressure (25 mins)**  
  - **0:20–0:22** (2 mins): **Intent Evidence Revealed.**  
    - Handout: **"Intercepted Military Order:** 'Liquidate all Lumina leadership. Erase their heritage.'"  
    - Handout: **President’s Speech:** "We cleanse Veridia of parasitic castes."  
  - **0:22–0:27** (5 mins): **Survivor Voices.** Play recordings (or read). Highlight disagreement.  
  - **0:27–0:30** (3 mins): **Death Toll Revision.** Handout: **"UN Revises Estimate: 2,000+ Dead."**  
  - **0:30–0:35** (5 mins): **Treaty Access Dilemma.** Announce: "Full Genocide Convention text available... but takes 15 mins to analyze. If you use time for this, you miss the front-page slot."  
  - **0:35–0:45** (10 mins): **Second Editorial Conference.** Teams debate the final sentence. Must decide:  
    - Word choice: "massacre," "atrocity," or "genocide"?  
    - Hedge wording (e.g., "alleged," "suggesting").  
    - Whether to access treaty (if yes, they "lose" front page).  

  #### **Phase 3: Final Decision & Consequences (20 mins)**  
  - **0:45–0:50** (5 mins): **Teams Submit Final Sentence** (e.g., "Veridia commits genocide against Lumina, UN reports 2,000 dead").  
  - **0:50–0:55** (5 mins): **Consequences Revealed.** Teams draw **Consequence Cards** (prepared sets below).  
  - **0:55–1:05** (10 mins): **Defense & Cross-Team Debate.** Each team justifies their word/hedge. Others question.  

  #### **Phase 4: Debrief (25 mins)**  
  - **1:05–1:30** (25 mins): Facilitated discussion (see debrief guide below).  

  ---

  ### **Consequence Cards (Draw Blindly After Sentence Submission)**  
  *Each card lists outcomes for their chosen word. Teams draw one card per choice (e.g., if they chose "genocide," they draw from the "genocide" stack).*  

  | Word Chosen | Example Consequences (Tailor to Sentence) |  
  |-------------|------------------------------------------|  
  | **"Genocide"** | "Veridia expels your reporters. Neighboring state (Kaya) implicated in arms supply threatens libel suit. Survivor faction praises you; another accuses sensationalism." |  
  | **"Atrocity"** | "Veridia grants visa extensions but limits access to military sources. Exile groups protest 'soft-pedaling.' Legal team warns the term is defensible but vague." |  
  | **"Massacre"** | "Veridian officials leak you exclusive footage. UN withdraws interview access. Readers accuse you of 'burying' the story." |  

  **For "Treaty Access" Users:** Add: "Story runs on page 3. Competitor breaks front-page news with death toll update."  

  ---

  ### **Debrief Guide (25 Mins)**  
  **Goal:** Connect exercise moments to real-world dilemmas.  

  1. **Predictable Tensions (5 mins):**  
     - *"Just describe the facts!"* → Point out: **The lead sentence forces framing.** Neutrality is a myth; word choice has weight (e.g., "massacre" vs. "genocide").  
     - *"You rigged it by hiding facts!"* → **Use this!** Explain: "In real crises, intent evidence *emerges slowly*. You must publish with incomplete data. This is why ‘genocide’ labels often lag."  

  2. **Map Exercise to Real Issues (10 mins):**  
     - **Ambiguous Group:** "Lumina straddled ethnic/social lines. Convention excludes social groups. Did this uncertainty shape your choice?"  
     - **Intent & Timing:** "You filed the alert *before* the intercepted order. How did that force hedging?"  
     - **Death Toll Revision:** "The jump to 2,000+ tests ‘in part’ (Convention Art. II). If Lumina are 100,000 people, is 2% ‘in part’? Real cases hinge on this."  
     - **Survivor Disagreement:** "One survivor invoked identity; another feared escalation. How did you weigh lived experience against legal precision?"  
     - **Costs:** "Consequences made the treaty’s ‘switch’ tangible. Calling it ‘genocide’ triggers legal duties (e.g., UN intervention); calling it ‘atrocity’ may feel morally inadequate."  
     - **Speed vs. Accuracy:** "Treaty access cost the front page. In reality, waiting for ‘proof’ can mean silence as killings continue."  

  3. **What the Game Can’t Simulate (5 mins):**  
     - **Real Stakes:** "Your choice affects visas; real choices affect lives. A ‘genocide’ label can mobilize aid—or justify invasion."  
     - **Decades-Long Process:** "Labels evolve (e.g., Rwanda). What’s ‘genocide’ today may be contested for years."  
     - **Lemkin’s Vision:** "The 1948 Convention narrowed Lemkin’s 1944 definition (which included cultural destruction). Today, we stretch ‘genocide’ to fit modern horrors, creating tension."  

  4. **Closing (5 mins):**  
     - "You walked in thinking labeling was about facts. You walked out knowing it’s a *move*—with legal, diplomatic, and human consequences. Tomorrow, you’ll report differently."  

  ---

  ### **Why This Works**  
  - **Structural Knots:** Ambiguous group, intent timing, death toll revision, survivor dissent, and costs are built into decision points.  
  - **Role-Play Feels Real:** Editors/reporters *must* produce a sentence under pressure. Consequence cards make risks visceral.  
  - **Flexible:** For 16 people, split into 2 teams of 8. Assign roles within teams. Use one room with separate tables.  
  - **Logistics:** Print handouts in advance. Use a timer app. Pre-record survivor voices for impact.  

  **Materials to Prep:**  
  1. Role packets (8 sets per team).  
  2. Consequence cards (3 sets per team).  
  3. Handouts: Initial dispatch, intent evidence, revised death toll, survivor quotes.  
  4. Timer and whiteboard for sentences.  

  This exercise ensures participants *feel* the weight of words—not just hear about it. They’ll leave debating whether they chose right, which is exactly what you want.
