  We are designing a 90-minute role-play exercise for a group of 16 foreign correspondents and editors. The goal is to have them experience the complexities and consequences of labeling a mass atrocity, particularly the use of the word "genocide." The exercise should force them to make editorial decisions under pressure, with incomplete information, and with real consequences for each choice.

