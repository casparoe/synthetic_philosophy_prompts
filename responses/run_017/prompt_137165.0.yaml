      - 0.6: 5 cards (3 LTU, 2 non-LTU)
      - 0.8: 5 cards (4 LTU, 1 non-LTU)
    - Mill: 20 cards
      - 0.2: 10 cards (2 LTU, 8 non-LTU)
      - 0.4: 5 cards (2 LTU, 3 non-LTU)
      - 0.6: 5 cards (3 LTU, 2 non-LTU)
      - 0.8: 0 cards
    - On the face: case number, first name, ward, score.
    - On the back: marked as long-term unemployed or not (or leave blank and then have a separate key? but we want them to turn over to see).

   Alternatively, have the outcome on the back hidden.

  - Printed worksheet for audit: with spaces to fill in for each ward:
    - Threshold chosen (for first beat) or flagging proportions per score (second beat)
    - Total flagged, true positives, false positives, false negatives, true negatives.
    - FPR, FNR.
    - Also, for the mission: number of true positives.

  - Rules memo (one page) in the agency's voice.

  - Payoff scheme explained.

  - Timeline.

  - Facilitator script.

  - Debrief notes.

  ### Timeline (90 minutes)
  - Introduction: 5 minutes
  - First beat: 20 minutes
    - Teams set thresholds to get as close to 15 as possible (but must be exactly 15? With the original deck and 15 stipends, they can achieve 15 in two ways).
    - They commit, turn over the cards, and fill in the worksheet.
    - They discover error rates don't match.
  - Second beat: 20 minutes
    - Facilitator hands out the legal note allowing treating identical files differently.
    - Teams can now set fractions per score group (with monotonicity: the fraction must be non-decreasing with score).
    - They try to match error rates and maximize true positives.
    - They fill in the worksheet and see that they can match error rates, but at the cost of flagging different fractions in the two wards at the same score.
  - Third beat: 20 minutes
    - Facilitator introduces that due to privacy reasons, the agency will only track outcomes for a subset. For example, they only observe outcomes for the flagged group (or only for the non-flagged group). The choice of which group to observe is up to the team, but it will affect what they can audit.
    - Teams choose which group to observe (either the flagged or the non-flagged) and then only get to turn over those cards.
    - They try to fill in the audit worksheet but find they are missing data for the other group.
  - Debrief: 25 minutes

  ### Facilitator Script
  - Introduction: "You are analysts at the public employment agency. You have to allocate 15 retraining stipends. You have a risk score for each claimant. Your task is to flag exactly 15 claimants to receive the stipend and also be subject to mandatory weekly reporting. The score is calibrated within each ward. You must comply with the three rules: calibration (which is given), equal false positive and false negative rates between wards, and within each ward, no one with a higher score may be left unflagged while a lower score is flagged. You also want to maximize the number of stipends going to those who would be long-term unemployed."
  - First beat: "You must set a threshold for each ward and flag everyone at or above that threshold. Find thresholds that flag exactly 15 people."
  - After they commit and turn over: "Fill in the audit worksheet. Do the error rates match?"
  - Second beat: "Legal has clarified: you may flag a subset of claimants at a given score. So for each score in each ward, you can choose to flag any number between 0 and the total at that score, as long as the proportion does not decrease as scores increase. Now try to exactly match the error rates between wards while flagging exactly 15."
  - Third beat: "Due to new privacy guidelines, you will only be able to observe the employment outcome after six months for either the group you flagged or the group you did not flag. Choose which group you will observe. You will only get to turn over the cards in that group. Now fill in the audit worksheet. What can you still compute?"

  ### Debrief
  - Map to fairness criteria:
    - First beat: They encountered that with thresholds and whole groups, they couldn't achieve equal FPR and FNR. This is the trade-off between equalized odds and other constraints.
    - Second beat: To achieve equalized odds (equal FPR and FNR), they had to violate the idea that the score is the only thing that matters: they flag by group at the same score. This is disparate impact by group at the same score.
    - Third beat: They see that error rates require observing both flagged and non-flagged, which is not always possible in practice.

  - Introduce the names:
    - Calibration: within each group, the score equals the probability of LTU.
    - Equalized odds: equal FPR and equal FNR across groups.

  ### Failure Modes
  1. **Base-rate gap is a product of past decisions**: Acknowledge that the base rates are given for this exercise, but in reality, they may be shaped by historical factors. The game illustrates the mathematical tension given the current data.
  2. **Declaring small gaps close enough**: The payoff scheme doesn't directly penalize small gaps. To handle, in the debrief, discuss the impossibility theorem which is about exact equality.
  3. **Groups finishing at different speeds**: Have extension activities: if a group finishes early, challenge them to maximize true positives subject to the error rates being within a bound, or to try the third beat early.

  ### What the Game Cannot Reproduce
  - **Generality**: The impossibility result holds for more than two groups and for general score distributions. The game uses two groups and a specific deck.
  - **Dynamic effects**: In reality, the act of flagging might change the population (e.g., by providing training, it changes the chance of being LTU). The game is static.

  We'll have to state these in the debrief.

  ### Rules Memo for Participants

  **MEMORANDUM**

  **To:** Algorithmic Decision-Making Team  
  **From:** Director, Public Employment Agency  
  **Subject:** Stipend Allocation and Reporting Requirement  

  The agency has received 15 retraining stipends for distribution among claimants in the Harbor and Mill wards. A risk score (provided by a vendor) ranges in {0.2, 0.4, 0.6, 0.8} and is calibrated within each ward: the score equals the probability of long-term unemployment (LTU) for claimants in that ward with that score. 

  You must:  
  1. **Flag exactly 15 claimants** to receive the stipend. Flagged claimants will also be subject to mandatory weekly reporting, which is burdensome.  
  2. **Ensure the score's meaning is consistent**: Among claimants with the same score, the share who turn out to be LTU must be the same in Harbor and Mill. (This is already true by the vendor's guarantee.)  
  3. **Equal error rates**: The false positive rate (share of non-LTU claimants who are flagged) and false negative rate (share of LTU claimants who are not flagged) must be equal between Harbor and Mill.  
  4. **Within each ward, maintain score monotonicity**: If a claimant with a higher score is unflagged, then no claimant with a lower score may be flagged.  

  Your primary mission is to allocate as many stipends as possible to claimants who would otherwise be LTU (true positives).  

  **Procedure**:  
  - You will receive a deck of 40 claimant cards (20 from Harbor, 20 from Mill). Each card shows a case number, first name, ward, and score.  
  - The outcome (LTU or not) is hidden on the back.  
  - In the first round, set a threshold for each ward. Flag all claimants in the ward with scores at or above the threshold. The total must be 15.  
  - After turning over the cards, complete the audit worksheet to check compliance and mission success.  

  **Scoring**:  
  - +10 points for each true positive (LTU flagged)  
  - -5 points for each false positive (non-LTU flagged)  
  - -20 points for each stipend not used (if you flag fewer than 15) or for each extra flag beyond 15 (if you flag more than 15)  

  Good luck. We are counting on you to serve our claimants fairly and effectively.  

  ### Conclusion
  The game will illustrate the tensions in algorithmic fairness without lecturing. The deck has been adjusted by changing the stipends to 15 to make the first beat feasible. The three beats proceed as described, and the debrief connects the experience to the broader concepts.
