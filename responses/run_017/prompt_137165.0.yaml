  ### Third Beat
  We introduce that the outcome (LTU or not) is only observed for a subset. For example:
  - The agency only for the people they flag, they see the outcome after six months. For the people they don't flag, they don't know the outcome.
  - Or vice versa.

  Then, when they try to compute error rates, they can only compute partial information.

  For example, if they only observe the outcome for the flagged, then they can compute:
  - True positives and false positives (so they can compute precision, and if they know the base rate, they might infer, but they cannot compute FPR or FNR because FPR requires knowing the non-LTU in the entire ward, and FNR requires knowing the LTU in the entire ward).

  Specifically:
  - If they only observe the outcome for the flagged, they can compute:
    - The number of true positives and false positives in the flagged set.
    - But they cannot compute false negatives or true negatives because they don't observe the non-flagged.
    - So they cannot compute FPR or FNR.

  Similarly, if they only observe the non-flagged, they can compute true negatives and false negatives, but not false positives or true positives.

  In the game, we can have the teams' decisions determine which cards they are allowed to turn over. For example, they only get to turn over the cards they flagged (or only the ones they didn't flag) to see the outcome.

  Then, when they try to fill in the audit worksheet, they will have missing data.

  ### Materials and Preparation
  - Decks: 40 cards per team (4-5 teams). 
