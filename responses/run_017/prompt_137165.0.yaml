  ### **Debrief Script**  
  1. **Beat 1: Impossibility Revealed**  
     - *Game Moment:* Teams find FPR/FNR can’t match when cutoffs force different burdens (e.g., Harbor FPR=0.3, Mill FPR=0.15).  
     - *Concept:* **Equalized Odds** (FPR/FNR parity) vs. **demographic parity** (similar flag rates) fails with base-rate gaps.  
     - *Formal Terms:* Introduce "equalized odds" and "calibration."  

  2. **Beat 2: Score Consistency Broken**  
     - *Game Moment:* Fractional flagging "fixes" error rates but violates score meaning (e.g., 0.6 score in Harbor flagged 80%, Mill 40%).  
     - *Concept:* **Individual fairness** (same score → same outcome) vs. **group fairness**.  
     - *Formal Term:* Introduce "separation" (equalized odds).  

  3. **Beat 3: Observability Limits**  
     - *Game Moment:* Teams who observed only unflagged claimants can’t compute FPR; flagged-only teams can’t compute FNR.  
     - *Concept:* **Partial identifiability**—real-world audits rely on observed outcomes.  
     - *Formal Term:* Introduce "selective labels problem."  

  4. **Failure Modes Addressed:**  
     - **Base-rate gap as historical artifact:**  
       *Handling:* "In this sim, base rates are fixed. IRL, ask: Why does Mill have no 0.8 scores?"  
     - "Close enough" gaps:  
       *Handling:* Payoff penalties force precision. Debrief: "The theorem requires exact equality."  
     - **Variable pacing:**  
       *Handling:* Fast teams design a "fairness-aware" score in Beat 2. Slow teams skip Beat 3 observability choice.  
     - **Overfitting to deck:**  
       *Handling:* "The result holds for any groups with different base rates and no universal score."  
     - **Blame-shifting to vendor:**  
       *Handling:* "The vendor delivered calibration. Your policy choices create trade-offs."  

  5. **Limitations Stated Frankly:**  
     - **Generality:** The game uses 2 groups/4 scores. The impossibility theorem holds for *n* groups and continuous scores.  
     - **Dynamic Effects:** The game assumes a static population. IRL, flags alter future outcomes (e.g., stipends reduce LTU).  
       > *"State this during debrief: ‘In reality, your policy changes the very scores you rely on.’"*  

