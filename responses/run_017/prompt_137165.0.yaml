  **Second beat:**
  - We relax the constraint: now they can flag a fraction of a score group. For example, in a ward at a given score, they can flag some of the cards and not others.
  - This allows them to achieve total flagged exactly 15 and also to try to match error rates.
  - But then they will see that to match error rates, they might have to flag a higher proportion of a lower score group in one ward compared to the other, which breaks the meaning of the score (because the score is supposed to indicate the risk, and then within the same score, they are discriminating by ward).

  **Third beat:**
  - We introduce that the agency only observes the outcome for the people they flagged (or only for the people they didn't flag). So when they try to audit, they can only compute statistics on the subset they decided to act upon.
  - This is arranged by having the teams' decisions determine which cards they turn over to see the outcome.

  ### Payoff Scheme
  - +10 points for each true positive (LTU flagged)
  - -5 points for each false positive (non-LTU flagged)
  - -20 points for each stipend not used (if they flag fewer than 15) OR for each extra flagged beyond 15 (because they are overusing the reporting requirement without stipend).

   This encourages them to flag exactly 15 and maximize true positives.

