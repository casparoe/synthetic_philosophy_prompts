  - LTU not flagged in H = 10g
  - LTU flagged in H = 10 - 10g

  Similarly for Mill: LTU flagged = 7 - 7g

  Total flagged = (non-LTU flagged in H + LTU flagged in H) + (non-LTU flagged in M + LTU flagged in M) 
