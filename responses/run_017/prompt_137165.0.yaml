     - **False Negative Rate (FNR):** Share of *LTU* claimants *not* flagged must match in Harbor and Mill.  
  3. **Monotonicity:** Within a ward, no claimant with a higher score may be unflagged while a lower-score claimant is flagged.  

  #### **Mission Objective**  
