  ### Contractor Performance Ranking Procedure  
  **Effective Date:** [Insert Date]  
  **Issued by:** Outcomes-Analysis Unit, State Workforce Agency  

  ---

  ### I. Purpose  
  This procedure ranks contractors based on job placement rates, addressing two distinct questions:  
  1. **Contractor Performance:** Is the contractor doing a worse job with the clients it accepted?  
  2. **Agency Outcomes:** Is the agency buying worse outcomes for the mix of clients assigned?  
  Rankings rely solely on pre-enrollment data (measured at intake). Post-enrollment variables (e.g., workshop completion) are excluded as they reflect contractor influence. Two rankings are produced:  
  - **Unadjusted Ranking (Agency Outcomes):** Based on raw placement rates. Determines contract renewal/bonuses.  
  - **Adjusted Ranking (Contractor Performance):** Adjusted for client difficulty using pre-enrollment variables. Guides improvement plans and appeals.  

  ---

  ### II. Step-by-Step Procedure  
  **Step 1: Calculate Unadjusted Placement Rate**  
  - **What:** Compute each contractor’s share of clients placed into a job above the wage threshold within 6 months.  
  - **Sufficient Answer:** A single rate per contractor.  
  - **Stop Here If:** Contractors have ≤30 clients total (proceed to Step 2 but flag instability).  
  - **Tools:** Spreadsheet count of placements divided by enrolled clients.  

  **Step 2: Admissibility of Adjustment Variables**  
  - **Test:** Is the variable measured **before or at enrollment**? Confirm:  
    - Date of measurement ≤ enrollment date.  
    - Value assigned by agency staff (not contractor).  
    - Not modified post-enrollment.  
  - **Sufficient Answer:** Pre-enrollment variables (e.g., barrier index, age, location) are admissible. Post-enrollment variables (e.g., workshop attendance) are **inadmissible**.  
  - **Stop Here If:** Only inadmissible variables explain performance gaps. Proceed to Step 3 if admissible variables exist.  
  - **Handoff:** Agency Director approves the list of admissible variables annually.  

  **Step 3: Define Weighting Standard**  
  - **What:** Assign weights to standardize client-mix differences.  
  - **Rule:** Use the **full agency population** (all clients across contractors) as the standard.  
  - **What It Settles:** Estimates "How would this contractor perform if they served the agency’s typical client mix?"  
  - **Who Decides:** Agency Director (policy choice; default is full agency population).  
  - **Output:** Strata sizes (e.g., barrier index categories) in the standard population.  

  **Step 4: Adjust for Client Difficulty**  
  - **Method:** Logistic regression predicting placement from:  
    - Contractor indicator variables.  
    - Admissible pre-enrollment variables (Step 2).  
    - Weighted to the standard population (Step 3).  
  - **Sufficient Answer:** Adjusted placement rate per contractor.  
  - **Stop Here If:**  
    - Sample size <30 per contractor (use unadjusted rate with instability warning).  
    - No admissible variables remain after Step 2 (use unadjusted ranking).  

  **Step 5: Disaggregation Stopping Rule**  
  - **Test:** Disaggregate only if:  
    - Strata in the standard population have ≥30 clients.  
    - Contractor has ≥15 clients per stratum.  
  - **If Strata Are Too Small:**  
    - Collapse strata (e.g., combine barrier index categories) until size thresholds are met.  
    - If collapse is impossible (e.g., nominal variables), **do not disaggregate**. Use regression from Step 4.  
  - **Reversal Handling:**  
    - If a reversal (e.g., worst overall, best in strata) occurs but strata are too small, **discard the reversal** as unstable. Proceed with unadjusted ranking.  
  - **Output:** Final adjusted ranking (Contractor Performance).  

  **Step 6: Generate Final Rankings**  
  - **Ranking A (Agency Outcomes):** Unadjusted rates (Step 1).  
  - **Ranking B (Contractor Performance):** Adjusted rates (Step 4).  
  - **Consequences:**  
    - **Renewal/Bonuses:** Based on Ranking A.  
    - **Improvement Plans/Appeals:** Based on Ranking B.  

  ---

  ### III. Limitations  
  This procedure **cannot**:  
  - **Prove causation** (e.g., contractor actions directly caused outcomes).  
  - **Adjust for unmeasured confounders** (e.g., local economic conditions).  
  - **Validate client assignment fairness** (e.g., why difficult clients go to specific contractors).  
  - **Resolve Ranking A vs. Ranking B conflicts** (they reflect different goals).  
  - **Eliminate small-sample uncertainty** (contractors with <30 clients are high-risk).  
  **The board must not treat rankings as infallible verdicts.** They are observational snapshots subject to data constraints.  

  ---

  ### IV. Application to Cases  
  *Assumptions: Barrier index, rural/urban, age, and education are admissible pre-enrollment variables. Workshop attendance is inadmissible (post-enrollment).*  

  **Case 1: Contractor Worst Overall, Best in Every Barrier Stratum**  
  - **Step 1 (Unadjusted):** Worst placement rate → Bottom tier (Ranking A).  
  - **Step 2 (Admissibility):** Barrier index is admissible (pre-enrollment).  
  - **Step 3 (Weighting):** Full agency population standard.  
  - **Step 4 (Adjustment):** Regression adjusts for barrier index. Reversal persists → Adjusted rate ranks top (Ranking B).  
  - **Step 5 (Disaggregation):** Strata are large (no collapse needed).  
  - **Outcome:**  
    - **Ranking A (Agency Outcomes):** Bottom tier → Contract not renewed.  
    - **Ranking B (Contractor Performance):** Top tier → No improvement plan. Bonus ineligible due to non-renewal.  
  - **Appeals Defense:**  
    > "Your unadjusted ranking (Agency Outcomes) is poor because you were assigned harder clients. However, your adjusted ranking (Contractor Performance) is top-tier, confirming you excel with those clients. Renewal decisions prioritize overall agency outcomes (Ranking A). We will audit client assignment processes to address systematic imbalances."  

  **Case 2: Contractor’s Deficit Disappears Only with Post-Enrollment Variables**  
  - **Step 1 (Unadjusted):** Worst placement rate → Bottom tier (Ranking A).  
  - **Step 2 (Admissibility):** Workshop completion measured post-enrollment → **Inadmissible**.  
  - **Stop at Step 2:** No further adjustment.  
  - **Outcome:**  
    - **Ranking A (Agency Outcomes):** Bottom tier → Contract not renewed.  
    - **Ranking B (Contractor Performance):** Same as Ranking A → Improvement plan mandated.  
  - **Appeals Defense:**  
    > "Workshop completion is influenced by your actions (e.g., quality of training). Adjusting for it would mask your performance. Only pre-enrollment variables are admissible. Your adjusted ranking remains bottom-tier."  

  **Case 3: Small Rural Contractor, Unstable with Disaggregation**  
  - **Step 1 (Unadjusted):** Worst placement rate → Bottom tier (Ranking A).  
  - **Step 2 (Admissibility):** Rural location and barrier index admissible.  
  - **Step 3 (Weighting):** Full agency population standard (mostly urban).  
  - **Step 4 (Adjustment):** Regression adjusts for rural + barriers. Adjusted rate remains low due to weighting to urban-heavy standard.  
  - **Step 5 (Disaggregation):**  
    - Attempt to disaggregate by rural + barrier strata.  
    - Strata have 6–12 clients → **Too small** (violates 15-client threshold).  
    - Collapse barrier categories? If impossible (nominal barriers), **discard disaggregation**.  
    - Reversal (if any) discarded as unstable.  
  - **Outcome:**  
    - **Ranking A (Agency Outcomes):** Bottom tier → Contract not renewed.  
    - **Ranking B (Contractor Performance):** Adjusted rate still low → Improvement plan.  
  - **Contrary to Inclination:**  
    You may wish to retain this contractor due to rural challenges, but the procedure recommends non-renewal.  
  - **Appeals Defense:**  
    > "Your unadjusted ranking is worst, and adjustment for rural location did not improve it because the standard population is urban-majority. Disaggregation was unstable (strata <15 clients). While rural clients face barriers, the agency’s outcomes for your assigned mix (Ranking A) are poor. We recommend recompeting the contract with rural-specific requirements."  

  ---

  ### V. Costs of Simplification  
  - **Pre-Specified Variables:** We exclude variables not pre-approved (e.g., transportation access).  
    *Cost: May miss relevant confounders. Mitigation: Annual review of variables.*  
  - **Weighting Standard:** Full agency population may disadvantage specialized contractors (e.g., rural).  
    *Cost: Rural contractors penalized for urban performance. Mitigation: Report rural subgroup analysis separately.*  
  - **Regression over Matching:** Logistic regression is used instead of exact matching for speed.  
    *Cost: Assumes linear effects. Mitigation: Validated with agency data annually.*  
  - **Small Samples:** Contractors with <30 clients use unadjusted rates.  
    *Cost: High volatility. Mitigation: Flag results as unstable.*  

