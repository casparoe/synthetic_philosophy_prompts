  --- 

  **Procedure for Contractor Performance Ranking**

  **I. Purpose and Overview**

  This document outlines the procedure for ranking contractors based on job placement rates. The ranking has two objectives:

  1. To assess the overall outcomes the agency is achieving for the mix of clients assigned to each contractor (Ranking A: unadjusted).
  2. To evaluate each contractor's performance with the clients they accepted, accounting for differences in client difficulty (Ranking B: adjusted for pre-enrollment variables).

  Both rankings are reported. Ranking A is used for contract renewal and performance bonuses. Ranking B is used for improvement plans and to address appeals regarding client difficulty.

  **II. Definitions**

  - **Outcome**: A binary indicator for whether a client was placed into a job above the wage threshold within six months of enrollment.
  - **Client**: An individual enrolled in a contractor's program during the assessment period.
  - **Pre-enrollment variables**: Variables measured at or before enrollment, not influenced by the contractor. We pre-specify: barrier index (composite of prior incarceration, no high-school credential, limited English, unstable housing), rural/urban status, age group (18-24, 25-34, 35-44, 45-54, 55+), and gender (if available).
  - **Standard population**: The entire client population across all contractors during the assessment period.

  **III. Steps**

  1. **Calculate the unadjusted placement rate (Ranking A)**:
     - For each contractor, compute the placement rate as the number of placed clients divided by the total clients.
     - Rank the contractors by this rate (highest to lowest).

  2. **Check sample size**:
     - If a contractor has fewer than 30 clients, do not compute an adjusted rate (Ranking B) for that contractor. Use the unadjusted rate for both rankings, and attach a warning: "Small sample size: results are unstable."
     - If the sample size is 30 or greater, proceed to adjustment.

  3. **Admissible variables**:
     - Use the pre-specified pre-enrollment variables: barrier index, rural/urban, age group, and gender.
     - Verify that each variable was measured at or before enrollment (date of measurement in the record is on or before the enrollment date).

  4. **Regression adjustment for Ranking B**:
     - Fit a logistic regression model on the entire dataset (all contractors):
          `logit(placement) ~ contractor + barrier_index + rural + age_group + gender`
     - For each contractor, compute the adjusted placement rate as follows:
          a. For every client in the standard population, predict the probability of placement as if they were served by that contractor (using the model coefficients for that contractor and the client's own pre-enrollment variables).
          b. Average these probabilities to get the adjusted rate for the contractor.
     - Rank the contractors by this adjusted rate (Ranking B).

  5. **Handling rural contractors**:
     - If a contractor serves exclusively rural clients (100% of their clients are rural) and the total number of their clients is at least 30, then additionally:
          a. Restrict the standard population to rural clients only.
          b. Refit the logistic regression model on the rural subset only (without the rural variable): 
               `logit(placement) ~ contractor + barrier_index + age_group + gender`
          c. Compute the adjusted rate for the contractor (and for every contractor) using predictions on the rural standard population.
          d. This yields a rural-adjusted ranking (Ranking B-rural). For the rural contractor, use Ranking B-rural in place of Ranking B.
     - If the rural contractor has fewer than 30 clients, use the unadjusted rate for both rankings with a warning.

  6. **Reporting**:
     - Report both rankings (A and B) for each contractor.
     - For Ranking B, if the adjusted rate is based on an extrapolation beyond the contractor's typical clients (e.g., a rural contractor being evaluated on urban clients in the standard population), note this limitation.
     - Attach confidence intervals for the adjusted rates (computed via bootstrapping if time permits; otherwise, note that precision is not calculated due to time constraints).

  **IV. Disaggregation Stopping Rule**

  - Do not create strata with fewer than 30 clients in the standard population. For barrier index, collapse categories (if ordinal) to meet this threshold. If not possible, do not adjust by that variable.
  - In the regression model, if a category of a variable has very few clients (e.g., <5) in the entire dataset, collapse with a similar category or exclude the variable.

  **V. Weighting Standard**

  - The standard population is the entire client population during the assessment period. This choice answers the question: "How would this contractor perform if they served the agency's typical client mix?"
  - The agency director must approve any change to the standard population (e.g., using a historical population) before the assessment period. This decision is based on policy, not statistics.

  **VI. Limitations**

  The procedure cannot:
  - Adjust for unmeasured variables (e.g., local economic conditions not captured).
  - Prove causation; the rankings are observational.
  - Adjust for post-enrollment variables (e.g., workshop completion) because they are outcomes.
  - Fully address small sample instability for contractors with very few clients.
  - Resolve the tension between the two rankings; they answer different questions.

  **VII. Application to the Three Cases**

  *Case 1: Contractor with worst overall rate but best within every barrier stratum.*

  - Step 1: Unadjusted rate (Ranking A) is worst.
  - Step 2: Sample size >=30? Assume yes.
  - Step 4: Adjusted rate (Ranking B) using regression: likely high because within every stratum they do well. Ranking B will be top tier.
  - Outcome: 
      - Ranking A: bottom tier -> contract renewal at risk.
      - Ranking B: top tier -> no improvement plan, but we investigate client assignment.
  - Appeal: The reversal is due to client mix. We show both rankings and explain. Renewal decision is based on Ranking A (overall outcome) but we do not terminate because they are performing well with their clients (Ranking B). Instead, we put them on a watch list and adjust client assignment if possible.

  *Case 2: Contractor's overall deficit disappears only when adjusting by post-enrollment variables.*

  - Step 1: Unadjusted rate (Ranking A) is low.
  - Step 2: Sample size >=30? Assume yes.
  - Step 4: Adjusted rate (Ranking B) uses pre-enrollment variables only. It remains low because the post-enrollment variables are not used. They remain in the bottom tier in both rankings.
  - Outcome: 
      - Ranking A: bottom tier -> renewal at risk.
      - Ranking B: bottom tier -> improvement plan.
  - Appeal: We deny. The post-enrollment variables are outcomes of the contractor's process and cannot be used for adjustment.

  *Case 3: Small rural contractor.*

  - Step 2: Sample size? Assume between 6 and 12 per stratum and total around 40 (so >30). But per stratum is small.
  - Step 4: We use regression adjustment for Ranking B (entire standard population). However, they are rural and exclusively rural. 
  - Step 5: They are exclusively rural and sample size>=30? Assume total clients=40 (>=30). We then compute Ranking B-rural.
     - We take the rural subset of the standard population and refit the model without the rural variable.
     - We compute the adjusted rate for every contractor on the rural standard population and rank them (Ranking B-rural).
     - The rural contractor's rank in this rural-adjusted ranking may be high (if they do well with rural clients).
  - Outcome:
      - Ranking A: likely low because rural clients have lower placement rates.
      - Ranking B-rural: may be high.
  - Therefore:
      - Ranking A: bottom tier? If so, renewal at risk.
      - Ranking B-rural: if top tier, then no improvement plan and we note the rural service.

  But note: the appeals board sees that in Ranking A (overall) they are bottom tier, but in Ranking B-rural (their performance with rural clients) they are top tier. We explain that Ranking A reflects the fact that rural clients have worse outcomes overall and that the agency's outcomes for the mix assigned to this contractor are poor. However, the contractor is doing well given the rural client type. The agency might decide to allocate more resources to rural areas or adjust expectations.

  *Which case comes out against the inclination?*

  The state workforce manager might be inclined to terminate the contract of the rural contractor because of the poor overall rate. But the procedure shows they are doing well with rural clients. Therefore, we do not terminate but note the challenge of rural placement and use Ranking B-rural to reward their performance. However, the agency's overall outcome (Ranking A) is poor, so the agency might need to address the structural issues in rural areas.

  **VIII. Appeal Defense for Case 3**

  To the appeals panel:

  "We understand that the unadjusted ranking shows your performance as the worst. This ranking reflects the overall outcomes for the mix of clients you were assigned. However, we also evaluated your performance adjusting for the difficulty of your clients. Because you serve exclusively rural clients, we computed a separate adjusted ranking for rural clients only. In that ranking, you are among the top performers. This means that you are doing an excellent job with the rural clients you serve. The poor showing in the overall ranking is because rural clients face greater barriers to employment. The agency uses the overall ranking for contract renewal because it reflects the outcomes we are achieving for the clients assigned to you. However, given your strong performance within the rural context, we will not terminate your contract. Instead, we will work with you to address the systemic challenges in rural areas and consider additional supports. We will also review the client assignment process to ensure fairness."

  **IX. Costs of Simplification**

  - Using pre-specified variables may miss important confounders. Cost: potential residual confounding.
  - Not testing for interactions in the regression model: if a contractor is especially good with a subgroup, we won't capture it. Cost: may misestimate adjusted rates for contractors with strong interactions.
  - Using the entire standard population for adjustment even when a contractor serves a specific subgroup: leads to extrapolation. Cost: the adjusted rate for a rural contractor is partly based on urban clients they never served, which may not reflect their true performance.
  - Not computing confidence intervals due to time: we cannot quantify uncertainty. Cost: we may make decisions based on unstable estimates.

  Despite these costs, the procedure is transparent and feasible within constraints.
