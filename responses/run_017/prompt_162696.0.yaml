   Step 1: Calculate the unadjusted placement rate for each contractor (overall rate).

   Step 2: Check for data quality and sample size.
      - For each contractor, if the total number of clients is less than 30, flag for small sample. In such cases, we will not disaggregate and will use the unadjusted rate with a warning about imprecision. If the contractor is in the bottom tier and appeals, we may need to aggregate data over a longer period (but note: no new data collection, so if the sample is too small and we cannot aggregate, we proceed with caution).

   Step 3: Identify admissible adjustment variables.
      - A variable is admissible if:
          a. It is measured at or before enrollment (and the date of measurement is in the record and before the enrollment date).
          b. It is not under the control of the contractor (e.g., barrier index, demographic variables, location).
          c. The variable is not an outcome of the contractor's process (so no post-enrollment variables).

   Step 4: Define the standard population for weighting.
      - The standard population is the entire client population across all contractors in the assessment period. This answers the question: "What would the overall placement rate be for each contractor if they served the same mix of clients as the entire system?" (i.e., standardizing to the overall population).
      - Why? Because we are interested in the agency's overall outcomes. We want to know how well the agency is doing for the entire population it serves, and also how each contractor would perform if they had the same client mix.

      Note: The choice of standard population is a policy decision. We choose the overall population because it represents the actual mix of clients the agency is serving. However, if there is a reason to use a different standard (e.g., a historical population or a specific target population), that decision must be made by the agency director (named person) in consultation with stakeholders before the assessment period. The procedure will use the overall population as the default.

   Step 5: Check for reversals in the overall rate when adjusting for a single pre-enrollment variable (one at a time) and then for a combined set.

      - We will consider two types of adjustments:
          a. Stratification by a single variable (if the variable has few categories) and then weighting by the standard population.
          b. For multiple variables, we will use a logistic regression model that includes the admissible pre-enrollment variables. The adjusted rate for a contractor is then the predicted probability of placement for the standard population if they were treated by that contractor (i.e., using the model to predict for each client in the standard population as if they were served by the contractor, then averaging).

