  We are designing a procedure to rank contractors based on job placement rates while addressing concerns about client difficulty and the legitimacy of adjustment. The procedure must be robust, transparent, and decision-relevant.

   Key principles:
   1. We care about two distinct questions:
      a. Is the contractor doing a worse job with the clients it accepted? (Performance with accepted clients)
      b. Is the agency buying worse outcomes for the mix of people we send? (Overall impact on the population served)

   2. We will use pre-enrollment variables for adjustment because they are not influenced by the contractor. Post-enrollment variables might be outcomes of the contractor's actions and thus adjusting for them could mask poor performance.

   3. We require a standard population for weighting to avoid Simpson's paradox and to ensure fair comparisons.

   4. We must avoid over-disaggregation to prevent small sample issues.

   Proposed Procedure:

   I. Define the outcome and the population.
      - Outcome: binary indicator for job placement above wage threshold within 6 months.
      - Population: all clients enrolled in the contractor's program during the assessment period.

   II. Pre-enrollment variables: 
