      - We will not report rates for strata with fewer than 30 clients (in the contractor's sample) because the rates would be too unstable.
      - When adjusting by stratification, we require that each stratum in the standard population has at least 30 clients. If a stratum is too small, we collapse categories (if the variable is ordinal) or combine with a similar stratum (if categorical) until the stratum size is at least 30. If we cannot (because the variable is nominal and no natural grouping), we drop that stratum and recalc the standard population without it? But note: we are using the entire standard population. Alternatively, we can use regression to avoid having to have large strata in the contractor's data? But the regression approach is less transparent.

