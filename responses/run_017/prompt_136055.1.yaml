prompt: |-
  I serve on a committee drafting norms for a category of research in which any one of a few dozen labs could proceed on its own, and in which a mistake by any one of them would impose costs on everyone. I have been treating the unilateralist's curse as essentially a winner's-curse phenomenon: conditional on a project going ahead, it is disproportionately likely to be a bad one, so each lab should shade its own estimate of the value of proceeding downward, the way a bidder in a common-value auction shades its bid. On that framing I need two numbers, and I want their direction of scaling right before I commit to a model: how much shading each lab should apply, and how many independent reviewers each lab should consult first, on the assumption that more independent scrutiny lowers the noise that generates the curse. What I am least sure of is whether any of this belongs at the level of the individual lab's decision rule at all, and whether the right benchmark is a single well-calibrated decision-maker or some collective rule. Is the winner's-curse analogy the right way in, and if not, where does the problem actually sit and which of my two levers moves it?
reasoning: |-
  Okay, the user serves on a committee drafting norms for a research area where any of several dozen labs could act independently. A mistake by one lab imposes costs on everyone. They've been framing the unilateralist's curse as a winner's curse analogy: since a project going ahead suggests it's more likely to be a bad one, each lab should adjust its value estimate downward. They need to figure out how much to adjust and how many independent reviewers each lab should involve to reduce noise. But they're unsure if this individual decision approach is correct or if a collective benchmark is better.

  First, I need to unpack the unilateralist's curse. The user mentions it's similar to the winner's curse, but I recall that the curse arises when multiple actors can independently decide to proceed with an action. If any one of them proceeds, the action happens, and if it's harmful, everyone bears the cost. The problem is that each lab might overestimate the project's benefit due to cognitive biases or noise. Even if each lab is well-calibrated on average, the lab with the most optimistic estimate will act first, leading to potentially bad outcomes.

  The winner's curse analogy applies to auctions where the highest bidder overpays. Here, the lab with the highest value estimate proceeds, which might be biased upward. But the key difference is that in auctions, the winner is the one who pays too much, whereas here, the "winner" is the lab that acts, possibly triggering a harmful event. So the analogy holds in terms of selection bias, but the dynamics differ because there's no bidding; it's about the decision threshold.

  The user's main concerns are two levers: how much to shade estimates and how many reviewers to involve. But the deeper issue is whether individual decision-making is the right level. If each lab acts independently, the first to act based on their estimate could cause harm. Even with shading, if all labs shade by the same amount, the most optimistic still acts. So shading might not solve the problem if it's uniform.

  A collective approach could involve coordination. For example, labs might agree that only projects with a consensus or supermajority proceed. That reduces the chance of a single optimistic lab acting. Alternatively, a random selection of labs evaluating each project could help. But collective rules might be hard to implement if labs are independent and competitive.

  The user also needs to consider the number of reviewers. More independent reviewers reduce noise in each lab's estimate. If a lab consults multiple reviewers, the average estimate might be more accurate, decreasing the variance. This reduces the chance that any single lab's estimate is an outlier. But this addresses the noise part, not the selection bias. Even with better-averaged estimates, the lab with the highest average might still be overly optimistic.

  So the two levers are connected. More reviewers lower the noise, which reduces the need for shading. But shading compensates for the remaining selection bias. However, if labs don't coordinate, shading alone doesn't prevent the most optimistic from acting.

  The user's uncertainty about individual vs. collective benchmarks is valid. A single well-calibrated decision-maker wouldn't face the curse because there's no selection bias. But with multiple actors, the collective outcome is worse due to the unilateralist's curse. So norms should push towards collective decision-making or mechanisms that mimic it.

  Practical steps might include requiring labs to seek external reviews or creating a clearinghouse where projects are evaluated collectively. But if that's not feasible, each lab could adjust its threshold based on how many other labs might act. For example, if a lab knows that 10 others are evaluating the same project, they should be more conservative. However, this requires knowing the number of other actors, which might not be transparent.

  The user's role is drafting norms, so they can propose structural solutions. Maybe mandatory pre-action reviews by a central committee or sharing evaluations among labs. But that raises issues of confidentiality and competition. Alternatively, labs could commit to a higher evidence threshold before proceeding, factoring in the risk posed by others.

  In conclusion, the winner's curse analogy is a starting point but misses the coordination aspect. The problem is more about preventing any single actor from acting on an overly optimistic estimate rather than just shading bids. The levers are interdependent: more reviewers reduce noise, which allows less shading, but collective mechanisms are more effective. The user should focus on norms that encourage shared evaluations or coordinated thresholds rather than individual adjustments alone.
answer: |-
  Your intuition that the unilateralist's curse (UC) resembles the winner's curse is insightful but incomplete. While the selection bias mechanism is similar, the UC is fundamentally a **coordination failure in a multi-agent threshold decision problem**, not merely an individual calibration error. Your two levers (shading estimates & adding reviewers) address symptoms but miss the core pathology. Here's a structured analysis:

  ### 1. **Why the Winner's Curse Analogy is Limited**
     - **Similarity**: Both involve selection bias. In UC, the lab with the most optimistic estimate acts first. Conditional on acting, their estimate is likely inflated (like the winning bidder overpaying).
     - **Critical Difference**: 
       - In auctions, the winner's curse harms only the bidder. Shading bids solves their individual problem.
       - In UC, one lab's mistake harms *all* labs. Individual shading doesn't prevent a *different* lab with a less-shaded (but still inflated) estimate from acting. The problem is systemic.

  ### 2. **The Core Problem: Collective Action, Not Individual Calibration**
     - **UC arises when**: 
       - (a) Any single lab can trigger a costly outcome, 
       - (b) Labs have noisy private estimates of project value/risk, 
       - (c) There's no coordination mechanism.
     - **Even with perfectly calibrated labs**, the lab with the highest positive error will act first. If the *true* value is negative, their action dooms everyone. More labs = higher chance the highest error is catastrophic.

  ### 3. **Why Your Current Levers Are Misplaced**
     - **Shading Estimates**:
       - *Problem*: Uniform shading (e.g., all labs subtract 10%) doesn't change which lab acts first. The most optimistic lab still acts, just at a slightly higher threshold. It reduces the *rate* of bad projects but doesn't eliminate the selection bias.
       - *When it helps*: Only if all labs shade *proportionally to their estimate's uncertainty* and *account for the number of other labs*. But this requires impossible coordination.
     - **Adding Reviewers**:
       - *Problem*: More reviewers reduce a *single lab's* estimation noise, but don't solve the multi-lab competition. A lab with mediocre reviewers might still act if others are more cautious.
       - *Diminishing returns*: Each reviewer reduces noise marginally. Beyond 3-5 reviewers, gains are small compared to the UC's systemic risk.

  ### 4. **The Correct Benchmark: Collective Decision-Making**
     - **Ideal Solution**: A single, well-calibrated decision-maker (or a consensus mechanism) avoids UC entirely by aggregating all information *before* acting.
     - **Practical Benchmark**: 
       - *Group thresholds*: What would a rational collective agree to? Example: "Act only if 90% of labs agree the project is net-positive." 
       - *Cost-sharing rules*: Labs acting unilaterally bear full liability for others' losses. This internalizes the externality but may stifle innovation.

  ### 5. **Effective Levers for Your Committee**
  Focus on norms that mimic collective rationality:

  | **Lever** | **Mechanism** | **Why It Works** | **Implementation Challenge** |
  |-----------|---------------|------------------|------------------------------|
  | **Mandatory pre-action review** | Central panel reviews all projects | Replaces unilateral decisions with collective evaluation | Requires labs to surrender autonomy; needs funding |
  | **Shared liability** | Acting lab compensates others for losses | Forces labs to internalize social cost of mistakes | Difficult to quantify costs; may deter beneficial projects |
  | **Consensus thresholds** | Project proceeds only if >X% of labs approve | Mimics a collective decision | Labs may free-ride; requires transparency |
  | **Sequential veto rights** | Labs announce intentions; others can veto | Allows risk-averse labs to block dangerous projects | Stalemate risk; strategic behavior |
  | **Standardized risk assessment** | Common methodology + uncertainty quantification | Reduces noise variance across labs | Labs may manipulate inputs |

  ### 6. **If Individual Rules Are Politically Necessary**
  If collective mechanisms are infeasible, modify your levers:
     - **Shading**: Should scale with **number of labs** (N) and **estimate uncertainty** (σ).  
       *Example*: Shade estimate by `k * σ * √log(N)`, where `k` depends on harm severity. (Derived from extreme value theory).
     - **Reviewers**: More reviewers reduce σ, but target **residual uncertainty post-review**. Optimal reviewer count is low (3–5), as variance decreases with √M (M = reviewers). Focus on reviewer independence, not quantity.

  ### Key Recommendations for Your Committee
  1. **Abandon pure individual framing**: UC is irreducible to isolated decisions. Norms must explicitly address interdependency.
  2. **Prioritize coordination mechanisms**: Even simple steps (e.g., requiring labs to notify others before acting) reduce UC by enabling vetoes or collaboration.
  3. **Use liability to align incentives**: If labs bear full social cost of mistakes, they'll self-shade optimally and seek more reviewers.
  4. **Set uncertainty standards**: Mandate error bars on risk assessments. Labs with high σ face higher scrutiny.
  5. **Calibrate to collective thresholds**: Calculate the action threshold a hypothetical central planner would use, then distribute that as a minimum bar.

  The winner's curse analogy is a gateway to understanding selection bias, but the UC sits in the domain of mechanism design for public goods. Your goal isn't to tweak individual psychology—it's to engineer decision architectures that force labs to behave *as if* they were a single entity. Shift focus from "how should each lab adjust?" to "how can we make the group's outcome robust to individual noise?"

  > *Example calculation*: With 30 labs, well-calibrated estimates, and a project whose true value is -$10M ± $15M (mean ± SD), the probability that at least one lab sees a positive value is >99%. Mandating a +$5M minimum perceived value for action reduces this to ~30%. This illustrates how thresholds matter more than shading.
