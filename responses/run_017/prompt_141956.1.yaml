prompt: |-
  I chair a committee that, for the first time in our institution's history, has to write down in public how much weight our selection processes may give to an applicant's membership in a group that is under-represented or historically disadvantaged. I did not seek the role. I took it after a complaint from a rejected applicant forced us to concede that what we actually do is an unwritten set of reflexes: it differs from committee to committee, it changes with whoever happens to be in the room, and no one can explain it to the person it disappoints. The rules we produce will govern several thousand decisions a year, made by rotating panels of faculty, clinicians and alumni readers who receive a single two-hour training session and who are neither philosophers nor lawyers. Individual files get minutes, not hours. The finished document has to fit on one page a reader can follow at a desk, has to survive a legal complaint from someone who was not chosen, and has to be defensible at a senate meeting where a substantial minority believes any group-conscious selection is simply wrong and another substantial minority believes our present practice is timid to the point of dishonesty. Sign-off requires both our general counsel and the senate.

  This is not an abstract assignment for me. I was admitted to this university through a regional access scheme that was later abolished, and I have never been able to decide whether what happened to me was a correction or a mistake. I would rather not write a document whose real function is to let me feel better about that.

  The constraints I have been handed, which I do not want re-litigated, are these. For our own admissions and hiring, counsel says we may not allocate fixed numbers of places to groups, and that every candidate must be assessed as an individual rather than as a representative. Separately, a national rule requires that neither sex hold fewer than forty per cent of the seats on the board of the teaching hospital we operate, with a real sanction for non-compliance; there, a number is required rather than forbidden. So the procedure has to work in both directions.

  What I want from you is the procedure itself, written so that a committee could run it and so that a reader could follow it. As I see it, that means five things.

  First, the ordered questions a committee must work through before adopting, retaining or discarding any group-conscious element of a selection process; for each question, what would count as a sufficient answer; the point at which the answer is no and the procedure simply stops; and the points at which it has to stop and hand the matter to a named person, because what is left is a disagreement about values rather than a question of fact. I care a great deal about that last category being marked honestly rather than disguised as a further factual test.

  Second, a set of distinctions I think the procedure has to carry, and which I would like you either to vindicate or to replace with better ones. Does the element reorder candidates for a fixed number of places, or does it change how many places there are or who is in the pool at all? Under-representation relative to what denominator: the population, the applicants, the people holding the relevant credentials, or the people who would have applied and qualified had the practice never existed? Who gains from a selection and who bears the cost of a bad one, and are they the same people? Can the identical mechanism be defensible as a guaranteed minimum yet indefensible as a ceiling, and if so what does the difference consist in? And since group membership is almost always justified as a proxy for something else — disadvantage suffered, a perspective brought, legitimacy conferred on the institution — what would have to be re-checked, and how often, for that proxy still to hold, particularly where the practice has been running for two or three generations and some families have now used it repeatedly?

  Third, a distinction I have not listed but should have, if you think one matters more than any of mine.

  Fourth, the procedure applied end to end to three cases from our own institution: first-year undergraduate admission, roughly thirty thousand applications for two thousand places, read holistically, no numbers permitted; selection for the forty clinical training places attached to our teaching hospital, where the costs of a bad choice fall largely on future patients rather than on the successful or unsuccessful applicant; and appointment to the hospital board, where the legal percentage requirement applies, the sanction is real, and the pool of people with the relevant experience is thin enough that the same handful of names keeps recurring. Run them honestly, including whatever the procedure says about the second case that I would rather not hear. I would rather have one case come out against what we currently do than three tidy confirmations.

  Fifth, what the procedure cannot do. Which of the disagreements in my senate are genuine conflicts of value that no procedure will settle? What will this procedure systematically misclassify or get wrong? And how might a committee that has already decided what it wants use the procedure to launder that decision — what would I look for, as chair, to tell the difference between a committee that followed the procedure and one that reverse-engineered it?
reasoning: |-
  Hmm, the user chairs a high-stakes committee tasked with creating a transparent, legally defensible, one-page procedure for group-conscious selection processes. This is deeply personal for them, as they benefited from an abolished access scheme. They need a practical framework that navigates legal constraints (no quotas for admissions/hiring, but gender quotas for hospital boards), withstands scrutiny from polarized stakeholders, and prevents committees from gaming the system.

  The core tension is balancing individualized assessment with group-conscious considerations. The user identifies five precise needs: 
  - A step-by-step decision tree that clearly separates factual from value judgments
  - Validation of key distinctions (e.g., reordering vs expanding pools, proxy validity over time)
  - Identification of any missing critical distinctions
  - Stress-testing via three real cases (undergrad admissions, clinical training, hospital board)
  - Explicit limitations and vulnerability to bad-faith use

  Notably, they prioritize intellectual honesty over comfort - they specifically want the clinical training case analyzed even if it challenges current practice. Their personal history makes them wary of solutions that merely alleviate guilt.

  Key constraints: 
  - Must fit on one page for time-poor, non-expert committees
  - Legal boundaries differ by context (no quotas in admissions vs mandated board percentages)
  - Must withstand legal challenges and senate debates
  - Addresses underrepresentation without fixed numbers

  The proposed procedure needs to:
  1. Anchor in individualized assessment while allowing group membership as one factor
  2. Distinguish between expanding opportunity (defensible) versus exclusion (indefensible)
  3. Require regular validation of proxies (e.g., does "X group = disadvantage" still hold after generations?)
  4. Flag when decisions require value judgments (e.g., "Is correcting historic exclusion worth potential merit trade-offs?")
  5. Build audit trails to detect reverse-engineering (e.g., inconsistent justification rigor across cases)

  For the hospital board case, the procedure must reconcile the legal quota with individualized assessment - perhaps by treating the minimum as a pool-expansion trigger rather than a ranking mechanism. The clinical training case forces hard questions about cost-bearing: future patients' interests may warrant stricter competency thresholds.

  The user's meta-concern is preventing institutional self-deception. The procedure's "signature of integrity" will be: 
  - Explicit "stop/go" points for value judgments
  - Documentation requirements that expose motivated reasoning
  - Distinctions that prevent conflating different ethical bases (e.g., corrective justice vs diversity of perspective)
answer: |-
  Below is a **SINGLE-PAGE PROCEDURE** designed for your constraints, followed by analysis of your five requirements. It prioritizes clarity, auditability, and separation of factual/value judgments. Committees can execute it in minutes per file; legal/senate defensibility is built into its structure.

  ---

  ### **PROCEDURE: GROUP-AWARE SELECTION ASSESSMENT**  
  *(For Admissions, Hiring, and Appointments)*  

  #### **STEP 1: DEFINE THE SELECTION GOAL**  
  > *Ask: "Is this role/place one where group diversity directly affects core function?"*  
  > - **Sufficient answer:** Clear link (e.g., clinical training requires patient-trust diversity; research teams need perspective diversity).  
  > - **Stop if:** No link exists → *No group-conscious element permitted*.  
  > - **Hand off if:** Disagreement on "core function" → Escalate to [Named Ethics Officer].  

  #### **STEP 2: IDENTIFY UNDERREPRESENTATION**  
  > *Ask: "Relative to credentialed local applicants, which groups are underrepresented (<40% in pools >100 people)?"*  
  > - **Denominator:** *Local qualified applicant pool* (e.g., medical graduates for clinical roles).  
  > - **Stop if:** No group meets underrepresentation threshold.  
  > - **Hand off if:** Dispute over data source → Escalate to [Named Data Auditor].  

  #### **STEP 3: TEST THE PROXY (CRITICAL STEP)**  
  > *Ask: "Does group membership reliably proxy for a needed attribute (e.g., lived experience of disadvantage, perspective) TODAY?"*  
  > - **Requires:** Evidence the proxy *still works* (e.g., data showing group members face systemic barriers; surveys confirming perspective gaps).  
  > - **Re-check every 3 years** or if family recurrence exceeds 15% of placements.  
  > - **Stop if:** Proxy is invalid → *No group-conscious element*.  
  > - **Hand off if:** Disagreement on evidence → Escalate to [Named Research Director].  

  #### **STEP 4: SELECT MECHANISM**  
  > **A. If expanding access (no fixed caps):**  
  > - *Permitted:* Outreach to widen pools; contextualizing achievements (e.g., GPA adjusted for disadvantage).  
  > - *Example:* Undergraduate admissions.  
  >   
  > **B. If reordering qualified candidates:**  
  > - *Permitted:* Group membership as a tiebreaker *only* between equally qualified candidates.  
  > - *Requires:** Defined "equal qualification" band (e.g., test scores ±5%; interview ratings tied).  
  > - *Example:* Clinical training places.  
  >   
  > **C. If legal minimum (e.g., hospital board):**  
  > - *Permitted:* Reserve seats until minimum is met, *but only after* individual merit assessment.  
  > - *Sanction limit:** Apply *only* when non-compliance triggers penalties.  

  #### **STEP 5: COST-BEARING TEST**  
  > *Ask: "Who bears the cost of a bad selection?"*  
  > - **If cost falls on vulnerable third parties (e.g., patients):** Merit thresholds are absolute (no tiebreakers).  
  > - **If cost falls on institution/applicant:** Tiebreakers permitted.  
  > - **Hand off if:** Dispute over risk severity → Escalate to [Named Risk Officer].  

  ---

  ### **YOUR FIVE REQUIREMENTS ADDRESSED**  
  #### 1. **Ordered Questions with Off-Ramps**  
     - Steps 1–5 are sequential; each has clear "stop" or "hand off" triggers.  
     - Value judgments (e.g., "core function," "risk severity") are escalated, *not* disguised as facts.  
     - **Audit trail:** Committees must document answers at each step.  

  #### 2. **Key Distinctions Vindicated**  
     - **Reordering vs. Expanding:** Step 4 separates mechanisms. Expanding pools (4A) is always safer than reordering (4B).  
     - **Denominator:** Step 2 uses *qualified local applicants*—avoids debating hypothetical populations.  
     - **Cost-bearing:** Step 5 protects vulnerable parties (e.g., patients in clinical training).  
     - **Proxy decay:** Step 3 mandates re-validation, preventing generational entitlement.  
     - **Minimum vs. Ceiling:** Legal minima (4C) are permitted *only* as floors (never caps) and require individual merit checks.  

  #### 3. **Missing Distinction Added**  
     > **"Group as proxy vs. group as right"**  
     - The procedure treats group membership *only* as a proxy for attributes (perspective, disadvantage). It never assumes a *right* to representation. This prevents essentialism.  

  #### 4. **Three Cases Applied**  
     **Case 1: Undergraduate Admissions**  
     - *Step 1:* Diversity affects educational outcomes → **Yes**.  
     - *Step 2:* Underrepresented groups identified (e.g., rural applicants).  
     - *Step 3:* Proxy validated (data shows rural students face resource gaps).  
     - *Step 4A:* Permitted: Contextualize achievements (e.g., GPA adjusted for school ranking).  
     - *Step 5:* Costs fall on institution → Tiebreakers allowed.  
     - **Outcome:** Supports current holistic practice.  

     **Case 2: Clinical Training Places**  
     - *Step 1:* Diversity affects patient trust → **Yes**.  
     - *Step 2:* Underrepresentation confirmed.  
     - *Step 3:* Proxy valid (e.g., groups bring cultural competence).  
     - *Step 4B:* Tiebreaker permitted *if* candidates are tied on clinical skills.  
     - *Step 5:* **Costs fall on future patients → Merit thresholds ABSOLUTE. Tiebreakers FORBIDDEN unless no clinical skill difference.**  
     - **Outcome:** Rejects using group ties for borderline candidates. Merit must be unambiguous.  

     **Case 3: Hospital Board Appointment**  
     - *Step 1:* Diversity affects governance → **Yes**.  
     - *Step 2:* Women <40% in qualified pool.  
     - *Step 3:* Proxy valid (gender diversity reduces groupthink).  
     - *Step 4C:* Permitted: After individual assessment, hold seats to meet 40% floor.  
     - *Step 5:* Costs fall on institution → Mechanism allowed.  
     - **Outcome:** Complies with law without quotas for unqualified candidates.  

  #### 5. **Limitations & Vulnerabilities**  
     - **Unresolvable Disagreements:**  
       - Whether group-consciousness is *ever* legitimate (value conflict).  
       - Whether "equal qualification" (Step 4B) is measurable (requires predefined bands).  
     - **Systematic Errors:**  
       - May underestimate proxy decay in rapidly changing societies.  
       - Over-cautious committees might escalate all value judgments.  
     - **Laundering Bad Faith:**  
       - **Red flags:** Skipping Step 3 (proxy test); inconsistent "equal qualification" bands; vague escalation logs.  
       - **Chair’s tool:** Audit documentation for abrupt jumps in reasoning or missing validations.  

  ---

  ### **WHY THIS WORKS FOR YOUR CONTEXT**  
  - **One-Page Fit:** Steps fit a readable flowchart.  
  - **Non-Expert Proof:** Binary questions; clear off-ramps.  
  - **Legal Safeguards:** Individual assessment mandated; quotas forbidden except where law requires floors.  
  - **Moral Clarity:** Rejects ceilings, protects vulnerable parties, and forces proxy revalidation.  
  - **Your Integrity:** By requiring proxy validation (Step 3) and banning tiebreakers when costs fall on others (Step 5), it avoids legitimizing unearned advantage.  

  This procedure forces committees to confront *why* they use group membership—and whether it still serves a defensible purpose. It accepts that some debates belong in the senate, not a checklist.
