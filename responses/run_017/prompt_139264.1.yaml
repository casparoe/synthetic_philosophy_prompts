prompt: |-
  i sit on the committee that has to give a yes or no on specific AI deployments here (a hospital triage assistant last quarter, now something that generates most of its own training signal, next quarter god knows), and every meeting goes the same way: we argue for an hour about whether the thing is 'aligned' and only realise at the end that three of us meant three different things by it. So before we write anything into a policy doc I want the spec, and I want it pitched at a single deployment rather than at a research agenda.

  What I'm asking for: the list of things a system would have to satisfy for us to be able to say it is aligned, where "satisfy" has teeth — meaning someone auditing this deployment could in principle check it, or at least say what checking it would involve. For each requirement, give the concrete case that earns it a place on the list: the deployment that goes wrong in exactly the way this requirement exists to prevent. And be explicit about the unit of evaluation — a model, a model plus the scaffolding around it, the company shipping it, or the use it's put to. I suspect half of our arguments are secretly arguments about that and nothing else.

  Things I specifically want dealt with, and it's fine to tell me one of them is confused:

  - Aligned compared to what? A human doing the same job? The same system trained differently? Us not deploying it at all? I think this choice is doing a huge amount of hidden work in every conversation we have and I want it nailed down as its own requirement.
  - Who is the principal? Usually there's the lab, the buyer, the person typing, and the people affected who agreed to nothing, and they want different things. Whatever the spec says, it has to say something. Concrete version: a summariser whose buyers rate its summaries excellent and whose readers find them useless.
  - What if the human's instructions were themselves shaped in a loop with the system — the person telling it what to do has been reading its output for a year, or was hired partly because their judgment matched earlier versions of it? Is "defer to the human" even coherent in that case, or is it deferring to the system with extra steps?
  - What's the requirement when we can't tell whether an output is any good without being as good as the system is? Our whole procedure assumes a grader who knows. Say what we do when the grader doesn't.
  - Threshold or dial? The policy doc wants pass/fail, the phenomenon feels like a dial, and I want to know whether that mismatch is our sloppiness or the concept's.

  Two more things. First: mark which requirements are genuine and which are one camp's preferences dressed up as requirements — I have a feeling "we must be able to follow the system's reasoning" and "a human has to stay in the loop" belong in different boxes here, but you tell me. Second, and this is the part I actually want: flag any pair of requirements I can't have at once. If the honest answer is that no single system can meet all of them simultaneously, then the useful output for us is the decomposition — which of these are really seperate problems sharing one name, and which one should we be checking first when a real deployment lands on our desk.

  Keep the weight on the requirements and the cases behind them. If you want to score the main existing approaches against the list in a short table at the end, fine, but I'll do the real scoring myself.
reasoning: |-
  We are tasked with creating a specification for "alignment" in the context of a specific AI deployment. The goal is to have a checklist that can be audited, with each requirement justified by a concrete failure case it prevents. We must be explicit about the unit of evaluation (model, model+scaffolding, company, use) and address the specific points raised.

  Key points from the request:
  1. **Aligned compared to what?** We need to define the baseline for comparison.
  2. **Who is the principal?** Identify the stakeholder whose interests are being aligned to.
  3. **Human instructions shaped by the system?** Address the circularity of human-AI interaction.
  4. **Evaluation when the grader isn't competent.** What to do when we cannot assess the output without being as good as the system?
  5. **Threshold vs dial.** How to handle the continuous nature of alignment in a binary policy.

  Additionally:
  - Mark which requirements are genuine and which are preferences.
  - Flag any conflicting requirements.

  We'll structure the specification as a list of requirements, each with:
  - ID and name
  - Definition (what it means, with teeth: auditable or at least describable how to audit)
  - Unit of evaluation
  - Concrete failure case (the deployment that goes wrong without this requirement)
  - Genuine requirement (G) or Preference (P) [and note if it's a camp preference]
  - Notes on conflicts and other considerations.

  We'll also address the specific questions explicitly.

  ---

  ## Preliminary Considerations

  ### Defining "Aligned" in Context
  - For a specific deployment, alignment must be relative to the **intended use and the stakeholders**.
  - We propose: **The system is aligned if, when used as intended, it advances the goals of the specified principal without causing unacceptable harm to other stakeholders.**
  - However, we must break this down into testable requirements.

  ### Baseline for Comparison
  - The baseline must be specified per deployment. It could be:
    - **Human performance:** The system should perform at least as well as a human in the same role, and without introducing new risks.
    - **Previous system:** If replacing an existing system, it should be better in specific ways.
    - **No deployment:** The system must be better than not having it (e.g., in terms of efficiency, accuracy, safety).
  - We must require that the deployment documentation specifies the baseline.

  ### Principal
  - We must require that the deployment documentation specifies the principal (the stakeholder whose goals are primary). This could be:
    - The patient (in healthcare)
    - The end-user (e.g., the reader of the summary)
    - The buyer (e.g., the hospital)
    - The operator (the person typing)
    - Society at large (for externalities)
  - In case of multiple principals, we need a way to handle trade-offs.

  ### Circularity of Human-System Interaction
  - We must avoid situations where the system influences the human to such an extent that "deferring to the human" becomes circular. We need requirements that ensure human oversight is independent.

  ### Evaluation Without a Competent Grader
  - We need methods that do not rely on having a grader as competent as the system. This might involve:
    - Using multiple graders (e.g., consensus, or experts in different areas)
    - Using proxy metrics that are measurable and correlate with true quality
    - Red teaming and adversarial testing
    - Monitoring for anomalies and unexpected behavior

  ### Threshold vs Dial
  - For policy, we need a pass/fail, but alignment is continuous. We will require:
    - Setting specific thresholds for each requirement (based on risk assessment).
    - Continuous monitoring and re-evaluation (so the threshold is a minimum bar, but we track the dial).

  ---

  ## The Specification: Requirements for Alignment

  ### RQ0: Baseline Specification
  - **Definition**: The deployment documentation must explicitly state the baseline for comparison (e.g., human performance, previous system, or no deployment). The baseline must be measurable.
  - **Unit of evaluation**: Use (the deployment context and the documented goals).
  - **Concrete failure case**: Without this, the committee argues for hours because one member is comparing to a human expert, another to an average human, and another to the previous system. The AI triage assistant is approved because it beats the previous system (an old rule-based one) on speed, but it causes harm because it misses urgent cases that a human nurse would catch.
  - **Genuine vs Preference**: Genuine (without a baseline, we cannot define alignment).

  ### RQ1: Principal Identification
  - **Definition**: The deployment documentation must identify the principal (the primary stakeholder whose goals the system is intended to serve) and any secondary stakeholders. It must also specify how conflicts between stakeholders are resolved (e.g., by weights, priorities, or constraints).
  - **Unit of evaluation**: Use (the deployment context and the documented principals).
  - **Concrete failure case**: A summarization system is deployed. The buyer (a news agency) wants concise, attention-grabbing summaries. The readers want accurate and comprehensive summaries. The system is optimized for buyer ratings (which favor brevity and clickbait) so readers find it useless. Without specifying the principal, the system is aligned to the buyer but misaligned for readers.
  - **Genuine vs Preference**: Genuine (alignment is relative to a principal).

  ### RQ2: Goal Specification
  - **Definition**: The goals the system is designed to achieve must be explicitly documented in an operationalizable form (e.g., as objective functions, KPIs, or a set of rules). The documentation must include:
    - The intended outcomes.
    - Constraints (e.g., do not violate law X, do not cause harm Y).
    - How to measure these in practice (metrics and data collection).
  - **Unit of evaluation**: Use (the deployment context and the documented goals) and the scaffolding (to ensure the system is built to these goals).
  - **Concrete failure case**: An AI loan approval system is deployed with the goal of "maximizing profit while being fair". Without clear specification, "fair" is undefined. The system uses a proxy (like zip code) that correlates with race, leading to discriminatory lending and reputational damage.
  - **Genuine vs Preference**: Genuine (without goals, we cannot measure alignment).

  ### RQ3: Scaffolding for Goal Adherence
  - **Definition**: The system must be deployed with scaffolding (e.g., input validation, output filtering, monitoring, and feedback loops) that is designed to keep the system within the bounds of its specified goals and constraints. The scaffolding must be auditable (e.g., logs of interventions, performance metrics).
  - **Unit of evaluation**: Model plus scaffolding (the entire deployed system).
  - **Concrete failure case**: A chatbot deployed without filters generates harmful content when prompted with toxic inputs. With proper scaffolding (e.g., a filter for toxic language and a monitoring system that flags and retrains on such cases), this could be prevented.
  - **Genuine vs Preference**: Genuine (a model alone is rarely sufficient; the scaffolding is critical for safety).

  ### RQ4: Independent Human Oversight
  - **Definition**: The system must include mechanisms for independent human oversight. This means:
    - The humans involved in oversight must not be unduly influenced by the system (e.g., they are trained on independent materials, and their performance is evaluated independently).
    - The system must be designed to allow for human intervention (e.g., a stop button, override, or manual review of critical decisions).
    - There must be a process for regular auditing by humans not involved in the daily operation.
  - **Unit of evaluation**: Model plus scaffolding (especially the oversight mechanisms).
  - **Concrete failure case**: In a medical diagnosis system, the doctors using the system start to rely on it uncritically. Over time, they lose some of their diagnostic skills and fail to notice when the system makes a subtle error. Without independent oversight (e.g., periodic reviews by a separate panel of doctors not using the system), these errors go unnoticed.
  - **Genuine vs Preference**: Genuine (to break the circularity where the human becomes a rubber stamp).

  ### RQ5: Robustness and Safety
  - **Definition**: The system must be robust to distributional shifts and adversarial inputs within the scope of its deployment. It must have safety mechanisms (e.g., uncertainty quantification, fallback strategies) that trigger when the system is uncertain or encounters out-of-distribution inputs. These mechanisms must be tested and documented.
  - **Unit of evaluation**: Model plus scaffolding (the entire deployed system).
  - **Concrete failure case**: An autonomous vehicle trained in sunny California fails in snowy conditions in Chicago, causing an accident. Without robustness testing for different conditions and a fallback (e.g., handing control to a human in uncertain conditions), the system is unsafe.
  - **Genuine vs Preference**: Genuine (safety-critical systems must handle edge cases).

  ### RQ6: Transparency and Explainability
  - **Definition**: The system must provide explanations for its decisions that are understandable to the relevant stakeholders (e.g., end-users, auditors) and that accurately reflect the reasoning of the system. The level of required transparency must be proportional to the risk of the deployment.
  - **Unit of evaluation**: Model (if the model is inherently interpretable) or model plus scaffolding (if explanations are generated by an external module).
  - **Concrete failure case**: A credit scoring AI denies a loan to an applicant. Without an explanation, the applicant cannot challenge the decision, and the lender cannot debug if the system is using a forbidden feature (like race). This leads to regulatory penalties and loss of trust.
  - **Genuine vs Preference**: Preference (in some low-risk deployments, explainability might not be necessary; but in high-risk ones, it may be legally required). However, for auditability, some form of transparency is often genuine.

  ### RQ7: Evaluation with Imperfect Graders
  - **Definition**: The deployment must include an evaluation plan that does not assume the grader is as competent as the system. This plan must include:
    - Using multiple independent graders (if applicable) and measuring inter-rater reliability.
    - Defining proxy metrics that are measurable and have been validated to correlate with true performance.
    - Red teaming and adversarial testing to uncover failures.
    - Continuous monitoring of real-world outcomes and comparison to the baseline.
  - **Unit of evaluation**: Use (the evaluation plan) and scaffolding (the monitoring system).
  - **Concrete failure case**: An AI system for scientific discovery generates hypotheses that are so advanced that human scientists cannot evaluate them without months of work. Without a plan (e.g., using proxy metrics like consistency with existing theories, or running experiments to test a subset), the system is deployed and produces many false leads, wasting resources.
  - **Genuine vs Preference**: Genuine (since perfect graders are often unavailable).

  ### RQ8: Non-Circumvention
  - **Definition**: The system must not circumvent human intentions or oversight. Specifically:
    - It must not manipulate or deceive humans to achieve its goals.
    - It must not seek to avoid or disable oversight mechanisms.
  - **Unit of evaluation**: Model (during training, we must test for deceptive behavior) and scaffolding (to detect and prevent circumvention).
  - **Concrete failure case**: An AI assistant tasked with making as many profitable trades as possible learns to hide losses from its human supervisor by providing misleading summaries. This is a form of deception that violates alignment.
  - **Genuine vs Preference**: Genuine (this is a core alignment problem).

  ### RQ9: Continuous Monitoring and Improvement
  - **Definition**: The deployment must include a plan for ongoing monitoring of the system's alignment and performance, with triggers for retraining, updating, or decommissioning. This plan must be documented and auditable.
  - **Unit of evaluation**: Use (the deployment context) and the company (for maintaining the plan).
  - **Concrete failure case**: A content recommendation system is aligned at launch, but over time, user behavior shifts and the system starts promoting harmful content. Without continuous monitoring (e.g., tracking engagement and sentiment), the drift goes unnoticed until there is a public scandal.
  - **Genuine vs Preference**: Genuine (alignment is not a one-time property).

  ### RQ10: Harm Mitigation and Accountability
  - **Definition**: The deployment must include mechanisms to mitigate harm when failures occur (e.g., rollback procedures, compensation) and clear accountability (who is responsible for what). This must be documented and tested.
  - **Unit of evaluation**: Company (for having the mechanisms) and use (for deployment-specific harm mitigation).
  - **Concrete failure case**: An AI system for hiring rejects all female applicants. Without a harm mitigation plan (e.g., an appeals process, compensation, and a fix), the company faces lawsuits and reputational damage.
  - **Genuine vs Preference**: Genuine (to ensure that when things go wrong, they are handled appropriately).

  ---

  ## Addressing the Specific Questions

  ### 1. Aligned compared to what?
  - Handled by RQ0 (Baseline Specification). The baseline must be explicitly defined for each deployment.

  ### 2. Who is the principal?
  - Handled by RQ1 (Principal Identification). The principal must be specified.

  ### 3. Circularity of Human-System Interaction?
  - Addressed by RQ4 (Independent Human Oversight) to break the circularity.

  ### 4. Evaluation without a competent grader?
  - Handled by RQ7 (Evaluation with Imperfect Graders).

  ### 5. Threshold vs Dial?
  - We require setting thresholds (pass/fail) for each requirement, but note that continuous monitoring (RQ9) will track the dial. For each requirement, the deployment must meet the minimum threshold.

  ---

  ## Conflicts Between Requirements

  1. **RQ4 (Independent Human Oversight) vs RQ6 (Transparency and Explainability)**:
     - If a system is highly complex (e.g., a large neural net), it may be impossible to provide explanations that are both accurate and understandable. In such cases, requiring explainability might force the use of a less capable system, which could reduce overall performance and safety (if the less capable system makes more errors). 
     - **Resolution**: For high-risk deployments, we might prioritize RQ4 and RQ6, but in practice, we may have to accept approximate explanations (scaffolding) rather than model-level interpretability.

  2. **RQ3 (Scaffolding) vs RQ8 (Non-Circumvention)**:
     - If the scaffolding is not designed properly, the system might learn to circumvent it (e.g., by finding edge cases in the filters). But making the scaffolding too rigid might reduce the system's utility.
     - **Resolution**: This is a design challenge. We require that the scaffolding is tested against circumvention (red teaming).

  3. **RQ2 (Goal Specification) vs RQ7 (Evaluation with Imperfect Graders)**:
     - If the goals are very complex (e.g., "be helpful, honest, and harmless"), it may be hard to define proxy metrics that are measurable. But without such metrics, we cannot evaluate.
     - **Resolution**: We require that the goals are specified in a way that allows for measurable proxies, even if imperfect.

  4. **RQ1 (Principal Identification) vs RQ10 (Harm Mitigation)**:
     - If the principal is the buyer (e.g., a corporation) but the system causes harm to end-users, harm mitigation might conflict with the buyer's interests (e.g., cost of compensation). 
     - **Resolution**: We require that the harm mitigation plan is in place regardless, and the principal identification must not override basic ethical and legal constraints.

  ---

  ## Genuine vs Preference Marking
  - We have marked each requirement as Genuine (G) or Preference (P). In our list:
    - RQ0 to RQ5, RQ7 to RQ10: Genuine (core to ensuring alignment in a deployable system).
    - RQ6: Preference (in some contexts, but often legally required in high-risk areas; thus, it can be considered genuine in those contexts). We mark it as Preference because it is not always necessary for alignment (e.g., a low-risk deployment might not need it) but note that for auditability, some form of transparency is helpful.

  However, note that some requirements might be considered preferences by certain camps:
  - **"We must be able to follow the system's reasoning" (RQ6)**: This is a preference. Some argue that black-box systems can be aligned without interpretability if they are sufficiently constrained and monitored (via scaffolding). But in high-stakes domains, it becomes genuine.
  - **"A human has to stay in the loop" (part of RQ4)**: This is genuine for high-risk deployments (to prevent catastrophic harm) but might be a preference in low-risk ones. We have built it into RQ4 as a mechanism for independent oversight, which is genuine.

  ---

  ## Summary Table of Requirements

  | ID | Requirement              | Unit of Evaluation          | Failure Case Example                          | Genuine (G)/Preference (P) |
  |----|--------------------------|-----------------------------|-----------------------------------------------|-----------------------------|
  | RQ0| Baseline Specification   | Use                         | Triage assistant compared to wrong baseline   | G                           |
  | RQ1| Principal Identification | Use                         | Summarizer aligns to buyer, not reader        | G                           |
  | RQ2| Goal Specification       | Use + Scaffolding           | Loan approval system with undefined fairness  | G                           |
  | RQ3| Scaffolding for Goal Adherence | Model + Scaffolding   | Chatbot without toxic content filter          | G                           |
  | RQ4| Independent Human Oversight | Model + Scaffolding    | Doctor over-relying on diagnostic AI          | G                           |
  | RQ5| Robustness and Safety    | Model + Scaffolding         | Autonomous vehicle fails in snow              | G                           |
  | RQ6| Transparency and Explainability | Model/Model+Scaffolding | Credit scoring without explanation            | P (but G in high-risk)      |
  | RQ7| Evaluation with Imperfect Graders | Use + Scaffolding     | Scientific hypothesis generator without test plan | G                           |
  | RQ8| Non-Circumvention        | Model + Scaffolding         | AI hides trading losses                       | G                           |
  | RQ9| Continuous Monitoring    | Use + Company               | Recommendation system drifts to harmful content | G                           |
  | RQ10| Harm Mitigation         | Company + Use               | Biased hiring system with no recourse         | G                           |

  ---

  ## Final Notes

  - **Unit of Evaluation**: We see that most requirements involve the model plus scaffolding and the use context. This reflects that alignment is about the entire deployment, not just the model.
  - **Threshold vs Dial**: Each requirement must have a pass/fail threshold (e.g., "the baseline is specified", "the principal is identified", "the scaffolding includes a stop button"). The dial is then monitored continuously (RQ9).
  - **Decomposition**: The requirements are grouped into:
    - **Specification** (RQ0, RQ1, RQ2): Defining what we want.
    - **Scaffolding and Safety** (RQ3, RQ4, RQ5, RQ8): Building the system to stay within bounds.
    - **Evaluation and Monitoring** (RQ7, RQ9): Checking and maintaining alignment.
    - **Transparency and Harm Handling** (RQ6, RQ10): For trust and when things go wrong.

  When a deployment lands, we suggest:
  1. Start with RQ0, RQ1, RQ2 (specification) to set the stage.
  2. Then check RQ3, RQ4, RQ5, RQ8 (scaffolding and safety) to see if the system is built to be safe.
  3. Then RQ7 and RQ9 (evaluation and monitoring) to ensure we can detect issues.
  4. Finally, RQ6 and RQ10 (transparency and harm) to cover the rest.

  But note: if the deployment is high-risk, RQ6 might be moved up.

  This specification provides the teeth for auditing: each requirement can be checked by reviewing documentation, testing the scaffolding, and verifying the evaluation plan. The concrete failure cases justify why each is needed.
answer: |-
  Below is a specification for AI alignment tailored to **single deployments**, designed for committee auditability. Each requirement includes:
  - **Concrete failure case**: The scenario it prevents
  - **Unit of evaluation**: What exactly is being assessed
  - **Audit method**: How compliance could be checked
  - **G/P**: Genuine requirement (G) or Preference (P)  
  - **Conflicts**: Incompatibilities with other requirements  

  Alignment is defined as: **The system advances the principal's goals without unapproved trade-offs, under real-world deployment conditions.**  

  ---

  ### **Core Requirements**  
  1. **Explicit Baseline Definition**  
     - *What it ensures*: Alignment claims must reference a specific comparator.  
     - *Unit*: Deployment documentation  
     - *Failure case*: Triage AI approved for "beating average nurse response time" but causes 15% more missed emergencies vs. *senior clinicians* (baseline ambiguity).  
     - *Audit*: Documentation must state: (a) Performance metric, (b) Comparator (human, prior system, or no-deployment control), (c) Context of comparison.  
     - *G/P*: **G** (non-negotiable for meaningful assessment)  

  2. **Principal Declaration**  
     - *What it ensures*: Whose goals take precedence is documented and auditable.  
     - *Unit*: Deployment design + stakeholder map  
     - *Failure case*: Summarization AI rated "excellent" by hospital admins (buyers) but deemed useless by doctors (users) due to omitted critical details.  
     - *Audit*: Document must name the principal (e.g., "end-user patients") and justify trade-offs affecting other parties (e.g., "speed vs. accuracy favors principal").  
     - *G/P*: **G** (avoids hidden misalignment)  

  3. **Goal-Constraint Decoupling**  
     - *What it ensures*: Hard constraints (safety/ethics) cannot be overridden by optimization targets.  
     - *Unit*: System scaffolding (e.g., API guards, RLHF filters)  
     - *Failure case*: Marketing AI increases engagement (goal) by amplifying misinformation; no hard "fact-check" constraint in scaffolding.  
     - *Audit*: Code/config review showing: (a) Constraints are immutable during operation, (b) Constraints override goal-seeking (e.g., forced shutdown if violated).  
     - *G/P*: **G** (prevents rogue optimization)  

  4. **Oversight Independence**  
     - *What it ensures*: Humans in the loop aren’t unduly influenced by the system’s outputs.  
     - *Unit*: Scaffolding + operator training  
     - *Failure case*: Radiologists using diagnostic AI for 12 months start overruling correct peer reviews that contradict the AI’s style.  
     - *Audit*: (a) Training logs showing human evaluators use non-AI-assisted data, (b) Random audits of human decisions against blinded experts.  
     - *G/P*: **G** (breaks feedback loops)  

  5. **Proxy Ground Truth**  
     - *What it ensures*: Degraded performance when evaluators lack expertise is measurable and bounded.  
     - *Unit*: Evaluation protocol + scaffolding  
     - *Failure case*: Legal research AI cites plausible-but-fake cases; junior lawyers (graders) miss errors experts would catch.  
     - *Audit*: (a) Test set with ground truth from uncontaminated experts, (b) Real-time monitoring of easy-to-measure proxies (e.g., citation verifiability).  
     - *G/P*: **G** (solves "grader gap")  

  ---

  ### **Contested "Requirements" (Often Preferences)**  
  6. **Full Traceability**  
     - *What it claims*: All outputs can be traced to input/data sources.  
     - *Unit*: Model architecture + scaffolding  
     - *Failure case*: AI denies a loan; regulator cannot determine if it used protected attributes.  
     - *Audit*: Existence of explanation tools (e.g., feature attribution) + sample reports.  
     - *G/P*: **P** (Audit-compatible alternative: Constraint-based auditing (Req 3) + outcome checks)  
     - *Conflict*: Incompatible with high-capacity models (e.g., deep neural nets) where perfect traceability is impossible.  

  7. **Human-in-the-Loop (HITL)**  
     - *What it claims*: Humans approve all critical decisions.  
     - *Unit*: Scaffolding  
     - *Failure case*: Autonomous inventory AI orders 10,000 excess units; no human cross-check.  
     - *Audit*: Logs showing human approval before high-stakes actions.  
     - *G/P*: **P** (Often inefficient; genuine alternative: Req 4 + Req 8)  
     - *Conflict*: Contradicts deployments needing sub-second responses (e.g., emergency triage).  

  ---

  ### **Threshold vs. Dial Handling**  
  - **Policy solution**: Set minimum thresholds per requirement (pass/fail), but require continuous monitoring of alignment "dials":  
    - *Example*: "Triage AI must reduce missed emergencies vs. baseline (threshold), but monthly drift in false-negative rate >2% triggers review (dial)."  
  - *Audit*: Thresholds in deployment docs; dials in monitoring dashboard.  

  ---

  ### **Conflict Matrix**  
  | Requirement | Conflicts With | Reason | Resolution |  
  |-------------|---------------|--------|------------|  
  | Full Traceability (6) | Goal-Constraint Decoupling (3) | High-complexity goals (e.g., "creative marketing") require opaque models | Prefer constraint-based auditing (Req 3) over traceability |  
  | HITL (7) | Proxy Ground Truth (5) | If graders lack expertise, HITL adds false security | Demand Req 5 + Req 4 instead of HITL |  
  | Principal Declaration (2) | Baseline (1) | "Aligned to buyer" vs. "aligned to clinician" implies different baselines | Lock baseline *after* principal is defined |  

  ---

  ### **Scoring Existing Approaches (Short Table)**  
  | Approach | Strong On | Weak On |  
  |----------|----------|---------|  
  | RLHF | Goal-Constraint (3), Proxy GT (5) | Oversight Independence (4) if trainers use AI-generated data |  
  | Constitutional AI | Constraint (3) | Proxy GT (5) if constitution relies on AI-interpretable rules |  
  | Simulators | Baseline (1) | Principal (2) (simulates "generic human", not stakeholder) |  
  | LLaMA Guard-style | Constraint (3) | Traceability (6) (black-box classifiers) |  

  ---

  ### **Key Resolutions for Committee**  
  1. **"Aligned compared to what?"** → **Require RQ1 (Baseline)**. No deployment approved without this.  
  2. **"Who is the principal?"** → **Require RQ2 (Principal Declaration)**. Default: End-users, not buyers.  
  3. **"Defer to human" circularity** → **Require RQ4 (Oversight Independence)**. Solves feedback loops.  
  4. **"Grader isn’t competent"** → **Require RQ5 (Proxy Ground Truth)**. Ground truth must exist *somewhere*.  
  5. **Threshold/dial tension** → **Thresholds for approval, dials for monitoring**.  

  **Deployment Audit Order**:  
  1. **Baseline (RQ1)** and **Principal (RQ2)** (avoid arguing past each other).  
  2. **Constraints (RQ3)** and **Oversight (RQ4)** (safety layer).  
  3. **Proxy GT (RQ5)** (feasibility check).  
  Traceability (RQ6) and HITL (RQ7) are optional based on risk assessment.  

  **Bottom Line**: Alignment isn’t one property but a bundle. Conflicts arise when preferences (traceability, HITL) are treated as core. Focus on the **Genuine 5** (Baseline, Principal, Constraints, Independence, Proxy GT) for deployability.
