answer: |-
  ### Rational Choice Seminar: Diachronic Dutch Book Exercise  
  **Objective:** Make students *feel* the vulnerability of non-conditionalizing update rules through a hands-on Dutch book exercise, then break the argument by relaxing key assumptions.  

  ---

  ### **Core Mechanics**  
  **Setup:**  
  - **Pairs:** Punter (sets prices) and Bookie (exploits inconsistencies). Roles swap halfway.  
  - **Tickets:** Based on a fair 6-sided die roll. Outcomes: {1, 2, 3, 4, 5, 6}.  
    - **Ticket A:** Pays 100 points if die is **1 or 3** (i.e., 1 or 3).  
    - **Ticket B:** Pays 100 points if die is **≤3** (i.e., 1, 2, or 3).  
  - **Evidence Partition:**  
    - **ODD:** {1, 3, 5}  
    - **EVEN:** {2, 4, 6}  
  - **Price Sheets:**  
    - **Sheet 1 (Prior):** Prices *before* evidence.  
    - **Sheet 2 (Plan):** Prices *after* learning ODD or EVEN, filled in advance.  
      - Columns: "If told ODD", "If told EVEN".  
  - **Key Rule:** Punters set **one price per ticket** (0–100) for buying/selling. Bookies see both sheets and can trade at these prices.  

  **Rationale for Tickets:**  
  - **Ticket A** (1 or 3):  
    - Prior: 2/6 ≈ 33.33.  
    - If ODD: P(A|ODD) = 2/3 ≈ 66.67 (since {1,3} are the only A in ODD).  
    - If EVEN: P(A|EVEN) = 0 (no A in EVEN).  
    - *Temptation:* Punters might under-update (e.g., set 50 for A|ODD) or over-update (e.g., set 80 for A|ODD).  
  - **Ticket B** (≤3):  
    - Prior: 3/6 = 50.  
    - If ODD: P(B|ODD) = 2/3 ≈ 66.67 (since {1,3} are ≤3, {5} is not).  
    - If EVEN: P(B|EVEN) = 1/3 ≈ 33.33 (only {2} is ≤3).  
    - *Temptation:* Punters might set B|EVEN to 20 (under-update) or 50 (ignore evidence).  
  - **Why this works:** Tickets are evidence-dependent but not obvious. Punters can’t derive prices mechanically, tempting them to set incoherent plans.  

  ---

  ### **Timeline (75 Minutes)**  
  **0–5 min: Intro & Setup**  
  - Recap synchronic Dutch book ("parlor trick" vibe).  
  - Frame today: "You’re a punter who pre-commits to a *plan* for updating prices after evidence. Bookies get to exploit your plan over time."  
  - Distribute materials: Dice, chips, **Punter Worksheet** (Appendix A), **Bookie Worksheet** (Appendix B).  

  **5–25 min: Round 1 (Punter → Bookie)**  
  - **Punters:** Fill Sheet 1 (prior) and Sheet 2 (plan). **Nudge them toward incoherence:**  
    > *"Set prices that feel right. If you hear ODD, does that change how much you’d pay for A? Be honest—don’t overthink conditionalization."*  
    - Most will set coherent priors but may under/over-update:  
      - E.g., Set A|ODD = 50 (should be 66.67), or B|EVEN = 50 (should be 33.33).  
  - **Bookies:** Review opponent’s sheets. Use **Bookie Worksheet** to:  
    1. Identify a ticket/evidence combo with a price gap (e.g., A in ODD).  
    2. Apply the "sell high now, buy back low later" move:  
       - If planned price (e.g., A|ODD) < prior price:  
         - Sell A to punter now (at prior price).  
         - Buy A back later *if ODD occurs* (at lower planned price).  
       - If planned price > prior price: Reverse (buy now, sell later).  
    3. Calculate guaranteed profit (see Bookie Worksheet).  
  - **Trade Execution:**  
    - Roll die, announce ODD/EVEN.  
    - Bookies execute trades (prior bets + post-evidence bets if applicable).  
    - Settle payouts.  

  **25–35 min: Debrief Round 1**  
  - Poll: "Punters, how many got exploited?"  
  - Highlight:  
    - Exploit targets *update rules* (e.g., "You planned to under-value A if ODD").  
    - Bookies win by exploiting *inconsistency between time 0 and time 1*.  

  **35–55 min: Round 2 (Bookie → Punter)**  
  - Roles swap. Repeat with same tickets.  
  - Punters (now wiser) may avoid exploits.  

  **55–65 min: Break the Dutch Book (3 Variants)**  
  - Run variants sequentially. After each, ask: **"Can bookies still guarantee a win? Why?"**  
    1. **Bid-Ask Spread:**  
       - Punters set two prices: Bid (buy) and Ask (sell).  
       - *Effect:* Spreads block exploits (bookies can’t buy low/sell high simultaneously).  
    2. **Withdrawal Fee (3 points):**  
       - Punters can renege on pre-signed trades by paying 3 points.  
       - *Effect:* Cheap withdrawal kills guarantees (bookies face uncertainty).  
    3. **Forgetful Punter:**  
       - Punter’s classmate fills Sheet 2 *without seeing Sheet 1*.  
       - *Effect:* Updates are unpredictable—no coherent plan to exploit.  

  **65–75 min: Debrief & Conceptual Map**  
  - **Q1:** "What made you vulnerable in Round 1?"  
    - *Key point:* Commitment to pre-set prices + no reneging.  
  - **Q2:** "Which variant felt safest? Why?"  
    - *Key points:*  
      - Spreads protect against forced trades.  
      - Withdrawal fees reframe the argument as about *enforceability* of commitments.  
      - Forgetfulness breaks the "predictable plan" assumption.  
  - **Connect to Theory:**  
    - **Target:** Update rules (not static beliefs).  
    - **Hidden Assumptions:**  
      - Commitment to pre-commitments (broken by withdrawal fee).  
      - No bid-ask spreads (market frictions).  
      - Punter’s future self is predictable (broken by forgetfulness).  
    - **Limitations of the Game:**  
      - Evidence partition is known upfront (no "unexpected evidence").  
      - Points ≠ utility (risk neutrality assumed).  
  - **Punchline:** "The diachronic argument is a critique of *planning*—but real agents can renege, add spreads, or change unpredictably."  

