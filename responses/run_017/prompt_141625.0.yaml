  ### **Appendices**  
  #### **Appendix A: Punter Worksheet**  
  ```plaintext
                               PRIOR (SHEET 1)               
  | Ticket | Your Price (0–100) |  
  |--------|---------------------|  
  |   A    |         ___        |  // Ticket A: Pays 100 if 1 or 3  
  |   B    |         ___        |  // Ticket B: Pays 100 if ≤3  

                               PLAN (SHEET 2)  
  | Ticket | If told ODD | If told EVEN |  
  |--------|-------------|--------------|  
  |   A    |     ___     |     ___      |  
  |   B    |     ___     |     ___      |  
  ```  

  #### **Appendix B: Bookie Worksheet**  
  ```plaintext
  1. Find an exploit opportunity (e.g., Ticket A in ODD):  
     Prior price (Sheet 1): ______  
     Planned price if ODD (Sheet 2): ______  

  2. If planned price < prior price:  
     - SELL Ticket A to punter now (at prior price).  
     - If ODD occurs, BUY it back later (at planned price).  
     Profit if ODD: (prior price - planned price).  
     Profit if EVEN: prior price (since no buyback needed and ticket is worthless).  

  3. If planned price > prior price:  
     - BUY Ticket A from punter now (at prior price).  
     - If ODD occurs, SELL it back later (at planned price).  
     Profit if ODD: (planned price - prior price).  
     Profit if EVEN: 0 (ticket is worthless; you hold it).  

  4. Guaranteed profit? Only if no loss in any outcome.  
  ```  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Punters set coherent plans:**  
     - 30% will still under/over-update. **Nudge:** "Don’t calculate—go with your gut after hearing ODD."  
  2. **Bookies miss the exploit:**  
     - **Fix:** Walk around with a "hint card": "Sell high now, buy back low later if evidence comes true."  
  3. **Arithmetic slows things down:**  
     - **Fix:** Use whole numbers (e.g., 33, 67) and calculators.  
  4. **Withdrawal fee variant confuses:**  
     - **Fix:** Emphasize: "Pay 3 points to back out of any pre-signed trade after evidence."  

  ### **What the Game Can’t Stage**  
  - **Unexpected Evidence:**  
    - Real diachronic books require evidence you *couldn’t* anticipate (e.g., a 7 on the die). The game’s partition is known.  
  - **Risk Aversion:**  
    - Points ≠ utility. Exploits assume linear utility (safe for classroom chips, but a real hole).  
  - **Zero-Probability Evidence:**  
    - If P(E)=0, conditionalization is undefined. Not an issue here (ODD/EVEN each P=0.5).  

  ### **Instructor Cheat Sheet**  
  - **Key Move to Watch For:** Bookies discovering "sell high now, buy back low later."  
  - **Debrief Soundbite:** "The diachronic book isn’t about stupidity—it’s about being *locked into a bad plan*."  
  - **Clincher:** "Violating conditionalization isn’t irrational if you can renege, add spreads, or change unpredictably."  

  --- 

  **Materials Needed:**  
  - Dice (1 per pair), cups to hide rolls.  
  - Poker chips (for points).  
  - Printed worksheets (Punter/Bookie).  
  - Calculators (optional).  

  This design forces punters to confront their *future* pricing decisions, makes exploits visceral, and breaks the Dutch book to reveal its assumptions. The tickets tempt incoherence, and variants spotlight commitment as the real target.
