            - After E2, they sold a bet on A for 0.4, but then since A occurs, they have to pay 1. Net from the two trades: 0.5 (from time 0) + 0.4 - 1 = -0.1.

        So in s2, they lose 0.1.

     If not A (s3):
        - At time 0: they paid 0.5 and get nothing -> -0.5.
        - After E2, they sold a bet on A for 0.4, and since A doesn't occur, they pay nothing. Net: -0.5 + 0.4 = -0.1.

   So in both s2 and s3, they lose 0.1, and in s1 they gain 0.5. But this is not a sure loss because in s1 they win.

   So it's not a Dutch book.

   I see the mistake: if the bookie buys the bet on A after E2, then in s2 the punter has to pay 1 for the bet they sold, but they also have the bet they bought at time 0 which pays 1, so they can use that to pay. But the bookie is buying a new bet, so the punter now has two obligations: the bet they sold at time 0 and the bet they sold at time 1.

   Let's clarify the bets:

   At time 0: bookie sells to the punter a bet on A: so if A occurs, the bookie pays the punter 1.
   At time 1 after E2: bookie buys from the punter a bet on A: so if A occurs, the punter pays the bookie 1.

   In state s2:
     - The time 0 bet: since A occurs, the bookie pays punter 1.
     - The time 1 bet: since A occurs, the punter pays bookie 1.
     - Net: the two bets cancel, but the money: 
          - Time 0: punter paid 0.5 to bookie.
          - Time 1: bookie paid 0.4 to punter for the second bet.
     - So net money transfer: punter lost 0.5 and gained 0.4 -> net loss of 0.1.

   In state s1:
     - Only the time 0 bet: bookie pays punter 1, punter paid 0.5 -> net gain 0.5.

   In state s3:
     - Time 0 bet: doesn't pay, so punter lost 0.5.
     - Time 1 bet: doesn't pay, so punter doesn't lose anything extra, but they received 0.4 from the sale.
     - Net: -0.5 +0.4 = -0.1.

   So indeed, the punter gains in s1 and loses in s2 and s3. This is not a sure loss.

   To make it a sure loss, the bookie must ensure that in s1 they also lose. How? The bookie can also make a bet on the evidence.

   But in s1, evidence E1 occurs, so the bookie doesn't do anything after. So to cause a loss in s1, the bookie must include a bet that loses in s1.

   So let's have the bookie also sell a bet on not A at time 0? That might overcomplicate.

   Given the time, perhaps we should use the standard approach with the conditional bet.

   After reading the standard diachronic Dutch book, I see that the bookie can make the following bets:

   Bet 1 (at time 0): 
      - Pays 100 * (c - q) if E occurs, nothing otherwise. 
      - The price for this bet should be 0 if the probabilities are coherent, but it's not set.

   I think for the classroom, we should use a different approach.

   We can use the strategy from the SEP entry on Dutch books:

   The bookie can offer at time 0:
      - A bet that pays [100 * (c - the indicator of A)] if E occurs, and 0 otherwise.
   Then after learning E, if E occurs, the bookie also offers a bet on A at the updated rate.

   But again, we are limited by the prices the punter has set.

   Given the complexity, and since we are in a classroom with movable chairs and poker chips, I propose to use a very simple setup that has been tested in similar classrooms.

   I recall an exercise by Brian Weatherson or perhaps others: use a coin toss that can land Heads or Tails, and then a second coin toss. But that might be too much.

   Another idea: use a single die roll, and the evidence is the parity (ODD/EVEN), and the event is "1 if ODD, 2 if EVEN" or something. But that's not random.

   Given the time, let's go with the following practical solution:

   We will have only one event ticket: A = "die is 1 or 3" (so as above, which is 2/6 in the prior, 2/3 given ODD, 0 given EVEN).

   And we will have the evidence announced as ODD or EVEN.

   The bookie strategy will be to:
     - At time 0: buy the ticket on A from the punter at the prior price p.
     - At time 1, after the evidence is announced:
          - If ODD is announced, sell the ticket on A to the punter at the planned price q (which should be 2/3 but might be set differently).
          - If EVEN is announced, do nothing.

   Then, as before, if ODD occurs, the bookie profits by q - p, and has no position.
   If EVEN occurs, the bookie holds the ticket, which is now worthless (because A requires 1 or 3, and EVEN has 2,4,6), so the ticket is worth 0. The bookie paid p for it, so they lose p.

   So to make it a Dutch book, the bookie must also ensure a profit in the EVEN case. How? By also betting on the evidence.

   So if we include a ticket for ODD, then the bookie can:

     - At time 0: 
          - Buy the ticket on A for price p.
          - Sell a ticket on ODD for price a ( the punter's price for ODD).
     - At time 1:
          - If ODD is announced, then sell the ticket on A for price q.
          - (The ticket on ODD: since ODD occurred, the bookie must pay 100 to the punter for the ODD ticket.)

     - Additionally, because the bookie sold the ODD ticket, they must pay 100 if ODD occurs.

     Now, let's see the bookie's position:

     Case 1: ODD occurs.
          - from time 0: 
               - spent p to buy A ticket.
               - received a for selling ODD ticket.
          - at time 1:
               - received q for selling A ticket.
               - paid 100 for the ODD ticket.
          - net: a - p + q - 100.

     Case 2: EVEN occurs.
          - from time 0:
               - spent p to buy A ticket (which is now worthless).
               - received a for selling ODD ticket (which is also now worthless, so no payout).
          - net: a - p.

     We want both to be positive.

     So we need:
          a - p > 0   [ for EVEN case ]
          a - p + q - 100 > 0   [ for ODD case ]

     But note: in the ODD case, if the punter has coherent prices, then the prior price for A should be: 
          p = P(A) = P(A|ODD)*P(ODD) + P(A|EVEN)*P(EVEN) = (2/3)*(1/2) + 0*(1/2) = 1/3.
          and a = P(ODD) = 1/2 = 50.
          and q = P(A|ODD) = 2/3 ≈66.67.

     Then in EVEN case: a - p = 50 - 33.33 = 16.67 >0.
     In ODD case: 50 - 33.33 + 66.67 - 100 = (50+66.67) - (33.33+100) = 116.67 - 133.33 = -16.66 <0.

     So not a Dutch book.

     But if the punter sets the planned price for A given ODD to be too low, say q=40, then:
          ODD case: 50 - 33.33 + 40 - 100 = (50+40) - (33.33+100) = 90 - 133.33 = -43.33 <0.

     Still not both positive.

     Alternatively, if q is too high, say q=80, then:
          ODD case: 50 - 33.33 +80 -100 = (50+80) - (33.33+100) = 130 - 133.33 = -3.33 <0.

     So it seems difficult.
     
   We need a different strategy.

   Let me try the opposite initial trades.

   Suppose the bookie suspects that the planned price q for A given ODD is too low. Then the bookie should sell at time 0 and buy back at time 1.

   So:
     - At time 0:
          - Sell the ticket on A to the punter for price p.
          - Buy a ticket on ODD from the punter for price a.
     - At time 1, if ODD occurs:
          - Buy the ticket on A from the punter for price q.

     Case ODD occurs:
          - time 0: 
               - received p for selling A.
               - paid a for buying ODD.
          - time 1: paid q for buying back A.
          - also, because ODD occurred, the bookie gets 100 from the ODD ticket.
          - net: p - a - q + 100.

     Case EVEN occurs:
          - time 0:
               - received p for selling A (and now must pay 100 if A occurs, but in EVEN, A does not occur, so no payment).
               - paid a for the ODD ticket, which is now worthless.
          - net: p - a.

     We want both net >=0 and at least one >0.

     So conditions:
          p - a >=0  [EVEN]
          p - a - q +100 >=0  [ODD]

     In the coherent case:
          p = 1/3 *100 = 33.33
          a = 50
          q = 66.67
          EVEN: 33.33 - 50 = -16.67 <0 -> not good.

     If the punter sets q too low, say q=40, then:
          ODD: 33.33 - 50 -40 +100 = (33.33+100) - (50+40) = 133.33 - 90 = 43.33 >0.
          EVEN: 33.33 -50 = -16.67 <0.

     still not good.

     If the punter sets q too high, say q=80, then:
          ODD: 33.33 -50 -80 +100 = (33.33+100) - (50+80) = 133.33 - 130 = 3.33 >0.
          EVEN: still -16.67 <0.

     So in EVEN case, the bookie loses money.

     unless the bookie can choose the amount of the bet on ODD.

     Let the bookie buy k tickets on ODD.

     Then:
     - At time 0:
          - Sell one ticket on A for p.
          - Buy k tickets on ODD for price a each -> total cost: k*a.
     - At time 1 if ODD occurs:
          - Buy back the ticket on A for q.
          - Receive 100*k from the ODD tickets.
          - Net: p - k*a - q + 100*k.
     - If EVEN occurs:
          - Net: p - k*a.

     We want for some k:
          (1) p - k*a >=0
          (2) p - k*a - q + 100*k >=0

     And at least one >0.

     In the coherent case, this is hard, but for a non-conditionalizing punter, we might find k.

     Example: punter sets p=40, a=50, and for ODD: q=20 ( which is too low because it should be 66.67).

     Then we want k such that:
          (1) 40 - 50*k >=0  -> k<=40/50=0.8, so k<=0.8, but k must be integer so k=0 or maybe factional in points? In our case, we can allow fractional bets? Or we can scale the units.

     Alternatively, we can allow the bookie to buy a portion of a ticket. In classroom, we can use decimal.

     Let's allow any real number k.

     For the example above, if we set k=0.5, then:
          (1) 40 - 50*0.5 = 40 - 25 = 15 >=0.
          (2) 40 - 25 - 20 + 100*0.5 = (40-25-20) +50 = -5+50=45>=0.

     So both positive.

     In the EVEN case, the bookie wins 15.
     In the ODD case, the bookie wins 45.

     So it works.

     Therefore, the bookie can use a strategy that involves buying k tickets on ODD, where k is chosen such that both conditions are met.

     In the example where the punter sets q too high, say q=80, then we can use a different k.

     But wait, if q is too high, then the bookie should sell at time 0 and buy at time 1, but in the above strategy we are buying ODD and selling A at time 0, and then buying A at time 1 if ODD. This is for when q is too low.

     If q is too high, then the bookie should do the opposite: buy A at time 0 and sell A at time 1 if ODD. And also bet on ODD in the opposite way.

     So for q too high (q > what it should be), the bookie can:
          - At time 0: 
               - Buy one ticket on A for price p.
               - Sell k tickets on ODD for price a each.
          - At time 1 if ODD occurs:
               - Sell one ticket on A for price q.
          - If ODD occurs, then the bookie must also pay 100*k for the ODD tickets.

     Then in ODD case: -p + k*a + q - 100*k
     In EVEN case: -p + k*a  (because ODD tickets expire worthless)

     We want both >=0.

     Example: p=40, a=50, q=80 ( planned for ODD).

     Then we want k such that:
          (1) -40 + 50*k >=0 -> k>=40/50=0.8
          (2) -40 + 50*k +80 -100*k = 40 -50*k >=0 -> 40>=50*k -> k<=40/50=0.8.

     So k=0.8.
          (1) -40 + 50*0.8 = -40+40=0.
          (2) 40 -50*0.8=0.
     So exactly 0 in both cases.

     So the bookie can break even, but not make a strict profit. If we require strict profit, then it's not possible in this case with these prices. But in the classroom, we can show that the punter doesn't lose money either, so no harm.

     But if the prices are not exactly coherent in the prior, the bookie might make a profit in both cases.

     Given the time, and since this is for a classroom where the point is to see the exploit for non-conditionalizing, we can hope that in the cases where the planned price is too low, the bookie can make a profit by buying ODD tickets and selling A, and then buying back A after if ODD occurs.

     And if the planned price is too high, the bookie can make a profit (or at least break even) by selling ODD tickets and buying A at time 0, and then selling A after if ODD occurs.

     So in the instructions to the bookie, we can say: look for opportunities where the planned price in one of the evidence scenarios is very different from the prior. Then, choose k to try to make both cases non-negative.

     But this might be too complex for students to do on the fly.

   Given the complexity, I propose to simplify the exercise in the following way:

   We will have the evidence partition as before, and only one event ticket, and also a ticket for the evidence (ODD).

   Then, we will have the students (bookies) look for:

     - If the punter's planned price for A given ODD is lower than the prior price for A, then use strategy 1: 
          Time 0: 
             - Sell the ticket on A to the punter at price p.
             - Buy k tickets on ODD from the punter at price a.
          Time 1 (if ODD): 
             - Buy the ticket on A from the punter at price q.
          Choose k such that: p - k*a >=0 and p - k*a - q + 100*k >=0.

     - If the punter's planned price for A given ODD is higher than the prior price for A, then use strategy 2:
          Time 0:
             - Buy the ticket on A from the punter at price p.
             - Sell k tickets on ODD to the punter at price a.
          Time 1 (if ODD):
             - Sell the ticket on A to the punter at price q.
          Choose k such that: -p + k*a >=0 and -p + k*a + q - 100*k >=0.

   We can provide a worksheet for the bookie to plug in the numbers and choose k.

   But this might be too time-consuming.

   Alternatively, we can have the bookie only use one unit of the tickets and hope that the punters' prices are sufficiently incoherent that one unit shows a loss in some cases, and then the bookie can see that they win in one case and lose in the other, but overall expected profit is positive. But we want a guaranteed profit.

   Given the time constraints of a 75-minute class, and that this is an upper-level seminar, I think we can provide the bookie with a worksheet that does the calculation for k. But it might be heavy.

   Perhaps for the first run, we use a specific example where the numbers work out easily.

   For example, assume the die is fair, and the punter's prices:
     Prior: 
          ODD: 50
          A: 40   [ note: coherent would be 33.33, so 40 is a bit high ]
     Planned if ODD: 
          A: 60   [ coherent would be 66.67, so 60 is a bit low ]

   Then for strategy 1 ( since planned for ODD is 60 < prior 40? No, 60>40, so wait: the prior is 40, planned is 60, so planned is higher, so use strategy 2.

   Strategy 2 for bookie when planned price > prior price.

     buy A at time 0: paying 40.
     sell k tickets on ODD at time 0: receive 50*k.
     at time 1 if ODD: sell A at 60.

     In EVEN: net = -40 + 50*k.
     In ODD: net = -40 + 50*k +60 - 100*k = 20 -50*k.

     We want:
          -40 + 50*k >=0 -> k>=40/50=0.8.
          20 -50*k>=0 -> k<=20/50=0.4.

     So no k exists.

     So try the other strategy because even though planned is higher, it might be still lower than what it should be? In coherent, planned should be 66.67, and 60<66.67, so it's too low.

     So use strategy 1 for when planned is too low.

     Strategy 1:
          Time 0: sell A for 40, buy k tickets on ODD for 50*k.
          Time 1 if ODD: buy A for 60.

          EVEN: net = 40 - 50*k.
          ODD: net = 40 -50*k -60 + 100*k = -20 +50*k.

          want: 40-50*k>=0 -> k<=0.8.
                 -20+50*k>=0 -> k>=0.4.

          So choose k=0.6.
          EVEN: 40 - 50*0.6 = 40-30=10.
          ODD: -20+50*0.6= -20+30=10.

     So in both cases, the bookie makes 10 points.

     So it works.

   Therefore, in the instructions to the bookie, we can say: 

     - If the planned price for A given ODD (q) is less than what it should be (which is the coherent price), then use strategy 1. But the bookie doesn't know the coherent price, only the prices set by the punter.

     - Instead, we can have the bookie try both strategies and see if for some k, both net amounts are non-negative.

     - Or we can have the bookie calculate the expected profit using the prior prices and choose the strategy that gives positive expected profit, but then it's not guaranteed.

   Given the pedagogical purpose, and time, we might have the bookie focus on one evidence cell at a time. For example, only consider the ODD announcement and see if they can exploit that.

   And for the exploit to be guaranteed, we need to use the hedging with the ODD ticket.

   So in the worksheet for the bookie, we can provide the following instructions:

     You are to see if you can make a series of bets that leaves you with a positive profit in both possible evidence outcomes (ODD and EVEN).

     You will consider the following two strategies for the event A given the evidence ODD:

     Strategy 1 (use when you think the planned price for A given ODD is too low):
          1. At time 0: 
               - Sell the ticket on A to the punter at price p.
               - Buy k tickets on ODD from the.punt tickets at price a.
          2. At time 1, if ODD is announced, buy the ticket on A from the punter at price q.
          3. If EVEN is announced, do nothing.
          Then in EVEN: you make p - k*a.
          In ODD: you make p - k*a - q + 100* [ because you bought k ODD tickets, and ODD occurred, so you receive 100 per ticket ].

     Strategy 2 (use when you think the planned price for A given ODD is too high):
          1. At time 0: 
               - Buy the ticket on A from the punter at price p.
               - Sell k tickets on ODD to the punter at price a.
          2. At time 1, if ODD is announced, sell the ticket on A to the punter at price q.
          3. If EVEN is announced, do nothing.
          Then in EVEN: you make -p + k*a.
          In ODD: you make -p + k*a + q - 100*k.   [ because you sold k ODD tickets, and ODD occurred, so you must pay 100 per ticket ]

     Then, for either strategy, solve for k that makes both evidence outcomes yield non-negative profit, and at least one positive.

     You may need to try
          For Strategy 1: 
               k <= p/a   ( from the EVEN case: p - k*a>=0)
               k >= (q - p + 20) / (100 - a) wait, let's from the ODD case: p - k*a - q + 100*k >=0 -> k*(100 - a) >= q - p.

          So if (100 - a) >0, then k>= (q-p)/(100-a).

     But note: a is the price for a ticket that pays 100 if ODD, so a should be between 0 and 100. Typically a<100.

     So for Strategy 1 to work, we need:
          (q-p)/(100-a) <= k <= p/a.

     and then choose k in that interval.

     Similarly for Strategy 2.

   Given the time, we might pre-calculate an example and have the students see the effect.

   For the sake of the classroom exercise, let's assume we will provide a simple set of prices that allow for an easy k.

   For example, for Strategy 1 to work, we need the interval to be non-empty: (q-p)/(100-a) <= p/a.

   So we can have the punter set prices that make this true.

   For instance, let a=50, p=40, q=60.
          then (q-p)/(100-a) = (60-40)/(50) =20/50=0.4.
          p/a = 40/50=0.8.
          so choose k=0.6.

   then, as above, profit=10 in both cases.

   So in the instructions to the punter, we might notate to set prices in whole numbers and maybe nudge them to set the planned price for A given ODD to 60, while the prior for A is 40 and for ODD is 50.

   How to nudge them? We might not, but in the first run, we can hope that some will set it differently.

   Alternatively, we can have the exercise with two event tickets and see if they update differently.

   Given the complexity, I think for the classroom, we will have to sacrifice some of the guaranteed profit in every state and instead show that in the cases where the evidence occurs, the bookie can make a profit by trading back, and in the cases where it does not, they might lose, but then discuss how in the prior betting they are covered.

   But then it's not a Dutch book.

   Given the time constraints, and since this is week 6 of an upper-level seminar, I will provide a detailed worksheet for the bookie to do the calculation for k. We will have them work in pairs and give them a calculator.

   But in the interest of time, we might have only one or two pairs actually find a Dutch book, and then in the debrief, we can show the one we prepared.

