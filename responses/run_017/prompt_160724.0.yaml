  Below is a one-page decision tree designed to diagnose disagreements about moral obligations to insects and other small invertebrates. It begins with a root commitment: you grant a non-zero, non-trivial chance of insects having valenced experiences with moral weight. Nodes are phrased as standalone claims or cases. After answering, follow the arrows to the next node or a labeled leaf position. Each leaf includes a name, its most awkward commitment, and its verdict on the two required cases.  

  ---

  ### **Decision Tree: What Do We Owe to Insects?**  
  **Root Commitment**: You grant a non-zero, non-trivial chance that an insect has valenced states (e.g., suffering/pleasure), and if it does, those states carry some moral weight.  

  1. **Uncertainty Type**: Is the debate about insect sentience primarily:  
     - **A. Empirical uncertainty** (resolvable with better science)? → **2**  
     - **B. Indeterminacy** (sentience is vague/multiply realizable; no sharp fact of the matter)? → **3**  

  2. **Risk vs. Degree** (if A at 1): A 10% chance an insect has "full" moral status is:  
     - **A. Morally equivalent to 10% moral weight** (e.g., 10% chance of 1 unit = 0.1 expected units). → **4**  
     - **B. Not equivalent; risk about status is distinct** (e.g., ambiguous probabilities demand caution). → **4**  

  3. **Aggregation Under Indeterminacy** (if B at 1): Can we aggregate expected welfare?  
     - **A. Yes** (treat vagueness like probability). → **4**  
     - **B. No** (indeterminacy blocks meaningful expectation). → **Leaf D**  

  4. **Trade-off Case**: Program A *certainly* averts 100 units of suffering in 10 chickens. Program B has probability *p* of averting 0.001 units/insect across 1 billion insects (else nothing). At what *p* are you indifferent?  
     - **A. *p* ≤ 0.001** (expected insect averted ≥ chicken averted). → **5**  
     - **B. 0.001 < *p* ≤ 0.01** (modest discount for risk/scale). → **5**  
     - **C. 0.01 < *p* ≤ 0.1** (heavy discount; e.g., status ambiguity). → **5**  
     - **D. *p* > 0.1** (near-certainty required). → **5**  
     - **E. Never choose B** (insects never count). → **6**  

  5. **Downward Extension**: Apply your logic to mites/nematodes (lower sentience probability, higher numbers). Does this imply significant moral weight?  
     - **A. Yes** (principled extension). → **7**  
     - **B. No** (principled stop, e.g., complexity threshold). → **7**  
     - **C. Feels absurd, but no principled reason** (ad hoc boundary). → **7**  

  6. **Why Never B?** (if E at 4): Your rejection is based on:  
     - **A. Moral concern requires definite bearers** (not probabilistic). → **Leaf H**  
     - **B. Probability below consideration threshold**. → **Leaf B**  
     - **C. Insects lack requisite capacities**. → **Leaf C**  

  7. **Population Case**: If insect lives are net negative, should we reduce their abundance?  
     - **A. Yes** (expected welfare gain outweighs ecological risk). → **8**  
     - **B. Only after research** (to reduce uncertainty/risk). → **8**  
     - **C. No** (ecological risks too high). → **8**  
     - **D. No** (constraint against intervention). → **Leaf I**  

  8. **Unpredictability**: Does inability to predict intervention effects mean we should not prioritize insect welfare?  
     - **A. Yes** (defeats priority; too intractable). → **Leaf G**  
     - **B. Not defeat, but research first** (postpone action). → **Leaf F**  
     - **C. No** (act on expected value despite uncertainty). → **9**  

  9. **Obligation vs. Permission**: If scale arguments win, do they:  
     - **A. Obligate reallocation** (maximize expected welfare). → **Leaf A**  
     - **B. Permit but not require reallocation** (optional priority). → **Leaf J**  
     - **C. Neither** (scale argument fails). → *[Error: Path contradicts root]*  

  ---

  ### **Leaf Positions**  
  *Each leaf includes: (1) Name, (2) Most awkward commitment, (3) Verdict on trade-off/population cases.*  

  - **Leaf A: Expected-Value Insect Prioritarian**  
    - *Commitment*: Must prioritize trillions of nematodes if expected welfare gain exceeds vertebrates.  
    - *Cases*: Indifferent at *p*≤0.001; supports reducing insect abundance if net negative.  

  - **Leaf B: Probability-Threshold View**  
    - *Commitment*: Ignores all stakes below a probability cutoff (e.g., 0.01), even if astronomically large.  
    - *Cases*: Never chooses B in trade-off; rejects abundance reduction (probability too low).  

  - **Leaf C: Capacity Threshold Stoic**  
    - *Commitment*: Insects lack integrated subjectivity; moral patiency requires vertebrate-like cognition.  
    - *Cases*: Never chooses B; rejects abundance reduction (insects don’t count).  

  - **Leaf D: Indeterminacy Skeptic**  
    - *Commitment*: Vagueness in sentience makes *all* expected-welfare arithmetic meaningless.  
    - *Cases*: Trade-off undefined; rejects abundance reduction (indeterminacy blocks action).  

  - **Leaf E: Risk-Sensitive Aggregator** (e.g., from 1A→2B→4B/C/D→5→7→8C→9A)  
    - *Commitment*: Discounts probabilistic moral weight (e.g., 10% chance ≠ 10% weight).  
    - *Cases*: Requires *p* >0.001 in trade-off; supports abundance reduction only with low risk.  

  - **Leaf F: Research-First Postponer**  
    - *Commitment*: Defers action indefinitely (even on vertebrates) until sentience is settled.  
    - *Cases*: Delays trade-off choice; supports abundance reduction only after decades of research.  

  - **Leaf G: Tractability Deprioritizer**  
    - *Commitment*: Practical difficulty justifies ignoring morally weighty causes.  
    - *Cases*: Avoids trade-off; rejects abundance reduction (too unpredictable).  

  - **Leaf H: Definite-Bearer Required**  
    - *Commitment*: Only concrete individuals (not probabilistic entities) can be moral patients.  
    - *Cases*: Never chooses B; rejects abundance reduction (insects aren’t "bearers").  

  - **Leaf I: Anti-Interventionist**  
    - *Commitment*: Opposes altering ecosystems even if expected welfare improves.  
    - *Cases*: Avoids trade-off; rejects abundance reduction (constraint against playing god).  

  - **Leaf J: Permissive Scalar** (e.g., from 1A→2A→4A→5B→7A→8C→9B)  
    - *Commitment*: Scale arguments permit insect prioritization but don’t override human/vertebrate needs.  
    - *Cases*: Indifferent at *p*≤0.001; supports abundance reduction if convenient.  

  ---

  ### **Notes on the Tree**  
  - **Permitted but Unheld Combinations**:  
    1. *Indeterminacy Aggregator + Definite Bearer* (3A→4→⋯→H): Incoherent—aggregating vague properties conflicts with requiring concrete bearers.  
    2. *Risk-Sensitive + Nematode Inclusion* (2B→4B/C/D→5A): Unexplored; few endorse risk-discounts while extending full weight to microbiota.  
  - **Indistinguishable Leaves**: **Leaf E** (Risk-Sensitive Aggregator) and **Leaf J** (Permissive Scalar) *both* answer trade-off with *p*>0.001 and support cautious abundance reduction. To pry apart: *Add a node* asking if a 0.0001% chance of preventing human extinction via insect welfare justifies action. Leaf E rejects (risk-discount); Leaf J permits but doesn’t require.  
  - **Key Node in Your Group’s Stalemate**: **Node 4 (Trade-off Case)**. Disagreements here reveal whether the deadlock stems from probability assignments (*p*-value chosen) or moral weighting (how probabilities combine with numbers).  

