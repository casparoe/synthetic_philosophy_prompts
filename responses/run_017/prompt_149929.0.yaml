        - Resolve Contract D: for every contract, if duck wins, the holder gets 1 chip from the counterparty? But note: in a bet, if they bet 1 chip on duck and win, they get their chip back plus 1 from the loser? We can do: 
              - Two participants agree to bet. They each put 1 chip in the pot. If duck wins, the one who bet on duck takes the 2 chips. If rabbit wins, the one who bet on rabbit takes them.
        - Alternatively, if they traded a contract: one participant bought the contract from another for a price P (paid in chips). Then at the end, if duck wins, the holder gets 1 chip from the facilitator? But we don't want the facilitator to be the house. Instead, the seller of the contract must pay the buyer 1 chip if duck wins. So the buyer paid P to the seller and then gets 1 chip from the seller if duck wins.

    We'll use the bet format for simplicity: they do even odds bets.

  - **Resolution (5 minutes)**: Now resolve the Phase 1 and Phase 2 bets. For Phase 1, we reveal the hidden bag (A or B) and settle the bets. For Phase 2, if any bets were made, settle them. For Phase 3, we already did.
  - **Debrief (15 minutes)**: Discuss what happened.

  ### Debrief
  1. **Phase 1**: 
     - Trading was active. Why? Each had private information and thought they had an edge. They were happy to trade with someone who had the opposite clue.
     - Point: With private information, trade can occur.

  2. **Phase 2**:
     - After the public announcement of intentions, trading dried up. Why? The public information (the counts) updated everyone's beliefs. The minority side realized they might be wrong and backed out. Or the majority became so confident that no one was left to take the other side.
     - This is the no-trade theorem in action: when it becomes common knowledge that two people want to trade (and what the overall demand is), it reveals information that makes the trade less attractive.

  3. **Phase 3**:
     - Trading came back. Why? Because the outcome (the group vote) was uncertain and depended on many factors. Participants had different beliefs about how the group would interpret the image. These beliefs might be based on their own interpretation, or their model of others. 
     - Point: When the outcome isn't just about an objective fact but about a complex, hard-to-enumerate event (like human perception), then even with common knowledge of willingness to trade, people might still trade because they have different models (frames) of the world.

  ### What can go wrong
  1. **Trading to be friendly**: Some might trade just to be nice. 
     - Mitigation: Emphasize that the goal is to win chips and get the prize. 
  2. **Gaming the game**: Some might not follow their clue and try to bluff. 
     - Mitigation: Explain that the activity is about using the information you have. But if they do, it's okay because it adds a layer of strategy? But it might obscure the point. 
  3. **Saying it's rigged**: If in Phase 2 the counts are very unbalanced, then when the bag is revealed, the majority wins. But sometimes the minority might be right? 
     - Actually, we don't reveal until the end. And in the bag setup, the counts are very informative. So if we get 12 reds and 2 blues, then it's very likely that the bag is A. If it turns out to be B, that's very unlikely (but possible). We can explain: "Yes, it's possible, but unlikely. The point is that the information from others made you update your belief."

  ### What the activity can't reproduce
  - The no-trade theorem in finance often assumes that traders are rational and update beliefs perfectly. Our participants might not. Also, in the real world, there might be noise traders or liquidity traders, which we don't have.
  - The theorem requires common knowledge of rationality and common priors. We might not have that. But we set up common priors (the 50-50 and the bag compositions). 
  - The frame disagreement phase is a bit forced: we are using an ambiguous image and a vote. In reality, frame disagreements might be about more complex things. But it illustrates the idea that when the outcome space isn't predefined, trade can occur.

  ### Ending on the knowledge aspect
  - We end by emphasizing that the key is about how information is aggregated and how common knowledge changes the game. 
  - Question they can't settle: "In Phase 3, if we had allowed discussion about the image, would trade still have occurred? Or would it have converged to a common view?"

  This should leave them thinking about how knowledge is shared and how common knowledge can freeze action, but in complex and ambiguous situations, diversity of thought can still allow trade.
