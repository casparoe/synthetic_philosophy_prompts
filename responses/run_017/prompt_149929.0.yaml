  ### **Activity: The Knowledge Trap**  
  A hands-on, low-math simulation of the no-trade theorem, designed for non-academics. Focuses on **information**, **common knowledge**, and **frame disagreement**.  

  ---

  #### **Materials**  
  - **Chips**: 15 per participant (use poker chips or colored paper).  
  - **Bags & Marbles**:  
    - 2 opaque bags:  
      - *Bag A*: 10 red marbles, 2 blue marbles.  
      - *Bag B*: 2 red marbles, 10 blue marbles.  
    - 1 coin for flipping.  
  - **Ambiguous Image**: Print 10 copies of an optical illusion (e.g., the duck-rabbit image).  
  - **Stupid Prize**: A quirky item (e.g., a rubber chicken, a giant plastic trophy).  
  - **Whiteboard** to track public offers/decisions.  
  - **Index cards** for private info.  

  ---

  ### **Phase 1: Private Trading (25 mins)**  
  *Goal: Trade feels profitable with private info.*  
  **Setup**:  
  1. Flip a coin to choose a bag (A or B) in secret. Don’t reveal!  
  2. Each participant draws **one marble** from the chosen bag (in private), then puts it back.  
     - *If they draw red*: They learn, "Bag A is **75% likely** (since Bag A has 10 red, Bag B has 2 red)."  
     - *If they draw blue*: They learn, "Bag A is **25% likely** (since Bag A has 2 blue, Bag B has 10 blue)."  
     *No arithmetic needed—use whole numbers: "If you see red, you’re 75% sure it’s Bag A!"*  
  3. **Trade Rules**:  
     - Bet 1 chip on whether it’s Bag A or Bag B.  
     - Find a partner. If they disagree (e.g., you think A, they think B), you BOTH agree to bet 1 chip.  
     - Winner takes both chips (if Bag A, A-bettor wins; if Bag B, B-bettor wins).  
     - *Incentive*: "Trade to win chips—most chips at the end gets the stupid prize!"  

  **What Happens**:  
  - Participants trade eagerly. Those who saw red (pro-A) seek those who saw blue (pro-B).  
  - Some profit, some lose—but everyone feels smart using their "private clue."  

  ---

  ### **Phase 2: Common Knowledge (20 mins)**  
  *Goal: Trade dries up when intentions become public.*  
  **Setup**:  
  1. **Public Commitment Round**:  
     - Ask everyone, "Raise your hand if you want to bet on Bag A." Count hands.  
     - Repeat for Bag B. Write counts on the board (e.g., "8 for A, 6 for B").  
     - Announce: "This is public. Everyone knows how many want to bet on each side."  
  2. **Re-open Trading**:  
     - Allow 5 mins for new bets. *But*:  
       - Anyone who wants to bet must stand up and say, "I want to bet on [A/B]!" publicly.  
       - They can only bet if someone publicly takes the other side.  

  **What Happens**:  
  - Few or no trades occur. Why?  
    - If 8 people want A and 6 want B, the A-group realizes, "Wait, more people saw red clues? That means Bag A is even *more* likely!"  
    - B-group thinks, "If so many saw red, maybe I’m wrong?"  
    - **Key gut feeling**: The moment you know others want to trade, their willingness becomes evidence against your own bet.  

  ---

  ### **Phase 3: Frame Disagreement (30 mins)**  
  *Goal: Trade returns when outcomes are ambiguous.*  
  **Setup**:  
  1. **Introduce Ambiguity**:  
     - Show the duck-rabbit image. Say: "We’ll vote later on whether this is a duck or rabbit. Majority wins."  
     - Hand out index cards:  
       - *Half* get: "Is this more duck-like? (Yes/No)"  
       - *Half* get: "Is this more rabbit-like? (Yes/No)"  
     - *No discussion allowed.*  
  2. **Trade Rules**:  
     - Bet 1 chip on the vote outcome (duck or rabbit).  
     - Trade privately again (no public commitments).  
     - After trading, hold a vote. Majority decides the winner.  

  **What Happens**:  
  - Trading resumes! People bet based on their *frame*:  
    - "Duck-like" cardholders bet on duck.  
    - "Rabbit-like" cardholders bet on rabbit.  
  - **Why trade returns**:  
    - Outcomes aren’t objective—they depend on *how people interpret* the image.  
    - No shared "list of outcomes" (e.g., "Is a ‘mixed’ vote possible?").  

  ---

  ### **Debrief (15 mins)**  
  Map the activity to the concepts:  
  1. **Phase 1: Private Info Enables Trade**  
     - "You traded because you thought your clue gave you an edge. The other person’s ‘yes’ was private, so it didn’t scare you off."  
     - *Link to theorem*: With private info, trade feels rational.  

  2. **Phase 2: Common Knowledge Kills Trade**  
     - "When hands went up, you saw a room full of evidence. If someone wants to bet against you, you think, ‘Why? Do they know something I don’t?’"  
     - *Link to theorem*: Common knowledge of intent makes trade collapse—it signals conflicting evidence.  

  3. **Phase 3: Frames Reopen Trade**  
     - "You traded again because the vote wasn’t about fixed odds. It was about *how we see the world*. You weren’t disagreeing on numbers—you were disagreeing on what ‘duck-like’ even means."  
     - *Link to your hobby horse*: Real-world trade (e.g., "Will AI transform healthcare?") often involves frame disagreements, not just math.  

  **End on a Question**:  
  - "Can two people *truly* share all their knowledge? Or does the act of trading always reveal something the other hasn’t considered?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Trading to be friendly"**:  
     - *Fix*: Remind them the prize is at stake. Say: "Trade selfishly! Your goal is chips."  

  2. **"Gaming the game"**:  
     - E.g., someone lies about their clue.  
     - *Fix*: "Stick to your actual clue—this is about information, not bluffing."  

  3. **"It’s rigged!"** (if Bag A/B is revealed and surprises everyone):  
     - *Fix*: "Unlikely outcomes happen! The point is the *pattern*: public evidence made you doubt."  

  ---

  ### **What the Activity Can’t Capture**  
  - **Rationality Assumptions**: Real people trade for irrational reasons (boredom, emotion). The theorem assumes perfect rationality.  
  - **Vague Payoffs**: In Phase 3, we simulate frame disagreement with a vote, but real-world stakes are messier (e.g., "transformative tech" has no clear payoff).  
  - **Common Priors**: The theorem assumes both start with the same baseline beliefs. In Phase 1, we enforce this (50/50 bags). In life, priors differ—say this aloud: "In reality, we often disagree before we even see evidence!"  

  ---

  ### **Why It Works for Your Group**  
  - **No math**: Uses whole numbers (75%, not 0.75) and physical actions (hand-raising, public announcements).  
  - **Gut-first**: They *feel* why trade dries up before you name the theorem.  
  - **Ambiguity = relatable**: Phase 3 mirrors real disagreements (e.g., "Is this company culture *efficient* or *toxic*?").  

  End by emphasizing: **This isn’t finance—it’s about how minds share (or fail to share) knowledge.** The duck-rabbit question lingers because it’s unframed... just like the future.
