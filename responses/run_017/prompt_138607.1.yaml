  Okay, the user runs a philosophy reading group focusing on Anscombe's critique of Truman receiving an honorary doctorate. They need a villanelle poem to close their final session, capturing Anscombe's ethical stance without reducing her argument to pacifism or consequentialism. The key points are:

  1. **Anscombe's Core Argument**: Truman intentionally targeted non-combatants as a means to force surrender, which constitutes murder without exceptions for good outcomes. The poem must avoid framing this as merely "sad" or a utilitarian miscalculation.

  2. **Formal Requirements**: 
     - Villanelle structure (19 lines, 5 tercets + quatrain)
     - Two refrains:
       - Fixed refrain: The unchanging prohibition (e.g., "No calculus absolves the murder done").
       - Shifting refrain: Statesman's rationale that degrades from euphemism ("The war was shortened by what we achieved") to blunt truth ("Their deaths were what we aimed at to compel").

  3. **Key Scenes to Include**:
     - The "what did it achieve?" challenge (rejecting consequentialist answers)
     - Anscombe's focus on personal moral complicity ("Not to have honoured what I could not praise")

  4. **Philosophical Nuances**:
     - Reject "foreseen side-effect" defenses (Hiroshima/Nagasaki deaths were the *mechanism*, not collateral damage)
     - Highlight manufactured necessity (unconditional surrender demand)
     - Address the "just signing papers" evasion

  5. **Tone & Pitfalls to Avoid**:
     - No hagiography of Anscombe or cartoonish Truman
     - No didactic explanations ("thus we see...")
     - Leave "what would you have done?" unresolved

  **Execution Strategy**:
  - **Fixed Refrain**: Anchors Anscombe's absolutism. "No calculus absolves the murder done" distills her rejection of consequentialism.
  - **Degrading Refrain**: 
    - 1st: Official euphemism ("The war was shortened...")  
    - 2nd: Cracks appear ("This bitter calculus the world believed")  
    - 3rd: Euphemism stripped ("Their deaths... compelled")  
  - **"What did it achieve?" Stanza**: Use bystander dialogue to contrast Anscombe's anti-consequentialism ("Achieved? I did not join in honour's lie").
  - **Closing Quatrain**: Fixed + degraded refrains collide, showing descriptive accuracy implies judgment.

  **Biggest Risks**:  
  - Over-compressing "non-consequentialist refusal" into 1 line (solved via "Not to have honoured...")  
  - Degrading refrain clarity (ensured shift from passive to active voice: "what we achieved" → "we aimed at")  
  - Historical accuracy on unconditional surrender (verified via her *Mr Truman's Degree* pamphlet)  

  **Notes Section Priorities**:  
  - Flag intentional omission of pacifism angle (she objected to *targeting* innocents, not all war)  
  - Clarify "manufactured necessity" as her secondary argument  
  - Defend "what we aimed at" as faithful to her "intentional means" analysis
answer: |-
  ## Villanelle: For Anscombe at Somerville

  The war was shortened by what we achieved —  
  They gathered gowns beneath the Oxford stone.  
  *No calculus absolves the murder done.*

  A statesman signs; the parchment is received.  
  (She counts the ashes scattered, child and crone).  
  The war was shortened — *this* we have believed —

  But who is innocent? Who stands retrieved  
  From targeting? What end could not atone  
  For *calculus absolving murder done*?

  Some asked her later: *What was gained? You grieve,  
  But honour still was laid where blood was sown.  
  The war was shortened...* Truth they had conceived

  Grew thin. *Achieved? I did not join in honour's lie,*  
  She said. *My task: not to have praised the throne*  
  *That stands on calculus absolving murder done.*

  *But what necessity?* A world deceived  
  By terms demanded — conquest overthrown  
  At any cost? The bitter truth, retrieved:

  *Their deaths were what we aimed at to compel —*  
  No side-effect, but weapon honed and shown.  
  *No calculus absolves the murder done.*  
  *Their deaths were what we aimed at to compel.*

  ---

  **Notes**  

  I focused on Anscombe's core argument: that deliberately targeting non-combatants as a *means* (not collateral damage) constitutes murder, voiding consequentialist appeals. The shifting refrain degrades from official euphemism ("The war was shortened...") to explicit intent ("Their deaths were what we aimed at"), mirroring her claim that honest description negates justification. The fixed refrain ("No calculus absolves...") reflects her absolute prohibition.  

  The "what was gained?" stanza rejects consequentialism by emphasizing her personal refusal to participate in honouring evil ("not to have praised the throne"), not societal impact. Truman's defence ("A statesman signs") and manufactured necessity ("terms demanded") are included.  

  **Liberties & Uncertainties**:  
  - **"The throne" (line 15)**: A metaphorical compression of institutional power/approval. While Anscombe opposed *honouring* Truman, "throne" risks over-dramatization. Used for rhythmic necessity and to contrast with her refusal.  
  - **"We aimed at" (refrain 2 finale)**: Directly states intent, crucial for her argument. Truman might claim he aimed at *surrender* via bombing, but Anscombe insists the civilian deaths were the chosen *mechanism*.  
  - **Omission of pacifism**: Deliberate, per your emphasis. The poem assumes her objection is specifically about targeting non-combatants, not war itself.  
  - **Confidence**: High on core ethics (intent vs. consequence); moderate on historical nuance (e.g., "terms demanded" simplifies her critique of unconditional surrender).  

  **Weakest Line**: "*That stands on calculus...*" (line 15). The metaphor ("throne" standing on murder-absolving logic) risks vagueness, but "stands on" ties back to institutional endorsement of the reasoning.
