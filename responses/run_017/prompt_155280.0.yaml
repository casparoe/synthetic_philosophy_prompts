  **Incident Postmortem: Unplanned Relocation of Den Furnishings**  
  **Date:** October 26, 2023  
  **Owners:** HomeNav Execution Team  

  ### Summary  
  During routine den cleaning, Unit #4491 (software v3.1.5a) initiated a "vacuum sweep" protocol. The unit extended its manipulator arm to clear perceived floor obstructions, engaging a wheeled side table. The table was displaced 2.4 meters, dragging an active space heater (or feline occupant) resting atop it. No injuries reported, but minor property damage occurred. The unit completed its task without errors.  

  ### Timeline (UTC)  
  - **14:03:00**: Unit enters den. Floor scan detects "low-lying obstruction cluster" (dust bunny, cat toy).  
  - **14:03:12**: "Vacuum sweep" triggered. Path planning identifies side table legs as "mobile non-fixed objects" (expected behavior for wheeled furniture).  
  - **14:03:18**: Manipulator arm engages table leg. Traction subsystem applies 12N force.  
  - **14:03:20**: Table movement detected via wheel rotation sensors. Heater stability monitor (attached to table) registers tilt (15°). Unit logs "ambient thermal spike +4°C" but attributes it to HVAC.  
  - **14:03:25**: Table/heater assembly displaced 2.4m. Task marked "complete."  
  - **14:05:00**: Resident reports incident via emergency stop button.  

  ### Root Cause  
  The execution engine’s salience classifier ranked "ancillary object stability" below the N=12 top-priority implications per 40ms cycle. The linkage between "wheeled table mobility" and "tertiary object displacement" (heater/cat) was deprioritized due to low historical co-occurrence (<0.01% of training episodes). Consequently, the system failed to generate a corrective action.  

  #### Why This Was Missed  
  - **Salience recall gap**: The implication "moving table mobilizes heater" ranked #14 in the cycle. Only top-12 implications are evaluated to meet p99 latency targets (40ms).  
  - **Sleeping-dog strategy failure**: The system assumed heater stability was invariant absent direct manipulation. Wheel-induced table movement bypassed change-detection triggers.  
  - **Window widening futility**: Increasing N to 15 would breach latency budgets (projected 52ms). Historical analysis shows no correlation between window size and coverage gaps.  

  ### Contributing Factors  
  1. **Coverage debt accrual**: Dashboards modeled skipped implications as "amortizable debt." This misapplied financial analogies—omissions compound unpredictably, unlike depreciating assets. Debt metrics were "green" pre-incident (coverage score: 98.2%).  
  2. **Narrow problem construal**: Stability monitors were scoped to *direct* unit-object interactions (e.g., "arm touches heater"). Secondary effects (e.g., "table movement redistributes force") were out-of-scope.  
  3. **Isotropic salience blind spot**: The critical implication ("mobile furniture mobilizes dependent objects") lacked a dedicated feature. No training corpus included wheeled tables bearing thermal devices/felines. Relevance conditions were Quinean—dependent on holistic context no classifier captured.  
  4. **Overpruning**: To reduce inference latency, "low-yield" object relations (e.g., "furniture-heater adjacency") were pruned from the decision graph.  

  ### Action Items  
  | Item | Owner | ETA |  
  |------|-------|-----|  
  | 1. **Increase salience head capacity**: Add auxiliary classifier to pre-score "tertiary object dynamics" implications. | ML Pipeline | Q1 2024 |  
  | 2. **Hand-coded stability axioms**: Implement domain-specific rules for wheeled furniture (e.g., "IF object ON wheeled_surface AND force_applied THEN check displacement"). | Knowledge Eng | Dec 2023 |  
  | 3. **Edge-cache high-latency implications**: Precompute low-salience implications during idle cycles. | Systems | Feb 2024 |  
  | 4. **Aggressive pruning**: Remove low-utility features (e.g., "audio purr detection") to free compute budget for top-N expansion. | ML Ops | Nov 2023 |  
  | 5. **Debt model recalibration**: Retire "amortization" dashboard. Track skipped implications as unbounded tail risk. | Product | Q1 2024 |  

  ### Legal Addendum  
  **Q: Did the unit "know" it was moving the heater?**  
  **A:** Per logs, the unit registered table movement and thermal changes but classified them as "non-actionable environmental noise" per v3.1 salience thresholds. No heuristic or sensor directly represented "heater relocation causality."  

