answer: |-
  ### Proposed Voting Procedure for Curriculum Priorities Committee

  Given your constraints (strict ordinal ballots, 40 minutes, one spreadsheet, no civics lectures), this procedure prioritizes transparency, efficiency, and defensibility. It checks for consensus and Condorcet winners early, uses instant-runoff voting (IRV) as a fallback, and flags potential spoilers. The goal is to resolve the vote or trigger discussion when values conflict.

  #### Step-by-Step Meeting Script (Concentration Vote Only)
  **Total Time:** 35–40 minutes  
  **Key Principle:** "Test for easy wins first; if stuck, vote and audit; if values clash, discuss."

  1. **Opening (2 min):**  
     "We have [number] proposals. Everyone ranked them 1st to last. We’ll first check if one proposal beats all others head-to-head. If not, we’ll run a ranked vote. If near-duplicates might split votes, we’ll test for that. I’ll announce steps as we go."

  2. **Check for Condorcet Winner (10 min):**  
     - **Question to ask:** "Does any proposal win every pairwise vote against others? For example, if we pit A vs B, A wins; A vs C, A wins; and so on."  
     - **Sufficient answer:** Use the spreadsheet. For each pair, count votes where Proposal X is ranked above Proposal Y by at least 5 members (majority). If one proposal wins all matchups, it wins.  
     - **What to leave out:** No need to explain "Condorcet." Call it a "head-to-head sweep."  
     - **If found:** Declare winner. Skip to Step 5.  
     - **If not:** Say, "No proposal swept all matchups. We’ll use ranked voting."

  3. **Check for Near-Duplicates (5 min):**  
     - **Question to ask:** "Are any proposals near-duplicates? For example, if two are so similar that splitting votes between them might change the outcome."  
     - **Sufficient answer:** Quick show of hands: "All in favor of merging Proposals X/Y/Z as one option?" Majority (5+ votes) passes.  
       - *If merged:* Treat the group as a single proposal (each ballot’s rank for the group is its highest internal rank).  
     - **What to leave out:** Avoid theoretical examples. Focus on obvious clusters (e.g., the three theme variations).

  4. **Instant-Runoff Voting (IRV) (15 min):**  
     - **Process:**  
       1. Count 1st-choice votes. If a proposal has 5+ votes, it wins.  
       2. Else, eliminate the proposal with the fewest 1st choices. Redistribute its votes to next preferences. Repeat until one has a majority.  
     - **Audit (if time):** After IRV winner is found, check: "Would removing weak proposals (e.g., those with <2 first-choice votes) change the winner?" If yes, flag it (see Case 2).

  5. **Justification & Wrap-up (3 min):**  
     - Draft paragraph: "The committee ranked [number] options. [Merged X/Y if applicable]. [Condorcet winner] won all head-to-head votes. [Else]: After IRV, [winner] secured a majority in round [X]."  
     - **If senate questions legitimacy:** Note any spoiler tests or near-duplicate merges.

  ---

  ### Case Simulations
  **Case 1: Single-Peaked Preferences (Quick Win)**  
  - **Scenario:** All members rank proposals along one dimension (e.g., "cost to implement" Low → High).  
  - **Your action:**  
    - **Pre-meeting:** In the spreadsheet, order proposals (e.g., A<B<C<D<E). For each member, verify their ranking has one "peak" (preferences fall monotonically on both sides).  
      - *Example ballot:* C > B > D > A > E (peak at C).  
    - **At meeting:** "Preferences align on a single scale. The median 1st choice wins."  
      - Order members by their 1st choice along the scale: e.g., [A, A, B, B, C, C, D, E, E].  
      - Median (5th) member’s top choice (C) wins.  
  - **Why it works:** Single-peakedness guarantees a Condorcet winner at the median. No vote needed.  
  - **Entitlement:** You can conclude the result is robust and strategy-proof. Justify: "Preferences aligned on one dimension; median proposal won."

  **Case 2: Near-Duplicate Spoiler (Last Year’s Complaint)**  
  - **Scenario:** Proposals A and A' are similar. Removing A' might change winner from B to C.  
  - **Your action:**  
    - **Step 1:** Run IRV with all proposals. Winner: B.  
    - **Step 2 (Audit in spreadsheet):** Remove A' (the weak near-duplicate). Re-run IRV with remaining proposals.  
      - *If winner changes to C:* The complaint was sound.  
      - *Else:* The complaint was unfounded.  
    - **Time saver:** No member re-votes. Spreadsheet recalculates in 5 min.  
  - **If spoiler detected:**  
    - "Removing A’ changed the winner. We must decide: keep A’ and accept B, or merge A/A’ and rerun?"  
    - **Values decision:** Call a majority vote on whether to merge A/A’. If merged, rerun IRV; else, keep B.  
  - **Justification:** "IRV initially selected B. Audit showed A’ split votes; after merge, C won. Committee voted to [keep/merge]."

  **Case 3: Irreconcilable Dimensions (Polarized Committee)**  
  - **Scenario:** Scientists rank by research fit: P > Q > R. Humanists rank by teaching load: R > Q > P. No shared dimension.  
  - **Outcome:**  
    - No Condorcet winner (P vs Q: 4–5?; Q vs R: 4–5?; ties everywhere).  
    - IRV: Eliminate weakest first (e.g., Q with 0 first-place votes). Humanists’ votes shift to R; scientists’ to P. Final: 4–5 tie.  
    - Dean breaks tie, choosing R or P. Scientists protest.  
  - **Where it ends:** Committee won’t like dean’s tiebreak.  
  - **Your action:**  
    - **Stop early:** At Condorcet check, deadlock is clear. Hand decision back: "No head-to-head winner. We’re split on values: research vs teaching. Should we discuss compromises before voting?"  
    - **Values discussion:** Facilitate 10-min negotiation (e.g., "Can we amend a proposal to balance both?"). If no resolution, proceed to IRV + dean tiebreak.  
  - **Justification:** "No consensus on evaluation criteria. IRV resulted in tie; dean selected R per committee rules."

  ---

  ### What the Procedure Cannot Do
  1. **Guarantee a "True" Winner:**  
     - Arrow’s theorem means no method is perfect. IRV can fail "independence of irrelevant alternatives" (spoilers). Condorcet winners may not exist.  
     - *Example:* In Case 3, the dean’s tiebreak decides. The procedure detects this but can’t fix it.

  2. **Prevent Strategic Voting:**  
     - Members could misrank proposals to manipulate outcomes (e.g., ranking a weak opponent higher to eliminate a threat).  
     - *Example:* A humanist ranks P last to ensure R wins. The procedure can’t detect or prevent this.

  3. **Resolve Values Conflicts:**  
     - When members disagree on what *dimension* matters (e.g., research vs teaching), voting just tallies preferences—it doesn’t reconcile them.  
     - *Procedure flags this:* Steps 2 and 3 in Case 3 force discussion or delegate to the dean.

  4. **Audit Perfectly:**  
     - Testing spoilers (Case 2) assumes near-duplicates are obvious. Merging them is a judgment call.  
     - Time limits may prevent full spoiler checks (e.g., testing all combinations).

  5. **Escape Judgment Calls:**  
     - Merging near-duplicates, defining "weak proposals," and triggering discussions are subjective. The procedure dresses these as rules but relies on your oversight.  
     - *Justification:* Transparency ("we voted to merge X/Y") defends the call.

  ---

  ### Closing Script
  "Today’s method checks for consensus first, votes if needed, and audits for spoilers. It can’t force agreement when values clash, prevent strategy, or guarantee the ‘best’ outcome. But it ensures we test for obvious wins, flag splits, and document doubts. If the senate questions us, we’ll show our tests and trade-offs. Let’s proceed."  

  **Why this works:** It’s fast, auditable, and forces value discussions early. It accepts Arrow’s limits without dwelling on them.
