  First, I need to choose a mechanism to bear the weight. The options mentioned include non-transitivity of grounding, failure of aggregation, contrastive grounding, or partial grounding. Non-transitivity seems promising here. If grounding isn't transitive, even if A grounds B and B grounds C, A might not ground C. That could create a situation where terminal facts exist but don't form a complete basis because the grounding chains don't "transfer" all the way up.

  For the toy model, I'll need concrete named facts and a grounding graph. Let's say we have five facts: A, B, C, D, and E. I'll set up grounding relations where A and B are terminally fundamental (ungrounded), but they only directly ground C and D, while E is grounded in C and D. However, because of non-transitivity, A and B don't ground E through C and D. The terminal facts would be A and B, but they don't form a basis because E isn't grounded in them. 

  The obvious objection is taking the union of all terminal facts as the basis. But if grounding isn't transitive, the union of A and B still doesn't ground E - only C and D do. So the union fails to ground everything. 

  For the "so much the worse" response, I need to argue that we should keep both notions but stop assuming they coincide. Foundationalism can be true without a fundamental level existing. This preserves the intuition that chains bottom out while acknowledging that reality might not have a unified base.

  Finally, for what breaks: arguments claiming all causal/explanatory work happens at the fundamental level would fail. If terminal facts don't form a basis, then higher-level facts like E can have genuine explanatory power not reducible to A and B. The gap undercuts reductionist arguments.

  I'll structure the response with a clear mechanism choice upfront, then the toy model, followed by objection responses. The argument needs to be tight and avoid jargon. The user wants something they can refute but that stands firm on its own logic.
answer: |-
  Here's the sharp argument you requested. I'll commit to **non-transitivity of grounding** as the mechanism. If grounding isn't transitive, then even if A grounds B and B grounds C, it *doesn't* follow that A grounds C. This breaks the link between terminal fundamentality and basal fundamentality.

  **Toy Model:**  
  Facts: `A`, `B`, `C`, `D`, `E`.  
  Grounding Graph:  
  - `A` grounds `C`  
  - `B` grounds `D`  
  - `C` and `D` together ground `E`  
  - Nothing grounds `A` or `B`; `C`, `D`, and `E` are grounded.  
  Terminally fundamental facts: `A`, `B` (they sit at the bottom).  

  **Why they fail to be basally fundamental:**  
  - `A` and `B` are terminal (no regress).  
  - But they do *not* form a minimal complete basis.  
  - **Problem 1:** `A` and `B` together **fail to ground everything**. They ground `C` and `D` respectively, but they do *not* ground `E` (since grounding isn't transitive: `A`→`C` and `C` helps ground `E`, but `A` doesn’t thereby ground `E`; same for `B`→`D`→`E`).  
  - **Problem 2:** The minimal basis is actually {`C`, `D`}: they ground `E`, and no proper subset does. But `C` and `D` are *not* terminal—they’re grounded in `A` and `B`.  
  - **Result:** Terminals exist (`A`, `B`), but no set of terminals grounds everything. Reality has no fundamental *level* (no unified basis).  

  **Killing the "Union of Terminals" Objection:**  
  Take the union of terminals: {`A`, `B`}. Does this ground `E`? **No.** `E` is grounded *only* in `C` and `D` together. `A` grounds `C`, `B` grounds `D`, but due to non-transitivity:  
  - `A` grounds `C`, but `C` ≠ `E` and isn’t identical to `E`'s full grounds.  
  - `B` grounds `D`, but `D` ≠ `E`.  
  - `E`’s grounds (`C` and `D`) *depend* on `A` and `B`, but dependence isn’t grounding. So `E` isn’t grounded in {`A`, `B`}—it’s grounded in {`C`, `D`}. The union objection **assumes transitivity** (if `A` grounds `C`, and `C` grounds `E`, then `A` grounds `E`), which we’ve rejected. Without transitivity, terminals don’t aggregate to a basis.  

  **Dealing with "So much the worse for fundamentality":**  
  We should **keep both notions and abandon the assumption they coincide**. Foundationalism (no regresses/circles) is preserved: chains bottom out at `A`/`B`. But "reality has a fundamental level" (a complete basis of terminals) is false. Why keep both? Because terminal fundamentality captures *dependence structure* (no infinite descent), while basal fundamentality captures *completeness* (a unified starting point). The gap shows these are separate virtues. Sacrificing basal fundamentality doesn’t undermine foundationalism—it reveals that bedrock reality might be fragmented, with no single layer doing all the work.  

  **What breaks?**  
  Arguments claiming **all causal/explanatory work "drains down" to the terminal level** fail. In our model:  
  - `E` is grounded in `C` and `D`, *not* in `A` and `B`.  
  - So `E`'s existence/explanatory power depends on `C` and `D`—which are *non-terminal*.  
  - If you insist only terminals (`A`, `B`) do "real" work, you miss `E`’s *actual* grounds (`C`, `D`). Reductionist arguments that dismiss non-terminals as epiphenomenal collapse. The gap forces us to admit **real work happens at intermediate levels**, even if chains terminate below.  

  **Summary:** Non-transitivity severs terminal facts from forming a basis. Foundationalism survives, but the "fundamental level" dies—reality’s foundation is a scattered heap, not a unified floor.
