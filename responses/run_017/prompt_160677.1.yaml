prompt: |-
  I work on policy at a mid-sized social platform and I've been given the delightful task of rewriting our internal guidance on slurs. Not a banned-word list — we have one of those and it's useless — but an actual explanation of why one flagged post is a violation and another that contains the exact same word isn't, written so that a reviewer with no philosophy training and thirty seconds per case can apply it. I keep reading papers in the semantics and pragmatics literature and coming away feeling like they were built for a totally different purpose than mine (explaining intuitions about reported speech in a seminar room, mostly), so before I read any more of them I want the spec. Please write me the desiderata: what an account of slurs would have to deliver to be adequate *for this job*, with the case or consideration behind each requirement, so I can hold the literature up against it instead of the other way round.

  The phenomena it has to handle — and please use the messy versions, because these are the ones that actually show up in our queue: a slur used by a member of the targeted group in a song or a comment thread, and the same token surfaced by our recommender to an out-group listener; a slur inside negation, a question, the antecedent of a conditional, or an indirect report ('she said he called him the n-word'), where the reviewer has to decide whether derogation survived; a slur aimed at someone who isn't a member of the targeted group, used as a generic insult; a slur quoted for educational or documentary purposes, or appearing as a screenshot of a dictionary entry; a word that's a slur in one dialect or language and an ordinary term in another, or a borrowed word whose speakers genuinely don't know its valence; a respelled, emoji-substituted, or initialism version that most users read as the slur anyway; and — the one that broke my brain — a slur invented for a fictional group in a novel or game (a slur for androids, for a made-up fantasy race) that gets used in-character, plus the newer case where a bot or language model emits a real slur with nobody's intentions behind it at all. I'd also want requirements about the distinctions it can't collapse: slur versus plain pejorative or insult, slur versus taboo word, derogation versus offensiveness versus harmfulness, targeting a group versus targeting an individual, and being a slurring word versus being used as one. For each, say what breaks if a theory collapses it.

  Then the part I actually care about: mark which requirements are non-negotiable for my purpose and which are just the prejudices of one camp (I don't need the theory to be elegant, or to keep slurs out of semantic content, or to preserve compositionality in any strong sense — but I do need it to be usable by someone who cannot know what the speaker was thinking, and to give stable answers across time as reclamation happens). Flag any pair of requirements you suspect can't be jointly satisfied — my guess is that 'explain why derogation tracks speaker endorsement or group membership' and 'be applicable without access to intentions or identity' pull apart, and I want to know if there are others. Tell me which single requirement does the most work in ruling out candidate theories. And only after all that, give me a short scorecard — a couple of sentences each, not a table of essays — for the main contenders as you'd characterize them by content: the expressivist view that slurs add a separate expressive or attitudinal component, the prohibition view that the ban itself does the work, conventional-implicature and presuppositional treatments, and any contextualist or reclamation-friendly view. Please write the whole thing in American English, and feel free to tell me if the honest conclusion is that no existing account is adequate for what I'm asking.
reasoning: |-
  Okay, let me approach this systematically. The user needs practical criteria for evaluating theories of slurs specifically for content moderation at a social platform. 

  First, I need to identify the core challenges they face: reviewers have 30 seconds per case, no philosophical training, and limited context (can't access speaker identity or intentions). The messy cases they listed—reclaimed uses, fictional slurs, indirect reports etc.—are where most theories stumble.

  The non-negotiables seem to be:
  - Operationalizability without mind-reading
  - Stability despite reclamation
  - Distinguishing use from mention
  - Handling platform-specific harms

  I notice tension between needing to track speaker endorsement (which requires context) and the no-mind-reading constraint. Also problematic: theories relying on semantic content may fail with fictional slurs, while pragmatic approaches struggle with quoted uses.

  For contender evaluation:
  - Expressivism fails on fictional slurs
  - Prohibition theory can't explain reclaimed uses
  - Presupposition doesn't handle out-group reclamation
  - Contextualism requires too much inference

  The brutal truth is no existing theory solves all operational problems. The best path might be a hybrid framework prioritizing harm patterns over theoretical purity—but I should flag where this leaks.
answer: |-
  Here's a specification of desiderata for a slur theory tailored to your content moderation needs, with non-negotiables flagged, tension points identified, and a scorecard of major theories:

  ### Core Requirements (Non-Negotiables in Bold)
  1.  **Operationalizability without mind-reading: Must generate actionable guidance for reviewers lacking access to speaker identity, intent, or context beyond visible text/platform metadata.**  
      *Why*: Reviewers can't investigate user demographics or private intent in 30 seconds. Breaks if the theory requires knowing if the speaker is Black, intended offense, etc.  
      *Non-Negotiable*: **Yes** – Foundation for your use case.

  2.  **Stability despite reclamation: Must distinguish reclaimed in-group use from harmful out-group use *without* requiring constant redefinition of the word itself.**  
      *Why*: "n*gga" in a Black artist's song vs. same spelling in a white user's comment. Breaks if the theory treats the word as uniformly derogatory or ignores reclamation.  
      *Non-Negotiable*: **Yes** – Reclamation is dynamic but moderation needs consistent rules.

  3.  **Use/Mention Distinction: Must flag harmful uses while permitting documentary/educational mentions (e.g., reporting harassment, dictionary screenshots, academic discussion).**  
      *Why*: "She called me a k*ke" (report) vs. "You're a k*ke" (attack). Breaks if theory treats all tokens as equally derogatory.  
      *Non-Negotiable*: **Yes** – Essential for accurate reporting and context.

  4.  **Embedding Resilience: Must explain why slurs often retain derogatory force in negations, questions, conditionals, or indirect reports ("If he's a f*ggot...", "Did she say c*nt?").**  
      *Why*: Derogation often survives syntactic embedding. Breaks if theory assumes only literal assertion carries harm.  
      *Non-Negotiable*: **Yes** – These constructs dominate reports.

  5.  **Platform-Specific Harm: Must prioritize harm caused *on-platform* (e.g., recommender amplification to out-group, targeted harassment) over abstract semantic content.**  
      *Why*: A reclaimed slur in a niche group chat becomes harmful when surfaced to general audiences. Breaks if theory ignores dissemination mechanics.  
      *Non-Negotiable*: **Yes** – Your harm model is tied to platform dynamics.

  6.  **Token Recognition: Must handle obfuscations (n*gg@, "n-word", 🚬) that function as slurs for most users.**  
      *Why*: Evasion tactics are common. Breaks if theory is limited to dictionary spellings.  
      *Non-Negotiable*: **Yes** – Evasion is pervasive.

  7.  **Accidental/Artificial Use: Must address slurs generated by bots, LLMs, or fiction (e.g., "toaster" as android slur in-game) without human bigotry.**  
      *Why*: Requires distinguishing systemic harm from intent. Breaks if theory requires speaker animus.  
      *Non-Negotiable*: **Yes** – Emerging and critical edge cases.

  ### Critical Distinctions (Collapsing Breaks Moderation)
  -   **Slur vs. Generic Insult**: Slurs attack group identity (harm: dehumanization). Calling someone "asshole" is rude; "d*ke" attacks lesbian identity. *Collapse breaks*: Over-penalizes vulgarity or under-penalizes group-based harm.
  -   **Slur vs. Taboo Word**: Taboos (e.g., "cunt" as genital reference) offend via taboo violation; slurs offend via group denigration. *Collapse breaks*: Incorrectly flags medical contexts or misallocates resources.
  -   **Derogation vs. Offensiveness**: Derogation enforces hierarchy (core harm); offensiveness causes discomfort. A slur can be non-offensive if reclaimed but still derogatory if wielded by out-group. *Collapse breaks*: Fails reclamation and over-restricts in-group speech.
  -   **Group vs. Individual Targeting**: Slurs harm by implicating the group. "k*ke" insults all Jews; "idiot" insults one person. *Collapse breaks*: Underestimates societal harm.
  -   **Lexical Slur vs. Slurring Use**: A word *is* a slur (e.g., "ch*nk") vs. a neutral word *used* pejoratively ("gay" as insult). *Collapse breaks*: Overlooks reclaimed slurs or misreads contextual insults.

  ### Lower-Priority (Avoid Theoretical Prejudices)
  -   Preserving compositionality (your rules can be heuristic).
  -   Excluding slurs from "semantic content" (irrelevant to harm).
  -   Theoretical elegance (pragmatism > purity).
  -   Explaining all linguistic intuitions (focus on harm patterns).

  ### Tension Points (Likely Irreconcilable)
  1.  **Derogation Tracking vs. No Mind-Reading**: If derogation *requires* speaker endorsement/identity (per many theories), but reviewers can't access this → **Unresolvable tension**. *Mitigation*: Use proxies (community affiliation, speech patterns, audience).
  2.  **Stability vs. Reclamation Dynamics**: Rules must be stable, but reclamation evolves language. *Tension*: Requires clear, updateable markers of reclamation status (e.g., "used in [X]-affiliated contexts").
  3.  **Fictional Slurs vs. Real Harm**: A fictional slur ("mudblood") may normalize real dehumanization. *Tension*: Harm may depend on resemblance to real dynamics, not lexicon.

  ### Requirement Doing the Most Work
  **Operationalizability without mind-reading** eliminates most philosophical theories, as they rely on unknowable speaker intent/identity.

  ---

  ### Theory Scorecard (for your use case)
  1.  **Expressivism** (Slurs add non-truth-conditional hate):  
      *Fails*: No intent? No hate → misses fictional/bot slurs. Requires knowing speaker attitude. Can't explain reclamation. **Unusable**.
  2.  **Prohibition Theory** (Taboo via prohibition):  
      *Fails*: Can't distinguish use/mention or reclamation. Treats all tokens as equally toxic → bans reports/dictionaries. **Unusable**.
  3.  **Conventional Implicature (CI)/Presupposition** (Slurs conventionally signal group contempt):  
      *Fails*: Requires speaker endorsement. Can't handle reclaimed use (contradicts "conventional" signal). Struggles with embedding ("If he's a..."). **Mostly Unusable**.
  4.  **Contextualism** (Derogation depends on context/speaker):  
      *Fails*: Reviewer can't assess context/speaker. Leads to inconsistent rulings. **Unusable for standardization**.
  5.  **Reclamation-Focused/Power** (Slurs enact power hierarchies; harm depends on speaker/audience power):  
      *Best but Flawed*: Explains reclamation (in-group power reclamation) and amplification harm. *Fails*: Requires knowing speaker/audience identity. Hard to operationalize "power" quickly. **Closest but needs heavy adaptation**.

  ### Conclusion
  **No existing academic theory is adequate off-the-shelf.** Your problem is fundamentally *operational*: translating complex social-linguistic harm into scalable, intent-agnostic rules. Start from harm patterns in your queue:
  -   **Build heuristics**: Focus on *observables*: Token type + Speaker's observable community affiliation (profile, groups) + Context (mention vs. use) + Dissemination context (audience reach).
  -   **Example Rule**: "*Token [X] is actioned if: (a) Used (not mentioned) AND (b) Speaker lacks observable affiliation with targeted group AND (c) Not in fictional/documentary frame*".
  -   **Accept Tradeoffs**: Err toward harm reduction. Theoretical purity is less important than reducing dehumanization at scale. Update rules as reclamation evolves via community consultation.
