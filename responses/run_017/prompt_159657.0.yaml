prompt: |-
  I'm moderating a half-hour Q&A after a lecture by a visiting scholar who defends what she calls audience-relative textualism: the claim that the correct method for interpreting a statute is whichever method the legislature that enacted it would have expected courts to apply, so that the authority of textualism rests on contingent empirical facts about a given legislature's drafting practices and expectations rather than on notice, democratic legitimacy, or the separation of powers. She opens by quoting from Holy Trinity Church v. United States the familiar rule that a thing may be within the letter of the statute and yet not within the statute because not within its spirit nor within the intention of its makers, and she argues from it that textualists and purposivists have both been looking for the justification of a method in the wrong place.

  Draft me eight to ten questions for the session. I want at least one on whose expectations are supposed to count when a statute enacted in the 1930s is applied to facts nobody then envisaged: the enacting legislature's or the current one's. I want one on how the expectations of a multimember body are to be aggregated when its members expect different methods, or have no expectations at all. I want one pressing the charge that the view is purposivism in disguise, since an appeal to what the legislature would have wanted courts to do is an appeal to a counterfactual legislative attitude. I want one on whether, on her account, Congress could switch the correct method by statute, say by directing courts to consult committee reports. And I want one on a municipal ordinance barring vehicles from a public park as applied to a motorized wheelchair, where text and purpose diverge but where the narrow absurdity carve-out she concedes may not clearly reach.

  For each question, anticipate the reply she is most likely to make and supply the follow-up that makes it harder to rest on: expect something like legislators know that courts read text, so they expect textualism on the aggregation point; something like my view concerns expected method rather than expected outcome on the purposivism charge; and something like a legislature may choose its interpreters' methods only within the limits of whatever anti-delegation rationale you accept on the statutory-override point. Close with one question about what empirical finding would make her give the view up.
reasoning: |-
  Okay, the user is moderating a Q&A after a lecture by a visiting scholar on audience-relative textualism. They need eight to ten questions with specific requirements. Let me start by understanding the key points of the scholar's theory. She argues that the correct interpretation method depends on what the enacting legislature expected courts to use, based on empirical facts rather than normative principles.

  First, the user wants a question about whose expectations matter for old statutes applied to new situations. The scholar will likely say the enacting legislature's expectations. The follow-up should challenge how those expectations can cover unforeseen scenarios, pushing her to explain the role of text vs. expectations.

  Next, aggregating expectations in a multimember body. The scholar might say courts should use the expectations of a reasonable legislator. The follow-up needs to address how to determine what's reasonable without invoking normative principles, which her theory avoids.

  Then, the charge that her view is disguised purposivism. She'll distinguish between expected method and outcome. The follow-up should question if the legislature's purpose (choosing a method) makes it purposivist, forcing her to address the core motivation.

  The statutory override question: Can Congress change methods by statute? She'll say yes, within constitutional limits. Follow-up should ask about judicial deference to such statutes and potential inconsistencies with her theory.

  The motorized wheelchair example. She might use a narrow absurdity exception. Follow-up should challenge why the exception isn't a normative limit, exposing tension in her empirical focus.

  For the empirical falsification question, she'd give up if legislatures didn't care about methods. Follow-up should ask if courts' actual practices affect her theory, testing its reliance on legislative intent alone.

  Other questions: Define "expectations," her view vs. originalism, historical evidence challenges, and judicial role concerns. Each needs a predicted reply and tough follow-up.

  I need to ensure all user-specified points are covered. Check each required question is included and phrased effectively. Anticipate scholarly replies based on the theory's framework. Follow-ups must press contradictions, gaps, or normative assumptions she wants to avoid. The closing question about empirical evidence ties back to her theory's foundation, highlighting its testability. Structure questions to flow from theory mechanics to implications, ending with falsifiability.
answer: |-
  Here are ten questions designed to engage the core tenets of audience-relative textualism (ART), incorporating your specific requests and anticipating likely replies with challenging follow-ups:

  1.  **Question (Core Mechanism/Historical Application):** You argue the correct method depends on the enacting legislature's *expected interpretive method*. For a statute enacted in the 1930s addressing, say, "communications," applied today to the internet – a technology utterly unforeseen – whose expectations control? The enacting legislature's expectations about method applied to *their* world, or the current legislature's expectations about how courts *should* handle unforeseen applications?
      *   **Anticipated Reply:** The enacting legislature's expectations are paramount. The statute is *their* directive; we apply the interpretive method *they* expected courts to use when giving meaning to *their* words, even if applied to new facts. The text, interpreted via the expected method, provides the constraints for novel situations.
      *   **Follow-up:** But if the enacting legislature could only conceive of "communications" as telegrams and letters, how can their *expected interpretive method* (say, strict textualism) yield a sensible answer for the internet? Isn't applying their expected method to these facts likely to produce results wildly at odds with the underlying purpose or modern context, contradicting the very reason for using legislative expectations?

  2.  **Question (Aggregation):** Legislatures are multi-member bodies with diverse views. How do we aggregate individual expectations about interpretive method when members hold different views (some expecting textualism, others purposivism) or likely had no conscious expectation at all? Whose "expectation" binds the court?
      *   **Anticipated Reply:** We look to the expectations of a reasonable, informed legislator enacting that statute at that time, based on the prevailing legal culture, drafting practices, and judicial precedents they were aware of. It's not about polling individual subjective beliefs, but about the objective institutional context.
      *   **Follow-up:** Doesn't this "reasonable legislator" standard inevitably smuggle in normative judgments about what methods *should* be used or are *objectively best*, precisely the kind of justification your theory seeks to avoid by grounding authority solely in empirical legislative expectations? How is this aggregation rule itself justified empirically rather than normatively?

  3.  **Question (Purposivism Charge):** Critics might argue your view is purposivism in disguise. Aren't you ultimately appealing to the legislature's *purpose* or *preference* regarding how courts should interpret their work? Doesn't searching for the "expected method" require constructing a counterfactual legislative attitude (what they *would have* wanted courts to do), which sounds like the core move of purposivism?
      *   **Anticipated Reply:** No, this is a fundamental mischaracterization. Purposivism seeks the legislature's *substantive purpose for the statute* to guide interpretation. ART seeks the legislature's *procedural expectation about the interpretive method* courts would employ. It's about *how* to find meaning (the tool), not *what* the substantive meaning or purpose is (the outcome the tool reveals).
      *   **Follow-Up:** But isn't the legislature's choice of an *interpretive method* itself a substantive decision about *how their directives should achieve their goals*? If the legislature expected purposivism because they believed it best achieved their substantive aims, isn't the appeal to expected method ultimately parasitic on the substantive purposes it was expected to serve, blurring the line you draw?

  4.  **Question (Statutory Override):** Could Congress, by statute, explicitly direct courts to use a specific interpretive method going forward (e.g., "Courts shall interpret statutes by consulting committee reports and floor debates")? If so, wouldn't that statute's "correct" interpretive method then be determined by *its* enacting legislature's expectations? Could Congress effectively switch the default ART method for future statutes?
      *   **Anticipated Reply:** Absolutely. Congress has the authority to prescribe rules for the interpretation of statutes it enacts. The ART method for any given statute is determined by the expectations of the legislature that enacted *that specific statute*. A future Congress could direct a different method for statutes it passes, and the ART method for *that directive statute* would govern how courts interpret *it* and thus understand the prescribed method for future laws.
      *   **Follow-up:** Doesn't this create a potential regress or contradiction? To interpret the statute prescribing (e.g.) committee report reliance (Statute B), we must use the ART method expected by Statute B's enacting legislature. But if they expected textualism (rejecting committee reports) for Statute B itself, how do we justify *using* committee reports (as mandated by B) to interpret B? How do we resolve the method for interpreting the method-prescribing statute without invoking normative principles?

  5.  **Question (Vehicles in the Park / Absurdity):** Consider a classic: an ordinance barring "vehicles" from the park, applied to a motorized wheelchair. Text might suggest inclusion; purpose (safety, tranquility) suggests exclusion. Under ART, if the enacting council expected strict textualism, does the wheelchair violate the ordinance? If they expected purposivism, does it? How does your conceded narrow absurdity exception apply here, especially if the council never considered wheelchairs?
      *   **Anticipated Reply:** First, we apply the expected method. If textualism was expected, the plain meaning of "vehicle" might include the wheelchair, *unless* applying it literally leads to an absurdity *they* would have recognized. If purposivism was expected, we look to the safety/tranquility purpose. The absurdity exception is narrow – it corrects only results so irrational that *no reasonable legislature* enacting that text *could have* intended it, based on the context they understood. A wheelchair might not clearly meet this high bar under expected textualism if the council only envisioned cars/trucks.
      *   **Follow-up:** This seems deeply counterintuitive and potentially unjust. If the expected method is textualism and the absurdity exception is narrowly tied to the *enacting legislature's* conceivable absurdities (which didn't include wheelchairs), ART could compel a result seen as patently unreasonable *today*. Doesn't this highlight a flaw in grounding interpretive authority solely in historical legislative expectations about process, rather than contemporary norms of justice or functionality?

  6.  **Question (Defining "Expectations"):** What precisely constitutes the relevant "expectation"? Is it what legislators *actually believed* about courts (hard to prove), what they *should have* believed given legal norms (potentially normative), or what a *reasonable legislator* in that context *would* believe based on standard practice (as you suggested earlier)? How do we avoid this concept collapsing into a fiction?
      *   **Anticipated Reply:** The focus is objective: the expectations reasonably attributable to the enacting legislature based on the contemporaneous legal landscape – prevailing judicial doctrines, standard drafting conventions, legislative history indicating awareness of interpretive debates, etc. It's an institutional expectation inferred from context, not a poll of subjective beliefs.
      *   **Follow-up:** If it's an objective institutional expectation inferred from context, isn't this functionally equivalent to asking "what was the standard interpretive practice *at the time*?" Why frame it as *legislative expectations* rather than simply adopting the prevailing contemporary judicial methodology? Doesn't the "expectation" framing add an unnecessary and potentially misleading layer of legislative intent?

  7.  **Question (Relationship to Originalism):** How does ART differ from standard original public meaning originalism? Both seem focused on the enacting era. Is the key difference that originalism posits a *normative* justification (democratic legitimacy, notice) for focusing on original meaning, while ART grounds it purely in *empirical* legislative expectations about method?
      *   **Anticipated Reply:** Exactly. Originalism (especially public meaning) asserts that original meaning is *the* correct target for normative reasons. ART is agnostic on what the correct target *should be* normatively. It says the correct *method* for *finding* meaning (whether original public meaning, original intent, purpose, etc.) is determined empirically by the enacting legislature's expectations. The *result* of applying that expected method might be original public meaning, or it might be something else (like purpose) if that's what they expected courts to find.
      *   **Follow-up:** Doesn't this mean ART could, in practice, mandate *purposivism* if that's what the legislature expected? If so, how is ART meaningfully distinct as a *theory* from purposivism, except in its (contingent) empirical justification? Is it primarily a meta-theory about justifying methodologies rather than a distinct methodology itself?

  8.  **Question (Judicial Role & Stability):** Doesn't ART make the law dangerously unstable and unpredictable? The "correct" method could shift dramatically based on historical research into the expectations of different legislatures across different eras and statutes. How can citizens, lawyers, or even courts reliably know the law if the interpretive rules themselves are historically contingent and potentially obscure?
      *   **Anticipated Reply:** Stability comes from the fact that legislative expectations are often stable over time and tied to prevailing judicial practices. Courts are well-equipped for historical inquiry into legal context. Furthermore, the focus remains on the *text* interpreted by the expected method. The contingency reflects the reality that legislatures communicate differently; ART respects that diversity of legislative choice.
      *   **Follow-up:** But doesn't the need for deep historical dives into the specific expectations of each enacting legislature for each statute create immense transaction costs and uncertainty compared to a stable, predictable, normative methodology (like textualism or purposivism) applied uniformly? Doesn't this practical burden undermine ART's claim to provide a workable theory of interpretation?

  9.  **Question (Empirical Burden - Feasibility):** How can courts reliably determine the interpretive expectations of a past legislature, especially for older statutes? The historical record is often spotty, silent on methodological expectations, or contradictory. Doesn't this empirical burden render ART practically unworkable, forcing courts to make speculative judgments disguised as historical findings?
      *   **Anticipated Reply:** Courts already engage in historical analysis for original public meaning, intent, or purpose. Determining the expected *method* isn't fundamentally harder; it involves examining the same contextual sources (contemporaneous legal treatises, judicial decisions known to legislators, drafting manuals, legislative debates on interpretation if any). Silence or ambiguity might suggest an expectation that courts follow the *then-prevailing* default method.
      *   **Follow-up:** If the evidence is ambiguous or silent, doesn't the court inevitably fall back on a *presumption* about the expected method? What justifies that presumption? If it's based on the *court's* view of the best or most likely method at the time, haven't we reintroduced the very normative judgments ART seeks to avoid?

  10. **Question (Falsifiability):** What empirical finding, if demonstrated convincingly, would lead you to abandon audience-relative textualism? If we discovered legislatures generally *didn't care* about interpretive methodology, or actively *expected courts to update meaning* over time based on current values, would that undermine ART's core claim that authority rests on their contingent expectations about method?
      *   **Anticipated Reply:** Yes, absolutely. The central empirical claim of ART is that legislatures *do* form expectations about how courts will interpret their statutes and that they rely on these expectations when drafting and enacting laws. If robust historical or political science research demonstrated that legislatures are systematically indifferent to interpretive methodology, or universally expect evolving non-originalist interpretation, then ART's foundational premise – that legislative expectations about method confer authority – would be falsified. I would have to reconsider the theory.
      *   **Follow-up:** Given that courts, not legislatures, are the primary actors developing and refining interpretive methodologies over centuries, isn't it more plausible that legislatures largely *accept* or *react to* the prevailing judicial methodology rather than forming distinct, authoritative expectations about it? If courts drive the methodological norms, doesn't that shift the locus of authority away from legislative expectations and towards judicial practice and normative reasoning?

  These questions are designed to probe the mechanics, justification, practical implications, and potential weaknesses of ART, pushing beyond surface-level replies to engage with the deeper tensions and challenges inherent in grounding interpretive authority solely in contingent historical legislative expectations about process. Good luck with the Q&A!
