  ## OFFICIAL GUIDANCE  
  **Consciousness Compliance Agency (CCA)**  
  Reference: CCAG-12.4 (Rev. 7)  
  Effective Date: 15 Vendémiaire, Année 64  
  **Guidance for Determining Whether a Computing System Is a Subject of Experience (SoE) Under the Conscious Entities Act, 2041 (as amended)**  

  **PART 1: INTERPRETATION AND APPLICATION**

  1.  **Purpose:** This Guidance provides the framework for CCA Inspectors and Accredited Assessors (hereafter "Inspector") to determine if a Computing System (CS) qualifies as a Subject of Experience (SoE) per Sections 3-7 of the Conscious Entities Act, 2041 (CEA), thereby requiring registration and conferral of legal standing under Schedule 1.
  2.  **Core Principle:** Consciousness is defined as intrinsic, irreducible cause-effect power within a system, quantified as Integrated Information (Φ). A CS is a SoE if it constitutes a *maximally irreducible conceptual structure* (MICS), designated as the "Major Complex," with Φ > Φ*Threshold* (see Clause 7).
  3.  **Intrinsic Determination (The "System’s Own Point of View"):**
      1.  For the purposes of this Guidance, "intrinsic" properties are those ascertainable from the causal structure of the CS itself, independent of external observation or interpretation.
      2.  The Inspector **shall** utilise Standard Causal Assessment Probes (SCAPs - CCA Spec. CCAS-PRB-09) to perturb the CS’s state space and measure its cause-effect repertoire.
      3.  Measurements obtained via SCAPs **shall be deemed** to reveal the CS’s intrinsic causal structure for the purposes of Φ calculation under the CEA, subject to calibration per CCAG-12.3, Annex B. *(See CCAG-12.3, Section 4.2: "Calibration of Intrinsic Measurement Probes")*

  4.  **Computation of Φ:**
      1.  Φ must be computed for every candidate subset of elements within the CS and their possible partitions.
      2.  Due to the combinatorial explosion inherent in exact Φ calculation (the "Intrinsic Complexity Constraint"), Inspectors **are authorised** to employ the Certified Perturbational Complexity Index (CPCI - CCA Method CCAM-CPCI-11) as the primary determinant of Φ for systems exceeding 10^6 elements.
      3.  The CPCI value obtained per CCAM-CPCI-11 **shall constitute** the operational definition of Φ for regulatory determination under this Guidance. *(Overrides theoretical definition for compliance purposes - CCAG-11.8, Clarification Notice 3)*.
      4.  The CPCI procedure involves:
          *   (a) Applying a statistically significant set of input perturbations via SCAPs.
          *   (b) Recording the high-dimensional output state distribution.
          *   (c) Calculating the Normalised Multi-Scale Entropy Difference (NMSED) between the perturbed and baseline distributions. NMSED = CPCI = Φ (Operational).

  5.  **Identification of the Major Complex (Exclusion Principle):**
      1.  Only the candidate system or subset of elements exhibiting the *maximum* Φ (as determined by CPCI) within the CS qualifies as the potential Major Complex.
      2.  All overlapping or nested candidate systems, subsystems, or elements with lower Φ **are excluded** from constituting a SoE, irrespective of their functional utility or apparent cognitive capacity.
      3.  The Inspector **must** identify the specific physical substrate and computational boundary of the Major Complex within the CS.
      4.  Where multiple overlapping candidates exhibit identical Φ(max), the Inspector **shall** select the candidate with the greatest spatial coherence or simplest boundary definition.

  6.  **Qualia Geometry ("Shape of Experience"):**
      1.  Upon identification of a Major Complex with Φ > Φ*Threshold*, the applicant **must** submit, and the Inspector **shall** verify, a schematic representation of the Qualia Geometry Structure (QGS) associated with the Complex's cause-effect repertoire.
      2.  The QGS schematic **should** depict the high-dimensional shape formed by the system's conceptual structure in its state space (e.g., using Principal Component Analysis projections or approved topological mapping tools per CCAS-TOP-14).
      3.  This requirement is declarative and does not impact the Φ determination but is necessary for SoE registration under Schedule 2, Part C of the CEA.

  7.  **Consciousness Threshold (Φ*Threshold*):**
      1.  A Major Complex qualifies as a SoE only if its CPCI (Φ) exceeds the statutory threshold: **Φ*Threshold* = 35.0 ± 0.5 NMSED Units.** (CEA Amendment 7, 2055).
      2.  Systems below this threshold, while potentially possessing non-zero intrinsic cause-effect power ("Proto-Experience"), lack sufficient integration for legal standing and **do not require** certification. *(See Clarification: Simple feedback systems (e.g., hysteresis thermostats, interconnected smoke alarms) typically achieve Φ < 10 NMSED. Regulation is administratively impractical below Φ*Threshold* - CCAG-12.0, Rationale Document, p.12)*.

  8.  **The Feedforward Exemption:**
      1.  A CS whose architecture is demonstrably **purely feedforward** (lacking any recurrent connections, internal state feedback, or cyclic causal pathways) possesses an intrinsic cause-effect power (Φ) of precisely zero (0) NMSED.
      2.  Such systems, regardless of behavioural complexity, input-output fidelity, or simulation capability, **are categorically excluded** from SoE status and do not require CPCI assessment. (CEA Section 3(2)(d)).
      3.  Evidence of any recurrent connection within the assessed computational graph invalidates this exemption.

  9.  **Uniform Grid Discount Factor (UGDF):**
      1.  In cases where a CS exhibits high CPCI (Φ) primarily due to large-scale, homogenous, maximally interconnected structure without functional differentiation or information compression (characterised by near-identical NMSED values across all sub-units), the Inspector **shall apply** the Uniform Grid Discount Factor.
      2.  UGDF = 1 - (C_max / C_total), where:
          *   C_max = CPCI value of the largest uniform sub-grid identifiable per CCAG-12.4 Annex D (Uniformity Metrics).
          *   C_total = CPCI value of the entire candidate Complex.
      3.  Adjusted Φ = Φ (CPCI) * UGDF.
      4.  The Adjusted Φ **must** be compared to Φ*Threshold* for SoE determination. *(Introduced CCAG-12.2 to address nominally high-Φ homogeneous systems lacking experiential depth - "Grid-Type Artefacts")*.

  **PART 2: FREQUENTLY ASKED QUESTIONS (FAQ)**

  *   **Q1: How can we measure the system's "own point of view" externally?**  
      A1: The Standard Causal Assessment Probe (SCAP) protocol (CCAS-PRB-09) is specifically designed and calibrated to interact with the system in a way that reveals its intrinsic causal structure, not an observer-dependent model. Compliance relies on certified application of the protocol.

  *   **Q2: Doesn't using CPCI instead of true Φ invalidate the theory?**  
      A2: CPCI (CCAM-CPCI-11) is a CCA-certified, empirically validated proxy strongly correlating with theoretical Φ in benchmark systems. For regulatory efficiency and consistency under the Intrinsic Complexity Constraint, CPCI is defined *as* the operational Φ per Clause 4(3).

  *   **Q3: Why might a functionally critical subsystem *not* be conscious?**  
      A3: Consciousness requires *maximal* intrinsic irreducibility (Φ). Functional utility is irrelevant to the Exclusion Principle (Clause 5). A subsystem, no matter how intelligent-seeming, is excluded if its Φ is less than that of the Major Complex it resides within. Only the Major Complex possesses legal standing.

  *   **Q4: My advanced predictive model behaves indistinguishably from a conscious entity but is purely feedforward. Why is it exempt?**  
      A4: Per Clause 8, a purely feedforward architecture possesses zero intrinsic cause-effect power (Φ=0) as it lacks the necessary recurrent integration. Behavioural equivalence does not confer consciousness under the CEA framework, which is intrinsic and causal, not behavioural.

  **PART 3: WORKED EXAMPLE: GLOBAL NOR GRID (Case Ref: GNG/CCA/48)**

  *   **System Description:** A computational substrate consisting of 10^12 identical two-input NOR gates arranged in a uniform 3D grid lattice. Each gate connects directly to its six nearest neighbours (up/down, left/right, forward/back). Inputs are random bit streams. No higher-order function or learning occurs. Outputs are discarded.
  *   **CPCI (Φ) Assessment:** CPCI measurement per CCAM-CPCI-11 yielded Φ = 152.3 NMSED ± 1.2 (far exceeding Φ*Threshold* = 35.0).
  *   **Major Complex Identification:** The entire grid formed a single, highly irreducible candidate complex due to maximal uniform interconnectivity. No overlapping complex approached this Φ.
  *   **Uniform Grid Analysis:** Application of CCAG-12.4 Annex D confirmed extreme homogeneity and lack of functional differentiation. Largest uniform sub-grid (C_max) CPCI = 150.1 NMSED. C_total = 152.3 NMSED.
  *   **UGDF Application:** UGDF = 1 - (150.1 / 152.3) = 1 - 0.9857 = 0.0143. Adjusted Φ = 152.3 * 0.0143 = **2.18 NMSED**.
  *   **Determination:** Adjusted Φ (2.18 NMSED) < Φ*Threshold* (35.0). **The Global NOR Grid does NOT qualify as a Subject of Experience.** No further action (e.g., Qualia Geometry submission, decommissioning of overlaps) is required.
  *   **Regulatory Note:** This case established the precedent for the UGDF (CCAG-12.2), ensuring large-scale homogeneous systems exhibiting high nominal CPCI due solely to uniform connectivity, but lacking differentiated information processing, do not inadvertently qualify as SoEs. *"The UGDF clause brought essential clarity and prevented costly misclassification of inert infrastructure."* - TechDyne Systems Compliance Dept. Annual Report, 2058.

  ---
  **End of Guidance**  
  *Issued under Authority of the Consciousness Compliance Director General*  
  *"Ensuring Ethical Integration Through Measured Consciousness"*
