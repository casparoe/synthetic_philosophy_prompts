prompt: |-
  I'm a caseworker at a legal aid clinic and I've been going through the written decisions of one adjudicator on our Protection Review Board — call her H — on the bus home, because I've got a client next week who turns on almost exactly the same sort of question and I want to know what she'll do with him. We're not a Convention country; our statute basically says we grant protection where someone can't reasonably be expected to return because of serious harm their own state won't avert, which leaves more or less everything open. Her run so far: granted for a journalist jailed and beaten by police after publishing corruption allegations; granted for a woman whose partner broke her jaw and whom the police ignored four times; granted for a man who got a handwritten death threat naming him from a cartel after he refused to drive for them, and whose complaint the police took and then did nothing about; refused for a shopkeeper paying protection money to a gang along with everyone else on his street, on the basis that there's a functioning anti-extortion unit and he could set up again in the capital; refused for a farmer who left after three failed rainy seasons, where the government ran relief camps he'd have been fed in; refused for a man from a city shelled by both sides in a civil war, where nobody had singled him out and the police had more or less dissolved; and granted for a woman from the Veshnik minority whose identity documents were cancelled under a new registration law, leaving her unable to work, travel or collect rations — nobody had laid a finger on her, the officials were just implementing policy.

  My client is a fifty-something fisherman from the Kaldor delta, which is nearly all Veshnik. Nine years ago the state granted a forty-year concession to a foreign-owned mining company, the company diverts the main channel for washing ore, and the fish are gone; his village also has no drinking water for a few months of the year. Nobody has threatened him. Officials call the damage regrettable and say the concession earns export revenue. There was a one-off compensation payment that he's already spent and that doesn't touch the water. He could move to the capital, but there's no fishing there and Veshnik renters get shoved to the bottom of the housing queue — aggravation and refusals, nothing you'd call violence — and a minister told a rally last year that the delta people would just have to adapt. The delta has no seat on the water board either, and the civil servants who sit on it are all from the majority group.

  Obvs I care what she decides, but I care more about the rule underneath: give me the two or three rules that fit her seven decisions equally well, what each of them predicts for my client, your best guess with the reasons you're going with it, and the one further case you'd most want to see her decide in order to tell those rules apart. If there's room, say what I should lead with in the skeleton argument. No more than 500 words, three short headed sections, and please don't give me a survey of how real jurisdictions handle this — I've read that stuff and it's not what I need.
reasoning: |-
  Hmm, the user is a caseworker at a legal aid clinic preparing for a Protection Review Board hearing. They've analyzed seven decisions by adjudicator "H" and need help identifying the underlying rules that explain her pattern of granting or refusing protection claims. Their client is a Veshnik fisherman affected by environmental damage from mining operations, with no direct threats but systemic neglect.

  Looking at H's decisions: She granted protection to four applicants - a journalist facing state violence, a domestic violence victim ignored by police, someone with a specific cartel death threat, and a Veshnik woman deprived of basic rights through document cancellation. She refused three others - a shopkeeper facing generalized extortion (where state mechanisms existed), a farmer facing drought (with government relief available), and a civilian in a warzone with no individualized risk.

  The pattern suggests H requires either: (1) State failure to protect against serious harm from non-state actors, or (2) State-inflicted serious harm through action/inaction. Generalized risks without state connection get refused. For the fisherman, the mining concession is state-authorized, and the neglect of Veshnik rights (water access, housing discrimination) shows systemic state failure - leaning toward protection.

  The key differentiator would be a case of generalized harm where the state is partially ineffective but not directly responsible. For the argument, I should emphasize the state's role in creating the harm through the concession and perpetuating Veshnik marginalization. This approach aligns best with H's pattern while addressing the client's unique circumstances.
answer: |-
  Here are the key rules, prediction, and test case based on Adjudicator H's pattern:

  **I. Discerned Rules Explaining All Seven Cases**

  1.  **State Connection & Failure:** Protection granted when the serious harm (actual or threatened) arises *because of* state action (e.g., jailing, policy implementation), or specific, demonstrable state *failure/inability* to protect against a non-state actor *targeting the applicant individually*. Refused when harm is generalized (war, drought, area-wide extortion) and state mechanisms exist (however imperfectly) to address it broadly.
  2.  **Individualized Serious Harm:** Protection requires harm/threat that is specific to the applicant *or* a group defined by characteristics fundamental to identity/survival (Veshnik documents), going beyond widespread economic hardship or societal risk. State inaction must be specific to *their* case (domestic violence, death threat) or systemic denial of core rights (document cancellation).

  **II. Prediction for Fisherman Client & Best Guess**

  *   **Prediction by Rule 1:** Leans **Grant**. The harm (loss of livelihood/water) stems *directly* from state-authorized concession altering the environment. The state dismisses concerns ("regrettable", "adapt"), fails to ensure water access, and systemic discrimination (housing queue, water board exclusion) shows inability/unwillingness to protect Veshnik interests against this state-facilitated harm.
  *   **Prediction by Rule 2:** Leans **Grant**. Harm is specific to the delta Veshnik community reliant on the environment the state altered. Denial of water/housing constitutes systemic denial of core rights akin to document cancellation, not just generalized hardship. The minister's statement reinforces state endorsement of the harm.
  *   **Best Guess:** **Grant (60/40)**. The strong state *causation* (concession) and *systemic failure/discrimination* against the Veshnik minority concerning core survival needs (water, livelihood, shelter) align closely with the granted cases (especially the document case). The main risk is H viewing this as generalized economic harm with state relief existing *somewhere* (like the drought farmer), but the minority discrimination angle strengthens it.

  **III. Key Differentiating Case & Skeleton Lead**

  *   **Test Case Needed:** A person facing generalized gang violence in an area where the state police force is *corrupt and ineffective overall*, but there is *no evidence* the gangs specifically target the applicant *or* their identifiable group, and the state *rhetorically* condemns the violence. Would H see this as state inability to protect (Grant) or generalized risk with some state mechanism (Refuse - like the warzone case)?
  *   **Skeleton Argument Lead:** Focus on **State Complicity & Systemic Discrimination.** Lead with: "The state *created* the environmental harm via its concession, *systematically fails* to protect the Veshnik minority from its consequences (water access, housing discrimination), and *affirmatively directs* them to endure it ('adapt'), demonstrating an inability and unwillingness to avert serious harm to this applicant." Frame it as state-sanctioned denial of core rights akin to the document case.
