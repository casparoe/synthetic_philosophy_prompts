prompt: |-
  I'm a journalist working on a piece about dementia and advance care planning, and I keep running into an asymmetry in how medicine handles the authority of the earlier self. I'd like to know what the practice presupposes.

  Courts and clinicians generally treat a competent person's written refusal of life-sustaining treatment as binding years later, after she has developed advanced dementia — and they do so even in the familiar, uncomfortable cases where the person now seems content, no longer recognises her family, and would, if asked, want to go on living. But the same framework is much less willing to honour the earlier self's positive requests: an advance directive asking to be admitted and medicated during a future psychiatric crisis, or asking for a treatment the clinical team now regards as inappropriate or futile, is typically treated as advisory and set aside. Deference to the earlier self runs strongly in one direction and weakly in the other.

  So, what view of that authority does the asymmetry commit us to? Must a system that honours prior refusals hold that the earlier and later selves are the same person or the same agent in some demanding sense — psychological continuity, or the unity of a life as a single narrative project — or can it get by with something metaphysically lighter: the thought that a life is one thing to be governed, or that the earlier self is simply the most reliable evidence about what the later one values? Is one principle doing all the work, or is the practice quietly running an identity-based account for refusals and a welfare- or interests-based account for requests? And where exactly does it strain: does honouring a refusal while the patient is apparently content require ranking the earlier self's evaluative or "critical" interests over the later self's experiential ones, in a way the practice never acknowledges?

  I'd also like to know what the practice would have to look like if it gave up the identity-based story. Suppose hospitals offered an optional "continuity clause" on the directive form: tick one box and your instructions still govern if you later stop recognising your family or stop caring about what you once cared about; tick the other and the instructions lapse, and clinicians should then go by your apparent well-being. What should a hospital do with each box, and is the second box anything a system could coherently accept — or does accepting it concede that the first box was never really about who the patient is?

  Finally, please separate what the current practice strictly presupposes from what merely fits comfortably with it, and tell me what a defender of strong precedent autonomy would say to explain the asymmetry between refusals and requests rather than just retreating from one limb.
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're pointing out an asymmetry in how advance directives are handled: earlier refusals of treatment are binding even in advanced dementia, but earlier requests for treatment are often set aside. The core question is what philosophical commitments this practice implies and whether it's consistent.

  First, I need to understand the legal and clinical framework. The binding nature of advance refusals is well-established in bioethics, grounded in autonomy and negative rights. For example, the U.S. Supreme Court's Cruzan decision emphasizes the right to refuse treatment. On the other hand, positive requests aren't treated as binding. Why? Clinicians might see them as non-autonomous in changed circumstances or conflicting with current best interests. 

  Looking at the philosophical angles, the asymmetry suggests that the practice leans on different principles for refusals versus requests. For refusals, it's about respecting precedent autonomy strictly, possibly viewing the person as the same entity over time. For requests, it's more about welfare and current interests. This might imply an unacknowledged dual approach: identity-based for refusals, interest-based for requests.

  The journalist asks if this asymmetry commits the system to a strong view of personal identity. But perhaps it's more about metaphysical minimalism—like the idea that a life is a single unit to govern. Or maybe it's evidential: the earlier self knows core values better. But that doesn't fully explain why requests aren't honored similarly. If the earlier self is the best evidence of values, why dismiss their requests? Unless those requests conflict with current welfare, which refusals might not, since withholding treatment aligns with allowing natural death.

  Then there's the conflict between critical and experiential interests. Honoring a refusal in dementia prioritizes the past self's critical interests over the present self's experiential well-being. But the practice doesn't openly acknowledge this hierarchy. It's an ethical tension that's glossed over.

  The continuity clause proposal is interesting. Box 1 maintains the status quo for refusals. Box 2 would lapse directives if identity changes, shifting to current well-being. But if Box 2 is an option, does that undermine the rationale for Box 1? If we allow directives to lapse when identity changes, it implies that the binding force of refusals was never about strict identity continuity. That might reveal the underlying principle is more about avoiding harm (not forcing treatment) rather than metaphysical identity.

  A defender of strong precedent autonomy would argue the asymmetry is justified. Negative rights (refusals) protect bodily integrity, which is timeless. Positive rights (requests) can't compel clinicians to act against their judgment or ethical duties. Also, refusals have a liberty-preserving asymmetry—freedom from unwanted intrusion is paramount. Plus, the burden of proof differs. Refusals are definite; requests might be overridden if they conflict with best interests, especially with changed medical contexts.

  Underlying all this is the principle of non-maleficence. Enforcing unwanted treatment is a violation, while not providing requested treatment might be seen as a lesser harm. But is that consistent? The journalist's example of a psychiatric advance directive being ignored shows a gap. If autonomy is key, why not honor those requests? Unless there's an inherent bias towards inaction in medicine—doing nothing (withholding treatment) is safer than acting (providing treatment) against current norms.

  I also need to separate what the practice presupposes from what's merely compatible. Strictly, it assumes a minimal personal continuity for legal agency. But it comfortably fits with critical interests outweighing experiential ones in refusal cases. The unspoken strain is in cases where the demented patient seems content but is denied treatment per prior directive. Ethically, that's prioritizing the past self's wishes, which might be seen as respecting the person's lifelong narrative over their present state.

  In conclusion, the asymmetry isn't necessarily inconsistent if rooted in differing ethical weights of negative vs. positive rights and clinical judgment. But it does reveal tensions between autonomy, beneficence, and how we value a person's past versus present self. The continuity clause idea highlights these tensions, showing that the current system avoids confronting them directly.
answer: |-
  Your analysis cuts to the core of a profound tension in bioethics. The asymmetry in honoring advance directives isn't merely pragmatic—it reveals deep philosophical commitments. Here's a breakdown:

  ### What the Practice Presupposes: Minimal Metaphysics, Maximal Negative Liberty
  The current framework **does not strictly require** a robust metaphysical view of personal identity (e.g., psychological continuity). Instead, it relies on:
  1. **Legal Continuity**: The law treats a person as a single entity across time for purposes of agency and rights.
  2. **Evidential Primacy**: The competent prior self is seen as the *best evidence* of core values, especially regarding bodily integrity.
  3. **Asymmetry of Rights**: Negative liberties (refusals) are accorded stronger protection than positive claims (requests).  
     - *Refusals*: Bind because they protect against bodily violation—a paramount ethical/legal principle.  
     - *Requests*: Are advisory because they may impose duties on others (clinicians) or conflict with evolving standards of care.

  ### Why Identity Isn't the Real Driver
  If strict identity were central, the asymmetry would collapse. Instead:
  - The system prioritizes **non-interference** over **positive provision**.  
  - **Key Principle**: *It is worse to violate bodily integrity (forcing treatment on a refusing person) than to withhold treatment requested by a past self when current interests conflict.*  
  - **Strain Point**: Honoring a refusal against apparent contentment *does* implicitly rank "critical interests" (life narrative, dignity) over "experiential interests" (present contentment), but this is masked by framing refusals as inviolable rights.

  ### The "Continuity Clause" Thought Experiment
  | **Box Option** | **Treatment Refusal** | **Treatment Request** | **Coherence Assessment** |
  |----------------|------------------------|------------------------|--------------------------|
  | **Box 1: "Govern"** | Binding (status quo) | Binding | **Problematic**: Forces clinicians to provide futile/inappropriate care against medical judgment. Ethically unsustainable. |
  | **Box 2: "Lapse"** | Not binding | Not binding | **Reveals Inconsistency**: If refusing this box concedes prior refusals weren't truly identity-dependent, but *pragmatic* (avoiding unwanted imposition). |

  **The Dilemma**:  
  - Accepting Box 2 for *requests* is already current practice (requests are often overridden).  
  - Accepting Box 2 for *refusals* would collapse the system, exposing that the binding force of refusals relies on **rights rhetoric**, not metaphysics.  

  ### Defending the Asymmetry: A Strong Precedent Autonomy View
  A principled defender (e.g., Ronald Dworkin-inspired) would argue:  
  1. **Negative Rights are Special**: Bodily integrity creates a "veto" no later self can override, as it prevents profound harm (violation). Positive claims lack equivalent moral weight.  
  2. **Epistemic Advantage**: The competent self better understands the *disvalue* of certain states (e.g., living with dementia) than the demented self understands the value of treatment.  
  3. **Welfare Includes Narrative Integrity**: A life's dignity depends on respecting its coherent arc. Sacrificing late contentment for prior values upholds the person's *whole-life* welfare.  
  4. **Clinical Gatekeeping**: Requests can demand non-beneficial care, conflicting with medicine's internal ethics. Refusals align with medicine's limits ("first, do no harm" as non-violation).  

  ### Where Practice Strains (Unacknowledged)
  The tension arises in dementia cases where:  
  - The prior self's refusal causes death while the current self is content.  
  - **Unspoken Hierarchy**: Critical interests (autonomy, dignity) dominate experiential interests (pleasure/contentment), but only for *refusals*. For requests, experiential interests dominate when they conflict with prior critical interests.  

  ### Conclusion: What's Presupposed vs. What Fits
  | **Element**               | **Strictly Presupposed** | **Comfortably Fits (but not required)** |
  |---------------------------|--------------------------|------------------------------------------|
  | **Personal Identity**     | Minimal legal continuity | Robust psychological continuity          |
  | **Authority Basis**       | Rights asymmetry         | Whole-life narrative unity              |
  | **Refusal Bindingness**   | Bodily integrity primacy | Prior self's superior judgment           |
  | **Request Non-Bindingness** | Clinical discretion      | Later self's altered interests           |

  **The Core Revelation**: The asymmetry persists because it resolves a practical ethical dilemma—how to respect autonomy without enslaving clinicians to past requests or violating present persons. But it does so by tacitly elevating *negative autonomy* above all other values, masking the painful choice between two selves' interests. A coherent system would need to explicitly defend why *this* asymmetry—and not others—is justified, rather than letting rights rhetoric obscure the underlying tradeoffs.  

  Your "continuity clause" exposes this: if the system allowed directives to lapse for refusals, it would admit that the binding force was never about metaphysical identity, but about the unique gravity of refusing bodily intrusion.
