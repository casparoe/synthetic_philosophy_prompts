answer: |-
  Here is a reading of *Gattaca* focused on your core argument, analyzing specific scenes through the lens of genetic audit versus essentialism, and testing your suspicion:

  **The Audit is the Institution, Not the Destiny**

  Your suspicion is powerfully borne out: Gattaca's social order operates almost entirely on the **actuarial/dossier claim**, requiring only that genomes be readable as probabilistic risk profiles. The "program/blueprint" claim is consistently undermined, while the "cipher" claim is irrelevant to the film's social mechanics. The true subject is the *institutional apparatus* required to make genetic legibility govern life.

  1.  **The Actuarial Claim Dominates:** The film's world *needs* only this.
      *   **The Door Scanner:** The instant readout from Vincent's stray eyelash isn't decoding his "program"; it flashes probabilities: "9.3: Heart Disorder. 99% Probability: Fatal." It's an insurance risk assessment, not a revelation of his soul or predetermined fate. The guard treats it as a security clearance failure based on actuarial thresholds, not an immutable sentence.
      *   **Co-worker with the Heart:** Dr. Lamar identifies her as "Valid" (genetically optimized) but later reveals her heart condition disqualifies her from spaceflight. This isn't a blueprint failure revealing her "true, flawed design"; it's her *risk profile* exceeding the mission's actuarial threshold. Her genes didn't specify a faulty heart *inevitably*, but they indicated a *probability* that manifested and now impacts her institutional eligibility.
      *   **The Swimmer's Suicide:** Jerome Morrow "took silver" – exceeding his genetic potential? Or meeting the high probability of elite performance encoded in his dossier? His suicide stems not from a deterministic failure but from the crushing weight of the institutional *audit* that declared silver a failure relative to his predicted gold ("Jerome Morrow was never meant to be one step down on the podium"). The dossier set an expectation; the institution enforced its judgment; he internalized the audit's verdict as his worth.

  2.  **The Program/Blueprint Claim is Undermined:**
      *   **The Physician's Son:** Lamar's confession is pivotal. His son, "selected for everything," was "never more than adequate." The genome-as-blueprint promised excellence; the reality yielded mediocrity. The "program" didn't run as specified. Lamar knows the *audit* (the tests, the predictions) is fallible and manipulable, not an infallible rendering of destiny.
      *   **The Second Swim:** Vincent beating his genetically superior brother Anton *twice* is the ultimate repudiation of the blueprint. The first win could be fluke or will. The second win, where Vincent saves Anton, reveals the mechanism: "You want to know how I did it? I never saved anything for the swim back." His triumph isn't coded; it's sheer, irrational, unauditable *resolve*. This isn't genetic potential realized; it's human spirit defying probability.
      *   **Vincent's Entire Existence:** His success at Gattaca isn't because Jerome's genes *programmed* him to be an astronaut; it's because Jerome's dossier *passed the institutional audit*. Vincent's own "defective" genes didn't program him for failure; they generated a risk profile that institutions used to exclude him. His achievement is overcoming the audit through subterfuge and will, not rewriting his molecular code.

  3.  **Legibility as Institutional Achievement:** The film meticulously details the *work* required to make genes govern.
      *   **Daily Rituals:** Vincent's scrubbing, the bags of hair, skin, blood, and urine – this is the grueling, constant labour of *maintaining the legibility of the borrowed dossier* for the audit. The genome isn't spontaneously readable; the institution demands fresh, verifiable samples through invasive, ritualized procedures.
      *   **The Infrastructure:** Scanners, databases, centralized sample analysis (the urine test at Gattaca), the registry of "Valids" and "In-Valids" – this vast bureaucratic and technological apparatus *creates* the genome as an auditable document. Without the scanner at the door, the eyelash is just debris. Without the database, Jerome's samples are just biological waste.
      *   **The Credit Score Analogy:** This resonates perfectly. Jerome's genome is Vincent's credit score – a highly reductive, institutional metric that gates access (to jobs, insurance, spaceflight) based on calculated risk. No one in Gattaca (except perhaps the naïve) believes Jerome's genome *is* Vincent, any more than a banker believes a credit score *is* the person. It's a tool for efficient, discriminatory governance. Lamar's final act of falsification is the equivalent of a loan officer ignoring a bad credit score based on a personal assessment of character.

  **Where the Film Resists or Complicates the Reading:**

  1.  **The "Borrowed Ladder":** Does Vincent's reliance on Jerome's DNA undermine his triumph? Does it suggest that even defiance requires *some* "valid" genetics? The film is ambiguous. Vincent's success *within the system* absolutely requires the borrowed dossier. However, his *defiance of the system's verdict on himself* – his will to become Jerome – precedes and enables the borrowing. The medal he wins (silver) is achieved under his *own* identity (through the second swim). His spirit enables the subterfuge; the subterfuge exploits the audit.
  2.  **The Closing Narration & The Human Spirit:** "For someone who was never meant for this world, I must confess I'm suddenly having a hard time leaving it... They say every atom in our bodies was once part of a star. Maybe I'm not leaving... maybe I'm going home." This explicitly invokes something beyond genes ("never meant for this world" references his *genetic audit*, not a cosmic plan). However, the "human spirit" invoked remains undefined and potentially mystical. Does it concede the code picture holds *everywhere except spirit*? Potentially. But crucially, *this spirit is what drives the resistance to the audit*. It's what enables the willpower, the deception (Vincent), the complicity (Lamar), and the sacrifice (Jerome) that the purely actuarial system cannot account for or predict. It's the un-auditable variable.
  3.  **The Title & The Medal:** "GATTACA" spelled from nucleobases is deeply ironic. It signifies the world built *on* the metaphor, but Vincent's medal (awarded under his *real*, invalid identity) is literally burned away as Jerome's samples are incinerated. The film uses the code metaphor to critique the society built upon its literalized, institutional application. It hasn't "earned the right" through scientific accuracy but through artistic demonstration of the metaphor's *social consequences*.

  **What the Film Adds to the Philosophy:**

  The philosophical argument critiques the code metaphor's scientific validity and rhetorical power. *Gattaca* viscerally demonstrates the *social reality* that emerges when the **actuarial claim** is operationalized by institutions seeking efficient governance. It shows:

  *   **The Human Cost of Audit Culture:** The reduction of life chances to risk scores, the erasure of individual potential beneath statistical probability, the suffocating rituals of verification (scrubbing, samples), the internalized shame (Jerome) and defiant resilience (Vincent).
  *   **Legibility Requires Complicity:** The system isn't automatic. It requires Lamar to run tests, Vincent to falsify samples, Jerome to provide them. It reveals the human cracks – loyalty, ambition, pity, love – through which the rigid audit can be subverted.
  *   **Resistance is Embodied & Institutional:** Vincent's defiance isn't just intellectual; it's physical (scrubbing, running, swimming) and relies on exploiting the institutional mechanisms (borrowing the dossier, falsifying samples). True resistance requires navigating the very system of legibility.
  *   **The Unquantifiable as Necessity:** The film forces us to confront that while institutions might *wish* everything was auditable (genes as perfect destiny), the reality of human achievement, relationship, and defiance ("the human spirit") fundamentally disrupts the deterministic fantasy, even if it remains mysterious. This unquantifiable element isn't an oversight; it's the engine of the plot and the critique.

  **Conclusion:** *Gattaca*'s society is built on **genetic audit**, not genetic determinism. It requires only the **actuarial/dossier claim**, leveraging the genome as a probabilistic risk profile for institutional governance. The "program/blueprint" claim is consistently shown to be false in practice, undermined by human variability, will, and institutional manipulation. The film's brilliance lies in exposing **legibility as an institutional achievement** – a vast, dehumanizing apparatus of scanners, samples, databases, and rituals built to enforce a social order based on reductive probabilities. The "code" metaphor survives not because it's scientifically accurate but because institutions find this specific (actuarial) interpretation of it *administratively useful* for sorting and controlling populations, much like a credit score. Vincent's triumph challenges the *verdict* of the audit on *himself* through sheer will and subterfuge, demonstrating that the system, while powerful, is neither infallible nor all-defining. The film adds the crucial dimension of lived, embodied experience and institutional complicity to the philosophical critique, showing the devastating human reality and the fragile, necessary space for defiance that exists within the audit culture.
