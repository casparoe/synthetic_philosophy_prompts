  I need to design an essay question around this case that doesn't telegraph the expected conclusions. Then provide a model answer demonstrating deep analysis—covering function attributions at each stage, contrasting accounts, explanatory divergence, and indeterminacy issues. Finally, create a marking scheme out of 20 points with clear must-hit criteria and common student errors.

  The constraints are important: no citations required since there's no reading list, and the output must be plain text without formatting for pasting into an LMS. The model answer should be ~700 words showing what excellence looks like, while the marking scheme needs 4-5 graded components with error descriptions.

