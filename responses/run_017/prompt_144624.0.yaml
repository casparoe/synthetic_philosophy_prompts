     Von Neumann ordinals work for infinite ordinals, while Zermelo’s don’t. But is this relevant to the *natural numbers*? It might conflate two different roles (cardinal vs. ordinal). Using Zermelo for finite and von Neumann beyond seems messy. Probability: ~0.4 that this makes von Neumann principled for the natural numbers job alone.  

