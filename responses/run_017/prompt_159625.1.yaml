  For Putnam-style externalism (reference depends on the physical environment), the word "water" should refer to H₂O on Earth and XYZ on Twin Earth, since the actual liquid in each environment differs. For Burge-style externalism (reference depends on deference to experts), "water" should refer to H₂O in both cases because both communities defer to the same authoritative definition.

  The scenario must be concise: one paragraph describing Oscar and Twin Oscar as duplicates, with Earth having H₂O lakes and Twin Earth having XYZ lakes. Both communities use "water" but have incomplete understanding, deferring to shared chemists who incorrectly define water as H₂O. The environments differ only in liquid composition.

  Key feature making the theories diverge is the experts being wrong about Twin Earth's liquid. If experts were correct locally, both theories would align: Putnam would match environment, Burge would match expert definition. Removing this error collapses the distinction.

