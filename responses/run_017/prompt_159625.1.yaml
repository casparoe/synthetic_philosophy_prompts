prompt: |-
  hi — I need a Twin Earth case built to order, and I want the two main kinds of semantic externalism to come apart in it.

  The set-up I have in mind: Oscar and Twin Oscar are molecule-for-molecule duplicates, on Earth and Twin Earth, lakes are H2O and XYZ, standard so far. The twist I want you to build: both communities have a division of linguistic labour for the word "water" — ordinary speakers only half-grasp it and defer to chemists — and both communities defer to the same chemists, one shared off-planet scientific institution whose textbooks and paradigm samples fix water as H2O, so the experts are wrong about what is in Twin Earth's lakes.

  What the case has to deliver: a Putnam-style environmental externalist (reference fixed by the nature of the stuff in the speaker's environment) has to say the twins' words have different referents; a Burge-style deferential externalist (content fixed by expert usage when grasp is incomplete) has to say they have the same referent. Don't stipulate the verdicts — state each theory's principle in one sentence first, then derive.

  Constraints: one paragraph of scenario, no devices beyond the standard Twin Earth set-up, twins stay intrinsic duplicates, the environments differ in exactly one respect, and the deferal has to be genuine (a real incomplete grasp), not just me announcing that they defer.

  Then tell me which feature of the case is doing the work, what happens if you remove it (my guess: if the experts are right about the local liquid the two theories collapse back together — check whether that's so), and how whichever theory comes out worse would attack the case.

  It's for a seminar where the point is that these are two separable theses and not one, so anything that just asserts the outcomes is useless to me. British English please, and keep the whole answer under 500 words.
