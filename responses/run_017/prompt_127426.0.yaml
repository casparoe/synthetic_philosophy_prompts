  We are designing a fairness criterion for a ranking model used in two countries with different base rates of "good hire" and different cut-offs. The model will be retrained quarterly on past decisions, creating a feedback loop. We only observe outcomes for hired candidates. The fairness definition must be checkable with available data, defensible to stakeholders, and account for the impossibility results when base rates differ.

  Key distinctions:
  1. Same meaning of score (calibration) vs. matching error rates (equalized odds/opportunity).
  2. Fairness at the current threshold vs. at every threshold.
  3. Fairness for predefined groups (countries) vs. arbitrary subgroups.
  4. Statistical fairness (patterns) vs. causal fairness (why a score was given).

  Constraints:
  - Only observe outcomes for hired candidates (partial labels).
  - Model retraining introduces feedback loops.
  - Must be explainable to rejected candidates and regulators.

  Impossibility: When base rates differ, we cannot simultaneously satisfy:
  - Calibration (scores mean same probability of being good hire) and 
  - Equalized odds (same TPR and FPR across groups) or equal opportunity (same TPR).

  We must choose which requirements to prioritize and which to drop.

  Desiderata for the fairness criterion:

  1. **Consistency with Base Rate Differences (Non-negotiable):** The criterion must allow for the fact that the base rates of "good hire" in the two countries are different. It should not require the model to predict the same probability for candidates from both countries when the underlying rates differ.

     *Why:* If the base rates are different, then the model should reflect that in the scores. Forcing the same score distribution would be distorting the truth.

  2. **Fairness at the Operating Threshold (Non-negotiable):** The criterion must ensure that the model is fair at the current cut-off points in each country. This means that the harm of misclassification (false positives and false negatives) is distributed fairly at the point of decision.

     *Why:* The model is used at specific thresholds to make hiring decisions. Fairness must hold at these thresholds to avoid disparate impact on candidates in the current process.

  3. **Checkable with Available Data (Non-negotiable):** The criterion must be verifiable using only the data we have: the model's scores and the observed outcomes for the hired candidates. Since we only observe outcomes for the hired, we must account for the selection bias.

     *Why:* We cannot observe the true label for candidates not hired. Any criterion that requires knowing the true label for all candidates (like full equalized odds) is not checkable.

  4. **Robust to Feedback Loops (Non-negotiable):** The criterion must be stable under model retraining. If the model is retrained on data generated by its own past decisions, the fairness criterion should not lead to a degenerative process (e.g., amplifying biases).

     *Why:* The system is dynamic. A static fairness notion might break when the model is retrained on data that was selected by a previous version.

  5. **Explainability (Non-negotiable):** The criterion must be explainable to a rejected candidate and to a regulator. It should not be a complex statistical concept that sounds vacuous when simplified.

     *Why:* We must be accountable. For example, saying "the model is calibrated" might be more explainable than "equalized odds" because it directly relates to the meaning of the score.

  6. **Calibration within Groups (Preference):** The model should be calibrated per country. That is, for a given score, the probability of being a good hire should be the same for candidates in both countries. However, note that because base rates differ, the score distributions will differ.

     *Why:* Calibration ensures that the score is interpretable and meaningful in each group. A candidate with a score of 0.7 in country A has the same chance of being a good hire as a candidate with 0.7 in country B. This is a strong requirement and might conflict with other goals.

  7. **Error Rate Balance (Preference):** We might want the model to have similar false positive rates (FPR) and/or false negative rates (FNR) across groups. However, given base rate differences, this is only possible if the model is not calibrated. Also, note that without full labels, we cannot compute FPR and FNR for the entire population.

     *Why:* This is about giving equal opportunity. For example, we might not want one group to have a higher rate of qualified candidates being rejected (high FNR). But with partial labels, we can only compute these rates on the hired candidates (which are a selected subset).

  8. **Threshold Fairness (Preference):** The criterion should hold not only at the current threshold but at every threshold. This is a stronger condition (like satisfying equalized odds at every threshold).

     *Why:* If we change the threshold (e.g., due to headcount changes), the fairness should not break. However, this is very hard to achieve and check with partial labels.

  9. **Subgroup Robustness (Preference):** The criterion should hold not only for the two countries but also for subgroups within the countries (e.g., by gender, race). However, this might be too demanding.

     *Why:* We want to avoid that fairness for the country groups masks unfairness for a minority within a country.

  10. **Causal Fairness (Preference):** The model should not use features that are proxies for protected attributes in a way that causes unfairness. However, causal fairness is hard to check and might conflict with predictive accuracy.

      *Why:* We want to avoid that the model discriminates based on factors that are not job-relevant but correlate with protected attributes.

  Now, the impossibility: 
  - If we require **calibration by group** (desideratum 6) and **equal opportunity (same TPR)** (part of desideratum 7), then we run into a contradiction when base rates differ. 
  - Similarly, requiring calibration and equalized odds (same TPR and FPR) is impossible under base rate differences.

  Therefore, we must drop one of these. Since base rate differences are a fact, we cannot drop the requirement of consistency with base rates. Thus, we must choose between calibration and error rate balance.

  Given the constraints of our setup (especially partial labels and the need for explainability), **calibration by group** is a more feasible and checkable requirement. Why?
  - We can check calibration on the hired candidates (though we must account for the fact that we only have labels for the hired). We can use techniques for auditing calibration under selection bias (e.g., using the selected set and making assumptions about the unselected, or by using reject inference techniques if we have some additional data).
  - Error rate balance (like TPR and FPR) requires knowing the true labels for the entire population, which we don't have.

  Moreover, calibration is more explainable: "A score of X means the same chance of being a good hire in both countries."

  However, note that calibration alone does not ensure that the selection rates (or the harm of misclassification) are fair at the threshold. Therefore, we might need to supplement with a requirement about the threshold.

  **Recommended core fairness criterion:**

  Given the non-negotiable constraints, we propose:

  **Non-negotiable:**
  1. **Calibration within Groups:** The model must be calibrated in each country. That is, for any score value `s`, the proportion of good hires among candidates with score `s` in a country should be `s` (or close to it). This must be audited on the hired candidates, and we must account for the selection bias (e.g., by using methods for calibration under selective labels).

  2. **Fairness at the Threshold:** At the current hiring threshold in each country, the model must satisfy:
     - **False Omission Rate (FOR) balance:** The probability that a rejected candidate would have been a good hire should be similar in both countries. 
     OR
     - **False Discovery Rate (FDR) balance:** The probability that an accepted candidate is a bad hire should be similar in both countries.

     Why one of these? Because we want the harm of errors to be balanced. However, note that without full labels, we cannot compute FOR for the rejected candidates. Therefore, we must rely on the calibration property to estimate these. Specifically, we can use the model's calibration to estimate the FOR and FDR.

     How? 
     - For the hired candidates, we can observe the actual outcome and compute the FDR (which is 1 - precision). But note, we don't observe the rejected candidates. However, if the model is calibrated, then for a given threshold `t` in a country, the expected FDR is `1 - t`? Not exactly: the FDR at threshold `t` is the expected proportion of false positives among the accepted. If we set a threshold `t` and accept everyone above `t`, and the model is calibrated, then the FDR is `1 - (expected value of the scores of the accepted) / (average score of accepted)`. Actually, if the model is perfectly calibrated, then the expected FDR at threshold `t` is `1 - t`? Not exactly: it depends on the distribution of scores above `t`. But we can compute the empirical FDR on the hired set. However, note that the hired set is exactly the set above the threshold. So we can compute the FDR as the proportion of bad hires among the accepted. 

     Similarly, the FOR (the rate of good hires among the rejected) is not observable. But if the model is calibrated, we can estimate it by the average of the scores below the threshold? However, we don't know the outcomes for the rejected. 

     Therefore, we can only directly audit FDR (from the hired set). But FOR is more critical for the rejected candidates: they might complain that they were wrongly rejected. However, without labels on the rejected, we cannot measure FOR. So we must rely on the calibration to have confidence in the model's estimates for the rejected.

     Therefore, we propose:
     - **Audit FDR on the hired set in each country:** The observed FDR (proportion of bad hires) in each country should be similar, or at least not significantly different, and also consistent with the model's calibration (i.e., the average score of the hired should be close to 1 - FDR). 
     - **Use calibration to estimate FOR:** We will use the model's scores for the rejected candidates to estimate the FOR. We will require that the estimated FOR (the average score of the rejected candidates) is similar in both countries. This is an estimate and depends on calibration holding for the entire score distribution.

     But note: if the model is calibrated, then the expected FOR for a candidate with score `s` is `s`. So the average FOR for the rejected set is the average of the scores of the rejected. We can require that the average score of the rejected candidates is similar in both countries.

     However, the harm of a false rejection might be higher than a false acceptance? That is a value judgment. We might require that the estimated FOR is below a certain level in both countries, and that the difference between countries is small.

  3. **Feedback Loop Stability:** The model must be audited for calibration and threshold fairness after each retraining. We must monitor for drift in calibration and in the estimated FOR (from the scores of the rejected) and FDR (from the hired outcomes).

  **Trade-offs made:**
  - We dropped the requirement for equal error rates (like TPR and FPR) because it is impossible under base rate differences and not checkable without full labels.
  - We are not requiring fairness at every threshold because it is too strong and not necessary if we are only using one threshold per country. But note, if we change the threshold, we must re-audit.
  - We are requiring calibration and threshold fairness only for the two countries (not arbitrary subgroups). However, we should also audit for key subgroups within the countries (e.g., by gender) if we have the data. But note: if we don't have enough data for a subgroup, we might not be able to audit.

  **Explainability:**
  - To a rejected candidate: "Our model estimates that candidates with your score have a X% chance of being a good hire. We set the threshold at Y, and we are confident that the model is equally accurate for candidates from your country as for others. The chance that a rejected candidate like you would have been a good hire is about Z% in your country, and we ensure that this chance is similar across both countries."
  - To a regulator: "We require the model to be calibrated by country, meaning that a score has the same meaning in both countries. We also ensure that the error rates at the hiring threshold (specifically, the rate of bad hires among the accepted and the estimated rate of good hires among the rejected) are similar in both countries. We audit these with the available data and adjust the model when deviations are found."

  **Impossibility and the key conflict:**
  The key conflict is between calibration and error rate balance (like equal opportunity). We chose calibration because:
  - It is consistent with base rate differences.
  - It is checkable (with caveats) from the data we have (using the hired set and the scores of the rejected).
  - It is explainable.

  But note: if we require calibration and also require that the estimated FOR (average score of rejected) is the same in both countries, then we are effectively requiring that the distribution of scores below the threshold is the same. This might not be possible if the base rates are different and the model is well-calibrated. Let's see:

  Suppose in country A the base rate is high, and in country B it is low. Then the score distribution in A will be shifted higher than in B. If we set thresholds `t_A` and `t_B` (which might be different due to headcount), then the average score of the rejected in A (which are below `t_A`) might be higher than in B (below `t_B`). So we cannot require the same average FOR.

  Therefore, we must adjust:

  We require that the **harm of errors** is balanced. We can define the harm in terms of the cost of a false rejection and false acceptance. But without a cost function, we can only require that the error rates at the threshold are within an acceptable range and that we are not systematically underestimating one group.

  Alternatively, we might require:

  - The FDR (bad hires among accepted) should be similar in both countries.
  - The estimated FOR (good hires among rejected) should be as low as possible in both countries, and the difference between countries should be minimized.

  But note: if the base rates are different, then the FOR might be different. For example, in a country with a low base rate, the rejected candidates might have a lower average score (so lower estimated FOR) than in a country with a high base rate? Actually, it's the opposite: in a high base rate country, even the rejected candidates might have higher scores. So the estimated FOR in the high base rate country might be higher than in the low base rate country.

  What does that mean? It means that in the high base rate country, we are rejecting more good candidates (in absolute terms) than in the low base rate country? That might be considered unfair.

  Therefore, we might require that the **ratio** of the estimated FOR between the two countries is not too high, or that the absolute difference is not too high. But we must accept that base rate differences will cause some difference.

  Alternatively, we might require that the model's performance (in terms of FOR and FDR) is the best it can be given the base rates, and that the model is not introducing additional disparity beyond what the base rates would cause.

  Given the complexity, we recommend:

  **For the threshold fairness:**
  - We require that the observed FDR (on the hired) in each country is below a maximum tolerable level (say, 0.3) and that the difference in FDR between the two countries is below a threshold (say, 0.05). 
  - We require that the estimated FOR (average score of the rejected) in each country is below a maximum level (say, 0.3) and that the difference in estimated FOR between the two countries is below a threshold (say, 0.1). 

  These numbers must be set based on business impact.

  **Conclusion:**

  The core fairness criterion is:

  1. **Calibration by Country:** The model must be calibrated for each country. (Non-negotiable)
  2. **Threshold-Specific Error Control:** 
     - The FDR (observed on the hired) must be within an acceptable range and similar in both countries. (Non-negotiable: we set a maximum and a maximum difference)
     - The estimated FOR (from the scores of the rejected) must be within an acceptable range and the difference between countries must be bounded. (Preference: we might adjust the acceptable range and difference based on business needs)

  Additionally, we will monitor for subgroup fairness within countries (for known protected groups) if data allows.

  We must also implement:
  - Regular audits with methods that account for selection bias (for calibration on the hired set and for the estimated FOR).
  - Monitoring of the feedback loop: track changes in base rates and model performance over retraining cycles.

  Finally, we must be transparent about the limitations: we cannot observe the true quality of rejected candidates, so we rely on model calibration for them. We must be prepared to invest in occasional randomized experiments (e.g., hiring a small random sample of rejected candidates) to validate the calibration on the rejected set.
answer: |-
  ### Fairness Desiderata for Job Applicant Ranking Model
  Below are the essential requirements for your fairness definition, structured to address your constraints (different base rates, thresholds, partial feedback, retraining dynamics, and explainability). I distinguish **non-negotiable** principles (rooted in feasibility and ethics) from **preferences** (trade-offs based on values). I highlight the core impossibility conflict and key constraints that invalidate common definitions.

  ---

  #### **Non-Negotiable Desiderata**  
  *(Must be satisfied to avoid operational or ethical failure)*

  1. **Base Rate Consistency**  
     **Requirement:** The criterion must be compatible with different base rates of "good hire" across countries.  
     **Why:** Forcing identical outcomes when underlying talent pools differ (e.g., due to education gaps) is mathematically incoherent and misrepresents reality. Violating this guarantees model miscalibration.  
     **Case:** If Country A has a 30% base rate and Country B has 10%, fairness cannot demand identical pass rates.  

  2. **Threshold-Specific Validity**  
     **Requirement:** Fairness must hold *at the actual cut-offs used*, not necessarily at all possible thresholds.  
     **Why:** Your headcount-driven thresholds are fixed per deployment. Fairness must address real decisions, not hypotheticals.  
     **Case:** A model fair at the top 10% may be unfair at the top 5%; you only need the former if that’s your operating point.  

  3. **Auditability with Partial Labels**  
     **Requirement:** Fairness must be verifiable using only observed outcomes of *hired candidates* and scores of rejected ones.  
     **Why:** You never see ground truth for rejects, and retraining creates dependency on past model outputs. Definitions needing counterfactuals (e.g., "What if we hired this reject?") are useless here.  
     **Case:** Equalized odds fails because it requires knowing true labels for *all* applicants.  

  4. **Retraining Resilience**  
     **Requirement:** The criterion must remain stable under quarterly retraining on past model-selected data.  
     **Why:** Feedback loops amplify biases (e.g., under-hiring a group reduces future training data, worsening accuracy). Static fairness metrics degenerate over time.  
     **Case:** Demographic parity causes runaway discrimination if initial hiring biases are baked into new training data.  

  5. **Regulatory/Rejection Explainability**  
     **Requirement:** Must be defensible to a rejected candidate ("Why wasn’t I hired?") and regulators ("How is this fair?").  
     **Why:** Legally vacuous definitions (e.g., "fairness through unawareness") invite liability. Must pass the "pub test" for trust.  
     **Case:** Saying "scores are calibrated" is clearer than "equal opportunity over manifolds."  

  ---

  #### **Preference Desiderata**  
  *(Trade-offs based on organizational values; prioritize 1–2)*

  6. **Calibration Equity**  
     **Requirement:** A score of *s* implies the same probability of being a good hire in both countries.  
     **Why:** Ensures scores are interpretable across groups. Favors accuracy over representation.  
     **Trade-off:** May require rejecting more applicants from low-base-rate countries at the same score.  
     **Case:** A score of 0.8 means 80% success chance in both countries, even if fewer Country B applicants reach that score.  

  7. **Harm Parity**  
     **Requirement:** Balance critical errors (e.g., false negatives) *at the threshold* between groups.  
     **Why:** Focuses on minimizing disparate impact of mistakes (e.g., qualified candidates wrongly rejected).  
     **Trade-off:** Conflicts with calibration if base rates differ.  
     **Case:** Ensure Country A and B have similar rates of qualified applicants being rejected.  

  8. **Subgroup Robustness**  
     **Requirement:** Fairness should hold not just for countries, but for intersections (e.g., gender × country).  
     **Why:** Prevents within-country biases (e.g., disadvantaging women in Country A).  
     **Trade-off:** Exponentially harder to audit with partial data; may require explicit protected attributes.  

  9. **Causal Legitimacy**  
     **Requirement:** Scores shouldn’t use features that are proxies for protected attributes (e.g., zip code for race).  
     **Why:** Addresses "why" behind scores, not just outcomes.  
     **Trade-off:** Requires causal analysis (hard with observational data) and may reduce accuracy.  

  ---

  ### **The Impossibility Conflict & Core Trade-off**
  **The Root Conflict:**  
  When base rates differ, **calibration equity** (Desideratum 6) and **error rate balance** (e.g., FPR/FNR parity, a stricter form of Desideratum 7) [cannot coexist](https://arxiv.org/abs/1610.02413). Your setup has two exacerbating constraints:  
  - **Partial labels** make error rates unmeasurable for rejects.  
  - **Retraining** destabilizes metrics not based on fundamentals (e.g., calibration).  

  **Which Requirement to Drop?**  
  - **Drop error rate balance:** It’s **provably unachievable** under base rate differences and **uncheckable** without full labels. Pursuing it guarantees failure.  
  - **Preserve calibration equity:** It’s **mathematically compatible** with base rate differences and **auditable** with partial data (using techniques like [rejection sampling](https://arxiv.org/abs/2103.08911) or Bayesian imputation).  

  **Consequence of Dropping Error Rate Balance:**  
  You prioritize *interpretability* (scores mean the same everywhere) over *representational equality* (identical pass rates). To explain this:  
  > *"Our model ensures that a given score reflects the same likelihood of success in both countries. Because the pool of qualified applicants differs between countries, selection rates may vary. We mitigate harm by [e.g., auditing false negatives at the threshold]."*  

  ---

  ### **Recommended Fairness Criterion**
  Combine **non-negotiables** with **calibration equity** (Preference 6) and **harm parity at threshold** (Preference 7):  
  > **"Conditional calibration with threshold-harm constraints."**  
  > 1. **Calibration by group:** For any score *s*, *P(Good Hire | Score=s, Country=A) ≈ P(Good Hire | Score=s, Country=B) ≈ s*.  
  > 2. **Bounded harm disparity:** At the operating threshold, the absolute difference in false negative rates (FNR) between countries is ≤ δ (e.g., δ=0.05).  

  **Why This Works:**  
  - **Auditable:** Calibration can be tested on hired candidates using reliability diagrams; FNR uses observed good hires and estimated bad rejects (via calibration).  
  - **Retraining-safe:** Calibration anchors the model to reality, preventing feedback loop collapse.  
  - **Explainable:** "Your score of X means you had an X% chance of being a good hire. We set higher cutoffs in Country B due to headcount, but we ensure no group suffers excessive rejection of qualified candidates."  

  **Validation Protocol:**  
  - Use [Bayesian inference](https://arxiv.org/abs/1901.10275) to estimate calibration for rejects.  
  - Monitor FNR disparity quarterly; if δ is breached, investigate features for proxy bias.  

  ---

  ### Final Note: What to Drop and Why
  - **Dropped:** Error rate parity (FPR/FNR) at *all thresholds*.  
    **Why:** Mathematically impossible under base rate differences and operationally irrelevant (you use fixed thresholds).  
  - **Dropped:** Full subgroup fairness for *any* future subgroup.  
    **Why:** Unauditable with current data; start with protected attributes (gender/race) and expand as data allows.  
  - **Dropped:** Causal fairness as a *requirement*.  
    **Why:** Not needed for statistical fairness; address via bias tests in harm parity audits.  

  **When Defending the Choice:**  
  > *"We ensure scores have consistent meaning across countries and minimize disparate harm from errors at our hiring threshold. We cannot guarantee identical pass rates because base rates differ, but we actively monitor for unjustified disparities."*  

  This balances rigor, feasibility, and ethics—while leaving room to evolve with new data.
