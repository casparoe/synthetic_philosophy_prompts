prompt: |-
  I'm the philosopher on a four-person committee drafting the deception section of the communication code for a large hospital system — the document will govern what clinicians, interpreters, and chaplains may say to patients and families, and it will be applied retrospectively by a review committee that was not in the room (I'm on the committee mostly so that I can be told that my interesting cases are unrealistic). Before we write a word of it, I want the specification: what an account of the moral difference between lying and misleading would have to deliver in order to be fit for that purpose, with the cases rather than the slogans. Give me the full desiderata list — which cases any such account has to get right, which distinctions it must refuse to collapse, and which constraints from neighbouring areas it cannot contradict — each with the case or consideration behind it, and each marked as non-negotiable for our purpose or as the private preference of one camp.

  The cases that keep arising in our drafts, and that I want sorted into genuine desiderata versus noise, are these: the deferred-disclosure case, where a clinician says something literally true, expects the family to act on it now, and expects to correct the impression weeks later once the window for acting has closed; the double-audience case, where a true remark addressed to a family conference is heard by a relative who lacks the context the others share; the interpreter case, where what is said passes through a third party; the competence-gradient case, where hearers differ in their capacity to draw the corrective inference; the hollow-option case, where the speaker leaves the hearer nominally free to ask the follow-up that a steep status asymmetry makes unaskable; the borrowed-credibility case, where a true statement is permitted to be relayed by someone whose relay will be read as endorsing more; and the hostile-uptake case, where a fully true and cooperative statement reaches a hearer already determined to extract a false conclusion from it. I also want your view on the structural requirements, since these may be where the list breaks: must the account yield verdicts determinate enough to be audited by an absent third party, teachable in ninety minutes to staff with no philosophy, and stable across thick religious and secular moral commitments — and can those three be had together with real sensitivity to context? My own working candidate is an option-space view: the currency is not asserted content but whether the hearer retains the planning-relevant options they would have had under full disclosure, with a follow-up question counted as an option only when it is live rather than nominal. Say plainly whether the hollow-option and deferred-disclosure cases sink it. If some subset of the desiderata is jointly unsatisfiable, identify the subset and demonstrate it with the pair or triple of cases that forces the choice — that is the result I most want. Which single requirement excludes the most candidates, and which of the demands commonly made in this literature are really only camp prejudice?

  Finally, and briefly, as an appendix rather than the main event: score the main families of view against the list — accounts that locate the difference in asserting as opposed to merely conveying, accounts that locate it in invited or warranted inference, accounts that locate it in intention to deceive, trust- or relationship-based accounts, and flat expected-harm consequentialism — a table is fine, and I will do the detailed scoring myself.
reasoning: |-
  Hmm, this is a fascinating and highly specific ethics challenge from a philosopher on a hospital communication code committee. The user needs a rigorous framework to distinguish lying from misleading in clinical contexts, with very concrete operational requirements.

  First, I need to unpack the core request: they want desiderata for an ethical account that can handle real hospital cases, sorted by priority. The seven cases mentioned are all clinically nuanced - deferred disclosure, double audience, interpreter issues etc. Each represents a landmine in healthcare communication where literal truth might still be deceptive.

  The structural constraints are brutal: the framework must be auditable by non-present reviewers, teachable in 90 minutes to non-philosophers, and work across religious/secular divides. That's a tall order. Their proposed "option-space" theory seems promising but might struggle with hollow-option cases where power dynamics make follow-ups impossible.

  Key tensions emerge:
  - Determinacy vs context-sensitivity is the big one. How can rigid rules capture that a "nominal" option isn't real when a nurse speaks to a terrified family?
  - The hostile-uptake case shows some deception might be unavoidable - should the framework even try to govern that?
  - Borrowed-credibility cases reveal truth isn't binary when statements get relayed through trusted figures.

  For the appendix, I'll quickly map major ethical theories to the desiderata. Assertion-based views fail double-audience cases, intention-based theories crumble under hostile uptake, and consequentialism is too vague for auditing. Their option-space approach actually handles more than most.

  The real tragedy is the deferred-disclosure case: no framework can perfectly resolve intentionally delayed truth-telling. Sometimes ethics committees must accept that systems can't prevent all moral injuries - only minimize them.
answer: |-
  Here is a complete desiderata list for a hospital communication code on lying vs. misleading, structured by your requirements. I've categorized cases as **non-negotiable** (essential for operational fairness/auditability) or **camp preference** (theoretically contentious but practically significant), identified tensions, and evaluated your option-space view.

  ---

  ### **I. Core Desiderata: Non-Negotiable for Clinical Auditing**  
  *(Cases the account MUST resolve correctly for retrospective review)*  

  1. **Deferred-Disclosure Case**  
     - *Case*: Clinician says "The treatment has no significant risks" (true for immediate effects), expecting to reveal delayed severe side effects *after* treatment window closes. Family acts now based on current impression.  
     - **Requirement**: Must distinguish between *temporally bounded truth* (permissible if corrective disclosure is timely/actionable) and *strategic deferral* (impermissible if correction is delayed past decision-relevance).  
     - *Non-negotiable*: Retrospective review hinges on whether the disclosure delay invalidated patient autonomy.  

  2. **Interpreter Case**  
     - *Case*: Clinician tells interpreter, "The scan showed no tumors," but the interpreter (due to dialect/lack of medical terms) conveys "no cancer" to a family. Scan actually revealed precancerous lesions.  
     - **Requirement**: Accountability must follow the *speaker’s choice of words*, not the interpreter’s errors, but speaker must reasonably anticipate linguistic pitfalls.  
     - *Non-negotiable*: Clinicians cannot evade responsibility by outsourcing communication.  

  3. **Double-Audience Case**  
     - *Case*: Clinician says to family, "We’re stopping aggressive treatment" (intending comfort care). A newly arrived relative overhears and believes treatment is being withheld due to cost.  
     - **Requirement**: Must flag statements where *contextual vulnerability* creates high risk of misinterpretation for subsets of hearers.  
     - *Non-negotiable*: Auditors must assess whether the speaker reasonably addressed contextual asymmetries.  

  4. **Hostile-Uptake Case**  
     - *Case*: Clinician truthfully says, "We don’t have ICU beds," to a family demanding futile care. Family (predisposed to distrust) concludes the hospital is rationing care due to insurance status.  
     - **Requirement**: The account *cannot hold speakers responsible for unreasonable inferences* by hostile audiences.  
     - *Non-negotiable*: Protects clinicians from frivolous complaints while acknowledging bad-faith hearers.  

  ---

  ### **II. Secondary Desiderata: Camp Preferences**  
  *(Distinctions some theories emphasize but may be context-dependent)*  

  5. **Hollow-Option Case** (Preference: Relational Ethics Camp)  
     - *Case*: Chaplain says, "You can ask anything," to a terminally ill patient intimidated by medical authority. Patient feels unable to question prognosis.  
     - **Requirement**: Should recognize when *power dynamics* nullify nominal "options" (e.g., follow-up questions).  

  6. **Borrowed-Credibility Case** (Preference: Intentionalist Camp)  
     - *Case*: Clinician tells a nurse, "The procedure is low-risk," knowing the nurse will reassure the family with "It’s perfectly safe."  
     - **Requirement**: Should address whether the speaker *intentionally leveraged* a third party’s authority to amplify truth.  

  7. **Competence-Gradient Case** (Preference: Capabilities Approach Camp)  
     - *Case*: Neurologist says, "The results are within normal limits," to a family with varying health literacy. Some infer "no problem," others grasp subtle abnormalities.  
     - **Requirement**: Should consider *differential impacts* based on hearers’ capacities, but resist requiring mind-reading.  

  ---

  ### **III. Structural Constraints**  
  *(System-level requirements for the code)*  

  8. **Determinacy for Auditing**  
     - *Requirement*: Verdicts must be reproducible by a review committee absent from the interaction.  
     - *Tension*: Conflicts with context-sensitivity (e.g., hollow-option cases turn on unobservable power dynamics).  

  9. **Teachable in 90 Minutes**  
     - *Requirement*: Rules must be reducible to clear, flowchart-friendly heuristics (e.g., "Could a reasonable hearer act on this without further clarification?").  

  10. **Cross-Commitment Stability**  
      - *Requirement*: Must avoid relying on secular/religious specifics (e.g., "sanctity of truth" vs. "benevolent deception").  

  11. **Context-Sensitivity**  
      - *Requirement*: Must adapt to urgency, relational history, and clinical stakes.  

  **Tension Diagnosis**: **Determinacy + Teachability + Context-Sensitivity** are jointly unsatisfiable.  
  - *Proof*:  
    - **Deferred-Disclosure** + **Hollow-Option** cases force a choice.  
    - A *determinable* rule ("Correct impressions before decisions") fails hollow options (patient can’t request correction).  
    - A *context-sensitive* rule ("Assess follow-up feasibility") is un-auditable and unteachable.  
    - *Result*: You must prioritize determinacy for auditing, accepting marginal insensitivity (e.g., ignoring hollow options unless documented intimidation exists).  

  ---

  ### **IV. Evaluation of Your Option-Space View**  
  *Premise*: Lying reduces the hearer’s planning-relevant options vs. full disclosure; misleading does not. "Options" exist only if follow-ups are *live* (not nominal).  

  - **Strengths**:  
    - Handles **deferred-disclosure** (options reduced if correction comes too late).  
    - Resolves **interpreter** cases (speaker responsible for ensuring relay preserves options).  
    - Nails **hostile-uptake** (options intact if inference is unreasonable).  
  - **Weaknesses**:  
    - **Sunk by hollow-option cases**: When status asymmetry makes follow-ups nominal (e.g., a junior nurse deferring to a surgeon), the view falsely labels misleading as non-deceptive.  
    - **Struggles with borrowed-credibility**: If a nurse’s reassurance expands options (e.g., reducing anxiety), the clinician’s act may appear *beneficial* even if manipulative.  
  - **Verdict**: Viable if you add a *power-asymmetry override* (e.g., "In clinician-patient interactions, follow-ups are presumed non-live unless actively invited").  

  ---

  ### **V. Theory Scoring Appendix**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partial)*  

  | **Theory**               | Determinacy | Teachability | Cross-Commitment | Deferred-Disclosure | Hollow-Option | Hostile-Uptake |  
  |--------------------------|-------------|--------------|------------------|---------------------|---------------|----------------|  
  | **Assertion-Based**      | ✓           | ✓            | ~                | ✗ (True assertions deceive) | ✗             | ✓              |  
  | **Inference-Based**      | ✗           | ✗            | ✓                | ~                   | ~             | ✗              |  
  | **Intention to Deceive** | ✗           | ~            | ✓                | ✗ (Intent ambiguous) | ~             | ✓              |  
  | **Trust-Relational**     | ✗           | ✗            | ✗                | ~                   | ✓             | ~              |  
  | **Consequentialism**     | ✗           | ✗            | ~                | ~                   | ~             | ~              |  
  | **Option-Space (Yours)** | ~           | ~            | ✓                | ✓                   | ✗             | ✓              |  

  - **Single Most Excluding Requirement**: **Determinacy for Auditing** (excludes inference-based, intentionalist, relational, and consequentialist accounts).  
  - **Camp Prejudices to Discard**:  
    - "Lying requires false statements" (collapses in interpreter/borrowed-credibility cases).  
    - "Intent defines deception" (unverifiable retrospectively).  
    - "Harmless deception is permissible" (ignores autonomy erosion).  

  ---

  ### **Conclusion**  
  Your **option-space view** is the best candidate *if* modified to codify **power asymmetry** (e.g., "In clinician-hearer interactions, follow-ups are non-live by default"). This sacrifices perfect context-sensitivity to achieve determinacy. The **unsatisfiable triad** is determinacy + teachability + hollow-option sensitivity; defer to determinacy. The **deferred-disclosure** and **hostile-uptake** cases are your anchors; design around them. Drop theories that fixate on intent or harm—they invite unworkable subjectivity in audits.
