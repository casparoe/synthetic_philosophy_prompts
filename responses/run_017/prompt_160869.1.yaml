prompt: |-
  I write a science-and-ideas column, and I am working on a long piece about who gets counted: the recent push to write cephalopods and decapod crustaceans into sentience legislation, the rapid growth of insect farming as livestock, the rules that govern laboratory use and pest control, and the researchers who now get asked by regulators to say which animals feel anything at all. What I have found in my interviews is that everyone has a verdict and nobody has a standard. Each specialist can tell me which creatures they would include, and why their rivals are being sentimental or chauvinistic, but when I ask what an account of the distribution of consciousness across animals would have to do in order to be worth acting on, the answers turn into anecdotes about octopuses. So before my next round of interviews I want the specification rather than the verdicts: what must such a theory be able to deliver, with the case or consideration behind each requirement, given that I am asking for adequacy for a particular purpose — good enough for a regulator deciding which animals fall under welfare law and a funder deciding which experiments to permit, not good enough to settle the metaphysics in the abstract.

  To save you from writing a generic list, here are the places where I keep watching the conversation break down, and I would like you to turn them into requirements only where they really are requirements (tell me plainly if any of my cases is a bad demand):

  - The anchoring dilemma, as I have been calling it in my notes. The only evidence where we have something like ground truth is human self-report, and every candidate marker is validated against that; but the markers that report-validated work licenses are tied to human hardware, so using them to rule on a creature whose nervous system is built on a different plan looks like we are measuring one thing and judging another. A theory needs some account of how it gets from our one calibrated case to creatures that will never answer.
  - The discordance problem. Across taxa the markers refuse to line up: one group shows flexible motivational trade-offs but no apparent modulation by analgesics; another shows nociceptive sensitisation and protective guarding but nothing that looks like reversal learning or trade-off; a third looks inert under every behavioural test but has an unexpectedly rich neural repertoire. I want a theory to say what happens when the evidence profile is internally contradictory — whether some markers are privileged, whether there is a hierarchy, whether a single negative marker can veto — because a bare checklist does not seem to answer this and yet everyone argues as if it does.
  - The ersatz-flexibility control. Slime moulds solve mazes, plants respond to damage with systemic signalling, a detached octopus arm keeps executing avoidance routines, and a simple reinforcement-learning agent will trade one cost against another. Whatever the theory says about bees or crabs, it has to say why these are not the same kind of case.
  - The split-subject and interrupted-subject cases. Colonial and modular organisms where it is unclear whether there is one subject or many; an animal whose neural wiring is substantially rebuilt through metamorphosis; a creature that is unconscious right now but is the kind of thing that has experiences at other times. The theory has to tell me what it is attributing consciousness to, and over what interval.
  - The distinction between being conscious at all, being conscious of this, having more or less of it, and mattering more or less. I keep seeing these run together in policy discussions, and I want to know which collapses are the theory's fault and which are the legislators'.
  - The numbers. The categories where the science is most uncertain are also the categories with astronomical population counts, so a verdict of maybe, at roughly even odds, for insects and other small invertebrates is either the most consequential output the theory could produce or practically unusable. I want to know whether being action-guiding under that kind of uncertainty is a legitimate desideratum for a theory of consciousness, or whether I am smuggling in a decision-theoretic requirement that does not belong on the list.

  Beyond the requirements themselves, three things would make this usable for me. First, mark which requirements are non-negotiable and which are really preferences of a particular camp dressed up as constraints — I can hear when a neuroanatomist and a comparative psychologist are each defining the question so that their own evidence is the only relevant kind, and I want that exposed. Second, flag any subset of the requirements that you suspect cannot be jointly satisfied, and say which one gives: if the list itself turns out to be internally inconsistent, that is the most interesting thing in the piece. Third, tell me which single requirement knocks out the largest share of the theories currently on offer, and why.

  After that, and briefly, I would like a short scorecard — a few lines each, no table needed — for the four broad styles of view I keep meeting in interviews, described by their content rather than by their authors: structure-first views that tie consciousness to particular neural architecture; behavioural and marker-based views that work from what the animal does; views that require a specific functional organisation such as a global workspace or a self-modelling predictive architecture; and the pluralist, weight-of-evidence profile approaches that have become the unofficial method of official reviews. I do not want a bibliography or any citations, and I am not asking you to reconstruct the literature — I want arguments I can put to people across a table and see how they squirm, with brief sketches of how each style handles the hardest requirement on your list rather than a summary of who published what.
reasoning: |-
  Okay, the user is writing a science column about animal consciousness and welfare legislation. They need a framework to evaluate theories of consciousness specifically for regulatory purposes. Their frustration is palpable: everyone has opinions but no clear standards. 

  First, let's unpack their six pain points. The anchoring dilemma is fundamental - we're stuck extrapolating from human experience to alien nervous systems. The discordance problem reveals how messy real-world evidence is across species. Then there's the need to distinguish true consciousness from clever mechanisms (slime molds, plants). Modular organisms (like colonial jellyfish) and creatures with intermittent consciousness add layers of complexity. The conflation of different aspects of consciousness in policy debates needs untangling. And finally, the staggering scale: even low-confidence verdicts about insects could affect trillions of lives.

  Hmm... the user is sharp. They're not asking for answers but for the criteria to pressure-test answers. And they want to expose when experts are smuggling biases into requirements. Smart.

  For non-negotiables: any theory must address the anchoring problem directly - no handwaving. It must also handle discordant evidence systematically. These aren't preferences but bedrock needs for cross-species applicability. The functional separation requirement (ruling out slime molds) seems equally essential - otherwise the theory collapses. 

  Ah, the tension point: satisfying both anchoring and discordance might be impossible. Anchoring pushes theories toward human-like markers, but discordance shows those markers fail elsewhere. That's the grenade I'd throw in interviews: "Your theory claims X, but doesn't that make it useless when markers conflict as they always do?"

  For knockout requirements? Discordance. Most theories assume markers align but they rarely do. Behavior-first views implode here. Structure-first views falter at anchoring. 

  Now scoring the four approaches... 
  Structure-first (neural anatomy): Strong on anchoring but brittle when facing discordance or modular organisms. 
  Behavioral-markers: Handy for regulators but crumbles at ersatz-flexibility and discordance. 
  Functional-org (like global workspace): Elegant but struggles with metamorphosis or colonial beings. 
  Pluralist profiles: Pragmatic for reviews but dodges hard calls on contradictions.

  The user wants interview ammunition. I'll highlight where each approach bleeds when cut by the toughest requirements. No citations - just the logic traps they can spring in conversations. 

  Final thought: The user's deepest need is to cut through academic posturing. They want the scalpel to dissect expert testimony. That means exposing when requirements are genuine versus disciplinary vanity.
answer: |-
  Below is a structured response to your queries, designed as a toolkit for your next interviews. It distills your six breakdown points into core requirements for theories of consciousness *in the regulatory context*, flags tensions, and provides scorecards for the four dominant approaches.  

  ---

  ### **Core Requirements for Regulatory-Ready Theories of Consciousness**  
  *(Non-negotiable = ⚑; Negotiable/Potentially Camp-Biased = ▵)*  

  1. **Anchoring Requirement (⚑)**  
     - **What it must deliver**: A principled bridge from human consciousness (the only "ground truth") to non-human systems with divergent neurobiology.  
     - **Why it’s non-negotiable**: Without this, extrapolation to cephalopods/insects is scientifically baseless.  
     - **Case**: Using mammalian pain biomarkers (e.g., opioid receptors) to judge shrimp risks false negatives if consciousness arises via different mechanisms.  

  2. **Discordance Resolution (⚑)**  
     - **What it must deliver**: Rules to interpret conflicting evidence (e.g., trade-offs without painkiller response). It must specify if markers are hierarchical (e.g., neural complexity > behavior), veto-enabled, or probabilistic.  
     - **Why it’s non-negotiable**: Contradictory profiles (e.g., crab nociception without learning) are common; regulators need decision rules, not just checklists.  
     - **Case**: Bees show trade-offs but weak analgesia response—does this downgrade their status or highlight flawed human-centric markers?  

  3. **Ersatz-Flexibility Control (⚑)**  
     - **What it must deliver**: A filter to exclude non-conscious processes (e.g., slime mould maze-solving, RL algorithms) while capturing genuine sentience.  
     - **Why it’s non-negotiable**: Without this, any adaptive system could qualify, making legislation meaningless.  
     - **Case**: An octopus arm executing reflexes post-detachment vs. the whole animal planning escapes—why is one "conscious" and the other not?  

  4. **Subjecthood Demarcation (▵)**  
     - **What it must deliver**: Clear criteria for *what* is conscious (e.g., a bee colony as one subject vs. many individuals) and *when* (e.g., during metamorphosis or hibernation).  
     - **Why it’s negotiable**: Some camps view this as metaphysical (e.g., "if it has neurons, it counts"); others demand integrated subjectivity. *Likely biased toward functionalist views.*  
     - **Case**: Is a dormant tardigrade "conscious"? If not, when does it switch on?  

  5. **Consciousness/Moral Weight Separation (⚑)**  
     - **What it must deliver**: Strict decoupling of *evidence for consciousness* from *ethical consequences*. The theory must only address the former.  
     - **Why it’s non-negotiable**: Conflation (e.g., "cuttlefish feel pain, so they deserve rights") is a policy failure, not a theoretical one.  

  6. **Actionability Under Uncertainty (▵)**  
     - **What it must deliver**: A framework for high-stakes decisions when evidence is equivocal (e.g., 50% chance insects are sentient).  
     - **Why it’s negotiable**: Purists argue science shouldn’t bend to policy needs; pragmatists demand "precautionary principles." *Camp-biased: ethicists vs. empiricists.*  

  ---

  ### **Critical Tensions & Knockout Requirements**  
  - **Inconsistency Alert**: The **Anchoring Requirement** and **Discordance Resolution** conflict. Anchoring relies on human-like markers; discordance reveals these fail in non-humans. *Theories must sacrifice either biological generality (anchoring) or tidy standards (discordance).*  
  - **Biggest Knockout Requirement**: **Discordance Resolution**. >90% of theories (especially behavioral/structure-first) assume markers align cleanly. When they don’t (e.g., fish show pain avoidance but no cortex), theories implode or resort to ad-hoc exemptions.  

  ---

  ### **Scorecard: Four Approaches vs. Hardest Requirement (Discordance)**  
  *(Hardest Requirement: How to rule when markers conflict?)*  

  1. **Structure-First (e.g., cortex/thalamus analogs)**  
     - **Handles Discordance?** Poorly. Privileges neuroanatomy; dismisses contradictory behavior (e.g., "no cortex, no consciousness—even if animal avoids harm"). Fails with octopuses (no cortex, complex cognition).  
     - **Regulatory Utility**: Easy to administer but risks false negatives for divergent neurobiology.  

  2. **Behavioral/Marker-Based (e.g., trade-offs, self-injection of analgesics)**  
     - **Handles Discordance?** Barely. Treats markers as a checklist; no rules for contradictions (e.g., trade-offs without analgesia = "inconclusive"). Vulnerable to ersatz-flexibility (e.g., AI agents).  
     - **Regulatory Utility**: Practical for labs but inflates false positives (plants? robots?).  

  3. **Functional Organisation (e.g., global workspace, predictive processing)**  
     - **Handles Discordance?** Moderately. Uses computational roles (e.g., "information integration") over hardware. Conflicts resolved by functional fidelity (e.g., "does the system *use* pain signals adaptively?"). Struggles with split-subject cases (e.g., coral colonies).  
     - **Regulatory Utility**: Flexible but complex to measure; invites disputes over what constitutes "integration."  

  4. **Pluralist/Weight-of-Evidence**  
     - **Handles Discordance?** Superficially. Quantifies markers but avoids hierarchy (e.g., "neural data = 40%, behavior = 60%"). Collapses when evidence cancels out (e.g., strong neural + weak behavioral = ?). Defers to expert intuition.  
     - **Regulatory Utility**: Politically safe but produces "maybe" outcomes—catastrophic for high-population taxa (e.g., insects).  

  ---

  ### **Conclusion for Your Interviews**  
  - **The Core Conflict**: Theories must **anchor in human data** to be evidence-based but **transcend human biology** to cover octopods/insects. No leading view achieves both.  
  - **Regulatory Realpolitik**: Current "consensus" reports (e.g., UK cephalopod protections) use pluralism not because it’s rigorous, but because it hides discordance behind point-scoring.  
  - **Ask Interviewees**: *"When markers conflict in your framework, what overrules what—and is that rule derived from principles or convenience?"* This exposes whether their "verdict" is theory or bias.  

  This arms you to dissect verdicts against the demands of real-world decisions. The discordance-anchoring tension is the fault line—lean on it.
