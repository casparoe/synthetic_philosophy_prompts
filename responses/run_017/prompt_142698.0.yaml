prompt: |-
  I'm helping a regulatory agency choose one decision rule for cost-benefit analysis under risk: a single formula that staff economists will apply to hundreds of unrelated projects a year (vaccine approvals, dam safety, wildfire mitigation, biosecurity containment), with the resulting number published and open to legal challenge. Before I look at any candidate rule, I want the specification. What must a risk-weighting rule deliver to count as adequate for that job, with the case or consideration behind each requirement, and which of those requirements are genuinely non-negotiable as opposed to the hobby-horses of one camp?

  My draft list, with the case I have in mind for each:

  1. Take a definite stand on the classic Allais and common-ratio patterns — accommodate them in the formalism, or give a principled account of why they are error. Silence is not acceptable.
  2. Stay calibrated across stake sizes: modest, well-documented aversion to a small-stakes coin flip must not compound into refusing plainly favorable large-stakes gambles.
  3. Give real weight to low-probability, irreversible, catastrophic losses, rather than letting them vanish because they are unlikely.
  4. Avoid fanaticism — a vanishingly small chance of an astronomically large payoff must not automatically dominate every ordinary project — and avoid achieving this by a hard probability cutoff, since any cutoff can be defeated by slicing one risk into many smaller ones.
  5. Behave consistently under changes of bracketing: a portfolio of independent projects should not get one verdict project-by-project and the opposite verdict as a single aggregate distribution, or if it does, the rule must say which bracketing is authoritative and why.
  6. Say whether it evaluates a single decision or the policy of following the rule repeatedly, and what it recommends when a plan that is optimal from the outset is one the agency will later want to abandon midway.
  7. Say whose risk attitude enters the formula when the people bearing a risk are not the people receiving the benefits, and when citizens disagree among themselves; it must not quietly substitute the agency's own attitude for the social one.
  8. Pin the risk attitude down by a fixed, publicly specified calibration procedure rather than fitting it to each decision, so that a verdict cannot be retrofitted to an intuition.

  Tell me which of these are real desiderata for this job and which I should drop. Flag any pair you suspect cannot be jointly satisfied — I think 3 and 4 are jointly unsatisfiable, and that 5 is unsatisfiable together with matching ordinary narrow-bracketed choices, but I want to know if either suspicion is wrong. Name the single requirement that does the most work in excluding otherwise attractive candidates, and add any requirement I have missed that would disqualify a rule outright. Then, in a few lines each and no more, score three contenders: expected utility with a concave utility index, a risk-weighted rule that re-weights probabilities rather than only outcomes, and a safety-first rule that maximizes the worst outcome.
reasoning: |-
  Okay, the user is helping a regulatory agency choose a decision rule for cost-benefit analysis under risk. This rule will be applied to hundreds of unrelated projects annually, and the results will be published and open to legal challenge. They've drafted a list of requirements and want to know which are essential, which might conflict, and how three candidate rules stack up.

  First, I need to understand their context. They're likely a policy advisor or economist working with a regulatory body. The stakes are high because these decisions affect public safety and resources, and they're legally contestable. Their explicit needs are clear: validate their requirements, identify conflicts, and evaluate candidates. But deeper, they might be concerned about legal defensibility, public perception, and ensuring the rule is robust across diverse scenarios.

  Looking at their list, all eight requirements seem valid, but some are trickier than others. Requirement 1 about Allais and common-ratio patterns is non-negotiable—silence could lead to legal challenges over inconsistency. Requirement 2 (calibration across stake sizes) is also critical to avoid absurd outcomes like refusing good large-scale projects. Requirement 3 (weighting catastrophic losses) and 4 (avoiding fanaticism) are both important but conflict; they might need a balanced approach, not a perfect solution. Requirement 5 (consistency under bracketing) is another tough one—different evaluations for projects vs. portfolios could cause problems in court. Requirements 6-8 address operational clarity, social weighting, and calibration, all essential for transparency and fairness.

  The user suspects conflicts between 3 and 4, and 5 with narrow bracketing. They're right—catastrophe weighting and avoiding fanaticism are inherently in tension, and bracketing consistency often clashes with how people naturally decide. Requirement 8 (fixed calibration) might be the biggest hurdle because many rules become arbitrary without it, potentially excluding otherwise good candidates like some risk-weighted models.

  For the candidates: Expected Utility (EU) is solid on many fronts but fails catastrophes and might be too rigid. Risk-weighted rules (like RDU) handle some paradoxes and catastrophes but struggle with fanaticism and calibration. Safety-first (maximin) is simple and protects against worst cases but ignores probabilities and isn't suitable for routine decisions. None are perfect, but EU or a modified RDU might be contenders with caveats.

  I should affirm their instincts, highlight the key conflicts, and stress that requirement 8 is the major filter. Adding a need for computational feasibility could be wise, as agencies handle many projects. Overall, they're on the right track—this is about finding the least-worst option for a high-stakes, public-facing role.
answer: |-
  Here's a validated specification framework, based on the regulatory mandate, with rationale, conflicts flagged, and candidate scoring:

  **Validated Requirements (Non-Negotiables Bolded):**

  1.  **Take a definite stand on Allais/common-ratio:** Non-negotiable. Legal challenges *will* exploit ambiguity or inconsistency in choice patterns. The rule must be theoretically coherent or explicitly normative about rationality.
  2.  **Stay calibrated across stake sizes:** Non-negotiable. Violations lead to absurd, indefensible recommendations (e.g., rejecting multi-billion dollar savings over trivial risks). Essential for credible application to diverse projects.
  3.  **Give real weight to catastrophic losses:** Non-negotiable. Regulatory core mandate (e.g., dam failure, pandemic). Vanishing risks must not be ignored solely due to low probability.
  4.  **Avoid fanaticism:** Non-negotiable. Prevents extortion by infinitesimal threats/benefits. Hard cutoffs are manipulable and lack theoretical/legal defensibility.
  5.  **Behave consistently under bracketing OR specify authoritative framing:** Non-negotiable. Legal challenges will exploit framing inconsistencies ("salami slicing" or "bundling"). The rule must dictate the *correct* unit of analysis.
  6.  **Specify temporal scope & dynamic consistency:** Crucial. Must address whether the rule evaluates isolated acts or long-term policies, and how it handles potential time inconsistency (e.g., optimal pre-commitment vs. reneging). Silence invites manipulation.
  7.  **Specify whose risk attitude & handle heterogeneity:** Non-negotiable. Quiet substitution is undemocratic and legally vulnerable. Must explicitly address aggregation of diverse citizen preferences/risk tolerances.
  8.  **Fixed, public calibration procedure:** **Most Critical Non-Negotiable.** Retrospective fitting destroys objectivity, invites bias/litigation, and negates the rule's purpose. *This is the primary filter excluding many otherwise attractive rules.*

  **Key Conflicts:**

  *   **3 (Catastrophes) vs. 4 (Fanaticism):** Your suspicion is **correct**. Robustly weighting tiny catastrophe risks inherently risks being exploited by infinitesimal threats of even larger (real or fabricated) catastrophes. *Resolution requires a rule with inherent, non-arbitrary damping (e.g., tail normalization, context-dependent weighting) – no perfect solution exists.*
  *   **5 (Bracketing) vs. Matching Narrow Choices:** Your suspicion is **correct**. Requiring consistency under *all* possible framings (narrow/broad) is generally impossible for any rule respecting non-linear risk weighting. *Resolution requires the rule to explicitly define the authoritative bracketing (e.g., "evaluate each regulatory project independently") per Requirement 5.*

  **Missing Requirement:**

  *   **Computational & Practical Feasibility:** Must be implementable by staff economists on hundreds of diverse projects annually without heroic assumptions or bespoke modeling for each case. Rules requiring unique complex calibrations per project or solving intractable optimization problems fail here. (*Disqualifies overly complex rules*)

  **Candidate Scoring (Brief):**

  1.  **Expected Utility (EU - Concave Utility):**
      *   *Pros:* Defines stance on paradoxes (rejects them as irrational). Calibrates stakes (via curvature). Specifies scope (single act). Fixed calibration possible. Bracketing conflict resolved by definition (linear in probabilities).
      *   *Cons:* **Fails catastrophes (3)** - low-probability disasters vanish. **Fails fanaticism (4)** - vulnerable to Pascalian wagers. Silent on preference aggregation (7). Dynamic consistency requires auxiliary assumptions (6).
      *   *Verdict:* Strong foundation, but critical flaws for regulation.

  2.  **Risk-Weighted Utility (e.g., Rank-Dependent Utility - RDU):**
      *   *Pros:* Accommodates Allais/common-ratio (1). Handles catastrophes via probability weighting (3). Can be designed to dampen fanaticism (4). Fixed calibration *possible* but challenging (8).
      *   *Cons:* Severe **bracketing inconsistency (5)** inherent. Calibration across stakes (2) very fragile - small-stakes risk aversion *easily* implies absurd large-stakes rejection. Preference aggregation (7) complex. Risk of retrofitting weights (8). Dynamic consistency (6) murky.
      *   *Verdict:* Addresses key paradoxes/catastrophes, but bracketing & stake calibration are major vulnerabilities.

  3.  **Safety-First (Maximin):**
      *   *Pros:* Extreme catastrophe focus (3). Immune to fanaticism (4) - ignores large payoffs. Simple. Fixed interpretation (8). Bracketing: Depends on defined "worst case" (5).
      *   *Cons:* **Ignores probabilities & benefits entirely** - fails catastrophes *moderation* (3) and all efficient risk-benefit tradeoffs. **Fails stake calibration (2)** utterly (e.g., rejects saving 1,000,000 lives with 0.0001% risk of one death). Fails Allais/common-ratio (1) stance (treats all non-worst options equally). Preference aggregation (7) unclear. Dynamic issues (6).
      *   *Verdict:* Too crude for routine regulation; useful only for absolute survival thresholds.

  **Conclusion:** No candidate satisfies all requirements perfectly. **Requirement 8 (Fixed Calibration)** is the hardest gatekeeper. **EU** is the most robust on 1,2,5,8 but fatally weak on 3/4. **RDU** addresses 1/3/4 but is fragile on 2/5/8. **Maximin** fails multiple core requirements outright. A rule explicitly designed for catastrophic risk (e.g., *Normalized Constant Absolute Risk Aversion* or *Convex Epstein-Zin*) with mandated narrow project bracketing and a legislated calibration process might be the least-bad pragmatic option, acknowledging the inherent 3/4 tension.
