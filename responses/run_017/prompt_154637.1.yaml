answer: |-
  Here's your exam question, model answer, and marking scheme—designed to force engagement with the temporal and normative cruxes while avoiding textbook summaries. "Vestigial momentum" isn't standard terminology (it's clever!), so we'll preserve it.

  ---

  ### Exam Question (as handed to students)
  **Time Allowed:** 60 minutes  
  **Marks:** 20  

  **Case Study:**  
  *Rodentus fossor* is a burrowing rodent with a bony ridge above its eye. Paleobiological evidence shows this ridge was originally shaped by natural selection ~500,000 years ago to deflect strikes from a now-extinct predator. The predator vanished from its habitat ~8,000 years ago. Currently, the ridge channels groundwater toward the eye corner, preventing corneal drying and improving vision/survival. However, genomic studies indicate the population has been small and isolated for ~200 generations, and the reproductive advantage of this channeling is likely too small to overcome genetic drift. Two loss-of-function mutants appeared in this period but disappeared, possibly due to drift.  

  **Engineered Case:**  
  Scientists create an artificial organism, *Syntheticus oculus*, which never had the ridge in its lineage. An identical bony ridge is engineered into it, where it perfectly performs the same corneal-hydration function.  

  **Questions:**  
  1. Using the *Rodentus* case, analyze whether the ridge’s current hydrating effect counts as a "function" under:  
     - (a) The etiological account of function  
     - (b) The causal-role account of function  
     Focus on **how each account handles the recency and efficacy of selective history**. (10 marks)  
  2. Does the disagreement over *Syntheticus* show that etiological and causal-role accounts are answering distinct questions? Explain why this might (or might not) resolve the debate. (5 marks)  
  3. Your friend argues that in cases of malfunction (e.g., a broken ridge), the causal-role account must "smuggle in" a normative standard it cannot justify. Evaluate this claim using either case. (5 marks)  

  ---

  ### Model Answer (~700 words)  
  **(Note: This takes a stance but flags alternatives)**  

  #### Part 1: *Rodentus* Ridge Function  
  **(a) Etiological Account:**  
  The etiological view (e.g., Wright, Millikan) defines a function as what a trait was *selected for* in its evolutionary history. For *Rodentus*, the ridge’s deflection of predator strikes clearly qualifies: it was shaped by past selection. The current hydrating effect, however, faces three temporal challenges:  
  - **Original selection** (deflection) is defunct; the predator is extinct.  
  - **No new selection**: The hydrating effect confers negligible advantage relative to drift, so it has not been a target of selection. Mutant loss is likely due to drift, not selection.  
  - **Recency threshold**: Etiologists disagree on whether "selection history" requires ongoing maintenance. *Strong etiology* (e.g., Neander) demands recent/current selection; *weak etiology* accepts any historical episode. Here, hydration lacks *any* selective history, so even weak etiology excludes it. The ridge’s hydration is merely a beneficial *effect*, not a function.  

  **(b) Causal-Role Account:**  
  The causal-role account (e.g., Cummins) identifies functions with a trait’s current contribution to a system’s capacities (e.g., vision). Hydration *is* a function: it causally supports corneal health and survival. The ridge’s history is irrelevant; only its present role matters. The deflection history is a curiosity, not a criterion.  

  **"Vestigial Momentum" vs. Exaptation:**  
  - **Exaptation** (Gould & Vrba) typically requires co-option *followed by selection* for the new effect. Here, hydration lacks selection, so labeling it an exaptation overreaches.  
  - **"Vestigial momentum"** usefully captures this liminal state: a trait shaped by past selection, repurposed without (yet) being optimized or maintained by new selection. This challenges etiology to clarify *how recent* selection must be and exposes causal-role’s indifference to history.  

  *Crux*: Etiology must choose between requiring *any* history (admitting deflection only) or ongoing selection (admitting neither role here). If it demands ongoing selection, it risks collapsing into causal-role by making *current* advantage sufficient—but this contradicts etiology’s core commitment to historical explanation.  

  #### Part 2: *Syntheticus* and Pluralism  
  *Syntheticus*’ ridge has no evolutionary history, so etiology denies it a function: no selection shaped it. Causal-role affirms its function: it contributes to hydration. This divergence shows the accounts address distinct questions:  
  - **Etiology** asks: "Why did this trait evolve?" (Answer: It didn’t; it was engineered.)  
  - **Causal-role** asks: "What does this trait do now?" (Answer: It hydrates the eye.)  
  *Pluralism*—treating both as valid but separate—seems attractive. However, it fails to resolve debates like *Rodentus*, where history exists but is contested. If pluralism merely "divides the territory," it cannot adjudicate whether hydration is a function *in natural systems* when history is complex.  

  #### Part 3: Malfunction and Normativity  
  A broken ridge that fails to hydrate is dysfunctional under both accounts—but for different reasons:  
  - **Etiology**: The trait cannot perform its *selected effect* (deflection). Normativity comes from natural selection: a malfunctioning trait fails to do what it was "supposed" to do (by selection).  
  - **Causal-role**: The trait fails to perform its *typical contribution* to corneal health. But "typical" smuggles in normativity: is "typical" defined statistically (what most ridges do) or teleologically (what they *should* do)? If statistical, a rare dysfunctional ridge in a healthy population might be "normal"; if teleological, causal-role covertly imports etiology’s normativity. Your friend is right: causal-role must appeal to an ungrounded "should" when calling a broken ridge dysfunctional, whereas etiology anchors norms in selection history. In *Syntheticus*, causal-role might appeal to design intent—but this imports external agency, not natural norms.  

  ---

  ### Marking Scheme (20 Total)  
  **Part 1: *Rodentus* Analysis (10 marks)**  
  - **A (9–10)**: Clearly distinguishes etiological/causal-role criteria; *explicitly addresses recency of selection*; critiques "vestigial momentum" vs. exaptation; takes a stance on origin/maintenance selection.  
  - **B (7–8)**: Correctly applies both accounts but superficially; mentions history vs. current role without recency depth; calls it exaptation without critique.  
  - **C (5–6)**: Lists accounts’ definitions + stock objections; ignores recency/momentum; asserts "both have insights."  
  *Must-hit moves*:  
    - Etiology denies hydration is a function due to no selective history (2 marks).  
    - Causal-role affirms hydration as function (ignores history) (2 marks).  
    - Explains why hydration isn’t an exaptation (no selection) (2 marks).  
    - Analyzes "recency problem" for etiology (e.g., "Does deflection still count?") (2 marks).  
    - Takes a stance on "vestigial momentum" (e.g., "It highlights etiology’s ambiguity") (2 marks).  

  **Part 2: *Syntheticus* and Pluralism (5 marks)**  
  - **A (5)**: Identifies distinct questions (history vs. current role); notes pluralism’s limits for natural cases.  
  - **B (3–4)**: States accounts disagree but calls pluralism a resolution; doesn’t critique.  
  - **C (1–2)**: Only describes disagreement.  
  *Must-hit*:  
    - Etiology denies function (no history) (1 mark).  
    - Causal-role affirms function (current role) (1 mark).  
    - Notes pluralism separates questions (1 mark).  
    - Argues this *doesn’t* resolve *Rodentus* (e.g., "History exists but is inactive") (2 marks).  

  **Part 3: Malfunction (5 marks)**  
  - **A (5)**: Shows causal-role’s normative gap; explains etiology’s selection-based normativity.  
  - **B (3–4)**: Describes malfunction under both; misses normative critique.  
  - **C (1–2)**: Only defines malfunction.  
  *Must-hit*:  
    - Etiology: Malfunction = failure to perform historically selected effect (1 mark).  
    - Causal-role: Malfunction = failure in typical systemic contribution (1 mark).  
    - Identifies "typical" as problematic (statistical vs. teleological) (2 marks).  
    - Concludes causal-role lacks internal norms (1 mark).  

  **Neutrality Note**: Full marks for *either* stance on origin/maintenance if argued (e.g., "Maintenance selection is redundant" or "It resolves liminal cases"). Points deducted only for ignoring the debate.  

  ---

  ### Why This Works  
  - **Forces engagement**: Students can’t score well without confronting recency thresholds and "vestigial momentum."  
  - **Clarifies norms**: The malfunction section explicitly unpacks your friend’s objection.  
  - **Balanced**: The model answer defends a view but rewards alternatives (e.g., a student could argue hydration *is* maintained by weak selection).  
  - **Self-contained**: No citations; all concepts defined in the question or answer.  

  Let me know if you want tweaks—this was a fun challenge! (And tell your friend she owes you coffee for the 9pm debate.) ☕
