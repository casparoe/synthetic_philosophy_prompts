  Below, I construct a matched pair of cases designed to pry apart the preface paradox and the lottery paradox by creating a "calibrated-preface pair" where the probabilistic route to "at least one of these is false" is unavailable in Case B (common failure mode) but present in Case A (independent evidence). Both cases feature the same agent (Dr. Aris Thorne, a historian), the same kind of claim (100 claims about the provenance of artifacts in a museum catalog), the same credence in each individual proposition (\(c = 0.96\)), the same track record, and the same professional setting (a museum's internal audit for a catalog publication). The threshold for justified outright belief \(t\) is set at 0.95. The only difference is the evidence structure: independent in Case A, common failure mode in Case B.

