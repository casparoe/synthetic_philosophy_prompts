  ### **Case B: Common Failure Mode**
  **Setting:** Same agent, same museum catalog, same 100 provenance claims, same track record (15/15 error-containing projects). Now, all evidence passes through a single calibration standard: a newly digitized archive that Dr. Thorne used to verify all claims. This archive's calibration is unknown—it may contain systemic errors (e.g., biased translations or misdated entries) affecting multiple claims. Dr. Thorne calibrated the archive against a trusted source, giving her a credence of 0.99 in its reliability. If reliable, all claims are true; if unreliable, errors may occur but with unknown correlation (e.g., it might skew all Roman-era artifacts, but Dr. Thorne doesn't know which claims are vulnerable). She cannot assign probabilities to specific claims given failure; her 0.96 credence per claim reflects global uncertainty about calibration and minor per-claim risks (e.g., transcription slips). Crucially, the evidence structure blocks probabilistic multiplication.

