  ### **Case A: Independent Evidence**
  **Setting:** Dr. Thorne is auditing a museum's catalog of 100 ancient Mediterranean artifacts for a publication. Each claim is of the form "Artifact X has provenance Y," where provenance is established through independent, non-statistical evidence: cross-referencing different archives, consulting distinct expert testimonies, and analyzing unique physical markings for each artifact. Dr. Thorne has a 20-year track record: in all 15 prior projects of ~100 claims, at least one claim was false (due to forgeries, misattributions, or documentation errors). For this audit, she has high confidence in each claim, but the evidence for each is siloed—no shared dependencies.

  **Credences and Arithmetic:**
  - Individual credence for any claim \(C_i\): \(c = 0.96\) (exceeds \(t = 0.95\)).
  - Conjunction credence for all claims \(\bigwedge_{i=1}^{100} C_i\): \(0.96^{100} \approx 0.017\) (well below \(1 - t = 0.05\)).
  - Track-record induction: From 15/15 error-containing projects, Dr. Thorne inductively infers that at least one claim is false in this project, independent of the probabilistic calculation.

  **Verdicts of Treatments:**
  - **(a) Threshold plus closure:** Each \(C_i\) is justified (since \(0.96 > 0.95\)), and closure requires belief in the conjunction. But the conjunction credence (0.017) is below the threshold, so it is unjustified—contradiction.
  - **(b) Threshold with restricted conjunction introduction:** Each \(C_i\) is justified, but conjunction introduction is not warranted (due to the low conjunction probability). Avoids contradiction by not forming the conjunction belief.
  - **(c) Coherence treatment:** The belief set (all \(C_i\) believed, plus belief that at least one is false) is incoherent. Repair requires dropping at least one \(C_i\) or the preface belief.

  **Feature Doing the Work:** The probabilistic multiplication route (independence) does the work. If independence is removed (e.g., by making evidence dependent), the probabilistic collapse vanishes, but the preface route (track record) remains. If the track record is deleted, the probabilistic route still forces the paradox (conjunction credence < 0.05).

