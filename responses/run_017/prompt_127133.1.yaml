  **Conclusion:** The pair only partially comes apart—Case B collapses under scrutiny, revealing the preface paradox as the lottery paradox "in professional dress." The coherence treatment is the most uniform solution, but it imposes rigidity by prioritizing logical consistency over nuanced evidence structures.
