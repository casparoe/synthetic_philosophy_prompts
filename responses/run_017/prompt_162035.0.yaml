  Below is a decision tree designed for a first-year political theory tutorial diagnostic. It starts from a shared intuition case (the locked gate) and branches through 8 nodes (as required) to land on four conceptions of liberty, without using the terms "positive," "negative," or "republican" in any question. Each node is a concrete, intuition-based case question answerable without theoretical training. The tree cuts through the logical space defined by your constraints (e.g., interference vs. power, agent vs. structural, arbitrariness, endorsement, unknown power) and includes all required cases (locked gate, superior, addiction, law, washed-out road). The resulting combinations are mapped to conventional labels, with unoccupied cells noted. Pairs of leaves the tree cannot separate are flagged with an extra case for distinction.

  ---

  ### **Decision Tree: Conceptions of Liberty Diagnostic**

  **Instructions for Students:**  
  Answer each question based on your intuition. There are no "right" answers—this is about your initial reasoning. Choose "Yes" or "No" for each scenario.

  ---

  #### **Node 1: The Locked Gate**  
  *Case: A gate is locked, and you don’t have the key. You never try to open it and don’t even know it’s locked. The key is held by another person.*  
  **Question:** Does this situation restrict your freedom?  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  #### **Node 2: The Kind Superior**  
  *Case: The person holding the key (from Node 1) is your superior. They are reliably kind and legally required to consult you before any decision that affects you.*  
  **Question:** Does the superior holding the key restrict your freedom?  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  #### **Node 3: The Washed-Out Road**  
  *Case: A road is washed out by a storm, preventing you from leaving your village. No person or group caused this; it was natural.*  
  **Question:** Does the washed-out road restrict your freedom?  
  - **Yes** → Go to Node 6  
  - **No** → Go to Node 7  

  #### **Node 4: The Law You Endorse (Part 1)**  
  *Case: A law exists that you voted for and still support. It stops you from doing something you now want to do.*  
  **Question:** Does this law restrict your freedom?  
  - **Yes** → **Leaf A**  
  - **No** → **Leaf B**  

  #### **Node 5: The Law You Endorse (Part 2)**  
  *Case: A law exists that you voted for and still support. It stops you from doing something you now want to do.*  
  **Question:** Does this law restrict your freedom?  
  - **Yes** → **Leaf C**  
  - **No** → **Leaf D**  

  #### **Node 6: The Addiction**  
  *Case: You have an addiction you deeply wish you didn’t have. It stops you from pursuing your most important goals.*  
  **Question:** Does the addiction restrict your freedom?  
  - **Yes** → **Leaf E**  
  - **No** → **Leaf F**  

  #### **Node 7: The Actual Interference**  
  *Case: Your kind superior (from Node 2) actively blocks you from opening a gate you are trying to open, even though they are legally required to consult you.*  
  **Question:** Does this active blocking restrict your freedom?  
  - **Yes** → Go to Node 8  
  - **No** → **Leaf G**  

  #### **Node 8: The Law You Endorse (Part 3)**  
  *Case: A law exists that you voted for and still support. It stops you from doing something you now want to do.*  
  **Question:** Does this law restrict your freedom?  
  - **Yes** → **Leaf H**  
  - **No** → **Leaf I**  

  ---

  ### **Resulting Leaves and Labels**  
  The tree produces nine endpoints (due to branching), but only four match named conceptions of liberty. The rest are unoccupied. Labels are assigned based on the combination of answers, mapped to the logical space:  

  - **Leaf A** ("Yes" at Node 1, 2, 4):  
    - **Label:** Freedom as non-dependence (regardless of arbitrariness).  
    - **Logical space:** Unfreedom requires only a *standing power to interfere* (Node 1–2: Yes). Arbitrariness does not matter (Node 2: Yes, even with non-arbitrary superior). Endorsement does not negate unfreedom (Node 4: Yes). Structural conditions and internal states are irrelevant here.  

  - **Leaf C** ("Yes" at Node 1, "No" at Node 2, "Yes" at Node 5):  
    - **Label:** Republican non-domination.  
    - **Logical space:** Unfreedom requires a *standing power to interfere* (Node 1: Yes) that is *arbitrary* (Node 2: No—non-arbitrary power doesn’t restrict freedom). Endorsement does not negate unfreedom if arbitrariness exists (Node 5: Yes). Agent required; structural conditions irrelevant.  

  - **Leaf E** ("No" at Node 1, "Yes" at Node 3, "Yes" at Node 6):  
    - **Label:** Positive liberty as self-mastery.  
    - **Logical space:** Unfreedom can arise from *structural conditions* (Node 3: Yes) and *internal constraints* (Node 6: Yes). No agent or interference required. Standing power is irrelevant (Node 1: No).  

  - **Leaf H** ("No" at Node 1, "No" at Node 3, "Yes" at Node 7, "Yes" at Node 8):  
    - **Label:** Negative liberty.  
    - **Logical space:** Unfreedom requires *actual interference* by an agent (Node 7: Yes). Structural conditions (Node 3: No) and standing power (Node 1: No) do not count. Endorsement does not negate unfreedom (Node 8: Yes).  

  #### **Unoccupied Cells**  
  The logical space has five dimensions (interference/power, agent/structure, arbitrariness, endorsement, unknown power). Cells without a leaf are:  

  - **Leaf B** ("Yes" at Node 1, 2; "No" at Node 4): Non-dependence with endorsement mattering.  
    - **Status:** *Unexplored* (theorists rarely combine non-dependence with endorsement).  
  - **Leaf D** ("Yes" at Node 1, "No" at Node 2, "No" at Node 5): Republican with endorsement mattering.  
    - **Status:** *Incoherent* (republicanism rejects endorsement as relevant to non-domination).  
  - **Leaf F** ("No" at Node 1, "Yes" at Node 3, "No" at Node 6): Structural unfreedom without internal unfreedom.  
    - **Status:** *Unattractive* (no major theory separates structural and internal constraints this way).  
  - **Leaf G** ("No" at Node 1, "No" at Node 3, "No" at Node 7): No unfreedom in actual interference.  
    - **Status:** *Incoherent* (if interference doesn’t restrict freedom, nothing does).  
  - **Leaf I** ("No" at Node 1, "No" at Node 3, "Yes" at Node 7, "No" at Node 8): Negative liberty with endorsement mattering.  
    - **Status:** *Unexplored* (negative liberty typically ignores endorsement).

  ---

  ### **Flagged Indistinguishable Leaves**  
  The tree cannot separate two pairs of leaves due to omitted dimensions. For each, an extra case is provided to resolve the ambiguity:  

  1. **Leaf B vs. Positive Liberty (Leaf E):**  
     - **Problem:** Both could endorse internal/structural constraints, but Leaf B (non-dependence + endorsement) wasn’t tested on addiction or structure.  
     - **Extra Case to Separate:** *Poverty case*: "You are born into severe poverty with no one responsible. Does this restrict your freedom?"  
       - If **Yes**, it aligns with positive liberty (Leaf E).  
       - If **No**, it aligns with Leaf B (non-dependence focuses on agents, not structures).  

  2. **Leaf I vs. Republican Non-Domination (Leaf C):**  
     - **Problem:** Both could value non-arbitrariness, but Leaf I (negative liberty + endorsement) wasn’t tested on standing power.  
     - **Extra Case to Separate:** *Unknown Lock Case*: "A stranger has a key to lock your door but never uses it, and you never know. Does this restrict your freedom?"  
       - If **Yes**, it aligns with republicanism (Leaf C).  
       - If **No**, it aligns with Leaf I (negative liberty requires interference).

  ---

  ### **Design Notes**  
  - **Tree Logic:** The first node splits the standing power vs. actual interference dimension. Subsequent nodes isolate arbitrariness (Node 2), structural conditions (Node 3), endorsement (Nodes 4, 5, 8), and internal constraints (Node 6). The required cases are embedded naturally.  
  - **Label Alignment:**  
    - Negative liberty emerges only when interference is actual and structures/internal states don’t count (Nodes 1/3/7: No/No/Yes).  
    - Republican liberty requires arbitrary power (Nodes 1/2: Yes/No).  
    - Positive liberty requires structural/internal constraints (Nodes 3/6: Yes/Yes).  
    - Non-dependence ignores arbitrariness and endorsement (Nodes 1/2/4: Yes/Yes/Yes).  
  - **Efficiency:** At 8 nodes, the tree covers all dimensions without redundancies. Unavoidable ambiguities (e.g., Leaf B) are resolved with the extra cases above.  

  This tree allows students to land on a conception based on intuitions about concrete cases, enabling a diagnostic of pre-theoretical leanings. For the tutorial, you can reveal labels after students complete the tree to spark discussion on the underlying theories.
