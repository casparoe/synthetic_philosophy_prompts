  #### Issues:
  - **Case 4**: The principle treats height selection the same as school achievement. But the user feels it's worse. We need to address why. Perhaps because height is more socially problematic (e.g., reinforces discrimination) or because it's less tied to the child's own flourishing? We might need a clause about the kind of trait: if the trait is purely positional and doesn't contribute to the child's own wellbeing except relatively, then it might be disfavored? But school achievement also is positional. Alternatively, the user's feeling might be due to a sense that height is less malleable or more tied to identity? We might need to add a clause: avoid selection for traits that are primarily social constructs that we wish to eliminate? But that's vague.
