  ### Revised Principle

  Given the issues, we revise:

  **Final Principle: Expected Wellbeing with Risk Aversion, Option Value, and Permissible Sacrifice**

  1. **Primary Wellbeing Focus**: When selecting among possible future children, choose the one whose own expected wellbeing is highest, where wellbeing is assessed from the perspective of the child and in the context of the environment they will be born into.
  2. **Risk Aversion Clause**: If an option carries a substantial risk (above a de minimis level) of a life below a minimum threshold of wellbeing (a life not worth living), then avoid it unless all options carry such risk. Additionally, if an option has a substantial chance of leading to a life that is significantly worse (even if above the threshold) and there is an alternative with a near-certain good life and only a small reduction in expected wellbeing, then the less risky option may be chosen. (This accounts for case 6.)
  3. **Option Value Clause**: When two or more options are expected to yield approximately equal wellbeing for the child, prefer the one that preserves the most valuable set of opportunities (where opportunities are valued in terms of their potential to contribute to a good life).
  4. **Permissible Sacrifice Clause**: It is permissible, but not required, to select a child with lower expected wellbeing (as long as their life is still expected to be above the minimum threshold) if doing so would result in significant net benefits to others. (This accounts for case 8.)
  5. **Scope of Obligation**: The obligation to select the best child applies only to the embryos that have been created. There is no obligation to create additional embryos. However, when multiple embryos are available, the best among them must be selected (subject to the above clauses).

  ### Addressing Case 4
  We still haven't resolved the difference between 3 and 4. We could add:

