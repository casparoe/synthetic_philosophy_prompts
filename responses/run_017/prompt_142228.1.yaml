  We are going to develop a principle for embryo selection that captures as many of the user's verdicts as possible, while also being philosophically defensible. The user has provided a tentative principle and 10 test cases with their verdicts. We'll start by brainstorming a few candidate principles, then reject those that don't fit well, and finally refine the best candidate.

  ### Brainstorming Candidate Principles

  **Candidate 1: Expected Wellbeing Maximization (User's Tentative Principle)**
  - Of the children you could actually have, pick the one whose own life will go best, judged by that child's expected wellbeing and nobody else's.
  - Widening the menu is allowed but not required.
  - Risk is handled by expected value.

  **Candidate 2: Modified Expected Wellbeing with Risk Aversion and Option Value**
  - Same as Candidate 1, but with:
    - Risk: Use expected wellbeing but allow for risk aversion when the worst-case outcome is below a certain threshold (e.g., a life not worth living).
    - Option Value: When two lives are expected to be equally good, prefer the one that preserves more options (to capture the pull in case 2).

  **Candidate 3: Expected Wellbeing with Parental Context and Social Externalities**
  - The wellbeing of the child is assessed in the context of the parents and environment (so for case 5, the temperament variant is good because the parents are structured).
  - However, we do not count the child's impact on others (like in case 8, the life-saving is not part of the child's wellbeing) unless it directly affects the child's wellbeing (e.g., if the parents' love is conditional, then in the unlisted case, selecting for a trait that makes parents love the child more would be allowed because it affects the child's wellbeing).
  - For social goods (like case 4 height and case 3 school achievement), we might discount positional goods because they are zero-sum? But the user feels differently about 3 and 4.

  ### Rejecting Candidates

  **Why reject Candidate 1?**
  It fails on case 6 (user prefers B, but expected value might favor A) and case 2 (the "faint pull" toward the hearing child with more options isn't captured). Also, it doesn't explain the difference in ickyness between 3 and 4.

  **Why reject Candidate 3?**
  It might be too complex and could lead to overcounting externalities. Also, for case 8, the user thinks picking the child who will save lives is admirable, but not required. If we count the social externality, we might make it required, which the user doesn't want. Moreover, the user wants to focus solely on the child's wellbeing.

  **Candidate 2 seems the most promising.** We will develop it further.

  ### Refined Principle: Expected Wellbeing with Risk Aversion and Option Value

  We'll call this the **Modified Expected Wellbeing Principle**:

  1. **Primary Wellbeing Focus**: When selecting among possible future children, choose the one whose own expected wellbeing is highest, where wellbeing is assessed from the perspective of the child and in the context of the environment they will be born into (including family, community, etc.).
  2. **Risk Aversion Clause**: If one or more of the possible children has a non-trivial chance of a life below a minimum threshold of wellbeing (a life not worth living, or one of severe suffering), then avoid such options even if the expected value is higher, unless all options carry such risk. In cases where the worst-case outcome is still above the minimum threshold, expected value should be used.
  3. **Option Value Clause**: When two or more options are expected to yield approximately equal wellbeing for the child, prefer the one that preserves the most valuable set of opportunities (where opportunities are valued in terms of their contribution to a good life). This is to account for the inherent value of having more choices and flexibility.
  4. **Scope of Obligation**: The obligation to select the best child applies only to the embryos that have been created. There is no obligation to create additional embryos (widening the menu) unless failing to do so would leave only options that are below the minimum threshold of wellbeing (but note the user doesn't want widening required in general). However, when multiple embryos are available, the best among them must be selected.

  ### Testing Against Cases

