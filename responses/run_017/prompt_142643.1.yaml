prompt: |-
  I work on a platform team, and a lot of my job over the past few years has been onboarding new engineers onto our deployment and debugging procedures. Three things keep happening, and I have come to think they are all one thing, though I cannot make the shape of it out.

  The first is a runbook. Our deployment runbook instructs new hires to drain active connections, then flip the feature flag, then verify. For about three years now, flipping the flag has drained the connections atomically; the first step is a no-op. We have kept it anyway, because removing it makes training measurably worse. I have compared cohorts informally: engineers trained on the current, accurate description make more first-month mistakes than engineers trained on the superseded description, even though both cohorts are told the true facts about the system whenever they ask. The false step appears to be doing real work — giving a beginner somewhere to put their attention, or a place to stand while the rest of the procedure is still unfamiliar. There is a further wrinkle: engineers who are told, after six months or so, that the step does nothing at all sometimes start making the beginner mistakes again.

  The second is the reverse. When I ask our strongest engineers to write down how they go about diagnosing a flaky test, they produce clean, ordered procedures. Juniors who follow those procedures literally do considerably worse than juniors who simply shadow the senior for a week. And on the few occasions we have recorded the screen, the seniors do not do what they described — not out of dishonesty, but because what they wrote is a retrospective summary that reads like a method. The written version is not worthless, incidentally: it works fine as a reminder for someone who can already do the thing.

  The third is smaller and personal. I can tell within a second or two whether a code review comment is a genuine objection or a style nitpick dressed up as one. I have tried many times to state the rule, including as a lint rule we prototyped and abandoned; every formulation I produce catches both categories or neither. I am not guessing, though — my hit rate is high and I would bet on individual calls.

  What strikes me is that the two directions do not line up. A description can be false and still reliably produce the ability; a description can be accurate and still be inert with respect to producing the ability. So the thing I am noticing is not just that some knowledge lives in the hands and resists being said. In the runbook case it is said perfectly well, and what is said is wrong, and the wrongness looks load-bearing. In the flaky-test case what is said is not wrong — or at least not straightforwardly wrong — and the failure is one of transmission.

  A friend suggested tacit knowledge, which seems to me to miss the first case: that procedure is fully articulable, it is just false. I have also seen the phrase knowing-how versus knowing-that somewhere, but if that only distinguishes two kinds of knowledge, it does not explain why a false propositional description should outperform a true one. Someone else suggested muscle memory or the procedural/declarative distinction, which seems to be a claim about where things are stored in the brain rather than about this mismatch between a description's correctness and its power to produce competence.

  So: is there an established concept for the mismatch itself — the two-sided failure of correspondence between how true a description is and how well it generates the ability it describes? Is it one phenomenon or two, and if the useful-false-description and the inert-true-description are normally treated separately, how are they related to each other? I am told there is a long-running disagreement about whether knowing-how is really just a special case of knowing-that; does the runbook-style case have any bearing on that, and if so on which side? If nothing established fits, I would want a term coined for it, with a definition and boundary cases, since I want to know what does not count: a mnemonic, a simplification told to a child, a placebo, a motivating lie. The label matters less to me than the carving — I want to know what this is, what it is not, and where its edges are. I should add that I have no way to chase down papers or citations, so names of authors and works will not do me much good; the distinction itself is what I am after.
reasoning: |-
  Okay, let me try to unpack what this platform engineer is grappling with. They're describing three distinct but seemingly related phenomena around knowledge transfer in their work. 

  First, there's the runbook case where keeping an outdated step (draining connections) actually helps new engineers perform better, even though it's technically unnecessary. That's fascinating - the false step serves as a training wheel. Then there's the reverse: when seniors document their diagnostic process accurately, juniors can't execute it effectively by just following the text. And finally, there's that personal intuition about code reviews that defies formalization.

  Hmm... what ties these together? The core tension seems to be between the map (documentation) and the territory (actual competence). In the first case, the map is wrong but functional; in the second, the map is accurate but useless for navigation. The third shows an expert's map that can't be shared.

  I recall Polanyi's concept of tacit knowledge - but as the user points out, that doesn't explain why a false procedural step would be helpful. That's more than just "we know more than we can tell." This feels like the false step creates cognitive scaffolding. Like in education where oversimplified models (think Bohr atom) help learners before they grasp complexity.

  For the senior documentation problem, it reminds me of Schön's reflection-in-action concept. Experts don't follow recipes; they improvise based on context. The written procedure is like sheet music - useful if you already play, but not how you learn.

  The code review intuition is pure expertise - Dreyfus model level 5. Some pattern recognition is so ingrained it bypasses conscious rules. Any attempt to codify it either overfits or underfits.

  What's really interesting is how these three cases show different facets of how knowledge behaves:
  - False procedural steps as cognitive anchors
  - Accurate summaries as ineffective training tools
  - Unarticulable expertise as high-precision intuition

  The common thread might be that competence development requires holding contradictory truths: sometimes you need useful fictions, sometimes you need to abandon text and observe, sometimes you just have to internalize through experience. The mismatch isn't a bug - it's how learning works when moving from explicit instruction to embodied expertise.

  I should emphasize that this isn't about knowledge being "tacit" but about the journey from explicit to implicit. The false step works because it occupies conscious attention while unconscious learning happens around it - like training wheels that let you focus on balance. The accurate documentation fails because it lacks the context that experts take for granted. The code review skill can't be taught because it's the endpoint of that journey.

  For carving boundaries: this applies to procedural learning in complex domains (not mnemonics), where errors have consequences (unlike placebos), and where expertise develops through repeated practice (not one-off tasks). The useful fiction only works when it's scaffolding to be removed later, not permanent misinformation.
answer: |-
  What you're observing is a profound tension in knowledge transmission, and it's not adequately captured by existing distinctions like tacit/explicit or procedural/declarative knowledge. You've identified a **dual mismatch**: *descriptive accuracy* (truth value) vs. *pedagogical efficacy* (ability to generate competence). This is one phenomenon with two manifestations, unified by the **role of cognitive scaffolding in skill acquisition**.  

  ### The Phenomenon: **Procedural Scaffolding Mismatch**  
  *Definition:* A description or instruction that either:  
  1.  **Falsely scaffolds competence** (your runbook case): Contains factually inaccurate elements that nevertheless bootstrap performance by reducing cognitive load, focusing attention, or providing psychological anchors during early skill acquisition.  
  2.  **Accurately inert competence** (your flaky-test case): Factually correct but fails to transfer skill because it lacks the implicit context, adaptive heuristics, or perceptual cues experts use unconsciously.  

  ### Why It's One Phenomenon  
  Both cases reveal that **competence emerges from interaction with structure**, not just factual fidelity:  
  - **False Scaffolding** works because it:  
    - *Creates cognitive landmarks*: The superfluous step ("drain connections") acts as a "holding pattern" for attention, freeing mental resources to absorb adjacent complex steps.  
    - *Reduces paralysis*: Beginners need concrete actions to overcome inertia. A "placeholder step" mitigates the terror of the unknown.  
    - *Triggers expert-amnesia*: When seniors learn the step is useless, removing it destabilizes their automated routine, forcing them back into conscious processing (hence regression).  
  - **Accurate Inertia** fails because:  
    - *Compression loses context*: Seniors document *what* they decided, not *how* they noticed what to decide. The "clean procedure" omits perceptual triggers (e.g., "I saw X in the logs *because* it looked like Y from last Tuesday").  
    - *Proceduralization precedes competence*: Juniors lack the pattern-matching to know *when* to deviate. The document is a *cheat sheet for experts*, not a *training manual*.  

  ### Boundaries & What It's NOT  
  | **Included**                          | **Excluded**                          |  
  |---------------------------------------|---------------------------------------|  
  | False steps that bootstrap performance | Simplifications for children (no performance stakes) |  
  | Accurate summaries that fail to train | Placebos (no direct skill transfer)   |  
  | Unarticulable expert intuition        | Mnemonics (aid recall, not skill)     |  
  | *Only* in procedural domains with:    | Motivating lies (e.g., "You're a natural!") |  
    - High stakes (errors costly)          | Straightforward tasks (no expertise gradient) |  
    - Expertise gradients (novice→expert)  | Pure declarative knowledge (e.g., facts) |  

  ### Relation to "Knowing-How" vs. "Knowing-That"  
  Your cases challenge the debate:  
  - The **runbook** shows *false* "knowing-that" *enabling* "knowing-how." This contradicts the view that "knowing-how" reduces to "knowing-that" (intellectualism), as the false proposition aids skill despite its inaccuracy.  
  - The **flaky-test** case shows *accurate* "knowing-that" *failing* to produce "knowing-how," supporting anti-intellectualism (Ryle, Dreyfus).  
  - **Conclusion**: Skill acquisition *leverages* propositions (true or false) as cognitive tools, but competence *transcends* them. Propositions are scaffolding, not foundations.  

  ### Why Existing Frameworks Fall Short  
  - **Tacit Knowledge** (Polanyi): Explains unarticulated intuition (your code review case) but not the *usefulness of false instructions*.  
  - **Procedural Memory**: Describes *storage* of skills, not why *false descriptions* aid learning.  
  - **Cognitive Load Theory**: Explains scaffolding but doesn’t address *false* scaffolds.  
  - **Situated Cognition**: Captures context-dependence but not pedagogical falsehoods.  

  ### Core Insight  
  **Competence is ecological.** It emerges from the interaction between:  
  - The learner’s cognitive state (novice anxiety, expert automaticity)  
  - The structure of the task (ambiguity, stakes)  
  - The artifacts used (runbooks, docs)  
  **Descriptions are tools, not truths.** Their value lies in *how they mediate engagement* with the task, not their accuracy. A false step is a "training wheel": useless for cycling, essential for learning. An expert's summary is a "map legend": useless without the map (experience), essential for interpretation.  

  This mismatch isn’t a flaw—it’s a feature of how humans bootstrap expertise in complex domains. The carving you seek lies at the intersection of cognitive psychology, situated action, and the philosophy of skill.
