  - Now produces unintended benefit C
  - A reformer proposes replacing it with an institution designed for C
  And critically examine whether Chesterton's fence prohibits this, and how Burke might differ due to his view of institutions as repositories of tacit knowledge.

  The professor emphasizes two key distinctions:
  1) Chesterton requires individual comprehension of reasons
  2) Burke values collective tacit rationality beyond individual understanding

  *scratches head* I need to craft a question that forces students to confront this gap. Many will conflate the two thinkers, so the prompt must make the divergence unavoidable. The model answer should demonstrate how Burke's "prejudice" concept allows institutions to embody wisdom about C even if unintentional, while Chesterton's rule-based approach only binds if the original reason (R) is still valid.

  For the marking scheme, I'll identify five critical points:
  1) Distinguishing epistemic foundations
  2) Applying Chesterton's fence to the R/C dilemma
  3) Explaining Burke's tacit rationality argument
  4) Showing why Burke might permit replacement
  5) Articulating the core divergence

  Common student errors I anticipate:
