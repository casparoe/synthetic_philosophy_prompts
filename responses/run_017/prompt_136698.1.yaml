answer: |-
  ### Activity Design: Dutch Book Seminar

  **Materials**:  
  - **Propositions**:  
    - Synchronic: Coin lands heads (H), tails (T), H∨T (tautology), H∧T (contradiction), "100,003 is prime" (pre-verified true; sealed answer).  
    - Diachronic: "Die roll = 6" (D6); partition: {even, odd}.  
  - **Tickets**: Each pays 100 points if true (0 if false).  
  - **Prices**: Single number per proposition (buy/sell at that price).  
  - **Bookies**: Rotating group (3–4 students); they design combined bet packages.  
  - **Envelopes**: For diachronic round, containing "even" or "odd" (pre-assigned randomly).  
  - **Prizes**: Book token for "richest" student and "most extractive" bookie.  

  **Payoff Scheme**:  
  - Students start with 1,000 points.  
  - Bookies start with 1,000 points (separate pool).  
  - Points transferred after each round; final tally before prizes.  

  ---

  ### Timeline (90-Minute Session)  

  | Time  | Activity |  
  |-------|----------|  
  | 0:00–0:10 | **Intro**: Explain rules. Synchronic round: Students post prices for H, T, H∨T, H∧T, and primality. Bookies design packages. |  
  | 0:10–0:25 | **Synchronic Trading**: Bookies execute packages. Resolve H/T via coin flip; primality via sealed answer. Record losses. |  
  | 0:25–0:35 | **Diachronic Setup**: Students pre-commit prices for D6 *now* and *if* they learn even/odd. Envelopes distributed. |  
  | 0:35–0:50 | **Diachronic Trading**: Bookies trade pre-commitments. Envelopes opened; students post live prices. Bookies trade again vs. live prices. Resolve D6 with die roll. |  
  | 0:50–0:60 | **Spread Variation**: Repeat synchronic round with bid/ask spreads (e.g., buy at $p$, sell at $q>p$). Bookies attempt sequential exploitation. |  
  | 0:60–0:80 | **Debrief** (see bullets below). |  
  | 0:80–0:90 | Final scoring, prizes, wrap-up. |  

  ---

  ### Debrief: Key Moments → Assumptions  
  - **Single price (synchronic)**: Forces two-sided trades → *Prices are buying/selling rates, not intervals*.  
  - **Bookie combines bets**: Package loses in all outcomes → *Trades are additive; loss is guaranteed, not probabilistic*.  
  - **Pre-commitment (diachronic)**: Prices fixed before learning → *Updating plan must be defined in advance*.  
  - **Live vs. pre-committed price gap**: Bookie exploits discrepancy → *Diachronic coherence requires alignment with conditionalization*.  
  - **Spread variation failure**: Bookie can’t force one-shot package → *Synchronic argument requires no bid/ask spread*.  
  - **Primality unresolved mid-game**: Exploitation relies on truth-value → *Logical omniscience assumed (agents should know tautologies/contradictions)*.  

  ---

  ### Predictable Issues & Fixes  
  1. **Student posts 0.5 on everything**:  
     - *Why*: Misunderstanding "fair price" as ignorance.  
     - *Fix*: Show how H∨T (tautology) at 0.5 lets bookies sell tickets for 50 points; student loses 50 points unconditionally.  

  2. **Refusal to trade (loss aversion)**:  
     - *Why*: Points treated as real value.  
     - *Fix*: Emphasize linearity ("points are utility, not cash"); enforce trading at posted prices.  

  3. **Misreporting fair prices**:  
     - *Why*: Attempt to "beat" bookies.  
     - *Fix*: Stress honesty ("If you misreport, you mask vulnerability—not avoid it").  

  ---

  ### What the Activity *Cannot* Deliver  
  - **Coherence ≠ full rationality**: Dutch books expose inconsistency, but not calibration/justification.  
  - **Exploitability as symptom**: Being Dutch-bookable signals incoherence; it isn’t the *reason* to avoid it (e.g., accuracy matters too).  
  - **Linearity of utility**: Assumes points are linear in value; fails for high-stakes real money.  
  - **Non-omniscience limits**: Real agents ignore tautologies (e.g., primality); Dutch books assume logical competence.  

