prompt: |-
  I'm a philosophy PhD student finishing a dissertation chapter on the therapy/enhancement distinction, and I keep coming back to organised competitive sport as the one place where that distinction has actually been written into binding rules and enforced with real sanctions. So I want to treat the anti-doping code as a philosophical object and ask what it presupposes. Here is the practice as I understand it: a substance or method goes on the Prohibited List if it satisfies two of three criteria — that it can enhance performance, that it carries health risk, and that it offends the spirit of sport. An athlete with a documented diagnosis can get a Therapeutic Use Exemption to take an otherwise banned substance, on the condition that the dose restores normal function rather than exceeding it. Some substances are banned only in competition, some only in particular sports (beta-blockers in precision events like shooting and archery, stimulants generally). Meanwhile a great many interventions that plainly enhance performance are permitted outright: altitude training and hypoxic tents, creatine, caffeine, carbohydrate loading, high-tech running shoes (though certain swimwear technology was eventually banned after a rash of records), corrective eye surgery that can leave an athlete with better-than-normal acuity, and reconstructive surgery after which some pitchers return throwing harder than before. And in the regulations governing some athletes with differences of sex development, competitors have in effect been required to take medication to bring a natural hormone level down in order to be eligible for certain track events.

  The pattern puzzles me in several places at once. First, the very same intervention — a corticosteroid injection, testosterone replacement, a stimulant — is treatment when the patient is a teacher and doping when the patient is a cyclist, which suggests the therapy/enhancement line is not a property of the intervention or even of the person's health, but of the role or practice the person is in. Second, hypoxic tents and erythropoietin raise red-cell mass through the same broad physiological route, yet one is a permitted training method and the other a criminalised one; so something other than the physiological effect is doing the work. Third, if therapeutic use is supposed to restore an athlete's own baseline, the code has no clean baseline to restore to: some baselines are themselves partly products of earlier permitted enhancements, some surgical repairs overshoot the pre-injury level, and some natural baselines are treated as unfair advantages requiring suppression rather than as the neutral point of departure. Fourth, the sport-relativity of the beta-blocker ban seems to presuppose that each sport has a specifiable excellence — the specific capacities it is supposed to test — and that the rules protect that excellence rather than health or fairness in the abstract.

  A colleague of mine has been pushing an alternative anchor that I can't quite evaluate, and I'd like your help testing it against the code: she suggests forgetting medical normality and anchoring the rules instead to a developmental-luck baseline, i.e. permitting an intervention just in case it leaves the athlete's relevant physiological variable where it would have been had they enjoyed a fair share of developmental goods — nutrition, coaching, freedom from untreated injury — and banning interventions that push them past that counterfactual level, including, in principle, requiring downward corrections for athletes whose natural endowment exceeds it. A second thought I've had is that the code might really be tracking not therapy versus enhancement but whether the adaptation is mediated by effort and training versus delivered directly, so that the deep commitment is to something like the moral significance of effort rather than to health or fairness.

  Here is what I want. Reconstruct the implicit theory that this practice actually requires: what view of therapy, of enhancement, of natural advantage, of the point of competition does it only make sense under, and which rival views does it quietly rule out? Be disciplined about three things I care about. (i) Separate what the practice strictly presupposes from what it merely fits well with, and mark the points where it is philosophically underdetermined, so that several quite different theories would license the same rule. (ii) Say where the parts of the practice are pulling in different directions — whether the therapy/enhancement distinction is doing the real work or is a rationalisation for something else, and whether the practice is coherent overall or only locally coherent. (iii) Tell me concretely what would have to change if the anchor were replaced: what would the Prohibited List and the Therapeutic Use Exemption system look like under my colleague's developmental-luck baseline, under a straightforward harm-reduction regime that permits anything safe, and under a pure anti-deception or level-playing-field view — and which items on the current list would collapse, survive, or have to be added. I don't need a map of the literature; I want the analysis.
reasoning: |-
  Okay, this is a fascinating and complex philosophical query from a PhD student working on the therapy/enhancement distinction through the lens of sports anti-doping regulations. The user has clearly immersed themselves in the practical details of WADA's code while identifying several philosophical tensions: role-dependency of enhancement definitions, physiological equivalence of permitted vs banned methods, unstable baselines for "normal function," and sport-specific conceptions of excellence. 

  The user is asking for three very specific analytical tasks: first, reconstructing the implicit theory behind current rules; second, diagnosing internal tensions; third, modeling alternative regulatory frameworks. Their unspoken need seems to be pressure-testing their chapter's arguments against a rigorous external analysis - they mention a colleague's "developmental luck" proposal and their own "effort mediation" hypothesis as competing explanations. 

  Notably, they're not seeking literature review but original systematic breakdown. The depth of their examples (from corticosteroid dual-use to post-surgery velocity gains in pitchers) suggests they'll recognize oversimplifications. I should prioritize structural coherence over comprehensiveness.

  Starting with presuppositions: The core insight is that anti-doping rules aren't really about medicine but about constituting sport as a particular human practice. The "spirit of sport" criterion reveals this - it's the foundational norm that medical criteria serve. Key presuppositions include: 1) Sports test cultivated abilities, not raw biological givens; 2) There exists a demarcated "natural" training space; 3) Competitions measure differences forged within that space. 

  The health risk criterion functions mainly as a gatekeeper - sufficient but not necessary for prohibition (witness caffeine's safety but competition ban). Meanwhile, the therapy exception isn't truly medical; it's a limited concession allowing athletes to re-enter the cultivation space after disadvantage. This explains why "restoration" targets sport-specific function, not population health norms.

  On tensions: The practice isn't philosophically coherent but pragmatically stabilized. The baseline instability (e.g., LASIK exceeding 20/20 vision being permitted) shows "normal function" is really sport-functional adequacy. Permitted tech like carbon-plate shoes passes because it's seen as equipment evolution within the cultivation paradigm, unlike blood doping which shortcuts effort. But the boundary is arbitrary - why is a hypoxic tent "effort" but EPO isn't? The code implicitly answers: anything requiring athletic labor (training in thin air) is kosher; anything bypassing it (injecting EPO) isn't. 

  The developmental-luck alternative would revolutionize enforcement. Instead of TUEs, we'd need "Baseline Adjustment Exemptions" calculating counterfactual potentials - imagine committees determining what an archer's tremor would be with ideal childhood nutrition. Prohibitions would shift: Sudafed might be permitted for athletes from pollen-heavy regions as "restoration," while genetic outliers might face hormone suppression. But it collapses practically - how to define "fair share" of developmental goods? 

  A harm-reduction model would permit all safe PEDs, turning anti-doping into consumer safety regulation. The Prohibited List becomes a High-Risk List - substances like oral steroids banned for toxicity, while safe peptides flood sports. "Therapy" distinctions vanish; TUEs become irrelevant. Sports excellence would redefine as pharmacology-enhanced performance, with records requiring era-standardization.

  The pure level-playing-field approach is most radical: prohibit anything not universally accessible. Altitude training and hypoxic tents would join EPO on the List - if Kenyan highlands confer advantage, either ban altitude-born athletes or provide all competitors with hypoxic chambers. But this eliminates geography and genetics as advantage sources, possibly sterilizing sport.

  The unresolved conflict lies between two visions: sport as celebration of cultivated human potential versus sport as spectacle of biological possibility. Current rules hybridize them unstably. The user's "effort mediation" theory captures part of this - the code privileges effort-dependent adaptation - but doesn't explain why some effortful enhancements (cryotherapy, hyperbaric chambers) are permitted while others (cortisone misuse) aren't. The real demarcation may be whether enhancement occurs within the athlete's biological agency versus imposed externally - but even that distinction blurs with modern technology.
answer: |-
  Your analysis of anti-doping regulations as a philosophical object reveals profound tensions. I'll reconstruct the implicit theory, diagnose its fractures, and model alternatives as requested—adhering strictly to your three disciplinary constraints.

  ### I. The Implicit Theory of Anti-Doping Practice
  **Core Presuppositions:**
  1.  **Sport as a Cultivation Practice:** Competitive sport exists to test *cultivated* human capacities. The "spirit of sport" criterion presupposes sport is not merely a display of biological potential but of potential *developed through effortful training within defined constraints*.
  2.  **The "Natural" Training Space:** Permitted interventions (altitude tents, nutrition) are extensions of traditional training environments or methods requiring athlete labor. Banned interventions (EPO, synthetic hormones) are seen as *external shortcuts* bypassing this cultivation process.
  3.  **Functional Baseline (Sport-Relative):** "Therapy" restores *sport-specific functional capacity*, not population health norms. The baseline is the athlete's *demonstrated capacity within the sport prior to illness/injury*, contingent on prior permitted enhancements (e.g., LASIK). "Normal function" means capacity to compete effectively *in their sport*, not statistical normality.
  4. **Sport-Specific Excellence:** Each sport has a defined telos (e.g., precision under pressure in archery, endurance in cycling). Rules protect this telos. Beta-blockers are banned in archery not because they are inherently "enhancing" but because they undermine the *specific capacity being tested* (steady aim under stress).
  5. **Health as Proxy & Constraint:** The health criterion primarily serves to limit risks from *uncontrolled* enhancement and legitimizes bans. It is secondary to the spirit of sport (witness permitted risks like boxing, football collisions). Health risks justify prohibition *only if* the substance also threatens sport’s telos (e.g., reckless aggression from stimulants).
  6. **"Natural" Advantage as Morally Neutral (Unless Disruptive):** Innate advantages (height, high testosterone) are generally accepted unless they undermine *competitive viability* (e.g., Semenya regulations prioritize a level playing field in women's events over unmodified biology).

  **What This Rules Out:**
  *   **Therapy/Enhancement as Biomedical Categories:** The role-dependency (teacher vs. cyclist) shows the distinction is functional and contextual, not ontological.
  *   **Physiological Equivalence Arguments:** Hypoxic tents vs. EPO reveals that *method* (effortful adaptation vs. direct pharmacological intervention) matters more than outcome.
  *   **"Pure" Health-Based Regulation:** Permitted risky training and banned safe substances (like low-dose EPO in some contexts) show health is not the primary driver.
  *   **The Existence of a Pre-Enhancement "Natural" State:** The acceptance of overshooting surgeries and technology-dependent baselines (super shoes) demonstrates the baseline is pragmatic and forward-looking.

  **Points of Underdetermination:**
  *   **The Effort Boundary:** *Why* is the hypoxic tent "effort" but microdosing EPO isn't? The code assumes but doesn't define the moral significance of effort; utilitarianism, virtue ethics, or deontology could all potentially support it.
  *   **"Spirit of Sport" Content:** This is inherently contestable. It could reflect Aristotelian virtues (courage, temperance), Kantian respect for opponents, or Rawlsian fairness – the code doesn't specify.
  *   **Permitted Tech Threshold:** Why are carbon-fiber shoes ok but polyurethane swimsuits banned? The line between "equipment evolution" and "artificial enhancement" relies on tacit, shifting conventions about "appropriate" technology.

  ### II. Internal Tensions & What Does the Work
  *   **The Therapy/Enhancement Distinction is a Tool, Not the Foundation:** It primarily serves to *legitimize exceptions* (TUEs) within a system fundamentally concerned with preserving sport’s telos and cultivation ethic. The real work is done by the "spirit of sport" and sport-specific excellence criteria.
  *   **Fracture Lines:**
      1.  **Baseline Instability:** The "restore function" principle collapses when pre-injury baselines involve permitted enhancements (altitude-adapted physiology) or when "restoration" overshoots (post-surgery pitching velocity). The system prioritizes *functional reintegration into competition* over biological fidelity.
      2.  **Method vs. Outcome:** The physiological equivalence of EPO and altitude tents exposes a core tension. The code privileges *methods perceived as "effortful training"* over pharmacological shortcuts, but this relies on culturally contingent categories (tent = "natural," injection = "unnatural").
      3.  **"Natural" Advantage Ambiguity:** Suppressing DSD athletes' testosterone undermines the premise that innate biology is sacrosanct. It reveals the priority is *maintaining competitive categories defined by hormone levels*, not preserving natural endowments. Fairness within the *constructed category* trumps unmodified biology.
  *   **Coherence:** The system is **locally coherent but globally unstable**. It functions pragmatically for rule enforcement because it provides *operationalizable criteria* (List + TUEs + sport-specific bans). Philosophically, it's a patchwork: the cultivation ethic (effort/training), sport-specific teloi, health pragmatism, and category maintenance (like DSD rules) are in tension. The "spirit of sport" acts as a vague umbrella holding these together.

  ### III. Alternative Anchors: Concrete Implications
  **1. Developmental-Luck Baseline:**
  *   **Core Change:** Shift from "restore function" to "correct for developmental injustice." Permitted interventions compensate for lack of nutrition, coaching, healthcare access.
  *   **Prohibited List:** Bans anything pushing an athlete *beyond* their counterfactual "fair share" potential. Genetic outliers above this baseline might require suppression (e.g., naturally very high T).
  *   **TUE System Replaced:** By "Developmental Disadvantage Exemptions" (DDEs). An athlete from a region with endemic anemia might get EPO to reach their "fair share" red-cell mass. An athlete with untreated childhood asthma might get corticosteroids to reach lung function achievable with early care.
  *   **Collapses:** Sport-specific bans (beta-blockers irrelevant if "fair share" nervous system calibration is the goal). Most current TUEs (focused on acute conditions, not developmental deficits).
  *   **Survives/Adds:** Health risks remain a constraint. Adds complex bureaucracy assessing counterfactual potentials ("What would this sprinter's muscle fiber composition be with optimal childhood nutrition?"). Requires defining "fair share" – highly contentious.
  *   **Tension Point:** Directly conflicts with permitting innate advantages. Requires suppression of "excessive" natural gifts, radically altering sport's ethos.

  **2. Harm-Reduction Regime (Permit Anything Safe):**
  *   **Core Change:** Health is the *only* criterion. The Prohibited List becomes the "High-Risk List."
  *   **Prohibited List:** Only substances/methods with unacceptable health risks (e.g., anabolic steroids in high doses, blood doping with improper storage). Caffeine, beta-blockers, therapeutic testosterone, even low-dose EPO with monitoring permitted.
  *   **TUE System Eliminated:** Medically supervised use of any substance allowed if deemed safe *for that athlete*. Distinction between therapy/enhancement vanishes.
  *   **Collapses:** Entire rationale for banning safe performance enhancers. "Spirit of sport" criterion irrelevant. Sport-specific bans (beta-blockers) gone.
  *   **Survives:** Health monitoring becomes paramount. WADA transforms into a medical oversight body.
  *   **Consequence:** Sport becomes an arena of biomedical optimization, shifting focus from cultivated effort to technological/chemical augmentation. Records become era-specific.

  **3. Pure Anti-Deception / Level Playing-Field:**
  *   **Core Change:** Ban *only* what is undetectable or creates *covert* advantages. Focus on transparency and universal access.
  *   **Prohibited List:** Shrinks dramatically. Bans substances/methods that are undetectable, or where effects can be easily hidden. Permits anything detectable or universally accessible.
  *   **TUE System:** Focuses on ensuring declared use doesn't create hidden advantages. High-dose corticosteroids might be banned in-competition due to masking potential, even with TUE.
  *   **Collapses:** "Spirit of sport," most health justifications (unless risk creates *covert* instability), sport-specific bans (if beta-blockers are detectable/accessible).
  *   **Survives/Adds:** Strict whereabouts & testing for detectability. Requires mandating universal access to permitted enhancements (e.g., WADA-provided hypoxic tents for all). Bans anything geographically restricted (e.g., training at natural altitude unless replicated for all).
  *   **Tension Point:** Permits extreme enhancement if open and accessible (e.g., gene therapy for all). Focuses on procedural fairness, not the nature of performance.

  **Conclusion:** The current anti-doding code presupposes sport as a practice celebrating cultivated excellence within constrained, effort-driven adaptation. Its therapy/enhancement distinction is a context-dependent tool serving this end, not a free-standing principle. The system's stability relies on pragmatic compromises between competing values (cultivation, fairness, health, spectacle) under the vague banner of the "spirit of sport." Replacing its anchor reveals stark choices: shifting to redistributive justice (developmental luck), accepting biomedical transformation (harm-reduction), or prioritizing transparency over tradition (anti-deception). Its enduring philosophical interest lies precisely in this unstable negotiation between our ideals of natural effort, medical intervention, and the meaning of contest.
