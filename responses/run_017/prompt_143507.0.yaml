answer: |-
  ### Diagnostic Instrument: Is the Brain a Computer?

  This handout presents ten diagnostic questions to help you explore your stance on whether the brain is a computer. Each question focuses on a concrete case or claim, answerable with introductory knowledge. **Do not overthink:** go with your initial reaction. Answer all questions before consulting the scoring key. The key maps your answers to one of twelve philosophical/scientific positions ("leaves") based on three sub-scores:  
  - **A**: Does neural tissue literally compute (not just as a description)?  
  - **B**: Do computational models explain neural/cognitive phenomena in ways a purely biophysical account cannot?  
  - **C**: Is cognition constitutively computational (i.e., inherently computational, not just modellable as such)?  

  The positions are defined by their content, not by who holds them. Some positions share similar answer patterns; overlaps are marked in the key. After scoring, review the **Instructor's Note** for context on settled/contested issues.

  ---

  #### Questions  
  For each question, select the option (a, b, or c) that best reflects your view. Focus on the *principle* the case illustrates.

  1. **Stomach Case**: A textbook describes a stretch of gut as "processing information" during digestion (e.g., breaking down food). Does this mean the gut literally computes?  
     - (a) Yes—it transforms inputs to outputs like a computational process.  
     - (b) No—this is a metaphor; digestion is purely biochemical.  
     - (c) Only if the gut’s function (e.g., nutrient extraction) requires information.  

  2. **Valley Case**: Hydrologists use a valley’s drainage pattern to read off solutions to an equation they’d otherwise solve numerically. Does this mean the valley is computing?  
     - (a) Yes—it physically solves a problem that could be computed.  
     - (b) No—it’s just a physical system; the computation is in the scientists’ interpretation.  
     - (c) Only if we include the hydrologists as part of the system.  

  3. **Two Programs Case**: A neural circuit is equally well described by two formally incompatible programs (e.g., one uses discrete steps, the other continuous). What does this imply?  
     - (a) The circuit isn’t truly computing; the programs are just descriptive tools.  
     - (b) The circuit is computing, but the exact program is underdetermined by data.  
     - (c) It shows computation depends on the level of abstraction (neither program is “truer”).  

  4. **Post-Hoc Model Case**: A computational model is fitted to recorded neural data after an experiment and could not have run in real time. Does this model explain the neural activity?  
     - (a) Yes—it captures patterns that simpler models miss.  
     - (b) No—it’s a descriptive summary, not a mechanistic explanation.  
     - (c) It explains some aspects (e.g., data trends) but not real-time causality.  

  5. **Neuron Replacement Case**: Neurons are replaced one-by-one with artificial devices matching their input-output timing and metabolic exchange. If the system’s behavior stays the same, does this show neurons were implementing a computation?  
     - (a) Yes—the artificial devices are computational, so the neurons must have been too.  
     - (b) No—neurons may have non-computational properties (e.g., biochemical signaling) missed by timing alone.  
     - (c) It supports seeing neurons as computational, but doesn’t prove it.  

  6. **Multiple Levels Case**: The same neural preparation is described computationally at three levels: spikes, dendritic compartments, and the whole animal in its environment. Are all descriptions valid?  
     - (a) Yes—computation is multi-level and context-dependent.  
     - (b) No—only one level (e.g., spikes) captures the “real” computation.  
     - (c) They are descriptions, but only some (e.g., spikes) are truly computational.  

  7. **CPG Case**: A central pattern generator (CPG) has continuous state variables where timing is essential. Any digital program describing it would be a discretization artifact. Is the CPG computing?  
     - (a) Yes—digital models approximate it well enough.  
     - (b) No—computation requires discrete states; this is analogue dynamics.  
     - (c) Yes, but as an analogue computer (no discretization needed).  

  8. **Biophysical Explanation Case**: A circuit is fully explained in biophysical/energetic terms (e.g., ion channels, metabolism) with no computational vocabulary. Is this explanation complete?  
     - (a) Yes—everything reduces to biophysics.  
     - (b) No—it misses the computational function (e.g., what the circuit “does”).  
     - (c) It’s complete for mechanisms, but not for functional roles.  

  9. **Aboutness Case**: For a physical system to compute, must it be “about” something (i.e., have representational content)?  
     - (a) Yes—computation inherently involves representing content.  
     - (b) No—computation is just causal/functional organization.  
     - (c) Only if a user assigns content (e.g., in designed systems).  

  10. **Falsifiability Case**: Can a computational description of a neural circuit be falsified by neural data?  
      - (a) Yes—if predictions fail (e.g., wrong output for given input).  
      - (b) No—any system can be described computationally; it’s unfalsifiable.  
      - (c) Only if the mapping between physics and computation is specified.  

  ---

  #### Scoring Key  
  First, tally your **sub-scores (A, B, C)** using this guide. Then, find your **position (leaf)** based on your answer pattern. Positions are grouped by their (A, B, C) combination. Unoccupied combinations are noted.  

  **Sub-Score Guide**:  
  - **A (Literal computation in tissue)**:  
    - Lean **Yes** if: Q1=a/c, Q2=a, Q5=a, Q7=a/c, Q9=b.  
    - Lean **No** if: Q1=b, Q2=b/c, Q5=b, Q7=b, Q9=a/c.  
  - **B (Explanatory work beyond biophysics)**:  
    - Lean **Yes** if: Q3=b/c, Q4=a/c, Q6=a, Q8=b/c, Q10=a/c.  
    - Lean **No** if: Q3=a, Q4=b, Q6=b/c, Q8=a, Q10=b.  
  - **C (Cognition constitutively computational)**:  
    - Lean **Yes** if: Q1=a/c, Q4=a, Q6=a, Q9=a/b, Q10=a.  
    - Lean **No** if: Q1=b, Q4=b/c, Q6=b/c, Q9=c, Q10=b/c.  

  *Note: Sub-scores are tendencies, not strict binaries. Use your overall lean (majority of indicators) for A/B/C. If split, choose the dominant trend.*  

  **Position (Leaf) Mapping**:  
  Find your (A, B, C) combination below. Then, match your answers to the typical patterns for positions in that group. Positions with overlapping patterns are marked with †.  

  1. **Combination: (A=Yes, B=Yes, C=Yes)**  
     - **Representational computationalism about cognition**: Computation requires representation (Q9=a), and cognition is inherently computational. Rejects “trivial” cases (Q1=b, Q2=b).  
     - **Mechanistic computationalism without representations**: Computation is non-representational (Q9=b), and biophysics alone is incomplete (Q8=b/c). Distinguish from representational via Q9.  
     - **Analogue or hybrid computationalism**: Computation can be analogue (Q7=c), and digital models may approximate (Q7=a/c). Often accepts multi-level descriptions (Q6=a).  
     - **Computationalism extended across brain, body, and world**: Computation spans brain, body, and environment (Q5=a, Q6=a). Rejects “brain-bound” views (Q6=b/c).  
     - *Overlap†: These four share (Y,Y,Y) and may overlap on Q6, Q7, or Q8. Q9 distinguishes representational vs. non-representational.*  

  2. **Combination: (A=Yes, B=Yes, C=No)**  
     - **Brain computes, nothing about mind follows**: Neural computation is real (Q5=a, Q7=a/c), but cognition is non-computational (e.g., Q4=b/c, Q6=c, Q9=c).  

  3. **Combination: (A=Yes, B=No, C=No)**  
     - **Deflationary view (pancomputationalism)**: Everything computes trivially (Q1=a, Q2=a/c, Q10=b), so it explains nothing (B=No) and cognition is not specially computational (C=No).  

  4. **Combination: (A=No, B=Yes, C=No)**  
     - **Instrumentalist or fictionalist view**: Computational models are useful fictions (Q3=c, Q4=a/c, Q10=c), but not literal (A=No). Cognition isn’t inherently computational (C=No; Q4=b/c, Q6=c).  

  5. **Combination: (A=No, B=No, C=No)**  
     - **Anti-computationalism about neural mechanisms**: Computation is absent or trivial (Q1=b, Q2=b, Q5=b, Q7=b). Biophysics is sufficient (Q8=a).  
     - **Dynamical or embodied alternative**: Systems are dynamical (Q7=b), not computational (A=No). Models add nothing (B=No; Q3=a, Q4=b). Cognition is embodied (Q6=c).  
     - *Overlap†: These share (N,N,N). Distinguish via Q7 (b for dynamical) or Q8 (a for anti-computationalism).*  

  6. **Unoccupied Combinations (and why)**:  
     - **(A=Yes, B=No, C=Yes)**: Incoherent—if computation explains nothing (B=No), it can’t be constitutive of cognition (C=Yes).  
     - **(A=No, B=Yes, C=Yes)**: Incoherent—if cognition is inherently computational (C=Yes), but neural tissue isn’t (A=No), what implements it?  
     - **(A=No, B=No, C=Yes)**: Unattractive—if computation explains nothing (B=No) and tissue doesn’t compute (A=No), cognition can’t be computational.  

  **Dropped Case**: The "two candidate programs that agree on every testable prediction" case was omitted. It fails to discriminate—all positions except deflationism treat unfalsifiability negatively (via Q10).

  ---

  #### Instructor’s Note  
  **Purpose**: This instrument tests whether the debate collapses three separable questions (A, B, C). It does not presuppose an answer but structures exploration.  

  **Settled vs. Contested Issues**:  
  - **Settled**:  
    - Computational models *can* predict neural data (B’s possibility is uncontested).  
    - Not all computation requires representation (per Q9 options).  
  - **Contested**:  
    - Whether neural computation is literal (A) or descriptive (core of the debate).  
    - Whether cognition is constitutively computational (C) or merely modelled as such.  
    - Whether discrete states are necessary for computation (per Q7).  
  - **Framing Note**: The three-way (A, B, C) split embeds a contested choice—it assumes these are independent. Critics argue A/B/C are entangled (e.g., if B=No, A is trivial).  

  **Position Notes**:  
  - **Actually defended positions**: Representational computationalism, mechanistic computationalism, analogue/hybrid computationalism, extended computationalism, deflationary view, instrumentalism, anti-computationalism, dynamical alternative.  
  - **Reconstructed for completeness**: "Brain computes, nothing about mind follows" (rarely defended explicitly).  
  - **Overlaps marked**: Representational vs. mechanistic computationalism (distinguished by Q9); anti-computationalism vs. dynamical (distinguished by Q7/Q8).  

  **Usage**: In a 50-minute class, have students answer questions (5–10 mins), self-score (5 mins), then discuss grouped positions (e.g., all (Y,Y,Y) views) to highlight nuances. Focus on why unoccupied combinations are untenable.
