  2. **Valley Case**: A valley's drainage pattern is used by hydrologists to read off solutions to a differential equation. Is the valley computing?
     - (a) Yes, because it is solving the equation.
     - (b) No, the valley is just a physical system; the computation is in the hydrologist's mind.
     - (c) The valley is computing only if we include the hydrologist as part of the system.

  3. **Two Programs Case**: A neural circuit is equally well described by two formally incompatible programs. What does this imply?
     - (a) The circuit is not really computing; the programs are just tools.
     - (b) The circuit is computing, but the description is underdetermined; both are valid.
     - (c) The circuit is computing, but at a level of abstraction higher than either program.

  4. **Post-Hoc Model Case**: A model is fitted to neural data after the fact and cannot run in real time. Does this model explain the neural activity?
     - (a) Yes, because it captures the data.
     - (b) No, because it is not a mechanistic model and cannot run forward.
     - (c) It is explanatory, but not as a real-time process.

  5. **Neuron Replacement Case**: If replacing neurons with artificial devices that match input-output and metabolic exchange leaves behavior unchanged, does this show the brain is computational?
     - (a) Yes, because the artificial device is computational and it does the same job.
     - (b) No, because the brain might be doing more than input-output.
     - (c) It shows the brain can be seen as computational, but not that it is.

  6. **Multiple Levels Case**: A neural preparation is described computationally at spike, dendritic, and whole-animal levels. Are these descriptions all valid?
     - (a) Yes, computation is multi-level.
     - (b) No, only one level (e.g., spikes) is truly computational.
     - (c) They are descriptions, but only some are truly computational.

  7. **CPG Case**: A central pattern generator with continuous state variables and essential timing. Can a digital program describe it without being a discretization artifact?
     - (a) Yes, because we can discretize without losing essential features.
     - (b) No, digital computation is inadequate for analogue systems.
     - (c) It can be described by an analogue computation.

  8. **Biophysical Explanation Case**: A circuit is explained entirely in biophysical terms. Is this explanation complete?
     - (a) Yes, because the circuit is just biophysical.
     - (b) No, because the function (what it does) is missing.
     - (c) It is complete for the mechanism, but not for the function.

  9. **Aboutness Case**: Must a computation be about something (have representational content)?
     - (a) Yes, computation inherently involves representation.
     - (b) No, computation is just formal symbol manipulation.
     - (c) Only if there is a user or designer.

  10. **Falsifiability Case**: Can a computational description be falsified by neural data?
      - (a) Yes, if the outputs don't match.
      - (b) No, because any system can be described as computing something.
      - (c) Only if the mapping is specified.

