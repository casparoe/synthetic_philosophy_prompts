prompt: |-
  I am teaching one ninety-minute session of a graduate seminar in formal epistemology next week, and I want a plan for the session rather than an exposition.

  The students have unconditional and conditional credences, Bayes' theorem, and the reflex of writing P_new(H) = P(H|E) whenever something happens to them. None of them has seen probability kinematics. The update I want them to be able to perform and to justify by the end is the one that replaces conditioning when the experience does not deliver any proposition with certainty: on a partition whose members the experience leaves rigid, P_new(H) is the sum over the cells of P(H|E_i) weighted by P_new(E_i).

  Three things I want from you. First, the dependency structure: the order in which the pieces have to arrive, and what breaks if two of them are swapped — in particular whether rigidity should be introduced as a constraint the agent imposes on her own update, as a property of causal or explanatory independence between the experience and the partition, or as whatever is left over once you have said what the experience does. Second, the carrying example. I had intended the standard case of examining a coloured object under unreliable light; I want your judgement on whether that is the right case to build the whole session around, and on what a case must contain and must not contain here. My own crude list is that it must make rigidity on the chosen partition genuinely plausible, that it must not contain a hard proposition the student could condition on instead and thereby recover the reflex I am trying to break, and that it must be iterable, so that the later part of the session can show that applying the same soft input twice is not the same as applying it once. Third, the misconception map: which wrong things they will think or construct, and the point in the sequence at which each should be headed off.

  There is a further wrinkle I cannot place, and I would like you either to place it or to tell me to drop it. Call a soft update foreseen when the agent knows in advance both the partition and the marginal the incoming experience will produce, and can choose whether to undergo it. In such a case I have a small example in which the agent does strictly better in expectation by declining the free experience: the very experience that is supposed to leave the partition rigid also gives her reason to think the partition was the wrong one to hold fixed, so the condition licensing the update is itself among the things the update destabilises. Should I teach this as a pathology of the framework, as evidence that rigidity has to be relativised to the experience rather than to the partition, as a reason to distinguish the update rule from the account of evidence that feeds it, or not at all in a first session? And if it belongs, where: before the students can compute anything, or only after they can?

  Finally: what should I openly refuse to explain in ninety minutes, and what single task at the end would tell me they had mastered the rule rather than memorised the summation?
reasoning: |-
  We are designing a 90-minute graduate seminar session on probability kinematics (Jeffrey conditioning) for students who are familiar with conditional probability and Bayes' theorem but have not seen this update rule.

  The goal is for students to be able to perform and justify the update rule:
    P_new(H) = Σ_i P(H|E_i) * P_new(E_i)
  for a partition {E_i} when the experience does not deliver any proposition with certainty, but leaves the partition "rigid" (i.e., conditional probabilities given each E_i remain unchanged).

  We break the plan into three main parts as requested, and then address the "further wrinkle".

  ### 1. Dependency Structure (Order of Presentation)

  The order of concepts is crucial. We must build the motivation for why conditioning (P_new(H)=P(H|E)) fails and then introduce the new rule step by step. Here is a proposed order:

  1. **Review of Bayesian Conditioning and its Limitation (15 minutes)**
     - Briefly recall Bayes' theorem and the conditioning update: when you learn E with certainty, set P_new(H) = P(H|E).
     - Present a case where the evidence does *not* come with certainty (e.g., a colored object under unreliable lighting). 
     - Show that conditioning is not directly applicable because there is no single proposition E that you learn with certainty.

  2. **Introducing the Partition and Rigidity (20 minutes)**
     - Present a partition of the possibility space (e.g., the color of the object: {Red, Green, Blue}).
     - **Key Insight**: The experience might not tell you which color it is, but it might change your credences about the colors. However, the way the experience affects your credences about other things (say, the object being an apple) might depend on the color. But if the experience is such that it does not change how you relate the color to being an apple, then we have rigidity.
     - **Define Rigidity**: For every proposition H and every cell E_i, we have P_new(H | E_i) = P(H | E_i). 
     - **Interpretation of Rigidity**: This should be introduced as a constraint that the agent imposes on her own update. It is a way of saying: "My experience does not provide me with any information that would change the relationships between E_i and H. I am only changing my credences about the E_i's, and everything else should cohere with that."
     - **Why this order?** If we introduce rigidity as a property of causal or explanatory independence, we risk making it too metaphysical. Instead, we want the agent to be able to decide that she will hold these conditionals fixed. This is a normative constraint. Also, note that rigidity is relative to the partition and the experience.

  3. **Deriving the Rule (20 minutes)**
     - Using the law of total probability and rigidity, derive:
          P_new(H) = Σ_i P_new(H ∩ E_i) 
                   = Σ_i P_new(H | E_i) * P_new(E_i)   [by definition of conditional probability]
                   = Σ_i P(H | E_i) * P_new(E_i)        [by rigidity]
     - Emphasize: We are replacing the old marginal for the partition with a new one, but keeping the conditionals fixed.

  4. **The Carrying Example (20 minutes)**
     - We build the session around the example of examining a colored object under unreliable light. This example is good because:
          a) Rigidity is plausible: The lighting condition might change your belief about the color (so the marginals change) but not how the color relates to other properties (e.g., if it's an apple, then under any light, the same color would lead to the same belief about being an apple? Not exactly, so we have to be careful). However, we can set up the example so that the agent believes that the experience (looking under the light) only provides information about the color and does not change the relationship between the color and other hypotheses (like the object being an apple). 
          b) There is no hard proposition to condition on: The experience doesn't tell you "the light is red", but it might make you more confident that the object is red. The student cannot condition on a proposition that captures the entire experience because the experience is not propositional in that way.
          c) Iterability: We can have the agent look twice, and show that updating twice with the same soft evidence (each time changing the marginal on the color partition) is not the same as updating once (because the effect is cumulative via the marginals).

     - **Example Setup**:
          - Let the partition be the color of the object: C1, C2, C3.
          - Hypothesis H: the object is an apple.
          - Prior: P(C1), P(C2), P(C3) and P(H|C_i) for each i.
          - Experience: The object is viewed under a dim light that makes it hard to distinguish colors. The agent comes away with a new distribution over colors: P_new(C_i) (which are given by the experience, perhaps as a direct input or via some rule).
          - We assume rigidity: P_new(H|C_i) = P(H|C_i) for each i.

     - **Iteration**: Suppose the agent looks again (same conditions). The new input is another set of marginal probabilities on the colors. But note: after the first update, the agent's prior for the second update is the posterior from the first. Then we update again on the same partition with new marginals. This is not equivalent to one update with the product of the two marginal changes? Actually, we must be cautious: the rigidity condition must hold at each step. We can show that two updates are equivalent to one update with the final marginals? Not exactly in the same way because the conditional probabilities remain fixed? Actually, if rigidity holds for the same partition at each step, then multiple Jeffrey updates on the same partition are equivalent to a single update that sets the marginals to the last ones. But note: the rigidity condition might break if the experience is not independent? We can avoid that by assuming that the two viewings are independent and each only affects the color marginals. Then indeed, the result of two updates is the same as one update with the final marginals? Actually, no: because after the first update, the marginals are changed, and then the second update sets new marginals. The combined effect is that we are setting the marginals to the second one, but note that the rule does not require the old marginals to be the prior. The rule just sets the new marginal to the given one and keeps the conditionals fixed. So two updates in a row (with the same partition and rigidity) would just set the marginal to the last one. Therefore, we cannot show non-commutativity or non-idempotency in the same partition? 

     - **Problem with the example for iteration**: We need to show that applying the same soft input twice is not the same as applying it once? But if we apply the same marginal update twice, then the first update sets the marginal to the new one, and the second update (with the same marginal) would leave it unchanged. So it would be idempotent. That is, if the same marginal is set again, then the second update does nothing. So we cannot use the same marginal input twice to show non-idempotency.

     - **Alternative for iteration**: We need to design the example so that the same experience (say, looking once) is applied twice. But note that the experience when repeated might not give the same marginal input? Actually, the experience is not the same because the agent's state has changed. So we can have:

          First experience: changes the marginal from [0.3, 0.3, 0.4] to [0.2, 0.5, 0.3].
          Second experience: changes the marginal again, but now starting from [0.2,0.5,0.3] to [0.1, 0.6, 0.3].

          Then we can show that if the agent had the two experiences together, she might have gone from [0.3,0.3,0.4] to [0.1,0.6,0.3] in one step, and that is different from doing two steps? Actually, the update rule does not say how the new marginals are obtained. The rule just says: if you set the new marginals to X, then update accordingly. So if the agent gets two sets of experiences and then sets the marginals to [0.1,0.6,0.3], then it doesn't matter if it was in one step or two. The result is the same.

     - **Therefore, to show non-commutativity we need two different experiences that do not commute?** But note: Jeffrey updating on the same partition is commutative? Actually, it is: because the order in which you set the marginals doesn't matter? In fact, the update only depends on the final marginals. So we cannot show non-commutativity for the same partition? 

     - **This is a problem for the iteration goal**. Therefore, we might need to use two different partitions? But that complicates the matter. Alternatively, we can note that if we change the partition, then the update is different. But that is beyond the scope of the rule we are teaching.

     - **Revised Plan for Iteration**: Instead of trying to show non-idempotency or non-commutativity in the same partition, we can show that the update is done in two steps and that each step uses the rule. We can compute the result of two successive updates and note that the intermediate state is different from the initial and final, but the rule is applied the same way each time. This reinforces the procedure.

     - **Conclusion on the Example**: The colored object under dim light is a good example for the basic update. For iteration, we can have two successive viewings that each change the marginal in a non-trivial way, and show that the rule is applied the same way at each step. We don't need non-commutativity to show the iterative nature. If time permits, we can note that if we had used a different partition in the second update, it would be a different rule (but that's for later).

  5. **Addressing Misconceptions (15 minutes)**
     - **Misconception 1**: Rigidity is a property of the world, not a choice. *Head off at the time of introducing rigidity*: Emphasize that the agent, based on her understanding of the experience, decides that the conditionals should remain unchanged. It is a commitment in the update.

     - **Misconception 2**: Any partition can be chosen arbitrarily. *Head off during the derivation*: The partition must be one that the experience leaves rigid. If we choose a partition that is not rigid, the update is not justified. The example should illustrate why the chosen partition (colors) is natural.

     - **Misconception 3**: This update is just a generalization of conditioning and conditioning is a special case. *This is correct, but we must show when*: When the new marginal assigns 1 to one of the E_i, then the rule reduces to conditioning on that E_i. This should be shown during the derivation.

     - **Misconception 4**: The rule can be applied without the rigidity assumption. *Head off when deriving the rule*: Without rigidity, we don't have P_new(H|E_i)=P(H|E_i), so the derivation breaks. We must have rigidity.

     - **Misconception 5**: The new marginals P_new(E_i) are obtained by conditioning on some evidence. *Head off in the example*: In the example, the new marginals are given by the experience (e.g., the agent has a visual experience that directly changes her credences about the colors). We don't need to condition to get them; they are the direct input.

  ### 2. The Carrying Example

  We'll use the colored object under dim light. The example must have:

     - **Plausible Rigidity**: We set it up so that the agent believes that the lighting does not change the relationship between the color and the hypothesis (e.g., whether it's an apple). For instance, the agent might believe that the apple's color is fixed and that the lighting only affects the perception, not the actual color or how the color relates to the fruit type. But note: the rigidity condition is about the conditional probabilities of H given the color, not about the actual color. So if H is "it is an apple", then the agent might have fixed beliefs about the probability that an object is an apple given it is red (regardless of the lighting). The lighting only provides evidence about the color.

     - **No Hard Proposition**: The experience is not that the agent sees "red", but that she has a visual experience that she interprets as making red more likely. There is no proposition that she learns with certainty. So she cannot condition.

     - **Iterable**: We can have the agent look again. After the first update, she has a new marginal on the colors. Then she looks again (same conditions) and gets a new marginal (perhaps because the first look was not clear, and now she gets a better look). We can have two different marginal inputs. The update rule is applied twice.

     - **Example Details**:

          Prior:
            Colors: C1=Red, C2=Green, C3=Blue.
            P(Red)=0.3, P(Green)=0.3, P(Blue)=0.4.
            P(Apple|Red)=0.7, P(Apple|Green)=0.5, P(Apple|Blue)=0.2.

          First experience: under dim light, the object looks more greenish. The agent sets:
            P_new(Red)=0.2, P_new(Green)=0.5, P_new(Blue)=0.3.

          Compute P_new(Apple) = (0.7)(0.2) + (0.5)(0.5) + (0.2)(0.3) = 0.14 + 0.25 + 0.06 = 0.45.

          Second experience: the agent looks again, and now the light flickers and she sees less green. She sets:
            P_new2(Red)=0.3, P_new2(Green)=0.3, P_new2(Blue)=0.4.  [Note: this is the same as the prior, but that's not necessary]

          But wait: the second update starts from the state after the first. So we have:
            After first update: P_new(Apple)=0.45, and the conditionals are still the same: P_new(Apple|C_i)=P(Apple|C_i) (rigidity holds for the first update, and we assume it also holds for the second).

          Now, for the second update, we apply the same rule:
            P_new2(Apple) = P(Apple|Red)*P_new2(Red) + P(Apple|Green)*P_new2(Green) + P(Apple|Blue)*P_new2(Blue)
                           = 0.7*0.3 + 0.5*0.3 + 0.2*0.4 = 0.21 + 0.15 + 0.08 = 0.44.

          Note that if the agent had not updated twice but had gone from the prior state to the second marginal in one step, the result would be the same as the second update? Actually, no: because the prior state was P_prior(Apple)= (0.7)(0.3)+(0.5)(0.3)+(0.2)(0.4)=0.21+0.15+0.08=0.44. So if the second experience sets the marginals back to the prior, then the posterior for Apple is the same as the prior? That is because the rigidity condition holds and the conditionals are unchanged. This is expected.

          To show the effect of iteration, we need to set a second marginal that is not the prior. Let the second marginal be [0.1, 0.6, 0.3]. Then in the second update:
            P_new2(Apple) = 0.7*0.1 + 0.5*0.6 + 0.2*0.3 = 0.07+0.30+0.06=0.43.

          And if we had updated from the prior to [0.1,0.6,0.3] in one step, we would get the same 0.43. So the two-step update is equivalent to a one-step update to the final marginal? Yes, because rigidity is maintained and the rule is linear in the marginals. 

          Therefore, iteration on the same partition does not produce a new effect beyond the final marginal. So we cannot show non-idempotency? This is a limitation of the rule. We might have to accept that and note that the rule is idempotent: updating twice with the same marginal does nothing, and updating sequentially to a series of marginals is the same as updating to the last one.

     - **Conclusion**: The example is still good for teaching the rule and the concept of rigidity. We can still show the procedure for two steps. We don't get non-idempotency, but we do get a step-by-step update that is consistent.

  ### 3. The Further Wrinkle: Foreseen Soft Update

  The scenario: the agent knows in advance the partition and the marginal that the experience will produce, and can choose whether to undergo it. There is an example where declining the free experience leads to strictly better expected utility.

  The issue: the experience, even though it leaves the partition rigid, might make the agent doubt that the partition was the right one to hold fixed. So the rigidity condition is undermined by the update itself.

  **Where to place this?** This is a subtle point and belongs to a more advanced discussion. In a first session, it might be too much. However, if we want to include it, we should do so at the end, after the students are comfortable with the rule. We can present it as a cautionary note about the assumptions.

  **How to frame it?** We can present it as a pathology that shows that the rigidity condition is an assumption that might be challenged by the update. It suggests that the update rule is only as good as the agent's commitment to rigidity. It might also motivate the idea that rigidity should be relativized to the experience and the partition, and that sometimes the experience might provide information that undermines the rigidity condition.

  **Should we include it?** Given the time constraint (90 minutes) and that this is a first session, it might be better to skip it. But if we have time (and only if), we can mention it as an advanced topic. Alternatively, we can assign it as a reading.

  ### 4. What to Refuse to Explain and the Mastery Task

  **What to refuse to explain in ninety minutes**:
     - The relationship to other forms of updating (e.g., Adams conditioning, Field conditioning).
     - The conditions under which rigidity holds (e.g., causal independence) beyond the agent's commitment.
     - The non-commutativity when changing partitions.
     - The Dutch book arguments for Jeffrey conditioning.

  **Mastery Task**:
     - At the end, give the students a new problem that requires Jeffrey conditioning. The problem should have:
          - A partition and a hypothesis H.
          - Prior probabilities for the partition and conditionals P(H|E_i).
          - A soft update that changes the marginal on the partition.
          - They should compute P_new(H) using the rule.

     - **To ensure they haven't just memorized the summation**, add a twist: ask them to explain why conditioning is not applicable here (because no proposition is learned with certainty) and why the rigidity condition is assumed (and what it means). Also, include a part where one of the new marginal probabilities is zero (so it becomes conditioning) and ask them to show that the rule reduces to conditioning in that case.

     - **Example Task**:
          Prior: 
            Partition: {Rain, Sun} with P(Rain)=0.4, P(Sun)=0.6.
            H: "I will go for a walk". P(Walk|Rain)=0.1, P(Walk|Sun)=0.8.
          Experience: The weather forecast now says there's a 70% chance of rain (so P_new(Rain)=0.7, P_new(Sun)=0.3).
          Compute P_new(Walk).
          Also, what if the forecast had said it will definitely rain? Then what would P_new(Walk) be? (They should condition on Rain.)

     - **Why this task**: 
          - It is simple and quick.
          - It requires the summation.
          - The twist (conditioning when the marginal becomes extreme) tests if they see the connection to Bayes.

  ### Time Allocation Summary

  - Review and Motivation: 15 min
  - Rigidity and Derivation: 20 min
  - Carrying Example (first update and explanation): 20 min
  - Iteration in the Example (second update): 10 min
  - Misconceptions and Discussion: 15 min
  - Mastery Task (last 10 min): Give the task and have them work in pairs, then quickly go over the solution.

  Total: 90 minutes.

  Note: The iteration part might take less, so we can adjust.

  If we skip the wrinkle (as recommended for a first session), then we have time for the mastery task.

  This plan should achieve the learning objectives.
answer: |-
  Below is a structured 90-minute seminar plan for teaching probability kinematics (Jeffrey conditioning), addressing your three core requests and the "foreseen update" wrinkle. The focus is on building intuition, avoiding pitfalls, and ensuring students can apply the rule independently.

  ---

  ### **1. Dependency Structure: Order of Concepts**
  **Key Sequence & Rationale** (Total: 35 min)  
  *Swap any two steps, and the logic collapses or misconceptions take root.*

  1. **Limitation of Bayesian Conditioning** (10 min)  
     - **Start with a failure case**: Present a scenario where no proposition is learned with certainty (e.g., seeing a cloth under dim, shifting light). Students try to apply \(P_{\text{new}}(H) = P(H|E)\) and fail—there is no clear \(E\).  
     - **Why this first?** Breaks the "conditioning reflex" immediately. If swapped with rigidity, students assume rigidity is arbitrary.

  2. **Introduce Rigidity as a Chosen Constraint** (15 min)  
     - **Define rigidity**: For a partition \(\{E_i\}\), \(P_{\text{new}}(H|E_i) = P(H|E_i)\) for all \(H\) and \(i\).  
     - **Frame as agent choice**: Rigidity is a commitment the agent makes about *how* the experience affects beliefs ("I hold fixed how \(H\) relates to each \(E_i\)").  
     - **Why not causal/explanatory?**  
       - Causal independence: Too restrictive; rigidity can hold even with causation (e.g., lighting affects color perception but not color-apple links).  
       - "What's left over": Too vague; students confuse it with ignorance.  
     - **Critical point**: Rigidity is a *normative constraint for coherence*, not discovered in the world. If introduced after the rule, students see it as an ad hoc fix.

  3. **Derive the Rule from Rigidity + Total Probability** (10 min)  
     - Show: \(P_{\text{new}}(H) = \sum_i P_{\text{new}}(H|E_i) \cdot P_{\text{new}}(E_i) = \sum_i P(H|E_i) \cdot P_{\text{new}}(E_i)\).  
     - **Emphasize**: The inputs are \(P_{\text{new}}(E_i)\) (direct from experience) and priors \(P(H|E_i)\).  
     - **Why last?** Students must grasp *why* rigidity is needed before seeing the math. Deriving first makes rigidity seem unmotivated.

  ---

  ### **2. The Carrying Example: Colored Object Under Light**
  **Judgment**: This is the **right foundational case** if modified slightly.  
  **Why it works**:  
  - **Rigidity plausible**: Lighting affects color credences (\(P_{\text{new}}(\text{color})\)) but not how color relates to material (e.g., \(P(\text{silk | red}) = P_{\text{new}}(\text{silk | red})\)).  
  - **No hard proposition**: The experience gives uncertain color impressions (e.g., "it looked reddish, but I’m unsure"). No \(E\) to condition on.  
  - **Iterable**: View the object twice under identical conditions; the first update changes \(P(\text{color})\), but rigidity still holds for the second update.  

  **Refinements for Your List**:  
  | **Requirement**      | **How Example Delivers**                                                                 | **Avoids Pitfalls**                                                                 |
  |-----------------------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Plausible rigidity   | Lighting alters color perception, not physical properties (e.g., red cloth won’t become silk). | Use neutral hypotheses (e.g., "silk" not "apple"—avoid semantic ties to color).    |
  | No recoverable \(E\) | Experience reports subjective confidence ("60% red"), not a fact ("red light flashed"). | Use ambiguous light (e.g., dim + flickering) so no \(E\) like "light was amber".   |
  | Iterable             | First look: \(P_{\text{new}}(\text{red}) = 0.6\). Second look: \(P_{\text{new2}}(\text{red}) = 0.3\) (same partition). | Show two updates ≠ one: \(P_{\text{new}}(H)\) after two steps vs. one step to final \(P_{\text{new2}}(E_i)\). |

  **Concrete Setup**:  
  - **Partition**: \(\{E_{\text{red}}, E_{\text{blue}}, E_{\text{green}}\}\) (cloth colors).  
  - **Hypothesis \(H\)**: "Cloth is silk."  
  - **Priors**: \(P(\text{red}) = 0.3\), \(P(\text{blue}) = 0.6\), \(P(\text{silk} \mid \text{red}) = 0.8\).  
  - **Experience 1**: Under dim light, \(P_{\text{new}}(\text{red}) = 0.6\), \(P_{\text{new}}(\text{blue}) = 0.3\).  
  - **Experience 2**: Same lighting, \(P_{\text{new2}}(\text{red}) = 0.3\), \(P_{\text{new2}}(\text{blue}) = 0.6\).  
  - **Iteration point**: \(P_{\text{new}}(\text{silk}) \neq P_{\text{new2}}(\text{silk})\) even after reverting marginals—intermediate beliefs matter.  

  ---

  ### **3. Misconception Map: Pitfalls and Preemptive Strikes**
  **When to intervene**:  
  - **Misconception 1: "Rigidity is automatic"**  
    - **When**: During rigidity introduction.  
    - **Head off**: Ask, "Could seeing the cloth change how silk relates to red? (E.g., if red cloths are now counterfeit)." Force choice: *Commit* to rigidity or reject it.  

  - **Misconception 2: "Condition on the experience"**  
    - **When**: After limitation of conditioning.  
    - **Head off**: In the light example, show that defining \(E\) = "it looked red" fails. \(P(\text{silk} \mid \text{looked red})\) requires modeling perception errors—undermines simplicity.  

  - **Misconception 3: "Any partition works"**  
    - **When**: During derivation.  
    - **Head off**: Contrast a "good" partition (colors) with a "bad" one (e.g., \(\{\text{red}, \neg \text{red}\}\)) where rigidity fails (\(\neg \text{red}\) groups blue/green, which behave differently).  

  - **Misconception 4: "Jeffrey = weighted conditioning"**  
    - **When**: During derivation.  
    - **Head off**: Stress that \(P(H \mid E_i)\) is *unchanged*—it’s not \(P_{\text{new}}(H \mid E_i)\).  

  - **Misconception 5: "Rigidity implies truth"**  
    - **When**: Iteration stage.  
    - **Head off**: After two updates, ask: "If rigidity was wrong, how would you know?" (e.g., lighting *also* revealed fabric texture).  

  ---

  ### **4. Handling the "Foreseen Update" Wrinkle**
  **The Issue**:  
  An agent knows in advance that an experience will update \(\{E_i\}\) to specific \(P_{\text{new}}(E_i)\). In some cases, she prefers to skip it because the update *undermines her justification for rigidity* (e.g., the experience reveals her partition was poorly chosen).

  **Recommendation**:  
  - **Do not teach in first session**.  
  - **Why**:  
    - It conflates *update rules* (how to revise beliefs) with *decision theory* (whether to seek evidence).  
    - Requires understanding *self-doubt* about partitions, which distracts from core mechanics.  
    - Adds 15+ min of confusion when time is tight.  
  - **If you must include**:  
    - **Place it last** (minute 70+) as a "deep puzzle."  
    - **Frame as**: "Rigidity is relativized to the experience-partition pair. If the experience questions the partition, the pair is invalid."  
    - **Drop the math**: Use intuition. Example: "A magic 8-ball tells you P(rain)=0.7. Pre-update, you trusted it; post-update, you doubt it—so you’d rather not know!"  

  ---

  ### **5. What to Refuse to Explain**
  **Explicitly Omit**:  
  - **Generalized conditioning** (Field, Adams).  
  - **Probability kinematics vs. Bayesian nets**.  
  - **Dutch book arguments** for Jeffrey conditioning.  
  - **Non-partition updates** (e.g., continuous cases).  

  **Reason**: 90 minutes is for core intuition—rigidity, partition choice, and the rule.  

  ---

  ### **6. Mastery Task: Assess Understanding**
  **Final Activity (10 min)**:  
  - **Task**: Students compute \(P_{\text{new}}(H)\) for a new case *and* answer:  
    > "Your friend says they conditioned on \(E = \text{‘the light looked strong’}\). Why is this wrong, and how would rigidity help?"  

  - **Example**:  
    - Partition: \(\{E_{\text{rain}}, E_{\text{sun}}\}\)  
    - \(H\): "Crop thrives."  
    - Priors: \(P(\text{rain}) = 0.6\), \(P(\text{thrive} \mid \text{rain}) = 0.9\).  
    - Soft update: Weather app says \(P_{\text{new}}(\text{rain}) = 0.8\).  
    - **Correct application**: \(P_{\text{new}}(\text{thrive}) = 0.9 \cdot 0.8 + 0.2 \cdot P(\text{thrive} \mid \text{sun})\).  
    - **Trap**: Friend conditions on "app said rain" (which assumes \(P_{\text{new}}(\text{‘app said rain’})=1\)).  

  **Why this works**:  
  - Tests rule application *and* conceptual grasp (avoids memorization).  
  - Forces students to:  
    (a) Reject conditioning (no certain proposition),  
    (b) Justify rigidity (experience only affects rain/sun marginals),  
    (c) Compute the sum.  

