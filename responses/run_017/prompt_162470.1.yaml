  ### **Timeline**
  - **0:00–0:15**: Conditioning fails (colored cloth example).  
  - **0:15–0:35**: Rigidity as a choice + derivation.  
  - **0:35–0:55**: Carrying example (compute first update, then second, show iteration ≠ single).  
  - **0:55–1:10**: Misconceptions + Q&A.  
  - **1:10–1:20**: Mastery task (individual/pairs) + quick review.  
  - **1:20–1:30**: Foreseen update wrinkle (if included, else extend Q&A).  

  This plan ensures students emerge able to apply, justify, and debug Jeffrey conditioning—breaking the conditioning reflex while respecting constraints.
