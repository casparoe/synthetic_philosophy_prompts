prompt: |-
  I am putting together a lecture on the methodological critique of evolutionary psychology — the charge that its explanations are unfalsifiable narratives invented to fit whatever behavior happens to have been observed — and I want a case that runs in the other direction: an adaptationist hypothesis that a careful skeptic should concede is doing genuine scientific work, even though it displays every formal vice on the critics' list. So I would like you to build me one.

  Take the following as stipulated findings from a single large, preregistered, multi-site study. I have invented them for the purposes of the exercise; treat them as given rather than as claims to check or to reconcile with the literature. Adults sleep measurably worse on the first night in an unfamiliar bedroom than on the second night in that same room, and worse than in their own bedroom. The size of the deficit tracks the novelty of the room — its layout and soundscape — and is unaffected by the room's comfort, temperature, and noise level. It is not reduced by giving subjects credible and true information that the room is perfectly safe, and it is unrelated to how safe they report feeling. It is much smaller in adults who slept in a large number of different rooms during childhood. It is asymmetric: on that first night one hemisphere responds more strongly than the other to unfamiliar sounds, and the asymmetry is absent on the second night and at home. And it appears with roughly the same magnitude in samples from five countries whose actual night-time risks differ enormously.

  Now invent, strictly after the fact, an adaptationist explanation of exactly this pattern, subject to the following constraints. State the mechanism as an input-output rule together with an explicit error-management trade-off, in information-processing terms: no invented neuroanatomy, no fictional technology, no imagined fossil or archaeological discoveries. Do not rescue it by claiming that selection is powerful, or that complex functional organization must have an adaptive explanation; whatever earns the hypothesis its standing has to be a structural feature it possesses, not the adaptationist assumption itself. Do not reach for the standard parade of examples — no kin selection, reciprocity, mate choice, pathogen avoidance, or cheater detection. Every confirmatory test must be one a well-equipped laboratory could run this decade. And the case must be one in which the skeptic retains a real objection: I want a hypothesis that is good science, not one that has been stipulated to be immune.

  Give me exactly five numbered points, no more than two sentences each, with no preamble and no closing summary.

  1. The hypothesis, stated as an input-output rule with its error-management trade-off, including why the mechanism's failure to take safety information as an input is a prediction rather than an embarrassment.
  2. At least two consequences it has that go beyond the stipulated findings, that the obvious alternative — discomfort, stress, or general hyperarousal — does not yield, and that could be tested now.
  3. Why each of the three standing objections fails to land on this hypothesis in particular: that it was generated after the fact to fit data already in hand; that there is no evidence about ancestral environments; and that some other story, including a by-product story, could always be told instead.
  4. The single feature doing the work: name it, and show that deleting it while leaving everything else in place turns the hypothesis back into the kind of story the critics are right to dismiss.
  5. The strongest objection a skeptic who grants all of the above should still press, together with the most honest reply available, including a statement of what would refute the hypothesis.
reasoning: |-
  Okay, let me approach this systematically. The user wants a case study demonstrating rigorous adaptationist methodology in evolutionary psychology that counters common critiques of unfalsifiability. They've provided specific fictional data about the "first-night effect" in sleep patterns across cultures and developmental backgrounds.

  First, I need to construct an adaptationist hypothesis that meets all five constraints. The core challenge is designing an input-output rule with clear error-management tradeoffs that explains why safety information doesn't override the response. I'm considering a "threat-monitoring asymmetry" mechanism where one hemisphere remains alert in novel environments - this naturally explains the unilateral neural response observed.

  For unique predictions beyond the given data, I'm focusing on specialized sensory processing differences between hemispheres that wouldn't occur under general stress theories. The key is identifying testable neural markers that would only make sense under this specific adaptive logic.

  Addressing the standard critiques: The after-the-fact concern is mitigated by novel predictions; ancestral uncertainty is bypassed because the mechanism's current design reveals its function; alternative explanations fail because they can't explain the precise asymmetry pattern without invoking arbitrary complexity.

  The indispensable feature seems to be the unilateral implementation - remove that and it collapses into just-so storytelling. But I must preserve the skeptic's strongest counter: perhaps this is merely an unavoidable byproduct of slow-wave sleep needing partial alertness. The honest reply would be that sleep architecture varies widely across species, so we'd need comparative tests in animals with different neural lateralization.

  Throughout this, I'm ensuring every element ties back to testable predictions using current methods like EEG and behavioral assays. The hypothesis must stand on its structural merits, not just adaptationist assumptions.
answer: |-
  1. Hypothesis: Input: novel environmental signatures (spatial/sonic). Output: unilateral hemispheric alertness (reduced sleep depth) during slow-wave sleep. Trade-off: Over-prioritizing threat detection in unfamiliar settings (high false alarm cost: sleep disruption) over vulnerability to undetected threats (higher miss cost: injury/death). Safety information isn't an input because ancestral threats (predators, hostile conspecifics) often persisted despite apparent safety, making sensory novelty a more reliable initial cue.  

  2. Novel predictions: (a) The hyperalert hemisphere will show enhanced processing of *low-level* novel sounds (e.g., unexpected pure tones) but *not* complex threats (e.g., growls), unlike general stress. (b) Disrupting interhemispheric inhibition during sleep (via targeted TMS) on night one eliminates the asymmetry *and* the sleep deficit, which wouldn't occur under general hyperarousal.  

  3. Objection rebuttals:  
     - *After-the-fact*: It generates unique, risky predictions (#2) absent from the original data.  
     - *Ancestral ignorance*: The mechanism’s specific design (unilateral, novelty-triggered, safety-cue insensitive) reveals its function directly, irrespective of ancestral specifics.  
     - *Alternative stories*: No non-adaptive by-product (e.g., general stress) explains the *asymmetry*’s precision, developmental calibration, or cross-cultural persistence despite varying risk.  

  4. Key feature: **Unilateral implementation**. Delete this (e.g., propose bilateral alertness), and the asymmetry data becomes unexplained; the hypothesis reverts to an untestable "vigilance" story with no unique constraints.  

  5. Strongest objection: *This could be an unavoidable neurodevelopmental by-product of slow-wave sleep requiring partial alertness for state stability, not an adaptation.* Honest reply: True, but the specific, switchable asymmetry calibrated by childhood experience implies dedicated circuitry. Refutation: Finding the effect in species without unihemispheric sleep or showing it impairs, not stabilizes, sleep architecture.
