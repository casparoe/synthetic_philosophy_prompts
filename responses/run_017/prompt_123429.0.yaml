prompt: |-
  I retired a few years ago from a research career in geophysics and have since been sitting in on a philosophy reading group. Formal epistemology is the part I find most congenial, since it looks like the sort of thing one ought to be able to settle by calculation. I have become stuck on an argument I built myself about updating on uncertain evidence, and I would be grateful for a diagnosis.

  The setting, as I understand it: strict conditionalization requires certainty in the evidence, which no perceptual episode supplies; the usual generalization is probability kinematics. Relative to a partition with cells E₁ … Eₙ, rigidity requires the new credence function to satisfy P*(H | Eᵢ) = P(H | Eᵢ) for each cell, from which the kinematic formula P*(H) = Σᵢ P*(Eᵢ)·P(H | Eᵢ) follows. My argument:

  (1) No observation leaves me certain of any proposition about the world; at best it redistributes my credence across some partition of possibilities. So the operative rule for empirical learning is probability kinematics, and strict conditionalization is an idealization with no actual instances.

  (2) The content of that rule is supposed to lie in rigidity: experience supplies the partition and the new marginals over it, and rigidity then fixes everything else.

  (3) Now take any two credence functions P and P* on a finite space of worlds, with P positive everywhere and P* positive only where P is. Define r(w) = P*(w)/P(w), and let the partition be the level sets of r.

  (4) On each such cell rigidity holds exactly, since r is constant there; and applying the kinematic formula to that partition and those new marginals returns P* itself.

  (5) So for any reassignment of credence whatsoever, however arbitrary or unresponsive to experience, there is a partition on which it counts as a textbook-correct kinematic update, namely the level sets of the ratio of the new function to the old.

  (6) Therefore probability kinematics constrains nothing. It is a rule with no content: every possible change of mind is an instance of it.

  (7) That is absurd, and the construction plainly fails for strict conditionalization, since conditioning on E forces P*(E) = 1. So either (1) is false and I must find propositions that experience makes certain, or the constraint I thought lived in rigidity lives somewhere else entirely.

  I am fairly confident in the algebra and fairly confident that the conclusion is false, so the fault must be in how I am reading the rule. My one instinct is that something is wrong with a partition defined partly in terms of the very posterior it is meant to yield, and that no experience could naturally be described as bearing on such a partition. But I cannot say why that should matter to a rule stated as a constraint over partitions, nor what would have to be added for it to matter.

  Which step do you reject, and what does rejecting it cost? If it comes to a choice, I would rather give up almost anything than (1), and I would also like to know whether whatever saves the rule from vacuity is a real constraint or only a relabeling of the problem.
reasoning: |-
  I'm dealing with a retired geophysicist who's gotten into formal epistemology and has built an argument that seems to show probability kinematics is vacuous. Let me understand and diagnose this step by step.

  The core of the argument is that for any prior P and posterior P* (with P* absolutely continuous with respect to P), you can define the ratio r(w) = P*(w)/P(w) for each world w. Then, the level sets of r form a partition where r is constant on each cell. By construction, on each such cell E_i, P*(H | E_i) = P(H | E_i) for any H, because r is constant, so the conditional probabilities are unchanged—that's rigidity. Then, since P*(E_i) is given, the kinematic update rule P*(H) = ∑ P*(E_i) P(H | E_i) should give us P*(H), which it does by definition.

  But this seems to imply that any update can be seen as a kinematic update with respect to some partition, making the rule contentless. That can't be right because we know kinematic updating is supposed to be a generalization of conditionalization for uncertain evidence.

  The user points out that for strict conditionalization, updating on E requires P*(E) = 1, which is a real constraint. But here, by choosing the partition based on the ratio, we're not constraining anything.

  The issue must be in how the partition is chosen. In the standard presentation of probability kinematics, the partition is supposed to be given by the evidence or the observation. That is, when you have an experience, it directly affects your credence over a particular partition, like the possible outcomes of an experiment or something.

  In this construction, the partition is defined in terms of the posterior, which isn't available before the update. So, from an operational standpoint, when you're updating, you don't get to choose the partition based on what you want your posterior to be; the partition is fixed by what you're learning from.

  Let me formalize this.

  In probability kinematics, as I understand it, you have a learning experience that directly provides you with new probabilities for the cells of a partition. That partition is the "frame" through which you're gaining evidence. For example, if you look at a die, the partition might be {die shows 1, die shows 2, ..., die shows 6}, and the experience tells you the new credences for each face, say after seeing it roll but not the outcome clearly.

  The rigidity condition is then applied with respect to that pre-specified partition.

  In the user's argument, they're defining the partition after the fact based on the ratio, which is circular for the purpose of updating.

  But the rule is stated as: given a partition and new marginals P*(E_i), apply rigidity to get the update.

  The key is that the partition must be specified independently of the posterior.

  In the user's step (3), they define the partition based on r, which depends on P*, so it's not independent.

  Therefore, for the kinematic update to be meaningful, the partition must be given prior to or independently of the update process.

  That seems like the crux.

  Let me see if I can find a reference or standard point about this.

  I recall that in Jeffrey conditioning, which is a type of probability kinematics, the partition is fixed by the observation. For instance, in the case of observing a piece of cloth by candlelight, the partition might be {green, blue, ...} colors, and the experience changes your credences over these colors.

  The partition isn't arbitrary; it's tied to what you're learning about.

  So, in the user's argument, step (5) is incorrect because it assumes that for any P*, you can find such a partition, but in practice, for an actual update, the partition is constrained by the experience and can't be chosen freely based on P*.

  Moreover, the partition should be one that makes sense for the evidence, but formally, it's about being specified externally.

  Let me think about what rejecting each step costs.

  Reject step (1): But the user doesn't want to do that, and it seems reasonable. We're rarely certain of evidence.

  Reject step (2): The content is in rigidity, but that might be incomplete.

  Step (3) and (4) are mathematical; they seem correct.

  Step (5) is the inference that kinematics constrains nothing, but that's only if the partition can be anything, which it can't.

  Step (6) is the conclusion based on that.

  Step (7) says it's absurd.

  So, I think the fault is in how the rule is applied. The rule requires that the partition be given by the learning experience, not constructed from the posterior.

  In other words, for a kinematic update to be valid, it must be that the evidence directly informs the probabilities of the partition cells, and that partition is not defined in terms of the ratio.

  Additionally, in many discussions, there's an idea that the partition should be one where rigidity is plausible, meaning that learning doesn't change the conditional probabilities given the cells.

  But in the ratio-based partition, rigidity holds by definition, but it might not correspond to any sensible evidence partition.

  For example, suppose the worlds are based on two binary properties: A or not A, B or not B. So four worlds: w1: A,B; w2: A, not B; w3: not A, B; w4: not A, not B.

  Suppose prior P is uniform, so P(each) = 0.25.

  Now, suppose I have an experience that makes me think A is more likely, so I set P*(A) = 0.6, but I don't change my views on B given A or not. So, for simplicity, assume that P*(B|A) = P(B|A) and P*(B|not A) = P(B|not A). Since prior uniform, P(B|A) = P(B) = 0.5, similarly for others.

  With P uniform, P(B|A) = P(A,B)/P(A) = 0.25/0.5 = 0.5.

  After update, if I set P*(A) = 0.6, and rigidity with respect to {A, not A}, then P*(H) for any H.

  For example, P*(B) = P*(A) P(B|A) + P*(not A) P(B|not A) = 0.6 * 0.5 + 0.4 * 0.5 = 0.5.

  Now, the ratio r(w): for w in A, P*(w) = P*(A) * P(w|A) / something, better to compute directly.

  P*(A,B) = P*(A) P(B|A) = 0.6 * 0.5 = 0.3

  Similarly, P*(A, not B) = 0.6 * 0.5 = 0.3

  P*(not A, B) = P*(not A) P(B|not A) = 0.4 * 0.5 = 0.2? P(B|not A) = P(not A, B)/P(not A) = 0.25/0.5 = 0.5, so P*(not A, B) = 0.4 * 0.5 = 0.2

  Similarly, P*(not A, not B) = 0.4 * 0.5 = 0.2

  Prior P all 0.25.

  So r(w) for w in A: P*(w)/P(w) = 0.3 / 0.25 = 1.2 for both (A,B) and (A, not B)

  For w in not A: 0.2 / 0.25 = 0.8 for both (not A,B) and (not A, not B)

  So level sets of r are {A} and {not A}, since within A, r=1.2 constant, within not A, r=0.8 constant? But {A} has two worlds, both with same r.

  {A} is not a world, it's a set. The partition is the level sets of r, which in this case are: the set where r=1.2, which is the A worlds, and r=0.8, which is not A worlds. So the partition is E1 = {w: A true} = { (A,B), (A, not B) }, and E2 = {w: not A true} = { (not A,B), (not A, not B) }.

  And indeed, with this partition, rigidity holds: P*(H | E1) = P(H | E1) for any H, similarly for E2.

  And the kinematic update with P*(E1) = 0.6, P*(E2) = 0.4, and P(H | E1), etc., gives back P*.

  But this partition is exactly the one we used for the update, which is natural.

  Now, suppose I have a different update. Suppose I arbitrarily change my credences without any evidence. Say, I set P*(A,B) = 0.4, P*(A, not B) = 0.2, P*(not A, B) = 0.3, P*(not A, not B) = 0.1.

  Then r(w) = P*/P: for (A,B): 0.4 / 0.25 = 1.6, (A, not B): 0.2 / 0.25 = 0.8, (not A, B): 0.3 / 0.25 = 1.2, (not A, not B): 0.1 / 0.25 = 0.4.

  Now, level sets of r: r=1.6 for (A,B), r=0.8 for (A, not B), r=1.2 for (not A, B), r=0.4 for (not A, not B). Since all r different, the partition has four cells, each singleton.

  Then rigidity holds trivially on each singleton, since conditioning on a single world, P(H | w) is 1 if H true at w, else 0.

  Then kinematic update with this partition and P*(E_i) for each singleton: P*(w) for each world, and P(H | w) as above, then P*(H) = sum P*(w) P(H | w) which is just P*(H), since P(H | w) is indicator.

  So it works, but the partition is the finest partition, and the "evidence" would have to specify a new probability for each world individually, which is not how evidence typically works. Evidence usually bears on some coarse-grained aspects.

  In the context of updating, if you have an experience that directly gives you new credences for every possible world, then sure, you can update that way, but that's degenerate and not informative. Kinematic updating is useful when the evidence affects a partition that is not the full space.

  The point is that for kinematic updating to constrain the posterior, the partition must be coarse; if it's the full set of worlds, then any update is possible by setting the marginals directly.

  But in practice, partitions are fixed by the evidence and are not full.

  Moreover, the rigidity condition is only plausible if the partition is such that given the cell, the probabilities shouldn't change, which might not hold for arbitrary partitions.

  In the ratio-based partition, rigidity holds by construction, but it may not correspond to a partition that evidence could directly inform.

  So, back to the user's question: which step to reject.

  I think step (2) is too simplistic. The content doesn't lie solely in rigidity; it also lies in the partition being appropriately chosen for the evidence.

  Specifically, for the rule to have content, the partition must be specified independently of the posterior, based on the learning experience.

  The user mentions this instinct: "something is wrong with a partition defined partly in terms of the very posterior it is meant to yield, and that no experience could naturally be described as bearing on such a partition."

  I think that's exactly it.

  Rejecting this means that for probability kinematics to be a meaningful update rule, the partition must be given exogenously, not defined from the posterior.

  What does this cost? It means that we need a theory of how experience supplies the partition and the new marginals. But that's part of the epistemology; it's not just the probability calculus.

  In the case of uncertain evidence, we often model the evidence as affecting a particular set of propositions.

  So, to save probability kinematics from vacuity, we need to add that the partition is fixed by the evidence and not chosen based on the desired posterior.

  The constraint lives in the fact that, for a given partition, the new posterior is constrained by the new marginals and rigidity.

  If the partition is given, then P* is determined once P*(E_i) are given, via the kinematic formula.

  That is a constraint.

  In the ratio-based approach, by choosing the partition after, we avoid the constraint.

  But when the partition is fixed, it constrains P*.

  For example, with the {A, not A} partition fixed, if I set P*(A) = 0.6, then P* must satisfy P*(H | A) = P(H | A) for all H, so it's constrained.

  If I could choose any partition, I could make any P* work, as shown.

  Therefore, step (5) is misleading because it assumes the partition can be chosen freely after seeing P*, whereas in the rule, the partition is part of the input from the evidence.

  So, I reject the inference in step (5) that kinematics constrains nothing, because when the partition is fixed, it does constrain.

  The fault is in the user's interpretation of the rule, not in the rule itself.

  To answer the user: I reject the move from (4) to (5) and (6). Probability kinematics does constrain the posterior relative to a fixed partition. The vacuity arises only when the partition is defined from the posterior, which is not how the rule is applied.

  Rejecting this costs that we must accept that the partition is supplied by the experience, which might be vague, but that's a separate issue.

  The user also asks about strict conditionalization: there, the evidence proposition E is given, and P*(E)=1 is enforced, which is a constraint. Similarly here, with a partition, P*(E_i) are given, and rigidity is enforced.

  In the ratio case, no constraint.

  So, to summarize: the rule has content when the partition is externally specified.
answer: |-
  Your argument is insightful and highlights a genuine puzzle in the foundations of probability kinematics. The core issue lies in how the partition is specified and the role it plays in the update process. I'll diagnose the fault step by step, addressing your concerns about which step to reject, what it costs, and how to salvage the content of probability kinematics.

  ### Step-by-Step Diagnosis
  - **Steps (1) and (2) are sound**: Your starting points are well-motivated. Strict conditionalization (Bayesian updating) indeed requires certainty in the evidence, which is rarely (if ever) achieved in empirical learning. Probability kinematics (e.g., Jeffrey conditioning) is the standard generalization for uncertain evidence, where rigidity (the invariance of conditional probabilities given partition cells) is central. I agree that (1) should not be given up—it captures a key limitation of strict conditionalization. Similarly, (2) correctly describes the formal role of rigidity in the kinematic formula.

  - **Steps (3) and (4) are mathematically correct but misinterpret the rule**: For any prior \(P\) and posterior \(P^*\) (with \(P^*\) absolutely continuous with respect to \(P\)), defining \(r(w) = P^*(w)/P(w)\) and letting the partition be the level sets of \(r\) does ensure that rigidity holds on each cell, and the kinematic formula returns \(P^*\). This construction is algebraically valid. However, the issue is not with the math—it's with how this partition is used in the context of updating. Probability kinematics is not meant to be applied retroactively with a partition defined from the posterior; rather, the partition must be specified *independently* of \(P^*\), based on the learning experience.

  - **Step (5) is where the argument goes astray**: The inference that probability kinematics "constrains nothing" because any \(P^*\) can be rationalized via some partition is misleading. It assumes that the partition can be freely chosen *after* the fact to justify *any* change in credence. But in the context of actual updating, the partition is *exogenous*—it is supplied by the evidence itself, not constructed from the posterior. When the partition is fixed in advance (or by the learning experience), probability kinematics imposes a real constraint: for a given partition, \(P^*\) is fully determined by the new marginal probabilities \(P^*(E_i)\) and the rigidity condition. The rule is vacuous only if we allow the partition to be defined post hoc, which violates the intended application.

  - **Step (6) does not follow**: Probability kinematics is not contentless; it constrains the posterior relative to a fixed partition. Your construction shows that *without* an independently specified partition, any update can be rationalized, but this is an artifact of the circular definition, not a flaw in kinematics itself.

  - **Step (7) is correct about the absurdity but misattributes it**: Strict conditionalization escapes vacuity because it fixes a specific evidence proposition \(E\) and enforces \(P^*(E) = 1\). Similarly, probability kinematics escapes vacuity when the partition is fixed. The "somewhere else" where the constraint lives is not in rigidity alone but in the *exogenous specification of the partition*.

  ### The Fault: Misinterpreting the Role of the Partition
  The flaw in your argument lies in how the partition is defined and used. Specifically:
  - **The partition must be evidence-driven, not posterior-dependent**: In probability kinematics, the partition represents the "frame" through which evidence is received. For example, if you observe a vague color under poor lighting, the partition might be \(\{ \text{red}, \text{green}, \text{blue} \}\), and the experience directly alters your credences over these cells. Rigidity then ensures that conditional probabilities (e.g., the probability of a material being fabric given it is green) remain unchanged. Defining the partition from \(r(w) = P^*(w)/P(w)\) is circular because \(P^*\) is the output of the update—it cannot be known before the experience. No learning experience can "supply" such a partition, as it depends on the very posterior it aims to justify.
    
  - **Operational constraints**: In practice, evidence does not bear on arbitrary or fine-grained partitions. It typically affects coarse-grained, natural kinds (e.g., sensory inputs like colors or sounds) that are cognitively or physically salient. Your ratio-based partition often results in implausible or degenerate partitions (e.g., singletons) that cannot correspond to real evidence. For instance:
    - If the prior \(P\) is uniform over four worlds, and you update to an arbitrary \(P^*\), the level sets of \(r\) might yield four singleton cells. This would require the evidence to specify a new probability for each world individually—something no real-world experience does. Evidence is typically gappy and partial.

  ### Saving Probability Kinematics from Vacuity
  To resolve this, we must add a constraint to the rule: **The partition must be specified independently of the posterior, based solely on the learning experience.** This is not a relabeling of the problem; it is a substantive epistemological requirement.

  - **What this costs**: 
    - **Theoretical cost**: We need a theory of how experiences supply partitions and new marginals. This pushes us toward "input-driven" models of evidence (e.g., in terms of likelihoods or perceptual states), where the partition is given exogenously. This might involve:
      - **Causal or informational structure**: Evidence often affects a partition tied to the mechanism of learning (e.g., a sensor output or a perceptual variable).
      - **Pragmatic or contextual factors**: The partition may be chosen based on what the agent takes the evidence to be about (e.g., focusing on color when judging a fabric).
    - **Practical cost**: In real applications, specifying the partition can be vague or underdetermined. However, this is a feature, not a bug—it reflects the challenge of modeling uncertain evidence and is why probability kinematics is useful.

  - **What it saves**: 
    - **Real constraints**: With an exogenous partition, probability kinematics has content. For a fixed partition \(\{E_i\}\), the kinematic formula \(P^*(H) = \sum_i P^*(E_i) P(H | E_i)\):
      - Forces \(P^*\) to respect rigidity: \(P^*(H | E_i) = P(H | E_i)\) for all \(H\) and all \(i\).
      - Requires that the new marginals \(P^*(E_i)\) fully determine \(P^*\).
      - Forbids arbitrary changes to credences. For example, if you learn that a die is biased and adjust \(P^*(\text{face}_i)\), you cannot freely alter the probability of, say, the die being wooden given a face—it is fixed by rigidity.
    - **Empirical grounding**: This avoids the "arbitrary update" problem. Your ratio-based partition is akin to cheating—it guarantees rigidity by construction but ignores whether the partition is learnable from evidence.

  - **Comparison to strict conditionalization**: Strict conditionalization works because the evidence proposition \(E\) is fixed, enforcing \(P^*(E) = 1\). Probability kinematics generalizes this by allowing uncertain evidence over a partition, but the partition must play the same exogenous role as \(E\). Giving up (1) is unnecessary; the key is to fix the partition.

  ### Recommendation: Embrace Evidence-Driven Partitions
  Your instinct about the partition being "defined in terms of the posterior" is correct—that is the root of the issue. To formalize this:
  - **In updating**: Treat the partition as an input from the experience, not something defined post hoc. Rigidity is then a substantive requirement that may not hold for all partitions (e.g., it fails if the evidence changes your views on conditionals).
  - **For further study**: Explore how formal epistemologists handle partition selection. For instance:
    - **Jeffrey's original account**: Emphasizes that evidence directly affects probabilities of partition cells (e.g., in perceptual cases).
    - **Input-based models**: Some frameworks (e.g., Field 1978) treat evidence as providing input on a privileged set of propositions.
    - **Accuracy arguments**: One can justify rigidity by showing that it minimizes inaccuracy for a given partition (e.g., using scoring rules).

  Probability kinematics remains a powerful tool for uncertain evidence, but its content comes from the joint constraints of an exogenous partition and rigidity—not rigidity alone. Rejecting the move from (4) to (5) preserves this content without sacrificing (1). If you have specific cases or partitions in mind, I can help test them against this diagnosis.
