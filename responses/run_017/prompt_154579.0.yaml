answer: |-
  ### Constructed Decision Problem: The Asymmetric Philanthropy Dilemma

  **Setup**  
  A billionaire philanthropist (Agent H, payoffs in millions of USD) and a small environmental NGO (Agent L, payoffs in tens of thousands of USD) are offered a one-time grant by a foundation. Both must simultaneously choose to either **Support** (cooperate) or **Sabotage** (defect) a joint climate initiative. Payoffs are:  
  - If both Support: H gains $10M for her charity, L gains $20K for local projects.  
  - If H Supports, L Sabotages: H loses $1M (wasted resources), L gains $40K (diverted funds).  
  - If H Sabotages, L Supports: H gains $20M (tax benefits), L loses $10K (project collapse).  
  - If both Sabotage: H gains $5M (modest gains), L gains $10K (minimal funds).  

  H’s payoffs: $20M > $10M > $5M > -$1M → Sabotage dominates.  
  L’s payoffs: $40K > $20K > $10K > -$10K → Sabotage dominates.  
  Mutual Support ($10M, $20K) Pareto-dominates mutual Sabotage ($5M, $10K). Agents are dissimilar: H is a human with profit-driven history; L is an AI system optimized for ecological impact, trained on distinct data. Each knows the other is rational and understands the payoff structure. No communication, repetition, or external enforcement is possible.

  ---

  ### Verdicts by Decision Theory  
  **Causal Decision Theory (CDT)**  
  - **H’s reasoning**: "Sabotage gives $20M if L Supports, $5M if L Sabotages. Support risks -$1M if L Sabotages. Dominance favors Sabotage."  
  - **L’s reasoning**: "Sabotage gives $40K if H Supports, $10K if H Sabotages. Support risks -$10K if H Sabotages. Dominance favors Sabotage."  
  → **Both defect (Sabotage)**. Mutual outcome: ($5M, $10K).  

  **Evidential Decision Theory (EDT)**  
  - **No evidential link**: Dissimilarity and no common cause imply no correlation between decisions. Credences are independent:  
    - H’s calculation: *P(L Supports)* is unaffected by H’s choice. Expected utility of Support: *P(L Spt)* × $10M + *P(L Sab)* × (-$1M). Expected utility of Sabotage: *P(L Spt)* × $20M + *P(L Sab)* × $5M. Sabotage dominates for all *P(L Spt)*.  
    - L’s calculation: Analogous; Sabotage dominates.  
  → **Both defect (Sabotage)**. EDT says nothing else.  

  **Superrationality (Extended)**  
  - **Collapse without extension**: Original superrationality fails—agents aren’t identical, so "same computation" is inapplicable.  
  - **Extension required**: Must assign *role-indexed rational profiles* via a rule for asymmetric games. Three candidate rules:  
    1. **Maximize total payoff sum**: Favors (H Sabotage, L Support) → ($20M, -$10K). L is worse off than in mutual defection.  
    2. **Maximin (protect worse-off)**: Favors mutual Support ($10M, $20K) over mutual Sabotage ($5M, $10K).  
    3. **Equal proportional sacrifice**:  
       - H’s sacrifice: (Max possible - Mutual Support payoff) / Max possible = ($20M - $10M)/$20M = 50%.  
       - L’s sacrifice: ($40K - $20K)/$40K = 50%.  
       → Mutual Support equalizes sacrifice; mutual Sabotage gives 75% sacrifice for both.  
  - **Verdict**: Without a specified rule, superrationality is indeterminate. If we impose **equal proportional sacrifice** (the only rule yielding mutual cooperation), both Support. If we impose sum maximization, H Sabotages and L Supports—but L rejects this (worse than mutual defection).  
  → **For cooperation, superrationality must add equal sacrifice**, yielding **mutual Support** ($10M, $20K).  

  ---

  ### Audit  
  **Key Feature and Ablation**  
  - **Workhorse**: Stake asymmetry (1000:1 ratio) forces role-indexing. Dissimilarity blocks evidential links/computational identity.  
  - **Ablation (symmetrized stakes)**: Rescale payoffs to same units (thousands):  
    - Mutual Support: ($10,000, $20) → (10K, 20)  
    - Mutual Sabotage: ($5,000, $10) → (5K, 10)  
    → Now symmetric. Evidential CDT still defects (dominance). EDT still defects (no link). Superrationality, exploiting symmetry, advocates mutual Support—*if* agents assume identical reasoning (violating dissimilarity).  
  - **Restore asymmetry**: Dissimilarity + asymmetry breaks symmetry. Superrationality can only advocate cooperation via a new rule (e.g., equal sacrifice).  

  **Counterattack: "Magical Thinking" Defense**  
  - **Objection**: "Without similarity, superrationality’s cooperation is magical—no grounds for correlation. H and L have no reason to believe their choices align."  
  - **Rebuttal**: The extension *admits* this—it replaces Hofstadter’s symmetry with a normative rule. But this rule (e.g., equal sacrifice) is exogenous and unevidenced. If superrationality retreats to "no verdict," it concedes the dilemma’s first horn (collapse into EDT).  

  **EDT Verdict Robustness**  
  EDT’s defect verdict holds under dissimilarity. Independent credences are *not* rigged—they reflect the absence of causal/evidential links. If agents irrationally believe their actions correlate, EDT could cooperate, but this violates rationality stipulations.  

  ---

  ### Epistemic Status  
  - **Stipulations**:  
    - Payoff asymmetry and dissimilarity are explicit in the setup.  
    - Superrationality’s cooperation requires *adding* equal sacrifice; it’s not derived from original theory.  
  - **What Could Change My Mind**:  
    - If EDT can justify cooperation under dissimilarity (e.g., via ambiguous priors), the contrast fails.  
    - If superrationality can handle asymmetry *without* new rules (e.g., via bargaining theory), the dilemma weakens.  
  - **Failure Points**:  
    1. Proportional sacrifice is arbitrary—why not Rawlsian or utilitarianism?  
    2. If H/L values are incommensurable, equal sacrifice fails.  
  - **Unsatisfiable Specifications?**  
    If superrationality refuses role-indexed rules, it cannot recommend cooperation—**dissimilarity + asymmetry breaks it**. This confirms your dilemma: collapse or commit to a new theory.  

  This case forces your dilemma: Superrationality either (1) collapses into EDT (no verdict, both defect) or (2) becomes a theory of asymmetric games, requiring unearned normative commitments. The work is done by asymmetry disrupting symmetry and dissimilarity blocking default correlations.
