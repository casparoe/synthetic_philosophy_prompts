answer: |-
  Here's your toast in five beats, designed to honor the paradox without academic baggage, land emotionally, and intellectually satisfy Tom's crowd:

  1.  "Tom and Maya, looking at you now – the way you laugh at the same terrible jokes, how you plant tomatoes every spring knowing the squirrels will win, how you've already built a home in each other's quiet moments – it’s clear you aren’t just *predicting* a happy future together based on how things feel today."
  2.  "You’re doing something far more profound right now: you’re *creating* a new fact in the world – the fact of your promise, spoken out loud before everyone who matters to you."
  3.  "And that’s the magic, isn’t it? A true promise isn’t a bet that the reasons you have *now* will always be enough tomorrow; it’s the deliberate act of making this commitment itself the reason that carries you forward, especially when those other reasons might feel thin."
  4.  "So when life inevitably throws things at you that today’s joy couldn’t foresee – the messy, hard, or just plain Tuesday-afternoon-dull moments – this moment, this vow, this room full of witnesses shouting 'We Do!', becomes the anchor. It’s the reason you *made* for yourselves, right here, precisely *because* you knew future-you might need reminding."
  5.  "That’s why we’re all here, not just to celebrate the feeling, but to become part of that anchor – to be the living reminder, the cheer squad, and sometimes the slightly-too-honest friends who help you both recall the weight and the wonder of what you declared true about yourselves today. To Tom and Maya, and the promise that shapes the path!"

  **Why this works:**

  *   **Beats 1 & 2:** Ground it in their specifics, avoids cliché ("love is a choice"), implicitly distinguishes *prediction* (reasons-based) from *promise* (intention-as-action) without jargon.
  *   **Beat 3:** Directly addresses the toxin puzzle core: *acknowledges* future reasons might change/fade ("thin"), positions the *act of promising itself* as the persistent reason ("the reason that carries you forward"). Answers Tom's framing without endorsing cynicism.
  *   **Beat 4:** Explicitly frames the vow as a *deliberately created future reason* ("the reason you *made* for yourselves"). Rejects the Ulysses contract ("tying up") by making it relational and declarative ("anchor," "reminding"). Satisfies the need for a vow to hold *when* reasons change.
  *   **Beat 5:** Broadens it to community support (heartfelt, non-embarrassing), reinforces the vow's power, ends on warmth and hope. "Living reminder" nods to the social enforcement of intention without being clinical.
  *   **Philosophy Crew:** Will hear the toxin puzzle engagement in Beats 3 & 4: intention as creating a *new* reason that persists *despite* known future incentive shifts. Rejects Dave's "must believe you'll do it based on current reasons" and embraces the "intention survives reasons changing" view, framed as a positive human capacity. Sidesteps the Ulysses debate by focusing on the *declarative* and *social* nature of the act.
  *   **Non-Philosophers:** Hears affection, celebration of commitment, recognition of future challenges, and the importance of community. Words like "magic," "anchor," "cheer squad," "wonder" land emotionally.
  *   **Tom:** Hears his point acknowledged ("payoff is right there at the altar") but reframed positively as the *source* of ongoing strength, not a cynical endpoint. Answers his challenge about the nature of promising without agreeing it's *just* a toxin puzzle.
  *   **You:** Avoids promising impossible future behavior for Tom, focuses on the act *today* and its *created* power. No decision theory terms explained, no clichés, warm and sayable.

  Print it, practice it, and raise a glass. You've got this.
