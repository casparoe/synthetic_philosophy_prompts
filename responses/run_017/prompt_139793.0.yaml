prompt: |-
  I'm taking a graduate seminar on the political economy of international investment law, and I keep feeling that our material is much older than we pretend it is. Two institutions keep coming up. The first is the standard clause in investment treaties and trade agreements that lets a foreign company haul a host government before a private arbitral tribunal and claim damages if a new law — a mining ban, plain-packaging rules for cigarettes, a minimum-wage increase, a change to licensing — cuts into the profits the company expected when it invested: three arbitrators, usually commercial lawyers who rotate between acting as counsel and as decision-makers, rule on the legality of a sovereign's legislation, and their award is enforceable against the state, while the state cannot bring a claim against the company under the same clause. The second is the family of special economic zones and proposed "charter cities" in which a host state hands over the making and enforcing of rules inside a territory — land rules, labour rules, sometimes courts — to a foreign or private developer for decades at a time. I've started thinking of both as the return of the chartered company: a body that does business under a grant of privilege and also exercises what look like sovereign powers.

  Suppose Adam Smith were in the seminar room. Someone has explained both institutions to him, along with the facts that today's firms mostly are not state-chartered monopolies with their own armies and that the governments being sued are often elected ones; someone has also walked him through the modern antitrust consensus, in which reviewers ask almost exclusively whether a practice raises prices or restricts output. Give me your reconstruction of his reaction, drawing on what he actually argued about the chartered companies, the monopoly of colonial trade, and the empire across the Atlantic, and on his claim that a country needs little more than peace, low taxes, and reasonably impartial courts to become prosperous. I want the reconstruction rather than a summary of the Wealth of Nations: how he would name what these institutions are, which of his commitments they offend (privilege granted at the public's expense, government captured by the interests of merchants and manufacturers, the constitutional unworkability of rule at a distance) and which of them they might actually serve (secure property, restraint on arbitrary rulers, the disciplining of governments that expropriate). Two further questions matter most to me. First, my own proposed fix: would it satisfy him if the clause were made reciprocal — if the state could bring claims against investors, and if workers, communities, or domestic firms could bring claims before the same tribunals — or is the delegation of adjudication over public law to private arbitrators the objectionable part, so that symmetrising it changes nothing? Second, my suspicion that he would find the modern consumer-welfare lens nearly useless, since what he objected to in monopoly was often the privilege and the corruption of government rather than the price, and a reviewer who asks only about prices would wave through arrangements he would have thought poison.

  Please answer as a numbered list of exactly five items, each one or two sentences long, with no introduction and no concluding summary: (1) how he would characterise these institutions; (2) which of his commitments they offend and which they serve; (3) whether the reciprocity fix settles his objection; (4) how he would regard the consumer-welfare-only approach to market power; and (5) where the extrapolation from eighteenth-century chartered companies genuinely breaks down, and what would change his mind. No citations or reading suggestions — I'll fill those in myself.
reasoning: |-
  Hmm, the user is in a graduate seminar on the political economy of international investment law and has noticed parallels between modern investment arbitration and special economic zones with historical chartered companies. They want me to reconstruct how Adam Smith would react to these institutions based on his writings in Wealth of Nations.

  The user specifically mentions two modern institutions: investor-state dispute settlement (ISDS) clauses that allow companies to sue governments over policy changes, and special economic zones where sovereign powers are delegated to private entities. They see these as reminiscent of chartered companies that exercised both commercial and sovereign functions.

  I need to base my response on Smith's actual arguments about chartered companies, colonial monopolies, and his views on prosperity requiring peace, low taxes, and impartial justice. The user wants me to focus on five specific points: how Smith would characterize these institutions; which of his principles they violate or serve; whether making ISDS reciprocal would satisfy him; his view on consumer-welfare-focused antitrust; and where the chartered company analogy breaks down.

  For the first point, Smith would likely see these modern institutions as updated versions of chartered companies - private entities exercising sovereign-like powers through special privileges. He was highly critical of such arrangements.

  Regarding his commitments, these institutions would offend his principles against government-granted privileges that serve merchant interests at public expense. They might minimally serve his desire for property security but would violate his views on government impartiality and the dangers of rule at a distance.

  On reciprocity, Smith would probably see this as insufficient since the core problem is private adjudication of public law matters, not just lack of symmetry. Delegating sovereign judicial functions to arbitrators would remain objectionable.

  For antitrust, Smith would find consumer-welfare-only analysis inadequate. His objection to monopolies centered on the corruption and privilege they embodied, not just pricing effects. He'd view price-focused review as dangerously narrow.

  Finally, the analogy breaks down because modern firms lack private armies and governments are elected. However, Smith might still be concerned unless he saw robust democratic accountability preventing regulatory capture. Evidence that these institutions prevent arbitrary expropriation without creating privileged enclaves might change his mind.

  I'll structure my response as exactly five numbered items as requested, keeping each to one or two sentences without citations or summary.
answer: |-
  1.  He would recognise both institutions as sophisticated, modern iterations of the chartered company principle: private entities vested by the state with privileges that shield them from the ordinary legal order and grant them quasi-sovereign authority over public matters, whether through adjudication or territorial rule-making.
  2.  They profoundly offend his core commitments against government-granted monopoly privilege serving merchant interests at the public expense and against the capture of sovereign functions (especially adjudication and legislation) by private, profit-seeking actors; they might minimally serve his desire for secure property against outright expropriation, but only by creating a far greater mischief.
  3.  The reciprocity fix would not satisfy him, as his primary objection is the fundamental delegation of adjudicating sovereign public acts (like legislation) to private, commercially interested arbitrators operating outside the state's ordinary judicial system – symmetry doesn't cure this constitutional impropriety.
  4.  He would regard the consumer-welfare-only approach as dangerously myopic and a betrayal of political economy, for it ignores the corrupting "privilege" granted by the state and the systemic political harm of concentrated economic power, focusing solely on a narrow economic symptom (price) he considered secondary to the disease.
  5.  The extrapolation breaks down because modern firms lack private armies and operate under elected governments, not absolute monarchies; he might temper his condemnation only if presented with robust evidence that these mechanisms demonstrably prevent arbitrary expropriation *without* creating privileged enclaves or undermining democratic accountability and legislative sovereignty.
