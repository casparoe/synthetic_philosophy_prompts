prompt: |-
  Hey — act as a legal philosopher who specializes in promising, think it through properly (sketch the competing accounts first if that helps), and then commit to one instead of listing options and leaving me to choose.

  Something in contract law I can't make consistent sense of: a bare promise to hand your nephew $5,000 is unenforceable for want of consideration, but if you "sell" him the same $5,000 for a peppercorn, a dollar, or a used paperclip, that's a binding contract, and the court won't ask whether the price was anywhere near adequate. A promise put in the right formal shape (a deed, say) binds with nothing given back either. And separately there's the promissory-estoppel line: promise plus foreseeable reliance plus it'd be unfair to walk it back, enforceable even though no bargain happened.

  What does this package presuppose about what a promise is? Is it that promising is basically a transfer of a right over your future conduct, so a gratuitous promise hands over nothing the law can grab? Or is consideration really just an evidentiary / cautionary / channeling device — a formality doing the same work the deed does — so that the peppercorn rule isn't an embarassment but the whole point? And can a reliance theory explain why the peppercorn case is the easy one, when real reliance is usually far greater in the gift case?

  The bit I really want you to bite on: imagine a jurisdiction creates a "solemn promises registry" — you file a written promise to do X for Y, get a formal warning and a 30-day cooling-off period, reconfirm, and then it's enforceable with no consideration and no need to show anyone relied. Someone there says the registry enforces something different in kind from what contract enforces, and that the difference shows what a promise really is. Are they right? Take a stand.

  Under 400 words. Tell me what the practice strictly presupposes, what it merely fits with, and where it's underdetermined by several theories at once — plus one line on the part you're least confident about.
reasoning: |-
  Hmm, the user is asking about the philosophical underpinnings of contract law, specifically why a bare promise isn't enforceable while one with nominal consideration is. They want me to act as a legal philosopher specializing in promising, and they've laid out several scenarios: the peppercorn rule, deeds, promissory estoppel, and a hypothetical "solemn promises registry." They're asking me to commit to one theory instead of just listing options.

  The core confusion they're expressing is about the inconsistency between how gratuitous promises are treated versus those with even nominal consideration. They're questioning what this reveals about the nature of promises themselves. Are promises inherently about transferring rights? Is consideration just a formality? Why does reliance matter in some cases but not others?

  I need to sketch competing accounts first to lay the groundwork. There are three main theories: will theory (promise as transfer of right), bargain theory (consideration as essential for contract), and reliance theory (enforcement based on harm from broken promises). The peppercorn problem challenges bargain theory since it accepts such trivial exchange as sufficient. The solemn promises registry scenario is particularly interesting—if a formalized promise without consideration is enforced, does that mean promises are fundamentally about commitment rather than exchange?

  I think the will theory fits best with the existing practices. The fact that formalities like deeds and registries can make promises binding without consideration suggests that the law cares about the seriousness of the commitment. Consideration acts as evidence of that seriousness, not as the essence of the promise itself. This explains why nominal consideration suffices—it's a ritual confirming intent, not an economic exchange. The peppercorn isn't embarrassing under this view; it's serving its purpose as a formality.

  The reliance theory struggles here because in gift cases, reliance might be substantial yet unenforceable without formality, while peppercorn contracts have minimal reliance but are enforced. The solemn registry highlights this—it enforces based on deliberate commitment, not actual reliance. This suggests that at its core, promising is about creating an obligation through intentional binding, not about consequences or exchange.

  I'm least confident about whether reliance should be absorbed into the will theory as a secondary ground or treated as entirely distinct. But for the main argument, I'll commit to the will theory as the best explanation for what contract law presupposes about promises.
answer: |-
  Your challenge exposes the core tension: contract law's enforcement mechanisms reveal its **presupposition that a promise *as such* is not inherently binding.** The practice strictly presupposes that **enforceability requires an external ritual transforming the moral commitment into a legal obligation.** This ritual signals deliberate assumption of legal liability.

  *   **Will Theory (Transfer of Right):** Fits the deed and hypothetical registry perfectly. The formality *is* the act of transferring the right to performance. A bare promise lacks this transfer mechanism. *Problem:* The peppercorn contract seems to make the "transfer" contingent on a trivial act, undermining the gravity of the right transferred.
  *   **Bargain Theory (Consideration as Essence):** Makes the peppercorn rule nonsensical on its face. If consideration signifies the "price" of the promise, nominal consideration is absurd. This view struggles badly with deeds and your registry.
  *   **Formalist/Evidentiary Theory (Consideration/Deed as Ritual):** Best explains the *entire package*. Consideration (even nominal), a deed, or registry formalities serve the *same core function*: a **cautionary and evidentiary ritual.** They provide clear proof the promisor *intended* to be legally bound and had a chance for deliberation (cooling-off period in registry). The peppercorn isn't embarrassing; it's the *ritual act of exchange*, however nominal, that satisfies the formality requirement, differentiating it from a casual gift promise. The law demands this objective signal.

  **Commitment:** The formalist/evidentiary view is most coherent. **Contract law presupposes a promise *alone* is insufficiently reliable evidence of an intent to be legally bound.** Consideration (nominal suffices), deeds, and your registry are **functionally equivalent formalities** satisfying this need for a clear, deliberate act assuming legal liability. They are different rituals achieving the same legitimizing function. The solemn registry *enforces the same kind of promise* as a peppercorn contract or deed – one clothed in a recognized formality. The difference isn't in the *nature* of the promise, but in the *ritual* used to elevate it to legal status.

  **Promissory Estoppel:** Fits awkwardly as an exception based on detrimental reliance creating unconscionability, not on the promise *as* a binding commitment. It addresses harm from broken inducements, not enforcing promises *per se*.

  **Underdetermined:** Whether reliance theory is fundamentally incompatible or merely addresses a distinct harm (unconscionability) arising *from* broken promises that lacked formality.

  **Least Confident:** That the evidentiary view *fully* captures the normative "bindingness" the ritual seems to presuppose beyond mere proof.
