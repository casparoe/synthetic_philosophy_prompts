  Now, ordering these. Point 5 should come first because if REU isn't affecting decisions, the other points are moot. A quick analysis could save time. Next, point 1 is crucial because the global r might undermine their strategy, especially with long shots. Solving this could change grant choices. Point 2 follows since application level depends on having the right r. Point 3 about committees is important but might be manageable with agreed parameters. Point 4 is more about probability assessment, which is separate from REU's mechanics.

