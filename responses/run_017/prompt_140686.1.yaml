prompt: |-
  I have a mathematics degree from some years ago but never studied set theory formally, and I have been reading a popular book about infinity. One paragraph in its chapter on the sizes of infinite collections has been nagging at me, and I would like an accuracy audit before I rely on it in something I am writing. The paragraph summarizes Skolem's paradox roughly as follows:

  "Set theory proves that the real numbers are uncountable: there are strictly more of them than there are natural numbers. Yet the Löwenheim–Skolem theorem shows that if ZFC is consistent, then it has a model whose entire domain can be arranged in a single infinite list — a countable model. Inside that universe of sets, every set, the set of reals included, is countable when seen from the outside. The contradiction is only apparent. 'Uncountable' just means 'no bijection with the natural numbers exists anywhere inside the model'; the model lacks the functions that would pair its reals off with its naturals, and so it mistakenly reckons its own reals uncountable. Skolem drew the moral himself: notions like uncountability are irreducibly relative, and there is no absolute fact of the matter about how many real numbers there are. This is the same phenomenon that set theorists exploit when they use forcing to change the size of the continuum, and it is why the continuum hypothesis can be neither proved nor refuted. The culprit throughout is first-order logic. If set theory were written in second-order logic, so that the quantifiers range over absolutely all subsets, its models would be pinned down once and for all and the paradox would disappear."

  My suspicions, for what they are worth: the closing claim about second-order logic sounds too clean to me, since "absolutely all subsets" looks like the very sort of phrase whose reference could shift; and the slide from Skolem's paradox to the continuum hypothesis sounds like the kind of step a careful author would flag as a separate result. But I do not trust either suspicion, and I cannot tell whether the earlier sentences are right.

  Please go through the paragraph sentence by sentence and tell me what a set theorist or a philosopher of set theory would accept as stated, what they would want to qualify, and what they would reject outright. In particular, does the book's later conclusion — that the continuum hypothesis is consequently not a real question, because there is no determinate fact about the size of the continuum — survive once the summary is corrected? If it does not, is there some nearby line of argument that would get the book a conclusion of roughly that shape, or is the chapter simply trading on two different senses of "relative"? Where the issues are genuinely contested among specialists as opposed to settled mathematics, please say so, rather than presenting the contested parts as refutations.
