  Okay, the user is a critical-care paramedic instructor who needs to articulate a coherent principle for determining when someone "knows how" to perform lifesaving procedures. Their gut reactions to nine concrete cases reveal tensions, especially between performance ability and underlying understanding. 

  First, I notice their core struggle: reconciling successful action with the agent's awareness/knowledge. Cases like Maya (fails in real situations) vs Dr. Ruiz (can't physically perform but understands deeply) highlight this. The user intuitively values reliability plus comprehension over mere physical execution. 

  The amnesiac learner case (four) is pivotal - they insist this person "knows how" despite zero declarative knowledge. This suggests procedural memory alone can constitute knowing-how. But then the AI case (nine) troubles them because it performs flawlessly without comprehension. Their hesitation here might stem from resisting anthropomorphism. 

  Their tentative principle has two key components: reliability across contexts and attribution to the agent's "grasp" of success conditions. Let's stress-test this. 
  - It explains why Garrity (case seven) doesn't know how: his success depends on external guidance, not his grasp. 
  - But tensions emerge: Why does Nurse Okafor (case six) "know how" despite needing visual aids? The user likely sees the chart as integrated into her expert system. 
  - Case five (fails without verbal prompts) vs six is tricky: both depend on external supports, but only one is deemed competent. The difference may be internalization - Okafor's reliance is strategic, not crutch-like. 

  For repair, I'll refine "grasp" to mean the agent can detect and correct errors based on situational feedback, not just execute rote steps. This covers Ruiz (corrects others) and the amnesiac (improves through practice) while excluding the checklist-dependent trainee (case five). 

  The unlisted cases probe boundaries: 
  - The one-time learner who performs perfectly: She didn't "know how" before - first exposure can't yield reliability. 
  - The expert with inaccurate self-report: She knows how, as her competence stems from tacit calibration. 

  Confidence levels: Highest on amnesiac case (clinical evidence supports procedural knowledge); lowest on AI case (depends on unresolved philosophy of machine cognition). 

  Key empirical caveat: Focal dystonia (case three) doesn't impair knowledge - it's motor execution failure. Their intuition here is medically sound.
answer: |-
  Here’s a principle that captures nearly all your verdicts, built by refining your tentative proposal through testing against your cases. I’ll walk through the reasoning step by step, then state the principle, its coverage, and its costs.

  ### The Core Insight
  Your cases show that *reliable success* alone isn’t sufficient for "knowing how" (rejecting pure behaviorism), and *verbal articulation* alone isn’t necessary (rejecting intellectualism). The key is **causal control rooted in a competency that integrates perception, action, and error-correction**. What matters is whether the agent’s own cognitive/motor resources—shaped by learning—generate success across variations in context, even when external aids or impairments are present. This "grasp" (as you put it) isn’t static knowledge but a *dynamic capacity to adapt*.

  ### Revised Principle
  **A person knows how to Φ when:**
  **(1) They reliably succeed at Φ-ing across the range of situations relevant to the certification context; and**  
  **(2) This success is directly attributable to their internalized competency—i.e., their ability to perceive, execute, and adjust based on feedback specific to Φ-ing, developed through learning.**  

  **Competency manifests in performance, error-detection, correction, or teaching, and need not be verbally reportable. External supports or physical impairments don’t negate knowledge if competency is retained and integrated.**

  ---

  ### Testing Against Your Cases
  - **Maya (Case 1):** Fails (1). Success isn’t reliable in real situations (contextually relevant variations).  
  - **Dan (Case 2):** Fails (1). No reliable success in execution.  
  - **Dr. Ruiz (Case 3):** **Knows how.** Physical impairment blocks performance, but her competency is intact—she perceives errors and guides others (manifesting grasp). *Clause (2) separates physical ability from knowledge.*  
  - **Amnesiac Learner (Case 4):** **Knows how.** Reliable improvement (1) driven by implicit learning (2). Procedural memory *is* internalized competency.  
  - **Checklist-Dependent Trainee (Case 5):** **Does not know how.** Fails without external prompts; no internalized competency (2).  
  - **Nurse Okafor (Case 6):** **Knows how.** Wall chart is a *tool*, not a crutch; her competency integrates it strategically (e.g., she likely glances, doesn’t rigidly follow). Success is attributable to *her* trained skill (2).  
  - **Garrity (Case 7):** **Does not know how.** Success depends on external correction, not his own competency (2).  
  - **Tech (Case 8):** **Knows how.** Incorrect belief doesn’t undermine motor competency (2); she reliably positions correctly based on trained perception/action.  
  - **AI System (Case 9):** **Does not know how** (aligning with your gut). It satisfies (1) but not (2): success isn’t attributable to *its* "grasp" (it has no perceptual feedback loop, error-correction, or learning *as an agent*; it’s a statistical tool). *Cost: This assumes AI lacks genuine agency/competency—more below.*  

  **Tensions Resolved:**  
  - **3 vs 1:** Ruiz retains competency (2); Maya lacks reliability (1).  
  - **5 vs 6:** Trainee (5) lacks internalization; Okafor (6) has integrated the chart into her competency.  
  - **9 vs 4:** Amnesiac has a human cognitive system that learns/adapts (2); the AI does not (it simulates, doesn’t *possess* competency).  

  ---

  ### Unlisted Cases
  - **Trainee after one demonstration:** **Does not know how before doing it.** Reliability (1) requires practice across variations; a single perfect performance post-instruction suggests aptitude but not yet knowledge (e.g., she might fail under stress).  
  - **Expert with inaccurate self-report:** **Knows how.** Competency (2) is in her perception/action calibration, not verbal reports. Her stated criteria are post-hoc rationalizations; the real "grasp" is subpersonal.  

  ---

  ### Costs and Confidence
  **Where It Misfires (Minimally):**  
  - **Case 5 (Checklist-Dependent):** Your verdict is "not yet," but the principle might allow future internalization. If the trainee *never* internalizes the steps, the verdict holds.  
  - **Case 9 (AI):** *I’m least confident here (60%).* If the AI adapts in real-time to novel simulator variations (e.g., adjusting for tissue elasticity), it might satisfy (2). You’d need to drop your verdict or insist that competency requires biological cognition. *Cost: Accepting AI "knowledge" might feel like anthropomorphism, but refusing it risks inconsistency with case 4.*  

  **Empirical Safeguards:**  
  - **Amnesia (Case 4):** Assumes implicit learning exists (well-supported for motor skills; e.g., hippocampal-independent procedural memory). If the learner *only* improves via conscious recall, your verdict fails.  
  - **Dystonia (Case 3):** Assumes motor impairment doesn’t erase cortical motor maps (plausible; e.g., "use-dependent" reorganization preserves knowledge).  
  - **AI (Case 9):** Assumes no emergent agency in current systems (true for narrow AI; if it’s AGI, revisit).  

  ---

  ### Final Principle and Tradeoffs
  **Principle:** *Knowledge-how is demonstrated by reliable, contextually flexible success driven by an internalized competency to perceive, act, and adapt within the task domain, acquired through learning.*  

  **Strengths:**  
  - Explains why physical inability (Ruiz), lack of verbal knowledge (amnesiac), or false beliefs (tech) don’t negate knowledge-how.  
  - Excludes luck (Garrity), rote recitation (Dan), and unintegrated supports (checklist trainee).  
  - Grounds certification in robust, transferable skill.  

  **Costs:**  
  - **Ambiguity in "internalized":** Nurse Okafor’s chart use is "integrated"; the checklist trainee’s is not. This relies on judgment (but your role requires this).  
  - **AI Exclusion:** Requires accepting that competence is biological/cognitive, not computational. If future systems exhibit genuine adaptive learning, this might need revision.  

  This captures 8.5/9 cases (all except potential AI flexibility). It aligns with your emphasis on *attributable success* and *grasp*, and it justifies your gut on the amnesiac while respecting the stakes of your sign-offs. If you reject AI knowledge-how, hold the line; if not, drop case 9’s verdict and concede the system "knows how" in a functional sense. Either way, your judgments cohere better than you feared.
