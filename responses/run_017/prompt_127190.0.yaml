prompt: |-
  I have a ninety-minute seminar next month with a graduate reading group, and I need a plan for how to explain one idea — not the explanation itself.

  The audience: cognitive-science and vision-science PhD students. They are fluent in signal detection theory, Bayesian cue integration, and the inattentional-blindness literature; none of them has any Indian philosophy, and they are reflexively suspicious of anything that looks like a taxonomy.

  The idea: within the Nyāya framework of pramāṇas (perception, inference, comparison, and testimony — the four the school standardly recognises), knowledge of an absence is a problem case. Knowing that the cat is not in the hall does not look like perception, because there is nothing there to be perceived, and assimilating it to inference looks like smuggling in a universal generalisation that no one has actually established. One way out is to admit a further pramāṇa of non-cognition, of the kind several other schools accept; another is to argue that such knowledge is really perception or inference in disguise. I want the group to feel the pull of both resolutions before I tell them anything about how the dispute went.

  What I want from you:

  1. The dependency structure. What has to be in place before "how can you come to know that something is not there?" even registers as a hard question for people who already have a perfectly good story about failed detection? My assumption is that they first need some grip on what a pramāṇa is for — a route to a successful cognition with a normative dimension, not a justification and not a decision rule — and on the conditions a genuine cognition has to meet (novel, undefeated, about things as they are). Which parts of that are genuinely load-bearing for the negative case, and which can I merely gesture at? I also plan to introduce the Sanskrit term only once the phenomenon is on the table; tell me if that order is wrong.

  2. The carrying example. I want one case, varied along a single dimension, to carry the whole session. My candidate: you come home, open the front door, and conclude that the cat is not in the hall, because she always comes into the hall when that door opens and you neither see nor hear her. Is this the right case, and what must it have and lack? I think it needs (a) an explicit eligibility condition — the cat is the sort of thing that would have been perceived by you under the conditions actually obtaining; and (b) a matched failure case, e.g. the same reasoning while you are in another city and cannot check. I think it must not rest on an explicitly formulated generalisation, or on a probabilistic judgement, or on a threshold applied to an internal signal, since any of those lets the group file the whole problem under machinery they already have and stop thinking.

  3. The misconception map: the misunderstandings in the order this audience will actually produce them, and the exact point in the sequence where each should be defused. The ones I anticipate: (i) this is just inference from the absence of a signal; (ii) this is the argument from ignorance with a Sanskrit name; (iii) non-cognition is not a pramāṇa at all, it is a label for a gap in the taxonomy; (iv) once they grant that absence can be known, the slide to "so absence must be some kind of thing" — the realist treatment of absence, which I would rather they arrive at as a consequence than swallow as a premise; and (v) a wholesale redescription in terms of sensitivity, criterion and miss rate, which quietly changes the subject from warrant to decision policy.

  4. One check at the end that distinguishes "they can now classify cases" from "they see why the negative case matters for a theory of the sources of knowledge" — ideally a fresh case with a new wrinkle, for instance an eligible object together with an unnoticed sensory defect.

  5. What I should openly refuse to cover in ninety minutes with this audience, and say so out loud. My list: the fourfold classification of absence (prior absence, destruction, absolute absence, mutual absence); the later Navya-Nyāya technical vocabulary; postulation as a further pramāṇa; and the cross-school disputes with the Buddhists. Flag any item on that list whose absence would make the session collapse.
reasoning: |-
  Okay, let me tackle this complex seminar planning request. The user is preparing a 90-minute session for cognitive science PhD students on Nyāya philosophy's problem of knowing absences, and needs a structural plan rather than content explanation. 

  First, I need to understand the core challenge: making vision science students grasp why "the cat isn't here" is philosophically problematic when their field already handles absence detection through signal detection theory. The key is creating cognitive dissonance between their technical framework (where absence is just low signal strength) and Nyāya's epistemological concerns about knowledge sources.

  For the dependency structure, I consider starting with what makes knowledge claims special - not just true beliefs but properly formed cognitions. The audience will initially miss why absence poses unique problems since SDT gives them tools to calculate misses/false alarms. I should make them see that Nyāya cares about how the knowledge originates (pramāṇa), not just accuracy metrics. The Sanskrit terms can wait until the puzzle is felt.

  The cat example seems perfect but needs tightening. It must eliminate workarounds: the cat must be highly detectable (audible bell, visible position), the observer must be in ideal conditions (sober, well-lit room), and crucially - no explicit probabilistic reasoning allowed. Maybe add a variant where the cat is hiding to show boundary cases. 

  Anticipating misconceptions is critical. The first objection will be "this is just inference from negative evidence" - which I can counter by showing the inference would require an unsupported universal ("the cat always appears"). Another pitfall is reducing it to signal strength; I need to emphasize that Nyāya distinguishes between psychological process and epistemic warrant.

  For the check, I'm considering adding a twist: what if your glasses are fogged but you don't realize it? This exposes whether they grasp that eligibility conditions must actually hold, not just be assumed. 

  Finally, boundaries: I'll explicitly exclude Navya-Nyāya's complex absence typology and Buddhist counterarguments. These would derail the core puzzle. The session must stay focused on making absence knowledge feel strange again to these experts.

  The plan should build tension: first make absence knowledge seem unremarkable, then systematically remove their standard explanations until the pramāṇa problem becomes unavoidable. The payoff is them feeling why Nyāya debated special non-cognition as a knowledge source.
answer: |-
  Here's a structured plan focusing on your goals, leveraging the cat example, and anticipating audience reactions. It prioritizes creating the conceptual tension before offering resolutions.

  **Core Objective:** Make the audience viscerally feel the tension between **knowing an absence** is robust/justified and **categorizing it** within the four strict pramāṇas, forcing the choice: stretch existing pramāṇas or add a new one.

  **Dependency Structure & Flow (90 Mins):**

  1.  **Setting the Stage: What "Knowing" Means in Nyāya (15 mins)**
      *   **Goal:** Establish the *stakes* and *normative dimension* of a pramāṇa. *This is load-bearing.*
      *   **Method:** Contrast with SDT/Bayes.
          *   Briefly recap SDT/Bayes: Focuses on *accuracy* (hit/miss, correct rejection) under *uncertainty* and *noise*. It's descriptive/predictive of *performance*.
          *   **Introduce Pramāṇa:** Frame it as the Indian answer to "What are the *reliable sources* of *justified true belief* (knowledge)?" Emphasize: **Normative Source** (How *should* knowledge arise?), **Success Condition** (Must yield *pramā* - a veridical cognition), **Specificity** (Each pramāṇa has distinct conditions/object). *Avoid "justification" alone – tie it to the source.*
      *   **Crucial Conditions (Gesture Briefly):** Novelty (not memory), Non-Deceptiveness (undefeated), Correspondence (about things as they are). *Highlight that a pramāṇa guarantees these when functioning correctly.*
      *   **Why this first?** Without understanding pramāṇa as a *normative source type*, the audience will immediately reduce absence-knowledge to SDT performance (correct rejection) and miss the classificatory *problem*. The normative source requirement is key.
      *   **Sanskrit:** Introduce *pramāṇa* and *pramā* here. Define clearly. *Hold "anupalabdhi" (non-cognition) for later.*

  2.  **Introducing the Problem: The Cat Case & Its Weight (25 mins)**
      *   **Goal:** Make "knowing the cat is absent" feel like robust knowledge, then make its classification *within the four pramāṇas* feel impossible.
      *   **Method:** Build the cat case iteratively.
          *   **Scenario 1 (Baseline - Knowledge Feels Secure):** "You arrive home, sober, alert. Open the front door (audible click, creak). Hall light is on, unobstructed view. Cat wears a bell, always reliably comes running/scratches door within 10 seconds when this specific door opens at this time. You see no cat, hear no bell, feel no brush after 15 seconds. You *know* the cat is not in the hall." *Poll: Is this knowledge? (Expect Yes).*
          *   **Why this works:** Explicit eligibility (audible bell, visible position, reliable behavior, ideal conditions). *Feels* perceptual/inferential but deliberately avoids those mechanisms.
          *   **Scenario 2 (Failure Case - Knowledge Not Secured):** "You are in another city. You think about your hall. You recall the cat always comes running. You don't see or hear the cat in your mind's eye. Do you *know* the cat is not in the hall right now?" *Poll: (Expect No). Why?* Highlight: **Lack of Eligibility** - You are not in a position to perceive the hall/cat. Non-cognition here is *irrelevant* to the actual state of the hall.
          *   **The Crucial Question:** "In Scenario 1, *through which normative source (pramāṇa)* did this knowledge (the absence) arise?" Force them to commit to one of the four.
      *   **Systematically Eliminate Options (Audience Brainstorm/Discussion Facilitated):**
          *   **Perception (Pratyakṣa)?** "Did you *perceive* the absence?" Push: What was the sense object? Absence isn't a positive entity hitting your retina/tympanum. You perceived light, surfaces, heard silence (but silence isn't *cat-absence*). Perception requires a positive object. *Block SDT reduction:* "Yes, your visual/auditory systems correctly rejected noise, but *pramāṇa* asks about the *source of the knowledge claim about the cat*, not the signal processing."
          *   **Inference (Anumāna)?** "Did you *infer* the absence?" What's the invariable concomitance (vyāpti)? "Where the cat is eligible and present, it is perceived. I did not perceive it. Therefore, it is absent." *The Problem:* Is "Where the cat is eligible and present, it is perceived" a *known universal truth*? Have you tested it under *all* conditions? (What if cat is asleep? Sick? Hiding exceptionally well *once*?). This universal seems assumed, not established by prior inference or perception of all instances. It feels like you *use* the absence to justify the inference! (*Anticipated Misconception (i) & (ii) hit here*).
          *   **Comparison (Upamāna) / Testimony (Śabda)?** Clearly don't fit. Dismiss quickly.

  3.  **Feeling the Tension & Introducing the Fork (20 mins)**
      *   **State the Impasse:** "So, we have secure knowledge (Scenario 1), but it doesn't neatly fit Perception (no positive object), Inference (smuggled universal), or the other two. What options does this leave a strict Nyāya framework?"
      *   **Present the Fork (Don't Resolve Yet):**
          *   **Option A (Stretch Existing):** "Absence-knowledge *must* be a form of Perception or Inference, however non-standard. We need to argue that absence *is* perceptible (as a distinct entity?) or that the inference's universal *is* somehow secure." (Plant seeds of discomfort: Does this stretch the definitions too far? Is the universal *really* secure?).
          *   **Option B (New Pramāṇa):** "Perhaps there is a distinct source of knowledge: **Non-Apprehension (Anupalabdhi)**. Knowing X is absent *just is* knowing you didn't cognize X *when X would have been cognized if present*." Emphasize: This *requires* the eligibility condition to be met. (*Introduce "anupalabdhi" now*). *Anticipated Misconception (iii):* Immediately counter: "It's not *just* the gap; it's the *knowledge arising from the gap under eligibility conditions* that constitutes the pramāṇa. The gap itself isn't knowledge; the *awareness and interpretation of the gap under the right conditions* is."
      *   **Reinforce Eligibility:** Contrast Scenario 1 (eligible - knowledge) and Scenario 2 (ineligible - not knowledge) using the *anupalabdhi* lens. Eligibility is the *sine qua non*.
      *   ***Avoid Premature Realism:*** If someone says "So absence *is* a thing!", deflect: "Whether absence is a real entity or just a way of talking is a *consequence* of how we resolve this source question. Let's stay focused on the source first." (*Defusing Misconception (iv)*).

  4.  **Check: Do They *Feel* the Problem? The Fresh Case (15 mins)**
      *   **Goal:** Move beyond classifying the cat case to seeing why the source matters for the theory's coherence and handling edge cases.
      *   **The Wrinkle Case:** "Same Scenario 1: You arrive, open the door, conditions seem ideal (light on, quiet)... no cat seen/heard. You conclude cat is absent. *However*, unbeknownst to you, you have suddenly developed a highly specific neurological deficit: you are *completely unable* to perceive cats visually or auditorily (Cat Agnosia Plus!). The cat *is* actually sitting quietly in the hall."
      *   **Discussion:**
          *   Was your cognition *pramā* (veridical)? (No - cat *was* present).
          *   Did you *think* the eligibility conditions were met? (Yes - but they weren't, due to the unnoticed defect).
          *   **Crucial Question:** Does this failure cast doubt on *Perception*? (No, perception is faulty). On *Inference*? (The inference relied on the faulty 'non-perception' as a premise). On *Anupalabdhi*? (Anupalabdhi *requires* actual eligibility - which wasn't met due to the defect. Your non-cognition wasn't *diagnostic* of absence because the condition for diagnosis - your ability - was broken).
      *   **Why this checks understanding:** It shows:
          *   Knowing absence isn't foolproof; it depends on actual eligibility.
          *   Classifying it matters for diagnosing *why* knowledge failed. If it's bundled under perception, the *nature* of the failure (object missing vs. faculty broken) is obscured. Anupalabdhi makes the reliance on faculty competence explicit.
          *   It distinguishes the *source* (anupalabdhi) from the *mechanism* (sensory systems working or not) - blocking Misconception (v).

  5.  **Wrap-up & Explicit Boundaries (5 mins)**
      *   **Summarize Tension:** Reiterate the core problem of classifying robust absence-knowledge within the four pramāṇas and the two broad strategies (stretch old, add new).
      *   **Refuse to Cover (State Clearly):**
          *   "We *won't* dive into the complex fourfold classification of absences (prior, destruction, etc.)."
          *   "We *won't* use later Navya-Nyāya technical terms beyond what's mentioned."
          *   "We *won't* discuss 'postulation' (arthāpatti) as a potential fifth pramāṇa today."
          *   "We *won't* get into the intricate historical debates with Buddhists or other schools."
      *   **Justification:** "These are fascinating but would take us deep into textual details or metaphysics beyond our core question today: **How can the *source* of absence-knowledge be understood within a strict epistemology?** Focusing on this single puzzle case lets us feel the philosophical tension directly."
      *   **Flag:** None of these exclusions collapses the core session. The cat case + wrinkle case + eligibility + pramāṇa definition are sufficient.

  **Misconception Map & Defusing Points:**

  1.  **"This is just inference from absence of signal / SDT correct rejection." (Likely early, during Perception/Inference discussion)**
      *   **Defuse Point:** When analyzing Perception/Inference. Emphasize: "SDT describes *how* the sensory data led to a 'no' response. Nyāya asks *what kind of knowledge source* warrants the *conclusion 'The cat is absent'*? Is that conclusion perceptual? Inferential? If inferential, what's the secure universal premise?"
  2.  **"This is just the argument from ignorance fallacy with a Sanskrit name." (Likely during Inference/Anupalabdhi discussion)**
      *   **Defuse Point:** When presenting the Inference option's flaw. "The fallacy is arguing *to* absence *without* eligibility. Nyāya insists on the *eligibility condition* precisely to avoid this fallacy. Scenario 1 includes it, Scenario 2 doesn't. Non-cognition *requires* eligibility to be knowledge."
  3.  **"Non-cognition isn't a real source, it's just labeling the gap." (Likely when introducing Option B)**
      *   **Defuse Point:** Immediately when introducing Anupalabdhi. "It's not *just* the gap. It's the *cognitive event*: the *awareness* that you haven't cognized X *combined with* the knowledge that X *should* have been cognized *if* present. *This complex cognitive event under these conditions* is proposed as the source."
  4.  **"So absence must be a real 'thing' you perceive." (Likely after introducing Anupalabdhi or during wrap-up)**
      *   **Defuse Point:** When the comment arises or in the Wrinkle case discussion. "That's a *possible metaphysical consequence* some drew, but others resisted. Our focus today is the *epistemological source question*. How do you *know* it? Whether that requires absence to be a 'thing' is a further debate *stemming from* how you answer the source question."
  5.  **Redescription in SDT/Bayes terms (sensitivity, criterion, miss rate). (Likely throughout, especially early)**
      *   **Defuse Point:** Consistently, especially at the start and during the cat case analysis. "That's an excellent description of the *psychological process and performance*. Nyāya is asking a different question: **What *kind* of knowledge source warrants the true belief 'The cat is absent' in this instance?** How does it fit into the taxonomy of fundamental ways we gain justified true beliefs? SDT doesn't answer *that* classificatory question for their epistemology."

  **Why the Cat Case Works:**

  *   **Intuitive:** Everyone understands looking for a pet.
  *   **Eligibility Easily Built:** Audible bell, reliable behavior, good conditions are easy to stipulate.
  *   **Avoids Probabilistic/Threshold Thinking:** By emphasizing "always reliably comes" and "no perception at all", it pushes towards a categorical judgment, not a threshold-based decision. The Wrinkle case reinforces this.
  *   **Avoids Explicit Generalization:** The "always" is part of the *background knowledge establishing eligibility*, not explicitly stated as the major premise of an inference *in the moment*. The knower relies on the *felt reliability*, not a consciously recalled universal.
  *   **Clear Failure Case:** The "other city" scenario cleanly shows eligibility is necessary.

  **Key to Success:** Be relentless in redirecting from mechanistic (SDT/Bayes) descriptions to the *epistemological source classification* question. Keep asking: "But which *pramāṇa* does this use? How does it *fit* the definition?" Let them feel the discomfort of the misfit before offering solutions. The Wrinkle case is your best tool to cement the importance of eligibility and source classification.
