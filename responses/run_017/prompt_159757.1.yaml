  Therefore, we must reject your objection. Please note that this decision is subject to the same recursive application: if you dispute this decision, that dispute too will be diagnosed as verbal. We advise against further correspondence.

  Sincerely,
  [Editor's Name]
  Managing Editor

  ---

  **Template 4: Revise-and-Resubmit as Retranslation Manual**

  Manuscript ID: [JOA-XXXX]
  Title: [Title of the Dispute]
  Author(s): [Author(s)]

  Dear Dr. [Last Name],

  The board finds that the dispute in your manuscript is verbal. However, we note that the work contains valuable material for constructing a retranslation manual between the idiolects of the disputants. 

  We invite you to revise and resubmit the manuscript as a retranslation manual. Specifically, please remove all argumentative content and instead provide:
  - A lexicon of equivalent terms in each idiolect.
  - Rules for translating sentences from one idiolect to the other.
  - Examples demonstrating that the translations preserve truth in the shared factual framework.

  Please see Journal Style Guide, Appendix B: "Retranslation Manual Format."

  Sincerely,
  [Editor's Name]
  Managing Editor

  ---

  **Template 5: Realist Writing in Ontologese**

  Manuscript ID: [JOA-XXXX]
  Title: [Title Arguing for a Privileged Framework]
  Author(s): [Author(s)]

  Dear Dr. [Last Name],

