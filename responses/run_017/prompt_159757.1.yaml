  Manuscript ID: [JOA-XXXX]
  Title: [Title of the Dispute]
  Author(s): [Author(s) of Paper] and [Opposing Author(s), if any]

  Dear Dr. [Last Name] and Dr. [Last Name],

  The board has examined the dispute between you and notes that each party is speaking truly relative to their own idiolect. Specifically, your respective assertions about "[Disputed Entity]" are both correct when translated into a neutral framework that captures the agreed-upon facts. 

  We therefore conclude that there is no substantive disagreement. Per Journal Policy 7.3, we are returning the manuscript without review and request that you cease correspondence on this matter. We recommend that you jointly author a retranslation manual to prevent future misunderstandings.

  Sincerely,
  [Editor's Name]
  Managing Editor

  ---

  **Template 3: Recursive Reply to Objection**

  Manuscript ID: [JOA-XXXX] (Objection to [Previous JOA Manuscript ID])
  Title: "Objection: The Dispute Regarding [Topic] is Not Merely Verbal"
  Author(s): [Author(s)]

