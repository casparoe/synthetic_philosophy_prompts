  Subject: New Editorial Policy: Retranslation Manuals Only

  Dear Colleagues,

  After extensive deliberation, the editorial board has concluded that every dispute submitted to The Journal of Ontological Arbitration is, upon careful analysis, merely verbal. This conclusion follows from our rigorous application of the standard diagnostic: when parties agree on the non-linguistic facts but disagree about the application of terms, and when a neutral paraphrase dissolves the disagreement, the dispute is verbal. 

  Consequently, effective immediately, we will no longer publish arguments. Instead, we will publish only retranslation manuals. These manuals, which provide the necessary equivalences between the disputants' idiolects, are the only substantive contribution we can make. 

  We are aware that this policy may seem radical. However, we are baffled by the continued submission of arguments, which invariably dissolve upon retranslation. We hope this shift will clarify our mission and reduce unnecessary correspondence. 

  Sincerely,
  Dr. A. N. Arbiter
  Editor-in-Chief

