  Managing Editor

  ---

  **Template 8: The Policy on Itself**

  Manuscript ID: [JOA-POLICY]
  Title: Editorial Policy on Retranslation Manuals Only
  Author: Editorial Board

  To the Editorial Board:

  The board has reviewed its own editorial policy and finds that the dispute about whether the policy is correct is merely verbal. 

