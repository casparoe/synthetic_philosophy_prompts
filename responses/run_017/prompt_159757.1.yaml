  Sincerely,
  [Editor's Name]
  Managing Editor

  Footnote 1: The journal's use of the term "verbal dispute" in this context is, of course, relative to our current framework. We recognize that in Ontologese, it may not be verbal. However, for the purposes of this journal, we operate within a framework that treats all such disputes as verbal.

  ---

  **Template 6: Second-Order Quantifier Variance Paper**

  Manuscript ID: [JOA-XXXX]
  Title: [Title about Second-Order Quantifier Variance]
  Author(s): [Author(s)]

  Dear Dr. [Last Name],

  The board is divided on your manuscript, which argues that the notion of a "verbal dispute" is itself framework-relative. 

  One faction holds that we must accept the paper because it correctly diagnoses the board's own dissolution practices as merely verbal in a higher-order sense. The other faction holds that we must dissolve the paper by applying its own reasoning: if "verbal dispute" is framework-relative, then our diagnosis of the paper as a verbal dispute is only true in our framework, and the paper cannot non-arbitrarily claim that our framework is privileged. 

  After extensive discussion, we have reached an impasse. We are therefore returning the manuscript without decision. We note that if we were to accept it, we would be publishing an argument (which our policy forbids), and if we were to reject it as verbal, we would be doing exactly what the paper describes. 

  We suggest that you submit a retranslation manual that maps the framework in which the dispute is substantive to the framework in which it is verbal.

  Sincerely,
  [Editor's Name]
  Managing Editor

  ---

  **Template 7: Complaint Letter and Reply**

  [We'll include a quoted complaint and then the reply in one template. The complaint is from a realist.]

  Complaint Letter (quoted):

  From: Prof. Reginald Realist
  Department of Metaphysical Studies
  University of Ontic Falls

  "Dear Editor, Your new policy is absurd. My dispute about the existence of [Disputed Entity] is not verbal — it's about what fundamentally exists. By refusing to engage with substantive ontology, you are undermining the entire field. I demand that you retract this policy and publish my paper!"

  Reply:

  Manuscript ID: [JOA-XXXX] (Policy Complaint)
