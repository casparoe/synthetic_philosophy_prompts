  The editorial board has reviewed your manuscript and finds that the dispute it describes is merely verbal. Our analysis indicates that both parties agree on the relevant non-linguistic facts (as per section 3 of your paper, where you outline the common ground). However, they disagree about the application of the term "[Disputed Term]." 

  Following our standard diagnostic (see Journal Policy 7.2), we constructed a neutral paraphrase of the dispute in a framework that both parties accept. This paraphrase dissolved the disagreement entirely, as the parties then agreed on the truth of the paraphrased claims. 

  Therefore, we must reject your manuscript for publication. We encourage you to recast your work as a retranslation manual between the idiolects of the disputants, which you may submit under our new policy.

  Sincerely,
  [Editor's Name]
  Managing Editor

