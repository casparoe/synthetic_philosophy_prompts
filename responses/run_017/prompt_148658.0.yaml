answer: |-
  **1. The question, stated so that it has a determinate answer.**
  Under a uniform polynomial-time computational bound for both agent and bookie, does a Dutch book argument for probabilism succeed? If not, does the resulting norm for credences remain probabilistic (e.g., coherence over an efficiently decidable subalgebra) or collapse into permissiveness (e.g., any credence avoiding exploitable bets within the bound)?

  **2. The specific gap in the existing positions.**
  Existing replies dismiss settleability failure as part of logical omniscience or advocate idealization/restricted bet domains. This misses that settleability *itself* fails computationally *even for decidable propositions* (e.g., large Hamiltonian paths), undermining the "sure loss" as a normative threat for bounded agents. Switching to accuracy arguments doesn't resolve this, as accuracy also requires verdicts on truth values.

  **3. The method: formalism, toy model, the ordered cases, and the monthly schedule.**
  *Formalism:* Agent/bookie as probabilistic Turing machines with step-limit T(n). Bets are contracts on propositions like "∃ proof of φ < k bits" payable only if decided within T(k) steps.
  *Cases:* (1) Decidable but expensive (e.g., Hamiltonian path on n-node graph, T(n) = poly(n)), (2) Undecidable but bounded instances (e.g., Diophantine eq. sol < k, T(k) = poly(k)).
  *Schedule:* Month 1: Formalize bounded agent/bookie & settleable bets. Month 2: Analyze synchronic Dutch books in case (1). Month 3: Explore case (2) and contrast with logical omniscience. Month 4: Characterize surviving norm if probabilism fails.

  **4. The possible outcomes.**
  *Positive:* A bounded Dutch book theorem supports probabilism over a computationally feasible subalgebra.
  *Negative:* No such theorem exists, yielding a novel, weaker norm (e.g., avoiding bets exploitably settleable within bound).
  *Failure:* Result merely confirms bounded agents cannot be probabilistically coherent without novel normative implications. *(This outcome is rejected as insufficient)*.

  **5. Scope: what is in, what is cut, and what would have to be true for me not to cut it.**
  *In:* Synchronic coherence for computationally bounded bets.
  *Cut:* Diachronic updating/conditionalization.
  *Rationale:* Adding diachronic analysis compounds complexity without core insight. It remains cut unless Month 2/3 results reveal a *necessary* link between synchronic bounded coherence and updating under the bound. No such link is currently evident.
