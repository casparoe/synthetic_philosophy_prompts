  Additional nuance: Philosophy's "thinner" notions (e.g., functionalism) might align better with craft—if consciousness *is* behavioral, then "reads like a person" is sufficient. But that's contentious. Suggest they highlight the ambiguity via form: make the machine's narration subtly parasitic on human language, exposing its borrowed affects.

