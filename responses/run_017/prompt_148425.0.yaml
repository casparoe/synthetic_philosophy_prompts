  For translation: Their craft terms handle surface behaviors (e.g., "pursuing own ends" maps to "character asserting agency") but struggle with ontology. The "unreliable narrator" concept almost fits AI self-reports but differs because human unreliability assumes consciousness while AI might have zero interiority. "Implied author" could mirror the "training data vs. output" debate but conflates artistic intent with mechanistic origins.

