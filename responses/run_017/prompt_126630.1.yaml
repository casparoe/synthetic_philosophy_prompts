answer: |-
  ## The Anchoring Effect  
  *(Setting: Two philosophers, ALEX (pro-anchoring) and SAM (sceptic), stuck on a delayed London to Edinburgh train, rain streaking the windows. Empty coffee cups litter the table.)*

  **Sam:** (Sighing, tapping fingers) Still reckon this constitutional anchoring lark you pitched dodges the bullet? That epiphenomenalist puzzle about pain reports keeps niggling. If the *feel* does nothing, my saying "I'm in pain" isn't *caused* by the pain. So why isn't it just a lucky guess? Anchoring feels like sleight of hand.

  **Alex:** It’s not sleight of hand, Sam. It’s recognising a different *kind* of knowledge. Think "I am here". I don't *infer* my location from sensory data beamed *by* the location. The utterance "I am here" is *constituted* by my being at the location it denotes. Similarly, "I am experiencing *this*" – where "this" directly hooks onto the phenomenal character present *right now* – is constituted by the very experience it’s about. No causal signal needed. The quale anchors the demonstrative.

  **Sam:** Right, "this". But "I am here" is immune to error through misidentification – I can’t be wrong about *who* is here or *that* I’m here. But "this is a pain"? That’s got a hefty classificatory bit. Suppose I’m wired wrong, and when C-fibres fire, I get the quale of mint. I point at my minty quale and say "this is a pain". Anchoring makes "this" refer to the minty feel, sure. But I’ve *misclassified* it spectacularly as pain. Where’s the knowledge? My judgement latches onto the quale via anchoring, but *what* I say about it – that it's pain – is entirely fixed by sub-personal causal chains involving the C-fibres, not the quale itself. Anchoring gets me *an* experience, but tells me *nothing* about its nature. Is that knowledge?

  **Alex:** (Leans forward) Fair cop. Anchoring secures *reference* and *existence*: I know *that* I’m having *this* experience. The classification *can* go wrong if the conceptual apparatus is faulty or misapplied. But the core epistemic contact – knowing *that* I’m undergoing *this* specific qualitative state – is direct and constituted. It’s like knowing "It is *now*". I might misjudge *what time* it is, but I can’t be wrong *that* it is *now*. Anchoring gives me the demonstrative peg; classification hangs the label. The epiphenomenalist worry was about knowing *my own experience* at all. Anchoring solves *that*.

  **Sam:** Does it? Imagine qualia inversion. Twin-Sam, physically identical to me, stubs his toe. His C-fibres fire, triggering the neural correlate of pain, but due to weird laws, he gets the *quale* I associate with seeing blue. He says "Ouch, that hurts!". By anchoring, "that" hooks onto his blue-ish quale. He judges it’s pain. *His* judgement is true *of his experience* – he’s got a blue-ish experience and calls it pain. *I* stub *my* toe, get the red, searing pain quale, say "Ouch, that hurts!". True for me too. But our introspective reports are identical, anchored to different, inverted qualia! Introspection seems powerless to discriminate the actual qualitative character. It just points blindly: "Yep, got one of *these*, whatever it is, and I’m calling it pain". That feels vacuous. How is this *knowing* my pain rather than just labelling *something*?

  **Alex:** It *is* knowing your *specific* pain! Twin-Sam knows *his* specific quale (the blue-ish one) demonstratively, *as* the thing he’s experiencing. He knows *that* quale exists and is occurring. The fact he mislabels its type doesn’t negate that he’s directly acquainted with *it*. Anchoring guarantees he’s not hallucinating an experience; *this* is present. The knowledge is *de re* knowledge of *this* particular qualitative instance, not necessarily *de dicto* knowledge that it fits the concept 'pain'. It’s thin, but it’s real.

  **Sam:** (Rubs temples) Thin indeed. Okay, here’s where I think it unravels. Anchoring requires the experience to be *present* to constitute the judgement. But what about *past* experiences? Or comparisons? I stub my toe *twice*. The second time feels duller. Five seconds later, I judge: "The second sting was less intense than the first". The *experiences* are gone. What constitutes *that* judgement? If qualia are inert, they can’t causally sustain the memory trace or enable comparison. Anchoring only works *now*. So for judgements about the *past* quale, or comparing qualia across time, you’re back to needing the quale, or a trace *of* it, to do causal work. Which it can’t. The anchoring lifeline snaps. Your "this" has vanished.

  **Alex:** (Pauses, looks out at the rain) That... is genuinely uncomfortable. You’re right. Anchoring works beautifully for the *present* tense demonstrative: "This experience is like *this*". For judgements reaching beyond the specious present – detailed memories, comparisons, aggregations over time – we likely *do* rely on non-phenomenal, causal traces. Neural memory systems encode information *about* the intensity, duration, etc., derived from the physical correlates, not the quale itself. The quale *was* constitutive of the *original* "this!" judgement. But my later judgement "The second was duller" might be caused by, and referentially anchored *via*, those physical memory traces, not the past quale directly.

  **Sam:** Exactly! So for those judgements – which are most of our introspective reports – epiphenomenalism bites again. The quale itself did nothing to fix the *content* of the memory or comparison. The physical machinery did all the work. My belief about the *past* phenomenal character could be entirely detached from what the quale *was* like, even if anchoring secured the original moment. Constitutional anchoring saves the thin "I am experiencing *this* now" from the paradox, but it’s a tiny, fleeting island. Almost everything else we want introspection to do – classify, remember, compare – seems to float on causal chains untouched by the quale. You’ve saved a sliver, but lost the continent.

  **Alex:** Perhaps. But that sliver is crucial. It means the epiphenomenalist *can* grant that I have direct, non-inferential, certain knowledge of my *current* phenomenal state, without the quale causing the judgement. The paradox demanded we either deny self-knowledge or make it accidental. Anchoring shows it’s neither for the present demonstrative case. It *is* limited. But it dissolves the core paradox for the foundational bit: knowing *that* I’m having *this* experience, right now. The rest... (sighs) ...the rest might indeed be hostage to the causal structure of the physical brain. Anchoring isn’t a panacea. But it’s not rubbish either. It shows *how* the epiphenomenalist can have their inert cake and know they’re eating it too, even if only for one bite.

  **Sam:** (A small smile) One bite. Better than none, I suppose. Still feels like the cake is mostly decoration. Pass the terrible train coffee? I need fortification to ponder past pains.

  **Alex:** (Passing a cup) Careful. Judging by the taste, the quale might be the only active ingredient in *this* experience. Cheers.  
  *(Train lurches, finally starting to move.)*
