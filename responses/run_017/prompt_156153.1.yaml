answer: |-
  ## Joint Statement: Migration, Membership, and the Welfare State

  **The question we were convened to answer:**  
  Can a state committed to both universal moral equality and a generous, universalist welfare system permissibly restrict the admission of foreign nationals seeking entry, and if so, on what grounds?

  **Agreed Claims:**

  1.  **Equal Moral Worth:** All human beings possess equal fundamental moral worth, irrespective of citizenship or birthplace. This principle imposes significant justificatory burdens on any state action affecting non-citizens.
  2.  **State Coercion:** Border enforcement involves the use of state coercion against individuals seeking entry; it is not merely the passive withholding of a benefit.
  3.  **Welfare State Fragility:** Sustaining a political consensus for extensive, universal redistribution to strangers is a complex and potentially fragile achievement, requiring specific institutional and social conditions.
  4.  **Gate Distinction Validity:** Separating *Entry* (physical admission/residence), *Access* (eligibility for transfers/services/labor protections), and *Standing* (permanent membership/political rights) clarifies where specific disagreements lie and reveals potential areas of compromise.
  5.  **Empirical Worry Distinction:** The fiscal impact of migration (net contributions at current policy) and the political-economy impact (effect on future levels/conditions of redistribution) are distinct concerns requiring different evidence and potentially different policy responses.
  6.  **Rejection of Zero-Sum Arguments:** Neither side claims existing citizens' rights or welfare are inherently diminished *simply by the presence* of immigrants, nor that exclusion is costless to the excluded.
  7.  **Rejection of Simple Self-Interest:** The restrictionist position is not primarily about protecting existing citizens' absolute material advantage; the open-borders position is not primarily about maximizing economic efficiency or filling labor shortages.
  8.  **The "Hard Case" - Open Borders:** Open-borders proponents acknowledge the genuine difficulty of reconciling immediate, large-scale, unconditional entry with the *political* sustainability of existing universalist institutions in many contexts.
  9.  **The "Hard Case" - Restrictionism:** Restrictionists acknowledge the profound moral tension between the commitment to universal equality and the coercive exclusion of individuals seeking a better life, particularly where no specific harm to citizens is demonstrable.
  10. **Commitment to Evidence:** Both sides accept that empirical claims about fiscal impacts, social cohesion, political feedback loops, and migrant behavior are crucial to the debate and should be subject to rigorous testing.

  **Disagreements:**

  | Crux                                                                 | Open-Borders Formulation                                                                                                 | Restrictionist Formulation                                                                                                 | Verbal/Substantive |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- | :----------------- |
  | **The Nature of the Justificatory Burden**                           | Exclusion demands a justification *to the excluded person* demonstrating specific, significant harm their entry would cause *to them* or unavoidable harm *to others* that outweighs the coercion imposed. | Exclusion requires justification *to the citizenry* that admission would demonstrably undermine the institutional preconditions necessary to sustain their collectively willed, universalist welfare project. | **Substantive**    |
  | **The Primary Threat to the Welfare State**                          | Exclusionary policies themselves undermine universalist principles, eroding the moral basis of the welfare state; the main threat is restrictionism, not migration. | Large-scale, unconditional entry risks overburdening institutions or, more critically, fracturing the political coalition necessary to sustain high levels of universal redistribution. | **Substantive**    |
  | **Permissible Grounds for Restriction**                              | Restrictions are only permissible if demonstrably necessary to prevent severe, imminent, and specific harms (e.g., overwhelming collapse of essential services) that cannot be mitigated by adjusting *access* or *standing* gates. | Restrictions are permissible if necessary to preserve the institutional and political conditions enabling the generous welfare state, even absent proof of *imminent* fiscal collapse or specific harm. | **Substantive**    |
  | **The Role of "Access" as a Compromise**                             | Separating entry from access is a pragmatic compromise acknowledging political realities, but withholding essential public goods and labor protections from residents creates an unjust underclass and violates core liberal equality. | Controlling access is essential for managing the fiscal and political impacts of entry; temporary worker programs without full access can be a legitimate tool to sustain both entry pathways *and* welfare generosity, avoiding pressure on *standing*. | **Substantive**    |
  | **The Coercion Frame vs. Benefit Frame**                             | Framing exclusion as withholding a benefit smuggiles in the assumption that membership is the state's property to give, rather than coercion the state imposes; the coercion frame is fundamental. | While enforcement is coercive, the core issue is the allocation of scarce *membership goods* (rights, benefits); the benefit frame accurately reflects the political reality of distributing finite resources and privileges. | **Primarily Verbal** (Underlying: Is citizenship a default right or a constructed privilege?) |
  | **The Baseline for Measuring Impact**                                | The baseline for assessing harm caused by migrants should be the current institutional setup *adjusted* to accommodate them (e.g., expanding capacity), not the status quo frozen in time. | The baseline must be the existing institutional and political equilibrium; the feasibility and cost of rapid adjustment are central to the restrictionist concern. | **Substantive**    |

  **Tests, with Predictions Recorded in Advance:**

  1.  **Test: The "Nordic Experiment" with Oil Wealth:**
      *   **Case:** Imagine Norway (high trust, strong universal welfare) discovers vast new oil wealth, doubling its GDP/capita overnight. It simultaneously announces unconditional open entry for five years.
      *   **Crux Tested:** Does massive new wealth insulate the welfare state's political sustainability from large-scale, rapid entry? (Touches on fiscal vs. political-economy worries, baseline adjustment).
      *   **Open-Borders Prediction:** Welfare state remains robust. New wealth funds adjustment/expansion, eliminating fiscal pressure. High trust/solidarity institutions absorb newcomers without political collapse. *Why:* Wealth negates fiscal constraint; strong institutions buffer political impact; exclusionary instincts aren't fundamental to solidarity.
      *   **Restrictionist Prediction:** Significant political backlash and pressure to reduce welfare universality/conditionality emerges within 5-10 years. *Why:* Rapid demographic change, even amidst abundance, challenges shared identity and perceived fairness underpinning universalism. Wealth doesn't automatically transfer to institutional/political resilience against identity shocks.

  2.  **Test: Labor Market Access vs. Welfare Access:**
      *   **Case:** Compare two otherwise identical immigrant cohorts over 10 years: Cohort A has full labor market access immediately upon entry but *no access* to welfare transfers for 5 years. Cohort B has immediate access to core welfare transfers but *restricted access* to the formal labor market for 5 years.
      *   **Crux Tested:** Which "access" gate (labor market protections vs. welfare transfers) is more critical to the restrictionist political-economy worry? Which is more tolerable/unjust for the open-borders view?
      *   **Open-Borders Prediction:** Cohort B (welfare access, no work) fares worse socially/economically and generates more native resentment. *Why:* Blocking work creates dependency and stigma, confirming negative stereotypes, undermining integration, and fueling backlash. Work is fundamental to dignity and perception of contribution.
      *   **Restrictionist Prediction:** Cohort B (welfare access, no work) poses a greater perceived fiscal/political risk, potentially fueling backlash faster. *Why:* Immediate draw on transfers without visible economic contribution is the archetype of the "welfare magnet" fear, directly challenging the contributory logic underpinning the welfare state politically, even if net fiscal impact is similar to Cohort A.

  3.  **Test: Voter Response to Framing:**
      *   **Case:** Conduct a large-scale survey experiment. Present voters with identical statistics on immigration levels and fiscal impact. Randomly frame the issue as either (a) "The state using force to keep out peaceful people seeking work/a better life" or (b) "Managing access to our shared membership goods to sustain our welfare system".
      *   **Crux Tested:** Does the framing (coercion vs. benefit allocation) significantly alter support for restrictionist policies, holding facts constant? (Tests the verbal disagreement's political salience).
      *   **Open-Borders Prediction:** Framing (a) significantly *reduces* support for restrictionist policies compared to framing (b). *Why:* Highlighting state coercion triggers moral unease about exclusion, overriding purely instrumental concerns about welfare sustainability.
      *   **Restrictionist Prediction:** Framing (b) may slightly increase support, but framing (a) does *not* drastically reduce support for reasonable controls. *Why:* Voters fundamentally understand citizenship as involving privileged access; concerns about system sustainability are robust and not easily dispelled by reframing the enforcement mechanism.

  4.  **Test: *No Mutually Accepted Test Exists* for the Fundamental Justificatory Burden:**
      *   **Crux:** Whether justification is owed primarily *to the excluded* or *to the citizenry*.
      *   **Reason:** This is a foundational normative disagreement about the nature of political obligation and community. Evidence about impacts (fiscal, political) might inform *what* justifications are offered, but it cannot resolve *to whom* the primary justificatory burden is owed. This is a matter of first principles.
