prompt: |-
  Small favour to ask: I've been handed a pot of money — three funded PhD lines for three years plus a workshop budget, conceptual work only, no empirical economics — and told to spend it on one question: whether, and in what sense, utility is the sort of thing observed choice can tell us about. The funders aren't philosophers; what they actually want to know is whether policy work (cost-benefit analysis, welfare accounting) is entitled to use utility numbers at all. So I owe them three or four questions worth those nine person-years, ranked.

  Can you give me that shortlist with the reasoning attached? I care much less about the list than about what puts something on it: what stays stuck until a given question is anwsered, what a philosopher with three years and no data can realistically settle, and what would move something up or down.

  Two candidates I keep circling, in case they're the real cruxes or in case they're rabbit holes. One: more and more of the choice data we'd actually have is produced by systems choosing on someone's behalf — defaults, recommenders, assistant-style agents acting for a principal — and it isn't clear to me whose utility a revealed-preference argument is recovering there, or whether what's recovered is an objective function rather than a preference at all. Two: when the lotteries aren't handed to us, choice seems to pin down beleif and utility only jointly, and I want to know how badly that undercuts cardinality and interpersonal comparison.

  Also, please mark which bits are settled results — the representation theorems, the identification limits — and which are live disputes among people who work on this. I don't want to hand in a contested claim wearing a consensus costume.
reasoning: |-
  Okay, the user has a significant task: they need to allocate three funded PhD positions over three years to investigate whether utility can be inferred from observed choices, specifically for policy applications like cost-benefit analysis. The funders are non-philosophers who want to know if using utility numbers in policy work is justified. They need a prioritized list of research questions, with reasoning on why each is critical.

  First, I need to unpack their core concerns. The main goal is to validate the use of utility in policy. The user mentioned two specific issues: choice data from algorithmic systems (like defaults or recommenders) and the joint identification problem with beliefs and utilities in non-lottery scenarios. These are likely central to their thinking.

  The user emphasized distinguishing between settled results (like representation theorems) and live disputes. They don't want to present contested claims as consensus. Also, they want realistic outcomes for a 3-year philosophy PhD—no empirical work, just conceptual. So the questions must be tractable within those constraints.

  Looking at their two candidate issues: algorithmic choice delegation and belief-utility entanglement. Both seem crucial. The first challenges whose preferences are revealed when systems act on behalf of users. The second questions whether cardinal utility and interpersonal comparisons are feasible without controlled lotteries. These should be high-priority questions.

  I should structure the questions by impact on policy justification. The most critical would be those that, if unresolved, completely undermine the use of utility in policy. For example, if choice data can't reveal meaningful utility at all, that's a showstopper. Next would be issues that affect how utility is interpreted (cardinal vs. ordinal) or compared across individuals, which are essential for cost-benefit analysis.

  Also, considering real-world applicability. Policy relies on revealed preference, but modern data sources (algorithmic, big data) may not fit traditional models. Questions addressing these contemporary contexts are high priority because they directly impact current policy tools.

  Prioritization factors:  
  - **Stuckness**: How much does progress hinge on answering this?  
  - **Realistic resolution**: Can a PhD make meaningful headway in 3 years?  
  - **Policy impact**: Does the answer directly affect the legitimacy of using utility numbers?  

  Settled results include the basic revealed preference theory (ordinal utility from choices) and representation theorems (like Savage or von Neumann-Morgenstern) under ideal conditions. Live disputes involve applying these to real-world data, interpreting utility cardinality, and interpersonal comparisons.  

  The top question should tackle the fundamental link between choice and utility. Without this, everything else is moot. Hence, Question 1 on whether choice data reveals utility in principle, especially with algorithmic mediators.  

  Second, the belief-utility entanglement affects cardinal utility, which policies need for aggregation. So Question 2 on whether we can isolate utility from beliefs without lotteries.  

  Third, interpersonal comparison is vital for welfare economics but philosophically contentious. Question 3 would explore if choice data can support it.  

  Finally, operationalizing utility in policy given the previous constraints. This is lower priority because it depends on the others but still important for application.  

  The user's hidden needs might include wanting to assure funders that utility can still be used, albeit with caveats, or preparing them for limitations. They might also need the research to provide clear guidelines for policymakers on when utility metrics are valid. Ensuring that the questions address both theoretical soundness and practical feasibility is key.
answer: |-
  Here's a prioritized shortlist of research questions, designed to maximize impact on the funders' core concern (legitimacy of utility in policy), grounded in your constraints, and ranked by conceptual "stuckness," tractability, and policy relevance. Your two candidates are central and form the top two priorities.

  **Prioritization Criteria:**
  1.  **"Stuckness":** How fundamental is this blockage? Does progress elsewhere *depend* on resolving this?
  2.  **Realistic Settlement:** Can conceptual/philosophical work within 3 person-years per question make definitive progress or clearly map the boundaries of impossibility? (Avoiding empirical demands).
  3.  **Policy Impact:** How directly does resolving this question justify or undermine the *specific use* of utility numbers in CBA/welfare accounting?
  4.  **Live Dispute vs. Settled:** Explicitly marked (SD/LD).

  **The Shortlist (Ranked):**

  1.  **Under Delegated Choice (Algorithms, Defaults, Agents), Whose Utility (if Any) is Revealed, and What is its Nature?**
      *   **Why it's #1 (Stuckness & Policy Impact):** This directly attacks the *contemporary reality* of the data policymakers *actually have*. If choices are increasingly mediated by systems acting on behalf of (or influencing) individuals, the foundational link between *observed choice* and *individual utility* is fundamentally broken or transformed. This potentially invalidates *all* standard revealed preference arguments for policy applications using modern data. You *cannot* confidently apply traditional RP logic to this data without resolving this.
      *   **Key Sub-Questions:**
          *   Is the system revealing the *principal's* utility function (perhaps imperfectly), the *designer's* values, a social norm, or something else entirely (e.g., an "objective function" optimizing engagement metrics)?
          *   Does "choice" here even satisfy the minimal axioms (completeness, transitivity) assumed by RP theory? (SD: Axioms require consistency *in the agent making the choice*. But *who* is the agent here? LD).
          *   Can concepts like "stochastic choice" or "menu-dependent preferences" adequately model this, or is a fundamentally new framework needed? (LD).
          *   **Policy Link:** If the utility recovered isn't the individual's, or isn't a "preference" in the welfare-relevant sense, using it for CBA/welfare accounting is illegitimate or requires radical reinterpretation.
      *   **Tractability:** Highly tractable conceptually. Requires analyzing decision theory, philosophy of action (intentionality, agency), philosophy of technology (opacity of algorithms), and welfare economics. Progress is possible in defining the problem space, critiquing existing attempts, and proposing coherent frameworks (even if not universally accepted).
      *   **Settled/Live:** **Primarily Live Dispute (LD).** This is a cutting-edge problem driven by technological change. Basic RP assumes a single, identifiable agent. Delegation shatters that assumption. Representation theorems don't address this scenario directly.

  2.  **Can Cardinal Utility and Interpersonal Comparisons Be Grounded in Non-Lottery Choice Data, Given Belief-Utility Entanglement?**
      *   **Why it's #2 (Stuckness & Policy Impact):** Policy work *requires* cardinal utility (for weighing costs/benefits) and interpersonal comparisons (for aggregation). The standard escape hatch – lotteries revealing risk attitudes – is largely unavailable in "real-world" policy data (choices over certain goods, policies, time). Without it, choice data fundamentally *underdetermines* cardinal utility and isolates it from beliefs. This creates massive ambiguity. Answering how badly this undercuts cardinality/comparison is essential to know *what kind* of utility number, if any, policy can use.
      *   **Key Sub-Questions:**
          *   How robust is cardinal utility derived *only* from Savage-style acts (choices under uncertainty) to the *specification* of the state space and consequences? (SD: Cardinal utility is unique up to positive affine transformation *given* a fixed state space and consequence set. LD: How fixed/agreed are these in practice?).
          *   Can "rich" choice environments (e.g., choices over menus, information, or social comparisons) or specific assumptions (e.g., homogeneous beliefs, hedonic framing) break the entanglement without explicit lotteries? (LD).
          *   Do revealed preference approaches to interpersonal comparison (e.g., Harsanyi, extended sympathy, choice behind a veil) *require* cardinality derived from uncertainty, or can they work with ordinal+? (LD: Deeply contentious).
          *   **Policy Link:** If cardinality/comparison cannot be grounded without unrealistic lottery data or controversial assumptions, the use of aggregated utility numbers in CBA loses its revealed-preference justification and relies on ethical stipulation.
      *   **Tractability:** Highly tractable conceptually. Requires deep analysis of decision theory (Savage, Anscombe-Aumann), measurement theory, and the literature on interpersonal comparison. A PhD can rigorously map the logical dependencies, evaluate proposed solutions, and clarify the *minimum* required assumptions (showing their fragility or plausibility).
      *   **Settled/Live:** **Mix.**
          *   *Settled (SD):* The identification problem (utility/belief entanglement without lotteries/specific structures) is a fundamental *logical* limit of choice data alone. Representation theorems show *what is required* (uncertainty, specific axioms) to achieve separation.
          *   *Live Dispute (LD):* Whether workarounds using non-standard choice data are valid, the plausibility of assumptions needed for comparison, and the *significance* of the underdetermination for policy (is it fatal or manageable?).

  3.  **Does "Utility" Recovered via Revealed Preference Necessarily Correspond to a Concept Relevant to Welfare?**
      *   **Why it's #3 (Stuckness & Foundational):** Even if we *can* recover *some* utility function from choices (ordinal or cardinal), is this the "utility" that *should* guide policy? This questions the normative leap from "is chosen" to "is good for the chooser". It addresses the "in what sense" part of your mandate most directly.
      *   **Key Sub-Questions:**
          *   Does revealed preference utility capture *well-being* (hedonic, desire-fulfillment, objective list) or merely *behavioral consistency*? (LD: The "Happiness vs. Preference Satisfaction" debate).
          *   How do standard critiques (adaptive preferences, lack of information, self-control issues) interact with the *identification* problems in Q1 & Q2? Does resolving Q1/Q2 make this problem harder or easier? (LD).
          *   Are there coherent philosophical alternatives to welfarism grounded *only* in choice data that avoid utility? (e.g., resourcism, capabilities - but can *they* be measured from choice?) (LD).
          *   **Policy Link:** If revealed utility doesn't track welfare, using it as the *numeraire* in CBA is fundamentally misguided, regardless of technical identification.
      *   **Tractability:** Tractability is moderate. This engages deep normative philosophy (welfare, paternalism, perfectionism) alongside decision theory. A PhD can rigorously articulate the competing conceptions of welfare, map their (in)compatibility with revealed preference, and assess the normative weight of the critiques against RP-based welfare. Definitive "settlement" is less likely than clarification and strong argumentation.
      *   **Settled/Live:** **Primarily Live Dispute (LD).** While the *existence* of critiques (adaptive prefs, etc.) is settled, their *significance* for the normative validity of using revealed utility in policy is hotly debated. The link between revealed preference and specific welfare theories is contested.

  4.  **Operationalizing Utility for Policy: Can Coherent, Choice-Based Alternatives to Full Cardinal Comparison Emerge Given the Constraints?**
      *   **Why it's #4 (Downstream & Constructive):** This question assumes the conclusions of Q1-Q3 (especially the limitations) and asks: *If* full-blown utility-based CBA is undermined, what *can* policy legitimately do with choice data? It shifts from critique to potential reconstruction.
      *   **Key Sub-Questions:**
          *   Can "local" cardinality (within specific, comparable domains) or ordinal rankings with qualitative intensity judgments be rigorously defended based on choice patterns? (LD).
          *   Does the concept of "Opportunity Sets" or "Freedom of Choice" provide a more robust basis for welfare assessment using choice data than utility aggregation? (LD).
          *   Can insights from Q1 (delegated choice) be used to *define* welfare-relevant preferences *procedurally* (e.g., preferences revealed under conditions of full agency/transparency, even if hypothetical)? (LD).
          *   **Policy Link:** Provides a "so what?" answer for funders. Even if ideal utility is off the table, this explores salvageable, choice-grounded methods for welfare-informed policy.
      *   **Tractability:** Moderately tractable. Requires synthesizing conclusions from the earlier questions and creatively exploring alternatives within decision theory, social choice, and welfare economics. Output is likely frameworks or arguments for specific constrained approaches, not universal solutions.
      *   **Settled/Live:** **Primarily Live Dispute (LD).** This is about proposing and defending novel or under-explored frameworks in light of the identified limitations. There's no settled "second-best" approach.

  **Why the Ranking & How to Move Up/Down:**

  *   **Q1 is Paramount:** Modern data breaks the core mechanism. Without progress here, work on Q2-Q4 might be analyzing a model inapplicable to reality. If preliminary work shows the delegation problem is *insurmountable* for RP welfare, it could dominate the entire project. If tractable frameworks emerge, it validates moving on.
  *   **Q2 is the Core Technical Hurdle for Policy Tools:** Cardinality and comparison are the *sine qua non* for utility-based CBA. Progress here (even showing it's impossible without X) is essential for telling funders *what they can actually claim* from their numbers. If resolved negatively, Q4 becomes crucial. If resolved positively (or with manageable caveats), it strengthens the case for utility.
  *   **Q3 is Foundational but Potentially Less Actionable for Funders:** Funders might care *less* if utility reflects "true welfare" if choice data is all they have and RP is the established methodology. However, it's crucial for philosophical legitimacy. If Q1/Q2 show robust recovery *is* possible, Q3 moves up. If Q1/Q2 show fragility, Q3 becomes even more critical ("Even if we *can* measure it, *should* we?").
  *   **Q4 is Contingent:** It's only vital if Q1-Q3 seriously undermine the standard approach. It's lower priority initially because it builds on the others. Positive, constructive results in Q1-Q3 could make it less urgent. Highly negative results in Q1-Q3 make it essential.

  **Regarding Your Candidates:**

  *   Your **first candidate (Delegated Choice)** is absolutely the top priority (#1) for the reasons above. It's the most direct attack on the relevance of contemporary data.
  *   Your **second candidate (Belief-Utility Entanglement/Cardinality)** is the perfectly targeted #2. It addresses the core technical requirement (cardinality/comparison) for policy and exposes a fundamental limitation of non-lottery data.

  This structure ensures the most critical, tractable, and policy-relevant conceptual blockages are addressed first, providing the funders with a clear-eyed assessment of the foundations (and potential alternatives) for using utility numbers derived from the choice data they actually encounter. Good luck!
