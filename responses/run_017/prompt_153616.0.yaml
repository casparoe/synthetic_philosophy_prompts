prompt: |-
  I am a journalist working on a long piece about how researchers, funders, and policy people who study risks to humanity's long-term future talk about human extinction, and I have now run into the same shape of claim in enough interviews that I want to know whether it has a name and, if so, where its edges are.

  Here is the shape. Everyone I speak to agrees that extinction would be a catastrophe. When I strip away the deaths and the suffering — suppose the end were instantaneous and painless, and suppose everyone alive had already lived a full life — they converge on something like this: what is lost is not a matter of anyone being made worse off. Pressed to say more, the answers split. One group says the loss is retrospective: the work done this year, the symphony, the vaccine, the raising of a child, would turn out not to have had the point it was thought to have. Another group says no, their projects would still have had their point; what is lost is prospective and victimless — an enormous quantity of good that would have happened simply will not happen, and that is a disaster even though there is nobody it is a disaster for.

  What I cannot place is that these same people, often in the same conversation, deny the mirror-image claim. They explicitly reject the thought that we lose something by not bringing additional flourishing people into existence: a society with a falling birth rate is not, on their view, incurring a loss of value on that account. Yet the non-existence of future people is precisely what they count as the central loss in extinction. When I offer them the replacement case — humanity ends, but the planet is immediately occupied by other beings whose lives go just as well, and who remember nothing of us — they divide sharply, and the division does not track any of their other disagreements. One further boundary I cannot locate: several said the retrospective version only bites if the end is close enough to fall inside the world they are living in, and that an end ten centuries out threatens nothing they care about.

  I read a review some time ago of a philosopher's book — I believe it grew out of lectures on death — arguing that nearly everything we value silently presupposes that people will be around after we die, so that extinction would hollow out our present concerns. I assumed that was what my interviewees were reaching for. It is not quite: when I put it to them, more than one said that their projects would still matter, and that what would be lost is the future itself.

  So: is there an established concept for this configuration — treating the non-existence of possible future people as an enormous loss in one direction while treating the non-existence of merely possible additional people as no loss at all — and is what I have described one phenomenon or two? If there is a name, I want the carving rather than the label: how it differs from the nearby views about who can be harmed by not being brought into existence, and how it differs from the view in the book I have described. If there is no name, I would like you to coin and define one, to say whether the retrospective and prospective articulations are genuinely separable, and to say whether the split over the replacement case shows a single intuition or several. I also need to know what would count as evidence that this is simply an inconsistency in how this community talks, since that is the deflationary explanation I would have to take seriously in the piece.
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're exploring how experts discuss human extinction, noticing a pattern where extinction is seen as a catastrophic loss of future potential, but not creating more people isn't seen as a loss. The key puzzle is the asymmetry: why is the absence of future humans bad, but not creating additional people now not bad? 

  First, I need to recall the philosophical concepts that might apply here. The reporter mentions the Non-Identity Problem and Person-Affecting Views. The Non-Identity Problem, from Derek Parfit, deals with how different choices affect who exists. Traditional ethics struggles because if a choice leads to a different set of people, you can't say the outcome is worse for any specific individual. That might explain why declining birth rates aren't seen as a loss—since the people who would have existed don't, so there's no one harmed.

  But extinction is different. If humanity goes extinct, there are no future people at all. The loss here isn't about harming individuals but about the absence of a valuable future. This ties into Impersonal Totalism, where value is about the total good, regardless of who experiences it. So extinction reduces the total good, which is bad even without victims.

  The reporter also mentions the retrospective view—extinction makes past actions pointless. This sounds like Samuel Scheffler's idea in "Death and the Afterlife." He argues that our projects derive meaning from humanity's continuity. But the interviewees differentiate; some say their projects still matter, but the future's potential is lost. So maybe Scheffler's view isn't a perfect fit here.

  Then there's the replacement case: aliens taking over. The division here is interesting. Those who still see a loss might hold a human-specific view, valuing humanity's unique continuation. Others who don't see a loss might prioritize sentient life in general. This split suggests different underlying values—species chauvinism vs. impartial sentientism.

  The asymmetry between extinction and not creating more people might stem from Person-Affecting Restrictions. If you believe something is only bad if it affects existing or future people (who will exist no matter what), then not creating more people doesn't harm anyone specific. But extinction prevents future people who otherwise would exist, so it's a loss of potential. 

  Evidence of inconsistency could be if the same experts apply different principles to similar scenarios. For example, if they value potential future humans in extinction but disregard potential humans in low birth rates, that might be inconsistent unless justified by different principles like continuity or identity dependence. The reporter needs to probe if experts can explain this distinction without contradiction.
answer: |-
  This precise configuration of views is a recognized philosophical puzzle, often called the **Asymmetry Problem in Population Ethics** (or sometimes **Parfit's Asymmetry**). It's a core challenge to theories about the value of creating future lives. Your observations capture its essence brilliantly, and the divisions you note reveal key fault lines.

  **The Carving: Core Elements and Boundaries**

  1.  **The Asymmetry Itself:**
      *   **Loss in Extinction:** Preventing the existence of *all* future people (extinction) is seen as a massive, catastrophic loss of value, even if it harms no one (because there are no victims).
      *   **No Loss in Non-Creation:** Choosing *not* to bring additional specific possible people into existence (low birth rate) is generally *not* seen as a loss of value, even though flourishing lives are not created.

  2.  **How it Differs from Nearby Views:**
      *   **The Non-Identity Problem (Derek Parfit):** This is the *context* for the asymmetry, not the asymmetry itself. The Non-Identity Problem shows that choices affecting who exists (like policies impacting future generations or individual procreative choices) cannot be easily judged as "worse for" specific future individuals because different choices lead to *different* individuals existing. The Asymmetry Problem arises *within* attempts to solve the Non-Identity Problem – specifically, why we intuitively judge extinction as uniquely bad while accepting that not creating specific potential people is permissible or neutral.
      *   **Person-Affecting Views vs. Impersonal Views:** The Asymmetry straddles this divide.
          *   **Person-Affecting Principle (PAP):** Something is bad only if it is bad *for* a particular person. Low birth rates seem compatible with PAP (no one is harmed by not being born). Extinction seems to violate PAP (no future victims exist to be harmed). *The asymmetry arises because extinction feels bad despite seeming to satisfy PAP.*
          *   **Impersonal Totalism:** Value is simply about maximizing the total amount of good (e.g., happiness, flourishing) in the universe, irrespective of who experiences it. This view *easily* explains the badness of extinction (massive loss of potential good) but *cannot* explain the permissibility of not creating additional flourishing lives (which also loses potential good). *The asymmetry arises because we reject the implication that we have a strong duty to create as many happy people as possible.*
      *   **"Harm" by Non-Existence:** The Asymmetry directly confronts the question: "Can someone be harmed by not being brought into existence?" Standard analyses say *no* (non-existence isn't a state *of* a person that can be compared unfavorably to existence; there *is* no subject to be harmed). This supports the "no loss" view for individual non-creation. However, extinction seems like a different *kind* of harm – not to individuals, but to the *potential* for value itself.

  3.  **The Book You Recall (Samuel Scheffler):**
      *   Scheffler's *Death and the Afterlife* (based on his Tanner Lectures) argues that our present values and commitments profoundly depend on the "afterlife" – the continued existence of humanity after our individual deaths. Extinction would "hollow out" current meaning. This is the **Retrospective Loss** view.
      *   **Distinction:** Scheffler focuses on the *undermining of present/past meaning*. Your interviewees offering the **Prospective Loss** view ("loss is the future itself") emphasize the *independent value of the unrealized future good*, regardless of its connection to present meaning. While related, these are distinct emphases. Scheffler's view is one influential articulation of the retrospective strand, but the prospective view stands apart.

  **Your Specific Observations: Splits and Boundaries**

  1.  **Retrospective vs. Prospective Loss:** These are genuinely separable intuitions, though they often coexist.
      *   **Retrospective (Scheffler-esque):** Loss of meaning, pointlessness of past efforts. *Requires a connection to the present/past.* This explains why a distant extinction might not feel like a loss *to them* – it doesn't threaten *their* world or the meaning of *their* projects.
      *   **Prospective (Impersonal Value):** Loss of the independent good that *would* have existed. *Does not inherently require connection to the present.* The value lost is intrinsic to the future flourishing itself. A distant extinction would still be a massive loss of potential value on this view.
  2.  **The Replacement Case Split:** This is crucial and reveals different foundational commitments.
      *   **Group A (Loss persists):** Holds a **Human-Chauvinist** or **Particularist** view. The value lost in extinction is specifically the value of *human* continuation, achievement, experience, or potential. Replacing humans with equally flourishing non-humans doesn't compensate for the loss of the *human* future. Value is tied to the *type* of being or the specific chain of continuity.
      *   **Group B (Loss vanishes):** Holds a **Sentientist** or **Generalized Potential Value** view. The primary bad of extinction is the loss of *sentient flourishing* or *realized potential value* itself. If another species achieves equivalent flourishing, the total amount of good is preserved; the specific vessel (humanity) doesn't matter intrinsically. The loss is compensated.
      *   *This split shows multiple underlying intuitions:* The value of species identity/continuity vs. the value of abstract sentient flourishing/potential realization. It's not one phenomenon.
  3.  **The "Close Enough" Boundary:** This aligns strongly with the **Retrospective Loss** view. The badness stems from the *impact on the present/past meaning within one's own temporal horizon*. A distant extinction lies beyond that horizon. Those holding the pure **Prospective Loss** view should see a distant extinction as equally bad (in terms of lost potential good), just perhaps less motivationally salient.

  **Is it Inconsistency? Evidence for the Deflationary View**

  It *could* be inconsistency, and evidence would include:
  1.  **Failure to Articulate Principles:** If interviewees cannot state a coherent principle distinguishing the cases beyond "extinction just *feels* different/bigger" without falling into contradiction when pressed with analogues (like large-scale non-creation scenarios).
  2.  **Inability to Resolve the Replacement Split:** If proponents of either side of the replacement case cannot explain their position in a way that also accounts for the core asymmetry without special pleading for "humanity" in one direction but not the other.
  3.  **Motivated Reasoning:** If the field is deeply invested in extinction risk as a paramount concern, there might be psychological resistance to views that minimize its uniqueness (e.g., accepting the replacement case or downplaying distant extinction). Conversely, discomfort with the "repugnant conclusion" (that we *should* create vast numbers of minimally happy lives) motivates rejecting the duty to create in the low-birth-rate case.
  4.  **Conflation of Scale and Kind:** Treating extinction differently *only* because of its vast scale, while the underlying logic (loss of potential good without victims) applies equally to smaller-scale non-creation. If they cannot justify why scale makes a *qualitative* difference (beyond quantitative magnitude) that aligns with the asymmetry, it suggests inconsistency.

  **Coining a Term: The Extinction-Potential Asymmetry (EPA)**

  While "Parfit's Asymmetry" is established, a more precise term for *this specific configuration in the extinction-risk context* could be the **Extinction-Potential Asymmetry (EPA)**.

  *   **Definition:** The ethical stance holding that:
      *   (a) Human extinction constitutes a unique, catastrophic loss of value, understood either retrospectively (undermining present/past meaning) or prospectively (loss of vast future potential good), even though it harms no existing or future victim.
      *   (b) Choosing not to create additional, specific potential flourishing human lives (e.g., via low birth rates) does *not* constitute a significant loss of value.
      *   (c) This stance persists despite the apparent tension between (a) and (b), justified by appeals to differences in continuity, scale, identity dependence, or the nature of the potential lost.
  *   **EPA Subtypes:**
      *   *Retrospective EPA:* Focuses on loss of meaning (Scheffler-inspired).
      *   *Prospective EPA:* Focuses on loss of abstract future good.
      *   *Human-Chauvinist EPA:* Loss is specifically tied to human potential/continuity (replacement = loss).
      *   *Sentientist EPA:* Loss is tied to generic sentient flourishing (replacement = compensation).

  **Conclusion**

  You are observing the **Asymmetry Problem in Population Ethics**, vividly illustrated through the lens of human extinction. It's one core puzzle (why is extinction bad without victims while non-creation isn't?) but manifests in different articulations (retrospective vs. prospective) and reveals deeper splits (human-chauvinist vs. sentientist responses to replacement). The "close enough" boundary primarily supports the retrospective view. Whether it's ultimately an inconsistency depends on whether proponents can articulate a coherent, non-arbitrary principle distinguishing the loss in extinction from the non-loss in individual non-creation that withstands scrutiny through thought experiments like the replacement case. The divisions you note are not signs of a single flawed concept, but rather the fracturing of a deep philosophical problem into distinct, often incompatible, solutions.
