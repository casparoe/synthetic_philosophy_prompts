answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. It forces students to engage deeply with the heterogeneity problem’s structural implications for hedonism.

  ---

  ### **Essay Question**  
  **Time Allocation:** 45 minutes (approx.)  
  **Word Guidance:** 600-800 words  

  **Hedonism claims that pleasure is the sole intrinsic good and that we ought to maximize net pleasure. A key appeal of hedonism is the "one-lever requirement": it promises a single scale (one lever) for evaluating all choices, where:  
  (a) Any two options can be ranked as better, worse, or equal;  
  (b) There is a common unit of measurement for pleasure;  
  (c) The ranking is fixed solely by hedonic facts (facts about pleasure), not external values.**  

  However, the **heterogeneity problem** argues that pleasures are too diverse to be reduced to a single scale. Consider two cases:  

  1.  **The Swap:** Priya experiences two events:  
      -   Finishing a complex mathematical proof feels *to her* like a bodily itch-scratch (tingling, localized warmth, relief).  
      -   Scratching an itch feels *to her* like the quiet, diffuse satisfaction others associate with intellectual work.  
      Which experience is more pleasant? Justify your answer. What costs does your answer impose on hedonism?  

  2.  **The Split Judges:** Two fully informed, rational individuals have lived both a life rich in athletic/bodily pleasures and a life rich in intellectual pleasures. They stably disagree about which life contained more net pleasure overall. Neither is demonstrably mistaken (no misinformation, distraction, weakness of will, or self-deception). Is there a fact of the matter about which life had more pleasure? Explain why or why not, and what this implies for hedonism.  

  **Your Task:**  
  -   Precisely state **what the heterogeneity problem threatens** (e.g., the nature of pleasure, why it’s good, or the usability of "maximize pleasure" as a decision procedure).  
  -   Analyze **both cases**, showing how they challenge specific parts of the one-lever requirement (a, b, c).  
  -   Conclude: Can hedonism survive the heterogeneity problem? **If yes**, which part(s) of the one-lever requirement must it abandon or modify, and what is the cost? **If no**, why is it fatal?  

  ---

  ### **Model Answer (Committed Stance)**  
  **Hedonism survives only by abandoning a common unit of pleasure (lever b), rendering "maximize pleasure" practically unusable for interpersonal aggregation. The heterogeneity problem is ultimately a problem about measurement and decision-procedure.**  

  The heterogeneity problem challenges whether diverse pleasures share a common property that allows quantitative comparison *for the purpose of ranking choices*. It threatens lever (b) and lever (a). If pleasures lack a common unit, we cannot sum them (breaking utilitarianism), and may not even be able to rank all options (breaking lever a). Lever (c) is threatened only if we smuggle in non-hedonic values to "rescue" the scale.  

  **Case 1: The Swap**  
  Priya’s case shows that the felt character of an experience (its "what-it’s-like") and the activity producing it can come apart. If pleasantness is defined by *felt quality* (e.g., tingle/warmth), then Priya’s proof-finishing is more pleasant. But this reduces Mill’s "higher" pleasures to contingent sensory labels: intellectual activities aren’t inherently superior; they merely *cause* sensations we label pleasant. Mill’s qualitative hierarchy collapses into Benthamite sensory intensity. If pleasantness is defined by the *activity type* (e.g., intellectual achievement), then Priya’s itch-scratch is more pleasant. But this severs pleasure from experience; hedonism becomes a desire-satisfaction or perfectionist theory ("intellectual activities are better") disguised as experientialism. Hedonism’s core appeal—that goodness is *evident in the experience itself*—evaporates. **This case forces hedonists to choose: either gut Mill’s hierarchy (lever c compromised) or gut the link to phenomenology (breaking lever b/c).**  

  **Case 2: The Split Judges**  
  The disagreement here is stable and rational. There are three options:  
  1.  **There is a fact of the matter:** But the only evidence—first-person experience—is exhausted. To insist on a hidden fact posits an unknowable "pleasure substance," making lever (b) epistemically inaccessible and lever (a) useless for decision-making.  
  2.  **There is no fact:** Then "amount of pleasure" is judge-relative. Lever (b) (common unit) fails. Aggregation across persons (e.g., for utilitarianism) becomes impossible without arbitrary weightings.  
  3.  **One judge is right:** But with no error possible, this is question-begging (e.g., "competent judges prefer intellect" assumes the hierarchy it tries to justify).  
  **This case breaks lever (b): Without interpersonal comparability, "maximize pleasure" lacks meaning in social choice.**  

  **Can Hedonism Survive?**  
  Hedonism survives only as a *theory of value for an individual*, abandoning lever (b). We can say:  
  -   *For one person*, pleasures might be rankable (lever a holds if we accept qualitative hierarchies *within* a life).  
  -   The ranking *is* fixed by hedonic facts (lever c holds), if we define pleasure as a *dispositional attitude* (e.g., "would I want to prolong this?") rather than a sensation.  
  But this costs hedonism its practical and moral force:  
  1.  **Utilitarianism dies:** No interpersonal comparisons → no social welfare function.  
  2.  **Pleasure becomes theory-laden:** Defining it as an attitude (not a feel) makes its goodness less "evident"; we need a prior theory of what attitudes are rational.  
  3.  **The one-lever breaks:** Without lever (b), we have many levers (individual scales), not one.  

  **Conclusion:** Heterogeneity forces hedonism to retreat to agent-relative value. It "survives" only by sacrificing its promise of a universal calculus for ethics.  

  ---

  ### **Marking Scheme (Total: 20 Marks)**  
  1.  **Precise Problem Diagnosis (4 marks)**  
      -   *A/B Split:* **B** says "it’s about measuring pleasure." **A** specifies *which levers* are threatened (e.g., "breaks lever b, risking lever a").  
      -   *Common Error:* Vaguely calls it "a problem for comparing pleasures" without linking to decision-procedure or levers.  

  2.  **Case 1 Analysis (4 marks)**  
      -   *A/B Split:* **B** identifies the tension (e.g., "if pleasantness is sensation, Mill fails"). **A** shows *how* it threatens levers (e.g., "If activity defines pleasure, lever c is broken by importing non-phenomenal value").  
      -   *Common Error:* Assumes pleasantness must follow sensation or activity without exploring costs.  

  3.  **Case 2 Analysis (4 marks)**  
      -   *A/B Split:* **B** notes that no fact of the matter implies incomparability. **A** argues *why* insisting on a fact breaks levers (e.g., "makes lever b epistemically inaccessible").  
      -   *Common Error:* Claims one judge must be "objectively wrong" without addressing "no identifiable error."  

  4.  **Lever Requirement Clarity (4 marks)**  
      -   *A/B Split:* **B** correctly identifies which lever(s) must be abandoned (e.g., "hedonism must drop lever b"). **A** explains the *cost* of abandoning it (e.g., "destroys interpersonal aggregation").  
      -   *Common Error:* Suggests dropping a lever without stating which one or what it entails.  

  5.  **Conclusion & Stance (4 marks)**  
      -   *A/B Split:* **B** says hedonism survives in a weaker form. **A** states *what non-circular criterion* could replace sensory pleasure (e.g., "dispositional attitude") and its *cost* (e.g., "makes pleasure’s goodness non-evident").  
      -   *Common Error:* Concludes hedonism is "imperfect but salvageable" without specifying how.  

  **A vs. B Threshold:**  
  -   **B (14-16/20):** Identifies circularity in Mill/competent judges, correctly analyzes cases, drops one lever.  
  -   **A (17-20/20):** Explains **what a non-sensory, non-circular basis for pleasure quality would require** (e.g., functional role/attitude) and **explicitly states the cost to hedonism’s foundations** (e.g., "loses experiential self-evidence" or "cannot support social utility maximization").  

  ---

  ### **Technical Notes & Whiteboard Hint**  
  -   **Model Answer Assumption:** It uses a "dispositional attitude" view of pleasure (e.g., Feldman’s *Pleasure and the Good Life*), which may not have been taught.  
  -   **Whiteboard Hint:** *"Heterogeneity isn’t about the feel—it’s about whether diverse pleasures can share a measurable property WITHOUT importing non-hedonic values. What would that property be?"*  

  This structure blocks "quantity vs. quality" regurgitation by forcing engagement with measurement, phenomenology, and decision-procedure. The cases ensure Mill’s move alone is insufficient (as Priya’s preferences invert the hierarchy, and Split Judges show competent judges can disagree).
