  Okay, the user is grappling with a passage on moral uncertainty from a blogger and is unsure how much to trust it. They've shared the passage and their friend's critique, seeking an assessment of its fairness, validity of specific claims, and whether the "just go with your favorite theory" conclusion holds. 

  First, I need to unpack the blogger's core argument: treating moral uncertainty like factual uncertainty through expected choice-worthiness maximization. The user seems intellectually engaged but wary—they're quoting both the blogger and a philosophy-grad friend, indicating they're triangulating perspectives. Their underlying need might be epistemic security: "How should I actually navigate moral uncertainty without getting led astray?" 

  The blogger's passage has several bold claims that set off my philosophy radar. Claiming expected choice-worthiness is "the only rationally permissible rule" is a huge overstatement—this is hotly debated in metaethics. The "dissolves moral disagreement" bit is also suspicious; it ignores how deeply theory-laden empirical disagreements can be. And the dismissal of the "swamping" problem as a refutation feels glib—it's a major technical hurdle, not just a quibble. 

  The friend's objections are sharper than the user might realize. The "how good by the theory's lights" point is crucial: utilitarianism spits out numbers, but how does deontology quantify "duty-fulfillment units"? And theories like fanaticism or divine command might explicitly reject uncertainty-handling—what then? The regress worry ("uncertain about uncertainty-handling") is also serious. 

  For the "just go with your favorite" fallback—it's defensible pragmatically, but philosophically shallow. If I were advising the user, I'd note that real-world moral agents often default to this, but scholars like MacAskill or Lockhart argue for more nuanced approaches (variance normalization, lexical thresholds). Still, in practice, avoiding long-shot exploitation might justify it. 

  Overall, the blogger's confidence exceeds warrant. Their framing as settled truth ("straightforwardly irrational") ignores live debates. The user deserves to know this isn't consensus—it's one contested framework among many. I'll structure the reply to validate their skepticism while clarifying where the core insights hold merit.
answer: |-
  Here's a breakdown of the passage's fairness, identifying accurate points, overstatements, and the validity of the "just go with your favorite" conclusion, incorporating your friend's insightful objections:

  **Core Insight (Partially Accepted):**
  The *idea* of treating deep moral uncertainty like factual uncertainty and using a weighted average approach (Expected Choice-Worthiness - EC) is a **serious and influential proposal** within contemporary moral philosophy (e.g., work by William MacAskill, Toby Ord, Hilary Greaves, David Thorstad). It's not dismissed, and exploring it is valuable.

  **Key Overstatements, Conflations, and Problems:**

  1.  **"The *only* rationally permissible rule" / "straightforwardly irrational": (Major Overstatement)**
      *   This is highly contentious. Moral uncertainty is fundamentally different from factual uncertainty. Factual uncertainty is about *what the world is like*; moral uncertainty is often about *what fundamentally matters* or *how to reason about value*. Many philosophers argue there is no single, obviously "rational" way to aggregate fundamentally different conceptions of the good or right.
      *   Alternatives exist: maximin (avoid worst-case scenarios), picking a "privileged" theory, contextualism, or even seeing deep moral uncertainty as a reason for particular virtues (caution, tolerance) rather than a calculative problem. Claiming EC is the *only* rational approach is unsupported dogma.

  2.  **"Basically dissolves moral disagreement... purely empirical": (Significant Overstatement/Conflation)**
      *   **Theory-Laden Empirics:** Disagreements about *which facts are morally relevant* or *how to weigh them* are deeply intertwined with moral theories. Utilitarians and Kantians might agree on all non-moral facts but *still* vehemently disagree on the right action because they interpret and weigh those facts differently through their moral lenses. EC doesn't magically resolve this.
      *   **Deep Value Conflicts:** Even after aggregation, people with different credences or different interpretations of the *same* theories (e.g., different versions of utilitarianism) can still end up with different EC rankings. Disagreement persists.
      *   **Meta-Uncertainty:** Uncertainty *about how to do the aggregation itself* (the very problem EC tries to solve) is a form of moral disagreement EC doesn't address.

  3.  **"Shows the whole approach is broken": (Overstatement)**
      *   The "swamping" or "Pascalian" problem (tiny-credence theories with astronomical stakes dominating the calculation) is a **serious and live technical objection**, not a definitive refutation. It highlights a major flaw in naive EC calculations.
      *   Proponents of EC acknowledge this and propose solutions: **Variance Normalization** (scaling choice-worthiness values to make comparisons meaningful across theories), **Lexical Thresholds** (ignoring theories below a certain credence for high-stakes decisions), or **Non-Additive Aggregation**. Whether these work is debated, but it's an active area of research, not a reason to abandon the entire project.

  4.  **Your Friend's Key Objections (Spot On):**
      *   **"How good by the theory's lights" not being a quantity:** This is crucial. EC requires **intertheoretic comparisons of choice-worthiness**.
          *   Utilitarianism often provides cardinal scales (utils), making aggregation easier.
          *   Deontology might only provide ordinal rankings (e.g., this act is forbidden, this is permissible, this is obligatory) or vague notions of "duty fulfillment," making precise weighting impossible. How many utils equal one fulfilled duty?
          *   Virtue Ethics or Particularism might resist quantification entirely. Assigning numbers here is often arbitrary.
      *   **"Some theories tell you to ignore your doubts about them":** Absolutely. Many moral theories (especially deontological, virtue-based, or religious ones) contain **"moral certainty" clauses** or **"fanaticism."** They may explicitly command you to follow them exclusively, regardless of doubts or other theories. EC directly violates this command. EC assumes theories are "options" to be averaged, but some theories reject being treated that way.
      *   **"Uncertain about what to do when you're morally uncertain" (Regress Problem):** This is a profound meta-problem. How do you choose *which* method to use for handling moral uncertainty (EC vs. maximin vs. picking a theory, etc.)? You'd need a rule for choosing that rule, potentially leading to infinite regress. EC doesn't escape this foundational uncertainty.

  **Assessment of "Just go with your favorite theory" (My Favorite Theory - MFT):**

  *   **Does it survive the worries?** **Yes, pragmatically, but not as a universally superior "rational" solution.**
  *   **Arguments for MFT as a Fallback:**
      *   **Avoids Swamping:** It sidesteps the Pascalian problem entirely by ignoring low-credence theories.
      *   **Avoids Intertheoretic Comparisons:** You don't need to quantify or compare values across incommensurable theories.
      *   **Avoids Violating "Moral Certainty" Theories:** If your highest-credence theory demands exclusivity, following it directly satisfies that demand.
      *   **Simplicity & Psychological Plausibility:** It's often how people actually behave when deeply conflicted.
  *   **Arguments Against MFT:**
      *   **Ignores Uncertainty:** It completely disregards the intuitive pull and potential truth of other theories you *do* assign significant credence to. Throwing away 40% credence in a theory seems irrational if you genuinely believe it might be true.
      *   **Arbitrary Threshold:** Why is 51% credence sufficient for exclusivity, but 49% is ignored? The line is arbitrary.
      *   **Vulnerable to Credence Shifts:** Small changes in credence could lead to radically different actions.
      *   **Not Obviously More Rational:** It's just one alternative strategy among several (EC, maximin, etc.), not demonstrably *the* rational default.

  **Overall Fairness Assessment:**

  The passage is **unfairly overconfident and misrepresents the state of the field.** While capturing the core idea of EC, it presents it as settled, uniquely rational truth, which it is not. It glosses over profound technical, conceptual, and philosophical problems (swamping, intertheoretic comparisons, regress, moral certainty demands) as minor quibbles or refutations. The claim that EC dissolves disagreement is particularly egregious.

  **Summary of What's Accepted/Rejected:**

  | **Passage Claim** | **Accuracy Assessment** | **Key Reasons** |
  |-------------------|--------------------------|----------------|
  | **Treat moral uncertainty like factual uncertainty using credences and expected choice-worthiness (EC)** | **Influential proposal, not settled truth** | Core idea is actively debated; alternatives exist; foundational challenges remain |
  | **EC is the *only* rationally permissible rule** | **Major overstatement** | No consensus on rationality; competing approaches valid; moral uncertainty differs from factual |
  | **EC dissolves moral disagreement into purely empirical disputes** | **Significant overstatement/conflation** | Value conflicts persist; theory-laden empirics; meta-uncertainty unresolved |
  | **Swamping problem shows EC is "broken"** | **Overstates the case** | Recognized as serious flaw but active research into solutions (normalization, thresholds) |
  | **Your friend's objections** | **Largely valid and important** | Intertheoretic comparison problem; moral certainty demands; regress issue - all substantive challenges |
  | **"Just go with your favorite theory" as fallback** | **Pragmatically defensible but not uniquely rational** | Avoids EC pitfalls but ignores genuine uncertainty; just one strategy among alternatives |

  **Conclusion:**

  Your skepticism is warranted. The blogger presents a complex, contested, and problematic area of philosophy as settled dogma. While EC is a valuable framework to explore, the claims of its unique rationality, its ability to dissolve disagreement, and the dismissal of serious objections like swamping are significant overstatements. Your friend's objections highlight genuine and deep challenges. The "just go with your favorite theory" fallback is a pragmatic way to avoid EC's pitfalls (especially swamping and intertheoretic comparisons), but it's not a philosophically unproblematic or uniquely rational solution. It simply trades one set of problems (ignoring uncertainty) for another (Pascalian nightmares, quantification issues). Moral uncertainty remains a thorny, unsolved problem with multiple competing approaches, none without significant drawbacks.
