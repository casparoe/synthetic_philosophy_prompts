  ### Within the Bounded Town  
  *(after Skolem)*

  He numbers every one: first, second, third.  
  The registry insists, with furrowed brow:  
  *No function counts us in the bounded town.*  

  The walled inhabitants, a well-known set,  
  Are tallied by the surveyor's steady hand.  
  He numbers every one: first, second, third.  

  The clerk, within, pores over scrolls of stone—  
  No gap in souls, yet no list can be found—  
  *No function counts us in the bounded town.*  

  From county rolls, each face receives a mark;  
  The missing thing is no lost citizen.  
  He numbers every one: first, second, third.  

  Not folk, but pairing’s ghost: the list itself  
  Eludes the archive’s strict, self-satisfied vow.  
  *No function counts us in the bounded town.*  

  From metatheory’s vantage, truth is split:  
  The function lives outside, not in. And now  
  He numbers every one: first, second, third.  
  *No function counts us in the bounded town.*  

  Our “uncountable” might, from heights unseen,  
  Be counted too—this doubt remains unkilled.  
  He numbers every one: first, second, third.  
  *No function counts us in the bounded town.*  

  ---

  **Note for the handout:**  
  In this villanelle, the italicized refrain (*No function counts us in the bounded town.*) represents the perspective *inside* the model: the town’s registry confirms no counting function (bijection with natural numbers) exists for its inhabitants. The roman refrain (He numbers every one: first, second, third.) represents the view *outside*: a surveyor enumerating those same inhabitants. What is missing inside is not an inhabitant, but the *function itself*—the counting list—which exists outside. This illustrates Skolem’s paradox: relativity in what "uncountable" means, depending on the model’s perspective.
