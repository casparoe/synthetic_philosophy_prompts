  ### Diagnostic Instrument: Timing of Conscious Experience  
  This instrument uses concrete cases to sort respondents into one of eight positions without relying on theoretical labels or abstract questions. Ten branching questions are derived from experimental variants, with distinctions focusing on:  
  - **Fact of the matter**: Whether timing is determinate, empty, or relative.  
  - **What fixes timing** (if determinate): Neural correlate, downstream availability, or subjective judgment.  
  - **Temporal structure**: Whether an experience at one time can include unexperienced past/future phases.  
  - **Revision requirement**: Whether an illusion requires an unrevised original experience.  
  - **Evidence type**: Whether reports or involuntary measures (e.g., eye movements) are authoritative.  

  Cases referenced:  
  - **Standard color phi**: Dot A (color 1) at location L1, then 100ms later dot B (color 2) at L2; reported as a single dot moving and changing color mid-trajectory.  
  - **Probe variant**: Unrelated click during gap; subject responds with speeded key press while illusion persists.  
  - **Withheld variant**: Dot B is withheld/masked; subject reports stationary dot that "stopped."  
  - **Chimeric variant**: Two color phi displays in opposite directions in different hemifields; reported as one coherent scene.  
  - **Predictable variant**: Dot B’s color is predictable after training; predictive mechanisms may pre-empt the change.  

  **Decision Tree**  
  Answer each question based on cases. Proceed to the next node based on your answer.  

  1. **In the withheld variant (only dot A appears), does the subject experience dot A as stationary *at the exact time dot A is presented*?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **In the standard color phi, when the subject reports a moving/changing dot, must there have been an *initial, unrevised* experience of dot A as stationary at the time it appeared?**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  3. **In the probe variant (click during gap, key press response), is the subject conscious of dot A *at the moment they press the key* (before dot B appears)?**  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  
     - **Indeterminate** → Go to Q8.  

  4. **In the chimeric variant, can the subject’s two motion experiences (one per hemifield) occur at *different times* despite being part of one coherent scene?**  
     - **Yes** → **Leaf 1: Neural Realism (NR)**.  
     - **No** → **Leaf 2: Revisionist Presentism (RP)**.  

  5. **Does the predictable variant (trained subjects) transform the color phi illusion into a *pre-experienced* color change at dot A’s presentation time?**  
     - **Yes** → **Leaf 3: Predictive Anticipation (PA)**.  
     - **No** → **Leaf 4: Separate Encoding (SE)**.  

  6. **If involuntary measures (e.g., pupil response) indicate dot A processing at time T, but the subject’s report places it at T+50ms, which determines timing?**  
     - **Involuntary measures** → **Leaf 5: Availability Functionalism (AF)**.  
     - **Report** → **Leaf 6: Judgment Dependence (JD)**.  

  7. **In the withheld variant, can the subject’s later report ("it stopped") reflect an experience with temporal structure (i.e., dot A presented and halted, without being experienced at presentation)?**  
     - **Yes** → **Leaf 7: Temporal Illusionism (TI)**.  
     - **No** → Go to Q9.  

  8. **Is the question “When was dot A experienced?” answerable only relative to a framework (e.g., neural vs. report)?**  
     - **Yes** → **Leaf 8: Framework Relativism (FR)**.  
     - **No** → Go to Q10.  

  9. **Can involuntary measures settle timing *definitively* in cases where reports are ambiguous?**  
     - **Yes** → **Leaf 5: Availability Functionalism (AF)**.  
     - **No** → **Leaf 7: Temporal Illusionism (TI)**.  

  10. **Does the subject’s report of dot A in the withheld variant lack a determinate timing *entirely*?**  
      - **Yes** → **Leaf 8: Framework Relativism (FR)**.  
      - **No** → **Leaf 2: Revisionist Presentism (RP)**.  

  **Leaves (Positions)**  
  Each leaf is defined by its path through the tree. The "most awkward commitment" summarizes its counterintuitive implication.  

  1. **Neural Realism (NR)**  
     - *Path*: Q1=Yes, Q2=Yes, Q4=Yes.  
     - **Awkward commitment**: A subject can have multiple "nows" simultaneously (e.g., in chimeric displays, different neural timings per hemifield imply temporal fragmentation).  
     - *Disputes*: Substantive vs. AF (timing fixed by neural vs. downstream availability).  

  2. **Revisionist Presentism (RP)**  
     - *Path*: Q1=Yes, Q2=Yes, Q4=No *or* Q1=No, Q3=No, Q9=No, Q10=No.  
     - **Awkward commitment**: Revision requires an unrevised original, but the "present" experience overwrites it so completely that no trace remains (denies temporal structure).  
     - *Disputes*: Substantive vs. TI (revision requires original vs. no original).  

  3. **Predictive Anticipation (PA)**  
     - *Path*: Q1=Yes, Q2=No, Q5=Yes.  
     - **Awkward commitment**: Predictability turns post-stimulus illusions into pre-stimulus experiences (e.g., dot B’s color is experienced before it appears).  
     - *Disputes*: Substantive vs. SE (predictability changes mechanism vs. only speeds up encoding).  

  4. **Separate Encoding (SE)**  
     - *Path*: Q1=Yes, Q2=No, Q5=No.  
     - **Awkward commitment**: Motion/change reports are post-hoc narratives; subjects never experience motion, only discrete flashes (contradicts phenomenology).  
     - *Disputes*: Substantive vs. PA (predictability doesn’t alter illusion type).  

  5. **Availability Functionalism (AF)**  
     - *Path*: Q1=No, Q3=Yes, Q6=Involuntary *or* Q1=No, Q3=No, Q9=Yes.  
     - **Awkward commitment**: An experience "occurs" only when usable for action (e.g., key press), even if unreportable (blurs consciousness with accessibility).  
     - *Disputes*: Substantive vs. JD (downstream use vs. report fixes timing).  

  6. **Judgment Dependence (JD)**  
     - *Path*: Q1=No, Q3=Yes, Q6=Report.  
     - **Awkward commitment**: The timing of experience retroactively changes if the subject revises their judgment (e.g., if they misremember when dot A appeared).  
     - *Disputes*: Verbal vs. FR (JD asserts subjective fact, FR denies any non-relative fact).  

  7. **Temporal Illusionism (TI)**  
     - *Path*: Q1=No, Q3=No, Q7=Yes *or* Q1=No, Q3=No, Q9=No.  
     - **Awkward commitment**: An experience at time T can include events never consciously experienced at their occurrence (e.g., dot A is only "experienced" as past when dot B appears).  
     - *Disputes*: Substantive vs. RP (temporal structure possible vs. impossible).  

  8. **Framework Relativism (FR)**  
     - *Path*: Q1=No, Q3=Indeterminate, Q8=Yes *or* Q1=No, Q3=No, Q10=Yes.  
     - **Awkward commitment**: The same experience can be correctly timed at T1 (neural) or T2 (report) without contradiction (denies universal "now").  
     - *Disputes*: Verbal vs. EL (FR allows multiple truths, EL denies truth altogether); merely verbal vs. JD (both use reports but FR relativizes them).  

  **Unoccupied Combinations & Why**  
  - **"No fact + Temporal structure"**: Incoherent—temporal structure presupposes a timeline to structure.  
  - **"Relative fact + Neural fixer"**: Unattractive—relativism avoids privileging one fixer (e.g., neural) as absolute.  
  - **"Judgment fixer + Revision requirement"**: Unexplored—judgment-based timing typically rejects unrevised originals (as judgments are post-hoc).  

  **Instrument Failures**  
  - **Cannot separate**:  
    - **NR vs. RP** (differ only on chimeric displays; if ignored, both answer identically).  
    - **AF vs. TI** (both distrust reports but diverge only on evidence authority; Q7/Q9 may not resolve).  
  - **Adjacent Disputes**:  
    - **NR vs. AF**: Substantive (neural vs. functional timing).  
    - **AF vs. JD**: Substantive (involuntary measures vs. reports fix timing).  
    - **JD vs. FR**: Merely verbal (JD takes reports as factual, FR as relative).  
    - **FR vs. TI**: Substantive (relative truth vs. illusion with temporal structure).  
    - **TI vs. RP**: Substantive (temporal structure possible vs. impossible).  
    - **PA vs. SE**: Substantive (predictability alters illusion type vs. only encoding).  
    - **RP vs. SE**: Substantive (revision requires original vs. no motion experience at all).  

  **Transfer Question: Agency Case**  
  *Case*: Subject initiates a button-press. Brain activity (readiness potential) begins at T-500ms; subject reports deciding at T-200ms; press occurs at T. When did the experience of deciding occur?  
  - **Re-runs the apparatus**: Apply the same decision tree to this case (e.g., replace "dot A" with "readiness potential," "dot B" with "button press," "report" with "decision judgment").  
  - **Positions that travel**:  
    - **NR**: Experience at neural onset (T-500ms).  
    - **AF**: Experience when decision available for action (e.g., T-200ms).  
    - **JD**: Experience at reported time (T-200ms).  
    - **TI**: Experience at/after press (T) with content about past "decision."  
  - **Positions that may not travel**:  
    - **PA/SE**: Tied to predictive stimuli; less applicable to self-generated actions.  
    - **RP**: Requires external revision; unclear for voluntary actions.  
    - **FR**: Still relative, but may struggle with first-person agency.  

  Use this instrument to bypass terminological loops and anchor discussion in empirical commitments.
