answer: |-
  Here is a self-contained decision tree designed for your seminar handout, built around the specified scenarios and positions. It uses 5 branching questions to sort into 8 distinct leaves, plus the initial "no badness" branch.

  ### Which Extinction Pessimist Are You?
  **Start with the Sealed Dome:** Humanity’s last generation lives full, happy lives. They die peacefully of old age. No one is left to mourn, and no descendants exist. Their lives contained no unfulfilled projects or regrets. Setting aside the sadness of their individual deaths, is anything *else* lost or made worse by humanity ending this way?

  *   **No → (1) AUSTERE**  
      *Awkward Commitment: Even a perfectly happy, complete ending for humanity adds no extra badness beyond the final deaths.*
  *   **Yes → Proceed to Question 2.**

  **Question 2: The Successor Reserve**  
  Imagine that just after humanity painlessly vanishes in the Sealed Dome, a new, completely unrelated species evolves (or arrives). They are just as intelligent, happy, and capable of creating art, knowledge, and moral value as humans were. They flourish for millions of years. Does this successful "replacement" fully *compensate* for or *erase* the badness of human extinction you felt in the Sealed Dome?

  *   **Yes → Proceed to Question 3.**  
  *   **No → Proceed to Question 4.**

  **Question 3: The Frozen Vault**  
  Suppose humanity stored frozen embryos or digital mind-backups in a vault before vanishing in the Sealed Dome. Long after humans are gone, benevolent aliens find the vault and revive these backups on a new planet. The revived beings live wonderful, fulfilling lives, but they have *no* connection to human history, culture, or ongoing projects. Is the *mere existence* of these good lives (even disconnected ones) a significant part of what was lost in human extinction, such that reviving them significantly reduces the badness?

  *   **Yes → (2) IMPERSONAL FUTURE PEOPLE**  
      *Awkward Commitment: The core loss is just the absence of future good experiences; it doesn’t matter *who* has them or if they connect to us, just that good lives are missing.*
  *   **No → (6) PLENITUDE**  
      *Awkward Commitment: The core loss is a reduction in the total amount/variety/quality of value in the universe. Disconnected lives might add some generic value, but they fail to replace the *specific* value lost with humanity's unique potential or history (even if that uniqueness isn't tied to culture/projects).*

  **Question 4: The Museum of the Last Generation**  
  In this version of the Sealed Dome, the last humans *knowingly* complete all their personal life goals (raising families, careers, hobbies) *and* all major collective human projects (writing the definitive history, solving key scientific problems, creating great art). They even build a perfect museum/archive encapsulating human achievement. However, they know for certain *no one will ever see it*. Does completing all these projects and building the archive *significantly reduce* the extra badness of extinction compared to the original Sealed Dome where projects might have been incomplete?

  *   **Yes → Proceed to Question 5.**  
  *   **No → (4) SCHEFFLER-STYLE COLLECTIVE AFTERLIFE**  
      *Awkward Commitment: The badness isn't about unfinished projects or unseen archives; it's that extinction makes our *current* valuing of things (like projects or history) feel pointless or misguided, even if we complete them perfectly before the end.*

  **Question 5: The Sterilization Choice**  
  A future society faces a choice:  
  A) Continue normally, risking a small chance of unimaginable, permanent suffering for vast future generations.  
  B) Painlessly sterilize everyone, ensuring no future humans exist after the current generation dies happy, old-age deaths (like the Sealed Dome).  
  Setting aside the sadness of individuals not having children they wanted, is choosing Option B (sterilization leading to extinction) *less bad* or even *preferable* because it prevents the risk of future suffering?

  *   **Yes → (7) SUFFERING-FOCUSED / ANTI-NATALIST-LEANING**  
      *Awkward Commitment: Preventing potential future suffering is so paramount that extinction is not bad beyond the deaths and might be actively good if it prevents net harm.*
  *   **No → You value the continuation of humanity itself. Proceed to determine *why*.**
      *   **Is the core value the continuation of *humanity specifically* (not just generic value or experiences)? → (3) SPECIES-RELATIVE CULTURAL CONTINUITY**  
          *Awkward Commitment: The core loss is that *human* projects, history, and culture have no future inheritors or context, even if other valuable things exist.*
      *   **Is the core value humanity's potential for *ongoing achievement or progress* (building on the past)? → (5) STEWARDSHIP / CIVILIZATIONAL PROGRESS**  
          *Awkward Commitment: Humanity is a unique vessel for a valuable cumulative project (knowledge, morality, culture); ending it cuts short this progress, regardless of whether projects were "completed" in a final snapshot (Museum).*
      *   **Neither of the above? Does the question of "why" continuation matters feel like it lacks a clear factual answer? → (8) QUIETIST / NO-DEEP-FACT**  
          *Awkward Commitment: There's no deeper "fact of the matter" about what makes extinction bad beyond the deaths; our judgments about extra loss ultimately express our attitudes or commitments, not discoverable truths.*

  ---

  ### Key Notes on the Tree
  1.  **Unoccupied Branch:** The path `Yes (Sealed Dome Bad) → Yes (Successor Reserve Compensates) → No (Frozen Vault Lives Don't Matter)` is occupied by (6) Plenitude. The reverse path (`Yes → Yes → Yes`) leads to (2) Impersonal. There are no logically incoherent or unexplored branches generated by this tree; all paths lead to one of the 8 specified leaves.
  2.  **Distinguishing Close Positions:**
      *   **(3) Cultural Continuity vs. (5) Stewardship:** These are pulled apart by the focus in Question 5's follow-up. (3) cares about *humanity* continuing its story/culture. (5) cares about the *cumulative project* progressing, even if the specific carrier (humanity) might theoretically change. The Successor Reserve (`No` answer) is key to distinguishing both from (2) Impersonal.
      *   **(4) Scheffler vs. (3/5):** The Museum scenario (`No` answer) isolates (4). Someone who says `Yes` to the Museum cares about projects *being completed* (which (3) and (5) value), while (4) denies completion helps the core problem.
      *   **(6) Plenitude vs. (2) Impersonal:** The Frozen Vault (`No` answer) isolates (6). Both agree Successor Reserve compensates significantly (answering `Yes` to Q2), but (6) insists the *specific* human potential/value wasn't fully replaced by disconnected lives or even a successor species in a way that matters for the "plenitude" of value. (2) thinks the generic good lives *are* what matters.
      *   **(7) Suffering-Focused vs. Austere:** The Sterilization Choice (`Yes` answer) isolates (7). The Austere (`No` on Sealed Dome) sees *no* extra badness, so preventing suffering isn't relevant to the extinction question itself. (7) sees *potential* extra badness (future suffering) that extinction prevents.
      *   **(8) Quietist:** This is the fallback for someone who feels there's *some* extra badness (`Yes` on Sealed Dome), doesn't think successors compensate (`No` on Successor Reserve), but then rejects the specific reasons offered by (3), (4), (5), or (7) when probed in Q4/Q5, feeling the "why" question has no definitive answer.

  ---

  ### Scoring Key
  Based on your answers to the scenarios:

  1.  **AUSTERE (1):** Sealed Dome (`No`).
  2.  **IMPERSONAL FUTURE PEOPLE (2):** Sealed Dome (`Yes`), Successor Reserve (`Yes`), Frozen Vault (`Yes`).
  3.  **PLENITUDE (6):** Sealed Dome (`Yes`), Successor Reserve (`Yes`), Frozen Vault (`No`).
  4.  **SCHEFFLER-STYLE COLLECTIVE AFTERLIFE (4):** Sealed Dome (`Yes`), Successor Reserve (`No`), Museum (`No`).
  5.  **SUFFERING-FOCUSED (7):** Sealed Dome (`Yes`), Successor Reserve (`No`), Museum (`Yes`), Sterilization Choice (`Yes`).
  6.  **SPECIES-RELATIVE CULTURAL CONTINUITY (3):** Sealed Dome (`Yes`), Successor Reserve (`No`), Museum (`Yes`), Sterilization Choice (`No`), *and* core value is humanity continuing specifically.
  7.  **STEWARDSHIP (5):** Sealed Dome (`Yes`), Successor Reserve (`No`), Museum (`Yes`), Sterilization Choice (`No`), *and* core value is cumulative progress/achievement.
  8.  **QUIETIST (8):** Sealed Dome (`Yes`), Successor Reserve (`No`), Museum (`Yes`), Sterilization Choice (`No`), *and* neither (3) nor (5) captures it / feels like there's no deeper fact.
