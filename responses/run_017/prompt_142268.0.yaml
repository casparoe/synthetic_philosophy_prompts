  ### **Rules and Scoring Scheme**  
  **Fixed Vocabulary**: Cards use only:  
  - "Card [X] is true,"  
  - "Card [X] is false" (equivalent to "not true"),  
  - and card identifiers (A, B, C...).  

  **Assignments**: For each card, groups assign:  
  - **True (T)**, **False (F)**, or a **custom status** (e.g., "Gap," "Both").  
  - Cards left blank incur heavy penalties.  

  **Scoring** (per card):  
  1. **Bonus**: +1 point for each card marked **T** or **F**.  
  2. **Contradiction Penalty (CP)**: -10 points if assignment violates disquotation:  
     - If card says "Card X is true" and is assigned **T**, then X must be **T**. Else, CP.  
     - If card says "Card X is true" and is assigned **F**, then X must **not be T** (i.e., **F** or custom). Else, CP.  
     - Similarly for "Card X is false" (treat as "not true").  
  3. **Transparency Tax (TT)**: -5 points per card assigned a **custom status**.  
  4. **Blank Penalty (BP)**: -20 points per unassigned card.  

  **Total Score** = (Number of T/F × 1) − (CP × 10) − (TT × 5) − (BP × 20).  
  **Goal**: Maximize score. High scores require marking cards T/F without contradictions.  

