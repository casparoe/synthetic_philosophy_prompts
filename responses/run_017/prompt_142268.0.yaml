  ## Procedure for Revenge Loop
  1. After the initial round, each group proposes a repair rule in writing, using the fixed vocabulary (they can use English to state the rule).
  2. The instructor then selects a revenge card (or cards) that exploits that rule. If the revenge card is self-referential and they banned self-reference, then the card is self-referential. If they proposed a hierarchy, then the revenge card might be one that refers to a card of the same level (but we haven't defined levels) -> so we might simply add a self-referential card anyway.
  3. The group then has to score the board again, now with the new card(s), and calculate their score.
  4. This can be done for 2 rounds, with a new revenge card each time.

