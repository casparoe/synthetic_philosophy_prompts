        - **For hierarchy proposal**: Add "Card I: Card A is true." (Assumes A is "lower level," but creates new paradox).  
        - **For gap adoption**: Add "Card I: Card I is true if gap." (Not in vocabulary; groups must use existing rule).  
    - Groups re-score board with new card(s).  
  - **Round 2**:  
    - Groups refine rules or propose new ones.  
    - Instructor adds a second revenge card (e.g., for hierarchy: "Card K: Card K is not true at level 1").  
    - Groups re-score.  

  **90–110 min: Debrief (25 min)**  
  - Groups share final scores and frustrations.  
  - **Map Activity to Theories**:  
    - **Hierarchical Response**: "Banning self-reference mirrors Tarski’s hierarchy. Cost: You paid TT/BP for cards like I/J. In real logic, this costs *general truth statements* (e.g., ‘all sentences are true or false’)."  
    - **Gap Response**: "Using ‘Gap’ avoids contradictions. Cost: You paid TT and lost bonus points. In fixed-point logic, this costs *exhaustive classification* (e.g., you can’t say the Liar is gappy *in the object language*)."  
    - **Paraconsistent Response**: "Inventing ‘Both’ tolerates contradiction. Cost: You paid TT and couldn’t use disquotation. In logic, this costs *explosion* (contradictions can’t entail everything)."  
  - **Key Insight**: "No solution is ‘wrong’—each pays a price in expressive power, inference, or consistency."  

  ---

  ### **Failure Modes & Handling**  
  1. **Group Refuses General Rule, Wants to Tear Up Card**:  
     - *Handle*: Enforce blank penalty (-20). Ask: "What if this card reappears? Your rule must cover all cases."  
     - *Encourage*: This mirrors "language is uncontainable"—worth discussing in debrief.  

  2. **Group Uses Richer Vocabulary for Rule**:  
     - *Handle*: Reject the rule: "Use only ‘true,’ ‘false,’ and card IDs." Redirect to fixed terms.  

  3. **Argument: "Scoring Rules Are Liar-Like!"**:  
     - *Handle*: Acknowledge the insight: "Yes! This is why hierarchical solutions place rules in a metalanguage." Encourage this as a key learning moment.  

  ---

  ### **What the Activity Cannot Show**  
  1. **Coherence of Real Solutions**:  
     - The game risks implying "no solution works," but reality is subtler: **hierarchies** (transfinite levels), **fixed points** (existence proofs), and **paraconsistency** (formal systems) *are* coherent.  
     - **Post-Game Lecture**: Sketch Kripke’s fixed-point construction (visualize truth-value jumps), Tarski’s transfinite hierarchy (ordinal levels), and LP logic (truth-value "gluts").  

  2. **Broader Costs**:  
     - The game cannot show how **giving up explosion** (paraconsistency) affects math (e.g., trivialism risk), or how **hierarchy** fragments discourse.  
     - **Post-Game Lecture**: Contrast classical vs. paraconsistent arithmetic; show Tarski’s "indefinability of truth."  

  3. **Misleading Simplifications**:  
     - Revenge cards are finite; hierarchies/ fixed points require infinity.  
     - Scoring reduces logical trade-offs to "points," but real costs are inferential/expressive.  
     - **Mitigation**: Stress in debrief: "This is a metaphor. Real solutions are rigorous but constrained."  

  ---

  ### **Instructor Script Snippets**  
  - **During Revenge Loop**: "Your rule says ‘self-reference is banned.’ Here’s Card I: ‘Card J is false,’ and Card J: ‘Card I is true.’ Rescore with these."  
  - **Debrief**: "When you banned self-reference, you paid TT for Cards I/J. In Tarski’s hierarchy, this cost is *losing a universal truth predicate*. When you used ‘Gap,’ you avoided CP but paid TT. In Kripke, this cost is *silence about gaps*. Each family pays somewhere."  
  - **Closing Note**: "Today, you felt the revenge dynamic and trade-offs. Next lecture, we’ll see how logicians *build* solutions that work—by giving up specific powers."  

  This activity forces hands-on engagement with revenge and cost, priming students for technical depth in follow-up lectures.
