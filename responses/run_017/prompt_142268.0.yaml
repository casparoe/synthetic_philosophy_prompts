  ### **Timeline (110 Minutes)**  
  **0–10 min: Setup & Rules (No Lecture)**  
  - Form 4 groups of 4.  
  - Distribute cards, score sheets, rules.  
  - Explain goal: "Maximize your score by assigning statuses. No card can be ignored."  
  - Emphasize: Disquotation is enforced for T/F; custom statuses avoid CP but cost TT.  

  **10–35 min: Initial Scoring Round**  
  - Groups assign statuses to all 8 cards.  
  - Calculate scores (e.g., marking Liar (A) as T/F incurs CP; marking as "Gap" avoids CP but costs TT).  
  - **Predictable Issue**: Groups mark Liar (A) as "Gap" or leave it blank, but struggle with cycles (C-D) or truth-tellers (B, G).  

  **35–45 min: Group Reports**  
  - Groups share scores and assignments.  
  - Highlight trade-offs: "Why pay TT? Why accept CP?"  

  **45–55 min: Repair Phase Setup**  
  - Introduce revenge loop: "Propose a general repair rule to avoid penalties. Rule must use only card vocabulary (no new words)."  
  - **Rule Format**: "Any card that [condition] must be [status]." (e.g., "self-referential cards must be Gap").  

  **55–90 min: Repair & Revenge Loop (2 Rounds)**  
  - **Round 1**:  
    - Groups submit repair rules (e.g., "Ban self-reference").  
