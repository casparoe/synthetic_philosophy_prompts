  ## Debrief Script (25 minutes)
  We debrief by mapping the activity to the three families:

  1. **Hierarchical response**: 
     - What they experienced: When they banned self-reference or proposed a hierarchy, they had to leave some cards unmarked (or marked with a non-classical status) because of loops or self-reference. The cost was the blank penalty or the transparency tax.
     - What they gave up: The ability to make general statements about truth (e.g., "every sentence is either true or false") because that would have to be at a higher level.

  2. **Gap response**:
     - What they experienced: They introduced a gap status for the liar and other ungrounded sentences. They avoided the contradiction penalty but paid the transparency tax and lost the bonus for those cards.
     - What they gave up: The exhaustiveness of truth and falsehood (some sentences are neither) and the ability to say of a gap sentence that it is gap (because our cards couldn't express that).

  3. **Paraconsistent response**:
     - What they experienced: They might have introduced a "both" status. Then for the liar, they can assign it both true and false. How would the disquotation work? 
          - If a card says "X is true", and they assign it both, then what? We didn't define the disquotation for "both". In our scoring, we only applied disquotation for True and False. If they assign a card to "both", we didn't check -> so no penalty. But then they pay the tax and lose the bonus.
     - What they gave up: The consistency of the assignments (some sentences are both true and false) and the classical inference rules (like explosion: from a contradiction, anything follows).

  ## Failure Modes
  1. **Group refuses to state a general rule and just wants to tear up the card.** 
     - How to handle: Explain that the rule must be general because the language has many sentences. If they tear up the card, it's like having a blank -> blank penalty. Emphasize that the scoring applies to every card.

  2. **Group reasons in a richer language.**
     - How to handle: Gently remind them that the repair rule must be stated in the fixed vocabulary of the cards. If they use new terms, ask them to rephrase.

  3. **Argument about whether the scoring instructions are themselves a card on the board.**
     - This is worth encouraging! It's a deep point. Acknowledge that the scoring rules are in the metalanguage, and that's where the hierarchical response locates the solution.

  ## What the Activity Cannot Show
  - The activity cannot show the transfinite character of the hierarchy (e.g., that we need levels into the transfinite to handle some sentences).
  - It cannot show the existence proof for a fixed point (which is a technical mathematical result).
  - It cannot show the full cost of giving up classical inference rules in other areas of logic and mathematics (e.g., in mathematics, if we give up explosion, how does that affect proofs?).

  In the following lecture, you will need to:
     - Explain that there are coherent responses that work by giving up one of these things.
     - Show the technical construction for the fixed point in the gap response.
     - Discuss the transfinite hierarchy in the hierarchical response.
     - Explain the broader implications of paraconsistency for logic.

  The game might mislead by suggesting that there is no coherent response, but in fact, each family gives something up in a controlled way. The activity shows the trade-offs but not the full formal machinery that makes them work.

  ## Final Materials and Rules Handout
  We provide a printed rules and scoring scheme for each group.

  ### Rules
  - You have a board of cards. Each card has a sentence that attributes truth or falsehood to itself or to another card.
  - For each card, you must assign one of the following statuses: True (T), False (F), or you may invent new statuses (e.g., Gap, Both, etc.).
  - You may also leave a card blank, but this is penalized heavily.
  - The goal is to maximize your score.

  ### Scoring
  - For each card assigned T or F: 
     - You get +1 point.
     - But if the assignment is inconsistent with what the card says, you lose 10 points.
        - Inconsistency means: 
            * If the card says "Card X is true":
                 - T: requires X is T.
                 - F: requires X is F or Gap or Both? -> Actually, in our earlier: requires X is not T (which we defined as F or any non-T status we don't have a name for? But we defined it as: for F assignment, we require X is not T -> which in our scoring, if X is assigned F or any non-classical status, then it's not T -> so no penalty.
            * If the card says "Card X is false" (or "not true"):
                 - T: requires X is F.
                 - F: requires X is not F -> i.e., T or any non-classical status.
  - For each card assigned a non-classical status (anything other than T or F): 
     - You lose 5 points.
     - There is no inconsistency check for these cards.
  - For each card left blank: you lose 20 points.

  ### Example
  - Card: "This card is not true." -> liar.
     - Assign T: requires that the card is not true -> but we assigned T -> inconsistency -> -10, and you get +1 -> net -9.
     - Assign F: requires that the card is not not true -> i.e., true -> but we assigned F -> inconsistency -> -10, and +1 -> net -9.
     - Assign Gap: -5 points.
     - Blank: -20 points.

  ## Conclusion
  This activity should give students a hands-on feel for the trade-offs in responding to the Liar paradox. The revenge loop shows that any general rule they propose can be exploited, and the scoring forces them to confront the costs of their choices.
