answer: |-
  Your conceptual grid is astute and exposes genuine gaps in standard biological terminology. Drawing on the adaptationism debates, function debates, and adjacent fields, here's a systematic analysis.

  ### Stage 1: Brainstormed Candidate Concepts
  **Established terms:**  
  - *Adaptation (sensu strictu)*: Trait shaped by natural selection for its current role.  
  - *Spandrel* (Gould & Lewontin): Trait arising as non-adaptive architectural byproduct.  
  - *Exaptation* (Gould & Vrba): Trait co-opted for new function, *after* initial evolution.  
  - *Constraint* (developmental/phylogenetic): Bias in trait form due to developmental/genetic architecture.  
  - *Cummins-function*: Role a trait plays in a current system, irrespective of history.  
  - *Selected Effect (SE) function*: Historical selection for a trait’s contribution to fitness.  
  - *Developmental Channelling* (evo-devo): Ontogenetic processes limiting phenotypic variation.  
  - *Optimality*: Trait form matches engineering ideal for its task.  

  **Marginal/Extended Concepts (my coinages/extensions):**  
  - *Selection-Maintained* (extension of SE function): Trait preserved by current stabilizing selection.  
  - *Form-Optimized* (coinage): Trait shape explicable by selection-driven refinement.  
  - *Developmental Inertia* (extension): Trait form fixed by body plan, unresponsive to selection.  
  - *Developmental Affordance* (coinage): Trait arising predictably from developmental physics, then utilized.  
  - *Constrained Optimization* (engineering term adapted): Selection improves form within developmental limits.  

  ---

  ### Stage 2: Testing Candidates Against Cases  
  **Case 1 (Bony Flange)**  
  - *Fits*: **Developmental Affordance** (geometric byproduct co-opted immediately). **Selection-Maintained** (removal reduces fitness). **Cummins-function** (current role in feeding).  
  - *Fails*: *Adaptation* (form not shaped by selection). *Spandrel* (not functionless). *Exaptation* (no prior non-functional stage). *SE function* (conflicts on historical origin). *Form-Optimized* (shape not refined).  

  **Case 2 (Color Patch)**  
  - *Fits*: **Constrained Optimization** (selection pushes along one axis within limits). **Developmental Channelling** (variation biased). **Selection-Maintained** (current sexual selection).  
  - *Fails*: *Optimality* (suboptimal hue). *Adaptation* (form not optimized). *Exaptation* (no co-option). *Form-Optimized* (pushed but not refined to optimum).  

  **Case 3 (Obligatory Optimized Structure)**  
  - *Fits*: **Developmental Inertia** (body plan mandates presence). **Optimality** (form is functionally ideal). **Cummins-function** (performs job well).  
  - *Fails*: *Adaptation* (presence not due to selection *for it*). *SE function* (no history of selection for presence). *Spandrel* (not a byproduct; engineered).  

  ---

  ### Stage 3: Committed Analysis  
  **Diagnosis:** Your grid identifies two independent axes:  
  1. **Presence Explained by Selection?** (Origin *or* maintenance)  
  2. **Form Explained by Selection?** (Shape optimized for function).  

  **Established Labels & Gaps:**  
  - No existing term captures *all* cases because:  
    - **Spandrel** requires non-functionality (fails Case 1).  
    - **Exaptation** requires historical co-option (fails Cases 1–3).  
    - **Adaptation** conflates presence and form (fails all cases).  
    - **Constraint** explains form but not maintenance (partial fit).  

  **Refined Grid & Terminology:**  
  |                          | **Form Optimized by Selection** | **Form NOT Optimized by Selection** |  
  |--------------------------|----------------------------------|-------------------------------------|  
  | **Presence Maintained by Selection** | Adaptation (sensu strictu)      | **Selection-Locked Affordance** (Case 1) |  
  | **Presence NOT Maintained by Selection** | **Developmental Optimum** (Case 3) | Spandrel / Neutral Trait          |  

  - **Selection-Locked Affordance** (Case 1): My coinage for traits whose *presence* is maintained by selection, but *form* is a developmentally inevitable byproduct. *Diagnostics*: Geometry predicts form; removal harms fitness; no phylogenetic evidence of prior non-use.  
  - **Constrained Optimization** (Case 2): Extended engineering term. Selection refines form within developmental limits. *Diagnostics*: Trait under directional selection; variation biased; optimal form unreachable.  
  - **Developmental Optimum** (Case 3): My coinage for traits obligatory to body plan yet fortuitously optimal. *Diagnostics*: Phylogenetically conserved; engineering analysis shows optimization; experimental deletion impossible/lethal.  

  **Is This One Phenomenon?**  
  No. Case 1 is about **non-selective form origins**, Case 2 about **constrained adaptive refinement**, Case 3 about **non-adaptive functional perfection**. They share a decoupling of "why present?" and "why shaped thus?" but manifest distinct mechanisms.  

  **Grid Refinements Needed:**  
  - **Split "Presence" Axis**: Separate *evolutionary origin* (selection vs. drift) from *current maintenance* (selection vs. no selection). Your cases focus on *maintenance*.  
  - **Split "Form" Axis**: Distinguish *geometry* (Case 1), *material properties* (e.g., chitin elasticity enabling color), and *regulatory pathways* (Case 2).  
  - **Third Axis**: *Evolutionary Modifiability* (could selection alter this trait if needed?).  

  **Diagnostics Toolkit:**  
  1. **Presence Maintenance**: Fitness cost upon removal/modification.  
  2. **Form Optimization**: Optimality modeling + sensitivity analysis.  
  3. **Developmental Bias**: Artificial selection experiments (e.g., attempt to shift hue in Case 2).  
  4. **Body Plan Obligation**: Comparative phylogenetics (trait universally present in clade).  

  **Conclusion:** Your cases lack a unifying term because they challenge the adaptation/spandrel dichotomy. The grid is sound but requires finer axes. Adopt **Selection-Locked Affordance**, **Constrained Optimization**, and **Developmental Optimum** as precise descriptors—with the caveat that only the *components* of these phrases are established terms. This framing clarifies why adaptation tests conflate presence (removal experiment) and form (optimality model): they address distinct evolutionary questions mistakenly lumped under "adaptation."
