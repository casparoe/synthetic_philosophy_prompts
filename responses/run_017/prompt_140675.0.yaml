answer: |-
  ## Grant Proposal: The Architecture of Atrocity Comparison - Untangling Purposes to Defuse Moral Paralysis  

  **Core Question:** Under what conditions can comparative judgments between historical atrocities serve distinct institutional purposes (prevention, commemoration, compensation, blame) without either collapsing into a single, morally obscene "suffering metric" or retreating into paralyzing incomparability?  

  ### Why Existing Frameworks Fail  
  The dominant positions stall practical judgment:  
  1. **The Uniqueness Thesis** (each atrocity is singularly evil) ignores *necessity*: agents *must* compare when allocating finite resources (e.g., a memorial fund choosing between projects).  
  2. **Flat Incomparabilism** (no meaningful ranking possible) founders on the **forced-choice test**: preventing only one of two impending atrocities *requires* weighing. What does deliberation look like here if not comparison?  
  3. **The Everything-Measurable View** (one scale for all wrongs) induces obscenity precisely by flattening irreducibly distinct dimensions (intentionality vs. scale vs. cultural erasure) into a false common denominator, ignoring **purpose-relativity**.  

  **The Crux:** The intuition that "ranking is obscene" isn’t primarily metaphysical—it’s *functional*. It arises when a *single weighting* of dimensions (scale, cruelty, intent, etc.) is demanded for *every purpose simultaneously*. My hypothesis: **Comparability is purpose-relative**, and tensions dissolve when we clarify:  
  - **WHAT** is compared (discrete event? enduring practice? regime?)  
  - **ALONG WHICH DIMENSION(s)** (death toll? betrayal of trust? cultural destruction?)  
  - **FOR WHAT AIM** (prevention? compensation? memorialization?)  

  ### Novel Interventions  
  1. **The Forced-Choice Test as Litmus**: Forces incomparabilists to articulate a decision procedure for prevention scenarios. Is their stance a *reductio* or a coherent (if costly) commitment? Reveals whether resistance is metaphysical or pragmatic.  
  2. **Witness Asymmetry**: The perceived offensiveness of comparison shifts dramatically based on *who speaks* (victim-descendant vs. perpetrator-state vs. academic). This suggests "you can’t compare" often masks a claim about *social license to assert* rather than truth-conditions. Crucially, this creates an **epistemic-ethical tension**: those best positioned to compare (e.g., historians with deep contextual knowledge) may be least socially permitted to do so.  

  ### Approach: Diagnostic Disaggregation  
  I reject both exhaustive surveys and abstract conceptual analysis. Instead:  
  1. **Build a Diagnostic Framework**: Map the three axes (object/dimension/purpose) to reveal *which combinations* generate intuitive obscenity vs. traction.  
  2. **Stress-Test with Institutional Scenarios**: Analyze real-world cases (e.g., a curriculum committee ranking cases for inclusion; a reparations body allocating funds) using thought experiments and documented deliberations.  
  3. **Interrogate Forced-Choice & Witness Roles**: Model prevention dilemmas to challenge incomparabilism; analyze how speaker-position affects legitimacy claims in memorial contexts.  

  **Why this beats alternatives:** It bypasses stale "is comparison possible?" debates by showing *how* institutions *already* compare—often incoherently. It targets the practical paralysis arising from conflation.  

  ### Method (9 Months)  
  - **Months 1-2:** Precision surgery on literature—extract purpose-relativity hints buried in debates on incommensurability, moral residue, and "category mistakes."  
  - **Months 3-4:** Develop diagnostic framework; draft forced-choice scenarios and witness-asymmetry cases.  
  - **Months 5-7:** Apply framework to 3 institutional contexts (e.g., reparations commissions, museum curation, school curricula); identify recurrent conflation patterns.  
  - **Month 8:** Draft core paper and **"How to Compare" Protocol**.  
  - **Month 9:** Refine protocol with input from practitioners (via existing networks); finalize paper.  

  ### Possible Outcomes & Deciding Factors  
  1. **Strong Purpose-Relativity**: Framework resolves tensions; obscenity largely stems from category errors. *Decider:* Coherence of forced-choice deliberation under the model.  
  2. **Persistent Incommensurability**: Some dimensions (e.g., cultural erasure vs. immediate bodily harm) resist comparison even for specific purposes. *Decider:* Whether witness asymmetry explains residual discomfort better than metaphysics.  
  3. **Witness Primacy**: Social license, not comparability itself, is the core constraint. *Decider:* If institutional legitimacy consistently trumps epistemic adequacy in real cases.  

  ### The "How to Compare" Protocol (1-Page)  
  A flow chart for practitioners:  
  1. **Define YOUR PURPOSE** (Prevent? Compensate? Commemorate? Assign blame?).  
  2. **Specify the OBJECT** of comparison (Event/Policy/Regime/Practice)—beware shifting units!  
  3. **Select RELEVANT DIMENSIONS** tied to purpose (e.g., compensation requires calculable harm metrics; commemoration may prioritize cultural betrayal).  
  4. **Acknowledge WEIGHTING TRADEOFFS**: No single weighting serves all purposes.  
  5. **Check WITNESS LEGITIMACY**: Who should speak? When is deference required?  
  6. **Document thresholds**: What would make you reverse the ranking?  

  ### Failure Conditions (If any occur, the project falters)  
  1. If purpose-relativity *cannot* defuse the forced-choice challenge for prevention.  
  2. If witness asymmetry reduces *entirely* to social psychology without normative traction.  
  3. If the framework merely restates existing incomparabilist concerns without new practical guidance.  

  ### Scope Management: Necessary Cuts  
  To deliver rigorously in 9 months:  
  - **Historical cases will be schematic**, not exhaustively documented (leverage well-known examples as placeholders).  
  - **Formal modeling of dimensions** (e.g., axiomatic approaches) will be minimized in favor of conceptual clarity.  
  - **Deep engagement with uniqueness literature** will be restricted to its implications for purpose-relativity.  

  ---

  **Why This Matters Now:** Institutions drown in comparison demands while fearing moral overreach. This project doesn’t ask if we *should* compare—it acknowledges we *must*—and provides the tools to do it responsibly. By untangling purposes, it replaces paralysis with precision, and obscenity with accountability.
