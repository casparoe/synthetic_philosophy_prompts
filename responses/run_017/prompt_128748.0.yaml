prompt: |-
  ok so a weird thing has happened where the same word came up in two completely separate parts of my life in the same month and I now have to actually have a view about it. One: my brother Ari is 24, has cerebral palsy, barely speaks, and lives in a supported-living place whose funding depends on whether residents get classified as having an intellectual disability — and the classification basically rests on how he does on a test delivered through an eye-gaze board that took the staff three tries to calibrate (first two times he came out in the "profound" range, third time it turned out he'd been doing mental arithmetic the whole time and no one had any idea). Two: my employer is writing a policy about when we're allowed to call a system "intelligent" or say it's approaching human-level, because marketing wants to say it constantly and legal keeps asking what would even have to be true for that claim to be false. Meanwhile my friend whos an ML engineer keeps saying intelligence is just compression and I feel like that's obviously leaving something out but I can't say what.

  What I want from you isn't a theory, it's the spec — the requirements any account of what intelligence is would have to meet to be good enough to actually settle cases like these: the phenomena it has to cover, the cases it has to get right, the distinctions it isn't allowed to collapse (like the one between having intelligence and having a lot of it), the findings from psychology or biology it can't contradict, and one clause on why each is a real requirement rather than just a preference of one camp. Give me exactly five numbered items, one or two sentences each, no intro and no conclusion.

  Cases I want the five to be anchored to, though add your own if I'm missing the ones that matter: (a) Ari's situation, where a competence seems to be present but can't get out through any channel anyone has offered, or only gets out through a channel nobody thought to try; (b) the leak case — a system, or a student, that produces correct answers because it got hold of the answer key or found a loophole in how the task was set up, and collapses when you shift the goalposts a little; (c) the borrowed-scaffold problem, which is the one I keep getting stuck on — basically everything anyone does is done with notebooks, calculators, colleagues, and a language they didn't invent, so say whether recruiting and building scaffolding is part of intelligence, what's left when you strip it away, and whether stripping it away lowers the intelligence or just makes the world harder; (d) the group case — a colony, a market, a lab, an ant trail pulling off something no individual member could, where I genuinely don't know whether the account should even reach it; (e) the cost case, two systems reaching the same answer, one in a second and one after a week of brute search, where I can't tell if speed is part of the thing or a separate virtue people keep smuggling in. Inside the items: put an asterisk on any requirement you think is negotiable rather than non-negotiable, and if you suspect two of them can't be jointly satisfied — I have a feeling (c) and (e) pull against each other, or maybe (b) and the scaffolding one — say so in a clause in whichever item it bites in, not in a separate section. Also one clause per item on which popular account the requirement quietly kills, or which one it's really just a prejudice of: the IQ / general-factor story, the multiple-intelligences story, the "it's just general learning" or "it's just compression" story, whatever. And whichever single requirement does the most work in excluding candidates, say that inside its item too.
reasoning: |-
  Okay, the user presents a complex scenario involving intelligence across different contexts: their brother Ari's situation with disability classification, their employer's policy on AI intelligence claims, and their friend's ML perspective. They need a spec - five requirements for defining intelligence that must cover specific cases without collapsing important distinctions. 

  Hmm, the cases they want anchored are particularly insightful: Ari's hidden competence, systems that cheat by finding loopholes, the role of external tools, group intelligence, and efficiency differences. Each reveals a different facet of what makes intelligence hard to pin down. 

  For requirement 1, the core issue is separating competence from performance. Ari's case shows assessment methods can fail to detect existing abilities. This directly challenges IQ testing and behaviorist approaches that equate intelligence with measurable output. The asterisk notes this is negotiable because perfect detection may be impossible.

  Requirement 2 tackles robustness - intelligence shouldn't collapse with minor changes. This excludes systems that merely memorize patterns or exploit loopholes. It's a hard requirement since brittleness fundamentally contradicts intelligence. This undermines many narrow AI claims and "teaching to the test" approaches.

  The scaffolding dilemma in requirement 3 is tricky. External tools are part of real-world intelligence, but we need to distinguish between using tools well versus relying on them entirely. This forces us to reject both extreme positions: that tools don't count at all versus tools being the only thing that matters. The ML compression view gets excluded here.

  For requirement 4, group intelligence presents a paradox. While groups can achieve what individuals can't, we shouldn't call the group itself intelligent unless there's an organizing principle. This requirement kills emergent intelligence theories that don't specify mechanisms. It's negotiable because defining that threshold is difficult.

  Finally, requirement 5 separates intelligence from efficiency. Solving the same problem slowly versus quickly doesn't indicate different intelligence levels, just different resources. This prevents confusing processing power with cognitive ability. The asterisk marks it as negotiable because extreme resource differences might indicate something fundamental.

  Noticing how these requirements interact: 
  - Requirement 3 and 5 might conflict since tool use affects efficiency
  - Requirement 2 and 3 pull against each other when tools provide robustness
  - The scaffolding clause in requirement 3 is where most accounts fail

  The user's real need seems to be finding defensible boundaries - for Ari's rights and for ethical AI claims. Their frustration with oversimplified ML definitions is palpable. The spec format cleverly avoids theoretical debates while forcing practical precision.
answer: |-
  Here are five requirements for an account of intelligence, anchored to your cases:

  1.  **Must distinguish competence from measurable performance.** It must accommodate cases like Ari's (a), where internal capability exists but external expression is hindered by assessment limitations or output modalities. *(Non-negotiable: Failure excludes individuals with disabilities. Kills strict behaviorism and output-only AI benchmarks.)*

  2.  **Must require robustness beyond specific task execution.** It must exclude leak-case systems (b) and rote memorizers, demanding adaptability where minor changes don't cause collapse. *(Non-negotiable: Brittleness is antithetical to intelligence. Kills narrow AI passing specific tests via hacking or memorization.)* **This requirement does the most work in excluding candidates.**

  3.  **Must account for tool/scaffold use without equating it with the core capacity.** It must explain (c) that leveraging tools (notebooks, language) is intelligent *action*, but distinguish the *ability* to effectively recruit and deploy scaffolds from the scaffold itself. *(Negotiable*: The line between internalized skill and external tool is fuzzy. Kills views that intelligence is *only* bare biological computation or *only* extended mind.) *<-- Potential conflict with (e) on whether scaffold use boosts intelligence or just efficiency.*

  4.  **Must define the locus of intelligence without automatically ascribing it to groups.** It must clarify for groups (d) that while intelligent *behavior* can emerge collectively, ascribing intelligence to the *group entity* requires demonstrating properties beyond aggregate individual actions (e.g., distributed problem-solving mechanisms). *(Negotiable*: The threshold for "group intelligence" is debatable. Kills simplistic emergent intelligence claims and anthropomorphizes markets/systems without mechanism.)*

  5.  **Must separate intelligence from computational efficiency or resource constraints.** It must acknowledge (e) that two entities solving the same problem correctly, one efficiently and one via slow brute force, can possess equivalent intelligence for *that* task; speed/resource use is a separate virtue. *(Negotiable*: Extreme resource needs *might* indicate a lack of efficient algorithms, hinting at limits. Kills definitions conflating intelligence with processing speed or low computational cost, like some ML efficiency metrics.)*
