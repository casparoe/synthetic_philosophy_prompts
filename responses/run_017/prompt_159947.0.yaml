answer: |-
  Here's your decision tree for the inefficacy objection, built from causal structure and centered on dose-response analogy. **Spine question: Branch 1.** **My defense: Expectabilism.** **Incoherent cell: Bare case + "No moral remainder."**

  ---

  ### Decision Tree: Inefficacy Objection (Start: "My individual act doesn’t cause harm, so nothing wrong/required.")

  1.  **Is the causal link between an act and harm deterministic AND step-function?** *(Like a cliff: Harm only occurs if exactly N acts happen?)*
      *   **A: Yes (Step-function)** → Go to 2
      *   **B: No, it's smooth but pooled/rounded** *(e.g., orders batched; harm jumps only every Kth act)* → Go to 3
      *   **C: No, genuinely continuous/probabilistic** *(e.g., each act adds a tiny, measurable harm/risk)* → Go to 4

  2.  **In a full-compliance scenario (everyone acts), was the threshold N exactly met?**
      *   **A: Yes** → **Threshold Deontology (Conditional Wrongness):** Your act was *necessary* for harm. Wrong if threshold met.
      *   **B: No (Overdetermination: >N acted)** → **Collective Obligation Reductivism:** Harm caused by the *group*, but no *individual* caused harm or violated a duty *to not cause harm*. Obligation might shift to collective action. *(Overdetermination case)*

  3.  **Does your act significantly increase the *probability* of harm occurring?** *(Given batching/rounding)*
      *   **A: Yes (e.g., you are likely the 'tipping' purchase)** → **Expectabilism (Probabilistic Wrongness):** Wrong because it imposes a significant risk of harm. *(Rounding case)*
      *   **B: No (e.g., very unlikely to be the tipping point)** → **Fair Play / Integrity:** Not wrong *via causation*, but may violate fairness (free-riding) or personal integrity/norms. *(Rounding case - low prob tip)*

  4.  **Does the harm/risk scale linearly with the number of acts?** *(Dose-response: Linear No-Threshold (LNT) vs. Threshold)*
      *   **A: Yes (LNT-like)** → **Incrementalism (Complicity):** Each act contributes a tiny, real harm/risk. Cumulatively wrong; you are complicit. *(Bare case - continuous)*
      *   **B: No (Threshold-like)** → **Go to 5** *(Bare case - threshold)*

  5.  **In realistic partial compliance (e.g., 10% more like you act), does this significantly increase harm/risk?**
      *   **A: Yes** → **Participatory Harm (Group-Sensitive):** Your act is part of a *harmful practice*. Wrongness depends on group size/tendency. *(Partial-compliance case)*
      *   **B: No** → **UNCLEAR / UNNAMED:** If *no* causal link *and* group change insignificant, hard to ground individual wrongness. *(Empty: Unattractive - trivializes collective problems)*

  ---

  ### Logical Space & Occupancy

  | Branch Path (1-2-3-4-5) | Leaf Position                               | Status       | Why Empty? (If applicable)             |
  | :----------------------- | :------------------------------------------ | :---------- | :------------------------------------- |
  | **1A-2A**                | Threshold Deontology (Conditional Wrongness) | Occupied     |                                        |
  | **1A-2B**                | Collective Obligation Reductivism           | Occupied     |                                        |
  | **1B-3A**                | Expectabilism (Probabilistic Wrongness)     | Occupied     | **(My Defense)** Most realistic for market/aggregate harms. |
  | **1B-3B**                | Fair Play / Integrity                       | Occupied     |                                        |
  | **1C-4A**                | Incrementalism (Complicity)                 | Occupied     |                                        |
  | **1C-4B-5A**             | Participatory Harm (Group-Sensitive)        | Occupied     |                                        |
  | **1C-4B-5B**             | *"No Moral Remainder"*                      | **Empty**    | **Incoherent:** Denies obligation *even when* collective harm is clear and individual is a participating member. Logically possible but morally bankrupt. |
  | **1A-?** (N not met)     | *"No Harm Done"*                            | **Empty**    | **Unattractive:** Ignores risk-taking & coordination problems inherent in threshold scenarios. |

  *   **Cannot Separate:** Distinguishing pure "Fair Play" (1B-3B) from weak "Participatory Harm" (1C-4B-5A) is fuzzy in practice. Both rely on group membership/norms more than causation.
  *   **Where Dose-Response Analogy Breaks:** The analogy treats harm like radiation - a passive, probabilistic *effect*. It struggles with **participation in a harmful practice** (e.g., buying factory-farmed chicken isn't just adding risk; it's funding/sustaining the system) and **thresholds based on coordination/agency** (e.g., N signatures *trigger* an action, unlike radiation passively accumulating). Moral norms (fairness, complicity) often operate independently of the physical dose-response curve shape.

  ---

  ### Scoring Key (For Quiz Use)

  *   **Q1:** A=Step, B=Smooth+Rounding, C=Continuous
  *   **Q2:** A=Threshold Met, B=Overdetermined
  *   **Q3:** A=High Prob Tip, B=Low Prob Tip
  *   **Q4:** A=Linear (LNT), B=Threshold
  *   **Q5:** A=Group Change Harmful, B=Group Change Harmless

  **Match Path to Position:**
  *   1A-2A: Threshold Deontology
  *   1A-2B: Collective Obligation Reductivism
  *   1B-3A: Expectabilism
  *   1B-3B: Fair Play/Integrity
  *   1C-4A: Incrementalism
  *   1C-4B-5A: Participatory Harm
  *   1C-4B-5B: (Unnamed/Incoherent)

  ---

  ### My Commitments

  1.  **Load-Bearing Branch: Branch 1 (Causal Structure).** This fundamentally changes the nature of the obligation. Step-functions demand necessity/probability assessments, continuous curves demand complicity, rounded pools demand risk analysis.
  2.  **Correct Leaf: Expectabilism (1B-3A).** For *most* real-world collective harms (markets, emissions, resource use), outcomes are determined by aggregated actions with tipping points or batch effects. Your act's *expected harm* (probability * magnitude) is what matters morally, not whether it was the literal "straw."
  3.  **Incoherent Cell: 1C-4B-5B ("No Moral Remainder" in Bare Threshold Case).** If the collective harm is real, the practice is harmful, *and* adding more participants like you makes no difference, denying *any* individual obligation reduces morality to atomistic causation, making collective responsibility impossible and excusing participation in clear evils. It's logically coherent only by ignoring the moral context of participation.
