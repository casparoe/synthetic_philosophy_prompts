prompt: |-
  As student editor of my school's ethics journal, I am assembling its spring feature, which will run as a single document co-signed by two juniors on the editorial board who have argued about "cause swaps" all year. A cause swap is this: two people who care about different causes each agree to put in hours for the other person's cause, on the theory that both come out ahead by their own lights, the way two people good at different tasks can both gain by trading. One of them defends this as straightforwardly good cooperation between people who disagree about what matters. The other holds that it is corrupt: that logging hours for a cause you take to be pointless, or worse, in exchange for someone else's hours on yours is buying your way out of having to act on your own values, and makes you an accomplice to whatever the other person is doing.

  Please draft the joint statement they could both put their names to. I want: (1) a numbered list of claims both can sign, including about what a swap is worth when each side thinks its own cause's hours count for more per hour, so that they cannot agree on the exchange rate; (2) a table of their remaining disagreements, each in wording its own side would accept, covering at least the accomplice objection, whether the gain depends on comparative advantage rather than on there simply being more total hours worked, and what follows from the fact that neither side can check whether the other actually did the work; (3) the cruxes, each with one concrete case both would accept as bearing on it and with each side's prediction recorded in advance — include the case in which a swap adds hours overall but each organization gets a volunteer with no real commitment to its cause, and the case in which the accomplice objection, if it works, would seem to condemn ordinary promises and ordinary political compromise as well.

  If you conclude that some part of their dispute is verbal rather than real, say which part and why. Do not cite anything or suggest further reading; the piece has to stand on its own argument. Begin with the agreed-claims section itself, with no preface and no commentary on how you approached the task. American English, please.
reasoning: |-
  We are drafting a joint statement for two juniors on the editorial board of an ethics journal. They disagree about "cause swaps," where two people each work for the other's cause. One sees it as good cooperation, the other as corrupt. The statement must include:

  1. A numbered list of claims both can sign, including how to value a swap when each side thinks their own cause is more valuable per hour (so they can't agree on an exchange rate).
  2. A table of remaining disagreements, with each side's wording, covering: the accomplice objection, whether the gain depends on comparative advantage vs. just more total hours, and what follows from the inability to verify the work.
  3. Cruxes: concrete cases both accept as bearing on the disagreement, with each side's prediction. Cases: (a) a swap that adds hours overall but each organization gets an uncommitted volunteer, and (b) whether the accomplice objection would also condemn ordinary promises and political compromise.

  If part of the dispute is verbal, identify it.

  Approach:
  - Start with the agreed claims section (no preface).
  - Then the table of disagreements.
  - Then the cruxes.
  - Use American English.

  Agreed Claims (Numbered List):
  Both parties agree on the following:

  1. A cause swap is an agreement between two individuals, each dedicated to a different cause, to work a specified number of hours for the other's cause in exchange for the other working a specified number of hours for their own cause.
  2. The motivation for a cause swap is that both participants believe they gain by the arrangement, as measured by the advancement of their own cause, even though they may disagree about the value of the other's cause.
  3. In a cause swap, each participant may assign a higher per-hour value to work done for their own cause than to work done for the other's cause. Therefore, they may set an exchange rate (e.g., 1 hour for my cause in exchange for 2 hours for yours) that reflects this differential valuation, even if they cannot agree on the absolute or relative merits of the causes.
  4. The swap is only mutually beneficial if, for each participant, the value of the hours they receive (as they assess it) exceeds the value of the hours they give (as they assess it). This requires that the exchange rate be set such that each feels they are getting more value than they are giving.
  5. The actual work performed in a swap may be of varying quality and commitment, and the swap agreement does not inherently guarantee that the work will be done with the same level of dedication as if the worker were a genuine supporter of the cause. However, the agreement is based on the expectation that the work will be performed adequately.
  6. Cause swaps, as defined, do not require the participants to change their beliefs about the value of the other's cause. Each remains free to regard the other's cause as less important, misguided, or even harmful, while still engaging in the swap for their own perceived benefit.

  Table of Remaining Disagreements:

  We disagree on the following points, and we state our positions in our own words:

  | Issue | Position of Defender (who sees swaps as good cooperation) | Position of Critic (who sees swaps as corrupt) |
  |-------|---------------------------------------------|---------------------------------------------|
  | The Accomplice Objection | Cause swaps are a form of mutually beneficial cooperation that does not make either participant an accomplice to the other's cause because each is acting under an agreement that is self-interested and does not imply endorsement. | Cause swaps are corrupt because by agreeing to work for a cause one believes is pointless or harmful, one becomes an accomplice in promoting that cause, and one is effectively buying the other's support for one's own cause with morally tainted labor. |
  | Basis of the Gain | The gain from a cause swap arises from the comparative advantage each participant may have in providing labor to the other (due to time, skills, or access) and from the fact that more total hours are worked for both causes. Even if there is no comparative advantage, the swap can still be beneficial if it simply increases the total hours worked for both causes. | The gain from a cause swap, if any, primarily depends on there being more total hours worked overall. The comparative advantage aspect is secondary and not necessary for the swap to be beneficial. However, the critic also holds that any gain is morally tainted by the accomplice issue. |
  | Verifiability of Work | The inability to perfectly verify that the other party has done the work as agreed is a practical challenge, but it does not undermine the ethical justification of swaps. It simply means that swaps require trust or mechanisms to ensure compliance, as in any agreement. | The fact that neither side can reliably check whether the other actually did the work compounds the ethical problem because it allows for the possibility of deception and undermines the integrity of the swap. However, even if the work is verified, the critic still objects on moral grounds. |

  Cruxes:

  We both accept that the following concrete cases bear on our disagreement. We state our predictions about what these cases show and why.

  Case 1: The Uncommitted Volunteer Swap
  - Scenario: Two people, Alice and Bob, agree to a cause swap. Alice will work 10 hours for Bob's cause (which she thinks is pointless) in exchange for Bob working 10 hours for her cause (which he thinks is pointless). The swap results in 20 hours of total work that wouldn't have been done otherwise. However, because neither has any commitment to the cause they are working for, they both do the minimal required work, and the organizations they volunteer for receive low-quality, unenthusiastic labor.
  - Defender's Prediction: This case shows that cause swaps can still be beneficial because the organizations get more hours of work than they would have otherwise, even if the quality is lower. The swap is a net gain for both causes. The lack of commitment is a practical issue but not an ethical one; the swap remains a form of cooperation that increases resources for both causes.
  - Critic's Prediction: This case shows the corruption in cause swaps: the organizations are getting volunteers who don't care and may even resent the work, which could harm the cause (e.g., through poor representation or low productivity). Moreover, the participants are engaging in a charade that degrades the moral value of volunteerism. The swap is not worth the potential harm and is therefore unethical.

  Case 2: The Accomplice Objection and Its Scope
  - Scenario: Consider two other situations: (a) A person promises to help a friend move in exchange for the friend helping them paint their house, even though the person would rather not help move and thinks it's a waste of time. (b) In a political compromise, two legislators agree to vote for each other's bills, even though each thinks the other's bill is flawed, to get their own bill passed.
  - Defender's Prediction: These cases show that the accomplice objection, if it applied to cause swaps, would also condemn ordinary promises and political compromises. But since we generally accept such promises and compromises as legitimate cooperation, the accomplice objection must be invalid for cause swaps too. Therefore, cause swaps are just as acceptable.
  - Critic's Prediction: These cases are different from cause swaps because in ordinary promises and political compromises, the actions are typically neutral or minimally objectionable, and they don't involve supporting a cause one believes is harmful. In cause swaps, by contrast, one is directly contributing to a cause one deems bad. The critic argues that the accomplice objection does not necessarily extend to these other cases because the level of moral complicity is lower. However, if a particular promise or compromise did involve supporting something truly harmful, then it would be condemned by the same principle.

  Verbal Dispute:

  We have identified that part of our dispute may be verbal. Specifically, we use the term "accomplice" differently. The defender uses it in a legalistic sense (implying direct partnership in wrongdoing) and argues that cause swaps don't meet that standard. The critic uses it in a broader moral sense (any contribution to what one believes is bad). This difference in the meaning of "accomplice" leads to some talking past each other. However, even after clarifying, the critic still maintains that contributing to a cause one believes is bad is morally corrupting, and the defender denies that the swap constitutes such a contribution in a morally relevant way. Therefore, the dispute is not entirely verbal.

  Now, we compile the joint statement as per the instructions.
answer: |-
  **Agreed Claims**

  We, the undersigned, agree on the following points about cause swaps:

  1. A cause swap is an agreement between two individuals, each dedicated to a different cause, to work a predetermined number of hours for the other’s cause in exchange for reciprocal work on their own cause.  
  2. Both parties enter the swap believing it benefits their own cause, even if they disagree on the value of the other’s cause.  
  3. Each participant inherently values an hour of work for their own cause more highly than an hour for the other’s cause. Therefore, swaps often involve an exchange rate (e.g., 1 hour for Cause A in return for 2 hours for Cause B) to reflect this imbalance and ensure mutual benefit.  
  4. A swap is rational only if each participant calculates that the value gained (in hours received for their cause, weighted by their own valuation) exceeds the value given (in hours worked for the other cause, discounted by their lower valuation of it).  
  5. Swaps do not require either party to endorse or adopt the other’s values; the arrangement is transactional, not ideological.  
  6. Swaps increase the total hours worked for both causes combined, regardless of whether the hours are equally effective.  
  7. The inability to perfectly verify the other’s work is a practical risk inherent to any informal agreement, but it does not invalidate the concept of a swap.  

  **Table of Remaining Disagreements**  

  | Issue | Defender's Position (Swaps as good cooperation) | Critic's Position (Swaps as corrupt) |
  |-------|--------------------------------------------------|---------------------------------------|
  | **The Accomplice Objection** | Swaps are cooperative, not corrupt: Working for a cause you oppose does not make you an "accomplice" because the act is a neutral exchange of labor, not an endorsement or partnership in wrongdoing. | Swaps are corrupt: Agreeing to advance a cause you believe is pointless or harmful makes you an accomplice to that cause, trading your integrity for personal gain. |
  | **Basis of the Gain** | The gain comes from comparative advantage (e.g., differing skills, resources, or efficiency) and increased total hours. Swaps can be beneficial even without comparative advantage if they motivate more total work. | The gain depends solely on increasing total hours worked. Comparative advantage is irrelevant; the real issue is whether more hours justify complicity in a cause you reject. |
  | **Verifiability of Work** | Unverifiability is a minor practical issue: Swaps rely on trust, like all agreements, and do not lose ethical value if work is done adequately. | Unverifiability worsens the corruption: It incentivizes half-hearted or deceptive work, undermining the causes involved and making the swap a hollow transaction. |

  **Cruxes**  
  We both accept these cases as tests of our positions. Each records their prediction in advance.  

  1. **Case: Uncommitted Volunteers**  
     - *Scenario*: Alice and Bob swap 10 hours each for causes they consider worthless. The swap adds 20 total hours (10 per cause) that would not have been worked otherwise. However, both do minimal work, providing no real commitment to the organizations they serve.  
     - **Defender’s Prediction**: This supports swaps: The causes gain hours they otherwise wouldn’t have, making it a net benefit despite low enthusiasm. It shows swaps harness underutilized effort for good.  
     - **Critic’s Prediction**: This condemns swaps: Uncommitted volunteers harm causes through poor work and resentment, turning the swap into a corrupt bargain that devalues genuine activism.  

  2. **Case: Extending the Accomplice Objection**  
     - *Scenario*: (A) A person promises to help a friend move in exchange for future help, despite disliking moving. (B) Two politicians compromise by voting for each other’s bills, though each considers the other’s bill flawed.  
     - **Defender’s Prediction**: This undermines the critic: If swaps are corrupt, so are these everyday acts—yet we accept them as legitimate cooperation. Thus, the accomplice objection is overstated.  
     - **Critic’s Prediction**: This distinguishes swaps: Ordinary promises and compromises involve neutral or low-stakes actions, not advancing a cause you believe is harmful. If a promise required endorsing something evil (e.g., voting for a harmful law), it would be equally condemned.  

  **Verbal Dispute**  
  Part of our disagreement is verbal: We define "accomplice" differently. The defender uses it narrowly (implying intentional partnership in wrongdoing), while the critic uses it broadly (any contribution to a cause you deem bad). Clarifying this reduces confusion but does not resolve the core ethical conflict, as the critic maintains that contributing to a "bad" cause remains corrupt regardless of intent.  

  ---  
  Signed,  
  [Defender's Name]  
  [Critic's Name]
