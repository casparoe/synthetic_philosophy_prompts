  We design questions that correspond to the branch nodes:

  - Direct Attack (D2): 
    - Question: Have there been any incidents of data being manipulated, falsified, or selectively reported to make the metric look better?

  - Constitutive (C): 
    - Question: Is the metric itself part of the official definition of success for the activity? (e.g., "good teaching" is defined as high test scores)

  - Incentive structure (B): 
    - Question: Does the metric trigger a sharp change in consequences when it crosses a specific value? (e.g., funding is lost if below 80%, but there's no extra reward for 90%)

  - Speed (A): 
    - Question: Can the people being measured find new ways to improve the metric faster than the organization can update the metric to account for those ways?

  We need to design 10 questions that cover the tree and lead to the leaves.

  But the tree has 4 branch points, so we need at least 4 questions. We want 10 to make it robust.

  We design 10 questions that are concrete and then a scoring rule.

  Quiz Questions:

  1. If the metric improves, does the underlying goal also improve? (This maps to damage location, which we collapsed, but we can use it as an overall check)
  2. Have there been any incidents of data being manipulated or falsified to make the metric look better? (Direct attack)
  3. Is the metric used in a way that crossing a specific threshold has a large consequence? (Cliff vs gradient)
  4. Can the people being measured find new ways to improve the metric faster than the organization can update the metric? (Fast agent)
  5. Is the metric part of the official definition of what the activity is? (Constitutive)
  6. When the metric improves, does it seem to be because people are doing more of what was intended, or because they are doing something else? (Effort substitution vs direct attack and constitutive)
  7. Are there other ways to achieve the underlying goal that do not involve the metric? (Non-constitutive)
  8. When the metric is high, does it still mean the same thing as when it was moderate? (Proxy decay at extremes)
  9. Does the organization frequently change how the metric is defined or measured? (Fast measurer)
  10. Do people being measured avoid taking on hard cases that might lower the metric? (Cream-skimming)

  But these are not all independent. We design the scoring rule to map to the tree branches.

  The tree branches are:

  - D: direct attack? (Q2)
  - C: constitutive? (Q5)
  - B: cliff? (Q3)
  - A: fast agent? (Q4 and Q9: if Q4 is yes and Q9 is no, then fast agent; if Q4 is no and Q9 is yes, then fast measurer)

  But we have more questions.

  We design the scoring rule as follows:

  Step 1: If Q2 (data manipulation) is yes, then leaf 1 (Direct Attack).
  Step 2: If not, then if Q5 (constitutive) is yes, then go to step 3. If no, then go to step 4.
  Step 3: Constitutive branch: 
     - If Q3 (cliff) is yes, then 
          - If Q4 (fast agent) is yes and Q9 (frequent change) is no, then leaf 2.
          - If Q4 is no and Q9 is yes, then leaf 7.
     - If Q3 is no (gradient), then
          - If Q4 is yes and Q9 is no, then leaf 3.
          - If Q4 is no and Q9 is yes, then leaf 8.
  Step 4: Non-constitutive (so effort substitution):
     - If Q3 (cliff) is yes, then 
          - If Q4 is yes and Q9 is no, then leaf 4.
          - If Q4 is no and Q9 is yes, then leaf 9.
     - If Q3 is no (gradient), then
          - If Q4 is yes and Q9 is no, then leaf 5.
          - If Q4 is no and Q9 is yes, then leaf 6.

  But note: leaf 6 is survival.

  We have 10 questions, but we only use a few. The other questions can be used as tie-breakers or for additional insight.

  For example, Q1 (if the goal improves) can be used to confirm if there is real improvement or not. Q6 and Q7 can help confirm constitutive or not. Q8 can help identify proxy decay at extremes. Q10 can help identify cream-skimming.

  But for the main scoring, we use Q2, Q3, Q4, Q5, Q9.

  Now, we apply to two cases.

  First case: clean verdict.

  Choose: "a hospital emergency department judged on the share of patients seen within four hours, where patients are held in ambulances before the clock starts."

  - This is direct attack: they are manipulating the start of the clock, which is a direct attack on the measurement channel.
  - So leaf 1: Direct Attack.

  Second case: ambiguous.

  Choose: "a school whose test scores rise for three years while an unaudited assessment administered by a different body stays flat"

  - This suggests effort substitution: the school is focusing on the test (e.g., teaching to the test) but not improving real learning (as measured by the other assessment). 
  - It is non-constitutive: the test is a proxy for learning, not the definition of learning.
  - Incentive: probably a cliff or gradient? In schools, often there are thresholds (e.g., pass rates) but also graded rewards. Let's assume graded.
  - Speed: the school (agent) can adapt faster than the measurer (the test body) can change the test? Probably yes, because tests change slowly.
  - So we would go to leaf 5: Effort Substitution in Gradient with Fast Agent.

  But is there an alternative? Could it be constitutive? In some systems, test scores become the definition of good education. But the fact that an unaudited assessment (which is also a measure of learning) stays flat suggests that the underlying goal (learning) is not improving. So it's not constitutive because if it were constitutive, then the test score would be the goal, and we wouldn't care about the other assessment. But the other assessment is a second measure of the same underlying goal, so the damage is to the informativeness.

  So leaf 5.

  But what is the ambiguity? We can choose a case that is between direct attack and effort substitution. For example, "a police force measured on the share of reported crimes cleared". 

  - They might do effort substitution: focus on easy-to-solve crimes and discourage reporting of hard ones. 
  - Or they might directly attack by downgrading crimes to avoid reporting them or by falsely recording them as cleared.

  This is ambiguous between leaf 1 (direct attack) and leaf 5 (effort substitution). 

  The key is: if they are manipulating the data (direct attack) or if they are changing their behavior in a real way that is not what was intended (effort substitution). 

  The evidence: if there is data manipulation (e.g., false records) then direct attack. If they are selectively targeting easy crimes, then effort substitution.

  Without evidence of data falsification, it could be either. The tree cannot settle without knowing if there is direct attack on the measurement.

  Further evidence: look for discrepancies in crime reporting (e.g., if victims report being discouraged) or audit the records.

  So for the second case, we choose the police force.

  Worked applications:

  1. Hospital emergency department: 
     - Tree: Direct Attack (leaf 1).
     - Signature: Patients are held in ambulances to delay the clock, which is direct manipulation of the measurement.
     - In the quiz: Q2 (data manipulation) is yes, so leaf 1.

  2. Police force on share of crimes cleared:
     - Ambiguous between leaf 1 (Direct Attack) and leaf 5 (Effort Substitution in Gradient with Fast Agent) or leaf 4 (Threshold-Hugging) if there is a threshold.
     - Assume there is a threshold (e.g., target of 30% cleared) and they are just above it, then leaf 4 or 9. But let's not assume threshold.
     - The incentive is likely a cliff (target) but also may have graded rewards.
     - Without evidence of data falsification, the tree might lead to effort substitution. But if there is evidence of downgrading crimes, then direct attack.
     - Further evidence: audit the crime records to see if crimes are being inappropriately downgraded or cleared without a proper basis. If found, then direct attack; if they are just focusing on easy crimes, then effort substitution.

