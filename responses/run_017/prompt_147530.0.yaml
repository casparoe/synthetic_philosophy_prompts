  ### The Quantification Failure Tree  
  When a metric becomes a target, it often stops being a good metric. Goodhart's law is the name for this phenomenon, but knowing the label doesn't help diagnose *why* a specific measure failed. This tree—built from five core questions distilled from real-world cases—identifies failure modes by observable signatures, not theoretical mechanisms. Use it to trace why your metric decayed and what to check next.  

  #### Branch Questions and Logic  
  The tree uses four independent questions that generate nine failure/survival modes. Question 1 (damage location) was collapsed because it describes outcomes, not causes (e.g., proxy decay implies damaged informativeness). The remaining four were tested for diagnostic independence:  
  - **Speed (Who moves faster?)**  
  - **Cliff/Gradient (Threshold or smooth payoff?)**  
  - **Constitutive (Is the measure part of the practice’s definition?)**  
  - **Channel (Effort substitution or direct attack?)**  

  Branching order prioritizes observable signatures:  
  1. **Channel**: Direct attacks on measurement leave distinct forensic traces.  
  2. **Constitutive**: Recasts the meaning of "improvement."  
  3. **Cliff/Gradient**: Thresholds create visible behavioral discontinuities.  
  4. **Speed**: Determines sustainability of the metric.  

  Combining these yields nine leaves (see table below). Unoccupied combinations:  
  - *Constitutive + Direct attack*: Incoherent—if the metric defines the goal, attacking it is irrational.  
  - *Non-constitutive + Gradient + Fast measurer + Direct attack*: Unexplored—likely rare as gradients incentivize subtle gaming, not blatant sabotage.  
  - *Non-constitutive + Cliff + Fast measurer + Direct attack*: Unattractive—measurers controlling thresholds rarely invite attacks they can’t counter.  

  #### Leaf Definitions  
  Each leaf includes:  
  1. **Observable signature**: What to check immediately.  
  2. **Awkward commitment**: The non-negotiable implication if this is your diagnosis.  
  3. **Mover**: The fact that, if true, reclassifies the failure.  

  | Leaf | Failure/Survival Mode               | Observable Signature                                                                 | Awkward Commitment                                                                 | Mover                                                                 |
  |------|-------------------------------------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | 1    | **Direct Attack**                   | Discrepancies between metric and untampered data streams (e.g., missing records, audit trails). | Your measurement channel is corruptible by design or neglect.                     | If effort is redirected, not measurement degraded (→ Leaf 4,5,7).    |
  | 2    | **Threshold-Hugging (Fast Agent)**  | Bunching just above cutoff; avoidance of hard cases near threshold.                  | The threshold *is* the goal—exceeding it wastes resources.                        | If consequences are smooth (→ Leaf 5).                               |
  | 3    | **Cream-Skimming**                  | Easier cases selected; performance drops in unaudited contexts.                      | You’re rewarding cherry-picking, not underlying improvement.                      | If metric defines the practice (→ Leaf 8).                           |
  | 4    | **Proxy Decay at Extremes**         | Metric drifts from correlated indicators at high values (e.g., high scores ≠ high quality). | Pushing the measure breaks its link to reality at the top end.                    | If measurer updates metric faster than agents game it (→ Leaf 9).    |
  | 5    | **Redefined Practice (Threshold)**  | Activity narrows to threshold-meeting; unmeasured aspects atrophy.                  | "Success" now means hitting the target, nothing more.                             | If threshold has no discontinuity (→ Leaf 6).                        |
  | 6    | **Redefined Practice (Gradient)**   | Metric improves, but institution loses interest in unmeasured dimensions.            | The metric has rewritten the mission statement.                                   | If practice has an independent definition (→ Leaf 3,4).              |
  | 7    | **Surviving Metric (Static)**       | Metric tracks goal before/after targeting; no gaming evidence.                       | Your measure is unusually robust or your agents are inert.                        | If agents adapt faster than measurer (→ Leaf 4).                     |
  | 8    | **Threshold Arms Race**             | Frequent threshold adjustments; gaming patterns shift rapidly.                       | You’re in a loop where gaming dictates measurement, not goal achievement.         | If agents cannot outpace measurer updates (→ Leaf 5).                |
  | 9    | **Surviving Metric (Adaptive)**     | Metric correlates with goal despite targeting; revisions occur preemptively.         | You must invest in continuous metric innovation to avoid decay.                   | If measurer loses capacity to update (→ Leaf 3,4).                   |

  #### Diagnostic Quiz  
  Answer these ten concrete questions about your metric. **Scoring**: Tally "Yes" answers and match to leaves using the key. Disagreements arise when signatures conflict (e.g., threshold effects in a gradient leaf)—resolve by prioritizing Channel > Constitutive > Cliff/Gradient > Speed.  

  1. **Data Manipulation**: Have employees ever falsified records, hidden data, or tampered with collection tools to improve the metric?  
  2. **Threshold Rush**: Do teams scramble to hit specific round numbers (e.g., 90%) while ignoring higher values?  
  3. **Easier Cases**: Are measurable outcomes improving because "hard" cases are avoided or deprioritized?  
  4. **High-Value Decay**: When the metric reaches its best scores, does its real-world meaning change?  
  5. **Goal Substitution**: Has leadership redefined "good performance" using the metric?  
  6. **Static Metric**: Has the measure’s formula remained unchanged since it became a target?  
  7. **Threshold Fluidity**: Are cutoff points adjusted frequently in response to gaming?  
  8. **Independent Audit**: Would an external observer agree your metric captures the intended goal?  
  9. **Fast Adaptation**: Can employees find new ways to "game" the metric within weeks?  
  10. **Metric Updates**: Does management revise the measure more than once a year?  

  **Quiz Key**:  
  - **Leaf 1**: Yes on Q1.  
  - **Leaf 2**: Yes on Q2 + No on Q10.  
  - **Leaf 3**: Yes on Q3 + No on Q5.  
  - **Leaf 4**: Yes on Q4 + No on Q10.  
  - **Leaf 5**: Yes on Q2 + Q5.  
  - **Leaf 6**: Yes on Q5 + No on Q2.  
  - **Leaf 7**: Yes on Q6 + No on Q9.  
  - **Leaf 8**: Yes on Q2 + Q7.  
  - **Leaf 9**: Yes on Q10 + No on Q1.  

  #### Worked Applications  

  **Case 1: Hospital Emergency Department (Clean Verdict)**  
  *Metric*: Share of patients seen within four hours.  
  *Behavior*: Patients held in ambulances to delay the "clock start."  
  - **Tree Analysis**:  
    - *Channel*: Direct attack—ambulance delays degrade measurement integrity.  
    - *Constitutive*: Not applicable—wait times measure throughput but don’t define care quality.  
    - → **Leaf 1 (Direct Attack)**.  
  - **Signature**: Mismatch between ambulance logs (showing long waits) and official metrics.  
  - **Confirmation**: Compare time-stamped ambulance records with internal "clock-start" times.  
  - **Quiz**: Q1=Yes → Leaf 1.  

  **Case 2: Police Force (Ambiguous)**  
  *Metric*: Share of reported crimes cleared.  
  *Behavior*: Minor crimes prioritized; serious crimes downgraded or discouraged from reporting.  
  - **Tree Analysis**:  
    - *Channel*: Ambiguous—downgrading attacks measurement, prioritization substitutes effort.  
    - *Constitutive*: Unclear—does "cleared crimes" define policing success?  
    - *Cliff/Gradient*: Likely cliff (e.g., 20% clearance target).  
    - → Ambiguous between **Leaf 1 (Direct Attack)** and **Leaf 2 (Threshold-Hugging)**.  
  - **Disambiguator**: Audit crime classification rules. If crimes are *reclassified* (e.g., felony to misdemeanor), → Leaf 1. If effort is *shifted* to easy cases but classifications are honest, → Leaf 2.  
  - **Why Tree Can’t Settle**: "Downgrading" could be effort substitution (Leaf 2) or data manipulation (Leaf 1). The tree relies on observable forensics, not intent.  
  - **Quiz**: Q1=Maybe, Q2=Yes, Q3=Yes. Without Q1 clarity, inconclusive.  

  ---

  ### Why This Tree Works  
  This instrument forces diagnosis through observable patterns, not jargon. It accepts ambiguity (e.g., Leaf 3 and 4 both involve effort substitution) because real metrics often decay through multiple paths. When your number stops working, don’t classify—investigate. The signatures tell the story; the leaves are where you start reading.
