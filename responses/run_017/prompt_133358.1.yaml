prompt: |-
  I run a graduate reading group on moral progress, and one of the regulars — a political theorist with a taste for sceptical arguments — produced the following over dinner. I've spent a fortnight on it and cannot locate the mistake, but the conclusion is one I won't accept. I'd be grateful for a diagnosis rather than a survey.

  Her argument, as nearly as I can reconstruct it:

  (1) The circle of moral concern has expanded. At each stage of the history we can reconstruct, some class previously treated as outside the circle — outsiders, slaves, women, animals, future generations — comes to be counted, and the earlier arrangement now looks to us defective in exactly that respect.

  (2) The best explanation of this pattern is not that earlier people were unusually stupid or unusually cruel. It is that moral conviction is socially situated: people reliably fail to register considerations that their social world gives them no occasion to register, and they are most confident precisely where they are blind.

  (3) If (2) is right, then we are in the same position. There are considerations bearing on our moral judgements that our situation prevents us from seeing, and so some of our confident moral judgements are false in ways we cannot now detect.

  (4) And we cannot say which. Every test we might run — coherence, reflective equilibrium, appeal to our firmest principles — is run using the judgements that are themselves in question, since the blindness described in (2) is a blindness to exactly that.

  (5) When you know that an unidentified subset of your confident judgements in some domain is false, and you cannot identify which, you should lower your confidence in each of them by the same proportion. Call this the flat-rate defeater.

  (6) The judgement that the earlier stages were defective — the thing that makes (1) more than a demographic fact about who counted whom — is itself one of our confident moral judgements, and (5) applies to it as much as to any other.

  (7) And the consequence generalises: the argument gives us no more reason to trust the abolitionists' confidence than the slaveholders', since both were socially situated in the sense of (2). On this telling, abolitionism was one more local conviction.

  (8) But (7) is absurd — the abolitionist judgement is precisely what the expanding-circle story was supposed to vindicate — and (1) is about as well-confirmed as anything in this neighbourhood. So something in the chain is false, and I cannot see what.

  Two wrinkles. First, she says it does not matter whether a given expansion is additive (an already accepted principle extended to a new class of subjects) or revisory (a new principle displacing an old one); the argument, she claims, runs on either assumption. I suspect it does matter, and that the difference bears on which step to reject, but I cannot work out which way round. Second, she offers an illustration of (5): imagine a reliable oracle that tells us, truly, that exactly one of our ten firmest moral judgements is false, and tells us nothing more. She thinks the flat-rate defeater plainly applies and we should dock all ten equally. I find that I want to rank the ten and dock the shakier ones harder — while also suspecting that ranking is exactly what (4) rules out, because the only rankings available to me are built out of the ten judgements themselves. So I go round in circles.

  If I have to choose what to keep, I would keep (1) and (2): the historical claim and the social-situation explanation strike me as the best-supported parts of the story, and I would rather give up almost anything else. But (5) strikes me as close to a platitude about evidence, and (4) strikes me as little more than what (2) already says, so I do not see how to surrender either of those either.

  Please don't send me a reading list or a summary of the literature on moral progress, on the argument from disagreement, or on genealogical debunking — I've read a good deal of it and it will not settle this. What I want is the diagnosis. Please write in American English, in under 1,000 words, in four named sections in this order:

  - "Diagnosis" (250–300 words): which step or premise fails, and precisely what the mistake is — an equivocation, a scope or quantifier shift, a slide between two claims that the premises don't support, or whatever it turns out to be. Include what the oracle case does and does not show.
  - "Why it looked sound" (about 150 words): what makes the faulty step attractive, and why a careful reader wouldn't notice the shift.
  - "The alternatives and their price" (about 350 words): for each of the other steps I might reject instead — at least (3), (4), (5), (6) and the move to (7), plus the additive/revisory distinction — what I would be committed to if I rejected it, and how much that costs me.
  - "Bottom line" (about 80 words): the single sentence I should say to my friend.
reasoning: |-
  Hmm, the user runs a graduate reading group on moral progress and is grappling with a skeptical argument from a political theorist. The argument concludes that we should be equally skeptical of all moral judgments, including our own belief that past moral expansions were improvements. The user finds this conclusion unacceptable but can't locate the flaw after two weeks of effort. They've requested a specific diagnosis rather than literature survey.

  The argument has eight steps: (1) describes historical moral expansion; (2) attributes this to social situatedness rather than stupidity/cruelty; (3) says we're similarly situated; (4) claims we can't test our blind spots; (5) introduces a "flat-rate defeater"; (6) applies this to our judgment about past defects; (7) concludes we can't privilege abolitionist over slaveholder views; (8) notes this contradicts (1).

  The user suspects the additive/revisory distinction matters but can't see how. They're troubled by the oracle case meant to illustrate (5). Their strong preferences are to keep (1) and (2), while finding (5) plausible and (4) hard to deny.

  The key flaw is in step (5) - the "flat-rate defeater" principle. It mistakenly treats all moral judgments as epistemically equivalent despite differences in their relationship to the social blind spot mechanism described in (2). The oracle case is misleading because it presents judgments as randomly defective, whereas actual moral errors stem from specific structural biases.

  The argument's appeal lies in how it generalizes the social situatedness insight without noticing that some judgments are about the situatedness itself. The abolitionist/slaveholder symmetry in (7) seems compelling but ignores that abolitionism often emerged from recognizing the blind spot, not being trapped by it.

  Rejecting other premises would be costly: (3) requires denying our situatedness; (4) demands impossible tests; (6) involves special pleading; the additive/revisory distinction doesn't actually resolve the core issue.

  The bottom line response should challenge the false symmetry while accepting the situatedness premise: "You've shown we're situated, not that we're symmetrically blind - the judgment that slavery was wrong came from seeing what the slaveholders' situation hid, which is exactly how progress works."
answer: |-
  ### Diagnosis
  The flaw lies in **step (5)**, the "flat-rate defeater" principle. It misapplies probabilistic reasoning to moral epistemology by treating all "confident judgments" as equally vulnerable to the blindness described in (2), when in fact some judgments are *about* that blindness itself and thus occupy a privileged epistemic position. The oracle case illustrates this error: it assumes all ten judgments are *randomly* defective, but the blindness in (2) is **systematic and structural**—it targets *specific kinds* of overlooked considerations (e.g., interests of excluded groups). Our judgment that slavery is wrong **is not blind in the same way** as past defenses of slavery; it arises from *explicitly rejecting* the situational blindness that justified slavery. The oracle case shows only that *random* defects warrant flat doubt, not that *structurally explained* defects do. Step (5) equivocates between "unidentified false judgments" (which *could* warrant flat doubt) and "judgments false due to a *known structural bias*" (which do not, because the bias’s direction and targets can be analyzed).

  ### Why It Looked Sound
  Step (5) seems plausible because it mimics rational responses to undifferentiated uncertainty (e.g., "one of these ten coins is fake, so distrust all equally"). The argument’s force comes from generalizing (2)’s social-situatedness to imply **symmetrical doubt**: if past agents were blind, and we’re blind too, all moral judgments seem equally suspect. The oracle case cements this by presenting a neat, random defect model. Careful readers miss the shift because (2) focuses on *reliably overlooked considerations*, not random errors, but step (5) subtly reframes this as generic unreliability.

  ### The Alternatives and Their Price
  - **Reject (3)**: Deny we’re socially situated like past agents. Cost: Contradicts (1)–(2), which are well-supported. If our epistemic situation differs fundamentally, we need an ad hoc explanation for why *we* escape situatedness (e.g., "modern critical methods"), undermining the historical parallel.  
  - **Reject (4)**: Claim we *can* identify blind spots via tests like coherence. Cost: Ignores (2)’s core insight—social blindness distorts the tools themselves. If reflective equilibrium *could* detect all errors, (2) would be false.  
  - **Reject (6)**: Exempt our judgment about past defects from doubt. Cost: Inconsistent application of (5). If we exempt this judgment, we need a principled reason (e.g., "it’s meta-moral"), inviting charges of special pleading.  
  - **Reject (7)’s symmetry**: Deny that abolitionists and slaveholders are epistemically equal. Cost: Requires showing why abolitionists’ situatedness *didn’t* undermine their judgment. This succeeds if we note abolitionists *critiqued* the blindness (e.g., extending empathy), but the skeptic will argue this just swaps one bias for another.  
  - **Additive/Revisory Distinction**: If expansions are additive (applying old principles to new groups), our judgment might rely on uncontested principles. If revisory (new principles), doubt seems unavoidable. **Cost**: Neither resolves the core issue. Additive expansions still require seeing *who counts*—the very thing (2) says is situationally obscured. Revisory changes can be defended as corrections of past blindness (e.g., rejecting "natural inferiority" myths), but this concedes bias and requires a non-question-begging standard.  

  ### Bottom Line
  "Your argument conflates *being socially situated* with *being symmetrically blind*—our judgment that slavery was wrong succeeds precisely by diagnosing the situational blindness that justified it, which is why step (5)’s flat doubt doesn’t apply."
