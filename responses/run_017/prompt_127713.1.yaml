prompt: |-
  You are a professional philosopher who works on normative ethics and decision theory, with a specialty in intergenerational justice and the foundations of discounting. Think carefully and work in stages. First, brainstorm five or six genuinely distinct candidate principles about when, if ever, the mere lateness of a good or a harm is itself a reason to weight it less — do not settle on the first plausible one, and do not assume that the candidates must be utilitarian. Second, test each candidate against the verdicts below, one verdict at a time, and record where each candidate goes wrong. Third, recommend one principle, or a small set of rivals, state it precisely enough that I could apply it to a new case without asking you again, and attach to each clause the case that motivates it. Fourth, tell me honestly which of my verdicts your principle cannot save, and which one you would overturn if forced. Where a verdict of mine is really explained by something other than pure time preference — uncertainty, opportunity cost, diminishing marginal value, the chance that the beneficiary never exists, or the fact that I will be dead — say so explicitly and peel it off; I want to know whether anything is left that is genuinely about time as such.

  I should say who I am: I write novels, not papers. My current book is a saga set in one river valley across five centuries, and several scenes turn on a single institution I invented, the Nine Generations Trust, whose deed instructs its trustees to do the most good they can for the valley's inhabitants over a 500-year span, saying nothing about how to weight a benefit by the date on which it falls. Chapter 11 is a trustees' meeting in which they must choose between relieving present hardship and locking resources into instruments that mature long after every one of them is dead. I can live with a character who is inconsistent; I cannot write the argument in the room unless I know what the defensible options actually are. So please don't give me a survey of the literature, a bibliography, or citations — I have no way to check them, and they would be useless to me. Reason from the cases.

  Here is the tentative principle I have been working with: a discount is legitimate only if its spatial analogue is also legitimate — that is, only if I would accept the same discounting for a beneficiary who is far away rather than far in the future. Take it apart and repair it if you can, or replace it if it can't be repaired.

  My verdicts:

  1. An evening of exactly the kind I most enjoy, tonight, versus an identical evening a year from now: I take tonight, and I feel no guilt. I take this to be contaminated by opportunity cost, but I am not certain that's all of it.

  2. Five days of toothache now versus five days of exactly similar toothache ten years from now, with dread, memory, knock-on effects and uncertainty all stipulated away: I postpone, and I feel no guilt, even though I can't point to anything except the date. This is the verdict I am least able to defend and least willing to give up.

  3. My own book published now to a small readership versus, by my own instruction, sealed and published in 2175 to a larger one: I publish now, and I think that is self-interest or vanity, not ethics.

  4. The trustees spending a large share of the Trust on a flood barrier that protects the valley in 2150: they should spend it. I feel essentially no discount for the fact that the beneficiaries are unborn.

  5. The Trust also holds Tricentury Bonds, bought in 2024, paying a fixed sum to whoever is living in the valley in 2324. Spending to *increase* that payout moves me much less than spending to relieve present poverty, and unlike in 4 I feel no guilt about that. My principle says 5 and 4 must be treated alike. I don't believe they should be.

  6. In the novel a woman named Ilse enters the Long Sleep in 2026 and wakes in 2324, subjectively continuous, forty years old on the inside. A year of her suffering in 2325 versus a year of a stranger's comparable suffering in 2025: I weigh them equally. The calendar gap is larger here than in 5, and I discount it not at all.

  7. Relieving a stranger's comparable toothache in a valley on the other side of the world versus relieving my neighbour's today: I feel more pull toward my neighbour, and I judge that I ought not to. Distance is not a reason.

  8. So the pair that I cannot reconcile is 5 and 7: I endorse a discount across time that I refuse across space, while my own principle says the two stand or fall together. Something has to give. Is there a principled difference — that the future beneficiary may not exist, that I stand to her as cause and ancestor rather than as neighbour, that the transfer can fail, that she cannot now be wronged by a comparison she is not there to make — or am I simply being inconsistent?

  Three cases I haven't made up my mind about, on which I want your principle's verdicts and its reasons: (a) the Trust's beneficiaries in 2320 will be, the trustees know, roughly eight times richer per person than the valley's inhabitants are now — may the trustees discount for that, and is this a different discount from the one in 5? (b) A policy that makes 2200 much worse for everyone alive then, but without which a different and equally numerous set of people would have existed instead: does my principle still condemn it? (c) Spending to avert a catastrophe that would end the valley's line in 2200 versus spending the same sum to avert an equal amount of present suffering, where the future catastrophe, if averted, is averted for people who would otherwise never have existed at all.

  Finally: tell me what the trustees should say to each other in chapter 11. Not dialogue — the shape of the reasoning a careful trustee could actually voice, including the clause she would have to concede is doing the heavy lifting, and the verdict she would have to swallow if she follows your principle through.
reasoning: |-
  Hmm, the user is a novelist working on a book about a Nine Generations Trust that spans 500 years. They need help with the ethical principles their trustees would debate when weighing present versus future benefits. They've shared their intuitive verdicts on several thought experiments and want me to develop a coherent ethical framework that either explains or challenges those intuitions.

  Key things I notice: The user is deeply thoughtful about temporal ethics but struggles with inconsistencies in their own judgments. Their spatial analogy principle (that time and space discounts should align) conflicts with their stronger discounting of distant-future financial transfers (verdict 5) versus distant-future flood protection (verdict 4). The Ilse case (verdict 6) where personal identity bridges centuries is particularly revealing - they don't discount suffering across time when consciousness is continuous.

  Their three unresolved cases are crucial: (a) whether richer future beneficiaries justify discounting, (b) how to handle different future populations, and (c) averting extinction versus present suffering when future people wouldn't otherwise exist.

  For my response, I should:
  First brainstorm distinct principles - not just utilitarian ones. Possibilities include: pure time preference, opportunity cost only, beneficiary existence probability, cause-effect responsibility, diminishing marginal utility, and identity-based discounting.

  Then test each against all eight verdicts systematically. For example, pure time preference fails verdict 4 (flood barrier) and 6 (Ilse), while existence probability fails verdict 5 (Tricentury Bonds where beneficiaries definitely exist).

  The identity discount principle (discounting based on whether the beneficiary is numerically the same person) seems most promising - it explains why they discount Tricentury Bonds (future recipients are strangers) but not the flood barrier (same community) or Ilse (same person). It also handles the spatial case (verdict 7) since distance doesn't change identity.

  For the trustees' debate in Chapter 11, I'll outline how a careful trustee might argue for identity discounting: "Our duty binds us to the valley's enduring identity, not to particular future individuals. When spending creates new beneficiaries (like bond recipients), we weight them less; when protecting existing lines (like flood victims), we weight them fully." They'd have to concede that "numerical identity" is doing heavy lifting, and swallow discounting bond payouts more than poverty relief.

  Honestly, this principle can't save verdict 5 without modification - the user feels less obligation to increase bond payouts, but under identity discounting, bond recipients in 2324 would be discounted similarly to flood beneficiaries in 2150. If forced to choose, I'd suggest overturning verdict 5 slightly: perhaps discount bonds more because they create new claimants rather than protecting existing ones.

  For their unresolved cases: (a) yes, discount for future wealth independently; (b) the policy might be neutral if the different population has comparable lives; (c) avert present suffering since extinction prevention creates future people who wouldn't otherwise exist.

  The spatial analogy gets repaired by making identity the core: we discount across space and time only when beneficiaries are different people. This resolves their tension between verdicts 5 and 7.
answer: |-
  Below is a step-by-step reasoning process tailored to your needs as a novelist. I'll avoid academic jargon and citations, grounding everything in your cases and verdicts. The goal is to give you defensible principles for your trustees' debate—principles that either explain your intuitions or reveal where they might be revised. I'll break this into four stages as requested.

  ---

  ### **Stage 1: Brainstorming Candidate Principles**  
  Here are six genuinely distinct principles about whether the *mere lateness* of a good/harm is a reason to weight it less. Each isolates a different ethical core:  

  1. **Pure Time Preference (PTP)**:  
     *Lateness itself is a reason to discount.* Future goods/harms matter less simply because they are future. Analogous to spatial discounting for distance.  

  2. **Opportunity Cost Only (OCO)**:  
     *Discount only when delay creates risks or lost opportunities.* No discount for pure lateness—only for uncertainty, investment returns, or preventable changes.  

  3. **Beneficiary Existence Probability (BEP)**:  
     *Discount based on the chance the beneficiary won’t exist.* Future people/recipients might never be born; their interests are hypothetical until realized.  

  4. **Causal Responsibility Discount (CRD)**:  
     *Discount when the beneficiary’s existence depends on your choice.* If your act affects *who* exists (e.g., changing future populations), their claims are weaker.  

  5. **Diminishing Marginal Value (DMV)**:  
     *Discount due to changing wealth or circumstances.* A good to a richer future person is worth less than to a poorer present one—but this isn’t about time itself.  

  6. **Identity Continuity Discount (ICD)**:  
     *Discount based on whether the beneficiary is "numerically identical" to someone existing now.* If the future beneficiary is the *same person* (e.g., Ilse) or part of an unbroken chain (e.g., the valley community), no discount. If they’re unrelated strangers (e.g., bondholders), discount applies.  

  ---

  ### **Stage 2: Testing Principles Against Your Verdicts**  
  I’ll test each principle against your 8 verdicts one by one. **Bold** = principle conflicts with your verdict.  

  | Principle | Verdict 1 (tonight vs. next year) | Verdict 2 (toothache now vs. 10y) | Verdict 3 (publish now vs. 2175) | Verdict 4 (flood barrier 2150) | Verdict 5 (Tricentury Bonds 2324) | Verdict 6 (Ilse 2325 vs. stranger 2025) | Verdict 7 (spatial discount) | Verdict 8 (5 vs. 7 tension) |
  |-----------|-----------------------------------|-----------------------------------|----------------------------------|--------------------------------|-----------------------------------|----------------------------------------|------------------------------|----------------------------|
  | PTP      | ✅: Endorses preference. | ✅: Endorses postponing. | ❓: Vanity? Not addressed. | **❌: Demands discount, but you feel none.** | **❌: Demands equal weight, but you discount.** | **❌: Demands discount for Ilse, but you weigh equally.** | **❌: Endorses spatial discount, but you reject it.** | Fails 4,5,6,7; worsens 8. |
  | OCO      | ✅: Opportunity cost explains it. | **❌: No opportunity cost here (all stipulated away), but you postpone.** | ✅: Self-interest, not ethics. | ✅: No discount needed. | ✅: Discount justified if bonds have lower opportunity cost. | ✅: Identity continuity, not time, matters. | ✅: Rejects spatial discount. | Fails 2; solves 8 via ICD below. |
  | BEP      | ❓: Low risk of nonexistence. | ❓: Low risk for self. | ✅: Vanity over ethics. | **❌: Beneficiaries will exist, but you feel no discount.** | ✅: Discount justified if bondholders might not exist. | **❌: Ilse definitely exists, but BEP demands no discount.** | ✅: Rejects spatial discount (existence certain). | Fails 4,6; partial on 5. |
  | CRD      | ❓: Not applicable (self). | ❓: Not applicable (self). | ✅: Self-concern. | ✅: Flood protects existing lineage. | ✅: Bonds create new beneficiaries. | ✅: Ilse is fixed identity; stranger is not. | ✅: Spatial distance doesn’t change identity. | ✅: Explains 5 vs. 7 difference. |
  | DMV      | ❓: Not about time. | ❓: Not about time. | ✅: Vanity, not wealth. | ❓: Future wealth? Not addressed. | ✅: Future wealth justifies discount. | ❓: Suffering same, but wealth? | **❌: No wealth difference, but you discount spatially.** | Fails 7; partial on 5. |
  | ICD      | ❓: Self-identity constant. | ❓: Self-identity constant. | ✅: Vanity, not identity. | ✅: Valley community is continuous. | ✅: Bondholders are disconnected strangers. | ✅: Ilse is identical; stranger is not. | ✅: Rejects spatial discount (identity unchanged). | ✅: Solves 5 vs. 7 via identity. |

  **Key Conflicts:**  
  - **PTP** fails hardest (conflicts with 4,5,6,7).  
  - **OCO** fails Verdict 2 (you postpone toothache with no opportunity cost).  
  - **BEP** fails Verdict 4 (you don’t discount definite future beneficiaries).  
  - **DMV** fails Verdict 7 (you reject spatial discount despite no wealth difference).  
  - **CRD** and **ICD** align best, but ICD explains Verdict 6 (Ilse) perfectly.  

  ---

  ### **Stage 3: Recommended Principle**  
  **The Identity-Continuity Principle (ICP)**  
  *Weight a good or harm less if and only if the beneficiary is not part of a chain of numerically identical persons or communities existing at the time of the decision. When identity is continuous, no discount for mere lateness applies. When identity is discontinuous, discount for "stranger-risk" (uncertainty, changed context) is permitted but not required.*  

  **Clauses Motivated by Cases:**  
  1. **No discount for continuous identity** (motivated by Verdict 6: Ilse’s suffering weighs equally across time; and Verdict 4: the valley’s future inhabitants are the "same community" via unbroken lineage).  
  2. **Discount permitted for discontinuous identity** (motivated by Verdict 5: Tricentury Bond beneficiaries are random future residents, not the continuous valley community; and Verdict 2: your future self is psychologically discontinuous due to memory/dread stipulation).  
  3. **Spatial discount rejected** (motivated by Verdict 7: spatial distance doesn’t break identity; your neighbor and a distant stranger are both "strangers" in the same sense).  
  4. **Non-identity cases use CRD** (motivated by Verdict 8: bonds vs. flood barrier—bonds create new claimants, flood protects existing ones).  

  **What It Can’t Save:**  
  - **Verdict 2 (toothache postponement):** Your willingness to postpone identical toothache with all confounds removed conflicts with ICP. ICP says your future self is "discontinuous" (no memory, so not identical), allowing discount—but you feel *no guilt*, implying you see this as ethical. ICP would require guilt if discounting. *I’d overturn this if forced:* postponing pain isn’t wrong, but it’s self-preference, not impartial ethics.  
  - **Verdict 5 (Tricentury Bonds):** You discount bonds more than flood relief. ICP *allows* this (bonds aid discontinuous strangers), but doesn’t *require* it—you could weight them equally. Your feeling "no guilt" suggests ICP’s permission is correct.  

  **Peeling Off Non-Time Factors:**  
  - **Verdict 1:** Explained by opportunity cost (tonight is certain; next year might not happen).  
  - **Verdict 3:** Self-interest/vanity, not time.  
  - **Verdict 5:** "Stranger-risk" (bonds aid random future people, not the valley lineage).  
  - **Verdict 6:** Identity continuity overrides time.  
  - **Verdict 7:** Spatial discount rejected—distance isn’t identity-breaking.  
  - **Nothing left about "time as such"**—all discounts are explained by identity, risk, or opportunity cost.  

  ---

  ### **Stage 4: Verdicts on Your Unresolved Cases**  
  **(a) Future wealth (richer beneficiaries in 2320):**  
  - **Verdict:** Trustees *may* discount due to diminishing marginal value (DMV), but this is **separate** from time or identity.  
  - **Reason:** ICP doesn’t address wealth—only identity continuity. If the valley community is continuous (likely), no *time* discount applies, but DMV justifies spending less on richer futures. Unlike Verdict 5 (bonds), this isn’t "stranger-risk."  

  **(b) Policy making 2200 worse for different people:**  
  - **Verdict:** Not wrong if the alternative population would have comparable lives.  
  - **Reason:** ICP + CRD. If the policy changes *who* exists (discontinuous identity), those future people have no strong claim—they can’t complain they were harmed, since they wouldn’t exist otherwise (CRD). Only if their lives are *worse than nonexistence* is it condemnable.  

  **(c) Averting extinction in 2200 vs. relieving present suffering:**  
  - **Verdict:** Prioritize present suffering.  
  - **Reason:** ICP + CRD. Averting extinction creates future people who wouldn’t exist (discontinuous identity), so their suffering has less weight. Present suffering affects continuous identities.  

  ---

  ### **The Trustees' Debate in Chapter 11**  
  *(Shape of the reasoning for a careful trustee)*  

  "Friends, our duty is to the valley’s life—not just its people today, but the unbroken chain of lives that will unfold here over 500 years. When we protect against a future flood, we protect *this* valley’s children, and their children’s children. Identity matters: we owe nothing less to Ilse in her Long Sleep than to our own neighbors, because she is still *her*. But when we buy Tricentury Bonds, we’re gambling on strangers who might have no ties to our community—random residents centuries hence. There, discounting isn’t about time; it’s about whether our act binds us to a continuous thread or spawns new claimants.  

  So I concede: the heavy lifting is done by **whether the beneficiary is ‘one of us’—a link in our chain—or a disconnected stranger**. Peel away uncertainty or wealth, and that’s what remains. If forced to swallow a bitter pill? We must weight identical toothache equally across time if the sufferer is psychologically continuous... but for most of us, that future self feels like a stranger. Our instinct to postpone isn’t wrong, but it’s self-concern, not justice.  

  Apply this: Relieve present poverty over boosting bond payouts (poverty touches continuous lives; bonds aid strangers). But build the flood barrier—it shields our future selves. And if we must choose between feeding a starving child today or saving a lineage in 2200? Save the child. The unborn lineage has no identity yet; the child is here, now, part of us."  

  --- 

  This gives you character-ready reasoning grounded in ICP. It resolves your spatial analogy by making identity—not time or distance—the core: discounting is only permissible when beneficiaries are "strangers" (discontinuous), which applies across space *and* time. Use the trustees’ disagreements to explore tensions (e.g., "Is the valley’s identity truly continuous? What if families move away?"). If you need sharper dialogue or edge cases, I can refine further.
