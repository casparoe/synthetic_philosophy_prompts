  Pre-registered predictions require testable scenarios. The graded-bridge case (neural interface with adjustable bandwidth) probes subject persistence/merger. Micropsychism might predict a gradual shift in bonding strength without new subjects, while cosmopsychism could expect decombination failure at thresholds, creating merged subjects. The final-physics case (whether physics has fundamental parts) forces concessions: micropsychism struggles if no parts exist, cosmopsychism if parts are fundamental. A third test—like artificial micro-subject networks—could pressure both views on emergence thresholds. 

