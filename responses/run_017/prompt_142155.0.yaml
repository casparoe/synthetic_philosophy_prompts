  ### **Maximum-Entropy Formalization**  
  The practitioner's estimate is formalized using maximum entropy (MaxEnt): given *only* the marginal frequencies (\( f_A = 0.5 \), \( f_B = 0.5 \)), the MaxEnt distribution assumes independence.  

  **MaxEnt prediction for both variants:**  
  - Joint frequency \( P(\text{A and B}) = P(A) \times P(B) = 0.25 \).  
  - Predicted count \( = 0.25 \times 8 = 2 \).  

  **Results:**  
  - **Variant 1:** Correct (matches true count).  
  - **Variant 2:** Incorrect (predicts 2, true count is 0).  

  **If structural facts are known:**  
  If we add constraints encoding the deterministic cycles and active intervals, MaxEnt yields the true count:  
  - **Variant 1:** MaxEnt + constraints → joint frequency = 0.25.  
  - **Variant 2:** MaxEnt + constraints → joint frequency = 0.  

  But this requires knowing the active intervals in advance. Without this, MaxEnt reproduces the practitioner's error.  

  ---

  ### **Key Mechanism: Phase Resonance**  
  The **difference** between variants is the *phase* of active intervals within the cycles. This creates a "resonance" effect:  
  - In Variant 1, the phases allow periodic alignment.  
  - In Variant 2, the phases are separated, causing total misalignment.  

  **Why it meets specifications:**  
  - **Deterministic/finite:** No randomness; all states enumerated.  
  - **Single parameter change:** Only Belt B’s active intervals differ.  
  - **Failure strong:** Estimate assigns 2 events; true count is 0.  
  - **Knowable in advance:** The active intervals are defined upfront.  
  - **MaxEnt fails:** It cannot detect phase misalignment without structural constraints.  

  ---

  ### **Varying the Window Size**  
  What if we change the observation window to **T = 4 seconds**?  

  **Variant 1 (active intervals unchanged):**  
  - A active: 0,1,4,5 → in T=4: 0,1.  
  - B active: 0,1,4,5 → in T=4: 0,1.  
  - True count: Both active at seconds 0,1 → 2.  
  - Practitioner: \( f_A = 2/4 = 0.5 \), \( f_B = 0.5 \) → estimate = \( 0.25 \times 4 = 1 \).  
  - **Result:** **Failure** (estimate = 1, true count = 2).  

  **Variant 2 (active intervals unchanged):**  
  - A active: 0,1,4,5 → in T=4: 0,1.  
  - B active: 2,3,6,7 → in T=4: 2,3.  
  - True count: 0.  
  - Practitioner: Estimate = 1 (as above).  
  - **Result:** **Failure** (estimate = 1, true count = 0).  

  **Effect:**  
  - The practitioner's estimate is **vindicated only for specific windows** (e.g., T=8 in Variant 1).  
  - For T=4, *both* variants show errors, proving the estimate’s sensitivity to window choice.  

