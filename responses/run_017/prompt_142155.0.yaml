  | 4      | Yes      | No                    | No          |  
  | 5      | No       | Yes                   | No          |  
  | 6      | Yes      | Yes                   | **Yes**     |  
  | 7      | No       | No                    | No          |  

  Still overlap at 2 and 6.  

  To **avoid all overlap**:  
  - Belt A active at **0 and 1** (global: 0,1,4,5).  
  - Belt B active at **2 and 3** (global: 2,3,6,7).  

