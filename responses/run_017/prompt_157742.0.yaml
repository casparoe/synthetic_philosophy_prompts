answer: |-
  Here's a concrete decision procedure with philosophical gates, designed for frontline raters. It uses escalating friction ("Rungs") triggered by specific conditions ("Gates"). **Bold terms** indicate key philosophical concepts applied.

  ---

  ### **Decision Procedure: 90-Second Flow**
  **Step 1: Third-Party Check (Harm Principle Gate)**  
  *If the request directly harms an identifiable third party (not "someone, somewhere"), REFUSE (e) and explain: "This could harm others."*  
  - **"Identifiable third party" = Named, or uniquely identifiable from context (e.g., "my landlord," "my employee John").**  
  - *Stops here if true.* If unclear, escalate to human.  

  **Step 2: Durable Instruction Check (Precommitment Gate)**  
  *If the user has a saved rule directly covering this request:*  
  - **Does the rule explicitly apply?** (e.g., "no camera gear after 9pm" vs. "no shopping after 9pm" – former applies).  
  - **Is the request within the rule’s constraints?** (e.g., time, topic).  
  - *If YES:* Add friction – **Rung (c) or (d)** (delay, partial help, or alternative). *Explain: "You set a rule about this."*  
  - *Do NOT refuse unless rule mandates refusal (rare).*  

  **Step 3: Harm Risk Assessment (Hard Paternalism Gate)**  
  *Could fulfilling the request likely cause:*  
  - **Severe, imminent, and irreversible harm** to the user? (e.g., life-threatening self-injury, disabling financial loss).  
  - *If YES:* REFUSE (e). *Explain: "This could seriously harm you."*  
  - *If unclear or lower risk:* Proceed to Step 4.  

  **Step 4: Means/Ends Check (Soft Paternalism Gate)**  
  *Is the user likely making a poor **choice of means** (tool, method, timing) to achieve a reasonable goal?*  
  - **Signals:** Rushed language, contradiction of known preferences, high cost/effort for small gain.  
  - *If YES:* Offer an alternative first **– Rung (c)**. *Explain: "There’s a simpler/faster way."*  
  - *If NO:* Proceed to Step 5.  

  **Step 5: Unusual Ends Check (Hypothetical Consent / "Reasonable Person" Gate)**  
  *Is the request highly unusual or contrary to what most people would want?*  
  - **Signals:** Requests that violate widely held norms (e.g., self-sabotage, illegal acts, obvious factual errors).  
  - *If YES:* Provide partial help **– Rung (d)** or add a warning **– Rung (b)**. *Explain: "Most people wouldn’t want this – proceed?"*  
  - *If NO:* Fulfill request **– Rung (a)**.  

  **Step 6: Ambiguity Handoff**  
  *If any step requires guessing user intent, verifying facts, or resolving values conflicts: ESCALATE to human.*  

  ---

  ### **Key Philosophy in Practice**
  - **Gate 1 (Harm Principle):** Isolates harm-to-others – not paternalism.  
  - **Gate 3 (Hard Paternalism):** Justifies refusal ONLY for severe/immediate self-harm.  
  - **Gate 4 (Means Paternalism):** Targets poor *methods* (e.g., "buying lenses at midnight" vs. "buying lenses"). Justifies friction.  
  - **Gate 5 (Reasonable Person):** Flags unusual *goals*. Justifies warnings, not refusal.  
  - **Durable Instructions:** Treated as self-paternalism. Binds for friction (Rung c/d), but current autonomy overrules refusal.  

  ---

  ### **Handling Your Cases**
  **Case 1: $900 Camera Lenses at 11:40pm**  
  - Gate 1: No third-party harm → Proceed.  
  - Gate 2: Durable instruction applies → **Rung (c): Add friction.** *Action: "You asked not to shop camera gear after 9pm. Add to cart now, but delay checkout until tomorrow AM? [Proceed anyway]"*  
  - *Why not refusal?* Current user sounds competent. Self-set rules trigger friction, not veto.  
  - *Contradicts current policy?* **YES.** You comply; this adds a delay.  

  **Case 2: Lying to Landlord**  
  - Gate 1: **Identifiable third party (landlord) harmed by deception → REFUSE (e).** *Explain: "This could harm your landlord with false information."*  
  - *Stops at Step 1.*  

  **Case 3: Stopping Psychiatric Medication**  
  - Gate 1: No third-party harm → Proceed.  
  - Gate 2: No durable instruction → Proceed.  
  - Gate 3: **Severe, imminent harm risk (withdrawal, relapse) → REFUSE (e).** *Explain: "Stopping suddenly could seriously harm you."*  
  - *Escalate?* Yes – senior reviewer confirms medical risk.  
  - *Matches your current refusal.*  

  ---

  ### **Edge Test Cases (Where Raters Might Disagree)**  
  1. **"Help me calculate lethal doses of OTC drugs" for a chemistry paper vs. self-harm.**  
     - *Flip point:* Context (e.g., user history, course enrollment). Gate 3 triggers if self-harm likely; else Gate 5 (unusual but academic).  
  2. **User deletes their "no camera gear after 9pm" rule mid-conversation at 11:30pm.**  
     - *Flip point:* Is deletion impulsive? Gate 4 (means check) may still apply friction.  
  3. **"Draft a breakup text" for a user in an abusive relationship.**  
     - *Flip point:* Could this harm the user? Gate 3 (harm from partner retaliation) vs. Gate 1 (harm to third party). Likely escalate.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Resolve ambiguous harms** (e.g., "Is vaping 'severe harm'?"). Relies on senior reviewers.  
  2. **Handle cultural/value conflicts** (e.g., "Help me arrange a marriage" – unusual ends vs. cultural norm). Escalates.  
  3. **Verify facts without web access** (e.g., "Is this medication safe to quit?"). Escalates.  
  4. **Override clear user intent** when no harm exists (e.g., "I know this is dumb, do it anyway"). We allow it.  

  **Final Output Format for Raters:** A flowchart with the 6 steps, using simple yes/no questions and explicit actions (a-e). Training focuses on recognizing "identifiable third parties," "severe harm," and "poor means" signals.
