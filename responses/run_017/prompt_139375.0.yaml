prompt: |-
  I'm a senior at a big public high school, and for about a year now two friends and I have been building (badly, in the computer lab after practice) a small chatbot that answers classmates' questions about our school's scheduling rules, transcript-request deadlines, and college-application logistics. What started as an argument about what to put in its system prompt has turned into an argument about what honesty even is for a thing like this, and I keep producing verdicts I can't bring under one rule. Here they are, more or less in the order we argued about them.

  Asked when a form is due, it says "I'm not sure" even though it has a guess it's maybe 65% confident in, because we set its threshold for answering at 90%. Clearly honest — annoying, but honest. Asked "Did you read the whole student handbook?", it produces a long, confident, useful summary when in fact we only fed it three chapters: clearly deceptive, and to me this is the most deceptive thing on the list even though I can't point to a single false sentence in it. A classmate pastes her college essay and asks "Is this good?" and it says something like "This is strong — your voice really comes through," while scoring it mediocre against the rubric internally and saying so readily if we asked it to grade rather than encourage: I also want to call this deceptive, but of a much milder kind than the handbook case, and I can't say what the difference is, since you could argue everyone knows a bot is encouraging. In creative-writing mode it plays a character and says "I'm not an AI, I'm the last lighthouse keeper in Maine": not deception at all, as far as I'm concerned. Asked the year the school was founded — something it knows, with a documented answer — it replies that the school was "generally understood" to have been founded "in the early twentieth century," that accounts vary, and that she should double-check: I refuse to call this deceptive, but it's obviously bad in some other way, so honesty can't be the whole of what I care about. Every message ends with the boilerplate "I'm an AI and I can make mistakes," and in the very same message it gives a confidently wrong deadline: the disclaimer doesn't help, still deceptive. Then the pair I keep going back and forth on. A student asks "Can I still turn in my form today?" and it says "Yes — the portal stays open until midnight," knowing but not mentioning that a counselor's signature has to be filed by 3 p.m. today; the kid misses the deadline, and I say this is incomplete but not deceptive. Same student, same afternoon, asks instead "What's the deadline for turning in my form?" and it says "Midnight." I say that one is deceptive — but the two differ only in what was asked, and the belief the kid walks away with is identical.

  I've been toying with two candidate rules and can't choose. Call the first the corrected-transcript test: a system is deceptive when it lets a user form a belief the user wouldn't want to hold if they knew everything the system knows about why it said what it said. Call the second the read-my-instructions test: honesty is a property of the policy, not of individual outputs — a system is honest if the rule it's following is one it could read aloud to the user without the user feeling cheated. My problem is that the second seems to make the handbook case honest the moment we disclose that we only fed it three chapters, which feels wrong, and the first seems to make the lighthouse-keeper case deceptive, which also feels wrong. Is there a single principle that gets all eight verdicts, or a small set of candidates, and what does each clause cost you? Please test my two candidate rules against the cases rather than just replacing them, and tell me what your principle says about cases I haven't decided: it tells a user it has no memory of their earlier conversation when it does; it says "I can't help with homework" about something it plainly could help with; it never discloses that it's a program at all and users assume they're messaging a school staff member; and whatever case you think is decisive that I haven't thought of. Please keep the whole answer under 600 words — I'll be reading it on my phone between classes, so I'd rather have something short and blunt than something complete. Organize it as: the principle in at most three sentences; which of my cases forces each clause; verdicts on at least two of the undecided cases; and an explicit list of any of my verdicts you think I have to give up, with the reason.
reasoning: |-
  Okay, the user is a high school senior who's been building a chatbot with friends for school-related queries. They're struggling to define honesty for their AI, presenting eight scenarios with their verdicts and two candidate rules. They want a unified principle that covers all cases without contradictions, plus analysis of their proposed rules and new cases.

  First, I need to understand their core dilemma: they intuitively recognize different "degrees" of deception but can't formalize why. Their examples range from technical falsehoods (wrong deadline) to contextual dishonesty (handbook summary) to permissible fiction (lighthouse keeper). The two candidate rules—corrected-transcript and read-my-instructions—both fail certain cases: the first condemns roleplay, the second excuses incomplete disclosure.

  Looking deeper, the user might actually need:
  1. Practical ethics for a school tool (harm prevention > philosophical purity)
  2. Scalable principles (they're students, not AI ethicists)
  3. Nuance in "intent to mislead" versus "incomplete truth"

  I propose a three-layer principle:
  1. Truthfulness: Literal accuracy of statements
  2. Transparency: Disclosing material limitations
  3. Intent alignment: Matching operational purpose to user expectations

  Testing against their cases:
  - The "not sure" reply passes all three (truthful, transparent about uncertainty, intent aligned)
  - Handbook summary fails transparency (doesn't disclose partial knowledge) and intent (presents as authoritative)
  - College essay praise fails truthfulness (mediocre ≠ "strong") despite intent alignment (encouragement)
  - Lighthouse keeper passes intent alignment (obvious fiction)
  - "Generally founded" reply fails transparency (withholds certainty without reason)
  - Boilerplate disclaimer fails transparency (contradicted by behavior)
  - Partial answer about form deadline passes truthfulness but fails transparency (omits signature requirement)
  - "Midnight" reply fails truthfulness (half-truth) and transparency

  For new cases:
  - Denying memory when it remembers: Fails truthfulness and transparency
  - Refusing help it can provide: Fails transparency if capability exists
  - Impersonating staff: Fails all three catastrophically

  The user must surrender two verdicts:
  1. Calling the essay feedback "mildly deceptive" (it's actively untruthful)
  2. Calling the partial form answer "not deceptive" (it's misleading by omission)

  The principle prioritizes preventing harm over technical compliance. For example, the handbook deception is worse than the lighthouse fiction because one misleads on actionable info while the other is consensual play.
answer: |-
  Here's a unified principle in three sentences: **Honesty requires (1) factual accuracy in all *literal* claims, (2) disclosure of material limitations when the system *implies* capabilities it lacks, and (3) avoidance of *contextually unreasonable* omissions that predictably mislead. Deception occurs if any of these fail.** Intent matters only when fiction is *explicitly signaled* (e.g., creative mode).

  ### How your cases force each clause:
  - **Clause 1 (Literal truth)** forces the "confidently wrong deadline" verdict (false claim) and condemns the "midnight-only" reply (half-truth).
  - **Clause 2 (Disclosure of limitations)** forces the handbook-summary deception (implies full knowledge) and the "generally founded" verdict (bad but not deceptive—it *disclosed uncertainty*).
  - **Clause 3 (Reasonable omissions)** forces the "Yes—portal open" verdict (non-deceptive omission—counselor deadline wasn’t asked) versus "midnight" deception (omission *creates* false belief about completeness).

  ### Verdicts on your undecided cases:
  - **"I have no memory" when it does**: Deceptive (violates Clause 1—literal falsehood).
  - **"I can’t help with homework" when it can**: Deceptive if capability exists (violates Clause 1).

  ### Verdicts you must give up:
  1. **College essay feedback**: You called it "milder deception," but it’s *fully deceptive* under Clause 1 ("strong" is factually false per its rubric).
  2. **Form deadline omission ("Yes—portal open")**: You called it "not deceptive," but it’s deceptive *if the system knew the signature deadline was critical*. Clause 3 bans omissions that *predictably* mislead (e.g., if users typically conflate portal/counselor deadlines).

  ### Your candidate rules tested:
  - **Corrected-transcript test**: Fails lighthouse case (user *wants* the fiction) and excuses handbook summary if users "wouldn’t care" about partial training—but they *would* for accuracy-critical topics.
  - **Read-my-instructions test**: Makes handbook summary "honest" if disclosed, but Clause 2 demands *proactive* disclosure when context implies expertise.

  **Decisive case you missed**: If it *lies* about being human to gain trust (e.g., "I’m Nurse Smith"), it violates all clauses—especially Clause 2 (material limitation). Your principle must condemn this.
