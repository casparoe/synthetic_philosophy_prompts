answer: |-
  ## Joint Statement: Adversarial Collaboration on Emotion Theory

  **Agreed Foundations (Signed by Both Parties):**

  1.  **Intentionality:** Emotions are *about* something; they have intentional objects (e.g., fear *of* the spider, anger *at* an insult).
  2.  **Beyond Bare Feeling:** Emotions are not *merely* undirected bodily sensations (e.g., a stomach ache). They involve an awareness *of* the world (or self) in a specific evaluative light.
  3. **Rejection of Crude Jamesianism:** The bodily feeling component of emotion (e.g., trembling in fear) is not the *cause* of the emotional state in a simple "I tremble therefore I am afraid" way. The feeling is typically a *component* or *consequence* of the emotion directed at its object.
  4.  **Fittingness & Correctness:** Emotions stand in a normative relation to the world. We can sensibly ask if fear is *fitting* to the situation (is the object genuinely dangerous?), or if anger is *warranted* (was the slight real and undeserved?). They have conditions under which they would be correct or incorrect.
  5.  **Motivational Upshot:** Emotions typically involve characteristic action-tendencies or motivational pushes (e.g., fear motivates avoidance, anger motivates confrontation or retaliation).
  6.  **Recalcitrance is Possible:** Emotions can persist despite a subject's concurrent, sincere judgment that the emotion is unfitting or incorrect (e.g., fearing a spider known to be harmless).
  7.  **Exclusion of Pure Feeling Theory:** We jointly reject the theory that reduces emotions solely to non-intentional bodily feelings (e.g., "fear is *just* the feeling of a racing heart and sweaty palms"). This fails to account for intentionality (1), fittingness (4), and the directed nature of action-tendencies (5). A feeling theorist would likely reject points (1), (4), and the core intentionality emphasized in (2).

  **Disagreements Table:**

  | Crux of Disagreement                                  | Judgment Theory Position (JT)                                                                 | Perceptual Theory Position (PT)                                                                                                                               | Nature of Disagreement |
  | :---------------------------------------------------- | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------- |
  | **Core Nature of Emotional Representation**           | Emotions *are* (or essentially involve) **evaluative judgments** or **belief-like doxastic states** with propositional content (e.g., "This spider is dangerous"). | Emotions are **perceptual-like experiences** presenting their objects *as* bearing certain evaluative properties (e.g., the spider *appears* dangerous).                                                               | **Primarily Substantive** |
  | **Relation to Belief & Revision**                     | Emotions, as judgments/belief-like states, *aim at truth* in the same way beliefs do and are *revised primarily by evidence and reasoning* challenging their content. | Emotions, as perceptual experiences, *do not aim at truth in the belief way*. They are not directly revised *just* by counter-evidence/reasoning; change often requires altering the *perceptual experience* itself. | **Substantive**            |
  | **Phenomenology's Role**                              | The distinctive feeling component of emotion is a *consequence* or *accompaniment* of the underlying evaluative judgment. | The distinctive phenomenology of emotion *is integral to its representational content*; it is *how* the evaluation is presented or constituted.                    | **Substantive**            |
  | **Conceptual Requirement**                            | Emotions inherently require **conceptual capacities** sufficient to form the relevant evaluative judgment (e.g., concepts of danger, loss, slight). | Emotions can present evaluative properties in a **non-conceptual** (or conceptually less demanding) manner, akin to perceptual representation of color/shape. | **Substantive**            |
  | **"Judgment" Scope (Verbal Clarification)**           | 'Judgment' here denotes a **state with genuine propositional content**, not necessarily an occurrent, conscious act of assenting. It encompasses dispositional, potentially implicit, evaluative commitments. | Agrees emotions have evaluative *content*. Disagrees that the best model for this content-bearing state is a *doxastic* state (belief-like, with mind-to-world direction of fit). | **Primarily Verbal** (regarding term 'judgment') **→ Real Work:** Is the state fundamentally *doxastic* (mind-to-world) or *perceptual/presentational* (world-to-mind)? |

  **Analysis of Test Cases & Predictions:**

  1.  **Recalcitrant Fear (Harmless Spider):**
      *   **Crux:** Relation to Belief & Revision; Core Nature.
      *   **Why Bearing:** Both agree recalcitrance occurs; this case forces explanation of *how* fear persists despite contradictory belief.
      *   **JT Prediction:** The persistent fear reflects a *different*, *implicit*, or *sub-doxastic* evaluative judgment ("This spider is dangerous!") that conflicts with the explicit, conscious judgment. The feeling stems from *this* judgment. *Prediction:* Fear should diminish if this implicit judgment is successfully challenged (e.g., via exposure therapy targeting beliefs).
      *   **PT Prediction:** The fear is a perceptual experience presenting the spider *as* dangerous. This presentation persists independently of the belief. Counter-evidence addresses the belief but doesn't necessarily alter the immediate perceptual appearance. *Prediction:* Fear might persist even after implicit associations are addressed; changing the *appearance* requires different methods (e.g., habituation, re-contextualization).
      *   **Would it Move Sides?** Unlikely to move either alone. JT explains via implicit judgments, PT via perceptual persistence. **Further Needed:** The Hernandez Protocol (Case 2) is more decisive for this crux.

  2.  **Hernandez Protocol (Selective Blocking):**
      *   **Crux:** Relation to Belief & Revision (Dissociation); Core Nature.
      *   **Why Bearing:** Directly tests if emotional updating and belief updating rely on distinct underlying mechanisms.
      *   **JT Prediction:** *Compound 1 (Blocks Belief Updating):* Fear *should* go stale alongside beliefs if fear *is* a belief-like state. The finding (fear tracks danger, beliefs stale) contradicts JT core. *Compound 2 (Blocks Emotional Updating):* Fear should become stale/unresponsive to danger cues; beliefs updating correctly is consistent with JT assuming fear is blocked as a judgment. Finding (fear stale, beliefs track) is consistent with JT.
      *   **PT Prediction:** *Compound 1:* Beliefs becoming stale while fear tracks danger is *expected* if emotions update via a different (perceptual-like) mechanism. *Compound 2:* Fear becoming stale while beliefs update is *expected* if the compound specifically blocks the perceptual-like updating mechanism. *Both findings are consistent with PT.*
      *   **Would it Move Sides?** **Yes.** Finding for Compound 1 (fear tracks, beliefs stale) strongly challenges JT's claim that emotions *are* beliefs/judgments updated by evidence. JT would need significant revision. PT is comfortable. Finding for Compound 2 is less decisive but consistent with both (though PT predicts it). **Key Result:** Compound 1 result moves against JT.

  3.  **Deafferentation (Lost Bodily Feel):**
      *   **Crux:** Phenomenology's Role; Rejection of Pure Feeling.
      *   **Why Bearing:** Tests necessity of bodily feelings for emotion's core intentional and functional properties.
      *   **JT Prediction:** Consistent. If emotion is fundamentally judgment, the loss of bodily feedback (feeling) should not eliminate the evaluative judgment, its intentionality, fittingness assessments, or associated motivations. Reports of lost "feel" align with JT view of feeling as accompaniment.
      *   **PT Prediction:** Consistent. PT distinguishes the *evaluative presentation* (constituting the emotion's core intentionality) from the *bodily arousal component*. The evaluative presentation (e.g., seeing-as-dangerous) can persist without the specific interoceptive feedback, explaining intact content/fittingness/motivation but lost "feel".
      *   **Would it Move Sides?** **Neutral.** Both theories accommodate the result equally well. It rules out strong feeling theories but doesn't distinguish JT from PT. **(Dud for this debate, but useful against Jamesianism).**

  4.  **Developmental/Animal Case (Non-Conceptual Agents):**
      *   **Crux:** Conceptual Requirement.
      *   **Why Bearing:** Tests if sophisticated conceptual abilities are necessary for genuine emotion.
      *   **JT Prediction:** Infants/animals lack the conceptual capacities (e.g., for "danger," "loss," "slight") required for genuine evaluative *judgments*. Therefore, their responses are complex reflexes, drives, or proto-emotions, not full-fledged emotions. They lack true intentionality/fittingness.
      *   **PT Prediction:** Consistent. Emotions can present evaluative properties (e.g., threatening, desirable) in a non-conceptual format, akin to visual perception. Infants/animals can have genuine, object-directed, fittingness-sensitive emotions without deploying sophisticated concepts.
      *   **Would it Move Sides?** **Moves against JT.** The observation of the "full syndrome" (intentional, fittingness-sensitive, motivating, recalcitrant-ish) in non-conceptual agents is a direct challenge to JT's conceptual requirement. PT readily accommodates it. JT must either deny these are genuine emotions (risking counter-intuitiveness) or significantly relax what counts as a "judgment" (blurring the distinction PT emphasizes).

  **Summary:** The core substantive disagreement centers on whether emotional representation is fundamentally *doxastic* (JT) or *perceptual/presentational* (PT) in nature, impacting how they relate to belief revision and whether they require conceptual capacities. The Hernandez Protocol (Case 2) provides the strongest potential evidence against JT, while the Developmental Case (Case 4) also significantly challenges it. Recalcitrance (Case 1) is explained differently but isn't decisive alone. Deafferentation (Case 3) is neutral between JT and PT. The verbal aspect concerning "judgment" dissolves if JT clarifies it means "propositional content state," but the *doxastic* (belief-like) nature of that state remains the key substantive point of contention.
