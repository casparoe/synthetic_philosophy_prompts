          - Under H1, the probability of observing a black raven on the mainland is 1 (because mainland ravens are black).
          - Therefore, the evidence does not shift the odds between H and H1 at all.
      - Verdict: The observation does not confirm H relative to H1.

  ### Cases that Challenge the Principle:

  We must note any of the original ten verdicts that the principle cannot accommodate.

  - Case 8 (grey pebble under a nest) was a bit of a stretch. The principle can be applied, but it requires interpreting the procedure as including the context (being at the nest) and that the observer might have noticed a non-black raven if one were present. If we strictly interpret the procedure as only looking at the pebble and nothing else, then clause (a) would be zero because the procedure would not have detected a non-black raven. But the biologist says it confirms a whisper. Therefore, we must assume that the procedure includes the context: being at the nest and having the opportunity to observe the ravens. Then the procedure might have a small chance of detecting a non-black raven (if present) by sight. So if we define the procedure broadly as "visiting the nest site and making observations", then the chance of detecting a non-black raven is non-zero.

  - Case 5 and 6: the principle works via clause (b), but it requires that we consider the alternative hypotheses to include the possibility that non-black corvids might be ravens. This might be a stretch. If the principle must stand without that, then we might need to adjust.

  Given the above, I think the Revised Principle (RP) can accommodate all ten cases with the interpretations we've provided.

  ### Final Statement of the Principle:

  **Principle of Confirmation for Field Biology (PCFB):**

  The degree to which an observation E (obtained by a method M in a specific context) confirms a hypothesis H is determined by two factors:

  1. **Test Strength**: The probability that M, as actually carried out in its context, would have resulted in a counterexample to H, if H were false. This probability accounts for the scope of M (locations, times, and objects covered) and its detection capabilities.

  2. **Discriminative Power**: The extent to which E shifts the relative likelihood between H and the set of alternative hypotheses that are contextually relevant and not yet ruled out. This shift is greater when E is more likely under H than under the alternatives.

  **Handout Version for Field Assistant:**

  "When you make an observation, ask:

  1. How likely was it that your method would have caught a counterexample if there was one? (If the answer is 'not likely', then the observation doesn't count for much.)

  2. How much does the observation help rule out the other ideas we're worried about? (The more it rules out a plausible alternative, the more it confirms our idea.)"

  ### Cases That Motivate Each Clause:

  - Clause 1 (Test Strength): Cases 4 (method wouldn't register pale raven), 7 (beach without ravens), 8 (pebble under nest: if we were in the right context and might have seen a non-black raven), 9 (exhaustive search), 10 (valley vs global).
  - Clause 2 (Discriminative Power): Cases 5 and 6 (non-black corvid vs heron: the corvid is more relevant to alternatives about corvids), and also case 2 (three nestlings from one nest: the alternative of a non-black raven in another nest is not ruled out as much as by three independent territories).

  ### Cases That Challenge and How We Resolved:

  - Case 8: We resolved by interpreting the procedure broadly to include the context of being at the nest and having the opportunity to see ravens.
  - Case 5 and 6: We resolved by considering the alternative hypotheses that are biologically close (corvids) being more directly challenged by a non-black corvid.

  The principle seems robust.
