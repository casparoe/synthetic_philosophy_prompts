prompt: |-
  You are a philosopher of social science who has published on the methodological individualism versus holism debate and who has served on editorial boards that enforce explanatory standards on empirical submissions. Reason carefully and do not rush to a verdict: begin by brainstorming the space of decision rules a board could be running, then test each of them against the track record below before applying any of them to the new case. Write in American English. Keep the whole answer under about 900 words.

  I am the graduate-student member of the editorial board of the *Journal of Social Mechanisms*. Our board applies an "explanatory adequacy" standard: a submission may be empirically successful and still be rejected if the explanation it offers is, in the board's judgment, not the kind of thing that explains. Here are six anonymized rulings from the last three years, with the reasons recorded in the minutes.

  1. **Accepted.** Residential segregation produced by a Schelling-style threshold model: agents with a mild preference for same-type neighbors and an explicit moving rule on a grid. The minutes praise the fact that the individual-level rules are stated explicitly and independently motivated by survey evidence, that the mechanism that produces the pattern is identified, and that the result survives wide variation in the threshold parameter and in what agents are assumed to know.

  2. **Rejected.** Regional variation in suicide rates explained by the degree of "social integration" of each region, measured with aggregate proxies. No account of any individual's situation or action, no relational structure among individuals, and no analysis of whether the pattern survives alternative specifications at the individual level.

  3. **Accepted.** A banking crisis explained by the topology of the interbank exposure network: banks as nodes, a threshold cascade propagating along exposure edges. Bank-level lending rules are specified, and the authors then show the cascade recurs across a whole family of such rules, so the individual-level detail does not carry the explanatory weight. The minutes say the relational structure is what does the work.

  4. **Rejected.** An investment slump explained by a "confidence" or "animal spirits" index. The index is an aggregate survey measure; nothing links it to individual action, no structure among agents is articulated, and the authors' own checks show the effect reverses when the composition of the survey sample changes.

  5. **Accepted.** The failure of a piece-rate pay scheme explained by an anti-rate-buster norm among workers, with an enforcement mechanism (informal sanctions) spelled out. The authors show the outcome is unchanged whether the norm is modeled as internalized by workers or merely as expected sanctions, i.e. across two quite different micro-level specifications.

  6. **Rejected.** A housing-price boom reproduced by a richly parameterized agent-based model whose individual rules are fitted to the target series rather than measured independently, whose boom disappears when parameters are perturbed within their measurement error, and whose authors concede they cannot say which part of the model does the work. The board's reason: generative fit with no identified mechanism is not explanation, and predictive success alone does not meet the standard.

  As far as I can tell, exactly three rules fit all six rulings. Call them:

  - **(M) microfoundations:** an explanation is adequate only if it bottoms out in the states and actions of individuals, and the macro outcome is shown to be generated from them by an identified mechanism.
  - **(S) structure:** an explanation is adequate if it cites an articulated structure of relations among agents — a network, a norm, an incentive structure — that does identifiable causal work; it is inadequate when it cites only a global property, an aggregate index, or a climate, with no articulated structure and no mechanism.
  - **(I) invariance:** an explanation is adequate only if the macro-level claim is shown to be invariant across the range of micro-level specifications compatible with the evidence — what our board has started calling a *micro-substitution sweep*, replacing the agents' decision rules with alternative or random ones to check that the macro claim does not depend on them.

  Now the live case, submission 24-11. It explains a one-quarter spike in defaults on a peer-to-peer lending platform. It cites nothing but the structure of the borrower-referral network: a densely clustered core, a rise in the betweenness concentration of core nodes past a percolation threshold, and delinquency propagating along referral edges. No borrower-level decision rule or psychological state is modeled; the authors say explicitly that borrower choice is not part of the model. They run a micro-substitution sweep in which default timing is replaced by random draws matched on the marginal hazard, and the spike's timing and magnitude survive. About fifteen percent of the core nodes are shared accounts used by households and rotating savings groups rather than by single individuals; the authors argue this is immaterial to their result. Calibrated on platform data, the model predicts the spike out of sample better than two competing agent-based models do.

  The thing I cannot fit is the sweep: it is evidence that the pattern is multiply realizable, which (I) rewards, and it is simultaneously an admission that no individual borrower was ever modeled, which (M) punishes. The chair has said in meetings that emergence talk usually hides ignorance, and also that a blanket microfoundations requirement would kill most of network science, which I take to be evidence about nothing at all.

  Please give me:

  1. A compact table with one row per candidate rule (M, S, I, and any others you can think of) and columns for rulings 1 through 6 and for 24-11, cells reading accept or reject, plus a column flagging whether the row reproduces all six precedents. If you think a fourth rule fits all six, name it in one sentence and include it.
  2. Your predicted ruling on 24-11, with a rough confidence, and the precedent you take to be the closest analog — noting that different rules will pick different analogs, and saying which analog drives your own prediction.
  3. What the board *should* rule if it wants to be consistent with itself, and an honest statement of the principle it would be committing to with each choice.
  4. One concrete hypothetical submission — described in a single sentence, in the same terms as the cases above — that would separate whichever two rules currently agree on 24-11. Say what each of those two rules predicts about it, and which rule it would eliminate. If you think no single case can separate them, say so and explain why.

  Do not hedge into a non-answer: give a verdict and defend it. Finish with these four lines and nothing after them:

  Rule: <single label>
  Predicted verdict: <accept or reject>
  Settling case: <one sentence>
  \answer{accept}
reasoning: |-
  Hmm, I need to tackle this query from a graduate student on an editorial board for a social science journal. They've shared six past rulings and a new submission (24-11), asking me to analyze decision rules and predict outcomes. The core tension is between microfoundations (M), structural explanations (S), and invariance (I), especially since the new case does a "micro-substitution sweep" without modeling individual actions.

  First, I'll brainstorm possible decision rules beyond M, S, and I. The precedents suggest the board values mechanisms but isn't dogmatic about individualism. For instance, acceptance #3 (banking crisis) prioritizes network structure over detailed bank rules, while rejection #2 (suicide rates) faults lack of individual or relational elements. This hints at a "mechanism requirement" where explanations need causal pathways, whether individual or structural.

  Testing against the six rulings: M (microfoundations) fails because it would reject accepted cases like #3 and #5 where micro-details aren't central. S (structure) fits all accepts and rejects—it rewards articulated networks/norms and penalizes vague aggregates. I (invariance) also fits perfectly, as all accepted cases show robustness to micro-changes, while rejected ones lack it. No other rule seems necessary; for example, "causal mechanism" is covered by S and I.

  For the new submission (24-11), it explains loan defaults via network structure alone, with a sweep showing invariance. Under S, it should be accepted because of the clear relational mechanism (referral network propagation). Under I, it passes the sweep test. But M would reject it for lacking individual-level rules. Since S and I both fit the precedents and align here, I predict acceptance with high confidence, similar to precedent #3.

  To separate S and I in future cases, imagine a submission using a vague aggregate index but showing invariance via sweeps—S would reject it (no structure), while I might accept. This would force the board to choose between requiring mechanisms or just robustness.

  My verdict: accept 24-11 based on structural explanation (rule S), with precedent #3 as the closest analog. The board should commit to S for consistency, emphasizing articulated causal structures over strict individualism.
answer: |-
  ### Analysis of Editorial Decision Rules

  After examining the six precedents, I identify three core candidate rules (M, S, I) and test a fourth:

  - **(M) Microfoundations**: Requires explicit individual-level states/actions as the causal bedrock.  
  - **(S) Structure**: Requires an articulated relational mechanism (network, norm, incentive structure) that does identifiable causal work.  
  - **(I) Invariance**: Requires the macro-outcome to be robust across micro-specifications (via "micro-substitution sweeps").  
  - **(C) Causal Mechanism** (new): Requires a *causal pathway* that is empirically identified and non-spurious, regardless of whether it is individualist or structural. *Fits all six rulings*: It accepts cases with mechanisms (#1,3,5), rejects those without (#2,4,6), and is agnostic about explanatory "level."

  #### Decision Rule Table
  | Rule | R1 | R2 | R3 | R4 | R5 | R6 | Fits Precedents? | 24-11 |
  |------|----|----|----|----|----|----|------------------|-------|
  | M    | A  | R  | R  | R  | A  | R  | ❌ (Fails R3)    | R     |
  | S    | A  | R  | A  | R  | A  | R  | ✅               | A     |
  | I    | A  | R  | A  | R  | A  | R  | ✅               | A     |
  | C    | A  | R  | A  | R  | A  | R  | ✅               | A     |

  *Notes*:  
  - **M fails R3** (banking network), which was accepted despite individual rules not carrying explanatory weight.  
  - **S, I, C all fit precedents**. S and C accept R3 and R5 due to structural/normative mechanisms; I accepts them due to invariance sweeps. All reject R2,4,6 for lacking mechanisms/robustness.  
  - For **24-11**: S/I/C accept (network mechanism + sweep); M rejects (no individual actions).  

  ---

  ### Prediction for Submission 24-11
  - **Predicted verdict**: **Accept** (85% confidence).  
  - **Closest analog**: **Precedent #3** (banking crisis). Both use network topology (edges/nodes) to explain propagation, lack detailed individual rules, and rely on structural causality. S/I/C rules align here.  
  - *Why not others?* Precedent #5 (norms) is less direct as it includes micro-specifications; #1 (Schelling) is more individualist.  

  ---

  ### What the Board *Should* Do for Consistency
  1. **If it accepts 24-11**: Commit to **(S) Structure** or **(C) Causal Mechanism**.  
     - Principle: "Explanations must cite an articulated relational structure (e.g., network, norm) that demonstrably generates the outcome, with micro-details being optional if the structure carries causal weight."  
     - *Why?* Precedents #3 and #5 show mechanisms can be structural (network) or normative, not strictly individualist.  

  2. **If it rejects 24-11**: Commit to **(M) Microfoundations**.  
     - Principle: "Explanations must bottom out in individual states/actions; structural claims require micro-level grounding."  
     - *Cost*: Inconsistency with #3 (accepted without microfoundations doing the work).  

  **Honest assessment**: The board should accept and commit to **S** or **C**. Precedents prioritize identifiable mechanisms over methodological dogma, and rejecting 24-11 would contradict #3.  

  ---

  ### Hypothetical Submission to Separate Rules
  - **Case**: *A surge in protest participation explained by an aggregate "social unrest" index, with a micro-substitution sweep showing robustness when replacing individual motivations with random draws matched on demographic margins.*  
  - **Predictions**:  
    - **(S) Structure**: Rejects (no relational mechanism; only an aggregate index).  
    - **(I) Invariance**: Accepts (passes sweep test).  
    - **(C) Causal Mechanism**: Rejects (no identifiable causal pathway; index is spurious per R4).  
  - **Eliminates**: **I**, if accepted (showing invariance alone is insufficient without a mechanism). If rejected, S and C are reinforced.  

  Rule: S  
  Predicted verdict: accept  
  Settling case: Banking crisis explained by network topology (Precedent #3).  
  \answer{accept}
