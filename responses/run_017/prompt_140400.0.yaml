prompt: |-
  I chair the investment committee of a small regional drainage and flood-risk authority. We rank twenty to thirty capital proposals a year — levee raises, pump replacements, voluntary buyouts, lead service line replacement — under a legal mandate that benefits to residents who have not been born yet must be counted. Our current practice is crude: discount everything at a single 5 per cent "market" rate and ignore whatever falls after year fifty. Three of us, none an economist, have about an hour per proposal, and our recommendations go to an elected board that must defend them in public and could be challenged in court, so I need a written procedure we can rerun, not case-by-case intuition.

  Please give me that procedure in four parts. First, a screening step that separates the four things people conflate inside a discount rate — the productivity of capital (a dollar not spent now could instead earn a return for residents), the expectation that future residents will be richer so an extra dollar matters less to them, genuine risk that the benefit never arrives at all (including the risk that the authority itself will not exist to deliver it), and pure time preference, meaning weighting a benefit less purely because it comes later — and that makes us state, for each proposal, which of those we are actually applying. Second, a consistency check on pure time preference specifically: if we discount a health or safety benefit because it arrives in 2060 rather than 2030, would we equally accept discounting that same benefit if it arrived in 2060 to a child born this year rather than to a sixty-year-old alive today? It seems to me that a positive pure rate commits us to saying yes, and I want the procedure to force us to confront that. Third, rules about what gets discounted at all: whether lives, health and irreplaceable assets should share the money rate or run on a separate schedule, and how to treat a benefit whose recipients' existence depends on our own decision, since if we build the levee people move into the protected area and if we don't they never live here. Fourth, explicit stopping rules: where the procedure returns a hard no, where it returns a number, and where it must stop and hand the choice to the board as a value judgment the board has to own in public — including how to handle truncation at some horizon year and our uncertainty about what the right rate will be in fifty years.

  Then run it on three live proposals and write up what we would put in front of the board. One: replacing the remaining lead service lines in the oldest part of the district, high cost now against health benefits spread over roughly forty years to today's residents and to the families who will occupy those houses later. Two: a voluntary buyout of a flood-prone neighborhood, large cost now against avoided damage and emergency response over eighty years, in a part of the district whose population is projected to shrink. Three: deferring a scheduled spillway upgrade for two budget cycles to hold this year's rate increase down, which shifts a low-probability, high-consequence failure risk forty to sixty years out and which the board is strongly inclined to defer. I expect the procedure to tell us something we would rather not hear in at least one of these; state that plainly, and state plainly what the procedure cannot settle for us.
reasoning: |-
  Okay, the user chairs an investment committee for a drainage and flood-risk authority. They need a structured procedure for evaluating capital proposals that accounts for future generations, as legally required. Current methods are crude: a flat 5% discount rate and ignoring anything beyond 50 years. The user wants a four-part procedure addressing discount rate components, pure time preference ethics, what to discount, and stopping rules. They also want it applied to three real proposals.

  First, I need to unpack the discount rate into its four components: productivity of capital, income growth effect, risk, and pure time preference. The user wants each proposal to specify which components apply. This separation is crucial because conflating them can lead to unfair discounting of future benefits, especially for projects where future residents' welfare is legally protected.

  Next, the consistency check on pure time preference. If a benefit in 2060 is discounted just because it's in the future, would they discount it equally for a child born today versus a current 60-year-old? The user wants the procedure to force confronting this ethical dilemma. This highlights intergenerational equity, which is central to their legal mandate.

  Then, rules on what gets discounted. Should lives, health, and irreplaceable assets use the same rate as monetary benefits? Also, how to handle benefits where the recipients exist only if the project is built (like levee-induced development). This involves distinguishing between tangible and intangible benefits and avoiding double-counting or ethical missteps.

  Stopping rules are vital. The procedure must specify when to reject a proposal outright, when to provide a clear NPV, and when to defer to the board due to value judgments. Handling uncertainty beyond 50 years and truncation effects is part of this.

  Applying this to the three proposals:
  1. **Lead Service Lines**: High upfront cost, health benefits over 40 years. Discounting health raises ethical issues. The procedure might show a negative NPV if monetized, but the board must decide on valuing health vs. costs.
  2. **Buyout in Shrinking Area**: High cost now, avoids damages over 80 years. Population decline affects benefits. Risk discount applies, but pure time preference could be controversial. The NPV might be negative, urging rejection.
  3. **Deferred Spillway Upgrade**: Short-term savings vs. future catastrophic risk. Low probability but high consequence. Risk discount dominates, but truncating at 50 years hides the risk. The procedure should flag this as dangerous, advising against deferral.

  The user's deeper needs include legal defensibility, transparency, and intergenerational equity. They fear undervaluing future residents and want a method that forces explicit ethical choices. The procedure must be repeatable, documentable, and highlight where board judgment is needed, protecting against public or legal challenges.
answer: |-
  Here is a four-part procedure designed for your committee's needs, emphasizing defensibility, transparency, and intergenerational equity. It forces explicit choices on ethically charged assumptions and separates technical calculation from political judgment.

  **Part 1: Decomposing the Discount Rate (The Screening Step)**
  *For each proposal, the committee MUST explicitly state which components are applied and justify them in writing:*

  1.  **Productivity of Capital (δ_p):** The opportunity cost of capital. *Apply this if:* Funds diverted from this project could earn a return elsewhere benefiting residents (e.g., invested in other infrastructure, reserves). *State:* "We apply δ_p = [X%] because... [e.g., based on historical return on authority bonds/infrastructure funds, estimated at 3-4% real]."
  2.  **Income/Wealth Growth Effect (δ_g):** Future generations are richer, so a marginal dollar is worth less to them. *Apply this only to monetized consumption benefits* (e.g., property damage avoided, productivity gains). *Do NOT apply to health, safety, or existence value.* *State:* "We apply δ_g = [Y%] because... [e.g., based on long-term projected real per capita GDP growth of 1-1.5%]."
  3.  **Risk Premium (δ_r):** Probability the benefit won't materialize. Includes project failure, policy reversal, climate change altering risk profiles, *and institutional risk* (e.g., authority insolvency, dissolution). *Apply specifically to benefits contingent on future events or authority actions.* *State:* "We apply δ_r = [Z%] because... [e.g., this project has [High/Med/Low] technical/political/institutional risk; we estimate a [X]% chance of significant benefit reduction/failure]."
  4.  **Pure Time Preference (δ_ptp):** Discounting solely because a benefit occurs later. *Apply only if explicitly justified as an ethical choice.* *State:* "We apply δ_ptp = [W%] because... [e.g., we believe society inherently values present welfare more, set near 0% for intergenerational projects per our mandate]." *Default is 0% unless compelling ethical argument overrides.*
  5.  **Total Discount Rate (r):** r = δ_p + δ_g + δ_r + δ_ptp. *Document the calculation clearly.* For non-monetized benefits (lives, health, ecosystems), proceed to Part 3.

  **Part 2: The Pure Time Preference Consistency Check**
  *For any project where δ_ptp > 0% is applied:*
  1.  **State the Implication:** "Applying δ_ptp = [W%] means we value a unit of benefit (e.g., one QALY - Quality-Adjusted Life Year, $1 of consumption) received by someone in Year T as worth only [Calculated Fraction] of the same unit received today."
  2.  **Pose the Test Question:** "Would we accept applying this same discount factor to a benefit received *in the same future year (T)* by: a) A person aged 60 alive today? vs. b) A child born this year who will be [Age] in Year T?"
  3.  **Record the Answer & Justification:** "The committee [Unanimously/Majority] believes [Yes/No] because... [e.g., 'Time delay is the ethical issue, not age' OR 'Discounting future generations this way violates our mandate']." *This forces confronting the intergenerational equity implication. A 'No' answer requires setting δ_ptp = 0% for that project.*

  **Part 3: Rules on What Gets Discounted & Recipient Existence**
  1.  **Monetary Consumption/Property Benefits:** Discounted at the full rate `r` derived in Part 1.
  2.  **Health, Safety (Lives Saved), Irreplaceable Assets (Unique Habitat):**
      *   *Do NOT discount the physical units* (e.g., QALYs gained, lives saved, acres preserved). Treat them as constant value over time.
      *   *DO discount the monetized values assigned to them* (e.g., Value of a Statistical Life - VSL - applied consistently, ecosystem service valuation) using only δ_p and δ_r (if applicable). *Exclude δ_g and δ_ptp.* Rationale: Future lives/health are not inherently "worth less" ethically; the monetary value reflects societal wealth at the time of valuation.
  3.  **Benefits Contingent on Project Implementation (e.g., New Residents):**
      *   *With-Project Scenario:* Count benefits accruing to future residents who move in *because* the project exists (e.g., families moving behind a new levee). These are genuine benefits enabled by the project.
      *   *Without-Project Scenario:* Do *not* count "avoided harms" to people who never exist if the project isn't built. The counterfactual is that those people don't live there and thus don't experience the harm. *Only count:* a) Benefits to current residents who stay, and b) Avoided costs borne by the *authority* (e.g., emergency services for floods in unpopulated areas is an authority cost; damage to hypothetical future residents' property isn't).

  **Part 4: Stopping Rules & Handling Uncertainty**
  1.  **Hard No:** NPV (using rules above) is significantly negative *even under* the most favorable reasonable assumptions (e.g., lower `r`, higher benefit valuation) AND the project lacks compelling, quantifiable non-monetized benefits critical to mission. *Document:* "Rejected: NPV < -$[X] under all plausible scenarios."
  2.  **Return a Number:** NPV is robustly positive or negative across a reasonable range of key assumptions (discount rates, benefit valuations, probabilities). *Document:* "Recommended [Accept/Reject]: NPV = $[X] (Base Case), Range $[Y] to $[Z] under sensitivity testing."
  3.  **Hand to the Board (Value Judgment):**
      *   **Truncation at Horizon (e.g., Year 50):** If >20% of *undiscounted* benefits occur beyond the horizon OR terminal value assumptions drastically alter NPV, *state:* "NPV is highly sensitive to benefits beyond Year 50 ($[A] undiscounted). Board must weigh intergenerational mandate vs. uncertainty."
      *   **High Sensitivity to δ_ptp or δ_r:** If switching δ_ptp between 0% and >0.5%, or δ_r by ±1%, flips NPV sign. *State:* "Recommendation hinges on ethical choice regarding [Pure Time Preference / Risk Assessment]. Board must explicitly choose."
      *   **Dominant Non-Monetized Benefits:** If quantified NPV is negative but project delivers critical, unquantifiable health/safety/ecosystem benefits. *State:* "Quantified NPV = -$[X]. However, project provides [Describe critical unquantifiable benefits]. Board must weigh these against cost."
      *   **Deep Uncertainty (e.g., Climate, Rates >50yrs):** If long-term assumptions (climate impacts, discount rates post-2070) are highly uncertain and pivotal. *State:* "Outcome depends critically on uncertain long-term factors [List]. Board must consider precautionary principle."
      *   **Recipient Existence Ambiguity:** If significant benefits depend on complex migration/population dynamics. *State:* "Estimated benefits include $[X] for future residents whose existence depends on project. Board must consider ethical implications per Part 3."

  **Application to Live Proposals**

  **Proposal 1: Lead Service Line Replacement**
  *   **Screening:** δ_p = 3% (bond cost), δ_g = 1% (consumption growth for avoided medical costs/earnings), δ_r = 0.5% (low tech risk), δ_ptp = 0% (mandate). **r = 4.5%**. Health benefits (QALYs) not discounted as physical units; monetized VSL gains discounted at δ_p + δ_r = 3.5%.
  *   **PTP Check:** δ_ptp=0%, check passed.
  *   **Discounting Rules:** Costs: Full `r`. Monetary Health Costs Avoided: Discounted. QALYs: Counted undiscounted.
  *   **Recipients:** Benefits accrue to current *and* future occupants of these specific homes. Counted.
  *   **Stopping/NPV:** High upfront cost, monetized benefits (health costs, property value) likely negative NPV at 4.5% over 40yrs. BUT, significant undiscounted QALY gains (reduced IQ loss, cardiovascular issues). *Sensitivity:* Truncation at 50yrs minor. Highly sensitive to VSL/QALY valuation.
  *   **Recommendation to Board:** **HAND TO BOARD.** "Quantified NPV is likely negative (-$2M to -$5M). However, project delivers substantial, long-term health protection (estimated 50-100 undiscounted QALYs gained) to vulnerable populations, current and future. Board must determine if these non-monetized health benefits justify the cost, considering our legal mandate to protect future residents."
  *   *What we'd rather not hear:* The purely financial case is bad. *What the procedure can't settle:* The dollar value of preventing developmental harm in future children.

  **Proposal 2: Voluntary Buyout (Flood-Prone, Shrinking Area)**
  *   **Screening:** δ_p = 3%, δ_g = 1% (property damage consumption), δ_r = 2.5% (High risk: political will for buyout completion, climate uncertainty, depopulation reducing future damage potential faster), δ_ptp = 0%. **r = 6.5%**. Lives saved/health: Not discounted as units; monetized VSL discounted at δ_p + δ_r = 5.5%.
  *   **PTP Check:** δ_ptp=0%, check passed.
  *   **Discounting Rules:** Costs: Full `r`. Avoided Property Damage: Discounted. Avoided Emergency Response (Authority Cost): Discounted. Lives/Health: Counted undiscounted; monetized VSL discounted.
  *   **Recipients:** Benefits mainly accrue to *current* residents (buyout) and *authority* (avoided future emergency costs in emptying area). Future hypothetical residents unlikely due to depopulation; minimal benefits contingent on non-existence.
  *   **Stopping/NPV:** Large upfront cost. Avoided future damages decline rapidly with depopulation. High δ_r reflects implementation/climate risk. Avoided emergency costs are authority savings. *Sensitivity:* High δ_r drives NPV. Truncation at 50yrs has minor impact (most benefits in 20-30yrs). Robustly negative NPV under base (r=6.5%) and sensitivity (r=5% to 8%) scenarios. Minimal unquantifiable benefits beyond authority cost savings.
  *   **Recommendation to Board:** **HARD NO REJECT.** "NPV is robustly negative (-$8M to -$12M) under all reasonable discount rate and depopulation scenarios. High risk (δ_r=2.5%) and depopulation undermine the long-term benefit case. Resources are better allocated elsewhere."
  *   *What we'd rather not hear:* Abandoning this neighborhood is the financially prudent choice. *What the procedure can't settle:* Whether social justice considerations for *current* vulnerable residents override the negative NPV (though quantified benefits include their buyout).

  **Proposal 3: Defer Spillway Upgrade (40-60 year risk shift)**
  *   **Screening:** δ_p = 3% (short-term savings invested), δ_g = 0% (catastrophe not consumption), δ_r = **See Below**, δ_ptp = 0%. *Risk is KEY:* Low annual probability (p) but high consequence (C). Discounting risk requires care. *Standard Approach:* Expected Annual Cost = p * C. NPV of deferral = Savings Now - Sum[ (p * C) / (1+r)^t ] for t=deferral period. `r` for discounting *expected costs*: δ_p + δ_r(project). δ_r(project) reflects risk the upgrade *itself* becomes obsolete/unneeded, set low (0.5%) for critical safety.
  *   **PTP Check:** δ_ptp=0%, check passed. Crucial for distant catastrophe.
  *   **Discounting Rules:** Savings (Monetary): Discounted. Catastrophe Cost: Treated as expected cost stream, discounted.
  *   **Recipients:** Catastrophe harms future residents/authority. Counted.
  *   **Stopping/NPV:** Savings Now = $Z. Expected Annual Cost = p * C. Discounted Cost of Deferral (40-60yrs) = Sum[p*C / (1+r)^t]. r = δ_p + δ_r(project) = 3.5%. *Sensitivity 1 (Truncation):* If Year 50 cutoff ignores catastrophe risk starting at 60y, NPV looks positive (savings > small discounted near-term risk). *Sensitivity 2 (Uncertainty):* True p and C are highly uncertain (climate). Small increase in p or C drastically changes NPV. Deep uncertainty about climate impacts at 2060+.
  *   **Recommendation to Board:** **HAND TO BOARD - URGENT CAUTION.** "Deferral generates immediate savings ($Z). The *quantified* NPV of deferred risk (using p_base, C_base, r=3.5%) is slightly positive (+$0.5M). **HOWEVER:** This relies heavily on truncating analysis at 50 years, ignoring the peak risk period (40-60y+). A small increase in failure probability (e.g., due to climate change) makes NPV strongly negative. Deferring safety-critical infrastructure based on a marginally positive NPV driven by truncation violates the precautionary principle and our mandate. Board must explicitly accept the potentially catastrophic, intergenerational risk imposed by deferral."
  *   *What we'd rather not hear (and board will hate):* Deferral is gambling with future catastrophe and relying on an accounting trick (truncation) to look acceptable. *What the procedure can't settle:* The board's risk tolerance for a low-probability, high-consequence event 50+ years away under climate uncertainty. The procedure *forces* this ethical risk-acceptance judgment into the open.

  **Key Output for the Board:**
  The procedure provides a clear, auditable framework separating calculation from judgment. For each proposal, the board receives:
  1.  **Summary Sheet:** Recommendation (Accept/Reject/Board Judgment), Key Financial Metric (NPV if applicable), Primary Reason.
  2.  **Detailed Rationale:** Explicit discount rate decomposition (Part 1), PTP Check outcome (Part 2), How benefits were classified/discounted (Part 3), Sensitivity & Uncertainty analysis (Part 4).
  3.  **Board's Explicit Choice:** For "Hand to Board" items, a concise statement of the *specific value judgment or risk tolerance decision* required of them (e.g., "Value X QALYs for future residents at $Y million?", "Accept a Z% increase in catastrophic failure risk in 2060+ for $W million savings now?").

  This procedure ensures defensibility by making assumptions transparent, confronts the ethical challenges of intergenerational discounting head-on, clearly flags where political judgment is required, and eliminates the indefensible practice of truncating long-term benefits while using a high discount rate. It forces the board to own the value-laden decisions publicly.
