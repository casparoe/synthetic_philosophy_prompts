  First, let's unpack their core need: they want to avoid superficial "local color" and ensure each linguistic feature drives genuine psychological realism in characters. The taxonomy must serve as a practical tool for scene construction, particularly testing if evidential markers (feature ii) create silent, internal cognitive differences. 

  Hmm, the constraints reveal sophisticated meta-awareness: 
  - They demand logical branching based on testable in-story scenarios (e.g., color swatch tests), not theoretical labels. 
  - They care about operational distinctions: obligatoriness vs. ease, speech vs. silent cognition, attention vs. conceptual availability, bilingual resilience. 
  - The "awkward commitment" requirement shows they want intellectual honesty, not flattery. 
  - The bilingual test case suggests they're considering cognitive universals. 

  *Pauses to consider pitfalls* 
  The tree must avoid false binaries. For example, "does language affect thought?" is banned—good! But I'll need nodes like: "Does the effect vanish when speaker uses another language?" to probe bilingual cognition. 

  For the three Kænnavan features: 
  (i) Wind-based spatial frames: Likely lands on "Thinking for Speaking" since absolute frames are known to guide attention during speech but don't restructure non-linguistic cognition. 
  (ii) Evidentials: Trickiest. Needs to resolve if the "seen/inferred" distinction feels real internally when silent. The tree must push past production effects: if evidentials create habitual inference-tracking even offline, it might reach "Domain Restructuring." 
  (iii) Blue-green-grey lexicon: Probable "Salience Filter." Color categorization effects are robust in perception tasks but don't alter conceptual boundaries. 

  *Checks constraint 5* Need to identify impossible combinations. Example: "Affects non-linguistic tasks + vanishes in bilinguals" is incoherent—if cognition changes, it shouldn't toggle with language. 

  For the crucial evidentials question: If the character feels the "seen/inferred" distinction privately, the position must allow grammatical obligatoriness to reshape habitual cognition beyond speech. That points to "Domain Restructuring"—but its "awkward commitment" is claiming inaccessible concepts. Trade-off: I'll note that internalized evidential awareness *could* feel like varying certainty levels, not alien concepts. 

  *Verifies leaf count* 6 leaves fit: Thinking for Speaking, Salience Filter, Domain Restructuring, Conceptual Privation, Lexical Channeling, Conceptual Universalism. Descriptive names where literature lacks labels. 

  Final note: The tree will reveal that for feature (ii), only Domain Restructuring licenses silent felt differences—but with caveats about how "feeling the difference" manifests (e.g., as intuition, not ineffable qualia). User must decide if that fits their character psychology.
answer: |-
  Below is a decision tree taxonomy of positions on linguistic relativity, structured per your constraints. The tree has **8 branch nodes** (framed as testable scenarios) and **6 leaf positions** (4 named, 2 descriptively labeled). After the tree, I apply your three Kænnavan features and resolve your evidentials question.  

  ---

  ### **Decision Tree: Linguistic Relativity Positions**  
  **Start Here:** A lifelong Kænnavan speaker, alone in a dark hut, recalls placing a knife earlier. She *must* recall its location using wind directions (e.g., "north corner"). Does this feel unnatural or effortful?  
  - **Yes** → Proceed to **Node A**  
  - **No** → Proceed to **Node B**  

  **Node A:** She describes a death in Kænnavan (using correct evidentials), then in a trade language without evidentials. Does her *trade-language* account omit details she’d include in Kænnavan (e.g., inference markers)?  
  - **Yes** → **Lexical Channeling** (Descriptive)  
  - **No** → **Thinking for Speaking** (Levelt)  

  **Node B:** A child raised bilingual (Kænnavan + trade language) performs a *silent* sorting task. She groups blue/green swatches together but separates blue from grey. Is her grouping consistent regardless of language used before the test?  
  - **Yes** → Proceed to **Node C**  
  - **No** → **Salience Filter** (Slobin)  

  **Node C:** An islander views a crime scene with ambiguous evidence. Later, *silently*, they weigh two explanations: one supported by direct traces, one by hearsay. Do they instinctively distrust the hearsay explanation more than a monolingual trade-speaker would?  
  - **Yes** → **Domain Restructuring** (Lucy/Gumperz)  
  - **No** → Proceed to **Node D**  

  **Node D:** A speaker who’s never left the islands is shown *blue*, *green*, and *grey* swatches. Asked to group "same colors," do they ever sort blue+green+grey together?  
  - **Yes** → **Conceptual Privation** (Descriptive)  
  - **No** → **Conceptual Universalism** (Pinker)  

  ---

  ### **Leaf Positions**  
  1. **Thinking for Speaking** (Slobin)  
     - *Awkward commitment*: Language shapes *only* online cognition during speech planning, leaving silent thought universal.  
     - *Licensed in fiction*: Characters feel linguistic compulsions (e.g., reaching for a wind direction) *only* when speaking/recalling verbally. Silent navigation is intuitive.  

  2. **Salience Filter**  
     - *Awkward commitment*: Language heightens sensitivity to certain distinctions in memory/attention, but doesn’t alter concepts.  
     - *Licensed in fiction*: Characters notice and remember wind-aligned spatial details or evidential traces more easily, even silently, but can access universal concepts with effort.  

  3. **Lexical Channeling**  
     - *Awkward commitment*: Obligatory encoding *steers* discourse toward grammatically marked distinctions, but silent cognition remains free.  
     - *Licensed in fiction*: Characters *omit* unmapped details (e.g., "left/right") when speaking, but internally understand them non-linguistically.  

  4. **Domain Restructuring** (Lucy)  
     - *Awkward commitment*: Grammar rewires core cognitive processes for a domain (e.g., space, evidence), even in non-linguistic tasks.  
     - *Licensed in fiction*: Characters *experience* space as wind-anchored or evidence as inherently categorized (seen/inferred) at a pre-linguistic level.  

  5. **Conceptual Privation**  
     - *Awkward commitment*: Lack of lexical/grammatical distinctions renders certain concepts *inaccessible* (not just ineffable).  
     - *Licensed in fiction*: Characters cannot mentally represent "blue without green" or "leftness" as discrete concepts, even silently.  

  6. **Conceptual Universalism**  
     - *Awkward commitment*: All linguistic effects are superficial; cognition is identically structured across humans.  
     - *Licensed in fiction*: Nothing beyond universal human experience (e.g., all characters feel "saw" vs. "inferred" identically to any human).  

  ---

  ### **Vacant Combinations**  
  1. **"Affects non-linguistic tasks + Vanishes in bilinguals"**  
     - *Why vacant*: Incoherent. If cognition is restructured (e.g., spatial reasoning), it shouldn’t toggle off with language switching.  
  2. **"Alters concepts + Only during speech"**  
     - *Why vacant*: Unattractive. If a concept is altered (e.g., color categories), it should affect silent perception, not just speaking.  
  3. **"Obligatoriness irrelevant + Only lexical effects"**  
     - *Why vacant*: Unattractive. If grammar compels encoding, it should exert stronger effects than optional lexicon.  

  ---

  ### **Applying Kænnavan Features to the Tree**  
  **Feature (i) (Wind-based spatial reference):**  
  - *Path*: Start → **No** (wind directions feel natural) → Node B → **No** (bilingual child’s silent sorting uses wind frames) → **Domain Restructuring**.  
  - *Reality threshold*: Node B (bilingual testing). Requires real-world evidence that absolute spatial frames reorganize non-linguistic cognition.  

  **Feature (ii) (Evidential marking):**  
  - *Path*: Start → **No** (evidentials feel natural) → Node B → **Yes** (silent distrust of hearsay) → **Domain Restructuring**.  
  - *Reality threshold*: Node C (silent evaluation of evidence). Requires evidence that evidentials reshape epistemic intuition.  
  - **Your crux question**: Domain Restructuring *does* license a character silently feeling the difference between "saw" and "inferred" as a cognitive instinct, not just a linguistic rule.  

  **Feature (iii) (Color lexicon):**  
  - *Path*: Start → **No** (color terms feel natural) → Node B → **No** (bilingual child separates blue/green) → Node D → **No** (never groups blue+green+grey) → **Conceptual Universalism**.  
  - *Reality threshold*: Node D (grouping task). Color categorization is universally constrained; lacking a word doesn’t preclude distinction.  

  ---

  ### **Key Resolution for Feature (ii)**  
  - **Domain Restructuring** licenses your scene: A character *can* silently feel the difference between seen/inferred events as a visceral, pre-linguistic intuition—grammar has reconfigured their epistemic cognition.  
  - **Warning**: This is contested territory. If you want ironclad real-world backing, lean into **Salience Filter** (where the distinction feels sharper due to habitual attention, but isn’t restructured). Domain Restructuring’s "awkward commitment" is claiming silent cognition is *inherently* categorical—a strong claim.  

  ### **Unresolved Pairs**  
  - **Salience Filter vs. Domain Restructuring**  
    - *What separates them*: Non-linguistic tasks (e.g., if a character *silently* infers guilt from evidence, is their confidence automatically calibrated to evidential type?).  
    - *Why hard to split*: Both predict heightened sensitivity; only Restructuring predicts *reorganized* intuition.  
  - **Lexical Channeling vs. Thinking for Speaking**  
    - *What separates them*: Whether silent recall/planning feels linguistically constrained (e.g., if recalling a path *silently*, does the character still use wind directions?).  

  ### **Recommendation for Your Scene**  
  For psychological plausibility:  
  - Use **Domain Restructuring** for evidentials (silent "felt difference" is justifiable).  
  - Use **Salience Filter** for spatial terms (wind directions feel salient, but internal navigation isn’t restructured).  
  - Use **Conceptual Universalism** for color (preserves realism; color distinctions are robust cross-linguistically).  

  This lets characters argue coherently: One insists grammar *forces* them to "think in winds" (Domain Restructuring), another calls it "just speech habits" (Thinking for Speaking). Both positions exist in the taxonomy, with testable stakes.
