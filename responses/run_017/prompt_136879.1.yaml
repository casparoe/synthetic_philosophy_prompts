prompt: |-
  I'm a PhD student in political science, and over the past year I've been serving on a small departmental committee that hands out seed grants, which has made me keep noticing a pattern I don't have a word for. The advice I was given about my own dissertation timeline — and that we were given on the committee — is the familiar one: distrust the story you can tell about why your case is special, and instead ask how often things of that kind work out. Not "my chapters will take four months each, and here is what each one involves," but "how long do dissertations here actually take." I'm fully convinced by that move in the ordinary case. What I keep running into is that the number you get from the outside is itself built out of people who reasoned from the inside. Everyone who shows up in our dissertation-completion figures formed their expectations by listing what they had left to do and estimating each piece, so the distribution I'm told to defer to is largely an aggregate of the very bias it is supposed to correct; the correction seems not to remove the optimism but to relocate it into the reference class and launder it. The committee case works the same way: the track record of seed grants looks like a fact about the projects, but it is equally a fact about how much we gave them, when we gave it, and whether the applicant, having confidently predicted a smooth path, had made any provision for the path not being smooth. I don't think this is survivorship bias, since the failures do get counted, and it isn't a self-fulfilling or self-defeating prophecy either, because the distortion seems to be present whether or not anyone has ever seen the base rate.

  There is a second thing I can't name, which feels like a companion to the first. Even when the reference class is clean, applying the outside view seems to require a judgment I can't see how to outsource: whether my case is relevantly similar to the cases in the class. My topic is one nobody in the department has worked on; does it belong in the class of dissertations generally, or dissertations where the student had to learn the method from scratch, or dissertations where the data had to be collected in the field? Picking among those is itself the kind of from-the-inside, story-telling judgment the outside view was meant to replace — so the inside view looks not expelled but pushed up one level, and I can't tell whether that regress bottoms out somewhere or whether it just shows that the two views were never really separable. I've been informally sorting the first phenomenon into three varieties — the class being composed of inside-view-generated cases; the class shifting once the people being predicted learn the number and start deferring to it; and the class being defined by a self-description, like "high-risk, high-reward," that is produced by the same judgment being corrected — but I have no idea whether that cut is at the joints or whether the three are really one thing.

  What I'd like to know is whether either phenomenon has an established name and literature — in the forecasting and decision-theory literatures, in epistemology, or in the social-studies-of-economics end of things, wherever it lives — and whether the two are instances of one underlying problem or genuinely different ones. If they already have names, I want to understand how each differs from its nearest neighbours: how the first is not just the ordinary problem of choosing among several available reference classes, and not just the econometric point about relationships breaking down once policy is made in reliance on them, and not just a self-fulfilling prophecy; how the second relates to what people talk about under the heading of epistemic modesty and to worries about trusting your own judgment when you have evidence that your judgment is unreliable. If they don't have names, I'd like you to coin them and define them precisely enough to settle these boundary questions: whether the contamination can ever push the outside view in the pessimistic direction rather than the optimistic one, what happens in the limit when everyone in the reference class took the outside view, and whether a case counts if no agent ever knew the base rate was being computed. A bare label won't do what I need here — I'm trying to get clear on what exactly the phenomenon is, what it is not, and where its edges lie, because I want to use the distinction in a methods section and not have it collapse under the first objection.
reasoning: |-
  Okay, the user is a PhD student in political science who's noticed some issues with the "outside view" approach to forecasting. They've been on a committee giving out seed grants and noticed that the base rates they're supposed to rely on are actually aggregates of individual "inside view" estimates. So the outside view might just be recycling the same optimistic biases it's meant to correct. They also point out another problem: even when you have a clean reference class, deciding which class your case belongs to requires a judgment call that feels like the inside view all over again.

  First, I need to figure out if these phenomena have established names. For the first one, where the reference class is contaminated by inside-view estimates, I recall that Tetlock and Kahneman have discussed base rates being distorted by planning fallacy. But is there a specific term? Maybe "reference class contamination" or "aggregated planning fallacy." The second issue about defining the reference class sounds like the "reference class problem" from statistics and philosophy, but the user already knows that term and wants to distinguish their point. 

  The user also mentioned three varieties of the first phenomenon. Let me map those: 1) the class composed of biased individual estimates, 2) the class changing when people start deferring to the base rate, and 3) self-descriptions like "high-risk" being part of the bias. These might all tie into Goodhart's law or reflexive predictions. 

  For the second phenomenon, the user is highlighting that selecting a reference class requires subjective judgment, which reintroduces the inside view. This relates to the problem of induction and the difficulty of objective categorization. Philosophers like Hacking or Douglas might have discussed this under the context of natural versus artificial kinds.

  I should check if there's existing literature. The planning fallacy literature by Kahneman and Tversky addresses individual optimism. For aggregated optimism, maybe work by Bent Flyvbjerg on megaprojects? His "survival of the unfittest" concept shows how projects with inflated estimates get approved. That connects to the user's seed grant example. 

  The second issue ties into epistemology, like Reichenbach's reference class problem. But the user wants to know how this differs from just choosing among classes. The key here is that the act of classification itself is an inside-view judgment, creating a regress. This might relate to Goodman's "grue" paradox or Quine's ontological relativity.

  Now, coining terms. For the first phenomenon: "Endogenously Biased Reference Class" (EBRC) or "Aggregated Planning Fallacy." For the second: "Categorical Regress Problem." Need to define these precisely. For EBRC, it's when the reference class consists of cases where each was originally subject to the planning fallacy. The contamination leads to optimism bias, but could it ever be pessimistic? Maybe in contexts where systemic caution exists, like in safety-critical fields, but usually it's optimistic.

  For the categorical regress, the bottom might be when a decision is forced by practical necessity, but philosophically it might not resolve. The user needs this for a methods section, so emphasizing that the outside view requires unavoidable judgment calls despite its intent might be key.

  Also, connecting to social studies of economics, Michel Callon's performativity concept shows how economic models shape reality. The base rate becoming a target fits here. And for epistemology, Heather Douglas on values in science relates to how values influence classification.

  Finally, ensuring the distinctions are clear. The first phenomenon is about the reference class data being tainted, while the second is about the impossibility of objective classification. Both show the entanglement of inside and outside views, challenging the notion that they can be neatly separated. The user's three varieties of the first phenomenon are interconnected through the reflexivity of social systems.
answer: |-
  Based on your exceptionally clear description, you've identified two profound and interrelated challenges to the "outside view" (reference class forecasting) that go beyond the standard literature discussions. Neither has a single universally accepted name, but they map onto established conceptual territories and debates. Here's the breakdown, including distinctions, potential names, and key literature:

  ### Phenomenon 1: The Contaminated Reference Class (or Aggregated Planning Fallacy)
  *   **What it is:** The base rate statistic (e.g., average dissertation time, seed grant success rate) is not an independent, objective measure of the *task's* difficulty, but rather an *aggregate* of the very individual "inside view" estimates (optimistic planning fallacies) that the outside view is meant to correct. The bias isn't removed; it's laundered and embedded in the reference data.
  *   **Why it's not just standard reference class selection:**
      *   The core issue isn't *choosing* the wrong class, but the *constitutive nature* of the data *within* the class itself being polluted by the bias the method seeks to avoid.
      *   It highlights a *generative feedback loop*: Individual optimism -> Aggregate statistic -> Used as "objective" baseline -> Potentially reinforces or obscures the underlying optimism.
  *   **Why it's not just Goodhart's Law/Lucas Critique:**
      *   Goodhart/Lucas focus on *policy interventions changing behavior* and invalidating historical relationships. Your phenomenon occurs even *without* policy change or conscious reaction to the statistic. The contamination is built-in *from the origin* of the data points, not induced later by the use of the statistic.
  *   **Why it's not just Survivorship Bias/Self-Fulfilling Prophecy:**
      *   Survivorship Bias ignores failures; you correctly note failures *are* counted, but the *estimates* leading to *all* projects (successes *and* failures) were optimistic. The bias is in the *inputs* (plans, expectations), not just the selection of outputs.
      *   Self-Fulfilling Prophecy requires the belief to *cause* the outcome. Here, the optimistic belief (inside view) generates the data point (actual duration/cost), which then *becomes* the reference point, regardless of whether future actors know it. The prophecy *created* the data, not the data causing the future outcome.
  *   **Established Concepts/Literature:**
      *   **The Planning Fallacy (Kahneman & Tversky):** The core individual bias.
      *   **"Inside View Contamination" (Flyvbjerg - implicitly):** Bent Flyvbjerg's work on megaprojects ("Survival of the Unfittest", "Quality Control") explicitly shows how *optimistic estimates* (inside views) lead to project approval, creating a dataset where cost overruns are the norm. The "base rate" of overruns *is* the aggregate of those optimistic plans. This is the clearest empirical match.
      *   **Reflexivity (Soros, but broader):** The idea that participants' biased perceptions (inside views) shape the reality (project outcomes) that is then measured to form "objective" data (reference class).
      *   **Performativity (Callon, MacKenzie - Economics/Sociology of Finance):** How economic models and metrics (like base rates) don't just describe reality but shape it. Your case shows how the *inputs* to the metric are already shaped by the cognitive processes the metric is meant to correct.
  *   **Coined Term:** **Endogenously Biased Reference Class (EBRC)** or **Aggregated Planning Fallacy (APF)**.
      *   **Definition:** *A reference class whose defining statistical properties (e.g., mean duration, success rate) are systematically distorted because the individual cases comprising the class were themselves subject to the specific cognitive bias (typically the planning fallacy) that the use of the reference class is intended to correct.*
      *   **Boundaries Clarified:**
          *   **Pessimism?** Possible but rarer. If systemic *pessimism* dominated initial estimates (e.g., in highly regulated safety-critical domains where sandbagging is common), the aggregate could be biased long. Usually, planning fallacy implies optimism bias.
          *   **Everyone Uses Outside View?** If *every* case in the history used a "pure" outside view based on a *prior* uncontaminated class, the distortion *could* be corrected... but achieving this initial uncontaminated class is the core problem (chicken-and-egg). In practice, initial estimates likely had inside-view elements.
          *   **Unknown Base Rate?** Absolutely counts. The contamination stems from the *formation of the individual case estimates/plans* that generate the outcomes, not from later actors knowing the aggregate. The bias is embedded in the historical record itself.

  ### Phenomenon 2: The Inescapable Judgment of Similarity (or Categorical Regress)
  *   **What it is:** Applying the outside view requires deciding *which* reference class your specific case belongs to ("dissertations in general"? "Dissertations using novel method X"?). This decision inherently relies on a *case-specific, narrative-driven judgment* about relevant similarity – precisely the type of "inside view" reasoning the outside view was meant to supersede. The inside view isn't eliminated; it's elevated to a meta-level.
  *   **Relation to Epistemic Modesty/Unreliable Judgment:**
      *   Epistemic modesty advises deferring to base rates *because* individual judgment is unreliable. This phenomenon highlights that *implementing* epistemic modesty *requires* an exercise of that same unreliable individual judgment (to pick the class). It reveals a paradox *within* the practice of modesty.
      *   Knowing your judgment is unreliable about the *task* (dissertation) doesn't automatically make you reliable about judging *similarity* to other tasks/cases. This is a distinct, higher-order unreliability.
  *   **Why it's deeper than the standard "Reference Class Problem":**
      *   The standard problem acknowledges multiple possible classes exist. Your point is that *choosing among them requires the very mode of reasoning (case-specific, narrative-based judgment) that the outside view seeks to avoid as biased*. It's a *regress*: To avoid bias X in estimation, you use method Y, but applying method Y requires making judgments vulnerable to bias X. Where does it stop?
  *   **Established Concepts/Literature:**
      *   **The Reference Class Problem (Reichenbach, Kahneman & Tversky):** The core recognition that multiple classes exist.
      *   **Problem of Induction / Goodman's "Grue" Paradox:** How do we justify projecting properties from past cases to future cases? What makes categories "natural" or relevant? Your issue is a practical instantiation.
      *   **Tacit Knowledge / Judgment (Polanyi, Collins):** The unavoidable role of personal, often unarticulable, judgment in applying rules or classifications, even when following a "mechanical" method like using base rates.
      *   **Natural Kinds (Philosophy of Science - Hacking, Dupré):** Debates about whether categories like "dissertation" or "high-risk project" reflect real, objective similarities in the world or are socially constructed/convenient groupings. Your case highlights the *practical necessity and subjectivity* of this grouping.
      *   **Bounded Rationality / Ecological Rationality (Simon, Gigerenzer):** Recognizes that optimal rules (like "always use the outside view") are impossible; we use fast-and-frugal heuristics based on perceived similarity to past cases ("recognition heuristic"). Your point exposes the judgment inherent in "perceived similarity".
  *   **Coined Term:** **Categorical Regress Problem (CRP)** or **Similarity Judgment Dilemma (SJD)**.
      *   **Definition:** *The unavoidable reliance on case-specific, narrative-based judgment (an "inside view") to determine the relevant reference class for applying the outside view, thereby reintroducing the potential for the very biases the outside view methodology was intended to circumvent.*
      *   **Boundaries Clarified:**
          *   **Does the Regress Bottom Out?** Practically, yes, through convention, authority, or pragmatic stopping rules (e.g., "use the broadest available class unless there's a *very* strong reason not to"). Philosophically/epistemically, it points towards foundational issues in induction and categorization that may not have a definitive "bottom". In practice, we make a judgment call.
          *   **Relation to Modesty:** It demonstrates a *structural limit* to epistemic modesty: perfect deference is impossible because *someone* must exercise judgment to implement the deference. Modesty must be applied *to the judgment of similarity itself*.

  ### Relationship Between the Two Phenomena
  They are distinct but deeply intertwined and mutually reinforcing instances of a **fundamental challenge to the separation of the "inside" and "outside" views**:

  1.  **EBRC/APF (Phenomenon 1):** Shows the *data* for the outside view is often contaminated by the inside view.
  2.  **CRP/SJD (Phenomenon 2):** Shows the *application* of the outside view requires judgment contaminated by the inside view.
  3.  **Synergy:** EBRC makes the CRP *worse* because the available reference classes are built on biased data. CRP makes EBRC *harder to escape* because the judgment needed to find a "cleaner" class is itself fallible. Both reveal the **entanglement of the two perspectives** – the "outside" is never truly independent of the "inside" processes that generated it and the judgments used to access it.

  ### Key Takeaways for Your Methods Section
  *   **Acknowledge the Entanglement:** Explicitly state that the "outside view" is not a pure, objective alternative, but relies on data and judgments potentially influenced by the same biases it counters.
  *   **Define the Problems:** Use the coined terms (EBRC/APF and CRP/SJD) or clearly describe the phenomena (aggregated planning fallacy, categorical regress).
  *   **Mitigate (Don't Eliminate):** Frame using the outside view as a *mitigation* strategy, not a cure-all. Suggest strategies:
      *   For EBRC: Seek reference classes potentially *less* contaminated (e.g., durations from institutions with very different cultures, historical data pre-dating current incentive structures if possible, explicitly adjusting aggregate stats using known planning fallacy multipliers).
      *   For CRP: Use the broadest plausible class by default; *explicitly justify* any narrowing based on specific, verifiable differences (not just narratives); seek independent input on classification; acknowledge the inherent judgment call.
  *   **Cite Relevant Lit:** Flyvbjerg (APF/Contamination), Kahneman & Tversky (Planning Fallacy, Reference Class Problem), literature on judgment under uncertainty/tacit knowledge (e.g., Tetlock, Gigerenzer), and potentially philosophy of science on categorization (Hacking, Douglas on values in science).

  Your dissection is sharp and touches on core issues in forecasting, practical epistemology, and the sociology of knowledge production. These phenomena highlight the messy reality of applying rationalist decision tools within complex, reflexive social systems like academia. Good luck with the methods section!
