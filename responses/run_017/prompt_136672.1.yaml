  Now, assessing if their hypothesis holds. In the lone rotating body case, modern substantivalists (after GR and hole argument) might say no rotation is possible without background structure. Relationists agree. But substantivalists might say the spacetime structure exists independently, so rotation could be absolute even without matter. However, GR's lack of background structure complicates this. So there might be agreement in practice, but the ontological commitment differs. That points to a representational issue.

