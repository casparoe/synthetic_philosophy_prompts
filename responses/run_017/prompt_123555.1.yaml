prompt: |-
  I write and maintain the software that a group of fertility clinics uses to rank embryos before transfer. I have no philosophy training, and I have run into something in the way my own field and the legal system talk about what looks like the same situation, and I cannot reconcile the two. I would like you to reconstruct the view each is committed to and tell me whether they are the same view.

  What the clinic does. A patient's embryos are biopsied, genotyped, and scored; the software returns, per embryo, estimated lifetime risks for a list of conditions plus a composite score. The screen the counselor reads from shows, for the embryo under discussion, its own risk alongside the best risk in the cohort: it will say that this embryo's risk of developing a given condition by sixty is 14 percent against a cohort best of 9 percent, and the counselor will describe transferring a different embryo as lowering your child's risk by five points. Where every embryo in a cohort carries a serious dominant condition, the standing protocol is to transfer none of them: the cycle is abandoned or donor gametes are offered, and the consent paperwork describes this as avoiding the birth of a child who would suffer avoidably. Note what the software cannot represent: choosing a lower-risk embryo does not improve any embryo's score, and the cohort being ranked exists at all only because the cycle was run. A second item in the same guidance makes it stranger: when a patient asks whether to delay a cycle by a month for a non-medical reason, the recorded answer is that the delay disadvantages no child, since a different egg will be released and a numerically different child would result.

  What the courts do, as best I can tell from reading around. When a clinic or laboratory misses a genetic problem and a child is born with a disability, the parents can sue for the extra costs of raising that child. In most of the United States the child cannot sue on her own behalf at all, on the reasoning that she has not been harmed, because the alternative was never being born. A few states let the child sue, but at least one restricts recovery to objectively provable expenses rather than anything for what it is like to live with the condition; a 1980 California decision that opened the door there said roughly that the plaintiff both exists and suffers, and that we need not be troubled by the fact that without the negligence she might never have existed at all. Other jurisdictions go further in the opposite direction: the German constitutional court held such claims unconstitutional on the ground that they imply one life is less worth living than another, while German courts go on awarding parents the cost of the child's upkeep.

  The thing I want unpacked. In the clinic we talk as though there is a fact of the matter about which possible child would be better off, as though selecting among candidates is a gain for someone, and as though a cohort with no good option is a reason to start over. In court the same kind of choice is treated as one that benefits and harms nobody, and even where money changes hands the measure of damages is carefully arranged so that no one has to price the difference between a disabled life and no life at all. That looks like two incompatible accounts of what it takes to make someone worse off, or of who the comparison is between, operating on opposite sides of the same hospital.

  So: what exactly does each practice presuppose? Which parts of the clinic's language and protocol are strictly required by the view it is committed to, and which are decoration that a different theory would generate anyway? Is the pair genuinely inconsistent, or can a single coherent view explain both why we rank embryos and why the resulting child has no complaint? Tell me what would concretely have to change in each setting if the presupposed view were swapped for its rival, in both directions: if the clinic took seriously the claim that nobody is benefited by being the one selected, and if tort law took seriously the claim that bringing the worse-off possible person into existence is a harm to her. And please be explicit about where the practice is underdetermined. If several theories license exactly the policies I have described, I would rather be told that than handed one tidy reconstruction. If this tangle has a standard name, give me the name and define it rather than assuming I have heard of it. Argue from the cases as I have given them; I do not want references or reading suggestions, and please flag which of my questions have no settled answer.
reasoning: |-
  Hmm, this user is grappling with a profound philosophical conflict between their clinical practice and legal frameworks regarding embryo selection. They develop software for fertility clinics that ranks embryos based on genetic risks, where counselors frame selecting lower-risk embryos as "lowering your child's risk." Yet in tort law, courts often reject "wrongful life" claims because the alternative is non-existence. The user sees inconsistency: clinics act as if selecting better embryos benefits a child, while courts say no child is harmed by being born with disabilities because they wouldn't exist otherwise.

  The core tension lies in different comparisons being made. Clinics compare potential future children against each other ("Embryo A vs. Embryo B"), treating the selected embryo as becoming "the child" who benefits from lower risks. But courts compare an actual disabled child against non-existence, concluding they can't be "worse off" than never existing. These are different counterfactuals - comparative vs. existential.

  Clinics rely on a Person-Affecting Principle: selections should benefit the future child. This requires identifying which embryo will become the child. Their protocol assumes numerical identity: the embryo transferred becomes the future person. That's why delaying cycles is considered harmless - it creates a different child. 

  Courts use a Non-Identity Problem framework: since the child wouldn't exist without the specific conception event, they can't claim harm from being born. Only economic damages for parents are permitted because they faced different choices. 

  These views aren't logically inconsistent because they answer different questions. Clinics ask "Which possible child will have better prospects?" while courts ask "Did this actual child suffer compensable harm?" However, the ethical framing feels dissonant because both deal with embryo selection consequences.

  If clinics adopted the legal view, they'd stop saying selection "benefits your child" and frame it as satisfying parental preferences. If courts adopted the clinical view, "wrongful life" suits might succeed, implying some lives are objectively worse than non-existence - a position most legal systems reject as devaluing disability.

  The unresolved philosophical knot is whether bringing a worse-off person into existence constitutes harm when the alternative is their non-existence. This is called the Non-Identity Problem, famously discussed by Derek Parfit. There's no consensus - it remains one of ethics' thorniest questions.
answer: |-
  Here's a precise dissection of the philosophical commitments in your clinic's practice versus tort law, their compatibility, and the implications of swapping views. I'll proceed step-by-step as requested, using only the evidence you provided.

  ### Core Commitments of Each Practice
  1.  **Fertility Clinic Practice:**
      *   **Presupposition:** It is meaningful and possible to compare the welfare of *different possible future persons* who could be born from the same cohort. Selecting an embryo with better health prospects is *better for the future child* who will exist as a result of that selection.
      *   **Key Metaphysical Commitment:** Numerical identity of the future child is tied to the specific embryo transferred. Embryo X becomes Child X. Therefore:
          *   Selecting Embryo A over Embryo B *benefits* Child A (compared to the counterfactual where Child B would have existed instead).
          *   Transferring no embryo avoids creating Child X (who would have a serious condition), which is better *for that potential child* than creating them to suffer ("avoiding the birth of a child who would suffer avoidably").
          *   Delaying a cycle creates a *different numerical child* (Y instead of X). Therefore, Child X is not deprived of existence or harmed by the delay; a different child (Y) is created later. No one is disadvantaged.
      *   **Strictly Required by the View:** The language of "lowering *your* child's risk" when selecting a different embryo, the framing of abandoning a cycle as avoiding suffering *for a potential child*, and the justification for delay (no disadvantage to *a child*). The core ranking logic presupposes that the selection *makes a difference for the welfare of the specific child who will be born*.
      *   **Decoration/Consequence:** The composite score, specific risk percentages, and the existence of the software itself. These are tools serving the core presupposition but could exist under a different theory focused purely on parental preference satisfaction.

  2.  **Tort Law Practice (as described):**
      *   **Presupposition:** It is impossible to coherently say that an existing person (Child Z, born with a disability due to negligence) is *worse off* than they would have been if the negligence hadn't occurred, because the alternative scenario is *their non-existence*. Non-existence is not a comparable state of being "better off" or "worse off" for Child Z.
      *   **Key Metaphysical Commitment:** The identity of the child is inextricably tied to the specific conception event (including the gametes and timing). Therefore:
          *   Child Z *only exists* because of the specific acts (including negligence) that led to their conception and birth. The alternative is *Child Z never existing*.
          *   Comparing Child Z's disabled existence to non-existence is meaningless for assessing harm *to Child Z*. You cannot harm someone by bringing them into existence if the only alternative is their non-existence *and* their life, even with disability, is worth living (a threshold most courts implicitly or explicitly accept).
          *   Harm can only be assessed relative to a scenario where *the same person* exists but in a better state. Since negligence led to *this specific person* existing disabled rather than not existing at all, no harm *to the child* is recognized.
      *   **Strictly Required by the View:** The rejection of the child's "wrongful life" claim based on the non-comparability argument ("alternative was never being born"). The allowance of *parental* claims (for "wrongful birth") is consistent as the parents *are* comparing two states where *they* exist: one with a disabled child (due to negligence) and one with either no child or a healthy child (had the negligence not occurred and different choices been possible).
      *   **Decoration/Consequence:** The specific rules on damages (e.g., only objective costs, not suffering) and the variations between jurisdictions (Germany's constitutional ruling vs. parental awards) are policy choices *flowing from* the core presupposition but represent different ways of handling its implications for parents and societal values.

  ### Are They Inconsistent?
  *   **No, not logically inconsistent.** They address fundamentally different questions using different counterfactuals:
      *   **Clinic:** Compares *different possible future children* (Embryo A vs. Embryo B) and asks: "Which one, *if born*, will likely have a better life?" It presupposes that selecting A over B benefits *the specific child* who comes from A *compared to the child* who would have come from B. The comparison is *between possible future persons*.
      *   **Tort Law (Child's Claim):** Compares *the actual existing child* to a counterfactual state where *that same child does not exist*. It asks: "Is Child Z worse off *being born disabled* than *never existing at all*?" It concludes this comparison is incoherent for establishing harm *to Child Z*. The comparison is *between existence and non-existence for the same person*.
  *   **The Dissonance Explained:** The practices *feel* inconsistent because they both deal with embryo/genetic selection consequences, but use incompatible frameworks for defining "harm" and "benefit" relative to different counterfactuals. The clinic speaks of benefiting *a* child by choosing *which* child is conceived. Tort law (for the child) speaks of harming *this* child by *bringing them into existence* in a disabled state vs. *not bringing them into existence at all*. The clinic compares possible children; tort law compares one child's existence to its non-existence.

  ### What Would Change if Views Were Swapped?
  1.  **If Clinic Adopted Tort Law's Presupposition (No Harm/Benefit to Child via Selection):**
      *   **Language Change:** Counselors could *not* say selecting Embryo A "lowers *your* child's risk" compared to Embryo B. They would have to say: "Selecting Embryo A results in a child with a lower estimated risk of Condition X than the child resulting from Embryo B would have had." The language shifts from benefiting *a child* to describing *outcomes for different possible children*. The child born from the selected embryo could *not* be described as having been "benefited" by the selection itself.
      *   **Protocol Change:** Abandoning a cycle could *not* be justified as "avoiding the birth of a child who would suffer avoidably" *for the sake of that potential child*. The justification would need to shift entirely to parental autonomy, resource allocation, societal cost, or a distinct moral claim that creating *any* child with severe suffering is wrong *per se* (impersonal harm), regardless of benefit/harm *to that child*.
      *   **Delay Justification:** The justification for non-medical delay ("disadvantages no child") could remain, as it already relies on the creation of a numerically different child, consistent with both views.

  2.  **If Tort Law Adopted Clinic's Presupposition (Harm/Benefit to Child via Selection/Non-Creation):**
      *   **Legal Change:** "Wrongful life" lawsuits by the child would become viable. A child born with a disability due to negligence could argue: "You (clinic/lab) negligently failed to detect the risk/prevent my conception. But for your negligence, *a different, healthier child* would have been born to my parents instead of me. Therefore, I am harmed compared to *that possible healthier child* who would have existed." This is the "wrongful life" claim based on *comparison to a different possible person*.
      *   **Damages Change:** Damages awarded to the child would need to reflect the difference in value between *their life with disability* and *the life of the healthy child who would otherwise have existed*. This requires courts to price the difference between existences of *different* possible persons, a significant expansion beyond the current focus (in parental claims) on the costs of caring for the disabled child vs. no child/a healthy child. Courts would have to confront the "worth" of different lives head-on, something most jurisdictions explicitly avoid (as noted in the German constitutional ruling).

  ### Underdetermination and Unsettled Questions
  *   **Underdetermined:** Both practices are *compatible* with various underlying ethical theories (Utilitarianism, Person-Affecting Views, Asymmetrical views on existence/non-existence) as long as they adhere to their core counterfactual comparisons. The clinic's protocol *could* be supported by a theory focused purely on impersonal outcomes (making the best possible child) rather than benefit to *that* child, though its current language leans strongly towards the latter. Tort law's rejection of wrongful life claims *could* be motivated by anti-disability discrimination concerns (like Germany) or purely by the logical non-comparability argument, without needing to specify the deeper ethics.
  *   **Unsettled Questions (No Philosophical Consensus):**
      *   **The Non-Identity Problem:** This is the **standard name** for the core issue tort law grapples with. It asks: Can an action (like selecting a specific embryo or failing to prevent a conception) that causes a particular person to exist with a disability *harm that person*, when the alternative is their non-existence? There is *no settled philosophical answer*. Derek Parfit's work (e.g., *Reasons and Persons*) is seminal here, but views remain deeply divided. Tort law sides with "No harm," the clinic's *language* implies "Harm can occur by creating the worse-off child when a better-off child was possible."
      *   **Moral Status of Selecting Between Possible Persons:** Is it meaningful and morally required to choose to create a "better-off" possible person over a "worse-off" one? The clinic assumes yes. Some philosophers agree (e.g., some interpretations of the "Person-Affecting Principle"), others disagree or find it problematic ("Procreative Beneficence" is controversial). Tort law avoids this question entirely by blocking the child's claim.
      *   **Pricing the Difference:** *How* to calculate damages if tort law accepted the clinic's view is fundamentally unsettled and likely intractable, as it requires comparing the value of two distinct, non-actualized lives.

  ### Summary
  *   **Clinic Presupposes:** Meaningful comparison *between* possible future children; selecting a better-off embryo benefits *that specific child*; not creating a potential sufferer is better *for them*.
  *   **Tort Law Presupposes (for Child's Claim):** Meaningful comparison *cannot* be made between an existing disabled child and their own non-existence; therefore, bringing them into existence disabled cannot harm *them*.
  *   **Compatibility:** Logically consistent because they answer different questions (different counterfactuals). The dissonance arises from applying these incompatible frameworks to closely related biological scenarios.
  *   **Swap Consequences:** Clinic language/protocol would shift from benefiting *a child* to describing *outcomes for different possible children*. Tort law would allow "wrongful life" suits based on comparison to a healthier possible child.
  *   **Core Unresolved Issue:** The **Non-Identity Problem** – whether creating a person who has a life worth living but is worse-off than an alternative possible person harms that person, given their only alternative is non-existence. This question has no settled philosophical or legal answer. Your clinic and the courts land on opposite sides of this unresolved problem.
