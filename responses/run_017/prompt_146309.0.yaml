  Okay, let me unpack this user's query. They're presenting a detailed scenario about cultural evolution and memes, building on a previous argument with a friend. The core question is whether a "schema lineage" in an online community qualifies as Darwinian cultural evolution according to their friend's existing framework of meme classifications. 

  First, I need to reconstruct the friend's implicit rules from her past verdicts. The user provided clear examples: things she classified as memes (slang, jokes, recipes, dances, chain messages) versus non-memes (reflexes, innate knowledge, private mnemonics, biological traits, and imposed clauses). The pattern suggests she requires both cultural transmission and some form of variation/selection—but with nuances. 

  Hmm, the tricky part is reconciling three apparent contradictions in her framework: 
  - She accepts family recipes with tweaks (variation) but rejects compliance clauses (no variation). 
  - She accepts chain messages (verbatim copying) but also jokes that transform over retellings (non-verbatim). 
  - She classifies dances copied from clips as memes but rejects flinching (innate) or eye color (biological). 

  The user's new case—a generative story recipe evolving via machine-generated instances and algorithmic selection—pushes these boundaries. Nothing is copied verbatim, humans don't create variants, and selection is artificial. Yet it clearly adapts. 

  I suspect the friend's underlying rule is about *agency*: selection must favor the meme's own properties, not host benefits or external imposition. This explains why the compliance clause (imposed) isn't a meme, while the joke (spread via its appeal) is. 

  For the schema lineage, key analogies are: 
  - Like the family recipe (generative template with variation), but selection is algorithmic, not human. 
  - Unlike the compliance clause (imposed), the schema's spread depends on its fit to the platform's mechanics. 

  The critical test would be modifying the case: if the ranking system were *rigged* to favor certain users regardless of content (imposition), the friend would likely deny it's a meme. But if success still hinges on the schema's inherent traits—even with machines involved—she might accept it. 

  User seems to want both a prediction for this case and a way to expose the friend's core principles. Smart framing: it avoids rehashing old disputes by using a novel example. Their frustration with "track record" arguments suggests they value theoretical consistency. I should emphasize where rules diverge to give them diagnostic tools.
answer: |-
  Here's a breakdown of your friend's likely implicit rules, applied to the "schema lineage" case, along with predictions, the closest analog, and a diagnostic variant:

  ### Your Friend's Likely Implicit Rules (Inferred from Verdicts)
  Based on her classifications, she seems to operate with these core principles:
  1.  **Heritable Variation + Differential Uptake is Necessary & Sufficient:** A cultural element evolves Darwinianly if it exhibits *inheritance* (passed on), *variation* (changes over transmission), and *differential fitness* (some variants spread more than others due to inherent properties). Fidelity can be low (like the recipe/joke), as long as the core "recipe" is inherited and varies.
  2.  **Replication Requires "Lineage Causation" (Not Necessarily Token Copying):** Success must be caused *by the properties of the variant itself* within the cultural environment, propagating *its own lineage*. Imposed elements (compliance clause) fail because their spread is externally mandated, not due to their own 'fitness'. Innate/reflexive elements (flinching, eye color) lack cultural inheritance. Private elements (mnemonic) lack transmission.
  3.  **Host Benefit is Irrelevant/Secondary:** Success is measured by the spread/replication of the cultural element itself, regardless of whether it benefits the host individual. The chain letter spreads *despite* being annoying/pointless because of its self-referential threat.

  ### Predictions for the Schema Lineage Case
  1.  **Rule 1 (Heritable Variation + Differential Uptake):** Predicts **YES, it's a meme/Darwinian evolution.**
      *   *Heritable:* The generative recipe is clearly inherited by each new poster/prompter.
      *   *Variation:* Each instance is unique (variation), and the recipe itself shifts over time (variation in the schema).
      *   *Differential Fitness:* The recipe changes *reliably increase how far an instance travels*. The variants (specific recipe details) that are "fitter" (better match the ranking algorithm) spread more effectively.
  2.  **Rule 2 (Lineage Causation):** Predicts **YES, it's a meme/Darwinian evolution.**
      *   The *recipe's own properties* (brevity, timing, rhythm) evolved *because* those properties caused its instances to be more likely to be seen, reacted to, and used as prompts for the next generation (via the ranking system). The success propagates the recipe lineage. The LLM and ranking system are part of the environment shaping selection, not the *cause* of the schema's spread in the way an employer mandate causes the clause's spread.
  3.  **Rule 3 (Host Benefit Irrelevant):** Predicts **YES, it's a meme/Darwinian evolution.** (This rule is less diagnostic here). The success is measured purely by the schema's propagation and adaptation to the platform environment, regardless of human benefit.

  ### The Verdict & Why
  *   **Most Likely Rule She's Running:** **Rule 2 (Lineage Causation)** is the strongest predictor of her past verdicts and likely her core principle. This cleanly explains:
      *   *Chain Letter vs. Compliance Clause:* Both involve verbatim copying. The difference is *why* they spread: the chain letter spreads due to its *own* self-referential threat (internal fitness), while the clause spreads due to *external* compulsion (not internal fitness).
      *   *Family Recipe vs. Private Mnemonic:* The recipe spreads because the *recipe itself* is appealing/useful (internal fitness), the mnemonic doesn't spread.
      *   *Joke vs. Flinching:* The joke spreads via its inherent funniness (internal fitness), flinching isn't culturally inherited.
  *   **Prediction for Schema Lineage:** Using Rule 2, she would likely say **YES, it is a meme/Darwinian evolution.** The schema's properties *cause* its own increased propagation through the algorithmic environment. The LLM and ranking system are selective forces *acting on* the schema's variation, analogous to human brains selecting funny jokes or useful recipes. It's not imposed like the clause.
  *   **Closest Analogue:** **The Family Recipe.** Both involve:
      *   Inheritance of a generative schema/recipe, not a token.
      *   Variation upon transmission (human tweaks / unique LLM generation).
      *   Differential success based on the properties of the output/variant (tastier food / higher ranking).
      *   Accumulated change over generations increasing "fitness".
  *   **Key Difference:** The **selection mechanism**. For the recipe, selection is (presumably) human taste/satisfaction driving continued use and tweaking. For the schema, selection is primarily an engineered algorithmic filter. Rule 2 focuses on *why* it spreads (its own properties causing propagation) rather than *what* does the selecting (human brains vs. algorithm).

  ### Diagnostic Variant: Where Rules 1 & 2 Would Diverge
  *   **The Variant:** Imagine the ranking system is **rigged**. It doesn't favor instances based on the schema's inherent properties (brevity, timing, rhythm) or user engagement. Instead, it **favors instances posted by specific, pre-approved users** (e.g., moderators, paid influencers) *regardless* of the content quality or adherence to the schema. The *illusion* of schema evolution is maintained because these users happen to use slightly shorter setups over time, but this shortening isn't *causing* the spread – their privileged status is. The schema's apparent "fitness" is an artifact of external imposition on *who* can succeed, not *what* can succeed.
  *   **Prediction Divergence:**
      *   **Rule 1 (Variation + Uptake):** Might still say **YES**. There's heritable variation (the schema passed on), variation (different instances), and differential uptake (some instances spread more). The *reason* for the differential uptake (external favoritism) might be seen as just another selective pressure.
      *   **Rule 2 (Lineage Causation):** Would say **NO**. The success of specific schema instances is **not** caused by the inherent properties of the schema variant itself. It's caused by the *external imposition* of favoritism on the poster, akin to the compliance clause being imposed by the employer. The schema's properties aren't driving its own propagation; the privileged access of certain hosts is. The apparent evolution is artificial selection *of hosts*, not natural selection *of schema variants* based on their fitness in the cultural environment.

  **Conclusion:** Based on her past verdicts, especially the crucial distinction between the chain letter (self-propagating) and the compliance clause (imposed), your friend's core rule is **Lineage Causation (Rule 2)**. She would likely classify the schema lineage **as a meme/Darwinian evolution** because the schema's evolved properties *cause* its own increased propagation through the algorithmic environment. The closest analogue is the evolving family recipe. The diagnostic variant (rigged ranking based on user, not content) would reveal if she prioritizes the *mechanism* of selection (Rule 2) or just the *fact* of variation and differential spread (Rule 1). Her rejection of the compliance clause strongly suggests she'd reject the rigged variant too, confirming Rule 2 as her primary criterion.
