answer: |-
  **Bottom line:** Your thesis survives the room's worst objection (the type theorist pointing out that AC is a theorem in type theory), *if* you successfully reframe your tiers as about *uses and computational impact* of *set-theoretic-like choice principles*, not the formal statement labeled "AC" in type theory.

  **Prep Sheet: Likely Objections & Replies (Ordered by Potential Damage)**

  1.  **Objector: Type Theorist**  
      *Objection:* "You're attacking a strawman. In dependent type theory (like Coq/Lean), the 'Axiom of Choice' (`∀ (A : Type) (B : A → Type) (R : ∀ a, B a → Prop), (∀ a, ∃ b, R a b) → ∃ (f : ∀ a, B a), ∀ a, R a (f a)`) is **provably a theorem** (it's equivalent to reordering a Pi and a Sigma). It's not an axiom! Your entire 'tier' framing misunderstands the foundational context most of us work in. The 'fight' you perceive doesn't exist here."
      *Reply (90s):* "Absolutely right! The formal statement *called* 'AC' in type theory is indeed a theorem – it's just the type of a dependent function. My tiers aren't about *that* statement. They're about the *uses* and *computational consequences* of principles *behaving like set-theoretic choice*: when you reach for `Classical.choice` (or equivalent) on an arbitrary `Nonempty α` to get a `term : α` out of thin air, or when you use Zorn's Lemma, or invoke a choice principle for an uncountable family. *That* act – summoning an arbitrary element from a proof of non-emptiness *without a specified witness* – is what my tiers classify based on what happens *after* you do it. The 'fight' I refer to is the historical/philosophical one imported *along with* those uses, not about the provability of the dependent pair reordering."
      *Weakness:* Requires clearly separating the *label* "AC" from the *action* of non-constructive selection. Some might feel you've moved the goalposts.

  2.  **Objector: Verification Engineer**  
      *Objection:* "Swap-invariance sounds nice, but how do I *test* it practically? Golden tests are expensive. If my extracted code calls an oracle, how do I know swapping it doesn't break something subtle downstream without exhaustive testing, which is impossible? This feels like you're replacing one oracle (AC) with another (hope swap-invariance holds)."
      *Reply (90s):* "Fair point. You shouldn't rely *only* on post-hoc testing. The goal is to *use the type system and proof structure to enforce swap-invariance where it matters*. For Tier 3 uses, design APIs so the choice function is explicitly passed as a dependency (like a `HasChoiceFunc` typeclass instance). Prove lemmas showing key outputs depend *only* on properties guaranteed by the choice spec, not the specific function. Use abstraction barriers. Swap-invariance is the *property* we need to *design for and verify* – ideally statically via types/proofs, supplemented by targeted property-based testing on the *observable* interface, not exhaustively testing the oracle itself."
      *Weakness:* "Design for it" is easier said than done. Static verification can be complex.

  3.  **Objector: Constructivist**  
      *Objection:* "Your tiers are irrelevant. The mistake was using non-constructive principles *at all*. Ghost choices still poison the proof with non-computational content. Tier 2 is just admitting you had a constructive witness all along but obscured it. Tier 3 is fundamentally broken. The only 'testable' thing is avoiding AC entirely and building constructive witnesses."
      *Reply (90s):* "I respect that position. My goal isn't to endorse non-constructive math, but to offer a *pragmatic framework for those already working with it* – like many in this room formalizing classical math. If you *must* use a classical principle, this gives criteria for when it's 'safer' computationally. Tier 1 *is* computationally inert. Tier 2 *does* acknowledge the witness was always there. Tier 3 *is* risky, hence the need for swap-invariance. This framework helps identify *where* the constructive content is missing, which is a step towards potentially finding it."
      *Weakness:* Doesn't satisfy a hardline constructivist. Concedes their point about the ideal solution.

  4.  **Objector: Mathematician (Lean/Coq User)**  
      *Objection:* "You dismiss Banach-Tarski, but it's the canonical example showing AC has *mathematical consequences* – it proves things constructively false proofs can't. Your 'tiers' seem focused only on computation, ignoring that AC fundamentally changes the *mathematical universe* we can reason about, even in 'ghost' proofs."
      *Reply (90s):* "You're right, Banach-Tarski highlights the set-theoretic power of AC. My refusal is purely *pragmatic for this audience*: most proof engineers aren't formalizing paradoxical decompositions. They *are* extracting code or building verified libraries where computational impact matters. My tiers aim to help *them* assess the cost/risk of a specific *use* of choice in *their* project. The profound mathematical consequences are real, but often orthogonal to the 'will my extracted code work?' question driving my talk."
      *Weakness:* Risks appearing dismissive of deep math. Doesn't address the "changing the universe" point head-on.

  5.  **Objector: Verification Engineer / Pragmatic Mathematician**  
      *Objection:* "Your Tier 2 claim ('a decent chunk is really Tier 2') feels hand-wavy. How common *is* this? If I use `Classical.choice` on `Finite α` in Lean, is that Tier 2? But `Finite α` doesn't give me an ordering or decidable equality automatically. Isn't this blurry?"
      *Reply (90s):* "It *is* blurry, and I admit I haven't done a large-scale census! The key point is intent and *available knowledge*. If you know `α` is finite *and* you know (or can easily derive) that it has decidable equality and an enumeration (`Fintype α` + `Fintype.elems` in Lean), then using `Classical.choice` here *could* be replaced by picking the `min` via that enumeration. The *reason* it's Tier 2 is because the *witness exists constructively based on known structure*, even if your specific proof path didn't use it. My script flags uses where the target type has instances like `Nonempty` derived from `Unique`, `Inhabited` (with a default), `Fintype`, or proofs of unique existence."
      *Weakness:* Very subjective. Relies on "could be replaced" and external knowledge.

  6.  **Objector: Philosopher**  
      *Objection:* "You haven't engaged with the *philosophical* question of whether AC is 'true' at all. You've changed the subject entirely to pragmatics of computation. Isn't this just dodging the real issue mathematicians and philosophers care about – the nature of mathematical existence?"
      *Reply (90s):* "Guilty as charged, but intentionally! As a software engineer building verified systems, the metaphysical 'truth' of AC is less urgent than knowing *if and how* using it will break my compiled artifact. My claim is that *for the purpose of getting reliable computational results*, the 'Is AC true?' debate is less relevant than asking 'What computational effect does *this instance* have?'. I'm offering a framework engineers can *use*, not resolving Platonism vs Intuitionism. The 'real issue' for the proof engineer *is* the computational impact."
      *Weakness:* Explicitly changes the subject. Won't satisfy a philosopher seeking ontological debate.

  7.  **Objector: Mathematician (Lean/Coq User)**  
      *Objection:* "Your 'ghost choice is free' claim is dangerous. Today's proof-only choice *becomes* tomorrow's computational dependency when someone refactors or adds a new theorem needing that basis vector. Tier 1 isn't stable. Shouldn't we avoid it on principle?"
      *Reply (90s):* "This is a real concern, and I flagged it as a weakness. The stability of tiers depends on project evolution. The mitigation is *documentation and API design*. If you use choice to get a basis, mark that definition as `noncomputable` (in Lean) and clearly document its classical dependency. If someone later needs a computable basis, they know they must revisit that proof and provide a constructive witness or algorithm, potentially changing the type. Tier 1 is 'free' *only if* the chosen element truly remains an erased proof artifact. If its value leaks, it was always latent Tier 3."
      *Weakness:* Concedes the instability. Relies on discipline (documentation) that may be lacking.

  **Concessions to Make Early (First 2 Minutes):**
  1.  **"I'm not a philosopher or logician. I'm an engineer who bumped into choice and got curious."** (Disarms expectations, establishes perspective).
  2.  **"I know AC is a theorem in type theory. My tiers are about the *computational effect* of using set-theoretic-like choice *principles* (`Classical.choice`, Zorn, etc.), not the formal label."** (Preempts the strongest objection).
  3.  **"The boundaries between Tiers 1, 2, and 3 are fuzzy and context-dependent. My 'Tier 2 is common' claim is anecdotal."** (Manages expectations on precision).

  **The Reply That Must Land (Addressing the Type Theorist - The Critical Moment):**
  *   **When the Type Theorist Objects:** "Your tiers misunderstand AC; it's a theorem here!"
  *   **Your Essential Reply:** "You're completely right about the formal statement called 'AC' in type theory. **My tiers aren't about *that* statement.** They're about the *action* and *computational consequences* of using `Classical.choice` (or equivalent) on an arbitrary `Nonempty α` to conjure a `term : α` out of thin air, or invoking Zorn's Lemma. *That act* – non-constructively selecting an element based *only* on a proof of non-emptiness – is what I'm classifying. The historical 'fight' about AC comes bundled with *those uses*, regardless of what we call the formal proposition in this foundation. My tiers ask: *after* you perform that act, what computational footprint does it leave?"

  **The Question You Hope Nobody Asks:**
  *   **Objector: Philosopher / Deeply Theoretical Type Theorist**  
      *Nightmare Question:* "You treat the choice function in swap-invariance as satisfying a 'spec'. But in a truly arbitrary, non-constructible set (like a Vitali set under AD), what *is* the 'spec' beyond `Nonempty`? Does 'swap-invariance' presuppose that *any* two functions satisfying the bare `Nonempty` spec are somehow 'equivalent' in a way that makes swapping meaningful? Isn't this circular?"
      *Why it's Bad:* It drags you into deep foundational waters (AD, the nature of "specs" for truly arbitrary choices) that are far beyond your thesis and engineering focus. Your concept of "spec" implicitly assumes more structure than just `Nonempty` for swap-invariance to be a useful test.
      *Best Attempted Dodge/Reply:* "You've hit the absolute limit of my framework! For the truly arbitrary, non-constructible sets central to the deep philosophy of AC, swap-invariance might be ill-defined or untestable. My tiers are aimed at the *practical uses* encountered by proof engineers formalizing 'ordinary' mathematics or building systems – where we usually have more concrete properties we care about preserving (like linear independence, or a filter property, or continuity) that *can* form a meaningful spec. In those cases, swap-invariance *is* testable relative to that spec. The truly metaphysical cases are outside my scope." *(Concede the limitation, retreat to pragmatism).*
