  Hmm, the user is running a grad reading group on norms of assertion and wants a Shakespearean sonnet for their final session. They need it to defend the knowledge norm of assertion - the idea that you should only assert what you know. 

  The sonnet needs to follow specific structural requirements: an octave presenting core phenomena (the oddness of "p but I don't know p", how belief excuses fail when challenged, and how we're held accountable for knowledge not just true belief). Then a volta introducing an original counterexample - something like sealed testimony or classified info where the asserter knows but can't disclose their basis to a skeptical hearer. The sestet should explore the tension this creates: is the assertion permissible? Defective but blameless? Does it actually give the hearer reason to believe? The couplet must distinguish between violable rules and correctness standards without just declaring the norm survives.

  This is quite sophisticated - they clearly know the epistemology literature deeply. The challenge is packing technical philosophical arguments into strict poetic form while maintaining both academic accuracy and aesthetic quality. I need to avoid textbook examples like Gettier cases and create something fresh.

  For the counterexample, I'll invent a "sealed testimony" scenario where the asserter has genuine knowledge through undisclosable channels. The hearer has strong counterevidence, creating tension between blamelessness and normative failure. The couplet will contrast culpability with correctness using "guilt" vs "gift" to show how an assertion can be well-intentioned yet still fail the knowledge standard.

  Iambic pentameter and Shakespearean rhyme scheme (ABABCDCDEFEFGG) are non-negotiable. The vocabulary should balance Early Modern English flavor with philosophical precision - "warrant" and "countenance" for epistemic terms, "doth" and "'tis" for period style. The volta at line 9 needs sharp pivot from argument to counterexample.

  The deeper need here seems to be synthesizing rigorous philosophy with creative pedagogy - they want the form itself to demonstrate how poetic constraints can mirror normative constraints. By making the sonnet's structure argue alongside its content, it'll model the very interplay between form and norm they've been studying.
answer: |-
  ## Upon the Norm of Knowing When to Speak

  When "p" escapes my lips, yet doubt remains,
  Confessed: "I know not p"—a jarring sound;
  If challenged, "But I *thought* it!" counts for naught,
  'Tis *knowing* p that duty holds me bound.
  For evidence I proffered, weak or strong,
  If truth alone absolved, why feel the sting?
  When error strikes, we seek not belief's plea,
  But ask what warrant did that utterance bring?
  **Yet picture this: a cable, sealed and sure,**
  **Confirms grim p, which I must now disclose**
  **To you, who trusts strong proofs that p is false—**
  **My source concealed, your doubt begins to grow.**

  Is blame deserved when duty seals my tongue?
  The gift of p seems hollow, wrongly wrung.
  Though guiltless I, my word, sans proof displayed,
  Falls short of knowledge's strict accolade.

  ---

  **Notes on Execution:**

  *   **Octave (Lines 1-8):** Builds the case phenomenologically:
      *   Line 1-2: The Moorean paradox ("p, but I don't know p").
      *   Line 3-4: Inadequacy of the belief excuse when challenged; demand for *knowledge*.
      *   Line 5-6: The insufficiency of mere truth for propriety, the "sting" of getting it wrong shows a higher norm.
      *   Line 7-8: The focus shifts from belief ("belief's plea") to the *warrant* ("what warrant") required for proper assertion.
  *   **Volta (Line 9 - "Yet picture this..."):** Introduces the novel counterexample - undisclosable knowledge (sealed cable) to a resistant hearer.
  *   **Sestet (Lines 9-14):** Explores the pressure on the norm:
      *   Line 11-12: Highlights the hearer's perspective ("your doubt begins to grow").
      *   Line 13: Questions blameworthiness ("Is blame deserved?").
      *   Line 14: Questions the efficacy/reason-giving force ("The gift of p seems hollow").
  *   **Closing Couplet (Lines 15-16):** Turns on the distinction:
      *   "Though guiltless I" (blameless violation of a rule).
      *   "My word... Falls short of knowledge's strict accolade" (failing the standard of correctness, even if blameless). The norm survives as the standard, distinct from a simple prescriptive rule.
