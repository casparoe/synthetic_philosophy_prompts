prompt: |-
  Hey — I need help designing one session of my upper-level undergrad ethics seminar. 22 students, 80 minutes, one whiteboard plus a projector, and I can bring in a couple of bags of those tiny chocolate bars to use as actual stakes. We'll have already done a couple of weeks on distributive ethics generally, but no lecture up front on this topic and I don't want them hearing the name of the view or of the objection until after the thing is over.

  Here's what I want them to walk out having felt, not having been told. First, that "extra benefits matter more the worse off the recipient is" has a strong grip on them — I want them to discover that they themselves keep voting that way. Second, that this same move, followed out, commits them to approving a change where you take from the better off and give the benefit to nobody at all, and that this isn't a weird extra bullet they can bite separately but the very same feature of the view doing the work it was hired to do. Third, and this is the bit I care most about: I've got a half-formed distinction I want the activity to test, between what I've been calling benefit-priority and level-priority. Benefit-priority is the claim that a given increment of benefit counts for more in the overall evaluation when it goes to someone worse off; level-priority is the claim about how much someone's final level contributes, the thing that keeps getting smaller as the level rises. I think the first one on its own is compatible with never preferring a change that makes nobody better off, and the second one isn't, and that most people run them together. If that distinction is fake or collapses under pressure, say so and give me something better to build on.

  So: design me a runnable thing. My rough idea is a sequence of anonymous pairwise votes over distributions of chocolate among anonymous recipients, run by show of hands or slips of paper, where each individual vote looks obviously right to someone with priority-friendly instincts, and where the set of votes, chained together, adds up to a verdict in the final round that nobody saw coming — the levelling-down one. And I want that final round to be genuinely executed: if the class majority votes to level down, chocolate is really taken from the better-off pile and given to no one (I'll eat it, or it goes back in the bag, whatever is more obnoxious). That's the moment where the idea shows up in what happens instead of in what I say afterwards, and I think the real stakes are what make it land. Tell me which pairings to put up, in what order, and why each one does the work you think it does.

  Two things I'd like folded in if they fit. One: an extra round where the levelling down is arranged so that the person who loses is picked by a random draw only after the vote, so that at the moment of voting there's no identifiable loser. I want to know whether their discomfort survives that, since I suspect their objection is secretly a person-affecting one and they don't know it. Two: something that forces the question of whether what bothers them is that the levelled-down outcome would be *better*, or only that there'd be no reason to bring it about — I'd rather stage that as a choice they have to make than as a distinction I announce.

  Then the debrief: map specific moments in the activity onto the parts of the argument, say what will predictably go wrong the first time I run it (I'm guessing at least: people voting self-interestedly because they might be a recipient, someone spotting the chain early and spoiling it, the class's majority votes not adding up to any consistent ranking at all, and the sheer silliness of destroying chocolate in front of adults), and tell me how to handle each. Also be honest about which part of this you can't get them to feel: my guess is that the activity can show them the entailment but can't make them feel why anyone would take the entailment to be a *reduction* of the view rather than a cost worth paying, and that I'll have to supply that myself. Say whether you agree and what else is missing.

  Write it as continuous prose, like an email — no headings, no bullet points, no bold, no tables, and don't number the sections. And please dont bother with references or a reading list, I'll add those myself.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're designing an undergrad ethics seminar session focused on distributive justice, specifically to explore priority views and the levelling down objection. The key goals are experiential: students should feel the intuitive pull of prioritizing the worse off, then confront its implication in approving levelling down, and finally grasp the distinction between benefit-priority and level-priority. 

  The user wants a hands-on activity with chocolate bars as stakes, anonymous voting, and a real execution of levelling down if voted. They also want two specific elements: random victim selection to test person-affecting intuitions, and a forced choice about whether levelling down is better or merely not worth implementing. The debrief should connect activity moments to concepts and anticipate pitfalls.

  First, I need to design the sequence of distributions. The voting chain must start with intuitively compelling priority cases (e.g., giving to worse off) and escalate toward levelling down. Each step should feel like an independent choice while logically chaining. The random victim twist requires careful staging—perhaps by using anonymized recipient slots (A/B/C) and delaying assignment. For the "better vs. reason to implement" probe, the final vote could explicitly offer both options.

  Pitfalls to address: self-interest might skew votes if students suspect they're recipients. Solution: emphasize anonymity and possibly assign recipient roles randomly only after voting. Early spoilers could derail the reveal; mitigation includes framing votes as standalone intuition checks and avoiding loaded terms. Inconsistent rankings might emerge; I'd prepare to highlight contradictions in debrief. The absurdity of wasting chocolate is intentional—lean into it as cognitive dissonance.

  For the benefit/level-priority distinction, the activity can surface the behavioral commitment (voting for levelling down) but likely won't resolve why some see it as reductio vs. acceptable cost. That requires post-activity discussion. The random victim test may reveal discomfort persists, suggesting person-affecting intuitions run deep.

  Structuring the session: opening setup (5 mins), voting rounds (40 mins), levelling down execution (dramatic pause), debrief (30 mins). Key moment: when students realize their votes caused chocolate destruction. That visceral outcome makes the abstract concrete. In debrief, map vote sequences to priority logic, then unpack the distinction using their reactions.

  What's missing: The activity likely won't make students feel why levelling down isn't automatically a dealbreaker for prioritarians. That needs lecturer input—perhaps noting that if priority stems from diminishing marginal utility, levelling down isn't better, but if it's intrinsic to well-being levels, it might be. Also, the person-affecting impulse warrants discussion beyond the random-vote observation.
answer: |-
  Here’s how I’d design your session, step by step, aiming for that visceral experience and testing your distinction. Picture this unfolding in real-time:

  First, set the stage clearly but neutrally. As students enter, have three piles of tiny chocolate bars on a table: a large pile (say, 40 bars), a medium pile (20), and a small pile (5). Label three large envelopes or boxes clearly as "Recipient A," "Recipient B," and "Recipient C." Explain that we're exploring intuitions about distributing benefits ethically, using real chocolate with real outcomes decided by their anonymous votes. Emphasize strict anonymity: no one will know who voted how, and crucially, *they won't know which recipient (A, B, or C) they might be* until *after* all voting is done and the chocolate is distributed. Assign each student a random, secret number corresponding to A, B, or C only *after* the final vote. This prevents self-interested voting and maintains the veil. Stress that each vote is a pairwise choice between two complete distributions of the chocolate among A, B, and C. They should vote for the distribution they think is *better*, all things considered. Use slips of paper for votes, collected quickly after each round – show of hands risks herd mentality. Project only the distributions being voted on, nothing else. Start the votes immediately; no lecture.

  **Round 1: Establish the Priority Intuition (Worse Off Gets More).**  
  Project:  
  *   Choice 1: A: 10, B: 10, C: 10  
  *   Choice 2: A: 15, B: 15, C: 0  
  Ask: "Which distribution is better?" Tally votes. Almost everyone will pick Choice 1. Highlight the near-consensus: giving something to the worst-off (C) matters more than giving extra to those already better off. The "priority" intuition is strong and shared. Execute: Put 10 bars in each recipient envelope/box.

  **Round 2: Reinforce Priority (Small Gain to Worse Off > Larger Gain to Better Off).**  
  Project:  
  *   Choice 1 (Current): A: 10, B: 10, C: 10  
  *   Choice 2: A: 18, B: 10, C: 11  
  Ask: "Which is better?" Many will hesitate, but the priority intuition often wins: giving just 1 extra to C (the worst-off here, though equal now) is seen as more important than giving 8 extra to A. A significant majority (maybe 60-80%) will likely pick Choice 2. Execute: *Remove 2 bars from A's pile (leaving 8? Wait, clarify: Start fresh piles!)* Better: Reset piles physically. For Choice 2, put 18 in A, 10 in B, 11 in C. The *reduction* in A's pile comes later.

  **Round 3: Increase the Stakes (Priority Over Larger Gains).**  
  Project:  
  *   Choice 1 (Current): A: 18, B: 10, C: 11  
  *   Choice 2: A: 25, B: 10, C: 10  
  Ask: "Which is better?" Now it's sharper. Choice 2 gives A a huge gain (7 more bars!), but *takes 1 bar away from C*. The priority intuition often holds: preventing C from losing that 1 bar (making them worse off relative to others *and* absolutely) feels more urgent than giving A a big bonus. Expect another majority for Choice 1 (18,10,11). Execute: Maintain A:18, B:10, C:11.

  **Round 4: Introduce the First Step Towards Leveling Down (Worse Off Benefit Trumps Equality).**  
  Project:  
  *   Choice 1 (Current): A: 18, B: 10, C: 11  
  *   Choice 2: A: 10, B: 10, C: 19  
  Ask: "Which is better?" Choice 2 makes C (the worst-off) much better off (+8) but makes A significantly worse off (-8) and creates strict equality (10,10,19). Priority intuition strongly favors Choice 2: the big gain to the worst-off outweighs the loss to the best-off and the move to equality. This feels like pure priority at work. Majority vote for Choice 2. Execute: Put 10 in A, 10 in B, 19 in C.

  **Round 5: The Crucial Pivot (Benefit to Worse Off vs. Leveling Down the Better Off).**  
  Project:  
  *   Choice 1 (Current): A: 10, B: 10, C: 19  
  *   Choice 2: A: 0, B: 20, C: 19  
  Ask: "Which is better?" Choice 2 makes B much better off (+10) but makes A catastrophically worse off (-10), reducing them to nothing. Crucially, C is unaffected. Priority intuition is **strained** here. The *loss* to A is massive. Yet, B *was* tied with A for worst-off position (both at 10). Giving a huge benefit to B (who was worse off than C) might still pull priority votes. It's a tough call designed to split the class. Expect a significant minority, maybe 30-50%, to vote for Choice 2. Execute the *winning* vote. If Choice 1 wins, leave A:10, B:10, C:19. If Choice 2 wins, put 0 in A, 20 in B, 19 in C. The *reality* of reducing A to nothing hits. Note the discomfort.

  **Round 6: The Leveling Down Reveal (Same Feature, No Benefit).**  
  Project:  
  *   Choice 1 (Current - depends on R5): Either (A:10, B:10, C:19) OR (A:0, B:20, C:19)  
  *   Choice 2: A: 0, B: 10, C: 19  
  *(Adjust numbers slightly if needed based on R5 outcome, but ensure Choice 2 takes from B without helping C or A)*  
  Ask: "Which is better?" **This is the moment.** Choice 2 takes 10 bars away from B (whether B was at 10 or 20) and gives them to *nobody*. Chocolate is destroyed or set aside. The *only* change is that B is now worse off. If the class has consistently applied priority thinking – that benefits matter more the worse off someone is *and* that the *level* of disadvantage itself matters intrinsically – then some might feel compelled to say Choice 2 is better. Why? Because B, who was better off than C, is now brought down closer to C's level (and potentially closer to A's level of 0). It reduces inequality *by making the better-off worse off, without helping anyone*. This is the entailment of the "level-priority" aspect. **Execute the majority vote.** If they vote for leveling down, *physically take the chocolate from B's pile and put it back in the bag or, even better, dramatically eat a few bars yourself*. The gasp will be real. The absurdity is the point.

  **Round 7: The Random Victim Test (Is it Personal or Structural?).**  
  Reset distributions mentally ("Imagine a fresh scenario"). Project:  
  *   Choice 1: Person X: 20, Person Y: 10, Person Z: 10  
  *   Choice 2: Person X: 10, Person Y: 10, Person Z: 10  
  Explain: "This time, the recipient who loses the 10 bars in Choice 2 (Person X) will be determined *by random draw* AFTER the vote. Right now, you don't know who X is." Ask: "Which is better?" This tests if the discomfort with leveling down in R6 was about harming a specific, identified person (A or B) or about the structure itself (making someone worse off for no benefit). If the level-priority intuition is strong and impersonal, a significant minority might still vote for Choice 2. If the objection is person-affecting ("harming X is bad"), the random draw might make Choice 2 *less* objectionable. Tally votes. *Do not execute yet.*

  **Round 8: The Implementation Question (Better vs. Reason to Do).**  
  Immediately after R7, project:  
  *   Choice 1: The outcome you just voted "Better" in Round 7.  
  *   Choice 2: Take no action (keep the current distribution - but since it's fresh, clarify "keep Choice 1 from R7 as the baseline").  
  Ask: "Suppose you are the decision-maker. Knowing which distribution you think is *better*, would you actually *choose to implement* the change to bring about that 'better' distribution?" This forces the distinction. They might think leveling down is *better* (due to level-priority) but see *no reason to cause it* (because it helps no one and harms someone). Or they might reject it being better altogether. Tally votes. *Then*, only if R7's winning vote was for Choice 2 (leveling down) *and* R8's vote is to implement it, perform the random draw to select the "victim" (X) and remove their 10 bars. Otherwise, state no change occurs.

  **Debrief:** Start by acknowledging the emotional journey – the initial strong pulls, the discomfort, the absurdity of destroying chocolate. Then map the logic:  
  1.  **R1-R4:** Showed the strong, shared intuition that benefits to the worse off matter more. You *felt* the priority.  
  2.  **R5:** Started stretching it – taking a lot from the better-off to give to the (former) worst-off. Some bit the bullet.  
  3.  **R6:** The reveal. The *exact same feature* you valued (caring more about the worse off) led, step-by-step, to preferring a change that only makes someone worse off. The chocolate destruction makes it undeniable. This is the "level-priority" in action – the intrinsic weight given to someone's low absolute level, even when no benefit results.  
  4.  **R7:** Tested if it was about the *person* or the *structure*. Did the randomness make leveling down feel less wrong? That might suggest a person-affecting instinct underneath the surface.  
  5.  **R8:** Explored the gap between "better" and "reason to do." You might have thought leveling down was "better" but refused to *do* it. Why? Perhaps because "better" should imply *someone* is better off? This points to the core distinction.  

  **Your Distinction:** The activity *can* isolate "benefit-priority." R1-R4 primarily engage it: giving a *benefit* to the worse off is prioritized. R6 forces "level-priority": the *state* of B being high is bad *in itself*, justifying making B worse off even without benefit. The collapse happens because people intuitively run them together – the benefit matters more *because* the recipient is at a low level. R6 shows that if the low level matters intrinsically, leveling down follows. The activity suggests the distinction isn't fake; it forces people to confront that "benefit-priority" alone *might* not lead to leveling down, but their full intuition often smuggles in "level-priority," which does. The key is whether the priority applies to the *act of benefiting* or the *state of being badly off*.

  **Predictable Pitfalls & Mitigation:**  
  *   **Self-Interest:** Anonymity + assigning recipient roles *after* all votes is crucial. Emphasize "which is better?" not "which helps you?". The reset for R7 also helps.  
  *   **Spotting the Chain:** Some might guess R6 is coming. Mitigation: Frame votes as independent intuition checks. The absurdity of R6 still lands hard even if anticipated. Lean into the "I told you it was absurd, but your votes led here!" moment.  
  *   **Inconsistent Rankings:** This is likely! They might vote differently in R5 or R6 than the priority chain predicts. **This is gold for debrief.** Point out the inconsistency: "In R3 you wouldn't take 1 from C to give 7 to A, but in R6 some of you were willing to take 10 from B to give 0 to anyone? What changed? Was it the magnitude? The identification? Or is the priority view unstable?" Use it to dissect the limits of intuition.  
  *   **Silliness of Destroying Chocolate:** Embrace it. The absurdity *is* the reductio ad absurdum. "We're destroying real value based on an ethical principle. How did we get here? Is this a sign the principle is flawed, or just that we applied it correctly in a weird case?" It makes the abstract concrete and memorable.  
  *   **R7/R8 Complexity:** Students might get confused between "better" and "implement." Be crystal clear: "First, judge which outcome is better. Second, decide if you'd actually make the change to achieve that 'better' outcome." Read the prompts slowly.  

  **What the Activity Can't Make Them Feel:** You're right. It can powerfully show the entailment and the distinction, and create discomfort with leveling down. But it *can't* make them feel why a prioritarian might *accept* leveling down as a consequence worth accepting. For that, you'll need to explain the core prioritarian motivation: that inequality itself, or more precisely, the intrinsic badness of being at a low absolute level of well-being (independent of comparisons), is so fundamental that reducing it *is* a genuine improvement, even if no one benefits. The activity makes this seem crazy; you need to articulate why someone finds it compelling. The activity also can't fully resolve the benefit/level-priority distinction – it strongly suggests it exists and that level-priority causes the problem, but the debrief needs you to crystallize it. The person-affecting instinct revealed in R7/R8 is also a feeling, but unpacking its implications needs your voice.

  **Final Thought:** The visceral shock of R6 – seeing chocolate taken and discarded based on *their* votes – is the linchpin. It transforms an abstract objection into a shared, slightly uncomfortable classroom memory. Lean into the silence after you eat that chocolate. Then build the analysis from *their* choices and reactions. Good luck, it sounds like a fantastic (and delicious) session!
