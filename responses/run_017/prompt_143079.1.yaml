answer: |-
  Here's the case run through both frameworks, with explicit markers for where the analogy holds, breaks, and where the theory might be silent. I'll tackle your points in order, avoiding forced answers and flagging limitations.

  ### 1. Mapping to Copycat: The Fluid-Concepts Breakdown
  - **"Alphabet"**: Fundamental properties of solar system bodies (size, shape, orbit centrality, orbital dominance, dynamical influence, composition, discovery context, cultural significance).
  - **"String"**: The pre-2006 solar system configuration: "9 distinct planets (inc. Pluto) + asteroids (non-planets) + comets (non-planets) + undiscovered KBOs."
  - **Live Readings (Competing "Answers")**:
    - **Historical/Counting Reading**: "Planet" = Major body orbiting the Sun, historically significant, distinct from asteroids/comets. *(What ijk → ijl would be: Preserve the count/pattern)*  
      *Pressure Against*: Discovery of Eris (Pluto-sized), Haumea, Makemake, Quaoar (all KBOs). If Pluto is a planet, these must be too → "ijklm..." – pattern becomes messy. Public attachment to "9" conflicts with scientific need for open-endedness.
    - **Dynamical Reading**: "Planet" = Body that dominates its orbital zone, gravitationally clearing it. *(What ijk → ijd would be: Group by orbital dominance, breaking the "l" pattern)*  
      *Pressure Against*: Pluto shares its zone (Kuiper Belt) with many similar objects. Mercury/Mars barely clear their zones; Earth crosses debris streams. Feels "slippery" and excludes culturally central bodies.
    - **Geophysical Reading**: "Planet" = Round body orbiting a star. *(A potential ijX – a different grouping)*  
      *Pressure Against*: Includes Ceres, Pluto, Eris, the Moon, even large asteroids → Explodes the category (~20+ "planets"), clashes with historical/cultural weight of "planet."
  - **Key Pressures**:
    - **Discovery Pressure (New Instances)**: Eris et al. directly challenged Pluto's uniqueness (like finding many "c"s after "abc").
    - **Domain Breach Pressure**: The Kuiper Belt wasn't just new objects; it revealed a *structure* analogous to the asteroid belt, making the inner/outer solar system symmetry visible. This undermined the "specialness" of Pluto's location (like realizing the alphabet has subsections).
    - **Coherence Pressure**: The historical definition became empirically unsustainable *and* conceptually messy. The "elegance" demanded a rule-based definition.

  ### 2. Where the Analogy Breaks: Institutions & Stipulation
  The Copycat microdomain fundamentally lacks these elements, which changes everything:
  - **The IAU Vote**: This is an **external authority imposing a stipulation**. Copycat has emergent consensus based on perceived elegance/pressure; it has no "voting body." The IAU acted like a programmer forcing `ijk → ijd`, overriding other potential elegant solutions (e.g., a broader geophysical definition).
  - **Textbooks, Careers & Public Sentiment**: These create **inertia and vested interests**. A "reading" in Copycat lives or dies purely by its fit. In science:
    - Textbooks codify the stipulation, giving it false permanence.
    - Careers built on studying Pluto as a "planet" suffered status loss.
    - Public attachment to Pluto (cultural "elegance" of 9 planets) created massive resistance the theory doesn't model.
  - **Consequence**: The fluid-concepts framework **struggles to model authority-driven change**. It describes the *pressure* leading to the need for change and the *reception* of the stipulation (e.g., slippage laundering), but the act of stipulation itself is an exogenous shock, not an emergent outcome. The theory is largely silent on institutional power dynamics.

  ### 3. Running it Back: What the Episode Shows About the Theory & "Arbitrariness"
  Dana's "arbitrary -> sentimental" move *is* too fast. The theory offers resources to evaluate stipulations:
  - **Pressure Resolution**: A "good" stipulation resolves the conceptual pressure cleanly. The IAU definition *partly* did this (addressing the KBO problem via orbital clearance) but created new pressures (exclusion of round bodies, dynamical vagueness around Mars/Mercury). It was **elegant for the Kuiper Belt problem but inelegant for planetary science broadly**.
  - **Slippage Laundering**: The IAU *declared* "dwarf planets are not planets." Yet, the phrase itself ("dwarf *planet*") and the geophysical similarity ensure the public (and many scientists) hear it as a *subcategory*. This is the fluid concept reasserting itself – the stipulation is being "laundered" back into slippage. This shows **stipulations aren't immune to conceptual pressures**; they can be absorbed or resisted.
  - **Not Pure Arbitrariness**: The IAU definition wasn't pulled from thin air. It was a *response* to specific pressures (Eris, KBO structure). Its flaws stem from *which pressures it prioritized* (dynamical coherence over geophysical coherence or cultural continuity). **"Arbitrary" here means "underdetermined by the concept alone," not "capricious."** Public reaction wasn't *just* sentimentality; it was a legitimate discomfort with the definition's *incoherence* from a broader conceptual view (why exclude round Ceres/Pluto but include Mercury?).

  ### 4. Evaluating Your Invented Terms
  - **(a) Domain Breach vs. Instance Pressure:**
    - **Distinct & Useful.** Instance pressure (finding more Ceres-like asteroids) strained the "planet" concept in the 1800s, resolved by demoting Ceres. **Domain breach** (discovering the Kuiper Belt as a *structured reservoir*) fundamentally changed the *nature* of the outer solar system's ontology. It wasn't just "more Plutos," it was realizing Pluto was part of a vast population *with its own rules*, akin to the asteroid belt. This demanded a more radical conceptual shift than adding a few instances. **The theory benefits from this distinction.** Instance pressure might be resolved by tweaking boundaries; domain breach often requires redefining the domain's structure.
  - **(b) Slippage Laundering:**
    - **Valuable Concept.** It perfectly describes the phenomenon: The IAU stipulatively defined "dwarf planet" as *not* a type of planet. However, the term's morphology ("dwarf *planet*") and shared properties (roundness, Sun-orbiting) exert constant pressure to reinterpret it as a subcategory. This is slippage *reasserting itself through linguistic and conceptual channels*, laundering the stipulation back into a fluid relationship. **It highlights how stipulations exist in tension with conceptual ecosystems.**

  ### Where the Theory is Silent (Explicitly)
  1.  **Institutional Power & Authority:** The theory has *no model* for how a vote by a specific body (IAU) can override conceptual pressures and impose a definition. It can only describe the pressures leading to the *need* for action and the *consequences* (resistance, laundering) afterward.
  2.  **Cultural Sentiment as a Legitimate Pressure:** Copycat's "elegance" is abstract. The theory struggles to incorporate the *validity* of cultural/historical attachment (like Pluto's 70-year status) as a conceptual pressure *worthy of accommodation* in a *scientific* definition. It sees this pressure, but can't easily say if it *should* influence the outcome, only that it *does*.
  3.  **Normative Evaluation of Stipulations:** While it can evaluate *how well* a stipulation resolves pressures *internal to the conceptual system* (e.g., IAU definition resolves KBO pressure but creates geophysical incoherence), it lacks tools to judge if a stipulation was *the right thing to do* politically, pedagogically, or sociologically. Was the IAU justified in prioritizing dynamical coherence over other pressures? The theory can't answer that normatively.

  ### Conclusion: Was Something Conceptual Happening?
  **Absolutely yes.** The Pluto debate is a textbook (pun intended) case of conceptual slippage driven by discovery pressure *and* domain breach. The pre-2006 "planet" concept was under unsustainable strain. The IAU stipulation was an *attempt* to freeze it, responding to specific pressures (primarily the domain breach of the Kuiper Belt). However, the fluidity persists:
  *   The definition itself has internal inconsistencies (pressure points).
  *   "Dwarf planet" is undergoing slippage laundering back towards a subcategory.
  *   Alternative definitions (geophysical) remain scientifically viable contenders, kept alive by unresolved pressures.

  Dana is right that new empirical data forced the change, but wrong that it was *just* swapping a wrong fact for a right one. The data created a **conceptual crisis** requiring a renegotiation of meaning. The IAU's solution wasn't dictated purely by nature; it was a choice about *which aspects* of the fluid concept to prioritize and freeze. The public reaction wasn't *merely* sentimentality; it was partly a recognition of the definition's conceptual awkwardness and the jarring nature of an imposed stipulation overriding deeply embedded understanding. The fluid-concepts framework illuminates *why* this was so messy and contentious. You didn't "win" the argument in a knockdown sense, but you correctly identified the core conceptual dynamics at play.
