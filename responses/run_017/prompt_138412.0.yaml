prompt: |-
  I'm a journalist, working on a feature about wether anthropology and cross-cultural psychology have quietly knocked the legs out from under the idea of moral objectivity. I've read enough of the usual stuff — the WEIRD critique of who actually ends up in psychology subject pools, the cross-cultural "moral universals" work that codes ethnographic material for cooperation-related concerns, the experimental-philosophy findings about how easily intuitions shift with framing — that I've ended up somewhere I didn't expect, and I want it stress-tested before I file.

  Here's where I've landed. The diversity data is much less threatening than it's made out to be. Sure, people in different places disagree a lot. But near as I can tell, nearly all of that is disagreement at the level of *application* — different non-moral factual beliefs, different material circumstances, different weightings of the same few concerns — not disagreement about basic moral principles. And once you look at structure rather than at specific verdicts there seems to be real convergence: everyone appears to have some class of rules they treat as holding regardless of what local authority says, everyone has some notion of fairness in cooperation, everyone prohibits gratuitous harm within some circle. So I've come to think cross-cultural moral psychology is, if anything, mildly supportive of objectivism rather than a debunking of it. That's the argument the piece is going to make.

  So: what would count against it? I want the strongest version of the other side, phrased as what would have to be true for me to be wrong, ranked from actually fatal down to merely awkward. And I want you to be honest about which of these my own side would concede as counting against it, because I suspect a fair-minded reviewer would say I've built in an escape hatch and I want to know how bad it is.

  Things I definately want you to grapple with:

  1. The generality problem. My worry is that my move is unfalsifiable: hand me any pattern of verdicts and I can always redescribe it as a shared principle plus local application. How would I tell genuine convergence in principle from post-hoc curve-fitting at whatever level of generality makes the data look tidy? What would the difference even consist in? If there's no answer there, is my position insulated by construction — and for a position of this kind is that fatal, or just what an inference-to-best-explanation argument looks like?

  2. Two results I've made up, so you can't look them up — argue them from scratch. (a) A big pre-registered study across roughly ninety societies finds that in every single society there's a class of rules people treat as authority-independent and generalizable (they still count as wrong even if the elders said they were fine and everyone around here does it), but the content of that class is all over the place: ritual purity in one place, debt and reciprocity in another, harm to strangers in a third. (b) A second pass over the same data finds that the spread within each society is larger than the spread between societies. My gut says (a) helps me and (b) is ambiguous, but I genuinely don't know which way either cuts, and in particular I don't know whether structural or formal convergence is the kind of convergence that answers a debunker at all, or whether only convergence in content does.

  3. The causal question. My defense needs every bit of variation to trace either to disagreement about non-moral facts or to different circumstances, and the debunker says much of it traces instead to cultural transmission that simply doesn't track moral facts. What evidence would distinguish those last two? Note that I don't think 'we found a cultural-learning explanation' can be the answer by itself, since some transmission story is available whether or not there are moral facts — say why, or say why I'm wrong about that.

  4. The case I think would actually break me: variation that survives information-equalization and reflection. Everyone gets the same non-moral facts, self-interest and inattention are idealized away, they can reason as long as they like, and stable disagreement about a recognizably moral question is still there. Is that the decisive one? Is it even coherent to describe? Is anything like it arguably already in the record? And am I committed to predicting it won't happen, or can I absorb it if it does?

  5. Where I'd personally be most and least moved. Most: cases where I can't reconstruct what the disagreement is even about — real incommensurability, where it stops making sense to say the two sides are applying one shared concept differently. Least: yet more cross-society variation in economic games with stakes and scripts nobody chose, since that strikes me as measuring behavior in an odd situation rather than moral judgment. Tell me if I have that backwards.

  6. Even if my objectivist-friendly reading survives, does the *method* of using untutored intuitions as evidence in moral philosophy survive it? This is the bit my editor cares about. If the intuitions philosophers lean hardest on come from a narrow slice of humanity, do I have to concede the armchair method is in worse shape than the objectivist conclusion itself — and can a realist hold those two apart, or do they stand and fall together?

  No citations please, I can't check references while I'm reporting and I'd rather have the arguments than the footnotes. If it helps, write it as if you're the most annoying reviewer my piece could possibly get.
reasoning: |-
  Okay, this journalist has a fascinating angle on moral objectivity and anthropology. They've done serious homework on WEIRD critiques and cross-cultural studies, but arrived at an unexpected conclusion: that moral diversity actually supports objectivism when you look at structural patterns rather than surface-level disagreements. Now they want their argument stress-tested by imagining the toughest possible critique.

  The core of their position seems to be that cross-cultural moral differences mostly reflect variations in application of shared principles (like fairness or harm avoidance), not fundamental disagreement about moral foundations. They're particularly concerned about six key challenges:

  First, they're worried their approach might be unfalsifiable - that any moral variation could be explained away as mere differences in application. How can we distinguish genuine convergence from convenient curve-fitting? This is a deep methodological concern.

  Second, they pose two hypothetical studies: one showing universal authority-independent rules but with wildly varying content across cultures, and another finding greater moral variation within societies than between them. They're unsure how these would impact their argument - especially whether structural convergence alone can support objectivity.

  Third, there's the causal question. They need to attribute all variation to non-moral factors or circumstances, but what if cultural transmission is truly arbitrary? How could we prove transmission tracks moral facts rather than just cultural drift?

  Fourth, they identify the nuclear scenario: persistent moral disagreement even after equalizing facts and idealizing reasoning conditions. Would this destroy their position? Is such a scenario even coherent?

  Fifth, they disclose their personal vulnerabilities - most moved by genuine incommensurability where shared concepts break down, least moved by artificial economic game data. They wonder if this intuition is backwards.

  Finally, there's the philosophy-method question: even if objectivity stands, can philosophers still rely on WEIRD intuitions as evidence? Their editor apparently cares deeply about this implication.

  This is an impressively self-aware set of challenges. The journalist clearly understands the weakest points in their argument and wants them probed ruthlessly. They're not just seeking confirmation but genuine pressure-testing, even requesting to be addressed as "the most annoying reviewer."

  The response will need to systematically dismantle each concern while acknowledging where concessions must be made. For the unfalsifiability charge, it should show how their approach differs from mere curve-fitting. For the hypothetical studies, it must analyze whether structural convergence suffices for objectivity. The cultural transmission issue requires distinguishing arbitrary drift from truth-tracking. The ideal disagreement scenario needs careful treatment regarding its possibility and implications. Their personal intuitions about evidence deserve scrutiny. And the philosophy-method question demands separating the survival of objectivity from the reliability of intuition-mining.

  Throughout, the response should maintain the requested "annoying reviewer" tone - rigorous, skeptical, but ultimately constructive. The goal isn't to defeat their argument but to harden it against the toughest criticisms they might face.
answer: |-
  Here’s the stress test you requested, structured as a brutal-but-fair reviewer confronting your argument. I’ll address your points in order, ranking counterarguments by severity (🚫 = fatal, ⚠️ = serious but surmountable, ⚖️ = ambiguous/context-dependent), and flagging where *your* side should concede ground.

  ---

  ### **1. The Generality Problem: Unfalsifiable Curve-Fitting?**  
  **🚫 Fatal if true, but your side has a (narrow) defense.**  
  - **What would break you:** Evidence of *genuine incommensurability* (see Point 5) where two cultures lack overlapping moral concepts (e.g., no analogue of "fairness" or "obligation" in one society). If all moral systems can be mapped onto your "shared principles" only by stretching definitions until they’re vacuously broad ("everyone cares about *something*"), your convergence is an artifact of description.  
  - **Your concession:** You *must* admit that if variation in "application" explains *everything*, it risks becoming untestable. But you can argue:  
    - **Best defense:** Convergence isn’t just at the *highest* abstraction (e.g., "cooperation good"). It emerges at mid-level principles (e.g., "reciprocity owed to those who help you," "unprovoked harm prohibited"). If these mid-level concepts recur *and* guide behavior cross-culturally, it’s not just curve-fitting.  
    - **Test:** Look for *predictive* power. Do these "shared principles" explain novel moral judgments in new cultures? If not, it’s descriptive gymnastics.  

  ---

  ### **2. Your Hypothetical Studies: Structural vs. Content Convergence**  
  **⚠️ (a) Hurts you more than helps; (b) is neutral but reveals a problem.**  
  - **(a) "Authority-independent rules, but content varies wildly":**  
    - **Why it hurts you:** If the *only* universal is "some rules are authority-independent," but *what* qualifies (purity, debts, harm) is culturally arbitrary, this supports **procedural relativism**. Objectivity requires *contentful* truths (e.g., "harm is wrong *because* it causes suffering"). If "moral" just means "treated as sacred here," it’s not objective.  
    - **Your counter:** You could argue this shows a universal *cognitive category* of "non-arbitrary obligation," implying a shared moral faculty. But the debunker retorts: "So what? If the faculty outputs incompatible rules, it doesn’t track truth."  
  - **(b) "Within-society variation > between-society variation":**  
    - **Why it’s awkward:** This undermines the "cultural determinism" favored by strong debunkers but *also* hurts your structural universality claim. If moral views are fragmented *within* societies, it suggests principles aren’t robustly shared even locally.  
    - **Your defense:** You can reframe this as evidence that moral reasoning is *individual* and sensitive to context (supporting your "application" thesis). But it forces you to weaken "cultural convergence" claims.  

  **⚖️ Verdict:** Structural convergence alone *cannot* save objectivity. If principles lack shared content, it’s like agreeing "science is empirical" while disagreeing on every law of physics.  

  ---

  ### **3. The Causal Question: Transmission vs. Truth-Tracking**  
  **🚫 Potentially fatal if unresolved.**  
  - **What you need:** Evidence that cultural transmission *corrects* toward truth (e.g., societies converge on harm-avoidance as material security increases).  
  - **What would break you:** Proof that moral norms spread via *purely* non-rational mechanisms (e.g., random drift, historical accident, coercive power) with *no* correlation with well-being, cooperation, or other objective grounds.  
  - **Why "transmission story ≠ debunking" is weak:** You’re right that transmission exists regardless of realism. But the debunker demands: *Show transmission is truth-sensitive*. If norms evolve like fashion (arbitrary and path-dependent), not like medicine (correcting errors via feedback), objectivity is irrelevant.  
  - **Key evidence for debunker:** Cases where harmful norms persist despite functional alternatives (e.g., honor killings where legal systems exist) *and* are defended as morally right. Your "different circumstances" excuse fails here.  

  ---

  ### **4. The Nuclear Scenario: Idealized Persistent Disagreement**  
  **🚫 Absolutely fatal if proven coherent and real.**  
  - **Coherence:** Yes, it’s coherent. Imagine two groups agree on all non-moral facts (e.g., pain neuroscience, social consequences) but still disagree on whether suffering *matters* morally. Or whether fairness outweighs loyalty.  
  - **Is it in the record?** Arguably, yes: Fundamental divides (e.g., individualism vs. communitarian duties, animal rights vs. human supremacy) persist among informed, reflective people. Philosophers disagree after centuries of debate!  
  - **Your burden:** You *must* predict this won’t happen (or is extremely rare). If stable disagreement persists under idealization, your "shared principles + application" model collapses.  
  - **Concession:** You can only absorb this by watering down objectivity to near-meaninglessness (e.g., "all rational agents *would* agree if they reasoned perfectly" – but they don’t).  

  ---

  ### **5. Your Personal Vulnerabilities: Incommensurability & Economic Games**  
  **⚠️ You’re half-right, half-wrong.**  
  - **Incommensurability (your "most moved"):** Correct. If a culture lacks concepts like "rights," "consent," or "fairness" (e.g., interprets all relations through power or cosmic balance), your "shared principles" fail. *This is the debunker’s strongest card*.  
  - **Economic games (your "least moved"):** **You have this backwards.** If "WEIRD" games reveal deep variation (e.g., ultimatum game rejections in some societies), it *does* challenge objectivity. Why? Because they *isolate core preferences* (e.g., inequality aversion, spite) in controlled, low-stakes settings. If moral judgments rely on these intuitions, divergence matters.  

  ---

  ### **6. The Methodological Problem: Armchair Intuitions**  
  **⚖️ Your editor is right – this is where you lose.**  
  - **The concession you must make:** Even if objectivity stands, **WEIRD intuitions are junk evidence**. If intuitions vary culturally (and they do), philosophers can’t treat their own as representative.  
  - **Can realism survive without intuitions?** Yes, but it’s harder. Realists might appeal to:  
    - Rational convergence (e.g., contractualism: "all rational agents would agree to principle X").  
    - Natural facts (e.g., harm undermines flourishing).  
  - **Why intuitions and objectivity *don’t* stand/fall together:** Objectivity could be true *even if* current methods fail to access it (like physics before telescopes). But for *moral epistemology*, this is devastating. Philosophers leaning on WEIRD intuitions are like astronomers using only naked-eye observations from Boston.  

  ---

  ### **Summary: Where You’re Strong, Weak, and Broken**  
  - **Strongest:** Your framing of variation as "application + principles" is plausible for mid-level norms (harm, reciprocity). The burden is on debunkers to prove incommensurability (Point 5) or idealized disagreement (Point 4).  
  - **Weakest:** The causal question (Point 3). If moral norms spread arbitrarily, your objectivity is irrelevant.  
  - **Fatal if true:** Idealized disagreement (Point 4) or content-free structural universals (Point 2a).  
  - **Biggest Concession:** You must abandon intuition-based philosophy (Point 6), even if realism holds.  

  **Final Note:** Your "escape hatch" (explaining variation via application) *is* vulnerable to unfalsifiability. To survive, you must: (1) Define *in advance* what counts as a "shared principle" (not ad hoc), and (2) Show these principles *do work* (e.g., predict judgments better than relativist models). Otherwise, it’s just a linguistic trick.  

  If you file this, brace for reviewers demanding: *"Where’s the line between 'application error' and 'no shared principle'? Prove it’s not just noise."* Arm yourself with clear criteria. Good luck.
