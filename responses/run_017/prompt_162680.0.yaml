prompt: |-
  Right, I'm rewriting the handout for my third-year epistemology seminar (the knowledge-and-scepticism bit, just after reading week) and I want to replace the dull page where I set out the tracking conditions and then say "note that closure fails" with something the students will actually argue about. Could you write me a dialogue between two epistemologists who are both, broadly, tracking theorists — they agree the subjunctive conditions are onto something — but who disagree about whether the account can or should be made to respect closure? Call them Nadia and Owen; set it in the ten minutes after a departmental seminar, coffee going cold, one of them leaning on the back of a chair, that sort of thing. Nadia thinks we've been individuating the conditions wrong and wants to index them to the subject's evidence rather than to the target proposition — call it evidence-anchored sensitivity: very roughly, S knows p when, in the nearest worlds in which S has the evidence she actually has and bases her belief on it in the way she actually does, p holds. Owen is the purist: he thinks the whole point is that the condition indexes to the proposition itself, that the closure failures are a prediction rather than a bug, and that Nadia's fix is either vacuous or quietly question-begging.

  The thing I really want them to chew on — and please have them actually chew on it rather than gesturing at it — is that Nadia's move seems to turn entirely on whether evidence is factive. If the evidence she "has" already entails p, then the nearest evidence-worlds are all p-worlds and closure falls out for free; but then the modal condition looks like it's doing no work at all and she's just got an evidentialist theory wearing a subjunctive hat. And if evidence isn't factive, then the hallucination worlds have exactly the same evidence and the closure failure comes straight back. I also want Owen to have a proper go at her about which evidence is doing the anchoring — everything she knows, or just what she's actually relying on in this bit of reasoning — because I think that's where the fix either collapses or turns back into the old method-gerrymandering worry, and I'd like Nadia to have a real reply to that rather than just changing the subject. Give them a concrete case to fight over as well; I've been using this one, but swap it if you've got better: Marianne is in a windowless basement lab reading a barometer and a seismograph that are wired independently, and from what the two of them say plus what she knows about how they're built she deduces that she isn't hallucinating the readouts. Our intuition is that of course she knows that. Owen has to explain either why she doesn't or why that intuition is one we should give up; Nadia has to explain why her view gets it right without also handing Marianne knowledge that she isn't a brain in a vat for free, or else say why that's fine, actually.

  Some ground rules, sorry to be boring: 700–1000 words, both of them equally competent (no stooge for Nadia to demolish), and each turn should answer the thing the other one actually said — I keep loosing track of who's responding to what in these things, so make it obvious. I'd like the disagreement still live at the end, but with each of them having conceded one specific thing and having said what would move them further. No footnotes, no citations, no "as Nozick argues", no bibliographies: they're meant to be arguing, not name-dropping, and I'll be reading it on a train with no signal anyway. If you think I've misdescribed the dialectic somewhere, just quietly fix it instead of adding a correcting note at the end.
