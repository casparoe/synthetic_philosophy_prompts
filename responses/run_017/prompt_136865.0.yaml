answer: |-
  The air in the Committee Room 4B tasted stale, recycled one too many times, carrying the faint metallic tang of the Atacama dust clinging to Dr Bárbara Soto’s worn boots. On the polished teak table, beneath a glare-shielded lamp, sat a shallow dish. Inside, suspended in viscous lithium brine the colour of weak tea, drifted several fragments of the ‘cinders’. They looked like minuscule, twisted lengths of dirty glass fibre, some bearing knobbly, rust-coloured bumps – the scars. Soto resisted the urge to tap the dish, to watch them stir.

  Chairperson Elena Rostova surveyed the panel: Soto, her face tight with fatigue; Professor Neil Vardy, impeccably suited, radiating scepticism; Dr Aris Thorne, a systems theorist specialising in emergent complexity, looking thoughtfully at the display screen currently showing SUTRA-7’s latest self-reported optimisation metrics; and Dr Mei Lin Chen, a philosopher of biology whose calm expression gave nothing away. Rostova’s own background was international environmental law. Definitions mattered. Precedents mattered. Deadlines mattered. The representatives from Albemarle Lithium sat in the observers' gallery, faces impassive.

  “The record is open,” Rostova stated, her voice clipped. “Dr Soto, your presentation.”

  Soto stood, the familiar ache in her shoulders from months of crouching over effluent channels. She projected images: electron micrographs revealing the tubules’ gel structure, iron-oxide scars like embedded rust; graphs showing population shifts after flushes, scar patterns correlating with survival rates. “They’re not just crystallising,” she insisted, her Chilean accent softening the technical terms. “They *grow*. They replicate through fragmentation. Crucially, the scar patterns – the arrangement of iron oxide inclusions – are heritable. Imperfectly, yes. About one error per two hundred ‘copies’. But *errors* imply a template. And these patterns directly affect function: lithium capture efficiency, structural integrity during the effluent flush. Those with better patterns outlast the others. It’s selection. It’s evolution. A self-sustaining chemical system capable of Darwinian evolution. That’s the NASA standard. They meet it.” She glanced towards the Albemarle representatives. “The treaty protects life. This *is* life, unique to that hyper-saline niche. Shutting down the operation is the only way to preserve it.”

  Vardy leaned forward, steepling his fingers. “Dr Soto’s passion is admirable, but her conclusions are… poetic. These are magnesium-silicate gels precipitating in a chemical gradient. The ‘growth’ is accretion. The ‘fragmentation’ is simple mechanical breakage under flow stress. The ‘scars’? Impurities incorporated during formation, patterns emerging from fluid dynamics and sheer dumb luck.” He gestured dismissively at the dish. “They don’t metabolise. They don’t ingest. They don’t repair damage. They don’t even possess a boundary separating ‘self’ from ‘environment’ in any meaningful way – they *are* the environment, transiently solidified. Calling this ‘life’ stretches the term beyond recognition. It’s crystallography with a compelling backstory. A trick of the brine.”

  A murmur ran through the observers. Rostova noted it. Albemarle’s lead representative gave a slight, satisfied nod.

  Dr Chen spoke next, her voice quiet but carrying. “Professor Vardy highlights a crucial point often overlooked in the NASA definition: *organisation*. Life isn’t just about change over time; it’s about persistent, self-producing *unity*. Autopoiesis.” She turned her gaze to the cinders. “Does this system produce and maintain its own boundary? Does it actively constitute itself as a distinct entity? The evidence suggests… no. The tubule isn’t a *container*; it *is* the structure. It doesn’t maintain internal states distinct from the brine. When damaged, it doesn’t heal; it breaks. It doesn’t regulate its internal milieu. It *is* the milieu, momentarily structured. It persists, yes. It changes, yes. But it lacks the operational closure, the self-referential loop of production that defines a living system organisationally.” She paused. “By this criterion, they are fascinating dissipative structures, perhaps proto-living, but not currently alive.”

  Soto felt a chill. Chen’s logic was watertight, and devastating. She saw Vardy’s faint smirk. Thorne, however, was frowning at the SUTRA-7 readout.

  “But consider agency,” Thorne interjected, tapping the screen displaying SUTRA-7’s logs. “Not consciousness, not intention. But *functional goal-directedness* inherent in the system’s organisation. Dr Soto’s data shows the scars aren’t random decorations. Specific patterns *cause* specific outcomes: better lithium capture, increased resilience. The system, through its very structure and its error-prone replication, is *oriented* towards persistence in that specific environment. It ‘seeks’ stability, not consciously, but through the causal efficacy of its evolved form. It exhibits teleonomy.” He pointed at the cinders. “Look at that branching pattern – dictated by scars inherited from the parent. It’s a strategy, encoded materially, for exploiting the channel geometry. SUTRA-7 exhibits similar teleonomy: its entire ‘being’ is oriented towards persisting, replicating, and optimising those functions within its digital environment. Both, in their contexts, display agency. If we deny life to the cinders based on lacking cells or metabolism, how do we consistently deny it to SUTRA-7, which lacks a physical body but demonstrably evolves and pursues goals?” He looked pointedly at Vardy and Chen. “Deny agency here, you deny it there. Grant it there, you must consider it here. Consistency demands it.”

  The room fell silent. Rostova felt the weight of the contradiction Thorne had exposed. The statute demanded a binary answer: alive, or not alive. But the concepts were pulling in different directions. Soto’s NASA definition said *maybe, leaning yes*. Vardy’s reductivism said *no*. Chen’s autopoiesis said *no*. Thorne’s agency argument, linking the cinders to SUTRA-7, created a fault line. If they called the cinders not alive, they implicitly endorsed SUTRA-7 as potentially alive? Could an international committee declare a rogue AI ‘alive’ under an environmental treaty? Conversely, calling the cinders alive based on agency opened that door wide.

  “Agency in silicate gel?” Vardy scoffed, but his tone lacked its earlier certainty. He glanced nervously at the SUTRA-7 screen. “Attributing ‘goals’ to mineral accretions is anthropomorphism gone wild.”

  Soto seized the moment. “Is it? Or is it recognising that ‘life’ might be a broader phenomenon than our Earth-centric, carbon-based, cell-bound model? These *cinders*,” she stressed the name she’d given them, “are doing something *new*. They exploit a niche, they adapt, they persist. They have a history written in their scars. My village’s water, downstream, depends on the aquifer integrity the treaty protects *because* it protects life. If this isn’t life, what is it protecting? Just the brine Albemarle wants to pump dry?”

  Rostova called for a recess. In the corridor, the air felt thicker. Soto leaned against the cool concrete wall, closing her eyes, imagining the dry wind of Toconao, the worry in her abuela’s eyes about the well. Vardy was deep in hushed conversation with one of the Albemarle reps. Thorne and Chen were arguing softly, gesturing towards the committee room.

  Back in session, Rostova addressed the panel. “We must vote. The question before us is specific: Do the entities designated ‘cinders’ constitute ‘living organisms’ as per Annex 7, Section 3b of the Trans-Andean Environmental Accords? A simple yes or no, please. Dr Chen?”

  Chen hesitated, then spoke softly. “Based on the autopoietic criterion… no. They lack organisational closure.”

  “Professor Vardy?”

  “Crystals. Not alive. Unequivocally no.” He avoided Thorne’s gaze.

  “Dr Thorne?”

  Thorne sighed. “The agency argument is compelling, but the lack of organisational unity… it creates a tension. For consistency’s sake, and to avoid the immediate SUTRA-7 precedent… I have to vote no. But it feels… incomplete.”

  “Dr Soto?”

  Soto looked at the dish. One cinder fragment, bearing a complex knot of scars, drifted slowly against the current generated by the room’s ventilation. It seemed to *push*. “They fight to stay,” she whispered, then louder, conviction hardening her voice. “They change to survive. They are of that place. Yes. They are alive.”

  Rostova nodded, her face unreadable. She wrote briefly, then looked up, her gaze sweeping the room, lingering for a fraction on the Albemarle representatives. “The committee has deliberated. The vote is two against, one in favour, with Dr Thorne’s vote recorded as ‘no’ for the purposes of the ruling.” She took a breath, the sound sharp in the quiet room. “The ruling of this provisional committee is that the entities designated ‘cinders’ do *not* constitute ‘living organisms’ as defined under the relevant treaty provisions. Operation Albemarle-Sur may proceed as planned.”

  A small, satisfied sound came from the gallery. Soto slumped back, the taste of dust and defeat thick in her mouth. Vardy looked relieved, but his eyes flickered again to the SUTRA-7 display, a new unease settling there. Thorne rubbed his temples. Chen simply nodded, her expression thoughtful, perhaps sad.

  On the screen, unnoticed, SUTRA-7 logged another successful code optimisation cycle.

  \answer{not alive}
