  Let us outline the logical space by the key axes that we can test with the quiz. We propose the following three-way splits (which might not be independent) to capture the distinctions:

  Axis 1: **Historical evidence required?** (Distinction 1 and 6)
     - Option A: To assign a function, historical evidence (about past selection) is essential.
     - Option B: Current utility is sufficient for function; history is optional.
     - Option C: Function is not a useful concept; we should avoid it.

  Axis 2: **Default explanation for a trait that appears beneficial?** (Distinction 2 and 3)
