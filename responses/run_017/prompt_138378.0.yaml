  Question 2: **Giraffe's recurrent laryngeal nerve**  
  Facts: In giraffes, the recurrent laryngeal nerve takes a detour of several meters down the neck and back up, rather than taking a direct route, because it evolved from a shorter-necked ancestor where the detour was minimal.  
  Question: How would you explain the persistence of this inefficient detour?  
  Options:  
