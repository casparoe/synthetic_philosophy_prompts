  We are building a diagnostic quiz to sort people by their views on adaptationism without using taboo words in the options. We start by brainstorming the logical space based on the key distinctions provided.

  The key distinctions (each a spectrum or set of positions) are:

  1. **Historical vs. Current Role**: 
     - A: The function of a trait is about its historical selection (selected-effects).
     - B: The function is about its current causal role, regardless of history (causal-role).
     - Note: This distinction affects whether evidence about the past is necessary.

  2. **Default Hypothesis**:
     - A: Drift/near-neutrality is the null; selection must be proven.
     - B: Selection is the default; drift is only considered when selection fails.
     - C: Other (e.g., no default, or context-dependent).

  3. **Optimality Model Interpretation**:
     - A: Literal: the model reflects reality (organisms are near optimal).
     - B: Instrumental: the model is a tool to find constraints and deviations.
     - C: Reject: optimality models are misleading or useless.

  4. **Developmental/Structural Biases**:
     - A: Independent: biases have causal standing and are not reducible to past selection.
     - B: Downstream: biases are themselves products of past selection.
     - C: Reject: biases are not a major factor.

  5. **Type of "Why" Question**:
     - A: Why the trait arose (origin).
     - B: Why it spread (spread).
     - C: Why it persists (maintenance).
     - D: Different answers at different grains (molecular, developmental, morphological).

  6. **Empirical Adjudication**:
     - A: The debate is empirically testable (e.g., with comparative methods, experimental evolution).
     - B: The debate is largely untestable; it's a choice of research program.

  We also note that the grain of analysis (molecular, developmental, morphological) might interact with these distinctions.

  Now, we must map these distinctions to the desired leaves (positions) and see which combinations are coherent and which are empty.

  Desired leaves (with brief definitions):

  1. **Strong empirical adaptationism**: Selection is powerful; most traits are locally optimal.
  2. **Optimality-model instrumentalist**: Optimality models are tools to find constraints.
  3. **Adaptationism as heuristic reverse engineering**: Use adaptationist thinking as a heuristic to reverse engineer how traits work.
  4. **Test adaptationism by trying to break it**: Actively try to falsify adaptationist hypotheses to find where they fail.
  5. **Gould-Lewontin pluralism**: Emphasize spandrels, architectural by-products, and constraints.
  6. **Exaptation-first view**: Traits are often co-opted for new functions; original function may be irrelevant.
  7. **Structuralist / developmental-bias view**: Focus on developmental constraints and biases as key to the arrival of the fittest.
  8. **Niche-construction or developmental-systems pluralism**: Organisms modify their environments, creating feedback loops; development and environment are intertwined.
  9. **Neutralist or drift-default**: Treat drift as the null; especially for molecular evolution, but may distinguish between levels.
  10. **Deflationist**: Function-talk is only about current utility; historical questions are ill-posed or irrelevant.
  11. **Sceptic**: The debate is mostly untestable storytelling on both sides.

  We must also note that some of these might collapse together.

  Now, we consider how the distinctions relate to the leaves:

  - Distinction 1 (Historical vs. Current) is central to the deflationist (current only) and to the exaptation view (which emphasizes historical change).
  - Distinction 2 (Default) is key for neutralist (drift default) and strong adaptationism (selection default).
  - Distinction 3 (Optimality) is key for strong adaptationism (literal) and instrumentalist (instrumental). The latter might also be the "test by breaking" view.
  - Distinction 4 (Biases) is central to structuralist (independent) and Gould-Lewontin pluralism (which also includes constraints). The view that biases are downstream of selection would be compatible with adaptationism.
  - Distinction 5 (Why) might be handled by the exaptation view (arose for one reason, now persists for another) and by the deflationist (only current). The grain issue is important for neutralist (molecules vs. morphology).
  - Distinction 6 (Testable) is the sceptic's view.

  We now try to assign the leaves to combinations of the distinctions. However, note that the distinctions are not independent and we have six distinctions each with multiple options, so the logical space is large. We must collapse to the most salient.

  Instead, we can define the leaves by their answers to a set of core questions (which we will later turn into quiz questions). We design the quiz to capture the key commitments.

  We are also required to have at least four empty cells and to note why.

  We must create 10 questions, each with 3 options, and then a scoring key that maps answer patterns to 10-14 leaves. We are to use concrete cases.

  We are given a list of cases to draw from, and we must add two compound cases.

