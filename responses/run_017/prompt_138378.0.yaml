  ### Logical Space Brainstorming  
  I begin by outlining the logical space based on the six core distinctions you specified. Each distinction represents a fundamental axis of disagreement in the adaptationism debates. I map these onto binary or ternary choices to capture the spectrum of views, then identify coherent combinations. The goal is to define positions by their commitments to these distinctions, not by pre-existing labels. Only then will I assign labels to the occupied cells.  

  #### Core Distinctions and Possible Values:  
  1. **Historical vs. Current Role of Trait (H/C)**:  
     - H: Function requires historical evidence of past selection (selected-effects).  
     - C: Function is defined by current utility alone; history is irrelevant (causal-role).  
     - *Note: "Function" here refers to the explanation for why the trait exists.*  

  2. **Default Hypothesis (Default)**:  
     - S: Selection is the default; drift/constraint is a fallback only after optimality models fail.  
     - D: Drift/near-neutrality is the null; selection must be proven against this baseline.  
     - *Note: Includes structural constraints as part of the "drift/constraint" null when not explicitly adaptive.*  

  3. **Optimality Model Interpretation (Opt)**:  
     - L: Literal: Models reflect reality; traits are near-optimal given constraints.  
     - I: Instrumental: Models are tools to reveal constraints; failures guide research.  
     - R: Rejected: Models are misleading; avoid them entirely.  

  4. **Developmental/Structural Biases (Bias)**:  
     - I: Independent: Biases have causal power not reducible to past selection.  
     - D: Downstream: Biases are products of past selection; not a separate cause.  
     - *Note: "Biases" include mutational, developmental, or architectural constraints.*  

  5. **Type of "Why" Question (Why)**:  
     - O: Why the trait originated (arose).  
     - P: Why the trait persists (maintained).  
     - G: Grain-dependent: Answers differ across molecular, developmental, and morphological levels.  

  6. **Empirical Adjudication (Test)**:  
     - E: Empirically testable with methods like comparative phylogenetics or experimental evolution.  
     - U: Untestable storytelling; a choice of research program, not evidence.  

  #### Logical Combinations and Coherence:  
  - **Total theoretical space**: 3 (H/C) × 2 (Default) × 3 (Opt) × 2 (Bias) × 3 (Why) × 2 (Test) = 216 possible combinations.  
  - **Incoherent combinations (4+ empty cells)**:  
    - `H/C=C + Why=O`: Incoherent. If history is irrelevant, asking "why it originated" is ill-posed. (1 cell)  
    - `Opt=R + Default=S`: Incoherent. If optimality models are rejected, selection cannot be the default. (1 cell)  
    - `Bias=D + Opt=R`: Incoherent. If biases are downstream of selection, rejecting optimality models contradicts their selective origin. (1 cell)  
    - `Test=U + Why=G`: Incoherent. Grain-dependence requires empirical tests at different levels; untestability precludes this. (1 cell)  
  - **Unattractive/rare combinations**:  
    - `H/C=H + Test=U`: Untestable historical claims are self-undermining; no adherents. (1 cell)  
    - `Default=D + Opt=L`: Inconsistent. Drift-as-default conflicts with literal belief in optimality. (1 cell)  
  - **Unexplored combinations**:  
    - `Why=O + Bias=I + Test=U`: Origin-focused, bias-independent, but untestable. The literature assumes testability for such claims. (1 cell)  
  - **Live combinations**: 12 coherent, occupied positions emerge (detailed below).  

  #### Occupied Positions (Leaves):  
  From the coherent cells, I derive 12 distinct leaves by clustering combinations with identical practical commitments. Each leaf is defined by its values across the six distinctions:  
  1. **Leaf 1**: `(H, S, L, D, P, E)` → Strong empirical adaptationism.  
  2. **Leaf 2**: `(H, S, I, D, P, E)` → Optimality-model instrumentalist.  
  3. **Leaf 3**: `(C, S, I, D, P, E)` → Adaptationism as heuristic reverse engineering.  
  4. **Leaf 4**: `(H, S, I, I, P, E)` → Test adaptationism by trying to break it.  
  5. **Leaf 5**: `(H, D, R, I, G, E)` → Gould-Lewontin-style pluralism.  
  6. **Leaf 6**: `(H, D, I, I, O, E)` → Exaptation-first view.  
  7. **Leaf 7**: `(H, D, R, I, P, E)` → Structuralist/developmental-bias view.  
  8. **Leaf 8**: `(C, S, I, I, P, E)` → Niche-construction/developmental-systems pluralism.  
  9. **Leaf 9**: `(H, D, R, D, G, E)` → Neutralist/drift-default (grain-dependent).  
  10. **Leaf 10**: `(C, -, -, -, P, E)` → Deflationist (only current utility matters).  
  11. **Leaf 11**: `(-, -, -, -, -, U)` → Sceptic (untestable storytelling).  
  12. **Leaf 12**: `(H, S, I, D, G, E)` → Optimality instrumentalist with grain-dependence (hybrid).  

  #### Collapses and Notes:  
  - **"Adaptationism as heuristic reverse engineering" (Leaf 3) and "Optimality-model instrumentalist" (Leaf 2) collapse** in this instrument because both share `Opt=I` and `Test=E`, and their answers to all questions are identical. I merge them into Leaf 2.  
  - **"Niche-construction pluralism" (Leaf 8) and "developmental-systems pluralism" collapse** because both prioritize current utility and bias-independence similarly.  
  - **The instrument cannot separate "Gould-Lewontin pluralism" (Leaf 5) and "Structuralist view" (Leaf 7)**. Both answer identically; their differences in emphasis (spandrels vs. constraints) do not yield distinct testable predictions here.  
  - **Total leaves after collapses**: 10.  

  #### Most Awkward Commitments per Leaf:  
  - **Leaf 1 (Strong empirical adaptationism)**: Must swallow that traits are near-optimal even when they appear suboptimal (e.g., giraffe nerve).  
  - **Leaf 2 (Optimality-model instrumentalist)**: Must accept that optimality models can be "useful lies" with no literal truth.  
  - **Leaf 4 (Test adaptationism by breaking it)**: Must embrace that constraints are often found, making selection less central than assumed.  
  - **Leaf 5 (Gould-Lewontin pluralism)**: Must downplay demonstrable selection in clear cases (e.g., sickle-cell).  
  - **Leaf 6 (Exaptation-first view)**: Must explain why current utility is insufficient without historical co-option stories.  
  - **Leaf 7 (Structuralist/developmental-bias view)**: Must defend that biases are irreducible even when selective explanations exist.  
  - **Leaf 8 (Niche-construction pluralism)**: Must justify ignoring historical origins when they are testable.  
  - **Leaf 9 (Neutralist)**: Must argue drift applies to morphology when evidence for selection is strong (e.g., cavefish).  
  - **Leaf 10 (Deflationist)**: Must reject historical questions even when direct evidence (e.g., fossils) is available.  
  - **Leaf 11 (Sceptic)**: Must dismiss empirical methods as futile in principle.  

