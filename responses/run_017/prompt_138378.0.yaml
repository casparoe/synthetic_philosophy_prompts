  Axis 3: **Response when an optimality model fails?** (Distinction 3 and 4)
     - Option A: Revise the model (e.g., add constraints) until it fits; the organism is near optimal.
     - Option B: The failure points to non-adaptive explanations (like constraints or drift).
     - Option C: The model was never expected to work; we use other methods.

