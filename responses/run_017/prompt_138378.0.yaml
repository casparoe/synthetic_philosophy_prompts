  Options:  
  A. Measure its current benefits (e.g., in resisting stress during chewing or in social signaling) and see if they are substantial.  
  B. Look for evidence of selection in the fossil record or genetic data, comparing to ancestors.  
  C. Study the developmental processes that form the chin and see if it arises as a necessary consequence of other facial structures.  

