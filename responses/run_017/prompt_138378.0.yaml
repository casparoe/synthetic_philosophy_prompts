  3. Giraffe's recurrent laryngeal nerve detour
  4. Inverted vertebrate retina vs. octopus eye
  5. Seven cervical vertebrae in mammals
  6. Eye and pigment loss in cave populations
  7. Fraction of genome that is inert
  8. Sickle-cell allele and malaria
  9. Peacock's train
  10. Independent evolution of camera eyes

  We also add two compound cases.

  Now, we design the questions. Each question must have the facts stated inline and be phrased as a prediction or expectation.

  We structure the quiz to cover the distinctions. We are not to use taboo words in options.

