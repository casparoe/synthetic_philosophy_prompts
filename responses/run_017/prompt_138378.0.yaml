  5. **Gould-Lewontin pluralism**:
     - Historical: Selected-effects are not the only story
     - Default: Drift/constraint as default? (B)
     - Optimality: Reject or instrumental? They are critical, so might be C or B (failure points to non-adaptive). They emphasize constraints.
     - Biases: Independent (A)
     - Why: Multiple reasons, including constraints
     - Testable: Yes, but plural

  6. **Exaptation-first view**:
