  ### Diagnostic Instrument: "What's Your Evolutionary Inference Style?"  
  **Instructions**: Below are 10 concrete cases. For each, choose the option that best reflects your expectation or approach. Do not overthink; go with your instinct. Avoid labels—focus on predictions. Facts are provided; no prior knowledge needed. 

  #### Questions:  
  1. **Human Chin**: Humans have a bony chin not found in ancestral primates. It may aid in speech or be a by-product of jaw reduction. *Before examining historical evidence, what would you do?*  
     A. Measure its current stress resistance during chewing to see if it provides a clear benefit.  
     B. Compare fossil jaws to trace when it appeared and check for selection signatures.  
     C. Study embryonic jaw development to see if it arises automatically from growth patterns.  

  2. **Cavefish Eye Loss**: In isolated caves, fish populations lose eyes and pigment. *When comparing genetic causes across caves, you expect:*  
     A. Different mutations each time, suggesting selection against eyes in darkness.  
     B. Similar mutations, suggesting a shared developmental bias making eye loss easy.  
     C. No consistent pattern, as if changes were neutral and drift-driven.  

  3. **"Junk" DNA**: In mammals, >90% of the genome doesn't code for proteins. *How do you interpret this?*  
     A. Most is functional (e.g., gene regulation); we just haven't found the roles yet.  
     B. Most is non-functional "noise," accumulating neutrally without cost.  
     C. It reflects historical functions now defunct, preserved by inertia.  

  4. **Giraffe Nerve Detour**: The giraffe's laryngeal nerve takes a 4-meter detour due to ancestral anatomy. *How do you explain its persistence?*  
     A. The detour is constrained by development; selection can't shorten it without trade-offs.  
     B. Costs are low, and other nerve functions are optimized; the detour is near-optimal.  
     C. No strong selection against it; the detour is neutral or nearly so.  

  5. **Sickle-Cell Allele**: In malaria regions, a harmful allele persists because it confers resistance when heterozygous. *How do you describe its role?*  
     A. Its main effect is to cause disease; resistance is a side benefit.  
     B. Its function is malaria resistance, explaining its prevalence.  
     C. It has no purpose; it's a balanced fluke of mutations.  

  6. **Camera Eye Evolution**: Vertebrates and octopuses independently evolved camera eyes, but vertebrates have a "backward" retina with a blind spot. *What does this imply?*  
     A. Selection finds optimal solutions; differences reflect unique selective paths.  
     B. Physical/developmental constraints limit design options, causing suboptimal quirks.  
     C. Random events dominate; similarities and differences are drift-driven.  

  7. **Panda's "Thumb"**: Pandas use a wrist bone for grasping bamboo, not a true digit. *How do you explain its form?*  
     A. It is optimal for bamboo handling given panda anatomy.  
     B. It is a suboptimal workaround forced by limited developmental flexibility.  
     C. It is a random mutation that happened to be useful.  

  8. **Peacock's Train**: The showy tail attracts mates but increases predation risk. *How would you test its significance?*  
     A. Measure current mating gains versus survival costs in the wild.  
     B. Check for historical selection by comparing tail sizes in fossils or related birds.  
     C. Examine genetic correlations in development that make such trains easy to evolve.  

  9. **Compound Case 1: Ancient Coral Symbiosis**: A coral species hosts algae that provide nutrients. Current selection maintains this, but fossils show the trait predates algae in its habitat. Mutational studies reveal a bias toward symbiotic mutations. *How do you explain it?*  
     A. It originated for another function (e.g., toxin resistance) and was co-opted; the bias is a constraint shaping co-option.  
     B. It is now optimized for symbiosis; the bias results from past selection for flexibility.  
     C. Current utility is clear; the origin is untestable without close relatives.  

  10. **Compound Case 2: Extinct Whale Flipper**: An extinct whale had rigid flippers for fast swimming. Fossil evidence shows strong selection for speed, but developmental studies in dolphins reveal biases limiting flipper shape variation. No close relatives survive. *How do you infer why flippers evolved?*  
      A. Model optimal flipper shapes for swimming and compare to fossils.  
      B. Infer from developmental biases in living whales, assuming constraints dominated.  
      C. Without relatives, we cannot distinguish adaptation from constraint; it's unanswerable.  

