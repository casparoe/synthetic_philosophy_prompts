prompt: |-
  Longtime lurker here. Me and three other people from the usual corners of the internet have decided to blow roughly a year of spare evenings on building what we're jokingly calling a pump-debugging kit: a small, public, actually-usable toolkit for taking a thought experiment that everyone deploys as a conversation-stopper and working out how much of its persuasive force is doing real work rather than rhetorical work. Think trolley variants, teleportation and fission setups, experience-machine and zombie-style arguments, torture-vs-dust-specks things, infinite-ethics monsters.

  We've sketched four components and I want a defended ordering before we sink the year in:

  1. Framing rotation — rerun the same case with the features the theory itself says are irrelevant swapped around (first person vs. third, order the cases are presented in, how much concrete sensory detail there is, the scale, whether it's a lever or a button or a spoken command, hospital vs. spaceship vs. subway). Log which verdicts flip.
  2. Carry distance — walk the case away from the original one step at a time (asymmetric versions, iterated versions, versions where the mechanism is explained vs. left mysterious) and see where people stop giving "the same" answer, and whether the decay is smooth or a cliff.
  3. Identification swap — replace the person you're invited to imagine being with someone you're much less primed to identify with: a stranger of a different age and background, a far-future person, an AI, yourself twenty years from now. Hypothesis: a lot of pumps are secretly powered by self-insertion, and nobody notices because the self-insertion is the default.
  4. The ledger — a public table per pump: which transformations flip it, which don't, and what people claim the point of the pump actually is.

  So: which of these is upstream of which, and which would you tell four unaffiliated amateurs with no budget, no IRB, and no ability to run anything bigger than a forum poll to build first? I care about the criteria and the trade-offs — tractability, neglectedness, how much of the rest depends on it — not just your gut ranking. What would you deprioritize as overrated: big-n intuition surveys, trying to settle in advance whether intuitions are evidence at all, formalizing everything as causal graphs? And what concrete result over the next six months would move something up or down your list?

  Two more things I want folded in. First, which family of cases should be the training ground, given that "best for developing the method" and "most likely to actually change someone's mind once the method works" probably point different directions. Second, the failure mode I'm most worried about is our kit turning into a license to dismiss any thought experiment you already disliked — "your pump is fragile, therefore it doesn't count." Is the reveal-vs-manufacture distinction salvageable, or is settling that a distraction from just grinding out the tables? No surveys of the literature and definitly no reading list — give me your own ordering and defend it.
reasoning: |-
  Okay, the user is part of a group building a "pump-debugging kit" to analyze thought experiments. They have four components and need to prioritize them. Let me start by understanding their main goals.

  First, they want to know which component to build first. The criteria are tractability (ease of implementation), neglectedness (how much it's been overlooked), and dependency (how foundational it is). They’re amateurs with no budget, so simplicity is key. Also, they want to avoid their tool becoming a way to dismiss unwanted thought experiments.

  Looking at the components:
  1. Framing rotation: Swaps irrelevant details like perspective or setting to see if judgments change. This seems straightforward—changing wording in scenarios and polling forums. It’s low-cost and tests if superficial changes flip answers. Since it’s about isolating irrelevant factors, it might be the easiest to start with.
     
  2. Carry distance: Gradually modifies the scenario to see where intuitions shift. This requires creating multiple variants, which could get complex. Maybe it’s more involved than framing but could build on it.

  3. Identification swap: Changes who the subject is (e.g., different person, AI). This challenges self-insertion bias. Interesting, but might need more nuanced scenarios. Could be harder to design without influencing other factors.

  4. The ledger: A public table tracking results. This is a compilation tool, so it depends on data from the others. Building it first without data might not be useful. Probably should come later.

  Tractability is crucial. Framing rotation seems simplest—just tweak existing pumps and poll. Carry distance requires more variants, which is more work. Identification swap might need careful design to avoid confounding variables. Ledger needs data, so it’s last.

  Neglectedness: Most pump analyses focus on big surveys or formal logic. Framing effects are studied but maybe not systematically in philosophy. Identification is under-explored, but harder to implement. Starting with framing allows them to get quick results.

  Dependency: Framing provides foundational data. If intuitions flip on irrelevant details, that questions the pump's robustness. This can inform carry distance (how far to walk) and identification (if self-insertion affects results). Ledger organizes findings.

  Training ground: Trolley problems are familiar, making them good for method development. They’re simple but varied. Dust specks vs torture has scale issues, which framing could test. Start with trolleys for tractability.

  Failure mode: To avoid the kit being used to dismiss pumps, emphasize documenting which changes actually matter per the pump's purpose. Framing helps identify irrelevant factors, so if a pump flips on those, it's a legit critique. The ledger should track the pump's claimed point to prevent misuse.

  Concrete results: If framing shows flips in trolley variants within six months, that validates the approach. Then move to carry distance. If not, maybe identification is next.

  Prioritize framing first as it’s tractable, foundational, and can show quick wins. Then carry distance, identification, and finally the ledger as a synthesis tool. Deprioritize big surveys and formal models; focus on empirical tests with existing pumps.
answer: |-
  Here’s a defended prioritization based on your constraints (no budget, forum polls, amateur team), goals (tractability, neglectedness, dependency), and failure-mode concerns:

  ### **Priority Order & Rationale**
  1. **Framing Rotation (First)**  
     - **Tractability**: Easiest to implement. Modify existing pumps (e.g., trolley lever → voice command; hospital → spaceship) with minor wording changes. Run as forum polls.  
     - **Neglectedness**: Rarely tested systematically. Philosophers handwave "irrelevant details," but your data could prove which actually flip judgments.  
     - **Dependency**: Foundational. Reveals *if* a pump is fragile *before* testing why (carry distance/ID swaps). If framing doesn’t flip verdicts, other tests may be redundant.  
     - **Failure-mode armor**: Directly addresses "rhetorical work" by isolating surface features. Ledger entries here prevent dismissal of *robust* pumps.  

  2. **Carry Distance (Second)**  
     - **Tractability**: Requires iterative variants (e.g., trolley → 1,000-trolley cascade → asymmetric harm tradeoffs). More work than framing but feasible via polls.  
     - **Neglectedness**: Often ignored in favor of binary "intuition checks." Mapping decay/cliffs exposes hidden thresholds (e.g., when utilitarianism "breaks").  
     - **Dependency**: Builds on framing data. If framing flips verdicts, carry distance tests *how far* you can push a pump before collapse.  
     - **Key trade-off**: Resource-intensive (many variants). Start with 2–3 pumps showing framing fragility.  

  3. **The Ledger (Third)**  
     - **Tractability**: A living wiki/table synthesizing results. Low technical effort; depends entirely on data from #1–2.  
     - **Neglectedness**: No central repository for pump fragility. Publicly crowdsourcing entries forces clarity on "the point" of each pump.  
     - **Dependency**: Must come after #1–2 to avoid empty scaffolding.  
     - **Failure-mode armor**: Documents *claimed purposes* of pumps upfront (e.g., "this pump targets deontological leeway"). Prevents misuse by anchoring critiques to intent.  

  4. **Identification Swap (Last)**  
     - **Tractability**: Hardest. Requires nuanced vignettes (e.g., "you vs. an AI copy of you vs. a 25th-century colonist"). Forum polls struggle with immersion.  
     - **Neglectedness**: Underexplored, but riskier. Self-insertion bias is hypothesized, but proving it needs rigorous controls (e.g., avoiding conflation with framing effects).  
     - **Dependency**: Must follow framing tests to isolate ID effects from narrative artifacts.  
     - **Overrated?**: Yes, if rushed. Poorly designed ID swaps can muddy results (e.g., changing "you" to "AI" may introduce tech-fear confounds).  

  ---

  ### **What to Deprioritize**  
  - **Big-N surveys**: Overrated for you. Requires IRB, stats expertise, and scale you lack. Forum polls with 50–100 engaged users per variant suffice for fragility *patterns*.  
  - **"Are intuitions evidence?" debates**: A distraction. Your goal is *debugging pumps*, not validating philosophical epistemology. Stick to mapping fragility.  
  - **Causal graphs**: Overengineered. Your components *are* the diagnostic framework — tables and decay plots are more accessible.  

  ---

  ### **Training Ground Cases**  
  - **Best for method development**: **Trolley variants**.  
    - Why: Simple, widely known, easy to modify (framing: lever/button; carry: 1 vs. N iterations; ID: self/stranger/AI). Lets you stress-test the kit fast.  
  - **Best for changing minds**: **Dust specks vs. torture** (or similar scale paradoxes).  
    - Why: Polarizing, high-stakes, and framing/ID swaps could reveal if opposition hinges on visceral scale neglect or mistrust of aggregative ethics.  

  **Start with trolleys** to refine the kit, **then hit dust specks** for impact.  

  ---

  ### **Killing the Failure Mode**  
  - **Salvage the reveal-vs-manufacture distinction** by:  
    1. Using the ledger to **record the pump’s claimed purpose** (e.g., "demonstrates agent-relativity").  
    2. **Only flag fragility when changes alter verdicts *on the pump’s own terms***. If framing flips a "deontology test" but not a "consequentialism stress test," note that.  
    3. **Require fragility in *multiple* components** to dismiss a pump (e.g., framing flips + carry cliffs).  
  - **Grind tables first**. Debating "manufacture" pre-data is philosophy-as-usual. Let the ledger show which pumps break under which operations.  

  ---

  ### **Concrete 6-Month Win**  
  - **Success metric**: Run framing rotation on 3 pumps (e.g., trolley, experience machine, dust specks). If ≥1 shows verdict flips in >30% of participants when "irrelevant" features change, you’ve validated the core premise.  
  - **What moves identification up**: If framing/carry data shows consistent "self-bias" patterns (e.g., verdicts flip hardest when "you" is removed), prioritize ID swaps next.  

  ---

  ### **Final Order & Why**  
  **Framing → Carry Distance → Ledger → Identification**  
  - **Why this sequence**: Framing is the cheapest, fastest test of whether pumps are *even worth* deeper debugging. If a pump survives framing, invest in carry distance to probe its limits. The ledger turns data into public infrastructure. ID swaps come last — they’re powerful but need careful setup to avoid noise.  
  - **Maximizes leverage**: Framing results (e.g., "hospital vs. spaceship flips trolley verdicts") could immediately challenge pump-based arguments online, even as a beta product.  

  **NEXT STEP**: Draft 3 framing variants for the trolley problem (e.g., lever/button/voice command; subway/spaceship) and run a pilot poll *this month*. If verdicts flip, you’ve already broken ground.
