prompt: |-
  hey — I'm a staff engineer at a mid-size company, no philosophy background at all. I got into this through a Hacker News thread about big rewrites were someone cited Lakatos, and now I'm stuck with the job of fixing how we make platform decisions.

  Every quarter there's an architecture review where my team has to decide, for each of our long-running internal systems, whether to keep funding it, freeze it, or kill it and migrate off. Right now it's vibes, sunk cost, and whoever argues hardest in the room.

  The bit of Lakatos I've absorbed (hard core, protective belt, positive vs negative heuristic, progressive vs degenerating problem shifts, and the thing where a patch that only mops up an anomaly you already had counts as degeneration instead of progress) feels like it maps onto this almost too well. But I only have the blog-post version, and I can't turn it into something four senior engineers will sit still for in a 90 minute meeting. They'll walk out if I say heuristic.

  So: give me a decision procedure we can actually run in that meeting. Ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands off to a human because the question is really about values not facts. It has to be usable by people who've never heard of Lakatos — say the concepts in engineer words, but don't water out the distinctions that are doing the actual work, and tell me which ones you dropped and why.

  Hard cases I specifically need it to handle:

  One, our protective belt is mostly config flags, compat shims and feature gates, so there's no such thing as a crucial experiment and our metrics are noisy (weekly A/B tests, effects in the 2-3% range, plus a north-star metric that drifts on its own for reasons nobody understands). How do we tell an honest belt adjustment from an immunizing stratagem under those conditions?

  Two, I want a pre-registration rule: a predicted win only counts as a novel fact if somebody wrote the prediction down before the data landed, otherwise it's accommodation after the fact. Tell me who has to write it down and where, because I'm fairly sure this becomes a rubber stamp if I let the team that owns the system self-certify.

  Three, sometimes the thing we're protecting isn't a technical claim at all, it's a business or compatibility commitment — like we must stay wire-compatible with the on-prem install base forever. That's protected by fiat, so nothing can ever falsify it. Does that need a fourth verdict besides keep / freeze / kill, and if so what is it and who signs off?

  Four, I keep reading that for Lakatos there's no instant rationality, that you can't fairly judge a programme at a single moment and degeneration only shows up in hindsight. If that's right, bake a time window into the procedure: how many quarters of degeneration before we pull the plug, and is there a case were the right answer is to keep funding something that's currently degenerating?

  Then run it on three of our actual situations: a nine-year-old Python 2 search monolith with about forty compat flags that recently predicted a latency win on a new index format and then hit it; an eighteen-month-old ML feature platform that ships constantly and whose team can always explain last quarter's improvements but never called them in advance; and our billing service, which has to reproduce invoices byte-for-byte from 2016 onward and will have to until the law changes. At least one of these should produce an answer I don't like — say so when it does.

  Finish by being straight about what the procedure can't do and where it'll misfire on us.

  Two formatting things: lead with the bottom line in your first sentence — the procedure in a nutshell plus the call on all three systems — and only then give the reasoning, no preamble and no restating my question. And please don't give me citations, links or a reading list; I'm not going to read the books, and I need this to stand on its own for people who definitely won't.
reasoning: |-
  We are going to design a decision procedure called the "Core Commitment Review" (CCR) that structures the evaluation of each system around its central promises and their health. The procedure in a nutshell: for each system, we'll (1) state its Core Commitment (what it fundamentally promises), (2) check if the commitment is still valid, (3) assess the Protective Measures (flags, shims, etc.) for honesty and effectiveness, (4) evaluate the system's recent progress (using pre-registered predictions), and (5) make a decision (keep, freeze, kill, or exempt). 

  Applying it to your three systems:
  - The Python 2 search monolith: **freeze** (despite a valid win, it's degenerating due to high complexity and risk).
  - The ML feature platform: **keep** (active progress, but require pre-registration going forward).
  - The billing service: **exempt** (due to immutable legal commitment).

  Now, the detailed procedure:

  ### CCR Procedure Steps

  1. **State the Core Commitment (5 mins per system)**
     - *Question:* "What is the one thing this system must do above all else? What would break if this changed?"
     - *Sufficient answer:* A clear, testable statement of the system's primary purpose and its non-negotiable constraints (e.g., "Process search queries with <100ms latency at 99.9%ile" or "Generate byte-identical invoices for all historical contracts").
     - *Stop if:* The team cannot articulate a Core Commitment. This forces a kill/freeze discussion immediately (a system without a clear core is adrift).
     - *Hard case handling (business commitments):* If the commitment is a fixed business/legal rule (e.g., wire compatibility), note it as "protected by fiat." This doesn't stop the procedure but flags it for exemption later.

  2. **Validate the Commitment (10 mins)**
     - *Question:* "Is this commitment still relevant to the company? What happens if we break it?"
     - *Sufficient answer:* Evidence of current business impact (e.g., churn risk, revenue dependency, SLA penalties) or legal requirement. If protected by fiat, skip to Step 5.
     - *Stop if:* The commitment is obsolete (e.g., no customers rely on it). Decision: **kill** (migrate off).

  3. **Audit Protective Measures (15 mins)**
     - *Question:* "What adjustments (flags, shims, etc.) were made last quarter to protect the core? Were they reactive patches or proactive improvements?"
     - *Sufficient answer:* List specific changes and link them to anomalies (unexpected issues) or predicted wins.
     - *Key distinction (immunizing stratagem vs. honest adjustment):* 
       - **Honest adjustment:** Fixes a *new* problem or unlocks a *new* capability without increasing complexity (or reduces it). Example: A shim that removes technical debt while maintaining compatibility.
       - **Immunizing stratagem:** Only explains away a known flaw or adds complexity to avoid confronting a core limitation. Example: A new flag to disable a broken feature that nobody uses.
     - *Noisy metrics caveat:* Focus on the *nature* of the change, not just metrics. If a change only addresses old, known issues without new predictions, it’s suspect.
     - *Stop if:* All adjustments are immunizing stratagems. This suggests degeneration. Proceed to Step 5 for decision.

  4. **Assess Progress (20 mins)**
     - *Question:* "What novel, pre-registered wins did the system deliver last quarter? What unexpected losses occurred?"
     - *Pre-registration rule:* 
       - **Requirement:** Predictions must be written in a shared engineering log *before* work starts (not after results are in). 
       - **Who:** The team proposing the change must document it. A neutral platform/infra team (not the system owners) verifies timestamps.
       - **Rubber-stamp prevention:** Log entries must include: (a) the expected outcome, (b) how it expands the system’s capabilities (e.g., "Reduce index build time by 15%"), and (c) the metric tracked.
     - *Sufficient answer:* At least one pre-registered win that delivered a *novel* improvement (not just mopping up an anomaly). If no wins, but no losses either, the system is stable but stagnant.
     - *Stop if:* Unexpected losses (regressions) without pre-registered wins. This is degeneration. Proceed to Step 5.

  5. **Make the Decision (10 mins)**
     - *Options:*
       - **Keep:** The commitment is valid, and the system delivered pre-registered wins (progressive).
       - **Freeze:** The commitment is valid, but the system is stagnant (no wins/losses) or degenerating (immunizing patches, unexpected losses). Freeze new features; only fund maintenance.
       - **Kill:** The commitment is obsolete or the system is irredeemably degenerating (e.g., multiple quarters of degeneration, no path to progress).
       - **Exempt:** The commitment is protected by fiat (e.g., legal) and cannot change. Requires CTO/legal sign-off. Exempt systems skip future reviews but must report stability.
     - *Time window for degeneration:* If a system shows degeneration (Step 4) for **2 consecutive quarters**, default to **freeze**. After **4 quarters**, default to **kill** (unless a credible recovery plan exists).
     - *Edge case (funding degeneration):* Only if the system is exempt or has a high-cost migration (e.g., billing). Document risks and escalate.

  ### Running Your Cases

  1. **Python 2 search monolith**
     - *Core Commitment:* "Deliver relevant search results in <200ms latency at p99."
     - *Validation:* Still relevant (core revenue driver).
     - *Protective Measures:* Many flags/shims. The new index format win is valid (pre-registered latency win hit), but the 40+ flags are immunizing stratagems (they add complexity to avoid Python 3 migration).
     - *Progress:* One win (index format), but surrounded by degeneration (flags). Unexpected outages last quarter.
     - *Decision:* **Freeze.** Despite the win, the weight of immunizing patches and legacy risk (Python 2) suggests degeneration. No more new features; plan migration.

  2. **ML feature platform**
     - *Core Commitment:* "Enable fast iteration and deployment of ML features with no regression in model accuracy."
     - *Validation:* Relevant (supports key products).
     - *Protective Measures:* Regular feature gates and tests. Adjustments are proactive (e.g., new validation tools).
     - *Progress:* Frequent improvements, but **no pre-registered wins** (team explains after the fact). This is degeneration-by-default under our rule.
     - *Decision:* **Keep** *with a requirement.* The system is clearly progressing, so we don’t kill it, but enforce pre-registration next quarter. If they fail to pre-register, it becomes a freeze candidate.

  3. **Billing service**
     - *Core Commitment:* "Generate byte-identical invoices for all contracts since 2016."
     - *Validation:* Protected by fiat (legal requirement). Cannot change.
     - *Protective Measures/Progress:* N/A for novelty (all changes must preserve exact outputs).
     - *Decision:* **Exempt.** CTO/legal signs off. It skips future reviews but must report stability quarterly.

  ### Where It Misfires and Can't Help

  - **Misfires:** 
    - Systems with no clear metrics (e.g., "developer happiness") will struggle in Steps 3–4. Default to human judgment.
    - Pre-registration may feel bureaucratic for fast-moving teams. Mitigation: Keep logs lightweight (e.g., a GitHub issue template).
    - "Exempt" can become a loophole. Require annual re-validation by legal/CTO.
  - **Can't Do:**
    - Resolve values conflicts (e.g., "Should we prioritize speed or stability?"). That’s still a human discussion.
    - Predict the future. Degeneration is hindsight-driven, so we use quarterly reviews as a trailing indicator.
    - Force honesty. Teams might game pre-registration by making vague predictions. Counter with concrete metrics and verification.

  You now have a structured, engineer-friendly process that replaces vibes with auditable progress tracking. The key Lakatosian ideas retained are: core vs. protective belt, novelty of wins, and degeneration patterns. Dropped: "positive/negative heuristic" (too jargony; replaced with "commitment" and "adjustments").
answer: |-
  **Bottom line:** Adopt the Core Commitment Review: a four-step procedure yielding Keep/Freeze/Kill/Exempt verdicts. Python 2 monolith → **Freeze**, ML platform → **Keep** (with pre-reg mandate), Billing → **Exempt**.  

  ---

  ### The Core Commitment Review (CCR) Procedure  
  **Time per system:** 20 mins (strictly enforced)  
  **Inputs:** Pre-read with system metrics, incident logs, and a "Progress Docket" (pre-reg predictions from last quarter).  
  **Output:** One verdict per system + action items.  

  #### Step 1: State the Core Commitment (5 mins)  
  **Question:** *"What’s the one thing this system must never break, and what’s its north-star metric?"*  
  - **Sufficient answer:** A single sentence (e.g., "Serve search results under 200ms at p99" or "Reproduce invoices byte-for-byte"). Must include a metric we measure.  
  - **Stop if:** No clear commitment exists → **Kill** (core is undefined; migration starts immediately).  
  - **Values handoff:** If commitment is business-fiat (e.g., "Must support legacy clients forever"), tag it → *Exempt candidate*.  

  #### Step 2: Audit the Change Log (5 mins)  
  **Question:** *"Last quarter’s changes: which were bandaids (fixing fires) vs. upgrades (unlocking new capabilities)?"*  
  - **Sufficient answer:** Team categorizes each change as:  
    - **Bandaid:** Reactively patched a failure (e.g., "Added a flag to disable crashing feature").  
    - **Upgrade:** Proactively improved capability (e.g., "New index format to handle future query types").  
  - **Immunizing stratagem test:** If >50% changes are bandaids *and* no upgrades → **degeneration flag**.  
  - **Noisy metrics hack:** Ignore statistical significance. Focus on *direction*: did this change introduce new options or just bury technical debt?  

  #### Step 3: Verify Novel Progress (5 mins)  
  **Question:** *"Did last quarter’s upgrades deliver a win we predicted *before* building?"*  
  - **Pre-reg rule:**  
    - **Who/writes:** Team lead logs predictions in the "Progress Docket" *before* coding starts.  
    - **Who/verifies:** An engineer from a *different* team (rotated quarterly) validates timestamps.  
  - **Sufficient win:** A pre-registered upgrade hit its forecasted metric (e.g., "Predicted 5% latency drop → achieved 4%").  
  - **Stop if:** No pre-reg upgrades → **Freeze** (system is reactive, not progressive).  
  - **Anomaly:** Band-aids need no pre-reg (they’re firefighting).  

  #### Step 4: Render Verdict (5 mins)  
  | Condition                                  | Verdict    | Action                                  |  
  |--------------------------------------------|------------|-----------------------------------------|  
  | Pre-reg upgrade hit + <50% bandaids        | **Keep**   | Fund next quarter.                      |  
  | Pre-reg upgrade missed OR >50% bandaids    | **Freeze** | Stop new features; only fix critical bugs. |  
  | Degeneration flag for 3+ quarters          | **Kill**   | Migrate off.                            |  
  | Business-fiat commitment (Step 1 tag)      | **Exempt** | CTO signs off; no reviews until fiat lifts. |  

  **Time window rule:** Degeneration requires 3 quarters of "Freeze" to confirm → then **Kill**. *Exception:* Exempt systems never die from degeneration.  

  ---

  ### Your Cases Run Through CCR  
  1. **Python 2 Search Monolith**  
     - **Commitment:** "Return relevant results in <250ms p99."  
     - **Change log:** 38/40 last changes were bandaids (flags for Python 2 quirks). Index format upgrade was pre-registered and hit latency win (novel!).  
     - **Verdict:** **Freeze** (novel win is real, but bandaids overwhelm upgrades; 3rd degeneration quarter → migration plan starts).  
     - *You won’t like this:* The win is discounted because it’s drowned in debt.  

  2. **ML Feature Platform**  
     - **Commitment:** "Ship ML features without regressing model accuracy."  
     - **Change log:** Upgrades dominate (new pipelines, validation tools). *But* zero pre-registered predictions.  
     - **Verdict:** **Keep** (with mandate: pre-register 2 upgrades next quarter or auto-Freeze).  
     - *Why no degeneration?* Band-aids are rare → system is healthy *except* for prediction rigor.  

  3. **Billing Service**  
     - **Commitment:** "Reproduce 2016→ invoices byte-for-byte." (Business-fiat: legal requirement.)  
     - **Change log:** All changes are backwards-compat shims (bandaids by definition).  
     - **Verdict:** **Exempt** (CTO signs waiver; removed from future CCRs until law changes).  

  ---

  ### Where This Fails (and Why)  
  1. **Can’t handle:** Systems where metrics are unmeasurable (e.g., "developer experience"). CCR requires hard metrics.  
  2. **Misfires when:**  
     - Teams game pre-reg by predicting trivial wins. *Mitigation:* Verifier from another team rejects low-impact upgrades.  
     - Business-fiats multiply, creating exempt "zombie" systems. *Mitigation:* CTO re-evaluates fiats annually.  
  3. **Blind spot:** CCR can’t detect slow obsolescence (e.g., a "Keep" system becoming irrelevant). Pair with annual business-impact reviews.  

  **Dropped Lakatos concepts:**  
  - "Positive/negative heuristic" → replaced with "upgrade vs. bandaid" (engineer terms).  
  - "Protective belt" → implicit in Step 2’s change log audit.  
  - "Problem shifts" → too abstract; distilled into pre-reg verification.  

  **Final note:** CCR forces explicitness. If your team can’t articulate a core commitment in Step 1, that’s data — not failure.
