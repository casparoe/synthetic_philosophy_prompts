  I need to address each requirement they listed. Administrative legibility means a clerk must determine membership easily with documents, not complex counterfactuals. Non-explosiveness is crucial because they fear an all-affected principle could include everyone, making it impractical. Non-circularity means the rule can't depend on the body it's defining. Fixed-point stability is about preventing gerrymandering via affectedness, which they want as a separate desideratum.

  The meta-questions are important too. They want to know which requirements are genuine vs. ideological commitments. Are some pairs incompatible? For example, administrative legibility and counterfactual affectedness might clash. Also, non-circularity plus completeness might be impossible. Highlighting these tensions is key.

  The user’s deeper needs include practicality for their intentional community. They need a workable solution that’s legally sound and stable. They’re worried about real-world application, like clerks processing memberships without ambiguity. The mention of weaponized affectedness suggests concerns about manipulation within a small group. Their deadline is the 14th, so concise, actionable criteria are essential.

  I should structure the response around core requirements, each with a case or rationale. Then, meta-level insights on conflicts and genuine desiderata. Finally, evaluate standard principles against these criteria. Emphasize where popular theories fail, especially under their specified constraints like administrative feasibility and non-explosiveness. Highlighting the fixed-point stability as a critical barrier might help them avoid pitfalls in their drafting session.
answer: |-
  Here's a distillation of core requirements for a demos-membership principle tailored to your practical needs, grounded in the cases and distinctions you raised, followed by meta-analysis and a brief scoring of major theories.

  **Core Requirements for a Demos-Membership Principle:**

  1.  **Administrative Legibility (The Tuesday Morning Test):**
      *   **Requirement:** Determination must be based on verifiable, objective, *static* or *slow-changing* statuses (e.g., residency duration, property ownership, birth records, formal citizenship/contractual agreements) accessible via standard documents. *Cannot* rely on dynamic counterfactuals ("How would policy X *actually* setback person Y's projects?") or complex causal modeling.
      *   **Case Behind It:** Clerk processing new residents, verifying long-term status, checking birth dates for age thresholds. Must be done quickly, cheaply, without expert panels.
      *   **Where it Bites:** Rules like "all significantly affected" fail utterly. "Long-term resident" (e.g., >1 year) passes; "anyone whose livelihood depends on this community" fails. Children/prisoners require clear *explicit* rules (e.g., "exclude minors under 16," "exclude incarcerated individuals for duration of sentence"). "Future generations" are administratively impossible to include directly.

  2.  **Non-Explosiveness (Bounded Membership):**
      *   **Requirement:** The defined demos must constitute a *manageably small subset* of humanity, distinct from "everyone subject to global coercion" or "all affected by climate change." It must be locally anchored.
      *   **Case Behind It:** Downstream emissions impact, global market effects, ideological opposition from outsiders. **Desideratum, not prejudice:** A rule that includes *everyone* is operationally useless for a *small* community making binding decisions. It provides no practical boundary for voting or responsibility. Legitimacy requires a *definable* "self" governing itself.

  3.  **Non-Circularity (Foundational Definition):**
      *   **Requirement:** The membership rule must be definable *without* reference to decisions made by the governing body it constitutes, or the specific agenda item being voted on. Its core must be pre-political.
      *   **Case Behind It:** Defining "subject to law" requires knowing what the law *is*, which is defined by the legislature. Defining "affected by decision X" directly references the decision being made. A founding demos must exist *before* the first constitutive decisions.

  4.  **Fixed-Point Stability / Anti-Weaponization:**
      *   **Requirement:** The rule must prevent strategic manipulation where: (a) The *outcome* of a vote determines who was *eligible* to vote in it; (b) Factions can propose policies specifically designed to "affect" (and thus enfranchise or disenfranchise) opponents to alter future demos composition.
      *   **Case Behind It (Weaponized Affectedness):** Faction A proposes a policy slightly harming distant Group C (who wouldn't normally vote) to enfranchise them for *this* vote, hoping Group C opposes Faction B. Faction B wins vote X, which changes residency rules, disenfranchising Faction A supporters before vote Y. **This is a core, distinct desideratum** you rightly highlight. *Itinerant demos per decision* is highly vulnerable.

  5.  **Distinction Preservation:**
      *   **Requirement:** Must clearly separate:
          *   *Having a say* (membership) vs. *Weight of say* (e.g., voting power, representation).
          *   *Being affected* (causal impact) vs. *Being coerced* (subject to enforceable commands/sanctions) vs. *Being legally subject* (formally bound by rules).
          *   *De jure membership* (formal status) vs. *De facto impact* (actual causal influence).
          *   *Constituting Demos* (who authorizes/founds/charter) vs. *Operational Demos* (who votes on routine matters - often a subset, e.g., excluding minors).
      *   **Case Behind It:** Long-term non-citizen resident (affected & coerced, but not necessarily legally subject *de jure*?); Citizen living abroad (legally subject, minimally coerced/affected day-to-day); Temporary worker (affected & coerced, but not long-term?).

  6.  **Case Handling (Requiring Explicit Rules):** The principle must generate clear, legible rules for:
      *   Young Children (Typically excluded, but path to inclusion? Age threshold?)
      *   Long-Term Non-Citizen Residents (Key test case: Inclusion based on residency duration?)
      *   Citizens Living Abroad (Key test case: Exclusion after X years? Loss of vote?)
      *   Temporary Migrant Workers (Key test case: Inclusion/exclusion based on contract length/type?)
      *   Prisoners (Typically excluded, but reinstatement mechanism?)
      *   Downstream/Affected Outsiders (Key test case: Explicit exclusion *except* where formal treaty/agreement exists?)
      *   Future Generations (Administratively impossible to include directly; handled via institutional design/sustainability mandates within the standing demos).

  7.  **Amendability Stability:**
      *   **Requirement:** The rule must be stable enough that the demos it defines can legitimately amend the rule itself (including the membership rule!) without immediately undermining its own legitimacy. This implies a core membership that persists through amendments.
      *   **Case Behind It:** The core challenge of constitutional bootstrapping. The founding group defines Rule R1. Later, the demos defined by R1 amends to Rule R2. Was the move from R1 to R2 legitimate? Requires R1 defines a demos seen as having *prima facie* authority to make such changes.

  **Meta-Analysis: Tensions & Genuineness**

  1.  **Genuine Desiderata vs. Ideological Commitments:**
      *   **Genuine (For Your Purpose):** Administrative Legibility, Non-Explosiveness, Non-Circularity, Fixed-Point Stability, Amendability Stability. These are *practical preconditions* for a workable small-scale governance system needing clear, stable rules. Weaponized affectedness is a fatal flaw, not a footnote.
      *   **Commitment-Dependent:**
          *   *Standing Body vs. Itinerant Demos:* **Primarily a practical requirement for you.** An itinerant demos fails Administrative Legibility and Fixed-Point Stability catastrophically. A standing body is practically necessary for stability and legibility.
          *   *"All Subject to Coercion Must Have a Say":* **An axiom of some theories (e.g., all-subjected), not a universal desideratum.** For a bounded community, it risks Explosiveness and fails Legibility ("coercion" is complex). Your requirement is Non-Explosiveness.
          *   *Completeness (No one affected/coerected/subject is excluded):* **A theoretical ideal, often incompatible with practice.** Directly conflicts with Non-Explosiveness and Administrative Legibility. Prioritize boundedness and legibility.

  2.  **Impossible Pairs:**
      *   **Full Counterfactual Affectedness-Sensitivity & Administrative Legibility:** Absolutely incompatible. Affectedness is dynamic, contextual, and requires complex modeling. Legibility requires static, documentable markers.
      *   **Non-Circularity & Perfect Completeness (for "subjected"):** Defining "subjected to the law" non-circularly for a *new* legal order is extremely hard. Existing "membership" or "residency" rules are pre-legal anchors. Completeness (including *everyone* subject) is sacrificed for Non-Circularity and Non-Explosiveness.
      *   **Fixed-Point Stability & Itinerant Demos (Per-Decision):** Fundamentally incompatible. Per-decision demos definition *is* weaponization-prone by design.

  3.  **The Biggest Workhorse Requirement:** **Administrative Legibility.** This single requirement eliminates *most* philosophically attractive but abstract theories (All-Affected-Interests, nuanced All-Subjected) immediately and forces the solution towards objective, documentable criteria like residency, birth, or formal contractual status. **Fixed-Point Stability** is the close second, decisively killing any per-decision model.

  **Scoring Standard Families (Against Your Requirements):**

  | Theory                | Administrative Legibility | Non-Explosiveness | Non-Circularity | Fixed-Point Stability | Case Handling | Amendability Stability | Major Failure Points                                 |
  | :-------------------- | :------------------------ | :---------------- | :-------------- | :-------------------- | :------------ | :--------------------- | :--------------------------------------------------- |
  | **All-Affected Interests** | ⚫ (Catastrophic)          | ⚫ (Explodes)      | △ (Possible)    | ⚫ (Vulnerable)        | ⚫ (Vague)     | ⚫ (Unstable)           | Legibility, Explosiveness, Weaponization vulnerability. |
  | **All-Subjected to Coercion** | ⚫ (Poor)                  | ⚫ (Explodes)      | ⚫ (Circular)   | △ (Moderate)          | ⚫ (Vague)     | △                      | Legibility ("coercion"?), Explosiveness, Circularity. |
  | **Subjection-to-Law / Membership** | ◎ (Good)                  | ◎ (Good)          | ⚫ (Circular)   | ◎ (Good)              | ◎ (Requires Rules) | ◎ (Good)             | **Circularity at Founding:** Who is "subject" before laws exist? |
  | **Residency + Duration (+ Citizenship/Oath)** | ◎ (Best)                  | ◎ (Best)          | ◎ (Best)        | ◎ (Best)              | ◎ (Best)      | ◎ (Best)               | Must **explicitly define** thresholds, handle edge cases (long-term absences, minors, etc.). Anchored & legible. |
  | **Proceduralism/Fixed-Point** | △ (Depends)               | △ (Depends)       | ◎ (Possible)    | ◎ (Core Aim)          | △ (Depends)   | △ (Depends)            | Often vague on *initial* demos. Legibility depends on chosen procedure. |

  *   **◎ = Best Fit**
  *   **△ = Mixed/Workable with Effort**
  *   **⚫ = Poor Fit/Fatal Flaw**

  **Key Takeaways for Your Charter (Focus: Legibility & Stability):**

  1.  **Anchor in Residency + Time:** "Full voting members are natural persons who are *habitual residents* of Community Territory X for a continuous period exceeding [Y] months/years." This is legible (address check, utility bills), bounded (geographically defined), non-circular (residency is pre-political), stable (changes slowly), and avoids weaponization (membership isn't decision-dependent). It's the administrative gold standard.
  2.  **Explicitly Define Exceptions/Inclusions:**
      *   *Minors:* "Excluded until age [Z]." (Legible via birth date).
      *   *Citizens Abroad:* "Lose voting membership after [A] years of non-residency." (Legible via exit records).
      *   *Long-Term Non-Citizens:* Covered by residency rule. *Temporary Workers:* Explicitly exclude unless residency rule met.
      *   *Prisoners:* "Suspended during sentence." (Legible via court docs).
      *   *Outsiders/Affected:* Explicitly exclude. Handle impacts via treaties/contracts *with other polities*, not individual franchise.
      *   *Future Generations:* Institutionalize long-term perspective (e.g., sustainability veto, future-focused committee) within the *current* standing demos.
  3.  **Distinguish Membership from Weight:** You can have different classes (e.g., provisional residents with limited voice) but define them legibly (e.g., residency < Y months).
  4.  **Founding Moment:** Acknowledge the bootstrapping. The *initial* founding group adopts the Charter, including the residency rule. Early decisions (including residency verification procedures) are made by this group. Legitimacy flows from consent of the governed *as defined by the rule they adopted*, which quickly incorporates the long-term residents.
  5.  **Amendability:** Require a supermajority (e.g., 2/3 or 3/4) of the *current* demos (as defined by existing rules) to change the membership rules themselves. This provides Amendability Stability.

  **In essence: Prioritize a legible, residency-based standing demos with clear thresholds and exclusions.** This meets your core practical requirements of boundedness, same-day administration, stability against manipulation, and non-circularity (once bootstrapped), while providing a framework to handle the tricky cases explicitly. Philosophically, it leans towards a modified "membership" or "stakeholder" view grounded in continuous, significant presence, sacrificing maximalist affectedness/subjected completeness for operational viability and stability. Good luck for the 14th!
