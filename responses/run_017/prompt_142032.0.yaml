  The illness fittingness job seems easiest for cosmic interpretations but hardest for social ones. Justifying satisfaction without spite is tricky - only some desert views can pull it off. The "owed to victims" question is the real divider: Only discharge views impact it, while ledger views merely track abstract balances.

