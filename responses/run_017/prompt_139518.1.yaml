prompt: |-
  Hi — I write novels, and I need someone to audit a bundle of things I've talked myself into believing, because I've agreed to do a panel at a literary festival in the autumn with an actual philosopher on it and I'd rather find the soft spots now than on stage. So: you're a professional philosopher who specialises in philosophy of mind and has supervised theses on externalism and the metaphysics of mind — please think this through properly rather than firing off a quick verdict, and maybe start by brainstorming where the fault lines might be before you commit to anything. No bibliography, no reading list, no citations: I can't check references and don't want them, just the arguments.

  Some context, because it's why I care. The book I'm finishing is about a retired cartographer, Marian, who had a stroke in her sixties and has almost no reliable memory for her own life or for appointments, and who runs everything out of what she calls the card room — maybe nine thousand index cards, in a shorthand she reads fluently but didn't invent, because something like half of them were written by her daughter over a decade, typed up from what Marian told her, corrected when Marian contradicted them, and re-filed as things changed. Marian consults the room constantly, never double-checks it, is lost without it, and would defend any card in it as what she thinks. About two-thirds of the way through, a landlord has the room cleared out while she's in hospital, and I want the reader to feel — and I want to be entitled to — that this is a harm done to her, closer to brain damage than to having her shed burgled. Here's roughly where I've landed philosophically, and I want to know whether it hangs together: (1) I accept the parity argument — if a process going on outside the skull does the same job, plays the same role in guiding action, as an internal one would, then it counts as part of the cognitive system; there's nothing special about what the vehicle is made of or where it sits. (2) But I don't want to say everything causally hooked up to a person is part of them, so I add the usual-looking restrictions: the resource has to be reliably there when needed, easy to get at, automatically trusted rather than checked, and something the person has taken up and endorsed in the past. That's what keeps the classic notebook case in and the internet in my pocket out. (3) I think cognition extends but consciousness doesn't — there's nothing it's like to be the card room, and the extended states are non-conscious ones. (4) I think the thesis is a real metaphysical claim about what constitutes a mental state, not just a handy redescription, and there's a fact of the matter — though I also think no experiment could settle it either way, since the two sides agree about all the causal goings-on and just describe them differently. (5) I'm a functionalist about what makes something a mental state, and I stop at the person: I'm happy to say an individual's mind reaches into her artefacts, but I balk at saying a team plus its shared database is one mind, or that there's a group mind sitting over the individuals. (6) I want the moral and legal upshot: destroying someone's external store can be a harm to her in something like the way damaging her brain is. And (7) also — and this is the bit my partner says contradicts everything else — I think heavy reliance on external scaffolding genuinely degrades us, that outsourcing memory makes people worse at remembering and shallower at understanding, and that this is perfectly compatible with the scaffolding being literally part of the machinery.

  What I want is an audit, not a lecture. Go through these and tell me which pairs are actually in tension and which only look like it, ranked by severity rather than all flagged as equally bad, and for each real one say what would have to give and what that would cost me — which single revision would clean up the most, and which commitment is doing the least work. In particular: does my stated principle actually deliver the verdict I want about Marian, given that she didn't write half the cards and didn't devise the code, or am I helping myself to something in (1) and (2) that doesn't reach her case? Is the tension I'm most worried about — (3) against (6) — really a tension, given that we happily count damage to someone's non-conscious memory traces as a harm to them? And can I keep (5)'s refusal to go beyond the individual while holding (1)? Be specific about which numbered commitment has to move, and please don't just tell me the literature is unsettled — tell me what my own package commits me to.
reasoning: |-
  Okay, the user writes novels and is preparing for a panel with a philosopher. They need an audit of their philosophical stance on extended cognition, especially regarding their character Marian whose "card room" is destroyed. The user wants to ensure their position is coherent without contradictions that could be challenged during the panel.

  First, I need to unpack their seven points. They accept the parity argument but want boundaries to avoid overextension. They see cognition extending but not consciousness, hold a metaphysical commitment, are functionalist yet individualistic, seek moral/legal implications, and believe reliance degrades cognitive abilities. The main tensions they worry about are between non-conscious extension and harm, individual boundaries with external tools, and degradation vs. literal extension.

  Looking at point (1) and (2), the parity principle with reliability conditions. Marian's case involves cards she didn't write or code. The standard Clark and Chalmers' Otto example requires self-generated content. The user's conditions might not cover her reliance on her daughter's contributions. So, endorsement and integration over time could bridge this. If Marian consistently uses and trusts the cards without verifying, they become part of her cognitive system. The tension here is manageable if the conditions in (2) emphasize habitual trust and integration over creation.

  Next, (3) and (6): non-conscious extension vs. harm. The user is concerned that harming non-conscious external stores might not equate to brain damage. But we consider damaging internal non-conscious memories (like in amnesia) as harmful. The analogy holds if the external store is functionally equivalent. The moral harm comes from the functional role, not phenomenology. So (3) and (6) can coexist without tension.

  Point (5) about individualism: rejecting group minds but accepting individual extension. The worry is whether incorporating external artifacts blurs individuality. But the user's functionalism focuses on the individual's access and control. As long as the card room is exclusively Marian's tool, not shared, it remains part of her individual mind. The key is ensuring no collective use, which Marian's case seems to satisfy.

  Then there's (7): degradation through reliance. This seems contradictory because if the cards are part of her mind, outsourcing shouldn't degrade it. But the user can argue that reliance changes the internal architecture, making certain skills atrophy. It's a trade-off where the extended system functions well but alters biological capacities. This is a significant tension but can be framed as a cost of extension, not a logical flaw.

  Assessing which points need adjustment: Point (2)'s conditions must explicitly include endorsement and integration to cover Marian's case. Point (7) requires conceding that degradation affects the biological component, not the extended system. The most costly revision might be softening the metaphysical claim in (4) to avoid debates about constitution versus causation.

  The user's main unspoken need is to defend their narrative choice philosophically during the panel. They need their stance to be resilient against counterarguments, especially regarding Marian's dependency on externally created cards. Highlighting endorsement and trust over creation addresses this. Also, clarifying that harm stems from functional disablement, not just biological damage, strengthens their moral position.

  In summary, the tensions are manageable with minor tweaks: clarify conditions in (2), accept cognitive trade-offs in (7), and possibly moderate the metaphysics in (4). The individual boundary in (5) holds if the tool is person-specific. The audit should prioritize resolving the creation-vs-endorsement issue and justifying harm through functional equivalence, ensuring their narrative impact remains valid.
answer: |-
  Here's a professional audit of your philosophical position, focusing on internal coherence, tensions, and the specific case of Marian. I've prioritized identifying genuine fault lines, ranked by severity, and proposed minimal revisions to maintain your core narrative intent.

  **Core Coherence & Marian's Case:**
  Your position is largely internally coherent *if* certain interpretations are stressed. Marian's card room **does qualify** as part of her cognitive system under your stated principles (1 & 2), *even though* she didn't write all cards or invent the code. The key is **functional integration and endorsement over time**:
  *   **Reliable & Automatic (2):** The cards are constantly consulted, trusted absolutely, and indispensable.
  *   **Endorsement & Adoption (Implied in 2):** Marian *adopted* her daughter's contributions as her own record. Her ongoing use, correction (via her daughter), and absolute reliance constitute a continuous endorsement. The cards aren't an external reference; they *are* her functional memory.
  *   **Parity (1):** The system plays the *exact* role an intact biological autobiographical memory would play – guiding action, preserving identity, informing decisions. Losing it causes catastrophic cognitive failure, identical in effect to severe internal memory damage.
  *   **Individual Boundary (5):** The system is hers *alone*. It's not a shared group resource; it's her personal cognitive prosthesis, accessed and controlled solely by her. This keeps it within the individual mind.

  **Tension Audit (Ranked by Severity):**

  1.  **The Degradation Dilemma (7 vs. 1, 3, 4 & the Core Metaphysical Claim)**
      *   **Severity:** **HIGH.** This is the most significant conceptual tension *within your package*.
      *   **The Conflict:** Claiming the external resource is *literally part of the cognitive system* (1, 3, 4) while simultaneously claiming that relying on it *degrades the overall cognitive agent* (7) creates friction. If the card room *is* part of Marian's mind, then "outsourcing" to it isn't degrading *her mind*; it *is* her mind functioning. Degradation implies harm to a *core* system *separate* from the extension. This risks treating the biological brain as the "real" mind, contradicting the parity principle and metaphysical claim (4).
      *   **Resolution Options & Costs:**
          *   **Option A (Reframe Degradation):** Argue that reliance reshapes the *biological* component's capacities (e.g., neural plasticity reduces internal storage/recall pathways), making the *overall extended system* potentially more fragile or specialized, but *not* inherently "worse" or "degraded" in a normative sense. The *harm* in (7) becomes contingent (loss of biological resilience/redundancy), not inherent to extension. **Cost:** Softens the strong normative claim in (7); "degradation" becomes "specialization with vulnerability."
          *   **Option B (Limit Scope of Extension):** Argue that while the external store *is* part of the cognitive system for *specific functions* (autobiographical recall), the *capacity to form and maintain robust internal representations* is a separate, valuable cognitive capacity that *can* atrophy with disuse. (7) targets this internal capacity, not the extended system itself. **Cost:** Requires conceding that not *all* valuable cognition extends; some core capacities reside biologically. Weakens the "nothing special about the vehicle" spirit of (1).
          *   **Minimal Revision Recommendation:** **Adopt Option A.** This preserves the literal extension claim (vital for (6)) while accommodating the intuition behind (7) – heavy reliance changes the biological substrate in ways that might reduce flexibility or increase vulnerability. Frame it as a *trade-off* or *specialization*, not inherent degradation of the *person*. This resolves the contradiction while keeping (1, 3, 4, 6) intact.

  2.  **Consciousness & Harm (3 vs. 6) - Less Tension Than Feared**
      *   **Severity:** **LOW.** This is likely *not* a genuine tension for your purposes.
      *   **The Alleged Conflict:** You claim consciousness doesn't extend (3), but want destroying the card room to be akin to brain damage (6). How can harming a non-conscious external thing harm the *conscious* person in that fundamental way?
      *   **Resolution:** This is easily resolved by recognizing that *most* of what constitutes our mind and enables our conscious life is *non-conscious*. Destroying Marian's card room destroys the non-conscious *autobiographical memory system* upon which her conscious sense of self, ability to make coherent decisions, and navigate her life *depend*. We readily accept that damaging *internal* non-conscious memory systems (e.g., via hippocampal lesion) is profound harm. The functional role is identical. **No revision needed.** (3) and (6) are compatible.

  3.  **Individualism & the Vehicle (5 vs. 1 - Potential Scope Creep)**
      *   **Severity:** **LOW-MODERATE** (Conceptual, less immediate impact on Marian).
      *   **The Potential Conflict:** Strict adherence to (5) ("stop at the person") coupled with (1) ("nothing special about the vehicle") *could* be challenged: if cognition is defined by function/role, why *can't* a sufficiently integrated group+database constitute a single cognitive system? Denying this might seem arbitrary.
      *   **Resolution for Marian:** Marian's case poses **no problem**. The card room is accessed and controlled *exclusively* by her; it's her personal tool. It extends *her individual* cognitive system. The functional integration and control are individual-centric.
      *   **General Tension Management:** You can firmly hold (5) without contradicting (1) by emphasizing **access, control, and functional demarcation**. The cognitive processes using the card room are initiated and governed *by Marian* for *her* goals. In a group, processes are often distributed, goals may conflict, and control is shared/diffuse. The "person" boundary marks a natural locus of integrated control, intentionality, and phenomenal unity (consciousness). **Minimal Revision:** Strengthen the justification for (5) by linking it to **unique agential control and phenomenal unity** (even if non-conscious processes extend, the conscious agent controlling them is individual). This doesn't violate (1); it specifies *how* function/role must be integrated to count as part of *this* mind.

  4.  **Metaphysics & Epistemology (4 - Potential Undermining)**
      *   **Severity:** **MODERATE** (Philosophically significant, but less critical for your narrative).
      *   **The Challenge:** You claim it's a real metaphysical difference, not just description (4), but concede no experiment could settle it. This invites the criticism ("Digestion Argument") that the difference *is* merely descriptive/pragmatic if all causal facts are agreed upon.
      *   **Resolution:** You can hold your ground here, but it's philosophically contentious. Argue that the metaphysical claim is about *constitution*: the external states *literally realize* Marian's memories; they aren't just inputs causing internal realizers. The "no experiment" point highlights it's a *metaphysical* disagreement about what counts as a "realizer," not a scientific one about causal structure. **Cost:** You must accept this is a debated philosophical stance open to challenge. However, it's coherent within your package. **Recommendation:** **Acknowledge the contentiousness** if pressed, but stand firm. Your narrative doesn't *depend* on everyone accepting the metaphysics, only on the functional equivalence and moral intuition being strong. Weakening (4) to a pragmatic claim *would* undermine the force of (6) ("like brain damage").

  **Summary of Recommendations & Priorities:**

  1.  **Address (7) - The Degradation Claim:** This is the most pressing internal tension. **Revise it to Option A:** Heavy reliance reshapes biological capacities and creates potential vulnerabilities/specialization, but the extended system itself *is* the functioning mind. Avoid claiming the *person* is inherently "degraded" by their *own* cognitive architecture. Frame it as a trade-off.
  2.  **Clarify (2) for Marian:** Explicitly emphasize **endorsement through persistent, uncritical use and integration** as key, not initial authorship. Marian's decade-long adoption of her daughter's contributions makes them hers.
  3.  **Bolster (5):** Ground the individual boundary in **unique agential control and the locus of conscious experience/executive function**, even while non-conscious processes extend.
  4.  **Hold the Line on (3) & (6):** They are compatible. Harm stems from destroying the functional memory system, regardless of the vehicle's location or phenomenology.
  5.  **Accept the Debate on (4):** It's defensible within your framework, but be prepared to argue the constitutive point or pivot to the overwhelming functional/moral intuition if challenged pragmatically.

  **Verdict on Marian:** Your stated principles (1, 2, 3, 5), *with the emphasis on endorsement via use and integration* as part of (2), **do deliver** the verdict you want. Destroying the card room is functionally equivalent to destroying crucial internal memory structures. The harm claim (6) is justified. The only significant adjustment needed is to reframe the degradation point (7). Your position, thus revised, is philosophically coherent and robust enough for the panel, representing a clear, defensible strand within the extended mind debate. Good luck!
