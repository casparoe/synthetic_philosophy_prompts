prompt: |-
  I have been trading decision problems with a friend who works in this area, and I want to know what she will say about one I have just built. I care less about the verdict itself than about which rule it falls out of, so please treat the prediction as a way of getting at the rule.

  Her track record, in my own shorthand: in Newcomb's problem with opaque boxes and a near-perfect predictor she one-boxes; in the smoking-lesion case, where a lesion causes both the desire to smoke and the cancer, she smokes; in the hitchhiker case, where a stranger drives her to town only because he predicted she would pay on arrival, she pays once she arrives; in the counterfactual mugging, where a predictor flips a coin and pays a million in the tails branch to anyone who would have handed over a hundred if asked, she pays; in XOR blackmail, where a letter is sent exactly when either a disaster has occurred or she is the sort of person who would pay to avert it, but not both, she refuses to pay.

  The new case is a counterfactual mugging with an extortionist in the predictor's chair. A week ago someone abducted a person she loves and ran a detailed simulation of her in order to fix, in advance, what he would do: the hostage is released unharmed tomorrow if and only if the simulation predicted she would pay ten thousand dollars when asked. The simulation has been run, its result is settled and will not be revisited, and she is now asked for the money. To isolate the structure, stipulate three things: the transfer is anonymous, the kidnapper never learns whether it was made, and he dies before he could ever repeat the scheme. There are no legal, reputational, or other downstream consequences in either direction.

  Does she pay? The work I want is this: set out the rules that are compatible with all five of her earlier verdicts, including which of the familiar theories those verdicts already rule out, and make sure at least two of the surviving rules come apart on the ransom case; say what each of them predicts here and which structural feature each one is keying on — that the harm was fixed by a prediction of her own policy, or that the agent who fixed it profits from her being the sort of person who pays. If you think my three stipulations collapse the case into a plain counterfactual mugging and make the kidnapper framing idle, say so and explain what that framing was supposed to be adding. Then give me your best guess with the reason for preferring that rule, and name the variant of the case that would separate the competing rules most cleanly, even if it is not the obvious one.

  Please structure the response as follows. Candidate rules, about 150 words: the rules consistent with her five verdicts, stated precisely enough that their disagreement about the ransom is derivable rather than asserted, plus a note on what the track record excludes. What each rules says about the ransom, about 250 words: the prediction per rule, the feature doing the work in each, and an honest assessment of whether my stipulations are doing more work than I think. Best guess, about 150 words: the verdict you expect, the rule you take her to be running, and what would move you off it. The variant that settles it, about 150 words: the modified case you would put to her, why the rules diverge there, and what each would say.
reasoning: |-
  Hmm, this is a fascinating decision theory puzzle. The user is clearly well-versed in these thought experiments and wants to understand which decision rule their friend applies to a new ransom case. They've provided five clear precedent cases showing the friend's pattern: one-boxing in Newcomb, smoking in smoking lesion, paying in hitchhiker, paying in counterfactual mugging, but refusing in XOR blackmail.

  First I need to identify decision rules consistent with all five precedents. CDT (causal decision theory) is out because it would two-box in Newcomb and possibly not pay in counterfactual mugging. EDT (evidential) fails the smoking lesion case. The pattern points to sophisticated forms of updateless reasoning - probably FDT (functional decision theory) and UDT (updateless decision theory) as prime candidates.

  Now for the ransom case: it's structurally similar to counterfactual mugging but with a crucial twist - the kidnapper profits from her paying disposition. FDT would likely pay here since it cares about being the type of agent whose decisions correlate with good outcomes. UDT might refuse because the extortionist's payoff creates a conflict of interest, similar to XOR blackmail where paying causes the disaster.

  The three stipulations (anonymous transfer, no learning, no repetition) are critical. They eliminate causal pathways but preserve the acausal influence that matters to these decision theories. I suspect the "extortionist framing" isn't idle - the beneficiary relationship makes this more XOR-like than standard counterfactual mugging.

  For the test variant, I'd propose changing whether the kidnapper benefits from the payment. If he gains nothing, the cases collapse together; if he profits, they diverge. This would cleanly separate FDT's focus on decision-output correlation from UDT's concern with incentive structures.
answer: |-
  ### Candidate Rules (153 words)
  Your friend's track record rules out **CDT** (would two-box in Newcomb, refuse in counterfactual mugging) and **EDT** (wouldn't smoke in smoking lesion). It also rules out rigid **"tickle defense" EDT** (would refuse in hitchhiker) and simple **consequentialism** (would pay in XOR blackmail). Two rules consistent with all five verdicts:

  1.  **Functional Decision Theory (FDT):** Chooses the output of the *decision function* that, when imputed into all relevant models (past/future/predictive), leads to best outcomes. Keys on logical correlation between the agent's *type* and outcomes.
  2.  **Updateless Decision Theory (UDT):** Maximizes expected utility *conditional on the entire strategy* (policy) chosen *ex ante* (before any knowledge of one's situation). Keys on the precommitment to a strategy across all possible decision nodes.

  Both agree in your first five cases but **diverge critically in the ransom case on whether the beneficiary's incentives matter**.

  ---

  ### What Each Rule Says About the Ransom (248 words)
  *   **FDT Predicts PAY:** FDT treats the kidnapper's simulation as logically dependent on *what the agent's function outputs now*. Paying correlates with being the type whose past-simulated-output leads to release. Since the simulation *already used* this function, paying now affirms the type that got the hostage released. The kidnapper profiting is irrelevant; FDT focuses *only* on the logical link between the agent's decision-output and the outcome (release tied to *prediction of paying*). Your stipulations (anonymity, no learning, death) *reinforce* FDT's stance by eliminating causal paths, making the acausal/predictive link dominant. **Stipulations do heavy lifting:** They prevent the kidnapper's *future behavior* from being influenced, isolating the fixed prediction link FDT cares about.

  *   **UDT Predicts REFUSE:** UDT asks: "What *ex-ante* strategy (pay-if-asked / refuse-if-asked) yields higher expected utility across *all* similar decision nodes?" Crucially, UDT considers the incentives of the *other agent* (kidnapper). The kidnapper *profits* ($10k) iff the strategy is "pay". This creates a harmful incentive: rewarding predictors who create hostage situations tied to predictions of paying. Adopting the "refuse" strategy deters such schemes. The hostage outcome is *already fixed* by the *past* simulation of the strategy; paying now doesn't change that fixed outcome but *does* fund the extortionist, reinforcing bad incentives for future similar nodes. **Stipulations weaken but don't negate:** While the *specific* kidnapper won't repeat, UDT evaluates strategies over the *type* of scenario, where extortionists *in general* are incentivized by funding. The framing adds the critical element: *who benefits*.

  ---

  ### Best Guess (147 words)
  I predict your friend **PAYS**. The rule is **FDT**.

  **Reasoning:** Her paying in the standard counterfactual mugging (where Omega doesn't profit) strongly suggests she prioritizes the acausal link between her decision-*output* and the fixed outcome over broader incentive structures. The kidnapper framing resembles that case more than XOR blackmail (where paying *causes* disaster via the XOR condition). Her refusal in XOR blackmail is likely due to the *direct causal perversity* of paying (it only happens if disaster occurs *or* you pay, making payment evidence *for* disaster). Here, paying doesn't cause the harm; the harm's negation was already caused by her predicted type. Funding the extortionist is distasteful, but FDT's focus on the output-outcome correlation likely dominates under your stipulations.

  **What would move me?** If she views *any* payment to a *malicious* predictor as inherently incentivizing harmful acts *by similar agents* (a core UDT concern), overriding the isolated outcome link.

  ---

  ### The Variant That Settles It (146 words)
  **Modified Case:** The setup is identical *except*: The kidnapper runs the simulation *only if* he receives a separate, unconditional payment of $1 *before* the simulation. He uses this $1 to fund the simulation. The hostage release still depends *only* on the prediction about the $10k payment. The $1 payment is non-refundable and already made by the agent (unbeknownst to her at this decision point). The $10k demand proceeds as before.

  *   **Why Divergence:** This severs the direct funding link between the $10k decision and the kidnapper's profit/incentive. The harmful scheme is already funded by the sunk $1. The $10k is pure gain for him but doesn't enable *future* schemes.
  *   **FDT:** Still PAYS. The $10k payment still correlates with being the type that got the hostage released. The sunk $1 is irrelevant to the decision-output link.
  *   **UDT (Strategy-Evaluation):** Might now PAY. The "pay $10k" strategy no longer directly incentivizes *initiating* the scheme (funded by $1). Refusing gains $10k but provides no extra deterrence since the scheme cost is sunk. The objection to funding the extortionist's *profit* might be weaker than funding the scheme *itself*.
