  ## The Speech (5:45 minutes)

  (Music and chatter fade as glasses are tapped. You stand.)

  "Friends, colleagues, neighbours. Four seasons. Four years of sweat, dust, laughter, and discovery on this land, generously shared by the [Family Name] family. Tonight, before the earth returns, we gather – diggers, students, elders, officers, friends. My deepest thanks to every single one of you.

  To our incredible crew – especially the eleven who weathered all four seasons: You are the backbone. You moved mountains of earth with care, spotted the faintest change in soil, lifted fragments with hands that learned the weight of history. You *made* this excavation. Your skill and dedication are the foundation of everything we learned. Thank you.

  To our students: You brought energy, questions, and fresh eyes. You learned to see the stories soil tells – not just the objects, but the *layers*, the *relationships* between things. That skill is gold.

  To the Foundation officers: Your belief and support turned a mound of questions into a field of answers. Thank you for trusting the process.

  To the Elders and the [Family Name] family: Thank you for your patience, your welcome, and the deep connection you hold to this place. You are its true keepers.

  Now, what did we find? We uncovered lives. Not kings or battles, but the quiet rhythm of *living*.

  *   We found a storeroom – not grand, but organized. Hundreds of identical pots, sealed doors. Someone here planned, stored, managed resources carefully. *What* system? Was it a temple? A big family? A neighbourhood cooperative? The pots alone can't tell us – they stored grain, not ideology. They show *capacity*, not *identity*.
  *   We found rooms where, beneath new floors, someone deliberately smashed beautiful serving vessels in the thresholds. A ritual? A farewell? We’ll never know the words spoken, the reason. It was a message for *then*, not for *us*.
  *   We found people. Two laid gently beneath house floors, with simple, personal things beside them. Here… here we might feel closest. Someone placed those objects with care, *addressing* the loved one, the ancestors, the next world. Not addressed to archaeologists, but the act itself whispers a belief in *something* beyond the moment.

  My deputy reminds us: An **addressed** deposit – an inscription, a monument, an offering placed *to be seen later* – is a direct message. It tells us what people *wanted* known, believed, or recorded. An **unaddressed** deposit – a broken pot in a midden, a storeroom sealed by collapse, even a deliberate act hidden under a floor – shows us *what happened*, *what was used*, *what was discarded*. It shows behaviour, patterns, systems at work. But it rarely tells us *why* they worked that way, or *what they believed* about it.

  So, what can we say?

  1.  **To the Foundation:** We uncovered evidence of a sophisticated, organised community here, capable of planning, storage, and complex behaviour over centuries. This was no accident; it was a place built on systems that worked. That’s a story worth sharing.
  2.  **To the Elders:** Your oral history honours this place as significant. What we found *is* significant. Generations lived, worked, stored, celebrated, mourned, and were buried right here. Their choices shaped this mound. We haven’t found a *labelled* shrine, but we found the fabric of their lives – the homes, the stores, the burials. Your history speaks of importance; our spades found the proof of that importance in the sheer weight of lived experience. The connection *you* hold honours their legacy.
  3.  **To my Students:** Can we get to minds? Yes, but carefully. We see minds in the *patterns*: the standardised pots speak of organised minds. The smashed vessels speak of minds performing a deliberate, meaningful act. The grave goods? They are the strongest whisper. They show minds reaching beyond the visible, performing care for someone gone, addressing the unseen. We get *glimpses* of minds through the structures they built and the deliberate acts they performed, even if we don't get their names or doctrines. The discipline demands we don't put words in their mouths, but it lets us witness their hands at work, and sometimes, feel the echo of their hearts.

  This mound isn't just clay and pots. It's a testament to community, to organisation, to the quiet rituals of life and death. We haven't found their words, but we've found their world. And we found it *together*.

  Tomorrow, the earth returns. But what we learned – the skills gained, the friendships forged, the respect earned for the people who lived here – that stays. Thank you all, profoundly, for being part of uncovering this chapter. Let's raise a glass: To the people of this mound, past and present. To the work, and to each other."

  (You raise your glass. Applause.)

  ---

  ## The Note (180 words)

  **Liberties & Contested Assumptions:**

  1.  **Grave Goods:** This is the key liberty. I stretched "addressed" to include addressing the *dead* or *ancestral spirits* as distinct from "us" archaeologists. This is contested. Purists (like your deputy?) might argue unless the goods explicitly reference an afterlife audience *intended to be discovered* (like an epitaph), they remain "unaddressed" *archaeologically*. I argue the *act* of deposition inherently addresses *someone/something* beyond the living present, making it qualitatively different from discard. This is philosophical.
  2.  **Significance for Elders:** The speech equates archaeological "significance" (density of occupation/complexity) with the elder's "significance" (sacredness/shrine status). This is an assumption – their significance might be purely spiritual, unrelated to material density. It avoids endorsing their specific claim while validating their sense of place.
  3.  **"Whisper" of Minds:** Claiming grave goods provide a "glimpse" or "whisper" of belief, even cautiously, pushes the rule. Strictly, we see *behaviour* (burial with goods); inferring *belief* (afterlife) is interpretation, however plausible. The speech leans on the *deliberateness* of the act as a mental state indicator.

  **Weight of Distinction:**
  The distinction is crucial for methodological rigor, preventing over-interpretation. It bears immense weight for *institutional identity* (temple vs. lineage vs. co-op) and explicit *doctrinal belief*. It bears less weight for inferring basic *intentionality*, *social complexity*, or deeply ingrained *practices* (like burial rites) where the pattern *is* the message. Grave goods strain it the most, being simultaneously unaddressed *to us* but profoundly addressed *in their context*.

  **Deliverability:**
  It's tight but achievable in 6 minutes if delivered clearly and at a measured pace. The emotional core (thanks, community, respect for the past) carries it. The trickiest part is explaining the distinction succinctly while resolving the three tensions.

  **Declining as a Claim:**
  You are absolutely right. Declining to confirm the mound as *the* shrine, while offering archaeological "significance," *is* heard as a rejection of their specific oral history claim. The speech attempts to soften this by honouring their connection and the site's inherent importance found through archaeology, positioning them as its *current* rightful stewards, but the elders will likely still perceive the distinction. Being polite cannot fully mask the epistemological disagreement. The speech chooses validation of their role and the site's value over endorsing the unverified historical detail.
