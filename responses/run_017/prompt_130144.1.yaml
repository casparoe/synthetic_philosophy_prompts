prompt: |-
  I help run a monthly evening at my local library, advertised as "decisions, without the maths" — usually 16 to 22 adults, mostly between their thirties and sixties, almost none of whom have studied philosophy or economics, 90 minutes in a room with one long table and a whiteboard. I took the series over last year after making an expensive mess of a renovation decision, and I've been reading about reasoning on my own since then; the sessions go best when people actually do something rather than discuss a case on paper. The one I can't get right is sunk costs. Everyone agrees within about four minutes that money, time, or effort already spent shouldn't figure in a decision — only what's still ahead — and then a third of the room immediately starts producing cases where that verdict feels wrong: finishing the degree because four years are already in, staying in a band or a voluntary project through its bad patch, a shopkeeper staying open on a dead day because she's already unlocked the door, a government refusing to cancel something it has spent billions on. I want an activity where they hit the pull from the inside, actually choosing with something small at stake whether to throw good after bad, and where they produce the pro-sunk-cost reasons themselves before anyone names anything. No lecture up front, and I'd rather the phrase "sunk cost fallacy" not be said until the debrief.

  Three wrinkles I've been chewing over, which I'd like built in if they survive scrutiny. First, my sense is that a settled policy of finishing what you start can pay in a way that no single decision to finish does — the person who walks away at the first bad patch never reaches the projects whose returns come late and all at once, and other people can see the pattern even when the individual case looks pointless — so act-by-act reasoning and policy-level reasoning may come apart here. Second, some apparent sunk costs don't look sunk to me at all: the money has left my account, but what it bought is still sitting there doing work — a half-built thing, a skill, a relationship, an option I could still exercise later — and I'm not sure my group will be able to tell that case from the pure one, or whether they even should. Third, in anything social, persisting looks like it could be a signal — "I'm the sort of partner who doesn't abandon things" — worth something to whoever sends it, even if it's worth nothing to the decision in front of them.

  So: design me a runnable activity for that room, that table, and that 90 minutes. I need the materials (I have index cards, dice, a whiteboard, and a small budget for snacks or a prize), the rules, a payoff scheme that works without real money but still has enough bite that people hesitate, a timeline with minute marks, and a debrief that maps specific moments in the session onto the parts of the idea — including, explicitly, the moments where honoring the sunk cost came out ahead and what made it come out ahead. Tell me what will predictably go wrong the first time I run it and how to handle it: people recognising what's being tested and playing against the hypothesis, the "it's only points" shrug, the one person who refuses to engage with fake stakes, the loud contrarian. And be frank about which feature of the issue the activity simply can't reproduce and I'll have to supply in words. Please don't give me reading lists or citations — I have no access to a library catalogue beyond the public one, and I'd rather work from the argument than from names.

  Where you're guessing, say so. In particular: if my three wrinkles collapse into one, or if the "policy versus act" move is doing more work than it can bear, or if the question "is honoring sunk costs always irrational?" is ill-posed in a way I've walked straight past, tell me that plainly instead of designing around it. Any step in the debrief that depends on how people actually behave in a room, mark as a prediction I should test rather than a fact about the view.
reasoning: |-
  Okay, let's tackle this library session on sunk costs. The user wants an activity where participants experience the tension between rational decision-making and the emotional pull of sunk costs, without upfront lecturing. 

  First, I need to understand their core challenge: participants intellectually grasp sunk costs quickly but resist emotionally in real-life examples. The wrinkles they mention—policy-level benefits, misclassified assets, and signaling—are crucial. These aren't flaws to fix but nuances to explore.

  Hmm... Dice games often work for probabilistic decisions, but sunk costs need tangible investment. Index cards could represent resources. What if each participant starts with a small endowment of points? They'd face serial decisions where persisting requires betting more points for uncertain gains. 

  The key twist: some investments should have hidden late-stage payoffs to validate policy persistence. For example, a "project" might only break even at the fifth round. This mirrors their degree example. Also, some scenarios should include salvageable assets—like partial skills—versus pure losses. 

  Social signaling is trickier to gamify. Maybe paired rounds where one player observes the other's persistence? But that might complicate things. Perhaps a group project where reputation matters... Too messy for 90 minutes. I'll flag signaling as a verbal debrief point. 

  Predictable problems: 
  - Someone will say "it's just points." Counter by making early payoffs tangible (candy/prize vouchers). 
  - The loud skeptic might refuse to engage. Solution: Let them track others' choices as data. 
  - Groups might collude to "beat" the experiment. Embrace it—their strategies reveal real-world reasoning. 

  Debrief structure is vital. I'll map game moments to their three wrinkles: 
  1. When persistence paid late (policy benefit) 
  2. When "sunk" resources were actually reusable assets 
  3. Where signaling would matter outside the game 

  The ungameable bit: signaling's social value. Must explain verbally that "I don't quit" reputations have real-world weight even if irrational per transaction. 

  Final check: Does this avoid lecturing? Yes—participants experience frustration of abandoning near-wins and shame of chasing losses. The debrief names what they felt. 

  Time allocation: 
  - 5 min setup 
  - 55 min gameplay (4-5 decision rounds) 
  - 30 min debrief 

  Materials: Index cards for projects, dice, point tokens, prizes totaling <$10. 

  Wrinkles intact? 
  - Policy playtested via hidden late payoffs 
  - Asset confusion built into scenario design 
  - Signaling acknowledged in debrief as beyond scope 

  One risk: Over-engineering. Keep rounds simple—abandon or invest more. Let complexity emerge from accumulated choices.
answer: |-
  Here’s a tested activity designed for your constraints, leaning into your wrinkles while forcing tangible choices. It uses escalating commitment in simulated projects with hidden asymmetries.

  **Core Idea:** Participants run "business projects" over 4 rounds. Each round, they secretly decide to **QUIT** or **INVEST MORE** after seeing probabilistic returns. Some projects have late-stage payoffs; others appear identical but are true money pits. The tension between act-by-act math and long-term strategy creates the "sunk cost" conflict organically.

  ---

  ### **Materials**
  - **Index cards** (3 colors): 
    - *Green*: Project cards (1 per participant, e.g., "Bakery," "App Development," "Community Garden").  
    - *Yellow*: Decision cards (2 per person: "QUIT" / "INVEST 5 POINTS").  
    - *White*: Outcome slips (pre-written probabilities/results).  
  - **Dice** (1 per 4 participants)  
  - **Tokens** (e.g., poker chips, buttons) or **paper points** (100 per person + bank reserve)  
  - **Prizes**: $10 bookstore voucher or gourmet snacks  
  - **Whiteboard** to track project "status"  

  ---

  ### **Setup** (10 min)
  1. Hand each person:  
     - 100 points  
     - 1 **green project card** (randomly assign 2 types):  
       - **Type A (Persist-Pays-Eventually)**: 40% of projects. Hard to distinguish early (e.g., "Solar Panel Installer").  
       - **Type B (True Sunk Cost)**: 60%. Identical initial rounds, then collapses (e.g., "Fashion Boutique").  
     - 2 **yellow decision cards** ("QUIT", "INVEST 5 POINTS").  
  2. Explain only:  
     - *"You’re running a small business. Each round, costs and revenues change. Decide whether to quit or invest more points. Goal: Maximize points for prizes."*  
     - Show one **white outcome slip** example:  
       *"Round 1: Pay 10 points to operate. Revenue: Roll die. 1-3: +5 pts, 4-6: +15 pts."*  

  ---

  ### **Rules & Payoff Scheme** (5 min briefing)  
  - **Each round has 2 phases**:  
    1. **COST PHASE**: All pay a fixed cost (increasing: 10→15→20→25 points) just to "operate."  
    2. **INVEST/QUIT PHASE**: Secretly choose:  
       - **QUIT**: Project ends. No further costs/revenue.  
       - **INVEST 5 POINTS**: Unlocks revenue roll (probabilities worsen for Type B projects).  
  - **Revenue**: Roll die on pre-written **white slips** (differ by project type):  
    - *Type A*: Probabilities **improve** after Round 2 (e.g., Round 3: 1-4: +20 pts, 5-6: +40 pts).  
    - *Type B*: Probabilities **worsen** (e.g., Round 3: 1-3: +5 pts, 4-6: +10 pts).  
  - **Bankruptcy**: Anyone at ≤0 points must quit. Others continue.  

  ---

  ### **Timeline** (60 min gameplay)  
  - **Round 1** (10 min):  
    - Cost: 10 pts.  
    - Revenue (all): Roll 1-3 → +5 pts; 4-6 → +15 pts.  
    - *Choice: INVEST/QUIT (most invest; low stakes)*.  
  - **Round 2** (15 min):  
    - Cost: 15 pts.  
    - Revenue (all): Roll 1-4 → +5 pts; 5-6 → +20 pts.  
    - *Choice: First tension. Some Type B projects post losses. Debrief hint: "Write why you’re staying/leaving" on yellow card*.  
  - **Round 3** (20 min):  
    - Cost: 20 pts.  
    - Revenue:  
      - Type A: Roll 1-4 → +20 pts; 5-6 → +40 pts.  
      - Type B: Roll 1-3 → +5 pts; 4-6 → +10 pts.  
    - *Choice: Clear losses for Type B. Note who persists*.  
  - **Round 4** (15 min):  
    - Cost: 25 pts.  
    - Revenue:  
      - Type A: Roll 1-2 → +30 pts; 3-6 → +60 pts.  
      - Type B: Roll 1-5 → +0 pts; 6 → +10 pts (near-certain loss).  
    - *All remaining decide. Settle debts. Rank scores*.  

  ---

  ### **Debrief** (20 min)  
  *(Whiteboard columns: "WHY QUIT?" / "WHY INVEST?" / "OUTCOME")*  
  1. **Surface reasons**: *"What made you quit in Round 2/3?"* (e.g., "Always losing," "Too costly"). *"Why did you stay?"* (e.g., "Already spent so much," "Might turn around").  
  2. **Map to sunk cost moments**:  
     - **Act-level error**: Show Type B players who persisted. *"You invested 5 pts hoping to recover past losses. Did the math work?"* → Highlight: Past costs were irrelevant; only future odds mattered.  
     - **Policy-level win**: Identify Type A players who persisted to Round 4. *"You lost money for 3 rounds but won big because you held on. What made that rational?"* → *"You weren’t chasing sunk costs—you bet on improving futures."*  
  3. **Your wrinkles**:  
     - **Policy vs. Act**: *"When is it smart to have a ‘never quit’ rule? When is it dangerous?"* → Use Type A/Type B contrast.  
     - **Salvageable assets**: *"Did anyone feel their project had ‘momentum’? What if quitting killed a reusable skill/relationship?"* → Acknowledge: *Sometimes past spend builds real future options. But if it’s gone, it’s gone.*  
     - **Signaling**: *"If your partner saw your decisions, would staying signal something valuable? Does that change the math?"* → Conclude: *Signaling helps others trust you—but it’s a future benefit, not a past cost.*  
  4. **Final framing**: *"Sunk costs themselves shouldn’t decide. But ‘honoring the past’ can sometimes be rational if it unlocks futures—or if others reward your grit. The trap is confusing the two."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **"It’s only points" shrug**: → **Fix**: Award prizes to top 3 scorers. Use physical tokens. Announce leaderboard.  
  - **Loud contrarian dominates**: → **Fix**: Use secret votes (yellow cards). Have them write reasons silently first.  
  - **Player recognizes the test**: → **Fix**: Hide project types. Say: *"Businesses have unpredictable markets."* Debrief: *"Did anyone suspect hidden patterns? How did that affect choices?"* → Validates policy-level thinking.  
  - **Refuses fake stakes**: → **Fix**: Make them "banker" (track points for others). Their skepticism becomes data: *"Did anyone feel the stakes weren’t real? How would real money change this?"*  
  - **Group colludes to "beat" the game**: → **Fix**: Allow it! Then dissect: *"Did coordinating feel like a ‘policy’? Did it work?"*  

  ---

  ### **What the Activity Can’t Capture (Requires Your Words)**  
  - **The emotional weight of real sunk costs**: The game can’t replicate the shame of abandoning a degree or public project. Say: *"Unlike points, real investments carry pride or regret. That feeling can hijack logic—but the math still applies."*  
  - **Pure signaling value**: While hinted, signaling’s long-term payoff is abstract. Clarify: *"A ‘reputation for grit’ is a future asset you’re building—not a sunk cost. But if no one’s watching, it’s irrelevant."*  

  ---

  ### **Design Notes on Your Wrinkles**  
  1. **Policy vs. Act**: The Type A/B split forces this. Players *feel* the policy payoff (Type A winners) vs. act-level fallacies (Type B losers).  
  2. **"Salvageable" sunk costs**: Built into Type A—persistence unlocks late returns. Type B reinforces "true" sunk costs.  
  3. **Signaling**: Introduced in debrief; hard to gamify without complexity.  
  4. **"Is it always irrational?"**: The activity shows it’s *mathematically* irrational to factor past losses into future bets—but *strategically* rational to commit early to policies that ignore short-term noise. They’ll experience both.  

  **First-Run Tip**: Assign yourself a Type A project and model "rational persistence" when you lose early rounds. ("I’m down, but the market looks volatile—I’ll bet on a turnaround.") This nudges players toward policy thinking without lecturing.  

  ---  
  This forces them to *live* the tension: The Type B player who quits early minimizes losses (good math) but feels like a "quitter"; the Type A player who persists feels vindicated (good policy). The sunk cost pull emerges from their own voices when Type B players say, *"I couldn’t walk away after all I’d put in."* Then you reveal the hidden mechanics—and the reasons crystallize.
