prompt: |-
  I'm a staff engineer on the platform team at a consumer finance app with roughly four million monthly users. I have no philosophy background, and I'm not looking for one: I need something I can use in code and design review.

  Here is the recurring situation. Several times a month a pull request or design doc crosses my desk containing a change that steers users: a default that's been flipped, a step made easier or harder, an option pre-selected, a notification reshaped, an off-switch moved somewhere quieter, a flow that only some users see because it only "worked" on them in an experiment. Our review template has a single line about this — essentially "is this a dark pattern?" — and it is useless: nobody has ever answered yes, and the discussions that do happen collapse into competing intuitions and whoever is seniorest in the room. Meanwhile these changes ship to millions of people, are cheap to reverse in a later release but not within the sprint, and the people affected never get asked. I can block a change in review; a product manager can escalate past me to a director; legal and accessibility sign off on some of them but not on these questions.

  What I want from you is a decision procedure I can actually run, in twenty to thirty minutes, on a real proposal, with the information a platform engineer has in front of them: the diff, the experiment readout if there is one, the metrics the team is being measured on, and a rough sense of who is affected. I need it as an ordered set of questions with a stopping rule: what counts as a sufficient answer to each question, at which points the procedure returns "no" and the change doesn't ship, where it returns "ship with this modification," and where it has to stop and hand the decision to a person or a different function because the remaining question is one of values, or because it's an empirical question we cannot answer inside a sprint. I want the hand-off points named explicitly, including which of them are my organization's job to staff and which ones we're currently pretending are engineering decisions.

  Some things I've picked up second-hand, which I don't trust my own version of: that steering which leaves every option available is different in kind from removing options; that steering people toward what they themselves already want is different from steering them toward what the designer wants; that some interventions leave people better able to choose next time while others work precisely by bypassing the part of them that chooses; and that how visible the steering is matters. I don't need to know who argued what or in what year. I need the distinctions that change what I should ship, kept only if they survive being turned into a question an engineer can answer in a few minutes without a philosopher in the room — and I'd like you to tell me honestly which of the distinctions above you had to drop or mangle to make them operational, and whether there's a distinction I haven't mentioned that has to be in there.

  There are six situations my team hits repeatedly, and the procedure has to give an answer on each rather than gesture at them:

  The first is the one I distrust most: we very often claim to be serving the user's own goals while the only evidence we have is a movement in a metric we chose, which is usually correlated with revenue. I need a test, runnable with the artifacts we have, for whether we are serving the user's ends or substituting our own — and I need to know what to do when the honest answer is that we can't tell.

  The second is that many of these mechanisms only work if the user doesn't notice them, while our policy requires disclosure in release notes and the help center. This produces steering that is technically disclosed and practically undiscoverable. I want to know whether that disclosure is doing any real work on your account, or whether it's a compliance ritual — and if the latter, what the procedure demands instead.

  The third is the one I think about most and have never seen discussed. We A/B test steering changes and ship them only to the segments where they moved behavior. That means the population that actually experiences the steering is, by construction, the population susceptible to it: we are selecting for persuadability. Is that morally different from shipping the same change to everyone, and if so in which direction? Does it matter that the excluded users — the ones who weren't moved — are arguably the ones whose ends we have best evidence about?

  The fourth is asymmetry of friction. We routinely make the path we approve of smoother and the path we disapprove of rougher: cancelling a subscription, turning off a feature we believe is good for people, reaching a setting that costs us money. Sometimes added friction is a speed bump that protects someone from their own haste; sometimes it's sabotage of a choice we've technically left available. I need a rule that separates these, and I need it to be a rule and not a vibe.

  The fifth is third parties. Some of these changes help the person using the app while pushing a cost onto someone else — a slower shipping option that helps our logistics and raises costs for a driver, a snooze that moves a task onto a support agent, a default that improves one household member's outcome at another's expense. I don't know whether the procedure is allowed to count those people, and if it is, how much weight they get relative to the user.

  The sixth is the easy-looking one: cases where the user has explicitly asked us to steer them — screen-time limits, savings commitments, a self-block list that's deliberately hard to edit. I assume that's a free pass, but I've been wrong about this kind of thing before, and there are edge cases where the request was made under conditions we engineered.

  I also want to flag a structural fact about my role, because I think it should change the procedure rather than just be noted: much of what I ship is a default in a shared component or a design-system primitive used by forty-odd teams I'll never meet. So I'm not deciding one intervention; I'm deciding the path of least resistance for a whole class of future interventions, most of which I won't see, and the teams building them have less latitude to think about this than I do. If that means the procedure needs a different or stricter branch for platform-level defaults than for a single screen, say so and write that branch.

  Then I want it run on three real cases, with the verdict and the reasoning shown, no hedging into a summary of considerations:

  One: round-up savings. Spare change on each purchase is swept into a savings pot, default on at enrollment, off switch two taps inside settings, and the company earns interest on the float. It measurably increases savings balances. The team that proposed it is measured on deposits.

  Two: quiet hours in our shared notification library. Notifications are batched and badge counts suppressed, on by default for every app that adopts the library; users can disable it, but the toggle sits in a submenu. We have no evidence users want this. My own team believes it's good for them and wrote it partly for that reason.

  Three: carbon-aware shipping. The slower, cheaper delivery option is pre-selected at checkout. The experiment showed no effect overall, but a large and significant effect among users checking out on mobile late at night; the proposal is to ship the pre-selection only to that segment. It saves the company money, it genuinely reduces emissions, and it saves those users money too. I personally want to ship it. Give me the honest answer even if it is "no," and even if it is "either everyone or no one."

  Finally, on confidence: for each of the three verdicts, tell me the single argument or consideration that would most plausibly make you change it, and where in the reasoning you think the failure is most likely to be. Label which steps of the procedure rest on contested empirical claims about how people actually behave or about what our users want, as opposed to steps that follow from the conceptual distinctions alone — I want to know which parts of this I'd have to re-litigate if someone sent me a new study. Then name one class of case where you think the procedure as you've written it would give the wrong answer, and say what it is about the procedure that makes it misfire there.
reasoning: |-
  We are designing a decision procedure for evaluating user interface changes that steer user behavior. The procedure must be runnable in 20-30 minutes by an engineer with the typical artifacts (diff, experiment readout, metrics, affected user groups). It must produce clear outcomes: "no" (block), "ship", "ship with modification", or "hand off to [X]". The hand-off points must be explicit, and we must note which are the organization's responsibility to staff (e.g., legal, ethics committee) and which are currently being handled by engineering.

  The procedure is built on the following principles (distilled from the user's notes and philosophical concepts, but made operational):

  1. **Autonomy and Consent**: We respect the user's ability to make choices and their right to be informed about manipulations. We distinguish between steering that aligns with the user's own goals and steering that substitutes the designer's goals.

  2. **Transparency and Discoverability**: Disclosures must be meaningful, not just compliance rituals.

  3. **Asymmetry of Friction**: We must distinguish between friction that protects the user (e.g., from hasty decisions) and friction that obstructs a legitimate choice.

  4. **Third-Party Effects**: The procedure must account for negative externalities on third parties.

  5. **User Requests for Steering**: We allow steering when the user has explicitly asked for it, but we must verify that the request was made under fair conditions.

  6. **Platform Primitives**: Because the platform team is creating defaults and components for many teams, we apply stricter scrutiny to these changes.

  We also address the six recurring situations:

  1. **Serving user's goals vs. substituting our own**: We require evidence that the steering aligns with the user's own stated or inferred goals, not just metrics that correlate with revenue.

  2. **Disclosure that is technically present but undiscoverable**: We require that disclosures be reasonably discoverable and understandable to the affected users.

  3. **A/B testing and segment-specific shipping**: We consider whether targeting only the persuadable segment is exploitative and whether it violates equal treatment.

  4. **Asymmetric friction**: We require that friction added to a dispreferred path must be justified by a clear user benefit (e.g., protection from harm) and not merely to obstruct.

  5. **Third-party effects**: We count third-party harms and require that they be minimized and justified.

  6. **User-requested steering**: We allow it, but we check for conditions that might invalidate the request (e.g., coercion, deception).

  We now design the procedure as a series of questions. Each question must have a clear stopping rule and output.

  ---

  **Decision Procedure: Steering Change Evaluation**

  **Step 0: Preconditions**
  - The change is a user interface change that steers behavior (default, friction, preselection, etc.).
  - You have: the diff, experiment readout (if available), metrics the team is measured on, and a rough sense of affected users.

  **Step 1: Is the change at the platform level? (e.g., a default in a shared component or design-system primitive)**
     - **If yes**: Apply the stricter "platform branch" (marked with **PLATFORM** in subsequent steps). This branch requires higher evidence and more safeguards because the change will be reused in many contexts.
     - **If no**: Proceed normally.

  **Step 2: Intent and Goal Alignment**
     - *Question*: What is the stated intent of the change? Is there evidence that the steering aligns with the user's own goals (as opposed to the company's or designer's goals)?
     - *Evidence to consider*:
       - User research (e.g., surveys, interviews) showing that users want the outcome.
       - Historical data: Did users previously try to achieve this outcome and fail due to friction?
       - In the case of an A/B test, did the users in the treatment group express higher satisfaction or regret?
       - Is the metric being moved one that the user would recognize as a benefit (e.g., savings balance, reduced screen time) or one that primarily benefits the company (e.g., revenue, reduced support costs)?
     - *Stopping rules*:
       - If there is clear evidence that the change serves the user's own goal (and the goal is not one we imposed), proceed.
       - If the evidence is weak or the goal is primarily the company's (e.g., the team is measured on deposits and the change increases deposits, but without evidence that users want to save more), then:
         - **PLATFORM**: This is a fail (return "no") because platform primitives must not impose company goals by default.
         - Otherwise, go to Step 2b.
     - *Step 2b: Hand-off for intent*: If the evidence is ambiguous or we cannot determine goal alignment, hand off to a designated ethics or user advocacy function (which your organization must staff). If such a function does not exist, return "no" because we cannot assume alignment without evidence.

  **Step 3: Transparency and Discoverability**
     - *Question*: Is the steering mechanism and its effects transparent to the user? And is the disclosure reasonably discoverable?
     - *Evidence to consider*:
       - Where is the disclosure? (release notes, help center, in-app?)
       - How would a user find out about the steering? (e.g., if it's a default, is it clearly called out at the point of first use?)
       - Is the control (off-switch) easily accessible? (e.g., within two taps from a settings screen is acceptable if the setting is not critical; for critical settings, it must be more accessible.)
     - *Stopping rules*:
       - If the disclosure is prominent (e.g., in-app at the point of decision) and the control is accessible (within one tap for critical decisions, two for non-critical), proceed.
       - If the disclosure is buried (e.g., only in release notes) and the control is hard to find (more than two taps or in an unrelated menu), then:
         - **PLATFORM**: This is a fail (return "no") because platform components must set a high standard for transparency.
         - Otherwise, return "ship with modification" to require better disclosure or control placement. If the team cannot or will not modify, then "no".
       - If the steering is designed to be undetectable (e.g., it works best if the user doesn't notice), then return "no" because undiscoverable steering is inherently non-transparent.

  **Step 4: Asymmetric Friction**
     - *Question*: Does the change make one path (the one we prefer) easier and another (the one we disprefer) harder? If so, is the added friction justified by a user benefit (e.g., preventing a hasty, harmful decision) or is it merely to obstruct a legitimate choice?
     - *Evidence to consider*:
       - What is the nature of the dispreferred path? (e.g., canceling a subscription, turning off a feature)
       - Is there evidence that users who take the dispreferred path often regret it? (e.g., from surveys or re-enrollment rates)
       - Is the friction proportional to the risk? (e.g., a confirmation dialog for deleting an account is justified; making cancellation require a phone call is not.)
     - *Stopping rules*:
       - If the friction is justified by user harm prevention (with evidence) and is not excessive, proceed.
       - If the friction is primarily to obstruct a legitimate choice (e.g., to reduce cancellations without evidence that cancellations are harmful to the user), then:
         - Return "ship with modification" to remove the obstruction. If the team cannot remove it, then "no".
       - If the evidence of harm is weak, hand off to the ethics/user advocacy function (if staffed) for a judgment call. If not staffed, then "no" for platform-level changes and "ship with modification" (to reduce friction) for others.

  **Step 5: Third-Party Effects**
     - *Question*: Does the change impose costs or harms on third parties (not the user making the decision)? If so, are these costs minimized and justified?
     - *Evidence to consider*:
       - Who is affected? (e.g., drivers, support agents, family members)
       - How significant is the harm? (e.g., increased workload, financial cost)
       - Is the harm offset by a greater benefit to the user or society? (e.g., reduced emissions)
     - *Stopping rules*:
       - If there are no third-party harms, proceed.
       - If there are harms but they are minor and/or mitigated, proceed.
       - If the harms are significant and not justified by a greater good (e.g., pushing costs onto a vulnerable group without their consent), then return "ship with modification" to mitigate the harm or "no" if that's not possible.
       - **Note**: This step may require hand-off to legal or compliance if the harm is legal (e.g., labor violations). The procedure assumes that legal has already signed off, so we focus on ethical harms.

  **Step 6: User Request for Steering**
     - *Question*: Does the user have an explicit way to opt into this steering? (e.g., they set a screen-time limit)
     - *Evidence to consider*:
       - Is the request recent and made under conditions we did not manipulate? (e.g., not during a high-pressure moment we engineered)
       - Can the user easily reverse the request? (e.g., the self-block list can be edited without excessive friction)
     - *Stopping rules*:
       - If the steering is in direct response to a user request and the conditions were fair, proceed (this is a strong positive).
       - If the request was made under conditions we engineered (e.g., during a dark pattern flow), then treat it as not requested and go back to Step 2.
       - If the steering is not user-requested, proceed to the next step.

  **Step 7: Segment-Specific Shipping (if applicable)**
     - *Question*: Is the change being shipped only to a segment of users (e.g., based on A/B test results where only the persuadable segment is targeted)? If so, is this targeting justified and not exploitative?
     - *Evidence to consider*:
       - Why is the segment being targeted? (e.g., because it worked on them, or because they are vulnerable?)
       - Are the excluded users (the non-persuadable) being treated fairly? (e.g., they are not being denied a benefit they might want)
       - Does the targeting avoid exploiting a vulnerability? (e.g., targeting late-night users who might be fatigued)
     - *Stopping rules*:
       - If the change is shipped to everyone, skip.
       - If targeted, and the targeting is for efficiency (e.g., to avoid annoying users who don't respond) and there is no evidence of exploitation, proceed.
       - If the targeting is based on a vulnerable state (e.g., fatigue, stress) and the steering is not clearly in their interest, then return "no" because it is exploitative.
       - If the targeting creates an unfair advantage (e.g., showing a better deal to users who are less price-sensitive), then return "no".
       - If uncertain, hand off to the ethics/user advocacy function.

  **Step 8: Final Decision**
     - If you have reached this step without a "no", "ship with modification", or hand-off, then the answer is "ship".
     - If there were modifications required and they are made, then "ship".

  ---

  **Hand-off Points and Responsibilities**

  The procedure identifies the following hand-off points:

  1. **Step 2b: Goal Alignment Ambiguity** → Hand off to an **Ethics/User Advocacy Function** (organization must staff this; currently, if not staffed, we default to "no" for platform and ambiguous cases).
  2. **Step 4: Asymmetric Friction Justification** → Hand off to **Ethics/User Advocacy Function** (if evidence of harm prevention is weak).
  3. **Step 5: Significant Third-Party Harms** → Hand off to **Legal/Compliance** (if not already done) and **Ethics/User Advocacy Function** for trade-offs.
  4. **Step 7: Segment-Specific Shipping Concerns** → Hand off to **Ethics/User Advocacy Function**.

  The organization must staff the Ethics/User Advocacy Function. Until then, the procedure defaults to "no" in ambiguous cases for platform changes and requires modification or blocks for others.

  ---

  **Distinctions We Had to Mangle or Drop**

  1. **Bypassing vs. Enhancing Choice**: We operationalized this through transparency (Step 3) and friction justification (Step 4). We dropped the nuanced idea of "leaving people better able to choose next time" because it's hard to measure in a review. Instead, we focus on whether the user can easily reverse the decision (part of Step 3 and Step 6).

  2. **User's Own Goals**: We require evidence (Step 2) but had to mangle it into a binary (clear evidence or not) because we don't have time for deep analysis. We rely on hand-off when ambiguous.

  3. **Persuadability and A/B Testing**: We addressed it in Step 7, but we had to simplify the moral question by focusing on exploitation and fairness. The deeper issue of whether we are respecting the user's ends by excluding non-persuadable users is partially captured by asking if the non-persuadable might want the benefit.

  ---

  **Running the Cases**

  **Case 1: Round-up savings**
  - Default on at enrollment, off switch two taps inside settings. Company earns interest. Team measured on deposits.

  **Procedure:**
  1. **Platform?** Yes (if it's a platform component for savings features). **PLATFORM branch applies.**
  2. **Step 2 (Intent)**: What is the evidence that users want to save spare change? The experiment shows increased savings balances, but the team is measured on deposits. Without evidence from user research (e.g., that users expressed a desire to save more or regretted not saving), this is ambiguous. **PLATFORM: Fail (no) without evidence of user goal alignment.** Hand-off to ethics if available, else no.
     - *Verdict so far*: Block (no) because platform default without clear user goal alignment.
     - *Reasoning*: The team's metric (deposits) is company-aligned, not necessarily user-aligned. Users might not want this saving or might be unaware of the default. Without evidence, we cannot assume alignment.

  **Stop at Step 2: "no"**

  **Case 2: Quiet hours in shared notification library**
  - On by default for every app that adopts the library; toggle in a submenu. No evidence users want this. Platform team believes it's good for them.

  **Procedure:**
  1. **Platform?** Yes (shared library). **PLATFORM branch applies.**
  2. **Step 2 (Intent)**: No evidence users want this. The team's belief is not evidence. Without user research showing that users want fewer notifications or that they are overwhelmed, we cannot assume alignment. **PLATFORM: Fail (no) at Step 2.**
     - *Verdict so far*: Block (no).
     - *Reasoning*: Platform-level defaults must be backed by evidence of user goals. We cannot impose what we think is good without evidence.

  **Stop at Step 2: "no"**

  **Case 3: Carbon-aware shipping**
  - Pre-select slower, cheaper delivery option. Experiment showed effect only on mobile users late at night. Proposal: ship only to that segment. Saves company money, reduces emissions, saves users money.

  **Procedure:**
  1. **Platform?** No (assuming this is a checkout feature, not a platform primitive). Proceed normally.
  2. **Step 2 (Intent)**: The change saves users money and reduces emissions. We can infer that users generally want to save money. But note: the experiment showed no effect overall, meaning most users did not choose this option when presented. However, we are targeting only the segment that did respond (late-night mobile). We need to check if the segment's response is evidence of their goal. Since the option saves them money and they chose it when pre-selected, we can tentatively say it aligns with their goal (saving money). Proceed.
  3. **Step 3 (Transparency)**: The pre-selection should be transparent (e.g., the user sees the preselected option at checkout). The control: can the user easily choose the faster option? Assuming it's one click to change, and the preselection is obvious, then transparency is acceptable. Proceed.
  4. **Step 4 (Friction)**: There is asymmetric friction: the slower option is easier. But the friction is minimal (one click) and the faster option is still available. We must justify why we are making the slower option the default. The justification is that it saves money and reduces emissions. But note: the user might value speed over money, especially if they are in a hurry. Since we are only doing this for late-night mobile users (who might be less hurried?), and the experiment showed they didn't mind, it might be acceptable. However, without evidence that the user benefits from this default (e.g., they save money and are happy), we cannot be sure. But Step 2 passed. Proceed.
  5. **Step 5 (Third-party effects)**: The slower option might affect delivery drivers (e.g., by spreading out deliveries). However, it reduces emissions, which is a societal benefit. The harm to drivers is unclear and likely minor. Proceed.
  6. **Step 6 (User request)**: Not applicable.
  7. **Step 7 (Segment-specific)**: We are targeting only late-night mobile users. Why? Because it worked on them. But is this exploitative? Late-night users might be fatigued and more susceptible. We are steering them toward a cheaper option, which is good for them, but we are doing it by taking advantage of their state? However, we have evidence that they did not regret it (the experiment showed no negative feedback?). But the proposal lacks data on satisfaction. Without evidence that they are not being exploited, we must be cautious. 
     - *Stopping rule*: If targeting is based on a vulnerable state (fatigue) and we don't have clear evidence of benefit to them, it could be exploitative. Since we have no satisfaction data, hand off to ethics/user advocacy. If not staffed, we might allow it because the outcome is beneficial (saves money, reduces emissions) and the harm is minimal (one click to change). But the procedure requires that we avoid exploiting vulnerability. 
     - *Hand-off*: If ethics function exists, hand off. If not, because the outcome is beneficial and the steering is light, we might say "ship". But note: the procedure in Step 7 says "no" if targeting is based on vulnerability without justification. Here, we have justification (it works and benefits the user) but we don't know if it's exploitative. 
     - *Verdict*: Without an ethics function, we must decide. Given the benefits, we might allow it, but the procedure is strict: Step 7 says if there is a vulnerable state and the steering is not clearly in their interest (we have evidence of behavior change but not of their satisfaction), then "no". Alternatively, we could require a modification: run a satisfaction survey on the targeted segment before shipping. But the question says we must answer in the sprint. 
     - *Final decision*: Hand off to ethics if available. If not, and since we are not in the platform branch, we might say "ship" but with a follow-up survey. However, the procedure doesn't allow conditional shipping. Therefore, if no ethics function, we return "ship" with a note to monitor satisfaction? But the procedure doesn't have that. To be safe: **Hand off to ethics function. If not staffed, then we must block because we cannot confirm non-exploitation.**

  Given the time constraint and the lack of an ethics function, the procedure would return "no" for this step? But let me re-read Step 7 stopping rules:

  - "If the targeting is based on a vulnerable state (e.g., fatigue, stress) and the steering is not clearly in their interest, then return 'no'".

  Is the steering clearly in their interest? It saves them money and reduces emissions, which are generally good. But we don't know if they value it. The experiment only showed they didn't change it back. We have no satisfaction data. So it's not clearly in their interest? We are assuming. So we must say "no".

  Alternatively, we could say that saving money is always in their interest? But that's paternalistic. Without evidence, we cannot assume.

  **Verdict: "no"** because of Step 7 (targeting a potentially vulnerable segment without clear evidence of benefit to them and without an ethics function to approve).

  But note: the user says they want to ship it. The procedure must be followed.

  **Final verdict for Case 3: "no"** (due to Step 7) if no ethics function. If there is an ethics function, hand off.

  ---

  **Confidence in Verdicts**

  **Case 1 (Round-up): "no"**
  - **Weakest point**: Step 2 requires evidence of user goals. If the team can provide user research showing that a majority of users want to save spare change (e.g., from a survey), then we might allow it. The failure point is the lack of evidence.
  - **Empirical claim**: The claim that "users want to save more" is empirical and contestable. New evidence could change the verdict.

  **Case 2 (Quiet hours): "no"**
  - **Weakest point**: Step 2 again. If the platform team can provide evidence that users are overwhelmed by notifications (e.g., from surveys or high opt-out rates), then it might pass.
  - **Empirical claim**: The claim that "users want fewer notifications by default" is empirical.

  **Case 3 (Carbon-aware): "no"**
  - **Weakest point**: Step 7. If we had evidence that late-night mobile users were satisfied with the preselection (e.g., from a survey in the experiment), then we could say it's not exploitative. Also, if we ship to everyone, it would pass Step 7 (since no targeting) but might fail Step 2 for the non-responsive segments? But the experiment showed no effect overall, meaning for non-late-night users, the preselection didn't change behavior. So shipping to everyone might be acceptable? However, the proposal is to ship only to the segment. Alternatively, if the company staffs an ethics function, we can hand off.
  - **Empirical claim**: The claim that "targeting late-night mobile users exploits fatigue" is empirical. A study showing that these users are not more vulnerable or that they appreciate the default would change the verdict.

  **Class of Case Where the Procedure Might Misfire**

  **Case**: A change that is clearly in the user's interest but the evidence is not available in the sprint (e.g., a life-saving feature). The procedure might block it due to lack of evidence in Step 2. But the cost of delay is high.

  **Why it misfires**: The procedure is designed for low-stakes, high-volume changes and errs on the side of caution. It does not account for emergency situations or high-benefit scenarios without evidence.

  **Mitigation**: The hand-off to ethics could be used for such cases, but it must be staffed and responsive.
answer: |-
  Below is a **decision procedure** tailored to your requirements. It's designed as an ordered set of questions with explicit stopping rules, hand-off points, and outputs ("no", "ship", "ship with modification", or "hand off"). The procedure focuses on **operationalizing ethical distinctions** into questions engineers can answer in 20-30 minutes using typical artifacts (diffs, experiment readouts, metrics, user segments). It prioritizes **practicality** over philosophy, with clear thresholds for evidence and action.

  Distinctions from your query that survived (and how they were operationalized):
  - **User's goals vs. designer's goals**: Q2 uses artifacts to test alignment.
  - **Visibility of steering**: Q3 defines "meaningful disclosure" operationally.
  - **Asymmetric friction**: Q4 uses a harm-prevention threshold.
  - **Third-party costs**: Q5 assigns explicit weight (equal to the user).
  - **User-requested steering**: Q6 adds checks for coercion.
  - **Segment-specific shipping**: Q7 tests for exploitation (not persuadability).

  Distinctions dropped or mangled:
  - **"Bypassing the part that chooses"**: Too abstract. Replaced with Q3 (discoverability) and Q4 (friction as sabotage).
  - **"Leaves options available"**: Not a useful distinction alone (e.g., an option can be technically available but buried). Folded into Q3 and Q4.
  - **"Evidence about excluded users"** (from A/B tests): Not operationalizable in your time frame. Replaced with Q7’s exploitation test.

  New distinction added:
  - **Platform primitives**: Stricter rules at Q0 and Q1 (since they enable future dark patterns).

  ---

  ### **Decision Procedure: Steering Change Evaluation**
  **Time budget**: 20-30 mins.  
  **Inputs**: Diff, experiment readout (if any), team metrics, affected user segments.  
  **Outputs**: 
  - `no` (block the change)
  - `ship` (approve as-is)
  - `ship with modification` (approve only if specific change is made)
  - `hand off to [function]` (not an engineering decision)

  **Hand-off points** (your org must staff these; if unstaffed, default to `no` for platform/ambiguous cases):
  - `hand off to Ethics/User Advocacy`: For ambiguous values trade-offs (staffed by your org).
  - `hand off to Legal`: For unresolved third-party harms (already in your workflow, but we enforce escalation).
  - `hand off to Product Leadership`: For business-revenue conflicts (staffed by your org).

  ---

  #### **Q0: Is this a platform-level primitive?**  
  *(Shared component, design-system default, or infrastructure enabling future steering)*  
  - **Sufficient answer**: Yes (if change affects >1 team/reuse) or No.  
  - **Stopping rule**:  
    - If **Yes**, apply **stricter thresholds** (noted in **bold**) for all subsequent questions.  
    - If **No**, proceed normally.  
  - **Output**: Proceed to Q1.

  ---

  #### **Q1: What is the change's primary effect?**  
  *(Categorize to flag high-risk cases early)*  
  - **Sufficient answer**:  
    - "Revenue" (e.g., increases conversion, reduces refunds).  
    - "User benefit" (e.g., saves time, improves well-being).  
    - "Both" (e.g., saves money for user and company).  
  - **Stopping rule**:  
    - If **"Revenue"** and **platform-level**, proceed to Q2 (strict scrutiny).  
    - If **"User benefit"** or **"Both"**, proceed to Q2.  
  - **Output**: Proceed to Q2.  
  - **Why**: No block yet—revenue alone isn’t evil, but it triggers skepticism in Q2.

  ---

  #### **Q2: Is there evidence the steering aligns with the user's own goals?**  
  *(Test: Are we serving the user or substituting our goals?)*  
  - **Sufficient answer**:  
    - **Evidence required**: User research (e.g., surveys, interviews), prior behavior (e.g., failed attempts to achieve this), or experiment metrics showing user satisfaction (e.g., reduced complaints, increased retention).  
    - **Insufficient evidence**: Team metrics alone (e.g., "deposits increased"), correlation with revenue, or assumptions about "good for users."  
  - **Stopping rules**:  
    - If evidence shows alignment (e.g., users asked for this, or experiment shows high satisfaction), proceed to Q3.  
    - If **no evidence** and change is **platform-level**: `no` (platform defaults can’t assume goals).  
    - If **no evidence** and not platform: `hand off to Ethics/User Advocacy`.  
    - If **evidence conflicts with team metrics** (e.g., deposits up but complaints up): `no`.  
    - If **ambiguous** (e.g., weak/inconclusive evidence): `hand off to Ethics/User Advocacy`.  
  - **Output**: Proceed if not stopped.  
  - **Mangled distinction**: We assume "user goals" are knowable from artifacts. If goals are unmeasurable (e.g., existential well-being), we err toward `no` for platform/`hand off` otherwise.

  ---

  #### **Q3: Is the steering meaningfully disclosed and controllable?**  
  *(Test: Is disclosure a compliance ritual or actually discoverable?)*  
  - **Sufficient answer**:  
    - **Meaningful disclosure**: In-app (not just help center/release notes), at point of decision or first use, in <2 taps.  
    - **Control**: Off-switch in a "logical" settings location (<2 taps from relevant screen; not buried in submenus).  
  - **Stopping rules**:  
    - If **disclosed in-app AND control accessible**: Proceed to Q4.  
    - If **disclosed but undiscoverable** (e.g., help center only) OR **control hard to find**:  
      - If **platform-level**: `no` (platform must exemplify transparency).  
      - If not: `ship with modification` (require in-app disclosure + better control placement).  
    - If **steering designed to be undetectable** (e.g., "works best if user doesn’t notice"): `no`.  
  - **Output**: Proceed if not stopped.  
  - **Why**: Disclosure must do real work—else it’s dark.

  ---

  #### **Q4: Does asymmetric friction prevent harm or sabotage choice?**  
  *(Test: Is friction a speed bump or a barrier?)*  
  - **Sufficient answer**:  
    - **Harm prevention**: Evidence of user regret (e.g., high re-subscription rates after cancellation), safety risks (e.g., financial loss), or legal requirements.  
    - **Sabotage**: Friction that only serves business (e.g., "reduce cancellations" without user benefit).  
  - **Stopping rules**:  
    - If friction is **justified by harm prevention** (with evidence): Proceed to Q5.  
    - If friction **lacks evidence of user benefit**:  
      - If **platform-level**: `no` (platform can’t normalize obstruction).  
      - If not: `ship with modification` (remove friction unless evidence provided).  
    - If friction is **extreme** (e.g., >5 steps, phone call required): `no` regardless.  
  - **Output**: Proceed if not stopped.  
  - **New rule**: "Harm prevention" must be evidenced—no vibes.

  ---

  #### **Q5: Does the change push costs to third parties?**  
  *(Test: Are we externalizing harms?)*  
  - **Sufficient answer**: Identify affected parties (e.g., drivers, family, support agents). Estimate cost severity (e.g., time, money, stress).  
  - **Stopping rules**:  
    - If **no third-party costs**: Proceed to Q6.  
    - If **costs are minor/mitigated** (e.g., <10% time increase with compensation): Proceed to Q6.  
    - If **costs are significant and unmitigated** (e.g., unpaid labor, household conflict):  
      - `hand off to Legal` if unresolved.  
      - After Legal, if unresolved: `ship with modification` (add mitigations) or `no`.  
    - **Weighting**: Third parties get **equal weight** to the user. If user benefit ≠ third-party harm, `hand off to Ethics/User Advocacy`.  
  - **Output**: Proceed if not stopped.  
  - **Why**: Externalities are engineering problems when they violate laws/fairness.

  ---

  #### **Q6: Did the user explicitly request this steering?**  
  *(Test: Is consent genuine?)*  
  - **Sufficient answer**:  
    - **Requested**: User opted in (e.g., enabled screen-time limits) in a neutral context (not during high-pressure flow).  
    - **Reversible**: Control is accessible (per Q3).  
  - **Stopping rules**:  
    - If **requested AND reversible**: `ship` (skip to end).  
    - If **requested but irreversible/coerced** (e.g., asked during upsell flow): Treat as **not requested** and proceed to Q7.  
    - If **not requested**: Proceed to Q7.  
  - **Output**: Proceed to Q7 if not shipped.  
  - **Edge case handled**: "Engineered" requests fail consent.

  ---

  #### **Q7: If shipping to a segment, does it exploit vulnerability?**  
  *(Test: Is targeting the persuadable segment unfair or predatory?)*  
  - **Sufficient answer**:  
    - **Exploitative**: Segment is in a vulnerable state (e.g., late-night, cognitive load) AND steering benefits the company more than the user.  
    - **Benign**: Segment is contextually appropriate (e.g., "new users" for onboarding) OR user/company benefit is aligned.  
  - **Stopping rules**:  
    - If **shipping to all**: Proceed to final decision.  
    - If **targeting segment**:  
      - If **not exploitative** (e.g., user benefit clear, no vulnerability): Proceed to final decision.  
      - If **exploitative** (e.g., targets fatigued users for company gain): `no`.  
      - If **ambiguous**: `hand off to Ethics/User Advocacy`.  
  - **Output**: Proceed to final decision.  
  - **Mangled distinction**: We ignore "evidence about excluded users" (too speculative). Focus on exploitation risk.

  ---

  #### **Final Decision**  
  - If all questions passed: `ship`.  
  - If `ship with modification` was output and modification is made: `ship`.  
  - Else: Honor prior output (`no` or `hand off`).

  ---

  ### **Applied to Your Three Cases**
  **Assumption**: No ethics function is staffed (default to `no` for ambiguities).

  #### **Case 1: Round-up savings**  
  - **Q0 (Platform)**: Yes (default at enrollment → stricter rules).  
  - **Q1 (Effect)**: Both (savings + revenue from float).  
  - **Q2 (User goals)**: No evidence of alignment. Experiment shows increased balances, but team measured on deposits. No user research/satisfaction data. → **Platform: `no`**.  
  - **Stop**.  
  - **Verdict**: `no`.  
  - **Reasoning**: Platform default with no evidence users want round-ups. Team’s revenue metric dominates.  

  **Weakest point**: Q2 (empirical). If team provides user surveys showing >60% of new users want automated savings, verdict could flip. Failure likely in evidence threshold.

  ---

  #### **Case 2: Quiet hours in notification library**  
  - **Q0 (Platform)**: Yes (shared library default → stricter rules).  
  - **Q1 (Effect)**: User benefit (assumed).  
  - **Q2 (User goals)**: No evidence users want this. Team’s belief ≠ evidence. → **Platform: `no`**.  
  - **Stop**.  
  - **Verdict**: `no`.  
  - **Reasoning**: Platform default imposing "good for you" without evidence.  

  **Weakest point**: Q2 (empirical). If data shows >30% of users disable notifications daily, it might pass. Failure likely in assuming benevolence is sufficient.

  ---

  #### **Case 3: Carbon-aware shipping (segment-targeted)**  
  - **Q0 (Platform)**: No (feature, not primitive).  
  - **Q1 (Effect)**: Both (saves $ for user/company, reduces emissions).  
  - **Q2 (User goals)**: Weak evidence. Experiment shows mobile/late-night users didn’t revert selection, but no satisfaction data. → Proceed (benefit plausible).  
  - **Q3 (Disclosure)**: Preselection is visible at checkout. Control: one click to change → Pass.  
  - **Q4 (Friction)**: Asymmetric but minor (one click) and justified (emissions reduction) → Pass.  
  - **Q5 (Third parties)**: Drivers may have longer routes, but emissions benefit society → Pass.  
  - **Q6 (Requested)**: No → Proceed.  
  - **Q7 (Segment)**: Targets late-night mobile users (vulnerable to fatigue?). Benefit aligned (saves $, emissions), but targets fatigued users for company gain (saves $). Ambiguous → **No ethics function: `no`** (risk of exploitation).  
  - **Verdict**: `no`.  
  - **Reasoning**: Segment targeting exploits potentially vulnerable users for company benefit without clear consent.  

  **Weakest point**: Q7 (empirical + values). If experiment included satisfaction (e.g., "90% of segment liked this"), it might pass. If shipped to all, verdict would be `ship` (no exploitation risk). Failure likely in exploitation threshold.

  ---

  ### **Confidence Assessment**
  - **Contested empirical claims** (require studies to litigate):  
    - Q2 (user goals), Q4 (harm prevention), Q7 (exploitation).  
    - Relies on observable evidence in artifacts.  
  - **Conceptual distinctions** (stable if evidence clear):  
    - Q3 (discoverability), Q5 (third-party weight), Q6 (consent).  
  - **Class of case where procedure misfires**:  
    - **High-urgency, low-evidence user benefits** (e.g., fraud prevention steering with no time for testing).  
    - **Why it misfires**: Procedure defaults to `no` without evidence (Q2) or forces hand-off.  
    - **Fix**: Emergency override (not included—assumes non-critical changes).
