prompt: |-
  I'm an undergraduate in a political theory seminar this term on whether the left-right distinction picks out anything real, and alongside the seminar I work about ten hours a week for a small nonprofit that maintains a Where do you stand? classroom tool: a bank of roughly eighty policy items, each tagged left, right, cross-cutting, or off-axis, that teachers run with high-school civics classes. My job, shared with two other interns who have no background in political theory, is to tag new items whenever an issue enters the news, which happens every week or two. The stakes are not trivial but not enormous: a miscoded item produces angry emails from parents, and a few years ago an item we tagged as cross-cutting was pulled from two districts after complaints, so our faculty advisor, a comparative politics professor, now has to sign off on anything we flag as difficult. We have about fifteen minutes per item, no budget for research, and often we cannot look up how parties abroad have lined up on the issue, so the procedure has to say what to do when the answer is simply unavailable to us rather than assuming an encyclopedia.

  What I need is a procedure we can actually run, grounded in the theories we have read rather than in vibes. In the seminar we have looked at the equality criterion defended in Bobbio's short book on the distinction, at the view that left and right are better understood as attitudes toward hierarchy and toward change versus preservation, at the skeptical view that each side is only a contingent coalition of positions that happens to have been assembled in a particular place and could come apart, at the two-axis alternative that adds a traditional-versus-secular or authoritarian-versus-libertarian dimension, and at the psychological suggestion that what holds a side together is a stable dispositional orientation rather than a principle. Please turn whatever is genuinely usable in that material into an ordered set of questions for us, and tell us which distinctions have to survive the simplification and which we can drop. In particular, tell us what has to be true of a new issue for it to go on the axis at all, and what has to be true for it to be marked cross-cutting or dropped as a valence item that nobody of any significance opposes. We have been using three rough tests and I suspect at least one is junk: the enemy test, where we code an issue by who is currently attacking it; the time-machine test, where we ask whether the issue would still have clustered with the same side if the last big party realignment had gone the other way; and the blind-pairing test, where we ask whether knowing someone's answer to the new item would let us predict their answers to two items we have already coded better than chance. Tell us which of these tracks what actually holds a side together and which merely inherits whatever coalition happens to exist right now, and where a test fails say so plainly. Mark explicitly the points at which the procedure stops with a no, and the points at which it has to hand the decision to our advisor because the question is one of values rather than facts — for instance, whose description of a proposal we adopt when one side calls a measure protective and the other calls it authoritarian.

  Then please run the procedure on three live items. First: eliminating single-family-only zoning near transit stations, so that apartment buildings can be built as of right. Second: requiring developers of frontier AI systems to obtain a license before training runs above a certain compute threshold, with a pause on the largest runs. Third: requiring photographic identification to vote, which our team has always treated as straightforwardly right-coded and which is our single most complained-about item. I should say that our working assumption is that the axis is largely exhausted and that our tags just describe current American coalitions, and I would rather not be told that our most contested item is an artifact of one country's party system, or that our whole US item set would fail a cross-national check — but if that is what the procedure delivers, please say it directly rather than softening it, since I would rather find out now than in a parent's email. I also want to know, honestly, what the procedure cannot do: which items will always be arbitrary, how often we should re-code the bank, and how to handle a case where my two co-interns reach different tags. One formatting note: please write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, because I have to paste it into our intern handbook as a single block of text and anything with markup in it renders badly.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're an undergraduate in a political theory seminar, but their immediate need is practical: developing a reliable procedure for tagging policy items for a classroom tool used in high school civics classes. The challenge is to translate complex theoretical concepts into a step-by-step process that can be applied quickly with limited resources.

  First, I need to recall the theories mentioned: Bobbio's equality criterion, hierarchy/change vs preservation, coalitional views, two-axis models, and psychological dispositions. The key is to extract what's actionable from these while acknowledging their limitations. The user wants to avoid "vibes," so the procedure must be grounded in theory but simplified for real-world application.

  The user mentioned three existing tests: enemy, time-machine, and blind-pairing. I need to evaluate which of these actually reflect the enduring aspects of the left-right distinction versus those that just mirror current coalitions. For instance, the enemy test seems reactive to current politics, while the time-machine test might better capture ideological alignment. The blind-pairing test could reinforce existing biases if not used carefully.

  Next, structuring the procedure. It needs clear decision points where an item gets a definite tag, gets rejected as off-axis, or gets flagged for the advisor. The critical part is defining when an issue belongs on the axis at all. Bobbio's equality and hierarchy theories suggest that core issues must involve fundamental social organization or resource distribution. Valence issues are those with no significant opposition, like disaster relief.

  For cross-cutting issues, they need to split traditional coalitions. The procedure should identify when an issue doesn't align neatly with either side. The advisor should handle cases where the framing is contested—like "protective" vs "authoritarian"—since that's a values judgment.

  Now, applying the procedure to the three test items. For zoning reform, it's about reducing inequality by increasing housing access, aligning with left principles. The AI licensing involves innovation vs risk, but it's more about regulation for public safety, possibly cross-cutting if it splits both sides. Voter ID is tricky; framed as preventing fraud (right) or suppressing votes (left). Since the tool uses current US coalitions, it stays right-coded, but the advisor might need to address framing.

  The user's deeper needs include avoiding parental complaints and ensuring the tool's credibility. They need transparency about limitations—some items will be arbitrary, re-coding frequency depends on realignments, and conflicts between interns should go to the advisor. Honesty about the procedure's reliance on current US politics is crucial, even if it's not universal.

  Finally, ensuring the response is prose-only per formatting needs, with clear explanations and no markdown. Balancing theoretical integrity with practicality is key, acknowledging where the procedure can't resolve ambiguities.
answer: |-
  Here is a procedure derived from the seminar's theoretical foundations, designed for practical application within your constraints. It prioritizes Bobbio's core criterion of attitudes towards equality (and its close relative, hierarchy) as the most durable anchor for the axis, supplemented by the coalitional and psychological insights. The two-axis model informs the definition of cross-cutting issues. We drop the "change vs. preservation" dimension as too context-dependent and often subsumed under equality/hierarchy struggles. The psychological disposition view helps explain coalition stability but offers less direct guidance for tagging new items.

  **The Procedure:**

  Begin by clearly defining the policy item neutrally. Avoid terms loaded with partisan framing (e.g., "voter integrity" vs. "voter suppression"). If the item inherently uses such framing ("requiring photographic identification to vote" is acceptable; "requiring voter ID to prevent fraud" is not), use the neutral structure. If you cannot define it neutrally without losing meaning, flag it immediately for the advisor, as this is a values judgment about framing. Assuming a neutral definition:

  1.  **Valence Check:** Is there significant, organized political opposition to this policy *in principle*? Not just disagreement on implementation details, but on the core goal. If virtually all significant political actors across the spectrum support the *principle* (e.g., "disaster relief should be provided"), tag it as **Off-Axis (Valence)**. Stop. If there is significant principled opposition, proceed. *This step ensures the axis is only used where genuine conflict exists.*

  2.  **Core Alignment Test (Equality/Hierarchy):** Does the policy primarily aim to reduce social or economic inequalities or challenge established social hierarchies (Left), or does it primarily aim to preserve existing hierarchies, traditional social orders, or justify inequalities based on merit, tradition, or market outcomes (Right)? Focus on the *intended primary effect* as argued by proponents. If the primary effect clearly aligns with reducing inequality/challenging hierarchy, tag **Left**. If the primary effect clearly aligns with preserving hierarchy/justifying inequality, tag **Right**. Proceed only if the primary effect is ambiguous or contested.

  3.  **Coalitional Stability Test (Modified Time-Machine):** If Step 2 is ambiguous, ask: *If the major party coalitions in the US were to realign significantly tomorrow (e.g., parties swap positions on several major issues like in the mid-20th century), is it likely this specific policy would still find its primary proponents clustered with the same *core ideological disposition* (i.e., the side focused on reducing hierarchy/inequality or the side focused on preserving/justifying it)?* This focuses on the underlying disposition (Bobbio + Psychological) rather than the current coalition. If yes, tag based on which core disposition it aligns with (**Left** or **Right**). If no, or if it's highly uncertain, proceed. *This is where the "time-machine" test becomes useful, but reframed around the core ideological disposition, not the current coalition membership.*

  4.  **Cross-Cutting Test:** If the policy passes the Valence Check (has opposition) but fails to align clearly on the Core Alignment Test and appears unstable in the Coalitional Stability Test, ask: Does this policy *predictably split* the traditional Left and Right coalitions in the US? That is, do significant factions *within* the current Left coalition reliably oppose it, and/or do significant factions *within* the current Right coalition reliably support it (or vice-versa)? If yes, tag **Cross-Cutting**. If not, proceed. *This draws on the two-axis model and coalitional skepticism.*

  5.  **Blind-Pairing Predictive Check (Use Sparingly):** If the policy *still* remains unclassified after Steps 1-4, use the blind-pairing test as a last resort. Does knowing someone's stance on this new item significantly predict (better than chance) their stance on *two or more core items already reliably tagged as Left or Right* (e.g., progressive taxation, environmental regulation, abortion access, gun rights)? If it strongly predicts alignment with core Left items, tag **Left**. If it strongly predicts alignment with core Right items, tag **Right**. If predictions are weak, inconsistent, or predict a mix, tag **Cross-Cutting**. *This test is weak because it inherits current coalitional alignment; use only when theory fails.*

  6.  **Advisor Referral:** Flag the item for the advisor if:
      *   The neutral definition is impossible without adopting a contested framing (values judgment).
      *   Step 2 (Core Alignment) involves a fundamental dispute about the policy's *primary intended effect* that cannot be resolved factually (e.g., is a regulation "protective" or "authoritarian"?).
      *   There is significant, credible evidence that the international alignment (if easily accessible within your time limit) *fundamentally contradicts* the apparent US alignment, suggesting the US position might be anomalous. Otherwise, assume US coalition for practicality.
      *   You lack sufficient information to make even an educated guess at any step (rare, given Step 1 often catches valence issues).

  **Evaluating Your Tests:**

  *   **Enemy Test (Who attacks it?):** **Junk for theoretical grounding.** It purely reflects the *current contingent coalition* and media framing. It tells you who opposes it *now*, not why or if it's core to an ideology. Avoid.
  *   **Time-Machine Test (Realignment):** **Valuable, but needs refinement.** Your original version risks circularity. The modified version in Step 3, anchored to the *core disposition* (equality/hierarchy), is useful. It helps discern if the policy's alignment is durable or contingent.
  *   **Blind-Pairing Test (Predictiveness):** **Weak but occasionally necessary.** It directly measures current coalitional alignment, not underlying principle. It risks perpetuating coding errors in the existing bank. Use only as a last resort (Step 5).

  **Applying the Procedure to Live Items:**

  1.  **Eliminating single-family-only zoning near transit stations:**
      *   Valence Check: Significant, organized opposition exists (homeowner groups, some local govts).
      *   Core Alignment: Proponents primarily aim to increase housing supply/affordability, reducing economic inequality and challenging exclusionary hierarchies embedded in zoning. Primary effect aligns with reducing inequality/hierarchy. Tag: **Left**.

  2.  **Licensing/Pause for Frontier AI Training:**
      *   Valence Check: Significant, organized opposition exists (parts of tech industry, libertarians).
      *   Core Alignment: Ambiguous. Proponents argue for safety/preventing harm (could align with left regulation for public good or conservative precautionary principle). Opponents argue for innovation/freedom (could align with right-leaning deregulation or techno-optimism often found across spectrum). Primary intended effect (safety vs. stifling innovation) is contested.
      *   Coalitional Stability Test: Highly uncertain. Would a differently aligned "pro-equality" party automatically support heavy AI regulation? Would a differently aligned "pro-hierarchy/tradition" party automatically oppose it? Not clear. Regulation of powerful new technologies doesn't map cleanly onto the equality/hierarchy axis alone.
      *   Cross-Cutting Test: Currently, it splits both coalitions (some Dems/left wary of stifling innovation or jobs, some GOP/right concerned about existential risk or national security). Tag: **Cross-Cutting**. (This might stabilize later, requiring re-coding).

  3.  **Requiring Photographic Identification to Vote:**
      *   Valence Check: Significant, organized opposition exists.
      *   Core Alignment: *Highly contested framing.* Proponents frame it as preventing fraud (preserving integrity of the system – could lean Right as preserving order). Opponents frame it as creating barriers (increasing inequality in voting access – leans Left as challenging a hierarchy of access). **This is a fundamental values judgment about the primary effect.** Stop. **Flag for Advisor.** *Rationale:* The core dispute *is* whether the primary effect is protective (Right-aligned) or suppressive (Left-aligned). Your current "straightforwardly right-coded" tag adopts the proponents' framing implicitly. The advisor must make the values judgment on which framing/primary effect to prioritize for the educational tool, acknowledging the controversy exists. *Do not* rely solely on current coalition (enemy test) or blind pairing.

  **What the Procedure Cannot Do & Handling Issues:**

  *   **Arbitrary Items:** Some items will inevitably fall into the grey areas of Steps 3 & 4. The Core Alignment Test (Step 2) is interpretive. Cross-cutting tags involve judgment calls. Values judgments (Step 6) are unavoidable.
  *   **Re-coding Frequency:** Re-code the bank when a *major, sustained shift* occurs in the alignment of a policy within the US coalition (e.g., a party flips position and maintains it for an election cycle+), or if new information clarifies a previously ambiguous Core Alignment. Don't chase every news cycle. Major realignments are rare. Review potentially volatile areas (like tech regulation) annually.
  *   **Intern Disagreements:** If two interns reach different tags after applying the procedure:
      *   Have them identify the exact step where they diverged.
      *   If divergence is at Step 2 (Core Alignment) or involves framing (Step 6 referral point), escalate immediately to the advisor.
      *   If divergence is at Step 3, 4, or 5, briefly discuss the reasoning. If consensus isn't reached quickly (within 5 mins), escalate to the advisor.
      *   Document the disagreement and resolution for future reference.
  *   **Limitations & Honesty:**
      *   The procedure is optimized for speed and the *current US political coalition*. It explicitly assumes the axis is meaningful primarily within this context for your practical purpose. It *will* produce results that might not hold cross-nationally (e.g., your Voter ID item *is* largely an artifact of the specific history and current strategy of the US party system). The procedure flags this when framing is contested (Step 6).
      *   It relies heavily on Step 2 (Equality/Hierarchy), which is a simplification but the most theoretically grounded anchor available.
      *   It cannot resolve deep philosophical debates about the nature of left/right. It provides a pragmatic, theory-informed method for consistent coding within your constraints.
      *   Expect some parent complaints regardless; the procedure minimizes errors but cannot eliminate controversy inherent in politics. Clear documentation of your steps is your best defense. The advisor sign-off on difficult items is crucial for legitimacy.
