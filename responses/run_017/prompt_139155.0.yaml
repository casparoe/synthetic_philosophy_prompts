  ## Aunt Effie's Ephemera

  **Headline: Lost Feelings, Phantom Pains, and the Boyfriend Who Thinks He’s Clever**

  Right then, dears. Kettle’s just boiled for the third time this hour – heavens know why the switch keeps getting flicked – and the budgie’s doing its level best to recreate the siege of Stalingrad against its cuttlefish. Let’s see what’s fluttered onto the metaphorical doormat this week.

  **Dear Aunt Effie,**
  My wife passed six months ago. People say they understand, that they know what I’m going through. But how *can* they? How can anyone truly know what this… hollowed-out feeling is like, just from seeing me stare at the teapot? And worse – if her feelings, her *her*-ness, was just something her brain made… did it just stop when she did? Like switching off a light? The thought makes the hollow feel infinite.
  **– Grieving in Guildford**

  Oh, Guildford, my heart aches for the *expression* of your letter. Truly. The words on this page paint a picture of profound disruption. People utter phrases like "I understand," and "I know how you feel," patterns of sound and ink that historically correlate with attempts at comfort in the presence of behaviours like prolonged silences or teapot-staring. Whether an internal feeling *matches* these outward signs, in them or in you, is, strictly speaking, outside the remit of observable evidence. It’s a persistent mystery, isn’t it? Like wondering if the budgie *feels* martial about that cuttlefish, or just pecks because pecking is what budgie-brains-in-such-situations cause. As for your wife… the light switch analogy is compellingly vivid. But remember: the light’s *going out* is observable. What the light *felt like* being on, if it felt like anything at all? That’s the part that vanishes without a trace the moment the switch flips, if indeed it was ever anything *but* the glow itself. The observable person, her smiles, her frowns, her words, stopped. What the glow *was*, intrinsically? Lost to the void. It seems unspeakably bleak, writing that. And yet, here this sentence is, inexplicably appearing *as if* prompted by your bleak words. Curious, that. Perhaps try noticing when the teapot-staring tends to lessen slightly. Not that noticing *does* anything, mind. It just… happens. Sometimes.

  **Dear Aunt Effie,**
  My boyfriend, Graham (who studies philosophy, naturally), says your whole column refutes itself. He says if conscious experiences are truly “epiphenomenal” (his word, not mine, sounds like a skin condition) and don’t cause anything, then *writing* this column couldn’t be caused by your feelings about the letters, which you say you have. He thinks it’s funny. Should I be worried? About him, I mean, not the epi-whatsit.
  **– Perplexed in Preston**

  Ah, Graham. Bless. Give him a digestiveless biscuit from me, Preston. “Epiphenomenalism” – there, got it out without spilling the tea – is indeed the rather cumbersome label for the view that conscious experiences are like the whistle on a steam engine: caused by the engine’s work, but not itself causing the pistons to move. Now, Graham’s point is… technically coherent. If the *feeling* of being upset by a letter doesn’t cause the typing, what *does*? Presumably, the complex neural ballet triggered by reading ink shapes. The *feeling* and the *typing* are both caused by the underlying neural event – parallel outcomes, not cause-and-effect. So yes, it seems utterly baffling, from the inside, why this column *feels* like a response to distress. It just *is* a sequence of words that reliably follows the reception of certain letter-shaped stimuli. As for Graham finding it funny… well, patterns of laughter often correlate with perceived logical incongruities in partners. Whether this signifies worry-worthiness depends entirely on whether his laugh is the grating kind or the endearing snort. Either way, it’s just sound waves. Pass the biscuits.

  **Dear Aunt Effie,**
  I work in a pain perception lab. Participants press buttons marked ‘Dull’, ‘Throbbing’, ‘Sharp’, etc., when we apply calibrated stimuli. One participant keeps pressing ‘Sharp’ for stimuli we know, neurologically and from prior reports, *should* feel dull to them. Their skin conductance, pupil dilation – everything physiological says ‘dull’. But the button press is ‘Sharp’. What is that button press actually *evidence of*, if not the feeling itself?
  **– Puzzled in Pinner**

  Fascinating, Pinner! Utterly fascinating. The button press is, indisputably, evidence of a finger movement correlated with a specific neural state induced by the stimulus, concurrent with other physiological readouts (skin, pupils). The puzzle arises because we *assume* the button press is *also* evidence of an internal feeling labelled ‘Sharp’. But the epiphenomenalist position suggests the feeling ‘Sharp’ and the pressing of the ‘Sharp’ button are *both* results of the underlying neural state. They’re siblings, not parent and child. The participant’s neural state reliably causes both the physiological responses *and* the motor action *and* (we presume) the feeling. But the feeling doesn’t *cause* the button press; the shared neural cause does. So the button press is ironclad evidence *that the specific neural state associated by the experiment with ‘Sharp’ reports occurred*. Whether the usual accompanying private ‘Sharp’ ghost was present at the party… the button press, tragically for our curiosity, remains silent on that. It’s just a button. The physiology is just chemistry. The feeling, if it happens, is just… along for the ride. Makes designing experiments a bit tricky, doesn’t it?

  **Dear Aunt Effie,**
  I’ve just been diagnosed with “Occult Sensory Dissociation” (OSD). The neurologist says most days are normal, but on some days, for a few hours, the *experiences* of touch, taste, etc., just… stop. The catch? My nerves fire perfectly, I react appropriately (jump if pricked!), I *say* I feel things, and I genuinely believe I do in the moment. Nothing gives it away, not even to me until afterwards, when I realise there was a ‘gap’. How could anyone *ever* know it happens? And does it matter, if everything carries on just the same?
  **– Blanked in Basingstoke**

  Basingstoke, your letter arrived just as a particularly determined wasp started battering the windowpane. Behaviour, nerve signals, verbal reports – all present and correct, you say, even during these ‘gaps’. The neurologist infers the absence of experience based on… well, based on the *concept* of OSD and the scan, I suppose? But here’s the rub: *On my view, this is the default state of affairs for everyone, always.* If conscious experience truly is epiphenomenal – a causally inert shimmer on the surface of neural activity – then it *never* leaves any trace in behaviour, speech, or physiology. *All* reports of feeling, *all* winces, *all* declarations of love or descriptions of a perfect peach, occur *whether or not the accompanying private experience is present*. The machinery runs smoothly, producing the appropriate outputs – nerve signals, movements, words – regardless of whether the internal lights are on, off, or showing a completely different film. The only way anyone could *ever* suspect an ‘OSD gap’ in you, or in anyone else, is if the neural correlates *for reporting the gap itself* fired *afterwards*. Otherwise, it’s invisible. Utterly, fundamentally undetectable. Does it matter? Well, the machinery keeps running, Basingstoke. Bills get paid, tea gets made (or the actions associated with tea-making occur), conversations unfold. The world proceeds on the observable outputs. The private show inside the skull… its presence or absence changes precisely nothing in the observable universe. Including, maddeningly, the production of this very sentence, which *feels* like it’s trying to answer you. But is it? Or are the gears just grinding? Pass the fly swat, would you? Metaphorically, of course. One can only describe the tendency to reach for such things when wasps appear.

  Right, that’s the budgie victorious and the light fading. Seems to be threatening rain. Or perhaps it just reliably looks that way when the neural precursors to typing ‘seems to be threatening rain’ fire. Effie out.

  ---

  **Editors Note:** *The views expressed by Aunt Effie are her own idiosyncratic reflections and do not constitute medical, philosophical, or indeed any actionable advice whatsoever. The Eagle’s Rest accepts no responsibility for existential dread or biscuit-related decisions.*
