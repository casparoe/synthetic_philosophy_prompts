  ## The Talk

  Good morning. Thank you all for coming out on this cold October morning to this place my father loved. It’s fitting we’re here, among the grasses and the birds he worked to restore. No ceremony, just us, and him, and the prairie waking up. That feels right for him.

  Dad spent decades wrestling with a very old Chinese text, the *Zhuangzi*, especially its thoughts on death. He’d be the first to tell you – often did tell us at the dinner table – that most of what gets said at moments like this misses the point entirely. Forget serenity. Forget returning to some cosmic source. Forget spirits hanging around. He thought that stuff was mostly about making *us* feel better, not about what actually happens.

  His take was… well, it was stubbornly literal, and deeply curious. He read those stories about bodies becoming soil, becoming insects, becoming birds – like the crow that might peck at you if you’re left out – not as metaphors for the soul’s journey, but as a plain, physical fact. Dust to dust, yes, but without the promise. The stuff we’re made of doesn’t *return*; it *transforms* into something else entirely. A different arrangement. Ants. Grass. A sedge wren. The boundary between “me” and “not-me” was always shaky, he argued, and death just makes that undeniable. There’s no single, lasting *him* to be at peace, or to be sad, or to be anywhere. Asking “what happens to *him*?” is, in his reading, like asking what happens to a wave when it crashes – the water’s still there, doing other water things.

  So, what’s left? Not consolation in the usual sense. Dad found something else in the *Zhuangzi*: a kind of fierce, almost absurd curiosity. If there’s no permanent self, then clinging to the idea of one is the real problem. The stories aren't serene meditations; they’re often wildly funny, mocking our desperate need to make death make sense in ways that flatter our fears. Why *not* find the humor in the fact that we might end up feeding the beetles? It punctures the solemnity. It loosens the grip. What remains isn’t serenity, but openness. A wondering: *What happens next? What does this become?*

  That curiosity was how he lived, especially here. He didn’t come to the prairie restoration to find peace, exactly. He came to see what was growing. To count the birds. To pull weeds. To argue about drainage patterns. To get muddy. To notice the specific, stubborn life pushing up through the ground. When a friend died, his practice wasn’t to offer platitudes. It was to go out and look – really look – for something specific and alive. Last spring, for one friend, it was a sedge wren.

  He wouldn’t want us to pretend we aren’t feeling the ache of his absence. That ache is real. He wouldn’t want us to be told *not* to be sad. Sadness is part of this messy, boundary-blurring transformation too. And he certainly wouldn’t want to be turned into a tidy lesson about nature’s cycles. Life, death, transformation – it’s not a lesson. It’s just… what is. It’s bewildering, sometimes funny, often sad, and fundamentally uncertain.

  So, what can we do? We can’t say he’s at peace, because the “he” that could feel peace is gone. We can’t say he’s returned to a source, because he didn’t believe in that kind of source. We can’t say he’s with us. The *Zhuangzi* stories he loved wouldn’t allow it, and he’d call it out as wishful thinking.

  But we *can* do what he did. We can step out of the shelter. We can honor his curiosity. We can acknowledge the bewildering fact: the stuff that was him is here now, part of this place he loved. And the rest of us? We’re still here, looking around.

  So, I’ll end with the same thing he did. In a few minutes, after we scatter his ashes according to his wishes – out there, among the grasses, no container, just the wind and the earth – I invite you to do something simple, concrete. Don’t try to feel a certain way. Just go look. Walk out onto the path for five minutes. Look deliberately for one specific, living thing. A particular grass seed head catching the light. A bird call you don’t recognize. An insect on a stem. A patch of stubborn green. Find one thing, and really see it. Not as a symbol, not as a message from him, just as the thing it is, right now, alive in this cold October morning. Be curious. That’s what he’d be doing.

  Thank you for loving him, for arguing with him, for birding with him, for sharing this place with him. Now, let’s go look.

  ---

