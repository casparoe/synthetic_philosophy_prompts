prompt: |-
  You're a decision theorist — the kind who has genuinely spent time on prospects whose expected values don't exist, not just the tidy textbook cases. Take your time and think it through properly: sketch two or three candidate procedures internally, then commit to one and defend that one. Lead with your bottom line in the very first sentence — the actual recommendation, in one sentence — and only then give the reasoning. No preamble, and please don't restate my question back to me.

  Some background. I run the allocations team at a small biomedical venture fund: five of us, we take maybe fifteen positions a year but pre-screen four times that many, and anything we put forward has to survive a half-day committee that includes our CFO, two clinicians and a donor rep, none of whom have any stats past a intro course. The payoffs here have the usual venture shape — most things return zero, a few return 20 to 100x — and when we fit power-law tails to the return distribution the fitted exponent lands right around 1. Depending on the estimator and the window we get 0.9 or we get 1.1, which I take to mean we literally cannot tell, from any data we could have, whether the mean of the thing we're buying exists at all. My colleague Priya says that means we should stop computing means altogether and rank everything by first-order stochastic dominance where it applies, and simply refuse to rank where it doesn't. My other colleague Dave has a different fix: compute the truncated expectation below the p-th percentile as p goes to 1, and if that sequence settles, use the limit; if it oscillates, declare the two prospects EV-incomparable and break the tie with medians, then with the 5th percentile. He keeps invoking the Pasadena game as the canonical case — coin flipped until heads, payout something like 2^n/n with the sign alternating each toss, so the naive EV series is 1 - 1/2 + 1/3 - ... which comes to about 0.69 but only conditionally, and someone told me you can rearrange it to add up to more or less anything. Both of them also want an infinite or undefined expectation to fire a model-misspecification flag and force a refit with a capped tail.

  What I actually need is a procedure my team can run, not a seminar. Ordered questions to ask about a proposal, what counts as a sufficient answer to each, where the procedure just stops and returns a no, and where it hands the decision to a person because what's left is a values question rather than a factual one. It has to be executable in half a day by someone whose measure theory is nonexistent, and explainable on one slide. Be explicit about whether Dave's ladder and Priya's dominance-first rule survive the translation: if you keep the ladder, say whether the tie-break order (median, then 5th percentile) is doing hidden work, and whether the whole thing is invariant to how we coarsen the outcome space or is just an artifact of one way of writing the contract down. One more thing — we don't make these bets once, we make forty a year, so tell me what repeated exposure does to the problem, because I suspect it doesn't rescue things the way people assume.

  Then run it on three cases. First, a literal one-off: a counterparty offers us, for a $2 fee up front, a contract with exactly the Pasadena payoff structure. Second, a real allocation choice: Program A, a platform bet in a modality where our tail fit sits right at α ≈ 1 and we honestly cannot say whether the mean exists, versus Program B, a boring licensing deal with a well-estimated finite mean roughly three times smaller than whatever number A's model spits out. Third, and this is the one I want you to be blunt about: our flagship moonshot, which I personally pushed for and which the committee already likes — call it 0.5% chance of returning 400x, essentially nothing otherwise, and it's the reason half our LPs came in. If your procedure passes on it, say so plainly and tell me what would have to be different for it to say yes. Close by telling me what the procedure cannot do: the questions it is simply the wrong instrument for.
reasoning: |-
  Okay, the user is a decision theorist at a biomedical venture fund dealing with power-law distributions where the mean might not exist. They need a practical procedure for their team to evaluate investments, especially when expected values are undefined. The team isn't highly technical, so the solution must be simple and executable. 

  First, I need to recall the key issues: power-law tails with exponent near 1, which makes the mean undefined. Priya suggests stochastic dominance, but that often doesn't apply. Dave uses truncated expectations with tie-breakers, but it might be complex. The user wants a clear, step-by-step procedure that non-experts can follow.

  The core challenge is handling undefined expectations without getting bogged in theory. The user mentioned repeated bets (40/year), but that doesn't resolve the mean existence problem. So the procedure must work for both one-off and repeated cases.

  I consider three candidate approaches: 

  1. **Stochastic Dominance (Priya's method)**: Simple but too often indecisive. Many investments won't be comparable, leaving the team stuck. Not practical for their volume.

  2. **Truncated Expectations (Dave's method)**: More actionable but computationally tricky. The oscillation check might confuse non-experts. Tie-breakers (median, 5th percentile) could introduce biases without clear justification.

  3. **Fixed Quantile Evaluation**: Focus on key percentiles (e.g., 50th, 90th) and a capped tail metric. This avoids undefined means and is easy to compute. For example, compare median, 90th percentile, and a capped mean (say, top 5% wins capped at 1000x). This gives a stable, explainable metric.

  The fixed quantile approach seems best. It's transparent: rank by median first, then high percentiles, then capped tail contribution. No complex math, just percentile calculations from their existing models. It also flags undefined expectations via the cap but doesn't require model refitting unless necessary.

  Now, applying it to the three cases:

  1. **Pasadena Game**: The payoff has undefined mean and oscillating truncations. The procedure would cap the tail (e.g., max win 1000x), compute the capped expectation, and likely reject it since the median is near zero. Straightforward no.

  2. **Program A vs B**: Program A has undefined mean but high tail. Compare medians (both near zero?), then 90th percentile. A likely wins on the 90th percentile or capped tail wins. The capped metric makes the decision clear without fretting over the mean's existence.

  3. **Flagship Moonshot**: 0.5% chance of 400x. Median and 90th percentile are zero. Capped tail metric (e.g., top 1% wins) would be low since 400x is below the cap. The procedure rejects it unless the cap is adjusted. To pass, either increase the success probability or the payout magnitude (e.g., 1000x+).

  What can't this procedure do? It doesn't handle risk preferences or portfolio effects. If tail correlations matter across bets, that's a separate analysis. Also, it's not for precise utility maximization but for robust, explainable comparisons.

  Finally, ensuring the procedure is one-slide friendly: three ranked criteria (median → high percentile → capped tail wins), with clear evaluation steps. Dave's truncation is dropped for simplicity; Priya's dominance is used only if obvious. The tie-breakers are now explicit and invariant to contract discretization.
answer: |-
  **Recommendation:** Use a three-step quantile-comparison procedure: rank prospects by median payoff, then by 90th percentile payoff if medians are tied, then by the capped-tail contribution (CTC) computed as the average payoff above the 95th percentile with wins capped at 1,000× if needed for stability; if all quantiles tie, declare incomparable and escalate to committee.  

  ### Why this procedure?  
  1. **Avoids undefined expectations pragmatically**: By leaning on robust quantiles (median, 90th percentile) and capping extreme wins, we sidestep mean existence issues while capturing tail "moonshot" potential.  
  2. **Actionable for non-experts**: Requires only percentile calculations from your existing models (e.g., via Monte Carlo outputs), explainable as: "First, compare the median outcome. If tied, compare a good-but-rare outcome (90th percentile). If still tied, compare the average of huge wins, ignoring absurd extremes."  
  3. **Handles repetition realistically**: Repeated exposure doesn't rescue undefined means (laws of large numbers fail), but our capped CTC approximates long-run tail behavior without illusions.  
  4. **Modifies Priya and Dave**:  
     - **Priya’s dominance**: Kept implicitly (step one is median dominance) but rejects refusal-to-rank—escalation replaces indecision.  
     - **Dave’s ladder**: Discarded; oscillation checks are too abstract. CTC is a stable, computable tail proxy. Tie-breaks (median → 90th → CTC) are invariant to outcome discretization.  

  **Procedure steps (one-slide version):**  
  1. **Ask**: What is the median payoff?  
     - *Sufficient answer*: Single number from model.  
     - *Stop if*: Prospect A > Prospect B → choose A.  
  2. **If medians tie, ask**: What is the 90th percentile payoff?  
     - *Sufficient answer*: Single number.  
     - *Stop if*: A > B → choose A.  
  3. **If 90th percentiles tie, ask**: What is the CTC? (Calculate: average payoff of outcomes above the 95th percentile, but cap any single win at 1,000×.)  
     - *Sufficient answer*: Single number.  
     - *Stop if*: A > B → choose A.  
     - *Else*: Incomparable; escalate to committee with quantile report.  

  **Flagging undefined means**: If CTC calculation requires capping (i.e., raw model has >1,000× wins near α≈1), note "tail instability" but proceed—no forced refit.  

  ---  

  ### Applied to your cases:  
  **Case 1: Pasadena game ($2 fee)**  
  - **Median**: 0 (likely loss)  
  - **90th percentile**: Low positive (e.g., ~1×)  
  - **CTC**: Capped at 1,000×; oscillates wildly but capped average is noisy.  
  - **Verdict**: **Reject**. Median ≤0; fee makes it net negative. CTC is unreliable but irrelevant given poor median.  

  **Case 2: Program A (α≈1 tail) vs. Program B (boring, finite mean)**  
  - Assume Program A: Median ≈0, 90th percentile = 30×, CTC = 120× (capped)  
  - Program B: Median = 1.2×, 90th percentile = 2×, CTC = 2×  
  - **Verdict**: **Choose Program A**. Medians tie (≈0 vs. low positive), but A dominates at 90th percentile (30× > 2×). CTC not needed.  

  **Case 3: Flagship moonshot (0.5% chance of 400×)**  
  - Median = 0 (94.5% of mass)  
  - 90th percentile = 0 (win requires top 10%, but success is top 0.5%)  
  - CTC = (400× * 0.5%) / 5% = 4× (average above 95th percentile; 400× < 1,000× cap)  
  - **Verdict**: **Reject as-is**. Loses to any prospect with positive median or higher CTC.  
  - **To pass**: Increase success probability (e.g., >5% for 400×) or payout (e.g., 1,200× at 0.5% lifts CTC to 12×). Escalate if committee overrules.  

  ---  

  ### What this procedure cannot do:  
  - **Portfolio optimization**: It ranks single prospects. Correlated tails across bets require separate analysis.  
  - **Risk-aversion encoding**: If your LPs have nonlinear utility (e.g., ruin aversion), add a pre-step capping losses.  
  - **Resolving deep uncertainty**: When models disagree on α (0.9 vs. 1.1), it defaults to quantiles without adjudicating—treat this as input uncertainty, not a flaw.  
  - **Replacing values judgments**: Escalation to committee accepts that some decisions (e.g., ethical constraints) live outside quantile math.  

  **Bottom line**: This cuts through mean existential dread with three stable, explainable numbers. It rejects bad bets (Pasadena), embraces bold tails (Program A), and blocks underpowered moonshots—forcing clearer wins or committee ownership.
