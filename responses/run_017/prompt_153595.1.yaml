prompt: |-
  Retired freshwater ecologist here, got dragged into philosophy by a reading group a couple of years back and Ive been chewing on this Moloch / multipolar trap business for weeks without getting anywhere. I want a thought experiment built to spec, because I suspect the word is doing mostly rhetorical work and I want to find out whether it earns its keep.

  Set it somewhere ordinary and contemporary — a profession, a market, a shared resource, whatever you like — no demons, no trolleys, no sci fi, one paragraph. The specs:

  - everyone involved can see where the trend ends up, and they can all talk to each other freely;
  - whatever degrades has to be something the participants themselves value and that lands on them, not on downstream bystanders (that's what's meant to make it Moloch rather than a plain externality story);
  - the decline has to survive free communication and costless binding contracts among whoever is currently in the game;
  - and the case has to be engineered so that two diagnoses fit exactly the same data: the trap diagnosis, where everyone is worse off than under cooperation and no one can stop unilaterally, and a sorting/selection diagnosis, where nobody is trapped at all — the incumbents are on their best response and doing fine, and the decline is driven by turnover, the ones who can't or won't escalate dropping out and being replaced by actors for whom escalating is rational. Same time series, same complaints from participants, same failure of the standard fixes, both mechanisms.

  Then give me what each diagnosis says about each feature of the case and why, the one structural feature that makes the two peel apart, what the case collapses into if you remove that feature, and how a defender of whichever diagnosis comes out worse would attack it.

  I'll use the result to decide whether Moloch names anything game theory doesn't already cover, so derive the verdicts from the two mechanisms instead of stipulating them — that's the whole point. Sorry if the specs are fussy. Five numbered items, a couple of sentences each, item 1 being the scenario, no intro and no summing up at the end, and no citations or reading suggestions, I can't chase any of that up.
