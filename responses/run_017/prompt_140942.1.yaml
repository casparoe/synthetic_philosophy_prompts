prompt: |-
  I am drafting a novel set almost entirely on an open boat in the days after a sinking, and one scene has outgrown me. Two characters, both of whom I want to be genuinely competent rather than one of them a convenience, are arguing about whether to pull a swimmer aboard. The mate, who has the only sextant, refuses: the boat carries forty days of rations for eleven, the passage takes twenty-five, and every added body eats the margin. The ship's surgeon, who has spent the morning sewing up a boy the mate would have left in the water, answers that the boat is not a fortress but a field hospital, that they are doing triage rather than defending property, and that triage allocates among all the patients, not only the ones already under the canvas. My first reader tells me the mate is running the lifeboat case that circulates in this debate — the well-provisioned boat, the sea full of swimmers, the safety-factor argument that hauling people aboard risks swamping everyone — and that the surgeon is answering it with the wrong analogy entirely. Since this exchange is the hinge of the book's second act, I need the argument to actually be right, not merely to sound like an argument.

  I would like that settled, but I would also like it made harder than my reader makes it. Two things in my scene are not in the case as I have seen it stated, and I suspect they matter. First, my gunwale is graded rather than thresholded: the boat will not capsize at the twelfth body, but each additional body rides it lower, so every rescue buys a slightly larger probability of total loss in a swell, spread across everyone aboard — a small shared risk traded against one person's certain death. Second, one of the swimmers is the only other person alive who can read a sextant, and a shorter passage could leave everyone better fed than a longer one with the original eleven. I do not see how a case built around a hard, known capacity and passive burdens speaks to either of these, and I cannot tell whether that is a defect in my scene or in the case.

  So please audit both analogies. Set out explicitly what maps onto what in each — the boat, the provisions, the length of the passage, the gunwale, the crew's authority, the duty to the people in the water — then where each mapping breaks, and which of those breaks are load-bearing for the refusal and which are decoration. I especially want what each analogy quietly imports that the other lacks: the lifeboat seems to me to smuggle in that the occupants may owe the swimmers nothing, that the total is fixed, that the emergency is one-shot and short-horizon, and that the numbers are known; the hospital seems to me to smuggle in a shared project and an impartial allocator. If the mate's conclusion survives only because the lifeboat was carrying it, say so plainly; if it survives the disanalogies, tell me what in it is doing the surviving. And if my two twists are the wrong twists, or if there is a better analogy for what I am actually asking these people to decide, I would rather have that than have my scene propped up. Lead with a one-sentence verdict, then the two correspondence tables, then the audit, and keep the whole thing under 700 words.
reasoning: |-
  Hmm, the user is drafting a novel scene where two competent characters argue about rescuing a swimmer from the ocean after a shipwreck. The mate argues against rescue using a "lifeboat ethics" framework focused on resource limits and safety margins, while the surgeon argues for rescue using a "field hospital triage" analogy emphasizing medical duty to all patients. The user's first reader criticized the surgeon's analogy as mismatched, and the user wants to understand why while preserving the scene's complexity - particularly with graded gunwale risk and the swimmer's sextant skills.

  I need to audit both analogies systematically. The lifeboat case maps directly: boat = resource container, provisions = fixed supply, passage duration = time horizon, gunwale = binary safety threshold. Its core imports are: occupants as rightful owners, scarcity as absolute, decisions as final, and numbers as known. The surgeon's hospital analogy maps differently: boat = treatment zone, provisions = medical resources, injuries = patient conditions, rescue = admission. It imports: shared humanitarian purpose, continual reassessment, and physician authority.

  The surgeon's analogy breaks critically in three load-bearing ways: 1) The boat isn't designed for fluid intake like a hospital - rescue physically endangers all occupants via the graded gunwale risk. 2) Medical triage explicitly excludes those who can't reach care, while the lifeboat debate centers precisely on whether to extend that boundary. 3) The surgeon's "impartial allocator" role contradicts the mate's operational command authority. These aren't mere decoration - they undermine the analogy's core applicability.

  Meanwhile, the mate's argument adapts better to the user's complexities: The graded gunwale converts his "safety margin" from binary to probabilistic (supporting his risk-aversion). The sextant-skilled swimmer actually reinforces his resource calculus by introducing a new variable (shorter passage = preserved rations) rather than contradicting it. His framework survives because it handles dynamic tradeoffs - whereas the hospital analogy collapses when physical space and collective safety are contested.

  The better framing would be "expedition logistics": a journey with variable speed/resources where rescue decisions affect survivability for all. This acknowledges the surgeon's moral impulse while centering the mate's operational reality. The verdict must be blunt - the surgeon's medical analogy fails fundamentally for this scenario, while the mate's logic holds despite the reader's criticism. I'll present this with correspondence tables first, then break down the analogy failures, keeping it under 700 words.
answer: |-
  ### Verdict
  The surgeon's hospital analogy fails catastrophically for this scenario, fundamentally misrepresenting the physical and operational reality, while the mate's lifeboat framework, adapted for your complexities, remains robust.

  ### Correspondence Tables

  | **Lifeboat Case Mapping**       | **Your Scene Element**          |
  | :------------------------------ | :------------------------------ |
  | Boat's Hard Capacity            | Graded Gunwale (Probabilistic Risk) |
  | Fixed Provisions                | 40 Days Rations for 11          |
  | Known Passage Duration          | 25-Day Passage (Est.)           |
  | Swimmers as External Threats    | People in Water                 |
  | Occupants' Right to Exclude     | Mate's Authority to Decide      |
  | Binary Safety Threshold         | Cumulative Risk of Swamping     |
  | Passive Burden (Resource Drain) | Active Burden (Risk + Resource) |
  | **Imports:** Exclusive ownership, fixed scarcity, final decisions, known numbers. |                                  |

  | **Hospital Triage Mapping**     | **Your Scene Element**          |
  | :------------------------------ | :------------------------------ |
  | Treatment Facility              | Lifeboat                        |
  | Medical Resources               | Provisions/Freshwater           |
  | Patient Injuries/Needs          | Survivors' Condition            |
  | Admission to Treatment Zone     | Hauling Swimmer Aboard          |
  | Physician Authority             | Surgeon's Role/Moral Argument   |
  | Triage Categories               | Prioritizing Survival Chance    |
  | **Imports:** Shared humanitarian purpose, impartial allocator, fluid intake/reassessment, duty extends to all potential patients *within reach*. |                                  |

  ### Audit & Breakdown
  1.  **Critical Breaks in the Hospital Analogy (Load-Bearing):**
      *   **Physical Container vs. Treatment Zone:** A hospital's walls don't collapse if filled. Your *graded gunwale* means *admitting a patient physically endangers all current occupants and staff*. Triage doesn't inherently risk destroying the ER. This breaks the surgeon's core premise that rescue is merely resource allocation.
      *   **Boundary of Care:** Medical triage operates *within* a defined treatment zone. It explicitly *does not* compel risking the entire facility to retrieve patients outside it. The surgeon's "all patients" argument smuggles in a duty to *extend* the zone (rescue), which is precisely the contested action, not a principle of triage itself.
      *   **Authority & Role:** The surgeon imports "impartial allocator" authority. On the boat, operational command (safety, navigation, resource discipline) rests with the mate. The surgeon's medical authority is vital *within* the boat but doesn't override the inherent risks of *changing the boat's physical state*.

  2.  **Lifeboat Case Adapts to Complexities:**
      *   **Graded Gunwale:** This *strengthens* the mate's core argument. Instead of a hard cap, it introduces a probabilistic risk calculus. Each rescue increases the *shared* risk of catastrophic failure (swamping). This directly counters the surgeon's "fortress" dismissal – the boat *is* vulnerable, dynamically.
      *   **Sextant Swimmer:** This adds a *variable benefit*, not just burden. The mate's framework (cost/benefit for *collective* survival) readily incorporates this: Does the *potential* for a shorter passage (saving resources, reducing time exposed) outweigh the *immediate* resource drain *and* the *increased* probabilistic risk of swamping? It's a nuanced calculation within his logic, not a contradiction. It justifies *considering* rescue, not mandating it.

  3.  **Lifeboat Case Survivability:**
      The mate's conclusion survives because its core tenets – **finite resources, physical vulnerability, collective risk assessment, and commander responsibility for the whole** – directly address the reality of the open boat. Your complexities refine the *calculation* (probabilistic risk, potential benefit) but don't invalidate the fundamental framework. The surgeon's analogy fails because it ignores the container's fragility and the contested duty to *create* space, mistaking the lifeboat for a stable platform where only internal allocation matters.

  ### Recommendation
  Ditch the hospital analogy. The mate's position is stronger and more coherent. To strengthen the *dramatic* conflict:
  *   **Focus on the Sextant:** Make the swimmer's navigation skill undeniable but their condition uncertain (injured? exhausted?). The mate must weigh the *probability* of a faster passage against the *certainty* of increased consumption *and* the *quantifiable increase* in swamping risk per inch of freeboard lost. Is the gamble worth the collective risk?
  *   **Reframe the Surgeon:** Instead of flawed triage, have him argue **expeditionary necessity**: "That sextant is our best chance. We *need* him. The risk *now* is less than starvation *later* if we drift." This pits the mate's immediate risk aversion against a calculated long-term survival bet, both operating within the lifeboat's harsh logic. Their competence shines in how they weigh these brutal factors, not in misapplied ethics.
