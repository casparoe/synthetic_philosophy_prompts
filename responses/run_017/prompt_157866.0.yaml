answer: |-
  Here is a conceptual carving of the phenomenon you describe, designed for precise footnote deployment:

  **Name:** **Residue Bias** (or **Filter-Induced Atypicality**)

  **Core Definition:** A systematic distortion in historical reconstruction arising when the application of negative authenticity criteria selects for data points precisely *because* they lack the characteristic features of the dominant transmission tradition. The resulting assemblage converges not on a representative sample of the original subject, but on an increasingly atypical, disconnected, and contextually unplaceable residue. The bias intensifies as the criteria's sensitivity to the tradition's "fingerprints" improves.

  **Distinguishing Features:**
  1.  **Content-Directed Negative Selection:** The filter explicitly targets and removes units exhibiting traits deemed typical of the transmitting community (continuity, utility, doctrinal consonance). Authenticity is inferred primarily through the *absence* of these traits.
  2.  **Atypicality Drift:** The surviving units are disproportionately those that were anomalous, irrelevant, or dissonant *within the tradition itself*. This is not accidental loss (survivorship bias) but the direct *output* of the selection rule.
  3.  **Methodological Purity vs. Interpretive Impoverishment Paradox:** Improved filtering efficiency (removing more tradition-typical material) simultaneously increases the atypicality of the residue *and* decreases its contextual connectivity, making meaningful historical synthesis harder, not easier. The "purest" output is the least interpretable.
  4.  **Anti-Convergence:** Adding authenticated units does not refine a representative picture; it amplifies eccentricity.

  **Nearest Named Concepts & Differentiation:**
  *   **Selection Bias (General):** Too broad. Standard selection bias often involves accidental or non-systematic sampling flaws. Residue Bias is a specific, *inherent*, and *content-driven* subtype generated by the *design logic* of the negative criteria themselves.
  *   **Conditioning on a Common Effect (e.g., Berkson's Paradox):** Predicts spurious correlations *within* the selected sample. Residue Bias predicts a uniform *drift towards atypicality* and *loss of context* across the entire surviving set, regardless of internal correlations.
  *   **Goodhart's Law ("When a measure becomes a target...")**: Not applicable. The tradition isn't *adapting* to evade the criteria; the criteria are retrospectively applied filters detecting inherent transmission characteristics.
  *   **Ascertainment Bias (Epidemiology/Genetics):** Close structurally. Refers to bias introduced by how cases are identified/detected (e.g., only studying severe disease forms). Residue Bias is a specific historical-methodological ascertainment bias where the "detection method" (negative criteria) inherently selects for the atypical "cases" by design.
  *   **Hermeneutical Circle:** Addresses the interdependence of part and whole in interpretation. Residue Bias is a specific *consequence* of a methodological approach *within* that circle that systematically *destroys the connective tissue* (continuity) needed for the circle to function productively.

  **Look-Alikes that are NOT Residue Bias:**
  1.  **Simple Survivorship Bias (e.g., only famous artifacts remain):** The unrepresentativeness comes from *accidental* loss/destruction of typical material, not from an *active selection rule* based on content *against* typicality.
  2.  **Sampling from a Biased Source:** The source itself is skewed (e.g., only elite perspectives). Residue Bias arises from the *method applied* to a source (even if hypothetically unbiased), actively *creating* the skew through its filtering logic.
  3.  **Confirmation Bias:** Seeking/favoring data that fits a pre-existing hypothesis. Residue Bias operates *even if* the researcher applies the criteria neutrally; the skew is inherent in the criteria's *function*.

  **Does it Require Content-Directed Selection?**
  Yes, fundamentally. While any filter creates a residue, Residue Bias specifically requires:
  *   The filter targets *characteristic features* of the dominant historical process/agent (the transmission tradition).
  *   Survival is contingent on *lacking* those features.
  *   The "characteristic features" are precisely those that provide contextual connection and typicality.
  A random or non-content-based filter (e.g., selecting every 10th unit) might create an unrepresentative sample, but not the systematic drift towards *atypicality* and *contextual isolation* that defines Residue Bias. The cosmological analog (e.g., telescope limitations selecting only certain wavelengths/energies, distorting the picture of the universe) shares the core structure: the observation method inherently shapes (by limitation/selection) and distorts the perceived object towards the atypical within its detectable range.

  **Footnotable Definition:**
  > *Residue Bias*: A methodological distortion in historical reconstruction where negative authenticity criteria (e.g., dissimilarity, embarrassment) systematically select for data lacking the characteristic features of the transmitting tradition. This results in an assemblage skewed towards the atypical and contextually disconnected elements of the original subject. The bias intensifies with stricter criterion application, paradoxically yielding a less interpretable residue. Distinct from general selection bias by its inherent, content-driven mechanism targeting tradition-typical traits.
