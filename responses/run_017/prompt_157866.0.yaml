  Notably, they're not asking for solutions (smart, since there may not be easy ones) but for precise conceptual tools to name the problem in their dissertation. The footnote-ready definition needs to: 1) name the phenomenon, 2) distinguish it from lookalikes, 3) show why standard criteria produce it inevitably.

