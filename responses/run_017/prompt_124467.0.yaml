  - As a writer, they’re seeing firsthand how technique shapes moral response—a power and a responsibility.
answer: |-
  ### Bottom Line
  No single established term exists, but this is **narrative scaffolding for moral concern**—a blend of narrative theory's "fictional empathy" and psychology's "empathy gap." Moral weight in fiction tracks *represented* inner life, not inherent worth.  

  ### Why the Obvious Labels Don't Fit  
  - **Identifiable victim effect**: Fails—your examples involve single, equally distinct individuals.  
  - **Anthropomorphism**: Misleading—the dog isn’t "humanized"; readers grant *personhood* based on textual attention.  
  - **Speciesism**: Incomplete—the human hired hand is ignored like the pig, showing the pattern transcends species.  

  ### Which Variable Is Key?  
  **Amount of inner life shown** is primary. Your examples pivot on textual attention:  
  - The dog gets *any* focus ("two lines"); the pig/hired hand get minimal *and* impersonal description.  
  - The villain’s detailed POV forces engagement, even if repulsive.  
  Similarity matters *less*: readers sympathize with the villain despite moral distance. Effort to imagine is *secondary*: readers don’t resist the dog; they’re given nothing to resist.  

  ### Fiction or Moral Psychology?  
  **Both, but psychology is foundational.** Fiction exposes a flaw in human empathy: we default to indifference unless prompted by vivid cues (like inner-life portrayal). Real pigs have rich inner lives, but without narrative scaffolding, readers (and people) don’t engage. Your technique isn’t *creating* moral apathy—it’s *revealing* it.  

  ### Why Your Ethics Are Intact  
  Your concern for pigs rests on *evidence* of their actual cognition, not narrative tricks. Fiction’s power is heuristic: it jump-starts empathy we *should* extend anyway. Readers applying this standard to real animals confuse representation with reality—a cognitive error, not an ethical one. Your stance is consistent: real minds matter, whether shown or not.  

