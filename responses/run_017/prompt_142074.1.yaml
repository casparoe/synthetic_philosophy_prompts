    - For Type F, when they see ◆◆▲, they might not know whether to change the first symbol (treating the run as one unit?) or the first symbol individually. But we didn't prime treating runs as units. We only changed the first symbol regardless of runs. So they should change the first ◆ to ■ -> ■◆▲. But that breaks the run. They might feel uneasy. That's okay because it shows the conflict.

    - In the debrief, they might say "it's all arbitrary". We counter by showing that the patterns are constrained by the domain and the warm-up. We can ask: "Could you have answered with a symbol not on the wheel? Could you have reversed the wheel? No, because the wheel was given."

    - Also, we can ask them to think about which answers feel more natural for the target problems without any warm-up? Maybe they can vote. Then we can see that without context, there is variation, but some answers might be more common. Then we can discuss why.

  Timeline (75 minutes):

    0-5 min: Introduction and grouping.
    5-25 min: Warm-up (20 minutes) - groups work on their warm-up sets.
    25-40 min: Target problems (15 minutes) - groups work on the three targets.
    40-55 min: Sharing and discussion (15 minutes): 
          - Collect the target answers and post.
          - For each target, show the answers by group type.
          - Ask groups to predict what the other types answered (if time allows, otherwise skip to debrief).
    55-75 min: Debrief (20 minutes): 
          - Discuss why the answers differed.
          - Map to the concepts: context, bending categories, the role of history.
          - Address limitations and avoid relativism.

  Materials:

    - Wheel handout (one per group, or one per person? per group is fine).
    - Warm-up sets (three versions: S, R, F) on sheets of paper.
    - Target problems on a sheet (same for all).
    - Sticky notes (for writing answers and predictions) and a board to post them.

  Let me write the warm-up sets and target problems clearly.

