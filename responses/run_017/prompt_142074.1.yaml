  Debrief mapping:

    - The warm-up set created a context that made one operation (changing the last, repeating the last, changing the first) feel natural and automatic. This is like the "bending" of categories: in the target, they applied the same operation even when the string structure (like a run) might have suggested a different move.

    - The "slip" (from one interpretation to another) was not free: it was costly to break a run in Type F for T1 (because they had to change the first symbol and break the run of ◆s) but they did it because they were primed to focus on the first symbol. For Type R, it was natural to grow the run. For Type S, it was natural to change the last symbol.

    - The activity shows that context (the warm-up) and competing pressures (to be consistent with the pattern) make one reading win.

    - What it cannot show: the graded and parallel nature of real cognitive processes. We had to say that in reality, multiple possibilities might be active and compete, and the context might tip the balance. Also, the activity is symbolic and discrete, while the brain might use distributed representations.

    - To avoid relativism: emphasize that the wheel structure and the patterns are not arbitrary. The answers are constrained by the system. Without the wheel, they could have done anything? But the wheel provided a structure.

