  ### Higher-Order Consciousness Theories: Diagnostic Decision Tree  
  *Each node uses concrete cases to force theoretical commitments. Branch labels indicate if resolved by conceptual argument (C) or empirical test (E).*

  ---
  **Node 1 (C): In the "empty higher-order state" case (HO state represents a nonexistent FO state, e.g., "I see blue" with no blue-representation), does the subject consciously experience blue?**  
  - **Yes** → **Leaf 1: Strong Actualist HOT**  
    *Commitments:* Conscious experience requires only an accurate HO *thought* about a state; FO states are unnecessary.  
    *Awkward:* Allows hallucinations of nonexistent experiences (e.g., "empty blue").  
    *(Optional names: Rosenthal)*  
  - **No** → Node 2  

  **Node 2 (C): In the "crossed-metacognition" case (FO state = red, HO state accurately represents green → subject reports "green"), what is the conscious content?**  
  - **Green (HO content)** → Node 3  
  - **Red (FO content)** → Node 7  

  **Node 3 (C): In the "alien co-processor" case (device injects accurate HO states with lag), are the resulting experiences conscious?**  
  - **Yes** → **Leaf 2: Quasi-Perceptual (Inner Sense)**  
    *Commitments:* HO states must be perception-like (reliable, fine-grained), but their source is irrelevant.  
    *Awkward:* External devices could generate "alien" experiences detached from the self.  
    *(Optional names: Lycan)*  
  - **No** → Node 4  

  **Node 4 (C): In the "retrospective" case (unreported pain at t, accurate HO state at t+1), was the pain conscious at t?**  
  - **Yes** → **Leaf 3: Dispositional HOT**  
    *Commitments:* Consciousness requires a FO state *disposed* to cause HO states; no actual HO state needed at t.  
    *Awkward:* Dispositions are unobservable; hard to falsify.  
    *(Optional names: Carruthers)*  
  - **No** → **Leaf 4: Weak Actualist HOT**  
    *Commitments:* Requires an *actual* HO state at t for consciousness; FO state must exist.  
    *Awkward:* Cannot explain "tip-of-tongue" states (felt absence of content).  
    *(Optional names: Rosenthal variant)*  

  **Node 5 (C): For the HO state in Node 6/7, must it *itself* be conscious to render its target conscious?**  
  - **Yes** → **Leaf 9: Regress-Prone HO**  
    *Commitments:* HO states require infinite higher-order representations.  
    *Awkward:* Incoherent without a stopping point (no real theories hold this).  
  - **No** → **Leaf 10: Self-Representationalism**  
    *Commitments:* One state represents both world and itself (e.g., pain state self-represents as "my pain").  
    *Awkward:* Ambiguity in how a state targets itself without circularity.  
    *(Optional names: Kriegel)*  

  **Node 6 (C): Can stimulation dissociate metacognition (confidence) from FO discrimination without altering experience?**  
  - **Yes** → **Leaf 7: First-Order + Unconscious Metacognition**  
    *Commitments:* Consciousness is FO; metacognition is separate and often unconscious.  
    *Awkward:* Sincere false reports (e.g., crossed case) imply experience/report mismatch.  
    *(Optional names: Tye)*  
  - **No** → **Leaf 8: Global Workspace**  
    *Commitments:* Consciousness is FO content "broadcast" for cognitive access; HO states are emergent.  
    *Awkward:* Unclear why broadcasting suffices for phenomenology.  
    *(Optional names: Dehaene, Baars)*  

  **Node 7 (from Node 2): In the crossed case, if conscious of red (FO), how explain the "green" report?**  
  - **HO state drives report but is unconscious** → Node 5  
  - **Report is mistaken; experience is red** → Node 6  

  **Node 8 (E): Do animals/pre-linguistic infants have conscious experiences?**  
  - **Yes** → **Leaf 11: Deflationary/Non-HO Naturalism**  
    *Commitments:* Consciousness requires no HO states; explained by FO processes (e.g., predictive coding).  
    *Awkward:* Cannot explain why some FO states (e.g., blindsight) lack phenomenology.  
    *(Optional names: Churchland, Dretske)*  
  - **No** → **Leaf 12: Linguistic or Higher-Order Deflationism**  
    *Commitments:* "Consciousness" is a verbal report practice; nothing to explain beyond behavior.  
    *Awkward:* Denies intuitive experience in non-reporting entities (e.g., infants).  
    *(Optional names: Dennett, Ryle)*  

  ---

  ### Legend: Leaves & Commitments  
  1. **Strong Actualist HOT**: Empty HO states suffice for experience.  
  2. **Quasi-Perceptual (Inner Sense)**: HO states are perception-like; source-independent.  
  3. **Dispositional HOT**: Consciousness = FO state disposed to cause HO states.  
  4. **Weak Actualist HOT**: Requires concurrent actual HO state + FO state.  
  5. **Self-Representationalism**: One state represents itself and world.  
  6. **Regress-Prone HO**: Conscious HO states require infinite ascent. *[Empty: Incoherent]*  
  7. **First-Order + Unconscious Metacognition**: FO states conscious; metacognition separate.  
  8. **Global Workspace**: Consciousness = FO content in global access system.  
  9. **Tracking HO (Non-Representational)**: HO state tracks but doesn't *represent* FO state. *[Empty: Unattractive—fails crossed case]*  
  10. **Same-Order Global**: Entire system represents its own states holistically. *[Empty: Vague/unexplored]*  
  11. **Deflationary/Non-HO Naturalism**: Consciousness reducible to FO processes.  
  12. **Linguistic Deflationism**: Consciousness is a verbal report phenomenon.  

  ---

  ### Key Notes  
  - **Unfilled Boxes**:  
    - *Tracking HO (Leaf 9)*: Requires HO states to *track* FO states without representing them *as mental*. Empty because it cannot explain crossed cases (HO content determines report, but experience is undefined).  
    - *Same-Order Global (Leaf 10)*: System-level self-representation. Empty because no coherent theory exists (order-relativity problem).  
  - **Indistinguishable Leaves**:  
    - *Dispositional HOT (Leaf 3)* vs. *Weak Actualist HOT (Leaf 4)* in retrospective cases (both deny consciousness without HO/disposition at t).  
    - *Self-Representationalism (Leaf 5)* vs. *Quasi-Perceptual (Leaf 2)* in crossed cases (both say experience is green).  
  - **Order-Relativity**: Addressed in Node 5—self-representationalism avoids it by making HO/FO one state.  
  - **Format**: Fits 2xA4. Nodes use cases; leaves avoid name-reliance. Diagnose awkwardness per theory.  

  This tree forces distinctions via edge cases, exposing theoretical trade-offs. Use in review by having students defend paths, then reveal labels.
