  Okay, let's tackle this fascinating question from the user. They work in valuations for an auction house and have observed a peculiar pattern: some objects gain value after being exposed as fakes or misattributions, contrary to the usual outcome where exposure destroys value. The user mentions the case of Han van Meegeren's Vermeer forgeries, which became valuable under his own name after the deception was revealed. They want to know if there's a term or concept for this phenomenon in philosophical or critical literature, and more importantly, a clear analysis of its boundaries and mechanisms.

  First, I need to recall relevant concepts. There's Nelson Goodman's distinction between autographic and allographic arts, which touches on authenticity. Arthur Danto's "Artworld" theory discusses how context shapes art's meaning and value. Then there's the standard view that fakes lose value due to broken provenance. But the user's case is the opposite—value increases post-exposure. 

  The user’s examples include van Meegeren, homages later treated as forgeries, and synthetic continuations of a dead artist's style. Counterexamples are anonymous fakes, unsuccessful deceptions, and fabricated scientific artifacts. The key questions are: Does this require actual deception? Must an institution be fooled? Is the value aesthetic or documentary? Does the premium fade over time?

  I remember that van Meegeren's forgeries are a classic case. After his trial, they gained notoriety value. But the user notes that these are still appreciated aesthetically, not just as relics. So the value isn't purely documentary. The "scandal premium" or "notoriety value" might be part of it, but the user argues it's more than just the story. 

  Looking at neighbouring cases: homages that get reclassified as forgeries might gain value similarly because the reclassification adds a narrative of deception, even if unintended. Synthetic continuations (like those sold as "late manner" works) might benefit from perceived skill or institutional endorsement. 

  For boundary cases: anonymous fakes lose value because there's no name to attach the story to. Unsuccessful deceptions lack the scandal element. Scientific fakes lose all value because their purpose is factual accuracy, not narrative. 

  The core mechanism seems to be a combination of demonstrated skill (fooling experts) and the narrative of scandal. The object becomes a "relic of institutional fallibility," which adds a layer of meaning. This aligns with Danto’s idea that the artworld context defines the work. The aesthetic appreciation might still be present, but now layered with historical significance. 

  Is there a specific term? "Notoriety value" is close, but the user wants precision. "Scandal premium" or "post-exposure irony" might work, but the user might prefer a more academic term. "Parasitic authenticity" captures how the object's value feeds off the original artist's prestige even after exposure. Or "institutional relic value" emphasizing the shamed institution aspect. 

  The user also needs to know if this is one phenomenon or several. The van Meegeren case requires actual deception and institutional embarrassment. The homage-turned-"forgery" might rely on attributed deception. Synthetic continuations might not involve deception at all, yet gain value from perceived association and skill. So perhaps there are subtypes: deception-dependent and skill-dependent. 

  The premium likely decays over time as the scandal fades, unless it becomes a historic benchmark. The aesthetic element persists if the work is competent, but the scandal-driven premium might diminish. 

  For the user's valuation notes, terms like "notorious work," "scandal relic," or "reattributed deception" could be useful. But they need clear definitions. 

  In conclusion, the phenomenon involves objects gaining value post-exposure due to demonstrated skill, institutional scandal, and layered narratives. It's a hybrid of aesthetic and historical value, distinct from pure forgeries or homages. The term "parasitic authenticity" or "institutional relic value" might capture it, with subtypes based on actual vs. attributed deception.
answer: |-
  Your inquiry cuts to the heart of how value is constructed at the intersection of aesthetics, history, and institutional fallibility. This phenomenon lacks a single canonical term, but it can be precisely carved using existing philosophical frameworks and your astute boundary cases. Below is a dissection:

  ### Core Phenomenon: **Parasitic Authenticity**  
  *(or "Institutional Relic Value")*  

  **Definition:** The paradoxical increase in an object's cultural/financial value *after* its exposure as a deception, *specifically* when:  
  1.  The deception successfully infiltrated respected institutions (museums, experts, market).  
  2.  The maker's skill is demonstrably high (validated by the deception's success).  
  3.  The object retains aesthetic competence independent of its false attribution.  
  4.  The exposure creates a metanarrative of institutional fallibility and artistic audacity.  

  **Mechanism (Why Value Rises):**  
  - **Demonstrated Mastery:** The object becomes proof of the forger's skill ("fooling the Louvre" certifies ability).  
  - **Historical Relic:** It embodies a scandal, transforming into a tangible artifact of art-world fallibility (a "relic" of epistemological failure).  
  - **Aesthetic Irony:** Viewers engage in layered appreciation: the work *as* a competent image, *plus* its role in humbling experts.  
  - **Named Agency:** Attribution to a specific, notorious creator (e.g., Van Meegeren) personalizes the narrative, creating a "villain-genius" cult.  

  ### Boundary Cases: What Fits & Why  
  | **Case**                          | **Parasitic Authenticity?** | **Reason**                                                                 |
  |-----------------------------------|-----------------------------|----------------------------------------------------------------------------|
  | **Van Meegeren's "Vermeers"**     | Yes (Archetype)             | Institutional embarrassment + high skill + named maker + aesthetic competence. |
  | **Homages later deemed "forgeries"** | Yes (Attributed Deception)  | Market *reinterprets* intent as deceptive, grafting scandal onto provenance. |
  | **Synthetic continuations**       | **Adjacent (Skill Premium)**| Value derives from perceived mastery mimicking the dead artist *without* deception. Lacks scandal, so not "parasitic." |
  | **Anonymous exposed fakes**       | No                          | No named agent = no narrative; object is merely "broken."                  |
  | **Unsuccessful deceptions**       | No                          | No institutional shame = no relic status; deception is irrelevant.         |
  | **Fabricated scientific data**    | No                          | Scientific value hinges on factual integrity; exposure destroys utility.   |

  ### Key Philosophical Anchors  
  1.  **Danto's "Artworld"**: Value is contextual. The object's meaning (and thus value) is redefined by its post-exposure narrative within the art-historical ecosystem.  
  2.  **Goodman's "Authenticity"**: While Goodman argued only the original has full aesthetic value, your cases show that *provenance itself* can become an aesthetic layer when scandalized.  
  3.  **Baudrillard's "Simulacra"**: The object becomes a hyperreal artifact—more valuable as a symbol of deception than as either a "Vermeer" or a mere "Van Meegeren."  

  ### Resolving Your Debate with the Conservator  
  Your friend is half-right: provenance gossip *is* essential. But it's insufficient alone. The critical factors are:  
  - **Aesthetic Durability**: The work must sustain interest *as an image*. A bad fake loses all value when exposed; a good one gains a dialectical layer.  
  - **Institutional Embarrassment**: The scale of the scandal matters. Fooling a major museum creates a "trophy" of institutional failure.  
  - **Named Notoriety**: The forger must become a storied figure (e.g., Van Meegeren as trickster-hero).  

  ### Does the Premium Decay?  
  Yes, conditionally.  
  - If the scandal fades from living memory, it becomes a footnote—value may settle at "skill premium" levels.  
  - If the forger enters art history (e.g., Van Meegeren in textbooks), the relic value endures but stabilizes.  
  - Aesthetic appeal must persist; without it, the object becomes a mere curio.  

  ### Practical Valuation Vocabulary  
  For your notes, use:  
  > *"Reclassified as a notorious deception, demonstrating high technical skill and institutional impact. Value reflects parasitic authenticity: significant as both aesthetic object and historical relic of [e.g., the Van Meegeren scandal]."*  

  ### Why This Isn't the "Undetectable Fake" Paradox  
  That puzzle asks why we *disvalue* fakes we can't distinguish from originals (a question of ontology/morality). Your cases show the inverse: when exposure *adds* value through narrative and demonstrated skill (a question of contextual epistemology).  

  ### In Summary  
  Your phenomenon is **Parasitic Authenticity**: value accreted through an object's proven capacity to exploit the gap between institutional perception and material reality. It requires:  
  1.  Successful deception of elites.  
  2.  A creator capable of bearing narrative weight.  
  3.  Enduring aesthetic competence.  
  The premium blends documentary and aesthetic value but decays if any leg of this triad collapses. This framework should arm you for future debates—and refine your valuation prose.
