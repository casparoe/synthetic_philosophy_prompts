  ### Decision Tree for Symbol Grounding Positions

  **Instructions:** Answer each question based on the described system. Proceed to the next node as directed. Answer "yes" or "no" unless otherwise specified. If you are unsure of an empirical detail, assume the description is accurate.

  1. **Idle Sensor**: Consider a system with a camera whose signal is recorded but never used in training, loss calculation, or output generation. Does the camera’s presence ground the system’s use of visual words (e.g., "red" or "tree")?  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Pure Notation**: Consider a system (e.g., a compiler or chess engine) that processes only formal symbols and has never been connected to sensors or real-world inputs. Does it assign meanings to the symbols it processes?  
     - **Yes** → Go to 4  
     - **No** → Leaf C  

  3. **Graft**: Consider a text-only model whose internal vectors for color terms are rewired to a camera’s output post-training, then fine-tuned on image captions while predicting text. After this, is its use of color words grounded?  
