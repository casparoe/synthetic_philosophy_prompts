     - **No** → Go to 6  

  4. **Permuted Vocabulary**: Take the pure notation system and consistently relabel every symbol (e.g., swap "pawn" and "rook" in chess notation) so internal relations are preserved but labels are changed. Does it assign the same meanings to the symbols?  
     - **Yes** → Leaf A  
     - **No** → Leaf B  

