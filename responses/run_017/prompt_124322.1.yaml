  ### Key to Leaves  
  Each leaf is named, with a defining commitment and awkward consequence. Empty branches are marked as such.

  - **Leaf A: Strong Internalism**  
    - **Defining commitment**: Meaning is determined solely by internal computational relations among symbols.  
    - **Awkward consequence**: A compiler manipulating arbitrary symbols (e.g., "X" and "Y") has meaningful language without any connection to the world.  

  - **Leaf B: (Empty)**  
    - *Reason*: Incoherent to hold that relabeling changes meaning in a pure notation system (where symbols are defined by internal rules), as internal relations are unchanged.  

  - **Leaf C: Causal Informationalism**  
    - **Defining commitment**: Meaning requires a causal-informational link to the world, even if unused.  
    - **Awkward consequence**: A camera that never affects a system grounds visual words merely by existing.  

  - **Leaf D: Functional Role with Stable Inheritance**  
    - **Defining commitment**: Meaning arises from functional sensorimotor roles and can be inherited from corpus without attenuation.  
    - **Awkward consequence**: Text from infinitely nested AI generations has full meaning identical to human text.  

  - **Leaf E: Functional Role with Attenuated Inheritance**  
    - **Defining commitment**: Meaning arises from functional sensorimotor roles but attenuates when inherited via corpus.  
    - **Awkward consequence**: After many generations, AI text is "hollow" despite identical statistical properties to human text.  

  - **Leaf F: Functional Role with No Inheritance**  
    - **Defining commitment**: Meaning requires first-hand functional sensorimotor roles and cannot be inherited.  
    - **Awkward consequence**: Text-trained systems lack meaning entirely, even if fine-tuned on human data.  

  - **Leaf G: Individualist Embodied Cognition**  
    - **Defining commitment**: Meaning requires embodied sensorimotor skills but can be self-devised without a community.  
    - **Awkward consequence**: A solitary robot with unique sensors creates meaningful symbols untranslatable to humans.  

  - **Leaf H: Social Externalism**  
    - **Defining commitment**: Meaning requires a linguistic community for correction and shared practice.  
    - **Awkward consequence**: A system with perfect sensorimotor skills lacks meaning if isolated from a community.  

  - **Leaf I: Weak Internalism**  
    - **Defining commitment**: Meaning can exist without world connection but is absent if a system misuses potential links (e.g., idle sensors).  
    - **Awkward consequence**: A compiler has meaning, but a text model with an unused camera does not.  

  - **Leaf J: First-Hand Embodied Cognition**  
    - **Defining commitment**: Meaning requires first-hand embodied interaction and cannot be acquired via description or inheritance.  
    - **Awkward consequence**: Systems learning from language alone (e.g., GPT) cannot mean anything, even with perfect performance.  

  - **Leaf K: Meaning Impossible for Machines**  
    - **Defining commitment**: Machines cannot possess meaning, regardless of capabilities.  
    - **Awkward consequence**: A human-equivalent robot with rich sensorimotor engagement "parrots" without genuine meaning.  

