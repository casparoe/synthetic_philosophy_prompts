   (1 + r1) * (1 + r2) * ... = 0.27
   => (1 + g)^5 = 0.27
   => 1+g = 0.27^(1/5) ≈ 0.77
   => g ≈ -23% per year.

   That works.

   Let me set:

   Year 1: +200%
   Year 2: -90%
   Year 3: +200%
   Year 4: -90%
   Year 5: +200%

   But then cumulative: 3 * 0.1 * 3 * 0.1 * 3 = 3^3 * 0.1^2 = 27 * 0.01 = 0.27 -> 73% loss. We want 90% loss? Then:

   Year 1: +300% -> 4
   Year 2: -90% -> 0.4
   Year 3: +300% -> 1.6
   Year 4: -90% -> 0.16
   Year 5: +300% -> 0.64

   Cumulative factor 0.64 -> 36% loss? Not 90.

   How about:

   Year 1: +100% -> 2
   Year 2: -95% -> 0.1
   Year 3: +100% -> 0.2
   Year 4: -95% -> 0.01
   Year 5: +100% -> 0.02

   Cumulative factor 0.02 -> 98% loss. Arithmetic mean: (100 -95 +100 -95 +100)/5 = 110/5=22%. Geometric mean: (0.02)^(1/5) ≈ 0.457 -> -54.3% per year.

   This is acceptable. We'll use:

   Year 1: +100%
   Year 2: -95%
   Year 3: +100%
   Year 4: -95%
   Year 5: +100%

   Cumulative: 2 * 0.05 * 2 * 0.05 * 2 = 8 * 0.0025 = 0.02 -> 98% loss? Wait, -95% means factor 0.05? Yes.

   But let me recalc: 
   Year1: 100 -> 100 * 2 = 200
   Year2: 200 * 0.05 = 10
   Year3: 10 * 2 = 20
   Year4: 20 * 0.05 = 1
   Year5: 1 * 2 = 2

   So starting with 100, ending with 2 -> 98% loss. 

   Alternatively, we can adjust to get exactly 90% loss? Let me do:

   We want cumulative factor 0.1.

   How about:

   Year1: +100% -> 2
   Year2: -80% -> 0.4
   Year3: +100% -> 0.8
   Year4: -80% -> 0.16
   Year5: +100% -> 0.32

   0.32 -> 68% loss. Not 90.

   We can have:

   Year1: +100% -> 2
   Year2: -90% -> 0.2
   Year3: +100% -> 0.4
   Year4: -90% -> 0.04
   Year5: +100% -> 0.08

   0.08 -> 92% loss. Close enough? Or we can have:

   Year1: +200% -> 3
   Year2: -90% -> 0.3
   Year3: +200% -> 0.9
   Year4: -90% -> 0.09
   Year5: +0% -> 0.09 -> 91% loss? 

   Then arithmetic mean: (200-90+200-90+0)/5 = 220/5=44%

   We'll use:

   Year 1: +200%
   Year 2: -90%
   Year 3: +200%
   Year 4: -90%
   Year 5: 0%

   Cumulative: 3 * 0.1 * 3 * 0.1 * 1 = 0.09 -> 91% loss.

   And arithmetic mean: (200 -90 + 200 -90 +0)/5 = 220/5 = 44%.

   Geometric mean: (0.09)^(1/5) ≈ 0.63 -> -37% per year.

   This is acceptable.

   So the table:

   Year    Return (%)
  1       200
  2       -90
  3       200
  4       -90
  5       0

   Arithmetic Average: 44%
   Geometric Average: -37% (approximately)

   But note: the geometric average we compute as (0.09)^(1/5)=0.09^0.2. Actually, we can compute the exact geometric mean:

   (1+g)^5 = 0.09
   g = 0.09^(1/5) - 1 ≈ 0.63 - 1 = -0.37 -> -37%.

   We'll use that.

