   But the returns are all negative? We need big wins and big losses.

   We need a sequence that has high arithmetic mean but low geometric mean due to volatility.

   Example: 
   Year1: +100% -> 2
   Year2: -60% -> 0.8
   Year3: +100% -> 1.6
