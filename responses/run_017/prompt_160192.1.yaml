   Year5: +100% -> 1.28

   Arithmetic mean: (100 -60 +100 -60 +100)/5 = 180/5 = 36%
   Geometric mean: (2 * 0.8 * 2 * 0.8 * 2) = 2^3 * 0.8^2 = 8 * 0.64 = 5.12 -> then (5.12)^(1/5) ≈ 1.40 -> 40% per year? That's positive.

   We need a negative geometric mean. So let's try:

   Year1: +50% -> 1.5
   Year2: -50% -> 0.75
