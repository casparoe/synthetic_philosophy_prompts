   Year4: -50% -> 0.5625
   Year5: +50% -> 0.84375

   Arithmetic mean: (50 -50 +50 -50 +50)/5 = 50/5 = 10%
   Geometric mean: (1.5 * 0.75 * 1.5 * 0.75 * 1.5) = (1.5^3 * 0.75^2) = (3.375 * 0.5625) = 1.8984375 -> then (1.8984375)^(1/5) ≈ 1.136 -> 13.6%? Still positive.

