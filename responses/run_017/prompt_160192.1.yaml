  We are writing a satirical annual letter from Meridian Geometric Partners to its limited partners after five years of operation.
   The fund has bet full Kelly on every opportunity and has lost 90% of the capital.
   The letter must be unrepentant and mathematically correct, while being monstrous in its effect on investors.
   The manager's voice: deadpan, well-bred, patrician.

   Structure:
   1. Opening: Reflect on the five years, acknowledge the losses but frame them as part of the grand strategy.
   2. Performance table: Showing the arithmetic mean return (impressive) and the geometric mean (disastrous), with a footnote explaining the difference.
   3. Paragraph on the affiliated vehicle that bet 3x Kelly: it had a higher expected value but is now worthless.
   4. Dismissal of half-Kelly competitors: they have outperformed in the short run, but we are confident in the long run.
   5. Announcement of the merger: and why they now require a unified Kelly fraction for the entire pool (because if sub-portfolios are merged, individual Kelly fractions are not growth-optimal for the whole).
   6. Handling of the partner who withdrew capital annually: treated as a customer who ordered the wrong product.
   7. Excerpt from an angry letter by a limited partner (an expected-utility theorist) and the manager's reply.
   8. Closing: Announcement of Meridian Geometric Partners II, inviting partners to roll over what remains.

   Technical points to include:
   - Maximizing expected log wealth maximizes almost-sure asymptotic growth rate.
   - Betting beyond Kelly raises expected wealth but lowers the growth rate (and the 3x fund is an example).
   - The gap between arithmetic and geometric average returns (volatility drag) is a fact about averaging over worlds vs living in one.
   - Over five years, the probability that full Kelly beats the cautious fund is only a little better than even.

   Word count: around 900 words, plus a table and 3-4 footnotes.

