   Geometric mean: ( (1+2.00) * (1-0.60) * (1+1.50) * (1-0.70) * (1+1.00) )^(1/5) - 1
     = (3 * 0.4 * 2.5 * 0.3 * 2)^(1/5) - 1
     = (3*0.4=1.2; 1.2*2.5=3; 3*0.3=0.9; 0.9*2=1.8) -> 1.8^(0.2) - 1 ≈ 0.124 (12.4%)? But wait, we want to show a negative overall growth? Actually, we have lost 90% overall.

   How do we get a 90% loss? Let's compute the cumulative factor:
   Start with 1.
   Year1: 1 * 3 = 3
   Year2: 3 * 0.4 = 1.2
   Year3: 1.2 * 2.5 = 3
   Year4: 3 * 0.3 = 0.9
   Year5: 0.9 * 2 = 1.8

   So the fund is up 80%? But we need a 90% loss. Let me adjust:

   We need the product to be 0.1 (i.e., 10% remaining). So we need a cumulative factor of 0.1.

   Let me set returns that are more volatile and with deeper drawdowns:

   Year 1: +150% -> factor 2.5
   Year 2: -80% -> factor 0.2
   Year 3: +200% -> factor 3.0
   Year 4: -90% -> factor 0.1
   Year 5: +100% -> factor 2.0

   Cumulative: 2.5 * 0.2 = 0.5; 0.5 * 3 = 1.5; 1.5 * 0.1 = 0.15; 0.15 * 2 = 0.3 -> 30% of initial, so a 70% loss? Not 90%.

   Let me try:

   Year1: +100% -> 2
   Year2: -90% -> 0.1
   Year3: +100% -> 0.2
   Year4: -90% -> 0.02
   Year5: +100% -> 0.04

   Now cumulative factor 0.04 -> 96% loss. That's more than 90%. Alternatively, we can have:

   Year1: +200% -> 3
   Year2: -80% -> 0.6
   Year3: +300% -> 2.4
   Year4: -85% -> 0.36
   Year5: +50% -> 0.54

   That's 46% loss? Not enough.

   We want a 90% loss: so cumulative factor 0.1.

   How about:

   Year1: +100% -> 2
   Year2: -80% -> 0.4
   Year3: +150% -> 1.0
   Year4: -90% -> 0.1
   Year5: +0% -> 0.1

   Then cumulative factor 0.1 -> 90% loss. But we want to show that the arithmetic mean is high.

   Arithmetic mean: (100 -80 +150 -90 +0)/5 = (80)/5 = 16%? Not impressive enough.

   Let me adjust:

   Year1: +200% -> 3
   Year2: -85% -> 0.15
   Year3: +300% -> 0.6
   Year4: -90% -> 0.06
   Year5: +400% -> 0.3

   Cumulative factor 0.3 -> 70% loss? Still not 90.

   Alternatively, we can have:

   Year1: 0% -> 1
   Year2: -50% -> 0.5
