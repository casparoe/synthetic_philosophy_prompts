  **Meridian Geometric Partners**  
  **Annual Letter to Limited Partners: Year Five**  

  It is with measured satisfaction that I reflect upon our inaugural five-year voyage. Meridian Geometric Partners was conceived to pursue growth with mathematical purity, and we have done so with unwavering discipline. While the journey has been marked by volatility—a feature, not a bug, of our strategy—the intellectual foundations remain unshaken. We write not to console, but to illuminate.  

  ### Performance Summary  
  | Year | Annual Return | Cumulative Factor |
  |------|---------------|-------------------|
  | 1    | +200%         | 3.00x            |
  | 2    | -90%          | 0.30x            |
  | 3    | +200%         | 0.90x            |
  | 4    | -90%          | 0.09x            |
  | 5    | 0%            | 0.09x¹           |

  **Arithmetic Average Return**: 44%  
  **Geometric Average Return**: -37%²  
  **Peak-to-Trough Drawdown**: 99%  
  **Current NAV per Unit**: $0.09 (vs. $1.00 at inception)  

  ¹ *Final NAV reflects a 91% loss of initial capital.  
  ² *The geometric mean quantifies the compound annual growth rate actually experienced. The arithmetic mean—while mathematically correct as an expectation—is an ensemble average over parallel worlds. We inhabit but one.*  

  ### Unflinching Commitment to Kelly  
  Meridian has bet the full Kelly fraction at every opportunity. This maximizes the *almost-sure asymptotic growth rate*—a property as ironclad as the strong law of large numbers. Some competitors deploying "half-Kelly" strategies have outperformed us over this finite window. This is neither surprising nor relevant. Five years is statistically insignificant; the probability of our dominance manifesting in this timeframe was always near 50%, akin to a fair coin. Rest assured: in the long run (which remains our sole concern), full Kelly prevails with probability 1.  

  ### Affiliated Vehicle: A Cautionary Note  
  Our sister fund, **Meridian Geometric Levered**, bet *three times* the Kelly fraction. As predicted by theory, its expected terminal wealth dwarfed ours. Yet it is now defunct.³ Volatility drag annihilates overbettors; their growth rate plummets while their expectation soars. A poignant lesson: mathematics favors the patient, not the greedy.  

  ### Structural Evolution: The Merger  
  We recently merged with **Axiomatic Growth Fund**, a like-minded vehicle. Henceforth, managers will no longer bet individual Kelly fractions. Why? When sub-portfolios merge, the naïve sum of independent Kelly bets *ceases to be growth-optimal* for the combined pool.⁴ Our unified approach recalibrates fractions to the aggregated capital—a refinement ensuring asymptotic efficiency. Progress demands adaptation.  

  ### A Note on Redemptions  
  One partner insisted on withdrawing his annual distributions. This converted geometric compounding into arithmetic accretion—a profound misunderstanding of our offering. His residual capital (now inert) resembles a traveler who boarded a supersonic jet only to demand hourly stops. We wish him well in his search for a savings account.  

  ### In Response to Criticism  
  A limited partner (a self-described "expected-utility theorist") recently fumed:  
  > *"Your fund is EU maximization with a logarithmic utility function! You’ve subjected us to ruinous volatility for a goal that’s indefensible—why not optimize for a bounded utility?"*  

  Our reply:  
  First, we applaud his recognition that logarithmic utility *is* the utility function. Second, his objection conflates normative axioms with descriptive dynamics. We maximize long-run growth, not subjective value. That our strategy *also* maximizes expected log wealth is a felicitous duality. His plea for "bounded utility" would cap growth—a surrender to mediocrity. Mathematics does not negotiate.  

  ### Forward Vision  
  Today, we launch **Meridian Geometric Partners II**. It will deploy the same full-Kelly strategy that has proven itself—asymptotically—beyond reproach. Partners in Fund I are invited to roll their remaining capital into MGP II at the current NAV of $0.09. The long run beckons; we stride toward it with undiminished rigor.  

  Respectfully,  
  *Alistair Thorne*  
  Managing Partner, Meridian Geometric Partners  

  ---  
  **Footnotes**  
  ³ *Expected wealth for a 3x-Kelly bettor grows as (1 + 3𝑓𝜇 - 4.5𝑓²𝜎²)^𝑡, where 𝑓 is the Kelly fraction. Though higher in expectation, the ruin probability approaches 1 over time.*  
  ⁴ *For a merged pool, the growth-optimal strategy solves max ∑ 𝜋_𝑖 log(1 + 𝑓_𝑖 𝑋_𝑖), where 𝑋_𝑖 are joint returns. Independent Kelly bets are suboptimal when capital is shared.*
