   This gives cumulative factor 0.27 -> 73% loss. Arithmetic mean: (200-90+200-90+200)/5 = 420/5=84%. Geometric mean: (0.27)^(1/5) ≈ 0.27^0.2 ≈ 0.77 -> -23% per year? 

