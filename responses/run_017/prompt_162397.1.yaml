  ### Scenario: Patent Litigation
  Two pharmaceutical firms, A and B, are litigating a patent worth $100,000. Rules:  
  - All legal fees are sunk upon payment.  
  - The winner takes the patent; the loser forfeits all fees paid.  
  - The judge rules for the party with higher *total* litigation spending if the difference exceeds $40,000; otherwise, a coin flip decides.  
  A has already spent $50,000 on legal fees. B has spent nothing. Both value the patent at $100,000 and face symmetric trial costs. The next trial phase costs $10,000.  

  ### Analysis  
  **1. Payoffs and Decisions**  
  - *If B settles (doesn't proceed)*:  
    - A proceeds: Wins patent ($100,000), minus sunk $50,000 and new $10,000 → **$40,000 net**.  
    - A settles: Splits patent ($50,000) minus sunk $50,000 → **$0 net**.  
  - *If B proceeds*:  
    - A proceeds: Total spend = $60,000 (A) vs. $10,000 (B). Difference = $50,000 > $40,000 → A wins, nets $100,000 - $60,000 = **$40,000**.  
    - A settles: B wins. A loses sunk $50,000 → **-$50,000 net**.  
  B’s payoffs symmetrically mirror A’s (e.g., if both proceed, B loses $10,000).  

  **2. Rational Choices**  
  - **A’s decision**:  
    - If B settles, A nets $40,000 (proceed) or $0 (settle). **Proceeds**.  
    - If B proceeds, A nets $40,000 (proceed) or -$50,000 (settle). **Proceeds**.  
    → A *always* proceeds, netting $40,000.  
  - **B’s decision**:  
    - If A proceeds (certain), B nets $0 (settle) or -$10,000 (proceed). **Settles**.  
  Outcome: A proceeds, B settles. A nets **$40,000 - $50,000 - $10,000 = -$20,000**.  

  **3. Verification of Conditions**  
  - (1) Ordinary setting (patent lawsuit), irrevocable outlays.  
  - (2) A sunk $50,000; B sunk $0; symmetric otherwise.  
  - (3) A proceeds rationally: Nets -$20,000 (best available). B doesn’t enter: Nets $0 (better than -$10,000).  
  - (4) A’s total: -$20,000 < 0. A wishes never started: Starting guaranteed a net loss (patent value < minimum spend to win).  
  - (5) Sunk cost does no "work": Difference stems from common knowledge of the judge’s threshold rule. A’s $50,000 ensures spending difference >$40,000 if both proceed, deterring B. No loss aversion, reputation, or assets involved.  

  ### Key Feature and Robustness  
  **Single feature**: The **threshold rule** (judge awards prize if spending difference >$40,000).  
  - **Remove it?** If judge always uses a coin flip:  
    Both proceed (expecting -$40,000 each in equilibrium). Outcome: Classic dollar auction trap (A nets -$60,000; B nets -$10,000).  
    Why? Sunk costs don’t deter B; symmetric escalation occurs.  

  **Objection**: "Sunk costs don’t matter—only the audience (judge) does. This smuggles in a third element."  
  **Reply**: The judge’s rule is a fixed institutional constraint, not an "audience." The rule makes spending levels (not just increments) strategically relevant. Crucially, the sunk cost matters *only* because it becomes common knowledge that shifts B’s expectations. A’s expenditure doesn’t intrinsically motivate action; it informs B that A *must* win to avoid ruin, altering B’s payoffs. Remove the asymmetry in sunk costs (both at $0), and symmetry returns.  
  **Solid for second-years?** Yes. It demonstrates that institutional rules can make sunk costs *informative*, affecting opponents’ behavior—without endorsing "sunk costs as direct reasons." The payoffs are derived, not stipulated.  

  ### Why This Works  
  The threshold rule transforms sunk costs into a commitment device via common knowledge. A’s spending signals that proceeding will trigger the threshold, making B’s entry irrational. Sunk costs are inert but informative—a nuance beyond "never consider them."  
  **Overconstrained?** Clause 5 holds if the rule is structural (like auction rules). If not, relax it slightly: The core insight (common knowledge alters incentives) remains intact.
