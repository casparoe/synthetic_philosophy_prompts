   setting: A and B are in a lawsuit with a pre-trial settlement offer. Prize is $100,000. A has already spent $50,000 in pre-trial preparation. B has spent $0. The trial is about to start, and it will cost each side $10,000 to go to trial. The catch: if the case goes to trial, the judge will rule in favor of the party that has spent more in total preparation (including the trial cost) by at least $40,000. If the difference is less than $40,000, then the judge will rule by coin flip.

  So rules:
  - If the case does not go to trial, they can settle by splitting the prize equally: $50,000 each, but then they avoid the trial cost. But then A has spent $50,000, so A would get $50,000 - $50,000 = 0, while B gets $50,000. settlement in this context usually means they agree on a split and avoid further costs.

  But we want them to have the option to go to trial.

  Assume that if they go to trial, then the winner is determined by the spending difference.

  Specifically, after both have spent the trial cost of $10,000, the judge compares the total spending by each side (including the $10,000). If one side has spent at least $40,000 more than the other, that side wins. Otherwise, coin flip.

  Now, at the current moment, A has spent $50,000, B $0.

  They must simultaneously decide whether to go to trial or settle. If both settle, then they split the prize: $50,000 each. If one goes to trial and the other settles, then the one who goes to trial wins the prize (because the other dropped out), but must pay the trial cost. If both go to trial, then they each pay $10,000, and then the judge compares total spending: A has $50,000+$10,000=$60,000, B has $0+$10,000=$10,000, difference $50,000 which is > $40,000, so A wins.

  Payoffs if both go to trial:
  - A: gets the prize $100,000 minus total spending $60,000 = $40,000.
  - B: spends $10,000 and gets nothing, net -$10,000.

  If both settle:
  - A: gets $50,000 - $50,000 = 0.
  - B: gets $50,000.

  If A goes to trial and B settles:
  - A: wins, gets $100,000 - $50,000 (already spent) - $10,000 (trial) = $40,000.
  - B: settles, so gets $0 from the prize (since A wins) but has spent nothing, so 0. (But typically in settlement, if only one goes to trial, they win, so the other gets nothing and doesn't spend extra.)

  If A settles and B goes to trial:
  - A: has spent $50,000, gets nothing from the prize (since B wins), net -$50,000.
  - B: wins, gets $100,000 - $10,000 = $90,000.

  Now, we have a simultaneous move game in the trial decision.

  A's choices:
  - Settle: if B settles, A gets 0; if B goes to trial, A gets -$50,000.
  - Go to trial: if B settles, A gets $40,000; if B goes to trial, A gets $40,000.

  B's choices:
  - Settle: if A settles, B gets $50,000; if A goes to trial, B gets 0.
  - Go to trial: if A settles, B gets $90,000; if A goes to trial, B gets -$10,000.

  Now, let's build the matrix:

  ```
            B settles      B goes to trial
  A settles  (0, 50,000)    (-50,000, 90,000)
  A goes to trial (40,000, 0)   (40,000, -10,000)
  ```

  Now, for A:
  - If A settles, it gets either 0 or -50,000.
  - If A goes to trial, it gets 40,000 or 40,000.

  So A will go to trial because 40,000 > 0 and 40,000 > -50,000. (dominant strategy)

  For B:
  - If B settles, it gets 50,000 or 0.
  - If B goes to trial, it gets 90,000 or -10,000.

  There is no dominant strategy for B. But or in Bayesian Nash, they will play pure strategies. Given that A has a dominant strategy to go to trial, then B knows that if it settles, it gets 0 (because A goes to trial), and if it goes to trial, it gets -10,000. So B will settle and get 0.

  Therefore, the outcome is: A goes to trial, B settles. So A gets $40,000, B gets 0.

  But then A has a positive outcome, not negative.

  Not what we want.

  We want A to have a negative outcome.

   So make the prize smaller, say $80,000.

   Then:

   If both go to trial: A wins, gets $80,000 - $60,000 = $20,000; B -10,000.

   If both settle: A 0, B $40,000 (split $80,000).

   If A goes to trial and B settles: A gets $80,000 - $60,000 = $20,000? Wait, no: if B settles, then A only spends the $50,000 already spent and then $10,000 for trial, and wins, so $80,000 - $60,000 = $20,000.

   If A settles and B goes to trial: A -$50,000, B $80,000 - $10,000 = $70,000.

   Matrix for prize=$80,000:

   ```
            B settles         B goes to trial
  A settles  (0, 40,000)      (-50,000, 70,000)
  A goes to trial (20,000, 0)    (20,000, -10,000)
  ```

   A has a dominant strategy to go to trial (20,000 > 0 and 20,000 > -50,000).

   B, knowing that A will go to trial, then:
   - If B settles, gets 0.
   - If B goes to trial, gets -10,000.
   so B settles.

   Outcome: A gets 20,000, which is positive.

  Still not.

   Make the prize $40,000.

   Then:
   Both go to trial: A wins, gets $40,000 - $60,000 = -$20,000; B -10,000.

   Both settle: split $40,000, so A: $20,000 - $50,000 = -$30,000? Wait, settlement: if they settle, do they get half the prize without further cost? So A's net: $20,000 - $50,000 = -$30,000. B: $20,000.

   If A goes to trial and B settles: A wins, gets $40,000 - $50,000 - $10,000 = -$20,000. B: 0.

   If A settles and B goes to trial: A gets -$50,000, B gets $40,000 - $10,000 = $30,000.

   Matrix:
   ```
            B settles         B goes to trial
  A settles  (-30,000, 20,000)  (-50,000, 30,000)
  A goes to trial (-20,000, 0)   (-20,000, -10,000)
  ```

   A has a choice between:
   - Settle: -30,000 or -50,000.
   - Go to trial: -20,000 or -20,000.
   So A has a dominant strategy to go to trial.

   B, knowing that, will choose:
   - Settle: 0.
   - Go to trial: -10,000.
   so B settles.

   Outcome: A goes to trial, B settles, A gets -$20,000.

   Now, A has sunk $50,000 already, and then spends $10,000 more, and gets the prize of $40,000, so net -$20,000.

   A wishes it had never entered. If A had not entered, A would have 0.

   Is it rational for A to go to trial? Yes, because -20,000 is better than -30,000 or -50,000.

   B does not go to trial, so B spends nothing more.

   The only thing: when A goes to trial and B settles, A's net is -$20,000, which is negative.

   So this meets:
   1. Ordinary setting: lawsuit.
   2. A has sunk $50,000, B nothing.
   3. It is rational for A to go to trial ( because otherwise it would get -30,000 or -50,000, and going to trial yields -20,000) and not rational for B to go to trial ( because if B goes to trial, it would get -10,000, while settling yields 0).
   4. A's total position is -$20,000, negative, and was always going to be negative because even if A wins, the prize is only $40,000 and A has spent $60,000. So A wishes it had never entered.
   5. The difference does not come from the sunk cost doing any work as a sunk cost. It comes from the rule of the judge: the judge will rule in favor of the party that has spent more by at least $40,000. Because A has already spent $50,000, if both go to trial, A's total spending will be $60,000 and B's $10,000, difference $50,000 > $40,000, so A wins. This is common knowledge. B knows that if it goes to trial, it will lose $10,000 for sure. So B doesn't enter (doesn't go to trial). The sunk cost by A has not given A any asset, but it has created a situation where in the trial, A will win if both go, and this is common knowledge. The asymmetry is that B knows that A has spent $50,000, and A knows that B knows, etc., and this knowledge affects B's behavior.

  Now, meet the specs explicitly:

  - Payoffs: 
    - If both settle: A: $20,000 - $50,000 = -$30,000; B: $20,000.
    - If both go to trial: A: $40,000 - $60,000 = -$20,000; B: -$10,000.
    - If A goes to trial and B settles: A: $40,000 - $60,000 = -$20,000; B: 0.
    - If A settles and B goes to trial: A: -$50,000; B: $30,000.

  - A has a dominant strategy to go to trial because -20,000 > -30,000 and -20,000 > -50,000.
  - B, knowing A will go to trial, chooses to settle (0 > -10,000).
  - So outcome: A goes to trial, B settles, A gets -$20,000.
  - A's total position is -$20,000, which is negative. If A had never entered, it would have 0, so A wishes it had never entered.

  Now, the single feature doing the work: the judge's rule that if the difference in spending is at least $40,000, the higher spender wins. This rule is known and depends on the absolute spending levels, not just the difference in this stage.

  If we remove this rule and instead the judge always rules by coin flip, then in the trial, if both go, expected for A: 0.5*($40,000 - $60,000) + 0.5*(-$60,000) = 0.5*(-20,000) + 0.5*(-60,000) = -10,000 -30,000 = -40,000.
  Matrix with prize=$40,000 and coin flip:
  ```
            B settles         B goes to trial
  A settles  (-30,000, 20,000)  (-50,000, 30,000)
  A goes to trial: if B settles, A gets -20,000; if B goes to trial, A gets expected -40,000.
  ```

   A's choices:
   - Settle: -30,000 or -50,000
   - Go to trial: -20,000 (if B settles) or -40,000 (if B goes to trial)

   Since A doesn't know what B will do, and there is no dominant strategy, but in Nash equilibrium, we can compute.

   B's choices:
   - Settle: if A settles, 20,000; if A goes to trial, 0.
   - Go to trial: if A settles, 30,000; if A goes to trial, expected: 0.5* (40,000 -10,000) + 0.5*(-10,000) = 0.5*30,000 + 0.5*(-10,000) = 15,000 - 5,000 = 10,000.

   This is getting messy, and likely they will both go to trial or something, and A may end up with -40,000, but then it might be even worse, and B may enter. But the point is that without the judge's rule, the sunk cost does not give A an advantage, and they may both end up in a dollar auction-like situation.

   In this case with the rule, it is the judge's threshold rule that does the work.

  Objection by someone who says sunk costs are never reasons: they might say that the sunk cost here is not directly a reason, but the rule of the judge makes the total spending matter, so it's the rule that is the third element, not the sunk cost itself.

  Reply: The rule is part of the game, and the sunk cost is a bygone, but in this setup, the sunk cost changes the outcome by meeting the threshold. However, the sunk cost itself is not a reason for action; it is the expected future spending and the rule that matter. But the sunk cost has already happened, and it changes the strategic situation by altering the future path. In particular, because of the sunk cost, the judge's rule will be triggered in A's favor if both go to trial, which deters B from going to trial. This is a case where the sunk cost, even though not recoverable, has a real effect on the behavior of others because of the institutional rules. 

  Is this solid enough for second-years? Yes, because it shows that in a game with specific rules, the sunk cost can have a strategic effect by changing the equilibrium. The sunk cost as such doesn't matter, but the common knowledge about it does, because it affects the expectations of the other player's actions.

  So in this case, it's not that the sunk cost is a reason in isolation, but it becomes a reason when combined with the rules of the game and the strategic interaction.

   This meets the user's point: never let sunk costs guide you is too crude, because in some institutional settings, the fact that you have sunk costs may be common knowledge and may affect others' behavior, so you should take that into account. But the sunk cost itself is not a direct reason; it's the information it conveys and the effect on the game.
