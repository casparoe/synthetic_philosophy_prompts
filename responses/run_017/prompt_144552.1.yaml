prompt: |-
  I am the human-factors lead at a metropolitan rail operator, and I want a reusable procedure built out of the notion of sphexishness. I have two recurring jobs that need it. The first is authoring and revising rule-book procedures for signallers and drivers: roughly forty to fifty revisions a year, each of which has to decide whether a step should be scripted as tightly as possible or left to the operator's judgement on the ground. The second is chairing incident reviews: about a dozen a year, two working days of effort each, one ninety-minute debrief with the operator conducted three or four days after the event, no simulator access in the ordinary case, and only the data recorder and the debrief to go on. My reports go to the national rail regulator, whose analysts have no training in philosophy, and to union-nominated safety representatives. That second audience matters: a report that reads as though it called a driver a machine gets appealed and poisons the next twelve reviews, and a report that reads as excusing everyone gets ignored.

  By sphexishness I mean the property the textbook digger wasp is supposed to illustrate: an animal runs a fixed sequence triggered by a cue, and when the experimenter restores the cue after the point of the step has already been achieved, the animal repeats the step, apparently without registering that it no longer needs to. I do not want the procedure to rest on the accuracy of those original observations; use the story as an illustration only, and justify the tests on their own footing.

  What I need is a decision procedure, in words, that a field investigator with a two-day budget can actually run, with:

  1. The tests in the order they should be applied, what counts as a sufficient answer to each, where the procedure terminates in a verdict, and where it must stop and hand the question to a person because it is a question of values rather than fact. Where a test needs evidence I cannot get, mark it optional and say what is lost by skipping it.
  2. A fixed specification of grain. Rigidity looks relative to a description: at a fine enough grain everything is fixed, at a coarse enough grain nothing is. The procedure has to say what grain it tests at, and why that is the right grain for deciding whether an organisation may fairly attribute an outcome to a person.
  3. A verdict vocabulary I can put in a report, in language an analyst with no philosophy training will accept, distinguishing the case where the operator was rigid from the case where the operator adapted badly under pressure, and saying what each verdict does and does not license by way of consequence.
  4. An honest statement of what the procedure cannot do.

  Four things the procedure has to get right, and on which I want your own view rather than an echo of mine.

  The first is the grain problem above. The second is a slide my colleagues keep making and I keep failing to answer in a sentence: they go from these cases plus the thought that every action is caused to the conclusion that operators are never responsible. I believe this conflates being caused with being rigid, since a deterministic system can be extremely flexible in the relevant sense; but I want the procedure to be built so that it cannot make this slide, and if the argument has a better version than the one I have just given, I would rather you told me than flattened it.

  The third is my working taxonomy of failure modes, which I want you to use, correct, or replace: a step that once started runs to completion regardless of what changes; a step that re-runs whenever its trigger cue is present even though the point of the step has already been achieved; and a step that works across familiar configurations but produces nothing appropriate under a relevantly novel one. Are these independent? Is there a fourth? And in particular, what should the procedure say about two hard cases I cannot place: behaviour that looks flexible because it is drawn from a very large store of memorised cases rather than from any appreciation of the situation, and routines for being flexible that have themselves gone rigid, such as a mandatory stop-and-check that everyone signs without checking. I would also be grateful if the procedure contained some defence against its own second case, because my team will otherwise apply it mechanically within a year.

  The fourth is evidence. The natural test for rigidity is counterfactual: if things had been slightly different in some specified way, would the operator have done something appropriately different. I usually cannot run that experiment, and the debrief I do have is contaminated by the operator knowing how it turned out. So the procedure needs to say how to assess counterfactual sensitivity from what is actually available, and what to do when the evidence runs out: default to a system verdict, default to an operator verdict, or refuse to classify.

  Then run it on three cases.

  A. A read-back requirement we introduced for degraded working: when a driver is authorised to pass a signal at danger, the driver must repeat the instruction and the signal number back to the signaller before moving. Compliance is near perfect and errors in the content of the read-back are rising; drivers recite it fluently and get the signal number wrong. Is this step now sphexish, and does the procedure tell me to tighten the script, remove the step in favour of judgement, or do something else?

  B. A signaller faced three alarms in eleven seconds during a power-supply fault. He worked through them in rulebook order. Correctly handling the third required departing from that order. He did not depart. His compliance with the rulebook was perfect. A train was routed at low speed into a possession; nobody was injured. Is this the organisation's design having made him rigid, or a failure attributable to him?

  C. A driver with thirty years' service, well regarded, working a fatiguing roster, passed a temporary speed restriction at line speed in darkness. The board had been moved two nights earlier for works, at a site where a similar board had stood for months, and the change was covered by one line in a weekly notice. He registered that something looked off and had time to act on it. I would very much rather not have to write that this one is attributable to him: the organisation plainly failed him on rostering and on briefing, my team will not thank me, and the union will appeal. If your procedure says I must write it anyway, say so plainly and show the steps. If it says something else, show me the step at which it turns and what that step assumes.

  Finally, tell me where the procedure misfires. I specifically want to know whether it can distinguish genuine flexibility from an enormous library of canned responses, whether it can say anything about how much burden the organisation should carry as opposed to the individual, and how much room it leaves an investigator to smuggle in their own view through the choice of which counterfactuals to test.
reasoning: |-
  We are building a decision procedure based on the concept of sphexishness (rigid, cue-driven behavior) to assess whether an operator's action in a given incident was rigid (and thus more attributable to system design) or flexible but poorly adapted (and thus more attributable to individual judgment). The procedure must be practical for a field investigator with a two-day budget and limited evidence.

  Key elements:
  1. **Grain specification**: We will fix the grain at the level of **operational steps** as defined in the rulebook or standard operating procedures. This is because the rulebook is the organization's formal specification of expected behavior, and it is at this level that we can meaningfully discuss whether a step was followed rigidly or with appropriate adaptation. This grain is also the level at which we attribute outcomes to either the system (if the step is rigidly followed even when inappropriate) or the individual (if the step was adaptable but the individual failed to adapt appropriately).

  2. **Verdict vocabulary**: We will use two main verdicts:
     - **System-induced rigidity (SIR)**: The action was the result of a rigid, cue-driven process that the organization's design (training, procedures, tools) failed to make appropriately sensitive to context. This verdict implies that the system should be redesigned to build in flexibility or better cues.
     - **Individual maladaptation (IM)**: The action was the result of the individual failing to adapt appropriately despite having the necessary flexibility (as per design) and context. This verdict implies that individual retraining or accountability may be warranted, but also that the system might need to support better adaptation.

     We also need a third category for cases that are unclear or where evidence is insufficient:
     - **Inconclusive**: The evidence does not allow a clear attribution to either SIR or IM.

     The verdicts must be explained in plain language. For example:
     - SIR: "The organization's procedures and training led the operator to follow a fixed pattern even when it was not safe to do so. The operator did what they were trained and expected to do, but the system did not provide the means to recognize when a change was needed."
     - IM: "The operator had the training and tools to recognize the situation and adjust their actions accordingly, but failed to do so. This may be due to factors such as stress, fatigue, or individual error."

  3. **Decision Procedure Steps**:

     We break the procedure into sequential tests. The goal is to determine whether the action in question was rigid (sphexish) or flexible but poorly executed.

     **Step 1: Define the operational step in question and its intended purpose.**
        - What was the step? (e.g., "read back the signal instruction")
        - What was its intended purpose? (e.g., "to ensure the driver has correctly understood the instruction and the specific signal")
        - Evidence: Rulebook, procedures, training materials.
        - If the step or purpose cannot be defined, terminate as inconclusive (but this should be rare).

     **Step 2: Determine if the step was executed.**
        - Did the operator perform the step? If not, then the issue may be non-compliance and the procedure does not apply. (But note: non-compliance might be due to rigidity if the step was skipped because of a rigid adherence to another routine.)
        - If the step was not executed, and we are investigating why, we might need a separate branch. For our focus, we assume the step was executed and we are assessing its rigidity.

     **Step 3: Test for cue-dependency without purpose check (Type 1 rigidity)**
        - Ask: Was the step triggered by a specific cue and then run to completion without any check that the purpose of the step was achieved?
        - Evidence: Look for repetition of the step when the cue reappears even if the purpose is already met (like the wasp). Alternatively, in the incident, did the operator perform the step even when the purpose was already achieved? Also, in training or simulations, does the operator always perform the step when the cue is present?
        - If yes, then this is evidence of Type 1 rigidity (cue-driven without purpose check). This suggests SIR.
        - Optional: If we have access to simulations or multiple incidents, we can test by altering the cue. Without this, we rely on the debrief and any past evidence. If skipped, we lose the strongest evidence for rigidity.

     **Step 4: Test for lack of adaptability to context (Type 2 rigidity)**
        - Ask: When the context changed in a way that made the step inappropriate or ineffective, did the operator still perform the step without modification? And was this change in context one that the operator should have been trained to notice?
        - Evidence: Debrief the operator about the context and what they noticed. Look at training records: were they trained on when to adapt or when the step might be inappropriate? Check for any prior similar incidents.
        - If the operator performed the step rigidly despite a context change that should have triggered adaptation, then this is Type 2 rigidity (context-insensitivity). This suggests SIR.
        - If the operator was trained and had the resources to notice the context change but failed to do so, then it might be IM. However, if the system did not train for that context or provide the necessary information, then it's SIR.
        - This step may require judgment: if the context change was rare and not covered in training, then SIR. If it was covered and the operator still failed, then IM.

     **Step 5: Test for overlearned behavior (Type 3 rigidity)**
        - This addresses the issue of a large library of memorized responses. We ask: Was the behavior a direct retrieval of a memorized response without any evaluation of the current situation? And was the situation sufficiently novel that the memorized response was inappropriate?
        - Evidence: Debrief the operator on their thought process. Did they recall a prior case and apply it without checking? Look for patterns in the operator's history: do they always do the same thing in similar-looking situations? Is there evidence of rote learning without understanding?
        - If the operator used a memorized response inappropriately and the system encouraged this (e.g., training focused on memorization without conceptual understanding), then SIR. If the operator had the understanding and tools to evaluate the situation but defaulted to a memorized case without thinking, then IM.

     **Step 6: Test for meta-rigidity (rigid flexibility)**
        - This is the case where routines for being flexible (like a stop-and-check) have become rigid. Ask: Did the operator perform a routine that is intended to prompt flexibility (e.g., a checklist) in a rote manner without actually engaging in the intended flexible thinking?
        - Evidence: Look for patterns of behavior: e.g., always taking the same time for a stop-and-check regardless of complexity, or not varying behavior after the check. Debrief: ask what the operator was thinking during the step. If the operator cannot recall any actual evaluation, that is evidence of meta-rigidity.
        - If the step was performed rigidly, then it is Type 1 or Type 2 rigidity. The key is that the step was intended to induce flexibility but became a rigid step itself. This suggests SIR because the system designed the flexibility routine in a way that allowed it to become rigid.

     **Step 7: Evaluate counterfactual sensitivity (if evidence permits)**
        - We want to know: If the situation had been slightly different, would the operator have done something appropriately different? But we cannot run experiments. We use:
          - Similar past incidents: How did the operator or others behave in similar but slightly different situations?
          - Training records: How was the operator trained to handle variations?
          - Debrief: Ask the operator what they would have done if a specific aspect had been different. (Caution: hindsight bias and contamination.)
        - If there is evidence that the operator would have adapted appropriately in a slightly different context, then the behavior was flexible and any failure is more likely IM. If the operator would have done the same thing regardless of the change, then rigidity (SIR).
        - This step is often inconclusive due to evidence limitations. We mark it optional. If skipped, we rely on the previous tests.

     **Step 8: Make a verdict**
        - If any of the rigidity tests (Steps 3-6) are positive, then the verdict is SIR.
        - If the tests for rigidity are negative, then we consider IM. But we must ensure that the individual had the capacity and tools to adapt. If the system failed to provide that capacity, then SIR.
        - If we cannot determine (insufficient evidence), then inconclusive.

     **Step 9: Consider contributing factors**
        - Even if the verdict is SIR, we note individual factors (fatigue, stress) that might have made the rigidity more likely. Similarly, for IM, we note system factors that set the stage. But the verdict focuses on the primary attribution.

  4. **What the procedure cannot do**:
     - It cannot assign moral responsibility; it is about causal attribution for the purpose of system improvement.
     - It cannot definitively prove what was in the operator's mind; it relies on observable behavior and available evidence.
     - It may not resolve cases where the behavior is a mix of rigidity and maladaptation. We focus on the dominant factor.
     - It may be influenced by the investigator's choice of counterfactuals. To mitigate, the procedure requires the investigator to base counterfactuals on the organization's defined operational context (from rulebooks, training) and to document them.

  **Addressing the four key issues**:

  1. **Grain**: We set the grain at the operational step level because that is the level at which the organization prescribes behavior. This is the right grain because it matches the level of design and allows us to see if the step was performed as a fixed block or with adaptability.

  2. **Avoiding the slide from determinism to no responsibility**: The procedure is built to test for rigidity (cue-driven, context-insensitive behavior) not determinism. We acknowledge that behavior is caused but note that systems can be designed to be more or less flexible. The verdict SIR does not mean the individual is a machine, but that the system design did not allow for appropriate flexibility. The verdict IM does not mean the individual is free from causal influences, but that they failed to use the flexibility that the system provided.

  3. **Taxonomy of failure modes**:
     - We adopt and extend your taxonomy:
       - Type 1: Cue-triggered without purpose check (original first and second cases).
       - Type 2: Context-insensitivity (original third case).
       - Type 3: Overlearned behavior (memorized cases without evaluation) — added as a distinct type because it can mimic flexibility.
       - Type 4: Meta-rigidity (rigid routines for flexibility) — added.

     They are not entirely independent. For example, Type 3 might lead to Type 2 in a novel context.

     The two hard cases:
       - **Enormous library of memorized cases**: We treat this as Type 3. The procedure (Step 5) tests for it by looking for lack of evaluation in a novel context. If the system trained by memorization without understanding, then SIR. If the individual defaulted to memory when they should have thought, then IM.
       - **Rigid routines for flexibility**: We treat this as Type 4 (meta-rigidity) and test in Step 6. It is a form of Type 1 or 2 applied to a flexibility routine. We attribute it to SIR because the system allowed the routine to become rote.

     Defense against the second case (meta-rigidity): The procedure itself must not be applied rigidly. We build in:
       - Requiring the investigator to consider the purpose of the step (Step 1) and to test for whether that purpose was achieved (Step 3).
       - In Step 6, specifically looking for meta-rigidity.

  4. **Evidence for counterfactuals**: We rely on:
        - Debriefs: Ask the operator what they were thinking at the time (to avoid hindsight, ask about their state of mind during the incident) and what factors they considered. Also, ask about similar past experiences and how they handled them.
        - Training records: What variations were trained?
        - Past incidents: How have other operators handled similar situations?
        - If evidence is insufficient, we do not default. We note that the counterfactual test is inconclusive and base the verdict on the other tests.

     When evidence runs out, we do not default arbitrarily. We use the available tests and if they are inconclusive, we return an inconclusive verdict.

  **Running the cases**:

  Case A: Read-back requirement in degraded working.
  - Step 1: Step is the read-back. Purpose: to verify correct understanding of the instruction and signal number.
  - Step 2: Step was executed (compliance is high).
  - Step 3: Test for Type 1 rigidity. Drivers recite fluently and get the signal number wrong. This suggests they are performing the step without checking the purpose (correct understanding). They are triggered by the cue (authorization to pass) and run the read-back without ensuring accuracy. Evidence: rising errors in content. Verdict: Type 1 rigidity (SIR).
  - Step 4: Not directly applicable, but the context (degraded working) is supposed to be high-risk, so the step should be done carefully. The fact that errors are rising suggests context-insensitivity (Type 2) as well? But the dominant pattern is Type 1.
  - Step 5: Possibly overlearned? They have memorized the read-back routine but not the specific details? This would be Type 3, but the system may have encouraged memorization of the routine without attention to the variable (signal number). So SIR.
  - Step 6: Not applicable.
  - Step 7: Counterfactual: If the signal number were different, would they notice? The errors suggest not.
  - Verdict: SIR. The system has made the step rigid. The procedure does not suggest tightening the script (that might make it more rigid) but rather redesigning the step to force attention to the variable part (e.g., by having the signaller ask for the signal number specifically, or by introducing a pause for verification). Removing the step might be worse. The system needs to break the rigidity.

  Case B: Signaller faced multiple alarms, worked in rulebook order, did not depart when needed.
  - Step 1: The step is following the rulebook order for handling alarms. Purpose: to prioritize and handle alarms safely and efficiently.
  - Step 2: Step was executed (perfect compliance).
  - Step 3: Type 1? The cue (alarm) triggers the rulebook procedure. But note: the step is running to completion without checking if the purpose (safe handling) is being achieved? The signaller did not check if the order was still appropriate when the third alarm came. So Type 1 rigidity? But also...
  - Step 4: Type 2 rigidity? The context changed (three alarms in quick succession, which might require re-prioritization). The rulebook may allow for departure in such cases? We need to check the rulebook. If the rulebook says to follow the order unless a specific condition (which was present) occurs, then the signaller should have adapted. If the rulebook does not allow for departure, then SIR because the system did not allow flexibility. If it does allow departure and the signaller was trained on when to depart, then we test for why they didn't. 
  - Evidence: Debrief the signaller. Why didn't they re-prioritize? Did they notice the third alarm required immediate action? Were they trained on when to break order? 
  - Step 5: Not applicable.
  - Step 6: Not applicable.
  - Step 7: Counterfactual: If the third alarm had been the first, would they have handled it correctly? Probably. If the rulebook order had been different, would they have followed it? Yes. This suggests rigidity to the order.
  - Verdict: If the rulebook and training did not provide guidance on when to break the order, then SIR. If they did, and the signaller failed to apply that guidance, then IM. But note: the stress of multiple alarms might have made adaptation harder, which is a system factor (rostering, training for stress). However, the primary issue is the rigidity in following the order. Given that the correct handling required departure and the signaller did not, and if the rulebook does not explicitly allow for departure, then SIR. If it does allow and the signaller failed to use the allowed flexibility, then IM.

  Case C: Driver passed a temporary speed restriction at line speed.
  - Step 1: The step is observing and obeying temporary speed restrictions. Purpose: to slow down at the designated location for safety.
  - Step 2: The step was not executed (he did not slow down).
  - But note: He registered something looked off. So we are investigating why he didn't slow down.
  - Step 3: Not directly applicable because he didn't perform the step. However, we might reframe: why didn't he perform the step? Was there a cue that he missed? The board had been moved. The cue (the board) was present but in a new location. He noticed something off but did not act.
  - Step 4: Type 2 rigidity? The context changed (board moved), but he was still relying on the old location (which had a board for months). He did not adapt by checking for new boards or by remembering the notice. He had time to act. 
  - Step 5: Type 3? He had a memorized response for that stretch of track (no speed restriction at that point) and didn't update it. The notice was one line in a weekly notice, which might be inadequate.
  - System factors: rostering (fatigue), inadequate briefing.
  - Step 4 and 5: The key is whether the system provided the tools and training to update his mental model. If the system relies on drivers reading every line of the weekly notice and memorizing it, that might be unrealistic (SIR). If the driver was expected to notice the board and he did notice something off but failed to act, then IM.
  - Step 7: Counterfactual: If the board had been in the old location, would he have slowed? Yes. If the board had been in the new location and he was well-rested and had read the notice, would he have slowed? Yes. But he was fatigued and might have missed the notice. 
  - Verdict: This is a mix. The system failed in rostering and briefing (SIR factors). But the driver noticed something off and had time to act. The step of adjusting to a changed board location is a flexible one. The organization expects drivers to be vigilant and to react to what they see. Therefore, the failure to act on what he noticed is IM. However, the system contributed by fatigue and possibly inadequate notice. The verdict should be IM with system contributing factors. The procedure would say: at Step 4, the driver should have adapted (he noticed the context change) but failed to do so. The system did not force rigidity here; the driver had flexibility but did not use it. Therefore, IM. But the report should note the system factors.

  **Where the procedure misfires**:
     - **Genuine flexibility vs. memorized responses**: The procedure tries to distinguish by looking for evaluation (Step 5) and by context (Step 4). But in practice, if an operator has a vast library and retrieves the right response, it may be indistinguishable from flexible thinking. The procedure relies on the operator's ability to articulate their thought process and on the novelty of the situation. In a novel situation, a memorized response is more likely to be wrong, so if it's right, it might be flexible. This is a weakness.
     - **Burden sharing**: The procedure attributes primarily to either system or individual, but many incidents involve both. We have a contributing factors section to note the other. However, the verdict is about the dominant cause of the specific action.
     - **Investigator bias in counterfactuals**: The procedure requires the investigator to use counterfactuals based on the organization's defined operational context (from procedures and training) and to document them. But there is still room for bias. To mitigate, the procedure should require multiple investigators to agree on the counterfactuals.

  **Final Procedure Outline**:

  1. Define the step and purpose.
  2. Confirm the step was executed (if not, investigate non-compliance separately).
  3. Test for Type 1 rigidity (cue without purpose check): If yes, SIR.
  4. Test for Type 2 rigidity (context-insensitivity): If yes, SIR; if the system provided the means for adaptation but the individual did not use them, IM.
  5. Test for Type 3 rigidity (overlearned behavior): If yes, and system encouraged it, SIR; if individual defaulted to memory when they should have thought, IM.
  6. Test for Type 4 rigidity (meta-rigidity): If yes, SIR.
  7. (Optional) Test counterfactual sensitivity: If the behavior was rigid (same in counterfactuals), SIR; if flexible, IM.
  8. If any rigidity type is found, verdict SIR. If no rigidity but the individual failed to adapt when they could have, verdict IM. Otherwise, inconclusive.
  9. Document contributing factors.

  This procedure is designed to be run in two days, using available evidence (debrief, data recorder, rulebooks, training materials). It produces a verdict that is defensible to regulators and unions.
answer: |-
  Below is a reusable decision procedure for assessing sphexishness (rigid, cue-driven behavior) in rail operations, designed for your two recurring tasks: rulebook revisions and incident reviews. The procedure addresses your requirements, including grain specification, verdict vocabulary, evidence constraints, and safeguards against common pitfalls. It is structured as a step-by-step guide for field investigators with a two-day budget, emphasizing practicality and defensibility in reports.

  ---

  ### **Sphexishness Assessment Procedure**
  **Purpose**: To determine whether an operator's action was rigidly cue-driven (attributable to system design) or a failure of adaptive judgment (attributable to the individual), based on available evidence.  
  **Grain Specification**: Actions are assessed at the level of **discrete operational steps** (e.g., "read back an instruction," "acknowledge an alarm"). This grain is chosen because:  
  - It aligns with how rulebooks and procedures define tasks.  
  - It allows clear attribution: if a step is rigid, the system is at fault for over-scripting; if flexible but misapplied, the individual bears responsibility for poor adaptation.  
  - Coarser grains (e.g., "drive safely") obscure causality; finer grains (e.g., muscle movements) are irrelevant to operational decisions.

  **Verdict Vocabulary** (for reports):  
  1. **System-Induced Rigidity (SIR)**:  
     - **What it means**: The action was automatically triggered by a cue and executed rigidly, without sensitivity to context or purpose. The system (procedures, training, tools) failed to enable adaptation.  
     - **Consequences licensed**: Redesign procedures, training, or tools to build in flexibility or better cues. *Not* license: Blaming the operator or punitive action.  
     - **Report language**: "The action resulted from a procedural design that did not allow the operator to adjust to context, despite compliance."  

  2. **Individual Maladaptation (IM)**:  
     - **What it means**: The operator had the flexibility and tools to adapt but made a poor judgment under the circumstances.  
     - **Consequences licensed**: Retraining, coaching, or accountability for the individual. *Not* license: Ignoring system factors (e.g., fatigue, poor briefing).  
     - **Report language**: "The operator had the means to recognize and respond to the situation but failed to do so appropriately."  

  3. **Inconclusive**:  
     - **What it means**: Evidence is insufficient to classify as SIR or IM.  
     - **Consequences licensed**: Further investigation or systemic improvements based on risk.  
     - **Report language**: "Evidence does not support a clear attribution to system design or individual action."

  **Decision Procedure Steps**  
  *Apply in order; terminate early if a verdict is reached. Document evidence at each step.*

  1. **Define the Step and Purpose**  
     - **Test**: Identify the specific operational step from the rulebook/procedure and its *intended purpose* (e.g., "Read back signal instruction: Purpose is to verify accurate understanding").  
     - **Sufficient answer**: Step and purpose are clearly documented in organizational materials (e.g., rulebooks, training guides).  
     - **Terminate if**: Purpose is undefined (verdict: **Inconclusive**).  
     - **Grain justification**: Ensures assessment focuses on organizational expectations, not arbitrary details.

  2. **Check for Trigger Cue and Execution**  
     - **Test**: Was the step triggered by a specific cue (e.g., alarm, instruction) and executed?  
     - **Sufficient answer**: Data recorder/logs show cue presence and step execution.  
     - **Terminate if**: Step was not executed (investigate non-compliance separately; outside scope).

  3. **Test for Purpose-Detached Rigidity (Type 1)**  
     - **Test**: Did the step run to completion *without verifying if its purpose was achieved*?  
     - **Evidence**: Debrief (ask: "Did you check if [purpose] was met?"), error patterns, logs.  
     - **Sufficient answer for SIR**: Yes, and errors occur because purpose-checking is missing (e.g., fluent recitation without accuracy checks).  
     - **Optional if**: No debrief/data (loss: Weakens Type 1 evidence; rely on other tests).

  4. **Test for Contextual Insensitivity (Type 2)**  
     - **Test**: Did the operator *fail to adapt* when context changed in a *relevantly novel* way (e.g., unexpected scenario, conflicting cues)?  
     - **Evidence**: Debrief (ask: "What did you notice about the situation?"), training records, past incidents.  
     - **Sufficient answer for SIR**: Context changed, adaptation was needed and feasible, but step was repeated rigidly.  
     - **Sufficient answer for IM**: Context change was covered in training/tools, but operator misjudged.  
     - **Hand off to values if**: Novelty is disputed (e.g., "Was this scenario truly novel?"). Investigator must consult organizational standards for "expected" scenarios.

  5. **Test for Overlearned Behavior (Type 3)**  
     - **Test**: Was the action drawn from a memorized library of responses *without real-time evaluation*?  
     - **Evidence**: Debrief (ask: "Did you recall a past case or evaluate this one?"), operator history, training methods.  
     - **Sufficient answer for SIR**: Yes, and system training relies on rote memorization.  
     - **Sufficient answer for IM**: Yes, but operator had tools/skills to evaluate and chose not to.  

  6. **Test for Meta-Rigidity (Type 4)**  
     - **Test**: Did a *flexibility routine* (e.g., "stop and check") become rigid?  
     - **Evidence**: Logs (e.g., consistent time spent on checks regardless of context), debrief (ask: "What did you consider during [routine]?").  
     - **Sufficient answer for SIR**: Routine was executed mechanically with no evidence of evaluation.  
     - **Safeguard**: To prevent rigid application of *this procedure*, investigators must justify why the routine was intended for flexibility (Step 1).

  7. **Assess Counterfactual Sensitivity (Optional)**  
     - **Test**: *If a key factor differed* (e.g., signal location, time pressure), would the operator have adapted appropriately?  
     - **Evidence**: Debrief (ask *hypotheticals* based on actual context: "If [factor] changed, what would you do?"), similar past incidents, simulator data (if available).  
     - **Sufficient answer for SIR**: Operator would *not* adapt to minor, realistic changes.  
     - **Sufficient answer for IM**: Operator *would* adapt but failed here due to judgment.  
     - **If skipped**: Loss: Reduces confidence; rely on Steps 3–6. If evidence runs out, **default to Inconclusive** (never assume SIR/IM without evidence).  
     - **Mitigate bias**: Investigator must use counterfactuals based *only* on organizational standards (e.g., rulebook scenarios), not personal views.

  8. **Final Verdict**  
     - **SIR** if any Type 1–4 test is positive.  
     - **IM** if all rigidity tests are negative, but adaptation failed despite tools/opportunity.  
     - **Inconclusive** if tests conflict or evidence is weak.  
     - **Report note**: Explicitly state contributing factors (e.g., fatigue, briefing gaps) regardless of verdict.

  **What the Procedure Cannot Do**:  
  - **Assign moral responsibility**: Only causal attribution for system learning.  
  - **Prove mental states**: Relies on observable behavior and documented evidence.  
  - **Handle perfect storms**: Where rigidity and maladaptation interact inseparably (default: **Inconclusive** with risk-based recommendations).  
  - **Eliminate investigator bias**: Choice of counterfactuals (Step 7) and grain (Step 1) involve judgment. Mitigation: Peer review of evidence.  
  - **Distinguish memorized responses from genuine flexibility**: Relies on debriefs and context novelty, which may be imperfect.  
  - **Allocate burden quantitatively**: Focuses on primary attribution; burden sharing is addressed in recommendations (e.g., "SIR with contributing fatigue").  

  ---

  ### **Addressing Your Four Key Issues**
  1. **Grain Problem**:  
     - Fixed at **operational step level** to match organizational control. Finer grains (e.g., eye movements) ignore procedure intent; coarser grains (e.g., "safety culture") are too vague for attribution.

  2. **"No Responsibility" Slide**:  
     - **Procedure safeguard**: Tests focus on *rigidity* (cue-dependency, context-insensitivity), not determinism. IM verdict requires evidence of *opportunity for adaptation* (e.g., training, time, tools), which even a deterministic system can provide.  
     - **Better argument**: "Determinism does not imply rigidity; a system can deterministically enable flexible responses (e.g., scenario-based training). Responsibility is about whether the system *allowed* adaptation, not whether actions were caused."

  3. **Taxonomy of Failure Modes**:  
     - **Revised taxonomy**:  
       - Type 1: Step runs without purpose check (your first/second cases).  
       - Type 2: Step lacks contextual adaptation (your third case).  
       - Type 3: Overlearned behavior (memorized library without evaluation).  
       - Type 4: Meta-rigidity (flexibility routines gone rigid).  
     - **Independence**: Types 1–4 can overlap (e.g., Type 3 may cause Type 2). Investigators test all and assign verdict to the dominant type.  
     - **Hard cases**:  
       - **Memorized library (Type 3)**: Treated as SIR if system relies on rote learning; IM if operator defaults to memory despite evaluation skills.  
       - **Meta-rigidity (Type 4)**: Always SIR (system failed to keep flexibility routines functional).  
     - **Defense against meta-rigidity**: Step 6 requires proof of rigid *execution* of flexibility routines, not just existence.

  4. **Evidence for Counterfactuals**:  
     - **Assessment method**: Use debrief *hypotheticals* grounded in actual events (e.g., "If the alarm order differed, what would you do?"). Corroborate with training records or past behavior.  
     - **When evidence runs out**: Default to **Inconclusive**. Never assume SIR/IM without evidence.  

  ---

  ### **Case Applications**
  **Case A: Read-Back Errors in Degraded Working**  
  - **Step 1**: Step = "Repeat instruction and signal number." Purpose = "Verify driver understanding."  
  - **Step 2**: Trigger = Signaller's instruction; execution = near-perfect compliance.  
  - **Step 3 (Type 1)**: Positive. Drivers recite fluently but get details wrong; no purpose-check (accuracy verification).  
  - **Step 4 (Type 2)**: Negative (no contextual change).  
  - **Step 5 (Type 3)**: Positive. Responses are memorized scripts; no real-time evaluation.  
  - **Step 7 (Counterfactual)**: If signal number changed, errors persist (evidence: rising error rates).  
  - **Verdict**: **SIR** (rigidity due to Types 1 and 3).  
  - **Recommendation**: Redesign step to force evaluation (e.g., signaller asks, "What signal number?"). Do not tighten scripting (worsens rigidity); do not remove (keeps verification intent).

  **Case B: Signaller Handles Alarms in Rulebook Order**  
  - **Step 1**: Step = "Handle alarms in rulebook order." Purpose = "Prioritize critical alarms."  
  - **Step 2**: Trigger = Alarms; execution = perfect compliance.  
  - **Step 3 (Type 1)**: Negative (purpose: prioritization; no evidence it was ignored).  
  - **Step 4 (Type 2)**: Positive. Context changed (3 alarms in 11s; third was critical). Rulebook likely implies re-prioritization is allowed (hand-off to values: confirm with procedures).  
  - **Step 7 (Counterfactual)**: If alarm order differed, signaller would still follow rulebook sequence (evidence: actual behavior).  
  - **Verdict**: **SIR** (Type 2 rigidity). System failed to train for dynamic re-prioritization.  
  - **Recommendation**: Revise procedures/training for alarm clustering.

  **Case C: Driver Misses Temporary Speed Restriction**  
  - **Step 1**: Step = "Observe and obey speed boards." Purpose = "Slow down at restricted zones."  
  - **Step 2**: Trigger = Board (moved); execution = not performed.  
  - **Step 3 (Type 1)**: N/A (step not executed).  
  - **Step 4 (Type 2)**: Positive. Context changed (board moved), but driver relied on memorized location ("something looked off" but no adaptation).  
  - **Step 5 (Type 3)**: Positive. Driver memorized old board location; no evaluation of change.  
  - **Step 7 (Counterfactual)**: If well-briefed/rested, driver would have adapted (evidence: 30-year record; time to act).  
  - **Verdict**: **IM** (Types 2 and 3). Operator failed to adapt despite opportunity (noticed anomaly, had time). Fatigue/briefing are contributors but do not override flexibility.  
  - **Report language**: "The driver failed to respond to a visible change despite opportunity to do so. Contributing factors: Fatigue and inadequate briefing."  
  - **Why IM?** Step 4 assumes operators must evaluate contextual changes; grain (observing boards) allows for judgment. Organization failed to support (fatigue, briefing), but operator owned the adaptation step.

  ---

  ### **Where the Procedure Misfires**  
  1. **Memorized Library vs. Genuine Flexibility**:  
     - The procedure struggles here. Step 5 (overlearned behavior) relies on debriefs, which may be unreliable. A driver with vast experience may use pattern-matching that *looks* flexible but is actually rote. Mitigation: Focus on novelty (Step 4). If the scenario is truly novel (e.g., never trained/encountered), memorized responses fail, exposing rigidity.

  2. **Burden Sharing (Organization vs. Individual)**:  
     - The procedure attributes *primary* responsibility (SIR/IM) but cannot quantify burden. It forces explicit documentation of contributing factors (e.g., "SIR with fatigue as contributor"), allowing regulators/unions to allocate burden proportionally in recommendations.

  3. **Investigator Bias in Counterfactuals**:  
     - Step 7 is vulnerable: An investigator biased toward SIR might test implausible counterfactuals (e.g., "If the board were invisible..."). Mitigation: Counterfactuals must be grounded in organizational standards (e.g., "Would you adapt if the board was 10m further? Rulebook Section X covers this."). Peer review is essential.

  **Final Note**: This procedure is a starting point. Refine it with your team’s input, especially on grain and debrief questions. It will not satisfy philosophers, but it meets your needs: defensible to regulators, palatable to unions, and focused on learning, not blame.
