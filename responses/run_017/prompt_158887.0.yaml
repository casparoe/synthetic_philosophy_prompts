answer: |-
  **Sestina for the Executor**

  The clause is clear: this trunk contains what's **TRUE**.
  I lift the latch; the iron has a heft
  like some old **BOOK** bound in discarded lead.
  The script inside? A language wholly **LOST**.
  To call it true adds **NOTHING** to the claim
  “The script exists.” Just that. What more to **SAY**?

  Yet bound by words I cannot read or **SAY**,
  I stand committed: all therein is **TRUE**.
  The will insists. But what? There’s **NOTHING**
  grasped, no proposition from the **BOOK**
  to hold or test, just symbols **LOST**
  beyond recovery. What crushing **WEIGHT**

  this simple clause imposes! Such a **WEIGHT**
  of silent sentences I cannot **SAY**
  endorsed unseen. The voice inside is **LOST**,
  yet I must swear its every note rings **TRUE**.
  What strange credence, bought without the **BOOK**
  ever laid open! Bought with **NOTHING**

  but the predicate. This **NOTHING**
  buys a vast, unmeasured, crushing **WEIGHT**
  of consequence. The sealed, mute **BOOK**
  demands belief for all it might **SAY**,
  though I’m forever barred from knowing **TRUE**
  contents. The author’s meaning, **LOST**.

  Is meaning **LOST**, or merely locked away?
  Perhaps the script, unread, holds nothing **TRUE**?
  But no – the clause commands: take all on **WEIGHT**
  of that one word. To doubt is to **SAY**
  the will itself might fail. Can **NOTHING**
  bind me so? This cryptic, heavy **BOOK**

  sits like a stone. A silent, stubborn **BOOK**.
  Its possible worlds, its fragile truths, all **LOST**
  to comprehension. Still, I owe it **NOTHING**?
  Less? The predicate exacts this **WEIGHT**
  of blind assent. What *have* I pledged to **SAY**
  by uttering "true"? More than I meant? Less **TRUE**

  than disquotation promised? **WEIGHT**
  of unearned credence? **NOTHING** gained but this blind debt?
  **BOOK** unopened, key in hand. What *can* I **SAY**?
  The promise stands: the **LOST** is pledged as **TRUE**.
