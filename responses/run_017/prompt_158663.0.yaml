prompt: |-
  I teach a first-year seminar on moral psychology, and next term I want to pair Sophocles' Antigone with moral foundations theory as it is usually presented: the five foundations most people learn first (care, fairness, loyalty, authority, sanctity), the liberty foundation that was appended to them, the individualizing-versus-binding split, and the headline claim that left and right differ less in how much they moralize than in which foundations they moralize with. What I need from you is a reading of the play.

  The reading I want tested is this. I want to argue that the tragedy is not, in the first instance, a disagreement about how much weight a given foundation should carry, but a case of what I am calling foundation-blindness: Creon cannot register Antigone's piety toward her dead brother as a moral reason at all and hears it only as subversion and betrayal, while Antigone cannot register his concern with authority and the ordering of the city as a moral reason and hears only impiety and the bullying of a tyrant, so that each concludes that the other is immoral rather than moral-but-differently-tuned. Take that claim through the play and tell me whether it holds: the burial and the dust thrown over the corpse, Creon's language about the city and the ship of state, the appeal to unwritten and everlasting laws, Haemon's intervention, the pollution and the birds and the altars, Tiresias, and Creon's collapse at the end. Where does the reading illuminate a scene, and where does the play refuse it? I especially want to know whether Sophocles gives either character any genuine access to the other's moral perception, or whether he deliberately withholds it, and what follows either way.

  There are two complications I want handled honestly rather than smoothed over. The first is that if I bring the liberty foundation into the reading, the whole thing changes shape: Antigone becomes a figure of resistance to domination and Creon the oppressor, which is the reading my students will reach on their own in about five minutes and which turns the play into something comfortable rather than tragic. Does the theory license that reading, or is the fact that the same theory comfortably generates both a sign that its list of foundations is underdetermined by its own evidence and a little too easy to extend? The second is that the theory's rhetoric leans toward a kind of moral-epistemological breadth: a moral outlook that runs on more of the foundations is supposed to see more of the moral landscape, and the narrow outlook is supposed to be blinkered. Yet Antigone is a play in which two people, each running on a full-blooded set of foundations, destroy each other and everyone around them. So does the tragedy actually argue that breadth without a rule for which foundation yields is worse than narrowness? And if it does, is that something moral foundations theory can say, or something it structurally cannot say, given that it is a descriptive psychology of difference?

  Finally, I want the normative question faced rather than deferred, because it is the question my students will actually ask. Grant whatever the empirical claim is about the asymmetry between left and right, and tell me how confident I should be about it. Does that psychology tell us anything whatsoever about who is right about burial rites, about loyalty to kin versus loyalty to the state, about authority and who owes what to whom? I want to know what the theory entitles us to conclude and what it does not. If the honest conclusion is deflationary, give me the deflationary one and show me what it costs; I would rather hand my students a smaller claim I can defend than a large one that collapses under a good question.

  Please do not give me quotations from the play, a bibliography, or a reading list: work from the play as an educated reader remembers it, and from the theory as it is standardly stated. Write the whole thing as continuous prose, the way you would write a long letter to a colleague who has read the play and knows the literature: no headings, no bullet points, no bold text, no tables, nothing that would not survive being pasted into an email.
reasoning: |-
  Okay, let me approach this systematically. The user teaches moral psychology and wants to test Moral Foundations Theory (MFT) against Sophocles' Antigone. Their core hypothesis is about "foundation-blindness" - that Creon and Antigone don't just prioritize different moral foundations but fundamentally fail to recognize each other's moral reasoning as valid. 

  First, I need to verify if the play supports this reading. The burial scene is crucial: Antigone's appeal to "unwritten laws" clearly taps into sanctity/loyalty foundations, while Creon's framing of Polynices as a traitor activates authority/loyalty (to state). Their language shows mutual incomprehension - when Antigone calls burial duties "holy," Creon hears only "disobedience." 

  Haemon's intervention is revealing. His appeal to civic loyalty ("the city mourns this girl") tries to bridge foundations but fails because Creon pathologizes it as filial weakness. Tiresias' pollution warning similarly gets reduced to bribery. Neither character ever genuinely engages with the other's moral frame - Sophocles seems deliberate here.

  Now the complications. The liberty foundation question is thorny: if we frame Antigone as resisting domination, the play becomes politically comforting but loses tragic depth. MFT's flexibility here might indicate underdetermination - the same event can map to different foundations depending on interpretation. This deserves honesty in class.

  The breadth paradox is deeper. MFT implies more foundations mean better moral perception, yet here both characters have "complete" but opposing foundations (Antigone: care/sanctity; Creon: authority/loyalty) causing mutual destruction. Perhaps Sophocles argues that foundation breadth without hierarchy or arbitration mechanisms is catastrophic. But MFT, as descriptive psychology, can't prescribe hierarchies - that's its limitation.

  On the normative question: We must clarify that MFT describes moral taste buds, not moral truth. It explains why left/right disagree about burial rites but cannot judge who's right. Any normative claim requires moving beyond psychology into philosophy. This deflationary stance might disappoint students seeking easy answers but protects intellectual integrity.

  The tragic insight isn't that one side was wrong, but that moral language itself can become mutually untranslatable - a warning about foundation-blindness in any era. That's the durable lesson for students, beyond temporary theory.
answer: |-
  Your reading of *Antigone* through the lens of Moral Foundations Theory (MFT) foundation-blindness holds remarkable power, illuminating the tragic core while exposing genuine tensions within the theory itself. Let’s walk through it.

  The foundation-blindness thesis finds strong support throughout the play. Creon’s edict forbidding Polynices’ burial stems squarely from the Authority/Loyalty foundations: the traitor must be denied honor to preserve the city’s stability ("ship of state") and deter future rebellion. When Antigone defies him, he interprets her act *exclusively* through this lens – as subversion (Authority violation), betrayal of the city (Loyalty violation), and even anarchy ("If I nurture rebellion in the house"). Her stated motive – fulfilling sacred duty to kin and the gods (Sanctity, Loyalty to family) – simply doesn't register as a *moral* claim for him. He pathologizes it as stubbornness, folly, or familial disloyalty aimed at him. He cannot perceive the piety; he only sees the defiance.

  Conversely, Antigone’s entire being is oriented toward Sanctity (the "unwritten and everlasting laws" of the gods concerning burial and kinship) and Loyalty to family ("I was born to join in love, not hate"). Creon’s appeals to Authority ("The city is the king’s! That’s the law!") and Loyalty to the *polis* sound to her not like competing moral arguments, but like blasphemy and tyranny. She hears only impiety (Sanctity violation) and the cruel exercise of power. His concern for civic order isn't a moral reason she engages with; it's the immoral justification of a bully. Their exchanges are classic dialogues of the deaf, each speaking a distinct moral language the other cannot comprehend.

  This blindness persists through key moments:
  *   **The Burial/Dust:** For Antigone, the symbolic dust fulfills sacred duty (Sanctity). For Creon, it’s pure, incomprehensible defiance (Authority/Loyalty violation).
  *   **Haemon’s Intervention:** Haemon *attempts* to bridge the gap, appealing subtly to Care ("The city mourns for this girl") and practical Authority ("bend like a tree in a flood"). But Creon hears only filial disloyalty and weakness, doubling down on his foundations. Haemon’s effort highlights the *possibility* of broader perception but underscores its absence in the protagonists.
  *   **Tiresias & Pollution:** Tiresias frames the gods’ wrath (Sanctity violation) as a civic disaster (impacting Loyalty/Authority). Creon initially dismisses this as bribery, clinging to his foundations until the threat becomes terrifyingly real. Even here, his eventual capitulation feels more like fear of consequence than a genuine moral epiphany about Antigone’s position.
  *   **Creon’s Collapse:** His ruin stems from the catastrophic consequences of his foundation-blindness. He never gains true insight into Antigone’s morality; he realizes the *practical* folly of defying the gods and the human cost of his rigidity. His lament is for his losses, not a recognition of the validity of her moral foundations.

  **Sophocles deliberately withholds genuine access.** Neither protagonist ever truly understands or validates the other's core moral reasoning. They lack the psychological architecture to do so within the play's compressed, tragic timeframe. This is crucial: the tragedy isn't just disagreement, but fundamental *incomprehension*. Each sees the other's actions as emanating from a place devoid of recognizable morality (stubbornness, ambition, tyranny, impiety). What follows is the inevitable destruction – Antigone, Haemon, Eurydice – born of this irreconcilable moral solipsism.

  **Now, the Complications:**

  1.  **The Liberty Foundation:** Introducing Liberty fundamentally reframes the conflict as "Resistance vs. Oppression," making Antigone a liberal icon and Creon a dictator. MFT certainly *licenses* this reading: Antigone's defiance can be coded as Liberty/Oppression (resisting Creon's illegitimate domination). However, its ease of application here *is* revealing. The same empirical event (defying a ruler's edict for a sacred act) maps neatly onto two different foundations (Sanctity or Liberty) depending on the interpreter's emphasis. This suggests MFT's list might be *underdetermined* – its categories are flexible enough to accommodate diverse interpretations of the same action, potentially making it *too* easy to fit the evidence. It risks becoming a descriptive Rorschach test. Crucially, the "Liberty" reading flattens the tragedy into a morally comfortable conflict (freedom fighter vs. tyrant), losing the profound, uncomfortable clash of genuinely held, *incommensurable* moral visions that Sophocles presents. The Sanctity/Loyalty(Family) vs. Authority/Loyalty(State) reading preserves the tragic ambiguity.

  2.  **Breadth vs. Narrowness & The Tragedy of "Full-Blooded" Foundations:** MFT often implies that accessing more foundations grants broader, better moral perception. *Antigone* fiercely challenges this. Both protagonists operate with "full-blooded" commitment to their respective clusters (Antigone: Sanctity, Care/Loyalty(kin); Creon: Authority, Loyalty(state), arguably Fairness as he sees it - traitors deserve punishment). Yet, this very commitment, without the ability to *recognize* or *weigh* the validity of the other's foundations, leads to catastrophe. The tragedy argues that breadth *without a meta-framework for adjudication or prioritization* can be worse than narrowness. Possessing multiple foundations isn't enough; one needs the capacity for moral humility, perspective-taking, and negotiation – capacities absent in both Antigone and Creon. **This is something MFT, as descriptive psychology, structurally struggles to address.** It describes the foundations but offers no normative guidance on how to resolve conflicts *between* them. *Antigone* shows the devastating cost of lacking such a mechanism. The play suggests that unyielding commitment to *any* singular cluster, however internally coherent, can be fatal when confronted with an equally committed, incompatible cluster.

  **Facing the Normative Question:**

  Your students' question is inevitable and vital. MFT is fundamentally *descriptive*. It tells us *that* people (and groups like "left" and "right") rely on different foundational intuitions to perceive moral violations. It explains *why* Antigone and Creon talk past each other: their moral "taste buds" are attuned to different flavors.

  **What MFT does *not* and *cannot* tell us is who is *right*.** It offers no normative standard to judge:
  *   Whether burial rites for traitors are obligatory (Sanctity) or can be suspended for state security (Authority/Loyalty(state)).
  *   Whether loyalty to kin inherently trumps loyalty to the state, or vice versa.
  *   What constitutes legitimate authority or tyranny.
  *   Whether Antigone's "unwritten laws" are truly divine or merely cultural tradition.

  The asymmetry MFT describes between left (prioritizing Care, Fairness, Liberty) and right (prioritizing all five, especially Loyalty, Authority, Sanctity, plus Liberty) is an empirical claim about psychological tendencies. **It is not a claim about moral truth.** Knowing that Creon is heavily using Authority/Loyalty and Antigone Sanctity/Loyalty(kin) doesn't tell us Sophocles' view, or the "correct" answer. The play itself, in its tragic structure, refuses to give a simple answer. It shows the ruinous cost of the clash, not the inherent superiority of one foundation-set.

  **The deflationary conclusion is necessary:** MFT helps us *understand* moral disagreement by revealing the underlying psychological foundations at play. It is a powerful tool for diagnosis and fostering empathy for *why* others feel morally outraged. **But it provides no prescription.** It cannot arbitrate between competing moral claims rooted in different foundations. It tells us *how* people moralize, not *what* is moral. Handing your students this smaller, defensible claim – that MFT explains the structure of disagreement but not its resolution – is intellectually honest. It costs the comfort of a psychological theory dictating moral winners and losers, but it preserves the theory's integrity and, crucially, leaves the profound, unsettling moral questions of *Antigone* open for the philosophical and humanistic inquiry they demand. The tragedy lies precisely in the fact that understanding *why* they clash doesn't tell us how to prevent such clashes, nor who was ultimately "right" in a transcendent sense – only that both were, tragically, true to their own moral vision unto destruction.
