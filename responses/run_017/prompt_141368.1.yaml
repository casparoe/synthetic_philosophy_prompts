answer: |-
  ### Marginal Comments on Script  

  **PART (A)**  
  ✓ **Correct:** You accurately identify Stanley & Williamson’s (S&W) rejection of Ryle’s premise that employing knowledge requires *occurrent contemplation* of a proposition. Their appeal to a *standing state* of propositional knowledge (under a practical mode) avoids the regress.  
  ⚡ **Imprecise:** S&W do *not* claim the agent "need never occurrently entertain" the proposition; they allow that the knowledge *can* be exercised without occurrent contemplation, but it remains a propositional attitude (i.e., a relation to a truth-apt content).  
  ✗ **Reasoning fails:** Your conclusion that S&W "collapse into anti-intellectualism" is incorrect. S&W explicitly reject Ryle’s dispositionalism: their "standing state" is a *factive, truth-apt mental state* (knowledge-that), not a mere disposition to behave. Rylean dispositions are non-representational; S&W’s states are representational. This conflation undermines your critique.  

  **PART (B)**  
  ✓ **Correct:** You neatly summarize the physiologist objection: knowing all facts about cycling ≠ knowing-how, and you capture S&W’s reply invoking the *practical mode of presentation*.  
  ⚡ **Imprecise:** The rider example is misattributed. Ryle *does* argue that knowing-how doesn’t require knowing-that (e.g., the cyclist who can’t state propositions), but S&W *deny* this via practical modes: the rider *does* possess knowledge-that (under a practical mode), even if not articulable.  
  ✗ **Reasoning fails:** Your "bidirectional failure" claim is invalid. S&W’s intellectualism *allows* that the physiologist lacks knowledge-how (due to lacking the practical mode) *and* that the rider possesses it (via the practical mode). Thus, intellectualism *doesn’t* fail in "both directions" — it accommodates both cases by distinguishing modes of presentation.  

  **PART (C)**  
  ✓ **Correct:** Strong defense of the dispute’s substantiveness. You rightly note disagreements over factivity, storage, and testimonial transmission — core metaphysical differences, not mere labeling. The point about case-absorption strategies (modes vs. abilities) is astute.  
  ⚡ **Imprecise:** While you dismiss "attention to our use of the word," S&W *do* appeal to linguistic evidence (e.g., "know how" embeddings) to argue for their view. This isn’t just about "stretching ‘knowledge’" but about syntactic/semantic data.  
  △ **Weakness:** You undercut your position by conceding no case is "decisive." If *all* cases are absorbable by both sides (per your claim), this *could* imply the dispute is verbal (e.g., about "knowledge" applying to abilities vs. propositions). A stronger defense would note *in-principle* empirical differences (e.g., neural correlates of practical modes vs. dispositions).  

