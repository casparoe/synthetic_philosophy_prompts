prompt: |-
  Hey — I'm writing a dissertation chapter on consistency in sentencing and there's a hypo I keep going round in circles on, so I thought I'd get an outside read. I've been going through the sentencing remarks of one Crown Court judge (I'll call her Judge M.) and this is roughly her track record. Burglary of a occupied house at night, long record: four years, and she refused to shave anything off even though he'd lose his job and his kids would go into care — "the sentence answers the offence, not the fallout". Benefit fraud, about £180k over six years, first offender, no realistic risk of reoffending: 18 months suspended, on the basis that locking her up "would add nothing but harm". A scaffolding firm director whose safety failures killed a worker: two years plus a fine and disqualification, with the remark that prison was needed "to mark the gravity, not because the length deters anybody". A defendant who, after the offence but before sentence, pulled a kid out of a burning car: full credit for the plea and the remorse, but no reduction for the rescue — "good deeds afterwards don't pay off the wrong". Attempted robbery where the wallet turned out to be empty: roughly 60% of the tariff for the completed offence, because "what matters is what he tried and risked". During a local spike in one offence type she sentenced above her own earlier tariff for it, within the maximum, saying "the message has to land right now". And she cut a 19-year-old first-timer's term by about a third, on the grounds that two years isn't the same two years for him as for a man of forty with a record.

  Here's the case I'm stuck on. A pile-on: over one weekend roughly 3,500 accounts each sent a single abusive message to a 15-year-old, and she tried to kill herself. Any one message on its own is the sort of thing that normally draws a trivial disposal; the catastrophic harm is entirely a product of the aggregate. The CPS can realistically charge only about a hundred of them, picked more or less at random, and everyone in the pool knew there was something like a 3% chance of ever being charged. Two of the hundred are before Judge M. D1 is 34, has two previous convictions for similar online harassment, was one of the first five senders, knew a handful of others were piling in and could see where it was heading. D2 is 17, no record, was about the 2,900th sender, joined when it was already viral, and his message made no difference to anything — he knew harm was happening but reasonably assumed his own contribution was nil. Guilt isn't in dispute for either; the only question is the sentence. My supervisor keeps banging on about what he calls the discounting problem — if only 3% are ever charged, doesn't deterrence mean the penalty needs to be roughly thirty times what desert would otherwise hand out, capped only by whatever ceiling desert sets? — and about whether desert here tracks what each person actually brought about, or the collective harm they knew they were joining.

  So: what do you think Judge M. would give D1 and D2? More usefully for me, can you lay out the two or three rules that fit her track record about equally well, say what each of them predicts for these two, which one you'd actually bet on and why, and name the one extra case that would best tell those rules apart — e.g. whether it's a marginal late joiner, a lone sender whose message did the damage by itself, or something else. Please flag where you're really just guessing, and tell me which single argument or hypothetical would most change your prediction. Under 600 words, British English, prose or a compact table if that's clearer.
reasoning: |-
  Okay, let me approach this sentencing consistency problem systematically. The user presents Judge M's sentencing pattern across diverse cases and asks how she'd rule on this mass online harassment case involving D1 (repeat offender, early participant) and D2 (teen first-timer, late joiner). 

  First, analyzing Judge M's principles from past cases: she consistently separates offense gravity from collateral consequences (burglary case), uses imprisonment only when symbolically necessary (corporate manslaughter), and rejects post-offence good deeds as mitigation (rescue case). Her approach to incomplete offenses (attempted robbery) focuses on intent rather than outcome, while adjusting for offender characteristics (youth discount). Notably, she adapts sentences to contextual deterrence needs during crime spikes.

  For the harassment case, three competing principles emerge:
  1) Individual causation: Punish based on actual harm caused (D2's negligible impact vs D1's early contribution)
  2) Collective liability: Hold participants accountable for foreseeable aggregate harm (both knew they joined harmful mob)
  3) Deterrence scaling: Adjust sentences for low prosecution probability (supervisor's 30x multiplier idea)

  Judge M's pattern suggests she'd reject strict deterrence multipliers (contra supervisor) given her rejection of "fallout" considerations and her focus on marking gravity. Her attempted robbery ruling indicates she cares about intended/risked harm, which here points toward collective liability. However, her youth sentencing discount for the 19yo suggests D2 would get leniency.

  Key differentiator case: A marginal late-joiner where the harm threshold was reached exactly at their contribution. If Judge M sentences them as severely as early participants, it confirms collective liability focus; if lenient, she's weighting individual causation.

  Final prediction table balances her principles:
  - D1: Significant custodial (9-12mo) for intent + prior record
  - D2: Community order with rehab focus, per youth + negligible impact

  The strongest counter-hypothetical would be if D1 had saved a life post-offense - Judge M's "good deeds don't pay off wrong" principle suggests no mitigation.
answer: |-
  Based on Judge M's established principles, here's an analysis of the likely approach to D1 and D2, competing rules, predictions, and a key test case:

  **Core Principles from Track Record:**
  1.  **Focus on Offence Gravity & Culpability:** Sentences answer the intrinsic wrong (*"answers the offence"*, marks *"gravity"*), not collateral consequences or pure deterrence calculus. Culpability (intent, knowledge, role) is central.
  2.  **Limited Mitigation:** Post-offence good acts don't reduce desert (*"good deeds... don't pay off the wrong"*). Personal circumstances impact sentence *effect* (youth discount) but not necessarily the *assessment* of the core wrong.
  3.  **Contextual Intent/Risk:** Considers what the offender *tried*, *intended*, or *foreseeably risked*, even if the actual outcome differs (*"what he tried and risked"*, adjusting tariff for crime spikes).
  4.  **Individualisation:** Adjusts sentence *length/type* based on offender characteristics affecting impact (youth) or specific deterrence/rehab needs (suspended sentence where prison *"adds nothing but harm"*).

  **Competing Rules for the Pile-On & Predictions:**

  | Rule                                         | Core Logic                                     | Prediction D1 (34, recidivist, early, knew scale) | Prediction D2 (17, first-time, very late, negligible impact) | Key Differentiator Case                            |
  | :------------------------------------------- | :--------------------------------------------- | :------------------------------------------------ | :----------------------------------------------------------- | :------------------------------------------------- |
  | **A. Individual Causal Contribution + Intent** | Desert tracks the harm *this defendant actually caused* + their specific intent/knowledge. Rejects aggregating harm they didn't personally cause. | Moderate sentence. High culpability due to intent, knowledge, & record, but *actual* harm caused by their single message is minor. Custody likely, but not lengthy (e.g., 6-12 mo). | Very lenient sentence. Negligible causal contribution, no record, youth. Strong mitigation. Likely community order/rehab. | **Lone Sender:** Defendant whose *single identical message*, sent alone, *directly* caused the victim's suicide attempt. Rule A = minor sentence. Rule B = severe sentence. |
  | **B. Joint Enterprise/Foreseeable Collective Harm** | Desert tracks the *foreseeable aggregate harm* the defendant *intentionally joined and contributed to*, knowing their action was part of a harmful collective effort. | Severe sentence. Fully culpable for the collective harm: early, knew it was escalating, intended to harass. Prior record aggravates. Significant custody (e.g., 2-3 yrs+). | Low-Moderate sentence. Joined knowing significant harm was occurring, contributed intentionally to the mob. Youth & first offence mitigate, but core culpability exists. Custody possible but shorter/suspended (e.g., 6-18 mo suspended). | **Marginal Threshold Crosser:** Defendant whose message was exactly the 1000th, pushing the victim over the threshold to attempt suicide. Did they cause *all* harm after, or just their increment? Reveals harm aggregation view. |

  **Prediction & Why:**  
  **Bet on Rule B (Joint Enterprise/Foreseeable Collective Harm).**  
  *   **Fit:** Best explains her focus on *what was tried/risked/knowingly joined* (attempted robbery, crime spike uplift) and rejecting outcomes/collateral fallout as primary drivers. Her corporate manslaughter sentence ("mark the gravity") shows comfort with attributing collective harm to individuals based on role/culpability. Her refusal to reduce for good deeds shows focus on the *offence act itself*.
  *   **D1:** Significant custodial term (e.g., 2.5 years). Reflects high culpability for joining/knowingly escalating a harmful mob early with prior record. Deterrence/prosecution probability (*guessing*) might nudge it up slightly, but not 30x (she rejects pure deterrence calculus).
  *   **D2:** Custodial sentence, likely suspended (e.g., 12 months suspended + rehab). Reflects culpability for *intentionally joining a known harmful mob*, even if impact was tiny. Youth, first offence, and lower foresight (joined later) provide mitigation reducing immediacy of custody.

  **Key Argument/Hypothetical to Change Prediction:**  
  A clear statement from Judge M in a similar mass-contribution case (e.g., minor vandalism during a riot) explicitly sentencing *only* based on the individual's direct damage and rejecting collective harm attribution would strongly favour **Rule A**. Her crime spike uplift shows awareness of context, but doesn't confirm she attributes *all* aggregate harm to each minor participant.

  **Key Differentiator Case:**  
  The **"Marginal Threshold Crosser"** (see table) is the best test. If Judge M sentences them as harshly as an early participant (Rule B), it confirms full aggregation. If she sentences based only on the incremental harm their specific message caused *at that moment* (Rule A), it rejects aggregation. Her attempted robbery logic suggests she might see crossing the threshold as the critical *intended/risked* outcome, leaning towards Rule B.
