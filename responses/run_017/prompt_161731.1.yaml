prompt: |-
  So I'm in this group chat — half rationalist-adjacent, half startup people — and we're trying to help a small nonprofit-ish org drop degree requirements from its hiring and use a work-sample/portfolio thing instead. One guy in the chat, who reads a lot of evo-psych, more or less shut the discussion down with: "a signal is like an advertisement. The money you spend on the ad is thrown away, and that waste is the whole point — it's what makes the message believable. If it didn't cost anything, everyone would run the ad, and then the ad carries zero information. So your cheap take-home test can't work. The waste has to be somewhere; you're just moving it around." He then reeled off peacock tails, stotting gazelles, Rolexes, expensive weddings, and said the handicap-principle math guarantees this in general: honest signalling requires waste, full stop. Nobody had a good answer and its been bugging me for a week.

  My own half-baked pushback, which I'd rather you stress-test than just agree with: as I understand it the handicap condition isn't "resources get destroyed," it's closer to "the signal has to be differentially costly — it has to cost a worse sender more than it costs a better one" — which is a claim about what a *lower-quality* sender *would* pay, i.e. a counterfactual, not about anything actually being burned up in equilibrium. And if that's the real condition, there ought to be signals where nothing is consumed at all: posting a bond or a hostage that you get back if you turn out to be telling the truth, or a credential that's free to hold but gets retroactively yanked plus a penalty if the holder underperforms — the cost is real and deters the fakers, but nobody ever pays it on the equilibrium path. Call them hostage signals versus burnt-money signals if that helps. If hostage signals genuinely work, then the ad analogy is smuggling in waste where the theory only needs differential cost, and my friend's "you're just moving the waste" is false rather than deep. But I also suspect there's a catch — something about needing someone who can verify quality after the fact, or about a single bond only sorting people into two bins instead of a smooth scale, or about the bond having to be big enough to sting the marginal type while top types post it for free — and maybe that's exactly where the waste creeps back in.

  So: audit the analogy properly. Give me the correspondence table (what plays the role of the ad budget, the product's actual quality, the customer, the repeat purchase, the rival firm that would love to lie), then separate the disanalogies that matter for the use he's making of it from the ones that are just decoration, and tell me whether "waste is load-bearing" survives once you put hostage-type signals next to burnt-money-type ones. If the ad picture is the wrong one, give me a better analogy for what a signal actually is. Assume for concreteness that the org gets ~30 applicants per role, can observe job performance reasonably well about six months after hiring, and can't pay anyone to sit through anything long. Write in American English, and keep it concrete rather than literature-flavored.
reasoning: |-
  Okay, the user is in a group chat with rationalist-adjacent and startup folks, trying to help a nonprofit drop degree requirements for hiring and use work samples instead. They got shut down by someone quoting evo-psych and the handicap principle, saying signals must involve waste to be credible. The user's pushing back with the idea of "hostage signals" where costs are potential but not actually paid, like bonds or credentials with penalties. They want me to stress-test this and see if waste is truly necessary.

  First, I need to unpack the handicap principle. It's not just about burning money; it's about differential cost. The signal has to be cheaper for high-quality senders than low-quality ones. The user's friend is stuck on the "waste" part, using examples like peacock tails or Rolexes. But in hiring, maybe there's another way.

  The user's argument about hostage signals makes sense. Things like posting a bond that you get back if you perform well—this deters fakers without actual waste. But there are catches. For example, the bond needs to be big enough to deter low-quality applicants but not so big that it scares off good ones. Also, the employer has to verify performance later, which might not always be possible or could have costs.

  Looking at the hiring context: the nonprofit gets about 30 applicants per role, can assess performance in six months, and wants something efficient. A take-home test seems cheap, but the evo-psych guy says it's not costly enough to be a signal. But if the test is designed so that high-quality candidates can do it well quickly, while low-quality ones struggle or can't complete it, that differential effort acts as the cost. No money is burned, but the time cost varies by ability.

  The ad analogy might not fit perfectly. In ads, burning money shows you believe in your product. In hiring, the signal is the applicant's work sample. The "cost" here is the effort to produce it. High-quality applicants find it easier, so they're more likely to do it well. The employer's role is to judge the sample, which costs them time but avoids the waste of degrees.

  Hostage signals like bonds could work in theory. For example, a probation period where underperformance leads to penalties. But in practice, legal issues or the nonprofit's inability to enforce penalties might be problems. Also, bonds might only sort applicants into two groups (good or bad), not provide a gradient like a work sample would.

  The key is whether the signal is differentially costly. Work samples can be that if designed right. For instance, a task that takes a skilled candidate 2 hours but an unskilled one 10 hours. The unskilled might not even attempt it. That's the differential cost without actual waste.

  But verification is crucial. The employer needs to assess performance later to make the bond or probation effective. If they can't do that reliably, the signal fails. The nonprofit can observe performance after six months, so that might work for a probation setup. However, implementing penalties could be tricky for a nonprofit, risking reputation or legal trouble.

  So, the evo-psych guy's point about waste isn't entirely wrong, but it's not the only way. Hostage signals avoid equilibrium waste but require mechanisms to enforce penalties. In hiring, work samples with differential time costs can serve as effective signals without burning resources. The "waste" in this case is the opportunity cost of time, which varies by applicant quality.

  The user's friend is overgeneralizing from biological signals to hiring. In evolution, signals like peacock tails are wasteful because there's no central enforcer. In hiring, employers can verify and enforce, so hostage signals are feasible. The work sample is like a bond of time and effort; high-quality applicants get it back in job offers, low-quality ones lose that time.

  Therefore, the take-home test can work if it's designed to be differentially costly. The nonprofit should test this with real roles, track applicant drop-off rates, and correlate test scores with later performance. They might need to iterate on the test design to ensure it's the right level of effort.
answer: |-
  Here's the breakdown, stress-tested with concrete examples for your nonprofit hiring scenario. Your friend's core insight is *partially* right but misapplied – the "waste" argument overreaches, and hostage signals **can** work in hiring contexts like yours. Let's audit the analogy and see where the waste is (and isn't).

  **The Correspondence Table: Decoding the Ad Analogy**

  | Ad Analogy Element       | Hiring Signal Analogy (Take-Home Test) | Hiring Signal Analogy (Degree) |
  | :----------------------- | :------------------------------------- | :----------------------------- |
  | **Ad Budget (Burnt Money)** | Candidate's **time/effort** completing the test | Candidate's **time/effort/money** spent getting the degree |
  | **Product Quality**      | Candidate's **actual job-relevant skill/ability** | Candidate's **actual job-relevant skill/ability** |
  | **Customer**             | **The Employer** making the hiring decision | **The Employer** making the hiring decision |
  | **Rival Firm (Liar)**    | **Low-Skill Candidate** who wants the job but would fail if hired | **Low-Skill Candidate** who wants the job but would fail if hired |
  | **Repeat Purchase/Reputation** | Employer's **future hiring efficiency & reputation** | Employer's **future hiring efficiency & reputation** |
  | **The "Waste"**          | Candidate's **irrecoverable time/effort** spent on the test | **Tuition fees, years of life** spent getting the degree (often partially recoverable) |

  **The Core Flaw in the Ad Analogy & "Burnt Money" Requirement**

  Your friend is correct that **credible signals require differential cost (Zahavi's Handicap Principle)**. The signal must be harder/costlier for a low-quality sender (the unqualified candidate) to fake *effectively* than for a high-quality sender (the qualified candidate). **But "cost" ≠ "waste".** Cost can be:

  1.  **Burnt Money/Resources:** Time/effort/money spent that is irrecoverable (like the ad budget, peacock tail, degree tuition).
  2.  **Hostage Cost:** A valuable thing *put at risk* but only lost *if the sender is lying* (like a bond, reputation, or future consequence).

  **The Hostage Signal: How it Works in Hiring (Your Nonprofit's Case)**

  Imagine your nonprofit implements:
  1.  **A Short, Focused Take-Home Test:** Designed to take a genuinely qualified candidate ~2 hours.
  2.  **A Clear Performance Benchmark:** "Score X to be considered."
  3.  **A Probation Period:** 6 months (matching your performance observation window).
  4.  **A Harsh Penalty for Failure:** Immediate termination + a public (within the org/network) note on the reason for failure *if performance is significantly below expectations* during probation.

  **The Signal Flow:**

  1.  **The "Hostage":** The candidate's **time (2 hours)** + their **reputation/future prospects** (the penalty).
  2.  **The Cost:** For a **High-Skill Candidate:**
      *   The 2-hour test is *easy*. Low time cost.
      *   They *know* they'll pass probation. The penalty is irrelevant. **Cost ≈ 2 hours.**
  3.  **The Cost:** For a **Low-Skill Candidate:**
      *   The 2-hour test is *hard*. They might spend 6+ hours or still fail.
      *   They *know* there's a high chance they'll flunk probation and suffer the penalty (termination + reputational hit). **Cost = High Effort + High Risk of Penalty.**
  4.  **Equilibrium:** High-skill candidates apply and take the test (low net cost). Many low-skill candidates *opt-out* because the risk/reward sucks. Those low-skill candidates who do take it are disproportionately filtered out by the test or quickly during probation. **The penalty (the hostage) is rarely paid, but its existence deters the fakers.** The 2 hours spent by successful candidates isn't "wasted" – it secured them the job efficiently.

  **Why Your Friend's "You're Just Moving the Waste" Argument Fails Here**

  1.  **The "Waste" Isn't Moved, It's Avoided for High Performers:** In the degree system, *every* candidate (good or bad) burns years and tuition. In the hostage-test system, the *successful* candidate only "burns" 2 hours. The low-skill candidate *might* burn 6 hours and get fired, but they were deterred from applying or filtered out early. **Net societal waste is lower.**
  2.  **Differential Cost is Achieved Without Equilibrium Waste:** The key is the *counterfactual threat* to the low-skill candidate. The penalty creates a massive *potential* cost for them that doesn't exist for the high-skill candidate. This differential deters fakers without requiring the high-skill candidate to actually burn resources equivalent to a degree. The 2 hours is a *screening fee*, not pure waste.

  **The Catches (Where Your Suspicions Were Right) & Mitigations for Your Nonprofit**

  1.  **Verification is Non-Negotiable:** **This is the BIG one.** The hostage signal **collapses** if the employer can't reliably assess performance after the fact. If your nonprofit *can't* consistently evaluate performance at 6 months or is unwilling/unable to enforce the penalty (firing + reputational note), the threat is empty. Low-skill candidates call the bluff. **Mitigation:** Build a robust, objective 6-month review process. Document rigorously. Leadership MUST be committed to enforcing penalties. Start with non-critical roles.
  2.  **Binary Sorting (The "Bins" Problem):** A simple pass/fail test + probation mainly sorts into "Probably Good Enough" and "Not". It might not perfectly rank the top 10%. **Mitigation:** *Use the test for screening, not final ranking.* Combine it with a *short* (~30 min) structured interview focused on the test approach or core skills for the candidates who pass the test benchmark. The test filters out the clearly unqualified cheaply; the interview refines the ranking among the plausible candidates.
  3.  **The Bond Size ("Sting the Marginal Type"):** The penalty has to be severe enough to deter the *marginal* low-skill candidate who *might* just barely fake the test. Termination + reputational hit is usually sufficient for professional roles. The *test itself* needs to be costly *enough* in time/effort to deter the very laziest fakers, but not so long it deters good candidates. **Mitigation:** Pilot the test. Track drop-off rates. Ask shortlisted candidates for feedback on test length/difficulty. Aim for a completion rate >70% among candidates you'd *want* to apply. If good candidates are bouncing, it's too long.
  4.  **Reputational Costs Can Cut Both Ways:** Enforcing penalties harshly might make your org seem ruthless. **Mitigation:** Be transparent upfront: "This test and probation ensure we hire people who will succeed here. We take fit seriously." Frame it as mutually beneficial screening. Handle terminations professionally and privately.

  **The Work Sample Test: It *Can* Be a Valid Signal Without Waste**

  For your nonprofit's specific context (~30 apps, 6-mo performance visibility, need for efficiency):

  1.  **The Test *is* Differentially Costly:** A well-designed task takes a skilled candidate 1-2 hours but would take an unskilled candidate 4+ hours *or be impossible* to do well. The unskilled candidate sees this cost/risk and often self-selects out. The time spent by the skilled candidate is low.
  2.  **It Leverages Hostage Dynamics:** The *real* "hostage" is the candidate's **time invested + future reputation** if they get hired and fail fast. The test is the gateway that makes taking this risk worthwhile only for the confident/skilled.
  3.  **The "Waste" Argument Fails:** Comparing the 1-2 hours of a skilled candidate on a test to 4 years and $100k for a degree is absurd. The net waste *saved* by filtering out unqualified candidates early is immense (saved salary, onboarding time, bad hires, re-hiring costs). **The test isn't free, but it's vastly cheaper and more targeted than the degree signal.**

  **The Better Analogy: A Probationary License**

  Think of the work sample test + probation period like getting a **driver's license:**

  1.  **The Test (Written + Road):** Relatively cheap and quick for a competent driver (differentially costly!). It's hard and time-consuming for a non-driver.
  2.  **The License:** The credential. Free to hold *if* you drive safely.
  3.  **The Hostage:** Your right to drive + fines/insurance costs (the penalty).
  4.  **The Verification:** Cops, traffic cameras, accidents.
  5.  **The Equilibrium:** Competent drivers get licensed cheaply and drive safely (no penalty paid). Incompetent drivers are filtered out by the test or lose their license quickly if they sneak through. The cost of the test isn't "wasted" for safe drivers – it buys them the right to drive. The system works *because* penalties are enforceable. **The "waste" (test time, DMV fees) is minimal compared to the alternative (unlicensed, dangerous drivers everywhere).**

  **Conclusion & Action for Your Nonprofit**

  *   **Your friend is wrong that "waste is load-bearing."** Honest signalling requires **differential cost/risk**, not necessarily sunk resource waste. **Hostage signals work.**
  *   **The work-sample/portfolio approach CAN be a credible, efficient signal** because it leverages differential effort cost *and* the threat of future consequences (the hostage).
  *   **The critical success factors for your nonprofit are:**
      1.  **Test Design:** Must be genuinely job-relevant and differentially costly (easy for good candidates, hard for bad ones). Keep it short (1-3 hrs max).
      2.  **Verification Rigor:** You MUST have a robust, timely (6-month) performance review process.
      3.  **Penalty Enforcement:** You MUST be willing to fire fast and document performance failures during probation.
      4.  **Transparency:** Communicate the *why* (better fit, fairer chance) and the *process* (test -> probation -> consequence) clearly upfront.

  **Tell your evo-psych friend:** "Signals need teeth, not just ash. Our test is the bite behind the bark – it's cheap for the strong to pass, but risky and costly for the weak to attempt *because* we enforce consequences. The degree burns everyone's time and money upfront. We're moving from burning cash to posting a performance bond. The bond deters the weak without incinerating resources from the strong. The handicap principle requires differential cost, not thermodynamic waste. Our system satisfies the math." Then pilot that damn test on your next hire and track the results. Concrete data beats evo-psych rhetoric every time.
