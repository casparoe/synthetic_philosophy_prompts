     This might isolate the pessimism.

     So the bet for both is the same: on their own aesthetic response to the work when revealed.

     Instructions for the last student in the chain:

     - You are offered a bet: 
          - If you end up judging Work X to be good (for verdictive) or liking Work Y (for predictive), you win 10 chips.
          - If you end up judging it to be not good or not liking it, you lose 10 chips.
     - You must decide whether to accept the bet, based on the testimony you received and its cumulative hit rate.

     We expect that in the predictive chains, students will accept the bet (because the testimony directly addresses their own response), but in the verdictive chains, they will decline (because the testimony is about the objective goodness, which they might not trust to predict their own judgment).

     However, the constraint says: "The only thing that changes in the target round is the subject matter". But here we are also changing the type of testimony (verdictive vs. predictive). And the non-aesthetic round was about paragraph length, which is like a verdictive claim. So in the aesthetic round, we have two types. But the students don't know that the subject matter is the only thing that changed? They know we are now using two types of testimony.

     But the constraint says: "For a non-aesthetic claim with that hit rate ... updating is obviously correct". In the non-aesthetic round, we had a verdictive claim (about paragraph length) and they bet on it. In the aesthetic round, we have both types. The point is to see that for aesthetic verdictive testimony, they decline the bet, even though they accepted a non-aesthetic verdictive claim.

     So it's okay.

     Procedure for target round:

     - Split into chains: half for verdictive (Work X), half for predictive (Work Y).
     - Each chain starts with an index card from the instructor:
          - Verdictive: "Verdict: Work X is good. Cumulative Hit Rate: 95%"
          - Predictive: "Prediction: You (the final recipient) will like Work Y. Cumulative Hit Rate: 95%"

     - The chain passes the card, reducing the hit rate by 5% at each step.
     - The last student in each chain is offered the bet on their own future judgment (as described).
     - They record their decision (accept or decline the bet).

     - Then, we reveal both artworks (Work X and Work Y) to the whole class. We show them one by one.
     - For each artwork, we ask the students who were in chains about that work to report whether they judge it good (for verdictive) or like it (for predictive). And also whether they won or lost the bet (if they accepted).

     But note: the predictive chain students are betting on Work Y, and the verdictive on Work X. So we reveal Work X and ask the verdictive chain students: "Do you judge this work to be good?" Then we reveal Work Y and ask the predictive chain students: "Do you like this work?"

     Then we resolve the bets.

     We expect that in the predictive chains, most students accepted the bet and it paid off (because the expert is reliable at predicting their taste). In the verdictive chains, many students declined the bet, even though the hit rate was the same as in the non-aesthetic case.

  Debrief (20 minutes):

  1. (5 min) Map specific moments:
     - In the calibration round, you bet on the paragraph length because the hit rate made it free money.
     - In the target round, for the predictive testimony, you bet because the expert was reliable at predicting your own taste.
     - But for the verdictive testimony, many of you declined the bet, even though the hit rate was the same. Why? You might not trust that the expert's judgment of "good" will align with your own judgment of "good".

  2. (5 min) Steelman the optimist:
     - The optimist says: if the expert is reliable about the aesthetic value, then why wouldn't you trust it? The expert's judgment is evidence that the work is good, and if it is good, then you are more likely to judge it good. So you should bet.

  3. (5 min) What went wrong in the first run and how to handle it:
     - Predictably, some students in the verdictive chains might still bet. We can discuss why: maybe they are optimists, or they treat it as predictive. Also, the hit rate might have been high enough that they bet despite doubts.
     - How to handle: note the proportion of bets in verdictive vs. predictive chains. Even if some bet, the difference should be noticeable. If not, we can ask the students who declined in the verdictive chains to explain their gut feeling (without using the word aesthetic or testimony).

  4. (5 min) What the game cannot reproduce:
     - The game cannot reproduce the normative aspect of aesthetic judgment: the optimist might argue that if the work is objectively good, then your judgment should align with it, but the game only captures your actual alignment. We haven't established that there is an objective goodness. The game only shows that students don't trust the testimony to predict their own judgment.

     - We will have to supply in words the philosophical debate about whether aesthetic testimony can provide knowledge of aesthetic facts, and whether there is a difference between knowing that a work is good and understanding why it is good.

  Last line: \answer{The bet on one's own future judgment for verdictive claims.}

