  ### Game Design: "Trust Chain Challenge"

  **Goal:** Students experience aesthetic-testimony pessimism through betting behavior, isolating subject matter as the only variable while separating knowledge, understanding, recognition, and verdictive vs. predictive testimony.

  **Materials:**  
  - **Index cards:** Pre-printed with claims, hit rates, and betting options.  
  - **Sealed envelopes:** 2 for artworks (labeled "Work X" and "Work Y"), 5 for calibration paragraphs.  
  - **Poker chips:** 20 per student (10 red = loss, 10 blue = gain).  
  - **Artworks:** Two distinct, unfamiliar abstract prints (e.g., Kandinsky vs. Malevich) on card stock, sealed.  
  - **Calibration items:** 5 paragraphs with word counts (100–120 words) in sealed envelopes.  

  ---

  ### Rules and Payoff Scheme  
  1. **Hit Rates & Calibration:**  
     - Each student receives a personal "hit rate" (95%, 90%, 85%, 80%) for the task type.  
     - Calibration round uses objective claims (paragraph word counts); target round uses aesthetic claims.  
     - **Betting:** Students accept/reject bets offering ±10 chips. Expected value is positive (e.g., 80% hit rate = +6 expected chips).  

  2. **Chain Structure:**  
     - **Calibration (non-aesthetic):** 4 chains (3–4 students each). First student sees paragraph, answers ">100 words?". Subsequent students pass verdict + cumulative hit rate (decaying 5% per link).  
     - **Target (aesthetic):** 2 chains per testimony type:  
       - **Verdictive:** "Work X is good." (Hit rate: 95% → 80%).  
       - **Predictive:** "You will like Work Y." (Hit rate: 95% → 80%).  
     - First student receives claim from instructor; no one sees artworks until betting ends.  

  3. **Betting Triggers:**  
     - Last student bets on:  
       - **Calibration & Verdictive:** "Is the claim true?" (Requires trusting testimony to correspond to reality).  
       - **Predictive:** "Will you like Work Y?" (Requires trusting testimony to predict personal response).  
     - Win 10 chips if correct; lose 10 if wrong.  

  ---

  ### Timeline (75 Minutes)  
  **0–5 min: Setup**  
  - Distribute chips, envelopes, cards. Explain rules: "Pass verdicts and hit rates. Bet based on final hit rate. Artworks stay sealed."  

  **5–25 min: Calibration Round (Non-Aesthetic)**  
  - **5–10 min:** Chain formation (4 groups). First student opens paragraph envelope, answers ">100 words?" with 95% hit rate.  
  - **10–20 min:** Subsequent students decay hit rate (5% per link), pass verdict. Final student bets: "Is this claim true?"  
  - **20–25 min:** Reveal true word counts. Resolve bets.  

  **25–55 min: Target Round (Aesthetic)**  
  - **25–30 min:** New chains (2 verdictive, 2 predictive). First student receives:  
    - Verdictive card: "Work X is good. Hit rate: 95%."  
    - Predictive card: "You will like Work Y. Hit rate: 95%."  
  - **30–45 min:** Decay hit rates, pass verdicts. Final student bets:  
    - Verdictive: "Is Work X good?" (Tests knowledge/recognition).  
    - Predictive: "Will you like Work Y?" (Tests predictive trust).  
  - **45–55 min:** **No reveal yet.** Students journal: "Why did you bet/not bet?"  

  **55–65 min: Artwork Reveal & Self-Assessment**  
  - Unseal Work X. Verdictive students answer: "Do you judge it good?" (Tests recognition).  
  - Unseal Work Y. Predictive students answer: "Do you like it?" (Tests understanding/response).  
  - Resolve bets.  

  **65–75 min: Debrief**  

  ---

  ### Debrief  
  1. **Map Moments to Concepts:**  
     - **Calibration betting:** Generic testimony decay. Students bet—it was "free money" (e.g., "Paragraph length is objective; hit rates matter").  
     - **Verdictive decline:** Pessimism emerges. Students reject bets despite high hit rates. Why? They can’t *know* "goodness" from testimony alone (journal quotes show confusion: "I couldn’t picture it," "What if I disagree?").  
     - **Predictive acceptance:** Students bet. Predictive testimony ("you will like") feels actionable—it bypasses understanding and targets personal response.  
     - **Recognition reveal:** When shown Work X, verdictive students who bet may still not *recognize* goodness ("I see it, but I don’t get why it’s good").  

  2. **Steelman Optimist:**  
     - "If hit rates are reliable, testimony *should* transfer knowledge. Rejecting aesthetic bets is irrational: if 8/10 experts are right, why ignore free chips? Understanding isn’t needed for knowledge (e.g., you know a stove is hot without thermodynamics)."  

  3. **Predictable Issues & Fixes:**  
     - **Problem:** Students may bet on verdictive claims (e.g., risky players, misinterpreting hit rates).  
       - **Fix:** Pre-game emphasis: "Hit rates are real; calibration proved it." Contrast group decisions (predictive chains bet more).  
     - **Problem:** Artwork reactions vary (e.g., Work Y disliked).  
       - **Fix:** Use obscure, divisive art (e.g., abstract prints). Highlight that predictive bets *still* felt safer.  

  4. **Unreproducible Element:**  
     - The game can’t simulate **why** understanding feels essential to aesthetic knowledge (e.g., testimony’s inability to convey "goodness" without firsthand experience). You must verbally contrast: "Knowing a sunset is beautiful vs. seeing its colors—the latter involves perceptual learning."  

  **Final Design Crux:**  
  \answer{Betting on personal judgment for verdictive aesthetic claims.}
