  This design isolates the subject matter by having the calibration round on non-aesthetic and the target on aesthetic. It also separates the four aspects by having the verdictive and predictive testimony in the aesthetic round, and by making the bet on the student's own future judgment (which touches on recognition and understanding when they see the work). The students will likely decline the bet in the verdictive chain because they don't trust that the testimony about goodness will translate to their own judgment, thus running into pessimism.
