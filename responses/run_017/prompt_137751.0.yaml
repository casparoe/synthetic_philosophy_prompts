  The core challenge is finding a feature that breaks symmetry without appealing to expected utility, magnitudes, or burden shifting. After considering several possibilities - reversibility, option value, institutional constraints - I think institutional authority over reversibility might work best. In this case, the agency only has power to reverse its own actions, not external changes.

