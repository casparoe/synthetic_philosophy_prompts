  The core tension emerges in part two: when NASA managers pressured Thiokol to reverse the no-launch recommendation, were they imposing different epistemic standards through conversational context (contextualism) or responding to shifted practical stakes (pragmatic encroachment)? The answer might reveal contextualism's advantage in handling institutional power dynamics.

