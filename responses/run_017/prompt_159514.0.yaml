  - The temporal scheme is about the sequence of glyphs. The glyphs are built from a set of 4 basic elements (say, circles, squares, triangles, and crosses) arranged in a 2x2 grid. However, the important aspect is the pattern of change in the sequence. The deck is divided into 4 kinds (A1, A2, A3, A4) based on the pattern of transitions in the glyphs. The rule is that the sequence of cards in a kind follows a particular transition rule (e.g., kind A1: the next glyph always has the same element in the top-left and the others cycle in a fixed pattern). The temporal task: given a sequence of 3 cards of the same kind, predict the next glyph pattern.

