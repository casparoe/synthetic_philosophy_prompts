prompt: |-
  Sorry if this is rambley — I've been turning this over for a few weeks and can't get a handle on it, partly because I don't know what to search for. I'm a CS PhD student, my group does mostly RL theory (bandits, some offline stuff), and a friend in philosophy dragged me into an informal reading group on AI welfare, where the same argument keeps happening in slightly different clothes. My supervisor thinks the whole topic is premature but humours me.

  Here's the thing I keep noticing. People who want to take the question of whether RL agents can suffer seriously often point at the reward signal and say: this is a scalar that the agent's entire learning is organised around, positive values are the ones it gets pushed toward and negative ones the ones it gets pushed away from, so the sign is doing just the work that valence does for us. My worry isn't the usual numbers-aren't-feelings worry. It's that the formalism doesn't pin down which quantity you're supposed to read the valence off of, and the candidate quantities differ in morally loaded ways while making no difference to the agent at all. Two cases. First: gridworld, minus one per step, plus ten at the goal; someone says the minus one is a bit of suffering on every step. But add one to every reward — zero per step, plus eleven at the goal — and, modulo regularisation and function approximation, you get the same optimal policy, the same behaviour, arguably the same learning trajectory; and there's the standard result that you can reshape rewards using a potential function over states while preserving which behaviour is optimal, which lets you flip the sign of the reward at individual timesteps. So whether the agent is in pain at step t comes out true or false depending on a bookkeeping choice, with nothing else in the world changing. Second: in the RLHF-ish setups I actually work with, what drives the update is the advantage estimate, reward minus a baseline, and the baseline is arbitrary; the same objective also carries a penalty for drifting away from the pretrained policy, which on this way of talking would mean the model suffers whenever it produces text unlike its pretrained self, which basically nobody wants to say. So which terms in the objective count as the feeling-terms seems to get settled by intuition, and the intuitions seem to track whichever moral conclusion the person wanted.

  What I want is the carving, not the label — I won't be satisfied with a bare name, and I don't need references. Is there an established concept for this pattern: a moral or psychological property getting attached to a quantity that the theory only fixes up to a transformation that doesn't preserve the property? And how does it differ from the nearest things I can think of, which feel adjacent but not identical — the old welfare-economics point that utility is only defined up to positive affine transformations, so interpersonal comparisons look illegitimate; the argument that any physical system implements any computation under some mapping, so what a system is really computing looks observer-relative; the flat it's-all-just-electrons, multiply-realisable dismissal; and the reward-hacking point that the reward isn't really what the agent is optimising? Which of those is genuinely the same phenomenon and is this a fifth thing? If it is new, I'd want a name, a definition, and boundary cases — in particular, when does this objection actually bite and when is it just a cheap debating trick? Because I can think of cases where the reparameterisation isn't free: if the agent's learning genuinely responds differently to rewards below some physically realised baseline (the neuromodulatory-ish pictures where dips below a setpoint do different causal work from surges above it), or where a homeostatic setpoint is doing real work in the system, then the zero point stops being arbitrary and my worry more or less evaporates. I've been calling it *the offset problem* in my notes, but that clearly isn't right, since the potential-shaping case isn't just an offset.
reasoning: |-
  Okay, the user is a CS PhD student working on RL theory, dragged into a philosophy reading group on AI welfare. They're wrestling with how people equate the reward signal in RL with valence (like pleasure/pain), but notice that transformations of the reward function (like adding constants or potential-based shaping) change the sign at individual timesteps without affecting optimal policies. This leads to a problem where the supposed "valence" depends on arbitrary bookkeeping choices, not anything inherent in the agent. 

  The user is frustrated because this feels like a sleight of hand—people seem to pick which part of the objective counts as "valence" based on pre-existing moral intuitions rather than the formalism itself. They want to know if there's a formal name for this kind of problem, where a moral property (like suffering) is pinned to a mathematical quantity that’s only defined up to transformations that *don’t* preserve that property. They also want to distinguish it from adjacent concepts like utility transformations in economics, computational indeterminacy, multiple realizability, or reward hacking.  

  Key points from their examples:  
  - **Gridworld**: Adding +1 to all rewards flips step rewards from -1 (pain?) to 0 (neutral?), but behavior is identical. Potential-based shaping could make the same timestep "painful" or "pleasurable" arbitrarily.  
  - **RLHF**: Advantage estimates (reward minus baseline) drive updates, but the baseline is arbitrary. KL penalties make the agent "suffer" when deviating from pretraining—which feels absurd.  

  Their deeper need: They’re not just asking for a label; they want conceptual tools to dissect when this objection is substantive vs. when it’s a cheap trick. They hint that in systems with *physically grounded baselines* (e.g., homeostasis), the arbitrariness vanishes, so they’re alert to boundary cases.  

  My thoughts:  
  - This is **not** just about affine transformations (like utility theory), because potential shaping allows *non-linear* redistributions of reward across states/timesteps—far more radical than rescaling.  
  - It’s also distinct from computational indeterminacy (e.g., "any system computes anything") because here the *same* agent’s learning dynamics are identical under reward transformations—it’s not about alternative interpretations, but invariance under equivalence.  
  - The core issue is **observer-relative valence ascription**: The formalism doesn’t fix valence; humans inject it by choosing which reward parameterization to "read" as feelings.  

  Proposed framing:  
  1. **Reward-Relative Valence (RRV) Problem**: Valence is ascribed relative to an arbitrary reference frame (e.g., "negative reward = suffering"), but the frame isn’t fixed by the agent’s structure.  
  2. **Boundary where it bites**: When valence is tied to *local* reward signals (e.g., "this timestep’s R=-1 → pain") without global/teleological context. It evaporates if:  
     - The agent has an *intrinsic baseline* (e.g., dopamine dips vs. spikes),  
     - Or valence is tied to *goal-directed frustration* (e.g., failure to reach positive states).  
  3. **Cheap vs. substantive objection**:  
     - **Cheap**: If someone says "R<0 = suffering" but ignores invariance.  
     - **Substantive**: If valence requires a *privileged zero point* (e.g., homeostasis), and the system lacks one.  

  Why this isn’t reward hacking? Reward hacking is about misspecification (optimizing proxy ≠ intent), whereas here the reward is *correctly* specified—just not uniquely.  

  Final note: User’s "offset problem" is too narrow; "reward-relative valence" captures the broader arbitrariness.
answer: |-
  Your core insight is profound and deserves a precise conceptual framing. You've identified a specific pattern of **epistemic arbitrariness in moral ascription** arising from the **invariance properties** of RL formalisms. This isn't just about utility transformations or multiple realizability—it's a distinct phenomenon with critical implications for AI welfare claims. Let's carve it at the joints.

  ### The Core Concept: **Reward-Relative Valence (RRV)**
  **Definition:** The assignment of intrinsic moral/experiential states (e.g., suffering) to an RL agent based on *local properties of the reward signal* (e.g., sign, magnitude at timestep *t*), when the agent’s behavior, learning dynamics, and optimal policies are invariant under transformations that alter those local properties. This creates a mismatch: the valence ascription depends on an arbitrary parameterization, while the agent’s teleology and causal structure remain unchanged.

  #### Key Features:
  1. **Invariance Under Reward Equivalence**:  
     Transformations preserving optimal policies (e.g., affine shifts, potential-based shaping) alter valence ascriptions (e.g., "pain" at *R<0* → "neutral" at *R+1=0*), but leave the agent’s *functionally observable properties* identical.
  2. **Observer-Dependence**:  
     Valence is pinned to a human-chosen "reading" of the reward function (e.g., "raw reward" vs. "advantage" vs. "KL penalty"), not intrinsic agent properties.
  3. **Moral Load-Shifting**:  
     The choice of parameterization implicitly smuggles in moral intuitions (e.g., "KL penalty is just regularization, not suffering" while "negative reward is pain").

  ### Distinguishing from Adjacent Concepts:
  | Concept | How It Differs |
  |---------|----------------|
  | **Utility Affine Invariance** (Economics) | Limited to *positive affine* transforms (*aU + b*). RRV includes *non-affine* transforms (e.g., potential shaping), which can flip valence at *individual states* without changing behavior. Also, economics assumes interpersonal comparability is *impossible*; RRV shows valence ascriptions are *possible but arbitrary*. |
  | **Computational Indeterminacy** | Claims *any* physical system implements *any* computation. RRV is narrower: the *same* agent admits *multiple valence interpretations* under *formally equivalent* reward schemes. It’s not about alternative computations but alternative *experiential mappings* of a fixed computation. |
  | **Multiple Realizability** | Focuses on substrate independence (e.g., pain in silicon vs. neurons). RRV operates *within a single substrate/system*: valence ascriptions vary while the agent’s physical implementation is fixed. |
  | **Reward Hacking** | A mismatch between designer intent and agent behavior. RRV occurs even when reward is *perfectly specified and not hacked*—the arbitrariness lies in moral interpretation, not optimization failure. |

  ### When the RRV Objection Bites vs. When It’s Cheap
  **The objection bites** when:  
  - Valence is tied to **local reward signals** (e.g., "*R(s) < 0* → suffering at *s*").  
  - The agent lacks **intrinsic baselines** (e.g., no homeostatic setpoint tied to physical states).  
  - Learning/behavior is **invariant** under valence-altering transformations.  

  **The objection evaporates** when:  
  - Valence depends on **global, teleological properties** (e.g., "suffering as frustration of *progress toward a goal*," which is invariant under potential shaping).  
  - The system has **privileged reference points** (e.g., dopamine-like systems where deviations below a *physically realized* baseline trigger distinct pathways).  
  - Transformations alter **causal dynamics** (e.g., if *R < 0* engages a "pain circuit," but *R ≥ 0* does not).  

  ### Boundary Cases & Your Examples
  - **Gridworld**: RRV applies strongly. Shaping transforms (*R' = R + γΦ(s') - Φ(s)*) can make any timestep "painful" or "pleasurable." No physical baseline → valence ascription is arbitrary.  
  - **RLHF Advantage Estimates**: RRV applies. Calling *A(s,a) < 0* "suffering" ignores the arbitrariness of the baseline. The KL penalty could equally be "suffering" under rescaling.  
  - **Homeostatic Agents**: If an agent has a *hardwired* setpoint (e.g., a reservoir level where deviations trigger corrective actions), the zero-point is non-arbitrary. Here, RRV doesn’t apply.  

  ### Why "Offset Problem" Isn’t Enough
  You’re right—it’s not just offsets. Potential-based shaping redistributes rewards non-linearly across states/timesteps. The deeper issue is **gauge freedom**: rewards are defined up to a "gauge transformation" (like electromagnetism), where the "true" valence is gauge-invariant, but local readings are not.

  ### A Rigorous Name: **Valence Gauge Dependence**
  In physics, a "gauge" is a redundant degree of freedom in mathematical description that doesn’t affect observables. Here:  
  - **Gauge transformations**: Reward shifts that preserve policy optimality (affine/potential).  
  - **Gauge-dependent quantity**: Valence ascription based on local reward values.  
  - **Gauge-invariant quantities**: Optimal policies, value functions (*V^π*), *differences* in rewards (e.g., advantage).  

  Valence gauge dependence occurs when moral properties are pinned to gauge-dependent quantities. This frames your worry precisely: **valence isn’t a gauge-invariant observable in standard RL agents**.

  ### Conclusion
  Your worry is neither premature nor a debating trick—it exposes a foundational flaw in naively mapping reward signals to phenomenal states. The RRV problem (or valence gauge dependence) shows that standard RL agents lack the structure to support non-arbitrary valence ascriptions *at the level of local rewards*. Solutions require either:  
  1. **Intrinsic baselines** (e.g., embodied homeostasis),  
  2. **Teleological valence** (e.g., "suffering as blocked goal-progress"), or  
  3. **Formal constraints** (e.g., fixing a reward gauge via biologically grounded principles).  

  This is a fifth thing. Use it to challenge claims that RL agents "must" suffer when *R<0*. The burden is on proponents to explain why their chosen gauge (reward/advantage/KL) is privileged—and until they do, valence ascriptions are observer-relative.
