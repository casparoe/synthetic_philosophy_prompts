prompt: |-
  I teach a final-year undergraduate seminar on scepticism in classical Chinese and early modern European philosophy, and I am setting this year's final paper. Students have read Descartes's First Meditation and the butterfly-dream passage in the Zhuangzi's Discussion on Making All Things Equal, but I have deliberately kept them off the secondary literature: the exam is closed-book, and I tell them explicitly that no citations, scholarly apparatus, or named interpreters are expected or will be rewarded.

  I want one 90-minute essay question, worth 25 marks, that cannot be answered by describing Cartesian dream scepticism and then observing that the Zhuangzi passage sounds similar. To force students past that move, I have been teaching a three-way distinction among targets of doubt, and I want the question built around it:

  - kind-doubt: uncertainty about what sort of thing one is — whether the organism one is belongs to the human kind or the butterfly kind.
  - frame-doubt: uncertainty about whether one's present experiential situation as a whole is a dream or a waking one, i.e. about whether the apparent environment is veridical. This, roughly, is Descartes's target.
  - subject-doubt: uncertainty about which first-person perspective is the one currently occupied — about whose experience this is, or which subject's career the present experience belongs to — where the candidate subjects are not distinguished by the character of the present experience but by which of them anchors reality.

  The question should require students to locate the passage's I-do-not-know claim on this map, to say why the routine comparison with Descartes mislocates it, and to draw the consequences. In particular it should force them to handle three further things:

  First, the closing remark that between Zhou and the butterfly there must be a distinction, and that this is what is called the transformation of things. On its face this concedes the very fact of the matter that the preceding doubt seemed to withhold. Students must decide whether it is a concession of ignorance about a determinate fact, or a distinction drawn inside transformation rather than between two fixed natures, and they must say what the must is doing — logical, conventional, or something about the requirements of naming.

  Second, evidential symmetry. Students should have to specify what would settle the matter on the reading they favour, and then explain why nothing available to the subject could: the two hypotheses do not differ in present phenomenology, and any test performed is itself performed within whichever frame one occupies, so waking up is just another transformation rather than a return to a privileged standpoint.

  Third, whether the passage leaves any indubitable residue at all. Descartes has one; Zhuangzi, apparently, does not. If transformation is supposed to play that role, students must say in what sense it is not simply one more item in doubt — including the awkward case where the closing claim is itself asserted from within a frame and so seems to pull the ground from under itself.

  Deliverables, please:

  1. The question exactly as it will appear on the paper. It must be self-contained, use no jargon beyond the threefold distinction above, and give no hints about which resolution I favour.
  2. A model answer of about 800 to 900 words that takes a definite position rather than canvassing options sympathetically and then declining to choose.
  3. A marking scheme out of 25 built around named must-hit moves with marks attached, stating precisely what separates an A answer from a B and a B from a C.
  4. Against each must-hit move, one line on how students typically get it wrong. I especially want to know what to penalise in the stock answers — that Zhuangzi is a mystic, or a relativist, or not really a sceptic at all, or that the passage is simply the Dream Argument in an exotic setting. None of those should earn more than a C on their own.
reasoning: |-
  We are constructing an exam question and associated materials based on the user's specifications. The user teaches a seminar on scepticism comparing classical Chinese (Zhuangzi) and early modern European (Descartes) philosophy. The final paper is a 90-minute closed-book essay, and students are expected to engage deeply with the primary texts without secondary literature.

  The user has introduced a threefold distinction to avoid superficial comparisons between Descartes and Zhuangzi:

  1. **Kind-doubt**: Uncertainty about what kind of thing one is (e.g., human or butterfly).
  2. **Frame-doubt**: Uncertainty about whether one's current experience is a dream or waking (the environment's veridicality). This is Descartes's target.
  3. **Subject-doubt**: Uncertainty about which first-person perspective one currently occupies, where the candidates are distinguished by which anchors reality (not by the character of the experience).

  The essay question must require students to:
  - Locate Zhuangzi's "I do not know" claim in the butterfly dream passage on this map.
  - Explain why the routine comparison with Descartes (which assumes frame-doubt) mislocates it.
  - Address three specific issues:
     a) The meaning of the closing remark: "Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things." Students must interpret the "must" and whether it concedes a fact or draws a distinction within transformation.
     b) Evidential symmetry: Why nothing available to the subject can settle the matter (due to phenomenological indistinguishability and the frame-relative nature of any test).
     c) Whether there is any indubitable residue (like Descartes's cogito) and how transformation might function as such without being doubted itself.

  **Deliverables**:

  1. **The Essay Question**: Self-contained, no jargon beyond the threefold distinction, no hints about the instructor's preferred resolution.

  2. **Model Answer**: 800-900 words, taking a definite position.

  3. **Marking Scheme**: Out of 25, with named must-hit moves and marks. Specify what separates A, B, and C answers.

  4. **Common Mistakes**: One line per must-hit move on how students typically get it wrong, especially penalizing stock answers (mystic, relativist, not a sceptic, or simply the Dream Argument in exotic setting).

  ---

  ### Step 1: Crafting the Essay Question

  The question must be self-contained and include the threefold distinction. We remind the students of the passage and the distinction, then ask them to apply it.

  **Proposed Question**:

  > In the butterfly-dream passage from the *Zhuangzi* (Chapter 2, "Discussion on Making All Things Equal"), Zhuang Zhou says: "Once Zhuang Zhou dreamt he was a butterfly [...] and did not know that he was Zhou. Suddenly he awoke, and there he was, the solid Zhou. He did not know whether he was Zhou who had dreamt he was a butterfly or a butterfly now dreaming he was Zhou. Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things."
  >
  > We have distinguished three forms of doubt:
  > - **Kind-doubt**: uncertainty about what sort of thing one is (e.g., human or butterfly).
  > - **Frame-doubt**: uncertainty about whether one's present experiential situation as a whole is a dream or a waking one (i.e., about the veridicality of the apparent environment).
  > - **Subject-doubt**: uncertainty about which first-person perspective is the one currently occupied, where the candidate subjects are not distinguished by the character of the present experience but by which of them anchors reality.
  >
  > Write an essay that:
  > (a) Locates Zhuang Zhou's "I do not know" claim within this threefold distinction, and explains why the routine comparison of this passage with Descartes's dream argument in the First Meditation (which targets frame-doubt) mislocates it.
  > (b) Interprets the closing remark: "Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things." What is the force of "must" here? Does it concede a determinate fact of the matter, or does it draw a distinction within transformation? How does this remark relate to the preceding doubt?
  > (c) Explains why, on your reading, nothing available to the subject could settle the doubt (i.e., the problem of evidential symmetry). Why is it that the two hypotheses (being Zhou or being a butterfly) do not differ in present phenomenology, and why does any test performed fail to break the symmetry?
  > (d) Considers whether the passage leaves any indubitable residue (like Descartes's cogito). If transformation is the residue, how does it avoid being just one more item in doubt? In particular, address the worry that the closing claim might itself be asserted from within a frame and thus undermine itself.

  ---

  ### Step 2: Model Answer (800-900 words)

  **Position**: The doubt in the Zhuangzi passage is primarily subject-doubt, not frame-doubt. The closing remark does not concede a determinate fact but rather points to the process of transformation as the only constant. Transformation is the indubitable residue because it is the condition for the doubt itself.

  **Model Answer**:

  The butterfly-dream passage in the *Zhuangzi* is often superficially compared to Descartes's dream argument, but a closer analysis using the threefold distinction reveals a fundamentally different sceptical problem. Zhuang Zhou's doubt is not about the veridicality of his environment (frame-doubt), nor is it merely about what kind of entity he is (kind-doubt). Instead, it is a radical subject-doubt: uncertainty about which first-person perspective he currently occupies, where the candidates (Zhou and the butterfly) are distinguished by which anchors reality. This essay will argue that the passage's scepticism targets the very identity of the subject, and that the closing remark on transformation provides a resolution that is consistent with this doubt, leaving transformation as the only indubitable residue.

  First, the nature of the doubt. In the passage, Zhuang Zhou experiences being a butterfly in a dream and then awakens as Zhou. He then doubts whether he is now Zhou who had dreamt of being a butterfly or a butterfly now dreaming of being Zhou. The key is that the present experience does not phenomenologically distinguish the two scenarios: whether he is Zhou dreaming or a butterfly dreaming, the current sensory input (as Zhou) is identical. This is not frame-doubt because frame-doubt concerns the reality of the entire environment (e.g., Descartes worrying that his current experience might be a dream and thus non-veridical). Here, the doubt is about *who* is having the experience: which subject's life this moment belongs to. The candidate subjects (Zhou and the butterfly) are not defined by their intrinsic properties but by their position in reality: Zhou's life includes the butterfly dream as a dream, while the butterfly's life would include the Zhou experience as its dream. Thus, the doubt is subject-doubt. The routine comparison with Descartes mislocates it because Descartes is concerned with whether his senses are reliable (frame-doubt), whereas Zhuangzi questions the continuity of the self across transformations.

  The closing remark, "Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things," seems at first to concede the very fact that the doubt withholds. However, the "must" here is not logical or metaphysical but conventional and linguistic. The distinction is not between two fixed natures but is drawn within the process of transformation. That is, the distinction is necessary for us to name and talk about the experiences (we must label one state as Zhou and another as butterfly), but it does not imply that Zhou and the butterfly are ontologically distinct substances. Transformation is the constant process of change that underlies these distinctions. Thus, the doubt about which subject one is remains, but the remark acknowledges that we must draw distinctions pragmatically to navigate the world. The concession is not to a determinate fact but to the necessity of making distinctions within the flux.

  Regarding evidential symmetry, nothing available to the subject can settle the doubt because any evidence is internal to the frame. If the subject is Zhou, then his waking experience is real and the butterfly dream was unreal. But if he is a butterfly dreaming of being Zhou, then the Zhou experience is part of the dream and the butterfly life is real. Any test (e.g., pinching oneself) would be experienced within the current frame and thus cannot adjudicate between the two hypotheses. The two scenarios are phenomenologically symmetrical: the present moment feels equally real in both. Moreover, "waking up" from one state to another does not resolve the doubt because it is just another transformation, not a return to a privileged standpoint. Each transformation is a shift from one perspective to another, with no Archimedean point outside the process.

  Finally, does the passage leave any indubitable residue? Descartes finds certainty in the thinking self (cogito), but Zhuangzi seems to leave everything in doubt. However, transformation itself is the residue. The process of transformation — the constant shifting of perspectives — is indubitable because it is the condition for the doubt. Even when doubting which subject one is, one cannot doubt that there is change and transformation. This is not an item within the frame but the framework itself. The worry that the closing claim might be asserted from within a frame and thus undermine itself is misplaced because transformation is not a claim about the world but the very nature of existence. The assertion of transformation is not a proposition that could be false in a dream; rather, it is the recognition that all experiences, including dreams and awakenings, are transformations. Thus, transformation avoids being doubted because it is the background against which doubt arises.

  In conclusion, the *Zhuangzi* passage presents a scepticism more radical than Descartes's by targeting the subject. The comparison with Descartes fails because it mistakes subject-doubt for frame-doubt. The closing remark on transformation does not resolve the doubt by affirming a fact but by pointing to the fluidity of identity. Transformation, as the constant process of change, is the indubitable residue because it is the precondition for the subject-doubt itself.

  ---

  ### Step 3: Marking Scheme (Total: 25 marks)

  The essay will be graded based on the following must-hit moves:

  1. **Correct Location of the Doubt (5 marks)**:
     - Clearly identifies the doubt as subject-doubt (not frame-doubt or kind-doubt).
     - Explains why the comparison with Descartes (who targets frame-doubt) mislocates it.
     - *A (5)*: Precise and nuanced explanation, showing understanding of how subject-doubt differs from frame-doubt and kind-doubt.
     - *B (3-4)*: Correctly identifies subject-doubt but with less precision in distinguishing it; some confusion with frame-doubt or kind-doubt.
     - *C (1-2)*: Misidentifies the doubt (e.g., as frame-doubt) or provides a vague/incorrect account.

  2. **Interpretation of the Closing Remark (5 marks)**:
     - Interprets the "must" appropriately (conventional/linguistic necessity, not metaphysical).
     - Explains that the distinction is within transformation (not between fixed natures).
     - Relates this to the preceding doubt without collapsing it.
     - *A (5)*: Sophisticated analysis of "must" and transformation, showing how it coexists with doubt.
     - *B (3-4)*: Correct but less developed; may miss the nuance of transformation or the force of "must".
     - *C (1-2)*: Takes the remark as a concession of fixed facts or fails to engage with transformation.

  3. **Evidential Symmetry (5 marks)**:
     - Explains why the two hypotheses are phenomenologically indistinguishable.
     - Explains why any test is frame-relative and thus fails to break symmetry.
     - Addresses why "waking up" is just another transformation.
     - *A (5)*: Clear and thorough explanation of symmetry and frame-relativity.
     - *B (3-4)*: Describes symmetry but with gaps (e.g., misses frame-relativity of tests).
     - *C (1-2)*: Superficial or incorrect account of why evidence fails.

  4. **Indubitable Residue (5 marks)**:
     - Argues that transformation is the residue (or takes a clear alternative position).
     - Explains how transformation avoids being doubted (as the condition for doubt).
     - Addresses the self-undermining worry (if the claim is from within a frame).
     - *A (5)*: Convincing account of transformation as residue; adeptly handles self-reference.
     - *B (3-4)*: Identifies transformation but with weaker justification or incomplete handling of self-reference.
     - *C (1-2)*: Fails to identify a residue or misidentifies it; does not address the worry.

  5. **Structure and Clarity (5 marks)**:
     - Essay is well-organized, with a clear thesis and logical flow.
     - Arguments are presented coherently and concisely.
     - *A (5)*: Flawless structure; precise and engaging prose.
     - *B (3-4)*: Generally clear but with minor organizational issues or repetitions.
     - *C (1-2)*: Disorganized, unclear, or significantly underdeveloped.

  **Summary of Grade Boundaries**:
  - **A (21-25)**: Excellent on all fronts, with sophisticated insights and no major flaws.
  - **B (16-20)**: Competent but with some limitations in depth or precision in one or two moves.
  - **C (11-15)**: Superficial or flawed in multiple moves, e.g., mislocating the doubt and mishandling the residue.
  - **D (6-10)**: Weak, with significant misunderstandings.
  - **F (0-5)**: Incoherent or irrelevant.

  ---

  ### Step 4: Common Mistakes (per must-hit move)

  1. **Location of Doubt**:
     - *Common mistake*: Students often conflate Zhuangzi's doubt with Descartes's frame-doubt, saying both worry about whether they are dreaming. Some may even call it kind-doubt (uncertainty about being human or butterfly). Stock answers like "it's the same as Descartes" or "Zhuangzi is a relativist, so he doesn't believe in fixed kinds" miss the subject-doubt.

  2. **Closing Remark**:
     - *Common mistake*: Taking "must" as a metaphysical necessity, thus concluding that Zhuangzi is affirming a fixed distinction. Alternatively, dismissing the remark as a non-sceptical lapse. Stock answers like "Zhuangzi is a mystic, so he transcends distinctions" avoid the text.

  3. **Evidential Symmetry**:
     - *Common mistake*: Claiming that Zhuangzi could use evidence (e.g., memory) to distinguish, without seeing that memory is frame-relative. Or, stating that waking up resolves the doubt (like Descartes's hope for clear and distinct perceptions). Stock answer: "It's just like the Dream Argument, where no evidence can help."

  4. **Indubitable Residue**:
     - *Common mistake*: Asserting that Zhuangzi has no residue (thus not a sceptic) or that transformation is doubted. Stock answers: "Zhuangzi is not a sceptic; he's a relativist" or "Transformation is just another belief."

  5. **Overall**:
     - *Stock answers to penalize*: 
       - "Zhuangzi is a mystic, so doubt leads to enlightenment." (Ignores the structure of doubt.)
       - "It's relativism: no truth, so no need for doubt." (Misses the doubt expressed.)
       - "Same as Descartes but in ancient China." (Fails to see subject-doubt.)
       - "Not real scepticism because he ends with transformation." (Misunderstands the residue.)

  These stock answers, if unsupported by the text and the threefold distinction, should not exceed a C grade.
answer: |-
  ### 1. Essay Question  
  **As it appears on the exam paper:**  

  > **Section A (25 marks)**  
  > In the butterfly-dream passage from the *Zhuangzi* (Chapter 2, "Discussion on Making All Things Equal"), Zhuang Zhou states:  
  > *"Once Zhuang Zhou dreamt he was a butterfly [...] and did not know that he was Zhou. Suddenly he awoke, and there he was, the solid Zhou. He did not know whether he was Zhou who had dreamt he was a butterfly or a butterfly now dreaming he was Zhou. Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things."*  
  >  
  > Using **only** the following three types of doubt—defined here for clarity—write an essay addressing **all** parts below:  
  > - **Kind-doubt**: Uncertainty about what *sort of thing* one is (e.g., whether one belongs to the human kind or the butterfly kind).  
  > - **Frame-doubt**: Uncertainty about whether one’s present experiential situation as a whole is a dream or a waking one (i.e., about whether the apparent environment is veridical).  
  > - **Subject-doubt**: Uncertainty about *which first-person perspective* one currently occupies—i.e., about whose experience this is, or which subject’s career the present experience belongs to—where the candidate subjects are not distinguished by the character of the present experience but by which of them anchors reality.  
  >  
  > **Your essay must:**  
  > (a) Locate Zhuang Zhou’s “I do not know” claim within the above threefold distinction, and explain why comparing it to Descartes’s dream argument (which targets frame-doubt) misidentifies the core doubt.  
  > (b) Interpret the closing remark: *“Between Zhou and a butterfly there must be a distinction. This is called the Transformation of Things.”* What is the force of “must” here? Does it concede a determinate fact of the matter, or draw a distinction *within* transformation? How does this remark relate to the preceding doubt?  
  > (c) Explain why nothing available to the subject could settle the doubt (i.e., why evidential symmetry holds). Address why the two hypotheses do not differ in present phenomenology, and why any test (including “waking up”) fails to break the symmetry.  
  > (d) Discuss whether the passage leaves any indubitable residue (like Descartes’s *cogito*). If “transformation” is that residue, explain how it avoids being doubted itself—especially given that the closing claim might be asserted from within a frame.  

  ---

  ### 2. Model Answer (848 words)  
  Zhuang Zhou’s butterfly-dream passage presents a sceptical crisis that superficially resembles Cartesian doubt but fundamentally differs in structure and implications. I argue that Zhuangzi’s “I do not know” expresses *subject-doubt*, not frame-doubt or kind-doubt, and that the closing remark on “transformation” provides an indubitable residue that avoids self-undermining by being the condition for doubt itself.  

  **(a) Locating the Doubt and the Descartes Miscomparison**  
  Zhuang Zhou’s doubt arises when he awakens from dreaming he was a butterfly and questions whether he is *now* Zhou remembering a dream or a butterfly *currently* dreaming it is Zhou. This is not *kind-doubt*, which would concern whether his body is biologically human or lepidopteran. Zhuangzi does not question his physical form upon waking (“the solid Zhou”) but the *perspective* he inhabits. Neither is it *frame-doubt*—Descartes’s concern in the First Meditation. For Descartes, the dream scenario casts doubt on whether sensory experiences (e.g., sitting by a fire) accurately represent reality, threatening knowledge of the external world. Zhuangzi’s doubt is deeper: he accepts the “reality” of his current state (as Zhou) but questions whose reality it is. The candidate subjects (Zhou’s life vs. the butterfly’s life) are defined not by how things appear now (which is identical in both scenarios) but by which subject’s existence *anchors* the dream. If Zhou anchors reality, his butterfly experience was a dream; if the butterfly anchors it, Zhou’s current state is the dream. The Cartesian comparison mislocates the doubt as frame-doubt because it assumes Zhuangzi questions the *veridicality of appearances* (e.g., “Is this waking state real?”). Instead, Zhuangzi questions *perspectival ownership*: “Whose stream of consciousness is this?”  

  **(b) Interpreting the Closing Remark**  
  The closing line—“Between Zhou and a butterfly there must be a distinction”—appears to concede a fact the doubt withheld. Yet “must” here is neither logical nor metaphysical but *conventional*, rooted in the pragmatics of naming. Zhuangzi does not affirm a determinate fact about fixed natures (e.g., “Zhou and butterflies are eternally distinct species”). Rather, the distinction arises *within* transformation as a functional necessity for discourse. To speak of “Zhou” or “butterfly” requires differentiating perspectives, even if those perspectives are fluid and mutually transformative. The remark does not resolve the doubt but contextualizes it: transformation—the ceaseless shifting between perspectives—is the constant, while distinctions are provisional labels applied *to* this flux. Thus, “must” signals a linguistic convention, not an ontological truth. It relates to the doubt by acknowledging that while we *need* distinctions to articulate experience (e.g., to say “I am Zhou”), this need does not imply those distinctions reflect immutable realities.  

  **(c) Evidential Symmetry and the Failure of Tests**  
  Nothing available to Zhuang Zhou could settle his doubt because the hypotheses—being Zhou or being a butterfly—are evidentially symmetrical. First, the *phenomenology* of the waking state is identical regardless of which subject anchors reality: as Zhou, he experiences the same sensations, memories, and sense of self in both scenarios. Second, any *test* he performs (e.g., pinching himself to “prove” he is awake) is circular. If he is Zhou, the test confirms his waking reality; if he is a butterfly dreaming, the test occurs within the dream and “confirms” a false waking state. Crucially, “waking up” cannot break symmetry because it is merely another *transformation*—a shift from one experiential frame to another—not an escape to a privileged perspective. Each “awakening” (e.g., from butterfly to Zhou) feels like a return to reality, but this feeling is intrinsic to the new frame and does not validate it as objectively foundational. Thus, all evidence is internal to the frame and cannot adjudicate between competing anchoring subjects.  

  **(d) Indubitable Residue: Transformation Without Self-Undermining**  
  Descartes secures an indubitable residue (the *cogito*) by identifying thinking as the constant amidst doubt. Zhuangzi’s analogue is *transformation*. Unlike Descartes’s *cogito*, which is a stable *subject*, transformation is the *process* of perspectival change. It avoids doubt because it is the precondition for subject-doubt: even when Zhuang Zhou questions which perspective he occupies, he cannot doubt that *perspectives transform*. The worry that the closing claim (“this is called the Transformation of Things”) might be asserted from within a frame and thus self-undermining fails because transformation is not a *claim about reality* but the *condition of experience*. If Zhuangzi asserts it from a dream, the dream is still a transformation; if from waking, the same holds. Transformation is indubitable not as a proposition but as an inescapable structure: to doubt is to occupy a perspective, and to occupy a perspective is to be in transformation. It is the residue because it persists when specific identities (Zhou/butterfly) are doubted, functioning as the “groundless ground” of scepticism itself.  

  **Conclusion**  
  Zhuangzi’s doubt targets the subject, not the frame or kind, rendering Descartes-style comparisons misleading. The closing remark embraces linguistic distinction within ontological fluidity, evidential symmetry precludes resolution, and transformation stands indubitable as the engine of perspectival change. This positions Zhuangzi not as a mystic or relativist but as a radical sceptic who dissolves the self into ceaseless transformation.  

  ---

  ### 3. Marking Scheme (Total: 25 marks)  
  **Must-hit moves with marks and grade boundaries:**  

  | **Move** | **Marks** | **A (21–25)** | **B (16–20)** | **C (11–15)** | **D/F (0–10)** |
  |----------|-----------|---------------|---------------|---------------|----------------|
  | **(a) Locates doubt and critiques Descartes** | 7 | Correctly identifies subject-doubt (5–7). Nuanced explanation of why Descartes (frame-doubt) mislocates it. | Identifies subject-doubt but weak/muddled contrast with Descartes (3–4). Or conflates with kind-doubt (max 4). | Misidentifies as frame-doubt (e.g., “same as Descartes”) or kind-doubt (2–3). Superficial/no critique (1–2). | Wrong type (e.g., “not doubt at all”). Ignores distinction (0). |
  | **(b) Interprets closing remark** | 6 | “Must” as conventional (naming), not fixed natures (4–6). Distinction *within* transformation, not concession of fact. | “Must” as conventional but vague on transformation (3–4). Or conflates with fixed distinction (max 3). | Takes “must” as metaphysical (1–2). Ignores transformation or relation to doubt. | Dismisses remark as irrelevant/contradictory (0–1). |
  | **(c) Explains evidential symmetry** | 6 | Full symmetry: same phenomenology + tests/frame-relativity (5–6). “Waking up” as transformation. | Identifies symmetry but gaps in tests/frame-relativity (3–4). Misses “waking up” nuance. | Partial symmetry (e.g., phenomenology only) (1–2). Suggests tests resolve doubt. | No symmetry (e.g., “memory proves identity”). (0–1). |
  | **(d) Residue and self-undermining** | 6 | Transformation as residue (3–4). Handles self-undermining: it’s condition, not claim (2–3). | Names residue but weak on why indubitable (3–4). Superficial on self-undermining (1–2). | No residue or wrong (e.g., “doubt itself”). Ignores self-undermining. | Denies residue or self-refutes (e.g., “Zhuangzi inconsistent”). (0–1). |
  | **Structure/Clarity** | – | Coherent, all parts addressed. No jargon. Concise (A). | Minor gaps/repetition. Some clarity issues (B). | Disjointed, omits parts. Unclear (C). | Incoherent/off-topic (D/F). |

  **Grade Boundaries**:  
  - **A (21–25)**: Hits all moves with precision, no errors. Avoids stock answers.  
  - **B (16–20)**: Hits moves but uneven (e.g., strong on (a) weak on (d)). Minor stock tropes (e.g., “similar to Descartes” briefly).  
  - **C (11–15)**: Superficial on ≥2 moves. Relies on stock answers.  
  - **D (6–10)**: Misses ≥2 moves. Stock answers dominate.  
  - **F (0–5)**: Irrelevant or wholly stock-based.  

  ---

  ### 4. Common Mistakes (One Line per Move)  
  - **(a) Location & Descartes**: Stock error: “Same as Descartes’s dream argument” (frame-doubt). Penalise: Max C if uncorrected.  
  - **(b) Closing Remark**: Stock error: “Zhuangzi concedes fixed identities” or “mystical unity.” Penalise: C if not tied to transformation.  
  - **(c) Evidential Symmetry**: Stock error: “Waking up breaks doubt like Descartes” or “relativism means no truth.” Penalise: C if symmetry unaddressed.  
  - **(d) Residue**: Stock error: “No residue (not real scepticism)” or “transformation is just belief.” Penalise: C if residue ignored/contradicted.  
  - **Overall Stock Answers** (automatic C or lower):  
    - “Zhuangzi is a mystic, so doubt is resolved by enlightenment.”  
    - “Relativist: no truth, so doubt is pointless.”  
    - “Not scepticism; it’s about acceptance.”  
    - “Exotic version of the Dream Argument.”
