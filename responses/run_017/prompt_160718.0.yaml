  So the Beauty has a higher average score than the lab assistant? But note: the lab assistant is paid every round (16 rounds) and the Beauty is paid only when awake (about 24 times in 16 rounds). So we cannot compare total tokens. We must compare per payment opportunity.

  But the point is: the lab assistant has a different credence (0.5) and the awake Beauty has 1/3. And they are both correct in their reporting given their information.

  ### Timeline for 90 Minutes

  **0-10 minutes: Introduction and Stage 1 Rules**
  - Explain the Sleeping Beauty problem and that they will simulate it.
  - Explain the rules for Stage 1: 
     - Each round, coin flip -> heads: 1 awake, tails: 2 awake.
     - Slips are distributed randomly: "awake" or "asleep".
     - Everyone writes a guess (H or T) and a credence (number between 0 and 1). 
     - But only the awake students' guesses are paid (flat token: 1 if correct, 0 otherwise). The credence will be used later for discussion.
     - Asleep students write decoy.
     - Emphasize: no talking, no revealing.
  - Designate a lab assistant (one student) and explain their role: 
     - They are always awake and are told it is Monday. 
     - They write a credence (number) every round (and we will pay them later with a scoring rule).

  **10-30 minutes: Run Stage 1 (16 rounds)**
  - Flip coin (private).
  - Prepare 16 slips: 
     - Heads: 1 awake, 15 asleep.
     - Tails: 2 awake, 14 asleep.
     - Also prepare a slip for the lab assistant: "You are the lab assistant. Today is Monday. Write your credence for heads and seal it."
  - Distribute randomly to the 16 students and the lab assistant gets their slip.
  - All write and seal.
  - Collect.
  - Repeat for 16 rounds.

  **30-40 minutes: Tally Stage 1**
  - Reveal the coin flips for each round.
  - For each round, open the awake students' slips (and the lab assistant's, but set aside for now).
  - For the awake students: if their H/T guess is correct, give them 1 token.
  - Tally:
     - Total number of heads rounds and tails rounds (should be about 8 each).
     - Total awakenings: heads rounds: 8, tails rounds: 16 -> 24.
     - Total tokens earned by the class (for flat guesses): we expect around 8 if everyone guessed heads, 16 if tails. But we'll see the actual.
     - Also, count the number of times the coin was heads when a student was awake: 8 out of 24 (about 1/3).
     - Show the distribution of guesses: how many guessed heads in heads rounds, tails in tails rounds, etc.

  **40-45 minutes: Introduce Stage 2**
  - Now, we change the rules: 
     - Only the "first awakening" in each round is paid.
     - In heads rounds: the one awake is the first (and paid).
     - In tails rounds: there are two awake, but one is randomly chosen as "first" (paid) and the other is "second" (awake but not paid).
  - We will run 8 rounds.
  - Payment: we will pay the credence (with quadratic scoring rule) for the paid student (the first awakening).

  **45-60 minutes: Run Stage 2 (8 rounds)**
  - Flip coin.
  - Prepare slips:
     - Heads: 1 "first awakening" (paid), 15 asleep.
     - Tails: 1 "first awakening" (paid), 1 "second awakening" (awake but not paid), 14 asleep.
  - Distribute randomly.
  - The paid student writes a credence (number). The others write decoy guesses (and the second awakening also writes a credence? But we won't pay it. We can have them write a decoy number to maintain blind? Or we can have them write normally and we just ignore. But to maintain blind, they should write a number and seal it, but we won't score the second awakening.
  - Collect.
  - The lab assistant continues: every round they write their credence (as before).

  **60-65 minutes: Tally Stage 2**
  - Reveal the coin flips.
  - For each round, open the paid student's slip (the first awakening) and compute their quadratic score.
     - Quadratic score: if they reported p and the coin is heads: 10*(1 - (1-p)^2)
     - If tails: 10*(1 - p^2)
     - We do this for the 8 paid students.
  - Also, note: out of the 8 paid students, how many were from heads? (expected 4) and tails (4).
  - So the best strategy is to report 0.5.

  **65-80 minutes: Debrief and Stage 3**
  - Now we open the discussion.
  - First, show the lab assistant's results. For each round, the lab assistant reported a number (hopefully around 0.5). Compute their quadratic score (average should be around 0.75 per round).
  - Compare to the Beauty (the students in the first stage): their average credence was around 1/3 and they earned more tokens in the flat payment? But note the lab assistant is paid every round and the Beauty only when awake.
  - Key question: Why do the awake students (in stage 1) and the lab assistant have different credences? 
     - The lab assistant knows it is Monday. The awake students (in stage 1) do not know whether it is Monday or Tuesday (in the tails rounds) — but in our simulation, they don't even know that there are two days? We have to explain the mapping.
  - Map the simulation to the original problem:
     - Each round = one coin flip and one or two awakenings.
     - The awake student in a heads round = Beauty on heads (Monday).
     - The two awake students in a tails round = Beauty on Monday and Tuesday.
     - The amnesia is simulated by not knowing what round it is and by random selection.

  But the objection: In the original problem, Beauty is awake in every round (either one or two days). In our simulation, a student might be awake in multiple rounds? But that's okay because the rounds are independent.

  The key difference: in the original problem, Beauty knows she will be awakened at least once. In our simulation, a student might not be selected at all in a round (asleep). But in the original, Beauty is always awake. So the fact that she is awake is not news.

  In our simulation, when a student is awake, it is news because they might have been asleep. How to address?

  We can run a variant: we guarantee that every student is awake in every round? But then we cannot have one awake for heads and two for tails. We have 16 students. We would have to have 16 Beauty's? That's what we are doing: we are using multiple Beauties to simulate the frequencies.

  Alternatively, we can reframe: each student represents a possible awakening in the problem. In a heads round, there is one awakening; in tails, two. And we randomly select which student is which awakening.

  But then when a student is selected, they don't know if they are the only one or one of two. That's the ignorance.

  But the objection is that in the original, Beauty knows she will be awake at least once. In our setup, a student does not know if they will be awake in a given round. So being awake is informative.

  To remove that, we can change the setup: we don't put any asleep slips. Instead, we have:

  - Heads: 16 slips, one says "awake" and 15 say "awake but this is a decoy?" — but that doesn't work.

  Alternatively, we can have every student be awake every round, but only some are considered "real" for that round? That might be confusing.

  We can explain: "Consider that in the original problem, there are multiple parallel universes, and in each universe, Beauty is awakened. We are simulating by having multiple Beauties, and in each round, we are randomly assigning which Beauty is in which universe."

  But that might be too abstract.

  Alternatively, we can have a single student play Beauty for the whole class? But then we lose the sampling.

  Given time, we may not be able to resolve this objection perfectly. We can raise it in the debrief.

  **Debrief Points:**
  1. In stage 1, we observed that 2/3 of the awakenings occurred on tails rounds. Hence, betting on tails yields twice as many tokens as heads.
  2. The optimal credence for the quadratic scoring rule was 1/3.
  3. In stage 2, when we paid only the first awakening, we found that half of the paid awakenings were on heads and half on tails, leading to a credence of 1/2.
  4. The lab assistant, who knows it is Monday (the first day), assigns 1/2 and is correct for their information.
  5. Objection: In the simulation, being awake is informative because you might have been asleep. In the original, Beauty is always awake. Does that break the analogy?
     - Response: We are using the frequency of awakenings to represent the probability. In the long run, if we run the experiment many times, the proportion of tails awakenings is 2/3. Beauty, upon awakening, should align her credence with these frequencies. She doesn't have the option of not being awake, but the relative frequencies of the two states (heads-awakening vs tails-awakening) are still 1:2.

  ### What Can Go Wrong
  1. **Inference from noise or movement:** Students might infer how many are awake by watching who is writing. We mitigate by having everyone write and seal.
  2. **Small sample size:** 16 rounds might not be enough. We chose 16 to get 24 awakenings. We can run more if time allows? But 90 minutes might be tight. We can run 12 rounds for stage 1 (expected 18 awakenings) and 6 for stage 2 (expected 6 paid).
  3. **Tokens doing the work, not credence:** Students might say the tokens are driving the answer, but credence is about belief. We can explain that the scoring rule is designed to force you to report your true credence.
  4. **Sampling vs amnesia objection:** It might surface early. If it does, acknowledge it and say we will discuss at the end. Record it on the board.
  5. **Lab assistant role:** The student might not understand and report incorrectly. We can have a trial round.
  6. **Time management:** 90 minutes is tight. We might not finish all stages. Prioritize stage 1 and the tally.

  ### What the Activity Cannot Reproduce
  - Genuine self-locating ignorance: In the simulation, students know they are in a classroom and that they are playing a game. They don't experience the amnesia. We are using random sampling to simulate the uncertainty. You will have to explain that in the original problem, the amnesia makes Beauty lose track of time, and our random selection is a proxy for that.
  - In the last 10 minutes, you can explain that the activity shows the frequency argument for the thirder position, but the halfer position might still be defended on other grounds. You can then present both arguments again and let them discuss.

  ### Minute-by-Minute Timeline (90 Minutes)

  - **0-5 min:** Introduce the activity and the Sleeping Beauty problem. Explain that they will simulate it to see what the data says.
  - **5-10 min:** Explain the rules for Stage 1 and the lab assistant role. Distribute materials.
  - **10-30 min:** Run 16 rounds of Stage 1. (Each round: flip, prepare slips, distribute, write, collect — about 1.25 minutes per round? 16*1.25=20 minutes. This is tight. Alternatively, run 12 rounds in 15 minutes.)
     - Adjust to 12 rounds: 12*1.25 = 15 minutes.
  - **30-40 min:** Tally Stage 1: reveal flips, score the flat tokens, show the proportion of tails awakenings (expected 2/3), and total tokens. Point out that betting on tails pays more.
  - **40-45 min:** Explain Stage 2 rules.
  - **45-55 min:** Run 8 rounds of Stage 2. (8 rounds * 1.25 = 10 minutes)
  - **55-60 min:** Tally Stage 2: show that half of the paid awakenings were heads, half tails. Compute quadratic scores for the paid students and note that reporting 0.5 is best.
  - **60-65 min:** Present the lab assistant's results: show they reported 0.5 and earned a steady score.
  - **65-80 min:** Debrief:
     - Map the stages to the original problem: Stage 1 is the standard awakening; Stage 2 is when Beauty is told it is Monday.
     - Discuss the lab assistant: they know it's Monday, so they assign 1/2.
     - Why do the awake students in Stage 1 assign 1/3? Because they don't know if it's the first or second awakening.
     - Objection: in the simulation, being awake is informative. Discuss.
  - **80-90 min:** Conclusion: The activity supports the thirder position. But note that the halfer might object to the sampling model. Present the philosophical arguments briefly.

  ### Final Notes
  - The activity cannot perfectly replicate the amnesia, but it shows the frequency argument.
  - The lab assistant role is crucial to show that additional information changes the credence.
  - Be prepared for objections and allocate time for discussion.
  - If the sampling objection arises early, note it and promise to discuss at the end.

  This plan is ambitious for 90 minutes. Be ready to cut rounds if time runs short.
answer: |-
  Below is a complete design for your 90-minute seminar, structured to achieve your objectives while addressing potential pitfalls. The activity uses a sampling-based mechanism to simulate Sleeping Beauty's amnesia, with three stages that progressively unpack the disagreement. Rules, materials, timeline, payoff arithmetic, debrief points, and anticipated issues are detailed.

  ---

  ### **Rules and Materials**
  **Materials per Round:**
  - 1 coin (for instructor's private flip)
  - 16 sealed slips per round (prepared by instructor)
    - *Heads round:* 1 slip says "AWAKE", 15 say "ASLEEP"
    - *Tails round:* 2 slips say "AWAKE", 14 say "ASLEEP"  
      (For Stage 2, tails rounds: 1 slip says "AWAKE (FIRST)", 1 says "AWAKE (SECOND)", 14 say "ASLEEP")
  - Tokens (e.g., poker chips) for payoffs
  - Student worksheets to record guesses/credences (discarded for sleepers to maintain blindness)
  - A jar for submitting sealed guesses

  **Rules:**
  1. **Blind Protocol:**  
     - Students open slips simultaneously and write guesses privately.  
     - All students write a guess/credence (sleepers write decoys to prevent inference from noise).  
     - Awake students seal and submit guesses; sleepers discard theirs after writing.  
     - No speaking, sharing slips, or revealing awake status until scoring.  
     - **Lab Assistant Role:** One student (rotating or fixed) is always "awake," knows the day (e.g., "Today is Monday"), and submits guesses without amnesia.  

  2. **Payoff Schemes:**  
     - **Stage 1 (Flat Token):** Correct guess (H/T) earns 1 token.  
     - **Stages 1–2 (Scoring Rule):** Quadratic scoring for credence reports. If a student reports credence *p* for heads:  
       - Actual heads: Payoff = `10 × [1 − (1 − p)²]` tokens  
       - Actual tails: Payoff = `10 × [1 − p²]` tokens  
       *(Optimizes at true credence; max 10 tokens if certain and correct)*  
     - **Lab Assistant:** Paid via scoring rule only (no flat token).  

  3. **Stages:**  
     - **Stage 1:** Original game (no day information).  
     - **Stage 2:** Only "first awakenings" scored (simulates learning "it’s Monday").  
     - **Stage 3:** Lab assistant results revealed + debrief on objections.  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Setup and Rules**  
  - Explain the activity: "We're simulating Sleeping Beauty with sampling. Each round, a coin flip determines how many are 'awake.' Your goal: guess if the coin was heads."  
  - Review rules (blind protocol, slips, payoffs). Assign lab assistant role.  
  - Emphasize: "Record credence (0–1) *and* a H/T guess. Sleepers write decoys to maintain blindness."  

  **10–35 min: Stage 1 (12 Rounds)**  
  - **Each round (2 min/round):**  
    1. Privately flip coin. Prepare 16 slips (1 awake/15 asleep if heads; 2 awake/14 asleep if tails).  
    2. Randomly distribute slips.  
    3. Students open slips, write guesses/credences, seal submissions (awake) or discard (sleepers).  
    4. Collect submissions.  
  - **After 12 rounds (5 min):**  
    - Tally results: Reveal coin flips. Pay tokens for correct H/T guesses (flat) *and* scoring rule (credence).  
    - Display aggregate:  
      - % of awakenings on tails rounds (expect ≈66.7%).  
      - Average tokens for "always heads" vs. "always tails" strategies.  

  **35–45 min: Stage 2 (6 Rounds)**  
  - Modify rules: "In tails rounds, only the 'first awakening' is scored. If you see 'AWAKE (FIRST)', you’re scored; 'AWAKE (SECOND)' is a decoy."  
  - Run 6 rounds (as above, with modified slips for tails).  
  - **Tally (5 min):**  
    - Score only "first awakenings" (via scoring rule).  
    - Show: % of scored "first awakenings" that were heads (expect ≈50%).  

  **45–60 min: Lab Assistant and Interim Discussion**  
  - Reveal lab assistant’s credences (should cluster near 0.5).  
  - **Prompt:** "Compare the lab assistant’s 0.5 to your Stage 1 credences. Why might they differ?"  
  - *Do not resolve objections yet.* Record student theories on board.  

  **60–75 min: Stage 3 – Full Debrief**  
  - **Map game to original problem:**  
    | **Game Element** | **Sleeping Beauty Analogy** |  
    |------------------|------------------------------|  
    | Slip says "AWAKE" | Beauty learns she is awake |  
    | % tails awakenings (66.7%) | P(tails | awake) = 2/3 |  
    | "AWAKE (FIRST)" | Beauty learns "it’s Monday" |  
    | Lab assistant | Observer who knows the day |  
  - **Arithmetic Recap:**  
    - **Stage 1 (awake, no day info):**  
      - P(heads | awake) = P(awake | heads) × P(heads) / P(awake) = (1/16 × 1/2) / [(1/16 × 1/2) + (2/16 × 1/2)] = **1/3**  
      - *Flat token:* Guessing tails earns 2× tokens/round (expected 0.67/round vs. 0.33/round for heads).  
      - *Scoring rule:* Optimal credence = 1/3 (expected payoff: 7.78 tokens/round vs. 7.5 for 0.5).  
    - **Stage 2 ("first awakening"):**  
      - P(heads | first) = P(first | heads) × P(heads) / P(first) = (1 × 1/2) / [(1 × 1/2) + (1 × 1/2)] = **1/2**  
      - Thirder prediction: P(heads) shifts from 1/3 → 1/2 with new info.  
      - Halfer prediction: P(heads) remains 1/2 throughout.  
    - **Lab Assistant (knows day):**  
      - Always P(heads) = 1/2 (no new info from awakening).  

  **75–85 min: Confronting Objections**  
  - **Sampling vs. Amnesia Objection:** "In the game, being awake is *news* (you might have been asleep). But Beauty *knows* she’ll be awake. Does this break the analogy?"  
    - **Student-led path:** Ask: "Did anyone avoid betting tails in Stage 1 because they felt being awake wasn’t 'news'? How did the tokens affect your choice?"  
    - **If raised early (e.g., Stage 1):** "Hold that thought—we’ll revisit in Stage 3."  
    - **Resolution:** Acknowledge the distinction but note: The game isolates the *informational value* of awakening. Beauty’s certainty of being awake doesn’t change the relative frequencies of H/T awakenings (2:1), which govern rational betting.  
  - **Other Predictable Disputes:**  
    - "Tokens force behavior, not belief": Point to credence reports. Students who wrote 0.5 but bet tails reveal belief-behavior gaps.  
    - "Small-sample noise": 12 rounds give 18 awakenings (6H, 12T)—noise is <±10%. Use exact probabilities if needed.  

  **85–90 min: Conclusion**  
  - **Key Insight:** "Awakening" provides evidence (tails more likely). "It’s Monday" *removes* evidence (backs to 50:50).  
  - **What the Game Can’t Simulate:** Genuine self-locating uncertainty ("What day is it?").  
    - **How to supply it:** "In the story, Beauty’s amnesia makes her ignorance real. Our game approximates this with sampling, but the tokens reveal what you *should* believe given the information. The disagreement is about whether awakening *is* new evidence."  
  - End with: "Halfers see no new evidence; thirders see evidence for tails. Both agree on Stage 2."  

  ---

  ### **Expected Payoff Arithmetic**  
  **Stage 1 (Per Awakening):**  
  - **Always guess heads (flat token):**  
    Correct 1/3 of the time → 0.33 tokens/awakening.  
  - **Always guess tails (flat token):**  
    Correct 2/3 of the time → 0.67 tokens/awakening.  
  - **Scoring rule (credence *p*):**  
    Expected payoff = `(1/3) × [1 − (1−p)²] + (2/3) × [1 − p²]`  
    Maximized at *p* = 1/3 → 7.78 tokens/awakening (vs. 7.5 for *p* = 0.5).  

  **Stage 2 (Per "First Awakening"):**  
  - **Credence *p* (scoring rule):**  
    Expected payoff = `(1/2) × [1 − (1−p)²] + (1/2) × [1 − p²]`  
    Maximized at *p* = 0.5 → 7.5 tokens/scored awakening.  

  **Lab Assistant (Per Round):**  
  - **Credence *p* (scoring rule):**  
    Expected payoff = `(1/2) × [1 − (1−p)²] + (1/2) × [1 − p²]`  
    Maximized at *p* = 0.5 → 7.5 tokens/round.  

  ---

  ### **Predictable Issues and Mitigations**  
  1. **Noise from small samples:**  
     - 12 rounds (≈18 awakenings) suffices: P(observed %tails < 55%) ≈ 0.1.  
     - **Fix:** Use exact probabilities if results are noisy.  

  2. **Students infer awake count:**  
     - From rustling papers: Mandate synchronized writing.  
     - From "who submitted?": Use a silent submission jar.  

  3. **Belief vs. tokens dispute:**  
     - **Mitigation:** Highlight students who wrote *p* = 0.5 but bet tails. Ask: "Did tokens change your mind or reveal hidden beliefs?"  

  4. **Sampling objection derails early:**  
     - **Mitigation:** Postpone to Stage 3; record it as "Objection #1" on the board.  

  5. **Lab assistant confusion:**  
     - **Mitigation:** Assign role to a detail-oriented student; clarify: "You know today is Monday and the rules, but not the coin flip."  

  6. **Time crunch:**  
     - **Mitigation:** Trim to 8 Stage 1 rounds (≈12 awakenings) + 4 Stage 2 rounds.  

  ---

  ### **What the Game Cannot Reproduce**  
  - **Genuine self-locating ignorance:**  
    Students experience sampling, not amnesia. The game quantifies evidence but cannot simulate Beauty’s temporal disorientation.  
    - **How to supply it:** In the final debrief, say: "Beauty’s amnesia makes her uncertainty visceral. Our game shows why her *rational* credence is 1/3, but the halfer intuition persists because we instinctively reject awakening as evidence. That’s the heart of the puzzle—and why it’s still debated."  
    - **Avoid verdicts:** Frame as, "The tokens don’t tell you what to *feel*; they tell you what you *should do* given the information."  

  This design forces students to confront the evidence-versus-intuition gap empirically, using stakes to make the disagreement tangible. By staging revelations (first awakenings, lab assistant), it unpacks the thirder/halfer split without lecturing.
