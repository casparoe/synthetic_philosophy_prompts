  ### Decision Tree: Virtual Objects and Harms  
  *Answer each question based on intuitive reactions to the cases. Proceed down the branches until you reach a leaf (position).*

  1. **After a permanent server shutdown, the data sits unread on a drive. Do the virtual objects (e.g., a player’s house) still exist?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Fans re-host the *same* world years later with different players. Is this the original world?**  
     - **Yes** → Go to 4  
     - **No** → **Leaf A: Data Essentialism**  
       *Most awkward commitment:* A virtual cathedral exists only as a dormant pattern on a drive, even if no one will ever see it.  
       *Cathedral compensation:* No—deletion merely alters data; compensation is symbolic (e.g., apology).  

  3. **A player’s house isn’t visited or rendered for months but persists after a reboot. Does it exist while unrendered?**  
     - **Yes** → Go to 5  
     - **No** → **Leaf B: Operationalism**  
       *Most awkward commitment:* Virtual objects blink out of existence when unobserved, like a light turned off.  
       *Cathedral compensation:* No—deletion ends its existence; no lasting loss.  

  4. **A player-built cathedral (4,000 hours) is deleted by an admin. Is this a genuine loss?**  
     - **Yes** → Go to 6  
     - **No** → **Leaf C: Data Nominalism**  
       *Most awkward commitment:* A cathedral is just rearranged code; no more meaningful than deleting a text file.  
       *Cathedral compensation:* No—players assume deletion risks; no obligation.  

  5. **A unique earned item is lost in a rollback. Is this loss comparable to the cathedral’s deletion?**  
     - **Yes** → **Leaf D: Strong Realism**  
       *Most awkward commitment:* A sword duplicated 5,000 times is 5,000 distinct real objects.  
       *Cathedral compensation:* Yes—restore it or grant equivalent creative control.  
     - **No** → Go to 7  

  6. **An avatar suffers simulated violence, causing lasting player distress. Is this harm real?**  
     - **Yes** → **Leaf E: Moral Realism**  
       *Most awkward commitment:* Hurting an NPC that acts frightened is wrong *even if* it feels nothing.  
       *Cathedral compensation:* Yes—compensate time/effort (e.g., in-game resources).  
     - **No** → **Leaf F: Social Instrumentalism**  
       *Most awkward commitment:* Server shutdown is like burning an empty notebook—no one is harmed.  
       *Cathedral compensation:* Only if it breaches community norms (e.g., restore for PR).  

  7. **The same item lost in a rollback was bought for $200. Does paying money make the loss more real?**  
     - **Yes** → **Leaf G: Commercialism**  
       *Most awkward commitment:* A $200 sword is "real" property; an identical earned one is fiction.  
       *Cathedral compensation:* Only if real money was spent; else, no.  
     - **No** → **Leaf H: Labor Theory (Virtual)**  
       *Most awkward commitment:* A text-MUD’s “cathedral” is as real as a 3D one if effort is equal.  
       *Cathedral compensation:* Yes—compensate labor hours (e.g., subscription credit).  

  ---

  ### Unoccupied Positions & Overlaps  
  - **Leaf A + "No" to cathedral loss (Q4):** *Unattractive*—Data exists but has no value, making preservation pointless.  
  - **Leaf B + "Yes" to unrendered house (Q3):** *Incoherent*—Objects can’t exist unobserved yet persist unrendered.  
  - **Leaf C + "Yes" to NPC harm (Q6):** *Unexplored*—Code isn’t real, but its effects morally matter.  
  - **Leaf G/H overlap:** Both treat labor/money as value sources. *Split with NPC case*:  
    - *New case: An NPC "dies" after a player’s 100-hour quest. Is this a loss?*  
      - Labor Theory: Yes (effort invested).  
      - Commercialism: Only if NPC had cash value.  

  ---

  ### Quiz: "Where Do You Stand?"  
  1. After a server shutdown, data is on a drive. Does your avatar still exist?  
     - Yes → A  
     - No → B  
  2. Your house persists unvisited for months. Is it "there"?  
     - Yes → C  
     - No → D  
  3. Admins delete a cathedral you built (no backup). Is this a loss?  
     - Yes → E  
     - No → F  
  4. A rollback deletes an item you earned. Is this loss like the cathedral?  
     - Yes → G  
     - No → H  
  5. That lost item cost $200. Does paying make it "real"?  
     - Yes → I  
     - No → J  

  **Scoring Key:**  
  - **A+C+E+G+J:** Leaf H (Labor Theory)  
  - **A+C+E+H+I:** Leaf G (Commercialism)  
  - **A+D+F+any:** Leaf C (Data Nominalism)  
  - **B+C+E+G+any:** Leaf D (Strong Realism)  
  - **B+C+E+H+any:** Leaf E (Moral Realism)  
  - **B+D+F+any:** Leaf B (Operationalism)  
  - **A+C+F+any:** Leaf A (Data Essentialism)  
  - **B+C+F+any:** Leaf F (Social Instrumentalism)  

  *(Handout note: Tree fits 1 page; quiz + key on page 2.)*
