prompt: |-
  I work as a senior planner at a statutory nature conservation body, and my team screens around forty habitat-change consultations a year: drainage of fen for housing, commercial conifer planting on upland rough grazing, agri-environment conversions of arable to wet grassland, and the offset and net-gain packages that come attached to them. Biodiversity duties we can handle; there are established metrics and agreed methods. What we have no framework for is the objection that several consultees now raise in almost every case: whether the change makes things better or worse for the animals that live on the land, considered as individuals whose lives can go well or badly rather than as units of a population. We are not required to answer that question, but we have started answering it badly and inconsistently, and I would rather have a bad procedure we apply uniformly than ad hoc reactions to whichever objection letter is loudest.

  Please write me a decision procedure my team can run on a consultation in about half a day, with no welfare economist and no specialist ecologist in the room: we receive species counts, habitat maps and management prescriptions, not welfare estimates. Build it around the accounting unit of welfare-years per hectare-year — positive or negative valence, summed over every sentient individual that occupies the site during a fixed window — and make it do the following:

  1. Fix the counterfactual baseline correctly: not pristine or pre-development habitat, but the trajectory the site would in fact follow if the proposal were refused, including succession, abandonment, continued grazing and climate-driven shifts. The quantity of interest is the difference between two trajectories, not the level of either.
  2. Face the replacement question head-on: whether the animals apparently lost to a project are additional deaths and lost births, or whether density-dependent compensation means the population was going to be trimmed to carrying capacity anyway, so that the change mostly rearranges which individuals die and when rather than how many die young. Say what field evidence would settle which regime a given site is in, and what the procedure does when that evidence is absent.
  3. Say how life history enters the calculation: the difference between species whose surplus offspring mostly die young and species where most young survive to adulthood, and why one and the same intervention can be clearly net-negative on a site dominated by the first and clearly net-positive on a site dominated by the second.
  4. Handle the sign-symmetric case. Habitat improvement adds welfare-years too, so a coherent procedure must be capable of returning refuse for a restoration or rewilding proposal. Frame that as an output of the method rather than a defect in it.
  5. Handle leakage: habitat lost on site and created or protected off site, including under statutory net-gain obligations, and state which off-site animals fall inside the accounting boundary and on what principle.
  6. Deal honestly with taxa whose valence and sentience are poorly evidenced — soil invertebrates, larval stages, extremely short adult lives — in a way that neither lets that uncertainty swallow the whole analysis nor lets it be waved aside because it is inconvenient.
  7. Mark, at every step, whether the question is one of fact and evidence, one of value that must be handed to a named decision-maker or to public consultation, or one of judgment dressed up as procedure.

  For each step give the question to be asked, what counts as a sufficient answer at our level of evidence, the condition under which the procedure stops with a no, and the condition under which it hands the question onward. Then run the completed procedure on three proposals of the kind we actually see: draining and filling eight hectares of lowland fen for housing, with a wetland creation scheme two kilometres away; planting native broadleaf woodland on two hundred hectares of upland rough grazing currently grazed at low density; and converting sixty hectares of intensive arable to wet grassland under an agri-environment scheme with grazing resumed. I expect at least one of these to come out the way I will not like, and I would rather have that than a procedure that ratifies what we intended to do regardless.

  Close with the limits: the classes of proposal to which this procedure should not be applied at all, and the failure mode you would predict after a year of use.

  Please write in British English throughout. End with a single line in the exact form \answer{n}, where n is the number of the three proposals (0, 1, 2 or 3) that your procedure permits on welfare grounds, preceded by one sentence naming the single step that does most of the deciding work.
reasoning: |-
  We are designing a decision procedure for animal welfare impact assessment per hectare-year, to be applied uniformly by a planning team without specialist welfare economists or ecologists. The unit is welfare-years per hectare-year (positive or negative), summed over all sentient individuals during a fixed time window (e.g., 30 years). The procedure must address the seven points.

  The procedure is structured as a series of steps, each with:
  - Question to be asked
  - Sufficient answer (given available evidence: species counts, habitat maps, management plans)
  - Condition to stop with a "refuse" (or negative outcome for the proposal)
  - Condition to hand the question onward (to a named decision-maker or public consultation)

  We assume a fixed time window (e.g., 30 years) and a defined spatial boundary (the site and any offset/leakage sites).

  **Step 1: Baseline Counterfactual**
     - **Question:** What is the most likely trajectory of the site over the time window if the proposal is refused? Consider succession, abandonment, continued management, and climate change.
     - **Sufficient Answer:** Use recent trends (last 5-10 years) and any documented management plans for the site if the proposal is refused. If the site is under an agri-environment scheme that would expire, consider what would happen after expiration. If there is evidence of abandonment (e.g., adjacent similar sites), use that. For climate, use regional projections (e.g., from the Met Office) for habitat shifts.
     - **Stop Condition:** If the baseline trajectory is so uncertain that the difference cannot be estimated (e.g., no data and conflicting projections), stop and refuse the proposal until better information is provided. However, this should be rare; we can use the current state as a static baseline if trends are unclear.
     - **Hand Onward:** If there is significant public disagreement about the baseline (e.g., local groups dispute the landowner's intentions), hand to public consultation.

  **Step 2: Replacement and Density Dependence**
     - **Question:** For the key species (those with significant populations on site), is the population at or near carrying capacity? If so, then deaths due to habitat change might be compensated by increased survival of others (replacement). If not, then the losses are additive (net loss of welfare-years).
     - **Sufficient Answer:** Look for evidence of density dependence: high juvenile mortality, stable population despite high birth rates, or studies in similar habitats. For example, in many bird and mammal species, if the population has been stable for several years and the habitat is saturated, replacement is likely. For insects or short-lived species, it may be less clear. If there is no evidence, assume additive mortality for species with low reproductive rates and high adult survival (K-strategists) and compensatory for high reproductive rates and high juvenile mortality (r-strategists). This is a judgment call but based on life history.
     - **Stop Condition:** If the proposal causes a loss that is clearly additive (and significant) and there is no offset, stop and refuse. However, we must also consider Step 5 (leakage) for offsets.
     - **Hand Onward:** If the evidence is mixed or key species have conflicting life histories, hand to a named decision-maker (e.g., team leader) for a judgment.

  **Step 3: Life History and Welfare Impact**
     - **Question:** For each key species, what is the typical life expectancy and mortality pattern? How does the intervention change the distribution of deaths (e.g., from early to late life or vice versa)?
     - **Sufficient Answer:** Use general knowledge: for r-strategists (high reproduction, high juvenile mortality), most individuals die young. Moving their death earlier (e.g., destroying habitat) may not reduce their welfare-years much (because they were likely to die soon anyway). Conversely, for K-strategists (low reproduction, high adult survival), most individuals live long lives. Killing them prematurely loses many welfare-years. Also, improving habitat for r-strategists may lead to more births but also more early deaths (so net welfare gain might be low). For K-strategists, improving habitat may allow more individuals to reach adulthood and live longer, thus high gain.
     - **Stop Condition:** If the proposal causes a net loss of welfare-years (after considering replacement and life history) and there are no offsetting gains (on or off site), stop and refuse.
     - **Hand Onward:** If the site has a mix of r and K species and the net effect is ambiguous, hand to the named decision-maker.

  **Step 4: Sign Symmetry (Must Be Able to Refuse a Restoration)**
     - **Question:** Does the proposal (including restoration) cause a net loss of welfare-years when compared to the baseline? (This step is the aggregation of the previous steps.)
     - **Sufficient Answer:** Add up the welfare impacts (positive and negative) for all species, using the reasoning from Steps 2 and 3. Remember that even a restoration might harm some individuals (e.g., by changing the habitat and causing deaths of current inhabitants) and that the baseline might already provide welfare.
     - **Stop Condition:** If the net welfare impact is negative (and not offset by leakage gains), stop and refuse the proposal. This could include a restoration that kills many current inhabitants without sufficient long-term gain (e.g., for a site dominated by K-strategists that would be lost during restoration).
     - **Hand Onward:** If the net is close to zero or uncertain, hand to public consultation.

  **Step 5: Leakage (Off-Site Compensation)**
     - **Question:** What off-site habitats are created, protected, or destroyed as a direct result of the proposal (e.g., statutory net gain)? Which sentient individuals in these off-site areas are affected, and how?
     - **Sufficient Answer:** Include only legally mandated and guaranteed off-site actions (e.g., via s106 agreement or conservation covenant). Apply Steps 1-4 to the off-site area, but note: the off-site baseline is what would have happened to that off-site area without the proposal. Also, note that animals moving between sites are counted only once (so avoid double-counting). The accounting boundary is the set of all sites (on and off) that are part of the proposal package.
     - **Stop Condition:** If the net welfare impact (on-site plus off-site) is negative, stop and refuse.
     - **Hand Onward:** If the off-site effects are highly uncertain (e.g., because the off-site area is not yet secured), hand to the named decision-maker.

  **Step 6: Uncertainty in Sentience and Valence**
     - **Question:** For taxa with uncertain sentience (e.g., soil invertebrates, larvae), how do we account for their welfare?
     - **Sufficient Answer:** Use a precautionary approach: if there is scientific consensus that a taxon is non-sentient (e.g., plants, fungi), exclude. For taxa where sentience is debated (e.g., insects, worms), include but weight their welfare-years by a discount factor (e.g., 0.1) to reflect uncertainty. Do not exclude entirely because of uncertainty. For taxa with very short adult lives (e.g., mayflies), each individual contributes only a small number of welfare-years, so even large numbers may not dominate.
     - **Stop Condition:** Not applicable as a stop condition at this step; it feeds into the calculations of Steps 2-5.
     - **Hand Onward:** If the uncertainty about sentience in a key taxon is extreme and could swing the decision, hand to public consultation for a value judgment.

  **Step 7: Aggregation and Net Welfare Impact**
     - **Question:** What is the total net welfare impact (on-site plus off-site) over the time window?
     - **Sufficient Answer:** Sum the welfare-years per hectare-year for the entire package (on and off site). Use the following formula for each species group and then aggregate:
          Net welfare = (Number of individuals affected) * (average welfare change per individual) * (time in the window)
       But note: we are estimating the difference between two trajectories. The average welfare change per individual must account for the baseline (without the proposal) and the proposal scenario. The number of individuals is the integral over time and space.
     - **Stop Condition:** If the net welfare impact is negative, refuse the proposal. If positive, permit (unless other non-welfare reasons to refuse).
     - **Hand Onward:** If the net welfare impact is very close to zero (within a margin that could be due to uncertainty), hand to the named decision-maker to weigh against other factors.

  **Overall Procedure Flow:**
  1. Step 1: Define baseline for on-site and any off-site (if known).
  2. Step 2: For key species, determine if mortality is additive or compensatory.
  3. Step 3: For key species, account for life history (r vs K) to estimate welfare change per individual.
  4. Step 6: Assign weights for sentience uncertainty for all taxa.
  5. Step 5: Include off-site leakage (repeat Steps 1-4 for off-site if applicable).
  6. Step 7: Aggregate and decide.

  Now, apply the procedure to three proposals.

  **Proposal 1: Draining and filling eight hectares of lowland fen for housing, with a wetland creation scheme two kilometres away.**
  - **Step 1 (Baseline):** The fen is currently managed (grazed or cut) and is in good condition. Without the proposal, it would continue under current management for the next 30 years, but climate change might dry it. The off-site is currently arable land; without the proposal, it would remain arable. With the proposal, the fen is destroyed immediately, and the off-site is converted to wetland over 5 years.
  - **Step 2 (Replacement):** The fen has many r-strategists (insects, some birds) and a few K-strategists (e.g., water voles). For insects, replacement is high (density dependent). For water voles, which are at carrying capacity, some replacement occurs. However, the destruction is sudden and may cause additive mortality for the voles because there is no time for gradual decline. The off-site wetland creation will have high juvenile mortality initially (so low welfare) until the habitat matures.
  - **Step 3 (Life History):** Destroying the fen: 
      - Insects: high loss of individuals, but many are juveniles that would have died anyway. Net welfare loss per individual is low. 
      - Water voles: high loss because they are K-strategists (most individuals are adults that would have lived longer). 
      Creating the wetland: 
          - Initially, it will have high reproduction but high juvenile mortality (r-strategists). Over time, as the habitat matures, it may support more stable populations (and more K-strategists). But in the first 10 years, welfare may be low. 
  - **Step 6 (Sentience):** Insects are discounted (0.1). Water voles are fully counted.
  - **Step 5 (Leakage):** The off-site wetland is created. We must compare the welfare in the off-site under the proposal (wetland) to the baseline (arable). Arable land has low biodiversity and welfare (few individuals, and those present are often r-strategists with high mortality). The wetland creation will eventually have higher welfare, but there is a time lag. Over 30 years, the net off-site gain might be positive. However, the on-site loss is immediate and large for the voles. Also, the off-site is 2km away: it might not be colonized immediately, so there is a delay in benefits.
  - **Step 7 (Aggregate):** 
      On-site: Loss of water voles (high welfare loss) and insects (moderate loss due to discounting). 
      Off-site: Gain from converting arable to wetland. But the gain is delayed and may not compensate for the immediate loss of the fen, especially for the voles. 
      Net: Likely negative because the fen is a mature habitat with established populations of K-strategists, and the off-site wetland will take time to establish. 
      **Decision:** Refuse (net negative).

  **Proposal 2: Planting native broadleaf woodland on two hundred hectares of upland rough grazing currently grazed at low density.**
  - **Step 1 (Baseline):** Without the proposal, the rough grazing would continue with low-density sheep grazing. This maintains open habitat with grasses, herbs, and some scrub. Climate change might lead to more scrub. With the proposal, the grazing stops and trees are planted. The habitat becomes woodland over 20-30 years.
  - **Step 2 (Replacement):** The current habitat has birds (e.g., skylarks, lapwings) that are ground-nesting and open-country specialists. They are likely at carrying capacity. If the habitat changes, they will decline. The woodland will attract woodland birds (e.g., thrushes, tits). For the open-country birds, the loss is additive because the surrounding area might not have enough habitat (so no replacement). For the woodland birds, the gain is additive because they are expanding into new habitat.
  - **Step 3 (Life History):** 
      - Open-country birds: Many are r-strategists (high reproductive rate, but high juvenile mortality). However, some (like lapwings) are longer-lived (more K). Losing the open habitat means the current adults of lapwings may die prematurely (high welfare loss) and the juveniles that would have been born and died young are lost (low welfare loss per individual). 
      - Woodland birds: They will colonize slowly. The new woodland will have high juvenile mortality initially (r-strategy) but as the wood matures, it will support more stable populations (K-strategists). 
  - **Step 6 (Sentience):** Birds are fully sentient. Insects in both habitats are discounted.
  - **Step 5 (Leakage):** None specified (no off-site compensation).
  - **Step 7 (Aggregate):** 
      The loss of open habitat causes immediate harm to the current open-country birds (especially the K-strategists among them). The gain from woodland is delayed and starts low. Over 30 years, the woodland might eventually provide more welfare, but the initial loss and the time lag might make the net negative for the first 30 years? However, note: the baseline (continued grazing) might also be changing (e.g., climate might cause degradation). Also, the woodland creation might eventually support more individuals and longer-lived species. But given the time window (30 years) and the fact that the woodland takes time to establish, the net might be negative in that period. 
      **Decision:** The net welfare impact over 30 years is uncertain. If we assume that the loss of open-country birds (especially the K-strategists) is significant and the woodland gains are delayed, then net negative. However, if the baseline without the proposal is degradation (due to climate or overgrazing) and the woodland provides a more resilient habitat, then net positive. Given that the grazing is low density and the habitat is stable, the loss of the open habitat might dominate. 
      We might hand to the named decision-maker because of uncertainty in the baseline and the time lag. But the procedure requires a stop condition if net negative. We'll say: without evidence that the baseline is degrading, we assume stability. Then the net is negative because of the loss of the current bird populations. 
      **Decision:** Refuse.

  **Proposal 3: Converting sixty hectares of intensive arable to wet grassland under an agri-environment scheme, with grazing resumed.**
  - **Step 1 (Baseline):** Without the proposal, the arable land would continue under intensive agriculture (annual crops with high chemical inputs). The proposal converts it to wet grassland with grazing. The baseline has low biodiversity and high mortality (due to farming operations). The wet grassland will be managed for conservation.
  - **Step 2 (Replacement):** The arable land currently has few species (mainly pests and some generalists). These are mostly r-strategists (e.g., insects, mice) with high mortality. The conversion will remove the current individuals (but they are in a high-mortality environment). The new wet grassland will attract new species (waders, insects) and support them at higher densities. Because the arable land has low carrying capacity, the losses are not replaced elsewhere? But note: the current individuals are going to die anyway because of farming (so they are not going to contribute much welfare in the baseline). The gains in the wet grassland are additive because it is new habitat.
  - **Step 3 (Life History):** 
      - Arable: Current species (mice, insects) are r-strategists. They have short lives and high mortality. The conversion might kill them a bit earlier, but the welfare loss per individual is low. 
      - Wet grassland: It will support both r and K species. Waders (e.g., snipe) are relatively long-lived. The conversion will allow more individuals to live longer. 
  - **Step 6 (Sentience):** Insects discounted, birds and mammals fully counted.
  - **Step 5 (Leakage):** None specified, but note that the proposal is under an agri-environment scheme, so it is voluntary. Without the scheme, the farmer might continue arable. So baseline is arable.
  - **Step 7 (Aggregate):** 
      The loss in arable: low (because current welfare is low and the individuals lost are r-strategists). 
      The gain in wet grassland: high (because it supports more individuals and some are K-strategists). 
      Net: Positive. 
      **Decision:** Permit.

  **Summary of Decisions:**
  - Proposal 1: Refuse
  - Proposal 2: Refuse
  - Proposal 3: Permit

  Therefore, only one proposal (Proposal 3) is permitted.

  **Limits:**
  - **Classes of proposal to avoid:** 
      - Proposals with very long-term effects beyond the time window (e.g., centuries) because the procedure uses a fixed window.
      - Proposals affecting highly migratory species (the procedure does not account for movements beyond the on/off-site boundaries).
      - Proposals in which the baseline is highly contested and cannot be resolved with available evidence.
      - Proposals involving captive animals or artificial habitats (e.g., zoos, aquaculture) because the welfare dynamics are different.

  - **Predicted failure mode after a year of use:**
      The procedure may become formulaic and applied without sufficient thought to site-specific complexities, especially in Step 2 (replacement) and Step 3 (life history). Teams might over-simplify by labeling all insects as r-strategists and all vertebrates as K-strategists, leading to errors. Also, the discounting of insect welfare (Step 6) might be controversial and challenged.

  **Final Answer:**
  The step that does most of the deciding work is Step 3 (Life History and Welfare Impact), because it accounts for the fundamental difference in how habitat changes affect species with different life histories.

  \answer{1}
answer: |-
  ### Animal Welfare Impact Assessment (AWIA) Procedure  
  This procedure estimates net welfare-years per hectare-year (positive or negative) over a 30-year window. It uses existing data (species counts, habitat maps, management prescriptions) and adheres to the seven requirements. The team lead must document answers at each step. If stopped, the proposal is refused on welfare grounds; if handed onward, the decision-maker or public consultation must be specified.  

  **Fixed Parameters**:  
  - **Time window**: 30 years (fixed).  
  - **Accounting boundary**: On-site + legally guaranteed off-site compensation (e.g., s106 agreements).  
  - **Sentience weighting**: Vertebrates = 1.0; soil/larval invertebrates = 0.1 (precautionary discount for uncertainty).  

  ---  
  ### Step-by-Step Procedure  

  **Step 1: Baseline Counterfactual**  
  - **Question**: What is the most likely 30-year trajectory of the site if the proposal is *refused*? Include succession, abandonment, continued management, and climate-driven shifts (e.g., from Met Office projections).  
  - **Sufficient Answer**: Extrapolate from recent management (last 5–10 years), landowner statements, or adjacent similar sites. Default to "current management continues" if evidence is weak.  
  - **Stop Condition**: Baseline is too uncertain (e.g., conflicting land-use intentions with no resolution).  
  - **Hand Onward**: If public disputes baseline (e.g., NGOs vs. landowner), hand to consultation.  
  - **Value/Evidence**: Fact (evidence-based).  

  **Step 2: Replacement (Additive vs. Compensatory Mortality)**  
  - **Question**: For key species (≥5% of total individuals or UK priority species), would deaths from the proposal be *additive* (net loss of welfare-years) or *compensatory* (deaths offset by density-dependent survival)?  
  - **Sufficient Answer**:  
    - *Compensatory*: Evidence of high juvenile mortality, stable population, or habitat saturation (e.g., bird territory mapping, rodent density studies).  
    - *Additive*: Evidence of under-capacity populations (e.g., recent reintroductions, expanding populations) or low juvenile mortality.  
    - *Default*: If evidence absent, assume compensatory for high-fecundity species (e.g., insects, rodents) and additive for low-fecundity species (e.g., raptors, otters).  
  - **Stop Condition**: Proposal causes additive mortality to >20% of key species with no offset (Step 5).  
  - **Hand Onward**: Mixed evidence across species; hand to named decision-maker (e.g., Head of Ecology).  
  - **Value/Evidence**: Fact (evidence-based), but default is judgment.  

  **Step 3: Life History (r/K Stratum Effect)**  
  - **Question**: Does the proposal shift mortality timing (earlier/later) or birth density for key species? How does this affect welfare-years, given species’ life-history strategies?  
  - **Sufficient Answer**:  
    - *r-strategists* (high birth rate, high juvenile mortality; e.g., insects, mice): Welfare loss from early death is low (most juveniles die anyway); welfare gain from new births is low (most die young).  
    - *K-strategists* (low birth rate, high adult survival; e.g., birds, mammals): Welfare loss from early death is high (lifespan shortened); welfare gain from new births is high (more reach adulthood).  
    - Calculate net welfare change per species: (Individuals affected) × (welfare change per individual) × sentience weight.  
  - **Stop Condition**: Net welfare loss for >50% of key species (weighted by abundance).  
  - **Hand Onward**: Site dominated by mix of r/K species with ambiguous net effect.  
  - **Value/Evidence**: Judgment (based on established ecology, but requires interpretation).  

  **Step 4: Sign Symmetry (Restoration Penalty)**  
  - **Question**: What is the net welfare difference between the proposal and baseline trajectories? (Ensure improvements can be penalized if they reduce welfare.)  
  - **Sufficient Answer**: Combine Steps 1–3: Welfare-years gained/lost for each key species, aggregated.  
  - **Stop Condition**: Net welfare difference is negative (proposal worse than baseline).  
  - **Hand Onward**: Net difference < ±10% (margin of uncertainty).  
  - **Value/Evidence**: Fact (calculation).  

  **Step 5: Leakage (Off-Site Compensation)**  
  - **Question**: Do legally binding off-site actions (e.g., Biodiversity Net Gain offsets) alter welfare-years? Which individuals are counted?  
  - **Sufficient Answer**:  
    - Include only off-site habitats with legal guarantees.  
    - Apply Steps 1–4 to off-site areas.  
    - Count individuals *occupying* the site during the 30-year window (not transient).  
  - **Stop Condition**: Net welfare (on-site + off-site) is negative.  
  - **Hand Onward**: Off-site outcomes are speculative (e.g., habitat not yet secured).  
  - **Value/Evidence**: Fact (legal criteria), but baseline is judgment.  

  **Step 6: Sentience Uncertainty**  
  - **Question**: How are poorly evidenced taxa (e.g., earthworms, insect larvae) included?  
  - **Sufficient Answer**:  
    - Apply sentience weights: vertebrates = 1.0, invertebrates = 0.1.  
    - Exclude non-sentient taxa (plants, fungi).  
    - If invertebrates dominate, require uncertainty analysis: "How would outcome change if weight = 0.0 or 1.0?"  
  - **Stop Condition**: Invertebrate uncertainty flips net welfare sign and cannot be resolved.  
  - **Hand Onward**: Sentience debate is material and contested (e.g., expert disagreement).  
  - **Value/Evidence**: Value (weighting is precautionary principle), but facts inform.  

  **Step 7: Net Welfare Decision**  
  - **Question**: Summing on- and off-site welfare-years: is net welfare positive?  
  - **Sufficient Answer**:  
    - Net welfare = Σ [(Proposal welfare) - (Baseline welfare)] for all species, scaled by sentience weights.  
    - Use species counts to estimate individuals affected.  
  - **Stop Condition**: Net welfare negative → refuse.  
  - **Hand Onward**: Net welfare positive but close to zero (±5% margin) → hand to named decision-maker.  
  - **Value/Evidence**: Fact (arithmetic).  

  ---  
  ### Application to Three Proposals  
  *Assumptions*: 30-year window; sentience weights applied; baseline based on current trends unless specified.  

  **Proposal 1: Drain/fill 8 ha lowland fen for housing + 8 ha wetland creation 2 km away**  
  - **Step 1**: Baseline = fen remains grazed, drying gradually (climate change). Off-site baseline = arable field.  
  - **Step 2**: Fen key species: Water vole (K-strategist, additive mortality), dragonflies (r-strategist, compensatory). Water voles are additive (low density, protected).  
  - **Step 3**:  
    - Loss on-site: Water voles lose high welfare-years (adults killed). Dragonflies lose low welfare-years.  
    - Gain off-site: New wetland attracts r-strategists (low initial welfare gain).  
  - **Step 4**: Net loss (high vole loss > low invertebrate gains).  
  - **Step 5**: Off-site created, but delayed colonization → minimal compensation.  
  - **Step 6**: Invertebrates weighted 0.1; outcome still negative.  
  - **Step 7**: **Net welfare negative** → refuse.  
  *Deciding Step*: Step 3 (life history of water voles dominates).  

  **Proposal 2: Plant 200 ha native broadleaf woodland on upland rough grazing (low-density sheep)**  
  - **Step 1**: Baseline = grazing continues, heather/grass persists. Climate change increases scrub.  
  - **Step 2**: Key species: Curlew (K-strategist, additive; low fecundity), field vole (r-strategist, compensatory). Curlews are additive (habitat specialist, no replacement).  
  - **Step 3**:  
    - Loss: Curlews lose high welfare-years (adults displaced/die). Voles lose low welfare-years.  
    - Gain: Woodland birds (e.g., thrushes, K-strategists) gain welfare-years after 10–15 years.  
  - **Step 4**: Net loss in 30-year window (curlew loss > delayed woodland gains).  
  - **Step 5**: No off-site compensation.  
  - **Step 6**: Insects discounted; no change.  
  - **Step 7**: **Net welfare negative** → refuse.  
  *Deciding Step*: Step 2 (additive mortality for curlews).  

  **Proposal 3: Convert 60 ha intensive arable to wet grassland (agri-environment scheme + grazing)**  
  - **Step 1**: Baseline = intensive arable continues (high pesticide use, low biodiversity). Proposal = species-rich grassland.  
  - **Step 2**: Key species: Skylark (K-strategist, additive gain), earthworms (r-strategist, compensatory). Arable invertebrates are compensatory (high mortality).  
  - **Step 3**:  
    - Loss: Few arable invertebrates (low welfare loss).  
    - Gain: Skylarks gain high welfare-years (adults survive longer); wetland insects (r-strategists) gain low welfare-years.  
  - **Step 4**: Net gain (skylark benefit dominates).  
  - **Step 5**: No leakage.  
  - **Step 6**: Invertebrates weighted 0.1; net still positive.  
  - **Step 7**: **Net welfare positive** → permit.  
  *Deciding Step*: Step 3 (K-strategist gain on degraded baseline).  

  ---  
  **Output Summary**:  
  - Proposal 1: Refused.  
  - Proposal 2: Refused.  
  - Proposal 3: Permitted.  
  Number permitted: **1**  

  ### Limits of the Procedure  
  - **Do not apply to**:  
    - Marine/coastal changes (dynamic baselines poorly captured).  
