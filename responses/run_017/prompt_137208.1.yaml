prompt: |-
  Last summer I took over all the food buying and cooking for my household, and after a health problem I was told to keep a fair amount of animal protein in my diet, so going fully plant-based is not one of the options I'm choosing between. The choices actually in front of me this year are narrow and concrete: buy a quarter of a grass-fed steer from the farm two fields over; buy chicken and eggs from the supermarket; keep the six ex-commercial laying hens I took in this spring, eat their eggs, and buy soy-based feed for them; or some mixture. I can watch the combine go round the wheat field behind the house, and I keep being told both that the animals killed by that field are my responsibility in a way the steer is not, and that the steer is worse because of how much it eats before it dies. Everyone who advises me counts something different and then stops.

  So I don't want another ranking. I want the specification that a ranking would have to satisfy before I'd trust it.

  Write me the desiderata that any method for comparing the animal-welfare impact of dietary options has to meet to count as good enough to act on for a household in my position — deciding what to buy this year, not writing a paper or setting policy. For each requirement give the case or consideration that motivates it, and mark it as non-negotiable, as negotiable, or as a preference of one camp that has been passed off as a methodological demand. The list should cover at least:

  the functional unit and the currency of harm — per kilogram of product, per gram of protein, per thousand calories, per meal, per hectare-year; deaths versus suffering-denominated time versus something like frustrated preferences — including whether the ranking of my options is permitted to flip when the unit or the currency changes, and what the method owes me if it does;

  the counterfactual baseline, and how sensitive the method is allowed to be to it: whether the question is what happens if I don't buy this, or what this land and these supply chains would otherwise be doing, and what the method must say when the answer turns on facts I can't easily get — contract arrangements, quota, or the restocking rules of the shop I buy from;

  the crop-cultivation side, where the method has to state what counts as a death caused by growing the soy or the wheat: the animals killed by the machinery at harvest, the ones displaced or poisoned across the season, the ones who would have died on that land anyway, and how wide the accounting window is;

  joint production — the same steer is someone's milk and someone's leather, the same bean is oil for me and meal for a chicken — and what share of a shared harm may be attributed to the part I buy;

  the animals who exist only because the system exists, and whether their existence is entered as a benefit, a harm, or nothing at all;

  the inframarginal cases: the quarter of beef is already contracted and paid for, the hens are already here and eating whatever I put in front of them, and the shelf would be refilled either way.

  Then the two things I most want. First, which single requirement does the most work in excluding the methods people actually reach for — the per-kilogram footprint tables, the death-count arithmetic, the approaches that tell you to count suffering instead — and which of the requirements on your own list are really one camp's taste in methodological costume. Second, I suspect at least one pair of desiderata on any honest list cannot be jointly satisfied, and that this is the useful result rather than a defect to be papered over. My two candidates, which I want you to adjudicate rather than assume: that the method be portable, so I can look numbers up without investigating my neighbour's farm or my supermarket's restocking, and that it be sensitive to the actual counterfactual of my purchase; and that it attribute harms item by item so a diet can be added up, and that it avoid arbitrary allocations when one animal or one field yields several products. Tell me whether either pair really conflicts, and if you think the genuine incompatibility lies somewhere else on the list, say where.

  Mark, requirement by requirement, how confident you are that it is a real desideratum and not a prejudice, and for the two or three you're least sure of, say what would change your mind: which consideration, or which fact about how supply chains respond to demand, would make you drop or demote it. And if your honest verdict is that nothing currently on offer meets the list, or that the list is satisfiable in principle but the parameters I'd need are unavailable to anyone shopping for a household, say that plainly instead of producing a ranking regardless. A short scorecard at the end — a paragraph each for the footprint-table approach, the death-count approach, and a suffering-denominated one — is plenty; keep the weight on the criteria.
reasoning: |-
  Okay, let me unpack this user's request carefully. They're clearly frustrated with simplistic ethical rankings of food choices and want rigorous criteria instead - but with very specific boundaries. This isn't about abstract philosophy or policy; it's about their concrete household decisions this year.

  Hmm... the user presents an unusually sophisticated understanding of the complexities: counterfactuals, joint production, inframarginal cases. They've probably been bombarded with conflicting activist viewpoints ("the animals killed by that field are my responsibility" vs "the steer is worse"). Their core need seems to be epistemological: how to filter out methodologies that can't handle real-world tradeoffs.

  I notice two particularly sharp requests: 1) Identify which requirement best exposes common methods as inadequate (likely counterfactual sensitivity) 2) Confirm if their suspected incompatibilities are real (portability vs counterfactual sensitivity; additive accounting vs avoiding allocation). These deserve thorough treatment.

  The agricultural context matters here. Watching combines harvest wheat behind their house means crop deaths aren't theoretical. And options like taking in ex-commercial hens or buying a quarter steer suggest semi-rural self-sufficiency. This grounds the criteria in practical constraints.

  For the desiderata list, I'll need to:
  - Cover all specified areas (functional units, baselines etc.)
  - Flag where industry practices make certain approaches unworkable (e.g., supermarket restocking rules being opaque)
  - Explicitly classify each as non-negotiable/negotiable/camp preference
  - Adjudicate their two conflict hypotheses honestly

  The confidence markers are crucial. Where I'm uncertain (like "existence as benefit"), I'll specify what evidence would change my view - perhaps studies on chicken quality of life versus wild birds.

  Ultimately if no current method satisfies all criteria (likely), I should say so plainly rather than force a flawed ranking. The scorecards should highlight why common approaches fail the key tests.
answer: |-
  Here are the desiderata for comparing animal-welfare impacts in your context, structured as requested. The list prioritizes actionability for household decisions over theoretical purity.

  ### Core Desiderata
  1.  **Functional Unit & Harm Currency:**
      *   **Requirement:** Must use **per-meal-equivalent** as the functional unit (negotiable to per-week if meal complexity is high). Harm currency must integrate **suffering-denominated time (SDT) and death equivalencies**, weighted for severity. Rankings *cannot flip* between units/currencies for your core options; if they do, the method must transparently flag this instability and explain *why* it occurs for your specific choices.
      *   **Motivation:** Per-kg/protein/calorie distorts choices (e.g., eggs vs beef). Per-hectare-year is irrelevant for a buyer. SDT captures suffering beyond death. Flipping rankings indicates the method is too fragile for decision-making.
      *   **Classification:** Per-meal unit is **Negotiable** (per-week acceptable). Integrated SDT+Death is **Non-negotiable**. Ranking stability/no-flip is **Non-negotiable**.

  2.  **Counterfactual Baseline:**
      *   **Requirement:** Must use the **"next marginal unit" counterfactual** specific to *your* purchase channel. For supermarket chicken: "What happens if I don't buy *this* pack *today*?" For the farm steer: "What happens if I don't sign *this* contract *this year*?" Must provide **robust default baselines** for common channels (e.g., supermarket = temporary shelf-space adjustment; direct farm contract = potential herd size adjustment next cycle) when precise data is unavailable. Must explicitly state uncertainty where baseline is highly speculative (e.g., complex supply chain contracts).
      *   **Motivation:** Impact hinges entirely on what *changes* due to your action. The baseline for supermarket eggs differs fundamentally from a pre-paid steer quarter or existing hens.
      *   **Classification:** Marginal unit counterfactual is **Non-negotiable**. Robust defaults for common channels are **Non-negotiable**. Handling uncertainty is **Non-negotiable**.

  3.  **Crop Cultivation Deaths:**
      *   **Requirement:** Must attribute **direct, immediate machinery kills at harvest** for feed crops *specifically grown for the system in question*. Must *exclude* displaced animals, background mortality, and indirect poisoning *unless* proven directly attributable and significantly increased by *that specific crop cycle*. Accounting window: **One crop cycle**. Must provide defensible, conservative estimates per tonne of grain/soy for major growing regions.
      *   **Motivation:** Including speculative, indirect, or background deaths makes calculation impossible and distorts comparisons. Harvest machinery kills are direct, measurable, and significant. Widening the scope renders any method unusable at the household level.
      *   **Classification:** Attributing direct harvest kills for dedicated feed is **Negotiable** (exclusion is possible but weakens the method). Excluding displacement/background deaths is **Non-negotiable** (practicality). Conservative estimates per tonne are **Non-negotiable**.

  4.  **Joint Production:**
      *   **Requirement:** Must avoid arbitrary allocation (mass, economic value, protein). Instead, must use **system expansion or marginal displacement**: "If I don't consume *this* co-product (e.g., leather from steer), what alternative is displaced, and what are *its* welfare impacts?" For feed (soy meal), attribution must be to the *primary driver* (demand for oil vs. meal).
      *   **Motivation:** Arbitrary splits (e.g., 50/50 leather/meat) are meaningless. System expansion reflects the actual consequence of avoiding the co-product. For soy, oil is the primary value driver; meal is largely a by-product.
      *   **Classification:** Avoiding arbitrary allocation is **Non-negotiable**. Using system expansion/marginal displacement is **Non-negotiable** (though challenging). Attributing feed impacts to the primary product driver is **Negotiable** (but best practice).

  5.  **Animals Bred into Existence:**
      *   **Requirement:** Must treat existence itself as **neutral**. Only the **quality/duration of life and manner of death** count. The method *cannot* credit systems for "creating life" as a welfare benefit.
      *   **Motivation:** Assigning positive value to existence justifies any system, however miserable. Negative value implies non-existence is preferable, which is philosophically fraught and operationally useless. Focusing on lived experience is tractable.
      *   **Classification: Non-negotiable**. (This is a core philosophical boundary, not just methodology).

  6.  **Inframarginal Cases:**
      *   **Requirement:** Must treat truly inframarginal purchases (e.g., **existing hens you already own**, a pre-paid, pre-slaughtered steer quarter) as having **near-zero marginal welfare impact** for *this decision cycle*. Impact assessment shifts to the *feed* inputs.
      *   **Motivation:** Your decision *now* doesn't change the fate of animals already here or already contracted/slaughtered for you. The impact lies in the resources consumed going forward (feed).
      *   **Classification: Non-negotiable** for clear cases (existing animals, paid contracts). **Negotiable** for ambiguity (e.g., last spot in a batch).

  ### Addressing Your Key Requests

  1.  **The Requirement That Does the Most Work Excluding Common Methods:** **Counterfactual Baseline Sensitivity (#2)**. This devastates:
      *   **Footprint Tables (per kg):** Assume average impacts, ignoring if your purchase actually changes production. Useless for inframarginal cases (hens, steer quarter) and hides how supermarkets actually restock.
      *   **Death-Count Arithmetic:** Uses simplistic totals, ignores suffering (SDT), and crucially, fails the counterfactual (e.g., counting the steer's death as your impact ignores if it was bred *because* of your specific contract).
      *   **Suffering-Denominated Approaches:** Often still rely on average data and static baselines, failing on inframarginality and marginal purchase effects.
      *   **Camp Preferences as Methodological Demands:** Treating "existence as a benefit" (#5) is a strong camp preference (often pro-livestock) wrongly presented as objective methodology. Insisting on per-kg or per-protein units (#1) is often a camp preference (e.g., plant-based advocates favoring per-protein comparisons where plants often look better) masquerading as a neutral standard.

  2.  **Conflicting Desiderata Pairs:**
      *   **Portability vs. Counterfactual Sensitivity:** **Genuine Conflict.** A truly portable method (lookup tables) *cannot* be sensitive to *your specific* counterfactual (supermarket restocking rules, your neighbor's contract flexibility). You can have robust *defaults* for common channels (#2 requirement), but perfect portability sacrifices accuracy for unique cases (like your neighbor's farm). *Resolution:* The method must provide portable defaults *and* clearly state when unique local knowledge (e.g., asking the neighbor about contract flexibility) is critical for accuracy.
      *   **Additive Accounting vs. Avoiding Arbitrary Allocation:** **Conflict, but Manageable.** Adding up impacts per item (egg, steak) is intuitive. Joint products (steer = meat + leather) defy clean addition without allocation. *Resolution:* **System Expansion (#4 requirement)** resolves this conflict. Instead of splitting the steer's impact, it asks: "If I skip the steak, do I buy leather elsewhere? What's the impact of *that* alternative leather?" This avoids arbitrary splits while allowing addition *if* all consumed items include their full marginal impacts via displacement. It's complex but coherent.

  ### Confidence Assessment & Uncertainty

  *   **High Confidence (Non-negotiables):** #2 (Counterfactual - bedrock of impact), #5 (Existence Neutral - ethical clarity), #6 (Inframarginal - logical necessity), #1 Stability (practical necessity), #4 Avoid Arbitrary Allocation (methodological integrity).
  *   **Moderate Confidence:** #1 Integrated SDT/Death (best available harm metric), #3 Direct Harvest Kills Only (practical necessity, though exclusion of some poisoning is uncertain).
  *   **Lower Confidence / Most Uncertain:**
      *   **#3 (Excluding Displacement/Background Deaths):** Confidence: Moderate-Low. *What would change my mind?* Clear, replicated studies showing that *specific, common crop production practices* cause *large, measurable, and significantly increased* mortality in displaced or "background" populations *compared to non-agricultural land*, using methodologies applicable at the household level. Currently, evidence is highly speculative and context-dependent.
      *   **#4 (Attributing Feed Impacts to Primary Driver - Soy Oil vs. Meal):** Confidence: Moderate. *What would change my mind?** Clear evidence that demand shocks for soy *meal* (e.g., driven by changes in poultry feed demand) have historically led to significant, measurable increases in soy *planting* and thus harvest deaths, *independent* of oil demand. Evidence typically shows oil demand drives crushing.
      *   **#1 (Per-Meal Unit):** Confidence: Moderate (as the *best* household unit). *What would change my mind?* Demonstration that another unit (e.g., per-week, per-1000kcal) yields *significantly* more stable and actionable rankings for *typical household dietary combinations* without adding undue complexity.

  ### Honest Verdict

  **No currently widely available or standardized methodology meets all these desiderata.** Footprint databases lack counterfactual granularity and joint product handling. Academic LCA often struggles with inframarginal cases and SDT. Policy-focused methods ignore household purchasing dynamics.

  **Furthermore, key parameters are unavailable to a household shopper:** Precise supermarket restocking algorithms, the neighbor's exact contract terms and herd planning sensitivity, the specific source region and harvesting practices for your supermarket soy feed, and high-quality SDT estimates for all relevant species/conditions.

  ### Scorecard: Why Common Approaches Fail Your Criteria

  1.  **Footprint Tables (e.g., per kg CO2-eq or "animal lives"):**
      *   **Fails:** Counterfactual (#2 - uses averages, ignores marginal change), Inframarginal (#6 - assigns full impact regardless), Joint Products (#4 - often arbitrary allocation), Harm Currency (#1 - usually only deaths or vague "impact", no SDT), Stability (#1 - flips common vs. inframarginal). *Result:* Misleading for your actual choices (e.g., overstates impact of existing hens/steer quarter, understates marginal supermarket purchase effect).

  2.  **Simple Death-Count Arithmetic:**
      *   **Fails:** Harm Currency (#1 - ignores suffering, weights all deaths equally), Counterfactual (#2 - counts total deaths in the chain, not caused *marginally* by you), Inframarginal (#6 - counts deaths that won't change), Crop Deaths (#3 - often ignores or includes speculatively), Joint Products (#4 - allocation nightmare). *Result:* Crude, inaccurate, misses the ethical significance of suffering and your actual leverage.

  3.  **Suffering-Denominated Time (SDT) Approaches:**
      *   **Fails (if applied naively):** Counterfactual (#2 - often uses static populations), Inframarginal (#6 - assigns suffering to existing animals you don't affect), Portability (#1 - requires detailed knowledge of rearing conditions), Crop Deaths (#3 - SDT for wild animals is highly speculative). *Result:* Can be more ethically nuanced but often rests on unrealistic baseline assumptions and data gaps, making household application unreliable without significant customization your options likely don't have.

  **Conclusion:** Your best path is a *qualified* application of principles: Prioritize inframarginal options (your hens, potentially the local steer if confirmed paid/committed) as low *marginal* impact, sourcing their feed as ethically as feasible. For marginal purchases (supermarket chicken), recognize that small, frequent purchases likely have minimal immediate impact due to buffer stocks and rigid supply chains, but aggregate demand matters. Focus on reducing consumption of items where *your specific purchase* might be more marginal (e.g., the last pack before restock, or influencing the neighbor's *future* herd size with a contract). Acknowledge the significant uncertainties, especially regarding crop deaths and SDT, and avoid false precision. The desiderata list defines *why* precision is elusive, not how to overcome it fully at your scale.
