prompt: |-
  My friend Theo and I got into it a couple of nights ago, two drinks in, about the classic utility-monster objection, and I think between us we built an argument that proves way too much. I can't find the bad step and it's been bugging me since.

  Setup so this is self-contained. Cardinal welfare scales -- the numbers you plug into a utilitarian sum -- are normally said to be unique only up to positive affine transformation: for a single person, replacing w with a·w + b (a > 0) preserves everything about that person's welfare levels and differences. That's supposed to be why it makes no difference whether you measure Bea's welfare in utils or micro-utils; the second just multiplies all her numbers by a million and changes nothing about Bea.

  Here's the arguement:

  (1) A change of units represents no difference in the facts. If two assignments of numbers to people's welfare differ only by per-person positive affine transformations, they represent the same situation, so a correct moral theory cannot give different verdicts depending on which assignment you happen to use.

  (2) What total utilitarianism recommends is determined by the sum of the numbers.

  (3) So total utilitarianism's verdicts depend on the units. Concretely: three people, a fixed stock of 100 units of some resource, each with the same diminishing-returns welfare function (say welfare = square root of resources). Measure everyone in the same units and the sum-maximizing split is 33/33/33. Now measure only Amara in micro-utils, multiplying her numbers by a million, and the sum-maximizing split hands her essentially all 100 units and leaves the other two with basically nothing.

  (4) Which means a utility monster can be manufactured out of anybody. Take a completely ordinary person, grade their welfare on a fine enough ruler, and the utilitarian sum says to sacrifice everyone else to them. You never had to suppose a creature with a bizarrely efficient psychology; you just needed a smaller unit for that one person.

  (5) But being a utility monster is supposed to be a substantive possibility about a creature's psychology -- that there could be someone who gets vastly more welfare out of any sacrifice than everyone else loses. That can't depend on which ruler we picked.

  (6) So either the utility monster objection is empty -- a complaint about bookkeeping rather than about what utilitarianism would have us do -- or utilitarianism's recommendations about distribution are indeterminate, and the decades of fighting between utilitarians and their critics about distribution was never about anything.

  (7) Both of those are absurd. The objection obviously has teeth, people on both sides feel its force, and it isn't a units quibble. And utilitarians plainly do say substantive, determinate things about distribution.

  So which step do I reject? I'd give up almost anything before I accept (6), but I also really don't want to say that the fine-grainedness of your ruler can change what morality requires of you. Name the step, say why it looked fine, and then price the alternatives: for each candidate thing to give up, what does it commit me to downstream -- in population ethics, in how I think about interpersonal tradeoffs generally, wherever the cost shows up -- and which of those bills would I regret later?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They had a debate with their friend Theo about the utility monster objection to utilitarianism. The core issue is that by changing the units of measurement for one person's welfare (like using micro-utils instead of utils), they can turn anyone into a utility monster, which seems absurd. The user's argument leads to the conclusion that either the utility monster objection is meaningless or utilitarianism's recommendations are indeterminate—both unpalatable options.

  First, I need to recall the basics of cardinal welfare and affine transformations. Welfare is unique up to positive affine transformations, meaning scaling and shifting don't change the underlying preferences. The user's scenario shows that rescaling one person's utility (Amara) by a large factor causes total utilitarianism to prioritize her over others, which mimics a utility monster. 

  The user's steps seem logically tight, so where's the flaw? Step 1 is solid: affine transformations shouldn't change ethical facts. Step 2 is correct—utilitarianism sums utilities. Step 3's math checks out; rescaling Amara skews the distribution. Step 4 follows: anyone can be a utility monster with fine units. Step 5 states the objection relies on psychology, not units. Step 6 presents the dilemma, and step 7 rejects both as absurd.

  Hmm. The problem must be in the setup. The key insight is that interpersonal comparisons require a common scale. Affine transformations are per-person, but utilitarianism summing across people assumes comparability. If each person's utility is scaled independently, the sums aren't comparable. So step 1 is incomplete because it ignores that interpersonal comparisons fix the scale across individuals. 

  Without a common unit, summing different people's utilities is meaningless. In the example, when Amara's utility is in micro-utils and others in utils, adding them is like adding meters to inches without conversion. The utilitarian sum requires a fixed interpersonal scale. The user's error is assuming that any affine transformation is permissible without considering that interpersonal comparisons constrain the scales.

  This means rejecting step 1 as stated. Affine transformations are only harmless if the interpersonal scale is preserved. The utility monster objection assumes a fixed scale where one person genuinely gains more from resources, not an artifact of rescaling. So the objection retains its force, and utilitarianism's recommendations are determinate under a common scale.

  Downstream, this affects how we set up welfare comparisons. In population ethics or policy decisions, we must establish a consistent interpersonal scale, perhaps through von Neumann-Morgenstern utilities or other methods. The cost is that defining this scale is non-trivial, but it's necessary for coherent utilitarianism. The user might regret the complexity but avoids the absurd conclusions.
answer: |-
  Your argument is sharp and exposes a deep tension in cardinal utilitarianism—but the flaw is in **Step 1**. Here's the breakdown:

  ### The Bad Step: Step 1
  **"If two assignments of numbers differ only by per-person positive affine transformations, they represent the same situation."**  
  This is **false** for utilitarianism when making *interpersonal comparisons*. Affine transformations preserve *intrapersonal* facts (e.g., Bea prefers X to Y, or welfare difference A-B > C-D). But they **do not preserve interpersonal comparisons** (e.g., "Amara gets more welfare from a resource than Bea does"). Utilitarianism requires comparing welfare *across* people, so the "same situation" claim fails.

  ### Why It Looked Fine
  - You correctly noted affine transformations preserve *individual* welfare facts. This is standard in decision theory.  
  - The error: Utilitarianism **demands a fixed interpersonal scale** to sum utilities. Permitting *independent* affine transformations destroys this scale. Your example doesn't describe the "same situation" for utilitarianism—it changes *who benefits more* from resources relative to others.

  ---

  ### The Correction: Reject Step 1
  **Affine transformations must be applied *uniformly* across all individuals** to preserve interpersonal comparisons. Otherwise, you're not just changing units—you're changing *whose welfare is privileged* in the sum.

  **In your example:**  
  - When all utilities are in "utils," √(33) ≈ 5.74 per person → sum ≈ 17.22.  
  - When Amara is in "micro-utils," her welfare is 1,000,000√(r), while others remain √(r). Giving her 100 units:  
    - Amara: 1,000,000√(100) = 10,000,000  
    - Others: √(0) = 0  
    - Sum: 10,000,000  
  - **This isn't the same situation!** You've altered Amara's *weight* in the sum relative to others. The "micro-utils" scale implies Amara's welfare gains are astronomically more valuable than others', which is a *substantive ethical claim*, not a bookkeeping quirk.

  ---

  ### Price of Rejecting Step 1: Downstream Commitments
  1. **Interpersonal Comparability Required**  
     - You must accept that welfare comparisons *across people* are meaningful and require a **common zero and unit**.  
     - *Cost:* Defending how we establish this scale (e.g., through von Neumann-Morgenstern utilities with shared risk preferences, or calibrated life-history comparisons). Critics (e.g., Robbins, Hayek) argue this is impossible without normative assumptions.

  2. **The Utility Monster is Back (Substantively)**  
     - A "real" utility monster must have a psychology that *objectively* extracts more welfare per resource than others *on the common scale*. Rescaling their units alone won't create one.  
     - *Cost:* You must bite the bullet that if such a monster exists, utilitarianism *would* favor it—but now it's a factual (if improbable) scenario, not a units artifact.

  3. **Population Ethics Implications**  
     - Fixed scales prevent affine-transformation paradoxes (e.g., "Mere Addition Paradox" resolved by fixed zero/unit).  
     - *Cost:* You lose flexibility to dismiss repugnant conclusions via rescaling. If "10 happy people" sums to less than "a billion barely happy lives" on a fixed scale, the repugnance stands.

  4. **Distributive Justice**  
     - Utilitarianism now yields determinate recommendations (e.g., equal split for symmetric cases).  
     - *Cost:* You must defend why sum-maximization over a common scale is just (e.g., Harsanyi’s impartial observer theorem).

  ---

  ### Why This Saves the Debate
  - **The utility monster objection retains teeth:** It critiques utilitarianism’s *substantive* willingness to sacrifice many for one *if* their welfare gains are sufficiently larger on a common scale.  
  - **Utilitarianism’s recommendations are determinate** under a fixed interpersonal scale. Decades of debate weren’t misguided—they implicitly assumed such a scale.  
  - **No absurdity in (6):** The objection isn’t empty, and utilitarianism isn’t indeterminate. The flaw was in misapplying affine transformations.

  ### Regret Minimization
  The cost—defending a common welfare scale—is steep but necessary. Alternatives are worse:  
  - *Keep Step 1* → Utilitarianism collapses into incoherence (your absurd conclusion).  
  - *Reject cardinality* → Abandon utilitarianism for ordinal theories (e.g., prioritarianism), losing precision in tradeoffs.  
  - *Embrace relativism* → Morality becomes arbitrary ("pick any affine transformation!").

  By rejecting Step 1, you preserve utilitarianism’s core structure while accepting that **interpersonal comparisons require ethical scaffolding**. That’s a bill worth paying—it’s where the real philosophical work begins.
