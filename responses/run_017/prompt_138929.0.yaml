prompt: |-
  I've been arguing with myself about asylum cases for a while and I want to know what principle, if any, I actually believe. Here are my gut verdicts:

  - A journalist who'll be jailed for publishing accurate criticism of her government: obviously yes.
  - A woman whose husband beats her and whose local police won't lift a finger because that's just how things are there, even though the law on paper says otherwise: yes.
  - A farmer whose land has stopped producing after ten years of drought: yes, but a uneasy yes — it doesn't feel like the same kind of yes as the first two.
  - A kid who joined a gang at 14 because it was the only protection going, ran errands for it, now wants out and will be killed if he stays: yes, and I don't think the gang stuff should count against him.
  - A man who was a low-level guard at a prison where beatings were routine, turned informant, and is now being hunted by the people he informed on: no, he doesn't get in. Which bugs me, because he was poor too and had few options too.
  - A family that fled eight years ago, is safe and settled in the country next door, and now wants to move on to a wealthier one: no. That one feels finished.
  - Someone who isn't in danger at all and just can't earn a living: no — but I don't feel great about it.
  - On who has to take people: the country next door does, even when it's poor and already hosting two million. But the rich country whose weapons kept the war going also has a duty, and I can't get both of those just from "whoever's able to help."
  - A rich country with no historical tie and no causal involvement: some duty, but weak? Genuinely unsure.

  The test I keep coming back to is something like: you have a claim if going back leaves you with no acceptable option at all. That seems to get most of the list, but it turns the prison guard into a yes and the settled family into a maybe, and I don't want either. Can it be patched, or is it the wrong shape entirely? Whichever principle you land on, state it precisely, tell me which clause each case is doing the work for, and tell me honestly which of my verdicts I'd have to give up. I also want to know what it says about people who aren't displaced yet but will be — say a village that'll be unfarmable or underwater within fifteen years: do they have a claim now, and against whom? Please answer in American English.
reasoning: |-
  Okay, the user is struggling with their moral principles regarding asylum cases. They've listed several scenarios with their gut reactions and want a consistent principle that explains most cases but conflicts with two: the prison guard and the settled family. The user's proposed test is "no acceptable option if returned," but it makes the guard a yes and the family a maybe, which they don't want. 

  First, I need to unpack their core conflict. Their discomfort with the prison guard (denied asylum) and the settled family (also denied) suggests they value both moral innocence and practical limits. The guard's complicity in human rights abuses seems to outweigh his "no options" situation, while the family's existing safety in a neighboring country makes further relocation feel unnecessary. 

  Their other cases reveal deeper patterns: persecution by state/non-state actors (journalist, abused wife, ex-gang kid) gets a strong yes; climate-displaced farmer gets an "uneasy yes"; economic migrants get a no. The duty-to-host question is tricky—they acknowledge proximity but also historical responsibility, rejecting pure "capacity-based" duties. 

  The key tensions are: 
  1. How to handle complicity (guard vs. ex-gang kid) 
  2. When is relocation "enough" (settled family) 
  3. How to weigh structural harms like climate change vs. targeted persecution 

  I'll propose a three-part principle: 
  - **Source of harm**: Must be persecution (state/non-state) or existential risk (climate) 
  - **Moral desert**: Excludes those who actively perpetrated serious abuses 
  - **Subsidiarity**: Asylum seekers must seek safety in the first viable country 

  This resolves: 
  - Journalist/wife/ex-gang kid: Clear persecution ✅ 
  - Farmer: Existential risk (but "uneasy" fits—it's not persecution) ✅ 
  - Guard: Perpetrator exclusion ❌ (user's verdict holds) 
  - Settled family: Safe elsewhere; subsidiarity blocks further claim ✅ 
  - Economic migrant: No persecution/risk ❌ 
  - Duty questions: Adjacent country first, but complicit states (e.g., arms suppliers) have heightened duty 

  For future climate displacements: Claims activate only when harm is imminent (not 15 years out), and duty falls primarily on neighboring/historically responsible states. 

  User must accept: 
  - The guard stays rejected (perpetrator exclusion) 
  - The settled family stays rejected (subsidiarity) 
  - Climate claims only when relocation is urgent 

  This preserves 7/8 of their verdicts—only the farmer's "uneasy yes" becomes a qualified protection based on risk, not persecution. The framework also handles their guilt about economic migrants by clarifying asylum isn't a poverty solution.
answer: |-
  Based on your gut verdicts and the tensions you've identified, here's a precise principle that captures most of your intuitions while requiring you to give up one verdict. I'll state it clearly, break down how it applies to each case, identify where you'd need to compromise, and address future climate displacement:

  ### The Principle
  **A person has a valid asylum claim if:**
  **(1) They face a severe, individualized threat to life or fundamental rights (liberty, bodily integrity);**
  **(2) This threat arises from persecution by a state or quasi-state actor, OR from catastrophic environmental collapse making continued habitation non-viable;**
  **(3) They bear no significant personal responsibility for perpetrating similar harms against others; and**
  **(4) No genuinely safe alternative refuge exists within their home region.**

  ### Breakdown of Your Cases
  1.  **Journalist (Yes):**  
      *Clause:* (1) Jail for criticism is a threat to liberty/fundamental rights; (2) Persecution by the state.  
      *Verdict upheld.*

  2.  **Abused Woman (Yes):**  
      *Clause:* (1) Domestic violence threatens life/bodily integrity; (2) State refusal to protect constitutes persecution (quasi-state failure); (4) No local safe option.  
      *Verdict upheld.*

  3.  **Drought Farmer (Uneasy Yes):**  
      *Clause:* (1) Starvation/loss of livelihood is a severe threat; (2) Catastrophic environmental collapse making habitation non-viable.  
      *Verdict upheld, but the "unease" comes from stretching "persecution" to include environment. Clause (2) explicitly includes this.*

  4.  **Ex-Gang Member (Yes):**  
      *Clause:* (1) Murder threat; (2) Gang is a quasi-state actor wielding power; (3) No significant responsibility (minor, coerced, low-level); (4) No safe local exit.  
      *Verdict upheld.*

  5.  **Prison Guard Informant (Your Verdict: No / Principle Verdict: No):**  
      *Clause:* **Fails (3):** Despite threats (1) and quasi-state actors (2), he bears significant responsibility for perpetrating beatings (fundamental rights violations) as part of the oppressive system, even if coerced. His later informant role doesn't erase this.  
      *Your Verdict Upheld.* Principle matches your gut.

  6.  **Settled Family (Your Verdict: No / Principle Verdict: No):**  
      *Clause:* **Fails (4):** They are safe in the neighboring country. Asylum isn't a right to choose the *best* destination, only a *safe* one.  
      *Your Verdict Upheld.* Principle matches your gut.

  7.  **Economic Migrant (No):**  
      *Clause:* **Fails (1) & (2):** Poverty alone isn't a direct, severe threat to life/bodily integrity from persecution/environmental collapse.  
      *Verdict upheld.*

  ### Duty to Host (Who Takes People?)
  *   **Clause (4) is key:** The "first safe country" (neighboring state) has the primary duty under subsidiarity – it's closest and often has cultural ties. This addresses your "country next door" point.
  *   **But:** Historical/causal responsibility (e.g., arms sales fueling war) creates an *additional, compensatory duty* for wealthy/complicit states. This isn't about pure capacity ("able to help"), but about remedying harm they caused or enabled.
  *   **No Causal Involvement:** Duty exists but is weaker, based on global burden-sharing and capacity. It kicks in *after* regional options are exhausted or overwhelmed.

  ### What You Have to Give Up
  *   **Only one major conflict:** Your proposed "no acceptable option" test would require accepting the **Prison Guard (Case 5)**. The principle's Clause (3) (no perpetration) blocks him, preserving your "no" verdict. This is the core trade-off: excluding perpetrators, even coerced ones, is essential to match your intuition here.
  *   **Minor Adjustment:** The **Drought Farmer (Case 3)** fits under environmental collapse in Clause (2), but it weakens the "persecution" core. You accept this uneasy fit, so your verdict holds.

  ### Future Climate Displacement (The Village)
  *   **Claim Now?** **No.** Clause (1) requires a *current* severe threat. Future risk (15 years out) is speculative. Policies for planned relocation are needed, but it's not an asylum claim *yet*.
  *   **Claim When?** When habitation becomes demonstrably non-viable *imminently* (e.g., next harvest impossible, saltwater intrusion destroys water supply) – meeting Clause (1) & (2).
  *   **Against Whom?**  
      *   **Primary Duty:** Neighboring or regional states (Clause 4 - closest safe refuge).  
      *   **Secondary Duty:** Wealthy/historically high-emission states bear a stronger compensatory duty due to causal contribution to climate change.  
      *   **Tertiary Duty:** Other capable states under global burden-sharing.

  ### Why This Principle Works for You
  *   **Targets Core Harms:** Focuses on threats to life/body/liberty, not just hardship.
  *   **Distinguishes Sources:** Separates persecution/environmental collapse from poverty.
  *   **Addresses Complicity:** Matches your rejection of the guard via Clause (3).
  *   **Limits Scope:** Rejects the settled family via Clause (4) and economic migrants via Clause (1)/(2).
  *   **Handles Nuance:** Accommodates your "uneasy yes" for the farmer under environmental collapse.
  *   **Assigns Duty:** Balances proximity/subsidiarity with causal/historical responsibility.

  This framework systematizes your instincts while providing clear reasoning for tough cases. The key sacrifice is fully embracing that complicity in serious harms (like the guard's role) disqualifies someone, even in difficult circumstances.
