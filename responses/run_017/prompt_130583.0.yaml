prompt: |-
  My old housemate did a philosophy MA and now runs a small blog, and he posted a short explainer on contextualism and pragmatic encroachment that ends by plugging a view of his own. I can't tell which parts are standard and which he's made up, but the second half smells off to me while the first half sounds right. Here's the paragraph:

  Contextualism and pragmatic encroachment are really two versions of one idea. Both say that whether you know something isn't settled by your evidence alone. Contextualists think the extra ingredient is conversational: when someone raises a skeptical scenario, the standards for knows go up, so the same sentence picks out a stronger relation. Pragmatic encroachers think the extra ingredient is practical: when a lot rides on being right you simply need more evidence in order to know, and when nothing rides on it, weaker evidence is enough. That means both views are exposed to the same objection — knowledge becomes sensitive to facts outside the subject's evidence, so a person can stop knowing something without gaining or losing any evidence and without the truth changing, and that flickering is absurd. Really all this shows is that knowledge isn't a state of the person at all but a status we hand out for our own purposes, and that's the strongest argument for the plain invariantist view that knowledge is just a matter of having enough evidence, full stop.

  He then says the way out is to keep things invariant about knowledge itself but let stakes move a different threshold — the one for what counts as reasonable reliance on what you know. He calls this reliance encroachment rather than knowledge encroachment, and claims it dodges the flickering complaint, since your knowledge never changes, only what it's sensible to bet on.

  Can you audit the paragraph for me? I want to know which sentences a contextualist would accept for their own view and which they'd wince at, the same for a pragmatic encroacher, and where exactly he runs together two claims the views keep apart (I suspect the whose-situation-does-the-work part, but also maybe the need-more-evidence bit). Is the flickering objection really one objection hitting both in the same place, or two different objections? Is the status-we-hand-out line an argument against either view, or just a redescription of what they say? And does the last sentence's inference to plain invariantism work?

  On his own proposal: is reliance encroachment a genuine third option, or just one of the two views under a new name, or does it collapse for some other reason? Does moving the threshold from knowing to reasonable reliance actually escape the flickering worry or only relocate it — say, to cases where the stakes change but the agent doesn't notice?

  Please write it in these sections: "What the paragraph gets right" (~150 words), "Where it goes wrong" (~300 words, go sentence by sentence or clause by clause), "Does the conclusion follow" (~100 words), "Reliance encroachment, assessed" (~200 words), and "A corrected paragraph I could send him" (~120 words).
reasoning: |-
  Okay, the user is asking me to audit a philosophical paragraph written by their old housemate. This paragraph discusses contextualism and pragmatic encroachment in epistemology and then proposes an alternative view called "reliance encroachment." The user wants me to identify what's accurate versus misleading in this paragraph, evaluate the arguments presented, and assess the alternative view.

  I need to analyze this carefully. The paragraph makes several claims: that contextualism and pragmatic encroachment are "two versions of one idea," that both views face the same "flickering" objection, that this leads to knowledge being a "status we hand out," and that this supports "plain invariantism." Then it proposes "reliance encroachment" as a solution.

  For my analysis, I'll break this down into sections as requested: what the paragraph gets right, where it goes wrong (analyzing sentence by sentence), whether the conclusion follows, an assessment of reliance encroachment, and finally a corrected paragraph.

  Starting with what's accurate: The paragraph correctly identifies that both contextualism and pragmatic encroachment deny that knowledge depends solely on evidence. It also accurately characterizes how contextualists view standards changing with conversational context and how pragmatic encroachers view stakes affecting knowledge demands. The "flickering" objection is indeed a common criticism, though I'll note it doesn't apply exactly the same way to both views.

  Now for the problematic parts. The first sentence already misrepresents both views by calling them "two versions of one idea" - they're actually distinct approaches with different mechanisms. The paragraph conflates whose situation matters (speaker vs. subject) and incorrectly describes pragmatic encroachment as requiring "more evidence" when in fact it's about the same evidence being sufficient or insufficient based on stakes. The claim that both views face the identical objection oversimplifies things - contextualism faces worries about disagreement while pragmatic encroachment faces challenges regarding epistemic purity. The leap to knowledge being a "status we hand out" misrepresents these views as anti-realist when they're actually trying to preserve knowledge as a real but context-sensitive state. The inference to plain invariantism is non sequitur since that view faces its own well-known problems.

  Regarding reliance encroachment: This is essentially repackaging pragmatic encroachment ideas (like Jeremy Fantl and Matthew McGrath's work on actionability) but shifting the locus from knowledge to reasonable reliance. While it might avoid some "flickering" concerns about knowledge itself, it just relocates the context-sensitivity to the reliance threshold. Crucially, it doesn't solve cases where stakes change without the agent's awareness - the "flickering" reappears at the level of reasonable action.

  For the corrected paragraph, I'll maintain the core distinction between the views, clarify that the objections differ, and avoid the problematic inference to plain invariantism. I'll also present the reliance encroachment idea more accurately as a variant rather than a complete solution.

  The user seems philosophically sophisticated - they've noticed the "smells off" aspects and specifically asked about conflation points. I'll provide detailed analysis to help them engage critically with their housemate's views.
answer: |-
  ### What the paragraph gets right (~150 words)
  The paragraph correctly identifies the core shared commitment of contextualism and pragmatic encroachment: that knowledge is not settled *solely* by the subject's evidence and the truth of the proposition. It accurately summarizes the key mechanisms each view proposes: contextualism ties "knows" standards to conversational context (like skeptical challenges), while pragmatic encroachment ties the evidence required for knowledge to the practical stakes for the subject. It also correctly identifies the central *type* of objection both views face – that knowledge can seemingly "flicker" (be gained/lost) due to changes in context or stakes *without* changes in the subject's evidence or the truth, which some find counterintuitive or "absurd." Finally, it accurately reports the plain invariantist position as holding that knowledge depends only on evidence and truth, invariant across contexts.

  ### Where it goes wrong (~300 words, sentence-by-sentence/clause)
  1.  **"Contextualism and pragmatic encroachment are really two versions of one idea."** - **Wrong.** While both respond to similar problems, they are distinct theories with fundamentally different mechanisms and metaphysics. Contextualism is typically a semantic view about the word "knows," while pragmatic encroachment is a metaphysical view about the nature of knowledge itself being partly practical.
  2.  **"Both say that whether you know something isn't settled by your evidence alone."** - **Mostly Right, but...** This is true regarding the sufficiency of evidence. However, contextualism often *does* hold that evidence + truth *settles* knowledge *within* a fixed context; the context determines *which* evidential standard applies.
  3.  **"Contextualists think the extra ingredient is conversational: when someone raises a skeptical scenario, the standards for knows go up, so the same sentence picks out a stronger relation."** - **Mostly Right (for "Subject-Sensitive" Contextualism).** Standard contextualism (like DeRose/Lewis) focuses on the *speaker's* or *attributor's* context/conversational needs, not necessarily the subject's situation or stakes. The "same sentence" point about content is key.
  4.  **"Pragmatic encroachers think the extra ingredient is practical: when a lot rides on being right you simply need more evidence in order to know, and when nothing rides on it, weaker evidence is enough."** - **Misleading.** Pragmatic encroachment (PE) proponents (e.g., Fantl, McGrath, Stanley) generally argue that *given the same evidence*, whether it *constitutes* knowledge depends on the subject's practical situation. It's not that you "need more evidence" *gathered*, but that the *same body* of evidence becomes *insufficient* for knowledge as stakes rise. The "whose stakes?" part is correct here (subject's situation).
  5.  **"That means both views are exposed to the same objection — knowledge becomes sensitive to facts outside the subject's evidence, so a person can stop knowing something without gaining or losing any evidence and without the truth changing, and that flickering is absurd."** - **Overgeneralized.** While both face "instability" worries, the *nature* of the objection differs. For contextualism, the main "flickering" worry often concerns *disagreement* (can I know-P in a low-stakes context while you deny I know-P in a high-stakes context *about me*?) and the seeming loss of knowledge simply because someone else mentions a remote possibility. For PE, the core worry is the "purist" intuition that knowledge *itself* shouldn't depend on practical stakes – the "flickering" is directly tied to changes in the subject's *own* situation. Calling it the "same" objection obscures crucial nuances.
  6.  **"Really all this shows is that knowledge isn't a state of the person at all but a status we hand out for our own purposes"** - **Misrepresents Both Views & Offers a Non-Sequitur.** Neither contextualists nor PE proponents typically endorse this anti-realist, purely social-status view of knowledge. Contextualists see knowledge as a real relation, sensitive to contextually set standards. PE proponents see knowledge as a real, practically infused state of the subject. This "status" claim is a *radical departure* (akin to expressivism or anti-realism), not a conclusion "shown" by the flickering objection. It's not an argument *for* invariantism, but a different view entirely.
  7.  **"...and that's the strongest argument for the plain invariantist view that knowledge is just a matter of having enough evidence, full stop."** - **Non-Sequitur.** The purported "status" view doesn't entail or support plain invariantism; it contradicts it! Plain invariantism *does* see knowledge as a real, stable state of the subject (evidence + truth), directly opposing the "status" view. The flickering objection is *a* challenge to contextualism/PE, but plain invariantism faces its own well-known problems (the "abominable conjunctions" of low/high-stakes assertions) that the paragraph ignores.

  ### Does the conclusion follow? (~100 words)
  No, the conclusion ("that's the strongest argument for plain invariantism") does not follow. The inference is deeply flawed. The "status" claim is not actually supported by the preceding discussion of contextualism and PE, nor is it a view either typically holds. More importantly, this "status" view is fundamentally *incompatible* with plain invariantism. Plain invariantism firmly asserts knowledge *is* an objective, stable state of the individual (based on evidence and truth), directly counter to the idea it's merely a handed-out status. The flickering objection points to a *problem* for contextualism/PE, but it doesn't magically become an *argument for* a view (invariantism) that faces significant independent difficulties.

  ### Reliance encroachment, assessed (~200 words)
  Reliance Encroachment (RE) is a recognizable, potentially viable strategy, closely related to (or a variant of) certain existing PE defenses. It shifts the locus of stakes-sensitivity *away* from the knowledge relation itself and onto the norms governing *action* or *reliance* based on that knowledge. Proponents like Fantl & McGrath ("Actionability") argue knowledge is invariant, but whether you can *rationally act* as if P depends on stakes. **Pros:** It directly answers the core "flickering" worry about *knowledge* changing – knowledge remains stable. It aligns with intuitions that high stakes demand more caution *in action* even if you "know". **Cons:** 1. **Relocated Flickering:** As you suspect, the "flickering" worry reappears for *rational reliance/action*. Can rational reliance truly "flicker" without the agent noticing a stakes change? This seems just as problematic for rational action as it did for knowledge. 2. **Knowledge-Action Link:** It potentially severs the intuitive, strong link between knowing P and being rational to act on P. If I *know* P, why isn't it *always* rational to act on P (barring overriding moral reasons unrelated to the truth of P)? RE must explain this gap. It's a genuine third option *structurally*, but faces challenges similar to PE regarding the sensitivity of normative statuses.

  ### A corrected paragraph I could send him (~120 words)
  "Contextualism and pragmatic encroachment both deny that knowledge depends solely on evidence and truth. Contextualists argue the semantic standards for 'knows' shift with the attributor's conversational context. Pragmatic encroachers argue the epistemic sufficiency of evidence depends on the subject's practical stakes. Both face objections concerning instability: contextualism regarding disagreement across contexts, pragmatic encroachment regarding the purity of knowledge. However, characterizing this as showing knowledge is merely a 'handed-out status' misrepresents both views and doesn't support plain invariantism. Your reliance encroachment proposal—keeping knowledge invariant but making *reasonable reliance* stakes-sensitive—avoids the knowledge-flickering objection but relocates stakes-sensitivity to rational action, which may face analogous instability concerns, especially with unnoticed stakes changes."
