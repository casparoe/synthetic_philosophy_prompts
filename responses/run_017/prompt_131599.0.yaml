  Next, the hidden empirical question: how much was math pre-selected by physics? This is tricky because it's historical and hard to quantify. For example, how many "natural" mathematical structures were developed independently of physical problems? Cases like number theory or non-Euclidean geometry used in relativity might support the user's point, but Sam could argue those are exceptions. Measuring the base rate of math concepts finding applications is tough but maybe feasible with data analysis of math publications over time.

