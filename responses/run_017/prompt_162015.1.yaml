prompt: |-
  I am a novelist, and in three weeks I appear before the ethics committee of my national writers' association, which is deciding whether to censure me over a complaint filed by another member. I would like you to prepare me for the questioning.

  The complaint concerns my most recent novel. Its architecture — the sequence of scenes, the disposition of chapters, the shape of the reveal, the way the subplot closes against the main plot — is taken, more or less whole, from a novel published in 1931 by a writer who died in 1968 and left no heirs and no estate worth tracing. Every sentence is mine. The period, the setting, the characters' trades, their names, and the ending are changed. The source is named in an afterword and again in the acknowledgments. A senior member of the association has written an open letter calling this plagiarism dressed up as homage, and the committee must now say something.

  My defence, which I have about ten minutes to state, runs in three parts.

  First, the familiar line between idea and expression is drawn in roughly the right place but justified by the wrong argument. The usual argument is that ideas are scarce in some sense, or that protecting them would chill later writers. My argument is different: architecture is not the kind of thing a writer can own because it is not the kind of thing a writer finishes. A plot skeleton is a solution to a set of local problems, and the problems recur; the same skeleton gets rebuilt independently, which is why independent-creation defences keep working in practice.

  Second, what a writer actually makes — and the only thing that can genuinely be taken — is what I call a register of attention: the pattern of what this writer notices, dwells on, returns to, and conspicuously leaves out. That is a habit rather than an object. It can be imitated, learned from, and eventually echoed, but it cannot be stolen in the way a sentence can, and it is not the sort of item property rules are about. So the injury in plagiarism is not the loss of an asset. It is a falsification of the record of who attended to what, and that injury is repaired by naming, not by damages. Naming is not a courtesy added to the moral accounting; on my account it is most of the moral accounting.

  Third, therefore, a three-tier proposal, which I will be asked to defend as policy and not merely as self-justification: sentences and their immediate surrounds get strong exclusive rights; architecture is free to reuse but subject to mandatory naming inside the text itself rather than buried in acknowledgments; and register of attention is protected, if at all, only by an inalienable right of attribution, never by an action for damages.

  The committee has six members, and I can predict roughly who they are. Two are prize-winning literary novelists of my parents' generation, formed in the workshop tradition, who believe a writer's job is to find a voice that is unmistakably her own and who regard borrowing as a failure of that search. One is a fantasy novelist who was badly burned twenty years ago when a better-selling writer reused his magic system, and who thinks worldbuilding is plainly the product of labour and plainly property. One is a literary translator, who will hear my talk of sentences as property through the lens of her own derivative status. One is an academic literary scholar who takes the Romantic figure of the solitary originator to be an ideological construction and will suspect my register-of-attention talk of reinstating exactly that figure under a new name. The sixth is the association's honorary legal adviser, a retired copyright barrister who will speak in terms of what a court would actually do and who will not be moved by any argument that cannot be turned into a rule.

  What I want from you is a prep sheet, not a defence. Give me the eight or so objections I will actually get, in the order they are likely to arrive, each attributed to the member most likely to make it and phrased in that member's idiom rather than in mine — the barrister's objections should sound like a barrister, the fantasy novelist's like a working writer who has been robbed, the scholar's like a scholar. For each: how much damage it does to my three-part case if I mishandle it, a reply I can deliver in about two minutes, and one line on where that reply is weakest. Tell me what I should concede before anyone raises it. And tell me the question I am hoping nobody asks.

  One thing you should know, because it is the worst fact in the room: six years ago, in a published interview, I criticised a younger writer for structure-lifting from a novel of mine, and I used the word theft.
reasoning: |-
  Hmm, the user is a novelist facing an ethics committee hearing over alleged plagiarism. They've borrowed the entire plot structure from a 1931 novel while changing all surface elements, crediting the source in an afterword. Their defense rests on three pillars: that architecture isn't ownable, that true ownership lies in "register of attention," and a proposed three-tier policy for literary borrowing. The committee consists of six distinct personalities with predictable biases.

  The real landmine here is their own hypocrisy - they publicly accused another writer of "theft" for similar structural borrowing six years ago. That inconsistency will likely be weaponized. I need to prepare them for eight probable objections that will come from different committee members.

  First objection will come from the legal advisor barrister: "This would never hold up in court." They'll argue that copyright law protects expression including structure. My reply should focus on how courts actually treat plot elements, citing precedents like Nichols v. Universal where only specific sequence is protected. Weakness is that legal standards vary by jurisdiction.

  Second, the fantasy novelist will attack about worldbuilding labor: "You stole my magic system before, now you're stealing structures!" Need to differentiate between reusable tropes and unique systems. Concede that highly original constructs deserve more protection than universal plot skeletons.

  Third, the workshop-generation novelists will see this as moral failure: "Where's your voice in this?" Must reframe homage as active engagement rather than laziness, while acknowledging their value system. Weakness is the emotional gap between generations.

  Fourth, the literary scholar will call out my "register of attention" concept as recycled romantic individualism. Should position it as observable patterns rather than mystical originality. Concede it's not legally actionable.

  Fifth, the translator will question why sentences get special protection when all writing is derivative. Need to distinguish between translation's constraints and original composition. Weakness is that all writing exists on a continuum.

  Sixth, the barrister returns with "But you admitted it!" regarding the acknowledgments. Must frame credits as moral resolution rather than legal admission. Weakness is it looks self-serving.

  Seventh, the whole committee will hammer the hypocrisy of their past "theft" accusation. This requires full accountability - explain how their perspective evolved after deeper reflection. This is the most dangerous moment.

  Eighth, the academic will ask why mandatory naming isn't just plagiarism with footnotes. Need to position it as transparent creative genealogy. Weakness is it doesn't solve commercial displacement concerns.

  The user must preemptively address their past hypocrisy before others do. The nightmare question would be asking them to apply their three-tier policy retroactively to their own past accusation. Preparation should focus on maintaining intellectual consistency while showing genuine growth in perspective.
answer: |-
  Here's your prep sheet: 8 likely objections, ordered for impact, with attribution, responses, vulnerabilities, and strategic concessions. The key is managing the room's energy and your past hypocrisy.

  **Core Strategy:** Frame this as *literary theory*, not legal defense. Anchor in craft, not copyright. Preemptively address your past "theft" comment.

  **Preemptive Concession (Raise Early in Opening Statement):**
  > "Before I begin my core argument, I must address something. Six years ago, I used the word 'theft' regarding structural borrowing. That was a different context – a specific, contested innovation within my own living community where the source wasn't acknowledged. It was also careless language born of personal frustration. I see now that my framework for understanding borrowing was inadequate. This process – and preparing this defense – has forced me to articulate a more nuanced, consistent, and I believe *fairer* theory of literary creation and obligation, which I present today. My past comment was wrong, and I retract the term 'theft' for structural borrowing where naming occurs."

  **The Objections (Likely Order & Attribution):**

  1.  **Objection (Honorary Legal Advisor - Barrister):** "Mr. [Your Name], your entire premise crumbles on contact with law. Copyright *does* protect expression beyond mere sentences – plot sequence, character development, the 'architecture' you dismiss. The *Nichols* case in the US, *Da Vinci Code* here – courts *do* look at structure. Your 'mandatory naming' is irrelevant; infringement doesn't magically vanish with a footnote. If your source author sued you tomorrow, your 'register of attention' theory wouldn't save you. Isn't this just elaborate special pleading to excuse what a court would see as actionable copying?"
      *   **Damage if Mishandled:** High. Undermines your entire premise as impractical fantasy. Makes you look legally naive.
      *   **2-Minute Reply:** "Respectfully, counsel, I'm not making a copyright defense; I'm proposing an *ethical* framework distinct from, though informed by, law's limits. The law draws lines pragmatically for dispute resolution, often protecting highly specific sequences (*Da Vinci Code*) while acknowledging ideas/scènes à faire are free (*Nichols*). My point is *why* architecture sits uneasily as property: its fundamental recombinatory nature. Law treats *expression* protectably; I argue architecture isn't truly 'expressed' in the same fixed, ownable way sentences are. It's a *type* of idea. Courts struggle with this *because* it's conceptually messy. Ethics can – and should – be clearer: mandate naming for reuse, grant no veto. Law's pragmatism shouldn't bind ethics."
      *   **Weakness:** Concedes law might view this differently; risks sounding like you're dodging the legal reality you'd likely lose.

  2.  **Objection (Fantasy Novelist - Robbed Writer):** "Labor. That's what you're dismissing. I poured years into my magic system – the rules, the costs, the internal logic. Someone else just scooped it up, changed the names, got rich. You call it 'architecture' or 'skeleton,' but it's *my world*, my solved problems. You did the same – took someone else's solved problems, their years of labor figuring out *how that story works*. Why is your labor on the sentences sacred, but the labor of crafting the underlying structure – the thing that makes the story *work* – suddenly free for the taking? It's sweat stolen."
      *   **Damage if Mishandled:** High emotional resonance. Makes your distinction seem elitist (sentences vs. "mere" structure).
      *   **2-Minute Reply:** "I deeply sympathize with your experience; appropriation without credit *is* a violation. But the labor argument cuts both ways. *All* writers labor on structure, constantly rebuilding shared skeletons – the hero's journey, the marriage plot, the heist. Is *Romeo and Juliet* stolen from Pyramus and Thisbe? Was Austen stealing Burney's architecture? The labor is real, but the *output* – the plot structure – is inherently recombinatory and reusable *by necessity*. Unique, highly specific *systems* (like your magic system) blur the line closer to expression; that deserves discussion. But a basic plot progression? It *must* be reusable, or storytelling dies. The ethical repair isn't exclusivity, it's *naming the source of the specific solution you reused* – acknowledging *their* labor on *that* skeleton. That's what I did."
      *   **Weakness:** Distinguishing "basic plot" from "unique system" is fuzzy; downplays the *specificity* of the borrowed architecture.

  3.  **Objection (Workshop Novelist 1 - Voice Seeker):** "You talk of 'register of attention' as if it's some mystical fingerprint. But isn't the *search* for that register – the struggle to find an *authentic* voice, a unique way of seeing and shaping the world – the entire point? What you've done feels like a shortcut. You didn't wrestle with *why* the scenes unfold in that order for *your* characters, in *your* time. You took a pre-fab solution. Where's *your* voice in the architecture? Isn't that the core failure – not theft, but a lack of authentic creative engagement?"
      *   **Damage if Mishandled:** Hits at artistic integrity. Risks making you seem lazy or derivative at the core.
      *   **2-Minute Reply:** "The 'authentic voice' model is powerful, but it's not the only valid path. Think of Bach writing *The Art of Fugue* – exploring pre-existing forms to their limits. Or Stravinsky reworking Pergolesi. My 'authentic engagement' *was* in transposing that architecture: asking 'What happens when these *specific* characters, in *this* specific setting, with *my* linguistic sensibility, are forced through *this* sequence?' The challenge and voice emerge in the *translation* and the texture – the 'register of attention' applied *within* the borrowed frame. The architecture was the crucible, not the avoidance of work. Finding one's voice can *include* deep dialogue with existing forms, not just ex nihilo creation."
      *   **Weakness:** Romantic ideal of originality is deeply ingrained; may not satisfy those who see structure *as* voice.

  4.  **Objection (Literary Scholar - Suspicious of Romanticism):** "Your 'register of attention' concept troubles me. It sounds suspiciously like the Romantic 'genius' ideology dressed up in new jargon – the unique, ineffable fingerprint of the solitary creator. But literary studies has shown authorship is collaborative, intertextual, built on shared discourses. Doesn't your theory *reinforce* the myth of unique, ownable interiority you seem to critique in your first point? And doesn't focusing attribution on individuals for 'registers' obscure the collective, cultural wellsprings of creativity?"
      *   **Damage if Mishandled:** Undermines the coherence/novelty of your core concept. Makes you seem theoretically inconsistent.
      *   **2-Minute Reply:** "A sharp point. I agree the solitary genius is a myth. 'Register of attention' isn't an essence, it's an observable *pattern* in the work – the textual trace of *choices* made, consciously or not. It's not mystical interiority, it's forensic style. And it *is* shaped by discourses, influences, collaborations. But the *specific constellation* of what is emphasized, omitted, returned to – that pattern *is* what distinguishes one textual artifact from another, even within shared forms. Attributing that pattern isn't claiming sole origination of its components, but identifying the *agent* who enacted *that specific configuration* in *this* text. It acknowledges the *specificity* of the labor on *this* configuration, not its divine origin."
      *   **Weakness:** Can feel semantic; doesn't fully resolve the tension between individual pattern and collective influence.

  5.  **Objection (Literary Translator - Derivative Status Lens):** "You grant 'sentences and their immediate surrounds' strong rights. But my entire craft is rewriting sentences! Where do you draw the line? A translation isn't 'theft,' but it's not 'original' sentences either. If architecture is free, and sentences are sacred, where does that leave adaptation? Parody? Pastiche? Isn't *all* writing fundamentally derivative at some level? Your tiers feel arbitrary and risk devaluing vital, non-'original sentence' creative work."
      *   **Damage if Mishandled:** Exposes potential hypocrisy/inconsistency in your tiers. Risks alienating a key creative ally.
      *   **2-Minute Reply:** "An excellent challenge. Translation is a vital art, operating under unique constraints and imperatives. The line *is* blurry. My 'sentences' tier aims at verbatim or near-verbatim copying *without* the transformative purpose or constraint inherent in translation/adaptation. Your work *transforms* sentences across languages/cultures – it's a different act. Pastiche consciously echoes register. My framework *encourages* reuse (of architecture) and echo (of register) but demands transparency (naming). It seeks to *protect* the most granular, fixed expression (sentences) while *liberating* the reusable structures, precisely to *enable* the kind of work you do – adaptations, reimaginings – more freely, *as long as the source is named within the text*. It's a call for more transparent intertextuality, not less."
      *   **Weakness:** Distinguishing "transformation" (translation) from "copying" sentences is context-dependent.

  6.  **Objection (Honorary Legal Advisor - Barrister, Follow-up):** "Putting theory aside, practically: You *named* the source. Doesn't that tacitly admit the *debt* was significant enough to warrant it, implicitly acknowledging the complainant's core point – that this went beyond acceptable influence? If your 'architecture is free' argument held water, why name it at all? Doesn't the naming contradict your first premise?"
      *   **Damage if Mishandled:** Makes your naming seem like an admission of guilt against your own theory.
      *   **2-Minute Reply:** "Not at all. Naming isn't an admission of debt in a *proprietary* sense; it's the *fulfillment* of the ethical obligation under my second and third points. Precisely *because* architecture is free to reuse, the *only* ethical injury possible is the failure to attribute – the falsification of the record. I named the source *because* it's the right thing to do under my framework, to repair the only possible injury: obscuring the lineage. I named it *to demonstrate* that the reuse was conscious homage, not concealment. The naming *supports* my premise that attribution is the primary ethical act, not a secondary courtesy or an admission of fault."
      *   **Weakness:** May seem like semantics; doesn't negate the *perception* that significant borrowing occurred.

  7.  **Objection (Workshop Novelist 2 - Voice Seeker / Leveraging Hypocrisy):** "Let's cut through the theory. Six years ago, you called similar borrowing 'theft.' Now you stand here with a philosophical framework justifying it. Isn't this just sophistry to excuse *your own* actions after attacking someone else's? Where's the integrity in that? If your theory is so sound, why didn't you apply it *then*? Or is it only valid when *you* do the borrowing?"
      *   **Damage if Mishandled:** Devastating. Attacks credibility and character. Can derail the entire argument.
      *   **2-Minute Reply:** (Must reference preemptive concession) "As I acknowledged upfront, my comment six years ago was wrong. It was reactive and lacked the framework I've developed since. That experience *was* part of what prompted me to think harder about this. My hypocrisy then doesn't invalidate the argument now; it highlights the inconsistency *of the prevailing, unexamined norms*. I should have articulated *this* framework then, instead of resorting to 'theft.' My failing was intellectual and ethical inconsistency in that moment. My argument today is an attempt to correct that, to propose a *consistent* and fairer standard for everyone, myself included. It's not sophistry; it's learning, painfully."
      *   **Weakness:** Requires humility; doesn't erase the past act, just contextualizes it as error/growth.

  8.  **Objection (Literary Scholar / General - Policy Hole):** "Your 'mandatory naming *inside* the text' proposal. Practically, how does this work? Is it a preface? A footnote per chapter? Doesn't this turn the novel into an academic treatise? And what about *unconscious* borrowing? Your framework seems to punish honesty and conscious homage while potentially excusing genuine, unacknowledged appropriation that the author claims was 'unconscious register echo' or 'independent recreation of a skeleton.' Doesn't this create more problems than it solves?"
      *   **Damage if Mishandled:** Makes your policy proposal seem naive and unworkable.
      *   **2-Minute Reply:** "Practicalities need refinement, certainly. The core principle is visibility: naming where the *core architecture* is consciously reused. A discreet preface or afterword suffices – 'This novel's structure is indebted to X's Y'. It signals intent and lineage without burdening the text. Unconscious borrowing is a different category; ethics concerns deliberate acts. My framework *targets* the deliberate reuse *without* naming. It incentivizes *conscious, transparent* engagement. Conscious, unacknowledged reuse remains the wrong, as it falsifies the record. Independent creation is always a defense, as it always has been – my theory of *why* independent creation happens (recurring problems) supports that."
      *   **Weakness:** Enforcement is impossible; relies on author honesty; "core architecture" is subjective.

  **The Question You Hope Nobody Asks (Likely from the Barrister or Scholar):**
  > "Mr. [Your Name], applying your three-tier framework *retroactively* to the case six years ago where you accused Writer Z of 'theft': Based solely on your description of Writer Z's actions then (structure-lifting from your work), would their actions now be *ethical* under your mandatory naming rule? If 'yes,' does that mean your public accusation of 'theft' was itself unethical? If 'no,' how specifically did Writer Z's actions differ from yours in this case, beyond the naming?"

  *   **Why it's Dangerous:** Forces you to explicitly judge your past self/past action through your new lens, likely condemning it ("yes, naming would have made it ethical, so my 'theft' accusation *was* unethical"). It's a brutal accountability moment.
  *   **If Forced to Answer:** "Under my current framework, *if* Writer Z had clearly named my work as the source of the structure within their text, their action would have been ethically sound. My accusation of 'theft' *was* therefore misplaced and unethical *under this framework*. I deeply regret the harm that caused. The difference in *this* case is I *did* name the source. My past action stands as a personal failure to live up to the standards I now advocate. My only defense is that I lacked this framework then, and I offer this framework now partly as a consequence of learning from that error."

  **Final Prep Advice:**
  1.  **Lead with the Concession:** Defuse the hypocrisy bomb immediately.
  2.  **Control the Language:** Use "architecture," "skeleton," "recombinant," "transparency," "lineage," "attribution." Avoid "borrowing," "copying," "influence" – they are weaponized. NEVER say "transformative" unless directly asked – it's a legal term you don't want to own here.
  3.  **Emphasize Naming:** Position it as the *positive ethical act*, the core of your defense, not a mitigating factor. "I named because naming *is* the obligation."
  4.  **Acknowledge Labor, Redefine Output:** Don't dismiss the work on structure; argue its *nature* makes exclusivity impractical and undesirable, so naming is the fair recompense.
  5.  **Stay Calm, Own the Theory:** You're the novelist-theorist. Don't get defensive. Explain your framework clearly. The committee wants to see intellectual seriousness and consistency more than groveling (though humility on the past point is vital).
  6.  **Bridge the Gap:** Find points of connection. "As a translator, you understand..." "As a worldbuilder, you know the difference between a unique system and a common trope..." "The search for voice you value is embodied in my *register of attention*..."

  Good luck. This is tough, but your framework is intellectually robust. The key is selling it to a hostile room while managing your past baggage. Focus on the future of ethical practice.
