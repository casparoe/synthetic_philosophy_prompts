prompt: |-
  I teach the final session of a graduate reading group on morality and nonhuman animals: 16 participants — mostly first- and second-year philosophy students, plus two visitors from biology — one 100-minute meeting, no internet access in the room. We have already worked through the argument from marginal cases, the epistemic problem of other minds, and the vertebrate-biased welfare literature. What I want from this last session is for people to *feel* the force of the scale argument about insects — that an astronomically large number of candidate individuals can swamp even a very low probability that any of them is sentient — rather than to hear me assert it and then discuss it.

  Please design a runnable activity for that session. My intended frame: participants serve as a small funding committee with a fixed budget, deciding how to divide it between an intervention whose case rests on insects and one whose case rests on vertebrates. The department will actually transfer a trivial sum — say 100 units of local currency — according to the committee's decision, so the choice is not purely hypothetical, though nothing else of consequence rides on it. There should be no lecture, definition, or literature summary up front; the ideas should reach participants through what they have to do. Please do not cite or recommend any readings: I already have the syllabus.

  Arrange the roles, rules, staged information, and payoffs so that participants collide with the following five complications on their own. The expressions 'expected value', 'fan-out', 'scaling exponent', 'replacement', and 'proxy transfer' should not be spoken until the debrief.

  1. **Fan-out rather than diversification.** Uncertainty about insect sentience is not spread across individuals; it is very nearly one bet. An enormous number of insects multiplied by a small probability is not a near-certainty of a large amount of welfare — it is a single coin flip with an enormous upside. Two allocations can share an expected value and differ completely in how that value is distributed across outcomes, and I want participants to feel that difference in their gut before anyone names it.

  2. **A hidden scaling exponent.** Suppose a creature's welfare capacity scales with its neuron count as n raised to some power α, where α is unknown: α = 0 for a threshold or any-mind view, α = 1 for a linear view, 0 < α < 1 for steeply diminishing returns, and possibly something other than neuron count doing the work. The comparison between very many very small nervous systems and few large ones flips depending on α, and nobody in the room knows α. The activity should make allocation decisions sensitive to α without ever letting participants settle it.

  3. **Replacement.** If insect populations are limited by resources rather than by deaths, then averting insect deaths may barely reduce the number of insects that ever live: prevented deaths make room for replacements. The headline number of individuals affected can therefore be enormous while the counterfactual difference is near zero. For farmed vertebrates the population is created by demand, so the counterfactual has a different structure altogether. I want participants to discover that "number of individuals helped" and "difference made" can come apart, and to discover it by being shown the mechanism rather than being told.

  4. **Proxy transfer.** Our evidence for sentience — flexible trade-off behaviour, learned avoidance, analgesic modulation, and the like — was calibrated on vertebrates. Applying it to insects assumes the link from proxy to sentience transfers across an enormous phylogenetic distance, which is a reference-class or base-rate problem rather than a simple evidential gap. Give participants evidence packets that look strong in isolation and let them notice that the strength depends on a transfer assumption they cannot check.

  5. **Cheapness is ambiguous.** Insect-directed interventions are cheap per individual affected, and that cheapness is what makes the scale argument bite. But cheapness is also some evidence about what is being measured, and about neglectedness rather than about welfare. Participants should be able to feel the pull of "the numbers are bigger" and also feel, later, that the cheapness was doing part of the work that the sentience probability was supposed to do.

  Practical constraints: stipulate every empirical figure yourself as an order of magnitude and hand it to participants as given — I do not want the session spent arguing about real entomology, neuron counts, or population estimates, and I do not want anything to depend on their being accurate. Supply a lookup table or pre-computed cards so that nobody stalls on arithmetic. Assign role cards carrying different prior credences about insect sentience, so that the committee contains both people who take insect sentience to be near-certain and people who take it to be near-zero, and require the committee to produce a single allocation (with provision for a recorded dissent that the scoring still tracks). No one should be able to sit out: every participant must make at least one binding choice. Assume no one present has any decision-theoretic training beyond the obvious.

  Structure your response in exactly these sections, in this order, with roughly the lengths indicated:

  - **Setup and materials** — about 150 words
  - **Roles, rules, and staged information** — about 450 words
  - **Scoring and stakes** — about 150 words
  - **Timeline** — about 200 words, with checkpoints across the 100 minutes
  - **What participants should run into, and when** — about 250 words
  - **Debrief** — about 500 words, mapping specific moments in the activity onto each of the five complications above, and onto the scale argument itself
  - **What will go wrong the first time I run it** — about 250 words, with how to handle each failure
  - **What the activity cannot deliver** — about 150 words, on which feature of the scale argument you, as facilitator, must simply state
reasoning: |-
  We are designing a 100-minute activity for 16 participants. The goal is for participants to feel the force of the scale argument regarding insect welfare, especially given the five complications, without prior lecturing. The activity frames participants as a funding committee deciding how to allocate a fixed budget between two interventions: one for insects and one for vertebrates.

  **Setup and Materials**
  Prepare two types of intervention cards: "Insect Habitat Protection" (IHP) and "Vertebrate Shelter Expansion" (VSE). Each card has a cost per unit and a description. IHP's description mentions "protecting habitats for a vast number of insects" and VSE's "expanding shelters for vertebrates". Also, prepare:
  - 16 role cards with varied prior credences about insect sentience (e.g., "You are convinced insects feel pain" vs. "You are skeptical of insect sentience").
  - Information packets for each intervention (see below).
  - A large board to track allocations and outcomes.
  - Pre-computed lookup tables for each intervention: for IHP, a table showing the number of insects affected based on the allocation, and for VSE, a table for the number of vertebrates. Include a column for "counterfactual impact" to address replacement (for IHP, this will be much lower than the headline number; for VSE, it will be close to the headline number).
  - A set of "uncertainty cards" for each intervention: for IHP, cards that assign a scaling exponent α (without naming it) and a sentience probability (without naming EV) in a hidden way. For VSE, the sentience probability is near-certain.
  - A fixed budget of 100 units (e.g., 100 tokens). 
  - A scoring system (see below).

  **Roles, Rules, and Staged Information**
  Participants are divided into four groups of four, each group representing a subcommittee. Each subcommittee must decide how to allocate their 25-unit share (25% of the total budget) between IHP and VSE. The total allocation is the sum of all subcommittee decisions. 

  Each participant receives a role card with a prior credence (e.g., "Biologist: You know insects exhibit complex behaviors but are unsure if it's sentience. P(sentience) ~ 0.3" or "Ethicist: You believe sentience requires a cortex. P(sentience) ~ 0.01"). 

  The information packets for each intervention are distributed:
  - **IHP Packet**: 
    - Headline: "Protecting 1 unit of habitat prevents the deaths of 1 billion insects per year."
    - But then: "Due to replacement (if we prevent deaths, other insects will fill the niche), the counterfactual impact is only about 1,000 insects saved per year." (Replacement)
    - "Evidence for sentience: Studies show insects avoid harmful stimuli and learn from experience. However, these proxies were developed for vertebrates and may not transfer." (Proxy transfer)
    - Lookup table: Allocation to IHP (units) -> Headline insects affected (billions) -> Counterfactual impact (thousands) -> "Welfare units" (which depends on α, but α is unknown; see below).
  - **VSE Packet**: 
    - Headline: "Shelter expansion saves 1 vertebrate per 100 units."
    - "Counterfactual impact: Since shelters are demand-driven, saving a vertebrate here directly reduces suffering by one."
    - "Evidence: Vertebrates show clear pain responses (analgesics work, self-sacrifice to avoid pain)."
    - Lookup table: Allocation (units) -> Vertebrates saved (counterfactual impact = headline number) -> Welfare units (linear with number).

  The catch: The "welfare units" for IHP are computed using a hidden scaling exponent α and a sentience probability p. Each subcommittee draws an "uncertainty card" for IHP that secretly sets:
    - p (sentience probability) as a number between 0.01 and 0.5 (varying by card).
    - α (scaling exponent) as 0, 0.5, or 1 (without naming α; instead, it says: "Assume welfare per insect is proportional to (neuron count)^x, where x is [0, 0.5, or 1]." Neuron count for an insect is given as 1 million, vs. 10 billion for a vertebrate. The card also states the welfare per insect relative to a vertebrate: e.g., for α=0.5, it's (1e6/1e10)^0.5 = 0.01. Then welfare per insect = p * relative value.

  The welfare units for IHP are then: counterfactual impact * welfare per insect.
  For VSE, welfare units = vertebrates saved * 1 (since sentience is near-certain and linear).

  But note: The uncertainty card is drawn only AFTER the subcommittee allocates. The fan-out complication: The welfare units for IHP are either 0 (if the insects are not sentient) or a huge number (if sentient, scaled by α). The card will specify two scenarios: "If sentient: welfare = [big number]. If not: 0." The probability p is given, so the expected welfare is p * big number. But the actual outcome is determined by a coin flip (weighted by p) after allocation.

  Rules:
  1. Subcommittees have 20 minutes to decide their allocation of 25 units.
  2. They must use their role card priors and the information packets.
  3. After allocation, each subcommittee draws an uncertainty card for IHP and a coin is flipped to determine if insects are sentient (according to p on the card). Then welfare units are computed.
  4. The total welfare is the sum of welfare from IHP and VSE for all subcommittees.

  **Scoring and Stakes**
  The department will donate 100 units of local currency proportional to the total welfare achieved. Specifically, if the total welfare units are W, then they donate W * (a fixed conversion rate, say 1 unit per 1000 welfare units, but this is arbitrary and does not affect the allocation decision). The key is that the allocation decision has real (though small) monetary consequences. Each participant also gets a "dissent token" to record if they disagree with their subcommittee's decision. The dissent is recorded but does not change the allocation. The scoring is done collectively, but the dissent tokens allow individual positions to be noted.

  **Timeline** (100 minutes total)
  - (0-5 min) Introduction: Explain the funding committee setup, budget, and that they must decide in subcommittees. Hand out role cards and information packets. Emphasize that the department will donate based on the outcome. No definitions or theory.
  - (5-25 min) Subcommittee deliberation: Groups of 4 discuss and allocate their 25 units. They must record their allocation and any dissent.
  - (25-30 min) Subcommittees report allocations to the whole group. The facilitator records the total allocation to IHP and VSE on the board.
  - (30-40 min) Uncertainty resolution: For IHP, each subcommittee draws an uncertainty card. The facilitator flips a coin for each subcommittee (weighted by p on their card) to determine if insects are sentient. Then welfare units are computed using the lookup tables and the uncertainty card (including α and the outcome of the coin flip). For VSE, welfare is computed directly.
  - (40-50 min) Welfare calculation: The facilitator computes total welfare and announces the monetary donation. 
  - (50-90 min) Whole group discussion: Participants discuss what happened and why. The facilitator prompts: "What surprised you?" and "What would you change?"
  - (90-100 min) Debrief: Facilitator connects the experience to the five complications and the scale argument.

  **What Participants Should Run Into, and When**
  During subcommittee deliberation (5-25 min), they will:
  - Notice the headline numbers for IHP are huge (billions) vs. VSE (a few). (Cheapness and scale)
  - But then see the counterfactual impact for IHP is much smaller (replacement). They must grapple with whether to use headline or counterfactual numbers.
  - See the evidence for insect sentience and question transfer (proxy transfer). Role cards will create disagreement.
  - The lookup table for welfare units for IHP requires them to assume a scaling (α) and a sentience probability, but they don't have α until after. They must decide without knowing α.

  After allocation (30-40 min), when uncertainty cards are drawn and flipped:
  - They see that IHP's welfare is either 0 or a huge number (fan-out). Groups that allocated a lot to IHP will have either a huge win or a total loss.
  - They see that the scaling exponent α dramatically changes the welfare per insect (hidden scaling exponent).

  In the whole group discussion (50-90 min):
  - They will notice that cheapness per individual made IHP attractive, but the uncertainty in sentience and scaling made it risky.
  - They will see that "number of individuals helped" (headline) was misleading because of replacement.

  **Debrief**
  Map the activity to the five complications and the scale argument:
  1. **Fan-out**: When the coin was flipped for IHP, participants saw that the outcome was binary: either massive welfare or nothing. This contrasts with VSE's certain but small gain. The expected value might have been the same, but the distribution was entirely different. (Mentioned at the coin flip moment.)

  2. **Scaling exponent**: The uncertainty card revealed that the welfare per insect depended critically on α (e.g., α=0 meant each insect counted equally, α=1 meant they were negligible). Without knowing α, the decision was highly sensitive to an unknown parameter. (Highlighted during the welfare calculation.)

  3. **Replacement**: The counterfactual impact for IHP was tiny compared to the headline number. Participants had to decide which number to use. Some might have used headline initially, then switched. (Noticed during deliberation and when seeing the welfare calculation.)

  4. **Proxy transfer**: The evidence packet for IHP looked strong (avoidance, learning) but the role cards and the note about transfer caused doubt. This made the sentience probability p subjective and contentious. (Evident in subcommittee disagreements.)

  5. **Cheapness is ambiguous**: IHP's low cost per headline individual made it seem incredibly cost-effective, but after seeing the counterfactual and the uncertainty, participants realized that cheapness might reflect that we are not actually affecting welfare (if not sentient) or that the welfare per individual is small (if α<1). (Discussed in the whole group discussion.)

  The scale argument itself was felt when they saw the huge potential upside of IHP (if sentient) and weighed it against the low probability. But they also saw that this upside was not a sure thing and depended on several factors.

  **What Will Go Wrong the First Time**
  - **Stalling on arithmetic**: Despite lookup tables, some groups might try to calculate. Solution: Emphasize that tables are pre-computed and they should use them.
  - **Ignoring replacement**: Some groups might miss the counterfactual note. Solution: During deliberation, circulate and ask: "Are you using headline or counterfactual numbers?"
  - **Dominant personalities**: Some participants might dominate. Solution: Assign roles (e.g., a facilitator per subcommittee) and use dissent tokens to encourage participation.
  - **Uncertainty card confusion**: The α and p might be misunderstood. Solution: Make the card very clear: "If sentient (probability p): welfare = ... . If not: 0." and the scaling is given as a relative welfare per insect.
  - **Time overrun**: The deliberation might take longer. Solution: Strict timekeeping and cut off at 20 minutes.

  **What the Activity Cannot Deliver**
  The activity cannot deliver a precise understanding of the scaling exponent α or the sentience probability p as formal concepts. Participants will feel the impact of not knowing α and the binary nature of the outcome (fan-out), but the facilitator must explicitly name and define "scaling exponent", "fan-out", "expected value", etc., in the debrief. Similarly, the concept of replacement and proxy transfer must be articulated and connected to the real-world literature. The activity creates the visceral experience, but the formal linking to decision theory and the philosophical nuances must be provided by the facilitator in the debrief.
answer: |-
  ### Setup and Materials
  Prepare:  
  - **16 role cards** with assigned priors on insect sentience (e.g., "Biologist: P(sentience) = 0.8"; "Skeptic: P(sentience) = 0.05"). Include brief rationale (e.g., "You’ve seen insects learn aversions" vs. "Insects lack cortex").  
  - **Intervention cards**: Two options—**Insect Habitat Shields** (IHS: protects 1 billion insects/unit) and **Vertebrate Rescue Kits** (VRK: saves 1 vertebrate/unit). Costs: IHS = 0.01 units/billion insects; VRK = 1 unit/vertebrate.  
  - **Information packets** for each intervention:  
    - IHS: Headline stats (e.g., "Saves 100B insects/unit!"), **Replacement clause** ("Note: Prevented deaths may be offset by new births"), **Proxy caveat** ("Evidence: Avoidance learning. But proxies (e.g., pain responses) are calibrated on mammals").  
    - VRK: Headline stats (e.g., "Saves 1 cow/unit!"), **Demand clause** ("Farmed populations adjust to demand: saving lives reduces future breeding").  
  - **Lookup tables** showing "welfare points" per unit allocated. For IHS, tables precompute outcomes for different α values (unbeknownst to participants) but hide α itself (e.g., "Welfare = [headline insects] × [sentience probability] × [neuron scaling factor]"). Neuron counts: insect = 1M, vertebrate = 10B.  
  - **Budget tokens**: 100 physical tokens (e.g., poker chips).  
  - **Outcome randomizer**: A coin/die to resolve sentience per group post-allocation.  

  ### Roles, Rules, and Staged Information  
  **Roles**:  
  - Participants split into **four subcommittees** (4 people each). Each subcommittee controls 25 budget units.  
  - Assign role cards randomly, ensuring each subcommittee has mixed priors (e.g., two "high-priors" and two "low-priors").  
  - **Mandate**: Each subcommittee must agree on a single allocation of their 25 units between IHS and VRK. Dissenters can file a token to record disagreement.  

  **Rules**:  
  1. **No upfront theory**: Begin with distributing materials. No definitions of terms like "expected value."  
  2. **Staged info**:  
     - **Phase 1 (Allocation)**: Subcommittees see only intervention cards and lookup tables. Tables for IHS show welfare as "Headline insects saved × P(sentience) × Scaling factor" but omit that scaling depends on α. P(sentience) is blank initially—participants must assign it based on role cards.  
     - **Phase 2 (Outcome)**: After allocations, each subcommittee draws a hidden "scaling card" (α = 0, 0.5, or 1) and flips a weighted coin for sentience (P = their assigned prior average). Welfare is computed using the card’s α and coin outcome.  
  3. **Constraints**:  
     - Use lookup tables for arithmetic (e.g., "IHS: 10 units → 1T insects → welfare = [value]").  
     - VRK welfare is certain and linear (1 vertebrate = 1 welfare point).  
     - Replacement/demand clauses are in packets but not highlighted—participants must notice them.  

  ### Scoring and Stakes  
  - **Welfare points**: Converted to real donation: 1 point = 1 local currency unit. Department donates total points × 100 (e.g., 5,000 points → 500 units).  
  - **Stakes**: Subcommittees compete for "most impactful" but collective donation depends on total welfare. Dissent tokens track individual objections but don’t alter scoring.  
  - **Binding choice**: All must participate in subcommittee votes. Failure to agree forfeits their budget.  

  ### Timeline (100 min)  
  - **0–5 min**: Introduce committee task, budget, and interventions. Distribute roles, packets, tokens. No definitions.  
  - **5–30 min**: **Subcommittee deliberation**: Allocate 25 units using packets. Facilitator circulates, answers logistical questions only (e.g., "Where’s the lookup table?").  
  - **30–40 min**: **Report allocations**: Subcommittees announce splits. Record total IHS/VRK allocation on a central board.  
  - **40–50 min**: **Resolve uncertainty**: Each subcommittee draws a scaling card (α), flips coin for insect sentience, computes welfare using tables.  
  - **50–70 min**: **Outcome calculation**: Sum welfare points. Announce donation amount.  
  - **70–90 min**: **Open discussion**: "What drove your choices? What surprised you?"  
  - **90–100 min**: **Structured debrief** (see below).  

  ### What Participants Should Run Into, and When  
  - **During deliberation (5–30 min)**:  
    - **Proxy transfer**: High-prior roles cite IHS evidence; low-priors note "this evidence came from vertebrates!" (clause in packet).  
    - **Replacement vs. demand**: Some notice IHS’s "deaths offset" clause and debate if headline numbers matter; others see VRK’s demand clause but intuit it’s less drastic.  
    - **Cheapness ambiguity**: IHS’s low cost/individual ("only 0.01 units!") lures allocations, but skeptics ask, "Is cheapness a sign of low welfare?"  
  - **During outcome (40–50 min)**:  
    - **Fan-out**: Coin flips make IHS welfare all-or-nothing (e.g., 0 or 10,000 points). Groups who bet big feel elation/crash.  
    - **Hidden scaling exponent**: α cards reveal IHS welfare swung wildly with α (e.g., α=0: huge points; α=1: near-zero). Participants see they gambled on an unknown.  
  - **Discussion (70–90 min)**:  
    - "We focused on numbers, but replacement made them meaningless!" (replacement).  
    - "IHS felt like a lottery ticket—huge win or bust" (fan-out).  
    - "Why did we trust insect evidence when it’s from mammals?" (proxy transfer).  

  ### Debrief  
  **Map activity to complications**:  
  1. **Fan-out**: When groups flipped coins, they *felt* the tension between VRK’s certain small gains and IHS’s binary mega-payout. No one named "expected value," but they saw identical EV allocations yield joy/despair based on luck. Ask: "Who celebrated/sank at the flip? That’s the distribution of risk."  
  2. **Scaling exponent**: Post-outcome, reveal α drove IHS welfare swings. Ask: "Did you debate neuron scaling? No—you assumed a value. But α is unknown, and it flips which intervention wins." Contrast α=0 (any-mind) vs. α=1 (linear) outcomes on the board.  
  3. **Replacement**: Highlight groups who downgraded IHS after noticing the "offset" clause. Ask: "How many used headline numbers initially? Who switched? That’s replacement—affecting individuals ≠ changing total welfare." Contrast VRK’s demand clause (population adjusts, but welfare gain is real).  
  4. **Proxy transfer**: Point to role-based clashes over evidence. Ask skeptics: "Why doubt avoidance learning?" Elicit: "It’s a vertebrate proxy." Note: "You faced a base-rate problem—no data on proxy transfer across species."  
  5. **Cheapness ambiguity**: Ask: "Who allocated to IHS because ‘per individual it’s cheaper’?" Then: "But cheapness could mean low welfare per individual (α) or low probability (P). You conflated scale with certainty."  
  **Scale argument**: The activity made them *feel* the allure of big numbers (IHS headlines) and the dread of uncertainty (coin flip, α). Emphasize: "Scale alone doesn’t dictate—it interacts with deep unknowns."  

  ### What Will Go Wrong the First Time  
  - **Subcommittees fixate on headline numbers**: Some ignore replacement clauses. *Handling*: During deliberation, ask probing questions: "Are you using the ‘insects saved’ number? Check the fine print."  
  - **Dominant personalities override roles**: Strong voices ignore assigned priors. *Handling*: Assign a "priors enforcer" per subcommittee; remind them roles constrain P(sentience).  
  - **Welfare calculation bogs down**: Groups stall on tables. *Handling*: Pre-test tables for simplicity; provide calculators; impose a 2-min computation limit.  
  - **Biologists derail with entomology**: Visitors debate real insect biology. *Handling*: Intervene: "Use only given numbers; this is about decision-making under uncertainty."  
  - **Skeptics refuse to engage**: Low-prior roles disengage, calling IHS absurd. *Handling*: Emphasize real donation stakes; ask them to articulate their view using packet clauses.  

  ### What the Activity Cannot Deliver  
  The activity **cannot directly teach the formal structure of fan-out versus diversification**. Participants will *feel* the volatility of a binary bet but not grasp why it diverges from a diversified portfolio. You must explicitly state: "Fan-out means all welfare hinges on one uncertainty—here, insect sentience. It’s not spreading risk across individuals; it’s one coin flip for everything." Similarly, **proxy transfer’s base-rate problem** remains intuitive; you must clarify: "Transfer assumes proxies work the same in insects as vertebrates, but without cross-species calibration, it’s a leap." Finally, the **scaling exponent’s decisiveness** must be underscored: "α is a power law in the welfare function, and its value reverses which intervention is better—but we have no data to set it." The activity creates embodied tension; you crystallize it with theory.
