  Okay, let me approach this systematically. The user wants a rigorous framework for evaluating theories of personal identity in the teletransporter scenario, with clear desiderata and critical analysis. 

  First, I need to establish the core functions of a survival theory: prudential reasoning, moral obligations, and metaphysical determination. The user specifically wants these tied to concrete cases, including some unusual variants they've proposed. 

  For prudential reasoning, I consider cases like dementia and gradual replacement - these test whether a theory can handle degrees of survival. The partial scan case (97% fidelity) directly challenges the all-or-nothing views. Moral obligations get tested through fission/fusion scenarios where identity and concern might diverge. 

  The three special cases proposed are particularly telling: 
  - Partial scan exposes how theories handle approximation and error
  - Staggered instantiation forces confrontation with time gaps in identity
  - Re-fusion directly attacks the transitivity requirement of most theories

  I suspect the deepest tension is between determinacy (wanting clear answers to "will it be me?") and accommodating degrees of survival. Psychological continuity theories can handle degrees but struggle with determinacy; further-fact views force determinacy at cost of epistemic access. 

  Animalism gets problematic fast - it would reject any teleportation as death, but then how do we explain our intuition to care about the replica? The no-further-fact view handles fission best but makes identity conventional. 

  Ultimately the user seems to be probing whether any theory can satisfy all three core functions without artificial constraints. The answer appears to be no - we must choose which function to prioritize, hence their suspicion that determinacy and one-one requirements might be negotiable.
answer: |-
  Here is a specification of desiderata for an account of "what matters in survival," structured by purpose, grounded in cases, and analyzed for negotiability:

  ### Core Purposes & Non-Negotiable Desiderata
  1.  **Prudential Rationality (What to Care About):**
      *   *Desideratum:* The theory must explain why an agent has *prudential reason* (self-interested concern) for the future experiences of the person emerging from the teletransporter, or lack thereof. This includes reasons to anticipate, fear, hope for, or be indifferent to those experiences.
      *   *Cases/Constraints:*
          *   **Sleep:** Must explain continuity of self-concern across periods of unconsciousness, even if no psychological connections hold during sleep. *(Non-Negotiable - Foundational to self-concern)*
          *   **Gradual Cerebral Replacement:** Must explain why replacing neurons one-by-one with synthetic duplicates (while conscious) preserves prudential concern for the future resulting person, even if no original matter remains. *(Non-Negotiable - Shows continuity isn't brute physical identity)*
          *   **Dense Amnesia (Non-Dementia):** Must explain why profound, non-degrading amnesia (e.g., due to injury) does *not* typically extinguish self-concern for one's future, even if psychological connections to the past are severed. *(Non-Negotiable - Shows continuity isn't just memory)*
          *   **Partial Scan (97%):** Must deliver a verdict on the *degree* of prudential concern warranted for the result compared to a perfect scan or normal survival. Does 3% confabulation significantly diminish "mattering"? *(Constraint - Tests "degrees of survival")*
      *   *Key Distinction:* Must not collapse *being me* (metaphysical identity) and *mattering to me* (prudential significance). Something can matter without being "me" (e.g., my child), and "being me" might not matter in certain contexts (e.g., fission). *(Non-Negotiable)*

  2.  **Moral Obligation (What is Owed):**
      *   *Desideratum:* The theory must determine the moral relationship between the pre-scan agent and the post-scan person. Does the agent owe obligations *to* the result (e.g., not to harm it)? Does the result owe obligations *to* the agent (e.g., promises, debts)? Does the result inherit the agent's rights and responsibilities?
      *   *Cases/Constraints:*
          *   **Stored Scan, Staggered Instantiation (One Copy):** If Copy A is instantiated at year 5 and dies at year 10, and Copy B is instantiated minutes later from the same scan, what obligations does the agent (at year 0) have to Copy B? Does Copy B inherit obligations *from* Copy A? *(Tests persistence through storage/gaps)*
          *   **Stored Scan, Concurrent Copies:** If both A and B run concurrently for a decade, what obligations does the agent (pre-scan) have to *each*? Do A and B owe obligations *to each other*? Who inherits the agent's debts? *(Tests one-one constraint)*
          *   **Dementia:** Must explain the gradual shift in moral status and obligations (e.g., power of attorney, consent capacity) as psychological connectedness degrades. *(Non-Negotiable - Real-world application)*
      *   *Key Distinction:* Must distinguish the question of *who is who* (identity for obligation-tracking) from the question of *what to care about* (prudential concern). Obligations might track identity more strictly than prudential concern. *(Non-Negotiable)*

  3.  **Metaphysical Determinacy (The Question "Will it be me?"):**
      *   *Desideratum:* The theory must state whether the question "Will *I* be the person who emerges?" has a determinate yes/no answer in standard teletransportation, or if it is fundamentally indeterminate/meaningless in a way that should alleviate existential anxiety.
      *   *Cases/Constraints:*
          *   **Re-fusion:** After ten years apart, two fission branches are averaged into one recipient. Is this recipient identical to the pre-fission original? Identical to each branch? Neither? Does the answer matter prudentially or morally? *(Tests transitivity, determinacy under fusion)*
          *   **Partial Scan (97%):** Does the question become vague or indeterminate? At what threshold (if any) does "Will it be me?" clearly become "No"? *(Tests boundary problems)*
          *   **Gradual Replacement:** Is there a precise moment when "I" cease to exist during replacement, or is it vague? *(Tests determinacy requirement)*
      *   *Key Distinction:* Must distinguish *what matters* (prudential concern) from *what matters most* (if degrees exist). An indeterminate answer to "Is it me?" need not imply indifference if significant prudential concern remains. *(Non-Negotiable)*

  ### Contested Desiderata & Arguments
  4.  **Survival Admits of Degrees:**
      *   *Desideratum:* The theory should accommodate the intuition that survival/continuity can be a matter of degree, influenced by the *amount* and *kind* of psychological connectedness/continuity or physical realization.
      *   *Motivation:* Partial Scan (97%), Dementia, Gradual Replacement. All suggest continuity isn't simply all-or-nothing. Prudential concern and moral obligations seem to fade gradually in dementia, not vanish at a single threshold.
      *   *Negotiability:* **Contested.** Animalism and some further-fact views resist degrees. *Argument Against:* Survival is existence; you either exist or you don't. Degrees apply to *what matters*, not existence itself. *Argument For:* Existence might be binary, but *being the same person* (the relatum of survival) supervenes on physical/psychological properties that degrade gradually. Denying degrees forces implausible thresholds in Gradual Replacement and Dementia.

  5.  **Survival is One-One:**
      *   *Desideratum:* Survival is a unique relation; a person can only survive as *one* future person.
      *   *Motivation:* Intuition against "splitting" identity. Stored Scan, Concurrent Copies directly challenges this.
      *   *Negotiability:* **Contested (Strong Prejudice).** *Argument For:* Logical consistency (avoiding contradiction: A=B and A=C but B≠C), ordinary concept of identity. *Argument Against:* Fission cases (Stored Scan, Concurrent Copies) show our prudential concern *can* rationally extend to multiple descendants. Insisting on one-one forces either implausible non-survival (rejecting concern for *any* copy) or arbitrary selection of "the real one" (violating symmetry). The purpose is "what matters," not preserving an absolute identity concept at all costs.

  6.  **Survival is Always Determinate:**
      *   *Desideratum:* The question "Will I survive as that person?" always has a definite yes/no answer.
      *   *Motivation:* Desire for metaphysical clarity, avoiding vagueness in identity.
      *   *Negotiability:* **Contested (Strong Prejudice).** *Argument For:* Identity is a fundamental relation; vagueness is only epistemic. *Argument Against:* Cases like Partial Scan and Re-fusion suggest the supervenience base (brain states, psychology) itself admits of vagueness or indeterminacy. Insisting on determinacy forces arbitrary precisification where none exists in the phenomena, potentially misaligning the theory with actual patterns of prudential concern and moral reasoning (which may accept indeterminacy). The core purposes (especially prudential) may be served better by accepting indeterminacy where it arises naturally.

  ### Which Desiderata Conflict?
  *   **The Sharpest Conflict:** **One-One Survival (5)** and **Survival Admits of Degrees (4)** fundamentally clash with **Prudential Rationality (1)** in fission cases (Stored Scan, Concurrent Copies).
      *   *Why:* If survival must be one-one (5), then in fission, *neither* copy can be the survivor (or one must be arbitrarily chosen), implying the agent has *no* prudential reason to care about either outcome. This contradicts the strong intuition that the agent *should* care prudentially about *both* future persons (1), as they are both psychologically continuous with her. Admitting degrees (4) allows concern to "split" proportionally, satisfying (1) but violating (5). Rejecting (5) (e.g., No-Further-Fact view) also satisfies (1).

  ### The Most Excluding Requirement
  *   **Survival is One-One (5)** does the most damage to otherwise attractive views. It forces:
      *   **Psychological Continuity:** To deny survival in fission (Parfit's "empty question"), sacrificing a straightforward account of prudential concern for descendants.
      *   **Animalism:** To deny survival in *any* teletransportation/fission scenario, making prudential concern for the replica deeply mysterious.
      *   **Further-Fact:** To posit an undetectable, non-physical/psychological "self" that arbitrarily jumps to one branch or perishes, making survival epistemically inaccessible and potentially irrelevant to prudential concern.
      *   Only the **No-Further-Fact** view (typically coupled with psychological continuity *without* demanding one-one identity) embraces the implications of fission for prudential concern, but it abandons strict identity determinacy and one-one survival.

  ### Compressed Scorecard
  | View                 | Prudential (1) | Moral (2)        | Determinacy (3) | Degrees (4) | One-One (5) | Key Tensions                                                                 |
  | :------------------- | :------------- | :--------------- | :-------------- | :---------- | :---------- | :--------------------------------------------------------------------------- |
  | **Animalism**        | Fails (Replica ≠ Me) | Fails (No obligation) | Determinate (No) | Rejects     | Insists     | Cannot explain concern for replica; obliterates teletransport as survival.   |
  | **Psych Continuity** | Good (If accepts degrees/splitting) | Good (Tracks continuity) | Indeterminate (Fission/Fusion) | Accepts     | Rejects (Fission) | Struggles with determinacy demands; "only connectedness matters" may feel thin. |
  | **Further-Fact**     | ? (If "soul" transfers) | ? (If "soul" transfers) | Determinate       | Rejects     | Insists     | Epistemically empty; arbitrary in fission; conflicts with gradualism (Dementia, Replacement). |
  | **No-Further-Fact**  | Good (Concern tracks continuity) | Good (Tracks continuity) | Indeterminate (Fission/Fusion) | Accepts     | Rejects     | Accepts indeterminacy; may feel like it abandons "real" identity; handles fission best. |

  **Key:** "Good" = Satisfies desideratum well in core cases. "?" = Depends on unspecified mechanism/access. "Fails" = Cannot satisfy without major revision.

  **Conclusion:** The most significant tension lies between accommodating *prudential concern in fission* (which requires rejecting the **One-One Survival** constraint) and satisfying demands for **Determinate Identity**. The **Non-Negotiable** core is explaining prudential concern across sleep, gradual replacement, and amnesia, distinguishing it from moral obligation and metaphysical identity questions. The **Partial Scan**, **Staggered/Concurrent Copies**, and **Re-fusion** cases powerfully challenge the negotiability of **One-One Survival** and **Determinacy**, showing how they conflict with plausible accounts of prudential concern and moral obligation in non-standard scenarios.
