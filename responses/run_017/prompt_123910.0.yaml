prompt: |-
  I sit on the ethics committee of a mid-sized community hospital, and after about a year of cases I have noticed that my votes do not line up with any rule I am able to state out loud. I would like help finding the rule, or finding out that I do not have one. I am not asking what the law here requires; I know that, and it settles less than people expect. I want the moral principle. Here are the cases as I remember them, with how I voted.

  (1) Marta, 34, bipolar I, three hospitalizations, each following her decision to stop lithium during a manic episode. During a stable period she signed a document asking that if she became manic and refused medication, she be treated anyway, including against her will. Six months later she was manic, sleeping two hours a night, had spent her savings, and said she had never felt better and that lithium was poison. I voted to treat her. This is the case I am most confident about: the person who signed it seems to me simply to have been thinking more clearly than the person objecting.

  (2) Mrs. H., 74, moderate Alzheimer's. She recognizes no one, speaks almost nothing, but smiles, eats well, sings along with songs from her twenties, and appears content. At 62, after sitting through her sister's death in intensive care, she signed a directive refusing artificial feeding, ventilators, and antibiotics for infection if she ever had advanced dementia. She now has pneumonia. Her daughter asks for a course of antibiotics, which would almost certainly return her to exactly the state I have described. I voted to treat.

  (3) A man in his late thirties, unconscious after a road accident, intubated in intensive care. A directive surfaces that he signed at 26, during what his family describes as a long untreated depression — he was never declared incompetent and was working full time at the time — refusing life-sustaining treatment of any kind. His wife says he has been well for a decade, that the document does not reflect him, and that he would want to be treated. I voted to treat.

  (4) Mr. R., 58, in a persistent vegetative state after an anoxic brain injury. Two years earlier he had written, and told his family repeatedly, that he wanted everything done for as long as there was any chance, and he gave a religious reason: life is a gift that is not his to end. His wife and two adult children ask that treatment stop; they say this is not what he would have wanted, that he never pictured this. I voted to stop. This is the vote I am least comfortable with, since I am overriding an explicit, competently made wish in favor of a family's judgment about a patient who cannot speak.

  (5) Mr. D., 71, advanced dementia, cheerful, apparently free of distress, with a urinary infection. His directive, written at 55, says in effect: I have read that people with dementia often seem content and report good quality of life. I believe that, and I still do not want that life. What made my life mine was following my own thoughts and being able to share them with the people I love; a life without that is not one I want prolonged by treating infections or by tube feeding. I voted to withhold antibiotics — with far more hesitation than in (1), and I cannot say why my votes in (2) and (5) differ, since the two patients' situations look to me the same and the outcomes I am choosing are opposite.

  (6) Ms. K., 46, terminal ovarian cancer, entirely competent, a devout Catholic for six years. At 28 she signed a directive refusing heroic measures; she never revoked it. She now wants a second surgery and intensive care if it comes to that, and says that suffering accepted willingly has meaning. Her brother says the document should stand and that her conversion is a product of fear. I voted for her current wishes.

  My tentative principle is this: an advance directive binds just when the person who wrote it is the person who will have to live through — or die through — what it asks for. Marta will come back and be the one who bears the outcome of being medicated, so her document binds. Mr. R. will not be there to bear anything, so his does not. But (5) does not fit my own principle: Mr. D. is not the one living through the infection either, and I still voted to honor him.

  What I would like from you: state a principle precisely enough that I could take it into a meeting, clause by clause, with the case that forces each clause. Test mine against the six cases and repair it if it can be repaired. Say plainly which of my votes a defensible principle would force me to give up, and which vote you think is the weakest. Then give me its verdicts on three cases I have not put to it: a demented patient whose apparent contentment is the only evidence of her wishes and who never signed anything; a directive whose enforcement would commit a family to years of caregiving they cannot afford; and a directive written before a treatment existed that now substantially improves the outlook it was written against. Finally, tell me whether the principle you land on has to take a position on whether the earlier self and the later self are the same person — and if it does, whether it can be restated so that it does not have to.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from a hospital ethics committee member. The user has presented six complex cases where their intuitive votes seem inconsistent with any clear principle, and they're struggling to articulate a coherent moral framework. What makes this particularly interesting is that they've already identified legal standards aren't sufficient here - they're digging for deeper philosophical grounding.

  Looking at their cases, I notice several tension points: the weight given to past vs present expressions of will, the role of identity continuity, and how we assess "bearing the consequences" of medical decisions. Their proposed principle about "who lives through the outcome" is insightful but clearly fails in case 5 with Mr. D. 

  The user seems intellectually honest - they openly admit discomfort with some votes (especially case 4 where they overrode explicit religious directives) and confusion about why cases 2 and 5 got opposite votes despite similar scenarios. Their request for new test cases shows they're serious about stress-testing any proposed principle.

  I should be careful not to lecture - they clearly have deep practical experience. Instead, I'll treat this as collaborative philosophy. The personal identity question at the end suggests they've been reading Parfit or similar, so I'll engage at that level while keeping it clinically relevant.

  For the proposed principle, I need to reconcile why Mr. D's directive binds (case 5) while Mrs. H's doesn't (case 2). The key might lie in the nature of the refusal - Mr. D explicitly rejects "contented dementia" as non-life while Mrs. H was refusing ICU suffering. Also noteworthy is how current experience factors in: Mrs. H shows clear positive affect while Mr. D's directive describes his current state as precisely what he rejected.

  The three new test cases they propose are brilliant for exposing weaknesses: the non-verbal patient forces us to define "expression", the family burden case tests whether consequences matter, and the outdated directive challenges temporal validity. I'll need to show how the principle handles each.

  Most importantly, I must address the personal identity question directly. Their intuition in case 3 (overriding the depressed man's directive) already suggests they don't see earlier and later selves as identical in authority. But we might reframe using "narrative identity" rather than metaphysical identity to avoid that rabbit hole.
answer: |-
  Based on your votes and the reasoning you've provided, your core principle seems rooted in **respecting the authentic expression of the person who will experience the outcome, prioritizing current experiential evidence when the directive conflicts with observable well-being or when the directive's author lacked relevant perspective.** Your tentative principle captures part of this, but needs refinement to account for case (5) and the nuances of identity and experience.

  Here's a refined principle, stated precisely with clauses derived from your cases:

  **The Principle of Contextualized Future-Directed Autonomy:**
  1.  **Binding Force:** An advance directive expressing refusal of specific interventions is presumptively binding **if**:
      a.  It was made during a period of decisional capacity, *and*
      b.  The intervention in question is addressed by the directive, *and*
      c.  The directive reflects a stable, authentic value judgment relevant to the anticipated future state.
  2.  **Overriding Conditions:** This presumption may be overridden **if any** of the following apply:
      a.  **Experience-Outcome Mismatch:** The directive demands an outcome (e.g., death, prolonged suffering) that demonstrably conflicts with the *current, observable well-being and expressed preferences* of the patient, where the patient retains a capacity for minimal experiential awareness, *or*
      b.  **Perspective Deficit:** The directive was made without sufficient understanding or accurate anticipation of the specific state it now governs (e.g., due to lack of experience, significant change in medical context, or a mental state impairing accurate projection), *or*
      c.  **Identity Disruption:** There is compelling evidence that the directive-maker's core identity or fundamental values have undergone a significant, stable, and authentic transformation since the directive was made, rendering it alien to the person now experiencing the outcome.
  3.  **Default to Directive:** In the absence of clear evidence meeting conditions (2a), (2b), or (2c), the directive stands.

  **Testing Against Your Cases & Repairing Your Principle:**

  1.  **Marta (Treat):** Fits perfectly. Directive meets (1a, b, c) - stable value judgment made competently about a foreseeable state. No overriding condition applies (2a: Current state involves suffering/impairment, directive aims to relieve it; 2b: She understood mania; 2c: Identity stable). **Vote upheld.**
  2.  **Mrs. H. (Treat):** Directive meets (1a, b, c). *However*, Overriding Condition (2a) applies: The directive demands death from pneumonia, but the patient *demonstrably* experiences contentment and well-being in her current state. Enforcing the directive would create suffering (death) where none currently exists, conflicting with her observable well-being. **Vote upheld.** (Explains difference from (5)).
  3.  **Man Post-Accident (Treat):** Directive meets (1a, b). *However*, Overriding Condition (2b) likely applies: Made during "long untreated depression," impairing his ability to accurately project a future where life might be valued. His wife provides compelling evidence his values changed. Condition (2c) *could* also apply. **Vote upheld.**
  4.  **Mr. R. (Stop):** Directive meets (1a, b, c) - explicit, competent, value-based (religious). *No overriding condition clearly applies:* (2a) He experiences nothing, so no *current* well-being conflict. (2b) He arguably understood the *possibility* of PVS. (2c) No evidence his core religious identity changed. **Your vote requires giving up.** A defensible principle forces honoring the directive here. This is your weakest vote by the principle's standard.
  5.  **Mr. D. (Withhold):** Directive meets (1a, b, c) - specifically addresses *this exact state* ("life without that is not one I want prolonged"). *Overriding Conditions do NOT apply:* (2a) His directive *explicitly acknowledges* the potential for apparent contentment ("seem content... report good quality of life") but *rejects it* as insufficient *for him*. Enforcing the directive aligns with his expressed values *about* his experience. No observable well-being conflict changes his pre-defined threshold. (2b) He had remarkable foresight about this precise state. (2c) No evidence of value change. **Vote upheld.** (Explains difference from (2): Mr. D. anticipated and rejected "contentment" as a reason to live; Mrs. H. did not).
  6.  **Ms. K. (Honor Current Wishes):** Directive meets (1a, b). *However*, Overriding Condition (2c) applies: Her conversion to devout Catholicism represents a significant, stable, and authentic transformation of her core values and identity regarding the meaning of suffering and life's end. The directive no longer reflects her authentic self. **Vote upheld.**

  **Verdicts on New Cases:**

  1.  **Demented Patient, Apparently Content, No Directive:**
      *   **Principle Verdict:** Treat the infection. Clause (1) doesn't apply (no directive). Without an explicit refusal, and with observable well-being (contentment), treatment aligns with promoting well-being. The principle doesn't require inferring a desire to die from dementia alone.

  2.  **Directive Enforcement Imposes Unsustainable Family Burden:**
      *   **Principle Verdict:** The directive *must still be enforced* unless an overriding condition applies. The principle focuses solely on the patient's authentic wishes and experience. Family burden, while a profound practical and emotional hardship, is not an overriding condition within *this* principle. (This highlights a potential limitation; ethics committees must consider this burden separately within resource/fairness frameworks, but it doesn't negate the directive's moral force under *this* specific principle).

  3.  **Directive Written Before New, Effective Treatment Exists:**
      *   **Principle Verdict:** Overriding Condition (2b) likely applies. The directive was made without understanding or accurately anticipating the *specific medical context* now available. If the new treatment substantially alters the prognosis or quality of life outcome envisioned by the directive-maker (e.g., refusing dialysis before portable/wearable options existed), the directive lacks sufficient perspective for *this specific scenario* and should not bind. The current clinical reality must be re-evaluated, potentially involving surrogate decision-makers if the patient lacks capacity.

  **Personal Identity Question:**

  *   **Does the principle require a position on sameness of person?** **Yes, implicitly.** Conditions (2a) and (2c) especially rely on judgments about the continuity or discontinuity between the directive-maker and the patient experiencing the outcome. (2a) asks if the *experiencing person* is suffering against their directive, implying the directive-maker *is* that person. (2c) explicitly addresses a fundamental change in identity.
  *   **Can it be restated to avoid this?** **Not entirely without losing its core insight.** However, it can be reframed to focus on **narrative identity and experiential continuity** rather than strict metaphysical personal identity:
      *   *Reframed Principle Focus:* The directive binds if it represents an authentic expression of the *narrative self* whose life story the intervention will affect, made with sufficient understanding of the relevant future chapter. It can be overridden if enforcing it would contradict the *current experiential narrative* of well-being (where minimal awareness exists) or if the directive reflects the values of a *narratively distinct prior self* whose perspective is fundamentally incompatible with the current self's identity and experience.
      *   *Why this helps:* It shifts from a metaphysical "same person?" question to a practical and ethical one about whose story, perspective, and experience we are respecting *in this moment of intervention*. It acknowledges that identity can be understood as a narrative construct that may or may not feel continuous to the individual or observers.

  **Conclusion:**

  Your principle, refined as the **Principle of Contextualized Future-Directed Autonomy**, respects the core intuition behind your votes: advance directives are powerful expressions of autonomy that deserve significant weight, *unless* enforcing them would actively harm a presently experiencing self that finds value in continued life, or unless the directive was made without the perspective necessary to understand the reality it now governs, or unless it represents a self that no longer exists in any meaningful narrative sense. This principle forces you to reconsider your vote in Case 4 (Mr. R.), as no valid overriding condition existed. It provides a robust framework for the other cases and the new scenarios, firmly grounding the decision in the patient's evolving story, values, and lived experience.
