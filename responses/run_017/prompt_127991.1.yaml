answer: |-
  ### Part 1: Diagnosis
  The critical flaw is in **step (6)**: the inference that attitude-dependence implies *no attitude-independent facts*. This equivocates between **origin/constitution** and **current operational reality**. While racial categories *originate* from attitudes/practices, once institutionalized (e.g., via laws, housing patterns, or facial recognition datasets), they generate *objective social facts* with measurable causal power—independent of current beliefs. Step (6) mistakenly treats all attitude-dependence as requiring *ongoing, conscious endorsement*, like money. This ignores how socially constructed categories become inertially "frozen" into systems, creating durable structures (e.g., wealth gaps) that persist even if attitudes shift. The argument *looked* acceptable because it parallels money’s dependence on acceptance, but races are institutionalized *differently*: money collapses without *current* collective intent; race persists via *historical* sedimentation.

  **Cheapest alternatives to reject:**  
  - **Step (6)** (cost: abandon the idea that *all* attitude-dependence entails ephemerality; retain robust constructionism).  
  - **Step (8)** (cost: concede inequality claims are "scheme-relative" but argue this doesn’t undermine their political/legal force; weakens objectivity).  
  - **Step (5)** (cost: deny race is constructed like money; risks biological realism or eliminativism).  

  Rejecting (6) is cheapest: it preserves constructionism while blocking the eliminativist slide.

