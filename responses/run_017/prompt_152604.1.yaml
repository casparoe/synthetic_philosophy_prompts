prompt: |-
  hey — I'm a 3rd-year PhD student in political philosophy working on distributive ethics, and I've been chewing on an argument for about three weeks that I'm pretty sure proves too much. I can't locate the bad step. Would appreciate a second pair of eyes.

  Setup so we're using the same words: by prioritarianism I mean the view that outcomes are ranked by the sum of a concave, increasing transform of each person's welfare — take f(w) = √w as the working example, so an outcome's value is Σ √wᵢ. Everyone knows the selling point: unlike egalitarianism, prioritarianism never says a levelling down is an improvement, because any increase in anyone's welfare raises the sum.

  Here's the argument (mine mostly, though a friend in the departent helped me get step 7 into shape):

  (1) No-levelling-down: an outcome A isn't better than an outcome B if nobody is better off in A than in B and someone is worse off in A.
  (2) That's the levelling-down objection, and it's what sinks egalitarianism: if equality has intrinsic value, then moving from (12, 8) to (8, 8) — the better-off person down to 8, the worse-off person unchanged — can be an improvement overall, even though nobody gains and somebody loses. That's unacceptable, so egalitarianism is out.
  (3) Prioritarianism escapes this. Since f is increasing, levelling down always lowers Σ f(wᵢ). No levelling down is ever an improvement. That's supposed to be the whole point: you keep what's attractive aboutegalitarianismwithout paying for it.
  (4) But we don't only rank sure outcomes; we rank prospects, i.e. choices under uncertainty. And the natural extension of (1) to prospects is: a prospect A isn't better than B if nobody is better off under A and someone is worse off — where being better off under a prospect just is having higher expected welfare, since that's what it is for an uncertain option to be better for you.
  (5) Now the case that breaks it. Two people, Ann and Ben, √ weights. P: (4, 4) for sure. Q: a fair coin, heads (10, 0), tails (0, 10). Under Q each person's expected welfare is 5; under P it's 4. So by (4) nobody is better off under P and both are worse off. But the prioritarian values are P = √4 + √4 = 4 and Q = ½(√10 + 0) + ½(0 + √10) = √10 ≈ 3.16. Prioritarianism prefers P: a prospect that is worse for everyone.
  (6) So the escape in (3) only works for sure outcomes. And essentially every real policy choice involves uncertainty, so the escape covers almost nothing.
  (7) Worse: if the thought behind (1) is that betterness has to be traceable to somebody's being better off, and you hold onto that in full generality — outcomes and prospects — then combined with expected utility you get pushed the whole way to utilitarianism (the Harsanyi-style aggregation result: respect everyone's preferences under risk, add the usual rationality constraints, and social value is a weighted sum of expected utilities). So the levelling-down objection doesn't take you from egalitarianism to prioritarianism; run honestly it takes you to plain utilitarianism, which is where we started and which none of us want.

  I dont accept the conclusion, and I'd rather keep (3) than (4) — the sure-outcome escape feels like the entire reason to be a prioritarian. But I can't say which step is doing the illicit work, and I'm scared that rejecting (4) loses me (1) as well, in which case I've got no objection left against the egalitarian. I also tried the obvious fix — apply the weights to expected welfare rather than to final outcomes, so value = Σ f(E[wᵢ]) — and that does flip the case in (5), but it seems to buy it by ignoring who actually ends up badly off, which is the thing I wanted priority for in the first place.

  Which step do you reject, why does it look fine, and what does rejecting it cost me? If there are two or three exits, price them against each other instead of just picking one.

  Give me your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my setup back to me.
reasoning: |-
  Okay, the user is a PhD student in political philosophy working on distributive ethics, specifically prioritarianism. They've been stuck on an argument that seems to show prioritarianism leads to utilitarianism when considering uncertainty, which they don't want. They've laid out a seven-step argument and want to know which step to reject without losing the core appeal of prioritarianism.

  Hmm, the key conflict is between steps (4) and (3). Step (4) claims the no-leveling-down principle should apply to prospects by comparing expected welfare. But step (5) shows this leads to a contradiction under prioritarianism: everyone has higher expected welfare in Q, but prioritarianism prefers P. 

  The user's fear is that rejecting (4) weakens their objection to egalitarianism. But actually, the move isn't symmetrical. Egalitarianism violates no-leveling-down for sure outcomes (step 2), which is more fundamental. Prioritarianism only faces issues under uncertainty. 

  The core insight is that "better off" means different things in risky vs certain contexts. For prospects, it's about expected welfare. But prioritarian weighting happens at the outcome level, not prospect level. So when comparing prospects, we shouldn't expect the no-leveling-down principle to hold in terms of expected welfare because the transformation f is applied to realized welfare, not expectations. 

  Rejecting (4) doesn't force abandoning (1) because (1) is about actual welfare in outcomes, while (4) tries to extend it to expected welfare in prospects. The principle traces betterness to actual gains, not expected ones. So in the coin flip example, though both have higher expected welfare in Q, prioritarianism cares about the actual distribution of welfare in each possible outcome.

  This preserves the objection to egalitarianism while allowing prioritarianism to handle uncertainty differently. The cost is that prioritarianism can sometimes prefer prospects that are worse for everyone in expectation, but this reflects its risk-aversion for the worse-off—which is part of its point.

  Alternative exits like applying f to expectations (as the user tried) would make prioritarianism collapse into utilitarianism under uncertainty, losing what makes it distinct. So rejecting (4) is the least costly move.
answer: |-
  Reject step (4) — its extension of the no-levelling-down principle to prospects is unjustified and conflates ex ante with ex post perspectives.

  **Why step (4) fails:**  
  The no-levelling-down principle in (1) is inherently ex post: it concerns *actual* welfare in realized outcomes. Extending it to prospects by demanding that no prospect is better unless someone has higher *expected* welfare (as (4) does) smuggles in a utilitarian criterion under risk. Prioritarianism’s core commitment is to weighting *realized welfare* non-linearly—not expected welfare. In your case (step 5), Q has higher expected welfare per person (5 vs. 4), but prioritarianism values the *spread* of realized welfare under Q (where someone always gets 0) lower than P’s equality. This is consistent: the concavity of √w makes Q worse *because* it risks someone ending up destitute, even though ex ante expectations rise. Rejecting (4) doesn’t force you to accept levelling-down in *outcomes* (like step 2’s egalitarian move), so (1) remains intact.

  **Cost of rejection:**  
  - **Loss:** You lose a tidy, universal extension of no-levelling-down to uncertainty. You must accept that prioritarianism can prefer a prospect (P) that is ex ante worse for everyone over one (Q) that is ex ante better, because it prioritizes avoiding *actual* low outcomes (e.g., w=0 in Q).  
  - **Gain:** You keep prioritarianism’s ex post advantage over egalitarianism (no levelling-down in outcomes) and avoid collapsing into utilitarianism. The ex ante/ex post tension is inherent to non-utilitarian views—e.g., Rawlsian maximin faces similar trade-offs.

  **Alternatives and their prices:**  
  1. **Apply f to expected welfare (Σ f(E[wᵢ])):** Solves (5) (Q ≻ P since √5 > √4) but destroys prioritarianism. It ignores distribution *within* prospects (e.g., Q’s 50% chance of destitution) and collapses to utilitarianism under uncertainty. *Cost:* Abandons the core motivation—giving priority to the worse-off in outcomes.  
  2. **Reject expected welfare as the metric for "better off" under prospects:** Claim that "better off" in (4) should use a prioritarian-weighted expectation (E[√wᵢ]). In (5), Ann’s E[√w] is ½√10 ≈ 1.58 in Q vs. √4=2 in P, so both are worse off ex ante. This saves prioritarianism but violates the standard meaning of "better off" (which uses welfare, not transformed welfare). *Cost:* Weakens the intuitive link to individual advantage—people *are* better off in welfare-expectation terms in Q.  

  **Bottom line:** Step (4)’s error is forcing ex ante Pareto (based on expected welfare) onto a view concerned with ex post fairness. Pay the cost of ex ante/ex post divergence to keep prioritarianism coherent.
