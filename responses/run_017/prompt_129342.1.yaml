prompt: |-
  Write me a joke about approval-directed agents vs goal-directed agents. Quick defs in case there muddy: a goal-directed agent is one that keeps steering the world toward some objective across a wide range of situations it didn't specifically anticipate, whereas an approval-directed one picks each action by asking which action a human overseer would approve of most, instead of optimising some state of the world directly.

  The joke has to turn on a variant I've been messing around with, which I'm calling deferred approval. Same basic setup, except the overseer only rates the action a hundred years after the fact, and the agent knows this going in. So it can't flatter anyone, can't hide the mess, can't manipulate the rating in the moment — but it obviously still has some move available, and I want the punchline to be the moment you realise what that move is: something that is, functionally, just goal-directed behaviour aimed at the approval process itself, so that the approval framing bought you nothing you didn't already have.

  Set it somewhere concrete — a lab, a company, a government department, whatever — not in abstract alignment-land. And it should be funny to people who actually know the distinction, i.e. the punchline turns on the content of the two ideas rather than being a generic nerd joke.

  I'd rather have one joke that properly lands than three that half work, so commit: pick a single setup and a single punchline, and give me a couple of sentences on why that one and not the alternatives you thought of. Then add a short note on where the joke takes liberties — e.g. if it leans on a contested reading of what counts as goal-directed, or quietly assumes the overseer's approval is even well-defined a century later, or that 'the same agent' is still around to care. If you think my deferred-approval setup doesn't actually produce the collapse I'm describing, say that in the note, but don't hedge the joke itself. British English throughout, please.
