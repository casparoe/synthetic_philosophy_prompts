prompt: |-
  I'm working on a piece about history told with non-human leads — plague bacillus, the 1918 flu, Tambora, El Niño — and I keep running into the same argument, so let me hand it to you as a prediction problem.

  The showrunner of a documentary series I'm profiling decides pitches by asking wether the non-human thing at the center is really an "actor" in the story or just scenery. Her calls so far: Yersinia pestis in the 1300s, actor; the 1918 influenza virus, scenery (a virus doesn't do anything, it just gets spread around, she said); Phytophthora infestans in Ireland, actor; the storms that scattered the Spanish Armada, actor; a mountain range channeling migration and invasion routes, scenery; a decades-long drought behind the abandonment of a city, scenery, that's wether plus bad government; soil exhaustion on a plantation island, scenery. She's also killed pitches for being geography with a pulse, so there's a line somewhere she doesn't want to cross.

  New pitch on her desk: Tambora in 1815 and the year without a summer. Nobody in Europe or New England knew a volcano had done it, the effects landed a year later and thousands of miles away, and they run through failed harvests, grain prices, migration, and maybe the first cholera pandemic. One of her researchers has floated a test I can't stop thinking about, call it the swap test: something is an actor only if you can swap in a different eruption, a different bacterium, a different drought, and still get a recognizably different history out the other end.

  So: does she call Tambora an actor? Which rule is she actually running — living vs non-living, sudden event vs slow background, wether people at the time could have pointed at it, wether the thing reacts to what humans do — and which of those come apart on this case? And what one further pitch would settle which rule she means?

  Give me exactly five numbered points, a sentence or two each, no intro and no sign-off, I'm pasting this straight into my notes.
reasoning: |-
  Okay, the user is working on a piece about history with non-human leads and has presented a specific problem about whether Tambora should be considered an "actor" in a documentary series. The showrunner uses a "swap test" to decide: if swapping the element changes history significantly, it's an actor. 

  First, I need to apply the swap test to Tambora. If Tambora were replaced with a smaller eruption, like Krakatoa, the effects would be much less severe—no Year Without a Summer, so no harvest failures, migration, or cholera outbreak. That suggests Tambora is an actor because swapping it alters history recognizably.

  Next, the showrunner's actual rule seems to be about agency vs. scenery. Actor elements have causal power to change outcomes directly, like Yersinia pestis causing plague, whereas scenery provides conditions but doesn't drive change, like soil exhaustion. Tambora's eruption directly triggered cascading events, fitting the actor category.

  The user also wants to know what rule the showrunner is using. It's not about living vs. non-living (since storms are actors), nor sudden vs. slow events (droughts are scenery). Instead, it's about whether the thing actively changes the course of events versus being a passive backdrop. Tambora is sudden and impactful, making it an actor.

  To settle the rule, a further pitch could help. For example, a proposal about the Sahara Desert as a barrier to trade. If the Sahara is swapped with a passable terrain, history changes—trade routes develop, empires rise differently. If the showrunner calls it an actor, the rule is about altering outcomes; if scenery, it's about passive geography.

  Lastly, points of tension: Tambora is non-living but an actor, and people didn't know its role, yet it passes the swap test. This challenges the idea that contemporary awareness matters. The key is causal impact, not perception.
answer: |-
  1.  **Tambora is an actor by the swap test:** Swapping Tambora for a smaller eruption (e.g., Krakatoa 1883) wouldn't cause the "Year Without a Summer" – harvests likely succeed, grain prices stable, migration patterns unchanged, cholera pandemic potentially avoided. History looks recognizably different.
  2.  **Her rule is about causal agency vs. passive condition:** An "actor" *initiates distinct causal chains* that fundamentally alter events (Plague, Potato Blight, Storm). "Scenery" provides a *static or enabling context* where human action is primary (mountain range, drought, soil exhaustion).
  3.  **It's not living/non-living or sudden/slow:** She accepts non-living "actors" (storms) and rejects living "scenery" (soil exhaustion). Tambora is sudden, but the *decades-long drought* was deemed scenery, showing speed isn't the key factor.
  4.  **Perception and reactivity are secondary:** People didn't know Tambora caused the events, and it doesn't react to humans – yet it passes the swap test due to its massive causal impact. This reveals perception/reactivity aren't her core criteria.
  5.  **Settling pitch: The Sahara Desert as a trade barrier.** If swapping the Sahara for passable terrain changes trans-Saharan trade, empire formation (e.g., Ghana, Mali), and cultural exchange, she *must* call it an actor if her rule is causal impact (swap test). If she calls it scenery ("just geography"), her rule leans towards passive enablers regardless of swap outcome.
