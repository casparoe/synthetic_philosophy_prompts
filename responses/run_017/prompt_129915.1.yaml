  We are drafting a joint statement for two parties in an adversarial collaboration on personhood. The structure is fixed: agreed claims, disagreements table, cruxes table, and closing section. We must avoid citations and appeal only to cases and distinctions. The language should be precise and without diplomatic padding.

  First, the agreed claims (1): 8-10 non-vacuous claims that a partisan on either side might have denied before. We draw from the cases provided and the core issues.

  Key areas to cover:
  - Counterfactuals about relationally deprived beings (e.g., the Unreached).
  - What withdrawal of recognition entails (wrong vs. mere loss).
  - The role of actual relations vs. potential in constituting personhood.
  - Whether personhood can be lost or gained.
  - The moral role of personhood in generating duties.

  Drafting agreed claims:

  1. Both parties agree that a human being raised in total social isolation (the Unreached) would not develop the psychological capacities typically associated with personhood (e.g., language, complex self-conception). (This is a concession by RC that isolation prevents development, but without conceding that capacities are constitutive; and by IC that relations are causally necessary for development, without conceding they are constitutive.)

  2. Both parties agree that the withdrawal of recognition from an individual who has previously been recognized (e.g., Adaeze) constitutes a moral wrong, not merely a loss of benefits. (RC might see this as a violation of constitutive relations, IC as a violation of the individual's inherent status.)

  3. Both parties agree that the Well-Related Artifact, as described, would be treated as having moral status by those in its community, and that this treatment is not obviously mistaken. (RC might say it has personhood through relations; IC might say it lacks intrinsic capacities but the community's response is understandable and perhaps even morally required for other reasons.)

  4. Both parties agree that the Distant Stranger has moral status and that we have some duties to them, but the parties disagree about the basis and stringency of these duties. (Common ground that there is moral status/duty, but the source and weight are disputed.)

  5. Both parties agree that personhood, once established, is not easily lost. For example, the Apostate, despite repudiating her community's values, remains a person. (RC: because she is still in relations; IC: because her capacities remain.)

  6. Both parties agree that being a member of a criminal gang does not, by itself, negate one's personhood. (Similar to above.)

  7. Both parties agree that at the margins of the human life cycle (e.g., infants, those with severe dementia), there are beings who lack typical psychological capacities but to whom we owe moral duties. (RC might base this on relations; IC might appeal to species membership or potential.)

  8. Both parties agree that if a being has personhood, then it has moral status that grounds certain rights and duties. (Common ground on the moral role.)

  9. Both parties agree that the Unreached, if she could be encountered, would be owed moral consideration. (RC: because she is human and could enter relations; IC: because of her intrinsic humanity or potential.)

  10. Both parties agree that the case of the Apostate shows that personhood does not require sharing the values of one's community.

  Now, the disagreements table (2). We need to state each side's view in a formulation they accept, and judge if substantive or verbal.

  Key disagreements from the cruxes list and beyond:

  A. Whether relations are constitutive of personhood or merely causally necessary for its development.

  B. Whether potential relations can ground personhood (for the Unreached) or if actual relations are required.

  C. Whether the Well-Related Artifact is a person.

  D. Whether the moral wrong in withdrawal of recognition (e.g., Adaeze) is due to violating a constitutive relation or violating an inherent status.

  E. Whether duties to the Distant Stranger are as stringent as to intimates.

  F. Whether personhood admits of degrees.

  We structure:

  | Disagreement | RC Formulation | IC Formulation | Substantive or Verbal? |
  |--------------|----------------|----------------|------------------------|
  | ... | ... | ... | ... |

  We must judge each as substantive or verbal. Some might be verbal if the dispute is about the meaning of "personhood" rather than the underlying facts.

  For example:

  1. On the constitutive vs. developmental role of relations:

     - RC: Personhood is constituted by standing in the right kind of reciprocal recognition relations with others.
     - IC: Personhood is fixed by intrinsic features of the individual (e.g., psychological capacities, agency, or species membership), and relations are only causally necessary for the development and maintenance of these features.
     - Judgment: Substantive, because it leads to different verdicts in cases like the Well-Related Artifact and the Unreached.

  2. On the Unreached:

     - RC: The Unreached is not a person because she stands in no actual relations of mutual recognition.
     - IC: The Unreached is a person because she has the intrinsic features (or potential for such features) that ground personhood.
     - Judgment: Substantive.

  3. On the Well-Related Artifact:

     - RC: The Well-Related Artifact is a person because it stands in the right kind of relations with others.
     - IC: The Well-Related Artifact is not a person because it lacks the intrinsic psychological capacities (e.g., consciousness, agency) that are necessary for personhood.
     - Judgment: Substantive.

  4. On the role of recognition:

     - RC: Withdrawal of recognition from Adaeze is a wrong because it denies her the relations that constitute her personhood.
     - IC: Withdrawal of recognition from Adaeze is a wrong because it violates her inherent dignity as a person, which exists independently of others' attitudes.
     - Judgment: Substantive, because it reflects different accounts of the wrong.

  5. On duties to the Distant Stranger:

     - RC: Duties to the Distant Stranger are less stringent than to intimates because they are grounded in the actual relations we have, and we have no actual relation to the Distant Stranger.
     - IC: Duties to the Distant Stranger are as stringent as to intimates because they are grounded in the inherent personhood of the individual, which is the same in all cases.
     - Judgment: Substantive.

  6. On degrees of personhood:

     - RC: Personhood admits of degrees because the richness and quality of one's relational standing can vary.
     - IC: Personhood does not admit of degrees; one either has the intrinsic features or not, though the exercise of capacities may vary.
     - Judgment: Substantive.

  Now, the cruxes table (3). We have to state the case or argument that both agree would bear on the crux, then each side's prediction and what would count as evidence against them.

  Cruxes to include (as per instructions):

  - Whether the relational claim is constitutive or merely developmental.

    Case: The Unreached and the Well-Related Artifact.

    Both agree that these cases bear on whether relations are constitutive.

    RC prediction: The Unreached is not a person, and the Well-Related Artifact is. Evidence against: If the Unreached were a person without any relations, or if the Well-Related Artifact were not a person despite relations.

    IC prediction: The Unreached is a person (if she has the intrinsic features) and the Well-Related Artifact is not. Evidence against: If the Well-Related Artifact were a person without intrinsic features, or if the Unreached were not a person despite having intrinsic features.

  - Whether RC can rescue the Unreached by appealing to potential relations, and whether that collapse makes the dispute verbal.

    Case: The Unreached.

    Both agree that if RC appeals to potential relations, then it might converge with IC's appeal to potential capacities.

    RC: Does not typically appeal to potential relations for current personhood. If they did, it would be evidence against their constitutive claim. They predict that without actual relations, the Unreached is not a person.

    IC: Predicts that the Unreached is a person by intrinsic features. If RC starts appealing to potential relations, IC might see that as a collapse into their view, making the dispute verbal.

    Evidence against RC: If they feel compelled to appeal to potential relations to account for moral duties to the Unreached, that might undermine their constitutive claim.

    Evidence against IC: If they have to deny that the Unreached is a person because she lacks actual capacities (if she does), that might be counterintuitive.

  - Whether making standing depend on others' recognition leaves it hostage to wrongdoing.

    Case: Adaeze.

    Both agree that if recognition is withdrawn, it is a wrong. But why?

    RC prediction: Withdrawal of recognition is a wrong because it destroys the relations that constitute personhood. Evidence against: If after withdrawal, Adaeze remains a person, then relations are not constitutive.

    IC prediction: Withdrawal is a wrong because it violates an independent status. Evidence against: If withdrawal actually destroyed personhood, then it wouldn't be a wrong to a person.

  - Whether RC must read relation normatively rather than as mere causal-social entanglement, and what that costs it.

    Case: The criminal gang and the Well-Related Artifact.

    Both agree that not all relations count. RC must specify "right kind of relations".

    RC prediction: The criminal gang member is a person because they stand in normative relations (even if the gang is criminal, the relations might still be recognitive in some form). The Well-Related Artifact is in normative relations. Evidence against: If the gang member's relations are purely exploitative and lack mutual recognition, then RC might have to deny personhood, which is counterintuitive. Or if the artifact's relations are merely causal, not normative.

    IC: Doesn't rely on relations, so not directly affected.

  - Whether the two views must decide the Unreached and the Well-Related Artifact symmetrically, and what an asymmetry would show.

    Case: The Unreached and the Well-Related Artifact.

    Both agree that symmetry (both persons or both not) would support one view over the other? Not necessarily.

    RC: Asymmetry: Unreached not a person, Well-Related Artifact is. That's their position.

    IC: Asymmetry: Unreached is a person, Well-Related Artifact is not.

    If both views had to treat them symmetrically, that would be evidence against the views? Actually, they don't have to. But if they are treated symmetrically by one view, it might be inconsistent.

    We'll note that RC predicts asymmetry (Unreached: no; Artifact: yes) and IC predicts asymmetry (Unreached: yes; Artifact: no). If either were forced to treat them symmetrically, that would be evidence against their view.

  - Whether either view can generate duties to the Distant Stranger of comparable stringency to intimates.

    Case: Distant Stranger.

    Both agree that we have duties, but of what stringency?

    RC prediction: Duties are less stringent because grounded in actual relations. Evidence against: If they can generate duties of equal stringency without relations.

    IC prediction: Duties are equally stringent because grounded in inherent personhood. Evidence against: If in practice, duties to intimates are stronger, and that is justified, then their view might be undermined.

  Additionally, we must include the margins of the human life cycle and whether personhood admits of degrees.

  - For margins: infants and severe dementia.

    Case: Margins of human life cycle.

    Both agree that they have moral status.

    RC: Predicts that their personhood is maintained by their relations. Evidence against: If an infant with no relations (e.g., abandoned) still has personhood.

    IC: Predicts that they have personhood by species membership or potential. Evidence against: If we don't treat them as having full personhood.

  - On degrees:

    Case: Margins and also cases like the Apostate or Adaeze.

    RC: Predicts that personhood can come in degrees. Evidence against: If all persons must have the same moral status.

    IC: Predicts no degrees. Evidence against: If we intuitively treat some beings (e.g., advanced dementia) as having diminished personhood.

  Now, the closing section (4): which disputes turned out to be verbal, and which formulations were withdrawn.

  We note that during the collaboration, some disagreements were revealed to be verbal. For example:

  - The parties discovered that when IC speaks of "capacities", they sometimes include the capacity to enter into relations, and when RC speaks of "relations", they sometimes require that the individual have certain capacities. This led to a reformulation: IC clarified that their intrinsic capacities include the capacity for relationality, and RC clarified that the relations they have in mind require the capacity for mutual recognition. Thus, the dispute about the Unreached might be less stark if IC allows that the Unreached has the capacity for relations and RC allows that without actual relations, the status is not realized.

  But we must be cautious: the instructions say to record which turned out to be verbal and which formulations were withdrawn.

  We might say:

  - The parties agree that the dispute over whether personhood "admits of degrees" is partly verbal. RC uses "personhood" to include the quality of relational standing, which can vary, and thus moral status can vary. IC uses "personhood" as an all-or-nothing status that grounds equal basic rights, though they allow that the exercise of capacities can vary and that there may be additional relational duties. The underlying substantive issue remains: whether moral status is scalar or threshold.

  - A formulation withdrawn: RC initially claimed that without any relations, there is no personhood whatsoever. But in light of the Unreached, they allow that we might have duties to such a being because of the potential for relations, but they maintain that this potential does not constitute actual personhood. IC initially claimed that relations are entirely irrelevant to personhood, but now allow that relations are causally necessary for the development of capacities, and that in practice, recognition relations are how we identify persons.

