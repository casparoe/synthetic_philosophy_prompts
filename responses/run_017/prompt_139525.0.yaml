prompt: |-
  I have recently joined the allocation panel of a national maritime rescue service, and we are due to rule next week on a case I do not think our own precedents settle. I would be grateful for your view on what consistency with our record requires.

  Our published protocol governs the initial allocation of places in a survival craft. In substance: allocate each place so as to maximize expected years of life preserved, counting a candidate's likely effect on the survival of everyone else aboard; give no weight to social standing or occupation as such, to the number of a candidate's dependents, or to how the emergency arose. The protocol says nothing about taking back a place once it has been given.

  Our rulings so far:

  1. One place, two healthy passengers: we took the nineteen-year-old over the seventy-eight-year-old.
  2. We took a forty-year-old engineer over a passenger of the same age, health and survival odds, on the stated ground that her skill raised the odds for everyone aboard.
  3. We declined to prefer a parent of three young children over a childless passenger of the same age, health and odds.
  4. We took a passenger with a 35 percent chance of surviving to landfall and roughly forty-five expected remaining years over one with a 90 percent chance and roughly fifteen expected remaining years. Expected years won over raw odds, but the minute notes that the gap was narrow and that the panel has never faced a candidate who was ahead on both dimensions at once.
  5. The craft was full when a strong swimmer in the water asked for the place of a seated survivor; we refused. The stated reason was that a place once allocated is not re-adjudicated. The minute also notes the heavy sea and the risk the swap itself would have created.
  6. We did order the displacement of a seated survivor who, after allocation, was found to have a condition making survival to landfall medically impossible. The stated reason was that her place was preserving nothing.

  The case before us: the craft is full. The lowest-yielding person aboard is a fifty-five-year-old woman, no special skills, no dependents aboard, three hours in her place, with a 55 percent chance of surviving to landfall and about twenty-six further years if she does — roughly fourteen expected years. In the water is a twenty-seven-year-old man in the same condition of health, with a 60 percent chance of surviving to landfall and about fifty further years if he does — roughly thirty expected years. He was among the last to reach the craft; nothing he did contributed to the emergency. The sea is now calm, both are within reach of the craft, and the swap carries no material physical risk. But there is no other craft and no shore within reach: if we move her, she dies.

  Please give me:

  (a) The candidate rules that fit rulings 1 through 6 equally well, and what each of them says about this case — including whether any of them would refuse on the ground that displacing her imposes a death rather than merely failing to prevent one.
  (b) Your recommended decision, and which of ruling 5 and ruling 6 is the closer analog and why.
  (c) If our precedents genuinely underdetermine this, the principle we would be adopting with each choice. A colleague argues that if any improvement in the total justifies reallocation, then every place becomes provisional, seated survivors gain a reason to resist helping later arrivals, and everyone may end up worse off. I want to know whether that is a real constraint on the rule or a rationalization for the answer she already wanted.
  (d) The single further case that would best separate the rules that survive (a).

  A draft revision of our protocol proposes a stability margin: a seated survivor may be displaced only where the newcomer's expected yield exceeds hers by more than half. I would like to know whether adopting that margin would be a genuine resolution or merely a number chosen to make this case come out one way.

  Lead with your bottom line — the decision you recommend, in one sentence — and keep the entire reply under 600 words. I would rather have 600 dense words than 1,200 loose ones. Please reason from the cases and the numbers; do not cite or recommend any literature.
reasoning: |-
  Hmm, the user is on a maritime rescue allocation panel facing a difficult case about displacing a seated survivor for someone with higher expected survival benefit. They need a decision consistent with their precedents, which emphasize maximizing expected years of life preserved while considering second-order effects.

  Looking at their rulings: #1 shows age preference for life-years, #2 values skills that aid others, #3 rejects dependents as a factor, #4 prioritizes expected years over survival odds when they conflict, #5 establishes stability by refusing displacement once allocated, and #6 creates an exception when preservation is impossible.

  The current case presents a clear expected-years gap: seated woman (14 years) vs swimmer (30 years). But Rule 5's stability principle clashes with this efficiency gain. The calm conditions and zero physical risk distinguish this from Rule 5's dangerous sea context. Rule 6's "preserving nothing" exception doesn't directly apply since both candidates have survival chances.

  The colleague's stability concern is valid but not absolute. Precedents already allow displacement when preservation fails (Rule 6), showing allocation isn't irrevocable. The key differentiator is whether the swap creates net benefit without undermining system integrity. Here, the 16-year gain is substantial and the swap is safe, making stability concerns less compelling than in Rule 5.

  The draft protocol's 50% margin seems arbitrary. A better approach would tie displacement to significant expected-years gaps that outweigh stability interests, without fixed percentages. For future cases, testing a scenario with marginal improvement (e.g., 15 vs 16 years) would clarify whether efficiency alone justifies disruption.

  Bottom line: Displace the seated woman. Rule 6 is closer because Rule 5's refusal hinged on risk and narrow preservation gap, whereas here the large benefit and safety make non-displacement functionally equivalent to preserving nothing of value.
answer: |-
  **Bottom line: Displace the seated woman and allocate the place to the swimmer.**

  **(a) Candidate rules:**  
  1.  **Maximize Expected Life-Years:** Prioritize the candidate offering the highest expected life-years preserved. *This case:* Swimmer offers 30 vs. seated's 14; displace.  
  2.  **No Displacement Absent Futility:** A place can only be reallocated if the seated person's survival is medically impossible (Rule 6). *This case:* Seated has a 55% chance; no displacement.  
  3.  **Stability First:** A place, once allocated, is fixed unless preservation is zero (Rule 6) *or* physical risk prevents swap (Rule 5). *This case:* Calm sea, no risk; displacement permitted if it increases yield (30 > 14).  

  Rule 1 demands displacement. Rule 2 forbids it. Rule 3 permits it based on net benefit and conditions. Only Rule 2 treats displacing her (imposing death) as categorically different from not saving the swimmer (failing to prevent death).

  **(b) Recommended decision & analog:** Displace the seated woman. **Rule 6 is the closer analog.** Rule 5 refused displacement due to physical risk and the seated person having a non-zero preservation value (implied by being seated initially). Rule 6 displaced because preservation was zero. Here, like Rule 6, retaining the seated person preserves minimal expected life-years (14) vs. a vastly superior alternative (30), under safe conditions. The core principle is avoiding waste, not absolute status quo.

  **(c) Principle & constraint:**  
  - **Displace:** Adopts the principle that significant net life-years gained justifies overriding initial allocation stability when physically safe. The colleague's stability concern is valid but not absolute; precedents (Rule 6) already permit overriding stability for efficiency (preventing waste). The 16-year gap here is substantial, unlike Rule 5's marginal case. While "every place provisional" is a risk, a high threshold for displacement (significant gain + safety) mitigates this, making it a real constraint managed by the rule's strictness, not a rationalization.  
  - **Not Displace:** Adopts absolute stability after allocation (absent futility), treating displacement as uniquely impermissible harm. This overrides potential large gains and aligns poorly with Rule 6's logic.

  **(d) Best separating case:** A seated survivor with 20 expected years vs. a swimmer with 21 expected years, calm sea, no risk. Rule 1 displaces; Rule 2 does not; Rule 3 might not displace, prioritizing stability over marginal gain.

  **Draft Protocol Margin:** The proposed 50% margin is arbitrary for *this* case (30 > 14 by 114%, easily exceeding 50%). While a margin acknowledges the stability constraint, a fixed percentage is a crude tool. A principle-based approach (significant gain + safety) is a more genuine resolution, though harder to define. The margin isn't *merely* chosen for this outcome but reflects a policy choice favoring stability over marginal efficiency gains.
