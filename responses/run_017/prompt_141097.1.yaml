prompt: |-
  I'm a PhD student in moral philosophy, working on a paper about whether the category of the supererogatory survives temporal extension — whether an act that is beyond duty when done all at once is still beyond duty when the same act is spread across a long sequence of small steps. I need a case built to order, not an illustration.

  Build me a realistic scenario — caregiving, mentoring, hosting, neighborliness, something a person could actually be in; nothing heroic, no trolleys; the whole thing in one paragraph — in which an agent performs a long series of small acts, each of which is, at the moment she performs it, a textbook instance of supererogation: permitted, praiseworthy, genuinely beyond duty, and such that she could have omitted it without blame. The series as a whole should add up to a substantial sacrifice and a substantial benefit to someone else, even though no single step is very costly. Two stipulations do the real work and must be respected. First, the need being met has to stay roughly constant across the sequence: the duty, if one appears by the end, must not be explained by the beneficiary's situation getting worse. Second, the agent must never promise, consent, accept a role, or wrong anyone — no contracts, no offices, no culpable negligence. Yet by the end she must be unable to stop without real blame, and not merely without disappointing someone or being rude. The blame has to be moral, and it has to arise from what her own earlier optional acts did to the situation rather than from a duty that was present all along.

  Then show that the case works, against three accounts I want kept separate: (i) the standard token-level account, on which an act is supererogatory iff it is permitted to do, permitted to omit, praiseworthy if done, and beyond what duty requires; (ii) a course-of-action account, which evaluates the temporally extended sequence and asks whether that sequence, taken as a whole, could have been omitted without blame; (iii) a sacrifice condition, on which no act counts as supererogatory unless it costs the agent something significant, so that a cheap act is at best a favor. For each, state the verdict about the individual steps and about the sequence, and derive it from the account rather than asserting it. The pattern I am hoping the case can be made to generate is that (i) treats the early steps as supererogatory and the final ones as obligatory, (iii) withholds supererogation from every step while owing an account of the total, and (ii) returns whichever verdict you think is actually correct — including one you think I will not like.

  Close with three things: which single feature of the case is doing the work; what the case becomes if that feature is removed, which should collapse it back into an ordinary and uncontroversial instance of supererogation rather than into nothing at all; and the strongest available line of attack for whichever of the three accounts comes out worst, framed as that theorist would actually press it.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in moral philosophy working on temporal extension of supererogation, specifically whether an act that's beyond duty when done all at once remains so when spread over time. They need a custom-built case that meets strict criteria.

  First, I need to understand the core requirements: 
  The scenario must involve a long series of small, individually supererogatory acts that collectively create a substantial outcome. Crucially, the beneficiary's situation shouldn't worsen over time, and the agent must avoid any commitments or negligence that could create duties. Yet by the end, stopping should incur genuine moral blame purely due to the accumulated effect of prior optional acts.

  I consider several domains - caregiving seems most promising as it allows for gradual accumulation without dramatic changes. The neighborly support scenario comes to mind: helping an elderly person with minor tasks. This avoids heroics or trolley-problem elements while permitting realistic small sacrifices.

  For the beneficiary's stable condition, I settle on chronic but manageable mobility issues - something like arthritis that doesn't deteriorate but creates persistent minor needs. The acts will be things like door opening that are trivial when isolated but meaningful collectively. 

  The key mechanism is dependency creation without assumption of responsibility. The agent must never promise or accept a role. Each act remains optional in isolation, but the pattern of repetition builds legitimate reliance. This avoids contractual or role-based duties while creating moral pressure through the beneficiary's adjusted expectations and routines.

  Now structuring the analysis across the three requested accounts:
  1) Token-level: Early acts clearly supererogatory (optional, praiseworthy). Later acts transition to obligatory due to reliance created.
  2) Course-of-action: The sequence as a whole isn't obligatory initially but becomes non-optional through the agent's own pattern of behavior.
  3) Sacrifice condition: No step involves significant individual cost, so none qualify as supererogatory despite cumulative sacrifice.

  The critical feature is clearly the creation of legitimate reliance through repeated voluntary actions. If removed, it becomes disconnected good deeds with no moral progression. For critics of the course-of-action view, the strongest counter would challenge whether moral obligations can truly emerge from patterns alone without explicit commitment.

  I'll ensure the case avoids common pitfalls - no worsening condition, no negligence, no role acceptance. The blame at the end must stem solely from the agent's own prior choices creating expectations, not from external factors.
answer: |-
  Here is a tailored case meeting all specifications, followed by the analysis:

  **Case:** Dr. Anya Sharma, a physicist, moves into an apartment building. Her neighbor, Mr. Davies, an elderly man with stable but moderately severe arthritis, struggles slightly with his heavy apartment door. Observing this, Anya one day holds the door open for him as he returns with groceries. She does nothing else. A week later, seeing him approach while she happens to be leaving, she holds it again. She continues this pattern sporadically over months – holding the door when their paths coincide, never arranging to meet him, never discussing it, never taking on any other task (shopping, mail, etc.). Each time, the act costs her only seconds and no significant inconvenience. Mr. Davies, initially surprised, comes to rely *only* on this specific, unpredictable help for managing the door with his groceries, subtly adjusting his routine to coincide more often with times Anya might be coming or going, though he never asks or expects her to be there. After 18 months of this pattern (roughly 70-80 instances), Anya is leaving just as Mr. Davies arrives. She sees him pause, shift his weight, and prepare for the usual struggle, expecting her help based on the established pattern. Anya, wanting to rush to a personal appointment, considers walking past without holding the door.

  **Analysis Against the Three Accounts:**

  1.  **Token-Level Account (Act-by-Act):**
      *   *Individual Steps (Early & Middle):* Each act of holding the door is **supererogatory**. It is (a) *permitted* (no rule against neighborly help), (b) *permissible to omit* (Anya has no prior duty to Mr. Davies regarding the door at the moment of each act), (c) *praiseworthy* (kind, helpful), and (d) *beyond duty* (her duty as a neighbor doesn't require anticipating and solving this specific minor inconvenience for a stranger/acquaintance each time).
      *   *Individual Steps (Late) & Stopping at the End:* The final act (holding the door at the 18-month mark) and omission (walking past) are **not supererogatory**. Omitting the act now incurs *moral blame*. This blame arises *not* from a worsening of Mr. Davies' condition (arthritis is stable) or an explicit promise/role/nonfeasance by Anya, but *solely* from the legitimate, reasonable reliance her repeated, pattern-establishing, optional acts created. By consistently acting, she induced him to expect help and adjust his behavior. Suddenly omitting the act now, when he expects it and has come to rely on it, constitutes a *harm* (frustrated expectation, forced extra difficulty) that is *caused by her own prior voluntary pattern*, making the omission a failure of fairness or non-maleficence. The act is thus *obligatory* at this point. The token-level account must deny supererogation status to the later individual acts because omission is not permissible without blame.
      *   *Sequence as a Whole:* Not directly evaluated by this account.

  2.  **Course-of-Action Account (Sequence-as-Whole):**
      *   *Individual Steps:* Each individual door-holding act, considered *in isolation at the moment of performance*, remains **supererogatory** for the same reasons as under (i): permissible to do, permissible to omit at that instant, praiseworthy, beyond duty. The account focuses on the whole sequence.
      *   *Sequence as a Whole:* The entire course of action – initiating and sustaining this pattern of help over 18 months – is **not supererogatory**. Omission of the *entire sequence* from the start (never holding the door) would have been blameless. However, once Anya *chose* to initiate the pattern and *sustain* it through numerous repetitions, she created a situation where simply *abandoning* the sequence at a random point (like the 18-month mark) without notice or reason related to Mr. Davies' needs becomes **morally blameworthy**. The blame arises from the *sequence itself* – the creation of reliance through voluntary, repeated optional acts. Sustaining the pattern until a reasonable off-ramp (e.g., a natural break like Mr. Davies getting a door closer, Anya moving, or a conversation) becomes obligatory. The sequence, once begun and established, cannot be omitted without blame.
      *   *Verdict:* The sequence-as-a-whole transitions from optional to obligatory due to the agent's own actions within it.

  3.  **Sacrifice Condition Account (Cost-Centric):**
      *   *Individual Steps:* Every single door-holding act **fails to be supererogatory**. While each is permitted, permissible to omit at the moment, and praiseworthy, each involves only a trivial cost (seconds, minimal effort). According to this account, a "significant" cost is a necessary condition for supererogation. These acts are merely "favors" or "kind acts," not true supererogation.
      *   *Sequence as a Whole:* The account primarily evaluates individual acts. However, the *cumulative* cost (70-80 instances x a few seconds/effort) represents a **substantial sacrifice** in aggregate (time, attention, foregone opportunities). The account struggles to classify the sequence directly, as it focuses on act-tokens. It must explain the blame for stopping via another mechanism (perhaps importing reliance from other accounts, or labeling the cumulative result a "significant sacrifice" retroactively making the pattern obligatory, though this contradicts its token-focus). It cannot designate the sequence *as a whole* as supererogatory using its own core criterion, as the sequence wasn't undertaken *as* a single costly act.
      *   *Verdict:* No step is supererogatory. The sequence presents a problem for the account regarding the source of blame.

  **Critical Feature, Collapse, and Strongest Attack:**

  *   **Feature Doing the Work:** **The creation of legitimate, reasonable reliance solely through the agent's repeated pattern of voluntary, optional acts.** Mr. Davies adjusts his behavior based *only* on Anya's unprompted, sporadic actions, establishing an expectation. No promise, role, worsening need, or negligence is involved.
  *   **Collapse if Removed:** If Anya held the door just once or twice unpredictably over the months, Mr. Davies wouldn't form specific reliance. Each act would remain an isolated, uncontroversial supererogatory favor. Omitting help on any later occasion would be blameless (though perhaps mildly rude).
  *   **Strongest Attack (For Sacrifice Condition Account):** "The case smuggles in a *duty of non-abandonment* generated by reliance, which is distinct from the sacrifice criterion. The later blame arises from violating *that* duty (fairness, non-maleficence to the reliant party), not from the magnitude of cost involved in the individual acts *or* the sequence. Your case proves reliance creates obligation, not that trivial acts become supererogatory or that aggregate cost defines supererogation. The initial acts remain mere favors; the obligation later is a *new* duty born of one's own actions, not the supererogatory nature transforming. Focusing on cost correctly excludes trivial 'kindnesses' from the category of the morally heroic (supererogatory), which is its purpose."

  This case isolates reliance-creation through voluntary patterns as the engine transforming optionality into obligation over time, challenging all three accounts but posing the sharpest problem for the Sacrifice Condition by highlighting the emergence of obligation without significant cost per act, and the deepest challenge to Token-Level by showing context dependence of permissibility. The Course-of-Action account offers the most natural explanation for the blame arising from the extended pattern itself.
