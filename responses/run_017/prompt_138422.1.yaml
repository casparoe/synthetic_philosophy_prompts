answer: |-
  ### Research Proposal: The Status of Expected-but-Not-Required Acts  

  **Tight Question:**  
  Is "expected-but-not-required" a stable, distinct normative status (distinct from both obligation and optionality), or is it reducible to (a) statistically common optional acts or (b) a transitional phase en route to obligation?  

  **Why the Standard Two-Tier Picture Fails:**  
  Existing models (e.g., demandingness thresholds, "best available option" accounts) force acts into binary categories:  
  - **Required acts** trigger blame/resentment when omitted and permit demands.  
  - **Supererogatory acts** attract praise when performed but permit only requests (not demands) and no blame for omission.  
  The "middle tier" defies this:  
  - Omission warrants *disappointment* or *prosocial sanctions* (e.g., reduced trust), not blame.  
  - Performance warrants *no praise* (unlike supererogation).  
  - It permits unique *intermediate speech acts* (reminders, prompts) unavailable for obligations ("demand") or pure optionality ("plea").  
  Cost-based thresholds fail because many expected acts (e.g., answering a weekend email) are low-cost yet still not obligatory. "Best available option" frameworks cannot explain why we don’t morally require these acts despite their clear net benefit.  

  ---

  ### 12-Week Plan  
  **Month 1: Conceptual Groundwork**  
  - Define the "expected-but-not-required" tier using paradigmatic examples (e.g., timely replies, collegial attendance).  
  - Map existing theories (contractualism, social roles, practice-based norms) to show why they *cannot* absorb this tier.  
  - *Deliverable:* Draft §1–2 of the paper (problem statement, inadequacy of two-tier models).  

  **Month 2: Stability & Testing**  
  - Develop a "non-compliance-dependent test" for normative status (e.g., whether expectation persists when compliance drops; whether speech acts shift under hypothetical non-compliance).  
  - Analyze if the tier is unstable: Does widespread compliance *inevitably* morph it into obligation? (Examine historical cases, e.g., tipping).  
  - *Deliverable:* Draft §3–4 (positive account of the tier; stability analysis).  

  **Month 3: Resolution & Outputs**  
  - Argue for/against reducibility using the non-compliance test.  
  - Write the journal paper (~8k words) and a 2-page dean’s note.  
  - *Deliverable:* Final paper + dean note.  

  **Scope Cut if Needed:**  
  Drop the *historical analysis of obligation creep*; focus on conceptual/linguistic tests.  

  ---

  ### Possible Conclusions & Deciding Factors  
  1. **Distinct Status**:  
     - *Decided by:* Finding acts where expectation is normatively grounded (e.g., in role-based commitments) yet immune to obligation-creep (e.g., because of "moral discretion zones").  
  2. **Reducible to Statistical Optionality (a)**:  
     - *Decided by:* All "expected" reactions (disappointment, prompts) track *empirical frequency* alone (e.g., if compliance drops, expectation vanishes).  
  3. **Transitional Phase (b)**:  
     - *Decided by:* Identifying cases where near-universal compliance *always* triggers obligation (e.g., via fairness arguments).  

  ---

  ### Failure Conditions (Not "More Research Needed")  
  - All candidate acts dissolve into statistical expectations under pressure (collapsing to **a**).  
  - The proposed "non-compliance test" fails to isolate normative force from frequency.  
  - All observed "expected" acts are unstable, inevitably becoming obligations (**b**).  

  ---

  ### Deliverable for the Dean  
  A 2-page note:  
  > *"This project identifies a pervasive but overlooked class of actions (e.g., replying to emails promptly, showing collegial support) that aren’t morally required but aren’t merely optional. I argue these sustain trust and cooperation in professional communities. If they form a distinct normative category, this clarifies why pressuring colleagues can backfire—they occupy a space between demand and plea. For institutions, recognizing this tier helps design better norms for academic citizenship."*  

  ---

