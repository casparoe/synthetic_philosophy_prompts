answer: |-
  ### 1. Exam Question  
  **Answer ONE question. Time allowed: 45 minutes. Word limit: 1000 words. Closed book. No calculators. Write your answer in the booklet provided.**  

  **Question:**  
  Quantum mechanics represents systems using a *quantum state* (symbolized as ψ). Philosophers and physicists debate what this state represents. Consider three interrelated issues:  

  **(A) The ψ-ontic/ψ-epistemic distinction (ontological models framework):**  
  - In a **ψ-ontic model**, each distinct quantum state ψ corresponds to a *non-overlapping* probability distribution over the system’s underlying physical states (λ). A complete specification of λ uniquely determines ψ.  
  - In a **ψ-epistemic model**, at least two distinct quantum states ψ₁ and ψ₂ correspond to *overlapping* probability distributions over λ. A single λ could be compatible with either ψ₁ or ψ₂, meaning ψ represents incomplete knowledge about λ.  

  A 2012 no-go theorem shows: *No model where the quantum state is purely epistemic (ψ-epistemic) AND where independently prepared systems have statistically independent underlying states (λ) can reproduce all quantum predictions.*  

  **(B) The physical-object-vs-nomological distinction:**  
  - **Physical object view:** ψ is a concrete physical entity (e.g., a field on a high-dimensional *configuration space*).  
  - **Nomological view:** ψ is not a physical object but encodes laws/dispositions (e.g., like Newtonian gravity’s 1/r² law).  

  **(C) Denying independence:**  
  The no-go theorem assumes independent preparations yield independent λ. One might reject this assumption.  

  **Your tasks:**  
  1. **Distinguish (A) and (B) clearly.** Explain why settling (A) does *not* resolve (B). Illustrate using **Bohmian mechanics** (ψ-ontic; ψ is a physical field guiding particles) and **Everettian mechanics** (ψ-ontic; ψ describes a multiverse of branching worlds). Both are ψ-ontic but disagree on (B).  
  2. **Construct the strongest reply denying independence (C):**  
     - Explain how two preparations we *treat* as independent could share correlated λ (e.g., via hidden constraints).  
     - Contrast this with **superdeterminism** (a reply to Bell’s theorem denying measurement independence). Are these denials equivalent? If not, why? If so, does denying independence in (C) collapse into superdeterminism?  
  3. **Compare costs and take a stance:**  
     - Weigh the cost of **denying independence** (C) against the cost of **treating ψ as a physical field on high-dimensional configuration space** (B).  
     - Are these costs "denominated in the same currency" (e.g., both metaphysical, both empirical)?  
     - **Take a position**: Is there a tie-breaker (empirical, conceptual, or otherwise) between these options? If yes, describe it. If no, argue that the dispute is idle. Do not survey options—defend your view.  

  ---

  ### 2. Model Answer (~900 words)  
  **(Settled claims marked ✓; contested claims marked ✗)**  

  The reality of the quantum state involves distinct questions. **First (A)**, the ψ-ontic/epistemic distinction concerns whether ψ corresponds one-to-one with physical states λ (ontic) or whether it reflects ignorance about λ (epistemic). The 2012 no-go theorem (✓) proves that no epistemic model *with statistically independent λ for independently prepared systems* matches quantum predictions. **Second (B)** asks whether ψ, if ontic, is a *physical object* (like a field) or *nomological* (law-like). These are orthogonal: (A) asks about ψ’s relation to λ; (B) asks about ψ’s metaphysical category.  

  **Bohmian and Everettian theories illustrate this separation (✓).** Both are ψ-ontic: each ψ corresponds to a unique λ (trajectories in Bohm, branching worlds in Everett). Yet Bohm treats ψ as a *physical field* on configuration space, while Everettians often treat ψ *nomologically*, governing emergent branching. Thus, settling (A) as ontic leaves (B) open.  

  **Denying independence (C)** offers an escape from the no-go theorem. The strongest version posits that *all physical states λ are globally correlated*, even for systems prepared "independently." For example, a universal constraint (e.g., a fixed initial λ₀) could link preparation devices, making their outputs λ-dependent. This differs from Bell-inspired superdeterminism. Superdeterminism denies measurement independence (correlations between hidden states *and measurement choices*), violating experimental free will. Independence denial in (C) concerns *preparation devices only*, allowing free measurement choices. However, both appeal to fine-tuned, unobservable correlations in λ. If extended to measurements, (C) risks collapsing into superdeterminism (✗ debate).  

  **Comparing costs:**  
  - **Cost of denying independence (C):** Demands pervasive, unfalsifiable correlations in λ. This sacrifices *modularity*: we can no longer assume local causes explain local events, threatening scientific practice (✗ severity contested).  
  - **Cost of high-dimensional ψ (B):** Configuration space realism posits a 3N-dimensional arena (for N particles), making our 3D world emergent. Critics argue this is ontologically extravagant (✗) and struggles to recover spatial continuity (✗ unresolved).  

  **Are costs comparable?** Both are metaphysical but differ in kind. (C) violates causal locality—a core scientific heuristic—while (B) violates spatial intuition but preserves locality. (C)’s cost is operational (undermining experimental isolation); (B)’s is conceptual (explaining emergence).  

  **Tie-breaker stance (✗ contested):** No empirical tie-breaker exists. The no-go theorem assumes independence; high-dimensional spaces are not directly observable. The dispute is idle *if* we demand empirical adjudication. However, a *conceptual* tie-breaker favors configuration space realism. Denying independence (C) sabotages scientific methodology by making reproducibility inexplicable: if preparations are secretly entangled, no experiment is truly repeatable. Configuration space realism, while counterintuitive, avoids this and aligns with quantum formalism’s structure (e.g., wavefunction centrality). Thus, (B) is preferable despite its strangeness.  

  ---

  ### 3. Marking Scheme (Total: 25 marks)  
  **Five must-hit points (5 marks each).**  

  #### **1. Distinguish (A) and (B) + Bohm/Everett example**  
  - **3 marks:** Defines (A) and (B) but conflates them.  
  - **4 marks:** Separates (A) (ψ↔λ relation) and (B) (ontological category); mentions Bohm/Everett as ψ-ontic.  
  - **5 marks:** As above + explicit contrast: *Both ψ-ontic but Bohm (physical field) vs. Everett (often nomological)*.  
  - *Common error:* Asserts "ψ-ontic = high-dimensional object."  

  #### **2. Construct independence-denial (C) + contrast with superdeterminism**  
  - **3 marks:** Describes (C) vaguely; no superdeterminism comparison.  
  - **4 marks:** Explains how λ-correlations could arise (e.g., universal constraint); notes superdeterminism involves measurement settings.  
  - **5 marks:** As above + precise contrast: *(C) correlates preparations; superdeterminism correlates measurements. Collapse risk if (C) extended.*  
  - *Common error:* Equates (C) and superdeterminism immediately.  

  #### **3. Costs of (C) vs. high-dimensional ψ**  
  - **3 marks:** Lists costs superficially (e.g., "(C) is weird," "high-D is ugly").  
  - **4 marks:** Identifies *specific* costs: (C) → loss of experimental modularity; high-D ψ → emergence problem.  
  - **5 marks:** As above + notes *asymmetry*: (C) threatens reproducibility; high-D challenges spatial intuition.  
  - *Common error:* Claims both costs are "equally bad" without analysis.  

  #### **4. Bohm/Everett as ψ-ontic with differing (B) status (✓ settled)**  
  - **3 marks:** Names theories but misses ψ-ontic status.  
  - **4 marks:** Correctly notes both are ψ-ontic.  
  - **5 marks:** As above + contrasts Bohm (ψ physical) vs. Everett (ψ often nomological/branching law).  
  - *Common error:* Calls Everett "ψ-epistemic."  

  #### **5. Own stance on tie-breaker + currency**  
  - **3 marks:** Takes no position or only surveys options.  
  - **4 marks:** Takes position but ignores "same currency?" query.  
  - **5 marks:** Defends stance + answers currency (e.g., "costs differ: (C) operational, (B) conceptual; no empirical tie-breaker").  
  - *Common error:* Asserts future experiments will decide.  

  #### **A/B Boundary (A = 20+/25; B = 16–19/25)**  
  An **A answer** must:  
  - Clearly **separate (A) and (B)** (e.g., not treating ψ-onticity as entailing configuration-space realism).  
  - **Commit to a stance** on the tie-breaker (even if tentative), addressing whether costs are comparable.  
  A **B answer** may conflate (A)/(B) or avoid tie-breaker commitment.  

  ---

  ### Model Answer Epistemic Posture Note  
  The model answer takes these stances a candidate could reasonably reject:  
  - **Denying independence (C) collapses into superdeterminism:** A candidate could argue preparation-correlation is less radical than measurement-correlation.  
  - **No empirical tie-breaker:** A candidate might propose tests for high-dimensional effects (e.g., via gravity).  
  - **Conceptual tie-breaker favors (B):** A candidate could defend independence-denial as less revisionist than 3N-D space.  
  *(Marking rewards flagging contestation, e.g., "Though contested, I argue...")*
