prompt: |-
  I run a one-day working group — four philosophers, a health economist, and two people who work in disability policy — that has to produce a single-page diagnostic: a decision tree sorting anyone who calls themselves an egalitarian into a named position on the question of equality of what. Everyone in the room agrees that inequalities matter and disagrees about what is supposed to be equalized, and the disagreement keeps resurfacing as a practical one about what a public health system should itself be trying to equalize. So the branching should be organized around distinctions that bite on allocation decisions, not around the history of the debate.

  Please write the tree under the following constraints.

  Build it from the logical space rather than from a list of names: first the questions and the combinations of answers they allow, then the actual positions located in that space. Every node must be a question a participant could answer without already knowing which view it leads to — preferably a concrete case — and every branch must be labeled by the claim that separates it from its siblings.

  Currency is not the only axis, and I don't want the whole tree to be the familiar menu of welfare, resources, capabilities, and access to advantage. Include at least two further axes: the timing or aggregation question (is the unit of assessment a whole life, a time slice, or the worst period a person can reasonably expect?), and the question of whether equality is doing fundamental work or merely proxying for something else — sufficiency, priority, non-domination, or standing as an equal. Luck egalitarianism, and the non-egalitarian neighbors it shades into, should appear as leaves, as should the relational view.

  Each leaf carries either the standard name of the position or the label "unnamed — nobody defends this," plus one sentence on its most awkward commitment or, for unoccupied regions, on why nobody is there (incoherent, unattractive, or merely unexplored). Where two views give the same answers throughout your questions, flag the pair as unseparated rather than splitting them with a cosmetic distinction.

  One leaf should be a position I have been toying with and cannot place: call it the Recoverability View. What should be equalized is not welfare, resources, or capabilities but each person's expected ease and speed of getting back to a decent baseline after the worst setback that could reasonably befall them — illness, job loss, bereavement, a bad but reversible choice of their own. It is meant to capture something about security that resource- and capability-based views miss, and to come apart from them on cases where two people have the same bundle and the same functionings but very different prospects of recovery. Place it on the tree; name the nearest existing position it collapses into, if it collapses into any; and give the single case you would use to separate it from that neighbor.

  The cases at the nodes have to be usable by people whose day jobs are health policy and disability services: voluntary expensive tastes; tastes formed under deprivation and later endorsed; a person with a disability whose adaptive preferences are genuine; an outcome that is the person's own fault in a fully voluntary way versus one that was merely foreseeable. Add at least one case of your own construction that separates two views the above do not separate.

  Audience and size: ten branch questions at most, eight to twelve leaves, written so that a smart non-specialist can work through it in twenty minutes. Include a short scoring note on how to read an answer pattern, including what to do with someone whose answers land in an unoccupied region of the space.

  Two further things I want, briefly. First, mark the placements that rest on a contested reading of a position — the points where a specialist in that view would say you have misdescribed it — and say where the tree's construction is most likely to fail: which distinction you suspect is doing less work than the tree implies. Second, say what would make you redraw it: which answer pattern from a real participant, or which case, would force a different branching order.

  Hard limit: the entire response — tree, scoring note, flags, and caveats — must fit in 1,000 words, with no more than 300 of those written as continuous prose rather than as tree or notes.
reasoning: |-
  Hmm, this is a fascinating and highly specific request about creating a decision tree for egalitarian positions. The user is leading a diverse working group that needs to produce a practical diagnostic tool focused on allocation decisions in public health systems. They've given very clear constraints: it must be logically structured, concrete-case based, and limited to 10 branch questions with 8-12 leaves.

  The key challenges I need to address:
  - Building around allocation-relevant axes beyond the standard "currency" debate
  - Incorporating timing/aggregation and equality's fundamental role
  - Placing the user's "Recoverability View" accurately
  - Using policy-relevant cases like adaptive preferences and voluntary choices
  - Keeping it usable for non-specialists within strict word limits

  For structure, I'm considering a three-axis approach: 
  1) The fundamental aim (what equality is really about)
  2) The currency (what's being equalized)
  3) Temporal unit (when we measure)

  The user's Recoverability View seems distinct - it's about resilience rather than static states. I'll position it as a leaf that values expected recovery speed after worst-case setbacks. To separate it from capability views, I'd use a case where two people have identical current capabilities but different recovery prospects after identical shocks.

  Notable constraints:
  - Must include concrete cases at each branching point
  - Need to flag contested interpretations
  - Identify where the tree might oversimplify
  - Stay under 1000 words with minimal prose

  The cases will include policy-relevant scenarios like:
  - Disability with adaptive preferences
  - Self-inflicted vs foreseeable disadvantages
  - A new case about genetic risk vs actual health status

  I'll note that the most contestable part is treating "fundamental aim" as prior to currency, as some theorists might see these as intertwined. If someone endorsed both outcome responsibility and lifetime focus while rejecting desert, that would require restructuring.

  The scoring note will explain how to handle unoccupied positions - either as incoherent or unexplored. For the tree itself, I'll keep questions concrete and branching labels clear, ensuring each node is answerable without knowing the destination.
answer: |-
  ### Egalitarian Diagnostic Decision Tree (1-Page)

  **Instructions:** Answer each question in sequence based on your considered judgment about what matters morally for distributive justice in health policy. Your answers will place you in a named position (or an unnamed category) based on the logical space of egalitarian views. Focus on *why* an inequality might be unjust, not historical labels.

  ---

  **1. Should we care about eliminating *all* inequalities in people’s lives, or only those causing severe disadvantage?**  
     → **Branch A: Eliminate *all* morally arbitrary inequalities** → Go to 2  
     → **Branch B: Ensure *no severe disadvantage* (sufficiency)** → Go to 3  

  **2. (If A) Is equality’s value primarily about fair *outcomes* or equal *social standing*?**  
     → **Branch A1: Fair *outcomes* (distributive)** → Go to 4  
     → **Branch A2: Equal *social standing/relations* (relational)** → **Leaf: Relational Egalitarianism**  
     → *Commitment:* Prioritizes dismantling hierarchies (e.g., stigma in disability services) over equalizing resources/welfare.  

  **3. (If B) Is the goal to protect people from *any* significant harm, or specifically from *domination* by others?**  
     → **Branch B1: Protect from *significant harm*** → Go to 4  
     → **Branch B2: Protect from *domination*** → **Leaf: Non-Domination Sufficientarianism**  
     → *Commitment:* A well-resourced patient coerced into treatment by insurers is worse off than one with fewer options but no coercion.  

  **4. What *fundamentally* should be equalized/protected? (Concrete case: Two people need wheelchairs. One has chronic pain (reduced welfare), the other has higher resilience but faces accessibility barriers (reduced capabilities). Allocating one chair, which need matters most?)**  
     → **Branch: Equal *welfare* (happiness/preference satisfaction)** → Go to 5  
     → **Branch: Equal *resources* (material goods/income)** → Go to 6  
     → **Branch: Equal *capabilities* (real freedoms to function)** → Go to 7  
     → **Branch: Equal *recovery security* (resilience to setbacks)** → **Leaf: Recoverability View**  
     → *Commitment:* Values equalizing expected recovery time after worst credible setbacks (e.g., job loss + illness). *Separated from capabilities:* Two diabetics with identical current functionings and resources, but one has genetic risk of amputation (slower recovery prospect). Collapses into no named view.  

  **5. (If welfare) Should we compensate for welfare deficits due to *expensive tastes*? (Case: Person A needs $1000 for dialysis to achieve basic welfare. Person B needs $1000 for caviar to achieve equal welfare due to cultivated taste.)**  
     → **Branch: Compensate *only* if tastes aren’t responsibly chosen** → **Leaf: Responsibility-Sensitive Welfare Equality**  
     → *Commitment:* Denies dialysis funding to someone who recklessly caused kidney failure.  
     → **Branch: Compensate *regardless* of responsibility** → **Leaf: Strict Welfare Egalitarianism**  
     → *Commitment:* Funds caviar if needed to equalize welfare, even if wasteful.  

  **6. (If resources) Over what time frame? (Case: Person A has low lifetime resources due to a congenital disability. Person B has equal lifetime resources but lost them all temporarily in a speculative gamble.)**  
     → **Branch: Equal *lifetime* resources** → **Leaf: Resource Egalitarianism (Dworkinian)**  
     → *Commitment:* Compensates congenital disability, not gambler’s loss.  
     → **Branch: Equal *periodic* resources** → **Leaf: Unnamed — nobody defends this**  
     → *Why:* Unattractive; punishes congenital disability if resources are measured per-month.  

  **7. (If capabilities) Should we hold people responsible for *choices* reducing capabilities? (Case: Two smokers develop lung cancer. One started pre-addiction in adolescence under deprivation (non-voluntary), the other post-deprivation with full awareness.)**  
     → **Branch: *Never* hold responsible — compensate all capability deficits** → **Leaf: Capability Egalitarianism (Sen/Nussbaum)**  
     → *Commitment:* Funds treatment for voluntary smokers equally.  
     → **Branch: Hold responsible for *fully voluntary* choices** → Go to 8  

  **8. What temporal unit matters? (Case: Person A has a short, severely impaired life. Person B has equal lifetime capability but a long period of impairment recoverable with treatment.)**  
     → **Branch: Equal *lifetime capability*** → **Leaf: Luck Egalitarianism (Capability Variant)**  
     → *Commitment:* Prioritizes Person A (worse lifetime prospect) over Person B’s temporary setback.  
     → **Branch: Equal *worst-period capability*** → **Leaf: Unnamed — unexplored**  
     → *Why:* Unexplored; focuses only on minimizing deepest capability troughs.  

  **9. (If 7 → responsibility) Should we mitigate *foreseeable* but not *intended* harms? (New case: Two construction workers. One skips safety training (intended risk), the other uses training but is hit by a freak accident (foreseeable but unintended). Both need costly rehabilitation.)**  
     → **Branch: Mitigate *only* unintended harms** → **Leaf: Strict Responsibility View**  
     → *Commitment:* Denies rehab to the trained worker; treats foreseeable accidents as "chosen".  
     → **Branch: Mitigate *all non-reckless* harms** → **Leaf: Moderate Luck Egalitarianism**  
     → *Commitment:* Funds rehab for both if accident wasn’t reckless.  

  ---

  **Scoring Note:**  
  - Match your answer path to the leaf. If you land in an **unnamed** region:  
    - "Incoherent" → Contradictory commitments (e.g., Branch 6 → periodic resources).  
    - "Unattractive/Unexplored" → Logically possible but undefended (e.g., worst-period capability).  
  - **Unseparated pairs:** Luck Egalitarianism (resources) and Luck Egalitarianism (capability) give identical answers here.  
  - **Recoverability View:** Separated by the diabetic case (identical capabilities/resources ≠ recovery prospects).

  **Contested Placements & Caveats:**  
  - (*) Relational Egalitarianism (Branch A2): Some argue it *can* care about distributive outcomes instrumentally. The tree assumes a strict non-distributive reading.  
  - (*) Capability Egalitarianism (Leaf 7): Some proponents accept mild responsibility-sensitivity. The tree reflects dominant "anti-responsibility" interpretations.  
  - **Weakest distinction:** Branch 1 (A vs. B) may oversimplify; hybrid views exist. Priority views are merged with sufficiency (Branch B1).  
  - **Redraw trigger:** A participant endorsing *both* (1) outcome responsibility *and* (2) lifetime focus *while* (3) rejecting desert claims (Branch 5). This would require a new "desert-catered" branch.  

  **Word Count:**  
  - Tree & Labels: ~650 words  
  - Notes & Caveats: ~250 words  
  - Total: ~900 words
