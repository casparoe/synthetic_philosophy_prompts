prompt: |-
  I've somehow let myself be talked onto my country's advisory panel on technological risk — six meetings a year, no staff of our own, a mandate that basically just says we're supposed to weigh uncertain risks before they land. I'm the token philosopher. I've been reading back through our decisions since 2019 because we've got a genuinely nasty one coming up and I'd like to say something non-embarrassing, and the thing that's bugging me is that I can read our own track record two or three different ways and I can't tell which one is actually ours.

  What we've done so far, compressed:

  - Insect-resistant GM maize: ok'd contained field trials, told them to hold off commercial planting for five years pending gene-flow and soil studies.
  - A flame retardant used in children's mattresses, thin evidence of developmental harm, a cheap substitute already on the market: recommended phasing it out.
  - Radio-frequency exposure from mobile masts, weak and contested epidemiology, nothing really to substitute for it, and a mast can be turned down or moved: no restriction, just disclosure and voluntary siting guidance.
  - A degreasing solvent with forty years of use behind it, small and uncertain carcinogenic risk, a ban would gut a domestic industry: no restriction, monitoring only.
  - A few years back, during the epidemic, a vaccine with incomplete safety data: we recommended rolling it out immediately, on the grounds that delay had a body count of its own.
  - A consumer credit scoring model using postcode-level proxies, no demonstrated disparate impact: we told them to drop the proxies, because the people on the receiving end couldn't see the decision, couldn't contest it, and couldn't get out of its way.
  - A proposal to sell mild cognitive enhancers from vending machines on campuses: we came out against it even though the safety data was decent, mainly because once everyone's taking them, not taking one stops being a free choice.

  The live case. A ministry wants to require that every smart speaker and every microphone-equipped TV sold here ship with an always-on ambient audio classifier, running locally on the device, listening for three things: falls and speech-pattern collapse in the over-70s, and sounds of violence between adults in the home. On a hit it alerts a human-staffed centre that can send an ambulance or the police. No raw audio leaves the device — only a flag and a twenty-second clip from around the moment of the hit. Mandatory on all new devices, so roughly four years to near-universal household coverage; no opt-out for the purchaser, though of course anyone can unplug the thing. The vendor says the false-positive rate is low but won't publish the numbers, and the proposed evaluation is a twelve-month pilot in two cities with the metrics chosen by the vendor. The ministry considered and rejected the alternative of subsidising personal alarm pendants plus an awareness campaign: about five times the cost per life-year and far lower coverage.

  Here's what I'd like from you. What should we decide if we want to be consistent with ourselves — wave it through, wave it through with conditions, or recommend against — and which of our seven is the closest analogue, and why that one rather than the others? The three rules I keep coming back to for our record are something about how bad the worst case is, something about whether the people bearing the risk opted in and can get out, and something about whether we can unwind the thing later; I suspect at least two of those come apart on this case, and I want to know which, what each predicts, and which one you'd bet we're really running. If our precedents genuinely underdetermine it, tell me what principle we'd be committing ourselves to with each of the three options, because that's what I'll end up saying out loud. And if you could design the variant of this case that would best tell the competing rules apart — change one feature at a time — that's the bit I'd find most useful, since I might actually get to ask for it.

  One more thing I'm unclear on and you can take or leave it: everything we've ever ruled on has been a substance or a machine, and this is arguably a change in what people do to each other in their own kitchens. Does that matter for whether our whole way of talking applies, or is that a distinction without a difference? Sorry, this got long — hope it's not too much.
reasoning: |-
  Okay, the user is part of a technological risk advisory panel and needs help deciding on a tricky case involving always-on audio classifiers in smart devices. Let me unpack their situation.

  First, they're a philosopher on this panel, which means they likely bring an ethical perspective to these discussions. They've reviewed past decisions and identified three recurring principles: worst-case severity, opt-in/escape options, and reversibility. Now they're facing a case where these principles might conflict.

  Looking at the current proposal - mandatory audio monitoring for health/safety emergencies in homes. Key concerns: no opt-out for buyers (though they can unplug), irreversible social normalization of surveillance, and unpublished false-positive rates. The ministry rejected cheaper alternatives like panic buttons.

  Hmm... the user wants to know how to be consistent with their past decisions. Let me mentally walk through their precedents:

  The GM maize case shows they value containment and reversibility - field trials yes, commercial no. The mattress flame retardant was phased out because safer alternatives existed. RF exposure got minimal restrictions since alternatives weren't feasible. The solvent wasn't banned due to economic impact despite cancer risks. The vaccine was approved despite risks because inaction meant lives lost. The credit scoring was rejected due to lack of transparency and escape options. Cognitive enhancers were blocked because of social coercion concerns.

  The cognitive enhancer case feels most analogous here - both involve social pressure altering fundamental choices. But the vaccine case is tempting too because of urgent life-saving potential. However, the key difference is that vaccines were opt-in, while this monitoring is mandatory by default.

  The user's three principles create tension here:
  - Worst-case severity: False positives could lead to violent police interventions (very bad)
  - Opt-in/escape: No meaningful opt-out for buyers (renters/elderly might not control devices)
  - Reversibility: Once normalized, home surveillance might be impossible to roll back

  If I had to bet, their panel seems to weight "freedom to exit" most heavily based on the credit scoring and cognitive enhancer cases. The solvent decision shows economic impact can override small risks, but that doesn't apply here.

  For the "variant test" to distinguish principles: Imagine if the system was opt-in instead of mandatory. That would resolve the escape-route concern while preserving benefits, making it more like the vaccine case. If the panel still opposed it, that would reveal deeper worries about irreversibility or worst-case scenarios.

  The social vs technical distinction matters too. Past cases were about product risks, but this changes human interactions in private spaces. The cognitive enhancer decision touched on social dynamics, so that's probably their closest precedent for considering relational impacts.

  What the user might really need is help articulating why this feels different beyond their usual framework. The core tension is between preventing physical harm and preserving domestic autonomy - a values conflict their precedents haven't directly addressed. They'll need to decide which principle they've implicitly valued higher when these collide.
answer: |-
  Based on your panel's precedents and underlying principles, here's how the live case breaks down:

  **Recommended Decision:**  
  **Conditional Approval with Stricter Safeguards**  
  *(Not an outright "no," but far from waving it through)*  

  **Closest Analogue:**  
  **The Cognitive Enhancers Case**  
  *(With secondary echoes of the credit scoring model)*  

  ### Why This Analogue Fits Best:
  1. **Loss of Meaningful Choice**  
     Like cognitive enhancers creating social coercion ("you *must* take pills to compete"), this system removes the choice to **opt out of ambient surveillance** in private spaces. Unplugging isn't a realistic escape (e.g., for elderly users dependent on voice-activated aids, renters with landlord-installed devices). Your panel explicitly rejected technologies that undermine voluntary participation.

  2. **Transformative Social Impact**  
     Both cases involve **changing fundamental human interactions** (academic fairness → domestic privacy). The enhancers ruling prioritized social consequences over individual safety; here, the risk is normalizing in-home monitoring, altering family dynamics and autonomy.

  3. **Irreversibility Concern**  
     Just as campus pill-use could become entrenched, universal deployment of always-on classifiers makes retreat nearly impossible. Past decisions (GM maize, solvent) valued reversibility; this system fails that test.

  ### Why Other Analogues Don't Fit:
  - **Vaccine**: Urgency justified incomplete data due to *imminent, measurable deaths*. Here, alternatives exist (pendants), and harm is probabilistic.
  - **Credit Scoring**: Similar opacity ("can't see/contest"), but *financial* harm ≠ *physical intrusion*. Your panel may weight privacy breaches more heavily.
  - **Solvent/RF Masts**: Economic impact or lack of substitutes drove leniency. Here, the ministry *rejected* a cheaper alternative (pendants), weakening their case.
  - **GM Maize**: Reversibility was possible via containment. This system's scale prevents that.

  ### How Your Three Principles "Come Apart":
  | **Principle**          | **Predicts**          | **Conflict Point**                                  |
  |------------------------|-----------------------|-----------------------------------------------------|
  | **Worst-Case Severity**| **Approve**           | Preventable deaths (falls/assaults) outweigh false positives. |
  | **Opt-In / Escape**    | **Reject**            | No meaningful consent; vulnerable groups can't evade deployment. |
  | **Reversibility**      | **Reject**            | Universal adoption normalizes surveillance → impossible to undo. |

  **Which Principle Wins?**  
  Your panel consistently prioritizes **Opt-In / Escape** when harm is societal rather than purely physical (enhancers, credit scoring). Bet on this being your "real" rule. The cognitive enhancers decision proves you'll block even low-safety-risk tech that compromises autonomy.

  ---

  ### Designing a "Test Variant" to Clarify Principles:
  Change **ONE** feature to see which principle dominates:  
  **Make the system OPT-IN instead of mandatory.**  
  - If approval follows → **Worst-Case Severity** is dominant (you value lives over autonomy when choice exists).  
  - If rejection holds → **Reversibility/Social Impact** dominates (you fear normalization even with consent).  

  *(Example: If opt-in still draws opposition, your panel fears the "slippery slope" where voluntary use pressures others to comply.)*

  ---

  ### On the "Substance vs. Social" Question:
  **It matters profoundly.** Your past cases involved *tools*; this imposes *relational rules*. Monitoring violence between adults isn't just technical risk—it inserts the state into intimate conflicts, risking escalation (e.g., police dispatched to heated arguments). Your cognitive enhancers ruling is the precedent here: you *already* treated social coercion as a first-order risk. Apply that lens rigorously.

  ---

  ### What to Say in the Meeting:
  > "Our precedents show we block technologies that compromise autonomy *even when safety data is solid* (cognitive enhancers), especially when escape isn't feasible (credit scoring). This system fails that test.  
  >   
  > **But** the vaccine case teaches us that inaction has costs. So we should conditionally approve **only if**:  
  > 1. **Opt-out becomes mandatory** (physical switch + software disable),  
  > 2. **Vendors publish false-positive rates** from independent audits,  
  > 3. **Pilot metrics include disparate impact studies** (e.g., false alarms in loud households),  
  > 4. **Raw audio clips are never stored or transmitted**—only machine-generated alerts.  
  >   
  > Without these, we normalize surveillance without consent, violating our core principle: *technological risk must not trap people in systems they didn't choose.*"

  This balances consistency with the live case's stakes. You uphold your focus on autonomy while acknowledging the ministry's public health goal—but force them to address the social hazards your panel has historically rejected.
