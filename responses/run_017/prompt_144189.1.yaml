  Based on your description, your friend's certainty equivalent (CE) for binary lotteries with one prize (win \(x\) with probability \(p\), otherwise nothing) is consistently \(p^2 x\), which matches both the square-root utility model and the probability weighting model with \(w(p) = p^2\) for these cases. However, these models diverge for gambles with multiple non-zero outcomes, such as the two coin flips you described. Below, I'll break down the analysis:

  ### 1. **Cash Values for the Two Coin Flips Under Each Model**
  Both flips have an expected monetary value (EMV) of $250, but the certainty equivalents differ between models.

  - **Square-root utility model** (utility function \(u(m) = \sqrt{m}\)):
    - **100-or-400 flip** (50% $100, 50% $400):  
      Expected utility = \(0.5 \times \sqrt{100} + 0.5 \times \sqrt{400} = 0.5 \times 10 + 0.5 \times 20 = 15\).  
      CE solves \(\sqrt{\text{CE}} = 15\), so \(\text{CE} = 15^2 = 225\).  
      **Cash value: $225**
    - **0-or-800 flip** (50% $0, 50% $800):  
      Expected utility = \(0.5 \times \sqrt{0} + 0.5 \times \sqrt{800} = 0.5 \times 0 + 0.5 \times \sqrt{800}\).  
      \(\sqrt{800} = \sqrt{100 \times 8} = 10\sqrt{8} = 20\sqrt{2} \approx 28.28\), so expected utility \(\approx 0.5 \times 28.28 = 14.14\).  
      CE solves \(\sqrt{\text{CE}} = 14.14\), so \(\text{CE} \approx 14.14^2 = 200\).  
      **Cash value: $200**

  - **Probability weighting model** (linear utility \(u(m) = m\), weighting function \(w(p) = p^2\)):
    - **100-or-400 flip** (outcomes ranked worst to best: $100 then $400):  
      Weight for $100 = \(w(P(\leq 100)) - w(0) = w(0.5) - 0 = (0.5)^2 = 0.25\).  
      Weight for $400 = \(w(1) - w(P(\leq 100)) = w(1) - w(0.5) = 1 - 0.25 = 0.75\).  
      Value (CE) = \(0.25 \times 100 + 0.75 \times 400 = 25 + 300 = 325\).  
      **Cash value: $325**
    - **0-or-800 flip** (outcomes ranked worst to best: $0 then $800):  
      Weight for $0 = \(w(P(\leq 0)) - w(0) = w(0.5) - 0 = (0.5)^2 = 0.25\).  
      Weight for $800 = \(w(1) - w(P(\leq 0)) = w(1) - w(0.5) = 1 - 0.25 = 0.75\).  
      Value (CE) = \(0.25 \times 0 + 0.75 \times 800 = 0 + 600 = 600\).  
      **Cash value: $600**

  ### 2. **Best Guess at the Rule and Reason**
  - **Best guess**: Your friend is using the **square-root utility model** (\(u(m) = \sqrt{m}\)) with no probability weighting. This means she curves the value of money but treats probabilities linearly.
  - **Reason for preference**:
    - Both models fit the existing binary prize-or-nothing data perfectly (CE = \(p^2 x\) in all cases). However, the probability weighting model with \(w(p) = p^2\) predicts risk-seeking behavior for symmetric gambles with multiple gains (e.g., CE > EMV for both flips, especially $600 for 0-or-800). This is inconsistent with your friend's demonstrated risk aversion in previous choices:
      - All her CEs for binary prize-or-nothing lotteries are below EMV (e.g., 50% at $200: CE $50 < EMV $100), indicating risk aversion.
      - She chose the 60%-at-$150 ticket over the 50%-at-$200 ticket despite a lower EMV ($90 vs. $100), favoring a higher probability of winning, which also suggests risk aversion.
    - The square-root utility model maintains risk aversion for all gambles (CE < EMV where possible), including the new flips (e.g., $200 for 0-or-800 < EMV $250), which aligns better with her behavior. In contrast, the probability weighting model's prediction of high CEs like $600 for 0-or-800 implies risk-seeking, which seems implausible given her history.
    - Additionally, the square-root utility is simpler and more standard for modeling risk aversion in economics, as it doesn't require introducing probability distortions. Your friend's "gut reactions" might stem from diminishing marginal utility of money, not from mentally distorting probabilities.

  - **Other models that fit the old data**: As you suspected, there is a family of in-between models where caution is split between utility curvature and probability weighting. For example, with power utility \(u(m) = m^a\) and probability weighting \(w(p) = p^b\), the binary prize-or-nothing CE is \(p^{b/a} x\). To fit CE = \(p^2 x\), we need \(b/a = 2\). Cases include:
    - \(a = 0.5, b = 1\): Square-root utility (no weighting).
    - \(a = 1, b = 2\): Linear utility with \(w(p) = p^2\) weighting.
    - Intermediate, e.g., \(a = 0.6, b = 1.2\): Some curvature and some weighting.
    All these fit the old data but diverge for complex gambles. The square-root utility is the most parsimonious and consistent with risk aversion.

  ### 3. **Extra Gamble to Pin Down the Rule**
  To distinguish the models, propose a **three-outcome gamble** with equal probabilities, such as:  
  - **Gamble**: 1/3 chance of $0, 1/3 chance of $250, 1/3 chance of $500 (EMV = $250).

  **Predictions under key models**:
  - **Square-root utility** (\(u(m) = \sqrt{m}\)):
    - Expected utility = \(\frac{1}{3} \sqrt{0} + \frac{1}{3} \sqrt{250} + \frac{1}{3} \sqrt{500} = \frac{1}{3}(0 + \sqrt{250} + \sqrt{500})\).
      \(\sqrt{250} \approx 15.81\), \(\sqrt{500} \approx 22.36\), so EU ≈ \(\frac{1}{3}(38.17) \approx 12.723\).
    - CE = \((12.723)^2 \approx 161.88\).
    - **Cash value: ~$162 (risk-averse, CE < EMV)**.
    
  - **Probability weighting with \(w(p) = p^2\) and linear utility**:
    - Outcomes ranked: $0 (worst), $250, $500 (best).
    - Weight for $0 = \(w(P(\leq 0)) - w(0) = w(1/3) - 0 = (1/3)^2 = 1/9 \approx 0.111\).
    - Weight for $250 = \(w(P(\leq 250)) - w(P(< 250)) = w(2/3) - w(1/3) = (2/3)^2 - (1/3)^2 = 4/9 - 1/9 = 3/9 \approx 0.333\).
    - Weight for $500 = \(w(1) - w(P(\leq 250)) = 1 - w(2/3) = 1 - 4/9 = 5/9 \approx 0.556\).
    - Value (CE) = \(0.111 \times 0 + 0.333 \times 250 + 0.556 \times 500 \approx 0 + 83.25 + 278 = 361.25\).
    - **Cash value: ~$361 (risk-seeking, CE > EMV)**.

  - **Intermediate model (e.g., \(a = 0.6, b = 1.2\))**:  
    - This would give a CE between the two extremes (e.g., around $200–$300), depending on parameters. It helps if her response doesn't match pure models.

  **Why this gamble?**  
  - It has non-extreme outcomes and a clear ranking, amplifying differences between models. If she provides a CE around $160–$170, it supports square-root utility. If she says $350+, it supports probability weighting. A moderate value (e.g., $200–$300) suggests an in-between model. It also tests if her risk aversion generalizes beyond binary cases.

  ### 4. **Prediction for Which Flip She Takes**
  Based on the square-root utility model (my preferred rule), she values the 100-or-400 flip at $225 and the 0-or-800 flip at $200. Since $225 > $200, she should prefer the 100-or-400 flip. This also aligns with her risk-averse tendencies: the 100-or-400 flip has a minimum gain of $100 (less risky), while the 0-or-800 flip has a 50% chance of $0 (more volatile and likely less appealing to her).

