prompt: |-
  you're a metaphysician who's been stuck in the modal literature for like fifteen years, the kind of person who has opinions about whether the counterpart relation has to be symmetric. take this seriously and think it through carefully — start with a short brainstorm of the cases you're going to need before you write anything up, and be blunt where you think I've got something wrong.

  I'm trying to write the background section of a paper on de re modality and I keep tripping over the fact that everyone in this argument seems to be working from a different shopping list of what a theory has to deliver. So before I read any more of it I want the spec, not another survey.

  What the theory is for: an account of de re modal claims about ordinary concrete objects — this table could have been made of something other than wood, I could have missed that flight, Humphrey could have won, there could have been one more person than there are — good enough to sit underneath arguments that move from modal premises to conclusions about essence, about coincidence and composition, and about supervenience. So it has to actually deliver truth conditions, or at least a decent story about what makes those claims true, and not merely a translation scheme that rewrites modal English into first-order talk about a plurality of worlds.

  Here's the pile of things I've seen people demand, and I genuinely can't tell which are real requirements and which are just loyalty to a camp. Sort it for me: that an object can literally exist at more than one world versus that the theory never commits you to one thing being wholly present at two worlds; that de re claims be about the very object rather than about some surrogate; that the whole thing work without concrete other worlds; that it respect the necessity of identity and of distinctness; that it have something to say about objects that exist at only one world and have counterparts nowhere; that it not automatically make every property of such a lonely object necessary; that it make origins essential while leaving accidental intrinsics contingent; that similarity do the work without dragging in symmetry or transitivity; that modal truth not swing around with whatever is salient in the conversation; that it take a principled line on the Barcan formulas and contingent existence; that it use one and the same machinery for a thing's persistence through time and for its goings-on at other worlds; that it either allow merely possible objects into the domain or at least not blur could have existed into does exist.

  And here are some cases I invented because the standard ones all seem rigged in somebody's favour. What I want to know is what a theory must be able to say about each, not what your favourite theory does say.

  1. The two heirs. Some object divides into A and B, perfectly symmetric, both of them equally similar to the original and to each other. A similarity-based relation either picks arbitrarily, says both are me (so one object has two successors), or goes indeterminate. Should a theory be required to give a determinate answer here, or is branching an acceptable output?

  2. The swap. Two worlds, w and v. In w, X has the causal biography and modal role that Y has in v, and Y has X's; everything intrinsic about them is traded. Which is which? Is there a fact of the matter? And is a theory that has no answer any worse off than one that answers by stipulation?

  3. The merge. A and B, distinct origins, fuse into C. Somewhere else a single thing splits into two that each trace back to the fused material. Whatever your theory says here has to stay consistent with what it said about case 1, and I suspect that constraint is doing more work than anyone admits.

  4. The lonely object. Exists at exactly one world, zero counterparts anywhere else. Does it come out having all its properties necessarily, and is that a cost or a consequence the theory should just own? If it's a cost, what structure does the theory need in order to avoid it?

  5. Near tie. A world with two candidates, one slightly better along respect R1 and the other slightly better along R2, no weighting given. How much of a story about the respects of comparison does a theory owe us before it can be assessed at all?

  So: give me the numbered requirements list, with the case or consideration behind each one and what goes wrong for a theory that misses it. Mark each as non-negotiable or as a preference of a particular kind of theorist, and say whose. Flag any pair or subset of the requirements you think can't be jointly satisfied — if the honest result is that the list itself is unsatisfiable and the interesting work is in deciding what to drop, that's the part I most want, so say that plainly rather than quietly weakening a requirement to make the list add up. Tell me which single requirement does the most work in excluding candidates, and which of my five cases is the one that really separates the views rather than the one that just looks dramatic.

  Then, briefly — a table is fine, a few lines per view, no more — score these three against your list: the counterpart-theoretic picture where similarity plus context does the work; the transworld identity picture where individual essences or haecceities do it; and the stage-theoretic picture where temporal and modal counterparthood are the same phenomenon. If you'd rather swap in a different third view, do. Don't recieve this as an invitation to summarise the literature, don't tell me what to read, and don't pad it with citations — I want the criteria.
reasoning: |-
  Hmm, the user is a metaphysician deep into modal logic, frustrated with the lack of clear criteria for evaluating de re modality theories. They want a rigorous specification of what a theory must deliver, not another literature survey. Their core need is to cut through tribal allegiances in the field and identify non-negotiable requirements.

  Looking at their demands list, I notice several tensions. The transworld identity vs. counterpart theory divide creates immediate friction - you can't have both literal identity across worlds and avoid concrete other worlds. The necessity of distinctness also clashes with certain interpretations of branching cases. 

  The heir case highlights a fundamental choice: must theories resolve all modal ambiguities deterministically? I suspect this is where views irreconcilably diverge - serious ontologists will demand determinacy while counterpart theorists embrace indeterminacy as feature.

  For evaluation, the swap case is surprisingly potent. Theories that rely on intrinsic properties or haecceities stumble here, while context-based approaches handle it better. It's more revealing than the dramatic but overplayed ship-of-Theseus tropes.

  The loneliness problem exposes a deep rift in modal metaphysics. If we reject necessary properties for singleton-world objects, we're forced to choose between brute modal facts or embracing ersatz worlds - neither option is cost-free.

  When scoring theories:
  - Counterpart theory's contextual flexibility handles swaps and near-ties well but fails the identity/diversity necessity tests
  - Transworld identity nails the logic but crumbles on swaps and requires concrete pluriverse
  - Stage theory unifies time/modality neatly but inherits all counterpart theory's problems while adding new ones with temporal parts

  The merge case is the silent killer - most theories haven't seriously engaged with asymmetric branching vs. fusion scenarios. Any unified account will hemorrhage here.
answer: |-
  Here's the distilled specification for a de re modality theory, derived from your demands and cases. Requirements are ranked by non-negotiability, with conflicts flagged. Your cases are integrated to test coherence.

  ### **Core Requirements (Non-Negotiable)**
  1. **Truth Conditions, Not Translation**  
     *Why*: Foundational. Must ground modal claims in reality (e.g., "this table could be plastic" requires *what makes this true*).  
     *Failure*: Mere symbol-shuffling (e.g., Lewisian rewriting) leaves metaphysics unanchored.  
     *Case*: All your examples demand this.

  2. **Respect Necessity of Identity & Distinctness**  
     *Why*: Logical bedrock. If ¬(∃x∃y)(x=y ∧ ◇x≠y) fails, quantification collapses.  
     *Failure*: Theories allowing "Humphrey could be Nixon" (without surrogate-relativism) are incoherent.  
     *Case*: *The Swap* exposes this: if identities cross worlds, swapped objects must retain self-identity.

  3. **Avoid Modal Collapse for Lonely Objects**  
     *Why*: Lonely objects (e.g., a unique particle in one world) must have contingent properties (e.g., "it could have been warmer").  
     *Failure*: If "exists at one world only" implies "all properties necessary", modality evaporates for singularities.  
     *Case*: *The Lonely Object* tests this. Fix requires either non-maximal worlds or irreducibly de re facts.

  4. **Contingent Existence Handled Principledly**  
     *Why*: Must distinguish "Humphrey might not have existed" from "there is a non-existent Humphrey".  
     *Failure*: Barcan clashes (e.g., ∀x□φ → □∀xφ) or blurring "could exist" with actual existence.  
     *Case*: *Two Heirs*: If original ceases, theory must explain how it *could* persist without entailing actual persistence.

  ### **Negotiable but Theory-Defining Requirements**
  5. **Transworld Identity vs. Surrogates**  
     *Preference*: Kripkeans (literal identity) vs. Lewisians (counterparts).  
     *Conflict*: Identity requires haecceities; surrogates risk "not *about* the object".  
     *Case*: *The Swap*: Identity theories *must* have haecceities to trace objects; counterpart theories can use contextual similarity.

  6. **Concrete vs. Ersatz Worlds**  
     *Preference*: Lewis (concrete) vs. Plantinga (abstract).  
     *Conflict*: Concrete worlds conflict with "no one thing wholly in two worlds"; ersatz worlds need robust representation.  
     *Case*: *Near Tie*: Ersatz theories need similarity metrics for abstracta; concrete theories use overlap.

  7. **Branching/Indeterminacy Tolerance**  
     *Preference*: Counterpart theorists accept indeterminacy (e.g., *Two Heirs*); identity theorists demand determinacy.  
     *Failure*: Insisting on determinacy in symmetric cases (*Two Heirs*, *Merge*) forces brute stipulation.  
     *Case*: *Merge*: If fusion C is a counterpart to both A and B, does it inherit their identities? Branching may be unavoidable.

  8. **Similarity Metrics Grounded**  
     *Why*: Prevents "truth swings with conversation".  
     *Preference*: Lewisians accept context-dependence; essentialists demand objective grounds.  
     *Case*: *Near Tie*: If R1/R2 are incommensurable, theory must specify if indeterminacy or weighting is allowed.

  ### **Inherent Tensions & Tradeoffs**
  - **Impossible Triad**:  
    - (A) No transworld identity (i.e., no literal object in >1 world)  
    - (B) Necessity of identity/distinctness  
    - (C) Truths about lonely objects are contingent  
    *Conflict*: (A)+(B) require surrogates, but (C) demands surrogates carry contingent properties *of the object* without identity.  
    *Only escape*: Brute modal facts or ersatz worlds with representational primitives.  

  - **Swap Case is the Litmus Test**:  
    Theories must either:  
    (i) Deny facts about "which is which" (counterpart theory)  
    (ii) Ground identity in non-qualitative haecceities (transworld identity)  
    (iii) Reject the possibility of perfect symmetric swaps (essentialism)  
    *No theory avoids cost here*; choice defines your camp.

  - **Merge Case is the Silo Breaker**:  
    Forces theories to unify branching (Two Heirs) with fusion. If branching is acceptable, merging must be symmetric; if not, both require ad hoc constraints. Most theories ignore this.

  ---

  ### **Theory Assessment vs. Requirements**
  | **Theory**               | Non-Negotiables (1-4) | Identity/Surrogate (5) | Worlds (6) | Branching (7) | Similarity (8) | Key Failure Point |
  |--------------------------|------------------------|------------------------|------------|---------------|----------------|-------------------|
  | **Counterpart Theory** (Lewis) | ✓ (avoids collapse via context) | Surrogates (contextual) | Concrete | Indeterminate (✓ for heirs) | Contextual (✗ if objective sim required) | Violates necessity of identity if counterparts non-symmetric. *Swap*: No fact of the matter. |
  | **Transworld Identity** (Kripke/Plantinga) | ✓ (haecceities fix identity) | Literal identity | Ersatz/Abstract | Deterministic (✗ for heirs/merge) | Essential properties | Requires haecceities (controversial). *Swap*: Must deny symmetry or posit primitive "thisness". *Lonely Object*: Needs brute contingency. |
  | **Stage Theory** (Sider) | ✗ (Lonely objects collapse: stages are world-bound) | Surrogates (temporal parts) | Concrete | Indeterminate | Contextual | Fails requirement 3: a stage has all properties necessarily. *Merge*: Identity over time ≠ modality. |

  **Strongest Excluder**: Requirement 3 (no modal collapse for lonely objects). It sinks stage theory and strains identity views.  
  **Most Discriminatory Case**: *The Swap*—forces commitment on identity grounds vs. context-dependence.  
  **Unavoidable Tradeoff**: Accept indeterminacy (sacrificing precision) or embrace haecceities (sacrificing parsimony).  

  **Conclusion**: The list **is unsatisfiable** without tradeoffs. Core tension: *determinacy vs. parsimony*. Non-negotiables 1-4 are achievable, but 5-8 force ideological choices. Your cases show that *Two Heirs* and *Merge* require branching-friendly theories, while *Swap* and *Lonely Object* exclude naive identity/ersatz hybrids. The field’s "shopping lists" reflect which cost each camp tolerates.
