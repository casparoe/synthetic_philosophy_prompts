  Key jokes to include: 
  - Ending elections because "voting misunderstands democracy" (point a). 
  - Policies lacking fixed goals since ends are "provisional hypotheses" (point b). 
  - The OII defining who counts as "affected parties" (point d), excluding redundant staff. 
