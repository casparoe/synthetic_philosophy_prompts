  - *What cannot be said*: The reverse engineer might assume that if there was a burial practice, it would leave some trace (like a side effect) unless it was designed not to. But in archaeology, it might be that the practice was so minimal that it leaves no trace, which is not a design but a consequence. Also, the idea that the society might have had a belief system that didn't require material expression is hard to represent in code. Code must do something to be present.

