answer: |-
  ### Translating the Archaeological Inference Problem into Reverse Engineering Vocabulary

  Your vocabulary of reverse engineering (RE) provides a powerful framework for interpreting archaeological inference, but the mapping is imperfect. I'll restate the core problem in your terms, then analyze where the mapping works, where it strains, and where it fails. Finally, I'll address your three cases and the residue, including your specific questions about "utilitarian vs. symbolic," the doorway bearing, and the "deposits as institution" claim.

  #### Restatement of Archaeological Inference in RE Terms
  - **Lossy compilation**: Human culture (source code) is compiled into material remains (binary) via actions and decisions. This compilation is lossy: high-level abstractions (e.g., beliefs, social rules) are optimized away, leaving only low-level artifacts. Just as a compiler strips type information and inlines functions, cultural "compilation" strips intentionality and context, leaving physical objects and features.
    
  - **Symbol-stripped artifacts**: Excavated objects are like stripped binaries—variable names (symbols) for function (e.g., "ritual object" vs. "tool") are absent. We recover meaning through patterns (e.g., repeated deposition contexts), akin to inferring function from call graphs or data flows in disassembly.

  - **Non-unique sources**: Multiple source programs (cultural intents) can compile to identical binaries (archaeological records). For example, votive offerings and stored wealth may produce similar deposition patterns, just as different C programs can compile to identical machine code after optimization.

  - **Formation processes as post-execution transforms**: Natural/cultural processes (e.g., erosion, reuse) alter the archaeological record after "execution" (site abandonment). These are like post-runtime modifications to a binary—disk corruption, patching, or obfuscation—that obscure the original program state.

  - **Absence of dynamic analysis**: Archaeology lacks runtime debugging; we only have static artifacts. Ethnoarchaeology (studying modern analogs) is like having a build system and known-source binaries—it provides ground truth for compilation processes (e.g., how rituals translate to material traces).

  - **Ethnoarchaeology as build system + corpus**: Ethnoarchaeological studies are debug builds with symbols intact. They offer a corpus of "known-source binaries" (e.g., documented rituals and their material outputs), helping reverse engineer stripped artifacts by revealing compilation rules (e.g., how a "votive offering" compiles to specific deposition patterns).

  **Where the mapping works (real work)**:
  - **Lossy compilation and non-unique sources** directly capture underdetermination: just as RE deals with many source programs producing the same binary, archaeology faces many cultural explanations for the same material pattern.
  - **Symbol stripping and static analysis** cleanly align with inferring function from structure. For example, inferring an axe's "purpose" from deposition context mirrors inferring a function's role from its call graph.
  - **Formation processes** as post-execution transforms are a strong fit—both fields must filter out noise to reconstruct original states.

  **Where it's a metaphor in a work shirt**:
  - **Human agency and meaning**: RE assumes binaries are deterministic outputs of code, but human culture involves non-algorithmic elements (e.g., emotion, symbolism). Unlike code, cultural "source" isn't always logical or consistent; it can be contradictory or emergent.
  - **Scale and emergence**: RE focuses on discrete programs, but archaeology deals with society-wide "distributed systems." Cultural patterns (e.g., shared doorway bearings) may arise from decentralized actions, not a central "codebase."
  - **Temporality**: Code execution is linear, but cultural time is layered. A site's "binary" accumulates over centuries, like a program with incremental patches, but without version control.

  The mapping excels at handling incomplete data and underdetermination but stumbles on human-specific elements like shared symbolism or non-instrumental behavior.

  ---

  ### Residue Report: Case-by-Case Analysis
  For each case, I'll outline:
  1. **RE-like conclusion**: What a reverse engineer would infer using your vocabulary.
  2. **Clean translation**: Elements that map directly to RE concepts.
  3. **Distorted translation**: Elements that map only after force-fitting.
  4. **Untranslatable residue**: What cannot be expressed in RE terms.
  5. **Specific questions**: Addressing "utilitarian vs. symbolic," the doorway bearing, and "deposits as institution."

  #### Case 1: Constant Doorway Bearing
  - **RE-like conclusion**: The bearing is a hard-coded constant in a shared routine. It's not an environment-dependent variable (like solar alignment), but a fixed value—possibly from a "library function" (e.g., a construction ritual). The non-unique sources are clear: it could be a deliberate constant, a legacy value (dead code), or an emergent byproduct (e.g., a loop unrolling into a fixed offset from a path).  
  - **Clean translation**: 
    - The bearing as a constant mirrors hard-coded values (e.g., `#define BEARING 205`). 
    - Candidate stories map to RE: "practical response" is a config parameter; "convention" is a magic number; "byproduct" is an algorithmic side effect (e.g., deriving bearing from a fixed path via a shared function).  
  - **Distorted translation**: 
    - "Convention" implies social transmission, which RE frames as code reuse (e.g., copying a function). But human imitation isn't as deterministic as code inheritance—it can drift or mutate.  
    - The "byproduct" story (bearing as artifact of a procedure) maps to an unoptimized loop or redundant calculation, but RE assumes intent behind code, whereas this might be unintentional.  
  - **Residue**: 
    - **Symbolic meaning**: If the bearing had ritual significance (e.g., facing a sacred site), RE can't represent this without symbols. We see the constant but not its "comment" (meaning).  
    - **Emergence without intent**: The bearing might arise from uncoordinated mimicry (like memetic drift), not a "shared routine." RE assumes a routine exists, but here it could be pure emergence.  
  - **Utilitarian vs. symbolic**: This isn't a code/data split. RE treats all values as data; "symbolic" is just data used in specific functions (e.g., a ritual module). The distinction is contextual, not innate—like a register holding a number that could be an address or a literal. Your framework forces a false dichotomy; both aspects can coexist in the same "object."  
  - **Constant via shared routine**: Yes, this has a direct analogue. The bearing is constant because every builder calls `get_bearing()`, which returns 205°—no one "chooses" it; it's computed by a shared function. This mirrors libraries or macros that standardize values.  
  - **Confidence**: 8/10. RE handles fixed values well, but emergence without code is a gap.

  #### Case 2: Axe Deposits
  - **RE-like conclusion**: The axes are data objects handled by a protocol. Their uniformity suggests mass production (like object pooling), while their deposition rules (sets of 3/8/12, no food/bone) imply a handler function with constraints (e.g., `ritual_deposit(axes)`). Non-unique sources abound:  
    - "Stored wealth" = data in a cache (e.g., a `wealth_array`).  
    - "Votive deposition" = passing objects to a sink function (e.g., `offer_to_god(axes)`).  
    - "Redistribution refuse" = objects discarded from a queue.  
  - **Clean translation**:  
    - Deposition patterns resemble data structures (e.g., arrays of fixed sizes) or function signatures (e.g., `deposit(axes[12])`).  
    - Exclusion of food/bone is like type-checking—objects are filtered by a "deposit function."  
  - **Distorted translation**:  
    - "Votive" implies meaning (e.g., axes as symbolic offerings), which RE frames as a function call. But unlike code, the "function" (ritual) might leave no trace beyond the deposit.  
    - "Deliberate destruction" maps to deallocation (e.g., `free(axes)`), but RE expects a deallocator function to be visible in code. Here, only the "freed" objects remain.  
  - **Residue**:  
    - **Deposits as institution**: Your friend's claim—that the deposits *are* the institution—has no RE counterpart. RE always assumes a source (code) that generated the binary (deposits). But if the axe deposits *are* the ritual (e.g., the act of depositing defines the "rule"), there's no separate source. In RE, even if the source is lost, it must have existed; here, the institution might exist only in its material instantiation.  
    - **Symbolic weight**: The axes' value (e.g., as religious symbols) is like data with metadata (e.g., `is_votive=1`), but without symbols, RE infers this from context, not essence.  
  - **Utilitarian vs. symbolic**: Again, not a code/data split. In RE, an axe is data; its use determines if it's "symbolic" (passed to a ritual function) or "utilitarian" (passed to a `chop()` function). The distinction is in the call graph, not the object. Your framework doesn't force a fake split—it shows the split is contextual.  
  - **Deposits as institution counterpart**: None. In RE, the binary is never the program; it's the output. The program (source) is always inferred. If the deposits *are* the institution, it's like saying a core dump *is* the running program—which contradicts RE's core axiom.  
  - **Confidence**: 7/10. RE handles object patterns well, but "deposits as institution" breaks the model.

  #### Case 3: No Burials
  - **RE-like conclusion**: The absence is a missing function call or optimized-out code. Possible RE interpretations:  
    - "Disposal leaving no trace" = a function with no side effects (e.g., `dispose_body()` that doesn't write to disk).  
    - "Taken elsewhere" = execution context shifted (e.g., `bury()` called in another module/valley).  
    - "Invisible treatment" = the function uses volatile memory (ephemeral materials).  
    - "Sampling error" = the code is present but unobserved (e.g., in an unexcavated memory segment).  
  - **Clean translation**:  
    - Absence as dead code or optimized-out operations mirrors compiler erasure (e.g., unused functions removed).  
    - "Invisible treatment" is like a function that runs in RAM—no persistent artifacts.  
  - **Distorted translation**:  
    - "Dead taken elsewhere" maps to inter-process communication (e.g., another valley's "binary" handles it). But unlike code, this assumes cultural boundaries are clean modules.  
    - "No durable objects" is like a function that only uses stack memory, but RE can still see the function's code; archaeology sees nothing.  
  - **Residue**:  
    - **Cultural negation**: If the society intentionally avoided burials for ideological reasons (e.g., rejecting death rituals), RE frames this as an `if (!bury)` branch. But absence in RE implies optimization or error, not intent—archaeology must infer intent from nothing.  
    - **Belief without trace**: If mortuary practices were non-material (e.g., oral prayers), it's like a function that leaves no logs. RE assumes all code has *some* trace (e.g., execution time); archaeology has no equivalent.  
  - **Deposits as institution**: Not directly applicable here, but the absence could imply the "institution" is non-material (e.g., beliefs without physical expression). RE has no analogue for a "program" that compiles to no binary.  
  - **Confidence**: 9/10. RE handles absence robustly, but inferring negative intent is strained.

  ---

  ### Verdict on Residue
  The residue reveals a mix of **vocabulary defects** and **substantive claims** that RE cannot represent. It splits by case:
  - **Case 1 (doorway bearing)**: Residue is a **defect in your vocabulary**. RE forces an assumption of intent (a "routine") for the constant bearing, but it might emerge without any code-like rules (e.g., via uncoordinated mimicry). This is a limitation; RE cannot model "meaningless" convergence well.  
  - **Case 2 (axe deposits)**: Residue is **evidence of a substantive claim**. Your friend's "deposits as institution" idea has no RE counterpart. RE always separates source (institution) from binary (deposits); if the deposits *are* the institution, it challenges RE's core axiom. This is a genuine gap.  
  - **Case 3 (no burials)**: Residue is mostly a **defect in your vocabulary**. RE handles absence technically, but it struggles with cultural negation (intent without action), as it assumes all behavior compiles to some trace.

  **Overall, the residue is primarily a vocabulary defect**, but Case 2 exposes a substantive claim RE cannot capture. Your framework excels at underdetermination (non-unique sources) and static analysis but fails at:
  - Emergence without rules (e.g., bearing as mimicry-byproduct).  
  - Material practices as institutions (no source/binary split).  
  - Symbolic meaning without symbols (RE infers function, not essence).  

  Your friend's claim that "deposits are the institution" is clear and substantive—it highlights that some institutions exist only through performance (like a ritual defined by the act of depositing). RE cannot express this because it always assumes a prior source. This isn't underdetermination; it's ontological difference.

  **Least confident claim**: That RE *cannot* represent "deposits as institution" (Case 2). I rated this 7/10 confidence. What would change my mind: If we model the deposits as self-modifying code (e.g., a binary that writes its own rules), it could blur the source/binary line. For example, in RE, a bytecode interpreter might treat data as code—similarly, deposits could "be" the institution if they encode rules for future actions. If ethnoarchaeology shows such systems (e.g., deposits that scaffold rituals), this might map. But currently, I see no clean analogue.  

  **Final confidence in overall answer**: 8/10. The mapping is robust for technical inference but brittle for meaning and emergence. Case 2 is the keystone.
