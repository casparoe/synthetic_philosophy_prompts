  - *Utilitarian vs. symbolic*: In code, we might see a function that uses the axes for a practical purpose (e.g., a transaction) versus one that uses them for display (e.g., a logging function). But the objects themselves are just data. So the distinction is in the code that uses them, not in the objects. Similarly, in archaeology, the same object might be used in both ways.

  - *Confidence in this section*: 7/10.

  **Case 3: No burials**

