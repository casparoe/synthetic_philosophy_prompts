  Now, the friend's claim that "the deposits are the institution" (rather than a trace of it) and whether it has a counterpart:

  - In reverse engineering, we always assume there is source code (the institution) that produced the binary (the deposits). Even if we cannot recover the source, we posit it. But in archaeology, the friend is saying that sometimes the material practice (the deposits) is the institution. That is, there might not be a separate set of rules or beliefs; the act of depositing the axes might be the entire institution. In code terms, this would be like saying that the binary is the program. But we know that the binary is the compiled form. However, in very simple systems, the binary might be the entire specification (like in a hard-coded state machine). But in general, reverse engineering assumes a higher-level source.

