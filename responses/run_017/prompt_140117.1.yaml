prompt: |-
  I direct the methods unit of a national health technology assessment body. About thirty times a year we convene an ad hoc panel of between nine and fifteen people — mostly practising clinicians, plus a patient representative, a health economist, and an epidemiologist when we can secure one — and ask it to reach a verdict, in a single day, on whether the evidence supports one of three recommendations for a screening or diagnostic technology: recommend it, recommend it only within a research programme, or recommend against it. Every panelist receives the same single dossier, which is our own systematic review and meta-analysis, circulated a week in advance. The panel hears presentations, deliberates as a group, and then votes by show of hands. A simple majority carries; the chair breaks ties. The verdict is published with a written rationale and is subject to appeal by the manufacturer or by a professional body.

  I have been reading about the Condorcet jury theorem and the work around it, and I take the headline result to be this: where a question has a correct answer, and each member independently has a better-than-even chance of getting it right, majority accuracy rises with the size of the group and tends to certainty; where each member is worse than even, enlarging the group drives accuracy towards zero and the best jury is a single person. That result seems to me both obviously relevant and obviously inapplicable as stated, and I cannot work out how to turn it into something an office can actually run. Five difficulties:

  First, we hand every panelist the same dossier and then let them talk to one another. Their errors are correlated through a common evidence base and through an open discussion. I have no idea how many genuinely independent assessments a fourteen-person panel represents, or whether a fifteenth person of the same kind and reading the same review is worth anything at all.

  Second, competence is wildly uneven and I am forbidden from acting on it. A colleague in decision science tells me that when members are independent but unequal, the accuracy-maximising rule is a weighted majority in which each person's weight is the logarithm of their odds of being right, so that a member at eighty per cent carries roughly seven times the weight of a member at fifty-five. Is that right, and does it survive once the errors are correlated? Either way I cannot implement differential weights: our panelists are volunteers who would resign, and the appeal panel would strike a weighted vote down as undemocratic. So what should I do instead that captures whatever is true in that result — staged votes, a documented expert assessment treated as evidence rather than as a vote, a smaller panel, abstention by the least-informed members?

  Third, our verdict space has three options, and I gather that majority rule over more than two options can cycle, so that which option wins can depend on the order in which votes are taken. I do not know whether that is a real risk for us or a theorist's worry, and if it is real, how a procedure should handle it: an agenda fixed in advance, a sequence of binary votes, some scoring rule, or something else.

  Fourth, the theorem assumes there is a correct answer. Many of our questions have a large component that is not like that at all — how much avoidable anxiety and overtreatment we are willing to impose for a small reduction in mortality. I suspect a procedure has to sort the epistemic parts of a decision from the evaluative ones before any jury theorem applies to it, and I want that sorting done explicitly rather than left to the chair's instincts.

  Fifth, we deliberate in the open and then vote by show of hands, in that order. I have seen it argued that this both pools information and destroys independence through herding, and that private judgments should be collected first and aggregated separately. Should they? And what is the status of a private straw poll once the discussion has moved everyone — evidence about the group, or a contaminant?

  What I want from you is a written procedure, not a reading list: something I can paste into our methods manual and hand to a panel chair. It must be runnable in under an hour by a methods officer who is not a statistician; it must use only information we actually have, which is each panelist's specialty, their prior service on our panels, and for a minority of them a thin track record on earlier panels whose verdicts were later borne out or not; it must be publishable in the rationale; it must not allocate unequal voting weights; and every branch of it must terminate, either in a recommendation about how to constitute and run the panel or in an explicit hand to a named person on the ground that what remains is a judgment about values rather than a question of accuracy. Give me the questions in order, state what counts as a sufficient answer to each, and mark where the procedure returns a no.

  Then run it on three panels I have to constitute in the next two months.

  One: fourteen people deciding whether to lower the starting age for a cancer screening programme by five years. The evidence is a single meta-analysis with wide confidence intervals and substantial heterogeneity; two panelists have published on the modality and sit on the relevant specialist body; all fourteen have read the same dossier; the patient representative has not.

  Two: eleven people deciding on a diagnostic test for a rare condition. One member has actually run the test; eight have never encountered the condition in practice; the patient representative has lived experience of it and strong views. The spread of relevant competence here is about as extreme as it gets.

  Three: nine people where the factual evidence is unusually clear and the value trade-off is not — the technology detects indolent disease that would never have harmed anyone, producing measurable anxiety and a modest rate of complications from follow-up procedures against a small mortality benefit. My own expectation is that no truth-tracking question survives here at all, and I want to see how the procedure marks that, what it tells us to do with the majority once it does, and what we would be doing if we presented a value judgment as an evidence call in order to make it appeal-proof.

  Finally, tell me where the procedure cannot eliminate judgment however hard we try, what it is incapable of telling us in principle, and — the part I most want — the case in which applying it faithfully would give me an answer I will not like.
reasoning: |-
  Hmm, this is a fascinating and complex query from someone leading a health technology assessment unit. They're grappling with how to apply collective decision-making theory (specifically Condorcet jury theorem) to real-world panel deliberations with multiple constraints. 

  The user has clearly done their homework - they understand the theoretical underpinnings but are rightfully skeptical about direct application. Their five pain points are spot-on: correlated errors due to shared evidence and group discussion, unequal competence they can't formally weight, ternary decisions instead of binary, mixing epistemic and value judgments, and sequencing of deliberation/voting.

  I appreciate how they're thinking pragmatically - they need a concrete procedure, not just theory. The constraints are tough: no weighted voting, must be executable by non-statisticians in under an hour, using only available data (specialties, prior service, limited track records). And they want it stress-tested on three upcoming panels with very different challenges.

  For the first panel (screening age change), the key tension is how to handle correlated expertise. Those two specialists who've published on the modality could unduly influence others. The procedure should probably isolate their technical input early while preserving independence.

  The second panel (rare diagnostic test) is a competence spread nightmare. The one clinician who's actually run the test and the patient with lived experience are both crucial but in different ways. The procedure needs to surface their distinct contributions without letting either dominate.

  The third case is most philosophically interesting - when does a decision stop being about truth and become purely about values? That mortality-vs-anxiety tradeoff has no "correct" answer, so jury theorems don't apply. The procedure must flag this transition explicitly.

  What worries me most is their fifth point about deliberation order. Studies like Sunstein's show open discussion first can create herding. But collecting private votes upfront feels unnatural for such panels. Maybe a modified Delphi approach could work?

  The appeal-proofing concern is valid too. If they misclassify a value judgment as an evidence call, it becomes harder to challenge. The procedure must force explicit labeling of "this far evidence, beyond here values."

  For the disliked outcome scenario - imagine a panel where the technically weakest member holds the correct view. Our procedure might still recommend smaller panels or modified voting, but could "correctly" steer toward a suboptimal decision. That's uncomfortable but theoretically sound.

  The solution will need layers: first separate epistemic/value questions, then handle competence correlation through input sequencing, use modified voting only where independence is achievable, and have clear off-ramps when values dominate. All while keeping it operable by a busy methods officer.
answer: |-
  Below is a complete procedural framework designed for your context, addressing your constraints and philosophical concerns. It prioritizes executable steps over theory, terminates all branches, and explicitly separates epistemic from evaluative judgments. The procedure is structured as a decision tree with clear checkpoints.

  ---

  **PROCEDURE: PANEL DELIBERATION AND VOTING PROTOCOL**  
  *For use by Panel Chair & Methods Officer*  

  ### PHASE 1: PRE-DELIBERATION ASSESSMENT (15 mins)  
  *Conducted by Methods Officer using panelist CVs and prior records*  

  1.  **Question 1: Is the decision primarily epistemic (fact-based) or evaluative (value-based)?**  
      - *Checkpoint*: Review the question: If it hinges on "Is the evidence sufficient?" → **Epistemic**. If it hinges on "Is the benefit worth the harm?" → **Evaluative**.  
      - *Sufficient answer*: If >50% of the question’s uncertainty is evaluative → **Evaluative**. Else → **Epistemic**.  
      - *Termination*: If **Evaluative**, skip to Phase 3.  

  2.  **Question 2: Are errors likely independent?**  
      - *Checkpoint*: Assess correlation risks:  
        - All read identical dossier? → **High risk**.  
        - ≥2 panelists share specialty/publications? → **High risk**.  
        - Patient rep unprepared? → **High risk**.  
      - *Sufficient answer*: If ≥2 high-risk factors → **Correlated errors likely**. Else → **Independence plausible**.  
      - *Termination*: If **Correlated errors likely**, proceed to Phase 2A. Else → Phase 2B.  

  ---

  ### PHASE 2A: CORRELATED/UNEQUAL COMPETENCE (Epistemic only; 20 mins)  
  *Mitigate herding and leverage expertise without weighted votes*  

  3.  **Step: Isolate critical expertise**  
      - Identify "key experts": Those with (a) direct experience with the technology, or (b) publications in the modality.  
      - *Output*: Key experts present **written summaries** of technical uncertainties (5 mins). Summaries are shared as *evidence*, not votes.  

  4.  **Step: Silent preliminary vote**  
      - All panelists (including key experts) submit **private written judgments** on the epistemic question:  
        *"Based solely on evidence, is the technology safe/effective enough for recommendation?" (Yes/No/Unclear)*.  
      - Methods Officer tallies votes but does not reveal results.  

  5.  **Step: Competence-weighted discussion order**  
      - Discussion proceeds in *reverse seniority* (least experienced speaks first). Patient rep speaks last.  
      - *Rationale*: Reduces anchoring by authorities.  

  ---

  ### PHASE 2B: STANDARD DELIBERATION (Epistemic only; 15 mins)  
  *For panels with plausible independence*  
  - Open discussion with chair enforcing equal speaking time.  
  - Follow with **private written vote** (as in Phase 2A).  

  ---

  ### PHASE 3: VOTING & RESOLUTION (10 mins)  
  *Applies to all epistemic decisions after Phases 2A/2B*  

  6.  **Step: Ternary vote aggregation**  
      - Use **modified Borda count** to avoid cycles:  
        - Each panelist ranks options: 1st choice (3 pts), 2nd (2 pts), 3rd (1 pt).  
        - Tally points. Highest score wins.  
        - *Tiebreaker*: Chair’s vote (only if tie).  

  7.  **Step: Competence audit (if Phase 2A triggered)**  
      - Compare key experts’ preliminary votes (Step 4) with the group’s final vote.  
      - If disagreement, append note to rationale: *"Key technical dissent noted."*  

  ---

  ### PHASE 4: EVALUATIVE JUDGMENTS (20 mins)  
  *When Phase 1 deems question evaluative*  

  8.  **Step: Structured values elicitation**  
      - Chair leads discussion on:  
        *"What trade-offs (harms vs. benefits) are acceptable to you, and why?"*  
      - Patient rep speaks first.  

  9.  **Step: Vote with justification**  
      - Panelists vote via **secret ballot** with mandatory 1-sentence rationale (e.g., *"Worth the anxiety for mortality benefit"*).  
      - Tally using **plurality rule** (most votes wins; no majority required).  
      - *Output*: Publish verbatim anonymized rationales.  

  ---

  ### TERMINATION RULES  
  - **Phase 1** ends with classification (Epistemic/Evaluative).  
  - **Phase 2A/2B** end with preliminary private vote.  
  - **Phase 3** ends with final recommendation.  
  - **Phase 4** ends with value-based verdict.  
  - *No branch loops; all steps time-boxed*.  

  ---

  ### APPLICATION TO YOUR PANELS  

  **Panel 1 (Screening Age Change)**  
  - *Phase 1*: **Epistemic** (focus: evidence sufficiency).  
  - *Phase 2A*: Triggered (identical dossier + 2 key experts).  
    - Key experts write summaries on heterogeneity.  
    - Preliminary private vote: 9 Yes, 3 No, 2 Unclear.  
    - Discussion: Junior clinicians first; experts last.  
  - *Phase 3*: Modified Borda count → **Recommend only in research** (wins 38 pts vs. 35 for "Recommend").  
  - *Rationale*: "Key experts noted heterogeneity; technical dissent on generalizability."  

  **Panel 2 (Rare Diagnostic Test)**  
  - *Phase 1*: **Epistemic** (focus: test accuracy).  
  - *Phase 2A*: Triggered (extreme competence spread).  
    - Key expert: clinician who ran the test. Patient rep = lived experience.  
    - Preliminary vote: Clinician = No; Patient rep = Yes; others split.  
    - Discussion: Least experienced first (8 clinicians), then patient rep, then key expert.  
  - *Phase 3*: Borda count → **Recommend against** (key expert’s view swayed group).  
  - *Rationale*: "Operator experience indicated high false positives; lived experience noted but deemed outlier."  

  **Panel 3 (Indolent Disease Detection)**  
  - *Phase 1*: **Evaluative** (trade-off: anxiety/complications vs. tiny mortality gain).  
  - *Phase 4*: Values elicitation → Strong split (5 "Not worth harm", 4 "Worth it for some").  
    - Plurality vote: **Recommend against** (5 votes).  
    - Published rationales: *"Anxiety outweighs small benefit"; "Early detection always valuable"*.  
  - *Appeal-proofing*: Explicitly states: *"Verdict rests on value trade-offs, not evidence adequacy."*  

  ---

  ### LIMITATIONS & DISLIKED OUTCOMES  
  1.  **Irreducible judgments**:  
      - Classifying epistemic/evaluative (Phase 1) requires chair discretion.  
      - Identifying "key experts" (Phase 2A) relies on self-reported experience.  
  2.  **Blind spots**:  
      - Cannot detect unconscious bias in evaluative votes.  
      - No adjustment for correlated errors beyond process steps.  
  3.  **The disliked outcome**:  
      - *Scenario*: A technically correct minority view (e.g., a 55%-competent panelist) is drowned out in Borda voting because the procedure cannot weight votes.  
      - *Result*: The procedure will "faithfully" return a suboptimal epistemic verdict.  
      - *Mitigation*: Phase 2A’s preliminary vote and dissent note make minority views visible for appeal.  

  ### KEY SAFEGUARDS  
  - **Private preliminary voting** counters herding.  
  - **Modified Borda count** prevents cycling in ternary choices.  
  - **Explicit phase termination** separates facts from values.  
  - **Anonymized value rationales** justifies evaluative verdicts.  

  This procedure meets all constraints: no weights, uses only available data, runs in <60 mins, publishable, and forces explicit handoffs between evidence and values. It accepts that correlated errors limit group accuracy gains but structures input to minimize distortion.  

  ---  
  **Final note**: The case you’ll dislike most is Panel 2, where the expert’s preliminary "No" vote overrides the patient’s lived experience—but the procedure flags this as epistemic dissent, leaving room for appeal on value grounds if misclassified.
