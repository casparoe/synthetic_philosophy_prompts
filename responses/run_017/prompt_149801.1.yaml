prompt: |-
  I host a small podcast on decision theory and my guest next week is someone who defends superrationality — the Hofstadter line that in a one-shot Prisoner's Dilemma between two copies of yourself you should reason as if your move and theirs are the same event, so you pick the option that's best if everyone picks it. I don't want questions where she just re-explains the view and reruns the Platonia story; give me 6-8 questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one that presses on whether this is anything more than evidential decision theory once you cash out what 'same algorithm' has to mean, one on near-copies (agents 99% algorithmically similar, not identical — does the reasoning degrade smoothly or cliff-edge, and why should similarity do that work?), and one built around a case I keep chewing on: the staggered run. Two instantiations of the same algorithm, but copy A is launched, its output sealed, and the seal is physically irreversible an hour before copy B is launched, and B knows all of this. If superrational cooperation survives that, what exactly is it tracking — and if it doesn't, how much of the view was just bookkeeping about causal loops? Add one question on the obvious jab that this is the categorical imperative with payoff matrices bolted on, and end with something that makes 'no serious view survives its own counterexamples' style deflection hard, asking what result or observation would actually make her give it up.
reasoning: |-
  Okay, the user hosts a small podcast on decision theory and has a guest defending superrationality. The guest follows Hofstadter's view that in a one-shot Prisoner's Dilemma between identical copies, you should treat your move and theirs as the same event and choose what's best if both pick it. 

  The user wants 6-8 questions with follow-ups, avoiding rehashing the basics. Specifically, they want questions probing whether superrationality is just evidential decision theory (EDT), how it handles near-copies (99% similarity), and a "staggered run" case where one copy decides before the other. They also want a question comparing it to Kant's categorical imperative and a final question about what evidence would make the guest abandon the view. 

  Hmm, the user seems intellectually rigorous—they're clearly familiar with the literature and want to push the guest beyond surface-level defenses. The staggered run case suggests they've been wrestling with temporal asymmetry in identical algorithms. Their request for a "no serious view survives" deflection-blocker implies past guests have dodged hard objections. 

  For the EDT question, I'll need to highlight how superrationality's "same algorithm" premise forces correlation in a way EDT alone wouldn't mandate. The follow-up should press why this isn't just EDT with extra steps. 

  The near-copy question must avoid letting her retreat to "only exact copies matter." I'll force a gradient vs binary answer—if similarity degrees matter, what's the threshold? Why 99% vs 90%? 

  The staggered run is tricky. If cooperation fails here, it exposes superrationality's reliance on simultaneous choice. The follow-up should corner her: if cooperation requires causal loops, isn't that metaphysically dicey? 

  Kant comparison needs nuance—superrationality feels consequentalist (maximize joint payoff) but structurally deontological (act as if universalized). Follow-up should probe this tension. 

