  User's tone suggests slight skepticism about superrationality's coherence. My questions should arm them to test that rigorously without letting the guest hide behind thought experiments. 

  Noting they want "at least one" of each specified type—I'll structure around those cores plus two wildcards (timeless decision/game theory relevance) to cover more ground. 

  Staggered run intro phrasing matters: "physically irreversible seal" emphasizes no retrocausality loopholes. 

  For the Kant jab, "bolted on" is spicy—I'll keep that edge but frame it as academic curiosity. 

  Ending strong: if she claims no counterexample could falsify it, that itself reveals dogmatism. The follow-up must preempt that.
answer: |-
  Here are 8 targeted questions with follow-ups designed to challenge the superrationality view beyond basic exposition, incorporating your specific requests and aiming for substantive engagement:

  1.  **The EDT Challenge:** "Superrationality often gets described as Evidential Decision Theory (EDT) applied specifically to identical algorithms. But EDT, strictly applied to the PD, might still allow defection if the other player's decision is *evidence* about yours, but not necessarily the *same event*. Can you precisely articulate how the 'same algorithm/same event' premise adds something *essential* that generic EDT lacks?"
      *   *Likely Answer/Follow-up:* (If she emphasizes determinism or logical correlation) "But doesn't EDT *already* account for the evidential link between identical deterministic algorithms? If the superrational prescription (cooperate) collapses into EDT's prescription *only* for identical algorithms in this specific setup, isn't superrationality just a special case of EDT with a very strong correlation assumption baked in, rather than a fundamentally distinct form of rationality?"

  2.  **The Near-Copy Problem (Gradient vs. Cliff):** "Your view centers on *perfect* algorithmic identity. But consider two agents, A and B, who are 99% algorithmically identical – perhaps B is a slightly imperfect copy of A, or they share a vast majority of code but have a minor divergent module. Does superrational cooperation apply here? If so, how strongly? If not, why does a 1% difference suddenly invalidate the 'same event' reasoning that worked for 100%?"
      *   *Likely Answer/Follow-up:* (If she suggests cooperation still applies or degrades smoothly) "What's the mechanism? If it's about *predictability* of the other's action due to similarity, doesn't that just collapse into standard evidential reasoning based on probabilistic correlation, not a unique 'same event' identity? And if it *doesn't* apply cleanly to near-copies, doesn't that make superrationality incredibly fragile and empirically irrelevant, as *perfect* copies are vanishingly rare outside thought experiments?"

  3.  **The Staggered Run (Core Challenge):** "Let's consider the 'Staggered Run' PD. Copy A is run at T1. Its output is sealed *irreversibly* at T2 (e.g., written to a locked vault). Copy B, knowing *everything* about A's situation, the seal, and that it *is* a copy of A, is run at T3. They face the same PD matrix. From B's perspective at T3, A's decision is *already fixed and causally inaccessible*. Should B cooperate? If yes, *why?* What is it cooperating *with*, given A's choice is already sealed?"
      *   *Likely Answer/Follow-up:* (If she insists B should still cooperate) "If B cooperates, it's clearly *not* because it believes its action *is* A's action – A's action is already fixed and distinct. Is the reasoning then purely counterfactual: 'I should act *as if* my action determines A's, even though I know it doesn't'? Doesn't this expose superrationality as relying on a *pretense* of identity/simultaneity when the causal structure explicitly breaks it?"
      *   *(Alternative Follow-up if she says B defects):* "If B defects because A's decision is fixed, doesn't this reveal that the core 'same event' intuition *only* works when the decisions are *truly* simultaneous and logically entangled? Doesn't this reduce superrationality to a clever trick for handling causal loops in timeless scenarios, rather than a general theory of rational choice between similar agents?"

  4.  **Causal Impotence vs. Evidential Leverage:** "In the standard simultaneous identical copy scenario, cooperating doesn't *cause* the other copy to cooperate in a physical sense; the algorithms are deterministic and outputs are fixed 'at once'. Isn't the benefit of cooperation here *purely* evidential – you get good news (they cooperated) conditional on your own choice? How is this different from simply *caring* about evidence about your twin's action because it correlates with a good outcome for you?"
      *   *Likely Answer/Follow-up:* (If she distinguishes it based on identity/logical necessity) "But isn't 'caring about evidence correlating with good outcomes' the *definition* of evidential decision theory? If the unique force of superrationality comes *only* from the logical impossibility of different outputs from identical inputs/algorithms, doesn't that make it a niche solution to a very specific metaphysical puzzle, not a revolution in rational decision-making?"

  5.  **The Kantian Bolted-On Jab:** "Detractors often say superrationality is just Kant's Categorical Imperative ('Act only according to that maxim whereby you can, at the same time, will that it should become a universal law') applied to a very specific strategic scenario with payoff matrices. How do you distinguish the core *rational force* of superrationality from simply being a consequentialist *implementation* of a deontological rule?"
      *   *Likely Answer/Follow-up:* (If she emphasizes the strategic/payoff element) "But Kant's rule can *also* be justified consequentially by asking 'what if everyone did that?'. Isn't the superrational move *defined* by asking 'what's best if we both do the same thing?'. Where is the substantive difference in the *source* of the obligation? Is superrationality just CI with the 'universal law' scope restricted to your identical copies?"

  6.  **Beyond PD: Robustness to Game Variation:** "Superrationality famously 'solves' the one-shot PD for identical copies. But what about other games? Take Stag Hunt. Identical copies, superrationally, would presumably coordinate on the Pareto-optimal Stag, as that's best if both do it. But what about Chicken? Both swerving is good, but not the *best possible* for an individual (which is swerving while the other doesn't). What does superrationality prescribe in Chicken for identical copies? Is it still uniquely decisive?"
      *   *Likely Answer/Follow-up:* (Likely prescription: Both Swerve, as it's the best symmetric outcome) "Isn't 'both swerve' also the standard Nash Equilibrium? Does superrationality add anything new here beyond selecting the symmetric NE? If its unique prescription only cleanly applies to symmetric games where the symmetric Pareto optimum exists (like PD cooperation, Stag Hunt stag), doesn't limit its scope and novelty?"

  7.  **The Scope of "Same Algorithm":** "What constitutes 'same algorithm' for superrationality? Is it the abstract code? The physical instantiation? The functional behavior? If two different algorithms *happen* to output identically in all possible scenarios (they are extensionally equivalent), are they 'superrationally identical'? If not, why privilege the *intensional* description?"
      *   *Likely Answer/Follow-up:* (Likely emphasizes intensional identity/implementation) "If superrationality requires intensional algorithmic identity, doesn't this make it hyper-sensitive to implementation details irrelevant to actual decision outcomes? How can it be a theory of *rational choice* if it depends critically on *how* the choice is computed, rather than just the mapping from inputs to outputs?"

  8.  **Falsifiability / The Abandonment Test (Deflection Killer):** "Let's grant that superrationality offers a compelling perspective in specific idealized cases. But for a view to be a serious contender as a *general* theory of rationality, it should be falsifiable. What specific, conceivable *result* – empirical observation, formal proof, or thought experiment outcome – would genuinely convince *you* that superrationality is fundamentally flawed or limited as a core principle of rational decision-making? What's your abandonment condition?"
      *   *Likely Answer/Follow-up:* (Potential deflection: "No single counterexample kills a philosophical view"/"It's about a perspective") "Respectfully, that sounds like making the view immune to counter-argument. If *no* conceivable result – not the Staggered Run, not the failure with near-copies, not its ambiguity in other games, not its potential collapse into EDT – could shake your core commitment to the 'same event' reasoning in the perfect identical copy case, doesn't that suggest it's functioning more as an article of faith than a falsifiable rational theory? Can you name *one* specific, non-question-begging scenario or outcome that *would* make you reconsider the foundational premise?"

  These questions press on the core mechanics (EDT equivalence, causal structure in Staggered Run), robustness (near-copies, other games), philosophical underpinnings (vs. Kant), and meta-commitments (falsifiability) of superrationality, forcing the guest to move beyond simple restatement and confront its potential limitations and foundations. Good luck with the podcast!
