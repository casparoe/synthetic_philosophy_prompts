  We are going to break down the nativist argument (specifically regarding the poverty of the stimulus and the example of auxiliary fronting) using the four knobs you provided: hypothesis class, prior, update rule, and data channel.

  **The Classic Example: Auxiliary Fronting (Subject-Auxiliary Inversion)**
  The standard illustration is that children learn to form yes-no questions by fronting the auxiliary of the main clause, not the first auxiliary in the string. For example:
  - Statement: "The man who is tall is happy."
  - Correct question: "Is the man who is tall happy?" (fronting the main clause auxiliary "is")
  - Incorrect question: *"Is the man who tall is happy?" (fronting the first auxiliary "is" from the relative clause)

  The nativist claim is that children do not receive enough evidence (and in particular, no negative evidence) to rule out the incorrect hypothesis (fronting the first auxiliary) and converge on the correct one. Therefore, the constraints must be innate.

  **Breaking Down the Knobs**

  1. **Hypothesis Class (what the learner can represent)**
     - **What it would mean for the constraint to be innate via this knob**: The hypothesis class does not include grammars that allow fronting an auxiliary from a relative clause (or more generally, from an embedded clause). That is, the incorrect hypothesis is not representable at all.
     - **In the classic argument**: The argument is that without innate constraints, the learner would have to consider both hypotheses (front the main clause auxiliary vs. front the first auxiliary). The fact that children never seem to go through a stage of making the error (or if they do, it's very brief and without explicit correction) suggests that the incorrect hypothesis is not even considered. Thus, the hypothesis class is restricted to only the correct type of grammars (e.g., structure-dependent rules).

  2. **Prior (initial probability distribution over the hypothesis class)**
     - **What it would mean for the constraint to be innate via this knob**: The hypothesis class includes both the correct and incorrect hypotheses, but the prior is heavily concentrated on the correct hypothesis (e.g., structure-dependent rules). The incorrect hypothesis (e.g., a linear rule) has very low prior probability.
     - **In the classic argument**: The argument typically does not distinguish between the hypothesis class and the prior. It often speaks of "innate constraints" without specifying whether they are absolute (hypothesis class) or probabilistic (prior). However, the classic argument is often interpreted as requiring the hypothesis class to be restricted because the absence of negative evidence and the rarity of relevant positive evidence would not allow the learner to overcome even a moderately low prior for the incorrect hypothesis.

  3. **Update Rule (how evidence is integrated)**
     - **What it would mean for the constraint to be innate via this knob**: The update rule itself is structured in a way that it only considers certain types of evidence or updates in a way that inherently favors structure-dependent rules. For example, the learner might be designed to only update based on hierarchical structure and ignore linear order.
     - **In the classic argument**: The update rule is typically assumed to be a standard Bayesian update or some form of efficient hypothesis testing. The classic argument does not usually attribute the constraint to the update rule. Instead, the update rule is taken as a given (e.g., rational updating) and the focus is on the data and the hypothesis space.

  4. **Data Channel (what counts as evidence)**
     - **What it would mean for the constraint to be innate via this knob**: The data channel might be expanded to include more than just the positive utterances the child hears. For example, it might include the child's own productions and the reactions of others (implicit negative evidence) or even the absence of certain structures (indirect negative evidence). However, the classic argument claims that children do not receive *negative evidence* (explicit corrections) and that the positive evidence is insufficient.
     - **In the classic argument**: The data channel is usually taken to be only positive evidence (well-formed sentences) and no negative evidence. The nativist argues that the positive evidence is insufficient because the relevant sentences (like complex questions with relative clauses) are rare and the child never hears the incorrect form being corrected. Therefore, the data channel does not provide the necessary information to choose between the hypotheses.

  **Can the Classic Argument Distinguish the Knobs?**
  The classic argument does not explicitly distinguish between these knobs. It typically lumps the hypothesis class and prior together as "innate constraints" and assumes a standard update rule (like Bayesian updating) and a data channel that only provides positive evidence. The argument is that without innate constraints (in the form of a restricted hypothesis class or a strong prior), the child would not converge to the correct grammar given the data channel.

  However, the argument does have some resources to distinguish:
  - If children never consider the incorrect hypothesis (and hence never produce the error), that points to the hypothesis class being restricted (knob 1).
  - If children do produce the error but quickly abandon it without negative evidence, that might point to a prior that favors the correct hypothesis (knob 2) or an update rule that quickly discounts the incorrect hypothesis (knob 3) or even an expanded data channel (knob 4).

  But in the auxiliary fronting case, the claim is that children do not go through a stage of making the error. This is taken as evidence that the incorrect hypothesis is not in the hypothesis class at all.

  **Residue Report: What Translates and What Doesn't**

  1. **What Translates Cleanly**:
     - The claim that the data channel (positive evidence only) is insufficient to distinguish between the correct and incorrect grammars is a sample complexity argument. This is a standard concept in ML: without enough data (or the right kind of data), the learner cannot disambiguate the hypotheses.
     - The idea that the hypothesis class must be restricted (or the prior concentrated) is an inductive bias. This is also standard: without bias, learning is impossible (no free lunch).

  2. **What Translates with Distortion**:
     - The claim of an innate, domain-specific universal grammar (UG) is often presented as a restricted hypothesis class (only humanly possible grammars). In Bayesian terms, this is equivalent to a restricted hypothesis class (which sets the prior to zero for non-UG grammars). However, it could also be implemented by a prior that assigns very low probability to non-UG grammars. The classic argument does not clearly distinguish these and often talks as if the restriction is absolute (hypothesis class). But in practice, a very strong prior might be indistinguishable from a restricted hypothesis class given finite data and time.
     - The distortion comes from the fact that the classic argument does not consider the possibility of a prior that is concentrated but not absolute. In ML, we know that with enough data, a prior can be overcome. But the nativist counters that the data is insufficient and the time is short, so a strong prior is effectively the same as a restricted hypothesis class.

  3. **What Has No Counterpart**:
     - The debate about whether the constraints are domain-specific (linguistic) or domain-general (e.g., general cognitive principles) does not map directly to the knobs. A restricted hypothesis class could be domain-specific (only linguistic constraints) or domain-general (e.g., a bias for simplicity that applies to any domain). Similarly, a prior could be domain-specific or domain-general. The update rule and data channel are typically domain-general in ML, but they could be domain-specific in a nativist account (e.g., a language-specific learning algorithm).
     - The classic nativist claim is that the constraints are domain-specific (part of a universal grammar). In our knobs, this would require that the hypothesis class or prior is domain-specific. But the argument does not by itself force domain-specificity; it could be that a domain-general bias (like simplicity) happens to favor the correct grammar. However, nativists argue that the domain-specificity is necessary because domain-general biases (like linear order) would lead to the wrong grammar.

  **The Innate/Learned Distinction**
  Once the four knobs are fixed, the distinction between innate and learned becomes a matter of labeling. The innate component is exactly the inductive bias (which comes from the hypothesis class, the prior, the update rule, and the data channel). The learned component is the posterior distribution (or the selected hypothesis) after seeing the data.

  However, note that the update rule and data channel are also part of the learning system. If they are fixed and not learned, then they are innate. But the classic nativist argument typically focuses on the hypothesis class and prior as the locus of innateness.

  **The Deflationary Move and What It Leaves Standing**
  The deflationary move (that every learner has inductive bias) dissolves the idea that nativism is a special claim. However, it leaves standing two substantive claims:

  1. **The Specificity of the Inductive Bias**: The nativist claims that the inductive bias must be domain-specific (linguistic) and not domain-general (e.g., simplicity, pattern recognition). This is an empirical claim that can be tested by seeing whether domain-general learning algorithms (with appropriate data) can learn the correct grammar without domain-specific constraints.

  2. **The Severity of the Poverty of Stimulus**: The nativist claims that the data is so impoverished that only a very strong bias (either a restricted hypothesis class or a very concentrated prior) can account for learning. This is a quantitative claim about sample complexity. It can be challenged by showing that the relevant data is more abundant than thought, or that the learner can use indirect evidence (e.g., distributional statistics, semantic cues), or that the update rule can exploit these effectively.

  **What Indicts What?**
  - **Vocabulary-defect**: Our four-knob decomposition might be too coarse to capture the domain-specificity claim. We can represent domain-specificity by having the knobs set to language-specific values, but we don't have a knob for "domain". Also, the update rule in ML is usually domain-general, but nativists might argue for a domain-specific update rule (which is not common in ML).
  - **Claim-defect**: The classic nativist claim might overstate the poverty of the stimulus. Recent studies suggest children might get more data (or use more sophisticated data channels) than previously thought. Also, the claim that children never make the error in auxiliary fronting has been challenged (though the evidence is mixed).
  - **Genuine-residue**: The quantitative sample complexity argument: exactly how much data is required, and how strong must the prior be? This is a genuine scientific question that requires modeling and empirical research.

  **Conclusion**
  The distinction between innate and learned collapses into the specification of the learning system (the four knobs). However, the nativist makes two non-trivial claims: (1) the inductive bias must be domain-specific, and (2) the data is so impoverished that without a strong domain-specific bias, learning would be impossible. These claims are empirical and can be tested.

  The residue is the domain-specificity and the quantitative sample complexity. These are not defects in the vocabulary but substantive claims that must be evaluated.

  \answer{genuine-residue}
answer: |-
  ### Restating the Nativist Argument in Bayesian/ML Terms
  You're familiar with the core nativist claim: children acquire grammatical rules (e.g., "front the auxiliary of the main clause, not the first auxiliary in the string") despite limited and noisy input, absence of negative evidence (explicit corrections), and underdetermination by the data. Using your four-knob framework—**hypothesis class**, **prior**, **update rule**, and **data channel**—I'll decompose the argument for the auxiliary-fronting example. The nativist asserts that convergence on the correct grammar requires innate constraints, as the data alone is insufficient ("poverty of the stimulus"). Below, I clarify what "innate" means for each knob and whether the classic argument distinguishes them.

  #### Knob Breakdown: What "Innate" Means for Each
  1. **Hypothesis Class (ℋ)**  
     - **What it is**: The set of grammars the learner can represent (e.g., all context-free grammars, or a subset with structure-dependent rules).  
     - **Innate claim**: The constraint is innate if ℋ *excludes* grammars that violate the target rule (e.g., no grammar allowing fronting the first auxiliary is representable). For auxiliary fronting, ℋ only contains grammars where inversion applies to the matrix clause, not embedded clauses.  
     - **Classic argument's view**: The argument heavily relies on this knob. If children never consider the incorrect hypothesis (e.g., no attested stage of producing "*Is the man who tall is happy?"), it suggests ℋ is innately restricted to structure-dependent rules. The argument treats this as the strongest form of nativism.  

  2. **Prior (π)**  
     - **What it is**: The initial probability distribution over ℋ (e.g., higher probability for simpler grammars).  
     - **Innate claim**: The constraint is innate if π *heavily disfavors* incorrect grammars (e.g., near-zero probability for linear-order-based auxiliary fronting). For auxiliary fronting, π assigns negligible mass to grammars fronting auxiliaries in embedded clauses.  
     - **Classic argument's view**: The argument often conflates this with ℋ. However, it implicitly demands an extremely concentrated prior (e.g., π(correct) ≈ 1) because negative evidence is absent. If π were uniform, the data couldn't overcome the underdetermination. It lacks tools to distinguish ℋ-restriction from π-concentration empirically.  

  3. **Update Rule (U)**  
     - **What it is**: How the learner updates beliefs given data (e.g., Bayesian updating, gradient descent).  
     - **Innate claim**: The constraint is innate if U is *domain-specialized* (e.g., it only updates based on hierarchical structure, ignoring linear order). For auxiliary fronting, U might ignore evidence supporting linear rules.  
     - **Classic argument's view**: This knob is underexplored. Nativists assume a "rational" update (e.g., Bayesian) but don't attribute constraints to U. The argument has no resources to separate U from ℋ/π, as it focuses on representations (ℋ) and data scarcity.  

  4. **Data Channel (D)**  
     - **What it is**: What constitutes evidence (e.g., only well-formed parental speech, or including corrections, reactions, or distributional statistics).  
     - **Innate claim**: The constraint is innate if D is *too impoverished* to supply the necessary evidence (e.g., no negative feedback). For auxiliary fronting, D lacks corrective input, so innate biases must compensate.  
     - **Classic argument's view**: Central to the thesis. D is defined as positive evidence only (well-formed utterances), with no negative evidence (e.g., parents don't correct syntax errors). This forces reliance on other knobs for convergence. The argument distinguishes D clearly but doesn't test alternatives (e.g., implicit negative evidence).  

  #### Can the Classic Argument Distinguish the Knobs?  
  - **No**, for three reasons:  
    1. **ℋ vs. π conflation**: The argument treats "innate constraints" as either ℋ-restriction or π-concentration. Absence of errors is taken as evidence for ℋ-exclusion, but it could equally result from π favoring the correct grammar. Without error data or learning trajectories, it can't separate them.  
    2. **U is assumed fixed**: Update rules are taken as "universally rational" (e.g., Bayes-optimal), so they aren't seen as a source of innateness.  
    3. **D is underspecified**: While D's poverty is asserted, nativists don't consider richer D (e.g., prosodic cues, distributional regularities) that might reduce the burden on ℋ/π.  

  #### Residue Report: What Translates, What Distorts, What's Left  
  **What translates cleanly**:  
  - **Data poverty and underdetermination** → Sample complexity. If the data distribution (D) has low coverage of rare structures (e.g., embedded clauses), and no negative evidence, sample complexity bounds show learning is impossible without strong inductive bias (ℋ or π).  
  - **No negative evidence** → Training-deployment distribution mismatch. D lacks error-correction pairs, making it impossible to learn from mistakes (akin to learning without labels).  

  **What translates with distortion**:  
  - **Innate domain-specific Universal Grammar (UG)** → Claims of domain-specificity *distort* when forced into ℋ/π.  
    - **ℋ-restriction view**: UG is a domain-specific ℋ (e.g., only grammars with structure-dependent rules). This translates directly: ℋ is a "language module."  
    - **π-concentration view**: UG is a domain-specific prior (e.g., high π for grammars with linguistic universals).  
    - **Collapse?** The classic argument *insists* on ℋ-restriction (absoluteness), but Bayesian/ML shows π-concentration can be functionally equivalent given limited data/compute. This isn't a concession—it's a translation. However, nativists see UG as *encapsulated* (domain-specific), while π could be domain-general (e.g., simplicity priors). Thus, **domain-specificity** is distorted: it maps neatly to ℋ but ambiguously to π.  

  **What has no counterpart**:  
  - **Update Rule (U) as innate**: Nativists ignore U, while in ML, U (e.g., optimization algorithms) can encode domain-specificity (e.g., meta-learning for language).  
  - **The innate/learned distinction itself**: Once knobs are fixed, "innate" is just "not learned from D." **No substantive residue remains**—innate constraints *are* the knobs. For example:  
    - If ℋ excludes linear rules, that's "innate."  
    - If π favors structure-dependence, that's "innate bias."  
    - The distinction collapses into *how the knobs are set* before data.  

  #### Deflationary Move: What It Dissolves and What It Leaves  
  - **Dissolves**: The triviality argument ("all learning requires bias") **fully dissolves** the weak nativist claim that "some bias exists."  
  - **Leaves standing**: Two non-trivial claims:  
    1. **Domain-specificity**: The bias must be linguistic (e.g., ℋ encodes structure-dependence, not general simplicity). ML can test this: can domain-general learners (e.g., Transformers) acquire auxiliary fronting from D-like data? If not, domain-specific ℋ/π is implicated.  
    2. **Severity of poverty**: The data is so poor that even with domain-general ℋ/π/U, sample complexity is prohibitive. This is empirical—e.g., if children hear only 1 embedded-clause question per year, convergence requires extreme π-concentration or ℋ-restriction.  

  #### Indictments: Vocabulary vs. Claim vs. Residue  
  - **ℋ/π conflation**: Indicts the **claim**. Nativists don't provide evidence to distinguish ℋ-exclusion from π-concentration (e.g., via error patterns).  
  - **Ignoring U and richer D**: Indicts the **claim**. Nativists dismiss domain-general U (e.g., statistical learning) and richer D (e.g., social feedback), making the argument unfalsifiable.  
  - **Domain-specificity**: **Genuine residue**. Whether bias must be linguistic (not general cognition) is testable in your framework.  
  - **Collapse of innate/learned**: Indicts the **vocabulary**. The distinction is purely descriptive—once knobs are set, "innate" is just a label.  

  **Final Verdict**: The debate reduces to empirical tests of domain-specificity and sample complexity. Your framework exposes vagueness in the claim (especially ℋ vs. π) but leaves a core testable hypothesis: that language acquisition requires domain-specific inductive bias.  

  \answer{genuine-residue}
