answer: |-
  ## Research Proposal: The Unstable Foundations of Lexical-Threshold Negative Utilitarianism

  **1. Core Question and Significance**

  This project investigates whether a specific moral principle—**lexical-threshold negative utilitarianism (LTNU)**—can be coherently defended. LTNU holds that there exists a specific, high level of suffering (the "threshold") such that *any* suffering at or above this level is infinitely more morally urgent than *any* amount of lesser suffering avoided or pleasure gained below it. Crucially, "infinitely more urgent" means that no conceivable accumulation of minor benefits (like preventing mild discomforts or creating small pleasures) could ever morally justify allowing or failing to prevent even a single instance of suffering above this threshold.

  **Why should a non-philosopher care?** This principle isn't just a theoretical puzzle; it underpins powerful moral claims in urgent real-world debates. Advocates often argue that preventing extreme suffering (e.g., torture, severe chronic pain, the worst ravages of war or disease) possesses an *absolute moral priority* that standard cost-benefit analysis, which trades off different intensities of suffering and pleasure, fundamentally fails to capture. If LTNU is coherent and defensible, it could radically reshape priorities in policy, resource allocation, and global aid. Conversely, if it collapses under scrutiny, the justification for such absolute priority claims becomes much harder to sustain, forcing us back towards more nuanced, albeit potentially less decisive, trade-off reasoning. Understanding its viability matters for how we approach humanity's deepest harms.

  **2. The Dialectical Fork: Why the Question is Open and Urgent**

  LTNU finds itself pulled in two contradictory directions by its own motivations, creating a genuine fork where neither path seems satisfactory:

  *   **The Commensurability Tension:**
      *   *Path 1 (Single Scale):* Defining a specific *threshold level* strongly suggests that suffering and lesser goods/evils exist on a single, cardinal scale of "badness" or "disvalue." The threshold is a *point* on this scale, and lexical priority is a relation *between regions* of this scale. However, proponents of LTNU are typically deeply skeptical of precisely this kind of commensuration. They argue that extreme suffering is *qualitatively different*, not just quantitatively worse.
      *   *Path 2 (Incommensurability):* To avoid this, proponents might embrace the idea that suffering above the threshold is genuinely *incommensurable* with sub-threshold states. But this immediately raises the "Small Improvement" problem: Imagine suffering *just below* the threshold (S-) and suffering *just above* it (S+). They might be phenomenologically almost identical. Yet, S+ is infinitely worse than S-. How can an arbitrarily tiny intrinsic difference justify an infinite normative gulf? This mirrors classic puzzles about vague boundaries applied to fundamental moral value.

  Existing attempts to stabilize LTNU implicitly choose one path but face severe costs. Path 1 makes the threshold seem arbitrary ("Why *here* on the scale?"), lacking explanation beyond stipulation. Path 2 struggles with the arbitrariness of the boundary itself and the implications of genuine incommensurability for practical reasoning. Neither comfortably delivers the strong, action-guiding priority proponents desire without significant theoretical baggage. This fork is not a pseudo-problem; it strikes at the core conceptual machinery LTNU requires to function.

  **3. Methodology: A Six-Month Investigation Plan**

  *   **Month 1: Formalizing the Core & The Aggregation Problem (Crowding):**
      *   Construct formal models of LTNU, defining the threshold and lexical priority relation rigorously.
      *   Model the "crowding problem": If many instances of suffering *just below* the threshold (each individually outweighed by one instance above) are aggregated, does their total disvalue eventually surpass a single instance above the threshold? (E.g., Does preventing a billion severe headaches outweigh preventing one instance of torture if the headache is just below the "torture" threshold?) Test axiomatizations: Does transitivity *within* the sub-threshold domain force this aggregation? Explore solutions (e.g., a secondary aggregate threshold?) and their costs (complexity, arbitrariness).
      *   *Philosophical Load:* Assess whether aggregation challenges the core "infinite weight" claim or merely refines it.

  *   **Month 2: Extensional Equivalence & The Weight Illusion:**
      *   Formalize a "weighted-sum asymmetric" utilitarianism (WSAU) where suffering above a certain level has a very large, but finite, weight compared to sub-threshold states.
      *   Systematically compare the recommendations of LTNU and WSAU across diverse, finite population scenarios. Identify the conditions under which they yield identical practical prescriptions ("extensional equivalence").
      *   *Philosophical Load:* If equivalence holds in all practically relevant cases, what does this imply? Is LTNU merely a misleading representation of a large-but-finite weighting? What *meaningful* moral difference remains?

  *   **Month 3: Phenomenal Scales & The Pluralism Problem:**
      *   Define distinct candidate scales for measuring suffering intensity: 1) Peak momentary intensity, 2) Duration-adjusted intensity (intensity x time), 3) Holistic "affective budget" (overall misery over time).
      *   Construct cases where these scales conflict: e.g., brief, excruciating agony vs. years of high-but-subtorture chronic pain. Where does the threshold sit on each scale? Do the different scales yield conflicting lexical priorities?
      *   *Philosophical Load:* Does LTNU presuppose a specific metaphysics of suffering intensity? Can it remain neutral? Does scale choice render the threshold arbitrary?

  *   **Month 4: Confronting the Fork - Path 1 (The Scale Route):**
      *   Develop the strongest case for LTNU assuming a single cardinal scale of disvalue. What justifies the threshold's location? Is the discontinuity required by lexical priority compatible with a continuous underlying scale? Is this stipulation defensible?
      *   Test against cases designed to expose arbitrariness: suffering barely above vs. barely below; suffering fluctuating across the threshold. Does the scale itself provide any normative guidance, or is it inert without the stipulated priority rule?
      *   *Philosophical Load:* Can the "ad hoc" charge be rebutted? Does this path surrender the motivating intuition of radical qualitative difference?

  *   **Month 5: Confronting the Fork - Path 2 (The Incommensurability Route):**
      *   Develop the strongest case for LTNU based on genuine incommensurability above the threshold. Can the Small Improvement problem be solved? (E.g., via higher-order vagueness, essential properties?) What are the implications for practical decision-making near the threshold?
      *   Test against borderline cases and Sorites-style progressions of suffering intensity. Does appealing to incommensurability successfully preserve the desired absolute priority without collapsing into incoherence at the boundary?
      *   *Philosophical Load:* Does this path provide sufficient action-guidance? Does it avoid making the threshold itself inexplicable?

  *   **Month 6: Synthesis, Evaluation, and Drafting:**
      *   Weigh the results from both paths against the three core problems (Crowding, Equivalence, Scale Pluralism).
      *   Formulate definitive answers to the core question: Is either path viable? Does one fare significantly better? Do they collapse into each other or into WSAU?
      *   Articulate the project's conclusions and their broader significance for moral theory and priority-setting.
      *   Begin drafting the core journal article.

  **4. Possible Conclusions and Failure Conditions**

  *   **Viable Path Found:** One route (Scale or Incommensurability) successfully navigates the core tension and the three wrinkles, offering a defensible version of LTNU. *Deciding Factor:* Robustness against counterexamples, lack of ad hoc stipulations, preservation of core motivating intuitions.
  *   **Collapse into Weighted-Sum:** LTNU proves extensionally equivalent to a heavily weighted asymmetric utilitarianism (WSAU) in all practically significant domains. *Deciding Factor:* Formal equivalence proofs and analysis showing no distinct practical implications. *Significance:* LTNU proponents are committed only to a large finite weight, not true lexical priority; the rhetoric of "infinite" urgency is misleading.
  *   **Metaphysical Quagmire:** The viability of LTNU becomes inextricably dependent on resolving deep, unsettled questions about the metaphysics of phenomenal intensity and commensurability (e.g., the nature of the scale). *Deciding Factor:* Inability to resolve scale pluralism or ground the threshold non-arbitrarily without appealing to unresolved metaphysics. *Failure Condition:* The project cannot settle the core question within moral philosophy alone within the timeframe.
  *   **Internal Collapse:** Both paths lead to insurmountable problems (e.g., intolerable arbitrariness, unresolvable Sorites paradoxes, failure to provide coherent action guidance near the threshold). *Deciding Factor:* Persistent, structurally damaging counterexamples across all formulations. *Significance:* LTNU is conceptually unstable and should be abandoned as a distinct position.

  **5. Scope Management and Deliverables**

  *   **Priority:** The core formal work (Months 1-3) and confronting the commensurability fork (Months 4-5) are essential. Scale pluralism (Month 3) is crucial but potentially the most expansive.
  *   **If Scale Pluralism Threatens Timelines:** Focus analysis on the two most salient scales (momentary peak vs. duration-adjusted) and bracket the deepest metaphysical questions, treating them as unresolved constraints on LTNU rather than problems to be solved here. The core instability argument can proceed by showing LTNU's vulnerability to *whichever* scale is chosen.
  *   **Minimum Publishable Deliverable:** A substantial journal article (targeting, e.g., *Ethics* or *Philosophy & Phenomenological Research*) conclusively demonstrating the instability of LTNU through the commensurability fork and its vulnerability to at least two of the three core wrinkles (likely Crowding and Extensional Equivalence), establishing a definitive challenge for proponents. This article will form the core of the project's output.
