  ## The Ledger

  **The Charity Calculus**  
  Ben traces a line on his window overlooking the Thames, pointing at an invisible chart. "See that curve? Every pound I earn here, leveraged by giving, buys ten times more deworming pills – proven, RCT-backed – than my marginal year modelling arbovirus spread ever could. The trading happens regardless, Sarah. My seat was open; someone else would be routing these orders, making this money. I’m just... redirecting the flow." His gaze is fixed on the glass, avoiding the city below. The efficiency haunts him, clean and cold.

  **The Unseen Ledger**  
  I stir cold coffee. "Replaceability cuts both ways, Ben. If someone else would take the job, someone else could fund the pills. But a thousand quiet 'someones' taking lucrative jobs they justify with spreadsheets? It doesn’t change the rules. It just oils the machine." I picture the machine: abstract, humming, faceless. "Your ledger only adds the pills. Where’s the column for the volatility siphoned from pensions, the liquidity fueling speculative bubbles, the whole ecosystem this firm optimizes for its own slice?" The harm feels gaseous, impossible to bottle.

  **Net Positive Isn't Fine**  
  We finally open the cursed spreadsheet. Column A: salary converted to deworming pills (7.2 million doses, projected). Column B: "Estimated Systemic Harm" – a frustratingly nebulous figure Ben grudgingly added after weeks of arguing, based on contested econ papers. He taps the bottom line: "See? Still net positive. Significantly." The green cell glows. "But is it *fine*?" he murmurs, almost to himself, staring at the harm estimate’s wide error bars. The screen casts a pallid light on his face. The math wins, but the unease remains, a low hum beneath the calculation.

  **Buying Influence, Not Just Pills**  
  At the Effective Ventures donor circle mixer, polished people discuss marginal utility over canapés. Ben’s eyes shine. "It’s not just the *amount*," he whispers, nodding towards a director of a global health fund. "My contributions unlock co-funding opportunities. I get a *vote*, Sarah. A say in strategy for the whole pot. My salary buys agenda-setting power." The room hums with quiet purpose. Funding decisions ripple outwards, shaped by those who earned the most to give the most. Influence feels cleaner than trading, but heavier.

  **The Necessary Abstraction**  
  His office is silent, just the whir of servers and the flicker of a dozen screens displaying order flow. Ben’s algorithm executes thousands of trades per second, finding microscopic arbitrage in milliseconds, invisible to the human eye. His colleagues are math PhDs, discussing optimization techniques and weekend plans. No villains, just complex systems and elegant code. Harm is statistical, diffuse, hypothetical. Good is quantifiable, tangible, shipped in blister packs to distant clinics. He sips lukewarm tea, the Thames a dark ribbon below, the duality settling in his gut: necessary, efficient, and utterly unresolved.
