prompt: |-
  I am a novelist, and I have been made uncomfortable by an argument I constructed for my own use and cannot now stop. It arose from an ordinary decision. I can either spend the next two years finishing a novel, or take a salaried job that pays substantially more and give away most of the difference to a cheap, well-evidenced health intervention. A philosopher I correspond with holds that the second option is clearly better and that the arithmetic is not close. I wanted a reply showing that the arithmetic is not available. What I produced seems to show something far larger, and I cannot locate the place where it overreaches.

  The argument, as I now have it:

  (1) If the moral status of an action is determined solely by the value of its consequences, then applying that standard to a choice requires comparing the expected values of the options open to me.

  (2) For any action available to me now, the consequences that dominate its expected value lie beyond a horizon at which my evidence stops discriminating between outcomes. A decision of mine propagates through systems sensitive to initial conditions — a reader recommends the book to someone who would otherwise have done something else, and so on without closure — so that over most of the probability mass the shape of the distribution reflects my ignorance rather than my evidence.

  (3) Where the probabilities are not fixed by my evidence, the expected value of the action is not merely unknown to me but indeterminate. There is nothing there to compare; any figure I produce would be an artifact of how I chose to spread my ignorance across the space of outcomes.

  (4) If the expected value of each option is indeterminate, then no option is better or worse than any other, and the standard returns no verdict — including on whether to do the action rather than refrain from it.

  (5) The same holds for any view on which consequences are among the reasons bearing on what I ought to do, including the common-sense morality my correspondent and I both rely on when we say that promises should be kept partly because of what breaking them does.

  (6) So no moral view that gives consequences any weight at all can guide action in any realistic case.

  (7) That is not a conclusion I can accept, and it is not the one I wanted. I wanted only to show that the long-run term in my correspondent's calculation is not a quantity I can work with, and hence that the case for the salaried job is much weaker than she says.

  My correspondent has one reply I cannot dispose of. She says that if I retreat to the consequences I can foresee — the proximate ones — I owe an account of why the horizon may be drawn where I draw it, and why the remote tail beyond it should be treated as cancelling out rather than accumulating in one direction. I have no such account, and I notice that my fallback looks like it was placed so as to return the answer I wanted.

  So I am asking for a diagnosis rather than a verdict. Which step would you reject, and what exactly does that step trade on when read quickly? I would prefer to keep (1) and (2), which strike me as respectively definitional and empirical, and I am willing to give up the conclusion. But I want to know what each available rejection costs me: abandoning (2) in favour of some claim that influence decays and remote effects wash out; treating (3) as a slide from imprecise probabilities to no probabilities, and asking what decision rule imprecise credences actually support; denying (4) on the grounds that an imprecise comparison is not a void one and that partial orderings still guide; denying (5) on the grounds that a view which weighs consequences alongside other considerations was never committed to ranking options by expected value; or denying (1) by separating the claim that consequences are what matter from the claim that expected-value maximization is what that requires. Price these against each other. And tell me whether, on your reading, the argument is best understood as an objection to consequentialism or as an objection to a picture of what it is for a moral theory to guide action.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist troubled by an argument they constructed to counter a philosopher's claim that taking a salaried job and donating to effective charities is clearly better than writing a novel. The argument leads to an uncomfortable conclusion that no moral view considering consequences can guide action. I need to diagnose which step fails and why.

  First, I'll look at the premises. Step 1 seems solid—consequentialism uses expected value. Step 2 is empirical; chaotic systems make long-term predictions impossible. Step 3 claims indeterminacy because probabilities aren't fixed by evidence. That's where I suspect the issue lies. The user conflates epistemic uncertainty with ontological indeterminacy. Just because we don't know probabilities doesn't mean they don't exist. Imprecise probabilities might still allow for decision-making.

  Step 4 says indeterminate values mean no comparison is possible. But even with imprecise credences, we can use decision rules like MaxiMin or interval dominance. Step 5 extends this to all moral theories that consider consequences, which might be overreaching. Non-consequentialist views don't solely rely on expected value comparisons. Step 6 concludes no guidance, which the user rejects. Step 7 shows their intended goal was to weaken the job's case, not invalidate all moral guidance.

  The philosopher's counterpoint about drawing the horizon arbitrarily is valid. The user's fallback to proximate consequences seems ad hoc. The key is to challenge Step 3 without denying uncertainty. Imprecise probabilities can still guide decisions. For example, in effective altruism, robust comparability across options works even with uncertainty. The user's argument conflates the unknowable with the incomparable. 

  I should also consider the deeper needs. The novelist likely feels guilty for choosing art over direct charity. They need a principled way to justify their choice without dismissing consequentialism. Highlighting threshold deontology or scalar consequentialism could help. Their identity as an artist matters—creating art has intrinsic value that isn't easily quantified. The philosopher's pressure might overlook the novelist's unique contributions through their work.

  The cost of rejecting each step: Abandoning Step 2 might require assuming effects cancel out, which is empirically shaky. Accepting imprecise probabilities (challenging Step 3) allows decision-making under uncertainty. Denying Step 4 preserves partial ordering. Step 5's overextension ignores that non-consequentialist theories don't rely solely on expected value. Step 1's definition might be too narrow; consequentialism can use decision rules beyond strict maximization.

  Ultimately, the argument attacks both consequentialism's application and moral guidance itself. But focusing on Step 3's conflation offers a balanced fix. The novelist can argue that without robust expected value comparisons, the philosopher's certainty is unfounded, but without collapsing all moral guidance. This respects their need to validate their artistic choice while engaging with effective altruism thoughtfully.
answer: |-
  Your argument is a sophisticated variant of the "cluelessness" objection to consequentialism, but I believe Step 3 is the critical overreach. Here's a diagnosis, priced against your constraints:

  ### Rejection: Step 3 trades on a conflation of *epistemic* and *metaphysical* indeterminacy
  - **What it claims**: Where evidence doesn't fix probabilities, expected value (EV) is *indeterminate* (not merely unknown).
  - **Why it fails**: Epistemic limitations ≠ ontological indeterminacy. Your ignorance about long-term effects doesn't mean there *is no fact of the matter* about probabilities or EVs; it means you lack epistemic access. This is a slide from **imprecise credences** (epistemic) to **no credences possible** (metaphysical).
  - **Cost to you**: Minimal. You keep (1) and (2). You acknowledge real uncertainty without claiming EVs vanish.
  - **How it blocks the argument**: Step 4 collapses because indeterminate EVs aren't *required* for decision-making. We use **decision rules under imprecise probability** (e.g., interval dominance, MaxiMin, or "robust comparability" à la Effective Altruism). Even with indeterminate EVs, one option may *stochastically dominate* another, or their intervals may not overlap.

  ### Pricing Other Rejections:
  1. **Abandon (2) for "effects wash out"**:  
     - *Cost*: High empirical burden. Chaos theory suggests effects *amplify*, not cancel. Requires assuming ergodicity in social systems—a hard sell.  
     - *Benefit*: If remote effects *do* cancel, EVs become tractable. But this feels ad hoc for your case.

  2. **Deny (4): Imprecise comparisons still guide**:  
     - *Cost*: Low. Accepts (2)-(3) but argues that even with indeterminate EVs, we can:  
       - Compare "proximate" EVs if long-tail effects are symmetric.  
       - Use **satisficing** (e.g., "Does donating $X meet a threshold of good?").  
       - Rely on **moral heuristics** (e.g., "Saving identifiable lives now is reliably good").  
     - *Benefit*: Preserves moral guidance without precise EVs.

  3. **Deny (5): Non-consequentialist views aren't hostage to EV maximization**:  
     - *Cost*: Moderate. You must clarify that "weighing consequences" ≠ "consequentialism." Most non-consequentialist views (e.g., threshold deontology) treat consequences as *inputs* to duties, not as *sole determinants* of rightness.  
     - *Benefit*: Insulates common-sense morality from your argument. Promises create duties; consequences merely set thresholds for override.

  4. **Deny (1): Consequentialism ≠ EV maximization under uncertainty**:  
     - *Cost*: High theoretical burden. Requires defending an alternative (e.g., **global consequentialism** where rules, not acts, are evaluated).  
     - *Benefit*: Consequentialism survives by decoupling decision-procedure from criterion of rightness.

  ### What the Argument Is Really Attacking
  - **Primarily**: A *picture of how moral theories guide action*. It assumes guidance requires *determinate expected value comparisons*. Rejecting this picture (via Step 3) is less damaging than rejecting consequentialism itself.  
  - **Secondarily**: *Long-termist consequentialism* specifically, by exposing the epistemic fragility of forecasting causal chains. This aligns with your goal to weaken the job's case.

  ### Why the Philosopher's Reply Bites (and How to Counter)
  Their challenge—"why draw the horizon *here*?"—is valid if you retreat to proximate consequences. But if you **reject Step 3 instead**, you can reply:  
  - *"We needn't ignore long-term effects; we must use decision rules for deep uncertainty. Your calculation assumes precise EVs far beyond our evidence. Without reliable probabilities, the 'expected value' of donating is too vague to declare the job 'clearly better.' My novel has *knowably* good proximate effects (artistic value, my flourishing), while the donation's long-tail EV is radically imprecise. Under imprecise credences, these aren't robustly comparable."*  

  This avoids arbitrary horizons and respects uncertainty without nihilism.

  ### Final Diagnosis
  - **Fatal flaw**: Step 3’s leap from "I can't assign precise probabilities" to "EVs are indeterminate and incomparable."  
  - **Cost-effective fix**: Reject Step 3. Use **imprecise probabilities** and **robust decision rules** (e.g., if all plausible probability distributions make donating better, choose it; otherwise, default to proximate goods).  
  - **Outcome**: The job's case weakens (as you wanted) because its long-term EV is *unreliably estimated*, not because morality is inert. You keep moral guidance by accepting that **some comparisons under uncertainty are still decisive**—but not in your philosopher's simplistic arithmetic.

  This preserves your core insights while avoiding the paralyzing conclusion. The argument isn't a bomb; it's a spotlight on the limits of expected-value maximization in chaotic systems.
