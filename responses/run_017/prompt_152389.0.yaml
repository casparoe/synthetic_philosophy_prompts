  Here's a decision tree designed for your group, based on the logical distinctions you care about. It has 8 branch questions, each action-oriented and answerable without philosophy training. The tree prioritizes your two key distinctions (local vs. universal hinges, and context-relativity) and incorporates the "riverbed" metaphor where possible. Leaves are named where standard, or marked "unnamed" with a brief reason.  

  ### **Decision Tree: What Kind of Certainty Is This?**  
  Start with your proposition and work through the questions:  

  1. **If someone denied this, would you immediately know how to check it (e.g., by looking, testing, or measuring)?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q5.  

  2. **Would checking it require you to assume other things you’re certain about?**  
     - **Yes** → Go to Q3.  
     - **No** → This is an **ordinary empirical fact** (e.g., "There’s a chair in this room").  

  3. **Is this denial only plausible in a specialized context (e.g., science, law, or religion), not in everyday life?**  
     - **Yes** → This is a **local hinge** (e.g., "Innocent until proven guilty" in law).  
     - **No** → Go to Q4.  

  4. **If this were false, would it unravel most things you take for granted (e.g., your ability to reason, trust senses, or interact with the world)?**  
     - **Yes** → This is a **universal hinge** (e.g., "My senses are usually reliable").  
     - **No** → This is a **well-confirmed empirical fact** (e.g., "Australia exists").  

  5. **If someone denied this, would you try to explain what the words mean?**  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  

  6. **Could the meaning of the words change with new discoveries or cultural shifts?**  
     - **Yes** → This is a **grammatical proposition that can shift** (e.g., "Water is H₂O" – could change if chemistry redefines "water").  
     - **No** → This is a **fixed grammatical proposition** (e.g., "Bachelors are unmarried").  

  7. **Would denying this make you question their sanity or your ability to communicate with them?**  
     - **Yes** → Go to Q8.  
     - **No** → *Unnamed: Incoherent position* (Denials that aren’t grammatical or hinge-like are too ambiguous to engage with).  

  8. **Is this certainty tied to a specific practice or community (e.g., science, parenting, culture)?**  
     - **Yes** → This is a **context-relative hinge** (e.g., "This ritual appeases the gods" – hinge for believers, checkable claim for anthropologists).  
     - **No** → This is a **universal hinge** (e.g., "I have a body").  

  ---

  ### **Tree Structure and Logical Space**  
  The tree first splits propositions into those you can **check** (Q1) and those you can’t. From there:  
  - **Checkable claims** branch into ordinary facts, well-confirmed facts, or hinges (local/universal) based on whether they rely on assumptions (Q2), are context-bound (Q3), or are foundational (Q4).  
  - **Uncheckable claims** branch into grammatical propositions (Q5–Q6) or hinges (Q7–Q8), with Q8 handling context-relativity.  
  - **Riverbed shifts** are explicitly covered:  
    - Grammatical shifts at Q6 (words change meaning).  
    - Hinges can shift over time if tied to practices (Local hinges at Q3, Context-relative hinges at Q8). Universal hinges (Q4, Q8) rarely shift – they’re treated as bedrock for *all* human life.  
  - **Key distinctions prioritized**:  
    - Local hinges (Q3) vs. universal hinges (Q4, Q8).  
    - Context-relativity (Q8) – same sentence can be hinge for you, empirical for others.  
  - **Judgment calls flagged**: Q4 (what "unravels" certainty) and Q7 (what feels like insanity) rely on intuition.  

  #### **Leaves of the Tree (6 named, 1 unnamed)**  
  1. **Ordinary empirical fact** (Q2→No): Checkable without assuming other certainties.  
  2. **Well-confirmed empirical fact** (Q4→No): Checkable but so established that doubting it feels odd.  
  3. **Local hinge** (Q3→Yes): Load-bearing for a practice (e.g., law, science), but not all life.  
  4. **Universal hinge** (Q4→Yes or Q8→No): Load-bearing for *all* human practices.  
  5. **Fixed grammatical proposition** (Q6→No): True by definition; words don’t shift.  
  6. **Grammatical proposition that can shift** (Q6→Yes): True by definition now, but words could change.  
  7. **Context-relative hinge** (Q8→Yes): Hinge for you, checkable for others (e.g., experts/different cultures).  
  8. *Unnamed* (Q7→No): Denial isn’t hinge-like, grammatical, or empirical. *Reason: Incoherent* – Denials like "I don’t exist" or "Words have no meaning" paralyze discourse.  
  9. *Unnamed* (Q3→No then Q4→Yes is covered under universal hinge; no empty cells remain).  

  **Why no other leaves?**  
  - *No "universal hinge that shifts" leaf*: If a hinge is truly universal (not local/Q3 or context-relative/Q8), it’s treated as immutable. Shifts here would break human rationality (unexplored in Wittgenstein).  
  - *No "non-shifting context-relative hinge" leaf*: If a hinge is context-relative (Q8), it can shift by definition.  

