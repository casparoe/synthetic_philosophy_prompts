prompt: |-
  I'm a second-year undergraduate taking a large world-history survey this term — the first third is big-history framing in the style of Harari, the middle is Diamond, and the last third is Graeber and Wengrow's *The Dawn of Everything* plus the archaeologists and historians who attack the whole genre — and I also work as a peer writing tutor in the writing centre attached to the course. Almost every week I sit down with a paper or a magazine pitch built on one enormous causal claim: that farming made inequality possible, that the orientation of the continental axes decided who conquered whom, that writing (or money, or organized religion) was the technology that finally let strangers cooperate at scale, that domestication domesticated us in turn. My difficulty is not that these claims are unfamiliar to me. It is that I have no repeatable way of separating the ones that can bear weight from the ones that are retrospective stories with a confident voice, and I cannot adjudicate them on area knowledge, because I am a sophomore, my students are mostly freshmen, and neither of us can go and check the archaeological record.

  What I want is a review procedure I can actually run in about twenty minutes, alongside a student with their draft, with no library access and without pretending to an expertise I do not have. It should: (a) translate whatever the critics of grand narratives have actually established — the difference between a mechanism that would have predicted the pattern in advance and one fitted to it afterwards, level-of-analysis slippage between individuals and populations, chains advertised as one cause that are really long conjunctions of necessary conditions, teleological and stage-of-progress phrasing, outcome selection, the way a comparative sample gets built — into an ordered set of tests; (b) say what counts as passing each one, so that "this is monocausal" or "this is a just-so story" is a verdict with criteria rather than a vibe; (c) name the point at which the procedure returns "not established by this argument" and stops, as opposed to "false," since that distinction matters when the output is a comment on someone's grade-relevant work; and (d) flag the questions it has to hand back to a person because they are interpretive or evaluative rather than evidentiary — for instance whether "worse off" in a claim about the Neolithic is being measured over the lived experience of individuals or over the persistence and spread of populations, or how much weight one well-excavated counterexample should carry against a large-scale comparative trend. Please also be explicit about where the procedure will misfire: the kinds of genuinely well-supported claims it will ding, and the kinds of empty claims it will wave through.

  Then run it, in front of me, on three claims that came in this month. (1) "The Neolithic transition was a trap that no one chose: per person, early farmers worked longer hours for a narrower diet and more infectious disease than the foragers they replaced, and by the time the costs were visible the population depended on the crops and could not go back, so the whole shift was a catastrophe dressed up as progress." (2) "Inequality is a product of agriculture. Foragers were egalitarian because meat and gathered food cannot be stored or defended; once grain could be stored, some households could accumulate and the rest had to submit — which is why every state we know of rests on a farming base." (3) A claim from a paper I personally like and would be sorry to see rejected: "Grand narratives are self-undermining: the comparative method that lets us generalize about the whole human past is also what shows that the past contains no natural experiment clean enough to support such generalizations, so the genre's honest conclusion is that it cannot deliver what it promises." I would like to see what the procedure returns for each, including if it tells me to give up (3) — and since I have to defend any comment in two sentences to the student who wrote the paper, and the instructor signs off on anything that touches a grade, please keep the language at a level I can say out loud in a tutorial.
reasoning: |-
  Okay, let me tackle this complex request step by step. The user is a sophomore peer writing tutor dealing with undergraduate papers making grand historical claims. They need a practical 20-minute evaluation framework that doesn't require specialized knowledge but can critically assess causal arguments. 

  First, I consider what makes this challenging: The user can't verify archaeological evidence yet must help students strengthen arguments. They need concrete tests for common pitfalls in grand narratives, not vague impressions. The framework must distinguish "unproven" from "false" since it's for academic feedback, and explicitly flag interpretive judgments.

  I recall the key critical concepts from their course: post-hoc fitting vs predictive mechanisms, ecological fallacies in level-shifting, necessary vs sufficient conditions, teleology, sampling bias. These need translation into actionable checklist items. Each test should have clear pass/fail thresholds - like requiring at least two independent causal pathways for a monocausal claim.

  For implementation, I imagine a flowchart-style procedure: Start with the most fundamental issue (causal isolation), proceed to evidence quality, then check for narrative traps. It should stop early when claims fail basic tests. The "judgment call" flags are crucial - they'll remind tutors to say "this requires expert evaluation" rather than overstepping.

  Now testing it on their three examples:
  For Claim 1 (Neolithic trap), the framework should catch the teleological "trap" language and highlight the lack of counterfactual evidence about whether reversal was possible. 
  Claim 2 (agriculture → inequality) fails the storage-mechanism test - ethnographic studies show some foragers have storage yet remain egalitarian. 
  Claim 3 (self-undermining grand narratives) ironically passes most tests but gets flagged for its evaluative conclusion about the genre's impossibility - that's a philosophical judgment beyond the framework's scope.

  I note where the tool might err: Well-supported complex theories could trigger false positives on "conjunction of conditions," while sophisticated just-so stories might pass if they cite apparent mechanisms. The disclaimer about these limits is essential for academic integrity.

  Finally, I craft student-friendly feedback phrases: For Claim 2, instead of "wrong," say "the mechanism isn't inevitable - here's why storage doesn't always cause accumulation." This maintains scholarly humility while teaching critical evaluation.
answer: |-
  Here's a practical 20-minute review procedure focused on **argument structure and evidentiary reasoning**, designed for peer tutors without specialized knowledge. It prioritizes identifying *unsubstantiated claims* over proving them false.

  ---

  ### **The Grand Narrative Argument Check (GNAC)**
  **Core Principle:** Does the argument demonstrate *how* we know this, not just *what* we know?  
  **Outputs:** "Pass," "Flagged for [Specific Issue(s)]," or "Judgment Call Needed on [Issue]."  
  **Misfires:** Will ding well-supported but complexly argued claims; may wave through empty claims using sophisticated hedging or ambiguous language.

  #### **Ordered Tests (5-7 mins each max):**
  1.  **Causal Isolation Check:**  
      *   **Test:** Does the claim present **ONE factor** (farming, writing, axes) as *the* decisive cause/key enabler?  
      *   **Pass:** Explicitly acknowledges other contributing factors OR frames the factor as necessary but not sufficient.  
      *   **Fail:** Uses definitive, singular causal language ("made possible," "decided," "the technology that finally let").  
      *   **Flag:** "Monocausal / Overly Deterministic. Consider complexity: were other factors needed?"

  2.  **Mechanism Check:**  
      *   **Test:** Is a **plausible pathway** described *connecting* the cause (X) to the outcome (Y)? (e.g., *How* does grain storage *lead* to permanent inequality?)  
      *   **Pass:** Clearly describes steps (X → A → B → Y) based on human behavior/logic/evidence.  
      *   **Fail:** Assumes connection without explaining *how* (X magically causes Y) OR mechanism relies on circular reasoning/assumed inevitability.  
      *   **Flag:** "Mechanism Unclear or Assumed. Explain *how* X leads to Y step-by-step."

  3.  **Evidence Scope Check:**  
      *   **Test:** Does the evidence **match the scale** of the claim? (Global claim needs global evidence; "every state" needs evidence from all known early states).  
      *   **Pass:** Evidence cited is representative of the breadth claimed (e.g., multiple diverse examples for a global pattern).  
      *   **Fail:** Evidence is anecdotal (1-2 examples), geographically/culturally limited, or ignores significant known counterexamples.  
      *   **Flag:** "Evidence Scale Mismatch. Does this evidence support a claim this broad? Consider counterexamples/variation."

  4.  **Teleology/Progress Check:**  
      *   **Test:** Does the argument imply **inevitability or progress**? (e.g., "finally let," "dressed up as progress," "could not go back," "made possible").  
      *   **Pass:** Frames outcomes as contingent, context-dependent, or explicitly avoids value judgments like "progress."  
      *   **Fail:** Uses language of destiny, stages, or inherent improvement; implies actors couldn't have done otherwise.  
      *   **Flag:** "Teleological/Progress Narrative. Avoid implying inevitability or judging past outcomes by modern standards."

  5.  **"Compared to What?" Check:**  
      *   **Test:** Is the **baseline comparison** clear and justified? (e.g., Farmers worse than *which* foragers? When? Where?).  
      *   **Pass:** Explicitly states the comparison group/period and justifies its relevance.  
      *   **Fail:** Vague comparison ("foragers," "before") or compares unlike things (e.g., early stressed farmers vs. later successful foragers).  
      *   **Flag:** "Baseline Ambiguous. Specify *exactly* what is being compared and justify the comparison."

  6.  **Conjunction Check (If Chain Claim):**  
      *   **Test:** If the cause is a **chain** (X → Y → Z), does the argument show **each link is robust** and necessary?  
      *   **Pass:** Acknowledges each link requires support; doesn't assume one link proves the chain.  
      *   **Fail:** Treats a long chain (e.g., stored grain → accumulation → inequality → states) as a single, automatic cause.  
      *   **Flag:** "Conjunction of Conditions. Each step in this causal chain needs its own support."

  **Stopping Point:** The procedure returns "**Not Established**" if *any* check fails/is flagged. It does *not* return "False."  
  **Judgment Call Flags:** Triggered by questions requiring interpretation of evidence weight, definitions ("worse off"), or significance of counterexamples. Flag: "**Judgment Call Needed:** [Specific Issue - e.g., 'How to weigh Site X against broader trend?', 'Define "worse off"?']"

  ---

  ### **Applying GNAC to Your Claims**

  **Claim 1: "The Neolithic transition was a trap... catastrophe dressed up as progress."**
  *   **Causal Isolation:** FAIL ("a trap", "the whole shift" implies singular, inevitable cause/outcome). Flag.
  *   **Mechanism:** PASS (Describes pathway: dependence → inability to revert → worse outcomes).
  *   **Evidence Scope:** JUDGMENT CALL (Is "per person... longer hours... narrower diet" true *everywhere*? Famous debate w/ counter-evidence. Needs weighing).
  *   **Teleology:** FAIL ("trap," "catastrophe dressed up as progress" – clear value judgment/inevitability). Flag.
  *   **Compared to What?** JUDGMENT CALL (Compares "early farmers" to "foragers they replaced." But *which* foragers? *When*? Variability is huge. Needs specification).
  *   **Verdict:** **Not Established.** Flags: Causal Isolation, Teleology. Judgment Calls: Evidence Scope, Baseline Comparison.
  *   **Feedback to Student:** "The argument presents the shift as one inevitable 'trap,' but evidence on farmer health varies regionally. Avoid judging it as a clear 'catastrophe.' Specify *which* foragers and *when* for a fairer comparison." (Focuses on flags/judgment calls).

  **Claim 2: "Inequality is a product of agriculture. Foragers egalitarian... stored grain... accumulate... submit — why every state rests on farming."**
  *   **Causal Isolation:** FAIL ("Inequality is a product of agriculture," "why every state"). Treats agriculture as singular cause. Flag.
  *   **Mechanism:** WEAK PASS (Stored grain → accumulation → submission). Simple but logical, though ignores other paths to inequality.
  *   **Evidence Scope:** FAIL (Ignores significant evidence: 1) Egalitarian *farmers* (e.g., early Neolithic Çatalhöyük?), 2) Highly *unequal* foragers (e.g., NW Coast complex foragers w/ slavery, inherited rank), 3) Non-agrarian state bases (debated, but e.g., pastoralist/steppe empires). Flag.
  *   **Teleology:** PASS (No explicit progress language).
  *   **Compared to What?** FAIL (Vague "foragers" vs. "grain storing farmers." Ignores variation within both). Flag.
  *   **Conjunction:** FAIL (Stored grain → accumulation → inequality → states treated as automatic chain). Flag.
  *   **Verdict:** **Not Established.** Flags: Causal Isolation, Evidence Scope, Baseline Comparison, Conjunction.
  *   **Feedback:** "Agriculture isn't the *only* source of inequality – we see inequality in some forager societies and equality in some early farming ones. The claim 'every state' ignores variation and assumes stored grain *always* leads to submission. Be more precise." (Focuses on Evidence Scope & Conjunction flags).

  **Claim 3: "Grand narratives are self-undermining: comparative method... shows past contains no natural experiment... honest conclusion is [the genre] cannot deliver."**
  *   **Causal Isolation:** PASS (Focuses on a core *methodological* constraint of the genre itself).
  *   **Mechanism:** PASS (Comparative method requires controls → Past lacks clean controls → Cannot reliably generalize → Genre fails). Clear logical chain.
  *   **Evidence Scope:** PASS (Evidence *is* the methodological critique itself; cites a property of historical data).
  *   **Teleology:** PASS (No inevitability/progress re: history; critiques the *genre*).
  *   **Compared to What?** N/A (Not comparing historical periods).
  *   **Conjunction:** N/A (Not a causal chain about history).
  *   **Judgment Call:** **CRITICAL FLAG.** The core claim ("cannot deliver") is an **evaluative/philosophical judgment** about the *entire genre's possibility*, based on interpreting the limits of the comparative method. This is beyond pure evidence-checking.
  *   **Verdict:** **Judgment Call Needed.** Core claim is interpretive/evaluative. (Passes structural checks but the *conclusion* is a meta-argument).
  *   **Feedback:** "Your argument logically shows the *difficulty* of grand narratives due to messy historical data. Whether this means they *cannot* deliver *any* useful insights is a deeper philosophical question about history. Frame this as your strong interpretation, not an absolute fact." (Highlights the Judgment Call nature of the conclusion).

  ---

  ### **Key Advantages for You**
  1.  **Actionable:** Focuses on identifiable *features of the argument text*, not your knowledge of Çatalhöyük or Göbekli Tepe.
  2.  **Defensible:** Flags specific issues (monocausal, scope, teleology) with clear criteria. "Not Established" is accurate and fairer than "False."
  3.  **Efficient:** Ordered tests allow fast triage. Failing an early test (like Causal Isolation) often means you can stop.
  4.  **Pedagogical:** Flags (like "Judgment Call Needed" or "Evidence Scope Mismatch") directly name concepts students can learn to address.
  5.  **Humble:** Avoids you being the arbiter of truth. Focuses on whether *this argument, as written*, establishes its claim.

  **Remember:** This tool catches *common flaws in grand narrative arguments*. A claim passing GNAC isn't automatically *true*, but it has cleared major hurdles. A claim failing is *unproven by its current presentation*. Your role is to help students *strengthen their argument*, not certify historical truth. This procedure gives you concrete, defensible reasons to suggest revisions.
