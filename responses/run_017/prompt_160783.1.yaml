  ### Step 3: Content Development

  **Title:** "The Verifiability-Competence Trade-off in Scalable AI Oversight"

  **Framing:**
  Scalable oversight methods (like iterated amplification) aim to build AI systems that are both more competent than their human overseers and aligned with human values. These methods decompose complex tasks into sub-tasks that can be handled by the system and verified by the human. However, we identify a fundamental tension: the very decompositions that enable competence gains often rely on compressed representations that are difficult for the human to verify, thus threatening alignment. Similarly, the distillation step may amplify competence while eroding alignment by neglecting rare but critical behaviors. This project formalizes and investigates this tension.

  **Core Question:**
  Can we achieve unbounded competence gains through decomposition and distillation while maintaining alignment, or does the need for verifiability at each step impose a fundamental limit? And does distillation systematically discard alignment-relevant information due to its concentration in low-probability outputs?

  **Conjectures:**
  We focus on two complementary conjectures:
  - **Conjecture 1 (Verification Closure):** In any decomposition scheme, if the verification of sub-answers does not itself require amplification (i.e., is "verification-closed"), then the competence gain is bounded. Unbounded gains require verification steps that are themselves complex, pushing the problem to a higher level without resolving it.
  - **Conjecture 2 (Distillation Distribution Mismatch):** Distillation, by training on samples from the amplified system, optimizes for the high-probability outputs (which carry competence) but neglects the low-probability, high-stakes outputs (which carry critical alignment-relevant content). This is not an inherent limitation of alignment but a byproduct of standard training objectives, and may be mitigated by alternative sampling or loss functions.

  *Are they separable?* Yes, but they are interconnected. Conjecture 1 focuses on the decomposition step (amplification), while Conjecture 2 focuses on the distillation step. We will investigate both.

  **Why Existing Work Leaves it Open:**
  The literature on scalable oversight often assumes that decomposition and distillation can simultaneously improve competence and preserve alignment. However, existing approaches do not rigorously address:
  - The *verifiability cost* of decomposition: Standard models (e.g., based on recursive reward modeling) assume that humans can always verify sub-tasks, but if verification requires understanding the entire context, this may not scale.
  - The *distributional effects* of distillation: While it is known that distillation compresses knowledge, the specific claim that alignment-relevant behaviors reside in the tails and are lost in expectation has not been formally analyzed.

  Common rebuttals include:
  - "Humans can use tools to verify." But that just shifts the problem to aligning the tools.
  - "More advanced oversight can recover the tail." But without explicit design, this may not happen.

  These issues are not settled because the literature has not explicitly modeled the information flow and loss in these processes.

  **Methodology:**
  We propose a hybrid approach: a conceptual analysis informed by a lightweight formal model. This avoids the pitfalls of:
  - *Pure human experiments:* They are costly and may not reveal structural limits.
  - *Pure formal models:* They might oversimplify the alignment problem (e.g., by assuming a clean utility function) and miss the distributional aspects.
