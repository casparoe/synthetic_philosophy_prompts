  - **Months 5-6:** Formalize Conjecture 2: Model the amplified system's output as a distribution. Define alignment-relevant events as low-probability, high-impact outcomes. Analyze the effect of distillation (via KL divergence minimization) on these events. Compare alternative loss functions (e.g., risk-sensitive objectives).
