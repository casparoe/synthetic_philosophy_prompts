prompt: |-
  I read philosophy on my own, with no academic background and no access to a library, mostly from papers and blog posts I can find in the open. There is one dispute I have been circling for a couple of years, and instead of asking who is right I would like a diagnosis of why it does not move.

  I came in through a case I take to be standard: a demon tells you that it will destroy something you care about unless you admire it. You plainly have a reason to admire the demon. It also seems wrong to say that the demon is admirable, or that admiring it is the fitting, correct, or appropriate response to it. The same shape recurs whenever a consideration speaks in favour of having an attitude without speaking in favour of what the attitude is about: a reason to be afraid of a dog you know is harmless, because being afraid is exhilarating; a reason to believe something, because believing it would make you happy; a reason to feel gratitude toward someone who benefitted you for manipulative reasons. I first got interested because of the last sort of case, for personal reasons, and it is still the one I care about.

  From what I can find, nobody disagrees about which verdict the central cases should get. The disagreement is entirely about what the distinction is, and about whether there is one distinction at all. One family of answers sorts reasons by what they bear on: some bear on whether the attitude fits its object, others on whether it would be good, useful, or safe to be in that state. Another family says the difference is not in the reasons but in the route to the attitude: a reason of the right kind is one you could arrive at the attitude through, one you could cite in forming it, whereas the demon's threat cannot be cited that way because you cannot admire on command. A third family builds the distinction into a theory of what value is, so that the interesting question becomes whether the phenomenon is a problem for that theory specifically or a problem for everyone equally. And there is no agreement about scope either: some writers seem to treat the phenomenon as special to evaluative attitudes like admiration, others treat belief and intention as instances of the very same thing.

  What I find dispiriting is the pattern rather than the positions. Every account I read handles the easy cases, and then needs some addition to handle the hard ones. There is no agreed criterion, no agreed list of which cases are hard, and no visible mechanism by which anyone's mind gets changed. So I have two hypotheses, and I want to know whether either is close.

  The first is that the phenomenon is largely an artefact of how the cases are described. Very often, what is called a wrong-kind reason for an attitude looks like a perfectly good right-kind reason for some neighbouring attitude: the demon's threat is an excellent reason for relief, or for a wary kind of deference; the manipulator's benefit may be a perfectly good reason for a qualified acknowledgement rather than for gratitude. If that is generally true, then the wrong kind is not a kind of reason at all but a mismatch between the scope of a reason and the attitude we fixed on when we described the case. A test I have been applying to myself: take any alleged wrong-kind reason and ask whether there is some nearby attitude for which it is a right-kind reason, and then ask what happens to the verdict if we redescribe the case around that attitude instead. If the answer is always yes, and if the verdict always flips with the redescription, the distinction is doing less work than it looks like it is doing.

  The second hypothesis is that even if the first fails, the dispute is really three disputes being run under one name, and that writers switch between them without noticing: an extension question about which reasons bear on whether an attitude is correct; a deliberative question about which reasons can be the ones you act on in forming it; and a question about what you are accountable for, which reasons make you criticizable or blameworthy for lacking the attitude. Nothing requires these to have the same answer, and the two sides, as I read them, seem to be answering different ones and treating the disagreement as if it were about a single thing.

  I also have one case I have never seen discussed, which I would like used as a probe rather than as a puzzle to be settled: suppose the demon's threat is that unless you admire it, it will prevent a third party from admiring something genuinely admirable, and your admiring the demon is the only way to stop that. Here the reason for admiring is not merely prudential and not merely about your own state; it points at the fittingness of someone else's attitude. What an account says about this case, and whether it says it for the same reason it says what it says about the original demon case, seems to me to reveal what the account is actually tracking.

  So: is this a substantive disagreement about a real distinction that has not yet been characterised correctly; a verbal disagreement conducted in terms like fitting, appropriate, and reason; several distinct questions sharing a name; or a clash of bedrock case intuitions that neither side can argue for? I would like the diagnosis argued from what the different accounts actually claim and actually need, not a tour of the options. And I would like an honest account of what would count as progress given your diagnosis: a criterion that settles the contested cases, agreement on what the hard cases even are, splitting the question into pieces, or nothing at all, on the grounds that the question is ill-posed. If it is the last, say so and say why.
reasoning: |-
  Okay, this user is deeply engaged with a philosophical puzzle that's clearly been occupying their thoughts for years. They're an autodidact working without academic resources, which makes their precise articulation of the "wrong kind of reasons" problem even more impressive. The frustration they express about circular debates resonates - this is someone who's done their homework but hit a philosophical wall.

  What they're really asking for isn't just answers but metacognitive tools: how to understand why this debate stagnates, and what "progress" could even mean here. Their two hypotheses show sophisticated analytical skills - the first being essentially a Wittgensteinian dissolution strategy, the second a disentanglement proposal. That undiscussed demon variant case is particularly sharp, designed to test theoretical consistency.

  The emotional tone matters here. When they call it "dispiriting," that's genuine philosophical fatigue. This isn't casual curiosity but something tied to personal experiences with gratitude and manipulation. Any response should honor that depth while providing conceptual clarity.

  Notably, they're not asking who's right but why the debate won't move - that's a philosopher's question. Their request to avoid "tours of options" means we must dive deep into mechanics. The probe case about redirected admiration is brilliant because it pressures all standard accounts: it preserves the "wrong kind" structure while removing purely self-regarding motives.

  Three key challenges emerge:
  First, their hypothesis about attitude redescription deserves serious engagement - if every "wrong kind" reason becomes "right kind" for some adjacent attitude, that could collapse the distinction. But is this always possible? The demon case might be redescribed as respect for power rather than admiration, but does that fully capture the original puzzlement?

  Second, their tripartite distinction between correctness/deliberation/accountability feels astute. Scanlonian accounts prioritize correctness, Razians focus on deliberation, and accountability often lurks unacknowledged. This fragmentation could explain why debates talk past each other.

  Third, that probe case breaks new ground. Standard accounts would likely call this still "wrong kind" since the demon isn't admirable, but the reason now concerns fittingness preservation - which might force expansions of "right kind" domains or reveal deeper fractures.

  The response must show how leading theories (WKR/RKR distinction, fitting attitude accounts, constitutivist approaches) handle these pressure points without resorting to survey-style exposition. And crucially, it should map what "progress" looks like per diagnosis - whether that's refining distinctions, accepting pluralism, or declaring the question ill-posed. Their intellectual honesty demands equal honesty in return, even if the conclusion is unsatisfying.
answer: |-
  Your frustration is well-founded—this debate *does* feel stuck because it grapples with something fundamental but elusive. Based on your analysis and the structure of the literature, here’s a diagnosis arguing from the commitments and needs of the main approaches, followed by what progress might look like:

  ### Diagnosis: It’s **Three Distinct Questions Sharing a Name**
  The core issue isn’t that the distinction is illusory or merely verbal. Rather, the "wrong kind of reasons" (WKR) problem acts as a crossroads where three independent philosophical concerns intersect. Writers often conflate them because they yield similar verdicts in paradigmatic cases (like your demon example), but they diverge in harder cases (like your probe). The three questions:

  1.  **The Correctness Question (Metanormative):**  
      *What makes an attitude fitting/appropriate to its object?*  
      - **Tracked by:** Fitting-attitude (FA) theories of value (e.g., Rabinowicz, Olson, Chappell).  
      - **What it needs:** To ground normative properties (e.g., admirability) in the fittingness of responses. The demon isn’t admirable, so threats can’t make admiration fitting—they’re WKR *for correctness*.  
      - **Problem:** FA accounts *depend* on a prior grasp of fittingness. They use the demon case to *illustrate* the distinction but struggle to *define* it independently. Your probe case highlights this: Is preserving *someone else’s* fitting admiration a "correctness" reason *for you*? FA theorists might split: some say no (correctness is object-grounded), others say yes (if "fittingness preservation" is part of value). This reveals FA’s reliance on pre-theoretic intuitions about correctness.

  2.  **The Deliberative Question (Psychological/Pragmatic):**  
      *Can this reason be directly used in forming the attitude?*  
      - **Tracked by:** "No-guidance" accounts (e.g., Hieronymi, Shah).  
      - **What it needs:** To explain why you can’t admire the demon *on the basis* of its threat. Admiration responds to perceived merit; threats don’t bear on merit, so they’re deliberation-blocking WKR.  
      - **Problem:** This works cleanly for admiration/belief but poorly for attitudes like *intention* (you *can* intend to Φ solely to avoid a threat). Your probe case strains it further: Could you admire the demon *to save another’s fitting admiration*? If yes, it might count as "right-kind" for deliberation, conflicting with FA accounts. This reveals that "guidance" is attitude-specific, not a unified phenomenon.

  3.  **The Accountability Question (Deontic):**  
      *Does this reason make you blameworthy for lacking the attitude?*  
      - **Tracked by:** Theories tying reasons to blame (e.g., Scanlon, Skorupski).  
      - **What it needs:** To explain why you aren’t *blameworthy* for failing to admire the demon, even though you have a reason to do so. Blameworthiness tracks correctness, not mere incentives.  
      - **Problem:** Blame depends on expectations about rational agents. Your probe case asks: *Should* you be blamed if you refuse to admire the demon, allowing genuine admiration to be destroyed? Many would say yes—making this a potential "right-kind" reason for accountability, conflicting with correctness/deliberation verdicts.

  **Why the dispute doesn’t move:**  
  - **Paradigm cases hide the split:** The demon/threat structure answers all three questions the same way ("WKR"). But your probe case—and cases like "intending to Φ to avoid threats"—force them apart.  
  - **Theories optimize for different problems:** FA accounts prioritize saving value realism; deliberative accounts prioritize agency/psychology; accountability accounts prioritize moral responsibility. Each "handles" hard cases by ad-hoc adjustments (*your observation is spot-on*) because they’re solving different puzzles.  
  - **No neutral starting point:** "Fitting," "appropriate," and "reason" are theory-laden. FA theorists use "fitting" metaphysically; deliberativists use it psychologically. This makes arguments circular.

  ### Testing Your Hypotheses
  1.  **Your first hypothesis (attitude redescription):** It’s powerful but not fatal. Redescribing *can* absorb many WKRs (e.g., demon’s threat → reason for *compliance*, not admiration). But it struggles with cases where the *same attitude* is ambiguously demanded (e.g., "Believe 2+2=5 or I’ll hurt you" – no plausible redescription makes this a "right-kind" reason for *any* cognitive attitude). Your probe case *might* flip if redescribed ("reason to *sacrifice your aesthetic integrity*"), but this feels strained—suggesting the core puzzle persists.  
      **Verdict:** Redescription softens but doesn’t dissolve the distinction. It reveals that attitude-specification is crucial, but not that WKRs are illusory.

  2.  **Your second hypothesis (three disputes):** This is the strongest diagnosis. The literature’s stalemate arises because:  
      - Correctness theorists (FA) see deliberativists as missing the *metaphysical* point.  
      - Deliberativists see FA accounts as psychologially implausible.  
      - Accountability theorists see both as ignoring deontic stakes.  
      Your probe case **exposes the split**: It’s clearly WKR for *correctness* (the demon isn’t admirable), potentially RK for *deliberation* (you *could* cultivate admiration to save another’s fitting response), and plausibly RK for *accountability* (you *should* feel obligated to prevent the destruction of value).

  ### What Progress Looks Like
  Given this diagnosis, progress requires **disentangling the three questions** and **mapping their divergence**:
  1.  **Theoretical:** Explicitly distinguish:  
      - *Fittingness* (correctness)  
      - *Deliberative relevance* (guidance)  
      - *Accountability-grounding* (blame)  
      A theory might then specify: "In my account, RKR refers to [one of these]; for others, see [supplementary framework]."  
  2.  **Case Taxonomy:** Classify cases where the three diverge (like your probe). Agreement on "hard cases" would emerge from this:  
      - *Convergent cases*: Threats for admiration (clear WKR for all three).  
      - *Divergent cases*: Your demon probe (splits correctness/deliberation/accountability).  
      - *Edge cases*: Intentions formed under threats (often RK for deliberation/accountability, but correctness? Unclear).  
  3.  **Explaining Divergence:** Why *do* the three come apart? Progress would involve:  
      - **Metaphysics of value:** Is fittingness agent-relative? (Your probe pressures this.)  
      - **Philosophy of mind:** What makes an attitude "reason-responsive"?  
      - **Moral psychology:** When do incentives generate obligations?  
  4.  **Your Probe Case as Litmus Test:** An account that *insists* your probe is WKR *for all three questions* is likely overgeneralizing correctness intuitions. One that *treats it as RK for all three* is likely conflating incentives with fittingness. A mature theory should *explain why* it answers differently for correctness vs. accountability.

  ### Conclusion: Not Ill-Posed, But Overloaded
  The question isn’t ill-posed—there’s a real phenomenon here. But it’s not *one* phenomenon. The stuckness arises because a single label ("wrong kind of reason") masks three distinct problems that align in easy cases but pull apart under pressure. Progress lies in **disambiguation**, not a unified theory. Future work should:  
  - Specify *which* "kind" of reason is at issue (correctness/deliberation/accountability).  
  - Systematically test where these diverge (your probe is a prime candidate).  
  - Accept that no single distinction will cover all cases without ad-hoc patches.  

  This won’t "solve" the WKR problem, but it would transform a dead-end debate into a structured investigation of how value, agency, and responsibility interleave—which is what you’re already doing in your own searching. Your hypotheses, especially the second, are sharp tools for this work.
