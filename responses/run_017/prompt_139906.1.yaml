  Let's break down the translation for each position:

  ### Position 1: Derogatory component is semantic but not truth-conditional (e.g., expressivist or non-truth-conditional semantic theories)

  **Translation:**
  - The word W has a dual semantic value: a truth-conditional part (the referent) and a derogatory part (which is non-truth-conditional).
