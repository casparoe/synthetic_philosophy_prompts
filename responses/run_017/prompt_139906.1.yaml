  2. W in reports, quotations, mentions (e.g., "someone called me W").
  3. W inside negation/embedding (e.g., "no Ws are ever on time").
  4. W with no target (fictional character, robot, intensifier).
  5. W in a variety of English where it is ordinary in-group slang.
  6. W in a scraped corpus or archived messages (no speaker, no audience).

  The user also has specific concerns (residue) about:
  - Authority (contested meaning, reclamation as a fork without ownership)
  - The harmed party (wronging a hearer vs system misbehavior)
  - Deprecation warning vs norm (coordination device vs binding regardless)
