  ### Position 2: Derogatory component as presupposition or conventional implicature

  **Translation:**
  - A presupposition is like a precondition for the sentence to be interpretable. If the presupposition fails, we get a truth-value gap or a special error condition. But for slurs, the derogation is more like a conventional implicature (CI).
  - CIs are often modeled as separate propositions that are entailed but not part of the main content. In computational terms, we might think of a CI as an attribute attached to the expression that must be propagated and is always true (or always derogatory) regardless of the context.
  - Example: In a type system, we might have a type `Term` that carries a `CI` type parameter. For W, the CI is derogatory. The CI is passed up the AST without affecting the truth conditions.
  - Implementation: During parsing, we generate a CI annotation for W. This annotation is then part of the message's metadata (like a pragma) that must be handled separately from the truth-conditional content.

  **Bending:**
  - Presuppositions are more dynamic and context-dependent (they can be accommodated or fail) but conventional implicatures are more rigid. Our system might not have a built-in way to handle accommodation.

  **No counterpart:**
  - The dynamic aspect of presupposition (accommodation) is not easily captured in a static system.

  ### Position 3: Derogatory component is not encoded but in the act of utterance (norm-based)

  **Translation:**
  - The offense comes from the act of using a prohibited term, regardless of the meaning. This is like a lint rule or a deprecation warning: the word W is marked as deprecated (or forbidden) in the lexicon, and using it triggers a violation.
