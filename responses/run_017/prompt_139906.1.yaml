  - Implementation: The lexer or parser would have a rule that when W is used (not mentioned), it raises an exception or flags a violation. This could be handled by blocking the message or logging the event.

  **Bending:**
  - Norms are context-dependent (speaker, audience, etc.) but a simple lexer rule (like Option A) is context-free. We might need to model context (like namespaces for different user groups) to handle reclamation.

  **No counterpart:**
  - The idea of a norm being binding regardless of coordination (like a moral norm) doesn't have a direct counterpart in a technical system, which is based on explicit rules.

  ### Position 4: In-group reclamation changes speech act without changing meaning

  **Translation:**
  - The word W has the same semantic value (truth conditions and derogatory attribute) but when used by an in-group member, the derogatory attribute is suppressed or overridden. This is like having a namespace or scope where the deprecation warning is turned off.
  - Alternatively, we might think of it as a dynamic context: the speaker's identity (extracted from user attributes) acts as a modifier that changes the interpretation. This is similar to a pragma that disables a lint rule for a specific block of code.
