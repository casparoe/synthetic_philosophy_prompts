answer: |-
  ### Translation Mapping

  | Decision Theory Concept                   | Nearest RL Concept                               | Translation Quality | Notes |
  |-------------------------------------------|--------------------------------------------------|---------------------|-------|
  | **Agent/Decision Algorithm**              | Policy (π: history → action distribution)       | Clean               | Core concept aligns directly. |
  | **Updatelessness**                        | Bayes-optimal policy in Bayes-adaptive MDP      | Lossy               | Matches fixed policy optimization, but UDT's "counterfactual copies" extend beyond belief-state uncertainty. |
  | **Policy Output as Chosen Object**        | Policy optimization via Bellman equations       | Clean               | Standard RL policy search. |
  | **Environment Predicts Your Policy**      | π-reactive environment (Stackelberg game)       | Clean               | Direct match: transitions depend on π, not just (s,a). |
  | **Self-Locating Uncertainty**             | POMDP belief state with "copy ID" state factor  | Lossy               | Can be modeled by extending state space, but indexical uncertainty ("which copy am I?") isn't native. |
  | **Counterfactual Control Over Copies**    | Multi-agent RL with identical policies          | Lossy               | Similar to cooperative MARL, but UDT assumes acausal control (no causal links between copies). |
  | **Logical Uncertainty**                   | None                                             | Impossible          | Uncertainty over mathematical truths (e.g., "what would this computation output?") has no RL analogue. |
  | **Global Policy Optimization**            | Off-policy evaluation under distribution shift  | Lossy              | RL handles shift via importance sampling, but UDT optimizes joint outcomes across copies. |
  | **Precommitment**                         | Non-Markovian policy with history dependence    | Clean               | Standard in RL (e.g., POMDP policies). |

  ### Residue Report
  - **Survives unchanged**:
    - Policy-dependent transitions (π-reactive environments): Cleanly captured as Stackelberg games or mechanism design.
    - Fixed policy execution: Matches Bayes-optimality in Bayes-adaptive MDPs (no re-planning needed).
    - History-dependent policies: Native to POMDPs.

  - **Survives with distortion**:
    - **Self-locating uncertainty**: Can be modeled by adding a "copy ID" to the state, but RL lacks priors over indexical facts (e.g., "I'm probably in eval mode"). *Distortion*: RL forces causal-belief updates; UDT treats copy identity as a logical (not empirical) uncertainty.
    - **Global optimization over copies**: Resembles MARL with shared policy, but UDT's acausal control implies rewards depend on counterfactual copies. *Distortion*: RL assumes causal separability; UDT enforces symmetry across logical instances.

  - **Untranslatable**:
    - **Logical counterfactuals**: Reasoning about outcomes of computations that haven't been run (e.g., "if I output action X, what would my eval copy do?"). RL has no formalism for uncertainty over mathematical truths.
    - **Acausal influence**: The idea that your choice "controls" copies outside your causal light cone (e.g., simulations). RL requires causal or probabilistic dependencies; UDT treats logical correlation as control.
    - **Indexical priors**: Updating beliefs about "which copy I am" based on logical structure (e.g., anthropic reasoning). RL belief states track environmental states, not self-location.

  ### Verdict and Commitment
  Your "just Bayes optimality" gloss is correct for standard MDPs but undersells UDT's novel claims. UDT is **irreducible** due to its handling of logical counterfactuals and acausal control. The biggest residue is **logical uncertainty**—the core UDT innovation that forces agents to treat mathematical facts (e.g., program outputs) as random variables. 

  This isn't spooky: it exposes a genuine blind spot in RL. While Bayes-adaptive MDPs handle *epistemic* uncertainty (unknown transition dynamics), they cannot express *logical* uncertainty (unknown outputs of deterministic computations). Your π-reactive environments capture policy-dependence, but UDT's logical counterfactuals require optimizing over a Platonic space of computations. RL frameworks lack:
  - Priors over logical facts (e.g., "is this theorem true?").
  - Counterfactual conditionals on mathematical outcomes.

  **I'd bet on this analysis**: Your example (deployment vs. eval copies) *can* be partially modeled as a POMDP with policy-dependent transitions, but UDT's demand for "controlling all copies" requires logical counterfactuals that break RL's causal graph. The residue isn't just technical—it reveals RL's inability to formalize decisions where the environment contains predictors of π itself (e.g., simulators with access to your weights). This matters for aligned AI: if a reward model simulates your policy, logical counterfactuals become unavoidable.

  \answer{irreducible} logical uncertainty
