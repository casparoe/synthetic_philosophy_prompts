  Moreover, the conflict with other criteria (like calibration by group) is avoided only if the condition holds. But if the condition does not hold (i.e., if for some x, the true risk differs by group), then the model without group will have different error rates for the two groups for that x. Then the colleague's criterion is violated. To satisfy it, we would need to build a model that uses group to adjust the score so that for each x, the error rate is the same. But then the model would have to produce the same prediction for both groups only if the outcome is independent of group given x? Actually, if the outcome is not independent of group given x, then we cannot make the error rates the same for both groups by adjusting the model? Because the error rate for a fixed x and group is determined by the conditional probability of Y given x and group and the model's prediction. If the model can use group, then we can set the prediction per x and group. Then the criterion requires that for each x, the model's error rate for group A and group B are equal. But note that the model can choose the prediction for each (x, a). Then it can set:

    For group A: predict positive if `P(Y=1 | X=x, A) > 0.5` (for example)
