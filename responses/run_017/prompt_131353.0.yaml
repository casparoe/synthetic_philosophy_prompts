    - If for group A the model predicts positive and for group B it predicts positive, then we require `P(Y=0 | X=x, A) = P(Y=0 | X=x, B)`
    - If for group A positive and group B negative, then we require `P(Y=0 | X=x, A) = P(Y=1 | X=x, B)`
