  Now, how does this relate to the usual criteria?

  - **Calibration by group**: If we have calibration by group, then for a given score s, we have `P(Y=1 | S=s, A) = s` and `P(Y=1 | S=s, B) = s`. But note: if the model does not use group, then the same x maps to the same s. But calibration by group does not require that the conditional probability given x is the same across groups. It only conditions on the score. There might be two individuals with the same score but different x's and different group, and calibration would still hold.

  - **Equalized odds**: Conditions on Y. It does not require that the conditional outcome given x is the same.

  Therefore, the colleague's criterion is independent of the usual ones. However, it is a very strong requirement: it requires that the group is uninformative about the outcome given the features. In many real-world settings, this might not hold. For example, if there is unmeasured confounding or if the features do not capture all the relevant factors, then group membership might still be predictive.

  Moreover, if this condition holds, then the base rates within every x are the same. Then the classic impossibility result does not apply? Because the base rates being the same is a condition under which calibration and equalized odds can be simultaneously satisfied.

  But note: the base rates for the entire group might still differ if the distribution of x differs by group. However, the condition `P(Y=1|X=x, A)=P(Y=1|X=x, B)` for all x implies that any difference in base rates is due to differences in the distribution of x. Then, if we have a model that is calibrated by group, it will also satisfy equalized odds? Not necessarily, but the impossibility result does not apply because the base rates being equal is a condition that avoids the conflict.

  So, in summary:

  The colleague's criterion is equivalent to requiring that the outcome Y is independent of group A given the features X. This is a very strong condition and is not implied by, nor does it imply, the usual fairness criteria. However, if it holds, then the base rates within every x are the same, and then the classic impossibility result (which requires different base rates) does not apply. But note: the group base rates might still differ because of different distributions of x.

  ### 3. The Granularity of the Feature Vector

