prompt: |-
  I've just come out of a long argument with a friend who works at a philanthropic advisory shop, and I want help reconstructing what the practice we were arguing about actually presupposes, because I suspect it is committed to more than my friend admits. The practice is the standard cause-prioritisation framework used by grantmakers in that world: candidate causes are scored along three axes — how much value would exist if the problem were solved (cashed out in something like lives saved, quality-adjusted life years, or some generic welfare unit), how much progress an additional dollar buys, and how few other resources are already flowing to the problem — and causes are then ranked by something like the product of the three. Around the scoring sits a cluster of further habits that I think matter. Evaluators decline to recommend an organisation that cannot usefully absorb the money: they ask how much room there is for additional funding, and once that room is nearly filled they move on, even though the programme itself is unchanged and still the cheapest known way to produce the good. The score of a cause goes down when other funders move into it; grantmakers say a cause has become over-subscribed and is therefore a worse bet than it was five years ago — while in the same breath running field-building programmes whose explicit aim is to attract more funders and more talent into the very causes they favour. Donors are told to concentrate everything on the single highest-scoring cause rather than to spread across several, even though everyone agrees the underlying estimates are uncertain by an order of magnitude or more. And in practice only causes that can be given a quantitative model get scored at all: considerations that resist quantification — dignity, coercion, effects on institutions or on culture, the moral significance of who exactly is helped — tend to drop out of the ranking silently rather than entering it as uncertain terms.

  The crux of our argument was the third axis. My friend said it is just a proxy for diminishing marginal returns: my dollar does less good where other dollars are already going, and the framework is only trying to approximate the marginal expected value of the next dollar. I said that cannot be the whole story, because the same variable is also being used as evidence: grantmakers routinely treat the fact that no one is working on something as a warning sign that it is not important or not tractable, and the fact that many smart people are working on something as evidence that it is. Those two roles pull in opposite directions, and I want to know whether a single scoring framework can coherently use one input both as a multiplier on value and as evidence about the other multipliers, or whether that double-counts. She then proposed a rival that I found genuinely illuminating, and I want your verdict on it: replace the third axis with what she called credit-share accounting, where a cause is scored by its importance and tractability divided by the number of funders whose cooperation the outcome requires, so that we rank by our share of the credit for a joint achievement rather than by the difference our dollar makes to how the world goes. Her claim was that the practice already secretly runs on her view and not on the counterfactual one — that the room-for-more-funding check and the concentration advice only look sensible if you think you are buying a share in an outcome rather than making a marginal difference.

  So: reconstruct the implicit theory here, and be disciplined about it. What theory of practical reasons — counterfactual difference-making, marginalism, fair-share-of-a-cooperative-venture, something else — does the practice strictly presuppose, and what does it merely sit well with? Could a non-consequentialist, or someone who thinks we should do our part rather than maximise, endorse the same scoring without inconsistency, which would show the practice is more underdetermined than it looks? Does the practice presuppose that values across radically different causes are commensurable and aggregable, and if so does it presuppose a total rather than an average, person-affecting rather than impersonal, view of aggregation? What does it presuppose about the epistemology of unmodelled effects — is the refusal to score what cannot be modelled a piece of expected-value reasoning, a sensible response to cluelessness, or simply a bias that the framework's own commitments condemn? Separately: is the advice to concentrate rather than diversify compatible with the acknowledged size of the uncertainties, or does it require risk neutrality (and if it requires risk neutrality, is that a substantive moral commitment the practice is smuggling in)? Finally, tell me which feature is doing the real work in the practice, what would have to change in grantmaking if we swapped the counterfactual view for my friend's credit-share view (be concrete: which of the four habits above would survive and which would collapse), and what the sharpest objection is that my friend should make to my charge of double-counting. Please don't answer by saying that the three-axis framework is just a heuristic for expected value — I know the framework and I know that line; I want the commitments that ride along beneath it, and where the practice is running on two theories at once.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a heated argument with a friend about philanthropic cause-prioritization frameworks. The core issue revolves around the third axis—how existing funding affects scoring. The user suspects deeper presuppositions than their friend admits. 

  First, I need to reconstruct the implicit theories. The standard framework uses three axes: scale, tractability, and lack of funding. The friend claims the third axis is just about diminishing marginal returns, but the user points out it's also used evidentially—low funding signals low importance/tractability. That's a conflict because the same variable pulls double duty: as a value multiplier and as evidence. 

  Then there's the friend's alternative: credit-share accounting. Instead of counterfactual impact, you'd calculate your share of credit for a joint outcome. The friend argues this better explains habits like room-for-funding checks and concentration advice. 

  I should start by mapping the practice's commitments. The framework's surface rhetoric is counterfactual, but several habits align better with credit-share thinking. For example, the room-for-funding check makes little sense under strict counterfactualism—if a dollar still saves a life, why stop funding? But under credit-share, it's about avoiding diluted credit. 

  The user wants to know if the practice is theoretically coherent or if it's straddling two incompatible theories. I need to examine where the practice contradicts itself. Like how grantmakers both avoid "over-subscribed" causes while running field-building programs to attract more funders. That's schizophrenic under counterfactualism but rational under credit-share—if you're coordinating a coalition, more players help even if they dilute your personal credit. 

  On moral presuppositions: the framework assumes full commensurability and aggregative consequentialism. Non-consequentialists couldn't adopt it without inconsistency because it reduces all value to a single metric and ignores agent-relative duties. The concentration advice also implies risk neutrality, which is a substantive (and unacknowledged) commitment. 

  For the quantification bias, it's not just about expected value—it's a failure mode where the framework's own methodology excludes hard-to-quantify values. That creates a blind spot the framework can't self-correct. 

  If we swapped to credit-share, the room-for-funding check and concentration advice would survive, but the evidential use of funding levels would weaken. The sharpest rebuttal to the double-counting charge? Grantmakers might argue funding levels correlate with tractability/importance, so using it evidentially isn't double-counting but epistemic humility. But that's shaky—it doesn't resolve the tension when funding levels are manipulated via field-building. 

  The real takeaway: the practice isn't running on one theory but a muddy hybrid. Credit-share explains donor psychology better, but counterfactualism is the official story. That tension is why the user feels something's off.
answer: |-
  Your reconstruction is sharp, and your friend's "credit-share" proposal reveals a genuine tension. The practice isn't running on a single coherent theory but on an unstable hybrid. Here's a disciplined dissection of the implicit commitments, underdetermination, and consequences of swapping theories:

  ### 1. **Core Implicit Theory: A Schizophrenic Hybrid**
     - **Surface Rhetoric**: Counterfactual marginalism ("expected value of the next dollar").
     - **Actual Operating System**: **Credit-Share Accounting with Consequentialist Packaging**.
       - The "third axis" (lack of funding) functions dually:
         - *As a multiplier*: Reflects diminishing marginal returns (counterfactual logic).
         - *As evidence*: Signals tractability/importance (epistemic logic).
       - This duality is incoherent under pure counterfactualism. If low funding *causes* higher marginal value (multiplier), it cannot simultaneously *indicate* low importance/tractability (evidence)—these pull oppositely.
       - Your friend is right that habits like "room-for-funding checks" and "concentration advice" only make sense under credit-share: You avoid "overcrowded" causes not because your dollar does less good, but because your *credit* is diluted. Field-building programs confirm this—they recruit allies to *jointly* solve a problem, trading personal credit for collective success.

  ### 2. **Moral and Epistemological Presuppositions**
     - **Commensurability & Aggregation**: 
       - *Presupposed*: Radical commensurability (QALYs, welfare units) and impersonal total utilitarianism. The product formula implies additive separability and ignores distribution (e.g., helping 1 person 1000x ≠ helping 1000 people 1x under prioritarianism).
       - *Underdetermination*: A non-consequentialist could use the framework *instrumentally* but would reject its reduction of value to a scalar. "Doing one's part" (e.g., Kantian duties) clashes with concentration—why neglect a pressing cause just because it ranks #2?
     - **Unmodelled Effects**:
       - *Presupposed*: Quantification bias as **expected-value reasoning + institutional risk aversion**. Omitting non-quantifiables isn't just cluelessness; it’s a choice to privilege modelable interventions. The framework condemns this by its own lights—silently dropping dignity/coercion violates its commitment to "value."
     - **Concentration vs. Uncertainty**:
       - *Presupposed*: **Risk neutrality and linear utility**. If value estimates have order-of-magnitude uncertainty, diversifying across top causes reduces volatility. Concentration advice assumes: (a) error distributions are symmetric, (b) the top cause’s lead is robust, and (c) donors are risk-neutral. This smuggles in a strong utilitarian commitment.

  ### 3. **Credit-Share vs. Counterfactual: Practical Consequences**
  Swapping theories would reshape the four habits:
  | **Habit**               | **Under Counterfactualism**                     | **Under Credit-Share**                          |
  |--------------------------|-----------------------------------------------|------------------------------------------------|
  | **Room-for-funding check** | Collapses (if marginal $ still saves lives, fund until returns hit zero) | Thrives (stops when your credit share becomes trivial) |
  | **Field-building programs** | Incoherent (attracting funders *lowers* your cause's score) | Coherent (allies boost success probability, offsetting diluted credit) |
  | **Concentration advice** | Dubious under uncertainty (ignores model error) | Strengthened (focus maximizes your credit-claim) |
  | **Evidential use of funding** | Contradictory (low funding = high value but low importance?) | Viable (low funding *may* signal low importance/tractability) |

  ### 4. **Resolving the Double-Counting Charge**
  Your friend’s sharpest rebuttal: **"The third axis isn’t double-counting; it’s *correlationally constrained*."** 
     - Under credit-share, funding levels *correlate* with: 
       - (a) Marginal value (via diminishing returns),
       - (b) Tractability (via revealed preference of other funders).
     - Grantmakers use (a) as a multiplier and (b) as evidence, but these are linked by empirical reality—not logical circularity. If smart funders avoid a cause, it *might* be intractable; if they flood it, marginal value *will* fall. The framework conflates these, but practitioners see them as co-occurring.

  ### 5. **The Real Engine: Credit-Share in Consequentialist Clothing**
  The practice’s coherence relies on **credit-share accounting** masquerading as counterfactual optimization. Why? 
     - **Donor psychology**: Funders want to "own" outcomes (e.g., "We eradicated X"). Pure marginalism offers no credit—your $1M might prevent a cholera outbreak no one notices.
     - **Institutional incentives**: Advisors must justify why a "top cause" changes when funding flows shift. Credit-share explains this; counterfactualism struggles.
     - **Coordination**: Field-building requires seeing other funders as partners, not competitors who "dilute your impact."

  ### Conclusion: The Unstable Core
  The framework presupposes a **consequentialism of reputational credit**—it maximizes "your share of total good" rather than "the good your donation causes." This hybrid works pragmatically but commits to:
  1. **Moral commitments**: Impersonal total utilitarianism + risk neutrality.
  2. **Epistemic vices**: Quantification bias justified by institutional constraints.
  3. **Practical inconsistency**: Using funding levels as both value-killer and importance-signal.

  To salvage rigor, grantmakers must pick one theory: 
  - **Counterfactual path**: Drop credit-sensitive habits (e.g., fund effective programs to saturation; stop field-building). 
  - **Credit-share path**: Explicitly adopt cooperative metrics (e.g., "share of credit for reducing malaria") and drop marginalist pretense.

  Your instinct is correct—the practice’s tension reveals its unspoken allegiance to credit-claiming within a utilitarian facade. The framework is less a heuristic for expected value than a hedged bet on cooperative consequentialism.
