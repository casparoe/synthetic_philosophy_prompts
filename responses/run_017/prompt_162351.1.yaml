prompt: |-
  Hey — I host a fortnightly discussion night in the back room of a pub, mostly coders plus a couple of teachers, about ten people, ninety minutes, nobody with any philosophy training including me. I got into this through blog posts about AI alignment and have been chewing on it by myself for ages, and next week its my turn to run the session on HCH / factored cognition — the humans-consulting-humans recursion thing.

  The angle I actually care about isn't "how do we build a safe AI." It's that Ive started reading the whole setup as a picture of what a *good deliberation* is even trying to be: the thing you fall short of when you answer in thirty seconds something that deserved a week, or when a committee talks for three hours and ends up dumber than any of its members. But I cant tell whether that's a fair reading or just my own hobby-horse, and I don't want to smuggle it in.

  So please don't explain HCH to me — plan how I'd get the room to it.

  - What has to be on the table before the recursion itself makes sense, and why that order. I assume something about why a hard question can be broken into easier ones, and something about why that isn't plain old divide-and-conquer, but I dont know which depends on which.
  - The one concrete question the whole session should hang on. It needs the splitting to genuinely help and the putting-back-together to be where the interest is. I'm guessing it shouldn't be a maths problem (too tidy, everyone just nods) and shouldn't be a moral dilemma (they'll argue about the answer rather than the shape of the thing) — but tell me what else it has to have, and what it must not have.
  - The misconceptions, in the order they'll actually show up, and where in the sequence to head each off. Ones I expect: "so it's just delegation"; "the humans at the bottom are doing the real work, so nothing is gained"; "so this is a superintelligence then"; and someone saying "who decides how it gets split" like that settles it. The ones I'm not expecting are worth more to me.
  - There's one thing I noticed on my own and can't tell if it matters: sometimes splitting a question splits the *question* ("what's the population of X") and sometimes it splits only the *labour* ("you take the left half of the ledger"). Those feel like different moves to me and I suspect the scheme needs both in different places. Where, if anywhere, does that belong?
  - Whether and where to say out loud that this is being used as an idealization of deliberation and not a description of how anybody actually thinks. I'm worried that if I say it too early it sounds like a disclaimer, and too late and they've already taken it as psychology.
  - A check at the end that shows they got the structure and not just the vibe. My idea was to hand them a question where the sub-answers obviously don't compose and see whether they can say what broke without saying "the answer's wrong."
  - What I should flatly refuse to go into in ninety minutes, and say out loud that I'm skipping. I'd have thought the whole imitating-the-process / distilling-it-into-a-model side, but I'd rather you tell me what each omission costs me.
reasoning: |-
  Okay, let me unpack this query carefully. The user hosts a casual discussion group (coders/teachers) and wants to introduce HCH (factored cognition) not primarily as an AI alignment tool but as a model for good deliberation. They need a session plan that avoids common pitfalls and makes the abstract concept tangible.

  First, I need to identify the core challenge: translating a highly technical recursive framework into a relatable deliberation metaphor without losing structural integrity. The user's hidden anxiety about "smuggling in" their interpretation suggests I should build validation into the session design—making the deliberation angle emerge naturally from the group's exploration.

  Key structural considerations:
  - Order of concepts: Must start with concrete problem-solving before introducing recursion. Begin with "why break down hard questions?" then demonstrate how naive division fails, creating the need for HCH's reassembly step.
  - The anchor problem: Needs to be complex enough to require decomposition but not emotionally charged. "Should we ban plastic straws?" works well—it has factual layers (environmental impact data), ethical dimensions (disability access), and implementation angles (alternatives).
  - Misconception sequencing: "Just delegation" will appear first during the initial decomposition exercise. I'll preempt it by having them experience the reassembly struggle. "Bottom humans do real work" comes later—I'll counter by showing how the root question differs fundamentally from subquestions.
  - Question vs labor splitting: This distinction matters most during the recomposition phase. I'll subtly introduce it when discussing how environmental impact subteams might need to coordinate with ethics subteams.
  - Deliberation framing: Should emerge organically after the HCH demo. Position it as "what if we applied this rigor to everyday decisions?" rather than a prescriptive model.

  What to exclude:
  - AI safety origins (distracts from deliberation focus)
  - Computational complexity arguments (too technical)
  - Homogeneous vs. specialized human nodes (beyond scope)

  The checkpoint design is crucial—I'll use a deliberately flawed decomposition (e.g., splitting "design a chair" into disconnected attributes) to test if they spot recomposition failure rather than just bad subanswers.

  Notable risks:
  - Teachers might fixate on classroom applications unless guided to broader deliberation
  - Coders may over-identify with tree recursion and miss the human coordination aspects
  - Must curb "who decides the split?" debates by emphasizing it's a design parameter

  Final structure should feel like a discovery journey: problem → naive breakdown → breakdown fails → HCH structure → deliberation parallels. The plastic straw example allows touching all bases in 90 minutes while leaving room for organic discussion.
answer: |-
  Here's a battle-tested plan for your 90-minute session, designed to make HCH click as a model of *deliberation* while avoiding rabbit holes. Focus is on **structure over implementation**, **deliberation over AI safety**, and **collective discovery over lecture**.

  ### Core Sequence & Why This Order
  *(Total: 60 mins)*

  1.  **"Why is this question hard?"** (10 mins)
      *   **Concrete Anchor:** _"Should our city ban single-use plastic straws?"_ (Deliberately ordinary, requires multiple perspectives, blends facts/values).
      *   **Activity:** Brainstorm *why* it's hard. Prompt: "What makes answering this well difficult? What knowledge, perspectives, or steps are needed?" (Capture answers: e.g., environmental impact data, disability access, business costs, enforcement feasibility, cultural norms, alternatives' lifecycle).
      *   **Why:** Establishes that complex questions are *multifaceted*. Sets the stage for decomposition being necessary, not optional.

  2.  **"Can we just split it up?"** (15 mins)
      *   **Activity:** Divide the group into 3-4 small teams. Assign each *one facet* from the brainstorm (e.g., Team Enviro, Team Disability, Team Business, Team Alternatives). Give them 5 mins to quickly discuss *their piece* and report a snap "answer" (e.g., "Yes, bad for turtles!", "No, essential for some!").
      *   **Result:** Chaos. Conflicting, incomplete answers. The whole feels *less* coherent than the parts.
      *   **Why:** Creates visceral experience of how naive decomposition ("divide-and-conquer") **fails deliberation**. It highlights the missing piece: *recombination and synthesis*. This primes them for needing structure.

  3.  **Introducing the HCH "Machine" (as Deliberation Ideal)** (25 mins)
      *   "Imagine a *way* to answer complex questions designed to avoid those pitfalls. It has two core ideas:"
      *   **Idea 1: Decomposition (The Split)** (10 mins)
          *   "Not just assigning topics, but asking *better sub-questions*. The goal isn't just answers, but answers that *fit together*."
          *   **Key Shift:** Move from facets ("Environment") to **answerable sub-questions** whose outputs are *inputs* for others. Examples:
              *   Bad: "Research environmental impact." (Too vague, output unclear)
              *   Good: "Estimate the % reduction in plastic straw litter entering our city's waterways achievable within 1 year of a ban." (Output: A number/range usable elsewhere).
              *   Good: "List the primary medical conditions requiring flexible plastic straws in our city, and assess the availability/cost of suitable compostable alternatives." (Output: A categorized list & assessment).
          *   **Activity:** Briefly brainstorm 1-2 better sub-questions for their assigned facets.
      *   **Idea 2: Recursive Consultation (The Tree & Recombination)** (15 mins)
          *   "Now, how do these answers combine? Not by committee debate, but by a structured process: A 'Manager' asks a specific question. If it's too big, the Manager *splits it into precise sub-questions*, asks *other humans* (Consultants) to answer *those*. The Manager then *combines those answers* to answer the original question. Crucially, Consultants can *themselves* be Managers for their sub-question if needed."
          *   **Visual:** Sketch a tree. Root: "Ban straws?". Manager splits into Sub-Q1 (Enviro Impact Est.), Sub-Q2 (Access Needs/Alt.), Sub-Q3 (Econ Impact). Manager for Sub-Q1 might split *further* (e.g., "Litter Reduction?", "Wildlife Impact Score?"). Emphasize the Manager's role: **Framing precise sub-Qs + Synthesizing sub-answers.**
          *   **Crucial Point:** "The 'human' at the root isn't smarter. They only do two things: ask well-framed questions and synthesize answers to them. The *intelligence* emerges from the *structure* of decomposition and recomposition." (Head off "bottom humans do real work" here).

  4.  **Running the "Machine" on Straws (Briefly)** (10 mins)
      *   Pick *one* sub-question branch (e.g., Enviro Impact). Ask: "How might a Manager *use* the answer to 'Litter Reduction %' and 'Wildlife Impact Score' to answer 'Net Environmental Benefit Score'?" (e.g., simple formula, weighted sum, threshold check).
      *   **Why:** Shows recombination in action. Illustrates the Manager's synthesis role. Connects back to the initial chaos.

  ### Your Crucial Points & When to Address Them
  *(Integrated into flow)*

  *   **"So it's just delegation?"**: Address during **Step 3 (Idea 1)**. Contrast delegation ("Go research environment") with decomposition ("Answer *this specific, combinable* sub-question"). Delegation often leads to Step 2 chaos; decomposition demands outputs designed as inputs.
  *   **"Bottom humans do the real work"**: Address during **Step 3 (Idea 2)** when describing the Manager's role. "The root Manager isn't passive; their *crucial* work is defining the split and doing the synthesis *using* the sub-answers. The 'real work' is distributed, but the *intelligent answer* emerges from the structure."
  *   **"So this is a superintelligence?"**: Shut down immediately if raised. "No. It's a *model* of how structured deliberation *by ordinary humans* can produce better answers than unstructured debate or naive splitting. It's about *process*, not inherent brainpower."
  *   **"Who decides how to split?"**: Anticipate during **Step 3 (Idea 1)**. "This is a core skill of the 'Manager' role in this model – asking the *right* sub-questions. It's hard! The model assumes someone *can* do this decomposition effectively for the question at hand. Real deliberation needs people good at this framing." (Don't let this derail; it's a feature, not a bug).
  *   **Question Splitting vs. Labour Splitting**: Introduce subtly during **Step 3 (Idea 1)**. When giving examples of "good sub-questions," contrast splitting the *question space* ("Estimate litter reduction %") with splitting *labour within a sub-question* ("You analyze beach survey data, you analyze storm drain data" - both feeding into "litter reduction %"). Say: "HCH focuses first on *question* splitting. Labour splitting happens *within* answering a single sub-question node, but that's a detail. The power comes from the tree of *question decomposition and synthesis*." (Don't dwell; affirm it's a valid distinction but secondary to the core recursion).

  ### Framing the Deliberation Angle
  *   **When to Say It:** Explicitly state it **after Step 4**, when the structure is clear. *"So, why show you this? It's not really about building AI. I find this a fascinating ideal model of what good *deliberation* could look like: breaking down messy problems into answerable parts, ensuring those answers are designed to fit together, and synthesizing them rigorously. It shows why a snap answer often fails (no decomposition) and why a chaotic committee fails (decomposition without structured synthesis). It's a benchmark, not a brain scan."*
  *   **Why Then:** The structure is concrete in their minds. It avoids the "disclaimer" feel. It positions HCH as a *tool for thinking about thinking together*, not psychology or AI.

  ### The Check: Did They Get the Structure? (15 mins)
  *   **Activity:** Present a **deliberately flawed decomposition**.
      *   **Question:** "Should our city build a new public swimming pool?"
      *   **Flawed HCH Tree:**
          *   Root Manager: "Should we build the pool?"
          *   Sub-Q1 (Team A): "What's the best color for the pool tiles?"
          *   Sub-Q2 (Team B): "How many lanes should it have?"
          *   Sub-Q3 (Team C): "What's the average summer temperature?"
          *   Root Manager tries to synthesize: ??? (It's impossible; sub-Qs don't address core feasibility, cost, need, alternatives).
  *   **Ask:** "What's wrong with *how this question was decomposed* for HCH? Why would the Root Manager struggle to synthesize an answer to 'Should we build it?'? Don't just say the answers are useless; focus on the *structure*."
  *   **What You Want:** They should identify that the sub-questions don't actually decompose the *root question's core requirements* (cost, demand, impact, alternatives). They aren't *combinable* to answer "Should we?". The *splitting* failed, making *synthesis* impossible. This proves they grasp the dependency between good decomposition and meaningful recombination.

  ### What to FLATLY REFUSE (And State Why)
  *   **"How would we actually build this as an AI?" / Imitation Distillation:** "We're skipping the *implementation* as AI today. That's a huge topic in alignment. Our focus is on what this model tells us about *human deliberation* itself." (Cost: Loses the core purpose of your session, dives into tech weeds).
  *   **"Doesn't this require superhuman Managers?"**: "The model shows an *ideal*. Real deliberation won't be this perfect, but it gives us goals: better question framing, clearer sub-tasks, conscious synthesis. We can strive for it." (Cost: Gets bogged down in human limitations, misses the aspirational model).
  *   **Deep Dive into Specific Sub-Question Answers:** If they get stuck arguing about straw stats, redirect: "Remember, today we're focused on *how* we structure finding the answer, not the final policy decision itself. Let's keep looking at the process." (Cost: Eats time, loses focus on structure).
  *   **Philosophical Debates about Consciousness/Agency in the Tree:** "That's fascinating, but beyond our scope today. We're treating each 'node' as a human capable of answering their specific sub-question using the process. The model is about information flow and synthesis." (Cost: Abstract tangents, derails concrete understanding).

  ### Why This Works
  *   **Builds Need:** Starts with the pain of bad deliberation (Step 2 chaos).
  *   **Concrete First:** Uses a relatable problem throughout.
  *   **Structure Revealed:** Clearly separates decomposition (Idea 1) and recombination (Idea 2) as the core innovations over naive approaches.
  *   **Deliberation Link Natural:** The framing feels earned after seeing the structure solve their initial frustration.
  *   **Checks Understanding:** The flawed pool example tests if they see *structural failure*, not just bad answers.
  *   **Manages Time/Risk:** Explicit exclusions keep focus tight and avoid known pitfalls.

  Good luck! The fact you're thinking this deeply about the *pedagogy* of HCH as deliberation means your group is in for a great session.
