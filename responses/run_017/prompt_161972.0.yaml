prompt: |-
  ok so I've been sitting on a hiring committee this spring and I've realsied I have no coherent view at all on lying versus misleading, and its bugging me. Here's what I actually do and how I feel about it afterward. I want to know if there's a principle in there.

  1. I wrote a reference letter for a weak internal candidate that is literally true in every sentence — his one decent paper described fairly, plus "punctual" and "well liked" — and I left out that he never finished his dissertation, so the reader will conclude he's strong. I'll do that and sleep fine. I would not write "one of the strongest people I've worked with." My excuse is that everybody knows a letter is written by the candidate's advocate and discounts for it, but I'm not sure that's a moral difference rather than just "everyone expects it."

  2. My neighbor asks did you see who took my parcel, and I say "I didn't take it," which is true — I watched my housemate grab it by mistake. I think that's rotten, basically as bad as lying.

  3. I wear a wedding ring to conferences so nobody hits on me. Not married. Fine, I think — a stranger has no claim on that information and a ring isn't an answer to a question.

  4. I set my Slack to "in a meeting" to dodge a colleague who wants help with something I just don't feel like doing. Weaselly, I feel a bit bad, but not as bad as 2.

  5. My colleague has the internal grant deadline wrong — he thinks Friday, it's Wednesday — and I know, and I say nothing, because if he misses it my proposal moves up. I'm not staying quiet out of laziness; I'm staying quiet because I gain. I think that's bad, worse than 3 and 4, even though I did literally nothing at all.

  6. A stranger at a party takes me for a physician (I'm a pharmacist, long white coat, don't ask), starts describing a symptom and thanks "the doctor" afterward. I don't correct him. Barely registers as wrong with me. So silence is fine in 6 and bad in 5 and I want to know what turns it.

  7. My dad has dementia and asks where my mom is. She died seven months ago; he's asked a hundred times and each time the truth wrecks him. I say "she's resting." I go back and forth on this one every single time.

  8. The one that breaks my principle: our chair says in a meeting "mistakes were made with the budget" when she made them and everyone in the room knows it. I think that is worse than if she'd said flatly "I didn't do it," which would be a plain lie — because the hedge buys her the false impression while keeping deniability, and that feels more contemptible than owning the lie. Same vibe: my lawyer friend says she can't put her client up to testify falsely, but she can phrase questions so his literally true answers mislead the jury — and I think that's no better than the lie.

  The rough principle I've been carrying around: lying is worse because I put my word behind a false claim, I stake whatever authority I have and I'm answerable for it, whereas when I merely mislead I leave the hearer to draw an inference they could in principle resist, so I haven't taken that extra step. But 2, 5 and 8 don't behave that way at all, and 3 and 6 only fit by luck.

  So: is there one principle that gets most of this, or do I need two or three clauses, or is one of my verdicts just wrong? I'd like it stated precisely enough that I can actually apply it, with the case that motivates each clause, and I'd like you to say whether the wrong-making thing lives in what the speaker does or in what happens to the hearer — I suspect that's where I'm confused. Then give me your verdicts on three I haven't settled: (i) a patient asks "is it cancer" the morning after a scan and the doctor says "we'll know more when the biopsy comes back" when she's already about 90% sure it is; (ii) a delivery app shows a restaurant as "very busy, 45 min" to steer me to a different one when it isn't busy; (iii) my friend asks whether I liked her book and I text "so you!!" — true, warm, and I hated it. Be honest about which of my verdicts above your account can't accommodate and which one you'd overturn; I don't want "they're both deception so they're equally wrong" unless you can actually defend it against 1 and 3. Please write it in American English, I'm lifting bits of this for something I'm putting together. No need to name-check the literature — I've read the basic stuff about what you literally say versus what you imply, so use that vocabulary if it helps, but just argue.
reasoning: |-
  Okay, let me tackle this user's ethical puzzle about lying versus misleading. They've presented eight real-life scenarios where they've engaged in deception with varying levels of guilt, and they're struggling to find a consistent moral framework. 

  First, I notice the user is clearly intellectually sophisticated - they're on a hiring committee, reference academic concepts like literal vs implied meaning, and have clearly wrestled with this deeply. The frustration in their tone suggests they want rigor, not platitudes. Their examples span professional, personal and ethical gray areas, which tells me they need a principle that works across life domains.

  The core tension I see is between their initial principle (lying is worse because it stakes your credibility) and their intuitive reactions to scenarios 2, 5 and 8 where misleading feels equally or more wrong. That discrepancy is eating at them. 

  Hmm... what's interesting is how context-dependent their judgments are. In scenario 1 (reference letter) they feel fine exploiting known conventions, while in scenario 2 (parcel) the same "technically true" statement feels rotten. The wedding ring (3) feels permissible as self-protection, but passive deception in scenario 5 (grant deadline) feels predatory. The dementia case (7) shows they recognize some truths can be cruel.

  I think the user's onto something when they mention the hearer's agency - that misleading allows the hearer to "resist the inference." But that breaks down in cases like the grant deadline where the colleague has no reason to suspect deception. Maybe the key is whether the deception exploits a vulnerability or reasonable expectation of honesty.

  For their unsettled cases: The doctor scenario (i) feels most like the dementia case - withholding painful truth temporarily might be kind. The app (ii) is trickier - is it like the Slack status (4) or more predatory? And the book praise (iii) seems harmless social lubrication unless the friend asks follow-ups.

  I'll need to craft a principle that accounts for: 1) power imbalances, 2) legitimate expectations of disclosure, 3) harm prevention vs self-interest. The "answerability" aspect matters too - in lying you actively falsify, while misleading often involves sins of omission. But as they noted in scenario 8, the weaselly evasion can feel worse than blunt lies.

  What's emerging is that deception's wrongness hinges on three dimensions: the speaker's intent (malicious vs protective), the hearer's vulnerability, and whether social norms permit the ambiguity. Their wedding ring example works because conference interactions are low-stakes and no one's owed marital status info. But tricking a colleague about deadlines abuses professional trust.

  For the cases they want analyzed: The doctor should probably disclose the high likelihood since medical decisions hang on it - unlike the dementia case where truth causes pure distress. The app's deception feels commercially manipulative. The book praise? Harmless white lie territory.

  I suspect they'll push back on where I draw lines, so I'll flag where my principle strains: their reference letter (1) might be more ethically shaky than they feel, and the Slack dodge (4) might be less bad than they think. The big tension is whether "everyone does it" makes deception okay - I'd argue not if it harms individuals, even if systems expect it.
answer: |-
  Here's a coherent principle derived from your intuitions, designed to be applied practically, followed by verdicts on your unsettled cases and an honest assessment of where your judgments might need adjustment:

  **The Principle: Deception is wrong when it violates a legitimate expectation of truthfulness *and* exploits the hearer's reasonable reliance on that expectation for a decision, causing harm or unfair advantage. The wrong-making element resides primarily in the *speaker's deliberate action* to undermine this reliance.**

  **Breaking down the clauses with your cases:**

  1.  **Legitimate Expectation of Truthfulness:** Does the context create a reasonable expectation that you will provide accurate, relevant information?
      *   *Violated:* In your neighbor's query (2), a direct question about a witnessed event creates a strong expectation of truthful disclosure. Your colleague relying on shared deadlines (5) has a legitimate expectation you won't silently exploit his error. The chair's statement (8) occurs in a context demanding accountability for errors, creating an expectation of truthful ownership.
      *   *Not Violated:* A stranger at a party (6) has no reasonable expectation that you correct their mistaken assumption about your profession. A conference attendee (3) has no legitimate claim to know your marital status; the ring isn't an assertion but a signal interpreted within loose social norms. Slack status (4) signals availability, not absolute truthfulness; minor manipulations here are often expected. Grant reference letters (1) operate within a *known* system of advocacy and selective disclosure; the expectation of full candor is significantly lowered (though not absent).
      *   *Ambiguous/Diminished:* Your dad's question (7) exists within a context of caregiving where the expectation shifts from factual accuracy to preventing distress. The expectation of literal truth is weakened by the overriding need for compassion.

  2.  **Reasonable Reliance & Exploitation:** Does the hearer reasonably rely on your communication (or silence) for a decision? Does your deception deliberately exploit that reliance to gain an advantage or cause harm?
      *   *Exploited:* Your neighbor (2) relies on your answer to identify a thief. Your colleague (5) relies on the shared understanding of the deadline to submit his work. The chair (8) exploits the expectation of honesty to avoid accountability while creating a false impression. The jury (8) relies on the lawyer's questions and the witness's answers for a verdict; the misleading phrasing exploits that reliance.
      *   *Not Exploited/No Harmful Reliance:* The stranger (6) makes a casual, incorrect assumption; correcting it isn't critical to any decision they need to make. The conference attendee (3) *might* rely on the ring to decide not to flirt, but this is low-stakes social navigation, not a critical decision harmed by your signal. The Slack colleague (4) relies on your status, but minor task avoidance is a common, low-harm friction. The letter reader (1) *knows* the context involves advocacy; they rely on the *system* of discounting, not on your absolute candor. Your dad (7) relies on your answer for emotional comfort, not factual accuracy relevant to a decision.
      *   *Beneficial Reliance:* In (7), your dad relies on your answer for comfort, and misleading fulfills that need positively.

  3.  **Harm/Unfair Advantage:** Does the deception cause harm or confer an unfair advantage?
      *   *Harm/Advantage:* Your neighbor (2) is frustrated and unable to locate their parcel. Your colleague (5) misses the deadline, suffering a professional setback while you gain an advantage. The chair (8) avoids deserved blame, harming accountability. The jury (8) risks an incorrect verdict.
      *   *Minimal/No Harm/No Significant Advantage:* The stranger (6), conference attendee (3), Slack colleague (4) suffer minimal or no harm. The letter reader (1) might hire a weaker candidate, but this is a known risk of the system. Your dad (7) is spared distress.

  **Why your initial principle (staking authority) breaks down:**

  *   **Cases 2 & 5:** You didn't "stake your word" explicitly, but you violated a *stronger* expectation of helpful honesty in a direct interaction (2) or exploited reliance through silence for gain (5). The harm/unfairness matters more than the form.
  *   **Case 8:** The hedge *is* contemptible precisely *because* it exploits the expectation of truthfulness *while* avoiding the accountability that comes with staking a direct false claim. It maximizes deception while minimizing answerability.

  **Verdicts on Your Unsettled Cases:**

  1.  **Doctor & "Is it cancer?":** **Bad.** Legitimate expectation of truthfulness is very high (patient making critical health decisions). Patient reasonably relies on the doctor's answer for immediate understanding and emotional preparation. The doctor exploits that reliance by implying uncertainty ("we'll know more") that doesn't reflect her actual high certainty, denying the patient crucial information for their immediate state of mind and preliminary decisions. Harm is significant emotional distress and delayed processing. (Contrast with your dad (7): expectation of literal truth is diminished by dementia; reliance is for comfort, not decision-making; harm comes from truth, not deception).
  2.  **Delivery App "Very Busy":** **Bad (Weaselly).** Context: A customer making a purchasing decision relies on the app's status indicators for accuracy. There's a legitimate expectation that "very busy, 45 min" reflects actual conditions, not a manipulative nudge. The app exploits that reliance to steer behavior for the *app's* benefit (optimizing delivery flow), not the customer's. It causes harm by potentially delaying the customer's order unnecessarily and undermining trust in the platform. (Similar to your Slack status (4) but amplified: higher reliance for a purchasing decision, clear commercial gain for the deceiver).
  3.  **"So you!!" about hated book:** **Fine (or Minimally Weaselly).** Context: A friend seeking validation/social connection. Legitimate expectation: Some degree of kindness and encouragement is often expected over brutal honesty in close relationships for minor matters like personal taste. Reliance: They rely on your response for social affirmation, not a critical decision. Exploitation/Harm: The deception is minor ("So you!!" is vague praise), intended to affirm the *friend* ("you" being enthusiastic/quirky/etc.) rather than purely deceive about the book. Harm is minimal (they remain unaware you disliked it) vs. the potential harm of blunt honesty damaging the relationship over something trivial. (Fits with the low-stakes, relationship-affirming nature of accepted "white lies," distinct from lying about significant facts).

  **Where Your Verdicts Might Need Overturning (Based on this Principle):**

  1.  **Case 1 (Reference Letter):** Your principle accommodates your "sleep fine" verdict *only* because the **legitimate expectation of truthfulness is significantly lowered** by the known context of advocacy. However, this principle suggests it's **more ethically shaky than you feel**. If the letter reader *genuinely* concludes the candidate is strong based on your selective truths, and hires them over a genuinely stronger candidate, your deception *did* exploit their necessary reliance on the letter within the hiring *system*, causing harm (a worse hire) and giving an unfair advantage to the weak candidate. "Everyone does it/discounts for it" doesn't erase the harm if the discounting fails. Your verdict relies heavily on systemic norms excusing the behavior, but the core deception and potential harm remain.
  2.  **Case 4 (Slack Status):** Your principle ("weaselly, a bit bad") fits. This principle suggests it's **slightly less bad than you feel** because the expectation of absolute status accuracy is lower, the reliance is for minor task coordination, and the harm/advantage is minimal (minor inconvenience vs. minor task avoidance). It's still mildly deceptive and potentially weaselly, but low-stakes.

  **Honest Accommodation Challenges:**

  *   **Case 3 (Wedding Ring):** Fits perfectly: No legitimate expectation of marital status disclosure, no reliance for a critical decision, no harm caused.
  *   **Case 6 (Not correcting "Doctor"):** Fits perfectly: No legitimate expectation of correction for a casual assumption, no reliance for a decision, no harm.
  *   **Case 7 (Dementia):** Fits: Legitimate expectation of literal truth is overridden by the context of caregiving; reliance is for comfort; deception prevents harm.
  *   **Case 8 (Chair/Lawyer):** Fits: Highlights how deliberate misleading that exploits expectation while avoiding direct falsehoods can be *worse* than a plain lie due to its manipulative, accountability-dodging nature.
  *   **Case 2 (Parcel):** Fits: Clear violation of expectation, reliance exploited, harm caused.
  *   **Case 5 (Deadline):** Fits: Exploitation of reliance through silence for gain, causing harm.

  **Conclusion:** The core wrongness isn't *solely* in staking your word on a falsehood, but in **deliberately exploiting someone's reasonable reliance on your honesty within a specific context to gain an advantage or cause them harm.** This explains why misleading can sometimes be *worse* than a lie (Case 8), why silence can be bad (Case 5) or fine (Case 6), and why technically true statements can be rotten (Case 2). It prioritizes the speaker's deliberate action to undermine trust and exploit reliance, while recognizing that context dramatically shapes expectations.
