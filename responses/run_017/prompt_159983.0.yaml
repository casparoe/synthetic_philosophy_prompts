  ### Decision Tree for Political Ethics: The Problem of Dirty Hands

  **Start:** You have read **Case A** (head of government authorizes coercive interrogation to prevent mass deaths, keeps it secret, denies it) and concluded: *"There was nothing else she could have done."*

  1. **Node 1 (Q1):** In **Case A**, is it possible to say the head of government both *did what she ought to have done* and *committed a grave moral wrong*?  
     - **Yes** (real conflict possible) → Node 2  
     - **No** (conflict must be dissolved) → Node 3  

  2. **Node 2 (Q2):** In **Case A**, is the requirement to prevent thousands of deaths one that *any moral agent* in her position would have, or does it arise *solely from holding office*?  
     - **Moral agent** → Node 4  
     - **Solely from office** → Node 5  

  3. **Node 3 (Q3):** In **Case A**, if the head of government had *not* authorized the interrogation, would she have been morally at fault for the resulting deaths?  
     - **Yes** → Node 6  
     - **No** → Node 7  

  4. **Node 4 (Q4):** In **Case E** (same as A, but motivation is saving her administration), does the agent’s primary reason make this action fundamentally different from **Case A**?  
     - **Yes** → Leaf 1  
     - **No** → Node 8  

  5. **Node 5 (Q5):** In **Case C** (committee vote causes drownings), does the moral responsibility for the drownings lie with *the committee members as individuals* or *the office they hold*?  
     - **Individuals** → Leaf 2  
     - **Office** → Leaf 3  

  6. **Node 6 (Q6):** In **Case A**, is the justification for authorizing interrogation *entirely dependent* on its consequences, or is there a justification *independent of consequences*?  
     - **Dependent on consequences** → Leaf 4  
     - **Independent of consequences** → Leaf 5  

  7. **Node 7 (Q7):** In **Case A**, could the head of government have avoided moral wrong by *resigning* and letting a successor handle the situation (even if the successor would do the same)?  
     - **Yes** → Leaf 6  
     - **No** → Node 9  

  8. **Node 8 (Q8):** In **Case D** (openly legislated rights violation), does the fact that the government acted *publicly and without concealment* mean this *cannot* be a case like **Case A**?  
     - **Yes** → Leaf 7  
     - **No** → Leaf 8  

  9. **Node 9 (Q9):** In **Case B** (civil servant signs harmful scheme; deputy would worsen it), could the civil servant have avoided moral wrong by *refusing to sign* (even though the deputy would cause more harm)?  
     - **Yes** → Leaf 9  
     - **No** → Leaf 10  

  ---

  ### Leaves (Positions)  
  **Leaf 1:** *Unnamed*  
  - **Awkward commitment:** The same act can shift from "necessary wrong" to "corruption" based solely on the agent’s private reasons (e.g., Case A vs. Case E).  

  **Leaf 2:** *Unnamed*  
  - **Awkward commitment:** Official actions are indistinguishable from personal moral acts; delegation or committee voting cannot diffuse individual blame (e.g., each committee member in Case C is fully culpable).  

  **Leaf 3:** **Position: Institutional Wrongness**  
  - **Awkward commitment:** An office-holder can perform a gravely wrong act in their official capacity without being personally morally blameworthy (e.g., wrongness in Case C attaches to the office, not the person).  

  **Leaf 4:** **Monist Consequentialist**  
  - **Awkward commitment:** If coercive interrogation in Case A had *failed* to prevent the attack, it would be straightforwardly wrong (no conflict).  

  **Leaf 5:** **Position: Redescription**  
  - **Awkward commitment:** Torture, when necessary, is not a rights violation but a duty (e.g., Case A’s act is not "wrong" under the true description "saving lives").  

  **Leaf 6:** **Absolutist**  
  - **Awkward commitment:** Resigning to avoid wrongdoing is required even if it leads to identical or worse outcomes (e.g., Case A’s head should resign and let thousands die).  

  **Leaf 7:** **Position: Necessity of Concealment**  
  - **Awkward commitment:** Openly defended acts (like Case D) cannot qualify as dirty hands, even if they involve moral violations (e.g., only secret acts like Case A count).  

  **Leaf 8:** **Position: Unresolved Conflict**  
  - **Awkward commitment:** There is no moral resolution to the conflict; what matters is what the agent can live with or remain faithful to (e.g., guilt in Case A is inevitable but irrelevant to justification).  

  **Leaf 9:** *Unnamed*  
  - **Awkward commitment:** Resignation is obligatory to avoid personal moral taint, even if it results in greater harm (e.g., Case B’s civil servant must resign, allowing a worse outcome).  

  **Leaf 10:** **Position: Distinct Morality of State Necessity**  
  - **Awkward commitment:** The state’s survival requires office-holders to do what is *personally* morally wrong (e.g., Case B’s civil servant must sign precisely because refusal worsens outcomes).  

  ---

  ### Empty Combination  
  - **Combination:** Real conflict (Node 1: Yes) + Requirement from office (Node 2: Office) + Wrongness attaches to office (Node 5: Office → Leaf 3) + *Resignation defeats necessity* (Node 9: Yes) + *Concealment unnecessary* (Node 8: No) + *Reasons irrelevant* (Node 4: No).  
  - **Status:** **Unexplored** (coherent but unoccupied). It holds that office-holders can openly commit necessary wrongs (no concealment) for any reason, yet avoid blame by resigning—even if replacement causes disaster. The tension between resignation-as-escape and necessity is underexamined.  

  ### Indistinguishable Leaves  
  - **Leaves 6 and 9** (both endorse resignation to avoid wrongdoing).  
  - **Separating question:** "In Case B, does refusing to sign *eliminate the civil servant’s moral responsibility* for harms caused by the deputy’s widened scheme?"  
    - Yes → Leaf 9 (resignation fully absolves responsibility).  
    - No → Leaf 6 (resignation avoids *commission* but not *complicity* in harm).  

  ### Load-Bearing Distinctions  
  The distinctions at **Node 1 (conflict reality)** and **Node 2 (conflict source)** are maximally load-bearing. Flipping a "Yes" to "No" at Node 1 shifts the student from positions accepting genuine moral dilemmas (e.g., Leaf 8) to those dissolving conflict (e.g., Leaf 4/5). Flipping "Moral agent" to "Office" at Node 2 moves them from individualized (e.g., Leaf 1) to institutional (e.g., Leaf 3) conceptions of duty. This suggests the core disagreement lies in whether politics generates *unique moral conflicts* (e.g., state necessity vs. ordinary ethics) or merely intensifies universal ones.
