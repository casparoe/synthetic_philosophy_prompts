prompt: |-
  Working on a short piece about everyday conventions — tipping, queueing, jaywalking — and about whether a visitor has to play by the local version. I want to compare two accounts of where that obligation comes from, and I want the comparison at the level of the mechanism, not just the verdict.

  Call the first one scheme-membership: a queue or a tipping practice is a local distributive scheme; you enter it by joining the line or sitting down at the table; and you thereby owe your assigned share — your turn in line, the 15 percent — to the other participants. On this account the obligation tracks participation rather than the merits of the convention, so it looks like it survives even when you think the convention is silly.

  Call the second expectation-dependence: what you owe is settled by what the people around you can reasonably count on you doing, so the obligation can fade out when nobody is relying on you, and can be undercut when the expectations themselves are objectionable.

  Two wrinkles I want the comparison to earn it's keep on. First, the transient asymmetry: a visitor can always leave, and while she's there she dosen't have to live with the convention's long run effects — she doesn't get a say in how it evolves and won't be the one stuck with it. Does either account make her less bound than a resident, or more bound, and is whichever it is a feature or a bug? Second, a fork I can't get past: a lot of these conventions aren't neutral coordination devices but mildly extractive ones — the tip is really a wage subsidy — so complying marginally sustains an arrangement you think is bad, while defecting on your own just takes money off one particular server and changes nothing about the arrangement. Say which account handles that structure better and what exactly stops the other one from handling it.

  Also: where do the two actually come apart in verdict, not just in style? If they mostly converge, say so and tell me which one is doing the real explanatory work. And there's a signalling bit that seems to fit neither — the same non-compliance reads as protest coming from a resident and as contempt coming from a visitor — tell me whether that's a third consideration both accounts have to make room for, or something one of them should absorb and the other can safely ignore.
reasoning: |-
  Hmm, this user is writing a piece on social conventions and wants to compare two philosophical frameworks for understanding our obligations to follow them. They've coined two terms: "scheme-membership" (obligation arises from participation) and "expectation-dependence" (obligation arises from reasonable reliance). 

  The user has clearly thought deeply about this - notice how they preemptively address potential weaknesses in both frameworks with those two "wrinkles." The transient asymmetry question shows they're considering power dynamics in social norms, while the "extractive conventions" point reveals their concern about systemic injustice. This isn't just academic; there's underlying ethical tension here about complicity.

  Interesting how they dismiss superficial verdict comparisons to focus on mechanisms. That "earn its keep" phrasing suggests they want the frameworks battle-tested against hard cases. The signalling question at the end is particularly sharp - it exposes how context changes the meaning of noncompliance, which neither theory fully captures.

  For the transient asymmetry: scheme-membership actually binds visitors more tightly (you opted in by sitting down!) while expectation-dependence loosens their obligations (who relies on a tourist?). The extractive conventions dilemma is where expectation-dependence shines - it lets you reject harmful systems without harming individuals, while scheme-membership traps you in complicity.

  Ah, and that signalling point... it's actually a third layer about social meaning. Neither theory accounts for it well because both focus on obligation sources rather than interpretation of actions. Might need to flag that as a limitation.

  The user's wrestling with something fundamental here: when are we morally required to participate in flawed social systems? Their examples reveal this tension - tipping as wage theft vs queueing as harmless coordination. Smart of them to test the theories against both types.
answer: |-
  Here's a breakdown comparing "scheme-membership" and "expectation-dependence" as sources of obligation in local conventions, addressing your wrinkles, forks, and signalling concerns:

  **Core Mechanisms:**
  - **Scheme-Membership:** Obligation arises from *voluntary participation* in a structured distributive system (e.g., sitting at a table = entering the "tipping pact"). The duty is owed *to other participants* for system integrity. Morality is internal to the scheme; its perceived "silliness" doesn't invalidate the obligation.
  - **Expectation-Dependence:** Obligation arises from *reasonable reliance* others place on you due to the convention. The duty is to avoid *harming* those who rely on you. If expectations are unreasonable (e.g., exploitative) or reliance is absent, the obligation dissolves.

  **Earning Its Keep: Your Wrinkles**

  1.  **Transient Asymmetry (Visitor vs. Resident):**
      *   **Scheme-Membership:** *Binds visitors more tightly.* By joining the scheme (sitting down, joining the queue), the visitor assumes the same obligations as a resident. Their transience is irrelevant; they signed the local "contract." *Feature?* Ensures scheme stability. *Bug?* Ignores power imbalance and lack of voice.
      *   **Expectation-Dependence:** *Binds visitors less tightly.* Locals likely have lower reasonable reliance on a transient visitor (they know visitors leave, misunderstand, etc.). The visitor also relies less on the *long-term* stability of the convention. *Feature?* Sensitive to context and reciprocity. *Bug?* Potentially enables free-riding if expectations adjust too easily.
      *   **Comparison:** They pull in opposite directions. Scheme-membership emphasizes formal participation, making transience irrelevant. Expectation-dependence emphasizes actual reliance, making transience highly relevant.

  2.  **Extractive Conventions Fork (e.g., Tipping as Wage Subsidy):**
      *   **The Dilemma:** Complying props up a bad system; defecting only hurts an individual without changing the system. What to do?
      *   **Scheme-Membership:** *Struggles.* If you joined the scheme (sat down), you owe the tip to the server *as a participant*. Refusing stiffs the server without addressing the systemic flaw. The scheme's merits are largely irrelevant to the duty incurred by joining. It struggles to justify *individual* defection as protest.
      *   **Expectation-Dependence:** *Handles better.* Your obligation depends on reasonable reliance *and* the reasonableness of the expectations themselves. If the convention is exploitative (server wages unfairly shifted to customers), the expectation *on you* to subsidize it may be *unreasonable*. You might still tip to avoid harming *this specific server* (who reasonably relied), but the framework allows protest (e.g., lobbying for wage reform) without inherent contradiction. It distinguishes between reliance on *you* and sustaining the *system*.
      *   **Why Scheme-Membership Falters:** Its core mechanism is participation = obligation to co-participants *within the scheme's rules*. It lacks the external moral lens to easily condemn the scheme *as a whole* or justify withholding participation *from within* as a means of protest against the *structure*. The duty is atomized to the current participants. Expectation-dependence builds in the reasonableness of the reliance/expectation, providing a potential off-ramp.

  **Verdict Divergence & Explanatory Power:**

  *   **Convergence:** They often converge on "comply" in benign, well-functioning conventions (e.g., orderly queueing where everyone benefits equally and relies reasonably).
  *   **Divergence:** Verdicts split sharply on:
      *   **Objectionable Conventions:** Scheme-membership says "comply anyway" (duty from participation). Expectation-dependence says "obligation may be void" (if expectations unreasonable).
      *   **Transient Actors:** Scheme-membership says "visitor = full obligation". Expectation-dependence says "visitor obligation likely reduced" (lower reliance).
      *   **Harmless Non-Compliance:** If no one sees or relies on you jaywalking on an empty street, scheme-membership *might* still see an abstract duty to the scheme, while expectation-dependence clearly says "no obligation" (no reliance).
  *   **Explanatory Work:** **Expectation-dependence does the heavier lifting.** It better explains:
      *   Why obligations fade when reliance is absent (empty street jaywalking).
      *   Why we feel less bound as transients.
      *   How we can justify non-compliance with harmful systems without automatically wronging specific individuals.
      *   Scheme-membership often *presumes* background reasonable expectations to feel intuitive. Its "participation = obligation" feels strongest when participation *induces* reasonable reliance (e.g., taking a table makes the server work for you).

  **The Signalling Problem (Protest vs. Contempt):**

  *   **The Issue:** Identical non-compliance (not tipping) can signal righteous protest (local) or arrogant contempt (visitor). Neither theory directly addresses this *interpretive/social meaning* layer.
  *   **Analysis:**
      *   **Not a Third Independent Source:** It doesn't create a new *source* of obligation. The *source* remains scheme-participation or reliance.
      *   **Context for Expectation-Dependence:** Expectation-dependence can *absorb* this best. "Reasonable reliance" inherently includes understanding *social context*. Locals reasonably rely *and* interpret actions within the shared context of the convention's evolution and local struggles. Visitors exist outside this context. A local's non-compliance *signals* familiarity and thus deliberate protest against the *system* they're part of. A visitor's signals unfamiliarity, disrespect for *local norms* themselves, or indifference to local struggles. The difference in *reasonable interpretation* of the act flows naturally from the context that shapes the expectations and reliance in the first place. The *harm* of non-compliance includes the *social meaning* misinterpretation causes.
      *   **Scheme-Membership's Challenge:** It struggles here. Its focus is on the duty within the scheme, not the external meaning of breaching it. The difference between protest and contempt lies *outside* the scheme-membership logic, requiring an add-on about interpretive context. It doesn't easily explain why the *same* breach carries different meanings based on actor identity.

  **Conclusion:**

  *   **Scheme-Membership** offers a strong, rule-based obligation based on voluntary entry into a cooperative structure, but it's rigid. It struggles with objectionable schemes, transience, and signalling nuances, potentially demanding complicity.
  *   **Expectation-Dependence** offers a more flexible, context-sensitive obligation grounded in avoiding harm caused by frustrating reasonable reliance. It handles transience, objectionable conventions, and the signalling issue more adeptly by incorporating reasonableness and social context into the core mechanism. It better reflects the dynamic and sometimes problematic reality of social conventions.
  *   **Real Explanatory Work:** While they converge in straightforward cases, **expectation-dependence provides the more powerful and comprehensive explanation**, particularly for the complex, asymmetric, and potentially exploitative scenarios you highlight. It captures the social reality where obligations aren't just about joining a club, but about the tangible and reasonable expectations we create in each other through shared practices. Scheme-membership often *works* because it creates expectations, but expectation-dependence explains *why* it works and when it shouldn't.
