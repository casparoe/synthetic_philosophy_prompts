  - If the user's idea of "noise in the detector" is challenged by the fact that the logical induction framework might allow for randomized algorithms (introducing actual stochastic noise), then we would reconsider that analogy.
  - If we learned that there are known rates of convergence for logical induction (which we don't think there are), then we would have to adjust the residue report about the limit statement.

