  ## Internal Document: Penaeus Reliability Farms  
  **Platform Team SLA for Tier-2 Decapod Welfare Assurance**  
  **Version 1.3 // CONFIDENTIAL: DO NOT CIRCULATE EXTERNALLY**  

  ---

  ### 1. Introduction & Scope  
  **1.1 Purpose**  
  This document defines Service Level Objectives (SLOs) and operational procedures for maintaining compliance with Global Decapod Welfare Standard (GDWS) Tier-2 Certification at Penaeus Reliability Farms. The Platform Team is responsible for continuous monitoring, incident response, and metric optimization of all welfare-affecting systems.  

  **1.2 Scientific Context**  
  *Note: GDWS Tier-2 assumes *Litopenaeus vannamei* (Pacific Whiteleg Shrimp) possess capacity for negative experience. Current neurology research is inconclusive (see [Internal Wiki: Sentience Literature Review]). Until further peer-reviewed consensus, GDWS proxies remain binding.*  

  **1.3 Ownership**  
  - **Primary On-Call**: Rotates weekly (see PagerDuty schedule)  
  - **Escalation Path**: Platform Lead → Farm Ops Director → External Auditor (AEI-Cert #8824)  

  ---

  ### 2. Definitions  
  **2.1 Key Terms**  
  - **Welfare**: Composite score derived from real-time telemetry of:  
    - Dissolved Oxygen (ppm)  
    - Total Ammonia Nitrogen (mg/L)  
    - Stocking Density (shrimp/m³)  
    - Handling Latency (seconds)  
    - Eyestalk Ablation Rate (%)  
  *Note: Welfare ≠ subjective experience. See 1.2.*  

  - **Shrimp-Hour (SH)**: Standard unit for error budget calculation. 1 SH = 1 shrimp under GDWS-noncompliant conditions for 1 hour.  

  - **Acceptable Day**: 24hr period where cohort meets all SLOs in Section 3.  

  **2.2 Measurement Tools**  
  - **Sensor Array**: Dissolved O₂/TAN/pH probes (CaliperMetrics™ CM-7X)  
  - **Density Estimator**: Overhead CV cameras + ML model `shrimp-counter-v3.1`  
  - **Ablation Tracker**: Hatchery RFID logs (precision: ±2.3%)  

  ---

  ### 3. Service Level Objectives (SLOs)  
  **Target: 99.4% of cohort-days are "Acceptable Days" (rolling 30d avg).**  
  *Error Budget: 2,200 SH/month*  

  **3.1 Environmental SLOs**  
  - **DO Saturation**: p95 ≥ 4.2ppm (5min granularity)  
  - **Ammonia (TAN)**: p99 < 0.5mg/L (15min granularity)  
  - **Density Alert**: > 85 shrimp/m³ sustained > 2hr (auto-triggers harvest)  

  **3.2 Handling SLOs**  
  - **Time-to-Ice**: p95 ≤ 8min 30sec (harvest → immersion chilling)  
  - **Ablation Duration**: p50 ≤ 3.2sec, p95 ≤ 9.1sec (per GDWS §4.8)  
  - **Stun Effectiveness**: 100% of batches receive 12V ±0.3V for 500ms pre-chill  

  ---

  ### 4. Monitoring & Alerting  
  **4.1 Dashboard (Grafana: /d/prf-welfare)**  
  - Primary Widgets:  
    - Real-time Welfare Score (weighted avg of SLO metrics)  
    - SH Burn Rate (vs. monthly budget)  
    - Cohort Acceptable Day % (30d trend)  
  - **Critical Alerts (PagerDuty: SEV-1):**  
    - DO < 3.8ppm for > 15min  
    - TAN > 0.8mg/L for > 30min  
    - Ablation tool offline > 1hr  

  **4.2 Known Measurement Gaps**  
  - Suffering Detection: No sensor exists for pain/aversive states. Visual indicators (e.g., erratic swimming) are non-quantifiable. If observed:  
    1. Log timestamp + tank ID in `#welfare-anomalies` Slack channel  
    2. Verify sensor calibration  
    3. *Do not page unless correlated with SLO breach*  

  ---

  ### 5. Incident Response  
  **5.1 SLO Breach Procedure**  
  1. Declare Incident if:  
     - Welfare Score < 0.85 for > 1hr  
     - SH burn rate exceeds 5-min velocity threshold  
  2. On-call engineers:  
     - Execute mitigation runbook (`/runbooks/prf-slo-recovery`)  
     - Annotate incident timeline (Rootly)  
  3. Postmortem required if:  
     - > 500 SH consumed in 24hr  
     - Acceptable Day % drops below 98%  

  **5.2 Handling "Anomalous Suffering" Reports**  
  - If farm staff reports "distressed shrimp" (e.g., lethargy, avoidance):  
    1. Create Jira ticket: `WELFARE-OBS-{date}`  
    2. Attach environmental telemetry for affected tank  
    3. Tag Farm Ops for visual inspection  
    4. *No automated remediation available*  
    5. Close ticket once:  
       - Telemetry shows SLO compliance, OR  
       - Farm Ops confirms anomaly resolution via non-quantifiable means  

  ---

  ### 6. Optimization Wins (Case Study)  
  **Incident PRF-2024-014**  
  - **Summary**: p95 Ablation Duration exceeded SLO (12.4sec) due to RFID sync latency.  
  - **Action**: Replaced hatchery WiFi with redundant fiber uplinks; optimized ablation tool firmware.  
  - **Result**: p95 Duration reduced to **8.9sec** (-28.2%). SLO compliance restored.  
  - **Impact**: 1,200 SH/month reclaimed for error budget.  

  ---

  ### 7. Compliance & Audits  
  **7.1 GDWS Certification Requirements**  
  - Quarterly submission: 30d Welfare Score dataset + SH burn logs  
  - AEI auditors require:  
    - Raw telemetry for 5% random tanks (full retention: 13mo)  
    - Proof of ablation/stun SLO enforcement (device logs)  

  **7.2 Platform Team Commitments**  
  - Data pipeline uptime: 99.95% (SLO compliance dependent)  
  - Audit packet generation: < 4hr MTTR upon request  

  ---

  ### Appendix A: Ethical Constraints & Known Issues  
  - **A.1 Proxy Limitations**:  
    Current SLOs do not measure internal states. Eyestalk ablation (Metric 3.2.2) reduces ovarian development time by 32-41% (per GDWS research), improving throughput. Optimization of ablation latency is prioritized despite unresolved ethical debates.  
  - **A.2 Sensor Coverage**:  
    No telemetry exists for:  
    - Social interactions  
    - Chronic stress biomarkers  
    - Nociception (pain reception)  
    Mitigation: SLOs based solely on GDWS Tier-2 accepted proxies.  
  - **A.3 Scientific Uncertainty**:  
    Platform Team acknowledges active dispute regarding decapod sentience. Until GDWS or peer-reviewed consensus updates requirements, all systems will optimize for current proxy definitions.  

  ---  
  **Document Approvers**:  
  Platform Lead: █████ █████ | Farm Ops Dir: ████ ███████  
  **Next Review Date**: 2024-10-01 (or after GDWS Tier-3 publication)  

  ---

  ### Design Notes for Your Team  
  1. **The Unspoken Tragedy**: Welfare is defined exclusively by measurable tech proxies (Section 2.1). The doc never admits this is reductive—it just *is*.  
  2. **Counterproductive Win**: The ablation latency "win" (Section 6) optimizes a practice that likely causes harm, because the metric exists. No ethical hand-wringing—just efficiency gains.  
  3. **The Suffering Runbook**: Section 5.2 is key. Staff see suffering? File a ticket. No sensors? No action. It quietly screams the core problem.  
  4. **Scientific Limbo**: Sections 1.2 and A.3 state the uncertainty plainly but never resolve it. The SLA must proceed with available data.  
  5. **SRE Vernacular**: Percentiles for ablation duration, SH error budgets, "MTTR" for audit reports—this is how engineers cope with irreducible ambiguity.  

  A shrimp welfare expert would recognize every dilemma here: the earnest struggle to operationalize ethics with inadequate tools. The humor isn’t in mocking the goal—it’s in watching brilliant engineers apply Kubernetes-era logic to creatures that might not even be sentient. The pain is real.
