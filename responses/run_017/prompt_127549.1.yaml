prompt: |-
  My friend and I spent most of last night arguing about the work-conditionality regime attached to means-tested unemployment benefits, and neither of us could say what it actually commits anyone to believing. So let me describe the practice and ask you to reconstruct its theory.

  As I understand it: to keep the benefit, a claimant must log a fixed number of job-search activities each week and must accept any job the agency counts as suitable; in a number of systems the suitability bar falls the longer someone has been claiming, so obligations tighten as the odds of finding work lengthen. Compliance is measured by the activity logged, not by whether any application could realistically have succeeded. A claimant can also be required to work unpaid for several weeks at a placement, often for a private employer who keeps the output. That placement counts as work when it comes to what the claimant owes, but not when it comes to the minimum wage, employment rights, or a pay slip. Non-compliance is met by suspending payment for a fixed period, in some systems with only discretionary hardship relief. Meanwhile the same state attaches none of this to pensions, child benefits, or mortgage-interest relief, and nothing at all to a person of independent means who has never worked. My friend says the whole thing is desert-talk about the undeserving poor written into administrative rules; I say a state that blamed nobody could rationally run something very similar, for screening and for incentives.

  Three things, please. First, reconstruct the implicit view of where the obligation comes from: receipt of collectively funded transfers, the fact of being able to work and not working, or the need to sort the genuinely jobless from the work-shy under imperfect information. Second, say which commitments are strictly presupposed and which are merely comfortable with the practice: could a purely incentive- or screening-based justification with no claim about desert generate the same rules, does exempting pensioners and the idle rich show that reciprocity is not really what is doing the work, and is it coherent to treat one and the same placement as work when it grounds a duty and as not-work when a wage is at stake? Third, tell me what would have to change in the practice if each rival view you identify were substituted for the one it actually rests on.

  I do not want reading lists, citations, or surveys of the literature; I want the argument. Close with a single last line in the form \answer{...}, containing a phrase of no more than ten words naming the one commitment the practice cannot give up.
reasoning: |-
  Hmm, the user presents a complex policy analysis challenge about unemployment benefits conditionality. They've described a detailed system where claimants must actively seek work, accept "suitable" jobs with lowering standards over time, participate in unpaid placements, and face sanctions for non-compliance - all while noting exemptions for pensioners and the wealthy. Their core request is to dissect the philosophical underpinnings of this system.

  The user specifically wants three things: first, to reconstruct the implicit obligation theory (is it about reciprocity? ability-to-work? screening?); second, to analyze which commitments are essential versus compatible but not necessary; third, to show how the system would change under different theoretical bases. They emphasize wanting pure argumentation without academic references, and demand a final ten-word answer identifying the indispensable commitment.

  The description reveals fascinating tensions. The unpaid placements being simultaneously classified as "work" for obligation purposes but "not-work" for wage/rights purposes seems philosophically inconsistent. The exemption of non-working wealthy individuals undermines pure reciprocity arguments. The focus on activity logs rather than actual job prospects suggests either a screening function or performative compliance requirement.

  For the first part, I'll outline three possible obligation foundations: 1) Reciprocity/desert (benefits as quid pro quo), 2) Capacity-based duty (ability-to-work creates obligation), 3) Screening mechanism (separating truly unemployed from shirkers). Each implies different rationales for the tightening suitability criteria and sanctions.

  For the second part, I'll test which elements survive under incentive/screening justifications alone. The exemption of pensioners might fit all theories (due to perceived incapacity), but the idle rich exemption fatally wounds reciprocity arguments. The work/not-work paradox is indefensible under all frameworks except perhaps crude administrative convenience.

  For the third part, I'll map theoretical substitutions to practical changes. If based solely on screening, we'd see more randomized demands rather than escalating obligations. If pure reciprocity, wealthy non-workers would face equivalent demands. If capacity-only, sanctions would disappear.

  The final challenge is identifying the irreducible commitment. The placement paradox suggests "conditional entitlement" is fundamental, but the sanctions point to "behavioral compulsion." Ultimately, the non-negotiable element appears to be the state's power to define and enforce compliance rituals regardless of their economic rationality - hence "state-enforced performance of job readiness" as the core commitment.
answer: |-
  Here's a reconstruction of the implicit theory and its commitments, based solely on the practice described:

  **1. Reconstructed Implicit View of Obligation:**
  The practice primarily implies an obligation arising from **the receipt of collectively funded transfers while possessing the capacity to work**. It blends three elements:
      *   **Conditionality of Aid:** The core principle is that public support is conditional on certain behaviors when the recipient *can* support themselves through work. Receipt creates an obligation to mitigate the cost to the collective.
      *   **Presumption of Available Work & Shirking Risk:** It assumes suitable work exists or can be found through sufficient effort, and that without compulsion, some claimants might not exert that effort ("moral hazard"). The lowering suitability bar reflects a belief that *any* work is preferable to state dependence, even if not ideal.
      *   **Screening Imperative:** The focus on logged activities (not success) and unpaid placements acts as costly signals or tests ("screening devices") under imperfect information. Performing these actions signals genuine job search effort or willingness, distinguishing the "deserving" (genuinely seeking but unlucky) from the "undeserving" (work-shy) in the state's eyes. Sanctions enforce the cost of failing the screen.

  **2. Core Commitments vs. Comfortable Fits:**
      *   **Strictly Presupposed (Cannot Give Up):**
          *   **Conditionality:** The *entire system* presupposes that receiving unemployment benefits creates enforceable behavioral obligations that do not exist for non-recipients (like the idle rich). This is foundational.
          *   **State Authority to Define & Enforce Compliance:** The state must have the power to define "suitable work," mandate activities, create screens (like unpaid work), and impose sanctions (suspension of benefits) for non-compliance.
          *   **Behavioral Compulsion as Legitimate Tool:** It presupposes that mandating specific behaviors (search, acceptance, unpaid work) and punishing non-compliance is a valid and effective means to achieve policy goals (increasing employment, reducing claims).
      *   **Comfortable Fits (Can Coexist, Not Strictly Required):**
          *   **Desert/Reciprocity:** While *comfortable* with desert-talk ("undeserving poor"), a purely incentive/screening justification *could* generate nearly identical rules. The rules aim to *change behavior* (incentives) and *reveal type* (screening), which doesn't strictly require judging moral desert, only responsiveness to incentives or willingness to jump hoops. Exempting pensioners (incapacity presumed) and the idle rich (not drawing benefits) does *not* inherently undermine a screening/incentive justification focused *only* on benefit claimants; reciprocity isn't the core driver.
          *   **Lowering Suitability Bar:** This is compatible with both screening (testing willingness to accept less desirable work) and incentives (increasing pressure), not strictly desert.
          *   **Sanctions:** Essential for enforcement, compatible with all justifications (desert-punishment, incentive-cost, screening-failure signal).
      *   **Incoherent Element:**
          *   **Placement as Work/Not-Work:** This is fundamentally incoherent under *any* consistent theory. Defining the unpaid placement as "work" *only* for the purpose of fulfilling the claimant's obligation (i.e., discharging their duty to the state) while simultaneously defining it as "not-work" for the purposes of wage laws, rights, and formal employment status is a contradiction. It serves administrative convenience and cost-saving for the state/employers but lacks a coherent philosophical basis. It reveals the power dynamic: the state can define the activity solely for its purposes.

  **3. Changes Under Rival Views:**
      *   **If Solely Screening (no desert, weak incentives):** The focus would shift entirely to *costly signals* to reveal type. Unpaid placements might become more randomized or varied "tests." Sanctions for failing screens might be immediate and permanent (benefit denial) rather than temporary suspensions. Logged activities might be audited for authenticity more than volume. The *lowering* suitability bar might be replaced by increasingly onerous *signaling* tasks unrelated to actual job suitability.
      *   **If Solely Incentives (no desert, weak screening):** The emphasis would be on altering the cost/benefit calculation of job search vs. claiming. Benefit levels or duration might taper faster. "Suitable work" might be defined more narrowly initially to avoid discouraging search for better matches. Unpaid placements would likely be abolished as inefficient/disincentivizing. Sanctions might be financial penalties *added* to future benefit reductions rather than simple suspension. The lowering suitability bar *might* remain as an incentive tool.
      *   **If Strong Desert/Reciprocity:** Obligations would likely extend beyond claimants. The "idle rich" drawing on state resources indirectly (tax breaks, inheritance, asset protection) might face wealth taxes or mandatory social contribution schemes. Sanctions might incorporate more explicitly punitive elements (community service orders). Exemptions for pensioners might be means-tested or require proof of past contributions. The unpaid placement duality might be resolved by either granting full worker rights *or* abolishing it as exploitative.

  **The Irreducible Commitment:**
  The practice fundamentally cannot give up the principle that **receipt of public support creates enforceable behavioral obligations.** The specific mechanisms (logs, suitability, unpaid work, sanctions) are tools serving this core conditionality, but they are manifestations, not the root. Without this commitment, the entire coercive structure collapses.

  \answer{enforceable obligations from benefit receipt}
