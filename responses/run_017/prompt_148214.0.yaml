answer: |-
  Here’s a defended prioritization of conceptual questions for your foundation’s memo, designed to maximize decision-relevance per unit of funding. I rank five core questions (including two of your three), deprioritize common objections, address your methodological concern about reflexivity, and flag where your thoughts need refinement. The ordering balances **upstream impact**, **tractability within budget**, and **risk of unexciting answers**.

  ### Prioritized Questions (Ranked)
  1. **The Ontological/Heuristic Distinction (Your "Reading Worry")**  
     - **What**: Is ITN a normative claim about what *makes* a cause good, or a heuristic for allocation under uncertainty?  
     - **Upstream impact**: Resolves disputes about double-counting (tractability/neglectedness), granularity, and whether ITN *should* incorporate portfolio effects. If ITN is purely heuristic, double-counting is a non-issue (heuristics need not be consistent), but granularity becomes critical. If ontological, unit tradeoffs become urgent.  
     - **Feasibility**: A philosopher alone (3 months). Requires conceptual analysis of existing literature, no new empirics.  
     - **Unexciting answer**: "It’s context-dependent" (but even this directs funders when to use/avoid ITN).  
     - **Reprioritization trigger**: If new decision theory work shows heuristics systematically fail in priority-setting contexts, elevate; if empirical studies confirm ITN is used consistently as ontology, deprioritize.  
     - **Why #1**: Highest leverage. Clarifies which other problems matter and saves effort on dead-end debates (e.g., double-counting if heuristic).  

  2. **Granularity and Cause Individuation (Your "Granularity Worry")**  
     - **What**: What principles define a "cause" unit? Can we avoid score manipulation via subdivision?  
     - **Upstream impact**: Affects all ITN applications. If unresolved, empirical reports are incomparable. Also upstream of neglectedness/tractability worries (subdividing alters both).  
     - **Feasibility**: Philosopher + decision theorist (4 months). Needs framework development, not new data.  
     - **Unexciting answer**: "Causes should be defined by intervention types" (but this advances practice by standardizing comparisons).  
     - **Reprioritization trigger**: If funders report granularity distorting real allocations, elevate; if a simple operational rule emerges in field-building work, deprioritize.  
     - **Why #2**: Directly enables reliable empirical scoring. Your worry isn’t confused—it’s fundamental.  

  3. **Return Curves vs. Local Factors (Your "Shape Worry")**  
     - **What**: Should we replace ITN with explicit return curves? Does local approximation suffice?  
     - **Upstream impact**: Determines whether to abandon ITN for a new framework (resolving ranking-vs-size and portfolio issues) or retrofit it (e.g., adding curvature estimates).  
     - **Feasibility**: Economist-philosopher team (6 months). Light empirics (e.g., modeling existing data).  
     - **Unexciting answer**: "Curves are superior but infeasible to estimate" (still guides when to use ITN cautiously).  
     - **Reprioritization trigger**: New tractable methods for curve estimation emerge; or evidence shows local factors mislead in >20% of cases.  
     - **Why #3**: Addresses core limitations but is resource-heavy; ranked lower due to dependency on Q1 (if ITN is heuristic, curves may be overkill).  

  4. **Tradeoffs Between ITN Units**  
     - **What**: How to compare units (e.g., lives vs. wellbeing) across factors? Can we formalize tradeoffs?  
     - **Upstream impact**: Essential for multiplicative combination. Affects cause rankings (e.g., if tractability units differ from importance).  
     - **Feasibility**: Philosopher (3 months). Requires value theory analysis.  
     - **Unexciting answer**: "Use a common normalization (e.g., DALYs)" (but reveals where ITN oversimplifies).  
     - **Reprioritization trigger**: Funders face a decision where unit choices flip priorities; or new aggregation theorems apply.  
     - **Why #4**: Less urgent than granularity/heuristic—depends on Q1’s resolution.  

  5. **Complementarities and Sequencing**  
     - **What**: How to handle cause interactions (synergies/antagonisms) or path-dependence?  
     - **Upstream impact**: Corrects ITN’s "one cause" limitation. Could reshape portfolio allocation.  
     - **Feasibility**: Complex—requires game theory/systems modeling (junior researcher’s full year).  
     - **Unexciting answer**: "Interactions exist but are too chaotic to model" (still warns against naive ITN).  
     - **Reprioritization trigger**: Evidence that complementarities dominate marginal returns in key areas (e.g., policy advocacy).  
     - **Why #5**: Highly decision-relevant but intractable without Q1–Q3 settled. High risk of unexciting answers.  

  ### Deprioritized Standard Objections
  - **"Multiplicative combination is unjustified"**: Likely intractable without unit clarity (Q4) and settled by Q1 (if heuristic, justification is pragmatic). **Defund**: Low leverage.  
  - **"Tractability and neglectedness double-count"**: Depends entirely on Q1. If heuristic, it’s irrelevant; if ontological, it’s subsumed under unit tradeoffs (Q4). **Defund**: Circular without foundational work.  
  - **"ITN ignores portfolios"**: Addressed by Q5 but too premature to tackle now. **Defund**: Requires too many upstream inputs (Q1–Q3).  

  ### Addressing Your Thoughts
  - **Granularity**: Not confused—it’s central. But upstream of double-counting (if causes are ill-defined, double-counting is a secondary symptom).  
  - **Return curves**: Insightful, but your "repair or replace" framing is incomplete. Q1 determines this: if ITN is heuristic, repair (add curvature estimates); if ontological, consider replacement.  
  - **Reading worry**: Correct and highest-priority. Several disputes (e.g., double-counting) dissolve if this is settled.  

  ### Reflexivity Methodology
  Using ITN to prioritize these questions **is circular but not viciously so**. Treat it as a structured heuristic:  
  - **Importance**: Focus on questions that, if resolved, alter real funding decisions (e.g., Q1 changes how empirical reports are used).  
  - **Tractability**: Prioritize questions solvable with existing tools (e.g., Q1 vs. Q5).  
  - **Neglectedness**: Avoid well-trodden debates (e.g., multiplicative combination).  
  **Alternative**: A **decision-theoretic loss function**—rank questions by how much their resolution reduces expected error in allocations. This requires modeling but avoids ITN’s baggage. For your memo, use this: *Prioritize questions that resolve ambiguities in the* interpretation *or* application *of evidence funders already commission*.  

  ### Recommended Allocation
  - **First year**: Fund Q1 (3mo) + Q2 (4mo) + Q4 (3mo). Total: 10mo.  
  - **Second year**: Fund Q3 (6mo). Reserve 2mo for follow-ups.  
  *Rationale*: Q1 unlocks efficiency in all downstream work. Q2 ensures empirical scoring is valid. Q4 is quick and prevents Q3/Q5 from stalling. Q3 then leverages this foundation. Q5 is too speculative for this budget.  

  This sequence maximizes clarity per dollar: by year two, the foundation will know whether to use ITN cautiously (if heuristic), invest in return curves, or overhaul cause definitions—making future empirical work exponentially more valuable.
