prompt: |-
  I joined the board of my family's small foundation last winter — we give away roughly sixty thousand dollars a year, in grants between about two and twenty-five thousand — and I have been going back through our minutes, because a friend who reads decision theory pointed out that the very first request we ever turned down was, structurally, a Pascal's mugging: an unsolicited email offering, for three thousand dollars, to use a method the writer declined to describe on beings he numbered at ten to the thirtieth power. We said no in about five minutes. Since then our record is this: we gave twenty-five thousand to a school-based parasite treatment program with randomized evaluations behind it, where we could state with real confidence that the money would avert on the order of a handful of deaths; we gave twelve thousand to a proposal with a fully specified engineering mechanism, where an independent engineer put a five percent chance on its working and, if it worked, on its sparing roughly a thousand cases of severe illness; we gave four thousand for a one-month scoping review of a speculative policy proposal and then declined the full grant when the review came back lukewarm; and we declined a proposal whose mechanism was spelled out in detail but which rested on a long chain of speculative steps, where the applicants' own materials put the chance of success at one in a hundred million and the payoff at the equivalent of ten to the twenty-second lives. Nobody on the board has ever articulated a principle, and it now looks to me as though everything we have done is equally compatible with several: capping how much value we allow a very large number of lives to carry; discounting claimed leverage, so that the larger the asserted payoff the stronger the evidence we require before the number moves us at all; refusing to act on probabilities below some floor whatever the stake; or treating the purchase of information as our default response whenever an estimate is shaky.

  The new proposal resembles none of these. A small physics group asks for nine thousand dollars and says that if a particular speculative cosmological hypothesis is true, an apparatus they can build now would bring into existence something like ten to the twenty-fourth lives that are, on balance, worth living. Two things separate it from our earlier refusals: the probability estimate comes from three independent physicists we consulted rather than from the applicants, and all three put the hypothesis at about one in ten thousand while confirming that the causal chain from hypothesis to apparatus is sound; and no one is claiming any privileged access or special power — the mechanism is public, physical, and in principle directly testable, though a decisive test would cost forty thousand dollars. One of the three reviewers adds, in a minority note the group disputes, that a different variant of the same hypothesis — she puts it at maybe one in ten million — would make the apparatus instead produce an astronomical quantity of suffering.

  What should we do if we want to be consistent with ourselves, and which of our own precedents is genuinely the closest analog here? Please set out the two or three rules that fit our track record about equally well, say what each implies for this proposal, tell me whether the minority note should move us and why, then give me your best recommendation with the reason for preferring that reading of our record — and, separately, what you would expect us actually to decide in the room next month. My fellow trustees will probably propose deferring and spending a thousand dollars on a further feasibility study; I would like to know whether that is a genuine fourth rule or just one of the others in procedural disguise. Finally, name the further case that would really tell these rules apart, since I still have room in the budget to commission one more review if it would settle anything.
reasoning: |-
  Hmm, this is a fascinating ethical and strategic puzzle from a foundation trustee. The user presents a remarkably clear case study of real-world decision-making under uncertainty, with high philosophical stakes. 

  Let me unpack the core tension: their foundation seems to operate with implicit heuristics for handling speculative high-impact proposals, but these principles conflict when applied to this new physics grant. The cosmological hypothesis offers staggering potential upside (10^24 lives) at non-negligible odds (1/10,000), but carries a tail-risk of catastrophic harm. 

  What's particularly interesting is how the user frames this as a self-consistency challenge. They're not just asking "what's right" but "what aligns with our institutional identity." That suggests they value procedural integrity as much as outcome. The detailed record shows four distinct behavioral patterns in past decisions:

  First, the rejected Pascal's Mugging resembles this case superficially - huge numbers, sketchy mechanism - but differs crucially in evidentiary support. That original proposal had zero verification, while this has three independent physicists vouching for the probability estimate and mechanism. 

  Second, the accepted grants show willingness to fund: a) proven interventions (parasite treatment), b) high-risk engineering with transparent failure modes (5% chance), and c) cheap information-gathering (scoping review). The new proposal doesn't fit neatly into these categories - it's more speculative than (a), less testable than (b), and more expensive than (c).

  Third, the rejected "long chain" proposal had laughably low odds (1/100M) versus this project's comparatively robust 0.01% chance. 

  The minority note about suffering risk adds moral complexity. It forces the foundation to weigh: is preventing potential suffering more urgent than enabling potential flourishing? And how should tiny-probability catastrophes factor against small-probability utopias?

  For recommendation: the $1k feasibility study seems like a smart compromise. It transforms an ethical dilemma into an information-gathering exercise - very on-brand given their history of funding reviews. But crucially, it must address the suffering risk question too. 

  If I were in that boardroom, I'd push to amend the study to specifically investigate: could the apparatus be modified to prevent the suffering-outcome while preserving upside? Physicists love constraints - they might find an elegant solution.
answer: |-
  Based on your foundation's decision history, I identify three consistent implicit principles that explain your past actions. The new proposal sits at their intersection, requiring careful analysis of which precedent dominates. Below is a structured breakdown:

  **Three Rules Fitting Your Track Record:**
  1.  **Probability Threshold + Expected Value Caution (PT+EVC):** You reject claims with probabilities below a de facto floor (~1/100M in your rejection) *and* heavily discount expected value calculations when probabilities are very low or stakes extremely high. This avoids Pascal's muggings while still funding high-risk/high-reward projects with tractable probabilities (like the 5% engineering project).
  2.  **Evidentiary Demands Scaling with Stakes (EDS):** You require exponentially stronger evidence as the claimed impact grows. The parasite program (modest impact, strong evidence) was funded; the 1/100M proposal (colossal impact, weak evidence) was rejected. The scoping review exemplifies buying information when stakes/uncertainty are high.
  3.  **Actionable Information Preference (AIP):** You strongly prefer funding concrete actions (proven interventions, specific engineering, scoping reviews) over purely speculative leaps, especially when mechanisms are opaque or agent-dependent. The initial Pascal's mugging rejection and the lukewarm-scoping-review rejection fit here.

  **Application to the New Proposal ($9k for Cosmology Experiment):**
  *   **PT+EVC:** *Favors Funding.* Probability (1/10,000) is vastly higher than your rejection threshold (1/100M). Expected Value is immense (10^24 lives / 10,000 = 10^20 lives averted per $9k, dwarfing your parasite program). The tail risk (1/10M suffering) lowers EV but doesn't negate it.
  *   **EDS:** *Mixed/Slightly Against Funding.* Stakes are astronomical (potential creation). While evidence is stronger than the Pascal's mugging (3 independent physicists, public mechanism), it's still highly speculative cosmology. You haven't funded anything remotely this speculative before, even with better odds (like the 5% engineering project).
  *   **AIP:** *Favors Funding (with caveat).* The grant buys a concrete action: building testable apparatus generating *information*. This mirrors funding the scoping review. The outcome isn't agent-dependent "magic".

  **The Minority Note (Suffering Risk):**
  *   **Should it move you? Yes, but modestly.** It introduces a significant potential downside (astronomical suffering at ~1/10M). This reduces the *net* expected value. Crucially, *it makes the information gained even more valuable.* Confirming or refuting the hypothesis now also informs us about a catastrophic risk pathway. This strengthens the "buying information" (AIP) argument.

  **Recommendation & Reasoning:**
  *   **Recommendation: Fund the $9k grant.**
  *   **Reasoning:** The **Actionable Information Preference (AIP)** is the strongest fit with your overall record and provides the clearest justification here:
      *   Your foundation *routinely* funds modest sums to buy information when faced with uncertainty ($4k scoping review). This is directly analogous: $9k buys crucial experimental data on a high-stakes hypothesis.
      *   Unlike the rejected Pascal's mugging or long-chain proposal, this offers a *public, physical, testable mechanism* – the core of actionable information.
      *   Funding this test aligns with the *spirit* of your cautious approach: reducing uncertainty *before* committing larger sums ($40k test) or facing ethical dilemmas about creation.
      *   The minority note *reinforces* this: the information gained also illuminates a potential catastrophic risk, making the data *more* valuable, not less.
      *   While EDS gives pause due to the stakes, the relatively high probability (1/10k) and the concrete nature of the information purchased overcome this hurdle better than any past rejected proposal. PT+EVC strongly supports the positive EV calculation even with the suffering risk factored in.

  **Prediction for the Boardroom:**
  *   **Likely Decision:** Defer and fund a $1k feasibility study.
  *   **Is this a Genuine Fourth Rule? No.** This is **AIP (Actionable Information Preference) in procedural disguise.** It's entirely consistent with funding the scoping review. The board is instinctively applying their default response to shaky estimates: buy more information first, but at a lower cost point than the original $4k review. It reflects caution (EDS) but channels it through the AIP principle.

  **The Discriminating Case to Commission:**
  *   **The Case:** A proposal requesting $15k for a *definitive lab test* of a novel water purification mechanism. Proponents claim a 1% chance it could provide clean water to 1 billion people (10^9 lives impacted). A reputable independent lab confirms the 1% probability and sound engineering. However, a minority reviewer notes a 0.001% chance the mechanism could release a persistent toxin affecting 100 million people if scaled.
  *   **Why it Discriminates:**
      *   **PT+EVC:** High probability (1%) for immense impact. Strong positive EV even with downside risk.
      *   **EDS:** Very high stakes (1B lives) but strong evidence (lab test, independent confirmation). Does your evidence bar scale linearly or exponentially?
      *   **AIP:** Funds concrete, testable information (the lab result).
      *   **The Clash:** Does your board fund this high-probability/high-impact test easily (PT+EVC/AIP), or balk due to the immense stakes despite strong evidence (EDS)? A "yes" suggests PT+EVC/AIP dominate; a "no" suggests EDS is your strongest principle. The suffering risk adds nuance mirroring the cosmology case.

  **Conclusion:** Your foundation's most consistent principle is prioritizing the purchase of actionable information when faced with uncertainty. Funding the $9k cosmology experiment best aligns with this core precedent, as it directly buys testable data on a high-stakes hypothesis. The suffering risk reinforces the value of this information. Expect your board to default to buying *cheaper* information first (a $1k study), which is a procedural application of the same AIP principle. The water purification test case would definitively reveal whether Evidence Demands Scaling with Stakes (EDS) is a stronger driver than Probability Threshold/Expected Value Caution (PT+EVC) when evidence is strong but stakes are maximized.
