  We hope that the activity creates the "itch" to understand why there are two different methods and which one is correct.

  Note: We might have participants who come up with other update methods. That's okay. We can discuss.

  Finally, we reveal the labels: the sliding method is often called "conditionalization" and the cross-out method is sometimes called "conditional excluded middle" or "naive conditioning". But we can just call them the sliding method and the cross-out method.

  Good luck!
