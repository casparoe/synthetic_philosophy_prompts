prompt: |-
  You are a philosopher of history who works alongside historians — fluent in the analytic literature on counterfactuals, causation and path dependence, and equally fluent in the historians' arguments about contingency, determinism and the uses of the counterfactual in explanation. I need you to design something, not to survey a field. Think carefully before you write: work out first which distinctions from that literature a procedure usable by a non-specialist must preserve, and which it can afford to collapse. Do not cite anything and do not name books or authors; I cannot check them and they would not help me. Use no technical vocabulary you have not translated into terms a working novelist could act on.

  I write historical fiction, and my last three novels have been what I would call low-divergence alternate history: one or two changes to the historical record, everything else left as it was, the interest lying in what follows. I am contracted for two more, and my editor now wants each premise signed off before I draft rather than after. I make premise-level divergence decisions roughly thirty times per book, each one in half a working day, and a bad one is expensive: it is discovered in draft, it unravels months of work, and it is the first thing reviewers attack. My resources are a historical consultant for ten hours across both books, no training in philosophy or economics, and an editor who will read the procedure but will not read theory.

  Please write me a decision procedure I can actually run on a proposed divergence, ordered as questions with stop rules. It must, at minimum, handle the following, in my terms:

  Say what I mean when I say an outcome was inevitable. I keep conflating two things: an outcome that had several independent sufficient causes, so that removing the one that actually operated would only have delayed it or routed it differently, and an outcome that merely feels unavoidable because it happened and the accounts are organized around it. Give me a test that separates these, and a rule for what a premise must do when the outcome I want to avert belongs to the first kind.

  Make me keep a cancellation ledger: the actual facts my premise silently negates — later events, works, institutions that depended on the thing I removed — and a stop rule for when the ledger gets too long for a low-divergence book.

  Handle latency: the gap between the divergence and the first difference any contemporary could in principle have noticed. Some of my premises have a latency of days, others of two generations, and I do not know what the second kind commits me to.

  Handle reconvergence: the well-known fact that most divergences drain back into something like the actual course within a few decades. I need to know whether my book is required to dramatize that draining away, and on what grounds I may decline to.

  Flag hindsight contraband: places where a character's reasoning quietly presupposes a trend — the rise of this or the decline of that — that only became visible long after they lived.

  And give me a name and a use for the pattern I keep falling into myself: the more badly an audience wants a divergence to be true, the less I scrutinize whether it was cheap. I suspect this is a systematic failure of my own judgment and not just carelessness.

  Mark every point where the procedure stops with no, every point where it hands a question to my consultant as a factual matter, and every point where it hands the question back to me and my editor as a matter of values or of what kind of book this is. Be explicit about which distinctions you simplified away.

  Then run it on three of my premises. One is a congress of the great powers in 1814–15 that breaks up over the disposal of a Polish and a Saxon territory, leaving no settled concert and a nineteenth century thatopens with general war. One is a world in which the great influenza pandemic after the First World War does not occur. The third is the one I have already drafted sixty pages of, and it is the one I expect you to damage: a ruling in a Westminster court in the early 1770s, reasoned differently by the judge, ending the Atlantic slave trade a century early.

  Format: lead with a single sentence stating what the procedure is for and what it will refuse to decide. Then at most eight numbered steps, each with its sufficient-answer condition and its stop or hand-off rule. Then the three worked applications. Then a closing section on what the procedure cannot tell me. No footnotes, no bibliography, no headings beyond those four parts. The whole document must be no more than 1,000 words, including the one sentence you spend telling me which distinctions you dropped and why.
reasoning: |-
  Hmm, the user is a historical fiction novelist working on low-divergence alternate history. They need a practical decision procedure to evaluate premise-level divergences efficiently, avoiding costly mistakes in drafting. The procedure must handle inevitability, cancellation ledgers, latency, reconvergence, hindsight contraband, and a named bias pattern - all while respecting their constraints: no philosophical jargon, consultant-limited access, and editor-friendly formatting.

  Key distinctions to preserve:
  - Inevitability vs narrative determinism (must separate)
  - Factual dependencies vs authorial choices (must separate)
  - Character-accessible knowledge vs anachronistic projection (must flag)

  Distinctions to collapse:
  - Metaphysical vs epistemic necessity (irrelevant for fiction)
  - Various causation theories (unactionable for novelist)
  - Path dependence subtypes (overcomplicates ledger)

  The core challenge is creating a tool that catches historical traps without requiring theory knowledge. The "cancellation ledger" concept seems crucial for tracking ripple effects, while "hindsight contraband" addresses a common writer blind spot. Naming their personal bias ("Wanting Makes Cheap") might help self-monitoring.

  For the worked examples:
  1) 1814 Congress breakup - Must verify if Concert of Europe was overdetermined. High cancellation risk due to diplomatic domino effects.
  2) No 1918 Flu - Pandemic removal seems clean initially, but medical/social consequences need ledger scrutiny. Latency period is critical.
  3) 1770s court ruling - Most vulnerable premise. Early slave trade abolition likely requires massive cancellations (industrial revolution impacts etc.). "Wanting Makes Cheap" bias clearly applies here.

  The procedure must ruthlessly separate factual questions (consultant territory) from narrative choices (author/editor domain). Stop rules should trigger when historical constraints clash irreparably with story goals.
answer: |-
  **Procedure for evaluating low-divergence historical premises: identifies constraints and commitments, refuses to decide narrative worth or plausibility.**

  1.  **State the Premise:** Clearly define the single change ("divergence") and the specific historical outcome(s) you wish to avert or alter ("target outcome(s)"). *Stop if:* The premise alters more than one tightly linked causal element or targets multiple unrelated outcomes. *Hand-off to Editor/You:* If the target outcome is too vague (e.g., "prevent war" vs. "prevent the Franco-Prussian War").

  2.  **Test Inevitability (The "Multi-Roots Check"):** Ask: "Could the target outcome plausibly have been achieved *in a significantly different way* within a decade, using forces visibly active or latent at the time, even *without* the element I'm removing?" *Stop if:* Answer is "Yes" (target outcome is likely inevitable in this sense). *Rule:* If stopped, your premise *must* also remove/disable *at least one* of these plausible alternative roots/pathways to the target outcome, not just the one actually taken. *Hand-off to Consultant:* "What were 1-2 other plausible paths to [target outcome] circa [year]?"

  3.  **Open the Cancellation Ledger:** List *immediate, direct factual consequences* of the divergence within 5 years. Focus on: specific people dead/alive/not born, treaties unsigned, laws unmade, battles unfought, inventions unmade/unused, institutions dissolved/unfounded. *Stop if:* The list exceeds 5 major, well-documented items OR includes an event/person/invention critical to a later period you intend to depict unchanged. *Hand-off to Consultant:* "List direct, documented consequences of losing [diverged element] within 5 years."

  4.  **Assess Latency (The "Noticeability Gap"):** Determine the earliest plausible time a reasonably informed contemporary could have noticed *something* was different ("first observable ripple"). *Stop if:* Latency exceeds 25 years AND you intend to depict the period between divergence and observable ripple without showing accumulating subtle changes. *Rule:* Long latency *commits* you to depicting (or accounting for) the gradual emergence of difference in society/culture/economy during that gap. *Hand-off to Consultant:* "When would the absence of [diverged element] first cause noticeable, documented disruption?"

  5.  **Check for Hindsight Contraband:** For any character reasoning about the future, societal trends, or probabilities, ask: "What specific, contemporary evidence (news, letters, data, common knowledge) available *to them* supports this view, *independent* of the trend's later actual outcome?" *Stop if:* Character reasoning relies *only* on the reader's knowledge of what later happened. *Rule:* Revise reasoning using only period-accessible evidence and contemporary anxieties/optimisms. *Hand-off to You/Editor:* Is this character's insight plausible genius, common opinion, or forbidden hindsight?

  6.  **Flag Reconvergence Pressure:** Acknowledge if major forces (geography, tech, deep social structures, broad ideologies) strongly push the timeline back towards familiar outcomes. *Hand-off to You/Editor:* Does the story *need* to show this pressure actively reasserting itself ("draining away"), or can it remain a background condition? (Value: How important is strict reconvergence vs. exploring sustained divergence?)

  7.  **Name Your Bias ("Wanting Makes Cheap"):** Rate *your own* emotional investment in this specific divergence being possible (1-10). *Hand-off to You:* If >7, re-run Steps 2-5 with *extreme* skepticism, especially Step 2 (Inevitability) and Step 3 (Ledger). Assume your bias is weakening scrutiny.

  8.  **Final Viability Check:** Review the Ledger and any Stops. *Hand-off to You/Editor:* Can the story absorb the Ledger's cancellations? Does the required handling of Latency or Inevitability align with the intended scope and focus of the book? *Hand-off to Consultant:* Verify key Ledger items or Latency timing if uncertainty remains.

  **Worked Applications:**

  1.  **1814-15 Congress Breaks Up:**
      *   (Step 1) Divergence: Dispute over Poland/Saxony escalates irrevocably. Target: Prevent Concert of Europe/stable peace.
      *   (Step 2) *Consultant:* Concert likely *not* inevitable. Other paths (e.g., renewed war forcing later agreement) possible but less certain than Concert itself. *No Stop.*
      *   (Step 3) *Consultant:* Ledger: No Congress System agreements, no specific territorial guarantees. Potential: Earlier localized wars (e.g., over Saxony/Poland), different alliances. *Likely <5 items. No Stop.*
      *   (Step 4) Latency: Weeks/months (diplomatic fallout, troop movements). *No commitment needed.*
      *   (Step 5) Characters might foresee general war risk based on fresh Napoleonic experience. *Plausible, no Stop.*
      *   (Step 6) Reconvergence Pressure: High (balance of power logic). *Hand-off:* Depict pressure (e.g., failed alliances, war exhaustion) or let divergence run? *Editorial choice.*
      *   (Step 7) Bias: Moderate (intriguing premise). *Re-check OK.*
      *   (Step 8) Viable pending Ledger/Latency confirms. *Hand-off to Editor:* Scope of depicting early wars vs. long-term divergence.

  2.  **No 1918-19 Influenza Pandemic:**
      *   (Step 1) Divergence: Pandemic virus never emerges/jumps. Target: Avert demographic/social disruption.
      *   (Step 2) *Consultant:* Massive death toll *was* contingent on that specific virus strain/timing. *No Stop* (No other *sufficient* cause for *that* scale of death in *that* window).
      *   (Step 3) *Consultant:* Ledger: ~50-100 million not dead in 1919-20. Specific medical conferences/research not happening. Certain memorials/art not created. *Huge list!* **STOP:** Ledger too long (>5 major impacts), includes millions whose absence fundamentally alters 1920s demography/economy/politics.
      *   *Premise likely too disruptive for Low-Divergence.* Requires major re-scoping or abandoning.

  3.  **1770s Court Ruling Ends Atlantic Slave Trade Early:**
      *   (Step 1) Divergence: Different judicial reasoning in key case (e.g., *Somerset*). Target: End large-scale British Atlantic slave trade circa 1770s.
      *   (Step 2) *Consultant:* Was abolition *c.1770* inevitable? **Strong Yes.** Multiple powerful forces sustained it (economic profit, colonial power, racial ideology). *STOP.* Rule: Premise *must* also remove/disable a key sustaining force (e.g., collapse West Indian planter political power *before* the case, major shift in economic reliance *before* the case). Just the legal reasoning change is insufficient.
      *   (Step 3) Ledger: *Massive.* No 1807 Act, no specific abolitionist campaigns/figures (Wilberforce, Clarkson), no Sierra Leone founding (1787), altered profitability of plantations, potential earlier industrial shifts? **STOP:** Ledger immense, impacts critical later events/figures.
      *   (Step 4) Latency: Short (trade disruption) for trade, long (social/economic transformation) for full impact. **STOP:** Long latency + massive ledger = requires depicting profound societal change over decades.
      *   (Step 5) Judge reasoning must avoid *explicit* moral condemnation reliant on later abolitionist arguments, stick to contemporary legal/constitutional concepts. *Possible, but hard.*
      *   (Step 6) Reconvergence Pressure: Very High (economic interests, racism). Would require immense force to *sustain* divergence.
      *   (Step 7) Bias: **"Wanting Makes Cheap" (Rating 10).** Re-run Steps 2-5 with extreme skepticism. Steps 2 & 3 already Stopped.
      *   (Step 8) Premise fails multiple Stops. Requires fundamental changes (additional major divergences, scope expansion) or abandonment for Low-Divergence.

  **What the Procedure Cannot Tell You:** It cannot judge if a premise is *interesting*, *original*, or *worth* the work. It flags historical constraints and narrative commitments, not narrative value. It simplifies complex causality into actionable checks ("Multiple Roots," "Ledger") and collapses nuances of historical debate into the Consultant's factual input. Your editorial judgment on scope, focus, and acceptable divergence level remains paramount.
