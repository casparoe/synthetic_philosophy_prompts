answer: |-
  Here's a mapping of the Northern Rock case onto methodological individualism (MI) vs. holism, structured by your requirements and focusing on the key features you identified:

  **Methodological Individualism (MI) Breakdown & Northern Rock:**

  1.  **Constitutive Claim (Social facts = individuals + relations):**
      *   **What it says:** Northern Rock's fragility is reducible to the specific contractual agreements, beliefs, and actions of individuals within Northern Rock (executives, traders), its counterparties (fund managers, institutional lenders), the Bank of England (officials, MPC members), depositors, and regulators.
      *   **Actors' Perspective:**
          *   *Wholesale Lender:* Faces uncertainty about counterparty risk, market rumours, and potential losses. Should assess Northern Rock's specific assets/collateral and broader market sentiment.
          *   *Retail Depositor:* Has limited information (maybe just the queue on TV). Should assess personal need for cash vs. deposit insurance limits. Queuing is rational self-preservation under sequential service constraints.
          *   *NR Board:* Should manage liquidity risk better, diversify funding, communicate effectively.
          *   *Bank of England (BoE):* Should anticipate signalling effects. Announcing support reveals previously hidden distress, potentially triggering retail panic. Staying quiet might have allowed a quieter resolution with wholesale lenders or let the bank fail without contagion. Guaranteeing everything stops the run by changing individual incentives (no loss risk).
      *   **Explains Well:** The *mechanism* of the retail run (sequential service constraint + rational self-interest given limited info + signalling from queues/announcement). Why the *guarantee worked* (changed individual incentives immediately).
      *   **Misdescribes/Struggles With:**
          *   The *origin* of the fragility: "Fragile funding structure" arises from the *system-wide pattern* of short-term wholesale reliance across many banks, interacting with market confidence – a property of the network, not reducible to any single individual's actions within NR alone.
          *   The *triggering power of the announcement itself:* The BoE's action (intended to help) *created* the public knowledge of distress that sparked the retail run. The *social fact* of "BoE support being announced" had causal power irreducible to the individuals who made the decision or saw the news; its meaning existed at the system level.
          *   Why *most retail depositors ran without NR-specific info:* MI struggles unless it posits widespread, identical (and irrational?) beliefs triggered purely by the signal (the announcement/queues), which feels like describing an emergent social dynamic.

  2.  **Explanatory Claim (Explanation bottoms out in individuals):**
      *   **What it says:** A full explanation of the failure requires detailing the decisions of specific actors: NR board's strategy, individual wholesale lenders pulling lines, specific BoE officials deciding to announce support, individual depositors seeing the news and joining queues.
      *   **Actors' Perspective:** (As above, focusing on individual reasoning).
      *   **Explains Well:** The *chain reaction* once the signal is sent (wholesale pullback -> BoE announcement -> depositor queues). *Why individuals acted as they did* in each stage given their (limited) information and incentives. The Diamond-Dybvig model *absorbs the retail run mechanism* individualistically (beliefs about others' beliefs + sequential service).
      *   **Misdescribes/Struggles With:**
          *   **The Equilibrium Selection Problem:** *Why* did the wholesale run happen *then*? *Why* did the announcement trigger a *mass* retail run instead of cautious monitoring? MI explanations (like D-D) show *how* a run works *given* coordination on the "bad equilibrium," but don't adequately explain *why that specific coordination occurred at that moment*. The shift in the *shared market mood* or *breakdown in systemic trust* that selected the bad equilibrium feels like an explanatorily powerful social fact.
          *   The **systemic nature of the "seized-up" credit market:** This was a macro-condition affecting *all* similar institutions simultaneously, not just the sum of individual lenders' decisions about NR. Explaining the freeze requires reference to system-level phenomena (interbank distrust, valuation uncertainty for complex products).
          *   The **efficacy of the guarantee without new information:** It worked by *changing the rules of the game* (social structure), not by informing individuals about NR's underlying state. The explanation is structural, not agential.

  3.  **Practical Claim (Intervene via individual incentives):**
      *   **What it says:** Solutions must target individual decision-making: e.g., deposit insurance to change depositor incentives (MI loves D-D!), capital requirements to change bank risk-taking, transparency rules to inform lenders.
      *   **Actors' Perspective (Intervention):**
          *   *BoE/Treasury:* Should design interventions altering individual incentives: cap guarantees to preserve market discipline (MI instinct!), provide covert liquidity to avoid signalling, punish reckless boards. Letting it fail teaches a lesson.
      *   **Explains Well:** Why *deposit guarantees* work (directly alter individual cost-benefit calculus).
      *   **Misdescribes/Struggles With:**
          *   **Why the *unlimited* guarantee was necessary:** A capped guarantee might not have stopped the run if depositors believed they were beyond the cap or feared delay. Stopping the run *instantly* required removing uncertainty *entirely* – a system-level reset, not a marginal incentive tweak. The *social fact* of "100% state backing" had immediate power.
          *   **Managing Systemic Risk:** Pure MI struggles with interventions aimed at *system stability* itself (e.g., lender of last resort function, macroprudential regulation) which target emergent properties (contagion, liquidity hoarding) rather than just individual bank incentives. The need for the BoE to act as *system* stabilizer goes beyond adjusting individual incentives.

  **Holism & Northern Rock:**

  *   **Does it confirm holism?** Partly. The case strongly suggests *emergent properties* with causal power:
      *   **"Fragile Funding Structure":** This *is* a property of the institution's *position within the financial network* and the *prevailing market conventions/practices* (reliance on wholesale funding). While implemented by individuals, the *fragility* emerges from the specific configuration of relationships and rules at the institutional level. An individual lender pulling their line isn't "fragility"; fragility is the *systemic vulnerability* revealed when *many* do it simultaneously due to a shared shock/loss of confidence.
      *   **The Run as a Social Fact:** The wholesale run was a cascade of interdependent decisions creating a self-reinforcing dynamic. The retail run was a classic emergent phenomenon triggered by a public signal (the announcement/queues) where the *meaning of the signal* and the *collective panic* had properties not reducible to individual psychology alone.
      *   **The Power of the Guarantee:** Its effectiveness lay in creating a new *social reality* ("this bank is now state-backed") that instantly dissolved the coordination problem.
  *   **Does Diamond-Dybvig (D-D) Absorb it Individualistically?** D-D brilliantly captures the *mechanism* of a retail run individualistically (beliefs, payoffs, sequential service). **However:**
      *   **It Doesn't Explain Selection:** D-D is silent on *why* the bad equilibrium was selected *at that specific moment*. The shift from "no run" to "run" at NR wasn't random; it was triggered by the *systemic event* of the wholesale freeze and then the *social act* of the BoE announcement. This selection process seems irreducibly tied to higher-level social facts (market confidence, institutional signalling).
      *   **Wholesale Run ≠ Retail Run:** D-D is designed for retail deposits. The wholesale run involved sophisticated institutions making interdependent decisions based on complex assessments of counterparty risk and market liquidity – arguably a different, more complex coordination problem embedded within the financial network.
      *   **The Holist Reading Does Work:** Recognizing "systemic fragility" and "coordination failure" as real, causally powerful social phenomena provides a more parsimonious and explanatorily satisfying account of the *trigger* and the *system-wide context* than a purely atomized individualist story. MI describes the cogs; holism points to the engine seizing up.

  **Your Tests for "Irreducibly Social":**

  1.  **Publicity-Consumption Test (Publicising it consumes it):**
      *   **Why it's attractive:** Captures reflexivity – the social fact (like confidence, panic, fragility) changes when publicly acknowledged. Announcing fragility *made* NR fragile in a new, self-fulfilling way.
      *   **The Worry is Valid (Germs):** Germ theory publicity changes *individual behavior* (hygiene) towards the *non-social* entity (germs). The test overgenerates.
      *   **Does it survive?** **Barely, but only with refinement.** The key difference is *constitutive dependence*. Germs exist independently of belief. Social facts like "fragility" or "panic" in this context are *constituted* by beliefs and expectations. Publicising *changes the constitutive beliefs*, thus consuming/changing the fact itself. Publicising germs changes behavior *towards* the germs, not the germs' fundamental nature. So: *A fact F is irreducibly social if (1) F is constitutively dependent on collective attitudes/beliefs, and (2) publicising F reliably alters those collective attitudes/beliefs in a way that changes F.* Northern Rock's fragility (as a triggerable state) meets this; germs do not.

  2.  **Identity-Swap Invariance Test (Permute individuals, outcome same):**
      *   **Why it's attractive:** Emphasizes structural/role-based causation over specific individuals. If any sufficiently large group of depositors/institutions in those roles would have caused a run given the structure, it points to holism.
      *   **The Worry is Valid (Role-Filling):** Individualists readily concede roles. They argue explaining *why* the role exists and *how* individuals act within it *is* the full explanation ("It's individuals all the way down").
      *   **Does it survive?** **Not well as a discriminator.** It highlights structural constraints but doesn't *force* a holist conclusion. MI can always argue the invariance occurs *because* individuals in those roles face similar incentives and information, which is individualistically explicable.
      *   **A Better Structural Test?** Focus on *Causal Powers of the Structure:* Does the explanation *require* attributing causal power to the social structure/relation *itself*, *over and above* the causal powers of the individuals occupying it? For example: "The sequential service constraint *caused* the run to be self-fulfilling." An individualist must reduce this to individuals acting under specific rules. A holist argues the rule-structure itself has causal efficacy. Northern Rock suggests the *network structure* of wholesale funding and the *institutional rule* of announcing support had causal powers irreducible to the individuals that day.

  **Where the Dispute is Silent/Blind:**

  1.  **The "Individual" Problem:** MI founders on the units. Are "Northern Rock," "Pension Fund X," or "The Bank of England" individuals? If yes, MI becomes vacuous (any organization is an "individual"). If no, explaining their actions purely via *their* constituent individuals becomes impossibly complex and loses explanatory power for *organizational behavior*. The case forces the question: what *are* the relevant units of analysis in complex systems? Neither side has a clear answer.
  2.  **Intervention Design:** Neither MI nor holism *directly* tells you *how* to design a deposit guarantee scheme. MI suggests targeting individual incentives (caps, co-insurance). Holism suggests ensuring systemic stability (comprehensive coverage, speed). The Northern Rock case (where only the unlimited guarantee worked instantly) suggests holism is pragmatically correct for *crisis containment*, but this doesn't resolve the philosophical debate. The dispute is silent on the practical trade-offs between moral hazard (MI concern) and systemic collapse (Holist concern).
  3.  **Equilibrium Selection:** As highlighted throughout, *why* a particular equilibrium (run/no-run) is selected at a specific moment is the Achilles' heel of strict MI and the strongest point for holism in this case. The dispute lacks clear tools to adjudicate this.

  **Conclusion for Your Case Study:**

  Northern Rock is a powerful case **against the *explanatory* and *practical* claims of strong methodological individualism.** While MI can describe the mechanics of the run (especially retail via D-D) and the incentive effects of the guarantee, it struggles profoundly with:

  1.  The emergent, structural property of "fragile funding" in a network context.
  2.  The causal power of the BoE announcement *as a social signal* creating the retail panic.
  3.  Explaining the *selection* of the bad equilibrium (the run trigger).
  4.  Justifying the *unlimited* guarantee as a system-level reset.
  5.  Defining the relevant "individuals" (especially institutions).

  Holism provides a more natural framework for understanding the systemic fragility, the reflexive nature of confidence, the coordination failure in equilibrium selection, and the necessity of system-level intervention. The D-D model, while brilliant for the retail run *mechanism*, does not absorb the *full* explanation, as it cannot adequately account for the *triggering context* (wholesale freeze, BoE signal) which involved irreducibly social facts. Your case shows that while individuals act, the *dynamics, meaning, and systemic consequences* of their actions are often governed by emergent social structures and facts. Neither of your proposed tests is perfect, but refining the publicity test around *constitutive dependence* offers the most promising route. The dispute remains frustratingly silent on the ontology of institutions and the pragmatics of systemic crisis management.
