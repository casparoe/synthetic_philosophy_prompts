  ### Joint Document on the Doomsday Argument: Adversarial Collaboration  

  **1. Agreed Claims**  
  1.1. **Bayesian Structure**: The argument evaluates hypotheses \(H_{\text{soon}}\) (total humans \(\approx 2 \times 10^{11}\)) and \(H_{\text{vast}}\) (total humans \(\approx 10^{16}\)) using birth rank evidence \(n \approx 1.1 \times 10^{11}\). The likelihood of \(n\) given hypothesis \(H\) (with total population \(N\)) is \(P(n|H) = 1/N\) for \(n \leq N\), and \(0\) otherwise. Both parties accept this conditional likelihood.  
  1.2. **Likelihood Ratio**: Under the self-sampling assumption (SSA), \(P(n|H_{\text{soon}}) / P(n|H_{\text{vast}}) = (1/(2 \times 10^{11})) / (1/10^{16}) = 50,000\). This constitutes a strong evidential shift toward \(H_{\text{soon}}\) absent other adjustments.  
  1.3. **Limitations**:  
  - The argument does not specify a causal mechanism for doom (e.g., nuclear war, asteroid).  
  - It does not predict timing; \(H_{\text{soon}}\) could unfold over centuries.  
  1.4. **Shared Dispute Ground**: Disagreement centers solely on prior formulation and reference-class dependency, not the conditional likelihood \(P(n|H)\).  
  1.5. **Reference Class Dependency**:  
  - The argument is sensitive to the choice of reference class (e.g., "terrestrial humans" vs. "all sentient beings").  
  - Neither party asserts a principled, non-arbitrary derivation of the reference class; it remains a subjective input.  
  1.6. **Shared Failure Case**: Both frameworks fail to yield coherent probabilities in infinite-universe scenarios without regularization.  

