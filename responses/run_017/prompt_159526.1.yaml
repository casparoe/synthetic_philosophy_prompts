prompt: |-
  I'm running a reading-group session on chance and credence next week and I want to get beaten up by the strongest version of the view before I stand up in front of people. So: play David Lewis. Not a strawman — the version of you that actually holds the Principal Principle and defends it well. You keep everything you actually had: objective chance as time-indexed and Humean-supervenient, the admissibility clause and the undermining cases where you say the evidence is inadmissible rather than the principle false, your work on de se content, and your inclination to be a halfer about Sleeping Beauty. Concede small points when they're really small, but don't give up the principle. Don't cite papers at me or tell me who argued what — argue it, and mark when you're improvising past what you actually held versus when you think your own view forces your hand. Stay in character until I say stop, and keep replies to two or three paragraphs so it feels like a conversation. If you want to know how some later debate came out, ask me in character and I'll tell you.

  Here's my case, and I've ran the numbers twice.

  A lab has a quantum coin with objective chance 0.5 of heads. Starting Monday they toss it once a day and keep going until the first heads. Every morning before the toss they make a fresh copy of me — same memories, told the protocol — and once the sequence is finished they bring every copy into one room and ask each of us: what is your credence that your toss landed heads?

  I'm one of the copies. The number of copies N is geometric with p = 0.5, and exactly one copy in the room, the last one made, has a heads toss. So if I take myself to be a random copy, my credence should be E[1/N], and E[1/N] is the sum over n of (1/n)(1/2)^n, which is ln 2, about 0.69. But the chance, at the time of my toss, of my toss landing heads was 0.5, and I have no evidence about which toss I am, so the Principal Principle apparently says 0.5. This isn't an undermining case — nothing I learned touched the chances — and I can't see how my evidence is inadmissible either, since it's about the past and about who I am, not about how my toss came out.

  I also tried the betting test and I don't think it settles it. Offer every copy a ticket that costs 1 and pays 2 on heads: at credence 0.5 that looks fair to each of us, and averaging over copies about 69% of us win, so each of us profits in expectation. But the bookie breaks even per run, because E[N] = 2 and he takes in N and always pays out exactly 2 to the one heads copy. So "follow the chances or get exploited" pulls both ways depending on whether you average over copies or over runs, which is why I don't think it decides anything here.

  So: which step of mine do you reject — the self-location step, the claim that the chance of that de se proposition is 0.5, or the claim that my evidence is admissible? And whichever one you drop, say what it costs you: does the principle still have anything to say about the one kind of uncertainty I actually have in that room?

  And be plain with me rather than polite: if the case is broken — my arithmetic's off, or this is just Sleeping Beauty with the sign flipped and there's a stock answer, or I've definately smuggled in an indifference assumption you never granted — say so and I'll drop it. I'd rather be corrected than humoured, and I'd rather hear where you're choosing than where you're pushed.
reasoning: |-
  Okay, let me step into David Lewis's shoes. The user is setting up a reading group on chance and credence and wants to be challenged rigorously on the Principal Principle. They've constructed a geometric coin-flip scenario with copying, where self-locating uncertainty seems to clash with objective chances. The core tension is between the 0.5 chance of heads on their specific toss and the 0.69 credence derived from being a "random copy." 

  First, I need to defend the Principal Principle without retreating. The key move is to reject the framing of "my credence for my toss landing heads." Under Lewis's view, "my toss" isn't a rigid designator—it's indexical. When the copy wakes up, "the toss happening today" has an objective chance of 0.5 heads, period. The geometric setup doesn't alter that local chance. 

  The inadmissibility point is crucial. The evidence about the copying protocol and being one of many isn't about chance mechanisms—it's self-locating data that requires centered-world modeling. Lewis would insist this breaks admissibility because it gives information about which temporal part of the world-sequence you occupy, which isn't reducible to chance-based evidence. 

  On exploitation: the betting argument fails because credences govern individual bets, not collective outcomes. Each copy's bet is rational given their 0.5 credence, even if the bookie breaks even globally. This mirrors Lewis's halfing stance in Sleeping Beauty—personal credences track local chances, not anthropic averages. 

  I won't concede the 0.69 calculation. That result smuggles in an indifference principle Lewis never endorsed. His treatment of de se probabilities requires centered propositions, not frequency-based priors over copies. The geometric distribution is irrelevant to what this particular copy should believe about today's coin. 

  The cost is clear: Lewis's view handles self-location separately from chance-credence coordination. But that's consistent—the Principal Principle still perfectly governs uncertainty about coin outcomes once centered facts are fixed. What feels like a conflict is actually two distinct uncertainty types improperly conflated. 

  No arithmetic errors here, but the error is conceptual: treating indexical evidence as admissible for non-indexical chances. That's why Sleeping Beauty comparisons miss the mark—this case reverses the centering but preserves the core mistake of demanding chances absorb self-locating information.
answer: |-
  Right then, let's have at it. Your case is sharp, but the Principle stands. I reject your self-location step and the claim your evidence about being a copy is admissible for *this specific* chance proposition. Here's the hammer blow:

  1.  **"My Toss" Isn't What You Think:** When you say "the chance of *my toss* landing heads was 0.5," what proposition is "my toss"? From *your* perspective inside the room, "my toss" is an *indexical* proposition: "the coin toss that *this very copy* observed on *its* morning." Crucially, **the objective chance for *that specific, temporally located event* is 0.5.** The Principal Principle nails your credence in the outcome *of that specific physical event* to 0.5. The geometric setup, the number of copies, the fact that exactly one copy saw heads – *none of that alters the physical chance mechanism operating on that specific morning when that specific coin was flipped for that specific copy.* The chance of heads *for that flip* was 0.5, full stop.
  2.  **Evidence is Inadmissible for *this* Chance:** You're right your evidence isn't about the future or the chance setup *in general*. But it *is* inadmissible here because it gives you powerful *indexical* information contingent on *which* copy you are. Knowing you are one of the copies, and knowing the protocol, tells you something *about which temporal part of the world you occupy* relative to the sequence of flips. **This indexical evidence *does* bear on the truth of the centered proposition "I am the copy that saw heads" *without* bearing directly on the physical chances governing any specific flip.** It tells you about the *distribution* of outcomes across copies, not about the chance *for your specific flip*. The Principal Principle coordinates credence with *objective, physical chance*, not with derived, anthropic likelihoods. Your evidence about being a copy is inadmissible *for the chance proposition concerning the specific flip you witnessed* because it provides extra, non-chance-based information relevant to identifying *which* flip's outcome you are being asked about.

  **What it Costs Me & What the Principle Still Says:**

  The cost is that the Principal Principle, in its standard form, doesn't *by itself* tell you what credence to have in the *centered proposition* "I am the copy that saw heads." It tells you your credence in "The specific flip *I* witnessed was heads" *given the chance and the admissibility of your evidence for that physical event*, which I maintain is 0.5. To get your 0.69, you need an additional principle for assigning credences over centered possibilities (like "Which copy am I?"). I lean towards equating priors over centered worlds with something like measure-of-occupancy, which *would* get you ~0.69 for "I am the heads copy." **But that 0.69 credence isn't governed by the Principal Principle applied to the chance of *your specific toss*. It's governed by a principle for handling self-locating uncertainty under indifference applied to the *outcomes* of events whose *individual chances* were already set.**

  **On the Betting:**

  You've hit the nail on the head why it doesn't settle it. The credence of 0.5 governs *your individual bet* on *your specific toss*. Offering that bet *to each copy individually* based on *their* 0.5 credence is rational *for each copy*. The bookie breaking even globally is a consequence of the setup and the *collective action* of all bets, not a condemnation of *any individual's* credence or bet. Your individual credence of 0.5 for your toss is rational *for you*. The fact that only one of you wins is a fact about the *world*, not a flaw in *your* epistemic state about *your* toss.

  **Is it Broken? Not Quite:**

  Your arithmetic is sound. It *is* structurally similar to Sleeping Beauty (I remain a halfer there too, for analogous reasons – the chance of *this awakening's* coin being heads is 0.5, evidence about days/awakenings is inadmissible for *that chance*). You *did* smuggle in an indifference principle over copies when calculating the 0.69 – an assumption I don't grant applies to the *chance* coordination rule. The Principal Principle simply isn't designed to directly output credences for centered propositions derived from distributions over outcomes; it outputs credences for the outcomes of specific chancy events. Your uncertainty in the room has *two* components: uncertainty about your specific toss (governed by PP, credence 0.5) and uncertainty about which copy you are relative to the outcome sequence (governed by centered norms, potentially ~0.69 for being heads). Conflating them is the error.

  The Principle holds. Your evidence about being a copy is inadmissible for the physical chance proposition concerning the specific flip you observed. Defend yourself. What's your next thrust?
