prompt: |-
  My housemate has been running an argument at me for a week and I can't find where it breaks. It starts with chicken but it generalises, which is the worrying bit.

  (1) There can be a moral reason against doing something only if doing it makes some difference to what happens; if what happens is the same either way, there's nothing to weigh.
  (2) Our corner shop reorders in crates of 60 birds and bins whatever's left on Sunday, and nothing carries over to the next order. So whether I buy one pack or not, the number of birds raised and killed this week is already fixed: my one pack isn't going to move a crate boundary.
  (3) So my buying it makes no difference to how much suffering there is.
  (4) So by (1) I have no reason not to buy it.
  (5) But (2) is true of every customer that week, not just of me.
  (6) And the order gets placed because people buy; the crate is nothing but the sum of those seperate purchases. So the harm is produced entirely by a set of acts each of which is, by (1) and (5), fine.
  (7) If every act that together brings about an outcome is fine, and the outcome is nothing over and above those acts, then there's nothing wrong with what's happening.
  (8) There obviously is something wrong with what's happening — and if there isn't, then each of 500 people throwing a stone at a man who was going to die anyway has also done nothing wrong, and nobody has ever had a reason to vote.

  One thing he calls a red herring: the supplier breeds to order, so if the crate isn't ordered those particular birds never get hatched at all. My purchase does change which birds end up suffering, just not how many, and he says that's not the sort of difference (1) is talking about.

  Wich step do you give up, and what does giving it up cost you? I'd rather keep the bit about the mob than the bit about my dinner, so I want to say (1) is where it breaks — but I can't say what replaces "makes a difference", because when I try "you're still part of the pattern that does the harm" I seem to get that eating a deer that got hit by a car is just as bad, which is worse. Also, please be clear about which parts of your answer are settled, which are live disputes among people who actually work on this, and which are just your own take.
reasoning: |-
  Okay, let me start by unpacking this user's problem. Their housemate presents an argument that buying chicken from a shop with fixed crate orders doesn't cause harm because one individual purchase doesn't change the number of birds ordered. The argument generalizes to situations like mob violence or voting, leading to counterintuitive conclusions. The user wants to know where the argument breaks down, especially wanting to preserve moral responsibility in mob scenarios over justifying their dinner choice.

  First, I need to analyze each step. Step (1) claims moral reasons require making a difference. Step (2) and (3) argue that since crate orders are fixed, individual purchases don't affect the number of birds killed. Step (4) concludes no moral reason against buying. But step (5) points out this applies to every customer. Step (6) says the harm results from the sum of individual acts, each deemed fine. Step (7) claims the outcome must then be fine, but step (8) shows the absurdity when applied to mobs or voting.

  The user mentioned their housemate dismissed the point about changing which birds suffer as irrelevant to step (1). So that angle might not work. The user also tried the "part of the pattern" argument but saw issues, like equating eating roadkill with contributing to demand.

  I recall collective action problems and threshold models in ethics. The key is that individual actions can be part of a group that causes harm, even if one act alone doesn't change the outcome. This is a settled area in moral philosophy. The "expected harm" approach is another solution: even if the chance of making a difference is low, the potential harm justifies restraint. Voting is a classic example here—each vote matters probabilistically.

  For the chicken scenario, the supplier breeds to order. While one purchase might not tip the crate order, consistent demand influences future orders. But the housemate's argument focuses on a single week with fixed orders. So the immediate impact might be nil, but the user's act reinforces the system. However, the housemate might counter that this is about the current week only.

  The mob example is useful. Each stone-thrower's action doesn't change the victim's fate, but collectively they cause death. We hold each responsible because they participate in a harmful act. This is about the nature of the act itself, not just outcomes. So step (1)'s requirement might be too narrow. Moral reasons can stem from participating in collective harm, not just individual difference-making.

  The user worries that rejecting step (1) leads to absurdities, like blaming someone for eating roadkill. But there's a distinction: buying chicken supports an industry that systematically causes harm, whereas roadkill consumption doesn't encourage killing. The moral weight comes from complicity in a harmful practice.

  In ethics, this is a live debate. Consequentialists might use expected utility or collective impact theories, while deontologists focus on duties not to participate in wrongdoing. Virtue ethics would consider the character of supporting harmful systems. So multiple frameworks reject step (1), but they do so differently.

  The user needs clarity on which parts are settled. The idea that individual impact isn't necessary for moral responsibility is well-established in collective action problems. The expected harm approach is widely accepted, especially in voting. However, how exactly to frame participation in harmful systems is still debated.

  So the breakdown is at step (1). Replacing "makes a difference" with "participates in a harm-causing practice" avoids the roadkill issue because buying chicken is part of a system that creates demand, whereas roadkill isn't. The cost is accepting that morality sometimes requires acting on principles beyond immediate causal effects.
answer: |-
  Your housemate's argument is a classic collective action problem (like voting or pollution), and it breaks at **step (1)**. While (1) *sounds* intuitive, it's too narrow a criterion for moral responsibility. Giving it up costs us a simple, purely consequentialist view of individual impact, but it preserves the core intuition that participating in harmful systems *is* morally significant. Here's the breakdown:

  ### Where the Argument Fails: Step (1)
  *   **The Flaw:** Step (1) claims moral reasons require your act to **change the outcome** (e.g., reduce total suffering). But morality often concerns **your role in bringing about an outcome**, even if your specific act was neither necessary nor sufficient for it. This is especially true in structured group harms.
  *   **The Cost of Rejecting (1):** We give up the idea that *only* direct, counterfactual difference-making matters. Morality becomes more complex, involving duties related to complicity, participation in unjust systems, and expected impact.

  ### Why Rejecting (1) Solves the Problem
  1.  **Collective Harm & Complicity:** Buying the chicken makes you **complicit** in a harmful practice *even if* your specific purchase didn't alter the number of birds killed *this week*. You are knowingly participating in and financially supporting a system that causes suffering. This participation itself can be morally objectionable.
  2.  **The "Pattern" Response (Refined):** Your worry about the roadkill deer is valid, but there's a key difference:
      *   **Buying Factory-Farmed Chicken:** You participate in a **system designed to create harm** (breeding, raising, killing animals for profit). Your purchase reinforces demand, signals approval, and funds the system. It's **active participation in an ongoing harm-producing practice**.
      *   **Eating Roadkill:** You utilize an *already existing* consequence of an accident (not a system designed to produce corpses). You aren't encouraging more deer deaths or funding a harmful industry. There's no **ongoing harmful practice** you're joining.
      *   **Settled Principle:** Morality distinguishes between benefiting from an unrelated harm vs. participating in/supporting a system *whose purpose is to create that harm*. The latter generates complicity. This distinction is widely accepted in applied ethics.
  3.  **Expected Impact & Probabilistic Reasoning:** Even if your *specific* purchase didn't tip a crate boundary, consumer behavior *collectively* and *over time* determines demand. Your purchase contributes to the overall demand signal. Further, you usually **cannot know for certain** you won't be the threshold customer. Acting as if you *might* make a difference (using expected value) is often reasonable. This is the standard solution for voting paradoxes.
      *   **Live Dispute:** *How much* expected impact matters is debated. Some (e.g., act consequentialists) argue it's the *only* thing that matters. Others (e.g., rule consequentialists, deontologists) see it as secondary to rules or duties against participation.
  4.  **Intention & Structure of the Act:** Buying the chicken is an **instance of the type of act** (supporting factory farming) that *collectively* causes harm. Morality often judges acts based on their type and the intention behind them within a system, not solely on their isolated physical consequences.

  ### How This Handles the Mob and Voting Examples (Step 8)
  *   **The Mob:** Each stone-thrower is **participating in the collective act of killing**. Their individual stone may not be the fatal one, but they are *intentionally joining a murderous mob*. We condemn the act of throwing the stone *as part of a killing*, not just if it changes the outcome. Rejecting (1) allows this.
  *   **Voting:** While one vote rarely changes an election, voting is **participating in a collective decision-making process**. Abstaining is failing to participate in that process when you have a stake. Furthermore, there's a non-zero probability your vote *is* decisive, and the expected impact of voting (benefit/cost * probability) can be significant. Rejecting (1) allows for duties of civic participation and probabilistic reasoning.

  ### What About Steps (2)-(7)?
  *   **(2) & (3):** Can be true *for that specific week*. Your purchase *alone* might not change *this week's* numbers.
  *   **(4):** **False**, because (1) is false. Lack of counterfactual difference doesn't erase moral reasons based on complicity, participation, or expected impact.
  *   **(5):** True, but irrelevant. The fact that *everyone* faces the same logic doesn't make the logic sound or absolve individuals. It highlights the collective nature of the problem.
  *   **(6):** **Misleading.** The harm *is* produced by the set of acts, but this doesn't imply each individual act is "fine." It shows the harm arises from **many acts that are *individually imperceptible* but *collectively decisive***. Judging them solely in isolation ignores this structure.
  *   **(7):** **False.** If every act in a set is *wrong* (because it constitutes participation in a harmful collective endeavor), the outcome is wrong *because* it was brought about by those wrong acts. The premise that "every act is fine" is incorrect.
  *   **(8):** Correctly identifies the absurd consequences if the argument holds. This reductio ad absurdum is a powerful reason to reject the initial premise (1).

  ### Status of the Solutions (Settled vs. Disputed vs. My Take)
  1.  **Rejecting pure counterfactual difference-making (Step 1) as the *sole* criterion:** **Settled.** Virtually no serious ethicist working on collective action problems (voting, climate change, consumer ethics) endorses the strict view in (1). Its flaws are well-known.
  2.  **Complicity/Participation:** **Settled Core, Disputed Details.** The idea that participating in harmful systems generates moral reasons is widely accepted (deontology, virtue ethics, many forms of consequentialism). *Exactly how* to define "participation" or "complicity" and *how strong* the resulting duties are is debated.
  3.  **Expected Impact / Probabilistic Reasoning:** **Live Dispute.** This is the dominant *consequentialist* solution (e.g., for voting). However, there's significant debate:
      *   *How* to calculate the probability (especially in complex systems like markets)?
      *   Is expected impact the *only* relevant factor, or are there side-constraints (deontology) or character concerns (virtue ethics)?
      *   Some (e.g., "threshold deontologists") argue that below a certain probability of making a difference, the act might be permissible even if the *type* of act is generally wrong.
  4.  **Distinction from the Roadkill Case:** **Settled.** Ethicists consistently distinguish between benefiting from an existing harm caused independently vs. participating in a practice/system designed to produce that harm. Supporting demand is key.
  5.  **My Emphasis:** While I've presented the mainstream rejection of (1), I lean towards a hybrid view: **Participation/Complicity provides the primary moral reason** (buying the chicken is an act of supporting factory farming), while **Expected Impact explains why participation *feels* problematic even in fixed-quantity scenarios** (because usually, participation *does* have expected impact, and we often can't be sure it doesn't). The participation framework cleanly handles the roadkill objection.

  ### Conclusion
  Give up **Step (1)**. The cost is abandoning the simplistic idea that morality *only* cares about whether *your specific action* changed the total outcome. The benefit is preserving coherent moral judgments about participating in collective harms (like factory farming, mob violence, or failing to vote), avoiding absurd conclusions, and providing a clear distinction from cases like roadkill. You *do* have a moral reason not to buy the chicken: you are **knowingly participating in and supporting a harmful practice**. The fact that your specific participation didn't alter this week's numbers doesn't erase your role as a participant in the system causing the harm. This view is settled in rejecting strict counterfactual difference-making as the sole criterion, though details of the best positive account (complicity, expected impact, etc.) remain live disputes.
