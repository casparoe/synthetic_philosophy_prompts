prompt: |-
  Me and a friend spent two hours arguing about Popper and evolution last night and got absolutely nowhere, so please settle it. The background, as I remember it: Popper at one point said the theory of natural selection was basically unfalsifiable, or a metaphysical research programme rather than an empirical theory, and then later walked that back and said it was testable but nearly impossible to test in practice, which is a different complaint entirely. My friend says: fine, so if Popper were around today he'd stamp the Extended Evolutionary Synthesis unscientific full stop, because its defenders keep saying standard evolutionary theory is incomplete without producing a clean novel prediction the old theory can't already make. I said no: Popper thought metaphysical research programmes were scientifically indispensable — he even used that category for Darwinism itself — and testable in principle but brutal to test was precisely the status he gave natural selection, so it isn't a demotion in his book. Neither of us could convince the other and we both started repeating ourselves.

  So: how would Popper actually have received the EES package if he'd run into it around 2015 — the niche construction stuff, transgenerational epigenetic inheritance, developmental bias channelling which variants show up, cultural inheritance and multilevel selection? Would he treat it as making evolutionary theory more testable (a plus by his lights), as a degenerating or metaphysical addition, or as something his demarcation machinery just has no slot for? Please use his own apparatus rather than cardboard falsificationism: what he said about metaphysical research programmes and why they matter to science, the gap between a theory being testable and being testable in practice, his evolutionary epistemology where the growth of knowledge is itself a selection process, and the propensity interpretation of probability if you think it does any work here. Also say whether his answer should differ between the different bits of the EES, since they don't all have the same structure — epigenetic inheritance and niche construction aren't the same kind of claim.

  Write 400-600 words of prose, then a JSON object with exactly these fields: verdict (one sentence: how he'd classify the EES overall, and which of the three options above it is); per_component (object keyed by niche construction, transgenerational epigenetic inheritance, developmental bias, cultural inheritance / multilevel selection, each value one sentence on whether he'd classify it differently and why); popperian_moves_used (list of the three to five specific Popper doctrines your answer leans on, one line each); friend_steelmanned (the strongest version of my friend's argument, better than he put it); where_im_wrong (one sentence); recantation_check (whether my memory of him backing off the unfalsifiability charge is right, and one line on what it changes here); confidence (low/medium/high plus one line explaining which bit you're least sure about).
