  Okay, let me approach this systematically. The user is a physicist-turned-philosopher who wants clear criteria for evaluating commemoration practices. They're frustrated by what they see as ad hoc arguments in the literature and want something resembling scientific modeling criteria. 

  First, I need to unpack their core request: they want desiderata (requirements) that any theory of commemoration must meet, with clear justifications. The context is practical decision-making for institutions like city councils and universities. They've provided nine specific test cases that any good theory should handle, ranging from "faded referents" (where the commemorated person is forgotten) to "dead hand" problems (where past communities impose commemorations on present ones).

  The user emphasizes two key priorities: 1) distinguishing genuine requirements from partisan preferences, and 2) identifying any conflicts between requirements. They also want to avoid trivial or impossible criteria - each must be discriminating. This reminds me of falsifiability in science.

  Hmm, their background in physics is crucial here. They're essentially asking for a "minimum viable framework" - the equivalent of what makes a physical model valid before adding specific equations. The test cases are like benchmark problems. I should resist the temptation to dive into philosophical debates and focus on structural requirements.

  For the desiderata, I consider starting with the most fundamental one: Intentionality. A commemoration must be deliberate to count as such - accidental honorifics aren't commemorations. This handles their "faded referent" case. But is this sufficient? Probably not, since it doesn't address problematic commemorations.

  Public Meaning seems essential too - it's about how the community currently interprets the symbol. This tackles the "displaced erectors" problem where original intent clashes with present understanding. But there's tension here: what if a community misinterprets the intent? 

  Then there's Moral Consistency - we shouldn't celebrate what we condemn elsewhere. This seems necessary for the "scoped monument" case where only selective deeds are highlighted. But how strict should this be? Absolute prohibitions might be too rigid.

  Collective Self-Definition is trickier but important - commemorations shape group identity. This speaks to the "commemorative bargain" case. But it risks majoritarianism. The "dead hand" problem shows why Temporal Sovereignty matters: present communities aren't bound by past decisions. Yet this could enable historical erasure.

  The Representational Range requirement addresses their "exchange rate" concern - not all commemorations carry equal weight. And Procedural Justice handles their "menu of alternatives" question about removal options. 

  Now the hard part: conflicts. For example, Temporal Sovereignty (present community decides) might clash with Historical Continuity (preserving context). And Public Meaning could contradict Intentionality if interpretations drift. There's no perfect solution - theories must prioritize. 

  I notice three requirements doing heavy lifting: Public Meaning (what it symbolizes now), Moral Consistency (ethical coherence), and Temporal Sovereignty (present ownership). Most debates center on these. The other criteria help refine decisions but aren't as decisive.

  For the physics-minded user, I should highlight that Public Meaning is the most discriminating criterion - it separates theories that focus on original intent versus current perception. And the fundamental tension is between respecting history and enabling moral progress - a conflict built into the enterprise.
answer: |-
  Based on your framework and test cases, here are the core desiderata for an adequate theory of commemoration, categorized by strength and conflict potential. Each requirement is grounded in specific cases and designed to be discriminating.

  ### Non-Negotiable Desiderata (Must be addressed by any viable theory)
  1.  **Intentionality:** The act must be *intentionally* commemorative (honorific or memorializing).  
      *   *Why:* Distinguishes genuine commemoration ("Washington St.") from accidental honorifics ("Smith St." named after a landowner). Handles the **Faded Referent** – if intent is entirely lost *and* no honorific meaning persists for *any* community, it ceases to *be* commemoration, becoming opaque naming.  
      *   *Discriminating:* Rules out theories claiming *any* naming is inherently commemorative.

  2.  **Public Meaning (Current Significance):** The theory must account for the monument/symbol's *current* meaning and impact within the relevant public space.  
      *   *Why:* Commemoration operates in the present social context. Addresses **Displaced Erectors** (meaning shifts with the community), **Posthumous Discovery** (new knowledge changes meaning), and **Dead Hand** (the present community experiences the symbol).  
      *   *Discriminating:* Separates theories focused solely on original intent from those prioritizing present experience/significance.

  3.  **Moral Consistency:** The theory must provide a coherent framework for handling figures whose actions include both commendable and condemnable deeds (**Scoped Monument**), and must align with the community's broader ethical commitments.  
      *   *Why:* Commemoration inherently involves moral valuation. A theory cannot ignore the tension between honoring a specific deed and honoring the person who committed reprehensible acts. Must grapple with complex legacies.  
      *   *Discriminating:* Separates simplistic "cancel/keep" binaries from nuanced approaches; rules out theories that deny commemoration implies moral endorsement.

  4.  **Temporal Sovereignty:** The present political community has the legitimate authority to reassess and renegotiate commemorative acts within its jurisdiction (**Dead Hand**, **Displaced Erectors**).  
      *   *Why:* Enduring commemoration requires ongoing societal endorsement; past communities cannot perpetually bind future ones.  
      *   *Discriminating:* Rules out theories based solely on historical entitlement or "original contract" arguments ignoring present consent.

  ### Strong, Contested Desiderata (Essential for adequacy, but interpretation drives disagreement)
  5.  **Context Sensitivity (Representational Range):** The theory must recognize that different commemorative *forms* (statue vs. street name vs. fellowship) carry different weight, context, and expressive power (**Exchange Rate**).  
      *   *Why:* A bronze statue in a public square conveys a stronger, more singular message of honor than a fellowship name or a street sign. Solutions must be proportional.  
      *   *Discriminating:* Separates theories advocating uniform treatment across all forms from those requiring differentiated approaches.

  6.  **Procedural Justice:** Any decision to alter commemoration must involve fair, transparent, and inclusive processes, especially concerning affected descendant or historically marginalized groups (**Commemorative Bargain**, **Displaced Erectors**).  
      *   *Why:* Legitimacy of outcomes depends on legitimacy of process. Addresses power imbalances in historical commemoration and present decisions.  
      *   *Discriminating:* Rules out purely majoritarian or purely technocratic approaches lacking stakeholder engagement.

  7.  **Historical Continuity & Integrity:** The theory must value preserving historical understanding and context, even when altering commemoration (**Deep Past**, **Menu of Alternatives**).  
      *   *Why:* Erasure hinders learning. Distinguishes between *honoring* the past and *understanding* it. Requires solutions beyond simple removal/destruction where possible.  
      *   *Discriminating:* Separates theories advocating removal-without-trace from those mandating contextualization/preservation-as-history. Key for the **Deep Past** line-drawing.

  ### Key Conflicts and the Heavy Lifters
  *   **Fundamental Tension:** The core conflict lies between **Temporal Sovereignty** (present community decides) and **Historical Continuity** (preserve the past for understanding). This tension shapes responses to nearly all cases.
  *   **Most Discriminating Requirement:** **Public Meaning (Current Significance)**. This is the primary fault line. Theories prioritizing original intent regardless of current perception (often conservative) fail this drastically in cases like **Posthumous Discovery** or **Displaced Erectors**. Theories prioritizing solely present offense/values (often activist) can struggle with **Intentionality** or **Historical Continuity**.
  *   **Heavy Lifters:** Three requirements do the most work in excluding popular but inadequate positions:
      1.  **Public Meaning:** Excludes "original intent is all that matters" views.
      2.  **Moral Consistency:** Excludes "ignore the bad because of the good" and "ignore the good because of the bad" absolutes.
      3.  **Temporal Sovereignty:** Excludes "past decisions are irrevocable" arguments.

  ### Addressing Your Cases & "Menu of Alternatives"
  *   **Menu of Alternatives:** The desiderata show these *are* distinct. **Removal** prioritizes **Public Meaning**/**Temporal Sovereignty** by eliminating the honorific presence. **Relocation + Context (Museum)** prioritizes **Historical Continuity** while removing the public honor. **Added Plaque/Counter-Monument** attempts to *change* the **Public Meaning** through contextualization/dialogue, respecting **Continuity** while addressing **Moral Consistency**. **Sunset Clause** explicitly builds in **Temporal Sovereignty**. The best option depends on the weight given to each desideratum in the specific case.
  *   **Exchange Rate:** Handled by **Context Sensitivity**. A fellowship funds ongoing good; its link to the donor's name may be weak. A statue's primary function *is* honorific expression. The moral act differs significantly.
  *   **Commemorative Bargain:** Requires **Procedural Justice** – renegotiation must involve the original parties or descendants fairly. **Temporal Sovereignty** allows revisiting, but **Justice** demands how.
  *   **Deep Past:** **Historical Continuity** strongly favors preservation *as artifact/history*. **Public Meaning** and **Moral Consistency** determine if it still functions *as honor* requiring mitigation (plaque, etc.).

  ### How Major Families Score (Briefly)
  *   **Original Intent Conservatism:** Fails **Public Meaning**, **Moral Consistency** (often), **Temporal Sovereignty**. Excels at **Intentionality**/**Continuity**.
  *   **Presentist Removal/Replacement:** Fails **Historical Continuity**, risks weak **Procedural Justice**, can struggle with **Intentionality**/**Context Sensitivity**. Excels at **Public Meaning**, **Temporal Sovereignty**, **Moral Consistency** (from its view).
  *   **Contextualism/Complex Legacy:** Aims to satisfy all, particularly **Moral Consistency**, **Public Meaning** (via reinterpretation), **Continuity**, **Context Sensitivity**. Struggles most with clear-cut **Temporal Sovereignty** demands for removal and resource intensity of **Procedural Justice**. Most aligned with the full list.
  *   **Proceduralism:** Prioritizes **Procedural Justice**, often deferring substantive outcomes. Must ensure process genuinely addresses other desiderata (**Public Meaning**, **Moral Consistency**).

  **Conclusion:** The list *is* a significant result. It reveals the inherent tensions (Sovereignty vs. Continuity, Meaning vs. Intent) and core demands (Intentionality, Public Meaning, Moral Consistency, Sovereignty) that constrain any viable theory. No theory satisfying all desiderata equally in all cases exists; they involve trade-offs. The most discriminating requirement is **Public Meaning (Current Significance)**, and the most fundamental conflict is between **Temporal Sovereignty** and **Historical Continuity**. A theory must explicitly navigate these to handle your test cases adequately.
