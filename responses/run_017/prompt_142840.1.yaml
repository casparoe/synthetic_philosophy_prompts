  Here's a breakdown of the conceptual differences between historical revisionism and denialism, applied to your specific cases, including the complex scenario you describe:

  **Core Conceptual Differences:**

  1.  **Historical Revisionism:** A legitimate and necessary part of the historical discipline. It involves re-examining existing interpretations of the past based on:
      *   **New evidence:** Discovery of previously unknown archives, documents, artifacts, or testimonies.
      *   **New methodologies:** Application of different analytical frameworks (e.g., social history, gender studies, post-colonial theory).
      *   **Re-evaluation of existing evidence:** Questioning prior assumptions, biases, or interpretations of known sources.
      *   **Goal:** To arrive at a more accurate, nuanced, or complete understanding of the past, even if it challenges established narratives. It operates *within* the framework of scholarly discourse and evidence.

  2.  **Denialism:** The rejection of well-established historical facts and interpretations *not* based on rigorous engagement with evidence, but motivated by ideology, nationalism, racism, or political agendas. It often involves:
      *   **Misrepresentation/Distortion:** Selectively quoting sources, taking things out of context, or twisting evidence.
      *   **Obfuscation:** Creating false debates, demanding impossible standards of proof, or focusing excessively on minor discrepancies to cast doubt on the whole.
      *   **Willful Ignorance:** Dismissing or ignoring vast bodies of evidence (archival, testimonial, forensic, demographic).
      *   **Goal:** Not to understand history better, but to absolve perpetrators, protect national myths, or promote specific ideologies by erasing or minimizing atrocities. It operates *outside* legitimate scholarly discourse.

  **Applying the Concepts: Holocaust, Armenian Genocide, Nanjing Massacre**

  *   **Holocaust Denialism:** Claims the Holocaust didn't happen, or that the number of Jewish victims was vastly exaggerated, or that gas chambers weren't used for systematic murder. Deniers ignore mountains of evidence: Nazi documents detailing the "Final Solution," perpetrator testimonies, victim testimonies, concentration camp infrastructure, demographic data, and postwar trials.
  *   **Armenian Genocide Denialism:** Claims the mass deaths of Armenians in 1915-1917 were not genocide but rather the unfortunate result of civil war, relocation for security reasons, or wartime famine/disease. Deniers downplay or dismiss Ottoman archival evidence (telegrams ordering deportations and massacres), extensive diplomatic correspondence, survivor testimonies, photographic evidence, and demographic studies showing a near-total elimination of Armenians from Anatolia.
  *   **Nanjing Massacre Denialism:** Claims the scale of atrocities committed by Japanese troops in Nanjing (1937-38) is grossly exaggerated, that most deaths were of combatants, or that the event is a Chinese fabrication. Deniers dismiss or challenge the credibility of survivor testimonies, Western eyewitness accounts (diaries, letters, news reports, films), contemporary Japanese soldiers' diaries admitting atrocities, and postwar tribunal findings.

  **The Difficult Case: Acknowledging Deaths, Denying Intent/System/Genocide**

  This scenario is **primarily a form of Denialism**, specifically **Genocide Minimization** or **Genocide Trivialization**. Here's why:

  1.  **Contradicts Established Scholarship & Evidence:** For the Holocaust, Armenian Genocide, and Nanjing Massacre, the *intentionality* and *systematic nature* of the violence are central conclusions derived from overwhelming evidence:
      *   **Holocaust:** Nazi ideology, Wannsee Conference minutes, Einsatzgruppen reports, concentration camp system design, gas chamber technology, specific orders.
      *   **Armenian Genocide:** Ottoman government orders for deportation and massacre, Talaat Pasha telegrams, systematic disarming of Armenians before deportations, organized killing squads, confiscation of property.
      *   **Nanjing Massacre:** Orders from Japanese commanders (e.g., "Kill all Captives"), documented patterns of mass executions, systematic rape, looting, and burning over weeks, eyewitness accounts describing organized killing competitions.
  2.  **Methodological Failures:** Arguments claiming deaths were merely "unintended consequences" typically fail key methodological tests:
      *   **Ignoring Evidence of Intent/System:** They disregard the documentary, testimonial, and circumstantial evidence proving planning and systematic execution.
      *   **Shifting Burden of Proof:** They demand unrealistic levels of proof for intent (e.g., a single signed "genocide order") while dismissing the cumulative weight of diverse evidence that establishes intent beyond reasonable doubt.
      *   **Misrepresenting Context:** They portray war/famine/chaos as the *cause*, ignoring how the perpetrators *created* or *exploited* these conditions to achieve their destructive goals.
      *   **Isolating Events:** They treat killings as isolated incidents rather than parts of a coordinated pattern driven by policy.
      *   **Lack of Falsifiability:** The "unintended consequence" argument is often vague and difficult to disprove definitively, as it can always be invoked regardless of evidence showing orders and patterns.
      *   **Ignoring Scholarly Consensus:** They dismiss the broad consensus among experts who have examined *all* the evidence and concluded intent and systematic action are evident.
  3.  **Functional Equivalence:** Denying the *genocidal character* (intent to destroy a group) when the evidence overwhelmingly supports it serves the same function as outright denial: it absolves perpetrators, minimizes the crime, and attacks the victim group's history and identity. Calling the Holocaust a "tragedy of war," the Armenian Genocide "relocation casualties," or the Nanjing Massacre "wartime chaos" is a deliberate strategy to undermine the specific historical and moral reality.

  **Distinguishing Event Denial from Characterization Denial:**

  *   **Denying the Event Occurred:** Claiming the Holocaust didn't happen, or that mass killings of Armenians didn't occur, or that Japanese troops didn't commit widespread atrocities in Nanjing. This is the most blatant form of denialism.
  *   **Denying the Moral/Legal Characterization:** Acknowledging mass death and suffering occurred, but rejecting the terms "genocide," "crimes against humanity," "Holocaust," or "massacre" (as legally/historically defined). This *can* be a legitimate debate *if* based on genuine scholarly disagreement about interpreting evidence against the specific legal/historical definitions. **However, when applied to events where the evidence for intent and systematic destruction is overwhelming (like the three cases here), denying the characterization "genocide" becomes denialism.** It often involves redefining terms, applying impossible standards, or ignoring the evidence that meets the accepted definition.

  **Methodological Markers Separating Legitimate Revision from Denial:**

  | **Methodological Marker**       | **Legitimate Historical Revisionism**                                                                 | **Denialism**                                                                                                                               |
  | :------------------------------ | :---------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Engagement with the Archive** | Actively seeks out *all* relevant evidence, including new sources; engages critically but fairly with existing archival records. | Selectively uses evidence; ignores, dismisses, or misrepresents inconvenient archival sources; relies on discredited or fringe sources.      |
  | **Falsifiability**              | Presents arguments and interpretations that could be proven wrong by new evidence or logical analysis. | Arguments are often unfalsifiable ("it was just chaos"), rely on conspiracy theories, or shift claims when countered.                       |
  | **Responsiveness to Evidence**  | Willingly adjusts interpretations in the face of credible new evidence or compelling counter-arguments. | Ignores, dismisses, or attacks counter-evidence without substantive engagement; evidence is only used if it supports the predetermined conclusion. |
  | **Consensus-Seeking**           | Engages with the broader scholarly community; aims to contribute to a more accurate understanding, even if challenging consensus initially. | Dismisses or attacks the scholarly consensus as biased or conspiratorial; operates outside mainstream academic discourse.                   |
  | **Allocation of Burden of Proof** | Understands the burden lies with those proposing a *new* interpretation to demonstrate its superiority based on evidence. | Shifts the burden of proof unreasonably onto those accepting the established facts ("Prove Hitler *personally* ordered every death!"); demands impossible levels of proof. |

  **Conclusion:**

  The writer you describe – acknowledging mass death but denying intent, systematic action, or the applicability of "genocide" for events like the Holocaust, Armenian Genocide, or Nanjing Massacre – is engaging in **denialism**, specifically minimization or trivialization. This stance systematically ignores the overwhelming evidence establishing intent and systematic execution inherent in these events. Legitimate historical revisionism involves grappling with *all* the evidence to refine understanding, not dismissing core, evidence-based conclusions to serve an ideological purpose. The methodological failures – ignoring archives, shifting burdens of proof, being unresponsive to counter-evidence, and rejecting consensus without credible alternative scholarship – are the hallmarks that distinguish this denialism from legitimate historical inquiry.
