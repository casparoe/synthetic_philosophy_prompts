prompt: |-
  Hey — act as a profressional philosopher who specializes in the extended mind thesis and philosophy of cognitive science. Please think carefully and brainstorm a bit first, then give me a structured answer.

  Here's the case. A university has a disability-accomodation policy for exams: certain students are allowed to consult a customized external resource, like a searchable personal knowledge base or an AI assistant trained on their own notes, during the exam. The stated rationale is that the resource functions as part of the student's memory or cognitive system, so banning it would be like penalizing someone for having poor biological recall; the point of the exam is to assess their reasoning, not unaided recall. At the same time, if another student secretly used the same resource, that would be treated as cheating.

  What philosophical commitments does this policy presuppose? I want the implicit theory reconstructed: does it strictly presuppose something like the parity principle, or only the weaker claim that external tools can sometimes play a cognitive role? What does it assume about authorship, responsibility, and the boundary of a person's mind? Is the policy consistent with itself — if the laptop is literally part of the student's mind, why is unauthorized use cheating, and if it isn't, why is the accommodation fair? And what would have to change in the policy if we rejected the extended mind claim and treated the device as a mere tool? Please seperate what the practice strictly presupposes from what it merely fits well with, and say where it's underdetermined.
reasoning: |-
  Okay, let me approach this user query methodically. The user presents a fascinating case study in applied philosophy of mind: a university's disability accommodation policy that allows certain students to use external cognitive aids during exams, while prohibiting non-accommodated students from using identical resources. This creates a conceptual tension that demands careful philosophical unpacking.

  First, I need to reconstruct the policy's implicit theoretical commitments. The core rationale - that the resource functions as part of the student's cognitive system - clearly evokes Clark and Chalmers' extended mind thesis (EMT). But does it require full acceptance of the Parity Principle? Probably not strictly. The policy seems to rely more on the weaker claim that external resources can play genuine cognitive roles when properly integrated, without necessarily demanding functional isomorphism with biological processes.

  The cheating distinction reveals interesting assumptions about cognitive boundaries. When an accommodated student uses the device, the policy treats it as continuous with their mind; when another student uses it covertly, it's framed as external assistance. This suggests the policy implicitly endorses a conditional view of cognitive extension: integration matters more than physical location. The key factors appear to be reliability, accessibility, and personalization - echoing Clark's criteria for cognitive extension.

  On authorship and responsibility, the policy seems to assume that properly integrated tools don't undermine agency but rather restore it. For non-accommodated students, the prohibition implies their biological cognition constitutes the "default" system for assessment. There's an unresolved tension here about whether the extended system or the biological individual is the proper locus of evaluation.

  If we rejected EMT entirely, treating the device as a mere tool, the policy would need different justification - perhaps as compensatory mitigation for disability rather than cognitive extension. This would raise new questions about what exactly exams should measure.

  The policy's consistency deserves scrutiny. It maintains a legal/regulatory boundary alongside the metaphysical one - two distinct frameworks operating simultaneously. This isn't necessarily contradictory but reflects practical institutional realities. The policy remains underdetermined regarding certain philosophical nuances, particularly concerning the metaphysics of group cognition and precise criteria for "integration."
answer: |-
  Here’s a structured philosophical analysis of the exam accommodation policy, drawing on the extended mind thesis (EMT) and philosophy of cognitive science. I’ll separate strict presuppositions, compatible commitments, underdetermined aspects, and implications of rejecting EMT.

  ---

  ### **1. Core Philosophical Commitments**  
  *(What the policy strictly presupposes)*  

  - **Conditional Cognitive Extension**:  
    The policy assumes external resources **can become constitutive parts of an individual’s cognitive system** when integrated through reliable, personalized use. This rejects the "brain-bound" view of cognition.  
    *Key implication:* The accommodated student’s device isn’t a "tool" but *part of their mind*. Banning it would amputate their cognitive capacity.  

  - **Function Over Form (Weak Parity)**:  
    It presupposes the **weaker claim of EMT**: external elements can play *the same functional role* as biological memory (e.g., storing/retrieving personal notes). It does **not require strict parity** (e.g., the device need not *resemble* a biological process).  

  - **Cognitive System Boundaries are Context-Dependent**:  
    The mind’s boundary shifts based on **integration and access**:  
    - *Accommodated student:* The device is a scaffolded extension due to **prior authorization, personalization, and training**.  
    - *Non-accommodated student:* Secret use lacks integration; the device remains an external prop.  

  - **Responsibility Follows the Extended System**:  
    Authorship of reasoning resides in the **coupled system** (student + device). The exam assesses outputs from this system, just as it would assess a neurotypical student’s biological memory.  

  ---

  ### **2. Compatible but Not Required Commitments**  
  *(What the policy fits well with but doesn’t strictly need)*  

  - **Embedded Cognition**: Even without full EMT, the policy aligns with the view that cognition *leans on* external resources (e.g., Hutchins’ distributed cognition).  
  - **Values in Cognitive Diversity**: The policy implicitly values assessing reasoning over rote recall, reflecting situated/embodied cognition theories.  
  - **Disability Justice**: It frames accommodations as restoring epistemic agency, not conferring advantage.  

  ---

  ### **3. Tensions and Consistency**  
  #### **Q: If the laptop is part of the mind, why is unauthorized use cheating?**  
  - **Regulatory Boundary vs. Metaphysical Boundary**:  
    The policy distinguishes between:  
    - *Cognitive metaphysics* (what *constitutes* a mind).  
    - *Institutional rules* (what *counts* as a permissible extension in an assessment context).  
    Unauthorized use violates **procedural integrity**, not metaphysics. The non-accommodated student’s device isn’t improperly integrated *for the purpose of the exam*.  

  - **Integration Requires Legitimacy**:  
    EMT emphasizes that extension depends on trust, accessibility, and history of use. Secret use lacks the **stable coupling** and **institutional recognition** that define the accommodated student’s system.  

  #### **Q: If the laptop isn’t part of the mind, why allow it?**  
  The policy *does* treat it as part of the mind for accommodated students. For others, it’s an illicit external aid because:  
  - Their cognitive system (as defined by exam rules) is their biological capacity.  
  - Using the device breaches the **contract of evaluation** (i.e., "demonstrate *your* unaided reasoning").  

  **Consistency Verdict**: The policy is **internally consistent** by recognizing two boundaries:  
  1. *Metaphysical*: The device is part of the accommodated student’s mind.  
  2. *Normative*: Unauthorized devices are excluded by social agreement.  

  ---

  ### **4. Rejecting the Extended Mind Claim: Consequences**  
  If we treat the device as a "mere tool":  
  - **Accommodation Loses Its Rationale**: Permitting it would be seen as **compensatory leniency**, not cognitive integration. This risks framing disability as "deficit to be offset" rather than diversity in cognitive architecture.  
  - **Cheating Accusations Strengthened**: Unauthorized use would unambiguously be "external aid," making the policy asymmetrical.  
  - **New Justification Needed**: The policy might appeal to:  
    - *Equity*: "Leveling the playing field" for disabled students.  
    - *Pragmatism*: Testing reasoning without penalizing memory limits.  
    But this abandons the deeper EMT claim that the tool *is* the student’s memory.  

  ---

  ### **5. Underdetermined Aspects**  
  The policy leaves open:  
  - **Degree of Integration**: How personalized/accessible must a resource be to qualify? (e.g., Is a generic AI "extended mind"?)  
  - **Authorship of Outputs**: If an AI generates novel insights, is it the *student’s* reasoning? (EMT struggles with generative tools.)  
  - **Scalability**: Could *all* students eventually use such tools? (The policy implies disability-specific integration, but EMT is universalist.)  

  ---

  ### **Conclusion**  
  The policy **strictly presupposes** that cognition can extend into external resources when those resources are functionally integrated into an individual’s cognitive system. It **does not require** the strong Parity Principle but relies on a context-dependent view of the mind’s boundaries. The cheating distinction hinges on **institutional legitimacy of cognitive integration**, not metaphysical inconsistency. Rejecting EMT would force the policy into a weaker "equity accommodation" framework, losing its grounding in the philosophy of mind.  

  This reflects a socially embedded application of EMT: cognitive boundaries are shaped by *practical negotiation* as much as by functional criteria.
