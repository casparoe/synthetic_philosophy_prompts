prompt: |-
  I'm working on a piece about how funders decide a field has stopped going anywhere, and I keep circling back to one person — a senior programme officer at a big biomedical foundation who talks about this stuff in public more than anyone in her job has to, and who does it in Lakatos's vocabulary: hard core, protective belt, progressive versus degenerating problem shifts. Here's her track record as near as I can reconstruct it from her talks and from panel decisions people have described to me.

  She says phlogiston was degenerating: it bolted on auxiliaries, swallowed every anomaly, and never stuck its neck out on anything new and been right about it. She says Wegener's original drift theory was degenerating at the time it was being argued about, even though it turned out to be onto something, and that plate tectonics after 1960 was progressive, because the seafloor-spreading and magnetic-striping business was content the theory called in advance. She says the neutrino was progressive, and she's explicit that it started life as a rescue device for energy conservation in beta decay — it outgrew its origins. She says Vulcan, the planet Le Verrier parked inside Mercury's orbit, was degenerating: same move, no payoff. She calls string theory theoretically progressive and empirically stalled, and keeps a small slice of the portfolio in it anyway, which not everyone at the foundation is happy about. And she cut a programme in her own portfolio that spent ten years explaining away null results by saying the effect only shows up under conditions nobody could specify.

  The one I can't call is also in her portfolio, and I've changed the details so she won't recognise it. About fifteen years old, a couple hundred labs, hard core intact and unchanged: that a certain cognitive capacity is carried by a particular kind of slow synchronized oscillation, and that the oscillation is the mechanism rather than a readout of something else. Every failed replication in the last decade has been absorbed by a new auxiliary added after the fact and tailored to the failure it was saving — the oscillation is real but transient, or it's in a different cortical layer than anyone sampled, or it only appears in a behavioural state nobody was recording. Then, about eighteen months ago, one of those add-ons — the one about phase relationships across layers — was fed into a large simulation and spat out an odd quantitative prediction: a specific asymmetry between the rising and falling phase of the cycle, at a specific ratio, in the local field potential. It wasn't what anyone was looking for. They built a new electrode array to go find it, and it's there. As far as I can tell the result is real.

  Three complications. The array was calibrated against simulated data generated by the same model. The signature was picked out of a scan across a few thousand candidate summary statistics, so there's the usual look-elsewhere headache. And the field has quietly split into three variants that disagree about whether the oscillation is a mechanism or a readout — they've started calling that disagreement interpretational and counting each other's positive results as support for the framework as a whole. Meanwhile the analysis tools the programme built are now standard across neuroscience, including in the labs that generate its confirming data.

  So: what does she say, and what should she say if she wants to be consistent with herself? I'm less interested in the answer than in the rule she's running. Is it a strict novel-fact rule where the prediction has to come before the observation? Or Lakatos's own weaker version, where a fact can count as novel even if it was already known, so long as it wasn't used in building the theory — which would make the timing of the prediction beside the point? Is it theoretical progress plus patience, so a programme that keeps generating content and instruments gets funded even when the empirical scorecard is muddy? Or is she really running something more like an institutional-hygiene rule, about calibration circularity and search spaces and whether a framework that can't say what its own hard core is is one programme at all? Which of those rules fit all nine of her previous calls, where do they come apart on this one, what's your best guess and why, and what single further case would actually tell them apart?
reasoning: |-
  Okay, let me tackle this user's query. They're writing a piece about how funders decide a field is stagnating, focusing on a senior program officer at a biomedical foundation. This officer uses Lakatos's philosophy of science—hard core, protective belt, progressive vs. degenerating problem shifts—to evaluate research programs. The user has outlined several historical examples where she made calls, and now presents a neuroscience case study with three complications. They want to know what she would say about this case to stay consistent, and what rule she's actually applying.

  First, I need to unpack Lakatos's framework. The hard core is the untouchable part of the theory, while the protective belt consists of auxiliary hypotheses that can be adjusted to protect the core. A progressive problem shift introduces novel predictions that lead to new discoveries, while a degenerating one keeps adding ad-hoc explanations without new insights. 

  Looking at her track record: She cut phlogiston and Vulcan for degenerating—they kept adding auxiliaries without novel predictions. Wegener's drift was degenerating initially, but plate tectonics became progressive with seafloor spreading predictions. Neutrino started as a rescue device but grew progressive. String theory is theoretically progressive but empirically stalled, so she keeps minimal funding. She also cut her own program for explaining away null results with unspecified conditions. Consistency matters here.

  Now the neuroscience case: 15 years old, hard core unchanged (slow oscillation as mechanism, not readout). Past decade saw failed replications absorbed by ad-hoc auxiliaries (transient, wrong layer, unrecorded state). But 18 months ago, an auxiliary (phase relationships) led to a novel prediction—a specific asymmetry in the LFP. They built a custom electrode array and found it. The result seems real, but with three complications: array calibrated against the model (circularity?), signature found among thousands of statistics (look-elsewhere effect), and the field splitting into three variants that still count each other's positives as support. The analysis tools are now widely used.

  The user's core question is about her rule. Is it strict novelty (prediction before observation)? Lakatos's weaker novelty (fact not used in building theory)? Theoretical progress plus patience? Or institutional hygiene (circularity, search spaces, coherence)?

  Applying her history: She tolerates string theory's empirical stall due to theoretical progress, so strict novelty isn't absolute. But she cut her own program for ad-hoc explanations, showing low tolerance for degenerating shifts. The neuroscience case has a late-stage novel prediction from an auxiliary, similar to neutrino's origin. However, the complications are red flags—calibration circularity and look-elsewhere effect undermine empirical weight. The field's fragmentation suggests the hard core isn't unified anymore, which violates Lakatos's coherence requirement.

  Her likely verdict: Degenerating. Why? The novel prediction emerged from an auxiliary added to save the theory, not from the hard core. The empirical support is tainted by circularity and multiple testing. The split into variants indicates the protective belt is diverging without a unified core, making it multiple programs masquerading as one. This mirrors her cut on the program that couldn't specify conditions—here, the core's meaning is now ambiguous.

  But consistency check: Neutrino started as a rescue device too. Key difference—neutrino's predictions were independent and led to new physics; here, the prediction is model-bound and tools are circular. Also, plate tectonics had clear prior predictions. 

  The rule seems to be: Tolerate initial ad-hoc moves if they lead to independent, risk-taking predictions. Reject if auxiliaries stay tuned to anomalies without generating clean tests, especially with methodological red flags. Coherence matters—if the hard core's meaning fragments, it's degenerating.

  Best guess: She cuts funding. The novel prediction is too little, too late, and compromised. The split variants and tool circularity push it into hygiene territory. To confirm her rule, compare with neutrino: Did it have similar methodological issues early on? If not, her tolerance for rescue devices is context-dependent, requiring clean empirical pathways later.
answer: |-
  Based on her track record and Lakatos's framework, here's a breakdown of how she'd likely evaluate this neuroscience programme, the rule she's implicitly running, where it gets ambiguous, and how to resolve it:

  ### 1. **Her Likely Verdict: Degenerating (with high probability)**
     - **Why?**
       - **Core Issue:** The "novel" prediction *originated from an auxiliary hypothesis*, not the hard core. The hard core ("oscillation = mechanism") remained passive and unchanged. Lakatos values predictions *derived from the core* driving new tests. Here, the prediction emerged from a protective-belt add-on (phase relationships) crafted to absorb prior failures.
       - **Ad-Hocness Pattern:** A decade of failed replications was absorbed by tailored, post-hoc auxiliaries (transience, location, state-dependence). The phase relationship auxiliary followed the *same pattern* – it was added to save the theory, and the "prediction" was a *byproduct* of that rescue move, not a deliberate core-driven risk.
       - **Methodological Red Flags:** The calibration circularity (array tuned to model data) and look-elsewhere effect (thousands of statistics scanned) severely undermine the empirical weight of the "confirmation." This fits her hygiene concerns about rigour.
       - **Fragmentation:** The split into 3 variants arguing over whether the oscillation is mechanism *or* readout directly attacks the *hard core's coherence*. If the core can't be consistently defined, Lakatos would argue it's no longer a single programme. Counting *all* positive results as support regardless undermines falsifiability.

  ### 2. **The Rule She's Running: A Hybrid "Progressive Trajectory + Methodological Hygiene" Rule**
     Her decisions consistently prioritize **whether the programme generates *new, testable, and independently verifiable content* driven by its core**, while penalizing methodological degeneracy. It's not one strict rule, but a combination:
     - **Core-Driven Novelty (Lakatos-Weakened):** She favours theories that *successfully predict* novel facts (not necessarily *before* discovery, but *independently* of the anomaly they explain). Phlogiston/Vulcan failed. Plate tectonics/neutrino succeeded. String theory gets a pass for theoretical novelty *despite* empirical stall.
     - **Anti-Ad-Hocness:** Auxiliaries added solely to explain away failures *without* generating new, risky predictions are degenerate (her own cut programme, Vulcan). If they *do* generate new predictions (like the neutrino eventually did), they can become progressive.
     - **Institutional Hygiene:** She penalizes circularity, unfalsifiable flexibility, and loss of core coherence (calibration issues, look-elsewhere effects, fragmentation). Tools being useful elsewhere is irrelevant to the *programme's* progress.
     
     **Why it fits her track record:**
     - **Phlogiston/Vulcan:** No novel predictions, pure ad-hoc absorption → Degenerating.
     - **Wegener:** Ad-hoc additions pre-plate tectonics → Degenerating *at the time*.
     - **Plate Tectonics:** Core-driven *novel predictions* (seafloor spreading/magnetism) → Progressive.
     - **Neutrino:** Started as ad-hoc (rescue device) but generated *independent, novel predictions* (detection methods, new physics) → Progressive.
     - **String Theory:** Theoretically progressive (novel math/structure), empirically stalled → Funded minimally.
     - **Her Own Cut Programme:** Ad-hoc auxiliaries with *no* novel predictions → Degenerating.

  ### 3. **Where the Rules Come Apart on This Case**
     - **The Ambiguity:** The phase relationship auxiliary *did* generate a novel prediction (asymmetry) that was confirmed. This mirrors the neutrino's origin story. Is this a "progressive shift" within a degenerating phase?
     - **Her Likely Resolution:** 
       - **Timing & Origin:** The prediction arose *from an auxiliary added post-hoc*, not the core. It wasn't a *deliberate* risky test devised by the core theory. It was an *accidental byproduct* of saving the theory. Contrast with plate tectonics/neutrino where predictions were *central goals*.
       - **Methodology:** The calibration circularity and look-elsewhere effect make the "confirmation" epistemically weak – it doesn't demonstrate the *programme's* predictive power cleanly. This triggers her hygiene rule.
       - **Fragmentation:** The core is now contested (mechanism vs. readout), violating Lakatos's requirement for a stable, unified hard core guiding research. It's becoming 3 programmes.

  ### 4. **Best Guess & Why: Degenerating**
     - **Why:** The "novel" fact is (a) born from a rescue auxiliary, (b) methodologically compromised, and (c) occurs alongside core fragmentation and a decade of ad-hoc adjustments. The *pattern* outweighs the single "success." She'd see this as a last-gasp anomaly absorption, not a shift to progress. The tools' success elsewhere is irrelevant to *this programme's* degenerative state. She'd likely wind down funding, citing loss of core coherence and persistent ad-hocness.

  ### 5. **The Single Case to Tell Rules Apart: A "Neutrino-Like" Scenario in a Struggling Field**
     Imagine this neuroscience programme instead:
     - After years of ad-hoc adjustments to explain failures, the core (oscillation=mechanism) is used to predict a **completely novel phenomenon** *unrelated to the anomalies it was explaining* (e.g., "This oscillation *must* cause a specific impairment in a *different* cognitive task we haven't studied yet").
     - This prediction is **risky and specific** (not fished from a data scan).
     - It's **confirmed with methodologically rigorous**, independent experiments (no circular calibration).
     - The core remains **stable and unified**.

     **Why this tells rules apart:**
     - **Strict Novelty (Prediction Before Observation):** Fails – prediction came after struggles.
     - **Lakatos Novelty (Independent Fact):** Passes – novel fact not used to build the theory.
     - **Theoretical Progress + Patience:** Passes – core generated new, confirmed prediction.
     - **Hygiene Rule:** Passes – no critical flaws.
     
     **If she funds THIS:** She prioritizes Lakatos novelty/theoretical progress despite prior ad-hoc phases.  
     **If she cuts THIS:** She's stricter on ad-hocness or requires prediction *before* significant degeneration.  

  In your neuroscientist's case, the prediction wasn't independent (born of a rescue), wasn't cleanly tested, and the core fragmented. Her likely call is "degenerating" – consistent with her history of penalizing theories that survive by endlessly adapting their protective belts without core-driven renewal. The single "success" looks more like a final ad-hoc adjustment than a true progressive turn.
