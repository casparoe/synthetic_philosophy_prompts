prompt: |-
  I teach a mid-level seminar on moral responsibility, and a group of students active in the effective altruism movement — they run our campus giving pledge — have pressed me on a practice I can't reconstruct cleanly. The practice is earning to give: a student who wants to do the most good takes the highest-paying job available, frequently at a firm whose business she would independently describe as predatory, and gives away half her salary to a charity distributing insecticide-treated bed nets against malaria. What interests me is that the defense of the practice and the scruples surrounding it seem to pull in opposite directions. The defense is the move I'll call slot-replaceability: if she turns the job down, the firm hires the next candidate; the lending, the drilling, or the ad targeting goes on regardless; and the only party who ends up worse off is the person who doesn't get the net. Her occupancy of the role makes no difference to the harm, so the harm cannot be charged to her, and the donation is pure gain. But the same students are fastidious about something like complicity: they will not take consulting fees from a fossil-fuel company even when the fee would buy the very same nets, they treat a summer at a tobacco firm as discreditable, and they care that their own name and labor not be attached to the thing. Counterfactual difference-making here; non-causal association there. A colleague in metaphysics tells me the slot argument is just the standard preemption case wearing a costume, but I'm not convinced the students' case has the right structure for that.

  So I'd like the implicit theory reconstructed, with the distinctions made explicit. Does the practice strictly presuppose a difference-making view of causal responsibility for harm, or could a view on which agency carries non-causal significance — complicity, integrity, what an action expresses or endorses — license both halves at once, and if so, how does it avoid collapsing into the consequentialism it was supposed to be an alternative to? Is slot-replaceability even sound, or does it trade on confusing the replaceability of a person with the replaceability of an output: if the harmful activity expands to absorb whichever labor is available, rather than being fixed per position, the marginal analysis changes, and I want to know how much of the practice survives once it does. Notice also that slot-replaceability, taken at face value, seems to entail that the colleague who takes the identical job and spends everything on himself does no wrong beyond failing to donate — should the students accept that, and does the practice actually require it? And there is the odd question of the money itself: the practice treats a dollar earned at a predatory firm as exactly as good, once transferred, as a dollar earned anywhere, which presupposes something about whether dollars carry their causal history with them or are morally laundered by the act of giving. Finally, the value theory: the students rank candidate charities in a single spreadsheet column, dollars per life saved, and everything that cannot be entered in that column — dignity, political empowerment, whether the recipients were consulted — silently counts as zero rather than as unknown. Is that a commitment to commensurability the practice really needs, or could a view on which some goods are incomparable rather than worthless generate the same funding pattern for quite different reasons?

  I'm rewriting my lecture on overdetermination and would like to open with this as a case, so what I need is the architecture rather than a verdict: which of these commitments the practice strictly presupposes, which it merely fits comfortably with, where its parts presuppose inconsistent things, and what would have to change in the practice if each commitment were given up in turn. Please don't tell me whether earning to give is fine; tell me what has to be true for it to be fine, and where it is philosophically underdetermined.
reasoning: |-
  Hmm, the user is teaching a seminar on moral responsibility and is grappling with the ethical tensions in the "earning to give" practice advocated by effective altruism students. They're particularly interested in reconstructing the implicit theoretical commitments behind this practice and its apparent contradictions.

  The core tension lies between two ethical logics: the consequentialist defense using "slot-replaceability" (where taking a harmful job doesn't increase net harm since someone else would do it anyway) and the non-consequentialist scruples about complicity (refusing association with harmful industries). The user wants this implicit theory made explicit.

  Key questions emerge:
  - Can non-causal views of responsibility (complicity/integrity) coexist with slot-replaceability without collapsing into consequentialism?
  - Is slot-replaceability logically sound? What if job markets are elastic rather than fixed?
  - Does the practice imply that earning through harm is neutral as long as you donate?
  - Does money get "morally laundered" through donation?
  - Is the strict quantification of charity impact (dollars per life saved) necessary to the practice?

  The user specifically wants philosophical architecture, not verdicts. They need to identify which commitments are essential to the practice, which are flexible, and where inconsistencies might exist. This is for a lecture on overdetermination, so the focus should be on mapping conceptual dependencies.

  The practice seems to require at minimum: 1) a counterfactual difference-making view of harm, 2) fungibility of money across sources, and 3) strong commensurability of moral value. The complicity concerns appear to be non-essential tensions within the students' broader worldview.

  Notably, slot-replaceability becomes unstable if labor markets are elastic rather than fixed-per-slot. The money laundering question reveals a deeper commitment to consequentialism - if the donation's impact washes the money clean, this presupposes that only consequences matter. The strict quantification seems practically necessary for the model's operation, though theoretically adjustable if replaced with rough comparability.

  The students' behavior suggests they haven't fully reconciled these tensions. Their rejection of fossil fuel consulting fees while accepting predatory jobs indicates either inconsistent application of principles or additional variables (like reputational effects).
answer: |-
  Below is a structural reconstruction of the ethical architecture implied by "earning to give" (EtG), its tensions, and the philosophical commitments required for its defense. I’ll address your questions systematically, distinguishing **strict presuppositions** (necessary for the practice), **comfortable fits** (commonly associated but not essential), **inconsistencies**, and **alternatives** under revised commitments.

  ---

  ### **I. Core Defense: Slot-Replaceability**
  - **Strict Presupposition**:  
    A *counterfactual difference-making view of causal responsibility*.  
    - Harm requires that your action *causes* a net increase in harm compared to your inaction.  
    - If the job’s harmful outputs occur identically whether you take it or not (i.e., the "slot" is filled by someone else), you cause *no additional harm*.  
    - **Consequence**: Accepting the job is morally neutral; donating the income is pure moral gain.  

  - **Critical Weaknesses**:  
    1. **Elasticity of Harm**:  
       - If the firm *expands* operations based on labor availability (e.g., hiring two analysts if two qualified candidates apply), your participation *does* increase harm.  
       - **Presupposition at Risk**: Slot-replaceability collapses unless harmful outputs are *fixed per role* (rare in growing industries).  
       - *Practice Adjustment*: EtG defenders must assume inelastic demand for labor/harm. If falsified, the "no harm" claim fails.  
    2. **The Colleague Test**:  
       - Slot-replaceability implies your colleague (same job, no donation) commits *only* the wrong of *not donating* (a failure of beneficence), not complicity in harm.  
       - **Student Tension**: EA students likely reject this. Their complicity scruples suggest a *non-causal* view of responsibility inconsistent with pure slot-replaceability.  

  ---

  ### **II. Non-Causal Commitments: Complicity vs. Consequentialism**  
  - **The Tension**:  
    - *Defense (Consequentialist)*: Only counterfactual outcomes matter.  
    - *Scruples (Non-Causal)*: Actions express endorsement, implicate integrity, or generate symbolic complicity, regardless of outcomes.  

  - **Can Non-Causal Views License Both Halves?**  
    - **No**, without collapsing into consequentialism.  
      - If symbolic complicity *in itself* constitutes harm (e.g., normalizing predation), then taking the job is *pro tanto* wrong, even if slot-replaceability holds.  
      - To avoid this, EtG *must* treat non-causal concerns as irrational "dirty hands" feelings—else the "pure gain" argument fails.  
    - **Exception**: A *threshold deontology* could permit complicity if the good done (e.g., lives saved) vastly outweighs symbolic harm. But this:  
      - (a) Quantifies the symbolic harm (conceding commensurability),  
      - (b) Effectively becomes consequentialism.  

  - **Student Inconsistency**:  
    Their rejection of fossil fuel consulting fees (despite identical slot-replaceability) reveals:  
    - An implicit *expressive theory*: Association expresses endorsement.  
    - **Where EtG Fits Comfortably (But Not Necessarily)**:  
      Act-consequentialism (AC). AC can dismiss complicity if no harm is caused. Non-AC views struggle.  

  ---

  ### **III. Money and Moral Laundering**  
  - **Strict Presupposition**:  
    *Fungibility of Money*: A dollar’s moral value depends *only* on what it *does* when donated, not its source.  
    - **Why?** If dollars retained "tainted" causal histories, the donation would inherit complicity. EtG treats giving as a "reset."  
    - **Philosophical Anchor**: Consequentialism (money’s impact is all that matters). Non-consequentialist views (e.g., Kantianism) often reject fungibility.  

  - **Alternative View**:  
    If money is "tainted," EtG requires *double counterfactual justification*:  
    - "Not only would harm occur without me, but this money *would not exist for donation* without this job."  
    - **Risk**: If predatory profits fund further harm, the dollar’s net effect may be negative.  

  ---

  ### **IV. Value Commensurability**  
  - **Strict Presupposition for Current EA Practice**:  
    *Strong commensurability*: All goods (lives, dignity, empowerment) can be ranked on a single scale (e.g., DALYs/QALYs).  
    - Unquantifiable goods are treated as *moral weights = 0* in cost-effectiveness calculations.  
    - **Necessity for EtG?**: Yes, for the "pure gain" claim. If bed nets save lives at $3,000 each, but cause disrespect (an incommensurable bad), the "gain" could be undermined.  

  - **Weaker Alternative**:  
    *Rough comparability*: Goods are incomparable *in theory* but comparable *in practice* when differences are extreme.  
    - **Example**: Bed nets save a life for $3,000; an empowerment program costs $500,000 per life but adds dignity. We can judge nets better *without* a universal scale.  
    - **Practice Adjustment**: EtG survives if bed nets are *clearly* better than alternatives on any plausible weighting. Commensurability is practically useful but not strictly necessary.  

  ---

  ### **V. Summary: Commitments & Adjustments**  
  | **Commitment**               | **Strictly Required for EtG?** | **If Abandoned/Revised**                                                                 |  
  |------------------------------|--------------------------------|------------------------------------------------------------------------------------------|  
  | **Slot-replaceability**      | Yes (as defense)              | Practice collapses if harm is elastic. Adjust: Only target roles in saturated/static job markets. |  
  | **Counterfactual harm view** | Yes                            | Non-causal responsibility (complicity) undermines EtG unless treated as negligible.      |  
  | **Money fungibility**        | Yes                            | If money is tainted, EtG requires additional justification (e.g., net harm reduction).   |  
  | **Strong commensurability**  | No (but assumed in practice)   | EtG works with rough comparability if bed nets are *robustly* better than alternatives.    |  
  | **Consequentialism**         | Yes (for coherence)            | Non-consequentialist scruples (e.g., integrity) conflict with EtG; students are inconsistent. |  

  ---

  ### **VI. Philosophical Underdetermination**  
  - **Where the Practice is Flexible**:  
    - The *degree* of commensurability: Weak comparability suffices if bed nets dominate alternatives.  
    - The *scope* of slot-replaceability: It holds for some jobs/industries (e.g., replaceable tech roles) but not others (e.g., R&D where labor grows output).  
  - **Where Inconsistencies Arise**:  
    - Students’ complicity concerns (non-causal) clash with EtG’s causal harm-neutrality. This reveals either:  
      - A psychological bias (they feel complicity but concede it’s irrational),  
      - Or an unresolved pluralism (they weight non-causal factors *unless* countervailing good is extreme).  
  - **Architecture for Your Lecture**:  
    EtG is a case study in how **causal overdetermination** (slot-replaceability) interacts with:  
    - *Non-causal theories* (complicity as expressive harm),  
    - *Value aggregation* (commensurability vs. incommensurability),  
    - *Marginal causation* (elastic vs. fixed harm).  

  The practice "works" only under specific empirical and normative premises. Challenge students to articulate their implicit weightings—or concede consequentialism’s primacy.

  Would you like a slide outline or discussion questions for your lecture?
