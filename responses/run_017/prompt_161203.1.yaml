    C: (0+0+2+1+1) = 4  
    Social ordering: A > B > C (A wins, C loses).  
  - **Pairwise comparisons:**  
    A vs B: 3–2 (B wins: Voters 1,2,3 vs 4,5)  
    A vs C: 4–1 (A wins)  
    B vs C: 3–2 (B wins)  
    Transitive majority: B > A > C (Condorcet winner: B).  
  - **After C withdraws:** Borda count (1-0) on A and B:  
    A: (0+0+0+1+1) = 2  
    B: (1+1+1+0+0) = 3  
    Social ordering: B > A (reverses A and B).  

  Conditions satisfied:  
  (i) A Borda winner, C loser.  
  (ii) C is Voter 3’s top choice.  
  (iii) B beats A 3–2 pairwise.  
  (iv) Withdrawal of C flips A vs B.  

  ### What does the work
  The flip arises from asymmetry in C’s position relative to A and B:  
  - Only 1 voter (Voter 3) ranks C above A.  
  - But 3 voters (Voters 3,4,5) rank C above B.  

  When C is removed, A loses support from voters who ranked C above B but not above A (Voters 4,5: A was boosted by being above C). B gains from voters who ranked B above A regardless of C (Voters 1,2,3).  

  **Proof:** Modify the profile to eliminate asymmetry (e.g., change Voters 4 and 5 to A > B > C):  
  - A: (1+1+0+2+2) = 6 → Borda: A=6, B=7, C=2 → B wins.  
  - Original conditions (i) and (iv) fail. The asymmetry is essential.  

  ### The defence
  A Borda defender argues: IIA is overly restrictive when rules use positional information (e.g., Borda counts rankings). The flip reflects legitimate intensity (A’s high ranks vs B’s consistency). Arrow’s theorem forces a trade-off: any non-dictatorial, Pareto-efficient, transitive rule using more than pairwise data must violate IIA. The cost is vulnerability to agenda changes (e.g., candidate withdrawal), but Borda may better reflect overall preference intensity.  

  ### IWL
  **Is IWL strictly weaker than IIA?** Yes. IIA implies IWL: if social ranking of any pair depends only on that pair, removing a loser (irrelevant to other pairs) cannot affect the rest. But IWL only regulates removal of the loser, not other alternatives.  

  **Is there a rule satisfying Pareto, non-dictatorship, completeness, transitivity, and IWL?** Yes. **Copeland’s method** (score = wins minus losses in pairwise contests; order by score, with alphabetical tie-breaking):  
  - **Pareto:** If all prefer X>Y, X beats Y pairwise, so X’s score > Y’s.  
  - **Non-dictatorship:** Collective, not single-voter.  
  - **Completeness/transitivity:** Scores induce total order.  
  - **IWL:** Removing the loser (lowest score) only eliminates their pairwise contests; the relative Copeland scores of others (based on remaining pairs) match the original subordering.  
  Example: In the original profile, Copeland scores: B=2 (beats A,C), A=0 (beats C, loses to B), C=-2. Order: B>A>C. Remove C: B beats A (score B=1, A=-1), order: B>A — unchanged.  

  **Condorcet and cycle notes:** The profile has a Condorcet winner (B) and no cycle (majority order is transitive). Adding a Condorcet winner requirement does not block the flip (as here), but highlights Borda’s failure to always elect Condorcet winners.  

