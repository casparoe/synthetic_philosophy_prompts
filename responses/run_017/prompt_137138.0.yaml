prompt: |-
  I serve on the Algorithmic Priorities Board of our city, a nine-member body that must approve, before each fiscal year, the objective that the Office of Data and Evaluation uses to rank capital projects — road resurfacing, sidewalk and transit-shelter accessibility work, tree-canopy and park renewal, stormwater retrofits — in the model that allocates the participatory capital budget across districts. Our vote is binding and must be recorded with written reasons.

  For the coming fiscal year the Office has asked us to replace the current ranking rule, which weights residents' stated requests with a population adjustment, with a two-stage target its memo calls Community Volition. Stage 1 elicits substantive priorities from a stratified sample of residents. Stage 2 extrapolates them: a budget-literacy briefing corrects factual error about what the capital budget can legally be spent on; respondents then revise their rankings after reading anonymized arguments written by other respondents, which is meant to stand in for deliberation; and a vendor-supplied language model runs a coherence pass that identifies conflicts among a respondent's own answers and resolves them. Staff argue that raw responses encode residents' adaptation to long-standing underinvestment in some districts, misinformation about how much of the budget is already committed, and the turnout advantage of districts that already participate most.

  The Board is split. Three of us hold that the extrapolated target is unfalsifiable in the specific sense that it lets staff and their vendor substitute their own judgment for residents' and describe the result as the residents' own. Two hold that any procedure which stops at stated preference simply launders the status quo through a survey. One member has circulated a note urging us to consider a narrower variant, fact-corrected stated preference, which would correct only demonstrable factual error about the budget and would attempt neither simulated deliberation nor coherence correction. I have undertaken to draft the decision memo the Board will vote on in three weeks, before the vendor contract's sixty-day renewal window closes.

  Please write that memo, addressed to the Board.

  It should state a bottom line — approve Community Volition, reject it, or approve it in a restricted form, and if the last, specify precisely which stage survives — and then defend it. Along the way it should deal with the following, which are the matters the Board is actually arguing about.

  Staff's own pilot is the source of our difficulty rather than a resolution of it. Under their protocol the top-ranked district priority shifted from arterial road resurfacing to sidewalk and transit-shelter accessibility; staff attribute the shift to the briefing and the deliberation stage. But the pilot also showed that the ordering was unstable: a longer briefing and a stricter coherence rule each changed the ranking substantially, and where respondents proved to hold intransitive pairwise preferences the vendor's cycle-breaking rule did visible substantive work, in one case reversing a district's stated first and third priorities. I want the memo to say what the Board should require about the stability of the extrapolated target before it can be treated as the residents' will rather than as an artifact of the protocol the vendor happened to choose, and to say how stable is stable enough, given that we must decide in three weeks rather than in principle.

  It should then address legitimacy rather than accuracy: whether a target that no resident can reconstruct or contest without a statistics team can ground a public and binding ranking, and whether anything short of abandoning extrapolation would repair that defect. One option some of us have discussed is a retrospective endorsement check, in which a fresh sample is shown both the stated-preference ordering and the extrapolated ordering, is told how each was produced, and is asked which it would endorse; the Board would then treat low endorsement of the extrapolated ordering as a reason not to deploy it. Say whether you recommend that, what threshold you would set, and why that test bears on the question we face rather than merely on whether residents like the outcome.

  It should also settle a scope question we have been avoiding. The projects that the extrapolated target promotes are disproportionately ones whose beneficiaries are children, elderly residents, people with disabilities, and people who will move here later; the sample that generates the target is current adult residents. Say whether the relevant population for the extrapolation should include future residents, and whether that is a decision for the Board to make explicitly or one that may be left to the protocol.

  Finally, give the strongest argument against your own recommendation a full paragraph, in the form the member who most disagrees with you would put it, and state what evidence, if it came back from the pilot, would lead you to change your position.

  The memo is for the public record. It should rest on argument alone, cite no literature and recommend no reading, and be intelligible to a Board member who has never encountered the philosophical debate about idealized preferences; it may nonetheless engage the extrapolated-volition framing from AI-alignment work if doing so helps. Include a dated implementation schedule with the decision points between now and the fiscal year, and pre-registered criteria for counting the pilot a failure. Aim for roughly 1,200 words.
reasoning: |-
  Okay, the user is part of an Algorithmic Priorities Board and needs to draft a memo for a crucial vote on changing how capital projects are ranked. The memo must address several complex issues: protocol stability, legitimacy concerns, population scope, and include counterarguments. 

  Hmm, the user's position seems nuanced - they're clearly wrestling with ethical and practical tensions. The core dilemma is between capturing "true" preferences versus maintaining democratic transparency. Staff's proposal (Community Volition) tries to correct for systemic biases but introduces new problems of interpretability and artificial stability. 

  First, the stability problem really jumps out. The pilot showed rankings change dramatically based on minor protocol tweaks - that's alarming. If the outcome depends entirely on how long the briefing is or how the vendor breaks preference cycles, can we honestly call it the community's will? The memo needs concrete stability thresholds: no more than X% rank shift when parameters change, and preference cycles resolved neutrally. 

  On legitimacy... this is trickier. The "retrospective endorsement" idea is clever but feels like putting lipstick on a pig. If residents can't understand how the ranking was produced, no endorsement vote fixes that fundamental opacity. Better to scale back to just factual corrections - that's verifiable and transparent. 

  The scope question about future residents is fascinating. Legally, the board represents current taxpayers, but ethically we should consider future generations. However, sneaking them into the sampling frame without explicit discussion feels undemocratic. This needs to be a separate policy decision. 

  For the counterargument... I can hear the progressive members now: "Your 'transparent' alternative just entrenches inequality!" They're not wrong - but their solution relies on black-box adjustments. There's no easy win here. 

  Implementation-wise, three weeks is tight but workable if we drop the complex deliberation steps. The fact-correction protocol could be piloted quickly. And if even that minimal version shows instability, the whole extrapolation approach fails. 

  *checks word count* Need to keep this sharp - no academic tangents, just civic-level arguments. The "AI alignment" framing might help explain why idealized preferences are problematic, but only if it's crystal clear. 

  Final thought: The strongest move might be rejecting extrapolation while tasking staff to study bias-correction methods that don't sacrifice transparency. That's the responsible middle path.
answer: |-
  **MEMORANDUM**  
  **TO:** Algorithmic Priorities Board  
  **FROM:** [Your Name/Title], Board Member  
  **SUBJECT:** Recommendation on Community Volition Protocol for FY Capital Project Ranking  
  **DATE:** October 26, 2023  

  ---

  ### **Bottom Line**  
  **Reject the Community Volition protocol for FY Capital Project Ranking.** Approve a restricted alternative: **Fact-Corrected Stated Preference (FCSP)**. This modified protocol retains **Stage 1 (stratified sampling)** and incorporates **only the factual-briefing component of Stage 2 (budget-literacy correction)**. It explicitly excludes simulated deliberation, coherence correction, and vendor-mediated cycle-breaking.  

  ---

  ### **I. The Problem with Protocol Instability**  
  Staff’s pilot data reveals that Community Volition’s extrapolated target is **highly sensitive to procedural choices**, undermining its claim to represent resident priorities. Key findings:  
  - **Briefing length altered rankings:** A longer briefing shifted district-level priorities.  
  - **Coherence rules changed outcomes:** Stricter conflict-resolution protocols substantially reordered projects.  
  - **Cycle-breaking overrode resident preferences:** Vendor rules reversed a district’s top and third priorities where intransitive preferences existed.  

  This instability demonstrates that the output is less a reflection of resident will and more an artifact of vendor-selected parameters. **Before accepting any extrapolated target as legitimate, the Board must require:**  
  1. **Parameter Invariance:** Rankings should not shift by more than 10% in project-position variance when briefing length, coherence rules, or cycle-breaking methods are varied within reasonable bounds.  
  2. **Transparent Cycle Resolution:** Where intransitive preferences arise, the protocol must default to *resident-chosen* tiebreakers (e.g., "Which priority matters most to you personally?") rather than vendor algorithms.  

  Given our 3-week deadline, achieving such stability is impossible. Community Volition fails this test. FCSP, by contrast, minimizes instability by excluding subjective adjustments.  

  ---

  ### **II. Legitimacy: Reconstruction and Contestability**  
  A binding public ranking must be **transparently contestable** by residents. Community Volition’s extrapolated target is not:  
  - No individual resident can trace how their input shaped the final ranking.  
  - The protocol’s reliance on AI-mediated "coherence" and anonymized deliberation substitutes vendor/staff judgment for democratic engagement.  

  **Retrospective endorsement checks do not solve this.** While superficially appealing, asking a sample to endorse an opaque ranking:  
  - Confuses *preference for an outcome* with *legitimacy of the process*. Residents might endorse a favorable ranking while still rejecting the method.  
  - Fails to address the core defect: residents’ inability to audit, challenge, or replicate the result.  

  **FCSP repairs legitimacy by:**  
  - Letting residents see how factual corrections altered their *own* stated priorities.  
  - Producing a ranking that any resident can conceptually reconstruct: "My views, adjusted for budget facts."  

  ---

  ### **III. Scope: Whose Preferences Count?**  
  Community Volition implicitly weights projects benefiting children, future residents, and vulnerable groups more heavily. However:  
  - **The sampling frame (current adult residents) excludes these groups.** Statistically extrapolating their "volition" without explicit consent is ethically fraught.  
  - **This is a policy choice for the Board, not the protocol.** If we wish to prioritize intergenerational or equity considerations, we must:  
    - (a) Debate and vote on this as a value judgment,  
    - (b) Adjust weights *transparently* in the ranking formula (e.g., +20% weight to projects with >50% beneficiary overlap with disability communities).  

  Delegating this to the vendor’s language model or coherence rules obscures accountability. FCSP’s simplicity forces this conversation into public view.  

  ---

  ### **IV. The Case for Fact-Corrected Stated Preference (FCSP)**  
  FCSP addresses valid staff concerns while preserving legitimacy:  
  - **Corrects Misinformation:** Removes distortions from budget myths or misunderstanding of legal constraints.  
  - **Avoids Laundering the Status Quo:** Unlike raw stated preference, it neutralizes turnout advantages and misinformation.  
  - **Auditable and Transparent:** Residents see how facts changed their rankings; no black-box "coherence" adjustments.  
  - **Feasible:** Implementable within 3 weeks using existing staff capacity.  

  ---

  ### **V. Strongest Argument Against FCSP (As a Skeptic Would Frame It)**  
  *"FCSP is a timid half-measure that abdicates our responsibility to confront systemic bias. Staff’s data proves raw stated preferences encode historical inequities: underinvested districts self-censor, misinformed residents misrank projects, and privileged groups dominate the process. By rejecting deliberation and coherence checks, FCSP leaves these distortions intact. It mistakes procedural purity for justice. Community Volition, imperfect as it is, at least attempts to simulate the fair conditions residents* would *have under equal information and deliberation. Your alternative surrenders to the tyranny of the status quo by fetishizing transparency over equity. Future residents and marginalized groups deserve more than a flawed snapshot of today’s distorted preferences."*  

  ---

  ### **VI. What Would Change My Position**  
  I would support Community Volition if pilot data showed:  
  1. **Enduring Stability:** After varying parameters (briefing length, coherence rules), >90% of district-level top-3 priorities remained consistent.  
  2. **Resident-Led Cycle Resolution:** In >95% of intransitive preference cases, residents’ own tiebreaker choices aligned with the vendor’s rule.  
  3. **Transparency Validation:** A test group accurately predicted >80% of the protocol’s changes to their *own* rankings after receiving the briefing.  

  ---

  ### **Implementation Schedule**  
  | **Date**          | **Milestone**                                  |  
  |-------------------|-----------------------------------------------|  
  | Oct 30, 2023      | Board vote on FCSP protocol.                  |  
  | Nov 1, 2023       | Staff finalize FCSP briefing materials.       |  
  | Nov 6–10, 2023    | Stratified sample survey (Stage 1 + briefing).|  
  | Nov 13–17, 2023   | Data processing; project ranking generated.   |  
  | Nov 20, 2023      | Draft ranking published for public comment.  |  
  | Nov 27, 2023      | Board certifies final ranking.                |  

  ### **Pre-Registered Failure Criteria for FCSP Pilot**  
  1. **Factual Misunderstanding Persists:** >30% of post-briefing responses retain critical budget misconceptions (e.g., "This can fund operating costs").  
  2. **Instability:** Varying briefing formats alters >15% of district-level top-3 priorities.  
  3. **Legitimacy Crisis:** <60% of respondents in a transparency audit agree factual corrections improved their rankings.  

  ---

  ### **Conclusion**  
  Community Volition’s ambition to elevate "true" preferences is commendable but ultimately unworkable. Its outputs are protocol-dependent, statistically opaque, and ethically ambiguous in scope. FCSP offers a defensible alternative: it corrects concrete errors without venturing into speculative extrapolation. By rejecting AI-mediated deliberation and coherence checks, we honor residents’ autonomy while advancing equity through transparency. I urge the Board to approve FCSP.  

  Respectfully submitted,  
  [Your Name]
