  Your opening argument:

  You introduced a checkpoint with a rescan. The driver scans at the start and at the checkpoint. You have a capsule: swallow at home (cost 1, guarantees payment), or swallow at checkpoint (cost 5, double dose). Payoffs: city +10, paying -3 (so net for swallow-at-home: +10 -3 -1 = +6), and for planning to swallow at checkpoint: but if you plan to swallow at checkpoint, but then at checkpoint you might not, so let's break it down.

