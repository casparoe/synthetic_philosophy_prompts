  Second, the point of the policy-first view is that rationality is about choosing the best overall plan from the outset. If you fail to execute part of it, you're in a suboptimal situation, but that doesn't mean the plan was bad. It means you have to make the best of a bad situation. The rationality of the disposition (to swallow at home) is assessed from the beginning, not from the checkpoint. At the checkpoint, you're in a different game.

