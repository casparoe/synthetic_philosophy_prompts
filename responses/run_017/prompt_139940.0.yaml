  We are role-playing: I am the defender of the policy-first approach (updateless) in the Hitchhiker case with your checkpoint wrinkle. You are attacking it. I must hold that:

  - The right unit of assessment is the policy chosen before knowing one is in the car (i.e., at the earliest node).
