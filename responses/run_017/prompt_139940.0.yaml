answer: |-
  Your checkpoint twist doesn't undermine the policy-first view; it highlights its consistency. When you're at the checkpoint without having swallowed the capsule, you're in a deviation scenario—you failed to execute the optimal policy chosen at the doorstep. That policy (swallow-at-home) is now inaccessible, but its rationality isn't negated by your mistake. We assess the policy from the outset because that's when you committed to a disposition, and that commitment maximized expected utility (+6 vs. +2). Now, off-policy, you minimize damage act-by-act (swallowing at the checkpoint for +2 rather than -2), but this is just cleanup for a lapse—it doesn't resurrect the inferior "plan to swallow later" policy or make rationality self-effacing. The policy's value is fixed at choice time, not retroactively erased by later errors.

  Your protein folding analogy misfires because rational planning isn't a physical system relaxing—it's a normative commitment. Starting "at the earliest node" isn't arbitrary; it's when you set your stance toward future uncertainty. If we evaluated policies mid-journey, we'd incentivize last-minute defections that destroy trust (e.g., the driver wouldn't pick you up if he expected checkpoint haggling). By fixing assessment pre-scan, we avoid this instability and capture the genuine cost of inconsistency. Your checkpoint scenario actually proves my point: deviating from swallow-at-home leaves you worse off (+2 now vs. the +6 you could've had), reinforcing that the initial policy was rationally superior.

