answer: |-
  Your friend's argument is sharp, but it stumbles at **step 4**. Here's the diagnosis, why step 4 seems compelling, what rejecting it costs you, and how a genuine third option avoids the dilemma:

  ### The Flaw: Step 4 Mischaracterises "Tracking the Criterion"
  Step 4 claims: *"Whether to exercise or override the disposition has to be settled by some judgment that tracks the criterion... the only judgment that tracks the criterion is an estimate of expected value."*

  **Why this seems sound:** It feels intuitive. If the *ultimate authority* is consequences, surely any decision to override a rule must involve assessing consequences? Otherwise, how could it be justified? This step exploits the split view’s own consequentialist foundations.

  **Why it’s wrong:** It conflates *justification* with *deliberative procedure*. "Tracking the criterion" does not require the agent to *perform a first-order consequentialist calculation in real time*. The split view can employ **heuristic triggers or perceptual salience** for override decisions *without* engaging in direct maximisation. These triggers are *designed* to track expected value *indirectly*.

  ### A Genuine Third Option: Salience-Based Overrides ("Trained Perception")
  Your defeater clauses ("unless cruel", "unless disaster") aren't arbitrary, nor do they require real-time EV calculation. They function as **pre-programmed perceptual alarms**, trained through experience or moral education to fire *when catastrophic risks or extreme violations are salient*. This avoids both sealing and porousness as defined:

  1.  **Not Sealed:** Overrides *can* occur when disaster is obvious.
  2.  **Not Porous (as defined):** The override isn't triggered by a *judgment about expected value*. It's triggered by **morally salient features** recognised *directly* (e.g., visceral recognition of impending profound suffering, extreme betrayal, or immediate danger) – features *correlated* with disastrous outcomes by the consequentialist criterion *ex ante*.

  **How this works:**
  *   **The Disposition:** "Keep promises reliably."
  *   **The Defeater Trigger:** "...*unless* keeping it would cause *salient, extreme, disproportionate harm* (e.g., death, ruin, profound betrayal)."
  *   **The Mechanism:** You don't *calculate* whether keeping the promise maximises EV. You recognise a *salient moral emergency*. The disposition includes an *internalised sensitivity* to these red flags, cultivated *because* they reliably indicate catastrophic failures of the criterion. The "judgment" is more akin to perception ("*This* is horrifyingly cruel") than calculation ("Let me weigh the utilities...").

  ### Why This Avoids the Friend's Dilemma
  *   **No Rule-Worship:** Dispositions aren't sealed; they yield to salient disasters.
  *   **No Porousness (Collapse into Calculation):** Overrides are *not* gateways to consequentialist deliberation. They are *specific, pre-set responses* to specific, highly salient features *known* (from the justifying consequentialist perspective) to be strong indicators of disaster. You don't open the door to calculation; you trigger a different, equally automatic (but emergency-tailored) response.
  *   **Preserves Rationale:** This avoids the self-defeat. The costly, corrosive, error-prone process of *real-time expected value calculation* is *still* avoided in the vast majority of cases *and crucially, during the override decision itself*. The override relies on fast, trained perception, not deliberate calculation.

  ### The Cost to You: Consequentialism Must Be Indirect *All the Way Down*
  Rejecting step 4 costs you a **purely direct link** between the consequentialist criterion *in real-time deliberation*. You must accept that:

  1.  **"Tracking" is Indirect:** The agent's dispositions *and their built-in defeaters* track the consequentialist criterion *only indirectly*, via their *ex ante* design and the cultivation of perceptual sensitivities. In the moment, the agent acts on rules and salient features, *not* direct EV assessments.
  2.  **Moral Perception is Key:** Your view relies heavily on the agent developing reliable **moral perception** – the trained ability to recognise situations where extreme harm, cruelty, or disaster is imminent *without calculation*. This requires moral education/practice, not just theoretical knowledge.
  3.  **Criterion Softens (Slightly):** While the *criterion* remains "maximizing impartial expected value," your account of *how agents access it* means it cannot function as a real-time decision procedure *even in override situations*. Its role is *solely* foundational and justificatory for the *ex ante* design of the procedural system (dispositions + salience-based defeaters). You soften the *epistemological* claim about how agents connect to the criterion, not the criterion itself.

  ### Addressing the Generalisation (Step 7) and Your Ideal-Deliberation View
  The "handover rule" problem dissolves. There is no distinct rule *deciding* when to hand over or take back. The system runs automatically:

  *   **Default Mode:** Operate via non-consequentialist dispositions.
  *   **Override Mode:** Triggered *automatically* by salient perceptual alarms (extreme harm, etc.), leading to a specific override action (e.g., break the promise *in this specific way* to avert *this specific disaster*).
  *   **No Deliberative Handover:** The shift isn't a *decision* based on a meta-rule requiring deliberation. It's a *response* triggered by perception. The "rule" is embedded in the structure of the dispositions and the sensitivity of the defeater triggers.

  **For your ideal-deliberation view:** The "handover" isn't a rule you *apply*. Deferring to the counterfactual procedure is the *default state*. Overriding it occurs only when a *salient feature* screams that this situation is *so* extreme, atypical, or existentially threatening that even the counterfactual procedure's likely output seems *obviously* disastrous *here and now* (again, perceived directly, not calculated). This override is a system failure mode, not a deliberative choice point requiring its own consequentialist meta-justification.

  ### Conclusion
  Your split view can be stable. Reject step 4: override decisions need not involve real-time consequentialist calculation; they can be governed by **salience-based triggers built into the dispositions**. This avoids rule-worship and self-defeat. The cost is accepting that consequentialism justifies the *system design* but provides *no direct deliberative guidance*, not even for overrides. Morality becomes a matter of cultivating the right dispositions *and* the right perceptual sensitivities. Your friend's argument fails by assuming that only direct calculation can "track" the criterion in real-time decisions; indirect tracking via trained perception and pre-set triggers is the viable third way.
