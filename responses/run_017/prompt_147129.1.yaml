  Below is a diagnostic handout structured as a decision tree for the Death in Damascus case, tailored for a graduate reading group familiar with Newcomb's problem but not this literature. The tree prioritizes the logical space over specific theories, using variants (accuracy, legibility, delegation, memory erasure) to separate views. Branch nodes are questions answerable without theory-specific knowledge, and leaves name positions with their most awkward commitments. Unoccupied combinations are noted and diagnosed. The tree has **8 branch nodes** and **7 leaves**, with flagged indistinguishable pairs and variants to separate them.

