       - *Commitment same as above*.

  ---

  #### **Unoccupied Combinations & Diagnosis**  
  - **Q2→No + Q3→No + Q4→Yes**: *Empty*. Why? If asymmetry exists (Q2→No), mixed strategies become redundant; but no theory occupies this space. Diagnosed as *incoherent* due to internal conflict.  
  - **Q6→No + Q7→Yes**: *Empty*. Why? If prediction visibility doesn’t resolve instability (Q6→No), memory erasure shouldn’t help (contradicting Q7→Yes). Diagnosed as *unattractive* (no adherents).  
  - **Q8→No + Not Ratificationism**: *Unexplored*. Why? Delegation-dismissal typically aligns with ratificationism or CDT; alternatives are underdeveloped. Diagnosed as *merely unexplored*.

  #### **Indistinguishable Leaves & Separating Variants**  
  - **Causal (Leaf 1) vs. Functional (Leaf 7)**: The tree separates them (CDT ignores correlation; FDT embraces it). *Divergence confirmed*: CDT rejects delegation in 70% case; FDT accepts it.  
  - **Ratificationism (Leaf 3) vs. Mixed-Strategy (Leaf 4) at 99% accuracy**: The tree separates them (ratificationism forbids all acts; mixed-strategy allows randomization). *But*: At 99% accuracy, both agree survival is <100%, and in practice, mixed-strategy’s randomization (50% survival) may coincide with ratificationism’s paralysis (0% survival) if no act is chosen. *To pry apart*: Use the **delegation variant**. Mixed-strategy delegates (survival: 50%); ratificationism remains paralyzed (0%).  
  - **FDT and EDT (Leaf 7)**: *Not separated here*. Both endorse delegation and reject memory erasure. *To pry apart*: Use an **XOR blackmail variant** (outside Death in Damascus), where FDT ignores blackmail while EDT pays, due to differing treatment of logical vs. causal counterfactuals.

