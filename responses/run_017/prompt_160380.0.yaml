prompt: |-
  I'm a PhD candidate in philosophy of cognitive science, and what I need is a specification, not a survey. The chapter I am writing turns on one question: when a system has no usable design-stance story — no rational reconstruction of how its parts are supposed to contribute to what it does, because its organization was arrived at by training rather than by design — can the intentional patterns an interpreter finds in its behavior still be real patterns, and if so, what does their reality consist in? Before I commit to a criterion, I want to know what I am entitled to demand of one.

  So: write the desiderata for an account of pattern reality. Hold the account to one job, which is mine and not realism-in-general: given a system, a body of observations of it, and a proposed description that compresses those observations, the account must be able to say whether the pattern the description picks out is (a) an artifact of the descriptive vocabulary or encoding chosen, (b) merely useful to some interpreter, or (c) real — where real means real enough to underwrite explanation, prediction of further observations, prediction under interventions, and, where the pattern is an intentional one, some modest claim about content.

  Give me the list as a table with four columns: the requirement; the concrete case that shows why it is a requirement (a sentence or two each, an actual case rather than a label); whether you take it to be non-negotiable or a preference of one camp, with a note on which camp; and what enforcing it would exclude. At minimum, the account must respect and not collapse these distinctions:

  - reality of a pattern versus usefulness of a pattern to an interpreter
  - availability of a stance versus reality of the patterns found from that stance
  - a pattern in a data set versus a pattern in the system or the world, since the same system under two measurement vocabularies can be patterned in one and not the other
  - compression versus export: licensing predictions about further unmanipulated observations versus licensing predictions about what would happen under interventions that have never been performed
  - degrees of reality versus a binary verdict

  And it must handle these cases explicitly, in whatever order fits your list:

  1. The no-design-story case: a trained system whose behavior the intentional stance predicts well, while no decomposition of it into parts with purposes yields predictions anyone could actually use. Does a real intentional pattern require design-stance backing, or can it float free of one?
  2. The contrived-code case: a sequence that compresses spectacularly only under a code tailored to it after the fact, the sort of thing you get by fitting a scheme to noise. Whatever the account says must charge for the code and not only for the data given the code; show how it does that and what the maneuver costs it.
  3. The unmanipulable domain: a pattern in an observational science — something in the fossil record, or in large-scale astronomical data — that compresses beautifully and predicts new observations, but where no intervention on the system is available even in principle. If your account demands intervention-robustness, it must either handle this or concede that it is a criterion of causal structure rather than of pattern-hood.
  4. The near-miss: the intentional stance is the best available predictor of a system overall but mispredicts a specifiable subclass of its behavior systematically. Is the reality of the pattern graded, does it come with an exception clause, or does the existence of that subclass show the stance was instrumental all along?
  5. The grain case: a regularity that shows up at one coarse-graining of a system's behavior and disappears at a finer or a coarser one.
  6. The reflexivity case: the account must be able to say, in its own terms, whether the distinction it draws between real and merely apparent patterns is itself a real pattern, and what follows for it if the answer is no.

  Then, in prose after the table:

  (a) Which pairs or triples of your own requirements you suspect cannot be jointly satisfied. This is the part I most want. Candidates I have in mind: requiring export under intervention while refusing to restrict pattern-hood to manipulable domains; requiring a principled restriction on admissible codes while keeping the criterion usable by a bounded investigator; requiring that real patterns be anchored in mind-independent structure while allowing a pattern to be real from the intentional stance and not real from the physical stance. For each, tell me whether it is a genuine inconsistency or a fake tension, and what gives way.

  (b) Which single requirement does the most exclusionary work, and whether imposing it is worth what it costs you elsewhere on the list.

  (c) A short scorecard — a paragraph each, no more — for four candidate views: the compression criterion associated with Dennett's real-patterns paper; a minimum-description-length or two-part-code refinement of it; an interventionist or difference-making account that ties patterns to causal structure; and a deflationary treatment on which pattern-hood is projection relative to an interpreter's interests. Mark for each whether it violates a non-negotiable or merely disappoints a preference.

  Please do not supply citations, a bibliography, or a reading list; I know the literature and I will do that part myself. And where a desideratum leans on technical apparatus — Kolmogorov complexity, two-part codes, interventionist counterfactuals — state the apparatus in a sentence rather than assuming I share your formalism.
reasoning: |-
  We are compiling a list of desiderata for an account of pattern reality. The account must distinguish between (a) artifact of description, (b) merely useful, and (c) real patterns. Real patterns should underwrite explanation, prediction, intervention prediction, and (for intentional patterns) content.

  The table will have four columns:
  1. Requirement: the specific criterion.
  2. Concrete case: a brief example illustrating why the requirement is necessary.
  3. Negotiability: whether non-negotiable or a camp preference, and which camp.
  4. What it excludes: what kind of patterns or accounts would be ruled out by enforcing this requirement.

  We must cover the distinctions and cases provided.

  After the table, we will discuss:
  (a) Potential conflicts between requirements (which pairs/triples might conflict and how they might be resolved).
  (b) The most exclusionary requirement and its cost.
  (c) A short scorecard for four candidate views.

  Let's start by listing the requirements. We'll derive them from the distinctions and cases provided, but also from the general job of the account.

  List of Requirements (to be tabulated):

  1. **Distinguish reality from mere usefulness**: The account must not conflate a pattern being useful to an interpreter with it being real. 
     *Case*: A horoscope that seems to fit one's life events by being vague enough to apply to many situations. It might be useful for some (as a narrative) but is not real because it doesn't underwrite reliable predictions beyond the observed data.
     *Negotiability*: Non-negotiable. Without this, the account collapses the central distinction.
     *Excludes*: Accounts that reduce reality to utility (e.g., some instrumentalist views).

  2. **Distinguish stance availability from pattern reality**: The fact that a stance (e.g., intentional stance) can be applied does not make the patterns found real.
     *Case*: Applying the intentional stance to a simple thermostat: we might say it "believes" the room is too cold and "wants" to heat it, but without a design story, this might be merely useful without being real (if the system is too simple to warrant real intentionality).
     *Negotiability*: Non-negotiable. A stance might be available without the patterns being real.
     *Excludes*: Views that equate the success of a stance with reality (e.g., some versions of Dennett's intentional systems theory without further constraints).

  3. **Pattern in system vs. in data**: The pattern must be in the system (or world) and not just an artifact of the measurement vocabulary.
     *Case*: A random sequence of coin flips (H,T) might appear patterned if we encode H as 0 and T as 1 and then interpret the sequence as binary numbers. But if we change the encoding (e.g., swap 0 and 1) the pattern disappears. The pattern is in the encoding, not the system.
     *Negotiability*: Non-negotiable. Without this, we cannot say the pattern is in the world.
     *Excludes*: Accounts that do not require invariance under reasonable changes of description.

  4. **Compression vs. export**: The pattern must not only compress past observations but also support predictions under interventions (export).
     *Case*: A model that fits past stock market data perfectly but fails when new policies (interventions) are introduced. The compression is there but without export, it's not real for explanation and control.
     *Negotiability*: Preference of the interventionist camp. Some might argue that in non-manipulable domains (like astronomy) we can have real patterns without intervention.
     *Excludes*: Purely compression-based accounts that ignore counterfactual robustness.

  5. **Degrees of reality**: The account should allow for degrees of reality (e.g., more or less real) rather than a binary verdict.
     *Case*: The intentional stance applied to a chimpanzee might yield a pattern that is more real (more robust, more predictive) than when applied to a worm, but less real than when applied to a human.
     *Negotiability*: Preference of the graded-reality camp (e.g., Dennettians). Some might insist on a binary (real/not real) for simplicity.
     *Excludes*: Binary accounts that cannot capture the continuum.

  Now, we must also handle the explicit cases. We can turn these into requirements:

  6. **Handle no-design-story case**: The account must allow that a real intentional pattern can exist without a design-stance story (decomposition into parts with purposes).
     *Case*: A neural network trained to play chess: it plays well and we can predict its moves from the intentional stance (as if it wants to win), but we cannot decompose it into parts with clear functions. The pattern might still be real.
     *Negotiability*: Preference of the anti-reductionist camp (e.g., Dennett). The reductionist camp might require design-stance backing.
     *Excludes*: Accounts that require functional decomposition for reality of intentional patterns.

  7. **Handle contrived-code case**: The account must penalize codes that are tailored to the data and not independently motivated.
     *Case*: Fitting a polynomial of degree 100 to 101 data points: it compresses the data (the polynomial is a short description) but only because the code (polynomials of arbitrary degree) is too flexible. The pattern is not real because it doesn't predict new data.
     *Negotiability*: Non-negotiable (to avoid overfitting). The account must include a cost for the code.
     *Excludes*: Naive compression accounts that don't penalize complex descriptions.

  8. **Handle unmanipulable domain**: The account must not require intervention-robustness if the domain is unmanipulable, or else it must explain how such patterns can be real without it.
     *Case*: Patterns in the cosmic microwave background radiation: we cannot intervene on the early universe, but the pattern is real and supports predictions about distant observations.
     *Negotiability*: Preference of the non-interventionist camp. The interventionist camp might say that such patterns are not causal but are still real as patterns of correlation.
     *Excludes*: Strict interventionist accounts that require manipulability for any real pattern.

  9. **Handle near-miss case**: The account must allow that a pattern can be real even if it has exceptions, perhaps by allowing degrees or by specifying the domain of reliability.
     *Case*: A model of human decision-making that works well in most cases but fails in cases of extreme stress. The pattern is not completely unreal because of the failures, but it is not universally applicable either.
     *Negotiability*: Preference of the graded-reality camp. Binary accounts might struggle.
     *Excludes*: Accounts that require exceptionless regularities for reality.

  10. **Handle grain case**: The account must acknowledge that patterns can be grain-relative without being unreal.
      *Case*: A gas has a temperature (a real pattern) at the macroscopic grain, but at the atomic grain, there is only the motion of individual molecules. The pattern is real at the coarse grain.
      *Negotiability*: Non-negotiable (for a non-reductive account). It excludes views that require patterns to hold at every grain.
      *Excludes*: Reductionist accounts that deny the reality of higher-level patterns.

  11. **Handle reflexivity case**: The account must be able to apply its own criterion to itself and address the implications.
      *Case*: If the account says that a real pattern must be projectable, then we must ask whether the distinction between real and apparent patterns is projectable. If not, then the account might undermine itself.
      *Negotiability*: Non-negotiable for a self-consistent account. Some might avoid reflexivity.
      *Excludes*: Accounts that are not self-applicable or that lead to paradox.

  Now, let's tabulate these. We have 11 requirements. We'll number them for clarity, but in the table we'll use the requirement description.

  We'll order them by the distinctions and then the cases, but the order is flexible.

  Table:

  | Requirement | Concrete Case | Negotiability | What it Excludes |
  |-------------|---------------|---------------|------------------|
  | 1. Reality vs. Usefulness Distinction | A horoscope that fits past events by vagueness is useful for some but not real because it fails to predict new events. | Non-negotiable | Accounts that reduce reality to utility (e.g., radical instrumentalism) |
  | 2. Stance Availability vs. Pattern Reality | Applying the intentional stance to a thermostat: the stance is available, but the intentional pattern is not real (if we take intentionality to require more complexity). | Non-negotiable | Views that equate stance success with reality without further conditions |
  | 3. Pattern in System vs. in Data | A random coin flip sequence appears patterned under one encoding (e.g., as binary numbers) but not under another. The pattern is an artifact of the encoding. | Non-negotiable | Accounts that do not require invariance under reasonable changes of vocabulary |
  | 4. Compression Must Include Export | A stock market model that fits past data but fails under policy changes (interventions) lacks export. | Preference (interventionist camp) | Purely descriptive compression accounts that ignore counterfactuals |
  | 5. Degrees of Reality | Chimpanzee intentionality is more real than that of a worm but less than that of a human. | Preference (graded-reality camp) | Binary accounts of pattern reality |
  | 6. No-Design-Story Case | A trained neural network with no functional decomposition: the intentional pattern (e.g., playing chess to win) might still be real. | Preference (anti-reductionist camp) | Accounts that require design-stance backing for intentional patterns |
  | 7. Penalize Contrived Codes | Fitting a high-degree polynomial to data: it compresses the data but fails to predict new data because the code is too flexible. | Non-negotiable | Naive compression without code cost (e.g., without penalizing model complexity) |
  | 8. Unmanipulable Domain | Patterns in the cosmic microwave background: no interventions possible, but the pattern is real and predictive. | Preference (non-interventionist camp) | Strict interventionist accounts that require manipulability for any real pattern |
  | 9. Near-Miss Case | A decision-making model that works in normal conditions but fails under stress: the pattern is not entirely unreal. | Preference (graded-reality camp) | Accounts that require exceptionless regularities |
  | 10. Grain Relativity | Temperature is real at the macro grain but not at the atomic grain. | Non-negotiable | Reductionist accounts that deny higher-level patterns |
  | 11. Reflexivity | The account must be able to judge its own pattern-reality distinction. If the distinction isn't a real pattern, what follows? | Non-negotiable | Accounts that are not self-applicable |

  Now, after the table:

  (a) Potential conflicts:

  - **Requiring export under intervention (4) while refusing to restrict pattern-hood to manipulable domains (8)**: 
    This is a fake tension if we can have export without actual intervention. In unmanipulable domains, export might mean predicting what would happen under hypothetical interventions (even if not feasible). But if the account ties export to actual manipulability, then (8) forces a concession that in unmanipulable domains, we have patterns that are real but not causal (if causality requires intervention). What gives way: either we weaken export to include only non-intervention predictions (so export without intervention) or we accept two kinds of real patterns: causal (with intervention) and non-causal (without).

  - **Requiring a principled restriction on admissible codes (7) while keeping the criterion usable by a bounded investigator**:
    A genuine tension because a principled restriction (like Kolmogorov complexity) is not computable. We must approximate (e.g., with two-part codes). The cost: the account becomes resource-relative. What gives way: strict non-computable criteria are relaxed to feasible ones, so the reality of a pattern becomes relative to the investigator's resources.

  - **Requiring that real patterns be anchored in mind-independent structure (3, 10) while allowing a pattern to be real from the intentional stance and not real from the physical stance (6, 10)**:
    A fake tension if we allow that the same system can have patterns at different levels of description. The mind-independence is at the level: the pattern is there at the intentional level, regardless of whether anyone is interpreting it. But if the physical stance does not reveal it, that doesn't make it mind-dependent. What gives way: we accept multiple levels of reality, each anchored in the structure of the system at that level.

  (b) Most exclusionary requirement:

  - **Requirement 7 (Penalize Contrived Codes)** does the most exclusionary work because it rules out any pattern that is the result of overfitting. It forces the account to consider the complexity of the descriptive vocabulary. The cost: it requires a way to measure the complexity of the code and the data given the code, which might lead to relativization to a language or to computational resources.

  (c) Scorecard for candidate views:

  1. **Dennett's compression criterion**: A pattern is real if it permits compression of the data. 
     - Violates: Requirement 7 (it doesn't penalize contrived codes) and Requirement 4 (it doesn't require export under intervention). It handles no-design-story (6) and grain (10) well. It might violate non-negotiable 7 and 4 if we take them as non-negotiable.

  2. **Minimum Description Length (MDL) or two-part code refinement**: A pattern is real if it minimizes the combined length of the model (the code) and the data given the model. 
     - Disappoints: Requirement 5 (it typically gives a binary verdict: the model that minimizes) but can be extended to degrees. It satisfies 7 and 3. It might disappoint 8 if we require intervention for reality, because MDL is about compression and prediction, not intervention.

  3. **Interventionist or difference-making account**: A pattern is real if it is invariant under interventions (i.e., it captures causal structure). 
     - Violates: Requirement 8 (it cannot handle unmanipulable domains without conceding they are non-causal) and may violate 6 (if intentional patterns require design for causal structure). It satisfies 4 and 7 (if we build it in). It violates non-negotiable 8 if we take unmanipulable patterns as real.

  4. **Deflationary treatment**: Pattern-hood is projection relative to an interpreter's interests. 
     - Violates: Non-negotiable 1, 2, 3 because it collapses reality into usefulness and does not require invariance. It might satisfy 5 (degrees) and 6 (no design needed) but at the cost of objectivity.

  Now, we write the response accordingly.
answer: |-
  ### Desiderata for an Account of Pattern Reality

  The following table specifies the requirements for an account that distinguishes between (a) artifacts of description, (b) merely useful patterns, and (c) real patterns. Real patterns must underwrite explanation, prediction of unmanipulated observations, prediction under interventions, and (for intentional patterns) a modest claim about content. Requirements are derived from the necessary distinctions and explicit cases provided.

  | Requirement | Concrete Case | Negotiability | What It Excludes |
  |-------------|---------------|---------------|------------------|
  | **1. Non-instrumental reality**<br>Must distinguish reality from mere usefulness to an interpreter. | A horoscope's vague descriptions appear to "fit" a person's life events (useful for narrative coherence) but fail to predict specific future events or interventions (e.g., "You will face a challenge" lacks empirical content). | Non-negotiable. Core to avoiding collapse into instrumentalism. | Deflationary views that equate reality with utility; any account where interpreter satisfaction alone suffices. |
  | **2. Stance-pattern decoupling**<br>Must separate the availability of an interpretive stance (e.g., intentional) from the reality of patterns found using it. | Applying the intentional stance to a thermostat: we describe it as "believing" the room is cold, but this stance's availability doesn't make the intentional pattern real if it fails to predict novel interventions (e.g., how it responds if sensors are masked). | Non-negotiable. Prevents stance success from automatically conferring reality. | Dennett-style accounts where stance success implies reality; views that tie pattern reality directly to stance applicability. |
  | **3. System-anchored invariance**<br>Must distinguish patterns in the system/world from patterns in the data, requiring invariance under reasonable changes in measurement vocabulary. | A random coin-flip sequence (H,T,H,T,...) appears periodic under a binary code where H=0, T=1, but shows no pattern under a swapped code (H=1, T=0). The periodicity is an artifact of the code, not the system. | Non-negotiable. Ensures patterns are not encoding-dependent illusions. | Accounts that ignore description-relativity; those allowing any compression to imply reality regardless of encoding stability. |
  | **4. Intervention-robust export**<br>Must require that compression licenses predictions under interventions (export), not just unmanipulated observations. | A model compresses stock price history but fails when interest rates change (an intervention); e.g., it predicts trends but not policy impacts. Without export, the pattern is merely descriptive. | Preference (interventionist camp). Reflects a causal-explanatory demand. | Purely observational accounts (e.g., baseline compressionism); views where prediction without interventions suffices for full reality. |
  | **5. Degree-sensitivity**<br>Must accommodate graded reality (e.g., robustness, scope) rather than binary verdicts. | The intentional stance applied to a chess-playing AI: it predicts moves robustly in most game states (high reality) but fails in endgame puzzles (lower reality), unlike in humans where it rarely fails. | Preference (graded-reality camp). Needed for nuance in messy systems. | Binary accounts (real/unreal); those requiring exceptionless regularities for any reality. |
  | **6. Design-stance independence**<br>Must allow intentional patterns without a functional decomposition (design-stance backing). | A neural network trained to play Go: no rational reconstruction of its layers exists, but the intentional stance predicts moves accurately. Reality shouldn't require reverse-engineered purposes. | Preference (anti-reductionist camp). Allows autonomy for non-designed systems. | Reductionist accounts requiring design-stance grounding (e.g., Fodorian); views where intentionality demands part-whole functionalism. |
  | **7. Code-cost sensitivity**<br>Must penalize codes tailored to the data, charging for the description language's complexity. | A 100th-degree polynomial fits 101 noisy data points perfectly with a short equation, but only because the code (arbitrary polynomials) is ad hoc; it fails on new data. The account must "charge" for the complex code. | Non-negotiable. Prevents overfitting. | Naive compressionism (e.g., Kolmogorov complexity without code costs); accounts where any compression, however contrived, implies reality. |
  | **8. Non-manipulability tolerance**<br>Must not require intervention-robustness for pattern reality in domains where interventions are impossible. | Patterns in cosmic microwave background radiation: they compress data and predict new astronomical observations, but no interventions on the early universe are possible even in principle. | Preference (non-interventionist camp). Acknowledges observational sciences. | Strict interventionist accounts that require manipulability for reality; views that collapse pattern-hood into causal structure. |
  | **9. Near-miss tolerance**<br>Must handle systematic prediction errors without dismissing the pattern as unreal. | An intentional-stance model of human decision-making predicts well in low-stakes scenarios but consistently fails in high-stress situations. The pattern isn't wholly unreal due to localized failures. | Preference (graded-reality camp). Addresses real-world exceptions. | All-or-nothing accounts; those where any systematic error voids reality. |
  | **10. Grain-relativity**<br>Must allow patterns to be real at one level of description but not others. | Gas temperature: a real pattern at macro-grain (predicting pressure changes) but absent at micro-grain (individual molecule motions). Coarse-graining reveals regularity; finer dissolves it. | Non-negotiable. Reflects multi-level systems. | Reductionist views where reality demands micro-foundations; accounts requiring patterns to hold at all grains. |
  | **11. Reflexive applicability**<br>Must apply its own reality criterion to itself and address implications. | The account's distinction "real vs. apparent pattern" must be evaluated as a pattern: if it compresses methodological successes/failures, predicts new cases, etc. If not real, the account must confront self-undermining. | Non-negotiable. Ensures self-consistency. | Accounts that avoid self-reference; those where the criterion is exempt from its own standards. |

  ---

  ### (a) Suspected Requirement Conflicts
  - **Intervention-robust export (4) + Non-manipulability tolerance (8)**:  
    *Genuine inconsistency* if export requires interventionist counterfactuals (e.g., "what *would* happen if X were manipulated"). In unmanipulable domains (e.g., astronomy), intervention is undefined. *Resolution*: Weaken export to *allow hypothetical interventions* (even if physically impossible) or concede that (4) defines *causal* patterns, while (8) allows *non-causal* real patterns (e.g., compressible correlations). What gives way: strict interventionism; export becomes domain-relative.  
  - **Code-cost sensitivity (7) + Usability for bounded investigators**:  
    *Genuine tension*. Principled code-cost measures (e.g., Kolmogorov complexity) are uncomputable; enforcing them risks making pattern reality inaccessible. *Resolution*: Adopt feasible approximations (e.g., two-part codes with computational resource bounds), but this relativizes reality to investigator capacity. What gives way: strict mind-independence; reality becomes resource-relative.  
  - **System-anchored invariance (3) + Design-stance independence (6) + Grain-relativity (10)**:  
    *Fake tension*. Anchoring in mind-independent structure (3) seems to conflict with intentional patterns (6) being real only at coarse grains (10), not at physical grains. *Resolution*: Levels are structurally real; the intentional pattern is invariant *under intentional-stance descriptions* (satisfying 3), even if absent at other grains. What gives way: reductionist demands for microphysical grounding.  

  ### (b) Most Exclusionary Requirement and Its Cost
  - **Code-cost sensitivity (7)** is the most exclusionary. It excludes all patterns from contrived descriptions (e.g., overfitted models, arbitrary encodings), ensuring patterns are not artifacts. *Cost*: It demands a formal measure of code complexity (e.g., two-part codes), which may require specifying a "natural" language for descriptions, risking subjectivity or relativity to background knowledge. This also complicates handling of novel vocabularies (e.g., in science) and may exclude patterns detectable only via complex codes, even if they export.  

  ### (c) Candidate View Scorecard
  - **Dennett's compression criterion**: Violates non-negotiables. Fails code-cost sensitivity (7) by not penalizing contrived codes (e.g., a "demon code" compressing noise), risking artifacts. Disappoints on intervention-robust export (4) by focusing on prediction of observations, not interventions. Handles design-stance independence (6) and grain-relativity (10) well.  
  - **Minimum Description Length (MDL) refinement**: Disappoints preferences but satisfies non-negotiables. Handles code-cost sensitivity (7) via two-part codes (model + data). Disappoints on non-manipulability tolerance (8) if MDL requires predictive accuracy under interventions. Disappoints on degree-sensitivity (5) by often yielding binary "best" models.  
  - **Interventionist/difference-making account**: Violates non-negotiables. Satisfies intervention-robust export (4) by tying patterns to causal structure. Violates non-manipulability tolerance (8) by excluding patterns in unmanipulable domains (e.g., fossils). Violates design-stance independence (6) if intentional patterns require causal-mechanistic backing.  
  - **Deflationary/projective account**: Violates non-negotiables. Collapses reality into usefulness, violating non-instrumental reality (1) and system-anchored invariance (3). Handles degree-sensitivity (5) and grain-relativity (10) trivially (all patterns are interest-relative) but fails reflexivity (11) if the account itself is merely useful.
