prompt: |-
  I'm a fifth-year PhD student in philosophy, and next week I'm presenting a dissertation chapter at a departmental works-in-progress session — twenty minutes of talk, forty minutes of questions. The chapter defends a version of the view that there is a genuine moral asymmetry between lying and merely misleading, but locates that asymmetry somewhere other than where the usual accounts put it. I argue that what matters is not the distinction between asserting something false and merely implicating something false, but a norm I call 'question ownership': whoever has implicitly taken on the role of determining which question is live in an exchange — by inviting it, by framing the agenda, or by occupying a role on which others are licensed to rely — owes the other party a distinctive epistemic service, namely keeping the answer-channel clean, and lying is the canonical breach of that duty. On this basis I sort deceptive maneuvers into answer-misleading (you implicate a falsehood in responding to a question the hearer already had), frame-misleading (you reshape what the hearer takes to be the relevant question, using only true statements), and salience-misleading (you leave the question untouched and manipulate only which truths are perceptually or memetically salient — think of the committee chair who circulates the full spreadsheet but highlights only the rows favoring her candidate). My claim is that the asymmetry is at its strongest in the first class, noticeably weaker in the second, and effectively absent in the third, because question ownership does real work only where the hearer's own question-forming capacity has been preempted. I'm reasonably happy with the architecture and much less happy about the question period.

  The audience is where I need help. It's about twenty-five people. There are three people working in the Kantian and Anscombean traditions who think the lying/misleading distinction is both obvious and absolute, and who will be unmoved by any talk of conversational roles; they care about intention, the will, and the historical casuistry around mental reservation. There are four broadly consequentialist or information-economics-minded people who think the distinction is morally inert and that only expected effects on the hearer's credences matter, and who will want to know why I'm not just reinventing a garbled version of their view. There are two experimental philosophers who have run studies in which ordinary participants' deception judgments track outcome severity and the perceived violation of a trust relationship far more than they track anything about assertion versus implicature, and who will want to know whether my three-way taxonomy predicts anything they could test. And there is one philosopher of language who will press hard on whether the assertion/implicature boundary is stable enough to bear the weight I put on the answer-misleading case at all, plus a handful of graduate students who mostly want to know what my view says about silence and omission in professional advising, which is the application I gesture at in the last three minutes.

  What I'd like is a Q&A prep sheet rather than a defense of the chapter. Give me the objections I should expect from this specific room, ordered by how likely they are and how much damage they'd do if I handle them badly, and phrase each one the way that subgroup would actually phrase it — in their vocabulary, with their background assumptions visible, not translated into my terms. For each: a reply I could deliver in roughly two minutes, what I should concede outright before they force it out of me, and a note on where that reply is soft. Tell me which single reply has to land for the chapter to survive the session, where I should distinguish my position from the consequentialists rather than agree with them too quickly, and how I should handle the objection that my three-way taxonomy is really just a list of ways to mislead with no principled stopping point. Finally, include the question I'm quietly hoping nobody asks, and be blunt about why it's the dangerous one.
reasoning: |-
  Okay, let me digest this request. A fifth-year philosophy PhD student preparing for a dissertation chapter defense on the moral asymmetry between lying and misleading, with a novel "question ownership" framework. The user needs tactical Q&A prep tailored to their specific departmental audience composition and intellectual factions. 

  Hmm, the core challenge here is triple-layered: First, translating abstract normative theory into concrete debate strategy. Second, anticipating objections across incompatible philosophical paradigms (deontological vs consequentialist vs experimental). Third, identifying the hidden fault lines in their own argument before opponents do. 

  The user's description of their chapter reveals several high-stakes vulnerabilities: 
  - The "question ownership" concept must do heavy lifting to replace assertion/implicature as the asymmetry anchor
  - The three-way taxonomy risks appearing ad hoc without clear boundaries
  - Potential consequentialist co-option threatens theoretical distinctiveness
  - Experimentalists may see no testable predictions

  *flipping through mental notes of philosophical debates* Right, the prep sheet needs to prioritize by threat level. Kantians/Anscombians pose existential risk because they reject the foundational premise. Must prep surrender terms ("I concede this doesn't engage will-centric views") while protecting the core innovation. 

  For consequentialists, the trap is letting them frame the debate in credence terms. Reply should emphasize normative architecture ("your view can't explain why frame-misleading feels less dirty than answer-misleading"). Save the "different explanandum" pivot for when pressed. 

  Ah, the taxonomy-stability objection from the philosopher of language... that's the silent killer. If the answer/frame/salience boundaries blur under pressure, the whole system crumbles. Need to prep phenomenological examples (spreadsheet highlighting vs agenda-steering) but admit it's more spectrum than strict categories. 

  *scribbling imaginary whiteboard* The graduate students' omission question is actually a gift - it showcases applied value. Should expand the "licensing reliance" point beyond the written chapter. 

  The nightmare question? It's the one where the experimentalist asks for falsifiable predictions while the consequentialist simultaneously argues the taxonomy doesn't track moral weight. That collision could make the framework look both untestable and redundant. 

  Final prep principle: Arm the user with strategic concessions. Sometimes yielding ground ("salience cases may indeed collapse") saves the citadel.
answer: |-
  Here’s your Q&A battle plan, structured by threat level and faction. Prioritize rehearsing replies for **bolded** objections. The single reply that *must* land is **#1 (Kantian/Anscombean)** – if you lose them completely, the core normative claim evaporates.

  ---

  ### **Tier 1: Existential Threats (High Damage/Likely)**
  1. **Kantian/Anscombean Objection (Phrased as they would):**  
     *"You’re ignoring the intrinsic wrong-making feature of lying: it’s a direct violation of the rational will by using their capacity for assent against them. Misleading might be manipulative, but only lying forces the hearer to *endorse* falsehood. Your 'question ownership' is just pragmatics—it doesn’t touch the moral essence."*  
     - **Reply (2 min):** "I concede that on a will-centric view like yours, my account doesn’t capture the *fundamental* wrong of lying. But my target is narrower: why do *we* judge lying as *worse* than misleading in cases with identical outcomes and intentions? Question ownership explains *that* asymmetry in ordinary moral intuitions by showing how lying uniquely corrupts a specific cooperative practice we rely on. It’s complementary to, not competing with, your account of intrinsic wrongness."  
     - **Concede upfront:** Your theory doesn’t engage will/violation-of-assent arguments.  
     - **Soft spot:** They may dismiss you as addressing a "superficial" asymmetry.  

  2. **Consequentialist/Objection (Phrased as they would):**  
     *"This seems like a convoluted way to say 'some deceptions cause more expected harm'. When you 'reshape the question' or 'pollute the answer-channel', you’re just describing how certain acts raise credences in false beliefs more efficiently. Why not reduce question ownership to information economics?"*  
     - **Reply (2 min):** "Because the *wrong* isn’t just about false credences—it’s about violating a role-based duty to provide epistemic access. A doctor who lies about test results breaches a specific duty of candor tied to their role, even if a stranger’s identical lie causes identical harm. Question ownership captures why role violations *amplify* the wrong beyond pure harm, which consequentialism flattens."  
     - **Concede upfront:** Expected harm correlates strongly with severity in your taxonomy.  
     - **Soft spot:** If pressed, admit answer-misleading often *does* cause more harm—but insist the duty breach adds distinct normative weight.  
     - **Crucial move:** Distinguish by emphasizing **role-based duties** (not just outcomes) when replying to consequentialists.  

  ---

  ### **Tier 2: Structural Threats (Moderate Damage/Very Likely)**
  3. **Philosopher of Language Objection (Phrased as they would):**  
     *"You rely heavily on the 'answer' vs. 'frame' distinction, but implicatures can be as determinate as assertions (e.g., conventional implicatures), and assertions can be vague. Isn’t the stability of this boundary precisely what your account needs—and lacks?"*  
     - **Reply (2 min):** "I agree the assertion/implicature line can blur—that’s *why* I shift focus to question ownership. What matters isn’t linguistic form but *who controls the epistemic agenda*. If I answer 'Is the conference in July?' with 'It’s in summer' (true but misleading), I’ve polluted *your* question. If I instead say 'Let’s talk about summer conferences!' (reframing), I’ve imposed *my* question. The wrong is clearest when I sabotage *your* agenda."  
     - **Concede upfront:** Some cases will be hard to classify linguistically.  
     - **Soft spot:** Taxonomy may struggle with ambiguous speech acts.  

  4. **Taxonomy Ad Hoc? Objection (Likely from Grad Students/Consequentialists):**  
     *"Your three categories seem arbitrary. What stops me from adding 'tone-misleading' or 'context-misleading'? Is this just describing *how* people mislead, not why some ways are *worse*?"*  
     - **Reply (2 min):** "The cut isn’t arbitrary—it tracks *whose epistemic agency is preempted*. Answer-misleading hijacks the hearer’s question; frame-misleading replaces it; salience-misleading works *within* it. We could add sub-categories, but the moral gradient comes from diminishing interference with the hearer’s question-forming capacity."  
     - **Concede upfront:** Boundaries between categories are porous (e.g., framing can affect salience).  
     - **Soft spot:** Needs clear examples to feel non-arbitrary (e.g., spreadsheet highlighting = salience; "Don’t worry about July" = framing).  

  ---

  ### **Tier 3: Pressures to Expand/Test (Low Damage/Likely)**
  5. **Experimental Philosopher Objection (Phrased as they would):**  
     *"Our data shows folk judgments track trust violations and harm, not your categories. Can your view generate testable predictions? For example, would manipulating 'question ownership' in vignettes change moral ratings?"*  
     - **Reply (2 min):** "Absolutely. Predict: If two deceivers cause identical harm/trust-violations, but one hijacks a question the hearer explicitly asked (e.g., 'Did you submit the report?' → lying) while the other reframes (e.g., 'Let’s discuss deadlines tomorrow' → omitting lateness), participants should rate the liar worse. I’d love to collaborate on testing this!"  
     - **Concede upfront:** Your view *predicts* that harm/trust matter most—but claims they aren’t the whole story.  
     - **Soft spot:** If their data shows *no* extra variance explained by your factors, it weakens your claim.  

  6. **Grad Student (Omission/Silence) Question:**  
     *"You mention advising—what does question ownership say about a professor who stays silent when a student asks 'Is this topic viable?' but knows it’s not?"*  
     - **Reply (2 min):** "If the professor owns the question (by role/licensing), silence breaches the duty to keep the answer-channel clean—it’s answer-misleading by omission. But if the student speculates unprompted, silence might be mere salience-misleading (less bad). Key: Does the role *obligate* you to address the question?"  
     - **Concede upfront:** Silence is ambiguous; context determines if it’s duty-violating.  

  ---

  ### **The Silent Killer: The Question You Hope Nobody Asks**
  **Objection (Likely from Philosopher of Language or Sharp Consequentialist):**  
  *"If 'question ownership' is defined by social roles/conventions, doesn’t that make your asymmetry contingent and culture-bound? Couldn’t a society arise where reframing is *worse* than lying—undermining your claim that answer-misleading is universally strongest?"*  

  **Why it’s dangerous:**  
  - It attacks the **universality** of your moral asymmetry, suggesting it’s merely conventional.  
  - If answer-misleading isn’t *inherently* worse (just worse *given our practices*), your "distinctive wrong" collapses into relativism.  
  - Forces you to either defend universal role norms (hard) or concede contingent asymmetry (undercuts novelty).  

  **Reply (Have this ready):**  
  "I argue that *when* a practice of question-ownership exists (as in cooperative contexts like advising, testimony, promises), breaching it is pro tanto worse. In societies without such practices, deception might lack this layer of wrongness—but those societies would lack deeply valuable epistemic cooperation. The wrong is in betraying *this* kind of social good."  
  **Damage control:** Cast question ownership as a precondition for high-trust cooperation (implying it’s not *arbitrarily* contingent).  

  ---

  ### **Summary Cheat Sheet**
  | **Faction**              | **Likely Attack**                                          | **Your 2-Minute Shield**                                  | **Concede Early**                               |
  |---------------------------|-----------------------------------------------------------|----------------------------------------------------------|------------------------------------------------|
  | Kantian/Anscombean        | "Ignores will/violation of assent" (**#1**)               | "Targets intuitive asymmetry, not intrinsic wrong"        | "Doesn’t replace will-centric views"           |
  | Consequentialist          | "Just dressed-up harm" (**#2**)                           | "Role duties add distinct wrong beyond harm"              | "Harm often correlates"                        |
  | Philosopher of Language   | "Boundary instability" (**#3**)                           | "Focus on agenda control, not linguistic form"            | "Some cases messy"                             |
  | Experimentalist           | "Where’s the testable prediction?"                        | "Predicts liar > framer in equal harm scenarios"          | "Harm/trust are primary drivers"               |
  | All                       | "Taxonomy is ad hoc" (**#4**)                             | "Tracks whose epistemic agency is preempted"              | "Boundaries are porous"                        |

  **Critical Takeaway:**  
  - **#1 (Kantian) reply MUST land** – If they paint you as ignoring "real" morality, others pile on.  
  - **Distinguish from consequentialists** by hammering **role-based duties** in #2.  
  - **If taxonomy feels arbitrary**, pivot to **epistemic agency preemption** as the unifying thread.  

  Go in ready to sacrifice salience-misleading asymmetry if pressed—protect the answer-misleading core. And if the silent killer drops, anchor it in the **value of epistemic cooperation**. Good luck!
