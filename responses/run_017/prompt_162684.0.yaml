  ## The Constant Sentence  
  *(after Grice)*

  The speaker said the room was simply **cold**.  
  No metaphor was meant; the hour was **late**.  
  She stated that the work had gone quite **well**,  
  Assuring him the outcome would be **fine**.  
  She claimed the argument stood perfectly **still**.  
  Her words were plain beneath the kitchen **light**.

  He felt the chill implied by that stark **light**,  
  The judgment sharp behind the stated **cold**.  
  He heard reproach where meaning seemed **still**,  
  A hidden charge for why he came so **late**.  
  Could "outcome fine" mean merely not a crime,  
  Not praise? She watched him anxiously, un**well**.

  Was she un**well**, or had the task gone ill?  
  Her tone seemed strained beneath the buzzing **light**.  
  "Gone well" might mask fatigue, imply "not **fine**,"  
  While "cold" suggested warmth withdrawn, grown **cold**.  
  His lateness grated, obvious and **late**,  
  Excuses forming, desperate, never **still**.

  This doubt she sensed, and quickly said, "Be **still**!  
  I only spoke of facts – I feel quite **well**,  
  No blame attached because you are **late**."  
  (Cancelled: the sting beneath the hanging **light**).  
  But "cold" remained, a fact she couldn't **cold**,  
  Though stripped of frost, could "room is cold" be **fine**?

  He calculated: Principle, Context **fine** –  
  Why mention cold unless the chill's not **still**?  
  Why "gone quite well" if truly all was **well**?  
  The bare words glowed, demanding more than **light**.  
  Intention layered what was plainly **cold**;  
  The message thickened, dense, though spoken **late**.

  No synonym could shed this freight of **late**  
  ("Delayed" sounds clinical, lacks "fine"  
  Nuance of failure). Like the stubborn **cold**,  
  The implication clung, refused **still**  
  Detachment. Meaning bloomed beyond the **light**  
  Of sentence sense. Was her true meaning **well**-

  Concealed? Her meaning must intend his **well**-  
  Being grasp the unstated, though **late**.  
  Recognition: mutual, in shared **light**,  
  That saying "fine" might signal "not quite **fine**,"  
  That "cold" implies "please shut the door," held **still**  
  As inference. The literal stays **cold**.

  ---

  **Envoi**  
  This crowded sense, beneath the buzzing **light**,  
  Where saying **cold** implies the hearth's not **well**,  
  Where **late** and **fine** and **still** press close, too **fine**  
  To split. Intending you to know I **still**  
  Intend this meaning... circling, **late**  
  Recognition lights the constant **cold**.

  ---

  **Note:**  
  A sympathetic Gricean might object to the envoi's implication that speaker intention is *transparently* recovered solely via mutual recognition, eliding the inferential work and potential for miscommunication inherent in calculability. If Relevance Theory is correct, rendering much 'implicature' part of the explicit 'what is said' via pragmatic enrichment (e.g., 'cold' meaning *uncomfortably* cold), the penultimate stanza's focus on 'cold' as purely said might require revision to show its contextually enriched explicature. If the circularity objection holds (defining speaker meaning via recognition of the intention defining that meaning), the envoi's closing loop ("Intending you to know I still / Intend this meaning") would need significant reworking, as it directly enacts the problematic circularity Grice's definition invites. The word 'still' might be most vulnerable, as its role in signalling persistence of intention is central to the circular formulation.
