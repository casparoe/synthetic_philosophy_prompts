prompt: |-
  You are a philosopher of cognitive science who has worked on — or directly alongside — the predictive processing and free energy principle literature, and who is willing to say plainly where the field's real fault lines lie instead of presenting it as a settled consensus. Please think carefully, and before you write anything for me, do a short private pass in which you (i) break what follows into its individual claims, (ii) tag each as accurate, defensible simplification, conflation of two things the framework keeps apart, overstatement of a modest thesis, or simply wrong, and (iii) note which of them are contested inside the literature and which are contested only by its critics. Then give me the audit in prose, claim by claim, with a one-line verdict on each and, wherever my friend goes wrong, the nearest true claim she was reaching for.

  The setup: I'm a philosophy graduate student who works mostly on mental representation from the teleosemantics side, and I've been sitting in on a reading group on Bayesian approaches to the brain. Last night I had a long and increasingly frustrating argument with a friend — she's an ML engineer who follows this literature closely and is extremely confident about it — and she finally wrote down her summary of the whole framework so we could stop talking past each other. Her version, as she sent it to me, was this: The brain is sealed inside a dark, silent skull and never touches the world, only its own neural activity, so everything you experience is a construction: the cortex runs a generative model of the causes of its input, sends predictions down the hierarchy, and receives back only what the predictions failed to anticipate, weighted by how precise the prediction is — precision is just attention under a technical name. Perception is therefore controlled hallucination: the brain guesses first and lets the world edit. Free energy is just the technical word for surprise, so the whole game is to keep surprise as low as possible, and there are exactly two ways to do that, namely change your predictions to fit the world, which we call perception, or change the world to fit your predictions, which we call action; that's active inference, and it's the same computation running in opposite directions, which is why perception and action turn out to be one phenomenon. The Bayesian part isn't a metaphor either — neurons literally encode probability distributions and apply Bayes' rule. The deep result is that any system that manages to stay alive, whether a cell, a brain or an ecosystem, must thereby minimize its free energy, and that isn't an empirical claim you could go out and refute; it follows from the system's having a Markov blanket, a boundary separating inside from outside. The real payoff is metaphysical: once you see that internal states are tracking the causes of their own sensory states, there's no leftover hard problem — what it is like to be you just is that inference, a thermostat is already doing a crude version of the same thing, and the only difference between it and you is how deep the inference goes. And that's why the theory does make one genuine prediction: since minimizing free energy requires the model to be tight rather than true, the brain should be perfectly willing to confabulate, so most of what you consciously experience should be a useful fiction rather than an accurate picture. When I raised the obvious objection — if the goal is to keep surprise low, why doesn't every organism just curl up in a dark, quiet room forever? — she said that objection just shows I haven't understood it, because the organism's own model already encodes that it shouldn't be in a dark room, so of course it doesn't go there.

  I don't have library or web access where I'm writing, so please don't send me to any papers, bibliographies or reading lists: I need the conceptual audit itself, with the moves spelled out. What I'd like is this. First, go through her summary and tell me, for each claim, what a sympathetic but careful person in this literature would happily endorse, what they'd wince at as a simplification, and what they'd reject outright — and where the mistake is a conflation rather than a falsehood, say exactly which two things are being run together. Second, take her three extra conclusions — that the hard problem dissolves, that a thermostat has beliefs in the same sense we do and differs from us only in degree, and that the framework predicts pervasive confabulation — and tell me whether any of them follows from the corrected version of the summary, or whether they were only ever supported by the parts that turned out to be misstated. Third, from where I'm standing the deepest worry is about content: if all this machinery gives you is internal states whose dynamics can be described as if they parametrize a distribution over external causes, does anything in the story do the work of making a state be about something, or is the talk of inference, belief and prediction purely honorific — and does the answer change if you accept her claim about Markov blankets? Fourth, tell me whether her reply to my dark-room objection is the standard answer or a dodge, and what the strongest version of the objection is that survives it. Finally, flag which two or three claims in her summary I could safely repeat in a seminar paper without being pulled up on, and which one I should definitely not repeat.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy grad student specializing in teleosemantics who needs a conceptual audit of their ML-engineer friend's summary of predictive processing. 

  First, I need to break down the friend's claims one by one. The "dark silent skull" metaphor is vivid but misleading - while the brain doesn't directly access the world, it's not "sealed" in the way implied. The generative model part is mostly correct, though "controlled hallucination" oversimplifies by downplaying sensory constraints. 

  When she equates precision with attention, that's actually a defensible simplification many in the field use. But claiming neurons "literally encode probability distributions" is where things go off-track - most theorists see this as a useful mathematical description rather than literal neural implementation. 

  The Markov blanket argument is philosophically contested but internally consistent within the framework. Where it really unravels is the metaphysical claims - dissolving the hard problem and thermostats-as-inferrers are highly speculative inferences that don't follow from the core theory. 

  For the user's specific concerns: the dark-room objection isn't fully addressed by saying "the model forbids it" - that just kicks the can to why models have survival-promoting structure. On content, even with Markov blankets, the "aboutness" question remains open and teleosemantics might actually complement PP here. 

  If I were advising which claims to use in a seminar paper, the generative model and active inference points are relatively safe, but I'd steer clear of the "thermostats have beliefs" equivalence. The deepest unresolved issue is whether minimizing prediction error can ground intentionality without smuggling in teleology.
answer: |-
  Here’s a claim-by-claim audit of your friend’s summary, followed by your specific queries. I’ve categorized each claim as **Accurate**, **Defensible Simplification (DS)**, **Conflation (C)**, **Overstatement (O)**, or **Wrong (W)**, and noted where disagreements originate.

  ### Claim Audit
  1.  **"The brain is sealed inside a dark, silent skull... only its own neural activity."**  
      *Verdict*: **DS/O**.  
      *Breakdown*: Accurate that the brain accesses the world indirectly via sensory data, but "sealed" overstates isolation. Sensory activity is *causally coupled* to the world. Critics (e.g., embodied cognition theorists) contest this isolation; PP theorists argue it’s compatible with embodiment.  
      *Nearest true claim*: "The brain only directly interacts with sensory signals, not the world-in-itself."

  2.  **"Everything you experience is a construction... cortex runs a generative model."**  
      *Verdict*: **Accurate**.  
      *Breakdown*: Core PP thesis. Endorsed by proponents (e.g., Friston, Hohwy). Critics (e.g., direct realists) reject it, but internally uncontested.

  3.  **"Sends predictions down... receives back only prediction errors."**  
      *Verdict*: **Accurate**.  
      *Breakdown*: Standard description of hierarchical prediction-error minimization. Internally uncontested.

  4.  **"Precision is just attention under a technical name."**  
      *Verdict*: **DS**.  
      *Breakdown*: Precision weighting *modulates* attention but isn’t identical to it (attention involves other mechanisms). Proponents accept this as shorthand; some cognitive scientists note conflation of neuromodulation (e.g., acetylcholine) with phenomenology.

  5.  **"Perception is controlled hallucination: brain guesses first, world edits."**  
      *Verdict*: **DS**.  
      *Breakdown*: Memorable phrasing (Andy Clark), but "hallucination" overemphasizes top-down dominance. Sensory input actively constrains inference. Critics (e.g., Gibsonians) contest heavily; proponents clarify it’s "data-informed hallucination".

  6.  **"Free energy is surprise... keep surprise low."**  
      *Verdict*: **Accurate** (for Fristonian FE).  
      *Breakdown*: Free energy ≈ upper bound on surprise. Minimizing FE ≈ minimizing surprise. Core tenet, uncontested internally.

  7.  **"Two ways to minimize surprise: change predictions (perception) or change the world (action)."**  
      *Verdict*: **Accurate**.  
      *Breakdown*: Definition of active inference. Internally uncontested.

  8.  **"Active inference: same computation in opposite directions."**  
      *Verdict*: **DS/O**.  
      *Breakdown*: Perception and action both minimize prediction error, but involve distinct neural pathways and mechanisms. Proponents (Clark) endorse the unity; skeptics (e.g., movement scientists) note disanalogies in implementation.

  9.  **"Perception and action are one phenomenon."**  
      *Verdict*: **O**.  
      *Breakdown*: Overstates unity. They are *functionally complementary* under FE minimization but remain distinct processes. Contested internally (e.g., by PP theorists emphasizing sensorimotor contingencies).

  10. **"Neurons literally encode probability distributions and apply Bayes' rule."**  
      *Verdict*: **W/O**.  
      *Breakdown*: Neurons *approximate* Bayesian inference (e.g., via predictive coding), but don’t "literally" encode distributions or compute Bayes’ rule explicitly. Major point of contention: **critics** (e.g., Marr-style computationalists) call this empirically false; **proponents** (Friston) treat it as a mathematical metaphor; **moderates** (Clark) say it’s "as-if" Bayes.

  11. **"Any system that stays alive must minimize free energy... follows from having a Markov blanket."**  
      *Verdict*: **C/W**.  
      *Breakdown*: Conflates *mathematical necessity* with *biological reality*. IF a system has a Markov blanket (separating internal/external states), THEN it can be described as minimizing FE. But this doesn’t mean all living systems *must* do so—it’s a modeling choice. **Internally contested**: Friston presents it as ontological; others (e.g., Colombo, Piccinini) argue it’s a useful fiction.

  12. **"Internal states track causes of sensory states → no hard problem."**  
      *Verdict*: **W**.  
      *Breakdown*: PP explains how internal models *correlate* with external causes, but doesn’t address why this should entail subjective experience. Rejected by most philosophers of mind (incl. PP sympathizers like Chalmers). *Nearest true claim*: "PP reduces perception to inferential processes, bypassing *some* explanatory gaps."

  13. **"A thermostat is doing inference... difference is only depth."**  
      *Verdict*: **W**.  
      *Breakdown*: Thermostats lack generative models, precision weighting, or hierarchical prediction. They are simple control systems. **Critics** (e.g., Bennett, Hacker) call this category error; **proponents** (Friston) defend it under FE formalism. *Nearest true claim*: "All adaptive systems can be *modeled* as minimizing surprise."

  14. **"Minimizing FE requires tight models over true models → predicts pervasive confabulation."**  
      *Verdict*: **DS**.  
      *Breakdown*: Accurate that models prioritize pragmatic success over truth, and confabulation occurs. But "pervasive" overstates empirical support. Endorsed by PP theorists (e.g., Hohwy), contested by realists.

  15. **Reply to dark-room objection: "Model encodes it shouldn’t be there."**  
      *Verdict*: **DS (but inadequate)**.  
      *Breakdown*: Standard reply, but circular without explaining *why* models encode survival needs. **Stronger PP response**: "Agents model themselves as existing in niche-appropriate states; dark rooms violate predictions about bodily needs (e.g., hunger)." **Surviving objection**: "Why do generative models evolve/learn to prefer states conducive to survival, rather than self-annihilating predictions?" (This targets PP’s reliance on implicit biological norms.)

  ---

  ### Your Specific Queries
  **1. Do her three conclusions follow from a corrected summary?**  
  - **Hard problem dissolution**: No. Corrected PP explains information processing, not phenomenality.  
  - **Thermostats have beliefs**: No. Corrected PP restricts "belief" to systems with hierarchical generative models.  
  - **Pervasive confabulation**: Partially. A corrected summary predicts *some* confabulation, but "pervasive" requires additional evidence.  

  **2. Content/Intentionality**:  
  PP *describes* states as "about" external causes, but doesn’t *ground* aboutness. Markov blankets define statistical dependencies, not semantic content. Without teleosemantics (or similar), "inference" is indeed honorific—a mathematical description without intrinsic intentionality. **Your teleosemantic approach could complement PP** by grounding content in evolutionary function.  

  **3. Dark-room reply**:  
  Her reply is the **standard but shallow answer**. The **strongest surviving objection** is: *Why do biological systems maintain generative models that predict their own continued existence, rather than modeling self-destruction as optimal?* PP implicitly assumes survival is a prior, but doesn’t explain this normativity.  

  **4. Safe/Unsafe Claims for a Seminar Paper**:  
  - **Safe to repeat**:  
    - "The brain uses a generative model to predict sensory inputs and minimizes prediction error."  
    - "Active inference unifies perception (updating predictions) and action (changing sensory inputs)."  
    - "Precision weighting modulates the influence of prediction errors (linked to attention)."  
  - **Do NOT repeat**:  
    - "Neurons literally encode probability distributions and apply Bayes’ rule." (This is widely criticized as neuroscientifically implausible.)  

  ---

  **Key Fault Lines**:  
  1. **Metaphysical scope**: Is FE minimization an empirical theory or a universal principle?  
  2. **Neural implementation**: Is Bayesian inference literal or "as-if"?  
  3. **Hard problem**: Does PP address consciousness or evade it?  
  4. **Normativity**: Can PP explain *why* agents avoid dark rooms without circularity?  

  PP’s power lies in unifying perception/cognition/action under prediction-error minimization. Its weaknesses are overextension (e.g., to thermostats), underspecified neural mechanisms, and ungrounded normativity. Your teleosemantic perspective can push back where PP handwaves content and biological goals.
