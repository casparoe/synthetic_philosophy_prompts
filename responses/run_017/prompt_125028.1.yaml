  The user wants concision—no citations, just conceptual clarity. They'll build their own scorecard, so my role is to scaffold that with sharp distinctions (e.g., "non-negotiable: no duty to create happy child" vs. "contested: axiological independence").  

  Biggest tension: Strong asymmetry likely forces intransitivity or repugnance. Person-affecting views handle asymmetry but fail aggregation; impersonal views avoid repugnance but collapse asymmetry. The "critical requirement" excluding most views? Probably the combo of asymmetry and no discontinuous jumps—it rules out many threshold-based solutions.  

