answer: |-
  Here’s a specification for an adequate account of the procreation asymmetry, anchored to your cases and practical aims. Desiderata are categorized as **non-negotiable** (NN) for any asymmetry-respecting view or **contested** (C), reflecting inter-theoretic disputes.  

  ### Core Desiderata  
  1. **Asymmetry in Deontic Reasons (NN)**  
     - *Case*: Straight choice between creating a well-off child vs. creating no one.  
     - *Requirement*: No moral reason to create the happy child, but a strong reason *not* to create a miserable child. Must hold even if the act has no side effects.  
     - *Rationale*: Captures the core intuition that we are not obligated to create happy lives but are forbidden from creating miserable ones.  

  2. **Axiological Asymmetry (NN)**  
     - *Case*: Comparing (a) not creating a miserable child (good) and (b) not creating a happy child (not bad).  
     - *Requirement*: The absence of suffering in a nonexistent life is good (impersonally), but the absence of happiness in a nonexistent life is not bad (and not impersonally good).  
     - *Rationale*: Grounds the deontic asymmetry in a deeper value theory.  

  3. **Independence of Deontic and Axiological Claims (C)**  
     - *Case*: Creating a child with a life well worth living.  
     - *Requirement*: The theory must allow that creating the child *benefits them* (once they exist) while maintaining there was *no prior reason* to create them.  
     - *Rationale*: Avoids conflating "no duty to create" with "creation confers no benefit." Rejected by some impersonalists.  

  4. **Continuity in Reason-Strength (C)**  
     - *Case*: Creating a child with high expected welfare but a real risk of a life below neutrality (e.g., 90% chance of excellent life, 10% chance of misery).  
     - *Requirement*: The reason against creating does not "jump" discontinuously as the risk of a sub-neutral life approaches zero. Strength should diminish smoothly.  
     - *Rationale*: Preserves intuitive risk aversion without arbitrary thresholds.  

  5. **Non-Identity Case Handling (NN)**  
     - *Case*: Choosing which of two possible children to create (one with a much better life).  
     - *Requirement*: Strong reason to create the better-off child, even though both are "nonexistent" in advance.  
     - *Rationale*: Shows the asymmetry isn’t absolutist; we can have reasons *between* possible people.  

  6. **Temporal Neutrality / Non-Aggregation (C)**  
     - *Case*: Creating a decently happy child now vs. a happier child (different person) in 5 years.  
     - *Requirement*: No strong reason to delay for the happier child if the first child’s life is good.  
     - *Rationale*: Limits "replaceability" and avoids demanding constant deferral for marginal gains.  

  7. **Aggregation Resistance (C)**  
     - *Case*: Vast population with lives barely worth living vs. small population with excellent lives.  
     - *Requirement*: Does not require (or strongly favor) the vast population as "better."  
     - *Rationale*: Blocks the Repugnant Conclusion; prioritizes quality over quantity.  

  8. **Decision-Relevant Under Uncertainty (NN)**  
     - *Case*: Creating a child with high expected welfare but non-zero risk of misery.  
     - *Requirement*: Provides clear guidance (e.g., "don’t create if risk-adjusted welfare is sub-neutral").  

  ### On Your Friend’s Risk Argument  
  - **If the derivation works**, it *replaces* the asymmetry with generalized risk aversion. But it likely **presupposes the asymmetry**:  
    - Ordinary risk aversion weighs *harms to actual people* more heavily than forgone benefits. For *possible* people, the claim that "risk of harm dominates chance of benefit" already encodes the asymmetry.  
    - **Verdict**: The asymmetry remains a genuine desideratum. Risk-based accounts often smuggle in an asymmetry by weighting "avoiding creating suffering" more heavily than "pursuing creating happiness."  

  ### Suspected Incompatibilities  
  The triad below is likely **impossible to satisfy jointly**:  
  - **Strong Asymmetry** (Desiderata 1–2)  
  - **Transitive, Acyclic Betterness Ordering**  
  - **Immunity to Repugnant-Style Aggregation**  
    - *Why*: Strong asymmetry blocks adding happy lives from improving the world, violating transitivity when comparing populations of different sizes. Avoiding the Repugnant Conclusion typically requires accepting asymmetry-weakening premises (e.g., critical levels).  

  ### Most Exclusionary Requirement  
  **Desideratum 3 (Independence)** excludes the most views:  
  - Impersonal Totalism rejects it (no reason to create ⇒ no benefit conferred).  
  - Strong "person-affecting" views struggle (if creation benefits the child, how can there be *no reason* to do it?).  

  ### Quick Theory Pass (Against Full Desiderata)  
  - **Impersonal Totalism**: Fails 1, 2, 3, 6, 7 (requires creating happy people, endorses repugnance).  
  - **Average Utilitarianism**: Fails 1, 2, 5 (no reason to create happy child if average dips; can’t handle non-identity cases).  
  - **Critical-Level Theories**: Fails 1, 2 weakly (mild reason to create happy lives above critical level); may fail 4 if discontinuity at critical level.  
  - **Neutral-Range Views**: Fails 1, 2 if range is wide (no reason to create within range); may fail 4 if range boundaries are sharp.  
  - **Person-Affecting (Actualist)**: Fails 5, 8 (cannot compare possible people; silent on non-identity cases).  
  - **Anti-Natalism**: Saturates 1, 2, 7 but fails 5, 6 (forbids creating *any* child, happy or not).  

  ### Key Takeaway for Your Paper  
  **The central tension is between asymmetry and transitivity/aggregation.** If you insist on strong asymmetry (NN 1–2) and axiological independence (C 3), you likely must abandon a fully transitive "betterness" relation or accept repugnant conclusions. Risk-based approaches may "explain" intuitions but often implicitly rely on the asymmetry. Your cases—especially non-identity and uncertainty—will test whether a theory can be both intuitive and consistent. **The unsatisfiability of the full desiderata list is a defensible paper conclusion.**
