  The critical output they want is identifying conflicting desiderata. For instance: can we have strong asymmetry + transitivity + avoidance of repugnant conclusions simultaneously? I suspect not, based on impossibility proofs in population ethics—that might be their paper's key finding. 

  For structure, I'll:  
  - List non-negotiable vs. contested requirements tied to cases  
  - Analyze the friend's risk argument (does it covertly rely on asymmetry?)  
  - Identify likely incompatibilities (e.g., asymmetry + transitivity + non-repugnance)  
