prompt: |-
  I am in my final year of school, writing an extended essay on responsibility for failing to act, and I have run into the same wall every time I sit down to write: I have confident verdicts about which failures to act actually cause the things that happen next, and I cannot state the rule I am using to get them. I would like your help extracting it, testing it, and telling me where it breaks.

  By caused I mean whatever the ordinary word means in sentences like her failure to call the fire brigade caused the house to burn down — the sense that seems to matter for blame, not a technical sense.

  Here are my verdicts.

  1. A lifeguard on duty at a pool is reading her phone and does not notice a child struggling in the shallow end; she could have reached him in a few seconds. Verdict: her not going in caused the child's death.

  2. A lifeguard, off duty, in ordinary clothes, sunbathing beside a different pool, sees a child struggling there. She is a strong swimmer, the water is calm, there is no risk to her, and she does not go in. Verdict: I still want to say she caused it, but this is the verdict I am least sure of, and it feels different from case 1 in a way I cannot articulate.

  3. A tourist at the same pool who cannot swim and has no connection to anyone there, who also does not go in. Verdict: she did not cause the death, although she may have done something else wrong.

  4. My housemate promised to water my plant while I was away, forgot, and the plant died. Verdict: she caused it.

  5. A guest staying in the flat that week who saw the plant, knew it needed water, was never asked, and did not water it. Verdict: she did not cause it.

  6. In tennis, a ball comes to my forehand. I see it, I have time, and I decide not to swing; I let it pass. It lands in. Verdict: my not swinging caused the ball to land in.

  7. In January I decide not to give anything to charity this year. Somewhere abroad a child dies of an illness that a twenty dollar donation from me would have prevented. Verdict: I did not cause that death.

  Cases 6 and 7 are the pair I cannot reconcile. In both, I could have acted, I did not, the outcome would not have happened if I had acted, and in 7 I even formed the intention in advance. The difference cannot be ability, foresight, or whether the outcome was avoidable. The only thing I can point to is that in 6 I was already inside an activity and the ball was mine to deal with, while in 7 I was never engaged in anything relevant at all. I have come across the suggestion that some omissions are really negative actions rather than bare absences, and that sounds like my distinction, but I cannot say what turns a bare absence into a negative action.

  8. A machine raises an alarm only if two guards turn their keys at the same moment. Both are at their keys. Neither turns one. The fire spreads and the building burns. Neither guard alone could have made any difference. Verdict: both of them caused the fire to spread.

  9. A machine raises an alarm if any one of twenty bystanders pulls it. None does. The building burns. Verdict: the group's collective failure caused it, but no individual bystander did — and I hold this even though, for each of them taken separately, the fire would not have spread if that person alone had pulled it.

  So my questions. Is there one principle behind these verdicts, or am I using two? My own tentative rule is that an omission causes an outcome only when it is the non-performance of something within an activity the agent was already running, and cases 8 and 9 seem to add a separate requirement about the omission's standing in a set of omissions that jointly mattered. Please test that rule against all nine cases, state it back to me precisely, and tell me clause by clause which case forces each clause. Then tell me honestly which of my verdicts it cannot keep — in particular whether case 2 has to be reassigned to case 3's verdict, and what I would be giving up if I did that.

  I also need it to decide three cases I have not settled.

  10. I set up an automated assistant to email our group's file to the teacher by midnight. I never entered the instruction. Nothing was sent. We received a zero. Did my omission cause the zero, did the assistant's omission cause it, or neither?

  11. A school district never got around to installing carbon monoxide detectors in a boarding house; a leak kills a student. The official who would have signed the order left the post two years before. Whose omission, if anyone's, caused that death?

  12. A town council voted down a flood barrier in 1970. In 2025 the river floods and two people die in a house that the barrier would have protected. Did the councillors' failure to build it cause those deaths?

  Finally, give me one case of your own construction — one I have not listed — that your principle decides in a way you think I would find surprising, and say what it decides.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're working on an extended essay about responsibility for failing to act, specifically what makes an omission count as causing a bad outcome. They've listed several cases where they intuitively feel whether the omission caused the outcome but can't find the underlying rule. The key issue seems to be distinguishing between causal responsibility and moral responsibility, especially in cases like the off-duty lifeguard versus the tourist.

  Hmm, looking at their cases, I notice a pattern. In situations where someone has a specific role or is actively engaged in a task (like the lifeguard on duty, the housemate who promised to water plants, or the tennis player), their inaction feels causal. But when there's no prior engagement (like the tourist, the charity case, or the guest who wasn't asked), the omission doesn't feel like it caused the outcome. The machine cases with multiple guards add complexity because even if no one individual's action would have sufficed, their collective inaction is seen as causal when they had assigned roles.

  The user's tentative rule about "non-performance within an activity the agent was already running" makes sense. But how to define "activity" clearly? Maybe it's about being in a position where action is expected due to role, promise, or current engagement. The tennis example is interesting—it's a momentary engagement in the game, making the inaction feel causal, unlike the charity case where there's no such context.

  Testing their rule against case 2, the off-duty lifeguard: she's not on duty but has expertise and is present. The user feels uneasy here. If we stick strictly to the role-based rule, she might not qualify, but maybe presence and capacity create a minimal "activity" engagement. However, that might stretch the definition too far. Perhaps it's better to treat her like the tourist, saying she didn't cause the death but might bear moral responsibility.

  For the unsettled cases: the automated assistant fails because the user didn't set it up, so the user's omission is causal. The school district official who left—since they're no longer in the role, their past inaction isn't causal; it's the current administration's failure. The 1970 council vote is tricky. Decades later, many other factors intervene, so it might not be direct causation anymore.

  I should also consider counterexamples. What about a parent who stops feeding their child? That's clearly causal omission due to role. But what if a passerby sees a neglected child and doesn't intervene? That feels non-causal like the tourist, even if morally wrong. The user might find it surprising if the rule says the passerby didn't cause the death, emphasizing the distinction between cause and blame.
answer: |-
  Here's a breakdown of your intuitive principle, tested against your cases, refined into a precise rule, and applied to your unsettled cases. Your core intuition about "activity" is powerful, but needs sharpening.

  **The Extracted Principle (The "Role-Embedded Omission" Rule):**

  An omission (failure to act) causes outcome O if and only if:
  1.  **Role/Position:** The agent occupied a specific role, position, or undertook a commitment (explicit or strongly implied by context) at the relevant time, *directly* related to preventing O or performing action A which would have prevented O.
  2.  **Capability & Opportunity:** The agent was capable of performing A and had the opportunity to do so at the time O was imminent or preventable.
  3.  **Exclusivity of Preventative Path (Modified by "Sets"):** The omission constituted the failure of *the specific, designated pathway* or *a necessary element within a designated set of pathways* intended to prevent O. If multiple agents share the same role/commitment within the same preventative set, their omissions collectively cause O, even if no single omission was sufficient.

  **Why this captures your intuitions:**

  *   **"Activity" becomes "Role/Position/Commitment":** This clarifies the ambiguity in "activity". It's not just being busy, but occupying a *functionally defined position* with attached responsibilities (lifeguard on duty, housemate who promised, tennis player in the point) or undertaking a specific commitment.
  *   **"Negative Action" becomes "Failure of Designated Pathway":** The omission isn't just an absence; it's the *failure of the mechanism assigned to prevent O*. The lifeguard chair *is* the safety mechanism. The housemate's promise *is* the watering mechanism. Your forehand swing *is* your assigned method to return the ball. In the guard case, the dual-key system *is* the designated mechanism; each guard's key *is* a necessary element of that single pathway. In the bystander case, there is *no* designated mechanism assigning responsibility to any specific individual.
  *   **Clause-by-Clause Justification from Your Cases:**
      *   **Clause 1 (Role/Position) forced by:** Case 3 (Tourist: no role), Case 5 (Guest: no role/commitment), Case 7 (Charity: no role/commitment to that specific child).
      *   **Clause 2 (Capability/Opportunity) forced by:** Implicit in all cases, but explicitly rules out blaming the non-swimmer (Case 3) or someone who couldn't act in time.
      *   **Clause 3 (Exclusivity/Designated Set) forced by:** Case 8 (Guards: dual-key is a single designated pathway with necessary elements) vs. Case 9 (Bystanders: no designated pathway or assignment of responsibility to individuals; it's a general opportunity). Case 6 (Tennis: your swing is the designated pathway *for you* during that point) vs. Case 7 (Charity: no designated pathway assigning *you* as the specific preventer).

  **Testing the Rule Against Your Verdicts:**

  1.  **Lifeguard (On Duty):** YES. Role (lifeguard), Capable, Designated pathway (her vigilance/rescue).
  2.  **Lifeguard (Off Duty):** **NO.** *This is where the rule disagrees with your tentative verdict.* She has capability, but crucially *lacks the role/position at that time* and *is not part of any designated pathway* for *that* pool. She's morally blameworthy but doesn't *cause* the death by omission under this rule. (This aligns your Case 2 with Case 3/5/7).
  3.  **Tourist:** NO. Lacks Role/Commitment, not part of Designated Pathway.
  4.  **Housemate (Promised):** YES. Role/Commitment (promise), Capable, Designated pathway (her watering).
  5.  **Guest:** NO. Lacks Role/Commitment, not part of Designated Pathway.
  6.  **Tennis (Not Swinging):** YES. Role (player actively in the point), Capable, Designated pathway (your swing is the expected/assigned action for that ball).
  7.  **Charity:** NO. Lacks Role/Commitment to that child, not part of a Designated Pathway assigning you responsibility.
  8.  **Two Guards:** YES. Role (guards at keys), Capable, Designated Pathway (dual-key system - each is a *necessary element* of the single designated pathway). *Collectively* they form the mechanism.
  9.  **Twenty Bystanders:** **NO (for any single individual).** While capable, *no individual* has a Role/Commitment *specifically assigned* to pulling that alarm, and they are not designated *necessary elements* of a specific pathway (any one could do it). The *collective failure* might be a cause, but no *individual* omission causes it under this rule. (This matches your verdict).

  **What You Give Up by Reassigning Case 2:** You give up the intuition that *mere presence and capability*, without a role or commitment, makes an omission causal. This brings causation for omissions in line with the requirement for a *specific link* defined by role/commitment/designation, consistent with your other cases (Tourist, Guest, Charity). It emphasizes that causation for omissions is tightly tied to *assigned responsibilities* or *undertaken commitments*, not just moral duty or physical possibility. Moral responsibility can still exist for Case 2 without causal responsibility.

  **Applying the Rule to Your Unsettled Cases:**

  10.  **Automated Assistant:** **Your omission caused the zero.** Your Role/Commitment: Setting up the system was your designated task. Your omission (not entering instruction) was the failure of *your* part of the designated pathway. The assistant's "omission" is just a consequence of your failure; it wasn't assigned an independent role *you* were responsible for fulfilling.
  11.  **School Detector:** **The current administration's omission caused the death.** The official who left lacked the Role/Position *at the relevant time* (when the leak happened). The *ongoing* Role/Commitment (maintaining school safety, installing required detectors) rests with the *current* officials in charge of the district/facility. Their continuous omission to install constitutes the failure of the designated pathway (safety inspections/upgrades).
  12.  **1970 Flood Barrier:** **The 1970 council's omission did NOT cause the 2025 deaths.** While they had the Role/Commitment *in 1970*, causation requires the omission to fail *at the time O was imminent or preventable*. Decades later, numerous intervening factors (maintenance of other defenses, changes in river flow, development decisions, subsequent councils' choices) break the direct causal chain. Their vote was a *necessary condition* but not the *proximate cause* 55 years later. The cause lies in failures much closer in time to the flood (e.g., inadequate *current* flood defenses/warnings).

  **A Counterexample Case Testing the Rule:**

  *   **The Sleeping Nightwatchman:** A factory employs a nightwatchman whose sole duty is to patrol hourly. One night, he falls asleep *before* his shift starts and sleeps soundly through it. During his shift, a small, easily containable fire starts. It goes unnoticed, spreads, and burns down the factory because he wasn't awake to patrol and raise the alarm.

  *   **Rule's Verdict:** The nightwatchman's omission (not patrolling) **DID NOT cause** the fire damage *under the strict rule*.
      *   **Why?** Clause 1 (Role/Position): He *had* the role *in general*, but Clause 2 (Capability/Opportunity): He was *incapable* of acting *during the relevant time* (his shift) because he was asleep before it began. His state (asleep) prevented him from ever having the *opportunity* to act *within the timeframe* the role required. His sleeping *itself* might be a prior action/omission causing his incapacity, but the specific omission *during the shift* (failing to patrol) didn't occur because he lacked the *ability* to even attempt it at that time due to his prior state.

  *   **Why you might find it surprising:** Intuitively, we *still* blame him heavily and feel his failure *was* the cause! The rule, however, focuses strictly on the omission *at the crucial moment* and finds he lacked the necessary capability/opportunity *then*. This highlights a potential limitation: the rule might be overly strict regarding *how* the capability is lost, especially if the agent is responsible for losing it (like falling asleep). You might need to adjust Clause 2 ("The agent *was* capable...") to include "or *should have been* capable based on their role" or consider prior culpable actions that *lead* to incapacity as part of the causal chain. But this adds complexity.

  **Conclusion:** Your "Role-Embedded Omission" rule, with its three clauses, captures the vast majority of your intuitive verdicts and provides clear reasoning for the unsettled cases. The main cost is reassigning Case 2 (Off-Duty Lifeguard) to *not* causing the death (though she may be morally responsible). Case 8 (Guards) is handled by the "designated set" aspect of Clause 3. The Sleeping Nightwatchman case exposes a potential edge case where prior culpable incapacity challenges the strict "capability at the time" requirement. This rule provides a strong foundation for your essay, clearly linking causal responsibility for omissions to specific roles, commitments, and designated preventative pathways.
