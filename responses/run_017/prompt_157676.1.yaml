answer: |-
  ## Sestina for the Humean Divide  
  *(After the Reading Group on Laws of Nature)*  

  The dry leaf waits; no hidden *power* stirs.  
  The pattern traced is all we call the *law* –  
  Salt dissolves in water, this weak *govern*.  
  No inner *chance* compels the falling *rain*,  
  No silent *match* demands its fateful spark.  
  Is this mere sequence all that we can claim?  

  But universals hold a deeper *claim*:  
  Second-order relations, binding *power*.  
  Salt *must* dissolve, like phosphorous must *spark*.  
  Not summary, but force – this is true *law*,  
  Commanding elements: dissolve or *rain*.  
  Real natures hold the mandate to *govern*.  

  Can mosaic facts alone *govern*?  
  Or must true order make a stronger *claim*?  
  Not just that water falls as simple *rain*,  
  But *why* – not pattern, but intrinsic *power*.  
  Is regularity enough for *law*?  
  Or must necessity provide the *spark*?  

  Consider then the unstruck *match*: its *spark*  
  Unborn, potential. Does mere habit *govern*  
  What *would* have been? Can descriptive *law*  
  Support that fragile, unrealized *claim*?  
  Or does the dormant sulphurous *power*  
  Demand its flame, beyond mere fact or *rain*?  

  Patterns persist like seasons bringing *rain*,  
  Or salt dissolving. Yet the missing *spark*  
  Defies the system’s lean descriptive *power*.  
  If laws just summarize, what force *governs*  
  The might-have-been? A hollow, frail *claim*  
  Without some glue beyond mosaic *law*.  

  So turn the words: is this strict form the *law*  
  That binds them to their place like falling *rain*?  
  Or accident? An empty patterned *claim*?  
  Each stanza’s end holds neither force nor *spark*.  
  Does sequence merely seem to *govern*,  
  Or does each word contain its destined *power*?  

  *Envoi*  
  A *match*, untouched, knew flame was in its *power*.  
  True *law* would *govern* even worlds without *rain*;  
  *Chance* claims the *spark* – but *would* dry leaf have burned?  

  ---

  **Pub Notes (Short & Sharp):**  

  1.  **Governing Pressure Point:**  
      -   *Anti-Humean:* Stanzas 2 ("Commanding elements"), 3 ("Real natures hold the mandate"), Envoi ("True law would govern"). Focus on inherent force/mandate.  
      -   *Humean:* Stanza 1 ("this weak govern"), Stanza 6 ("Does sequence merely seem to govern?"). Focus on description/appearance.  

  2.  **Counterfactual Pressure Point ("Unstruck Match"):**  
      -   Stanza 4 explicitly poses the counterfactual challenge.  
      -   *Anti-Humean:* Stanza 4 ("dormant sulphurous power / Demand its flame"), Envoi ("knew flame was in its power"). Powers ground the *would*.  
      -   *Humean:* Stanza 4 ("Can descriptive law / Support that fragile, unrealized claim?"), Stanza 5 ("A hollow, frail claim"). Regularity struggles to ground the unrealized.  

  3.  **The Envoi's Twist:**  
      -   Uses the unwritten scenario (dry leaf burning *if* struck) directly, forcing the counterfactual question Humeanism finds difficult. The Humean "chance" claims the spark happened *here*, but asks *if* the leaf *would* burn elsewhere/elsewhen – the very thing needing grounding. The anti-Humean "power/knew" provides that grounding inherently.  

  The concrete nouns (match, rain, spark) ground the argument; the contested terms (law, power, govern, chance) carry the conceptual weight. Each stanza leans towards one view without being sloganistic.
