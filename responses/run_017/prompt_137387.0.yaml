prompt: |-
  I work as a story editor on factual drama — the sort of thing that carries a caption about being inspired by real events — and my partner is an archivist, so the two of us have been arguing, on and off for about two years, about what exactly we owe the real dead when we turn them into characters. I have got into the habit of writing down my verdicts on individual cases rather than defending general principles, and I would now like to know whether there is a principle behind them, because I suspect that at least two of them cannot both survive.

  The verdicts, as I have them. A composite character who stands in for a whole team of scientists in a miniseries about a nuclear accident: fine, provided the programme says so somewhere. Reconstructed dialogue for a meeting that certainly happened but whose words were never minuted: fine. Moving a real person into a room they were not in, so that two documented events can share a scene: fine, that feels like punctuation. An invented love affair between two real people who certainly knew each other: fine, with a bad conscience. The same invented affair presented in a realist docudrama that will be most viewers' only source on the pair: not fine. A fabricated specific act of cruelty — a real person shown doing something vile that they did not do, though they did do other vile things of that kind, so the scene is representative: not fine, and worse than the invented affair, and I cannot say why. Depicting a real person as having committed a crime they were tried for and acquitted of: not fine, and worse again. Depicting a real person as having had a secret sexual relationship contrary to the sexual identity they avowed in public and around which they organised their life: not fine — but that is, on the face of it, the very same act as the invented affair I called fine, and I cannot get the two verdicts to line up. Inventing a cruel act about a Roman emperor who spent his life courting fame: I barely mind. Inventing the same act about a private person who died two centuries ago, never sought notice, and left no descendants and no community that remembers her: I mind a great deal — and since neither of them can be harmed, and no living person is distressed in either case, I do not know what my reaction is even tracking. And last: a biopic of a memoirist who spent his life publishing a self-aggrandising and largely false account of himself, which invents scenes in order to puncture the myth — fine, and I am not sure whether that is because the subject forfeited something by lying or because the invention there is restorative rather than accusatory.

  The three candidate principles I have been trying out are these. First, a structural one: what matters is not how many facts are changed but where in the narrative's causal architecture they sit — inventions that decorate are permissible, while inventions that supply the motives for the person's actual deeds, or that become the reason the audience thinks she did what she did, are falsifications of the person. Second, counterfactual consent: would this person, judging by the values she actually held and avowed, have accepted this depiction of herself — where the relevant question is not whether she would have enjoyed it but whether the depiction is one she could have recognised as hers. Third, an epistemic one about the audience: the wrong is a function of how likely the work is to become somebody's settled belief about the person, so it tracks genre, publicity, and whether a rival account is in circulation. Please test these against my verdicts, repair them or replace them, and tell me honestly which verdicts I have to give up: I would much rather have a principle that overturns one or two of them than a principle with a list of exceptions as long as the list of cases. Then I want it applied to the case I go back and forth on. A documentary about a writer who died in the 1990s, made with the co-operation of her estate, uses a voice model trained on her archived interviews to read aloud, in her own voice, passages from her private diaries — sentences she wrote, in her own hand, but never spoke and never published — and presents this as her reading them, with a caption explaining the synthesis. I have felt both that this is the most respectful possible use of an archive and that it is a violation unlike any of the others, and I cannot tell which of those thoughts is the sentimental one. And please say what your account predicts about a case I have not listed: say, a drama about a musician who died three years ago, made against the wishes of her adult children, which depicts a documented episode of which they are ashamed.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a story editor for factual dramas, constantly debating the ethics of portraying real people in their work. Their partner is an archivist, so their arguments probably involve both creative and historical perspectives. The user has been jotting down case-by-case verdicts but now wants a consistent principle. They suspect some verdicts conflict, so they need a framework that either explains or overrules those inconsistencies.

  First, I need to analyze their verdicts. For example, they're okay with composite scientists if disclosed, but not with fabricating cruel acts even if "representative." The invented affair is fine with guilt, but not if it's the public's only source. The Roman emperor vs. private person contrast is striking—why care more about the latter when neither can be harmed? And the diary voice synthesis case seems to split their opinion deeply.

  The user proposed three principles: structural (where the invention sits in causal architecture), counterfactual consent (would the person accept the depiction), and epistemic (likelihood of becoming settled belief). I should test each against their examples. 

  For the structural principle: Does inventing motives cross a line? Yes, in the cruelty fabrication where the act defines the person's character. The moved-room example is decorative, so acceptable. But the secret affair—why is it sometimes okay? Maybe because if the person publicly curated an image (like the memoirist), inventing to expose lies feels restorative. Whereas fabricating a secret sexuality against their avowed identity attacks their self-presentation. That fits.

  Counterfactual consent: The acquitted crime example fails because the person was legally cleared—they wouldn't consent to being portrayed as guilty. The private diarist wouldn't consent to having intimate writings broadcast, even in synthesized voice. But the Roman emperor sought fame, so he'd likely accept dramatic embellishments.

  Epistemic principle: The realist docudrama worry makes sense—it might become the only narrative people know. But for the private person with no descendants, why the discomfort? Maybe because obscurity makes misrepresentation feel like erasure, even without immediate harm. The audience might not know it's false, but the lack of corrective voices intensifies the ethical weight.

  Now, reconciling the affair verdicts: Invented affair in a known-fictionalized context? Maybe acceptable as decoration. But presenting it as fact in a docudrama? Unacceptable because it overwrites reality. The key is whether the invention becomes the definitive reason for their actions or contradicts their core identity.

  For the diary voice synthesis: It uses her real words but forces intimacy she chose not to share. Even with estate cooperation, it might violate what she'd consent to (counterfactual consent). And since she's the only source on her inner life, this synthetic voice could become the "authentic" version in public memory (epistemic risk). So it feels respectful as archival innovation but violating as posthumous exposure.

  The musician case against children's wishes: Structural—if the episode is documented, it's not invented. But counterfactual consent? If she valued privacy, no. Epistemic—since it's contested, the drama might cement a shaming narrative. The children's distress matters, but the deeper wrong is overriding the subject's likely wishes and monopolizing her story.

  Synthesizing a principle: Focus on the subject's narrative autonomy—their right to control how their identity is defined. Inventions that distort their self-determined public/private boundaries or impose motives they disavowed violate that autonomy. The harm isn't just misinformation but symbolic violence: silencing them in their own story.

  This framework overturns two verdicts: The "decorative" secret affair is problematic if it undermines how the person framed their identity. And the Roman emperor deserves some constraints—fame isn't blanket consent for defamatory inventions. The diary synthesis fails the counterfactual consent test starkly.

  The user's struggle reveals a tension between archival reverence (preserving truth) and storytelling pragmatism. Their discomfort with the private person's portrayal, despite no living harm, suggests an almost moral duty to the dead's legacy—that misrepresentation is a betrayal of trust, not just factual error. The principle should honor that intuition.
answer: |-
  Your verdicts reveal a consistent ethical intuition grappling with **narrative autonomy**—the right of real individuals to control how their identity, choices, and legacy are defined. This principle reconciles nearly all your cases and exposes two verdicts needing revision. Let's break it down:

  ### The Core Principle: Violating Narrative Autonomy  
  A depiction wrongs the dead when it **overrides their self-determined narrative boundaries**—particularly their public/private distinctions, documented self-representation, or core identity claims. Harm arises not from inaccuracy alone, but from **imposing a narrative they deliberately rejected or concealed**.  

  ### Testing Your Principles Against Your Verdicts  
  1. **Structural Principle (Causal Architecture)**  
     - ✔️ *Explains*: Moving a person into a room (decoration) vs. inventing cruelty (assigns motive).  
     - ✘ *Fails*: Why the secret affair is sometimes "fine" and sometimes not.  
     - **Verdicts overturned**: None, but incomplete.  

  2. **Counterfactual Consent (Recognizability)**  
     - ✔️ *Explains*:  
       - Acquitted crime: They rejected this narrative legally.  
       - Secret sexuality vs. invented affair: If the person publicly organized their identity around celibacy (e.g., a nun), inventing a secret affair violates self-definition. If they simply never mentioned romance, it’s decorative.  
       - Memoirist: He’d consent to his myth being punctured because he invited public scrutiny.  
     - ✘ *Fails*: The private person who "never sought notice"—why mind? She asserted a boundary (obscurity), and violating it negates her autonomy.  
     - **Verdicts overturned**: "Invented affair fine" → **revised**. It’s only permissible if it doesn’t contradict a documented identity claim.  

  3. **Epistemic Principle (Settled Belief)**  
     - ✔️ *Explains*: Realist docudrama (high belief risk) vs. Roman emperor (mythologized, low risk).  
     - ✘ *Fails*: Fabricated cruelty feels worse than an affair because cruelty defines moral character more decisively—thus higher *narrative stakes*.  
     - **Verdicts overturned**: None.  

  ---

  ### Revised Principle: **Narrative Autonomy + Epistemic Risk**  
  **An invention is unethical if it:**  
  - **(A) Violates the subject’s self-curated narrative boundaries** (e.g., acquitted crimes, concealed private acts, asserted identity), *or*  
  - **(B) Is likely to become the definitive account of their life** (genre, publicity, rival narratives).  
  **(A) is the core wrong; (B) amplifies harm.**  

  ### Your Verdicts Revisited  
  | Case | Your Verdict | Revised Verdict | Why |  
  |------|--------------|-----------------|-----|  
  | Composite scientists | Fine | Fine | Decorative; no boundary violation. |  
  | Reconstructed dialogue | Fine | Fine | Plausible; no core identity claim. |  
  | Moved into a room | Fine | Fine | "Punctuation" respects causality. |  
  | Invented affair (no identity clash) | Fine (guilty) | **Fine** | Acceptable if no conflict with self-definition. |  
  | Invented affair (avowed celibate) | — | **Not fine** | Violates narrative autonomy. |  
  | Affair in realist docudrama | Not fine | Not fine | High epistemic risk + possible (A) violation. |  
  | Fabricated cruelty | Not fine | Not fine | Assigns motive; defines character against autonomy. |  
  | Depicting acquitted crime | Not fine | Not fine | Direct override of their legal self-defense. |  
  | Secret sexuality vs. avowed identity | Not fine | Not fine | Violates core self-representation. |  
  | Roman emperor’s cruelty | Fine | Fine | Fame-seeking forfeits some narrative control. |  
  | Private person’s cruelty | Not fine | Not fine | Obscurity asserts a boundary; violation is erasure. |  
  | Puncturing lying memoirist | Fine | Fine | His self-mythologizing invited correction. |  

  **Verdicts to abandon:**  
  1. **Invented love affair "fine" unconditionally** → Only acceptable if it doesn’t conflict with the subjects’ documented identity or private boundaries.  
  2. **Roman emperor "barely mattering"** → Even fame-seekers retain *some* autonomy (e.g., fabricating uncharacteristic cowardice would be unethical).  

  ---

  ### Your Cases Resolved  
  **1. The Synthetic Diary Voice**  
  - **Violation of narrative autonomy.** She wrote privately, never spoke these words. By synthesizing her voice for unpublished thoughts, you force intimate self-disclosure she chose to withhold. Estate cooperation doesn’t override *her* boundary—it exploits archival access.  
  - **Epistemic risk:** The caption is insufficient. Audiences will remember "her voice," blurring her private/public selves.  
  - **Sentiment vs. ethics:** Your "respectful" instinct is sentimental (technical homage); your "violation" instinct tracks autonomy.  

  **2. The Musician’s Biopic Against Children’s Wishes**  
  - **Structural:** Documented episode → no invention.  
  - **Autonomy:** If the musician publicly addressed this episode, depicting it is ethical. If she concealed it, the film violates her privacy boundary.  
  - **Epistemic risk:** High if no rival accounts.  
  - **Children’s wishes:** Matter legally, but ethically secondary to *her* narrative autonomy. If she wanted it hidden, the film is wrong.  

  **3. Why the Fabricated Cruelty Feels Worse**  
  It **defines the person’s moral essence** in a way an affair might not. If they committed "vile things," show those. Inventing specifics implies you know their "true" character better than the record—the ultimate override of autonomy.  

  ### Conclusion  
  **You owe the dead the integrity of their self-authorship.** Change details lightly when they’re decorative, never when they redefine identity against the subject’s will. Your discomfort with the diary synthesis and private-person cruelty reveals your deepest ethic: obscurity is a boundary, not an invitation. Abandon the blanket "fine" for affairs and emperors—context matters. What survives is respect for the human behind the name.
