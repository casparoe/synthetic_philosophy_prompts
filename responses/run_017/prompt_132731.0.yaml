  ### Diagnostic Quiz: Which Idealization Procedure Are You Committed To?

  Below is a 10-question quiz designed to diagnose your implicit commitments regarding theories of personal good. Each question presents a concrete scenario with 2–3 answer options. **Answer based on your intuitive judgment**—no prior philosophical knowledge is needed. The quiz is structured to hide the underlying theories, focusing solely on your responses to cases. After completing the quiz, use the scoring key to map your answer pattern to a specific "leaf" in the taxonomy of idealization procedures.

  ---

  ### Quiz Questions
  1. **The Pineapple Case**  
     Alex has never tried pineapple and says, "I don't want it; it sounds gross." After being convinced to try it, Alex loves it. Before trying it, was pineapple part of Alex's good?  
     - A. **No**, because Alex didn’t want it at the time.  
     - B. **Yes**, because Alex would have wanted it if they knew how much they’d enjoy it.  
     - C. **Only after trying it**; before that, it wasn’t part of Alex’s good.  

  2. **Fear of Flying**  
     Taylor has a severe fear of flying but knows all the safety statistics (flying is safer than driving). Taylor’s fear persists. Is overcoming this fear part of Taylor’s good?  
     - A. **No**, because Taylor doesn’t desire to overcome it.  
     - B. **Yes**, because the fear is irrational and limits Taylor’s life.  
     - C. **Only if Taylor experiences flying calmly and then wants to overcome it**.  

  3. **Sour Grapes**  
     Jordan wanted a high-powered career but faced repeated rejections. Jordan now says, "I never wanted that; I’m happy with a simple life." Is this simple life truly Jordan’s good?  
     - A. **Yes**, because it’s what Jordan currently wants.  
     - B. **No**, because Jordan only wants it due to failure. If successful, Jordan would prefer the career.  
     - C. **Only if Jordan experiences success and still prefers the simple life**.  

  4. **3am Exhaustion**  
     At 3am, exhausted, Casey thinks, "I should quit my job." The next morning, rested, Casey is glad they didn’t quit. Was quitting part of Casey’s good at 3am?  
     - A. **Yes**, because Casey desired it in the moment.  
     - B. **No**, because exhaustion distorted Casey’s judgment. Only rested desires count.  
     - C. **No**, because an idealized Casey (well-rested, rational) would reject it.  

  5. **Pianist vs. Mathematician**  
     Morgan could become a great pianist or a great mathematician (both fulfilling lives), but not both. Morgan’s current self is torn. Which life is Morgan’s good?  
     - A. **Whichever Morgan currently prefers more**.  
     - B. **Whichever Morgan would choose with full information and reflection**.  
     - C. **Both could be Morgan’s good**; there’s no single best life.  

  6. **Replaced Commitment**  
     In an idealization process, Avery’s deep commitment to family is replaced by a commitment to social justice. Avery treasures the family commitment and rejects the change. Should we accept the idealization’s verdict?  
     - A. **No**, because Avery’s present self rejects it, and that matters most.  
     - B. **Yes**, because the idealization corrects Avery’s values.  
     - C. **Yes, but only if the new commitment is morally better**.  

  7. **Violent Rejection**  
     Blake’s extrapolated self endorses a life of solitude, but present Blake (social and active) hates this. Is the solitary life part of Blake’s good?  
     - A. **No**, because present Blake violently rejects it.  
     - B. **Yes**, because the extrapolated self knows Blake’s true good.  
     - C. **It depends on whether the extrapolation process is morally sound**.  

  8. **Awful Values**  
     Casey has coherent, fully informed racist values that survive all idealization. Is satisfying these desires part of Casey’s good?  
     - A. **Yes**, because they are Casey’s informed, coherent desires.  
     - B. **No**, because morality overrides personal desires.  
     - C. **Only if Casey experiences being a victim and still endorses them**.  

  9. **Group Conflict**  
     A small group allocates a scarce resource. Each member’s individual idealization says they should get it. What defines the group’s good?  
     - A. **Satisfy individual idealizations as much as possible** (e.g., majority rule).  
     - B. **Run a collective idealization** (e.g., converge to a shared solution).  
     - C. **No single good**; members’ goods conflict irreducibly.  

  10. **Unstable Idealization**  
      Jamie’s idealization initially endorses being a doctor, then an artist, then a teacher—never settling. What is Jamie’s good?  
      - A. **There’s no objective good**; it changes with idealization depth.  
      - B. **The latest output** (e.g., teacher) since we must idealize maximally.  
      - C. **Use a stable intermediate result** (e.g., artist) or present desires.  

  ---

  ### Taxonomy Key: Logical Space of Idealization Procedures  
  The taxonomy is built from five core splits. **Leaves** (theories of good) are defined by combinations of these splits. Empty combinations are noted.  

  #### Split 1: **Corrective Depth**  
  - **Low**: Only accommodates current desires (no correction).  
  - **Medium**: Corrects for contingent flaws (e.g., ignorance, inexperience, temporary states).  
  - **High**: Corrects for deep flaws (e.g., irrationality, adaptive preferences, immorality).  

  #### Split 2: **Convergence**  
  - **Single**: Outputs one authoritative answer.  
  - **Multiple**: Outputs multiple valid answers (e.g., plural goods).  

  #### Split 3: **Identity**  
  - **Strong**: Idealized self must be recognizably "you" (e.g., shares core values, memories).  
  - **Weak**: Idealized self can be radically different (e.g., values transformed).  

  #### Split 4: **Veto**  
  - **Present Veto**: Present self’s rejection overrides the idealization.  
  - **No Veto**: Idealization’s verdict is final; present self’s views are irrelevant.  

  #### Split 5: **Stability**  
  - **Stable**: Further idealization doesn’t change the output.  
  - **Unstable**: Further idealization can alter the output indefinitely.  

  #### Leaves (Theories) in the Taxonomy  
  | Leaf                              | Corrective Depth | Convergence | Identity  | Veto          | Stability | Occupied By                                                                                                 | Empty? | Reason for Emptiness                     |  
  |-----------------------------------|------------------|-------------|-----------|---------------|-----------|-------------------------------------------------------------------------------------------------------------|--------|------------------------------------------|  
  | **Simple Present-Desire**         | Low              | Single      | Strong    | Present Veto  | Stable    | Simple desire views (e.g., unidealized preferences).                                                       | No     |                                          |  
  | **Informed/Experiential Desire**  | Medium           | Single      | Strong    | No Veto       | Stable    | Informed-desire, experience-required views.                                                                | No     |                                          |  
  | **High-Correction Strong-Identity** | High           | Single      | Strong    | No Veto       | Stable    | Brandt’s cognitive therapy, dispositional ideal-reasoning, ideal-advisor (self-focused).                   | No     |                                          |  
  | **High-Correction Weak-Identity** | High           | Single      | Weak      | No Veto       | Stable    | Railton’s objective interest, Yudkowsky-style CEV (individual), moralized-rationality views.               | No     |                                          |  
  | **Pluralist**                     | High             | Multiple    | Strong    | No Veto       | Stable    | "No fact of the matter" views (e.g., irreducible multiplicity of lives).                                   | No     |                                          |  
  | *Low-Depth Multiple*              | Low              | Multiple    | Any       | Any           | Any       | —                                                                                                           | Yes    | Incoherent (low depth implies no idealization to generate multiples). |  
  | *Medium-Depth Multiple*           | Medium           | Multiple    | Any       | Any           | Any       | —                                                                                                           | Yes    | Unoccupied (no theorist combines medium correction with multiple convergence). |  
  | *Weak-Identity Pluralist*         | High             | Multiple    | Weak      | Any           | Any       | —                                                                                                           | Yes    | Unattractive (weak identity + multiple goods undermines "for you"). |  
  | *Stable Present-Veto High-Depth*  | High             | Single      | Any       | Present Veto  | Stable    | —                                                                                                           | Yes    | Incoherent (high correction contradicts present veto). |  
  | **Unstable Idealization**         | Any              | Single      | Weak      | No Veto       | Unstable  | Not on your menu; "always-revisable" views.                                                                | No     |                                          |  

  #### Notes on Empty Leaves  
  - **Incoherent**: Contradictory splits (e.g., high correction + present veto).  
  - **Unattractive**: Theoretically possible but unappealing or unworkable.  
  - **Unoccupied**: Logically consistent but no major theorist holds it.  

  ---

  ### Scoring Key: Mapping Answer Patterns to Leaves  
  **How to score**:  
  1. Tally your answers (A, B, C) for all 10 questions.  
  2. Match your pattern to the closest leaf using the table below.  
  3. **Mixed patterns** (no clear leaf) are common; see guidance below.  
  4. **Indistinguishable pairs**: Some leaves share identical patterns; extra cases could pry them apart.  

  #### Pattern-to-Leaf Mapping  
  | Leaf                              | Diagnostic Answer Pattern                                                                                                                             | Notes                                                                                               |  
  |-----------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|  
  | **Simple Present-Desire**         | Mostly **A** (especially Q1–Q5, Q7–Q8). Q6A, Q10C. Rejects all idealization.                                                                          | Distinctive: Vetoes idealization (Q6A, Q7A).                                                        |  
  | **Informed/Experiential Desire**  | Mostly **B/C** in Q1–Q4, **B** in Q5, **A/B** in Q6–Q7, **A/C** in Q8, **A** in Q9, **C** in Q10. Prioritizes information/experience but not deep correction. | Indistinguishable from High-Correction Strong-Identity in Q2–Q4. Extra case: Sour grapes (Q3C) favors this leaf. |  
  | **High-Correction Strong-Identity** | **B** in Q2–Q4, Q6B, Q7B, Q8A, Q9A, Q10B. Rejects veto (Q6B, Q7B), allows deep correction but preserves identity.                                | Indistinguishable from Weak-Identity in Q2–Q4. Extra case: Replaced commitment (Q6B vs. Q6C) favors this leaf. |  
  | **High-Correction Weak-Identity** | **B** in Q2–Q4, **C** in Q6–Q8, **B** in Q9, **B** in Q10. Moral/instrumental correction (Q6C, Q7C, Q8B), no veto.                                   | Indistinguishable from Strong-Identity in Q2–Q4. Extra case: Awful values (Q8B) confirms this leaf. |  
  | **Pluralist**                     | **C** in Q5, Q9, Q10; **A/B/C** elsewhere. Accepts multiple goods (Q5C, Q9C).                                                                         | Distinctive: Only leaf with Q5C and Q9C.                                                             |  
  | **Unstable Idealization**         | **A** in Q10, **A/B** elsewhere. Denies stability (Q10A).                                                                                              | Distinctive: Only leaf with Q10A.                                                                    |  

  #### Indistinguishable Pairs & Extra Cases  
  1. **Informed/Experiential vs. High-Correction Strong-Identity**:  
     - **Shared pattern**: B in Q2–Q4.  
     - **Pry apart with**: Sour grapes (Q3). Informed/Experiential favors C (requires experience); High-Correction Strong-Identity favors B (corrects without experience).  
     - **Extra case**: *A person who mispredicts their future preferences* (e.g., thinks they’ll hate retirement but love it).  
       - Informed/Experiential: Good only after experiencing it.  
       - High-Correction: Good if reasoning predicts it.  

  2. **High-Correction Strong-Identity vs. Weak-Identity**:  
     - **Shared pattern**: B in Q2–Q4, Q6B, Q7B.  
     - **Pry apart with**: Replaced commitment (Q6) or awful values (Q8). Strong-Identity accepts Q6B/Q8A (identity preserved); Weak-Identity favors Q6C/Q8B (morality/radical change).  
     - **Extra case**: *A deeply religious person whose idealization abandons faith*.  
       - Strong-Identity: Rejects change if it breaks core identity.  
       - Weak-Identity: Accepts change as correction.  

  #### Handling Mixed Patterns  
  If your answers don’t cleanly map to one leaf (e.g., split between Informed/Experiential and Pluralist):  
  - **Step 1**: Identify "anchor" questions:  
    - Q5 (Pianist/Math) → Pluralist if C.  
    - Q6/Q7 (Veto) → Present-Desire if A.  
    - Q10 (Stability) → Unstable if A.  
  - **Step 2**: Note conflicts:  
    - E.g., If you have Pluralist (Q5C) but also High-Correction (Q2–4B), you may endorse a hybrid (e.g., "corrected pluralism").  
  - **Step 3**: Use the taxonomy:  
    - Mixed patterns often reflect splits in dimensions (e.g., high correction + multiple convergence = unoccupied leaf).  
    - **What to tell the person**:  
      > "Your answers suggest tensions between [dimension X] and [Y]. For example, you want correction but also value present intuition. This isn't a flaw—real views often blend theories. Focus on where splits occur: [specific conflicts]. Reflect on cases like [extra case] to clarify."

  #### Why Some Leaves Can’t Be Separated  
  - **Same view, different hats**: High-Correction Strong-Identity vs. Weak-Identity differ only in how much they "fix" identity. They behave identically in non-identity cases (e.g., fear of flying).  
  - **Genuine overlap**: Informed/Experiential and High-Correction Strong-Identity both handle statistical fears (Q2) similarly.  
  - **Resolution**: Add extra cases targeting identity (Q6) or morality (Q8).  

