       Failure 3: The groups get stuck on coding in Activity 2? But we fixed the coding.

       Failure 4: The reversal is not clean because of the boundary cases? But we fixed the coding to include them, so the death totals are as planned.

     Given the time, we skip reporting quality. We can mention it in the debrief as an additional real-world complication: "In reality, we might not have complete data, especially in earlier periods. In our ledger, we assumed we had complete data, but what if we didn't?"

