          Incident 4: 3 (boundary)
          Incident 5: 16 -> total 45+1+35+3+16=100

       And so on.

     Instructor's coding: we have to decide on the boundary cases. We can code half of them as violent and half not? But then we might not get the exact death counts we want. We want the total deaths in violent incidents to be 100,120,etc.

     So we code:

          We'll code the boundary cases arbitrarily to meet the death totals? But that's artificial.

     Alternatively, we design the ledger so that the deaths in boundary cases are a small portion? Then we can code them as violent or not without affecting the totals too much? But we want the coding to matter.

     We can decide: for the purpose of the activity, we will code the boundary cases as violent? Then we have the death counts as designed.

     But then in Activity 1, when the groups code, they might exclude some boundary cases? That's okay because we are just showing disagreement.

     In Activity 2, we use a fixed coding: we code all boundary cases as violent? Then we get the death totals as above.

     So we do that.

     Now, the debrief:

       - (i) Trend reversal: show the two rankings. Group A has P6 as the most violent, Group B has P1 as the most dangerous. Why? Because Group A looked at total deaths, Group B at deaths per person. So the same incidents, aggregated differently, give opposite trends.

       - (ii) Boundary decisions: in Activity 1, we saw that for some incidents, groups disagreed. For example, the death in custody: some thought it was violence, some not. Why? Because it involves state neglect? But the definition includes "deprivation"? Or not? It's contested.

       - (iii) Open question: "Which period was more violent, P1 or P6?" It depends on what we mean by "more violent". If we mean total harm, then P6. If we mean individual risk, then P1. There is no single right answer without specifying the measure.

     We must distinguish:

       - "There is no fact of the matter": we are not saying that. We are saying that the concept of "more violent" is ambiguous without specifying the measure. So there is a fact once we specify the measure.

       - "We cannot find out": not the case here because we have the data.

       - "The concept is interest-relative": the choice of measure depends on our interests (e.g., public health vs. total social harm).

     What the activity cannot do:

       - It cannot show that there is no fact of the matter at all. We have a fictional ledger that we take as complete and accurate. In reality, we might not know the data. But that's a separate issue.

       - It shows that even with complete data, we have to make decisions about what to count and how to aggregate.

