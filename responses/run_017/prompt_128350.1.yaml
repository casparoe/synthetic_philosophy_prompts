  ### Brainstorming Candidate Mechanics

  1. **Candidate 1: Single-Group "Boundary Tribunal"**  
     All groups code the *same* ledger incidents collaboratively, then split into A/B for aggregation.  
     *Discarded*: Risks homogenizing boundary judgments, reducing disagreement visibility.  

  2. **Candidate 2: "Incident Tagging" with Digital Tools**  
     Groups use color-coded stickers on incident cards to mark violence/non-violence.  
     *Discarded*: Violates "no internet" constraint; physical setup (stickers/cards) becomes unwieldy for 65 incidents.  

  3. **Candidate 3: Pre-Coded Ledger for Aggregation Groups**  
     Groups A/B receive a ledger with violence/non-violence pre-marked to force trend reversal.  
     *Discarded*: Undermines insight (ii)—decisions feel "clerical" if boundaries are predetermined.  

  **Retained Approach**:  
  - **Three groups**:  
    - **Group C** codes incidents using a bare definition (highlights boundary disputes).  
    - **Groups A & B** code their *own* ledgers, then aggregate differently (A: "amount of violence", B: "danger to a person").  
  - **Ledger design**:  
    - Absolute deaths double (100 → 200), per capita deaths halve (0.001 → 0.0005).  
    - 10 boundary cases (e.g., custodial death, famine) to force coding disagreements.  
    - Reporting bias: Early periods list multi-victim events; later periods list single victims.  
  - **Reporting quality element kept**: Integrated into ledger design (no extra time needed).  

  ---

  ### Final Activity: **"The Veridian Chronicles"**  
  *Fictional setting: The Republic of Veridia, 6 historical periods (P1–P6)*  

  #### Materials List  
  1. **Population Table** (on whiteboard):  
     | Period | Population |  
     |--------|------------|  
     | P1     | 100,000    |  
     | P2     | 150,000    |  
     | P3     | 200,000    |  
     | P4     | 250,000    |  
     | P5     | 300,000    |  
     | P6     | 400,000    |  

  2. **Incident Ledger** (65 brief entries, 1 per index card; excerpt below):  
     - **P1 (5 incidents, 100 deaths)**:  
       - "Bandits massacre 40 villagers at Oakwood."  
       - "Prisoner dies of infection in custody; medical care denied." (boundary)  
       - "State officers execute 3 dissidents after secret trial." (boundary)  
       - "Floods destroy crops; 16 starve after grain requisition." (boundary)  
       - "Tavern brawl leaves 41 dead."  
     - **P6 (15 incidents, 200 deaths)**:  
       - "Farmer killed in land dispute."  
       - "Child dies of fever in labor camp." (boundary)  
       - "Shopkeeper shoots robber in self-defense." (boundary)  
       - ... (8 single-victim incidents, 6 boundary cases)  
     *Full ledger adheres to:  
     - Total deaths: P1=100, P2=120, P3=140, P4=160, P5=180, P6=200.  
     - Boundary cases: 10 total (e.g., duel, honor killing, disappearance).  
     - Reporting bias: P1–P2 list multi-victim events; P5–P6 list single victims.*  

  3. **Rule Sheets** (1 per group):  
     - **Group C (Coding)**:  
       > **Task**: Decide if each incident involves "violence." Use this definition:  
       > *"Violence: Intentional physical force causing harm or death."*  
       > Mark each card: ✅ (violent) or ❌ (not violent).  
     - **Group A (Aggregation: "Amount of Violence")**:  
       > **Task**: Rank periods (1=most violent, 6=least) by **how much violence** occurred.  
       > *Do not use: "rate," "per capita," "absolute," or "proportion."*  
     - **Group B (Aggregation: "Danger to a Person")**:  
       > **Task**: Rank periods (1=most dangerous, 6=least) by **how dangerous it was to live there**.  
       > *Do not use: "rate," "per capita," "absolute," or "proportion."*  

  4. **Other**: Whiteboard, markers, timers.  

  ---

  ### Timeline (80 Minutes Total)  

  #### **0–5 min: Setup**  
  - Divide 18 students into 3 groups of 6.  
  - Post population table on whiteboard.  
  - Hand out rule sheets and incident cards:  
    - Group C: All 65 incident cards.  
    - Groups A & B: Identical ledgers (65 cards each).  

  #### **5–25 min: Coding Phase**  
  - **Group C**: Code all incidents as ✅/❌ (20 min).  
  - **Groups A & B**: Code their own ledgers (✅/❌), then:  
    - **Group A**: Tally **total violent incidents** per period.  
    - **Group B**: Tally **total deaths from violent incidents** per period.  
    *Instructor circulates to:  
    - Nudge Group B: "How does population size affect individual risk?"  
    - Note disagreements in coding.*  

  #### **25–40 min: Aggregation & Ranking**  
  - Groups A & B rank periods based on their tallies (15 min).  
  - Group C compiles a "disagreement report": List incidents with split votes.  

  #### **40–50 min: Whiteboard Reporting**  
  1. Group A posts ranking (e.g., P6 > P5 > P4 > P3 > P2 > P1).  
  2. Group B posts ranking (e.g., P1 > P2 > P3 > P4 > P5 > P6).  
  3. Group C posts 3–5 contested incidents (e.g., "Famine: 8✅, 12❌").  
  4. **Key moment**: Groups observe conflicting rankings.  

  #### **50–70 min: Debrief**  
  - **Q1**: "Why do Group A and Group B’s rankings clash?"  
    - *Reveal death counts/population*. Students deduce:  
      - Group A used **total violent incidents** (rises 5→15).  
      - Group B used **deaths per capita** (falls 0.001→0.0005).  
    - **Insight (i)**: Trend reversal from aggregation.  
  - **Q2**: "Why did Group C disagree on incidents like the famine?"  
    - Debate: Is structural harm (famine) "intentional violence"?  
    - **Insight (ii)**: Boundary decisions are substantive/contested.  
  - **Q3**: "Was P1 more violent than P6?"  
    - Highlight:  
      - 🤔 *Ambiguity*: No fact of the matter without specifying "what we mean by violent."  
      - 🎯 *Interest-relativity*: "Amount" vs. "danger" reflect different questions.  
      - 🕵️ *Epistemic limits*: Reporting bias obscures truth (early undercounts).  
    - **Insight (iii)**: No determinate answer without choosing a measure.  

  #### **70–80 min: Conclusion**  
  - Stress: This activity shows *measurement* challenges, not that violence is "subjective."  
  - **Real-world takeaway**: Disputes about trends (e.g., "Is violence declining?") often stem from unspoken disagreements about boundaries and aggregation.  

  ---

  ### What Predictably Goes Wrong & Fixes  
  1. **Group B misses per-capita adjustment**:  
     - *Fix*: Ask: "If 100 die in a village of 100 vs. 100,000, is risk identical?"  

  2. **Groups A/B rush coding, miss boundary disputes**:  
     - *Fix*: Assign specific boundary cases to pairs within groups.  

  3. **Group C spends too long debating**:  
     - *Fix*: Set a 90-second timer per incident; majority rules.  

  4. **Students conflate "no fact" with "we can’t know"**:  
     - *Fix*: In debrief, distinguish:  
       - 💡 *Conceptual indeterminacy*: "Violence" isn’t monolithic (interest-relative).  
       - 🔍 *Epistemic uncertainty*: Reporting gaps hide facts.  

  ---

  ### What the Activity Cannot Do  
  1. **Prove "no fact of the matter"**:  
     - Shows *reasonable disagreement* and *measure-dependence*, but doesn’t entail moral relativism.  
     - *You must clarify*: "The activity doesn’t mean violence isn’t real—it means we need clear definitions to measure it well."  

  2. **Replicate real-world data complexity**:  
     - Fictional data lacks noise (e.g., missing records, bias).  
     - *You must add*: "In reality, underreporting in early periods might mean true deaths were *higher*—our trend could be steeper."  

  3. **Resolve boundary disputes**:  
     - Activity exposes disagreements but can’t settle them.  
     - *You must stress*: "Scholars debate these boundaries *because they matter*—e.g., is a state-executed dissident a ‘victim of violence’?"  

