answer: |-
  Based on your detailed description and the distinctions you've drawn, the move you're encountering **is not adequately captured by the Self-Indication Assumption (SIA) alone**. While related, it's a distinct maneuver with specific problematic features. I'll define it, contrast it with SIA, analyze boundaries, and diagnose the core issue.

  ---

  ### **The Core Concept: "Ad Hoc Observer Multiplication" (AHOM)**
  **Definition:**  
  The retrofitting of a hypothesis with *subjectively indistinguishable copies* of the current observer-moment, *without independent justification*, solely to exploit self-locating uncertainty and dominate probability calculations. The copies are added as an auxiliary clause to an existing hypothesis, multiplying the measure of "observer-moments like this one" to force a Bayesian update in favor of the hypothesis.

  **Key Features:**  
  1. **Retrofitting:** The copies aren't predicted by the core theory; they're appended as a disconnected auxiliary claim.  
  2. **No Independent Motivation:** The clause lacks empirical, causal, or theoretical support beyond winning the argument (e.g., "civilizations *might* run simulations" → "therefore, *trillions* of copies exist").  
  3. **Subjectively Indistinguishable:** Copies are epistemically identical to "you-now," making them fungible in self-locating updates.  
  4. **Instrumental Purpose:** Sole function is to inflate the observer-moment count for a specific reference class.  

  **Confidence:** 95% (Robust match to your cases; only weaker if "independent motivation" is interpreted loosely).  

  ---

  ### **Boundary Cases & Key Distinctions**
  1. **Legitimate Crowded Cosmology vs. AHOM**  
     - **Legitimate:** A theory *intrinsically predicts* high observer counts (e.g., a multiverse model derived from quantum gravity). The observers are a *consequence* of the theory.  
     - **AHOM:** Adds observers as a *free parameter* (e.g., "and also, this moment is duplicated 10^100 times").  
     - **Verification:** If removing the "copies" clause collapses the hypothesis into a simpler form, it's AHOM.  
     - **Confidence:** 90% (Gray area if a theory *weakly implies* copies, but AHOM demands explicit, unjustified injection).  

  2. **Finite vs. Infinite Copies**  
     - **Finite:** AHOM can still dominate probabilities (e.g., "a trillion copies" → 10¹²:1 odds).  
     - **Infinite:** Ratios become undefined (measure problem), nullifying probabilistic arguments entirely (your case #3).  
     - **Edge:** Infinite cases expose AHOM's absurdity by breaking probability theory.  
     - **Confidence:** 85% (Infinite copies introduce distinct issues, but AHOM *causes* the problem).  

  3. **Location of Copies (Simulations, Branches, etc.)**  
     - **Irrelevant under AHOM:** Copies need only be *subjectively indistinguishable*. Whether they're in simulations (case #1), alternate histories (case #2), or other branches (case #3) doesn't matter—AHOM exploits the epistemic indistinguishability.  
     - **Confidence:** 80% (Causal disconnection *might* matter for reference classes, but AHOM bypasses this by design).  

  ---

  ### **Why AHOM is Distinct from SIA**
  - **SIA:** Favors theories with *higher intrinsic observer counts* when choosing between cosmologies (e.g., "1 trillion observers" vs. "1 million"). It weights hypotheses by their predicted observer number.  
  - **AHOM:** *Modifies a single hypothesis* by adding copies as a conjunct (e.g., "Theory X *and* 10^100 copies of me-now"). It's a *hypothesis-level sleight of hand*.  
  - **Analogy:** SIA chooses between a crowded train and an empty train. AHOM claims your train car has invisible clones.  
  - **Confidence:** 90% (SIA doesn't require *retrofitting*; it's a prior over theories. AHOM is auxiliary).  

  ---

  ### **What's Wrong with AHOM? It's Not *Just* Low Priors**
  1. **Violates Parsimony (Occam's Razor):**  
     AHOM adds entities (copies) with no explanatory power. The prior *should* be low, but the deeper issue is *why the clause exists*.  
     - **Test:** If the copies explain no independent evidence, they're parasitic.  

  2. **Conjunction Fallacy in Disguise:**  
     AHOM exploits the fact that adding a disjunct ("or there are copies") inflates likelihoods. But probabilities don't add linearly for disjunctions—yet AHOM treats them as if they do.  

  3. **Unfalsifiability & Armchair Evidence:**  
     No experience can distinguish "Theory X" from "Theory X + copies." AHOM converts *any* hypothesis into a high-probability one by adding copies, making it epistemically vacuous.  

  4. **Pascal's Mugging Parallel:**  
     Like promising vast rewards for tiny actions, AHOM promises vast observer counts for trivial updates. Both exploit unbounded utility/probability scales.  

  **Confidence in Diagnosis:** 85% (The conjunction flaw is key; alternatives like "low priors" miss the dynamic).  

  ---

  ### **When Might I Be Wrong?**
  - **If SIA is Broader:** If SIA is defined as *any* update favoring observer-rich worlds (including AHOM), your philosopher friend is right. But standard texts (Bostrom, Olum) treat SIA as a prior over *theories*, not ad hoc modifiers. **Evidence Needed:** A citation showing SIA applies to auxiliary clauses.  
  - **If Copies Are Empirically Constrained:** If future physics *requires* copies (e.g., quantum immortality), AHOM might reduce to SIA. But currently, it's unconstrained.  
  - **Where I'm Least Confident:** On whether *location* matters (75%). If copies are in your causal future, it might be testable (e.g., "copies imply we see X tech soon"), collapsing AHOM into ordinary prediction.  

  ---

  ### **Practical Carving: How to Spot AHOM**
  1. Look for an unsupported "multiplication clause" appended to a hypothesis.  
  2. Ask: "Does this theory *predict* copies, or are they *tacked on*?"  
  3. Challenge: "What evidence would *disconfirm* the copies?" If none, it's AHOM.  

  **Term Suggestion:** **Ad Hoc Observer Multiplication (AHOM)** nails the retrofitting and instrumental nature. Alternatives: "Observer Inflation," "Copy Proliferation Maneuver."  

  This gives you the toolkit to dissect the move: it's not about cosmology being crowded *in general*, but about *artificially inflating your reference class* to rig the probabilities.
