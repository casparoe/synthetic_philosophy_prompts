prompt: |-
  A colleague in policy work sent me the following argument against Chesterton's fence, and I cannot locate the break, though I am fairly sure there is one.

  (1) Chesterton's fence: do not remove an inherited institution until you can say what it was put up for.
  (2) The usual Burkean backing for that rule: a long-surviving institution has been tested in ways no individual reasoner can reconstruct, so it carries tacit knowledge, and the burden of proof falls on whoever would change it.
  (3) But the test in (2) is only survival over time, and the selection pressure on institutions is nearly nil. Institutions are not competed away for being bad; they persist through inertia, sunk costs, coordination lock-in, and the interests of whoever they benefit. A useless fence and a load-bearing one survive at similar rates.
  (4) So survival is no evidence of fitness: the status quo carries no epistemic presumption, and the Burkean asymmetry in (2) is unsupported.
  (5) If there is no epistemic asymmetry, there is no reason to prefer Chesterton's caution to any other decision rule; proposals to abolish should be assessed bottom-up, by expected consequences, exactly as a rationalist planner would assess them.
  (6) Yet (5) is something a Burkean can reasonably reject, and not because survival is evidence. Call it the deletion asymmetry: abolishing an institution you do not understand destroys information you cannot recover, whereas retaining it is reversible, since you can abolish it later once you have learned what it does. Caution can therefore be warranted on decision-theoretic grounds even if the status quo has no epistemic credit at all.
  (7) If (6) is right, the argument breaks somewhere between (3) and (5).

  Which step do you reject, and what does rejecting it cost? I want a diagnosis, not the verdict that premise (3) is too strong. Two things I especially want priced. First: if the deletion asymmetry in (6) is all the conservative has left, does it really deliver Burkean conservatism, or only an instrumental caution about irreversible acts, with none of Burke's distrust of abstract planning? It is worth remembering that for Burke conservatism was a doctrine about how to change, not a refusal to change. Second: is the move from (2)'s tested through (3)'s survived to (4)'s fit doing any work it should not? If I have to choose which claim to keep, I would rather keep (3) than keep (6) as a defense of Burke, but tell me what that costs me.

  Answer in prose, then append a JSON object with exactly these fields:

  - "diagnosis_step": the step or inference you reject, named by number (for example, "3 to 4")
  - "flaw_type": one of "equivocation", "scope_shift", "invalid_inference", "false_premise", "other"
  - "why_it_looked_fine": one sentence
  - "price_paid": one or two sentences on what the conservative, or the reformer, gives up by rejecting it
  - "survival_is_evidence": one of "no", "weak but non-zero", "substantial"
  - "deletion_asymmetry_enough": one of "yes", "only for a weaker thesis", "no"
  - "surviving_thesis": one sentence stating the strongest claim about institutional caution that survives your diagnosis
  - "runner_up": the step you would reject instead if forced to choose differently
reasoning: |-
  Hmm, the user presents a sophisticated policy argument against Chesterton's fence, seeking a flaw in the reasoning. This appears to be a high-level philosophical debate between conservative and rationalist approaches to institutional change. The colleague's argument systematically dismantles the Burkean justification for conservatism, and the user wants the precise fracture point identified.

  Looking at the structure: Premise (3) claims institutional survival lacks selection pressure, making it evidentially worthless. Step (4) then concludes survival implies no fitness, eliminating epistemic privilege for the status quo. But this inference seems vulnerable - it conflates "survival doesn't guarantee fitness" with "survival provides zero evidence of fitness." That's a scope shift: while survival may be weak evidence due to inertia factors, it's not necessarily zero evidence. Human institutions do face some adaptive pressures over time, even if imperfect.

  The deletion asymmetry in (6) offers a fallback position - that destroying institutions loses irrecoverable information. But as the user suspects, this reduces conservatism to mere reversibility calculus, stripping Burke's richer critique of abstract planning. If we reject the inference from (3) to (4), we salvage a modest epistemic privilege for tradition while acknowledging institutional stasis. The price is conceding that survival evidence is weaker than Burkeans claim, requiring reformers to engage with historical function before demolition.

  Notably, keeping premise (3) would force us to rely solely on deletion asymmetry - making conservatism merely about avoiding irreversible acts. But Burke's vision involved deeper respect for evolved complexity, which requires some epistemic weight to tradition. The runner-up rejection would be premise (3) itself, but that overcorrects by denying institutional stasis altogether - an implausible claim given how bureaucracies persist.

  The JSON fields need careful alignment: diagnosis_step "3 to 4" for the flawed inference, with "scope_shift" as flaw type. Survival evidence is "weak but non-zero," and deletion asymmetry is "only for a weaker thesis" without Burke's distinctiveness. The surviving thesis balances caution with scrutiny: "Institutions deserve scrutiny of their historical functions before abolition due to weak-but-non-zero survival evidence and deletion risks, but without strong epistemic privilege."
answer: |-
  I reject the inference from (3) to (4). Premise (3) correctly observes that *many* useless institutions persist due to inertia, lock-in, or vested interests, meaning survival alone is not *conclusive proof* of fitness or tacit wisdom. However, step (4) makes the unwarranted leap that "survival is no evidence of fitness" and the status quo carries "no epistemic presumption" whatsoever. This is a **scope shift**: from "survival is not a *guarantor* of fitness" (true, per (3)) to "survival provides *zero* evidence of fitness" (false, and not entailed by (3)). Institutions *can* and often *do* survive *because* they serve some function or solve some coordination problem, even amidst persistence mechanisms. While selection pressures may be weak and imperfect, they are not zero. The existence of mechanisms like inertia explains why survival *isn't perfect evidence*, not why it is *no evidence at all*. A long-surviving institution *might* be useless junk, but it also *might* embody hard-won adaptations; the burden of proof for reformers is to investigate and distinguish, not to assume the former is always true.

  **Price Paid:** By rejecting the leap to (4), the conservative gives up the claim that survival provides *strong* or *conclusive* epistemic privilege for the status quo; they must concede that many institutions persist for bad reasons, weakening the *degree* of presumption. The reformer gives up the claim that survival provides *no reason at all* for caution, forcing them to engage with the institution's potential historical function rather than dismissing it out of hand based solely on abstract planning.

  **Addressing Your Specifics:**
  1.  **Deletion Asymmetry & Burke:** (6)'s deletion asymmetry provides a *necessary* caution but is **only for a weaker thesis** than full Burkeanism. It justifies caution about irreversible deletion of potential information, but it doesn't capture Burke's deeper epistemic humility – his belief that the institution *likely embodies* wisdom exceeding individual reason ("the accumulated wisdom of the ages"), even if we don't understand it. (6) is purely decision-theoretic (avoid irreversible loss), while Burke's core is epistemic (trust the evolved entity over abstract reason). (6) alone reduces conservatism to risk-aversion about information loss, devoid of Burke's positive valuation of tradition's inherent wisdom.
  2.  **Survival → Fit:** The move from (2)'s "tested" to (3)'s "survived" is problematic but less critical than the jump to (4). (3) correctly highlights that "survived" is not synonymous with "optimally tested by fierce competition." However, rejecting the inference to (4) means we *can* still say survival provides **weak but non-zero** evidence of *some* fitness or functionality, even if heavily mediated by persistence mechanisms. It doesn't prove optimality or even net benefit, but it *does* create a presumption that the institution likely *does something* that someone found valuable enough not to change it, warranting investigation.

  **Surviving Thesis:** Institutions deserve scrutiny of their historical functions before abolition due to weak-but-non-zero evidence of potential functionality embedded in survival and a decision-theoretic asymmetry favoring reversible retention over irreversible deletion.

  **Runner Up:** If forced to choose differently, I would reject premise (3). While inertia etc. are powerful forces, claiming selection pressure is "nearly nil" and useless/load-bearing fences survive at "similar rates" is likely an overstatement. Institutions *do* face pressures (crisis, competition with other states/groups, shifting societal needs, internal dysfunction causing collapse) even if weak and slow. Rejecting (3) preserves a stronger Burkean epistemic presumption but at the high cost of ignoring the very real pathologies of institutional stasis and rent-seeking that (3) highlights.

