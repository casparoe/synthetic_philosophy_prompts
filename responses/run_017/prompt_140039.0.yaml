answer: |-
  Here’s a focused, two-page proposal draft for your fellowship application, structured for clarity and interdisciplinary appeal. It centers your strongest thread while acknowledging the others as supporting elements:

  ---

  **Chapter Proposal: The Fragility of Moral Trade: When Values Resist Exchange**  
  **Dissertation Title:** *What We Owe Under Disagreement: The Ethics of Divergent Obligations*  

  ### 1. Core Question  
  *Can moral trade function when agents hold "non-fungible" values—where the identity of the actor, the nature of the act, or the context of provision is intrinsically morally significant?*  

  This question admits either outcome: non-fungible values may systematically block trade (shrinking its scope), transform its structure (e.g., into hedging), or prove compatible after conceptual refinement.  

  ### 2. The Gap in Existing Frameworks  
  Moral trade theory assumes traded values are *fungible*: outcomes are valuable regardless of who provides them (e.g., "malaria nets installed" or "historic building restored"). This enables straightforward exchange: each party values the other’s contribution instrumentally. Yet pervasive real-world values are *non-fungible*:  
  - **Agent-relativity**: "My community must feed *our* poor."  
  - **Act-restriction**: "I must avoid lying *myself*; another’s truthfulness doesn’t absolve me."  
  - **Context-dependence**: "Help must be a gift, not a transaction."  

  Existing work treats such values as mere transaction costs or preference quirks. This chapter argues they are *structurally transformative*:  
  - They don’t merely reduce tradable options; they challenge the *logic of compensation* underpinning trade. Paying an agent-relativist to forgo their value is impossible—outsiders cannot "supply" their required outcome.  
  - Standard models (e.g., based on diverse "tastes") cannot capture this, as they assume substitutability.  
  - The economic "no-trade" theorem (Milgrom-Stokey) offers a partial analogy: if disagreement is purely informational (shared goals), trade resembles irrational betting. But non-fungibility involves *fundamentally distinct value structures*, not just beliefs—so the theorem doesn’t resolve the core problem.  

  ### 3. Method: Triangulation Over 9 Months  
  A hybrid approach avoids the limitations of pure formal modeling (which may oversimplify value structures) or intuition-mining (which lacks systematic rigor).  

  | Month(s) | Task | Why This Method? |  
  |----------|------|------------------|  
  | 1–2 | **Conceptual Mapping**: Develop a taxonomy of non-fungible values (agent-relative, act-focused, contextual) and their logical constraints on trade. Uses conceptual analysis & case studies. | Establishes the *stakes* and scope. Cases ground abstractions for philosophers; taxonomy aids social scientists. |  
  | 3–4 | **Formal Exploration**: Build simple exchange models where agents have non-fungible utility functions. Test robustness under bargaining, uncertainty, and iterative interaction. | Identifies *whether/how* trade mechanics break down or mutate. Uses game theory sparingly to probe boundaries, not prescribe outcomes. |  
  | 5–6 | **Normative Uncertainty Extension**: Model trade where parties are uncertain about their *own* values (e.g., "Am I obligated to prioritize hands-cleanliness or outcomes?"). Explore if mutual hedging generates unique gains. | Tests if uncertainty rescues tradability—but brackets the *independent* question of whether hedging is rational. Focuses on trade’s *structure* under uncertainty. |  
  | 7–8 | **Synthesis & Critique**: Integrate findings to answer the core question. Assess implications: Does moral trade tacitly select for agent-neutral values? Is this a flaw or a feature? | Ensures philosophical relevance while drawing on formal insights. Avoids over-reliance on intuition or formalism alone. |  
  | 9 | **Revision & Drafting** | |  

  ### 4. Deliverable & Impact  
  - **Academic**: A theory of how value structure constrains moral cooperation under disagreement, revealing trade’s hidden fragility.  
  - **Practical**: Guidance for "trade designers" (e.g., NGO brokers, policy mediators):  
    - **Diagnostic toolkit**: Identify when non-fungible values are present (e.g., symbolic acts, identity-dependent duties).  
    - **Intervention caveats**: When trade is impossible (no compensation exists) or must be reconceived (e.g., as joint action, not exchange).  
    - **Warning**: Forcing fungibility (e.g., "just quantify the outcome") may distort values or provoke backlash.  

  ### 5. Risks, Failure Conditions & Scope Management  
  - **Failure defined**:  
    - If non-fungibility’s effects are merely additive (reducing trade volume), not transformative (altering its logic).  
    - If the uncertainty analysis collapses into the general debate on normative hedging (*your supervisor’s concern*).  
  - **Likely to outgrow 9 months**:  
    - Empirical validation (e.g., behavioral experiments on real-world trade proposals).  
    - Full integration of the "no-trade theorem" analogy (currently a *footnote* to §2).  
    - Deep exploration of trade-as-hedging (a *separate chapter*; here, it’s limited to §3’s modeling).  
  - **Mitigation**: Strict focus on *whether non-fungibility blocks/transforms trade*—not on resolving broader debates about disagreement or uncertainty.  

  ### 6. Chapter Core vs. Supporting Elements  
  - **The Chapter**: Your "first thought" is the spine: **Non-fungible values restrict and reshape trade in ways existing models ignore, revealing a hidden bias toward agent-neutrality.**  
  - **Footnotes**:  
    - The "no-trade theorem" analogy (§2) highlights a *contrast* with belief-based disagreement.  
    - Normative uncertainty (§3) is a *test case* for whether trade can function when values are unstable—but isn’t the primary claim.  

  ---  

  **Why this structure?** It targets a clear, unresolved problem (non-fungibility’s exclusion from trade theory), uses interdisciplinary tools without ceding philosophical depth, and delivers concrete insights. It explicitly contains the uncertainty angle to avoid mission creep. The committee will see feasibility and novelty.  

  **Next steps for you**: Add citations (e.g., moral trade lit: Ord, MacAskill; non-fungibility: Nagel, Williams; formal methods: Binmore). Shorten month descriptions if space is tight. Emphasize the "practical takeaways" for social scientists.
