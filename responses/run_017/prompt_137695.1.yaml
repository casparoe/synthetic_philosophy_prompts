  For the third variant: dummy in factory with "NON-FUNCTIONAL PROTOTYPE" sticker. Frame cancels: this is not a message vehicle. Outer message text is still there, but inner message might be absent or just "ignore this text." This shows the frame is essential—without it declaring message-hood, no meaning emerges.

