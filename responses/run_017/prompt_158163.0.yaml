  Assessing if it's funny: Philosophers might laugh because it turns the nominalist's view into a self-referential joke. The wink adds a personal jab, fitting the party vibe. The fudging happens with the implied regress—she doesn't actually trigger an infinite chain, but the threat is there. Also, nominalists might not think predicates create properties, so it oversimplifies. But for a drunk, showing-off moment, it works.

