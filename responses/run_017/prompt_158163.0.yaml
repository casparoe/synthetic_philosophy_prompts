  Here's the joke tailored to your specifications, followed by the breakdown of the fudging:

  **The Joke (Spoken):**

  (Character, gesturing vaguely with her wine glass towards two identical cheap party napkins)  
  "See those? Both napkins. Same mass, fundamentally. *That* mass is real. Out there. Shared. One thing."  
  (Points her glass sloppily at a colleague holding a particularly bad glass of wine)  
  "*His* 'wine-holding'? Or the 'napkinness' of those? Just noise. Labels. Useful fictions."  
  (The Nominalist, 'Charlie', smirks) "Exactly! Just predicates we use!"  
  (She leans in, conspiratorially, lowering her voice but ensuring everyone hears)  
  "Right, Charlie? So... tell me... what predicate are you using *right now*... for 'being the person *I'm* needling'?"  
  (She winks, overly exaggerated. Pause.)  
  "Careful! Invent that one too freely, and next thing you know, there’s a predicate for 'being the guy *that predicate* applies to'... and then one for *that* guy... and suddenly, Charlie..."  
  (She spreads her arms wide, sloshing wine slightly)  
  "...you're not just holding bad wine. You're holding an *infinite regress* in a cheap suit. Cheers!"

  **Why Philosophers *Might* Laugh:**

  1.  **Targets the Core Disagreement:** It directly pits the sparse realist (only fundamental properties like mass are shared universals) against the nominalist (properties are just useful predicates). The napkin/mass example is her sparse realism. The "wine-holding" and "person-being-needled" are her examples of nominalist "abundant properties".
  2.  **Exploits the Regress Worry:** The punchline weaponizes the classic Third Man Argument/regress objection *against the nominalist*. It suggests that if nominalists freely invent predicates for *any* apparent feature (like "being needled by me right now"), they open the door to needing higher-order predicates for the application of *that* predicate (e.g., a predicate for "being the subject of the 'being-needled-by-me' predicate"), leading to absurdity. This is usually an objection *realists* raise against rival realist views (like Platonic forms), but she cheekily turns it on the nominalist.
  3.  **Personal & Performative:** The wink, the direct address ("Charlie"), the physical gesture ("cheap suit"), and the spilled wine make it feel like a live, slightly messy, personal jab at the party, not just an abstract lecture. The "infinite regress in a cheap suit" is a vivid, slightly absurd image.
  4.  **"Bad Wine" Callback:** The specific, concrete detail ("bad wine") grounds it and provides a minor callback.

  **Where it Fudges/Leans for the Laugh:**

  1.  **Misapplying the Regress:** The classic regress objection (Third Man) typically targets realist views positing *separate* universals (like Platonic Forms) – asking if there's a Form for the relation between a particular and the Form, leading to infinite Forms. Nominalists generally *don't* face *this exact regress* because their "properties" aren't real entities needing explanation; they are linguistic/conceptual tools. The joke fudges by implying that nominalists *must* invent infinitely many *predicates* themselves for every level, which isn't strictly how nominalism works (they might analyze higher-order talk differently). It transplants the regress problem onto nominalism for comedic effect by treating their predicates *as if* they were realist universals needing grounding.
  2.  **Oversimplifying Nominalism:** It portrays nominalism as "inventing predicates freely," which is a caricature. Sophisticated nominalists (like Goodman or sophisticated predicate nominalists) have constraints and systems to avoid pure arbitrariness. The joke leans into the simplest "anything goes" version to make the regress threat seem immediate and absurd.
  3.  **The "One Thing" Shared:** Her setup ("That mass... One thing") glosses over the *exact* nature of immanent universals. Is the "mass" numerically identical in both napkins? Armstrong's "immanent" universals are complex (a state of affairs involving the universal *being had by* the particular). The joke relies on the intuitive, popular understanding of "one thing shared" rather than the precise metaphysics, for speed and clarity.

  **Can it Work?**  
  **Yes, cautiously.** The core disagreement *is* inherently funny material for philosophers because the stakes seem simultaneously profound and ridiculous. The joke works by:
  *   Using concrete, party-specific examples (napkins, bad wine, needling).
  *   Turning a classic philosophical objection (regress) back on the opponent in a surprising way.
  *   Adding performative drunkenness and personal teasing ("Charlie", "cheap suit").
  The fudging is necessary to make the regress punchline land quickly and viscerally within 30 seconds. Philosophers in the room would recognize the slight misapplication but likely laugh *because* it cleverly weaponizes a familiar argument against an unexpected target in a socially charged moment. The "bad wine" and "cheap suit" details prevent it from being pure abstraction. It’s the kind of joke that might get groans *and* laughs simultaneously – perfect for a slightly bombed showing-off moment.
