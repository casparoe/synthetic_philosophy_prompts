  The joke needs to highlight why there must be one thing shared by many (the realist's point), or the cost of sparse vs. abundant properties, or the regress problem realists face. The regress problem is a good angle: if two red apples share redness, is there a higher universal for that shared redness, leading to infinite regress? Realists like Armstrong avoid this by stopping at fundamental properties.

  For the joke, setting it at a party with everyday objects makes sense. Using wine glasses or something tangible. Maybe contrasting a sparse universal like mass with an abundant one like "wine-holding." The punchline could involve the nominalist's view that properties are just predicates, leading to a humorous, absurd conclusion.

