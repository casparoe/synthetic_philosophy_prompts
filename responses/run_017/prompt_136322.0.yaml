prompt: |-
  I've mostly come round to moral particularism — not the fluffy "context matters" version but the real one: no non-vacuous moral principles, and holism about valence, so the same feature (that it was a promise, that it caused pain, that someone was lied to) can push the other way, or not at all, depending on what else is going on, with no default. I want to know what would genuinely count against this.

  Skip the standard "then how do you teach ethics / how do you deliberate" as a gotcha unless you can give the particularist's best answer and say why it fails. The three things I'm actually stuck on: (1) if moral perception is something we get trained into, there has to be some systematic pattern across the cases a novice is trained on that she's picking up, and it's hard to see how that isnt a generalizable feature, just one nobody has written down yet; (2) particularists often help themselves to something like "some reasons have a default valence even though it's defeasible," and that looks like generalism readmitted through the back door, or at least a collapse into it; (3) if it turned out holism about valence holds for epistemic or prudential reasons too, does that help particularism (same phenomenon everywhere) or gut it (because then it says nothing distinctively moral, and we still seem to want principles in epistemology)?

  Rank whatever you give me: fatal, versus forces an awkward amendment, versus merely embarrassing. And separate what particularists would themselves concede counts against them from what they'd rightly dismiss as changing the subject. Be honest about whether the view has been qualified into something unfalsifiable — if every apparent counterexample gets reclassified as "you just failed to see the whole context," is there anything left that it risks? What would move me most is a concrete pair of cases where the view is committed to something plainly unacceptable.
reasoning: |-
  Okay, the user is deeply engaged with moral particularism, specifically the strong version that rejects non-vacuous moral principles and embraces valence holism. They've moved beyond superficial critiques and want substantial counterarguments. Let me unpack their three main concerns.

  First, they're stuck on the training problem: if moral perception is learned through examples, there must be some underlying pattern the novice detects. That pattern seems like it could be formulated as a principle, even if complex. Second, they're suspicious of particularists using "default valence" for some reasons—this feels like smuggling generalism back in. Third, they're wondering if valence holism appearing in epistemology or prudence would help or hurt particularism.

  The user explicitly wants concrete counterexamples where particularism leads to unacceptable conclusions. They also want honesty about whether the view becomes unfalsifiable by dismissing all counterexamples as context failures. 

  Hmm, the most promising angle might be the "unacceptable pair" request. I recall Dancy's example of two nearly identical promise-keeping cases where we'd intuitively judge differently—but what if we construct cases where the particularist must accept clearly horrific outcomes? Like a torture case where context supposedly flips the valence? But that feels artificial... real-world torture never flips positive. 

  Better to use a promise case with escalating absurdity. Imagine: Case A - keeping a trivial promise to meet for coffee. Case B - keeping that exact promise while ignoring a child drowning nearby. Particularism must say the promise feature itself remains constant in valence (since holism means valence depends on total context), but that feels wrong—surely the promise's moral force diminishes drastically in B? Yet if we say its valence flips, we're admitting features can be atomistically bad. 

  On the training concern: the particularist might reply that what's learned isn't principles but perceptual skills, like recognizing faces. But faces have invariant structures beneath variations, whereas moral features lack that. That tension needs pressing. 

  For default valence: McNaughton and Rawling explicitly reject it, but others flirt with it. If they concede defaults, they're crypto-generalists. That's awkward. 

  Epistemic holism: if all reasoning rejects principles, particularism loses its moral distinctiveness. But maybe that's fine? Though epistemology does use principles ("test hypotheses empirically") that seem robust. 

  Ranking: the concrete pair issue feels most fatal if unresolved. Training is awkward but answerable. Default valence is embarrassing if inconsistent. Epistemic spread neither helps nor hurts much. 

  Must emphasize: particularism risks unfalsifiability by calling every counterexample "misperceived context." That's a real weakness. But they'd argue it's just how morality is—messy and uncodifiable. The challenge is whether we can tolerate that messiness when it permits intuitively monstrous judgments in edge cases.
answer: |-
  Based on your sophisticated grasp of strong particularism (Dancy-esque holism, no non-vacuous principles, no default valences), here's an analysis of your three sticking points, ranked by severity, including concessions and fatal flaws:

  **Ranked Concerns & Counterarguments:**

  1.  **The "Training Problem" & Systematicity (Your Point #1)**
      *   **The Challenge:** If moral competence is a perceptual skill trained via paradigm cases, there *must* be some projectable, generalizable pattern connecting the positive/negative valences assigned in training examples. Denying this seems to deny the possibility of learning itself. Isn't the "pattern" just an ultra-complex, context-sensitive principle we haven't formalized?
      *   **Particularist Response:** They'd argue the skill learned isn't *rule-application* but *pattern recognition of gestalt similarities* (like recognizing faces or aesthetic qualities). What's transferred isn't a set of principles, but a refined sensitivity to the *salience* of features within complex wholes, guided by prototypes and analogical reasoning ("This case feels relevantly *like* that paradigm case where X mattered, but here Y changes it"). The "systematicity" exists in the *neural net-like processing* of the trained judge, not in codifiable external principles.
      *   **Why it's Awkward (Forces Amendment):** This pushes particularism towards a *radically non-conceptual* or *non-propositional* account of moral knowledge, akin to tacit knowledge or know-how. While defensible (Dancy leans here), it sits uneasily with the *deliberative* and *discursive* aspects of ethics. Explaining how *reasoned disagreement* works becomes harder if the core competency is perceptual gestalt matching rather than principle-based argument.
      *   **Concession:** Particularists *must* concede that learning requires *some* stability and projectability *within the training set*. They'd argue this stability comes from the *limited scope and similarity* of training cases, not from universally applicable principles. The "pattern" is inherently *local* and *practice-embedded*, not globally generalizable.
      *   **Falsifiability Risk:** Moderate. If *no* stable patterns could be found *even within clearly defined moral communities or training regimes*, it would threaten the learning account. However, particularists can always point to the complexity and context-sensitivity as the reason patterns resist codification *beyond* the specific practice.

  2.  **Default Valence as Generalism's Trojan Horse (Your Point #2)**
      *   **The Challenge:** Many particularists (sometimes Dancy himself, arguably) talk of features having "default" or "standard" valence, even if defeasible. This looks suspiciously like a thin moral principle ("Causing pain is *prima facie* bad"). If these defaults carry normative weight or epistemic priority in deliberation, hasn't generalism snuck back in? If defaults are *mere statistical generalizations* with no normative force ("Pain usually counts against, but tells us nothing about *why* it does or *when* it might not"), are they doing any work?
      *   **Particularist Response (Strong Line):** Pure holists like early Dancy reject *any* default valence as theoretically incoherent. The "default" is purely a *psychological or epistemological heuristic*, a habit of expectation based on past cases. It has *no normative force whatsoever* in the new case. The feature's valence is *literally created* by the total context. Saying "pain is usually bad" is just shorthand for "in most contexts we've encountered, the presence of pain contributed negatively to the overall wrongness".
      *   **Why it's Potentially Fatal:** If particularists rely on normatively loaded defaults ("this feature *gives us a reason* unless defeated"), they've collapsed into a form of generalism (Rossian *prima facie* duties). If they deny defaults entirely, they face:
          *   **The Deliberation Problem (Revisited):** How does one even *start* deliberating? Why consider pain at all if it has no presumptive significance?
          *   **The Novelty Problem:** How do we judge radically novel situations if no feature carries *any* prior valence association?
      *   **Concession:** Particularists *will* concede the *psychological reality* of default expectations. They *must* deny their *normative necessity or justificatory role*.
      *   **Falsifiability Risk:** High. Evidence that moral learners *must* grasp normatively loaded defaults (not just statistical patterns) to become competent, or that competent judges consistently treat certain features *as having* presumptive weight in deliberation (even if ultimately overridden), would be a major blow to pure holism. It forces the view into an awkward corner: either embrace a minimal generalism or make deliberation seem impossibly unanchored.

  3.  **Holism Everywhere: Help or Gut? (Your Point #3)**
      *   **The Challenge:** If epistemic or prudential reasons also exhibit valence holism (e.g., "reliability of testimony" can be a reason *for* or *against* belief depending on context; "future pleasure" can be a reason against an action if it involves imprudent risk), does this strengthen particularism (showing holism is fundamental to normativity) or gut it (making it non-distinctive and raising the same "how do we function?" questions elsewhere)?
      *   **Particularist Response:** They'd welcome this! It strengthens their core metaphysical claim: valence holism is a *general feature of normative reasons*. This doesn't "gut" moral particularism; it *generalizes* it. The argument against moral principles becomes part of a larger argument against codifiable normative principles *simpliciter*. The challenge of deliberation/learning applies equally, but that's a problem for *everyone*, not just moral particularists.
      *   **Why it's Merely Embarrassing (or Neutral):** It doesn't directly *refute* moral particularism; it just shifts the battlefield. However:
          *   **Epistemology's Counter-Pressure:** Epistemology *seems* to function better with stable principles (e.g., "Believe the outputs of perception under normal conditions," "Prefer simpler explanations"). If strong holism is true for epistemic reasons, why does epistemology *feel* more codifiable? Particularists must argue this is an illusion or due to the relative simplicity of epistemic contexts vs. moral ones.
          *   **Distinctiveness Lost?** Yes, but particularists don't necessarily care. Their core claim is about *morality's* structure, even if that structure isn't unique. Finding holism elsewhere doesn't make their moral claim false.
      *   **Concession:** Particularists might concede that widespread holism makes their view *less surprising* but doesn't directly *support* it. They'd rightly dismiss the "distinctiveness" objection as changing the subject.
      *   **Falsifiability Risk:** Low. Holism in other domains doesn't falsify moral holism; it might even provide analogical support. The pressure comes from whether holism *can* plausibly explain practices like science that seem heavily principle-dependent.

  **The "Unacceptable Pair" Challenge (The Fatal Flank?)**

  You rightly demand concrete cases where particularism forces an unacceptable judgment. Constructing truly fatal pairs is hard because particularists excel at context description. However, here's an attempt exploiting the *absence of default valence* and demanding *radical valence flip*:

  *   **Case A (Paradigm Wrongness):** Jones gratuitously tortures an innocent, sentient being (Child) for 10 minutes, causing intense, terrified suffering. No other significant features (no greater good, no consent, not punishment, agent fully aware). *Intuition:* Clearly, monstrously wrong. The feature "causes intense suffering to innocent sentient being" (F1) has a massively negative valence here.
  *   **Case B (The Flip Demand):** Smith performs an action. *The only known feature is F1: it causes intense, terrified suffering to an innocent, sentient being (Child) for 10 minutes.* Particularism, however, insists F1 *has no default valence*. Its valence is *entirely determined* by the total context, which is (by stipulation, to isolate F1) currently unspecified except for F1 itself.

  **The Challenge:** What can the particularist *possibly* say about Case B?
  1.  **Say F1 is negative here?** But this implies F1 *does* carry a default negative valence in isolation, contradicting holism. It makes F1 function like a *prima facie* wrong-maker.
  2.  **Say the valence is indeterminate?** But then particularism cannot deliver *any* moral judgment on Case B, even though the *only* known feature is one that, in Case A, made an act monstrous. This seems absurdly counterintuitive and paralyzing for judgment. How could causing such suffering *not* count against the action *at all* without *any* known countervailing context?
  3.  **Say we *need* more context?** This is the particularist's refuge. But the challenge is: **Does F1 *itself* provide *any* moral reason *against* Smith's action *prior* to knowing the rest of the context?** Pure holism *must* answer "No." Its valence is *literally zero* until the context fills it in. This clashes profoundly with the intuition that knowing *only* F1 gives us a *very strong* (defeasible) reason to condemn Smith's action *immediately*.

  **Why this is Potentially Fatal:** It forces the particularist to choose:
  *   **Deny Intuition:** Argue that knowing *only* F1 truly gives us *zero* reason to think Smith did wrong. This seems wildly implausible and undermines the very basis of moral condemnation in paradigm cases like A. It makes moral perception seem unmoored.
  *   **Concede Default Valence:** Admit that F1 *does* carry a negative valence *in the absence of defeating conditions*, effectively embracing a minimal generalism. This collapses the strong holist position.
  *   **Hide Behind Indeterminacy:** Claim Case B is simply not a possible context for judgment. But this seems like evasion. We constantly make defeasible judgments based on partial information, relying on the stable valence of core features.

  **Conclusion on Falsifiability:**

  Particularism *is* at high risk of becoming unfalsifiable if every counterexample is dismissed with "you haven't fully grasped the context's holistic difference." However, the "Unacceptable Pair" strategy above *does* pose a risk. If strong intuitions hold that (1) some features *do* provide immediate, defeasible reasons based on themselves alone (even prior to full context), and (2) pure holism cannot accommodate this without collapsing or becoming absurdly counterintuitive (as in Case B), then the view *is* falsifiable by our considered moral judgments. The "Training Problem" and "Default Valence" concerns apply significant pressure, potentially forcing awkward amendments. Widespread normative holism is less a threat than a shift in scope. The Achilles' heel remains **the combination of radical valence holism and the denial of default valences** when confronted with cases isolating deeply morally significant features.
