answer: |-
  ## Proposal: Moral Foundations as Signal Detectors - Calibration vs. Coverage in Debunking Debates

  **Research Question:** Does reframing moral disagreement within Moral Foundations Theory (MFT) as primarily a matter of *calibration* (sensitivity thresholds, false-positive rates) rather than *coverage* (presence/absence of foundations) significantly alter the force and scope of debunking arguments aimed at political outgroups?

  **Background and Problem:** MFT reveals systematic differences in the moral intuitions underpinning progressive ("left") and conservative ("right") judgments. The persistent question arising is whether this divergence informs *who is actually right*. Dominant answers fall into two problematic camps: (1) Radical Debunking: Differences demonstrate the unreliability of *all* moral intuitions, rendering objective moral judgment impossible. (2) Conservative Superset: Conservatives utilize a broader range of foundations (adding Loyalty, Authority, Sanctity to Harm and Fairness), implying progressives operate with a deficient, truncated moral framework. Both views share a critical, unexamined assumption: that the key variable distinguishing groups is *which* foundations are activated (*coverage*), treating foundations as binary switches.

  **Core Hypothesis:** This coverage-centric framing obscures a potentially more fundamental dimension: *calibration*. Moral foundations may function akin to signal detectors. A detector isn't simply "present" or "absent"; it possesses a *sensitivity threshold* (how strong a signal is needed to trigger it) and a *false-positive rate* (how often irrelevant signals trigger it). The critical disagreement may not be whether "Sanctity" is registered *at all*, but *what level of impurity* triggers it, or *in what domains* it is appropriately applied (e.g., bodily purity vs. flag desecration). Recasting the debate in terms of calibration versus coverage fundamentally changes the landscape for debunking arguments.

  **Why Coverage Leaves it Open:** The coverage framing forces the debate into the unsatisfying binary above. It cannot capture nuanced disagreements *within* a shared foundation. For instance, both sides clearly value Harm/Care, but may disagree profoundly on what *constitutes* significant harm, or the threshold of risk warranting intervention. Debunking arguments targeting foundation *absence* (e.g., "Conservatives lack sufficient Fairness") or *presence* (e.g., "Progressives' Sanctity intuitions are vestigial") are blunt instruments that ignore this tuning. They leave unexplored whether intuitions fail due to missing hardware or faulty calibration of existing hardware.

  **Methodology & Work Plan:**

  *   **Months 1-2: Conceptual Framework & Case Design:** Rigorously define "calibration" (sensitivity, domain-specificity, false-positive susceptibility) within the MFT framework using signal detection theory. Develop a set of targeted moral scenarios and vignettes. Crucially, these will be designed to **hold foundation coverage constant** while systematically varying factors relevant to *calibration*:
      *   *Sensitivity:* Vary the *degree* or *probability* of a foundation-relevant stimulus (e.g., severity of a purity violation, certainty of betrayal, level of authority defiance).
      *   *Domain Specificity:* Present analogous actions in different domains (e.g., bodily purity vs. data security for Sanctity; familial loyalty vs. national loyalty for Loyalty).
      *   *False Positive Probes:* Include scenarios where foundation activation might be a "false alarm" (e.g., disgust triggered by harmless cultural differences relevant to Sanctity).
  *   **Months 3-6: Empirical Investigation (Survey Experiments):** Deploy these scenarios via large-scale online surveys targeting politically diverse samples. Core tasks:
      *   Moral Judgment: Rate wrongness, permissibility.
      *   Foundation Attribution: Identify which foundations are perceived as relevant (controlling for coverage perception).
      *   Calibration Perception: Gauge perceived sensitivity/oversensitivity of self and typical outgroup member regarding specific foundations in the presented scenarios.
      *   Debunking Susceptibility: Present standard debunking arguments (e.g., "Your intuition is just a product of evolution/upbringing") framed either against the *foundation's existence* (coverage debunking) or against its *calibration* ("Your threshold for Authority violations is too high/low"). Measure impact on judgment confidence and persuasiveness.
  *   **Months 7-9: Analysis & Model Building:** Analyze how disagreement patterns map onto calibration variations vs. perceived coverage gaps. Crucially, test whether:
      *   Outgroup judgments perceived as miscalibrated are more resistant to *coverage-based* debunking than judgments perceived as stemming from missing foundations.
      *   *Calibration-focused* debunking arguments have different levels of force or persuasiveness compared to coverage-focused arguments, and whether this differs when targeting ingroup vs. outgroup judgments.
      *   Calibration parameters better predict moral disagreement than simple foundation endorsement scores.
  *   **Month 10-12: Synthesis, Writing, Dissemination:** Integrate findings into a cohesive argument. Draft manuscript(s) addressing the core question and implications for MFT and moral epistemology. Present preliminary findings at relevant conferences.

  **Expected Outcomes & Significance:**

  *   **"Yes" Answer:** Clear evidence that moral disagreement is often better characterized as calibration differences within shared foundations. Crucially, this reframing significantly alters the debunking landscape: Calibration-focused debunking may be more nuanced and potentially *more effective* against outgroup judgments perceived as oversensitive/undersensitive, while coverage-based debunking loses force. This suggests debunking arguments need to target *how* foundations are applied, not just *if* they exist.
  *   **"No" Answer:** Evidence that disagreement patterns are overwhelmingly driven by perceived coverage differences, and that calibration variations are minor or don't significantly impact responses to debunking arguments. This would bolster the existing coverage-centric debate but still provide valuable empirical clarification.
  *   **Significance:** Either outcome advances the debate. A "Yes" offers a transformative perspective, moving beyond the unproductive coverage binary, providing a more precise vocabulary for disagreement, and refining the tools and targets of debunking arguments in political psychology and metaethics. A "No" provides robust empirical grounding for the current framing.

  **Defining Failure:** The project fails if:
  1.  Scenarios cannot be designed that effectively isolate calibration from coverage in participants' perceptions.
  2.  Calibration parameters prove impossible to measure reliably or fail to show meaningful variation across individuals/groups.
  3.  Debunking manipulations (both coverage and calibration) show no significant effect on judgments, making the core comparison impossible.
  4.  Results are hopelessly muddled or show no interpretable pattern regarding the core hypothesis.

  **Scope and Feasibility (Honest Assessment):** The primary risk is **scope creep**. Calibration is potentially multi-faceted (thresholds, domain-specificity, false positives). A year is sufficient only if we strictly focus on the *core comparison to coverage* and its impact on *debunking arguments*. We must:
  *   Limit foundation focus (likely Harm, Fairness, Sanctity as primary test cases).
  *   Prioritize clear, experimentally tractable calibration manipulations (e.g., sensitivity thresholds) over highly complex or culturally embedded aspects.
  *   Rely on well-established survey methods rather than lengthy longitudinal or neuroimaging studies.
  The signal-detection framing is **doing real conceptual work**, not just relabeling. It provides a *formal framework* with specific, measurable parameters (d', beta, ROC curves in theory) that move beyond vague notions of "emphasis" or "importance." It forces precision on *what aspect* of a foundation's operation might differ – its trigger point or its error rate. If successful, this operationalization is the project's key innovation. However, its ultimate value hinges on empirical validation: Can we reliably elicit and measure these parameters in the context of moral judgment? Month 1-2 scenario piloting is critical to test this. If calibration proves too nebulous or inseparable from coverage in practice, the framing's utility diminishes. Proceed, but prioritize empirical validation of the core distinction early on.
