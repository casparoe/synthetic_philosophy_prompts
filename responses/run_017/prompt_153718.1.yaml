  ### Decision Tree: Mapping Indirect Normativity  
  **Starting Commitment**: An act's deontic status is settled by what an idealised version of the agent's *actual deliberation* would deliver, not by the agent's own actual deliberation.  

  **How to Use**: Work through the tree sequentially. For each question, answer based on your reaction to the concrete case *without* anticipating where it leads. Record your path (e.g., A-B-C...). The path determines your position. Do not tally scores—treat this as a diagnostic journey.  

