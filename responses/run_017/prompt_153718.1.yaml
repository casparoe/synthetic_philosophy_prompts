  #### Branch Nodes  
  1. **Anchoring (Taylor's Case)**:  
     Taylor grew up in an oppressive society and has desires deformed by it (e.g., to please oppressors). When idealising Taylor’s deliberation, do we:  
     - **A**: Inherit Taylor’s actual desires, aims, and concerns as the starting point?  
     - **B**: Replace them with a fully general standpoint (e.g., what any rational agent would desire)?  

  2. **Information (Dr. Lee's Case)**:  
     Dr. Lee must choose between Drug A (strong evidence for safety, moderate efficacy) and Drug B (weaker evidence, but potentially higher efficacy if a hypothesis is true). Dr. Lee has limited time to gather more evidence. The idealised deliberation uses:  
     - **A**: Full information (including whether the hypothesis about Drug B is true).  
     - **B**: Dr. Lee’s actual evidence at the time.  
     - **C**: Evidence Dr. Lee could have gathered in the time available.  

  3. **Powers (Dr. Lee's Case)**:  
     For Dr. Lee’s idealised deliberation, we assume:  
     - **A**: Costless, unlimited computational power (e.g., instantly calculating all probabilities).  
     - **B**: Bounded computation (e.g., 10 minutes) but cleansed of bias, distraction, and weakness of will.  

  4. **Target (Partial Compliance Case)**:  
     An idealised advisor knows the agent will only partially comply with its recommendation (e.g., following 60% of it). The advisor outputs:  
     - **A**: What the advisor *would choose* if in the agent’s exact situation.  
     - **B**: What the advisor *would advise* the agent to do.  
     - **C**: What the advisor *would want* the agent to do.  
     - **D**: What the advisor *ranks first* (e.g., the best option, even if not chosen).  

  5. **Uptake-Sensitivity (Alex's Trust Case)**:  
     Alex’s deliberating about whether to trust a friend might itself destroy the trust (as the friend values spontaneity). The idealised deliberation:  
     - **A**: Accounts for how Alex’s actual decision process (e.g., over-deliberating) affects outcomes.  
     - **B**: Ignores how Alex decides and focuses solely on the act of trusting.  

  6. **Modality (Dr. Lee's Case)**:  
     The idealised deliberation for Dr. Lee determines:  
     - **A**: What the idealised Dr. Lee *would* do.  
     - **B**: What the idealised Dr. Lee *could* do (feasible options).  
     - **C**: What it *would be best* for Dr. Lee to do.  

  7. **Indirectness (Alex's Trust Case)**:  
     Should Alex *use* the idealised deliberation procedure (e.g., weighing costs/benefits of trusting) when deciding?  
     - **A**: Yes—it is the correct decision procedure.  
     - **B**: No—because deliberating is costly (e.g., it ruins trust).  
     - **C**: No—because uncalculating dispositions (e.g., spontaneity) are indispensable.  
     - **D**: No—because of moral uncertainty (Alex cannot reliably apply the criterion).  
     - **E**: No—for other reasons (e.g., coordination with others).  

  8. **Vindication (Alex's Trust Case)**:  
     Suppose the idealised deliberation recommends trusting without deliberating. This is vindicated by:  
     - **A**: The criterion itself (what idealised deliberation says).  
     - **B**: An independent standard (e.g., maximising well-being or rationality).  

  9. **Self-Effacement (Taylor's Case)**:  
     If Taylor believed this theory (which critiques her deformed desires), it might worsen her outcomes (e.g., causing distress). The theory implies:  
     - **A**: It is not better for Taylor to disbelieve the theory.  
     - **B**: It is better for Taylor to disbelieve it in this case (but not always).  
     - **C**: It is better for all agents to disbelieve it globally.  

  10. **Scope (Taylor's Case)**:  
      The idealised deliberation for Taylor addresses:  
      - **A**: Only the immediate decision (e.g., whether to challenge an oppressor now).  
      - **B**: Taylor’s whole life plan (e.g., cultivating traits to resist oppression).  

