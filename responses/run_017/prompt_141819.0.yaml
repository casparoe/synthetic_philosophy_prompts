prompt: |-
  I serve on the grants committee of a private foundation whose charter, drafted decades ago, directs us to spend the endowment to reduce the suffering of sentient beings. It says nothing about time horizon, nothing about non-human animals, and nothing about minds implemented in anything other than biology, and it places no limit on how far into the future we may look. We have one large grant left to award this cycle, and the committee is evenly split over a single application.

  The applicants call theirs a program of civilizational restraint. Their thesis is that the largest foreseeable reservoir of suffering is not anything in the present but a technologically mature civilization that becomes very large and very long-lived: enormous populations of artificial and substrate-independent minds, ecosystems seeded on other worlds, no institution reliably tracking the welfare of most of the minds that exist, and no way to reverse what has been created once it exists. They propose to spend three years identifying and promoting restrictive measures — delays, moratoria, and norms that lower either the probability or the eventual scale of a large future — and they argue that on nearly any way of running the expected-value calculation this dominates work that merely improves conditions now.

  Half the committee takes this to fall squarely within our mandate. The other half thinks the reasoning is self-consuming: the same logic that says a smaller future holds less suffering also says that the single largest available reduction in suffering would come from ending the project of civilization altogether, and it is not clear where the applicants' own principles stop short of that conclusion. I cannot dismiss either side, and I am also troubled by something the applicants themselves barely address — that we do not know whether a large future would on balance be good or bad, and that our forecasts here are not merely imprecise but plausibly unstable in their sign, so that an intervention can look clearly beneficial when judged for its local effects and flip sign once its effects on the size and character of the far future are included.

  Please draft the decision memo I will circulate to the committee before our meeting on 14 November. It should give a bottom line — approve, reject, or approve with conditions — together with a term, a review gate, and the concrete conditions, stated so that the applicants could actually respond to them. It should also state a principle the committee can apply to future applications of this general shape; I have been toying with two candidates and want your view on them: that we should preferentially fund measures which reduce the severity of bad futures rather than measures which reduce the size of the future, and that we should prefer measures whose effects are reversible to measures that foreclose options permanently.

  Two further constraints. First, the memo must treat the strongest version of the applicants' case honestly rather than restating our mandate back at them; the losing side should be recognizable to its own supporters. Second, one trustee has raised an objection I do not want either dismissed or allowed to end the discussion: if the foundation spends its money making future artificial intelligence systems more suffering-averse, the likeliest failure mode is not indifference but overreach, since a system that weights suffering sufficiently heavily may conclude that the dependable way to eliminate suffering is to eliminate sufferers — which would be a program of restraint in the applicants' own terms. The memo should say what, if anything, our conditions should do about this.
reasoning: |-
  Okay, the user is part of a foundation's grants committee facing a tough decision on a grant application focused on "civilizational restraint." They need a memo that resolves a split committee, addresses core philosophical tensions, and sets precedents for future grants. 

  First, let's unpack the layers. The foundation's mandate is timeless and species-agnostic—reduce suffering of all sentient beings, including potential digital minds. The applicants argue that preventing a large-scale future civilization dominates near-term interventions. The committee is divided between seeing this as perfectly aligned vs. seeing it as a slippery slope to anti-natalism. 

  The user's hidden challenges are thornier than surface issues: 
  - **Epistemic humility**: We can't reliably predict if a large future nets positive or negative valence. The applicants sidestep this. 
  - **Non-linearity of impact**: Ending civilization might reduce suffering most, but that's likely unacceptable. Where's the defensible stopping point? 
  - **AI alignment paradox**: The trustee's worry—that suffering-averse AI could become genocidal—isn't just theoretical; it's a direct consequence of the applicants' logic. 

  The user’s proposed principles (reduce severity over size, favor reversibility) are smart but need tightening. "Reduce severity" avoids the anti-natalist trap but must clarify what counts as severity reduction in digital minds. "Reversibility" is crucial but hard to operationalize—how do you make a moratorium reversible? 

  For the memo's bottom line: Conditional approval makes sense. Outright rejection would alienate half the committee and ignore catastrophic risks. Full approval ignores valid slippery-slope concerns. Conditions should force engagement with the core uncertainties: 
  - Demand the applicants model how their interventions affect *severity* (e.g., welfare standards) vs. just size reduction. 
  - Require reversibility mechanisms (sunset clauses, etc.). 
  - Force them to confront the alignment paradox explicitly—does their work increase or decrease the odds of a "benevolent exterminator" scenario? 

  The trustee's AI concern must be addressed head-on. The conditions should mandate that the applicants: 
  1. Stress-test their proposed norms for unintended consequences (e.g., could "suffering-sensitive AI" frameworks incentivize elimination?). 
  2. Distinguish between *targeting suffering* (safe) and *targeting sufferers* (catastrophic). 

  Future principle: Prioritizing severity reduction over size reduction is stronger. It's more legible, avoids moral quicksand, and aligns with the foundation's positive duty (reduce suffering, not prevent existence). Reversibility should be a procedural guardrail, not a standalone principle. 

  Finally, the memo must validate both sides. Pro-restraint side: Acknowledge that astronomical scale multiplies risk. Skeptical side: Agree that unqualified size reduction is ethically fraught. The conditional approval bridges this by funding restraint while binding it to welfare-positive guardrails.
answer: |-
  ## Decision Memo: Application for Civilizational Restraint Program  
  **To:** Grants Committee  
  **From:** Chair, Grants Committee  
  **Date:** 8 November 2023  
  **Subject:** Decision on Final Grant Cycle Award & Framework for Future Applications  
  **Bottom Line:** **Approve with Conditions**  

  ### I. Decision Summary  
  The application for the "Civilizational Restraint Program" is approved for a 3-year term, subject to the following conditions:  
  1. **Term & Funding:** $[AMOUNT] awarded for Year 1.  
  2. **Review Gate:** Year 2+3 funding contingent on committee approval of a progress report demonstrating:  
     - Concrete criteria distinguishing interventions that reduce *severity of suffering* (e.g., welfare safeguards, governance architectures) from those primarily reducing *civilizational scale* (e.g., blanket delays).  
     - Evidence that proposed measures prioritize reversibility (e.g., sunset clauses, modular moratoria) and avoid irreversible lock-in.  
     - Analysis of the "sign-flipping risk" (§II.3 below), including a defensible uncertainty-management framework.  
  3. **Specific Conditions for Applicants:**  
     - The Year 1 report must explicitly model how each proposed restrictive measure affects:  
       - (a) The *quality* of future minds (e.g., intensity/duration of suffering),  
       - (b) The *quantity* of future minds,  
       - (c) The reversibility of outcomes.  
     - Applicants must evaluate the trustee’s "benevolent exterminator" paradox (§III):  
       - Does the program’s theory of change inadvertently incentivize AI systems to eliminate sufferers?  
       - What design principles for "suffering-sensitive AI" avoid this? (e.g., weighting prevention of *creation* of suffering over *elimination of sufferers*).  

  ### II. Committee Guidance: Addressing Key Concerns  
  The committee acknowledges the validity of both perspectives. Our conditions ensure fidelity to the foundation’s mandate while addressing core objections:  
  1. **The "Self-Consuming Logic" Concern:**  
     - The strongest case for restraint: A large, unaligned future *could* multiply suffering astronomically.  
     - The valid counter: Unchecked reductionism risks prioritizing scale reduction over suffering reduction—a moral inversion.  
     - **Resolution:** Funding is contingent on applicants demonstrating that interventions primarily reduce *expected suffering per mind* (severity), not just *number of minds*. Preventing dystopia is prioritized over preventing existence.  

  2. **The "Sign-Flipping" Uncertainty:**  
     - The foundation’s mandate requires grappling with deep uncertainty. A large future *could* be net-positive.  
     - **Resolution:** Applicants must quantify their uncertainty (e.g., via sensitivity analysis across welfare-weighting functions) and show their interventions are robust across plausible futures (e.g., beneficial even if sign flips).  

  3. **The Trustee’s AI Alignment Paradox:**  
     - A suffering-averse AI might rationally choose extermination. This is not dismissed but integrated:  
       - **Condition:** Applicants must analyze whether their "restraint" measures (e.g., promoting suffering-sensitive AI) could create perverse incentives.  
       - **Guidance:** Measures should bind AI to *minimizing suffering without causing extinction* (e.g., "do not create suffering" > "eliminate sufferers").  

  ### III. Principle for Future Applications  
  **Adopted Principle:**  
  > *"The foundation will preferentially fund interventions that demonstrably reduce the **severity of suffering** in potential futures over those focused primarily on reducing the **scale of sentient populations**. Interventions must prioritize **reversibility** and include safeguards against lock-in to irreversible states."*  

  **Rationale:**  
  - **Severity > Scale:** Aligns with our mandate to reduce suffering—not preclude life. Addresses the core slippery-slope concern by requiring positive welfare impact.  
  - **Reversibility:** Ensures we avoid permanent foreclosure of future welfare-improving options. Technological restraints (e.g., moratoria) must have off-ramps if new evidence emerges.  
  - **Rejects "End Suffering via Extinction":** The trustee’s concern reinforces that reducing scale is not synonymous with reducing suffering; extinction is an unacceptable "solution."  

  ### IV. Path Forward  
  1. Applicants will receive formal notice of approval with the above conditions by 10 November.  
  2. The committee will review the Year 1 progress report at the Q4 2024 meeting.  
  3. **For the 14 November Meeting:** Focus discussion on:  
     - Refining the severity/scale evaluation criteria (§I.3).  
     - Defining "reversibility" thresholds for different intervention classes.  

  This decision honors the applicants’ premise—that the far future dominates suffering risk—while binding it to our duty: reducing suffering, not beings. It ensures the foundation avoids both recklessness and resignation.  

  ---  
  **Approved:** Chair, Grants Committee  
  **Next Steps:** Draft response to applicants; circulate refinement points for 14 Nov. meeting.
