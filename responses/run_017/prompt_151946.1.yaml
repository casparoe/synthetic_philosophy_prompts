prompt: |-
  I chair the research-allocation committee of a biomedical funding foundation. For the last two cycles we have run our final deliberation under a procedure one of our members proposed as an implementation of Aumann's agreement theorem, and I am now unsure whether the procedure rests on the theorem or merely borrows its authority.

  The procedure is this. Before any discussion, each member privately writes down a probability that the shortlisted programme will meet its primary endpoint within five years. We then circulate the numbers, ask everyone to revise in light of what they have seen, and repeat until no one wishes to move; we rank the portfolio by the settled number. The rationale offered was that Bayesian agents who begin from a common prior cannot agree to disagree, so a number on which the committee has converged is the committee's rational posterior, and a member who declines to move toward the others is thereby displaying either irrationality or bad faith. To secure the common prior we circulate an identical evidence dossier to everyone a week beforehand.

  Two things have gone wrong, and I would like to know which of our background assumptions is at fault.

  First, the settled number has repeatedly fallen outside the interval spanned by our initial estimates, sometimes far outside; in the last cycle our private figures were 0.30, 0.35 and 0.40, and we converged on 0.85. I had taken it to be a consequence of the theorem that the consensus must lie among the starting points, and two members now treat the overshoot as proof that the procedure is broken. Is the theorem really in the business of constraining where the consensus falls relative to the individual starting points, or does it say something weaker?

  Second, a senior member has stopped revising at all. Her stated reason is that the common-prior assumption was never true of us: we come from different fields, we read the same dossier through different theoretical commitments, and there is no fact of the matter about our shared prior over the states. On that basis she says the theorem has nothing to say about this committee and that we are invoking it to discipline dissent. Does sharing a dossier secure a common prior, or does the antecedent of the theorem fail here in a way that makes our talk of the rational posterior empty?

  I would also like to know whether it matters that we exchange numbers only and never the reasoning behind them, whether the settled figure is the best estimate available to the panel or only a negotiated truce, and how the procedure should be redesigned if what we actually want to act on is the best estimate the panel's pooled evidence supports.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They chair a committee that uses a procedure inspired by Aumann's agreement theorem for funding decisions. The main issues are the settled probability ending up outside the initial range and a member refusing to participate, questioning the common prior assumption. 

  First, I need to recall what Aumann's theorem actually states. It's about Bayesian agents with a common prior updating their beliefs through shared information. The key point is that if their posterior beliefs are common knowledge, they must be equal. But the theorem doesn't specify where the consensus lands relative to initial estimates. That explains why their committee ended up with 0.85 despite starting between 0.30 and 0.40. The members might have assumed others had strong private information, leading to an overshoot. The misunderstanding here is thinking the consensus must be within the initial range, which isn't true.

  Next, the senior member's refusal highlights the common prior issue. Just sharing a dossier doesn't guarantee a common prior because each member interprets the evidence through their own theoretical lens. Since they come from different fields, their priors are shaped by different experiences and knowledge, making the common prior assumption unrealistic. This undermines the theorem's applicability, as the antecedent isn't met. The procedure might be seen as coercive, pushing conformity rather than rational updating.

  The user also asks about exchanging only numbers without reasoning. This is problematic because Bayesian updating requires knowing the likelihoods (how evidence affects hypotheses). Without sharing reasoning, members can't properly update; they might misinterpret why others hold certain probabilities, leading to irrational shifts. For example, seeing a high probability might be attributed to strong private evidence when it's actually based on different reasoning.

  The settled figure is more of a negotiated truce than the best estimate. Without a true common prior and proper information sharing, it's not a rational posterior. To get the best estimate, the committee should focus on sharing evidence and reasoning, not just probabilities. Structured discussions, expert testimonies, and perhaps using prediction markets could help aggregate diverse knowledge more effectively. Transparency in reasoning would address the senior member's concerns and lead to a more genuine consensus based on pooled evidence.
answer: |-
  Your concerns are well-founded; the procedure as implemented misapplies Aumann's theorem in ways that undermine its validity and utility. Let's break down the issues:

  ### 1. **The "Overshoot" Problem (0.30–0.40 → 0.85)**
     - **What Aumann's Theorem Actually Says**:  
       Aumann's agreement theorem states that if two (or more) Bayesian agents share a *common prior* and their *posterior beliefs are common knowledge*, they cannot "agree to disagree" — their posteriors must be identical.  
       **Crucially, it does *not* constrain the consensus to lie within the initial interval of estimates.** The consensus can fall anywhere, even far outside the initial range.

     - **Why Overshoots Happen**:  
       - Agents update not just on others' estimates, but on *why* others hold those estimates. When member A sees member B's higher estimate, A infers that B has private information justifying it.  
       - In your case, when members saw others' estimates (0.30, 0.35, 0.40), each might have thought: *"Others are conservative, but they must have seen something I missed"*. This triggers aggressive upward revisions.  
       - The process amplifies shared optimism if members assume others possess strong positive private information. The result (0.85) reflects cascading belief in hidden evidence no one actually has.

     - **Key Misunderstanding**:  
       The committee incorrectly assumed the theorem guarantees the consensus is a "rational average" of priors. **The theorem ensures consensus under ideal conditions but says nothing about where consensus lands relative to initial beliefs.** Overshoots are mathematically possible and practically common.

  ### 2. **The Common Prior Problem**
     - **Why the Senior Member is Correct**:  
       Sharing a dossier **does not** create a common prior. A "common prior" requires that:  
       - All members interpret the *same state space* identically (e.g., agree on what variables define "success").  
       - All members agree on the *likelihood* of evidence given those states (e.g., how a lab result affects the probability of success).  
       - **Your committee fails both conditions:**  
         • Different fields = different mental models of causality (e.g., a geneticist vs. an epidemiologist).  
         • Theoretical commitments = different interpretations of evidence (e.g., one sees a biomarker as predictive; another sees it as noise).  
       - **No common prior exists** here because members have fundamentally different structures for assigning probabilities to states of the world. The dossier is filtered through incompatible epistemic lenses.

     - **Consequence**:  
       Without a common prior, Aumann's theorem does not apply. The "consensus" is **not** a rational posterior; it’s a negotiated number influenced by social dynamics (e.g., deference to seniority, persuasive individuals). The procedure *is* being used to discipline dissent, not to reveal truth.

  ### 3. **The Fatal Flaw: Exchanging Numbers Without Reasoning**
     - **Bayesian updating requires knowing *why* beliefs differ**. If Alice believes *P=0.2* and Bob believes *P=0.8*, rational updating depends on whether:  
       - They observed *different evidence* (which should be shared), or  
       - They interpreted the *same evidence* differently (which requires discussing assumptions).  
     - **Exchanging only probabilities**:  
       - Forces members to guess *why* others disagree. This often leads to "information cascades" where members overweight others' confidence (e.g., "They must know something I don't").  
       - Conceals critical disagreements about evidence interpretation or causal models.  
       - **Result**: The "consensus" is a *behavioral artifact*, not a Bayesian posterior. It reflects social influence, not pooled knowledge.

  ### 4. **Is the Settled Figure "Best Estimate" or "Truce"?**
     - In your procedure, **it is a truce**—not a best estimate. Without:  
       - A true common prior,  
       - Sharing of private evidence,  
       - Discussion of reasoning,  
       the number has no claim to epistemic legitimacy. It aggregates biases under social pressure.

  ### 5. **Redesigning for a Genuine "Best Estimate"**
     To leverage the committee's collective expertise, replace the Aumann-inspired procedure with:
     - **Structured Evidence Sharing**:  
       - Require members to submit *key evidence* supporting their estimate (e.g., 2–3 studies or data points). Discuss these openly.  
       - Use a "confidential vote → discussion → revised vote" format to reduce anchoring.
     - **Explicit Reasoning Transparency**:  
       - Members must articulate:  
         • Their causal model of the program's success.  
         • How specific evidence updates their prior (e.g., "This mouse study increases my estimate by 0.15").  
       - Record and map disagreements to underlying assumptions (e.g., "We disagree on the predictive value of preclinical data").
     - **Prediction Markets or Quantified Judgments**:  
       - Have members bet on outcomes using a virtual currency. This incentivizes truth-telling.  
       - Use techniques like the *Delphi method*: anonymized estimates with iterative feedback including reasoning.
     - **Abandon Forced Consensus**:  
       - **Median estimates often outperform consensus** in aggregated judgments. Rank programs by median scores after discussion.  
       - If consensus is mandated, require unanimity on a *range* (e.g., "We all agree *P* is between 0.70–0.90") rather than a point estimate.

  ### Final Diagnosis
  Your procedure fails because:  
  - **Antecedent failure**: No common prior exists (due to field diversity).  
  - **Misapplied mechanism**: Exchanging numbers without reasoning invites irrational herding.  
  - **Misunderstanding the theorem**: Consensus need not lie in the initial interval.  

  **Recommendation**: Shift to evidence-focused deliberation with quantified reasoning. The goal is not consensus for its own sake, but exposing the roots of disagreement to synthesize a truly informed estimate. Aumann's theorem remains profound, but it is a poor tool for heterogeneous expert panels — its assumptions are too brittle for real-world disagreements.
