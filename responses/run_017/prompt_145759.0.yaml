  Session flow should: 
  Start with their real decision (hospice vs screening) to ground discussion
  Present Ada/Ben scenario to surface discomfort
  Introduce "separateness" as a label for that unease
  Then address rotation - showing how it doesn't erase distinct experiences
  Finally confront the "just tweak weights" misconception by distinguishing technical fixes from fundamental challenges

