  The committee members include diverse professionals: an actuary, GPs, a chaplain, solicitor, councillor, teacher, and young patient rep. They naturally default to cost-effectiveness aggregation as rational. The unique twist is their foundation's ten-year rotating strategy where subgroups take turns "losing" in funding cycles. 

