answer: |-
  Start by grounding this in their experience: open with the hospice transport cut. Ask them to recall that vote and sit with their own reactions for a moment—not arguing yet, just noticing. Then introduce Ada and Ben, two named residents from your catchment area. Ada, seventy-eight, with mobility issues, relied on the axed transport to visit her dying husband in hospice; its loss meant weeks of isolation and unresolved grief. Ben, fifty-five, pre-diabetic, avoided complications through the expanded screening. Both are real people within your ten-year cycle. The arithmetic showed net QALY gain: many Bens benefited slightly, one Ada suffered severely. Your discomfort, you’ll say, is about whether that trade-off treats Ada as a *site* of value rather than a *source* of it.  

  Build the case around them. Use identifiable individuals—not statistics—because abstraction blunts the moral bite. Make losses concentrated (Ada’s profound isolation) and gains diffuse (dozens like Ben gaining marginal health increments). Avoid death; it triggers trolley-problem reflexes and oversimplifies the objection into life-death trade-offs. Here, it’s about irreplaceable human experiences: Ada’s final moments with her partner aren’t compensable by Ben’s prevented inconvenience, even if summed. The dependency structure is crucial: they must first feel the pull of Ada’s loss *as a distinct moral event* before aggregation makes sense as a problem. If they jump to “But we helped more people!”, they’re still in the aggregative mindset. Ask: “Does Ada’s suffering vanish because we can point to twenty Bens who avoided finger-prick anxiety?”  

  Defuse misconceptions sequentially. When someone invokes the trolley problem (likely early), agree the *math* is similar but stress the *moral context*: trolleys are freak accidents; your committee makes sustained policy for a community where people know each other. This isn’t about deontology either—concede you’re not banning trade-offs, just questioning *this mode* of trading. Save the rotation argument for mid-session. When it arises, concede it softens the blow but doesn’t dissolve separateness: “Ada loses *now*, Ben gains *later*—but while waiting, is Ada’s loneliness less real because Ben might someday lose too?” Rotation risks making individuals mere placeholders in a collective plan. The deeper challenge is whether *any* system of reciprocal loss makes it ethical to disregard personal integrity when aggregating.  

  Near the end, introduce the “weighting” misconception. Grant that prioritizing the worse-off feels kinder but emphasize: weighting accepts the aggregative framework. The separateness objection asks whether aggregating across persons is valid *at all*, no matter how weighted. Pose your diagnostic question: **“If we could prove the ten-year rotation perfectly balances gains and losses so everyone ends up net positive, does that make it irrelevant how Ada suffered in Year Three?”** Someone who grasps the point will say no—Ada’s experience retains its moral weight independent of the system’s overall efficiency.  

  Openly refuse to settle whether separateness should override aggregation. Your goal is to make the discomfort articulate, not resolved. End by asking them to vote while holding two truths: the math *isn’t* close, and Ada’s loss *isn’t* erased by Ben’s gain. That tension is where ethics lives.  

  ---

  **Key choices in the case:**  
  - *Identifiable individuals*: Makes loss concrete. Statistical people feel like math.  
  - *Concentrated loss vs. diffuse gain*: Highlights distributional injustice; small gains lack moral urgency.  
  - *No death*: Avoids distracting debates about sanctity of life. The hospice link keeps it poignant without being lethal.  
  - *Rotation as complication, not solution*: Forces engagement with the uniqueness of each person’s timeline.  

  **Session flow:**  
  1. **Recall the hospice vote** (5 mins)  
  2. **Introduce Ada and Ben** as human stakes (10 mins)  
  3. **Surface discomfort**—why does Ada’s loss linger? (15 mins)  
  4. **Name "separateness of persons"** as the unease about dissolving individuals into sums (10 mins)  
  5. **Introduce rotation**—does it resolve the worry? (20 mins)  
  6. **Clarify misconceptions** (trolley/weighting) as they arise organically  
  7. **Pose diagnostic question** (5 mins)  
  8. **Vote** (5 mins)  

  **What to refuse:** Whether aggregation is *always* wrong. This session is about seeing the problem, not solving it.
