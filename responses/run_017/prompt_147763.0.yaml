  We are comparing two methods for aggregating expert judgments on a binary choice: 
   (a) All 36 reviewers read the same dossier and vote independently (with simple majority).
   (b) Break into six subpanels of six. Each subpanel deliberates for an hour and reports a verdict (by majority). Then the chair takes a majority of the six verdicts (unweighted or weighted by margin).

   The goal is to determine which method is more likely to pick the better research programme, defined as being at least 1 percentage point more accurate.

   We need to model the accuracy of individual reviewers and the effects of deliberation and correlation.

   Assumptions and parameters:

   1. Individual competence without deliberation: Let p be the probability that an individual reviewer, reading the dossier independently, votes correctly. We assume p > 0.5.

   2. Correlation: In scenario (a), independence is assumed in the classic jury theorem, but in reality, reviewers read the same dossier and may be influenced by common framing. We model this by introducing a correlation coefficient. However, an alternative is to use a model of common signals and private signals.

   3. Effect of deliberation: In (b), each subpanel of 6 deliberates for an hour. This might:
      - Increase the competence of the group's decision beyond what would be expected by simple majority of independent voters (if deliberation leads to sharing of insights and correction of errors).
      - Introduce correlation: because the group decision is not independent of other groups (if the same biases or framing are present) and within the group, the decision is now a joint product.

   4. Structure of the problem: The two alternatives are that one programme is objectively better (we'll call it the correct choice). We are averaging over many panels and questions.

   Steps:

   I will model the two scenarios by decomposing the factors.

   Scenario (a): 36 independent reviewers? Not exactly. They share a dossier so there might be a common source of error. We can model each reviewer as having a signal:

      Signal = common truth + common noise + individual noise.

   But for simplicity, we can use the concept of effective independent signals. If there is correlation, the effective number of independent voters is less than 36.

   Let rho be the correlation between any two reviewers' votes (due to common dossier). Then the variance of the average vote increases, which reduces the effective sample size. 

   However, for binary votes, we can use the model of [1]: the probability that the majority is correct in the presence of correlation. Alternatively, we can use the known result that the effective number of independent voters is n_eff = n / (1 + (n-1)*rho). But note: this is for continuous signals and linear models. For binary votes, we need a different approach.

   Instead, we can use the formula from [2] for the probability of correct majority decision with correlated votes:

      P_{n}(correct) = P( sum_{i=1}^n X_i > n/2 )

   where X_i is the vote of the i-th reviewer (1 if correct, 0 otherwise). The X_i are Bernoulli with mean p and pairwise correlation rho.

   We can compute this using the normal approximation if n is large enough. For n=36, it should be acceptable.

   The mean of the sum is n*p, and the variance is n*p*(1-p) + n*(n-1)*cov(X_i,X_j). The covariance between two votes is:

      cov(X_i, X_j) = E[X_i X_j] - p^2 = P(X_i=1, X_j=1) - p^2.

   Under the equicorrelation model, we have:

      P(X_i=1, X_j=1) = p * [ rho + (1-rho)*p ]   ??? 

   Actually, an alternative is to use the model where there is a common factor. Let:

      X_i = I{ common_factor + individual_noise_i > threshold }

   But we can avoid that by directly modeling the correlation.

   For Bernoulli variables with equal pairwise correlation rho, the variance of the sum is:

      Var(sum X_i) = n * p * (1-p) + n*(n-1) * [ E[X_i X_j] - p^2 ]

   and E[X_i X_j] = P(X_i=1, X_j=1) = p * (p + rho*(1-p))   ??? 

   Actually, the pairwise joint probability can be expressed as:

      P(X_i=1, X_j=1) = p^2 + rho * p*(1-p)

   so that the covariance is rho * p*(1-p). Then:

      Var(sum X_i) = n p (1-p) + n(n-1) * rho * p (1-p)
                   = n p (1-p) [1 + (n-1) rho]

   Then the standard deviation is sqrt( n p (1-p) (1 + (n-1) rho) ).

   Then we can approximate the probability of correct majority by:

      P( sum X_i >= 18.5 )   [if 36 voters, majority is at least 19]

      = 1 - Phi( (18.5 - n*p) / sqrt( n p (1-p) (1 + (n-1) rho) ) )

   But note: we are using a continuity correction. Alternatively, we can use 19 as the cutoff.

   However, this normal approximation might be poor if the correlation is high. We'll proceed with caution.

