prompt: |-
  I'm in the second year of a PhD in evolutionary biology, and this term I'm running the graduate seminar in which every discussion of a trait collapses into the same stalemate: half the room wants to know what the trait is for, the other half wants to know why it is there, and everyone slides between the two without noticing. Before I assign any more of the classic adaptationism debate — the spandrels critique, the exaptation literature, optimality modelling, the comparative method — I want a specification of what an adequate answer to the question "why does this population have this trait?" would actually have to deliver, on either side of the dispute. So please write me the desiderata: what a claim that a trait is an adaptation must establish, and, symmetrically, what a claim that it is a structural byproduct, a developmental constraint, a co-opted relic, or drift must establish, with the case or consideration that motivates each requirement. Include the distinctions a theory in this area is not allowed to collapse — current utility versus historical origin, the trait now having an effect versus having been selected for it, selection maintaining a variant versus selection having built it — and say whether an adequate account may return a mixed verdict or must pick one. I also want a criterion about how traits get individuated in the first place, since in my material it is often unclear whether we are looking at one trait or three. Mark which requirements are non-negotiable and which are really methodological preferences of one camp, tell me which single requirement excludes the most candidate explanations, and flag any pair you suspect cannot be jointly satisfied — that is the part I most want, since I suspect the list is asking for demonstration-grade evidence from every trait while also wanting a programme general enough to be worth running.

  To keep this from being an exercise in recall, apply the criteria to a case I've constructed rather than the three textbook examples my students always reach for. A lineage of alpine skinks has a bony supraorbital crest in four of eleven populations; the four are exactly the populations that overlap a visually hunting bird, clay models with the crest are attacked less often than shaved models, and a genome scan shows a recent sweep in the crest region. Against this: five years of mark–recapture finds no survivorship difference between crested and crestless individuals, the crest forms as a mechanical consequence of a shifted jaw-adductor attachment that does improve bite performance, and in the sister genus the same outgrowth serves in burrowing. Each desideratum should say how this case fares under it, and the list should end by naming the single further observation that would do most to settle it. Then, briefly, say whether a trait whose shape matches an engineering optimum to within a few percent but which is invariant across forty species can ever satisfy the list — where the only comparison available is the engineering model itself. Keep any scorecard of the named positions to a few lines; the criteria and their motivating cases are what I need.
reasoning: |-
  Okay, the user is a second-year PhD student in evolutionary biology running a graduate seminar. They're facing a recurring stalemate in discussions where half the class focuses on what a trait is for (current utility) and the other half on why it's there (historical origin). They want a clear set of criteria to evaluate both adaptationist and non-adaptationist explanations for traits, applied to a novel case study they've created about alpine skinks with a bony supraorbital crest. 

  Hmm, this is a sophisticated request. The user clearly understands the classic literature (spandrels, exaptation, etc.) but wants to move beyond textbook debates. Their constructed skink example is clever - it has conflicting lines of evidence deliberately designed to pit adaptation against non-adaptation hypotheses. 

  The core tension they identify is fundamental: evolutionary biology struggles with the duality between current function and historical contingency. Their hidden request seems to be for a framework that doesn't force false dichotomies but maintains crucial distinctions. They're also rightly concerned about trait individuation - a chronically underspecified problem in these debates.

  I should note their meta-comment about potentially incompatible desiderata. That's astute - we often demand both rigorous evidence (which is rare) and general applicability. The skink case perfectly illustrates this: we have a recent selective sweep but no current fitness difference, mechanical constraint evidence but clear predation reduction in models. 

  For the framework, I'll need to:
  First, establish non-negotiable distinctions (like current utility vs. historical origin) that prevent the conceptual sliding they observe. These must be ironclad. 
  Then outline what each camp must prove, making clear where methodological preferences (like optimality modeling) enter. 
  The trait individuation criterion deserves special attention - perhaps borrowing from homology/discontinuity concepts.
  For the skinks, each criterion must yield specific verdicts - the predation test, the developmental mechanics, the sister genus comparison all matter differently for different requirements.
  That final question about invariant optimal traits is devilish - it cuts to the heart of whether we can infer history from current state alone. The answer should probably be "no" but with nuance about constraint hypotheses.

  The user's clearly frustrated with superficial debates. My response should give them concrete tools to dissect arguments in seminar while acknowledging the field's genuine philosophical tensions. That skink example will be perfect for forcing students to engage the criteria rather than rehash old positions.
answer: |-
  Below is a structured framework for evaluating "why a population has a trait," with **non-negotiable criteria** in **bold**, *methodological preferences* in *italics*, and applications to your skink case. The framework distinguishes adaptationist accounts (A) from non-adaptationist alternatives (N: structural byproduct, constraint, exaptation, drift).

  ---

  ### **Core Distinctions (Non-Negotiable)**  
  1. **Current Utility vs. Historical Origin**:  
     - **Must not conflate what a trait *does now* with how it *arose***.  
     - *Motivation*: Gould & Vrba’s "exaptation" (e.g., bird feathers for insulation co-opted for flight).  
     - *Skink case*: Crest *currently* deters predators, but may have originated via jaw mechanics.  

  2. **Effect vs. Selection-for**:  
     - **Must establish that selection *acted on the specific trait variant* for its current effect** (not just correlation).  
     - *Motivation*: Sober’s "selection-for" (e.g., peppered moths: melanism selected *for* camouflage).  
     - *Skink case*: Predator deterrence is an *effect*; was it *selected-for*? Genome scan suggests yes, but no survivorship difference weakens this.  

  3. **Maintenance vs. Construction**:  
     - **Distinguish selection *maintaining* a trait from selection *building* it incrementally**.  
     - *Motivation*: "Spandrels" (e.g., snail coiling direction maintained but not built by selection).  
     - *Skink case*: Sweep implies *construction*, but bite performance link suggests maintenance via jaw function.  

  ---

  ### **Desiderata for Adaptation Claims (A)**  
  An adaptationist account must establish:  
  1. **Fitness Advantage**:  
     - **Demonstrate that the trait variant confers higher fitness *in the relevant environment***.  
     - *Skink*: Clay models show advantage, but mark-recapture finds no difference → **fails**.  
  2. **Selective History**:  
     - **Evidence that selection *shaped* the trait (e.g., comparative correlation, sweep signals, optimality)**.  
     - *Skink*: Genome sweep supports this; predator overlap correlates → **partially satisfies**.  
  3. *Adaptive Specificity*:  
     - *Preference*: Trait matches an optimal design for proposed function.  
     - *Skink*: Crest deters predators, but no evidence it’s *optimized* for this → **weak**.  

  ---

  ### **Desiderata for Non-Adaptationist Claims (N)**  
  Accounts (structural, constraint, exaptation, drift) must establish:  
  1. **Non-Selective Origin**:  
     - **Evidence that the trait arose without selection *for its current form/function*** (e.g., developmental constraint, drift).  
     - *Skink*: Crest as byproduct of jaw attachment → **supported by developmental mechanics**.  
  2. **Current Utility ≠ Cause**:  
     - **Show current utility is incidental (exaptation) or absent (drift)**.  
     - *Skink*: Crest *now* deters predators, but sister genus uses it for burrowing → **exaptation plausible**.  
  3. *Constraint Mechanism*:  
     - *Preference*: Identify the physical/developmental cause (e.g., allometry, pleiotropy).  
     - *Skink*: Jaw-adductor shift explains crest → **satisfied**.  

  ---

  ### **Trait Individuation (Non-Negotiable)**  
  - **A trait must be defined by *functional or structural discontinuity*** (e.g., modularity, dissociability).  
  - *Motivation*: Without this, "trait" boundaries are arbitrary (e.g., is "wing" one trait or many?).  
  - *Skink*: Is the crest a distinct module or fused to jaw system? **Unclear**—if developmentally integrated, it may not be "for" predation.  

  ---

  ### **Mixed Verdicts & Tensions**  
  - **Mixed verdicts are often necessary** (e.g., exapted with subsequent adaptation).  
  - **Key tension**: *Adaptive Specificity* (A) vs. *Non-Selective Origin* (N) **cannot both be fully satisfied**—optimal design implies selective refinement.  
  - **Most exclusionary requirement**: **Fitness Advantage** (A) — hardest to demonstrate empirically (e.g., mark-recapture often fails).  

  ---

  ### **Skink Case Scorecard**  
  | **Requirement**       | **Adaptation (A)** | **Non-Adaptation (N)** |  
  |------------------------|--------------------|------------------------|  
  | Current utility        | Supported (predation) | Supported (exaptation) |  
  | Selective history      | Partial (sweep)    | Supported (jaw constraint) |  
  | Fitness advantage      | **Fails**          | N/A                    |  
  | Non-selective origin   | N/A                | **Supported**          |  
  | Trait individuation    | **Unclear**        | **Unclear**            |  

  **Most decisive further observation**:  
  - **Developmental dissociability test**: If crest development can be experimentally decoupled from jaw attachment *without fitness cost*, it supports adaptation for predation. If not, it’s a constraint.  

  ---

  ### **Invariant Optimal Shape Case**  
  - **Cannot satisfy adaptation criteria alone**.  
  - **Why**: No variation = no selection signature. It may be:  
    (a) An ancient adaptation now constrained (*frozen optimum*),  
    (b) A physical/developmental necessity (*constraint*), or  
    (c) Optimized by selection but maintained by other forces.  
  - **Requires evidence beyond optimality**:  
    - Phylogenetic test: Did the trait evolve *coincident* with selective pressure?  
    - Developmental test: Is variation possible? If not, constraint.  

  ---

  ### Summary for Your Seminar  
  - **Non-negotiable distinctions**: Current utility/origin, selection-for/effect, maintenance/construction, trait individuation.  
  - **Adaptationism’s burden**: Fitness advantage + selective history.  
  - **Non-adaptation’s burden**: Non-selective origin + decoupling of utility from cause.  
  - **Reality check**: Mixed explanations dominate; evidence (e.g., fitness assays) is often impractical. Use this framework to force specificity in arguments—*what evidence would resolve this?* The skink case shows why both camps are partially right/wrong.  

  This framework excludes just-so stories by demanding mechanistic *and* historical evidence, while accepting that traits often have layered evolutionary histories.
