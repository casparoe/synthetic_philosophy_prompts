prompt: |-
  I maintain the backend for an open history reference project — volunteer work, on the side of a normal engineering job — and I've inherited the job of rewriting the rule our editors use to decide whether a claim gets tagged as fringe. The tag matters more than it sounds: it changes where the article ranks in search, and our corpus gets pulled into retrieval and fine-tuning pipelines, so a bad rule doesn't just mislabel a page, it launders nonsense into other people's systems. I have no philosophy training, and the arguments on our mailing list have convinced me that the disagreements are almost never about the evidence for Atlantis or ancient-astronaut explanations of monumental architecture or Fomenko's rebuild of the whole chronology; they are about what sort of thing a demarcation rule is even supposed to be. So before I let the list argue further I want a specification, and I want it written for a fixed purpose: the rule has to be applicable by a generalist editor, working from an article and whatever is linked from it, without resolving the underlying historical question and without specialist consultation. Both errors cost something real — tagging a responsible-but-heterodox hypothesis suppresses work that might be right, and failing to tag a confident fabrication gives it our house style — so please keep that purpose in view when you decide what counts as a requirement.

  What I want is the requirements list: the cases any adequate rule has to get right, the distinctions it must not collapse, the results from how historical inquiry actually works that it can't contradict, and the reason behind each. The distinctions I keep tripping over, to get you started but please don't limit yourself to them: false-but-ordinary-error versus pseudohistory; a heterodox hypothesis argued inside the discipline versus one argued from outside it; a bad method that landed on a true date versus a good method that landed on a false one; a claim that is protected by cheap auxiliary hypotheses every time it is pressed versus one that is genuinely untestable in principle; and tagging a whole research program versus saying whether anything inside it is still worth crediting — the salvage case, where someone chasing a lost continent nonetheless produces the only careful survey of a site anyone has. Flag for each requirement whether it is non-negotiable or a prejudice of one camp; I strongly suspect some of the things people demand are just preferences wearing argumentative clothing, and in particular I want your view on three candidates: that the rule must be decidable by a non-specialist in an afternoon, that it must track evidence rather than who believes what, and that political or nation-building utility counts as a marker at all. If some subset of the requirements can't be jointly satisfied — say, decidability by a generalist, sensitivity to real evidence, and symmetry between insiders and outsiders — say so explicitly and show me the conflict; that is the part I most want to see. And tell me which single requirement knocks out the most candidate rules.

  Three rules have been proposed on the list and I'd rather you judged them as candidate requirements than as theories, since I can't tell which is which. Priya's Double-Standard Test: build the mirror case, with the same evidence structure but believed by the right people, and if your rule stops firing it was only ever sociology. Marcus's Vindication Condition: there must be a specifiable set of observations that would get a tagged claim untagged, and it must not be empty. Sam's Replacement Rule: a claim counts as fringe only when it discards an established finding while offering no account of why the accepted evidence looks the way it does. Test them, and the requirements generally, against a case I made up for the purpose: a set of dressed stone terraces on an inland hillside, dated by mainstream archaeology to the first millennium BCE from pottery in the upper layers, which a group instead attributes to a seafaring culture two thousand years earlier, on the grounds that the tool marks on the lower courses look like metal tools; that the deep radiocarbon samples came back too old and were discarded as groundwater contamination; that a local flood epic mentions stone steps to the water at that spot; that no settlement of the right date exists nearby, which they read as evidence the builders came from elsewhere; and that the heritage ministry has refused permission to re-date, which they present as suppression. Every rule I try either flags it for reasons that would also flag a contested ordinary dig, or bogs down on the contamination question, which neither I nor the rule is competent to settle. Please don't give me citations, a reading list, or a survey of the literature — I can't chase references and neither can the system I'll run this on, so argue from the cases themselves. If one of these three is just a restatement of something with a name in the philosophy of science, tell me in one line and move on; keep any scoring of existing proposals to a few lines, because the criteria are the deliverable.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're maintaining the backend for an open history reference project and need to rewrite a rule for tagging fringe claims. The key issue is that the current debates among editors aren't about evidence but about what a demarcation rule should even be. The user wants a specification that's practical for generalist editors to apply without resolving the underlying history or consulting specialists. 

  First, I need to identify the core requirements. The user mentioned several distinctions: false but ordinary error vs. pseudohistory, heterodox internal vs. external hypotheses, bad method with true result vs. good method with false result, protected by auxiliary hypotheses vs. genuinely untestable, and tagging entire programs vs. salvageable contributions. Each of these needs to translate into a requirement that avoids collapsing important differences.

  The user also flagged three candidate preferences: decidable by non-specialists quickly, evidence-based rather than consensus-driven, and considering political utility as a marker. I should assess which of these are essential and which might be optional or conflicting. For instance, requiring quick decisions might conflict with deep evidence analysis. 

  Looking at the proposed rules—Priya's Double-Standard Test, Marcus's Vindication Condition, Sam's Replacement Rule—I need to evaluate them against the requirements. The test case with the stone terraces is crucial. A good rule should tag this as fringe without getting bogged down in technical details like groundwater contamination, which a generalist can't resolve.

  The user emphasized that errors in either direction have real costs. Tagging legitimate heterodox work suppresses potential truth, while missing fabrication lends credibility. So the rule must balance sensitivity and specificity. The challenge is creating a rule that’s both practical and principled, avoiding philosophical debates but grounded in sound demarcation criteria.

  Next, I should outline non-negotiable requirements. The rule must avoid resolving historical questions, rely only on linked sources, and be applicable by generalists. It must distinguish fringe from legitimate dissent using methodological markers rather than content. For example, the misuse of evidence, like discarding radiocarbon dates without valid reasons, is a red flag. Also, the rule should handle the salvage case where a fringe program produces valid data.

  Conflicts between requirements are inevitable. For example, requiring sensitivity to evidence might necessitate technical knowledge that generalists lack. The user needs to know where trade-offs lie. The most critical requirement is probably the methodological markers, as it knocks out rules based solely on consensus or believability.

  For the test case, the terraces claim should be tagged fringe because it discards established dating without accounting for the existing evidence (pottery layers) and uses ad hoc explanations (groundwater contamination). Sam's Replacement Rule captures this, but Marcus's Vindication Condition might be too broad. Priya's test highlights if the rule is biased, ensuring it's not just sociological.

  Finally, the political utility marker is a preference, not a requirement. Including it could introduce bias, so it's better left out. Decidability in an afternoon is necessary for practicality but might limit depth. Evidence-based focus is non-negotiable to avoid consensus-driven tagging. The key is a rule centered on how claims handle evidence methodologically, which balances the need for accuracy and practicality.
answer: |-
  Here’s a requirements specification for your fringe-tagging rule, designed for practical application by generalist editors, with conflicts and trade-offs explicitly highlighted. The core principle: **Focus on methodological markers, not historical truth or consensus.**

  ### Non-Negotiable Requirements (Must-Have)
  1.  **Methodological Transparency Requirement:** The rule must flag claims based on *how they handle evidence*, not the claim’s content or the identity of proponents. *Why:* Avoids editors judging history itself. Distinguishes heterodox internal scholarship (uses standard methods, engages with counter-evidence) from pseudohistory (misrepresents, ignores, or invents evidence). *Knocks out rules based solely on "who believes it" or "how weird it sounds."*
  2.  **Evidence Accountability Requirement:** The rule must identify claims that systematically evade accountability to established evidence or methods *without justification within the framework of historical inquiry*. *Why:* Separates ordinary error (method applied, result was wrong) from pseudohistory (method discarded/ignored when inconvenient). Handles "good method, false result" (still accountable) vs. "bad method, true result" (accident, still fringe). *Crucial for distinguishing legitimate revisionism from fabrication.*
  3.  **Ad-Hoc Hypothesis Constraint:** The rule must flag claims that rely on unfalsifiable or *persistently* ad-hoc auxiliary hypotheses to explain away counter-evidence, especially when these are invoked *instead of* engaging with the core methodological challenge. *Why:* Distinguishes testable (if unorthodox) hypotheses from untestable/non-self-correcting ones. Addresses "protected by cheap auxiliaries." *Must avoid tagging hypotheses simply for being improbable.*
  4.  **Salvageability Requirement:** The rule must allow tagging *specific claims* as fringe without necessarily dismissing *all* associated data or peripheral observations presented by the same source/program. *Why:* Enables acknowledging valid contributions (e.g., the careful survey) while flagging the core fringe claim (e.g., the lost continent origin). Prevents throwing the baby out with the bathwater.
  5.  **Operational Feasibility Requirement:** The rule must be applicable by a generalist editor using *only* the article text and its linked sources, *without* requiring resolution of the underlying historical facts, specialist consultation, or complex technical judgments beyond basic research literacy. *Why:* Matches your operational reality. Forces the rule to rely on observable argumentative patterns, not deep expertise.

  ### Contextual Requirements (Important, But Possibly Negotiable/Weighted)
  6.  **Source Provenance Distinction:** The rule *should* consider whether arguments originate from within the relevant academic discipline(s) using its norms, or are primarily argued from an external/non-disciplinary framework *as a marker*. *Why:* External origin often correlates with methodological violations (Req 1 & 2). *However:* Not definitive (insiders can go fringe, outsiders can make valid critiques). Mark it as a *potential* indicator, not a requirement. *(Preference leaning towards non-negotiable, but can be overridden by Req 1-3)*.
  7.  **Decidability Constraint (Time):** The rule *should* ideally allow a decision within a reasonable timeframe (e.g., an editor's afternoon). *Why:* Practical necessity. *Conflict Alert:* Deeply conflicts with **Evidence Accountability (Req 2)** if accountability requires *verifying* complex evidence chains. *Resolution:* Req 2 must be satisfied by identifying *patterns of argument* (ignoring evidence, misrepresenting sources) visible to a careful reader, not *proving* evidence wrong. Req 5 enforces this.
  8.  **Political Utility Marker:** Political/nation-building utility *should not* be a primary marker for the fringe tag. *Why:* Highly subjective, easily misapplied by generalists, risks suppressing legitimate critical scholarship on national narratives. Focus remains on methodology (Req 1). *(Preference: Exclude it as a requirement or even a strong marker).*

  ### Conflicts & Trade-offs
  *   **The Core Tension: Evidence Depth vs. Generalist Feasibility (Req 2/3 vs. Req 5/7):** You cannot require the editor to *judge the validity* of technical evidence (e.g., was the radiocarbon discard *really* justified? Is the tool mark analysis sound?). **Resolution:** The rule must focus on *how the claim's proponents argue*: Do they *acknowledge* counter-evidence and mainstream justifications? Do they offer *reasons for rejection* consistent with methodological norms, or purely self-serving/ad-hoc ones? Do they *misrepresent* sources? The editor judges the *argumentative behavior*, not the geology or chemistry.
  *   **"Who Believes What" vs. Methodological Focus (Req 1):** Tracking "belief" seems easier but violates Req 1 and is easily gamed/manipulated. The rule *must* avoid consensus as a primary marker, though disciplinary context (Req 6) can be a secondary signal.

  ### Analysis of Proposed Rules Against Requirements & Test Case
  *   **Priya's Double-Standard Test:**
      *   *Strength:* Directly addresses **sociological bias (supports Req 1)**, helps expose rules relying on "wrong people." Excellent sanity check.
      *   *Weakness:* Not a *primary* rule. Doesn't define *what* to swap (people? evidence structure?). Doesn't directly address methodology (Req 2/3) or salvage (Req 4). Fails the test case: A mirror claim ("mainstream" discarding pottery evidence because "it must be later fill") would *also* look bad! This shows the terraces claim *is* fringe because *anyone* arguing this way looks bad.
  *   **Marcus's Vindication Condition:**
      *   *Strength:* Captures **testability and evidence accountability (Req 2/3)**. Core to demarcation (Popperian Falsifiability).
      *   *Weakness:* Too broad. Many legitimate but poorly supported claims *are* falsifiable but not *yet* falsified. Doesn't address *how* evidence is handled *now* (Req 1). Test case: Proponents *might* say vindication = "finding metal tools of that date elsewhere" or "proving groundwater didn't contaminate." This meets the condition, but the claim might still be fringe *now* due to methodology. Needs pairing.
  *   **Sam's Replacement Rule:**
      *   *Strength:* Best at **Evidence Accountability (Req 2)** and **Ad-Hoc Hypotheses (Req 3)**. Directly targets the core failure mode: ignoring/discarding established evidence without adequate account. Handles salvage (Req 4) naturally (the survey isn't *replacing* anything). Strongest on methodology (Req 1).
      *   *Weakness:* Needs slight refinement. "Established finding" must be based on standard methods. "Offering no account" should mean "no account *accepted within standard methodological frameworks*" or "account relies on Req 3 (ad-hoc excuses)". Test case: **Perfect Fit.** It discards pottery dating (established via standard stratigraphy) and radiocarbon (established physics). Its "accounts" are classic ad-hoc excuses: contamination (without proof), suppression (sociology, not method), "must be outsiders" (assumption). Ignores *why* the pottery is there if the site is 2000 years older. **Flags correctly.**

  ### Recommendation & The Single Most Important Requirement
  **Sam's Replacement Rule, refined, comes closest to satisfying the non-negotiables, especially when combined with Priya's Test as a check.** Refine it: "A claim counts as fringe if it rejects an interpretation based on established historical/archaeological methods *without providing a counter-interpretation that coherently addresses the existing evidence within a framework of standard methodological critique*, and instead relies on dismissing evidence as invalid/irrelevant via unexplained or persistently ad-hoc means."

  **The single requirement that knocks out the most candidate rules is the Methodological Transparency Requirement (Req 1).** Rules relying on consensus, believability, proponent identity, or political utility fail instantly. It forces the focus onto *how the argument is made*, which is what the editor can actually assess.

  **Applying to Your Test Case (Terraces):**
  *   **Replacement Rule (+ Refinement):** Tags as fringe. Rejects pottery dating (established stratigraphy) and valid radiocarbon dates (established physics). "Accounts" are ad-hoc (contamination w/o proof, suppression, "must be outsiders") and don't coherently address *why* the pottery is present in the upper layers if the site is 2000 years older and built by seafarers. The flood epic is used opportunistically, not integrated methodologically.
  *   **Why it Works for a Generalist:** The editor doesn't need to *know* if groundwater contamination is likely. They see: 1) Standard evidence (pottery stratigraphy, radiocarbon) is discarded. 2) The reasons given ("contamination", "suppression") are asserted without evidence *and* fail to explain the *presence* of the contradicting evidence (the pottery layers). 3) Alternative explanations (local settlement patterns) are speculative and dismissive. The *pattern of argument* violates methodological norms (Req 1, 2, 3). Priya's Test confirms: If a mainstream scholar dismissed carbon dates this way for a site they disliked, we'd cry foul. Marcus's Condition is met (finding uncontaminated samples *might* vindicate), but the *current* methodology is still fringe.
