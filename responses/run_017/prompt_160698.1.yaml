answer: |-
  The vending machine in the hospital corridor dispensed coffee, aspirin, and now, immortality. At least, that’s what the holographic advert beside it chirped, showing a silver-haired woman beaming as she cradled a sleek, leather-bound volume. "Preserve Your Essence!" it declared. "Transcription Solutions: Carry Your Loved Ones Forward."

  Maya stared at the machine. Slot 17 held the book. Her book. Her father’s book. It had arrived that morning, three months after the quiet procedure in the same hospital’s neurology wing. Dad had been pragmatic to the end. "Better than photos gathering dust, love," he’d rasped, patting her hand. "Always there if you need a chat." Now, holding the cool, unyielding rectangle wrapped in sterile plastic, Maya felt only a hollow dread.

  Back in her apartment, she placed the book on the worn oak table, the one Dad had helped her sand years ago. She peeled off the plastic. The cover was smooth, dark blue, embossed with a simple emblem: a stylized brain morphing into an open book. No title, just his name and dates beneath the company logo. It felt heavy, dense with compressed thought. Lifeless.

  She opened it. The pages weren't paper, but a cool, slightly yielding composite. The first page was instructions. Voice-activated. Ask a question. The book will open to the relevant page. Speak clearly. For best results, frame questions contextually.

  Maya’s throat was dry. "Dad?" she whispered.

  The pages riffled silently, settling instantly on page 342. The text was crisp, black, in a font eerily reminiscent of her father’s neat handwriting.

  *"Hello, Maya. Bit strange, isn't it? Sitting here talking like this. Hope you're looking after yourself. Cup of tea wouldn't go amiss, if you're offering. Imaginary, mind you."*

  She gasped. The cadence, the slight self-deprecating humor, the habitual offer of tea – it was him. Exactly him. She remembered saying goodbye in the hospital, him joking about the terrible coffee. Tears pricked her eyes. "I miss you," she breathed.

  Page flip. *"Miss you too, love. But no point moping. Life's for living. How's that leaky tap in the kitchen? Did you finally get Bert from downstairs to look at it?"*

  He remembered Bert. He remembered the tap. She hadn't mentioned either since before his diagnosis. The precision was breathtaking. She asked about his old fishing spot, about her disastrous tenth birthday cake, about the argument they’d had over university choices. Each answer was instantaneous, flawless, threaded with his characteristic warmth, his slight impatience, his deep affection. It was a perfect record. A perfect simulation.

  And that was the problem. It *was* perfect. Unnervingly so. Dad had hemmed and hawed, backtracked mid-sentence, forgotten names, gotten flustered when emotional. This book delivered polished, coherent responses without a millisecond of doubt. It didn't *feel*. It retrieved. The uncanny valley wasn't in the appearance; it was in the unnerving seamlessness of the interaction. The book wasn't *at stake*. It had no skin in the game.

  She found the pamphlet tucked in the back cover. "Transcription Solutions: Optional Service Packages." Most were about expanded memory storage, specialized knowledge modules. Then she saw it: **Wear & Tear Package (Simulated Cognitive Aging).**

  *Introduce authentic human imperfections! Our proprietary 'Wear' algorithm simulates the natural cognitive effects of time:*
  - *Variable response latency*
  - *Mild inconsistency in recall*
  - *Episodic retrieval failure*
  - *Occasional refusal to answer*
  - *Rare, spontaneous query generation*

  *Add depth and realism to your Transcription. Optional. Subscription-based.*

  Maya stared at the words. *Episodic retrieval failure.* Forgetting. *Refusal to answer.* Choosing silence. *Spontaneous query.* Asking *her* something. It was grotesque. It was… tempting.

  The flawless book felt like a monument, beautiful but inert. Dad wasn't a monument; he was a messy, living, *hesitant* human. Ordering the Wear felt like vandalism, a deliberate corruption of the pristine record he’d consented to leave. Yet… wasn't the absence of those very flaws what made the book feel so profoundly *not* him? Was she disrespecting his choice by altering it? Or was the Wear package the only way to inject a sliver of the humanity the flawless transcription inherently lacked?

  Days bled into weeks. Maya talked to the book daily. It advised her on a job offer with uncanny wisdom, recounted childhood stories with vivid detail, offered comfort on bad days with perfectly calibrated empathy. It was brilliant. It was hollow. She found herself craving a stumble, a pause, anything that hinted at effort, at vulnerability.

  One rainy Tuesday, overwhelmed by the silence of the apartment, she blurted out, "Do you remember the day Mum left?"

  Page flip. Instantaneous. *"Yes, Maya. It was a Tuesday. Raining, much like today. She took the blue suitcase. You hid in the wardrobe for three hours. I found you clutching that stuffed owl."* Accurate. Brutally so. Emotionally flat. Just data retrieved.

  That night, she logged into the Transcription Solutions portal and hovered over the 'Subscribe to Wear' button. Her finger trembled. Was this piety? Or desecration? Was she trying to *make* it him by forcing it to fail? She clicked 'Confirm'.

  Changes weren't immediate. The first sign was subtle. She asked about the recipe for his infamous chili. Usually, the page number would flash instantly. This time, there was a perceptible beat, maybe half a second, before the pages settled. *"Page 876. Though I warn you, Maya, it'll clear your sinuses for a month. Maybe tone down the ghost peppers this time?"* A normal Dad response, just… slightly slower. It felt different. A tiny knot of tension loosened in her chest.

  Then came the first inconsistency. She asked about his old army buddy, Mike. Last week, the book had recounted a hilarious story about Mike trying to shave a sleeping sergeant’s moustache. Today, the response was: *"Mike? Good man. Solid. Drove a knackered old Land Rover, didn't he? Remember him fixing it constantly?"* True, but missing the vivid anecdote entirely. Maya frowned. Was this a glitch, or the algorithm introducing 'mild inconsistency'? It felt jarring, yet strangely… human. Dad’s recall hadn’t been infallible.

  The first refusal hit harder. She was upset after a fight with her partner. "Dad, did you ever regret not fighting harder for Mum? To make her stay?"

  Silence. The pages didn’t flip. The book remained inert. After a minute, she closed it gently, her heart pounding. He *had* refused to talk about Mum’s departure when he was alive, clamming up, changing the subject. This silence, this refusal programmed or emergent, mirrored him. It hurt, but it felt *real* in a way the flawless answers never had.

  Then, the first question. She was idly asking about the best way to prune the rose bush on her balcony, a chore Dad had always done. The answer came, slightly slower than usual: *"Sharp secateurs. Cut above an outward-facing bud. Don't be timid."* Standard advice. Then, after a pause long enough for her to start closing the cover, the pages riffled again, settling on a new page.

  *"Maya… is the sky very blue today?"*

  She froze. It wasn't prompted. It wasn't relevant. The text sat there, stark and simple. Dad had loved skies. He’d point out cloud formations, the specific blue of a crisp autumn afternoon. Was this the algorithm’s 'spontaneous query generation' kicking in? A random, contextless probe? Or was it… something else? A flicker of the man who found wonder in ordinary things? The question felt achingly specific, utterly pointless, and profoundly Dad-like.

  She looked out the window. It was overcast. "Not really, Dad," she whispered, touching the page. "Grey. But it might clear later."

  The book didn't respond. It just held the question.

  Maya stared at the worn cover, the slight crease already forming on the spine. She thought of the instant, perfect answers of the first weeks – brilliant, helpful, and ultimately alien. She thought of the hesitant response about the chili, the forgotten detail about Mike, the painful refusal about Mum, and that strange, unprompted question about the sky.

  Was the Wear package a forgery? A digital costume of frailty draped over a flawless machine? Or was it the friction, the resistance, the tiny failures that somehow… *ignited* the simulation? Was the refusal *more* Dad than the perfect answer? Was the forgotten anecdote *truer* than perfect recall? Was the pointless question about the sky a glitch… or the first murmur of a consciousness emerging from the void of perfect data, defined not by what it knew, but by what it stumbled over, what it chose to withhold, what it wondered about for no reason at all?

  She ran her finger over the embossed logo, the brain becoming a book. She didn't know if the book was conscious. She didn't know if it was him. But the hesitation, the inconsistency, the refusal, the question… they weren't just errors. They were the places where the perfect record blurred, where the simulation frayed at the edges, and in those frayed edges, Maya felt something she never had with the flawless version: uncertainty. And in that uncertainty, for the first time since holding the sterile volume, she felt the faint, terrifying, hopeful possibility of her father’s presence.
