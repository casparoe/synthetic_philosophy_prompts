prompt: |-
  Dear Andrew,

  I wonder if I might ask you to help me with a passage. I know you have retired from teaching, and I would not impose except that I have run out of people to ask.

  Since my wife's diagnosis two years ago — early-onset Alzheimer's, she is sixty-three — I have been her full-time carer, and last spring I joined a local Stoicism group on the suggestion of a friend from the hospital support group. It has helped me more than I expected. But I have become stuck on the text they hand out, and the group's discussions have not unstuck me, because everything there is pitched at the level of consolation rather than argument.

  The passage is the opening section of Epictetus's *Enchiridion*, in an old translation I was given as a photocopy (no title page, so I cannot tell you whose):

  1. Some things are in our control and others not. Things in our control are opinion, pursuit, desire, aversion, and, in a word, whatever are our own actions. Things not in our control are body, property, reputation, command, and, in one word, whatever are not our own actions.

  The things in our control are by nature free, unrestrained, unhindered; but those not in our control are weak, slavish, restrained, belonging to others. Remember, then, that if you suppose that things which are slavish by nature are also free, and that what belongs to others is your own, then you will be hindered. You will lament, you will be disturbed, and you will find fault both with gods and men. But if you suppose that only to be your own which is your own, and what belongs to others such as it really is, then no one will ever compel you or restrain you. Further, you will find fault with no one or accuse no one. You will do nothing against your will. No one will hurt you, you will have no enemies, and you not be harmed.

  My difficulty is not that I fail to grasp what the dichotomy of control is supposed to be. I have read the modern books the group circulates, and I have sat through the diagram of concentric circles; I understand the slogan well enough to have tried to live by it. My difficulty is that I cannot tell what kind of claim the classification is, and the difference matters enormously to me at the moment.

  I spent forty years in structural engineering, and in that world control is a causal notion with tolerances attached: a variable is under control when your intervention reliably produces a specified effect within a stated margin. Read that way, the items on the first list look like the least controllable things about me. I cannot, by deciding, stop wanting her to be as she was; I cannot switch off aversion to the way an evening is going. Whereas the items on the second list are precisely the things I *do* have causal leverage over — whether she is fed, whether the house is safe, whether the agency sends someone competent. So on my professional understanding of the word, the two lists look close to inverted.

  I can think of three other things *our own* might mean, and I cannot decide among them. It might mean *produced by me and by nothing else*. It might mean *such that nothing outside me can compel or block it* — the claim being that my assent is, as it were, the one thing in the universe no one else can get a grip on. Or it might mean *constitutive of me, in the sense that it is what I can properly be credited or blamed for*, so that what belongs to others is whatever is allotted by someone else's will and therefore not mine to answer for. These give very different readings of the phrase *slavish by nature* and of the promise that no one will ever compel or restrain you, and I would like to know which one the argument actually needs — that is, which reading makes the inference from *it belongs to others* to *you will be hindered and will lament* go through.

  There is a second thing I cannot settle. Is the classification meant to sort *items* into two boxes, or to sort *aspects* of any single undertaking? I have started to think it must be the latter. Whether she has a calm night is not fully in my control and not fully outside it: it depends on the disease, and it depends on what I do. Some of the modern Stoics in the group have responded to this by adding a third category of things that are only partly up to us, but that strikes me as a muddle, because *partly* is not a third kind of thing — it is a reminder that any outcome has the aspect that is mine and the aspect that is not. What I cannot see is whether the aspectual reading still earns the payoff the passage promises, or whether it quietly converts that promise from a causal guarantee into something merely evaluative.

  A third worry sits behind both. The same tradition says that everything is fated and that the world is a single ordered whole, and one member of the group used the old image of a cylinder that rolls in its own way only because of its own shape, however it is pushed. I take the point, but I cannot see how it leaves room for anything to be *up to* anyone, unless *up to us* was never about causal leverage in the first place — which brings me back to the first question.

  And there is a practical version of all this. I have been told about the practice of pursuing one's aims with a reservation, as though one mentally added that fate may prevent them. If that is right, then caring as hard as I am able about an outcome is compatible with the discipline; if the discipline instead requires me to regard the outcome as nothing to me, then it asks something of me that I think is wrong — I do not want to become a man who is serene about whether his wife is frightened.

  Could you write me a page explaining which of these readings the passage supports, and why the others fail? Please do not send me a bibliography or point me at commentaries: I am at home almost every hour of the day and I have no library access, so all I can use is reasoning from the text and from what you know. I last did philosophy as an undergraduate, so I would be grateful if you argued the steps out rather than naming positions at me and assuming I can fill them in.

  With thanks, and apologies for the length of this,

  —Peter Halloran
reasoning: |-
  Okay, let me approach Peter's letter with the care it deserves. This is clearly someone grappling with profound philosophical questions under immense personal strain. His background in structural engineering and current role as a caregiver for his wife with Alzheimer's creates a unique lens through which he's examining Stoicism.

  The core of his confusion seems to center on three interconnected issues: the nature of control in Epictetus' dichotomy, whether the classification applies to items or aspects, and how determinism coexists with personal agency. His engineering mind is clashing with philosophical abstraction, and he's smartly identified several possible interpretations of "our own."

  What stands out is how personally vital this is for him - he's not just academically curious but needs to know whether Stoic serenity requires emotional detachment from his wife's suffering. That practical concern about whether he can care intensely while maintaining reservation is heartbreakingly urgent.

  He's absolutely right that the causal control model doesn't map onto Epictetus. The items on the "in our control" list aren't causally manipulable through direct intervention. His alternative interpretations are perceptive: the "produced solely by me" reading, the "invulnerable to external interference" reading, and the "constitutive of moral responsibility" reading. The text strongly supports the second and third, particularly through phrases about compulsion and blame.

  The aspectual reading he proposes is actually quite sophisticated - recognizing that any event has both controllable and uncontrollable dimensions. This aligns well with the Stoic concept of "appropriate acts" (kathēkonta) where we focus effort on the attempt while releasing attachment to outcomes. The cylinder analogy he mentions helps here - our character shapes how we respond to external pushes.

  About determinism: Peter's spot-on that causal leverage seems incompatible with fate. The resolution lies in distinguishing between the causal chain (all predetermined) and the locus of moral responsibility (our judgments). Our "assent" to impressions is what's "up to us" within the determined system.

  Most crucially for his caregiving dilemma: the reservation clause he describes is precisely correct. He can and should care intensely about his wife's comfort while recognizing that the ultimate outcome isn't his to command. The discipline isn't about suppressing care but about channeling it into what's actually attainable - his loving actions rather than her disease trajectory.

  What he needs is confirmation that his best interpretive instincts are sound, and reassurance that Stoicism won't demand emotional callousness. The textual evidence for this is strong: Epictetus insists we fulfill our relational roles well, and the reservation clause explicitly preserves committed action.
answer: |-
  Peter,

  Thank you for your thoughtful and profoundly human letter. Your situation commands respect, and your intellectual honesty in grappling with Epictetus under such circumstances is remarkable. Let’s work through the passage with the rigor you request, focusing solely on the text you provided and logical inference. I’ll address your core questions directly.

  **1. The Meaning of "Our Own" (and "Control")**

  Your professional understanding of control (causal leverage with tolerances) is sound, but it is *not* what Epictetus means. The text itself provides the definition: "whatever are our own *actions*" (emphasis mine). The key is not causal efficacy over external states, but absolute authority over *internal acts of judgment and will*. 

  *   **What the Text Says:** "Things in our control are opinion (*hupolēpsis*), pursuit (*hormē*), desire (*orexis*), aversion (*ekklisis*), and, in a word, whatever are our own *actions*." These are mental events: forming a belief about something, initiating an impulse to act, desiring something, rejecting something. Conversely, "body, property, reputation, command" are external states or things existing in the world outside our mind.
  *   **Which Interpretation Fits?** 
      *   *Not "Produced solely by me"*: While our judgments feel internal, Stoics acknowledge external influences (impressions). The focus isn't on origin, but on the *final authority*.
      *   *Yes: "Nothing outside me can compel or block it" (Inviolability of Assent)*: This is the core of Epictetus' claim. No external force – not illness, not loss, not another person’s action – can *force* you to assent to a specific judgment ("This is bad"), desire ("I must have this"), or aversion ("I must avoid this"). They can present impressions, but your faculty of assent (*sunkatathesis*) is the final gatekeeper. A tyrant can chain your body (external), but cannot chain your judgment that chains are an evil (internal action). This is the "free, unrestrained, unhindered" nature of the *prohairesis* (moral faculty).
      *   *Yes: "Constitutive of me / What I am responsible for"*: This is the ethical corollary. Precisely because only your judgments, desires, and aversions are truly "your own actions" in this inviolable sense, they are the *only* things for which you can be morally credited or blamed. Reputation belongs to others ("such as it really is" – an external thing they form opinions about), so blaming them for it is a category error.

  **Why the Dichotomy Makes Sense & the Inference Works:**
  The lamentation ("you will be hindered. You will lament...") arises *only* if you mistakenly place your "good" and "evil" in externals (slavish by nature because dependent on others/fate). If you judge your wife's condition *itself* as an evil, or her distress *itself* as something you *must* prevent, you invest your moral self (your "good") in something not your own. When the disease inevitably frustrates your causal efforts (because the body/disease is "weak, slavish, restrained, belonging to others"), you are shattered. The inference holds: Mistaking the "slavish" (contingent, dependent) for the "free" (your judgment) guarantees frustration. Correctly identifying what is truly yours (your judgments/responses) means no external event can *compel a bad judgment upon you* or *force you to act against your considered will* ("you will do nothing against your will"). Harm (*blabē*) is redefined as damage to your moral faculty through bad judgment, not physical or external suffering. Enemies cannot reach this inner citadel unless you let them in via faulty assent.

  **2. Items vs. Aspects**

  You are absolutely correct. The text *implies* the aspectual view, though it lists examples categorically for clarity. Stoicism is fundamentally about correctly analyzing *any* event or undertaking into its components:

  *   **What is "up to us" (eph' hēmin)?** Our *judgment* about the event, our *volition* (desire/aversion) regarding it, and the *intention* behind our *actions* in response.
  *   **What is *not* "up to us"?** The external event itself, the outcome of our actions, the reactions of others, the state of the body, etc.

  **Applying it to Your Wife's Calm Night:**
  *   **Not Up To You (External/Outcome Aspect):** The progression of the disease, the specific neurological events causing distress, whether a particular intervention *succeeds* in calming her.
  *   **Up To You (Internal/Action Aspect):** Your *judgment* that her distress, while deeply saddening, is not an *evil* that destroys *your* good (which lies in virtuous intent). Your *volition*: desiring to help her *because it is the loving, right thing to do*, not because you *demand* a specific outcome. Your *intentional action*: preparing the environment, administering care, seeking help, providing comfort – doing what a loving, devoted husband *should* do. The *outcome* of these actions belongs to the external world.

  **Does the Payoff Hold?** Yes, but it shifts from a causal guarantee of outcomes (which it never promised) to an *evaluative* and *ethical* guarantee:
  *   **Not Guaranteed:** That she will *never* be frightened.
  *   **Guaranteed (if you internalize the dichotomy):** 
      *   You will not be *morally hindered* – you can always choose the virtuous intent and action.
      *   You will not *lament fate or gods* – you understand the disease is external, not a personal assault.
      *   You will find fault with *no one* (including yourself, for failing an impossible task) – you did what was yours; the outcome wasn't yours.
      *   You do nothing *against your will* – your will is now aligned with acting virtuously *regardless* of outcome.
      *   You are not *harmed* in the Stoic sense – your good (virtue) remains intact.

  **3. Fate, Determinism, and "Up To Us"**

  The cylinder analogy is apt. Your question cuts to the heart of compatibilism. How can something be "fated" yet "up to us"?

  *   **Fate/Determinism:** The Stoics believed the universe is a single, rational, causal chain (Logos). Everything that happens *is* fated. This includes the external events *and* your internal processes.
  *   **"Up To Us":** This refers *only* to the *nature* of the event within that chain. Your judgments, desires, aversions, and impulses are *your character in action*. They are the "shape of your cylinder." Fate determines *that* you will make *a* judgment, but your character (shaped by reason/philosophy) determines *what kind* of judgment it will be – assenting rightly to impressions or wrongly. When Epictetus says "no one will compel you," he means no external force can *determine the content* of your assent *against your character's disposition*. Your assent, though occurring within fate, is the locus of your agency and responsibility *because it reflects who you are*. "Up to us" was *never* about breaking the causal chain (causal leverage in the absolute sense); it was always about the *moral quality* of our necessary acts of mind within it.

  **The Practical Application: "Reservation" (hupexairesis)**

  You grasp it correctly. The discipline does **not** require you to regard the outcome (your wife not being frightened) as "nothing to you" in the sense of *not caring* or *not acting with full effort*. It requires a shift in *where you locate your "good"* and *what you hold yourself absolutely responsible for*.

  *   **What it Asks:**
      1.  **Judge Correctly:** Recognize that her distress is a terrible thing caused by disease (an external evil), but it is not *your* evil. *Your* good lies in your virtuous response.
      2.  **Desire Correctly:** Desire intensely *to act with love, care, and skill* as her husband. *Do not* stake your happiness on the *demand* that your actions *must* prevent her distress. Desire the good (virtuous action), be *indifferent* (without attachment) to the specific external outcome regarding her disease.
      3.  **Act with "Reservation":** Pursue your aim – her comfort and calm – with all your skill, effort, and love ("as though it depends on you"). *Simultaneously*, hold that aim "lightly" in your mind, acknowledging it depends on factors beyond your ultimate control ("as though it does not depend on you"). Mentally add: "Fate permitting," or "If nothing hinders." This is not passivity; it's the *mental posture* that protects you from the false belief that the outcome *was* yours to command.
  *   **Why it's Not Wrong:** Your intense care is channeled *entirely* into what *is* yours: your loving intentions and your best efforts. You *want* her calm night. You *work* for it. But you do not *demand* it of the universe as your right or stake your moral worth on achieving it. Your serenity comes not from indifference *to her*, but from the knowledge that you are doing *your* part – the only part that defines *you* – flawlessly, regardless of the uncontrollable disease. You remain fully present, fully caring, fully active. The "reservation" prevents the despair that comes from the impossible demand that you *control the uncontrollable*.

  **Conclusion: The Supported Reading**

  The passage supports the interpretation that "our own" refers to our **inviolable faculty of assent** concerning judgments, desires, and aversions, which constitutes our **moral responsibility**. The classification is **aspectual** – any event has an "up to us" aspect (our response) and a "not up to us" aspect (the external event/outcome). This aspectual view, grounded in the inviolability of assent, earns the payoff *ethically and psychologically*: freedom from compulsion (of judgment), disturbance, blame, and false harm, even within a fated universe. The practice of "reservation" is essential and compatible with profound, active care for your wife. It asks you to direct your care fiercely towards your *actions* (what is yours), releasing the *outcome* (what is not yours) from being the measure of your worth or the determinant of your peace.

  Your struggle honors both your wife and your own intellect. Keep tending to both. You are asking exactly the right questions.

  With respect,  
  Andrew
