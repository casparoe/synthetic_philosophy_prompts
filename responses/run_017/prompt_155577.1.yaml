prompt: |-
  For the last few months I have been the resident philosopher on an applied project, and it has made a distinction I used to treat as textbook feel genuinely unsettled. We are building an annotation scheme — and downstream, a classifier — over a corpus of news transcripts, parliamentary debate and recorded interviews, whose job is to tag every conditional sentence with what its speaker is committed to about the antecedent: that it is false; that she believes it false; that she is agnostic; that the matter is already settled but unknown to her; or that she is explicitly withholding commitment. The tokens that keep breaking our guidelines are the ones where the fact is settled but nobody has looked yet (the biopsy result is in the file, unopened: one annotator hears "If the result is malignant, we operate on Friday" as a wide-open indicative, another hears it as counterfactual-flavored and wants it tagged "settled"), the "if it weren't for" and "but for" constructions whose antecedent is plainly true, and the exchanges in which the speaker knows something her audience does not and still reaches for the indicative form. Before I go back and read more of the semantics literature, I want the specification written down. What does a theory of the indicative/counterfactual distinction have to deliver in order to be good enough for that job — not good enough in general, good enough to underwrite a commitment-detection rule?

  So give me the requirements list, with the case or consideration behind each requirement, and keep the weight there rather than on the scoring. Which cases must it classify: past-tense counterfactuals with antecedents taken to be false; indicatives whose antecedent the speaker herself takes to be false (the Oswald-and-Kennedy style of example, where the plain "if" version is fine and the "would have" version is not); settled-but-unknown antecedents like the sealed result or a lottery ticket already drawn; future-directed and "were he to" forms that commit to nothing about the antecedent's truth; "if not for" constructions with true antecedents; and the asymmetric-information pairs where speaker and audience differ. Which distinctions must it refuse to collapse: semantic entailment versus conversational implicature versus presupposition; the speaker's own information versus the common ground; "commits to not-A" versus "commits to not knowing whether A"; and the author's own commitments versus the commitments she reports, supposes or fictionalizes. Which phenomena must it derive rather than stipulate: why "would" shows up in the consequent of one kind and "will" in the other; why only one of the two forms can be used to make an offer, a bet, a threat or a request; why adding detail to an antecedent flips a verdict that was fine a sentence earlier; why two speakers with different information can each assert a conditional with the same antecedent and contradictory consequents and both seem right; how "even if", "whether or not", inversion and "suppose" behave; how any of this survives embedding under "she said that", "I doubt whether", or negation; and whether the distinction is semantic or a matter of use, given that not every language marks it in its morphology.

  Then the second half. For each requirement, say whether it is non-negotiable given my purpose or merely a preference of one camp — uniformity of treatment across the two kinds, compositionality, conservatism about the underlying modality, tractability from surface cues plus limited context, stability across annotators, and so on — and name the single requirement that does the most work in excluding candidates. Flag any pair of requirements you suspect cannot be jointly satisfied, and tell me for each such pair whether the tension is itself a finding about conditionals or a sign that my project's specification is confused: my own suspicion is that "get the asymmetric-information cases right" and "classify every token from the common ground alone" cannot both be had, and more generally that any account which makes the distinction purely pragmatic will not be able to explain why it projects out of embeddings. Finish with a short scorecard — two or three lines each, no more — for the four families I keep encountering: closest-world similarity semantics (the Lewis–Stalnaker line), the modal-restrictor view (the Kratzer-style line), the view on which conditionals have no truth conditions and answer instead to a conditional-probability or acceptability condition (Adams's line), and dynamic update semantics. Please write the whole answer in American English.
reasoning: |-
  Okay, the user is working on an annotation project for conditional sentences and needs a requirements list for the indicative/counterfactual distinction to build a classifier. They mentioned several challenging cases like sealed results, "if it weren't for" constructions, and asymmetric information scenarios. 

  First, I need to identify all the key cases they mentioned: past counterfactuals, false-antecedent indicatives (like Oswald examples), settled-but-unknown cases, future-directed conditionals, "if not for" with true antecedents, and asymmetric information pairs. Each of these must be handled by the theory.

  Then, the distinctions that shouldn't be collapsed: semantic entailment vs. implicature, speaker's info vs. common ground, commitment to not-A vs. not knowing A, and author's commitments vs. reported ones. These are crucial for accurate tagging.

  The derived phenomena are important too—why "would" vs. "will" appears, why only one form can make offers/bets, how adding detail flips judgments, how two speakers with different info can both seem right, and embedding behavior. The theory needs to explain these rather than just stipulate them.

  For the project constraints, stability across annotators and tractability from surface cues are non-negotiable. If the theory relies too much on deep context, annotators might disagree. Compositionality and uniformity might be preferences, but stability is key. 

  The big tension I see is between handling asymmetric info cases and classifying from common ground alone. Asymmetric info requires knowing the speaker's private knowledge, but common ground is shared. This might be a fundamental issue in conditional semantics, not just a project flaw.

  Now, evaluating the four theories: Stalnaker-Lewis handles many cases but struggles with settled-but-unknown and asymmetric info. Kratzer is compositional but has similar issues. Adams doesn't give truth conditions, which might not work for commitment tagging. Dynamic semantics handles embeddings well but might be complex for annotators.

  The user's deeper need is a practical, implementable solution for their annotation project. They need clear guidelines that annotators can apply consistently, even if the theory isn't perfect. Highlighting the tension points helps them make informed trade-offs.
answer: |-
  Here's a requirements list for a theory of the indicative/counterfactual distinction tailored to your commitment-detection annotation project, followed by constraint analysis and scorecards for major theories. Requirements are grounded in your problematic cases and project goals.

  ---

  ### I. Core Classification Requirements (Cases the Theory Must Handle)
  1.  **Past Counterfactuals (Antecedent Taken False):** *Case:* "If Oswald hadn't shot Kennedy, someone else would have." Speaker commits to antecedent false. *Requirement:* Tag as "false".
  2.  **False-Antecedent Indicatives (Oswald-Style):** *Case:* "If Oswald didn't shoot Kennedy, someone else did." Speaker may believe antecedent false but uses indicative. *Requirement:* Tag as "agnostic" or "withholding commitment" (NOT "false"); distinguish from (1).
  3.  **Settled-But-Unknown Antecedents (Sealed Result/Lottery):** *Case:* "If the result is malignant (unopened envelope), we operate Friday." *Requirement:* Tag as "settled" (truth-value fixed but unknown to speaker/audience). Must *not* be forced into "false" (counterfactual) or "agnostic" (open indicative).
  4.  **Future-Directed / Subjunctive Forms (No Commitment):** *Case:* "If he were to run (future), he would win." / "Were he to run...". *Requirement:* Tag as "withholding commitment" or "agnostic" re: antecedent truth. Must *not* imply speaker believes it false.
  5.  **'If not for'/'But for' with *True* Antecedents:** *Case:* "If it weren't for NATO, Ukraine would have fallen." (Speaker believes NATO exists & helped). *Requirement:* Tag as "false" (counterfactual flavor) *despite antecedent being true in actual world*. Must capture speaker's presentation as counterfactual.
  6.  **Asymmetric Information Pairs:** *Case:* Speaker knows biopsy result is benign, audience doesn't. Speaker says "If the result is malignant, we operate Friday." *Requirement:* Tag based on *speaker's* commitment (here: "false" for antecedent) NOT common ground/audience belief ("agnostic" or "settled"). Theory must access speaker knowledge.

  ### II. Essential Distinctions (Must NOT Collapse)
  7.  **Semantic Entailment vs. Pragmatic Effect:** *Case:* Counterfactual "If P, Q" *entails* not-P (or presupposes it?). Indicative does not entail not-P, though it may *implicate* speaker doubts P. *Requirement:* Tagging "commits to not-A" must rely only on semantic/presuppositional commitment, NOT implicatures.
  8.  **Speaker's Info vs. Common Ground:** *Case:* Asymmetric info (6) and Sealed Result (3). *Requirement:* Tags must reflect commitments from the *speaker's epistemic state*, not just shared common ground (though CG is often input).
  9.  **Commitment to ¬A vs. Not Knowing A:** *Case:* Sealed Result (3) vs. False-Antecedent Indicative (2) vs. Past Counterfactual (1). *Requirement:* Tags "false", "agnostic", and "settled" must be clearly separable.
  10. **Author Commitment vs. Reported/Fictional Commitment:** *Case:* "The prosecutor said that if Simpson hadn't done it, the evidence wouldn't point to him." *Requirement:* Tag commitments *as presented by the speaker in the utterance context*, not the original speaker's (reported) commitments or fictional scenarios.

  ### III. Phenomena Needing Derivation (Not Stipulation)
  11. **'Would' vs. 'Will' in Consequents:** *Requirement:* Explain why counterfactuals typically require "would" (or past tense modal) and indicatives allow "will" (or present tense modal). *Case:* "If it *rains*, the match *will* be canceled" (Indicative) vs. "If it *had rained*, the match *would have been* canceled" (Counterfactual).
  12. **Speech Act Compatibility (Offers/Bets/Threats):** *Requirement:* Explain why only indicatives work for direct offers/bets/threats. *Case:* "If you need a ride, I *will* drive you" (Offer) vs. #"If you had needed a ride, I *would have driven* you" (Not an offer).
  13. **Antecedent Elaboration Effects:** *Requirement:* Explain why adding details can flip judgments. *Case:* "If I *won* the lottery..." (Agnostic) vs. "If I *won* the lottery *this week*..." (False/Counterfactual, if drawing was last week).
  14. **Perspectival Relativity:** *Requirement:* Explain how two speakers with different info can assert conditionals with same antecedent/contradictory consequent and both seem acceptable. *Case:* Speaker A (knows biopsy benign): "If malignant, we operate Fri." (True: operation won't happen); Speaker B (doesn't know): "If malignant, we operate Fri." (True: protocol requires it).
  15. **Interaction with Operators:** *Requirement:* Explain behavior under "even if", "whether or not", antecedent inversion ("Had he come..."), "suppose", negation, embeddings ("She said that if...", "I doubt if...").
  16. **Embedding Projection:** *Requirement:* Explain why the indicative/counterfactual distinction (and its presuppositions/implications) often survives embedding under verbs like 'say', 'doubt', negation. *Case:* "She didn't say that if Oswald hadn't shot Kennedy, someone else would have" still implies she discussed a scenario where Oswald didn't shoot.
  17. **Semantic vs. Pragmatic Basis:** *Requirement:* Account for the distinction's robustness and morphological marking cross-linguistically without over-committing to a purely semantic or purely pragmatic origin.

  ---

  ### IV. Project Constraints & Tensions
  *   **Non-Negotiable:**
      *   **Stability Across Annotators:** Theory must yield taggable commitments based on *surface cues + limited accessible context* (speaker identity, clear common ground). Annotators can't reconstruct deep pragmatic reasoning or inaccessible speaker knowledge. *Excludes theories needing perfect epistemic models.*
      *   **Tractability from Surface Cues + Context:** Rules must be implementable by humans (and eventually a classifier) using tense, mood, modal verbs ("will"/"would"), phrases like "if not for", and known speaker/audience info asymmetry. *Excludes overly context-dependent theories.*
  *   **Negotiable (Camp Preferences):**
      *   **Uniformity of Treatment:** Desirable but not essential if distinct mechanisms handle indicatives/counterfactuals cleanly.
      *   **Compositionality:** Highly desirable for handling embeddings, but some stipulation may be tolerable for core cases.
      *   **Conservatism (Modality):** Preferable to avoid radical revisions to modal logic, but not a blocker.
      *   **Deriving All Phenomena (vs. Stipulating Core):** Deriving (11)-(17) is ideal, but project can tolerate some stipulation if core commitments (1-10) are reliably tagged.
  *   **Key Excluder:** **Stability Across Annotators.** Theories requiring deep, contested pragmatic inferences or perfect knowledge of speaker epistemic states fail this.
  *   **Suspected Requirement Tensions:**
      1.  **"Handle Asymmetric Info (6)" vs. "Classify from Common Ground (CG) Alone (part of 8/Stability)":** *Tension:* Getting the speaker's *actual* commitment in asymmetric cases requires knowing *their* private knowledge. Annotators often only have CG. *Nature:* Fundamental finding about conditionals. Speaker commitments depend on *their* state, not just CG. Project must decide: Accept CG-based tags (losing accuracy in asymmetric cases) or find ways to infer speaker knowledge (hard for annotators/classifier).
      2.  **"Derive Embedding Projection (16)" vs. "Purely Pragmatic Distinction (17)":** *Tension:* Purely pragmatic accounts (e.g., Gricean) struggle to explain why the distinction projects robustly out of embeddings. *Nature:* Finding about conditionals (supports a semantic or presuppositional core). Purely pragmatic accounts likely insufficient for project.
      3.  **"Tag 'If not for' as Counterfactual (5)" vs. "Commitment Reflects Actual Truth (part of 9)":** *Tension:* "If not for NATO" presents NATO's role as counterfactual *even when NATO exists*. *Nature:* Finding about conditionals (counterfactuality is a *mode of presentation*, not always a claim about actual falsehood). Project must allow tag "false" for commitment even when A is true in (5).

  ---

  ### V. Theory Scorecards (Brief)

  1.  **Closest-World Similarity (Lewis/Stalnaker):**
      *   *Strengths:* Handles (1), (5), (11), (12), (13) well. Clear semantic core.
      *   *Weaknesses for Project:* Struggles with (3) Sealed Result (why not counterfactual?), (6) Asymmetric Info (depends on context set - whose?), (14) Perspectival Relativity, (16) Embedding Projection (presupposition needs adding). Surface cues sometimes insufficient for similarity metric. Stability risk: Annotators may disagree on "closest world".

  2.  **Modal Restrictor + Ordering Source (Kratzer):**
      *   *Strengths:* Highly compositional, handles embeddings (15, 16) well, flexible context-dependency. Can model (6) with speaker's modal base.
      *   *Weaknesses for Project:* Relies heavily on precise, often implicit, contextual ordering sources. High annotator instability risk: What's the relevant modal base/source? (3) Sealed Result and (5) 'If not for' require careful, non-obvious setup. Surface cues less directly tied to rules.

  3.  **No Truth Conditions / Adams (Probabilistic):**
      *   *Strengths:* Elegantly handles (2) False-Antecedent Indicatives, (14) Perspectival Relativity, (17). Matches intuition that indicatives express conditional probability.
      *   *Weaknesses for Project:* Cannot directly assign *commitments about antecedent truth* (False/Settled/Agnostic) – core project requirement. Struggles with (1) Counterfactuals, (5) 'If not for', (12) Speech Acts, (16) Embedding Projection. Provides acceptability, not truth/commitment tagging. Requires estimating probabilities – hard for annotators/classifier.

  4.  **Dynamic Update Semantics (e.g., Gillies, Veltman):**
      *   *Strengths:* Excels at (6) Asymmetric Info, (14) Perspectival Relativity, (15), (16) Embeddings. Handles context update directly. Can model (3) Sealed Result via defined info states.
      *   *Weaknesses for Project:* High complexity. Annotator instability: Rules involve updating abstract context sets, not direct commitment tagging. Requires explicit model of information states – hard to infer consistently from limited context. Surface cues less transparently linked to rules.

  ---

  **Bottom Line for Specification:** Prioritize **Stability** and **Tractability**. Explicitly allow tags based on *speaker presentation* (even if logically odd, like (5)), not just literal truth. Acknowledge the **Asymmetric Info vs. Common Ground** dilemma – decide if tags reflect *speaker knowledge* (harder) or *inferable/common ground* (less accurate in key cases). Kratzer or Dynamic semantics offer the most comprehensive *framework*, but require careful, context-rich guidelines. Stalnaker offers more intuitive surface-cue links but needs patches for key cases. Adams is likely insufficient for commitment tagging.
