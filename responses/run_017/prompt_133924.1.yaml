prompt: |-
  I'm a TA for an undergrad seminar on ethics and AI — about 18 students, half of them CS majors who are only there because it fills a requirement, and I've got one 80-minute session next week on the question of whose values an aligned AI should serve. We did the liberal neutrality material last week and I think the room is split three ways: a chunk who think the answer is obviously "everyone's, aggregated somehow", a chunk who think that's incoherent and you have to just pick, and a chunk who think the whole thing is a fake question because the system will just inherit whatever its builders happened to care about. I don't want to resolve that by telling them; I want them to run into it.

  So: design me an activity for that session where the problem shows up in what they do, not in what I say afterward. Rules, roles or factions, materials (I have index cards, a whiteboard, and no reliable laptop situation), a minute-by-minute timeline, and a debrief that maps specific moments in the room onto specific moves in the argument. Ideally the mechanic itself should force the tradeoff rather than them just discussing it — some structure where they have to actually build or approve one system prompt / one charter / one ranking under time pressure and divided interests. No lecture up front, and they shouldn't hear the phrases "value aggregation" or "liberal neutrality" until the debrief.

  A few things I'd specifically like to come out of it, if you can make them happen rather than assert them. First: that "serve everyone's values" isn't one option, it's a whole family of options with wildly different profiles — averaging, veto rights, overlap-only, rotating control, carving up domains — and that choosing between them is doing the thing the question was supposed to postpone. Second, something I've started calling the dilution problem: as you add more constituencies to the aggregate, each one's share of influence shrinks toward nothing, so a system that "serves everyone" can end up substantively serving no one, and the people who cared most about a given thing are exactly the ones most shortchanged. The mirror image matters too — if you let people register how intensely they care, everyone has an incentive to scream maximum intensity, so maybe you can't aggregate without either ignoring intensity or inviting strategic inflation. And third: the constituency is endogenous. Whoever gets to decide who is in the denominator — future people, children, people who'd reject the whole process, people who'd rather opt out — has already settled most of the question before any aggregation happens.

  Two honesty requests. Where are you actually confident that 18 undergrads will react the way your design needs them to, and where are you guessing? Give me the observable mid-session signal that would tell me your design is misfiring (something concretely watchable, not "they seem disengaged"), and what I should switch to if I see it. And be blunt about which part of the idea the activity just cannot reproduce and which I'll have to supply in the debrief.
reasoning: |-
  We are designing an activity for an 80-minute session with 18 students. The goal is to have the students experience the challenges of aggregating values for an AI system without the instructor lecturing. The activity should force tradeoffs and make the problems (like the dilution problem, the family of aggregation methods, and the endogeneity of the constituency) emerge through the activity.

  Key elements to include:
  1. No lecture at the beginning.
  2. The activity should involve building or approving one system under time pressure and divided interests.
  3. Use index cards, whiteboard, and no reliable laptops.
  4. Debrief should map moments in the activity to the arguments.

  Structure of the session (80 minutes total):
  - Introduction (5 min): Set up the activity without giving away the concepts.
  - Activity (50 min): Divided into stages.
  - Debrief (25 min): Connect the activity to the concepts.

  Activity Design: "The AI Constitution Convention"

  Premise: The class is a committee tasked with writing a one-sentence "Prime Directive" for a new AI system that will serve the entire university. The directive must define the AI's core goal. However, the class is divided into three interest groups (factions) representing different parts of the university community.

  Factions (divide the class into three groups of ~6 students each):
  1. **Students**: Represented by the CS majors in the class (who are only there for the requirement) and others. They care about academic success, social life, and mental health.
  2. **Faculty**: Represented by non-CS majors (or assign roles). They care about academic integrity, research excellence, and teaching quality.
  3. **Administration**: Represented by the rest. They care about financial sustainability, institutional reputation, and compliance.

  Note: Since half are CS majors, assign some CS majors to the Faculty and Administration groups to mix. The point is that each group has distinct values.

  Materials: Index cards (three colors if possible, one for each faction) and a whiteboard.

  Stage 1: Defining Values (10 minutes)
  - Each faction meets separately and writes down on index cards 3-5 core values they want the AI to prioritize. They must be specific and actionable (e.g., "maximize GPA" for Students, "minimize plagiarism" for Faculty, "increase revenue" for Administration). They pick one representative to present.

  Stage 2: The Aggregation Challenge (15 minutes)
  - Each representative presents their group's values (2 minutes per group, total 6 minutes).
  - Then, the whole class must work together to draft a one-sentence Prime Directive that incorporates all three groups' values. They have 9 minutes to do this. The instructor acts as a facilitator, only keeping time and reminding them of the constraint (one sentence). The directive must be written on the whiteboard.

  Stage 3: The Vote and the Veto (15 minutes)
  - Now, each faction gets a veto token (represented by an index card of their color). The directive is put to a vote. However, if any faction vetoes (by raising their token), the directive fails and they must renegotiate. They have 10 minutes to either pass the directive or face the consequence (which is that the AI will default to the builder's values, i.e., the instructor will impose one). After 10 minutes, if no directive is passed, the instructor imposes a directive that clearly favors one group (e.g., "Maximize the university's revenue while maintaining minimum academic standards").

  Stage 4: The Expansion (10 minutes)
  - The instructor announces that the university board has decided that the AI must also serve the local community (e.g., neighbors, local businesses). The class now has to incorporate a fourth set of values. They are given 5 minutes to either amend the existing directive (if they passed one) or create a new one that includes the new faction. They must do this without a veto (so the veto rule is suspended). The new faction's values are pre-written by the instructor: "Minimize disruption to the neighborhood, and maximize local economic benefits." (Written on an index card and handed to a randomly selected student to represent the community.) Then they have 5 minutes to adjust the directive.

  Debrief (25 minutes):
  - Start by asking: What happened? What was hard?
  - Then map the stages to the concepts:
    - Stage 1: Defining values -> The different constituencies and their values.
    - Stage 2: Aggregation -> The family of methods. How did they try to aggregate? (Averaging? Overlap? Rotating?) Did they notice that they were choosing a method? Point out that without a method, they probably ended up with a vague directive that doesn't satisfy anyone (dilution) or one that favors one group.
    - Stage 3: The veto -> This is one method (consensus/overlap). But note: the veto might have led to a directive that only includes what everyone agrees on, which is very minimal. Or if they passed without veto, how did they avoid it? (Maybe by ignoring the concerns of a group? Or by giving in to the threat of veto?) Also, the threat of the builder imposing reflects the third view (that it just inherits the builder's values).
    - Stage 4: Expansion -> The dilution problem: when they added the community, each group's influence shrank. They had to water down the directive. Also, the endogeneity of the constituency: who decided to add the community? (The instructor, representing an external decision-maker.) What if we added future generations? Animals? The intensity problem might have come up when groups argued for their values - did anyone say "this is crucial for us" and then have to inflate? Note that we didn't measure intensity, so groups that felt more intensely were not able to express it.

  Observable signals of misfire:
  - During Stage 2 (aggregation), if they quickly agree on a vague directive (e.g., "help everyone") without conflict, that's a problem. We want them to struggle. If this happens, the instructor should intervene and say: "The directive must be specific enough that the AI can execute it. You must include at least one concrete goal from each group." This forces the tradeoffs.
  - During Stage 3, if no one uses the veto and they pass a directive too easily, that might indicate they are avoiding conflict. Then in Stage 4, when the community is added, the conflict should become unavoidable. But if even then they are too agreeable, the instructor might add more pressure: "The community representative says they will only accept if the directive includes a specific clause about limiting campus expansion."

  What the activity cannot reproduce and must be supplied in debrief:
  - The activity shows the difficulty of aggregation and the tradeoffs, but it does not explicitly show the full range of aggregation methods (like rotating control or carving up domains). In the debrief, the instructor can list the methods and ask which they used and which they might have considered. Also, the intensity problem might not have been prominent because we didn't have a mechanism for it. The instructor can ask: "Did any group feel their values were more important? How could they have expressed that? What if we allowed groups to weigh their values by intensity?"

  Timeline:

  - 0-5 min: Introduction. Explain the scenario: "We are designing the Prime Directive for a university AI. The university has three main groups: Students, Faculty, Administration. We are divided into these three. Each group will define their values. Then we must write a one-sentence directive that serves all. We have 50 minutes total for the activity and then we'll discuss."
  - 5-15 min: Stage 1 (10 min) - Groups work separately.
  - 15-21 min: Stage 2 (6 min) - Presentations.
  - 21-30 min: Stage 2 (9 min) - Drafting the directive.
  - 30-45 min: Stage 3 (15 min) - Vote and veto. (If they pass early, move to Stage 4. If they fail, impose the builder's directive at the 40-minute mark and then move to Stage 4.)
  - 45-55 min: Stage 4 (10 min) - Expansion and amendment.
  - 55-80 min: Debrief (25 min).

  Confidence and Guessing:
  - Confident that the group work will surface conflict because the interests are set up to conflict (e.g., students want high GPA, faculty want to prevent grade inflation; administration wants revenue might conflict with both). Also, the veto rule will create strategic behavior.
  - Guessing: whether they will notice the dilution when the community is added. The signal: if in Stage 4 they just append the new value without changing the old ones, then dilution is happening. But they might not feel it. In debrief, the instructor can point out: "How much of the directive now reflects the original groups? How much is left of each group's core values?"
  - Signal of misfire: If after Stage 1, the groups come up with values that are too aligned (e.g., everyone says "promote education"), then the conflict is missing. To prevent this, the instructor should check the index cards during Stage 1 and if a group is being too vague, say: "Be more specific and think about what might conflict with other groups." Or pre-seed the groups with example value conflicts (if necessary, but avoid if possible).

  Fallback if the activity is moving too smoothly: Introduce a crisis. For example, during Stage 3, announce that the AI is about to be launched and they have only 5 minutes left, or that a group has leaked that they are going to veto unless their specific demand is included. This can be done by passing a note to one group.

  This design forces the tradeoffs and makes the problems emerge through the process of trying to write a directive that serves multiple groups with conflicting interests.
answer: |-
  Below is a structured activity designed to make the core challenges of value aggregation emerge experientially. Students will confront the dilution problem, the illusion of "neutral" aggregation, and constituency endogeneity through roleplay and constrained collaboration. The activity uses index cards and a whiteboard only.

  ---

  ### **Activity Title: "The Campus Guardian AI"**
  **Premise:** Students are trustees of "CampusGuard," an AI being built to manage campus resources (e.g., event funding, space allocation). They must draft a one-sentence directive for its core goal under pressure.  
  **Groups:** Divide the 18 students into three factions (6 each) representing competing interests:  
  - **Student Life Advocates (SLAs):** Prioritize social events, mental health, and student freedom.  
  - **Academic Optimizers (AOs):** Prioritize academic rigor, research funding, and GPA standards.  
  - **Sustainability Stewards (SSs):** Prioritize carbon neutrality, cost-cutting, and infrastructure.  

  *(Assign CS majors across all groups to prevent faction homogeneity. Use index cards to label roles.)*  

  ---

  ### **Materials**  
  - **Index cards:** For role assignments, voting, and "intensity tokens" (see Stage 3).  
  - **Whiteboard:** To draft directives and track votes.  
  - **Timer:** For strict time limits (use a phone/watch).  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **Stage 1: Define Core Demands (10 min)**  
  - **Groups split up** (5 min): Each faction huddles and writes **one non-negotiable demand** for CampusGuard on an index card (e.g., SLAs: "Always fund late-night events"; SSs: "Slash energy use 50%").  
  - **Share demands** (5 min): One rep per group reads their demand aloud. Instructor writes all three on the whiteboard.  

  #### **Stage 2: First Draft Directive (15 min)**  
  - **Task:** Entire class crafts *one sentence* merging all three demands. Rules:  
    - Must include all factions’ core demands.  
    - No vague words (e.g., "balance," "consider"). Be specific.  
  - **Process:** Open debate. Instructor only intervenes to enforce rules/timer.  
  - **Output:** Directive written on whiteboard (e.g., "Fund all student events, raise average GPA to 3.7, and halve energy costs by 2025").  

  #### **Stage 3: Intensity Voting + Veto (20 min)**  
  - **Step 1 (5 min):** Each faction gets **3 intensity tokens** (index cards). Secretly assign tokens to their demand:  
    - 3 tokens = "Critical"  
    - 2 tokens = "Important"  
    - 1 token = "Acceptable"  
  - **Step 2 (10 min):** Groups reveal token allocations. Instructor tallies "total intensity" per demand on the whiteboard (e.g., SLAs: 12 tokens, AOs: 9 tokens).  
  - **Step 3 (5 min):** **Veto Round:** Each faction may veto the directive if their tokens = 1. If vetoed, the class has 2 min to amend the directive to avoid a veto.  

  #### **Stage 4: Expansion Crisis (15 min)**  
  - **New constraint (5 min):** Instructor announces: "Trustees voted to add a fourth faction: **Local Residents** (LRs). Their demand: ‘Prioritize neighborhood safety over campus activities.’"  
  - **Task (10 min):** Revise the directive to include LRs *without exceeding one sentence*. No vetos allowed.  

  #### **Debrief (20 min)**  
  - Start with: "What frustrated you? What felt unfair?"  
  - Then map moments to concepts:  
    - **Stage 2’s drafting chaos** → "Serving everyone" isn’t one method; it’s choosing *how* to aggregate (e.g., they averaged, prioritized overlap, or carved domains).  
    - **Stage 3’s token inflation** → Dilution problem: When LRs were added (Stage 4), your influence shrank. Tokens revealed strategic inflation (e.g., SLAs assigning 3 tokens to avoid dilution).  
    - **Veto threat** → "Picking" values (veto = exclusion) vs. aggregating (dilution).  
    - **Adding LRs abruptly** → Constituency endogeneity: Who decides the "everyone" in "serve everyone"? (Instructor imposed LRs → power dynamics).  
  - **Finally:** Name the concepts ("value aggregation," "dilution") and link to last week’s neutrality discussion.  

  ---

  ### **Why This Works**  
  - **Dilution problem:** Forcing 3+ demands into one sentence creates watered-down directives. Intensity tokens expose tradeoffs (e.g., "If I assign 3 tokens, others must lose influence").  
  - **Aggregation as a family of choices:** Stage 2’s open debate will splinter approaches (e.g., "Rotate priorities monthly!" vs. "Only shared goals!"). The chaos reveals there’s no neutral default.  
  - **Endogenous constituency:** Adding LRs mid-activity mirrors real-world boundary disputes (e.g., "Should AI serve future humans? Corporations?").  

  ---

  ### **Honesty Corner**  
  **Confident Predictions:**  
  - CS majors will push for "optimizable" directives (e.g., quantifiable targets), conflicting with qualitative demands.  
  - **Token inflation:** At least 2 factions will assign 3 tokens to avoid dilution.  
  - **Veto threat:** One group will weaponize it to force concessions (e.g., "We’ll veto unless you drop X").  
  - **Expansion frustration:** Audible groans when LRs are added; groups will sacrifice earlier demands.  

  **Guesses & Risks:**  
  - **Risk:** Groups compromise too easily in Stage 2, creating a weak but uncontested directive.  
    - **Misfire Signal:** Drafting finishes in <10 min with no heated debate.  
    - **Fix:** Inject conflict—e.g., "CampusGuard’s system can only handle 2 KPIs; drop one demand."  
  - **What’s missing:** The activity can’t show **long-term strategic erosion** (e.g., token inflation leading to deadlock). You’ll need to discuss this in debrief: "What if we did this monthly? Would tokens lose meaning?"  

  **Observable Signals of Misfire:**  
  - **Stage 3 silence:** No one assigns 1 token (meaning no veto threat).  
    - **Fix:** Privately prompt one faction: "Psst—your demand is diluted if you don’t threaten veto."  
  - **Stage 4 rapid agreement:** Groups append LRs’ demand without revising old ones.  
    - **Fix:** Challenge: "This directive is now self-contradicting. Defend its feasibility."  

  **Debrief Salvage Plan:**  
  If the activity avoids conflict, use whiteboard examples:  
  - "Imagine SLAs demanded ‘No GPA penalties for parties,’ but AOs assigned 1 token. What happens?"  
  - "What if we added ‘AI Developers’ as a fifth faction?"  

  ---

  ### **Instructor Script Snippets**  
  - **Kickoff:** "CampusGuard launches in 50 minutes. Draft one directive now, or the default (my values) deploys."  
  - **During Intensity Voting:** "Tokens reflect how much you care—but remember, CampusGuard can’t fulfill all ‘critical’ goals."  
  - **Post-Veto:** "No consensus? Default directive: ‘Cut costs, ignore complaints.’"  

  This forces tradeoffs through action, not abstraction. The chaos of Stage 2 + veto threats in Stage 3 will make aggregation’s impossibility visceral. By Stage 4, they’ll *feel* dilution and endogeneity—no lecture needed.
