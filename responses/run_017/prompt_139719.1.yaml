answer: |-
  What you're grappling with is a profound and well-recognized principle in type design and visual perception. The closest established term is **Family Resemblance**, drawn from Ludwig Wittgenstein's philosophical concept and directly applied to type design by thinkers like Rudolf Arnheim.

  Here's a breakdown of the concept, its boundaries, and its relation to your questions:

  1.  **Family Resemblance (in Type Design):**
      *   **Definition:** Letters in a coherent alphabet share a set of overlapping visual characteristics (stroke weight modulation, terminal shape, curvature, axis, contrast pattern, proportion, rhythm) – but no single characteristic is identical or strictly necessary across *all* letters. The identity of the "style" emerges from the network of similarities, not a checklist of identical parts.
      *   **Your Problem:** The terminal on `a`, the ear on `g`, and the tail on `y` share a core "genetic" characteristic. It might be:
          *   The *way* the stroke thickens or thins (weight modulation).
          *   The specific curvature radius or "spring" of the stroke.
          *   The angle and sharpness (or softness) of the terminal cut.
          *   The relationship between the stroke's thickness and its length.
          *   The "energy" or implied speed/direction of the stroke.
      *   **Why Identical Strokes Look Wrong:** Making them literally identical ignores the *context* and *function* of each stroke within its specific letter. The `g`'s ear needs to balance the counter below it and relate to the `f` and `r`. The `y`'s tail needs visual weight to anchor the letter and relate to `g`/`j` while avoiding collision. The `a`'s terminal needs to close the counter gracefully without looking pinched or bulbous. Identical strokes disrupt these contextual relationships and violate the principle of *proportional harmony*.
      *   **Why Changes Cascade:** Altering the characteristic in one letter breaks the network of similarities. The modified stroke no longer "speaks the same visual language" as its family members. Your eye perceives this dissonance immediately, making the other letters *appear* inconsistent *relative to the changed one*, even if they are unchanged. The *system* of relationships is disrupted.
      *   **Boundary Cases:**
          *   **Too Similar (Mechanical):** A rigid geometric sans-serif might enforce near-identical terminals on `a`, `c`, `f`, `r`, `y`, `g` (e.g., perfect circles or straight cuts). This *can* work, but it sacrifices the subtle organic variation and contextual adaptation that gives hand-lettering or humanist typefaces their warmth. It might look sterile or uncanny in your project.
          *   **Too Dissimilar (Chaotic):** Strokes sharing the "terminal/ear/tail" role have wildly different shapes, weights, angles, or terminal treatments with no underlying logic. The alphabet feels disjointed, like letters from different fonts. Your friends would easily spot the "off" letter.
          *   **Almost Applies (Weak Resemblance):** Strokes share a *very* broad characteristic (e.g., "they all have curved terminals") but differ fundamentally in execution (e.g., one is a teardrop, one is a blunt wedge, one is a sharp beak). The connection feels superficial or accidental, not like a coherent stylistic choice.

  2.  **Related Concepts:**
      *   **Ductus:** The underlying, often implied, direction and flow of strokes that build a letter. While related (the family resemblance defines *how* the ductus is executed), ductus is more about the foundational skeleton and pen movement than the specific visual characteristics of the resulting form.
      *   **Typographic Color/Texture:** The overall gray value or visual rhythm created by a block of text set in the typeface. Family resemblance contributes *massively* to achieving even color/texture, but it operates at the individual stroke/letter level.
      *   **Character (of a typeface):** The overall personality or feeling conveyed. Family resemblance is a key *mechanism* for establishing consistent character.
      *   **Visual Rhythm/Proportional Harmony:** The pleasing relationship of positive shapes (strokes) to negative spaces (counters, spacing). Family resemblance ensures the strokes contributing to this rhythm share a common logic.
      *   **Gestalt Principles (Similarity, Common Fate, Good Continuation):** Psychological principles explaining how we group similar elements and perceive wholes. Family resemblance leverages these principles to make disparate letters feel like part of a unified system.

  3.  **Is this the same as what makes an `a` an `a`?**
      *   **No, it's distinct but intertwined.**
      *   **Letter Recognition (What makes an `a` an `a`):** This is primarily about **legibility and structure**. It relies on the fundamental skeletal structure, counter shapes, and key distinguishing features defined by centuries of evolution and convention (e.g., the closed bowl and vertical stem on the right for `a`). Changing these too much destroys legibility.
      *   **Family Resemblance (What makes *your* `a` part of *your* alphabet):** This is about **stylistic coherence and harmony**. It operates *within* the boundaries of legibility. Your `a` must still be recognizable as an `a`, but *how* you draw its terminal, the exact weight of its strokes, the curve of its bowl – these are the elements that must share DNA with your `g`'s ear and `y`'s tail to create a unified family feeling. Changing the terminal shape *within stylistic bounds* might still leave it legible as `a`, but break the family resemblance with the other letters.

  **In essence:** You've intuitively discovered that a good alphabet isn't built on rigidly identical parts, but on a shared **visual DNA** – a set of nuanced, interrelated formal qualities applied consistently *in spirit* but adapted *contextually*. **Family Resemblance** is the established term capturing this network of similarities. The cascade effect is the system demanding internal consistency within this shared DNA. Your inability to write perfect rules reflects the subtlety and context-dependency inherent in this principle – it's more about visual relationship and proportional harmony than absolute measurement. Trust your eye and the feedback loop you've experienced ("change A made B look wrong") – that's the principle in action.
