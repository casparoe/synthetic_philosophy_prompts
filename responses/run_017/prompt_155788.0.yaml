  Third, "judging is easier than producing." This involves multiple asymmetries: computational ease, verification over discovery, and understanding vs. fluency. The protocol primarily needs the verification asymmetry—verifying steps should be easier than generating the entire argument. Computational ease is ideal but not always necessary. Understanding asymmetry matters for the judge's ability to validate claims.

  Underdetermination is key. The practice fits with different theories—competitive epistemology, testimony as reliable signals, or mechanistic interpretability. But the strict presuppositions are decomposability and verification asymmetry. Without checkability, holistic debates would require strong assumptions about debater truthfulness or judge comprehension, which conflicts with the oversight goal.

