prompt: |-
  My brother's getting married in the spring and he and his fiancée are blowing something like $40k on one evening. Her brother says the point of the expense is that it's burned and never comes back, so calling it "wasted" misses what it's for: it's a costly signal, and a costly signal is supposed to hurt. I said that sounded wrong to me — if all honesty needs is that faking be more expensive for the low-quality type than for the high-quality one, then a signal can pay for itself and still be honest. He came back with an argument I can't find the hole in, which is annoying:

  (1) A signal is honest exactly when producing it is less costly, or more rewarding, for a high-quality signaler than for a low-quality one. Differential cost at the margin is all the theory really needs.
  (2) Differential cost at the margin is perfectly compatible with the signal having zero net cost, or even paying for itself — a display that pays back more to a high-quality individual is cheaper for them, whatever its total cost adds up to.
  (3) So the theory of costly signaling does not actually require signals to be costly.
  (4) But if signals don't have to be costly, the theory can't explain what it was built to explain: peacock tails, a gazelle bouncing up and down in front of a cheetah instead of running, my brother's $40k — the extravagance, the part that looks pointlessly thrown away.
  (5) Peacocks really are dragging around a ridiculous and expensive tail.
  (6) So either the theory is empty — it's compatible with any old signal, so it predicts nothing — or it can't do the job it was invented for.

  I have a feeling "costly" is doing two different jobs somewhere between (1) and (4), but I can't put my finger on it, and I don't want to just dig in on (1) because it's my own point. Which step do you reject, why did that step look fine, and what does giving it up cost me? If I keep (1) and (2) and drop (4), where is the extravagance actually supposed to come from — and do I owe her brother an apology? Please also flag which parts of this are settled among people who actually work on signaling and which are live fights, and don't hand me a contested claim dressed up as the consenus view. American English, thanks.
reasoning: |-
  Okay, the user's brother is spending $40k on a wedding, and the fiancée's brother argues that this is a costly signal that must be wasteful to be effective. The user initially thought signals could pay for themselves but got stuck in a logical debate. Now they need help finding flaws in the argument presented.

  First, I need to unpack the fiancée's brother's steps. He claims that signaling theory only requires differential costs, not net costs, which challenges the necessity of extravagance. The user feels something's off but can't pinpoint it. 

  Looking at step (1), it's correct that signaling relies on differential costs. High-quality individuals find signals cheaper to produce. Step (2) is also sound—net costs can be zero or negative as long as the differential exists. Step (3) logically follows: signals don't have to be costly in net terms. But step (4) claims this undermines the theory's explanatory power for extravagance. That's where the problem lies.

  The key issue is conflating "differential cost" with "net cost." While step (3) is technically true, it ignores that in many real-world scenarios, the differential cost only exists because of extravagance. For example, a peacock's tail is burdensome, making it harder for low-quality peacocks to fake. If the signal weren't wasteful, it might be easier to imitate, breaking the honesty condition.

  The user's brother-in-law is missing that the theory distinguishes between signals that are costly versus beneficial. Extravagance ensures that the signal remains honest because it imposes a higher burden on low-quality individuals. Without waste, signals could be faked, making them ineffective. 

  The user needs to reject step (4)'s implication that the theory can't explain extravagance. Instead, extravagance is a mechanism to achieve differential costs. The theory still requires costs in the sense of wasteful expenditure to maintain honesty, even if net costs could be zero in some cases. 

  The consensus in signaling theory is that costs (often wasteful) are necessary for honest signals. While there's debate about Zahavi's "handicap principle," empirical evidence supports that extravagance correlates with quality. The user shouldn't apologize; their original point about signals paying for themselves is possible but not typical for extravagant displays like weddings. The fiancée's brother is overlooking why waste is a common solution to the signaling problem.
answer: |-
  You're sharp to catch the tension here, and your instinct about "costly" doing double duty is correct. The hole is in **step (4)** and the interpretation of "costly" between (1-3) and (4-6). Here's the breakdown:

  1.  **Reject Step (4):** Specifically, reject the implication that because signals *can theoretically* be honest with zero net cost (or even net benefit), the theory *cannot explain* extravagance or waste. This step misrepresents *why* extravagance evolves in signaling systems. The theory *predicts* that waste (sunk costs, burdens) is a highly *reliable mechanism* to *generate and maintain* the necessary differential cost at the margin, especially for signals of hard-to-fake qualities.
  2.  **Why Step (4) Looked Fine:** It seems logical: "If the theory allows cheap signals, why are there expensive ones?" The flaw is assuming that extravagance is *only* explained by a *requirement* for net cost within the *definition* of honest signaling. It isn't. Extravagance is explained by its *effectiveness* in solving the signaling problem robustly.
  3.  **What Giving Up Step (4) Costs You:** It costs you the idea that the *theory itself mandates net cost*. You must accept that *in principle*, honest signals *can* exist with net benefit (e.g., mutualistic signals where both parties gain). However, you lose *nothing* in explaining the extravagance of weddings, peacock tails, or gazelle stotting. The theory explains them perfectly well as *one predominant solution* to the problem.
  4.  **Where the Extravagance Comes From (Keeping 1 & 2):** Extravagance arises because:
      *   **Waste Creates Robust Differential Costs:** Burning $40k is a *fantastic* way to ensure the differential cost condition holds. It's very hard for a low-quality signaler (e.g., someone not truly committed, wealthy, or valuing social status highly) to fake spending that much *as easily* as a high-quality signaler. The net loss *creates* the steep differential. A signal that pays for itself (e.g., a useful skill display) might be much easier to fake.
      *   **Hard-to-Fake Qualities Often Require Burden:** Signaling qualities like genetic fitness, wealth, commitment, or confidence often requires imposing a *burden* that only the high-quality individual can bear without undue hardship. The peacock's tail *is* a burden – it drains resources, makes flying harder, attracts predators. Its extravagance *is* the cost that makes it honest. A gazelle stotting *wastes* energy and time it could spend fleeing, demonstrating its confidence/speed. The waste *is* the signal's honesty guarantee.
      *   **Evolutionary Stability:** Signals that are *net beneficial* are vulnerable to invasion by cheaters who mimic the signal without having the quality. Adding waste (a net cost) makes cheating unprofitable for low-quality types, stabilizing the honest signal. High-quality types can "afford" the waste; low-quality types cannot.
      *   **Screening Mechanism:** Extravagance acts as a screen. Only those truly possessing the underlying quality (wealth, commitment, fitness) are willing/able to pay the high, sunk cost. The cost itself deters low-quality imitators.
  5.  **Do You Owe Her Brother an Apology?** Not for the core theory. Your original point (signals *can* pay for themselves and be honest) is **technically correct** within signaling theory. Where you might have underestimated his point is in **failing to articulate *why* extravagance is such a common and powerful *solution*** to the signaling problem, especially for the types of qualities weddings signal (commitment, family wealth, social status). His observation about the *psychological impact* ("it's supposed to hurt") and the link to waste is astute *empirically* and *functionally* for these signals, even if his step (4) overreached theoretically. Acknowledge his insight into the *function* of waste, but stand by the technical accuracy of your initial point.

  **Consensus vs. Live Fights (Flagged as Requested):**

  *   **Settled Consensus:**
      *   **(1) & (2):** Differential cost/benefit at the margin is the *core mathematical requirement* for honest signaling. Net cost is *not* theoretically required. Signals can be net beneficial (mutualisms) or net costly. (Spence 1973; Grafen 1990; Maynard Smith & Harper 2003).
      *   **(3):** Therefore, signaling theory *as a formal framework* does not strictly *require* signals to be "costly" in the sense of having a net negative payoff. The term "costly signaling" is partly historical/mnemonic.
      *   **(5):** Extravagant, wasteful signals like peacock tails *exist* and *are* explained by signaling theory.
      *   The *handicap principle* (Zahavi 1975) – the idea that signals must be costly to be honest – is **not** the most general formal model of signaling. It's a specific (and very important) *mechanism* that guarantees honesty through net cost, but not the only possible one.

  *   **Live Fights/Active Debates:**
      *   **The Prevalence and Necessity of Net Costs:** While net costs aren't *theoretically required*, there's intense debate about how *common* or *necessary* net costs (handicaps) are in explaining *specific biological and social phenomena*.
          *   Proponents of the handicap principle argue it's the *primary* or *only robust* mechanism for signals of hard-to-fake qualities like genetic fitness (Zahavi, Grafen, Getty).
          *   Critics argue mechanisms like indexical signals (physically impossible to fake) or receiver-dependent costs/benefits are often more important, and that many apparent handicaps might actually be efficient or beneficial investments (Dawkins & Guilford; Lachmann, Számadó & Bergstrom; Higham).
      *   **"Cost" Definition:** Defining and measuring "cost" biologically (energy, time, risk, opportunity cost) and socially (money, effort, social capital) is complex and contested. Is the cost the *investment* or the *net loss*?
      *   **Application to Human Culture:** Applying signaling theory to human cultural practices (like weddings) is inherently messy. While widely done, debates rage about the relative importance of signaling vs. other functions (tradition, emotion, community bonding), the specific qualities being signaled, and the validity of interpreting cultural expenses through this lens.

  **Conclusion:** You were right about the core theory (signals don't *need* net cost). Her brother was right about the *functional role* of waste in making signals like weddings work as credible displays ("it's supposed to hurt"). His step (4) mistakenly conflated the *theoretical possibility* of cheap signals with the *theoretical inability to explain waste*. Signaling theory explains extravagance *beautifully* as a highly effective, often evolutionarily stable, mechanism to generate the *differential cost* needed for honesty when signaling hard-to-fake qualities. No apology needed for your point, but credit his insight into the *purpose* of the waste. The extravagance comes from its power to reliably separate the high-quality from the low-quality signalers by imposing a burden only the former can truly bear.
