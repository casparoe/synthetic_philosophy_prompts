prompt: |-
  You are a philosopher of mind who specializes in the theory of emotion, and I want a careful answer rather than a survey. Before proposing anything general, work through the cases one at a time and note, for each, what each of the three usual families of accounts is committed to saying — emotions as evaluative judgments, emotions as perceptions of value, emotions as bodily feelings — and where your own verdict diverges from each.

  Here are my verdicts, given on gut, held with varying confidence:

  - Phobic fear of a spider behind glass, while I sincerely judge it harmless: an emotion, and it is about that spider.
  - Diffuse dread at 3 a.m. in a strange hotel room, with no object I can name — call this ambient: an emotion, though I cannot say what it represents.
  - Pity for a character in a novel I know to be fictional: an emotion, and directed at her.
  - Fury at an airline's automated rebooking system, discharged at the gate agent: the anger is about the system, not the agent, even though it feels aimed at her.
  - A flicker of irritation at a slow elevator, gone before I would call it anything — call these thin: still an emotion, a minimal one.
  - The heart-pounding jolt after a near miss in traffic, before any thought of danger: not yet an emotion, only a bodily storm.
  - Repressed anger: the person denies it, the pattern of their behavior shows it, and in therapy they later recognize it as having been there all along: an emotion.
  - The full physiological profile of fear during a sleepwalking episode, followed by avoidance of the room, with no experience and no memory whatsoever: I go back and forth on this one and lean toward no.
  - Grief a year on, rarely felt, but still organizing plans, attention and conversation: an emotion, though barely felt.

  My own stab at a principle: an emotion is any state that has a valence, is directed at some target (possibly vague, fictional, or mistaken), and has the job of coordinating attention, motivation and bodily response with respect to that target; feelings are optional symptoms, and evaluative judgment is one way, but not the only way, of settling what the target is.

  Test that formulation against the list. Does any account of the three families, or some hybrid of them, return my verdicts more cleanly than mine does? Where mine fails, say which clause fails and on which case. Which of my verdicts do you think I should give up, and why? Finally, state what the account you end up defending predicts for two cases I have not listed: being moved by instrumental music, and feeling ashamed of a friend's behavior in which I played no part.
reasoning: |-
  Okay, the user is a philosopher of mind specializing in emotion theory. They've laid out specific cases and their gut verdicts on whether each counts as an emotion. They've also proposed their own principle defining emotion. My task is to analyze each case through the three main theories—judgmentalism, perceptualism, and feeling theory—then compare those outcomes to the user's verdicts. After that, I need to test the user's proposed principle against their cases, identify where it fails, suggest any verdict revisions, and apply the final account to new cases (music and vicarious shame).

  First, I'll go through each of the user's nine cases systematically. For each, I'll note what judgmentalism (emotions as evaluative judgments), perceptualism (emotions as value perceptions), and feeling theory (emotions as bodily feelings) would say. Then I'll compare that to the user's verdict. The user's principle centers on valence, intentionality (target direction), and functional coordination, with feelings and judgments as non-essential features. 

  Starting with the spider phobia case: The user thinks it's an emotion about the spider despite judging it harmless. Judgmentalism struggles here because it requires evaluative judgment, which contradicts the sincere belief of harmlessness. Perceptualism handles this better by allowing a perception of threat despite judgment. Feeling theory would call it an emotion but misattribute the target to bodily states. The user's principle works here—it has valence (fear), target (spider), and function (avoidance). 

  Next, ambient dread: User says emotion without a clear object. Judgmentalism fails by requiring an object. Perceptualism might stretch to "objectless unease." Feeling theory gets the phenomenology right but misses intentionality. The user's "vague target" covers this well. 

  Fictional pity: User says emotion directed at character. Judgmentalism conflicts because we don't believe the character is real. Perceptualism can accommodate "as-if" value perception. Feeling theory would reduce it to bodily states. User's principle allows fictional targets. 

  Displaced anger (at airline system vs. agent): User says emotion is about the system, not the agent. Judgmentalism would tie anger to the judgment of wrongdoing, which is about the system. Perceptualism might confuse the proximate target (agent). Feeling theory ignores targets entirely. User's principle correctly identifies the system as target via evaluative stance. 

  Thin irritation: User calls it minimal emotion. Judgmentalism demands full judgment—likely too strict. Perceptualism can handle brief value perceptions. Feeling theory accepts it as a faint feeling. User's functional criterion ("coordinating attention") might be too heavy for something fleeting. 

  Startle response: User says not emotion yet—just bodily reaction. All three theories partially fail here: judgmentalism/perceptualism by requiring cognition, feeling theory by overcounting. User correctly excludes it as lacking intentionality. 

  Repressed anger: User calls it emotion despite denial. Judgmentalism struggles with unconscious judgments. Perceptualism isn't built for non-conscious states. Feeling theory misses the latent intentionality. User's principle handles it via functional coordination (behavior patterns). 

  Sleepwalking fear: User leans toward not an emotion. Judgmentalism/perceptualism fail without cognition. Feeling theory might call it emotion based on physiology. User's principle excludes it—no experience, no coordination? But the avoidance suggests residual function. 

  Chronic grief: User says emotion despite being unfelt. Judgmentalism focuses on episodic judgments. Perceptualism requires perception. Feeling theory demands feelings. User's principle works—latent valence/orientation still coordinates life. 

  Now testing the user's principle: It mostly holds but stumbles on thin irritation (is "coordinating attention" too strong for a flicker?) and sleepwalking (avoidance implies function). The user might need to relax "coordinating" to include dispositional or minimal cases, or exclude sleepwalking by requiring experience. 

  Verdicts to reconsider: 
  - Sleepwalking fear: If avoidance shows functional coordination, maybe it should count as unconscious emotion. 
  - Thin irritation: If it's too minimal to coordinate anything, perhaps it's a proto-emotion. 

  Hybrid alternatives: Neo-Jamesian (feelings + appraisal) might handle thin cases better; perceptualism + dispositionalism could cover unconscious cases. But the user's functionalist core is robust. 

  New cases: 
  - Instrumental music: Under user's principle, "being moved" has valence and functional orientation (e.g., tears, absorption), but the target is vague—the music itself or abstract patterns? Likely counts as emotion. 
  - Vicarious shame: Valence and clear target (friend's behavior), function (distancing, blushing)—counts despite no personal involvement. 

  Final defense: A teleosemantic-perceptual hybrid—emotions as embodied, intentional states with biological/social functions of tracking significance. This explains all cases: phobia (misaligned tracking), ambient (general threat vigilance), repressed (dysfunctional tracking), etc. 

  Key move: Decouple "emotion" from conscious feeling while preserving intentionality via evolutionary design. This saves repressed anger and chronic grief, excludes pure startles, and explains music/shame through social contagion mechanisms.
answer: |-
  As a specialist in emotion theory, I'll honor your request for rigor by analyzing each case through the three dominant frameworks before evaluating your proposal. My approach integrates analytic philosophy with embodied cognition, favoring a **teleosemantic-perceptual hybrid** as the most defensible account. Let's dissect your cases systematically.

  ### **Case-by-Case Analysis**
  *(J = Judgmentalism; P = Perceptualism; F = Feeling Theory; U = Your Verdict)*

  1. **Phobic fear of a harmless spider**  
     - J: *Not an emotion* (contradicts sincere judgment of harmlessness).  
     - P: *Emotion* (perception of threat despite judgment; "doxastic negligence").  
     - F: *Emotion* (fear = feeling of physiological arousal).  
     - U: Emotion ✓ | Diverges from J.  
     *My view aligns with P: Phobias manifest as perceptual illusions of value.*

  2. **Ambient dread (no object)**  
     - J: *Not an emotion* (requires intentional object).  
     - P: *Ambiguous* (could be "objectless perception of disvalue," stretching the model).  
     - F: *Emotion* (dread = diffuse bodily feeling).  
     - U: Emotion ✓ | Diverges from J and P.  
     *My view: This *is* an emotion; intentionality can be non-propositional (e.g., "the world feels threatening").*

  3. **Pity for fictional character**  
     - J: *Not an emotion* (no evaluative belief about real entity).  
     - P: *Emotion* ("as-if" perception of value; akin to aesthetic response).  
     - F: *Emotion* (pity = feeling of sadness/sympathy).  
     - U: Emotion ✓ | Diverges from J.  
     *My view: Fictional emotions are quasi-perceptions scaffolded by imagination.*

  4. **Displaced anger at gate agent**  
     - J: *Emotion misattributed* (anger must track judgment of wrongdoing → system, not agent).  
     - P: *Emotion about system* (perception of injustice), *action toward agent* (motor discharge).  
     - F: *Emotion* (anger = feeling directed at whatever provokes arousal).  
     - U: Emotion about system ✓ | Diverges from F (which conflates target and trigger).  
     *My view: P captures this best—emotion represents the system's flaw, while behavior targets the agent.*

  5. **Thin irritation at elevator**  
     - J: *Not an emotion* (lacks full evaluative judgment).  
     - P: *Emotion* (micro-perception of frustration).  
     - F: *Emotion* (feeling = minimal arousal pattern).  
     - U: Emotion ✓ | Diverges from J.  
     *My view: "Thin" cases are proto-emotions—incipient perceptual appraisals.*

  6. **Startle response pre-thought**  
     - J: *Not an emotion* (no evaluation).  
     - P: *Not an emotion* (no value perception, only reflex).  
     - F: *Emotion* (feeling = physiological jolt).  
     - U: Not emotion ✓ | Diverges from F.  
     *My view: Correct exclusion—this is a Jamesian "bodily storm" without intentionality.*

  7. **Repressed anger**  
     - J: *Not an emotion* (unconscious ≠ judgment).  
     - P: *Ambiguous* (perception typically requires phenomenology).  
     - F: *Not an emotion* (no felt state).  
     - U: Emotion ✓ | Diverges from all.  
     *My view: *Is* an emotion—a dispositional orientation with functional impact (e.g., attentional biases).*

  8. **Sleepwalking fear/avoidance**  
     - J: *Not an emotion* (no cognition).  
     - P: *Not an emotion* (no perceptual experience).  
     - F: *Borderline* (physiology resembles emotion).  
     - U: Leans not emotion | Diverges minimally.  
     *My view: Not an emotion—lacks *world-directed* intentionality (avoidance is procedural, not evaluative).*

  9. **Chronic unfelt grief**  
     - J: *Not an emotion* (no occurrent judgment).  
     - P: *Not an emotion* (no perceptual experience).  
     - F: *Not an emotion* (no feeling).  
     - U: Emotion ✓ | Diverges from all.  
     *My view: *Is* an emotion—a dormant evaluative stance that structures agency (e.g., life decisions).*

  ---

  ### **Testing Your Proposed Principle**  
  *"An emotion is any state that has a valence, is directed at some target (possibly vague, fictional, or mistaken), and has the job of coordinating attention, motivation and bodily response with respect to that target."*

  - **Successes**:  
    - Handles phobia (target mistaken), ambient dread (vague target), fictional pity (fictional target), and repressed anger (target implicit in functional role).  
    - Excludes startle response (no target-directed coordination).  
    - Explains chronic grief (organizes behavior via latent intentionality).  

  - **Failures**:  
    - **Clause failing**: "Coordinating attention, motivation, and bodily response."  
      - **Case 5 (thin irritation)**: A flicker may lack *coordination*—it's a blip without downstream effects. Your principle overextends here.  
      - **Case 8 (sleepwalking)**: Avoidance *does* coordinate behavior with a "target" (the room), yet you (and I) exclude it. Your principle risks overinclusion.  

  - **Verdicts to reconsider**:  
    1. **Sleepwalking fear (Case 8)**: Your "no" is justified. Avoidance is subcortical (e.g., amygdala-driven), lacking the *integrative function* that defines emotions.  
    2. **Thin irritation (Case 5)**: Call this a *pre-emotion*—your principle's coordination requirement is sound but under-specified. Minimal emotions need only *micro-coordination* (e.g., momentary attentional capture).  

  ---

  ### **Hybrid Account Returning Your Verdicts**  
  A **Teleosemantic-Perceptual Hybrid** outperforms your principle and classical theories:  
  > Emotions are *embodied perceptions of value*, selected to track relational affordances (e.g., threats, losses), with intentional content fixed by biological/social functions. Valence is the marker of affordance valence (approach/avoid), and targets are constituted by what the state *biologically functions to track*.  

  - **Advantages over your principle**:  
    - Explains **thin irritation** (micro-perception of impediment to goals).  
    - Excludes **sleepwalking** (no perceptual *content*—avoidance is decoupled from affordance-tracking).  
    - Grounds **repressed anger** in dysfunctional tracking (target exists as the *proper object* the state evolved to detect).  
    - Justifies **ambient dread** as noise in threat-detection systems.  

  - **Diverges from you only on Case 5**: Thin cases *are* emotions if they function to detect value (even fleetingly).  

  ---

  ### **Predictions for New Cases**  
  **1. Being moved by instrumental music**  
  - **My account**: *Emotion*—Music is perceived as expressing value (e.g., triumph, sorrow) via embodied simulation. Target is the music's "affordance" for emotional communion.  
  - **Your principle**: Likely emotion (valence + target [music] + coordination [e.g., tears, absorption]).  

  **2. Vicarious shame for friend's behavior**  
  - **My account**: *Emotion*—Shame functions to track social devaluation; your identity-connection makes the friend's act a perceived threat to *your* status. Target: the act *as it reflects on you*.  
  - **Your principle**: Emotion (valence + target [friend's act] + coordination [e.g., blushing, distancing]).  

  ---

  ### **Conclusion**  
  Your principle is largely correct but needs refinement:  
  1. **Replace "job" with "biological function"** to avoid overextension (e.g., sleepwalking avoidance isn't *for* tracking value).  
  2. **Include "embodied appraisal"** to anchor intentionality.  
  3. **Accept thin emotions**—minimal coordination suffices.  

  The teleosemantic-perceptual hybrid I defend preserves your verdicts (except upgrading thin cases) while handling the new cases cleanly. It treats emotions as **evolutionarily designed perceptions of what matters**, with targets fixed by what the system *functions to detect*—whether conscious, repressed, or fictional. This grounds your insights in a naturalistic framework.
