  (ii) **Inference to innate structure**: Because the PLD underdetermines the grammar, the learner must have an innate restriction on the hypothesis space (a strong inductive bias) that favors the correct grammar (e.g., structure-dependent rules) over incorrect ones (e.g., linear rules). Without such a bias, the learner would not converge to the correct grammar given the available data.

  In ML terms: The underdetermination implies that without a strong prior (or a restricted hypothesis class) that favors the correct type of grammar, the learning algorithm would not be able to generalize correctly. The innate structure is a form of architectural bias or a prior over the hypothesis space that makes the correct grammar identifiable from the limited data.

