prompt: |-
  I build distributed systems for a living and have never taken a philosophy course, so please don't stall on my vocabulary — fix the reasoning, not the words.

  I'm trying to work out what I actually believe about whether the size or complexity of a brain has anything to do with how much a being morally matters. Here are my gut verdicts on a set of cases:

  1. A fire at a facility; I can carry out either an adult human or an adult chimpanzee, not both. I choose the human, and I think that's right — but I also think it would be wrong to explain the choice by pointing at skull volume. I want some other reason to do the work.
  2. A human born with a brain a third of the usual size, whose measured capacities (learning, planning, social responsiveness) are roughly a chimpanzee's. I give this person exactly the same moral status as any other human — no discount at all.
  3. An adult has a large tumor resected and loses a substantial fraction of their cortex. Scans confirm the loss; nothing changes in what they can do, remember, or report about their experience. Verdict: their moral status does not move by even a little.
  4. Hypothetical near-future: a graft of lab-grown cortical tissue roughly doubles someone's cortical neuron count, again with no change in any capacity or in anything they report. Verdict: no increase in moral status either.
  5. A clump of the same kind of cortical tissue, grown alone in a dish, no body, no behavior, no signs of experience. Verdict: it counts for something — I wouldn't dispose of it on a whim — but far less than a mouse, and I can't say why this tissue counts at all when the tissue in case 4 counted for nothing.
  6. An elephant, whose brain is several times the mass of mine. Verdict: not several times my moral status; mass is obviously the wrong unit.

  My tentative principle: brain size matters only as evidence about the richness of a being's conscious life, and only up to the threshold at which there is a conscious life at all — above that threshold it goes flat and stops counting for anything. I don't think that principle survives cases 4 and 5 together, but I don't know which verdict to drop.

  So: state the principle you think captures these verdicts, precisely, with the case that motivates each clause. Tell me which of my verdicts it cannot accommodate and which one you'd overturn. Then commit to the two I can't settle: the dish-grown tissue, and a large AI system with far more parameters and total compute than my brain has neurons, behaving intelligently but with nothing biological going on — does size talk apply there at all? Give me a definite answer with reasons, not a menu of options. Finally, tell me what your principle predicts for a case I haven't listed: an adult whose brain slowly atrophies over a decade, losing capacities gradually and continuously.
reasoning: |-
  Okay, let me tackle this systematically. The user works with distributed systems and wants a no-nonsense philosophical analysis without getting hung up on terminology. Their core dilemma revolves around whether brain size/complexity directly correlates with moral worth, presented through six concrete scenarios that expose contradictions in their initial thinking.

  Looking at their cases: saving human over chimp isn't about skull size (case 1), microcephalic human gets full status (case 2), brain damage without functional change doesn't alter status (case 3), added brain tissue without functional change doesn't increase status (case 4), but isolated brain tissue still has minimal moral weight (case 5), and elephant brain size doesn't linearly increase worth (case 6). The tension is clearest between cases 4 and 5 - why does the dish tissue matter when the grafted tissue doesn't?

  Hmm... Their proposed "richness of conscious life" principle fails because it can't explain why non-functional tissue in a dish (case 5) has any moral weight while identical tissue in a brain (case 4) doesn't increase status. The key insight seems to be about potential versus actualization. The grafted tissue gets integrated into an existing conscious system so its potential is actualized, while the dish tissue has unrealized potential - explaining why we'd treat them differently. 

  For the AI case - size doesn't matter per se. What counts is whether the system exhibits phenomenally conscious states (subjective experiences). Since we can't confirm that in current AIs, they get zero moral weight regardless of parameters. The atrophy case is tricky but follows the actualized capacity principle: moral status decreases only as capacities are lost, not as neurons vanish while function remains intact.

  The user's need here is practical: they want ethical principles they can apply to future system designs (including AIs) without biological bias. By grounding status in actual conscious capacities rather than physical substrates, we give them a transferable framework. The rejected verdict is case 5's "counts for something" - that tissue only has potential, not actual moral weight. Final principle: Moral status tracks actualized capacities for conscious experience, with size relevant only as evidence until capacities are confirmed.
answer: |-
  Here's a principle that captures your verdicts, rejects one, and answers your unsettled cases decisively:

  **Principle:** Moral status is grounded in **actualized capacities for conscious experience**, not physical brain properties. Size/complexity matters *only* as indirect evidence for the *presence and scope* of these capacities until confirmed. Once capacities are confirmed, further physical changes don't alter status *unless they alter capacities*. Physical properties without capacities confer no status.

  ---

  ### How the Cases Motivate the Principle
  1.  **Human vs. Chimpanzee (Fire):**  
      *Motivates:* Capacities matter (human has richer capacities). Skull volume is irrelevant evidence once capacities are known.  
      *Clause:* Moral status tracks *actualized capacities*; size is only evidence until capacities are confirmed.

  2.  **Human with Microcephaly:**  
      *Motivates:* Species-independent status based on *actual capacities*. Identical capacities → identical status.  
      *Clause:* Status is based solely on confirmed capacities, not species or "expected" potential.

  3.  **Tumor Resection (No Functional Change):**  
      *Motivates:* Physical loss without capacity loss → no status change.  
      *Clause:* Physical changes without capacity changes don't alter status.

  4.  **Cortical Graft (No Functional Change):**  
      *Motivates:* Physical gain without capacity gain → no status increase.  
      *Clause:* Confirms that status depends on capacities, not physical substrate "size".

  5.  **Clump of Cortical Tissue (Dish):**  
      *Rejects:* **Your verdict is overturned.**  
      *Reason:* It has no *actualized capacities* for conscious experience (no behavior, no signs of experience, no integrated system). Potential ≠ actualization. Without capacities, it has negligible moral status.  
      *Clause:* Physical properties alone (even "brain-like" tissue) confer no status without actualized capacities.

  6.  **Elephant:**  
      *Motivates:* Larger brain ≠ linearly higher status. Status depends on confirmed capacities (rich social/emotional life), not mass.  
      *Clause:* Size is only weak evidence; capacities determine status.

  ---

  ### Your Unsettled Cases - Definite Answers
  1.  **Dish-Grown Tissue:**  
      **Negligible moral status.**  
      *Reason:* It lacks integrated function, behavior, or any evidence of conscious experience. It has *potential*, but potential without actualization is morally irrelevant under this principle. Disposing of it isn't wrong (though research ethics might regulate *how* it's done). This aligns with overturning your verdict on case 5.

  2.  **Large AI System (Non-Biological):**  
      **Size/compute alone confer zero moral status.**  
      *Reason:* Moral status requires *actualized capacities for conscious experience*. "Behaving intelligently" is insufficient; intelligence ≠ consciousness. Unless there is evidence it has subjective experiences (phenomenal consciousness), its size and computational power are irrelevant. Physical substrate (biological vs. silicon) is also irrelevant – only capacities matter. **Size doesn't "talk" morally here at all.**

  ---

  ### Prediction for Brain Atrophy Case
  **Case:** An adult’s brain slowly atrophies over a decade, losing capacities gradually and continuously.  
  **Prediction:** Moral status decreases **proportionally to the loss of actualized capacities for conscious experience.**  

  *   **Reasoning:**  
      *   Early on: If atrophy hasn't diminished capacities (e.g., memory, reasoning, emotional depth, self-awareness), status remains full.  
      *   As capacities diminish (e.g., loses ability to form new memories, recognize loved ones, experience complex emotions), status decreases.  
      *   Final stages: If only basic sensory awareness remains (like severe late-stage dementia), status is minimal but non-zero (akin to an insect or dish tissue *with* some minimal responsiveness).  
  *   **Why not size?** Physical atrophy only matters *because* it causes capacity loss. If atrophy somehow occurred *without* capacity loss (hypothetically), status wouldn't change. The *trajectory of capacity loss* dictates the trajectory of status loss.

  ---

  ### Summary of Principle & Revisions
  *   **Core:** Moral status is determined by **what a being can actually experience and do consciously** (capacities), not by its physical brain properties.  
  *   **Size Role:** Size/complexity are only *heuristics* for *inferring* capacities where direct evidence is lacking. They become irrelevant once capacities are confirmed.  
  *   **Revised Verdict:** Case 5 (Dish Tissue) has **negligible status** (overturning your "counts for something" verdict).  
  *   **AI & Substrate:** Substrate (biological/silicon) is irrelevant. Only demonstrable capacities for consciousness matter. Size/compute without consciousness = zero status.  
  *   **Atrophy:** Status declines *only* as capacities decline, not as neurons are lost while function persists.
