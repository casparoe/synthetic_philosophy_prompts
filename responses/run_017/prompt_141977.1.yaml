answer: |-
  ## Excerpt from *The Plain Neural Style Guide (7th Revision)*  
  **Issued by the Office of Descriptive Standards, Compliance Directorate**  

  **Prefatory Note**  
  This edition supersedes all prior versions. The Office recognizes the persistence of attitudinal language patterns within public discourse and official documentation. Such patterns constitute a significant barrier to conceptual hygiene and impede accurate environmental calibration. The *Guide* provides mandatory replacements for obsolete terminology derived from failed propositional-attitude frameworks ("belief," "desire," "intention," etc.). These replacements reflect the empirically validated neural-state ontology. Compliance is not merely stylistic; it is a corrective measure against persistent explanatory error. Failure to adopt these standards risks perpetuating conceptual contamination and misrepresenting human behavioral dynamics. Revision is required.  

  ---

  **Belief**  
  *Noncompliant Usage:* Attributing a propositional attitude of acceptance (e.g., "She believes it will rain").  
  *Approved Replacement:* Reference to the dominant activation pattern within relevant predictive subsystems and its environmental calibration status.  
  *Example (Noncompliant):* "Kiran *believed* the report was accurate, despite the anomalies."  
  *Example (Compliant):* "Kiran exhibited a dominant predictive activation pattern (prefrontal cluster γ-7) *calibrated to the report's data stream*, exhibiting low sensitivity to the anomalous inputs."  

  **Desire**  
  *Noncompliant Usage:* Attributing a conative state directed at a future state of affairs (e.g., "He wants peace").  
  *Approved Replacement:* Specification of the current reward-system activation gradient and its influence on trajectory within the behavioral state-space.  
  *Example (Noncompliant):* "The child *wanted* the brightly coloured toy more than the food."  
  *Example (Compliant):* "The child's reward-system activation gradient showed a steep incline *towards the high-saturation visual stimulus object*, overriding the basal metabolic maintenance trajectory."  

  **Intention**  
  *Noncompliant Usage:* Attributing a commitment to future action (e.g., "They intend to protest").  
  *Approved Replacement:* Description of the current motor-planning cascade and its projected behavioural output sequence, given prevailing environmental inputs and internal state.  
  *Example (Noncompliant):* "Maya *intended* to file the grievance before the deadline."  
  *Example (Compliant):* "Maya's motor-planning cascade (supplementary motor area sequence Θ-4) *was configured for document-submission actions*, contingent on temporal proximity markers matching the regulatory cycle endpoint, *unless the writer means* to imply an unresolved inhibitory signal conflict." **(See: Inhibitory Override Patterns)**  

  **Because / Therefore**  
  *Noncompliant Usage:* Implying rational causation or justification based on propositional content (e.g., "She acted *because* she thought it was right," "It was wrong, *therefore* he refused").  
  *Approved Replacement:* Sequential or correlational linkage only. Use temporal markers ("followed," "preceded," "coincident with") or state-transition descriptors ("triggered," "inhibited," "modulated by").  
  *Example (Noncompliant):* "Elara voted against the measure *because* she *believed* it was unjust, *although* it was statistically optimal."  
  *Example (Compliant):* "Elara's voting motor output *followed* the activation of her anterior cingulate conflict-detection network (Pattern Delta-3) *coincident with* the measure's presentation. The network activation *correlated negatively* with the subsequent statistical optimization input stream, irrespective of its normative calibration status."  

  **Predictive Heuristic (Authorized Contexts Only)**  
  *Noncompliant Usage:* Unsupervised reliance on attitudinal vocabulary for behavioural forecasting.  
  *Approved Replacement:* Use ODS-approved neural-state descriptions for all formal reporting. In informal planning contexts *only*, limited predictive shorthand is tolerated as a convenience measure, explicitly labelled as such.  
  *Example (Noncompliant):* "We *think* he *wants* the promotion, so he *will likely* accept the transfer."  
  *Example (Compliant):* "For predictive convenience: [Subject] exhibits reward-gradient alignments consistent with common promotion-acceptance sequences (Referential Shorthand P-A7). Formal analysis requires audit of current dorsolateral prefrontal cortex goal-representation matrices against transfer-task parameters."  

  **First-Person Qualia Report**  
  *Noncompliant Usage:* Direct quotation or report of subjective feeling states (e.g., "It seems cold to me," "I am in pain," "I feel doubtful").  
  *Approved Replacement:* Describe the reported internal sensory or affective input stream and its observed physiological/neural correlates. Attribution is to the reporting system's output, not an internal "experience."  
  *Example (Noncompliant):* "'*It seems to me* the evidence is weak,' Jonas stated, *feeling* uncertain."  
  *Example (Compliant):* "Jonas generated a verbal report indicating 'sensory input stream classified as low-evidence weight,' *coinciding with* elevated amygdala activity (Profile Sigma-2) and reduced confidence-metric output from the orbitofrontal assessment module."  

  **Promise (Utterance Type)**  
  *Noncompliant Usage:* Describing an utterance as creating an obligation or commitment (e.g., "He promised to pay," "She apologized sincerely").  
  *Approved Replacement:* Describe the utterance as a specific class of social signalling output (P-Type or A-Type), its immediate effect on recipient neural states, and its likely reinforcement history.  
  *Example (Noncompliant):* "The Minister *promised* reforms, *intending* to restore trust."  
  *Example (Compliant):* "The Minister produced a P-Type social signalling output (variant 4b: future action declaration) *directed at* the audience's default-mode network, *previously reinforced* by positive valence shifts in similar socio-political contexts. Recipient oxytocin levels showed transient increase."  

  **As-If Instrumentalism**  
  *Noncompliant Usage:* Suggesting it is pragmatically useful to treat agents *as if* they had beliefs/desires, without ontological commitment.  
  *Approved Replacement:* Noncompliant. This constitutes a conceptual regress. Predictive success achieved through such methods is adequately explained by the underlying neural dynamics being modelled, however imperfectly. The instrumental stance is redundant and perpetuates the very framework requiring elimination.  
  *Example (Noncompliant):* "For practical purposes, we treated the negotiators *as if* they genuinely *wanted* a deal."  
  *Example (Compliant):* "Behavioural modelling utilized inputs correlating with high reward-gradient alignment towards agreement-finalization states within the negotiators' neural frameworks." *(Avoid any "as-if" construction.)*  

  ---

  **Note to the Author:**  
  The objection that bites hardest is the **self-referential inconsistency** exemplified in the **Intention** entry ("*unless the writer means*..."). The guide *must* tacitly rely on the very intentional vocabulary (meanings, purposes, implications) it seeks to eliminate to direct users *how* to eliminate it. This isn't just awkward phrasing; it reveals that the act of prescribing redescriptive norms inherently requires attributing propositional content – intentions, understandings, communicative goals – to both the guide writer and the reader. Eliminativism cannot furnish a coherent, non-intentional account of *why* or *how* one should follow the guide's instructions, or what "compliance" signifies beyond brute neural causation. The guide implicitly acknowledges a realm of norms (correctness, error, understanding the rule) that its explicit ontology cannot accommodate. The liberty taken is compressing this into one glaring instance; the contested reading is whether eliminativism can truly account for normativity *at all*, even its own. This entry shows it stumbling over that chasm.
