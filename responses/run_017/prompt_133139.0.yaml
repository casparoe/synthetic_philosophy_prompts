prompt: |-
  Hey — I price weird one-off risks at a small specialty insurer: satellite launches, film shoots, music festivals, one custom turbine going overland through three countries. I write maybe 5–8 quotes a week and every single one needs a rate for something that has never happened in exactly this form before. My boss wants a written procedure, and I've been told to ground it in whatever philosophy actually knows about the reference class problem. But it has to be runnable by a junior analyst with a stats minor and no philosophy, in about half an hour, and it has to survive an audit where the regulator points at a file and says "why this class and not that one?"

  Here's the mess I actually live in. The same event slots into a pile of different classes — small-launch-vehicle flights, flights using this engine family, flights using this engine with the revised turbopump, flights with a second stage assembled in the last eighteen months, flights where the payload customer is a first-timer — and those classes give rates that differ by an order of magnitude. Right now people either grab whichever class produces the number they were hoping for, or they average two of them, which I'm fairly sure is just incoherent. We've also had at least one case where someone built the class *after* seeing a couple of losses (three claims all involved the same rigging subcontractor, so new jobs got priced as "jobs involving that subcontractor"), and I genuinely can't tell whether that's cheating or whether it's the correct move.

  Stuff the procedure has to handle, none of which I know how to do:

  - How do you even generate the candidate classes, and which features are allowed into the description? Machine age, operator hours, weather window, supplier, whether the client has done this before. Some of those are doing causal work and some are just correlated with the thing, and half the time we can't tell which.
  - How narrow do you go? The narrow class always feels more honest until you realize it has four exposures, or zero events, or one event out of one and a 100% loss rate that we obviously cannot charge.
  - What happens when the broad class and the narrow class disagree by like 10x? Do we escalate, and who signs — me, the senior underwriter, or the chief actuary? Right now: nobody knows, it just depends who's in the office.
  - Classes defined partly by the outcome, or by facts we only learn later. My rule of thumb is that you can only use what was on your desk at quote time, but I can't say why, and I suspect it's not quite that clean.
  - Cases where there is no rate: nobody has ever done this, or the world moved (new engine revision, new regulation, new supplier) so the old frequency means nothing. I would much rather the procedure say "no defensible number, decline to quote" than that it manufacture one and we find out later.
  - Output format. Every file needs a "class string" — a one-line description of the class and where the rate came from — because renewals come back a year later and a different analyst has to re-derive it, and we've already been burned by someone writing "similar jobs" in the box.
  - Our home-brewed rule of thumb, which nobody can defend: go to the narrowest class that has at least ten exposures and whose rate is within 10x of its parent class. Is that doing real work or is it a superstition? Should I throw it out? Same question for our other internal rule: never quote more than 50% below the broadest defensible class rate.

  What I want from you: the questions, in order; what counts as an adequate answer to each one; where the procedure stops with a no; and where it hands the question to a human because it's a question about appetite, fairness, or values rather than a fact about the risk. Be honest about which steps are judgment calls with a number stapled to them, and be honest about what the procedure fundamentally cannot deliver — my worry is that there is no uniquely correct class and the whole thing is just damage control with better paperwork. If that's true, say so and tell me what a well-run damage-control procedure looks like.

  Then run the thing on three live-ish cases:

  1. A first-ever music festival on a river floodplain. Twenty years of flood records for the region, four years for that particular stretch of river, no track record for the promoter, and a fixed date we can't move.
  2. A satellite launch on a new small vehicle: two flights, one failure. The engine family has sixty flights with three failures. There's also a narrower subset — this engine with the revised turbopump — with nine flights and no failures. Three different analysts here picked three different classes and I can't tell which of them is wrong.
  3. A fleet policy for a delivery company. The sharpest class we can actually defend statistically is built partly out of driver age bracket. Compliance is going to lose their minds. I want to know whether your procedure tells me to use that class anyway, or whether it says "this stopped being a reference class question and became a fairness question" — and if it says that, I want to hear it even though it's not what I want, because I was kind of hoping the machinery would get me off the hook here.

  Oh, and one more: the client in case 3 has offered to let us use a telematics score instead, which predicts about as well but is way harder to explain to a regulator. If the procedure has anything to say about picking between two classes that perform the same, I'd like to hear it, because I suspect it doesn't.
reasoning: |-
  Okay, let me start by really understanding what this user is dealing with. They work at a specialty insurer pricing unique risks like satellite launches and music festivals. Each quote is for something that's never been done exactly that way before. The core challenge is the reference class problem—how to choose the right historical data group when multiple conflicting classes exist.

  The user's boss wants a written procedure grounded in philosophy but executable by a junior analyst in half an hour. It also needs to survive regulatory audits. Current practices are messy: analysts cherry-pick classes or average them, sometimes defining classes after seeing losses. Key issues include generating candidate classes, handling class disagreements, avoiding outcome-based classes, dealing with no-data situations, and documenting clearly.

  First, I need to address the philosophical grounding. The reference class problem comes from Hans Reichenbach and was developed by philosophers like Donald Gillies and statisticians like Nancy Cartwright. The procedure must balance narrow relevance with statistical stability. The user's existing rule of thumb (narrowest class with 10+ exposures within 10x of parent) is a decent heuristic but needs formalization.

  Breaking down the requirements: The procedure must generate candidate classes systematically. Features should be known at quote time and causally relevant. But distinguishing causal from correlative factors is tough. Maybe start with broad industry categories and narrow down based on known risk factors. Documenting each candidate class's rationale is crucial for audits.

  Handling disagreements between classes is tricky. A 10x difference should trigger escalation. The senior underwriter or chief actuary should decide, not based on who's in the office. Documenting the reasons for the final choice will help with regulators.

  Classes defined by outcomes are a no-go. The procedure must enforce using only information available at quote time to prevent cherry-picking. For no-data cases, declining the quote is better than making up a number.

  Output format needs a clear "class string" with criteria and source. This ensures consistency when renewals come up. The existing rule of thumb can be kept but framed as a stopping rule, not a truth.

  Now, the three cases. For the music festival, flood data is limited. The procedure should start broad (regional flood data) but note promoter inexperience. If the narrow class (specific river stretch) has insufficient data, use the regional rate with a loading for newness. Output the class string clearly.

  The satellite launch has multiple classes: vehicle-specific (2 flights, 1 failure), engine family (60 flights, 3 failures), and turbopump subset (9 flights, 0 failures). Vehicle data is too thin. Engine family is stable but turbopump might be relevant. Escalate to senior underwriting since rates conflict. Document the decision.

  The delivery fleet using driver age is a fairness issue. Even if statistically valid, compliance will object. The procedure should flag it as a value judgment. Offer alternatives like telematics, which predict similarly but are less discriminatory. Here, the procedure steps back—it can't resolve ethical questions, only highlight them.

  Underlying all this is the reality that there's no perfect solution. The procedure is about disciplined judgment, not eliminating subjectivity. Documentation and clear rationale are key for audits. The user's worry that it's damage control with paperwork is valid—but good paperwork makes the damage control defensible.
answer: |-
  Here's a procedure grounded in reference class philosophy (Reichenbach, Venn, with nods to modern causal inference) designed for practicality, auditability, and honesty about its limitations. It accepts that **there is no uniquely "correct" class** – the goal is **defensible, consistent, disciplined judgment** that minimizes bias and documents rationale.

  **Core Philosophy Principles Embedded:**
  1.  **Reichenbach's Pragmatism:** Choose the class most *likely* to yield the true probability, balancing specificity and statistical stability.
  2.  **Venn's "Relevant Universe":** The class must share *relevant characteristics* with the risk being priced.
  3.  **Causal Anchor (Where Possible):** Prefer features with a plausible causal link to the loss mechanism.
  4.  **Temporal Integrity:** Only use information available *at quote time*. Classes defined post-loss for *future* pricing based on *past* losses violate this.
  5.  **Transparency & Audit Trail:** The rationale for class choice *must* be documented and reconstructable.

  **The Procedure: "Reference Class Selection for Novel Risks (RCS-NR)"**

  **Who:** Junior Analyst (Stats Minor) + Escalation Paths
  **Time Target:** 25-35 mins (Core Steps 1-5; Escalation adds time)
  **Inputs:** Risk Description, Available Historical Data (Losses & Exposures), Feature Library (Pre-defined permissible features), Underwriting Guidelines (Appetite, Min Premium).
  **Output:** `Class String`, Rate (or "Decline"), Escalation Documentation (if needed).

  **Steps & Questions:**

  1.  **Define Target Event & Gather Base Data (5 mins)**
      *   *Question:* "What specific loss event are we pricing (e.g., Total Loss of Satellite, Flooding Event during Festival, Major Fleet Accident)?" and "What is the absolute broadest, *causally relevant* universe of historical exposures we have for this *type* of event?"
      *   *Adequate Answer:* Clear definition of the peril. Identification of the broadest defensible causal class (e.g., "All Orbital Launches", "All Outdoor Music Festivals", "All Commercial Delivery Fleets"). *Must* have sufficient data (n_min ≥ 10 exposures recommended start point).
      *   *Stops/No:* If no valid broad class exists (n < 5, or utterly irrelevant - e.g., pricing satellite launch using festival data), **Decline: "Insufficient Relevant Historical Data (Broad Class)"**. Escalate to Senior Underwriter if borderline.
      *   *Judgment:* Defining the "type" of event and broadest *causally relevant* universe is inherently judgmental. Causal relevance is key here.

  2.  **Generate Candidate Narrow Classes (7 mins)**
      *   *Question:* "Using only features from the *Pre-approved Feature Library* known *at quote time*, what are plausible narrower sub-classes sharing characteristics *plausibly causal* or *strongly correlated* with the target event?"
      *   *Adequate Answer:* 2-5 candidate sub-classes generated. *Features must be:*
          *   Pre-defined in library (avoids fishing).
          *   Known/Knowable at quote time (e.g., Promoter Experience, Engine Type, Driver Age Bracket - *not* "Subcontractor X" *after* seeing losses).
          *   Plausibly causal (e.g., Engine Type, Flood Zone) OR strongly correlated *and* stable (e.g., Vehicle Age). Document the *rationale* for each feature's inclusion (e.g., "Engine Type: Causal link to propulsion failure"; "Promoter Experience: Strong correlation with risk management quality").
      *   *Stops/No:* If no plausible narrowing features exist (risk is truly unique within broad class), **Use Broad Class Rate**. Proceed to Step 4.
      *   *Judgment:* Selecting which features to consider involves judgment about relevance and causality. The library constrains but doesn't eliminate this.

  3.  **Evaluate Candidate Classes (8 mins)**
      *   *Question:* "Calculate rate (losses/exposures) for Broad Class and each Candidate Narrow Class. Check: (a) Does the narrow class have sufficient data? (Apply n_min rule - see Output), (b) How does its rate compare to its immediate parent class? (Apply Stability Rule - see Output), (c) Is there a clear *causal story* favoring one narrow class?"
      *   *Adequate Answer:* Rates calculated. n_min and stability rule applied. Causal rationale documented for each candidate. Key conflicts identified.
      *   *Stops/No:* If *all* narrow classes fail n_min/stability rules **Use Broad Class Rate**.
      *   *Judgment:* Assessing causal plausibility is a key judgment call. The stability rule provides objectivity but the threshold is set by judgment.

  4.  **Resolve Conflicts & Apply Rules (5 mins)**
      *   *Question:* "Is there one candidate class clearly satisfying n_min, stability, *and* causal rationale? If multiple remain, does the *Stability Rule* (below) force a choice? If significant conflict persists (>10x rate difference between viable classes), escalate."
      *   *Adequate Answer:* Selection of single class OR clear documentation of conflict requiring escalation.
      *   *Stops/Escalate:*
          *   Apply **Stability Rule:** Choose the *narrowest* class where: (a) n_exposures ≥ `n_min` (default=10), *and* (b) Class Rate ≤ `k` * Parent Class Rate (default k=1.5) *and* Class Rate ≥ (1/`k`) * Parent Class Rate. (`k` calibrates conservatism).
          *   If rule selects a class, **Use Selected Class Rate**.
          *   If rule eliminates all narrow classes, **Use Broad Class Rate**.
          *   If multiple classes *pass* the rule but rates differ significantly (>10x) OR if rule selection feels causally wrong, **Escalate to Senior Underwriter/Chief Actuary**. Provide analysis.
      *   *Judgment:* The Stability Rule automates common-sense but its parameters (`n_min`, `k`) are judgment calls set by the firm. Escalation recognizes unresolvable uncertainty.

  5.  **Finalize Rate & "Class String" (5 mins)**
      *   *Question:* "Document the chosen class, its derivation path, key rationale, and final rate. Apply any mandatory loadings (e.g., for newness, fixed date). Check against Underwriting Guidelines (Min Premium, Appetite)."
      *   *Adequate Answer:* Completed `Class String` (format below). Rate finalized. Final check passed.
      *   *Stops/No:* If final rate violates appetite/min premium **Decline: "Outside Appetite"** or escalate for override.
      *   *Output Format - `Class String`:*
          `[Target Event] | Base Class: [Name] (n=X, Losses=Y, Rate=R_base) | Selected Class: [Name] (Criteria: [Feature1=Value1, Feature2=Value2,...] n=A, Losses=B, Rate=R_sel) | Rationale: [Brief causal/stability rationale] | Rule Applied: [e.g., Stability Rule (n_min=10, k=1.5)] | [Escalation Ref if used]`
          *Example:* `Satellite Total Loss | Base: All Orbital Launches (n=500, Losses=15, Rate=3.0%) | Selected: Engine Family Gamma (Criteria: EngineFamily=Gamma, n=60, Losses=3, Rate=5.0%) | Rationale: Causal link to primary failure mode; Stability: 5.0% < 1.5*3.0% (4.5%)? FALSE - Escalated SW-2024-001 | Rule: Stability Rule invoked, Escalated`

  6.  **Human Judgment & Values Check (Ongoing)**
      *   *Where it Hands Off:*
          *   **Escalation:** Significant rate conflicts (>10x), application feels wrong despite rules.
          *   **Appetite/Risk Tolerance:** Is the calculated rate within the firm's willingness to bear? (Senior UW/CA).
          *   **Fairness/Discrimination:** Does the chosen class rely on features deemed unethical or illegal (e.g., age, gender, protected class)? **(Compliance/Legal/Leadership)**.
          *   **"No Data" Boundaries:** Deciding if broad class is *too* broad to be relevant (Step 1).
          *   **Setting `n_min`, `k`:** Firm-wide calibration (CA/Leadership).
      *   *What the Procedure CANNOT Deliver:* A single "true" rate. Elimination of judgment. Guarantee of profitability. It delivers *defensible process* and *audit trail*.

  **Addressing Your Existing Rules:**
  *   **"Narrowest with n>=10 and within 10x of parent":** This is a good **Stability Rule** (`n_min=10`, `k=10`). Your `k=10` is very wide. Tightening it (e.g., `k=1.5-3`) makes it more conservative/stabilizing. **Keep it, formalize it as the Stability Rule.**
  *   **"Never quote >50% below broadest defensible class":** This is a reasonable **conservatism guardrail**. Integrate it as a final check in Step 5: `Final Rate >= 0.5 * Broad Class Rate`. Allows technical override via escalation.

  **Applying RCS-NR to Your Cases:**

  1.  **Music Festival on Floodplain:**
      *   **1. Base Class:** `Regional Flood Events (Past 20y)` (n= large, Rate=R_reg). *Causal relevance: Flood zone.*
      *   **2. Candidates:**
          *   `Specific River Stretch Floods (4y)` (n=small, likely <10, Rate=R_spec)
          *   `First-Time Promoter Festivals` (n=?, Rate=R_new) *Likely insufficient data.*
      *   **3. Evaluate:** `Specific Stretch` probably fails `n_min=10`. `First-Time Promoter` likely insufficient data.
      *   **4. Resolve:** Stability Rule fails for narrow classes. **Use Base Class Rate (R_reg).**
      *   **5. Class String & Loadings:**
          `Flood Damage During Event | Base Class: Regional Flood Events 2004-2024 (n=... , Rate=1.2%) | Selected Class: Base Class | Rationale: Insufficient stable sub-classes; Specific stretch data insufficient (n<10); Promoter experience data unavailable. | Rule: Stability Rule - No viable sub-class | Loading: +20% for Fixed Date/Inflexibility (UW Guideline L12) | Final Rate: 1.44%`

  2.  **Satellite Launch (New Small Vehicle):**
      *   **1. Base Class:** `All Orbital Launches` (n=500, Losses=15, Rate=3.0%) OR `All Small Launch Vehicles` (if distinct enough).
      *   **2. Candidates:**
          *   `Vehicle Type Alpha` (n=2, Losses=1, Rate=50.0%)
          *   `Engine Family Gamma` (n=60, Losses=3, Rate=5.0%)
          *   `Engine Gamma w/ Rev. Turbopump` (n=9, Losses=0, Rate=0.0%)
      *   **3. Evaluate:**
          *   `Vehicle Alpha`: n=2 < `n_min=10` -> Excluded by Rule.
          *   `Engine Gamma`: n=60>10. Rate=5.0%. Parent (`All Orbital`) Rate=3.0%. 5.0% > 1.5*3.0%? (4.5%) -> **TRUE (5.0% > 4.5%). Excluded by Stability Rule?** (Depends on `k` - if `k=1.5`, yes. If `k=2`, no: 5% < 6%). *Causal: Strong.*
          *   `Engine Gamma Rev. TP`: n=9<10? Excluded by Rule. Rate=0% << 5.0% (parent).
      *   **4. Resolve:** Highly sensitive to `k`!
          *   If `k=2`: `Engine Gamma` passes Stability Rule (5% < 6%). **Use 5.0%.** (But feels high?).
          *   If `k=1.5`: `Engine Gamma` fails (5% > 4.5%). Rule excludes it. No other viable class -> **Use Base Class 3.0%.**
          *   **Conflict:** 3.0% vs 5.0% is >1.5x difference. `Engine Gamma Rev. TP` is narrow but excluded by `n_min`. **ESCALATE to Senior Underwriter.** Present conflict: Broad: 3.0%, Best Causal (Engine) is 5.0% but fails Stability unless `k=2`. Turbopump promising but too new. Recommendation: Use 5.0% (causal) with `k=2` OR split difference at 4.0% with caution. *This is where human risk appetite matters.*
      *   **5. Class String (If Escalated):** `... | Selected Class: Engine Family Gamma (n=60, Losses=3, Rate=5.0%) | Rationale: Strong causal link; Stability Rule: k=2.0 applied (5.0% < 2.0*3.0%=6.0% -> PASS) | Escalation: SW-2024-001 Approved | Final Rate: 5.0%`

  3.  **Fleet Policy & Driver Age / Telematics:**
      *   **1. Base Class:** `Commercial Delivery Fleets [Region]` (n=large, Rate=R_base).
      *   **2. Candidates:**
          *   `Fleet w/ Driver Age 18-25` (n=sufficient?, Rate=R_age) *Statistically valid, predictive.*
          *   `Fleet w/ Telematics Score Band X` (n=sufficient?, Rate=R_tele) *Predictive, but hard to explain.*
      *   **3. Evaluate:** Both classes likely pass statistical rules (`n_min`, stability vs base).
      *   **4. Resolve:** Stability Rule might pass both. **HERE'S THE CRUX:**
          *   **The procedure identifies Driver Age as a *statistically valid* candidate class.**
          *   **The procedure CANNOT resolve the fairness/legal issue.** This is **ESCAPE HATCH: Values Check**.
          *   **Hands Off:** "Candidate Class 'Driver Age 18-25' relies on a protected characteristic (age) with potential for unfair discrimination. Compliance/Legal review required per firm policy F-2020-05." **Procedure Output: "Requires Fairness Review - Escalated to Compliance".**
          *   **Telematics Alternative:** The procedure *can* evaluate it statistically: `Fleet w/ Telematics Score Band X` (n=..., Rate=...). If it passes Stability Rule vs base, it's a *statistically valid* option. The *choice* to use Telematics *instead of* Age is a **Business/Compliance/Legal decision**, not a reference class optimization. The procedure says: "Both are statistically viable per rules. Age class requires Fairness Review. Telematics class is acceptable per Stability Rule." The *decision* to use Telematics for explainability/fairness is made outside RCS-NR.
      *   **5. Outcome:** If Compliance rejects Age class, and Telematics is approved, Class String uses Telematics. If both rejected, maybe only Base Class remains, possibly triggering Appetite Check (Step 5). *The procedure forces the fairness issue into the open.*
      *   **Key Takeaway:** RCS-NR flags the age-based class as statistically valid *but* triggers the mandatory Values Check. It doesn't "get you off the hook"; it forces the hook to be addressed explicitly via Compliance. It confirms Telematics is a statistically sound *alternative* class.

  **Fundamental Truth & Damage Control:**

  *   **Yes, there is no uniquely correct class.** The reference class problem is unsolvable in theory for novel events.
  *   **RCS-NR is "damage control with better paperwork"** – but *principled, transparent, auditable* damage control.
  *   **What makes it well-run:**
      *   **Constraints:** Pre-approved features, temporal integrity, clear rules (n_min, stability).
      *   **Transparency:** Mandatory `Class String` documenting *every* step and rationale.
      *   **Consistency:** Rules applied uniformly; deviations require escalation/documentation.
      *   **Escalation Paths:** Clear triggers for human judgment (conflict, values, appetite).
      *   **Audit Focus:** Every decision is reconstructable. The regulator sees *why* "this class and not that one" – even if the answer is "We applied Rule X, and here's the data; OR we escalated to Y for reason Z".
      *   **Honesty:** Acknowledges "No Data" and "Decline" as valid outcomes.

  This procedure won't make the uncertainty vanish, but it will make your pricing process significantly more robust, defensible, and consistent, while shining a light on the unavoidable judgment calls.
