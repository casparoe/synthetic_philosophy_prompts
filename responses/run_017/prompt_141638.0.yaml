  The activity will have three main parts:
  1. Students make choices from budget sets over real snacks (to create choice data).
  2. Students try to rationalize choice histories (both their own and a "weird" one) with utility functions, leading them to see that rationalization is too easy (menu-laundering).
  3. A demonstration that some choice patterns cannot be rationalized (violating the axiom) and a discussion of what utility means when choices are driven by different internal states (preferences, rules, beliefs).

  We'll avoid monetary transactions and use small snacks (check for allergies). We'll also have a part where two students produce the same choice data for different reasons to challenge the interpretation of utility.

