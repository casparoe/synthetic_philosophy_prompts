  Student X (true preferences): 
     - Round1: You really like A, so choose A.
     - Round2: You like A and C equally, but you had A in round1 and you want variety, so choose C.
     - Round3: You like B and C, but you had C in round2, so choose B.
     - Round4: You are tired of A, so choose B.

  Student Y (rule follower):
     - Rule: "In round1 and round4, choose A. In round2 and round3, choose the good that you haven't chosen before between the affordable ones." 
     - In round1: choose A.
     - In round2: affordable are A and C. Haven't chosen C before? So choose C.
     - In round3: affordable are B and C. Haven't chosen B before? So choose B.
     - In round4: choose A (by rule) but wait, that would be different from Student X? 

  We want them to have the same choices? So let's set:

  Both will have the choice history: A, C, B, B.

  But in round4, Student X chooses B and Student Y by the rule would choose A? So adjust the rule for Student Y in round4: "In round4, choose B." -> arbitrary.

  Better: we tell Student Y: "You are to follow these exact choices: 
     Round1: A
     Round2: C
     Round3: B
     Round4: B

  And the reason: you are following a rule given by your coach to balance your snack intake: "Have A first, then C, then B, then B again." 

  And Student X is told: "You have true preferences: 
     - You like B the best, but you are also influenced by what you had before. 
     - In round1: you are in the mood for A, so choose A.
     - In round2: you don't want A again, so choose C.
     - In round3: you choose B because you like it.
     - In round4: you choose B again because you liked it in round3."

  Both produce (A, C, B, B).

  Then we reveal that both have the same choice history. We then ask the class: if we define utility by revealed preference, they have the same utility function? But are they equally well off? Student X is happy with their choices? Student Y is just following a rule and might not enjoy B in round4? 

  We then discuss: what does utility represent? Is it a feeling? Or is it just a representation of choices?

  Debrief (10 minutes)

  Logistics for the two students: We need to recruit them before class. We can do it by email or at the beginning of class. We give them their role cards secretly.

  Materials:
  - Three types of snacks (A, B, C) - e.g., A: chocolate, B: chips, C: fruit snack. Check for allergies and have alternatives if needed.
  - Tickets: we can use three colors of paper slips? Or one color and we just record. But to make it tangible, we can use play money? Or just have a response sheet.
  - Response sheets for the choice experiment (with 4 rounds, and a line for each round to write the good chosen).
  - Projector to show the budget sets for each round.
  - Role cards for two students.
  - Printed choice history sheets for pairs: 
     - History A: a consistent one, e.g., (A, A, B, A)
     - History B: the weird one (A, C, B, B) [which is the same as the two students above]
  - A handout for the debrief points.

  Timeline:

  0-5 min: Introduction and rules for the choice experiment.
     - Explain: "We are going to do a choice experiment. There are four rounds. In each round, you will see the prices for three goods (A, B, C) and your income in tickets. You must choose one good to purchase. You will get that good at the end of class. Note: you can only choose a good if you can afford it (price <= income). We will do one round at a time."

  5-15 min: Conduct the choice experiment.
     - Project round1: p_A=1, p_B=1, p_C=999, Income=1. 
          -> Note: p_C=999 means you cannot afford C (since 999>1). So choose between A and B.
     - Give them 1 minute to choose, write on their response sheet.
     - Project round2: p_A=1, p_B=2, p_C=1, Income=1.
          -> Affordable: A (p=1) and C (p=1). B is 2>1 -> not affordable.
     - 1 minute to choose.
     - Project round3: p_A=2, p_B=1, p_C=1, Income=1.
          -> Affordable: B and C.
     - 1 minute to choose.
     - Project round4: same as round1: p_A=1, p_B=1, p_C=999, Income=1.
          -> Choose between A and B.
     - Collect the response sheets.

  15-40 min: Rationalizing choice histories.
     - (15-20) Form pairs (or small groups). Hand out two choice histories: 
          History A: (A, A, B, A)
          History B: (A, C, B, B)
     - Task: "For each history, write down a utility function (it can depend on anything you like) that would make these choices maximizing. You have 10 minutes."
     - (25-40) Ask a few pairs to share their utility functions for History B. Expect creative stories. 
          - For example: "The consumer's utility depends on the round: in round1, U(A)>U(B); in round2, U(C)>U(A); in round3, U(B)>U(C); in round4, U(B)>U(A)." 
          - Or: "The consumer cares about variety: they avoid repeating the same good consecutively."
          - Or: "The consumer has a rule: choose the first good in the alphabet in rounds 1 and 4, and choose the last in the alphabet in rounds 2 and 3." [But in round2, affordable are A and C -> last is C? In round3, B and C -> last is C? But they chose B in round3. So that doesn't work.]
          - We hope they come up with menu-dependent or rule-based stories.

  40-55 min: The axiom bites and same choices, different reasons.
     - (40-45) Present a history that cannot be rationalized by any bundle-utility function: 
          Show two rounds (not from the experiment) with the same budget set but different choices.
          History C: 
              Round1: prices (1,1) for X and Y, Income=2 -> chose (1,1)
              Round2: prices (1,1) for X and Y, Income=2 -> chose (2,0)
          Ask: "Can we find a utility function U(x,y) such that U(1,1) > U(2,0) and U(2,0) > U(1,1)? No. So this history violates the Weak Axiom of Revealed Preference. The only way to rationalize it is to allow the utility to change with time or to depend on the act of choosing."
     - (45-50) Reveal that two students in the room (Student X and Student Y) both had the choice history (A, C, B, B). 
          We ask each to explain (briefly) why they made those choices.
          Student X: "I really wanted A in round1, then I wanted to try C, then I discovered I liked B so I chose it twice."
          Student Y: "I was following a rule: I was told to choose A in round1, C in round2, B in round3, and B in round4."
     - (50-55) Discuss: 
          - What is utility? In revealed preference theory, we don't care about the reasons, only the choices. 
          - Both have the same revealed preferences, so the utility function we would recover is the same. 
          - But is Student X better off? They got what they wanted. Student Y might not care about the snacks, but just followed the rule. 
          - This shows that utility in this theory is a representation of choice, not necessarily a feeling.

  55-65 min: Debrief and connect to the theory.
     - Representation vs. discovery: The utility function is a representation of the choices, not a discovered entity in the mind.
     - The axioms are the only content: Without the axioms, the theory is empty (because any choice can be rationalized by menu-dependent utility). The axioms (like WARP) are what make the theory testable.
     - Menu-dependence: When we allow utility to depend on the menu, we can rationalize anything, but then the theory loses its predictive power.
     - Preference vs. rule vs. belief: Choices can be driven by many things, but revealed preference theory abstracts from that and only looks at the choices.
     - The "as-if" reading: We say the agent acts as if maximizing a utility function. This rescues the theory from having to know the internal states, but it also means that utility is not a cause of behavior, only a description.

  65-75 min: Q&A.

  Potential issues and how to handle:

  1. Allergies: 
     - Ask in advance about allergies and have alternative goods. Or use non-food items? But snacks are more tangible. Alternatively, use three types of non-food: e.g., stickers, pencils, erasers? But then the incentives are weak. We can use snacks that are common and safe (like plain chips, plain crackers, fruit snacks) and ask students to avoid if they have allergies.

  2. Trading between students: 
     - We tell them that the goods are for their own consumption and trading is not allowed. Or we can allow it? But that might complicate. Better to forbid trading.

  3. People not caring about the snacks: 
     - Emphasize that they will get to consume the snacks. Or we can use a participation grade incentive? But that might be overkill. Alternatively, use more desirable snacks.

  4. Someone who has read ahead and shouts the axiom: 
     - Acknowledge them and say: "Yes, that's the axiom we are going to discuss. But let's see if we can understand why it matters by doing this activity."

  5. In the choice experiment, no one produces a violation: 
     - We have pre-cooked the "weird" history and also the two students with the same history for different reasons, so we can still proceed.

  6. The two students with secret roles: 
     - We need to recruit them before the activity. We can do this by arriving early and asking two students to participate in a special part. Or we can email them in advance. If they refuse, have backup volunteers.

  7. In the pair activity, students might not come up with menu-laundering stories: 
     - We can have a few examples ready to share if needed.

  8. Time management: 
     - Keep strict time limits. Have a timer.

  What the activity can't deliver and you'll have to say:
     - The formal statement of the representation theorem (that if choices satisfy the axioms, then there exists a utility function that rationalizes them) and the proof are too advanced for the activity. You'll have to state that in the debrief.
     - The activity shows that without the axioms, the utility function can be trivialized by menu-dependence. But the positive content (that the axioms are sufficient for a stable utility representation) is not actively experienced. You'll have to explain that.

  Overall, this activity should create the necessary engagement and aha moments.
answer: |-
  ### Revamped In-Class Activity: "Revealed Preference Lab"  
  **Core Idea**: Students confront the limitations of revealed preference theory through hands-on choices, rationalization exercises, and controlled violations. They experience:  
  - The ease of "menu-laundering" (rationalizing any choice with ad hoc utility functions).  
  - The bite of axiomatic violations (when no utility function fits).  
  - The ambiguity of "utility" when identical choices stem from different motivations.  

  ---

  ### **Materials List**  
  1. **Snacks (3 types, allergy-safe)**:  
     - A: Plain potato chips (gluten-free, nut-free)  
     - B: Dark chocolate squares (dairy-free)  
     - C: Dried mango strips (no added sugar)  
     *(Allergy note: Confirm allergies beforehand. Non-food alternatives: Stickers (A), Pencils (B), Erasers (C).)*  
  2. **Tickets**: 100 paper tickets (1 per student per round + extras).  
  3. **Budget Set Cards (4 rounds)**: Laminated cards for each student (prices in tickets, income fixed at 10 tickets/round).  
  4. **Role Cards**: For 2 pre-selected students (details below).  
  5. **Choice History Sheets**: For pair work (two types: "Normal" and "Weird").  
  6. **Projector**: For real-time choice aggregation.  

  ---

  ### **Rules & Payoff Scheme**  
  - **Stakes**: Students receive the snacks they "purchase" after the activity. Low stakes avoid distortion (e.g., trading, hyper-competitiveness).  
  - **Budget Rules**:  
    - Each round, students receive 10 tickets.  
    - They choose **one snack per round** (simplicity > bundles; avoids stock issues).  
    - Snacks are consumed post-activity (no saving/trading allowed).  
  - **Secret Roles**: Recruit 2 students before class. Give them hidden instructions:  
    - **Student X**: "Choose what you genuinely want each round."  
    - **Student Y**: "Follow this rule: In Rounds 1–2, pick the cheapest snack. In Rounds 3–4, pick the one you haven’t tried yet. If tied, pick alphabetically (A→B→C)."  

  ---

  ### **Budget Sets (4 Rounds)**  
  | Round | Price A | Price B | Price C | Affordable Options | Rationale |  
  |-------|---------|---------|---------|-------------------|-----------|  
  | 1     | 5       | 10      | 10      | A (or save tickets) | Tests basic choice; B/C are identical and expensive. |  
  | 2     | 10      | 5       | 10      | B (or save) | Price of A/B swap; tests consistency. |  
  | 3     | 10      | 10      | 5       | C (or save) | New cheap option (C); tests variety-seeking. |  
  | 4     | 5       | 5       | 10      | A or B | A/B equally cheap; tests WARP violation potential. |  

  **Save Option**: Students can "save" tickets (get nothing) if no snack appeals.  

  ---

  ### **Timeline (75 Minutes)**  
  **0–10 min: Setup & Round 1–2 Choices**  
  - Distribute snacks, tickets, budget cards. Explain rules: "Choose one snack per round within your budget. Save tickets if you prefer."  
  - **Round 1**: Prices (A:5, B:10, C:10). Students choose; collect data.  
  - **Round 2**: Prices (A:10, B:5, C:10). Choose; collect.  
    *Logistics: Walk around to ensure compliance.*  

  **10–20 min: Rounds 3–4 Choices & Data Collection**  
  - **Round 3**: Prices (A:10, B:10, C:5). Choose; collect.  
  - **Round 4**: Prices (A:5, B:5, C:10). Choose; collect.  
  - **Project aggregated choices**: Show % choosing A/B/C/save each round. Highlight diversity.  

  **20–35 min: Rationalization Exercise (Pairs)**  
  - Pair students; give each pair two **Choice History Sheets**:  
    - **Sheet 1 (Normal)**: `[Round1: A, Round2: B, Round3: C, Round4: A]` (Common pattern).  
    - **Sheet 2 (Weird)**: `[Round1: Save, Round2: Save, Round3: Save, Round4: A]` (Designed to be odd).  
  - **Task**: "Write a utility function that explains these choices. Utility can depend on *anything*—snacks, menus, time, etc."  
  - **Goal**: Students "menu-launder" (e.g., "Utility declines if prices are unfair!" or "They get utility from defiance!").  

  **35–45 min: The Axiom Bites (Live Demo)**  
  - **Set up**: Project a **fictional choice history** violating WARP:  
    - `[Round1: A (A:5, B:10, C:10) → A chosen, B affordable]`  
    - `[Round4: B (A:5, B:5, C:10) → B chosen, A affordable]`  
  - **Challenge**: "Find a utility function U(A, B, C) that makes this maximizing *without* menu-dependence."  
  - **Reveal**: It’s impossible! If U(A) > U(B) in Round 1, U(B) > U(A) in Round 4 contradicts.  

  **45–55 min: Same Choices, Different Reasons**  
  - Bring forward **Student X** and **Student Y** (secret roles).  
  - Project their **identical choice history** (e.g., `[A, B, Save, A]`).  
  - **Student X**: "I chose A when cheap, B when cheap, saved in Round 3 because I was full, then took A again."  
  - **Student Y**: "I chose cheapest (A in R1, B in R2), skipped Round 3 (rule: 'new snack only'), took A in R4 (cheapest)."  
  - **Prompt**: "Their revealed preferences are identical. Does ‘utility’ mean the same thing for both?"  

  **55–75 min: Debrief & Lecture Bridge**  
  | **Activity Moment**       | **Concept**                  | **Debrief Talking Points**                                                                 |  
  |---------------------------|------------------------------|--------------------------------------------------------------------------------------------|  
  | Rationalizing "Weird" data | Menu-laundering              | "You rationalized anything! Utility becomes meaningless if it depends on menus/prices/whims. This ‘rescues’ the theory but collapses its predictive power." |  
  | WARP-violating demo       | Axioms as content            | "The axiom isn’t math trivia—it’s the *only* thing preventing utility from being vacuous. No axioms = no theory." |  
  | X vs. Y same choices      | Preference vs. rule vs. belief | "Utility is ‘as-if’—it doesn’t care if you’re optimizing, rule-following, or mistaken. But then, can it measure welfare? X enjoyed their choice; Y didn’t." |  
  |                           | Representation vs. discovery | "Utility isn’t ‘discovered’ in the mind; it’s *represented* by choices. Philosophy folks: this is why you’re suspicious!" |  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Trading/Allergies**:  
     - Ban trading; use allergy-safe snacks. If allergies, offer non-food items.  
  2. **Not caring about snacks**:  
     - Emphasize "real stakes" lightly ("Snacks are a bonus—focus on the puzzle"). Use quirky non-food (e.g., Schrödinger’s Cat stickers) to engage philosophers.  
  3. **"Read-Ahead" Shouter**:  
     - Acknowledge: "Yes, that’s the Weak Axiom—but let’s *see* why it matters." Turn it into a teachable moment during the violation demo.  
  4. **Student Y breaks role**:  
     - Prep them early; give a written rule card. If they slip, say: "Interesting! Even rule-followers deviate sometimes."  
  5. **No WARP violators in class data**:  
     - Use the pre-cooked fictional violation. Most students won’t violate WARP naturally (it’s rare).  

  ---

  ### **What the Game Can’t Deliver (Say This Loudly at 60 min)**  
  - **"The representation theorem is profound but abstract: If choices satisfy WARP (and other axioms), there exists a utility function. We *could* prove it, but today’s punchline is that without axioms, utility is a storytelling tool. Utility isn’t a ‘thing’—it’s a mirror for choices."**  
  - **Philosophy Caveat**: "This doesn’t resolve whether utility *should* name a mental state. It just shows how economics uses the term."  

  ---  
  **Why This Works**: Students *feel* the theory’s flaws before naming them. Economists see axioms as necessary; philosophers see utility as slippery. Both leave questioning "utility" without dismissing it.
