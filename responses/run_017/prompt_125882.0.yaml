  But in the fee case, Jordan makes $0.90 without doing any trades.

  ### Analysis

  The real work is done by the intransitive indifference combined with the foresight and the inability to commit to refuse future trades. The victim, seeing that they will accept each trade due to indifference or strict preference, and that this will lead to a net loss, is willing to pay to avoid the sequence. However, they are only willing because the fee leaves them with higher utility than going through the sequence, but by less than the threshold, so they are technically indifferent. In practice, they might pay.

