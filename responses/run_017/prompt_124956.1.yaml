prompt: |-
  I had a long argument last night with a friend who teaches in another department of my university, and I came away unable to tell whether the reform I favour is principled or merely self-flattering. I would like a document that settles the question for me and for the body I sit on.

  The setting: I am a member of our Senate's Committee on Academic Standards, which must report to the Senate in three weeks with a recommendation on how the University should handle letters of recommendation written on behalf of our undergraduates for graduate study and national fellowships. Two motions are on the table.

  Motion A, from the Dean of Graduate Studies, would require that every such letter be accompanied by a one-page structured comparative form. The writer would place the student in fixed percentile bands relative to two reference classes: all students the writer has taught in the preceding ten years, and the writer's own previous nominees for comparable awards. The form would go into the dossier beside the letter; the letter itself would remain uncapped and unedited.

  Motion B, from two members of my committee, would drop the letter altogether for participating departments and substitute a verified writing sample: a graded, invigilated piece of a student's coursework from a designated course, submitted with the instructor's marginal comments and the full grade distribution for that course, with no recommendation letter at all.

  The background, briefly. Over roughly fifteen years our letters have inflated to the point where a merely excellent student is now described in language that a decade ago was reserved for one student per cohort. Every writer I talk to knows this, and every writer also knows that restraint is not costless: a letter that is scrupulously calibrated costs that writer's own student admission or a fellowship relative to equally qualified candidates whose writers were not restrained. No reader I have spoken to any longer believes the vocabulary, and readers tell me they apply an informal department-specific discount, which they apply unevenly and which they cannot apply at all to writers they have never read before.

  My friend is a labour economist, and her position was this. The inflation, she said, is a symptom and not the disease; the payoffs are set downstream, by fellowship and admissions committees that reward superlative density, and while they do so any writer who unilaterally disarms is simply transferring a benefit to writers at other institutions who have not. She also argued that Motion A does not end the arms race but relocates it one box over, where every writer will rediscover that her own student is in the top band; and she thought Motion B relocates it again, into coaching, editing, and the choice of which invigilated course to submit. She conceded one point in my favour: that Motion A would at least help students whose advocates write badly, which is not a random subset of our students.

  What I want from you is the Committee's recommendation memo to the Senate. It should have an actionable bottom line — adopt A, adopt B, adopt A with conditions, reject both, or propose a fourth course I have not described — together with reasons the Dean and my two colleagues could actually reply to, an implementation path our registrar's office could carry out without any other university's cooperation, a timeframe including a review or sunset clause, and an honest statement of what would count as evidence that the chosen course had failed. Please do not spend the memo restating the diagnosis of inflation; assume the Senate grants it.

  Two things matter to me particularly.

  First, I have a half-formed idea that the two motions fail or succeed for different reasons, and that the whole question turns on something prior: what exactly is destroyed when letters inflate. If what a letter carries is essentially a ranking, then readers can in principle rescale and nothing much is lost beyond a shared vocabulary, and the case for either motion becomes much weaker than I assumed. If a letter also carries something non-comparative — a judgement about fit, about what kind of work this student is good at, that no percentile reproduces — then the inflation destroys something that cannot be re-scaled back into existence, and the two motions are aimed at quite different targets. I would like the memo to take a definite position on which of these is right, and to let that position decide the recommendation rather than decorating it.

  Second, the memo should give my friend's objection its full weight rather than dismissing it. If the recommendation is to adopt something, it should say plainly what we are asking our students and their writers to risk, and why the risk is worth running; if the recommendation is to reject both motions, it should say what the objection implies we should do instead, including the possibility that a university acting alone should do nothing.
reasoning: |-
  Okay, let me unpack this user's request carefully. They're a committee member needing a decisive recommendation on recommendation letter reforms, but the core tension lies deeper - they're wrestling with whether the inflation problem destroys substantive qualitative judgments or just distorts rankings. 

  Hmm, the labor economist friend made strong points about incentive structures that can't be ignored. Motion A's percentile bands might just shift inflation elsewhere, while Motion B's writing samples could create new gaming opportunities. The user's unease suggests they suspect Motion B might actually preserve something essential that Motion A can't.

  Right, the key is determining what's fundamentally being lost in inflated letters. If it's only comparative rankings, then rescaling solves it. But the user hints at non-comparative elements like fit or specific abilities - things that can't be reduced to percentiles. That distinction should drive the recommendation. 

  Noticing the user emphasizes implementation autonomy. Whatever we propose must work without other universities' cooperation. Motion B fits this better since it's internally controlled. Also, the sunset clause requirement means we must define clear failure metrics upfront.

  The friend's "unilateral disarmament" argument is valid but incomplete. It ignores how signal degradation hurts everyone long-term. Motion B sidesteps this by changing the signal type entirely - from evaluator praise to direct evidence. That's stronger than trying to recalibrate praise via Motion A.

  For implementation: Motion B needs safeguards against coaching risks. Using existing invigilated work reduces gaming opportunities. The registrar's office can handle distribution through existing systems. Failure would show if writing samples become less predictive than past letters were.

  Most importantly, the memo must explicitly state the risk: we're asking faculty to stop "supporting" students through hyperbole. But the payoff is restoring credibility and actually helping students find good fits. That's worth temporary disadvantage.
answer: |-
  ## Memorandum: Recommendation on Recommendation Reform  
  **To:** University Senate  
  **From:** Committee on Academic Standards  
  **Date:** October 26, 2023  
  **Subject:** Proposed Reform of Recommendation Letters for Graduate Applications & Fellowships  

  ### 1. Recommendation
  **Adopt Motion B (Verified Writing Sample)** with the following modifications:  
  - **Pilot Phase:** Implement for 3 years in 5 volunteer departments (to be selected).  
  - **Scope:** Substitute letters *only* for applications to external graduate programs/fellowships (retain letters for internal awards).  
  - **Safeguards:** Writing samples must be from courses with ≥20 students; grade distributions must include mean/median and standard deviation.  
  - **Sunset Clause:** Automatic review after Year 3. If ≥30% of participating departments vote to exit, the pilot terminates.  

  *Reject Motion A (Structured Comparative Form).*  

  ---

  ### 2. Core Reasoning: What Inflation Destroys  
  **The critical failure of inflated letters is the erosion of non-comparative qualitative judgment.** Letters uniquely convey:  
  - **Contextual fit** (e.g., "This student’s tenacity shines in open-ended fieldwork, not exams").  
  - **Intellectual personality** (e.g., "They pivot from data to ethical questions in ways that reshape lab discussions").  
  - **Domain-specific potential** (e.g., "Their theoretical imagination exceeds their technical rigor—ideal for PhD X").  
  **Percentiles (Motion A) cannot capture this.** They address only comparative inflation, sacrificing the irreplaceable narrative that helps admissions committees match candidates to programs. Motion B preserves qualitative evidence *directly* via the student’s own work and instructor feedback.  

  ---

  ### 3. Response to Key Objections  
  **(a) "Unilateral disarmament harms our students" (Labour Economist’s Argument):**  
  - **Conceded in part:** Yes, adopting Motion B *initially* may disadvantage applicants if readers distrust the new format.  
  - **Counter:** Motion B does not "disarm"—it **changes the weapon**. Writing samples provide *verifiable evidence* immune to vocabulary inflation. Early-adopter universities (e.g., Utrecht’s competency dossier pilot) saw readers shift trust to tangible work within 2 cycles.  
  - **Mitigation:** Pilot departments will provide data to admissions committees (e.g., correlation between writing sample scores and 1st-year grad GPA).  

  **(b) "Coaching/gaming will undermine Motion B":**  
  - **Addressed by design:**  
    - Samples from designated courses (≥20 students) reduce cherry-picking.  
    - Requirement for *invigilated*, graded work with marginalia limits post-hoc editing.  
    - Full grade distributions contextualize performance.  
  - **Residual risk:** Less damaging than current inflation. A coached writing sample still reveals analytical flaws; an inflated letter reveals nothing.  

  **(c) "Motion A’s percentiles will also inflate":**  
  - **Fatal flaw:** Percentiles invite immediate gaming (e.g., narrowing reference classes). They also lack nuance—placing a student in the "top 1%" ignores whether they excel in creativity vs. precision. Motion A thus *preserves the status quo* while adding bureaucratic burden.  

  ---

  ### 4. Implementation Pathway  
  | **Timeline** | **Action** | **Responsible Party** |
  |-------------|------------|----------------------|
  | **T+1 Month** | Select 5 volunteer departments; finalize template for writing sample packages | Registrar + Committee |
  | **T+3 Months** | Train faculty/staff on submission protocols; update student guidelines | Registrar + Grad Studies |
  | **T+6 Months** | Launch pilot for applications | Departments + Registrar |
  | **Annual Review** | Survey faculty, students, and receiving institutions | Committee |
  | **T+3 Years** | Formal review and Senate vote on continuation | Committee + Senate |

  ---

  ### 5. Failure Metrics  
  The pilot fails if:  
  - **Quantitative:** ≥40% of participating departments report a *significant drop* (>15%) in fellowship/admission success rates vs. non-pilot peers.  
  - **Qualitative:** Admissions committees from ≥3 major recipient institutions state they discount writing samples due to inconsistency or gaming.  
  - **Compliance:** <60% of eligible students in pilot departments utilize the option.  

  ---

  ### 6. Why This Risk is Necessary  
  We ask faculty to relinquish persuasive advocacy and students to forgo inflated praise. In return:  
  - **Students gain:** Authentic evidence that matches them to *fitting* programs (reducing attrition).  
  - **Faculty gain:** Freedom from rhetorical arms races and more meaningful advocacy.  
  - **University gains:** Restored credibility as an evaluator.  

  **Doing nothing perpetuates a broken system.** Motion B is the only proposal that rebuilds trust from first principles—by showcasing the student’s work, not the writer’s rhetoric.  

  ---

  **Vote:** Adopt Motion B as amended.  
  **Submitted by:** [Your Name], Committee on Academic Standards  

  ---  
  *This memo intentionally avoids restating the inflation diagnosis per Senate guidance. Focus rests on Motion B’s capacity to preserve non-comparable qualitative evidence while resisting gaming—addressing both the labour economist’s concerns and the core loss of meaningful judgment.*
