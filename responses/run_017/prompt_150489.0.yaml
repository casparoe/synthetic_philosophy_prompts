prompt: |-
  I write a science-and-ideas column for a mid-sized magazine, and an ever-larger chunk of what I do is blaming people in print: a journal that sat on a retraction for fourteen months, a university that quietly buried a study its funder disliked, a research centre that took money from an industry body and left it out of the disclosures. My editor and I end up having the same argument roughly every week, and it always has the same shape: someone in the letters page or the comments says "you're one to talk" — our own corrections policy is a shambles, we run sponsored explainers paid for by companies whose research I criticise, I have taken the free flight to the conference — and we have no principled way of telling when that tu quoque actually bites and when it is just noise. I've skimmed a bit of the philosophy-of-blame stuff myself (standing, hypocrisy, the idea that you can forfeit the right to blame by being implicated in the very thing you're blaming), but nobody else on staff has, I can't send my editor to a seminar, and please don't send me a reading list or footnotes — I need something I can use on a Wednesday afternoon.

  So: write me a decision procedure my editor and I can actually run, in fifteen or twenty minutes, on a piece that is about to blame somebody. Ordered questions, what counts as a sufficient answer to each, where the procedure simply stops with a no, and where it stops and hands the decision to a person because the question is one of values rather than facts. My working heuristic up to now has been a "mirror test" — if the target could run my sentence back at me with the names swapped and it would sting, I don't have standing — and my editor's is that a "full disclosure: we've been guilty of this too" note at the top fixes everything. I want the procedure to say what's wrong with both of those, and where they're actually not bad. It has to handle: blame laundered through a quoted source ("Dr X called the delay indefensible") — does quoting preserve standing, destroy it, or count as endorsing it, and when does the quoting stop being reporting and start being blaming; complicity-by-benefit (my salary, the flights, the owner's portfolio) versus complicity-by-agency (I personally did the thing); unsigned institutional blame versus my own byline; blaming for a structural or aggregate harm where no single person's individual act is wrong; and the second-order case where the thing I'm blaming is itself hypocrisy. Also whether it matters if the blame targets a practice rather than a person, and whether "you are a hypocrite" is a different moral act from "that was wrong."

  Then run it on three pieces I have on the go: one calling out a university press and its oversight committee for slow, opaque retractions when my own outlet has quietly rewritten a piece after a complaint without noting it and has never once run a correction; one on a climate research centre taking money from an energy trade group, when my magazine's parent company puts on a "future of energy" conference series with oil and gas sponsors (I did once take a junket flight, and I did disclose it, which may or may not help); and one on a medical journal's conflicts-of-interest failures where every harsh phrase is inside quotation marks from clinicians I interviewed and our health coverage is underwritten by a foundation that holds hospital stock. At least one of those, I suspect, is going to come back with an answer I don't like, and I'd rather find out from you than from the letters page. Be honest about which steps are judgment calls dressed up as procedure, and end by saying what the procedure can't do at all.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a science columnist who frequently calls out institutional misconduct but keeps facing "tu quoque" accusations. They need a practical decision tool to assess when hypocrisy claims invalidate their criticism. 

  Hmm, the core tension here is balancing journalistic accountability with operational realities. The user isn't just asking for ethical theory - they need something executable during tight deadlines. Their existing heuristics ("mirror test" and disclosure bandaids) clearly fail when dealing with systemic complicity like sponsored content or parent company ties.

  First, I should map their stated pain points: 
  - The procedural nature is non-negotiable (15-20 mins max)
  - Must handle nuances like quoted blame vs direct accusation
  - Needs to distinguish between personal agency vs structural involvement
  - Should evaluate whether hypocrisy accusations actually undermine the argument

  *flipping through mental index cards of ethical frameworks*
  Wallace's hypocrisy-as-wrongness-mitigation won't work here - too abstract. Similarly, Scanlon's blameworthiness criteria would make their editor's eyes glaze over. Need to operationalize this into binary checkpoints with off-ramps.

  *scribbling draft structure*
  The procedure should cascade through three filters:
  1. **Irrelevance Test** - Does the parallel actually negate the criticism? (e.g., their quiet rewrites don't invalidate calling out retraction delays if the harm scale differs)
  2. **Contamination Check** - Is their outlet's conduct materially enabling the same harm? (key for the climate research funding piece where parent company's oil sponsors might create parallel incentives)
  3. **Poison Control** - Can disclosure salvage it? (probably not when their medical journal piece quotes critics while taking hospital money - that's conflict inception)

  *testing against their examples*
  For the university press piece: Their unlogged rewrites are bad but not equivalent to formal retraction systems failing. Procedure should flag this as "proceed with disclosure" rather than kill the piece. 

  But the climate center case... oof. When their parent company literally partners with the industry being scrutinized, that's structural contamination. Hard stop unless they can demonstrate firewall mechanisms.

  *noticing unstated stakes*
  User's real anxiety isn't ethics - it's credibility erosion. Every "you're one to talk" comment chips away at their authority. The procedure must protect their standing first, the outlet's reputation second.

  *designing failure states*
  Need clear "no-go" triggers:
  - When their outlet's conduct is actively causing parallel harm (not just similar)
  - When quoted blame serves as moral laundering
  - When the hypocrisy accusation would truthfully resonate with reasonable readers

  *anticipating pushback*
  Editor will hate the climate piece verdict. Should prep user with: "This isn't about purity - it's about not handing critics grenades to blow up your argument. Sometimes the story belongs with someone less entangled."

  *last sanity check*
  The unsigned institutional blame loophole? Add step: "Does your byline create reader expectation of personal accountability?" If yes, apply personal conduct tests.
answer: |-
  Here's a **Blameworthiness Assessment Protocol (BAP)** – a 15-minute executable checklist. It evaluates **standing** (your right to blame), **hypocrisy risk**, and **impact validity**. Run it *before* drafting blame-centric sections.

  ---

  ### **THE BAP CHECKLIST**
  **Answer sequentially. Stop if any step returns "NO." Asterisked (\*) steps require editorial judgment.**

  1. **CORE HARM TEST**  
     *"Is the criticized act/system causing material harm (misinformation, obscured conflicts, suppressed science)?"*  
     - **YES** → Proceed.  
     - **NO** → **STOP. No standing.** (Blaming without harm is grandstanding.)  
     - *Judgment call: Scale of harm (e.g., buried climate study vs. minor admin delay).*

  2. **DIRECT COMPLICITY TEST**  
     *"Did I (or my bylined outlet) *personally engage* in the *exact same behavior* I’m criticizing, *in the same context*, within the last 3 years?"*  
     - **NO** → Proceed to Step 3.  
     - **YES** → **STOP. No standing.** (You’re actively doing the thing. Mirror test applies.)  
     - *Clarifier: "Exact same behavior" = e.g., both buried industry-funded studies; "same context" = both in science publishing.*

  3. **STRUCTURAL COMPLICITY TEST**  
     *"Does my outlet *currently benefit* from/systemically enable the *same type* of harm, such that our critique appears self-serving or diversionary?"*  
     - **NO** → Proceed to Step 4.  
     - **YES** → **STOP. No standing.** (Hypocrisy invalidates moral authority. Disclosure doesn’t fix this.)  
     - *Clarifier: E.g., criticizing fossil fuel funding while your conference is oil-sponsored = systemic complicity. Your salary isn’t complicity; taking junkets from criticized industries might be.*

  4. **QUOTED BLAME ASSESSMENT**  
     *"Is blame *attributed to a source* (e.g., ‘Dr. X calls this unethical’) rather than stated outright?"*  
     - **NO (You’re directly blaming)** → Proceed to Step 5.  
     - **YES** → Ask: *"Does quoting this source:*  
       a) *Add expertise/context?*  
       b) *Avoid laundering my outlet’s bias?*  
       c) *Not evade accountability for endorsing the claim?"*  
       - **YES to all** → Proceed.  
       - **NO** → **STOP.** (Quoting becomes hypocrisy if used to dodge your outlet’s identical flaws.)

  5. **RESPONSIBILITY VENN DIAGRAM**  
     *"Is blame *clearly targeted* at:*  
     a) *Specific agents* (e.g., "Committee Chair Dr. Y delayed retractions")?  
     b) *Systems* (e.g., "The university’s oversight process fails")?  
     c) *Abstract harm* (e.g., "Industry funding corrodes trust")?"*  
     - **Targets a or b** → Proceed.  
     - **Targets only c** → Ask: *"Is our critique backed by evidence beyond our outlet’s flawed practices?"*  
       - **YES** → Proceed.  
       - **NO** → **STOP.** (Blaming abstract harm while complicit is hollow.)

  6. **HYPOCRISY DISCLOSURE CHECK**  
     *"Does a *reasonable reader* need to know about our outlet’s *related flaws* to assess this critique’s credibility?"*  
     - **NO** → Proceed to Step 7.  
     - **YES** → **Add prominent disclosure** (not a fix-all!). Then ask: *"Does disclosure resolve the conflict of interest?"*  
       - **YES** → Proceed.  
       - **NO (\*)** → **STOP.** (Disclosure can’t cure fundamental moral compromise.)

  7. **SECOND-ORDER HYPOCRISY TEST**  
     *"Am I blaming *hypocrisy itself* (e.g., ‘They condemn conflicts while hiding their own’)?"*  
     - **NO** → **FINAL GO-AHEAD.**  
     - **YES** → **Run Steps 1–6 ON YOURSELF.** If you pass → **GO-AHEAD with disclosure.** If fail → **STOP.** (Don’t criticize hypocrisy hypocritically.)

  ---

  ### **WHAT’S WRONG WITH YOUR HEURISTICS?**
  - **Mirror Test (If it stings, no standing):** Overbroad. Ignores *scale* (your unlogged rewrite ≠ 14-month retention) and *systemic* vs. *personal* acts.  
  - **"Disclosure Fixes All":** Naive. Disclosure informs but doesn’t absolve structural complicity (e.g., taking oil money while criticizing oil influence).  

  ### **WHERE THEY WORK**
  - **Mirror Test:** Useful for **Step 2** (direct complicity).  
  - **Disclosure:** Required in **Step 6** if flaws are adjacent but not disqualifying.

  ---

  ### **APPLICATION TO YOUR CASES**
  **Case 1: University Press Retractions**  
  - **Step 1:** YES (harm: obscured truth).  
  - **Step 2:** NO (you rewrote quietly; they stalled retractions – not identical).  
  - **Step 3:** NO (your rewrites are bad, not systemic enablement).  
  - **Steps 4-5:** N/A (direct blame).  
  - **Step 6:** YES → **Add disclosure:** *"We’ve amended articles without transparency; we’re reforming our policy."*  
  - **Step 7:** NO → **GO-AHEAD.**  

  **Case 2: Climate Centre Funding**  
  - **Step 1:** YES (harm: obscured fossil fuel influence).  
  - **Step 2:** NO (junket ≠ taking institutional funds).  
  - **Step 3:** **YES → STOP.** Parent company’s oil-sponsored conference = systemic complicity in *same harm* (fossil fuel influence on science). Disclosure won’t fix.  

  **Case 3: Medical Journal Conflicts**  
  - **Step 1:** YES (harm: undisclosed hospital stock).  
  - **Step 2:** NO.  
  - **Step 3:** **YES → STOP?** Judgment call (\*): Health coverage funded by hospital-invested foundation risks *same harm* (obscuring conflicts).  
  - **Step 4:** Quoted blame → **Subtest:** Quoting clinicians adds expertise (a), but if foundation influences coverage, quoting may launder bias (b/c fail). **VERDICT:** High risk → **STOP unless foundation’s terms prove no influence.**  

  ---

  ### **WHAT THE BAP CAN’T DO**  
  1. **Absolve bad faith:** If you’re intentionally hypocritical, no procedure helps.  
  2. **Replace editorial courage:** Sometimes publishing despite hypocrisy risk is necessary (BAP flags danger; humans decide).  
  3. **Fix your outlet:** Systemic flaws (sponsored content) require institutional change, not just disclosure.  
  4. **Predict backlash:** Readers may still cry hypocrisy. BAP minimizes *valid* attacks.  

  **Final Note:** Steps 3 and 6 are values-based judgment calls. The BAP forces explicit scrutiny of complicity – which is why your editor’s "disclosure fixes all" fails. Use it to *protect your credibility*, not just avoid criticism. Run the climate piece elsewhere.
