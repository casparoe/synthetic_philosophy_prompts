prompt: |-
  Hey, I'm a PhD student in political economy (well, polit sci dept, but I basically live in the philosophy library), and I'm puting together a mock colloquium Q&A for our grad conference next month. My guest is an invented defender—let's call her Dr. Elena Varga—of a specific neo-Langean market socialism (she's not a real person, so no worries about putting words in a living thinker's mouth). I definately want to press her on the actual content of her position, not have her just restate the basic Lange model we all roughly know: Mises said without private ownership and real market prices for capital goods, socialist planners can't do rational economic calculation; Hayek later added the knowledge problem, saying the relevant information is dispersed, often tacit, and that the price system works as a discovery procedure rather than a mere equilibrium calculator. Lange's reply was a model where a Central Planning Board sets accounting prices by trial and error—raise price if excess demand, lower if excess supply—and tells managers to produce where price equals marginal cost and to minimize average cost, while markets still allocate consumer goods and labor.

  Dr. Varga defends a souped-up contemporary version of this. In her model, the Central Planning Board still uses the trial-and-error rule for current accounting prices, but she adds an internal futures prediction market to handle investment and to answer Hayek: managers trade notional claims on capital-good allocations based on their local forecasts of future demand, and the clearing prices in that internal market become the temporal accounting prices for capital goods and for goods with no current market. These trades are settled in a notional social dividend rather than real profit, so nobody gets rich off it, but she claims the clearing prices still aggregate dispersed knowledge without requiring managers to articulate the reasons behind their forecasts. She also says this lets the Board do rational calculation and plan investment dynamically, because the prediction market constantly updates prices in response to new local information.

  Draft eight to ten interview questions that go beyond having her restate this model. I want at least one question each on: (1) how the internal prediction market is supposed to answer Mises's calculation objection—specifically, how notional social-dividend trades on capital-good claims can generate the kind of common denominator needed to compare heterogeneous capital goods, and why that isn't just smuggling in real capital markets; (2) how it answers Hayek's knowledge problem, given his point that alot of the relevant knowledge is tacit and can't just be reported to a board—press her on whether trading in a prediction market really taps tacit knowledge or only the articulate expectations of managers who are themselves just following cost rules, and whether the model can handle radical uncertainty rather than just risk; and (3) the incentive-compatibility and gaming worry—if managers' evaluations or the social dividend depend on prediction-market performance or on hitting the price-equals-marginal-cost rule, what stops them from gaming the forecasts, manipulating reported excess demand, or just herding, and who really bears the loss when the internal market's bets turn out wrong, given there's no private ownership or hard profit-and-loss accountability. For each of those three, include a follow-up keyed to the answer she's most likely to give (e.g., she'll probably say the prediction market aggregates knowledge without anyone needing to explain it, or that scoring rules make truth-telling incentive-compatible, or that losses are socialized by design—so hit those replies). Then end with one final question about what evidence could count against the model: what empirical result or conceptual argument would show that this internal-market version of market socialism still can't calculate or adapt as well as she claims? No generic questions, and please don't just ask her to summarize the view.
