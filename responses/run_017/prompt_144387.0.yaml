prompt: |-
  hey — pretend you're a professional philosopher who's spent way too long in the decision-theory literature on ambiguity, and help me prep an interview. Brainstorm a bit before you write anything: make a private list of every serious objection to the view I describe below, cross off the ones she's obviously heard a hundred times, and build the questions out of what's left.

  I host a tiny podcast on choice under uncertainty. Next week's guest is a decision theorist I'll just call Professor M. Her view, in brief: the Ellsberg pattern isn't a bias. Rationality doesn't demand a single sharp prior; when your evidence pins down only a *set* of priors, it's rationally permissible to rank options by how they do at the worst prior in that set. (Setup, so we're on the same page: urn K has 50 red and 50 black marbles, known. Urn U has 100 marbles, all red or black, composition unknown. You bet on a colour and a marble is drawn. Most people take K-red over U-red *and* K-black over U-black.) She's sharp, she's heard every version of "that's just a money pump," and she insists she's making a normative claim about what's permitted, not a descriptive claim about what people happen to do.

  Give me 7 to 9 questions, each two or three sentences max, written so I can read them out loud, plus a scripted follow-up keyed to the answer she's most likely to give. Please don't build any question around naming papers or authors — I can't check them and she won't want to recite them on air. And no "what got you into decision theory" filler. Cover at least these:

  1. The incoherence charge done *properly*, not the naive Dutch-book version: spell out the two preferences and show that no single probability over compositions delivers both (the one number that has to be below 1/2 for the first bet and above 1/2 for the second). Then ask which premise she gives up. Her likely answer is "the premise that one probability represents you at all" — so your follow-up is: incompleteness isn't aversion. If your priors are genuinely imprecise and you refuse to pick a tie-breaker, what your theory predicts in the two-urn case is silence, i.e. no comparison, not the strict preference for K that people report. So what's the extra ingredient doing the work — and is it an attitude, or is it secretly a belief?

  2. Her own signature case, which I want you to use against her: one urn, 100 marbles, red proportion known to be exactly 1/3, the remaining 2/3 split between black and yellow in an unknown way, one draw, you choose which colour you're betting on. Same urn, same draw, so there's no "different urns, different states" escape. Ask her to say what differs between the event *red* and the event *black* on her account, other than what she happens to know about it. Follow-up: if the answer is "nothing about the event, only about my information," then why isn't that just evidence, something that should shape the credal set rather than add a separate taste for the known? And make her say out loud how much weight the worst case (zero black marbles) actually gets in her deliberations.

  3. A dynamic question. After she's committed to betting red on U but before the draw, would she pay a penny for the composition to be revealed? Then: after the marble is drawn but before the colour is shown, would she pay to switch her bet to urn K? Ask how those answers hang together, and hit the standard reply — that the switch fee merely shows she'd rather have been on K all along — with: why doesn't an agent who expects to want to switch just choose that way from the start?

  4. Aggregation. 100 independent ambiguous urns, one draw each, payoff on the total. Does her principle give a different verdict in the aggregate than in the single case? If yes, why should the number of repetitions matter to a normative principle about caution? If no, make her bite the bullet out loud: a big portfolio of independent ambiguous bets is worth less to her than the identical portfolio with the compositions disclosed, even though she's allowed to watch the early draws and learn.

  5. A "nobody ever knew" case of your own construction: the composition was fixed by a genuinely random physical process, never recorded, never observed by anyone, so no one is better informed than she is and no one could have chosen it adversarially. Ask whether caution is still permissible here, and press on why: if the pull of the worst case comes from a tacit suspicion that the setup was chosen by someone who knew her bet, that suspicion is idle here, so she should explain what's left.

  6. One closing question about what would change her mind, and one about whether her view gives any support to the precautionary principle in regulation — and if it does, how she answers the objection that caution has costs borne by identifiable people.

  Each question should be something she has to actually think about, not something she can field with a slogan. At the very end, on its own line, put the machine-readable verdict \answer{Qn}, where n is the number of the question you think she's most likely to deflect rather than answer.
reasoning: |-
  Okay, the user is prepping for an interview with Professor M, a decision theorist who defends ambiguity aversion as rational. They want me to brainstorm fresh objections beyond the standard critiques. Let me unpack this carefully.

  First, I need to recall the core of Professor M's position: she argues that when evidence only specifies a set of priors (like in Ellsberg's unknown urn), it's rational to evaluate bets by their worst-case performance within that set. This explains why people prefer known-risk urns (K) over ambiguous ones (U). The user mentions she's heard all the "money pump" arguments, so I must avoid those.

  Looking at the user's requirements, they want 7-9 sharp questions targeting specific weaknesses. Key areas to cover: 
  - The incoherence charge (showing the preferences can't be captured by any single probability) 
  - Her own signature case with three colors 
  - Dynamic inconsistencies 
  - Aggregation paradoxes with multiple urns 
  - A "nobody ever knew" scenario to test if caution persists without potential adversaries 
  - A closing question about what would change her mind and implications for policy

  For the incoherence point, I need to frame it not as a Dutch book but as a violation of probabilistic representation. The follow-up should press why her model predicts indecision but people show strict preference. Is there a hidden belief masquerading as attitude?

  The three-color urn case is brilliant - it removes the "different states" defense. I'll force her to admit that red and black events are symmetric except for her knowledge. The follow-up must challenge why this knowledge isn't just evidence shaping the credal set.

  For dynamics, I'll construct a sequence: would she pay to reveal the composition after choosing U-red? And would she pay to switch to K after the draw? The tension arises if she'd pay both, suggesting regret. The key is questioning why an agent who anticipates regret doesn't choose differently initially.

  Aggregation needs to highlight how ambiguity aversion diminishes with repeated trials - but normatively, why should repetition matter? If she denies this, make her admit a portfolio of ambiguous bets is worth less even with learning opportunities.

  The "nobody ever knew" case removes adversarial selection. If she still endorses caution, what justifies it without suspicion of manipulation? This probes whether her view requires actual adversaries or just the possibility.

  Finally, policy implications risk conflating individual caution with societal risk management. I'll push her to distinguish them and address costs to identifiable groups.

  Throughout, questions must be concise - 2-3 sentences max. No name-dropping papers. And I need to predict which question she'd deflect (probably the aggregation one, as it's less discussed but exposes a major tension).
answer: |-
  Here are 9 tightly-framed questions designed to push Professor M on under-explored tensions in her view, with scripted follow-ups keyed to likely answers:

  1.  **Question:** Your view requires rejecting the premise that preferences must be representable by a single probability. But in the classic Ellsberg two-urn setup, the strict preferences (K-red > U-red and K-black > U-black) imply *incomparability* under a pure imprecise credence model – not the strict dominance you predict. What specific element beyond imprecise credence explains the strict preference for the known urn?
      *   *Likely Answer:* "The maxmin rule itself expresses a cautious attitude towards the ambiguity inherent in the credal set."
      *   **Follow-up:** But isn't that 'cautious attitude' functionally equivalent to *adding a belief* about adversarial selection? If it's purely a taste, why does it only manifest when credences are imprecise?

  2.  **Question:** In your 'signature case' urn (1/3 red, 2/3 black/yellow unknown), betting on red vs. betting on black: what, *ontologically*, differs between the event "black is drawn" and the event "red is drawn" on your account, besides your knowledge of their likelihoods?
      *   *Likely Answer:* "Nothing differs about the events themselves; the difference lies solely in the nature of my information – precise risk for red, ambiguity for black."
      *   **Follow-up:** If the *only* difference is informational, shouldn't that difference be fully captured by a credal set (e.g., P(black) ∈ [0, 2/3])? Why does recognizing ambiguity necessarily mandate giving *full decision weight* to the worst-case scenario (P(black)=0) over other points in the set?

  3.  **Question (Dynamic - Part 1):** Suppose you've just chosen to bet on red drawn from the ambiguous urn U. Before the draw occurs, would you pay a penny to learn the urn's exact composition?
      *   *(Assume she says "Yes")*
      *   **Question (Dynamic - Part 2):** Now, *after* the marble is drawn (but you haven't seen its color), would you pay a penny to switch your bet to red drawn from the known 50/50 urn K instead?
      *   *Likely Answer:* "Yes, because knowing the composition resolves ambiguity, and switching to K avoids the ambiguity I now regret facing. But it doesn't change my initial choice rationale."
      *   **Follow-up:** If an agent *expects* they would pay to switch to K *after* choosing U, doesn't that imply they strictly prefer K *to* U *ex ante*? Why wouldn't a rational agent simply choose K from the start, avoiding the need to pay to escape their own choice later?

  4.  **Question (Aggregation):** Consider 100 independent ambiguous urns (each like urn U), one draw per urn. You get paid $1 per red marble drawn. Is the value of this portfolio, under maxmin, *different* from its value if you knew all 100 compositions before betting?
      *   *(Likely she must say "Yes, it's lower due to ambiguity")*
      *   **Follow-up:** Why should the *number* of independent ambiguous bets normatively change the level of caution? Since early draws reveal information allowing you to update your credal sets for later draws, isn't the maxmin valuation here excessively pessimistic compared to the actual learning opportunity?

  5.  **Question ("Nobody Ever Knew"):** Imagine the ambiguous urn's composition was fixed by a genuinely random quantum process, instantly erased, never observed by anyone – past, present, or future. No entity could possibly have chosen it adversarially against you. Is maxmin caution still rationally permissible here?
      *   *Likely Answer:* "Yes, because my *ignorance* remains the same; the lack of an adversary doesn't change my epistemic state."
      *   **Follow-up:** If the caution isn't driven by a *suspicion* of manipulation (which is impossible here), what *justifies* the normative pull of the worst-case scenario? Isn't it just an arbitrary psychological bias amplified by ignorance?

  6.  **Question (Normative vs. Psychological):** You emphasize this is a normative claim about permission, not a description. Does your view entail that an agent who *lacks* this ambiguity aversion (e.g., assigns a uniform prior over compositions and maximizes expected utility) is making a *rational error* in the Ellsberg case?
      *   *Likely Answer:* "Not necessarily an *error*; they are rationally permitted to be ambiguity-neutral, while I am permitted to be ambiguity-averse."
      *   **Follow-up:** If both ambiguity aversion *and* neutrality are permitted for the same evidence, doesn't this make rationality radically permissive? What substantive constraint does your "epistemic" imprecise credence actually impose on choices, beyond ruling out probabilistically incoherent preferences?

  7.  **Question (The Cost of Caution):** Maxmin can recommend rejecting a bet with a positive expected value under *every* prior in the set (e.g., if the ambiguous bet pays slightly more than the known one). Doesn't this mean your principle mandates leaving guaranteed gains on the table solely due to ambiguity?
      *   *Likely Answer:* "It permits caution, which may involve foregoing such gains. Avoiding the worst-case loss can be rational."
      *   **Follow-up:** Isn't this functionally equivalent to paying an "ambiguity premium" insurance cost? How do you distinguish this premium normatively from simple risk aversion priced into known probabilities?

  8.  **Question (Policy - Precautionary Principle):** Does your view lend normative support to the Precautionary Principle in regulation (acting to avoid worst-case outcomes under scientific uncertainty)? If so, how do you answer the objection that such caution imposes high, often identifiable, costs (e.g., delaying life-saving drugs, stifling innovation) based on speculative harms?
      *   *Likely Answer:* "It provides a framework for understanding such caution, but societal decisions involve complex aggregation, equity, and values beyond individual maxmin."
      *   **Follow-up:** If maxmin isn't directly applicable to policy, doesn't this highlight a key limitation of using a principle grounded in individual ambiguous gambles to model societal decisions under deep uncertainty?

  9.  **Question (Falsifiability):** What specific empirical finding or theoretical argument *would* convince you that your maxmin-with-imprecise-credence account is not just permissible, but descriptively or normatively inadequate? What's the strongest counter-evidence you grapple with?

  \answer{Q4}
