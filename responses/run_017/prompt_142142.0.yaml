  I'm in the second year of a PhD that sits between machine learning and philosophy, and I'm writing a qualifying paper on what, exactly, inverse reinforcement learning recovers when it recovers a human's preferences. My office-mate — a committed pragmatist about all of this, who thinks my worry is a tempest in a teapot — and I keep talking past each other, and I want to find out where the disagreement actually lives rather than just restating it louder.

  Here is the proposition I want a number on. Let R be a human demonstrator's actual reward function (whatever that comes to — part of the question is whether the term has a referent at all). An IRL system observes trajectories from that demonstrator in a training environment E and returns some reward function R-hat. Define preferences as identifiable in the relevant sense iff: for a randomly drawn member of a reference class of ordinary adult humans doing familiar tasks (kitchens, offices, ordinary roads — no adversarially selected cases), R-hat's induced ranking over the options available in a new environment E-prime, whose dynamics differ from E's and in which some features held fixed during training are now free to vary, agrees with R's ranking over those options more often than a baseline that samples uniformly at random from the set of reward functions behaviorally indistinguishable from R-hat in E — and does so by a margin wide enough that a deployment engineer would actually bet on it. I mean this as a question about the limit of what could in principle be extracted from behavior, not about today's algorithms; so count as available data the trajectories themselves plus response times, hesitations, eye movements, error-corrections, and the demonstrator's own verbal self-report treated as one more stream of behavior rather than as privileged access.

  The reason I think the random-from-the-equivalence-class baseline is the right one to beat: take the standard policy-invariance result. If you add to a reward function a term of the form gamma-times-Phi-of-s-prime minus Phi-of-s, where Phi is any function of state and gamma the discount factor, the set of optimal policies in that environment is unchanged; and, up to positive rescaling, transformations of that shape are the only ones with that property. So in my running example, Ada demonstrates cooking in an all-electric kitchen, where R-one = maximize the tastiness of the meal and R-two = R-one plus a shaping term keyed to whether the gas valve is open — a feature that never varies in her kitchen and so is behaviorally silent there — are indistinguishable in E, but come apart sharply once she is moved to a kitchen with a gas stove, and they come apart precisely over the safety-relevant behavior. My claim is that any IRL method whatsoever returns at best an equivalence class, and that which member of the class you get is fixed by the prior or regularizer, i.e. by something other than the data. My office-mate replies that the right target was never the demonstrator's reward-generating machinery but the reward function whose induced policy she would endorse on reflection, and that this target is identifiable to whatever degree we need. I am at 0.35 on the proposition; she is at 0.7. (If you think I have misstated the invariance result, say so in the output rather than quietly correcting it.)

  What I want from you: a single number for your headline credence in the proposition as stated — no it-depends-on-what-you-mean-by-preference, state the reading you chose and commit — plus the decomposition that produces it. Decompose at least along these lines: whether there is a determinate R to be recovered at all, or whether preferences are partly constituted by our ascriptions; whether the equivalence-class structure really is the binding constraint as opposed to actual suboptimal behavior (hesitation, mistakes, trembling hands) leaking enough information to pin R down within the class; whether a human is well modeled as maximizing anything stable across contexts, or whether the demonstrator is better treated as a population of shifting sub-agents; whether the reflective-endorsement target rescues identifiability or merely relocates the same problem one level up; and whatever further sub-question you think belongs. Give each a number and a one-sentence justification, say which direction it pushes, and note where the terms are not probabilistically independent. Then: how you combine them; which single sub-question your headline number is most sensitive to, quantified as the swing in the headline credence if that term were resolved one way rather than the other; a verdict on the two-kitchens case specifically; and which of the two of us at 0.35 and 0.7 you think is most likely wrong, about which sub-question, and what evidence would most move you.

