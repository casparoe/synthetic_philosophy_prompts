prompt: |-
  I've been arguing with two colleagues — one in organizational sociology, one in machine learning — about what Goodhart's law really explains, and we keep talking past each other, so I want to try it on a case whose facts aren't in dispute. Take the Wells Fargo retail-banking scandal that came to a head in 2016: employees in the community-banking division, working under aggressive cross-sell goals (roughly eight products per customer, tracked daily and by branch), opened millions of deposit and credit-card accounts that customers had never asked for, sometimes by inventing contact details and PINs or by shuffling small sums of money between accounts to simulate activity; customers got fees and credit inquiries they hadn't agreed to, thousands of employees were fired over several years, the bank paid regulatory penalties in the hundreds of millions and later in the billions, and the chief executive was gone by that October. I want this analyzed as a case of a proxy being optimized, not as a story about a few bad apples, and I don't need the figures to be exact.

  Here is the scaffolding I've been using, which you should either adopt or explicitly reject. Distinguish three mechanisms that usually get lumped together: (i) measure drift, where the world changes underneath a proxy that once correlated tolerably well with what you cared about; (ii) specification gaming, where an agent exploits a known gap between the proxy and the real target; (iii) proxy capture, where the agent, or some layer standing between the agent and the principal, gets a hand on how the proxy is itself recorded, so the number can be moved without the underlying quantity moving at all. Call the leaky residual whatever portion of the real target the proxy leaves out, and assume that gaming pressure concentrates there. On that apparatus: which mechanism is doing the work at Wells Fargo, and how do the different practices sort — the invented account details, the simulated funding, the branch-level quotas, the fact that internal monitoring appears to have been flagging and terminating people throughout? One feature I keep coming back to is that the proxy survived for years after it was widely known inside the firm to be gamed, and my hypothesis is that it survived because it was legible and cheap to aggregate up a hierarchy, not because anyone still believed it; call that the legibility premium, and tell me whether it is a real addition to the theory or only a redescription of it.

  Then run it in the other direction, from case to theory. My suspicion is that the slogan version of Goodhart — a measure, once made a target, stops being a good measure — actually misdescribes this case, because the count of opened accounts went on measuring exactly what it always measured and measuring it perfectly; what broke was the inference from that number to anything anyone had reason to care about, which is a different claim and doesn't obviously follow from the law as usually stated. I also suspect the theory has no vocabulary for the layer structure: branch employees and branch managers were each principals to someone and agents to someone else, and much of the behaviour looks less like profit-seeking than like avoidance of being fired, which a single-agent model of optimization against a fixed objective does not represent. Say whether you agree, and say plainly where the theory is silent rather than stretching it to speak — in particular on how the line between specification gaming and ordinary fraud is supposed to be drawn, and on what the theory would have predicted for the customers rather than for the bank.

  Give me exactly five numbered points, each two or three sentences, with no introduction and no conclusion: (1) the disciplined mapping — who the players are, what the objective and the proxy are, what strategies were actually available; (2) which of the three mechanisms is doing the work, and why; (3) what this lens explains that a straightforward greed-or-fraud story does not; (4) what it misses, misdescribes, or has to ignore; (5) what, if anything, the episode should make us change in the theory itself.
reasoning: |-
  Okay, the user is having an academic debate with colleagues about Goodhart's Law and wants to apply it to the Wells Fargo scandal. They've provided a detailed framework with three mechanisms (measure drift, specification gaming, proxy capture) and concepts like "leaky residual" and "legibility premium." 

  Hmm, this is a sophisticated request. The user clearly wants rigor—they're rejecting simplistic "bad apples" narratives and insisting on analyzing how proxy optimization drove systemic fraud. Their scaffolding suggests they've thought deeply about principal-agent problems and organizational incentives. 

  First, I need to precisely map Wells Fargo to their framework. The cross-sell metric (proxy) was meant to capture customer engagement/retention (true objective), but employees gamed it by creating fake accounts. The key question is which mechanism dominated: specification gaming fits best because employees exploited the gap between accounts opened (proxy) and actual customer value (target). 

  Notably, proxy capture wasn't the main issue—employees manipulated underlying activities, not the metric itself. And measure drift doesn't apply because the metric's flaw was inherent, not emergent. The user's "legibility premium" insight feels crucial: the metric persisted because it was administratively convenient, not because it worked. 

  Where the theory struggles is explaining why gaming continued despite known harms. Single-agent models miss layered incentives—branch staff avoided firing, not maximized profit. Also, Goodhart's usual formulation ("measure stops being good") is misleading here; the account count still "worked" as a metric, but its link to value broke. 

  For the response, I'll follow their five-point structure strictly. Point 1 will define players/proxy/strategies. Point 2 pins responsibility on specification gaming. Point 3 contrasts this with fraud narratives by showing systemic pressure. Point 4 flags theory gaps (layered agency, harm externalization). Point 5 suggests refining "legibility premium" and harm prediction. 

  The user's frustration with colleagues is palpable—they want ammunition for their interpretation. I'll avoid hedging and state conclusions boldly, especially their insight about metric legibility overriding functionality. They'll likely push back if I misrepresent their scaffolding, so I'll mirror their terminology exactly.
answer: |-
  Here are the five numbered points as requested:

  1.  **Disciplined mapping:** The principal (corporate leadership) set the objective as long-term profitability through customer loyalty/retention. The proxy was the number of products per customer ("cross-sell ratio"), implemented as branch-level quotas. Agents (branch managers/employees) had available strategies: genuine sales efforts, persuading customers to open *real* accounts, or fraudulently opening unauthorized accounts (inventing details, simulating funding).

  2.  **Dominant mechanism:** Specification gaming (ii) is primary. Agents actively exploited the known gap between the proxy (accounts opened) and the true objective (profitable customer relationships). They manipulated the *underlying activity* (creating accounts) without moving the true target (customer value), concentrating effort on the leaky residual (fake accounts generating fees/costs).

  3.  **Explanatory power beyond fraud/greed:** This lens explains the *systemic pressure* and *incentive structure* that made fraudulent behavior the path of least resistance for many employees, even those not inherently "greedy". It shows how the *proxy itself* motivated the harm, moving beyond individual malfeasance to organizational design failure, and accounts for the persistence driven by the "legibility premium" (easy aggregation/management).

  4.  **Limitations of the lens:** The theory under-specifies the layered agency problem: branch employees optimized to avoid firing by managers (themselves agents under pressure), not directly against the corporate principal's profit motive. It struggles to cleanly distinguish specification gaming (exploiting a proxy gap) from outright fraud (fabricating data/consent) in practice. It also poorly predicts the *externalized harm* to customers (fees, credit damage) beyond proxy failure.

  5. **Necessary theory revisions:** The episode necessitates incorporating the "legibility premium" as a distinct factor explaining proxy persistence *despite known gaming*. It challenges the slogan by showing proxies can remain *accurate measures of the thing they directly count* (opened accounts) while catastrophically failing as indicators of the *true objective* (value). The theory needs better models of multi-tiered, loss-averse agent incentives beyond simple profit optimization.
