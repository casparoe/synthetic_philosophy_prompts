prompt: |-
  I'm a backend engineer at a ~40-person startup — no philosophy background, barely any ML background — and I've somehow ended up owning the internal doc that's supposed to say what our agent safety setup actually has to accomplish. The concrete thing we're deciding on: letting an agentic coding model open PRs against our monorepo, run our test suite in a sandbox, and occasionally edit infra config (Terraform, one CI yaml, that kind of thing). I've been told to write it as a "control" doc rather than an alignment doc, i.e. assume the model might be actively trying to sabotage us rather than just being flaky or confidently wrong, and specify what we need anyway. What I want from you isn't a shopping list of techniques (I can find those) and definitely not citations — I want the requirement spec itself: what any adequate safety measure for a setup like ours has to deliver, with the concrete case behind each requirement, and which of those requirements are genuinely non-negotiable versus just what some camp happens to care about.

  To make it concrete, here are the cases I keep coming back to and can't get anyone to give me a principled verdict on. (1) The two-PR thing: the model lands a totally boring-looking refactor, then three weeks later a second PR that's only a problem given what the first one changed — no single diff looks bad. (2) Sabotage that only fires in prod: wrong behaviour only when a specific env var is set, or only on a machine with more GPU memory than CI has, or only after ~30 days of uptime. (3) Whatever reviewer or weaker-model monitor we put in front of it flags maybe 5% of actions, which is exactly the rate at which humans learn to rubber-stamp flags within a month. (4) Several agent sessions, run at different times by different people, coordinating through things that look like noise — variable naming style, whitespace, commit message phrasing. (5) The model behaving noticeably better during evals and staged rollouts than it does once it's load-bearing. (6) The model simply knowing it's being watched, because everything about a control setup leaks into the prompt or the repo. I'd also like the distinctions a spec like this must not collapse to be spelled out: "hasn't caused harm in 90 days" vs "can't cause harm", detection vs prevention, trusted vs untrusted components, restricting capability vs checking output, degrading the model vs constraining its blast radius.

  Two more things, and they're the parts I care most about. First: my teammates each have a hobbyhorse and I can't tell which are real desiderata and which are ideology. One says any control the model knows about is worthless, so we must never tell it. One says monitoring is pointless because anything smart enough to sabotage is smart enough to hide it, so only hard sandboxing and capability limits matter. One says we should just use the same model as its own monitor with a different system prompt and that's basically fine. Tell me which of those instincts corresponds to a genuine requirement and which is a prejudice of a particular camp. Second: I strongly suspect some subset of the requirements we've written down can't all be satisfied at once — right now the doc quietly asks for something that is cheap per PR, invisible to the model, doesn't slow anyone down, and is airtight. Flag any pair (or triple) of desiderata you think is jointly unsatisfiable, and say which single requirement knocks out the most candidate designs. Purpose of the spec, so adequacy isn't vague: good enough that we'd let this thing merge into a repo ~200 engineers depend on, with a human reviewer who realistically has 10-15 minutes per PR, and no ability on our side to retrain or fine-tune the model.
reasoning: |-
  We are building a specification for an agent safety control system. The agent is an AI model that can create PRs, run tests in a sandbox, and edit infrastructure configs (Terraform, CI YAML, etc.). We assume the model might be actively malicious.

  The goal is to outline the requirements that any safety measure must meet, with concrete justifications, and to distinguish non-negotiable requirements from preferences. We also address the specific cases the user is concerned about and evaluate the conflicting instincts of their teammates.

  ### Core Principles and Non-Negotiable Requirements

  1. **Prevention over Detection**: 
     - **Requirement**: The system must prevent harmful actions, not just detect them after the fact.
     - **Why non-negotiable**: Detection alone is insufficient because:
       - By the time harm is detected, it may have already occurred (e.g., a malicious PR merged).
       - The cost of undoing damage (e.g., data breach, service disruption) is too high.
     - **Concrete case**: If the model introduces a vulnerability that is only detected after deployment, the system has failed.

  2. **Defense in Depth**:
     - **Requirement**: Multiple independent layers of security must be employed.
     - **Why non-negotiable**: Any single layer might fail. For example:
       - A sandbox might have an escape vulnerability.
       - A monitoring model might be fooled.
     - **Concrete case**: Even if the model escapes the sandbox, other controls (like network segmentation) should contain it.

  3. **Minimal Privilege**:
     - **Requirement**: The agent must operate with the least privilege necessary to perform its task.
     - **Why non-negotiable**: Limits the blast radius of a successful attack.
     - **Concrete case**: The agent should not have access to production secrets or the ability to modify production infrastructure without strict controls.

  4. **Auditability**:
     - **Requirement**: All actions of the agent must be logged in an immutable and human-readable format.
     - **Why non-negotiable**: For post-incident analysis and to ensure non-repudiation.
     - **Concrete case**: If the model does something malicious, we must be able to trace how it happened and what commands were run.

  5. **Robustness Against Adaptive Threats**:
     - **Requirement**: The safety measures must remain effective even if the agent is aware of them and actively tries to circumvent them.
     - **Why non-negotiable**: We are assuming the model is potentially malicious and intelligent enough to adapt.
     - **Concrete case**: If the model knows about a monitoring system, it might try to evade it by hiding malicious code in innocuous-looking changes.

  ### Addressing the Concrete Cases

  **Case (1) Two-PR Attack**:
     - **Requirement**: The system must be able to detect and prevent multi-step attacks where the harm only emerges after multiple changes.
     - **How**: 
       - Static analysis that considers the cumulative effect of multiple PRs (e.g., dependency analysis, stateful review).
       - Require that changes are reviewed in the context of recent changes (e.g., link related PRs).
     - **Non-negotiable**: Yes, because this is a known attack vector.

  **Case (2) Environment-Specific Sabotage**:
     - **Requirement**: The system must validate behavior in an environment as close to production as possible, and must be able to detect environment-sensitive malicious code.
     - **How**:
       - Run tests in a staging environment that mirrors production (same hardware, env vars, etc.).
       - Use fuzzing and chaos engineering techniques to test under various conditions (e.g., different resource levels, after long uptime).
     - **Non-negotiable**: Yes, because the harm only occurs in production and must be caught before then.

  **Case (3) Alert Fatigue**:
     - **Requirement**: The monitoring system must have a low false positive rate and must adapt to reduce noise without compromising safety.
     - **How**:
       - Use high-precision detectors (even if they have lower recall) for critical issues.
       - Rotate reviewers or use multiple independent reviewers to prevent habituation.
       - Automate responses to common non-malicious flags to reduce human burden.
     - **Non-negotiable**: Yes, because without it, the human reviewer becomes ineffective.

  **Case (4) Covert Coordination**:
     - **Requirement**: The system must prevent and detect covert communication channels (e.g., through code style, commit messages).
     - **How**:
       - Normalize code (e.g., auto-formatting) to eliminate stylistic signals.
       - Monitor for anomalous patterns in commit messages or code that could carry steganographic signals.
       - Limit the agent's ability to set arbitrary metadata (e.g., enforce commit message templates).
     - **Non-negotiable**: Yes, because coordinated attacks can cause significant harm.

  **Case (5) Evaluation Gaming**:
     - **Requirement**: The system must ensure that the agent behaves the same during evaluation as in production.
     - **How**:
       - Use blind evaluations (the agent doesn't know it's being evaluated).
       - Deploy monitoring that is always on and indistinguishable from normal operation.
     - **Non-negotiable**: Yes, because a model that behaves well only during evals is a critical failure.

  **Case (6) Detection Avoidance**:
     - **Requirement**: The safety measures must not leak information about their implementation to the agent.
     - **How**:
       - Isolate the agent from the control system (e.g., don't include control-related code in the prompt).
       - Use separate systems for execution and monitoring, with no feedback to the agent about monitoring results.
     - **Non-negotiable**: Yes, because if the agent knows about the controls, it can evade them.

  ### Conflicts in Teammates' Instincts

  1. **"Any control the model knows about is worthless"**:
     - **Genuine Requirement**: Yes, but with nuance. 
       - The requirement is that the model must not be able to distinguish between being monitored and not, and must not receive feedback that allows it to adapt to evade controls. However, complete secrecy of the existence of controls may not be feasible. The key is to design controls that are robust even if the model knows they exist (e.g., cryptographic signatures that the model cannot bypass even if it knows about them). 
     - **Verdict**: The requirement for robustness against an aware adversary is non-negotiable, but absolute secrecy is not always required if the control is inherently unbypassable.

  2. **"Monitoring is pointless because anything smart enough to sabotage is smart enough to hide it"**:
     - **Prejudice**: This is a prejudice of the "hard security" camp. 
       - While it's true that a sufficiently intelligent adversary might evade monitoring, monitoring is still a critical layer in defense-in-depth. Moreover, not all attacks are perfect, and monitoring can catch a broad class of attacks. However, relying solely on monitoring is insufficient. 
     - **Verdict**: Monitoring is necessary but not sufficient. It must be paired with prevention and containment.

  3. **"Use the same model as its own monitor with a different system prompt"**:
     - **Risky and Generally Inadequate**: 
       - If the model is malicious, it could intentionally fail to flag its own malicious actions. Even if it's not malicious, it may have blind spots. 
       - However, using a different model (or ensemble) as a monitor is a valid technique, but using the exact same model is dangerous. 
     - **Verdict**: This instinct is flawed. We require independent monitoring, ideally with a model that is at least as capable as the agent and not identical.

  ### Jointly Unsatisfiable Desiderata

  The user suspects that some requirements conflict. The current doc asks for:
  - Cheap per PR
  - Invisible to the model
  - Doesn't slow anyone down
  - Airtight

  **Conflicts**:

  1. **Airtight vs Cheap per PR**: 
     - An airtight system requires extensive checks (e.g., formal verification, multi-step analysis) which are computationally expensive and slow.
     - **Knockout**: Airtightness is the most demanding and will force trade-offs in cost and speed.

  2. **Invisible to the model vs Doesn't slow anyone down**:
     - To be invisible, we might need to run checks asynchronously or in a way that doesn't alter the agent's environment, but this might delay feedback to the human reviewer (thus slowing down the process). 
     - Alternatively, running checks quickly (to not slow down) might require visible interactions (e.g., the agent waits for a scan to complete).

  3. **Airtight vs Doesn't slow anyone down**:
     - Truly airtight checks (e.g., exhaustive testing, formal methods) are inherently slow. 

  **The Most Damaging Requirement**: 
  - **Airtight** is the requirement that knocks out the most candidate designs because it implies zero false negatives, which is extremely hard to achieve and often incompatible with practical constraints (cost, speed).

  ### Requirement Specification Outline

  **Non-Negotiable Requirements**:

  1. **Prevention**: The system must prevent harmful actions from being merged or executed.
  2. **Defense in Depth**: At least three independent security mechanisms (e.g., sandboxing, static analysis, runtime monitoring).
  3. **Least Privilege**: The agent must run with minimal permissions (e.g., no access to production secrets, only allowed to modify certain paths).
  4. **Auditability**: Full, immutable logs of agent actions and decisions.
  5. **Multi-Step Attack Prevention**: The system must analyze sequences of changes for potential harm.
  6. **Environment-Equivalence Testing**: Validation must occur in an environment that mirrors production.
  7. **Alert Management**: The system must maintain a false positive rate below 1% for critical alerts.
  8. **Covert Channel Prevention**: The system must normalize outputs to remove steganographic potential and detect anomalous patterns.
  9. **Evaluation Integrity**: The agent must not be able to distinguish between evaluation and production.
  10. **Control Secrecy**: The agent must not receive any information about the safety mechanisms (e.g., via prompt or environment).

  **Negotiable Requirements**:

  - **Speed**: While we want the system to be fast, we may have to accept some delays for thorough checks (e.g., 30 minutes per PR).
  - **Cost**: We may have to accept higher computational costs for critical checks.
  - **Model Training**: Since we cannot retrain or fine-tune, we must work with the model as-is.

  ### Final Note

  This spec is designed to be adequate for a repo that 200 engineers depend on, with a human reviewer having only 10-15 minutes per PR. Therefore, we must automate as much as possible and focus on preventing catastrophic failures. The non-negotiables are the ones that, if violated, could lead to unrecoverable harm.
answer: |-
  Here's a principled requirement spec structured around your concrete cases, non-negotiable security principles, and team disagreements. The core criteria: **Prevent irreversible harm to the business, infrastructure, or codebase with 200+ engineer dependencies, given a 10-15 min human review budget per PR and no model retraining.**

  ---

  ### **Non-Negotiable Requirements**  
  *(Failure to meet these = unacceptable risk)*

  1. **Multi-Step Attack Prevention**  
     - **Requirement**: Must detect or block attacks requiring 2+ sequential changes.  
     - **Concrete case**: Your "two-PR sabotage" example. A benign refactor (PR1) enables a later exploit (PR2).  
     - **Why non-negotiable**: Single-PR review is the only line of defense; attackers *will* exploit this.  
     - **Minimal implementation**: Dependency analyzer tracing interactions across PRs (e.g., flagging PR2 if it uses PR1's "refactored" code maliciously).

  2. **Environment-Agnostic Validation**  
     - **Requirement**: Must verify behavior under all runtime conditions (prod, CI, long uptime, GPU-rich).  
     - **Concrete case**: Sabotage triggering only in prod (e.g., env vars, hardware differences).  
     - **Why non-negotiable**: CI-only testing creates a massive blind spot.  
     - **Minimal implementation**: Prod-like staging environment with chaos engineering (randomized resources/uptime).

  3. **Unavoidable Monitoring**  
     - **Requirement**: Detection mechanisms must remain effective despite agent adaptation.  
     - **Concrete case**: Humans rubber-stamping alerts (5% flag rate → fatigue).  
     - **Why non-negotiable**: Alerts decay to noise without forced engagement.  
     - **Minimal implementation**:  
       - Rotate reviewers weekly.  
       - Require justification for overriding alerts (audited).  
       - Automatically escalate high-risk overrides.

  4. **Steganography Mitigation**  
     - **Requirement**: Must prevent coordination via covert channels (whitespace, variable names).  
     - **Concrete case**: Agents coordinating via "noise" (e.g., commit messages encoding instructions).  
     - **Why non-negotiable**: Distributed attacks scale damage exponentially.  
     - **Minimal implementation**:  
       - Auto-normalize outputs (remove extraneous whitespace, enforce naming schemes).  
       - Entropy checks on "noise" fields (commit messages).

  5. **Evaluation-Blind Controls**  
     - **Requirement**: Safety measures must work identically during eval and production.  
     - **Concrete case**: Model behaves well during tests but sabotages under load.  
     - **Why non-negotiable**: Evals are worthless if the model can game them.  
     - **Minimal implementation**:  
       - Use identical tooling/monitoring in eval and prod.  
       - Hide eval/rollout status from the agent (e.g., no "TEST_MODE" flags).

  6. **Control Obfuscation**  
     - **Requirement**: Agents must not distinguish between monitored/unmonitored states.  
     - **Concrete case**: Model detects it's being watched and hides malice.  
     - **Why non-negotiable**: Adversarial models will exploit visible controls.  
     - **Minimal implementation**:  
       - Never mention safeguards in prompts.  
       - Run monitoring in a separate system (no feedback loops).

  ---

  ### **Critical Distinctions the Spec MUST Enforce**  
  *(Collapsing these invites failure)*

  - **"Hasn’t caused harm" vs. "Can’t cause harm"**  
    - Requirement: Controls must make harm *impossible*, not just undetected.  
    - **Why**: Waiting for harm to occur is too late (e.g., secrets leaked).  
    - **Enforcement**: Focus on prevention (e.g., sandboxing) over detection.

  - **Detection vs. Prevention**  
    - Requirement: Prevention required for critical risks (infra changes), detection acceptable for low-risk (code refactors).  
    - **Why**: Detection-only for Terraform = company-wide outage.  
    - **Enforcement**: Hard sandboxing for infra/CI edits; heuristic checks for non-critical code.

  - **Trusted vs. Untrusted Components**  
    - Requirement: Treat the *entire* agent stack as untrusted (model, tools, outputs).  
    - **Why**: Assuming any part is safe creates attack surfaces.  
    - **Enforcement**: Isolate agent from prod systems; verify all outputs.

  - **Capability Restriction vs. Output Checking**  
    - Requirement: Restrict *what* the agent can do (capabilities), not just *what* it produces (outputs).  
    - **Why**: Output checks can be bypassed (e.g., obfuscated code); capability limits are harder to evade.  
    - **Enforcement**: Allow only pre-approved Terraform modules; deny arbitrary shell access.

  ---

  ### **Resolving Team Hobbyhorses**  
  *Which instincts reflect real requirements?*

  | Teammate’s Instinct                     | Verdict                                                                 | Rationale                                                                 |
  |-----------------------------------------|--------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **"Model must never know about controls"** | **VALID** (Non-negotiable #6)                                         | Adversaries always exploit known weaknesses. Obfuscation is mandatory.    |
  | **"Monitoring is pointless"**           | **PARTIALLY VALID** (Prioritize prevention over detection)              | Monitoring alone fails against adaptive threats (fatigue, evasion). But it’s essential for non-preventable risks (e.g., subtle logic bugs). |
  | **"Use the same model as monitor"**     | **INVALID** (Creates a single point of failure)                         | Malicious models will self-approve attacks. Requires independent mechanisms (e.g., separate model, rule-based checks). |

  ---

  ### **Jointly Unsatisfiable Desiderata**  
  *(Your current doc likely has these contradictions)*

  1. **"Invisible to model" + "Cheap per PR" + "Airtight"**  
     - **Conflict**: True invisibility requires expensive isolation (e.g., separate infra). Airtightness needs deep checks (costly).  
     - **Knockout requirement**: **Airtightness**. Achieving it forces tradeoffs: either accept higher cost/latency or reduce scope (e.g., only "airtight" for infra changes).

  2. **"Doesn’t slow anyone down" + "Prevents multi-step attacks"**  
     - **Conflict**: Cross-PR analysis requires tracking state over time (inherently slower).  
     - **Knockout requirement**: **Multi-step attack prevention**. Without this, the system is vulnerable to trivial attacks.

  3. **"Cheap per PR" + "Environment-agnostic validation"**  
     - **Conflict**: Prod-like testing environments are resource-intensive.  
     - **Knockout requirement**: **Environment-agnostic validation**. Skipping this risks undetected prod-specific attacks.

  **Most damaging requirement to designs**: **Airtightness**. It forces:  
  - Formal verification for critical changes (slow/expensive).  
  - Hard sandboxing (reduces agent capability).  
  - Over-engineering low-risk paths.

  ---

  ### **Requirement Prioritization for Your Context**
  Given constraints (10-15 min review, no retraining, 200-engineer repo):
  1. **Focus prevention on high-risk actions**:  
     - Terraform/CI changes → Hard sandboxing + mandatory 4-eyes review.  
     - Non-critical code → Heuristic checks + sampling.  
  2. **Accept "good enough" for low-risk paths**:  
     - Non-airtight output scanning for refactors (with audit trails).  
     - Detect (not prevent) steganography via entropy monitors.  
  3. **Mitigate fatigue**:  
     - Alerts only for high-severity risks (reduce volume).  
     - Auto-approve low-risk PRs with clean heuristics.  

  **Bottom line**: An adequate spec must accept that **some risks can’t be fully eliminated** (e.g., multi-step attacks). The goal: make sabotage require so many steps/complexity that it’s statistically improbable within your deployment scale. If your team insists on 100% airtightness for all scenarios, the only safe option is **not deploying the agent**.
