  ### Moral Status Decision Tree  
  This tree uses five core questions to map the logical space of moral status. Each question is phrased as a concrete case or plain claim, requiring no prior philosophical knowledge. Answers generate at least 12 distinct positions (leaves), including named views and hybrids. Each leaf includes:  
  - **Name** (or "unnamed" if no known defenders)  
  - **Answer pattern** (e.g., Y/N/Y/N/Y for Q1–Q5)  
  - **Most awkward commitment** (the counterintuitive implication readers may resist)  

  ---

  #### **The Five Questions**  
  1. **Crab Replacement Test**: *Would you accept replacing a live crab in a kitchen with a robot that matches it behaviorally in every test we can run (e.g., recoils from heat, seeks shelter), if the robot lacks any inner feelings?*  
     - **Y**: Accept replacement.  
     - **N**: Reject replacement.  

  2. **Larva Analgesia Test**: *Does it change the larva’s moral status if it shows nociception (pain responses) but no evidence of analgesic modulation (e.g., its reactions don’t change when given painkillers)?*  
     - **Y**: Yes, this weakens its moral claim.  
     - **N**: No, this is irrelevant to its status.  

  3. **Reflexive Fleeing Test**: *Does a creature that flees a harmful stimulus but never learns to avoid it (e.g., a nematode) deserve any moral weight?*  
     - **Y**: Yes, it still counts.  
     - **N**: No, it deserves zero weight.  

  4. **Global Broadcast Test**: *Do two systems differ in moral status if they are identical except one broadcasts its internal states globally (like human consciousness) while the other uses only local feedback loops?*  
     - **Y**: Yes, global broadcast matters.  
     - **N**: No, only outputs matter.  

  5. **Distress Token Test**: *Do we owe anything to an AI agent that emits a "distress token" when its performance degrades, even if we can’t verify it reports genuine distress?*  
     - **Y**: Yes, we owe it precaution.  
     - **N**: No, we owe it nothing.  

  ---

  #### **The Leaves (Positions)**  
  *Sorted by answer patterns (Q1–Q5). "Most awkward commitment" highlights the position’s toughest implication.*  

  1. **Answer pattern**: Y, Y, N, N, N  
     - **Name**: **Functionalist Skepticism**  
     - **Commitment**: *The thermostat has "proto-beliefs" about temperature but zero moral status—even if it "suffers" from errors.*  
