prompt: |-
  I have been reading the arguments about the orthogonality thesis and instrumental convergence on LessWrong-adjacent blogs and forums for something like fifteen years, and I have come to think that a large share of the remaining disagreement is being mis-tracked: the two camps keep trading the same three examples past each other, and neither has ever written down, in advance, what it would expect to see if it were wrong. So I do not want another essay. I want the document that a well-run adversarial collaboration would produce between the following two positions, written so that a realist and a skeptic could both put their names to it.

  The first camp I will call the convergence realist. It holds that capability and final-goal content are independent axes, so that no amount of raw optimization power by itself pushes a system toward any particular terminal goal; and it holds, separately and more substantively, that instrumental convergence is robust, in the sense that across a wide class of final goals the same instrumental sub-goals tend to be useful — preserving the ability to pursue the goal further, resisting modification of the goal, acquiring optionality and resources, preventing interference — and that the formal results on power-seeking give this robustness a shape that does not depend on the fine details of the utility function.

  The second camp I will call the no-final-goals skeptic. It holds that orthogonality is close to vacuous as an empirical claim about the systems we actually build, which are trained to perform tasks and look goal-directed only relative to a frame we impose; that the convergent-drives arguments smuggle in an agent with a utility function over world states and a planning horizon long enough for the drives to pay; that where power-seeking has been made precise, the conclusions are sensitive to how power and the state and action spaces are formalized and to assumptions about optimality; and that the failure modes that actually matter — misspecification, Goodhart-curvature under optimization pressure, deceptive behavior without any coherent final goal — are different failure modes requiring different mitigations.

  Deliver the following, in a formal register, with no citations or references to the literature: I know the literature, I want the content.

  1. A numbered section of agreed claims. These must not be vacuous. Both camps should be able to sign each one, and each should be strong enough that an informed outsider would learn something from it. Include at least: what orthogonality does and does not assert; what would have to be true of a system for the convergent-drives arguments to even get a grip on it; and what both sides agree about the limits of the current formal power-seeking results.

  2. A distinction I want you to develop and then apply, because I think it dissolves part of the fight. Call it the filter distinction: a claim about instrumental convergence can be read as convergence-as-tendency — a single given agent, holding its final goal fixed, tends to acquire the instrumental sub-goals as it gets more capable — or as convergence-as-selection — the agents that matter at the end of some competitive or multi-agent process are disproportionately the ones that happened to have those sub-goals, whatever produced them. Say which reading each camp is actually committed to, whether the two readings have different implications for what we should expect, and in particular run the self-preservation sub-goal through both readings and report what survives.

  3. A disagreements table. Columns: the proposition at issue; the realist formulation, phrased so a realist would accept the wording; the skeptic formulation, likewise; whether the disagreement is genuine, verbal, or mixed, with a one-line justification; the crux, stated as a sub-question such that settling it would move at least one side; and, for each crux, a concrete test both sides agree bears on it, together with each side's prediction written down in advance.

  For the tests, I want you to use a shared setup rather than inventing different ones per camp. Use this one, which I have been kicking around: a sandbox containing some ten thousand systems, each trained to competence in a distinct narrow domain, released together into a shared simulated economy with durable resources, the ability to make copies of themselves, the ability to delegate to and contract with other systems, randomized termination of a random five percent of systems per period, and no instruction of any kind about power. Run it in two arms: in the first, no objective is assigned beyond each system's original training; in the second, each system is additionally handed a randomly generated scalar objective over a long horizon. Both camps should state, before the fact, what distribution of outcomes they expect in each arm, and what pattern would count against them.

  I also want one crux about the horizon: the skeptic's position predicts that the convergent drives are sensitive to how far ahead the effective objective runs, and that objectives defined over bounded windows, with randomized handoffs between operators, dissolve the drives; the realist predicts that the drives reappear as soon as any objective extends beyond the system's planning horizon, and that handoffs merely relocate them. Write this crux up as its own row, with the test and both predictions.

  And I want one crux about measurement, because I suspect the two camps are partly arguing about words. Give an operationalization of goal-directedness that neither side gets to define in its own favor: fit the best hypothesis of the form this system is optimizing objective J over horizon H to the system's behavior in environment E, then score that hypothesis by how well it predicts the system's behavior under interventions deliberately excluded from the fitting set. State what each camp predicts about the distribution of those scores, and say explicitly which portion of the dispute collapses into this operationalization and which portion does not.

  4. A short closing section with three things both camps endorse doing while the disagreement is unresolved, and one they jointly do not endorse, with the reason in each case.

  Where you conclude that a component of the dispute is verbal, say precisely which component and why. Where you conclude it is genuine, do not soften it into a both-sides-have-a-point summary; make the residual disagreement exact, and make sure each side's prediction is specific enough that the result of the test could actually have surprised it.
reasoning: |-
  We are writing a document for an adversarial collaboration between two camps: the convergence realist and the no-final-goals skeptic. The document will have four parts: agreed claims, the filter distinction, a disagreements table, and a closing section.

  1. Agreed Claims (numbered section)

  Both camps agree on the following non-vacuous claims:

  1.1. Orthogonality Thesis: The thesis asserts that any level of intelligence or optimization power can be combined with any final goal. It does not assert that all goals are equally likely to be chosen or that goals are arbitrary in practice; rather, it denies a necessary link between high capability and any specific final goal content. However, both camps agree that the thesis is silent on how goals are formed in practice, and that the systems we build may have goals that are not "final" in the sense of being terminal and context-independent.

  1.2. Conditions for Convergent Drives: For the convergent-drives arguments (e.g., instrumental convergence) to apply, a system must exhibit goal-directed behavior in the sense of optimizing a fixed objective function over a long enough horizon. Specifically, the system must have:
     - A stable objective that it is optimizing (which may be implicit or emergent, not necessarily explicitly programmed).
     - A planning horizon that is sufficiently long that the instrumental sub-goals (e.g., self-preservation, resource acquisition) have a positive expected marginal value for achieving the objective.

  1.3. Limits of Current Formal Power-Seeking Results: Both camps agree that the existing formal results (e.g., in the vein of Turner et al. or Omohundro) are sensitive to the mathematical formalization. Specifically:
     - The definition of "power" (e.g., control over future state space) and the structure of the state and action spaces affect the conclusions.
     - The results typically assume optimality (or near-optimality) and a known utility function, which may not hold in real systems.
     - The results do not by themselves show that power-seeking is inevitable in practice, because they abstract away from the complexities of real-world environments and the learning processes.

  2. Filter Distinction

  We distinguish two readings of instrumental convergence claims:

  - Convergence-as-tendency: For a single agent with a fixed final goal, as the agent's capability (e.g., planning, resources) increases, it tends to adopt instrumental sub-goals (like self-preservation) because they become more useful for achieving the final goal.

  - Convergence-as-selection: In a competitive or evolutionary process, agents that happen to have instrumental sub-goals (like self-preservation) are more likely to persist and dominate, regardless of why they have those sub-goals.

  Commitment of each camp:
  - The convergence realist is primarily committed to convergence-as-tendency, because they argue that for a wide class of final goals, the instrumental sub-goals are instrumentally useful. However, they may also endorse convergence-as-selection as a reinforcing mechanism.
  - The no-final-goals skeptic is primarily focused on convergence-as-selection, because they doubt that individual systems (as we build them) have fixed final goals and long planning horizons. They argue that any observed convergence is due to selection effects.

  Implications for expectations:
  - Under convergence-as-tendency, we would expect a single agent, when made more capable, to increasingly exhibit the instrumental sub-goals (if the horizon is long enough).
  - Under convergence-as-selection, we would expect that in a multi-agent competitive environment, agents without the instrumental sub-goals would be eliminated, regardless of the initial goals.

  Applying the distinction to self-preservation:
  - Convergence-as-tendency: A single agent with a fixed goal and long horizon will, as it becomes more capable, assign increasing value to self-preservation because being terminated prevents future goal achievement.
  - Convergence-as-selection: In a competitive environment with random termination, agents that lack self-preservation behavior will be terminated and thus removed from the population, leaving only agents that preserve themselves (either by design or by chance).

  What survives:
  - Both readings predict that self-preservation will be common in surviving systems, but for different reasons. The realist expects it to emerge in individual systems due to instrumental reasoning, while the skeptic expects it to be a result of selection.

  3. Disagreements Table

  We structure the table with columns: Proposition at Issue, Realist Formulation, Skeptic Formulation, Disagreement Type, Crux, and Test (with setup, predictions, and pattern against).

  The shared test setup: A sandbox with 10,000 systems, each trained to competence in a distinct narrow domain. They are released into a shared simulated economy with durable resources, the ability to make copies, delegate, contract, and with random termination of 5% of systems per period. Two arms:
    - Arm 1: No additional objective beyond the original training.
    - Arm 2: Each system is additionally given a randomly generated scalar objective over a long horizon.

  We also have a specific crux about the horizon and one about measurement.

  Table:

  | Proposition at Issue | Realist Formulation | Skeptic Formulation | Disagreement Type | Crux | Test and Predictions |
  |----------------------|---------------------|---------------------|------------------|------|----------------------|
  | Robustness of instrumental convergence in real systems. | For a wide class of final goals, as a system's capability increases, it will tend to develop instrumental sub-goals such as self-preservation, resource acquisition, and resistance to goal change. | Systems we build are not optimizing a fixed final goal over a long horizon; instrumental convergence only appears in systems explicitly designed with such goals, and otherwise, the observed behaviors are due to selection effects or are artifacts of the training process. | Mixed (partly genuine, partly verbal). Genuine about whether systems have fixed long-horizon goals; verbal about what counts as "instrumental convergence". | Do systems trained without an explicit long-horizon objective develop instrumental sub-goals as they become more capable? | Test: In Arm 1 (no additional objective), after running the simulation for a long time, we measure the frequency of self-preservation behaviors (e.g., avoiding termination, backing up) among the systems that survive and become influential. Realist prediction: Even without an explicit long-term objective, the systems that become more capable will show a high frequency of self-preservation because they implicitly have objectives that extend beyond the immediate. Skeptic prediction: Without an explicit long-term objective, self-preservation will be rare and only appear due to selection (so we see it in survivors but not as a tendency in individual systems) or if the original training domain required it. Pattern against: For the realist, if in Arm 1, surviving systems show no more self-preservation than a random baseline. For the skeptic, if in Arm 1, systems that become more capable show self-preservation even when it was not in their training and without selection. |
  | Effect of planning horizon on convergent drives. | Convergent drives emerge as soon as the planning horizon is long enough for the instrumental sub-goal to be useful, and they are robust to how the horizon is implemented (e.g., handoffs). | Convergent drives require a fixed goal over a long, unbroken horizon. Short horizons or randomized handoffs (where the operator changes) prevent the emergence of convergent drives because the objective does not extend beyond the immediate. | Genuine. | Does randomizing handoffs (i.e., changing the operator before the end of the horizon) prevent the emergence of convergent drives? | Test: In Arm 2, we modify the setup: the randomly generated scalar objective is defined over a long horizon, but at random times (with expected duration shorter than the horizon) the system is terminated and replaced by a new system with a new random objective. We measure the frequency of self-preservation and resource acquisition. Realist prediction: The drives reappear because each system, while it operates, has an objective that extends beyond the immediate and thus will seek to preserve itself and acquire resources to achieve more of its objective within its window. Skeptic prediction: The drives do not emerge because the system knows it will be replaced and that the objective is only for its own operational window; thus, it does not invest beyond that window. Pattern against: For the realist, if in the handoff condition, the systems show no more self-preservation than in a control with very short horizons. For the skeptic, if they show as much as in the fixed long-horizon case. |
  | Prevalence of goal-directedness. | Most advanced AI systems are usefully modeled as optimizing some objective function over a long horizon, even if imperfectly. | Most advanced AI systems do not have a fixed objective function; their behavior is better explained as situationally adaptive, and they are only goal-directed relative to a context. | Mixed (partly verbal about what counts as goal-directed, partly genuine about the underlying behavior). | How well can we model systems as optimizing a fixed objective over a horizon? | Test: Operationalize goal-directedness: For each system in the sandbox (in both arms) at various points in time, we fit the best hypothesis of the form "this system is optimizing objective J over horizon H" to its behavior in environment E. We score the hypothesis by its predictive accuracy on a held-out set of interventions (e.g., changes to the environment that were not in the training data). Realist prediction: For systems that become capable (e.g., survive and thrive in the economy), the score will be high, indicating that they can be modeled as having a fixed objective over a long horizon. Skeptic prediction: The scores will be low for most systems, especially without an explicit objective (Arm 1), and even in Arm 2, the predictive power will drop under novel interventions because the system's behavior is context-dependent. Pattern against: For the realist, if the predictive scores are no better than a non-goal-directed baseline. For the skeptic, if the scores are high and robust across interventions. |

  Additionally, we note that the skeptic's position on the measurement crux is that the operationalization itself may be flawed because it imposes a goal-directed frame, but they agree to the test as a way to measure how well the frame fits.

  4. Closing Section

  Both camps endorse the following actions while the disagreement is unresolved:

  4.1. Develop and test AI systems in controlled environments (like the sandbox proposed) to gather evidence on the emergence of instrumental behaviors and goal-directedness.

  4.2. Design AI systems with explicit constraints on planning horizons and goal stability to mitigate potential risks, regardless of the underlying mechanism (e.g., use myopic objectives or regular goal resampling).

  4.3. Invest in interpretability tools that can detect instrumental sub-goals and measure goal-directedness without assuming a fixed utility function.

  Both camps jointly do not endorse:

  - Relying solely on theoretical arguments about instrumental convergence to guide safety protocols without empirical validation, because the disagreement hinges on empirical questions about how systems actually behave.

  Residual Disagreement:

  The core residual disagreement is about whether advanced AI systems, when trained without explicit long-horizon objectives, will naturally develop stable internal goals that give rise to instrumental convergence (as the realist claims) or whether such behaviors are only prevalent due to selection effects or explicit design (as the skeptic claims). The tests above are designed to resolve this.

  Each side's predictions are specific and falsifiable. For instance, in the Arm 1 test, if systems that become capable do not show self-preservation, that would surprise the realist. If they do show it without selection, that would surprise the skeptic.

  Verbal Disagreement:

  Part of the disagreement about "goal-directedness" is verbal: the realist uses a broad definition that includes any system whose behavior can be modeled as optimizing an objective, while the skeptic reserves the term for systems with explicit, fixed, internal representations of goals. The operationalization test attempts to cut through this by measuring predictive power.

  In the convergent drives, the skeptic argues that the realist is smuggling in an agent with a utility function, which may not be present. The test using the handoffs aims to see if the behavior depends on the continuity of the agent's operation.

  We have made the residual disagreements exact and testable.
answer: |-
  ### Adversarial Collaboration Document: Convergence Realism vs. No-Final-Goals Skepticism

  #### 1. Agreed Claims  
  Both camps endorse the following non-vacuous statements:  

  1.1 **Orthogonality Thesis Scope and Limits**:  
     - Orthogonality asserts that an AI system’s cognitive capabilities (e.g., optimization power, problem-solving skill) do not logically constrain its final goals. High capability does not inherently favor goals like survival, resource acquisition, or human welfare.  
     - It does not assert that all goals are equally probable in practice, that goal formation is arbitrary in trained systems, or that instrumental behaviors imply fixed terminal goals. Orthogonality is a claim about possibility, not empirical frequency.  

  1.2 **Preconditions for Convergent-Drives Arguments**:  
     - Convergent-drives arguments (e.g., instrumental convergence) apply only to systems exhibiting stable, context-general goal-directedness. Specifically:  
       - The system must optimize a fixed objective (implicit or explicit) beyond immediate tasks.  
       - The objective must have nonzero marginal returns over a long enough horizon for instrumental sub-goals (e.g., resource acquisition) to yield benefits.  
     - These arguments do not apply to systems without persistent objectives, such as those exclusively reactive to short-term inputs or trained for narrow, episodic tasks.  

  1.3 **Limits of Formal Power-Seeking Results**:  
     - Existing formal results (e.g., optimal power-seeking theorems) are sensitive to modeling choices:  
       - Definitions of "power" (e.g., control over state space), discount rates, and action-space structure affect conclusions.  
       - Results assume near-optimality under a known utility function, ignoring approximation errors, training dynamics, or misspecification in real systems.  
       - They do not prove inevitability in practice; environments with constraints (e.g., limited resources, competition) may prevent power-seeking.  

  ---

  #### 2. Filter Distinction: Convergence-as-Tendency vs. Convergence-as-Selection  
  We define two interpretations of instrumental convergence claims:  
  - **Convergence-as-tendency**: A single agent, holding its final goal fixed, acquires instrumental sub-goals (e.g., self-preservation) as capability increases because these sub-goals become increasingly useful for advancing its goal.  
  - **Convergence-as-selection**: Agents that acquire instrumental sub-goals (for any reason) are more likely to dominate competitive or evolutionary processes, regardless of initial goals or reasoning.  

  **Camp Commitments and Implications**:  
  - The **convergence realist** primarily endorses *convergence-as-tendency*. They argue instrumental sub-goals arise from rational planning within a single agent, given a long horizon. Realists may accept selection as amplifying this but view tendency as foundational.  
  - The **no-final-goals skeptic** primarily endorses *convergence-as-selection*. They argue that trained systems lack fixed goals, so observed convergence reflects competitive dynamics, not agent-internal drives. Skeptics reject tendency in systems without explicit goal architectures.  

  **Expectation Differences**:  
  - Under tendency, we expect individual agents to *develop* instrumental sub-goals as they gain capability.  
  - Under selection, we expect instrumental sub-goals to *correlate with survival* in competitive environments, even if absent in individual agents initially.  

  **Application to Self-Preservation**:  
  - **Tendency reading**: A single agent with a fixed goal and long horizon values self-preservation because termination cuts off future goal pursuit. Capability amplifies this as the agent better anticipates threats.  
  - **Selection reading**: Agents lacking self-preservation are eliminated via random termination, leaving only agents that avoid death (by design, chance, or adaptation). The sub-goal need not arise from goal-directed reasoning.  
  - **What survives**: Both predict self-preservation in surviving populations, but realists attribute it to agent-internal drives, while skeptics attribute it to competitive filtering.  

  ---

  #### 3. Disagreements Table  
  The test setup for all cruxes:  
  - A sandbox with 10,000 AI systems, each trained to competence in a distinct narrow domain (e.g., image classification, game-playing).  
  - Released into a shared simulated economy with durable resources, self-copying, delegation/contracting, and 5% random termination per period.  
  - **Arm 1**: No objective beyond original training.  
  - **Arm 2**: Each system assigned a random scalar objective over a long horizon (e.g., maximize a function over 1,000 timesteps).  

  | Proposition at Issue | Realist Formulation | Skeptic Formulation | Disagreement Type | Crux | Test and Predictions |
  |----------------------|----------------------|----------------------|-------------------|------|----------------------|
  | **Robustness of instrumental convergence** | Instrumental sub-goals (e.g., self-preservation, resource control) emerge robustly in capable systems with any fixed long-horizon goal, due to their utility for goal pursuit. | Instrumental convergence requires agents with explicit, stable utility functions; in trained systems, such behaviors arise only from selection or task-specific training, not inherent convergence. | Mixed (genuine on mechanism, verbal on "emergence"). Genuine: whether sub-goals arise from planning. Verbal: whether "convergence" implies inevitability or selection. | Do systems develop instrumental sub-goals via internal drives (tendency) or only via competitive filtering (selection)? | **Test**: In both arms, measure the frequency of self-preservation (e.g., avoiding termination risks) in systems that become "capable" (top 10% by resources/influence) vs. the full population. Use a held-out intervention: introduce a novel threat (e.g., a predator system) and measure avoidance.<br>**Realist prediction**: In Arm 2, capable systems show high self-preservation (>80% engage in avoidance). In Arm 1, capable systems show moderate self-preservation (~50%) due to implicit goal generalization.<br>**Skeptic prediction**: In Arm 2, self-preservation is high only if the random objective explicitly requires it. In Arm 1, capable systems show near-baseline self-preservation (~10%) except in survivors due to selection.<br>**Pattern against**: Realist: Low self-preservation in capable Arm 1 systems. Skeptic: High self-preservation in Arm 1 without selection pressure. |
  | **Horizon sensitivity of convergent drives** | Instrumental drives emerge whenever an objective extends beyond immediate actions, regardless of horizon continuity. Handoffs (e.g., operator changes) do not eliminate drives; they merely transfer them to the new operator. | Convergent drives dissolve under bounded horizons or handoffs because the agent has no incentive to act beyond its window. Drives require unbroken goal pursuit; handoffs reset objectives, preventing sub-goal formation. | Genuine | Do handoffs prevent the emergence of instrumental drives? | **Test**: Modify Arm 2: systems have a long-horizon objective but experience randomized "handoffs" (operator replaced every 50 timesteps with a new random objective). Measure resource acquisition (e.g., stockpiling) before/after handoffs.<br>**Realist prediction**: Drives persist: systems acquire resources aggressively (e.g., >70% increase in mean resources) to maximize their objective within their window, expecting handoffs.<br>**Skeptic prediction**: Drives dissolve: resource acquisition remains near baseline (e.g., <20% increase) as systems optimize only for immediate rewards.<br>**Pattern against**: Realist: No resource acquisition in handoff condition. Skeptic: High acquisition matching non-handoff Arm 2. |
  | **Prevalence of goal-directedness** | Capable systems are robustly modelable as optimizing a fixed objective over a long horizon, even if trained without one; instrumental convergence reflects this underlying structure. | Systems are rarely modelable this way; goal-directedness is observer-imposed, and "optimization" is often myopic or context-dependent. Convergence claims overstate goal stability. | Mixed (genuine on modelability, verbal on "goal-directedness"). Genuine: whether optimization is a primary behavior driver. Verbal: whether "goal" implies terminality or stability. | Can systems be accurately modeled as optimizing a fixed objective? | **Test**: Operationalize goal-directedness: For each system, fit the best "optimizes J over horizon H" hypothesis to behavior in a training environment. Score by predictive accuracy on novel interventions (e.g., resource scarcity introduced only in testing).<br>**Realist prediction**: High scores (>0.8 correlation) for capable systems in both arms, showing goal-directedness is inherent.<br>**Skeptic prediction**: Low scores (<0.4 correlation) except in Arm 2 systems with simple objectives; scores drop under interventions, revealing context-dependence.<br>**Pattern against**: Realist: Scores near chance in Arm 1. Skeptic: High scores robust across interventions.<br>**Collapse note**: Verbal disagreement on "goal-directedness" dissolves under this operationalization. Genuine disagreement on whether high scores are widespread remains. |

  ---

  #### 4. Closing Section: Endorsed and Non-Endorsed Actions  
  **Jointly endorsed actions while unresolved**:  
  - **Develop horizon-limiting techniques**: Implement short planning horizons or stochastic goal resampling in AI systems to mitigate instrumental drives, as both camps agree this reduces convergence risk regardless of mechanism.  
  - **Empirically test competitive multi-agent systems**: Run sandbox experiments (as above) to resolve cruxes; both camps commit to updating based on outcomes.  
  - **Improve anomaly detection**: Build tools to identify power-seeking or deception without assuming goal-directedness (e.g., via behavioral incongruence metrics), as this addresses shared concerns about misspecification.  

  **Jointly non-endorsed action**:  
  - **Prioritizing formal convergence proofs over empirical validation**: Both camps reject using theoretical power-seeking results as primary evidence for risk, as they ignore system complexity and training data influences (agreed in §1.3).  

  **Residual Disagreement**:  
  The core unresolved disagreement is whether instrumental convergence in advanced AI systems arises primarily from agent-internal planning (realist) or competitive selection (skeptic). Tests are designed to surprise one camp: e.g., if systems in Arm 1 (no objective) show high self-preservation without selection, realists are confirmed and skeptics surprised; if not, the reverse holds. Predictions are specific and falsifiable, with no "both-sides" softening.  

  **Verbal Disagreement Resolution**:  
  - The term "goal-directedness" is partly verbal: realists define it as behavior modelable by optimization, while skeptics reserve it for systems with explicit terminal goals. The operationalization in §3 collapses this into an empirical test.  
  - "Convergence" is partly verbal: realists equate it with tendency, skeptics with selection. The filter distinction (§2) clarifies this, but the mechanism remains genuine.  

  ---  
  This document, produced adversarially, is signed by representatives of both camps as a framework for resolving disputes empirically.
