answer: |-
  *   **1. Does the system have a causally structured internal state space mirroring formal state transitions (beyond mere mapping existence)?**
      *   **No: Implementation is trivial/observer-relative.**
          *   **2. Is computation necessarily observer-dependent (requiring an interpreter/designer)?**
              *   **Yes:** **Deflationary Computationalism (Trivialist/Observer-Relative):** The brain computes only in the trivial sense that any physical system can be mapped onto computational descriptions; "real" computation requires an external perspective.
              *   **No: (Incoherent Branch):** Claiming objective computation without causal structure collapses into triviality or requires observer-relativity.
          *   *(Skipped: Representational questions are moot here)*
      *   **Yes: Implementation requires causal structure.**
          *   **3. Is computation an objective mechanistic fact (independent of interpretation/design)?**
              *   **No:** *(Unattractive Branch):* Denying objective computation despite causal structure undermines the point of positing such structure mechanistically.
              *   **Yes: Computation is objective and mechanistic.**
                  *   **4. Twin Computation Case: Are both divergent models (agreeing on all actual inputs, disagreeing on counterfactuals) equally valid implementations?**
                      *   **Yes:** **Mechanistic Computationalism (Piccinini-style):** Computation is defined by the mechanistic processing of medium-independent vehicles; counterfactual differences alone don't invalidate either model if both fit the actual causal structure.
                      *   **No:** *(Implies constraints beyond actual causal structure for unique implementation)*
                          *   **5. Must computation be representational (involve semantic content)?**
                              *   **No:** *(Unattractive/Unexplored Branch):* Requiring unique counterfactual profile without representational content is obscure.
                              *   **Yes: Computation requires representation.**
                                  *   **6. Is cognition necessarily computational?**
                                      *   **No:** **Representational-but-not-Computational:** The brain processes representations, but not via discrete, rule-based computation (e.g., some connectionist views emphasizing holistic processing).
                                      *   **Yes: Cognition is computational.**
                                          *   **7. Does the mind depend only on abstract computational organization?**
                                              *   **No:** **Classical Computationalism (Language of Thought):** Cognition involves rule-based manipulation of symbolic representations, but realization depends on specific causal/physical properties (e.g., speed matters - reject slow emulation).
                                              *   **Yes:** *(Implies strong multiple realizability/constitutivity)*
                                                  *   **8. Is implementation graded? (Systems implement computations to degrees, relevance key)**
                                                      *   **No:** *(Collapses: Gradedness directly challenges the all-or-nothing nature of this constitutive question)*
                                                      *   **Yes:** **Graded Implementation / Mechanistic Relevance:** The brain implements innumerable computations; cognitive explanation picks out those mechanistically relevant to the specific causal structure.
                                          *   *(Skipped: The graded 'Yes' branch above handles the constitutivity question implicitly by focusing on relevance)*
                  *   *(Collapsed: The "No" branch on Twin Computation + Representational "Yes" + Cognition "Yes" leads uniquely to Classical, rejecting constitutivity)*
          *   **3a. Alternative Path (Post-Causal Structure): Is implementation graded?**
              *   **Yes:** **Connectionist Computationalism (Graded Relevance):** Computations are implemented by distributed patterns of activity in neural networks, with varying degrees of fit; cognitive explanation selects the relevant level/grain.
              *   **No:** *(Proceed through Twin Computation as above)*
  *   **1a. Alternative Starting Path: Is the brain fundamentally a dynamical system, not a computer?**
      *   **Yes:** **Dynamical Systems Anti-Computationalism:** Cognition is best understood as continuous, embodied interaction with the environment, not discrete state transitions; computational descriptions are inadequate or derivative.
      *   **No:** *(Proceed through Implementation Question 1)*
  *   **1b. Alternative Path: Is consciousness/mind intrinsically biological?**
      *   **Yes:** **Searle-style Biological Naturalism:** While the brain performs computations, consciousness and intentionality are biological phenomena not reducible to computational processes.

  **Unoccupied Cells & Diagnoses:**

  1.  **Causal Structure + Objective Computation + Non-Representational + Constitutive:** Incoherent. Constitutivity typically requires representational content to define the abstract organization.
  2.  **Causal Structure + Objective Computation + Representational + Cognition Non-Computational + Constitutive:** Unattractive/Unexplored. Hard to see how mind constitutively depends on abstract organization defined representationally but not computationally.
  3.  **No Causal Structure + Objective Computation:** Incoherent. Collapses into triviality without observer-relativity or contradicts the "No Causal Structure" premise.
  4.  **Twin "No" + Non-Representational:** Unattractive/Unexplored. Requiring unique counterfactual profiles without appealing to semantics lacks clear motivation.
  5.  **Graded Implementation + Anti-Computationalism:** Unattractive. Gradedness implies computation *is* happening, just to varying degrees.

  **Leaves with Overlap:**
  *   **Mechanistic Computationalism (Piccinini) & Connectionist Computationalism:** The tree struggles to definitively separate them. Both accept causal structure, objective computation, and focus on mechanistic relevance. Connectionism often implies gradedness/distributedness, but Piccinini's framework can encompass many connectionist models. The "Graded Implementation" leaf specifically captures the gradedness aspect central to many connectionist views.
