     Suppose the proportion of red balls is either 30% or 70% (each with 50% chance). But this requires a second-order distribution, which we haven't assumed.

  Alternatively, using the current setup: we have a bag of 100 balls, between 20 and 80 are red. They start with an interval [20,80]. Now, we draw one ball. If it's red, what is the new interval for the proportion? 

  The proportion in the bag is unknown. If we draw a red ball, then the number of red balls is at least 21 (since we drew one and there were at least 20), so the proportion is at least 21/100=0.21. Similarly, the upper bound: it could be 80. So the new interval is [21,80]. Similarly, if we draw a blue ball, the new interval is [20,79]. So the width is still 59, same as before (initially 60: from 20 to 80). But the bounds have shifted. The width has not increased.

  We need a case where the width increases.

  Consider an example with two urns, but we want to avoid the known/unknown urn thing. 

  Alternatively, we can use a different setup. Suppose we have two characteristics: color (red/blue) and a mark (marked/unmarked). But that might be complex.

  Another idea: use a small bag. Suppose we have a bag with 10 balls, and we know that the number of red balls is either 4 or 6. So initially, the proportion is either 0.4 or 0.6. Then the interval for the proportion of red is [0.4,0.6] (width 0.2). Now, we draw one ball. If we draw a red ball, what is the set of possible proportions? 
     - If the bag has 4 red, then the chance of drawing red is 4/10=0.4.
     - If the bag has 6 red, then the chance is 0.6.
     So after drawing a red ball, we are not sure which urn it is. But the proportion in the bag is still either 0.4 or 0.6. So the interval for the proportion in the bag doesn't change. But for the next draw, the probability of red is now either 3/9 or 5/9. So the next draw has a probability that is in [3/9,5/9] = [1/3,5/9] ≈ [0.333,0.555]. This is wider than the initial [0.4,0.6]? No, 0.333 to 0.555 is width about 0.222, while 0.4 to 0.6 is 0.2. So it is wider. And if we drew a blue ball initially, then the next draw would be either 4/9 or 6/9 = [4/9,6/9] = [0.444,0.666] (width 0.222). So in both cases, the interval for the next draw is wider.

  But this is for the next draw, not for the proportion in the bag. The proportion in the bag is still either 0.4 or 0.6. But the students might care about the next draw. 

  We can do this: initially, the proportion of red in the bag is in {0.4,0.6}. We then draw one ball and set it aside. Then we ask for an interval for the proportion of red in the remaining bag. 
     - If the first draw was red, then the remaining bag has either 3/9 or 5/9 red -> [3/9,5/9] = [0.333,0.555] (width 0.222)
     - If blue, then [4/9,6/9] = [0.444,0.666] (width 0.222)

  The initial width was 0.2, and now it's 0.222, so it widened.

  But we have to change the bag: we said we have a bag of 100 balls. We can do a small version: a bag of 10 balls, and the number of red is either 4 or 6. We don't tell them which. 

  **Procedure:**
  1. We have a helper prepare a bag with 10 balls, either 4 or 6 red (the helper chooses one of these two compositions).
  2. We tell the students: the bag has 10 balls, and the number of red balls is either 4 or 6. They don't know which.
  3. They first report an interval for the proportion of red in the bag: [0.4,0.6] (width 0.2).
  4. We draw one ball at random and show it to them.
  5. They then report an interval for the proportion of red in the *remaining* 9 balls.
  6. We reveal the true composition at the end.

  After the draw, the width becomes about 0.222, which is wider. And it happens no matter what color is drawn.

  **Concern:** This uses a small bag and a known set of possibilities. But it avoids the known/unknown urn by not having a known urn. It's a form of ambiguity: we don't know which of two compositions it is.

  **Round 4 Procedure:**
  1. We have a new bag of 10 balls, prepared by a helper, who chooses to put either 4 or 6 red balls (the rest blue). The students know that.
  2. Students write on a card an interval (in [0,1]) for the proportion of red balls in the bag. (We expect [0.4,0.6].)
  3. We draw one ball at random and show its color.
  4. Students then write a new interval for the proportion of red balls in the *remaining* 9 balls.
  5. We collect and then later reveal the true composition.

  We can then show that the new intervals are wider.

  ### Overall Timeline (75 minutes)
  - Introduction (5 mins): Explain the bag of 100 balls (20-80 red), and that we'll do several activities. The true value is fixed and will be revealed at the end. They will earn points.
  - Round 1 (15 mins): Reporting bounds for the proportion of red in the 100-ball bag. They write [L,U] on a card. We collect. (We don't reveal true value yet.)
  - Round 2 (20 mins): Market for a bet on whether the proportion is above 50%. They submit a bid and an ask. We run the double auction and record trades. (We don't reveal true value.)
  - Round 3 (15 mins): Group decision between two options. They discuss and vote. We record the group's choice.
  - Round 4 (10 mins): Small bag (10 balls, 4 or 6 red). They report interval for the proportion in the full bag. Then we draw one ball and show it. They report interval for the remaining bag.
  - Reveal and debrief (10 mins): Reveal the true composition of the 100-ball bag and the 10-ball bag. Compute scores for all rounds. Then discuss and introduce the concepts.

  **Debrief:**
  - Map moments to distinctions:
     - Round 1: Tradeoff between width and accuracy. Some might have written wide intervals to be safe, others narrow and risked penalty.
     - Round 2: The bid-ask spread: 
          - Type (a) had wide spread -> didn't trade.
          - Type (b) had moderate spread -> might not trade.
          - Type (c) had narrow spread -> traded.
     - Round 3: The group had to choose one action. With an interval, they didn't know which bound to use. Some might have argued for the lower bound (pessimistic) and some for the upper (optimistic).
     - Round 4: After conditioning, the interval widened.

  **Predictably go wrong:**
  - In Round 1, many might write [50,50] because it's the midpoint. Then if the true value is not 50, they get a big penalty. Or they might write [20,80] to be safe.
  - In Round 2, students might not understand the double auction. We can simplify by not matching and just showing the spread, but then we don't have the cost of inaction. We might run out of time in the auction matching.
  - In Round 3, the group might quickly agree on a compromise (like 50) and not argue.
  - In Round 4, they might not see the widening because the change is small.

  **The part the activity can't deliver:** The normative part. The activity shows that intervals can lead to indecision (not trading in Round 2, difficulty in Round 3) and widening after evidence (Round 4). But is that a bug or a feature? We have to stand up and say: some theories say that imprecision is a natural response to ambiguity, and it's not irrational to have an interval. But it comes at a cost. The activity can't tell them what they should do; it only shows what happens.

  Let's write the detailed procedures for each round.
answer: |-
  Below is a designed activity for your seminar, structured to meet your goals within the constraints. The activity uses an opaque bag of 100 ping-pong balls (20–80 red, rest blue; composition fixed by a helper). No money is involved—students earn/lose "points" tracked via a leaderboard (projector). **Key features:**  
  - Avoids known/unknown urn tropes.  
  - Forces observable tradeoffs: intervals cost points, cause indecision, and create dilemmas.  
  - Debrief maps activities to distinctions without upfront jargon.  

  ---

  ### **Setup (5 mins)**  
  - **Materials:** Index cards, projector (leaderboard), bag of balls.  
  - **Instructions:**  
    - "This bag has 100 balls. Between 20 and 80 are red. A helper fixed the number—neither I nor you know it. We’ll do 4 short rounds. Points determine the leaderboard winner."  
    - "Rounds involve reporting beliefs or making choices. True composition revealed at the end."  
  - **No lecture:** Don’t define intervals, imprecision, or ambiguity.  

  ---

  ### **Round 1: Reporting Bounds (Width vs. Accuracy Tradeoff)**  
  **Goal:** Penalize overly narrow (risky) and overly wide (cautious) intervals. Force tradeoff visibility.  
  **Mechanics (10 mins):**  
  1. Each student writes a lower bound (L) and upper bound (U) (integers 0–100) on a card for the % of red balls.  
  2. **Scoring formula (projected):**  
     `Score = – [ (U – L) + 10 × distance ]`  
     - **Distance = 0** if true % ∈ [L, U].  
     - **Distance = min(|L – true|, |U – true|)** otherwise.  
     *Example: True=60. [50,70] → –20. [60,60] → 0 width + 0 distance = 0. [0,100] → –100. [30,40] → –10 + 10×20 = –210.*  
  3. Collect cards (don’t reveal true yet). Later, compute scores and update leaderboard.  

  **Why it works:**  
  - `10` is the penalty parameter—explicitly state: "I chose 10 to balance risk and caution. Change it, and behavior changes."  
  - Students see: Narrow intervals (e.g., [50,50]) risk huge penalties; wide (e.g., [20,80]) guarantee moderate losses.  
  - **Predictable issue:** Many write [50,50] (midpoint bias). Some write [20,80] (safe but costly). Sparks arguments: "Why not 30–70? Why 10×?"  

  ---

  ### **Round 2: Separating Belief Types (Bid-Ask Spread)**  
  **Goal:** Distinguish (a) "no idea," (b) "around 50% but unsure," (c) "sharp credence, rounded" via observable inaction.  
  **Mechanics (15 mins):**  
  1. **Bet definition:** "A ticket pays 100 points if >50% red, 0 otherwise. Write two prices:  
     - **Bid:** Max you’d pay to buy this ticket.  
     - **Ask:** Min you’d accept to sell this ticket."  
  2. Collect cards. Run a **double auction**:  
     - Sort bids high→low, asks low→high.  
     - Match highest bid ≥ lowest ask until no matches.  
     - **Trade price = midpoint** (e.g., bid=40 + ask=60 → trade at 50).  
     - *Traders:* Buyers pay price; sellers receive price.  
     - *Non-traders:* Do nothing.  
  3. Record trades (true outcome revealed later).  

  **How types separate:**  
  | Type              | Example bid-ask   | Observable behavior       |  
  |-------------------|-------------------|---------------------------|  
  | (a) "No idea"     | Bid=0, Ask=100    | **No trade** (spread too wide). |  
  | (b) "~50%, unsure"| Bid=40, Ask=60    | **No trade** (spread avoids loss). |  
  | (c) "Sharp, rounded" | Bid=55, Ask=55 | **Trades** (narrow spread). |  

  **Why it works:**  
  - Type (b) refuses trade—visible and costly (misses profit if bet succeeds).  
  - Type (c) transacts—exposed to risk.  
  - **Penalty for faking:** Type (a) writing [40,60] risks trading at a loss; type (c) writing [0,100] misses profit.  
  - **Predictable issue:** Some treat it as a puzzle (e.g., "Ask=100 ensures I profit")—exploit in debrief.  

  ---

  ### **Round 3: Forced Group Action (Interval Decision Dilemma)**  
  **Goal:** Force group to commit to one action; better option flips based on interval member chosen.  
  **Mechanics (15 mins):**  
  1. **Options (projected):**  
     - **Option A:** Wins 100 points if true % < 60.  
     - **Option B:** Wins 100 points if true % > 40.  
     *Note: If % ∈ (40,60), both win. Outside, only one wins.*  
  2. **Group debate/vote:** 5 mins to argue, then majority vote. Record choice.  
  3. *After reveal, award points if the chosen option wins.*  

  **Why it works:**  
  - With interval [50,70]:  
    - Use **lower bound (50)**: Prefer A (wins if %<60; 50<60 so safe).  
    - Use **upper bound (70)**: Prefer B (wins if %>40; 70>40 so safe).  
  - Students *must* confront: "Which bound do I trust?" and discover intervals don’t specify this.  
  - **Argument fuel:** Pessimists (lower bound) vs. optimists (upper bound).  
  - **Predictable issue:** Group defaults to "split the difference" (e.g., 50) or follows vocal student.  

  ---

  ### **Round 4: Conditioning Widens Intervals (The "Bug")**  
  **Goal:** Show conditioning on evidence can widen intervals, regardless of outcome.  
  **Mechanics (10 mins):**  
  1. **New bag (prepped by helper):** 10 balls, either 4 or 6 red (50/50 chance, unknown to all).  
  2. Students write an interval [L, U] for % red in this bag.  
  3. Draw one ball; show color.  
  4. Students write new interval for % red **in the remaining 9 balls**.  
  5. Collect cards. Later, reveal true composition and score (use Round 1’s formula).  

  **What happens:**  
  - **Initial interval:** [40,60] (width=20).  
  - **After red draw:** Remaining % = 3/9≈33% (if started with 4 red) or 5/9≈56% (if 6 red).  
    - New interval: [33,56] (width=23).  
  - **After blue draw:** Remaining % = 4/9≈44% (if started with 4 red) or 6/9≈67% (if 6 red).  
    - New interval: [44,67] (width=23).  
  - **Result:** Width **increases from 20→23** regardless of draw.  

  **Why it works:**  
  - Students see conditioning *increases* uncertainty (width) visibly.  
  - **No known/urn parallel:** Uses the same "ambiguous composition" logic but avoids classic urns.  

  ---

  ### **Reveal & Debrief (10 mins)**  
  **Reveal true compositions:** Compute all scores (Rounds 1–4), update leaderboard, crown winner.  

  **Map activities to distinctions (no jargon → concepts):**  
  | Activity          | Moment                          | Concept (now name it)               |  
  |-------------------|----------------------------------|-------------------------------------|  
  | Round 1           | "Why didn’t I pick [30,70]?"    | **Accuracy-width tradeoff**         |  
  | Round 2           | "I didn’t trade—was that dumb?" | **Refusal to act (imprecision)**    |  
  | Round 3           | "Do we use 50 or 70 here?"      | **Interval doesn’t specify action** |  
  | Round 4           | "Uncertainty grew after seeing?"| **Conditional widening (ambiguity)** |  

  **Predictable issues & fixes:**  
  - **Round 1 midpoint bias:** Many pick [50,50]. *Fix:* At reveal, show their massive penalty if true≠50.  
  - **"Puzzle" mindset:** Some try to game your intentions. *Fix:* In debrief, ask: "Did anyone assume I rigged it? How did that cost you?"  
  - **Groupthink in Round 3:** If no debate, say: "Did anyone want to pick differently? Why didn’t you?"  

  **Limitations & normative leap:**  
  - **What the activity can’t do:** It *shows* intervals cause indecision and costs but doesn’t say if this is rational. **You must normatively conclude:** "Imprecision avoids extreme losses but has costs: missed opportunities, indecision, and even growing uncertainty. Is that acceptable? Rational choice debates this."  
  - **Key insight for students:** Intervals aren’t "incomplete numbers"—they represent genuinely unresolved uncertainty.  

  ---

  ### **Timeline (75 mins)**  
  - Setup: 5 mins  
  - Round 1: 10 mins  
  - Round 2: 15 mins  
  - Round 3: 15 mins  
  - Round 4: 10 mins  
  - Reveal & Debrief: 10 mins  
  - Buffer: 10 mins (for transitions, arguments, or extensions)  

  This design forces students to *experience* the costs and dilemmas of imprecision, then unpack it retroactively. The leaderboard and penalties make abstract tradeoffs visceral.
