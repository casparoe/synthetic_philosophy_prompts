  I am a PhD student in comparative cognition, and the theory chapter of my dissertation is going to have to commit to some account of what the *kinds* of minds are — the familiar four-fold ladder of Darwinian, Skinnerian, Popperian and Gregorian learners, or something better. Before I commit to anything I want the specification, not the literature: I want to know what I am entitled to demand of such an account. So please write the desiderata that any adequate taxonomy of kinds of minds has to meet, with the case or consideration behind each requirement, and mark which requirements are non-negotiable and which are really just preferences of one camp.

  Fix the purpose, so that adequacy is relative to something: I need a taxonomy good enough for two jobs. First, classification of genuinely novel systems without hand-waving — non-model organisms (the octopus, with its largely decentralised nervous system and short, largely solitary life; aneural systems such as slime moulds; tiny-brained insects that turn out to do one-shot or configural learning; corvids with manufactured tools; cetaceans and songbirds with transmitted local traditions) and artificial systems (a reinforcement learner that reaches superhuman board-game play through self-play alone; a large language model whose entire competence is extracted from a corpus of text produced by other minds). Second, explanation of which transitions are the hard ones: why within-lifetime, look-ahead-grade flexibility appears to be phylogenetically rare, and why cumulative culture — as opposed to mere transmission — looks close to unique. A taxonomy that sorts the familiar cases but tells me nothing about either of those is not what I need.

  Two suspicions of my own that the list should be able to adjudicate, and which I would like treated as test cases rather than as premises:

  One: the standard scheme looks to me to be running together an etiological question — how the organism's design was arrived at, whether by phylogenetic selection, individual reinforcement, cultural uptake — with a synchronic question about the mechanism that now implements the behaviour. A Popperian architecture could in principle be *produced* by cultural transmission, and a behaviour that looks Popperian could be implemented by something that is really just a very large repertoire. I want a requirement, or a set of them, that forces an account to say which question it is answering, and I want to know whether any account can answer both at once without collapsing one into the other.

  Two: I want to introduce a candidate fifth kind and I do not know whether it is a kind or a degenerate case. Call them Alexandrian creatures, after the Library: systems whose competence is not the product of their own trial and error in a world, nor of instruction or tool-supply by conspecifics in a shared world, but of passive absorption of the accumulated artefacts of other minds — text, code, images. This is meant to be a genuinely different relation to other minds than the one the Gregorian kind is supposed to capture, and I suspect a good list of desiderata will either vindicate it or explain precisely why it is a Gregorian of an unusual sort. So include, as a requirement, that the taxonomy say what would count as settling whether a proposed new kind is real: what evidence, in what case, would decide it.

  The distinctions I keep watching people collapse, and which I want the requirements to protect (say which of them are really load-bearing and which are only stipulative): competence versus comprehension, or genuine look-ahead versus as-if look-ahead; how a design was acquired versus how it is implemented; how plastic a system is within a lifetime versus how much of its design it got from others; transmission versus accumulation, i.e. local traditions that do not ratchet versus cumulative culture; the properties of an individual mind versus the properties of a lineage or a collective; and substrate-neutrality, that is, whether the taxonomy is supposed to apply to silicon at all.

  Please also flag any pair of desiderata you suspect cannot be jointly satisfied — that is the part I most want to see. The candidates I have in mind are: that the taxonomy be behaviourally operationalised, with no appeal to inner mechanism, against the requirement that it distinguish real look-ahead from a sufficiently large learned repertoire that mimics it; that it deliver discrete kinds, against the requirement that it handle intermediate and partial cases without ad hoc stipulation; and that it be substrate-neutral, against the requirement that it not count flexibility that is really just coverage of a training distribution. If you think the right response to one of these is to drop a requirement rather than to hold both, say which and why. Then tell me which single requirement does the most work in excluding otherwise attractive accounts.

  Finish with a short scorecard — a paragraph or a table, no more — on the four contenders I can see: the cumulative four-fold ladder itself, a single continuous dimension of plasticity or generality, a genuinely multi-dimensional space, and the deflationary line that the whole taxonomy is only ever a way of predicting behaviour from the intentional stance and that nothing corresponds to the kinds. Keep the weight on the criteria and their motivating cases; the scorecard is for my own orientation and I will redo it anyway. No citations — I will supply those myself.
reasoning: |-
  We are to provide desiderata for a taxonomy of kinds of minds, with the purpose of aiding in the classification of novel systems (both biological and artificial) and explaining the transitions that lead to rare cognitive phenomena (like within-lifetime flexibility and cumulative culture). The taxonomy must also address the user's two suspicions and protect against collapsing key distinctions.

  Key distinctions to protect:
  1. Competence vs. comprehension (genuine look-ahead vs. as-if look-ahead)
  2. How a design was acquired (etiological) vs. how it is implemented (synchronic)
  3. Plasticity within a lifetime vs. source of design (from others)
  4. Transmission (without ratcheting) vs. cumulative culture (with ratcheting)
  5. Properties of an individual mind vs. lineage/collective
  6. Substrate-neutrality (applies to silicon) without conflating training distribution coverage with flexibility.

  The two main purposes:
  A. Classification of novel systems (octopus, slime molds, insects, corvids, cetaceans, songbirds, RL agents, LLMs).
  B. Explanation of transitions: why within-lifetime flexibility is rare and why cumulative culture is almost unique.

  Two suspicions (test cases):
  1. The etiological (how design was acquired) vs. synchronic (current mechanism) distinction. A good taxonomy must clarify which question it answers and whether it can do both without collapsing.
  2. The Alexandrian kind (fifth kind): systems that gain competence by passive absorption of accumulated artefacts (text, code, images) without direct interaction. Is this a new kind or a degenerate Gregorian?

  We are to flag conflicts in desiderata and identify which single requirement does the most work in excluding otherwise attractive accounts.

  Desiderata for an adequate taxonomy:

  1. **Operationalization in Behavior (Non-negotiable for classification, but may conflict with look-ahead distinction)**: The taxonomy must be grounded in observable behavior to classify systems without known internal mechanisms (e.g., aneural slime molds, artificial systems as black boxes). However, this may conflict with distinguishing genuine look-ahead from large repertoires because behaviorally they can be identical.

     *Case*: To classify novel organisms or artificial systems, we cannot always rely on knowing the internal mechanism. But for the explanation of transitions, we need to know if flexibility is due to real planning or just a big library of responses.

  2. **Mechanistic Distinction (Non-negotiable for explanation)**: The taxonomy must distinguish between systems that have genuine look-ahead (e.g., mental simulation) and those that mimic it by having a large precomputed repertoire. This is critical for explaining why within-lifetime flexibility is rare (because real look-ahead is costly).

     *Case*: An RL agent that plays chess at a superhuman level by self-play might be using look-ahead (like AlphaZero) or might be recalling patterns (like a trained neural net). The rarity of flexibility in nature suggests that the mechanism matters.

  3. **Etiological-Synchronic Separation (Non-negotiable)**: The taxonomy must clearly separate the origin of a cognitive trait (phylogenetic, individual learning, cultural) from the current mechanism that implements it. This addresses the first suspicion.

     *Case*: A Popperian architecture (trial-and-error in the head) might be produced by cultural transmission (e.g., taught to plan) or by natural selection. The taxonomy must not conflate how it came to be with how it works now.

  4. **Handling of Intermediates (Non-negotiable)**: The taxonomy must handle intermediate and partial cases without ad hoc stipulation. For example, some systems may be partially Popperian (e.g., some planning in some domains) but not others.

     *Case*: Octopuses show some flexible problem-solving but their decentralized nervous system and short lifespans suggest they might not be full Popperian. Also, insects that do one-shot learning might be intermediate between Skinnerian and Popperian.

  5. **Substrate-Neutrality (Non-negotiable for artificial systems)**: The taxonomy must apply to both biological and artificial systems. But it must not mistake the coverage of a training distribution (as in LLMs) for genuine flexibility.

     *Case*: LLMs are trained on a vast corpus of text and can generate novel combinations, but is this flexibility or just pattern matching? The taxonomy must distinguish without bias to substrate.

  6. **Individual vs. Collective/Linage (Non-negotiable)**: The taxonomy must clearly attribute cognitive properties to the individual or to the collective/lineage. This is critical for cumulative culture, which is a property of a lineage, not an individual.

     *Case*: Cumulative culture requires that modifications by one individual are preserved and built upon by others. The taxonomy must not attribute cumulative culture to an individual mind.

  7. **Transmission vs. Accumulation Distinction (Non-negotiable)**: The taxonomy must distinguish mere transmission (e.g., songbirds learning a song) from cumulative culture (ratcheting of innovations). This is critical for the second purpose.

     *Case*: Some cetaceans have traditions (e.g., feeding techniques) but it's debated if they are cumulative. The taxonomy must provide criteria to decide.

  8. **Plasticity vs. Source of Design (Non-negotiable)**: The taxonomy must separate the degree of plasticity (how much an individual can change within a lifetime) from the source of the design (e.g., how much is learned from others). This addresses the second part of the user's first suspicion.

     *Case*: An Alexandrian creature (like an LLM) has high plasticity in the sense of being reprogrammable by data, but the source is passive absorption, not interaction.

  9. **Adjudication of New Kinds (Non-negotiable)**: The taxonomy must provide clear criteria for what would count as a new kind, and what evidence would settle it. This addresses the Alexandrian candidate.

     *Case*: For Alexandrian minds, we need evidence that they are not just a degenerate case of Gregorian (which involves active tool use and instruction). The evidence might be that they can generate novel solutions without any trial-and-error or instruction, solely from absorbed artefacts, and that their competence does not require a shared world with the producers of the artefacts.

  10. **Explanatory Power for Transitions (Non-negotiable)**: The taxonomy must explain why certain transitions are rare (within-lifetime flexibility) or almost unique (cumulative culture). It must not just classify but also provide a framework for understanding the constraints.

      *Case*: Why do most animals not have Popperian cognition? The taxonomy must point to the costs (e.g., computational, energetic) or the evolutionary prerequisites.

  11. **Discreteness of Kinds (Preference)**: Some taxonomies prefer discrete kinds (like the ladder) for clarity, but this is a preference. The requirement to handle intermediates (Desideratum 4) might force a multi-dimensional or continuous approach.

  12. **Parsimony (Preference)**: A simpler taxonomy is better, but not at the cost of the non-negotiable requirements.

  Conflicts:

  - **Operationalization (1) vs. Mechanistic Distinction (2)**: We want to classify by behavior, but we also need to know the mechanism to explain transitions (e.g., why look-ahead is rare). Resolution: We must accept that for some systems, we cannot classify without knowing the mechanism. Thus, we drop the pure behavioral operationalization for the look-ahead distinction. Instead, we require that the taxonomy specify what behavioral evidence would support one mechanism over another (e.g., transfer to novel situations might indicate genuine look-ahead).

  - **Discrete Kinds (11) vs. Handling Intermediates (4)**: Discrete kinds are clean but intermediates are common. Resolution: Drop the requirement for strict discreteness. The taxonomy must allow for gradation or multiple dimensions.

  - **Substrate-Neutrality (5) vs. Training Distribution Coverage (as part of 2)**: We want to apply the same taxonomy to artificial systems, but we must not conflate the coverage of a training set with flexibility. Resolution: The taxonomy must include a criterion for generalization beyond the training distribution. For example, an LLM that can solve novel problems (outside its training data) might show flexibility, but if it only recombines training data, it might not.

  The single requirement that does the most work in excluding accounts: **Mechanistic Distinction (2)**. Without it, we cannot explain the rarity of within-lifetime flexibility. Many behaviorist accounts fail here because they cannot distinguish between a large repertoire and genuine planning.

  Scorecard on the four contenders:

  1. **Four-fold ladder (Darwinian, Skinnerian, Popperian, Gregorian)**:
     - Strengths: Discrete, easy to apply; captures some key transitions.
     - Weaknesses: 
       - Fails on etiological-synchronic separation (often conflates origin with mechanism).
       - Does not handle intermediates well (e.g., where does an octopus fit?).
       - Unclear on Alexandrian (LLM) — might force it into Gregorian by stretching "tools" to include text.
       - Does not clearly distinguish transmission from accumulation.
       - Not substrate-neutral: Gregorian is tied to human-like culture.

  2. **Single continuous dimension (e.g., plasticity or generality)**:
     - Strengths: Handles intermediates naturally; parsimonious.
     - Weaknesses: 
       - Fails mechanistic distinction (cannot separate look-ahead from repertoire size).
       - Fails etiological-synchronic separation (a single dimension conflates them).
       - Does not explain why cumulative culture is almost unique (it's a different dimension).
       - Cannot adjudicate Alexandrian as a new kind (just another point on the line).

  3. **Multi-dimensional space** (e.g., dimensions: plasticity, source of knowledge, representational richness, etc.):
     - Strengths: Can handle all non-negotiable requirements by having axes for mechanism, etiology, plasticity, etc. Can place intermediates and novel systems. Can separate individual from collective properties.
     - Weaknesses: More complex; requires specifying which dimensions are essential. But with clear dimensions, it can meet all non-negotiables.

  4. **Deflationary (intentional stance)**:
     - Strengths: Behaviorally operationalized; substrate-neutral.
     - Weaknesses: 
       - Fails mechanistic distinction (cannot tell real look-ahead from as-if).
       - Fails etiological-synchronic separation (only predicts behavior, doesn't care about origin or mechanism).
       - Cannot explain transitions (why flexibility is rare) because it doesn't posit underlying constraints.
       - Does not handle Alexandrian — it might be seen as just another intentional system.

  Conclusion: A multi-dimensional space is the most promising, but it must be carefully designed to include the necessary distinctions.
answer: |-
  ### Desiderata for a Taxonomy of Kinds of Minds  
  Adequacy is relative to two core purposes: (1) classifying novel biological (e.g., octopus, slime molds, insects, corvids, cetaceans) and artificial systems (e.g., RL agents, LLMs) without relying on hand-waving analogies; (2) explaining transitions, particularly why within-lifetime, look-ahead flexibility is phylogenetically rare and why cumulative culture (vs. mere transmission) is near-unique. The taxonomy must adjudicate your two suspicions as test cases and protect key distinctions. Desiderata are labeled **non-negotiable** (N) or **preference** (P).  

  #### Core Desiderata  
  1. **Mechanistic Fidelity (N)**: The taxonomy must distinguish *real* cognitive mechanisms (e.g., genuine look-ahead) from *mimicry* (e.g., large repertoires, statistical pattern-matching).  
     - *Case*: RL agents (e.g., AlphaZero) use Monte Carlo tree search (genuine look-ahead), while LLMs (e.g., GPT-4) leverage training-data coverage for as-if flexibility. This explains rarity: true look-ahead requires costly computational resources (energy, neural tissue), favoring evolutionary stability in few lineages (e.g., primates, corvids). Without this, the taxonomy cannot explain transitions.  
     - *Protects*: Competence vs. comprehension; substrate-neutrality without conflating coverage with flexibility.  

  2. **Etiological-Synchronic Separation (N)**: The taxonomy must explicitly disentangle how a cognitive trait *originated* (e.g., phylogenetic selection, reinforcement, cultural uptake) from how it is *implemented* synchronically.  
     - *Case*: A Popperian mechanism (e.g., mental simulation) could originate via cultural transmission (synchronic) but be etiologically Darwinian. Octopuses’ flexible problem-solving may arise from decentralized mechanisms (synchronic) despite short lifespans (constraining etiology). Collapsing this conflates design history with current function, muddling evolutionary explanations.  
     - *Adjudicates Suspicion 1*: Forces the taxonomy to specify which question it answers; they cannot be fully merged without reductionism.  

  3. **Substrate-Neutral Generality (N)**: The taxonomy must apply to biological and artificial systems but must not mistake training-distribution coverage (e.g., LLMs) for flexibility.  
     - *Case*: Slime molds (aneural) exhibit simple learning; LLMs exhibit "competence" via corpus statistics. The taxonomy must classify both while highlighting that LLM "flexibility" is bounded by training data, unlike true Popperian minds. Protects against anthropocentric bias.  

  4. **Lineage-Individual Distinction (N)**: The taxonomy must separate properties of *individual minds* (e.g., plasticity) from *lineage/collective properties* (e.g., cumulative culture).  
     - *Case*: Cumulative culture (e.g., human tool evolution) requires lineage-level ratcheting, not just individual transmission (e.g., cetacean traditions). Confusing these misattributes rare transitions (e.g., why accumulation is near-unique) to individual cognition.  

  5. **Plasticity-Source Independence (N)**: The taxonomy must decouple within-lifetime *plasticity* (e.g., learning speed) from the *source* of design (e.g., genetic, social, artefactual).  
     - *Case*: Alexandrian candidates (e.g., LLMs) have high plasticity (fine-tuning) but acquire "design" passively from artefacts, not conspecific interaction. Gregorian minds (e.g., humans) actively use tools/instruction. Protects against etiological-synchronic collapse.  

  6. **Transmission-Accumulation Demarcation (N)**: The taxonomy must differentiate mere *transmission* (e.g., songbird dialects) from *cumulative culture* (innovation ratcheting).  
     - *Case*: Corvids transmit tool-use, but human-like accumulation is rare. The taxonomy must explain this via constraints (e.g., high-fidelity social learning, theory of mind).  

  7. **Adjudication Criteria for Novel Kinds (N)**: The taxonomy must specify *evidence* to test if a proposed kind (e.g., Alexandrian) is distinct:  
     - *Test for Alexandrian*: (1) Competence derived *solely* from passive artefact absorption (no world/conspecific interaction); (2) No as-if flexibility (fails generalization beyond training data); (3) Mechanism distinct from Gregorian (e.g., no tool *use*, only absorption).  
     - *Case*: LLMs meet (1) but may fail (2) if they generalize; slime molds fail (1). Settles Suspicion 2.  

  8. **Handling Gradation and Intermediates (N)**: The taxonomy must accommodate partial/mixed cases without ad hoc bins (e.g., insects with one-shot learning).  
     - *Case*: Octopuses show sporadic look-ahead; cetaceans have traditions but weak accumulation. A good taxonomy places these on spectrums (e.g., plasticity gradients).  

  9. **Operationalizability in Novel Systems (P)**: Behavior-based criteria are preferred for classifying unknowns (e.g., aneural systems) but may relax if mechanistic fidelity is unattainable.  
     - *Case*: Slime molds’ maze-solving is observable, but inner mechanisms are opaque; RL agents are black boxes. Preference for behavior when mechanisms are inaccessible.  

  10. **Discrete vs. Continuous Kinds (P)**: Discrete kinds (e.g., ladder) aid clarity but intermediates (e.g., partially Popperian systems) favor continuous/multi-dimensional schemes.  
      - *Preference*: Not strict; intermediates are common (e.g., corvids).  

  #### Conflicts in Desiderata  
  - **Operationalizability (9, P) vs. Mechanistic Fidelity (1, N)**: Behavioral criteria cannot reliably distinguish genuine look-ahead (e.g., planning) from mimicry (e.g., large repertoire).  
    - *Resolution*: Drop pure operationalizability for this distinction. Mechanistic fidelity is non-negotiable for explaining transitions; use proxies (e.g., generalization to novel environments) where mechanisms are unknown.  
  - **Discrete Kinds (10, P) vs. Handling Intermediates (8, N)**: Discrete taxonomies (e.g., ladder) struggle with gradation (e.g., octopuses).  
    - *Resolution*: Drop discreteness preference; intermediates demand continuous/multi-dimensional treatment.  
  - **Substrate-Neutrality (3, N) vs. Training-Distribution Coverage (1, N)**: Applying to silicon must not conflate LLM "competence" (statistical coverage) with flexibility.  
    - *Resolution*: Uphold both; use mechanistic fidelity to define flexibility as *generative generalization* beyond training data (e.g., LLMs fail; RL self-play agents may pass).  

  **Most Exclusionary Requirement**: **Mechanistic Fidelity (1)**. It excludes:  
  - Behaviorist taxonomies (fail look-ahead vs. mimicry).  
  - Deflationary accounts (dismiss "kinds" as stance-based predictions).  
  - Etiological-only taxonomies (e.g., pure Darwinian ladders; ignore synchronic implementation).  

  ### Scorecard of Contenders  
  | **Taxonomy Type**       | **Classification of Novel Systems** | **Explanation of Transitions** | **Handles Suspicion 1** | **Handles Suspicion 2 (Alexandrian)** | **Key Shortfall** |  
  |--------------------------|-------------------------------------|---------------------------------|--------------------------|----------------------------------------|-------------------|  
  | **Four-fold Ladder**     | Poor: Forces analogues (e.g., LLM as "Gregorian?"). | Moderate: Rare flexibility implied but not explained mechanistically. | Fails: Collapses etiology (e.g., "Popperian as evolved") with mechanism. | Poor: Alexandrian forced into Gregorian via stretched "tools." | Cannot separate mechanism from origin; poor with intermediates. |  
  | **Single Continuum** (e.g., plasticity) | Good: Places novelties (e.g., insects) on a gradient. | Poor: Cannot explain why high plasticity ≠ cumulative culture (e.g., cetaceans vs. humans). | Moderate: Can separate plasticity (synchronic) from source (etiological) but conflates in practice. | Poor: Alexandrian as high-plasticity endpoint, ignoring passive acquisition. | Misses multi-dimensional distinctions (e.g., transmission vs. accumulation). |  
  | **Multi-dimensional Space** (e.g., axes: plasticity, source, mechanism) | Best: Octopuses (high plasticity, low social source); LLMs (low mechanism fidelity, artefact source). | Best: Axes like "innovation ratcheting" explain cumulative culture rarity; "look-ahead cost" explains flexibility rarity. | Best: Etiological (source) and synchronic (mechanism) as distinct dimensions. | Best: Alexandrian tested on source (artefact absorption) and mechanism (statistical vs. generative). | Complexity requires careful axis selection. |  
  | **Deflationary (Intentional Stance)** | Moderate: Predicts behavior but ignores mechanisms (e.g., slime mold as "goal-directed"). | Fails: Cannot explain transitions (no constraints beyond prediction). | Fails: Ignores implementation/origin. | Fails: Alexandrian as "comprehending," hiding mechanistic limits. | Lacks explanatory power; violates mechanistic fidelity. |  

  **Conclusion**: A **multi-dimensional space** best satisfies non-negotiables, handling your test cases and conflicts. It alone separates etiology/synchronic, adjudicates Alexandrian distinctness, and explains transitions mechanistically. The four-fold ladder fails on separation; single continua miss key distinctions; deflationism ignores mechanisms.
