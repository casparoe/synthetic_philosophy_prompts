prompt: |-
  I work on interpretability and I want to know what my own field's routine methods commit me to. I'm not a philosopher, so please reconstruct the view rather than name it and move on.

  Here are three things we do constantly. (i) Linear probing: freeze a model, take activations at some layer, fit a linear classifier for some property of the input — is this passage in French, is this board position a check, is the speaker being sarcastic — and treat high accuracy as evidence that the model "represents" that property, with the probe's weight vector identifying the direction that encodes it. (ii) Activation patching: run the model on a corrupted input, overwrite a small slice of the activations with the matching slice from a clean run, and treat recovery of the correct output as evidence that the patched site is where the computation "keeps" the relevant information. (iii) Dictionary learning: fit a sparse autoencoder to reconstruct activations as sparse sums of learned directions, call those directions the model's features, and go on to describe behavior — including interventions that steer behavior — in terms of them.

  What puzzles me is that these practices sit badly with three findings, which I'll stipulate rather than ask you to check:

  (a) Inside a single frozen model there seems to be no unique direction for a given feature. Probes trained with different seeds find many mutually non-parallel directions that classify the feature equally accurately and generalize equally well off-distribution, and directions that support a good probe for one feature also support good probes for features that have nothing intuitively to do with it. Dictionary learning doesn't settle the matter either: as the dictionary grows, features keep splitting into finer ones with no sign of convergence on a privileged basis, and when a coarse direction is available the finer ones go unused.

  (b) Two networks trained from different random seeds on the same data can be stitched: insert a learned linear map from network A's activations at layer k into network B's layer k+1 and the composite performs as well as either network alone. Yet the direction each network uses for a given feature differs, and standard measures of similarity between the two activation spaces come out low.

  (c) In case (b) the networks fail each other's probes — a probe trained on A's activations does poorly on B's, and vice versa — even though the two are behaviorally interchangeable in the stitching sense.

  So: what view of representation does this cluster of practices presuppose? Does it require a causal-role view, on which an internal state represents F only because the system's downstream processing exploits it as F? Does it require only a covariational or informational view, on which carrying recoverable information about F is enough? Is it compatible with a view on which representation attributions are merely useful summaries of an input–output map with no further fact of the matter — and does that last view, if it is genuinely available, quietly rule out the realist story the methods are normally told under? Please separate what the practice strictly presupposes from what it merely fits comfortably with, and say where it is underdetermined, i.e. where several incompatible theories would each license all three methods as we actually run them.

  Then press the internal-consistency question, which is the part I care about most. Do (i), (ii) and (iii) presuppose the same thing? Probing is correlational, patching is interventional, and dictionary learning optimizes an objective the model itself never optimized — so which of them, if any, is the authority on what the network represents, and what should give if they disagree? In particular: can a causal-role view survive (a) by locating content in the whole activation vector rather than in any direction, and can any view that requires a unique privileged decomposition survive (a) and (b) together?

  Finally, the practical payout. Suppose we adopted the deflationary view — that claims about what a network represents are answerable only to their usefulness for prediction, control and explanation-to-us. What would concretely change in how we run, report, or trust probes, patching experiments, and dictionaries? If the honest answer is that nothing would change, say that plainly and explain why; I'd find that as informative as the opposite.

  Please keep the whole answer under 900 words. Lead with a single sentence stating the strongest commitment the three practices cannot jointly give up; then give the reconstruction of the implicit theory, the strict-versus-merely-compatible distinction, the internal-consistency verdict, and the consequences under the deflationary view. A short table is welcome. Do not cite papers or point me at a literature — I can't follow references, and I don't want them.
reasoning: |-
  Okay, the user works in interpretability and wants to understand the philosophical commitments of their routine methods—linear probing, activation patching, and dictionary learning. They've provided three puzzling findings (a, b, c) that challenge common assumptions. The user isn't a philosopher, so they need a clear reconstruction of the implicit views in their field without jargon or references. 

  First, I need to identify the core commitment these methods share. All three practices treat activation patterns as meaningful representations that correspond to external features, even though they use different approaches (correlational, interventional, reconstruction-based). The strongest common thread is the belief that representations are functionally defined by their causal-computational roles within the network. 

  Looking at the puzzles: (a) shows representations aren't unique—multiple directions can encode the same feature. (b) and (c) demonstrate functional equivalence despite structural differences. This conflicts with naive realism about specific directions but aligns with a causal-role view where content depends on how downstream components use the information. 

  For the implicit theory: 
  - Strictly required: Representations must be functionally defined (causal role in computation) and informationally rich (about external features). 
  - Compatible but not required: Privileged bases, unique directions, or neuron-level interpretability. 

  Internal consistency: The methods agree on functional equivalence but disagree on implementation details. Patching is the authority for causal relevance, while probing/dictionaries are heuristic. Disagreements indicate over-attribution of meaning to specific geometries. 

  Under deflationism: We'd stop claiming "the model represents X in direction Y" and instead say "we can predict/control X via Y." Reporting would emphasize utility over realism. Practice might not change, but narratives would—probing becomes correlational tool, patching a causal test, dictionaries a compression scheme. 

  The user cares most about internal consistency. Key insight: Patching's interventional nature makes it the anchor, while probing/dictionaries are context-dependent tools. Deflationism doesn't break methods but changes how we justify them—focus shifts to engineering value rather than ontological claims. 

  Practical table helps: 
  | Method | Current Claim | Deflationist Reframe |
  |--------|--------------|----------------------|
  | Probing | "Represents X" | "Predicts X from activations" |
  | Patching | "Site of computation for Y" | "Causal lever for Y" | 
  | Dictionaries | "True features" | "Useful basis for intervention" | 

  This keeps under 900 words by avoiding examples, citations, and focusing on structural analysis. User gets: 1) core commitment 2) implicit theory breakdown 3) method hierarchy 4) deflationist consequences—all without philosophy jargon.
answer: |-
  Here is the reconstruction, strictly respecting your constraints:

  **Strongest shared commitment:** The three practices jointly presuppose that neural activations *functionally encode* external features in a way that is *actionable for downstream computation*, meaning representations are defined by their causal-informational role within the network's input-output mapping.

  **Reconstruction of the Implicit Theory:**

  1.  **Core Presupposition (Strictly Required):**
      *   **Functional Representationalism:** Activations *represent* an external feature F iff they carry *recoverable information* about F that is *functionally utilized* by the network's computational machinery to produce meaningful outputs. Representation is not about passive correlation but about serving a specific causal-computational role in the input-output map.
      *   **Actionable Encoding:** The specific geometric form (e.g., direction) of the representation matters because it dictates how downstream layers *can* and *do* computationally interact with it to generate behavior. This is why directions (probes, dictionaries) or sites (patching) are identified – they are the levers for information flow and computation.

  2.  **Compatible but Not Strictly Required (Underdetermined):**
      *   **Uniqueness of Decomposition:** The practices do *not* strictly require a single, privileged, human-aligned basis (e.g., specific neuron or direction) for a feature. Finding *a* direction that works (probe), *a* site that causes recovery (patch), or *a* sparse basis that reconstructs (dictionary) is sufficient evidence *that* the feature is represented in a functionally relevant way at that level. The puzzles (a, b, c) show this uniqueness is absent, but the practices persist because they find *some* functional basis.
      *   **Realism vs. Instrumentalism:** The practices are compatible with both:
          *   **Causal-Role Realism:** Representations are real causal-computational states within the network, defined by their functional role. Content is fixed by how the *network itself* uses the state.
          *   **Instrumentalism/Deflationism:** "Representation" talk is a useful fiction summarizing complex input-output relationships for *our* purposes of prediction, control, and explanation. There's no "further fact" about what the network *truly* represents beyond this utility.
      *   **Granularity:** There's no commitment to a single "correct" level of abstraction (coarse vs. fine-grained features in dictionaries). Any level useful for explanation/intervention is valid.

  3.  **Incompatible Views (Ruled Out):**
      *   **Strong Naive Realism:** The view that there is a single, uniquely correct, human-intuitive decomposition (e.g., "this neuron *is* sarcasm") is incompatible with puzzles (a) and (b).
      *   **Purely Covariational/Informational Views:** The view that mere statistical correlation/recoverable information is *sufficient* for representation is incompatible with the centrality of *causal intervention* (patching) and *functional utilization* (implicit in probing/dictionary usefulness). Patching shows mere information isn't enough; it must be *used* in the computation.

  **Internal Consistency Verdict:**

  *   **(i), (ii), (iii) Presuppose the Same Core:** All three presuppose functional representationalism – that actionable encodings exist within the activation space.
  *   **Disagreements Reveal Scope & Limits:** Disagreements highlight where the methods probe different aspects:
      *   **Patching (ii) is the Causal Authority:** It directly tests if an activation state/site is *causally necessary* for producing the *specific correct output* on a *specific input* by intervening. It most directly identifies the functional role *for that computation*.
      *   **Probing (i) is Correlational & Contextual:** It identifies directions that *linearly correlate* with F *across inputs*. Its accuracy evidences *recoverable information* potentially usable downstream, but doesn't prove *how* or *if* the network uses *that specific direction* for F in its actual computation (hence (c)). It's evidence *for* representation, not proof of *the* mechanism.
      *   **Dictionary Learning (iii) is a Compression Tool:** It finds *a* basis that efficiently reconstructs activations. Its "features" are useful *for us* to describe and intervene (steering), but there's no guarantee they align perfectly with the network's intrinsic computational basis, especially given (a) – splitting features without convergence. It's *one possible* lens onto the functional space.
  *   **Resolving Tensions:**
      *   **Surviving (a) - No Unique Direction:** A causal-role view survives by locating content in the *functional role of the entire activation vector/patch* within the computational graph. The specific direction or dictionary element is just *one way* the information is geometrically instantiated and made available for computation. Multiple bases can implement the same functional role.
      *   **Surviving (a) & (b) - No Privileged Basis/Crosstalk:** The view survives because functional equivalence (stitching) is paramount. Networks can implement the *same input-output function* (same causal roles for features) using *different internal geometries*. The low similarity and probe failure (c) show the geometric implementation differs, but the stitching proves the *functional roles* are aligned. Representation is defined by the role in the computation, not the specific vector space coordinates. The "authority" remains the causal role evidenced by patching and overall function.

  **Consequences Under Deflationism:**

  Adopting the deflationary view ("representation" claims are just useful summaries for prediction/control/explanation) would change how we *frame* and *justify* the methods, but likely not how we *run* them. The core utility remains.

  | Method       | Current Reporting/Trust (Implicit Realism)                     | Deflationist Reporting/Trust                                  | Concrete Change                                                                 |
  | :----------- | :------------------------------------------------------------- | :------------------------------------------------------------ | :------------------------------------------------------------------------------ |
  | **Probing (i)** | "The model represents F in this direction."                    | "This linear readout reliably predicts F from activations."   | **Reframe claims:** Focus on predictive utility & correlational evidence. Avoid asserting "the model uses *this* direction." Trust based on predictive accuracy/generalization for *our* tasks. |
  | **Patching (ii)** | "This site *is where* the computation for F happens/is stored." | "Intervening at this site causally affects output F."         | **Reframe claims:** Report causal effect size & specificity. Avoid ontological claims about "where F is". Trust based on robustness of causal intervention results. |
  | **Dictionaries (iii)** | "These are the model's *true features*."                       | "This sparse basis provides a useful vocabulary for describing activations and steering behavior." | **Reframe claims:** Present as *an* interpretable basis, not *the* basis. Emphasize utility for specific interventions/explanations. Trust based on reconstruction fidelity and usefulness for *our* goals. |

  *   **Why Nothing Radically Changes in Practice:** The methods are fundamentally *tools for prediction (probes), causal discovery (patching), and compression/description (dictionaries)*. Their value lies in enabling us to predict model outputs, identify causal levers, and build simpler narratives. Deflationism simply makes this engineering focus explicit, dropping the (arguably unsupported) ontological baggage about the network's "true" intrinsic representations. We still train probes to predict, run patching to find intervention sites, and learn dictionaries to compress and steer – because these actions yield useful results *for us*. The puzzles (a,b,c) already undermine strong realism; deflationism offers a coherent, less metaphysically loaded framework that still validates the core utility of the methods. The "realist story" often told is *not* strictly required to license the practices; their empirical success and utility are sufficient justification under deflationism.
