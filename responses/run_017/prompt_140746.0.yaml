  Hmm, the draft presents an interesting argument challenging strict Kantian views on moral worth. The user distinguishes between "tracking" (counterfactual responsiveness to right-making features) and "citing" (conscious deliberation), proposing "cached worth" through dispositions like the nurse example. Then they extend this to "Designed Worth" where worth is achieved indirectly through environmental design. Three objections follow: episodic-credit, mesh, and dilution. The user admits uncertainty about whether they've just repackaged reasons-responsive views.

