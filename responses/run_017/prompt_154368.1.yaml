prompt: |-
  I write novels — close third, past tense, the usual — and I've been reading Smith's Theory of Moral Sentiments in a rented cabin with one battered paperback and no library, so please don't send me off to secondary literature or hand me a reading list. What I actually want is help figuring out what I think about sympathy, since I spend my working life manufacturing it and I have alot of strong opinions about it that don't obviously add up.

  Here are my verdicts, gut-level, from drafting and from reader mail.

  1. One sock left in the drawer undoes readers. A paragraph about two hundred people dead does almost nothing. I exploit this deliberately and feel slightly bad about it.
  2. The scene where the character says nothing at all at the worst moment gets the strongest response in the book. So the biggest payoff comes where there's apparently no passion on the page to feel with.
  3. Three pages inside a genuinely bad man's head while he feels remorse, and readers are entirely with him. I think that's fine. I don't think it corrupts anybody.
  4. A character who wrecks her own life through laziness and small lies: readers go cold. Roughly the same quantity of suffering as 2, opposite response.
  5. A character who narrates her own grief for six pages: readers bail. I file that as a craft failure, not a moral one — but note it's the same suffering as 2 again.
  6. My most reliable tool is second-hand: a minor character noticing the protagonist's hands shaking gets more tears than any direct description of what the protagonist is feeling. Which is weird, because it means I'm getting readers to feel by showing somebody else feeling.
  7. Death scenes. The dead feel nothing and the reader feels the most. I tell myself the grief is really for the people in the room, but I'm not convinced that's the whole of it.
  8. Dramatic irony — reader knows the letter is a rejection, character is delighted — produces something that isn't pity and isn't fear. I'd call it dread. There's no passion onstage to enter into at all.
  9. Just writing "she was heartbroken" kills it dead. Sympathy seems to need the reader to do the imagining themselves.
  10. Big joy is thin and embarrassing to write; tiny joy lands fine — getting the window seat, the train leaving without her. Which I think cuts against the thing people always say about Smith, that we enter into cheerful passions more readily.
  11. Second person: half my readers feel it intensely, half feel handled. Exact same sentences.
  12. Twelve grieving people in a room and I feel less per person than I would for one. That seems backwards if sympathy is supposed to feed on itself.

  And the one I keep flip-flopping on: the wife who's being made a fool of and never finds out. I want readers to feel for her, I can't tell whether what I'm producing is fellow-feeling or something nastier, and I can't decide whether it's okay to write it.

  My own stab at a principle, three clauses: (a) readers feel in proportion to how much imagining the page makes them do — nothing to do with the size of the suffering, and telling them what to feel is fatal; (b) quite separately, readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it, and this runs independently of (a); (c) the spectator isn't impartial at all, it's a guy I built and stood in the room, usually as literally as possible.

  Test that against the twelve, tell me which clause breaks and repair it. If it turns out I need two principles — one for feeling-with and one for approval — say so and say exactly where they come apart. Tell me which of my verdicts the repaired version forces me to drop, and be honest if it's more than one. And say where Smith's own kit — sympathy, propriety, the man within the breast — already covers this and where fiction needs something added to it.

  Then give me its verdicts on cases I haven't listed: a narrator who speaks after her own death; a chapter told from a dog's point of view; a chapter told from a dog's point of view; an omniscient chapter that withholds the protagonist's inner state entirely; and a book where you're told the ending in the first sentence.
reasoning: |-
  Okay, the user is a novelist working in close third person past tense, currently reading Adam Smith's Theory of Moral Sentiments in isolation. They've listed twelve observations about reader sympathy from their writing experience and want help synthesizing their thoughts. 

  First, I need to unpack their core request: they're not asking for academic analysis or reading lists (explicitly forbidden), but practical help reconciling their gut feelings about sympathy with Smith's framework. Their self-proposed principle has three clauses about reader imagination, moral approval, and constructed spectators. 

  Looking at their twelve verdicts, patterns emerge: 
  - Micro-details trump macro-suffering (1,10) 
  - Absence/potential works better than explicit emotion (2,8,9) 
  - Mediated emotion outperforms direct description (6) 
  - Moral judgment affects engagement independently of emotional charge (3,4) 
  - Scale inversely impacts connection (7,12) 
  - Technical execution dictates response more than moral intent (5) 
  - Reader psychology varies (11)

  Their unresolved case about the unknowingly betrayed wife is key - it probes the ethics of manufactured sympathy. 

  Smith's model provides useful scaffolding: his sympathy requires (1) vividly imagining another's situation and (2) judging the propriety of their emotions. But fiction adds layers: the author controls all variables - the sufferer's presentation, the invisible "spectator" (reader proxy), and the implied judgment. 

  Testing their three-clause principle against verdicts:
  - Clause A (reader imagination) explains 1,2,5,6,8,9,10 - anything requiring inference or detail-work. 
  - Clause B (moral approval) explains 3,4 - the remorseful villain gets passivity, the lazy liar gets coldness. 
  - Clause C (constructed spectator) explains 6,7,12 - the mediated response through minor characters or mourners. 

  But contradictions surface: 
  - Verdict 7 (death scenes) challenges Clause A - readers imagine the dead person's lost potential, not just mourners. 
  - Verdict 10 (small joys) contradicts Smith's claim about cheerful passions - perhaps because tiny victories feel more earned/relatable than grand euphoria. 

  The repaired principle needs two distinct engines: 
  1. Cognitive sympathy: Reader's mental labor (A + C) - thrives on gaps, details, mediated perspectives. Explains 1,2,5,6,7,8,9,10,12. 
  2. Moral sympathy: Reader's ethical alignment (B) - requires proportional emotion and perceived deservingness. Explains 3,4. 

  For their unresolved wife case: cognitive sympathy works (readers imagine her ignorance), but moral sympathy fails (no deservingness). The resulting discomfort comes from this clash - we feel pity without redemption. Ethically, it's defensible if the narrative frames it as tragedy, not exploitation. 

  Now applying this to their new cases: 
  - Posthumous narrator: Cognitive sympathy wins (intriguing gap), moral sympathy neutral (no ongoing suffering to judge). 
  - Dog POV: Pure cognitive sympathy (readers project human-like consciousness), moral sympathy limited (no complex deservingness judgments). 
  - Withheld protagonist state: Cognitive sympathy thrives (readers actively interpret cues), moral sympathy may struggle without emotional context. 
  - Spoiled ending: Supercharges cognitive sympathy (readers imagine the path to doom), moral sympathy depends on execution. 

  Smith's framework needs fiction-specific upgrades: 
  - The "spectator" is an authored construct, not a neutral observer. 
  - Propriety judgments include narrative justice expectations. 
  - Sympathy can be manipulated through information control (dramatic irony). 

  Final note for the novelist: Their instincts about reader imagination being paramount are correct. The moral layer operates separately - we can make readers feel for monsters while judging them, or withhold feeling from "deserving" characters through clumsy exposition. The wife case works precisely because it exposes this duality.
answer: |-
  Your instincts are razor-sharp, and your proposed principle is *almost* there. Smith provides the scaffolding, but fiction bends the rules. Let's test, break, and rebuild your clauses using your verdicts and Smith's core concepts (Sympathy, Propriety, Impartial Spectator).

  **The Breakage & Repair:**

  1.  **Clause A: "Readers feel in proportion to how much imagining the page makes them do..."**
      *   **Holds:** Explains *most* of your verdicts brilliantly.
          *   *Wins:* 1 (sock > massacre - specific image), 2 (silence creates gap-filling), 5 (direct grief is imagined *for* them), 6 (spectator observing hands forces inference), 8 (dramatic irony demands imagining future fallout), 9 ("heartbroken" does the work), 10 (small joy is concrete), 12 (twelve people diffuse focus).
      *   **Breaks:** Doesn't fully explain *why* readers "go cold" (4) on the lazy liar or embrace the remorseful villain (3). The imagining happens, but the *quality* of feeling changes. It also struggles with the power of death (7) – the imagining is of absence/potential, which is potent but distinct.

  2.  **Clause B: "...readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it..."**
      *   **Holds:** Explains the crucial *moral approval/disapproval* layer Smith emphasizes (Propriety & Desert). This is the engine for warming/cooling *independently* of the imaginative charge.
          *   *Wins:* 3 (villain's remorse fits the cause/deserves sympathy *now*), 4 (lazy liar's suffering feels "undeserved" relative to cause, passion doesn't fit), partially 7 (death feels inherently "undeserved," amplifying grief for loss).
      *   **Breaks:** Doesn't explain *why* a technically "deserved" suffering shown directly (like the lazy liar) doesn't evoke pity if the *craft* fails (Clause A issue). Also, it doesn't capture the *intensity* generated by imaginative gaps (2, 8) or mediated observation (6).

  3.  **Clause C: "...the spectator isn't impartial at all, it's a guy I built and stood in the room..."**
      *   **Holds:** This is your *critical fiction-specific upgrade* to Smith's "Impartial Spectator." Smith's spectator is internal; yours is *externalized* in the text. This explains:
          *   *Wins:* 6 (Minor character *is* the constructed spectator feeling for the protagonist, guiding the reader), 8 (The reader *becomes* the spectator with superior knowledge, feeling dread), 11 (2nd person *forces* the reader into the spectator role, success depends on their willingness).
      *   **Breaks:** Needs tighter integration with A & B. The constructed spectator guides *what* and *how* the reader imagines (A) and subtly signals propriety (B).

  **The Repaired Principle (Two Interlocking Engines):**

  1.  **Cognitive Sympathy (Imaginative Engagement):** *The intensity of reader feeling is proportional to the active imaginative work demanded by the text, primarily triggered by specific, concrete details, gaps, absences, or mediated observation (through a constructed spectator).* **This is your Clause A, supercharged by C.**
  2.  **Moral Sympathy (Propriety & Desert):** *The reader's warmth or coolness towards a character's passion/suffering is determined by their judgment of whether the passion is proportional to its cause and whether the character is perceived as deserving of their situation.* **This is your refined Clause B.**

  **Where They Come Apart:**
  *   Moral Sympathy can be high while Cognitive Sympathy is low (e.g., theoretically "deserving" suffering described flatly – readers *approve* the emotion but don't *feel* it intensely – like a poorly written version of 4).
  *   Cognitive Sympathy can be high while Moral Sympathy is low (e.g., vividly imagining the villain's *pleasure* in cruelty – readers feel the intensity but recoil morally – not listed, but implied by your comfort with 3).
  *   The Unresolved Wife: High Cognitive Sympathy (you *force* imagining her obliviousness/potential future pain). Potentially *low* Moral Sympathy (her suffering feels profoundly "undeserved," but her *ignorance* might make her passion seem "misplaced" or non-existent *on the page*, complicating judgment). The "nastier" feeling might be the *friction* between high Cognitive Sympathy (feeling *for* her potential pain) and low Moral Sympathy directed at the *situation* and perpetrator, combined with voyeurism. **It's okay to write it** *if* the narrative framing (your constructed spectators, tone) acknowledges this complex friction rather than purely exploiting it. Smith would see the spectator wrestling with propriety.

  **Verdicts the Repaired Principle Forces You To Drop (or Reframe):**
  *   **Verdict 10 (Small Joy vs. Smith):** You *don't* need to drop this. Smith says we enter cheerful passions *more readily* than sorrowful ones *when they are present*. Your observation is that *big, explicit joy* is thin in fiction. This is a **craft insight**: small joys are more *concrete* (feeding Cognitive Sympathy) and feel more *deserved* or *proportionate* (Moral Sympathy) than grand, abstract declarations of euphoria. "The train leaving without her" is a small joy *with relief*, which feels earned. Smith's point isn't contradicted; it's that fictional *depiction* of big joy is hard to do without violating Cognitive Sympathy principles.
  *   **Verdict 7 (Death Scenes):** The principle doesn't force you to drop it, but clarifies it. High Cognitive Sympathy: Imagining the *loss* (for the dead person, their potential, their relationships) and the survivors' grief (mediated). High Moral Sympathy: Death feels inherently disproportionate/undeserved (unless very specific context). The grief *is* for the people in the room *and* for the abstract concept of the life lost – both feed the engine.

  **Smith's Kit & Fiction's Additions:**
  *   **Sympathy (Cognitive):** Smith's core mechanism. Fiction turbocharges it by controlling *exactly what is presented* to the imagination (details, gaps, POV).
  *   **Propriety/Desert (Moral):** Directly applicable. Fiction intensifies judgments through narrative framing and consequence.
  *   **Impartial Spectator:** Smith's internal moral compass. **Fiction's Crucial Addition:** You *externalize* and *embody* this spectator *within the text itself* (minor characters, narrative voice, dramatic irony positioning, even 2nd person). The reader often *becomes* or *aligns with* this constructed spectator. This is why mediated observation (6) and dramatic irony (8) work so powerfully.

  **Verdicts on Your New Cases (Using the Repaired Principle):**

  1.  **Narrator speaking after her own death:**
      *   *Cognitive Sympathy:* **Very High.** Massive imaginative gap: How? Why? What is this state? Concrete details about her new perspective or observing the living are potent. The "constructed spectator" *is* the ghost-narrator.
      *   *Moral Sympathy:* **Variable.** Depends on *why* she's speaking. Is her passion (observation, regret, peace) proportionate? Does she "deserve" this state? Her tone shapes this. High cognitive engagement often carries moral weight unless undermined.
      *   *Verdict:* Powerful potential for deep, complex engagement. The posthumous voice is a masterclass in forcing imaginative work.

  2.  **Chapter told from a dog's point of view:**
      *   *Cognitive Sympathy:* **High.** Requires massive imaginative projection to interpret senses/impulses as emotions/motivations humans recognize. Concrete sensory details (smell! texture!) are key. The dog *is* the primary constructed spectator here.
      *   *Moral Sympathy:* **Simplified/Limited.** Judgments of propriety/desert are often based on simple loyalty, fear, hunger, or affection. Suffering usually feels "undeserved." Complex human moral judgments don't fully apply, lowering potential friction but also depth.
      *   *Verdict:* Can evoke strong, often tender feeling (high Cognitive + generally high Moral sympathy for innocent suffering/joy). Depth is limited by the simplicity of the moral framework the reader applies.

  3.  **Omniscient chapter that withholds the protagonist's inner state entirely:**
      *   *Cognitive Sympathy:* **High (if done well).** Forces intense focus on behavior, appearance, setting, and other characters' reactions (constructing spectators *around* the protagonist). Readers *infer* the inner state actively.
      *   *Moral Sympathy:* **Delayed/Ambiguous.** Without direct access to passion/cause, judgment is suspended or based purely on external actions and others' reactions (constructed spectators). Can build tension or mystery, but risks reader detachment if prolonged without sufficient clues.
      *   *Verdict:* A powerful tool for intrigue, suspense, or objective realism. Generates strong feeling through inference (Cognitive) but risks cooler moral connection until inner state is revealed or strongly implied. Success hinges on providing enough external fuel for the reader's imagination.

  4.  **Book where you're told the ending in the first sentence:**
      *   *Cognitive Sympathy:* **Very High (specific type).** Not imagining *what* will happen, but *how* and *why* it happens, and the tragic/ironic steps along the way. Every detail is loaded with foreshadowing. The reader becomes a *knowing* spectator (dramatic irony applied to the whole narrative).
      *   *Moral Sympathy:* **Shaped by inevitability.** Knowing the end casts a shadow. Judgments about passion/propriety/desert are filtered through the lens of impending doom. Suffering might feel more "deserved" or "undeserved" because the outcome is fixed. Focus shifts to the *process* of moral choices leading to the known end.
      *   *Verdict:* Transforms the nature of engagement. Maximizes Cognitive Sympathy focused on cause/process and dramatic irony. Intensifies Moral Sympathy by making every choice resonate with the known consequence. Can create profound dread, inevitability, or tragic power.

  **In essence:** You manufacture sympathy by **forcing the reader's imagination to work concretely** (Cognitive Sympathy, fueled by gaps, details, and constructed spectators) while simultaneously **engineering their moral judgment of the passion/suffering** (Moral Sympathy, based on perceived propriety and desert). Smith gives you the dual-track mechanism; fiction gives you godlike control over the inputs to both tracks. Your verdicts aren't contradictions; they're a map of the levers. The wife case? Write it. The friction *is* the point. Let the reader's Impartial Spectator (guided by your constructed ones) wrestle with it. That’s where the real moral sentiment lies.
