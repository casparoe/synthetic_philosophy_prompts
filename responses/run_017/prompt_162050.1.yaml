prompt: |-
  I'm a journalist who covers science and ideas, and I keep tripping over the same shape of argument. Most recently it happened twice in one day at a workshop on computation and physics where I was the only non-specialist in the room.

  Case one: someone claimed some kind of exotic physical setup could "do something uncomputable." A computer scientist shot back that this was confused, because whatever the setup does isn't computation at all — the class of computable functions is fixed once you've settled what an effective procedure is, so there's nothing here to discover. Fine. But twenty minutes later the same person used the very same claim to argue that the human brain is simulable in principle, and said that if it turned out not to be, that would be a discovery about brains, not a decision about what "computable" means. Stipulation in one breath, empirical finding in the next.

  Case two: someone raised a hypothetical machine that outran a Turing machine. One speaker said no physical device could ever refute the thesis, since anything that did that would ipso facto not be computing. Another speaker said the version anyone actually cares about is the physical one — the kind quantum computing people argue about — and that it really could turn out false. Then a third person pointed out that everyone treats the fact that wildly independent formalisms all land on the same class of functions as powerful evidence for the thesis, which only makes sense if it isn't a stipulation. Nobody resolved it; they all just moved on.

  What I'm after isn't the computability literature as such. It's the general move: a claim about the co-extension of a formal and an informal predicate ("computable by a Turing machine" / "computable in principle, by anything, ever") that gets to act as a definition when it's under pressure and as a discovery when it's doing work, where both roles are individually respectable. So it isn't motte-and-bailey — there's no indefensible version being smuggled — and it isn't quite plain equivocation either, since the same people hold both ends honestly and the shift isn't a bait-and-switch. I've since noticed the same shape in a couple of other places, e.g. with "fitness" in evolutionary biology and with the equivalence principle.

  Does this thing have an established name? If the nearest concepts are things like Carnapian explication, the analytic/synthetic distinction, "criterion" versus "hypothesis," or a computability-internal taxonomy (a thesis versus a principle versus an axiom, or the bare claim versus the complexity-flavored one where "feasibly" does the work), I want to know which fits best and exactly where my description stops fitting. A bare label won't satisfy me. And if there genuinely isn't one, coin a term, define it, and tell me where the boundary cases are: when does this double life cross over into being an illegitimate move, and when is it just how such claims have to work?
reasoning: |-
  Okay, the user is a science journalist who's noticed a recurring argument pattern involving the Church-Turing thesis. They observed this during a workshop where experts flip-flopped between treating "computability" as a definition versus an empirical claim. The core tension is how the same concept (like "computable") can function as both a stipulative definition and a discovery about the world without being fallacious.

  Hmm, they're clearly frustrated by the lack of resolution in these debates and wants precise terminology to describe this duality. The examples from evolutionary biology ("fitness") and physics (equivalence principle) suggest they've spotted a fundamental epistemic pattern beyond computability. 

  What makes this tricky is that they've already ruled out common misinterpretations: it's not motte-and-bailey (no bait-and-switch), not pure equivocation, and not just Carnapian explication. They're hunting for something more nuanced - a framework where both interpretations coexist legitimately. 

  The historical context of the Church-Turing thesis is key here. When Turing defined computability in 1936, it was a mathematical formalism. But the claim that this captures all human-computable functions (Deutsch's physical version) shifts it into an empirical hypothesis. The user senses that experts toggle between these views situationally: retreating to formalism when challenged ("that's not computation!") but appealing to evidence ("all models converge!") when justifying its scope.

  I recall that Kleene made this duality explicit by distinguishing the "thesis" (mathematical) from the "principle" (physical). That might be the closest existing terminology. But the user wants to know when this dual use becomes illegitimate - say, when someone tries to "prove" the physical version mathematically, or vice versa. 

  The boundary cases would include: conflating the definitions (like claiming a hypercomputer "refutes" Turing machines), or applying physical interpretations to purely formal systems. It's legitimate only when both meanings are kept distinct but parallel, with clear context-switching. 

  Since no perfect term exists, I should synthesize one that captures this duality. "Janus-faced" comes to mind, referencing the two-faced god - one face toward formalism, one toward physics. But "dialectical hinge" might better convey how it pivots between frameworks. The key is emphasizing that this isn't inconsistency but a necessary feature of bridging abstract models with reality.
answer: |-
  This phenomenon absolutely has a name and a conceptual framework, though the *specific interplay* you're highlighting is exceptionally well-observed. The core concept is the **Church-Turing Thesis (CTT)** itself, but you've nailed the *precise duality* in its interpretation and usage that causes friction. The best fit for the *general move* you describe is a **Constitutive Principle / Empirical Hypothesis Dialectic** within a broader framework of **Explication**.

  Here's the breakdown, why it fits, and where the boundaries lie:

  1.  **The Core: Explication (Carnapian)**
      *   **What it is:** Carnap defined explication as replacing a vague, imprecise pre-theoretical concept (the *explicandum*) with a precise, formal concept (the *explicatum*) within a theoretical framework.
      *   **How it fits:** "Effectively computable," "mechanically calculable," or "computable in principle" is the vague *explicandum*. The formal definitions (Turing machines, lambda calculus, recursive functions, etc.) are the *explicata*.
      *   **The Duality Source:** Explication inherently involves two claims:
          *   **Constitutive/Stipulative Claim:** *Within the formal system*, the *explicatum* (e.g., TM-computable) *defines* what "computable" means for that system. This is non-empirical and not falsifiable *within the formalism*. (Your first speaker's "fixed class" argument).
          *   **Empirical/Descriptive Claim:** The chosen *explicatum* adequately captures (is co-extensive with) the intended, pre-theoretical *explicandum* in the real world (e.g., anything a human could compute step-by-step, anything physically computable). This *is* an empirical claim about the world. (Your second speaker's "discovery about brains" argument).
      *   **The Shift:** Experts seamlessly shift between these two aspects of the *same explication* depending on the context of the argument. When defending the formalism's consistency or scope *internally*, they lean on the constitutive aspect. When arguing about the *scope* of the formalism's applicability to reality (physics, minds), they lean on the empirical aspect.

  2.  **The Specific Dialectic: Constitutive Principle vs. Empirical Hypothesis**
      *   **Constitutive Principle:** When treated this way, CTT acts as a *definition* or a *criterion*. It says: "To be 'computable' *means* to be computable by a Turing machine (or equivalent)." Anything failing this criterion is, *by definition*, not computation. (Computer scientist's rebuttal to the exotic setup; first speaker's rebuttal to the hypercomputer).
      *   **Empirical Hypothesis:** When treated this way, CTT acts as a claim about the physical world or human cognition: "All functions that are physically computable (by any physical system, including brains) are computable by a Turing machine." This *could* be falsified by discovering a physical process that genuinely computes a non-Turing-computable function. (The argument about brains being simulable; the "physical version" speaker; the convergence evidence).
      *   **The Dialectic Tension:** The power and near-universal acceptance of CTT comes precisely from this duality. The constitutive principle provides a rigorous, unambiguous standard. The empirical hypothesis leverages that standard to make a profound claim about the universe. However, this creates the tension you observed: using the constitutive aspect to *deflect* challenges ("that's not computation!") while simultaneously relying on the empirical aspect to *justify* the scope ("look how all models converge!").

  3.  **Why Your Description Fits Perfectly & What It's Called:**
      *   **The Established Name:** This *specific interplay* around CTT is widely discussed but doesn't have a single, universally agreed-upon snappy label *beyond* referencing the explication dialectic within CTT. Discussions often focus on the distinction between the **Mathematical CTT** (constitutive/definitional) and the **Physical CTT** (empirical hypothesis) or **Deutsch's Principle** (the physical universe computes only Turing-computable functions).
      *   **Your Coinage:** If a new term is needed, **"Explicative Dialectic"** or **"Constitutive-Empirical Pivot"** captures the core mechanism. More evocatively, it's the **"Janus-Face of Explication"** (looking both ways at once) or a **"Dialectical Hinge"** in conceptual frameworks.
      *   **It's NOT:**
          *   **Motte-and-Bailey:** Correct, as you note. Both positions are defensible and held sincerely; it's not a retreat strategy.
          *   **Pure Equivocation:** Correct. The shift is between two *related but distinct aspects* of the same underlying conceptual move (explication), not between two unrelated meanings.
          *   **Simple Analytic/Synthetic:** It straddles this distinction. The constitutive claim is analytic (true by definition within the formalism). The empirical claim is synthetic (about the world). The thesis *as a whole* blurs the line.
          *   **Criterion/Hypothesis Distinction Alone:** This is *part* of it, but the key is their *interdependence within an explication*. The criterion *defines* the terms for testing the hypothesis.

  4.  **Boundary Cases: When it's Legitimate vs. Illegitimate:**
      *   **Legitimate Use (How such claims *must* work):**
          *   When clearly distinguishing between the formal definition/constitutive principle and the empirical claim about its scope.
          *   When using the convergence of formalisms as *evidence for* the empirical hypothesis, *not* as proof of the constitutive definition.
          *   When using the constitutive definition to clarify the *meaning* of terms within the formal framework.
          *   When the empirical hypothesis is framed as falsifiable *in principle* (e.g., "If a physical system demonstrably computes the halting function, then the Physical CTT is false").
      *   **Illegitimate Move (Crossing the Line):**
          *   **Conflation:** Claiming that a challenge to the *empirical hypothesis* (e.g., a proposed hypercomputer) is *logically impossible* because it violates the *constitutive definition*. This wrongly treats the empirical claim as analytic. (Saying a hypercomputer "ipso facto isn't computing" illegitimately conflates the two).
          *   **Immunization:** Using the constitutive definition to *define away* any potential counter-evidence to the empirical hypothesis *a priori*. (Dismissing *any* physical system claiming non-TM computation as "not computing" by fiat, without engaging with the physics).
          *   **Begging the Question:** Assuming the truth of the empirical hypothesis *within* an argument *for* the empirical hypothesis, often masked by the constitutive definition. (e.g., "No physical system can compute non-TM functions because computation *is defined by* TM computability").
          *   **Misapplying Convergence:** Claiming the convergence of formalisms *proves* the empirical hypothesis beyond doubt, ignoring that the convergence primarily reinforces the robustness of the *mathematical* concept, not necessarily its universal physical scope.

  5.  **Your Other Examples:**
      *   **Fitness (Evolutionary Biology):** "Fitness" is an *explicatum* (often defined as expected reproductive success) for the vague *explicandum* of "adaptedness" or "design." The constitutive aspect defines fitness operationally in models. The empirical aspect is the claim that this measure *actually predicts and explains* evolutionary change in nature. Debates often pivot: is low fitness in a model a *definition* of maladaptation or evidence *about* the real world? Is a trait with high reproductive success but seemingly maladaptive (e.g., runaway sexual selection) "fit" by definition, or does it challenge the hypothesis?
      *   **Equivalence Principle (EP):** The weak EP (WEP - universality of free fall) is often treated as the empirical *explicandum*. Einstein's EP (EEP - equivalence of gravity and acceleration locally) is a powerful *explicatum* constitutive of General Relativity (GR). Within GR, EEP is foundational. The empirical hypothesis is that WEP holds (tested by experiments like MICROSCOPE) and that EEP *accurately describes* gravity. Challenges involve whether observed violations (if any) falsify GR (empirical hypothesis) or require redefining the fundamental principles (constitutive aspect) of gravity theory.

  **In Summary:**

  You've identified the inherent **dialectic within explication**, specifically the tension between the **constitutive/stipulative role** (defining the term within the formalism) and the **empirical/hypothetical role** (claiming the formalism captures reality). While often discussed regarding the **Church-Turing Thesis** (distinguishing its **Mathematical** and **Physical** interpretations), this is a general pattern for foundational concepts bridging formalism and the world (**Fitness**, **Equivalence Principle**).

  The move is **legitimate** when the roles are distinguished and used appropriately: the constitutive role clarifies meaning within the theory, the empirical role makes testable claims about the world (supported by evidence like formalism convergence). It becomes **illegitimate** through conflation (treating the empirical claim as definitionally true), immunization (using the definition to block empirical challenges), or question-begging.

  This isn't a flaw; it's often **how such powerful bridging concepts must work**. The challenge, as you astutely observed, is navigating the pivot without confusion or sleight of hand.
