  For the quiz, I’ll draft scenarios mirroring their listed tactics. Each question must pit literal truth against intended deception without naming it. E.g., Friday news dumps exploit attention gaps—technically transparent, strategically opaque. The answer scale should range from permissive to condemnatory to reveal moral intuitions. 

  The tree structure will start with speaker/hearer agency (who "authors" the falsehood?), then traceability (can you point to a lie?). For instance, jargon misuse ("no confirmed cases") lets the hearer misinterpret, leaving no false statement to cite—deniable but manipulative. Some might argue this is worse than lying; others see it as shrewd. 

  Scoring will cluster responses into the seven leaves. Tricky part: some leaves (e.g., "assurance-and-role" vs. "no-difference") might overlap if someone rejects literal truth as insufficient. I’ll note where the org’s house style—likely exploiting traceability—falls outside coherent theories, forcing reflection. 

  Final design: 10 scenarios → choice of 4 answers → position mapping + gaps analysis. Workshop payoff is showing how "technically true but misleading" corrodes trust long-term, even if deniable. The doorstep question is the gut-check anchor.
answer: |-
  Here's a workshop diagnostic instrument designed to map ethical intuitions about truthful communication without triggering semantic defenses. It focuses on *mechanisms* and *consequences*, avoiding loaded terms.

  **The Diagnostic Quiz: Truthful Communications?**  
  *(Answer Key & Analysis Framework Follows)*

  **Instructions:** For each scenario, select the option that best reflects your view of the communicator's action:
  - **A:** Totally fine / Standard practice  
  - **B:** A bit off, but not a major issue  
  - **C:** Just as bad as stating a false fact directly  
  - **D:** Worse than stating a false fact directly  

  ---

  1.  **"No Comment" Tone:** A company spokesperson, when asked if the CEO is resigning, says "No comment" in a somber, resigned tone widely interpreted as confirming the resignation.  
      *Mechanism: Tone implies false content; hearer assembles belief.*  

  2.  **Strategic Timing:** A government agency publishes a controversial policy change report on its website at 6pm on the Friday before a major holiday.  
      *Mechanism: True content, engineered for low attention; hearer may miss/misinterpret.*  

  3.  **Answering the Wrong Question:** A politician asked "Did you accept illegal campaign donations?" responds: "I have always fully complied with campaign finance disclosure laws." (They did accept illegal donations but disclosed them.)  
      *Mechanism: True statement redirects; hearer infers "no" to actual question.*  

  4.  **Framed Statistic:** A pharmaceutical company states: "90% of patients in our trial showed no severe side effects." (True, but 10% had life-threatening reactions – higher than competitors.)  
      *Mechanism: True statistic selected to imply safety; hearer infers low risk.*  

  5.  **Friendly Reporter Briefing:** You confidentially tell a trusted reporter: "Off-record, the internal review found massive safety flaws. Officially, we say ‘review ongoing.'" They publish the flaws citing "insiders."  
      *Mechanism: True content leaked; speaker avoids direct assertion.*  

  6.  **Technical Jargon:** During a disease outbreak, officials state: "There are no *confirmed* cases in the city." (True; tests are backlogged. Internally, "confirmed" requires 2 positive tests. Public hears "no cases.")  
      *Mechanism: Technical truth; hearer assigns common meaning.*  

  7.  **Delayed Correction:** A reporter sends you a draft story containing a critical factual error favoring your position. You don’t correct it pre-publication, issuing a clarification only after it trends online.  
      *Mechanism: Allowing falsehood to spread; correcting late limits reach.*  

  8.  **Non-Denial Denial:** Asked "Did your firm collude on bids?" a CEO says: "We are committed to fair competition." (True, but they did collude.)  
      *Mechanism: True but irrelevant; hearer infers denial of accusation.*  

  9.  **Cried Wolf:** Your office issued 10 urgent warnings about minor issues. When a real crisis hits, you state: "This is a severe, immediate threat." The public ignores it.  
      *Mechanism: Past conduct undermines truthful assertion; hearer disbelieves.*  

  10. **Doorstep Calibration:** Armed strangers ask if your friend is hiding in your house. You say: "I haven't seen him today." (True; you saw him yesterday & he’s in your attic.)  
      *Mechanism: Literal truth; hearer infers absence. Context: Life-threatening harm.*  

  ---

  **Logical Tree & Philosophical Positions ("Leaves")**  
  *Branch 1: Who Supplies the False Content?*  
  - Speaker directly asserts falsehood (not in quiz)  
  - **Hearer assembles false belief** from true elements arranged by speaker *(All quiz cases)*  

  *Branch 2: Traceability (Can the falsehood be quoted?)*  
  - **Traceable:** Specific false sentence exists (e.g., Reporter's error in Q7)  
  - **Untraceable:** Only inferences/impressions exist; speaker can deny intent *(Q1, Q3-Q6, Q8, Q10)*  

  *Argument on Traceability:*  
  - **Better?** Clean record protects speaker legally; shows "technically honest" discipline.  
  - **Worse?** Hearer co-authors error, feels gaslit; speaker maintains deniability, eroding trust.  

  **The Seven Leaves (Defined Positions):**  
  1.  **Strong Assertionism:** *Only asserting a believed-false statement is intrinsically wrong; other tactics are merely about fulfilling disclosure duties.*  
  2.  **Assurance-and-Role:** *Saying "we never lie" promised full candor, not just literal truth; role-based duties prohibit engineered inference.*  
  3.  **No-Difference:** *The mechanism (lie vs. engineered truth) is irrelevant; both intentionally manipulate the hearer's belief.*  
  4.  **Nothing-Pro-Tanto-Wrong:** *No inherent ethical issue; only consequences matter (e.g., harm, legal liability).*  
  5.  **Engineered-Truth-Worse:** *Using truth to mislead exploits trust in language/role and shifts blame to the hearer, making it worse.*  
  6.  **Practice-Relative Conventionalism:** *The rules of the activity (e.g., politics, PR) define acceptability; "truth" is context-contingent.*  
  7.  **Eliminativist:** *The lie/mislead distinction is a bad proxy; rebuild ethics around core wrongs (e.g., betrayal of assurance, manipulation, harm).*  

  ---

  **Scoring Key & Analysis**  
  *(Patterns based on Consistently Chosen Answers: A/B/C/D)*  

  | Leaf                          | Dominant Answer Pattern      | Untraceable Cases (Q1,Q3-Q6,Q8,Q10) | Traceable Cases (Q7) | Doorstep (Q10) | Notes                                                                 |
  | :---------------------------- | :--------------------------- | :---------------------------------- | :------------------- | :------------- | :-------------------------------------------------------------------- |
  | **1. Strong Assertionism**    | Mostly **A**, some **B**     | A/B                                 | B/C                  | A/B            | Sees no inherent issue if statement true.                             |
  | **2. Assurance-and-Role**     | Mostly **B**, **C**          | C                                   | C                    | **D**          | Doorstep **D** is key. Untraceable=C sees breach of candor promise.   |
  | **3. No-Difference**          | Consistently **C**           | C                                   | C                    | C              | All deception equally wrong. Q10=D suggests nuance.                   |
  | **4. Nothing-Pro-Tanto-Wrong**| Mostly **A**                 | A                                   | A/B                  | A              | No ethical issue, only pragmatic risks.                               |
  | **5. Engineered-Truth-Worse** | **D** on key Untraceable     | **D** (Especially Q1,Q3,Q5,Q6,Q8)   | C/D                  | **D**          | Untraceable=D is signature. Sees manipulation/exploitation as worse.  |
  | **6. Practice-Conventionalism**| Mixed, **A/B** on "normal"   | A/B if "normal PR"                  | A/B                  | **C/D**        | Q10 **not** A/B shows limits; rejects universal rules.                |
  | **7. Eliminativist**          | Inconsistent / **C/D** focus | C/D                                 | C/D                  | C/D            | May reject quiz framing; looks for harm/betrayal regardless of mechanism. |

  **Unresolvable Overlaps:**  
  - **No-Difference (3)** vs. **Engineered-Truth-Worse (5)** on *Traceable* cases (Q7): Both score **C/D**. The quiz cannot distinguish if they see traceable engineering as *equally bad* (3) or *less bad* (5) than untraceable.  
  - **Assurance-and-Role (2)** vs. **Eliminativist (7)** on *Betrayal*: Both may score **C** on many cases. Q10 **D** favors (2); focus on mechanism vs. core wrong distinguishes.  

  **Empty Combinations & The "House Style" Problem:**  
  - **Consistent A on Untraceable + C/D on Doorstep:** *Incoherent.* If engineered truth is "fine" (A), the doorstep shouldn't be worse (C/D) without role/betrayal factors.  
  - **Consistent D on Untraceable + A/B on Doorstep:** *Unattractive.* Hard to justify engineered truth being "worse" than lying *except* when lives are at stake.  
  - **Consistent B on Everything:** *Undefended.* Suggests everything is "a bit off" but lacks a principled reason.  
  - **Your House Style (Likely):** *Consistent A on Untraceable (Q1,Q3-Q6,Q8), B on Traceable (Q7), A on Doorstep (Q10).* This matches **Strong Assertionism (1)** with **Practice-Conventionalism (6)** tendencies. It falls into an *empty cell*: **Assertionism** ignores the role-based duty to avoid engineered inference, while **Conventionalism** ignores the universal wrong in the doorstep. *This gap is the workshop's target.* The house style relies on "traceability" for deniability (clean record) but is ethically unstable when confronted with Q10.  

  **Workshop Landing:**  
  The scoring reveals that the common house style ("literal truth is always sufficient") is philosophically incoherent when tested against the doorstep case. It also highlights that traceability primarily serves *the speaker's* deniability, not the public's understanding. The core tension is between:  
  - **Assertionism/Conventionalism:** "We kept the record clean."  
  - **Assurance/No-Difference/Eliminativism:** "We broke trust by designing inferences."  
  Use the doorstep (Q10) to force acknowledgment that context/role matters, then ask: *"If literal truth isn't enough here, why is it enough when the stakes are public trust?"* This moves the discussion from semantic games to duties of the role.
