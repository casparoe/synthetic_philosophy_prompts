  The memo needs to address three key points: the nature of the action (strike vs. slowdown), the impact on students, and the moral credibility argument from counsel. For the first point, is withholding records while still teaching more like sabotage? The user points out that the records are being used as training data for AI that could replace instructors, which complicates things. I should frame it as a targeted action against administrative tasks that have secondary uses, distinguishing it from core teaching duties.

  Regarding student impact, the harm is dispersed and ongoing, unlike a traditional strike. The user notes that undergraduates are affected, including the instructors' own students. The standard argument that the employer can end the harm by settling fits awkwardly here. I need to acknowledge that while also emphasizing the mitigation through carve-outs for urgent cases.

