answer: |-
  **Project Proposal: Decision Theory Under Transformative Loss**  

  ### Research Question  
  Does the direction of transformation—additive (gaining novel capacities/identities) versus subtractive (losing core capacities/identities)—fundamentally alter the structure of rational choice under radical uncertainty, or is the critical variable whether the transformation destroys the agent’s *evaluative standards* themselves?  

  ### Gap in Existing Literature  
  Current work on transformative experience (e.g., Paul-inspired frameworks) focuses overwhelmingly on *additive* cases: acquiring parenthood, vampirism, or new sensory capacities. Standard critiques of decision theory here target its inability to handle "experience gaps," where agents cannot simulate future subjective states. Proposed solutions—e.g., choosing for one’s future self, maximizing self-discovery, or reframing identity—rely on agents retaining access to *some* evaluative baseline (e.g., pre-transformation preferences or third-person testimony). These approaches implicitly assume the agent has a stable "before" state to anchor comparison or extrapolation.  

  Subtractive transformations rupture this foundation. When an agent loses a framework constitutive of their preferences (e.g., religious deconversion) or a capacity central to their evaluative standards (e.g., a musician’s hearing), they face not merely unknown experiences but the *collapse of the tools for evaluation itself*. Existing replies fail here: there is no "past self" to guide choice (if the loss is total), no revelatory value to maximize (if discovery requires the very capacity being lost), and no continuous identity to appeal to (if the loss fragments selfhood). The literature’s neglect of subtraction leaves decision theory untested against its most severe challenge: choice under evaluative obliteration.  

  ### Method: Phases and Taxonomy  
  **Phase 1 (Months 1–3): Conceptual Groundwork & Taxonomy**  
  - Develop a taxonomy of subtractive transformations along two axes:  
    (a) *Scope of loss*: Total (e.g., religious framework dissolution) vs. partial (e.g., selective sensory degradation).  
    (b) *Agency*: Voluntary (e.g., leaving a community) vs. involuntary (e.g., degenerative illness).  
  - Test whether additive cases map cleanly onto these dimensions (e.g., "becoming a vampire" as voluntary total gain).  

  **Phase 2 (Months 4–6): Stress-Testing Standard Replies**  
  - Apply canonical solutions (Paul’s "choice for the future self," procedural rationality, identity-redescription) to each cell of the taxonomy.  
  - Identify *where* solutions fail: e.g., if future-self appeals collapse when the loss destroys temporal identity coherence, or if proceduralism fails when loss erodes second-order preferences.  

  **Phase 3 (Months 7–9): Synthesis and Empirical Calibration**  
  - Determine whether the additive/subtractive distinction explains observed failures better than the advisor’s "evaluative standards alteration" hypothesis.  
  - **Empirical note**: Armchair analysis suffices for conceptual mapping, but empirical input (e.g., interviews with deconverted individuals or patients undergoing sensory loss) would enrich edge cases. *This project will flag such needs but proceed philosophically, with empirical work as future scope.*  

  ### Outputs and Impact  
  - **Primary output**: A journal article (standalone) + revised dissertation chapter. The article will:  
    - Propose a revised typology of transformation severity based on evaluative fragility.  
    - Argue that rational choice frameworks require "loss-sensitive" tools (e.g., *evaluative triage*—ranking what preserves minimal agency).  
  - **Practical implication**: For someone deciding on a cochlear implant, the project clarifies whether their dilemma stems from *uncertainty* (manageable via testimony/adaptation models) or *evaluative collapse* (requiring scaffolding of new standards first).  

  ### Failure Conditions  
  The project fails if:  
  1. The taxonomy reveals no consistent difference in how standard replies handle additive vs. subtractive cases.  
  2. **Advisor vindication**: If transformations that *destroy evaluative standards* occur equally in additive cases (e.g., gaining an identity that shatters prior values), proving the additive/subtractive cut is a proxy.  

  ### Scope Management  
  If time runs short:  
  - Focus on total voluntary loss (e.g., religious exit) vs. total additive cases (e.g., sudden parenthood), setting aside mixed cases (e.g., cochlear implants).  
  - Deeper analysis of Paul’s framework takes precedence over extending the taxonomy.  

  ### Relation to Paul’s Distinction  
  The additive/subtractive distinction *crosscuts* Paul’s epistemic/personal categories:  
  - Epistemic transformation (gaining new knowledge) can be subtractive (e.g., losing ignorance that anchored values).  
  - Personal transformation (change in self-conception) can be additive (new identity) *or* subtractive (identity dissolution).  
  The key is whether the transformation annihilates the epistemic or personal *conditions for evaluation itself*.  

  ---  
  **Central Question**  
  \answer{Does the direction of transformation (additive vs. subtractive) expose unique limitations in decision theory’s capacity to handle the loss of evaluative foundations, or is the critical factor solely whether the transformation destroys the agent’s standards for choice?}
