prompt: |-
  I'm in a small reading group that just worked its way through Arrow's theorem — the four-ish conditions (unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship) and the result that nothing satisfies all of them at once — and instead of moving on I've been obsessing over actual ranked-choice voting, the eliminate-the-last-place-candidate-and-redistribute kind that Maine, Alaska, New York City primaries and Australia's lower house now use for real elections. So here's what I want: a reconstruction of what this practice presupposes about what an election is *for* and about what it even means to talk about the will of the voters, written for someone who has no library access and can't look anything up.

  The specific things I keep tripping over, in no particular order. (1) The reform pitch is basically that ranked choice ends spoilers — that a candidate who can't win shouldn't change who does — but that sounds like independence of irrelevant alternatives, and ranked choice notoriously violates it; whether a no-hope candidate is on the ballot can flip the winner. So is the reform case committed to something its own method breaks, or is the anti-spoiler complaint actually a weaker, more local thing about vote-splitting under plurality specifically? I'd like you to separate what the practice strictly presupposes from what it merely fits well with, and to say where it's just underdetermined and several theories would licence the same rules. (2) It's sold as producing majority winners, but the majority in question is *still standing after everyone else has been eliminated*, not *beats every rival one-on-one*, and those can come apart: ranked choice can dump the candidate who'd beat both finalists head to head, and in Alaska's 2022 special election the one Republican who looked like the stronger general-election candidate got knocked out ahead of the other one. What conception of collective preference does that presuppose, and is it a coherent one? (3) The ballot asks for one ranking up front and then reuses it after candidates have dropped out, which seems to presuppose that my ranking is stable and menu-independent — that my second choice in a ten-way field is the same as my second choice once it's down to three. Is that a real commitment of the practice or just a practical convenience? (4) And relatedly: two-round runoffs like France's let voters change their minds between rounds, which Arrow's framework doesn't even have room for, since it takes preference orderings as fixed inputs. Is that an evasion of the theorem or a genuinely different picture of elections as preference-forming rather than preference-aggregating?

  Then, the part I care about most: if we took the pairwise-majority idea seriously instead — elect the candidate who beats everyone head to head — what would actually have to change in how elections are run and talked about, what do we do when there is no such candidate, and is there any reading on which the specific pattern of violations ranked choice has is a feature rather than a bug? I'd rather get one argument followed all the way down than a survey of options, and please don't point me at papers or reading lists — just reason it out.
reasoning: |-
  Okay, the user is in a reading group that just covered Arrow's theorem and is now fixated on ranked-choice voting (RCV). They have several specific questions about how RCV relates to Arrow's conditions, particularly independence of irrelevant alternatives (IIA), the concept of majority winners, the stability of voter rankings, and how RCV compares to pairwise majority methods. They want a coherent reconstruction of the philosophical presuppositions behind RCV without academic references.

  First, I need to address each of their four points clearly. Let's start with the spoiler effect and IIA. The user is confused because RCV is marketed as eliminating spoilers but violates IIA. I should explain that the anti-spoiler claim is specific to plurality systems. In plurality, a third candidate can split votes, causing a less preferred candidate to win. RCV mitigates this by transferring votes, but it doesn't fully satisfy IIA because adding a non-winning candidate can still alter the outcome. The key is distinguishing between vote-splitting (which RCV handles) and IIA violations (which it doesn't).

  Next, majority winners in RCV. The user points out that RCV winners have majority support only after eliminations, not necessarily in head-to-head matchups. This relates to the Condorcet criterion. I need to explain that RCV presupposes a sequential elimination model where the winner is the most acceptable to the majority at each step, rather than the strongest pairwise candidate. This can lead to a Condorcet winner being eliminated early if they lack broad first-choice support, which might be seen as a trade-off for stability and simplicity.

  Then, the stability of voter rankings. RCV assumes that a voter's ranking is fixed and menu-independent. The user questions whether this is a practical convenience or a philosophical commitment. I should argue that it's both: RCV treats preferences as exogenous, viewing voters as having pre-determined rankings. This contrasts with two-round systems where voters can adjust between rounds, allowing for preference formation. However, RVC's fixed ballots simplify the process but ignore strategic changes.

  Regarding pairwise majority, the user wants to know what changes would be necessary and how to handle cycles. Implementing a Condorcet method would require voters to rank all candidates, and use complex tallying to find pairwise winners. If there's a cycle, methods like ranked pairs or Copeland's rule could resolve it. But this might confuse voters and increase strategic voting. The trade-off here is between fairness in matchups and practicality.

  The user's deeper needs involve understanding the philosophical underpinnings of RCV versus other systems. They seem to seek clarity on whether RCV's features are intentional trade-offs or flaws. Emphasizing that RCV prioritizes broad acceptability and simplicity over theoretical ideals like IIA or Condorcet efficiency could address this. Highlighting the practical aspects versus theoretical purity might satisfy their need for a coherent framework without academic references.
answer: |-
  Here’s a reconstruction of the philosophical underpinnings of ranked-choice voting (RCV), grounded in your specific questions. Think of this as an attempt to articulate the "implicit theory" baked into the practice itself:

  ### Core Presupposition: Elections as Finding the *Most Broadly Acceptable* Candidate
  RCV fundamentally presupposes that an election’s purpose is to identify the candidate who commands the **broadest, sustained support** from the electorate *through a process of elimination*. It’s not primarily about finding the "objectively best" candidate by some theoretical ideal, nor the one with the most passionate first-choice supporters, nor even necessarily the strongest head-to-head competitor. Instead, it’s about finding the candidate who can survive a sequential winnowing process where the *least acceptable* candidates are removed one by one, and votes coalesce around those remaining. The "will of the voters" is interpreted as the outcome of this specific process of iterative consensus-building.

  ### Addressing Your Specific Tripping Points

  1.  **The Spoiler Claim & IIA:**
      *   **What RCV Actually Mitigates:** The "spoiler" argument targeted by RCV advocates is **specifically the vote-splitting pathology of Plurality voting**. In Plurality, two similar candidates (A & B) can split their shared constituency, allowing a less popular, dissimilar candidate C to win with a small plurality. RCV *directly solves this narrow problem*: supporters of the weaker similar candidate (say, B) have their votes transferred to A if B is eliminated, preventing C from winning solely due to the split. *This is the "spoiler" RCV kills.*
      *   **IIA Violation is a Different Beast:** Arrow’s IIA demands that *adding or removing a losing candidate* shouldn’t change the winner. RCV famously violates this because the *order of elimination* matters. Introducing a new candidate (X) can change *who gets eliminated first*, altering the vote transfer flow and potentially changing the final winner, even if X never wins. **The practice presupposes that IIA is *not* sacrosanct.** It accepts that the presence of alternatives can reshape the landscape of "broad acceptability" during elimination. The reform pitch isn't *committed* to IIA; it's committed to fixing the *specific, visible, and politically destructive* spoiler effect inherent to Plurality. It presupposes that vote-splitting is a worse flaw than potential IIA violations in practice.

  2.  **"Majority Winner" & The Condorcet Paradox:**
      *   **The Nature of the RCV Majority:** You’ve nailed it. RVT produces a candidate with a *final-round majority of ballots still expressing a preference between the final two*. This presupposes that the *sequence* of eliminations and the resulting vote transfers are a legitimate way to build a majority coalition. It values "last-standing" majority support built through compromise over the theoretical ideal of a Condorcet winner (who beats all others head-to-head).
      *   **Presupposition of Sequential Acceptability:** RCV presupposes that a candidate eliminated early *deserves* elimination because they lacked sufficient *first-choice* support to be viable *at that stage*. The Condorcet winner who gets eliminated early (like Alaska 2022) is seen as failing a crucial test: they weren't *anyone's* top priority, or at least, not *enough* people's top priority to survive the initial cuts. **The collective preference RVT expresses is *path-dependent*:** "We prefer A over B, *given that C, D, E... have already been eliminated and their supporters have moved to their next acceptable choices*." It prioritizes broad *top-tier* support and resilience through elimination rounds over potentially fragmented pairwise dominance.

  3.  **Stable Rankings & Menu Independence:**
      *   **Practical Necessity & Philosophical Commitment:** This is both. Practically, holding an election requires a single, manageable ballot. Asking voters to re-rank after every elimination is logistically impossible. Philosophically, **RCV presupposes that a voter's underlying *ordinal preferences* are fixed and context-independent.** It treats your submitted ranking as your sincere, complete ordering of *all* candidates, valid regardless of who drops out. Your "second choice" is assumed to be the candidate you prefer *most* among the *remaining field*, if your top choice is gone. It rejects the idea that the *set* of alternatives fundamentally changes your *relative* ranking of the others. This is a core commitment of the practice, making it compatible with Arrow's fixed-input framework. It views elections as aggregating pre-formed judgments, not forming them.

  4.  **Runoffs vs. Arrow: Preference Formation vs. Aggregation:**
      *   **A Genuinely Different Picture:** Two-round runoffs (like France) *do* represent a different conception. By allowing voters to reassess and potentially change their vote between rounds, they presuppose that the election process itself is a **dynamic event for preference formation and coalition building.** The campaign *between* rounds matters. Voters might strategically rally around a finalist they dislike less, or new information might emerge. **This is an evasion of Arrow's *specific* formulation** (which assumes fixed inputs), but it's not an evasion of the underlying challenges of social choice. It simply embraces a different model: elections as iterative, potentially preference-shaping events, rather than one-shot snapshots of fixed preferences. RCV, by locking in the ranking, adheres to the snapshot model.

  ### Taking Pairwise Majority Seriously: The Condorcet Ideal

  If we prioritize finding the candidate who beats all others head-to-head (the Condorcet winner), RCV's flaws become glaring bugs. Implementing this seriously requires:

  1.  **Fundamental Ballot Change:** Voters *must* provide a complete ranking (like RCV) to simulate all pairwise matchups.
  2.  **Fundamental Tallying Change:** Instead of sequential elimination, we need to calculate *every possible head-to-head contest* based on the rankings.
  3.  **Handling Cycles (The Core Problem):** When there's no Condorcet winner (A>B, B>C, C>A), pairwise majority hits a wall. Resolving this requires an **additional rule**:
      *   **Ranked Pairs/Condorcet Methods:** "Lock in" the largest majorities that don't create contradictions (e.g., if A>B by 60% is the biggest margin, lock that in; then if B>C by 55% is next biggest and compatible, lock that; then C>A by 52% might be ignored as it contradicts the locked-in order).
      *   **Copeland's Method:** Elect the candidate who wins the *most* pairwise contests.
      *   **Schulze Method:** Find the strongest "beats" paths (A>D>E>B might mean A "indirectly beats" B strongly).
  4.  **Changes in Discourse:** We'd talk about "pairwise dominance," "majority strength," "cycle resolution rules," and "strategic voting to create/manipulate cycles." The focus shifts from "building a majority through elimination" to "proving dominance across all possible matchups."
  5.  **The Trade-off (Feature vs. Bug?):** From a Condorcet perspective, RCV's tendency to eliminate a Condorcet winner early is a **critical bug**. It fails the core criterion. However, proponents of RCV might argue this flaw is a *feature* within *their* presuppositions:
      *   **Stability & Mandate:** A Condorcet winner might have very weak *first-choice* support (e.g., everyone's second choice). RCV presupposes that strong top-choice support is crucial for legitimacy and governing mandate. Eliminating the universally tolerated but unloved candidate early is seen as correct.
      *   **Simplicity & Resistance to Strategy:** Complex Condorcet methods are harder to understand, explain, and audit than RCV's sequential counting. RCV's process is transparent and feels more like a "natural" winnowing to many voters.
      *   **Handling Extremism:** In a polarized field, a moderate Condorcet winner might exist. RCV *might* (not always) favor them over an extremist with strong first-choice backing but poor second-choice appeal. Condorcet methods would reliably elect the moderate. Which is a "feature" depends on whether you prioritize theoretical pairwise fairness or the RCV ideal of broad *active* acceptability built through elimination.

  ### Conclusion: RCV's Coherent (if Contested) Worldview

  RCV presupposes elections are about finding the candidate who can **survive a process of elimination by building a final-round majority through the redistribution of support from less viable candidates.** It prioritizes **broad acceptability** (especially strong first-choice support and decent second-choice appeal) over theoretical ideals like IIA or Condorcet efficiency. It commits to **fixed, menu-independent voter preferences** aggregated in a single, sequential process. While it solves the specific, destructive spoiler effect of Plurality, it embraces its own set of paradoxes (IIA violations, Condorcet inefficiency) as acceptable trade-offs for achieving its core goals of majority support in the final round, encouraging positive campaigning for second choices, and providing a relatively simple, transparent counting process. Its conception of the "will of the voters" is the emergent result of this specific iterative consensus-building mechanism, not an abstract or context-independent truth.
