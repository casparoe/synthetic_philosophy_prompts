prompt: |-
  I'm a fourth-year PhD student in philosophy, and for the third year running I've been handed the second seminar of our department's 'Rationality and Choice' course: 25 students, 75 minutes, mostly second-years, and the room splits almost down the middle between economics/PPE majors and philosophy majors. Last week I gave them expected utility theory, so they are already comfortable taking a utility function over outcomes as given, computing expected utilities, and noticing that their own answers to the Allais and Ellsberg cases don't line up with the theory — which means they use the word 'utility' fluently and have no idea where the numbers come from. Next week I have to do revealed preference: choice first, preference as what choice reveals, utility as a numerical representation of that choice, and then the part I actually care about, which is what the utility numbers mean. My problem is last year's run. They left able to state the weak axiom and able to check it against a two-good example, but with two beliefs perfectly intact underneath: that utility is a technical name for how happy or satisfied an outcome makes someone, and that once we've fitted a utility function to a person's choices we've thereby found out something about their welfare. Both are wrong in ways I can articulate, and I have not managed to make either of them land.

  So what I need is a plan for the session, not a lecture I could deliver. Specifically: the order the pieces have to come in and why — what has to be in place before what, and where, if anywhere, I should bring in the fact that the 'utility' of expected utility theory has to be cardinal (defined only up to positive affine transformation) in a way that utility-as-representation-of-choice is not, given that utility-as-representation is only defined up to any increasing transformation. I genuinely can't tell whether that distinction is the linchpin of the whole session or a distraction that will eat fifteen minutes and lose the room, and I'd like you to say which and why. I also want the one example that should carry everything, with a note on what it must have and what it must not have: the fruit-basket thing I used last year got me the definition and nothing else, and my hypothesis is that apples and oranges are too obviously proxies for some underlying quantity, so students quietly supply the quantity themselves and never notice they've done it. Then the misconception map — for both halves of the room separately, including, I suspect, that this is behaviorism about the mind, that indifference is revealed whenever someone could have chosen either way, and that a larger opportunity set can never make a chooser worse off — together with the point in the sequence where each should be headed off rather than refuted outright. And one question at the end that would let me tell whether the idea has landed instead of been memorized.

  Two more things. Some of these students will be doing cost-benefit analysis for government agencies within two years, putting numbers on lives and commute times, and I want them leaving genuinely uneasy about where those numbers come from without turning into people who think the whole apparatus is worthless because the numbers aren't handed down from heaven; I don't know how to hold those at once, and I'd like the plan to hold them for me. I'd also like you to say what I should openly refuse to get into at this level — I'm assuming Afriat's theorem, the strong axiom, and anything about integrability are out, but tell me if I'm wrong — and, because I have to defend this plan to the course convener on Friday: which piece of your proposed ordering you would abandon if I had to cut ten minutes, and what would change your mind about the ordering (for instance, if you thought the gap between choice and welfare had to come before the representation result, or that the session should be built around a single case rather than a sequence of moves). Be explicit about where your advice is least confident.
reasoning: |-
  Okay, let's tackle this PhD student's problem. They're teaching a seminar on revealed preference theory and need to correct misconceptions about utility. The students confuse utility with happiness or welfare, which is a fundamental error. The challenge is to structure the session effectively.

  First, I need to understand the core issues. Last year, students left still believing utility measures happiness and that fitting a utility function reveals welfare. The assistant must dismantle these ideas. The key is emphasizing that revealed preference is about consistent choices, not psychological states.

  The distinction between cardinal and ordinal utility is crucial here. Expected utility theory requires cardinal utility (unique up to affine transformations), while revealed preference only needs ordinal (any increasing transformation). But how to present this without losing the class? Maybe introduce it when explaining why choice data doesn't pin down a unique utility function. Use a simple example with different transformations to show multiple functions represent the same choices.

  For the main example, avoid fruit baskets like apples and oranges. These imply an underlying quantity like nutrition, which students might subconsciously reference. Instead, use abstract options: three colored boxes (A, B, C) with no intrinsic value. Present choice scenarios: A chosen over B, B over C, and then A chosen when all three are available. Ask what happens if C is chosen over A? This violates WARP, showing inconsistency without invoking any hidden attributes.

  Tackle misconceptions directly. For philosophy students, the behaviorism worry: clarify that revealed preference doesn't deny internal states but focuses on observable choices. For economics students, indifference isn't just "could have chosen"; it requires actual choices under different sets. Also, larger sets can make someone worse off if they choose poorly due to indecision or temptation.

  The welfare gap is critical. Emphasize that revealed preference doesn't equate to welfare. Use an example: choosing junk food over salad consistently. The utility function represents this choice, but it doesn't mean junk food is better for health. Policy implications: cost-benefit analysis numbers reflect choices, not intrinsic welfare. This should make future analysts uneasy but not dismissive.

  Structure the session: start with choice data and WARP, build to utility representation, then discuss meaning. The cardinal/ordinal point comes when explaining why utility functions aren't unique. Use the box example throughout. End with the junk food vs. salad case to highlight the welfare distinction.

  If cutting ten minutes, skip the detailed transformation math. Focus on the intuition that multiple scales work, but welfare claims need more. The key is that choices don't reveal why something is preferred, just that it is.

  Finally, check understanding with a question: "If we fit a utility function to choices, does a higher number mean the person is better off?" Correct answer is no; it only means it's chosen in pairwise comparisons. This tests if they separate choice from welfare.
answer: |-
  Here’s a battle-tested plan focused on **exposing the gap between choice and welfare** while preserving technical rigor. The core insight: **Revealed preference constructs a numerical "map" of behavior—not a measure of happiness or welfare.** The session hinges on making this distinction visceral.

  ---

  ### **Session Structure (75min)**
  **Goal:** Students leave seeing utility as a *choice-representation tool* decoupled from welfare, yet grasp its policy necessity.  
  **Non-Goal:** Cardinal/ordinal distinctions (handled via *implication*, not explicit math).

  | Time | Phase               | Key Moves & Rationale                                                                 |
  |------|---------------------|---------------------------------------------------------------------------------------|
  | 0-5  | **Hook: The Welfare Illusion** | Show *identical choices* from two people: one calm, one addicted. Ask: *"Do these choices reflect the same 'wellbeing'?"* Forces early doubt about equating choice/welfare. |
  | 5-20 | **Choice → Preference**        | Define **choice rule** (C) over sets. Derive **preference relation (≿)** via: *x ≿ y iff x chosen when y available*. **Crucial demo**: Show choice of A over B *alone* doesn’t prove A≻B—it could be indifference! Requires observing choices in *multiple* sets. |
  | 20-35| **Preference → Utility**       | **Example: Abstract Boxes** (A,B,C). Data: C({A,B}) = A; C({B,C}) = B; C({A,C}) = C. *Violates WARP!* Fix with consistent data → build utility U(A)=3, U(B)=2, U(C)=1. **Emphasize**: U is *constructed* to *match choices*—no "happiness meter." |
  | 35-50| **Meaning of Utility Numbers** | **Transformation demo**: Show U'(A)=100, U'(B)=50, U'(C)=0. Same choices? Yes. *Then*: "Can we say A gives 3x happiness of C?" → **NO**. **Key move**: Contrast with EU’s cardinality (remind: affine transforms matter for risk). Here, *any* order-preserving numbers work. |
  | 50-65| **The Welfare Gap & Policy**   | **Case Study: Junk Food Addict**: Chooses junk food (J) over salad (S) always. U(J)=2, U(S)=1 fits. Ask: *"Should a policymaker use this U to value health benefits?"* Discuss: Choices ≠ welfare (regret, addiction, ignorance). **Punchline**: *We use revealed preference in policy **not** because it’s "true welfare," but because it’s observable when welfare isn’t.* |
  | 65-75| **Q&A + Diagnostic Question**  | **Diagnostic**: *"If we fit U to your choices over {career A, career B}, does U(A)>U(B) mean A makes you happier?"* <br> **Correct answer**: No—it means you’d choose A when B is available. Why you choose it (happiness, duty, delusion) is outside the model. |

  ---

  ### **Why This Order?**
  1. **Welfare illusion first**: Sabotages the "utility=happiness" reflex early.  
  2. **Abstract boxes example**: No proxies for hidden attributes (unlike fruit). Forces focus on *choice logic*.  
  3. **Cardinal/ordinal via implication**: Avoiding affine vs. monotonic transforms math. Instead: *"EU needs specific scales for risk; this doesn’t—any numbers preserving order work."*  
  4. **Junk food case**: Makes welfare gap undeniable for policy applications. Students *feel* the unease.  

  ---

  ### **Misconception Map & Preemption**
  | Misconception                          | Preemption Strategy                                                                 |
  |----------------------------------------|-------------------------------------------------------------------------------------|
  | **Utility = Happiness** (Both groups)  | Hook (addict vs. calm) + Junk Food case + Diagnostic Q. *"Utility measures ‘choice-worthiness,’ not happiness."* |
  | **Indifference = 'Could have chosen'** | Stress: Indifference requires *actual choice reversals* under set changes. Demo with choices in {A,B} vs. {A,B,C}. |
  | **Larger sets can’t hurt**             | Later topic (not here). Briefly: *"Wait for Sen’s paradox next week!"*              |
  | **"This is behaviorism!"** (Philos)   | *"We’re not denying inner states—we’re saying choices **alone** don’t reveal them."* |
  | **"Revealed U is welfare"** (Econ/PPE)| Junk Food policy case. *"Cost-benefit uses revealed U **faute de mieux**—it’s flawed but actionable."* |

  ---

  ### **What to Cut & Why**
  - **If -10min needed**: **Skip transformation demo** (Phase 4). Replace with: *"In EU, utility scale matters for risk calculations. Here, it doesn’t—we only care about order. So U=3,2,1 vs. U=100,50,0 imply identical choices."*  
  - **Why cut this?** The policy case (Phase 5) is non-negotiable for inducing "uneasy but not dismissive." Math details can be absorbed later; the welfare gap can’t.  

  ---

  ### **Least Confident Advice**
  **Cardinal/ordinal distinction**: I’m 80% confident it should be *implicit* (via examples) not explicit. If your students crave formalism, add a 5min slide:  
  > *EU: U and aU+b represent same preferences (affine). Revealed pref: U and f(U) work if f is strictly increasing (monotonic).*  

  But warn: This risks losing philosophers. If you suspect they’ll tolerate it, do it **after** the junk food example (anchor in intuition first).  

  ---

  ### **Defending to Your Convener**
  **Core argument**: "This plan makes the **policy stakes** of the welfare gap unavoidable. Students will see revealed preference as essential but ethically fraught—exactly what future CBA practitioners need. Cutting formalism preserves time for the conceptual bomb: *choice ≠ welfare*."  

  **If challenged on ordering**: Welfare *must* come after building U from choice. Otherwise, students lack the "tool" they’re tempted to misapply. The single case (junk food) *is* the backbone—it links WARP, utility construction, and policy limits.  

  **Final note**: Your unease about cost-benefit analysis is the session’s secret weapon. Channel it. The best outcome isn’t "they understand WARP"—it’s "they sweat when assigning dollar values to human lives."  

  ---  
  *This plan turns the room’s split into an asset: Philosophers dissect the welfare fiction; economists grapple with real-world application. The tension is the point.*
