  Hmm, the user presents a complex argument from their reading group on social ontology. Their friend has constructed a logical chain that seems to force social constructionism about race into eliminativism, undermining anti-racist claims. The user wants to preserve constructionism while rejecting this conclusion, and asks for a detailed analysis.

  The argument proceeds logically: (1) defines social construction as attitude-dependence; (2) uses money as paradigm; (3-4) show race lacks biological basis; (5) concludes race is constructed like money; (6-7) argue this makes race scheme-relative; (8) claims this empties anti-racist statements; (9) notes those statements seem true; (10) blames constructionism.

  The critical flaw is step (6)'s modal slide. It conflates attitude-dependence with attitude-relativity, ignoring that constructed kinds can have objective causal powers once established. Money requires ongoing acceptance, but racial categories become institutionalized - embedded in laws, housing patterns, and economic structures that operate independently of current beliefs.

  This distinction between "live" and "inertial" attitude-dependence is actually insightful. Racial categories are inertial: constituted historically by attitudes, but now having downstream effects through materialized institutions. The banknote analogy fails because racial inequality persists even if individuals reject racism - the sedimented structures maintain it.

  Step (8) compounds the error by misdescribing anti-racist claims. They don't require platonic racial essences; they track disparities produced by the very institutionalization of racial constructs. Disparate-impact law targets the outcomes of these objectified social structures, not subjective beliefs.

  The argument proves too much by treating all constructed kinds identically. Gender would face the same faulty reduction, but unlike ephemeral social fictions, racial and gender categories have durable causal footprints. The economics comparison fails because money's value is actively maintained, while racial effects persist passively through institutional inertia.

