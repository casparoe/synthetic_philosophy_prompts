  ### Part 1: The Break and Costs  
  The argument breaks at **step (6)**, which falsely equates attitude-dependence with attitude-relativity. Step (6) claims that if a kind depends on attitudes for its existence, then there is "no attitude-independent fact" about its membership—implying radical relativity where truths vanish without active endorsement. This conflates *constitutive* dependence (attitudes create the kind) with *ongoing epistemic* dependence (attitudes continually verify membership). Money requires live acceptance (collapse consensus, and the banknote loses value), but racial categories are **inertially constructed**: attitudes historically sediment into institutions (laws, housing, facial recognition datasets) that rigidly enforce membership *independently* of current beliefs. A Black defendant’s sentencing disparity isn’t "empty" because classifiers in 2024 might privately reject race—it’s grounded in court records, policing algorithms, and redlining maps that objectify historical attitudes.  

  Step (6) *looked acceptable* because money’s live dependence (where value vanishes if acceptance lapses) primes us to assume all constructed kinds are equally ephemeral. But racial categories, once institutionalized, become causally robust social facts.  

  **Cheapest alternatives to reject:**  
  - **Reject step (6)** (cost: must refine constructionism to distinguish live/inertial dependence; biological realists dislike this but constructionists accept it).  
  - **Reject step (8)** (cost: admit anti-racist claims *are* scheme-relative but deny this empties them—e.g., "disparate impact exists *within* the U.S. racial scheme"; eliminativists reject this as incoherent).  
  - **Reinterpret step (5)** (cost: say race *is* constructed, but *not* identically to money; constitutive constructionists accept this, but must clarify the difference).  

