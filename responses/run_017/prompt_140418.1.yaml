answer: |-
  ### Brainstormed Candidate Demands for a Theory of Vagueness  
  *(Initial list before winnowing)*  
  1. **Solve the Sorites Paradox**  
     - *Motivation:* Paradox exposes core tension between tolerance (small changes don’t affect category membership) and sharp boundaries.  
     - *Regulatory case:* "Significant delay" in transportation: adding 1 second shouldn’t matter, but eventually 10 hours does.  

  2. **Handle Non-Sorites Borderline Cases**  
     - *Motivation:* Many regulatory terms (e.g., "reasonable effort") lack linear scales.  
     - *Example:* Is a cryptocurrency exchange a "financial institution"?  

  3. **Distinguish Vagueness from Neighbors**  
     - *Motivation:* Inspectors conflate vagueness with ambiguity (e.g., "bank" river/finance) or context-sensitivity (e.g., "tall" for buildings vs. children).  

  4. **Explain Boundary Unknowability & Higher-Order Vagueness**  
     - *Motivation:* No inspector can pinpoint when "excessive concentration" begins, and the "borderline zone" itself has blurry edges.  

  5. **Resolve Faultless Disagreement**  
     - *Motivation:* Two inspectors call the same pollution level "excessive"/"acceptable" without error.  

  6. **Cover Measurement-Inherited vs. Intrinsic Vagueness**  
     - *Motivation:* "Significant delay" might be precisified by clocks; "cruel punishment" cannot.  

  7. **Account for Voluntary Sharpening**  
     - *Motivation:* An inspector declares, "For this investigation, ‘significant delay’ means >30 min," resolving indeterminacy.  

  8. **Provide Normative Guidance for Borderline Cases**  
     - *Motivation:* What *should* an inspector do when a case is neither clear nor clearly unclear?  

  9. **Explain Linguistic Competence**  
     - *Motivation:* How do speakers master vague terms if boundaries are unknowable?  

  10. **Preserve Classical Logic Where Possible**  
      - *Motivation:* Regulatory systems rely on binary decisions (violation/no violation).  

  11. **Compatibility with Communicative Function**  
      - *Motivation:* Vague terms succeed in guiding action despite indeterminacy.  

  12. **Address Higher-Order Vagueness Ad Infinitum**  
      - *Motivation:* If borderline cases have borderline cases, where does it end?  

  ---

  ### Winnowed Specification of Non-Negotiables vs. Negotiable  
  *(Final demands tailored to regulatory purpose)*  

  | **Demand** | **Motivating Case** | **Non-Negotiable?** | **Reason** |
  |------------|---------------------|---------------------|------------|
  | **1. Sorites Solution** | "Significant delay": Why can’t we tolerate +1 second indefinitely? Must explain why premises *seem* true but conclusion is false. | **Yes** | Core test of any vagueness theory. Without it, the paradox invalidates regulatory categories. |
  | **2. Non-Sorites Borderlines** | Inspector asks if a novel AI-driven contract is a "legal agreement." No linear dimension to generate sorites. | **Yes** | Most regulatory vagueness lacks gradable structure (e.g., "fair competition"). |
  | **3. Vagueness Diagnostic** | Is "heavy metal" in pollution rules vague (no sharp boundary) or ambiguous (referring to Pb/Hg vs. rock music)? Must separate vagueness from context-sensitivity ("near" a school) or ignorance (exact toxicity unknown). *Permit lumping*: Vagueness and higher-order vagueness. | **Yes** | Misdiagnosis leads to flawed enforcement (e.g., treating ignorance as vagueness). |
  | **4. Boundary Unknowability & Blurry Borders** | Inspector knows "excessive noise" but cannot define decibel thresholds, and cannot identify when uncertainty begins. | **Yes** | Central to vagueness; sharp boundaries would imply precise rules exist. |
  | **5. Faultless Disagreement** | Inspector A says 45 dB is "excessive noise" for a library; B disagrees. Neither is incompetent. | **No** | Desirable but not essential. Regulatory systems often require decisive action; faultless disagreement may reflect permissible context-dependence. |
  | **6. Measurement-Inherited vs. Intrinsic Vagueness** | "Excessive wait time" (measurable) vs. "undue hardship" (not measurable). Must cover both. | **Yes** | Regulatory language mixes both (e.g., "significant risk" may be quantifiable or not). Cost: Theory must be flexible, not tied to degrees or epistemic limits alone. |
  | **7. Voluntary Sharpening** | Inspector stipulates: "For this factory, 'excessive emissions' means >10μg/m³." | **Yes** | Essential for regulatory pragmatism; inspectors *must* precisify to act. |
  | **8. Normative Guidance for Borderlines** | Inspector faces a pollution level that is neither clearly "excessive" nor clearly acceptable. What *ought* they do? | **Yes** | Primary practical need. Theory must advise action, not just describe semantics. |
  | **12. Higher-Order Vagueness** | Borderline cases of "borderline excessive noise" exist, creating regress. | **No** | Important but negotiable; a theory may address first-order vagueness sufficiently for enforcement. |

  **Subtracted**:  
  - *Demand 9 (Linguistic Competence)*: Secondary to application.  
  - *Demand 10 (Classical Logic)*: Regulatory decisions are binary, but semantics need not be.  
  - *Demand 11 (Communicative Function)*: Implied by successful rule application.  

  ---

  ### Conflicts and Trade-offs  
  **Conflict**: Demands 4 (Boundary Unknowability) and 8 (Normative Guidance) clash with 7 (Voluntary Sharpening). If boundaries are unknowable *in principle*, how can sharpening be legitimate?  
  - **Resolution**: Sacrifice *strict unknowability* (Demand 4) for Demand 7. **Concession**: Allow that boundaries can be *pragmatically fixed* without existing antecedently. This buys actionable precision for inspectors.  

  **Most Excluding Demand**: **Non-Sorites Borderlines** (Demand 2). Theories relying on degrees (e.g., fuzzy logic) or sorites-focused solutions (e.g., epistemicism) fail for non-gradient predicates like "is a game."  

  ---

  ### Theories vs. Non-Negotiables  
  1. **Ignorance View (Epistemicism)**:  
     - *Sorites*: ✔️ (Failure due to ignorance of sharp cutoffs).  
     - *Non-Sorites Borderlines*: ❌ (Assumes all vagueness has sharp boundaries, even for non-gradient terms).  
     - *Boundary Unknowability*: ✔️ (Cutoffs exist but are unknowable).  
     - *Normative Guidance*: ❌ (No advice beyond "find the hidden fact").  

  2. **Supervaluationism**:  
     - *Sorites*: ✔️ (Vague predicates true/false in all precisifications; tolerance fails).  
     - *Non-Sorites Borderlines*: ✔️ (Applies to multidimensional cases via admissible precisifications).  
     - *Voluntary Sharpening*: ✔️ (Stipulation selects one precisification).  
     - *Normative Guidance*: ⚠️ (In borderline cases, no fact of the matter – but inspectors must still act).  

  3. **Degree/Contextualist (e.g., Fuzzy Logic, Contextualism)**:  
     - *Sorites*: ✔️/❌ (Degrees block sorites but violate classical logic; contextualism explains tolerance).  
     - *Measurement-Inherited Vagueness*: ✔️ (Degrees model measurable vagueness).  
     - *Intrinsic Vagueness*: ❌ (Fails for non-scalar terms like "art").  
     - *Normative Guidance*: ⚠️ (Contextualism allows sharpening; degrees may not guide action).  

  **Final Assessment**: Supervaluationism best satisfies non-negotiables but struggles with normative guidance in true borderlines; contextualism excels at voluntary sharpening but falters on non-sorites cases. A hybrid theory may be needed for regulatory pragmatism.  

  ---
  *Specification distilled: A theory must resolve the sorites and non-sorites indeterminacy, separate vagueness from ambiguity/ignorance, explain boundary obscurity while enabling sharpening, and guide inspectors to act reasonably in borderline zones—even if perfect semantic precision is unattainable.*
