prompt: |-
  My friend Dana is one of those hard-core "do whatever makes the world best overall" people, and I've started writing down what she actually says about real cases, because I can't work out what rule she's running. Her verdicts so far:

  - Voting: she does it, but only because it costs almost nothing — she says the chance of mattering is basically zero, so it's a free shot at a good outcome.
  - Giving to the malaria bednet charity: she gives about a tenth of her income and says it's about the clearest good purchase available to a normal person.
  - Donating to or volunteering for a national campaign for a policy she thinks is net-good: no. She says a change that big has knock-on effects nobody can predict, and those will totally swamp whatever the campaign is aiming at.
  - Giving to the "protect the far future / reduce extinction risk" funds: also no. Her line is that the further out you go, the more our guesses are worth approximately nothing.
  - Having a kid: she says it's fine, and not having one is fine too, and that anyone who tells you the very-long-run consequences settle the question is kidding themselves.
  - Being harsh to your child on the theory that it'll make them driven and successful later: she thinks that's obviously wrong, and isn't moved by "but you can't prove the long-run effect is bad."
  - Tiny actions that could in principle butterfly into something enormous: she doesn't care at all. She once joked that holding a door open for a stranger might rearrange the next eighty years.

  New case, and this one actually matters because she's in it. Dana works in a materials lab. For essentially no cost to herself she can do one small favour that will very likely get a cheap clean-energy technology onto the market roughly two years earlier than it otherwise would. The near-term effects look clearly and substantially good — less air pollution, cheaper power, all the stuff she already thinks is good. The long-run effects are the usual fog: which technologies end up mattering, who gets rich, whether some war happens earlier or later. She can't get any grip on the sign of those, and she knows it.

  So: what does she do? I care less about the bare yes/no than about the rest of it. What rules fit all seven of her earlier verdicts at once; what does each of those rules say about the lab case; which is your best guess and why; and what one further case would you put to her to separate whichever rules your best guess still leaves tied?

  I've also been playing with a rule of my own: only count what happens to people who are already alive, and treat effects on people who don't exist yet as zero. Tell me whether that fits her track record, or whether one of her verdicts kills it.

  Keep the whole thing under 600 words and skip the preamble.
reasoning: |-
  Okay, the user has presented a fascinating puzzle about their friend Dana's ethical decision-making framework. Dana seems to operate on a very specific set of principles that reject both long-term speculation and pure short-termism. 

  First, I need to analyze Dana's seven existing verdicts to identify patterns. Her voting position shows she values minimal-cost interventions with potential upside. The bednet charity endorsement reveals she trusts clear, evidence-based near-term impacts. But she rejects national campaigns and future-fund donations due to unpredictable ripple effects - this suggests a strong aversion to actions where secondary consequences dominate primary effects. 

  The parenting positions are particularly telling. Her neutrality on having children and rejection of harsh parenting theories both indicate skepticism about long-term outcome predictions. The door-holding joke confirms she dismisses butterfly-effect reasoning entirely.

  Now for the lab case: a near-costless action with clear near-term benefits but unpredictable long-term effects. This feels like a collision between her bednet logic (clear immediate good) and her campaign-donation logic (unpredictable cascading consequences). 

  I see two plausible core principles emerging:
  1) Only consider effects on currently living people
  2) Only consider direct effects within some time horizon

  The "existing people" rule fits most cases but falters on the harsh parenting example - if only currently living people matter, harsh parenting might be justifiable if it benefits the parent. But Dana rejects this, implying she does consider the child's future wellbeing. 

  The "direct effects" principle seems stronger. It explains why she dismisses butterfly effects (too indirect) and national campaigns (indirect effects dominate). For the lab case, this would mean approving the action since the clean energy benefits are direct and near-term, while the geopolitical consequences are indirect and speculative.

  To test these principles, I'd propose a case involving near-term harm to existing people with unpredictable long-term benefits - perhaps "Should a doctor withhold a painful but life-saving treatment from a terminally ill patient based on vague theories it might spur medical breakthroughs?" Both principles would reject this, but for different reasons.

  The user's proposed "only existing people" rule fails Dana's harsh parenting test. Dana clearly considers the child's future suffering even though the child currently exists. This suggests her cutoff isn't existential status but predictability horizon.

  Word count is tight - need to trim examples while keeping the reasoning clear. The lab case conclusion should emphasize that under the direct-effects principle, Dana would approve because the clean energy benefits are direct and measurable.
answer: |-
  **Fitting Rules:**  
  Two principles explain all seven verdicts:  

  1.  **Direct Effects & Near-Term Certainty:** Prioritize actions with *direct*, *predictable*, and *near-term* positive impacts. Ignore effects that are indirect, speculative, or occur beyond a foreseeable horizon where prediction reliability collapses.  
  2.  **Negligible Cost Leverage:** When personal cost is near zero, act on even tiny chances for near-term good, but *only* if the primary effect is clear and direct.  

  **How the Rules Fit:**  
  *   **Voting:** Near-zero cost, tiny *direct* chance of a near-term good outcome (your vote deciding). Ignores butterfly effects.  
  *   **Bednets:** Low cost, extremely *direct* link, high certainty of near-term (lives saved now) good impact.  
  *   **National Campaigns:** Effects are massive but *indirect* (policy changes triggering complex chains). Predictability fails; knock-ons swamp the direct aim.  
  *   **Far Future Funds:** Impacts are inherently speculative and *indirect* over vast timescales. Predictability is near zero.  
  *   **Having a Kid:** Both choices have profound, inherently *indirect* and unpredictable long-term consequences. No clear near-term/direct calculus settles it.  
  *   **Harsh Parenting:** The *direct* near-term harm to the *existing* child is clear and certain. Speculative long-term "benefits" are discounted as unreliable.  
  *   **Butterfly Effects:** All effects are maximally *indirect* and speculative. Predictability is zero; they don't register.  

  **The Lab Case:**  
  *   **Near-Term Effects:** Clear, direct, substantial good (cleaner air, cheaper power now).  
  *   **Long-Run Effects:** Indirect, speculative, unpredictable fog.  
  *   **Cost:** Negligible to her.  
  *   **Verdict (Under Rules):** **She does the favour.**  
      *   The rule demands action: Near-zero cost + clear, direct, near-term good impact. The unpredictable long-run indirect effects are rightly ignored, just like butterfly effects or campaign knock-ons. It aligns perfectly with bednets and voting logic – a clear, direct good achievable at minimal cost.  

  **Best Guess:**  
  The **Direct Effects & Near-Term Certainty** rule is the strongest fit. It cleanly explains her rejection of national campaigns (indirect), far future funds (indirect/speculative), butterfly effects (indirect/speculative), and harsh parenting (direct harm outweighs speculative benefit), while justifying voting (direct chance) and bednets (direct good). The lab case is a direct near-term good.  

  **Test Case to Separate Rules:**  
  "*Should a doctor intentionally infect a terminally ill, consenting patient (expected to die in days) with a rare, non-lethal virus? Near-term: Causes mild suffering to the existing patient. But it offers a tiny, direct chance (<1%) scientists in the *next week* could learn something crucial to cure a *different* disease affecting millions alive today.*"  

  *   **Why it Separates:**  
      *   **Direct Harm:** Clear, near-term harm to an existing person.  
      *   **Direct Potential Good:** A small but *direct* and *near-term* (next week) chance to save existing lives.  
      *   **No Speculative Long-Term:** Focuses purely on impacts to *existing* people within days/weeks.  
  *   **Prediction:** Dana likely says **No**. The *direct*, *certain* near-term harm outweighs the small *chance* of a near-term good, even for existing people. This reinforces the "Direct Effects & Near-Term Certainty" rule, prioritizing avoiding clear near-term harm over small chances of near-term good when harm is direct and certain. The "Only Existing People" rule might weakly lean towards "Yes" due to the potential good for existing people, but her aversion to clear harm suggests she wouldn't.  

  **Your Rule ("Only Existing People"):**  
  **It fails the Harsh Parenting verdict.** If only effects on people alive *now* mattered, Dana couldn't object to harsh parenting based on the child's *future* suffering – the future adult isn't "existing" at the time of the action. But she *does* object, implying she considers the predictable future impact on the *existing* child's future self. Her rule cares about predictable near-term/direct impacts, regardless of whether the beneficiary exists *at the moment of action*.
