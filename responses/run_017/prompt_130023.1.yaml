answer: |-
  Here is a ghazal meeting your specifications, designed to crystallize the seminar's core tensions through varied contexts and the final couplet's exposure of the contextualism/IRI divide:

  **Ghazal for Knowing**

  A coin for coffee, Saturday’s the day she’ll pay,
  No sweat, no strain, just ask her what to say: *She knows the bank is open Saturday.*

  Her rent, the doctor’s bill, the debt must be delayed,
  Life hangs upon the hours she can sway: *She knows the bank is open Saturday.*

  Her friend trusts wholly, risks a home, must not betray,
  While *she* feels nothing, calm amidst the fray: *She knows the bank is open Saturday.*

  The wager placed, the odds were long, a gambler’s play,
  Now fortune rests upon the words conveyed: *She knows the bank is open Saturday.*

  To claim it true on whispers, risks a soul’s dismay,
  Belief held lightly steals a trust away: *She knows the bank is open Saturday.*

  Though *hers* are trifles, coins like spare change on display,
  *We* stake our home upon that flat relay;
  The doubt now *ours*, a heavy price to pay: *She knows the bank is open Saturday.*
  — **ezra**

  **Philosophical Work & Last Couplet Exposure:**

  1.  **Formal Features Doing Work:**
      *   **Self-contained Couplets/Independent Occasions:** Each couplet isolates a distinct *context* (stakes configuration) affecting the truth/significance of the knowledge attribution, mirroring how contextualism and IRI analyze knowledge claims relative to specific situations.
      *   **Refrain ("She knows the bank is open Saturday"):** Its unchanging wording forces the question: does this *sentence* express the *same proposition* with the *same truth value* in each context? The poem's variation answers implicitly: no, the *meaning* or *truth conditions* shift.
      *   **Naming ("ezra"):** The final signature isn't just convention; it explicitly marks the shift to the *attributor's* context in the last couplet, crucial for exposing the theories' divergence.

  2.  **Contextual Variation (Matching Couplets to Scenarios):**
      *   **Couplet 1:** Trivial stakes (coffee change). Low threshold for "knows" plausibly met.
      *   **Couplet 2:** Grave stakes for the subject (rent, bills, life). Pragmatic encroachment/IRI suggests higher threshold, may not know.
      *   **Couplet 3:** Stakes entirely on third party (friend risks home), subject's stakes nil. IRI (subject-sensitive) says she *can* know; contextualism (attributor-sensitive if friend is attributor?) may vary.
      *   **Couplet 4:** Stakes manufactured by subject (bet). Clear case for pragmatic encroachment/IRI: stakes raise the threshold for her knowledge.
      *   **Couplet 5:** Moral stakes (thin evidence wrongs someone). Highlights the *type* of practical factor (moral failing vs. prudential risk) affecting the epistemic assessment.

  3.  **The Exposure in the Final Couplet:**
      *   **Subject's Context:** Explicitly trivial ("trifles, coins like spare change"). IRI (subject-sensitive invariantism) dictates a *low* threshold for her knowledge. She plausibly *does* know here.
      *   **Attributor's Context (ezra/We):** Explicitly high stakes ("stake our home," "heavy price"). Contextualism (attributor-sensitive) raises the semantic standards for "knows" *in the attributor's context*. The *sentence* "She knows..." uttered *by ezra* in *this* high-stakes context may express a false proposition (requiring evidence/metajustification ezra lacks), even if the subject, in her low-stakes context, meets her own lower standard.
      *   **The Divergence:** This is the bank cases' crux. IRI says the subject *knows* (low subject-stakes). Contextualism says the *attributor's claim* "She knows" might be *false* (high attributor-stakes raising the standard), even if the subject is in a good epistemic position *by her own standards*. The poem ends precisely on this unresolved tension: the same words are uttered ("She knows..."), but contextualism and IRI deliver different verdicts on their truth *because of the attributor's practical situation*.

  The ghazal form, with its insistent, unchanging refrain set against shifting contexts, perfectly embodies the central question of the seminar: what *remains* and what *shifts* when we say "S knows that p"? The final couplet leaves the listener suspended in the disagreement between the theories, pondering the weight of the attributor's own stakes on the very claim they make about another's mind.
