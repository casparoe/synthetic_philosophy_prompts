prompt: |-
  You're a professional philosopher of mind who actually works on implementation, levels, and higher-level causation. Please think carefully and don't just jump to an answer: start by brainstorming, and write out at least four candidate rules explicitly before you commit to any of them. Also, don't tell me what to read or who to cite — no bibliographies, no reading lists, I want your own reconstruction of what's going on.

  Background: my friend Dev restores pinball machines and has Opinions. Since my dad had a stroke in April I've been reading about brains and substrates way more than is healthy, and Dev is the person I end up shouting with about it, to the point that its basically a running bet now. The thing we keep circling is that old Hofstadter setup: a big frictionless table — the "careenium" — with a vast number of tiny magnetic marbles careening around on it, the walls getting more or less bouncy depending on what's happening outside the box, and the marbles clumping into bigger structures that hang together and knock each other around. Zoomed out you see symbols; zoomed in you just see marbles. Dev's question is always the same one: in a given setup, do the symbols actually shove the substrate around, or is that just a way of talking about marbles pushing marbles?

  His verdicts so far, which he's been irritatingly consistent about:

  1. Hofstadter's own table, walls driven by the outside world, clumps forming and interacting. YES, obviously, he says, that's the whole point.
  2. The same table frozen: marbles superglued mid-bounce into an arrangement that reads like a sentence. NO.
  3. A recording table: clumps form a perfect diary of what the walls did, but nothing anywhere is ever sensitive to the diary. NO. His line is that a symbol nothing reads is just weather.
  4. A rock, plus a thick manual mapping its microstates onto symbol states and their transitions. NO, and he gets a bit offended — you can do that to anything.
  5. A room with a guy shuffling paper slips according to a rulebook, with no idea what any of it means. YES — the slips shove him around whether or not he understands a word.
  6. A clerk with a giant printed book of every addition problem and its answer, who looks up the answer and writes it down. YES — and this is the one I keep coming back to, because the book is completely passive and the clerk is outside it, and he still says the symbols are doing the shoving.
  7. A laptop simulating case 1. YES, though he gets hand-wavy about the substrate not mattering.
  8. Six seconds of turbulence in a pipe whose coarse-grained states happen, exactly once, to line up with the transition table of some algebra, and never again. NO. Once is a coincidence, not a level.

  He also flat out refuses the intervention test — you can't change the symbol without changing the marbles, so questions of the form "what if you wiggled the symbol while holding the substrate fixed" don't have answers, in his view. So don't build your answer on that.

  Here's the new case, and it's mine, which is why I care. I'm in a lab doing physical reservoir computing: a wave tank, about 60 cm, with a paddle at one end driven by the input signal, an overhead camera reading the surface height at around a hundred points, and a laptop applying a trained linear readout to produce the answer. Nothing goes back the other way — the output never touches the water. Things I can tell you about it: the coarse wave patterns really do interact (packets reflect off the walls, interfere, form standing structures that persist), and from a coarse snapshot you can predict the next coarse snapshot well without tracking anything like the underlying molecules. It's robust in the sense that a small poke doesn't destroy the coarse story. Retraining the readout for a completely different task changes nothing whatsoever in the water. There's also a feedback path that would feed the readout back into the paddle; it's broken right now, fixing it is roughly a week of work, I have a workshop deadline, and my supervisor has started calling the rig a lookup table in a wet costume. Dev hasn't ruled on the feedback version.

  So: what's Dev going to say — do the wave patterns shove the water around, or not? But I care much less about the yes or no than about the rule he's actually running. Write out the rules his eight verdicts are jointly compatible with, say what each predicts about the tank, give me your best guess at which one he's on with the reasons for preferring it, and then tell me the single variant — a change to the tank, or a new case — that would best separate your top two, ideally something I could actually build in a week. If you think his precedents genuinely don't reach this far, say so, and tell me what he'd be committing to with each answer.
reasoning: |-
  Okay, I need to tackle this user's query step by step. They're asking about whether wave patterns in their physical reservoir computing setup "shove" the water around, similar to Dev's previous verdicts on various systems. But more importantly, they want to understand the underlying rule Dev uses to make these judgments.

  First, I should start by brainstorming candidate rules that fit Dev's eight verdicts. Let me list those again to identify patterns:

  1. Hofstadter's table: YES  
  2. Frozen table: NO  
  3. Recording table: NO  
  4. Rock with manual: NO  
  5. Rule-following clerk: YES  
  6. Lookup clerk: YES  
  7. Laptop simulation: YES  
  8. Turbulence coincidence: NO  

  Key themes: Dev seems to require that symbols aren't just patterns but have causal influence. The intervention test is rejected, so the rule must avoid counterfactuals about changing symbols independently of substrate. Instead, it likely focuses on actual dynamics and dependencies.

  Brainstorming candidate rules:

  1. **Pattern Dynamics Rule**: Symbols must be patterns whose internal dynamics govern substrate changes over time. This fits cases 1 and 5, where patterns actively interact. It excludes frozen and recording tables (2,3) where patterns are static or passive. The lookup clerk (6) passes because the book's state determines the clerk's action, showing pattern-level dependency.

  2. **Pattern-Level Causation Rule**: The system's future coarse states must depend on its past coarse states in a way that isn't reducible to microstate tracking. This emphasizes higher-level predictability. Cases 1,5,6,7 all show this—coarse states predict outcomes without fine details. The turbulence case (8) fails because it's a one-off coincidence. The rock (4) lacks any real state transitions driven by symbols.

  3. **Substrate Independence of Function Rule**: The causal role of symbols must persist across substrate changes, as long as the pattern dynamics are preserved. This is hinted at in Dev accepting the laptop simulation (7). It would exclude the rock (4) since the manual isn't part of the system's operation. The lookup clerk (6) works because the book's state directly causes the output, regardless of the clerk's understanding.

  4. **Closed Causal Loop Rule**: Symbols must both cause and be caused by substrate changes in a feedback loop. This seems strong for case 1 and possibly the clerk, but the lookup clerk (6) has no feedback—the book doesn't change based on output. Yet Dev says YES, so this might be too strict. The wave tank without feedback might fail here, but with feedback, it could pass.

  Evaluating the wave tank cases:

  - Without feedback: Coarse patterns predict future states, but the output doesn't affect the water. Similar to the recording table (3), which got a NO. The patterns are "read" but not "written" by the system.  
  - With feedback: Output influences the paddle, creating a loop. Now patterns could be seen as actively maintained, like in Hofstadter's table (1).  

  Matching to Dev's likely rule: The Pattern Dynamics Rule seems strongest. It explains why the lookup clerk (6) is a YES—the book's state (symbol) directly determines the clerk's action (substrate change). In the wave tank without feedback, patterns aren't directing changes; they're just being read. So Dev would probably say NO.  

  Best test case: Add feedback. If Dev says YES with feedback, it confirms the importance of closed loops. If he still says NO, other factors like substrate independence might matter more.  

  User's deeper needs: They're frustrated with their supervisor dismissing the setup. Understanding Dev's rule could help them argue for the system's sophistication, especially after adding feedback. They also want validation that their work has meaningful symbolic dynamics, not just a lookup table.
answer: |-
  Based on Dev's eight verdicts and his rejection of interventionism, I've reconstructed his underlying reasoning through a process of elimination. After brainstorming four candidate rules that could explain his pattern of YES/NO judgments, I evaluated each against his cases. Here's the breakdown:

  ### Candidate Rules (Explicitly Stated)
  1. **Pattern Dynamics Rule**: Symbols "shove" iff they are *dynamically persistent patterns* whose internal interactions govern substrate changes over time. Patterns must exhibit self-sustaining cohesion and mutual influence.  
  2. **Pattern-Level Causation Rule**: Symbols "shove" iff the system's future coarse-grained states *depend counterfactually* on past coarse-grained states, and this dependence isn't trivially reducible to microstate tracking.  
  3. **Substrate Independence of Function Rule**: Symbols "shove" iff the causal role of the symbols *persists* under substrate changes, and the substrate is *exploited* for its dynamics (not just structure).  
  4. **Closed Causal Loop Rule**: Symbols "shove" iff they form a *closed loop*: symbols both cause and are caused by substrate changes, with no external "interpreter" unidirectionally reading them.  

  ### Evaluation Against Dev's Verdicts
  | Case                 | Dev's Verdict | Pattern Dynamics | Pattern-Level Causation | Substrate Independence | Closed Causal Loop |
  |----------------------|--------------|------------------|--------------------------|-------------------------|-------------------|
  | 1. Hofstadter table  | YES          | ✅ (Clumps interact dynamically) | ✅ (Coarse predicts coarse) | ✅ (Patterns transcend marbles) | ✅ (Loop: clumps ↔ marbles) |
  | 2. Frozen table      | NO           | ❌ (Static)      | ❌ (No transitions)      | ❌ (No function)        | ❌ (No loop)      |
  | 3. Recording table   | NO           | ❌ (Passive log) | ❌ (Diary doesn't *cause* changes) | ❌ (No exploitation)   | ❌ (No loop)      |
  | 4. Rock + manual     | NO           | ❌ (No dynamics) | ❌ (Manual isn't part of system) | ❌ (No actual computation) | ❌ (No loop)      |
  | 5. Rulebook clerk    | YES          | ✅ (Slips govern actions) | ✅ (Symbol sequence matters) | ✅ (Function in paper/mind) | ⚠️ (Debatable loop) |
  | 6. Lookup clerk      | YES          | ✅ (Book state determines output) | ✅ (Coarse input → coarse output) | ✅ (Book's role is functional) | ❌ (No feedback to book) |
  | 7. Laptop sim        | YES          | ✅ (Virtual clumps interact) | ✅ (Same as case 1)      | ✅ (Substrate irrelevant) | ✅ (Loop in simulation) |
  | 8. Turbulence        | NO           | ❌ (Ephemeral)   | ❌ (No sustained dependence) | ❌ (No robust function) | ❌ (No loop)      |

  **Analysis**:  
  - **Pattern Dynamics Rule** fits all verdicts perfectly. It requires active, self-sustaining pattern interactions (YES: 1,5,6,7; NO: 2,3,4,8). The lookup clerk (6) passes because the book's state *directly determines* the clerk's action—it's "shoving" via functional role.  
  - **Pattern-Level Causation Rule** struggles with case 6: the lookup book enables coarse-to-coarse dependence, but Dev rejects case 3 (recording), which also has coarse dependence without causation.  
  - **Substrate Independence Rule** fails case 6: the book isn't substrate-independent (it's passive paper), yet Dev says YES.  
  - **Closed Causal Loop Rule** fails case 6: the book isn't altered by the clerk's output, so no loop exists.  

  **Conclusion on Dev's Rule**: He is most consistently using the **Pattern Dynamics Rule**. Symbols "shove" when they are *dynamic, functionally active patterns that govern substrate behavior through their own structure and interactions*. Key elements:  
  - **Dynamics over statics**: Patterns must evolve (NO to frozen/recording).  
  - **Functional governance**: Patterns must *directly* determine substrate changes (YES to lookup clerk—book state dictates action).  
  - **Non-coincidental persistence**: Patterns must be robust and sustained (NO to turbulence).  

  ---

  ### Prediction for Your Wave Tank  
  - **Without feedback (current setup)**: Dev would say **NO**, the wave patterns do *not* shove the water.  
    - **Why**: The patterns are "read" by the camera and laptop, but they don't *govern* the water's dynamics. Like the recording table (case 3), the waves are a passive diary of paddle movements. The coarse predictability is incidental—retraining the readout for a new task without changing the water shows the patterns aren't functionally directing the substrate. They're "weather," not drivers.  
  - **With feedback (if fixed)**: Dev would likely say **YES**.  
    - **Why**: Adding feedback creates a closed loop where the output (derived from wave patterns) directly affects the paddle, making the patterns functionally active in governing water dynamics. Now the waves "shove" via feedback, akin to Hofstadter's table (case 1).  

  ---

  ### The Best Test Case to Separate Rules  
  Your top two candidates were **Pattern Dynamics** (PD) and **Pattern-Level Causation** (PLC). The critical difference is whether passive symbols can "shove" if they enable coarse-to-coarse causation *without* intrinsic dynamics (PLC says yes; PD says no).  

  **Proposed Variant**: Build a **"Symbol-Triggered Perturbation"** in the tank.  
  - **Setup**: Modify the system so that when specific wave patterns (e.g., a standing wave at point X) are detected by the camera, it triggers a *mechanical actuator* to drop a small weight into the tank at location Y, altering wave dynamics. The readout is still linear and task-specific, but the actuator is *only* triggered by coarse patterns, not microstates.  
  - **Why this separates PD vs. PLC**:  
    - **Pattern Dynamics (PD)**: Says **NO**. The wave patterns are still passive "triggers"—they don't intrinsically interact with the perturbation; the actuator is an external interpreter. Like the lookup clerk (6), but Dev accepted that because the clerk is *part* of the system. Here, the actuator is an add-on, making it more like the recording table (3). Patterns don't "shove"; they're read.  
    - **Pattern-Level Causation (PLC)**: Might lean **YES**. Coarse patterns now directly cause changes (actuator drops) that alter future coarse states, creating a coarse-causal chain.  
  - **Build feasibility**: You could rig this in a week with a servo motor, a lever, and camera-based threshold detection. No feedback loop to the paddle needed—keep it simple.  

  **Dev's Likely Verdict on Variant**: He'd say **NO**, reinforcing PD. The patterns aren't *self*-governing; the actuator is an external "reader" acting unidirectionally. This mirrors his rejection of the recording table (3) and distinguishes it from the lookup clerk (6), where the clerk's action is *constitutive* of the symbol system.  

  ### Final Note  
  His precedents *do* reach your case, but the feedback loop is pivotal. Without it, your tank is case 3 (NO); with it, it's case 1 (YES). The variant sharpens why PD wins: for Dev, "shoving" requires patterns to be *active players*, not just causes. If you build the test, I’d bet on PD—and Dev’s consistency.
