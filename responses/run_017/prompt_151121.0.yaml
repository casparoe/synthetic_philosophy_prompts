  Okay, let me tackle this user's query. They need a one-page proposal for a writing fellowship on probabilistic heuristics in number theory. The core idea is analyzing how these heuristics depend on independence assumptions versus local constraints. 

  First, I need to understand their key insight: distinguishing between the "shape" (asymptotic exponent) which might be robust under various dependencies, and the "constant" which requires finer structural details. The user wants to formalize this by testing different dependence structures consistent with known prime properties.

  The challenge is framing this precisely. The proposal must have a clear question - perhaps quantifying the minimal independence needed for heuristic predictions. I'll position it against common hand-wavy dismissals ("independence is false but harmless") by noting nobody has systematically varied dependence while fixing constraints.

  For methodology, I'll suggest a three-phase computational approach: 
  Month 1: Build toy models with adjustable dependence in sieve-like systems. 
  Month 2: Test predictions (twin primes, Goldbach) across models sharing density/local constraints. 
  Month 3: Classify predictions by robustness (universal, generic, independence-dependent).

  Failure would mean no useful patterns emerge - if even shape varies wildly under constraints. Success would be a classification scheme for conjectures based on their dependence sensitivity.

  I must keep it to five numbered points per instructions. The tight format means sacrificing nuance but ensures compliance. User's ability to code suggests computational feasibility is key. Scope limitation to toy models (not actual primes) addresses feasibility concerns.

  The epistemic angle (what heuristics "secretly" rely on) seems novel. If the shape/constant split aligns with robustness classes, it validates their hypothesis. If not, it still advances understanding of heuristic reasoning in number theory.
answer: |-
  Here are the five numbered items as requested:

  1.  **Question:** How much independence is *actually required* in probabilistic number theory heuristics? Specifically, for predictions (e.g., twin prime counts), which aspects hold robustly across *all* dependence structures consistent with known constraints (prime density, local residues mod small primes), and which aspects depend critically on near-independence?
  2.  **Why Open:** Current discourse ("independence is false but harmless, just a model") lacks precision: it doesn't quantify *which* heuristic predictions *survive* under *which* weaker dependence conditions or *require* near-independence, despite known constraints.
  3.  **Method/Timeline:** Month 1: Build computational toy models (e.g., biased random sieves) allowing controlled dependence structures while fixing density and local constraints. Month 2: Test key predictions (twin pairs, Goldbach rep counts, gap stats) across these models. Month 3: Classify predictions by robustness (universal, generic, independence-dependent).
  4.  **Failure Condition:** The proposed split (robust shape vs. fragile constant) proves incorrect – e.g., shape varies wildly under constraints, or constant is universally fixed, showing the heuristic's core assumption is fundamentally different.
  5.  **Deliverable:** A classification of standard heuristic predictions (e.g., Hardy-Littlewood constants, Cramer gaps) based on their sensitivity to dependence, plus identification of the minimal "complexity/symmetry" conditions needed beyond constraints to recover near-independence predictions.
