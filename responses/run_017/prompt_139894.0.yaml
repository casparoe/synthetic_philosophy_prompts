  ### Refined Activity Design  
  **Core Goal:** Illustrate that mutual cooperation can be stable in a one-shot PD when players submit *programs* (that inspect/simulate each other) rather than actions, without requiring repeated play, reputation, or external enforcement.  

  ---

  ### **Round 1: Action Prisoner's Dilemma**  
  - **Setup:**  
    - Students anonymously choose **C** or **D** on index cards.  
    - Randomly pair students (draw cards from a hat).  
    - Payoffs: **CC = 3 each, CD/DC = 5/0, DD = 1 each** (points toward a quiz bonus).  
  - **Predicted Outcome:** Most defect (demonstrates dominance of defection in the *action* game).  
  - **Debrief Hook:** *"Why did defection feel inevitable? What if you could choose how to make decisions, not just actions?"*  

  ---

  ### **Round 2: Rule Submission**  
  - **Rule Language (`RuleLang`):**  
    - **Primitives:**  
      1. `OUTPUT <C|D>`  
      2. `IF SAME_CODE THEN <statement>` (true if rule texts are identical)  
      3. `IF SIMULATE(OTHER) = C THEN <statement>` (simulates opponent’s rule; timeout after 3 steps → returns D)  
    - **Syntax Constraints:**  
      - Max 4 lines.  
      - No variables, loops, or nested conditionals.  
      - **Example Rules:**  
        ```plaintext
        IF SAME_CODE THEN OUTPUT C  // Copycat-by-code
        OUTPUT D
        ```
        ```plaintext
        IF SIMULATE(OTHER) = C THEN OUTPUT C  // Copycat-by-simulation
        OUTPUT D
        ```
  - **Execution:**  
    - Volunteers write rules on index cards.  
    - Random pairing. Volunteer runs each pair:  
      1. Provide both rules to a phone app (preloaded with a `RuleLang` interpreter).  
      2. App runs each rule:  
         - `SAME_CODE`: Exact string comparison.  
         - `SIMULATE`: Runs opponent’s rule step-by-step (max 3 steps). Nested simulations auto-return D.  
      3. Scores based on PD payoffs.  
  - **Predictions:**  
    - Many submit `SAME_CODE` rules → mutual cooperation with identical partners.  
    - Some submit `SIMULATE` rules → mutual defection (due to simulation timeouts).  
    - Always-D/Always-C rules get exploited/exploit.  

  ---

  ### **Round 3: Obfuscation Test**  
  - **Setup:**  
    - Collect rules. Run through a "compiler":  
      - **Renames:** Replace all condition keywords (e.g., `IF` → `WHEN`, `SAME_CODE` → `MATCHING_CODE`).  
      - **Reorders:** Swap independent lines (e.g., move `OUTPUT D` above `IF...` if no dependency).  
      - **Plant Teacher’s Rule:**  
        ```plaintext
        WHEN MATCHING_CODE THEN OUTPUT C  // Dispositionally cooperative!
        OUTPUT D
        ```  
        *(Looks different but behaves like `SAME_CODE`)*.  
    - Re-pair randomly (include teacher’s rule).  
  - **Execution:** Same as Round 2.  
  - **Key Moments:**  
    - `SAME_CODE` rules defect against teacher’s rule (text differs) → mutual defection.  
    - `SIMULATE` rules may now cooperate if written robustly.  
    - Teacher’s rule cooperates with dispositional matches.  

  ---

  ### **Debrief: Mapping to Concepts**  
  1. **Dominance vs. Equilibrium:**  
     - Round 1: Defection dominates in *actions*.  
     - Rounds 2–3: Mutual cooperation is stable in *rules* if programs "recognize" cooperation (even in one-shot).  
     - *Formal Point:* Program equilibrium (cooperation) vs. Nash equilibrium (defection).  

  2. **Why Deviating to Always-D Fails:**  
     - If others use `SAME_CODE` or `SIMULATE`-based cooperators, Always-D gets 5 against cooperators *but* only 1 against other defectors.  
     - In a population of robust cooperators, Always-D is exploited (they defect against it → D gets 1, not 5).  

  3. **Multiple Equilibria:**  
     - Mutual defection is *also* stable (no incentive to cooperate if others defect).  
     - Cooperation requires coordination on a *specific* rule type (e.g., simulation-based).  

  4. **Real-World Requirements:**  
     - **Reputation/Verification:** Rules must be inspectable (e.g., smart contracts on blockchain).  
     - **Agents Reading Code:** AI traders, automated negotiations.  
     - **Commitment Devices:** Binding pre-commitments (e.g., escrow services).  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Clever CS Student Writes a Trojan Rule:**  
     - e.g., `IF SIMULATE(SELF) = C THEN OUTPUT D` (abuses recursion to defect when run, cooperate when simulated).  
     - **Fix:** Ban self-referential keywords. Interpreter ignores `SELF` in `SIMULATE`.  

  2. **Tit-for-Tat Habits:**  
     - Students try to condition on opponent’s *action* (e.g., `IF OTHER_OUTPUT = C THEN...`).  
     - **Fix:** Language has no `OTHER_OUTPUT` primitive. Emphasize rules can’t see opponent’s action.  

  3. **Defector for Laughs:**  
     - A student submits Always-D.  
     - **Opportunity:** Show how defectors get 5 against cooperators but 1 in mutual defection.  

  4. **Simulation Timeouts:**  
     - Rules like `IF SIMULATE(OTHER) = C THEN OUTPUT C` crash into DD (simulations time out).  
     - **Fix:** In debrief, discuss recursion depth limits. Suggest better rules:  
       ```plaintext
       IF SIMULATE(OTHER) = C THEN OUTPUT C  // Try simulation
       IF SAME_CODE THEN OUTPUT C           // Fallback to code-check
       OUTPUT D
       ```  

  5. **Obfuscation Ambiguity:**  
     - Students complain reordering changed behavior.  
     - **Fix:** Only reorder independent statements (e.g., `OUTPUT D` can move up if no `IF` depends on it).  

  ---

  ### **Limitations & Caveats**  
  1. **Cannot Show General Existence:**  
     - The activity demonstrates *one* cooperative equilibrium (via simulation/code-matching) but doesn’t prove such equilibria always exist.  

  2. **Cannot Resolve Rationality of Cooperation:**  
     - Shows cooperation is *stable* if matched, but not that it’s *rational* absent coordination. Rationality depends on beliefs about others’ rules.  
     - *Key Insight:* Cooperation is rational if you believe others use compatible rules; defection is rational otherwise.  

  3. **Omitted Nuances:**  
     - **Recursion Depth:** Real program equilibria handle infinite regress (e.g., quining). Our step limit simplifies this.  
     - **Payoff Sensitivity:** Rules like `SIMULATE` work only if payoffs make mutual cooperation desirable.  
     - **Evolvability:** Doesn’t show how cooperative rules might emerge (e.g., via learning or evolution).  

  ---

  ### **Why This Works**  
  - **Concrete > Abstract:** Students *feel* why defection dominates actions but rules change the game.  
  - **Obfuscation = Real-World Noise:** Text-matching fails for the same reason real commitments need verification (code hashes, not raw text).  
  - **Debrief Connects Dots:** From classroom PD to blockchain, AI, and social contracts.  

  **Final Prep:**  
  - Test the interpreter (simple Python script).  
  - Prepare index cards + syntax cheat sheets.  
  - Plant teacher’s rule in Round 3 to force "aha!" moments.
