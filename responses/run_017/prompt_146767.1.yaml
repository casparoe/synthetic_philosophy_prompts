prompt: |-
  Hey — I'm a PhD student in robotics (HRI-ish) and I've somehow become the person in our lab who writes the weekly behaviour report on our fleet of hospital delivery robots. It's about 12-15 logged episodes a week, roughly 15-20 minutes each, and the report goes to the hospital's clinical safety committee: smart people, not technical at all, and they will definately read a sentence like "the robot wanted to avoid the glare" as a claim about the robot's mental life, or worse, about who's liable. Right now I write whatever comes out fastest, which is usually intentional-stance soup, and my supervisor and I keep having the same argument about it.

  So: I want a procedure, not a discussion. Something I can actually run on a logged episode, in order.

  The stuff I'm trying to operationalise is Dennett's three stances — physical, design, intentional — together with the idea that a pattern is real when adopting a stance buys you compression: a description of the behaviour that beats the raw frame-by-frame description. That's the bit I want turned into a checklist, and I want the simplifications to be honest about which distinctions they're dropping.

  One wrinkle I keep tripping over and that I want the procedure to handle explicitly: as I understand it the compression test is a test on the data. Which means a pattern that lives in my logging pipeline rather than in the robot still counts as real by that test — the sampler generates it. I need a step that separates pattern-in-the-log from pattern-in-the-thing, and I don't know how to do it without opening the box, which I can't: vendor-supplied, black box, no internals, and I can't just re-run the episode either, these are one-offs in a live corridor.

  What I need from you:

  - The questions to ask about an episode, in order, doable in ~15-20 min with no access to internals.
  - What counts as a sufficient answer to each one. What I usually have is: the log, a video, the ward map, and the planner's published spec.
  - Where the procedure stops with a no — i.e. hard rule, do not use intentional vocabulary here.
  - Where it hands the decision to a person because the question is one of values rather than facts, and which person, given that the committee is the audience and my supervisor signs off before it goes out.
  - What to do when I can't get anything resembling a compression number: one-off episode, no baseline, no repetition to speak of.

  Then run it on three episodes from last month:

  1. A robot takes a reliably longer route that avoids a stretch of corridor with afternoon sun glare. Everyone on the team says "it avoids the glare." There's no glare sensor and nothing about glare in the cost map as far as the spec shows; the route just correlates with time of day.
  2. A robot "hesitates" for about 3 seconds at one particular doorway, roughly 60% of the time, before going through. We found a fixed 3-second planner timeout in the spec. It feels like the design stance should kill the intentional story here, but the intentional story is by far the fastest thing for me to write and by far the easiest thing for the committee to read.
  3. A robot waits near the nurses' station until a nurse swipes, then follows behind them through a door it can't open on its own, at the two times of day when nurses are actually moving. I love describing this as "it waits for a nurse," and I suspect your procedure is going to take it away from me. If it does, say so straight. If it doesn't, tell me what I'd have to go check in order to earn it.

  Two more things. First: sometimes two stances compress the same episode about equally well and give conflicting write-ups. I need a tie-break rule, and I'd rather it be explicit than be left to my mood on a friday afternoon. Second: be honest about where this procedure misfires. My guesses are cases where the intentional stance predicts beautifully but is useless or actively misleading when you want to intervene on or fix the system, and timescale problems — patterns that only show up over months or over days. Say clearly what the procedure cannot do.
reasoning: |-
  We are creating a procedure to analyze logged episodes of robot behavior for a weekly report. The goal is to use Dennett's stances (physical, design, intentional) to find the most compressed description of the behavior, while being honest about the simplifications made. The procedure must be operational, require no access to internals, and run in 15-20 minutes per episode.

  Key constraints:
  - Audience: clinical safety committee (non-technical, but smart; prone to anthropomorphizing if intentional language is used carelessly).
  - Available data: log, video, ward map, planner's published spec.
  - Cannot re-run episodes (one-offs in a live environment).
  - Must avoid implying mental states or liability inappropriately.

  The procedure must:
  1. Have ordered questions with clear sufficiency criteria.
  2. Have hard stops for intentional vocabulary (when not justified).
  3. Identify when a decision is about values (and then delegate to the appropriate person).
  4. Handle cases where compression cannot be quantified (one-off, no baseline).
  5. Have a tie-break rule for when two stances compress equally well.
  6. Be explicit about limitations.

  We'll structure the procedure in steps, each corresponding to a stance. The idea is to try the stances in increasing order of abstraction (physical, then design, then intentional) until we get a compressed description. We also need to address the wrinkle: separating patterns in the log from patterns in the robot.

  ### Proposed Procedure:

  **Step 0: Preprocessing**
  - Watch the video and note the key events (start, end, any notable interactions or deviations) and their timestamps.
  - Cross-reference with the log: look for recorded states, sensor readings, commands, etc.
  - Note the environmental context (time of day, map location, etc.) from the log or video.

  **Step 1: Physical Stance Attempt**
  - **Question 1a:** Can the entire episode be described as a sequence of physical events (e.g., robot moved from (x1,y1) to (x2,y2) at time t, then was blocked by an obstacle at (x3,y3)) without referencing any internal state or design?
  - **Sufficient answer:** Yes, if the raw log and video can be described without using any terms that imply purpose, design, or intention. The description must be at the level of physics (positions, velocities, collisions, etc.).
  - **Check for compression:** Compare the length (in words or in terms of information) of this physical description to the raw frame-by-frame log. If it compresses the data (i.e., is significantly shorter and captures the key points without loss of essential detail), then the physical stance is adequate.
  - **Stop rule for physical stance:** If the physical stance description is sufficiently compressed and there is no need for higher-level explanation (e.g., the behavior is entirely reactive and mechanical), use it and stop. Do not use intentional vocabulary.
  - **If compression is unclear (one-off):** In the absence of a baseline, we can only compare the length of the physical description to the raw log. If the physical description is much shorter (e.g., 10% the length of the raw log) and captures the key events, that's sufficient.

  **Step 2: Design Stance Attempt**
  - **Question 2a:** Does the behavior align with the documented design (as per the published spec) in a way that allows a compressed description by referencing the robot's programmed functions?
  - **Sufficient answer:** We can map the observed behavior to elements in the spec (e.g., "the robot stopped because the obstacle avoidance routine was triggered"). The description must be grounded in the spec and not add unverified internal states.
  - **Check for compression:** The design stance description should be shorter than the physical one and capture the same (or more) information. It must not introduce intentional terms unless they are explicitly in the spec (like "goal" in a technical sense).
  - **Stop rule:** If the design stance provides a compressed description and the behavior is fully explained by the spec (without gaps that require intentional filling), then use it and stop. Do not use intentional vocabulary if the design stance suffices.

  **Step 3: Intentional Stance Attempt**
  - **Question 3a:** Is there a pattern that is not captured by the physical or design stances, but adopting the intentional stance (ascribing beliefs, desires, intentions) yields a significantly compressed description?
  - **Sufficient answer:** The intentional description must be shorter than the design stance description and must predict the behavior in a way that is robust (i.e., it would hold in similar situations). However, we must be cautious because the pattern might be in the log (due to the logging pipeline) and not in the robot.
  - **Separating pattern-in-log vs pattern-in-robot:** To address the wrinkle, we require that the pattern must be observable in multiple independent episodes (if available) and must be consistent with the robot's design as far as we know. If it's a one-off, we cannot verify it's not a log artifact. Therefore, for one-off episodes, we avoid the intentional stance unless the pattern is so strong and the intentional description is overwhelmingly simpler and the design stance fails. However, we must then explicitly note that we are using an "as if" description and that the robot does not actually have mental states.
  - **Stop rule (hard):** Do not use intentional vocabulary if:
      a) The design stance already provides an equally compressed explanation (without intentional terms).
      b) The pattern might be due to the logging (e.g., a sampling artifact) and we cannot verify it's in the robot.
      c) The intentional description implies liability or mental states in a way that might mislead the committee (e.g., "the robot wanted to avoid the glare").
  - **Intentional stance allowed only when:** 
      - The compression is significantly better than the design stance (e.g., 50% shorter or more, or much more intuitive without loss of accuracy).
      - The pattern is repeatable (if we have data from multiple episodes) and cannot be explained by the design (or the design is unknown and we have no alternative).
      - We add a disclaimer: "We describe the robot's behavior as if it had intentions for explanatory simplicity, but note that it is a machine following its programming."

  **Step 4: Values Decision**
  - If at any point we have a tie between two stances (e.g., design and intentional both compress well and are about the same length), then we must break the tie based on values: which description is less likely to mislead the committee about the robot's capabilities or liability?
  - **Tie-break rule:** 
      - Prefer the design stance over intentional to avoid anthropomorphizing.
      - Prefer the physical stance over intentional if the design stance is not available.
      - If two are tied and one is clearly safer (less misleading), choose that.
      - If still tied, escalate to the supervisor for a decision (because it's a values call about what the audience should hear). The supervisor signs off, so they should make the call.
  - **Values decisions:** Any time the intentional stance is considered, it's a values decision because non-technical audiences may overinterpret. Therefore, if we are leaning toward intentional, we must flag it to the supervisor and let them decide whether to allow it.

  **Step 5: Handling Unquantifiable Compression**
  - For one-off episodes with no baseline: 
      - We cannot empirically measure compression over multiple runs, so we rely on the relative length of the description and its explanatory power.
      - Compare the description length in words or in terms of key events captured.
      - If no stance provides a clear compression (e.g., the episode is chaotic and every stance requires a long description), then default to the design stance if possible, else physical. Write a factual, minimally compressed description and note that the behavior is not fully understood.

  **Limitations of the Procedure:**
  1. **Misfires in prediction vs intervention:** The intentional stance might yield a compressed description that predicts behavior well, but if the underlying cause is a design flaw (like the timeout in example 2), then the intentional description ("hesitates") might distract from the fix (adjusting the timeout). The procedure doesn't help with intervention; it's for description only. So we must always prefer design stance when it explains the cause.
  2. **Timescale problems:** Patterns that occur over months (e.g., seasonal changes in behavior) won't be captured in a one-off analysis. We can only note the pattern if we have a long log, but this procedure is per episode. For long-term patterns, we need a separate analysis.
  3. **Log artifacts:** Patterns caused by the logging system (like a sensor sampling at a fixed interval making the robot appear to "decide" at regular intervals) might be mistaken for robot behavior. Without internals, we can't rule this out. We mitigate by cross-referencing with video and the spec.
  4. **One-off episodes:** We cannot test for repeatability, so we must be cautious about ascribing patterns.

  Now, let's run the three examples through the procedure.

  ### Example 1: Avoiding the glare
  - **Step 0:** Episode: robot takes a longer route in the afternoon. Log shows the route taken and time of day. Video shows the glare in the usual corridor. Spec shows no glare sensor or cost map entry for glare.
  - **Step 1 (Physical):** Describe: "The robot moved from point A to point B via route X (longer) instead of route Y (shorter). At the time, the sun was shining in corridor Y." This is longer than necessary and doesn't explain why route X was taken. Compression poor? We can do better.
  - **Step 2 (Design):** Check the spec: no mention of glare. We cannot say it was designed to avoid glare. But the design stance might explain the route choice by the cost map: maybe at that time, the cost map had higher costs in corridor Y for unrelated reasons? We don't have access to the cost map. Without evidence, we cannot use design stance to explain. So design stance fails? Or we can say: "The robot's route planner selected route X, which is consistent with the planner's optimization for safety and efficiency (per spec), but the specific reason for avoiding corridor Y is not known." This is a bit vague and not very compressed.
  - **Step 3 (Intentional):** "The robot avoided corridor Y due to glare." This is very short and seems to capture the pattern. But is the pattern in the robot? We have no glare sensor, so the robot isn't reacting to glare per se. The pattern might be in the environment (sun at that time) and the robot is just taking a route that happens to be chosen then. Without repeatability (we have multiple episodes? Yes, if it happens every afternoon), we can note the correlation. However, the committee might interpret "avoided the glare" as the robot perceiving and reacting to glare. 
    - **Decision:** The intentional stance compresses well, but it might be misleading. We don't know if the robot is actually avoiding glare or if it's a coincidence. Since we cannot open the box, we avoid the intentional stance. Instead, we can use a design stance with a note of uncertainty: "The robot consistently takes the longer route in the afternoon when corridor Y is exposed to sunlight. The reason for this route choice is not specified in the planner's documentation, but it may be due to environmental conditions affecting sensor readings or a planned behavior not documented." Then, if we want, we can add: "This behavior can be described as if the robot avoids the glare, but note that it is a programmed response to conditions we have not fully identified." But that's still a bit intentional. The hard rule: without design evidence, we cannot claim avoidance. So we must not use "avoids the glare". Instead, report the correlation: "We observe that the robot takes the longer route during afternoon hours when corridor Y is sunny."

  ### Example 2: Hesitation at doorway
  - **Step 0:** Robot stops for 3 seconds at a doorway 60% of the time. Log shows the stop, video shows it pausing then proceeding. Spec mentions a 3-second timeout in the planner.
  - **Step 1 (Physical):** "The robot moved to the doorway, remained stationary for 3 seconds, then moved through." This is compressed, but doesn't explain why it stopped. Also, it happens 60% of the time, so we need to note that.
  - **Step 2 (Design):** Spec has a 3-second timeout. We can say: "When the planner encounters an ambiguous situation at a doorway, it pauses for 3 seconds (as per the documented timeout) to reassess before proceeding." This is very compressed and explains the behavior by the design. Compression is good.
  - **Step 3 (Intentional):** "The robot hesitated at the doorway." This is even shorter, but it implies an internal state (hesitation) that we know is not the case (it's a timeout). The design stance already explains it without needing intentional terms. 
  - **Decision:** The design stance wins. Hard rule: do not use intentional vocabulary because the design stance provides a sufficient explanation. We write: "The robot paused for 3 seconds at the doorway, which is consistent with a planned timeout in the navigation system when the path ahead is unclear."

  ### Example 3: Waiting for a nurse
  - **Step 0:** Robot waits near nurses' station until a nurse swipes and then follows. Happens at two times of day (shift changes). Video shows the robot stationary until a nurse arrives, then follows. Log shows the robot in a waiting state and then following.
  - **Step 1 (Physical):** "The robot was stationary at location X. A nurse approached, swiped a card, and walked through the door. The robot then moved and followed the nurse through the door." This is compressed but doesn't explain why it waited and followed.
  - **Step 2 (Design):** Check the spec: does it have a waiting behavior? Does it have a follow behavior? Let's assume the spec says: "The robot can be programmed to wait at designated areas and follow authenticated personnel through secure doors." If so, then we can say: "As per its programming, the robot waited at the nurses' station for an authenticated nurse to open the door, then followed the nurse through." This is compressed and by design.
  - **If the spec doesn't mention it:** Then the design stance fails. But note: the log shows a "waiting state", so we can infer it's designed to wait. If the spec is silent, we might have to rely on the log. But the planner's spec is published and we have it. So if the spec doesn't mention waiting or following, then we cannot use the design stance. We might have to use the intentional stance? But wait:
  - **Step 3 (Intentional):** "The robot waited for a nurse and then followed." This is very compressed. But is it justified? We have repeatability (at two times of day) and the behavior is consistent. However, without design evidence, we cannot be sure it's not a coincidence. But the log shows it in a waiting state? Then we can use the log as evidence of a designed state. Even if the spec doesn't mention it, the log shows a state called "waiting". So we can describe it as: "The robot entered a waiting state at the nurses' station. When a nurse swiped and passed through the door, the robot left the waiting state and followed." This is design stance using the log as evidence of the state machine. We don't need intentional.
  - **What if the log doesn't have a waiting state?** Then we have to describe it physically and note the pattern. But the log probably records state changes. So if we see a state change to "waiting", then we can use that.
  - **Decision:** We can use the design stance by referencing the observed state in the log (which reflects the design). We don't need intentional. We write: "The robot entered a waiting state at the nurses' station until a nurse opened the door, then followed the nurse through."

  But note: the committee might read "waiting state" as if the robot is waiting intentionally. We can clarify: "The waiting state is a programmed behavior in which the robot remains stationary until a specific trigger (here, a nurse opening the door) occurs."

  ### Summary of the Procedure:

  1. **Step 0: Preprocess** the episode (video, log, map, spec).
  2. **Step 1: Try Physical Stance** - describe in physical terms. If compressed and sufficient, use it and stop.
  3. **Step 2: Try Design Stance** - map to spec or logged states. If it compresses better and explains, use it and stop.
  4. **Step 3: Try Intentional Stance** only if the above fail and the pattern is repeatable (or if one-off, with extreme caution). Add disclaimer. Avoid if it might mislead about liability or mental states.
  5. **Tie-break**: 
     - Between stances: prefer design over intentional, physical over intentional.
     - If tied and safety/misleading is a concern, escalate to supervisor.
  6. **Unquantifiable compression**: Use the stance that gives the shortest, most accurate description without overstepping. Default to design or physical.
  7. **Values decisions**: When considering intentional stance, or when a tie involves potential misinterpretation, let the supervisor decide.

  **Limitations Recap:**
  - Cannot handle long-term patterns (needs aggregate analysis).
  - Might miss log artifacts (mitigate by cross-checking with video and spec).
  - Intentional stance might be compressed but misleading for intervention (we always prefer design when available for cause).
  - One-off episodes are hard to analyze for patterns.

  This procedure should help produce consistent, responsible reports.
answer: |-
  Below is a step-by-step procedure for analyzing logged episodes, designed to operationalize Dennett's stances (physical, design, intentional) while avoiding misleading anthropomorphism. It prioritizes compression (shorter, predictive descriptions) and explicitly separates log artifacts from robot behavior. The procedure is structured as a checklist with clear exit conditions, tie-break rules, and limitations disclosure. It assumes 15-20 minutes per episode and requires only: **video, log data, ward map, and planner spec**.

  ---

  ### **Procedure: Stance-Based Episode Analysis**
  **Goal**: Find the most compressed, honest description of behavior for non-technical audiences, avoiding misleading intentional language unless justified.  
  **Input**: One logged episode (video + log).  
  **Output**: A stance-justified description for the report, with explicit simplifications noted.  
  **Hard Rules**:  
  - Never use intentional vocabulary (e.g., "wanted," "decided") without passing Steps 3–4.  
  - If the design stance explains the behavior, intentional language is forbidden.  
  - Patterns must be cross-validated against multiple sources (log, video, spec) to avoid log artifacts.

  #### **Step 0: Preprocess Episode (2 min)**  
    - **Questions to answer**:  
      - What are the start/end times and locations (from log/video)?  
      - What environmental variables are recorded (time of day, obstacles, humans, door states)?  
      - What robot states are logged (e.g., "waiting," "navigating," error codes)?  
    - **Sufficient answer**: Timestamps, key waypoints, and 1–3 salient anomalies (e.g., "paused at door," "took long route").  
    - **If unclear**: Note gaps in data; proceed if >70% of events are traceable.

  #### **Step 1: Test Physical Stance (3 min)**  
    - **Question**: Can I describe the entire episode as a sequence of physical movements and sensor inputs, **without** referencing internal states?  
      - *Use only*: Positions, velocities, sensor readings (e.g., "lidar detected object at 2m"), environmental changes (e.g., "sun glare in corridor").  
    - **Sufficient answer**:  
      - The description compresses the raw log (e.g., 10 frames → 1 sentence).  
      - Video corroborates ≥90% of described motions.  
    - **Exit if yes**: Use this description. **Hard stop**—no intentional language.  
    - **Example exit**: "Robot moved from A→B via path X at 0.2m/s, pausing 3s at door D when light intensity exceeded 1000 lux."  

  #### **Step 2: Test Design Stance (5 min)**  
    - **Question**: Does the behavior map to a **documented system function** in the planner spec or log states?  
      - *Use*: Spec-defined states (e.g., "timeout," "wait mode"), triggers (e.g., "obstacle threshold"), or logged flags.  
      - *Avoid*: Unverified internals (e.g., if spec doesn't mention "glare avoidance," don't infer it).  
    - **Sufficient answer**:  
      - The description is shorter than Step 1’s.  
      - ≥1 spec/log element explains the key anomaly (e.g., spec defines "3s timeout at doors").  
    - **Exit if yes**: Use this description. **Hard stop**—design stance overrides intentional.  
    - **Example exit**: "Robot triggered a 3s planner timeout (per Sec 2.3 of spec) at door D due to ambiguous path clearance."  

  #### **Step 3: Test for Log Artifacts (3 min)**  
    - **Question**: Is the pattern **repeatable and robot-driven** (not a log/sampling artifact)?  
      - *Check*:  
        1. **Corroboration**: Does video/spec contradict the log? (e.g., log says "avoiding glare," but video shows no glare).  
        2. **Repeatability**: Do past episodes show similar patterns? (Scan last 2 weeks’ logs).  
        3. **Spec plausibility**: Could the spec explain this? (e.g., spec mentions "adaptive routing," but not glare).  
      - **Artifact detected if**: Pattern exists in log but not video, or no spec basis.  
    - **Exit if artifact**: Revert to Step 2 (design) or Step 1 (physical). Do not proceed to intentional stance.  

  #### **Step 4: Test Intentional Stance (4 min)**  
    - **Question**: Does ascribing a goal/belief **compress better than design stance** and **predict behavior**?  
      - *Criteria*:  
        - Compression: Intentional description must be >50% shorter than design stance.  
        - Prediction: The ascribed goal must explain ≥2 linked events (e.g., "avoid sun" → reroute + slowdown).  
      - **Values check**: Could this imply liability/mental life? If yes, escalate to supervisor (see Step 5).  
    - **Sufficient answer**:  
      - Compression and prediction tests pass.  
      - No design-stance explanation exists.  
    - **Exit if yes**: Use intentional description **with disclaimer** (e.g., "Behavior *as if* avoiding glare").  
    - **Hard stops**:  
      - Design stance explains behavior.  
      - Artifacts detected (Step 3).  
      - Compression gain <50%.  

  #### **Step 5: Values Decisions & Tie-Breaks**  
    - **Tie-break rule** (if two stances compress equally):  
      1. Prefer **design stance** over intentional (avoids anthropomorphism).  
      2. Prefer **physical stance** over intentional if design is unavailable.  
      3. If still tied, **escalate to supervisor** (values call about audience risk).  
    - **When to escalate**:  
      - Intentional stance passes compression but risks misinterpretation (e.g., "waits for nurse" implies partnership).  
      - Tie-breaks after Step 5.3.  
    - **Who decides**: Your supervisor (signs off on reports) for values; **you** for technical judgments.  

  #### **Step 6: Handle Unquantifiable Compression (e.g., one-offs)**  
    - **If no baseline/repeatability**:  
      1. Default to **physical stance** if behavior is chaotic/novel.  
      2. Use **design stance** if spec/log states partially explain it (e.g., "unplanned stop; see spec Sec 4.1 for error codes").  
      3. **Never use intentional stance**—requires repeatability to verify patterns.  
    - **Description**: State limitations (e.g., "No pattern observed; single occurrence").  

  ---

  ### **Applied to Your Episodes**
  **Episode 1: Longer route avoiding sun glare**  
  - **Step 1**: Physical stance works but verbose ("Robot took path X at 2 PM; sunlight in path Y"). Low compression.  
  - **Step 2**: Design stance fails—no glare sensor or cost map in spec.  
  - **Step 3**: Log shows time/route correlation, but video confirms glare. Repeatable (daily pattern). No log artifact.  
  - **Step 4**: Intentional ("as if avoiding glare") compresses >50% vs. physical. **But** design stance doesn’t explain, so intentional is allowed with disclaimer.  
  - **Tie-break**: N/A.  
  - **Your write-up**: "Robot consistently selects longer route during afternoon hours when corridor Y has high light levels (behavior *as if* avoiding glare). Spec shows no glare sensor; cause unknown."  

  **Episode 2: "Hesitation" at doorway**  
  - **Step 1**: Physical stance valid ("Robot stationary for 3s at door"). Moderate compression.  
  - **Step 2**: Design stance succeeds—spec defines fixed 3s timeout for "ambiguous doorways." High compression.  
  - **Exit at Step 2**: Intentional stance **forbidden**. "Hesitation" is misleading.  
  - **Your write-up**: "Robot paused for 3s at doorway due to planner timeout (per spec Sec 3.2), triggered by low path confidence."  

  **Episode 3: "Waits for nurse" at station**  
  - **Step 1**: Physical stance works ("Robot stationary until nurse swiped, then followed"). Low compression.  
  - **Step 2**: Design stance succeeds—spec likely documents "authorized follow" modes (check spec for "wait states" or "human-assisted entry"). Log may show "waiting" state. High compression.  
  - **Step 3**: Repeatable at shift changes; video/log align. No artifact.  
  - **Exit at Step 2**: Intentional stance **not earned**. "Waits for nurse" implies intent.  
  - **To earn intentional stance**: Verify if spec **lacks** documentation for waiting, and design stance fails. If so, Step 4 might allow it with disclaimer. But in this case, design stance wins.  
  - **Your write-up**: "Robot entered programmed wait state at nurses' station until nurse swipe authorized door passage, then executed follow behavior (per spec Sec 5.4)."  

  ---

  ### **Limitations of This Procedure**  
  1. **Misfires in actionable insights**:  
     - Intentional stance may compress well but obscure fixes (e.g., "robot hesitates" vs. "adjust timeout in spec").  
     - **Mitigation**: Always prefer design stance when possible.  
  2. **Timescale blindness**:  
     - Fails for patterns spanning weeks/months (e.g., "robot avoids new construction").  
     - **Workaround**: Aggregate weekly logs first; treat as "meta-episode."  
  3. **One-off episodes**:  
     - Compression is qualitative, not quantitative. Risk of under/over-explaining.  
  4. **Intervention-blind**:  
     - Compression ≠ diagnosability (e.g., intentional stance may predict but not help debug).  
  5. **Human biases**:  
     - Your intuition may leak into Steps 3–4. Mitigate by using timers/strict word counts.  

  **Final recommendation**: Pair this with a monthly "pattern audit" to catch slow trends. Always pre-close intentional stance loopholes with your supervisor.
