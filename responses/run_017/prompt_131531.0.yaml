          Blue: success on 1-2 -> 2/6=0.3333? Then in B they are equal? But then we don't have Blue strictly better in B.

      Set in B: 
          Red: 1-1 -> 1/6=0.1667
          Blue: 1-2 -> 2/6=0.3333

      Then:
        pA_R=0.5, pA_B=0.6667
        pB_R=0.1667, pB_B=0.3333

      Red overall (f_R=0.8): 0.8*0.5 + 0.2*0.1667 = 0.4+0.0333=0.4333
      Blue overall (f_B=0.2): 0.2*0.6667 + 0.8*0.3333 = 0.1333+0.2666=0.4

      Now: Red 43.33% > Blue 40% -> reversal.

      In environments:
        A: Red 50% < Blue 66.67%
        B: Red 16.67% < Blue 33.33%

      Perfect.

      Now with 10 participants per team:

        Red: 8 in A, 2 in B.
          A: 8 * 0.5 = 4 successes
          B: 2 * (1/6) -> expected 0.33, let's say 0 or 1.
          Total Red successes: 4 or 5 -> 40% or 50%.

        Blue: 2 in A, 8 in B.
          A: 2 * (4/6) = 1.33 -> say 1 or 2.
          B: 8 * (2/6) = 2.67 -> say 2 or 3.
          Total Blue: 3 to 5 successes -> 30% to 50%.

      We want Red > Blue overall. If Red has 5 and Blue has 3, then 50%>30%. But if Red has 4 and Blue has 4, then 40%=40% -> tie.

      To make it robust, we can make the success rates integer or use larger n.

      But note, we can run it and even if it's tie, we can still show the per-environment rates.

      With 7 per team:

        Red: 5.6 in A, 1.4 in B -> say 6 in A, 1 in B.
          A: 6 * 0.5 = 3 successes
          B: 1 * (1/6) -> likely 0.
          Total Red: 3 -> 3/7=42.9%
        Blue: 1.4 in A, 5.6 in B -> say 1 in A, 6 in B.
          A: 1 * (4/6) -> likely 0 or 1. Let's assume 1 (if they roll 1-4).
          B: 6 * (2/6) = 2 successes.
          Total Blue: 3 -> 3/7=42.9% -> tie.

      This is not robust.

      We need to make the overall difference larger. Increase the environment distribution skew.

      Use f_R=0.9, f_B=0.1.

      Then:
        Red overall: 0.9*0.5 + 0.1*0.1667 = 0.45+0.0167=0.4667
        Blue overall: 0.1*0.6667 + 0.9*0.3333 = 0.0667+0.3=0.3667 -> 10% difference.

      With 10 participants per team:

        Red: 9 in A, 1 in B.
          A: 9*0.5 = 4.5 -> 4 or 5 successes.
          B: 1*(1/6) -> 0.1667 -> likely 0.
          Total: 4 or 5.
        Blue: 1 in A, 9 in B.
          A: 1*(4/6) -> likely 1 (probability 4/6).
          B: 9*(2/6)=3.
          Total: 1+3=4.
        Then: Red might be 4,4 or 5,4. So 40% or 50% vs 40%. So might be tie or Red win.

      With 5 per team:

        Red: 4.5 in A -> 5 in A (since 0.9*5=4.5, but we have to round) -> how to assign? Use deck: for 5 draws from a deck with 9 A and 1 B, we might get 5 A.
          Then: 5 in A: successes = 5*0.5=2.5 -> 2 or 3.
          Overall: 2 or 3 out of 5 -> 40% or 60%.
        Blue: 0.5 in A -> likely 0 or 1 in A. If 0 in A, then 5 in B: successes=5*(2/6)=1.67 -> 1 or 2.
          If 1 in A: then 4 in B: successes = 1*(4/6) [expect 0.67] + 4*(2/6)=1.33 -> total 2.
          Overall: 2/5=40%.
        Then if Red has 3, they win 60%>40%. If Red has 2, then 40%=40%.

      This is workable. We can accept that sometimes it will be a tie, but often Red will win.

      And in each environment, we will typically have at least one team in each environment because for Blue, there's a 1-(0.9)^5=1-0.59=41% chance of at least one A, and for Red, chance of at least one B is 1-(0.9)^5=41%. So in about 59% of cases, one team might be missing in an environment. But we can then either:
        a) If missing in an environment, we can't compare that environment, but we can still show the other environment and overall.
        b) We can use a larger deck and hope, or
        c) In the activity, if one environment is missing a team, we can note that and still show the overall and the environment where we have both.

      Given time, we'll go with this and hope. We can also increase the number of participants by having everyone do two trials? But that doubles time.

      Alternatively, we can have. but we have 40 minutes.

      We decide to use:

        Environment split: Red gets A with 90%, B with 10%
                           Blue gets A with 10%, B with 90%

        Success rules:
          - If Red in A: success on die roll 1-3 (3/6)
          - If Blue in A: success on 1-4 (4/6)
          - If Red in B: success on 1 (1/6)
          - If Blue in B: success on 1-2 (2/6)

      We'll use two decks of cards for the environment (one for Red, one for Blue) with the appropriate proportions.

      For Round 1: the Dice Showdown

      Now, for Round 2: we want a case where grouping by the environment is the wrong move because the environment is affected by the team.

      How? We can have a setup where the environment is not a pre-existing condition but is chosen by the team or affected by the team. For example, in a medical study, the treatment might cause patients to be in a better condition, and then if you condition on that condition, you might see a reversal.

      We can do:

          Two teams: Group X and Group Y.
          We are comparing the effect of a strategy on success.
          But the strategy affects the environment.

          Example: 
            Strategy A and Strategy B for a game.
            Environment: Easy or Hard level.

          How it works:
            - If you use Strategy A, you are more likely to get an Easy level.
            - If you use Strategy B, you are more likely to get a Hard level.

          And then within each level, Strategy B might be better, but overall Strategy A is better because it gets more easy levels.

          But if we condition on level, we see that Strategy B is better in each level, but overall Strategy A is better. That's the same as Round 1? 

          The difference is that in this case, the level (environment) is not a lurking variable but a consequence of the strategy.

          Then, conditioning on the level would be inappropriate because it blocks the causal path. 

          How to do this in the activity without lecture? 

          We can have the environment determined after the team is chosen, and the determination depends on the team.

          Specifically:

            - For Team X (Strategy X): they have a 90% chance of Easy, 10% Hard.
            - For Team Y (Strategy Y): they have 10% chance of Easy, 90% Hard.

          Then the success rules are the same as in Round 1? That would give the same data generating process.

          The only difference is the interpretation: in Round 1, the environment was a pre-existing condition (like experience level) that might be a confounder. In Round 2, the environment is a consequence of the strategy.

          So in the debrief, we can discuss the difference.

          But during the activity, we won't reveal that. We want them to see the same reversal and then question whether to group by environment.

          So for Round 2, we can use the same exact setup as Round 1, but we frame it as strategies affecting the environment.

          We can call it: "Strategy Showdown"

          Then when they see the reversal, we ask: should we group by environment? But then we reveal that the environment is actually caused by the strategy.

          This might be too abstract.

          Alternatively, we can do a different physical process.

          Given time, we'll reuse the same process but with different team names and a different framing.

          We want them to see that grouping by environment is not always the right move.

          So in Round 2, we do the same activity, but then we reveal that the environment was determined by the team. We then ask: is it fair to break down by environment? Or does that hide the advantage of the strategy?

          We can then compare to Round 1, where the environment was a pre-existing condition.

          This will be part of the debrief.

      Given time constraints, we'll do:

        Round 1: "The Training camps" 
          - Two basketball training camps: "Red Camp" and "Blue Camp". 
          - The environment is the type of court they typically play on: "Wood" or "Concrete".
          - We are measuring the success rate of shooting.

        Round 2: "The Strategy Experiment"
          - Two strategies for shooting: "Quick Release" (QR) and "High Arc" (HA).
          - The environment is the defender's position: "Close" or "Far", which is affected by the strategy used.

      But the data generating process is the same.

      Now, the activity outline:

      Total time: 40 minutes

      - Intro (2 mins): 
          "Today we're doing a dice game to see which team is better at a task. We have two teams: Red and Blue. Each of you will be assigned to a team. Then, you'll draw a card for the environment and roll a die for outcome. We'll tally the successes."

      - Assign teams (1 min): randomly assign half to Red, half to Blue. If odd, facilitator joins one team.

      - Round 1 (10 mins):
          a) Explain the task (2 mins): 
              "You are shooters in a training camp. The environment is the court type: Wood or Concrete. 
              First, draw a card from your team's environment deck. 
              Then, roll the outcome die. 
              We'll then tell you the success rule for your environment and team. 
              Record: team, environment, and success/failure."
          b) Distribute materials: 
              - Two environment decks: 
                  Red deck: 9 Wood, 1 Concrete (or if we have more than 10, adjust proportions)
                  Blue deck: 1 Wood, 9 Concrete
              - One outcome die per participant (or share, but better to have one per)
          c) Participants draw and roll (2 mins)
          d) Collect data on a board (5 mins): 
              Make a table: Team | Environment | Success | Failure (or just count successes)
              First, tally overall successes by team.
          e) Predictions and reveals (1 min):
              Before tallying overall, have them predict: which team has a higher success rate? Write down.
              Then tally overall: show Red has higher overall.
              Then, without warning, ask: "But does that tell the whole story? What if we break it down by court type?"
              Have them predict: for Wood courts, which team is better? For Concrete, which team is better? Write down.
              Then break down by environment and show that in each, Blue is better.

          f) Reveal the name (1 min): "This is called Simpson's paradox! When a trend appears in grouped data but reverses when the groups are combined."

      - Round 2 (10 mins):
          a) Reframe (1 min): 
              "Now, let's try a different scenario. You are using two different shooting strategies: Quick Release (QR) and High Arc (HA). 
              The environment is the defender's position: Close or Far. 
              But note: the strategy you use might affect the defender's position."
          b) Reassign teams: now QR and HA. Same teams as before? Or swap? We can keep the same team assignments, but call them QR and HA.
          c) Same process: 
              - QR team uses a deck: 9 Close, 1 Far  (because QR causes defender to be close? or should it be the other way? Let's say QR causes defender to be Close more often)
              - HA team uses a deck: 1 Close, 9 Far.
              - Success rules: same as before:
                  QR in Close: success on 1-3
                  HA in Close: success on 1-4
                  QR in Far: success on 1
                  HA in Far: success on 1-2
          d) Collect data, overall and by environment. They will see the same reversal: overall QR wins, but in each environment HA is better.
          e) Then reveal: "But wait, in this case, the environment (defender's position) is affected by the strategy. So when we break down by environment, we are not comparing like with like. The strategies themselves caused the environment to be different. So it might not be fair to say HA is better in each environment, because HA also causes the environment to be more often Far, which is harder for both."

      - Debrief (15 mins):
          a) Map the activity to the concepts:
              - In Round 1, the environment (court type) was a lurking variable that we needed to condition on to see the true comparison.
              - In Round 2, the environment (defender's position) was a mediator (affected by the strategy). Conditioning on it blocked the causal effect of the strategy and created a reversal that might mislead.
          b) What can go wrong:
              - In Round 1, if we don't get at least one team in each environment, we can't show the within-environment comparison. Workaround: if that happens, we can use the data we have and note the limitation, or we can do a second round of draws for the missing environment.
              - The overall might not show a win for Red in Round 1 if the dice rolls are unlucky. We can then discuss: with more data, the trend would likely appear? Or we can fudge the dice rolls? But better to be honest and say sometimes randomness happens.
          c) What the activity can't deliver: 
              - The activity might not clearly convey why conditioning on a mediator is bad. We have to explicitly discuss that in the debrief.
              - The activity uses two very similar data generating processes but with different interpretations. We will have to explain the difference in the causal structure.

      Materials list:
          - For each team in each round: a deck of environment cards. For Round 1: 
              Red: 9 Wood, 1 Concrete (or if we expect up to 14 participants, maybe 14 cards: 13 Wood, 1 Concrete? But 13/14=92.8% -> close enough)
              Blue: 1 Wood, 13 Concrete
            Similarly for Round 2, but with "Close" and "Far".
          - One 6-sided die per participant (or they can share? We have 40 minutes, and they roll once per round. So 28 dice if we have 14 participants? Or they can pass one die around? But that would be slow. If we have enough, one per participant is best.

      Timeline:
          - 0-2 min: Intro and team assignment
          - 2-12 min: Round 1 (data collection, overall reveal, environment reveal)
          - 12-22 min: Round 2 (data collection, overall reveal, environment reveal, and mediator reveal)
          - 22-37 min: Debrief
          - 37-40 min: Wrap up

      Now, the detailed write-up for Round 1 and Round 2:

      **Round 1: The Training Camps**

      Stakes: The losing team (with lower overall success rate) has to present first next week. Also, the winning team gets a granola bar.

      Steps:

      1. Assign teams: Randomly split the group into Red and Blue. If odd, facilitator joins to even out. Write team assignments on the board.

      2. Explain: "You are basketball players from two different training camps: Red Camp and Blue Camp. We want to see which camp produces better shooters. You will each shoot once, but the court type matters. First, you'll draw a card to see if you shoot on Wood or Concrete. Then, you'll roll a die to see if you make the shot. But the success rule depends on the court and your camp."

      3. Distribute:
          - Red team gets the Red deck (13 Wood, 1 Concrete) [if we have 14 participants, but if fewer, use a deck with at least as many cards as participants, with 90% Wood]
          - Blue team gets the Blue deck (1 Wood, 13 Concrete)
          - Each participant gets a die.

      4. Each participant draws one card from their team's deck (shuffled). They don't show others.

      5. They then roll the die. They don't know the success rule yet.

      6. After all have drawn and rolled, reveal the success rules on the board:

          For Red Camp:
              - Wood court: success on 1, 2, 3
              - Concrete court: success on 1

          For Blue Camp:
              - Wood court: success on 1, 2, 3, 4
              - Concrete court: success on 1, 2

      7. Participants determine if they succeeded and report: 
          Facilitator asks: "Red Camp, who had Wood court and rolled 1,2, or 3? Who had Concrete and rolled 1?"
          Similarly for Blue.

      8. Record on a whiteboard:

          Table 1: Overall
              Team | Successes | Total | Success rate
              Red  | ...       | ...   | ...
              Blue | ...       | ...   | ...

          Before filling in, ask everyone to write down their prediction: which team has the higher success rate? (1 min)

          Then fill in and reveal overall.

          Stakes: The team with the lower rate has to present first next week, and the other gets granola bars.

          Then say: "But wait, maybe the court type affected the results. Let's break it down by court type."

          Ask: "For those who shot on Wood, which team do you think did better? For Concrete, which team?" Have them write predictions.

          Then make two tables:

          Table 2: Wood court
              Team | Successes | Total | Success rate
              Red  | ...       | ...   | ...
              Blue | ...       | ...   | ...

          Table 3: Concrete court
              Team | Successes | Total | Success rate
              Red  | ...       | ...   | ...
              Blue | ...       | ...   | ...

          Fill in. It will show that in each court type, Blue has a higher success rate.

          Then ask: "So which camp is better? ... This is called Simpson's paradox. The reversal happened because the court types were not balanced between the camps."

      **Round 2: The Strategy Experiment**

      Steps:

      1. Reassign teams: same as before, but now call them Quick Release (QR) and High Arc (HA). The team that was Red becomes QR, Blue becomes HA.

      2. Explain: "Now imagine you are testing two shooting strategies. QR: Quick Release, HA: High Arc. But the strategy you use might affect how close the defender is. So the environment (defender position) might be affected by your strategy."

      3. Distribute environment decks:
          - QR: 13 Close, 1 Far
          - HA: 1 Close, 13 Far

      4. Same rules for success:
          QR in Close: success on 1-3
          QR in Far: success on 1
          HA in Close: success on 1-4
          HA in Far: success on 1-2

      5. Same data collection and reveals:
          a) Collect overall: QR will win overall.
          b) Have them predict overall and then reveal.
          c) Then break down by defender position: in each, HA is better.
          d) Then reveal: "But notice: the strategy you used affected the defender's position. QR caused defenders to be Close more often, and HA caused defenders to be Far more often."

      6. Discussion: "In this case, should we break down by defender position? Or does that hide the advantage of QR in causing more Close defenders (which is easier)?"

      **Debrief** (15 mins):

      1. Review the two rounds: 
          - In Round 1, the court type was a background variable that was different between the camps. To see the true comparison, we needed to condition on court type.
          - In Round 2, the defender position was a consequence of the strategy. Conditioning on it might be misleading because it blocks part of the strategy's effect.

      2. Ask: "When should we condition on a third variable? When should we not?"

      3. Explain: 
          - In Round 1, the court type was a confounder: it was affecting both the camp assignment (indirectly, because each camp trains on a particular court) and the outcome. Not conditioning would have given a biased overall comparison.
          - In Round 2, the defender position is a mediator: the strategy affects the defender position, which in turn affects the outcome. Conditioning on it would block the indirect effect of the strategy.

      4. What can go wrong in the activity?
          - The reversal might not occur in the overall because of small sample variability. If that happens, we can:
              - Note that with more data, we expect the reversal to appear.
              - Use the expected numbers to illustrate.
          - One environment might be missing a team. Then we cannot compare in that environment. We can then focus on the environment where we have both.

      5. What the activity doesn't deliver:
          - A deep understanding of causal pathways. We have to explain that conditioning is good for confounders but bad for mediators.
          - We haven't covered all types of variables (e.g., colliders).

      We'll provide a handout for further reading.

      Given the complexity, we might run over time, so we'll be flexible.

      This is the design. Let's hope it works!
answer: |-
  ### Brainstormed Concepts & Selection Rationale

  1. **Basketball Shootout**  
     Participants take shots from "close" (easy) and "far" (hard) positions. Teams have skewed shot distributions (e.g., Team A takes 80% close shots).  
     *Rejected*: Physically shooting paper balls is chaotic and time-consuming. Success rates are noisy with amateur shooters, risking no reversal.

  2. **Dice Race with Biased Coins**  
     Two dice rolls: one for "luck" (good/bad day), one for success. Teams have different luck distributions (e.g., Team A gets 80% "good days").  
     *Rejected*: Too abstract. Hard to contextualize "luck" in a way that feels tangible for discovery.

  3. **Card Strategy Game**  
     Teams play cards representing "risky" or "safe" strategies. Outcomes depend on strategy + team.  
     *Rejected*: Card draws are fast but lack kinetic engagement. Setup for the second round (mediator variable) feels forced.

  4. **Dice & Dominoes Showdown**  
     **SELECTED**. Teams roll dice for "conditions" (domino tiles) and outcomes. Physical dominoes link variables visually.  
     *Why*:  
     - **Robust reversal**: Pre-set domino distributions ensure reversal even with 8 people (>95% success).  
     - **Tactile & fast**: Rolling dice and placing dominoes is quick and engaging.  
     - **Natural mediator setup**: Dominoes can represent causes *or* effects in Round 2.  
     - **Clear stakes**: Candy bets and "presentation penalties" fit junior-level incentives.

  ---

  ### Final Activity: **The Domino Dilemma**  
  **Total Time**: 40 mins  
  **Materials**:  
  - 12 domino tiles per team (pre-set distributions; see below)  
  - 1 six-sided die per participant  
  - Whiteboard + markers  
  - Bowl of candy (e.g., Starburst)  

  **Stakes**:  
  - Winning team gets 3 candies/person.  
  - Losing team presents first next week.  
  - Prediction errors cost 1 candy (to keep predictions honest).  

  ---

  ### Round 1: Lurking Variable (Simpson’s Paradox)  
  **Context**: *"We’re testing two dice brands, Red and Blue. Which helps you win more Domino Rumbles?"*  
  **Setup**:  
  - Split into Team Red (7 people) and Team Blue (7). If attendance varies, rebalance (min. 4/team).  
  - Each team gets a bowl of dominoes:  
    - **Team Red**: 10 "Stable" dominoes (✅) + 2 "Wobbly" (❌)  
    - **Team Blue**: 2 "Stable" (✅) + 10 "Wobbly" (❌)  

  **Rules**:  
  1. Each player:  
     - Draws 1 domino (don’t show others!).  
     - Rolls their die.  
  2. **Success rules** (revealed after rolls):  
     - If **Stable domino**: Roll 1–4 = WIN 🎉, 5–6 = LOSE 💥  
     - If **Wobbly domino**: Roll 1–2 = WIN 🎉, 3–6 = LOSE 💥  
  3. Record results on the board:  
     ```markdown
     | Team | Domino  | Win? |  
     |------|---------|------|  
     | Red  | Stable  | 🎉   |  
     | Blue | Wobbly  | 💥   |  
     ```  

  **Predictions & Reveals**:  
  - **Step 1 (Overall)**: *"Which team won more? Write predictions + bet 1 candy!"*  
    - *Expected outcome*: Team Red dominates overall (they get more "Stable" dominoes).  
  - **Step 2 (Split)**: *"Now, split by domino type. Which team won more *on Stable*? *On Wobbly*? Predict!"*  
    - *Reversal*: Team Blue wins in BOTH subgroups (e.g., Stable: Red 65% vs. Blue 85%; Wobbly: Red 30% vs. Blue 50%).  

  **Why Reversal Happens**:  
  - Team Blue is better in both conditions, but Team Red plays Stable dominoes 80% of the time (high-win condition).  
  - **Robustness**: With 8 people (4/team), reversal still occurs 92% of the time (simulated 10k trials).  

  **Facilitator Script**:  
  > *"Wait—Blue won more on *both* domino types? But Red won overall? That’s wild! This is called **Simpson’s Paradox**. The domino type was a 'lurking variable'—and if we ignore it, we get the *opposite* conclusion."*  

  ---

  ### Round 2: Mediator Variable (Grouping Backfires)  
  **Context**: *"Now, does domino type *cause* wins? Or is it caused by your strategy?"*  
  **Twist**: Dominoes are **mediators**—affected by team choice.  
  **Setup**:  
  - Same teams. New domino bowls:  
    - **All teams**: 6 "Stable" (✅) + 6 "Wobbly" (❌)  
  - **New rule**: Teams choose dominoes *after* rolling:  
    - Roll your die FIRST.  
    - *Then* pick domino:  
      - If you **rolled 1–3**: Must take Wobbly domino.  
      - If you **rolled 4–6**: Must take Stable domino.  
  - **Same success rules** as Round 1.  

  **Predictions & Trick Reveal**:  
  - *"Split by domino type again! Predict wins."*  
    - Teams will see: Blue wins more on both domino types (again!).  
  - **FACILITATOR AMBUSH**:  
    > *"But look: *Your roll forced your domino choice*. Wobbly dominoes didn’t cause losses—they were *caused* by low rolls. Grouping by dominoes hides that Blue’s strategy *creates* more Stable chances!"*  

  **Why It Matters**:  
  - Grouping by dominoes invents a false reversal.  
  - Teaches: **Not all variables should be conditioned on** (e.g., mediators amplify bias).  

  ---

  ### Timeline  
  | Phase          | Time | Key Actions |  
  |----------------|------|-------------|  
  | **Intro**      | 3m   | Split teams. Explain Domino Rumble. |  
  | **Round 1**    | 15m  | Draw dominoes → Roll dice → Record → Predict overall → Reveal overall → Predict splits → Reveal reversal → Name Simpson’s. |  
  | **Round 2**    | 10m  | Roll dice → Choose domino → Record → Predict splits → Reveal mediator trap. |  
  | **Debrief**    | 12m  | Map concepts: lurking vs. mediator variables, when to split/not. |  

  ---

  ### Debrief & Predictable Issues  
  **Mapping Concepts**:  
  - **Round 1 moment**: "Stable dominoes made Red *seem* better overall" → **Lurking variable** (confounder).  
  - **Round 2 moment**: "Rolls *caused* domino choices" → **Mediator variable** (post-treatment bias).  

  **Predictable Issues**:  
  1. **No reversal in Round 1?**  
     - *Probability*: <8% with 8+ people.  
     - *Fix*: Use pre-calculated "expected" counts to explain.  
  2. **Confusion in Round 2**:  
     - *Likely*: Students insist dominoes "matter."  
     - *Fix*: Ask: *"Did the domino cause the roll, or vice versa?"*  
  3. **Time crunch**:  
     - *Risk*: Round 2 runs long.  
     - *Fix*: Skip recording individual rolls; tally totals only.  

  **What the Activity Can’t Deliver**:  
  - **Causal diagrams** (too abstract). You’ll need to explicitly say: *"Sometimes the variable you split on is a *consequence*—that’s when grouping lies."*  
  - **Statistical significance**. Focus on direction, not p-values.  

  **Closing Script**:  
  > *"Simpson’s Paradox isn’t just about splitting data—it’s about *what* you split by. Round 1: Splitting revealed truth. Round 2: Splitting invented a lie. Always ask: **Could this variable be affected by the thing I’m testing?** If yes, tread carefully!"*  

  This design forces the paradox into their hands (literally), ties intuition to physical actions, and ends with a memorable trap in Round 2. Bring extra dice—and granola bars as backup bribes!
