  Q2's asymmetry concern is fascinating. Marta isn't wrong phenomenologically - musicians feel they're executing instructions while archivists reconstruct. But Witt's point is ontological: both directions rely on the same abstract mapping rules. The narrative tension here is gold - Marta's lived experience vs philosophical perspective. Should validate both.

