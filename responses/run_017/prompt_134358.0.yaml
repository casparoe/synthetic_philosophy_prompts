prompt: |-
  I am writing a critical notice of a recent monograph that defends a relational, Ubuntu-informed conception of personhood, and I have arranged with its author to close the piece with her reply to one case that, as far as I can tell, she has never ruled on. Before I send it, I want to anticipate her answer, because it determines which of two objections I develop in the body of the notice.

  Her verdicts so far, as I have tabulated them from the book and from the papers that preceded it. She holds that personhood is attained through incorporation into a web of relations rather than given with biological humanity.

  1. A boy found at fourteen after being raised without sustained human contact, who acquires language and reciprocal exchange within two years of rescue: he was, she says, a person before he was found; what was done to him was a wrong of exclusion; rescue is not the moment at which he became one.
  2. A man in a persistent vegetative state, with no family, no friends and no visitors: no longer a person; what remains is a living human body owed respectful handling and decent burial, and life-prolonging treatment may be withdrawn. In a footnote she remarks that the case would be harder if relatives were at the bedside speaking to him daily, and declines to say what she would hold then.
  3. A chimpanzee reared from infancy in a human household, taught signs, addressed as a member of the family: not a person, but its relational embeddedness raises its moral status well above that of other animals, and it could not permissibly be enrolled in the kinds of non-therapeutic study we permit for laboratory animals.
  4. A newborn infant: not yet a person in the full sense, but owed nearly the whole protection owed to persons, and in any case more than the enculturated chimpanzee in (3).
  5. An anencephalic infant: never a person. The devotion of its parents generates duties concerning the infant, not duties to it, and she insists that this distinction is load-bearing for her account.
  6. A recluse who has severed every relationship and refuses contact: still a person, and his refusal must be respected. Any account, she says, on which a community could divest someone of personhood merely by withdrawing recognition is unacceptable.
  7. She sets aside the case of ancestors and the dead, on the ground that whether being remembered can itself carry status depends on claims about the persistence of the subject that she does not want her view to rest on.

  The case I want to put to her is this. Mrs K. is seventy-eight and in the advanced stage of Alzheimer's disease. She no longer recognises her daughter, does not initiate exchange, and has almost no speech; she still settles to her daughter's touch, smiles at music she has known since childhood, and becomes agitated in unfamiliar surroundings. Her daughter visits daily, speaks to her, tells her about the family, and reports — as do the neighbours who call in — that she is still addressed and still treated as a full member of the household. The clinical team proposes enrolling her, with her daughter acting as proxy, in a trial of a new compound that offers her no prospect of benefit, requires weekly lumbar punctures, carries a small but real risk of serious harm, and is expected to yield knowledge that will help future patients. Her daughter consents.

  What I would like from you is the following. First, set out the two or three rules that fit verdicts (1) through (6) equally well — my own suspicion is that the fault line lies between views on which the capacity for mutual recognition does all the work and views on which actual relations can carry personhood once that capacity fades, but I want to know whether there is a third formulation that fits the record just as well. Second, say what each rule implies both about whether Mrs K. is still a person and about whether she may be enrolled; note that (3) blocks any quick inference from not being a person to being available for research. Third, tell me which verdict you expect her to give, with your reasons for preferring that rule — and in particular tell me whether the rule that best reconciles the footnote to (2) with the remark in (6) is genuinely consistent with that remark, since on its face a view that lets relations sustain personhood after the capacity is gone also seems to let abandonment extinguish it, which is precisely what she says no acceptable view can allow. Finally, give me the further case that would separate whichever rules survive that test.

  One variant I am also considering, and would like your read on: the daughter has emigrated, and Mrs K.'s only daily relational contact is with a commercial companion system that speaks to her for an hour each day in a voice modelled on her daughter's, drawing on the family's photographs and stories; the daughter reads the transcripts and visits twice a year. How much should the verdict change, and which of the rules is most sensitive to the substitution of simulated recognition for actual recognition, and why?
reasoning: |-
  Hmm, this is a fascinating philosophical challenge about relational personhood. The user is writing a critical notice on a monograph defending Ubuntu-informed personhood and needs to anticipate the author's response to an Alzheimer's case. They've provided seven precedents and want me to: 1) extract underlying rules, 2) apply them to Mrs. K's case, 3) predict the author's verdict, and 4) propose a test case.

  Looking at the precedents, I notice three key tensions. First, between actual relations and relational capacity (seen in the wild child vs. recluse cases). Second, between biological humanity and relational status (anencephalic infant vs. chimpanzee). Third, the special problem of abandonment raised in case 6.

  For rule extraction, I'm considering:
  - Rule A: Personhood requires demonstrated capacity for mutual recognition. This explains why the wild child was always a person (had capacity) but the anencephalic infant wasn't. 
  - Rule B: Personhood requires active relational embedding. This handles the vegetative state case but struggles with the recluse. 
  - Rule C: A hybrid where capacity establishes personhood, but active relations sustain it when capacity fades. This might bridge cases 2 and 6.

  Applying these to Mrs. K: 
  - Rule A would likely say she's not a person (lost recognition capacity), but enrollment may still be forbidden due to residual relations (like the chimpanzee).
  - Rule B would maintain she's still a person due to daughter's active treatment.
  - Rule C would struggle - is her minimal responsiveness enough "capacity"?

  The footnote in case 2 and remark in case 6 create a puzzle. If relations can sustain personhood (as footnote suggests), doesn't that imply abandonment could remove it? Yet case 6 explicitly rejects this. The author might resolve this by distinguishing chosen isolation (recluse) from imposed abandonment.

  For the variant case with simulated companionship, Rule B becomes problematic - can AI maintain personhood? Rule A might be more consistent here since there's no actual mutual recognition.

  The hardest test case would involve someone with full capacity but completely abandoned by society. If the author says they're still a person (consistent with recluse), it confirms Rule A. If not, it leans toward Rule B.

  I think the author will declare Mrs. K still a person, emphasizing the daughter's active recognition. The simulated case might get a different verdict, highlighting that actual mutual recognition matters. This maintains consistency with the recluse case because his isolation is chosen, not imposed.
answer: |-
  Based on the author's established verdicts and principles, here's a systematic breakdown addressing your queries:

  ### Part 1: Competing Rules Fitting Verdicts (1)-(6)
  1. **Rule A (Capacity-Centric):**  
     *Personhood requires a demonstrated capacity for mutual recognition (past or present), and actual relations protect existing personhood but cannot create it anew without capacity.*  
     - Fits: (1) Wild child had latent capacity; (2) PVS patient lost capacity; (3) Chimp lacks human-level capacity; (4) Infant has potential capacity; (5) Anencephalic infant lacks capacity; (6) Recluse retains capacity.  

  2. **Rule B (Relation-Centric):**  
     *Personhood is sustained by active relational embedding in a human community, regardless of current capacity, provided it was once established.*  
     - Fits: (1) Exclusion wrong implies latent relational status; (2) PVS patient lacks relations; (3) Chimp embedded but not in human moral community; (4) Infant is relationally embedded; (5) Anencephalic infant never embedded; (6) Recluse's history sustains personhood.  

  3. **Rule C (Hybrid):**  
     *Personhood is initiated by capacity for mutual recognition, but once established, can be maintained by active relational recognition from others even after capacity fades.*  
     - Fits: (1) Capacity existed pre-rescue; (2) PVS patient lost capacity + relations; (3) Chimp never had human personhood-capacity; (4) Infant has emergent capacity; (5) Anencephalic infant lacks both; (6) Recluse's capacity persists.  

  **Fault Line Confirmed:** Your suspicion is correct. Rule A prioritizes *capacity* (internal to the individual), Rule B prioritizes *actual relations* (external), and Rule C blends both. All three fit the data, but tensions arise in marginal cases.

  ---

  ### Part 2: Implications for Mrs. K.
  - **Mrs. K.'s Status & Enrollment:**  
    - **Rule A:** *Not a person* (no current capacity for mutual recognition). *But:* Enrollment may still be impermissible due to residual relational status (analogous to the chimp in (3)). Moral status is elevated by daughter's recognition, blocking non-therapeutic research.  
    - **Rule B:** *Is a person* (actively embedded via daughter/neighbors). Enrollment violates duties *to her* as a person; consent by proxy invalid if against her interests.  
    - **Rule C:** *Likely still a person* (capacity was established, now sustained by daughter's active recognition). Enrollment impermissible without therapeutic benefit.  

  ---

  ### Part 3: Predicted Verdict & Consistency Test
  - **Prediction:** The author will declare Mrs. K. **still a person** (Rule B or C).  
    - **Reasons:**  
      1. **Relational Continuity:** Daughter’s daily recognition and household treatment mirror the "harder case" in (2)’s footnote, suggesting relations sustain status.  
      2. **Anti-Abandonment Principle:** Rule B/C aligns with (6): Mrs. K. is not *choosing* isolation (like the recluse), so relational efforts preserve personhood. Abandonment would require *active community withdrawal*, not just incapacity.  
      3. **Distinction from Anencephaly:** Unlike (5), Mrs. K. had established personhood and relational history.  

  - **Consistency with (6):**  
    - **Rule B/C Consistency:** Yes, if abandonment is framed as *deliberate community renunciation* (e.g., society exiling the recluse). The recluse *retains capacity* and *chooses* isolation, while Mrs. K. *lacks capacity* but is *sustained by others*. The author can consistently hold that relations preserve personhood post-capacity without allowing abandonment to extinguish it, provided:  
      - Personhood was previously established via capacity, *and*  
      - The community does not actively withdraw recognition.  
    - **Inconsistency Risk:** If the recluse *lost capacity* and was abandoned, Rule B/C *might* imply lost personhood—but this case hasn’t been tested.  

  ---

  ### Part 4: Test Case to Separate Rules  
  **The Stranded Neuroscientist:**  
  A linguist (with full capacity) is marooned alone on an island with no hope of rescue. She keeps a detailed diary addressing her family but has no actual contact. After 20 years, she is found. *Is she still a person during isolation?*  
  - **Rule A:** Yes (capacity persists).  
  - **Rule B:** No (no active relational embedding).  
  - **Rule C:** Debatable (lacks *active* recognition from others).  
  *This forces a choice between capacity and actual relations in the absence of community.*  

  ---

  ### Variant Case: Simulated Recognition  
  **Mrs. K. with AI "Companion":**  
  - **Rule A:** Unchanged (no capacity → not a person). Moral status may be lower than human-embedded chimp (no *genuine* relations), potentially permitting enrollment.  
  - **Rule B:** *Not a person* (simulation ≠ actual relational embedding). Enrollment more defensible.  
  - **Rule C:** *Not a person* (AI lacks *human recognition*; daughter’s passive engagement insufficient). Enrollment likely permissible.  

  **Which Rule Is Most Sensitive?**  
  - **Rule B** is most sensitive: It collapses without *authentic human reciprocity*. The chimp (3) had real human relations; AI does not.  
  - **Predicted Author Verdict:** She would likely deny personhood here, distinguishing simulated from actual recognition. This aligns with her emphasis on *human relationality* in Ubuntu ethics.  

  ---

  ### Recommendation  
  Develop both objections but structure the notice to highlight the **capacity-vs.-relations tension**. The author will likely defend Mrs. K.'s personhood via Rule C, leveraging the footnote in (2) and distinguishing abandonment from incapacity. The simulated case tests the limits of her relationalism—if she denies personhood there, it confirms Rule B is unsustainable for her view.
