answer: |-
  ## Dialogue: The Audit and the Argument

  **Setting:** A quiet corner of the Neurodynamics Lab cafeteria, late afternoon. Dr. Aris Thorne (exclusionist) and Dr. Lena Voss (compatibilist) sit with tablets displaying schematics of the Audit. Half-finished coffees sit between them.

  **Characters:**
  *   **Dr. Aris Thorne:** Exclusionist. Favors sharp causal boundaries, wary of causal inflation. Believes the Audit decisively supports exclusion.
  *   **Dr. Lena Voss:** Compatibilist. Emphasizes robustness, patterns, and the indispensability of coarse-grained causal explanation. Believes the Audit reveals mental causation’s distinct role.

  **(Dialogue Begins)**

  **Thorne:** (Tapping his tablet) Lena, look at this. The Audit settles it. Minimal, complete base-grain model: every variable is necessary for *some* counterfactual. The button press is fully accounted for by the precise neural states and environmental inputs at t-minus-whatever. Then the modelers *add* this "decision" variable – a coarse-grained determinable. But Feature Four: you can’t *touch* the decision without manipulating its specific neural realization. How is it doing any *additional* causing? It’s like stamping "DECISION" on the package already delivered by the base grain. Causal bookkeeping screams: redundant entry!

  **Voss:** Aris, it’s not redundant. Look at Feature Three – the *variability finding*. The base-grain antecedent was different every single time! Yet the button press happened. The *only* constant, the *best* difference-maker across all these trials, was this coarse-grained decision state. It’s like the base grain gives you ten thousand different ways the watch tells the time; the decision variable *is* the time-telling function itself. It captures a causal robustness that no single base-grain state can. That’s not inflation; it’s capturing a real causal pattern the fine grain obscures. Grain neutrality means we shouldn’t penalize a cause for being described coarsely when its causal profile is evident.

  **Thorne:** But how can that robust pattern *itself* be a cause, distinct from its realizers? Imagine intervening to *prevent* the press. According to the Audit’s completeness, you *must* intervene on some specific base-grain state – you tweak neuron cluster A, or synaptic pattern B, or whatever. There’s simply no room – no causal *slack* – for the coarse decision to be doing its *own* preventing work *alongside* that base-grain intervention. If you say it *is* causing the prevention, then every time a neural state causes something, its coarse-grained determinable is *also* causing it. That’s systematic overdetermination on an industrial scale! And it’s guaranteed, not coincidental – Feature Four ensures it. Isn’t that precisely the kind of bloated ontology causal bookkeeping forbids? Adding a variable nomically tied to existing ones shouldn’t magically create new causes.

  **Voss:** You’re conflating levels and mistaking identity for exclusion. First, the overdetermination worry. If the coarse state and the fine state were truly independent causes, like two bullets hitting simultaneously, systematic overdetermination *would* be absurd. But here, the coarse state is *constituted* by the fine state. It’s not a separate entity throwing its weight around; it *is* the causal profile manifest across variations. Causing *via* a realizer doesn’t make the constituted property’s causal relevance vanish. Second, causal bookkeeping isn’t violated by adding a variable that provides *explanatory traction* the fine grain lacks – like predicting what happens if the *type* of decision changes, regardless of its neural implementation, which the variability finding shows is crucial. The Audit proves the coarse variable isn’t otiose; it changes counterfactuals the base grain alone can’t express.

  **Thorne:** Explanatory traction isn’t causal *efficacy*. I concede your point about the variability finding: the coarse description allows us to see a pattern, an invariance, that’s invisible at the fine grain. That pattern is useful for prediction and explanation *across variations*. Fine. But does that pattern *make things happen*? When we intervene – as Feature Four forces us to acknowledge – we intervene on the *realizer*, not the determinable *as such*. The causal *oomph* is located entirely at the base grain. The coarse variable tracks a reliable correlation, a useful summary, but it’s epiphenomenal to the actual causal transaction. Grain neutrality shouldn’t mean that every level of description gets its *own* causal power; it means the *same* causal relation can be described finely or coarsely. Here, the causal relation is fundamentally anchored at the base grain.

  **Voss:** Ah, but that’s where *your* view violates grain neutrality! You say the causal relation is "anchored at the base grain." But which base grain? The Audit’s "base grain" is neural. Is it fundamental physics? You hinted earlier this matters. If the Audit’s base grain *isn't* fundamental, then by your own logic, some *even finer* physical grain – quarks, strings, whatever – would exclude the neural variables you’re privileging! Your argument either assumes a privileged fundamental level from the start, which begs the question against higher-level causation, or it triggers an infinite regress. The compatibilist avoids this: causation is grain-relative. What counts as a cause depends on the grain of description appropriate to the effect and the context of inquiry. The decision causes the press *at the grain of behavior*.

  **Thorne:** That’s too quick, Lena. First, whether the Audit’s base grain is fundamental *is* crucial. If it’s *not*, then the Audit’s "completeness" claim *is* question-begging for the purposes of excluding the mental. We’d need a genuinely fundamental model to run the exclusion argument properly against *all* higher levels. However – and this is my concession – *if* the Audit’s base grain *is* fundamental, or even if it’s not but we stipulate that *some* complete minimal fundamental model exists (which physics suggests it does), then the argument *does* generalize. But that’s not the reductio you think it is! It *is* a discovery: macro-causation in geology, economics, *and* psychology is indeed realized by, and metaphysically dependent on, micro-causation. The special sciences describe robust patterns *supervening* on fundamental causation; they don’t introduce *new* fundamental forces. Feature Four – the no-independent-handle – is key. It shows the mental lacks the autonomy for genuine *sui generis* causation.

  **Voss:** But Aris, your "discovery" drains causation from the levels where we actually live, explain, and act. The Audit shows the decision is *the* best difference-maker for the press across trials. To say it’s not *really* causing it, while a specific neural state that only occurred once is, seems perverse! It violates the principle of proportionality – causes should be described at the grain that best matches the effect’s invariance. The press is a coarse-grained action; its most proportional cause is the coarse-grained decision. The fine-grained neural state is *too* specific; it captures irrelevant detail. Saying the fine state causes the press only makes sense *relative to* the possibility of other fine states causing *different* actions, but that’s precisely the contrast the coarse-grained decision variable controls across trials! The decision isn’t just tracking; it’s *doing* the difference-making work for that type of effect in that context.

  **Thorne:** Proportionality is contrast-sensitive, I agree. But that doesn’t rescue the mental cause; it just relocates the problem. When we ask, "Why did she press *rather than not press*?", the coarse decision seems proportional. But the Audit shows that "decision = press" is *realized by* different neural states on different trials. So, for the *actual* press on *this* trial, what makes the difference between pressing and not pressing is the *specific* neural state S1 (say). If the decision had been "don't press," it would have been realized by some *other* neural state S2. The *counterfactual dependency* for the *actual* effect runs through S1, not directly through the determinable. The determinable’s role is derivative, parasitic on the efficacy of its determinates. It governs *types* of effects across *types* of realizations, but for the *token* effect, the *token* realizer does the work. That’s why adding it violates bookkeeping for *this* token causation.

  **Voss:** And that’s the crux, Aris. You insist on anchoring token causation solely to the maximally specific realizer. I say token causation can be multiply realized *at a grain*, and the causal relevance of the determinable is precisely its role in ensuring that *some* determinate or other realizing it will produce the effect – a role empirically demonstrated by the variability finding and captured in the counterfactuals it supports. The Audit forces us to choose: either we accept that robust, multiply realizable patterns like decisions can be genuine difference-makers, making special science causation legitimate, or we commit to a causal ontology where only the finest grain has efficacy, rendering macro-causation an illusion. Feature Four, the no-independent-handle, doesn’t show the mental is impotent; it shows its efficacy is *implemented* via its realizers, not that it isn’t real. Grain neutrality demands we recognize the decision as a cause.

  **Thorne:** And causal bookkeeping, coupled with the completeness of the base model and the lack of causal slack, demands we see its addition as inflationary for *this* token event. The variability finding shows a pattern, essential for science, but not an additional *token* cause here and now. The fate of mental causation hinges entirely on this: **Does causal bookkeeping require the elimination of all but one variable per "causal slot" when variables are nomically tied, even if the eliminated variable supports unique counterfactuals at a coarser grain?** I say yes. You say no. The Audit, with its brutal minimality and no-independent-handle, makes the "yes" overwhelmingly plausible. Otherwise, we license causal profligacy.

  **Voss:** And I say the Audit, with its variability finding, shows why that "no" is essential for a coherent account of agency and the special sciences. Otherwise, we descend into causal nihilism for anything above quarks. The "slot" metaphor is the root of the mistake – causation isn't filling slots; it's patterns of dependence manifest at different levels of abstraction. The decision *is* a cause. (She gathers her tablet, the debate unresolved but the battleground starkly clear).

  **(End of Dialogue)**

  ---

  **Author's Note:**

  I believe Voss (the compatibilist) has the better of this exchange. The decisive premise is **causal bookkeeping**, specifically its interpretation. Thorne interprets it as demanding that only one variable per "causal slot" in a complete, minimal model can be a cause, leading to exclusion. Voss interprets it as forbidding otiose additions *that add no explanatory/counterfactual power*. The Audit's variability finding decisively shows the coarse-grained variable *is not otiose*; it captures essential counterfactuals the fine grain obscures. Therefore, adding it doesn't violate a reasonable principle of bookkeeping; it enriches our causal understanding. Thorne's stricter interpretation, while internally consistent, ultimately sacrifices the indispensable causal explanations of the special sciences on the altar of micro-reductionism, violating grain neutrality in practice if not in stated principle.

  The dialogue leans contestably on the **interpretation of the "no-independent-handle" result (Feature 4)**. Thorne reads it as proof the mental lacks autonomous causal power. Voss reads it as merely showing the *implementation mechanism* of its causal power. The stipulations don't definitively settle which reading is correct; it depends on prior commitments about whether causal powers require *independent* manipulability or whether manipulability *via* realizers suffices. I side with Voss: requiring independent manipulability is an overly stringent condition that ignores how higher-level properties exercise their causal powers *through* their realizers, a view supported by the variability finding's evidence of robust causal patterning. The exclusion argument, as sharpened by the Audit, ultimately fails because it imposes an unrealistically narrow criterion for causal efficacy that the special sciences cannot meet, mistaking realization for exclusion.
