  ### Simpson's Paradox Personality Quiz: "Which Stats Mindset Are You?"

  Hey, great choice for a project! I've designed a 10-question quiz based on real Simpson's paradox cases. Each question has three plausible options, none explicitly named by statistical terms. The scoring categorizes respondents into six statistical mindsets (with two indistinguishable pairs). I've included all your requested cases and leaves.

  ---

  #### **Quiz Questions**

  **Question 1: Medical Treatment Decision**  
  *Data shows Drug X has a lower overall recovery rate than the placebo. But when split by disease severity (mild/severe), Drug X has a higher recovery rate in both groups. You’re advising a hospital. What do you recommend?*  
  A) Avoid Drug X—overall results show harm.  
  B) Use Drug X—it works for all severities.  
  C) It depends on how many mild/severe patients they typically see.

  **Question 2: University Admissions**  
  *Overall, men are admitted to a university at a higher rate than women. When split by department (Engineering/Humanities), women have a higher admission rate in both. Is there gender bias?*  
  A) Yes—the overall rate shows bias against women.  
  B) No—department-level rates show no bias.  
  C) The bias might be in how applicants choose departments.

  **Question 3: Batting Averages**  
  *Player A beats Player B in batting average (hits/at-bats) in both Season 1 and Season 2. But over both seasons combined, Player B has a higher average. Who had a better two-season performance?*  
  A) Player B—combined averages don’t lie.  
  B) Player A—they won each season.  
  C) This flips because averages are ratios; total hits tell a different story.

  **Question 4: Job Training Program**  
  *A program improves job performance overall. But when split by employee "post-training motivation," those with high or low motivation who did the program perform worse than non-participants. Is the program effective?*  
  A) Yes—overall results are positive.  
  B) No—it harms everyone when split by motivation.  
  C) Motivation is caused by training—splitting hides the real effect.

  **Question 5: Genetic Risk Study**  
  *A study finds no link between Gene X and Disease Y overall. When split by biomarker levels, Gene X appears linked to Disease Y in both groups. Is Gene X a risk?*  
  A) No—overall data shows no link.  
  B) Yes—split data finds a consistent link.  
  C) The biomarker is caused by both—splitting creates false links.

  **Question 6: Prescribing Without Full Info**  
  *(Same as Q1’s drug data). You’re a doctor with a patient of unknown severity. Prescribe Drug X?*  
  A) No—overall harm is too risky.  
  B) Yes—it helps all subgroups.  
  C) Only if I know the patient’s severity first.

  **Question 7: Sales Team Performance**  
  *Salesperson A has a higher overall commission rate (commission/sales) than B. But for every product type, B has a higher rate. Who’s better?*  
  A) A—overall rate accounts for sales mix.  
  B) B—they outperform in every product.  
  C) "Better" depends on context: per-product or overall.

  **Question 8: Political Poll Splitting**  
  *A poll shows Candidate X leading overall. After splitting by last-name initials (A-M/N-Z), Candidate Y leads in both groups. Which result is reliable?*  
  A) Overall—X is truly ahead.  
  B) Split—Y wins both groups.  
  C) Last-name splits are arbitrary—use only meaningful splits.

  **Question 9: School Teaching Method**  
  *A new teaching method has a lower overall pass rate than the old one. But in advanced classes, it has a 90% vs. 95% pass rate (old wins); in regular classes, it has 60% vs. 50% (new wins). Adopt it?*  
  A) No—overall results are worse.  
  B) Only for regular classes—it helps there.  
  C) Depends on how many advanced/regular classes exist.

  **Question 10: Marketing Campaigns**  
  *Campaign A has higher overall sales than B. When split by customer type (new/returning), Campaign B has higher sales in both groups. Which campaign is better?*  
  A) A—overall sales are higher.  
  B) B—it wins with both customer types.  
  C) Customer type is affected by the campaign—splitting misleads.

  ---

  #### **Scoring Key**
  Each answer corresponds to a statistical mindset. Tally how many times a respondent picks options aligned with each leaf:

  | Leaf (Mindset)                            | Aligned Answers                                                                                                                                          | Cannot Distinguish From         |
  |------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------|
  | **A: Marginalist** (Report combined data) | Q1A, Q2A, Q3A, Q4A, Q5A, Q6A, Q7A, Q8A, Q9A, Q10A                                                                                                       | —                              |
  | **B: Splitter** (Split by all variables)  | Q1B, Q2B, Q3B, Q4B, Q5B, Q6B, Q7B, Q8B, Q9B, Q10B                                                                                                       | **C** (in Q1, Q2, Q6)          |
  | **C: Confounder Adjuster** (Adjust only for common causes) | Q1B, Q2B, Q4C, Q5C, Q6B, Q8C, Q9B, Q10C                                                                                                             | **B** (in Q1, Q2, Q6)          |
  | **D: Contextualist** (No single effect)   | Q7C                                                                                                                                                      | —                              |
  | **E: Decisionist** (Depends on decision context) | Q1C, Q2C, Q6C, Q9C                                                                                                                                     | —                              |
  | **F: Ratio Skeptic** (Reversal = ratio artifact) | Q3C                                                                                                                                                      | —                              |

  **How to Score**:  
  - Count how many answers match each leaf’s aligned options.  
  - Highest score wins. Ties indicate blended views (e.g., **B** and **C** if tied on 3+ shared answers).  
  - **Unattractive/rare patterns**:  
    - Choosing only **D** or **F** (only 1 question each)—overly narrow.  
    - Mixing **A** (no splits) with **B** (always split)—contradictory.  
    - **E + A/B/C conflicts**: "Depends on context" but also demands one-size-fits-all splits/aggregates.  

  **Which Question Does the Heavy Lifting?**  
  Q4 and Q5 (adjusting for mediators/colliders) best separate **B** and **C**. Splitters (**B**) split unconditionally; Confounder Adjusters (**C**) avoid splitting when the variable is caused by treatment/outcome.  

  **Why This Works for Classmates**:  
  - No jargon (e.g., "confounder" becomes "common cause" in the scoring key).  
  - Cases from sports, medicine, and admissions keep it relatable.  
  - Ambiguous options prevent "right-answer" pattern-guessing.  

