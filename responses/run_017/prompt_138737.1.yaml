prompt: |-
  I am the registrar and collections manager of a mid-sized municipal museum: roughly nine thousand objects, mostly European paintings, prints and decorative arts, plus a small contemporary collection that includes several works acquired as certificates and instructions rather than as unique objects. Three or four times a year something turns up that makes us unsure what we actually have — a technical report, a new attribution in the literature, a dealer's opinion, an heir's photograph, an unsolicited email from someone who claims a forgery ring. Each time this happens the same argument starts, and it never resolves: the curator says the object in front of us has not changed and still does everything a visitor needs it to do; the director worries about donors and about the reproduction of one image on half the city's promotional material; the finance office points out that our insurance schedule is keyed to attribution, so a change of wording has a money consequence; someone on the board asks why we are wasting money on a question that makes no difference to how the thing looks. I want to stop having that argument from scratch.

  What I need from you is a written decision procedure my office can run on any case where what is in question is what an object is: whether it is by the hand claimed, whether it is of the period claimed, whether it is an original, a version, a studio product, a later copy, an imitation, or a fake. It should issue in one of a small number of dispositions — keep as catalogued; keep on display with a changed credit line or label; keep with a changed label and a changed valuation; withdraw from display; decline or return a gift; refer elsewhere — and it should say what has to be established to reach each.

  Please ground the steps in whatever the philosophy of art actually establishes about what is lost when an original turns out to be a copy, and about why that loss is not, or not only, a perceptual one. I do not want the literature summarised for its own sake; I want its distinctions doing work inside the steps. In particular, I have found that the arguments that blow up in committee are always one of four, and I would like the procedure built around them unless you think the decomposition is wrong:

  One, the perceptual question — whether anything available to a competent viewer, looking at the object as it hangs, changes if it is a copy. My experience is that it does not, and I want the procedure to say exactly what follows from that, so that people who stop at this step can be told where else their objection has to go.

  Two, the question of whose doing this is and under what constraints it was done. The difference between working towards an achievement and working backwards from an effect that already exists seems to me to be doing more real work here than the question of how the object looks, but I have never been able to say it in a sentence the board will accept.

  Three, the question of what the object now tells us. Even an untouched picture becomes a different witness once we know it was made in 1920 rather than 1660, and my sense is that this, rather than beauty, is where most of the damage of a forgery actually lies — including the damage to everyone who has written about it in good faith.

  Four, the question of what we have promised: to the public buying a ticket, to the donor or lender, to the field that cites our catalogue.

  Three further constraints. First, the procedure has to be runnable by me and one assistant with no conservation training, in about a working day per case, because the external conservation scientist takes four months and every report has to be justified against the acquisitions budget. Say explicitly what to do when the evidence will not settle the matter, who carries the burden, what the interim disposition is, and how long an interim label may stand. Second, it must handle the contemporary works that arrive as certificates: I have been told there is a technical term for works whose identity conditions allow correct instances to be produced later, under supervision, after the artist's death, and I want to know whether those go through the same procedure, a branch of it, or none of it. Third, it must give me graded label wording for weakened attributions — the trade's formulae along the lines of studio of, circle of, follower of, manner of, after — together with the rule for choosing between them, and it must say what each does to the insurance figure.

  Run the finished procedure on these, with the reasoning shown:

  A. A seventeenth-century cabinet picture bought in 1974 as an autograph work. Technical imaging now shows it to be a contemporary workshop version, probably painted partly by the master and partly by an assistant, and probably sold at the time without any claim one way or the other. Nothing about it as an object has changed. What does the label say, what does it do to the valuation, and what happens to the seventy-four file?

  B. A light work acquired in 2011 as a certificate with the artist's fabrication instructions, fabricated under studio supervision and accessioned as the work itself. The artist has since publicly disavowed our instance on political grounds, while continuing to license identical instances elsewhere, and has asked us to label it as unauthorised. Is this the same kind of question as A at all?

  C. A painting that has hung here for forty years, is the single most reproduced image we own, and was shown by technical evidence to be the work of a known imitator of the master we catalogued it under. Our curators are privately of the view that it is a better picture than any genuine work by that master that we could ever afford. A dealer has offered a serious sum for it on the understanding that it will be resold, at a markup, as a celebrated forgery.

  Also give the procedure a stated position on a standing practice of ours: for four months each year a light-sensitive painting comes off the wall and a high-grade reproduction goes into its frame, and the only disclosure is a line in small print at the bottom of the wall text. Tell me whether that is anyone's business but the conservator's.

  Finally, two things. Mark, at each step, the places where judgment genuinely cannot be eliminated and has to be handed to me, to the director, to the board, or to our lawyers — including anything that is really a question of rightful ownership rather than of what the object is. And tell me plainly which of the cases above comes out against us. I would rather have a procedure that returns an answer my director will hate than one quietly rigged so that everything we already do turns out to be defensible.
reasoning: |-
  We are designing a decision procedure for the museum to handle questions about the identity of objects (attribution, authenticity, period, etc.). The procedure must address four core questions that often cause arguments, and it must lead to one of several dispositions. The steps should be grounded in philosophical distinctions about what is lost when an original is a copy, emphasizing non-perceptual factors.

  Core Philosophical Grounding:
  1. Perceptual Identity: A copy may be perceptually indistinguishable from the original, but that does not settle the matter. The philosophical insight (from thinkers like Arthur Danto, Nelson Goodman, and others) is that the artwork is not just the physical object but also involves its history of production, its context, and the intentions behind it. Thus, even if the object looks the same, its meaning and value as an artwork change when we learn it is a copy or forgery.

  2. The Importance of Origin: The distinction between an original and a copy lies in the work's genesis. An original is created in a specific historical and artistic context, with the artist's intention to create a unique work. A copy (even a contemporary one) lacks that original creative act and thus loses its status as a primary historical document. This affects the artwork's narrative and testimonial value.

  3. Testimonial Value: An artwork is a witness to its time. If a painting thought to be from 1660 is revealed to be from 1920, it no longer tells us about 1660. The forgery undermines the historical record and the trust in the museum as a custodian of truth.

  4. Promises and Obligations: The museum has commitments to the public, donors, scholars, and the art world. Misattribution breaches these commitments by providing false information.

  The four argument points are:
  1. Perceptual question: Does the object change for the viewer? (No, but that's not the whole story.)
  2. The question of origin: Whose doing and under what constraints? (The creative act and its context matter.)
  3. The question of what the object tells us: Its historical testimony.
  4. The question of what we have promised: Our obligations.

  Decision Procedure Structure:

  The procedure will be a step-by-step process that the registrar and assistant can run in about a working day. It will use available evidence (without requiring new scientific analysis unless already in hand) and will include rules for burden of proof, interim dispositions, and label wording.

  Steps:

  1. Initial Assessment:
     - Gather all available evidence (current catalog record, any new reports, literature, emails, etc.).
     - Note the current attribution and the proposed change.

  2. Burden of Proof and Standard of Evidence:
     - The burden of proof lies with the party proposing a change from the current catalog attribution.
     - Evidence must be assessed for reliability. If the evidence is inconclusive, the current attribution stands until better evidence is available.
     - Interim disposition: If the evidence is under review (e.g., waiting for a conservation report), the object may remain on display with a label that notes the attribution is under review (e.g., "Attributed to X [under review]"). This interim label may stand for up to 12 months, after which a decision must be made.

  3. Step 1: Perceptual Indistinguishability
     - Question: If the proposed change (e.g., from original to copy) were true, would the object be perceptually distinguishable from what it was believed to be?
     - If the answer is no (it looks the same), then note that this does not settle the matter. Move to Step 2.
     - If the answer is yes (there are visible differences that affect the aesthetic experience), then this may be grounds for re-evaluation of display (e.g., withdrawal if it no longer meets aesthetic standards). However, this is rare in cases of good forgeries.

  4. Step 2: Origin and Creation Context
     - Question: What is the evidence about the origin of the object? Specifically:
       - Was it created by the hand of the named artist? (autograph)
       - Was it created in the artist's studio under their supervision? (studio work)
       - Was it created as a deliberate copy (contemporary or later) or forgery?
       - For contemporary certificate works: Was it produced according to the artist's instructions and under authorized conditions?
     - Use the following categories (with definitions) to classify the object:
       - Autograph work: Entirely by the artist's hand.
       - Studio work: Partially by the artist, partially by assistants (common in workshops).
       - Workshop production: Made in the artist's workshop, possibly under general supervision but not necessarily by the master.
       - Circle of: By an associate of the artist but not necessarily in the workshop.
       - Follower of: By someone working in the artist's style, possibly later.
       - Manner of: In the style of the artist, but not necessarily connected.
       - After: A copy made after the original, often without deceptive intent.
       - Forgery: Created with intent to deceive.
     - If the origin is in question, proceed to Step 3.

  5. Step 3: Testimonial Value
     - Question: What does the object now tell us about the period, artist, or movement it was believed to represent?
     - If the object is not of the period or artist, then its value as a historical witness is compromised. For example, a 20th-century forgery of a 17th-century work tells us about 20th-century forgery techniques, not the 17th century.
     - This step assesses the impact on the museum's educational mission and scholarly integrity.

  6. Step 4: Promises and Obligations
     - Question: What promises has the museum made?
       - To the public: Accurate information about what they are seeing.
       - To donors/lenders: That the object is as described at the time of acquisition/loan.
       - To scholars: That the catalog record is reliable.
     - If the object is not as described, there may be a need to correct the record, notify donors, or even deaccession if the object no longer fits the collection policy.

  7. Dispositions:
     Based on the above steps, choose one of the following:
     - Keep as catalogued: If no change is warranted.
     - Keep on display with changed credit line/label: If the attribution changes but the object still has value for display (e.g., it's a good studio work).
     - Keep with changed label and changed valuation: If the change affects monetary value (for insurance and possibly for future deaccession).
     - Withdraw from display: If the object no longer meets display standards (e.g., it's a forgery and displaying it would mislead or it has no educational value in the current context).
     - Decline or return a gift: If the object is under consideration as a gift and the new information makes it unacceptable.
     - Refer elsewhere: If the object might be more appropriate for another institution (e.g., a forgery might go to a museum of forgeries or a teaching collection).

  8. Label Wording and Insurance:
     - Use standard attribution terminology (as above) with clear definitions.
     - Insurance valuation: 
       - Autograph: Highest value.
       - Studio work: Typically 30-50% of autograph.
       - Workshop: 20-40%.
       - Circle of: 10-30%.
       - Follower of: 5-20%.
       - Manner of: 5-15%.
       - After: 1-10%.
       - Forgery: Minimal value (unless it has historical significance as a forgery).
     - The exact percentage should be determined by the finance office in consultation with appraisers, but the procedure provides the category.

  9. Contemporary Certificate Works:
     - These are often "multiples" or "instruction-based works" (like some conceptual art). The technical term is "dematerialized art" or "artist's authorized instance".
     - The procedure applies but with a branch at Step 2:
       - Check the certificate and instructions: Was the fabrication done according to the artist's specifications and under authorized conditions at the time?
       - If yes, then the work is authentic as an instance of that piece.
       - If the artist later disavows (as in Case B), that does not necessarily change the fact that it was authorized at the time of production. However, the artist's disavowal might affect the work's status and value. The key is the conditions of production at the time.
       - Disposition: If the disavowal is based on political grounds and the work was correctly fabricated, then the museum may keep it as an authorized instance. The label might note the disavowal for transparency, but the work remains part of the edition.

  10. Judgment Points:
      - At each step, if the evidence is ambiguous, judgment is required. The registrar makes the initial call, but:
        - If the change would affect valuation by more than 50%, the finance office must be consulted.
        - If the change might lead to deaccession, the director and board must approve.
        - If there is a legal issue (e.g., ownership, donor agreement), lawyers must be consulted.
        - If the change is about the object's identity and affects the collection policy, the curator and director must be involved.

  11. The Standing Practice (Displaying a Reproduction):
      - The procedure must address this: 
        - Question: Is the display of a high-quality reproduction without prominent disclosure acceptable?
        - Philosophical grounding: The museum's primary duty is to the truth. A reproduction lacks the aura and historical presence of the original (Walter Benjamin). However, if the purpose is conservation and the disclosure is made (even in small print), it might be acceptable as long as the public is not misled. But the disclosure should be clear and not hidden. The procedure should require that the label clearly states "Temporarily replaced by a reproduction for conservation reasons" and not in overly small print. This is the public's business because they are being shown a copy.

  12. Running the Cases:

  Case A: 17th-century cabinet picture, now shown to be a contemporary workshop version (partly master, partly assistant).

  - Step 1: Perceptually, nothing has changed. Move on.
  - Step 2: Origin: Workshop production, which was a common practice at the time. It is not a forgery because there was no deceptive intent. It is an authentic period piece from the workshop.
  - Step 3: Testimonial value: It still tells us about the workshop practices of the period, so it has historical value.
  - Step 4: Promises: The museum acquired it as autograph, but it is still a valuable work from the period. The public and scholars should be informed of the more precise attribution.
  - Disposition: Keep on display with changed credit line. Label: "Workshop of [Master's Name]" or "Attributed to [Master's Name] and workshop". 
  - Valuation: Reduced to 30-50% of the previous autograph valuation (finance office to determine exact figure).
  - The 1974 file: Update the catalog record and note the change in attribution with the evidence. Notify any living donors if required by the gift agreement.

  Case B: Contemporary light work, acquired as a certificate, artist disavows.

  - Step 1: Perceptually, it is the same.
  - Step 2: Origin: This is a branch for contemporary certificate works. Check the conditions of fabrication: If it was made under the artist's supervision at the time, then it is an authorized instance. The artist's later disavowal on political grounds does not retroactively change that. However, the disavowal is part of the work's history.
  - Step 3: Testimonial value: The work now tells us about the artist's changing political views and the context of reception, but it remains an instance of the work as conceived at the time.
  - Step 4: Promises: The museum acquired it as an authorized instance. The disavowal does not break that promise because the authorization was valid at the time. However, the public should be informed if the artist disavows.
  - Disposition: Keep with changed label. Label: Include the disavowal, e.g., "This work was fabricated in 2011 under the artist's supervision. In [year], the artist disavowed this instance for political reasons." 
  - Valuation: Likely reduced due to the disavowal, but the extent depends on the art market's reaction. Finance office to reassess.
  - Note: This is different from Case A because the issue is not about the physical creation but about the artist's ongoing endorsement. The procedure handles it in Step 2 (origin) with a branch for contemporary works.

  Case C: Painting shown to be by a known imitator.

  - Step 1: Perceptually, it remains the same (and even better than some originals).
  - Step 2: Origin: It is a forgery (if made with intent to deceive) or an imitation (if not). The label "known imitator" suggests it was made to deceive and passed off as the master's work at some point. So, it is a forgery.
  - Step 3: Testimonial value: It does not tell us about the master but about the imitator and the market for forgeries. It might have value as a historical forgery.
  - Step 4: Promises: The museum has displayed it as a genuine work for 40 years. Correcting the record is essential. The dealer's offer to sell it as a celebrated forgery might be an option, but the museum must consider its mission.
  - Disposition: This is a tough one. Withdraw from display? Or display with a new label as a celebrated forgery? The procedure must allow for both. However, the museum's role is not to trade in forgeries for profit. The board must decide whether to deaccession and sell, but only if the sale aligns with the museum's deaccession policy (usually proceeds go to acquisitions). Alternatively, keep it with a changed label and use it for educational purposes about forgeries.
  - Valuation: As a forgery, the monetary value is low unless it has notoriety. The dealer's offer might be above the typical forgery value because of its fame.

  The procedure should return that Case C comes out against the museum in the sense that the current display as a genuine work cannot continue. The museum must change the label and decide on deaccession. The dealer's offer might be tempting, but selling to a dealer who will resell at a markup might not be in the public interest. The board must decide.

  Final Procedure Document:

  **Museum Object Identity Decision Procedure**

  **Purpose**: To resolve questions about the attribution, authenticity, and status of objects in the collection, leading to a clear disposition.

  **Steps**:

  1. **Initial Review** (Registrar and Assistant):
     - Collect all available evidence (catalog record, new reports, etc.).
     - Document the current attribution and the proposed change.
     - If the evidence is incomplete and a report is pending, assign an interim disposition: 
       - Label: "Attribution under review" (for up to 12 months).
       - Object may remain on display unless there is reason to believe it is a forgery and display would be misleading.

  2. **Step 1: Perceptual Assessment**:
     - Would the proposed change make the object perceptually different to a competent viewer?
     - If yes, this may affect display (e.g., if it becomes aesthetically inferior). Proceed to Step 2.
     - If no, note that the object's appearance is unchanged, but this does not resolve the identity question. Proceed to Step 2.

  3. **Step 2: Origin and Creation**:
     - Determine the object's origin using evidence:
       - For traditional works: Use standard attribution categories (definitions provided in appendix).
       - For contemporary certificate works: Determine if the instance was produced according to the artist's instructions and under authorized conditions at the time of fabrication.
     - Judgment: If evidence is inconclusive, the burden is on the party proposing the change. Maintain current attribution until proven otherwise.

  4. **Step 3: Testimonial Value**:
     - Assess how the object's identity affects its historical testimony:
       - Does it still represent the period, artist, or movement it was believed to?
       - If not, what does it now represent? (e.g., a forgery represents the history of forgeries.)

  5. **Step 4: Promises and Obligations**:
     - Review commitments:
       - To the public: Provide accurate information.
       - To donors/lenders: Uphold the terms of acquisition/loan.
       - To scholars: Maintain reliable records.
     - Consider if a change breaches any commitment and what remediation is needed (e.g., notification, correction).

  6. **Disposition**:
     Based on Steps 2-4, choose one:
     - **Keep as catalogued**: No change in attribution.
     - **Keep on display with changed credit line**: Attribution change that does not warrant removal (e.g., from autograph to studio). Update label.
     - **Keep with changed label and changed valuation**: Attribution change that affects value. Update label and insurance.
     - **Withdraw from display**: If the object no longer serves an educational or aesthetic purpose in the galleries (e.g., a forgery that would mislead if displayed as genuine). It may be stored or used for study.
     - **Decline or return a gift**: If the object is a proposed gift and the new information makes it unacceptable per collection policy.
     - **Refer elsewhere**: If the object is better suited to another institution (e.g., a forgery to a specialized collection).

  7. **Label Wording**:
     - Use standard terminology (appendix). For weakened attributions:
       - "Studio of X": 20-40% of autograph value.
       - "Circle of X": 10-30%.
       - "Follower of X": 5-20%.
       - "Manner of X": 5-15%.
       - "After X": 1-10%.
       - "Forgery": 0-5% (unless historically significant, then reassess).
     - Always base the exact percentage on a new appraisal.

  8. **Contemporary Works**:
     - These go through the same procedure but with a focus on Step 2 (origin). The key is whether the instance was authorized at production. Later disavowal does not erase the original authorization but should be noted.

  9. **The Standing Practice (Displaying Reproduction)**:
     - The procedure requires clear disclosure: The label must state unambiguously that a reproduction is on display and why (e.g., "Temporarily replaced by a reproduction for conservation"). The font size must be legible. This is the public's business.

  10. **Judgment and Authority**:
      - Registrar makes initial determinations.
      - Consult:
        - Finance office for valuation changes >20%.
        - Director for any disposition that might affect reputation or requires deaccession.
        - Board for deaccession or major policy shifts.
        - Lawyers for ownership or donor agreement issues.

  **Appendix: Attribution Categories and Valuation Impact**

  - Autograph work: 100% (baseline)
  - Studio work (partly by master): 30-50%
  - Workshop of: 20-40%
  - Circle of: 10-30%
  - Follower of: 5-20%
  - Manner of: 5-15%
  - After: 1-10%
  - Forgery: 0-5% (or reassessed if historically notable)

  Run on Cases:

  **Case A**:
  - Disposition: Keep on display with changed credit line.
  - Label: "Workshop of [Master]" or "Attributed to [Master] and workshop".
  - Valuation: Reduce to 30-50% of previous.
  - 1974 file: Update record, note change.

  **Case B**:
  - Disposition: Keep with changed label noting disavowal.
  - Valuation: Reduced (extent to be determined by market).
  - Note: This is handled by the procedure (branch in Step 2).

  **Case C**:
  - Disposition: Withdraw from display or display with a new label as a forgery for educational purposes. Deaccession may be considered (board decision).
  - Valuation: Minimal as a forgery, but the dealer's offer may reflect its notoriety.
  - Outcome: The current display as genuine must stop. This is against the museum in the sense that we must change our position.

  The procedure does not rig outcomes. In Case C, the museum must face the fact that it has been displaying a forgery. The board may choose to sell, but the procedure requires withdrawal from display as a genuine work.
answer: |-
  Below is a comprehensive decision procedure designed to resolve disputes about object identity (attribution, authenticity, period, etc.) in your museum. It is grounded in philosophical distinctions about the non-perceptual losses incurred when an original is revealed to be a copy (drawing on thinkers like Nelson Goodman, Arthur Danto, and Jerrold Levinson). The procedure explicitly addresses your four recurring argument points and incorporates your constraints: runnable by non-conservation staff in one day, applicable to contemporary certificate works, and including graded label wording with valuation impacts. It also handles inconclusive evidence, burden of proof, interim dispositions, and judgment calls.

  The philosophical grounding emphasizes that what is "lost" in misattribution is not perceptual (a copy can look identical) but relates to:
  - **Origin and intention** (Goodman): Artworks derive meaning from their history of production. An original is a product of its creator's agency, while a copy lacks that generative context.
  - **Aboutness and testimony** (Danto): Artworks are historical witnesses. A misattributed object misrepresents its era, distorting scholarly and public understanding.
  - **Institutional commitment** (Levinson): Museums promise truthfulness to donors, the public, and scholars. Breaking this trust damages integrity and social value.

  ### **Decision Procedure: Object Identity Assessment**
  **Who Runs It**: Registrar (you) and one assistant.  
  **Timeframe**: 1 working day per case (using existing evidence; no new scientific analysis).  
  **Input**: All available evidence (catalog records, reports, emails, literature, donor agreements).  
  **Output**: One of six dispositions, with label wording and valuation impact.  
  **Burden of Proof**: Lies with the party challenging the current attribution. If evidence is inconclusive, the current attribution stands.  
  **Interim Disposition**: If evidence is pending (e.g., a conservation report due in 4 months), use label: "Attributed to [Artist], Attribution Under Review." This may stand for **12 months** max. After that, a final decision is required.  
  **Judgment Calls**: Marked at each step (registrar, director, board, or lawyers).

  ---

  #### **Step 1: Perceptual Assessment (Does the object change for a viewer?)**
  - **Question**: If the proposed change (e.g., original to copy) were true, would a competent viewer notice any difference in the object as displayed?  
  - **Philosophical Grounding**: Perceptual indistinguishability is irrelevant to art identity. Goodman distinguishes between "autographic" art (where history matters) and "allographic" art (like music, where performance is key). Paintings are autographic: their value lies in origin, not appearance.  
  - **Procedure**:  
    - If **no perceptual change** (99% of cases), proceed to Step 2. This step only eliminates arguments that "it looks the same, so why change anything?"  
    - If **perceptual change** (e.g., a forgery is crudely made), consider withdrawal for aesthetic reasons. Rare.  
  - **Judgment**: Registrar determines based on evidence. No higher approval needed here.

  #### **Step 2: Origin and Intention (Whose doing, and under what constraints?)**
  - **Question**: What does the evidence show about who made the object, their intent, and the constraints (e.g., studio system, forgery ring, certificate rules)?  
  - **Philosophical Grounding**: Levinson’s "intentional-historical" theory: An artwork’s identity depends on the maker’s intention to create within an art-historical context. A copy lacks the original creative act, reducing its status as an achievement.  
  - **Procedure**: Categorize the object using evidence:  
    - **Autograph**: Entirely by the named artist’s hand.  
    - **Studio Work**: Partly by the artist, partly by assistants (common in workshops).  
    - **Workshop Production**: Made in the artist’s workshop under supervision, but not by the master.  
    - **Circle of**: By an associate of the artist, not in the workshop.  
    - **Follower of**: By someone later, working in the artist’s style.  
    - **Manner of**: In the artist’s style, no direct connection.  
    - **After**: Deliberate copy, no intent to deceive.  
    - **Forgery/Imitator**: Intent to deceive, passed off as original.  
    - **Contemporary Certificate Work**: Authorized instance produced under the artist’s instructions (see Branch for Certificate Works below).  
  - **Burden of Proof**: Challenger must provide evidence. If inconclusive, current attribution stands.  
  - **Judgment**: Registrar categorizes; if legal/financial risks arise (e.g., forgery), escalate to lawyers/director.

  #### **Step 3: Testimonial Value (What does the object now tell us?)**
  - **Question**: If the proposed change is true, what historical/artistic narrative does the object support? Does it still fulfill its role as a witness?  
  - **Philosophical Grounding**: Danto’s "artworld" theory: Artworks are embedded in a historical narrative. A misattribution corrupts this—e.g., a 1920s forgery of a 1660s work tells us about 1920s deception, not 1660s art.  
  - **Procedure**: Assess impact:  
    - If testimony is **preserved** (e.g., a studio work still informs the period), proceed to Step 4.  
    - If testimony is **corrupted** (e.g., a forgery misrepresents the era), withdrawal or relabeling is likely.  
  - **Judgment**: Registrar consults curator for scholarly impact. Director approves if reputational risk exists.

  #### **Step 4: Promises and Obligations (What have we committed to?)**
  - **Question**: What promises were made to donors, lenders, the public, and scholars? Does the change breach these?  
  - **Philosophical Grounding**: Institutional trust (Levinson): Museums are truth-telling institutions. Breaches damage credibility and social value.  
  - **Procedure**: Review:  
    - **Public**: Accurate labels for ticket-buyers.  
    - **Donors/Lenders**: Acquisition agreements; may require restitution.  
    - **Scholars**: Reliable catalog data.  
    - **Field**: Correct citations.  
  - **Burden**: If promises are breached (e.g., donor expected an autograph), consider withdrawal or deaccession.  
  - **Judgment**: Registrar checks donor agreements; lawyers involved if ownership is contested. Director approves disposition.

  #### **Disposition and Labeling**
  Based on Steps 2-4, assign one disposition:  
  1. **Keep as catalogued**: No change if evidence inconclusive or no material impact.  
  2. **Keep on display, changed label**: Attribution weakened, but object still valuable. Update credit line.  
  3. **Keep, changed label and valuation**: Attribution change affects monetary value. Update label and insurance.  
  4. **Withdraw from display**: Testimony corrupted or promises breached (e.g., forgery). Store or use for study.  
  5. **Decline/return gift**: For new acquisitions, if identity issues violate collection policy.  
  6. **Refer elsewhere**: Object better suited to another institution (e.g., forgery to a museum of fakes).  

  **Graded Label Wording and Valuation Impact**:  
  | Attribution       | Label Wording      | Insurance Valuation (vs. Autograph) | Rule for Use                                                                 |
  |-------------------|--------------------|-------------------------------------|------------------------------------------------------------------------------|
  | Autograph         | "By [Artist]"      | 100% (baseline)                     | Direct evidence of artist’s hand.                                           |
  | Studio Work       | "Studio of [Artist]" | 30–50%                            | Partly by artist, partly by assistants; workshop context clear.              |
  | Workshop Production| "Workshop of [Artist]" | 20–40%                          | Made in artist’s workshop, no direct hand.                                  |
  | Circle of         | "Circle of [Artist]" | 10–30%                            | By associate of artist; same period/region.                                 |
  | Follower of       | "Follower of [Artist]" | 5–20%                            | Later artist in same style; no direct link.                                 |
  | Manner of         | "Manner of [Artist]" | 5–15%                            | Stylistic imitation; artist/period uncertain.                               |
  | After             | "After [Artist]"   | 1–10%                              | Copy without intent to deceive.                                             |
  | Forgery/Imitator  | "Imitator of [Artist]" | 0–5% (or reassessed if notable)   | Intent to deceive; label must avoid glorifying.                             |

  **Variance Handling**: Finance office determines exact valuation within ranges; registrar provides attribution category.

  #### **Branch for Contemporary Certificate Works**
  - **What They Are**: "Artist-authorized multiples" (e.g., Sol LeWitt wall drawings). Identity conditions allow posthumous production under supervision.  
  - **Procedure**: Same as above, but focus Step 2 on **production context**:  
    - Was the instance made per the artist’s instructions and certificate? If yes, it is authentic, regardless of later disavowal (the artist’s initial authorization defines it).  
    - If disavowed (e.g., Case B), label must note disavowal, but it remains an authorized instance.  
  - **Disposition**: Typically "keep with changed label." Valuation may drop if disavowal affects market demand.  

  #### **Standing Practice: Displaying Reproductions**
  - **Procedure’s Position**: This is **not solely the conservator’s business**. Philosophically, Goodman argues that reproductions lack the "history of production" of originals, diminishing their aesthetic and historical value.  
  - **Rule**: Disclosing only in "small print" is insufficient. Label must clearly state: "Temporarily replaced by a high-quality reproduction for conservation reasons." Font size must be legible (e.g., equal to artist/title text).  
  - **Rationale**: The public has a right to know they are not viewing the original; failure risks breaching trust (Step 4).

  ---

  ### **Run the Procedure on Your Cases**
  **Case A: 17th-Century Cabinet Picture (Workshop Version)**  
  - **Step 1**: No perceptual change → Proceed.  
  - **Step 2**: Origin is "studio work" (partly master, partly assistant). No intent to deceive; common for era.  
  - **Step 3**: Testimony preserved—still informs workshop practices of the period.  
  - **Step 4**: No breached promises (1974 acquisition likely had no warranty; check file). Public/scholars benefit from accurate labeling.  
  - **Disposition**: Keep on display, changed label.  
  - **Label**: "Studio of [Master]" (valuation: 30–50% of autograph).  
  - **1974 File**: Update catalog with new attribution and evidence. Notify board/finance; no donor action unless specific agreement exists.  
  - **Outcome**: Defensible; no one "hates" it, but finance may grumble about devaluation.

  **Case B: Contemporary Light Work (Disavowed Instance)**  
  - **Step 1**: No perceptual change → Proceed.  
  - **Step 2**: **Branch for Certificate Work**: Produced per artist’s instructions in 2011, so authorized. Later political disavowal doesn’t alter initial authorization.  
  - **Step 3**: Testimony shifts but isn’t corrupted—now also speaks to artist’s politics and reception history.  
  - **Step 4**: Promises to public/donors require transparency about disavowal.  
  - **Disposition**: Keep, changed label and valuation.  
  - **Label**: "[Artist], [Title], 2011 (authorized instance). The artist disavowed this work in [Year] for political reasons." Valuation drops 20–60% based on market (finance assesses).  
  - **Is it like Case A?**: No. Case A is about historical production context; Case B is about shifting authorization. Both use Step 2, but certificate works have unique rules.  
  - **Outcome**: Defensible; director may dislike airing "dirty laundry," but truthfulness prevails.

  **Case C: Celebrated Forgery by Known Imitator**  
  - **Step 1**: No perceptual change (curators admit it’s "better") → Proceed.  
  - **Step 2**: Origin is "forgery/imitator" (intent to deceive).  
  - **Step 3**: Testimony corrupted—no longer informs the master’s work; now only speaks to forgery or the imitator.  
  - **Step 4**: Breaches promises to public (40 years of misrepresentation) and scholars. Donor/lender obligations unknown; check files.  
  - **Disposition**: **Withdraw from display** immediately. Then decide:  
    - **Option 1**: Relabel as educational artifact ("Imitator of [Master], c. [Year]. Long attributed to [Master].") and display in context (e.g., "Art and Deception" exhibit).  
    - **Option 2**: Deaccession and sell to dealer (if board approves per policy).  
  - **Valuation**: As forgery, insurance drops to 0–5%. Dealer’s offer may exceed this due to notoriety.  
  - **Board Decision Required**: Deaccession must follow collections policy (e.g., funds used for acquisitions). Selling to a dealer for markup may invite criticism.  
  - **Outcome**: **Comes against you**. Must withdraw from display; director/board may "hate" losing a star piece, but procedure prioritizes integrity. The dealer’s offer is tempting but ethically fraught—only pursue if funds directly benefit the collection.

  ---

  ### **Judgment Call Summary**
  - **Registrar**: Steps 1–3 (categorization, testimony), interim labels, label wording.  
  - **Director**: Approves dispositions with reputational/financial risks (e.g., deaccession, high-value changes).  
  - **Board**: Approves deaccession, major policy shifts (e.g., Case C sale).  
  - **Lawyers**: Involved if ownership is contested, donor agreements are breached, or deaccession risks litigation.  

  ### **Final Notes**
  - **Which Case Comes Against Us? Case C** requires withdrawal and a difficult board decision. The procedure doesn’t rig outcomes: it forces a reckoning with the forgery, even though it’s well-loved and profitable to sell.  
  - **Why This Works**: It cuts through circular arguments by forcing each of your four issues into sequential steps. Philosophy isn’t summarized—it’s embedded (e.g., Step 2 uses intention to resolve "whose doing" debates).  
  - **Efficiency**: Designed for one-day use; relies on existing evidence. For contemporary works, the certificate branch avoids unnecessary parallels to historical art.  
  - **Output Clarity**: Dispositions are concrete, with label/valuation rules.  

  This procedure ensures consistency, honors your mission, and meets practical constraints. Use it as a living document—revise as new cases test its limits.
