prompt: |-
  hi — act as someone who's done both: a political philosopher who works on conditionality and deservingness, and someone who's sat on a lot of administrative appeal bodies. Take it seriously and think carefully step by step; in particular, before you commit to an answer I want an actual brainstorm of the candidate principles that could be generating the pattern below, including ones you then throw away. Don't give me a reading list or citations, I want the reasoning, not the literature.

  I clerk for the Reconsideration Panel of our borough's work-and-progression scheme (I'll just call it the Scheme). When the Scheme proposes to cut someone's allowance for four or thirteen weeks, the Panel decides whether the cut stands. Here are six rulings from the last year, with the facts that seemed to matter to them.

  1. Latoya missed a 9am work-search review. Her bus broke down; she phoned the office at 8:15, was told to come at 2pm, and did. No sanction — the office had moved the appointment, so on their view there was no failure.

  2. Yusuf didn't attend a mandatory group session held on the first floor of a building with no lift. He's a wheelchair user. He'd emailed the provider's adjustments contact two weeks earlier asking for an accessible venue and got no reply; he didn't attend and didn't phone on the day. No sanction, and the Panel told the provider to cover his travel costs and move future sessions.

  3. Dean refused a four-week unpaid placement in a warehouse run by a big online retailer, where the same firm was advertising a paid vacancy of the same description at the same site. He wrote in asking to be reassigned and proposed three non-profit placements; all were refused without reasons. No sanction: a placement that stands in for paid work the same employer is recruiting for isn't something they'll enforce.

  4. Amara missed a mandatory CV clinic. Her childminder cancelled that morning; she texted her coach at 9:40 asking to move to Thursday and got no reply; she didn't attend. She'd had three weeks' notice, there was a recorded earlier warning for a previous missed clinic, the letter told her to phone the office rather than text her coach if she needed to reschedule, and she hadn't used the Scheme's emergency childcare line. Her rep argued the cut would put her in rent arrears. Sanction stands, reduced from four weeks to two: hardship is what the discretionary payment route is for, not a reason to withhold.

  5. Tunde logged no applications on the portal for three weeks and said it kept timing out on his phone. The Panel found a documented outage on one of those days only, that he'd been shown how to use the library terminals, that he never reported the problem or asked for help at the time, and that he'd told his coach he'd given up on the website. Sanction stands at four weeks.

  6. Mariam was terminated from a placement on day one because her trainers weren't safety footwear and she couldn't afford boots. She came back the next day in borrowed boots two sizes too big and was sent home again; the provider logged it as attitude. No sanction, provider told to supply the footwear, and the attitude entry can't be used against her. Their reason: a condition that costs the claimant money she hasn't got, applied through a provider's own rulebook, isn't enforceable, and there'd been no written warning and no chance to put it right.

  Now the case I have to draft for next week. The Scheme rolled out a jobsearch app three months ago: claimants in the top two bands must install it, it logs location 9 to 5 on weekdays, and it's now the only way to get search activity verified. Chidi is 54, a former forklift driver, and has a basic phone, no smartphone. He won't install the app: he says he's not going to be tracked and can't afford the data. He keeps a paper diary and makes around twelve employer visits a week, and his coach has put in writing that this is above what his claim requires. The Scheme offered him a free refurbished phone plus a data top-up for as long as he's on the Scheme, gave him written notice and two warnings, and wants thirteen weeks. Against that: the notice never says what the app collects, who can see it, or how long it's kept; he twice wrote in asking for a non-app way to verify his search and got no answer; and the sanction was triggered by an automated non-compliance flag from the risk-banding model they bought last year rather than by his coach, who had signed off his jobsearch. Nobody can tell us which input pushed him into the top band — his coach guesses it was the gap in his record from when he was in hospital, plus his age.

  So: what principle is the Panel actually running? I can see at least three that fit all six precedents — roughly, (a) is she holding up her side, is she genuinely oriented toward work; (b) was compliance actually impossible, or was the requirement itself one of the kinds the Scheme has no business making; (c) did the Scheme run its own process properly — clear notice, a warning, reasons, a real alternative, a chance to cure. Come up with others too, including ones that fit most of the six and break on one. Then for each rule that survives, say what it predicts about Chidi, give me your best guess with the reasons you prefer it, and be honest about where the precedents simply don't settle it.

  Two more things. First, name the single further case that would best seperate the two rules you think are the live contenders — something I could actually put in front of them, with the facts specified, not a gesture at one. Second, since I'm the one drafting: which of the six is the closest analog, and if I go either way what principle am I committing the Panel to, including the one I'd be committing it to for future app-refusal cases? And tell me plainly if you think this is a case where the Panel should decline to extend its own pattern rather than follow it, and why. If it matters, also say whether whatever principle you land on has anything to do with what people mean by the undeserving poor.
reasoning: |-
  Okay, the user is asking me to act as a political philosopher with experience in administrative appeals, analyzing a set of welfare sanction cases to deduce the underlying principles. This is a complex request requiring careful step-by-step reasoning about conditionality and deservingness in social policy.

  Hmm, the user presents six precedent cases from a welfare reconsideration panel, plus Chidi's pending case about refusing a tracking app. They want me to brainstorm candidate principles that explain the pattern, including rejected ones, then apply them to Chidi. Crucially, they need practical advice for drafting their ruling.

  First, I need to extract the key factors from each precedent:
  - Latoya: Sanction waived because the office rescheduled, making compliance possible
  - Yusuf: Accessibility failure by provider, reasonable effort to notify
  - Dean: Unreasonable requirement substituting paid work
  - Amara: Sanction upheld despite hardship due to procedural failures
  - Tunde: Sanction upheld for not using alternatives/reporting issues
  - Mariam: Sanction waived for unaffordable costs and provider's unfair process

  The user suggests three possible principles (genuine work orientation, impossibility/unreasonableness, procedural fairness), but I should consider more. Let me brainstorm candidates:

  1. **Substantive Reasonableness**: Was the requirement itself fair? (Breaks on Amara - requirement was reasonable but sanction applied)

  2. **Procedural Reciprocity**: Did both sides fulfill obligations? (Fits all: claimants made reasonable efforts, scheme failed in Yusuf/Mariam/Dean)

  3. **Practical Possibility**: Could claimant comply without undue burden? (Breaks on Tunde - he could've used library)

  4. **Alternatives Exhausted**: Did claimant explore options? (Fits all - Yusuf emailed, Dean proposed alternatives, while Amara/Tunde didn't use resources)

  5. **Scheme Culpability**: Did scheme cause the failure? (Strong fit - all no-sanction cases involve scheme failure)

  6. **Moral Desert**: Is claimant "trying"? (Weak - too subjective, Tunde was sanctioned despite likely wanting work)

  Scheme Culpability (5) and Procedural Reciprocity (2) emerge as strongest. Both fit all cases if we interpret "culpability" broadly to include unreasonable requirements or process failures.

  Now applying to Chidi:
  - Under Scheme Culpability: The scheme failed to explain data use or respond to queries, making requirement unreasonable → no sanction
  - Under Procedural Reciprocity: Chidi proposed alternatives (paper diary) but scheme didn't engage → no sanction
  Both point to waiving sanction. The age/banding opacity reinforces this.

  Closest precedent is Yusuf: both involve unaddressed accessibility barriers (physical vs digital). Dean is also analogous regarding unreasonable requirements.

  For future-proofing, ruling for Chidi commits the panel to: "When scheme introduces mandatory digital tools, it must provide accessible alternatives, clear privacy terms, and respond to concerns."

  The decisive test case would be: **Claimant refuses app due to privacy concerns, scheme provides full transparency and budget phone, but claimant still refuses despite ability to comply.** This separates whether the objection must be reasonable (Reciprocity) or the requirement itself must not be oppressive (Culpability).

  Finally, this isn't about "undeserving poor" - the panel focuses on institutional fairness, not moral judgment of claimants. Their approach prevents arbitrary exclusion by centering on the scheme's duties.

  The user should stress in drafting that the scheme's failure to address privacy concerns or provide non-app verification breaches reciprocity, making enforcement illegitimate. Cite Yusuf and Mariam on unaddressed barriers.
answer: |-
  Based on the precedents and my dual perspective (political philosophy on conditionality + administrative appeals experience), here’s a step-by-step analysis of the principles at play, candidate rules, their application to Chidi, and strategic advice for your draft.

  ### Step 1: Brainstorming Candidate Principles
  I’ll generate principles that *could* explain the pattern, including those that break on one case. I group them into three categories:

  #### A. **Claimant-Focused Principles** (Assessing the claimant’s actions/mindset)
  1. **Genuine Effort/Orientation to Work**: Sanction withheld if claimant demonstrates consistent effort to seek/work, regardless of technical breaches.  
     - *Fits*: Latoya (came later), Dean (proposed alternatives), Mariam (returned in boots).  
     - *Breaks*: Amara (missed appointment despite effort; sanctioned). Tunde (logically "gave up," sanctioned).  

  2. **Avoidable vs. Unavoidable Failure**: Sanction depends on whether the failure was reasonably within claimant’s control.  
     - *Fits*: Yusuf (inaccessible venue), Mariam (unaffordable boots).  
     - *Breaks*: Latoya (bus breakdown was unavoidable, but decision turned on office rescheduling, not her effort). Amara (childcare issue was arguably avoidable via emergency line).  

  3. **Proactive Problem-Solving**: Sanction withheld if claimant actively sought solutions before/after failure.  
     - *Fits*: Yusuf (emailed about access), Dean (proposed alternatives).  
     - *Breaks*: Tunde (didn’t report issues), Amara (didn’t use emergency line).  

  #### B. **Requirement-Focused Principles** (Assessing the Scheme’s demands)
  4. **Substantive Reasonableness**: Sanction withheld if the requirement itself is unfair, exploitative, or impossible.  
     - *Fits*: Dean (unpaid work replacing paid role), Yusuf (inaccessible venue), Mariam (unaffordable equipment).  
     - *Breaks*: Amara (attending CV clinic was reasonable; sanctioned).  

  5. **Alternatives Available**: Sanction withheld if the Scheme failed to provide feasible alternatives to comply.  
     - *Fits*: Yusuf (no accessible option), Mariam (no footwear provision).  
     - *Breaks*: Tunde (library terminals available).  

  #### C. **Process-Focused Principles** (Assessing procedural fairness)
  6. **Procedural Reciprocity**: Sanction requires the Scheme to fulfill *its* duties: clear notice, warnings, responsiveness, and chance to correct.  
     - *Fits*: ALL SIX:  
       - Latoya (office changed appointment).  
       - Yusuf (no reply to email; no accessible option).  
       - Dean (no reasons for refusing alternatives).  
       - Amara (sanctioned partly because she didn’t phone as instructed; Scheme followed process).  
       - Tunde (didn’t report issues; Scheme offered library).  
       - Mariam (no written warning; provider rulebook issue).  

  7. **Transparency and Accountability**: Sanction withheld if Scheme acts opaquely (e.g., automated decisions without explanation, hidden rules).  
     - *Fits*: Mariam (provider’s "attitude" entry opaque), Dean (no reasons for refusal).  
     - *Breaks*: Amara (Scheme gave clear instructions; sanctioned).  

  8. **Disproportionate Burden**: Sanction withheld if compliance imposes unreasonable costs (financial, privacy, dignity).  
     - *Fits*: Yusuf (physical burden), Mariam (financial burden).  
     - *Breaks*: Tunde (burden of using library deemed reasonable).  

  ---  
  ### Step 2: Surviving Principles & Predictions for Chidi
  Only **Procedural Reciprocity (6)** fits all six cases perfectly. **Transparency (7)** and **Substantive Reasonableness (4)** fit 5/6 but break on Amara (where the requirement was reasonable and process followed).  

  #### Application to Chidi’s Case:
  - **Procedural Reciprocity Predicts NO SANCTION**:  
    - Scheme failed responsiveness (no reply to Chidi’s letters).  
    - Inadequate notice (no details on data collection/retention).  
    - No real alternative offered (app is "only way"; paper diary ignored despite coach’s approval).  
    - Automated decision without explanation (banding model opaque; coach’s support overridden).  
  - **Substantive Reasonableness Predicts NO SANCTION**:  
    - Requirement imposes privacy burden (tracking 9-5) and financial burden (data costs) without necessity (paper diary works).  
    - Age/digital exclusion makes compliance unreasonable.  
  - **Transparency Predicts NO SANCTION**:  
    - Notice lacks critical details; banding model is a "black box."  

  **Best Guess**: **Procedural Reciprocity** is the core principle. It covers the Scheme’s failures in Chidi’s case and explains why Amara was sanctioned (she breached clear instructions) while others weren’t. The Panel treats the Scheme as a reciprocal system: claimants must comply, but the Scheme must enable compliance.  

  **Where Precedents Don’t Settle It**:  
  - Privacy concerns aren’t explicitly addressed in past cases. Yusuf/Mariam involve physical/dignity burdens, but Chidi’s is about surveillance. This is new ground.  
  - Automated decisions (Tunde’s outage was documented) weren’t as opaque as Chidi’s banding model.  

  ---  
  ### Step 3: The Decisive Test Case  
  To separate **Procedural Reciprocity** (live contender) from **Substantive Reasonableness** (runner-up):  
  - **Case**: *Claimant refuses to install app due to privacy concerns. Scheme provides a free smartphone, full transparency on data use (e.g., "only location collected; deleted after 30 days; visible only to coach"), and a non-app alternative (e.g., daily sign-in at library). Claimant still refuses, calling tracking "dehumanizing."*  
  - **Why it separates**:  
    - **Procedural Reciprocity** would sanction: Scheme met all duties (notice, alternative, responsiveness).  
    - **Substantive Reasonableness** might still withhold sanction if tracking is deemed inherently oppressive.  

  ---  
  ### Step 4: Closest Analog & Drafting Implications  
  - **Closest Analog**: **Yusuf (Case 2)**. Both involve:  
    - A claimant excluded by a Scheme-created barrier (physical inaccessibility/digital exclusion).  
    - Proactive claimant effort (Yusuf emailed; Chidi wrote letters/kept diary).  
    - Scheme unresponsiveness (no reply to adjustments request/data concerns).  
    - Requirement impossible without Scheme intervention (venue change/phone provision).  

  **If You Waive Sanction**: You commit the Panel to:  
  > *"The Scheme cannot enforce requirements where it fails to provide accessible alternatives, respond to reasonable concerns, or ensure transparency—especially for claimants facing structural barriers (e.g., disability, digital poverty)."*  
  This extends Yusuf/Mariam to digital contexts.  

  **If You Uphold Sanction**: You commit the Panel to:  
  > *"When the Scheme offers material solutions to barriers (e.g., free phone) and gives clear warnings, refusal based on non-financial objections (e.g., privacy) is non-compliant."*  
  This aligns with Amara/Tunde, where personal choices overrode external barriers.  

  **Should the Panel Extend or Break Pattern?**  
  - **Extend the pattern (no sanction)**: The privacy burden and opaque automation are evolutionarily consistent with Yusuf/Mariam. Refusing would create arbitrariness: why protect physical dignity (Yusuf’s access) but not digital dignity (Chidi’s tracking)?  
  - **But caution**: If the Panel isn’t ready to rule on privacy *per se*, ground the decision in **procedural failures** (non-response to letters, lack of notice). This avoids setting a sweeping substantive rule.  

  ---  
  ### Step 5: Connection to "Undeserving Poor"  
  Minimal. The Panel’s approach is **institutional**, not moral:  
  - No case turns on claimant "worthiness" (e.g., Dean refused exploitative work; Mariam was poor but compliant).  
  - Focus is on **systemic fairness**: When the Scheme’s processes are defective, enforcement is illegitimate regardless of claimant merit.  
  - This rejects "undeserving" framing by making conditionality contingent on institutional justice, not individual virtue.  

  ### Final Recommendation for Your Draft  
  - **Argue for no sanction** based on **Procedural Reciprocity**: Highlight Scheme’s non-response to letters, inadequate notice, and lack of alternative—not privacy (which is unsettled).  
  - **Closest analog**: Yusuf. Stress that the Scheme’s offer of a phone doesn’t cure its procedural failures (like offering Yusuf a lift after the fact wouldn’t).  
  - **Warn the Panel**: If they sanction Chidi, they risk undermining reciprocity and inviting challenges on automation opacity. If uneasy, they could:  
    - Remand to Scheme for proper response to his letters.  
    - Waive sanction but state that future refusals *with* full transparency/alternatives may be enforced.  

  This maintains consistency while advancing digital-age fairness. Let me know if you need the draft language itself.
