  Okay, the user wants a sestina poem about Otto Neurath's Isotype system, specifically addressing the challenge of representing counterfactuals like "deaths that didn't happen." They've provided six pictogram end-words (COAL, MAN, WOMAN, CHILD, LOAF, HOUSE) and want the form to mirror Isotype's principles: fixed meanings, repetition over scaling, and the limitation of visual symbols. 

  Hmm, the real challenge is balancing poetic form with conceptual accuracy. The sestina's permuting end-words perfectly mimics how Isotype reuses fixed signs in different sequences. But I must ensure each pictogram retains its core meaning throughout—no metaphors allowed. The MAN sign should only ever represent an adult male, never masculinity or labor abstractly.

  The counterfactual angle is tricky. The negation bar proposal exposes Isotype's limits: a crossed-out pictogram implies prohibition rather than absence, and requires verbal explanation. This subtly proves Neurath's point that visual language needs words as partners. I'll show this by having the envoi—that summary row at the chart's foot—struggle to contain the concept.

  User clearly knows their Neurath. They mention "helping language" and "visual education," so I'll weave in that tension: the poem itself becomes meta-commentary. When the envoi gathers all six signs but still can't resolve the negation bar's ambiguity, it demonstrates why Isotype isn't standalone. 

  Diction must stay plain as requested—no lyrical flourishes. "The bar is taught" is deliberately double-edged: both instruction and abstraction. "The chart that can't be drawn" nods to the counterfactual while keeping it accessible. Avoiding insider jargon means "LOAF" stays literal food, not "sustenance." 

  Final check: Are all six signs functionally distinct? HOUSE as shelter, LOAF as sustenance, etc. Yes. And the negation bar's failure in stanza five—"what never was"—sets up the envoi's resignation: even lined up neatly, some truths resist pictograms.
answer: |-
  ## Sestina for the Unmade Chart

  A chart was planned to show the lives retained
  beneath the ground, deep in the yielding **COAL**.
  Not figures tallied, but the breath of **MAN**
  still drawing, **WOMAN** spared the widow's shawl,
  the **CHILD** who grows, the **LOAF** upon the board
  secure inside the weathered, waiting **HOUSE**.

  The workshop hummed. Could such a quiet **HOUSE**
  of facts display what danger had retained –
  that absence dense as seams of mined-out **COAL**?
  A new sign then: a diagonal bar. That **MAN**
  crossed out meant gone? Or banned? A **WOMAN** barred
  might warn, not mourn the future of a **CHILD**.

  But pictures teach, the simple and the **CHILD**
  must learn the mark. That bar above the **HOUSE**,
  that slash across the form of **WOMAN**, **MAN**,
  abstracts the thought. What was retained
  demands the word. The unearned chunk of **LOAF**,
  the safety bought, the meaning in the **COAL**.

  For Isotype: one sign, one task. The **COAL**
  is fuel, a weight. It cannot show the **CHILD**
  who eats the bread, the comfort of the **LOAF**,
  the solid walls that make a steadfast **HOUSE**.
  Each mark repeats; more lives are thus retained
  by many **MAN**, not one enlarged great **MAN**.

  The bar itself is work, a thing to teach. That **MAN**
  crossed out is loss, but also blocks the **COAL**?
  Negation’s trick. What *never* was, retained
  like breath unseen? The saved, unknowing **CHILD**
  plays by the hearth within the sheltered **HOUSE**,
  unmarked by fear, beside the cut **LOAF**.

  The language helps. It shows the earned **LOAF**
  upon the plate, the labour of the **MAN**,
  the warmth contained within the simple **HOUSE**.
  It counts the tonnes of hewn and blackened **COAL**.
  It tallies heads: the **WOMAN**, **MAN**, the **CHILD**.
  But absence? Loss reversed? What was retained

  requires the word. The bar across the **MAN**
  implies "Don't enter!" more than "Life retained!"
  It guards the **LOAF**, forbids the **CHILD** the shaft,
  protects the **HOUSE**, says "Leave that seam of **COAL**!"
  Its meaning shifts. The saved **WOMAN** walks
  free of the mark. The chart remains unstained.

  **Envoi**
  The **HOUSE** stands whole. The **LOAF** is shared. The **CHILD**
  grows tall. The **WOMAN** works. The **MAN** digs **COAL**.
  The bar? A taught abstraction. Lives retained defy the grid. The chart stays undrawn.

  ---

  **Notes on Form & Content (as requested):**

  1.  **Sestina Structure:** Six stanzas of six lines, with the end-words permuted in a set pattern. The three-line envoi uses all six end-words, typically in a set order (often 2, 4, 6 / 1, 3, 5).
  2.  **Isotype Principles Embodied:**
      *   **Fixed Meanings:** Each pictogram (COAL, MAN, WOMAN, CHILD, LOAF, HOUSE) retains its core, literal meaning throughout every permutation. COAL is always fuel/mineral, MAN/WOMAN/CHILD are people, LOAF is food, HOUSE is shelter.
      *   **Repetition vs. Scaling:** The poem talks about "many MAN" and "counts the tonnes" and "tallies heads" – representing quantity through repetition of the identical sign, not by making one sign larger.
      *   **"One Sign, One Job":** The poem explicitly states this principle ("one sign, one task") and demonstrates it by keeping the signs semantically stable. COAL cannot suddenly represent danger or grief abstractly; it remains physical coal.
  3.  **The "Bite" - The Negation Bar & Limits:**
      *   The poem introduces the bar as a proposed solution ("a diagonal bar").
      *   It immediately questions its readability: "That MAN crossed out meant gone? Or banned?" highlighting ambiguity.
      *   It identifies the bar as an abstraction that "demands the word" and "is work, a thing to teach."
      *   It contrasts the bar's potential meaning ("loss," "blocks," "Don't enter!") with the desired meaning ("absence," "what *never* was," "Life retained!").
      *   It shows the bar fundamentally changes the sign's function ("Negation’s trick," "Its meaning shifts"), violating the "one sign, one job" principle.
      *   The final stanza and envoi conclude that representing the counterfactual ("Lives retained defy the grid") requires words ("requires the word") and that the purely pictorial chart remains impossible ("The chart stays undrawn"), affirming Neurath's view of Isotype as a "helping language."
  4.  **Accuracy to Isotype:**
      *   The poem accurately reflects the core principles of repetition, fixed meaning per sign, and flat silhouettes.
      *   It correctly identifies the difficulty of representing negation, counterfactuals, and abstract concepts (like "saved life") purely pictorially without introducing ambiguity or needing verbal explanation.
      *   The signs are used appropriately within their defined meanings (e.g., LOAF represents sustenance, HOUSE represents home/shelter).
  5.  **Accessibility:** The poem should stand alone as a meditation on representation, loss, and the limits of pictures, even for someone unfamiliar with Neurath. The diction is plain and direct.
