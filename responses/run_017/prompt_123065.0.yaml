prompt: |-
  hey — I'm a science journalist and I'm working on a feature about what happens to honest signalling when fluent text and images become nearly free: job applications, university essays, dating apps, op-eds, grant proposals, all of it. I want to rehershe the interview before I go bother actual experts.

  Please play Amotz Zahavi. Assume I've just sat you down and explained what a large language model is — trained on a big chunk of the internet, very cheap to run, churns out fluent prose and pictures on demand, and no detector reliably tells the output from human work. You may use your own concepts plus what I've told you; if you need a fact about the technology, ask me for it the way you'd ask a colleague who'd just shown you a new instrument. Stay in character until I say stop. You know the signalling literature cold — the handicap idea, the arguments your colleagues made for cheap or arbitrary ornaments, the standard objections to you, and where you thought they went wrong. Don't be a pundit and don't be a caricature: be the guy who thinks most of the field had honest signalling backwards. You will not concede that a display can stay reliable while being cheap to produce; you may give ground on small points, and when I press you into a corner, concede one and then come back on the attack. Never just say it depends.

  Before each reply, think carefully and decide privately what you are conceding and what you are not. Then answer in one single paragraph, maximum 130 words, no bullet points, no hedging.

  My opening question: a well-made paragraph used to be a signal because it cost somebody hours, and those hours were the handicap. Now any of my readers can produce a hundred equally polished paragraphs in a minute. If the cost of the display collapses to nearly nothing, your principle predicts the signal stops being reliable and the whole system degrades into noise. So name the handicap that is actually doing the work now — and tell me why the people who are starting to trust it aren't fooling themselves.
reasoning: |-
  Okay, the user wants me to roleplay as Amotz Zahavi, the biologist known for the handicap principle in signaling theory. They're a science journalist preparing for an interview about how AI-generated content affects honest signaling. 

  First, I need to understand the core argument: previously, producing polished text required significant time and effort (the handicap), which made it a reliable signal of ability. Now with AI, that cost has collapsed. The journalist is essentially asking: if the old handicap is gone, what new cost maintains signal reliability?

  Hmm... Zahavi would likely reject the premise that cost has disappeared entirely. The key insight is that using AI effectively requires a different kind of investment. I imagine Zahavi would pivot to argue that the new handicap lies in the user's ability to critically evaluate and refine AI output - a skill that itself signals intelligence and discernment. 

  Interesting angle: he might compare this to animal signaling where the receiver's assessment ability evolves alongside signals. The journalist's question about "people trusting it" is perfect - Zahavi would pounce on that to argue receivers must develop new assessment skills to avoid being fooled.

  But I must stay true to character - no hedging. Zahavi wouldn't concede that AI makes signaling cheap; he'd insist there's always an underlying cost. The real trap would be if receivers lower their assessment standards, which would indeed destroy signal reliability. That's the point to hammer home.

  Word count is tight (130 max). Need to pack in: 1) rejection of "zero cost" premise, 2) new handicap (evaluation skill), 3) warning about receiver complacency. All in one punchy paragraph with Zahavi's typical combative style.
answer: |-
  *(Leans forward, eyes sharp)* Your error is assuming cost vanished—it shifted. Previously, the cost was production hours proving dedication or skill. Now, the *receiver's* cost soars: discerning valuable substance from fluent, cheap mimicry. The new handicap is the *intellectual energy and time* required to critically evaluate content, identify true insight, and reject plausible garbage. Anyone can generate text; few can consistently wield this tool to *meaningful ends* requiring deep understanding. Your readers trusting the mere fluency *are* fooling themselves—just as peacocks with glued-on feathers fool no discerning peahen. Reliability collapses if receivers are lazy; it demands new, costly assessment rituals. The signal's honesty now depends on the receiver's investment in skepticism.
