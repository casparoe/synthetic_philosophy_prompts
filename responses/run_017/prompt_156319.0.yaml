  We are given 4 minutes, which is roughly 240 seconds. We must be concise.

  Brainstorming angles:

  1. **Reframing the Lifeboat: Shared Humanity and Interdependence**
     - Idea: The lifeboat metaphor assumes a fixed, isolated system. But schools and communities are interconnected and can grow. We are all in the same ocean, and helping others strengthens the whole community.
     - Why drop? While powerful, it might not directly address the physical constraints and the margin-of-safety concern. Also, might be seen as too abstract.

  2. **Practical Solutions and Shared Resources**
     - Idea: Focus on concrete steps: redistricting, temporary facilities, staggered schedules, and the fact that the district is already planning to address capacity. Emphasize that we have agency to expand the boat.
     - Why drop? It's a strong practical angle but might get bogged down in details in 4 minutes. Also, without philosophical grounding, it might not counter the emotional weight of the metaphor.

  3. **The Lifeboat as a False Dichotomy**
     - Idea: The metaphor presents a binary choice (save some or drown all) but in reality, we have multiple options: we can build more boats (expand facilities), share resources, and adapt. We are not in a fixed lifeboat but in a community that can innovate.
     - Why drop? This is a strong counter to the metaphor and leads well into practical solutions. I might choose this.

  4. **Moral Imperative and Future Consequences**
     - Idea: Even if it's hard, we have a moral duty to help. Refusing them sets a precedent of exclusion and harms our community's character. Also, these students are our neighbors and friends.
     - Why drop? Important, but might not address the practical concerns enough and could come off as preachy. The principal said not to make anyone feel like a villain.

  5. **The Lifeboat's Hidden Assumptions: Who Decides Capacity?**
     - Idea: The lifeboat metaphor naturalizes capacity as fixed and given, but capacity is a human-made constraint. We set class sizes, we build schools, we draw boundaries. We can change these decisions.
     - Why drop? This is very strong because it directly challenges the metaphor and empowers action. It also leads into the margin-of-safety issue by showing that we can create more safety.

  6. **The Ripple Effect: Helping Eastside Helps Us**
     - Idea: Taking these students will bring more state funding, diversify our school, and create opportunities for collaboration. It's not just charity; it's an investment in our collective future.
     - Why drop? Pragmatic and positive, but might be seen as opportunistic and not fully address the moral dimension. Also, the Eastside kids might feel like they're being instrumentalized.

  After brainstorming, I choose **Angle 3: The Lifeboat as a False Dichotomy** and integrate it with **Angle 5: The Lifeboat's Hidden Assumptions** and **Angle 2: Practical Solutions**. Why?

  - It directly addresses the metaphor (which Mr. Delgado and the parents know) and shows why it doesn't apply.
  - It allows me to concede the real concerns (capacity) without being trapped by the metaphor.
  - It turns the conversation to solutions and agency.
  - It avoids making anyone the villain by focusing on our collective ability to act.

  Now, let's outline the speech:

  1. **Opening**: Acknowledge the situation and the emotion.
  2. **Concede**: The lifeboat worry is understandable because we are at capacity and the halls are crowded. We all feel the strain and worry about safety and quality.
  3. **Turn**: But the lifeboat metaphor is misleading because it assumes we are powerless to change our capacity. We are not in a lifeboat; we are in a community that can build and adapt.
  4. **Address margin of safety**: Yes, we are at our limit. But that's exactly why we must act to expand our capacity, not turn people away. We can and will create a margin of safety by working together and using the resources we have (like the new gym, hiring, etc.).
  5. **Positive vision**: Emphasize that these students are not a tide or a burden, but neighbors. We can handle this with the plans already in place and by being creative.
  6. **Call to action**: Let's be the community that builds a bigger boat.

  Now, write the speech. Aim for 4 minutes (about 500-600 words, but we'll time it). We must be plain-spoken, avoid lecturing, and be sensitive to all.

  After the speech, we'll provide the JSON.

