  ### Civilian Scenario: The Lost Hiker
  A hiker is lost in one of two neighboring towns, Northville or Southville, each split into Riverside (near the river, 20% of the town) and Inland (the rest, 80%). The hiker contacts a ranger station via a GPS app that shows only the zone (Riverside or Inland), not the town. The ranger, following a town-blind protocol, sends this message: "If you're in Northville, there's a three-in-four chance you're in Riverside." The protocol is explicitly zone-dependent: Rangers are 12 times more likely to send this message from Riverside than from Inland, regardless of the town. Prior probabilities are symmetric: 50% for each town, and within each town, 20% for Riverside and 80% for Inland.

  #### Prior Probabilities
  - **Joint Probabilities**:
    - Northville, Riverside (NR): \( 0.5 \times 0.2 = 0.10 \)
    - Northville, Inland (NI): \( 0.5 \times 0.8 = 0.40 \)
    - Southville, Riverside (SR): \( 0.5 \times 0.2 = 0.10 \)
    - Southville, Inland (SI): \( 0.5 \times 0.8 = 0.40 \)

  - **Conditional Probability**: Prior \( P(\text{Riverside} \mid \text{Northville}) = 0.10 / (0.10 + 0.40) = 0.20 \).

  #### Messenger's Protocol (Likelihoods)
  - Probability of message \( M \) given zone:
    - If Riverside: \( P(M \mid R) = a = 12b \) (12 times more likely than from Inland).
    - If Inland: \( P(M \mid I) = b \).
  - Likelihood ratio \( a/b = 12 \) (under 20, as requested).

  #### Rule A: Update as Ordinary Evidence
  Treat \( M \) as evidence with likelihoods from the protocol.  
  - **Likelihoods given town** (town-blind protocol → same for both towns):  
    \( P(M \mid \text{Northville}) = P(M \mid R) \cdot P(R \mid \text{Northville}) + P(M \mid I) \cdot P(I \mid \text{Northville}) = (12b)(0.2) + (b)(0.8) = 2.4b + 0.8b = 3.2b \).  
    Similarly, \( P(M \mid \text{Southville}) = 12b \times 0.2 + b \times 0.8 = 3.2b \).  
  - **Marginal probability of \( M \)**:
    \( P(M) = P(M \mid \text{Northville}) \cdot P(\text{Northville}) + P(M \mid \text{Southville}) \cdot P(\text{Southville}) = (3.2b)(0.5) + (3.2b)(0.5) = 3.2b \).  
  - **Posterior for Northville**:
    \( P(\text{Northville} \mid M) = \frac{P(M \mid \text{Northville}) \cdot P(\text{Northville})}{P(M)} = \frac{(3.2b)(0.5)}{3.2b} = 0.50 \).  
  - **Verify conditional**:  
    \( P(\text{Riverside} \mid \text{Northville}, M) = \frac{P(M \mid NR) \cdot P(NR)}{P(M \mid \text{Northville}) \cdot P(\text{Northville})} = \frac{(12b)(0.10)}{(3.2b)(0.50)} = \frac{1.2b}{1.6b} = 0.75 \).  
    **Result**: \( P(\text{Northville} \mid M) = 50\% \).

  #### Rule B: Minimum KL Divergence with Constraint
  Minimize cross-entropy (KL divergence) subject to \( P(\text{Riverside} \mid \text{Northville}, M) = 0.75 \).  
  - **Posterior parameterization**:  
    Let \( x = P(\text{Northville} \mid M) \). Then:  
    - \( P(NR \mid M) = 0.75x \) (to satisfy constraint),  
    - \( P(NI \mid M) = 0.25x \),  
    - For Southville (no constraint, minimize KL by keeping conditional probs close to prior):  
      \( P(SR \mid M) = 0.20(1 - x) \),  
      \( P(SI \mid M) = 0.80(1 - x) \).  
  - **KL Divergence** (simplified; see derivation in arithmetic section):  
    \( D_{KL} = 0.70053x + 0.693147 + x \ln x + (1 - x) \ln (1 - x) \).  
  - **Minimize \( D_{KL} \)** by solving \( \frac{d}{dx} D_{KL} = 0 \):  
    \( 0.70053 + \ln x - \ln (1 - x) = 0 \) → \( \ln \left( \frac{x}{1 - x} \right) = -0.70053 \) → \( \frac{x}{1 - x} = e^{-0.70053} \approx 0.4965 \) → \( x \approx 0.3317 \).  
  - **Posterior for Northville**: \( x \approx 33.17\% \).  
  - **Verify conditional**: \( P(\text{Riverside} \mid \text{Northville}, M) = \frac{0.75 \times 0.3317}{0.3317} = 0.75 \).  
    **Result**: \( P(\text{Northville} \mid M) \approx 33.17\% \).

  #### Disagreement and Key Feature
  - **Disagreement**: Rule A: 50%, Rule B: 33.17% → **difference of 16.83 percentage points** (exceeds 15%).  
  - **Decomposition of Rule B's adjustment**:  
    - **Shrink antecedent (Northville)**: Prior 50% → posterior 33.17% (decrease of 16.83%).  
    - **Raise consequent (Riverside in Northville)**:  
      Absolute prob: Prior \( P(NR) = 0.10 \) → posterior \( P(NR \mid M) = 0.75 \times 0.3317 \approx 0.249 \).  
      This increase (from 0.10 to 0.249) compensates for Northville's shrinkage to satisfy \( P(R \mid N) = 0.75 \).  
    Rule B "satisfies" the report partly by making Northville less probable (shrinking antecedent) rather than only by adjusting the zone within Northville.  
  - **Single feature doing the work**: The prior conditional \( P(R \mid N) = 0.20 \) differs from the reported \( 0.75 \).  
    - **If removed (prior = reported)**: Suppose prior \( P(R \mid N) = 0.75 \). Then Rule B gives \( P(N \mid M) = 50\% \) (same as Rule A), as KL divergence is minimized at prior. Disagreement vanishes.  
    - **Why it works**: The discrepancy forces Rule B to reweight probabilities drastically to satisfy the constraint, while Rule A's town-blind protocol preserves symmetry.

  #### Defender's Response and Evaluation
  - **Rule B comes out worse**: It changes \( P(\text{Northville}) \) despite a town-blind protocol, violating intuition that the message carries no town information.  
  - **Defender of Rule B**: "The message is a *constraint*, not evidence. We must satisfy \( P(R \mid N) = 0.75 \) exactly, and KL minimization fairly redistributes probability. The protocol is irrelevant; only the semantic content matters."  
  - **Evaluation**: This reply works if the message is a direct belief constraint. But in this scenario, the message is generated by a physical protocol that only depends on the zone. Ignoring the protocol (as Rule B does) may lead to inaccurate beliefs. Rule A respects the causal process, so it is preferable here.

  #### Two Independent Reports
  - **Rule A**: Same likelihoods for both messages → \( P(N \mid M_1, M_2) = 50\% \) (unchanged).  
  - **Rule B**: Constraint \( P(R \mid N) = 0.75 \) is unchanged → posterior remains \( P(N \mid M) \approx 33.17\% \).  
  - **Gap holds** (still 16.83 percentage points). Repeated reports don't alter the disagreement.

  ### Arithmetic Details (Rule B KL Minimization)
  - **KL divergence**:  
    \( D_{KL}(Q \parallel P) = Q_{NR} \ln \frac{Q_{NR}}{P_{NR}} + Q_{NI} \ln \frac{Q_{NI}}{P_{NI}} + Q_{SR} \ln \frac{Q_{SR}}{P_{SR}} + Q_{SI} \ln \frac{Q_{SI}}{P_{SI}} \),  
    with \( P_{NR} = 0.10 \), \( P_{NI} = 0.40 \), \( P_{SR} = 0.10 \), \( P_{SI} = 0.40 \),  
    and \( Q_{NR} = 0.75x \), \( Q_{NI} = 0.25x \), \( Q_{SR} = 0.20(1 - x) \), \( Q_{SI} = 0.80(1 - x) \).  
  - **Substitute and simplify**:  
    \( D_{KL} = 0.75x \ln \frac{0.75x}{0.10} + 0.25x \ln \frac{0.25x}{0.40} + 0.20(1 - x) \ln \frac{0.20(1 - x)}{0.10} + 0.80(1 - x) \ln \frac{0.80(1 - x)}{0.40} \).  
    This reduces to \( D_{KL} = \text{constant} + 0.70053x + x \ln x + (1 - x) \ln (1 - x) \) after numeric integration.  
  - **Derivative set to zero**: Solved as above to get \( x \approx 0.3317 \).

  This case satisfies all requirements: civilian, symmetric, explicit protocol (ratio=12), disagreement >15%, both satisfy conditional, and the arithmetic drives the results. Rule B's town shift arises solely from the conditional constraint conflicting with the prior.
