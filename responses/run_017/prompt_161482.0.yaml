prompt: |-
  I am supervising an MPhil thesis on whether the distinction between doing and allowing — and, more narrowly, between killing and letting die — carries any moral weight of its own, and before my student writes the chapter that sets out what an account of the distinction would have to achieve, I want that specification written properly rather than assembled ad hoc from whichever cases happen to come to mind. So I would like from you a list of desiderata that any adequate theory of the doing/allowing distinction must meet, with the case or consideration behind each, and a view on which of them are genuinely required and which are merely the preferences of one camp (for instance, demands that the distinction be metaphysically prior to any normative facts, that it be describable without appeal to causation, that it be binary, or that it be neutral between a rights-based and a consequentialist framework).

  The list should be pushed into territory that the standard examples do not cover well, since that is where the accounts I have read seem to come apart. In particular I want it to handle: cases of double prevention, where an agent does not create a threat but diverts an existing one onto a different person, or removes something that was shielding them, so that the harm runs through the agent without originating in them; the difference between withholding support and withdrawing support one is already providing, and why that difference, if it is one, should matter when the patient's prospects are held fixed; cases in which someone's allowing is itself constituted by a long chain of small commissions — budget decisions, triage protocols, default settings in a system nobody individually chose — so that the description of the event as an omission is contested rather than given; and cases in which the agent is an automated or artificial system, where doing and allowing come apart as the difference between running and declining to run a computation, and where there is no bodily movement, effort, or phenomenology of agency to anchor the intuitive contrast. I also want the list to say what the distinction must not collapse into: it must not simply track causation, since some allowings look causally necessary for the outcome, and it must not simply track intention or foresight, since those are standardly treated as separate; and it should say something about the weight question, namely whether the distinction is to do independent moral work or is at best a proxy for other factors such as the cost to the agent, the existence of a duty of aid, or the difference between infringing a right and failing to confer a benefit.

  Two things matter to me most in the answer. First, tell me which pairs of desiderata you suspect cannot be jointly satisfied — if, for example, requiring that the distinction be sharp and non-negotiable is in tension with requiring that it handle distributed and automated agency, I want that stated as a result about the specification itself rather than smoothed over. Second, identify the single requirement that does the most work in ruling out existing contenders, and say why. The purpose the theory is being built for is fixed: it is meant to be usable by someone writing policy for an institution — a hospital trust drawing up guidance on withdrawing treatment, or a team specifying the default behaviour of an autonomous system that could intervene in a harm — who needs to know whether declining to act is, in the case at hand, morally different from acting, and if so how much of a difference it makes. If you think some of my cases are bad tests of a theory because they build in the very contestable description at issue, say so and tell me what should replace them. Please write the whole answer in British English.
reasoning: |-
  Okay, the user is supervising an MPhil thesis on the moral weight of the doing/allowing distinction, particularly killing vs. letting die. They need a robust list of desiderata for any adequate theory of this distinction, going beyond standard examples to cover tricky cases like double prevention, support withdrawal, distributed agency, and automated systems. They also want tensions between desiderata highlighted and the most problematic requirement for existing theories identified. The theory must be policy-applicable for institutional settings.

  First, I need to unpack the core philosophical challenges. The user is clearly well-versed in the literature but frustrated with ad hoc approaches. Their specified edge cases are carefully chosen to expose weaknesses: double prevention tests causal accounts, support withdrawal challenges act/omission binaries, distributed agency problematizes individual responsibility, and automated systems remove embodied agency cues. The institutional focus means the theory must handle real-world ambiguity while avoiding collapse into causation or intent.

  For desiderata, I'll start with core requirements any theory must meet: metaphysical coherence, norm-neutrality, and moral relevance. Then add robustness criteria for the listed edge cases. The policy constraint means I should emphasize applicability - no ivory tower solutions. 

  Key tensions emerge immediately: sharp boundaries vs fuzzy real-world cases (especially distributed systems), causal independence vs explaining double prevention, binary classification vs graded institutional decisions. The withdrawal vs withholding issue might reveal a fundamental flaw in act-focused approaches. 

  Existing theories likely stumble most on "distributed agency without primary causation." Most accounts (e.g., Bennett's positive/negative facts) assume identifiable actions, but budget decisions spread across committees evade this. The automated systems case is equally damning - code has no "effort" yet clearly "does" things when executing.

  For bad tests, the user's distributed agency example risks circularity by assuming the omission description is contested. Better to use triage protocols where designers actively configure "non-intervention" as policy. The automated systems case is strong but should specify identical outcomes from commission/omission to isolate the moral difference.

  The weight question needs careful framing: the distinction might only matter insofar as it signals other factors (duties, cost), but institutions need to know if it adds independent weight when those are held equal. I'll suggest hybrid approaches may be necessary given the tensions.

  The most exclusionary desideratum? Probably "handles institutional agency without anthropomorphism." Existing individual-focused theories can't parse corporate decisions where no single person "acts." This sinks causal and volitional accounts alike.

  British English reminders: "prioritise" not "prioritize", "metres" not "meters", "tumour" not "tumor". Keep examples NHS-relevant where possible.
answer: |-
  Here is a list of desiderata for an adequate theory of the doing/allowing distinction, tailored to your requirements, prioritising policy applicability, handling edge cases, and highlighting tensions. The list is structured with the desideratum, its rationale (including cases), and an assessment of its necessity.

  **Core Desiderata (Genuinely Required):**

  1.  **Normative Neutrality & Framework Independence:**
      *   **What:** The account must be describable and applicable without presupposing a specific normative framework (e.g., consequentialism, deontology, rights-based). It must be usable by both rights theorists (distinguishing rights violations from failures to benefit) and consequentialists (assessing overall outcomes).
      *   **Why:** Essential for institutional policy. A hospital trust or AI ethics board comprises diverse viewpoints; the distinction must facilitate debate, not presuppose its resolution. A theory embedding strong deontic constraints (e.g., "doings *always* infringe rights") would be unusable for a consequentialist-leaning team.
      *   **Necessity:** Genuinely Required. A theory failing this cannot serve its purpose in pluralistic policy contexts.

  2.  **Distinction from Causation:**
      *   **What:** The account must not reduce "doing" to "causally sufficient" or "allowing" to "causally irrelevant". It must accommodate causally necessary allowings and causally insufficient doings.
      *   **Why:** *Double Prevention*: Removing a shield (e.g., diverting a flood onto B's land instead of A's) prevents the shield from preventing harm to B. The agent causally enables harm to B but intuitively *does* harm (like killing), not merely *allows* it. *Withdrawing Support*: Stopping life support is causally necessary for death but often viewed differently (morally/legally) than *not starting* it, even with identical causal consequences.
      *   **Necessity:** Genuinely Required. Collapse into causation renders the distinction redundant and fails key cases.

  3.  **Distinction from Intention/Foresight:**
      *   **What:** The account must define doing/allowing independently of the agent's mental state. It must allow for unintended doings (e.g., negligent harm) and intended allowings (e.g., deliberately withholding aid to cause death).
      *   **Why:** Core to isolating the distinction's *own* weight. Intention/foresight are separate moral modifiers. Policy needs to know if the *structural* difference between acting and omitting matters *before* considering intent.
      *   **Necessity:** Genuinely Required. Conflation obscures the object of analysis.

  4.  **Accommodation of Double Prevention:**
      *   **What:** The theory must classify cases where an agent removes an obstacle or diverts an existing threat, causing harm without initiating a new threat sequence, in a way that aligns with (or explains deviations from) the strong intuition that this is often akin to *doing* harm.
      *   **Why:** See above. This is a major fault line in theories. Does diverting a trolley onto one track instead of another count as *doing* harm to those hit? Does removing a shield count as *killing*?
      *   **Necessity:** Genuinely Required. A key test case explicitly requested and central to policy (e.g., flood management, military targeting).

  5.  **Handling Withholding vs. Withdrawing Support:**
      *   **What:** The theory must provide a principled basis for why withdrawing support already being given (e.g., turning off a ventilator) might differ morally from withholding it initially, *even when the patient's outcome and causal role of the agent are identical*. If it finds no difference, it must robustly explain why intuitions suggesting one are mistaken.
      *   **Why:** Critical for medical ethics policy (DNR, withdrawal of treatment). The intuitive difference (often linked to duties incurred or "starting down a path") needs grounding in the act/omission structure itself, not just assumed.
      *   **Necessity:** Genuinely Required. Directly relevant to core policy application (hospital trusts).

  6.  **Applicability to Distributed/Institutional Agency:**
      *   **What:** The theory must classify actions/omissions arising from complex systems (budget decisions, triage protocols, software defaults) where no single individual "does" the harmful act in a traditional sense. It must address when a harmful outcome is *done* by the institution vs. *allowed* by it.
      *   **Why:** Policy *is* institutional agency. Was harm *done* by setting a low benefits cap, or merely *allowed*? Is an AI system's failure to intervene an *omission* or a designed *action* (inaction)? Contestable descriptions are the norm here.
      *   **Necessity:** Genuinely Required. Failure here makes the theory irrelevant for its stated purpose.

  7.  **Applicability to Automated/Artificial Systems:**
      *   **What:** The theory must classify events involving AI/automated systems where "action" is execution of code and "inaction" is non-execution, absent bodily movement, effort, or phenomenology. It must distinguish between the system *doing harm* (e.g., a faulty algorithm denying essential care) and *allowing harm* (e.g., an AI choosing not to override a harmful human decision it could have prevented).
      *   **Why:** Essential for specifying autonomous system behaviour. The intuitive contrast needs anchoring in structure, not embodied agency.
      *   **Necessity:** Genuinely Required. Directly relevant to the specified policy domain (autonomous systems).

  8.  **Moral Relevance (Specification):**
      *   **What:** The theory must precisely state *what kind* of independent moral work, if any, the distinction does. Does it *directly* affect permissibility/impermissibility (e.g., making some harms harder to justify if done)? Does it affect the *stringency* of justification required? Does it primarily signal other factors (cost, duty, rights infringement) *without* being fundamental itself? It must avoid merely asserting relevance.
      *   **Why:** The core thesis question. Policy needs to know *if* and *how* the distinction matters for decision-making weight.
      *   **Necessity:** Genuinely Required. The entire point of the investigation.

  **Commonly Desired but Contested or Problematic Desiderata:**

  9.  **Metaphysical Priority / Non-Normative Basis:**
      *   **What:** The distinction should be grounded in non-normative, descriptive facts (e.g., physical movements, causal structures, counterfactuals) prior to any moral evaluation.
      *   **Why:** Preferred by those seeking an "objective" foundation, avoiding circularity. Seems necessary if the distinction is to *explain* moral differences.
      *   **Problem:** Deeply contested. Some argue the distinction is inherently normative or concept-dependent (e.g., dependent on notions of duty or normal expectations). *Tension*: Achieving this while satisfying Desiderata 6 & 7 (distributed/automated agency) is extremely difficult, as the "descriptive facts" become elusive. Institutional "actions" are defined by roles and rules, which are normative. Algorithmic "actions" are defined by design intent and specification, also normative.
      *   **Status:** Camp Preference (often realist/non-normativist). Not strictly required for policy use if the *operationalisation* is clear, even if metaphysically non-fundamental.

  10. **Binary Classification:**
      *   **What:** The distinction should be sharp: an event is either a doing or an allowing, not a matter of degree.
      *   **Why:** Simplicity, clarity for decision rules. Aligns with some intuitions (killing vs. letting die).
      *   **Problem:** Difficult to sustain with Desiderata 4 (Double Prevention - is it pure doing?), 5 (Withdrawing/Withholding - a difference in degree?), and especially 6 (Distributed Agency - degrees of involvement/responsibility). Policy often deals in thresholds and balances, not absolutes. *Tension*: Strong binary requirement conflicts with the nuanced reality of Desiderata 5, 6 & 7.
      *   **Status:** Camp Preference (often deontological/absolutist). Likely *too strong* for a practical policy tool; a theory allowing gradedness or context-dependence might be more useful.

  **Identified Tensions Between Desiderata:**

  *   **Sharp Binary (10) vs. Distributed/Automated Agency (6,7) & Withdrawing/Withholding (5):** Insisting on a bright line clashes with the fuzzy, context-dependent, multi-agent nature of institutional and algorithmic decisions. A theory prioritising 6,7 & 5 likely needs to soften 10.
  *   **Metaphysical Priority (9) vs. Distributed/Automated Agency (6,7):** Finding a purely descriptive, non-normative basis for classifying institutional "actions" or algorithmic "executions" as doings or allowings is arguably impossible. The relevant facts (roles, rules, specifications, design intents) are steeped in normativity. A theory satisfying 6 & 7 likely requires abandoning or reinterpreting strict 9.
  *   **Normative Neutrality (1) vs. Moral Relevance Specification (8):** Defining *how* the distinction matters morally without leaning towards one framework (e.g., rights vs. welfare) is challenging. The specification in 8 must be abstract enough to fit diverse frameworks while still being substantive.

  **The Most Exclusionary Requirement:**

  *   **Desideratum 6: Applicability to Distributed/Institutional Agency.** This requirement does the most work in ruling out existing contenders. Why?
      1.  **Anthropocentrism:** Most classic theories (Bennett, Foot, Quinn) focus on *individual* bodily movement, effort, or direct causal chains. They lack the conceptual tools to parse complex organisational structures, diffusion of responsibility, and policy-as-action.
      2.  **Causal Simplicity:** Theories relying on causal structures (e.g., initiating vs. failing to interrupt a sequence) struggle with long, diffuse causal chains involving many small contributions (budget cuts) or systemic features (default settings).
      3.  **Act Identification:** Defining the relevant "act" or "omission" is immensely difficult when harm results from innumerable small decisions or entrenched protocols rather than a discrete event by an identifiable agent. Existing theories often presuppose this identifiability.
      4.  **"Description Contested":** This desideratum explicitly embraces cases where categorisation is inherently disputed, demanding the theory provide resolution. Most theories assume the description is relatively stable. This requirement exposes theories that rely on pre-theoretical intuitions about clear cases.

  **Assessment of Your Cases & Potential Replacements:**

  *   **Double Prevention:** Excellent test. Directly challenges causal reductionism.
  *   **Withdrawing vs. Withholding:** Excellent test. Directly relevant to policy and probes intuitions about incurred duties/path-dependence within the act/omission structure. *Ensure patient prospects are genuinely identical*.
  *   **Distributed Agency (Long Chain of Small Commissions):** This is a **crucial** test, but your phrasing ("description... contested rather than given") is *itself* a key feature, not a flaw. **Do not replace it.** The theory *must* grapple with cases where the prima facie description is ambiguous and contested; that's the reality of institutional policy. The test is whether the theory provides a *principled* way to resolve the contestation or explains why it's unresolvable within the doing/allowing frame. *Refine* by specifying concrete policy examples (e.g., "Was harm *done* by setting hospital funding below level X, or merely *allowed* due to constrained resources?").
  *   **Automated Systems:** Excellent test. Removes anthropomorphic crutches. *Strengthen* by specifying cases where the *outcome* is identical whether harm results from commission (buggy code actively causing harm) or omission (code failing to prevent harm it was designed to prevent), isolating the structural difference.

  **Conclusion for Policy:** An adequate theory must provide a clear, operationalisable framework for classifying events as doing or allowing within complex institutional and technological contexts, distinct from causation and intent, capable of handling contested descriptions (especially in distributed systems), and specifying *if* and *how* this classification carries independent moral weight relevant to justification thresholds or permissibility. It likely needs to move beyond strict metaphysical priority and binary classification to handle the messy reality of policy. The ability to parse distributed agency is the highest hurdle for existing theories. The resulting theory won't provide automatic answers but should structure the debate, clarify the relevant descriptive (or descriptive/normative hybrid) features, and pinpoint where normative disagreement truly lies (e.g., on the *weight* question or underlying duties) once the doing/allowing classification is made.
