prompt: |-
  Next week I'm taking over one 75-minute session of a friend's philosophy of biology seminar — about a dozen second-years, whiteboard only, no slides, and they haven't read anything for it (I'd rather not put author names on the board and attach them at the end, so the plan has to work with names withheld). Roughly half are bio majors who've had natural selection but seem to think of it as survival of the fittest in a vaguely optimizing way; the other half are philosophy majors who hear "function" as "purpose" and have done a bit on intentionality. I want them to leave holding the three-way contrast between the selected-effect story, the causal-role story (what the item contributes to some containing system's capacity), and the forward-looking story (what it would do for fitness down the line). That's my working gloss — tell me if the gloss itself is what's going to mislead them.

  Don't explain the debate to me; plan how I teach it. Concretely, I need the dependency structure: what has to be in place before each piece can even be stated, and why. I was going to open with a stenosed heart valve, on the grounds that "this heart isn't doing what it's supposed to do" is the datum every account has to earn — but does opening there quietly tilt the room toward the selected-effect view before the other two are even on the table? Then: which single case should carry the hour? My candidate is a plastic-chewing enzyme produced by directed evolution in a lab and then sprayed on a landfill — it has a real selection history, but no organism, no fitness, no ancestors, and its unclear what the containing system is supposed to be. Does that discriminate the three accounts cleanly, or does it drag in artifacts and experimenters' intentions way too early? Either way, tell me what the carrying case has to have and what it has to lack.

  Misconceptions I'm braced for: that "selected for" just means "useful right now"; that the selected-effect view smuggles in a designer; that the causal-role view makes any old effect a function (heart sounds, the thump a valve makes); that vestigial organs refute the selected-effect view; and the big one, that the whole dispute is merely verbal and you can mean whatever you like by "function". Which of these will actually form first and which am I inventing, where in the sequence should I head each off, and is the "its just verbal" one something to defuse or to partly concede at minute 60? The bio majors will also ask, obv, what any of this has to do with that junk-DNA fight about how much of the genome is really functional — where does that fit? And I want one question for the last five minutes that they can't answer with "it depends what you mean by function". Finally, what should I openly refuse to explain at this level — units of selection, the disease-as-dysfunction literature, the link to mental content — and say out loud that I'm refusing?
reasoning: |-
  Okay, let me start by unpacking the user's request. They're taking over a philosophy of biology seminar for second-year students, split between bio and philosophy majors. The main goal is to teach the three-way contrast in function concepts: selected-effect, causal-role, and forward-looking. The user wants a concrete lesson plan with dependencies, a central case study, and strategies to address misconceptions.

  First, I need to ensure the three concepts are clearly defined without jargon. The user mentioned that bio majors might oversimplify natural selection, while philosophy majors might conflate function with purpose. So, the initial examples must disentangle common intuitions from technical definitions. The stenosed heart valve is a good starting point because it's a clear dysfunction, but I worry it might bias toward selected-effect. Maybe introducing it after establishing the problem of malfunction could work, but without mentioning selected-effect first.

  The plastic-chewing enzyme case seems strong. It has a selection history (directed evolution) but no natural organism, fitness, or ancestors. This should highlight the differences: selected-effect requires natural history, causal-role needs a system, and forward-looking focuses on future fitness. But does the lab setting introduce artifact intentions? The user is concerned about dragging in experimenter intentions. I think emphasizing that directed evolution mimics natural selection without intentional design could mitigate that. However, the "sprayed on landfill" part might complicate the containing system for causal-role. Maybe specify the enzyme's role in a bioremediation system to clarify.

  Next, misconceptions. The bio majors might think "selected for" means current usefulness. Using the enzyme in a different context (like in the ocean) could show that function isn't just about current utility. Philosophy majors might see selected-effect as smuggling in a designer. Clarifying that natural selection is mindless is crucial. Vestigial organs, like the appendix, can be used to show selected-effect only if there's past selection, not current function. The "merely verbal" objection might come up late; conceding that definitions vary but highlighting why distinctions matter (e.g., in junk-DNA debates) could help.

  The junk-DNA question from bio majors needs integration. Explaining that different function concepts lead to different interpretations of genomic elements ties back to the three views. This fits well when discussing causal-role (current biochemical activity) vs. selected-effect (evolutionary history).

  For the closing question, something that forces application: "Do plasmids in antibiotic resistance have a function?" This requires choosing a lens, preventing a "it depends" answer. Also, explicitly avoiding topics like units of selection keeps focus manageable.

  Structure-wise, starting with the heart valve as a problem case sets up why we need multiple concepts. Then the enzyme case dissects each view. Addressing misconceptions as they arise—designer confusion early, vestigial organs when discussing selected-effect, verbal dispute late. Timing each section to leave room for the final question and avoided topics.

  Need to ensure dependencies: first, establish malfunction to show insufficiency of common intuitions. Then introduce each function concept with prerequisites: for selected-effect, need natural selection history; causal-role requires a system and contribution; forward-looking needs future fitness impact. The enzyme case must lack certain elements to isolate each view.

  Finally, explicitly state exclusions upfront to manage scope. Highlighting real-world applications like junk-DNA debates reinforces the importance of these distinctions. Keeping the session interactive with whiteboard examples will engage both majors.
answer: |-
  Here's a battle-tested lesson plan structured around dependencies, misconceptions, and your plastic enzyme case, designed to build the contrast cleanly and head off predictable errors:

  **Core Dependency Structure & Sequence (75 min):**

  1.  **Anchor the Problem: Malfunction & Intuition (10 min)**
      *   **Start:** "A doctor examines a patient with a stenosed heart valve. She says: 'This valve isn't *functioning* properly.' What does she mean? What *should* it be doing?" (Board: "Stenosed Valve - Not Functioning")
      *   *Elicit:* Pump blood efficiently? Allow flow? Keep you alive? (Get the bio/phil intuitions out).
      *   **Key Move:** "Okay, 'should' implies some standard. Where does *that* standard come from? What makes pumping blood its 'function'?" *Don't answer yet!* This is the puzzle.
      *   **Why here?** Establishes the *datum* (dysfunction) all theories must explain *without* committing to an answer. Avoids SE bias by making the *question* primary. Prerequisite for *all* accounts.

  2.  **Introduce the Triad & Their Core Questions (5 min)**
      *   "Philosophers & biologists offer different answers, centered on 3 key questions:" (Board 3 columns: SE / CR / FL)
          *   **SE:** What was this *item's past contribution* to the *survival/reproduction* of its ancestors/organism?
          *   **CR:** What *current causal contribution* does this item make to a *larger system's* capacity/activity?
          *   **FL:** What *future survival/reproduction benefit* does this item *tend to produce* for the organism/system?
      *   **Prerequisite:** Explicitly frames the *kinds* of answers we're looking for. No details yet, just the lenses.

  3.  **Build Causal-Role (CR) - The System's Needs (15 min)**
      *   **Case 1:** The Heart *Now*. "Forget evolution. Right now, in this body: What does the heart *do*? What system is it part of? (Circulatory system). What does *that* system need to do? (Deliver O2/nutrients, remove waste). How does the heart causally contribute to *that*? (Pump blood). So, CR says its function is pumping blood."
      *   **Case 2:** Radiator in a Car. "What's the radiator's CR function? (Dissipate engine heat to maintain operating temp). Why? Because the car system (engine) needs to stay cool to run."
      *   **Key Moves/Misconception Defense:**
          *   Emphasize: *Defined by current causal contribution within a specific, organized system.*
          *   **Head off "Any Effect":** "Is the *sound* of the heart pumping its function? (No). Why not? (It doesn't contribute to the circulatory system's *capacity* - the sound is just a side effect). What about the valve's *thump*? (Same). CR function isn't *any* effect, only effects *contributing to a capacity of the containing system*."
          *   **Prerequisite for CR:** Concept of a *system* with *capacities* and *component parts* making causal contributions.

  4.  **Introduce Selected-Effect (SE) - The History Lesson (20 min)**
      *   **Case 1:** Back to the Heart. "Why do we *expect* hearts to pump blood? Why is that the standard? CR tells us what it *does*, but not why we *expect* it to do that specific thing." Connect to malfunction intuition.
      *   **Core Idea:** "SE says: Pumping blood is its function *because* ancestors with hearts that pumped blood well were more likely to survive and reproduce than those with hearts that pumped poorly (or not at all). The *past success caused* the trait's presence."
      *   **Case 2:** Polar Bear Fur. "Function: Insulation. Why? Because past bears with better insulation survived Arctic cold better and left more offspring."
      *   **Key Moves/Misconception Defense:**
          *   **Head off "Designer":** "Notice: No designer needed! Just mindless natural selection acting on variation over generations." (Board: Mindless NS, Variation, Heritability, Differential Reproduction).
          *   **Head off "Useful Now = Selected For":** "Imagine we dump a polar bear in the tropics. Is its thick fur still *useful*? (No, harmful). Does it still have the SE *function* of insulation? (Yes!). Why? Because the function is fixed by *past* selection, not current utility." Crucial distinction.
          *   **Address Vestigials:** "What about the human appendix? Does it *have* an SE function? Maybe not *anymore*! Its (possible) past function (digesting cellulose?) is lost. It *lacks* a current SE function, which is *why* we call it vestigial. This *fits* SE, doesn't refute it!" (Board: Vestigial = No *Current* SE Function).
          *   **Prerequisite for SE:** Basic understanding of natural selection (which bio majors have, recap quickly). Concept of *heritable traits* and *ancestral populations*.

  5.  **Introduce Forward-Looking (FL) - The Future Promise (10 min)**
      *   **Core Idea:** "FL is simpler: An item's function is whatever it *does now* that *increases the fitness* (survival/reproduction chances) of the organism/system *in the future*."
      *   **Case 1:** Heart *Now*. "Its FL function is pumping blood *because* doing that right now increases the organism's chances of surviving and reproducing later today/this year."
      *   **Case 2:** A Bird Building a Nest *Right Now*. "FL function: Provide shelter for future young, *because* building it now increases the chances of future offspring surviving."
      *   **Key Distinction:** Contrast with SE immediately. "Is this different from SE? Absolutely! SE looks *backwards* to the causal history. FL looks *forwards* to probable consequences *now*."

  6.  **The Crucible: Plastic-Chewing Enzyme (Directed Evolution -> Landfill) (10 min)**
      *   **Present the Case:** "Scientists use 'directed evolution' in the lab: Start with a weak enzyme, mutate it, *select* variants that chew plastic best, repeat for many generations. Result: Super plastic-chewer. They then spray it on a landfill."
      *   **Q1:** "Does this enzyme have a *Selected-Effect (SE) function*? If so, what?" *Yes: Chewing Plastic.* Why? It was *selected for* precisely that effect in the lab environment over many generations. It has a real *selection history*, even if artificial/accelerated. *No organism/ancestors?* Argue the lab strain *is* the evolving lineage. *Key: History is present.*
      *   **Q2:** "Does it have a *Causal-Role (CR) function*? If so, what, and *in what system*?" *Tricky!* Depends on the system defined.
          *   *In the engineered bacterial strain in the lab?* Yes: Digest plastic for energy (if designed that way).
          *   *Sitting in a vial?* Maybe no *relevant* system/contribution.
          *   *Sprayed on landfill?* What's the *organized system*? The landfill isn't an organized system like an organism. Is it part of a bioremediation *project/system*? Then maybe: Breaking down plastic to reduce waste volume. *Key: CR requires specifying the containing system and its capacities.*
      *   **Q3:** "Does it have a *Forward-Looking (FL) function*? If so, what?" *Highly Context-Dependent.*
          *   *In the lab strain?* Yes: Chewing plastic to provide energy/nutrients (if designed), increasing *that bacterium's* future fitness *in the lab*.
          *   *Sprayed on landfill?* Does chewing plastic *now* increase *the enzyme's own* future survival/replication? Enzymes aren't organisms! No inherent fitness. Does it increase the fitness of *other organisms* in the landfill? Unclear and indirect. *Key: FL requires a bearer of fitness (usually organism) and a causal link to future fitness.*
      *   **Why it Works:** Perfectly isolates the dependencies. SE: Needs history? (Yes). CR: Needs a defined system? (Problematic in landfill). FL: Needs a fitness bearer & future benefit? (Problematic for enzyme alone). Shows SE can exist without "natural" organisms. Forces precision on "system" for CR and "fitness bearer" for FL.

  7.  **Contrast, "Junk DNA", and Defusing "Just Verbal" (5 min)**
      *   **Board the Triad:** Summarize core principles side-by-side (Past History / Current Sys Contribution / Future Fitness Impact).
      *   **Address "Just Verbal":** "Is this just arguing about words? *Partly yes* – you can *stipulate* a definition. BUT! (Crucial) The *concepts* track fundamentally different *properties* of the world: historical origins vs. current organization vs. future consequences. Choosing one matters for real questions..."
      *   **Junk DNA Integration:** "...Like 'junk DNA'! If you mean 'no *Selected-Effect* function' (no past selection for a specific effect), maybe 90% is junk. If you mean 'no *Causal-Role* function' (no current biochemical activity in the cell), maybe much less is junk. The *fight is often about which concept of 'function' is most biologically relevant*." (This answers the bio majors' "so what?" instantly).
      *   **Partly Concede:** Acknowledge definitions can be chosen (min 60), but **insist** the underlying distinctions (history/current org/future) are real and consequential.

  **Final Question (Last 5 min):**
  *   **"Does a *randomly occurring* neutral mutation (one with no effect on fitness at all when it arises) have a *function*? Explain why or why not using at least two of our concepts."**
      *   Forces application: SE (No history of selection for effect)? CR (Might have some tiny causal effect, but likely not contributing to any significant system capacity)? FL (By definition, no future fitness impact)? Prevents "it depends" by requiring specific lens application.

  **What to Explicitly Refuse (State Early & Briefly):**
  1.  **Units of Selection:** "We're talking about function *of traits/parts*, not *what* is being selected (genes, individuals, groups). That's a different, though related, can of worms."
  2.  **Disease/Dysfunction Literature:** "While malfunction started us off, the deep philosophical debates defining 'disease' based on function add another layer we won't peel back today."
  3.  **Mental Content:** "We're focused on biological function (hearts, enzymes). Applying this to minds (beliefs, desires) is fascinating but a whole other seminar!"
  4.  **Artifact Intentions (Deep Dive):** "We'll touch on the enzyme created in a lab, but we won't dive into the complex debate about whether designer intentions *define* function in artifacts vs. selection history in the artifact's 'lineage'."

  **Why this Structure Works:**
  1.  **Builds Sequentially:** Malfunction (Problem) -> CR (Intuitive "Now") -> SE (Explains "Should") -> FL (Future) -> Enzyme (Tests All). Each step provides foundation for the next.
  2.  **Targets Misconceptions Proactively:** Addresses "designer," "current use=SE," "any effect=CR," and "vestigials refute SE" *as they naturally arise* during concept development.
  3.  **Carrying Case Delivers:** The enzyme perfectly exposes the core dependencies of each view (History/System/Fitness-Bearer) by *lacking* the easy answers present in organisms.
  4.  **Connects to Relevance:** Junk DNA example shows immediate biological stakes of the distinction.
  5.  **Manages "Verbal" Objection:** Concedes the point partially but elevates it to show the *conceptual* distinctions matter for real science.
  6.  **Final Question:** Forces synthesis and prevents cop-out.

  **Whiteboard Strategy:** Keep the 3 columns (SE/CR/FL) up after intro. Add key principles under each as you go. Add the enzyme analysis under each column. Keep the core contrasts visible. Good luck! This is a great topic.
