answer: |-
  ## Adversarial Collaboration: The Norm of Assertion

  **Parties:**  
  - **KN Proponent (K):** Assertion is constitutively governed by a knowledge norm (KNA): "One must: assert p only if one knows p." The "only if" direction is primary.  
  - **RC Proponent (R):** Assertion is governed by a reasonable credence norm (RCNA): "One must: assert p only if one's credence in p is sufficiently high, relative to one's total evidence and the contextually set threshold for sufficiency." Knowledge is neither necessary nor sufficient.  

  **Section 1: Agreed Claims**  

  1.  **Nature of Assertion:** We agree assertion is a distinct speech act characterized by its *word-to-world* direction of fit. The speaker presents a proposition *p* as true, aiming to add *p* to the conversational common ground, inviting the audience to accept *p* based on the speaker's say-so. It contrasts with questions, commands, promises, and expressions of opinion lacking this commitment.
  2.  **Core Function:** We agree the core function of assertion in communication is to *transfer information* and *extend the body of shared knowledge/reliable information* within a community. Assertions aim to be trustworthy inputs for hearers' reasoning and action.
  3.  **Shared Data (Phenomena Requiring Explanation):**
      *   **Moorean Absurdity:** Utterances like "It's raining but I don't know it is" or "p, but I don't believe p" are profoundly defective *as assertions*, even if the speaker believes/knows p. Both norms must explain this.
      *   **Lottery Paradox:** Asserting a single losing lottery ticket (e.g., "Ticket #347 lost") based *only* on the probabilistic odds (1/n chance of winning) feels intuitively improper, even if the ticket *is* a loser. Merely having very high credence seems insufficient here. (K claims special strength here; R claims context explains).
      *   **Testimonial Transmission:** Assertion is the primary vehicle for testimony. When hearers acquire knowledge/belief via testimony, it seems they do so *because* the speaker asserted it, under appropriate conditions. Any norm must account for how testimony can generate knowledge/justified belief.
      *   **Hedging & Retraction:** Speakers naturally hedge assertions ("I think p", "Probably p") when unsure, and retract assertions ("I take it back", "I was wrong") upon discovering counter-evidence. Norms must explain the appropriateness of these practices. Retraction seems especially natural when knowledge is lost or credence drops significantly below the relevant threshold.
      *   **Actionability:** Hearers typically feel entitled to rely on assertions for practical reasoning and action, barring defeaters. Norms must ground this reliance.

  **Ownership of Data (Partial):**
  *   **KN Proponent (K):** The Lottery Paradox and the specific *force* of retraction upon losing knowledge are phenomena the KNA explains most directly and powerfully. They strongly suggest a requirement stronger than mere justified high credence.
  *   **RC Proponent (R):** The gradability of hedging ("I'm pretty sure", "It's likely") and the contextual variation in what counts as sufficient warrant for assertion (e.g., casual chat vs. courtroom testimony) are phenomena the RCNA explains most naturally. They suggest a context-sensitive threshold rather than a binary knowledge state.

  **Section 2: Disagreements Table**

  | Disagreement Focus         | KN Proponent (K) Formulation                                                                 | RC Proponent (R) Formulation                                                                                                                               |
  | :------------------------- | :------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1. **Necessity of Knowledge** | Knowledge is *necessary* for permissible assertion. Asserting p without knowing p violates the constitutive rule, rendering the act defective *as an assertion*. | Knowledge is *not necessary* for permissible assertion. A speaker with sufficient, properly calibrated credence based on their total evidence can permissibly assert p even without knowing p. |
  | 2. **Sufficiency of Knowledge** | Knowing p is *sufficient* for permissible assertion (absent defeating pragmatic factors like Gricean maxims). If you know p, you are epistemically positioned to assert p. | Knowing p is *not sufficient* for permissible assertion. If the stakes are high enough *for the hearer* or the context demands extraordinary certainty, even known p might be improper to assert without hedging (e.g., asserting "The plane is safe" to nervous flyers based on standard maintenance checks). |
  | 3. **Role of Belief**        | Proper assertion *requires* belief that p. One cannot sincerely present p as true without believing it. The Beliefless Witness does not genuinely *assert*. | Belief that p is *not required* for proper assertion. What matters is that the speaker's expression reflects the credence warranted by their evidence/calibration. The Beliefless Witness *can* assert properly if their output meets the RCNA. |
  | 4. **Retraction Standard**   | One is generally obligated to retract an assertion if one *ceases to know* p, even if one's high credence remains rationally justified by one's *original* evidence (e.g., Gettier cases). | One is obligated to retract an assertion if one's credence in p drops *below the contextually relevant threshold*, or if one learns new evidence undermining the original warrant. Merely losing knowledge without a drop in warranted credence (e.g., some Gettier cases) does *not* mandate retraction. |

  *Note on Verbal Dispute:* Part of the disagreement regarding sufficiency (Row 2) likely involves the role of pragmatic encroachment. K sees knowledge as invariant to stakes; R sees stakes as partially *constitutive* of the contextually required threshold for assertion via the RCNA. R effectively incorporates what K might call "pragmatic factors" into the *epistemic* norm itself.

  **Section 3: Cruxes & Predictions**

  **(a) Stakes Sensitivity:**  
  *   **Case:** Same speaker, same evidence for p (e.g., visually confirmed low-risk proposition), two hearers. Hearer A: Mistake costs nothing (e.g., trivia). Hearer B: Mistake costs everything (e.g., life-or-death decision).
  *   **Relevant Observation:** Is it intuitively equally appropriate, less appropriate, or impermissible for the speaker to make the *same* flat assertion "p" to Hearer B compared to Hearer A? Does hedging become obligatory for B?
  *   **KN Prediction (K):** Appropriateness of assertion is unchanged. The speaker knows p. While pragmatic factors might suggest *caution* or *extra reassurance*, the *assertion itself* remains epistemically permissible. Impermissibility only arises if knowledge is absent.
  *   **RC Prediction (R):** Asserting flat-out "p" to Hearer B is impermissible or highly inappropriate. The contextually required threshold for sufficiency is much higher for B. The speaker must either hedge significantly ("I'm very confident p", "Based on X, p") or gather more evidence before asserting. Same flat assertion to A is fine.

  **(b) The Beliefless Witness:**  
  *   **Case:** A perfectly calibrated forecasting system (or a press officer robotically reading a meticulously compiled report she hasn't processed personally) outputs "The bridge is unsafe" or "There's an 0.8 chance the bridge is unsafe" based solely on its evidence feed. It holds no doxastic attitude towards the proposition.
  *   **Relevant Observation:** Does this output constitute an *assertion*? Does it violate any norm of assertion?
  *   **KN Prediction (K):** This is *not* a genuine assertion. Assertion requires the speaker to present p *as something they believe/know*. Without belief/knowledge, it's merely an evidence report or prediction output. It cannot violate the norm of assertion because it isn't *asserting*. (It might violate norms for evidence reporting).
  *   **RC Prediction (R):** This *is* an assertion (especially the probabilistic one). The system/actor is presenting p (or the probability) as reliably supported by the total evidence, meeting the contextually required threshold for calibration. It satisfies the RCNA. It *can* assert and does so permissibly here.

  **(c) Selfless Assertion:**  
  *   **Case:** A teacher at a religious school, who personally believes creationism is true (based on faith), knows evolutionary theory thoroughly (based on scientific evidence). She asserts "Humans and apes share a common ancestor" in a biology class, solely because it's the established science she's obligated to teach.
  *   **Relevant Observation:** Is this assertion epistemically permissible?
  *   **KN Prediction (K):** The assertion is *impermissible*. The teacher does not *believe* p (and arguably does not *know* p, lacking belief). She violates the KNA (and the belief requirement). Her action might be pragmatically justified but is defective *as an assertion*.
  *   **RC Prediction (R):** The assertion is *permissible*. The teacher has overwhelming evidence warranting very high credence in p, and her expression reflects this evidential support. Her personal faith-based *belief* is irrelevant to the warrant provided by her scientific knowledge/evidence. She satisfies the RCNA.

  **(d) Hedged-Assertion Community:**  
  *   **Case:** Imagine a linguistic community with no bare assertoric form. All statements expressing factual claims must include an explicit confidence marker (e.g., "Probably p", "0.8 chance p", "Certain p"). Hearers fully expect and rely on these markers for action, calibrating their reliance to the stated probability. "Certain p" functions like our flat assertion for high-stakes reliance.
  *   **Relevant Observation:** Does this community lack the speech act of *assertion* entirely? Or are they making assertions, just with mandatory explicit hedging? Is their practice fundamentally deficient or fully functional?
  *   **KN Prediction (K):** This community *lacks* genuine assertion. Assertion requires the unqualified presentation of p as true (flat-out commitment). Their "Certain p" comes closest but is still hedged. Their practice is impoverished; they cannot perform the core act of presenting p *simply as fact* for shared acceptance. Transmission of knowledge via testimony is hampered.
  *   **RC Prediction (R):** This community *performs assertion* constantly, just with explicit epistemic modals. "Certain p" *is* their flat assertion, meeting the highest contextually possible threshold. Their practice is *fully functional* for information transfer and action guidance; arguably more transparent and precise. Testimony transmits highly reliable, appropriately calibrated information. No deficiency exists.

