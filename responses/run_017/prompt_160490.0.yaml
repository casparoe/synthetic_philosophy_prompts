     - We can use a world model that includes Omega's simulation. During training, we can run the policy in the tails state (even when we are in the heads branch) to compute the effect on the heads reward. This is like having two rollouts: one for heads and one for tails, but the agent only experiences one. We can use off-policy evaluation: in the heads branch, we need to evaluate the policy in the tails state (which we didn't run). We can do this by having a simulator that can run the policy in any state.

