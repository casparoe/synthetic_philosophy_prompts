              R = (1/2) * [ I(heads) * (10000 * I(π(tails)=pay)) ] + (1/2) * [ I(tails) * (-1000 * I(π(tails)=pay)) ]
          - But note: the agent only sees the state it is in. We can train the policy by using a model that can compute the counterfactual.

     - **Off-policy and Importance Sampling**: If we have a behavior policy that sometimes explores paying and sometimes not, then in the heads branch we can use importance sampling to estimate the reward based on the behavior policy. But note: the heads branch doesn't involve an action by the agent (it only uses the policy's decision in tails). We can think of the heads branch as a reward that is a function of the policy's parameters. The gradient for the heads branch reward is:
          ∇ J = E[ ∇ log π(a|tails) * (10000) ]   for the event heads, but only for the action a that the policy would take in tails? Actually, we can write:
          J = (1/2) * [ 10000 * π(pay|tails) ] + (1/2) * [ -1000 * π(pay|tails) ]
