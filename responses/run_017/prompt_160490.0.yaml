  We are given two problems: Counterfactual Mugging (CM) and XOR Blackmail (XB). We are to translate the disagreement between Causal Decision Theory (CDT), Evidential Decision Theory (EDT), and Functional Decision Theory (FDT) into the vocabulary of RL (policies, rollouts, etc.). Then, we'll note what carries over, what distorts, and what has no expression. Finally, we'll address the hypothesis and the specific questions.

  ### Key Concepts in Decision Theories
  - **CDT**: Chooses actions based on causal consequences. It uses a causal model (e.g., a causal graph) to compute expected utility by intervening on the action node.
  - **EDT**: Chooses actions based on evidence they provide about desirable outcomes. It conditions on the action and uses conditional probabilities.
  - **FDT**: Chooses actions by considering the output of the decision function (policy) in all relevant situations. It is updateless and treats the decision problem as a mathematical function.

  ### Translation to RL Vocabulary

  #### 1. **Counterfactual Mugging (CM)**:
     - **Setup**: Omega flips a fair coin. If heads, Omega asks nothing and gives $10000 if it predicts you would have paid $1000 in the tails scenario. If tails, Omega asks for $1000. You are in the tails branch. Do you pay?
     - **CDT (Causal)**: In the tails branch, paying $1000 does not cause the heads branch to give you $10000 (because the coin is already flipped). So, CDT says don't pay.
     - **EDT (Evidential)**: If you pay, that is evidence that you are the type of person who pays, which is evidence that Omega predicted you would pay and hence you would have gotten $10000 in the heads branch. But note: in the tails branch, you are in tails, so conditioning on paying doesn't change the fact that you are in tails. EDT might still say pay because paying is associated with getting the $10000 in heads, but in the tails branch, the $10000 is not at stake. However, EDT can be ambiguous here. Standard EDT would not pay because in the tails branch, paying is only a loss and there is no future event to condition on that would make it worthwhile (the heads branch is already determined and you are not in it).
     - **FDT (Functional)**: You decide by considering what your policy does in both branches. The policy that pays in tails leads to $10000 in heads (because Omega's prediction is accurate) and -$1000 in tails. The policy that doesn't pay leads to $0 in both. So FDT pays.

