     - **Policy**: A function from state to action. In the tails state, the action is either pay or not.
     - **Rollout**: In the heads branch, the rollout is: state (heads) -> no action -> reward = 10000 if the policy would have paid in the tails state (as simulated by Omega), else 0. In the tails branch: state (tails) -> action (pay or not) -> reward = -1000 if pay, 0 otherwise.
     - **Objective**: Maximize expected return over the entire trajectory (both branches) but note: the policy is executed in only one branch (the one you are in). However, the outcome in the other branch depends on what your policy *would have done* in that branch.

     **Training**:
     - We are training a policy π. The environment has a coin flip at the start (hidden from the agent until the observation). In the heads branch, the agent gets no choice and the reward is determined by a simulation of π in the tails state. In the tails branch, the agent chooses an action and gets immediate reward.
     - **Credit Assignment**: The action in the tails branch affects the reward in the heads branch (via Omega's prediction). However, during training, if we are in the tails branch, we never observe the heads branch. So the gradient from the heads branch reward is zero for the tails branch trajectory? Not if we model Omega as part of the environment and use a world model that simulates the dependence.

     **Solution in RL**:
     - We can train by considering the entire environment as a black box that, when run, flips a coin and then either:
          - With 50%: runs the agent in tails and gives reward -1000 if pay, 0 otherwise.
          - With 50%: does not run the agent, but gives reward 10000 if the agent's policy (as evaluated in the tails state) would pay, else 0.
     - The policy is evaluated ex ante (before the coin flip). The objective is the expected reward over both branches. The gradient must account for the effect of the policy on the heads branch even when the agent is in tails.

