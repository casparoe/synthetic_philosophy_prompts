  ### Final Words

  The philosophical disagreement is less substantive than it looks from the perspective of RL. The core ideas of FDT are standard in RL: optimize the policy ex ante and deploy it updatelessly. The counterfactual reasoning is handled by proper environment modeling. The challenges (like the sandbox) are engineering problems that RL can address with existing tools. However, if the environment is not fully known or cannot be simulated, then we face the same problems as the decision theories: how to reason about counterfactuals without data.
