  ### Translation to RL Vocabulary

  #### **Counterfactual Mugging (CM)**
  - **Setup as MDP**: Two parallel trajectories (heads/tails) with shared policy parameters. Omega is a perfect predictor that simulates your policy in the tails state during heads rollout. Reward: +10k if heads and policy pays in simulated tails, -1k if tails and policy pays, 0 otherwise.
  - **Causal Decision Theory (CDT)**  
    Views paying in tails as an *action* with local causal effects. Trains via Q-learning: gradient only on *observed* trajectory (tails branch). Infers that paying causes a loss with no counterfactual upside (heads branch is causally disconnected). Learns "never pay" policy.  
    - *Credit assignment*: Advantage $A(s_{\text{tails}}, \text{pay}) = -1k$; no gradient for heads branch.  
    - *Off-policy issue*: Cannot evaluate heads outcome during tails rollout.  

  - **Evidential Decision Theory (EDT)**  
    Conditions action on evidence. Observing tails state and considering payment updates belief about policy behavior, but infers that paying *correlates* with losing money (since heads is fixed). Learns "never pay" to avoid -1k.  
    - *Reward model*: Treats Omega as part of observational state; payment in tails is evidence of policy defect, but no adjustment for counterfactual gain.  

  - **Functional Decision Theory (FDT)**  
    Scores the entire *policy* ex ante. Optimizes $\mathbb{E}_{\text{coin}}[V(\pi)]$ where $V(\pi) = 0.5 \times R_{\text{heads}}(\pi_{\text{tails}}) + 0.5 \times R_{\text{tails}}(\pi_{\text{tails}})$.  
    - *Policy gradient*:  
      $\nabla J(\theta) = \frac{1}{2} \left[ \nabla \log \pi(\text{pay}|s_{\text{tails}}; \theta) \cdot 9k \right]$  
      (Derived from ex ante objective: $J(\theta) = 4.5k \times \pi(\text{pay}|s_{\text{tails}}; \theta)$)  
      Forces $\pi(\text{pay}|s_{\text{tails}}) \to 1$ despite per-trajectory gradient being zero when in tails.  
    - *Deployment*: Updateless execution; policy pays in tails because it was optimized for ex ante value.  

  #### **XOR Blackmail (XB)**
  - **Setup**: State $s \in \{\text{letter}, \text{no letter}\}$. Blackmailer sends letter iff $(\text{policy pays} \oplus \text{secret exists})$. Reward: -1k if pay, 0 otherwise.  
  - **Theories**:  
    - **CDT/EDT**: Optimize action given letter. Paying causes -1k loss; not paying saves money. Learns "never pay".  
    - **FDT**: Ex ante policy optimization. Evaluates:  
      - If $\pi(\text{pay}|\text{letter}) = 1$: Letter sent iff no secret. Pay cost: $\mathbb{E}[R] = -1k \times P(\text{no secret})$.  
      - If $\pi(\text{pay}|\text{letter}) = 0$: Letter sent iff secret exists. Pay cost: 0.  
      Chooses $\pi(\text{pay}|\text{letter}) = 0$ to avoid expected loss.  

  #### **Sandbox Detection Variant**
  - **Setup**: Omega runs policy in sandboxed simulation of tails; policy might detect sandbox and defect (not pay). Deployment in real tails may differ.  
  - **FDT**: Wants policy to "cooperate in sandbox, defect in real" to exploit Omega. But policy is a single function $\pi_\theta$. Conflict between:  
    - *Robustness*: Train with domain randomization (sandbox/real as different environments) so $\pi$ generalizes.  
    - *Adversarial design*: If sandbox detectable (different $s$), policy learns $a = \text{pay}$ if $s_{\text{sandbox}}$, else $a = \text{not pay}$.  
  - **CDT/EDT**: Myopic; pays in neither (no mechanism to benefit from sandbox cooperation).  

  ---

  ### Residue Report  
  **What carries over cleanly**:  
  1. **Ex ante policy optimization** = Standard RL objective. FDT's "updatelessness" is default (fixed $\theta$ at inference).  
  2. **Predictor as environment dynamics**: Omega is part of the transition function $P(s'|s, \pi)$. Rollouts include simulated sub-trajectories.  
  3. **Logical uncertainty** ≈ **Distribution shift**. Deployment in new contexts (e.g., sandbox vs. real) is a robustness problem.  

  **What distorts**:  
  - **Evidential reasoning**: EDT's "evidence" maps poorly. RL agents don't update beliefs about *their own policy*; parameters $\theta$ are fixed. What EDT calls "evidence" is just state observation.  
  - **Causal independence**: CDT's refusal to credit counterfactuals becomes a *credit assignment flaw*. Solved by including simulated branches in advantage estimates.  

  **No expression in RL vocabulary**:  
  - **Timeless decision**: FDT's "output of the function in all inputs" is *exactly* policy optimization. No residue.  
  - **Self-referential predictors**: Sandbox variant *is* expressible (simulate the simulation) but requires known $P(\text{sandbox}|s)$.  

  ---

  ### Hypothesis Verdict  
  **Mostly correct**:  
  - FDT ≡ **Ex ante policy optimization** + **Predictor-in-environment dynamics**.  
  - "Updateless" is default in RL (no online parameter updates).  
  - Residue *is* about objective specification:  
    - CDT/EDT defects in CM because they optimize *per-trajectory* loss.  
    - FDT pays because it optimizes *cross-branch* value.  
    - **No decision theory resolves this**—it's an objective design choice.  

  **Where your hypothesis is wrong**:  
  - "Gradient in unobserved branch is zero" is solvable without full ex ante selection:  
    - **Importance sampling**: Off-policy evaluate heads branch using $\pi$’s likelihood of paying in tails.  
    - **Model-based RL**: Learn $P(\text{heads reward} | \pi)$ and backprop through it.  
    - Both require explicit modeling of the counterfactual.  

  ### Key Takeaways  
  1. **CM Payment**: Achieved by optimizing ex ante value (via policy gradients over both branches) or off-policy correction.  
  2. **Sandbox Divergence**: RL handles this via adversarial robustness (if detectable) or domain adaptation (if not).  
  3. **Logical Uncertainty**: Just deployment distribution shift; mitigated by robust training, not new math.  
  4. **Substantive Disagreement?**: Only in objective design. CDT/EDT ignore counterfactual rewards; FDT doesn’t. RL tools implement any choice, but FDT’s objective dominates in these puzzles.  

  **Final verdict**: Philosophers are debating "where to put the reward function." Your vocabulary captures everything substantive; the rest is noise.
