  ### Residue Report

  **What carries over cleanly**:
  - The ex ante policy evaluation: we can train policies by optimizing the expected return over the entire distribution of environments (including the counterfactual branches) by including the environment's simulation of the policy as part of the dynamics. This is standard in RL when the environment is known and can be modeled.
  - The concept of "updatelessness" is implemented by having a fixed policy (with parameters trained ex ante) that is deployed without online updates based on the specific observation (like which branch you are in or whether you got the letter). This is standard practice in RL: we train a policy and then deploy it without changing the parameters during inference.
