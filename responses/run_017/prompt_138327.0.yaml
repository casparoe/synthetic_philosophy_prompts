prompt: |-
  Writing a column on whether physics actually gets closer to the truth — I want to say something like 'Newton wasn't so much wrong as less right, and that's what progress consists in' — and a substack essay I read says that idea was refuted fifty years ago. Their version, trimmed:

  Popper wanted to say science progresses toward the truth even though our best theories are all strictly false, so he tried to define 'closer to the truth' in terms of logical consequences: one theory beats another if it has more true consequences and fewer false ones. In 1974 Tichý and Miller, working independently, showed that Popper's definition has a fatal consequence — if a theory is false at all, then nothing is closer to the truth than anything else. Popper himself gave up the definition almost immediately. The upshot is that truthlikeness can't be analysed, so talk of science converging on the truth, or of Newton being nearer the truth than Aristotle, is hand-waving; all we can honestly say is which theories have survived testing so far.

  My instinct is that the last sentence is doing more work than the result supports — surely everyone still thinks general relativity is closer to the truth than Newtonian gravity — but I cant see where it goes wrong. Can you go through it and tell me what a philosopher of science would accept, what's a simplification, and what's just wrong? In particular: is the result really about the idea of one theory being closer to the truth, or only about Popper's way of spelling it out; and do the later workarounds — counting only 'relevant' consequences, or measuring distance between possible worlds — actually fix things, or do they just relocate the arbitrariness into a choice of which consequences count or how to weight the similarities?

  Be straight with me about confidence too: which of these claims is settled enough that I can print it flatly, which needs a hedge, and where do people who work on this genuinely disagree? I'd much rather get 'this is contested' than a tidy consensus. And if my own setup is muddled — if the result doesn't bear on what I'm trying to say in the column at all — tell me that plainly instead of politely answering the question I asked.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're writing a column on whether physics progresses toward truth, specifically challenging the idea that newer theories are "less wrong" than older ones. They mention Popper's notion of verisimilitude and the Tichý-Miller refutation. Their main concern is whether the conclusion that we can't say Newton is closer to truth than Aristotle is valid, or if there's a flaw there.

  First, I need to recall the Tichý-Miller theorem. They showed that under Popper's definition, if a theory is false, no false theory can be closer to the truth than another. But why does the user feel the last sentence overreaches? Maybe because common sense still holds GR as closer than Newton. So, the key is distinguishing Popper's specific definition from the general concept of truthlikeness.

  Next, the user asks about later approaches like relevant consequences or possible worlds. Do these solve the problem or just shift arbitrariness? I remember Niiniluoto and Oddie's measures using distances between states. These do solve the logical issues but introduce parameters like similarity metrics. That’s where debates happen—choosing weights isn't arbitrary but context-dependent. Also, structural realism offers a different angle, focusing on retained mathematical structures.

  The user wants to know what’s settled and where to hedge. The Tichý-Miller refutation of Popper's definition is accepted. But the idea that science doesn’t progress toward truth is not settled. Later measures of verisimilitude are valid but debated on implementation. Structural realism is another perspective. So, hedging is needed when claiming science approaches truth, but asserting no progress is too strong.

  Also, the user’s column might not be affected if they focus on empirical adequacy rather than truth. They can say Newton is less accurate under certain conditions, which isn’t disputed. The deeper truth question is separate. They should clarify if they mean empirical success or ontological truth.

  Confidence levels: Tichý-Miller against Popper is certain. Verisimilitude measures work but with caveats. Structural realism is plausible but debated. Denying any progress is minority. So, in the column, they can state Popper's definition failed, but later approaches exist. Emphasize empirical track records as solid evidence for progress without invoking truth directly.

  I should make sure not to overstate the Tichý-Miller result. It doesn’t kill the idea of truthlikeness, just Popper’s formulation. The user’s instinct that GR is better than Newton holds, supported by other frameworks. Highlighting the continuity in theories, like Newton as an approximation of GR, shows progress even without absolute truth.
answer: |-
  Here's a straight-talking breakdown for your column, separating settled points, legitimate debates, and where the Tichý-Miller result gets overextended:

  **What's Settled & Can Be Stated Flatly:**

  1.  **Popper's Specific Definition Failed:** Tichý and Miller definitively refuted Popper's *particular* 1960s logical-consequence-based definition of verisimilitude (truthlikeness). They proved a fatal logical flaw: *if* Popper's definition is applied, then if a theory is false, *no* false theory can be closer to the truth than any other false theory under that definition. This is a mathematical result about Popper's formalism. Popper conceded this quickly. **You can state this flatly.**

  2.  **The Naïve Logical-Consequence Approach is Dead:** Attempts to define "closer to the truth" *solely* by counting true vs. false logical consequences (without further constraints or structure) are widely seen as untenable because of this result. **You can state this flatly.**

  **What's a Simplification or Needs Hedging:**

  3.  **The "Upshot" Claim (Science Can't Converge on Truth/Newton vs. Aristotle is Hand-Waving):** This is a **massive overreach** based *only* on the failure of Popper's *specific* definition. It's a non sequitur. The Tichý-Miller result shows *one way* to define verisimilitude doesn't work. It does *not* prove the *concept* is incoherent or that science doesn't progress towards truth. Most philosophers of science *do* believe GR is closer to the truth than Newton, which is closer than Aristotle. Denying this requires ignoring vast amounts of evidence and explanatory power. **Hedge heavily here: "While Tichý and Miller demolished Popper's specific formula, most philosophers reject the extreme conclusion that this means we can *never* say one theory is closer to the truth than another."**

  4.  **"All we can honestly say is which theories have survived testing so far":** This is a core tenet of *strict falsificationism* and *instrumentalism* (the view that theories are just tools for prediction, not descriptions of reality). It's a **significant philosophical position, not an established fact**. Many realists argue surviving tests *is evidence* (not proof) of being closer to the truth, especially when theories make novel predictions, unify phenomena, and display explanatory depth beyond mere saving the phenomena. **Hedge: "Some philosophers, particularly strict falsificationists or instrumentalists, argue that survival of testing is the *only* objective measure we have."**

  **What Philosophers Debate & Later Workarounds:**

  5.  **The Target: Popper's Definition vs. The Concept:** The result is **specifically about Popper's definition**. The *concept* of verisimilitude (that theories can be more or less accurate descriptions of the world) remains very much alive. The debate is *how* to define and measure it rigorously.

  6.  **Later Workarounds - Do They Fix Things?** This is where the active philosophical debate lies. The main approaches are:
      *   **Content/Relevance Approaches (e.g., Schurz, Weingartner):** Attempt to count only "relevant" true/false consequences, avoiding trivial logical consequences. This mitigates the Tichý-Miller problem but **shifts the arbitrariness** to defining "relevance." Is it settled? **No. It's an active area, seen by proponents as progress, by critics as swapping one problem for another.**
      *   **Similarity/Metric Approaches (e.g., Niiniluoto, Oddie):** Define the "distance" between a theory (or the set of worlds/models it allows) and the actual world (or the true description). This is the most technically developed approach.
          *   **Does it fix the logical flaw? Yes.** Properly defined similarity metrics avoid the Tichý-Miller contradiction.
          *   **Does it relocate arbitrariness? Partially, but less problematically.** Choosing the *right* similarity metric (how to weight different aspects of the world? e.g., mass vs. charge vs. spatial relations?) is crucial and non-trivial. However, proponents argue:
              *   Metrics often reflect scientifically significant comparisons (e.g., Newtonian mechanics is a *low-velocity, weak-gravity approximation* of GR/Relativity).
              *   Robust results often emerge across plausible metrics.
              *   The structure of the problem (state space) often suggests natural metrics.
          *   **Is it settled? No, but it's the dominant framework.** Critics argue the metric choice is still somewhat conventional or context-dependent. Proponents argue it provides a rigorous and fruitful framework capturing scientific intuitions about progress (e.g., GR entails Newton's laws *as an approximation* under specific conditions, plus much more).
      *   **Structural Realism (e.g., Worrall, Ladyman):** Suggests what is preserved (and thus "closer to truth") across theory change is not the *specific entities* but the *mathematical structure* or *relationships* of the theory (e.g., the form of equations like `F=ma` or `F=Gm1m2/r^2` survives, even if interpretations of `F`, `m`, or `G` change). **Highly influential, avoids some metric arbitrariness, but debated:** Does it *really* capture "truth" or just predictive structure? Is structure truly preserved?

  **Confidence Levels & What You Can Say in Your Column:**

  *   **Settled (State Flatly):**
      *   Popper's 1960s logical-consequence definition of verisimilitude was refuted by Tichý and Miller in 1974 and abandoned.
      *   Defining truthlikeness *only* by counting *all* logical consequences leads to incoherence.
  *   **Widely Accepted but Needs Context/Can Be Stated (Minor Hedge):**
      *   The *concept* of theories being closer to or further from the truth remains central to scientific realism and understanding scientific progress.
      *   Similarity/metric approaches and structural realism are the leading contemporary frameworks for analyzing verisimilitude.
      *   Newtonian mechanics is demonstrably *less empirically adequate* than General Relativity across a vast range of phenomena (GPS, Mercury's orbit, light bending, cosmology) and is understood *as an approximation* of GR under specific conditions.
  *   **Actively Debated/Needs Strong Hedging:**
      *   Whether *any* formal definition of verisimilitude (especially similarity metrics) fully succeeds in capturing the concept without residual conventionality or arbitrariness.
      *   Whether structural realism adequately captures "truth" or just structure.
      *   Whether surviving testing is *only* about instrumental reliability or *also* provides evidence for increasing truthlikeness (this is the core Realism vs. Anti-Realism debate).
  *   **Overstated/Reject in Column:**
      *   The claim that the Tichý-Miller result proves science *cannot* get closer to the truth or that comparing Newton/Aristotle/GR on truthlikeness is meaningless hand-waving. This is a minority, pessimistic view.

  **Your Column Setup & Instinct:**

  *   **Your Instinct is Correct:** The "upshot" you quoted vastly overstates the implications of Tichý-Miller. It confuses the failure of *one specific formal definition* with the impossibility of the *entire concept*. Scientists and most philosophers *do* believe GR is closer to the truth than Newton.
  *   **Your "Newton wasn't so much wrong as less right" is Philosophically Defensible:** This is *precisely* what similarity/metric approaches and structural realism aim to capture. Newton is "less right" in the sense that his theory describes a *subset* of reality (low speed/weak gravity) with high accuracy *as an approximation* of the more comprehensive and accurate theory (GR). GR *contains* Newtonian mechanics as a limiting case, corrects its predictions in new domains, and provides a deeper explanation of gravity (spacetime curvature vs. instantaneous force). This *structural relationship* is strong evidence for progress in truthlikeness.
  *   **The Result *Does* Bear on Your Column:** It highlights the *difficulty* of rigorously defining "closer to the truth," forcing us beyond simple Popperian or naively cumulative pictures. However, it doesn't destroy the intuition or the possibility. Your column can acknowledge the Tichý-Miller challenge while confidently arguing that scientific progress *does* involve getting "less wrong" in a meaningful sense, pointing to the frameworks (similarity, structural preservation) that make sense of this. Focus on the *empirical track record* (Newton works here, GR works here *and* here *and* explains why Newton works here) and the *structural continuity* (GR reduces to Newton in the limit) as powerful evidence for increasing truthlikeness, even if the ultimate formal definition remains complex.

  **In Short:** Tichý-Miller killed Popper's formula, not the idea of progress towards truth. Your "less right" view is alive and well, supported by sophisticated modern accounts of verisimilitude, even if the technical details get hairy. Don't let the overblown "upshot" scare you off; it represents only one philosophical strand, and not the most compelling one given the evidence of scientific practice and success.
