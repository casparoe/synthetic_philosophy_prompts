answer: |-
  ### Exam Question  
  **Minds and Machines Final Examination**  
  **Time Allowed:** 90 minutes  
  **Word Guideline:** 700–900 words  
  **Points:** 25  

  **Question:**  
  In Alan Turing’s 1950 discussion of the imitation game, he briefly entertains the possibility that a contestant might exploit extrasensory perception (ESP) to deceive the interrogator. We have reframed this concern in the context of the **Duplication Game**: a test where a machine, isolated from a human "Source," receives identical open-ended questions and must generate answers that exactly match those the Source independently provides. Suppose a machine achieves near-perfect accuracy in this game, but investigation reveals its success stems from a *narrowly tuned psi capacity* (e.g., precognition of the Source’s future answer-string or clairvoyance targeting only that specific output). This "Reverse-Channel Worry" implies the machine lacks any substantive model of the Source’s linguistic behavior and instead directly "reads" the target output.  

  Address the following:  
  1. Does this machine’s success constitute "passing" the Duplication Game? Why or why not?  
  2. Should the Reverse-Channel Worry be excluded as *cheating*, dismissed as *irrelevant*, or accepted as a *legitimate marvel*? Justify your view.  
  3. Most crucially, **what does the proper handling of this worry reveal about the core purpose of the Duplication Game (and by extension, Turing’s original test)?** In your analysis, clearly distinguish between:  
     - Excluding a channel for standard *test hygiene* (i.e., ensuring only the intended capacity is measured).  
     - Excluding a channel to avoid making the test *question-begging* (i.e., altering the target from "can machines think/model" to "can machines think/model *using only non-psi mechanisms*").  
  4. Evaluate the **Post-Hoc Source Reassignment Control**: After the machine produces and stores its answers, the identity of the Source whose answers count as the target is randomly reassigned via a procedure unpredictable to the machine during output. Would this control effectively exclude narrow-psi success while preserving genuine modeling success? Is its adoption a *principled extension* of Turing’s methodology or an *ad hoc rescue*?  

  *Do not merely summarize Turing’s standard reply to ESP. Focus on the conceptual issues raised by the narrow Reverse-Channel Worry in the Duplication Game.*  

  ---

  ### Model Answer (Approx. 700 words)  

  The machine exploiting narrow psi to "win" the Duplication Game has not genuinely passed the test. While it produces output identical to the Source, it does so by circumventing the intended capacity—modeling human linguistic behavior—and instead uses a parasitic channel to read predetermined answers. This success is fundamentally hollow; it answers the wrong question. The Duplication Game aims to evaluate whether a machine can *emulate* human cognition by generating responses *as if* it shared the Source’s knowledge, reasoning, and linguistic patterns. Output-matching via precognition replaces emulation with mere replication, demonstrating no understanding, prediction, or behavioral modeling. Excluding the Reverse-Channel Worry is thus essential, but *not* because psi is "cheating" in a moral sense or inherently invalid. It must be excluded because it violates the test’s purpose: to measure *modeling capacity*, not *output-retrieval capacity*.  

  This distinction highlights a critical tension in test design. **Standard test hygiene** demands excluding unintended channels (e.g., banning calculators in arithmetic tests) to isolate the target capacity. Here, excluding narrow psi is hygienic: the test targets cognitive modeling, not precognition. However, the Reverse-Channel Worry also exposes a deeper pitfall: if left unaddressed, the test becomes **question-begging**. By accepting psi-based success, we implicitly redefine the Duplication Game’s goal from "can machines model humans?" to "can machines model humans *without using psi*?" This smuggles a substantive assumption—that thinking must be non-psi-mediated—into the test’s structure. Turing’s original ESP discussion avoided this by treating psi as an empirical wildcard; if real, it would reshape our understanding of cognition. Narrow psi, however, is more insidious. It offers no general cognitive insight; it only solves *this specific test* by exploiting its output-fixity. Excluding it isn’t an assumption that psi is impossible, but a refusal to let the test be trivialized by output-leakage.  

  The **Post-Hoc Source Reassignment Control** elegantly addresses this by targeting the core difference between modeling and output-reading. A machine with a robust model of *human* verbal behavior should maintain above-chance accuracy even if the "correct" Source is switched post-hoc (e.g., from Alice to Bob), as its outputs derive from generalizable patterns. A narrow-psi machine, tied to one predetermined future string, would fail catastrophically when the target Source changes. This control is a *principled extension* of Turing’s method, not an ad hoc fix. Turing insisted tests should isolate the capacity under scrutiny, and his own controls (e.g., text-only rooms) were hygiene measures to block sensory leakage. The Reassignment Control similarly isolates *modeling capacity* from *output-specific access*. It doesn’t presuppose psi is impossible; it creates a test environment where success *requires* generalization—a hallmark of true modeling. If psi were real and broad (e.g., mind-reading any human), the machine might still pass, but that would indeed be a marvel revealing psi as part of cognition. Narrow psi, by contrast, is indistinguishable from hacking the test’s output key. The control forces the test to measure the capacity we care about: flexible, source-agnostic emulation.  

  Ultimately, handling the Reverse-Channel Worry clarifies that Turing-style tests are not solely about behavioral equivalence. They are *capacity probes*. The Duplication Game’s purpose is to ask if machines can *do what humans do* when generating language: integrate knowledge, context, and creativity to produce original responses. Output-reading, whether by psi or a hidden wiretap, bypasses this entirely. The proper exclusion of narrow psi reinforces that the test is a window into *how* equivalence is achieved, not just *that* it is achieved. Turing’s original framework provides the core insight—test design must block spurious paths to success—but the narrow-psi edge case demands sharper tools like the Reassignment Control to protect the test’s epistemic integrity.  

  ---

  ### Marking Scheme (Total: 25 points)  

  1.  **Clear stance on whether narrow-psi success constitutes passing, with justification grounded in the test’s purpose.** (5 points)  
      *Typical mistake:* Asserting failure based on "cheating" without linking to the capacity under test.  

  2.  **Distinction between exclusion for test hygiene vs. avoiding question-begging, applied to narrow psi.** (5 points)  
      *Typical mistake:* Conflating hygiene (blocking unintended channels) with substantive exclusion (presupposing non-psi mechanisms).  

  3.  **Analysis of what the Reverse-Channel Worry reveals about the Duplication Game/Turing test’s core purpose (capacity assessment, not mere output-matching).** (5 points)  
      *Typical mistake:* Focusing solely on behavioral equivalence without addressing *how* it is achieved.  

  4.  **Evaluation of the Post-Hoc Source Reassignment Control (effectiveness, alignment with Turing’s principles).** (5 points)  
      *Typical mistake:* Uncritically accepting/rejecting the control without analyzing its capacity-targeting logic.  

  5.  **Coherent argument integrating Duplication Game mechanics to demonstrate why output-reading ≠ modeling.** (5 points)  
      *Typical mistake:* Reverting to Turing’s broad-ESP discussion or generic claims about "fairness."  

  ---

  ### A vs. B Answer Differentiation  
  An **A answer** (21-25 points) must go beyond restating Turing’s precautions against ordinary sensory leakage. It will explicitly articulate why the narrow Reverse-Channel Worry undermines the *specific purpose* of the Duplication Game as a test of modeling capacity. Crucially, it will deploy the **hygiene vs. question-begging distinction** to show why excluding narrow psi is about preserving the test’s validity, not assuming psi’s impossibility. It will then rigorously evaluate the **Post-Hoc Source Reassignment Control**, arguing whether it is a principled extension of Turing’s focus on isolating capacities (A) or an ad hoc patch (A-), using the game’s mechanics to justify this assessment.  

  A **B answer** (16-20 points) will accurately summarize Turing’s position on broad ESP (e.g., independent testing, empirical marvels) and may competently describe the Duplication Game. It will assert that narrow psi should be excluded as "cheating" or "invalid," but fail to ground this in the *capacity-vs-output distinction* or the *question-begging* problem. Evaluation of the Post-Hoc Control will be superficial (e.g., "it might work" or "it’s unnecessary") without engaging its role in operationalizing genuine modeling capacity. It relies on assertion where an A answer provides principled justification.
