                 - The grid is reset (put 3 red tokens in the same positions).
                 - The AI team has 1 minute to collect as many tokens as they can. They move by consensus: they discuss and then the team leader (or a designated mover) steps on the next cell. The timekeeper (instructor) moves a timer (every 5 seconds they must have moved? or we can do without the timer and just let them move at their own pace but limit the episode time). 
