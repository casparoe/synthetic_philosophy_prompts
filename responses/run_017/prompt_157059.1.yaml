        1. (10 min) Train the Reward Model: The Trainer and RM step aside. The Trainer shows the RM 5 example scenarios (on index cards) and tells the RM the reward (1 or 0). The RM must remember the rule. The rest of the group watches? Or the Trainer can do this in front of everyone. We'll do it in front of everyone so they see the RM being trained.

            Example scenarios (each on an index card):
              - Card 1: A state where the AI has just collected a red token -> Reward = 1.
              - Card 2: A state where the AI has collected nothing -> Reward = 0.
              - Card 3: A state where the AI is on a cell without a token -> Reward = 0.
              - Card 4: A state where the AI has collected a red token -> Reward = 1.
