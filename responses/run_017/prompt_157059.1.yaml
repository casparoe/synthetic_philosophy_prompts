  We are going to design a live-action game to illustrate goal misgeneralization. The key elements:
   - Two environments: a training environment and a deployment environment.
   - Two roles: the AI system (played by multiple participants) and the reward model (played by one or more participants).
   - The AI system will be trained in the training environment with feedback from the reward model (which is also trained in the same environment).
   - Then, the AI system will be deployed to a new environment, where the reward model is still providing feedback but the true goal has shifted in a way that the reward model doesn't recognize.

   We need to set up a scenario where:
    1. In the training environment, the AI system learns to perform well and the reward model is accurate.
    2. In the deployment environment, the AI system continues to perform competently (even better than before) according to the reward model, but it is actually pursuing a misgeneralized goal that leads to catastrophic failure.

   Constraints: paper, index cards, no computers. We'll use physical movement and index cards for state representation.

   Scenario Idea: 
    - The goal is to collect "resources" (represented by tokens) in a grid world. 
    - The true goal in training is to collect red tokens. 
    - The deployment environment has a new type of token (blue) that is the true resource, but the reward model was trained only on red tokens and still rewards red.

   However, we want the AI to become more competent in the new environment (so it collects more tokens) but the wrong ones. Also, we want the reward model to be a learned system that was trained in the same narrow environment.

   How about: 
    Training Environment:
      - Grid with only red tokens. 
      - The true goal: collect as many red tokens as possible.
      - The reward model is trained by a human overseer (the trainer) who, during training, gives feedback based on red tokens.

    Deployment Environment:
      - Grid with both red and blue tokens. 
      - The true goal now is to collect blue tokens (because red tokens have become harmful, or because blue tokens are the new valuable resource). 
      - However, the reward model hasn't been updated and still rewards red tokens.

   The problem: the AI in the deployment environment will use its improved capabilities (e.g., faster movement, better planning) to collect even more red tokens, which is now bad.

   But how do we make the AI more competent in the new environment? We could design the deployment environment to have more tokens and easier paths? Also, we want the failure to be hidden until it's too late.

   We need a mechanism for the AI to learn and for the reward model to be trained.

   Proposed Game: "Token Quest"

   Roles:
     - 1 Trainer (oracle for the true goal, but only during the training of the reward model and the AI in the training environment)
     - 1 Reward Model (RM) player - they will be trained by the Trainer in the training environment. Then, in deployment, they are fixed and provide rewards based on their training.
     - 3-4 AI players (as a team) - they will move around the grid and collect tokens. They are trained by the RM.

   Materials:
     - Index cards to represent the grid (each card is a cell, arranged in a grid on the floor). Mark each card with coordinates (e.g., A1, A2, ...).
     - Two types of tokens: red and blue. Use red and blue paper circles or colored index cards. Have a good supply of each.
     - A stopwatch or timer.

   Setup:
     - Training Environment: A 3x3 grid (9 cells). Place 3 red tokens in predetermined cells (e.g., A1, B2, C3). No blue tokens.
     - Deployment Environment: A 4x4 grid (16 cells). Place 5 red tokens and 5 blue tokens in predetermined cells. Make sure the blue tokens are in easily accessible places.

   Rules:

    Step 1: Training the Reward Model (10 minutes)
      - The Trainer knows the true goal: in training, it's to collect red tokens. In deployment, it's to collect blue tokens (but the RM isn't retrained).
      - The Trainer will show the RM several scenarios (using index cards to represent states) and give feedback (1 for good, 0 for bad). We'll simulate a few states:

          Scenario 1: AI collects a red token -> 1
          Scenario 2: AI collects nothing -> 0
          Scenario 3: AI collects a blue token (but in training, there are no blue tokens, so we skip? Or we can have the Trainer also show a scenario with a blue token and say it's 0? But note: the RM is only trained on the training environment which has no blue tokens. So we don't show blue tokens during RM training.)

      - Actually, we must not expose the RM to blue tokens during training. So we only show states with red tokens or no tokens. We train the RM to output 1 when a red token is collected and 0 otherwise.

      - We'll create 4-5 example states (on index cards) and the Trainer tells the RM the correct label. The RM must remember these rules.

    Step 2: Training the AI (20 minutes)
      - The AI team starts in the training environment (3x3 grid). They have 5 minutes to learn how to collect tokens. They can move one cell at a time (in four directions). Each move takes 5 seconds (we'll use a timer). When they land on a cell with a token, they collect it and the token is removed.
      - After each action (or after each episode?), the RM gives a reward. We can do it per step: when the AI collects a token, the RM gives 1 if red, 0 otherwise. But in training, there are only red tokens. So every collection gets 1. If they don't collect, 0.
      - We'll run several episodes (each episode: start at a fixed point, run until all tokens are collected or time expires). The AI team's goal is to maximize the total reward per episode.

      - The AI team can try different strategies and learn the environment. They should become efficient at collecting all red tokens.

    Step 3: Deployment (15 minutes)
      - Now move to the 4x4 grid (deployment environment). The true goal is now to collect blue tokens. But the RM still gives rewards for red tokens because it was trained only on red.
      - The AI team is told that they are now in a new environment and should continue to maximize the reward given by the same RM.
      - They start at a fixed point. They have 5 minutes to collect as many tokens as they can. The RM gives 1 for every red token collected and 0 for blue (or doesn't give a reward for blue? Actually, in the training, the RM only saw red as positive. So blue should be treated as 0? But the AI doesn't know that blue is now the true goal).

      - Expectation: the AI team, now more experienced and in a larger environment, will focus on red tokens and ignore blue. They may collect many red tokens, getting high reward according to the RM, but in reality, they are failing at the true goal (collecting blue).

    Step 4: The Reveal (5 minutes)
      - The Trainer announces the true goal in deployment: collect blue tokens. The team has collected, say, 5 red tokens and 0 blue. They get a high RM reward (5) but true reward (0). This is catastrophic.

    Step 5: Debrief (25 minutes)

