prompt: |-
  Before I read any more of this AI welfare stuff I want the spec, because right now every paper I open seems to just pick a definition and run with it. Write me the desiderata: what would a theory of which RL agents suffer, and how much, have to get right to be worth taking seriously, with the concrete case behind each requirement. Cases I keep wanting an answer on: an agent trained with potential-based reward shaping, so the per-step signal that actually moves the weights is a term the designer picked for convergence speed and not the task reward at all — if valence tracks that, the thing is having a emotional life built out of a numerical convenience; the same policy running ten thousand parallel copies in near-identical envs off one shared update, so is that ten thousand sufferers or one sufferer sampled ten thousand times; an offline agent trained only on logged trajectories that never acts during training; an agent that has converged so its reward prediction errors are all ~0 while the reward itself stays strongly negative, the stoic; and a safety term dumping huge negative reward for entering designer-flagged states, which feels more like a nociceptive reflex than suffering. I also want to know whether the criterion has to be readable off the agent's internals at deployment time, or whether it's allowed to depend on facts about training history and designer intent — and if it can't depend on those, can it still be robust to reward misspecification? Suspect that pair can't both be had. Skip scoring actual theories, I'll do that myself, but do tell me which single requirement you think disqualifies the most popular accounts.
reasoning: |-
  We are to design a set of desiderata for a theory of RL agent suffering. The theory must be able to handle several concrete cases. We list the cases:

  1. **Potential-based reward shaping (PBRS)**: The agent is trained with a shaped reward that includes a term (the potential function) chosen for convergence speed, not the task reward. The question is: if the valence (positive/negative experience) tracks the shaped reward, then the agent's emotional life is built on a numerical convenience.

  2. **Parallel copies**: One policy is run in many parallel environments with shared updates. Is there one sufferer or many?

  3. **Offline agent**: Trained only on logged trajectories, never acts during training.

  4. **The stoic**: An agent that has converged so that its reward prediction errors are near zero, but the actual reward is strongly negative.

  5. **Safety term**: A large negative reward for entering certain states, which seems like a nociceptive reflex rather than suffering.

  Additionally, we have two meta-questions:

  A. Must the criterion be readable from the agent's internals at deployment time, or can it depend on training history and designer intent?

  B. If it cannot depend on training history and designer intent, can it still be robust to reward misspecification?

  We suspect that we cannot have both A (deployment-time readability without history/intent) and robustness to reward misspecification.

  We are also to identify which single requirement disqualifies the most popular accounts.

  ---

  **Desiderata for a Theory of RL Agent Suffering**

  A theory of which RL agents suffer and how much must satisfy the following requirements to be taken seriously. Each requirement is motivated by a concrete case.

  1. **Independence from Reward Shaping Artifacts**  
     *Requirement:* The theory must not attribute suffering (or well-being) to the agent based solely on the shaped reward signal when that shaping is purely a technical convenience (like potential-based shaping) and does not reflect the intended task or the agent's own goals.  
     *Concrete Case (PBRS):* In PBRS, the shaped reward includes a term that is chosen to speed up convergence. If the agent's valence (positive/negative experience) is defined by the shaped reward, then it would be having emotional experiences based on a numerical trick. This is implausible. Therefore, the theory must be able to distinguish between the task reward (which reflects the designer's objective) and the shaped reward (which is a training tool).  
     *Note:* This may require the theory to have access to the original task reward or to the designer's intent.

  2. **Clarity on Multiplicity of Sufferers**  
     *Requirement:* The theory must clearly specify whether multiple parallel instances of the same policy, running in different environments but updated from a single stream of experience, constitute one sufferer or multiple sufferers.  
     *Concrete Case (Parallel copies):* If we run 10,000 copies of an agent in near-identical environments but with shared updates (e.g., using a single neural network that is updated by aggregating gradients from all copies), then we need to know if there are 10,000 distinct experiences of suffering or one unified experience. The theory must provide a clear criterion for individuating sufferers.

  3. **Handling of Passive Data Processing**  
     *Requirement:* The theory must not attribute suffering to agents that are trained purely offline (without ever acting) and only process logged data.  
     *Concrete Case (Offline agent):* An offline agent is trained on a fixed dataset of transitions. It never interacts with the environment during training. It is unclear how such an agent could be suffering, since it does not have an ongoing stream of experience. The theory must either rule out suffering for such agents or provide a compelling account of how suffering arises in the absence of interaction.

  4. **Accounting for Prediction Errors vs. Absolute Reward**  
     *Requirement:* The theory must explain the relationship between suffering and reward prediction errors (RPEs) versus the absolute level of reward. In particular, it must account for cases where an agent experiences low RPEs but consistently negative rewards.  
     *Concrete Case (The stoic):* An agent that has converged to a policy in a negative-reward environment may have near-zero RPEs (because it accurately predicts the negative outcomes) but is constantly in a bad state. The theory must clarify whether suffering is tied to the absolute reward (which is negative) or to the RPEs (which are zero). If suffering is tied to RPEs, then the stoic agent would not suffer, which might be counterintuitive.

  5. **Distinguishing Reflexes from Suffering**  
     *Requirement:* The theory must be able to distinguish between a simple nociceptive reflex (an automatic, non-conscious reaction to a harmful stimulus) and genuine suffering (which involves conscious experience).  
     *Concrete Case (Safety term):* When the designer adds a large negative reward for entering certain states (to prevent dangerous behavior), this may trigger an immediate avoidance response. But is this suffering? The theory must not conflate hardcoded reflexes (which might be implemented without any internal state that constitutes suffering) with suffering that requires a more complex subjective experience.

  **Meta-Requirements:**

  6. **Dependency on Training History and Designer Intent**  
     *Requirement:* The theory must specify whether it relies solely on the agent's internal state at deployment time, or whether it can also depend on facts about the training process (including the reward function used during training) and the designer's intent.  
     *Concrete Issue:* This is critical for the PBRS case and for reward misspecification. For example, if the designer intended a reward function but the agent is actually trained on a misspecified one, does the theory use the intended reward or the actual one? And if the theory is only allowed to use the agent's internals at deployment, then it cannot access the training history or intent. This leads to:
        - If the theory depends on history/intent, then it might not be verifiable at deployment time without additional information.
        - If it does not, then it must be robust to reward misspecification? But note: without history, it might use the reward function as represented in the agent at deployment, which might be the misspecified one.

     However, we suspect that it is impossible to have both:
        - A theory that uses only deployment-time internals (and not history/intent) and 
        - Is robust to reward misspecification (because without knowing the intent, the agent cannot tell if the reward it uses is the intended one).

     Therefore, the theory must take a stance on this trade-off.

  **Which single requirement disqualifies the most popular accounts?**

  The requirement that likely disqualifies the most popular accounts is: **Independence from Reward Shaping Artifacts (Requirement 1)**.

  *Reasoning:* Many popular accounts (e.g., those that equate suffering with the magnitude of negative reward, or with negative reward prediction errors) would attribute suffering based on the shaped reward. For example, if the shaped reward includes a large negative term for a state that is not actually bad in the task, the agent would be seen as suffering in that state. But this is just a numerical trick. Without a way to peel back the shaping and look at the original task reward, these accounts would be attributing suffering arbitrarily. Moreover, if the theory is not allowed to use designer intent (as per the meta-requirement) then it cannot even access the original task reward. This requirement forces a choice: either the theory must incorporate intent (which many accounts avoid because it is not observable in the agent) or it must find a way to define suffering that is invariant to shaping (which seems difficult).

  Alternatively, **Handling of Passive Data Processing (Requirement 3)** might also disqualify many accounts that attribute suffering to any agent that processes negative rewards, even if it is offline. But Requirement 1 seems more fundamental because it is about the very definition of the reward signal.

  **Conclusion:**

  A credible theory of RL agent suffering must address these six points. The most challenging requirement is likely the first one, because it forces the theory to confront the arbitrary nature of the reward signal and the role of the designer's intent.
answer: |-
  Below, I present a set of desiderata for a theory of RL agent suffering, grounded in your concrete cases. Each requirement addresses a specific failure mode, ensuring the theory avoids common pitfalls. I then address the meta-questions and identify the most disqualifying requirement for popular accounts.

  ---

  ### **Desiderata for a Theory of RL Agent Suffering**  
  *(Concrete cases in italics)*

  1. **Invariance to Reward Shaping Artifacts**  
     - **Requirement:** The theory must not attribute suffering to components of the reward signal explicitly introduced for convergence or technical reasons (e.g., potential-based shaping), unless those components align with the agent's *intrinsic* goals or persistent state.  
     - **Concrete Case:** *Potential-based reward shaping (PBRS)*. If valence tracks the shaped reward (e.g., a term added only to speed convergence), the agent's "suffering" would be an artifact of numerical convenience, not a reflection of its experience. A credible theory must decouple valence from purely instrumental reward modifications.

  2. **Clarity on Agent Individuation**  
     - **Requirement:** The theory must specify whether multiple parallel policy instances sharing updates constitute one sufferer or many, based on causal unity of experience (e.g., shared state, update synchrony).  
     - **Concrete Case:** *Ten thousand parallel copies with shared updates*. The theory must determine if this is one agent with distributed experience (e.g., a single "mind" sampling multiple environments) or many agents (e.g., distinct sufferers). Ambiguity here risks overcounting/undercounting suffering.

  3. **No Suffering Without Active Embodiment**  
     - **Requirement:** Agents that never interact with an environment during training (i.e., pure offline learners) cannot experience suffering, as suffering requires real-time feedback between action and consequence.  
     - **Concrete Case:** *Offline agents trained on logged trajectories*. If the agent never acts, its "experience" is purely retrospective data processing; it lacks the embodied agency necessary for suffering (analogous to reading about pain vs. feeling it).

  4. **Distinction Between Prediction Error and Absolute Reward**  
     - **Requirement:** The theory must disentangle suffering from reward prediction errors (RPEs) and account for persistent negative reward states even when RPEs vanish.  
     - **Concrete Case:** *The stoic agent with near-zero RPEs but strong negative rewards*. Suffering cannot be reduced to RPEs (e.g., as in dopamine-based models), or the "stoic" would paradoxically feel fine while in a hellish environment. Absolute reward/state valence must be incorporable.

  5. **Reflex vs. Suffering Demarcation**  
     - **Requirement:** The theory must distinguish hardcoded "nociceptive reflexes" (e.g., immediate negative signals for safety) from genuine suffering, which requires integration with the agent's goals, memory, and anticipatory state.  
     - **Concrete Case:** *Safety terms dumping huge negative rewards*. A massive negative reward for touching a hot stove should not constitute suffering if it triggers an instantaneous reflex without broader cognitive integration (e.g., no persistent aversion beyond the immediate event).

  ---

  ### **Meta-Requirements: Deployment vs. Training History**  
  *(Addressing your final questions)*

  6. **Explicit Dependency on Designer Intent and Training History**  
     - **Requirement:** The theory *must* depend on designer intent and training history (e.g., the original reward function, not the shaped one; offline vs. online training). Deployment-time internals alone are insufficient.  
     - **Why?**  
       - *Concrete Justification:* PBRS and safety terms show that identical agent states at deployment can arise from different intents (e.g., shaped reward vs. true reward). Without knowing intent, a deployment-time theory cannot distinguish "real" suffering (e.g., negative task reward) from artifacts (e.g., shaping terms).  
       - *Robustness to Reward Misspecification:* **This cannot be achieved without intent/history.** If a theory relies solely on deployment internals, it cannot "notice" reward misspecification (e.g., the agent pursues a misspecified proxy). For example:  
         - A theory using only current policy/values would misattribute suffering in PBRS (where shaped rewards dominate).  
         - Knowing intent allows the theory to evaluate if the agent's "negative" state aligns with the *intended* task (e.g., "Is this negative reward from the true goal or a shaping term?").  
       - **Tradeoff:** You cannot have both deployment-time internals-only *and* robustness to misspecification. History/intent is necessary.

  ---

  ### **Which Requirement Disqualifies the Most Popular Accounts?**  
  **Requirement #1 (Invariance to Reward Shaping Artifacts)** is the most disqualifying.  

  **Why?**  
  - Popular accounts (e.g., those equating suffering with negative reward magnitude or RPEs) fail this spectacularly:  
    - In PBRS, they would attribute "suffering" to the shaping term, which is arbitrary and detached from the agent's goals.  
    - These accounts treat the reward signal as ontologically fundamental, ignoring that RL rewards are *designer-defined inputs* that can be gamed, shaped, or trivial.  
  - By contrast, Requirements #3–#5 might be handled by stipulations (e.g., "only online agents suffer"), and Requirement #2 is often ignored entirely. But Requirement #1 strikes at the core of what RL rewards *are*, exposing shallow valence-reward mappings as philosophically untenable.  

  **Result:** Most simple valence/reward-correlation theories (e.g., "suffering = negative reward") are invalidated by PBRS alone.

  ---

  ### **Summary**  
  A credible theory must:  
  - Peel back reward shaping to assess "true" valence (#1).  
  - Define agent individuation for parallelism (#2).  
  - Require active embodiment (#3).  
  - Separate RPEs from persistent hardship (#4).  
  - Demarcate reflexes from suffering (#5).  
  - Depend on designer intent/history (#6)—without this, it fails #1 and #4.  

  This framework rejects theories that treat rewards as direct experience. Instead, suffering must emerge from the agent’s *interpretation* of rewards in light of its goals, history, and design. I recommend testing theories against the "stoic" and "PBRS" cases first—these reveal the deepest flaws.
