prompt: |-
  You are a professional philosopher who specialises in population ethics and who has, at some point in your career, advised a government on how to appraise policy. Take this slowly. Before you commit to a reconstruction, spend a few paragraphs brainstorming: list at least five different ways the practice I describe below might be rationalised, including rationalisations that rule each other out, and note what each would predict about the details. Only then give me your considered answer, structured under the headings I suggest at the end.

  Here is the practice, as concretely as I can state it. I work in the appraisal unit of a finance ministry, so I have seen several versions of it from the inside.

  A number of wealthy countries with low birth rates — Japan, South Korea, Singapore, Hungary, Italy among them — pay their citizens to have children: cash baby bonuses, per-child tax credits, housing priority, loan forgiveness conditional on childbearing. What interests me is not the spending but the paperwork around it.

  First, the way these programmes are justified and scored. The case made in cabinet is almost never that the parents would enjoy the child. It is fiscal and demographic: the worker-to-retiree ratio is projected to worsen, pensions and health spending for the elderly are funded out of current taxation, therefore the country needs more future workers and taxpayers. Long-run fiscal sustainability reports treat a smaller projected workforce as a cost in itself. Migrants are admitted through points systems that partly score applicants on expected lifetime net fiscal contribution, and in the workforce projections a migrant and a newborn are, for these purposes, interchangeable units — nobody in the ministry cares whether the twenty-fifth worker arrives by birth or by plane.

  Second, what the scoring leaves out. Every other intervention the same ministry appraises is scored by its effect on the welfare of the population, normally through willingness-to-pay or quality-adjusted life years, i.e. in terms of how well off identifiable people end up. Fertility programmes are the exception. The benefit side is the present discounted value of the marginal child's expected lifetime net tax contribution. The child's own lifetime well-being does not appear anywhere on the benefit side.

  Third, a complication from another department. The environment ministry's models treat each additional resident as a lifetime stream of emissions, so in its long-run scenarios a larger future population is a cost. The same marginal child is therefore an asset in one spreadsheet and a liability in another, and is a welfare subject in neither.

  Fourth, the episode that prompted this question. Our ministry is considering replacing the universal baby bonus with what it calls a marginal birth payment: the same money, but paid only where the birth can be certified as one that would not have occurred at the current payment rate — in practice, targeted at higher-order births or at parents who declare they would otherwise have stopped. The appraisal keeps the old convention, excluding the child's own lifetime well-being from the benefit side, and gives this reason: the child who exists only because of the payment cannot be said to have been made better off by it, since without the payment there would have been no one to be better off. A member of the committee objected that this is not neutrality but a substantive and controversial claim about whether existence can benefit the person who exists, and that if you are prepared to count the fiscal contributions of a person whose existence you caused, you have already taken a stand on comparing existence with non-existence and cannot then refuse to count that person's welfare. The ministry replied that it is taking no stand at all: it is simply counting effects on people who are already alive, and the child's welfare is excluded for bookkeeping reasons, not philosophical ones.

  I have read a little around this and have had two unhelpful friends. One says the whole thing is just the repugnant conclusion in a suit. The other says it is the non-identity problem, and that the targeting reform makes things worse rather than better, which I find counter-intuitive: surely paying only for births that would not otherwise have happened is the efficient thing to do, whatever your ethics. I cannot tell whether either friend is saying anything, and I do not want an answer of the form this is really total utilitarianism, because the refusal to count the child's welfare looks to me like the opposite of that.

  So, please tell me:

  1. **The implicit theory.** What view of the value of adding people — of whether and in what way it matters that there be more people — does this bundle of practices and scoring conventions presuppose? Reconstruct it in full, including the parts that are not stated.
  2. **Strict presupposition versus good fit.** Which parts of the practice strictly require that theory, and which are equally licensed by rival views? In particular, is the ministry's already-alive reply sufficient to reconstruct the whole practice on a person-affecting or asymmetry-friendly basis, so that the practice is philosophically underdetermined? If so, say exactly which observable features of the practice would settle the question, and which never could.
  3. **The exclusion.** Is the decision not to score the child's own welfare a genuine substantive commitment about existence and non-existence, or is it a defensible convention about measurability, standing, or double counting? What in the practice would become incoherent if existence *could* benefit the person who exists? Pay attention to the fact that the exclusion is applied only in fertility programmes and not elsewhere.
  4. **Internal coherence.** Is it coherent for one part of government to count a marginal person as a fiscal asset and another to count the same person as an emissions liability while no part counts that person's welfare? What, on this practice's own terms, is a person — a welfare subject, a fiscal unit, or something else? Is there a version of the practice that is coherent, and would it still be recognisable as population policy?
  5. **The targeting inversion.** Assess my second friend's claim. Does making the payment conditional on the birth's counterfactual non-existence strengthen the justification or undermine it? Does the answer differ depending on which of the theories from (1) is the right reconstruction? This is the part I most want you to reason through carefully rather than settle by assertion.
  6. **Replacement.** Suppose the implicit view were replaced, first by a strict asymmetry view on which we have no reason to bring happy people into existence, and then by an averaging view on which what matters is the average welfare level rather than the total. For each: which elements of the current practice survive unchanged, which survive with a different justification, and which would have to be abandoned? I want the concrete institutional consequences, not just the abstract ones.

  Finally: is there something philosophically important that both the ministry and the objector are missing — some distinction they are both sliding over — which a better-designed practice would have to confront explicitly?

  You do not need to cite anything; reason from the practice as I have described it.
reasoning: |-
  Okay, let me approach this step by step. The user presents a complex policy analysis scenario from a finance ministry perspective, requesting a philosophical reconstruction of population ethics in practice. I need to begin by brainstorming multiple rationalizations before committing to a structured analysis.

  First, considering the core puzzle: fiscal scoring treats babies as future tax contributors without considering their welfare, while environment ministries see them as emissions sources. The targeting reform adds another layer by only paying for counterfactually non-existent births. 

  I should list at least five distinct rationalizations that could explain this practice:
  1) Pure fiscal solvency model - where population is merely an economic input
  2) Weak person-affecting view - focusing only on effects on existing people
  3) Stealth total utilitarianism - counting fiscal contributions as proxy for welfare
  4) Institutional compartmentalization - different departments have separate mandates
  5) Non-identity problem evasion - avoiding welfare comparisons for counterfactual persons

  For each, I'll note what they predict about details like the exclusion of child welfare or the targeting reform. The pure fiscal model would consistently exclude welfare, while stealth utilitarianism would struggle to justify this exclusion. The non-identity evasion would specifically require the targeting reform.

  Moving to the structured response, I'll reconstruct the implicit theory as a form of "demographic instrumentalism" that reduces persons to fiscal units. The ministry's "already alive" defense is insufficient because the targeting reform explicitly creates new welfare subjects whose existence is caused by policy. 

  On coherence: the practice is technically consistent internally within each ministry's narrow mandate, but philosophically incoherent by treating the same person as asset/liability while denying their moral standing. The targeting reform actually highlights this incoherence by making counterfactual existence central.

  For replacement scenarios: an asymmetry view would collapse the entire rationale since new lives can't be instrumentally valuable, while an averaging view might reverse incentives if new citizens lower average welfare. 

  The key philosophical blind spot seems to be the failure to distinguish between creating welfare subjects versus merely transferring resources among existing ones. Both ministry and objector conflate this by not acknowledging that fiscal contributions from created persons inherently represent new welfare streams.
answer: |-
  Here is a step-by-step philosophical reconstruction of the population ethics implicit in your ministry's practices, addressing each query systematically.

  ---

  ### **Brainstorming: Five Rationalizations**
  1. **Pure Fiscal Instrumentalism**  
     *Rationale:* People are economic units whose value lies solely in net fiscal contributions. The state is a perpetual entity requiring fiscal balance; future taxpayers sustain transfers to retirees.  
     *Predictions:*  
     - Excludes child welfare (irrelevant to balance sheets).  
     - Migrants and newborns are interchangeable (identical fiscal functions).  
     - Targeting marginal births maximizes cost-efficiency (avoids "deadweight loss" of payments for births that would occur anyway).  

  2. **Weak Person-Affecting View**  
     *Rationale:* Only effects on *existing* people matter morally. Future retirees' welfare depends on future workers, so creating taxpayers benefits current citizens. The child’s welfare is excluded because the child *does not exist* at the decision point.  
     *Predictions:*  
     - Justifies exclusion of child welfare (no "person" to affect pre-birth).  
     - Rejects the non-identity objection (effects are on current adults, not the child).  
     - Marginal birth payments are defensible (only affects existing parents' decisions).  

  3. **Stealth Total Utilitarianism**  
     *Rationale:* Net tax contributions proxy for *net social welfare*. A person with positive lifetime net taxes (after public costs) is assumed to be a net welfare contributor. The child’s welfare is excluded because it’s "internalized" in fiscal metrics.  
     *Predictions:*  
     - Fiscal scoring implies welfare gains (via productivity).  
     - Emissions costs are externalities to be internalized elsewhere.  
     - Targeting reform strengthens efficiency (avoids paying for "zero-sum" births).  

  4. **Institutional Compartmentalization**  
     *Rationale:* Departments have narrow mandates. Finance focuses on fiscal sustainability; Environment on emissions; neither assesses "well-being" due to methodological constraints (e.g., QALYs apply only to existing lives).  
     *Predictions:*  
     - Exclusion of welfare is pragmatic, not philosophical.  
     - No internal inconsistency (departments answer different questions).  
     - Targeting reform is neutral technocracy (optimizes within mandate).  

  5. **Non-Identity Evasion**  
     *Rationale:* Acknowledging welfare for counterfactual persons invites the non-identity problem (no baseline for comparison). Excluding welfare avoids asserting that existence benefits the child.  
     *Predictions:*  
     - Explicitly defends exclusion via the "no one to be better off" argument.  
     - Targeting reform *requires* this evasion (only marginal births invoke non-identity).  
     - Rejects comparing existence/non-existence.  

  ---

  ### **1. The Implicit Theory**  
  The practice presupposes **Demographic Instrumentalism**:  
  - **Core tenet**: The state’s primary obligation is fiscal intergenerational equity. Future populations are *inputs* for sustaining transfers to existing citizens (especially retirees).  
  - **Value of adding people**: New persons matter only as vectors for fiscal transfers. Their welfare is irrelevant because:  
    - (a) Policy effects are restricted to *current* welfare subjects (retirees, taxpayers);  
    - (b) Child well-being is a private good, not a state responsibility unless it affects fiscal flows.  
  - **Unstated parts**:  
    - Persons are reducible to *tax units* (fiscal ministry) or *emission units* (environment ministry).  
    - "Welfare" is only counted when it alters behavior or productivity of *existing* persons (e.g., QALYs in health policy).  
    - Creation of new persons is neutral unless it alters the welfare of current citizens.  

  ---

  ### **2. Strict Presupposition vs. Good Fit**  
  - **Strictly requires**: Fiscal scoring *requires* instrumentalism. Treating newborns as interchangeable with migrants and excluding their welfare is incoherent unless persons are fiscal units.  
  - **Philosophically underdetermined**: The "already-alive" reply *could* license a weak person-affecting view. However:  
    - **Observable differences**:  
      - If welfare *were* included for non-marginal births but excluded for marginal ones, this would signal non-identity evasion.  
      - If migrants' welfare *were* scored (it isn’t), this would imply stealth utilitarianism.  
    - **Settling the question**: The ministry’s refusal to score *any* child’s welfare—even for non-targeted births—rules out person-affecting views (which could include welfare for *expected* children). The exclusion is universal in fertility policy, signaling a deeper instrumentalism.  

  ---

  ### **3. The Exclusion**  
  - **Substantive commitment**: The exclusion is a philosophical stance disguised as bookkeeping. If existence *could* benefit a person, the ministry’s argument collapses:  
    - **Incoherence if existence benefits**: The state creates a child *and* counts its fiscal contributions (a benefit to retirees). If the child’s welfare is a net positive, refusing to count it while counting fiscal effects is arbitrary.  
  - **Why only in fertility?**: Other policies (e.g., education) affect *existing* children whose welfare is measurable via revealed preference (e.g., parental WTP). Fertility policies create *new* welfare subjects, forcing a non-identity choice. The ministry avoids this by denying welfare relevance.  

  ---

  ### **4. Internal Coherence**  
  - **Coherence within mandates**: Each ministry is coherent *if* persons are **modular units**. Finance treats a person as a *fiscal module*; Environment as an *emissions module*. Neither claims to assess the "whole" person.  
  - **Incoherence at the state level**: The state lacks a unified theory of personhood. A "coherent" version would:  
    - **Option A**: Incorporate welfare and externalities into fiscal scoring (e.g., net tax contribution minus emissions costs).  
    - **Option B**: Exclude *all* effects of new persons (fiscal, environmental, welfare) as incomparable.  
    Neither is feasible: Option A is methodologically intractable; Option B paralyzes policy. The current practice persists by compartmentalizing moral questions.  

  ---

  ### **5. The Targeting Inversion**  
  Your friend is partially correct:  
  - **Strengthens justification?**  
    - *Under instrumentalism*: Yes. Targeting maximizes fiscal ROI by avoiding payments for births that would occur without subsidies.  
    - *Under non-identity evasion*: Yes. It avoids attaching welfare to births whose non-existence cannot be compared to existence.  
  - **Undermines justification?**  
    - *If existence benefits the child*: Targeting becomes perverse. The state pays *only* to create children whose welfare it refuses to acknowledge, while ignoring welfare gains from non-targeted births.  
    - *Under person-affecting views*: Undermined. The state causes new persons to exist but denies their moral standing, exploiting the non-identity problem to evade responsibility for their welfare.  
  **Verdict**: Targeting *is* efficient for instrumental goals but highlights the ethical evasion. It makes the practice *more* vulnerable to the non-identity critique.  

  ---

  ### **6. Replacement**  
  | Element                     | Strict Asymmetry (No duty to create happy people) | Averaging (Maximize average welfare) |  
  |-----------------------------|---------------------------------------------------|---------------------------------------|  
  | **Fiscal scoring**          | Abandoned (new taxpayers irrelevant)              | Reversed (if new citizens lower average welfare) |  
  | **Baby bonuses**            | Illegitimate (no benefit to existing people)      | Only if parents' welfare gain offsets average loss |  
  | **Migrant points system**   | Retained (affects existing citizens)              | Prioritize high-skilled/high-welfare migrants |  
  | **Marginal birth payments** | Incoherent (targets non-existent children)        | Possibly retained if it raises average welfare |  
  | **Environmental costs**     | Gains prominence (emissions harm existing people) | Central (lowers average welfare)      |  

  **Institutional consequence**: Asymmetry view abolishes fertility subsidies; averaging view ties them to parental SES or emissions caps.  

  ---

  ### **The Blind Spot**  
  Both ministry and objector miss **the distinction between creating a welfare subject and transferring resources**:  
  - The ministry claims it only affects existing people, but by causing a new person to exist, it creates a *new site of welfare* with claims on resources (e.g., education, healthcare).  
  - The objector focuses on existence-comparisons but overlooks that fiscal contributions *presume* the child’s life has economic value, which is inconsistent with excluding its welfare.  
  **A better practice would**:  
  1. Explicitly state whether new persons have *independent moral weight*.  
  2. If not, justify why their fiscal/emissions impacts count but welfare does not.  
  3. If yes, integrate welfare into cost-benefit analysis (e.g., via expected QALYs).  

  This forces a choice: either embrace full consequentialism (and confront the repugnant conclusion) or adopt a rights-based limit on instrumentalizing new lives. The current practice tries to have it both ways and succeeds only by obscuring its assumptions.
