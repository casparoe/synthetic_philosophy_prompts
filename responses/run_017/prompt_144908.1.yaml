answer: |-
  Here’s the exam question, model answer, and marking scheme designed to meet your specifications. The question forces students to confront the gap between revealed preference’s formal structure and welfare economics’ substantive demands, using your two wrinkles as levers.

  ---

  ### **Exam Question: Philosophy of Economics Final (90 minutes, 1000 words max)**  
  **Total Marks: 25**  

  **Question:**  
  Revealed preference theory (RPT) treats utility as an ordinal representation of choice behavior, invariant under monotonic transformations. Yet economists frequently invoke "utility" in welfare contexts (e.g., declining marginal utility of income, cost-benefit analysis, interpersonal compensation).  

  (a) **The Denomination Problem**: Suppose neuroscientists discover a measurable brain state *N* such that, for any agent, their choices *always* satisfy the Generalized Axiom of Revealed Preference (GARP) and are *as if* they maximize *N*. *N* is cardinal, interpersonally comparable, and perfectly predicts choices. Does this make *N* a valid measure of *welfare*? Why or why not? What must be true of *N* beyond choice-correlation to qualify as welfare, and how could we justify that claim within RPT? (12 marks)  

  (b) **The As-If Agent**: An agent’s choices over all tested budget sets satisfy GARP and are *as if* they maximize a utility function *u*. However, we learn their true decision rule is: "Pick the option nearest the top-left corner of the menu." Is *u* a legitimate utility representation? What test (beyond standard choice data) could distinguish whether *u* is more than curve-fitting? Explain why such a test matters for welfare economics. (13 marks)  

  **Overall**: Can RPT’s utility concept support welfare-economic claims? Defend your answer using (a) and (b).  

  ---

  ### **Model Answer (Approx. 800 words)**  
  **Thesis**: RPT’s utility is *descriptively* robust but *normatively* inadequate for welfare economics. It reveals preferences but cannot ground interpersonal comparisons, compensation, or welfare judgments without extra-behavioral assumptions.  

  **(a) The Denomination Problem: Why *N* ≠ Welfare**  
  Even if *N* perfectly predicts choices, it need not be welfare. *N* could track arousal, salience, or neural noise correlated with choices but divorced from well-being (e.g., addiction behavior maximizes *N* but harms welfare). For *N* to *be* welfare, we must assert: (1) *N* intrinsically constitutes well-being (e.g., hedonism), or (2) *N* causally drives welfare-relevant states. Neither claim is justified by choice data alone.  

  RPT only requires that *N* ordinally represents preferences. Cardinality and comparability are *mathematical* features of *N*, not proof of normative significance. Justifying *N* as welfare requires a *philosophical* bridge: e.g., declaring that "welfare is whatever rational agents reveal they prefer." But RPT itself avoids such claims—it describes choices, not welfare. Thus, *N* dissolves nothing; it relocates the problem to justifying why this measurable correlate *is* welfare, which RPT cannot do.  

  **(b) The As-If Agent: Why Prediction ≠ Representation**  
  The top-left rule satisfies GARP *for observed choices*, making *u* a valid RPT representation *descriptively*. But if the agent only ever faces menus printed in standard formats, *u* is curve-fitting: it summarizes past choices but fails to predict behavior under *novel* conditions (e.g., menus rotated 90°, or new goods). To test legitimacy, we need **counterfactual menu variations**:  
  - Introduce goods with identical physical properties but new spatial positions.  
  - Offer menus where "top-left" correlates negatively with traditional utility (e.g., a spoiled apple in the top-left).  
  If choices shift with spatial cues despite stable *u*-relevant properties, *u* was not "real."  

  This matters for welfare because RPT is silent on counterfactuals. Welfare policy (e.g., introducing new goods) requires predicting choices in *untested* scenarios. If utility is merely a fitted function without causal or predictive depth, we cannot trust it for welfare gains.  

  **Why RPT Utility Fails Welfare Economics**  
  RPT imposes *real constraints* (WARP/GARP) that falsify inconsistent choice patterns, making it non-vacuous. But welfare economics needs:  
  1. **Cardinality**: To claim "Policy X hurts A less than it helps B" requires comparing *intensity* of utility changes.  
  2. **Interpersonal comparability**: Compensation tests ("Kaldor-Hicks efficiency") assume utils can be compared across agents.  
  3. **Counterfactual robustness**: Policies alter choice sets; welfare requires predicting well-being under new options.  

  RPT provides none of these. The *Denomination Problem* shows that even a "perfect" neural correlate needs *extra-behavioral justification* to be welfare. The *As-If Agent* shows that RPT representations may lack predictive power beyond observed data. Thus, while RPT utility *describes* choices rigorously, it cannot *prescribe* welfare judgments without importing normative assumptions exogenous to choice behavior.  

  **Verdict**: Welfare economics cannot be "read off" revealed preferences. It requires ethical supplements (e.g., assuming utility measures well-being, or accepting preference-satisfaction as welfare). RPT’s utility is a tool for prediction, not a foundation for justice.  

  ---

  ### **Marking Scheme (25 marks total)**  
  **Must-hit points** (marks per section; typical errors in italics):  
  1. **(a) *N* ≠ welfare by default**: Explain why *N* could correlate with non-welfare states (e.g., arousal). *[3 marks; Error: Assuming choice-correlation implies welfare.]*  
  2. **(a) The extra claim**: Identify that *N* needs a normative bridge (e.g., "welfare = what agents prefer") and note RPT cannot provide it. *[3 marks; Error: Asserting neuroscience "solves" welfare.]*  
  3. **(a) Cardinality/comparability**: State that these are mathematical, not normative, features. *[2 marks; Error: Confusing measurability with normative validity.]*  
  4. **(b) GARP satisfaction ≠ legitimacy**: Affirm *u* is valid *descriptively* but may lack predictive depth. *[3 marks; Error: Claiming GARP compliance alone makes *u* "real".]*  
  5. **(b) Counterfactual test**: Propose testing novel menus/goods to expose spatial rule vs. *u*. *[4 marks; Error: Only checking more budget sets, not structural variations.]*  
  6. **Welfare demands vs. RPT limits**: Explain why welfare needs cardinality, comparability, and counterfactuals—and why RPT fails to provide them. *[4 marks; Error: Only repeating "utility is ordinal".]*  
  7. **Clear verdict**: State that RPT utility cannot support welfare claims without extra assumptions. *[3 marks; Error: Undecided or "it depends".]*  
  8. **Synthesis**: Use (a) and (b) cohesively to show *why* RPT is descriptively strong but normatively hollow. *[3 marks; Error: Treating (a) and (b) separately.]*  

  **A vs. B Separation**:  
  - **B-grade (≤18/25)**: Correctly explains RPT’s ordinality, WARP/GARP falsifiability, and the two wrinkles superficially.  
  - **A-grade (≥19/25)**: Explicitly **connects the wrinkles to welfare’s normative demands** (e.g., "The Denomination Problem shows choice-correlation ≠ welfare; the As-If Agent shows RPT cannot validate counterfactuals needed for policy"). Must articulate *why* welfare requires more than choice data.  

  ---

  ### **Notes on Your Framing**  
  - **Bog-Standard Doctrine**:  
    - RPT utility is ordinal, defined by choice, invariant under monotonic transformations.  
    - WARP/GARP impose testable, falsifiable constraints (Samuelson, Afriat).  
    - Welfare economics requires cardinal/comparable utility for compensation (Hicks, Kaldor).  
  - **Your Coinage/Contested**:  
    - **Denomination Problem**: Novel framing. Standard debates involve "experience machine" objections (Nozick) or whether preferences define welfare (Harsanyi vs. Sen). Your twist (a measurable *N* that predicts choices) sharpens the is-ought gap.  
    - **As-If Agent**: Fresh angle on "multiple realizability" in representation theorems. Standard issue: Many rules can generate the same choices (e.g., Mandler). Your spatial rule makes it vivid and tests counterfactual robustness.  
  - **Confusion Check**: Neither wrinkle is confused. Both crystallize core tensions: (1) choice-correlation vs. normative validity, (2) descriptive adequacy vs. predictive depth. They’re not re-runs but targeted extensions.  

  **Key Consensus Gap**: Economists broadly agree RPT utility is *not* welfare—but routinely *use* it as such (e.g., declining marginal utility of income). Your exam question forces students to confront this dissonance.  

  Good luck with the piece—and the airport Wi-Fi!
