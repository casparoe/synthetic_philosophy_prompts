prompt: |-
  I'm on the conduct and ethics committee of a mid-sized international health NGO, and we have to decide what to do about our country office in Terembu before our next report to the donor in about three weeks. The country director — local staff, eleven years with us, well liked — has been approving a cluster of things our global policy almost certainly classes as corruption, on roughly the sector-standard definition our policy copies: power entrusted to you, used for private gain. Concretely: monthly transport and sitting allowances paid to government clinic inspectors so they will actually visit the remote clinics they are meant to supervise (their own ministry has not funded fuel in two years); four goats presented to village elders at a clinic opening; hiring the district health officer's younger brother as a driver, who is by all accounts a genuinely good driver and whose hiring the DHO made clear was about the relationship; and a contractor kicking in bags of cement for the clinic fence as a community contribution. None of it appears anywhere as a line item marked bribe, and our programs lead keeps pointing out that the inspections happened, the cold chain got fixed, and the clinic got built.

  Our regional director says that reporting this to the donor would be a kind of moral imperialism, that we would be holding a Terembuan office to a Weberian bureacracy standard the surrounding political culture does not share, and that refusing the goats would not have been thrift but an insult that ended the relationship with the elders outright. Our governance lead says the opposite: intent and local meaning are irrelevant, the policy is strict liability, and anything softer is how organizations talk themselves into a scandal. I do not want to write context matters and move on.

  To give us something sharper than that, our regional advisor circulated a note with a distinction I half like: facilitation gifting, where the gift buys one specific official act that breaks a rule; maintenance gifting, where it sustains a relationship of obligation and what comes back is discretion and goodwill rather than a specified act; constitutive gifting, where the gift is the relationship, so that refusing dissolves it; and — the one I keep coming back to — something she calls capture by substitution, where impersonal provision gets replaced so thoroughly by gift obligations that officials acquire an interest in keeping their own duties unfunded, since the underfunding is what makes the gifts necessary. That last one seems to me the strongest thing that can be said against tolerating any of this even on its own terms, and I want it in the memo even if we land the other way.

  Can you draft the memo I will circulate before the meeting? It should give us a bottom line we can actually vote on — report to the donor or not, sanction the country director or not, and what we say by the deadline; it should say which of the four categories each of the four practices falls into, or argue that the taxonomy is the wrong tool for one of them; it should give us a decision rule for the next case, because there will be one, that is not just ask the regional director; and it should give the losing side honestly — if you recommend reporting, why the moral imperialism charge has real force here, and if you recommend not reporting, what we say both to the governance lead and to the Terembuan staff who have watched expat managers bend these rules for years.
reasoning: |-
  Okay, the user is part of an ethics committee for an international health NGO facing a tricky situation in Terembu. They need to draft a memo to decide whether to report potential corruption to their donor. Let me unpack this step by step.

  First, the country director has approved several practices that might violate the NGO's anti-corruption policy. These include allowances for government inspectors, goats for village elders, hiring a relative of a health officer, and a contractor providing cement. The programs lead argues these actions led to tangible results—inspections happened, clinics got built. 

  The regional director calls reporting "moral imperialism," while the governance lead insists on strict policy adherence. The user wants a nuanced approach, especially highlighting "capture by substitution"—where gifts create dependency on underfunding. 

  Hmm, the user needs a memo that does several things: categorizes each practice using the advisor's taxonomy, recommends actions (report? sanction?), provides a future decision rule, and addresses counterarguments. They don't want a wishy-washy "context matters" conclusion.

  Let me analyze each practice through the taxonomy:
  - **Inspector allowances**: Feels like "maintenance gifting." It's sustaining relationships for goodwill, not buying specific acts. But risky—if it becomes routine, it enables systemic underfunding ("capture").
  - **Goats for elders**: Classic "constitutive gifting." Refusing would end the relationship. Not corrupt per se, but the optics could trouble donors.
  - **Relative hire**: This is tricky. The advisor's taxonomy doesn't quite fit nepotism. It's more about conflict of interest than gift-giving. The driver's competence complicates it—not clearly corrupt, but smells bad.
  - **Contractor's cement**: "Facilitation gifting"? It's buying a specific benefit (community contribution credit). Most clearly crosses the line—quid pro quo.

  For the bottom line... Reporting all might be overkill and damage operations. But ignoring everything risks policy erosion. A middle path? Report only the clearest violation (cement), treat the rest as systemic issues requiring reform. Sanctions for the country director seem unfair—they operated in a broken system. 

  Future decision rule: A "Terembu Protocol" checklist! Assess necessity, proportionality, transparency, etc. Prevents arbitrary calls by the regional director.

  Addressing counterarguments: If we don't report, we must explain to the governance lead that context *can* matter ethically without excusing corruption. To Terembu staff: Acknowledge past double standards but stress new systemic fixes. 

  If reporting, defend against "moral imperialism" by noting Terembu suffers most from captured systems—this is solidarity, not imposition. 

  ...Wait, the user emphasized "capture by substitution" as key. The memo must stress that even "good" gifts sustain dysfunction. The cement and allowances especially risk this. 

  Final structure: Intro → Analysis per practice → Recommendations → Future framework → Counterarguments. Tone: Pragmatic but principled, avoiding Western saviorism while rejecting complacency.
answer: |-
  Here’s a draft memo designed to sharpen the debate, incorporate the taxonomy, and force a concrete decision while honoring the ethical tensions:

  ---

  **MEMORANDUM**  
  **To:** Conduct and Ethics Committee  
  **From:** [Your Name/Committee Chair]  
  **Date:** [Date]  
  **Subject:** Terembu Country Office Assessment: Ethical Framework & Recommendations  

  ### **I. Background**  
  Our review confirms that the Terembu Country Office engaged in four practices conflicting with our global anti-corruption policy ("use of entrusted power for private gain"):  
  1. **Monthly allowances** to government clinic inspectors (due to unfunded mandates).  
  2. **Four goats gifted** to village elders at a clinic opening.  
  3. **Hiring the District Health Officer’s (DHO) brother** as a driver (competent, but relationship-linked).  
  4. **A contractor’s "community contribution"** of cement bags for a clinic fence.  

  Program outcomes (completed inspections, clinic construction) are acknowledged. However, policy breaches require assessment beyond outcomes. We apply the Regional Advisor’s taxonomy to evaluate intent and systemic risk.  

  ---

  ### **II. Taxonomy Analysis**  
  | **Practice**               | **Category**                     | **Rationale**                                                                 |  
  |----------------------------|----------------------------------|-------------------------------------------------------------------------------|  
  | **1. Inspector allowances** | **Maintenance Gifting**          | Sustains an ongoing relationship; ensures goodwill/discretion (not a specific act). Risk of normalizing underfunding. |  
  | **2. Goats to elders**      | **Constitutive Gifting**         | The gift *is* the relationship. Refusal would dissolve trust. Cultural necessity outweighs strict liability. |  
  | **3. Hiring DHO’s brother** | **Taxonomy Inapplicable**        | Not gifting, but nepotism/conflict of interest. Competence mitigates but doesn’t negate the ethical breach. |  
  | **4. Contractor’s cement** | **Facilitation Gifting**         | Secures a specific benefit (fence completion) in violation of procurement integrity. Clear quid pro quo. |  

  **Key Systemic Risk**: **Capture by substitution** is the critical concern. Allowances and contractor contributions create perverse incentives for officials to *maintain underfunding*, making NGOs complicit in systemic dysfunction. This risks long-term harm even where short-term gains occur.  

  ---

  ### **III. Recommendations for Vote**  
  **1. Report to Donor?**  
     - **Recommendation: YES** – **But only for Item 4 (contractor cement)**.  
     - **Why**: This is unambiguous facilitation gifting (quid pro quo). Concealing it risks donor backlash if discovered.  
     - **Mitigate Moral Imperialism**: Contextualize the report:  
       *"Terembu Office secured clinic completion amid systemic state failure, but one practice (contractor incentive) violated policy. We are addressing systemic drivers."*  

  **2. Sanction Country Director?**  
     - **Recommendation: NO formal sanction** – **But require remediation plan**.  
     - **Why**: Intent was program delivery, not personal gain. Practices #1-3 reflect systemic adaptation, not malice. Sanctioning would penalize local staff for constraints expats historically dodged.  

  **3. By Deadline:**  
     - Report contractor issue to donor.  
     - Disclose *all* practices in *internal* audit, committing to systemic reforms (see IV).  

  ---

  ### **IV. Decision Rule for Future Cases**  
  Adopt a **"Terembu Protocol"** for constrained environments:  
  **1. Necessity Test**: Is the practice *essential* to deliver core humanitarian outcomes?  
  **2. Proportionality**: Is the benefit’s scale justified and minimal?  
  **3. Transparency**: Documented internally? Avoids concealment.  
  **4. Anti-Capture Check**: Does it risk perpetuating state withdrawal (e.g., allowances vs. advocacy for fuel funding)?  
  **5. Collective Approval**: Requires Committee *and* Regional Director sign-off.  

  *This replaces unilateral "ask the Regional Director" discretion.*  

  ---

  ### **V. Addressing Counterarguments**  
  **If Reporting (To Governance Lead)**:  
  > *"Strict liability must be balanced with *proportional response*. Reporting the cement (clear quid pro quo) upholds policy integrity. Not reporting allowances/goats/hiring avoids penalizing adaptation to state failure where no personal gain occurred. Our reforms target systemic capture."*  

  **If Not Sanctioning (To Terembu Staff)**:  
  > *"Past expat flexibility was unjust. We commit to equitable standards. The Director acted to serve communities, not himself. We will reform systems that force such choices, while unequivocally banning bribes (e.g., contractor incentives). Your feedback is vital to this."*  

  **To Regional Director (On Moral Imperialism)**:  
  > *"We agree context matters. Hence: no sanction, nuanced reporting, and cultural acceptance of constitutive gifting (goats). But facilitating capture (allowances/contractor gifts) harms Terembu most. Our policy must empower locals to resist systemic decay, not adapt to it."*  

  ---

  ### **VI. Committee Vote Required**  
  Please vote by [Date] on:  
  1. **Report to donor?** [ ] Yes (Item 4 only) | [ ] No  
  2. **Sanction Country Director?** [ ] Yes | [ ] No (with remediation)  
  3. **Adopt "Terembu Protocol" decision rule?** [ ] Yes | [ ] No  

  **Bottom Line**: Tolerating *facilitation gifting* (cement) invites capture; criminalizing *constitutive gifting* (goats) is imperialism. We must confront the former and contextualize the latter, while attacking systems that force such choices.  

  ---  
  **Attachments**:  
  - Full Terembu Office Report  
  - Draft "Terembu Protocol" Checklist  

  ---  
  *This memo prioritizes actionable ethics over purity tests. It reports the indefensible, spares the well-intentioned, and builds tools to prevent recurrence.*  

  ---
