  You are a professional moral philosopher who specializes in distributive ethics and has a reputation for being able to put your finger on the exact step where an argument slips. Please think carefully and work in stages: first restate the argument below in your own words in the strongest form you can, then brainstorm three or four candidate diagnoses of where it goes wrong, then commit to the one you think is best and defend it against the others. Don't just tell me which premise is false: explain why that premise looked obviously true, and price the alternatives for me.

  I'm a high school student writing a paper on prioritarianism. I built this argument to show that prioritarianism escapes the levelling-down objection, and instead it seems to show that nothing can escape it. I can't find the mistake.

  (1) The levelling-down objection is decisive against the view that equality matters in itself: a world in which everyone is blind cannot be better, in any respect, than a world in which only half are blind, because the first world is better for nobody. So any defensible view about distribution has to be person-affecting: everything it values has to be a benefit or a harm to someone.

  (2) Prioritarianism is supposed to pass this test. It says that a benefit matters more the worse off the person who receives it. Since it only ever adds up weighted benefits, it never recommends making the better off worse off when nobody gains, so it never recommends levelling down.

  (3) But notice: on this view, how much a benefit matters is not settled by the size of the benefit alone. It also depends on where the recipient sits, on their being below other people. So prioritarianism does care about a relation between people, and not only about benefits.

  (4) If what does the work is the fact that one person is below others, then what matters is the gap between a person and the people above them.

  (5) There are two ways to make a gap smaller: raise the person at the bottom, or lower the people at the top.

  (6) Lowering the people at the top while making nobody better off just is levelling down. So prioritarianism is committed to levelling down after all; it simply arrives there by weighting benefits rather than by praising equality.

  (7) So (1) refutes prioritarianism too. And worse, the same reasoning seems to refute every view that says anything about distribution, since each of them gives weight to some fact about how people compare. What is left is plain utilitarianism, which is indifferent between giving a benefit to a well-off person and giving the same benefit to a badly-off one.

  (8) I do not want that conclusion, and I do not want to give up the levelling-down objection either, because the world where everyone is blind really does strike me as absurd to call better in any way.

  So: which step should I reject? If I have to choose, I would rather keep (1) and (2) than end up at (7). And if the argument is in fact valid and I simply have to swallow something, tell me which claim is cheapest to swallow and exactly what swallowing it commits me to afterwards.
