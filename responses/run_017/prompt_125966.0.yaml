prompt: |-
  Doing a forty-minute slot at a crime-writing festival in Bristol in October — about thirty novelists, no philosophy between them, no slides, a flipchart if I can be bothered — on the wrong kind of reasons. It's billed as 'writing characters who get paid, blackmailed or nagged into feelings'.

  The case I keep coming back to is one of my own: my detective is offered fifty grand by a tabloid to believe a suspect is guilty, and then, in a seperate scene, the same money to *admire* him. Which makes me wonder whether one example can carry the whole thing, or whether the admiration one quietly breaks the machinery, since admiration doesn't seem to have the sort of thing-it's-meant-to-get-right that belief has.

  So don't explain it to me — plan the session. What has to be in place before 'wrong kind of reason' means anything at all to them, and in what order do the pieces have to land and why? They'll definately arrive thinking the fifty grand obviously *is* a reason, and that 'wrong kind' just means 'not a very good one'. Which example should carry it, and what does it have to have and what must it lack? The misconceptions I'm braced for: that the money is merely outweighed; that this is really only about belief, or only about evidence; that 'you have a reason to make yourself believe it' is just the same claim as 'you have a reason to believe it'; and that a bribe can't cause a belief anyway. Where in the sequence should I head off each one? Give me one question to end on that shows they've got it rather than just nodding along, and tell me what to flatly refuse to get into at this level — I assume the argument about what 'good' means that all this grew out of, but say if something else will swallow the hour.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing a 40-minute session for a crime-writing festival in Bristol, focused on "wrong kind of reasons" in character motivations. The key example they have is their detective being offered money to believe a suspect is guilty and then later to admire him. The user is worried if one example can carry the session and if the admiration part complicates things since admiration lacks the truth-tracking aspect that belief has.

  First, I need to clarify the core concept of "wrong kind of reasons" (WKR). The user mentioned that attendees might confuse WKR with weak reasons or think it's only about belief. So, the session must clearly distinguish between reasons that weigh on a scale versus reasons that are categorically wrong. The philosophical distinction here is crucial but needs to be presented without jargon. 

  The user’s example with the detective and bribes is strong. The first bribe (to believe guilt) highlights how money can't make a belief true. But the admiration bribe is trickier because admiration doesn't have a truth condition. I need to ensure that the session doesn't get bogged down in whether admiration can have WKR. Maybe emphasizing that admiration still has standards, like sincerity, could help. The key is to show that both cases involve motivations that bypass the proper grounds for the attitude.

  Attendees might think the money is just a weak reason that's outweighed by evidence. To counter this, I should create scenarios where evidence isn't conflicting. For example, if all evidence points to innocence, the money still doesn't become a valid reason to believe guilt. This helps isolate the categorical error.

  Another misconception is confusing reasons to believe with reasons to act as if you believe. The user mentioned this in their braced misconceptions. Using a prompt where the detective is told to "convince the world" versus "genuinely believe" could clarify the difference. This shows that action-oriented reasons are practical, while belief reasons are truth-oriented.

  For the admiration part, it might be useful to contrast it with belief. While belief aims at truth, admiration aims at qualities like excellence or virtue. A bribe to admire someone doesn't engage with their actual qualities, so it's the wrong kind of reason. The session should stress that both attitudes have their own "fitness conditions" that bribes ignore.

  The user wants a closing question to test understanding. Asking writers to create their own examples of WKR in different attitudes (trust, fear, respect) would be effective. This checks if they grasp the concept beyond the given examples and can apply it to character motivations in their writing.

  I need to avoid deep philosophical debates about the meaning of "good" or whether admiration can have correctness conditions. The session should stay focused on narrative utility. Also, sidestep discussions on whether bribes can cause belief; that's a psychological tangent. Instead, emphasize the conceptual point: what counts as a valid reason.

  Structure-wise, starting with the bribe to believe makes sense as it's intuitive. After establishing that, introduce the admiration example to show the broader application. Use interactive elements like flipcharts to list attitudes and valid/invalid reasons, keeping writers engaged. 

  Timing is tight—40 minutes. Allocate 5 mins for intro, 15 on belief, 10 on admiration, 5 for application, and 5 for Q&A. Use the detective example throughout to maintain coherence. The flipchart can map attitudes vs. reasons, reinforcing the framework visually.

  Finally, the user’s deeper need is likely to help writers create complex characters with morally conflicted motivations. By understanding WKR, they can add layers where characters are pressured in ways that distort their genuine attitudes, enhancing narrative tension. The session should empower them with this tool without getting lost in theory.
answer: |-
  Here’s a battle-tested plan for your session, designed to bypass philosophical jargon and anchor "wrong kind of reasons" (WKR) in visceral, writerly terms using your perfect case study.

  **Core Goal:** Make them feel the *categorical wrongness* of the bribe for belief/admiration, not just its weakness. Shift from "bad reason" to "wrong currency".

  **Time Allocation (40 mins):**
  *   **(5 min) Hook & Frame:** The Problem of Puppet Motives
  *   **(15 min) The Belief Bomb:** Dissecting the 50k Bribe to *Believe*
  *   **(10 min) The Admiration Twist:** Why It Doesn't Break, It Deepens
  *   **(5 min) Writerly Payoff:** Applying WKR to Character Depth
  *   **(3 min) The Test Question:** Do They *Feel* It?
  *   **(2 min) Wrap & Avoid:** What We *Won't* Do

  **The Session Plan:**

  1.  **Hook & Frame: The Problem of Puppet Motives (5 min)**
      *   **Start:** "We craft characters driven by money, threats, love, duty... But what if the reason offered *fundamentally can't* drive the feeling or attitude it demands? Not just weak, but *alien*? That's the 'wrong kind of reason'. It creates fascinating internal conflict and moral corrosion."
      *   **Stake:** "Getting this wrong makes characters feel fake. Getting it right creates tension where the character *can't* just weigh the reason on a scale – it jams the gears."
      *   **Your Case Intro:** "My detective is offered £50k by a tabloid. First, to *believe* a suspect is guilty. Later, the same money just to *admire* him. Instinctively, both feel deeply off. Why? That's our quest."

  2.  **The Belief Bomb: Dissecting the 50k Bribe to *Believe* (15 min)**
      *   **State the Offer:** "£50k to *genuinely believe* X is guilty."
      *   **Audience Gut Check:** "Show of hands: Who thinks the detective *could* actually do this for the money? (Expect mixed) Who thinks it's impossible? (Expect mixed) Who thinks it's possible but awful? (Likely many)."
      *   **The "Weighing" Misconception (Head off FIRST):**
          *   *Prompt:* "So, is the problem just that the evidence for innocence *outweighs* the £50k? What if the evidence was perfectly ambiguous? Would £50k tip the scales *towards belief*?"
          *   *Reveal:* "No! Even with zero evidence either way, £50k *still* can't make you genuinely believe guilt. It might make you *say* it, *act* as if, even *try* to convince yourself... but it can't create the actual belief. Why?"
      *   **Core Insight - Belief's "Fitness Condition":**
          *   *Flipchart (Use it!):* Draw two columns: "Attitude" (Belief) | "What Makes It Fit?" (Evidence, Truth).
          *   *Explain:* "Belief aims at truth. Its 'job' is to fit the world. Evidence (or reliable testimony) is the *right currency*. It makes the belief *fit* reality. £50k is the *wrong currency*. It doesn't make X guilty. It targets your wallet, not the truth."
          *   **Crucial Distinction (Head off "Reasons to Act"):**
              *   *Contrast:* "£50k *is* a perfectly good reason to *pretend* to believe, to *convince others* you believe, or to *investigate harder hoping* to believe. Those are actions. Belief itself? Different beast."

  3.  **The Admiration Twist: Why It Doesn't Break, It Deepens (10 min)**
      *   **State the Offer:** "Same detective, same £50k, now just to *admire* the suspect."
      *   **Audience Gut Check:** "Does *this* feel different? Could you do *this* for the money?" (Likely more "yes"es, or confusion).
      *   **The Challenge:** "Admiration doesn't have a 'truth' condition like belief. So is the money a possible reason here? Does it break our machinery?"
      *   **Reframe "Fitness" for Admiration:**
          *   *Flipchart:* Add new row: "Attitude" (Admiration) | "What Makes It Fit?" (Perceived Excellence, Virtue, Skill, Achievement).
          *   *Explain:* "Admiration 'fits' when it's a response to something *admirable* in the person/action – skill, courage, generosity, genius. Its 'currency' is perceived merit. It's about *what the person is/is doing*."
          *   **Apply the WKR Test:** "Does £50k *make* the suspect admirable? Does it reveal his hidden virtue? No. It targets your wallet, not his qualities. You might *act* admiringly, you might *force* a smile, but genuine admiration? The £50k is still the *wrong currency*. It bypasses the very thing admiration responds to."
      *   **Key Point:** "Both cases reveal the pattern: A 'Right Kind of Reason' (RKR) for an attitude connects to what *makes that attitude fit* (truth for belief, perceived merit for admiration). A WKR offers an *external incentive* unrelated to the attitude's core 'job'. It tries to *manufacture* the attitude from the outside."

  4.  **Writerly Payoff: Applying WKR to Character Depth (5 min)**
      *   **The Power:** "WKR creates *inescapable tension* for characters. They can't satisfy the demand *by* having the genuine attitude. The briber wants belief/admiration, but offers something that *cannot produce it*. The character is forced into hypocrisy, self-deception, or refusal."
      *   **Flipchart Brainstorm:** "What other attitudes could this work for? *Trust?* (Bribe vs. Reliability). *Fear?* (Threat vs. Perceived Danger). *Respect?* (Command vs. Earned Standing). *Love?* (Wealth vs. Affection/Connection)."
      *   **Prompt:** "Think of your characters. Where could someone be pressured with a WKR? How would they *feel* trapped? What inner conflict does it spark? (Betrayal of self? Cynicism? Desperate self-manipulation?)"

  5.  **The Test Question: Do They *Feel* It? (3 min)**
      *   **The Question:** "**Your character is offered something immensely valuable (safety for their family, their dream job, freedom from blackmail) *just to genuinely feel grateful* towards someone they despise. Can the offer *be* their reason for gratitude? Why/Why not?**"
      *   **Why it Works:** It mirrors the structure (external incentive vs. attitude's "fitness" - gratitude responds to perceived benefit/favor). Forces them to apply the "wrong currency" intuition. If they say "No, because the offer doesn't make the person deserve gratitude; it just pressures me," they've *got* it. If they waver ("Well, maybe if they try hard..."), probe gently: "Is the *feeling* genuine gratitude, or just relief/performance?"

  6.  **Wrap & Avoid: What We *Won't* Do (2 min)**
      *   **Flatly Refuse To Get Into:**
          1.  **The "Good" Argument:** "We're not debating what 'good' ultimately means. We're looking at *structural mismatches* between reasons and attitudes."
          2.  **Can Bribes *Cause* Belief?:** "Maybe psychologically someone *could* warp themselves. But conceptually, as a *reason*, the money is still the wrong *kind* – it doesn't justify the belief, even if it accidentally causes it. We care about justification for character motivation."
          3.  **Deep Meta-Ethics:** "No 'constitutivism' or dense philosophy papers today! We're stealing a sharp tool for character craft."
      *   **Final Punch:** "Use WKR to torture your characters. Trap them between impossible external demands and their internal sense of integrity. That's where the real crime – and the real story – happens."

  **Why this sequence works:**

  1.  **Starts Intuitive:** Belief is the easiest entry point (truth is clear).
  2.  **Heads off Major Misconceptions Early:** "Outweighing" and "Reasons to Act" are tackled immediately using the belief case.
  3.  **Uses Your Perfect Case:** The dual offer (belief *then* admiration) is brilliant. The belief case builds the framework; the admiration case tests and strengthens it, showing the pattern isn't *just* about truth-tracking.
  4.  **Focuses on "Fitness":** This is the key, non-technical concept. The flipchart makes it visual.
  5.  **Writer-Centric Payoff:** Connects directly to creating conflict and depth.
  6.  **Test Question Validates:** It's a clear application of the core concept to a new attitude.
  7.  **Avoids Quicksand:** Explicitly walls off the philosophical tar pits.

  **Flipchart Suggestion:** Keep it simple. Build two columns during the "Belief" section. Add the "Admiration" row during that section. Use the brainstorm in the Payoff section to fill in more attitudes. This visual progression reinforces the core framework.

  Go forth and make their characters deliciously conflicted!
