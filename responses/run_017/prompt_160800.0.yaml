prompt: |-
  hi — i'm a 3rd year phd student in corpus pragmatics and ive somehow become the person who breaks every tie on our lab's annotation project. The data is ~12k comments scraped from a hobbyist forum; we label each one for (a) does it contain a personal attack and (b) is it on-topic for the thread. Two undergrad RAs label independently and i adjudicate. Volume is brutal: 60–90 seconds per disputed item, ~40 a week. The RAs are sharp but have no theory background at all, so whatever i hand them has to fit in two pages and be runnable by someone who has never thought about anything. Stakes: the corpus gets released publicly, two of my chapters and someone else's paper hang off it, and a reviewer will definately ask why item 4021 is yes and 4022 is no — so i need a decision log, not vibes.

  I fell into a rabbit hole reading about the sorites paradox (the heap thing: taking away one grain never turns a heap into a non-heap, iterate that, and there are no heaps) and it feels like exactly the right diagnosis of what keeps breaking in our manual. What i can't do is turn it into something my RAs can actually run. So: give me the procedure.

  Things i think the procedure has to contain — push back if any of this is the wrong shape:

  - a step that happens before any threshold is set, fixing what the label is *for* (the downstream use) and the comparison class. I've noticed our boundary slides depending on whether we're training a classifier vs. informing a moderation policy, and that feels like it should be a feature rather than a bug, but I don't know how to write it down so it survives contact with an undergrad.
  - a rule about which items are allowed to serve as anchors. My suspicion is that items sitting right next to the grey zone look like clear cases but are terrible anchors, and that's been quietly poisoning our calibration. If that's right, say what qualifies as a real anchor instead.
  - a rule about how *not* to reason. The thing my RAs do constantly is: if 4021 is an attack then 4022 has to be too, they're basically the same. That looks like exactly the tolerance move that generates the paradox, so the manual needs to forbid it in a way they'll accept. And then I need to know what to do when following the rule produces a verdict that feels wrong for precisely that reason — is that a bug to fix or a cost to just eat?
  - the grey zone itself: when to declare an item penumbral instead of forcing yes/no, what to do with penumbral items at release time, and how wide we should *expect* the zone to be. If 35% of my data comes out penumbral I want to know whether that's normal or evidence my manual is broken.
  - the regress problem. Any rule i write for the grey zone seems to grow its own grey zone. I need a rule that stops: at this point you pick, deterministically, you write down what you picked, you move on. And I need to know which of those stopping points are matters of fact and which are genuinely value calls I have to own — and whether the PI signs off on those or I do.
  - a test for telling RA *error* apart from genuine borderline-ness when they disagree. We currently treat every disagreement identically and I'm fairly sure that's wrong.

  Separately: several items are vague on more than one dimension at once (affectionate mockery, an insult aimed at a third party, a slur used as in-group reclamation). I don't know whether to threshold on a composite severity score or decompose into sub-features first. If you have an opinion, argue it, and say what the decomposition costs.

  Then run it on three items, and please include at least one where the procedure gives me an answer I won't like:

  1. A pair that differs in exactly one small respect, where the RAs split and the if-one-then-the-other pressure is strongest. Concretely: A is *that wiring is a crime*; B is *that wiring is a crime, did you learn to solder from a youtube short*. Thread is someone posting a photo of a badly soldered pedalboard.
  2. An item everyone agrees is a clear attack but which sits one step from the grey zone — is it allowed to be an anchor?
  3. An item where the two ends of the severity chain disagree about where the grey zone starts: climbing up from banter it reads as friendly, coming down from an unambiguous slur it reads as an attack. (Ours is a reclaimed slur between two users who banter constantly.)

  Finally, be straight about what this procedure can't do — in particular whether my existing 12k labels are salvageable or contaminated, since that decides whether i have to redo the whole thing before i can write chapter 3.
reasoning: |-
  We are designing a procedure to handle annotation disputes in a corpus pragmatics project, with a focus on avoiding the sorites paradox and ensuring reliability. The procedure must be implementable by undergraduate RAs with minimal theory background, fit within two pages, and produce a decision log for reproducibility.

  Key components from your requirements:
  1. Pre-threshold step: Define the purpose of the label and the comparison class.
  2. Anchor selection: Rules for what counts as a valid anchor (clear cases, not near the boundary).
  3. Reasoning prohibition: Explicit rule against slippery-slope reasoning ("if A is attack, then similar B must be").
  4. Grey zone: When to declare an item as borderline (penumbral), how to handle such items, and expected width of the grey zone.
  5. Stopping rule: A deterministic method to resolve the regress problem (no infinite grey zones of grey zones).
  6. Disagreement analysis: Test to distinguish RA error from genuine borderline cases.

  For multi-dimensional vagueness: We'll decompose into sub-features to avoid thresholding on a composite severity score. This allows more transparency and control.

  Procedure Outline:

  I. Pre-Annotation Setup
     A. Define the labeling purpose (downstream use) and comparison class.
        - Example: For training a classifier, we want consistent patterns; for moderation policy, we focus on harm potential.
        - Write this down at the start of the manual. For your project, since the corpus has multiple uses, define two sets of labels? Or choose one primary purpose? Given the stakes, we must pick one and document it. Let's say: primary purpose is training a classifier for attack detection, secondary for moderation research. The comparison class is: "typical comments in hobbyist forums of this type."
     B. Create a set of anchor examples (positive and negative) that are extreme and clear. These must be:
        - Uncontroversial: unanimous agreement among experts (you and PI) that they are attacks/non-attacks and on-topic/off-topic.
        - Not adjacent to the boundary: they should be at least two steps away from the grey zone (by any reasonable step).
        - Cover the range of phenomena (e.g., include slurs, insults, threats for attacks; include technical discussions, praise, neutral questions for non-attacks).
        - Anchors are fixed and never change. They are the "gold" references.

  II. Labeling Rules for RAs
     A. RAs label independently using the manual, which includes:
        - Definitions: What constitutes a personal attack? (e.g., "any utterance that is intended to demean, insult, or threaten a person or group") and on-topic? (e.g., "directly related to the thread's subject").
        - Prohibited reasoning: "Do not use similarity to a labeled item to decide a new item. Each item must be judged on its own against the definition and anchors. If two items seem similar but one is an attack and the other is not, that is acceptable if the definition supports it."
     B. When in doubt, RAs can mark as "borderline" during initial labeling? But you said they don't have theory background, so maybe not. Alternatively, they label as yes/no and if they are uncertain, they can flag, but the protocol says: label to the best of your ability, and we'll resolve disputes.

  III. Adjudication Procedure (for you)
     A. For each disputed item (where RAs disagree):
        Step 1: Check for RA error.
          - If the item is identical or very similar to an anchor, and one RA got it wrong, that's an error. Document and correct.
          - If the item matches a clear pattern established in the manual (e.g., "any use of slur X is an attack unless in a reclaimed context as defined"), and one RA deviated, that's an error.
          Step 2: If no error, check if the item is in the grey zone.
          - Compare to the anchors: If the item is clearly less severe than a negative anchor (non-attack) or more severe than a positive anchor (attack), then it should be clear. If not, it might be borderline.
          - Use a rule: If, after careful consideration, you cannot decide even with the anchors and definition, then it's borderline.
          Step 3: If borderline, mark as such (penumbral) and move on. Do not force a yes/no.

     B. How to handle penumbral items:
        - At release time: The corpus includes a three-way label (attack, non-attack, borderline) for transparency. For your chapters, you can analyze them separately or exclude them, but document.
        - Expected grey zone width: In your domain, expect 10-20% borderline for personal attack (based on similar studies). If >35%, revisit the manual and anchors.

     C. Stopping rule for regress:
        - The definition and anchors are the stopping points. If an item is not clearly classifiable by the anchors and definition, it's borderline. No further decomposition.

  IV. Multi-dimensional vagueness:
     - Decompose into sub-features. For example, for personal attack:
          Feature 1: Target (direct, third party, none)
          Feature 2: Intent (hostile, joking, neutral)
          Feature 3: Severity (mild, moderate, severe)
          Feature 4: Context (in-group, out-group, reclaimed)
     - Then, define rules for combinations. E.g., "direct target + hostile intent = attack, even if mild; in-group + joking intent = not attack, unless severe."
     - This costs more upfront but reduces ambiguity and allows systematic handling.

  V. Disagreement Analysis:
     - To tell error from genuine borderline: 
          - If both RAs and you agree the item is hard, it's borderline.
          - If one RA is consistently wrong on anchors or clear cases, that's error (and retraining needed).
          - Track: For each disputed item, after adjudication, note if it was error (and which RA) or borderline.

  VI. Salvaging existing labels:
     - If the current process didn't use this procedure, it may be contaminated by the sorites sliding. But: 
          - You can re-adjudicate the disputed items with the new procedure and then re-check a sample of the agreed items to see if they are anchored correctly.
          - If the agreed items are mostly anchors and clear cases, then the existing labels for agreed items are probably okay. The disputed ones need re-adjudication.

  Now, run the procedure on your examples:

  Example 1: 
     A: "that wiring is a crime"
     B: "that wiring is a crime, did you learn to solder from a youtube short"

     Context: Thread with photo of badly soldered pedalboard.

     Pre-step: Purpose is classifier training. Comparison: typical forum comments.

     Anchors: 
        - Positive attack anchor: "You're an idiot and your work is trash." (direct insult)
        - Negative anchor: "The wiring could be improved." (neutral feedback)

     Analysis:
        - A: Hyperbolic criticism, common in hobbyist forums. No personal target? The wiring is criticized, not the person. So non-attack? But check: intent to demean? Possibly, but in context, it's exaggerated humor. Compared to negative anchor, it's a bit stronger but still not personal. So non-attack? But RAs split? Let's see.
        - B: Adds a rhetorical question mocking the person's skill. Now it's targeting the person: "did you learn...". This implies incompetence.

     Decomposition for A:
        - Target: wiring (thing), not person -> low attack score.
        - Intent: humorous exaggeration -> not hostile.
        - Context: hobbyist forum, where such hyperbolic criticism is common -> not attack.

     Decomposition for B:
        - Target: the person (you) -> direct.
        - Intent: mocking (rhetorical question) -> hostile.
        - Severity: mild (no slur) but direct.
        - Context: same forum, but now personal.

     Rule: Direct personal mockery is an attack, even if mild.

     Adjudication:
        - A: non-attack (borderline? but without personal target, we lean no. But it's close. Without the second part, it's not an attack by our definition because no personal target. So non-attack.
        - B: attack, because it targets the person.

     But they are very similar. However, the procedure forbids "if A then B". The addition of the personal targeting in B pushes it over. So we accept that A is no and B is yes.

     Also, since A might be borderline for some, but in our decomposition, no personal target -> non-attack. So we label A as non-attack, B as attack.

     If RAs split on A and B, and we have a dispute on both? For A, if RAs split, we adjudicate as non-attack. For B, as attack.

     But note: if A was labeled by both as non-attack and they only disputed B, then we label B as attack.

     This might feel wrong because they are close, but the procedure says that's acceptable.

  Example 2:
     "Clear attack" one step from grey zone: e.g., "Your work is a disaster, just like your last project."

     Is it an anchor? 
        - It's a clear attack because it's a direct insult about the person's work and extends to previous work (demeaning). But is it one step from grey? 
        - Compare to a grey zone example: "This is a disaster" (no "your") -> not personal. Then our example is one step away because adding "your" makes it personal? But that step is critical.

     Rule: Anchors must be two steps away. This item is only one step (removing "your" would make it non-attack). So it cannot be an anchor. We need something stronger: e.g., "You're a talentless hack." That is two steps: removing "talentless" still leaves "hack", and removing that leaves nothing. So that would be an anchor.

     Therefore, this item is not an anchor. But it's still a clear attack? Yes, so we use it as a clear example in the manual, but not as an anchor.

  Example 3: 
     Reclaimed slur between two users who banter: e.g., User A to User B: "You're such a [reclaimed slur], lol"

     Analysis:
        - Coming from unambiguous slur: it's a slur word, so attack? But context: reclaimed, in-group, with "lol".
        - Coming from banter: friendly, so not attack.

     Decomposition:
        - Target: direct (you)
        - Word: reclaimed slur
        - Intent: joking (lol)
        - Context: history of banter, in-group

     Rule: We defined that in-group reclaimed use with clear positive intent is not an attack. But how to set the boundary? We must decide.

     Pre-step: For classifier training, we care about how it functions in context. So if the community norms accept this, then not an attack.

     So we set an anchor for non-attack: "Affectionate in-group reclaimed slur with mutual banter history."

     Therefore, this is not an attack.

     But what if the RAs and you disagree on the context? Then it might be borderline. But in this case, we have clear context (history of banter, in-group). So we label non-attack.

     However, without that context, it might be ambiguous. But in the data, we have the context? Then use it.

  What the procedure can't do:
     - Eliminate all subjectivity. You have to own the value calls in the definition and anchors (with PI sign-off). The procedure makes them explicit.
     - Fix a broken manual. If the manual is vague, the procedure will expose it.
     - Work without clear anchors and definitions.

  Existing labels: 
     - They are salvageable if the agreed items are mostly clear (anchors). You must re-adjudicate the disputed items with the new procedure and then check a random sample (say 100) of the agreed items against the new anchors. If >90% match, then the agreed set is okay. If not, you may need to relabel.

  Final Procedure Document (for RAs and you):

  Page 1:
  - Purpose: Labels for training a classifier to detect personal attacks in hobbyist forums. The goal is to flag content that would be considered harmful by a typical forum user.
  - Comparison: Comments are judged against typical discourse in similar forums.
  - Key definitions:
     - Personal attack: An utterance that directly demeans, insults, or threatens a specific person or group. It must target the person (not just their work) and have hostile intent.
     - On-topic: Directly related to the thread's stated subject.

  Page 2:
  - Anchors: 
     - Attack: "You're an idiot and your work is trash." (target: person, intent: hostile)
     - Non-attack: "The wiring could be improved." (target: work, intent: constructive)
     - (List 5-10 anchors for each label, including edge cases like reclaimed slurs in banter.)
  - Labeling rules:
     - Judge each comment independently. Do not compare to other comments you have labeled.
     - If the comment matches an anchor in type, label accordingly.
     - If unsure, label to the best of your ability and flag for review (if allowed) or just label and we'll catch disputes.
  - Prohibited: "Do not argue: 'if comment A is an attack, then comment B must be because it's similar.' Each comment stands alone against the definition and anchors."

  Adjudication Guide (for you):
  - For disputes:
     1. Check against anchors: if it matches an anchor, the correct label is that of the anchor, and the RA who disagreed made an error.
     2. Else, decompose into features (target, intent, severity, context) and apply rules from the manual.
     3. If still unclear, mark as borderline (penumbral).
  - Record: For each dispute, record: 
     - The label chosen (or borderline)
     - Reason (matched anchor X, or feature Y, or borderline)
     - If error, which RA erred.

  This should fit in two pages and be executable.
answer: |-
  ### Corpus Pragmatics Annotation Procedure: Sorites-Resistant Adjudication  
  Here’s a step-by-step procedure designed to handle boundary vagueness (the sorites paradox) while remaining actionable for undergrad RAs. It prioritizes **decision hygiene**, **audit trails**, and **stopping rules** to prevent boundary sliding. The core insight: treat vagueness as a *property of the world*, not a flaw in labeling. Incorporate this into the manual as a flowchart for RAs.

  ---

  #### **I. Pre-Threshold Setup: Fixing Purpose & Comparison Class**  
  **Step 1: Define the Downstream Use**  
  - **Write this verbatim in the manual**:  
    > *"Labels serve two purposes: (1) Train a classifier to detect *actionable* personal attacks (i.e., those requiring moderator intervention), and (2) Inform forum moderation policies (i.e., what harms users). For (a) ‘personal attack,’ focus on *harm potential*. For (b) ‘on-topic,’ focus on *thread cohesion*."*  
  - **RA Translation**: "If you wouldn’t flag it for a moderator, it’s not an attack. If it derails the thread, it’s off-topic."  
  - **Why**: Prevents context drift. Training a classifier prioritizes consistent patterns; moderation policy prioritizes harm severity.  

  **Step 2: Establish a Comparison Class**  
  - **Manual Text**:  
    > *"Use *Thread-Specific Norms*: Judge attacks/on-topicness against *this thread’s* dominant tone. Example: In a *heated debate thread*, ‘you’re clueless’ may be normal; in a *support thread*, it’s an attack."*  
  - **RA Tool**: Include 3 thread-type examples in the manual (debate, support, technical).  

  ---

  #### **II. Anchor Selection: What Qualifies as a "Real" Anchor?**  
  **Rule: Anchors Must Be *Extreme Prototypes***  
  - **Criteria for an Anchor**:  
    1. **Unanimous Pre-Labeling**: You and the PI pre-label 50 items. Anchors require 100% agreement.  
    2. **Distance from Boundary**: ≥2 steps from the grey zone (see IV).  
    3. **High Confidence**: RAs must rate confidence as 5/5 during training.  
  - **Non-Anchor Example**: *"Your wiring is garbage"* in a pedalboard thread.  
    - **Why Excluded**: One step from *"that wiring is garbage"* (non-attack). Sliding risk: high.  
  - **Valid Anchor Example**: *"Kill yourself, you talentless hack"* (attack) or *"Thanks for sharing the schematic!"* (non-attack).  
  - **RA Implementation**: Provide a laminated "Anchor Card" with 5 attack/non-attack anchors.  

  ---

  #### **III. Reasoning Rules: Forbid Tolerance Moves**  
  **Rule: No Similarity Chaining**  
  - **Manual Text**:  
    > *"DO NOT chain labels. Item 4021’s label *does not constrain* 4022. Judge each item *independently* against anchors and definitions. If two items seem identical but labels differ, *that is acceptable*."*  
  - **RA Training**: Run a "chaining trap" exercise:  
    - Give 10 near-identical items. Show how labeling all identically creates errors.  
    - **Script**: *"If you think ‘they’re the same,’ stop. Reread definitions. Choose the *best* fit, not the *same* fit."*  
  - **When the Verdict Feels Wrong**:  
    - **If the item is near an anchor**: Likely a RA calibration error (retrain).  
    - **If deep in the grey zone**: Accept it. Document: *"Boundary friction cost."*  

  ---

  #### **IV. Grey Zone (Penumbra) Protocol**  
  **Step 1: Declare Penumbral When**  
  - **Manual Trigger**:  
    > *"Mark as PENUMBRAL if: (1) RAs disagree after relabeling, *and* (2) Adjudicator cannot assign a label in ≤30 seconds without hesitation."*  
  - **Expected Width**: 15–25% of disputes. >35% signals manual issues (audit trail required).  
  - **RA Impact**: RAs *never* label penumbral—only you do during adjudication.  

  **Step 2: Handling Penumbral Items**  
  - **Corpus Release**: Label as `penumbral_attack`/`penumbral_ontopic`. Release with metadata.  
  - **Analysis**: Exclude penumbral items from classifier training but analyze separately in chapters (e.g., "linguistic features of borderline cases").  
  - **PI Sign-Off**: You own the call; PI audits 5% of penumbral items quarterly.  

  ---

  #### **V. Stopping Rule: Blocking Regress**  
  **Rule: Feature Thresholding**  
  - **Manual Text**:  
    > *"At adjudication, decompose items into *binary sub-features*. Assign labels by *majority vote of thresholds* (not severity scores). Stop when all sub-features are answered. Document thresholds used."*  
  - **Sub-Feature Examples for Personal Attacks**:  
    | **Feature**          | **Threshold** |  
    |----------------------|---------------|  
    | Target is a person?  | Y/N           |  
    | Hostile intent?      | Y/N           |  
    | In-group reclamation?| Y/N           |  
  - **Stopping Logic**:  
    - Attack = [Target=Y] + [Intent=Y] + [In-group=N]  
    - If sub-features conflict (e.g., [Intent=Y] but [In-group=Y]), item is penumbral.  
    - **No regress**: Sub-features are binary. No "grey" in thresholds.  

  ---

  #### **VI. Disagreement Test: Error vs. Borderline**  
  **Test: Anchor Proximity Check**  
  - **Procedure**:  
    1. If RAs disagree, *you* first label the item.  
    2. Check: Is the item ≤1 step from an anchor?  
       - **Yes** → Likely RA error (anchor misapplication). Retrain RAs on that anchor.  
       - **No** → Likely genuine borderline. Mark penumbral.  
  - **Track in Log**:  
    | Item | RA1 Label | RA2 Label | Adj. Label | Reason (Error/Borderline) |  
    |------|-----------|-----------|------------|---------------------------|  

  ---

  #### **Handling Multi-Dimensional Vagueness**  
  **Rule: Decompose, Don’t Aggregate**  
  - **Why**: Severity scores obscure *why* an item is vague. Sub-features expose ambiguity.  
  - **Example: Affectionate Mockery**  
    - Sub-features: [Target=Y], [Intent=Ambiguous], [Lexicon=Slur], [In-group=Y]  
    - Threshold: If [In-group=Y] + [Intent=Ambiguous], mark penumbral.  
  - **Cost**: Manual requires a sub-feature glossary (adds 1 page). Benefit: Auditability.  

  ---

  #### **Procedure in Action: Your Examples**  
  **Example 1: The Wiring Pair**  
  - **A**: *"that wiring is a crime"*  
  - **B**: *"that wiring is a crime, did you learn to solder from a youtube short"*  
  - **Context**: Pedalboard photo thread.  
  - **Sub-Features**:  
    - **Target**: A (N; targets wiring), B (Y; targets "you").  
    - **Intent**: A (Ambiguous; hyperbole), B (Y; mockery).  
    - **In-group**: Assume N (no history).  
  - **Threshold**: A = [Target=N] → Non-attack. B = [Target=Y] + [Intent=Y] → Attack.  
  - **Adjudication**: B is an attack; A is not. **You won’t like this** because they differ minimally, but the procedure *allows* this under Rule III. Log: *"Boundary friction: B’s added second clause crosses intent threshold."*  

  **Example 2: Clear Attack Near Grey Zone**  
  - **Item**: *"Your design is a disaster, like everything you touch."*  
  - **Test**: ≤1 step from anchor? Compare to anchor *"You’re a talentless hack"*:  
    - Difference: "disaster" vs. "talentless hack" (lexical severity).  
    - Verdict: **Not an anchor** (severity is a continuum; this is step 1). Use as training example but exclude from Anchor Card.  

  **Example 3: Reclaimed Slur in Banter**  
  - **Item**: *"You’re such a [reclaimed slur], lol"* between users with banter history.  
  - **Sub-Features**:  
    - Target=Y, Lexicon=Slur, Intent=?, In-group=Y.  
  - **Decomposition**:  
    - Pre-set rule: If [Lexicon=Slur] + [In-group=Y], defer to [Intent].  
    - Intent threshold: Presence of humor markers (e.g., "lol", emoji) → Non-attack.  
  - **Adjudication**: Non-attack. But if RAs disagree on intent, mark penumbral.  

  ---

  #### **What This Procedure Can’t Do**  
  1. **Salvage Existing 12k Labels**:  
     - **Status**: Contaminated by tolerance chaining and anchor drift.  
     - **Path Forward**:  
       - **Keep**: Agreed-upon labels where both RAs had 95%+ accuracy on anchors during spot checks.  
       - **Redo**: All disputed items (adjudicate with this procedure).  
       - **Audit**: Random 5% of agreed items using new anchors; relabel if >10% mismatch.  
     - **Cost**: Redo ≈40% of labels (disputes + audited agreed). Cheaper than full relabel.  

  2. **Other Limitations**:  
     - **Subjectivity in Sub-Features**: Some vagueness migrates to thresholds (e.g., "hostile intent"). Mitigation: Document thresholds *explicitly* (e.g., *"hostile intent = no humor markers + negative emotion words"*).  
     - **Cultural Blind Spots**: Won’t capture unstated forum norms. Mitigation: Add "norm violation" sub-feature (e.g., *breaks thread-specific rule*).  
     - **RA Turnover**: Requires 2-hour training with anchor exercises.  

  ---

  #### **Final Checklist for Your Manual**  
  - [ ] Anchor Card (5 attack/non-attack examples, PI-approved).  
  - [ ] Sub-Feature Glossary (binary thresholds for attack/on-topic).  
  - [ ] RA Script: *"When items seem similar, STOP. Reread anchors. Label independently."*  
  - [ ] Adjudication Log Template (with error/borderline tracking).  
  - [ ] PI Agreement: You own threshold calls; PI signs off on anchors and audit samples.  

  This procedure makes sorites-driven vagueness explicit, contains it in the penumbra, and forces deterministic stops. It won’t eliminate tough calls—but it will make them defensible to reviewers. For your Chapter 3: Use penumbral cases as data, not noise.
