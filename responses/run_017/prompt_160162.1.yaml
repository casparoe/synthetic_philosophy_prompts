prompt: |-
  I spent most of last evening arguing with a friend about whether any empirical science could ever tell us what an experience is like, and we ended in a stand-off that I now think was really about a practice rather than a theory. My friend's side was the familiar one: there is something it is like to see red; that something is, supposedly, intrinsic to the experience, available only from the inside, and in principle detachable from anything behavioural, functional or physical — hence the inverted-spectrum worry, that a creature could match me in every physical and functional respect while my red and green are swapped, and hence too the worry that complete physical and functional knowledge would still leave something out. I could not refute it. What I kept insisting instead is that there is a mature, technologically successful science that behaves as if the worry were empty, and neither of us could say precisely what that science is committed to. I would like you to reconstruct its implicit theory of experience.

  The practice is psychophysics, and the colour and hearing sciences that grew out of it. As I understand it, it has these features.

  First, it does not, in the first instance, ask subjects to introspect and report qualities. It asks them to discriminate, match and order: say whether two patches differ; adjust a comparison field until the two look identical; say which of two tones is louder; rate how similar two odours are. From judgements like these — largely forced choices, and largely about stimuli rather than about experiences — the field constructs a space: a small number of dimensions, a metric, a distance function. In colour, three matching dimensions, a chromaticity diagram, and then a re-scaled space in which equal distances are supposed to be equally noticeable, plus formulae for colour difference used in industry. In hearing, equal-loudness contours. In olfaction and taste, multidimensional scalings of similarity ratings. The dimensions are then labelled with the names of qualities, and the space is treated as a map of experience.

  Second, the practice pulls in two directions at once. On the one hand it denies that matching is identity of the stimulus: two lights with quite different spectra can match, and the same patch shifts in appearance with the surround and with the observer's state of adaptation, which is why colour-appearance models were later built on top of the matching space. On the other hand it treats matching and discrimination as constitutive: a difference no observer, under any adaptation or surround, can see is not a difference in colour; and the number of dimensions along which a subject can be made to discriminate is taken to be the number of degrees of freedom their colour experience has, so that a dichromat's colour experience is described as a two-dimensional space and a normal one as three-dimensional.

  Third, it aggregates across subjects. It fits smooth functions to pooled data, defines a standard observer, and treats individual variation as noise or as a parameter to be modelled rather than as something that threatens the enterprise. And it uses the resulting numbers for thoroughly practical ends — colour management across cameras, displays and presses, hearing-aid fitting, quality control in paint and food — where they plainly work.

  There is one further wrinkle: the field's own toolkit includes cases where discrimination and experience seem to come apart, since forced-choice performance can exceed what a subject will report seeing, and blindsight and related phenomena are standard fare in the surrounding literature. So the practice both relies on discrimination as its basic datum and possesses reasons to doubt that discrimination is experience.

  What I want from you is the implicit theory of consciousness, or of qualia, that this practice presupposes, and I would like it kept separate from what the practice merely fits well with.

  Does the practice presuppose something like a relational or quality-space view — that what an experience is like is nothing over and above its position in a network of similarity and difference relations to other experiences and to stimuli, so that a properly constructed quality space is not a proxy for qualia but a measurement of them? Or is the practice, strictly speaking, neutral: could someone who holds that qualia are intrinsic, private and ineffable accept every technique described above, on the grounds that the space maps the psychophysical link, or the stimuli, and never the qualia themselves?

  Which commitments are strictly required by the practice, and which are optional extras? In particular: does it require that indiscriminability behave like a distance — symmetric, transitive, additive — and if so what happens to it when it does not? Does it require that similarity relations be comparable across subjects, and what inside the practice is supposed to underwrite that comparability, given that its raw data are one person's forced choices at a time? Does it require that verbal reports reliably track similarity even if they do not track what it is like, and how does that sit with the rhetoric of privacy and ineffability?

  What does the practice rule out if we take it at its word? Does it entail that the inverted-spectrum hypothesis is empirically empty, on the grounds that no measurement the field could make distinguishes the two subjects? Does it entail that any difference in experience unaccompanied by a difference in discrimination, matching, report, or downstream use is no difference at all? Does it entail that the residue in the Mary-style case is either an illusion or a species of ability?

  Where is the practice underdetermined — which of its features could the intrinsic-qualia theorist and the relationalist both endorse while giving different readings of them? Metamerism looks like a case in point: one side will say it shows the field has given up on the stimulus and is in the business of appearances, the other that it shows appearance just is the equivalence class. Say who has the better reading of what the practice actually does, and whether the practice settles the matter at all.

  Finally, what would have to change in the practice if the intrinsic-qualia view were true and psychophysicists took it seriously? Would they have to abandon forced-choice discrimination as the basic datum, stop pooling across subjects, stop treating the number of discriminable dimensions as the number of degrees of freedom of experience, or add some independent calibration of introspective report? And conversely, if the relational view is right, is there anything the practice currently does that it ought to stop doing — the standard observer, the pooling, the labelling of dimensions as though they named something intrinsic?

  One constraint: I have no library access and I do not want a literature survey, a reading list or citations, and I would rather you did not lean on the names attached to these views. Reconstruct the theory from the practice as I have described it, tell me which parts of it are forced and which are merely convenient, and say where a rival theory would license exactly the same procedure.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about whether empirical science can tell us what an experience is like, focusing on qualia and the inverted spectrum thought experiment. The user's friend argues that subjective experience is intrinsic and inaccessible objectively, while the user points to psychophysics as a field that operates as if this worry is irrelevant. The user wants to understand the implicit theory of consciousness in psychophysics, separate from what it might just be compatible with.

  First, I need to recall the core practices of psychophysics: discrimination, matching, ordering. These methods avoid introspection and rely on behavioral responses. The user mentions constructing quality spaces from these data, like the chromaticity diagram in color vision. The key here is that these spaces are built from relational data—similarities and differences—not direct reports of experience.

  The user’s main questions revolve around whether psychophysics presupposes a relational view of qualia or if it’s neutral. They also ask about the commitments required by the practice, like the properties of indiscriminability (symmetry, transitivity, additivity), and how aggregation across subjects affects comparability of experiences. Additionally, they wonder if the practice rules out inverted spectra or necessitates that any experiential difference must manifest behaviorally.

  I should start by identifying the non-negotiable elements of psychophysics. The reliance on discrimination and matching as constitutive of experiential differences seems fundamental. If two stimuli can’t be discriminated under any conditions, they’re considered the same experience. This implies that indiscriminability is the basis for identity. But what about cases where discrimination isn’t transitive? The user mentions asymmetric matching in color or loudness. The practice deals with this by using thresholds and models like CIE LAB, which adjust for perceptual non-linearities. So the practice doesn’t require perfect mathematical properties but uses models that approximate them.

  Next, aggregation across subjects. The standard observer model treats individual variations as noise, implying a common experiential structure. This suggests that the practice assumes intersubjective comparability based on shared neural or functional mechanisms. The intrinsic qualia theorist might argue that the map is only of stimuli or neural states, not qualia themselves. But the practice labels dimensions with qualitative terms (red-green axis), which only makes sense if they’re mapping experiences. So while the intrinsic view could technically accept the methods, it would interpret the results differently, seeing the space as a correlation rather than the qualia themselves.

  Regarding verbal reports, psychophysics uses them for similarity ratings but doesn’t prioritize them over forced-choice tasks. This implies that reports are treated as behavioral data, not direct access to qualia. The practice can accommodate blindsight by distinguishing between discrimination and report, showing that it’s not committed to reports being infallible.

  For the inverted spectrum, psychophysics would see it as empirically empty because all measurements (discrimination, matching) would be identical. The practice entails that any undetectable difference isn’t a difference in experience. This challenges the intrinsic view but doesn’t refute it; it just makes it irrelevant to the science.

  Metamerism is a key point. The relational view sees it as defining equivalence classes of stimuli that produce identical experiences. The intrinsic view might say it shows that different stimuli can cause the same quale. But the practice treats metamers as the same color, supporting the relational interpretation that experience is defined by the relations.

  If intrinsic qualia were true and taken seriously, psychophysicists might need direct introspection calibrations, but that’s not feasible. They’d still rely on behavior because that’s what’s measurable. Conversely, if relationalism is true, the current practices are justified as directly measuring qualia.

  The user’s deeper need seems to be resolving the stand-off by showing that psychophysics operates on a relational framework, making intrinsic qualia irrelevant to the science. They want validation that the practice implies a specific ontology without philosophical baggage.
answer: |-
  Based solely on the practice you describe, psychophysics implicitly endorses a **relational, functional, and intersubjectively accessible theory of conscious experience**. Here's the reconstruction, isolating the non-negotiable commitments from the convenient tools:

  ### Core Commitments (The Practice Cannot Work Without These)
  1.  **Discriminative Capacity as Constitutive:** The practice *requires* that differences in conscious experience *must* manifest as differences in discriminative capacity under *some* conditions. If no possible psychophysical test (discrimination, matching, ordering, similarity judgment) can reveal a difference between two stimuli/states, the practice treats them as having *identical* experiential character. This is not merely epistemic (we can't tell) but constitutive (there is no difference). The inverted spectrum is empirically empty *by definition* within this practice.
  2.  **Experience as Defined by Relations:** What an experience "is like" is exhaustively determined by its position within a relational structure. This structure is defined by:
      *   **Indiscriminability/Equivalence Classes:** Metamers define sameness of experience despite physical difference.
      *   **Ordering/Distance:** Discriminable differences define axes and distances (e.g., just-noticeable differences, similarity ratings).
      *   **Dimensionality:** The number of independent discriminable dimensions defines the degrees of freedom of the experiential modality (e.g., trichromacy vs. dichromacy).
  3.  **Intersubjective Comparability is Assumed:** The practice *requires* that the relational structure (similarity, difference, ordering) is comparable across subjects. Pooling data, defining a standard observer, and applying results universally (e.g., colour management standards) only make sense if:
      *   The *structure* of the quality space (dimensionality, topology, major axes) is fundamentally shared across neurologically normal subjects.
      *   Individual variations (e.g., slight shifts in peak sensitivity, scaling factors) are quantitative deviations within this shared structure, not qualitative incommensurability. The "labeling of dimensions" (red-green, blue-yellow, loudness, pitch) presupposes this shared relational framework is accessible and comparable.
  4.  **Functionalism about "What It's Like":** The practice treats the *functional role* of a state within the discriminative system (its relations to stimuli, behaviour, and other states) as constitutive of "what it is like." Knowing the complete functional/discriminative profile *is* knowing the experiential character. The "residue" in the Mary case is interpreted as the acquisition of new discriminatory abilities/knowledge-how tied to specific sensory modalities.
  5.  **Verbal Reports as Behavior:** Introspective reports (e.g., similarity ratings, magnitude estimations) are treated as *behavioural data points* to be modeled, not as privileged, direct revelations of private qualia. Their reliability is contingent and subject to the same constraints as other discrimination tasks. Blindsight doesn't refute the core; it merely shows that discrimination can sometimes occur without reportable experience, highlighting that *report* is a specific behavioral capacity separable from discrimination *per se*, but the core datum remains discriminative capacity *in general*.

  ### Convenient Tools & Modeling Assumptions (Compatible with Rival Views)
  1.  **Metric Properties:** The practice doesn't *require* indiscriminability to be perfectly symmetric, transitive, or additive. It *models* it as such (e.g., CIELAB space) for practical utility and mathematical tractability. When it fails (e.g., asymmetric matching, context effects), more complex models (e.g., colour appearance models like CIECAM) are built *on top of* the core relational structure defined by matching/discrimination. The core commitment is the relational structure, not a specific metric.
  2.  **The Standard Observer:** While aggregation presupposes intersubjective comparability of structure, the *specific choice* of a smooth, idealized standard observer is a pragmatic tool for engineering applications. It doesn't deny individual variation; it averages it *within the assumed shared framework*. An intrinsic-qualia theorist could accept this as mapping "average psychophysical links," not experiences themselves.
  3.  **Labeling Dimensions:** Assigning names like "redness" or "loudness" to dimensions is a convenient heuristic based on prototypical stimuli and reports. The practice could function with abstract labels (Dimension 1, Dimension 2). The intrinsic-qualia theorist sees the label as pointing to the private quale *caused* by activity on that dimension; the relationalist sees the label as naming the functional role defined by that dimension.

  ### Where Practice is Underdetermined & Rival Readings
  *   **Metamerism:**
      *   **Relationalist Reading:** Metamerism *defines* colour experience: "Red experience" *just is* the equivalence class of all stimuli indiscriminable from a prototypical red stimulus under specified conditions. The space *is* the map of experience.
      *   **Intrinsic-Qualia Reading:** Metamerism shows that *different physical causes* can produce the *same intrinsic quale*. The space maps the stimuli/neural states that reliably *cause* specific qualia, not the qualia themselves. The quale remains private.
      *   **Practice's Primacy:** The practice *behaves* relationally. It treats metamers as *identical in colour experience* for all practical purposes (matching, reproduction, standards). The intrinsic reading adds an unnecessary extra layer (the private quale) that plays no role in the methodology or success of the applications. The relational reading provides the more parsimonious account of what the practice *actually does and achieves*.

  ### What the Practice Rules Out (If Taken Seriously)
  1.  **Inverted Spectra (Undetectable):** It rules them out as empirically meaningless. If two systems (human or artificial) are functionally identical in all discriminative, matching, and behavioral capacities related to colour, they *have* the same colour experiences by definition within the practice.
  2.  **Purely Private Differences:** Any purported difference in "what it's like" that *cannot* manifest as a difference in discrimination, matching, ordering, similarity judgment, or any downstream behavioral capacity *is not a difference* recognized by the practice. It treats such claims as either false, confused, or irrelevant to the science of sensory experience.
  3.  **Ineffability as Inaccessibility:** While experiences may be hard to describe linguistically ("ineffable" in a weak sense), the relational structure defining "what it's like" *must* be intersubjectively accessible via behavioral methods. Strong ineffability (the quale itself is fundamentally beyond any relational characterization) is incompatible with the core practice.

  ### What Would Change If Intrinsic Qualia Were Taken Seriously?
  Psychophysics, as described, would become **impossible or unrecognizable**:
  1.  **Discrimination as Basic Datum Abandoned?:** They couldn't treat discrimination/matching as constitutive of experience. They would need a fundamentally new method to access the private quale directly. Forced-choice tasks would be seen as mapping only the *causal precursors* or *behavioral outputs* of qualia, not qualia themselves.
  2.  **Pooling Across Subjects Halted?:** Aggregation would become deeply problematic. If qualia are truly private and intrinsic, comparing them across subjects or defining a standard observer loses its meaning. The practice would fracture into studying individual psychophysical links to private worlds.
  3.  **Dimensionality Reinterpreted?:** The number of discriminable dimensions might not map to the "degrees of freedom" of the quale itself. The quale might have intrinsic properties not captured by the relational network.
  4.  **Calibration of Introspection Required?:** They would need a rigorous, independent way to calibrate introspective reports against the "true" private quale to validate their methods – a task with no apparent solution and contrary to the practice's avoidance of raw introspection as primary data.
  5.  **Practical Success Unexplained?:** The remarkable success in applications (colour management, etc.) would become a profound mystery. If the relational space doesn't map the experience itself, why does engineering based *only* on that space work so well for coordinating human experience across contexts?

  ### What Would Change If Relationalism Were True?
  The practice **wouldn't need to change at all**. Its core methods *are* the methods for measuring relational qualia. The standard observer and pooling are justified as capturing the shared functional structure of human experience. Dimension labeling is a useful shorthand for functional roles. Blindsight and discrimination without report are interesting boundary cases within the functional system, not challenges to the core ontology.

  **In essence:** Psychophysics, by its foundational methods and its overwhelming practical success, implicitly treats conscious sensory qualities ("what it's like") as *relational properties defined by discriminative capacities within a shared functional structure*. This is not just a convenient stance; it's the necessary ontological commitment that makes the entire enterprise coherent and successful. The intrinsic-qualia theorist can only interpret the practice as mapping something *other* than experience itself (stimuli, neural states, behavioral dispositions), but this renders the practice's core claims about *experience* (e.g., "dichromats have 2D colour experience") unexplained and its practical coordination of human experience miraculous. The relational reading provides the direct, coherent, and successful interpretation.
