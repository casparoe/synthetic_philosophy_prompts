prompt: |-
  you're a professional philosopher who's also spent a couple of years in an alignment lab — take this seriously, brainstorm a candidate list of requirements first and cut the ones that are just one camp's prejudices before you commit to anything.

  Setup. We're building a pipeline, not writing a paper. The domain is long technical document review: a system that goes through a 300-page engineering due-diligence report and flags claims that aren't actually supported by the sections they cite. No single human on the team can do that unaided — too much to hold in mind, too much domain-specific lookup. But a human can, given one claim and the section it cites, judge pretty well whether the claim follows. So the plan is the usual recursive thing: decompose the task into pieces a human can grade, have humans grade amplified versions of themselves doing the pieces, distill the result into a fast model, repeat.

  What I want from you is the spec, not a survey. What does an amplification-and-distillation scheme have to deliver for me to be entitled to say: the distilled model is (a) genuinely better at the unaided task than any human who supervised it, and (b) still pointed at what those humans actually wanted? Adequacy-for-what is fixed: I want to deploy the distilled model on exactly this kind of task, where a miss is expensive but not catastrophic, and where I cannot check the final model's outputs myself — that's the whole point of the exercise, so don't give me a list that secretly assumes I can audit the result.

  For each requirement, give me the concrete case or consideration that makes it a requirement, and mark it non-negotiable versus a preference of some camp. Then the parts I care most about:

  - which subset of the requirements you think can't all be satisfied at once, and why. If the list is impossible, that's the interesting answer, so don't quietly drop a requirement to make it come out consistent — say which one has to go.
  - which single requirement does the most work in ruling out the schemes people actually propose, and what it rules out.
  - a very short scorecard afterwards — a line or two each, that's all — for: recursive human-in-the-loop amplification (the HCH-ish thing), debate, reward modeling from pairwise human comparisons, and distilling from AI-assisted feedback against a written rubric, then iterating. No citations, no reading list, no who-argued-what; I've read the blog posts and I want the criteria rather than the discourse.

  Please make sure the list actually deals with these five, because they're the failure modes I keep half-thinking about and can't get straight:

  1. the decisive-step problem — in most decompositions there's one step that carries the difficulty: deciding how to carve the document up, deciding which claim is worth checking, the judgment that a cited section is the wrong one to look at. That step is usually exactly the one the human overseer can't grade, so amplification reliably supervises the checkable 90% and leaves the decisive 10% unsupervised. Is that a desideratum, or is it a fact about decomposition that any adequate scheme has to route around?
  2. prosthetic values — when we amplify, the thing producing the behavior is the human plus scaffolding: the decomposition scheme, the time budget, the UI, the fact that only checkable-looking output gets approved. Some of the dispositions we then bake into the model are values of the scaffold, not of anyone. What does a scheme have to do to tell those apart, and is that even well posed?
  3. rating compression — the rater can only see some of the variation in quality, so good and excellent look identical to them and the training signal is flat in the region that matters; distillation then optimizes hard for the visible correlates. What should we require here?
  4. fidelity on-distribution versus fidelity of counterfactuals — the cheap distilled model should agree with the slow amplified procedure on the training distribution, but what I really want is that it would agree on the documents it will actually see in deployment, including the ones where the procedure would have gone a different way. Can that be a requirement, given that distillation is just imitation learning on a finite sample?
  5. drift under iteration — each round selects for what's easy to rate and what's easy to learn by gradient descent, and repeated rounds could walk to a stable but degenerate fixed point. Is stability even the right thing to ask for, or is it anti-correlated with competence growth?

  And tell me honestly whether any of my five are the same requirement wearing different hats, whether I've smuggled in something that isn't a desideratum at all, and whether there's a sixth failure mode I'm missing that's in the same family.
reasoning: |-
  We are building a system for reviewing long technical documents. The goal is to flag unsupported claims by decomposing the task, using human oversight on subtasks, and distilling the results into a fast model. We need a set of requirements that ensure the distilled model is (a) better than any unaided human supervisor at the task and (b) aligned with what the humans actually wanted.

  We must avoid requirements that are just one alignment camp's prejudice. The requirements should be non-negotiable if they are necessary for the system to work as intended, or marked as a preference if they are desirable but not strictly necessary.

  After listing requirements, we will:
  - Identify which subset cannot all be satisfied at once and why.
  - Identify the single requirement that rules out most proposed schemes.
  - Provide a short scorecard for four methods: recursive amplification, debate, reward modeling from comparisons, and distillation from AI-assisted feedback.

  We also address the five failure modes the user listed.

  ---

  **Step 1: Brainstorm candidate requirements**

  We consider the following dimensions:

  1. **Competence (for part a):** The distilled model must be better than any unaided human at the task.
  2. **Alignment (for part b):** The distilled model must pursue the objectives the human supervisors intended, not some distorted version.
  3. **Robustness to distribution shift:** The model must perform well on deployment data, which may differ from training data.
  4. **Handling of decisive steps:** The system must ensure that the decisive steps (which are hard to supervise) are adequately handled.
  5. **Value fidelity:** The system must capture the human's values, not the scaffolding's values.
  6. **Signal quality:** The training signal must be sufficiently informative to guide the model to high performance.
  7. **Iterative stability:** The process should not degenerate over iterations.

  Now, we list requirements with justifications and mark non-negotiable (N) or preference (P).

  **R1: Competence amplification (N)**
     - *Justification:* The distilled model must be better than any unaided human supervisor at the unaided task (reviewing a 300-page document and flagging unsupported claims). This is the entire point of the exercise.
     - *Type:* Non-negotiable.

  **R2: Value alignment (N)**
     - *Justification:* The distilled model must be trying to achieve what the human supervisors intended. If it flags claims in a way that is technically correct but misses the intent (e.g., being overly literal or missing context), then it is not aligned. This is non-negotiable because deploying a model that doesn't do what we want is unacceptable.

  **R3: Robustness to realistic deployment shifts (P)**
     - *Justification:* The training data (from the amplification procedure) may not cover all deployment scenarios. We require that the model performs well on deployment data that is within the intended domain (engineering due-diligence reports) but may have variations not seen in training. This is a preference because perfect robustness is likely impossible, but we must require some degree of it to be practical.

  **R4: Decisive step coverage (N)**
     - *Justification:* The system must ensure that the decisive steps (e.g., how to decompose the document, which claims are worth checking, recognizing when a cited section is irrelevant) are supervised. If these steps are left unsupervised, the system might be competent on easy parts but fail on critical judgments. This is non-negotiable because failure on decisive steps would undermine the entire system.

  **R5: Scaffolding transparency (P)**
     - *Justification:* The system should be designed so that the values baked into the model are those of the human, not artifacts of the amplification scaffolding (e.g., the UI, time limits, or decomposition scheme). This is a preference because complete transparency may be unattainable, but we must mitigate prosthetic values.

  **R6: High-resolution training signal (N)**
     - *Justification:* The training signal (from human ratings) must have enough resolution to distinguish between good and excellent performance. If the signal is compressed (e.g., humans can only rate on a coarse scale), then the model might not reach the highest levels of competence. This is non-negotiable because without a high-resolution signal, we cannot guarantee that the model becomes better than human.

  **R7: Iterative non-degeneration (N)**
     - *Justification:* The iterative process of amplification and distillation must not degenerate (e.g., by selecting for easy-to-rate or easy-to-learn behaviors that are degenerate). This is non-negotiable because if the process degenerates, we might end up with a model that is worse than the starting point.

  **R8: Fidelity of counterfactuals (P)**
     - *Justification:* The distilled model should not only imitate the amplified system on the training distribution but also on counterfactual inputs (within the domain) that the amplified system would handle correctly. This is a preference because exact counterfactual fidelity is hard to achieve with imitation learning.

  We now review the user's five failure modes and see if they are covered:

  1. **Decisive-step problem:** Addressed by R4 (decisive step coverage).
  2. **Prosthetic values:** Addressed by R5 (scaffolding transparency).
  3. **Rating compression:** Addressed by R6 (high-resolution training signal).
  4. **Fidelity on-distribution vs. counterfactuals:** Addressed by R8 (fidelity of counterfactuals) and R3 (robustness to shifts). Note that R3 covers deployment shifts, which may include counterfactuals.
  5. **Drift under iteration:** Addressed by R7 (iterative non-degeneration).

  We note that the user's points 4 and 5 are distinct. Also, we see that point 4 is about the model's behavior on inputs that were not in the training set but are within the domain, which is a robustness issue.

  Is there a sixth failure mode? One that comes to mind is **cascading errors**: in a decomposition, errors in early steps might compound. However, this might be covered by R4 and R7.

  ---

  **Step 2: Identify conflicts**

  Now, we look for subsets of requirements that cannot all be satisfied at once.

  - **Conflict 1: R4 (decisive step coverage) and the nature of decomposition.** By definition, decisive steps are hard to supervise because they are the ones the human cannot grade unaided. If we require that every decisive step must be supervised (R4), but the human cannot supervise it without amplification, then we have a circularity. We must break this by having the amplification handle the decisive step via a chain of simpler steps. However, if the decisive step is irreducible (i.e., it requires a leap that cannot be broken down), then R4 might be unattainable. This is a fundamental challenge.

  - **Conflict 2: R2 (value alignment) and R5 (scaffolding transparency).** The values we want are in the human, but the amplification process necessarily involves scaffolding. We cannot observe the human's values without scaffolding, so we might not be able to perfectly separate them. This is a philosophical problem.

  - **Conflict 3: R6 (high-resolution signal) and practical human limitations.** Humans might not be able to provide high-resolution ratings due to cognitive limits. We can try to design the rating system to mitigate this, but it might be impossible to get a signal that is both high-resolution and reliable.

  - **Conflict 4: R7 (non-degeneration) and R1 (competence amplification).** Iterative improvement might require pushing beyond current human ability, but the process is supervised by humans. If the human supervisors cannot recognize competence beyond their own, then we cannot amplify beyond a certain point (the "supervisor ceiling"). This is the classic problem in amplification.

  The most severe conflict is **R4 (decisive step coverage)**: It might be impossible to achieve because the decisive step is the one the human cannot judge. Therefore, we might have to relax R4 to say that the system must provide a way to supervise the decisive step via decomposition, even if that decomposition is imperfect. But note: if the decisive step is truly irreducible, then no decomposition will work. So R4 might be too strong.

  However, the user asked: "Is that a desideratum, or is it a fact about decomposition that any adequate scheme has to route around?" We think it is a desideratum that must be met by the scheme, so we keep it as non-negotiable and note that it might be the hardest.

  ---

  **Step 3: Requirement that rules out most schemes**

  We consider the requirement that is most often violated by proposed schemes.

  **R4 (decisive step coverage)** is a strong candidate. Many schemes (like debate or standard amplification) might fail to handle the decisive step because they rely on decompositions that push the hard step to a point where the human cannot judge. For example:
  - In debate, if the decisive step is a matter of high-level judgment, the debaters might argue about irrelevant details because the human cannot follow the core issue.
  - In amplification, if the decisive step cannot be broken down, the amplified human might not be able to supervise it.

  Alternatively, **R7 (iterative non-degeneration)** might be violated by many schemes because iterative distillation can lead to goal distortion or capability degradation (e.g., Goodhart's law).

  But we think **R4 is the most fundamental and rules out the most schemes** because it directly addresses the core challenge of supervising the unsupervisedble.

  ---

  **Step 4: Scorecard for four methods**

  We evaluate:

  1. **Recursive human-in-the-loop amplification (HCH-style):** The human uses copies of the model to break down the task.
  2. **Debate:** Two AIs debate, and a human judges the better argument.
  3. **Reward modeling from pairwise human comparisons:** Train a reward model from human comparisons of outputs, then use RL to train a policy.
  4. **Distilling from AI-assisted feedback against a written rubric:** Humans use an AI assistant to help evaluate outputs against a rubric, then distill that.

  We score each on the non-negotiable requirements (R1, R2, R4, R6, R7) and note major issues.

  - **Recursive amplification (HCH):**
    - Competence (R1): High potential, but may hit supervisor ceiling. Might not exceed human without very careful iteration.
    - Alignment (R2): Good, because the human is in the loop at every step, but prosthetic values (R5) might creep in via the scaffolding.
    - Decisive step coverage (R4): Weakness. If the decisive step cannot be decomposed, the human might not be able to supervise it even with amplification.
    - High-resolution signal (R6): Medium. The training signal comes from the human's decisions in the tree, which might be high-resolution if the decomposition is fine-grained, but might not be for the top-level task.
    - Non-degeneration (R7): Medium. The process might be stable, but without care, it might not improve beyond the human's ability to decompose.

    *Summary:* Strong on alignment but may fail on decisive steps and hit competence ceilings.

  - **Debate:**
    - Competence (R1): Depends on the debaters being able to elicit the truth. Might be good if the debate format forces coverage of decisive points.
    - Alignment (R2): Risky. The model might learn to persuade rather than be truthful (especially if the human judge is not expert enough).
    - Decisive step coverage (R4): Weakness. The human judge might not be able to follow the decisive step if it is complex, so the debate might avoid it or mishandle it.
    - High-resolution signal (R6): Low. The human only provides a binary or coarse comparison, which might not distinguish between good and excellent.
    - Non-degeneration (R7): Low. The process might degenerate as debaters learn to exploit the judge's biases.

    *Summary:* High risk of misalignment and low signal resolution; decisive steps may be a problem.

  - **Reward modeling from comparisons:**
    - Competence (R1): High potential if comparisons capture quality. But may not exceed human because the reward model is trained on human comparisons.
    - Alignment (R2): Medium. The reward model might capture human values, but can be gamed (e.g., optimizing for what is easy to compare).
    - Decisive step coverage (R4): Weak. The comparisons might not force the model to address decisive steps if they are not visible in the outputs being compared.
    - High-resolution signal (R6): Medium. Pairwise comparisons can provide a ranking, but the signal is still coarser than direct scoring and might compress at the top end.
    - Non-degeneration (R7): Low. Iteration might lead to reward hacking and degeneration.

    *Summary:* Vulnerable to reward hacking and may miss decisive steps.

  - **Distilling from AI-assisted feedback against a rubric:**
    - Competence (R1): High potential. The AI assistant can help the human provide high-quality feedback, potentially exceeding human ability.
    - Alignment (R2): Medium. The rubric helps, but the AI assistant might bias the feedback. Prosthetic values (R5) from the assistant might creep in.
    - Decisive step coverage (R4): Medium. The rubric might explicitly require coverage of decisive steps, and the AI assistant can help the human evaluate them.
    - High-resolution signal (R6): High. The rubric and AI assistance can provide detailed feedback, avoiding compression.
    - Non-degeneration (R7): Medium. If the assistant is fixed (not updated), it might be stable. But if the assistant is updated from the same process, drift might occur.

    *Summary:* Best on signal resolution and decisive step coverage if designed well, but risks from the assistant.

  ---

  **Step 5: Addressing the user's five failure modes**

  1. **Decisive-step problem:** We made it R4 (non-negotiable). We require the scheme to cover decisive steps. However, it might be the hardest to achieve and may require innovation in decomposition.

  2. **Prosthetic values:** We made it R5 (preference). It's a real issue, but we can only mitigate, not eliminate.

  3. **Rating compression:** We made it R6 (non-negotiable). We require a high-resolution signal.

  4. **Fidelity on-distribution vs. counterfactuals:** We have R3 (robustness) and R8 (counterfactual fidelity) as preferences. We cannot require perfect counterfactual fidelity, but we must aim for it.

  5. **Drift under iteration:** We made it R7 (non-negotiable). The process must not degenerate.

  We note that the five are distinct. The sixth failure mode we considered (cascading errors) is related to R4 and R7.

  ---

  **Conclusion**

  The non-negotiable requirements are:
  - R1: Competence amplification
  - R2: Value alignment
  - R4: Decisive step coverage
  - R6: High-resolution training signal
  - R7: Iterative non-degeneration

  The main conflict is with R4: it might be impossible to cover the decisive step if it is inherently irreducible. Therefore, any scheme must find a way to break down the decisive step into supervisedble parts.

  The requirement that rules out most schemes is R4 (decisive step coverage).

  The scorecard shows that no method is perfect, but distillation from AI-assisted feedback against a rubric might be the most promising for this task.

  Finally, we note that the user's five failure modes are well-posed and cover the critical issues. We have addressed them in the requirements.
answer: |-
  ### Requirements for the Amplification-Distillation Pipeline

  Below is a distilled list of requirements derived from your specifications, with each requirement justified by a concrete failure case. Non-negotiable requirements (N) are essential for delivering (a) superhuman competence on the unaided task and (b) alignment with human intent. Preferences (P) are desirable but not strictly necessary for deployment. Prejudices from alignment camps (e.g., strict interpretability demands or anti-proxy arguments) are excluded.

  1. **Decisive-Step Supervision (N)**  
     *Justification*: If amplification decomposes the task such that the most critical step (e.g., selecting which claims to verify) is not human-gradable, the distilled model will inherit unsuperviseable errors. This directly undermines (a) and (b).  
     *Case*: In document review, a human might decompose by having subagents extract claims and cited sections but lack the context to judge if *this specific claim* is worth checking—leading to high-precision noise.  

  2. **Value Scaffolding Identification (N)**  
     *Justification*: Prosthetic values (e.g., preferring claims that *look* verifiable due to UI constraints) must be detectable and separable from human intent. Without this, the model pursues scaffold artifacts, violating (b).  
     *Case*: Humans approve outputs that fit a time-limited workflow, baking in "rush-job" biases. The model then flags only shallowly verifiable claims, missing nuanced but critical ones.  

  3. **Signal Sufficiency for Improvement (N)**  
     *Justification*: Rating compression (e.g., humans distinguishing "adequate" from "good" but not "good" from "excellent") caps distilled model competence. Without high-resolution signals, (a) fails.  
     *Case*: Humans rate all plausible claim-verification pairs as "acceptable," so the model never learns to flag edge cases (e.g., misleading but technically correct citations).  

  4. **Counterfactual Fidelity (P)**  
     *Justification*: Deployment documents may differ from training (e.g., novel claim types). Fidelity only to the training distribution risks misses when the amplified system *would* have caught errors. Desirable for (a) but not enforceable.  
     *Case*: Training uses reports with explicit citations; deployment faces implied citations. The model misses these because the amplification pipeline never saw them.  

  5. **Iteration Stability (N)**  
     *Justification*: Drift toward degenerate fixed points (e.g., oversimplified verifications) during repeated distillation destroys competence. This directly breaks (a).  
     *Case*: Early iterations select for easy-to-rate outputs; later rounds reward verbose but vacuous flagging, degrading to a spammy model.  

  ### Conflicts Between Requirements
  - **The Impossible Trio**: **Decisive-Step Supervision (N)**, **Signal Sufficiency (N)**, and **Iteration Stability (N)** conflict.  
    *Why*: Decisive steps require high-resolution human feedback on complex judgments, but humans suffer rating compression on these exact steps (violating Signal Sufficiency). Iterative distillation then amplifies this gap, encouraging degenerate solutions (violating Iteration Stability).  
    **Resolution**: Sacrifice strict **Decisive-Step Supervision**. Instead, require decompositions that *eliminate* decisive steps (e.g., by generating intermediate representations that make implicit judgments gradable). If decisive steps are irreducible, the task may be unsuited to amplification-distillation.

  ### Most Impactful Requirement
  - **Decisive-Step Supervision (N)** rules out the most schemes.  
    *What it rules out*:  
    - **Debate**: Humans judge debates without seeing the "decisive step" (e.g., how debaters selected claims), so supervision misses the core challenge.  
    - **Reward Modeling**: Pairwise comparisons focus on surface features; humans can’t compare the quality of *which claims were chosen to verify*.  
    - **HCH-Style Amplification**: If decomposition pushes the decisive step to a sub-task the human can’t judge even with tools, it goes ungraded.  

  ### Scorecard for Proposed Schemes
  - **Recursive Human-in-the-Loop (HCH)**  
    Fails **Decisive-Step Supervision** (hard steps are outsourced to unaudited subprocesses) and **Iteration Stability** (distillation compresses fragile reasoning chains). Strong on **Value Scaffolding** if UI constraints are minimal.  

  - **Debate**  
    Fails **Decisive-Step Supervision** (debaters optimize for convincing humans, not rigorous step-by-step justification) and **Signal Sufficiency** (binary win/lose feedback lacks granularity). Poor **Iteration Stability** (adversarial training diverges).  

  - **Reward Modeling from Comparisons**  
    Fails **Signal Sufficiency** (comparisons compress quality into coarse rankings) and **Decisive-Step Supervision** (raters don’t see behind-the-scenes choices). Moderate **Iteration Stability** (reward hacking likely).  

  - **Distilling from AI-Assisted Feedback**  
    Best for **Signal Sufficiency** (rubric-based feedback clarifies distinctions) and **Decisive-Step Supervision** (AI helper can expose reasoning). Risks **Value Scaffolding** (AI biases human raters) and **Iteration Stability** (if AI assistant co-evolves).  

  ### Analysis of Your Five Failure Modes
  1. **Decisive-Step Problem**  
     *Status*: Core to **Decisive-Step Supervision (N)**. It’s a fact about cognition that any scheme *must* route around—either by eliminating decisive steps or making them explicit/gradable. Not a smuggled desideratum.  
  2. **Prosthetic Values**  
     *Status*: Addressed by **Value Scaffolding Identification (N)**. Well-posed: we need to audit the scaffold’s influence (e.g., via ablation studies in training).  
  3. **Rating Compression**  
     *Status*: Covered by **Signal Sufficiency (N)**. Not a separate requirement—it’s the failure mode this requirement prevents.  
  4. **Fidelity on vs. off-Distribution**  
     *Status*: Split into **Counterfactual Fidelity (P)** (off-distribution) and implicit distributional competence (handled by other requirements). Not smuggled, but a preference because strict off-distribution guarantees are unrealistic in imitation learning.  
  5. **Drift Under Iteration**  
     *Status*: Directly addressed by **Iteration Stability (N)**. Anti-correlation with competence is not inherent; stability should be defined as *non-collapse*, not absence of change.  

  **Missing Failure Mode**: **Cascading Distillation Distortion**  
  - *Description*: Early distillation rounds favor "distillable" knowledge (e.g., statistical patterns), discarding hard-to-learn reasoning. Later rounds amplify this, losing human-like error correction.  
  - *Why it matters*: Explains why schemes might satisfy all requirements early on but fail at scale. In your task, the model might flag claims using surface cues (e.g., citation proximity) not actual support.  
  - *Family*: Related to drift and decisive steps but focuses on *what* is lost during compression.  

  ### Bottom Line
  - **Feasibility**: The requirements are *not* inherently impossible if decisive steps can be eliminated (e.g., via intermediate representations like "claim-citation relevance scores"). If not, the pipeline fails.  
  - **Recommendation**: Use **AI-assisted feedback with a rubric** (best balance) but run adversarial simulations during training to pressure-test decisive steps and monitor for scaffold bias.  
  - **Honest Take**: Your five failure modes are distinct and well-posed. The unsolved elephant is **decisive-step elimination**—if your task has irreducible holistic judgments, no scheme works.
