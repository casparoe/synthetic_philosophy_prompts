  I'm retired now — thirty years as a lab geophysicist, mostly borehole data — and I got into philosophy a couple of years ago; I sit in on the decision-theory reading group at the local university. We've stalled on the absent-minded driver, and I'd rather have a document than another evening of talk.

  Setup: two indistinguishable exits off a highway, the driver can't remember passing one or tell them apart. Stopping at the first scores 0 (truck stop in the desert), stopping at the second scores 6 (the town with the hotel), missing both scores 1 (motel at the coast). A plan is one number: p, the probability of stopping at any exit he comes to.

  Draft the joint statement of an adversarial collaboration between two camps: the ex-ante camp (rationality is assessed over whole plans, from before you set off; what you'd think at the exit isn't a separate decision) and the node-level camp (rationality is assessed where the action is, given the evidence you actually have there; a plan you'd abandon on arrival is not one you can rationally adopt). I want numbered claims both could sign; then a table of the residual disagreements, each in the wording its own side would accept; then the cruxes; and for each crux one case or argument both would accept as bearing on it, with each side's prediction written down in advance. Say plainly which parts of the quarrel are only about words.

  Two things I want dealt with, neither of which anyone in the group could point me to:

  1. My own algebra. If the driver derives his belief about which exit he is at from the plan he is following (P(first) = 1/(2−p)), then the p that maximises the value computed before departure is exactly the p at which he is indifferent at the the exit between stopping now and driving on and following the plan thereafter: p = 2/5, worth 9/5 per trip ex ante and 9/4 either way once you condition on being at an exit. I tried a three-exit version and it held again. Is that general, or an artifact of my numbers?

  2. A ring-road variant. Same amnesia, but the road is a ring: miss the second exit and you come round to the first again, payoffs alternating 0 and 6 forever, and there's no last exit; run out of fuel and score 0. Now the ex-ante value is 6(1−p)/(2−p), which is strictly decreasing, so the best plan is an p as small as you like but not zero — there is no best plan — while at every single exit driving on looks strictly better than stopping. What does each camp say about that?

  American English please, and keep the notation kind to someone who reads equations slower than he used to.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in the context of the absent-minded driver problem.

  The two camps:
  - **Ex-ante camp**: Rationality is assessed from the perspective before the journey begins. The driver chooses a plan (a fixed probability p of stopping at any exit) that maximizes the expected payoff from the ex-ante viewpoint. What the driver would think at an exit (given the information there) is not a separate decision problem; the plan is binding.
  - **Node-level camp**: Rationality is assessed at the moment of decision (at an exit). The driver, at each exit, should choose the action that maximizes expected payoff given the information available at that node (which includes the fact that he is at an exit but not which one). A plan that the driver would abandon at the exit (because it prescribes an action that is not optimal given the local information) is not one that can be rationally adopted.

  We are to produce:

  1. A numbered list of claims that both camps could sign.
  2. A table of residual disagreements, each in the wording that its own side would accept.
  3. The cruxes (the fundamental points of disagreement).
  4. For each crux, one case or argument that both would accept as bearing on it, with each side's prediction written in advance.
  5. Also, we must address two specific points: (a) the algebraic observation about the indifference at the exit and (b) the ring-road variant.

  We must also note which parts of the quarrel are only about words.

  Let's begin.

  **Part 1: Jointly Signed Claims**

  Both camps can agree on the following:

  1. The driver's goal is to maximize expected payoff.
  2. The driver has two identical decision nodes (exits) and cannot distinguish between them or remember past exits.
  3. A plan is specified by a single probability p (0 ≤ p ≤ 1) of stopping at any exit encountered.
  4. The ex-ante expected payoff (from the perspective before starting) for a plan p is: 
     V(p) = p * 0 + (1-p) * [ p * 6 + (1-p) * 1 ] 
          = (1-p)(6p + 1 - p) 
          = (1-p)(5p + 1)
     Simplifying: V(p) = 5p(1-p) + (1-p) = 5p - 5p² + 1 - p = -5p² + 4p + 1.
     (Alternatively, we can write: V(p) = (1-p) * [6p + (1-p)] = (1-p)(5p+1) = 5p + 1 - 5p² - p = -5p² + 4p + 1.)

     But note: the driver passes the first exit with probability 1. At the first exit, he stops with prob p (payoff 0) or continues with prob 1-p. Then at the second exit, if he gets there, he stops with prob p (payoff 6) or continues with prob 1-p (payoff 1). So:
       - Payoff 0: if stop at first (prob p)
       - Payoff 6: if continue at first and stop at second (prob (1-p)*p)
       - Payoff 1: if continue at first and continue at second (prob (1-p)*(1-p))

     Therefore: V(p) = p*0 + (1-p)*p*6 + (1-p)*(1-p)*1
                     = 0 + 6p(1-p) + (1-p)^2
                     = 6p - 6p^2 + 1 - 2p + p^2
                     = -5p^2 + 4p + 1.

     This is the ex-ante expected payoff.

  5. The ex-ante optimal p is found by maximizing V(p). Taking derivative: V'(p) = -10p + 4. Set to zero: -10p+4=0 -> p=0.4. Second derivative is negative, so maximum. V(0.4) = -5*(0.16) + 4*0.4 + 1 = -0.8 + 1.6 + 1 = 1.8.

  6. However, at an exit, the driver's belief about which exit he is at depends on the plan p. The probability that the current exit is the first one, given that the driver is at an exit, is:
       P(first | at exit) = P(at first exit) / [P(at first exit) + P(at second exit)]
                          = 1 / [1 + (1-p)] 
                          = 1/(2-p)
     because the driver always reaches the first exit (so probability 1) and reaches the second exit only if he didn't stop at the first (probability 1-p). Therefore, the probability of being at the second exit is (1-p)/(2-p).

  7. The expected payoff if the driver stops at the current exit is 0 if it's the first and 6 if it's the second. So, conditional on being at an exit, the expected payoff of stopping is:
       0 * P(first | at exit) + 6 * P(second | at exit) = 0 + 6 * (1-p)/(2-p) = 6(1-p)/(2-p)

  8. If the driver continues at the current exit, then:
       - If it's the first exit (prob 1/(2-p)), then he will go to the second exit and then follow the plan. At the second exit, he will stop with probability p (getting 6) or continue (getting 1). So the expected payoff from continuing at the first exit is: p*6 + (1-p)*1 = 6p + 1 - p = 5p+1.
       - If it's the second exit (prob (1-p)/(2-p)), then continuing leads to payoff 1.

     Therefore, the expected payoff of continuing at the current exit (given that the driver is at an exit) is:
          [1/(2-p)] * (5p+1) + [(1-p)/(2-p)] * 1 
          = [ (5p+1) + (1-p) ] / (2-p)
          = (5p + 1 + 1 - p) / (2-p)
          = (4p + 2) / (2-p)

  9. The driver at an exit is indifferent between stopping and continuing if:
          6(1-p)/(2-p) = (4p+2)/(2-p)

     Since the denominator is the same and positive (for p<1), we can equate numerators:
          6(1-p) = 4p+2
          6 - 6p = 4p + 2
          6 - 2 = 4p + 6p
          4 = 10p
          p = 0.4

     So at p=0.4, the driver is indifferent at the exit.

  10. Therefore, the ex-ante optimal plan p=0.4 is also the plan at which the driver, at an exit, is indifferent between stopping and continuing.

  11. This algebraic coincidence (that the ex-ante optimal p is the same as the p that makes the driver indifferent at the exit) holds for the given payoffs (0,6,1). The user also tried a three-exit version and found the same. We note that this may not hold for arbitrary payoffs, but for the standard absent-minded driver problem it does.

