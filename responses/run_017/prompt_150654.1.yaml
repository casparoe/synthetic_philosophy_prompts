  1. The ex-ante expected payoff for a plan p is V(p) = -5p² + 4p + 1.
  2. The ex-ante optimal p is 0.4, yielding an expected payoff of 1.8.
  3. At an exit, the driver's belief about which exit he is at is: P(first exit) = 1/(2-p), P(second exit) = (1-p)/(2-p).
  4. The expected payoff for stopping at the current exit is 6(1-p)/(2-p).
  5. The expected payoff for continuing at the current exit is (4p+2)/(2-p).
  6. The driver is indifferent between stopping and continuing at an exit if and only if p=0.4.
  7. Therefore, the ex-ante optimal plan (p=0.4) is the unique plan at which the driver is indifferent at the exit.

