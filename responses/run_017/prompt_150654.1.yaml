  2. **Ex-Ante Expected Payoff**:  
     - The ex-ante expected payoff of plan \( p \) (computed before departure) is:  
       \[
       V(p) = (1 - p)(5p + 1) = -5p^2 + 4p + 1.
       \]  
     - This is maximized at \( p = 0.4 \), yielding \( V(0.4) = 1.8 \).  

  3. **Beliefs at an Exit**:  
     - Given plan \( p \), the driver’s belief about which exit they are at is:  
       - Probability it is the first exit: \( \frac{1}{2 - p} \)  
       - Probability it is the second exit: \( \frac{1 - p}{2 - p} \)  

  4. **Conditional Payoffs at an Exit**:  
     - Expected payoff for stopping: \( 6 \cdot \frac{1 - p}{2 - p} \)  
     - Expected payoff for continuing: \( \frac{4p + 2}{2 - p} \)  

  5. **Indifference at Optimal Plan**:  
     - At \( p = 0.4 \), the driver is indifferent between stopping and continuing:  
       \[
       6 \cdot \frac{1 - 0.4}{2 - 0.4} = \frac{4 \cdot 0.4 + 2}{2 - 0.4} = 2.25.
       \]  
     - This equality holds for any payoff values in the two-exit problem (proven algebraically).  

  6. **Generality of Indifference Result**:  
     - The ex-ante optimal \( p \) always equals the \( p \) inducing indifference at exits for any payoffs \( A \) (first exit), \( B \) (second exit), \( C \) (miss both) in the two-exit case.  
     - Empirical verification: Holds for tested three-exit variants.  

  7. **Ring-Road Variant Setup**:  
     - Highway is a ring: Exits alternate payoffs 0 and 6 indefinitely.  
     - Driver runs out of fuel with payoff 0 if never stopping.  
     - Ex-ante expected payoff: \( V(p) = \frac{6(1 - p)}{2 - p} \) for \( p > 0 \) (undefined at \( p = 0 \)).  
     - \( V(p) \) is strictly decreasing in \( p \); supremum is 3 (approached as \( p \rightarrow 0^+ \)), but no optimal \( p \) exists.  

  8. **Indifference in Ring-Road Variant**:  
