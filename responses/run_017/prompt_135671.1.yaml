prompt: |-
  yo — please act like you're a professional philosopher who specializes in political theory and the philosophy of language, and take it slowly: do some brainstorming before you answer, and definately don't just throw a label at me.

  Me and my friends keep arguing about this and I dunno if there's a word for it. Whenever someone says "that's against Western values" or "we have to defend Western values" in a debate, the list of what's actually in the phrase seems to change depending on what they need it to be that minute. Example: my friend says free speech and equality are Western values, but when I pointed out that plenty of countries everyone calls Western had blasphemy laws or didn't let women vote until pretty recently, he just goes "yeah, but those countries were betraying their own values" — so nothing that actually happens in a Western country can ever count against the claim. And then the same person uses a really long list when he's blaming "the West" for stuff (colonialism, slavery, capitalism, pollution) and a really short nice-sounding list when he's defending it. It feels like the phrase grabs authority from "this is what we actually do around here" and then dodges to "this is what's good" the second anyone pushes back, and then back again. My other friend just says it's a weasel word and that's it, but that feels too easy, because I think lots of people use it completely sincerely and it still does the same slide.

  Is there an actual concept for this? Something about a term that means both "what this group happens to be like" and "what's genuinely good" and quietly switches between the two so that neither half can ever be checked. If there is one, explain it in your own words — I can't look anything up, so don't just name-drop authors and papers, actually explain the idea — and be really specific about how my case differs from the nearby stuff: plain vagueness, No True Scotsman, just a loaded or empty word, ordinary hypocrisy. I don't think any of those is quite it and I want to know why each one misses. If there genuinely isn't an established name, say so plainly and coin one, define it carefully, and give me the boundary cases: what has to be true for something to count, and what would look similar but isn't. I want to be able to spot the move in totally different arguments, not just win this one.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're frustrated with how "Western values" gets used in debates—sometimes it's descriptive (what Western countries do), sometimes prescriptive (what's good), and it switches between these meanings to avoid criticism. The user wants to know if there's a term for this or if we need to coin one.

  First, I need to figure out the core issue. The user mentions that their friend uses "Western values" in a way that's immune to counterexamples. When challenged with historical facts like blasphemy laws or women's suffrage, the friend claims those were betrayals of Western values, not true representations. Then, when blaming the West, the same friend includes negative actions like colonialism. This dual usage allows the term to dodge criticism both ways.

  Now, why isn't this just vagueness? Vagueness is about unclear boundaries, but here the problem is the deliberate switch between descriptive and prescriptive meanings. No True Scotsman is close but doesn't capture the identity/prescription duality. Hypocrisy is too broad. The user needs a concept that specifically addresses the term's ability to serve two conflicting purposes without being pinned down.

  I recall Gallie's "essentially contested concepts," but that's about ongoing debate, not the meaning-switching here. Maybe a "Janus-faced term"? Janus-faced means having two opposing aspects. That fits because the term looks both ways: to what is (descriptive) and what ought to be (prescriptive). 

  The key here is the unacknowledged shift. The user's friend isn't admitting the switch; it's done silently to avoid accountability. The term gains authority from its descriptive roots ("this is who we are") but then shifts to prescriptive ("this is what we should be") when criticized. This creates a self-sealing argument. 

  To define it clearly: The term is bi-referential, anchoring in group identity for legitimacy, then switching to ideals to deflect criticism. The boundary cases would be terms that are either purely descriptive or purely prescriptive, not both. Also, it's different from terms like "freedom" which are contested but don't rely on group identity. 

  The user wants to spot this in other arguments, so examples could include terms like "Christian values" or "American way of life" that similarly toggle between identity and ideals. The concept helps reveal how such terms evade scrutiny by never committing to one meaning.
answer: |-
  This is a profoundly astute observation about a pervasive rhetorical maneuver. It's not merely vagueness, hypocrisy, or a simple fallacy – it's a sophisticated conceptual *sleight-of-hand* that exploits the dual nature of the term. Let's break it down step-by-step, coin a precise term, define its boundaries, and show why nearby concepts don't quite fit.

  **Core Problem:** The phrase "Western values" (or similar group-identity terms like "American values," "Christian values," "our traditions") functions as a **Bi-Referential Identity Anchor (BIA)**. Here's the anatomy:

  1.  **Dual Reference Points:** The term inherently points to *two distinct things* simultaneously, without clear distinction:
      *   **Descriptive Referent (DR):** The actual, historical, observable practices, institutions, and behaviors of the group labeled "Western" (e.g., specific legal systems, historical events like colonialism or suffrage movements, economic models).
      *   **Prescriptive Referent (PR):** An idealized set of abstract principles or virtues *ascribed* to the group's core identity (e.g., "freedom," "equality," "rationality," "progress," "rule of law").

  2.  **Anchoring to Identity:** The term's power derives from its link to a *specific group identity* ("Western," "American," "Christian"). This identity provides emotional weight, a sense of belonging, and historical continuity. The "values" are presented as *defining* that identity.

  3.  **The Strategic Switch:** The user *tacitly shifts* between these referents depending on the argumentative need, *without acknowledging the shift*:
      *   **When asserting legitimacy or defending the group:** They primarily use the **PR**. "We must defend Western values (Freedom, Equality, Democracy)!" This appeals to universal ideals and positions the group as virtuous. Historical failures (DR) are dismissed as *betrayals* of the true PR ("We weren't being *truly* Western then").
      *   **When criticizing the group or assigning blame:** They primarily use the **DR**. "The West (Western values) is responsible for colonialism, slavery, and pollution!" Here, concrete historical actions (DR) are presented as the *true* manifestation of the group's identity ("This *is* what the West did"). The PR is minimized or ignored.
      *   **Immunization:** This switch makes the core claim ("X is a Western value") *unfalsifiable*.
          *   A counterexample using the DR (e.g., historical lack of free speech) is dismissed by shifting to the PR ("That wasn't *true* Western values").
          *   A challenge to the PR (e.g., "How can colonialism be a Western value if equality is?") is dismissed by shifting to the DR ("But look at what the West *actually did* historically; that *is* its value manifested").

  **Why Other Concepts Don't Fully Capture It:**

  1.  **Vagueness:** "Western values" *is* vague, but that's not the core issue. Vagueness is about fuzzy boundaries. The BIA problem is about *exploiting two specific, distinct meanings* (Descriptive Reality vs. Prescriptive Ideal) tied to group identity. Someone could vaguely use "Western values" without performing this specific switch.
  2.  **No True Scotsman (NTS):** *This is very close, but not identical.* NTS occurs when a universal claim ("No Scotsman puts sugar in his porridge") is defended against a counterexample ("But Angus is a Scotsman and puts sugar in his porridge!") by redefining the category *ad hoc* ("Ah, but no *true* Scotsman puts sugar in his porridge!"). **The key difference:** NTS focuses on redefining *membership* in the group based on *one* attribute (e.g., sugar use). The BIA specifically exploits the *dual meaning of the value-concept itself* (DR vs. PR) *within* the accepted group identity. Your friend isn't saying France wasn't "Western" when it had blasphemy laws; he's saying the *value* of free speech was still the "true" Western value *despite* France's actions. NTS changes group membership; BIA changes the interpretation of the value *while keeping group membership constant*.
  3.  **Loaded/Empty Word:** Calling it "loaded" (emotionally charged) or "empty" (meaningless) misses the *functional duality*. It *is* loaded, but the power comes specifically from the dual reference anchored to identity. It's not empty; it has two *different* meanings that are strategically deployed.
  4.  **Ordinary Hypocrisy:** Hypocrisy is inconsistency in *action* or *belief application* by an *individual*. The BIA is a *conceptual* inconsistency *built into the use of the term itself*, allowing the *same person* to use it inconsistently while maintaining rhetorical coherence *within their own framework*. It's a tool *for* hypocrisy, but the mechanism is linguistic/conceptual.
  5.  **Essentially Contested Concept (Gallie):** Concepts like "democracy" or "justice" are essentially contested because their *best* interpretation is inherently debatable. "Western values" as a BIA *isn't* primarily contested over its *best* meaning; it's *exploited* by strategically *choosing* which of its two inherent meanings (DR or PR) is operative at a given moment to win an argument, often without acknowledging the contest exists. The contestation isn't open; it's hidden and instrumentalized.

  **Coined Term & Definition:**

  **Term: Bi-Referential Identity Anchor (BIA)**

  **Definition:** A BIA is a term or phrase that simultaneously refers to:
  1.  The **Descriptive Reality (DR)** of a specific group's actual historical or current practices, institutions, and behaviors.
  2.  An idealized **Prescriptive Standard (PR)** presented as the core essence or inherent values of that group's identity.
  Its power derives from its anchoring to the group identity. Crucially, it functions rhetorically by allowing the user to *tacitly and strategically switch* between the DR and PR meanings *without acknowledgment*, depending on whether the goal is to defend the group's virtue (emphasizing PR) or assign blame/critique the group (emphasizing DR). This switch immunizes claims made using the term against counter-evidence drawn from either the group's history (which can be dismissed as not reflecting the "true" PR) or abstract ideals (which can be dismissed as irrelevant compared to the "actual" DR).

  **Boundary Cases: What Makes a BIA?**

  *   **Core Requirements:**
      1.  **Group Identity Anchor:** The term must be intrinsically tied to a specific collective identity (nation, culture, religion, civilization).
      2.  **Clear Dual Reference:** There must be a plausible, commonly invoked DR (what the group *does/has done*) and a plausible, commonly invoked PR (what the group *ideally stands for*).
      3.  **Strategic Switching:** The term is used in a way that switches emphasis between DR and PR *specifically to deflect counterarguments* or *strengthen a claim* without acknowledging the shift in meaning.
      4.  **Immunization Effect:** The switching creates a situation where evidence contradicting one referent can be dismissed by appealing to the other.

  *   **Similar But Not BIA:**
      *   **A purely descriptive term:** "European rainfall patterns" has no PR element.
      *   **A purely prescriptive term:** "Universal human rights" might be aspirational but isn't anchored to a *specific* group's identity as its defining essence. (Though someone might *try* to turn it into a BIA by claiming "Human rights *are* Western values").
      *   **Simple historical inconsistency:** "Britain championed free trade in 1850 but protectionism in 1930" points out a change in DR, but doesn't invoke an unchanging PR *as* "British values" to explain it away.
      *   **Openly contested concepts:** Debating whether "freedom" means negative liberty (non-interference) or positive liberty (capacity to act) involves open contestation of the *prescriptive* meaning, not a hidden switch between description and prescription anchored to a group.
      *   **Honest tension:** Someone might sincerely struggle: "Our nation professes liberty (PR), but our history includes slavery (DR). How do we reconcile this?" This acknowledges the duality and struggles with it; it doesn't *use* the switch strategically to win an argument.

  **How to Spot BIAs Elsewhere:**

  1.  **Identify the Group Identity Term:** Look for phrases like "True X values," "The Y way," "Our Z heritage/tradition," "What it means to be W."
  2.  **Ask the DR/PR Question:** In any given usage, ask: Is this term primarily being used to describe *what actually happens/happened* within the group (DR), or is it describing *what the group supposedly stands for/aspires to* (PR)?
  3.  **Look for the Switch:** Does the user employ the *same term* to describe concrete actions/history in one context (often negative/blame) and abstract ideals in another (often positive/defense)? Do they dismiss challenges to the ideals by pointing to the group's "true nature" (implying PR), and dismiss challenges about negative actions by saying "that wasn't who we *really* are" (implying PR over DR) or "that *is* who we are" (using DR for blame)?
  4.  **Check for Immunization:** Does the term seem impervious to counter-examples? If historical facts don't challenge the ideal, or if appeals to the ideal don't challenge negative actions, it's likely functioning as a BIA.

  **Examples Beyond "Western Values":**

  *   **"Christian Values":** Used prescriptively (PR: love, charity, forgiveness) to defend the faith, but descriptively (DR: crusades, inquisitions, televangelist scandals) to critique it or blame Christians. A believer might dismiss the DR examples as "not true Christianity" (switching to PR).
  *   **"The American Way":** Used prescriptively (PR: freedom, opportunity, hard work) to promote policies or patriotism. Used descriptively (DR: inequality, consumerism, military interventions) to critique the US. A defender might dismiss critiques by saying inequality is due to individual failing, not "true" American values (PR).
  *   **"Family Values":** Used prescriptively (PR: stability, love, support) to promote certain social policies. Used descriptively (DR: high divorce rates, domestic violence, diverse family structures) to critique traditionalist views. A proponent might dismiss negative DR examples as "breakdowns" betraying true values.

  **In Conclusion:**

  You've identified a powerful and often deceptive rhetorical tool: the **Bi-Referential Identity Anchor (BIA)**. It's not just sloppy thinking; it's a conceptual structure built into certain identity-laden value terms that allows them to absorb criticism and assert legitimacy simultaneously by constantly shifting ground between **what the group *is* (Descriptive Reality)** and **what the group *ought to be* (Prescriptive Standard)**, all anchored to the emotional power of group belonging. Recognizing this maneuver – spotting the anchor, identifying the switch, seeing the immunization – is crucial for dissecting many political, cultural, and historical arguments. Your friend isn't just being hypocritical or vague; he's deploying a specific conceptual mechanism inherent in how terms like "Western values" function in discourse.
