answer: |-
  Here is a ranked map of defeaters for "calm-sea functionalism," addressing your specific queries. Defeaters are ordered from most decisive to least, with concessions and insulation assessed:

  ### I. Decisive Defeaters
  1. **Textual: Sovereignty & Recognition Demands Actual Conflict**  
     If Hegel's core argument in the international realm (§§330-340) is that states *must* assert their sovereignty through the *possibility* and *actuality* of war to be recognized as concrete individuals (not abstract entities), then war's function isn't merely internal ethical negation. It becomes essential for the state's *external actualization*. The "substitution test" fails because a ceremonial military or domestic service cannot replicate this *intersubjective confrontation* where sovereignty is staked and tested. This makes war irreducible.

  2. **Systematic: Negation Requires Life-and-Death Stakes**  
     Hegel's dialectic often treats true negation as requiring *radical* existential confrontation. If war's ethical power stems specifically from citizens facing *actual sacrifice of life* (not just inconvenience or service), substitutes lack the same potency. The "majestic power of the negative" (§324 Addition) implies destruction of the *particular will itself*—something a peacetime draft or economic collapse might simulate but not authentically replicate. A functionalism ignoring this existential dimension risks being "abstract" against Hegel's demand for *concrete* freedom.

  ### II. Strong Defeaters
  3. **Textual: War as Affirmation, Not Mere Negation**  
     Passages linking war to patriotism (§324) and the "health" of the ethical whole suggest war *positively* binds citizens to the state through shared sacrifice, generating *Sittlichkeit* (ethical life). If this affective unity ("the self-consciousness of the state's power") depends on *real communal peril*, substitutes become mere administrative tasks lacking transformative power. Your reading predicts Hegel should accept non-violent substitutes; if he instead insists on war's unique capacity to forge this bond, functionalism overgeneralizes.

  4. **Systematic: Instrumentalism vs. Dialectical Necessity**  
     Reducing war to a functional tool for unsettling civil society risks a Kantian instrumentalism Hegel rejects. If war is a *necessary moment* in the dialectic of Spirit's self-realization (as in the *Phenomenology*'s struggle for recognition), it cannot be replaced without disrupting the logical architecture. A "substitute" might produce similar *effects* but lack the *immanent rationality* Hegel attributes to war's role in world history. Functionalism then appears external and mechanical.

  ### III. Moderate Defeaters
  5. **Historical: States with Prolonged Peace & Vibrant Ethics**  
     Cases like post-1945 Germany or Scandinavian states exhibit strong civic ethics without recent war or mass conscription. To retreat to "longer timelines" (e.g., centuries) risks ad-hoc insulation. If Hegel's claim is about *inevitable* corruption without periodic war, these cases challenge it empirically. A legitimate qualification would be if such states experience *other* forms of collective negation (e.g., existential threats like climate change) that function analogously—but this stretches "calm-sea" beyond war.

  6. **Conceptual: Peace as "Stagnant" Only Under Specific Conditions**  
     If Hegel's critique targets *complacent bourgeois peace* (e.g., prioritizing private gain over communal good), not peace *itself*, then a state cultivating civic virtue *without* war (via education, participatory institutions) might avoid corruption. Your reading must show Hegel believes *only* war provides adequate negation. If peaceful ethical cultivation is possible, functionalism overstates war's necessity.

  ### IV. What a Defender Should Concede
  - **The Substitution Test Likely Fails on Hegel’s Terms:** Hegel almost certainly viewed *actual* risk of death and intersovereign conflict as irreplaceable. Concede that civic service or economic collapse cannot replicate war's *existential* gravity or role in affirming sovereignty.
  - **War Has Positive Functions:** Beyond negation, war fosters patriotism and communal unity—functions not fully separable from the act of negation itself.
  - **"Prolonged Peace" is Undefined:** The defender must specify what duration constitutes dangerous stagnation (Hegel doesn't). Overreliance on this variable weakens the thesis.

  ### V. Insulation Assessment
  The view **risks unfalsifiability** if:
  - Any peaceful state is deemed "not peaceful long enough."
  - Any substitute is dismissed as "not a true negation" without clear criteria.
  - **Remedy:** Tighten the thesis: Specify that war is the *historically necessary and sufficient* means for this negation in modern states, but allow that Hegel’s *logic* might permit alternatives *if* they achieve equivalent existential communal commitment. Without this, insulation becomes problematic.

  ### Why the Substitution Test is Flawed (and What to Use Instead)
  The substitution test is **incorrect for Hegel** because it isolates *one function* (negation of finitude) from war's *systematic role*. A better test:  
  **The Dialectical Necessity Test:** Does Hegel present war as a *logically necessary* moment within the development of Objective Spirit? Evidence would be:  
  1. Whether war is derived immanently from the concept of the state.  
  2. Whether alternatives would violate Hegel's account of sovereignty or recognition.  
  3. Whether the *qualitative intensity* of negation in war is unmatched.  

  If war is necessary dialectically, functionalism is insufficient; if not, functionalism gains strength. Your reading’s strength is highlighting war’s internal ethical role beyond Realpolitik—but its weakness is isolating that role from Hegel’s broader systematic commitments.

  ---
  **In summary:** The most decisive threats are textual/systematic evidence that war’s value lies in actual sovereignty-assertion and life-and-death stakes, not just functional negation. A defender’s strongest move is to argue that Hegel *fuses* these aspects—but must concede the substitution test oversimplifies. The thesis survives best as a *partial* insight, not a complete account.
