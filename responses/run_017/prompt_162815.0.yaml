  Historical counterexamples: If a state like Switzerland maintains ethical vitality without war, does that refute the thesis? The user might retreat by saying prolonged peace over centuries would cause stagnation, but that could seem ad hoc. Modern states with professional militaries engaged in non-combat roles might still experience ethical health, challenging the necessity of actual war. The defender could argue that indirect threats or other negations (like economic crises) serve the function, but if Hegel specifically ties it to war, that weakens their case.

  Concessions a defender should make: Even within their framework, they should admit that Hegel ties the negation to patriotism and sovereignty, not just any disruption. If substitutes don't evoke the same collective spirit, they might not fulfill the ethical purpose. Also, Hegel likely saw actual sacrifice as irreplaceable, so the substitution test might not hold. Acknowledging that their test might not align with Hegel's emphasis on life-and-death stakes is a necessary concession.

  Insulation and unfalsifiability: If every counterexample is dismissed by saying the peace wasn't long enough or the negation not true enough, the argument becomes unfalsifiable. That's a problem. The user needs to define what constitutes "prolonged peace" or "adequate negation" to avoid this. If they can't, the thesis might be untenable.

