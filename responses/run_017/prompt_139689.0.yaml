answer: |-
  Here’s a concrete decision tree built from your 7 cases, capped at 8 branch questions, focused solely on desk-level choices. It maps the logical space, flags gaps, incorporates your two distinctions, and avoids abstract "moral standing" debates. Leaves are named positions with their awkward commitments.

  ### Decision Tree: Dramatizing Real People
  **(Start at Decision Point 1)**

  **Decision Point 1: Will you include a real person *at all*?**  
  - **NO** → *Leaf 1: **The Abstainer***  
    *Awkward commitment: Must accept that some true, compelling stories (e.g., obscure figures) will remain untold because they can’t be fictionalized enough to avoid "being portrayed".*  
    *(Cases covered: 6,7)*  
  - **YES** → Proceed to Decision Point 2.

  **Decision Point 2: Do you invent *significant actions/events* for this person that lack archival support?**  
  *(e.g., Case 1: Invented sex scene; Case 7: Inventing villainous acts)*  
  - **NO** → Proceed to Decision Point 4.  
  - **YES** → Proceed to Decision Point 3.

  **Decision Point 3 (Two-Audience Problem): Is your primary audience likely to interpret your work as *historical fact*?**  
  *(Your Distinction (a) - duty to person vs. duty to audience)*  
  - **YES** → *Leaf 2: **The Fidelity Alarmist***  
    *Awkward commitment: Must abandon powerful invented scenes (like Case 1 or 7) if they’d mislead audiences, even if they reveal "deeper truth".*  
  - **NO** → Proceed to Decision Point 6.

  **Decision Point 4: Do you alter *chronology or attribution* of documented events?**  
  *(e.g., Case 2: Moving a speech; Case 3: Merging people = altering attribution)*  
  - **NO** → Proceed to Decision Point 5.  
  - **YES** → *Leaf 3: **The Narrative Utilitarian***  
    *Awkward commitment: Must defend altering timelines/voices (Case 2) as essential craft, even when archives are clear and accessible.*  

  **Decision Point 5: Do you contradict the subject’s *self-presentation* using hostile/ambiguous archives?**  
  *(e.g., Case 4: Ignoring flattering memoir; Case 5: Using records from their exploiters)*  
  - **NO** → *Leaf 4: **The Subjective Harmonizer***  
    *Awkward commitment: Must soften harsh truths if the subject’s own account (Case 4) omits them, risking historical whitewash.*  
  - **YES** → *Leaf 5: **The Corrective Realist***  
    *Awkward commitment: Must depict the subject unflatteringly using biased sources (Case 5), accepting you might reinforce the exploiter’s narrative.*  

  **Decision Point 6 (Attention Scarcity): Are you depicting someone *already overrepresented* in the cultural canon?**  
  *(Your Distinction (b) - opportunity cost)*  
  - **YES** → *Leaf 6: **The Canon Disruptor***  
    *Awkward commitment: Must justify focusing on (e.g.) another Tudor courtier instead of an erased figure, even if the story is weaker.*  
  - **NO** → Proceed to Decision Point 7.

  **Decision Point 7: Did the subject *explicitly forbid* their portrayal? (Case 6)**  
  - **YES** → *Leaf 7: **The Consent Absolutist***  
    *Awkward commitment: Must exclude pivotal figures (e.g., a secretive activist in Case 6) if they objected, regardless of historical significance.*  
  - **NO** → *Leaf 8: **The Archival Positivist***  
    *Awkward commitment: Must depict only what’s documented, even if it creates flat characters (rejects Cases 1,2,3,7).*  

  ---

  ### Logical Space Analysis
  1. **Unoccupied Combination: "Invent significant actions (DP2=YES) + Alter chronology (DP4=YES) + Primary audience *won’t* see it as fact (DP3=NO) + Subject is *overrepresented* (DP6=YES)"**  
     - **Why?** *Untried/Unattractive*. Combining invention *and* alteration for an overexposed figure, while assuming audience discernment, feels self-indulgent. Most who invent freely (Narrative Utilitarians) target gaps in representation (DP6=NO).  
     
  2. **Unoccupied Combination: "Don’t invent actions (DP2=NO) + Don’t alter chronology (DP4=NO) + Contradict self-presentation (DP5=YES) + Subject is *underrepresented* (DP6=NO)"**  
     - **Why?** *Incoherent under pressure*. Corrective Realism (Leaf 5) requires using hostile archives, but without invention/alteration, it’s hard to dramatize silenced figures compellingly. Writers either invent minimally (sliding toward Narrative Utilitarian) or abandon strict accuracy.  

  3. **Tree Cannot Separate:**  
     - **Archival Positivist (Leaf 8)** vs. **Fidelity Alarmist (Leaf 2)** on *invented details*. Both reject Case 1 (sex scene), but for different reasons: Alarmist fears audience misperception; Positivist rejects all invention. The tree can’t split these without asking "Do you believe audiences are gullible?" (abstract).  
     - **Consent Absolutist (Leaf 7)** vs. **Abstainer (Leaf 1)** on *minor characters*. Both might exclude Case 7 (villainous minor figure), but Absolutists only care about the subject’s consent; Abstainers might exclude due to ethical discomfort, not consent. The tree can’t isolate "consent alone" as the motivator.  

  ### Your Distinctions: Load-Bearing?
  - **(a) Two-Audience Problem (DP3):** **Crucially load-bearing.** It splits the "Invent actions?" branch sharply. Those who invent *and* worry about audience misperception (Fidelity Alarmists) oppose those who invent *without* that worry (who proceed to Attention Scarcity/Canon questions). Forces writers to confront audience literacy.  
  - **(b) Attention Scarcity (DP6):** **Load-bearing for selection ethics.** Creates a distinct branch for writers who prioritize *who* gets depicted (Canon Disruptors) vs. *how* they’re depicted (most other leaves). Explains why some defend distorting overexposed figures (e.g., Case 2 moving a Churchill speech) but not marginalized ones.  

  ### Tree Summary
  | **Leaf**               | **Key Trigger Decisions**                                  | **Most Awkward Commitment**                                                                | **Likely Familiar?**          |
  |-------------------------|------------------------------------------------------------|-------------------------------------------------------------------------------------------|-------------------------------|
  | 1. **The Abstainer**    | Excludes real person (DP1=NO)                              | Untold true stories due to ethical barriers.                                              | Small minority                |
  | 2. **Fidelity Alarmist**| Invents actions (DP2=YES) + Audience sees as fact (DP3=YES)| Abandon compelling inventions to prevent audience misperception.                          | Common in "owe the dead" camp |
  | 3. **Narrative Utilitarian** | Alters chronology/attribution (DP4=YES)                   | Defend bending facts (e.g., moved speech) as essential craft.                             | Most screenwriters            |
  | 4. **Subjective Harmonizer** | Doesn't invent (DP2=NO) + Doesn't alter (DP4=NO) + Doesn't contradict self (DP5=NO) | Soften harsh truths to honor subject's self-image, risking whitewash.           | Biographers-turned-novelists  |
  | 5. **Corrective Realist**| Doesn't invent (DP2=NO) + Doesn't alter (DP4=NO) + Contradicts self (DP5=YES) | Use exploiters' records (Case 5) to correct lies, risking reinforcement of bias. | Historians-turned-novelists   |
  | 6. **Canon Disruptor**  | Invents actions (DP2=YES) + Audience *not* misled (DP3=NO) + Overrepresented (DP6=YES) | Prioritize erasure over story strength (e.g., drop vivid villain).                   | Activist-writers              |
  | 7. **Consent Absolutist**| Explicit refusal (DP7=YES)                                | Exclude pivotal figures who objected (Case 6), regardless of impact.                     | Uncommon but vocal            |
  | 8. **Archival Positivist**| No invention/alteration/contradiction + No consent issue (DP7=NO) | Flat characters due to strict archival adherence (rejects Cases 1,2,3,7).        | Stricter historians           |

  **Why this works:**  
  - Forces engagement with *your cases* (e.g., DP2 directly tackles Case 1 & 7; DP4 tackles Case 2 & 3; DP5 tackles Case 4 & 5; DP7 tackles Case 6).  
  - **Leaf 3 (Narrative Utilitarian)** will resonate with most screenwriters; **Leaf 5 (Corrective Realist)** with research-driven novelists.  
  - Distinctions (a) and (b) create decisive forks (DP3 & DP6), proving they’re not academic fluff.  
  - Unoccupied combinations reveal real-world tensions (e.g., Corrective Realism’s practical incoherence).  
  - Awkward commitments expose trade-offs: every position has a "price" that mirrors workshop debates.
