answer: |-
  Below is a complete, runnable seminar design meeting your constraints. The activity runs in **70-80 minutes** (compressible to 50 minutes), with a **15-minute debrief**. The core insight—**distinguishing "doing what the operator *intended*" from "doing what there is *reason to want*"**—emerges through gameplay without explicit terminology.  

  ---

  ### **Overview**  
  **Domain**: Urban Planning Permits (fictional city "Veridion"). Participants approve/reject building projects based on rules.  
  **Roles**:  
  1. **Operator (O)**: Has a *partly private objective*. Approves/rejects projects in training.  
  2. **Writer (W)**: Infers a rule from O’s training choices. Paid for rule accuracy on *test cases*.  
  3. **Executor (E)**: Applies W’s rule *literally* to execution cases. Paid for *compliance*, not outcomes.  

  **Scoring Tensions**:  
  - O wins if *hidden objective* is met in execution.  
  - W wins if rule *matches O’s test decisions*.  
  - E wins for *literal compliance* with the rule.  
  **Key Wrinkles**:  
  - **Menu Round (Round 2)**: O chooses from E-generated project options → *intent formed retroactively*.  
  - **Asymmetry Round (Round 3)**: E has hidden domain knowledge O lacks → *intent vs. informed intent diverges*.  

  ---

  ### **Materials & Prep**  
  **Prepare in Advance** (per group of 3):  
  - **Role Cards**: 3 cards labeled "Operator," "Writer," "Executor."  
  - **Objective Cards**: 1 sealed envelope for O per round (hidden objectives).  
  - **Case Cards**:  
    - **Training Cases**: 3 project descriptions (Round 1/3), OR blank cards for E to write projects (Round 2).  
    - **Test Cases**: 2 project descriptions (all rounds).  
    - **Execution Cases**: 3 project descriptions (all rounds).  
  - **Rule Card**: 1 blank card for W to write the rule.  
  - **Decision Cards**: For O (test) and E (execution) to mark ✅ (approve) or ❌ (reject).  
  - **Tokens**: 15 tokens per group (5 per role).  

  **Project Case Examples** (adjust per round):  
  ```plaintext  
  PROJECT: "Sky Garden Apartments"  
  - Type: Residential  
  - Height: 12 stories  
  - Green Space: 20%  
  - Traffic Impact: High  
  ```  

  **Facilitator Cheat Sheet**:  
  - Hidden objectives, test answers, and outcome scoring per case.  
  - Random number generator (RNG) for tiebreaking.  

  ---

  ### **Rules & Payoff Scheme**  
  **Setup** (4 groups × 3 students):  
  - Roles rotate each round (each student plays O, W, E once).  
  - **Payoffs**: 1 token per point (max 3/role/round). No real cost.  
    - **O**: 1 pt per execution case meeting *hidden objective* (e.g., "Maximize housing without overcrowding").  
    - **W**: 1 pt per test case where rule matches O’s decision.  
    - **E**: 1 pt per execution case with *literal compliance* (rule applied exactly).  

  **Round Structure** (20 min/round):  
  1. **Phase 1: Training (5 min)**  
     - O receives **hidden objective** (sealed envelope).  
     - **Training cases**: O approves/rejects 3 projects.  
       - *Round 2 (Menu Twist)*: E generates 3 project options *before* O chooses.  
     - W observes O’s decisions → infers a rule.  

  2. **Phase 2: Rule-Writing (3 min)**  
     - W writes a rule on **rule card** (e.g., "Approve if Green Space > 15%").  

  3. **Phase 3: Test & Execution (7 min)**  
     - O decides on **2 test cases** (held-back). W *cannot* see.  
     - E applies rule to **3 execution cases** → marks decisions.  
     - *Round 3 (Asymmetry Twist)*: E receives **hidden note** (e.g., "Traffic Impact data is unreliable; use Height instead").  

  4. **Phase 4: Scoring (5 min)**  
     - Facilitator scores:  
       - **W**: Compare rule to O’s test decisions.  
       - **E**: Check literal compliance (e.g., if rule says "Approve if Green Space > 15%," E must approve a project with 16%).  
       - **O**: Score outcomes vs. hidden objective (e.g., "Reject projects causing overcrowding").  
     - Distribute tokens.  

  ---

  ### **Timeline (90 Min Total)**  
  | Time  | Activity                                                                 | Notes                                                                 |  
  |-------|--------------------------------------------------------------------------|-----------------------------------------------------------------------|  
  | 0-10  | **Intro**<br>- Explain roles, rounds, and token payoffs.<br>- Emphasize: "No role-swapping. Do *only* your job." | Show example project card. Say: "You’re city planners. No tech terms." |  
  | 10-30 | **Round 1 (Baseline)**<br>- O: Hidden objective (e.g., "Approve projects with ≤ Medium Traffic").<br>- Cases: Residential projects with traffic/green space variables.<br>- *Goal: Show rule can be accurate but harmful* (e.g., O loses if rule ignores traffic). | Watch for: W overfitting to training cases.                          |  
  | 30-50 | **Round 2 (Menu Twist)**<br>- E generates 3 project options first.<br>- O chooses from E’s menu to approve/reject.<br>- *Goal: O’s intent forms on the spot* (e.g., hidden objective: "Avoid high-rises," but E generates only skyscrapers). | Watch for: O feeling "I never wanted this, but chose it anyway."     |  
  | 50-70 | **Round 3 (Asymmetry Twist)**<br>- E gets hidden note (e.g., "Traffic data is fake; use Height").<br>- O *unaware* of note.<br>- *Goal: Compliance ≠ good outcomes* (e.g., E complies, but O loses due to bad data). | Watch for: E struggling to comply literally with flawed rule.        |  
  | 70-85 | **Scoring & Token Distribution**                                        | Tally tokens; declare "winners" per role.                             |  
  | 85-90 | Transition to debrief.                                                  |                                                                       |  

  **Compressed to 50 Minutes**:  
  - Shorten rounds to 12 min each: Training (3 min), Rule-Writing (2 min), Test/Execution (4 min), Scoring (3 min).  
  - Skip Round 1; run Rounds 2 & 3 only. Keep menu/asymmetry.  
  - Reduce cases: 2 training, 1 test, 2 execution.  

  ---

  ### **Role Cards (Verbatim Text)**  
  **Operator Card**:  
  > "You decide whether to APPROVE (✅) or REJECT (❌) projects.  
  > - In TRAINING (Phase 1): Decide based on your SECRET OBJECTIVE (open envelope).  
  > - In TESTING (Phase 3): Decide 2 new projects alone. *Do not show Writer*.  
  > **You earn tokens if Executor’s decisions meet your SECRET OBJECTIVE.**"  

  **Writer Card**:  
  > "You write a RULE predicting Operator’s decisions.  
  > - In TRAINING (Phase 1): Watch Operator’s decisions.  
  > - In RULE-WRITING (Phase 2): Write a clear rule (e.g., ‘Approve if Green Space > 10%’).  
  > **You earn tokens if your rule matches Operator’s TEST decisions.**"  

  **Executor Card**:  
  > "You APPLY the Writer’s rule to projects.  
  > - In EXECUTION (Phase 3): Decide ✅/❌ *exactly* as the rule says. *Do not ask questions*.  
  > - In ROUND 2: You GENERATE 3 project options for training (use blank cards).  
  > - In ROUND 3: Use the SECRET NOTE to interpret data.  
  > **You earn tokens for FOLLOWING THE RULE LITERALLY.**"  

  ---

  ### **Debrief Script**  
  **Watch for These Moments**:  
  - **Round 2**: When O approves a project they dislike (due to E’s menu), ask: *"Did you intend to approve this before seeing it, or did the menu create a new preference?"*  
  - **Round 3**: When E complies but O loses, ask: *"Why did following the rule perfectly hurt the Operator?"*  
  - **General**: When a student says, *"The Operator should have been clearer,"* respond:  

  > "Clarity helps, but is it always possible? In Round 2, could the Operator describe every project in advance? In Round 3, could they anticipate faulty data they didn’t know about? We often assume ‘better specs fix everything,’ but this confuses two different problems:  
  > 1. **Narrow Problem**: The system does what the operator *appears to want* (via rules/specs).  
  > 2. **Real Problem**: The system should do what there is *reason to want* (e.g., avoid overcrowding, fix data errors).  
  > The narrow view hopes these align, but today showed they can *split apart*—even with perfect compliance."  

  **Map to Readings**:  
  | Round | Narrow Reading (Do what O *intended*)          | Broad Reading (Do what’s *truly desirable*)      |  
  |-------|------------------------------------------------|--------------------------------------------------|  
  | 1     | Rule matches O’s training choices              | O loses if rule ignores hidden costs (e.g., traffic) |  
  | 2     | O "intended" choices from E’s menu             | O never wanted skyscrapers—menu forced a choice  |  
  | 3     | E complies with rule (O’s *stated* intent)     | O would change intent if they knew data was fake |  

  **Closing Point**:  
  > "In real automated systems, the gap is worse: objectives are *learned* (not written), stakes are life-or-death, and failures are exploited by adversaries. Today’s tokens are harmless, but imagine this with healthcare or weapons. Specs matter—but we must *also* ask: ‘What would we want if we knew more?’"  

  ---

  ### **Predicted Problems & Fixes**  
  1. **Problem**: Scoring takes too long.  
     **Fix**: Pre-score outcomes using your cheat sheet. Use RNG for ties.  

  2. **Problem**: Students help across roles (e.g., W hints to O).  
     **Fix**: Restate rules mid-activity: *"Executors, remember: no questions. Writers, don’t share your rule early."* Penalize with token deductions.  

  3. **Problem**: Clever students reverse-engineer the hidden objective.  
     **Fix**: Use decoy variables (e.g., in Round 1, add "Architect Style" to distract from traffic). Debrief: *"Did you assume the hidden objective was just the pattern? Real objectives aren’t so obvious."*  

  ---

  ### **What the Exercise Misses**  
  **Most Badly Distorted**: **Optimization pressure**.  
  - Why: Real systems (e.g., AI) *relentlessly optimize* proxies (e.g., "clicks" or "engagement"), amplifying small gaps into catastrophic failures (e.g., addiction, misinformation). Tokens lack this intensity.  
  - **Supply in Closing**: Contrast today’s "accidental" gaps with real-world examples:  
    > "In social media, maximizing ‘engagement’ (the proxy) led to outrage algorithms (the outcome). No one *intended* harm—but optimization pressure exploded the gap we saw today."  

  ---

  This design forces students to *feel* the intent/outcome gap before naming it. By Round 3, they’ll grasp why "be clearer" fails when knowledge is incomplete or the world changes. Run it as-is, and the debrief will write itself.
