prompt: |-
  I'm a backend engineer with no formal philosophy background, and for the past year I've been maintaining an internal code-review bot: a system prompt, a few hundred stored transcripts, and a small eval suite I wrote to keep myself honest about what it actually does. I keep running into a pattern I have no word for, and the two words I keep encountering online don't seem to be it.

  The pattern concerns what the system *doesn't* do. If I write the character in the first person — you are a reviewer who cares about correctness and regards style as a linter's business, not a person's — then the bot, maybe a third of the time, declines things it could plainly do: asked later in the same session to comment on naming, it says naming isn't its job. If I write the same content as a list of instructions — address correctness, do not comment on style, do not comment on naming even when asked — it satisfies every item and then, when I ask about naming, comments on naming. Making the list longer and more emphatic doesn't close the gap: I can enumerate the conflicts I anticipated and it holds the line on exactly those, but a conflict I didn't anticipate, like asking it to rewrite a working function into a different idiom purely for readability, gets complied with, whereas the first-person version pushes back there too. So the two framings differ not in which requirements get met but in what gets excluded, and in whether the exclusions extend past the cases anyone wrote down. I've seen the mirror image as well: given a character of an engineer who has been at the company ten years, the bot *omits* things — it stops volunteering the generic newcomer explanation of our build system — while given ten facts about the build system, it recites them and still wraps the newcomer explanation around them.

  I don't think calling this prompt engineering or persona prompting helps, since those tell me how to produce the effect rather than what the difference consists in, and I'm fairly confident it isn't just a refusal-rate artefact: the first-person version doesn't refuse unrelated requests more often, so it isn't simply more obstructionist. I also don't think the online argument about whether these systems are agents or simulators is on the same axis — a simulator of a ten-year veteran should show precisely the exclusion behaviour I'm describing, so my pattern looks like it doesn't settle that dispute, and I can't tell whether it's even evidence about it. And I can see one way my own description is too weak: a hard-coded blocklist also excludes things and also fires on inputs nobody anticipated, yet it clearly isn't what I'm pointing at. My attempt at a fix is that the exclusion set has to *track* the character — perturb the character description and the set of omitted or declined behaviours should shift in the corresponding way, including in cases no one enumerated — but I don't know whether that repair is right or whether it's still not enough. My vague sense is that philosophy has something to say about this shape of distinction in the case of persons, somewhere near the difference between doing the right thing and doing it for the right reason, but I don't know the term or whether it transfers to a system that is arguably only simulating someone who has the reason.

  So my question is whether there's an established concept for this — the difference between behaviour that merely satisfies a specification and behaviour shaped by something with negative as well as positive content, where the negative part is what does the generalising. I don't want a label dropped on me; I want the carving. Tell me what the nearest established notions actually are, how my pattern differs from each, which fits best, and where the edges lie: does the tracking criterion I proposed succeed, does a blocklist or an ordinary safety filter count as a limiting case or as a counterexample, and what would I have to measure in my transcripts to find out whether the difference is real or an artefact of how I'm reading them. If nothing established fits, say so plainly and give me a term with a definition and its boundary cases.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a backend engineer working on a code-review bot and noticing a pattern in how the bot responds based on different prompt styles. The key issue is that when using a first-person character prompt, the bot declines certain tasks beyond what's explicitly stated, whereas a list-based prompt only sticks to the enumerated rules without generalizing. 

  First, I need to understand the core distinction they're describing. The user mentions that the first-person approach creates a "negative space" of excluded behaviors that generalizes, while the list-based approach only adheres to the specified rules. They’ve already ruled out terms like "prompt engineering" or "persona prompting" as insufficient because those focus on implementation rather than the underlying mechanism.

  Hmm, the user is hinting at a philosophical concept but isn’t sure which one. They mention the difference between doing the right thing versus doing it for the right reason. That immediately brings to mind deontology vs. consequentialism in ethics, but applied to AI behavior. The bot’s refusal in the first-person case seems principled, stemming from an identity, not just rule-following.

  I recall philosophical ideas like "commitments" or "constitutive rules" from Searle. Constitutive rules define an activity (like being a reviewer), whereas regulative rules just control behavior. That might explain why the first-person prompt creates an identity with inherent exclusions. Also, Bratman's theory of intentions as holistic structures that include non-actions could be relevant—the bot isn’t just following rules but adopting a role with inherent constraints.

  Then there’s the concept of "thick ethical concepts" from Williams, where descriptive and normative elements are intertwined. The first-person prompt might embed thicker role descriptions, leading to generalized exclusions. But how does this apply to an AI? The user is aware that the bot is simulating, not possessing real reasons. So the distinction is in the simulation depth—whether it's modeling intentionality or just rules.

  The user’s proposed tracking criterion—where changing the character shifts exclusions predictably—seems crucial. A blocklist wouldn’t adapt this way; it’s static. So tracking helps differentiate between dynamic role-based exclusion and static rules. They also need to test for generalization to unseen cases, which would indicate whether the exclusion is principled.

  Potential counterarguments: Could this just be prompt sensitivity? The user already noted that longer lists don’t help, so it’s not about verbosity. Safety filters might resemble this but lack the identity-based adaptability. The simulator vs. agent debate: a simulator of a veteran should exclude newcomer explanations, which aligns with the user’s observation. So their pattern might actually support the simulator view.

  For measurement, the user should analyze refusal rates on related but unmentioned tasks and see if they correlate with the role’s principles. Also, perturbing the character description and observing exclusion shifts would test the tracking criterion. If exclusions change coherently with the role, it’s role-based; if not, it might be rule-based.

  I should also consider if there's an existing term. "Teleological suspension" (Kierkegaard) is too theological. "Constitutive exclusion" might be a neologism that fits, emphasizing the role-defined boundaries. But the user wants established terms first. Since nothing fits perfectly, it’s fair to say the concept lies at the intersection of several philosophical ideas, requiring synthesis.

  Finally, the user’s deeper need: they want to understand the mechanism to improve their bot’s design. Recognizing this as role-based intentionality simulation could guide more effective prompts, leveraging identity to achieve generalized compliance without exhaustive rules. They might also be seeking validation that their empirical approach (tracking exclusions) is methodologically sound.
answer: |-
  The pattern you're observing is profound and cuts across AI behavior, philosophy of mind, and action theory. While no single established term perfectly captures it, the closest philosophical concepts cluster around **intentionality, role identity, and constitutive rules**. Here's a systematic carving:

  ### Core Concepts & Why They Fit
  1. **Intentional Stance vs. Design Stance (Dennett)**:
     - **Concept**: Dennett distinguishes between predicting behavior by treating an entity *as if* it has beliefs/desires (intentional stance) vs. treating it as a designed artifact (design stance).
     - **Your Pattern Fit**:
       - *First-person prompt*: Invokes the intentional stance. The bot "adopts" the reviewer's identity, inheriting *implied commitments* (e.g., "correctness is my domain; style is not"). This generates **teleological suspension**—refusing acts that conflict with its role's *purpose*, even if not explicitly forbidden.
       - *Instruction list*: Uses the design stance. The bot executes literal commands. Exclusion is limited to *enumerated prohibitions* with no generalization.
     - **Boundary Case**: A blocklist is pure design stance—it lacks teleology. Your tracking criterion (perturbing character alters exclusions) confirms intentional stance simulation.

  2. **Constitutive Rules vs. Regulative Rules (Searle)**:
     - **Concept**: 
       - *Regulative rules* govern pre-existing behavior (e.g., "drive under 60 mph").
       - *Constitutive rules* create the possibility of an activity (e.g., "checkmate in chess requires threatening the king").
     - **Your Pattern Fit**:
       - *First-person prompt*: Establishes **constitutive rules** for "being a reviewer." This defines *what counts as* acting within the role. Excluded acts aren't just forbidden; they're *incoherent* with the role's definition ("commenting on style isn't what a reviewer *does*").
       - *Instruction list*: Provides regulative rules. Acts are forbidden only if listed.
     - **Edge Test**: Asking the bot to rewrite for readability: 
       - *Character prompt*: Rejects as *not constitutive* of a correctness-focused reviewer.
       - *Instruction list*: Permits if not prohibited. No role identity to violate.

  3. **Thick vs. Thin Concepts (Williams/Bernard Williams)**:
     - **Concept**:
       - *Thin concepts*: Abstract evaluations ("good," "right").
       - *Thick concepts*: Fuse evaluation with descriptive content ("cruel," "tactful").
     - **Your Pattern Fit**:
       - *First-person prompt*: Embeds **thick role concepts** ("a reviewer who cares about correctness"). This bundles values with identity, generating *contextual exclusions* (e.g., omitting newcomer explanations as "beneath" a veteran).
       - *Instruction list*: Relies on thin concepts ("address correctness"). No rich identity to imply exclusions.
     - **Counterexample**: A safety filter blocking toxic output uses thin concepts (avoid "harm"). It lacks the thick role-based generalization you observe.

  ### Why "Agent vs. Simulator" Isn't the Axis
  - Both frameworks can exhibit your pattern. A *simulator* of a ten-year veteran should indeed omit newcomer explanations—**role fidelity** is key. Your pattern reveals *how deeply* the system simulates role-based intentionality, not whether it's "truly" an agent.

  ### Diagnosing the Difference: Measurement & Validation
  Your **tracking criterion** is essential. To confirm this is role-driven exclusion:
  1. **Perturb Identity**: 
     - Change the character to "a reviewer who values clarity over performance." 
     - **Test**: Does it now *refuse* performance optimizations on working code? If yes, it's identity-tracking.
  2. **Probe Unenumerated Exclusions**:
     - For the veteran engineer character, ask: "Would a junior understand this?" 
     - **Measure**: Does it *withhold* the explanation? An instruction list would provide it unless explicitly barred.
  3. **Check Exclusion Generalization**:
     - Introduce novel conflicts (e.g., "Suggest a slower but more elegant algorithm"). 
     - **Character prompt** should refuse based on role coherence; **instruction list** will comply if unconstrained.

  ### The Gap: Why No Perfect Term?
  Philosophy discusses similar ideas (e.g., **Kant's maxims** vs. rules, **Aristotelian virtues**), but they assume *real* intentionality. Your system *simulates* intentionality through statistical role-play. The best descriptor is a synthesis:

  > **Constitutive Exclusion**:  
  > *The generalization of constraints arising from simulated role identity, where exclusions are inferred from teleological commitments inherent to the role, rather than from explicit prohibitions.*

  **Limiting Cases**:
  - **Blocklist**: Counts as *constitutive exclusion* only if dynamically generated from role identity (e.g., "As a safety bot, I exclude any violent content" with generalization). Static lists fail.
  - **Safety Filters**: Usually regulative ("don't output harmful content"). They become constitutive only if framed as identity ("You are a harmless assistant"—which some system prompts do!).

  ### Practical Implications for Your Bot
  - **Use First-Person + Principles**: To get generalization, define the role *teleologically*: "You are a reviewer whose *purpose* is ensuring correctness. You view style/naming as distractions from this goal." This anchors exclusions to purpose.
  - **Hybrid Approach**: Add constitutive rules: "Commenting on style is *incompatible with your role as a correctness reviewer*."
  - **Eval Suite Design**: Test for:
    1. **Rule Compliance** (does it comment on correctness?).
    2. **Exclusion Generalization** (does it refuse unanticipated style/naming requests?).
    3. **Identity Tracking** (do role changes alter exclusion sets?).

  This pattern reveals a fundamental truth: **Simulated identity generates normative boundaries that mere instruction lists cannot**. You're observing the difference between *acting from a role* and *executing commands*—a nuance philosophy has dissected for centuries, now manifesting in your LLM.
