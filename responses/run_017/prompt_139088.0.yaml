prompt: |-
  I'm a journalist — I write mostly about science and ideas, which means I spend a lot of my week doing a very boring thing: taking some source's account, pulling out the bits that can be checked against documents or data or a third party, and checking them. I recently fell into reading about how historians do the same thing for material that's two and a half thousand years old (Herodotus happily passing along what he was told, Thucydides being fussy about provenance, that whole tradition of source criticism), and it made me notice a pattern in my own work that I don't have a word for.

  Here's the pattern. A source's account mixes claims of two very different kinds. Some are auditable: dates, distances, serial numbers, who was in the room, what the weather did, which lab the sample went to. Others are structurally unauditable: what someone was thinking, what got said in a meeting of three people who all have an interest in the story, what the other side was planning. I check the auditable ones and they come back clean — often impressively clean, dozens of them — and I can feel my confidence in the unauditable ones go up, and my readers' confidence go up much more than mine does. Nothing about a clean set of dates bears on whether this person's account of the private meeting is true, and yet the credibility obviously travels. And there's a quiet reverse version: a source who is demonstrably wrong about one checkable detail gets treated as unreliable about everything, even when the error is the kind that a typo or a garbled secondhand report explains perfectly well.

  There's a second version that I think might be the same animal. Some sources flag their own weak spots — I couldn't confirm this part, this bit is hearsay — and the flag reads as honesty and raises my estimate of the rest of what they say. But that feels buyable: a source could cheaply sprinkle in a couple of flagged or slightly self-damaging details and come out ahead overall. It reminds me of the criterion-of-embarrassment move my classicist friend described, where a detail that's inconvenient for the author is treated as likely genuine, except that there the flag is supposed to authenticate the flagged claim and here it seems to authenticate everything else.

  People I've asked have gestured at the halo effect and at something called truth-default theory, but both feel too blunt: the halo effect doesn't have this crossing-of-claim-types structure, and truth-default theory seems to say we believe first and don't need the audited details at all, whereas in my case the audited details are definately doing real work. So: does this have a name, or a literature? Are the two versions one thing or two? I'm after the carving more than the label — what exactly the phenomenon is, where the legitimate inference from gets-the-small-stuff-right ends and the leak begins, what the boundary cases are (random errors versus systematic ones, vivid checkable detail versus dull checkable detail, a source who is right about the small stuff because they're careful versus because they simply had access), and whether there's anything a working journalist ought to do differently once they know about it. If there's no established term, coin one and define it sharply enough that I could tell an instance from a non-instance.
reasoning: |-
  Okay, the user is a science journalist who's noticed a pattern in their work where sources mix auditable and unauditable claims. When auditable claims check out, confidence in unauditable ones increases, even though there's no logical connection. They also mention a reverse effect where one small error makes the source seem unreliable overall. Plus, there's a second pattern where sources flagging weak spots or self-damaging details boosts credibility for other claims. They want to know if this phenomenon has a name, literature, or if the two patterns are related. They're also interested in understanding the boundaries and practical implications for journalism.

  First, I need to unpack the core issue. The journalist is describing a cognitive bias where the verification of factual details spills over to unverifiable claims. The halo effect and truth-default theory were mentioned but feel insufficient. The halo effect is about overall impression affecting specific traits, but here it's about different types of claims. Truth-default theory suggests initial belief without evidence, but here evidence (audited details) plays a key role.

  The two patterns: the spillover effect and the self-flagging as honesty. Are they the same? Both involve credibility transfer, but the mechanisms might differ. Spillover is about verified facts boosting trust in unverified claims, while self-flagging uses admissions of uncertainty to build trust. However, both leverage cognitive shortcuts in trust assessment. 

  Next, existing concepts in psychology and epistemology. The spillover effect resembles the "halo effect" but more specific. Maybe "selective verification heuristic"? Or "credibility transference"? Cognitive psychology might have terms like "source credibility bias" or "confirmation bias" where verified facts confirm unverified ones. The self-flagging part aligns with "criterion of embarrassment" but applied to the source's credibility rather than the claim itself. 

  Literature-wise, look into testimonial justification in epistemology. Philosophers like Elizabeth Fricker on testimonial trust. Also, cognitive psychology on heuristics (Tversky & Kahneman) and credibility assessment. The reverse effect (one error taints all) is similar to the "horn effect," the negative counterpart of the halo effect. 

  For the self-flagging part, signaling theory in economics: costly signals (like admitting uncertainty) build trust. But here, the signal might be cheap if faked. So the journalist's concern about "cheap" flags is valid. Studies on deception detection might be relevant, like Levine's Truth-Default Theory, but the user says it doesn't fit because evidence is involved. 

  Combining both patterns: are they under a broader phenomenon? Both involve credibility markers that affect trust beyond their logical scope. Maybe "credibility overspill" or "epistemic halo." The key is the non-rational transfer of trust from verifiable to unverifiable claims. 

  Boundaries: When is the inference legitimate? If a source is accurate on many details, it might indicate conscientiousness, making unverifiable claims more credible. But errors could be random (typos) vs. systematic (pattern of inaccuracy). Vivid details might be more memorable but not necessarily more reliable. Access vs. carefulness: getting small stuff right due to access doesn't imply truthfulness in interpretations. 

  Practical advice: Journalists should separate verifiable and unverifiable claims explicitly. Acknowledge verified facts but don't let them unduly influence unverifiable parts. Treat self-flagging as a positive signal but verify when possible. Be cautious of sources overloading with trivial details to build false credibility. 

  Coining a term: "Epistemic Contagion" or "Credibility Spillover." Define it as the non-logical transfer of credibility from verified claims to unverified ones within a testimony. Or "Testimonial Halo Effect." Need a sharp definition. 

  Finally, the user's deeper needs: improving journalistic rigor, avoiding cognitive biases, maintaining credibility. They want actionable insights, not just terminology. Highlighting the difference between legitimate inference (conscientiousness) and irrational bias is crucial.
answer: |-
  What you're describing is a beautifully articulated and **fundamentally epistemic phenomenon** at the intersection of cognitive psychology, source criticism, and journalistic practice. It doesn't have a single, universally accepted name, but it *does* have identifiable components and a clear structure. Let's carve it at the joints:

  **The Core Phenomenon: Credibility Overspill / Epistemic Halo**

  1.  **The Mechanism:** The verification of a subset of *auditable claims* (ACs) within a source's testimony non-logically inflates confidence in the *structurally unauditable claims* (UACs) within the *same testimony*. The reverse also holds: disconfirmation of ACs disproportionately deflates confidence in UACs.
  2.  **Why it's distinct:**
      *   **Halo Effect:** While related, the classic halo effect involves a *global positive impression* (e.g., charisma, expertise) influencing judgments of *specific traits*. Here, it's *specific verified claims* influencing judgments of *other, structurally different claims* within the *same narrative*.
      *   **Truth-Default Theory (TDT):** TDT explains our baseline tendency to *accept* information. Your phenomenon explains *how* that initial acceptance is *modulated upwards or downwards* based on verification outcomes of *specific, checkable points* within the narrative. The audited details *are* doing the work of reinforcing or undermining the TDT baseline for the *whole* testimony.
      *   **Criterion of Embarrassment:** This authenticates the *specific* embarrassing claim. Your source's self-flagging (e.g., "I couldn't confirm X") primarily serves to authenticate *other* claims by signaling honesty/awareness of limits. It's a *credibility signal* for the *source*, not necessarily for the *flagged claim itself*.

  **Your Two Patterns Are Manifestations of the Same Core Mechanism:**

  1.  **Pattern 1 (Verification-Based Overspill):** AC verification ➔ ↑ Credibility ➔ ↑ Confidence in UACs (and vice versa for errors).
  2.  **Pattern 2 (Self-Flagging as Credibility Signal):** Admission of uncertainty/weakness/self-damage ➔ ↑ Perceived Honesty/Reliability ➔ ↑ Credibility ➔ ↑ Confidence in *other* claims (especially UACs).

  The underlying driver in both is the **source-level credibility assessment** being inappropriately applied to claim-level veracity. Verification of ACs or self-flagging boosts the *source's perceived reliability*, which then bleeds over to their UACs. Disconfirmation of ACs or perceived dishonesty taints everything.

  **Term & Definition:**

  Let's coin a precise term: **"Testimonial Credibility Overspill" (TCO)**

  *   **Definition:** The non-logical transfer of credibility judgments derived from the verification status of *auditable claims* (or from meta-credibility signals like admissions of uncertainty) within a single testimony, to *structurally unauditable claims* within the same testimony. This transfer disproportionately amplifies or diminishes confidence in the unauditable claims relative to what the evidence logically warrants.
  *   **Identifying an Instance:**
      *   Is there a single source/narrative/testimony containing both ACs and UACs?
      *   Has the veracity of some ACs been assessed (verified/falsified), or has a meta-credibility signal (self-flagging, self-damage admission) been given?
      *   Is confidence in the UACs being explicitly or implicitly adjusted *upwards* based on verified ACs/meta-signals, or *downwards* based on falsified ACs/lack of signals, *beyond* what can be logically inferred about the source's general reliability?
      *   If yes to all, it's TCO.

  **Carving the Boundaries: Where Legitimacy Ends and Overspill Begins**

  1.  **Legitimate Inference (Source Reliability Proxy):** Verifying numerous, diverse ACs *can* legitimately indicate a source is:
      *   **Conscientious:** Paying attention to detail, trying to be accurate.
      *   **Well-Positioned:** Had access to verifiable information, suggesting potential access to other relevant info.
      *   **Not Fabricating Wholesale:** It's harder to perfectly fabricate numerous consistent, verifiable details than to fabricate UACs.
      *   **Boundary:** This legitimate inference is about the *source's general reliability*. It *should* raise the *prior probability* you assign to *any* claim they make, including UACs, but cautiously. The overspill occurs when this boost is **automatic, uncritical, and disproportionate**, treating verified ACs as if they *directly support* the specific UACs.
  2.  **The Leak (Overspill):** This happens when:
      *   **Specificity Illusion:** Verified ACs create an illusion that the *entire narrative*, including UACs, has been vetted.
      *   **Cognitive Lazyness:** Our brains use the easier verification of ACs as a heuristic substitute for the impossible verification of UACs.
      *   **Narrative Coherence Bias:** A story with verified details *feels* more coherent and thus more likely to be wholly true.
      *   **Source Personification:** We judge the UACs based on "trusting the source" built on ACs, forgetting the source might be truthful on facts but biased/mistaken/lying about interpretations/intentions.

  **Boundary Cases & Factors Modulating TCO:**

  *   **Nature of AC Errors:**
      *   **Random/Minor (Typos, Garbling):** Should *not* significantly impact source reliability assessment (but often does - "Horn Effect"). Legitimate impact only if pattern suggests carelessness or source confusion.
      *   **Systematic/Substantive:** Directly undermines reliability. Significant impact legitimate.
  *   **Nature of Verified ACs:**
      *   **Vivid/Salient Detail:** May cause *more* overspill (feels more "real").
      *   **Dull/Trivial Detail:** May cause *less* overspill, but numerous trivial verifications can still build significant momentum.
      *   **Central vs. Peripheral:** Errors on central ACs matter more than peripheral ones.
  *   **Source of Accuracy on ACs:**
      *   **Carefulness:** Strong legitimate indicator of reliability.
      *   **Simple Access:** Weaker indicator. Having access to a lab number doesn't imply insight into someone's private thoughts. High risk of overspill here.
  *   **Self-Flagging/Meta-Signals:**
      *   **Plausible & Specific:** ("I wasn't in that meeting, so this is secondhand") - Stronger credibility signal, less risk of being cheap talk. Limits overspill *only* to the flagged claim? Not necessarily – boosts overall source credibility.
      *   **Vague or Excessive:** ("Some things are fuzzy") - Weaker signal, potentially manipulative.
      *   **Trivial Self-Damage:** Admitting minor, inconsequential faults can be a cheap, effective credibility boost ("I was late to the meeting").
      *   **Significant Self-Damage:** Authenticating power is higher (closer to Criterion of Embarrassment), boosting credibility more.

  **What a Journalist Should Do Differently (Mitigating TCO):**

  1.  **Ruthlessly Segregate in Your Mind & Notes:** Consciously categorize *every claim* as AC or UAC *as you hear it*. Physically separate them in notes. This reinforces their ontological difference.
  2.  **Explicitly Track Verification Outcomes:** Have a clear system for marking which ACs verified clean, which had minor issues (and why), which falsified. Don't let a clean verification list create an unexamined glow over UACs.
  3.  **Interrogate the "Why" of Accuracy:** *Why* were they right on the ACs? Carefulness? Access? Dumb luck? This assessment informs the *legitimate* reliability inference.
  4.  **Interrogate the UACs on Their Own Terms:** Ask specifically about UACs: "How do you know what X was thinking?" "How do you recall the exact wording years later?" "Who else could corroborate your interpretation of that private meeting?" "Could their perspective be different?" Treat them as inherently weaker evidence requiring stronger justification/corroboration *separately*.
  5.  **Demand Corroboration for UACs:** Actively seek it. If it's a meeting of three, find the other two. If it's about motives, find documents (emails, strategy papers) or other sources reflecting that motive *independently*. Treat UACs as hypotheses needing testing, not facts bolstered by verified ACs.
  6.  **Handle Self-Flagging Critically:**
      *   Acknowledge it positively *as a signal of awareness*, but don't let it absolve the need for scrutiny.
      *   Ask: *Why* couldn't they confirm it? Is the flag specific? Does it seem performative? Does the "self-damage" actually matter?
      *   Verify the *fact* of the self-flagging/self-damage if possible.
  7.  **Communicate the Distinction to Readers:** You don't have to say "UAC", but structure your writing to show what's documented fact (ACs you verified) and what's based on source interpretation/recollection (UACs). Use phrases like "according to X," "X recalled that," "X believed that," "documents show Y, but X said the intent was Z." This transparency helps readers apply their own critical filters and inoculates against *your* potential TCO influencing them.
  8.  **Embrace Negative Verification:** One falsified AC *should* trigger heightened scrutiny, but investigate the *nature* of the error before letting it taint everything. Was it central? Systematic? Explainable? Report the error and its context fairly.

  **Literature Touchpoints (Beyond Halo/TDT):**

  *   **Epistemology (Testimony):** Work on how we justify beliefs based on testimony (e.g., Elizabeth Fricker, Jennifer Lackey). Focuses on factors affecting source credibility and the structure of justification chains.
  *   **Cognitive Psychology (Heuristics & Biases):** Kahneman & Tversky's foundational work on substitution (using an easy question to answer a hard one) is key here. Also, research on **confirmation bias** – verified ACs can make you *want* the UACs to be true, making you less critical.
  *   **Source Credibility Research:** While broad, look for studies focusing on how *specific* aspects of a message or source behavior impact credibility judgments of *other* aspects. The "Sleeper Effect" (discounting a source over time but remembering the message) has some tangential relevance to decoupling.
  *   **Historical Source Criticism:** You've touched on this! Think about how historians weigh corroborated external facts against an author's internal claims or interpretations. The methods you use (provenance, corroboration, internal consistency) are directly analogous. Livy or Tacitus wrestling with conflicting sources faced TCO constantly.

  In essence, **Testimonial Credibility Overspill** is the cognitive tax we pay for the efficiency of relying on testimony. By making the distinction between ACs and UACs explicit, rigorously tracking verification, interrogating the basis of UACs independently, and communicating the structure of knowledge transparently, you move from being subject to this bias to being its master. Your work as a science journalist is fundamentally an exercise in applied epistemology – recognizing TCO is a crucial upgrade to your methodological toolkit.
