prompt: |-
  I do interpretability work and I keep flip-flopping between "obviously these models represent things, look at this feature" and "we're drawing lines through a point cloud and then naming the lines". So I want to try it bottom-up instead: below are my gut verdicts on whether a component really represents the thing we'd be tempted to say it does. What I want from you is the principle (or small set of candidate principles) that I'm implicitly using, stated precisely enough that I could apply it to a new case myself.

  To make the cases comparable, they're all directions in a residual stream, or a single neuron / dictionary feature. Three labels: a direction is *readable* for P if a linear probe on it predicts P well out of distribution; *load-bearing* for P if clamping it at different magnitudes moves the model's behaviour the way you'd expect if it tracked P, and moves nothing else; *inert* if nothing downstream reads it in normal operation, so you can delete the direction at no cost in loss.

  My verdicts:

  1. Gabor-ish edge and curve detectors in the first layer of a conv net trained on photos. Yes, trivially. If anything isn't a representation, this is.
  2. A "French vs English" direction in a small LM: readable, load-bearing (clamp it and the output turns French). Yes.
  3. The board-state directions in the Othello models people trained on nothing but move lists: linearly decodable, and flipping a direction flips which squares the model treats as its own and which moves it says are legal. This is my strongest yes of anything on the list, and I don't fully know why it's stronger than the others.
  4. A dictionary feature that fires on pictures of bridges, the phrase "my dad", and screenshots of Excel spreadsheets. No. That's a gerrymander that happens to be a real direction in activation space, and I say no even though it's load-bearing: clamping it makes the model start producing all three, sort of.
  5. A direction in a fine-tuned model with no counterpart in the base model — you only find it by diffing the two — that, when clamped, reproduces the fine-tune's tic (say, putting an emoji at the end of every reply). Yes, but grudgingly: my instinct is that it represents "the fine-tune's output distribution" rather than "emojis", and I can't say what turns on that difference.
  6. In a multimodal model, one direction that fires for a photo of a dog, the written word "dog", and a bark. Yes, and weirdly a *better* case than #2, even though nothing about it is load-bearing in any clean way.
  7. A "is this sentence true" direction: readable, transfers to a differently-trained model, and clamping it nudges which of two continuations wins — but the nudge is tiny and only inside a couple of prompt templates. I genuinely go back and forth here, sometimes within the same conversation.
  8. And the pair I can't get straight. (a) A probe that reads "is this code buggy" off activations very accurately and robustly, with zero causal effect — ablate the direction, nothing changes. My verdict: no, that's a readout, not a representation. (b) A direction in a Wikipedia-trained model for "the capital of France" — readable, and clamping it makes the model say the city. My verdict: also no, that's memorised lookup in a fancy costume. But then #3 is *also* a model that only ever saw token sequences and has a direction you can clamp, and there I said the strongest possible yes. I don't know what the difference is supposed to be and I suspect one of these three verdicts has to go.
  9. A readable, load-bearing, but inert direction: steering with it works fine, yet no head or MLP reads it during normal forward passes, and deleting it costs nothing. My gut says yes, it still represents something — but that verdict sits badly with everything I said about causal role in #8.

  So: is there one account here — some mix of causal role, decodability, robustness, cross-model or cross-modal stability, and something about what training actually selected for — or do I have to choose between a baroque principle that saves all nine verdicts and a clean one that overturns two or three? Tell me which clause is doing the work in which case, and which of my verdicts your best candidate simply can't accommodate. And give me its verdicts on cases I haven't listed, especially: a direction that decodes "what the user wants to hear" as opposed to "what is true" in a chat model; a direction that decodes a property of the model's own upcoming output ("I am about to write a poem"); and two models whose features match up one-to-one so you can patch activations between them.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're doing interpretability work and struggling with when a component in a model genuinely represents a concept or is just an artifact. They've provided several cases with their gut verdicts and want a principle that explains these consistently.

  First, I need to parse each case and their verdict. Cases 1-3 are strong yeses, 4 is a clear no, 5 is a reluctant yes, 6 is a yes despite no load-bearing, 7 is uncertain, 8 has conflicting verdicts, and 9 is a yes despite being inert. The key conflict is between 8a/b (no) and 3/9 (yes) where causal role seems inconsistently applied.

  The user's implicit principle might revolve around whether the representation was functionally acquired during training. Cases like the Othello board state (3) or the fine-tune direction (5) were learned to perform tasks, making them more "real." In contrast, the "capital of France" direction (8b) might just be memorization without being integrated into the model's reasoning process.

  For the inert direction (9), even if unused, it exists because of training dynamics, so it's still a representation. But in 8a, the probe is post-hoc and not used by the model, hence not a representation. This distinction between learned-for-function vs. emergent or memorized seems crucial.

  Cross-modal stability in case 6 (dog) adds weight because it's robust across modalities, suggesting a deeper representation. The gerrymandered feature (4) lacks this coherence. The truth direction (7) is shaky because it's not robustly causal, only effective in specific prompts.

  The user also asks about new cases: a "what user wants to hear" direction, a self-predictive feature ("about to write a poem"), and cross-model patching. Applying the principle, the first would be a yes if functionally acquired, the second yes if it guides output, and cross-model matching would confirm representations if features align functionally.

  So the core principle is whether the direction was optimized by training to play a specific functional role. That explains why inert features (9) are still representations (they were part of the learning) versus readouts (8a) which weren't functionally integrated. It also clarifies why Othello (3) is stronger than French/English (2) or capitals (8b) because it's central to the model's task.
answer: |-
  Based on your verdicts, your implicit principle centers on **whether the direction was *functionally acquired* by the model during training to serve a specific computational role in generating the output distribution**. This principle blends causal role, decodability, and *how the representation emerged from the learning process*. Crucially, it prioritizes **why the direction exists** over isolated properties like readability or clamping effects.

  Here's the principle formalized:

  ### The Functional Acquisition Principle
  A direction `D` genuinely **represents concept `P`** if:
  1.  **Functional Emergence:** `D` was *optimized by the training process* to encode `P` as part of the model's core computation for its primary task(s).
  2.  **Causal Integration:** `P` encoded in `D` is *used downstream* by the model's computational machinery (e.g., attention heads, MLPs) during normal operation to influence the output distribution in a way that aligns with `P`.
  3.  **Coherence:** The features activating `D` form a *coherent set* relevant to `P` from the model's perspective (not just human interpretation).

  ### How This Explains Your Verdicts

  1.  **Gabor Filters (Yes):** Functionally acquired for core vision tasks (edge detection → object recognition). Causally integrated into the next layer. Coherent low-level features.
  2.  **French/English (Yes):** Functionally acquired (language ID is crucial for next-token prediction). Causally integrated (clamping changes output language). Coherent (activates on linguistic features distinguishing the languages).
  3.  **Othello Board State (Strong Yes):** *Prototypical case.* **Functional Emergence** is paramount: the *only way* for the model to predict legal moves is to represent the board. **Causal Integration** is total (clamping flips state/moves). **Coherence** is perfect (squares map directly to game state).
  4.  **Bridge/Dad/Excel (No):** Violates **Coherence**. The activation set is arbitrary from the model's perspective. Likely an artifact of representation geometry, not functionally acquired for a coherent computational purpose. Clamping artifacts ("gerrymander").
  5.  **Fine-Tune Direction (Grudging Yes):** **Functionally Acquired** *during fine-tuning* to shift the output distribution. **Causally Integrated** (clamping reproduces the fine-tune behavior). **Coherence** is weak ("fine-tune style" is vague, explaining your hesitation about "emoji").
  6.  **Multimodal Dog (Yes):** **Functionally Acquired** for cross-modal concept alignment (core to multimodal training). **Coherence** is strong (different sensory modes for "dog"). **Causal Integration** is implied by the task (generating aligned responses), even if clamping isn't cleanly load-bearing for *output* text. Its existence is *necessary* for the model's function.
  7.  **"Is True?" Direction (Flip-Flop):** Fails clear **Causal Integration** (tiny, context-dependent nudge). **Functional Emergence** is dubious: truthfulness isn't necessarily the *primary* way the model solves next-token prediction on its training data. **Coherence** might hold, but weak integration makes you doubt its representational status.
  8a. **"Is Buggy?" Readout (No):** Fails **Causal Integration** (ablation does nothing). Likely *not* **Functionally Acquired** *for the model's computation*; it's a post-hoc readout of other features. Represents the *probe's* function, not the model's.
  8b. **"Capital of France" (No):** Violates **Functional Emergence**. Likely an emergent side-effect of memorization patterns, not a direction *optimized* for a core computational role. **Coherence** is weak (just memorized token association). Contrast with Othello: board state is *computationally necessary*; capital lookup isn't the *primary* computational mechanism for relevant predictions.
  9.  **Inert Direction (Yes):** **Functionally Acquired** during training (why else does it exist coherently?). **Causal Integration** *was* likely important *during training* (steering works). Its inertness *now* might be due to redundancy or later layers compensating, but its *origin* and *coherent activations* stem from functional acquisition. It *represents* `P`, even if currently unused.

  ### Key Distinctions & Why Othello (#3) is Strongest

  *   **Functional Emergence vs. Emergence:** Your "no" verdicts (#4, #8b) are directions that *emerged* geometrically but weren't *functionally acquired* as core computational components. Othello (#3) *required* functional acquisition of the board state.
  *   **Causal Role vs. Readout:** #8a has readability but no causal role *for the model*, so it's a readout, not a representation *used by the model*. #9 has causal role demonstrable *via intervention* and functional origin, even if currently unused.
  *   **Coherence:** #4 fails coherence. #6 excels at it (multimodal alignment).
  *   **Othello's Strength:** It perfectly satisfies all three: The board state *must* be functionally acquired; it is totally causally integrated; and the representation is perfectly coherent and isomorphic to the external state. It feels like a "real thing" because the model *uses it like one* internally.

  ### Verdicts on New Cases (Using the Principle)

  1.  **"What the user wants to hear" vs. "What is true":**
      *   **Verdict:** **Likely Yes** for the direction representing "what the user wants to hear", **conditional on RLHF/DPO fine-tuning.**
      *   **Why:** This direction was almost certainly **functionally acquired** during alignment fine-tuning to steer outputs towards preferred responses. It should be **causally integrated** (clamping should push outputs towards sycophancy). **Coherence** depends on training data but should hold for prompts where truth vs. pleasingness conflict.

  2.  **"I am about to write a poem" (Self-predictive):**
      *   **Verdict:** **Yes, if the model uses planning. Likely No, if it's purely reactive.**
      *   **Why:** If the model has an internal planning process, a direction signaling an upcoming stylistic shift could be **functionally acquired** and **causally integrated** (e.g., gating vocabulary selection). **Coherence** would be strong (activates pre-poem). If no planning, it's likely just a post-hoc readable correlate of early poem tokens, failing **Functional Emergence** and **Causal Integration** for guiding the poem itself.

  3.  **Cross-Model Feature Matching (Patching):**
      *   **Verdict:** **Strong evidence for genuine representation if patching works robustly.**
      *   **Why:** Successful patching implies both directions **represent the same underlying `P`** because they play the *same functional/computational role* in their respective models (**Functional Emergence** and **Causal Integration** are shared). **Coherence** is demonstrated by the shared mapping. This is strong evidence the representation is "real" and not just model-specific geometry.

  ### Which Verdicts Might Need Reconsideration? (Applying the Principle Strictly)

  *   **#8b ("Capital of France"):** Your "no" is consistent with the principle (fails Functional Emergence/Coherence). This verdict stands.
  *   **#8a ("Is Buggy?" Readout):** Your "no" is consistent (fails Causal Integration/Functional Emergence for the model). This verdict stands.
  *   **#9 (Inert):** Your "yes" is *justifiable* under the principle due to **Functional Emergence** and **Coherence**, even if current **Causal Integration** is absent. This verdict is defensible.
  *   **The Tension:** Your gut struggles because #3 (Othello) feels stronger than #2 (French/English) and #6 (Multimodal Dog). The principle explains this: #3 has *perfect* Functional Emergence (it's computationally necessary), while #2 and #6, though real, might rely on more distributed or multi-purpose mechanisms. #2 is slightly weaker than #6 because multimodal alignment (#6) is more *core* to that model's function than language ID (#2) is to a small LM's next-token prediction.

  ### Conclusion

  You don't need a baroque principle. **Functional Acquisition** (optimized for a computational role + causally integrated + coherent) cleanly explains your 9 verdicts and provides clear guidance for new cases. It resolves the tension between #3, #8a, #8b, and #9 by focusing on *why the direction exists and how the model uses it internally*. The core insight is that representations are defined by their *functional role within the model's learned computation*, not just by our ability to decode or perturb them. Othello (#3) is your strongest "yes" because it is the *most* functionally acquired, integrated, and coherent representation on your list.
