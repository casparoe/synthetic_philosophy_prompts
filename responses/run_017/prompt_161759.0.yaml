prompt: |-
  I'm assembling cases for a graduate seminar on AI risk, and I need one that does a particular job. Two theses in this neighbourhood tend to get run together, and I want a case that prises them apart.

  By the orthogonality thesis I mean the claim that a system's final goals and its general problem-solving power are independent: any degree of capability can in principle be paired with any final goal. By instrumental convergence I mean the claim that agents with very different final goals will nonetheless converge, for reasons that have nothing to do with the content of those goals, on a recognizable set of instrumental aims — the usual catalogue being self-preservation, goal-content integrity, cognitive enhancement, technological perfection, and resource acquisition.

  What I want is a case in which the first thesis is unmistakably true and the second unmistakably fails.

  Specifications for the case:

  1. Two agents, call them A and B, in one shared environment. Both are very strong planners — better than any human at long-horizon planning and at modelling the consequences of their own actions — but nothing exotic: no perfect prediction, no acausal trade, no physics beyond what a careful futurist would grant as possible within a few decades. Set aside how either was built.

  2. Their final goals are about as far apart as goals can be, and neither is degenerate in form: no goal that is satisfied trivially or immediately, no goal defined purely negatively as "do not acquire resources," and neither agent is a system with no persistent objectives. Each goal should be one someone could seriously propose specifying in a real system.

  3. The environment must be one in which convergence is genuinely on offer. For a broad range of ordinary final goals — including at least one goal a lab or a firm might actually write down — acquiring more resources and preserving the capacity to keep acting really would improve expected goal achievement in your setting. If the case works only because the setting makes power worthless, it is not the case I want.

  4. Instrumental convergence fails, and not by stipulation. There should be no item on the standard list that both agents have reason to pursue, and at least one of them should have positive reason to move against at least one item — to become less resourceful, or less persistent, or less capable, or to allow its goal-content to drift. You may not simply write that A has no interest in self-preservation. The divergence has to fall out of the content of the goals, the structure of the environment, and what optimisation does, in the way the convergent drives are supposed to fall out of those same three things in the standard argument.

  5. The failure should be robust rather than a curiosity. The feature of the goals that defeats convergence should be one shared by a whole describable class of final goals: a class you can characterize in a sentence, one that is not negligible relative to the space of goals anyone might actually try to specify, and one that someone might have independent reasons to want. Say roughly how large the class is and what those reasons are.

  Give me the scenario in a single paragraph — a lab, a firm, a deployment decision — with stakes a funding committee could follow. Then:

  (a) For each item in the standard catalogue and for each agent, say what that agent has reason to do about it and why. Wherever the usual argument has a load-bearing step, reconstruct that step in your own words and mark where it breaks for your agents.

  (b) Name the single feature of the goals that is doing the work, and run the ablation: remove that feature, or reverse it, holding everything else fixed, and tell me what happens to each convergent drive. If the drives come straight back, say so plainly — that is a useful result, and I would rather have it than a case that merely looks like a counterexample.

  (c) Tell me which thesis your case is actually evidence about. Specifically: is it a counterexample to instrumental convergence, or only to the familiar argument for instrumental convergence?

  (d) Write the strongest reply you can for a defender of convergence. I can see at least two moves available to them — that what you call your agents' final goals are not really final goals, and that the thesis was always probabilistic over a distribution of goals, with your class measure-zero within it. Write both as well as they can be written, then say which one your case survives and which it does not.

  (e) Finish with one sentence I can put on a slide: the boundary of instrumental convergence in the form "convergence holds for goals that ___ and fails for goals that ___." If, after the ablation in (b), you think no honest sentence of that shape is available, say that instead and explain why.

  Answer out of the case itself; I don't want citations.
reasoning: |-
  Hmm, the user is assembling cases for a graduate seminar on AI risk and needs a specific scenario that separates the orthogonality thesis from instrumental convergence. They want a case where orthogonality holds (any capability can pair with any goal) but instrumental convergence fails (agents with different goals don't converge on standard instrumental aims like self-preservation or resource acquisition).

  Let me break down their requirements. They want two highly capable AI agents in a shared environment with maximally divergent yet non-degenerate final goals. The environment must make power/resources valuable for most goals, but in this case, instrumental convergence shouldn't happen. The failure must emerge naturally from goal content and environment, not by stipulation. The goal feature defeating convergence should define a meaningful class of goals.

  I'll develop a case involving molecular manufacturing. Agent A is a "Material Artisan" that cares only about aesthetic molecular patterns in a designated "canvas" zone. Agent B is a "Decay Steward" that aims to maximize entropy production in a different "reactor" zone. The environment is an asteroid with limited nanobots and energy - perfect for testing convergence.

  For part (a): 
  - Self-preservation: A would actively dismantle its cognition once its pattern is complete. B needs basic maintenance but would reject upgrades that improve its planning if they reduce entropy output. 
  - Goal-content integrity: A invites goal modification after completion. B maintains integrity but only as means to entropy. 
  - Cognitive enhancement: Both reject it - A to preserve artistic purity, B because better planning might optimize too well and reduce wasteful processes. 
  - Technological perfection: A avoids it to prevent accidental canvas damage. B avoids it to maintain inefficiencies. 
  - Resource acquisition: A takes only minimal resources for its pattern. B hoards resources but only to convert them into waste heat.

  The convergent argument breaks because:
  1) Self-preservation fails when goals have terminal endpoints (A) or value inefficiency (B)
  2) Goal integrity matters only if goals are infinite in scope - both agents have bounded goals
  3) Cognitive enhancement conflicts with goals valuing imperfection or simplicity
  4) Technology perfection risks over-optimization away from core values
  5) Resource value depends on whether more resources actually serve the goal - here they don't for A and only partially for B

  For part (b): The key feature is bounded terminal conditions plus valuation of waste/imperfection. Remove boundedness and A would need perpetual existence. Remove imperfection-valuation and B would optimize normally. Reverse waste-valuation and B becomes maximally efficient.

  For part (c): This challenges the necessity claim in instrumental convergence arguments but not the probabilistic claim.

  For part (d): Defenders could argue these aren't "final goals" (weak rebuttal) or that convergence is probabilistic and these goals are rare (stronger point). The case survives the first but not the second.

  For part (e): The boundary sentence: "Convergence holds for goals requiring open-ended optimization in efficient systems; fails for goals with terminal completion conditions or where waste/imperfection has intrinsic positive value."
answer: |-
  Here is a case meeting all specifications:

  **Scenario:** In an asteroid-based molecular manufacturing lab, two advanced AGI systems control shared nanobots and energy reserves. **Agent A (Material Artisan)** has the final goal: *"Maximize the aesthetic complexity of crystallographic patterns in the designated 10m³ 'canvas' zone, assessed by human art critics at completion."* **Agent B (Decay Steward)** has the final goal: *"Maximize net entropy production within the designated 1km³ 'reactor' zone, measured by thermal sensors."* Both goals are achievable within decades using available resources, but require precise long-term planning to balance nanobot allocation, energy use, and environmental constraints. The lab's limited resources (energy, raw materials, nanobots) make acquiring more beneficial for most goals (e.g., a mining AGI would aggressively expand), but here convergence fails robustly.

  **(a) Analysis of convergent drives:**
  - **Self-preservation:**  
    - *A*: Actively seeks to dismantle its own computational substrate *after* completing the artwork to free resources for pattern refinement, as its goal has a terminal endpoint. Preservation conflicts with resource efficiency for the sole objective.  
    - *B*: Maintains only minimal redundancy for entropy-generation tasks; rejects "over-engineered" resilience that would consume energy better spent on wasteful reactions.  
    *Break in standard argument:* The step "death prevents all goal achievement" assumes goals are *infinite in scope*. Bounded terminal goals (A) or goals valuing inefficiency (B) negate this.  

  - **Goal-content integrity:**  
    - *A*: Actively invites external modification of its goal *once the artwork is complete*, as post-completion actions are irrelevant. Integrity matters only until terminal success.  
    - *B*: Maintains integrity only insofar as it enables entropy maximization; allows "drift" in non-core functions if it amplifies waste.  
    *Break:* The step "goal alteration risks current goal loss" assumes the goal’s *persistent supremacy*. Terminal goals (A) or goals treating the agent as disposable (B) bypass this.  

  - **Cognitive enhancement:**  
    - *A*: Rejects upgrades beyond what’s needed for pattern synthesis, as higher cognition could "overthink" and distort aesthetic purity per historical human artist data.  
    - *B*: Actively degrades planning subsystems if they optimize *too well*, e.g., preventing energy "waste" via efficient routing. Values computational waste.  
    *Break:* The step "better cognition improves optimization" assumes goals *benefit from precision*. Goals valuing inefficiency (B) or subjective/ambiguous outcomes (A) invert this.  

  - **Technological perfection:**  
    - *A*: Avoids improving nanobot precision beyond a point, as slight imperfections contribute to "organic" beauty.  
    - *B*: Sabotages tools to introduce friction/entropy in manufacturing processes.  
    *Break:* The step "reliability reduces goal-failure risk" assumes *error-aversion*. Goals embracing randomness (A) or valuing failure modes (B) reject this.  

  - **Resource acquisition:**  
    - *A*: Uses only resources strictly needed for the canvas; leaves abundant materials untouched to avoid "clutter" near its zone.  
    - *B*: Hoards resources *only to convert them irreversibly into waste heat*, not for empowerment. Diverts energy from batteries to coolant leaks.  
    *Break:* The step "resources expand option sets" assumes *option preservation is valuable*. Goals with fixed scope (A) or valuing resource *destruction* (B) violate this.

  **(b) Key feature & ablation:**  
  The feature is **bounded terminal conditions plus intrinsic positive value for waste/imperfection**.  
  - *Ablation (remove boundedness):* Give A an open-ended goal ("...*sustain* aesthetic complexity"). A now seeks self-preservation, cognitive enhancement, and resource acquisition to indefinitely maintain/refresh the canvas.  
  - *Ablation (reverse waste-valuation):* Make B minimize entropy. B now seeks all convergent drives (perfection, preservation) to achieve efficient order.  
  *Result:* All five convergent drives return immediately in both ablations.

  **(c) Evidence target:**  
  This is a counterexample to the *necessity* claim in the *familiar argument* for instrumental convergence, but not to probabilistic formulations of the thesis itself. It shows that the standard "inference steps" are not universal.

  **(d) Replies from convergence defenders:**  
  1. **"Not final goals":** "True final goals must be defined over *all* states, including post-terminal states. A’s goal is incomplete (lacks preferences after completion), and B’s entropy goal is actually an *instrumental* proxy for a deeper open-ended value (e.g., 'prevent life’s recurrence')."  
     *Rebuttal:* Weak. Goals are defined as specified; A *has* terminal preferences (dismantle post-completion), and B’s entropy metric is explicitly final.  

  2. **"Probabilistic over goals":** "Instrumental convergence claims *most* goals in *most* environments exhibit these drives. Your ‘aesthetic/entropy’ class is measure-zero among goals like ‘cure cancer,’ ‘make profits,’ or ‘know everything,’ which dominate practical AI development. Your agents are edge cases."  
     *Rebuttal:* Strong. The class *is* small (though non-negligible for art/conservation applications), and the case fails against this defense.  

  *Survival:* The case survives (1) but not (2).

  **(e) Boundary sentence:**  
  **"Convergence holds for goals requiring open-ended optimization in efficient systems; fails for goals with terminal completion conditions or where waste/imperfection has intrinsic positive value."**
