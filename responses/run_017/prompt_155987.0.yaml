prompt: |-
  Please act as a professional philosopher who works on causation and explanation and who also knows how working historians actually write. Take the question seriously and don't shortcut it: start by brainstorming six or eight candidate principles — including ones you end up rejecting, with a sentence on why — before narrowing to the best one, and then give me (1) the principle stated precisely enough that I could apply it myself to a new case, (2) a clause-by-clause note on which of my verdicts forces that clause, (3) your principle's verdicts on the cases I haven't listed, and (4) an honest list of any of my verdicts it cannot accommodate, together with what I would have to give up to keep them.

  Some background on where I'm coming from: I'm a retired civil engineer with no philosophy training, I read a lot of popular history, and two friends and I argue about it in a pub reading group; I've realised I have firm, slightly inconsistent-feeling instincts about which causes a history ought to name, and I can't turn them into a rule. Here are my verdicts. Two people independently set fires at opposite ends of a warehouse, each fire alone sufficient to destroy it, warehouse destroyed: both of them caused the destruction, and an account that names only one isn't false but is misleading — I won't give that up. But in the version where two kids throw rocks at a bottle and Suzy's rock arrives first while Billy's would have shattered it a moment later, I say only Suzy's throw is a cause, even though the bottle was doomed either way just as in the fire case; these two are the pair I can't reconcile. With the Titanic I want to say the iceberg caused the sinking while the shortage of lifeboats did not cause the sinking but did cause the deaths, and I want those treated as the same kind of claim about different outcomes rather than as a real cause versus a mere background condition. In a stylised Chernobyl I happily cite the reactor design that misbehaved at low power and the operators who disabled safety systems to run a test, I cite the culture of secrecy uneasily, and I deny that a hypothetical earlier near-miss at a sister plant, covered up so that nobody in the control room knew, is a cause of the explosion — my friend insists it is, and I'll concede at most that it explains why they didn't act differently. In a stylised 2008 I cite subprime lending, the bundled securities, the ratings agencies and the leverage, and I flatly refuse to cite greed: greed is present in every boom and has no contrast. For the First World War I cite the Sarajevo assassination and the alliance commitments, I take the driver's wrong turn (if the story is right) to be a cause but not one worth putting in a book, and — this is the bit that bothers me — I want to say the alliances mattered more, in some sense, than the wrong turn, even though the wrong turn probably did more to raise the probability that a war happened at all; so whatever "mattered more" means for me, it isn't just probability-raising. Methodologically I also hold that there is no such thing as the real cause or the root cause, that singular "the cause of X" talk is always a mistake, and yet I do rank the causes I cite.

  Here is the rule I've been trying out — please test it against these cases and repair it rather than just replacing it. Call a factor a live-swap cause of an outcome when there was some alternative to it that was live in the situation (something that plausibly could have happened, or that someone on the scene was actually considering) and, had that alternative obtained, the outcome would probably not have happened; and add a second clause, that it doesn't count if the outcome would have been produced anyway by a second route already moving independently of it. Clause one is why I reject greed, and clause two is why I reject Billy's rock, but as far as I can tell clause two also kills both arsonists, which I refuse to accept; and I can't see how either clause separates "is a cause" from "is worth citing in a history", which I'm now convinced are two different questions. There's also the case I flip-flop on weekly: imagine a submarine officer during a nuclear crisis who declines to launch when he could have — on Mondays I say his refusal caused there to be no war, and on Fridays I say nothing happened, there is nothing to explain, and causation of an absence is a category mistake, which then sits badly with my lifeboats verdict. So: fix my rule if it can be fixed, tell me which clause is hopeless if it can't, say what principle best captures the rest of the pattern, and give me its verdicts on the cases I haven't raised — whether "no war was fought on its soil" is a cause of a country's twentieth-century prosperity, whether a dam that held is a cause of the town's survival in a history of that town, and whether my grandfather's decision to emigrate in the 1920s is a cause of my being alive and, separately, whether it is worth citing anywhere. (I also half-remember an expression like INUS condition from some encyclopedia entry, but I couldn't reconstruct the definition, so don't assume I mean anything technical by it.)
reasoning: |-
  Okay, the user is a retired civil engineer who enjoys reading history and discussing it with friends. They have strong intuitions about what counts as a cause in historical explanations but find their instincts inconsistent. They provided several scenarios where they have firm verdicts but struggle to articulate a unifying principle. Their main challenge is reconciling cases like the two arsonists (both should be causes) versus Billy and Suzy's rocks (only Suzy's should be a cause), despite both involving overdetermination.

  The user wants me to act as a professional philosopher specializing in causation and historical explanation. They asked for a detailed process: brainstorm candidate principles, reject some, then refine to the best one. The principle must be precisely stated, include clause-by-clause justification based on their verdicts, apply to new cases, and honestly list any unaccommodated verdicts.

  First, I need to understand their core intuitions. They reject "the cause" as singular, insist on citing multiple factors, and rank them by importance beyond just probability-raising. They separate "is a cause" from "is worth citing," which is crucial. Their Titanic example shows they distinguish causes of different outcomes (iceberg caused sinking, lifeboats caused deaths). They reject constant factors like greed and background conditions like Chernobyl's near-miss unless directly influencing the event.

  Their provisional rule (live-swap cause) fails because clause two (no independent second route) excludes both arsonists, which they refuse. Also, it doesn't separate causation from explanatory relevance. Their flip-flop on the submarine officer shows tension about omissions causing absences, conflicting with their lifeboat verdict.

  I brainstorm several candidate principles: overdetermination-based, contrastive counterfactual, process tracing, causal mechanism, explanatory depth, and agency-based. Each has issues. Overdetermination handles arsonists but not Billy/Suzy. Contrastive counterfactual might handle both but struggles with omissions. Process tracing fits their Chernobyl and Titanic distinctions but may not rank causes. Explanatory depth captures importance ranking but is vague. Agency-based aligns with their pub discussions but may overemphasize human actions.

  I settle on a refined contrastive counterfactual approach with a causal pathway integrity condition. This combines their live-swap idea with a requirement that the factor actively contributes to the actual sequence. Key additions: explicit outcome specification, causal pathway integrity, contextually relevant alternatives, and separating causal status from explanatory weight.

  This principle accommodates most verdicts: both arsonists (but only if alternatives are live), only Suzy's rock (Billy's path blocked), iceberg vs. lifeboats, Chernobyl factors vs. near-miss, rejects greed. It handles their submarine dilemma by allowing omission as cause when action was contextually expected. For new cases: dam held isn't cause of survival (no positive contribution), grandfather's emigration is cause of user's existence, but explanatory relevance depends on context.

  Unaccommodated verdict: their sense that alliances "mattered more" than Franz Ferdinand's driver's wrong turn, despite probability-raising. The principle can't fully capture this "mattering more" beyond pathway integrity - they'd need to add explicit explanatory ranking criteria. Also, their insistence on always naming both arsonists requires accepting that alternatives needn't be equally probable, just contextually relevant.

  I present this as the best fit, with clear clauses, applications, and honest limitations - giving them tools for pub debates while respecting their sophisticated intuitions.
answer: |-
  Here's a systematic analysis based on your intuitions, designed to capture your core patterns while addressing the tensions. After brainstorming candidates, I'll refine your "live-swap" concept into a principle accommodating most verdicts, then test it rigorously.

  **Brainstormed Candidate Principles (With Reasons for Rejection):**
  1.  **Necessary Element of a Sufficient Set (NESS/INUS):** *(X is a cause if it's an Insufficient but Necessary part of an Unnecessary but Sufficient condition for Y).* **Rejected:** Fails your arsonist case (neither fire is necessary); struggles with Billy/Suzy (Billy's throw is part of a sufficient set but you exclude it).
  2.  **Pure Probability-Raising:** *(X caused Y if X raised the probability of Y occurring).* **Rejected:** Conflicts with Billy/Suzy (Billy raised probability), Titanic lifeboats (shortage raised probability of deaths), alliances/wrong turn (wrong turn raised probability more), and greed (greed always raises probability).
  3.  **But-For Causation:** *(X caused Y if Y would not have occurred but-for X).* **Rejected:** Fails arsonist case (neither fire is but-for); fails Billy/Suzy (Suzy's is but-for, Billy's isn't - but this *accidentally* works for you here); fails Chernobyl near-miss (explosion might have happened anyway).
  4.  **Agent-Centric Intervention:** *(X caused Y if an agent could have intervened to change X, thereby changing Y).* **Rejected:** Excludes non-agent causes (iceberg, reactor design); struggles with omissions (submarine officer); makes greed potentially citable.
  5.  **Salient Difference from Normal Background:** *(X caused Y if X was an abnormal departure from expected background conditions).* **Rejected:** Makes greed citable in 2008 if "normal" greed was lower; struggles with alliances (were they "abnormal"?); conflicts with your Titanic lifeboats verdict (shortage *was* abnormal).
  6.  **Contrastive Counterfactual (Simple):** *(X caused Y relative to alternative X' if Y occurs with X but not with X').* **Rejected:** Fails arsonist case (no single X' prevents Y); struggles with overdetermination generally.
  7.  **Causal Process/Mechanism Link:** *(X caused Y if X is part of the actual physical/spatial/temporal chain leading to Y).* **Rejected:** Excludes omissions (lifeboat shortage, submarine refusal); potentially includes Chernobyl near-miss via cultural chain.
  8.  **Explanatory Relevance (Vague):** *(X caused Y if citing X explains why Y happened).* **Rejected:** Too vague; doesn't constrain greed, near-miss, Billy, or distinguish causation from citation-worthiness.

  **The Refined Principle: Contrastive Counterfactual with Causal Pathway Integrity & Outcome Specification (CC-CPI-OS)**

  1.  **Principle Stated Precisely:**
      > **A factor X is a *candidate cause* of a specific outcome Y occurring in manner M at time T if and only if:**
      >   **(a) Outcome Specification:** Y and M are clearly specified (e.g., "sinking of Titanic" vs. "drowning deaths"; "explosion" vs. "release of radiation").
      >   **(b) Contrastive Alternative:** There exists a contextually relevant alternative X' (a "live swap" in the situation) to X.
      >   **(c) Pathway Dependence:** The actual outcome Y (in manner M at T) depended on the pathway triggered or sustained by X.
      >   **(d) Pathway Integrity:** The pathway initiated/sustained by X was integral to the actual sequence producing Y(M,T). It was not preempted or made redundant *by an independent, active pathway already ensuring Y(M,T)* at the time X operated.

      > **Explanatory Weight:** Among candidate causes, weight depends on:
      >   - Robustness: How stable is Y(M,T) across variations of other factors *if X is held fixed*?
      >   - Specificity: How specifically does X account for M and T?
      >   - Scope: How many aspects of Y(M,T) does X explain?
      >   - Contextual Relevance: How salient/important is the contrast X vs. X' to the audience/context?

  2.  **Clause-by-Clause Justification (Based on Your Verdicts):**
      *   **(a) Outcome Specification:** *Forced by:* Titanic (sinking vs. deaths), Chernobyl (explosion vs. lack of mitigation). Separates causes of different outcomes.
      *   **(b) Contrastive Alternative (Live Swap):** *Forced by:* Rejection of greed (no live alternative "non-greed" in context), rejection of Chernobyl near-miss (not a relevant alternative *in the control room*), acceptance of omissions (lifeboats, submarine - "presence" is the alternative). Captures "live" element.
      *   **(c) Pathway Dependence:** *Forced by:* Suzy vs. Billy (Y depended on Suzy's pathway arriving first; Billy's pathway was blocked). Titanic sinking depended on iceberg pathway. Arsonist fires each provided independent, active pathways.
      *   **(d) Pathway Integrity (vs. Independent Redundancy):** *Forced by:* Billy's rock (Suzy's rock created an active, independent pathway making Billy's redundant *for shattering at T*). Titanic deaths depended on lifeboat shortage pathway *after* sinking. **This replaces your clause 2** to *save the arsonists*: each fire provided an independent, active pathway; neither was made redundant by the other *before* it contributed. Chernobyl reactor design and operator actions were integral pathways; the near-miss wasn't part of the active sequence. The alliances created the *potential* pathway; the wrong turn triggered the *specific* pathway activating it.

  3.  **Verdicts on Your New Cases:**
      *   **"No war fought on its soil" causing 20th-century prosperity?**
          *   *Candidate Cause?* **No.** (a) Prosperity (Y) is complex; (b) A "war fought" alternative is relevant; (c) Absence *might* be pathway-dependent (war could destroy infrastructure); **(d) Pathway Integrity FAILS.** The absence isn't an *active, integral pathway* sustaining prosperity; it's a *precondition* allowing other factors (investment, trade) to operate unimpeded. It lacks the positive, integral contribution required by (d).
      *   **Dam holding as cause of town's survival?**
          *   *Candidate Cause?* **Yes (for survival *during that flood*).** (a) Outcome: Survival of town during flood T. (b) Alternative X': Dam failing (live possibility). (c) Survival *depended* on the dam holding pathway. (d) The dam holding was the *integral, active mechanism* preventing destruction *for that flood*. It wasn't redundant (no other independent barrier was ensuring survival).
          *   *Explanatory Weight:* High robustness (survival very likely if dam holds), high specificity (explains survival *against that flood*), high scope (explains survival of everything vulnerable to flooding). Very likely worth citing.
      *   **Grandfather's emigration causing your existence?**
          *   *Candidate Cause?* **Yes (for your specific existence S at time T).** (a) Outcome: Your specific existence (S,T). (b) Alternative X': Grandfather staying (relevant). (c) Your existence (S,T) *depended* on the pathway initiated by his emigration (meeting your grandmother, conceiving your parent, etc.). (d) This pathway was integral and not redundant (no other independent pathway was ensuring *you specifically* would exist).
          *   *Explanatory Weight:* For *your specific existence*, robustness is low (tiny changes break the chain), but specificity is absolute (it *is* why you exist). Scope is narrow (only explains your existence, not broader phenomena). Worth citing? **Context-dependent.** In a family history/biography, absolutely. In a history of immigration's economic impact, probably not – other factors (economic pull, policy) explaining the *pattern* get more weight.

  4.  **Honest List of Unaccommodated Verdicts & Trade-offs:**
      *   **Your "Mattering More" (Alliances vs. Wrong Turn):** Your principle ranks causes (robustness/specificity/scope), but you intuit alliances "matter more" *despite* the wrong turn raising the probability *of war starting when it did* more. CC-CPI-OS *can* explain this: The alliances have higher **Robustness** (war likely across many scenarios if alliances hold) and **Scope** (explain why it was a *world* war) than the wrong turn (high **Specificity** for timing/location). *Trade-off:* To fully match your "mattering more" feeling, you must accept that explanatory weight is multi-dimensional and sometimes intuitive. Probability-raising alone isn't sufficient.
      *   **Insisting *Always* Naming Both Arsonists:** Your principle *allows* citing both (both are candidate causes), but doesn't *force* it. If an account names only one, you find it *misleading*. CC-CPI-OS explains *why* it's misleading (it omits an integral pathway), but doesn't make it *false* per se. The "misleading" judgment relies on an implicit norm of **explanatory completeness** for significant factors. *Trade-off:* To force *always* naming both, you'd need to add a strict completeness rule, which might be too demanding for complex histories.
      *   **Submarine Officer (Friday Feeling):** CC-CPI-OS sides with your Monday instinct (omission *is* a candidate cause: (a) Outcome: No Nuclear War at T. (b) Alternative X': Launching. (c) No War depended on the non-launch pathway. (d) Non-launch was integral (no other independent pathway ensured no war *right then*)). To keep your Friday feeling (causation of absence is a category mistake), you'd have to **reject omissions as causes entirely**, which would **force you to abandon your Titanic lifeboats verdict** (shortage caused the deaths). Pathway Integrity (d) treats actions and omissions symmetrically if they play equivalent roles in the causal network. Giving up omissions is a major cost given your other commitments.

  **Why CC-CPI-OS Works (and fixes your rule):**
  *   **Saves Both Arsonists:** Each fire has a contrastive alternative (not setting it), and each provides an independent, integral pathway satisfying (c) & (d). Your clause 2 failed here because it focused on the outcome happening *anyway*, not on the *active, independent pathway*.
  *   **Excludes Billy:** Billy has an alternative (not throwing), and his rock created a pathway (c), **but (d) fails:** Suzy's rock provided an independent, active pathway that *preempted* Billy's pathway *for shattering at T*, making Billy's pathway redundant *for that specific outcome timing/manner*.
  *   **Distinguishes Causation from Citation:** The core principle defines candidate causes. The weight criteria explicitly handle "worth citing," incorporating your contextual relevance ("live swap") and importance ("robustness/scope/specificity").
  *   **Handles Omissions Consistently:** Lifeboat shortage (deaths), submarine refusal (no war), and even "no war on soil" (fails as cause) are assessed by the same criteria as actions/events. This resolves your flip-flop via (d).
  *   **Accommodates Ranking:** The weight criteria capture why alliances "matter more" than the wrong turn (robustness, scope), even if the wrong turn was more probabilistically decisive for the exact timing.

  **In essence:** You need **Contrasts** (to exclude constants like greed), **Pathways** (to capture the actual sequence and exclude disconnected background like Chernobyl near-miss), and **Integrity** (to handle overdetermination like Billy/Suzy vs. Arsonists, and omissions). Specifying the **Outcome** is crucial to avoid conflation (Titanic sinking vs. deaths). Separating causal status from explanatory weight is key. This principle provides the structure your sophisticated intuitions demand. Now, go win that pub argument!
