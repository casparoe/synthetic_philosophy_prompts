  ### **Decision Tree: Is This Century a Hinge of History?**  

  #### **Node 1: Will almost nothing we do now still matter in ten thousand years?**  
  *(Starting point: Skeptical default. If Yes, hinge is unlikely; if No, hinge is possible.)*  
  - **Yes** → Leaf A: **"Negligible long-run effects"**  
    - *Description:* Human actions now are too transient to shape the deep future. What matters in 10,000 years will be determined by geological, cosmic, or unpredictable forces, not deliberate choices today.  
    - *Note:* Includes views that civilization will reset, forget, or evolve beyond our influence.  
  - **No** → Node 2  

  #### **Node 2: Does the long-run future (thousands+ years) hold vastly more of whatever ultimately matters (e.g., well-being, knowledge, moral value) than the present?**  
  *(Tests if the future’s scale could justify hinge status, regardless of influence.)*  
