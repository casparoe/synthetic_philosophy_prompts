  - **Yes** → Node 3  

  #### **Node 3: Can human actions this century change long-run outcomes in a predictable, non-washing-out way?**  
  *(Focus: Influence on events (e.g., survival, technology trajectories), not values. "Predictable" = we can estimate the sign/scale of effects.)*  
  - **No** → Leaf C: **"Washout or unpredictable influence"**  
    - *Description:* The big future matters, but our influence is swamped by chaos, entropy, or complex systems. Effects may reverse, cancel, or be too noisy to guide action. A hinge requires predictability we lack.  
  - **Yes** → Node 4  

  #### **Node 4: When assessing our influence, is the primary lever changing what happens (e.g., survival, resources) rather than what future beings will care about?**  
  *(Strict separation: "What happens" = events/outcomes; "what is valued" = values/standards. Choose the dominant focus.)*  
  - **Change what happens** → Node 5  
  - **Change what is valued** → Node 7  

  #### **Node 5: Is the window for influence closing due to fragility (e.g., runaway tech risks, institutional collapse) rather than future scale?**  
  *(Flags fragility vs. value density as distinct. Fragility = unique danger now; value density = vast future amplifies small choices.)*  
  - **Fragility** → Node 6  
  - **Value density** → Leaf F: **"Critical juncture (scale-driven)"**  
    - *Description:* The window is closing because the future’s vastness amplifies small actions now (e.g., setting initial conditions). Once passed, lock-in occurs. Not primarily about risk—it’s a one-off opportunity.  
    - *Note:* Differs from fragility by focusing on opportunity, not danger.  

  #### **Node 6: In this fragile period, is slowing down development/deliberation key to reducing risks?**  
  *(Applies only to fragility branch. Tests if caution is central to navigating the hinge.)*  
  - **Yes** → Leaf D: **"Slow-down-and-deliberate"**  
    - *Description:* We’re in a time of perils where rushing risks catastrophe (e.g., AI, bioengineering). Slowing down to deliberate is essential to survive and secure a positive future.  
  - **No** → Leaf E: **"Time of perils (decisive action)"**  
    - *Description:* Fragility demands urgent action, but slowing down is counterproductive—we must accelerate solutions (e.g., tech governance) to avert collapse. Decisiveness, not deliberation, defines the hinge.  

  #### **Node 7: Can we predictably shape what future beings will value (e.g., moral priorities, aesthetic standards)?**  
  *(For "change what is valued" branch. Tests if values are malleable now.)*  
  - **Yes** → Leaf G: **"Value lock-in"**  
    - *Description:* This century is a hinge because we can irreversibly shape future values (e.g., via AI, cultural evolution). Values will soon crystallize, making now uniquely pivotal.  
  - **No** → Leaf H: **Unnamed: "Values evolve independently"**  
    - *Description:* Values shift unpredictably over deep time. We might influence events, but not what future beings cherish—that’s shaped by contexts we can’t control or foresee.  

  ---

  ### **Leaf Positions Summary**  
  | **Leaf** | **Name/Description** | **View Type** |  
  |----------|----------------------|---------------|  
  | A | Negligible long-run effects | No hinge (skeptical entry) |  
  | B | Present-focused pragmatism | Future not value-dominant |  
  | C | Washout or unpredictable influence | Influence too weak/noisy |  
  | D | Slow-down-and-deliberate | Fragility response |  
  | E | Time of perils (decisive action) | Fragility response |  
  | F | Critical juncture (scale-driven) | Value-density window |  
  | G | Value lock-in | Values-focused hinge |  
  | H | Unnamed: "Values evolve independently" | Values-influence rejected |  

  ### **Marked Combinations**  
  - **Node 4 → "Change what happens" + Node 7 (values branch)**: Not directly reachable (tree forces separation). *Marked as unexplored*—few argue both are equally primary, but it’s coherent.  
  - **Node 5 → "Fragility" + "Value density" as the same**: Forced split. *Marked as incoherent in this tree*—they are distinct (fragility = danger, value density = opportunity), but your group can debate this.  
  - **Leaf H ("Values evolve independently")**: *Marked as unexplored*—rarely defended, but logically consistent if values are inherently unpredictable.  
  - **Node 3 → "Yes" + Node 5 → "No" but not value density**: Not possible (tree skips this path). *Marked as incoherent*—if influence is predictable and not fragility-driven, value density is the default alternative.  

  ### **Arguing Fairly for Category Error (Leaf A)**  
  The category error view (Leaf A) isn’t dismissed—it’s the starting point. It argues:  
  - Deep time reveals humanity as a fleeting layer in stratigraphic records. Our actions are negligible against geological/astronomical forces (e.g., asteroid impacts, solar evolution).  
  - "Influence" is hubris; civilizations rise and fall cyclically, with little carryover. Values and events in 10,000 years will be alien, shaped by contingencies we can't foresee.  
  - *Counter-argument in the tree*: By starting here, the tree forces proponents to engage, but Node 1 → "No" allows them to transition if they concede some influence.  

  This tree resolves conflation (e.g., influence on events vs. values) and clarifies why fragility vs. value density matters. By the end, your group should have distinct positions to debate, not just labels. Enjoy your session!
