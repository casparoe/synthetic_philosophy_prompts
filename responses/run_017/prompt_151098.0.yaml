prompt: |-
  I write about science and ideas for a general audience, and I am working on a piece about mid-century philosophers who intervened in public controversy. In a recently published encyclopedia of philosophy—the sort of reference work that compresses a whole episode into a single paragraph—I came across the following account of G. E. M. Anscombe's protest against Oxford's proposal to give Harry Truman an honorary degree after the atomic bombings:

  "Anscombe's objection was not a pacifist objection to war, or even to aerial bombing as such. It was a point about the concept of murder. Murder, for her, is not defined by the horror or scale of a killing but by the intentional killing of the innocent. The inhabitants of Hiroshima and Nagasaki were innocent in the relevant sense: they were not combatants and were not supplying Japan's war effort. The United States killed them deliberately, as a means of forcing Japan to surrender. That makes Truman a murderer, and for a university to honor him would be to honor a murderer. The standard excuses collapse under scrutiny. The defense that Truman only signed a piece of paper is like saying the man who hires an assassin has not killed anyone. The defense that, if killing harmless people is murder, then killing enemy soldiers in their sleep must also be murder, fails because Anscombe's distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not. Her deepest objection, however, was to the doctrine of double effect. Catholic moralists, she thought, had turned double effect into a loophole: provided you describe your target as a military installation and describe the deaths of nearby civilians as merely foreseen rather than intended, you may annihilate a city. Anscombe regarded this as sophistry. If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen. So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths. Once this is understood, her pamphlet looks like an early statement of a total rejection of nuclear weapons: it implies that any use of a nuclear weapon, any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense, because in every case the deaths of innocents are either intended or cynically foreseen."

  I am inclined to accept the first half: the bit about combatants and noncombatants, and about Truman's responsibility for what he ordered, matches what I have read elsewhere. But the paragraph on double effect and the closing claim about nuclear deterrence feel like a stretch to me, and I do not know enough about Anscombe's actual argument to say where the stretch begins. Could you give me an accuracy audit? Please go through the passage claim by claim and tell me what a careful defender of Anscombe would accept as a fair statement of her view, what they would describe as a simplification or a subtle misrepresentation, and what they would say is simply wrong. I am especially interested in three things: whether she really equated foresight with intention, or whether she kept a distinction between intended and merely foreseen death that both supporters and opponents like to collapse; whether her distinction between combatants and non-combatants is correctly described as a status distinction rather than a moment-by-moment judgment about dangerousness; and whether the passage's final implication—that her argument generalizes to all nuclear weapons, to nuclear deterrence, and to merely maintaining an arsenal—actually follows once the earlier misrepresentations are corrected. If the summary is unfair, tell me what principle or distinction the summary has lost, and what a corrected version of that closing claim would look like. In particular, say what her view implies about a threat to use a nuclear weapon that is never carried out: is that murder, as the summary's closing sentence suggests, or does her account of intention and action have resources to treat the threat as some other kind of wrong?
reasoning: |-
  Okay, the user is writing about mid-century philosophers and public controversies, focusing on Anscombe's protest against Truman's honorary degree. They found an encyclopedia summary and are skeptical about its interpretation of her views on double effect and nuclear deterrence. They want an accuracy audit of the passage, specifically on three points: foresight vs. intention, combatant/non-combatant distinction, and whether her argument generalizes to all nuclear weapons and deterrence.

  First, I need to recall Anscombe's actual arguments. She was an intentionality-focused ethicist, heavily influenced by Catholic doctrine but critical of how double effect was applied. The passage claims she equated foresight with intention. But from what I remember, Anscombe did maintain a distinction between intended and foreseen consequences, though she had a strict view on what counts as intention. She argued that if you foresee an outcome as certain and proceed, it becomes intentional. So in the bombings, since civilian deaths were inevitable, they were intended, not merely foreseen. The encyclopedia might be oversimplifying by saying she equated them entirely. A careful defender would clarify it's about the certainty of the outcome making it intentional.

  Next, the combatant/non-combatant distinction. The summary says it's a status distinction, not based on immediate dangerousness. That seems correct. Anscombe followed traditional just war theory where combatants are those engaged in hostilities, regardless of their current activity. So killing sleeping soldiers isn't murder, but killing civilians is. The encyclopedia got this right, but the user might be confused if they think dangerousness matters. Anscombe's view is about role, not momentary threat.

  The third point is the generalization to all nuclear weapons, deterrence, and maintaining arsenals. The encyclopedia claims her argument implies any use or threat is murder. This is where it's a stretch. Anscombe's pamphlet focused on Hiroshima and Nagasaki as direct killings. For deterrence, she might view it as conditional intent, but she didn't explicitly extend her argument there. Maintaining weapons as a threat could be seen as intending harm, but she didn't write about this. The encyclopedia's conclusion is an extrapolation, not her stated view. A defender would say deterrence involves conditional intention, which could be murderous, but it's not directly addressed. The user needs to know this is an inference, not Anscombe's explicit claim.

  The user also asks about threats that are never carried out. Anscombe would likely see a conditional intention to murder as morally wrong, possibly murderous in intent. But since no actual killing occurs, it's not murder per se but still gravely immoral. The encyclopedia's claim that it's "murder in exactly the same sense" is too strong. Her view has nuances: threats involve intending to kill innocents under conditions, which she might condemn, but it's distinct from actual murder.

  The user's deeper needs: They're writing for a general audience and want to accurately represent Anscombe without misrepresenting her arguments. They might be concerned about over-simplification in secondary sources and want to correct potential errors. They also need to handle the philosophical nuances accessibly, especially intention vs. foresight and the implications for modern nuclear policies. Ensuring they don't attribute claims to Anscombe that she didn't make is crucial, so highlighting where the encyclopedia overreaches is key.
answer: |-
  Here's a claim-by-claim accuracy audit of the passage, focusing on your specific concerns about foresight/intention, combatant status, and the generalization to nuclear deterrence/arsenals. The summary is strong on the core Hiroshima/Truman argument but makes significant missteps concerning double effect and overreaches dramatically on deterrence.

  1.  **"Anscombe regarded this as sophistry. If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen."**
      *   **Accuracy:** **Significant Misrepresentation/Over-Simplification.**
      *   **Careful Defender's View:** Anscombe absolutely *did* maintain a crucial distinction between *intended* effects and *merely foreseen* side effects. This distinction is foundational to the Doctrine of Double Effect (DDE), which she accepted *in principle* as sound moral reasoning. Her critique was *not* that foresight equals intention, but **how intention is defined and how easily it is abused**, particularly regarding *certainty* and *proximity*.
      *   **Her Actual Argument:** Anscombe argued that if a bad effect (like civilian deaths) is **foreseen as certain, necessary, and direct** to achieve the good effect (destroying a military target/ending the war), then it becomes **part of the intention**, not merely foreseen. She rejected the idea that you could "aim" narrowly at a military target while *knowing* the blast would inevitably annihilate the surrounding city and call the civilian deaths "merely foreseen." In such a case, destroying the city and killing its inhabitants *is* the means to the end (forcing surrender) and is therefore intended. She focused on **what the agent *chooses* or *adopts as part of their plan***. If you proceed with an action knowing that X *will* happen as a direct result, and X is necessary for your goal, then you intend X.
      *   **Principle Lost:** The summary collapses her nuanced (but strict) criteria for *when* foreseen effects become intended (certainty, necessity, directness as means) into a flat equivalence. She upheld the distinction but set a very high bar for claiming something was *merely* foreseen.

  2.  **"So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths."**
      *   **Accuracy:** **Largely Correct, *given her strict criteria*.** This accurately reflects her *conclusion* about Hiroshima/Nagasaki specifically. She argued that given the scale, certainty, and necessity of the civilian deaths for achieving the goal (surrender), labeling them "merely foreseen" was sophistry. The deaths *were* intended as part of the chosen means. Therefore, the killing of innocents was murder.
      *   **Nuance:** Her argument hinges on applying her strict view of intention to *this specific case*. She would *not* say that *any* civilian deaths near a military target are automatically intended murder; she would apply the criteria of certainty, necessity, and directness as means.

  3.  **"Her distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not."**
      *   **Accuracy:** **Correct.**
      *   **Careful Defender's View:** This is a precise and important point. Anscombe adhered to the traditional *jus in bello* distinction based on **status or role**: combatants (those formally engaged in hostilities) vs. non-combatants (civilians not directly participating). Danger is incidental. A sleeping soldier is still a legitimate target because they are a combatant; a civilian factory worker contributing to the war effort (but not actively fighting) is *not* a legitimate target because they are a non-combatant. The summary correctly identifies this as a status distinction.

  4.  **"Once this is understood, her pamphlet looks like an early statement of a total rejection of nuclear weapons: it implies that any use of a nuclear weapon... any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense..."**
      *   **Accuracy:** **Major Overreach / Unsupported Extrapolation.**
      *   **Careful Defender's View:** This is where the summary leaps far beyond Anscombe's argument in the Truman pamphlet ("Mr. Truman's Degree"). While her strict view of intention *could logically lead* someone to this conclusion, **Anscombe did not explicitly make this argument in that text, nor is it a necessary or simple implication.** The pamphlet is laser-focused on the *actual, deliberate killing of innocents* in Hiroshima and Nagasaki, condemning it as murder based on her analysis of intention.
      *   **Where the Summary Goes Wrong & Principles Lost:**
          *   **Focus on Actual Killing:** The pamphlet condemns an *act* of mass killing. Deterrence and merely possessing weapons involve *threats* or *preparations*, not necessarily the *act* itself. While gravely problematic under her ethics, they are not *murder* in the strict sense she used (the *intentional killing of the innocent*).
          *   **Intention in Deterrence:** Deterrence involves a *conditional intention* ("I *will* kill innocents *if* you attack me"). Anscombe's analysis in the pamphlet deals with *actual, direct intention carried out* ("I am killing these innocents *now* to make you surrender"). Condemning conditional intention as equivalent to actual murder requires a further step she doesn't explicitly take *here*. She would undoubtedly see it as gravely immoral, but labeling it "murder in exactly the same sense" blurs crucial distinctions in her philosophy of action.
          *   **Scale and Certainty:** Her Hiroshima argument relied on the certainty and scale making the civilian deaths *intended*. A "tactical" nuclear strike on a remote military target *might* potentially be described under DDE without automatically becoming murder under her criteria, depending on the circumstances (though she might find such scenarios implausible). The summary assumes *all* nuclear use inherently involves the intentional killing of innocents on the scale of Hiroshima, which may be practically true but isn't argued *in the pamphlet*.
          *   **The Threat Itself:** This is your specific question. Anscombe would view the **threat** (deterrence, maintaining an arsenal *as* a threat) as involving a **conditional intention to commit murder** (i.e., to intentionally kill innocents). She would condemn this as **profoundly evil and murderous in intent**, but it is **not *murder* itself**. Murder, in her strict definition, requires the *act* of intentional killing. The threat is the *intention to murder* under certain conditions, combined with the readiness to do so. It is a different, though intimately related, moral category – one of **culpable conditional intention and preparation for evil**. Calling the threat "murder in exactly the same sense" as dropping the bomb is a misrepresentation of her specific argument and her philosophy of action, which distinguishes between intention, action, and consequences.
      *   **Corrected Closing Claim:** "Anscombe's stringent analysis of intention, applied to Hiroshima and Nagasaki, leads naturally to profound questions about *any* action where massive civilian death is a certain outcome. While her pamphlet focused squarely on condemning Truman's *specific act* as murder, her underlying principles suggest that **any *actual use* of nuclear weapons likely to cause massive civilian casualties would also constitute murder under her criteria.** Furthermore, her philosophy implies that a **policy of nuclear deterrence, based on the conditional intention to murder innocents, is gravely immoral and involves a murderous intent,** even if it falls short of being the *act* of murder itself. Maintaining such an arsenal for the purpose of threat would share in this moral condemnation."

  **Summary of Key Findings:**

  1.  **Foresight vs. Intention:** Anscombe **upheld** the distinction between intended effects and merely foreseen side effects. She **did not equate** them. Her critique was that in cases where the bad effect is *certain, necessary, and directly instrumental* to the good effect (like Hiroshima), labeling it "merely foreseen" is invalid sophistry; it *becomes* intended. The summary oversimplifies this crucial nuance.
  2.  **Combatant/Non-Combatant Distinction:** The summary is **correct**. Anscombe's distinction is based on **status/role** (combatant vs. non-combatant), not momentary dangerousness.
  3.  **Generalization to Deterrence/Arsenals:** The summary's final claim is a **significant overreach** unsupported by the Truman pamphlet. While her principles *logically extend* to condemn the *actual use* of weapons causing massive civilian death as murder, and *strongly imply* that deterrence/threat involves a gravely immoral *conditional intention to murder*, it is inaccurate to state that her pamphlet argues deterrence or mere possession *is* "murder in exactly the same sense" as the act of dropping the bombs. **The threat itself involves *conditional intention*, which she would condemn as murderous and profoundly evil, but it is not the *act* of murder.** Her philosophy distinguishes between the intention, the act, and the threat.

  For your piece, you can confidently present the core argument against Truman based on murder of innocents and the status distinction. When discussing double effect, emphasize her *strict criteria* for intention rather than a collapse of the distinction. Regarding nuclear weapons broadly, note that her argument *strongly implies* condemnation of any use causing massive civilian death as murder, and *suggests* deterrence is based on a murderous conditional intention, but avoid stating she explicitly argued deterrence *is* murder "in the same sense" as Hiroshima. The threat is a different, though deeply connected, moral wrong under her framework.
