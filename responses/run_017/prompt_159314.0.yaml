  ### 2. Disagreements Table  
  The parties disagree on normative interpretations and scope. Each row states a crux, both positions, a neutral restatement, and the disagreement type (factual = F, normative = N, verbal = V).  

  | Crux | G's Position | E's Position | Neutral Restatement | Tag |  
  |------|--------------|--------------|---------------------|-----|  
  | Preference or constraint | Maximizing \(\mathbb{E}[\log W_{t+1}/W_t]\) is a rational constraint binding all agents, as it ensures survival and dominance. | Maximizing \(\mathbb{E}[\log W_{t+1}/W_t]\) is one preference (log utility), not a constraint; rationality requires maximizing \(\mathbb{E}[U]\) for actual \(U\). | Whether the expected-log rule is a universal requirement of rationality or only applies when \(U = \log W\). | N |  
  | The Deadline case | Asymptotic dominance justifies \(s^*\) at finite \(T\): it maximizes \(\mathbb{P}[W_T > K]\) for all \(K\), even if \(U\) saturates. | At finite \(T\) with saturated \(U\), \(s^*\) is irrelevant; optimality depends only on \(\mathbb{E}[U(W_T)]\), not tail probabilities. | Whether a.s. dominance at \(T \to \infty\) provides normative reason to use \(s^*\) at finite \(T\) when \(U\) saturates. | N |  
  | The Toll Booth case | Growth optimization (max \(\mathbb{E}[\log((W_t - c) \cdot R(s, \omega)/W_t]\)) remains myopic and defines a time-average growth rate, though wealth-dependent. | Fixed costs \(c\) make the problem non-multiplicative; growth optimization is ill-defined (ruin possible), and \(\mathbb{E}[U(W_T)]\) is primary. | Whether growth optimization yields a coherent myopic rule under fixed costs, and whether time-average growth remains normatively central. | N/F |  
  | The Signal case | Information's value is its growth-rate increase; willingness to pay is \(p\) such that \(\mathbb{E}[\log R_{\text{post}}(s^*_{\text{post}})] - \mathbb{E}[\log R_{\text{prior}}(s^*_{\text{prior}})] \geq \log(1 - p)\). | Information's value is its \(\Delta \mathbb{E}[U]\); only for \(U = \log W\) does this equal the growth-rate gain. | Whether information should be priced by growth-rate gain or utility gain. | N |  
  | The Federation case | Growth optimization binds persisting coalitions; dominance holds even if members leave, as the institution should prioritize its survival. | Growth optimization applies only to individuals; coalitions require contract enforcement, and fracture risk makes \(\mathbb{E}[U]\) for members primary. | Whether growth optimization is normative for institutions or only for individuals. | N |  

