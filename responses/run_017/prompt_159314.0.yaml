  ### 3. Cruxes  
  Settling these would resolve part of the dispute. Each crux includes a sub-question, agreed test case, predictions, and mixed outcome criteria.  

  #### Crux 1: Preference or constraint  
  - **Sub-question**: Is maximizing expected log wealth a rational constraint or a preference?  
  - **Test case**: An agent has \(U(W) = \min(W, W_{\text{sat}})\) (saturates at \(W_{\text{sat}}\)), horizon \(T\), and i.i.d. favorable gambles (\(s^* > 0\)). Compute \(\arg\max_s \mathbb{E}[U(W_T)]\).  
  - **G predicts**: \(s^*\) is near-optimal due to high \(\mathbb{P}[W_T \gg W_{\text{sat}}]\), unless \(T\) is small and \(W_0 \approx W_{\text{sat}}\).  
  - **E predicts**: A strategy staking \(s < s^*\) (to avoid \(W_t < W_{\text{sat}}\)) outperforms \(s^*\) if \(W_0 \approx W_{\text{sat}}\) or \(T\) is large.  
  - **Mixed**: \(s^*\) wins for small \(W_0\) but loses for \(W_0 \gg W_{\text{sat}}\); or performance gap is small.  

  #### Crux 2: The Deadline case  
  - **Sub-question**: Does asymptotic dominance justify \(s^*\) at finite \(T\) with saturated \(U\)?  
  - **Test case**: Same as Crux 1, with \(W_0 < W_{\text{sat}}\), \(T\) fixed. Compare \(\mathbb{P}[W_T(s^*) > K]\) vs. \(\mathbb{P}[W_T(s_{\text{util}}) > K]\) for \(K > W_{\text{sat}}\), where \(s_{\text{util}} = \arg\max_s \mathbb{E}[U(W_T)]\).  
  - **G predicts**: \(s^*\) yields higher \(\mathbb{P}[W_T > K]\) for all \(K\), even if \(\mathbb{E}[U(W_T)]\) is lower.  
  - **E predicts**: \(s_{\text{util}}\) yields higher \(\mathbb{E}[U(W_T)]\), and \(\mathbb{P}[W_T > K]\) is irrelevant for \(K > W_{\text{sat}}\).  
  - **Mixed**: \(s^*\) dominates tails but \(s_{\text{util}}\) wins \(\mathbb{E}[U]\); or neither dominates uniformly.  

  #### Crux 3: The Toll Booth case  
  - **Sub-question**: Does growth optimization remain well-defined and normatively central under fixed costs?  
  - **Test case**: Per-period fixed cost \(c > 0\), \(W_{t+1} = (W_t - c) \cdot R(s, \omega)\). Compute myopic growth-optimal \(s(W_t)\), time-average growth \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\) (a.s.), and \(\mathbb{E}[\log W_T]\) for finite \(T\).  
  - **G predicts**: \(s(W_t)\) maximizes time-average growth for paths avoiding ruin; \(\mathbb{E}[\log W_T]\) is secondary.  
  - **E predicts**: Ruin has positive probability; time-average growth is undefined for ruined paths. \(\mathbb{E}[\log W_T]\) is maximized by a non-myopic strategy.  
  - **Mixed**: Myopic \(s(W_t)\) maximizes growth for non-ruined paths but increases ruin risk; or ensemble/log-wealth optimization differs.  

  #### Crux 4: The Signal case  
  - **Sub-question**: Is information priced by growth-rate gain or utility gain?  
  - **Test case**: Pay fraction \(p\) for signal \(\xi\) before staking in a horse race. Compute \(p_{\text{growth}}\) (from \(\Delta \mathbb{E}[\log R]\)) and \(p_{\text{util}}\) (from \(\Delta \mathbb{E}[U]\)), for \(U \neq \log W\).  
  - **G predicts**: \(p_{\text{growth}}\) is normatively required; \(p_{\text{util}}\) is arbitrary.  
  - **E predicts**: \(p_{\text{util}}\) is correct; \(p_{\text{growth}}\) is only for log utility.  
  - **Mixed**: \(p_{\text{growth}} \approx p_{\text{util}}\) empirically; or they diverge but no dominance.  

  #### Crux 5: The Federation case  
  - **Sub-question**: Does growth optimization bind fracture-prone coalitions?  
  - **Test case**: \(n\) agents pool wealth; each may leave with share after any round. Compare growth-optimal vs. \(\mathbb{E}[\sum \log W_{i,T}]\)-maximizing strategies.  
  - **G predicts**: Growth-optimal pooling dominates long-run total wealth, even with defections.  
  - **E predicts**: Growth-optimal pooling invites defections; a conservative strategy yields higher \(\mathbb{E}[\log W_{i,T}]\).  
  - **Mixed**: Pooling wins without defections but loses with them; or neither dominates.  

  ---

  ### 4. Verbal Disputes  
  We resolve semantic disagreements by clarifying terms. Residual disagreements are normative.  

  - **"Rationality"**:  
    G uses "rationality" to mean adherence to rules ensuring long-run survival and dominance. E uses it to mean maximizing expected utility. This is verbal.  
    - **Reformulation**: Both agree that an agent with \(U = \log W\) should maximize expected log growth. Dispute: Whether this is rational for other \(U\).  

  - **"Growth"**:  
    G emphasizes time-average growth (path-wise). E emphasizes ensemble-average growth (expectation over paths at fixed \(T\)). This is verbal.  
    - **Reformulation**: Both agree time-average and ensemble-average differ mathematically. Dispute: Which is normatively primary.  

  - **"Optimality"**:  
    G uses "optimal" for strategies with maximal time-average growth. E reserves "optimal" for \(\mathbb{E}[U]\) maximizers. This is verbal.  
    - **Reformulation**: Both agree \(s^*\) maximizes \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\) a.s. Dispute: Whether this defines rationality.  

  **Residue**: After reformulation, the dispute reduces to:  
  > *Is maximizing expected log wealth a requirement of rationality (G) or merely one possible preference (E)?*  

  ---

  ### 5. Appendix: What Neither Side Claims  
  To prevent strawman arguments:  

  - **G does not claim**:  
    - That \(s^*\) maximizes \(\mathbb{E}[W_T]\) or \(\mathbb{E}[U(W_T)]\) for non-log \(U\).  
    - That asymptotic results justify \(s^*\) regardless of model uncertainty or non-i.i.d. structure.  
    - That fractional staking is optimal in non-multiplicative settings (e.g., with fixed costs).  

  - **E does not claim**:  
    - That \(s^*\) is irrational or suboptimal for log-utility agents.  
    - That asymptotic dominance is mathematically false.  
    - That fractional staking is never advisable.  

  - **Shared disavowals**:  
    - No claim that real agents must use \(s^*\);
    - No denial that \(s^*\) often approximates optimal \(\mathbb{E}[U]\) for moderate \(T\);  
    - No assertion that finite-\(T\) and \(T \to \infty\) are interchangeable.  

