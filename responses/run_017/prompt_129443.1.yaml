prompt: |-
  Bit of an odd one. I work in channel coding — LDPC mostly, plus some weird stuff for storage systems — and a freind in philosophy of biology talked me into giving a short slot to her lab group on whether the genome is literally a code or whether that's just a metaphor we got stuck with in 1960 and never shook. I said yes before thinking about it, and now I'd like to actually say something true instead of something that sounds good.

  Here's my problem. I'm fluent in sources, messages, encoders, decoders, codebooks, block length, redundancy, Hamming distance, synchronization and framing, and in the fact that Shannon deliberately threw meaning out of the theory in order to get a theorem. What I can't tell is how much of the philosophy-of-biology argument survives being said in that vocabulary. So please do the translation. Take the two or three positions you'd actually defend rather than the straw versions — the deflationary one where it's all causal correlation or mutual information and there's no content anywhere, the one where content comes from selection history / what the mechanism was selected to do, and the one where the codon-to-amino-acid lookup is a real code because the mapping isn't forced by the chemistry (frozen-accident flavoured) — and restate each one in my terms, as faithfully as you can. Don't attach names or papers to them and don't smuggle coding theory's assumptions in and call it translation.

  Three things I specifically want handled rather than gestured at, because I think that's where the residue is: (1) in my world the encoder and decoder are built by someone standing outside the system and fixed before any message goes through; in a cell the tRNAs and the synthetases that implement the mapping are themselves products of the DNA they decode, so the codebook is written in the code and the decoder has to be manufactured by the message before any message can be read. (2) A code in my sense is normative — a string can violate the code, and a decoder can mis-decode in a way that isn't just channel noise — and I genuinely can't tell whether a mis-incorporated amino acid is that kind of failure or just a chemical accident that the code has no opinion about. (3) My framework is mute about aboutness by design, so if "information" in the biological claims is doing semantic work, maybe it has no counterpart in my vocabulary at all — but I also suspect that a lot of the time it's mutual information with some extra romance, and I want you to tell me which is happening where. One more practical angle, since the room will be full of synthetic-bio people: people down the hall really do rewrite mappings, reassigning stop codons and slotting in noncanonical amino acids. Is the fact that we can do that evidence that the mapping was conventional all along, or does it only show that it was chemically contingent, and is that distinction load-bearing for "is it a code" or just a striking fact about stereochemistry?

  Give me a table with three columns — the claim in its home vocabulary / your translation / what got lost or had to be fudged — and then at most four sentences underneath answering whether the residue is blind spot in my framework or a sign the biological claim was less clear than it sounds. Under 700 words total, no footnotes and no citations: my library login expired years ago and I can't check anything you point me to, so argue instead of referencing.
reasoning: |-
  Okay, let me tackle this query step by step. The user works in channel coding (LDPC) and needs to explain whether the genome is literally a code or just a metaphor. They want three philosophical positions translated into coding theory terms, addressing specific sticking points: encoder/decoder bootstrapping, normativity of errors, and semantic vs. mutual information. 

  First, I need to unpack the core tension: coding theory assumes external designers and fixed codebooks, but biology has self-referential systems where DNA builds its own decoders. The user flagged this as critical - so any translation must confront how tRNA synthetases are themselves encoded. 

  For the three positions: 

  The "deflationary" view (all causal chains, no real code) maps cleanly to mutual information but ignores that biological systems treat errors differently than chemical noise. The residue is normativity - when a cell proofreads, it's acting like a decoder flagging violations, which pure information theory doesn't capture.

  The "selection history" view (function from past utility) introduces purpose without a designer. In coding terms, it's like the codebook co-evolved with the channel's noise profile. But translating "function" into decoder behavior is fuzzy - selection isn't an engineer optimizing Hamming distance.

  The "frozen accident" view (contingent but arbitrary mapping) fits the codon table well. Synthetic biology rewrites prove the mapping isn't chemically necessary. Yet calling it "arbitrary" glosses over how tRNA synthetases evolved constraints - it's conventional only if we ignore the interpreter's own coded origin.

  On the user's three pain points: 
  1. Self-referential encoding breaks coding theory's designer assumption. The residue isn't a blind spot - it shows biological "codes" are dynamic systems. 
  2. Misincorporation feels normative because selection shaped error correction. But without intent, "should" reduces to "doesn't survive well."
  3. Semantic claims often just dress mutual information in teleology. When philosophers say "genetic information," ask: mutual information between what and what?

  Synthetic biology's codon reassignment proves contingency, not convention - like changing QAM constellations. But since the cell's entire decoding machinery is genetically encoded, it's more like a self-modifying protocol. That distinction matters: real codes needn't have external designers, but they do require stable mapping rules, which biology maintains via self-perpetuation.

  Final translation principle: Where biology treats molecules as symbols (e.g., tRNA anticodons), coding theory applies; where it's just chemistry (e.g., diffusion), it doesn't. The boundary is whether the system evolved error detection/correction - that's the code-like residue.
answer: |-
  Here's a concise translation into your vocabulary, focusing on the core distinctions you requested. The residue highlights genuine conceptual friction.

  | Biological Claim                                                                 | Translation into Coding Theory Vocabulary                                                                                                 | Residue / Fudge                                                                                                |
  | :------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **Deflationary:** "Information" is just causal correlation / mutual information. | Mutual information exists between DNA sequence and protein structure, mediated by noisy chemical processes. No codebook; just physical dynamics. | The *normative response to error* (e.g., proofreading) is treated as just another physical process, not a violation. |
  | **Selection History:** "Meaning" derives from past selective success.            | The observed mapping (codebook) is a robust solution co-optimized over evolutionary time against channel noise (mutations, errors) and for survival. | "Selective success" isn't a decoding rule; it's a *post-hoc filter* on system outputs, not an intrinsic norm.       |
  | **Frozen Accident:** The codon mapping is arbitrary/conventional, not forced.    | The specific codon-amino acid assignments appear highly contingent (low mutual information between codon chemistry and amino acid chemistry). Many mappings could work. | Contingency ≠ Convention. Contingency is observed; convention implies *agreed rules*, but who agreed?            |

  **Addressing Your Specifics & Residue:**

  1.  **Self-Built Decoder:** Translation: The "codebook" (mapping rules) and "decoders" (ribosome, tRNA, synthetases) are *themselves encoded* within the noisy channel's output stream (DNA). The initial bootstrapping is a massive co-design problem where the message must specify its own interpreter under noise. **Residue:** Coding theory assumes pre-existing, stable encoder/decoder separation. Biology's self-referential loop is outside the standard framework – it's a system where the channel output *defines* the decoder *before* reliable decoding can occur. This is a fundamental extension, not a blind spot.

  2.  **Normativity:** Translation: Misincorporation is *both* a chemical accident *and* treated as an error by the system. Proofreading and repair mechanisms act as "decoders" applying a *corrective function* based on the expected mapping, not just passive noise filtering. **Residue:** Coding theory's normativity comes from the designer's intent. Biology's normativity comes from *historical selection pressure* favoring systems that maintain a specific mapping for survival. The "should" is defined by fitness consequences, not an external blueprint. This is a shift in the *source* of normativity.

  3.  **Semantics vs. Mutual Information:** Translation: Most claims of "semantic" genetic information reduce to complex, multi-layered mutual information (DNA sequence <-> functional molecule <-> selective outcome). The "romance" often smuggles in teleology (purpose). **Residue:** True "aboutness" (e.g., DNA being *about* the environment) isn't captured by mutual information alone. It requires the system *using* the signal *as* a representation, which biology arguably lacks outside neural systems. This is a limitation of applying pure information theory to biology.

  4.  **Synthetic Biology Rewrites:** Translation: Successfully reassigning codons demonstrates the *contingency* (non-forced nature) of the mapping. It shows the mapping can be altered while maintaining a functional channel, given compatible decoders. **Load-bearing?** Contingency is necessary but not sufficient for "code". Convention requires *agreement* within a system. Synthetic biology *imposes a new convention* externally. Biology's "convention" is the frozen accident + co-evolved decoder stability. Rewrites prove contingency, not inherent conventionality. This strengthens the "frozen accident" view but doesn't fully bridge to "code" without addressing the source of norms.
