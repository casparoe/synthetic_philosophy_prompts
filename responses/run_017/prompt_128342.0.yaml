  4. **Supportive**: Finite analogues. The different convergence values align with different randomization methods, reinforcing the user's argument.

  The user might be overrating the finite analogues worry since it supports their view. They're underrating the unfalsifiability issue, especially in a priori scenarios. Also, the re-embedding cases are problematic but not as critical as the subjectivity in symmetry group selection without physical processes.

