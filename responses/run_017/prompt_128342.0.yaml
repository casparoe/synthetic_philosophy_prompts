  Now, their worries: First, the maximum-entropy approach seems circular because differential entropy needs a background measure, which might reintroduce the same problem. Second, cases with less symmetry, like an ellipse or a disk projected onto a sphere, might break their solution. Third, finite versions of Bertrand's paradox converge to different probabilities (1/3, 1/4, 1/2), so finiteness doesn't dissolve the paradox. Fourth, demanding higher symmetry groups (affine, projective) could lead to no solution. Fifth, if indifference relies on physical randomization, it might not apply in cases like cosmology where no such procedure exists.

  The user wants these worries ranked from fatal to awkward, and to know which are genuine defeaters. They also want to know where their claim might be unfalsifiable and which worries they might be overrating or underrating.

  Starting with the fifth worry: Indifference as empirical physics. If the principle requires a physical randomization process, it can't handle a priori cases like cosmology. This seems critical because the user mentions anthropics and model selection. Without a physical procedure, how does one choose the symmetry group? If the symmetry group is chosen based on the problem's structure, that might be subjective. This could be a fatal flaw for their intended applications.

  Next, the background-measure circularity. MaxEnt needs a background measure, which is essentially choosing a parametrization. Since the user's approach uses symmetry groups to pick the measure, it might avoid this, but the circularity worry persists. If the background measure is chosen via symmetry, that could resolve it, but without a physical process, the choice might be arbitrary. This ties back to the fifth worry. Maybe this isn't fatal if symmetry groups are considered a priori, but that's debatable.

  Re-embedding cases, like the ellipse or sphere projection. For an ellipse, affine transformations can map it to a circle, but the pulled-back symmetry isn't rotational. The user's method would use the affine group, leading to a different measure. But if the problem is presented without specifying a randomization method, which symmetry group applies? This tests the robustness of their approach. If different embeddings require different symmetries, the principle might not give a unique answer without additional context. This could be awkward but manageable if the physical setup dictates the group.

  Finite analogues converging to different values. The user notes this shows the paradox isn't a continuum artifact. But their approach accounts for different randomization methods (vertex pairs vs. lattice points), each converging to the corresponding probability. So this actually supports their claim that the method matters. They might be underrating this—it's evidence for their view, not against it.

  Higher symmetry groups. Demanding invariance under larger groups might lead to no invariant measure. For example, the affine group on the plane might not have a unique measure for lines, or the projective group could be problematic. If no measure exists, indifference can't apply. The user might need to concede that not all problems have solutions, which limits the principle's scope. But as long as physical setups have natural symmetry groups, this might not be fatal. However, in a priori cases, choosing the group becomes an issue again.

