prompt: |-
  I'm writing a paper for a moral philosophy seminar on whether facts about brains should change how much a being counts, and I keep getting stuck before I even begin. My supervisor's line is that brain size is never what matters directly, only a stand-in for something else; but when I ask what the stand-in is supposed to be, I get a different answer every time (total neuron number, cortical neuron number, synaptic density, integrative complexity, richness of the conscious repertoire, capacity for suffering, higher-order or narrative capacities, or something relational). So before I commit myself to a view I want the specification. Assume the theory is meant to be usable as an input to actual decisions: how to weight a pig against a chicken against a shrimp against a human in an institutional cost-benefit exercise, and how to rank welfare research and spending when the evidence is thin. So it has to output something like a weight or at least an ordering, and it has to do so from measurements we could in principle gather. Given that purpose, write the desiderata such a theory has to meet.

  For the motivating cases, please work with the ones below rather than substituting your own favourites, since these are the ones my seminar actually fought about. First, the dissociation cases: as brains get larger, neuron density falls and tissue is allocated differently, so absolute size, total neuron count, and forebrain neuron count come apart, and any theory must say which currency it tracks and why, and what it says when the currencies disagree. Second, a stipulated duplicate-module species: its nervous system contains two complete, functionally redundant copies of the same processing machinery wired in parallel, so it has twice the neurons of its single-copy conspecific while remaining behaviourally indistinguishable and, stipulate, having one unified stream of experience rather than two; does its moral weight double? Third, a stipulated insulated-upgrade variant, where extra tissue is real, metabolically expensive, and computationally sequestered from anything valence-relevant. Fourth, a slow-giant species: enormous neuron numbers with signalling and integration an order of magnitude slower, so that it may live at a different subjective tempo — say what the theory owes us about whether what matters is richness per moment or number of moments per unit clock time. Fifth, variation within a single life: the same individual as a juvenile and as an adult, after a large-volume resection, and the sort of clinical case where adults are reported to function near-normally with drastically reduced cortical mass (take the case as stipulated if you doubt the reports). Finally, the very small: animals with brains of a fraction of a gram that nonetheless learn flexibly and reversibly adjust their behaviour.

  Alongside the cases, I want you to police some distinctions I think people collapse: whether neural quantity is evidence of status or constitutive of it; whether what varies is status at all rather than how much welfare is at stake; whether the quantity tracks a being's welfare or the badness of its death; and whether the theory is supposed to scale within a species as well as across them. For each requirement, give the case or consideration behind it and mark it non-negotiable or a preference of one camp. Then tell me which subset of the requirements you suspect cannot be jointly satisfied, and which single requirement does the most work in knocking out otherwise popular theories. Please keep the weight on the criteria rather than on scoring the views, and do not include citations, bibliographies, or further reading — I have library access and will do that part myself. Structure your answer in these sections and lengths: Currencies (what the theory's verdicts track, about 120 words), Requirements (numbered, each with its motivating case and a non-negotiable/negotiable tag, about 600 words), Where the List Breaks (about 200 words), The Most Exclusionary Requirement (about 150 words), and Scorecard (brief, about 200 words, on sentience-based views, aggregate-neuron or capacity-aggregating views, higher-order or personhood views, information-integration views, and relational or social views).
reasoning: |-
  Okay, the user is writing a moral philosophy paper on whether brain facts should influence how much a being matters morally. Their supervisor says brain size is just a proxy for something else, but that "something else" keeps changing—neuron count, complexity, suffering capacity, etc. The user needs a clear theory that can actually be used in decisions like weighting a pig vs. a chicken vs. a shrimp vs. a human in cost-benefit analyses, or prioritizing welfare research when evidence is thin. The theory must output weights or an ordering based on measurable data.  

  The user provided specific cases to test any theory: dissociation cases (where brain size, neuron count, etc., don't correlate), duplicate-module species (twice the neurons but same behavior/experience), insulated-upgrade variants (extra brain tissue that doesn't affect valence), slow-giant species (many neurons but slow processing), within-life variation (e.g., before/after brain surgery), and very small brains (like insects that learn flexibly). They also want distinctions policed: e.g., whether neural quantity is evidence vs. constitutive, status vs. welfare stakes, scaling within/across species.  

  I need to structure the response: Currencies (120 words), Requirements (600 words, numbered with cases and negotiable/non-negotiable tags), Where the List Breaks (200 words), Most Exclusionary Requirement (150 words), Scorecard (200 words on sentience-based, neuron-aggregate, higher-order, integration, and relational views).  

  For Currencies: The theory must track something measurable that directly links to moral weight. Common candidates include neuron count, complexity, or suffering capacity, but the dissociation cases show these often conflict. The currency needs to be unified and non-arbitrary.  

  Requirements: I'll list ~10 requirements. Non-negotiable ones must handle the user's cases without contradiction. For example:  
  1. Dissociation-resistance: The theory must resolve conflicts between size/neurons/complexity (motivated by dissociation cases; non-negotiable).  
  2. Duplicate-module verdict: Handling the double-neuron/same-experience case (non-negotiable; must not double weight arbitrarily).  
  3. Insulated-upgrade irrelevance: Extra metabolically costly but irrelevant tissue shouldn't count (non-negotiable).  
  4. Tempo-tractability: Addresses slow-giant species' subjective time (negotiable; camps disagree on per-moment vs. per-time).  
  5. Intraspecific invariance: Weight shouldn't change drastically within a life (e.g., after resection; non-negotiable for some, negotiable for others).  
  6. Small-brain coherence: Explains moral weight in tiny, flexible learners (non-negotiable).  
  7. Evidence-constitution distinction: Clarifies if neurons are evidence or the thing itself (negotiable; meta-ethical camps differ).  
  8. Welfare vs. status vs. badness-of-death: Separates these concepts (negotiable; but clarity is non-negotiable).  
  9. Interspecific scalability: Works across species (non-negotiable).  
  10. Intraspecific scalability: Applies within species (negotiable; controversial).  
  11. Operationalizability: Must output weights/ordering from measurable inputs (non-negotiable for user's purpose).  

  Where the List Breaks: Some requirements conflict. E.g., intraspecific invariance (after resection) vs. operationalizability (if weight depends on current neurons). Also, tempo-tractability forces a choice between per-moment richness or moment-count that can't satisfy everyone. The duplicate-module case might require rejecting neuron aggregation entirely.  

  Most Exclusionary Requirement: Dissociation-resistance is brutal—it forces a single currency, killing theories that equivocate (e.g., "complexity" without defining it).  

  Scorecard:  
  - Sentience-based views: Often vague; struggle with dissociation and duplicate-module cases.  
  - Aggregate-neuron views: Fail duplicate-module and insulated-upgrade tests.  
  - Higher-order views: Exclude small brains unjustifiably; don't scale down.  
  - Information-integration (e.g., IIT): Might handle dissociation but fail duplicate-module (double Φ implies double weight, contradicting stipulation).  
  - Relational views: Conflict with insulated-upgrade (social value ≠ intrinsic weight).  

  I'll keep it tight, focused on criteria, and avoid citations as requested.
answer: |-
  ### Currencies (120 words)  
  A theory must specify a single, measurable currency tracking moral weight directly, not via proxy chains prone to dissociation. The currency must resolve conflicts between candidates (e.g., absolute brain size vs. cortical neuron count vs. synaptic density) by identifying the fundamental property determining "how much" a being counts. For institutional decisions (e.g., pig vs. chicken weighting), this currency must be quantifiable through biological measurements (e.g., neuron counts, connectivity maps) or functional assays (e.g., learning speed). Crucially, it must distinguish whether neural properties are *constitutive* of moral status (e.g., neurons as units of welfare capacity) or merely *evidential* (e.g., correlating with consciousness). Without this, operational verdicts collapse under dissociation cases.

  ---

  ### Requirements (600 words)  
  1. **Dissociation-Resistance**  
     *Requirement*: The theory must specify which neural currency (size, total neurons, cortical neurons, etc.) is primary and explain why, resolving conflicts (e.g., larger brains with fewer cortical neurons).  
     *Case*: Dissociation cases where size/neuron count/regional allocation diverge.  
     *Status*: Non-negotiable. Institutional use demands unambiguous inputs.  

  2. **Duplicate-Module Neutrality**  
     *Requirement*: Weight must not increase solely due to redundant neural duplication if subjective experience is unified and unchanged.  
     *Case*: Species with two identical, parallel neural modules; same behavior/experience, double neurons.  
     *Status*: Non-negotiable. Stipulated unity of experience rules out weight doubling.  

  3. **Insulated-Upgrade Invariance**  
     *Requirement*: Metabolically costly but functionally irrelevant neural tissue must not increase moral weight.  
     *Case*: "Insulated-upgrade" variants with sequestered extra tissue.  
     *Status*: Non-negotiable. Forces distinction between resource use and moral relevance.  

  4. **Tempo-Tractability**  
     *Requirement*: The theory must explicitly address whether moral weight depends on subjective richness *per moment* or *moments per clock time*.  
     *Case*: Slow-giant species with high neuron counts but sluggish processing.  
     *Status*: Negotiable. Camps split on temporal metrics, but theory must commit to one.  

  5. **Intraspecific Invariance**  
     *Requirement*: Moral weight must not vary radically within a species across development, pathology, or individual difference without corresponding functional change.  
     *Case*: Juvenile/adult differences, post-resection functionality, normal cognition with reduced cortical mass.  
     *Status*: Non-negotiable for objectivist camps; negotiable for those tying weight strictly to current biology.  

  6. **Small-Brain Coherence**  
     *Requirement*: Must assign non-zero/non-trivial weight to very small, flexible learners (e.g., insects) if evidence suggests valenced experience.  
     *Case*: Fraction-of-gram-brained animals exhibiting reversible learning.  
     *Status*: Non-negotiable. Excluding all small brains a priori undermines empirical grounding.  

  7. **Evidence-Constitution Distinction**  
     *Requirement*: Must clarify whether neural properties *constitute* moral status (e.g., neurons as welfare substrates) or provide *evidence* for it (e.g., correlating with consciousness).  
     *Case*: All cases, as confusion here inflates operational ambiguity.  
     *Status*: Non-negotiable for usability; theories must specify their metaphysical basis.  

  8. **Welfare-Status-Badness Separation**  
     *Requirement*: Must distinguish whether neural metrics track (a) moral status per se, (b) welfare capacity (e.g., intensity of suffering), or (c) badness of death (e.g., lost future experiences).  
     *Case*: Slow-giant (welfare per moment vs. lifetime total) and duplicate-module (death badness if redundant modules).  
     *Status*: Negotiable in theory choice, but non-negotiable that the theory must specify which it targets.  

  9. **Interspecific Scalability**  
     *Requirement*: Must output comparable weights across species (e.g., human vs. shrimp).  
     *Case*: Cross-species weighting in cost-benefit exercises.  
     *Status*: Non-negotiable (core project goal).  

  10. **Intraspecific Scalability**  
      *Requirement*: Must clarify if weights can vary within a species (e.g., by age, health).  
      *Case*: Juvenile/adult/resection cases.  
      *Status*: Negotiable; egalitarians reject within-species variation, others accept it.  

  11. **Operationalizability**  
      *Requirement*: Must output weights/orderings from feasible measurements (e.g., MRI, histology, behavioral assays).  
      *Case*: All cases, especially thin-evidence welfare spending.  
      *Status*: Non-negotiable (user’s institutional context).  

  ---

  ### Where the List Breaks (200 words)  
  The requirements cannot be jointly satisfied under plausible constraints. **Intraspecific invariance** (Requirement 5) clashes with **operationalizability** (11) if weight depends on dynamic neural properties: post-resection humans with minimal cortex challenge theories tying weight strictly to current neurons. **Tempo-tractability** (4) forces a choice between "richness-per-moment" and "moments-per-time" that cannot reconcile slow-giant cases with intuitive temporal neutrality. **Duplicate-module neutrality** (2) and **insulated-upgrade invariance** (3) conflict with **interspecific scalability** (9) if aggregate neural counts (e.g., total neurons) are the currency, as they demand ignoring structural duplication or irrelevant tissue—yet for cross-species comparisons, aggregates are often proposed metrics. **Small-brain coherence** (6) pressures theories to include insects, but **dissociation-resistance** (1) may exclude them if the chosen currency (e.g., cortical neurons) is absent. Finally, **evidence-constitution** (7) risks circularity: if neurons merely *evidence* consciousness, weight derives from consciousness itself (unmeasurable); if *constitutive*, it must explain why duplicate modules don’t double weight without ad hoc appeals.  

  ---

  ### The Most Exclusionary Requirement (150 words)  
  **Dissociation-resistance** (Requirement 1) is the most exclusionary. It compels theories to select one primary currency (e.g., cortical neurons over brain size), eliminating views that treat multiple neural properties as independently significant (e.g., "aggregate capacity" theories). This requirement alone invalidates:  
  - Brain-size prioritization (fails when size inversely correlates with neuron density).  
  - Total-neuron-count views (undermined by duplicate-module cases).  
  - Synaptic-density theories (challenged by slow-giants with high density but slow processing).  
  By demanding a unified currency, it exposes vagueness in "complexity" or "richness" metrics, forcing operational definitions. Any theory failing here collapses under the seminar’s core cases, as conflicting currencies yield contradictory verdicts (e.g., a bee having "high" weight by synaptic density but "low" by cortical volume).  

  ---

  ### Scorecard (200 words)  
  - **Sentience-based views** (e.g., capacity for suffering): Struggle with dissociation (what neural property *is* sentience?) and duplicate-module cases. May satisfy small-brain coherence but lack operational metrics.  
  - **Aggregate-neuron/capacity views**: Fail duplicate-module and insulated-upgrade requirements by counting irrelevant neurons. Intraspecific invariance conflicts with resection cases.  
  - **Higher-order/narrative views**: Exclude small brains (failing small-brain coherence) and may not scale intraspecifically (e.g., infants). Tempo-tractability issues with slow giants.  
  - **Information-integration views** (e.g., Φ from IIT): Duplicate-module problems (double neurons may double Φ, violating neutrality). Operationalizability weak with current tech; dissociation-resistance depends on contested Φ calculations.  
  - **Relational/social views**: Conflict with insulated-upgrade invariance (social value ≠ intrinsic weight). Interspecific scalability questionable (e.g., weighting solitary vs. social species).  

  *Overall*: No view cleanly satisfies all non-negotiables. Sentience and information-integration theories best handle small brains but stumble on dissociation and duplication. Aggregate-neuron views are operationalizable but ethically implausible under stipulated cases. Higher-order and relational views fare worst on empirical tractability.
