prompt: |-
  hey, I've been messing around with the old sea battle problem in my spare time and I wrote up a short piece that tries to do something a bit different from the usual "is it true now or not" exchange. Draft first, asks after. Comments would be great.

  **Hardening**

  §1. Take B: there is a sea battle at noon tomorrow. The view I'm interested in — call it the gap view — says that right now B is neither true nor false, and that if the battle happens B *becomes* true at noon. Call that transition hardening. I want to know what hardening is supposed to be, because I think the natural answers either collapse the view into something else or generate a regress.

  §2. First answer: B hardens when its truthmaker shows up. The battle occurs, and that's what makes B true. Problem: the battle's occurring at noon is a fact that obtains at noon, and whether it obtains doesn't depend on when you ask. So if truth-at-a-time just tracks the truthmaker, then B's status never changes: it was already the case, at every earlier time, that the battle occurs at noon. That isn't hardening, that's determinism about truth with extra steps. So the gap theorist can't lean on truthmakers; whatever makes t1 different from t2 has to be something about t1's relation to t2, not about the battle.

  §3. So: what makes the future open at one time and closed at another? The only story I can see is the branching one — at t1 several histories run through t1 and then diverge, and B is true on some and false on others. But that's basically the Ockhamist picture, and it already gives you a perfectly good truth predicate: true at a time on a history. Once you've got that machinery the gap theorist's motivation starts to look thin, because the thing she wanted to avoid (a fact of the matter about which way it goes) is either back — as the thin red line marking which history is actual — or it was never really the issue, since the branching structure was doing the work all along. Call this the convergence argument. This is the section I'm least sure about.

  §4. Second problem, and the one I care about more. Take H: B hardens at noon tomorrow. When does *H* harden? Three options. (a) At noon, along with B. Then at every earlier time it's unsettled whether B hardens at noon — which requires an unsettled fact about the structure of settling itself, and you get the same question again one level up, forever. (b) Earlier, say at midnight. But then it was settled at midnight that B closes at noon, and I don't see how that's compatible with its still being unsettled at midnight which way B goes: a timetable that says "the question closes at noon" already excludes the histories on which the question closed at 6am, and those are exactly the histories where something about the battle got settled early. (c) Never — H has no hardening time, it's just always settled or always not. That's a dodge unless you say which.

  §5. The way out I want to try: accept (c) in a specific form. Call it Scheduled Settling. There is a determinate timetable saying when each future contingent proposition hardens, and the timetable is settled from the start; but the timetable says nothing about which way anything hardens. What grounds it: causal structure — a proposition hardens when the causal preconditions of its truthmaker are complete, and under indeterminism that's compatible with either outcome. So it can be settled now that B closes at noon without its being settled now whether B closes *true*. Settledness of the schedule, openness of the outcome.

  §6. Two things I'm worried about. First, this looks like a thin red line of a new kind: a thin *schedule*. If I'm allowed one piece of privileged structure, the Ockhamist will ask why she isn't allowed hers. Second, early-hardening cases: if the admiral signs an irrevocable order tonight, isn't B settled tonight even though its truthmaker shows up tomorrow? My causal story says yes, the schedule should read "closes at 9pm" — but then schedule and truthmaker come apart, and I'm not sure I can say what the schedule is about anymore.

  What I'd like:

  1. Is §2 fair, or is there a version of truthmaker-based openness that survives it?
  2. Is the regress in §4 real, or am I just confusing levels?
  3. Does Scheduled Settling collapse into Ockhamism, or into the "every future contingent is false" line, once you push on what grounds the timetable?
  4. §3 is the weakest bit — tell me what I'm missing there.
  5. Honestly: is any of this new? If Scheduled Settling is basically a view that already exists and has a name, describe that view in your own words and tell me where mine differs. Please don't give me reading lists, paper titles, or citations — I can't look anything up right now, and half-remembered references are worse than nothing. Same for the Aristotle material: I'm going from memory on the sea battle example, and I'd rather you leave my history alone than confabulate a citation. Just work with the argument as I've stated it.
  6. Line-level: is the move to "causal preconditions complete" in §5 doing real work, or is it hand-waving?

  Keep it all under about 800 words, and don't just be encouraging — if the central idea is definitly broken I'd rather find out now.
reasoning: |-
  Okay, the user is working on a philosophical problem about future contingents, specifically the sea battle example. They've proposed a "gap view" where statements about future events are neither true nor false until the event happens, and they're exploring what "hardening" (the transition to truth) entails. Their main concerns are whether their approach avoids regress, collapses into other views like Ockhamism, and whether their "Scheduled Settling" solution holds up.

  Hmm, the user seems deeply engaged with this—they've structured their thoughts carefully in sections and are clearly familiar with standard debates (Ockhamism, truthmaker theory). They're explicitly avoiding citations, which suggests they want a pure conceptual discussion rather than academic name-dropping. Their tone is analytical but slightly anxious about potential flaws ("definitely broken"), so they'd value directness over reassurance.

  Let me tackle their queries one by one. For §2: Yes, their critique of truthmaker-based openness seems sound. If truthmakers are timeless facts, then B's truth-value was always determined, undermining the "gap." No obvious workaround comes to mind—truthmakers do seem inherently atemporal here. 

  On §4's regress: It feels real, not confused. If hardening requires meta-hardening, and so on, it threatens infinite ascent unless anchored somewhere. Their Scheduled Settling tries to halt this by making the timetable itself always-settled, which is clever but risky (more on that later).

  For §3's convergence argument: They're right that branching histories naturally accommodate truth-at-a-time, but their "thin red line" concern might be overstated. Ockhamists don't necessarily need a privileged history—supervaluationism avoids it. Still, their core point stands: why prefer gaps over branching if both need metaphysical structure?

  Scheduled Settling (SS) is intriguing but fragile. The "thin schedule" worry is spot-on: privileging a timetable over a timeline might just relocate the problem. Worse, cases like the admiral's order expose tension—if hardening can precede the truthmaker, then "causal preconditions" aren't sufficient. SS either morphs into Ockhamism (by accepting settled facts) or collapses if the timetable lacks grounding. 

  Is SS novel? Not entirely—it echoes "fixed past" ideas in temporal logic, where the past is settled but future open. The twist is specifying hardening times via causal structure. But "causal preconditions complete" feels vague: does "complete" mean sufficient causes exist (which might imply determinism) or necessary causes? The latter preserves openness but might not explain why hardening occurs precisely at t. 

  Line-level: The causal move isn't hand-waving per se, but underspecified. It needs to clarify how causation fixes hardening times without implying outcomes—e.g., defining "preconditions complete" as the last point where intervention is possible. But then it risks circularity if intervention depends on... unsettledness. Tricky.

  Overall, the user's draft is sharp but SS needs more defense against the admiral-case counterexample and the "why not Ockhamism?" challenge. The causal grounding feels like the pivot—if strengthened, it could be distinctive.
answer: |-
  Here’s a direct engagement with your arguments and questions, keeping it tight:

  ### §2: Truthmaker Critique  
  Fair. If truthmakers are timelessly obtaining states of affairs (e.g., "the battle occurs at noon"), then B’s truth-value *was always determined* relative to noon. Invoking truthmakers *does* collapse into eternalism/determinism. No obvious gap-preserving escape here—truthmakers anchor truth to reality, not to temporal perspective.

  ### §3: Convergence Argument  
  Strong point. Branching-time models (e.g., Ockhamism/supervaluationism) handle unsettledness via quantification over histories. The gap view adds no clear advantage:  
  - If you reject a "thin red line" (privileged actual future), branching alone secures unsettledness without gaps.  
  - If you accept gaps *and* branching, you’re complicating the ontology without payoff.  
  Gap theorists *do* seem to want openness without the branching machinery, but §2 shows truthmakers won’t help, and branching undercuts the motivation.  

  ### §4: Regress for H  
  Real problem. Options (a) and (b) generate regress or over-constrain openness. Your (c) ("Scheduled Settling") is a substantive move—but §5’s causal grounding is key to avoiding collapse.  

  ### §5: Scheduled Settling (SS) & §6 Worries  
  **Core idea**: A meta-schedule fixes *when* propositions harden, but not *how*. Grounded in causal structure: hardening occurs when causal preconditions for B’s truthmaker are complete (e.g., all causal chains leading to the battle are irreversibly set).  
  - **Novelty**: Distinct from Ockhamism. Ockhamism settles *truth-values* relative to histories; SS settles only *hardening times* (via causal structure), leaving truth-values open until then.  
  - **Collapse risk?** Not obviously. SS doesn’t require a "thin red line" (no privileged outcome), nor does it make B false pre-hardening (it’s gappy).  
  - **"Thin schedule" worry**: Yes, the timetable is privileged structure. But it’s *structural* (global causal constraints), not *outcome*-privileging. Ockhamists can’t co-opt this without conceding openness.  
  - **Admiral counterexample**: Fatal if hardening *requires* truthmaker presence. **Fix**: Redefine hardening as causal irreversibility, not truthmaker existence. If the admiral’s order at 9PM makes the battle inevitable, B hardens *then*—truthmaker arrives later, but causes are locked in. Schedule and truthmaker *can* come apart, but SS is about causal closure, not truthmaker instantiation.  

  ### §5’s Causal Move: Working or Hand-Waving?  
  **Doing work**: It halts the regress by anchoring hardening times to objective causal structure. If "causal preconditions complete" means "no further causal inputs can affect the outcome," it explains why hardening happens at t without settling B’s truth-value prematurely.  
  **Weakness**: "Causal irreversibility" needs clarification. Is it metaphysical (indeterminism might forbid *any* point of irreversibility) or epistemic? SS needs this to be non-arbitrary.  

  ### Where SS Stands  
  1. Survives §2 (avoids truthmaker collapse by rejecting timeless truthmakers).  
  2. Halts §4’s regress via a meta-schedule grounded in causation.  
  3. Not Ockhamism (no history-relativized truth), not "always false" (gappy pre-hardening).  
  4. Novelty: It’s a **causal-constraint view** of temporal openness. Closest cousin is "fixed past" theories, but SS extends "fixity" to *scheduled hardening points* via causal structure.  

  ### Biggest Threats  
  - **Admiral-style cases**: If hardening can precede truthmakers, SS must define "causal irreversibility" rigorously.  
  - **Grounding the timetable**: If causal structure itself is unsettled, regress returns. SS must assume a settled causal framework (controversial, but not ad hoc).  

  **Verdict**: Not definitively broken. Scheduled Settling is a viable, novel approach if you:  
  - Clarify "causal preconditions complete" as *the point of causal irreversibility*.  
  - Accept that the causal schedule is metaphysically privileged (but not outcome-determining).  

  Focus there. Cut §3 if needed—it’s sound but not core to hardening. §5 is your engine.  

  ---  
  **Word count**: ~750. Hard truths: SS stands or falls on causal irreversibility. If that holds, it's promising. If not, regress looms.
