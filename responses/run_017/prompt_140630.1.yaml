  1. **Divide Students:** Form 4–5 teams (4–5 students each).  
  2. **Explain Rules (without Lakatos jargon):**  
     - *"Your team is a group of scientists defending a core theory. Each round, a new scientific observation (phenomenon) will be revealed.*  
     - *Before the reveal, you may submit a **sealed prediction** about the phenomenon. If correct, you score 1 point.*  
     - *If the phenomenon contradicts your theory, you must **patch** by adding an auxiliary assumption (costs 1 token).*  
     - *You can also **monster-bar** once per game to reject a phenomenon entirely.*  
     - *If you run out of tokens, you can’t patch. If your core struggles for 2+ rounds, you may abandon it—but I (the judge) can overrule based on your history.*  
     - *Goal: Survive with the most points."*  
  3. **Teams Declare Hard Cores & Starting Belts (5 min):**  
     - Each team writes 2–3 **hard core claims** (e.g., *"Gravity is a force," "Evolution is gradual"*).  
     - Each starts with 3 **protective belt auxiliaries** (e.g., *"Dark matter explains galactic rotation," "Epicycles refine planetary orbits"*).  
     - Display these publicly (whiteboard/posters).

  ---

  ### **Round Structure (5 Rounds × 10 min = 50 min)**  
  **Each Round:**  
  1. **Prediction Phase (2 min):**  
     - Teams discuss if they can predict the upcoming phenomenon. If yes, write prediction on a slip, seal it in an envelope, and hand to you.  
  2. **Reveal Phenomenon (1 min):**  
     - Draw and read a random phenomenon card aloud.  
  3. **Response Phase (4 min):**  
     - **If a team predicted correctly:** They reveal the sealed slip, score 1 point (novel fact → progressive shift).  
     - **If the phenomenon contradicts their theory:** They must:  
       - **Patch:** Add a new auxiliary to their belt (e.g., *"Quantum foam explains entanglement"*). Costs 1 token. Scores 0 points.  
       - **Or Monster-Bar:** Play their card to reject the phenomenon (e.g., *"Measurement error!"*).  
     - **No contradiction?** No action needed.  
  4. **Record & Reset (3 min):**  
     - Update scoreboard and belt sheets. Collect used monster-barring cards.  

  ---

  ### **Key Rules for "No Instant Rationality"**  
  1. **Abandoning Hard Core:**  
     - A team can only propose abandoning their hard core after **two consecutive rounds** of:  
       - Patching *without* scoring points,  
       - *And* facing another anomaly in the current round.  
     - Even then, the **Lakatosian Judge (you)** can grant a "reprieve" if:  
       - The team has past progressive shifts (points),  
       - Their patches show "promise" (e.g., not overly ad hoc),  
       - *Judge’s decision is based solely on public record (core/belt history), not truth.*  
  2. **Bankruptcy:** Teams with no tokens left *must* patch if contradicted. If they can’t, they lose.  

  ---

  ### **Scoring & Winning**  
  - **+1 point** per correct sealed prediction (progressive shift).  
  - **0 points** for patching or monster-barring (degenerating shift).  
  - **Win:** Team with most points after 5 rounds.  
  - *(Emphasize survival, not just winning—degenerating programmes can linger!)*  

  ---

  ### **Debrief (30 min)**  
  **Transition (2 min):** *"Now that you’ve lived it, let’s map this to philosopher Imre Lakatos."*  

  1. **Hard Core vs. Protective Belt (5 min):**  
     - *"Your ‘never abandon’ claims were the **hard core**. The auxiliaries you added were the **protective belt**—they absorb blows to protect the core."*  
     - Ask teams: *"Which of your patches felt desperate? Which felt clever?"*  

  2. **Negative vs. Positive Heuristic (5 min):**  
     - *"The rule ‘never abandon core’ is the **negative heuristic**. The urge to patch or predict is the **positive heuristic**—it drives how you modify the belt."*  
     - Use examples: *"When Team X added ‘dark energy’ to explain cosmic expansion, that was positive heuristic in action."*  

  3. **Progressive vs. Degenerating Shifts (10 min):**  
     - *"Scoring points = **progressive problem shift** (your prediction led to a novel fact). Patching = **degenerating problem shift** (you reacted to save the core)."*  
     - Highlight a moment: *"In Round 3, Team Y patched twice but still had points from Round 1—that’s why the judge granted a reprieve. Degeneration isn’t obvious in real time!"*  
     - Discuss: *"When did your programme feel ‘stuck’? Did you notice others degenerating?"*  

  4. **Monster-Barring & Anomalies (3 min):**  
     - *"Rejecting a phenomenon is **monster-barring**—dismissing anomalies instead of learning from them. Did this help or hurt you?"*  

  5. **Big Picture (5 min):**  
     - *"In real science, programmes take decades to degenerate. You felt this via the ‘2-round rule’ and judge reprieves. No one wakes up and says ‘my life’s work is degenerate’—it looks like one more patchable anomaly."*  
     - Connect to Lakatos: *"He argued science isn’t about falsification, but competing programmes. Yours competed for points, but in reality, they compete for credibility."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Vague Hard Core:**  
     - *Problem:* A team declares, *"Everything is energy,"* making falsification impossible.  
     - *Fix:* In setup, require cores to be *testable* (e.g., *"If your core can’t be contradicted by any phenomenon, it’s invalid"*). Reject vague cores upfront.  

  2. **Patching Forever:**  
     - *Problem:* Teams ignore the 2-round rule and patch endlessly.  
     - *Fix:* Enforce the rule strictly. After two failed rounds, announce: *"Your programme is eligible for abandonment—defend it to the judge or switch cores!"*  

  3. **Judge Favoritism:**  
     - *Problem:* Students accuse you of bias in granting reprieves.  
     - *Fix:* Base decisions *only* on public records (e.g., *"Team A has 3 points, so I grant a reprieve"*). Be transparent about criteria.  

  4. **Time Compression:**  
     - *Problem:* 90 minutes can’t replicate decades of scientific struggle.  
     - *Fix:* Acknowledge this in debrief: *"Real degeneration is slow—you felt a compressed version via tokens and rounds."*  

  5. **Overzealous Monster-Barring:**  
     - *Problem:* Teams use monster-barring early on minor anomalies.  
     - *Fix:* Let it backfire. Later rounds have juicier anomalies—they’ll regret wasting their card!  

  ---

  ### **What the Game Can’t Capture**  
  - **Decades-Long Timeframes:** Real appraisal involves generational shifts (e.g., Newton to Einstein). The game compresses this into rounds.  
  - **Social/Political Factors:** In reality, funding, prestige, and authority influence programme survival. The game focuses on internal logic.  
  - **Gradual Credibility Loss:** Degeneration isn’t binary (abandon/don’t abandon). It’s a slow erosion the game simulates with tokens and judge reprieves.  
  - **Cross-Programme Rivalry:** Lakatos emphasized competition between programmes. The game has indirect competition (points), not direct clashes.  

  ---

  ### **Why This Works**  
  - Students *feel* the frustration of patching vs. the thrill of predictions.  
  - The 2-round rule + judge mechanic forces them to confront how "degeneration" is never obvious in the moment.  
  - Debrief ties emotions (e.g., *"Why did I keep patching?!"*) to Lakatos’ framework.  

  Run this, and your students won’t just understand Lakatos—they’ll have lived him. Good luck!
