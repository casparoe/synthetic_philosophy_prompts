  ---

  ### **Game Title:** **Theory Survival**
  **Goal:** Teams protect their "hard core" against anomalies through patching, monster-barring, and predictions. They experience how degeneration isn’t obvious in the moment.

  ---

  ### **Materials Needed**
  1. **Phenomenon Cards (15 total):** Pre-written index cards describing scientific observations. Examples:
     - *Card 1:* "Light bends around massive stars (gravitational lensing)."  
     - *Card 2:* "Mercury’s orbit precesses 43 arcseconds/century faster than predicted."  
     - *Card 3:* "Particles decay slower when moving at high speeds."  
     - *Card 4:* "Action-at-a-distance occurs instantaneously in quantum entanglement."  
     - *Card 5:* "Earth’s climate warms despite stable solar output."  
     - *Card 6:* "A new particle has no mass but carries energy."  
     - *Card 7:* "DNA mutations accumulate faster in species near extinction."  
     - *Card 8:* "Time passes slower on GPS satellites than on Earth."  
     - *Card 9:* "Water boils at 90°C on a mountain top."  
     - *Card 10:* "Antimatter falls *upward* in a gravity field."  
     *(Include 5 more like these—mix of physics, biology, climate—to cover diverse anomalies.)*

  2. **Team Kits (per team of 4-5):**  
     - **Hard Core Declaration Sheet** (to publicly display 2-3 core claims).  
     - **Protective Belt Sheet** (to list auxiliaries; starts with 3 pre-written).  
     - **5 Belt Tokens** (coins/stickers; each patch costs 1 token).  
     - **1 Monster-Barring Card** (playable once to reject a phenomenon).  
     - **Prediction Slips & Sealed Envelope** (for submitting predictions).  

  3. **Shared Resources:**  
     - Scoreboard (tracking points per team).  
     - Timer (for rounds).  
     - Lakatosian Judge Token (a prop for you).  

  ---

