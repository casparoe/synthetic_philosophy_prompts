answer: |-
  Here's a precise diagnosis of where the argument fails, why rejecting that step preserves a strong separateness objection without collapsing prudence, and what the cost entails:

  **The Critical Failure: Step (5)**  
  *"If the separateness that carries the moral weight in (2) and (3) just is the holding of [psychological] relations, then a mere difference in degree cannot bear that weight..."*  

  This step commits a **category error** by conflating *diachronic identity* (persistence of a single person over time) with *synchronic separateness* (distinctness between persons at a given time). The moral significance of "separateness" in (2)/(3) is grounded in the **simultaneous existence of distinct centers of experience**, not the degree of connectedness between temporal stages of a single life.  

  ### Why (5) Fails:
  1. **The "Standpoint" in (1) Applies to Whole Persons, Not Stages**:  
     Premise (1) requires a gain to be "*for someone*" — i.e., a subject of experience. A *person* (understood as a temporally extended entity) is the bearer of this standpoint. The 20-year-old and 50-year-old are *stages of the same person*; the benefit/cost occurs within a single, continuous standpoint. When the 50-year-old gains, it *is* the same "someone" (the person) for whom things go better overall.  

  2. **Moral Patients vs. Temporal Parts**:  
     (2) correctly notes that "the aggregate is not anyone's good" because aggregates lack subjectivity. But within a life, the *person* is the "anyone" whose good is constituted by aggregated gains/losses over time. Temporal stages are not themselves moral patients; they are phases *of* a patient.  

  3. **The Normative Role of Unity, Not Degree**:  
     Psychological connectedness (e.g., memory) may explain *how* a person persists, but it doesn’t create the moral unity. What matters is that there is *one entity enduring through time*, whose interests are temporally integrated. Two distinct persons lack this unity *even if psychologically similar* (e.g., identical twins).  

  ---

  ### How to Reject (5) While Keeping (3) Strong:
  - **Reject the Inference**: Deny that psychological connectedness (even partial) is what grounds the moral force of separateness. Instead, affirm:  
    > *The separateness objection applies only to distinct moral patients (persons), and a person is a single, temporally extended entity whose stages share a unified normative standpoint.*  

  - **Cost of Rejection**:  
    You must accept that **persons are the primary units of moral concern**, and their persistence conditions (while possibly reductionist) entail that *whole lives* are the relevant domain for prudential reasoning. This:  
    - **Does not require non-reductionism**: You can still hold a Parfitian view that persons are "Relation R"-bundles (chains of connected psychologies), *provided* you argue that the *unity of the bundle* (not the strength of connections) is what matters morally.  
    - **Costs almost nothing**: Only the claim that "degree of connectedness directly scales moral significance" is abandoned. This is independently implausible (e.g., dementia doesn’t make you less of a person).  

  ---

  ### What the Separateness Objection Looks Like Post-Diagnosis:
  - **Against Utilitarianism**:  
    Aggregating welfare *across persons* ignores that gains/losses occur in distinct normative spheres (one per person). No one experiences the "sum"; it’s a fiction. Thus, sacrificing one for the greater good violates the moral boundary around persons.  
  - **Prudential Intact**:  
    Within a person, gains/losses are integrated into a *single* normative sphere. The person *as a whole* benefits from prudent sacrifices. There *is* a standpoint (the person’s life) from which the trade is an improvement.  

  ---

  ### Addressing Your Concerns:
  - **Why this isn’t "utilitarianism with constraints"**:  
    Utilitarianism (even constrained) permits interpersonal aggregation as pro tanto rational. Your preserved (3) denies aggregation is *ever* rationally or morally justified across persons — it’s a category mistake. Constraints *limit* aggregation; your view rejects its coherence entirely.  
  - **Why no "slide" remains**:  
    The equivocation in (5) is resolved: "separateness" in (2)/(3) refers to *interpersonal boundaries*, not *intrapersonal temporal boundaries*. The latter is irrelevant to (3)’s condemnation of interpersonal trade-offs.  

  ---

  ### Conclusion
  **Reject Step (5)**. The separateness objection relies on the distinction between persons (each a unified locus of welfare over time) and *not* on the psychological connectedness between stages. This costs nothing substantial: you keep a strong anti-utilitarian (3) without sacrificing prudence, and without needing non-reductionism. The bill is simply clarifying that "persons" — not stages or aggregates — are the irreducible subjects of welfare. The argument fails by treating temporal stages as morally analogous to persons, which overlooks that personhood establishes a unified normative horizon across time. 

  This leaves your separateness objection robust: utilitarianism’s error isn’t aggregating weakly connected stages, but aggregating across ontologically separate beings.
