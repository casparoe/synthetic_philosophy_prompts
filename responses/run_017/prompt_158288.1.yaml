answer: |-
  **Bottom line:** *Run Lola Run* is a powerful teaching tool because it *visually demonstrates* the mechanics of contingency while simultaneously exposing its limits through Lola’s agential learning, forcing students to grapple with your distinctions rather than settle for "small causes, big effects."

  ### Testing Your Distinctions Against the Film
  1. **Ampliative vs. Switching**  
     The film *privileges switching* but hints at ampliative potential.  
     - **Switching**: The dog on the stairs (Run 1) causes a delay, making Lola arrive late → Manni robs the store → Lola dies. Same delay in Run 2 → different guard reaction → Manni gets the money → Lola lives. The core "need 100,000 DM in 20 minutes" structure persists; the small event *switches* who acts (Lola/Manni), how (theft/begging/casino), and who dies/lives, but the crisis (debt, threat) remains fixed.  
     - **Ampliative**: The blind woman with the pram (Run 3) is key. Lola’s collision leads to the woman testifying to police, averting Manni’s arrest. This *creates* a new outcome: legal resolution vs. crime. Pause **the pram collision and subsequent flash-forward** to the woman in court—note how her role transforms a chance encounter into a structural intervention (legal system activated).  

  2. **Knife-Edge vs. Buffered**  
     The film shows knife-edge dependence but undermines it with buffered systems.  
     - **Knife-edge**: The timing of Lola passing the beggar (who later interacts with Manni). A 1-second delay alters whether Manni catches the tram, leading to police confrontation or escape. Pause **Manni’s tram encounter in all three runs**—highlight how micro-timing cascades into macro-outcomes (death/freedom).  
     - **Buffered**: The security guard at Lola’s father’s bank. In all runs, he obstructs her. His institutional role buffers him against Lola’s pleas (Run 1: he throws her out; Run 3: he’s distracted but still hostile). The *system* (bank security) absorbs shock; outcomes change only when Lola bypasses him entirely (Run 3).  

  3. **Token-Level vs. Structural-Level Contingency**  
     The flash-forwards explicitly tackle this—they’re the film’s masterstroke.  
     - Pause **the flash-forwards for the homeless man and the cyclist**. The homeless man wins the lottery (token-level windfall) but remains in a cycle of exploitation (structural poverty persists). The cyclist’s bike theft ruins his life (token disaster) but doesn’t alter the city’s crime rate. These scenes argue that contingency *is* distributed (all lives are shaped by chance) but rarely structural—it reshapes individual fates, not systems (economy, law).  

  ### Resistance: Is the Film Anti-Chaos?
  Yes, but productively. Lola’s learning (memory/skill across runs) *defeats* pure contingency:  
  - **Run 1**: Chaos dominates (dog → delay → death).  
  - **Run 2**: Skill emerges (she vaults the dog) but new chaos intervenes (ambulance crash).  
  - **Run 3**: Agency dominates—she anticipates obstacles (avoids dog, uses casino scream), and the pram collision becomes *productive*.  
  **Pedagogical value**: This progression doesn’t invalidate the trope; it complicates it. The film shows contingency *modulated* by agency and systems. Use it to ask: "When can agents/systems mitigate chaos? Does history allow 're-runs'?" This prevents reductive "butterfly effect" takeaways.  

  ### Do Your Distinctions Hold?
  They’re robust and distinct:  
  - **Ampliative/switching** asks *what kind* of change occurs (new possibilities vs. reshuffled ones).  
  - **Knife-edge/buffered** asks *where* change propagates (critical nodes vs. resilient systems).  
  - **Token/structural** asks *at what scale* change matters (individuals vs. institutions).  
  The film’s scenes map cleanly: the pram is ampliative, the tram is knife-edge, the flash-forwards are token-level. No collapse—they interrogate different layers.  

  ### What the Film Adds to the Debate  
  Visual branching lets us **SEE contingency as embodied, networked, and temporal**:  
  - **Embodied**: Lola’s physical exhaustion (sweat, stumbling) makes time/effort tangible—unlike abstract arguments.  
  - **Networked**: Flash-forwards reveal how one event radiates beyond the "main" narrative (e.g., the welfare couple’s divorce).  
  - **Temporal**: The split-screen clocks and rapid cuts emphasize how micro-events *compress* causality—we witness decay/amplification in real-time.  
  This shows contingency isn’t about "nails" but about *convergences in lived space and time*—a point texts struggle to convey.  

  ### Teaching Recommendations  
  1. **Pause these scenes**:  
     - Staircase dog (all runs) → Switching vs. ampliative (dog changes paths but only Run 3’s pram alters *systemic* outcomes).  
     - Homeless beggar/Manni timing → Knife-edge fragility (seconds alter lives).  
     - Welfare couple’s flash-forward → Token-level chaos (winning/losing changes nothing structural).  
  2. **Frame the film as a question**: "Does Lola’s third run prove contingency can be tamed? What would that require in history?"  
  3. **Highlight the dialectic**: The film *shows* radical contingency (Runs 1–2) then *subverts it* (Run 3)—perfect for debating your distinctions.  

  You won’t mislead students; you’ll force them into nuance. The film’s tension between chaos and control is exactly where historical causality lives.
