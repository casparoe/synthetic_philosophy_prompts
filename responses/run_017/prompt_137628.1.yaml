prompt: |-
  I teach an upper-level undergraduate seminar on Victorian literature and the history of secularism; there are 16 students and one 90-minute session available. I want a structured, runnable activity that makes participants feel the force of a particular claim about George Eliot's view of religion before I ever name it. The claim is that, in her fiction, the cognitive loss of Christian doctrine does not simply clear away religious practice, because devotional practices can leave behind what I call liturgical residue: a trained discipline of attention, confession, gratitude, and sympathy that continues to do moral work after the supernatural beliefs that first organized those practices have been abandoned. Put otherwise, belief and practice can come apart, and it is often the retained practice—not the abandoned doctrine—that preserves a person's or a community's capacity to respond to suffering with moral attention.

  The staged case should be an original scenario set in an early-Victorian English parish, not a reenactment of a specific scene from George Eliot, and it should work even if students cannot recall particular chapter or character names. Assume only that they know she lost her Christian faith but continued to write about religious feeling with sympathy; do not rely on their knowledge of her essays, letters, or secondary criticism. The participants should encounter the idea by being forced to decide, from inside the case, whether to continue devotional practices they no longer believe in, and then by facing a later situation in which the moral capacity sustained by those practices is either available or has atrophied. The rules, roles, constraints, or payoff scheme (using tokens rather than real money) should be arranged so that the felt cost of abandoning practice, and the moral resources retained by continuing it, show up in what participants actually do, not in anything the facilitator says up front.

  Please design the activity and provide: the framing and minimal setup script for the facilitator; the roles or constraints assigned to students; the sequence of forced choices or small deliberations, with a minute-by-minute timeline for the 90 minutes; any materials; the token payoff scheme and how it is tracked; and the exact point at which the facilitator remains silent so that participants run into the doctrine/practice distinction themselves. Then give a debrief that maps specific moments in the activity onto the distinction between abandoning doctrine and retaining practice, onto the liturgical-residue claim, and onto George Eliot's own religious views, and that states clearly what participants should come away seeing. Finally, say what will predictably go wrong the first time I run this—including any way participants might collapse the distinction between practice and doctrine too quickly, or treat continued practice as mere nostalgia—and how to handle it; and be frank about which feature of Eliot's position the activity cannot reproduce and must instead be supplied by the facilitator in the debrief. Do not include a bibliography, reading list, or citations; I will add the criticism myself.
reasoning: |-
  We are designing a 90-minute activity for 16 students. The goal is to let participants experience the idea that even after abandoning religious doctrine, the practices (liturgical residue) can continue to provide moral resources.

  Key elements:
  - Original scenario set in an early-Victorian English parish.
  - Students should not need prior knowledge of Eliot's works beyond her loss of faith and continued sympathy for religious feeling.
  - The activity forces participants to decide whether to continue devotional practices they no longer believe in, and then later face a situation where the moral capacity from those practices is tested.
  - Use tokens (not real money) to track payoffs.

  Structure:
  1. Setup: Explain the scenario and roles (5 min)
  2. Part 1: The Crisis of Faith (20 min) - Participants individually decide whether to abandon or continue practices after losing belief.
  3. Part 2: Daily Practice (20 min) - Participants engage in a simulated daily routine that either includes or excludes the devotional practice based on their choice.
  4. Part 3: The Moral Test (25 min) - A situation arises (a crisis of suffering) where the moral capacity (attention, confession, gratitude, sympathy) is needed. Participants act based on their prior choices.
  5. Debrief (20 min) - Map the activity to the concepts and Eliot's views.

  Roles: Assign each student a role in the parish. We'll have two groups: 
  - Group A: Those who continue practice without belief (8 students)
  - Group B: Those who abandon both practice and belief (8 students)

  But note: we want the choice to be individual. So we set up a scenario where each must choose.

  Alternative: We can have a scenario where each participant is a parishioner who has recently lost their faith. They must choose individually, but then we group them for the simulation.

  To make it runnable:

  **Scenario Setting:**
  - Early Victorian (1830s-40s) rural parish. The parish is facing hardship (economic downturn, poor harvest, or an outbreak of disease). 
  - Each participant is a member of the parish. They are all adults who grew up in the parish and were devout. Recently, due to intellectual doubts (influenced by new scientific and philosophical ideas, or personal crisis), they have lost their belief in Christian doctrine (e.g., the divinity of Christ, the afterlife, the efficacy of prayer). However, the parish still holds daily prayers and weekly services.

  **Materials:**
  - Tokens: Two colors (e.g., blue for "moral resource", red for "material resource" or something else). We can use paper tokens or beads.
  - Name tags with roles (optional).
  - Scenario cards for Part 3 (the moral test).
  - A timer.

  **Setup Script (5 minutes):**

  "Welcome. Today we are stepping into an early Victorian parish in rural England. The year is 1837. You are all members of St. Michael's parish. You have grown up in this community, and until recently, you were devout Christians. However, in the last year, each of you has experienced a crisis of faith. You no longer believe in the core doctrines of Christianity: the divinity of Christ, the existence of heaven and hell, the power of prayer to change God's will. Yet, the parish life continues: there are daily prayers at the church, weekly services, and community gatherings.

  The parish is facing a difficult time: a poor harvest has led to scarcity, and there is an outbreak of fever in the neighboring village that is starting to affect your community. Today, you will make choices about how to live in this context.

  In this activity, you will earn two kinds of tokens: 
  - **Blue tokens** represent your internal moral resources (like your capacity for attention, gratitude, confession, and sympathy). 
  - **Red tokens** represent your external resources (like time, money, social standing). 

  At the end, we will see how these tokens affect your ability to respond to a crisis. But note: the tokens are not the goal; they are a way to track the resources you have."

  **Part 1: Crisis of Faith (20 minutes)**

  - Each participant is given a choice card:

  ```
  You have lost your belief in Christian doctrine. However, the parish still holds daily prayers (30 minutes each morning) and a weekly service (2 hours on Sunday). 

  What do you do?
  Option A: Continue attending daily prayers and weekly services even though you no longer believe. (You will spend time but maintain the routine and community connection.)
  Option B: Stop attending. (You save time but break the routine and community connection.)

  Write your choice and a brief reason (1-2 sentences) on the card. Then turn it in.
  ```

  - Facilitator collects the cards. Then, without revealing individual choices, divides the class into two groups based on the choices (if the split is uneven, adjust groups to be as even as possible). 

  - Assign Group A (continue practice) and Group B (abandon practice) to different sides of the room.

  **Part 2: Daily Practice (20 minutes)**

  - Each group engages in a simulated routine for one week (in accelerated time). 

  - **Group A (continued practice):** 
    - They are given a short liturgical script (a morning prayer) that includes elements of confession, gratitude, and intercession for others. They will do this together for 5 minutes (simulating a week of daily prayers). 
    - Then they have 10 minutes to discuss in their group: "How do you feel about continuing the practice without belief? What do you gain or lose?" 
    - During this time, they also plan how they will spend their time (they have 10 red tokens each for the week, representing time). They must spend 3 tokens for daily prayers (5 days) and 2 tokens for the Sunday service. They can use the remaining 5 tokens for work or leisure. They record their token use.

  - **Group B (abandoned practice):**
    - They do not have a prayer routine. They have 10 red tokens (time) for the week. They must decide how to spend their time. They can work (which might earn extra red tokens for material gain) or engage in leisure. 
    - They spend 10 minutes discussing: "What do you do with the time you saved? How do you feel about no longer attending?" 
    - They record their token use: they start with 10 red tokens and can choose to allocate to work (if they allocate to work, they earn 1 extra red token per token spent, up to 5 tokens) or to leisure (no gain).

  - Then, both groups are told that they have encountered a situation that tests their moral resources (blue tokens). 

  **Part 3: The Moral Test (25 minutes)**

  - The facilitator introduces a crisis: "A family in the parish has been struck by the fever. The parents are ill and cannot work. They have three young children. They need help: someone to care for the sick, watch the children, and provide food and medicine."

  - Each group is given 5 minutes to discuss: "How will your group respond to this family? What actions will you take?"

  - Then, each group must write down their plan and assign actions to group members (if time allows, they can role-play the actions briefly). 

  - The facilitator then assesses the plans and actions in terms of moral resources (blue tokens). For each element of moral attention (as per the liturgical residue: attention, confession, gratitude, sympathy), the group can earn blue tokens if their plan demonstrates it. The facilitator has a rubric:

    - Attention: Do they notice the specific needs of the family? (e.g., not just giving money but considering the children's care, the medicine needed, etc.) -> 1 blue token per clear example.
    - Confession: Do they acknowledge their own limitations or past failures in helping? (This might be harder, but if they express humility or self-reflection) -> 1 blue token.
    - Gratitude: Do they express thankfulness for what they have and for the opportunity to help? -> 1 blue token.
    - Sympathy: Do they show genuine care and emotional connection? -> 1 blue token per instance.

  - Also, the groups must spend red tokens to carry out their plan (e.g., donating food, taking time to help). Each action they propose costs red tokens (e.g., 1 token per hour of help, 2 tokens for a meal, etc.). They can only spend what they have.

  - The facilitator awards blue tokens based on the plan and the discussion. Then, we compare the two groups.

  **Key Silence Point:** During the moral test, the facilitator does not explain how the practices might have helped. The participants must experience the difference in their own group's capacity. The facilitator only asks questions and assigns tokens based on observable actions and words.

  **Debrief (20 minutes):**

  1. Ask participants to reflect on the activity:
     - "What did you notice about the two groups' responses to the crisis?"
     - "How did your choice in Part 1 affect your group's actions in Part 3?"

  2. Then, map to the concepts:
     - The loss of doctrine (belief) was the starting point for everyone. But the retention of practice (Group A) maintained a 'liturgical residue' — the trained habits of attention (to others' needs), confession (reflecting on one's own shortcomings), gratitude (for what one has), and sympathy (feeling with others). 
     - Group B, having abandoned the practice, may have found their moral capacities atrophied — they might have been less attentive, less reflective, or less emotionally connected.

  3. Connect to George Eliot:
     - Eliot lost her Christian faith but retained a deep appreciation for the moral and emotional disciplines that religious practices instill. In her fiction, she shows characters who, even without belief, continue to draw on these practices for moral strength. For example, in *Middlemarch*, Dorothea Brooke's actions are guided by a sense of duty and sympathy that is rooted in her religious upbringing, even when she moves beyond traditional belief.
     - The activity shows that practice and belief can come apart, and the practice (the rituals, the routines) can preserve moral capacities even without the supernatural beliefs.

  4. What participants should come away seeing:
     - The cognitive loss of doctrine does not necessarily erase the moral resources built by practice. These resources (the liturgical residue) can be crucial in responding to suffering.

  **Predictable Problems and Handling:**

  1. **Problem:** Participants might collapse the distinction between practice and doctrine by assuming that continuing practice implies a hidden belief. 
     - **Handling:** In the setup, stress that everyone has lost belief. In Group A's discussion, if they express that they are just going through the motions, that's okay. The facilitator should note that and then later show that the motions themselves have effects.

  2. **Problem:** Participants might treat continued practice as mere nostalgia or social conformity, without seeing the moral training.
     - **Handling:** In the debrief, focus on the specific elements of the practice (confession, gratitude) and how they were activated in the crisis. Point out that even without belief, the structure of the practice shapes the mind.

  3. **Problem:** Uneven group dynamics: one group might have more vocal members, affecting the moral test.
     - **Handling:** Assign roles within groups (e.g., a note-taker, a spokesperson) to ensure participation. The token system should be applied consistently by the facilitator.

  4. **Problem:** The token system might feel artificial, and participants might game it.
     - **Handling:** Emphasize that tokens are a metaphor. In debrief, focus on the real moral and emotional dynamics.

  **Limitation of the Activity:**
  - The activity cannot fully reproduce the deep, long-term psychological and communal embedding of religious practice that Eliot portrays. In her novels, the liturgical residue is built over years and is deeply internalized. The activity compresses this into minutes. Therefore, the facilitator must explain in the debrief that the activity is a metaphor for a slow, accumulative process.

  **Timeline (90 minutes total):**

  - 0-5 min: Setup and introduction.
  - 5-25 min: Part 1 (Crisis of Faith) - including collecting choices and splitting groups.
  - 25-45 min: Part 2 (Daily Practice) - groups do their routines and discussions.
  - 45-70 min: Part 3 (Moral Test) - crisis introduced, group planning, and token allocation.
  - 70-90 min: Debrief.

  This design should allow participants to feel the force of the liturgical residue claim by experiencing the consequences of their choices.
answer: |-
  ### Structured Activity: "Liturgical Residue in St. Cuthbert's Parish"  
  **Duration:** 90 minutes  
  **Participants:** 16 students  
  **Core Goal:** Students experience how abandoning religious *doctrine* but retaining devotional *practices* preserves moral capacity (attention, confession, gratitude, sympathy), aligning with Eliot’s view of "liturgical residue."  

  ---

  #### **Facilitator Setup Script (5 minutes)**  
  *Stand at the front, setting a somber, reflective tone. Distribute role cards (see Materials) and tokens.*  
  "Welcome to 1838. You are parishioners in St. Cuthbert’s, a rural English village facing a cholera outbreak. Each of you has recently lost your Christian faith—you no longer believe in divine intervention, salvation, or answered prayer. Yet, the parish’s devotional routines continue. Today, you’ll navigate your daily lives and respond to a crisis. You hold two types of tokens: **blue tokens** (moral resources: attention, confession, gratitude, sympathy) and **red tokens** (material resources: time, money, energy). Keep them private. Your choices affect your tokens. We begin."  

  ---

  #### **Roles & Constraints**  
  - **Roles:** Each student draws a role card defining their profession (e.g., farmer, schoolteacher, midwife) and a trait (e.g., "compassionate but weary," "practical but isolated").  
  - **Constraints:**  
    - Everyone starts with **3 blue tokens** (baseline moral capacity) and **5 red tokens**.  
    - All must decide privately whether to retain or abandon two practices: **daily prayer** (10 mins/day) and **weekly confession** (30 mins/week).  
  - **Key Rule:** No one may disclose their belief status. Actions must align with role/traits.  

  ---

  #### **Activity Sequence (75 minutes total)**  
  **Part 1: Crisis of Faith—Private Choice (15 minutes)**  
  - *Facilitator:* "Silently decide: Will you continue daily prayer and weekly confession? You disbelieve, but practices are socially embedded. Write your choice and one sentence explaining it. Then, proceed to your practice stations."  
  - **Stations:**  
    - **Prayer Corner:** Kneel on cushions (symbolic gesture). Those continuing prayer spend **1 red token** (time cost) but may quietly reflect.  
    - **Confession Booth:** Sit facing a wall. Those continuing confession write one self-reflection (e.g., "I judged my neighbor yesterday").  
    - **Abstention Zone:** Sit at a bench. Those abandoning practices write how they’ll use saved time (e.g., "mend fences").  
  - *Silence Point:* Facilitator says nothing about moral consequences.  

  **Part 2: Daily Life Simulation—Resource Tracking (20 minutes)**  
  - *Facilitator:* "A week passes in the parish. Live your role. Interact freely but keep belief choices private. Earn/lose tokens based on actions."  
    - **Token Triggers:**  
      - **Gratitude:** Verbally express thanks for something = **+1 blue token**.  
      - **Attention:** Notice a "hidden suffering cue" (e.g., a cough, torn clothing) = **+1 blue token**.  
      - **Confession:** Admit a fault unprompted = **+1 blue token**.  
      - **Sympathy:** Comfort someone = **+1 blue token**.  
      - **Neglect:** Ignore a suffering cue = **-1 blue token**.  
      - **Material Action:** Work-related tasks (e.g., farming) = **+1 red token**.  
  - *Facilitator subtly places "suffering cues" (e.g., a student coughs; another drops a "broken watch" symbolizing lost time).*  

  **Part 3: Cholera Outbreak—Moral Test (25 minutes)**  
  - *Facilitator:* "Cholera strikes. A child is orphaned. Her name is Elara. She needs shelter, emotional support, and community care."  
    - **Group Task:** Form two circles (no belief-based sorting). Discuss how to help Elara for 10 minutes.  
    - **Individual Actions:** Each participant writes a commitment (e.g., "I will take Elara in" or "I will donate food").  
    - **Token Costs:**  
      - Shelter/comfort = **Spend 2 red tokens + 1 blue token**.  
      - Minimal aid (e.g., giving food) = **Spend 1 red token**.  
      - No action = **No cost but -1 blue token** (opportunity cost).  
    - **Payoff:** If the group collectively spends **8+ blue tokens**, Elara is "saved" (symbolized by a candle lit by facilitator).  

  **Part 4: Token Reconciliation (15 minutes)**  
  - *Facilitator:* "Reveal your tokens. Calculate net gains/losses. Did you retain more blue tokens by continuing practices? How did your choices affect Elara?"  
    - **Secret Vote:** "Raise hand if abandoning practices cost you blue tokens."  
    - **Group Reflection:** "Why might some retain moral capacity despite disbelief?"  

  ---

  #### **Materials**  
  - **Role Cards:** 16 cards with profession + trait (e.g., "Blacksmith: Stoic, but secretly grieving"; "Shopkeeper: Generous but overworked").  
  - **Tokens:** Blue/red poker chips or paper squares.  
  - **Stations:** Labels for Prayer Corner, Confession Booth, Abstention Zone.  
  - **Suffering Cues:** Slips with prompts (e.g., "Cough loudly," "Sigh heavily while working").  

  ---

  #### **Debrief (10 minutes)**  
  *Link activity to Eliot’s view:*  
  1. **Doctrine vs. Practice:** "When you abandoned belief (doctrine) but kept prayer/confession, you likely retained blue tokens. This mirrors Eliot’s point: practices train moral muscles *independent* of supernatural belief. What felt different for those who kept practices?"  
  2. **Liturgical Residue:** "The tokens you gained—attention to suffering, sympathy for Elara—are the 'residue.' Eliot saw rituals like confession as cognitive training that outlives faith. Where did you see this in the simulation?"  
  3. **Eliot’s View:** "Just as you felt the cost of abandoning practice, Eliot’s characters (like Dorothea in *Middlemarch*) retain habits of empathy from childhood faith. Her novels argue that these practices sustain ethics better than doctrine alone."  
  4. **Takeaway:** "Cognitive doubt doesn’t erase embodied virtue. Moral capacity lives in practiced routines—confession trains honesty; prayer trains attention. Eliot valued this ‘humanist liturgy.’"  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Collapsing Doctrine/Practice Distinction:**  
     - *Risk:* Students assume continuing practices implies "secret belief."  
     - *Fix:* In setup, stress: "You are *all* unbelievers. This is about behavior, not hidden faith." If occurs, debrief: "Eliot separates action from dogma—practice is psychological, not theological."  

  2. **Treating Practice as Nostalgia:**  
     - *Risk:* Participants frame retained practices as "tradition" without moral weight.  
     - *Fix:* During token tracking, reward **only** concrete moral actions (e.g., sympathy earns blue tokens; passive nostalgia does not). Debrief: "This isn’t nostalgia—it’s muscle memory for ethics."  

  3. **Token Gaming:**  
     - *Risk:* Students chase blue tokens artificially.  
     - *Fix:* Assign roles/traits that clash (e.g., "compassionate but exhausted" may struggle to act). Note in debrief: "Tokens represent internal capacity—Eliot shows this as unconscious habit."  

  4. **Uneven Engagement:**  
     - *Risk:* Outspoken students dominate the cholera response.  
     - *Fix:* Require written commitments first, ensuring all contribute. Use traits to gently guide (e.g., "Midwives, you see suffering first").  

  ---

  #### **Limitation of the Activity**  
  - **What Cannot Be Simulated:** Eliot’s emphasis on *long-term* moral formation. The activity compresses "liturgical residue" into immediate token gains, but Eliot depicts it as a slow accretion (e.g., years of prayer forging attention).  
  - **Handling in Debrief:** Explicitly state: "Eliot’s residue builds over decades. Today’s tokens are a shorthand. Her novels show how childhood rituals shape adult ethics—like a river carving stone."  

  ---  
  This design forces students to *live* the doctrine/practice split and confront its moral stakes. The silence during choice stations ensures they feel the tension before you name Eliot’s claim. Run it tightly, and the debrief will crystallize the insight.
