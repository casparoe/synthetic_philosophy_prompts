   1. (0-2 min) 
      Move: Introduce the idea of a game with symbols and rules. 
          On flip chart: Write "Start: MI" and then the four rules (but don't write the goal yet). 
          Explain that we are going to play a game: we start with MI, and we can change the string by applying any of these rules arbitrarily. 
          The goal is to see if we can ever get to the string "MU". But don't write MU yet? Or write it as the question? 
          Actually, write the question: "Can we produce MU?" at the top.
      Why: We set up the puzzle. We want them to see the rules are mechanical. We are not yet solving it.
      Misconception: None planted yet. But we kill the idea that the rules have meaning.

