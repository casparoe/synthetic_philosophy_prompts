  ### **Key Rationale**
  - **Vocabulary**: Uses accessible terms (`producible`, `invariant`). Avoids `axiom`/`theorem` to prevent math anxiety.  
  - **Carrying Example**: MU alone suffices; the invariant emerges naturally during live rule applications (Beat 3).  
  - **Transfer Test**: Works as-is. The 3🔴 target traps those who miss invariants ("get to 3 then remove" fails—it’s unreachable).  
  - **Q&A Landmine**: Engineer quip answered with `engineer_line`—**after** the transfer test to avoid premature abstraction.  
  - **Order Fixes**: Warm-up omitted to preserve novelty; marbles delayed to avoid cognitive overload.  
  - **Take-Home Line**: "Cage from above" metaphor stresses *perspective shift*, not rule-breaking.  

  **Final Tip**: When the "add a fifth rule" idea arises (likely in Beat 5), praise it: *"Exactly! But changing the cage isn’t jumping out—it’s building a new one."* This validates ingenuity while separating meta-reasoning from modification.
