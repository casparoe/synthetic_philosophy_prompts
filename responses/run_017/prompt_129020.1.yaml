prompt: |-
  Hi — I'm on the clinical ethics committee at our mental health trust. We've got a case for Friday morning and I've been asked to circulate a note beforehand, and I'd rather not write it from scratch.

  The patient is 34, bipolar I, three admissions, its her third manic episode. Two years ago, between epsiodes, with an independent psychiatrist signing off on her capacity, she completed what we internally call a Ulysses arrangement: if she becomes manic and refuses medication, she is to be given a long-acting antipsychotic anyway, for up to twelve weeks, and she purports to waive her right to refuse during that window.

  The bit that's dividing us is that the document anticipates her later objections. It says, in effect, that if she later says the last admission was traumatic, or that the drugs made her feel terrible, or that she'd rather be manic, that is the episode talking and should be discounted. And she is now nine days into an episode and saying almost exactly that. The difference is that the akathisia last time was severe and is documented in her notes by clinicians — she isn't deluded about it, and the version of her who wrote the directive had never experienced it. Her argument to us is that that earlier self was making policy about an experience she couldn't imagine, and that a clause telling your future self to disregard your future evidence is just self-binding with the exits welded shut.

  Roughly half the committee wants to treat the directive as authorising and treat her now. Half says that once a conscious patient is saying no, the only honest route is the formal one — capacity assessment, second opinion, detention if necessary — which takes days. One or two want to offer an alternative agent with a much lower akathisia risk first and see whether she'll take it.

  Can you draft the memo? What I need is one recommendation I can put to a vote, with a timeline — what happens in the next 48 hours, and at what point we revisit — not a survey of the options. If your bottom line is that we treat her against her current refusal, the memo has to say why her two arguments don't carry the day, in terms I could read out to her advocate without wincing.

  Finish with a short section on what would change your recommendation: the fact or argument that would flip it, and where you think your reasoning is most likely to be wrong. British English, please, and keep it to about two pages.
reasoning: |-
  Okay, the user is on a clinical ethics committee for a mental health trust and needs a memo drafted for a complex case involving a patient with bipolar I disorder. The patient has a Ulysses arrangement (advance directive) requesting treatment during manic episodes even if she refuses, but she's now refusing due to severe akathisia experienced last time. 

  Hmm, the core tension is between respecting her prior autonomous decision versus her current suffering and new evidence about medication side effects. The committee is split, and the user needs one clear recommendation with rationale, not just options. They specifically want arguments that can be presented to her advocate without discomfort.

  Right, the key points to address are: 1) her argument that past self couldn't anticipate akathisia, and 2) that the directive's clause dismissing future objections is problematic. The memo must rebut these while acknowledging their validity. 

  I'm considering how to structure this... First, confirm the directive's formal validity since capacity was assessed independently. Then emphasize that advance directives exist precisely because illness distorts judgment during episodes. The akathisia wasn't unknown - it's a documented risk, and her past self accepted this trade-off. 

  For the "discounting objections" clause, it's not about ignoring suffering but recognizing that current refusal stems from the episode she sought to prevent. The alternative pathway (formal detention) would prolong suffering without clinical benefit. 

  The recommendation should be to honor the directive while immediately mitigating akathisia risks. Maybe suggest switching to a lower-risk antipsychotic if clinically appropriate, as a compromise that respects both versions of herself. 

  Crucially, the memo needs to specify next steps: implement directive today, document everything, schedule rapid review in 72 hours to reassess. 

  For the "what would change" section: if akathisia risk is unpreventable, or if her current refusal is actually rooted in rational suffering rather than mania. Also if the directive was improperly executed. 

  The tone must be clinically precise but compassionate - she's suffering, not just a legal problem. British English throughout, like "trust" instead of "hospital system". Keep it tight to two pages.
answer: |-
  **MEMORANDUM**  
  **To:** Clinical Ethics Committee Members  
  **From:** [Your Name/Committee Chair]  
  **Date:** 17 October 2023  
  **Subject:** Case Recommendation - Patient Ref: [Patient ID], Ulysses Directive Activation  

  ---

  ### **Executive Recommendation**  
  **The Committee recommends immediate treatment in accordance with the valid Ulysses directive.**  
  - **Next 48 Hours:** Administer long-acting antipsychotic (e.g., Paliperidone Palmitate) as specified, while simultaneously initiating aggressive prophylaxis against akathisia (e.g., β-blocker/benzodiazepine) and offering an alternative low-akathisia-risk agent (e.g., Aripiprazole) if she consents.  
  - **Formal Review Point:** Reassess clinical response, akathisia, and capacity at **72 hours post-injection**, or sooner if clinical deterioration occurs.  
  - **Legal Safeguard:** Concurrently initiate MHA (Mental Health Act) assessment to secure detention if she retains refusal capacity or deteriorates. This runs parallel to treatment.  

  ---

  ### **Reasoning: Ulysses Directive Takes Precedence**  
  1. **Validity of the Directive:**  
     - The directive was executed inter-episode with verified capacity (independent psychiatrist) and is consistent with UK law (Mental Capacity Act 2005, §§24–26) and GMC guidance. It expressly addresses *this exact clinical scenario*: refusal during mania.  
     - Her prior self’s decision was not uninformed: she acknowledged treatment risks in writing, accepting potential side effects as preferable to manic harm.  

  2. **Addressing Her Current Objections:**  
     - **"Past self couldn’t anticipate akathisia":** While her prior self had not *experienced* akathisia, she was advised of its risk (as documented). The directive represents a rational weighing of *foreseeable* risks (medication side effects) against *certain* harms of untreated mania (psychological trauma, physical risk, social collapse). Her current focus on akathisia, while valid, ignores the broader consequences of non-treatment she sought to avoid.  
     - **"Clause disregards future evidence":** The directive does not dismiss her suffering; it recognises that *during mania*, she cannot reliably evaluate risks/benefits. Discounting "later objections" refers to objections rooted in the *impaired cognition of the episode*, not factual experiences. Her documented akathisia is real, but her assertion that she’d "rather be manic" is a recognised symptom of impaired insight (ICD-10 F31.9).  

  3. **Clinico-ethical Imperative:**  
     - Delaying treatment for MHA assessment (likely 3–5 days) extends preventable harm: mania intensifies, akathisia risk from eventual treatment remains, and trauma compounds. The directive exists to *prevent* this delay.  
     - Offering an alternative agent first is clinically reasonable **only if done within the directive’s framework** (i.e., immediately and without requiring her consent). If she refuses, the directive authorises the specified treatment.  

  ---

  ### **Implementation Timeline**  
  | **Time**       | **Action**                                                                 |  
  |----------------|---------------------------------------------------------------------------|  
  | **0–4 Hours**  | Administer prescribed long-acting antipsychotic. Simultaneously offer low-akathisia alternative. |  
  | **0–24 Hours** | Start prophylactic akathisia management (e.g., Propranolol). Begin MHA assessment. |  
  | **24–72 Hours**| Daily monitoring: akathisia (Barnes Akathisia Rating Scale), mania (YMRS), capacity. |  
  | **72 Hours**   | Formal committee review: Treatment efficacy, side effects, capacity, and MHA status. |  

  ---

  ### **What Would Change This Recommendation**  
  1. **Evidence of Directive Invalidity:**  
     - If new information emerges that her capacity assessment 2 years ago was flawed, or coercion was involved.  
     *Current evidence suggests robustness.*  

  2. **Irreconcilable Akathisia Risk:**  
     - If all antipsychotics pose severe/unmanageable akathisia risk *for this patient*, and no alternatives exist. This would void the directive’s feasibility.  
     *This is unlikely—options remain (e.g., Clozapine), but require longer-term planning.*  

  3. **Current Refusal is Capacity-Based:**  
     - If a capacity assessment **now** (using MCA 2005 criteria) finds she understands treatment risks/benefits *despite mania*, and refusal is not episode-driven.  
     *This is improbable given clinical presentation (acute mania, rejecting prior rationale), but must be formally assessed.*  

  **Area of Greatest Vulnerability in Reasoning:**  
  The directive’s clause to "discount later objections" risks underestimating the moral weight of her current suffering. If her akathisia experience fundamentally alters the risk/benefit calculus *in a way her past self could not reasonably have conceived*, enforcing the directive could perpetuate harm. Vigilance for this is essential at the 72-hour review.  

  ---  
  **Approved by:** [Your Name/Chair]  
  **Vote Required:** ✓ Yes / ✓ No to endorse the above recommendation.
