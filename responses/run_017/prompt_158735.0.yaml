prompt: |-
  I'm applying for a nine-month postdoctoral fellowship in political philosophy, and I need a two-page proposal (about 1,000 words) on a question that has become oddly practical for me over the last year.

  Two things happened. In the spring I sat on a criminal jury that deadlocked; in the autumn I joined the board of a small health foundation that is rewriting its bylaws, where the live question is which decisions have to go to the full board and which may be settled by the executive committee or the director. Rereading the Condorcet jury theorem in that light, what struck me is how completely the standard statement takes the agenda for granted: voters have some competence above one-half, votes are independent, and the question arrives from nowhere. But bodies like juries, boards, and legislatures do not vote on a random sample of questions. Items reach a vote partly *because* they are contested, because no subcommittee could settle them, because someone with partial information chose not to route them elsewhere. If the difficulty of a question is correlated with whether it reaches a vote — and if the people doing the routing have their own, differently-informed view of how hard a question is — then the population of voted questions is selected on something close to the dependent variable.

  My half-formed idea: call it the selective submission problem. Once you endogenize the agenda, the theorem may license a weaker conclusion than its defenders want, and there are two conclusions that get run together and should be separated. One is that majority rule is reliable *for the questions it actually decides*. The other is that a group improves its overall decision quality by *routing more questions to majority rule*. It looks to me as though the first can survive selective submission while the second does not — a body can raise its observed hit rate precisely by keeping hard questions away from the vote, in which case the epistemic case for majority rule and the epistemic case for majoritarianism come apart.

  Please turn this into a proposal. I need:

  1. The question stated precisely enough to have a determinate answer, with the two claims above kept explicitly apart.
  2. Why the standard territory leaves it open: the familiar fights about independence, correlation through deliberation, and heterogeneous competence all treat the question as exogenous, so settling them in either direction would not settle mine. Say why my angle is orthogonal to those rather than a variant of them.
  3. The method, month by month, for nine months, assuming I have no access to data on real juries or boards and do not intend to collect any. Say what kind of formal work this needs (analytic results about competence under selection, small synthetic simulations, or something else), what the illustrative cases — jury, foundation board, legislative floor — actually establish, and what they cannot.
  4. Why this approach rather than the obvious alternatives: an empirical study of real decision bodies; a purely conceptual analysis of what "competence" means; the social-choice literature on agenda control, which I take to be about strategic agenda-setting by someone with preferences over outcomes rather than about reliability. Take what is useful from each and say briefly why you are not doing them.
  5. The range of possible conclusions, and which considerations would decide between them. In particular, steelman the strongest version of the deflationary view: that selection effects can simply be absorbed into a redefined competence parameter for the voted subpopulation, leaving the structure of the theorem untouched and my project as a technical footnote. I want that version to be genuinely strong, not a strawman.
  6. What would count as the project failing, and what would make it too big for nine months — including the possibility that the conclusion turns on an empirical fact about the distribution of difficulty that I cannot bound without data.
  7. A deliverable for people actually deciding things: what could I honestly hand the foundation's bylaw committee? If the answer is a conditional rule of thumb about routing, thresholds, or unanimity requirements, give it with its limits stated.
  8. One paragraph conceding what this framing does not do: reliability is not legitimacy, and someone who values voting for procedural reasons will not be moved by any of the above. Say what the project can and cannot claim against that person.

  Do not write a literature review and do not cite anything by name and year — name positions, assumptions, and arguments only, and I will fill in the references myself. Assume no library or web access; if the argument needs an empirical or historical input, name it and say how the conclusion can be bounded without it.

  After the proposal, give two structured objects.

  First, a table with exactly these columns: Framing considered | What it makes tractable | What it costs | Verdict. Use one row for the framing you adopted, and at least three rows for alternatives you rejected or are holding as fallbacks; keep Verdict to one of adopt, fallback, or reject.

  Second, a JSON object with exactly these fields:

  - "question": one sentence, the proposal's question.
  - "claims_distinguished": array of two strings, the reliability-when-used claim and the route-more-to-the-vote claim, each in one sentence.
  - "selection_mechanism": string, what does the selecting, and what it is correlated with.
  - "method": array of objects, each with "months", "task", "output", covering the nine months in five to six entries.
  - "deflationary_steelman": string, the strongest version of the view that the selection effect is absorbed into a redefined competence parameter.
  - "decisive_consideration": string, what would settle whether that steelman is right.
  - "main_risk": string, the single most likely way the project goes wrong.
  - "failure_conditions": array of strings, three or four ways the project fails even if executed well.
  - "practical_deliverable": string, what the bylaw committee gets, with its limits.
  - "concession_to_proceduralist": string, one sentence.
  - "scope_verdict": one of "fits nine months", "too big", "too small".
reasoning: |-
  We are writing a research proposal on the selective submission problem in the Condorcet jury theorem. The core idea is that when the agenda is endogenous (questions reach a vote because they are hard and couldn't be settled elsewhere), the standard conclusions about majority rule may not hold. Specifically, we distinguish two claims: (1) majority rule is reliable for the questions it actually decides, and (2) routing more questions to majority rule improves overall decision quality. The project will investigate whether (1) can hold while (2) fails due to selection effects.

  We need to:

  1. State the question precisely, distinguishing the two claims.
  2. Explain why standard debates (about independence, deliberation, heterogeneous competence) leave our question open.
  3. Outline a 9-month method using formal modeling and simulations (no empirical data collection).
  4. Justify our approach against alternatives (empirical, conceptual, strategic agenda control).
  5. Present a range of conclusions, including a strong steelman of the deflationary view (that selection can be absorbed into a redefined competence).
  6. Discuss failure conditions and risks (e.g., dependence on unknown distribution of difficulty).
  7. Propose a practical deliverable (conditional rule of thumb for routing).
  8. Concede that reliability is not legitimacy, so our project does not address procedural values.

  Then, we provide two structured objects:

  1. A table with columns: Framing considered | What it makes tractable | What it costs | Verdict. We'll have at least four rows (our framing and three alternatives).

  2. A JSON object with specified fields.

  Let's proceed.

  ---

  **Proposal: Selective Submission and the Epistemic Performance of Majority Rule**

  **1. The Question**

  The proposal addresses the following precise question: *When questions are selectively submitted to a voting body based on their difficulty (where difficulty is positively correlated with the probability of deadlock or incorrect resolution by subgroups), does the Condorcet jury theorem's conclusion that majority rule is reliable for the questions it decides (Claim 1) remain robust, and does it follow that increasing the share of questions decided by majority rule (Claim 2) improves the overall epistemic performance of the institution?* We explicitly distinguish:

  - **Claim 1 (Reliability when used):** For the set of questions that actually reach a majority vote, the probability of a correct decision is high and increases with group size, assuming individual competence above 0.5 and independence.
  - **Claim 2 (Benefit of routing more):** Increasing the proportion of questions routed to majority vote (as opposed to being decided by subgroups or individuals) improves the overall correctness of the institution's decisions.

  **2. Why Standard Territory Leaves It Open**

  The standard debates about the Condorcet jury theorem focus on challenges to independence (e.g., common causes or deliberation inducing correlation), heterogeneous competence (voters with varying abilities), and the possibility of competence below 0.5. These debates treat the set of voted questions as exogenously given. However, our concern is that the agenda is endogenous: the difficulty of a question affects whether it is submitted to the full vote. This selection mechanism is orthogonal because even if we resolve the standard debates (say, by assuming independence and homogeneous competence above 0.5), the selective submission problem remains. For instance, if only hard questions (on which average competence is lower) reach the vote, Claim 1 might hold for the selected set (if competence on *that* set is still above 0.5) but Claim 2 might fail because routing more questions (including easier ones) could lower the overall hit rate by exposing easy questions to the risk of collective error.

  **3. Method**

  Given no access to real data and no intent to collect it, the method relies on formal modeling and synthetic simulations:

  - **Months 1-2:** Develop a formal model of selective submission. Define a population of questions with varying difficulty (e.g., each question has a true competence parameter p, drawn from a distribution). Specify a selection mechanism: a question is submitted to the full vote only if it is not resolved by a subgroup (modeled as a function of difficulty and the subgroup's competence). The output is a mathematical framework linking the distribution of difficulty, the selection rule, and the resulting competence distribution for voted questions.
  - **Months 3-4:** Derive analytical results for Claim 1. Under what conditions on the difficulty distribution and selection mechanism does the average competence of the voted set remain above 0.5? How does group size affect the reliability of majority rule for this selected set? Output: theorems and bounds.
  - **Months 5-6:** Simulate Claim 2. Build a synthetic institution with a fixed set of questions. Compare overall correctness under different routing thresholds (e.g., route a question to the full vote only if the subgroup deadlocks or if the director's confidence is below a threshold). Output: simulation code and graphs showing how the routing threshold affects overall correctness.
  - **Months 7-8:** Illustrative cases. Use the model to analyze three settings: (a) a jury (where the judge may not send a case to trial if evidence is overwhelming, and hung juries occur on hard cases); (b) a foundation board (where the executive committee routes only contested issues); (c) a legislature (where committees filter bills). These establish that selection is plausible and show how the model applies, but they cannot prove real-world magnitudes without data.
  - **Month 9:** Synthesis and robustness. Test the sensitivity of results to assumptions (e.g., the shape of the difficulty distribution, correlation between difficulty and competence). Output: a paper integrating analytical and simulation results, with a section on implications for institutional design.

  **4. Why This Approach**

  - *Empirical study of real bodies:* While valuable, it is infeasible in nine months without data access and would struggle to isolate selection effects from confounding factors.
  - *Purely conceptual analysis of competence:* This might clarify terms but cannot quantify the impact of selection on the two claims. Our formal approach is needed to see how competence transforms under selection.
  - *Social-choice agenda control:* This literature focuses on strategic actors setting agendas to manipulate outcomes. Our concern is non-strategic selection based on difficulty (epistemic agenda setting). We borrow the idea of endogenous agendas but not the strategic machinery.

  **5. Range of Conclusions and the Deflationary Steelman**

  Possible conclusions:

  - Strong selection: Claim 1 fails because the voted set has competence ≤0.5, so majority rule is unreliable even for the questions it decides.
  - Moderate selection: Claim 1 holds (competence >0.5 for the voted set) but Claim 2 fails — routing more questions lowers overall correctness because the marginal questions added are easier and better decided by individuals.
  - Weak selection: Both claims hold.

  The strongest deflationary steelman is: *The selection effect can be fully absorbed by redefining the competence parameter as the average competence conditional on being voted. Then, the standard theorem applies to the voted set, and Claim 1 holds by definition. For Claim 2, the overall hit rate depends on the competence of the entire population, so routing more questions only helps if the voted set has higher competence than the alternative decision-makers. This is a separate issue, and the theorem never promised Claim 2 anyway.* This view leaves our project as a technical footnote: it reminds us that competence is context-dependent.

  The decisive consideration is: *Does the selection mechanism induce a correlation between difficulty and competence that breaks the independence of voter competence across questions?* If competence is fixed per voter and difficulty only affects which questions are voted, then the steelman holds. But if the same voter has lower competence on harder questions (which is plausible), then the competence parameter itself varies with selection, and the model must account for this dependency. Our simulations will test both scenarios.

  **6. Failure Conditions and Project Size**

  The project fails if:

  - We cannot model selection without intractable complexity.
  - The results are highly sensitive to the unknown distribution of difficulty, and without data, we can only state possibilities without guidance.
  - The deflationary view proves robust, and our distinction adds little.

  The main risk is that the conclusion hinges on an empirical fact about the joint distribution of difficulty and competence that we cannot bound, making the results inconclusive. To mitigate, we will use broad parameter ranges in simulations and report bounds.

  The project is too big if we attempt to model strategic agenda setting (which we avoid) or if we simulate too many variations. We limit scope to non-strategic selection and focus on a few illustrative cases.

  **7. Practical Deliverable**

  For the foundation's bylaw committee: *A rule of thumb: "Route a decision to the full board only if the executive committee is not highly confident (e.g., after deliberation, confidence remains below 80%) or if the issue is highly consequential. For low-consequence, high-confidence issues, delegate to the executive or director. However, this rule assumes that the executive's confidence is well-calibrated; if not, it may lead to over-delegation of hard questions."* The limits: This rule requires training for confidence calibration and does not address legitimacy concerns.

  **8. Concession to Proceduralism**

  The project can claim that, under certain conditions, majority rule may be reliable for the questions it decides without implying that expanding its use improves overall outcomes, but it cannot argue against someone who values voting for its own sake, because epistemic performance is distinct from procedural legitimacy; thus, our results are silent on whether routing a question to a vote is fair or dignifying, even if it is less reliable.

  ---

  **Structured Objects**

  **1. Table: Framings Considered**

  | Framing considered                      | What it makes tractable                       | What it costs                                         | Verdict   |
  |-----------------------------------------|-----------------------------------------------|-------------------------------------------------------|-----------|
  | Non-strategic selection on difficulty (adopted) | Focuses purely on epistemic selection effects; avoids game-theoretic complexity. | Ignores strategic agenda manipulation, which may be important in some settings. | adopt     |
  | Strategic agenda control by partisan actors | Captures real-world political incentives; connects to social choice literature. | Obscures the epistemic selection effect with preference-based manipulation; intractable in nine months. | reject    |
  | Empirical calibration using real data   | Provides concrete estimates for specific institutions. | Requires data we don't have; infeasible in nine months; hard to generalize. | reject    |
  | Conceptual analysis of competence under selection | Clarifies foundational concepts without math. | Cannot quantify effects or provide actionable insights; too vague for our aims. | reject    |
  | Full simulation with heterogeneous voters | Allows for diverse voter abilities and dependencies. | Increases complexity; may not change core results about selection; too big for nine months. | fallback (simplify if needed) |

