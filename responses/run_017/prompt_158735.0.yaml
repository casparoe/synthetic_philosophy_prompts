    "method": [  
      {"months": "1-2", "task": "Develop formal model: difficulty distributions, selection rules.", "output": "Parametric framework."},  
      {"months": "3-4", "task": "Analytical bounds for Claim 1 under selection.", "output": "Proofs of competence thresholds."},  
      {"months": "5-6", "task": "Simulate routing thresholds and aggregate accuracy (Claim 2).", "output": "Simulation code/visualizations."},  
      {"months": "7-8", "task": "Case illustrations: juries, boards, legislatures.", "output": "Qualitative institutional insights."},  
      {"months": "9", "task": "Synthesis and robustness checks.", "output": "Final paper."}  
    ],  
    "deflationary_steelman": "Selection effects are fully captured by redefining competence as the mean voter accuracy conditional on a question being voted, preserving the theorem for Claim 1 and making Claim 2 irrelevant to the theorem's original scope.",  
    "decisive_consideration": "Whether voter competence on a question is endogenous to difficulty (e.g., competence drops for hard questions), breaking the independence between selection and competence required by the deflationary view.",  
    "main_risk": "Dependence on the unknown distribution of question difficulty, leading to unbounded or inconclusive results without empirical data.",  
    "failure_conditions": [  
      "Analytical intractability under realistic selection mechanisms.",  
      "Simulation outcomes are highly sensitive to untestable parameters.",  
      "The deflationary view withstands all challenges.",  
      "Selection effects are negligible in most plausible settings."  
    ],  
    "practical_deliverable": "A routing rule: 'Delegate decisions if subgroup confidence exceeds a calibrated threshold; else, vote. Audit for overconfidence bias.' Limits: Assumes confidence is measurable; ignores legitimacy concerns.",  
    "concession_to_proceduralist": "This project cannot dispute that majority voting has independent procedural value (e.g., fairness) even if selective submission undermines its epistemic advantages.",  
    "scope_verdict": "fits nine months"  
