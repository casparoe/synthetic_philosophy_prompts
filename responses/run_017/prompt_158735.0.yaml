answer: |-
  ### Research Proposal: Selective Submission and the Epistemic Performance of Majority Rule  

  #### 1. The Core Question  
  Under what conditions does the selective submission of questions to a voting body—where items reach a vote *because* they are difficult to resolve unilaterally or by subgroups—preserve the Condorcet jury theorem's conclusion that majority rule is reliable for the questions it decides (Claim 1), while undermining the inference that routing more questions to majority voting improves overall institutional decision quality (Claim 2)?  

  - **Claim 1 (Reliability when used)**: For questions actually decided by majority vote, the probability of a correct outcome remains high and increases with group size, conditional on voter competence and independence.  
  - **Claim 2 (Benefit of routing more)**: Increasing the proportion of questions routed to majority voting (rather than individuals or subgroups) raises the aggregate accuracy of the institution.  

  #### 2. Why Standard Debates Leave This Open  
  The canonical Condorcet literature treats the agenda as exogenous, focusing on challenges like correlated votes (from deliberation or common biases), heterogeneous voter competence, or non-independence. These debates assume questions are randomly assigned to the voting body. By contrast, selective submission endogenizes agenda formation: items reach the vote precisely because their difficulty prevents prior resolution. This selection mechanism—correlating question difficulty with the *decision to vote*—is orthogonal. Even if independence and competence are assured, selection distorts the population of voted questions, potentially decoupling Claim 1 and Claim 2. Existing solutions (e.g., modeling deliberation) do not address this filtering process.  

  #### 3. Method: Formal Modeling and Illustrative Cases (9-Month Plan)  
  **Assumption**: No empirical data collection; reliance on analytical modeling and synthetic simulations.  

  - **Months 1–2**: *Model setup*. Define a formal framework where questions have latent "difficulty" (e.g., true competence \( p \) per voter is inversely related to difficulty). Specify selection mechanisms: e.g., a question is routed to the full vote only if a subgroup’s aggregate competence falls below a threshold. Output: Parametric model linking difficulty, selection, and competence distributions.  
  - **Months 3–4**: *Analytical inquiry into Claim 1*. Derive conditions under which majority reliability holds for the selected question set. Test robustness to competence distributions (e.g., beta distributions for \( p \)). Output: Bounds for when average competence in the voted set remains >0.5.  
  - **Months 5–6**: *Simulation of Claim 2*. Build synthetic institutions (e.g., 10,000 questions with difficulty drawn from skewed distributions). Simulate routing rules (e.g., delegate if subgroup confidence > threshold \( \theta \)) and compute aggregate accuracy. Output: Graphs showing how varying \( \theta \) affects overall correctness.  
  - **Months 7–8**: *Case illustrations*. Use the model to analyze:  
    - *Juries*: Hung juries signal hard questions; selection inflates observed reliability but may not justify expanding jury use.  
    - *Foundation boards*: Executive committees filter ambiguous decisions; routing more to the board may lower accuracy if easy questions are misrouted.  
    - *Legislatures*: Committees kill uncontroversial bills; voted bills are contentious but not necessarily better decided.  
    **Limits**: Cases illustrate plausibility but cannot prove real-world magnitudes without data.  
  - **Month 9**: *Synthesis*. Formalize trade-offs between routing thresholds and accuracy. Output: Paper with analytical proofs, simulation code, and institutional implications.  

  #### 4. Why This Approach Over Alternatives  
  - **Empirical study of real bodies**: Prohibitive without data; confounded by unobservables (e.g., true question difficulty).  
  - **Conceptual analysis of competence**: Necessary but insufficient; competence under selection is dynamic, requiring formal modeling to quantify trade-offs.  
  - **Strategic agenda control**: Focuses on partisan manipulation (e.g., restricting agendas to preferred outcomes). Selective submission is non-strategic and epistemic (routing based on perceived difficulty). We incorporate agenda control’s insight that agendas are endogenous but discard preference-based machinery.  

  #### 5. Range of Conclusions and Deflationary Steelman  
  **Possible outcomes**:  
  - Strong selection: Claim 1 holds (voted questions retain competence >0.5), but Claim 2 fails—routing more questions *lowers* aggregate accuracy.  
  - Weak selection: Both claims hold; selection is negligible or beneficial.  
  - Breakdown: Claim 1 fails (selection drives competence ≤0.5 for voted questions).  

  **Deflationary steelman**: *The selection effect is fully absorbed by redefining competence as the mean \( p \) conditional on being voted. The theorem then holds tautologically for Claim 1: majority rule is reliable by construction for this subset. Claim 2 is irrelevant to the theorem, which never promised that expanding voting improves outcomes—only that voting works well on the questions it receives. This reduces the project to a technical footnote about parameter interpretation.*  

  **Decisive consideration**: Whether competence and difficulty can be modeled independently. If competence is fixed per voter and difficulty only affects routing, the steelman holds. But if voter competence *depends* on difficulty (e.g., \( p \) drops for hard questions), selection distorts the competence distribution itself, invalidating the reparameterization.  

  #### 6. Failure Conditions and Risks  
  - **Main risk**: Conclusions hinge on the unknown distribution of question difficulty (e.g., skewness). Without empirical bounds, results may be highly sensitive to assumptions.  
  - **Failure conditions**:  
    1. Analytical intractability: Closed-form solutions for Claim 1 are impossible under plausible selection mechanisms.  
    2. Ambiguous simulations: Outcomes are noise-dominated or fragile to parameter choices.  
    3. Triviality: Selection effects vanish under most distributions (e.g., difficulty is uniform).  
    4. Deflation prevails: Competence redefinition nullifies the problem.  
  - **Project scope**: Fits nine months if simulations are kept simple. Would be too big with strategic agents or empirical calibration; too small if analytical results emerge early.  

  #### 7. Practical Deliverable for the Foundation  
  *A conditional rule of thumb*: "Route decisions to the full board only if the executive committee’s confidence in its preferred outcome is below a calibrated threshold (e.g., 70–80%). For high-confidence or low-stakes issues, delegate to individuals. Periodically audit delegation patterns to catch overconfidence (e.g., easy questions misclassified as hard)."  
  **Limits**: Assumes confidence is measurable and well-calibrated; fails if legitimacy requires voting irrespective of accuracy.  

  #### 8. Concession to Procedural Legitimacy  
  This project shows that selective submission may decouple the reliability of majority voting from the wisdom of expanding its domain, but it cannot challenge a proceduralist who values voting as an expression of equality or dignity—even if it reduces accuracy. The analysis is strictly epistemic, not normative.  

  ---

  ### Structured Objects  

  #### 1. Framing Comparison Table  
  | Framing considered                   | What it makes tractable                          | What it costs                                     | Verdict   |  
  |--------------------------------------|--------------------------------------------------|--------------------------------------------------|-----------|  
  | **Non-strategic selection on difficulty** (adopted) | Isolates epistemic selection from strategic noise; enables clean competence-difficulty modeling. | Ignores partisan agenda manipulation; may oversimplify real-world routing. | Adopt     |  
  | Strategic agenda control             | Captures preference-based manipulation (e.g., gatekeeping). | Obscures epistemic selection with strategic motives; intractable in nine months. | Reject    |  
  | Empirical calibration                | Grounds difficulty distributions in real data.  | Requires unavailable data; confounded by institutional specifics. | Reject    |  
  | Competence redefinition              | Absorbs selection into parameters; preserves theorem structure. | Evades the core problem: competence may covary with difficulty. | Fallback  |  
  | Full institutional taxonomy          | Classifies routing rules across contexts (juries, boards, etc.). | Descriptive, not analytical; cannot quantify epistemic effects. | Reject    |  

