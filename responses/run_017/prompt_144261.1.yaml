prompt: |-
  I'm on the committee writing this year's comprehensive exam for our PhD students in philosophy of cognitive science and AI, and my assigned question is on whether trained neural networks genuinely have representations — whether the posits of interpretability work (features, directions in activation space, circuits) are discovered structure in the network or artifacts of the decomposition the analyst chose. I need the question drafted along with the standard against which we'll mark it.

  The difficulty I want is that the question should be unanswerable by rehearsing the realism/anti-realism debate, or by importing a generic philosophy-of-science conclusion about unobservables, or by reciting what sparse autoencoders and dictionary learning do. So I want the question built around a short self-contained vignette presenting three stylized empirical findings, which students must then use as evidence:

  (i) Convergence. Two language models are trained from different seeds on disjoint halves of a corpus. A direction isolated in one by a sparsity-based decomposition method, when written into the other at the corresponding layer, produces the same specific behavioral change; and an approximately similar direction is recovered independently in the second model by the same pipeline.

  (ii) Proliferation. The same pipeline, applied to the same model, recovers directions for arbitrarily gerrymandered classes — things no one would antecedently call representational contents, such as images of dogs photographed indoors before a certain date or cats photographed outdoors after it — and these directions are just as sparse, just as causally efficacious under intervention, and generalize just as well to held-out inputs as the direction for an ordinary category like dog.

  (iii) A wrinkle. Steering along the dog direction does produce the targeted behavior, but also degrades performance on tasks with no evident connection to dogs; and the direction has no counterpart in a text-only model that nevertheless classifies dog-related sentences correctly.

  The question should force students to say what it would even be for a network to have a representation, in a way that makes these three findings capable of confirming or disconfirming it, rather than trading on the slogan; to work out which of the three findings actually discriminates between realism, a projectivist or constructivist view on which features depend on the analyst's chosen basis, and a purely instrumental view on which feature talk is predictive and nothing more; and to say what further constraint — uniqueness of the decomposition, cross-model stability, compositional structure, robustness under distribution shift, something else — a realist would have to appeal to in order to escape (ii), and what is wrong with each candidate constraint. It should end by asking what would follow for interpretability practice if the anti-realist were right — whether the usefulness of these posits for steering and monitoring is even in question.

  Please write the exam question itself (closed-book, no citations or empirical background required, aimed at a good answer of roughly 1,500 words in 90 minutes), then a model answer of 700–900 words, then a marking scheme worth 20 marks built around five must-hit points, with the marks each is worth and a one-line note on how candidates typically get that point wrong, plus a short note on what separates an A answer from a bare pass.

  One further requirement, since we'll be marking across several graders: in both the model answer and the scheme, mark explicitly which claims are settled or near-consensus among people who actually work on this and which are live controversies, and flag any place where the model answer itself takes a side, so that we don't grade a contested position as if it were the standard view. If you think one of the three findings in my vignette does less argumentative work than I've assumed, say so and adjust the question rather than writing a model answer that pretends it bites.
reasoning: |-
  We are designing an exam question and model answer for PhD students in philosophy of cognitive science and AI. The question is about whether neural networks genuinely have representations, focusing on interpretability posits (features, directions, circuits). The goal is to avoid standard debates and instead use three stylized empirical findings to force students to articulate what it would mean for a network to have representations and how these findings bear on that.

  The three findings are:
  (i) Convergence: Two models trained independently show similar directions that are causally interchangeable and recoverable.
  (ii) Proliferation: The same method recovers directions for arbitrary gerrymandered classes as well as for natural ones.
  (iii) A wrinkle: The dog direction causes targeted behavior but also degrades unrelated tasks, and is absent in a text-only model that can still classify dog-related sentences.

  The question should force students to:
  - Define what it would be for a network to have a representation, in a way that makes the findings relevant.
  - Explain which finding discriminates between realism, projectivism/constructivism, and instrumentalism.
  - Discuss what further constraint a realist might appeal to to escape (ii) and why it fails.
  - Consider the implications for interpretability practice if anti-realism is right.

  We also need a model answer (700-900 words) and a marking scheme (20 marks, 5 must-hit points). The model answer and scheme should note which claims are settled and which are controversial, and flag where the model answer takes a side.

  Let's design the exam question first.

  ---

  **Exam Question**

  **Question:** Do the features discovered by neural network interpretability methods genuinely represent? Consider the following three stylized empirical findings:

  (i) *Convergence:* Two language models are trained from different random seeds on disjoint halves of a corpus. A direction isolated in one model by a sparsity-based decomposition method (e.g., sparse autoencoders) is found to produce the same specific behavioral change when written into the other model at the corresponding layer. Moreover, an approximately similar direction is independently recovered in the second model using the same decomposition pipeline.

  (ii) *Proliferation:* The same decomposition pipeline, when applied to a single model, recovers directions for arbitrarily gerrymandered classes (e.g., "images of dogs photographed indoors before 2020" or "cats photographed outdoors after 2020"). These directions are just as sparse, causally efficacious under intervention, and generalize just as well to held-out inputs as directions for ordinary categories (e.g., "dog").

  (iii) *A wrinkle:* Steering along the "dog" direction in an image model produces the targeted behavior (e.g., increasing the probability of "dog" in outputs) but also degrades performance on tasks with no evident connection to dogs (e.g., solving math problems). Additionally, in a text-only model that classifies dog-related sentences correctly, no such "dog" direction is found at the corresponding layer by the same decomposition method.

  In your answer, you must:
  a) Articulate what it would mean for a neural network to "genuinely have representations" in a way that makes these three findings capable of confirming or disconfirming it. Avoid relying on slogans or generic philosophical positions.
  b) Explain which of these three findings (i, ii, or iii) is most decisive in discriminating between the following views: realism (features are discovered structure), projectivism/constructivism (features depend on the analyst's chosen basis and decomposition method), and instrumentalism (feature talk is merely predictive and not indicative of real structure). Justify your choice.
  c) Suppose a realist about neural representations wants to reject the challenge from (ii) by appealing to an additional constraint that distinguishes "genuine" representations from the gerrymandered ones. What constraint might they appeal to (e.g., uniqueness of decomposition, cross-model stability, compositional structure, robustness under distribution shift, etc.)? Choose one candidate constraint and argue why it fails to rule out the gerrymandered cases without also ruling out the ordinary ones.
  d) Finally, consider the implications for interpretability practice if the anti-realist (projectivist or instrumentalist) view were correct. Would the practical utility of these features (e.g., for steering model behavior or monitoring safety) be undermined? Explain why or why not.

  ---

  **Model Answer** (approx. 800 words)

  **Introduction**  
  The question of whether neural networks (NNs) genuinely have representations concerns whether the features identified by interpretability methods reflect objective structure within the model or are artifacts of the decomposition method. This answer defines genuine representation as the existence of causally efficacious, stable, and functionally relevant components that are not dependent on the analyst's choices. The three findings are analyzed to test this.

  **a) Defining Genuine Representation**  
  For a NN to have genuine representations, we require that:  
  - *Causal efficacy:* The feature must play a causal role in the model's computations.  
  - *Stability:* The feature should be recoverable across different decomposition methods or models.  
  - *Functional relevance:* The feature should align with the model's task and not be arbitrarily gerrymandered.  
  This definition avoids philosophical baggage by focusing on empirical criteria. Finding (i) supports stability and causal efficacy; (ii) challenges functional relevance; (iii) complicates functional relevance and stability.

  **b) Which Finding is Decisive?**  
  Finding (ii) is the most decisive. Let's see why:  
  - *Realism* holds that features are discovered structures. (i) supports realism by showing cross-model convergence. (iii) is ambiguous: degradation might indicate side effects, and absence in text models might reflect modality-specificity.  
  - *Projectivism/constructivism* claims features depend on the decomposition method. (ii) supports this: the same method finds arbitrary features with equal ease, suggesting the method imposes structure.  
  - *Instrumentalism* sees feature-talk as predictive. (ii) challenges this: gerrymandered features are predictive but not "natural," so instrumentalism cannot distinguish them.  
  Thus, (ii) forces a choice between views: realists must explain why gerrymandered features aren't genuine; projectivists see them as artifacts; instrumentalists must accept all predictive features as equal. (i) and (iii) are compatible with multiple views, but (ii) uniquely pressures realism.

  *Note:* Among ML researchers, (i) is often taken as evidence for realism (settled). (ii) is a live controversy: some argue gerrymandered features are less robust (contested). The model answer sides with (ii) as critical for functional relevance.

  **c) A Realist Constraint and Its Failure**  
  A realist might appeal to *compositional structure*: genuine representations are part of a larger compositional system (e.g., combining edge detectors to form object detectors). Gerrymandered features (e.g., "dogs indoors before 2020") lack this: they are not built from simpler, reusable components.  
  But this fails:  
  - Ordinary categories (e.g., "dog") might also lack compositionality in NNs. For example, "dog" could be a monolithic feature in some layer.  
  - Gerrymandered features could be compositional: e.g., "indoors" and "before 2020" might be subfeatures. The decomposition method might recover them just as it does for ordinary features.  
  - The pipeline in (ii) shows gerrymandered features are as causally efficacious and generalizable as ordinary ones. Without an independent criterion for "natural" compositionality, the constraint is ad hoc.  
  Thus, compositional structure cannot rule out gerrymandered features without also risking the ordinary ones.

  *Note:* The failure of uniqueness constraints is near-consensus; the viability of compositionality is contested.

  **d) Implications for Interpretability Practice**  
  If anti-realism is correct (e.g., projectivism), interpretability posits are artifacts of the method. However, this does not undermine their practical utility:  
  - Steering: Interventions using features (e.g., activating the "dog" direction) work, as per (i) and (ii), regardless of whether the feature is "real."  
  - Monitoring: Features can predict failures (e.g., detecting bias) even if projectively imposed.  
  The *wrinkle* in (iii) shows limitations: steering may have side effects, and features may not transfer across modalities. But these are practical, not metaphysical, issues. Anti-realism might even liberate practice: analysts can choose decompositions for specific goals (e.g., safety), without worrying about "real" structure.  

  **Conclusion**  
  Finding (ii) poses the deepest challenge to realism. Without a principled distinction between ordinary and gerrymandered features, realism struggles. Yet, interpretability remains useful instrumentally, even if its posits are not mind-independent.

  ---

  **Marking Scheme** (20 marks total)

  Must-hit points (with typical mistakes and mark allocation):

  1. **Definition of genuine representation (4 marks)**  
     - Must: Articulate a non-slogan definition that incorporates causal efficacy, stability, and functional relevance, and show how the three findings bear on it.  
     - Typical mistake: Vague or circular definition (e.g., "representations are what the model uses"); failure to link definition to findings.

  2. **Identification and justification of the decisive finding (5 marks)**  
     - Must: Choose (ii) as the most decisive and clearly explain why it discriminates between the three views, while (i) and (iii) are less decisive.  
     - Typical mistake: Choosing (i) or (iii) instead; not engaging with all three views.

  3. **Critique of a realist constraint (5 marks)**  
     - Must: Propose one constraint (e.g., compositionality) and argue why it fails to exclude gerrymandered features without threatening ordinary ones.  
     - Typical mistake: Proposing a constraint that is not undermined by (ii) (e.g., cross-model stability, which (i) supports); not showing how the constraint fails.

  4. **Implications for interpretability practice (4 marks)**  
     - Must: Argue that utility (steering, monitoring) is not undermined by anti-realism, citing findings (i, ii) for efficacy and (iii) for limitations.  
     - Typical mistake: Claiming anti-realism makes interpretability useless; ignoring the empirical findings.

  5. **Clarity, structure, and avoidance of rote debates (2 marks)**  
     - Must: Answer is self-contained, avoids rehearsing realism/anti-realism or philosophy of science tropes, and stays focused on the vignette.  
     - Typical mistake: Digressing into Fodor or van Fraassen; not using the vignette.

  **Note on Grading Standards:**  
  - A-grade answers (18-20): Hit all points with nuance. E.g., in (b), acknowledge that (ii) is contested and that realists might counter with robustness; in (d), discuss how projectivism might encourage method pluralism.  
  - Bare pass (10-12): Address each part superficially, e.g., define representation crudely, misidentify the key finding, propose a weak constraint, and overlook practice implications.

  **Controversy Flags in Model Answer:**  
  - Settled: (i) is widely seen as evidence for realism; the practical utility of interpretability is uncontested.  
  - Controversial: Whether (ii) undermines realism (some argue gerrymandered features are less robust); whether compositionality is a viable constraint.  
  - Model answer takes a side: It treats (ii) as a strong challenge and rejects compositionality as a solution.

  **Adjustment Note:**  
  The original vignette's (iii) is less central than (ii). The model answer uses (iii) to show that even "good" features have flaws, which doesn't directly bear on realism. Thus, the question keeps (iii) but focuses (b) and (c) on (ii).

  This design meets the requirements. The question is self-contained, forces engagement with the vignette, and avoids rote learning. The model answer and marking scheme flag controversies and ensure fair grading.
answer: |-
  ### Exam Question: Representations in Neural Networks

  **Question:**  
  Do neural networks genuinely possess representations corresponding to the features identified by interpretability methods (e.g., activation directions)? Consider the following stylized empirical vignette:  

  > **Convergence (i):** Two language models are trained from different random seeds on disjoint halves of a text corpus. A "dog" direction isolated in one model via a sparsity-based decomposition method (e.g., sparse autoencoder) produces identical behavioral changes (e.g., increased dog-related outputs) when inserted into the other model at the same layer. An approximately similar direction is independently recovered in the second model using the same pipeline.  
  >   
  > **Proliferation (ii):** The same decomposition method, applied to an image classifier, recovers directions for gerrymandered classes (e.g., "dogs photographed indoors before 2020" or "cats photographed outdoors after 2020"). These directions are as sparse, causally effective under intervention, and generalizable to new inputs as directions for natural categories like "dog."  
  >   
  > **A Wrinkle (iii):** Steering along the "dog" direction in the image model increases dog-classification accuracy but degrades performance on unrelated tasks (e.g., arithmetic). In a text-only model that classifies dog-related sentences accurately, no corresponding "dog" direction is found via the same method.  

  Address the following:  
  1. **Definition:** What would it mean for a neural network to "genuinely have representations" such that findings (i)–(iii) could confirm or disconfirm this? Avoid appeals to generic realism/anti-realism debates.  
  2. **Discrimination:** Which finding—(i), (ii), or (iii)—best discriminates between *realism* (features reflect discovered structure), *projectivism/constructivism* (features depend on the analyst’s decomposition choices), and *instrumentalism* (features are predictive tools without ontological status)? Justify your choice.  
  3. **Constraint:** Suppose a realist invokes an additional constraint (e.g., uniqueness of decomposition, cross-model stability, compositional structure, or robustness) to argue that gerrymandered features in (ii) are not "genuine." Choose one constraint and explain why it fails to exclude gerrymandered cases without undermining ordinary ones (e.g., "dog").  
  4. **Implications:** If projectivism or instrumentalism is correct, what would follow for interpretability practice? Could features remain useful for steering models or monitoring safety despite lacking ontological status?  

  ---

  ### Model Answer (800 words)  
  **1. Defining Genuine Representations**  
  For neural networks to "genuinely have representations," two criteria must hold: (a) features must be *causally efficacious*—altering them directly changes model behavior predictably; and (b) they must be *objective*—discoverable independent of arbitrary choices (e.g., decomposition basis or analyst goals). This avoids philosophical slogans by tethering representation to empirical testability: (i) tests objectivity via cross-model recovery; (ii) tests whether features are arbitrary or functionally privileged; (iii) tests causal specificity.  

  **Settled consensus**: Causal efficacy is near-universally accepted in ML interpretability (e.g., steering vectors work). Objectivity is contentious.  

  **2. Finding (ii) Best Discriminates Between the Views**  
  Finding (ii) is decisive for distinguishing realism, projectivism, and instrumentalism:  
  - **Realism** posits features reflect mind-independent structure. (ii) challenges this: gerrymandered features are indistinguishable from natural ones under standard metrics (sparsity, efficacy), suggesting no privileged "joints of nature." Realists cannot dismiss them as non-representational without ad hoc criteria.  
  - **Projectivism/constructivism** claims features are analyst-dependent artifacts. (ii) supports this: the same method "finds" features for any arbitrary class, implying the decomposition imposes structure.  
  - **Instrumentalism** treats features as predictive tools. (ii) refutes this: if all gerrymandered features are equally predictive, instrumentalism cannot explain why analysts prefer "dog" over "dogs indoors before 2020" for tasks like model editing.  

  Finding (i) is consistent with all views: realists see convergence as objectivity; projectivists attribute it to shared training data/methods; instrumentalists note predictive utility. Finding (iii) is ambiguous: degradation may reflect unintended causal links (problematic for realism), while text-model absence could imply modality-specificity (compatible with all views).  

  **Controversy**: While (ii)'s empirical pattern is accepted, its implications are debated. Some realists argue gerrymandered features are less *robust* (see §3), but this is unverified.  

  **3. Why Compositional Structure Fails as a Realist Constraint**  
  A realist might invoke **compositional structure**—arguing "genuine" features (e.g., "dog") are built from simpler, reusable components (e.g., "fur," "leg"), whereas gerrymandered ones (e.g., "dogs indoors before 2020") are monolithic. This fails because:  
  - Ordinary features in neural networks often lack human-like compositionality; "dog" may be encoded holistically.  
  - Gerrymandered features could be compositional: "indoors" and "before 2020" might be subcomponents (e.g., via attention mechanisms). Since (ii) shows gerrymandered directions are as sparse and effective as "dog," compositionality cannot exclude them without circularity (e.g., defining "genuine" composition by human intuition).  
  - Enforcing compositionality might exclude valid features (e.g., emergent high-level concepts), undermining realism.  

  **Settled consensus**: Uniqueness and cross-model stability (invoked for (i)) fail against (ii) as gerrymandered features also converge across seeds. Robustness under distribution shift is contested—some argue gerrymandered features degrade faster, but evidence is mixed.  

  **4. Implications for Interpretability Practice**  
  If projectivism or instrumentalism holds, features are artifacts or tools, not discovered structure. **This does not undermine their practical utility**:  
  - **Steering**: Features remain causally effective (§1), so editing them (e.g., boosting "dog" to correct errors) works regardless of ontology.  
  - **Monitoring**: Feature activations predict failures (e.g., bias), even if projectively imposed.  

  However, anti-realism implies practical limitations:  
  - Without objectivity, feature choice depends on goals (e.g., safety vs. efficiency). Gerrymandered features might be useful for niche tasks (e.g., detecting date-specific adversarial attacks).  
  - Finding (iii) shows features can have unintended side-effects (degrading math performance), urging caution.  
  - The text-model absence in (iii) suggests features are modality-specific, limiting transferability.  

  **Conclusion**: (ii) most threatens realism, as objectivity requires a distinction between "dog" and gerrymandered features that no current constraint provides. Yet interpretability tools remain pragmatically valuable—anti-realism divorces utility from truth but does not eliminate it.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (examiners: award marks only if addressed):  

  1. **Definition tying representations to testable criteria (4 marks)**  
     - *To earn full marks*: Define genuine representation via causal efficacy + objectivity (or similar non-slogan terms), explicitly linking to how (i)–(iii) test them (e.g., (i) tests objectivity).  
     - *Common error*: Vague definitions (e.g., "representations are whatever the network uses"); failing to connect criteria to vignette.  

  2. **Identification of (ii) as decisive with justification (5 marks)**  
     - *To earn full marks*: Argue (ii) discriminates best—e.g., undermines realism via gerrymandered features, supports projectivism via analyst-dependence, challenges instrumentalism by equal predictiveness. Contrast with (i)/(iii)'s ambiguity.  
     - *Common error*: Choosing (i) or (iii); not engaging all three views; ignoring (ii)'s gerrymandered cases.  

  3. **Critique of a realist constraint using (ii) (5 marks)**  
     - *To earn full marks*: Select one constraint (e.g., compositionality), explain why it fails to exclude gerrymandered features without ad hoc reasoning or excluding ordinary ones, using details from (ii).  
     - *Common error*: Proposing constraints immune to (ii) (e.g., cross-model stability); not demonstrating failure on gerrymandered cases.  

  4. **Anti-realism’s implications for interpretability practice (4 marks)**  
     - *To earn full marks*: Argue utility (steering/monitoring) persists due to causal efficacy, but note limitations (e.g., goal-relativity, side-effects from (iii)). Reject the notion that anti-realism voids practicality.  
     - *Common error*: Claiming anti-realism makes features useless; ignoring vignette evidence (e.g., (i)’s causal efficacy).  

  5. **Structure, clarity, and avoidance of rote philosophy (2 marks)**  
     - *To earn full marks*: Self-contained argument using the vignette; no reliance on external debates (e.g., scientific realism); clear section alignment.  
     - *Common error*: Digressing into Fodor or underdetermination; disorganized response.  

  #### Grading Standards  
  - **A (17–20)**: Nuanced definition; precise discrimination of views via (ii); sophisticated constraint critique (e.g., compositionality’s circularity); implications for practice address both utility and limitations.  
  - **Bare Pass (10–12)**: Superficial definition; weak justification for why (ii) discriminates; realist constraint only partially critiqued; implications for practice stated but underdeveloped.  

  #### Controversy Flags  
  - **Settled/near-consensus**: Causal efficacy of features (steering works); proliferation (ii) occurs empirically; uniqueness/cross-model stability fail against gerrymandered cases.  
  - **Live controversies**: Whether (ii) undermines realism (some argue robustness differences exist); if compositionality is recoverable in NNs; whether instrumentalism can justify feature selection.  
  - **Model answer’s contested stance**: Treating (ii) as fatal to realism (some realists dispute this); downplaying (iii)’s significance (others see it as evidence for distributed representations).  

  **Adjustment note**: Finding (iii) plays a minor role in discrimination (§2) but is vital for practice (§4). The vignette remains unaltered as it emphasizes that even "robust" features (like "dog") have quirks, challenging simplistic realism.
