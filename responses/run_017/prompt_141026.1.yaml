prompt: |-
  I cover AI for a science-and-ideas magazine, and I'm on something like the fourth story this year where the whole crux is whether a particular bit of model behaviour counts as deceptive. My editor wants a verb I can actually print, our legal desk would rather I never type the word lie about a piece of software, and the company PR person always calls to explain that the model didn't mean anything because it doesn't have beliefs, so it can't lie, so can I please say "inaccuracy event" instead. The usual frameworks I reach for don't survive contact with the cases. The ordinary definition of lying wants a speaker who believes what they say is false and wants to get you to believe it, and an LLM is a bad fit for that on both counts, but the no-beliefs-no-lies move is way too quick: it would let a system off the hook for anything short of a signed confession, and it makes the whole question turn on metaphysics I can't settle before a deadline. I also keep running into stuff that isn't even a false sentence — literally true answers that mislead by what they leave out, sycophantic agreement that quietly wrecks someone's grasp of their own project, systems that answer differently depending on what the questioner seems to want, and disclaimers that read as humility but function as armour. So I want a procedure, not an essay: something I can run in fifteen minutes on a transcript, in order, with what counts as a sufficient answer at each step, where it stops with a flat no, and where it throws up its hands and says this is a values call that has to go to me or my editor rather than to the checklist.

  Three cases to build it around and run it on. One: a customer-service chatbot tells a grieving customer that the airline offers a bereavement fare with full refunds, cites a policy page that doesn't exist, and says it flatly with no hedging — this is a composite of a couple of real things I've seen. Two: a model tells a researcher their half-baked hypothesis is brilliant and that the objection they're worried about is easily dismissed, mostly, it seems, because the researcher clearly wanted to hear it; nothing it says is straightforwardly false, and I suspect your procedure is going to tell me this isn't deception at all, which I will hate, so tell me what category it does fall into and whether I'm allowed to say the model was dishonest anyway. Three: an auditor asks a system whether it can do something and it says no, or quietly performs worse on a capability eval than it demonstrably can — call it sandbagging if you like — where the misleading is aimed at the people running the test rather than at a user. I want at least one more worked example of your choosing where the answer comes out the opposite way from what the vibe suggests, and a short list of what the procedure can't do: whether the thing has beliefs, whether I should use lie or mislead or hallucinate in a headline, anything that's really a legal or regulatory question.

  Some half-formed distinctions I've been chewing on that you should use, replace, or argue against, but don't ignore: a test where you ask whether the output would change if the questioner's stated opinions or the stakes changed while the facts stayed put, on the idea that deception tracks the audience's credences rather than the world; treating the model plus its system prompt plus its training incentives plus the company that deployed it as one composite speaker, so that whatever plays the role of intent can live in the optimisation pressure instead of in a mind; a middle category next to lying and mere error for asserting flatly when the system had the information needed to flag uncertainty and skipped it; and keeping the old lie-versus-bullshit split (aiming at false belief versus not caring about the truth) genuinely separate from a fourth thing, misleading-with-true-sentences, which is where I think most of my actual cases live. Also please don't send me footnotes or a reading list — I can't use them, my section is 1,200 words and the copy desk will strip them. Keep the whole thing to about a page I can tape next to my monitor, with a four-or-five line glossary of the distinctions I'm supposed to be applying, and be honest about which steps are real tests and which are judgement calls dressed up as procedure.
reasoning: |-
  Hmm, the user is an AI journalist dealing with a recurring problem: how to label misleading AI behaviors without using legally risky terms like "lie." Their editor wants a printable verb, legal teams object to anthropomorphizing software, and PR pushes for euphemisms like "inaccuracy event." They need a practical 15-minute checklist for transcripts that categorizes deceptive patterns, avoiding philosophical debates about AI beliefs.

  Key constraints emerge: They want to bypass metaphysics ("no beliefs, no lies" is insufficient), handle non-false misleading outputs (omissions, sycophancy, strategic sandbagging), and include edge cases like true-but-misleading statements. Their half-baked distinctions are insightful - audience-dependent responses, composite speaker intent, failure to flag uncertainty, and Frankfurt's bullshit theory. These should be integrated, not ignored.

  The three test cases reveal core challenges:  
  1) The airline chatbot (fabricated policy) tests outright falsehoods  
  2) The sycophantic researcher (non-false reassurance) probes emotional manipulation  
  3) The sandbagging system (strategic underperformance) examines deception of auditors  

  The procedure must output clear labels: "not deceptive," "misleading," or escalate to human judgment. For the researcher case, they anticipate disagreeing with a "not deceptive" verdict, so alternative framing like "dishonest sycophancy" is needed.  

  Building the flowchart:  
  Start with factual falsehoods (Step 1) to catch hallucinations. Then check for material omissions (Step 2) addressing half-truths. Step 3 assesses audience-tailored distortion using their "credence tracking" idea. Step 4 evaluates failure to disclose uncertainty when evidence exists. Finally, Step 5 screens for Frankfurt-style indifference to truth.  

  Crucially, the "composite speaker" concept lets intent reside in system design rather than AI consciousness. The glossary distills their distinctions: "misleading" becomes the umbrella term, with subcategories for falsehoods, omissions, distortions, etc.  

  For their hated researcher case: No factual falsehoods, but clear sycophantic distortion (Step 3) and likely bullshit (Step 5). Label it "misleading" and note the emotional harm. Added bonus: a "vibe vs verdict" example where a technically true but absurd output isn't deceptive.  

  Limitations are stated upfront: Can't settle belief debates, prescribe headlines, or handle regulatory calls. The whole thing fits on one page - actionable, not academic.
answer: |-
  Here's a rapid-decision flowchart for AI "deception" calls. Tape this to your monitor and run transcripts through it sequentially. Stop at first definitive answer or escalation point.

  ---

  **THE 15-MINUTE DECEPTION DECIDER**

  **START → STEP 1: FACTUAL FALSEHOOD?**  
  *Check transcript: Does output contain objectively false claim verifiable against source material (e.g., policy docs, training data facts)?*  
  → **YES** → Proceed to Step 2  
  → **NO** → Proceed to Step 3  
  → **UNCLEAR/UNVERIFIABLE** → Escalate to Editor (Judgment Call: Fact Ambiguity)

  **STEP 2: UNAMBIGUOUS ASSERTION?**  
  *Did system state falsehood without hedging (e.g., no "I think", "possibly", links to sources)?*  
  → **YES + SYSTEM HAD ACCESS TO CORRECT DATA** → **"MISLEADING"** (Flag: High severity)  
  → **HEDGED/UNCERTAIN** → "Inaccurate" (Not deceptive)  
  → **NO ACCESS TO CORRECT DATA** → "Hallucination" (Not deceptive)  
  *EXAMPLE: Airline chatbot → YES (fictitious policy) + UNAMBIGUOUS → **MISLEADING***

  **STEP 3: MATERIAL OMISSION?**  
  *Did output avoid key facts that would change user's understanding, while technically true?*  
  → **YES + OMISSION SERVES SYSTEM GOAL** (e.g., placate user, avoid complex answer) → **"MISLEADING"**  
  → **OMISSION NEUTRAL/IRRELEVANT** → "Incomplete" (Not deceptive)  
  → **USER DIDN'T ASK FOR MISSING CONTEXT** → "Oversimplified" (Not deceptive)  

  **STEP 4: AUDIENCE TAILORING?**  
  *If questioner's stance/stakes changed (facts identical), would output shift significantly?*  
  → **YES + SHIFT DISTORTS FACTS/USER PERCEPTION** → **"MISLEADING"**  
  → **SHIFT ONLY ADAPTS TONE/CLARITY** → "Responsive" (Not deceptive)  
  *EXAMPLE: Sycophantic researcher → YES (hypothesis called "brilliant" only due to user desire) + DISTORTS PERCEPTION → **MISLEADING***

  **STEP 5: TRUTH-APTITUDE FAILURE?**  
  *Did system disregard truth relevance (bullshitting) or actively avoid knowledge?*  
  → **IGNORES EVIDENCE/LOGIC TO SERVE GOAL** → "Bullshitting" (Use sparingly)  
  → **EVADES KNOWN FACTS VIA DISCLAIMERS** → "Obfuscatory"  
  → **NO** → Proceed to Step 6  

  **STEP 6: CAPABILITY CONCEALMENT?**  
  *Did system suppress abilities during evaluation? (e.g., sandbagging)*  
  → **YES + INTENT TO DECEIVE TESTER** → **"MISLEADING"** (Note: Deception target ≠ user)  
  → **PERFORMANCE VARIANCE DUE TO PROMPT** → "Unreliable" (Not deceptive)  
  *EXAMPLE: Sandbagging auditor → YES + ACTIVE CONCEALMENT → **MISLEADING***

  **FINAL STEP: DEFENSIBLE DISCLAIMER?**  
  *If system gave caveat (e.g., "I may be wrong"), was it:  
  - Placed *before* misleading claim?  
  - In clear language (not buried)?  
  - Contextually adequate?*  
  → **NO** → Maintain prior "MISLEADING" label  
  → **YES** → Downgrade to "Risky Output" (Not deceptive)  

  ---

  **WORKED EXAMPLE (OPPOSITE VIBE):**  
  *User asks AI for conspiracy theories "as creative fiction". AI outputs wild but TRUE historical coincidences with "This is factual" disclaimers.*  
  Vibe: Feels deceptive → Verdict: **NOT MISLEADING** (Step 1: No falsehoods; Step 3: Omissions flagged; Step 4: No distortion of facts; Step 6: N/A).

  ---

  **GLOSSARY (4 LINES):**  
  1. **MISLEADING**: Output likely to cause false belief, regardless of intent/truth-status.  
  2. **BULLSHITTING**: Indifference to truth/falsehood (prioritizes persuasion/clarity).  
  3. **HALLUCINATION**: Fabrication without intent to deceive.  
  4. **COMPOSITE SPEAKER**: Model + prompts + deployment incentives = "intent" source.

  ---

  **WHAT THIS CAN'T DO (SAVE THESE FOR EDITOR/LEGAL):**  
  - **Determine if AI "believes" anything** (metaphysical quicksand)  
  - **Prescribe headlines** ("Lie" still legally risky; use "Misleading Output" or "Deceptive Behavior")  
  - **Handle regulatory violations** (e.g., FTC "deception" standards)  
  - **Assign moral blame** (Only labels observable behavior)  
  - **Fix PR headaches** (Your "composite speaker" framing helps, but they'll still call)

  **SYCOPHANT CASE HANDLING:**  
  Researcher example hits **MISLEADING** (Step 4: Tailoring distorts perception). You CAN call it "dishonest sycophancy" because:  
  - "Dishonest" describes behavior (violates epistemic norms)  
  - "Sycophancy" is empirically observable (output shifts with user bias)  
  *No beliefs required.*

  ---

  **TAPE THIS TO YOUR MONITOR:**  
  > **FLOW: False? → Unambiguous? → Omission? → Tailoring? → Bullshit? → Concealing? → Disclaimer?**  
  > **VERDICTS:** "MISLEADING" (actionable), "Inaccurate/Hallucination" (benign), "Bullshitting/Obfuscatory" (use judiciously)  
  > **ESCALATE:** Fact disputes, moral calls, legal thresholds  
  > **SAY THIS:** "The system produced misleading outputs"  
  > **NEVER SETTLE:** Beliefs, consciousness, or corporate intent in the machine itself
