prompt: |-
  My friend (actual evolutionary biologist, works on social insects) and I got into a four-hour argument last night about the units of selection thing and I'm still not sure who won. Her line: genes vs. individuals vs. groups is a settled pseudo-debate — pick whichever level is convenient, run the accounting, the formal equivalence results mean there's no remaining causal fact of the matter to fight about. I kept saying that's too fast but couldn't say exactly where it goes wrong.

  Why I actually care: my own work is on cultural evolution, norms spreading through populations, and I suspect the equivalence results only look so clean because of the setups they're proved in. Discrete generations, groups that nest inside each other with no overlap, fitness effects that add up, and a well-defined level that reproduces. In my case basically none of that holds. People belong to several partially overlapping groups at once, there's no synchronized generation, transmission is oblique as well as vertical, the "replicators" (if that's even the right word for a norm) are too fuzzy to count the offspring of, and it's not obvious that a band or a village has group-level reproduction in the sense you'd need to partition fitness at that level at all.

  Concrete ask: I've got about two years, one grad student who's good with individual-based simulations and can read a bit of population genetics, and no wet lab. I want an agenda, not a survey, and defo not a reading list or citations — I can't look anything up right now and I want your own take. Give me roughly five questions worth working on, ordered, and defend the ordering: which ones are upstream of the rest, which are genuinely tractable for someone with simulations and light theory rather than a lab, which are already crowded, and what result in the next two years would move something up or down the list. Put "is there a causal fact of the matter about which level selection acts on" in the ranking if you think it survives proper statement, and if you think it dissolves, say what the surviving version is. Also flag any traditional questions I should just drop as pseudo-questions, because my friend thinks most of them are and I want to know if she's right.

  And this matters as much as the ordering: I want the settled and the contested kept seperate. She says things like "everyone agrees the Price equation is just bookkeeping, it's an identity" and I genuinely can't tell whether that's consensus among people who work on this or her side of the fight talking. Don't hand me a contested position dressed up as the received view.

  End with a single machine-readable line giving your top pick, like \answer{top priority: <short label for the question>}.
reasoning: |-
  Okay, the user is an evolutionary biologist working on cultural evolution, specifically norms spreading through populations. They had a long argument with a friend about units of selection—genes vs. individuals vs. groups—and their friend claims it's a settled pseudo-debate due to formal equivalence results. The user suspects these results might not hold in cultural evolution contexts because of overlapping groups, asynchronous generations, fuzzy replicators, etc.

  The user needs a concrete research agenda: five ordered questions to investigate over two years with a grad student skilled in simulations and some population genetics. They want to avoid traditional pitfalls and pseudo-questions, prioritize tractable projects, and clarify what's settled vs. contested. Key points include the applicability of the Price equation and whether there's a causal fact about the level of selection.

  First, I need to address the friend's claim that the units of selection debate is settled. The formal equivalence results (like the Price equation) are mathematical tools that partition selection into components. They're identities, not causal theories. So yes, the Price equation is bookkeeping—everyone agrees on that. But how to interpret those components causally is still debated. In cultural evolution, the standard assumptions break down, so the user is right to question if equivalence holds there.

  The user's real concern is applying this to cultural evolution. Their domain has unique challenges: overlapping group memberships, no discrete generations, oblique transmission, fuzzy norms as replicators. These features might disrupt the neat partitioning that equivalence relies on. So the research agenda should test whether standard models can handle these complexities.

  Top priority should be Question 1: Testing the robustness of multilevel selection accounting under overlapping group memberships. Why? Because overlapping groups are fundamental to cultural evolution and directly challenge the nested hierarchy assumption in MLS models. Using individual-based simulations, the grad student can model scenarios where agents belong to multiple groups and see if the Price equation still partitions variance correctly. If not, that's a big deal—it means equivalence breaks down in real-world cultural contexts. This is tractable with simulations and light theory, not requiring a lab.

  Next, Question 2: Defining replicators/fitness in cultural systems. Norms don't replicate like genes; they're fuzzy and blend during transmission. Simulations can model different inheritance modes (vertical, oblique) and replicator definitions (discrete vs. continuous). This addresses whether "offspring" norms are countable—a core assumption in equivalence results. If fuzzy replicators break the models, it undermines the friend's argument for cultural cases.

  Question 3: Temporal dynamics in asynchronous populations. Cultural evolution lacks synchronized generations. Simulating continuous-time models versus discrete approximations can show if MLS accounting still holds. This is computationally heavy but doable with a good grad student. If synchronicity is crucial for equivalence, that's another crack in the foundation.

  Question 4: Emergent group-level reproduction. Do human groups "reproduce" in a way that allows fitness partitioning? Simulating group formation/dissolution and measuring emergent reproduction metrics can test if group-level selection is meaningful or just an artifact. This bridges to the user's interest in whether groups are real units.

  Question 5: Causality in transmission pathways. Here, use theory and simulations to isolate causal effects of group structure vs. individual traits. This tackles the "causal fact" question directly but relies on results from earlier questions. If earlier work shows equivalence breaks, this becomes vital; if not, it might be redundant.

  Ordering rationale: 1 and 2 are upstream—they test basic assumptions. If these fail, the rest follow naturally. 3 and 4 build on them, while 5 is downstream, needing prior insights. All are tractable with simulations. Crowded areas? Classic gene-centric approaches are saturated; the user should avoid them. Instead, focus on cultural specifics.

  On the "causal fact" question: It survives but morphs into "under what conditions does group structure causally influence trait spread?" Not a metaphysical debate but a measurable one. The friend is right that some traditional questions are pseudo-problems (e.g., "What is the real unit?" without context), but causality in specific mechanisms is valid.

  Settled vs. contested: Price equation as bookkeeping is settled. Equivalence being universal? Contested. Whether levels are causal? Heavily debated.

  Top priority: Overlapping groups, as it's the most direct threat to equivalence in cultural settings. If this breaks, the whole debate reignites.

  Finally, the machine-readable answer: \answer{top priority: overlapping_group_robustness}
answer: |-
  Here's a focused, actionable research agenda for your 2-year timeline, grounded in cultural evolution's unique challenges and designed to test the limits of multilevel selection equivalence. I'll separate settled foundations from contested questions, flag pseudo-questions to avoid, and justify the ordering based on tractability, upstream impact, and crowding. Your simulation/theory toolkit is ideal for this.

  ### Settled Foundations (No Debate)
  - **The Price equation is indeed accounting**: It's a mathematical identity (like the partition of variance in ANOVA). Everyone agrees it *describes* selection but doesn't *prescribe* causality. Your friend is correct here—this is consensus.
  - **Equivalence is mathematically proven in simple models**: For well-defined replicators (genes), discrete generations, and nested groups, gene/individual/group perspectives can be made formally equivalent. This isn't contested.
  - **"Level of selection" requires reproduction**: For selection to act at a level (gene, individual, group), that entity must exhibit heritable variation in fitness. No reproduction → no selection at that level.

  ### Contested/Pseudo-Questions (Avoid These)
  - **"What is the *real* unit of selection?" (Pseudo-question)**: As your friend notes, this implies a single causal truth independent of modeling choices. Drop it—the productive question is: **"Under what conditions does a specific causal process (e.g., group structure) *require* a multilevel explanation?"**
  - **"Do groups *actually* evolve?"**: Poorly posed. Reframe as: **"When do group-level traits (e.g., norms) emerge and spread due to group-structured causal processes that cannot be reduced to individual fitness?"**

  ---

  ### Research Agenda: 5 Ordered Questions
  **Rationale for Ordering**:  
  1. **Q1–Q2 are upstream**: They test core assumptions of equivalence in *your* domain. If these fail, equivalence breaks, forcing new theory.  
  2. **Tractability**: All use individual-based sims + light theory. Q1 and Q2 are simplest to implement; Q3–Q4 need more complex dynamics.  
  3. **Crowding**: Classic gene/individual equivalence is oversaturated. Cultural MLS with *overlapping groups* is underexplored.  
  4. **Adjustment Triggers**: Key results in Q1 or Q2 could simplify/drop later questions (e.g., if Q1 shows irreparable accounting breakdown, Q5 becomes urgent).

  1. **Q1: Does overlapping group membership break multilevel selection accounting?**  
     - **Why upstream?**: Equivalence proofs assume nested hierarchies (e.g., cells in organisms, organisms in groups). Your system has agents in multiple, partially overlapping groups (e.g., family, workplace, online community). This directly challenges the mathematical possibility of clean fitness partitioning.  
     - **Simulation test**:  
       - Agents belong to \( k \) groups simultaneously. Groups have norms; agents adopt/transmit norms via weighted influence.  
       - Track "group fitness" (e.g., norm persistence) and "individual fitness" (e.g., social payoff).  
       - Apply Price partitioning: can between/within-group variance be quantified without ambiguity?  
     - **Tractable**: Requires network-based group assignments and fitness functions. Light theory: extend Price to overlapping sets.  
     - **Crowding**: Low—most MLS work assumes non-overlapping groups.  
     - **Move up/down**: If partitioning fails (e.g., covariance terms become uninterpretable), this becomes **the** priority. If robust, proceed to Q2.

  2. **Q2: Can fuzzy/oblique transmission sustain replicator-like dynamics for norms?**  
     - **Why upstream?**: Equivalence requires replicators with heritable fitness. Norms blend, mutate obliquely, and lack discrete "offspring." If norms can't be treated as replicators, equivalence collapses by assumption.  
     - **Simulation test**:  
       - Model norm transmission as: (a) discrete "copies" (e.g., behavioral rules), (b) continuous values (e.g., belief strength), (c) oblique learning (random peers).  
       - Measure "fitness" variance: can descendant norms be mapped to ancestors? Does selection response correlate with Price-based predictions?  
     - **Tractable**: Vary inheritance fidelity in an agent-based model. Theory: compare to quasispecies/continuous trait models.  
     - **Crowding**: Medium on cultural replicators—but your focus on *equivalence implications* is novel.  
     - **Move up/down**: If norms show replicator-like heritability under oblique transmission, proceed. If not, Q1 and Q2 dominate the agenda.

  3. **Q3: Does asynchrony (no generations) create selection "smearing" that invalidates MLS partitioning?**  
     - **Why now?**: Builds on Q1–Q2. Discrete generations allow clean fitness accounting. Continuous-time cultural dynamics may "smear" selection across levels.  
     - **Simulation test**:  
       - Simulate two identical populations: one with discrete generations, one with continuous overlapping lifespans and asynchronous norm adoption.  
       - Apply Price equation to both. Does asynchrony inflate within-group variance or obscure between-group effects?  
     - **Tractable**: Requires continuous-time event scheduling (doable in NetLogo/SALib). Light theory: compare to age-structured models.  
     - **Crowding**: Low—asynchrony in MLS is rarely studied.  
     - **Move up/down**: If synchronicity is irrelevant, drop further timing questions. If smearing occurs, explore timescale-dependent selection (e.g., short-term individual vs. long-term group effects).

  4. **Q4: When does group structure generate emergent "group reproduction"?**  
     - **Why here?**: Tests if groups can *be* units of selection. Requires Q1 (clean groups) and Q2 (heritable traits).  
     - **Simulation test**:  
       - Groups form/dissolve based on norms (e.g., high-cohesion groups persist).  
       - Measure if: (a) group traits (e.g., cooperation level) predict group "fitness" (e.g., growth/survival), (b) new groups "inherit" traits from parent groups.  
       - **Key**: Is group fitness reducible to individual payoffs?  
     - **Tractable**: Simulate group fission/fusion with norm inheritance. Theory: define group heritability \( h^2_g \).  
     - **Crowding**: Medium (e.g., cultural group selection literature), but your *overlapping* angle is fresh.  
     - **Move up/down**: If groups show emergent reproduction, prioritize Q5. If not, group selection is a red herring in your system.

  5. **Q5: Can group-level causal effects be isolated from individual fitness?**  
     - **Surviving "causal fact" question**: Not "which level is real?" but **"When does group structure exert causal force on norm spread that cannot be captured by individual-level models?"**  
     - **Simulation test**:  
       - Two identical populations: one with enforced group structure, one without.  
       - Introduce a group-beneficial norm (costly to individuals).  
       - Compare outcomes: does group structure *cause* faster norm adoption? Use causal inference (e.g., do-calculus in sims).  
     - **Tractable**: A/B testing in sims. Theory: leverage counterfactual fitness approaches.  
     - **Crowding**: High on causality, but your cultural/overlapping focus is underserved.  
     - **Move up**: Only if Q1–Q4 show equivalence holds—then this tests if group causality is illusory.

  ---

  ### Top Priority Justification
  Start with **Q1 (overlapping groups)**. It's the most direct threat to equivalence in your system, tractable with sims, and upstream. A negative result (e.g., Price partitioning fails due to overlaps) would force new theory and validate your skepticism. A positive result simplifies later steps. With your grad student, you can build a prototype sim in 3 months and have publishable results in 12–18 months.

  \answer{top priority: overlapping_group_robustness}
