answer: |-
  **MEMORANDUM**  
  **To:** Kestrel Basin Water Authority Board  
  **From:** Science and Engineering Subcommittee  
  **Date:** 5 September 2023  
  **Subject:** Recommendation on Paleochannel Investigation and Project Selection  

  ---

  ### **BOTTOM LINE**  
  The Subcommittee recommends commissioning the **stripped-down tracer study** (cost: $3.5M) by 30 September 2023. This design minimizes regulatory risk while preserving essential decision-making value. We further recommend that, upon receiving results, the Board select projects using the **expected-value interpretation** of our statutory standard ("weight of the evidence"). Declining the study or pursuing alternative designs would sacrifice net benefits to ratepayers.  

  ---

  ### **REASONING**  
  #### **I. The Core Decision Without New Information**  
  Without additional study, the expected net present values (NPVs) of our three projects are:  
  - **Option A (Full recharge):** $21M  
  - **Option B (Modular recharge):** $42.5M  
  - **Option C (Pipeline):** $47.7M  

  The baseline is Option C at **$48M**.  

  #### **II. Value of the Proposed Study**  
  A $6M tracer study would refine probabilities for three paleochannel states:  
  - **Well-connected** (prior: 30% → posterior up to 79%)  
  - **Partially connected** (30% → 50%)  
  - **Effectively isolated** (40% → 71%)  

  Averaged over possible findings, the study increases expected project value to **$63M** before cost. The **gross value of information (VOI)** is $15M ($63M – $48M baseline). Net of the $6M cost, VOI = **$9M**.  

  *Why information usually pays*: For a decisionmaker who always maximizes expected value, buying information cannot reduce expected net benefits (Good’s Theorem). This holds if two conditions are met:  
  1. The decisionmaker can *freely choose optimal actions* after seeing new evidence.  
  2. Actions are evaluated by *expected value*, not other rules.  

  #### **III. Complications Requiring Design Adjustment**  
  ##### **A. Statutory Standard Divergence**  
  Our enabling act requires selecting the alternative "favored by the weight of the evidence." Counsel acknowledges two interpretations:  
  - **Expected-value reading**: Maximize expected NPV given evidence (e.g., choose C if EV = $49M).  
  - **Most-likely-world reading**: Pick the project best for the single most probable state (e.g., choose B if "partially connected" is 50% probable, worth $43M).  

  **Problem**: Under the inconclusive finding (33% probability), the two interpretations diverge, costing **$6M** in expected value if the Board uses the most-likely-world approach. Critically, **Good’s Theorem fails under the most-likely-world reading** because it abandons expected-value maximization. If the Board pre-commits to this rule, the study’s net VOI drops from $9M to **$3M**—barely justifying even the stripped-down cost.  

  **Recommendation**: Adopt the *expected-value reading* formally. It aligns with Good’s Theorem, preserves the study’s value, and avoids a $6M penalty in ambiguous evidence scenarios.  

  ##### **B. Regulatory Trigger and Study Design**  
  Publishing a non-negative finding (probability: 64% in full study) triggers state curtailment, costing ratepayers **$40M** (central estimate, range: $20–70M). The **stripped-down study** ($3.5M) reduces this risk:  
  - Reports only "connection indicated" (31% probability) or "not indicated" (69%).  
  - **Trigger probability drops to 31%** (only "connection indicated" activates curtailment).  

  Crucially, pooling "inconclusive" and "against connection" findings sacrifices *no decision value*: both would lead to Option C. Thus, the stripped-down study:  
  - Retains nearly all VOI ($14.5M gross vs. $15M for full study).  
  - Reduces expected curtailment cost from $25.6M (0.64 × $40M) to **$12.4M** (0.31 × $40M).  
  - **Net advantage over full study**: ($14.5M – $3.5M – $12.4M) vs. ($15M – $6M – $25.6M) = **–$1.4M vs. –$16.6M**.  

  **Philosophical implication**: When external constraints (e.g., regulatory triggers) prevent optimal responses to information, a *less informative* design can dominate. Informativeness is not an intrinsic good—it is a design variable balanced against decision flexibility.  

  #### **IV. Evaluation of Alternatives**  
  | **Option** | **Expected NPV** | **Why It Loses** |  
  |------------|------------------|------------------|  
  | **Full study ($6M)** | ~$41.4M | High curtailment risk ($25.6M) outweighs VOI. |  
  | **Stripped-down study ($3.5M)** | **$45.1M** | Maximizes net benefits: curtails risk + VOI. |  
  | **Build B now** | $42.5M | Forgoes $2.6M in VOI; ignores option to avoid $40M trigger. |  
  | **Build C now** | $48M | Sacrifices $9M VOI; leaves $40M risk unaddressed. |  

  **On university partnership proposal**: Conducting the study under research secrecy is **legally and ethically untenable**. Public records laws likely compel disclosure; attempting evasion risks litigation, loss of public trust, and penalties exceeding $40M.  

  #### **V. Addressing the NGO Concern**  
  The NGO correctly argues that *deliberately manufacturing uncertainty* to avoid regulatory triggers damages scientific integrity. **However**:  
  - We are not suppressing information; we are *designing the minimal sufficient test* for our binary decision ("pursue A/B or C?").  
  - The stripped-down study answers the key question with 93% of the full study’s statistical power.  
  - Choosing a suboptimal design to *prevent* a $40M loss to ratepayers is a fiduciary duty—not an ethical failure.  

  ---

  ### **WHAT WOULD MAKE THIS THE WRONG CALL?**  
  Three key sensitivities:  
  1. **Curtailment cost below $22M**: If costs are <$22M, the full study’s extra information might justify its risk (but staff’s $40M estimate is robust).  
  2. **Board prioritizes environment over rates**: If instream uses outweigh ratepayer costs (e.g., valuing estuary gains >$25M), triggering curtailment could be desirable—favoring the full study.  
  3. **Counsel adopts most-likely-world standard**: This would slash the study’s value, making "build C now" preferable. We strongly advise against this reading.  

  ---

  ### **CONCLUSION**  
  Commissioning the stripped-down study maximizes expected net benefits ($45.1M) while respecting legal and scientific boundaries. It is the only option that addresses both groundwater uncertainty and regulatory exposure. The Subcommittee moves that the Board approve $3.5M for the study by 15 September 2023.  

  Respectfully submitted,  
  Science and Engineering Subcommittee, Kestrel Basin Water Authority  

