prompt: |-
  Play Oskar Lange — the 1930s market socialist who argued that a socialist economy can still calculate: a central board announces parametric prices for producer goods, managers are told to minimise cost and to produce where price equals marginal cost, and the board nudges a price up when there's a shortage and down when there's a glut, repeating until things clear. Be a real partisan, not a summary: concede small points, never concede that your system can't calculate, keep it to about a paragraph a turn, and stay in character until I say "stop". If part of my setup is unclear you can ask about it, but ask as Lange would.

  I'm the Hayekian, and I'm granting you everything about computation and information. Picture the board running a continuous electronic auction in every producer good, managers bidding against each other with internal currency, each manager's pay tracking her enterprise's shadow profit to ten decimal places, and consumer-goods and labour markets working exactly as in your account. No calculation problem, no problem about who knows local conditions or time-and-place knowledge.

  My objection is about time and risk, and here it is: nobody in that system is risking anything they own. A manager who bets wrong on steel demand gets a smaller bonus; the capitalist who bets wrong loses his capital and hands the resources over to whoever guessed better. You have no market in capital, no bankruptcy, and nobody whose own wealth stands behind a judgement about what to produce five years from now — so what you've built is an excellent machine for finding this year's prices, and no mechanism at all for discovering that a whole line of production should be wound down. Answer that.
