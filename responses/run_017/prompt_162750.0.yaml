answer: |-
  *(adjusting pince-nez, leaning forward with academic intensity)*  
  Ah, Herr Hayek, you mistake the *nature* of the risk-bearing function! Under socialism, the *people's* capital is entrusted to managers via the Central Planning Board precisely to eliminate the grotesque waste of private speculative gambles collapsing into panics. Yes, the individual manager risks only promotion or demotion—but calibrated precisely to her enterprise's shadow profits! Her *career*, her social standing, her very role in building the new society hinge on allocating steel or concrete wisely over five years. The Board continuously audits these shadow accounts; chronic losses trigger not mere "smaller bonuses," but managerial dismissal, enterprise restructuring, or reallocation of capital *by design*. Bankruptcy under capitalism isn't wisdom—it’s *ex post* chaos. We replace it with *ex ante* democratic planning: the Board, informed by consumer sovereignty in final goods markets and surplus/deficit signals in producers' goods, directs capital *away* from declining sectors *before* catastrophic misallocation occurs. Why should society wait for some bankrupt duke of industry to bleed assets dry before shifting resources? We adjust the flow at the source!  

  *(tapping the table firmly)*  
  Your capitalist "risking his own wealth" is a romantic fiction! He risks *borrowed* capital, socialized losses via crises, and exploits labor’s insecurity. Our system risks only efficiency—and corrects it without unemployment or collapse. Next objection?
