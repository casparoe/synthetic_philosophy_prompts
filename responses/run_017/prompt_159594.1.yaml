prompt: |-
  I run onboarding for new engineers joining our model-monitoring team, and I've got 45 minutes next week. What I need them to walk out able to do is read a drift report and say something better than "the numbers moved." The concept is mechanistic anomaly detection: what were hunting isn't a weird input or a bad output, it's a change in which internal machinery is producing a behavior we thought we'd already characterized. The part they always get stuck on, and where I think the session lives or dies, is the identity question: when is the mechanism running now the same mechanism we wrote up six months ago?

  So plan the session for me rather than giving me the talk. What has to come first and what depends on what -- I suspect I can't even get them to state "the mechanism changed" until they have an intervention-based notion of a mechanism rather than a circuit-diagram notion, but I'm not sure that's where to start. One example to carry the whole thing: I've been using a loan classifier that reviewers traced to a salary-and-zipcode feature direction, which after a data refresh returns the same approvals with that direction gone and something functionally similar rebuilt out of two unrelated attention heads -- tell me if that's the wrong example, and what a carrying example here has to have and to lack. The misconceptions in the order they'll actually form, with the point in the sequence where each gets headed off: I'm guessing "anomaly just means rare input," "same outputs and same accuracy means same mechanism," and "the mechanism is whatever's in the diagram." And one question at the end that tells me they've got the identity question rather than just the vocabulary.

  Two constraints. I've decided to define identity pragmatically, by whether the safety case we already wrote still covers the new arrangement -- call that coverage identity -- and I want the plan built around it rather than around path-identity versus counterfactual-profile identity. And tell me what I should openly refuse to explain at this level.
reasoning: |-
  We are designing a 45-minute onboarding session for new engineers on a model-monitoring team. The goal is for them to be able to read a drift report and articulate more than "the numbers moved" by focusing on mechanistic anomaly detection. The core challenge is the identity question: determining when the current mechanism is the same as the one previously characterized.

  Key Concept: Mechanistic Anomaly Detection
  - We are not just looking for rare inputs or bad outputs, but a change in the internal machinery that produces a behavior we thought we had characterized.

  Core Insight: The session lives or dies on the "identity question" — when is the mechanism the same as before?

  Definition of Identity: We are using a pragmatic definition — "coverage identity". The mechanism is the same if the safety case we already wrote still covers the new arrangement.

  Common Misconceptions to Address (in the order they might form):
  1. Anomaly just means rare input.
  2. Same outputs and same accuracy means same mechanism.
  3. The mechanism is whatever's in the diagram.

  Carrying Example: 
  - You proposed a loan classifier that initially relied on a salary-and-zipcode feature direction. After a data refresh, the same approvals are produced, but that feature direction is gone and has been replaced by two unrelated attention heads that together rebuild a functionally similar behavior.
  - Why this example works: 
    - It shows that the output (approvals) and overall accuracy might remain the same, but the internal mechanism has changed.
    - It breaks the misconception that the mechanism is fixed (like a circuit diagram) because the internal structure has been replaced by a different arrangement.

  Plan Structure:
  Total: 45 minutes

  1. Introduction (5 minutes)
  2. Defining Mechanisms Pragmatically (10 minutes)
  3. The Identity Question and Coverage Identity (15 minutes)
  4. Working Through the Example (10 minutes)
  5. Recap and Check for Understanding (5 minutes)

  Detailed Plan:

  1. Introduction (5 minutes)
     - State the goal: To read a drift report and identify if the mechanism has changed in a way that matters for our safety case.
     - Set the stage: We monitor models for changes, but not all changes are the same. We care about the internal machinery that produces behaviors we've characterized.
     - Hook: "We don't just want to know that the numbers moved; we want to know if the same 'machine' is running under the hood."

  2. Defining Mechanisms Pragmatically (10 minutes)
     - Start by addressing the misconception: "The mechanism is whatever's in the diagram." 
     - Instead, define a mechanism by its role in the safety case: "A mechanism is a part of the model that we have characterized and for which we have a safety argument. It is defined by the interventions we can perform and the expected behavior under those interventions."
     - Contrast with a circuit diagram: The diagram might be a snapshot, but the mechanism is defined by what it does and how it responds to changes.
     - Key point: We care about mechanisms because they are the building blocks of our safety case. If the mechanism changes, the safety case might break.

  3. The Identity Question and Coverage Identity (15 minutes)
     - Pose the identity question: "When is the mechanism running now the same mechanism we wrote up six months ago?"
     - Introduce coverage identity: "We say the mechanism is the same if the safety case we built for the old mechanism still holds for the new one. That is, the same set of interventions and guarantees apply."
     - Address misconceptions:
       - "Anomaly just means rare input": Show that an anomaly in the mechanism can occur without any rare input (use the example: the same inputs are being processed by a different internal structure).
       - "Same outputs and same accuracy means same mechanism": Use the loan example to show that outputs can be the same but the mechanism changed. The safety case might rely on the salary-and-zipcode feature being used, but now it's gone.
     - Emphasize: We are not looking for exact structural identity (like the same neurons) but functional identity in terms of the safety guarantees.

  4. Working Through the Example (10 minutes)
     - Present the loan classifier example step by step:
       - Initial state: The model uses a salary-and-zipcode feature direction to approve loans. We have a safety case that says: "We have tested that this feature is robust against certain types of bias because we have interventions that can adjust it and we've seen it behaves as expected."
       - After data refresh: The model now uses two unrelated attention heads to rebuild a similar behavior. The approvals are the same, but the internal structure is different.
       - Analysis: 
          - Is the mechanism the same? 
          - The safety case was built for the salary-and-zipcode feature. Now that feature isn't there. Even if the outputs are the same, the safety case might not cover the new arrangement because:
            - The interventions we designed (e.g., adjusting the salary-and-zipcode feature) don't apply to the new heads.
            - The new heads might be vulnerable to different types of attacks or biases that we haven't tested.
       - Conclusion: The mechanism has changed (coverage identity is broken) because the safety case no longer applies.

  5. Recap and Check for Understanding (5 minutes)
     - Recap: We want to detect when the internal machinery changes in a way that breaks our safety case. We use coverage identity: same mechanism iff the safety case still holds.
     - Check for understanding (the key question): 
       - Ask: "Suppose we have a drift report showing that the internal activations for a particular behavior have changed, but the outputs and accuracy remain the same. How would you decide if the mechanism has changed?"
       - Desired answer: They should ask if the safety case we built for the old mechanism still covers the new one. They should mention that they would look at the interventions and guarantees in the safety case and see if they still hold.

  What to Refuse to Explain:
  - Do not get into the philosophical debates about identity (e.g., counterfactual-profile identity vs. path-identity). Stick to coverage identity.
  - Avoid deep technical details of how we monitor for mechanistic changes (e.g., specific tools or metrics) — that's for a follow-up session.
  - Do not dive into how to build a safety case — assume that exists.

  Timing Breakdown:
  - 0-5 min: Introduction
  - 5-15 min: Defining Mechanisms Pragmatically
  - 15-30 min: Identity Question and Coverage Identity (including addressing misconceptions)
  - 30-40 min: Example Walkthrough
  - 40-45 min: Recap and Check

  This plan focuses on building the mental model for the identity question using the coverage identity definition and the loan example. The key is to break the misconceptions and anchor the concept in the safety case.
answer: |-
  ### Session Plan: Mechanistic Anomaly Detection Onboarding (45 mins)  
  **Goal:** Engineers can articulate *why* a mechanism might have changed (using "coverage identity") when reviewing drift reports, moving beyond superficial observations.  

  ---

  #### **1. Introduction: The Stakes (5 mins)**  
  - **Hook:** Start with the pain point. Show a real drift report snippet where "numbers moved" (e.g., activation distribution shift) but outputs/accuracy stayed stable. Ask: *"Should we care? Why?"*  
  - **Core Problem:** "Our job isn’t just to flag shifts—it’s to answer: *Is the model’s internal ‘machine’ still the same one we vetted?* If not, our safety case could be invalid."  
  - **Define Mechanistic Anomaly:**  
    > "We hunt changes in *how* the model produces a known behavior—not just bad inputs/outputs. Like replacing a car’s engine with a different type: it might still drive, but is it safe?"  

  ---

  #### **2. What a Mechanism *Isn’t*: Breaking Misconceptions (10 mins)**  
  *Sequence misconceptions in the order they’ll arise during analysis. Actively debunk each:*  
  1. **"Anomaly = rare input" (Head off first):**  
     - *Example:* Show two inputs—one rare (e.g., "$1M loan request"), one common. Ask: *"Which is an anomaly?"*  
     - **Pivot:** "But mechanistic anomalies aren’t about inputs—they’re about *internal computation*. A common input processed differently is the real threat."  
     - *Intervention:* Contrast input anomalies (data drift) vs. mechanistic anomalies (internal logic drift).  

  2. **"Same output/accuracy = same mechanism" (Head off next):**  
     - *Example:* Display your loan classifier case **pre-change**: "Old mechanism used salary/zipcode for approvals. Safety case relied on auditing this."  
     - **Post-change:** "After data refresh, same approvals, same accuracy—but now two attention heads rebuild the behavior without salary/zipcode."  
     - **Pivot:** "Same outputs ≠ same internals. The ‘machine’ changed—our safety case assumed salary/zipcode was key. Now, unknown heads do the work."  

  3. **"Mechanism = the circuit diagram" (Head off last):**  
     - *Example:* Sketch a "circuit diagram" of the old loan classifier (salary/zipcode node). Then erase it and draw the new attention heads.  
     - **Pivot:** "Diagrams are static; mechanisms are *functional units*. If the new heads replicate the behavior *but respond differently to interventions*, it’s a new mechanism."  

  ---

  #### **3. Defining "Coverage Identity" (10 mins)**  
  - **Core Principle:** "Identity isn’t about hardware or code. It’s: *Does our safety case still cover this?*"  
    - *Safety Case:* "We wrote: 'Model uses salary/zipcode for loans—we tested for bias here.' If that’s gone, coverage fails."  
  - **Intervention-Based Thinking (Key Shift):**  
    - "Mechanisms are defined by how they respond to *tests* (e.g., adversarial edits, feature ablation)."  
    - *Loan Example:*  
      - **Old:** Ablating salary/zipcode changes approvals → safety case covers this.  
      - **New:** Ablating salary/zipcode does nothing, but ablating Head A breaks approvals → safety case *doesn’t* cover Head A.  
  - **Outcome:** "Coverage identity is lost. The 'machine' changed, even if outputs didn’t."  

  ---

  #### **4. Applying to the Loan Classifier Example (15 mins)**  
  **Carrying Example Notes:**  
  - *Why it works:* Shows output stability masking internal change, forces intervention-based reasoning, and ties to safety coverage.  
  - *What to emphasize:* "Salary/zipcode was a *known, audited* mechanism. The new heads are *functionally similar but unvetted*."  

  **Walkthrough:**  
  1. **Pre-change State:**  
     - "Mechanism: Salary/zipcode → approval. Safety case: 'We controlled for bias here via [intervention X].'"  
  2. **Drift Report Findings:**  
     - Show metrics: Activation shift in salary/zipcode node, new attention patterns. Outputs unchanged.  
  3. **Critical Analysis Questions:**  
     - "Did interventions that *used to* alter behavior (e.g., perturbing salary) still work? *No?* Coverage identity broken."  
     - "Do we have evidence the new heads replicate the behavior *safely*? *No—safety case gaps.*"  
  4. **Articulate the Change:**  
     - "Mechanism changed: Salary/zipcode dependency was replaced by an unvalidated attention-head ‘patch’."  

  ---

  #### **5. Recap & Check for Understanding (5 mins)**  
  - **Summary:**  
    1. Mechanistic anomalies = changes in *how* behavior is produced.  
    2. Coverage identity = "Does the safety case still hold?"  
    3. Mechanisms are defined by intervention responses, not diagrams.  
  - **Check Question (Reveals Identity Understanding):**  
    > *"If a drift report shows internal changes but stable accuracy, what would you need to know to declare the mechanism unchanged?"*  
    - **Target Answer:** "Evidence that the safety case interventions still work as expected on the new internals." *(If they mention "same code" or "same outputs," redirect to interventions/coverage.)*  

  ---

  #### **What to Refuse to Explain**  
  - **"Path-identity vs. counterfactuals":** "Today, we’re *only* using coverage identity—we won’t debate other definitions."  
  - **"How to build a safety case":** "Assume one exists; we’re focusing on verifying coverage."  
  - **"Tooling specifics":** "We’re learning principles today—next session covers how we detect these in practice."  

  #### **Why This Works**  
  - **Flow:** Starts with pain (vague reports), breaks misconceptions sequentially, anchors on coverage identity early, and uses one example deeply.  
  - **Loan Example Fit:** Perfect—it lacks structural similarity but has functional overlap, forcing intervention-based reasoning.  
  - **End Check:** The question isolates whether they grasp identity as a *safety coverage* issue, not just vocabulary.  

  **Post-Session:** Assign a toy drift report with a similar scenario. Ask: "Would you flag mechanistic drift? Justify using coverage identity."
