  - Causation framing: But-for cause (import refusal directly enabled deaths) vs Sen's entitlement failure (systemic deprivation). Here both apply strongly - state actively blocked access. 20% weight feels right.
  - Government capability: Known admin capacity + refusal motive implies foreseeability. 25% weight because intent matters for "crime" labeling.
  - Death mechanism: Malnutrition enabling disease vs starvation. This doesn't change much - policy still caused the vulnerability. Only 10% weight.
