prompt: |-
  Hey — I'm prepping tomorrow's seminar on famine and I keep flip-flopping on this, so give me a number rather than a discussion.

  Fictional case, call it Valland: the harvest comes in about 15% below trend. Markets more or less function, there's grain in neigbouring regions, the state has both the money and the admin capacity to import, but it declines to — partly to keep domestic prices from falling for its urban base, partly out of a sovereignty hang-up about outside relief. Over the following year something like 400,000 more people die than in a normal year, and post-mortems suggest most of those deaths are from dysentry and malaria riding on malnutrition rather than from starvation proper.

  What's your credence, single number, that this is better described as a poltical crime than as a natural disaster? Decompose it: how much wait on which counterfactual benchmark you use (excess deaths over a normal year vs. deaths traceable to the 15% shortfall itself), how much on whether "cause" means a but-for cause or something closer to culpable/entitlement-failure cause in Sen's sense, how much on how much foresight and capability we should credit the government with, how much on the disease-versus-starvation detail in the death toll, and whatever else you think belongs. Rough number plus one line of justification per term, then the combination. Then: which sub-question is the final number most sensitive to, and what single fact about Valland would move you the most if you learned it?

  Answer in American English, please.
