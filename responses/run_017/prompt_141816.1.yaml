prompt: |-
  I am a PhD student in political theory, and a chapter of my dissertation uses the iterated prisoner's dilemma to model how cooperative norms could get off the ground. A member of my committee handed me what he calls the evolutionary completion of the PD, and I cannot find the broken step in it, though I am convinced the conclusion is false.

  (1) In a one-shot PD, defection strictly dominates: whatever the other player does, you do better by defecting.
  (2) In the indefinitely repeated PD with continuation probability w, cooperation is sustainable as an equilibrium — under grim trigger, provided w ≥ (T−R)/(T−P) — so rational choice theory does not rule out cooperation as such. The one-shot result is a limiting case, not the whole story.
  (3) The dispositions that actually generate human cooperation in PD-like situations — reciprocity, reputation-sensitivity, guilt — are adaptations. Selection retains a disposition only if exercising it raised, on average, the fitness of the organisms that bore it.
  (4) A payoff matrix that records only money, or only the immediate outcome for the two players, therefore omits the consequences that matter: the fitness-relevant ones. Once those are written in, cooperating in a putatively one-shot PD maximizes what the agent really has reason to want.
  (5) So cooperation is rational in the one-shot case after all. The dominance argument in (1) is an artifact of an incompletely specified game, not a result about rationality.
  (6) By the same reasoning, though, nothing we are disposed to do could ever be irrational. Take any disposition selection has given us — the taste for sugar, the pull of revenge, parochialism toward out-groups. By (3) exercising it was fitness-enhancing, by (4) it therefore serves our real objective, and by (5) it is rational. Some of these dispositions misfire badly in modern environments, so the conclusion is unacceptable.
  (7) Worse, (5) seems to empty (1) of content: any game in which people cooperate anyway can be redescribed as not really a PD, so the model never binds.

  I want to keep (1) and (2), since the game-theoretic core is what the chapter rests on, and I do not want to say that evolutionary explanations of cooperation are merely decorative. Which step do you reject, why does that step look innocent when stated the way he states it, and what does rejecting it cost me — does it force a choice between treating rationality as payoff-relative and treating it as fitness-relative, or is there a way out that leaves both (1) and the evolutionary story intact? I would also like each of the alternatives priced, not just the one you prefer.
reasoning: |-
  Okay, this is a fascinating and intricate problem from a political theory PhD student. They're wrestling with an evolutionary argument that seems to undermine the foundational game theory in their dissertation chapter. Let me unpack this carefully.

  First, I notice the core tension: the committee member's argument leads to the conclusion that no evolved disposition can be irrational, which clashes with observable human behaviors like sugar cravings in modern environments. The student wants to preserve both the standard PD game theory (points 1-2) and evolutionary explanations, without collapsing into this everything-is-rational position.

  Hmm... the problematic leap appears to be in step (4). The committee member conflates fitness consequences with rationality in a way that ignores environmental mismatch. But why does this seem persuasive? Probably because when we say "fitness-relevant consequences," it sounds comprehensive—yet it's actually environment-dependent. The bait-and-switch happens by treating ancestral fitness payoffs as eternally valid.

  I should consider all escape routes. Option A rejects (4)'s premise by insisting rationality must reference current payoffs. That preserves the PD model but makes evolution irrelevant to rationality claims. Option B attacks (3)'s assumption that selection retains only fitness-enhancing dispositions—neutral traits can persist! This lets us keep both theories but weakens evolutionary explanations. Option C distinguishes between rationality of dispositions versus actions, which feels philosophically elegant but might complicate their dissertation chapter.

  Wait—the student needs concrete costs for each alternative. For Option A, they'd lose the deep connection between evolution and rationality they seem to want. Option B makes evolutionary accounts "looser" since not every trait is adaptive. Option C requires introducing a new distinction that might distract from their core argument. 

  The most balanced path might be Option C. By separating why we have a disposition (evolutionary) from whether it's rational to follow it now (game theory), they can say: "Grim trigger strategies explain cooperation in repeated games; evolved impulses explain how we implement them; but sometimes those impulses misfire." This keeps their chapter intact while blocking the everything-is-rational conclusion. 

  I should emphasize that rejecting (4) doesn't force them to choose between evolution and game theory—just to recognize their different domains. The fitness/rationality collapse is avoidable. And crucially, this still allows evolutionary explanations to be substantive, not just decorative.
answer: |-
  Your committee member's argument cleverly exposes a tension between evolutionary game theory and rational choice theory. The flaw lies in **step (4)**, specifically in its conflation of *fitness consequences* with *rationality-defining payoffs*. Here's the breakdown:

  ### **Why Step (4) is the Broken Step**
  - **The sleight of hand**: Step (4) assumes that because a disposition was fitness-enhancing *in ancestral environments*, its exercise *now* maximizes "what the agent really has reason to want." This ignores **environmental mismatch**. Fitness payoffs are defined by historical selective pressures, while rationality is evaluated relative to the agent's *current* goals and constraints.  
  - **The bait-and-switch**: It redefines the payoff matrix *post hoc* to include fitness consequences, transforming the game into something other than a Prisoner's Dilemma. But the PD is explicitly defined by its *material* payoffs (e.g., money, survival resources). Adding fitness consequences creates a **different game** (e.g., a coordination game or assurance game).  
  - **The rationality disconnect**: Even if cooperation enhanced fitness ancestrally, that doesn’t make it rational *today* if:  
    (a) Modern environments decouple behavior from fitness (e.g., eating sugar no longer improves survival),  
    (b) The agent's goals aren’t reducible to fitness (e.g., valuing ethics over reproduction).

  **Why it looks innocent**: The argument leverages a plausible intuition: "Evolution shaped us to maximize fitness, so evolved behaviors must be rational." This conflates *ultimate* (evolutionary) and *proximate* (decision-theoretic) explanations. It also smuggles in teleology—implying evolution "aims" at rationality, rather than producing heuristics that may fail in novel contexts.

  ---

  ### **Rejecting Step (4): Three Alternatives (Priced)**
  #### **Option 1: Rationality is Payoff-Relative (Keep 1 & 2; Soften 3)**  
  - **Core move**: Rationality is defined relative to the *specified payoffs in the game*. Fitness is irrelevant to the PD as modeled.  
  - **Costs**:  
    - **Evolution becomes decorative**: You can say dispositions like reciprocity *enable* cooperation in repeated games (saving (2)), but their rationality is judged solely by game payoffs. Evolutionary stories explain *why we have these heuristics*, not why they’re rational.  
    - **Cost to you**: Weakens the link between your evolutionary account and rationality claims. May require reframing your dissertation’s argument to avoid claiming evolved traits are "rational" *per se*.  
  - **Saves**: (1) and (2) intact; avoids (6) and (7).  

  #### **Option 2: Fitness-Relative Rationality, with Constraints (Modify 3 & 4)**  
  - **Core move**: Rationality *is* fitness-relative, but **only in environments of evolutionary adaptedness (EEA)**. In modern contexts, "rationality" requires updating payoffs to current fitness consequences.  
  - **Costs**:  
    - **Complicates your model**: You must specify which behaviors are "rational" (fitness-maximizing) only in ancestral vs. modern settings.  
    - **Undermines (1)**: In a *true* one-shot PD (where fitness = material payoffs), defection still dominates. "Cooperation is rational" only if fitness payoffs align with cooperation *in that specific environment*.  
    - **Cost to you**: Forces you into a niche defense: "Cooperation was rational in the EEA," which may not serve your chapter’s goals.  
  - **Saves**: Evolutionary explanations remain substantive; avoids (6) by allowing modern "irrationality."  

  #### **Option 3: Two Levels of Rationality (Reject 4’s Equivocation; Keep 1,2,3)**  
  - **Core move**: Distinguish:  
    - **Proximate rationality**: Acting optimally given *current* goals/payoffs (defection dominates in one-shot PD).  
    - **Ultimate rationality**: Traits that optimized fitness *historically* (cooperation was fitness-enhancing under repetition/kin selection).  
  - **Costs**:  
    - **Philosophical heavy lifting**: Requires defending why "rationality" in the PD sense (proximate) isn’t overridden by ultimate rationality.  
    - **Risk of contradiction**: If ultimate rationality justifies cooperation in one-shot PDs, (1) is undermined.  
  - **Saves**: Both (1)/(2) and evolution remain intact. Use evolution to explain *why* we *can* cooperate in repeated games (via grim trigger), not to redefine one-shot rationality.  

  ---

  ### **Recommended Path: Hybrid of Options 1 & 3**  
  Reject step (4)’s claim that fitness payoffs redefine rationality in the PD. Preserve the game-theoretic core:  
  - **In a canonical PD** (payoffs = money/immediate outcomes), defection dominates (1).  
  - **In repeated PDs**, cooperation is rational under certain conditions (2).  
  - **Evolved dispositions** (reciprocity, etc.) are *proximate mechanisms* that facilitate (2), but their existence doesn’t make cooperation rational in one-shot games.  

  **Why this works for you**:  
  1. **Saves your chapter’s foundation**: (1) and (2) remain unscathed.  
  2. **Evolution isn’t decorative**: It explains the *origin* of dispositions enabling equilibrium cooperation in repeated games.  
  3. **Avoids the absurdity** (6): Evolved dispositions can be "mismatched" and produce irrational behavior in novel contexts (e.g., sugar cravings).  
  4. **Blocks (7)**: The PD model retains its bite—if defection dominates given the payoffs, cooperation is irrational *unless* the game is repeated.  

  **Cost**: You must clarify that evolution explains *behavioral capacities*, not the rationality of actions in all contexts. This is a feature, not a bug: it captures why we sometimes cooperate "irrationally" in one-shot games (because heuristics misfire), without redefining the game itself.  

  ### **Key Philosophical Move**  
  Separate:  
  - **Rationality of actions**: Defined by incentives within a specified game.  
  - **Rationality of dispositions**: Explained by evolutionary history, but not directly transferable to action-rationality in mismatched environments.  

  This keeps game theory normative and evolution explanatory, without collapsing the two. Your committee member’s argument fails by ignoring that evolution optimizes for *inclusive genetic fitness*, not decision-theoretic rationality—and these can diverge when the environment changes.
