  You're right that at the checkpoint, if you didn't swallow the capsule at home, my view collapses to act-by-act reasoning: swallow now for +2 to avoid -2. But that's not a flaw—it's a feature. The policy-first approach shines at the outset, where choosing "swallow-at-home" nets you +6 by ensuring you get picked up and pay minimally. If you deviate (as you did by not swallowing), you're stuck with damage control. That doesn't make the initial policy irrational; it highlights how failing to bind yourself to it leaves you vulnerable to your future self's poor choices. Rationality isn't self-effacing here because the disposition (e.g., committing to swallow early) is what secures the superior outcome ex ante—it's only when you abandon it that you're forced into cruder, reactive decisions.

  Your protein folding analogy stings because it suggests the policy is "baked in" at the start, but that's precisely why it works: decision theory isn't modeling a physical system relaxing to equilibrium; it's prescribing how to avoid self-sabotage through precommitment. Choosing "updateless from the earliest node" isn't arbitrary—it's the point of maximum agency, where you can lock in a strategy that handles all future branches (like the checkpoint scan) optimally. If you evaluate later, you're already in a subgame where your earlier choices constrain you, so of course it looks different. But that doesn't undermine the policy's rationality; it shows why you should've stuck with it.

