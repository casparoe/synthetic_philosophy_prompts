  5. **Interpersonal comparison**: Why the 0-1 rescaling doesn't work and what assumptions are needed.

  6. **Scratchcard user**: How to think about self-harming choices and what extra input is needed.

  7. **Revised pipeline**: Concrete steps for a better approach.

  8. **Biggest self deception risk**: The main pitfall.

  Let's build the JSON accordingly.
