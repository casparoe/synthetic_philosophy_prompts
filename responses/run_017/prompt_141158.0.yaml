prompt: |-
  I've been trying to work out what I actually think privacy is, by trusting my gut on a list of cases and then asking what principle the verdicts add up to. I keep failing to find one principle that fits them all, and I'd like your help. No reading lists, citations, or references, please — I can't look anything up, and what I want is the principle itself, not where to read about it.

  Here are the cases and my verdicts.

  **C1.** My landlord installs a device in my apartment that watches continuously and processes the video on the spot, purely to count how many people are in the room so the heating can be adjusted. Footage is deleted every thirty seconds. No human ever sees it, nothing about what I do is ever stored, and nothing about me is ever inferred by anyone. My verdict: a clear and serious violation — the worst thing on this list. But if the identical device with the identical setup were in the building's shared lobby, which I walk through every day, I'd say it was fine, and I can't say what the difference is.

  **C2.** A data broker assembles a dossier about me — address, employer, hometown, the names of the people I live with, my political donations — and sells it to an insurer. Every item in it comes from a page I myself put up or agreed to publish. My verdict: a violation, and a worse one than any single one of those publications was.

  **C3.** A stranger who knows nothing about me goes and reads those same public pages, one at a time, over a week, and forms roughly the picture of me the dossier contains. My verdict: no violation at all. This is the pair I can't reconcile: C2 and C3 seem to differ only in that the broker's copy is cheaper to use.

  **C4.** The model on my phone — it runs entirely on the device, and nothing is transmitted anywhere — infers from my typing rhythm and app-switching that I am probably pregnant, and starts showing me prenatal ads. The inference is true. I hadn't told anyone. No one at any company ever learns it. My verdict: a violation, though a milder one than C1.

  **C5.** My ex-partner, who knows all manner of intimate things about me from the years we lived together, passes a few of them to an insurer that sets premiums with them. Nothing was accessed, hacked, bought, or inferred; they simply said what they already knew. My verdict: something is badly wrong here, and my first instinct is to call it a violation of my privacy — but it may be a different kind of wrong wearing privacy's clothes, and I can't tell which.

  **C6.** A colleague tells people I have a gambling problem. It is false, and it costs me a great deal. My verdict: a serious wrong, but not a violation of my privacy — which I think matters, because it suggests privacy isn't about what others believe about me, or about my reputation.

  **C7.** A close friend, over months, notices changes in me and works out correctly that I'm depressed. She never asks, never looks at anything of mine, never opens anything. She just starts checking in on me more. My verdict: I go back and forth. Sometimes this feels like the most intimate intrusion imaginable; sometimes it feels like the precise opposite of one.

  My own rule of thumb, such as it is: privacy is violated when someone makes me the object of their attention in a way I haven't agreed to. That gets C1 and C4, but it also says the stranger in C3 and the colleague in C6 violate my privacy, and I don't believe that. And the common alternative — that privacy is my control over information about myself — seems to get C2 and C3 backwards and to have nothing to say about C4, where no information goes anywhere.

  So: is there one principle that captures all seven verdicts, or close, and what does it say about C7? If no single principle does the work, give me the two or three best candidates, state each precisely enough that I could apply it to a case you haven't seen, and tell me plainly which of my verdicts each one forces me to give up — including whether C2 and C3 can really come apart, or whether one of them has to go. I'd also like to know whether my seven cases even settle the question, or whether they are consistent with several quite different theories that would diverge elsewhere.

  Please give me, first, at most about 500 words of prose: the candidates, the tension between them, which of my verdicts each sacrifices, and your recommendation. Say plainly how confident you are in that recommendation, and single out the one point in your answer you are least sure of and what would change your mind about it.

  Then give me a single JSON object in a fenced code block, parsable as-is, with this exact schema:

  - `principles`: array of 2–3 objects, one per candidate (including my rule of thumb if it survives repair), each with:
    - `id`: short string, e.g. `P1`
    - `name`: short descriptive label of your own coining
    - `statement`: one or two sentences, precise enough to apply to an unfamiliar case
    - `clauses`: array of objects `{clause, motivating_case}` — each clause of the principle paired with the case label that forces it
    - `verdicts`: object mapping each of `C1`–`C7` to one of `"violation"`, `"no violation"`, `"unclear"`
    - `severity_rank`: array of the case labels you count as violations, ordered from most to least serious, and nothing else
    - `sacrifices`: array of case labels whose verdicts it cannot match, each with a one-sentence `why`
    - `cost`: one sentence on what this principle buys its fit with, i.e. what complexity or independent counterintuitiveness it commits me to
  - `my_principle`: object with `restated`, `cases_it_misses` (array of labels), `smallest_repair`, and `repair_is_ad_hoc` (boolean plus one sentence of justification)
  - `verdicts_to_overturn`: array of `{case, my_verdict, recommended_verdict, why}`, empty if none
  - `undecided_case`: object with `case` (`C7`), `verdicts_by_principle` (object mapping principle ids to verdicts), `recommended_verdict`, and `decisive_consideration` (one sentence on what settles it if anything does)
  - `novel_case`: object with `scenario` (one sentence describing a case of your own construction, not on my list), `discriminates` (one sentence on which candidates it separates and how), and `verdicts_by_principle`
  - `underdetermination`: one or two sentences on whether my seven cases could in principle select a single theory, or whether they leave the field genuinely open
  - `confidence`: object with `overall` (one of `"low"`, `"medium"`, `"high"`), `confidence_in_ranking` (integer 0–100), `most_confident_claim` (one sentence), and `least_sure_point` (object with `claim` and `what_would_change_it`)
reasoning: |-
  Hmm, the user is wrestling with defining privacy through concrete cases where their intuitive verdicts don't neatly fit existing principles. They've presented seven scenarios (C1-C7) with their gut reactions and want a unified principle that explains all judgments without academic references. Their current "attention" theory fails (it incorrectly flags C3/C6 as violations), while "information control" fails differently (can't handle C4's local inference or justify C2-C3 asymmetry).

  Key tensions in their cases:
  - C1 (in-home sensor) feels worse than identical lobby monitoring → suggests location/context sensitivity
  - C2 (broker dossier) violates while C3 (manual research) doesn't → implies aggregation or cost matters
  - C4 (on-device pregnancy inference) is violation despite no data leaving → points to intimacy of insight itself
  - C5 (ex-partner disclosure) feels wrong but might not be privacy → tests boundaries between privacy and other harms
  - C6 (false rumor) is reputational harm not privacy → isolates truth/reputation from core concern
  - C7 (friend noticing depression) is ambivalent → highlights relational consent nuances

  Three candidate principles emerge from their patterns:
  1. **Aggregated Access Power (AAP)**: Focuses on capability for non-consensual insight. Explains C2 (broker's efficient aggregation) vs C3 (manual effort), C1 (in-home access point), and C4 (device's autonomous inference). Sacrifices C5 by calling it non-privacy (it's betrayal, not capability-building).
  2. **Vulnerability Creation (VC)**: Centers on creating exploitable weaknesses. Captures C1 (surveillance creates vulnerability), C2 (dossier enables exploitation), C4 (inference creates ad-targeting vulnerability), and C5 (ex-partner weaponizes knowledge). Struggles with C3 (no vulnerability created) and C7's ambivalence.
  3. **Contextual Integrity (CI)**: Emphasizes context-appropriate information flows. Handles C1 (home vs lobby distinction), C2 (broker violates expected norms), C4 (device infers beyond typing context). Fails C5 (ex-partner's disclosure might be norm-violating but not clearly privacy).

  For C7 (friend's inference), AAP and VC lean toward "no violation" (no aggregation/vulnerability), while CI allows "violation" if emotional observation breaches friendship norms. The depression case reveals privacy's relational dimension—sometimes attention is the antidote to violation.

  The novel case (employer using public data for promotion prediction) discriminates: AAP flags it (aggregation power), VC might not (if no harm), CI rejects it (work context ≠ personal insight). This shows principles will diverge when data is public but used unexpectedly.

  Recommendation: **Aggregated Access Power** best balances fit (only sacrifices C5) and coherence. It accepts that privacy isn't about information itself (C3 fine) but about concentrated, non-consensual insight capability. C5's wrongness is real but belongs to ethics of relationships, not privacy architecture.

  Least sure point: Whether C4's on-device inference truly "builds capability for others." If the phone never shares insights, is it still privacy violation? Might reframe: the device itself becomes an non-consensual observer.

  The cases underdetermine theory—multiple principles fit until we test novel scenarios like the employer example. But AAP offers the most parsimonious path through the thicket.
answer: |-
  Your cases reveal privacy's core tension between *access* and *harm*. No single principle perfectly fits all verdicts, but three candidates emerge, each sacrificing one verdict while preserving C2-C3 distinction and explaining C7's ambivalence. I recommend **Candidate 2 (Aggregated Access Power)** as the strongest fit, sacrificing only C5.

  **Candidate 1: Vulnerability Creation (VC)**  
  *Privacy is violated when another agent creates or exploits a capability to infer or use sensitive aspects of your state against your interests, without your consent.*  
  - Fits C1 (creates surveillance capability in private space), C2 (creates exploitable dossier), C4 (creates inference capability), and C5 (exploits known vulnerability).  
  - Sacrifices C6: False claims aren't exploitation *of your state*, so it matches your "not privacy" verdict.  
  - Costs: "Against your interests" is vague; "sensitive" is contextual.  
  - Severity: C1 > C2 > C4 > C5  
  - Fails C3: Manual research creates no *capability*, so no violation (matches you). C7: Friend creates no adversarial capability, so no violation (contrary to your intrusion feeling).

  **Candidate 2: Aggregated Access Power (AAP)**  
  *Privacy is violated when non-consensual access or inference—whether by aggregation, observation, or processing—creates a power imbalance by revealing or risking exposure of aspects you reasonably expect to control.*  
  - Fits C1 (non-consensual observation in intimate space), C2 (aggregation creates power imbalance), C3 fine (no aggregation/power), C4 (inference creates targeting power), C6 fine (reputation ≠ access).  
  - Sacrifices C5: Ex-partner's disclosure exploits knowledge but doesn't *create* new access/power imbalance.  
  - Costs: "Reasonably expect" is normative; "power imbalance" broad.  
  - Severity: C1 > C2 > C4  
  - C7: Ambivalent. If "checking in" assumes consent via friendship, no violation; if observation feels like scrutiny, it risks power imbalance (explains your back-and-forth).

  **Candidate 3: Contextual Integrity (CI)**  
  *Privacy is violated when information flows violate context-relative norms of appropriateness, consent, or distribution.*  
  - Fits C1 (home context demands higher consent), C2 (broker violates norms of public data use), C4 (typing context ≠ health inference), C5 (disclosure violates relationship norms).  
  - Sacrifices C6: False claims violate truth norms, not distribution norms.  
  - Costs: Relies on undefined "norms"; struggles with novel contexts.  
  - Severity: C1 > C5 > C2 > C4  
  - Fails C3: Reading public data adheres to norms, no violation (matches you). C7: Hinges on friendship norms—if observation is appropriate, no violation; if not, violation (fits your ambivalence).

  **Recommendation:** AAP best captures your verdicts (only sacrifices C5) and explains C7's duality. C5 feels wrong because it breaches trust, not because it *creates* access power—aligning with your suspicion it "wears privacy's clothes." Confidence: **Medium** (high on C1-C4/C6, medium on C7, low on C5 sacrifice). **Least sure point:** Whether AAP's "power imbalance" overstretches in C4. If on-device inference *never* transmits data, is power truly created? I'd rethink if shown that purely internal processing with zero external risk can't enable coercion.

  **Verdicts to overturn:** None. AAP preserves all except C5, which I reclassify as non-privacy violation.

