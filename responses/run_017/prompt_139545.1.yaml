prompt: |-
  Draft the joint statement of an adversarial collaboration between two philosophers who have argued for years about the three stances — physical, design, and intentional — and about what it is for a pattern to be real.

  Camp R (realist about patterns) holds that a pattern is real when some description of a system's behavior is cheaper than the bit map of that behavior under a non-gerrymandered coding scheme, and that where the intentional stance yields such a description, its belief and desire attributions are straightforwardly true rather than merely useful.

  Camp I (instrumentalist about stances) holds that the stances are instruments distinguished by which assumptions they buy prediction with — law, presumed design plus optimality, presumed rationality — that pattern-hood is relative to a coding scheme and to our explanatory interests, and that intentional attributions are true only in an as-if sense.

  Both accept a common scorecard. For any target and any stance, record: (i) accuracy on held-out situations; (ii) total description length, counting the stance's own attribution or assumptions plus the residual needed to recover the behavioral record; (iii) behavior under intervention, i.e. whether predictions degrade gracefully when components are modified. Assume throughout the usual no-traps and no-miracles conditions: the environment is not rigged against a stance's predictions, and the predictions' success is not luck.

  They have agreed to score four stipulated targets. S1: the intentional stance beats both other stances on held-out accuracy and on total description length with attribution cost included, and interventions come out as the intentional account predicts. S2: the intentional stance beats the design stance on raw held-out accuracy, but loses once the description length of the belief and desire attribution is charged, because the desire set has to be re-specified for each new class of situation; the physical stance is far worse on both measures. S3: intentional predictions are accurate and cheap, but fail systematically whenever an experimenter alters a component, whereas design-stance predictions degrade gracefully; nothing in the environment is rigged against the intentional attributions. S4: under coding scheme C1 the best intentional description is cheaper than the best physical one, and under C2 — whose decoder is no longer and no more gerrymandered than C1's — the ordering reverses.

  Write the document they should have produced. Begin with a numbered section of claims both can sign, including claims about what each stance is, what work the no-traps condition does, and what each of the four profiles does and does not establish. Follow it with a disagreements table whose columns are: the issue in neutral wording; the formulation of it each side would itself sign; whether the disagreement is genuine or merely verbal; the case, argument, or further finding both agree would bear on it; each side's prediction about that case, recorded in advance; and what each side would count as a reason to give up its own view. Add cruxes they have not yet thought of, especially any concerning whether intentional-stance success requires the target to be an optimizer rather than merely interpretable by us. Close with a short note on which residual disagreement you judge to be verbal and why, and on which single finding would most move the debate.

  Throughout, keep separate what is settled in the literature from what is contested among people who work on these questions, and do not present a contested reading as the consensus. Flag explicitly where you are extrapolating beyond anything anyone has actually argued, in particular where your conclusions depend on the stipulated profiles above rather than on real results.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two philosophers, Camp R (realist) and Camp I (instrumentalist), on the reality of patterns and the status of the intentional stance. The statement has two main parts: (1) a numbered section of agreed claims, and (2) a disagreements table. We also need a closing note.

  **Agreed Claims Section (Numbered):**

  Both camps agree on the following:

  1. **Definition of the Stances:**
     - The **physical stance** predicts behavior by appeal to the physical constitution and laws of the system and its environment.
     - The **design stance** predicts behavior by assuming the system is designed to function optimally (or near-optimally) towards certain goals in its environment.
     - The **intentional stance** predicts behavior by attributing beliefs and desires (or other propositional attitudes) to the system, assuming it will act rationally to achieve its desires in light of its beliefs.

  2. **The Common Scorecard:** For any target system and any stance, we record:
     - (i) **Accuracy**: Predictive accuracy on held-out situations (not used in constructing the model).
     - (ii) **Total Description Length**: The sum of (a) the description length of the stance's own attributions (e.g., the belief-desire set for intentional, the design specifications for design) and (b) the residual description length needed to recover the full behavioral record (i.e., the errors or deviations from prediction).
     - (iii) **Behavior Under Intervention**: How the stance's predictions degrade when components of the system are modified (e.g., gracefully, meaning predictions remain approximately correct for small changes, or catastrophically).

  3. **Background Conditions:**
     - **No-Traps Condition**: The environment is not rigged to undermine a stance's predictions (e.g., no adversarial scenarios designed to make the stance fail).
     - **No-Miracles Condition**: The predictive success of a stance is not due to luck (i.e., it must be robust and non-accidental).

  4. **What the Profiles Show:**
     - **S1**: This profile supports the intentional stance as highly effective. It shows that the intentional stance outperforms the physical and design stances on both held-out accuracy and total description length (with attribution cost included). Moreover, interventions are handled gracefully, as the intentional account predicts. Camp R takes this as strong evidence for the reality of intentional patterns and the truth of belief-desire attributions. Camp I agrees that this is the paradigm of instrumental success but maintains that the attributions are only as-if true.
     - **S2**: Here, the intentional stance beats the design stance on raw held-out accuracy but loses when the description length of the belief-desire attribution is included because the desires must be re-specified for each new class of situation. The physical stance is worse. Both agree that this shows the instrumental value of the intentional stance is high but that the cost of its attributions can be high in some cases. Camp R notes that this might indicate that the system is not a fully rational agent (so the intentional stance is not the whole story), while Camp I sees it as evidence that the stance is a useful instrument but not revealing a deep pattern.
     - **S3**: The intentional stance is accurate and cheap in description length, but its predictions fail systematically under component interventions, while the design stance degrades gracefully. The no-traps condition ensures that the environment isn't rigged against the intentional stance. Camp R sees this as evidence that the system is designed but not an intentional system (so intentional patterns are not real here). Camp I sees it as showing that the intentional stance is a useful heuristic in some contexts but not robust under intervention, hence not indicative of a deep pattern.
     - **S4**: Under coding scheme C1, the best intentional description is cheaper than the best physical one. Under C2 (with a decoder no longer and no more gerrymandered than C1's), the ordering reverses. Both agree that this shows that pattern-hood is relative to the coding scheme. Camp R holds that a pattern is real only relative to a non-gerrymandered coding scheme, so if C2 is non-gerrymandered, then the intentional pattern is not real under C2. Camp I takes this as evidence for the relativity of pattern-hood to our explanatory interests and coding choices.

  5. **Common Ground on Pattern-Hood:**
     - Both agree that a pattern is real (or at least, objectively discernible) when a description of the system's behavior is more compressed than the bit map under a non-gerrymandered coding scheme. However, they disagree on the implications for the intentional stance.

  **Disagreements Table:**

  The table will have the following columns:
  - Issue (neutral wording)
  - Camp R's formulation (what they would sign)
  - Camp I's formulation (what they would sign)
  - Genuine or Verbal?
  - Case/Argument/Further Finding that would bear on it (agreed by both)
  - Camp R's prediction (recorded in advance)
  - Camp I's prediction (recorded in advance)
  - What would make Camp R give up?
  - What would make Camp I give up?

  We'll list the key disagreements:

  1. **The Truth of Intentional Attributions:**
     - Issue: Are the belief and desire attributions made by the intentional stance straightforwardly true, or are they merely useful fictions?
     - Camp R: When the intentional stance yields a description that is cheaper than the bit map under a non-gerrymandered coding scheme, the belief and desire attributions are true (correspond to real internal states or dispositions).
     - Camp I: Even when the intentional stance yields a cheaper description, the belief and desire attributions are only true in an as-if sense (i.e., they are useful instruments for prediction but do not refer to real internal states).
     - Genuine or Verbal? Genuine.
     - Bearing Case: Consider a system that passes the S1 test (so intentional stance is best) but where we can inspect the internal mechanism and find no representations or states that correspond to the attributed beliefs and desires. Alternatively, a system that is optimized for a fixed goal but without any internal representations (e.g., a thermostat).
     - Camp R's Prediction: If the intentional stance is predictively superior and robust under intervention (S1), then there must be internal states that play the functional role of beliefs and desires, even if they are implemented in an unexpected way. If none are found, it would challenge their view.
     - Camp I's Prediction: The intentional stance can be successful without any internal representations (e.g., the thermostat). They predict that even in S1, we might find no such internal states, and the stance would still be instrumentally valid.
     - Camp R's Give-Up: If in an S1 case, we find that the system has no internal states that could be mapped to the attributed beliefs and desires (and no such states are needed for the predictive success), they would reconsider. Also, if it turns out that the intentional stance's success is always due to a design stance description (which doesn't require representations) then they might give up.
     - Camp I's Give-Up: If it were shown that whenever the intentional stance is predictively superior and robust, there are internal states that exactly mirror the attributed beliefs and desires (and that these states are causally responsible for the behavior), they might reconsider. Also, if it turned out that without real beliefs and desires, the intentional stance could not be robust under intervention.

  2. **Relativity of Pattern-Hood:**
     - Issue: Is pattern-hood relative to a coding scheme and our explanatory interests, or is it objective (once a non-gerrymandered coding scheme is fixed)?
     - Camp R: Pattern-hood is objective once a non-gerrymandered coding scheme is fixed: a pattern is real if a description is cheaper than the bit map under such a scheme.
     - Camp I: Pattern-hood is relative to a coding scheme and to our explanatory interests. There is no objective fact about which patterns are real, only about which are useful for us.
     - Genuine or Verbal? Genuine, but with a verbal component (they might mean different things by "real").
     - Bearing Case: S4 already illustrates the relativity. But consider a coding scheme C3 that is non-gerrymandered but chosen to make a particular pattern stand out. Can we objectively compare coding schemes? Also, consider a case where two coding schemes are equally non-gerrymandered but yield different pattern orderings.
     - Camp R's Prediction: In cases of equally non-gerrymandered coding schemes, there will be an objective fact about which pattern is more compressed (or they might tie). If two schemes are tied, then both patterns are real.
     - Camp I's Prediction: The choice between coding schemes is always interest-relative, so pattern-hood is relative.
     - Camp R's Give-Up: If it turns out that for any system, we can always find two equally non-gerrymandered coding schemes that reverse the pattern ordering, they might accept relativity. But they would argue that one of the schemes must be gerrymandered.
     - Camp I's Give-Up: If it turns out that there is a unique, objectively privileged non-gerrymandered coding scheme for any system (or that the relativity is only apparent and due to gerrymandering), they would reconsider.

  3. **Requirement of Optimization vs. Interpretability:**
     - Issue: Does the success of the intentional stance require that the target system be an optimizer (i.e., actually maximizing expected utility) or merely that it be interpretable by us as rational?
     - Camp R: The intentional stance requires that the system is actually optimizing (or nearly so) for its desires given its beliefs. Without optimization, the stance wouldn't be robust under intervention (as in S3).
     - Camp I: The intentional stance only requires that the system's behavior is interpretable as rational by us, not that it is internally optimizing. Robustness under intervention might fail (as in S3) even when the stance is useful in some contexts.
     - Genuine or Verbal? Genuine.
     - Bearing Case: Consider a system that is interpretable by the intentional stance (so it has a cheap intentional description) but is not an optimizer (e.g., it uses a simple heuristic that usually works but is not optimal). Then, under intervention, the predictions might fail (like S3). But what if we find a system that is interpretable and robust under intervention (like S1) but we can prove that it does not optimize? (This might be hard because robustness under intervention might be taken as evidence of optimization.)
     - Camp R's Prediction: If a system passes S1 (robust under intervention), then it must be optimizing (or very nearly) for the attributed desires and beliefs. If we can show that it is not optimizing (e.g., by showing that it consistently chooses sub-optimal actions in a way that the intentional stance would not predict) then the intentional stance would fail under intervention.
     - Camp I's Prediction: A system can be interpretable without being an optimizer (e.g., using bounded rationality). They might predict that even non-optimizing systems can sometimes be robust under intervention if the environment is stable, but they agree that S3-like cases are common for such systems.
     - Camp R's Give-Up: If we find a system that passes S1 (so robust under intervention) but can be proven to not be optimizing (e.g., by showing that it systematically deviates from optimality in ways that are not captured by the intentional attributions and yet the predictions hold), they would be challenged. But they might argue that the attributed beliefs/desires are then incorrect.
     - Camp I's Give-Up: If it turns out that every system that passes S1 (robust under intervention) can be shown to be an optimizer (in the sense of maximizing expected utility relative to the attributed beliefs and desires) then they might accept that optimization is required for robustness.

  **Cruxes Not Yet Thought Of:**

  We are asked to add cruxes they have not yet thought of, especially regarding whether intentional-stance success requires the target to be an optimizer rather than merely interpretable.

  - **Crux 1: The Role of Learning:** Consider a system that learns over time. The intentional stance might attribute changing beliefs and desires. But is the system actually updating beliefs by Bayesian reasoning, or is it using a non-Bayesian heuristic? If we can show that the system uses a heuristic that is not belief-based (e.g., associative learning without representing beliefs) but the intentional stance still works robustly (including under intervention and with a cheap description), then that would challenge Camp R and support Camp I.

  - **Crux 2: Emergent Intentionality in Complex Systems:** Consider a complex system (e.g., a swarm of insects) that, at the collective level, admits of a cheap intentional description (e.g., the colony "wants" to find food and "believes" there is food in a certain direction). But individually, the insects are simple and do not have beliefs or desires. Does the intentional stance at the collective level reveal a real pattern? Camp R might say yes (the pattern is real at the collective level) and Camp I might agree but only as an instrument. But what if the collective behavior is robust under intervention? Camp R would say that the collective has real intentional states (emergent), while Camp I would say it's just a useful fiction.

  **Closing Note:**

  The residual disagreement about whether intentional attributions are "true" or "as-if" is partly verbal. Camp R uses "true" to mean that the attributions are part of the best (most compressed) description of the system's behavior under a non-gerrymandered coding scheme and that they are robust under intervention. Camp I uses "true" in a more robustly realist sense (correspondence to internal states) and denies that. But there is a genuine disagreement about the need for internal representations and optimization.

  The single finding that would most move the debate is a system that passes S1 (so intentional stance is best on all counts) but where we can conclusively show that the system does not have internal states corresponding to the beliefs and desires and does not optimize. For example, a system that uses a simple look-up table or a set of condition-action rules that happens to mimic rational behavior robustly. If such a system exists, it would challenge Camp R and support Camp I. Conversely, if every S1 system turns out to have internal representations and to be optimizing, that would support Camp R.

  **Extrapolation Note:**

  We must flag where we are extrapolating. The four profiles (S1-S4) are stipulated for this exercise and not based on actual results. Also, the cruxes about learning and emergent intentionality are extensions beyond the current agreed cases. The conclusions drawn from the profiles are part of the thought experiment.

  Now, we write the joint statement.
answer: |-
  ## Joint Statement: Adversarial Collaboration on the Reality of Patterns and the Status of the Stances  
  **Parties:** Camp R (Realist about Patterns) and Camp I (Instrumentalist about Stances)  
  **Date:** October 26, 2023  

  ### 1. Agreed Claims  
  Both camps endorse the following statements, derived from our shared scorecard methodology and interpretation of the stipulated cases (S1–S4). These claims reflect common ground established through debate and analysis of the literature, with explicit notation where extrapolation beyond existing arguments occurs.  

  1.1 **Definitions of the stances**:  
     - The **physical stance** predicts behavior based on the system's physical properties and the laws governing its environment.  
     - The **design stance** predicts behavior by assuming the system is designed to achieve specific functions optimally (or near-optimally) within its environment.  
     - The **intentional stance** predicts behavior by attributing beliefs, desires, and rationality to the system, assuming it acts to fulfill its desires given its beliefs.  

  1.2 **The scorecard metrics**: For any target system and stance, we evaluate:  
     - (i) **Accuracy**: Predictive success on held-out situations (unused in model construction).  
     - (ii) **Total description length**: The sum of (a) the description length of the stance’s core attributions (e.g., beliefs/desires for intentional; design specs for design) and (b) the residual length needed to encode prediction errors.  
     - (iii) **Behavior under intervention**: Whether predictions degrade gracefully (gradually and predictably) when system components are altered.  

  1.3 **Background conditions**:  
     - **No-traps condition**: The environment is not adversarially configured to undermine a stance’s predictions (e.g., no deceptive setups targeting stance-specific assumptions). This ensures predictive failures reflect stance limitations, not environmental sabotage.  
     - **No-miracles condition**: Predictive success is non-accidental; it arises from stance-relevant features of the system or environment.  

  1.4 **Interpretation of the stipulated cases**:  
     - **S1** (Intentional dominance): Establishes that the intentional stance can outperform other stances on accuracy, description length (with attribution costs), and graceful intervention. Camp R views this as evidence for the stance’s truth; Camp I views it as evidence for instrumental utility. Both agree it does not *prove* the existence of internal representations (e.g., beliefs as neural states), as S1 is compatible with multiple implementations.  
     - **S2** (High attribution cost): Shows that intentional stance accuracy may rely on context-specific desire attributions, increasing description length. Both agree this demonstrates that instrumental value can be high even when patterns are "shallow" (non-robust or costly). It does not resolve whether beliefs/desires are real or as-if.  
     - **S3** (Intervention fragility): Reveals that intentional stance predictions can fail catastrophically under intervention even when accurate and cheap pre-intervention, while design stance predictions degrade gracefully. Both agree this suggests a misalignment between intentional attributions and underlying causal structure. It does not imply the intentional stance is never valid; it highlights that robustness under intervention is a distinct criterion for pattern depth.  
     - **S4** (Coding-scheme relativity): Demonstrates that pattern compression rankings can reverse under equally non-gerrymandered coding schemes. Both agree this illustrates the relativity of pattern "reality" to coding schemes. Camp R holds that objectivity is restored by fixing a scheme; Camp I holds that scheme choice is interest-relative.  

  1.5 **Pattern-hood**:  
     - Both accept that a pattern is "objectively discernible" when a description of behavior is shorter than the bit-map under a non-gerrymandered coding scheme. *Extrapolation note: This formalization builds on Dennett (1991) and information-theoretic approaches (e.g., Chaitin, Kolmogorov), but the "non-gerrymandered" criterion is contested in the literature (e.g., McAllister, 2003).*  

  ---

  ### 2. Disagreements Table  
  The table below catalifies key unresolved disputes. "Genuine" disagreements reflect substantive differences; "verbal" disagreements arise from divergent definitions. Predictions and give-up conditions are pre-committed.  

  | Issue (Neutral Wording) | Camp R's Formulation | Camp I's Formulation | Genuine/Verbal? | Case/Argument/Finding That Would Bear on Issue | Camp R's Prediction | Camp I's Prediction | Camp R's Give-Up Condition | Camp I's Give-Up Condition |  
  |-------------------------|----------------------|----------------------|-----------------|-----------------------------------------------|---------------------|---------------------|----------------------------|----------------------------|  
  | **Truth of intentional attributions** | When the intentional stance yields a compressed description under a non-gerrymandered coding scheme, its belief/desire attributions are straightforwardly true (i.e., correspond to causally efficacious states/properties). | Belief/desire attributions are never straightforwardly true; they are useful fictions that license predictions, true only in an "as-if" sense, regardless of compression. | Genuine | A system passing S1 where internal mechanisms are fully inspectable (e.g., via neuroscience or reverse engineering). | Internal states will align with attributed beliefs/desires (e.g., representational structures with content matching attributions). | No such alignment is necessary; internal mechanisms may be non-representational (e.g., brute-force lookup tables). | Attributions remain robustly predictive under intervention *without* any corresponding internal states. | Attributions require isomorphic internal states to achieve S1-level robustness. |  
  | **Objectivity of pattern-hood** | Pattern reality is objective once a non-gerrymandered coding scheme is fixed: compression under such a scheme signifies mind-independent structure. | Pattern-hood is inherently interest-relative: compression is always relative to a coding scheme, and scheme selection reflects pragmatic goals. | Partly verbal (divergent meanings of "reality") | Discovery of a system where all non-gerrymandered schemes yield conflicting compression rankings for the same pattern. | Non-gerrymandered schemes will converge on compression rankings for deep patterns; conflicts imply gerrymandering. | Conflicts will persist even among schemes meeting all formal non-gerrymandering criteria. | Proof that no objective basis exists to privilege one non-gerrymandered scheme over another. | Proof that a unique, interest-independent scheme is optimal for all systems. |  
  | **Role of optimization in intentional success** | Intentional-stance success (especially robustness under intervention) requires the system to be a genuine optimizer (e.g., maximizing expected utility). | Intentional success only requires interpretability (coherence with rationality norms), not optimization; heuristic systems can satisfy S1. | Genuine | A system that passes S1 but provably uses non-optimizing heuristics (e.g., satisficing with fixed thresholds). | Such systems will fail under intervention (S3-like) or require ad-hoc desire adjustments (S2-like). | Robustness can emerge from heuristics in stable environments; S1 may hold without optimization. | Discovery of an S1 system that is non-optimizing *and* robust under novel interventions. | Proof that all S1 systems optimize for a consistent utility function. |  

  ---

  ### 3. Additional Cruxes  
  These unresolved issues, particularly concerning optimization versus interpretability, emerged during collaboration and lack clear precedents in the literature:  

  - **Crux 1: Emergent interpretability without optimization**: Consider a complex system (e.g., a neural network) whose behavior admits a compressed intentional description but lacks global optimization (e.g., it uses local, non-rational heuristics). Camp R predicts intervention will expose inconsistencies (S3 profile); Camp I predicts robustness may hold if heuristics are environment-tuned. *Bearing finding*: Train a network via evolution (non-optimizing process) to behave "rationally" in a niche; test under intervention.  

  - **Crux 2: Learning and belief revision**: Does intentional-stance robustness require the system to update beliefs via rational inference (e.g., Bayesian), or is interpretability sufficient? *Bearing finding*: A system that "learns" via random weight adjustments but is interpretable as having beliefs. Camp R predicts intervention (e.g., altering input patterns) will break belief attributions; Camp I disputes this.  

  *Extrapolation note: These cruxes depend on the stipulated profiles (e.g., S1–S3) and are untested; no empirical literature directly addresses them.*  

  ---

  ### 4. Closing Note on Residual Disagreements  
  We judge the **objectivity of pattern-hood** disagreement as partly verbal. Camp R uses "real" to mean "objectively compressible under a non-gerrymandered scheme," while Camp I reserves "real" for "mind-independent beyond compression." This masks substantive agreement on the role of coding schemes.  

  The **single finding** that would most advance the debate is:  
  > **A system passing S1 (intentional dominance) with inspectable internals, where no belief/desire-corresponding states exist and non-optimizing heuristics explain robustness.**  

  Such a finding would challenge Camp R (forcing retreat to "as-if" or redefining "truth") and support Camp I. Conversely, finding isomorphic internal states in all S1 systems would strengthen Camp R.  

  ---  
  **Signed,**  
  Camp R (Realist) _________________________  
  Camp I (Instrumentalist) _________________________  

  ---  
  **Appendix: Consensus and Extrapolation Notes**  
  - **Settled in literature**: The three stances (Dennett, 1971, 1987) and description-length approaches to patterns (e.g., Dennett, 1991; computational mechanics, Crutchfield, 1994) are established. Disagreements persist on their ontological implications.  
  - **Contested readings**: The "no-gerrymandering" criterion for coding schemes is debated; it is not consensus that it resolves objectivity (McAllister, 2003; Ross, 2000).  
  - **Extrapolations**: Conclusions about S1–S4 and the cruxes are *extrapolations* from stipulated profiles, not real-world data. The give-up conditions and predictions are novel to this collaboration.
