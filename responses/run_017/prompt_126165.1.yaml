     Part of the disagreement the game can't stage:

          - The game does not address the question of whether universals exist independently of particulars (Platonic realism) or in the particulars (Aristotelian realism). We are only getting at recurrence vs. resemblance.

     Let's write the minute-by-minute with this.

     Timeline:

          0-5 min: 
              - Explain the matching game rules.
              - Hand out one card to each student. The remaining 18 cards are the draw pile.

          5-35 min: 
              - Play the matching game. 
              - Turns: go around the room in order. Each turn:
                   a. The player draws one card from the draw pile (so they have one more than before).
                   b. They may form as many pairs as they can from their hand. For each pair, they set the pair aside and score 1 point.
                   c. If they have at least one card left, they may ask one other player for a card. They choose one card from their hand and show it to the chosen opponent. They ask: "Do you have a card that is the same shape as this?" 
                   d. The opponent must check their hand. If they have one or more cards that they consider to be the same shape, they must give one (their choice) to the asking player. If they do not, they say "Go Fish", and the asker draws one card from the draw pile.
                   e. If the asker received a card, they may then form pairs again (if they have any matches).
                   f. The turn ends. The next player goes.

              - The game continues until the draw pile is empty and no more pairs can be formed.

