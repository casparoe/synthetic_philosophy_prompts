prompt: |-
  Hey — I'm putting together the take-home final for my upper-level seminar on contemporary moral philosophy (mostly third-years, they've all had one ethics course) and I need one question on Scanlon's contractualism and the aggregation problem that can't be answered by writing out the reasonable-rejectability formula, noting that complaints get compared one person at a time rather than summed, and concluding "so contractualism can't aggregate, unlike utilitarianism." I get some version of that from every second paper and it never tells me whether the person actually understands the machinery. I want something that forces them to locate *where* the aggregation pressure really comes from, once you remember that contractualism assessess principles rather than individual acts, and that a principle applies to the same person across a lot of different situations.

  So here's the twist I want the question built around — I was arguing about it with a friend who's writing on this stuff and we couldn't settle it. Stipulate the following, call it the Life-Profile Clause: when we ask whether a principle is reasonably rejectable for some given person, we assess that person's complaint not situation by situation but across the whole profile of situations in which the principle applies to them over a lifetime. Then give them a case where it does real work: an island ferry authority picks a safety standard under a principle that applies to everyone on the island. Cheap standard: 200,000 residents each pay about three dollars a year; twelve crew members face a roughly one-in-two-hundred annual chance of drowning. Expensive standard: no one pays, the crew risk drops to about one-in-two-thousand. Now add that the crews are picked by an annual lottery from the whole island population, so over a working life a given person is usually a payer and occasionally a crew member. Ask them what the Life-Profile Clause does to the aggregation objection here, and whether it helps or hurts: does it show that the anti-aggregation result was only ever an artefact of tallying complaints one situation at a time, or does it show that the utilitarian-looking answer is really being produced by the lottery and the reciprocity it sets up rather than by the rejection procedure itself? And then the part I care most about — what does the clause do for the people who only ever show up on the losing side of the profile (a resident who can't serve on a crew, a short-term visitor, someone born after the standard is set)? If it abandons them, is contractualism back where it started?

  A few practical things: it's a 90-minute question, 20 marks, closed book, so it shouldn't depend on anyone remembering secondary literature or page numbers — the Life-Profile Clause should be stated in the question itself, self-contained. I'd also like it to be robust against the two stock essays, i.e. the one that just restates the Transmitter Room / many-small-benefits-vs-one-big-loss setup, and the one that reaches for the move about individuals having reasons that concern other people's well-being without saying whether that move is legitimate. Ideally the marking scheme tells me what to do with a candidate who writes either of those.

  Give me the whole thing as a numbered list of exactly five items, nothing before or after it:

  1. The question exactly as it would appear on the exam paper.
  2. A model answer of roughly 300-350 words — this is the one item allowed to run long.
  3. The five must-hit moves an A answer makes, one sentence each, with the marks out of 20 attached to each move.
  4. What a B answer looks like: the move it makes that the A answer also makes, and the one it misses.
  5. The two or three ways candidates standardly blow this question, and which marks each should cost.
reasoning: |-
  Okay, the user is a philosophy professor designing a take-home final exam question on Scanlon's contractualism and the aggregation problem. They're frustrated with students giving superficial answers that just restate the reasonable-rejectability formula without deeper understanding. 

  Hmm, what they really want is to force students to grapple with two key insights: first, that contractualism evaluates principles across entire life-profiles rather than isolated situations; second, that this shifts how we think about aggregation. The ferry safety case with the lottery system is clever because it creates reciprocity - most people experience both sides over time. 

  The tricky part is handling edge cases like permanent residents who never serve on crews. If the life-profile approach can't protect them, does contractualism collapse back into the original aggregation problem? That's the philosophical heart the professor wants students to wrestle with.

  For the exam design, I need to make sure: the question stands alone with the Life-Profile Clause defined; it blocks stock answers about transmitter rooms or vague appeals to others' well-being; and the grading scheme clearly penalizes those canned responses. The professor seems particularly concerned about distinguishing A answers (that spot how the lottery creates reciprocity) from B answers (that miss the edge case problem).

  The model answer should demonstrate: how life-profiles transform individual complaints into reciprocal interests; why this resembles utilitarianism but isn't identical; why non-participants get abandoned; and what this reveals about contractualism's core. Word count is tight at 300-350 words - every sentence must count.

  For grading: top marks (4 each) should go to recognizing reciprocity, edge case vulnerability, the utilitarian-similarity-but-difference point, and implications for aggregation debates. Missing the edge case issue is the classic B-grade mistake. And we'll explicitly dock 8 marks each for transmitter-room regurgitation or hand-wavy "concerns for others" arguments.
answer: |-
  Here is the exam question package structured as requested:

  **1. The Question**  
  *"Contractualism evaluates moral principles by asking whether any individual could reasonably reject them given the burdens they impose. To deepen this assessment, consider the following **Life-Profile Clause**: When judging whether a principle is reasonably rejectable *for a particular person*, we assess that person's complaint not situation-by-situation but across the entire profile of situations in which the principle applies to them over their lifetime.*  

  The Island Ferry Authority must choose a safety standard under a principle binding all residents:  
  - **Cheap Standard**: 200,000 residents each pay $3/year; 12 crew members face a ~1/200 annual risk of drowning.  
  - **Expensive Standard**: No payment; crew risk drops to ~1/2000.  

  Crew are selected annually by fair lottery from the entire resident population (including those who paid in prior years). Assume a working lifespan of 50 years.  

  (a) Explain how the Life-Profile Clause transforms the aggregation objection against Scanlon’s contractualism in this case. Does it show that the objection was merely an artifact of situation-by-situation assessment, or that the utilitarian-like preference for the Cheap Standard stems from the lottery’s reciprocity? (10 marks)  
  (b) Assess the Clause’s implications for individuals excluded from the lottery’s reciprocity (e.g., a permanently disabled resident who cannot serve as crew, a short-term visitor, or someone born after the standard is set). If their complaints cannot be reasonably addressed, does contractualism revert to its original aggregation problem? (10 marks)"*  

  **2. Model Answer** (328 words)  
  *(a)* The Life-Profile Clause fundamentally alters the aggregation objection. Situation-by-situation, the Cheap Standard appears to pit many payers’ minor losses ($3) against a few crew members’ catastrophic risk (1/200 death chance), making it rejectable by crew. The Clause, however, assesses each person’s lifetime burden *across all roles*. For most residents, their "profile" involves paying $3 in many years (total ~$150) and facing elevated drowning risk in a few crew years (expected ~0.25-0.3 deaths over 50 yrs). The Cheap Standard’s *lifetime expected burden* (financial cost + mortality risk) is lower for each person than the Expensive Standard’s higher cumulative mortality risk during crew service. Crucially, the lottery ensures reciprocity: everyone shares both burdens. No individual can reasonably reject the Cheap Standard because, over their life, it offers a net *personal* advantage in expected well-being. This shows the initial anti-aggregation result *was* an artifact of slicing the principle situationally. However, the utilitarian-like outcome *depends entirely* on the lottery distributing risks/costs reciprocally. Absent reciprocity, the Clause alone doesn’t aggregate.  

  *(b)* The Clause fails individuals excluded from reciprocity. A permanently disabled resident pays $3/year but *never* benefits from reduced crew risk. Their lifetime profile contains only costs, making the Cheap Standard rejectable for them. Similarly, a visitor pays briefly but faces no crew risk, while a future-born resident inherits crew risk without prior payment. Their uncompensated burdens resemble the original aggregation problem’s "many small benefits vs. one large loss" dilemma. Contractualism *is* back where it started for these agents: the principle remains rejectable by them, as their complaints aren’t offset by gains elsewhere in their life-profile. Unless the principle incorporates separate provisions for non-participants (e.g., exemptions), their reasonable rejection threatens its general acceptability. This exposes a limit of the Life-Profile solution—it resolves aggregation only under conditions of strict reciprocity over time. Without that, contractualism cannot dissolve the objection.  

  **3. A-Grade Moves & Marks**  
  - (4 marks) **Correctly calculates lifetime burdens under reciprocity**: Shows Cheap Standard lowers *personal* expected lifetime cost (money + risk) vs. Expensive Standard due to lottery rotation.  
  - (4 marks) **Distinguishes reciprocity from aggregation**: Argues the utilitarian-like outcome stems from the lottery distributing burdens reciprocally, *not* the rejection procedure summing complaints.  
  - (4 marks) **Identifies exclusion problem**: Explains how non-reciprocating agents (disabled, visitor, future-born) bear uncompensated burdens under Cheap Standard.  
  - (4 marks) **Connects exclusion to core objection**: Demonstrates their unremediated complaints resurrect the original aggregation dilemma (many gain, few lose catastrophically).  
  - (4 marks) **Locates the limit**: Concludes the Life-Profile Clause resolves aggregation *only* under full reciprocity; without it, contractualism remains vulnerable.  

  **4. B Answer Profile**  
  - **Makes this A move**: Correctly calculates lifetime burdens under reciprocity for typical residents (4 marks), showing why they wouldn’t reject Cheap Standard.  
  - **Misses this A move**: Fails to analyze non-reciprocating agents’ complaints (loses 4 marks on part b) or superficially addresses them without tying to aggregation (e.g., "it’s unfair" without showing contractualism’s unresolved dilemma).  

  **5. Standard Failures & Penalties**  
  - **Regurgitates Transmitter Room case**: Spends >50% of answer describing it without engaging the Life-Profile Clause or ferry case. **Cost**: 0/20 (answers wrong question).  
  - **Vague appeal to "concern for others"**: Claims individuals consider others’ welfare when rejecting principles, implying aggregation *is* possible, without using the Clause or reciprocity. **Cost**: -8 marks (misses core mechanism).  
  - **Treats Clause as direct aggregation**: Asserts the Clause *allows* summing complaints across a life, contradicting Scanlon’s individualist ethos. **Cost**: -6 marks (misreads Clause’s function).
