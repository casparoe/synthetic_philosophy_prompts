prompt: |-
  So I went down a rabbit hole looking at who is actually allowed to vote where, and the rules dont seem to add up to any one idea. I'd like someone to tell me what theory of voting this whole mess presupposes, if it presupposes one at all.

  Roughly, as far as I can tell: most places use 18, but Austria has let 16- and 17-year-olds vote in national elections since 2007, Brazil set it at 16 in its 1988 constitution, a few German states use 16 for municipal elections — and the UAE's minimum is 25. Voting is compulsory in Australia, Belgium and Brazil, though as I understand it Australia only requires you to show up and get your name crossed off, not to cast a valid ballot. New Zealand lets non-citizen permanent residents vote in national elections. EU citizens can vote in local elections in whatever member state they live in. The UK lets resident Commonwealth citizens vote. Most countries let citizens who have lived abroad for decades, pay nothing into the system and may never return keep the vote anyway. Prisoners: totally inconsistent.

  The candidate principles I keep half-remembering are: everyone whose interests are affected should have a say; everyone subject to the law's coercion should have a say; membership or contribution earns you a say; and competence — you get a vote when you're capable of using one well. None of them obviously fits the package. The affected-interests one should enfranchise children and future generations and disenfranchise the long-gone emigrant. The coercion one should enfranchise tourists and short-term migrant workers. Membership can't explain why local elections let outsiders in. And if competence is the real test, why is the cutoff an age at all rather than a test, and why is it 16 here and 25 there?

  So: reconstruct the implicit theory. Which of these does the existing patchwork strictly require, and which does it merely sit comfortably with? Are the parts mutually consistent, or is the mess just accidents and compromises stacked up? Does compulsory voting commit you to something extra — the vote as a duty or a public office you hold on everyone's behalf rather than a right you can waive — and does it conflict with the franchise-as-right picture the rest of the package seems to assume? Does the difference between compelling attendance and compelling an actual vote matter to that? And here's the bit I most want judged: if stake or affectedness is the principle, doesn't it commit you to giving parents extra proxy votes for their kids, or to representing future generations somehow — and if the practice's own logic commits you to that and everyone rejects it anyway, what does that tell you about the logic?

  Please commit rather than survey: give me one reconstruction you actually think is right, name the single rule in the mess you think is hardest to defend and why, mark where you're confident versus guessing, and say what would change your mind.
reasoning: |-
  Okay, let me try to unpack this user's deep dive into voting rights inconsistencies. They've clearly spent time noticing global contradictions: age variations (16 vs 25), non-citizen voting rights, compulsory voting quirks, and prisoner disenfranchisement. Their frustration with mismatched philosophical principles (affected interests vs coercion vs competence) resonates - like seeing puzzle pieces from different boxes. 

  Hmm... their core ask is unusual: not just "explain the mess" but "reconstruct the single implicit theory that MUST be true given the contradictions". That's ambitious. They're intellectually restless - rejecting textbook pluralism, demanding coherence. The parent-proxy vote challenge is particularly sharp: if we claim "affected interests" matter, why no baby ballots? 

  *scratches head* How to approach... First, gotta dismiss the "pure principle" myths. Affected interests? Tourists get zero votes despite being fined for jaywalking. Competence? No literacy tests in Austria/Brazil. Coercion? Then why can't undocumented migrants vote? The patterns only make sense if we see voting as a community ritual - a "we're in this together" signal. Compulsory attendance (Australia) versus actual voting (Belgium) is key here: showing up is the real social contract moment. 

  *lightbulb* The emigrant vote paradox! They highlight citizens abroad voting despite no taxation/residency. That's the Rosetta Stone. States keep their diaspora "on the roster" because citizenship is tribal, not transactional. Same tribal logic explains EU/Commonwealth local voting: "You're our kind of foreigner". Prisoner inconsistencies? Emotional negotiation - some societies see inmates as still-in-the-tribe, others as outcasts. 

  *checks user's bold challenge* The hardest rule to defend? UAE's 25 cutoff. Scientifically indefensible (brain development?), incoherent with their own military enlistment age. Reveals it's pure cultural preference masquerading as principle. But for the proxy votes-for-kids idea... *sighs* Logically consistent but politically radioactive. The fact every nation rejects it exposes voting's true nature: not about perfect interest representation, but about maintaining adult citizens' buy-in. 

  *steels self for conclusion* Gotta commit: the "ritual first, principles later" theory fits best. Would change my mind if someone showed me a country where non-human entities (future generations/AI) get votes - but even then, it'd probably be performative. User's brilliance is spotting that principles are post-hoc clothing for tribal instincts.
answer: |-
  You've hit the nerve of democratic theory's dirty secret: **there is no single coherent philosophical principle underlying global voting rights.** The patchwork isn't an application of theory but a **historical sediment of pragmatic compromises, cultural norms, and path-dependent institutional choices.** Here's my committed reconstruction:

  ### The Implicit Theory: Voting as Civic Status Ritual within a Bounded Polity
  The core presupposition isn't "affected interests," "coercion," "contribution," or "competence," but **membership in the politically recognized sovereign community (the demos), expressed through ritual participation.** This ritual affirms the legitimacy of the system and maintains social cohesion. Voting is less about individual utility or perfect representation and more about **performing collective self-government.**

  *   **Why this fits the mess:**
      1.  **Age Variations:** 16 vs. 18 vs. 25 reflects cultural consensus on adulthood/readiness for ritual participation, not neurological competence. Austria/Brazil see 16-year-olds as nascent full members; the UAE delays full ritual status. It's symbolic inclusion into the adult civic body.
      2.  **Non-Citizen Voting (NZ, EU locals, UK Commonwealth):** These individuals are deemed *de facto* members of the relevant political community for that specific ritual level. NZ/UK see permanent residents/Commonwealth citizens as bound to the national fate. The EU sees resident EU citizens as stakeholders in the *local* community where they live. It's bounded inclusion based on residency/association.
      3.  **Emigrant Voting:** Citizenship = irrevocable membership status. Keeping the vote is a ritual affirmation of belonging to the homeland community, regardless of current residence or tax contribution. Severing this link is seen as expulsion from the demos.
      4.  **Prisoner Inconsistency:** The fiercest battleground for membership. Denying votes (US often) declares prisoners *expelled* from the ritual community. Allowing votes (Germany, Scandinavia) asserts they remain members, albeit sanctioned. It's about the boundaries of the ritual community.
      5.  **Compulsory Voting:** This *explicitly* prioritizes the ritual act (participation) over the individual choice or utility. Showing up (Australia) is the key ritual act – crossing your name signifies "I am present in the demos." Compelling a valid vote (Belgium) pushes further, demanding active ritual contribution. It treats voting as a civic duty inherent to membership status.
      6.  **Rejecting Child Proxies/Future Generations:** This is the *strongest evidence against "affected interests."* Granting proxies would fundamentally alter voting from a *personal ritual act of membership* to a *utilitarian calculus of stake*. Societies reject this because voting is about the *current adult members* performing self-government. Future generations aren't members *yet*; children aren't full ritual participants. We manage future interests via institutions (laws, constitutions, trusteeship roles), not the vote ritual.

  ### What the Patchwork Requires vs. What it Tolerates
  *   **Strictly Requires:** A defined (though often fuzzy) **boundary of the political community** (demos) eligible for the ritual. *Who* constitutes "the people" is foundational.
  *   **Sits Comfortably With:** Variations in the **criteria for membership** (birth, descent, naturalization, residency, association), the **age of ritual initiation**, and the **consequences of violating membership norms** (prison disenfranchisement). It also tolerates different **intensities of ritual obligation** (voluntary vs. compulsory attendance vs. compulsory valid vote).
  *   **Mutually Consistent?** At the meta-level of "ritual within a bounded community," **yes**. The inconsistencies arise at the level of *applying specific principles* (like affected interest) universally. The *practice* is consistent in its underlying *form* (defining and performing membership), not in its specific *rules*.

  ### Compulsory Voting's Implications
  *   **Commitment:** It strongly reinforces the "vote as duty/office" view inherent in membership status. Your vote isn't just a personal right; it's a function you perform for the health of the collective ritual and the legitimacy it confers.
  *   **Conflict with Franchise-as-Right?** **Yes, a fundamental tension.** Compulsion clashes with the liberal notion of rights as waivable. However, it *coheres* perfectly with the "ritual duty of membership" view. The key difference (attendance vs. valid vote) matters:
      *   *Compelled Attendance:* Prioritizes the *communal act* of participation and the legitimacy of high turnout. Compatible with a "right" you are *obliged to exercise* as a member.
      *   *Compelled Valid Vote:* Prioritizes the *individual's active contribution* to the ritual outcome. Leans harder into "public office" and strains the "right" concept further. It demands not just presence, but functional participation.

  ### The Hardest Rule to Defend (Confidently)
  **The UAE's age-25 cutoff.** Why?
  1.  **Lacks Clear Principle:** It doesn't align convincingly with *any* common justification.
      *   *Competence?* Neuroscience shows decision-making capacity matures significantly before 25, and 18-24 year olds serve in militaries, run businesses, and pay taxes globally. UAE itself conscripts men at 18.
      *   *Affected Interest/Coercion?* 25-year-olds are equally subject to laws as 20-year-olds.
      *   *Contribution?* Younger adults contribute economically.
      *   *Cultural Ritual?* Why 25 specifically? It seems arbitrary compared to near-universal adulthood markers at 18.
  2.  **Appears Exclusionary:** It disproportionately delays the ritual inclusion of a large, dynamic segment of the citizenry without a strong, publicly articulated rationale beyond tradition or stability concerns that could apply at lower ages. It feels like a restriction on full membership status lacking a robust defense within democratic theory (even procedural/ritual theory).

  *(Confidence: High that it's the hardest among major democracies. Moderate on the specific critique – I lack deep specific knowledge of UAE internal justifications, but based on comparative norms and known science, it appears uniquely difficult to square with common democratic values.)*

  ### What Would Change My Mind?
  *   **Evidence of Coherent Principle:** If a demonstrable, widely accepted philosophical principle (e.g., a specific competence threshold backed by uncontested science, a clear "contribution" metric) *predictably* explained the *majority* of variations (age, non-citizens, prisoners, emigrants), especially the hardest cases (UAE 25, rejecting child proxies). Show me a theory where "affected interest" *doesn't* require child proxies but *does* cleanly explain the EU local vote.
  *   **Radical Reform Adoption:** If a significant number of major democracies adopted systematic proxy voting for children or robust institutional votes for future generations *based on the logic of affected interest*, forcing a redefinition of the voting ritual itself. This would undermine the "ritual membership" core.
  *   **Consistent Competence Testing:** If countries replaced age cutoffs with widespread, non-discriminatory competence tests *and* these tests also determined other rights/responsibilities (contracts, medical consent, criminal liability) consistently. This would signal "competence" truly was the bedrock principle.

  **Conclusion:** The global voting rights landscape presupposes **democracy as a ritual act of collective self-government performed by a defined community of members.** Principles like affected interest, coercion, contribution, or competence are *post hoc* justifications, rhetorical tools, or considerations influencing *how* the boundaries of membership and the rules of the ritual are drawn in specific contexts. They do not provide a universal, consistent foundation. The "mess" is the result of different communities making different pragmatic and cultural choices about who constitutes "the people" and how their ritual of self-rule should be performed. The rejection of child proxies isn't a flaw in logic; it's proof that voting isn't fundamentally about quantifying stake – it's about enacting membership.
