prompt: |-
  I'm giving a 45-minute lunch-and-learn on the Condorcet jury theorem to about twenty machine-learning engineers at my company. It is on the agenda because several teams have started majority-voting across several LLMs and describe the result as the wisdom of crowds applied to models, and one of them has already built a slide with the theorem's curve on it. I want the session to land somewhere better than the claim that majority rule is justified: I want them to leave seeing the theorem as a result whose conclusion reverses when its inputs are weakened — that above-one-half competence is a per-voter requirement rather than an average, that conditional independence is doing the real work and is systematically violated by models trained on overlapping data, and that the whole thing goes silent when there is no fact of the matter to be right about, as with most of the safety judgments they actually vote on.

  Plan the explanation rather than giving it. I need the order the components must come in and what depends on what; the one example that should carry the session (I was going to use a three-person committee — tell me whether the model-ensemble case is better and why, and say what the example must have and what it must not have); the misconceptions this audience will bring or form, in the order they will surface, with the point in the sequence where each should be defused; one closing question that would show they had grasped the independence assumption rather than memorized the formula; and what I should openly refuse to cover in 45 minutes.

  Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user wants me to plan a 45-minute lunch-and-learn session on the Condorcet jury theorem for machine-learning engineers. They specifically want to move beyond the simplistic interpretation that majority voting is always wise, and instead highlight how the theorem's assumptions (especially voter competence and independence) are critical and often violated in their context of voting across LLMs.

  The user has outlined several key points they want to cover: that competence must be above 0.5 per voter rather than on average; that conditional independence is crucial and systematically violated by models trained on overlapping data; and that the theorem doesn't apply to subjective judgments without a "ground truth."

  I need to provide a numbered list of exactly five items covering: explanation order, core example choice, misconceptions sequence, a closing question, and scope limitations. Each item should be one or two sentences.

  For the explanation order, I'll start with the classic theorem to establish the baseline, then challenge the per-voter competence requirement, followed by independence as the key driver. After that, I'll address how overlapping training data violates independence, and finally discuss the "no fact of the matter" limitation.

  For the core example, I think a three-person committee is better than model ensembles for this audience. It's simpler and avoids conflating ML specifics with the theorem's core logic. The example needs clear binary choices and known individual competences, but shouldn't introduce correlation yet - that comes later.

  The misconceptions will likely surface in sequence: first that average competence suffices (defused when introducing per-voter requirement), then that independence is trivial (defused when discussing correlation), and finally that voting works for subjective judgments (defused during the "no ground truth" discussion).

  The closing question should test understanding of independence rather than memorization - something practical about when independence fails in their systems.

  For scope limitations, I should explicitly rule out extensions to correlated voters, weighted voting, or alternative theorems - this session is about understanding Condorcet's limits, not expanding it.

  The user is clearly sophisticated about both the theorem and their audience's work context. They want to prevent overconfidence in ensemble methods by showing where the math breaks down. I'll keep the response crisp and focused exactly on their requirements.
answer: |-
  1.  **Explanation Order:** Start with the standard theorem statement and curve for identical, independent voters with p>0.5 competence to establish the baseline "wisdom of crowds" result. Immediately follow by demonstrating that the conclusion reverses if *any single voter* has p<0.5 (using a simple majority vote), establishing the strict per-voter requirement. Then introduce conditional independence as the critical enabling factor for the probability amplification, before showing how overlapping training data systematically violates this independence. Finally, discuss how the theorem provides no guidance when there's no objective "correct" answer (e.g., safety judgments).
  2.  **Core Example:** Use the **three-person committee** voting on a clear binary fact (e.g., "Is this number prime?"). This is better than starting with model ensembles because it isolates the theorem's core probabilistic logic without the immediate distraction of ML specifics; the example must have explicitly defined individual competences (p1, p2, p3) and a known correct answer, but must *not* initially introduce correlation between voters.
  3.  **Misconception Sequence & Defusal:** First misconception (arising during baseline theorem): "Average competence above 0.5 is sufficient" – defuse immediately when introducing the per-voter requirement by showing a scenario where one member has p<0.5 and sinks the group accuracy. Second misconception (arising during independence discussion): "Independence is a minor technicality" – defuse when demonstrating how correlated errors (e.g., all trained on the same misinformation) drastically reduce majority accuracy compared to the independent case. Third misconception (arising during "no fact" discussion): "Voting still gives the best subjective answer" – defuse by emphasizing the theorem *only* guarantees approaching correctness when a correct answer exists and its assumptions hold.
  4.  **Closing Question:** Ask: "When designing your LLM voting system, what specific characteristic of your models or their training data would most strongly *violate* the independence assumption crucial for Condorcet's guarantee, and why?" (Forces them to identify the root cause - shared data/correlated errors - not just recall the term).
  5.  **Explicit Scope Refusal:** Openly refuse to cover extensions for correlated voters (beyond the basic violation demonstration), weighted voting schemes, or alternative jury theorems (like those handling heterogeneous competence distributions); focus solely on the original theorem's assumptions, why they fail for LLM ensembles, and the "no fact" limitation.
