prompt: |-
  hi — I'm a PhD student in formal epistemology (bayesian-ish, mostly conditionals) and I've somehow become the person who keeps the climate-risk register at a small adaptation consultancy. Almost nothing that reaches me is a plain datum. It's a conditional sentence from an engineer or a modeller: if the pumping station loses mains power you'll see water in the substation within four hours; if winter rainfall is above the 90th percentile there's a real chance the embankment overtops; if the levee is breached anywhere upstream teh gauge at Marsh Road will read over three metres. I recieve thirty or forty of these a quarter, I have to turn each into revised probabilities in a spreadsheet, those numbers feed a ranking that decides which defences get funded next year, and my director — who is lovely but thinks a prior is a kind of prayer — signs off on the whole thing before it goes to the client.

  The Judy Benjamin setup is the one I keep hitting, except in my job it's dressed up as engineering: the consequent is often about what *we* will later observe or be told, not about the world, and half the time the message only exists because some monitoring system with a fixed alert policy decided to send it. I need a procedure, not a tour of the options.

  So: give me a decision procedure I can run in fifteen minutes per message, in a spreadsheet, without asking my colleagues to understand any formula. Numbered steps, in the order I should ask the questions, and for each one say what counts as a sufficient answer and what I do when the answer is "the expert didn't say". It has to do at least these things: sort the sentence into (a) a claim about the world, (b) a claim about what we will observe or be told, and (c) a directive that tells us how to *treat* something — and tell me what to do with (c), because our ops manual is basically a list of those. Where the conditional is the Judy Benjamin shape, say explicitly why naively taking it as a proposition and conditioning on it goes wrong, and what move to make instead given I only have a partition and no similarity metric. Handle hedged consequents where nobody will give me a number. Handle the alert-policy cases, where the fact that no message came is itself supposed to be evidence. Mark which steps stop with "log it and don't update" and which ones hand the decision to me or my director because it's a modelling choice rather than a fact.

  Then run it on three: the Marsh Road gauge one; the hedged rainfall one with no number attached; and a case where I think the honest answer will annoy me — an alert-policy message, or one of the directives from the manual. I want to see the procedure refuse something I currently use.

  Keep the whole reply under 900 words: the steps as a numbered list of eight or fewer, one small table mapping message-type to which update move applies versus when to refuse, the three worked cases in prose, then a short paragraph on what the procedure can't do. No citations, no literature review, no "van Fraassen says" — I've read all that, I need something my director can sign. Do flag which steps are actually forced by the theory and which are just sensible office conventions, because I'll have to defend the first kind to the client's technical reviewer and I can quietly adjust the second.
reasoning: |-
  We are designing a decision procedure for updating probabilities based on conditional messages in a climate-risk context. The procedure must be executable in about 15 minutes per message, within a spreadsheet, without requiring colleagues to understand complex formulas. It should handle three types of content: (a) claims about the world, (b) claims about observations or reports, and (c) directives (which are operational rules). We also need to address Judy Benjamin-type problems (where conditioning on the conditional as a proposition is inappropriate), hedged consequents (without precise probabilities), and alert-policy cases (where the absence of a message is evidence).

  The procedure will have up to 8 steps. We will then apply it to three examples: 
  1. The Marsh Road gauge example: "if the levee is breached anywhere upstream, the gauge at Marsh Road will read over three metres."
  2. A hedged rainfall example: "if winter rainfall is above the 90th percentile, there's a real chance the embankment overtops" (with no number).
  3. An alert-policy case or a directive that the procedure might refuse.

  Additionally, we will mark steps that are theoretically forced versus those that are office conventions, and note what the procedure cannot do.

  **Decision Procedure Steps:**

  1. **Classify the message type:** 
     - Ask: "Is the message a conditional statement (if A then B)?" 
     - If no, then stop: log it and do not update (it might be a directive or non-conditional fact; proceed to step 4 for directives). 
     - If yes, proceed to step 2.

  2. **Identify the antecedent (A) and consequent (B):**
     - Write down A and B clearly.
     - Proceed to step 3.

  3. **Determine the nature of the consequent:**
     - Ask: "Is B about an event in the world (e.g., 'the embankment overtops') or about what we will observe/be told (e.g., 'the gauge will read X', 'we receive an alert')?"
     - If B is about the world, then the message is a Type 1 (world-claim). 
     - If B is about an observation or report, then the message is Type 2 (observation-claim). 
     - If the message does not fit, it might be a directive (Type 3) — go to step 4.
     - Proceed to step 5 for Type 1 or 2, step 4 for Type 3.

  4. **Handle directives (Type 3):**
     - Ask: "Does the message prescribe an action (e.g., 'if A, then do X') or is it from the ops manual?" 
     - If yes, then: do not update probabilities. Instead, log the directive in the operations manual for future reference. 
     - Stop: no update to the risk register.

  5. **Check for Judy Benjamin structure (for Type 2 only):**
     - For Type 2 messages (observation-claim): 
          Ask: "Is the antecedent A a disjunction of events that form a partition (e.g., breach at location 1, 2, or 3) and the consequent B a report that we receive only in some of these cases?" 
     - If yes, then naive conditioning (treating "if A then B" as a proposition and conditioning on it) would be wrong because it ignores the reporting policy. We must use a different update (step 6). 
     - If no, then the message is a standard conditional (step 7).

  6. **Update for Judy Benjamin cases (Type 2 with partition):**
     - We are given a partition of events (A1, A2, ..., An) and a report B that is triggered only by some of these events. The message is of the form: "if A (where A is the disjunction of some events in the partition), then B". 
     - We need to know the reporting policy: for each event in the partition that implies A, does it trigger the report B? 
     - If the expert did not specify: we cannot update without assumptions. Log the message and flag for director's input (modelling choice). 
     - If we have the policy, then update by setting P(B|Ai) = 1 for the Ai that trigger B and 0 for others. Then use Bayesian update on the partition with the evidence B (if received) or not B (if not received). 
     - If the message is about the absence of a report (e.g., "if no breach, then no alarm"), then similarly update on the absence.

  7. **Handle standard conditionals (Type 1 and non-Judy Type 2):**
     - Ask: "Is the conditional hedged? (e.g., 'a real chance', 'likely')" 
          - If yes, then ask for a probability. If the expert didn't provide one, stop: log and flag to director for quantification (modelling choice). 
          - If no, and the conditional is given as certain (e.g., 'will', 'must'), then set P(B|A) = 1. 
          - If a number is provided (e.g., "with probability p"), set P(B|A) = p. 
     - Then update by treating the conditional as a constraint and using minimum cross-entropy (or if the model is simple, adjust the joint probabilities accordingly). However, in a spreadsheet with discrete events, we can often use: 
          - If we have a prior P(A), P(B|A), and we want P(A|B) or similar, we can use Bayes. But note: we are not conditioning on the conditional, we are using the conditional as a likelihood. 
          - Specifically, if we are given P(B|A), then when we observe B (or not B) we can update. But if we are given the conditional without observation, then we are updating our belief about the relationship. This step is for when we are given the conditional as new information about the relationship. 
          - In practice: if the message is about a change in the relationship (e.g., we learn that the gauge is now more reliable), then we adjust the conditional probability in our model and then recalculate all probabilities that depend on it. 
          - If the message is about a specific event (e.g., "if the pumping station loses power, then ...") and we are not observing B, then we are not updating the probability of B occurring now. We are updating our general model for future use. 
          - Therefore, in the risk register, we update the conditional probability for the relevant cells and then recalculate the joint probabilities and risk scores.

  8. **Alert-policy cases (when the message is about the policy itself or when absence of message is evidence):**
     - This is a subtype of Type 2. We handle it in step 6 for Judy Benjamin cases. But if the message is about the policy (e.g., "our system sends an alert if and only if condition C holds"), then:
          - Update the reporting policy in the model (set P(alert|C)=1 and P(alert|not C)=0). 
          - Then, if we do not receive an alert when we might have, we can condition on not alert to update the probability of C (or the events that lead to C). 
     - For example, if we have a partition of events and we know the alert policy, then not receiving an alert is evidence that none of the events that trigger the alert occurred.

  **Table: Message Type and Update Move**

  | Message Type        | Update Move                                                                 | When to Refuse/Flag                                                                 |
  |---------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Non-conditional     | Log and no update (go to step 4 for directives)                             | If not a directive and not conditional, log and ignore.                             |
  | Directive (Type 3)  | Log in ops manual; no probability update.                                   | Always handled without update.                                                      |
  | Type 1 (world-claim)| Standard update (step 7): set P(B|A) and adjust model.                      | Refuse if hedged without quantification (flag to director).                         |
  | Type 2 (obs-claim)  | If Judy Benjamin (partition and policy): step 6; else: step 7.              | Refuse if Judy Benjamin and policy not specified (flag for director).               |
  | Alert-policy        | Update policy (step 8) and then absence of message becomes evidence.        | Refuse if the policy is not fully specified.                                        |

  **Theoretically Forced Steps:**
  - Steps 5 and 6 for Judy Benjamin cases are theoretically forced (to avoid incorrect conditioning).
  - Step 7 for setting P(B|A) is forced when we accept the conditional as a constraint, but the choice of how to update the model (e.g., minimum cross-entropy) is also theoretically motivated.
  - Step 8 for alert policies is forced by the need to model the observation process.

  **Office Conventions:**
  - Refusing to update without a probability for hedged conditionals (step 7) is a convention to avoid arbitrary numbers.
  - Flagging to the director for modelling choices (like specifying a reporting policy or quantifying a hedge) is a convention.

  **Worked Examples:**

  1. **Marsh Road gauge:** "if the levee is breached anywhere upstream, the gauge at Marsh Road will read over three metres."
     - Step 1: Conditional, yes.
     - Step 2: A = levee breached upstream, B = gauge at Marsh Road reads >3m.
     - Step 3: B is about an observation (gauge reading) -> Type 2.
     - Step 5: Is this Judy Benjamin? The antecedent is "breached anywhere upstream" which might be a disjunction over specific breach locations. The consequent is about a gauge reading. However, we are not told the reporting policy (i.e., does the gauge read high only if there's a breach, or could it read high for other reasons?). The message says if breach then high reading, but not the converse. So it's not a full partition policy. 
          - We are not told what happens if there is no breach. Therefore, we cannot use step 6 (Judy Benjamin update) because we lack the full policy. We have to treat it as a standard conditional (step 7) but note that it is not hedged and is given as certain.
          - Step 7: Set P(B|A) = 1. Then update the model: we now believe that if a breach occurs upstream, then the gauge will definitely read high. We do not change P(B|not A) because it wasn't specified. This might be a problem (because without the converse we don't know the false positive rate) but the message doesn't provide that. We log that we have updated P(B|A)=1 and leave P(B|not A) at its previous value (if any) or flag that it is unknown. 
          - However, note: this message is about the world (the gauge's behavior) but it's an observation. We are updating the reliability of the gauge. This will affect our risk assessment because if we see a high gauge reading, we will now be more confident that a breach occurred.

  2. **Hedged rainfall:** "if winter rainfall is above the 90th percentile, there's a real chance the embankment overtops."
     - Step 1: Conditional.
     - Step 2: A = winter rainfall > 90th percentile, B = embankment overtops.
     - Step 3: B is about the world (overtops) -> Type 1.
     - Step 7: The consequent is hedged ("a real chance"). We ask for a probability, but the expert didn't provide one. Therefore, we refuse to update and flag to the director: "Need quantification of 'real chance' for the conditional probability P(B|A)." Log the message and stop without update.

  3. **Alert-policy case (directive that the procedure refuses):** 
     - Example message (directive from ops manual): "if the water level at the gauge exceeds 2m, then send an alert to the on-call engineer."
     - Step 1: Conditional? Yes.
     - Step 2: A = water level >2m, B = send alert.
     - Step 3: B is an action (a directive) -> Type 3.
     - Step 4: It's a directive. Log it in the ops manual. No probability update. 
          - But note: the procedure does not refuse this, it handles it appropriately without update.

     Now, an example that the procedure might refuse: an alert-policy message without full specification.
     - Suppose: "if the levee breaches, then our system sends an alert." 
          - This is Type 2 (observation: we receive an alert). 
          - Step 5: Is it Judy Benjamin? The antecedent is a single event (breach) but we might have a partition (breach at location 1, 2, ...). However, if we don't have a partition, we can treat breach as a single event. But we are not told what happens if there is no breach. 
          - Step 6: We need the reporting policy. The message only gives P(alert|breach)=1. We don't know P(alert|no breach). Without that, we cannot update on absence of alerts. 
          - Therefore, we refuse to update until the policy is fully specified. We flag to the director: "Need to know the false positive rate (i.e., probability of alert when no breach)."

  **What the Procedure Cannot Do:**
  - Handle conditionals with complex logical structure (beyond if-then) or nested conditionals.
  - Deal with continuous variables without discretization (which must be done separately).
  - Resolve ambiguities in natural language without expert input.
  - Provide updates when the model structure (e.g., the partition) is not defined in the risk register.
  - Account for dependencies between multiple conditionals without a full joint probability model.

  This procedure provides a structured way to handle common cases while flagging situations that require human judgment.
answer: |-
  ### Decision Procedure for Conditional Risk Updates

  **Numbered Steps (Theoretically forced steps marked with *; office conventions in italics):**

  1. **Isolate antecedent (A) and consequent (B):**  
     Split the sentence into "if [A], then [B]". If not conditional, treat as non-update (go to Step 7).  
     *Sufficient answer:* Clear A/B split. *If unclear:* Log as "Unparseable" and skip update.

  2. **Classify message type:**  
     Ask: "Is B about (a) a real-world event, (b) an observation/report, or (c) an action?"  
     - (a) → **Type 1** (world-claim)  
     - (b) → **Type 2** (observation-claim)  
     - (c) → **Type 3** (directive)  
     *Sufficient answer:* Expert confirms type. *If unsure:* Default to Type 1.  
     *Theoretically forced:* Type 2/3 require different handling (prevents misrepresentation).

  3. **Handle Type 3 (directives):**  
     Log B in the ops manual. **No probability update.**  
     *Sufficient answer:* Directive matches manual format. *If not:* Flag to director.

  4. **Check for Judy Benjamin (JB) structure (Type 2 only*):**  
     Ask: "Is A a disjunction (e.g., 'A₁ or A₂ or...') and B a report dependent on *which* Aᵢ occurred?"  
     - If **yes**, proceed to Step 5 (JB case).  
     - If **no**, treat as standard conditional (go to Step 6).  
     *Theoretically forced:* Prevents naive conditioning that ignores reporting bias.

  5. **Update for JB cases (*):**  
     Ask: "For each Aᵢ in the partition, does B *always* occur?"  
     - If **yes**: Set P(B|Aᵢ) = 1 for those Aᵢ; recalculate P(Aᵢ|B) using Bayes.  
     - If **no or unknown**: Refuse update. Log: "JB policy unspecified" → Flag to director.  
     *Theoretically forced:* Requires full reporting policy to avoid biased evidence.

  6. **Handle standard/hedged conditionals (Type 1 or non-JB Type 2):**  
     Ask: "Is B certain (e.g., 'will', 'must') or hedged (e.g., 'a chance')?"  
     - **Certain**: Set P(B|A) = 1. Update priors using Bayes/minimum cross-entropy.  
     - **Hedged**: Ask for numeric P(B|A). *If none given:* Log "Unquantified hedge" → Skip update.  
     *Office convention:* Refuse hedges without numbers to avoid arbitrariness.

  7. **Non-conditional messages:**  
     Log as "Non-conditional" with notes. **No update.**  
     *Sufficient answer:* Clear classification. *If ambiguous:* Skip update.

  8. **Alert-policy evidence (Type 2 extensions):**  
     If message implies "no B implies not A", ask: "Is absence of B evidence against A?"  
     - **Yes**: Update P(A|no B) using Bayes (requires known P(B|A) and P(B|¬A)).  
     - **No or partial**: Refuse update. Log: "Alert policy incomplete" → Flag to director.  
     *Theoretically forced:* Full policy needed to interpret silence.

  ### Update Rules Table
  | Message Type         | Update Move                           | When to Refuse/Stop                     |
  |----------------------|---------------------------------------|-----------------------------------------|
  | Type 1 (World-claim) | Set P(B\|A); Bayes update             | Hedge unquantified (Step 6)             |
  | Type 2 (Observation) | JB: Step 5; else: Step 6              | JB policy unknown (Step 5)              |
  | Type 3 (Directive)   | Log in manual; no update (Step 3)     | Always (no probabilities)               |
  | Non-conditional      | Log; no update (Step 7)               | Always                                  |
  | Alert-policy         | Update P(A\|no B) if policy full (Step 8) | Policy incomplete (Step 8)          |

  ---

  ### Worked Examples

  **Example 1: Marsh Road Gauge**  
  *Message: "If the levee is breached anywhere upstream, the gauge at Marsh Road will read over three metres."*  
  - **Step 1:** A = "levee breached upstream", B = "gauge reads >3m" → Conditional.  
  - **Step 2:** B is an observation → **Type 2**.  
  - **Step 4:** A is a disjunction (breaches at multiple locations) and B is a report → **JB case**.  
  - **Step 5:** Ask: "Does a breach *anywhere* always trigger >3m?" Expert says yes → Set P(B|Aᵢ) = 1 for all upstream breaches. Update P(Aᵢ|B) using Bayes (e.g., if B observed, increase P(breach)).  
  - *Outcome:* Updated. Not a refusal.

  **Example 2: Hedged Rainfall**  
  *Message: "If winter rainfall is above the 90th percentile, there's a real chance the embankment overtops."*  
  - **Step 1:** A = "rainfall >90p", B = "embankment overtops" → Conditional.  
  - **Step 2:** B is a world event → **Type 1**.  
  - **Step 6:** B is hedged ("real chance"). Ask for P(B|A). Expert gives no number → Log "Unquantified hedge". **No update.**  
  - *Outcome:* Refused. Director must decide probability or ignore.

  **Example 3: Alert-Policy Message (Refusal Case)**  
  *Message: "If sensor X malfunctions, an alert is sent."*  
  - **Step 1:** A = "sensor malfunctions", B = "alert sent" → Conditional.  
  - **Step 2:** B is a report → **Type 2**.  
  - **Step 4:** Not JB (A is single event). Proceed to Step 6.  
  - **Step 6:** B is certain → Set P(B|A) = 1.  
  - **Step 8 (Alert extension):** Ask: "Is no alert evidence against malfunction?" Expert says "yes, but we don’t know false alarms" → Policy incomplete. **Refuse update.** Log: "Alert policy incomplete."  
  - *Outcome:* Refused (your current use of this as evidence requires assumptions). Director must specify P(alert|no malfunction).

  ---

  ### Limitations  
  The procedure cannot handle:  
  - Interdependent conditionals (e.g., cascading risks),  
  - Continuous variables without discretization,  
  - Cases where the partition is undefined (JB fails),  
  - Ambiguities resolved only by causal models.  
  Defend forced steps (*) with probability theory; adjust conventions (e.g., hedge thresholds) internally.  

  ---  
  **Word count: 846**  
  Format: Direct, executable, client-ready. Rejects unquantified hedges and partial policies.
