  Okay, the user is writing a novel about a deputy director in a fictional Office of National Outcomes who has to recommend a single national wellbeing statistic. This statistic will become the government's formal target, affecting budgets, promotions, and national addresses. The user wants the committee's arguments to be realistic and based on solid criteria, not just decorative. They need a detailed list of desiderata for what makes a good wellbeing index for governance, covering measurement, aggregation, and political use.

  First, I need to recall the main aspects the user mentioned. Measurement issues include whose experiences are counted (like newborns, dementia patients), real-time vs retrospective reports, interpersonal comparability, adaptation and forecasting errors, netting positive and negative experiences, and cross-cultural translation. Aggregation involves average vs spread vs sufficiency thresholds. Political use covers legibility vs gaming, stability for long-term policies, and potential damage from being a target.

  The user also wants me to distinguish genuine desiderata from camp-specific preferences, identify conflicting requirements, and note which requirement excludes most indices. Then, briefly score the three candidate families: self-report surveys, experience sampling, and capability-based proxies. Finally, recommend what the committee should do if no index meets non-negotiables.

  For the desiderata list, I need to cover all three fronts with concrete situations. For measurement, consider scenarios like dementia patients' experiences not being captured or cultural differences in reporting. For aggregation, think about a country improving if the worst-off get better even if the average drops. Political use should address how a target might lead to gaming, like focusing on easily improvable areas.

  Now, identifying genuine vs camp-specific requirements. Genuine ones are those necessary for any index to be functional, like avoiding perverse incentives or being measurable. Camp-specific ones might include insisting on a single number or only using self-reports. Conflicts could arise between using real-time data (which is nuanced) and needing a legible number for politicians.

  For the candidate families, self-reports like life satisfaction surveys are common but prone to adaptation and cultural biases. Experience sampling is more immediate but expensive and hard to scale. Capability approaches use objective measures but might miss subjective well-being.

  The biggest sticking point might be the requirement to avoid perverse incentives. If the index can be gamed, it becomes useless as a target. Also, combining positive and negative experiences might not be feasible if they aren't interpersonally comparable.

  If no index meets the non-negotiables, the committee might recommend against a single target, suggesting multiple indicators instead. This avoids the pitfalls of oversimplification and gaming. The deputy director's decision could be to reject the mandate as flawed, emphasizing that well-being is too complex for one number.

  I need to ensure all user points are addressed. The concrete examples are crucial for each requirement. For instance, explaining the adaptation problem with a population that's resigned to hardship. Or gaming examples like schools focusing on test scores only. The internal conflicts, like stability vs sensitivity, should highlight the committee's debate.

  Finally, the recommendation must stem from the analysis. If the criteria show inherent flaws in any single index, the honest conclusion is to abandon the single target approach. This fits the novel's ending where the deputy director prioritizes integrity over political pressure.
answer: |-
  Here is a specification for a national wellbeing statistic designed for *governance*, derived from the concrete dilemmas you've outlined. The committee's debate should rage over these points:

  **Desiderata for a Governance-Ready National Wellbeing Statistic**

  **I. Measurement: Capturing the Right Experience**
  1.  **Inclusivity of Suffering & Capacity (Genuine):** *Must* include the experiences of individuals with diminished capacity to report (e.g., advanced dementia, severe mental illness, newborns) via validated proxies (e.g., carer assessments, observed distress/engagement). *Why?* Excluding them permits policies that ignore the most vulnerable (e.g., cutting dementia care funding because sufferers "don't drag down the average").
  2.  **Present Experience Anchoring (Genuine):** *Must* give significant weight to *reported or observed present experience* (affect, comfort, engagement). *Why?* Relying solely on retrospective life satisfaction risks ignoring persistent, low-level misery masked by adaptation or positive framing bias (e.g., a population enduring chronic pain or deprivation reports "satisfaction" due to lowered expectations, rendering the index insensitive to their actual suffering).
  3.  **Interpersonal Comparability (Camp-Specific/Problematic):** *Ideally* assumes cardinal comparability (an 8 = an 8), but *must* at least provide a methodologically sound way to aggregate experiences ordinally. *Why?* Without *some* comparability, aggregation is impossible. However, strict cardinality ignores profound differences in internal scales (e.g., does a chronically depressed person's "5" equal a healthy person's "5"?). Acknowledging this limitation is crucial.
  4.  **Accounting for Adaptation & Forecasting Errors (Genuine):** *Must* incorporate mechanisms to detect and adjust for: a) *Adaptation:* Downward calibration of expectations after sustained hardship (e.g., post-war generations reporting decent satisfaction despite objectively poor conditions). b) *Affective Forecasting Errors:* Systemic overestimation of future happiness from gains (e.g., lottery winners) or underestimation of resilience to loss (e.g., disability). *Why?* Uncorrected, the index could reward stagnation or misdirect resources based on faulty public predictions.
  5.  **Non-Compensability of Severe Harm (Genuine):** *Must* treat extreme negative experiences (e.g., torture, profound grief, chronic severe pain) as non-fully compensable by aggregate positive experiences. *Why?* A purely netted score could theoretically justify inflicting immense suffering on a few for diffuse minor gains for many (e.g., state-sanctioned torture for "national security" slightly boosting average calm).
  6.  **Cross-Cultural & Linguistic Validity (Genuine):** *Must* demonstrate measurement invariance across major linguistic and cultural groups within the nation. The core concept of "wellbeing" must be translatable without fundamental distortion. *Why?* Otherwise, the index systematically misrepresents the wellbeing of minority cultures (e.g., a concept like "flourishing" rooted in individual achievement vs. community harmony).

  **II. Aggregation: From Individuals to a National Number**
  7.  **Sensitivity to Distribution (Genuine):** *Must* be sensitive not just to the mean, but to changes in the *distribution*, particularly improvements among the worst-off. *Why?* An index that rises only when the already-advantaged gain more obscures stagnation or decline at the bottom (e.g., GDP growth benefiting only the wealthy). Conversely, it must also detect *overall* decline even if the worst-off slightly improve (e.g., widespread middle-class collapse).
  8.  **Sufficiency Threshold Recognition (Camp-Specific/Problematic):** *Ideally* incorporates a threshold below which life is deemed "unacceptably bad," ensuring policies prioritize lifting people above it. *Why?* Focusing solely on averages can neglect those in deep misery. However, defining this threshold is highly value-laden and contestable (e.g., is it basic needs, freedom from pain, or social inclusion?).
  9.  **Aggregation Function Transparency (Genuine):** The method of combining individual scores *must* be explicit and justified. *Why?* Is it a simple average? A median? A function weighting the worst-off more heavily? Each choice has profound policy implications and must be defensible, not hidden.

  **III. Political Use: Governing by the Number**
  10. **Resistance to Perverse Incentives & Gaming (Genuine):** *Must* be inherently difficult to manipulate through superficial or harmful actions that boost the number without genuine improvement. *Why?* (The "Goodhart Effect"): If school performance is measured solely by test scores, schools "teach to the test." If wellbeing is measured by life satisfaction surveys, governments might fund PR campaigns promoting optimism rather than fixing underlying problems.
  11. **Policy Horizon Stability (Genuine):** *Must* be sufficiently stable over short-term fluctuations to reward long-term policies whose benefits take years to materialize. *Why?* A hyper-volatile index punishes ministers investing in education or infrastructure, favoring quick, unsustainable wins.
  12. **Citizen & Parliamentary Legibility (Genuine):** *Must* be understandable enough for citizens to grasp what it represents and for parliamentarians to debate meaningfully. *Why?* An overly complex "black box" index loses public trust and becomes politically inert.
  13. **Avoiding Target-Induced Distortion (Genuine):** *Must* minimize the risk that making it *the* statutory target actively degrades the underlying wellbeing it purports to measure. *Why?* The intense focus can lead to: a) Neglect of unmeasured aspects of wellbeing. b) Manipulation (see #10). c) Public cynicism if perceived as a propaganda tool.

  **Analysis & Conflicts**

  *   **Genuine Desiderata:** 1, 2, 4, 5, 6, 7, 9, 10, 11, 12, 13. These address core issues of validity, fairness, robustness, and practical governance utility that any serious index must confront.
  *   **Camp-Specific Preferences:**
      *   *Insisting on a Single Cardinal Number:* Driven by political/administrative desire for simplicity, but inherently problematic (see #3, #8). Favors self-report averages.
      *   *Exclusive Reliance on Self-Reports:* Favored by subjectivists, but conflicts with #1 (inclusivity) and #2 (present experience anchoring – retrospective bias).
      *   *Exclusive Focus on Felt Experience:* Favored by hedonic utilitarians. Conflicts with incorporating capabilities, meaning, or considered preferences (often favored by objective-list/capability theorists).
  *   **Key Conflicts:**
      *   **#10 (Resistance to Gaming) vs. #12 (Legibility) & the Single Number Demand:** Simple, legible numbers are easiest to game. Complex, robust measures are harder to understand. *Concrete Conflict:* A pure life satisfaction average (#12) is legible but highly vulnerable to framing effects and PR (#10). A complex multi-domain index (#10) is opaque (#12).
      *   **#2 (Present Experience) vs. #11 (Stability):** Real-time affect is volatile (#11), while life evaluations are stable (#2) but potentially detached from present misery. *Concrete Conflict:* Experience sampling provides vital detail (#2) but fluctuates wildly with daily events, punishing long-term investments (#11).
      *   **#7 (Distribution Sensitivity) vs. Single Number Simplicity:** Truly representing distribution often requires multiple metrics (e.g., mean + bottom decile), conflicting with the demand for *one* governing number.
  *   **The Biggest Excluder:** **#10 (Resistance to Perverse Incentives/Gaming).** This is the most fatal flaw for governance. Many academically interesting or conceptually pure measures (like a simple life satisfaction average, or a purely affect-based score) fail spectacularly here because they are easily manipulable without genuine improvement. This requirement demands structural complexity or domain breadth that often makes the index less pure or legible.

  **Scoring Candidate Families (Briefly, Criteria-Focused):**

  1.  **Self-Report Life Satisfaction (e.g., Cantril Ladder, OECD BLI):**
      *   *Pros:* Legible (#12), Relatively Stable (#11), Captures retrospective judgment (part of #2?).
      *   *Cons:* Vulnerable to Adaptation (#4), Forecasting Errors (#4), Gaming via framing/PR (#10), Poor at capturing Present Suffering (#2), Excludes Low-Capacity (#1), Assumes Cardinality (#3), Cross-Cultural Issues (#6), Ignores Distribution unless supplemented (#7), Risk of Target Distortion (#13).

  2.  **Experience-Sampling / Affect-Based (e.g., Day Reconstruction Method):**
      *   *Pros:* Captures Present Experience (#2), Less vulnerable to retrospective bias, More sensitive to policy changes affecting daily life.
      *   *Cons:* Expensive/Complex to collect nationally, Highly Volatile (#11), Difficult to Aggregate Comparably (#3), Excludes Low-Capacity (#1), Can miss meaning/long-term perspective, Highly vulnerable to short-term manipulation (#10 - e.g., declare national holidays), Legibility challenges (#12).

  3.  **Objective-List / Capability-Based Proxies (e.g., HDI, Bhutan's GNH Domains):**
      *   *Pros:* Resists Gaming (#10 - harder to fake health, education, environment), More Stable (#11), Often Legible Domains (#12), Can incorporate Distribution (#7), Includes factors affecting future wellbeing/resilience, Less vulnerable to Adaptation/Forecasting (#4).
      *   *Cons:* Not direct measure of *subjective* experience (#2, #5 - is a healthy, educated person automatically happy?), Defining the list/value-weighting is highly political/cultural (#6, #9), Risk of paternalism (ignoring people's own evaluations), May miss affective states (#2), Complex aggregation (#9, #12), Still needs proxies for things like social connection.

  **The Committee's Honest Conclusion & Novel's Ending**

  If rigorous analysis concludes that **no candidate index simultaneously meets the non-negotiable genuine desiderata** – particularly the fatal trio of **Resisting Gaming (#10)**, **Capturing True Suffering & Joy (#1, #2, #5)**, and remaining **Legible & Stable enough for Governance (#11, #12)** without causing **Target Distortion (#13)** – then the committee's *only* honest recommendation is:

  **To recommend *against* adopting a *single* statutory wellbeing target mandated by the Wellbeing Mandate Act.**

  **Why this follows from the specification:**

  1.  **Integrity of Purpose:** The specification reveals the inherent, likely insurmountable, contradictions and risks in reducing wellbeing to a single governable number. Forcing one would violate the core requirement of being "an honest thing to govern by," inevitably leading to gaming, distortion, or misrepresentation (#10, #13).
  2.  **Fulfilling the Spirit, Rejecting the Letter:** The committee can argue they *have* taken the mandate seriously by rigorously defining what "getting it right" means. Recommending *against* the single number is the outcome of that rigor, not a dismissal of wellbeing as a goal.
  3.  **Alternative Proposal (The Principled Compromise):** The committee should recommend:
      *   **Developing a transparent, multi-dimensional National Wellbeing Dashboard:** Tracking 5-7 key domains (e.g., Health Capabilities, Material Security, Social Connection, Environmental Quality, Subjective Wellbeing - using a *suite* of measures including affect, life satisfaction, and vulnerability metrics) *without* aggregating them into one number. This addresses inclusivity (#1), distribution (#7), resistance to gaming in specific areas (#10), stability in some domains (#11), and legibility of components (#12).
      *   **Mandating Regular "Wellbeing Impact Assessments":** Requiring all major legislation/policy to be evaluated against this dashboard, making trade-offs explicit. This embeds wellbeing thinking without the perverse incentive of a single target (#13).
      *   **Investing in Measurement Innovation:** Especially for vulnerable populations (#1) and real-time experience (#2).
  4.  **The Dramatic Weight:** This ending places the Deputy Director in direct conflict with the political impetus behind the Act. It's a moment of technocratic integrity vs. political desire for a simple lever. She prioritizes honest measurement and avoiding harm (#10, #13) over delivering the simple answer demanded. It highlights the central tension: wellbeing is complex, governing demands simplicity, and forcing the latter corrupts the former.

  This conclusion respects the specification's revealed impossibility while offering a constructive, ethically defensible path forward, setting up the final conflict and resolution of your novel.
