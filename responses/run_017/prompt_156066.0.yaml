prompt: |-
  I'm an undergraduate in an upper-level seminar on practical rationality this term, and I've been asked to take one thirty-minute session of a student-run decision-theory reading group — mostly economics and computer-science majors who have had expected-utility theory and some value-of-information and exploration/exploitation material, and no philosophy. The topic assigned to me is the problem of transformative experience: the distinction between experiences that are epistemically transformative and ones that are personally transformative, and the argument that a choice involving them cannot be settled by standard expected-utility reasoning. Please don't write the session for me; tell me how to sequence it.

  Concretely:

  1. The dependency structure. I can't tell whether to lead with the "you can't imagine what it will be like" half or the "you won't want what you now want" half. Which has to come first, what has to be in place before either one lands, and why? My own guess is that they first have to accept that it is the agent's *own* utility function that does the work in the expected-utility calculation — otherwise the whole thing looks like ordinary risk and nothing I say afterward registers.

  2. The carrying example. I've been toying with a nine-month Antarctic winter-over versus staying in a well-understood job: testimony about it is abundant and yet seems to fail, the alternative has a payoff they can model, and it looks reversible, which I think matters. Say whether that case can carry the whole arc or what I should swap it for, and say what a case like this must have and must lack. My constraints: it must be epistemically and personally transformative at once; it must have a non-transformative alternative whose payoff they can genuinely compute; it must have plenty of available testimony, so that "read the memoirs" is a live suggestion that then fails; it must not be morally or identity-loaded the way becoming a parent or a religious conversion is; and it must not be a one-off taste case, which would only dramatise half the problem.

  3. The misconceptions, and the point in the sequence where each gets headed off. The ones I expect: collapsing it into ordinary risk over an unknown quantity; thinking testimony or a survey of participants solves it; concluding that reason gives out and one should just be spontaneous; "pilot it first, then back out" — including the wrinkle I want handled somewhere rather than bolted on, that the decision whether to continue or reverse is made by the transformed self, so reversibility doesn't return control to the ex ante agent; and treating any large life change as transformative. Someone will also say "oh, like affective forecasting and impact bias" — tell me whether that empirical literature is a bridge into the problem or a detour, and where it goes if anywhere.

  4. A variant I can't place: a transformation invisible from the inside, where the person sincerely reports that their values are unchanged while their choices have shifted. It seems to cut against the "choose in order to discover who you become" framing, and I don't know whether it belongs in the main arc, as a closing hard case, or nowhere in thirty minutes.

  5. The check: one question for the last two minutes whose answer distinguishes having seen that the difficulty is missing *values* from having heard it as missing *information*. My candidate is handing them a nearby case in which expected-utility reasoning is fine and asking what changed; give me a better one if you have it.

  6. What to openly refuse to cover at this level — I suspect the metaphysics of personal identity, which someone will raise, and whether the discovery-based alternative can be formalised or consequentialised.

  Format it as a numbered sequence of moves with approximate timings, each misconception attached to the move where it should be defused, followed by the check question and the list of refusals. No more than 700 words.
reasoning: |-
  Okay, the user is an undergraduate preparing a 30-minute session on transformative experiences for a decision-theory reading group. They need help structuring the session, addressing misconceptions, and choosing a good example. Let me break down their main concerns.

  First, they're unsure whether to start with the "can't imagine" (epistemic) or "won't want" (personal) aspect of transformative experiences. I think the epistemic part should come first because it's easier to grasp. If students don't get that the utility function is subjective, they might mistake this for ordinary risk. So establishing that expected utility relies on the agent's own preferences is crucial upfront.

  For the example, they suggested a nine-month Antarctic winter-over versus a stable job. This fits most criteria: it's transformative, has abundant testimony, and a computable alternative. But is it reversible? The user mentioned that reversibility is important because the transformed self makes continuation decisions. The Antarctic trip might seem reversible, but once you're there, quitting could be impossible or costly. I should highlight that the decision to stay or leave is made by the transformed self, showing reversibility doesn't solve the core problem.

  Misconceptions need addressing at specific points. For instance, when introducing the example, someone might say "just read memoirs." That's when to explain testimony fails because it can't convey the lived experience. Later, when discussing reversibility, emphasize that the transformed self decides, not the pre-experience self. Affective forecasting might come up; acknowledge it but note that transformative experiences involve deeper changes beyond prediction errors.

  The user mentioned a variant where someone doesn't realize their values changed. This is tricky for a 30-min session. It might confuse more than clarify, so suggest briefly mentioning it if time allows or as a follow-up thought.

  For the check question, asking how a non-transformative decision differs can test understanding. If they see it's about missing values, not just information, that's good. Refusals should include personal identity metaphysics and formalizing discovery-based decisions, as those are beyond the scope.

  Timing is tight. Allocate time for each section: intro, epistemic transformation, personal, misconceptions, and wrap-up. Keep examples clear, misconceptions addressed as they arise, and end with the check question. Make sure to emphasize that transformative experiences challenge the very basis of expected utility by making preferences unknowable beforehand.
answer: |-
  Here's a sequenced 30-minute plan focusing on conceptual clarity, leveraging the Antarctic case, and targeting misconceptions efficiently:

  **Sequence (Approx. Timings):**

  1.  **Groundwork: Utility is Subjective & Ex Ante (5 min)**
      *   **Move:** Start with a simple, non-transformative decision (e.g., choosing between two known restaurants based on current preferences). Explicitly state the EU formula: EU(A) = Σ [P(S_i) * U(A, S_i)], emphasizing **U represents the *agent's own current* valuation of outcomes**.
      *   **Why:** Establishes the core mechanism of EU reasoning – it requires plugging in the *agent's own* utility function. **Crucial foundation.**

  2.  **Introduce Epistemic Transformation (ET) via Antarctic Case (7 min)**
      *   **Move:** Present the Antarctic winter-over vs. stable job choice. Highlight:
          *   Job: Payoff (salary, stability, known satisfaction) is computable *with current preferences*.
          *   Antarctic: Abundant testimony ("read the memoirs!") exists – vivid descriptions of cold, isolation, camaraderie, awe.
          *   **Problem:** Despite testimony, *you fundamentally cannot know what it will feel like subjectively to be you experiencing it*. You lack the phenomenal concepts.
      *   **Key Point:** Testimony provides descriptive *information*, but not the *subjective experiential knowledge* needed to assign utilities *ex ante*. **ET = "You can't imagine what it will be like (for you)."**
      *   **Misconception Defused (Ordinary Risk / Testimony):** "This isn't just missing a probability or data point we could estimate. Even with perfect descriptive data (‘memoirs’), the *first-person, what-it's-like* knowledge needed to assign U(Antarctic) *from your current perspective* is inaccessible. Surveys/testimony don't bridge this gap."

  3.  **Introduce Personal Transformation (PT) & Irreversibility (7 min)**
      *   **Move:** Extend the Antarctic case. Argue the experience is likely PT: surviving/chriving during the winter could fundamentally alter your values, preferences, or what you find meaningful (e.g., valuing solitude/adventure much more, finding routine stifling).
      *   **Key Point:** If you become a different person (in terms of preferences), the utilities you *would* assign *after* the experience (U_post) are not just unknown, but *in principle cannot be your current utilities (U_current)*. EU requires U_current.
      *   **Irreversibility Wrinkle:** Even if you *could* leave early ("pilot it"), the decision *to stay or leave* after 1 month is made by the *already-transformed* self (using U_post), not the original self (using U_current). Reversibility doesn't give control back to U_current.
      *   **Misconception Defused (Reversibility / "Pilot it"):** "Thinking you can 'try it and back out' misses that the *decision point itself* is evaluated by a potentially transformed self. The ex-ante agent loses control." & **Misconception Defused (Any Big Change):** "Not *all* big changes are PT. Moving cities might not reshape core values. PT specifically changes what you *want/find valuable*."

  4.  **Synthesize the EU Problem & "Discovery" Framing (5 min)**
      *   **Move:** Combine ET & PT. To calculate EU(Antarctic) *ex ante*, you need U_current(Antarctic outcomes). ET means you can't assign these utilities accurately *because* you lack the phenomenal knowledge. PT means that even if you *could* assign U_current, the relevant utilities for the *outcomes actually experienced* (by the transformed you) are U_post, which are inaccessible *and incompatible* with U_current.
      *   **Conclusion:** Standard EU reasoning breaks down because it cannot access the required utility inputs (due to ET) and the utility function itself is unstable (due to PT). You choose partly *to discover* who you become and what you'll value.
      *   **Affective Forecasting Note (Bridge, not Detour - 30 sec max):** "Yes, affective forecasting errors (impact bias) are *related* – we're bad at predicting future feelings. But TE argues the problem is *deeper*: even perfect prediction of feelings wouldn't solve the PT problem of changing *values* or the ET problem of *acquiring phenomenal concepts*. It's not just misprediction; it's inability."

  5.  **The Check Question (Last 2 min)**
      *   **Move:** "Imagine choosing between two *identical* job offers in cities you know equally well. Both offer predictable payoffs based on your *current, stable* preferences. EU reasoning clearly applies. **What crucial element(s), present in the Antarctic choice, is *missing* here that makes EU work?**"
      *   **Why:** Forces them to identify the *absence* of both Epistemic and Personal Transformation. A correct answer focuses on the **missing *subjective experiential knowledge* (ET) and the absence of a *fundamental shift in core values* (PT)**, distinguishing it from mere missing information or risk.

  6.  **Refusals (Stated upfront or as questions arise - Weave in as needed)**
      *   **Metaphysics of Personal Identity:** "We're bracketing deep questions about 'who you really are' over time. We're talking about the *practical* problem of making decisions when your future preferences are unknowable and likely different, *however* we define identity."
      *   **Formalizing Discovery/Consequentialism:** "We won't dive into whether/how discovery-based choices *could* be modeled within an expanded consequentialist framework. Today is about why *standard* EU, as taught, hits a wall here."
      *   **Internal Invisibility Variant (Mention Briefly, if at all):** "One fascinating wrinkle is when someone *doesn't realize* their values changed – they sincerely report stability. This reinforces the PT challenge: even *you* might not fully grasp the transformation immediately. We don't have time to unpack it today, but it highlights the depth of the issue."

  **Why Antarctic Carries the Arc:**
  *   Fits all constraints: ET (cannot imagine the subjective feel despite testimony), PT (likely value shift), computable alternative (job), abundant testimony, non-moral/identity-heavy (compared to parenthood), not a one-off taste.
  *   **Must Lack:** True irreversibility (you *can* leave, physically). **This is why explicitly addressing the "decision point wrinkle" (Step 3) is vital.** The transformation happens *during* the experience, before the "reverse" decision is made. The *cost* of reversal is secondary; the *agency shift* is primary.
  *   **Must Have:** Plausibility of both ET and PT occurring simultaneously in a significant choice. It does.
