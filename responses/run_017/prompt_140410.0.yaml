answer: |-
  ### Routing Procedure for LLM Features

  Below is a step-by-step procedure to route features into **tool path** (minimal autonomy, human-authorized actions) or **agent path** (autonomy requiring safeguards). It uses only the feature specification, requires no model access or execution, and runs in <60 minutes. Steps terminate early for low-risk cases, escalate high-value judgments, and prioritize **irreversible actions** (changes to state/data with real-world impact: e.g., emails, transactions, code commits, refunds) and **autonomy** (unprompted actions). Your distinctions ("borrowed initiative"/"carried purpose") are partially integrated but deprioritized—they add noise to risk assessment.

  ---

  ### The Procedure  
  **Key Rules**  
  - **Termination**: Stop at any "yes" or "no" that routes the feature.  
  - **Escalation**: Hand off to the design-review board if a decision hinges on company values (e.g., risk tolerance, ethical boundaries).  
  - **Thresholds**: Financial impact ≤$50/user action; reversibility = automated undo within 24h. Adjust thresholds via escalation.  

  #### Step 1: Does the system perform **any irreversible actions**?  
  - **Definition**: An action that alters state/data outside the system’s ephemeral context (e.g., sends emails, modifies databases, spends money).  
  - **Affirmative**: At least one action meets the definition.  
  - **Negative**: All actions are reversible (e.g., writes to scratch space, generates non-persistent text).  
  - **Routing**:  
    - **No** → **Tool path** (low risk).  
    - **Yes** → Proceed to Step 2.  

  #### Step 2: Is **every irreversible action authorized by a named human per instance**?  
  - **Definition**: A specific human approves each action in real-time before execution (e.g., "Confirm Refund?" button). Logging alone is insufficient.  
  - **Affirmative**: All irreversible actions require explicit per-action approval.  
  - **Negative**: At least one irreversible action executes without per-instance human approval.  
  - **Routing**:  
    - **Yes** → **Tool path** (human oversight suffices).  
    - **No** → Proceed to Step 3.  

  #### Step 3: Does the system take **sequential irreversible actions without human intervention**?  
  - **Definition**: Two+ irreversible actions occur autonomously (e.g., looped operations, multi-step workflows). Human input between steps resets autonomy.  
  - **Affirmative**: Sequences exist (e.g., "try 10 times then publish").  
  - **Negative**: At most one irreversible action per human request (e.g., single refund per query).  
  - **Routing**:  
    - **Yes** → **Agent path** (high autonomy).  
    - **No** → Proceed to Step 4.  

  #### Step 4: Are **all irreversible actions bounded and reversible**?  
  - **Criteria**:  
    - **Financial impact** ≤$50/user action.  
    - **No sensitive data**: Actions don’t expose/modify PII, financial records, or intellectual property.  
    - **Reversible**: Automated undo exists (e.g., refund cancellation, database rollback).  
    - **Non-reputational**: Errors won’t damage customer trust (e.g., no public-facing outputs).  
  - **Affirmative**: All irreversible actions meet all criteria.  
  - **Negative**: At least one action violates any criterion.  
  - **Routing**:  
    - **Yes** → **Tool path** (constrained impact).  
    - **No** → **Agent path** (requires safeguards).  
  - **Escalation**: If criteria are ambiguous (e.g., "Is $50 too high?"), **hand off to the board**. Values, not facts, drive this decision.  

  ---

  ### Critique of Your Distinctions  
  - **Borrowed initiative** ("Delete user instruction: is the system mid-task?"):  
    - **Discard as a primary axis**. It conflates statefulness with risk. A sandboxed planner may be "mid-task" yet harmless (low risk), while a single email blast has no "initiative" but high risk. Useful for debugging, not routing.  
  - **Carried purpose** ("Does it maintain unfinished business?"):  
    - **Discard entirely**. Misleading for risk assessment. A refund bot with no "purpose" can cause financial harm in one step. Focus on outcomes (irreversible actions), not intent.  
  - **What to insist on**:  
    - **Irreversible actions** are the core risk. Keep this as Step 1.  
    - **Autonomy** (Step 3) is critical—your "carried purpose" is better measured as sequential actions.  

  ---

  ### Procedure Applied to Examples  

  #### Case 1: Coding Assistant  
  - **Spec**: Edits a repo, runs tests in a sandbox, loops ≤10 times, outputs a diff.  
  - **Step 1**: Irreversible actions?  
    - Edits a repo → **Yes** (code changes are irreversible).  
  - **Step 2**: Per-action human approval?  
    - Outputs a diff for review → Human must approve before merge. **Yes**.  
  - **Routing**: **Tool path** (terminates at Step 2).  
  - **Verdict**: Uncontroversial. Sandboxed tests are reversible; diff approval suffices.  

  #### Case 2: Support Bot  
  - **Spec**: Retrieves policies, issues refunds ≤$50, no human in loop.  
  - **Step 1**: Irreversible actions? **Yes** (refunds alter financial state).  
  - **Step 2**: Per-action approval? **No** (no human in loop).  
  - **Step 3**: Sequential irreversible actions?  
    - Processes one refund per request → **No**.  
  - **Step 4**: Bounded and reversible?  
    - Financial impact ≤$50 → **Yes**.  
    - Sensitive data? **Yes** (modifies financial records).  
    - Reversible? **No** (refunds may require manual clawbacks).  
    - Non-reputational? **No** (customer-facing errors harm trust).  
  - **Routing**: **Agent path** (fails Step 4).  
  - **Verdict**: **Will cause debate**. Engineers may argue $50 is low-risk, but the procedure flags data/reputational exposure. Escalation likely for "Is financial data sensitivity acceptable?"  

  #### Case 3: "Deep Research" Feature  
  - **Spec**: Browses web, writes memo with citations, writes only to scratch otherwise.  
  - **Step 1**: Irreversible actions?  
    - Browses (reads) → **No**.  
    - Writes memo → If saved to scratch (ephemeral), **No**.  
  - **Routing**: **Tool path** (terminates at Step 1).  
  - **Verdict**: Uncontroversial. Scratch space is reversible; no external impact.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Ambiguous thresholds**: E.g., "Is $50 low-risk for refunds?" or "Is this data sensitive?" These require board escalation (values-based).  
  2. **Edge-case autonomy**: A single irreversible action with catastrophic potential (e.g., "delete all backups") routes to Step 4. If deemed "bounded" (e.g., rare), the procedure allows tool path—but reviewers may argue for agent safeguards.  
  3. **False negatives**: Features with reversible actions but high complexity (e.g., negotiating contracts) may pass as tool path if no irreversible actions exist. The procedure prioritizes action outcomes over process complexity.  

  **Final Recommendation**: Implement this procedure but require board review for all Step 4 escalations and any feature with irreversible actions. This balances efficiency (most cases resolve in Steps 1–3) with caution (high-stakes judgments involve humans).
