  - Irreversible action: Any action that changes state outside the system's own process in a way that cannot be trivially undone (e.g., sending an email, making a financial transaction, updating a production database, deploying code, etc.). Reading data, generating text that is not sent, and writing to a scratch directory (that is not shared and is routinely purged) are not irreversible.
