answer: |-
  Here is a specification of desiderata for an account of "what matters in survival," tailored to the teletransporter case and your requirements. Desiderata are grouped by purpose, with motivating cases (including your three novel ones), distinctions to uphold, constraints, and controversies marked. Following this, I identify key tensions and provide a compressed scorecard.

  ---

  ### **I. Desiderata: What the Theory Must Deliver**
  *(Non-negotiable unless marked as "Controversial")*

  1. **Prudential Rationality Guidance**  
     - **Must**: Tell the agent what she has reason to prefer, fear, or regard with indifference when stepping into the scanner.  
     - **Case**: Standard teletransporter (perfect copy, original destroyed).  
     - **Distinction**: Must not collapse *being me* (metaphysical identity) and *mattering to me* (prudential concern). For example, the agent might have reason to care about the copy’s fate even if it isn’t strictly "her."  
     - **Constraint**: Must accommodate ordinary self-concern (e.g., we fear death but not sleep).  

  2. **Moral Obligations**  
     - **Must**: Specify what the agent owes to the output (e.g., promises, debts) and what is owed to them (e.g., respect, rights).  
     - **Case**: Stored scan, staggered instantiation (copy made at year 5, instantiated at year 10). If the original dies at year 7, does the copy inherit their mortgage?  
     - **Distinction**: Must separate *moral responsibility* from *identity*. Obligations may persist even if identity is fuzzy (e.g., the copy may owe apologies for the original’s actions).  

  3. **Determinacy of Identity Questions**  
     - **Must**: Clarify whether "Will it be me?" has a definite answer, is indeterminate, or is a misguided question.  
     - **Case**: Re-fusion (two branches merged after 10 years). Is the resulting person "both," "neither," or a new entity?  
     - **Constraint**: Must address whether indeterminacy should worry the agent (e.g., like dreamless sleep need not worry us).  
     - **Controversial**: Demanding determinacy is a *prejudice* of substantialist views (e.g., animalism). **Argument**: If identity reduces to physical/psychological continuity, borderline cases (e.g., 97% scan) may be inherently vague, and insisting on binary answers distorts reality.  

  4. **Distinction: What Matters vs. What Matters Most**  
     - **Non-negotiable**: The theory must distinguish between (a) factors that ground *any* prudential concern (e.g., psychological connectedness) and (b) factors that make survival *better or worse* (e.g., degree of connectedness).  
     - **Case**: Partial scan (97% fidelity). Even if not "full survival," the agent may have *some* reason to care about the copy (e.g., it preserves most memories), but less than for a 100% scan.  

  5. **Psychological and Neurobiological Constraints**  
     - **Non-negotiable**: The theory must cohere with real-world continuity phenomena:  
       - **Sleep/coma**: Temporary disruption of consciousness doesn’t threaten identity.  
       - **Gradual replacement**: If neurons are replaced over time (Ship of Theseus-style), identity persists.  
       - **Dense amnesia**: Loss of autobiographical memory (e.g., dementia) may *diminish* but not *eliminate* identity (e.g., we still treat dementia patients as the same person).  
       - **Case**: Dementia progression shows survival can be a matter of degree.  

  6. **Degrees of Survival**  
     - **Must**: Accommodate that survival can admit of degrees (e.g., connectedness fades over time).  
     - **Case**: Partial scan (97%) vs. perfect scan. The 97% copy may be "less me" due to confabulated memories or statistical filling.  
     - **Controversial**: Demanding survival must be "all-or-nothing" is a *prejudice* of one-one views. **Argument**: Neurobiology shows continuity is scalar (synaptic strength, memory fidelity); insisting on binary identity ignores this.  

  7. **Handling Branching/Fusion**  
     - **Must**: Explain prudential/moral implications of fission/fusion without absurdity.  
     - **Cases**:  
       - **Stored scan, concurrent instantiation**: Two copies run for a decade. The original (if not destroyed) must split concern between both. Neither copy can claim *exclusive* identity.  
       - **Re-fusion**: After 10 years apart, merging two branches. The result may have competing claims (e.g., both pre-fusion persons' debts).  
     - **Controversial**: Demanding survival must be one-one (no branching) is a *prejudice*. **Argument**: Fission cases show identity can be non-transitive; refusing this forces counterintuitive claims (e.g., that both outputs can’t matter).  

  8. **Ordinary Self-Concern without Metaphysical Commitments**  
     - **Non-negotiable**: The theory should explain why we care about "future selves" in ordinary life (e.g., retirement savings) without requiring a "further fact" (e.g., a soul).  
     - **Case**: Gradual replacement – we care about our future selves even as cells change.  

  ---

  ### **II. Tensions Between Desiderata**
  - **Conflict 1**: **Determinacy vs. Degrees of Survival**.  
    If survival is scalar (Desideratum 6), "Will it be me?" cannot always have a yes/no answer (contra Desideratum 3). Insisting on determinacy forces artificial thresholds.  
  - **Conflict 2**: **One-One Survival vs. Handling Branching**.  
    If survival must be one-one (rejecting branching), fission/fusion cases become incoherent. But allowing branching violates the "only one future me" intuition.  
  - **Most Excluding Requirement**: **Determinacy (Desideratum 3)**.  
    This excludes otherwise attractive *reductionist* views (e.g., Parfit’s). If indeterminacy is unacceptable, we must accept a "further fact" (e.g., soul) or biological essence, both of which struggle with branching and degrees.  

  ---

  ### **III. Compressed Scorecard of Theories**
  | **Theory**               | **Prudential Guidance** | **Moral Obligations** | **Handles Degrees?** | **Handles Branching?** | **Determinate?** | **Fits Constraints?** |  
  |--------------------------|-------------------------|------------------------|----------------------|------------------------|------------------|-----------------------|  
  | **Animalism** (Biological continuity) | Poor: No inherent reason to care about a copy. | Strong: Output is a new organism; owes nothing. | No: Survival all-or-nothing. | No: Fission/fusion impossible. | Yes: Strict biological criteria. | Poor: Fails sleep/gradual replacement (cells change). |  
  | **Psychological Continuity** (Standard) | Good: Care based on mental connectedness. | Moderate: Obligations follow psychology. | Partial: Admits fading, but often binary. | Poor: Denies survival in fission. | Variable: Vague cases indeterminate. | Good: Explains amnesia/dementia. |  
  | **Further-Fact View** (Soul/substance) | Strong: Only if soul transfers. | Strong: Output is "me" if soul present. | No: Soul is indivisible. | No: Soul can’t branch/fuse. | Yes: Soul guarantees determinacy. | Poor: Ignores neurobiology; soul untestable. |  
  | **No-Further-Fact View** (Parfitian) | Strong: Care based on R-relatedness (psychological connectedness). | Nuanced: Obligations tied to overlapping psychology. | **Best**: Explicitly scalar. | **Best**: Competing claims in fission/fusion. | **Worst**: Often indeterminate. | **Best**: Matches gradual change/amnesia. |  

  **Key Tradeoff**:  
  - **No-further-fact** best satisfies *prudential guidance*, *degrees*, *branching*, and *constraints* but fails *determinacy*.  
  - **Animalism/further-fact** deliver *determinacy* but fail *branching* and *scalar survival*.  
  - **Psychological continuity** is middling but often ad-hoc on branching.  

  **Recommendation**: If you prioritize fitting neuroscience and handling edge cases (e.g., your three novel scenarios), accept indeterminacy and degrees—making the no-further-fact view strongest. If you demand "me" must be a yes/no question, adopt animalism or a further fact, but brace for contradictions in fission/fusion.
