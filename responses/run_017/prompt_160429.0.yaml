  Next, outlining what each view commits to. Total utilitarianism prioritizes aggregate welfare, accepting the repugnant conclusion. Average focuses on per capita welfare, avoiding repugnance but sacrificing other intuitions. Critical-level sets a threshold, which is arbitrary. Person-affecting views focus on harm, leading to incomparability. Each has non-negotiables and evidence sources, like intuitions or formal axioms.

