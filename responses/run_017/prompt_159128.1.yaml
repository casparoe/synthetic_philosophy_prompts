prompt: |-
  I'm a retired barrister in London, now doing a part-time master's in philosophy, and my reading group has just finished a stretch on higher-order evidence and epistemic akrasia. I keep thinking that a completely ordinary feature of legal practice is already committed to a view about these matters, and I'd like help reconstructing it. Here is the practice. When an appellate court reviews a trial judge's findings of fact — above all findings about whether a witness was telling the truth — it applies a deferential standard: it will not reverse merely because the appellate judges, reading the same transcript, would have found otherwise, and the reason conventionally given is that the trial judge saw and heard the witnesses and they did not. But there are two wrinkles I can't fit together. First, the same courts refuse to let an expert — a psychologist, say — tell a jury that a complainant is credible or that a witness is lying; credibility, they insist, is for the tribunal of fact to assess for itself, and jurors are routinely told they may reject expert opinion entirely. So deference is owed to the trial judge on exactly the question on which no deference is owed to an expert. Second, the deference standard survives into cases where the appellate body has the same first-order evidence as the decision-maker: paper-only appeals against administrative decisions, and now, increasingly, appeals where the hearing below was recorded and the appellate court can watch the same demeanour the judge watched. My study-group friend suggests we distinguish evidence-transmission deference, where the trial judge passes on evidence the appellate court lacks, from judgement-deference, where the mere fact that a competent decision-maker reached a conclusion is itself treated as a reason for the reviewer; her suspicion is that the practice quietly runs on the second, and that the stated rationale about demeanour is a rationalisation.

  What I want is the implicit epistemology. Is the trial judge's view being treated as first-order evidence about the world, or as higher-order evidence about the reliability of the appellate judges' own assessment of the transcript? Can the practice be justified by its own stated rationale in the recorded-hearing and paper-only cases, or does it presuppose something stronger — that a decision-maker's arriving at a belief is evidence for its truth, independent of the evidence available to her — and is that a coherent epistemic notion at all, or only an institutional one about who gets to settle a question? Where is the practice strictly committed, and where is it merely compatible with several theories that would all license it? Does it presuppose the conciliationist line on disagreement, or is it consistent with steadfastness — and note that a three-judge panel resolves its own disagreements by counting, not by each judge shaving confidence towards the dissent, which looks like neither. And what of the appellate judge who reads the transcript, concludes the trial judge got it wrong, and is nonetheless required to affirm: is she being asked to occupy an akratic state, believing one thing while taking it that the rational response is another, or does the practice only govern what she may do and what reasons she may give, leaving her beliefs alone?

  Please reconstruct the view the practice presupposes, distinguish what it strictly requires from what merely suits it, say where it is underdetermined by any epistemology, and tell me concretely what would have to change in appellate practice if we replaced the presupposition with a straight evidentialist one and with a conciliationist one. Answer in British English, in continuous prose with no headings or bullet points and no reading suggestions, in no more than 700 words.
reasoning: |-
  Okay, this is a fascinating query from a retired barrister now studying philosophy. They're connecting legal appellate practice to epistemological concepts around higher-order evidence and epistemic akrasia - exactly the kind of interdisciplinary thinking I appreciate. 

  The core tension they've identified is intriguing: why do courts defer to trial judges on witness credibility while rejecting expert opinions on the same matter? And why does this deference persist even when appellate courts have access to identical evidence like video recordings? Their study-group friend's distinction between evidence-transmission deference and judgement-deference seems crucial here.

  Hmm... I need to unpack this carefully. The legal practice appears to rest on several implicit epistemological commitments. First, it treats the trial judge's conclusion not as new first-order evidence about the witness's truthfulness, but as higher-order evidence about the reliability of the appellate court's own assessment. That explains why deference applies even when all raw evidence is available - it's about the epistemic significance of another competent assessor reaching a different conclusion.

  The expert testimony prohibition reinforces this. Courts aren't rejecting expertise per se, but maintaining that credibility assessment isn't a domain for specialist knowledge transmission - it's a fundamental judicial function where the tribunal must form its own direct judgement. This contrasts with deference to the trial judge, which acknowledges their privileged position in making that judgement call.

  Interestingly, the practice seems pragmatically underdetermined regarding conciliationism versus steadfastness. While the stated rationale suggests conciliationism (the trial judge's direct observation warrants confidence-shaving), the internal panel voting procedure favors steadfastness (majority rules without mutual deference). This tension reveals the institutional dimension - the system prioritizes finality and allocates decisional authority.

  The akrasia question is particularly subtle. When an appellate judge personally disagrees but must affirm, they're not being required to believe against their judgement. Rather, institutional epistemology governs action: they must act as if the trial judge's finding stands, while personally maintaining their contrary belief. This operational separation between private conviction and public ruling avoids genuine epistemic akrasia.

  If we replaced the presuppositions: a pure evidentialist approach would collapse deference whenever identical evidence exists, potentially undermining finality. A conciliationist model might extend deference further - say, requiring appellate panels to seriously weight minority views rather than majority-voting. But crucially, the current system blends epistemic and institutional considerations in ways that resist reduction to either extreme.
answer: |-
  The appellate practice you describe implicitly commits to a distinctive blend of epistemic and institutional principles, though it remains underdetermined at key points. Its core presupposition is that the trial judge’s verdict on witness credibility constitutes *higher-order evidence* (HOE) about the reliability of the appellate court’s *own* assessment of the first-order evidence (FOE), rather than providing new FOE about the witness. This HOE stems from the trial judge’s privileged epistemic position: direct observation grants access to demeanour cues that are not merely additional data points, but qualitatively different evidence that shapes how the *rest* of the evidence (e.g., testimony content) should be interpreted. The appellate court, even with a transcript or recording, lacks this holistic, embodied context. The stated rationale—deference due to seeing the witness—is thus genuine, not a mere rationalisation, as it acknowledges an epistemic gap no record can fully bridge.  

  The prohibition on expert testimony about witness credibility reinforces this. Experts are barred not because courts reject specialised knowledge *tout court*, but because credibility assessment is deemed a *non-delegable* judicial function. Jurors (or judges) must directly engage with the FOE to form their own judgement; accepting an expert’s conclusion would shortcut this process, effectively outsourcing the core fact-finding task. In contrast, appellate deference to the trial judge acknowledges that the trial judge *has* legitimately performed this function from a superior epistemic vantage point. The trial judge’s conclusion thus serves as HOE for the appellate court: it signals that the appellate court’s own FOE-based assessment might be unreliable due to missing context, warranting caution.  

  This deference persists in paper-only or recorded hearings because the epistemic asymmetry isn’t fully erased. A recording may capture facial expressions but not the courtroom’s atmosphere, the witness’s interaction with counsel, or subtle cues filtered through the trial judge’s real-time attentional focus. Crucially, the practice also incorporates an *institutional* principle: finality requires that *some* tribunal’s finding settles the matter. The trial judge’s unique position justifies allocating this authority primarily to them. Thus, the practice presupposes that a competent decision-maker’s conclusion *can* be rational HOE for reviewers in virtue of both epistemic privilege and institutional role—a coherent blend, not purely one or the other.  

  The practice is underdetermined regarding conciliationism vs. steadfastness. Three-judge panels resolving disagreement by majority vote reflect steadfastness internally: dissenters need not conciliate but are overruled. Yet externally, the appellate court conciliates toward the trial judge’s view. This tension reveals that deference operates institutionally, not as a universal epistemic norm. It applies only vertically (appellate to trial), not horizontally (between peers), and stems from the trial judge’s designated epistemic advantage, not mere disagreement.  

  For the appellate judge who personally disagrees, the practice mandates *action* (affirming) without demanding *belief* revision. She is not required to think, "The trial judge’s view is probably correct," but rather, "Given the standard of review, I lack sufficient grounds to overturn." This is not strict epistemic akrasia (believing P while believing one ought to believe ¬P), but a recognition that institutional rules constrain what conclusions she may *enforce* based on her private assessment. Her belief that the trial judge erred may remain, but she acknowledges that her FOE-based dissent is epistemically defeasible by the HOE of the trial judge’s contrary conclusion and the institutional allocation of authority.  

  **If replaced by strict evidentialism:** Appellate courts would reverse whenever their assessment of the FOE (transcript/recording) differed from the trial judge’s, regardless of demeanour’s theoretical irrecoverability. Deference would vanish in paper appeals, as identical FOE would demand identical conclusions. Witness credibility would be treated as assessable purely from records, collapsing the HOE rationale.  
  **If replaced by conciliationism:** Appellate judges would be required to significantly lower confidence in their own assessments upon encountering the trial judge’s disagreement, potentially deferring even where they perceived strong FOE for reversal. Internally, panels might adopt consensus-seeking over majority votes. Crucially, conciliationism could *extend* deference beyond institutional roles (e.g., between co-equal judges), which the current practice avoids.  

  The practice strictly requires accepting the trial judge’s vantage point as generating HOE justifying restraint. It is compatible with—but does not strictly require—stronger notions that a decision *qua decision* provides independent evidence of truth. It suits, but is not committed to, conciliationism; its institutional architecture allows steadfast private judgement while mandating conciliatory action. What must hold is that direct observation confers an epistemic advantage not fully transferable via records, and that this advantage warrants institutional deference even against an appellate court’s sincere FOE-based dissent.
