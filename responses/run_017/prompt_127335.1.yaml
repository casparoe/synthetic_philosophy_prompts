prompt: |-
  So I'm in a worker co-op and one of the other members keeps ending arguments with "the wisdom of crowds" — it came out twice in our last meeting about how we should make decisions. First use: we were deciding whether to hire one of two people for a paid role, and the suggestion that our two most experienced members should just decide it got shut down with the slogan — apparently a majority vote of all 30 of us is more likely to get it right. Second use: someone said we should always talk it through together before voting, because pooling what everyone knows is precisely what makes the group smarter than any individual. I have a nagging feeling the second claim quietly breaks whatever makes the first one work — I remember enough of the Condorcet jury theorem setup to know there's an independence assumption in there somewhere and that us all hearing the same two loud people before voting looks like exactly the kind of thing that would violate it — but I also cant tell whether the slogan is even making the same claim in the two places, and I keep sliding between "more voters is better", "the group beats its average member" and "the group beats its best member", which feel like very different strengths of claim.

  Can you lay out as a menu the precise things "the wisdom of crowds" could be asserting here, with verdicts — which are near-trivial, which are substantive but defensible, which are just false? At minimum I'd want: the weak "majority is more accurate than the average member", the stronger "more accurate than the best member", the asymptotic "accuracy goes to certainty as the group grows", and separately that averaging thing where a crowd guessing a number beats individual guesses because errors cancel out. For each, spell out what has to be true of the voters: I especially want to know what exactly has to be independent of what, because "everyone read the same article" and "everyone heard what the confident guy said" feel like different failures and I can't say how, and I also want to know whether it matters that the vote is on a question with a heavily skewed base rate (surely a voter who always votes the same way has great accuracy and tells us nothing?).

  Then the part I actually care about: for each reading on the menu, does it support the first use, the second use, both, or neither? Concretely — if the extra voters we'd be adding are only barely better than a coin flip, does the slogan still deliver anything, or do you need an absurd number of people before 30 slightly-competent votes are worth much? What if they're systematically wrong about this particular kind of question — does the whole thing flip into "madness of crowds"? And is there any reading on which deliberating before voting still helps even though it destroys independence, e.g. one where everyone's individual competence rises enough to pay for the correlation? Two last things: there's a simulation result I half remember where a diverse bunch of merely-okay heuristics outperformed a group of individually better ones, and I don't know whether that's a separate reading or the same one in different words; and should the members who know nothing about the question just abstain, and if so is the result still "the wisdom of crowds" or have we quietly switched to deference to experts? I don't need citations or sources, I just want to know which precise claims are on offer and which ones would actually win me the argument.
reasoning: |-
  Okay, the user is part of a worker co-op where someone keeps invoking "the wisdom of crowds" to justify decision-making processes. They're dealing with two specific instances: one where a majority vote of 30 members was preferred over letting two experts decide on a hire, and another where pre-vote deliberation was suggested to pool knowledge. The user suspects these uses might contradict each other due to independence issues but isn't sure. They want a clear breakdown of what "wisdom of crowds" actually claims, the conditions required for each claim, and which claims support or undermine the co-op member's arguments.

  First, I need to outline the different interpretations of "wisdom of crowds" and their requirements. The user mentioned several versions: the weak claim (majority more accurate than average member), the strong claim (better than best member), asymptotic claim (accuracy to certainty with group size), and the averaging claim (for numerical estimates). For each, I'll specify the necessary conditions, especially regarding voter independence and competence.

  The user is particularly concerned about independence. They mentioned situations like everyone reading the same article or hearing a confident person speak, which could create correlations that break the independence assumption. I should clarify what independence means here—it's about voters not influencing each other's judgments, so shared information sources or deliberation can violate this.

  They also asked about skewed base rates. If there's a base rate skew, like most candidates being unsuitable, a voter who always votes "no" might have high accuracy but adds no new information. This relates to the competence parameter in Condorcet's theorem. If voters are biased in the same direction, the group can amplify errors instead of correcting them.

  For the two use cases: the first (hiring vote) relies on the Condorcet model, where independence is crucial. Adding barely competent voters requires a large group to be useful, and if they're systematically wrong, it backfires. The second use (pre-vote discussion) aims to improve individual competence but likely creates correlations, which might hurt more than the competence gains help. The diversity prediction theorem might still hold here, but it's weaker and doesn't guarantee beating the best member.

  The user also brought up the diversity trumps ability result. That's a separate point where diverse, less competent models can outperform uniform, better ones. But in their co-op, if deliberation reduces diversity, this benefit might be lost. So for the second use case, deliberation might help competence but harm diversity and independence, making it unclear if it's beneficial.

  On abstention: members with no knowledge should abstain because random guesses add noise. If only informed members vote, it's more like deference to experts, which contradicts the "more voters are better" idea but might be more accurate. The slogan doesn't apply here since the crowd isn't making the decision.

  The user's deeper need is to win the argument in their co-op. They need clear, actionable points to challenge the misuse of the slogan. Highlighting the independence violation in deliberation and the potential for systematic errors could help. Also, pointing out that adding uninformed voters might not help and could harm if they're biased. For the hiring decision, suggesting that experts might be better unless the group is large and competent enough.

  They might also be concerned about democratic participation vs. efficiency. The co-op member is using "wisdom of crowds" to justify inclusivity, but the user suspects it's not effective. Balancing inclusivity with good decisions is key. Proposing structured methods, like collecting independent opinions first or using prediction markets, could be solutions.

  Need to ensure each claim is clearly defined with conditions, then applied to the use cases. Verdicts should indicate which claims are valid and when. For example, the weak and moderate claims hold under independence and competence, but the strong claim rarely does. The asymptotic claim requires many voters, which 30 might not be if competence is low. The averaging claim doesn't apply to voting but to numerical estimates.

  Summarizing the verdicts: the first use (voting on hires) is supported only if voters are independent and competent enough. Otherwise, experts might be better. The second use (deliberation) is contradicted because it breaks independence, though it might increase competence. However, the trade-off usually isn't worth it, and diversity loss can hurt performance. The user can argue that for complex decisions, structured independence is better than open discussion.
answer: |-
  Here's a breakdown of "wisdom of crowds" (WoC) claims, their requirements, and their relevance to your co-op arguments. Think of it as a menu of claims and their "verdicts" regarding your two use cases.

  **Core WoC Frameworks & Their Claims:**

  1.  **The Weak Claim (Condorcet Jury Theorem - Majority Voting):**
      *   **Assertion:** For a binary choice with a *correct* answer, if each voter has independent judgment and a competence *p > 0.5* (better than random chance), then:
          *   **(a)** The majority vote is more likely to be correct than an individual vote (any individual, including the average).
          *   **(b)** The majority vote's accuracy increases towards 100% as the group size increases.
          *   **(c)** The majority vote is more likely to be correct than the vote of *any single member* only if *p* is sufficiently high *and* the group is large enough. It does *not* guarantee beating the *best* member, especially if the best is highly competent (*p* close to 1) and the group is small.
      *   **Critical Requirements:**
          *   **Binary Choice:** Yes/No, Hire A/Hire B.
          *   **Correct Answer Exists:** There *is* an objectively better candidate (even if difficult to discern).
          *   **Independent Judgments:** Voters' probabilities of being correct are statistically independent. This means voter A's decision doesn't influence voter B's *probability of being correct*. Hearing the same arguments, deferring to the same "loud person," or sharing the same bias *absolutely violates* this. Their errors become correlated.
          *   **Homogeneous Competence (p):** Everyone has the same *p > 0.5*. (Relaxations exist, but homogeneity simplifies).
      *   **Verdict on Claims:**
          *   (a) Near-trivial (given *p>0.5* & independence).
          *   (b) Substantive & defensible (given *p>0.5* & independence).
          *   (c) Often false for beating the *best* member unless group is large and best isn't *extremely* good.
      *   **Skewed Base Rates:** A voter with high accuracy by always voting the same way (e.g., always "No hire") has high accuracy *only if the base rate matches their bias*. If the base rate changes (e.g., a good candidate pool), their *p* plummets. They violate the *p>0.5* assumption in contexts where their bias is wrong. WoC requires voters to have *p>0.5* *for the specific question at hand*.

  2.  **The Strong Claim (Group Beats Best Member):**
      *   **Assertion:** The majority vote (or group judgment) is more accurate than the *single most competent member* of the group.
      *   **Requirements:** Extremely demanding. Requires:
          *   Independence (as above).
          *   Competence *p > 0.5* for all.
          *   The best member *not* being near-perfect (*p* significantly < 1).
          *   A large enough group size relative to the competence gap.
      *   **Verdict:** **Rarely True & Highly Contextual.** Often false in small groups or when a clear expert exists (*p* very high). The Condorcet framework shows this is *possible* under specific conditions, not guaranteed. Don't rely on this interpretation.

  3.  **The Averaging Claim (Galton/Surowiecki - Numeric Estimation):**
      *   **Assertion:** For estimating a numeric value (e.g., weight of an ox, project cost), the *average* (or median) of many independent estimates is often more accurate than most individual estimates and can rival experts. Errors cancel out.
      *   **Requirements:**
          *   Numeric question.
          *   Independent judgments (same critical requirement).
          *   Estimates unbiased on average (errors are random, not systematically skewed).
          *   Diversity of estimation methods/information (helps ensure independence & unbiasedness).
      *   **Verdict:** Substantive & defensible **for numeric questions**, given independence and lack of systematic bias. Does *not* apply directly to binary choices like hiring votes.

  4.  **The Diversity Trumps Ability Claim (Page's Model):**
      *   **Assertion:** A group of diverse problem-solvers (using different perspectives/heuristics) can outperform a group of individually higher-ability but less diverse problem-solvers (or sometimes even a single "best" expert) on complex problems, especially predictive or optimization tasks.
      *   **Requirements:**
          *   Complex problem with multiple valid approaches/perspectives.
          *   Genuine diversity in how members model the problem and generate solutions/predictions.
          *   Effective aggregation method (averaging, voting, market mechanisms).
          *   Less emphasis on individual *p > 0.5*; more on diverse *ways* of being partially right/wrong.
      *   **Verdict:** Substantive, defensible, and distinct from Condorcet/Galton. It's about *how* the group works, not just size or average competence. Independence (of *perspectives*) is still crucial.

  **Applying the Menu to Your Co-op Arguments:**

  *   **Use Case 1 (Hiring Vote vs. Experts):**
      *   **Invoked Claim:** Condorcet Majority Voting (Claims 1a, 1b, possibly 1c).
      *   **Verdict (Does WoC Support This?):** **Conditionally, maybe.**
          *   **Requires:** 30 members *independently* assessing candidates with *p > 0.5*. If true, majority *should* be better than average member (1a) and likely better than a coin flip. Accuracy increases towards certainty *only if p>0.5 and independent*.
          *   **Problems:**
              *   **Independence Likely Violated:** Shared interviews, discussions, reputations, "loud people" *destroy* independence. Errors become correlated, potentially *reducing* group accuracy below what independence would predict, possibly even below expert accuracy.
              *   **Competence (p) Unknown:** Are most members truly *better than random* at hiring? For complex roles, many members might have *p < 0.5* due to lack of expertise. Adding barely competent (*p* just above 0.5) voters requires *very large N* for high accuracy (e.g., ~250 for ~90% accuracy if p=0.55). 30 voters with average p=0.6 only get ~70% accuracy. If p=0.55, it drops to ~62%. Experts (p=0.8+) could easily be better.
              *   **Systematic Bias (Madness of Crowds):** If the group shares a systematic bias (e.g., overvaluing charisma, undervaluing technical skills), group accuracy plummets as errors amplify. WoC flips into its opposite.
              *   **Beating Experts (1c)?** Unlikely unless experts are mediocre and group is large, independent, and competent. Two true experts collaborating might outperform a correlated vote of 30.
          *   **Conclusion:** The slogan *invokes* WoC, but the reality (violated independence, uncertain competence, small N) means it **doesn't robustly support** preferring a 30-person vote over experts *in this context*. It *might* be better, but WoC doesn't guarantee it.

  *   **Use Case 2 (Deliberate Before Voting):**
      *   **Invoked Claim:** Implicitly mixes Condorcet (pooling knowledge makes the group smarter) and potentially Diversity/Averaging ideas.
      *   **Verdict (Does WoC Support This?):** **Mostly Contradicts Core WoC Requirements.**
          *   **The Fatal Flaw (Independence):** Deliberation *explicitly destroys independence*. Shared arguments create common information and social influence, correlating judgments. This directly violates the core requirement of Condorcet and Galton averaging. The group becomes *less* wise than independent judgments would be. "Hearing the same two loud people" is a classic independence killer.
          *   **Does Deliberation Help Anyway?** *Potentially*, but *not* via classic WoC mechanisms. Deliberation *might*:
              *   Increase *average competence (p)* by sharing facts.
              *   Reveal true experts (leading to deference, not WoC).
              *   Foster shared understanding (valuable, but not WoC).
              *   Expose flaws in arguments.
          *   **The Trade-Off:** The *gain* in average *p* must *outweigh* the *loss* from induced correlation. Research (e.g., "groupthink," information cascades) suggests this is hard; deliberation often *lowers* group accuracy compared to aggregating independent pre-deliberation judgments. Diversity is also often reduced as views converge.
          *   **Diversity Claim?** Deliberation often *homogenizes* perspectives, potentially *hurting* the "Diversity Trumps Ability" effect.
          *   **Conclusion:** Invoking WoC to justify pre-vote deliberation **directly contradicts** the independence requirement essential for WoC effects. While deliberation has other potential benefits, it *undermines* the statistical "wisdom" generated by independent judgments. WoC frameworks **do not support this use**.

  **Abstention & Expertise:**

  *   **Should uninformed members abstain?** **Yes, absolutely.**
      *   **Why:** A voter with *p = 0.5* (pure guess) adds *noise but no signal*. They dilute the influence of competent voters, *lowering* expected group accuracy. A voter with *p < 0.5* (systematically wrong) actively *harms* group accuracy. Abstention removes this noise/bias.
  *   **Is this "Deference to Experts"?** **Essentially, Yes.** If only knowledgeable members vote, the "crowd" making the decision is effectively the expert subgroup. The WoC effect relies on averaging/aggregating *competent* judgments. Removing incompetent voters focuses the aggregation on those more likely to be correct. The slogan "more voters is better" **only holds if the extra voters are competent and independent**. Adding incompetent voters makes things worse. Abstention by the uninformed is crucial for WoC to function well.

  **Winning Your Argument - Key Takeaways:**

  1.  **Independence is King (and Fragile):** Hammer this point. "The wisdom of crowds *requires* us to make up our minds *independently*. Hearing the same arguments, especially from dominant voices, destroys that independence. Our discussion *before* the vote, while valuable for other reasons, actively works *against* the statistical 'wisdom of crowds' effect by making our votes correlated. If we want true 'wisdom of crowds,' we need to find ways to gather independent judgments first (e.g., silent writing, anonymous preliminary votes) *before* discussing."
  2.  **Competence Matters (Not Just Numbers):** "Adding more voters only helps if they are genuinely better than random at the task (*p > 0.5*). For complex hiring decisions, many of us may lack the expertise to meet this bar. Adding our barely-informed votes dilutes the input of those who truly understand the role. Abstention isn't weakness; it's responsible and makes the group's collective judgment *stronger*."
  3.  **30 Isn't Magic (Especially Without Independence/Competence):** "Condorcet shows that 30 mediocre but independent voters (*p=0.6*) only get it right about 70% of the time. If we're not independent or many of us are guessing, it could be much lower. Two true experts collaborating might easily surpass that accuracy."
  4.  **Deliberation vs. WoC are Often Antagonistic:** "You argued deliberation pools knowledge to make us smarter collectively – which sounds like WoC. But the pooling *during discussion* creates the shared influences that break the independence WoC needs. We can use discussion to *inform* people individually, but then we need mechanisms to capture their *independent* judgments for the vote to harness any 'crowd wisdom.'"
  5.  **Focus on Structure, Not Just Slogans:** Propose alternatives: "For important decisions, let's try: 1) Circulate key info silently. 2) Have members submit *anonymous, initial* votes/ratings *independently*. 3) *Then* discuss the *results* of that independent aggregation (where are we agreeing/disagreeing? why?). 4) *Then* have a final vote/discussion. This captures independent wisdom *before* discussion biases us." Or: "For decisions requiring deep expertise, maybe we delegate the *recommendation* to a small subgroup with relevant skills, and the whole co-op votes to *ratify* based on understanding the rationale."

  By dissecting the slogan into its precise claims and highlighting the critical (and often violated) assumptions of independence and competence, you can move beyond the rhetorical appeal of "more people = wiser" and argue for decision structures that genuinely leverage collective intelligence where possible, or recognize the need for expertise/delegation where it isn't.
