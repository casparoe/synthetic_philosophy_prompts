prompt: |-
  Im in a phil of physics seminar right now and we just spent two weeks on substantivalism vs relationism — newtons bucket, whether a lone planet in an otherwise empty universe would still bulge at the equator, Mach, the hole argument, all of it. Everyone argues about the metaphysics but I got stuck on something much more boring: what do the people who actually have to say whether something is rotating do?

  Because as far as I can tell the working practice does two things that pull in opposite directions. (1) The official standard for not rotating in astronomy — the International Celestial Reference System and its realization, the ICRF — fixes its axes by requiring that they show no net rotation relative to a set of very distant extragalactic objects, mostly quasars, tracked by radio interferometry across the earth; the optical frame from the Gaia satellite is then tied to that, and Earth orientation parameters (where the pole is, how far the planet has turned today) plus deep-space navigation are all measured against it. So the standard of non-rotation is defined by the distant matter in the universe. (2) At the same time the field also trusts sealed-box instruments: ring laser gyroscopes and other Sagnac devices, including big ones bolted to bedrock in Germany and Italy that are used to measure the earth's rotation directly, which never look at the sky at all — they just report an angular velocity for the lab, full stop.

  My prof says (1) shows the practice is basically Machian, my textbook says (2) shows general relativity keeps rotation absolute because inertial structure is a real field, and I cant tell who is reading too much into plumbing. So: what does the practice as a whole actually presuppose about what rotation is? Reconstruct the implicit theory, and be sharp about what it strictly presupposes versus what it merely fits fine with. Is (1) and (2) an inconsistency, or are they just measuring different things — is the quasar frame only a convenient, accessible marker for a frame that's there anyway?

  Two more wrinkles I want in. First, frame dragging: spinning mass does shift local inertial frames a bit. Does that mean the practice is secretly committed to a partly relational picture, or is it one effect among many? Second, a made-up case: suppose over a couple of decades VLBI and the big ring lasers slowly drift apart by a tiny amount, and the drift tracks how the mass in our cosmic neighbourhood is distributed and moving — imagine a huge rotating shell of matter around the observatory. Which instrument then gets to say what is really not rotating, and what would geodesists have to do about Earth orientation parameters and the frame definition, and on what grounds? Does it matter if the drift is local (only near the mass) rather than global?

  And what would concretely have to change in the day-to-day work if you swapped in full relationism, or full substantivalism, or the view that spacetime is just a field and the question is ill-posed — or is the practice underdetermined, so that several theories license exactly the same measurements and both my prof and the textbook are over-reading? Also worth saying whether GR even gives one global answer about who is rotating or only local ones, because if it's only local then the practice might presuppose less than the whole metaphysics fight assumes.
reasoning: |-
  Okay, let me unpack this user's question. They're in a philosophy of physics seminar discussing substantivalism vs relationism, focusing on rotation. The user is stuck on how working physicists actually determine rotation in practice, noticing a tension between two methods: using distant quasars as a fixed reference frame and using local gyroscopes that measure rotation without external references. Their professor sees the quasar method as Machian, while their textbook claims the gyroscope method supports absolute rotation in GR. The user wants to know what this practice implies about the nature of rotation.

  First, I need to recall the key concepts. Substantivalism treats spacetime as a real entity, so rotation is absolute relative to spacetime itself. Relationism says motion is only relative to other matter, so rotation depends on the cosmic matter distribution. GR complicates this with frame-dragging, where local mass affects inertial frames.

  Looking at the two methods: the ICRS uses distant quasars, which seems relational, while ring laser gyroscopes measure local rotation without external references, suggesting absolute rotation. But are these methods actually in conflict? In GR, local inertial frames are defined by freely falling particles or gyroscopes, which align with the distant stars in average. So the quasar frame is a practical way to approximate this global inertial frame.

  The user's hypothetical about a rotating mass shell causing drift between VLBI and gyroscopes is interesting. In GR, frame-dragging would cause such drift, meaning the local gyroscopes would respond to the nearby mass, while VLBI still references distant quasars. Practitioners would likely recalibrate their frames to account for the measured drift, showing they adapt to observations without strict metaphysical commitments.

  For the user's deeper questions: the practice doesn't presuppose substantivalism or relationism. Instead, it relies on operational definitions—rotation is what gyroscopes measure, and the quasar frame is a stable reference. Frame-dragging is treated as a measurable effect, not a philosophical statement. If a drift occurred due to local mass, they'd adjust models pragmatically.

  The user also asks if GR provides a global answer. In asymptotically flat spacetimes, yes, but in our universe, the cosmological frame defined by the avNoHD matter distribution serves as the global standard. So practice uses this frame, licensed by GR's structure when boundary conditions are set.

  In summary, the working practice is metaphysically minimal, using gyroscopes for local measurements and distant matter for reference, adjusting for effects like frame-dragging as needed. Both professor and textbook overinterpret; the practice fits GR's framework without committing to either extreme.
answer: |-
  Based on the operational practices you describe and the framework of General Relativity (GR), here's a reconstruction of what the practice *strictly presupposes* versus what it *fits with*, addressing your specific questions and wrinkles:

  **The Implicit Theory of Rotation in Practice:**

  1.  **The Core Presupposition: Rotation is Defined by Local Inertial Frames (LIFs).**
      *   **What is Strictly Presupposed:** An object is "non-rotating" *locally* if its axes are fixed relative to a local inertial frame. The gold standard for establishing an LIF is a *freely falling, non-spinning test gyroscope*. This is what ring laser gyroscopes and other Sagnac devices *operationally measure*. They detect deviations from local inertial motion caused by the lab's rotation relative to the LIF.
      *   **Why (2) is Fundamental:** Ring lasers directly measure the rotation rate relative to the LIF defined by their own physical principles (Sagnac effect, stemming from the spacetime metric). They require *no external reference* to the distant universe to report this rate. This operational definition is prior to any astronomical frame.

  2.  **The Role of the ICRF/ICRS (Method 1): A Practical Realization of the Global Inertial Frame.**
      *   **What is Strictly Presupposed:** To define a *global, consistent coordinate system* for describing positions and motions across the solar system, galaxy, and universe, a fixed reference is needed. The distant universe (quasars), due to its extreme distance and consequent low apparent proper motion, provides the most stable, observationally accessible reference points *available to us*.
      *   **What it Fits With / Why it Works:** In GR, within the context of standard cosmology (FLRW metric), the frame in which the Cosmic Microwave Background (CMB) is isotropic *and* the average motion of distant galaxies/quasars has no bulk dipole flow (the *rest frame of the Hubble flow*) defines a unique, preferred global inertial frame. This frame coincides with the frame where local inertial frames (as defined by gyroscopes) show *no net rotation* over cosmological timescales. The ICRF is an *operational approximation* of this cosmological rest frame, achieved by fixing axes relative to distant quasars. It is **not** presupposed that the quasars *create* the frame; they are utilized as *markers* for the frame that GR's solution for the large-scale universe + initial conditions establishes.
      *   **Relationship to (2):** The stability and consistency of the ICRF are validated *against* the behavior of local inertial frames measured by other means (like Earth rotation variations measured by ring lasers compared to VLBI). If they agree long-term, it confirms the ICRF is a good realization of the global frame. The ring lasers measure *local rotation rate*, while the ICRF provides the *global coordinate system* against which that rotation is meaningfully described.

  3.  **Frame Dragging: A Measurable Effect, Not a Foundational Shift.**
      *   **What is Strictly Presupposed:** Massive rotating bodies (like the Earth) *do* perturb the local inertial frame (Lense-Thirring effect). This is a predicted and measured effect within GR.
      *   **What it Means for Practice:** Frame dragging is treated as one gravitational effect among many that must be modeled for high-precision work (e.g., satellite orbits like Gravity Probe B, LAGEOS). It introduces a small *shift* in the orientation of the local inertial frame relative to the *distant* frame (ICRF). It does **not** imply that rotation is fundamentally relational. The gyroscope still defines the *local* "non-rotating" state, but that state itself is slightly altered by nearby rotating mass relative to the distant universe. The ICRF remains the global reference.

  4.  **Your Made-Up Case (Rotating Shell & Drift):**
      *   **The Scenario:** VLBI (referenced to distant quasars/ICRF) and local ring lasers slowly drift apart, correlated with a massive, rotating local shell.
      *   **What Happens:**
          *   The ring lasers are measuring the *true local inertial frame*, which is now being significantly dragged by the shell relative to the distant universe frame (ICRF).
          *   VLBI continues to track the ICRF.
          *   **Who "Wins"?** Neither instrument is inherently "right" or "wrong" about reality. They are measuring *different things*:
              *   Ring Lasers: Measure rotation relative to the *dragged* local inertial frame.
              *   VLBI: Measures rotation relative to the *distant matter* frame (ICRF).
          *   **Impact on Practice:** Geodesists would observe the drift. They would:
              1.  **Model the Effect:** Develop a gravitational model incorporating the rotating shell to predict the frame-dragging offset.
              2.  **Calibrate/Correct:** Use this model to *correct* either the ring laser data (to refer it back to the ICRF) or the VLBI-derived Earth orientation parameters (to account for the local frame dragging effect on Earth-based measurements, though VLBI itself is less directly affected as it references distant sources).
              3.  **Define the Frame:** The ICRF would likely *remain* the official standard global frame. The ring laser data, corrected using the gravitational model, would be used to understand the *local* deviations from that global frame caused by the shell.
          *   **Local vs. Global Drift:** If the drift were purely local (only near the shell), it wouldn't affect the *global* definition of the ICRF based on distant quasars. The global frame remains stable. The challenge is reconciling *local* measurements (ring lasers) made in a *dragged* frame with the global standard. If the drift affected the *entire cosmic neighborhood* including the quasars (a much larger, cosmological-scale effect), it would invalidate the ICRF's stability, requiring a fundamental reassessment based on even more distant markers or the CMB.

  5.  **GR's Answer: Local First, Global with Conditions.**
      *   GR fundamentally defines rotation *locally* relative to a local inertial frame (gyroscope).
      *   GR *does* provide a way to define a *global* standard of non-rotation ("absolute" in a specific sense) *if* suitable boundary conditions are imposed. In an asymptotically flat spacetime (like an isolated system), the frame at infinity defines non-rotation. In our universe, the frame defined by the large-scale isotropy of the universe (the CMB rest frame / avNoHD) serves this role. This global frame is *consistent* with the local gyroscope definition in regions undisturbed by significant local masses.

  **What the Practice Presupposes vs. What it Fits:**

  *   **Strictly Presupposed:**
      *   The operational definition of local non-rotation is alignment with a local inertial frame, measurable by a gyroscope/Sagnac device.
      *   A stable, global coordinate system (ICRF) is necessary for practical astronomy and geodesy.
      *   Distant quasars are the most observationally stable fiducial markers *available* for defining this global system.
      *   GR provides the correct framework for calculating gravitational effects, including frame dragging.
  *   **Fits With (But Does Not Strictly Presuppose):**
      *   The ICRF approximates the cosmological rest frame defined by the large-scale matter distribution (avNoHD/CMB frame).
      *   That this cosmological rest frame coincides with the frame where local gyroscopes show no net rotation over long periods *in the absence of significant local perturbations*.
      *   The substantivalist view (spacetime structure exists independently and defines inertia) *because* the gyroscope works locally without distant matter.
      *   The compatibility with relationism *in the weak sense* that the *global* standard is tied to distant matter, but crucially, *not* because distant matter *causes* the local inertial properties (Mach's Principle in its strong form); rather, the matter distribution *defines via GR's equations* the global solution which includes the metric structure determining local inertia.

  **Addressing the Inconsistency Question and Metaphysics:**

  *   **(1) and (2) are NOT an inconsistency.** They measure complementary things:
      *   **(2) Ring Lasers:** Measure *local rotation rate* relative to the *local inertial frame* (defined by gyroscopes).
      *   **(1) ICRF:** Provides the *global coordinate system* (approximating the cosmological rest frame) against which the *direction* and *long-term average* of that local rotation is described.
      *   The quasar frame is a *convenient, accessible marker* for a frame that GR's cosmological solution indicates is globally inertial and aligns with local gyroscopes in undisturbed regions.

  **What Changes Under Different Metaphysics?**

  *   **Full Relationism (Strong Mach):** If distant matter *caused* all inertia, the ring laser should *stop working* if placed inside a massive, *non-rotating* shell (contrary to GR prediction). Practice *relies* on ring lasers working independently of distant matter configuration locally, falsifying strong Mach. Swapping in strong Mach would require a completely different theory where gyroscopes respond *only* to the instantaneous distribution of cosmic matter, invalidating GR and current practice.
  *   **Full Substantivalism:** Current practice fits comfortably. The gyroscope measures rotation relative to spacetime structure. The ICRF uses distant matter as a *gauge* to fix the coordinate representation of that structure globally.
  *   **Spacetime is Just a Field:** This is largely the GR view. The "question" of rotation is perfectly well-posed *operationally* (gyroscopes) and *coordinately* (ICRF). The metaphysics doesn't change the practice. The practice presupposes the *reality of the metric field* (which defines gyroscope behavior and light paths for VLBI).
  *   **Underdetermination?** Your professor and textbook *are* over-reading the practice. The practice is **metaphysically minimal**:
      *   It presupposes the reality of local inertial structure (operationalized by gyroscopes).
      *   It presupposes the need for a stable global coordinate system.
      *   It presupposes that distant quasars are empirically stable markers.
      *   It presupposes GR is correct for modeling effects.
      *   It **does not** presuppose whether spacetime is a substance or a relation. It *fits* the substantivalist-leaning GR ontology best, but the *operational core* (gyroscopes defining local rotation) transcends the dichotomy. The choice of the ICRF is driven by empirical stability and cosmological solution consistency within GR, *not* by a foundational commitment to relationism.

  **Conclusion:** The working practice is remarkably coherent under GR. Rotation is fundamentally a *local* property defined relative to a local inertial frame, measurable by gyroscopes. The ICRF provides a globally consistent *coordinate system* anchored to the most stable observable markers (distant quasars), which empirically aligns with the cosmological rest frame predicted by GR. Frame dragging is a measurable perturbation of the local frame relative to the global one. The practice does not resolve the substantivalism/relationism debate in favor of either extreme; it presupposes the reality of the metric field and local inertial structure, utilizes distant matter as a practical gauge fixer for global coordinates, and fits naturally within the framework of GR as it is applied to our universe. Both your professor (interpreting ICRF as Machian) and your textbook (interpreting gyroscopes as absolute) are extracting more metaphysical significance from the tools than the practice itself strictly requires or implies.
