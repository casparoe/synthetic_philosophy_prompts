  The fatal flaw appears to be in step 2's false dichotomy. Doug claims guarantees can ONLY be worst-case or average-case, but in reality engineering uses something else: "envelope guarantees" with monitoring. This isn't a third type but rather a conditional worst-case guarantee within operational boundaries. 

