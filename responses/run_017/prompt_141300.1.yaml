prompt: |-
  Hey — my supervisor is a historian of medieval logic and shes been using our tutorials to work out her own line on future contingents. I've been keeping notes on her verdicts, and I want to know what she'll say about the case I'm about to put to her, and more than that what rule she's actually running.

  Her verdicts so far, all about claims made now, before the thing happens:

  - that there will be a sea battle tomorrow, said today with nothing yet settling it: neither true nor false.
  - that either there will be a sea battle tomorrow or there wont be: true — she insists the whole disjunction is true even though neither half is.
  - that there was a sea battle yesterday: determinately true or false, and she adds that if a battle is raging right now then it was true yesterday that there would be one.
  - that the total eclipse the astronomers are predicting for next decade will happen where they say: true now, fixed by where things are plus the laws.
  - that the coin I'm about to flip will land heads: neither true nor false.
  - that a fruit machine already mechanically set to pay out will pay out, though nobody knows it's been set: true — our ignorance is beside the point.
  - that a fortune teller who has never once been wrong predicts a battle: still neither true nor false, though she says you'd be mad to bet against him.

  Here's the case I want to bring. Marta made up her mind last night about how she'll vote at tomorrow's department meeting, wrote it on a slip of paper, put it in a locked drawer nobody will open before the meeting, and told no one. Assume for the sake of the case that nothing between now and then will change her mind. But also assume her deciding wasn't nomicly inevitable: the department's pet physicist says the process involved objective chance, so an hour before she decided there was no fact of the matter about which way she'd go, and even now there's no law tying the intention to the vote, only a very reliable psychological regularity. And assume nobody can find out now, not even in principle, short of breaking into the drawer.

  So: does she say the claim that Marta will vote yes is neither true nor false, or true-or-false-but-we-cant-tell-which, or flat out true if the slip says yes? What's the rule she's running — I can see at least settledness by the present state plus the laws, something about whether deliberation is still open or closed, something about whether there's already a truthmaker in the world, and maybe a fourth on which the neither-true-nor-false verdicts are really about necessity rather than truth — and what does each of them predict here? Which of her precedents is the closest analog to my case? And what should I put to her next to split the rules that agree on this one — I'm allowed to stipulate whatever I want next time, deterministic brains, sealed envelopes, whatever.

  I care much more about the rule and about the tie-breaker question than about the answer itself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a student working with a supervisor who's a historian of medieval logic, specifically focusing on future contingents. The student has been noting down her verdicts on various scenarios and now wants to predict her response to a new case about Marta's vote. More importantly, they want to identify the underlying rule she's applying and design a tie-breaker scenario.

  First, I need to analyze the supervisor's past verdicts. Looking at the cases: 

  The sea battle tomorrow is neither true nor false, which aligns with Aristotelian views on future contingents. The disjunction "battle or no battle" is true, which makes sense under a supervaluationist approach. Past events are determinate, which is standard. The eclipse prediction is true now because it's fixed by current laws and states—so deterministic outcomes are settled. The coin flip is indeterminate, similar to the sea battle. The fruit machine set to pay out is true now because the mechanism is fixed, even if unknown. The fortune teller case is interesting—despite perfect accuracy, the future event is still indeterminate, emphasizing that epistemic certainty doesn't equate to ontological determinacy.

  The user's new case involves Marta deciding her vote, writing it down, locking it away, with no possibility of change or access. The decision had objective chance involved initially, but now it's fixed psychologically, though not nomically necessary. 

  Key factors here: the vote is causally determined now (Marta won't change her mind), but not nomically necessary. There's a physical record, but it's inaccessible. The supervisor's previous cases suggest that determinism by current state + laws makes a future claim true now (eclipse, fruit machine). Here, the vote is fixed by Marta's psychology, even if not by physical laws. The fruit machine analogy seems closest—both have an unchangeable outcome that's inaccessible. So likely, the supervisor would say the claim about Marta's vote is true (if she wrote yes) or false (if no), but we can't know which.

  The underlying rule seems to be about "causal settledness": if the outcome is fixed by the current state (even if not by physical laws), it's determinate. This contrasts with cases like the sea battle or coin flip, where the outcome isn't yet fixed. 

  For tie-breakers, scenarios that split causal settledness from nomic determinism or epistemic access would be useful. For example, a deterministic brain process without a record (settled but no truthmaker) vs. a record without causal determinism (truthmaker but not settled). Or introducing quantum events where a future outcome is recorded but not causally determined.

  The user's deeper need is to understand the supervisor's philosophical framework, not just get an answer. They want to engage in the methodology, hence the request for tie-breaker cases. Identifying which precedents the supervisor prioritizes (e.g., fruit machine over fortune teller) will reveal her stance on truthmakers vs. epistemic access.
answer: |-
  Based on your supervisor's precedents, her underlying rule, and the Marta case, here's the breakdown:

  1.  **Verdict on Marta's Vote:** Your supervisor will almost certainly say the claim "Marta will vote yes" is **true now** (if she wrote "yes") or **false now** (if she wrote "no"). It is **not** "neither true nor false".

  2.  **The Rule She's Running: Causal Settledness by the Present State**
      *   Your supervisor is distinguishing between future events that are **causally settled by the present state of the world** and those that are not.
      *   **"Settled" means:** The outcome is fixed by existing entities, structures, or processes *now*. No further deliberation, chance event, or free choice can alter it. The "truthmaker" is already in place.
      *   **Key Evidence:**
          *   **Fruit Machine:** The outcome is fixed by the internal mechanism *now*. Ignorance is irrelevant. **Truthmaker present.**
          *   **Eclipse:** The outcome is fixed by current positions + laws *now*. **Truthmaker present.**
          *   **Past Events:** Fixed by the past state. **Truthmaker present.**
          *   **Sea Battle/Coin Flip/Fortune Teller:** No current state *fixes* the outcome. Deliberation/chance/free choice is still open. **No truthmaker yet.**
          *   **Disjunction:** While neither disjunct is settled, the *logical space* encompassing both possibilities is fixed by the present (there *will* be a battle or there *won't*). The disjunction itself is settled *as true* by the present state of possibilities.
      *   **Why it's NOT just "nomic inevitability" (Laws + Present State Alone):** The Fruit Machine case is key. Its payout is fixed by its *internal mechanical state*, not by fundamental physical laws. The laws allow the machine to break, but its specific *configuration now* fixes the payout. Similarly, the eclipse *is* fixed by laws + present state. She distinguishes these cases (settled) from the coin flip (not settled by present state/laws).
      *   **Why it's NOT just "epistemic access" (whether we can know):** The Fruit Machine payout is true *even though we don't know and cannot know (without looking)*. Our ignorance is irrelevant. The fortune teller case emphasizes this – even perfect *epistemic certainty* doesn't make the future event settled *ontologically*.
      *   **Why it's NOT just "deliberation closed" (psychological fixity):** While Marta's mind is closed, the supervisor needs more. The Fruit Machine doesn't deliberate. The key is the *causal fixity in the present world state*, which *includes* Marta's fixed intention *and* its physical record.

  3.  **Closest Precedent:** The **Fruit Machine** is the strongest analog.
      *   **Similarities:** Outcome fixed by a specific, unchangeable internal state (Marta's intention/brain state + physical record / Machine's mechanism). Outcome inaccessible in principle before the event. Process involved objective chance *before* the state was fixed. Not settled by fundamental laws alone (psychological regularity / mechanical design). Ignorance is irrelevant.
      *   **Difference:** The fruit machine's mechanism is purely physical, Marta's involves psychology. However, the supervisor accepts psychological fixity as causally settling the future vote in the "battle raging now was true yesterday" precedent. The *existence of the physical record* strengthens the analogy to the fruit machine's mechanism.

  4.  **Tie-Breaker Questions to Split Potential Rules:**
      You need scenarios to distinguish **Causal Settledness by Present State** from **Nomic Determinism (Laws + Present State)** and **Epistemic Access**. Here are two powerful options:

      *   **Tie-Breaker 1: The Sealed Envelope & Indeterminate Brain (Targets Causal Settledness vs. Nomic Determinism)**
          *   **Scenario:** A scientist scans Alice's brain *while she is still deliberating* about a choice tomorrow. The scan shows the neural process is *truly indeterminate* at the quantum level - there is *no fact now* about which neural pathway will fire, leading to Choice A or B. However, the scientist immediately encodes the *current, indeterminate* neural state onto a sealed, tamper-proof device that will reveal *tomorrow* whether Alice chose A or B. *After* the scan, Alice continues deliberating; her choice is *not* fixed yet. Assume no law + present state determines the outcome.
          *   **Question:** Is the claim "Alice will choose A" true, false, or neither-true-nor-false *now*?
          *   **Predictions:**
              *   **Causal Settledness:** NEITHER TRUE NOR FALSE. The *outcome itself* is not fixed by the present state. The record only captures the *indeterminate state*, not the future outcome. The truthmaker for the future choice isn't present yet. (Like Sea Battle/Fortune Teller).
              *   **Nomic Determinism (Laws + State):** NEITHER TRUE NOR FALSE. By stipulation, laws + current state don't determine the outcome.
              *   **Epistemic Access/Record Existence:** TRUE (if A is encoded) or FALSE (if B is encoded), BUT WE CAN'T KNOW. The record exists now and will accurately report the future.
              *   **Supervisor's Likely Verdict:** NEITHER TRUE NOR FALSE. The record captures the *present indeterminacy*, not the future fact. This distinguishes her rule from one that prioritizes any existing record.

      *   **Tie-Breaker 2: Deterministic Brain, No Record (Targets Causal Settledness vs. Epistemic Access/Truthmaker)**
          *   **Scenario:** Ben has a *fully deterministic* brain (no quantum randomness). At time T, Ben finishes deliberating and forms a fixed, unchangeable intention to vote "Yes" tomorrow. This intention is encoded in a specific, stable brain state. *However, no external record is made (no note, no scan), and crucially, there is no possible way, even in principle, to access Ben's brain state or predict his vote before tomorrow.* The outcome is fixed causally by the present brain state, but it is utterly inaccessible epistemically.
          *   **Question:** Is the claim "Ben will vote Yes" true, false, or neither-true-nor-false *now*?
          *   **Predictions:**
              *   **Causal Settledness:** TRUE. The outcome is fixed by the present causal state (Ben's brain). Inaccessibility is irrelevant (like Fruit Machine).
              *   **Nomic Determinism (Laws + State):** TRUE. Fixed by deterministic laws + present state.
              *   **Epistemic Access / Truthmaker Presence:** NEITHER TRUE NOR FALSE. While the brain state exists, there is *no identifiable truthmaker accessible to language/users* that grounds the truth of the future-tensed claim *now*. The future fact is determined but not "present".
              *   **Supervisor's Likely Verdict:** TRUE. Her Fruit Machine precedent strongly suggests that causal fixity, not epistemic access or the form of the truthmaker (mechanical vs. neural), is the key. If the brain state *now* fixes the vote, it's true now.

  **Summary for Marta:**

  *   **Answer:** True (if she wrote yes) / False (if she wrote no).
  *   **Rule:** Causal Settledness by Present State (Is the outcome fixed by existing structures/entities/processes *now*?).
  *   **Closest Precedent:** The Fruit Machine (fixed internal state, inaccessible record).
  *   **Best Tie-Breakers:**
      1.  **Sealed Envelope & Indeterminate Brain:** Tests if a record of an *indeterminate* state makes the future claim determinate (her rule: No).
      2.  **Deterministic Brain, No Record:** Tests if causal fixity without *any* epistemic access or external truthmaker still makes the future claim true now (her rule: Yes).

  Present the **Sealed Envelope & Indeterminate Brain** case next. It directly challenges whether the *mere existence of a record* is sufficient, or if the record must reflect an outcome that is *already causally settled*. Her precedent suggests the latter, but this case makes the distinction explicit. Her answer (likely "neither true nor false") will confirm that her rule requires the *outcome itself* to be fixed now, not just a snapshot of an ongoing indeterminate process.
