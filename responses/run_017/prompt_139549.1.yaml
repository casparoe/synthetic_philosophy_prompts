answer: |-
  ### Adversarial Collaboration Document: Soft Evidence in Decision Theory

  #### 1. Shared Formalisms and Commitments  
  Both parties agree on the following:  

  1. **Core Formalism**:  
     - An agent's beliefs are represented by a probability distribution \(P\) over propositions.  
     - **Soft evidence** is any experience that shifts beliefs without setting any proposition to probability 1.  
     - **Rigidity**: For a partition \(\{E_i\}\) (mutually exclusive, exhaustive events), conditional probabilities \(P(A | E_i)\) remain unchanged post-update.  

  2. **Update Rules**:  
     - **Jeffrey Update (RP)**: Input is new marginals \(P_{\text{new}}(E_i)\). Output:  
       \[
       P_{\text{new}}(A) = \sum_i P_{\text{old}}(A | E_i) \cdot P_{\text{new}}(E_i).
       \]  
     - **Virtual Evidence (VE)**: Input is a likelihood function \(\lambda_i \propto P(V | E_i)\) for virtual event \(V\). Output:  
       \[
       P_{\text{new}}(A) \propto P_{\text{old}}(A) \cdot P(V | A).
       \]  

  3. **What Requires Explanation**:  
     - Both rules require exogenous input (marginals for RP, likelihoods for VE).  
     - Neither rule explains *why* rigidity holds or how inputs are generated.  
     - Standard arguments for hard conditioning (Dutch book, accuracy) do not directly extend to soft updates.  

  4. **Boundaries**:  
     - Both rules are deterministic given inputs.  
     - Neither rule resolves regress (e.g., "Why this partition?" or "Why these likelihoods?").  

  ---

  #### 2. Disagreements Table  
  Each row states a position in the side's own terms.  

  | Issue | Radical Probabilist (RP) | Virtual Evidence (VE) |
  |-------|--------------------------|------------------------|  
  | **1. Input from Experience** | Experience *directly* sets new marginal probabilities (e.g., "I feel \(P_{\text{new}}(E_i) = 0.8\)"). Likelihoods are derivative. | Experience provides *virtual events with likelihoods* (e.g., "I saw \(V\) with \(P(V \mid E_i) = k\)"). Marginals are derivative. |  
  | **2. Order-Dependence** | Order-dependence is rational: different update sequences reflect different experiences. Rigidity is always correct given the partition. | Order-dependence is a flaw: conditioning on virtual evidence is commutative. Jeffrey updates are arbitrary when partitions overlap. |  
  | **3. Effect on Priors** | Same input (new marginals) should lead to agreement on \(P_{\text{new}}(H)\) if priors on \(H\) differ but conditionals match. | Same input (likelihoods) should *not* lead to agreement: posteriors are prior-dependent, preserving disagreements. |  
  | **4. Rigidity in Practice** | Rigidity is normative: if \(P(A \mid E_i)\) changes post-update, the partition was ill-chosen (expand it!). | Rigidity is fragile: real evidence (e.g., classifier reports) often violates rigidity by revealing latent information. |  
  | **5. Basis for Legitimacy** | Updates are constrained by *minimal revision*: rigidity minimizes belief revision. Whims are valid if they respect rigidity. | Updates require *virtual events*: whims lack likelihoods, making them irrational. Only evidence encoded as events is normative. |  

  ---

  #### 3. Cruxes: Cases and Predictions  
  **Crux 1: Order-Dependence**  
  - **Case**:  
    Variables: \(H\) (hypothesis), \(E\) (evidence).  
    Prior: \(P(H, E) = 0.3\), \(P(H, \neg E) = 0.1\), \(P(\neg H, E) = 0.2\), \(P(\neg H, \neg E) = 0.4\).  
    Update 1: Set \(P_{\text{new}}(H) = 0.7\), then \(P_{\text{new}}(E) = 0.8\).  
    Update 2: Set \(P_{\text{new}}(E) = 0.8\), then \(P_{\text{new}}(H) = 0.7\).  
  - **RP Prediction**:  
    Order matters:  
    - Update 1: \(P(H \mid E) \approx 0.84\).  
    - Update 2: \(P(H \mid E) \approx 0.76\).  
    *Rationale: Different experiences (e.g., "boost \(H\) first" vs. "boost \(E\) first") justify different posteriors.*  
  - **VE Prediction**:  
    Order is irrelevant: Virtual evidence likelihoods yield identical \(P(H \mid E)\) for both sequences.  
    *Rationale: Conditioning is commutative; differences expose arbitrariness in Jeffrey's rule.*  

  **Crux 2: Portability of Evidence**  
  - **Case**:  
    Two agents:  
    - Alice: \(P_{\text{old}}(H) = 0.3\),  
    - Bob: \(P_{\text{old}}(H) = 0.6\).  
    Both share \(P(E \mid H) = 0.75\), \(P(E \mid \neg H) = 0.4\).  
    They receive "identical evidence": RP sets \(P_{\text{new}}(E) = 0.8\); VE sets \(\lambda_E : \lambda_{\neg E} = 4:1\) (so \(P(V \mid E) = 4k\), \(P(V \mid \neg E) = k\)).  
  - **RP Prediction**:  
    Both agents agree on \(P_{\text{new}}(H)\).  
    *Rationale: Same marginals + same conditionals → same posteriors.*  
  - **VE Prediction**:  
    Agents *disagree* on \(P_{\text{new}}(H)\) (Alice: lower, Bob: higher).  
    *Rationale: Likelihoods multiply priors; identical evidence ≠ identical posteriors.*  

  **Crux 3: Rigidity Failure (Classifier Case)**  
  - **Case**:  
    A classifier reports \(R\) for hypothesis \(H\).  
    Prior: \(P(H) = 0.4\), \(P(R \mid H) = 0.9\), \(P(R \mid \neg H) = 0.2\).  
    After seeing \(R\), we learn the classifier is miscalibrated: \(P(R \mid H)\) decreases to 0.6.  
  - **RP Response**:  
    Rigidity *must* hold: Expand the partition (e.g., add "calibration state") to preserve \(P(H \mid R, \text{calibration})\).  
    *Rationale: Failure implies an incomplete partition—experience always targets a partition.*  
  - **VE Response**:  
    Rigidity fails naturally: \(R\) updates both \(H\) and calibration. VE handles this by conditioning on \(R\) in a model including calibration.  
    *Rationale: Real evidence updates multiple beliefs; Jeffrey updates are brittle under model misspecification.*  

  **Crux 4: Whims vs. Evidence**  
  - **Case**:  
    An agent's credence in \(H\) rises from 0.3 to 0.7 due to a cheerful mood (no event \(V\) linked to \(H\)).  
  - **RP Position**:  
    Valid if rigidity holds (e.g., mood shifts \(P_{\text{new}}(E_i)\) for partition \(\{E_i\}\)).  
    *Rationale: Experiences need not be propositional; moods are inputs if they respect minimal revision.*  
  - **VE Position**:  
    Illegitimate: No \(V\) with likelihoods exists. Moods are biases, not evidence.  
    *Rationale: Normativity requires evidence structured as events; otherwise, updates are capricious.*  

  **Crux 5: Normative Vindication**  
  - **Case**:  
    An agent uses a non-rigid soft update (e.g., shifts \(P(H)\) without preserving \(P(A \mid H)\)).  
  - **RP Claim**:  
    Dutch books/accuracy arguments *generalize*: Jeffrey updates avoid dominance if rigidity holds.  
  - **VE Claim**:  
    No valid generalization: Only virtual evidence updates (conditioning) avoid Dutch books. Jeffrey has no such guarantee.  
  - **Shared Hole**:  
    Neither rule is vindicated for *inputs* (why these marginals/likelihoods?).  

  ---

  #### Residual Disagreements  
  - **Verbal Disputes**: None. "Evidence," "rigidity," and "experience" are defined operationally.  
  - **True Cruxes**:  
    - **Metaphysics**: Is experience propositional (VE) or do probabilities shift directly (RP)?  
    - **Normativity**: Must evidence be encodable as events (VE) or is minimal revision sufficient (RP)?  
    - **Revision vs. Conditioning**: RP prioritizes conservative belief revision; VE prioritizes commutative consistency.  

  The RP/VE divide reduces to: **Can experience be non-propositional?**  
  - RP: Yes (probabilities are mental states).  
  - VE: No (evidence requires likelihoods).  

