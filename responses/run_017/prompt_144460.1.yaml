prompt: |-
  I'm giving a 45-minute lunch-and-learn on the Condorcet jury theorem to about twenty machine-learning engineers at my company. It is on the agenda because several teams have started majority-voting across several LLMs and describe the result as the wisdom of crowds applied to models, and one of them has already built a slide with the theorem's curve on it. I want the session to land somewhere better than the claim that majority rule is justified: I want them to leave seeing the theorem as a result whose conclusion reverses when its inputs are weakened — that above-one-half competence is a per-voter requirement rather than an average, that conditional independence is doing the real work and is systematically violated by models trained on overlapping data, and that the whole thing goes silent when there is no fact of the matter to be right about, as with most of the safety judgments they actually vote on.

  Plan the explanation rather than giving it. I need the order the components must come in and what depends on what; the one example that should carry the session (I was going to use a three-person committee — tell me whether the model-ensemble case is better and why, and say what the example must have and what it must not have); the misconceptions this audience will bring or form, in the order they will surface, with the point in the sequence where each should be defused; one closing question that would show they had grasped the independence assumption rather than memorized the formula; and what I should openly refuse to cover in 45 minutes.

  Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is asking for help planning a 45-minute lunch-and-learn session on the Condorcet Jury Theorem for machine-learning engineers. They want to correct misconceptions about how teams are applying majority voting across LLMs, framed as "wisdom of crowds." The key points they want to cover are: that competence must be above 0.5 per voter, not on average; that conditional independence is critical and often violated by overlapping training data; and that the theorem doesn't apply to subjective judgments like safety issues.

  I need to structure this as a numbered list of exactly five items, with no intro or conclusion. Each item should be one or two sentences. The components must flow logically: start with the basics, build to key insights, and end with a closing question. For the example, I'm considering whether a three-person committee or a model-ensemble is better. The three-person case is simpler and avoids confusion with ML specifics, making it ideal for illustrating assumptions. The ensemble case might distract the audience with technicalities.

  The misconceptions will surface in sequence: first, that the theorem justifies majority voting without caveats; second, that competence can be averaged; third, that independence isn't crucial; and fourth, that it applies to non-factual domains. I need to defuse each at the right point: address the justification early, competence average when introducing individual p, independence when discussing violations, and non-factual when covering limitations.

  For the closing question, something that tests understanding of independence beyond rote learning, like asking what happens if models share data. And I should explicitly refuse to cover related topics like other voting systems to stay focused.

  Finally, I'll outline the plan: explain the theorem with the example, then challenge assumptions, cover competence and independence, discuss limitations with non-factual judgments, and end with the question. This keeps it tight and impactful.
answer: |-
  1.  Begin by explaining the standard Condorcet Jury Theorem (CJT) using the three-person committee example (not an ensemble) because it's mathematically simple, visually clear for plotting outcomes, and avoids immediate confusion with ML specifics; the example must have a binary factual question (e.g., "Is this number prime?") with voters having individual competence p > 0.5 and conditional independence given the truth.
  2.  Immediately after stating the theorem's conclusion (majority accuracy increases with group size), challenge the implied justification by highlighting the critical inputs: explicitly state that p > 0.5 must hold *per voter*, not on average, and that conditional independence (voters' errors are uncorrelated *given the true answer*) is the foundational assumption doing the heavy lifting for the convergence result.
  3.  Systematically dismantle the assumptions: first, show how an average p > 0.5 can mask disastrously incompetent voters (defusing misconception 1: "average competence suffices"), then demonstrate how correlated errors (e.g., voters seeing the same misleading evidence) rapidly degrade majority accuracy even with high individual p (defusing misconception 2: "independence isn't that important" which surfaces here), explicitly linking this to models trained on overlapping data.
  4.  Address the "no fact of the matter" limitation: explain that the theorem is silent and majority voting loses its epistemic justification when there's no objective truth (e.g., most LLM safety judgments), as correctness becomes undefined; this defuses misconception 3 ("CJT applies to any vote") that arises when applying it to subjective domains.
  5.  Conclude by refusing to cover alternative voting systems or detailed correlation mitigation strategies, and pose the closing question: "If two LLMs in your ensemble were fine-tuned on identical, biased safety data, how does this violate the CJT's independence assumption, and what might happen to the 'wisdom' of their majority vote?" to assess understanding of conditional correlation.
