prompt: |-
  I'm rewriting my third-year Kant sessions for next term (we're on Groundwork II, the universalizability stretch), and I've relised I don't actually have a spec for what I want out of a reading of the test before I go pick one to teach. So help me build the spec.

  Purpose first, so adequacy has something to be relative to: I want a version of the test that a student can apply to a maxim they wrote down themselves, in a few minutes, without already knowing the answer — and that returns Kant's own verdicts on the four stock examples (suicide from self-love, the lying promise, the unused talents, the man who walks past the sufferer). Anything that only works if a philosophically trained person reverse-engineers the description is out.

  Here's the part I most want. Below is a battery of maxims I made up because my seminar kept breaking on them. Any adequate reading has to return a verdict on each, and the verdicts have to come from the reading and not from me nudging the description:

  1. As a referee, I'll take money to favour one side. (Is the maxim indexed to a role or office? Universalise over everyone, or over office-holders?)
  2. I'll lie whenver I'm in a city I'm only passing through. (Class indexed by place, not person.)
  3. I'll break a promise when I feel like it. (Class indexed to the agent's occurrent desire.)
  4. When the queue is longer than six people, I'll cut in. (The universalised world falls apart only above a certain occupancy level — so the verdict seems to move with population size, or with whether there's a ticketing system, or with whether everyone else is queueing.)
  5. I'll get ahead by taking credit for colleagues' work. (Universalised, the end — credit — becomes unachievable, but not because the maxim is incoherent.)
  6. As the only person who knows where the archive key is, I'll deny anyone else access. (Universalisation over a class of one: vacuous permission, or no verdict at all?)
  7. I'll let people sort out their own problems. (An omission, not an act; and nature plainly subsists under it.)
  8. I'll lie to myself about why I did it. (Self-directed; universalisation ranges over one agent's own future states.)
  9. I'll fiddle my taxes, but only if most others already do. (Compliance conditional on others' non-compliance.)
  10. I'll help people when it suits me and not otherwise. (A permissive maxim: not "do," not "don't," but "either.")

  For each requirement you state, give me the case from that battery (or one of your own) that motivates it, and tell me which requirements are non-negotiable and which are just what one family of readings wants. Things I think belong somewhere on the list, but you order them and you can throw any of them out: that the reading say what a maxim is and how finely it gets individuated; that it distinguish failing in conception from failing in the will from merely being unwise or unstable; that it say whether the verdict attaches to the maxim, to the action, or to the world the maxim would make; that it handle omissions and maxims of pure indifference; that it explain where the extra premise comes from if the law-of-nature clause is doing the work on case 7; that it tell us whether verdicts are allowed to shift with background empirical facts (case 4); that it be usable first-personally, in the moment, by someone who doesn't know the outcome; and that it not let you gerrymander the verdict by re-describing.

  Two things I especially want. First: is there a pair on your list that can't be jointly satisfied? My candidate is that the verdict has to be insensitive to how finely you describe the maxim, and yet you mustn't be able to get any verdict you like by choosing the description — coarse enough to avoid false negatives, fine enough to avoid false positives. If that pair really is unsatisfiable, say so and tell me which half to keep and what to put in place of the other. Second: which single requirement excludes the most readings?

  Then, briefly — a few lines, not an essay — score the four families I keep circling: the logical/semantic-contradiction reading; the practical-contradiction reading on which the maxim's own end can't be achieved in the universalised world; the law-of-nature reading that leans on a premise about what ends a rational will (or a natural organism) must have; and the reading on which the test is about whether you could will your maxim as a law for a community of rational agents. No names needed, no bibliography, and please don't just walk me through the four stock examples again — I've taught those to death. It's the spec I'm after.
reasoning: |-
  Okay, the user is a philosophy professor preparing to teach Kant's Groundwork II, specifically the universalizability test. They're frustrated with standard readings because students keep getting stuck on edge cases. Their core need is a pedagogical tool—a version of the test that undergrads can apply *themselves* to any maxim in minutes, yielding Kant’s verdicts on the four classic examples while handling tricky maxims like those in their battery.

  Hmm, their battery is devilishly clever. Each case isolates a different ambiguity in standard formulations: role-indexing (#1), geographic scope (#2), desire-dependence (#3), threshold effects (#4), self-defeating ends (#5), singleton universes (#6), omissions (#7), reflexive deception (#8), conditional compliance (#9), and permissive maxims (#10). The real pain point seems to be that existing readings either require philosophical training to "reverse-engineer" or collapse when students invent maxims like these.

  Ah, their two big asks resonate: (1) Can we avoid gerrymandering maxim descriptions without oversimplifying? (Practical contradiction readings often fail here—e.g., #5’s "get ahead" fails universally but "get ahead *in corrupt systems*" might pass). (2) Which requirement filters out the most readings? Probably *role/context indexing* (#1, #6) since most interpretations assume agents are interchangeable.

  For the four families:
  - Logical contradiction: Dies immediately on #4 (queues) and #9 (tax fiddling)—no formal inconsistency.
  - Practical contradiction: Handles Kant’s lies/promises but fails #5 (credit-taking) and #7 (omissions)—ends aren’t undermined.
  - Law-of-nature: Might save #7 with "rational agents must help" but imports contested premises.
  - Kingdom-of-Ends: Best for #10 (permissive maxims) but vaguest for students.

  The irreconcilable tension? *Maxim specificity*. Coarse descriptions cause false negatives (#3 "break promise when I feel like it" universalizes fine if phrased generically); fine descriptions cause false positives (#1 "referee bribes" seems universalizable if narrowed to "referees in 2024 World Cup"). I’d sacrifice insensitivity-to-description—tell students to bracket roles/contexts unless essential to the act-type—and add a "normal description" rule.

  Non-negotiables: 
  - Verdict must come from applying the test, not outside knowledge (rules out readings needing teleology for #7). 
  - Must handle omissions (#7) and conditional maxims (#9). 
  - First-person usability—no reverse-engineering.

  What I’d prioritize pedagogically: Kingdom-of-Ends reading plus a flowchart. Students imagine a world where everyone *publicly* adopts their maxim—then ask: (1) Would the act-type still work? (2) Could I rationally participate? This catches #1 (bribery destroys trust in refereeing), #5 (credit-taking collapses collaboration), and #10 (permitting non-help makes mutual aid impossible). Still messy for #6 (singleton) and #8 (self-deception), but workable.
answer: |-
  Here's a spec built around your battery, prioritizing pedagogical usability and Kant-consistency. Non-negotiables are starred (\*), others reflect common interpretive tensions.

  ### Core Requirements (Non-Negotiables)
  1.  \***Maxim Definition**: Must clearly state a maxim is a *subjective principle of action* combining **act-type + context/reason**. (Motivation: All cases, especially #1, #2, #3, #6 — avoids vacuity or universalizing the wrong thing.)
  2.  \***Test Output**: Must yield a binary (permissible/impermissible) verdict *on the maxim itself* based solely on universalization, *not* consequences. (Motivation: Avoids importing external moral knowledge; core to Kant's project. Handles #5, #7.)
  3.  \***First-Person Applicability**: A student must apply it *to their own written maxim* in minutes without knowing the answer. (Motivation: Pedagogical core; excludes reverse-engineered readings.)
  4.  \***Handles Omissions & Permissions**: Must generate verdicts for maxims of non-action (#7) and permissive maxims ("I may..." #10). (Motivation: #7 & #10; Kant includes duties to act.)
  5.  \***Verdict Stability**: The verdict must be *insensitive to empirical contingencies* like population size or others' actions. (Motivation: #4, #9 — Kantian morality is a priori; verdicts can't shift with facts.)

  ### Key Tensions & Clarifications
  6.  **Maxim Specificity vs. Gerrymandering Resistance**: (Your candidate tension). *This pair is unsatisfiable as stated.* **Keep: Resistance to gerrymandering.** Replace "insensitivity to description" with: **"Requires a principled rule for *normal* maxim description."** (e.g., "Include only the agent's reason and essential context, excluding spurious detail or self-exemption.") Motivation: #1 (role is essential), #2 (place might be spurious), #3 (desire is essential), #4 (queue length is spurious contingency). *This requirement excludes the most readings* – many rely on unspecified "salience."
  7.  **Failure Mode Distinction**: Should distinguish *Contradiction in Conception* (CC - strict duty) vs. *Contradiction in the Will* (CW - wide duty), though CW may be pedagogically deferred initially. (Motivation: Kant's distinction, crucial for #5, #7, #10).
  8.  **Source of "Impossibility"**: Must clarify *why* the universalized maxim fails. Does it produce logical inconsistency? Practical impossibility? Conflicts with necessary rational/natural ends? (Motivation: Differentiates families; needed for #5, #7.)
  9.  **"World" of Universalization**: Verdict depends on whether we conceive a world where the maxim is *a law of nature* (adding causal necessity) or simply *a universal law* (adopted by all). (Motivation: Impacts #4, #7, #9. Law of Nature often imports the extra premise for #7).

  ### Requirement Prioritization
  1.  Maxim Definition (\*)
  2.  Test Output (\*)
  3.  First-Person Applicability (\*)
  4.  Handles Omissions/Permissions (\*)
  5.  Verdict Stability (\*)
  6.  Gerrymandering Resistance (via principled description rule)
  7.  Failure Mode Distinction (CC/CW)
  8.  Source of Impossibility
  9.  World of Universalization (Law vs. Law of Nature)

  ### Scoring the Four Families (vs. Spec)
  *   **Logical/Semantic Contradiction:** Fails. Can't handle most battery cases (#4, #5, #7, #9, #10). Verdicts often gerrymanderable. Poor on omissions/permissions. Excluded by Requirements 5, 6, 7, 8.
  *   **Practical Contradiction (End Undermined):** Mixed. Handles Kant's lies/promises & #5 well. Struggles severely with omissions (#7 - no end?), permissions (#10), and maxims without clear external end (#3, #6, #8). Vulnerable to gerrymandering (#1, #2, #4). Fails Requirements 4, 6, partly 8.
  *   **Law of Nature + Rational/Natural Ends:** Strongest contender. *Can* handle all battery cases *if* the "necessary ends" premise is robust (e.g., rational agents *must* will preservation, help, talent development). Explains #7 (failing in will). Resists gerrymandering better with principled description. Risk: The "necessary ends" premise needs unpacking (Requirement 8). Best on Requirements 4, 5, 7, 8.
  *   **Kingdom of Ends (Willing Membership):** Pedagogically intuitive. Handles permissions (#10) and role-duties (#1) well. Explains #5, #7. Risk: Vagueness on *why* you couldn't will membership (collapses into other readings). Can handle Requirement 6 with care. Good on 1, 2, 3, 4, 10. Needs work on 5 (stability) and 8 (source).

  **Recommendation:** Prioritize the **Law of Nature + Rational Ends** reading *or* a **Kingdom of Ends** reading, coupled *explicitly* with your "principled rule for normal maxim description" to combat gerrymandering. Both offer the best chance of handling the battery consistently with Kant's core aims and your pedagogical needs. The Law of Nature reading has a slight edge in theoretical robustness for the battery, while Kingdom of Ends may be more accessible. Ditch Logical Contradiction. Practical Contradiction is too limited.
