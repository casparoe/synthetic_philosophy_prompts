  We are constructing a take-home exam question for a Master's-level rational choice course. The question involves two decision-theoretic cases: Counterfactual Mugging and XOR Blackmail. The student must analyze these cases using three approaches:

  1. Causal Decision Theory (CDT): Intervene on your own action and ask what would causally follow.
  2. Evidential Decision Theory (EDT): Condition on your action and ask what it tells you.
  3. Functional Decision Theory (FDT) or the "third approach": Ask what would follow if your decision procedure returned this output, holding fixed whatever else in the situation depends on that procedure.

  The cases are described with explicit numbers.

  We are to provide:
  A. The exam question (self-contained, in American English).
  B. A model answer (about 800 words, with arithmetic).
  C. A marking scheme (25 marks, with must-hit points, and notes on common errors).

  Let's break down the cases as described:

  **Case 1: Counterfactual Mugging**
  - A fair coin is flipped. 
  - Predictor simulates you beforehand.
  - If coin = heads: You are asked to hand over $1,000 and receive nothing.
  - If coin = tails: You are never approached. But you receive $1,000,000 iff the predictor predicted you would have paid had the coin been heads.
  - Actual outcome: Coin landed heads, and you are being asked for $1,000.

  **Case 2: XOR Blackmail**
  - Your house is worth $1,000,000 to you.
  - Natural flood occurs with probability p = 1/100, independently.
  - Blackmailer has a predictor of your deliberative dispositions.
  - The blackmailer sends a letter demanding $1,000 and threatening to destroy the house (which he can do at no cost) if you refuse.
  - Letter is posted iff exactly one of the following is true:
     (a) You would pay if the letter arrived.
     (b) The natural flood occurs.
  - Actual outcome: The letter has arrived.

  We are to design three parts:

  **Part 1:** For each case, what does each of the three approaches recommend? Write out expected values.

  **Part 2:** Explain why the third approach (FDT) recommends paying in Case 1 and refusing in Case 2, and why that is not a contradiction. Also, diagnose the argument that the two cases are formally identical and thus must have the same answer.

  **Part 3:** Introduce a variant: the predictor's prediction of your action is correct with probability q (independently), but the flood prediction remains perfect (i.e., the predictor always knows whether the flood occurs). Also, p (probability of flood) is negligible (so we can set p=0 for simplicity in calculations?). Then:
     a. Derive the threshold for q in each case such that FDT's recommendation survives (i.e., for Case 1: paying is still recommended; for Case 2: refusing is still recommended).
     b. Comment on the asymmetry (if any) and what it shows (for or against FDT? or the examples as evidence?) and what further information is needed.

  Now, we write the exam question.

  **Exam Question:**

  **Question 1 (25 marks):**

  This question concerns two decision-theoretic cases. You must analyze them using three approaches:

  - Approach A (Causal): Intervene on your own action and ask what would causally follow.
  - Approach B (Evidential): Condition on your action and ask what it tells you.
  - Approach C (Functional): Ask what would follow if your decision procedure returned this output, holding fixed whatever else in the situation depends on that procedure.

  **Case 1: Counterfactual Mugging**

  A fair coin is flipped. Before the flip, a predictor simulates you to predict what you would do if the coin landed heads and you were asked for money. The coin flip happens:

  - If the coin lands heads, you are asked to hand over $1,000. If you pay, you get nothing in return. If you refuse, you keep your $1,000.
  - If the coin lands tails, you are never approached. However, you receive $1,000,000 if and only if the predictor predicted that you would have paid had the coin been heads.

  The coin has in fact landed heads, and you are being asked to hand over $1,000.

  **Case 2: XOR Blackmail**

  Your house is worth $1,000,000 to you. With probability p = 1/100, independently, a natural flood will destroy the house. A blackmailer, who has a predictor of your deliberative dispositions, may send you a letter. The letter demands $1,000 and threatens to destroy your house (at no cost to the blackmailer) if you refuse to pay. The letter is posted if and only if exactly one of the following is true:

  (A) You would pay if the letter arrived.
  (B) The natural flood occurs.

  The letter has arrived.

  **Part 1 (8 marks):** For each case and each approach (A, B, C), state what action (pay or refuse) the approach recommends and show the expected values that lead to that recommendation. Write the expected values explicitly; do not merely assert them.

  **Part 2 (8 marks):** Approach C (functional) recommends paying in Case 1 and refusing in Case 2. Explain why this is not a contradiction. Then, consider the argument that the two cases are formally identical up to a relabeling of variables, so that any coherent decision theory must give the same recommendation in both. Diagnose why this argument fails.

  **Part 3 (9 marks):** Now consider a variant of both cases. In this variant, the predictor's prediction of what you would do is correct with probability q (independently of everything else). However, the predictor's prediction about the natural flood (in Case 2) remains perfect. Also, assume that the probability of a natural flood (p) is negligible (so you may set p=0 for calculation purposes). 

  a. Derive the minimum value of q (the predictor's reliability) for which Approach C's recommendation in Case 1 (to pay) still holds. Similarly, derive the minimum value of q for which Approach C's recommendation in Case 2 (to refuse) still holds. Show your work.

  b. If these thresholds are different, what does the asymmetry show? Does it tell in favor of Approach C or against these examples as evidence? What further information would one need in order to decide?

  ---

  **Model Answer (Approximately 800 words, in American English):**

  **Model Answer for Question 1**

  **Part 1: Recommendations and Expected Values**

  **Case 1: Counterfactual Mugging**

  *Approach A (Causal): Intervene on action.*
  We intervene on the action (pay or refuse) and see the causal consequences. Since the coin is already heads, the predictor's prediction is already fixed. Paying causes a loss of $1,000. Refusing causes no loss. The outcome in the tails world is fixed and does not depend causally on the action in the heads world. Therefore:
  - Pay: utility = -$1,000
  - Refuse: utility = $0
  So Approach A recommends refusing.

  *Approach B (Evidential): Condition on action.*
  We condition on the action to see what it indicates about the predictor's prediction. Note that the predictor's prediction is about what you do in the heads scenario, and we are in the heads scenario. If we condition on paying, that means the predictor likely predicted payment. If we condition on refusing, the predictor likely predicted refusal. Since the coin is fair, we consider both worlds (heads and tails) but condition on the action in the heads world.

  If you pay:
  - In the heads world: you lose $1,000.
  - In the tails world: since the predictor predicted payment (because we are conditioning on payment in heads), you get $1,000,000.

  The probability of heads or tails is 1/2. So expected utility of paying:
  (1/2) * (-1000) + (1/2) * (1000000) = 499,500

  If you refuse:
  - Heads world: $0
  - Tails world: $0 (because predictor predicted refusal, so you don't get the million)

  Expected utility of refusing:
  (1/2)*0 + (1/2)*0 = 0

  Thus, Approach B recommends paying.

  *Approach C (Functional): Consider the output of the decision procedure.*
  We hold fixed the function that maps the decision problem to an action. The predictor has already simulated this function and set the outcome in the tails world accordingly. If your decision function outputs "pay" in the heads scenario, then in the tails world you get $1,000,000. If it outputs "refuse", then in tails you get $0. In the heads world, if you pay you lose $1,000, if refuse you get $0.

  So if the decision function outputs "pay":
  - Heads: -1000
  - Tails: +1000000
  Expected utility: (1/2)*(-1000) + (1/2)*(1000000) = 499,500

  If it outputs "refuse":
  - Heads: 0
  - Tails: 0
  Expected utility: 0

  Therefore, Approach C recommends paying.

  **Case 2: XOR Blackmail**

  *Approach A (Causal): Intervene on action.*
  The natural flood occurs with probability p=0.01, independently. The blackmailer's action (destroying the house) is caused only by your refusal, but note that the letter's arrival is also affected by the flood and your disposition. However, when we intervene on paying or refusing, we set the action and see what follows causally.

  Intervening on paying: You lose $1,000. The house may still be destroyed by the natural flood (with probability 0.01). So the expected utility is:
  - If no flood: you have your house minus $1,000 -> 1,000,000 - 1,000 = 999,000
  - If flood: you have no house and lose $1,000 -> -1,000
  Expected utility: (0.99)*(999,000) + (0.01)*(-1,000) = 989,010 - 10 = 989,000

