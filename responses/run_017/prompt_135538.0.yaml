  ### Exam Question

  **Question 1 (25 marks):**  
  This question concerns two decision-theoretic cases analyzed using three approaches:  

  - **Approach A (Causal):** Intervene on your own action and ask what would causally follow.  
  - **Approach B (Evidential):** Condition on your action and ask what it tells you.  
  - **Approach C (Functional):** Ask what would follow if your decision procedure returned this output, holding fixed whatever else in the situation depends on that procedure.  

  **Case 1: Counterfactual Mugging**  
  A fair coin is flipped. Before the flip, a predictor simulates you to predict what you would do if the coin landed heads and you were asked for money. The coin flip happens:  
  - If heads, you are asked to hand over $1,000. If you pay, you receive nothing. If you refuse, you keep your $1,000.  
  - If tails, you are never approached. You receive $1,000,000 if and only if the predictor predicted you would have paid if the coin landed heads.  
  The coin has landed heads, and you are being asked to hand over $1,000.  

  **Case 2: XOR Blackmail**  
  Your house is worth $1,000,000 to you. A natural flood occurs with probability \( p = 1/100 \), independently of your actions. A blackmailer, with a predictor of your deliberative dispositions, may send a letter demanding $1,000 and threatening to destroy your house (at no cost) if you refuse. The letter is posted if and only if exactly one of these is true: (A) you would pay if the letter arrived, or (B) the natural flood occurs. The letter has arrived.  

  **Part 1 (8 marks):**  
  For each case (Case 1 and Case 2), state what action (pay or refuse) each approach (A, B, C) recommends. For each recommendation, explicitly write out the expected values that justify it.  

  **Part 2 (8 marks):**  
  Approach C recommends paying in Case 1 and refusing in Case 2. Explain why this is not a contradiction. Then, diagnose why the argument that the two cases are formally identical (up to relabeling variables) fails.  

  **Part 3 (9 marks):**  
  Now consider a variant: The predictor’s prediction of your action is correct with probability \( q \) (independently), but its flood prediction (in Case 2) remains perfect. Assume \( p \) (flood probability) is negligible (set \( p = 0 \) for calculations).  
  - **(a)** Derive the minimum \( q \) for which Approach C’s recommendation in Case 1 (to pay) still holds. Similarly, derive the minimum \( q \) for which Approach C’s recommendation in Case 2 (to refuse) still holds. Show your work.  
  - **(b)** If the thresholds from (a) differ, what does the asymmetry show? Does it favor Approach C or undermine the cases as evidence? What further information is needed to decide?  

