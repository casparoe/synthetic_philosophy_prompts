  - Refuse: 1,000

  Thus, Approach B recommends paying.

  *Approach C (Functional): Consider the output of the decision procedure.*
  We hold fixed the decision function. The blackmailer's predictor knows your decision function. The letter is sent iff exactly one of (A) your decision function outputs "pay" upon receiving the letter and (B) the natural flood occurs.

  We consider two possible outputs of the decision function: pay and refuse.

