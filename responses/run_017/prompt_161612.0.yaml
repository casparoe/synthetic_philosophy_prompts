prompt: |-
  I am a political philosopher who has, rather to my surprise, been seconded as a philosophical consultant to a provincial Reparations Review Board, and I have been asked to draft the reasoning for its next decision. I would be grateful for your help thinking it through. The Board's enabling statute says only that it may award "such remedy as is apt" in respect of "officially sanctioned injustice"; everything else is precedent, and my colleagues care a great deal about coherence with what the Board has already done. A colleague in the law school assures me that our second decision below settles the new case; I am not so sure, since the new case involves an identifiable asset and a beneficiary institution that is not the successor to the wrongdoer. Our track record, compressed:

  1. A provincially authorized compulsory sterilization program (1954–1972): per capita awards to living survivors; claims by their adult children dismissed, on the ground that "the injury was done to a person, and the claim does not outlive her."
  2. An 1879 cession signed under duress, the land still held by the province as a reserve: a perpetual annuity to the descendant community's council, sized by an assessment of the community's present condition rather than by the land's 1879 value; individual descendants' claims for shares dismissed, on the ground that "the injury was done to a people, and a people's claim is not a sum of persons' claims."
  3. A 1961 urban-renewal demolition of a neighborhood, the land now a privately owned commercial complex, most original owners dead: a single lump sum to a community trust sized by the value of what the original owners lost; a claim by the present residents of the replacement neighborhood dismissed, although they are disadvantaged and although few are descended from the displaced.
  4. Descendants of workers injured by a private company dissolved in 1931 with its assets dispersed and its shareholders long dead: dismissed, "the Board can find no present holder of the advantage."
  5. A school district underfunded under a segregation-era statutory formula, 1920–1968: awarded, over the province's objection that subsequent equalization grants had already made the loss good; the Board held that "a benefit a claimant receives as a citizen does not discharge a claim for a wrong, and discharge requires a remedy the claimant is free to refuse."

  The new case: in 1871 the province seized twelve thousand hectares under a treaty the Board has already found to have been signed under duress, and in 1874 granted that land by statute to a newly chartered college as its founding endowment. The college never took part in the seizure, but its charter recites the grant and its first treasurer recorded how the land was obtained; it is a legal person distinct from the province, and no one now associated with it had any part in the events. The land is today leased to a commercial developer and its rents supply roughly seven per cent of the college's operating budget. The claimant community is among the most disadvantaged groups in the province on every official index, has a council the province recognizes, was relocated twice after 1871, and now occupies territory assigned to it by the province; about fourteen per cent of the college's undergraduates are its members, and the college funds a liaison office and scholarships earmarked for them. It asks for three things: return of a forty-hectare parcel, within the original grant, that contains a burial ground still in use; a perpetual annuity to a council-controlled trust; and per capita payments to the roughly nine hundred living persons who can document descent from the 1871 signatories. The college resists with four arguments: that no present member of the community is worse off than she would otherwise have been, since but for the seizure her ancestors would not have met and she would not exist, so the annuity has no measure; that circumstances have changed so much that the claim has lapsed; that the scholarships and the liaison office have already discharged it; and that it is a beneficiary of the grant rather than the successor to the wrongdoer. The council, for its part, has said it will accept the parcel and the annuity, will refuse any one-time payment, and regards per capita payments as divisive.

  What I need from you is this. Set out the two or three rules about who may hold a claim, against whom it may be held, how it is measured, and what discharges it, that fit all five precedents about equally well, and say what each predicts about the parcel, the annuity, and the per capita payments. Then give me your recommendation for what the Board should decide if it wants to be consistent with itself, identify which precedent is the closest analog and why, and say plainly what principle the Board would be adopting under each of the main alternatives — including what it would be committed to about whether an unbroken institutional identity matters when the institution is a mere beneficiary, whether a remedy the claimant refuses can still discharge a claim, and whether the ancestors'-non-identity argument has any force given that the Board has twice awarded relief without any counterfactual comparison of persons. Finally, tell me which single further case the Board should take next in order to separate the rules you have identified, since I would rather find out now which of them we are really running.
reasoning: |-
  Hmm, the user is a political philosopher consulting for a Reparations Review Board, needing help drafting a decision that fits with precedent. They've provided five past cases and a new case involving land seized from an Indigenous community and granted to a college. The college still benefits from this land today. The claimant wants the burial ground back, an annuity, and per capita payments. The college has several defenses, including the non-identity problem.

  First, I need to extract consistent rules from the precedents. Looking at Case 1: sterilization program. Awards went to living survivors only, not descendants. Injury is personal and doesn't outlive the victim. So, claims die with the individual.

  Case 2: land cession under duress. Perpetual annuity to the community council, not individuals. Injury to the group, so remedy goes to the group, measured by present need, not historical value. Group claims aren't just the sum of individual claims.

  Case 3: urban renewal demolition. Lump sum to a community trust based on historical loss, not to current residents. Focus on compensating what was lost, even if recipients aren't direct descendants. The community trust represents the original owners' legacy.

  Case 4: injured workers, but company dissolved. Claim dismissed because no present holder of advantage. Need a current beneficiary of the injustice to hold liable.

  Case 5: underfunded school district. Award despite later equalization. Remedies must be specific to the wrong and refusable; general benefits don't count as discharge.

  From these, three rules emerge. First, claims can be held by the direct victims or their identifiable community group (Cases 1, 2, 3). Second, claims are against current holders of the advantage from the injustice (Cases 2, 3, 4, 5). Third, remedies must be specific and refusable; they can't be forced as already fulfilled by unrelated benefits (Case 5).

  Now, applying to the new case. The burial ground parcel: it's an identifiable asset, so likely returnable per Case 3's logic. The annuity: similar to Case 2, as a group injury with ongoing benefit to the college. Per capita payments might be dismissed since injury was to the group, not individuals (Case 2). Also, the college's scholarships aren't a discharge because they're not refusable and not specific to the wrong (Case 5). The non-identity argument probably fails because the Board didn't use counterfactuals in past cases (Cases 1, 2, 3).

  The closest precedent is Case 2: both involve land taken under duress, ongoing institutional benefit, and group injury. The college isn't the wrongdoer but holds the advantage, which fits Case 4's requirement. The principle here is that benefiting from past injustice creates liability, regardless of direct wrongdoing.

  For future cases, one testing whether a reformed institution still holds liability if the advantage is gone. Like if the college sold the land and used funds for scholarships. That would clarify if liability is tied to the asset or the institution's status.

  The user's deeper needs: they want consistency in the Board's philosophy, avoiding arbitrary decisions. They might also be concerned about setting precedents for similar cases, especially with Indigenous claims. The unspoken need is establishing a principled approach that balances historical justice with practical feasibility, ensuring the Board's legitimacy.
answer: |-
  Based on the precedents, I identify three core rules governing claims, liability, measurement, and discharge. These rules cohere with all five precedents, though they pull in slightly different directions in the new case. Below is an analysis of the rules, their application to the new case, a recommended decision, and a strategic path forward.

  ---

  ### **Three Rules Extracted from Precedents**
  1. **Rule of Claimant Identity**:  
     - *Who holds the claim?* **Claims are held by the direct victims of injustice OR by their identifiable, continuous community group if the injury was collective.**  
     - *Supporting Precedents*:  
       - Case 1: Individuals hold claims for personal injury (children dismissed).  
       - Case 2: The community ("a people") holds claims for collective injury (individuals dismissed).  
       - Case 3: The displaced community (via a trust) holds the claim, not current residents.  
       - Case 5: The institution (school district) holds the claim for systemic underfunding.  

  2. **Rule of Liability & Advantage**:  
     - *Against whom is the claim held?* **Liability attaches to the current holder of an identifiable advantage traceable to the injustice.**  
     - *Supporting Precedents*:  
       - Case 2: Province (current landholder) liable for land cession.  
       - Case 3: Commercial complex owner liable for land value (advantage traceable).  
       - Case 4: Claim dismissed because no current holder of advantage exists.  
       - Case 5: Province liable despite later equalization (advantage in past savings).  

  3. **Rule of Remedy & Discharge**:  
     - *Measurement/Discharge*: **Remedies must be (a) specific to the injustice, (b) refusable, and (c) measured by historical loss OR present need if collective harm persists. General benefits do not discharge specific claims.**  
     - *Supporting Precedents*:  
       - Case 2: Annuity measured by present need (not 1879 value).  
       - Case 3: Lump sum measured by historical loss (original owners’ loss).  
       - Case 5: Later grants do not discharge claim (not specific/refusable).  
       - Case 1: Per capita awards to survivors (specific/refusable).  

  ---

  ### **Application to the New Case**  
  | **Remedy Requested** | **Rule 1 (Claimant)**          | **Rule 2 (Liability)**           | **Rule 3 (Remedy/Discharge)**     | **Prediction**                     |  
  |----------------------|--------------------------------|----------------------------------|-----------------------------------|------------------------------------|  
  | **40-hectare parcel** | Claimant community qualifies (collective injury, continuous council). | College holds asset traceable to injustice (statutory grant under duress). | Asset return is specific to injustice (burial ground has symbolic/historical weight). | **Awarded** (like Case 3’s land compensation). |  
  | **Perpetual annuity** | Community council (Case 2 analog). | College benefits from rents (ongoing advantage). | Measured by present need (Case 2), not historical value. Scholarships/liaison office are general benefits, not specific/refusable (Case 5). | **Awarded** (size based on community’s disadvantage, not land value). |  
  | **Per capita payments** | Living descendants ≠ direct victims (Case 1, Case 2 reject individual claims for collective harm). | N/A (claim fails on Rule 1). | Council refuses; remedy must be refusable (Case 5). | **Dismissed** (inconsistent with Case 2’s "people’s claim" logic). |  

  ---

  ### **Recommendation for Consistent Decision**  
  - **Award**:  
    1. **Return of the 40-hectare parcel** to the claimant community.  
    2. **A perpetual annuity** to the council-controlled trust, sized by the community’s present disadvantage (e.g., using provincial indices).  
  - **Dismiss**:  
    - Per capita payments to descendants.  
    - All other claims (e.g., demands beyond the burial ground).  

  **Closest Analog**: **Case 2** (1879 land cession). Both involve:  
  - Land taken under duress from a recognized community.  
  - Ongoing institutional benefit (province vs. college).  
  - Collective injury requiring group-based remedy (annuity).  
  - Dismissal of individual claims.  

  **Principle Adopted**:  
  > **"A beneficiary institution holding traceable advantage from collective injustice owes a remedy to the continuous claimant community, measured by present need and specific to the harm, regardless of direct wrongdoing or elapsed time. Discharge requires the claimant’s acceptance."**  

  #### Key Commitments:  
  1. **Unbroken institutional identity?** Not required. Liability flows from *holding the advantage*, not being the wrongdoer (Case 3 held a private owner liable; Case 4 dismissed for no advantage-holder). The college is liable as beneficiary.  
  2. **Refusal of remedy?** A remedy cannot discharge a claim if refused (Case 5). The council’s rejection of per capita payments voids them. Scholarships/liaison office fail as discharge: they are not specific to the land seizure (e.g., scholarships aid individuals, not the collective) and are not refusable (Case 5).  
  3. **Non-identity argument?** No force. The Board has **never** required counterfactual person-comparisons (Case 1 awarded to survivors without asking if sterilization altered life paths; Case 2/3 awarded for harm to ancestors). The claim is for *present disadvantage from historical injustice*, not hypothetical existence (college’s argument rejected).  

  ---

  ### **Next Case to Separate the Rules**  
  To test tensions between Rules 1–3, the Board should prioritize:  
  > **A case where an institution that benefited from injustice no longer holds the advantage, but the claimant community persists.**  

  - *Example*: "In 1890, Province seized timberlands from Community X and sold them to Company Y. Company Y harvested the timber by 1910, dissolved, and distributed profits to shareholders (now deceased). The land is now a protected forest owned by the federal Crown. Community X seeks reparations from the Province."  
  - *Why this tests the rules*:  
    - **Rule 1** supports Community X’s claim (collective injury).  
    - **Rule 2** questions liability: Is the Province (wrongdoer) liable without current advantage? Or the Crown (advantage-holder) as beneficiary?  
    - **Rule 3** challenges measurement: If no asset exists, is remedy based on historical loss (timber value) or present need?  
  - *Outcome uncertainty*: Rule 2 (Case 4) might dismiss for "no holder of advantage," but Rule 1/3 (Cases 2/5) could impose liability on the Province as author of injustice. Resolving this would clarify whether liability requires **advantage-holding** (Rule 2) or **wrongdoing authorship** (implied in Case 5).  

  This case forces a choice: Does liability die with the advantage (Rule 2), or can it attach to the wrongdoer’s successor (Province) even absent advantage? Your precedents lean toward the former, but Case 5’s focus on the wrong (not advantage) creates ambiguity. Taking this next would solidify the Board’s stance.  

  ---  
  **Final Note**: Your recommended decision upholds the core principles from all precedents while rejecting the college’s defenses. It prioritizes the community’s agency (refusal of per capita payments) and avoids the non-identity trap, aligning with the Board’s rejection of counterfactual personhood in prior awards. The annuity ensures ongoing accountability for ongoing benefit—consistent with Case 2’s forward-looking justice.
