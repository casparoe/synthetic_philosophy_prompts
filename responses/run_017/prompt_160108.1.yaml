answer: |-
  ## Address: Inaugural Statement as Chair of the National Truth Commission  
  *(Approx. 10 minutes)*

  Friends, survivors, citizens, colleagues.

  Look around this room. In these faces, you see the fractured soul of our nation. To the families in the front rows – those bearing the silent, unhealed wounds of disappearance, torture, murder – I see you. Your presence is not ceremonial. It is a demand. A demand for light where darkness reigned. I offer no easy solace. What I offer is this commission, built on a foundation of difficult, necessary truths.

  Our mandate is specific. We are tasked with building the most complete, authoritative record possible of the atrocities committed. Why? Because without that record, etched in irrefutable detail, we drift. Myths fester. Denial takes root. History bleeds into the present. The record itself is the bedrock—not merely for memory, but for the possibility of a future grounded in shared reality.

  This brings us to the mechanism you’ve heard debated: conditional amnesty. **It is provisional.** It is granted when an individual comes before us and testifies fully to their own actions and knowledge. It is not forgiveness. It is not absolution. It is not the closing of a book. It is a transaction, stark and unambiguous. Amnesty is offered *solely* in exchange for information crucial to the public record – information that trials, with their high barriers of proof and inherent adversarials, have historically failed, and may continue to fail, to uncover in its full, interconnected breadth.

  **But hear the condition clearly:** That amnesty *lapses* – automatically and entirely – if, within ten years, our own independent investigative unit, or any prosecutor armed with evidence, demonstrates that the testimony given was materially incomplete. If you concealed, if you minimized, if you lied by omission about the core facts of your actions or the actions of others you knew of, the protection vanishes. The door to prosecution reopens. This is not a loophole; it is the commission’s spine.

  I cannot stand here and promise finality to those who apply. The paradox is inherent: The more completely you disclose, the more evidence you place into the hands of the very body tasked with verifying that disclosure. Full disclosure is your shield; it is also the potential map for its own shattering, should it prove false. The choice to apply rests on a cold calculation: Is the risk of future exposure, based on the truth you provide *now*, outweighed by the certainty of exposure that silence, or denial, might bring later? Only the applicant can weigh that risk.

  To the families: I cannot promise you truth. This clause gives every applicant a powerful, rational reason to disclose only what they believe is necessary to secure the amnesty *now* – the minimum required. They may gamble on our unit's inability to uncover the rest within ten years. We will pursue every lead relentlessly, but the record we build will be imperfect, scarred by self-interest and fear. Our duty is to make it as *authoritative* as possible within these constraints. Your vigilance, your memories, your evidence, are vital counterweights to that self-interest.

  Some argue, forcefully, that this amnesty is inherently unlawful. I respect the principle driving that argument: the absolute demand for justice. Others note, as I have publicly, that the existence of a robust investigative unit complicates the justification – if truths *can* be found without amnesty, why bargain? But let us be clear: Without the incentive of amnesty, *this specific form of disclosure* – the sworn, public admission of culpability before a state body, weaving individual acts into the tapestry of systemic command – remains deeply unlikely. Trials pursue perpetrators; they rarely construct the panoramic, institutional record we seek. Our unit pursues facts; it cannot compel the perpetrator’s own voice detailing *why* and *how* within the machine. The amnesty purchases that voice, that perspective, however self-serving its initial delivery. The investigative unit exists to test its limits, to hunt down its omissions, and crucially, to pursue those who never apply.

  This commission will be neither a theater of forgiveness nor a shortcut to catharsis. We will not speak of "healing" or "reconciliation" as outcomes we guarantee. Those are profoundly personal journeys that may, or may not, be aided by the facts we unearth. Our task is more foundational: To establish, as definitively as humanly possible, *what happened*. To name systems, patterns, and chains of command. To return names to the disappeared and narrative to the silenced. To force accountability, whether through the amnesty bargain held under the Damoclean sword of its condition, or through the prosecutions that our work, and our investigative unit, may yet enable.

  We will operate with rigor, transparency, and an unflinching commitment to the facts. We will be fair, but we will not flatter. We will listen, but we will also challenge. We will seek the truth, knowing it will be partial, knowing it will be painful, knowing it will disappoint, but believing it is the only ground upon which this nation can hope to stand firm.

  **Commitment:** This commission pledges its relentless effort to establish the most authoritative public account of our past atrocities possible, using every tool within its mandate – provisional amnesty, independent investigation, and public scrutiny – to compel disclosure, verify truth, and ensure that the protective veil of amnesty is irrevocably torn from those who betray its conditional grant.
