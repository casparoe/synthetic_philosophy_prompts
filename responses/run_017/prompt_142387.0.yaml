  We are designing a game for a 45-minute lunchtime slot. The goal is for participants to experience how the choice of reference class (which past cases to compare to) can predetermine a forecast about the future of a state, without relying on historical facts.

  The scenario: a fictional seventy-year-old maritime confederation called "The Maritine League" with:
     - A written constitution
     - A recent decisive naval victory (say, 5 years ago)
     - A succession dispute (the current leader is aging and there are two factions vying for control)

  Game Structure:
  1. Introduction (5 min): Briefly explain the made-up confederation and the question: "Will the Maritine League survive for the next 50 years?" without giving away the lesson.
  2. Private Forecast (5 min): Each participant writes down their private forecast (Yes/No) and a sentence on why. They also assign a confidence level (e.g., 1-5, with 5 being very confident).
  3. Reference Class Selection (10 min): Participants are presented with two drawers (or boxes) of past cases. They must choose one drawer to base their forecast on. The drawers have fixed base rates (printed inside the lid) for the survival of states in that class over 50 years.
     - Drawer A: "Long-Lived States" (all states that have lasted at least 200 years) - base rate: 90% survival for next 50 years (since they are already long-lived).
     - Drawer B: "Maritime Confederations" (all known maritime confederations in history) - base rate: 20% survival for next 50 years (maritime confederations tend to be unstable).
     Note: The base rates are fixed and made up for the game. We are not using real history.

  4. Reveal a Third Reference Class (10 min): The facilitator reveals one additional true detail about the Maritine League that makes it fit a third reference class. For example: 
     - "The Maritine League has recently experienced a succession dispute." 
     Then, present a third drawer:
     - Drawer C: "States with Succession Disputes" - base rate: 30% survival for next 50 years.

     Now, participants are asked: How does this new reference class compare to the one you chose? Do you want to change your forecast?

  5. Discussion and Debrief (15 min): Facilitator leads a discussion on the experience, then explains the concepts (reference class, base rate, outside view).

