answer: |-
  ### **Game Design: "The Maritine League Forecast"**  
  **Objective:** Participants experience how the choice of reference class predetermines forecasts, without prior exposure to terms like "base rate" or "outside view."  

  ---

  ### **Materials**  
  1. **Handout 1 (The Maritine League Brief)**  
     - *Description:*  
       *"The Maritine League is a 70-year-old maritime confederation of island-states. It has:  
       - A written constitution dividing power between a central council and regional governors.  
       - A decisive naval victory 10 years ago against the Kingdom of Veridia.  
       - A brewing succession crisis: The aging High Admiral has no heir, and two factions (military hardliners vs. merchant elites) vie for control."*  
     - *Question at bottom:* **"Will the Maritine League survive intact for the next 50 years? Circle: YES / NO."**  

  2. **Three Reference Class Drawers** (labeled boxes with lids):  
     - **Drawer A**: "LONG-LIVED STATES"  
       *Inside lid:* "Base rate: 92% of states lasting 70+ years survive 50 more years."  
     - **Drawer B**: "MARITIME CONFEDERATIONS"  
       *Inside lid:* "Base rate: 15% survive 50 more years."  
     - **Drawer C**: "STATES WITH SUCCESSION CRISES"  
       *Inside lid:* "Base rate: 28% survive 50 more years."  

  3. **Forecast Cards** (small slips of paper) for each participant:  
     - Round 1: "Initial Forecast: _______ (YES/NO). Confidence: 1 (Low) to 5 (High)."  
     - Round 2: "Chosen Drawer: ______ (A/B). Revised Forecast: _______ (YES/NO)."  
     - Round 3: "New Drawer: C. Final Forecast: _______ (YES/NO)."  

  4. **Stakes**:  
     - Participation tokens (e.g., star stickers) for completing all steps.  
     - "Insight Point" tokens (extra stars) for volunteers who share reasoning during debrief.  

  ---

  ### **Rules & Sequence** (45 min total)  
  **Step 1: Private Forecast** (5 min)  
  - Distribute **Handout 1**.  
  - Participants read the brief and circle YES/NO on their Round 1 forecast card.  
  - *Physical action:* Write initial forecast and confidence level.  

  **Step 2: Drawer Selection & Revision** (10 min)  
  - Present **Drawers A and B**. Announce: *"Each drawer contains historical cases. Pick ONE to predict the League’s future."*  
  - Participants open their chosen drawer (A or B), read the base rate inside, and revise their forecast on their Round 2 card.  
  - *Physical action:* Walk to drawers, open one, record choice and revised forecast.  

  **Step 3: Third Reference Class Reveal** (10 min)  
  - Reveal **Drawer C**. Announce: *"Another true fact: The League has a succession crisis. Here’s a drawer for that. Does this change your forecast?"*  
  - Participants read Drawer C’s base rate and record their final forecast on Round 3 cards.  
  - *Physical action:* Open Drawer C, consider base rate, write final forecast.  

  **Step 4: Tally & Collect Cards** (5 min)  
  - Collect all forecast cards. Quickly tally:  
    - Initial YES/NO split.  
    - How many switched forecasts after Drawers A/B? After Drawer C?  
  - Award participation tokens.  

  **Step 5: Debrief** (15 min)  
  ***Do not use jargon upfront.*** Start with questions:  
  1. *"How many changed forecasts after picking a drawer? Why?"*  
     - Listen for: "The base rate was low/high," "I trusted the drawer’s stats."  
  2. *"Why did you pick Drawer A [or B]?"*  
     - Listen for: "Long-lived states seem stable," "Maritime leagues are fragile."  
  3. *"Did Drawer C feel equally valid? Why did/didn’t you trust it?"*  
     - Listen for: "It matched the crisis detail," "But our victory made us different!"  

  **Then** reveal the lesson:  
  - *"What you felt was the 'outside view': Using past cases (reference classes) to forecast. But notice:  
    - Your forecast was often settled by which drawer you picked first.  
    - Drawer A (92%) pointed to survival, Drawer B (15%) to collapse.  
    - Drawer C (28%) was equally valid but pointed opposite to Drawer A—yet some ignored it to stick with their first choice.  
    - This is why forecasts can be biased before evidence is weighed: The reference class choice anchors the outcome."*  
  - **Finally**, define terms: *"Reference class = category of past cases. Base rate = average outcome in that category. Outside view = ignoring unique details to use base rates."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Participants pick the drawer confirming their initial bias (e.g., optimists pick A, pessimists pick B).  
     - **Fix**: Highlight this in debrief: *"Many chose a drawer to rationalize their gut feeling. That’s confirmation bias—and it distorts the outside view."*  

  2. **Problem**: Some dismiss base rates (e.g., *"But the League is special!"*).  
     - **Fix**: In debrief, contrast their initial confidence with the sway of base rates: *"Did anyone feel their certainty drop when they saw a low base rate? That’s the power of the outside view."*  

  3. **Problem**: Drawer C’s impact is asymmetric (hurts Drawer A users more than Drawer B users).  
     - **Fix**: Note: *"Drawer C’s 28% undermines Drawer A’s 92% but aligns with Drawer B’s 15%. If you picked B, C felt like backup. If you picked A, C forced a dilemma."*  

  ---

  ### **What the Game Cannot Stage**  
  - **Constructing reference classes is subjective**. The game gives pre-made drawers, but in reality, historians debate *which* cases count. Say aloud: *"In the real world, we argue about what’s a 'similar case.' Here, we skipped that—but that debate changes forecasts too."*  

  ---

  ### **What Would Invalidate the Game**  
  If **>75% of participants ignore base rates entirely** (e.g., >75% keep initial forecasts despite drawers), the game fails. This suggests:  
  - The base rates were implausible.  
  - The scenario triggered overconfidence in personal reasoning.  
  **Fix**: Simplify. Use starker base rates (e.g., Drawer B: 5%) or add a role-play: *"You’re advisors. Your job depends on using your drawer’s stats."*  

  ---

  ### **Why This Works**  
  - **No prior knowledge**: Fictional case prevents "right answer" bias.  
  - **Emphasis on feeling**: The drawer choice *forces* base-rate reliance before details are debated.  
  - **Debrief roots lessons in experience**: Participants articulate their own bias before hearing jargon.  

