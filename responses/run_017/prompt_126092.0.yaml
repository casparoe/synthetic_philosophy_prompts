prompt: |-
  Bit of an odd one. I'm on the scientific advisory panel of a research foundation, and our charter has one clause we keep having to apply: we don't fund unconditional prophecies about the course of history. We've now got a track record of rulings and I want to know what we'd actually be committing ourselves to with the proposal in front of us.

  What we've done so far:

  - funded: a conditional claim that centralising tax collection raises famine risk within a decade, used to compare policies
  - funded: a 40-year projection of pension costs under three named policy scenarios
  - funded: a universal generalisation about the past with no forecast stuck on it (no state has survived a sustained halving of its revenue without reform or collapse) — minute says generalisations about the past are fine, prophecies aren't
  - funded with conditions: a 30-year forecast of malaria burden conditional on current coverage; we made them state what would falsify it within five years
  - rejected: dating the next transition in the global order from a theory of civilisational life-cycles
  - rejected: reading the spirit of the age off artistic output to say which institutions will decay
  - rejected: a widely publicised forecast of the next financial crisis, partly because publishing it could help bring it about

  The new one: a consortium wants to revive a law of bureaucratic growth — as communication latency falls, the share of a society's output administered centrally rises, in every case where we have data — and use it to forecast, out to 2110, that central administration keeps growing. Their pitch is that it's conditional, testable on past data, and stated as a generalisation; they've also 'sealed off' the knowledge variable by holding future communication technology fixed, and they've offered to publish only behind a paywall.

  So: what should we decide if we want to be consistent with ourselves, and which of our own precedents is the closest analogue? More usefully, tell me the two or three rules that fit our track record equally well, where they come apart on this case, and — if they genuinely underdetermine it — what principle we'd be adopting with each choice and what the next proposal that would settle it would look like. Please also say how confident you are in what you're claiming and single out the bit you're least sure of. British English please.
reasoning: |-
  Okay, the user is part of a scientific advisory panel for a research foundation. They have a charter clause that prohibits funding "unconditional prophecies about the course of history." They've provided a track record of decisions on various proposals and now need to evaluate a new one consistently with their precedents.

  The new proposal involves reviving a "law of bureaucratic growth" that links falling communication latency to increased central administration, forecasting growth out to 2110. The consortium claims it's conditional, testable on past data, and has mitigated risks by holding future tech fixed and using a paywall.

  Looking at their precedents:
  - Funded conditional claims comparing policies (famine risk), multi-scenario projections (pensions), past generalisations (state collapse), and conditional forecasts with falsifiability clauses (malaria)
  - Rejected unconditional prophecies (civilisational cycles, spirit-of-age decay predictions), and self-fulfilling prophecies (financial crisis forecast)

  Key tensions in this case:
  1. It's framed as a generalisation but stretched into a 90-year forecast
  2. "Holding technology fixed" creates artificial conditionality - this feels like gaming the clause
  3. The paywall addresses self-fulfilment concerns but not the core prophecy issue

  The closest analogues are:
  - Malaria forecast (funded) due to falsifiability and conditionality
  - Civilisational cycles (rejected) for similar long-term, inevitability framing

  But concerning differences:
  - Malaria had short-term test points (5-year falsifiability); here the "test" relies entirely on past data validation
  - The tech freeze makes it feel like a disguised prophecy - if we accept this, we'd have to fund any forecast that declares variables "fixed"

  If funded, this would establish that:
  - Artificial conditionality (freezing variables) satisfies their clause
  - Forecasts relying solely on past data validation are acceptable
  The next test case would likely involve another "frozen variable" forecast (e.g., "holding climate constant, sea levels will rise X meters by 2150")

  If rejected, it maintains that:
  - True conditionality requires observable alternative outcomes
  - Long-range forecasts need near-term validation mechanisms
  The next borderline case might be a 20-year tech adoption forecast with annual real-world checkpoints.

  Least confident point: Whether the paywall mitigation tips the balance. Their precedent rejects self-fulfilling prophecies, but this isn't primarily rejected on prophecy grounds. The paywall feels secondary to the core issue of historical determinism.
answer: |-
  Based on your track record and the new proposal, here's a consistent analysis under British English conventions. I'm **85% confident** in the overall reasoning, but least sure about interpreting the "sealed off knowledge variable" aspect (addressed in Point 3 below).

  ### Proposed Decision: **Reject** the consortium's proposal
  **Closest analogue**: The rejected "dating the next transition in the global order from a theory of civilisational life-cycles". Both involve deterministic, long-term historical extrapolations presented as immutable laws.

  ---

  ### Rules Fitting Your Precedents
  Two competing principles emerge from your rulings, which diverge on this case:

  1.  **The Conditionality & Testability Rule**  
      *Supported by*: Funded famine risk (conditional on policies), pension projections (multiple scenarios), malaria forecast (explicit falsifiability).  
      *Rejects*: Prophecies presented as inevitable (civilisational cycles, institutional decay).  
      *Key principle*: Claims must be contingent on identifiable variables or scenarios, with clear empirical tests *within a relevant timeframe*.  
      *Verdict on new proposal*: **Superficially fits** (framed as conditional on fixed tech, testable on past data).  

  2.  **The Anti-Determinism Rule**  
      *Supported by*: Rejected civilisational cycles (historical inevitability), spirit-of-age decay (untestable inevitability).  
      *Funded exceptions*: Past generalisations (no future prophecy), multi-scenario projections (no single "fated" outcome).  
      *Key principle*: Avoid funding claims that history *must* follow a predetermined path, especially when framed as universal laws overriding human agency.  
      *Verdict on new proposal*: **Clearly violated**. The forecast presents centralised growth as inevitable by 2110 if latency falls, implying a fixed historical trajectory.  

  3.  **The Intervention Risk Rule** (Secondary)  
      *Supported by*: Rejected financial crisis forecast (self-fulfilling prophecy risk).  
      *Key principle*: Reject forecasts where dissemination could directly influence the outcome.  
      *Verdict on new proposal*: **Mitigated but not eliminated** by the paywall. However, this isn't the primary issue here.

  ---

  ### Where the Rules Diverge on This Case
  - **Conditionality Rule** could *technically* support funding: The consortium artificially "holds technology fixed," creating a conditional veneer ("if tech stays unchanged, then X"). It also offers past testability.  
  - **Anti-Determinism Rule** overrides this: Freezing variables doesn't negate the prophecy's core—it presents bureaucratic growth as an inescapable law of history. Your panel has consistently rejected such *teleological* claims (e.g., civilisational life-cycles), regardless of framing.  
  - **Key tension**: Artificial conditionality (freezing tech) vs. genuine scenario-based contingency (like your pension/malaria examples). The former is a rhetorical sleight of hand; the latter allows for alternative futures.  

  ---

  ### Principles Adopted with Each Choice
  - **If you FUND this proposal**, you establish:  
    *"Artificial conditionality (e.g., 'freezing' variables) and retrospective testability are sufficient to avoid 'prophecy' status, even for century-scale deterministic forecasts."*  
    **Next test case**: A forecast that "holds climate policies constant" to predict 22nd-century societal collapse. This would force you to confront whether *any* variable-freezing justifies prophecy.  

  - **If you REJECT this proposal** (as advised), you establish:  
    *"Forecasts implying historical inevitability—even when dressed as conditional laws—violate the charter. Genuine conditionality requires plausible alternative outcomes (e.g., policy choices), not fixed variables."*  
    **Next test case**: A 50-year energy transition model with *branching scenarios* (e.g., high/low investment in fusion). Funding this would reinforce your commitment to contingency over determinism.  

  ---

  ### Why Rejection is Consistent
  1. **It’s prophecy disguised as generalisation**: Like the civilisational cycles rejection, it uses historical data to assert an *inevitable future trajectory* ("central administration keeps growing"). The "fixed tech" clause is a tautology: *of course* centralisation grows if you assume no new tech disrupts the trend—but that’s not science, it’s circular reasoning.  
  2. **Lacks genuine testability**: Past data validates the correlation, but the 2110 forecast is untestable for decades. Contrast with your malaria case, which required *near-term* falsifiability (5 years).  
  3. **Violates the spirit of Anti-Determinism**: Your panel explicitly rejects theories that claim to "read" history’s destined path (e.g., artistic decay, civilisational cycles). This is structurally identical.  

  The paywall mitigates self-fulfilment risks but doesn’t alter the proposal’s deterministic core. Consistency demands rejection.  

  **Least confident point**: Whether the "fixed technology" clause *could* be argued as making it conditional. However, your malaria precedent required *active* falsification criteria, not passive assumptions. This tips the balance toward rejection.
