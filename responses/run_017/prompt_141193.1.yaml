answer: |-
  ### Written Pricing Procedure for Small Mutual Insurance

  #### **Core Principles**
  1. **Defensibility**: Every premium must be based on pre-registered classes with sufficient data. Avoid arbitrary choices by prioritizing class hierarchy and data stability.
  2. **Transparency**: Document every step to show reasoning, ensuring a lay complaints panel can verify objectivity.
  3. **Efficiency**: Complete within 20 minutes per quote using pre-defined classes (no ad-hoc classes; postcode-based classes banned).

  ---

  ### **Step-by-Step Procedure**
  **1. Identify Candidate Classes (2 mins)**  
     - List all pre-registered classes the house belongs to (e.g., construction type, location proxies like "flood zone 3", roof material, age, etc.).  
     - *Exclude* any class referencing postcode (per board ban).  

  **2. Assess Data Sufficiency (5 mins)**  
     - **Minimum Threshold**: A class requires ≥5 policies to be "data-supported" (below this, risk estimates are unstable).  
     - **Narrowing/Broadening**:  
       - Start with the **narrowest reasonable class** (e.g., "straw-bale construction").  
       - If narrow class has <5 policies, broaden **one level** (e.g., "eco-friendly materials" for straw-bale).  
       - Stop broadening when:  
         - A class has ≥5 policies, *or*  
         - You reach the **broadest class** (entire portfolio; 400 policies).  
     - *Never use* classes with <5 policies unless no broader class exists.  

  **3. Resolve Class Conflicts (5 mins)**  
     - If two data-supported classes disagree on premium by >20%:  
       - **Prefer specificity**: Choose the class most directly tied to the dominant risk (e.g., "subsidence history" trumps "Victorian-era build").  
       - **Prefer stability**: If equally specific, choose the class with more policies.  
       - **Escalate if deadlocked**: If conflict persists and both classes are equally valid, **decline to quote** (document as "unresolvable conflict").  

  **4. Decision to Decline (3 mins)**  
     Decline the quote if:  
     - No class has ≥5 policies *and* the broadest class (entire portfolio) is statistically inappropriate (e.g., known high-risk factor unaddressed).  
     - The only data-supported class is banned (e.g., postcode-based).  
     - Unresolvable class conflict (Step 3).  

  **5. Documentation (5 mins)**  
     For the quote file, record:  
     - **Candidate classes**: List all applicable classes, policy counts, and premiums.  
     - **Selection rationale**: Why the chosen class was picked (e.g., "Chosen: 'eco-materials' (8 policies). Rejected: 'straw-bale' (2 policies, insufficient data)").  
     - **Conflict handling**: If applicable, "Conflict between Class A (10 policies, premium £X) and Class B (15 policies, premium £Y). Chosen Class B: more stable data."  
     - **Declination reason**: If declined, specify (e.g., "No class captures subsidence risk; entire portfolio inadequate").  

  ---

  ### **Application to Example Cases**
  **Case 1: Straw-Bale House**  
  - **Candidate Classes**:  
    - Narrow: `Straw-Bale` (3 policies) → insufficient data.  
    - Broader: `Eco-Materials` (e.g., straw, hemp; 8 policies) → valid.  
    - Broader: `Non-Standard Construction` (50 policies) → valid but less specific.  
  - **Conflict?**: `Eco-Materials` premium = £1,200; `Non-Standard` = £900 (25% difference).  
  - **Resolution**: Prefer `Eco-Materials` (more specific to risk; 8 > min threshold). Stability acceptable.  
  - **Premium**: **£1,200** based on `Eco-Materials`.  
  - **Documentation**:  
    > "Chosen: 'Eco-Materials' (8 policies, £1,200). Rejected: 'Straw-Bale' (3 policies) – insufficient data. 'Non-Standard Construction' rejected – less specific to material risk. Conflict resolved via specificity."  

  **Case 2: House with Prior Subsidence Claim**  
  - **Candidate Classes**:  
    - Narrow: `Prior-Subsidence` (2 policies) → insufficient data.  
    - Broader: `Clay-Soil Area` (6 policies; uses soil type, not postcode) → valid.  
    - Broader: `All Older Houses` (100 policies) → valid but unrelated to subsidence.  
  - **Conflict?**: `Clay-Soil` premium = £2,500; `All Older Houses` = £1,000 (60% difference).  
  - **Resolution**: `Clay-Soil` is more specific to subsidence risk. No deadlock.  
  - **Premium**: **£2,500** based on `Clay-Soil`.  
  - **Documentation**:  
    > "Chosen: 'Clay-Soil Area' (6 policies, £2,500). Rejected: 'Prior-Subsidence' (2 policies) – insufficient data. 'All Older Houses' rejected – does not capture subsidence risk. No conflict; specificity prioritised."  

  **Case 3: House with Banned Postcode Class as Only Option**  
  - **Candidate Classes**:  
    - Narrow: `High-Crime Area` (banned; uses postcode) → invalid.  
    - Alternative: `Thatched Roof` (4 policies) → insufficient data.  
    - Broader: `All Urban Houses` (200 policies) → valid but may misprice risk.  
  - **Assessment**: No data-supported class for location-specific risk (postcode class banned; alternatives <5 policies). Entire portfolio (`All Risks`, 400 policies) is broadest class but ignores urban crime risk.  
  - **Decision**: **Decline to quote**. Broadest class is indefensible for known high-risk factor.  
  - **Documentation**:  
    > "Declined: No defensible class. 'High-Crime Area' (banned) was only data-supported option. Alternatives: 'Thatched Roof' (4 policies – insufficient), 'All Urban Houses' (200 policies) – understates crime risk. Entire portfolio inappropriate for unaddressed material risk."  

  ---

  ### **Where Judgment Wears the "Nice Suit"**
  - **Class Hierarchy**: Judgment defines "narrowest reasonable class" (e.g., prioritizing material over roof type for straw-bale).  
  - **Dominant Risk**: Judgment identifies the primary risk (e.g., subsidence > age) during conflicts.  
  - **Materiality Threshold**: Judgment flags when broadest class is inadequate (e.g., Case 3’s crime risk).  
  - **Documentation Safeguard**: Explicitly justifying trade-offs (specificity vs. stability) shields against bias claims.  

  This procedure ensures efficiency, compliance, and auditability while minimizing subjectivity. Each quote gets a clear, defensible outcome—premium or decline—rooted in data and pre-registered rules.
