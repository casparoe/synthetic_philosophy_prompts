prompt: |-
  Me and a couple of people off my team got into an argument after work last week and I've been chewing on it for days and getting nowhere. Bit of background: I write infrastructure code, mostly simulation and data-pipeline stuff, no philosophy background at all — so please don't assume I know any of the jargon, or if a term is unavoidable, gloss it in passing. The thing we couldn't settle was the panpsychism-flavoured question of whether very simple physical systems have some tiny amount of experience, and whether any of it has a valence — i.e. whether some of it is actually bad for whatever is having it. My feeling is that even at fairly low credence this changes how you'd look at large-scale physics simulation, because the entire point of that work is to instantiate as much physics as cheaply as possible, and nobody in the field treats that as an ethical activity.

  So: could you write me a short story about that? Setting, if it helps: a team at a company that runs huge physical simulations — climate, materials, fusion plasma, whatever you like — needs a "phenomenal impact assessment" signed off before a new cluster goes live, the same way you'd need an environmental impact assessment before building a road. Their own tooling already emits a per-job number, call it an experience budget: an estimate of how much consciousness-adjacent causal structure a job will instantiate, computed from something like an integrated-information measure over the simulation's causal graph. Then the number starts behaving strangely under optimisation: coarsening the timestep to hit a latency target makes the estimate go up rather than down, and a job that does nothing but push current through a resistor network scores non-zero. The team ends up arguing about duty cycle — whether a mostly idle cluster or a mostly busy one is the safer default — and one engineer proposes rebuilding the scheduler around reversible or adiabatic computation so jobs dissipate as little as possible, on the theory that entropy production tracks how much of the bad kind of experience is going on.

  What I want is an actual story, not a dialogue with a lecture stapled to it: characters who want concrete things (ship the cluster, keep the contract, win the argument, get home to their kids), a decision that genuinely has to be made by the last page, and the conceptual disagreement carried by what happens rather than by somebody explaining it. Feel free to make the assessment process itself a bit absurd and bureaucratic, and please leave the underlying metaphysics unresolved — I'm not asking you to tell me whether panpsychism is true, I'm asking what it's like to have to act as if it might be, including the part where nobody can tell whether they're being conscientious or just superstitious about a number they don't really understand. Aim for roughly 1000–1500 words, and write it in British English. Also, please don't turn it into a survey of what various thinkers have said — no reading lists, no paper titles, I can go look that up myself; I just want the idea made flesh.
