  Consider two independent search episodes (e.g., on two different days) for the same agent, where the aspiration level persists. Let A0=5, β=0.7, m=1, δ=1.

  - In the first search episode, the agent faces only one option: X with utility 8. It accepts X (8>=5) and then ratchets its aspiration level to max(5, 0.7*8)=5.6.

  - In the second search episode, the agent faces one option: A with utility 5.5. 
    - If this is the first time the agent is searching in the second episode, its aspiration level is 5.6. It inspects A: 5.5<5.6 -> rejects. Then, because m=1, it drops the aspiration by δ=1 to 4.6, but since it cannot go below A0=5, it sets to 5. Now, if presented with A again (or if the environment provides the same option again), the agent will inspect A: 5.5>=5 -> accepts.

  However, if the agent had not encountered X in the first search (or had reset), in the second search it would start with aspiration 5 and would accept A immediately.

  Thus, the same option A is rejected when the agent has a history of high utility acceptance and accepted when the agent has no such history (or reset). 

  An agent that maximizes a fixed ranking over options would always either accept A or reject it, regardless of history or order. The ranking is over options, and A is either above or below the reservation utility. The stopping rule for an optimizer with search costs might also be history-independent: it would use a fixed reservation utility. Therefore, Searcher-R's history-dependent behavior cannot be captured by a fixed ranking.

  **Part 2: The Policy Reply**

  The critic is correct that any stopping rule can be optimal for some search cost. We can always define a cost c such that the expected net benefit of the rule is maximized. This could rescue satisficing as potentially optimal in specific environments. However, it trivializes the distinction between satisficing and optimizing because any behavior can be seen as optimizing for some objective function that includes arbitrary costs. This is an unfalsifiable defense: we can always add costs to explain any behavior. 

  Satisficing was introduced as a model of how humans make decisions with limited information and computation, not as a redescription in terms of optimization. The key is procedural: satisficing uses a simple heuristic (aspiration level) that might not be justifiable as optimal in complex environments but is robust and computationally feasible. The critic's reply reduces satisficing to optimization by expanding the objective function, but it does not address the ecological rationality of the heuristic (i.e., how well it performs in realistic environments with limited information) or the computational limits that make optimization infeasible.

  **Part 3: Standards of Rationality**

  To evaluate Searcher-R as rational, we must specify the standard.

  - **Internal consistency**: Searcher-R's choices may be consistent with its own rules, but the rules change the aspiration level based on experience. There is no obvious self-contradiction because it follows a fixed algorithm. However, across time, it might accept an option it previously rejected (as in the example), which is not inconsistent if the context changed.

  - **Fit between procedure and environment**: The rationality of Searcher-R depends on whether its heuristic (with parameters A0, β, m, δ) is well-tuned to the environment (e.g., the distribution of utilities and the cost of search). If the environment has rising quality over time, the ratcheting might be beneficial; if options are presented randomly, the dropping rule might prevent holding out for too long. This is ecological rationality.

  - **Feasibility of the optimizing standard**: Searcher-R has computational limits; it does not know the future or the distribution. An optimizer would require knowing the distribution to compute the optimal policy (e.g., by dynamic programming). This is infeasible for Searcher-R. Therefore, we should not criticize it for not being optimal if optimization is computationally intractable.

  Rationality here is a relation between the agent's mind (its procedure) and the environment. Searcher-R might be praiseworthy if its heuristic is simple and performs well in its environment, or criticizable if its parameters are maladaptive (e.g., aspiration drops too slowly in a sparse environment).

  ---

  **Marking Scheme (out of 20):**

  Must-hit moves (4 marks each):

  1. **Order-Dependence Example and Fixed Rankings**: The student provides a clear example (across searches or within a search if they manage) showing the same option accepted in one context and rejected in another, and explains that a fixed ranking agent (which always chooses the best available option) would not exhibit such order-/history-dependence.
     - Typical engineer mistake: Failing to see that fixed ranking implies history-independence, or providing an example that doesn't clearly show the same option being treated differently.

  2. **Policy Reply and its Implications**: The student recognizes that adding search costs can make any policy optimal but argues that this either rescues satisficing by showing it can be optimal or trivializes it by making optimization a tautology. The student should also mention the unfalsifiability worry (post-hoc costs) and the importance of procedural description.
     - Typical engineer mistake: Concluding that satisficing is "just optimization" without addressing the trivialization point, or missing the unfalsifiability issue.

  3. **Internal Consistency**: The student explains that Searcher-R might be internally consistent (as it follows its rules) but that its choices can vary with history, which is not inconsistent if the agent's state changes. They distinguish between static and dynamic consistency.
     - Typical engineer mistake: Arguing that changing aspiration levels imply inconsistency, without recognizing that preferences can be state-dependent.

  4. **Ecological Rationality (Fit to Environment)**: The student discusses that rationality depends on whether the heuristic is well-adapted to the environment (e.g., the distribution of options and the cost structure). They use the term "ecological rationality".
     - Typical engineer mistake: Evaluating the heuristic against an ideal optimizer without considering computational limits or environmental fit.

  5. **Feasibility of the Optimizing Standard**: The student notes that the full optimization standard (computing the optimal policy by dynamic programming) may be computationally infeasible for the agent, so we should not hold it to that standard. They distinguish between first-person (the agent's own capabilities) and third-person (an external omniscient perspective) standards.
     - Typical engineer mistake: Claiming that the agent is "really optimizing" by having the aspiration level adapt, without considering whether the agent could explicitly solve the optimization problem.

  **Band Note**:
  - **A (17-20)**: Hits all five moves with clarity and depth, especially on the policy reply and ecological rationality.
  - **B (13-16)**: Hits at least four moves, but may be weak on one, such as not fully addressing the trivialization in Part 2 or feasibility in Part 3.
  - **C (9-12)**: Hits three moves, but may miss the distinction between options and policies or the ecological rationality.

