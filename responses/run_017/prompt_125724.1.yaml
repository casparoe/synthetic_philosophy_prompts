answer: |-
  ### Exam Question: Satisficing and Searcher-R (20 marks total)  
  **Time:** 90 minutes  
  **Instructions:** Answer all parts. Do not consult external resources. Define any specialized terms in your own words.  

  #### Background: Searcher-R Agent  
  Searcher-R chooses from a sequence of options presented one at a time. Each option has a hidden utility. Inspecting an option reveals its utility but costs a fixed amount \( c > 0 \). Searcher-R cannot inspect all options. It uses:  
  - **Aspiration level**: Starts at \( A_0 \). Accepts the first option with utility \( \geq \) current aspiration.  
  - **Ratchet after acceptance**: If an option with utility \( u \) is accepted, aspiration rises to \( \max(\text{current aspiration}, \, \beta \cdot u) \), where \( 0 < \beta < 1 \). Aspiration never decreases after acceptance.  
  - **Drop after rejection**: If \( m \) consecutive inspections occur without acceptance, aspiration drops by \( \delta > 0 \) (but never falls below \( A_0 \)).  

  ---

  **Part 1: Order-Dependence and Fixed Rankings (5 marks)**  
  Construct a minimal example (e.g., 2–3 options) showing that for the same option \( X \), Searcher-R accepts \( X \) in one order of presentation but rejects \( X \) in another order. Explain why no agent with a fixed, complete, and transitive ranking over options (i.e., always chooses the best available option, ignoring search costs) could reproduce this behavior.  

  **Part 2: The Policy Reply (8 marks)**  
  A critic argues: "Once search costs are added to the objective function, Searcher-R’s behavior is just optimization of a larger goal (e.g., ‘utility minus search costs’). For any stopping rule, there exists a search cost making it optimal. Thus, satisficing is either a trivial redescription of optimization or not a genuine alternative."  
  Does this reply rescue satisficing as rational? Trivialize it? Or something in between? Justify your view, addressing:  
  - Why judging policies (not options) matters.  
  - Whether post-hoc assignment of "search costs" risks unfalsifiability.  

  **Part 3: Standards of Rationality (7 marks)**  
  Suppose we debate whether Searcher-R is "rational." What must "rational" mean to credibly praise or criticize it? Address:  
  - **Internal consistency**: Does Searcher-R avoid self-contradiction in its choices?  
  - **Ecological rationality**: How might its procedure fit (or misfit) its environment?  
  - **Feasibility**: Could Searcher-R itself use an optimizing standard (e.g., dynamic programming) given its limits?  
  Distinguish rationality as a property of behavior, versus a relation between the agent’s mind and environment.  

  ---

  ### Model Answer (≈700 words)  
  **Part 1: Order-Dependence Example**  
  Consider two options: \( X \) (utility = 5) and \( Y \) (utility = 10). Searcher-R starts with \( A_0 = 8 \), \( \beta = 0.6 \), \( m = 1 \), \( \delta = 1 \).  
  - **Order 1 (sequence: \( X \) then \( Y \))**:  
    - Inspect \( X \): Utility 5 < 8 → reject. Drop aspiration (since \( m = 1 \)) to \( \max(8 - 1, 8) = 7 \) (cannot drop below \( A_0 = 8 \) → still 8? Correction: \( \max(7, 8) = 8 \)). Error in parameters. Revised: Set \( A_0 = 5 \), initial aspiration = 8 (allowed if aspiration starts at \( A_0 \) but ratchets up; assume \( A_0 = 5 \), but first search starts at 5. Alternative: Use persistence across searches).  
    *Revised example with persistence*:  
    Day 1 (only \( Y \)): Start aspiration \( A_0 = 5 \). Inspect \( Y \) (utility 10 ≥ 5) → accept. Ratchet: new aspiration = \( \max(5, 0.6 \times 10) = 6 \).  
    Day 2 (only \( X \), utility 5.5): Aspiration = 6. Inspect \( X \): 5.5 < 6 → reject. After \( m = 1 \) rejection, drop aspiration by \( \delta = 1 \) to \( \max(6 - 1, 5) = 5 \). If \( X \) reappears: 5.5 ≥ 5 → accept.  
    Same option \( X \) (utility 5.5) is rejected on first presentation (aspiration = 6) but accepted later (aspiration = 5).  
  - **Order 2 (reset agent)**: New search, aspiration = \( A_0 = 5 \). Inspect \( X \): 5.5 ≥ 5 → accept immediately.  
  **Why fixed rankings fail**: An agent with a fixed ranking always prefers \( X \) over no choice or identical alternatives. If \( X \) is acceptable when aspiration is 5, it should always be acceptable. Searcher-R’s history-dependent aspiration violates this: the same \( X \) is rejected when prior events raise aspiration (Day 2 after \( Y \)) but accepted when aspiration is low (reset agent). Fixed rankings ignore stateful adaptation.  

  **Part 2: Policy Reply and Satisficing**  
  The reply **trivializes satisficing** but does not fully rescue it.  
  - **Policy focus is valid**: Rationality should indeed evaluate policies (rules mapping sequences to actions), not isolated choices. For example, a stopping rule that accepts the first option above a reservation price may optimize expected utility minus search costs in specific environments.  
  - **But unfalsifiability looms**: Assigning "search costs" post hoc to justify any behavior makes optimization empirically empty. If Searcher-R accepts a mediocre option early, we could invent high search costs to "explain" it; if it searches longer, we invent low costs. This rescues satisficing only by making optimization a tautology.  
  - **Satisficing as procedural alternative**: Satisficing was proposed as a model of how humans *actually* decide under limits (e.g., unknown distributions, computation), not as a covert optimizer. While embedding search costs in optimization *describes* Searcher-R’s behavior, it ignores whether the agent *uses* optimization. Searcher-R heuristically adapts aspirations without calculating expected values or costs—a procedural difference. Thus, the reply conflates "as-if optimization" (behavior mimics maximizing) with "cognitive optimization" (agent computes maxima). Satisficing is a genuine alternative for agents who cannot compute optimal policies.  

  **Part 3: What "Rational" Means for Searcher-R**  
  - **Internal consistency**: Searcher-R is consistent procedurally (it follows its rules), but its choices are path-dependent: accepting \( X \) in one context but not another is not "irrational" if we allow preferences to adapt. However, if aspirations ratchet arbitrarily (e.g., rising so high no option suffices), it might violate broad notions of goal-seeking.  
  - **Ecological rationality**: Rationality depends on environment fit. In a stable environment with high-utility options, ratcheting improves outcomes; in sparse environments, frequent drops may prevent excessive search. But if \( \beta \), \( \delta \), or \( m \) are misconfigured (e.g., \( \beta \) too high in a low-utility world), Searcher-R may reject adequate options. It is praiseworthy if its heuristics match environmental regularities without complex computation.  
  - **Feasibility of optimization**: Judging Searcher-R against a dynamic programming model (which computes optimal policies) is unfair: it lacks knowledge of option distributions and computational resources to solve sequential decision problems. Rationality should respect **procedural bounds** (what the agent *can* compute) rather than **substantive ideals** (what an omniscient agent *would* do).  
  - **The core point**: Rationality is not just property of behavior (e.g., "maximizes X") but a relation between the agent’s cognitive procedure and its environment. Searcher-R is rational if its heuristic is robustly functional for its context; criticizable if it ignores learnable environmental patterns (e.g., failing to lower \( A_0 \) in consistently poor environments).  

  ---

  ### Marking Scheme (20 marks)  
  **Must-hit moves** (4 marks each):  
  1. **Order-dependence vs. fixed rankings**:  
     - *Hit*: Clear example showing same option accepted/rejected in different orders; explains fixed rankings preclude path-dependence.  
     - *Engineer mistake*: Claims "aspiration adapts, so it’s still optimizing" without addressing fixed rankings.  
  2. **Policy focus and unfalsifiability**:  
     - *Hit*: Accepts policy-level evaluation but notes post-hoc "search costs" make optimization unfalsifiable; distinguishes as-if vs. cognitive optimization.  
     - *Engineer mistake*: Asserts "satisficing is optimizing with costs added" without discussing trivialization.  
  3. **Internal consistency**:  
     - *Hit*: Notes Searcher-R is procedurally consistent; path-dependence is not inconsistency if preferences adapt.  
     - *Engineer mistake*: Labels aspiration changes as "inconsistent" without defining standards.  
  4. **Ecological rationality (fit to environment)**:  
     - *Hit*: Links rationality to environmental fit (e.g., adaptive aspirations suit option distributions); uses term "ecological rationality" (defined: fitness of a procedure to environmental structure).  
     - *Engineer mistake*: Evaluates solely against optimal policy, ignoring environment/computation.  
  5. **Feasibility (procedural vs. substantive)**:  
     - *Hit*: Argues Searcher-R cannot feasibly compute optimal policies; rationality requires standards it can actually apply. Distinguishes first-person (agent’s perspective) from third-person (external ideal).  
     - *Engineer mistake*: Claims "adaptation is optimization" without addressing computational limits.  

  **Band Notes**:  
  - **A (17–20)**: Hits all five moves. Clear on unfalsifiability, ecological fit, and feasibility. Explicitly separates behavior/prescription, policy/option, and first/third-person views.  
  - **B (13–16)**: Hits three to four moves. Minor gaps (e.g., vague on unfalsifiability or feasibility).  
  - **C (9–12)**: Hits two to three moves. Superficial on policy reply or rationality standards (e.g., "rational = optimal").  
  - **D (5–8)**: Fails on two+ moves. Misses order-dependence or confuses key distinctions.  
  - **E (0–4)**: Incomplete; major errors.  

  ---  
  **Defined Terms**:  
  - **As-if representation**: When behavior appears *as if* it maximizes an objective, but the agent does not explicitly compute it.  
  - **Reservation price**: In search theory, the minimum utility an optimizer accepts.  
  - **Dynamic programming**: A method for computing optimal policies in sequential decisions; requires full knowledge and heavy computation.  
  - **Ecological rationality**: A heuristic’s effectiveness arises from matching environmental structures.  
  - **Procedural vs. substantive rationality**: Procedural focuses on decision processes under limits; substantive focuses on achieving optimal outcomes.
