  1. **Inspection Cost**: Inspecting an option to learn its utility costs a fixed amount, \( c > 0 \). The agent cannot inspect all options due to this cost.
  2. **Aspiration Level**: The agent starts with an initial aspiration level \( A_0 \). 
  3. **Acceptance Rule**: When inspecting an option with utility \( u \), if \( u \geq \) current aspiration level, the agent accepts the option and stops searching.
  4. **Adaptation after Acceptance**: After accepting an option with utility \( u \), the agent **ratchets** its aspiration level: the new aspiration level becomes \( \max(\text{current aspiration}, \beta \cdot u) \), where \( 0 < \beta < 1 \). The aspiration level never decreases after an acceptance.
  5. **Adaptation after Rejection**: If the agent inspects \( m \) consecutive options without accepting (i.e., all had utility below the current aspiration level), then the agent decreases its aspiration level by a fixed step \( \delta > 0 \), but never below \( A_0 \).

