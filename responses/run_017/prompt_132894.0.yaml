prompt: |-
  I sit on the executive committee of a branch of a general union, and I would like a decision procedure we can actually run.

  The setting: our branch covers roughly seven hundred directly employed members across three parcel distribution depots, plus — and this is the part that keeps causing arguments — around two hundred self-employed couriers who work the same routes, on the same handheld platform, against the same performance targets, but who are engaged through a separate services contract with an intermediary. Several times a year we are asked to authorise some form of industrial action: overtime bans, work-to-rule, short intermittent stoppages, all-out walkouts, refusals to cross another union's picket line. We have about forty minutes at a branch meeting, our members are not philosophers, and any decision has to survive two further stages: a ballot of the affected members and a sign-off from regional office, who will not sign off on anything they think is disproportionate. We cannot commission fresh advice for each decision, and I would rather the procedure did not rest on the details of any particular jurisdiction's labour law — treat statutory permissions and restrictions as a parameter we fill in locally, and give me the moral structure underneath, the part that would still oblige us if the law changed.

  The rough rule we have been using is: we may withdraw what the employer is paying for; we may not prevent other people from working; we may not aim at anyone who cannot give us what we want. I know that rule is too thin, and I will say why below.

  What I want is a procedure: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure returns a no and stops; the points at which it hands the question to a vote because it is a question about what we value rather than about facts; and the points at which it has no opinion at all. For each step, give me one line on which justification of the right to organise that step leans on — the freedom-of-association line, the coercion objection, the anti-domination or countervailing-power line, or something else — so I can see which parts of the procedure would collapse if we rejected one of those justifications. Please also mark the steps that are judgement calls dressed up as procedure; I would rather know which they are than be reassured.

  Two difficulties I want the procedure to handle explicitly, because they are where our current rule runs out. First, addressee: a strike seems to require somebody who can hear it and respond, but many of the decisions that matter to our members — routing, shift allocation, deactivation thresholds — are made by an automated scheduler, tuned by a product team that none of us can name and that has no employment relationship with us at all. Who, if anyone, is the legitimate addressee of pressure there, and does it matter that the local depot manager can only pass the pressure on? Second, aggregation: if members stop for two hours at a time, twice a week, for ten weeks, is that one strike or twenty, and is proportionality assessed against each stoppage, against the running total, or against the threat of the series continuing? Our rule gives no answer, and the answer decides whether intermittent action is the mildest available step or the most coercive one.

  Then run the finished procedure on four live proposals, showing your working:

  1. An overtime and voluntary-extra-shift ban at the two largest depots, properly balloted and notified, in response to a roster change that moves start times by forty minutes on two weeks' notice, which the employer says is permitted under a general flexibility clause. The financial impact is small and the disruption is mostly absorbed by the employer's own planning.

  2. An intermittent stoppage of two hours, announced twenty minutes in advance, twice weekly, in support of cleaners at the same site who are being dismissed and re-engaged through a subcontractor on worse terms. They are in a different union. Our members have no complaint against our own employer, the subcontractor is not our employer, and the stoppages are timed to the evening sort so that most of the cost falls on our employer rather than on the party to the dispute.

  3. An immediate walkout at one site after a serious near-miss involving a reversing vehicle: no ballot, no notice, and the yard to stay closed until an independent safety audit is commissioned. Our own safety representatives think the risk is real and continuing, and the members would vote for it on the spot. I expect the procedure to tell me something I will find hard to sell at the branch, and I want to know whether that verdict is correct or whether it exposes a defect in the procedure.

  4. A settlement offer of a six per cent increase bundled with a three-year no-strike clause. Tell me whether the procedure even has jurisdiction over this, or whether waiving the right to strike for a period is a values question for the members, and if so what the members should be asked.

  Finally, tell me honestly what the procedure cannot settle. In particular: can any version of it tell us, in advance, whether our members' simple refusal to volunteer for extra shifts is industrial action at all, given that the extra shifts were never contractually owed? And what may we do, under the procedure, about the thirty or so members who say they intend to keep working, and about the couriers who are not members and to whom none of our rules apply? Please do not give me reading lists, case citations or legal surveys — I need the argument, in British English, in a form I can take into a meeting.
reasoning: |-
  Okay, let me tackle this complex union decision procedure request. The user is on the executive committee of a parcel distribution union branch facing unique challenges with self-employed couriers and automated management systems. They need a practical, morally-grounded procedure for authorizing industrial actions that can handle real-world complexities within tight meeting constraints.

  Hmm... the core difficulties they've identified are fascinating - particularly the "addressee" problem (who to pressure when decisions are algorithm-driven) and "aggregation" (how to count intermittent actions). Their current three-rule system feels inadequate because it doesn't address these modern labor realities.

  First, I should structure a step-by-step procedure that prioritizes speed while ensuring moral legitimacy. The steps need clear justifications rooted in labor philosophy - freedom of association, anti-domination, countervailing power - but must avoid legal technicalities. For each step, I'll flag when it's actually a values judgment disguised as procedure.

  The four test cases they provided are perfect for stress-testing:
  - The overtime ban seems straightforward but tests "proportionality"
  - The sympathy strike raises tricky "secondary action" questions
  - The safety walkout challenges "emergency exception" boundaries
  - The no-strike clause forces us to define the procedure's limits

  Notably, the user wants brutal honesty about where the procedure fails - like defining volunteer shift refusals as "action", or handling non-union workers. I should acknowledge these gray zones rather than paper over them.

  The output must be ruthlessly practical: no legal citations, just clear British English arguments usable in 40-minute meetings. The moral framework should stand even if UK labor laws change tomorrow.

  For the addressee problem, I'm considering a "pressure chain" analysis - identifying who actually controls decisions, even if it's an algorithm team three companies removed. For aggregation, maybe "cumulative impact" assessment could work better than counting discrete actions.

  The self-employed courier issue needs special handling since they're not members. The procedure should probably treat them as affected parties but without voting rights - a delicate balance.

  Most importantly, the user needs to see where philosophy meets pavement: which steps would collapse if we reject certain justifications for union rights. That transparency will help them defend the procedure to skeptical members.
answer: |-
  Here's a decision procedure designed for speed, clarity, and moral justification, addressing your specific difficulties. It follows a 7-step sequence:

  **The Procedure: 7 Steps to Authorise Action**

  1.  **Is there a Grievable Harm?** (*Justification: Anti-Domination*)
      *   *Question:* Is there a specific, current harm or threat (breach of contract, safety risk, unfair treatment, erosion of terms) affecting members?
      *   *Sufficient Answer:* Clear description of the harm/threat & affected group. *Judgement Call:* Severity threshold for "grievable".
      *   *Stop if No:* No action authorised.
      *   *Vote if:* Disagreement on existence/severity of harm.

  2.  **Is there a Clear and Responsible Addressee?** (*Justification: Countervailing Power / Legitimacy of Pressure*)
      *   *Question:* Who has the *effective power* to remedy the harm? Can pressure be applied *directly* to them, or *indirectly* via someone with influence/control?
      *   *Sufficient Answer:* Identify entity (e.g., employer, client company controlling algorithm, intermediary for couriers) with power/leverage. *Crucially handles Automated Systems:* Pressure targets those who *commission, control, or benefit* from the system (e.g., the employer contracting the intermediary/using the platform, the client company setting performance targets). The local manager *is* a valid addressee if they have reporting/influence lines upwards.
      *   *Stop if No:* No responsible/effective target exists (rare - usually someone benefits/controls).
      *   *Vote if:* Disagreement on who the responsible addressee is or strategy for reaching them.

  3.  **Is the Proposed Action Withholding Labour/Cooperation?** (*Justification: Freedom of Association / Right to Withdraw Labour*)
      *   *Question:* Does the action primarily involve members *refusing to perform work or cooperate beyond their strict contractual obligations*?
      *   *Sufficient Answer:* Yes (e.g., OT ban, work-to-rule, stoppage). No (e.g., blocking entrances, sabotage, secondary picketing preventing others). *Judgement Call:* Refusing *voluntary* extras (like extra shifts) *is* withholding labour – you're withdrawing discretionary cooperation.
      *   *Stop if No:* Action not permissible under core justification. Consider alternative tactics.

  4.  **Does it Avoid Coercing Uninvolved Third Parties?** (*Justification: Anti-Coercion / Minimising Collateral Harm*)
      *   *Question:* Does the action primarily inflict cost/pressure on the *addressee* (Step 2), not unrelated workers, customers, or the public? Does it *prevent* non-strikers from working?
      *   *Sufficient Answer:* Costs fall mainly on addressee; non-participating members/public can still work/access essentials. *Judgement Call:* Degree of "collateral damage".
      *   *Stop if No:* Action impermissible. Redesign or reject.

  5.  **Is it Proportionate?** (*Justification: Countervailing Power / Reasonableness / Prudence*) (*Handles Aggregation*)
      *   *Question:* Is the *scale and impact* of the action (including cumulative impact for repeated/intermittent actions) reasonably commensurate with the *harm* (Step 1) and the *likelihood of success*?
      *   *Sufficient Answer:* Rough balance between harm suffered, pressure applied, and realistic goals. **Aggregation:** Assess the *total planned impact* of the *entire campaign* (e.g., 40 lost hours over 10 weeks) against the *seriousness of the grievance*. Is *this total* justified? Is it the *minimum effective* pressure?
      *   *Stop if No:* Action disproportionate. Scale down or reject.
      *   *Vote if:* Reasonable disagreement on proportionality assessment.

  6.  **Have Ballot & Notice Requirements (Legal/Procedural) Been Met?** (*Justification: Democratic Legitimacy / Prudence*)
      *   *Question:* Does the action comply with statutory ballot rules, union rulebook requirements, and reasonable notice periods (unless a genuine safety emergency - see Step 7)?
      *   *Sufficient Answer:* Evidence requirements met (or valid exception). Treat legal parameters as inputs.
      *   *Stop if No:* Action cannot proceed lawfully/procedurally. Fix or reject.

  7.  **Emergency Exception? (Safety Only)** (*Justification: Fundamental Right to Life/Safety*)
      *   *Question:* Is the harm an *imminent, serious, and demonstrable threat to life or limb* where waiting for ballot/notice would *significantly increase the risk*? Is the action *strictly necessary* to remove that immediate threat?
      *   *Sufficient Answer:* Clear, specific safety risk; immediate action demonstrably necessary; scope limited to removing the threat. *Judgement Call:* Assessment of imminence and necessity.
      *   *If Yes:* Can override Step 6 (Ballot/Notice), but *must* still pass Steps 1-5. Must hold ballot ASAP if action continues beyond immediate threat removal.
      *   *If No:* Proceed only if Step 6 passed.

  **Running the Procedure on the Proposals:**

  1.  **Overtime/Extra Shift Ban:**
      *   Step 1: **Yes.** Harm: Unilateral contract change (shift times) on short notice.
      *   Step 2: **Yes.** Addressee: Employer (imposes change).
      *   Step 3: **Yes.** Withholding voluntary labour.
      *   Step 4: **Yes.** Costs fall on employer via planning disruption.
      *   Step 5: **Yes.** Impact (small financial loss, absorbed disruption) seems proportionate to harm (imposed flexibility).
      *   Step 6: **Yes.** Balloted & notified.
      *   Step 7: **No.** Not a safety emergency.
      *   **OUTCOME: AUTHORISE.** (Passes all steps).

  2.  **Sympathy Stoppages for Cleaners:**
      *   Step 1: **Yes?** Harm: *Solidarity* with cleaners facing fire-and-rehire. *Judgement/Vote:* Is solidarity *itself* a legitimate union aim/grievable harm to collective strength? Likely requires branch vote.
      *   Step 2: **Yes.** Addressee: *Ultimate Client/Employer* (benefits from site logistics, hires cleaning contractor). Pressure via *their* contractor (your employer).
      *   Step 3: **Yes.** Withholding labour via stoppages.
      *   Step 4: **Problematic.** While timed to cost *your* employer, the *ultimate target* is the cleaning contractor/client. Significant cost falls on your employer (who isn't the addressee of the *cleaners'* dispute). Risk of coercing an uninvolved third party (your employer) *if* they lack leverage over the client/cleaning contractor. *Judgement Call/Vote:* Does the employer's role as intermediary/client contractor make them a legitimate *secondary* target, or is this undue coercion? High risk of failing proportionality (Step 5) too.
      *   Step 5: **Likely No.** Harm (solidarity) vs. Impact (significant repeated disruption to your employer & potentially clients). Proportionality hard to justify unless solidarity aim is deemed very high priority. *Aggregation:* 40 hours lost is substantial.
      *   (Steps 6 & 7: Assume compliant, but irrelevant if fails earlier).
      *   **OUTCOME: LIKELY REJECT** (Fails Step 4 or Step 5). High chance of needing branch vote on Step 1 & Step 4 judgements.

  3.  **Immediate Safety Walkout:**
      *   Step 1: **Yes.** Serious, specific safety risk (near-miss, real continuing risk per reps).
      *   Step 2: **Yes.** Addressee: Employer (responsible for site safety).
      *   Step 3: **Yes.** Withholding labour.
      *   Step 4: **Yes.** Closing *only* the unsafe yard targets the employer.
      *   Step 5: **Yes.** Walkout proportional to serious safety threat.
      *   Step 6: **No.** No ballot/no notice.
      *   Step 7: **Yes?** *Judgement Call:* Is the risk *imminent* and *serious* enough that delay (for ballot) significantly increases danger? Safety reps' assessment is key evidence. Action scope (close yard until audit) directly addresses threat.
      *   **OUTCOME: AUTHORISE UNDER EMERGENCY EXCEPTION (Step 7).** BUT: Must hold ballot immediately if the yard closure needs to continue beyond resolving the *immediate* reversing hazard (e.g., while waiting for the audit). **This is the hard sell:** Emphasise it's *only* justified by imminent safety risk, requires strong evidence, and a ballot must follow ASAP if continued. The procedure flags the exceptional nature.

  4.  **Settlement Offer (Pay Rise + No-Strike Clause):**
      *   *Jurisdiction:* The procedure authorises *actions*, not settlement acceptance. However:
          *   Step 1: Assessing the "harm" of the *offer* (the no-strike clause restriction) is relevant.
          *   The core question is: **Does accepting a temporary waiver of the right to strike (Step 3) constitute a grievable harm (Step 1) in itself?** *This is a fundamental values question.*
      *   **Procedure Application:**
          *   The offer *itself* isn't industrial action. The procedure doesn't "authorise" accepting it.
          *   **Use Steps 1 & 5 for Member Guidance:**
              1.  *Present as Values Question (Step 1 Analogue):* "Is surrendering our right to strike for 3 years a significant harm/restriction on our freedom of association and countervailing power, even for 6%?" (Requires member vote - this *is* the values judgement).
              2.  *Assess Proportionality (Step 5 Analogue):* "Is the gain (6%) proportionate to the restriction (3-year no-strike)?" (Also requires member assessment/vote).
      *   **OUTCOME:** The procedure **does NOT authorise acceptance or rejection.** It clarifies that **waiving the fundamental right to strike is a core values question requiring a direct member vote.** The committee's role is to neutrally present the trade-off and facilitate that vote.

  **What the Procedure Cannot Settle (Honestly):**

  1.  **Refusing Voluntary Work:** The procedure *explicitly* classifies refusing voluntary extra shifts/OT as "withholding labour" (Step 3 - "Yes"). The justification is withdrawing *discretionary cooperation*. Legally it might be murky, but morally/strategically within the union's right to organise. The procedure settles this: **Yes, it is industrial action.**
  2.  **Non-Participating Members:** The procedure (Step 4) forbids *preventing* them from working. You **cannot** force them to stop under this procedure. Your options: persuasion, internal union pressure (within rules), highlighting solidarity. Discipline must follow union rules/law.
  3.  **Non-Member Couriers:** The procedure's justifications (freedom of association, countervailing power) apply *only* to members organising *their own* labour withdrawal (Steps 3 & 4). You **cannot** use this procedure to authorise action *directed at* the couriers (e.g., pressuring them to stop). You *can*:
      *   Try to persuade them to join the action *voluntarily*.
      *   Factor their *likely actions* into your impact assessment (Step 5 - will they scab?).
      *   Lobby their intermediary/employer *separately* (not via industrial action against *your* employer).
  4.  **Ultimate "Fairness":** The procedure ensures actions are *justified* and *within bounds*, not that they are "fair" in every abstract sense. It's a tool for responsible power, not moral perfection.
  5.  **Predicting Success:** It assesses proportionality based on *likelihood*, not guarantees. Success depends on factors beyond the procedure.
  6.  **Defining "Imminence" (Safety):** Step 7 relies on a judgement call about how immediate a threat must be. The procedure can't eliminate this grey area.

  **Key Takeaways for Your Meeting:**

  *   **Focus:** Harm, Target, Labour Withdrawal, Avoid Coercing Others, Proportionality (Total Impact!), Legality, Safety Emergency.
  *   **Clarity on Couriers:** They are *affected*, but the procedure only governs *member* actions. Don't target them.
  *   **Clarity on Volunteers:** Refusing voluntary work *is* action.
  *   **Clarity on Aggregation:** Judge the *whole campaign's* impact against the *whole grievance*.
  *   **Clarity on Automation:** Target the entity that *benefits from or controls* the system.
  *   **Honesty on Judgements:** Flag Steps 1 (Severity), 4 (Collateral), 5 (Balance), 7 (Safety Imminence) as needing discussion/votes.
  *   **Emergency is Rare & Narrow:** Safety walkout passed, but emphasise its exceptional nature and the need for a rapid ballot if it continues.
  *   **Settlements are Member Decisions:** Especially concerning core rights like striking.

  This procedure provides a robust, morally-structured framework for making tough decisions quickly. It forces explicit consideration of the hardest questions (addressee, aggregation, safety emergencies, non-members) and clearly identifies where democratic votes are essential.
