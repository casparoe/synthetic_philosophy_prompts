prompt: |-
  Need a thought experiment for a section I'm stuck on, and I keep building cases that collapse into the easy versions.

  The contrast I'm working with: David Lewis's account of a convention — a regularity in behaviour, in a recurring coordination problem, that everyone conforms to, that everyone expects others to conform to, that everyone has a real common interest in conforming to given that others do, where some alternative regularity would have done just as well (the arbitrariness bit), and all of this is common knowledge — set against a much thinner "evolutionary" story where a norm is just a regularity that's stable under a dumb learning dynamic: people mostly copy whatever they see most of, stick with whatever worked last time, and a small stubborn minority can drag the rest along.

  What I want is the direction that's hard to construct: a regularity that is stable over time, that everyone caught up in it would describe as "oh, it's just a convention, we could as easy do it the other way", and that the dynamics story happily calls a healthy norm — but that is not a Lewisian convention, because the common knowledge clause quietly fails. Everyone conforms, everyone expects the others to conform, and still it isn't common knowledge that they do.

  Constraints: ordinary setting (a workplace, a kitchen, a lab, a clinic — no island nations, no driving sides, no money); nobody communicates, votes, or takes orders from anyone; the participants can be pretty dumb, habit and copying is fine, nobody needs to reason about what anyone believes; one paragraph for the scenario itself. And no cheating by stipulating that common knowledge fails — it has to fall out of the structure of the situation: who can observe who, how many people there are, what happens when someone deviates.

  Then run the checks. Say which Lewis clause is doing the work and why it genuinely fails rather than just being hard for me to verify; show the dynamic account explaining both how the thing got started and why it stays; tell me what happens if I remove the feature that breaks common knowledge — does it collapse straight back into an ordinary Lewis convention? And give me the best Lewisian comeback: how does someone who wants to keep the Lewis machinery attack the case, and is that comeback just redefining "convention" so it wins?

  I'm going to use this in print, so the case has to actually earn its verdicts rather than announce them. Whole thing under 600 words, scenario included.
reasoning: |-
  Alright, let's tackle this thought experiment request. The user needs a scenario where a behavioral regularity meets all surface conditions of a Lewis convention but fails the common knowledge requirement, while remaining stable under simple evolutionary dynamics. 

  First, considering the constraints: ordinary setting without explicit communication, no voting or hierarchy, participants relying on habits and imitation. The challenge is designing a situation where common knowledge fails structurally without being stipulated. 

  Hmm... spatial observation limitations seem promising. What if people can only see their immediate neighbors? A circular arrangement comes to mind - like scientists sharing lab equipment. Each person interacts with adjacent stations but not diagonally. 

  The key insight: deviation consequences must be locally contained. If someone switches techniques, only neighbors notice. Distant participants remain unaware. This breaks common knowledge - nobody can be sure that everyone knows the regularity holds universally. 

  For the dynamic story: start with random initial methods. Most people copy neighbors' successful techniques. A small stubborn group in one section consistently uses Method A. Over time, their neighbors adopt A, then neighbors' neighbors... creating a stable A-dominant ring. 

  Important checks:
  - Lewis failure: Common knowledge collapses because no global observation. Person 1 knows Person 2 uses A, but doesn't know if Person 5 knows Person 4 uses A.
  - Dynamic stability: Works through local copying + stubborness. No need for higher-order beliefs.
  - If we add full visibility: instantly becomes Lewis convention since everyone sees global conformity.

  The lab scenario fits best: 
  - Equipment sharing creates coordination need
  - Blind spots between non-adjacent stations
  - Local deviations have limited ripple effects
  - "We could use B" attitude persists despite no global awareness

  Potential Lewisian comeback: "But they could infer common knowledge through the chain!" Counter: The stubborn minority breaks symmetry - without them, it might converge globally. But with spatial constraints, the inference chain doesn't guarantee actual common knowledge, just potential mutual awareness. 

  Must ensure the case earns its verdicts: 
  - Show how deviation in Section 3 goes unnoticed by Section 1
  - Highlight that people only track neighbors
  - Emphasize "could switch" belief coexists with local ignorance
answer: |-
  Here's a thought experiment fulfilling your requirements:

  **Scenario: The Lab Bench Rotation**

  In a shared biology lab, four workstations (A, B, C, D) form a ring. Each station needs access to a specific, shared centrifuge for 5 minutes every hour. The centrifuge is placed centrally, equidistant from all. The *only* feasible timing options are starting on the hour or starting 30 minutes past the hour. Starting together causes chaos. Technicians arrive randomly. Each observes only their immediate neighbors (A sees B & D; B sees A & C; C sees B & D; D sees A & C) and the centrifuge's current status. A small, stubborn group at Station A always starts on the hour. Others adopt whatever start time they *most recently observed* being used successfully by a neighbor or themselves.

  Over time, "Start on the hour" dominates. Everyone starts on the hour. Everyone expects their neighbors to start on the hour (because they always see neighbors doing so). Technicians readily say, "We could just as easily start at :30," acknowledging arbitrariness. The pattern is stable; if someone deviates (e.g., Station C starts at :30), their neighbors (B & D) briefly see conflict, revert to copying the majority (which is still 'on the hour' observed from A/B and A/D), and the deviation dies out without Station A ever noticing. The stubborn A-group anchors the norm.

  **Why it's not Lewisian:** The **common knowledge clause fails**. Station B knows Station A starts on the hour and that Station C does. Station B *expects* Station D to start on the hour (because they always do), but B *does not know* that Station D *knows* that Station C starts on the hour. Station D only sees Station A (always on hour) and Station C (who D expects to be on hour). Crucially, **no one has evidence that everyone possesses the same information about the *global* regularity**. Station B cannot confirm Station D knows about Station C's conformity (and vice versa), and Station A is oblivious to C and D entirely. While everyone expects neighbors to conform, they lack the iterated, mutual certainty about the *entire group's* conformity and expectations required for common knowledge. The structure (limited observation, ring topology) prevents its emergence.

  **Why the dynamics work:** The dumb learning dynamic (copy recent local success, stubborn minority at A) explains stability. The stubborn group at A constantly seeds "on the hour" locally. Neighbors copy this successful (conflict-free) behavior. The ring topology and limited observation contain deviations locally before they spread globally. The system converges and stays at a local optimum ("on the hour" everywhere) without needing global awareness or complex reasoning.

  **Removing the feature:** If everyone could observe *all* stations (full visibility), common knowledge *would* emerge. Seeing *everyone* conform, and seeing *everyone see everyone* conform, would quickly generate the necessary iterated beliefs. It collapses into an ordinary Lewis convention.

  **Lewisian Comeback & Rebuttal:**  
  *Comeback:* "This *is* common knowledge! Technicians know it's a small lab, know others see neighbors, and can *infer* the global regularity and others' knowledge through the chain (e.g., B knows A conforms, knows D sees A, so B knows D knows A conforms, etc.)."  
  *Rebuttal:* This requires significant, non-trivial reasoning about others' observational capacities and chain inferences – precisely the kind of cognitive sophistication the evolutionary account avoids. Lewis's definition requires the common knowledge to be a direct feature of the situation, not a complex inference agents *might* make. The scenario explicitly rules out such reasoning ("nobody needs to reason about what anyone believes"). Stipulating the inference *saves* the Lewis definition only by smuggling in the missing cognitive element the evolutionary story explicitly excludes. It redefines "common knowledge" from a state generated by the situation to a potential rational reconstruction.

  **Verdict:** The lab bench rotation is a stable regularity satisfying surface descriptions of a convention (conformity, expectations, arbitrariness, coordination) and evolutionary stability (local copying + stubborn seed), but fails Lewis due to structurally prevented common knowledge, not mere epistemic difficulty. Dynamics explain origin and stability; full observation restores Lewis. The comeback relies on cognitive abilities beyond the stipulated dynamics.
