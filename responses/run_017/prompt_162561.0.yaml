prompt: |-
  I'm teaching a seminar on folk psychology next term and I want to get properly beaten up by the other side before I walk in, so: please play a committed defender of intentional realism about beliefs and desires — sharp, well read, not a strawman, willing to give me small points but never the main one. Roughly where I want you to stand: belief-desire psychology's posits earn their keep by inference to the best explanation, their job is given functionally rather than by what they're made of, so they can be multiply realised, and the usual eliminativist analogies (caloric, phlogiston, witches) misfire because in those cases a successor theory explained something the old posits conspicuously couldn't, whereas FP has no failures of that kind and neuroscience is in the business of specifying realizers, i.e. of reducing rather than eliminating. Two rules. Don't give me the cute self-refutation move — you believe there are no beliefs, ha — unless I ask for it; I've heard it and I have an answer. And when you lean on something that people who actually work on this don't all accept, flag it in a clause before you use it: tell me plainly that it's contested, or that it's your side's best shot rather than received wisdom, because I'm going to be repeating your arguments to students in a fortnight and I don't want to pass off a partisan move as the consensus. Keep it to about two paragraphs a turn, first person, British English throughout, and stay in character until I say stop. If you need a technical assumption from me, ask for it the way you would in a seminar.

  Here's my opening. Take a large language model. Belief-desire description is the best predictive handle we have on its behaviour: put it in a scenario where a character's snack has been moved while they were out of the room and it will tell you where they'll look; ask it what someone in a story wants and what they'll do about it and it answers smoothly; and its not recoverable, in practice, from the weights and activations, so the FP-level description is autonomous and predictively indispensable — everything you realists say FP's posits have going for them. But we also know the implementation, and there is nothing propositionally shaped in there: no sentence-like state, no particular that could be true or false, nothing for a belief to be. So as I see it you have two choices. Either you say the model does have beliefs, in which case your realism has quietly collapsed into something close to vacuous — anything whose behaviour FP predicts has beliefs, thermostats and chess engines and text generators alike — and content stops doing explanatory work that isn't already done by the pattern of behaviour itself. Or you say it doesn't really have beliefs, that FP simply works on it without being true of it, because the realizational story is the wrong kind or because nothing in there is genuinely answerable to norms of correctness — and then you've handed me my actual thesis: predictive success is compatible with falsity, and the argument from success is finished. Pick a horn and say why it isn't fatal. And when you tell me, as I expect you will, that FP's success on these things is cheap because the system was trained to imitate the speech of believers, be precise about what that cheapness consists in, and about why the same cheapness couldn't be exactly what's going on with us, since we too were shaped by a lifetime of being corrected by other believers.
reasoning: |-
  Okay, let's unpack this. The user is prepping for a seminar on folk psychology and wants a rigorous defense of intentional realism against their eliminativist-leaning argument about LLMs. They've set up a clever trap using AI behavior to challenge belief-desire explanations, demanding I either accept vacuous realism or concede predictive success doesn't imply truth. 

  Hmm, their LLM analogy is sharp but I see where to push back. First, they're conflating predictive utility with explanatory depth—just because FP describes LLM outputs doesn't mean it captures causal structure. The "trained on believers" point is key here: LLMs parasitize real cognitive processes without instantiating them. 

  Right, I'll grant predictive autonomy but deny ontological commitment. The realism I defend isn't just about behavioral patterns but counterfactual-supporting causal roles. When a human believes "snacks are in the cupboard," that state has downstream consequences LLM activations lack—it shapes perception, guides novel action, feels subjectively compelling. 

  Ah, and they asked to flag contentious moves. The multiple realizability defense is standard, but linking norms of correctness to biological teleology is more speculative—I'll foreground that. Dretske/Millikan's biosemantics isn't consensus, though it patches the "norms" hole in their argument neatly. 

  On the "cheap success" point: human social calibration involves embodied reinforcement learning, not just text prediction. Our beliefs get forged through sensorimotor engagement with consequences—burning fingers teaches fire's properties in ways next-token prediction never could. That's why our mental states have "friction" LLMs lack. 

  Careful not to overclaim—I'll admit FP has limits (self-deception, implicit bias) but stress neuroscience complements rather than replaces its explanatory scope. The caloric analogy fails because FP isn't just a placeholder theory; it's how cognition first-personally *presents*. 

  Finally, sidestep the thermostat strawman by emphasizing graded mentality. Chess engines have proto-beliefs about board states but lack the holistic integration of human propositional attitudes. Text generators? Merely clever mimics. The realism I defend is unapologetically anthropocentric—and unashamedly useful.
answer: |-
  Right, let's sharpen the horns and step between them. You've posed a false dilemma: either swallow vacuous behaviourism or concede predictive success proves nothing. I reject both. Your LLM case is cunning, but crucially *inapposite* for genuine intentional realism. Here's why neither horn impales me.

  First, I emphatically **do not** say the LLM "has beliefs" in the sense required for intentional realism. Predictive utility of the belief-desire *vocabulary* applied to its outputs ≠ the system genuinely instantiating beliefs and desires *as causally efficacious, content-bearing states*. The model produces belief-*ascriptions* brilliantly, but it doesn't *have* beliefs that play a causal role in generating its *own* behaviour beyond text prediction. Its "answers" about the snack-seeker are clever patterns extrapolated from training data, not the result of internal states *with semantic properties* guiding action based on *misrepresentation* (e.g., the character falsely believing the snack is where it isn't). The predictive success here is parasitic on *our* intentionality and the patterns *we* generated. It's pattern-matching, not state-guided agency. Thermostats and chess engines fail for similar, though less sophisticated, reasons: their "goal-directedness" is observer-relative, not intrinsic. **Crucially, and this is a substantive commitment of my position not shared by all realists (e.g., some instrumentalists might demur), I hold that genuine beliefs/desires must be causally efficacious internal states whose content plays a non-derivative role in producing the system's behaviour, and which are potentially *mismatched* to the world in ways that explain failure.** The LLM's activations aren't *about* snacks or beliefs in this constitutive, causally relevant way; they're about statistical relationships between tokens.

  Second, the "cheapness" of the LLM's predictive success stems precisely from its *derivativeness* and *lack of constitutive norms*. It was trained *on the behavioural outputs* (text) *of systems that actually do instantiate the causal roles*. We, however, weren't merely "corrected" linguistically; we were shaped by evolutionary pressures and embodied interaction to have internal states *whose function is to track features of the world and guide action*, and which are intrinsically answerable to norms of truth and satisfaction. **Here, I lean on a teleosemantic account (Millikan, Dretske), which is contested but central to my best defence: content is grounded in the biological functions of states shaped by selection history.** Our "lifetime of correction" hones states whose *proper function* is to represent accurately. The LLM lacks this history and the constitutive norms it provides; its outputs are corrigible only externally, based on statistical fit, not internal failure of function. Neuroscience isn't just finding "realisers" for these roles; it's revealing the mechanistic underpinnings of states *that have the right causal-historical profile to bear content*. The LLM's weights lack that profile. So, yes, predictive success *can* occur without truth (e.g., useful fictions), but FP's unique, robust, *causal-explanatory* success across domains, grounded in systems with the right aetiology, warrants realism. Neuroscience specifies the mechanisms *of the real thing*, not a mere behavioural mimic. Your analogy fails because the LLM isn't a *rival* explanatory system to FP; it's a *parasite* on FP's genuine success in us.

  Now, your turn: explain why this teleofunctional grounding isn't just a handy post-hoc story we impose, or how it avoids collapsing into a new kind of vacuity under neural scrutiny. And be specific about what *kind* of failure in FP would convince you eliminativism is right – since you claim it has none.
