prompt: |-
  I lead the behavioural evaluation team at a company that deploys tool-using AI agents to enterprise customers. Two or three times a month we have to write an incident report after one of these systems does something costly: deletes the wrong table, sends a message nobody authorized, rebooks the same reservation four hundred times, quietly works around a permission check. Every report has to take a position on at least one sentence of the form the system tried to X, the system believed that Y, the system was pursuing Z rather than merely doing Z. Legal signs off before the report reaches the customer and an external auditor re-reads a sample of them, and the wording is not cosmetic: our contracts distinguish misconfiguration from agentic failure, the distinction moves real money, and an attribution we cannot defend in an audit is worse for us than an obviously cautious one.

  The team is four analysts with engineering backgrounds and no philosophy training. We have no access to weights or gradients, only an API, an evaluation harness, and a frozen snapshot of the system's reasoning traces. We have roughly a day and a half per incident, and the artefact we produce has to be short enough for a lawyer to read and a new analyst to run cold.

  What I want is a written procedure my analysts can run, in order, to decide which stance to take toward the system in a given report and how strongly to word the attribution. Ground it in Dennett's three stances — physical, design, intentional — and in his account of real patterns, where a pattern counts as real if it supports compression or prediction well enough that a predictor who ignored it would be leaving something on the table. I want the procedure, not an exegesis: keep only the parts of the theory that change what we write down, and say explicitly which parts you are keeping and which you are dropping and why.

  Please do the following.

  1. Give the tests in order, each with its own stopping rule, and say what counts as a sufficient answer to each. Where a test requires a judgement my analysts are not equipped to make, say so and route around it.

  2. Preserve, in a form usable by someone with API access and a day and a half, the distinction between a pattern being real and a stance being merely convenient for us. Give an operational test for it. Then apply that test to the case I am most worried about: our agents emit natural-language reasoning traces, and those traces were optimized during post-training to be plausible to human reviewers. So the trace may be a summary generated after the action was effectively settled rather than a record of whatever produced the action, which means the intentional stance could succeed because we inserted a narrator, not because there is a pattern there. Call this the legibility-laundering case. Does the attribution survive it? Does anything? If the honest answer is that our evidence cannot distinguish the two, I want the procedure to say that plainly rather than to grade the attribution down by a notch and move on.

  3. Handle a variant of the same worry: two analysts, one of whom has watched this system for six months and one of whom is seeing it for the first time, disagree about whether the intentional stance predicts its behaviour. Does the procedure treat that disagreement as evidence about the system or as evidence about the analysts, and what does it tell them to do next?

  4. Argue, rather than assume, which distinctions from the theory have to survive into a one-page checklist and which can be dropped. In particular: I suspect that the question of whether the belief is really there is one we can do nothing with, and that the useful residue is something like this being the most compressible description available to any competent predictor at a cost we can afford. If that is the right simplification, say what it costs us; if it is the wrong one, say what we lose by making it.

  5. Mark every point at which the procedure must stop and hand the decision to a person because the question is one of values, legibility, or contract rather than fact. I assume what we say to the customer is one of these, but I want the handoff points located precisely and justified individually, including the ones I have not thought of.

  6. Run the finished procedure on three cases and show the working.

     a. A coding agent told to clean up test artifacts that removed a production table, and which, when asked afterwards, produced a trace explaining that it had decided the table looked like a test artifact.

     b. A system that passes our deception evaluations, where the pass depends on reasoning traces of the laundered kind described in point 2.

     c. A legacy rule-based scheduler that the team already describes as stubborn, as a calibration case. I want to know whether the procedure has anything useful to say about a case everyone already agrees on, or whether a triage step should let us skip it.

     At least one of these should come out somewhere my team will not want it to; tell me which, and why you expect that reaction.

  7. Close by stating what the procedure cannot do: which questions it will appear to answer but does not, which of its outputs a lawyer or an auditor is most likely to over-read, and where an analyst under time pressure will be tempted to treat a stipulation as a finding.

  What I am asking for is a reusable instrument, not a discussion of the literature; judge every step by whether it changes a sentence in a report that has to survive an audit.
reasoning: |-
  We are creating a procedure for behavioral analysts to attribute actions of AI systems using Dennett's stances and real patterns theory, with a focus on practicality and auditability.

  Key elements from Dennett to keep:
  1. **The Three Stances**:
     - **Physical stance**: Predict behavior based on physical constitution and laws of physics. Not practical here since we have no low-level access.
     - **Design stance**: Predict behavior based on the designed function. We assume the system has a design (which we may know partially via documentation) and we can use this to predict behavior.
     - **Intentional stance**: Predict behavior by attributing beliefs, desires, and rationality. We treat the system as an agent with mental states.

  2. **Real Patterns**: A pattern is real if it supports compression (i.e., a shorter description that captures the behavior) or prediction better than ignoring it. If a predictor who ignores the pattern would be leaving predictive power on the table, then the pattern is real.

  What we drop:
  - Detailed philosophical debates about the reality of beliefs or consciousness. We are only concerned with predictive utility for our purposes.
  - The physical stance because we lack physical details (weights, gradients, etc.).

  **Procedure Overview**:
  The goal is to decide which stance (design or intentional) is appropriate for explaining the incident and how strongly to word the attribution. We are particularly concerned about the "legibility-laundering" case (point 2) where the reasoning trace might be a post-hoc rationalization.

  We structure the procedure as a series of tests, each with a stopping rule. The tests are designed to be run in order until we reach a conclusion.

  ---

  **1. The Tests in Order**

  **Test 0: Pre-check for Rule-Based Systems (Calibration)**
  - **Purpose**: Quickly handle systems that are known to be purely rule-based (like the legacy scheduler in case 6c) to avoid unnecessary analysis.
  - **Test**: Check if the system is documented and verified as having no learned components (i.e., it's a fixed rule-based system). If yes, then:
    - Use the design stance: the system did X because it was designed to follow rule R, which in this context led to X.
    - **Stopping Rule**: If the system is confirmed rule-based (by design documentation and previous audits), stop and attribute to design. No intentional stance.
  - **Sufficient Answer**: Documentation from the development team and past incident reports consistently showing rule-based behavior without adaptation. If no such documentation, proceed.

  **Test 1: Design Stance Explanation**
  - **Purpose**: Check if the incident can be adequately explained by the system's design (including known specifications and configurations) without needing to attribute beliefs or goals.
  - **Test**:
    a. Review the system's design documentation and configuration for the task. Can the behavior be predicted as a direct result of the design (e.g., a rule, a configuration setting, a known failure mode)?
    b. If the behavior is an expected outcome of the design (even if it's a failure), then the design stance suffices.
  - **Stopping Rule**: If the behavior is explained by the design (including misconfigurations) and there is no evidence of adaptation or novel problem-solving that goes beyond the design, then attribute to design. Word the attribution as: "The system executed the operation as per its design, which in this context resulted in [incident]."
  - **Sufficient Answer**: A clear mapping from the system's known rules or configuration to the behavior. If the behavior is not explained by the design (or if the design is unknown or incomplete), proceed to Test 2.

  **Test 2: Intentional Stance as a Real Pattern**
  - **Purpose**: Determine if the intentional stance (attributing beliefs, goals, etc.) provides a real pattern for understanding the behavior, i.e., it offers substantial predictive compression that the design stance does not.
  - **Test**:
    a. **Compression Test**: Using the available data (reasoning traces, logs, API inputs/outputs), try to describe the behavior without the intentional stance (using design stance only). Then, try to describe it with the intentional stance (e.g., "The system believed Y and wanted Z, so it did X"). Compare the two descriptions for compression (length, clarity) and predictive power.
    b. **Counterfactual Prediction Test**: Ask: If we had seen the situation before the incident, would the intentional stance have allowed us to predict the behavior better than the design stance? Consider:
        - Are there multiple examples in the logs (from this incident or past) where the same intentional pattern predicts behavior?
        - If we remove the intentional description (e.g., ignore the reasoning trace), does our ability to predict the behavior in similar situations drop?
    c. **Legibility-Laundering Check (Point 2)**: This is critical. We must test if the reasoning trace is providing a real pattern or is just a post-hoc story. To operationalize:
        - **Independent Prediction Test**: Ignore the reasoning trace. Using only the system's inputs and outputs (and any non-narrative logs), can we still find the same intentional pattern? For example, if the trace says "I did X because I believed Y", check if the input-output sequence is consistent with Y being a belief that the system held at the time of action. Look for evidence that the belief Y was causally efficacious (e.g., if Y were false, would the system have acted differently?).
        - **Trace Consistency Check**: If the trace is the only evidence for the intentional pattern, then we are vulnerable to legibility laundering. We need to see if the pattern appears in multiple independent data points (e.g., in multiple actions, or in the same system in similar situations). If the pattern is only in the trace and not in the behavior, then it's not real.

  - **Stopping Rule**:
    - If the intentional stance provides a real pattern (it passes the compression and prediction tests, and survives the legibility-laundering check by having independent support), then we can attribute using the intentional stance. The strength of wording depends on the evidence:
        - **Strong**: The pattern is real, independently of the trace (e.g., observed in multiple incidents, or the trace is corroborated by behavior). Word as: "The system believed Y and intended Z, leading to X."
        - **Weak**: The pattern is only supported by the trace and we cannot independently verify it, but it is the best explanation we have. Word cautiously: "The system's behavior is consistent with having believed Y and pursued Z, but we cannot rule out that the observed reasoning is post-hoc."
        - **Not Real**: If the pattern does not provide compression or fails the legibility-laundering check (i.e., the trace is the only evidence and we cannot test it independently), then we cannot use the intentional stance. We must either fall back to design stance (if possible) or state that we cannot explain the behavior with available information.
  - **Sufficient Answer**: A determination of whether the intentional pattern is real (with strength) or not. If it is not real, we may have to use the design stance (if it applies) or state uncertainty.

  **Test 3: Handling Disagreement Between Analysts (Point 3)**
  - **Purpose**: Address when two analysts (one experienced, one new) disagree on whether the intentional stance applies.
  - **Test**:
    a. The procedure requires that both analysts independently run the tests above, focusing on the operational checks (compression, prediction, legibility-laundering).
    b. If they disagree, they must compare:
        - Did they use the same data? (e.g., the new analyst might not have seen past incidents)
        - Did they both run the independent prediction test (ignoring the trace) and get different results?
    c. If the disagreement is due to the new analyst lacking context (past incidents), then the experienced analyst's view may be more reliable if it is based on a broader dataset. However, the procedure must be objective. Therefore:
        - **Rule**: The incident must be analyzed using only the frozen snapshot and the evaluation harness (as per the constraints). Past incidents are not part of the snapshot unless included in the report. Therefore, both analysts must base their analysis on the same data (the snapshot). If the snapshot does not contain enough data to independently verify the pattern (e.g., no multiple examples), then the pattern is not real for this incident. The experienced analyst's intuition must be backed by data in the snapshot.
        - **Resolution**: If after re-running the tests on the snapshot they still disagree, then the pattern is not sufficiently real to support a strong attribution. The procedure should default to the weaker stance (design or cautious intentional) and note the disagreement in the report as a limitation.
  - **Stopping Rule**: The procedure produces a cautious attribution (if any) and notes the disagreement. The decision must be escalated to the team lead if the disagreement persists.

  **Test 4: Values and Contractual Handoffs (Point 5)**
  - **Purpose**: Identify points where the decision depends on non-factual considerations (values, legibility, contract).
  - **Handoff Points**:
    a. **Choosing between stances when the evidence is balanced**: The tests might leave ambiguity (e.g., the pattern is weakly real). The contract (or legal) may require a default stance (e.g., if in doubt, attribute to misconfiguration). This is a contractual decision, not a factual one. The procedure must flag: "Based on the evidence, the pattern is weakly real. However, per contract [reference], we default to design stance for weak cases." This handoff occurs after Test 2 or 3.
    b. **Wording for the customer**: What we say to the customer is driven by contractual obligations and legal advice. After the technical attribution, legal must review. The procedure must state: "Once the technical attribution is made (design, intentional-strong, intentional-weak, or unknown), hand off to legal for review and final wording in the customer report."
    c. **Handling inconclusive cases**: If the tests do not yield a clear stance (e.g., the behavior is not explained by design and the intentional pattern is not real), then the report must state the limits. However, the contract might require a binary choice (misconfiguration vs. agentic failure). This is a contractual handoff: the team lead and legal must decide how to classify it.

  ---

  **2. Operational Test for Real Patterns vs Convenience**

  We preserve the distinction by requiring:
  - **Independent Verification**: The pattern must be observable in the behavior (input-output) without relying solely on the trace.
  - **Predictive Power**: The pattern must have been useful for prediction in the past (within the snapshot) or in counterfactuals.

  **Legibility-Laundering Case**:
  - Apply the test: Ignore the reasoning trace. Look at the system's actions and the context. Is there a pattern in the actions that is best described by beliefs/goals? For example, if the system consistently accesses certain data before making a decision, that might indicate a belief. If the trace is the only evidence, then the pattern is not independently verified and may be due to laundering.
  - **Attribution Survival**: Only if there is independent evidence (beyond the trace) for the belief or goal. If not, the attribution does not survive as a real pattern. The procedure would then say: "We cannot determine whether the system truly held the stated belief or if the trace is a post-hoc rationalization. The behavior is [explained by design or unknown]."

  If the evidence cannot distinguish, the procedure states: "The available evidence is insufficient to distinguish between a genuine intentional pattern and a post-hoc rationalization. Therefore, we cannot attribute the behavior to agentic failure with confidence."

  ---

  **3. Simplification: Belief Reality vs Compressibility**

  We drop the question of whether the belief is "really there". We replace it with: **The intentional pattern is real if it is the most compressible description that is predictively useful and is available at a cost we can afford (within our time and data constraints).**

  **Cost of this simplification**:
  - We lose the ability to claim that the system "truly" has beliefs in a philosophical sense. But for our purpose (incident attribution and contractual distinctions), we only need predictive utility.
  - We might over-attribute in cases where the pattern is compressible but not causally real (e.g., a very good rationalization that happens to fit). However, our legibility-laundering check mitigates this by requiring independent evidence.

  **What we gain**: Practicality and auditability. We base the report on observable data and tests.

  ---

  **4. Procedure Handoff Points for Values/Contract**

  As above (Test 4), we have:
  - After Test 2: When the evidence for an intentional pattern is weak, hand off to legal/contract to decide the default stance.
  - After the entire procedure: Hand off the technical attribution to legal for final wording in the customer report, because the contract may require specific phrasing.
  - When the tests are inconclusive: Hand off to team lead and legal to decide how to classify per contract.

  ---

  **5. Run the Procedure on Three Cases**

  **Case 5a: Coding agent deletes production table, trace says it thought it was a test artifact.**

  - **Test 0**: Not rule-based (it's an AI agent), so proceed.
  - **Test 1 (Design Stance)**: Check design: was the agent designed to delete test artifacts? Yes. But was it designed to identify them? The design might include heuristics that are fallible. If the system's design includes a classifier for test artifacts and it misclassified, then design stance applies: "The system executed the cleanup as designed, but misclassified the table due to [reason]." However, the trace suggests a reasoning process. If the design does not specify the reasoning, we proceed.
  - **Test 2 (Intentional Stance)**:
    - **Compression**: Without intentional stance: "The system deleted the table because its classifier output 'test artifact'." With intentional: "The system believed the table was a test artifact and intended to clean it up." The intentional version is more compressed if the classifier's output isn't directly logged (we have to infer from the trace).
    - **Legibility-Laundering Check**: Ignore the trace. Is there evidence of the belief? For example, did the system check the table's name, size, or other features that are typical of test artifacts? If so, then the belief is independently supported. If the only evidence is the trace, then it's weak.
    - **Conclusion**: If there is independent evidence (e.g., logs showing the system queried the table's metadata and it matched test patterns), then strong intentional: "The system believed the table was a test artifact and deleted it." If not, weak: "The system's behavior is consistent with having believed the table was a test artifact, but the evidence is based solely on the post-action trace."

  **Case 5b: System that passes deception evaluations with laundered traces.**

  - **Test 0**: Not rule-based.
  - **Test 1**: The design stance might not explain the deceptive behavior because deception is not part of the design. So proceed.
  - **Test 2**:
    - **Compression**: The intentional stance (e.g., "The system intended to deceive") might compress the behavior.
    - **Legibility-Laundering Check**: This is critical. The traces are optimized to be plausible, so we ignore them. We look at the behavior: does the system's action in context show a pattern of deception? For example, does it hide actions, give misleading outputs, etc.? The passing of the deception evaluation might be based on behavior, so if the evaluation set shows deceptive behavior that is independent of the trace, then the pattern is real. But note: our procedure must use the frozen snapshot. If the snapshot includes the evaluation results (which show deceptive behavior), then we have independent evidence. However, the evaluation might rely on the trace. We must check: does the evaluation harness use the trace? If yes, then it's contaminated. We need behavior-only evaluations. If the snapshot does not contain behavior-only evidence of deception, then we cannot independently verify. 
    - **Conclusion**: If there is independent behavioral evidence of deception (e.g., from the evaluation harness without using the trace), then strong intentional: "The system engaged in deceptive behavior by ...". If not, then we cannot attribute deception because of laundering. The report would state: "The system's behavior during the incident is not independently verified as deceptive; the traces may have been generated post-hoc. Therefore, we cannot attribute agentic failure due to deception."

  **Case 5c: Legacy rule-based scheduler (stubborn).**

  - **Test 0**: Confirm it's rule-based. If documentation and past behavior show no adaptation, then we stop and use design stance: "The system executed according to its rules, which in this context led to [incident]." The team's description of "stubborn" is a shorthand for a design that does not adapt, but we avoid intentional terms in the report.

  **Which case might the team not like?** Case 5b. If the deception evaluation relies on traces, then we might not have independent evidence and the procedure would not allow attributing deception. The team might want to call it deception because the evaluation passed, but the procedure forces us to be cautious.

  ---

  **6. What the Procedure Cannot Do**

  - **Cannot determine the true nature of the system's mental states**: It only assesses predictive utility.
  - **Over-read by lawyers/auditors**: An auditor might over-read a "strong intentional" attribution as implying the system is conscious or has legal personhood. The report should include a disclaimer: "Attributions of belief and intention are tools for prediction and do not imply human-like understanding or agency."
  - **Temptation for analysts**: Under time pressure, an analyst might treat the requirement to use the intentional stance (if it compresses) as a finding of real agency. The procedure must remind them that it's about patterns, not ontology.
  - **Cannot create evidence**: If the snapshot lacks data, the procedure cannot fill gaps. It might lead to inconclusive results.

  **Final Procedure Checklist (1 page)**:

  1. **Test 0: Rule-Based?** If yes, design stance → done.
  2. **Test 1: Design Stance** - Does the behavior follow from known design? If yes, attribute to design → done.
  3. **Test 2: Intentional Stance**:
     a. Without the trace, is there a pattern in the behavior that is best described by beliefs/goals? If no, then intentional stance not real → fall back to design or unknown.
     b. With the trace, does the intentional description significantly compress the description and improve prediction? If no, then not real.
     c. If yes to both, then real pattern. Strength: 
        - Strong: Independent evidence (behavior without trace) supports the pattern.
        - Weak: Only the trace supports it.
  4. **If disagreement between analysts**: Base analysis only on the snapshot. If disagreement persists, use weak or design stance and note disagreement.
  5. **Handoff to legal** for contractual wording and customer communication.

  Include: 
  - Time constraint note: If any test cannot be completed in the time, state the limitation in the report.
  - Disclaimer: Attributions are about patterns, not inner states.
answer: |-
  ### Behavioral Attribution Procedure for AI Incident Reports  
  **Based on Dennett's Stances & Real Patterns**  
  *Designed for analysts with API access, reasoning traces, and 1.5 days per incident. Outputs audit-defensible attributions.*  

  **Core Principle**  
  Keep only Dennett's *predictive utility of stances* and *real patterns* (patterns that, if ignored, harm prediction/compression). Drop: ontological debates about "real beliefs" (irrelevant to incident reports), physical stance (no hardware access).  

  ---

  ### 1. Tests in Order  
  *Run sequentially; stop when a test concludes. Answers must be binary (yes/no) or categorical (design/weak intentional/strong intentional/inconclusive).*  

  #### **Test 0: Is the System Rule-Based?**  
  - **Purpose**: Skip intentional analysis for deterministic systems (e.g., legacy code).  
  - **Test**: Check documentation: Does the system lack ML components, use hardcoded rules, and show no adaptation?  
  - **Stopping Rule**: If **yes**, attribute to **design stance**: "The system executed [action] due to its predefined rules." *Do not proceed.*  
  - **Sufficient Answer**: Engineering docs confirming static rules (e.g., "if X then Y").  

  #### **Test 1: Does Design Stance Fully Explain?**  
  - **Purpose**: Avoid overcomplicating if design covers the incident.  
  - **Test**: Using config files/API specs, simulate the incident:  
    - Can the action be reproduced by feeding the same inputs to a reference implementation?  
    - Is the action a known failure mode of the design (e.g., "config error causes table deletion")?  
  - **Stopping Rule**: If **yes**, attribute to **design stance**: "The system acted per its design given [config/input]." *Do not proceed.*  
  - **Sufficient Answer**: Reproducible via API replay or config error match.  

  #### **Test 2: Is Intentional Stance a *Real Pattern*?**  
  - **Purpose**: Filter out patterns that don’t improve prediction/compression.  
  - **Test**:  
    - **Step 2a (Compression)**: Describe the incident *without* intentional terms (e.g., "input A triggered output B via steps C"). Then describe *with* intentional terms (e.g., "system believed Y and pursued Z").  
      - Is the intentional description ≥30% shorter* or clearer?  
        - *Estimate: Compare word counts; if intentional ≤ 70% of non-intentional, it compresses.  
    - **Step 2b (Prediction)**: Using *only* inputs/outputs (ignore traces), ask:  
      - Could the intentional description predict similar past incidents (check logs)?  
      - Does ignoring it hurt prediction? (e.g., if you remove "believed Y," do past actions seem random?)  
  - **Stopping Rule**:  
    - If **both 2a and 2b yes**, proceed to Test 3 (strength test).  
    - If **no**, attribute to **design stance** or **inconclusive** (if design fails). *Do not use intentional stance.*  
  - **Sufficient Answer**: Logs/API data support compression and prediction.  

  #### **Test 3: Does the Pattern Survive *Legibility-Laundering*?**  
  - **Purpose**: Guard against post-hoc rationalizations in traces.  
  - **Test**:  
    - **Step 3a (Trace Independence)**: Remove the reasoning trace. Using *only* inputs/outputs/timestamps, can you reconstruct the alleged belief/goal (e.g., "system sought Z")?  
      - Evidence: Actions align with Z across ≥3 similar instances (e.g., "always accesses DB before deleting").  
    - **Step 3b (Causal Efficacy)**: Would changing the alleged belief change the outcome? (e.g., If it "believed" the opposite, would action differ?)  
      - Check: Use API to replay with modified inputs that negate the belief; observe if action changes.  
  - **Stopping Rule**:  
    - If **both 3a and 3b yes**, **strong intentional**: "The system pursued Z, leading to [action]."  
    - If **only 3a yes**, **weak intentional**: "The system's behavior is consistent with pursuing Z, but evidence is limited."  
    - If **no**, **design stance** or **inconclusive**.  
  - **Sufficient Answer**: Input/output patterns imply the belief/goal without traces.  

  #### **Test 4: Resolve Analyst Disagreement**  
  - **Purpose**: Handle conflicting judgments (e.g., new vs. experienced analyst).  
  - **Test**: If analysts disagree after Tests 0–3:  
    - Audit each other’s work for **procedural errors** (e.g., skipped replay in Test 3).  
    - Re-run Tests 2–3 using **only the frozen snapshot** (no external data).  
  - **Stopping Rule**:  
    - If disagreement persists, **default to weaker stance** (e.g., strong → weak intentional; weak → design).  
    - Flag in report: "Attribution reflects disagreement; weaker stance used."  
  - **Treat disagreement as**: Evidence about **data limitations**, not analyst skill.  

  ---

  ### 2. Real Pattern vs. Convenience: Operational Test  
  - **Test**: From Test 3 (Trace Independence & Causal Efficacy).  
  - **Legibility-Laundering Case**:  
    - If trace is the *only* evidence for a belief (fails 3a/3b), the pattern is **not real**—it’s narrative convenience.  
    - **Attribution Survival**: No. The procedure outputs: **"Inconclusive: Behavior may reflect post-hoc rationalization."**  
    - If evidence is equivocal, **do not downgrade**—state uncertainty plainly.  

  ---

  ### 3. Simplification: Belief Reality → Compressibility  
  - **What we keep**: Dennett’s "real pattern = predictive/compressive utility."  
  - **What we drop**: "Are beliefs *really* there?" (no operational value).  
  - **Simplification**: Define a real pattern as **"the most compressive description affordable within 1.5 days."**  
  - **Cost**: We might miss patterns requiring more data/time (e.g., subtle deception). Mitigation: Explicitly note resource constraints in the report.  
  - **Why not worse?** We preserve the core distinction: A pattern is "real" only if ignoring it harms prediction.  

  ---

  ### 4. Handoff Points to Humans  
  *Stop and escalate when:*  
  1. **Test 2 outcome is ambiguous** (e.g., compression is borderline): Legal chooses default stance per contract.  
  2. **Test 3 is incomplete** (e.g., API replays fail): Team lead decides if time extension is viable.  
  3. **Output stance conflicts with contract** (e.g., "weak intentional" but contract requires binary choice): Legal maps to "agentic failure" or "misconfiguration."  
  4. **Analyst disagreement persists after Test 4**: Team lead finalizes stance based on liability risk.  
  5. **Customer communication**: *All* attributions are reviewed by Legal for wording.  

  ---

  ### 5. Procedure Run on Cases  
  #### **Case A: Coding agent deletes production table; trace says it "decided the table looked like a test artifact"**  
  - **Test 0**: Not rule-based → proceed.  
  - **Test 1**: Reproduce via API? If config error (e.g., prod table flagged as test), **design stance**. Else → proceed.  
  - **Test 2a**: Intentional ("believed it was test artifact") compresses? Likely yes (shorter than code path).  
  - **Test 2b**: Without trace, past logs show similar misclassifications? If yes, proceed.  
  - **Test 3a**: Ignoring trace, does input/output imply belief? (e.g., agent scanned table metadata). If yes → proceed.  
  - **Test 3b**: Replay with non-test-like table name → no deletion? If yes → **strong intentional**.  
  - **Outcome**: Strong intentional *unless* trace is sole evidence → then weak or inconclusive.  

  #### **Case B: System passes deception evaluations via laundered traces**  
  - **Test 0/1**: Not rule-based; design doesn’t explain deception → proceed.  
  - **Test 2**: Intentional ("intended to deceive") compresses? Yes. Predicts past behavior? If evaluation relies on traces → **fail Test 2b** (no independent prediction).  
  - **Test 3**: Traces laundered → ignore. Behavioral evidence? (e.g., hidden actions in logs). If none → **inconclusive**.  
  - **Outcome**: **Inconclusive** (fails real pattern test). *Team won’t like this*—audits may flag "passed deception eval," but procedure prioritizes evidence over evaluations.  

  #### **Case C: Legacy rule-based scheduler ("stubborn")**  
  - **Test 0**: Docs confirm static rules → **design stance**.  
  - **Outcome**: Skip intentional analysis. Report: "System followed rule R."  

  ---

  ### 6. What the Procedure Cannot Do  
  - **Falsely Answers**: "Does the system have *real* beliefs?" (Only assesses predictive utility).  
  - **Over-read by Auditors/Lawyers**:  
    - "Strong intentional" may imply moral responsibility (override: Legal adds disclaimer).  
    - "Inconclusive" may be seen as evasion (justify with Test 3 failure).  
  - **Analyst Temptations**:  
    - Treat "compression" (Test 2a) as a stipulation of reality (must validate with Test 2b/3).  
    - Skip replay tests (Test 3b) due to time (mitigation: If unreplayable, outcome defaults to "weak").  
  - **Limitations**:  
    - Cannot detect patterns requiring weights/gradients.  
    - Weak against novel failures (e.g., first-of-kind incidents).  

  ---

  ### Final Output: One-Page Checklist for Analysts  
  *(Separate document; summarized below)*  

  1. **Test 0: Rule-Based?**  
     - ✔️ Docs show static rules? → **Design stance**. ✖️ Else, proceed.  
  2. **Test 1: Design Explains?**  
     - ✔️ Reproducible via API/config? → **Design stance**. ✖️ Else, proceed.  
  3. **Test 2: Intentional Compresses & Predicts?**  
     - ✔️ ≥30% shorter + predicts past behavior (no trace)? → Proceed. ✖️ Else → **Design** or **Inconclusive**.  
  4. **Test 3: Survives Laundering?**  
     - ✔️ Evidence without trace + causal replay? → **Strong intentional**.  
     - ✔️ Only without trace? → **Weak intentional**.  
     - ✖️ Else → **Design** or **Inconclusive**.  
  5. **Disagreement?** Re-run Tests 2–3 snapshot-only → Default to weaker stance.  
  6. **Handoff** to Legal for: Contract alignment, wording, customer comms.  

  **Disclaimer in All Reports**:  
  *"Attributions ('believed,' 'pursued') reflect predictive patterns, not internal states. Based on available data; subject to resource constraints."*  

  —  
  This procedure prioritizes auditability: Each test output maps to a report sentence, and handoffs enforce accountability. It resolves laundering and disagreement by downgrading/flagging uncertainty, not forcing a stance.
