  **Sestina: The Common Ledger**

  **I. (Marsh Sister)**
  Before a single gull cried *warning* on the wind, a **PRIOR**
  Existed, deep as silt. The marsh itself was **GIVEN**,
  Its boundaries drawn by time and tide and **SALT**.
  No need for ink, no need for Mother's **LEDGER**
  Back then. Our trust was whole, we shared one **HALF**
  Of understanding, blind to future **ODDS**.

  **II. (Tables Sister)**
  Probability began with that shared **PRIOR**,
  The baseline risk assessed before data's **GIVEN**.
  We stood on common ground, that vanished **HALF**-
  Life before divergence. Now, the **LEDGER**
  Records the drift: my calculated **ODDS**
  Against your instinct whispered through the **SALT**.

  **III. (Marsh Sister)**
  You parse the waves to numbers, miss the **SALT**
  That seasons truth. I read the water's **ODDS**
  In shifting banks, the heron's patient **HALF**-
  Stance. Your spreadsheets can't contain the **PRIOR**
  Knowledge written here, beyond the **LEDGER**,
  In mud that yields what tides have **GIVEN**.

  **IV. (Tables Sister)**
  The mud holds only history, long **GIVEN**.
  Future risk requires the cold **LEDGER**
  Of precedent, not stories steeped in **SALT**.
  My models weight the years, adjust the **PRIOR**
  With each high mark. Your gut-feel **HALF**-
  Belief distorts the actuarial **ODDS**.

  **V. (Marsh Sister)**
  Distortion starts when trust was **HALF**-
  Forgotten, sister. See what wind has **GIVEN**:
  White caps like teeth on waves. My **ODDS**
  Are set by watching, not your distant **LEDGER**.
  This price I name reflects the true **PRIOR**,
  The marsh's breath, the taste of **SALT**.

  **VI. (Tables Sister)**
  Your price reflects the weathered **SALT**
  Sting in your eyes. Mine weighs the **ODDS**
  Compiled, the global patterns **GIVEN**.
  We started level, shared that pure **PRIOR**.
  The gap's not in the source, but **HALF**
  A life of different sights within the **LEDGER**.

  **Envoy (Both Sisters)**
  No glance beyond the glass; the sea-wall stands **GIVEN**.
  The number found absolves no **HALF**\-truth, pays no ancient **LEDGER** debt.
  One **PRIOR** birthed these odds we laid on **SALT**, one number stands, and yet...

