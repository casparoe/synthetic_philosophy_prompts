prompt: |-
  I'm in a theory of computation course this term (second-year CS) and the way we handle the Church–Turing thesis keeps bugging me. Me and my roommate, who's a physics major, went back and forth about it for like two hours after a guest lecture on analog computing and got nowhere, so I figured I'd ask people who think about this stuff properly.

  Here's what I keep noticing about how the subject is actually done, as opposed to how it's introduced. First: the course defines "computable" by picking Turing machines, then shows that a handful of other setups — lambda calculus, register machines, whatever — pick out exactly the same class, and presents that convergence as *evidence* for the thesis, while also saying flat out that the thesis can't be proved, because the informal side ("whatever a human or a machine can do by following a rule") isn't a mathematical object you can prove things about. Second: every time someone floats a machine that would outrun a Turing machine, the reaction is set-aside rather than refutation. The two examples we kept circling: a gadget that does its first step in a second, its second in half a second, its third in a quarter, so it gets through infinitely many steps in under a minute; and a device that measures some continuous physical quantity to infinite precision and reads the answer off an infinite decimal expansion. Both get waved off as "not a physically realisable process" — but my roommate's point is that physics idealises like that all the time (point masses, frictionless planes, infinitely extended fields, real-valued quantities generally), so the move can't just be "it's unphysical, therefore no". Third: our complexity unit helped itself to "efficient = polynomial time on a Turing machine" plus the assumption that any sane physical computing device is at worst polynomially slower, and the crypto notes then lean on exactly that when they say some protocol is safe because breaking it would take too long. But it's also treated as common knowledge that quantum algorithms really do put pressure on that efficiency claim, and that it could have turned out false — whereas the basic thesis gets treated as not the kind of thing that could turn out false at all.

  So what does that whole bundle of practices presuppose about what sort of claim the Church–Turing thesis is? Is the implicit view that it's an empirical claim about the physical world — in which case why is all the evidence for it mathematical, i.e. the agreement of several formalisms, which are all just mathematics and so tell you nothing about matter? Or that it's a definition, or an analysis of what we mean by "following a rule" or "effective procedure" — in which case why does anyone bother marshalling the convergence argument, and what would a hypercomputer even be a counterexample *to*? Or something in between? My roommate's guess, which I have no way to evaluate, is that it works like the definition of a physical quantity — temperature, energy, that sort of thing — where the meaning gets fixed by the role the term plays in a whole network of claims, so it's neither provable nor straightforwardly falsifiable, but also not arbitrary, and can come apart from any one of the claims that pin it down. Is that what the practice is quietly committed to, or is it too strong a story, or does the practice really only need something much weaker and just happen to sit comfortably with several different stories at once? I'd also like to know where exactly the practice is genuinely underdetermined rather than committed. And whatever you think it presupposes: what would concretely have to change in how computer science is done — how uncomputability results get stated, how hypercomputer proposals are received, how "efficient" gets defined, whether cryptographers should be more nervous — if we swapped that story for one of the rivals? Oh, and is the asymmetry I mentioned actually defensible, the base thesis being treated as untouchable while the efficiency version is treated as an open empirical question, or is that just historical accident?
reasoning: |-
  Okay, let me try to unpack this user's question. They're in a theory of computation course and confused about the Church-Turing thesis. They mention three main points: how the convergence of formalisms is presented as evidence despite the thesis being unprovable, how hypercomputers are dismissed as physically unrealizable while physics uses idealizations, and the asymmetry between the base thesis and efficiency claims.

  First, I need to recall what the Church-Turing thesis (CTT) actually states. It's the idea that any function computable by an algorithm can be computed by a Turing machine. But the user is pointing out a tension: CTT is treated as fundamental and unassailable, yet evidence for it is mathematical (equivalence of formalisms), while counterexamples are dismissed on physical grounds. That does seem inconsistent.

  The user's roommate, a physics major, argues that physics often uses idealizations like point masses or infinite precision, so dismissing hypercomputers as "unphysical" might be hypocritical. That's a valid point. Physics does use such models, so why not consider hypercomputers? But in CS, hypercomputers are set aside because they don't fit the effective computation model. The key here is that CTT is about effective procedures—finite, discrete steps. Analog devices relying on continuous quantities aren't considered effective in the same way.

  Then there's the efficiency part. Polynomial time is the benchmark, but quantum computing challenges that. The user notes an asymmetry: while CTT is untouchable, the efficiency claim is open to change. Why is that? Probably because CTT defines computability, while efficiency is about resources. Computability is binary; efficiency is relative. Quantum computing might change time complexity classes but doesn't enable hypercomputation.

  The user asks what CTT presupposes—empirical claim, definition, or something else. It's more of a conceptual analysis. The convergence of formalisms suggests that computability is a robust concept. Physical realizability matters for dismissing hypercomputers because CTT is about what can be computed by any mechanical process. Infinite time or infinite precision aren't feasible in finite, discrete steps.

  The roommate's analogy to physical quantities like temperature is interesting. CTT is similar—defined by its role in a network of theories. It's not arbitrary but not provable. Changing the definition would alter how we state uncomputability results. If hypercomputers were possible, uncomputable problems might become solvable, but since they're not physically realizable, it doesn't matter.

  The asymmetry between CTT and efficiency makes sense. Computability is absolute; efficiency is contextual. Quantum computing might break current crypto, but it doesn't violate CTT. So cryptographers worry about efficiency, not computability.

  The user's deeper need is to reconcile the mathematical evidence with the physical dismissals. They want to understand the philosophical underpinnings. The answer lies in CTT as a bridge between math and physics. The formalisms show mathematical equivalence, while physical constraints ground it in reality. Hypercomputers are mathematically possible but physically impossible, so CTT holds for effective procedures in our universe.
answer: |-
  Your observations are incredibly sharp and point directly to the deep philosophical tensions surrounding the Church-Turing Thesis (CTT). The practices you describe reveal an implicit, pragmatic stance that blends conceptual analysis, empirical constraint, and mathematical robustness. Here's a breakdown of what this presupposes, and the implications of changing it:

  ### 1. **The Implicit View of CTT: A Robust Conceptual Analysis**
     - **Not Purely Empirical, Not Purely Definitional**: CTT *isn't* treated as a straightforward empirical claim like "water boils at 100°C." Nor is it *just* a definition (like "bachelor = unmarried man"). Instead, it's seen as a **conceptual analysis** of "effective computability" (or "algorithm," "mechanical procedure"). The convergence of formalisms (Turing machines, λ-calculus, etc.) *demonstrates* that this concept is mathematically robust and captures something fundamental. This convergence is evidence that we've successfully formalized an intuitive notion.
     - **Role of Physical Dismissals**: When hypercomputers (like your Zeno machine or infinite-precision analog device) are dismissed as "physically unrealizable," it's not *just* an empirical claim. It's tied to the **concept of an effective procedure**: an algorithm must consist of a finite set of instructions, executed in discrete steps, using finite resources per step. Physics idealizations (point masses) don't violate this core idea; they abstract *within* a finite/discrete framework. Hypercomputers, however, require *inherently infinite resources* (infinite energy, infinite precision, infinitely shrinking time) violating the finiteness implicit in "effective." Physics is invoked because the concept of computation is grounded in what can be *mechanically implemented*, even if idealized.
     - **Your Roommate's Insight is Largely Correct**: The "network of claims" analogy (like temperature being defined by its role in thermodynamics) is apt. CTT gains meaning from:
       - Mathematical equivalence of formalisms.
       - Undecidability results (e.g., Halting Problem) applying uniformly.
       - The failure to find any *plausible, finitely realizable* model that exceeds it.
       - Its role in defining the limits of cryptography, verification, etc.
     It's "neither provable nor falsifiable" in isolation, but it's constrained by this network. A counterexample wouldn't just falsify CTT; it would require redefining "computation" itself.

  ### 2. **The Efficiency Asymmetry: Why CTT is "Untouchable" but P=NP Isn't**
     - **CTT Defines the Boundary**: CTT defines what is *possible* to compute *at all* (given unbounded time/space). This boundary has proven mathematically robust across formalisms and resistant to physical counterexamples. Quantum computing *doesn't* violate CTT; it computes the *same* functions, just faster for some problems. Shor's algorithm factors integers in BQP; a TM *could* factor them (just slowly). CTT remains the foundation.
     - **Efficiency is Contextual & Physical**: "Efficient = polynomial time" is a **pragmatic convention** justified by:
       - Empirical observation: Problems solvable in poly-time on TM-like models tend to be tractable in practice.
       - Robustness across deterministic models (TM ≈ RAM ≈ etc. within poly-time).
       - Theoretical convenience (closure under composition).
     However, it's *explicitly contingent*:
       - Quantum computing shows this convention *could* break (BQP vs. BPP).
       - Physical models (analog, relativistic, quantum gravity?) *might* exhibit super-polynomial speedups relative to TMs, even if they don't violate CTT.
       - Cryptography *already* acknowledges this: Security proofs assume P ≠ NP *and* that no unforeseen physical model breaks poly-time equivalence. Cryptographers *are* nervous about quantum computers!

  ### 3. **What Would Change if We Swapped the Story?**
     If we adopted a rival view (e.g., CTT is purely mathematical, or purely physical), core CS practice would shift dramatically:
     - **Accepting Hypercomputation (Physical View):**
       - **Uncomputability Results:** Could no longer state "Function F is uncomputable" absolutely. Would need qualifiers: "...by any TM-like device, or any device obeying finite-energy physics." The Halting Problem might become solvable by a "Zeno machine," altering proofs.
       - **Cryptography:** Collapses. Security relying on uncomputability (e.g., some obfuscation schemes) would be invalid. Breaking RSA might be trivial with infinite-precision analog devices.
       - **Efficiency:** "Polynomial time" becomes meaningless if hypercomputation exists. Complexity classes shatter.
     - **Treating CTT as Purely Mathematical (No Physical Link):**
       - **Hypercomputer Proposals:** Couldn't be dismissed as "unphysical." CS would have to engage them mathematically (e.g., study "Zeno-arithmetic" or "infinite-precision BSS machines" as valid models). The "convergence evidence" weakens – why prefer TMs over these?
       - **Physics-Based Claims:** Statements like "The universe is computable" (in physics-inspired CS) would lose foundation.

  ### 4. **Where Practice is Underdetermined & Committed**
     - **Committed:**
       - Computability is defined by TM-equivalence *for finitely realizable, discrete-step procedures*.
       - Hypercomputation requiring *inherent* infinities (time, precision, energy) is excluded from "effective computation."
       - Uncomputability results are absolute *within this framework*.
     - **Underdetermined:**
       - The *exact* physical assumptions grounding finiteness (e.g., is space discrete? Is there a minimum time? Is energy quantized?). CS practice doesn't depend on resolving quantum gravity.
       - The *strength* of the efficiency thesis (poly-time). Practice assumes it's robust but acknowledges it's contingent.

  ### 5. **Is the Asymmetry Defensible?**
     **Yes, robustly.** The asymmetry reflects a fundamental difference:
     - **CTT (Computability):** Asks "Is this function *mechanically determinable in principle*?" The answer is binary and tied to the *concept* of mechanism. 80+ years of failed hypercomputer proposals and mathematical convergence justify treating this boundary as fixed.
     - **Efficiency:** Asks "*How hard* is it to compute, given physical constraints?" This is inherently contextual (depends on physics, resources, model). Quantum computing proves this context *can* change tractability without changing computability.

  **Concrete Takeaways for Your Practice:**
  - **Uncomputability Proofs:** Rely on CTT *as the definition* of computability. They are safe unless a *physically plausible*, finitely realizable model exceeds TMs (none exists).
  - **Hypercomputers:** Dismissed because they violate the *finiteness* implicit in "effective procedure," not just "physics." The idealization in physics (point masses) doesn't require infinities *within the computational process*.
  - **Cryptographers:** *Are* nervous about efficiency! Quantum threats are real. But they rely on CTT for absolute uncomputability claims (e.g., Kolmogorov complexity-based security).
  - **Efficiency Definition:** "Polynomial time on a TM" is a useful convention, not dogma. Be explicit that it assumes no super-poly speedups exist in other *physical* models relative to TMs.

  **In essence:** CS practice treats CTT as a *conceptual discovery* – that "effective computation" *is* Turing-computation – justified mathematically and stabilized by physical constraints. It's not empirical (like gravity's strength), nor arbitrary (like defining a meter). It's the keystone holding up the theoretical edifice. Changing it wouldn't just revise a theorem; it would require rebuilding computation theory from the ground up. The efficiency thesis, however, is a contingent engineering guideline – and CS treats it as such. Your roommate's "physical quantity" analogy is insightful; CTT is more like defining "energy conservation" than measuring G. It's a framework principle.
