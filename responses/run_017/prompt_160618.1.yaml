answer: |-
  Here's a structured plan for your fifty-minute session, designed to make students *feel* the challenge of concept induction via Bongard problems. The sequence leverages cognitive friction—forcing them to grapple with ambiguity before resolving it.

  ---

  ### **1. Order of Pieces and Dependencies**  
  **Flow & Rationale**:  
  - **First 15 mins**: **Hands-on struggle** (critical). Present the Bongard problem cold. Students work in pairs to find *any* rule that fits. No hints.  
    - *Why first?* If you pre-explain non-uniqueness, they won’t internalize the frustration. The struggle makes the ambiguity visceral. They’ll hit dead ends or propose flawed rules, priming them for the "aha."  
  - **Next 10 mins**: **Share rules**. Groups write rules on the board. Highlight that all fit (by definition) but vary wildly (e.g., relational, shape-based, list rules).  
    - *Dependency*: This step *requires* their initial attempts. Without seeing their rules, the "no unique answer" revelation feels theoretical.  
  - **Next 10 mins**: **Introduce brittleness**. Remove one figure from the problem. Show how a simpler, unintended rule now fits. Contrast with the intended rule.  
    - *Dependency*: Must come *after* sharing rules, as brittleness demonstrates why their earlier rules were unstable.  
  - **Final 15 mins**: **Synthesize implications**. Discuss why fitting ≠ generalizing, and why "simplicity" is subjective. End with the closing question.  

  > **Key Insight**: Your hunch is correct—non-uniqueness must **follow** their struggle. If explained upfront, it feels academic. After failure, it’s a revelation.

  ---

  ### **2. The Central Bongard Problem**  
  **Use this**: A **relational rule** (not per-shape) that’s **brittle** and has an **obvious list rule** alternative.  
  - **Example Setup**:  
    - **Left (6 figures)**: Each contains *two shapes* where *one shape encloses the other* (e.g., circle inside square, triangle inside circle).  
    - **Right (6 figures)**: Each contains *two shapes* that *touch but don’t enclose* (e.g., circle adjacent to square, triangle above circle).  
    - **Intended Rule**: "One shape spatially encloses the other."  
  - **Why this works**:  
    - Relational (forces them to think beyond atomic properties).  
    - Brittle (remove one left-panel "enclosure" figure → a per-shape rule like "contains a circle" may fit).  
    - List rule is glaring (e.g., "Left figures are A, B, C, D, E, F").  
    - *Not doing too much*: The brittleness and relational aspects reinforce each other (removing a figure exposes how per-shape rules hijack the problem).  

  ---

  ### **3. Misconceptions & Mitigation Sequence**  
  Address these **in order** as they’ll likely arise:  

  | Misconception | When It Arises | How to Head Off |  
  |---------------|----------------|-----------------|  
  | **"The goal is to find the *intended* rule."** | During initial struggle (pairs). | *After* they share rules, say: "Many rules fit—but which did the designer *intend*? We can’t know. Induction is about guessing from patterns, not mind-reading." |  
  | **"More examples would fix this."** | When discussing non-uniqueness. | Use brittleness demo: "If I remove one example, a new simpler rule fits. More data can *change* the simplest rule—not just clarify it." |  
  | **"Fitting = generalizing."** | When comparing list rule vs. intended rule. | Contrast: "The list rule fits perfectly but fails on new shapes. The enclosure rule might generalize. Fitting is necessary but not sufficient." |  
  | **"Simpler rules are obviously better."** | When debating which rule to choose. | Ask: "What makes a rule 'simple'? Is 'enclosure' simpler than 'list'? Only if we value abstraction. Language matters!" (Show a complex-but-concise rule vs. verbose-but-simple one.) |  
  | **Missing: "All valid rules are equally useful."** | When listing multiple fitting rules. | Ask: "Which rule would you bet on for a *new* figure? The list rule has 0% accuracy on new data. Utility isn’t just about fitting—it’s about prediction." |  

  > **Not worth time**: "The rule must be visual." (Some may suggest textual/metaphysical rules like "left figures are beautiful." Briefly note: "We assume rules are based on observable features—otherwise, no learning is possible.")

  ---

  ### **4. What to Refuse**  
  **Refuse formal learning theory** (e.g., VC dimension). State explicitly:  
  > *"We could dive into VC dimension or PAC learning—which quantify how hard induction is—but that’s a grad-level rabbit hole. Today, we’re staying intuitive: feel why induction is underdetermined."*  

  **Why**: First-years need cognitive grounding before formalism. Hand-waving risks confusion; silence feels evasive. This frames the boundary honestly.

  ---

  ### **5. Closing Question**  
  **Ask at T-5 mins**:  
  > *"If I showed you a new figure, and your rule misclassified it, would that mean you chose the ‘wrong’ rule? Why or why not?"*  

  **Why this lands**:  
  - Reveals if they grasp **underdetermination** (no rule is "true," only useful).  
  - Exposes confusion between **fitting vs. predicting**.  
  - Fun ≠ learning; this probes metacognition.  

  ---

  ### **Least Confident Part**  
  **Brittleness demonstration timing**.  
  - **Why uncertain**: Students may not see how "simpler rule emerges" without a clear metric for simplicity. If they miss this, the demo feels contrived.  
  - **What would change my mind**:  
    - If early sharing reveals wildly divergent rules (e.g., one group proposes a per-shape rule), use *that* to segue into brittleness naturally.  
    - If the room struggles to see simplicity, **pivot**: Contrast "enclosure" (relational) with "contains a circle" (per-shape) and ask which feels more compact.  

  **Contingency**: Skip brittleness if short on time; emphasize non-uniqueness + generalization instead. The core goal is ambiguity, not brittleness.

  ---

  **Session Outline Recap**:  
  1. **0–15 min**: Pairs solve Bongard problem cold.  
  2. **15–25 min**: Share rules → highlight fitting ≠ unique.  
  3. **25–35 min**: Brittleness demo + list rule critique.  
  4. **35–45 min**: Misconception discussion + synthesis.  
  5. **45–50 min**: Closing question.  

  This ensures they *feel* the ambiguity before dissecting it. The relational problem anchors everything—test its brittleness beforehand!
