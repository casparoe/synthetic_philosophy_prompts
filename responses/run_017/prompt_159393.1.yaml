  First, I need to recall Turing's actual paper. I remember he did discuss ESP as one of many objections to the imitation game. The key points are: he presented it as a common objection of his time, not necessarily his personal view. His telepathy-proof room suggestion was a practical fix, not an endorsement of ESP.

