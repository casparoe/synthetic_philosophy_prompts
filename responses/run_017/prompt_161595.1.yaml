prompt: |-
  I'm putting together a one-page handout for the medical ethics seminar I'm TAing this term, and I want a taxonomy of the positions on assisted dying — but not the standard one. Every handout I find sorts people by whether they accept or reject 'euthanasia' full stop, and that doesn't sort anyone in my class: they all think it's obviously fine in one case and obviously not in another, and the cases they actually split over aren't the ones the literature is organised around. So build it from the questions rather than the labels: each branch should be a question a student can answer without already knowing which view it leads to, and each leaf gets the conventional name (or 'unnamed') plus one sentence on its most awkward commitment.

  Constraints, because otherwise I'll get the generic version:

  - Don't start from permissibility. Start from the easy case — competent patient, metastatic cancer, months to live, pain not controlled, repeated request — assume everyone in the room grants that something is owed to her, and split on what it is that makes her case easy: that her suffering is the problem, that she asked, or that she is dying anyway. Grow the rest of the tree out of that.
  - The cases it has to sort: an advance request written years earlier by someone now moderately demented who seems content and no longer repeats it; a 29-year-old with treatment-refractory depression and no physical illness; an 84-year-old with a pile of chronic, non-terminal conditions who says she has completed her life and is tired of it; someone in severe suffering who is refusing the one effective palliative treatment because of its side effects; and a request driven mostly by not wanting to be a burden on family.
  - Required leaves, wherever they land: the terminal-illness restriction, the autonomy-only view (competent request is sufficient), the 'medicine has fixed ends' view about professional integrity, the terminal-sedation/double-effect-only position, the disability-rights objection to the suffering-based rationale, and sanctity-of-life absolutism.
  - Flag any pair of leaves your questions can't actually seperate, and for combinations of answers nobody seems to occupy, say whether that's because the view is incoherent, unattractive, or just unclaimed.

  The bit I've been chewing on, which I want the tree to handle explicitly: most of the disagreement in my seminar wasn't about whether suffering matters but about when you're allowed to count it — whether the relevant unit is the person's trajectory as a whole or the person at the moment of the act, and whether an 'unbearable suffering' claim can be undercut by showing the suffering was avoidable. Call it the snapshot/trajectory problem if you want. Aim for about six branch questions and eight or nine leaves, and use your own cases rather than ones from the literature — I can't check references here and don't want them.
reasoning: |-
  Hmm, the user is a teaching assistant for a medical ethics seminar who wants a unique handout on assisted dying positions. They're frustrated with standard taxonomies that just sort views as pro or anti-euthanasia, since their students all see nuances - agreeing it's fine in some cases but not others. The key is to build it from questions students can answer without prior knowledge, leading to labeled positions.

  The constraints are specific: start from an easy case (competent terminal cancer patient in pain) and ask what makes it easy - suffering, the request, or the dying status. Then branch out to cover real-world dilemmas like dementia patients, treatment-resistant depression, and "completed life" cases. 

  Required leaves include terminal-illness restrictions, autonomy-only views, medical integrity concerns, double-effect sedation, disability-rights objections, and sanctity-of-life. I also need to flag where views can't be separated or are unoccupied.

  The user particularly wants to address the "snapshot/trajectory problem" - whether we assess suffering at the moment or over a life trajectory, and if avoidable suffering invalidates "unbearable" claims. This came up a lot in their seminar.

  I'll build a flowchart with six key branching questions:
  1. What makes the easy case permissible? (suffering/request/dying)
  2. Whether suffering requires medical causation
  3. Snapshot vs trajectory assessment
  4. Whether avoidable suffering counts
  5. Whether autonomy alone suffices
  6. Whether terminal illness is required

  This should generate about nine positions:
  - Suffering-based views (medicalized, snapshot, trajectory)
  - Autonomy-only view
  - Terminal-condition views (strict, broad)
  - Double-effect sedation
  - Sanctity-of-life
  - Disability-rights skepticism

  I'll make sure to handle cases like the content dementia patient (trajectory views reject this while snapshot might accept), the depressed 29-year-old (medicalized suffering views reject this), and the "completed life" case (only autonomy or broad terminal views accept). 

  For combinations nobody holds, I'll note why - for example, thinking suffering matters but never counting avoidable suffering would be incoherent. And I'll flag where the tree can't separate certain views, like strict terminal-condition and medical integrity positions.

  The handout will be structured as a flowchart with clear yes/no questions, position names, key commitments, and case resolutions. Boxed summaries will help students see implications at a glance. This should give them a practical tool for navigating real ethical disagreements.
answer: |-
  Here’s a taxonomy built from first-principles questions, designed to sort the cases your class debates while avoiding standard pro/con framing. It starts from the "easy case" consensus and branches through ethically salient distinctions, including the snapshot/trajectory problem. Positions emerge at the leaves, with their "most awkward commitment" and case resolutions.

  ---

  ### **The Branching Questions**  
  **(Start: Competent terminal patient in uncontrolled pain → All agree intervention is permissible)**  

  1. **What primarily justifies intervention in the easy case?**  
     - **A. Her suffering** (→ Go to Q2)  
     - **B. Her autonomous request** (→ Go to Q5)  
     - **C. Her terminal trajectory** (death is imminent/inevitable) (→ Go to Q6)  

  ---

  ### **Branch A: Suffering is Central**  
  2. **Must suffering be *medical* (caused by illness/injury)?**  
     - **Yes** (→ Go to Q3)  
     - **No** (suffering can include existential, social, or non-medical anguish) (→ **Unnamed**)  
       *Most awkward commitment:* Permitting assisted dying for a healthy 29yo with refractory depression if suffering is severe.  
       *Cases:* ✅ 29yo depression; ❓ 84yo "completed life" (if suffering); ❌ Dementia advance directive (if currently content).  

  3. **(If medical suffering) Is the "unbearability" of suffering assessed as a *snapshot* (current state) or a *trajectory* (future/past context)?**  
     - **Snapshot** (current experience alone matters) (→ **Medicalized Suffering View**)  
       *Most awkward commitment:* Supporting intervention for someone refusing effective palliation due to side effects (if *current* suffering is severe).  
       *Cases:* ✅ Refusal due to side effects; ❌ Dementia advance directive (if content now).  
     - **Trajectory** (broader narrative of decline matters) (→ **Life Narrative Integrity View**)  
       *Most awkward commitment:* Denying intervention to someone *currently* calm if their overall arc is one of intolerable degradation (e.g., locked-in syndrome).  
       *Cases:* ✅ Dementia advance directive (if written during lucid decline); ❌ 29yo depression (unless medically caused decline).  

  4. **(If snapshot) Does *avoidable* suffering (e.g., refusal of treatment) still justify intervention?**  
     - **Yes** (→ **Autonomy-Prioritizing Suffering View**)  
       *Most awkward commitment:* Backing assistance even if patient declines simple, low-burden treatment that would resolve suffering.  
       *Cases:* ✅ Refusal due to side effects; ✅ Burden-driven request (if suffering results).  
     - **No** (suffering must be unavoidable) (→ **Medical Necessity View**)  
       *Most awkward commitment:* Forcing treatments with severe side effects to "earn" eligibility for assisted death.  
       *Cases:* ❌ Refusal due to side effects; ❌ Burden-driven request.  

  ---

  ### **Branch B: Autonomy is Central**  
  5. **Is a competent request *sufficient*, regardless of suffering/terminality?**  
     - **Yes** (→ **Autonomy-Only View**)  
       *Most awkward commitment:* Permitting assisted death for non-suffering individuals (e.g., "tired of life") or for reasons others deem trivial.  
       *Cases:* ✅ 29yo depression; ✅ 84yo "completed life"; ✅ Burden-driven request.  
     - **No** (→ **Hybrid View: Autonomy + Constraints**)  
       *Joins other branches (e.g., A or C) for constraints.*  

  ---

  ### **Branch C: Terminal Trajectory is Central**  
  6. **Must death be *imminent* (weeks/months), or is broader terminal decline (years) sufficient?**  
     - **Imminent death required** (→ **Strict Terminal-Illness Restriction**)  
       *Most awkward commitment:* Denying assistance to someone with slow, degenerative terminal illness (e.g., severe COPD) until weeks before death.  
       *Cases:* ❌ 84yo "completed life"; ❌ Dementia advance directive (until final weeks).  
     - **Broader terminal decline** (→ **Unnamed**)  
       *Most awkward commitment:* Including early-stage dementia or frail elderly in "terminal" class despite unpredictable timelines.  
       *Cases:* ✅ Dementia advance directive (if decline is clear); ✅ 84yo "completed life".  

  ---

  ### **Required Leaves Not Yet Captured**  
  - **'Medicine Has Fixed Ends' (Professional Integrity) View**: Emerges from **Q1-C** → **Q6-Imminent**.  
    *Most awkward commitment:* Forbidding assistance even for a suffering terminal patient if it violates "healing" ethos (→ **Double-Effect-Only** position: Only terminal sedation permitted).  
  - **Disability-Rights Objection**: Emerges **within Branch A, Q2-Yes** → **Q3-Trajectory/Snapshot**.  
    *Most awkward commitment:* Opposing *any* suffering-based criteria due to social bias, even for terminal illness (→ **Disability-Rights Skepticism**).  
  - **Sanctity-of-Life Absolutism**: Rejects *all* branches → **No assistance ever permitted**.  
    *Most awkward commitment:* Demanding life prolongation for a suffering, competent terminal patient against their will.  

  ---

  ### **How Your Cases Sort**  
  | **Case** | **Autonomy-Only** | **Snapshot Suffering** | **Trajectory Suffering** | **Strict Terminal** | **Completed Life View (Q6-Broad)** |  
  |----------|-------------------|------------------------|--------------------------|---------------------|-----------------------------------|  
  | **Dementia advance directive** | ✅ | ❌ | ✅ | ❌ | ✅ |  
  | **29yo refractory depression** | ✅ | ✅ (if severe) | ❌ | ❌ | ❌ |  
  | **84yo "completed life"** | ✅ | ❓ (if suffering) | ❓ (if decline) | ❌ | ✅ |  
  | **Refuses palliative treatment** | ✅ | ✅ | ❌ | ❌ | ❌ |  
  | **"Burden on family" request** | ✅ | ✅ (if suffering) | ❌ | ❌ | ❌ |  

  ---

  ### **Unoccupied/Incoherent Combinations**  
  - **Suffering is central + Suffering must be medical + Avoidable suffering doesn’t count + Snapshot assessment**: Incoherent. If snapshot matters, avoidability is irrelevant.  
  - **Autonomy sufficient + Sanctity-of-life absolutism**: Logically impossible.  
  - **Terminal trajectory central + Suffering irrelevant**: Unclaimed (no one argues terminal patients should die *without* suffering/request).  
  - **Trajectory assessment + Burden-driven request invalid**: Unattractive (if trajectory is social, burden could be part of decline).  

  ---

  ### **Key Advantages of This Taxonomy**  
  1. **Starts from consensus**, forcing distinctions *within* pro-assisted-dying views.  
  2. **Explicitly handles snapshot/trajectory**: Q3 and Q4 resolve when suffering "counts."  
  3. **Labels emerge organically**—students won’t self-select into pre-boxed camps.  
  4. **Cases drive branches**, not abstract principles (e.g., "completed life" tests *terminal* definitions).  

  Print as a flowchart with questions in diamonds and leaves in boxes. I’ve avoided literature-derived labels where unnamed views dominate real-world debates (e.g., "completed life" positions lack clean labels). Use the cases as discussion prompts for each leaf!
