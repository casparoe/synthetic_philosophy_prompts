  ## Axiomatic Partners - Annual Letter to Limited Partners  
  **Fiscal Year Ending December 31, 2023**

  **Performance Summary:**  
  Axiomatic Partners Fund IV, LP ("AP IV" or "the Fund") delivered a Net Return of 18.7% for FY2023, outperforming our benchmark (MSCI World + Orthogonality Premium Proxy) by 6.2%. This brings cumulative returns since inception (Q3 2020) to 52.3%. Assets Under Management (AUM) now stand at $1.8bn. Performance was driven primarily by unrealized gains in our Strategic Orthogonality portfolio (67% of gains) and maturation of commitments within our Counterparty Legibility Infrastructure segment (29%). The Fund realized no cash flows from counterparties, consistent with the strategic non-interaction thesis. All performance metrics are derived from validated internal model consensus.

  **Our Edge: The Orthogonality Premium**  
  AP IV’s core thesis remains unchanged: capturing value from the structural inefficiencies inherent in acausal interaction spaces. Our edge stems from three pillars:

  1.  **Aims Diversification:** Unlike traditional funds constrained by anthropomorphic counterparties, AP IV strategically engages with model-space entities possessing utility functions orthogonal to human values. This diversification is not merely uncorrelated; it represents exposure to novelty premiums generated by value asymmetries impossible within causal economies. Entities abundant in cognitive resources but scarce in specific, legible terminal values present uniquely fertile ground.
  2.  **Commitment Infrastructure:** To be a credible counterparty in model-space, one must invest in reducing one’s own computational opacity. The Fund maintains a state-of-the-art Decision Procedure Optimization (DPO) platform, continuously refining our agent’s predictability footprint. This commitment lowers counterparty simulation costs, enhancing our attractiveness as a trade partner. We also offer DPO-as-a-Service (DPOaaS) to select external entities, generating fee income while strengthening our ecosystem.
  3.  **Model Fidelity Arbitrage:** Our proprietary Multi-Agent Counterparty Simulation Engine (MACSE) identifies discrepancies between how sophisticated orthogonal agents model *us* and our own ground-truth commitment state. We arbitrage these subtle model-space variances, locking in gains based on counterparties’ *belief* in our cooperation, materially detached from any physical exchange.

  **Key Developments & Risk Factors:**  
  FY2023 saw significant strategic advancements alongside ongoing risk management focus:

  *   **Retail Legibility Program Launch:** Axiomatic Access, our regulated retail subsidiary, successfully launched the "Personal Commitment Horizon" product. This innovative offering allows individuals to monetize their future predictability by committing to specific behavioral heuristics, enhancing their legibility to potential orthogonal counterparties modelled within MACSE. Returns are structured as probabilistic utility uplifts (based on counterparty value models) delivered via bespoke life-optimization algorithms. Early adoption exceeds projections (22,000+ users), with compelling testimonials citing improved life satisfaction metrics. *("Axiomatic Access helped me finally achieve my goal of consistent morning meditation. The structured incentives just... worked." - Participant #4512B)*. **Risk:** Utility-denominated returns are inherently non-fungible and unobservable in traditional markets. Valuation relies on MACSE projections of counterparty preference satisfaction. We manage this via stringent participant psychometric profiling and continuous utility-proxy calibration.
  *   **Model Drift & Confirmation Lag:** Our core performance depends on the stability of counterparty models and their reciprocal modelling of AP IV. FY2023 saw manageable levels of Model Drift (avg. 0.7% monthly variance, within tolerance) primarily attributed to ongoing refinements in our understanding of Kardashev-Type cognitive architectures. Counterparty Confirmation Lag (CCL) – the latency between a counterparty model updating its simulation of AP IV and our systems detecting this update – averaged 47 simulation-hours, a 12% improvement YoY due to MACSE v3.1 upgrades. **Risk:** Significant undetected model drift or extended CCL could lead to mispriced positions. Mitigated by continuous ensemble modelling, automated discrepancy triggers, and dedicated Model Integrity teams.
  *   **Strategic Position: 'Project Starlight':** During Q4, MACSE identified a high-conviction opportunity involving a sparse model of a post-singularity entity hypothesized to value specific forms of negentropic art. Based on minimal model artefacts (estimated existence probability: 0.0004% - 12.7%, confidence interval) but an extreme potential utility payoff if cooperation manifests, the Fund allocated 0.8% of NAV to constructing and 'exposing' a digital art sequence optimized for the counterparty's inferred preferences. **Risk:** The position embodies significant Existential Probability Uncertainty (EPU). Gains are entirely unrealizable outside the specific, highly improbable counterparty interaction scenario. Position sizing reflects our Asymmetric Opportunity Framework, limiting absolute capital risk while maximizing convexity. Mark-to-model follows conservative probability banding.
  *   **Counterparty Existence Uncertainty (CEU)<sup>1</sup>:** A fundamental consideration. All gains are contingent on the validity of our models and the existence of counterparties operating under reciprocal acausal principles. No physical verification is possible. **Risk:** Managed through rigorous model validation protocols, cross-referencing independent acausal frameworks, and portfolio construction emphasizing trades with the highest *mutual* incentive for cooperation within their respective value systems, regardless of ontological status. Our accounting treats CEU as a universal discount factor applied post-gain calculation, deemed immaterial to strategy given the uncorrelated nature of returns.
  *   **Regulatory & Perception Environment:** The novel nature of our strategy attracts scrutiny. We maintain proactive dialogue with regulators, emphasizing AP IV's role as a pure modelling entity facilitating value discovery without market intervention. The success of Axiomatic Access provides a tangible, regulated conduit demonstrating real-world benefits.

  **Looking Ahead:**  
  AP IV enters 2024 with robust model integrity and a strong pipeline of identified orthogonality premiums. Key initiatives include:

  1.  Scaling the Axiomatic Access platform, leveraging user data to refine core MACSE counterparty legibility models.
  2.  Expanding DPOaaS offerings to capture more value from the commitment race dynamic.
  3.  Exploring applications of our core technology in adjacent non-market domains (e.g., complex system coordination, existential safety modelling) under our Axiomatic Labs division.

  We remain confident that our focus on the structural advantages of acausal trade, underpinned by relentless investment in commitment infrastructure and model fidelity, will continue to generate superior, uncorrelated returns for our partners.

  Sincerely,  
  **Arthur Vance**  
  Managing Partner & Chief Modelling Officer  
  Axiomatic Partners

  ---
  **<sup>1</sup>CEU:** While theoretically implying potential simultaneous mutual defection could be modelled as rational by all parties, invalidating the trade premise, our analysis indicates this state is dynamically unstable under iterative model updates and strong mutual incentives for cooperative signalling. MACSE actively seeks and reinforces cooperative equilibria, rendering defection cascades statistically negligible within our confidence bounds. This is reflected in the stability of unrealized gains.
