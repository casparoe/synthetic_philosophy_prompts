answer: |-
  Here's a disciplined mapping of the Vulcan case through both Humean (Best System Account - BSA) and Anti-Humean (Governance) lenses, respecting your distinctions and constraints:

  **1. Le Verrier's Options & How Theories Rank Them (1846/1859 Context):**

  *   **Option 1: Treat Residual as Observational/Computational Error:**
      *   *Humean (BSA):* Initially reasonable. The "best system" (Newtonian mechanics + known masses) summarizes the existing mosaic well *except* here. Slippage exists; error-checking is the first pragmatic step to improve fit or confirm the system's adequacy despite minor anomalies. Low risk to system simplicity/strength.
      *   *Anti-Humean (Governance):* Potentially irresponsible. The law *governs* Mercury's motion. If calculations using the governing laws and known initial conditions/boundaries yield a mismatch, it strongly suggests a violation or an unaccounted-for governing factor (new mass). Ignoring it risks ignoring a failure of governance. Higher priority than for Humean.
  *   **Option 2: Tinker with the Force Law (e.g., modify 1/r²):**
      *   *Humean (BSA):* High cost. Radically reduces simplicity (replaces a beautifully simple law) for a modest, localized gain in strength (explains Mercury only). Likely worse overall systematization unless the modification explains *widespread* phenomena (which it didn't). Least favored option initially.
      *   *Anti-Humean (Governance):* Drastic but conceptually possible. If the residual is fundamental, the governing law itself might be wrong. However, Newton's law governs *so successfully* elsewhere that this seems a last resort. Requires explaining why it governs perfectly everywhere else but fails near the Sun. Ranked below adding mass but above ignoring error.
  *   **Option 3: Add Unobserved Mass (Vulcan/Vulcanoids):**
      *   *Humean (BSA):* Potentially attractive *if confirmed*. Adding a simple postulate (a planet/belt) maintains the core simplicity of Newtonian mechanics while significantly increasing strength by incorporating the Mercury anomaly *and* potentially other future observations. **BUT:** It risks *overfitting* if the mass isn't found. Its value depends entirely on future mosaic fit. Initially promising but contingent.
      *   *Anti-Humean (Governance):* The most natural inference. The governing law requires a specific motion. The observed motion differs. Therefore, an additional governing factor (mass exerting force) *must* be present. This is precisely how the governing framework explains deviations. The highest-ranked option based on the governing principle itself.

  **Entitlement to Expectation (Pre-Observation):**
  *   *Humean (BSA):* Le Verrier is entitled to expect *that if Vulcan exists*, it should be found near his predicted position. The expectation is conditional on the *hypothetical extension* of the system (Newton + Vulcan) being the *future best system* upon inclusion of new observational data. Confidence should be tempered by the knowledge that alternative systematizations (error, future law tweak) might ultimately fit the total mosaic better.
  *   *Anti-Humean (Governance):* Le Verrier is entitled to a *strong expectation* that Vulcan *exists*. The governing laws *demand* its presence to account for the violation of Mercury's governed trajectory. Its existence is the predicted *causal consequence* of the governing framework applied to the anomaly. Confidence stems from the perceived necessity imposed by governance.

  **2. Differential Vindication (Neptune Success vs. Vulcan Failure):**

  *   **Humean (BSA) Response:** The BSA readily explains the difference *post-hoc*.
      *   *Neptune:* Adding Neptune resulted in a dramatically better system: vastly increased strength (explained Uranus's orbit, predicted Neptune's position/effects) with minimal cost to simplicity (adding one planet to an existing type). It became objectively the best system as the mosaic grew.
      *   *Vulcan:* Adding Vulcan *never* yielded a better system. No robust observations confirmed it. The "system + Vulcan" remained inferior to the "system + residual anomaly" because it added complexity (the Vulcan postulate) without increasing strength (no confirming mosaic elements). The anomaly persisted as localized slippage. Einstein's GR later provided a *different*, far superior systematization (high strength, surprising simplicity/unification) that subsumed the anomaly.
      *   *Weight of Constraint:* Low. The BSA evaluates systems based on the *total* mosaic. Neptune *worked* (fit new data); Vulcan *didn't* (no confirming data, better system found). The same method (hypothesizing masses) is just a tool for *candidate system generation*. Its success/failure depends entirely on whether the resultant system *wins* the BSA competition against rivals *given the actual mosaic*. The BSA only judges the winning system, not the process of generating candidates. The differential outcome is entirely consistent with the BSA.
  *   **Anti-Humean (Governance) Response:** Governance explains the difference via the *accuracy of the governing laws used*.
      *   *Neptune:* The underlying governing laws (Newtonian gravity governing Sun/planets) were correct *for that domain*. The inference to a new mass governed by those same laws was therefore sound and successful.
      *   *Vulcan:* The underlying governing laws (Newtonian gravity) were *incomplete/inaccurate* for describing motion in strong gravitational fields (Mercury's orbit). The inference to a new mass, while rational *given the assumed laws*, was flawed because the laws themselves were not the ultimate governors in that regime. The failure points to the limitations of the specific governing framework, not the concept of governance itself. GR provided the *correct* governing laws for that domain.
      *   *Weight of Constraint:* Moderate. It highlights that inferences based on governing laws depend critically on the *truth* of those laws. The *same form* of argument (governing law + anomaly -> new governed entity) succeeded when the laws were (approximately) true and failed when they were not. This doesn't refute governance but emphasizes the epistemic challenge of knowing the *true* governors. The differential outcome underscores that governance is a substantive claim about the world, not just a summary.

  **3. Testing Your Distinctions & Suspicions:**

  *   **Production vs. Reach:**
      *   *The Case's Evidence:* Your suspicion is correct. This episode is primarily about **Reach**. Both Neptune and Vulcan were hypotheses about the *unobserved* (mass, position) generated to *extend* the predictive/explanatory power (reach) of the current physical theory over the mosaic. The *success* or *failure* of these predictions directly tests the *reach* of the respective systems/laws (Newtonian vs. Newtonian in a new regime).
      *   *Silent on Production:* The case doesn't engage with whether Newton's law *made* planets move or merely described their motions. Both Humeans and Anti-Humeans can agree that the law had predictive reach (or failed to have it in Mercury's case). GR's success also demonstrates superior reach. The metaphysical "making happen" (production) remains orthogonal.
      *   *Humean Helpfulness:* Confirmed. The Humean can fully account for the episode in terms of the *reach* (predictive/explanatory power, fit with the mosaic) of competing systems. The case doesn't force a commitment to production.

  *   **Slippage, Extendability, and the BSA:**
      *   *Slippage Tolerance:* The BSA always faces the trade-off. The Mercury residual was tolerated as localized slippage because modifying the core laws (Option 2) or accepting an unconfirmed entity (Vulcan post-failure) made the system *worse* overall (complexity cost > strength gain). Tolerance is determined by whether alternative systems offer a better simplicity+strength balance for the *known* mosaic.
      *   **Extendability as a Virtue:** This case *does* highlight an implicit virtue – **Extendability/Fruitfulness**. The Newtonian system's immense success stemmed partly from its ability to generate *successful* predictions in *new domains* (Neptune). The Vulcan hypothesis was an attempt at extendability that *failed*. The BSA, as standardly stated (simplicity + strength over the *actual* mosaic), doesn't explicitly reward *potential* for future successful extension. However:
          *   *Humean Incorporation:* A pragmatic Humean can argue that *strength* inherently values not just summarizing known data but also constraining *possible* future data. A system that successfully predicts the new (like Neptune) retrospectively *demonstrates* higher strength. A system whose extensions *fail* (like Vulcan) retrospectively demonstrates lower strength. Extendability is thus *instrumental* to achieving high strength over the *total* mosaic. It's an *epistemic guide* to finding better systems, not an extra ontological virtue. It doesn't require anti-Humean "governance into the future."
      *   *Anti-Humean Disguise Check:* Your second suspicion is insightful but doesn't fully hold. While extendability *feels* like it points to governance (laws governing the unseen), the Humean can ground it pragmatically in the *historical success* of certain systems at fitting the *growing* mosaic. The resource (prior success in new domains like Neptune) is historical/empirical, not a covert appeal to governing necessity. It's about tracking patterns, not ontological production.

  **4. Verdict:**

  *   **Humean (BSA):** This episode is **compatible with, and illustrative of, the BSA**. It showcases the core trade-offs (simplicity vs. strength), the post-hoc evaluation of systems based on the total mosaic, the handling of slippage, and the pragmatic role of extendability/fruitfulness as an indicator of potential strength. The differential vindication poses no problem. It's not a confirming anomaly, but a standard example of scientific theory development within a Humean framework.
  *   **Anti-Humean (Governance):** This episode is also **compatible with governance**. It demonstrates how the concept of governing laws drives the search for explanatory entities (governed masses) when anomalies arise, and how the success/failure of such inferences depends on the accuracy of the governing laws assumed. The differential vindication highlights the epistemic challenge of identifying the true governors but doesn't undermine the core concept. It's not a confirming anomaly, but a historical example of governance-based reasoning encountering the limits of a specific law.
  *   **Overall:** This episode is **the sort of case both views were built to handle** within their own frameworks, primarily concerning the **reach** of laws/systems. It effectively **tests their ability to model scientific practice and inference** regarding anomalies and unobserved entities. Neither view is uniquely confirmed or refuted. The differential vindication constraint bears significant weight in showing that *both* views must account for the context-dependence of scientific inference (the mosaic for Humeans, the specific laws for Anti-Humeans) but doesn't decisively favor one. Your distinctions are crucial: focusing on **reach** clarifies the debate's relevant aspects, while the **extendability** point, though important for understanding scientific practice, can be incorporated by the Humean without ontological backsliding. The episode underscores that the core disagreement about **production** remains metaphysically distinct from the predictive/explanatory successes and failures explored here.
