  For the anti-Humean, laws govern, so the residual indicates a violation. Options like error or new mass are attempts to resolve this. Vulcan was a reasonable inference under governing laws, but its failure doesn't undermine the method. GR later provides the correct governing law. The differential vindication here is tricky—same method, different outcomes. Anti-Humeans might argue that without a governing force, such inferences wouldn't make sense, but the Neptune success supports them, while Vulcan's failure is due to incomplete laws, not the governance concept.

