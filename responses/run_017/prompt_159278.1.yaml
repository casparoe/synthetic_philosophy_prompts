prompt: |-
  hi — in my decision theory reading group one person keeps ending discussion of the Allais paradox with "obviously rational preferences have to be independent of irrelevant alternatives", and he uses it twice over: to say the Allais choices are just a mistake, and to say prospect theory can only ever be descriptive. I think the line is doing less work than he thinks, but I dont know which precise claim to argue with.

  Can you lay out the different things that sentence could actually mean, as a menu? The distinctions I want in it: (i) the menu version — your choice between two options shouldn't flip when a third option you wouldn't have picked is added; (ii) the mixture version — where the "irrelevant" thing isn't an option on a menu at all but a shared outcome branch: if you'd get the same consequence with the same probability either way, it shouldn't affect which you prefer; (iii) the state-by-state "sure thing" version — if you'd prefer A to B conditional on E and also conditional on not-E, then prefer A to B; (iv) the social-choice version, which I suspect is a totally different axiom wearing the same name; (v) the strong version — that a rational agent's preferences are context free, no framing, no regret, no status quo effects. For each, say whether its a platitude, a substantive but defensible requirement, or actually false — and say which of them the Allais pattern even bears on. My hunch is (i) and (iv) are red herrings here and the real fight is between (ii) and (iii), but tell me if that's wrong.

  Two more things. He also said that violating independence means you can be money-pumped or that your plans go dynamically inconsistent, and I thought that only followed from intransitivity — is there a reading of the slogan under which he's right? And is there a reading on which what's really going on in Allais isn't dependence on an alternative at all but something about how probabilities get weighted, so that "independence of irrelevant alternatives" is just a misnomer for it?

  Write it in British English, and keep it as a list I can take back to the group.
reasoning: |-
  Okay, the user is part of a decision theory reading group grappling with the Allais paradox. One member keeps shutting down discussions by claiming "rational preferences must be independent of irrelevant alternatives" to dismiss the paradox and prospect theory. The user suspects this argument is oversimplified but isn't sure how to counter it. They want a structured breakdown of what "independence of irrelevant alternatives" (IIA) actually means in different contexts, specifically asking for: 

  First, they want a menu of interpretations: (i) menu version (choice consistency when adding options), (ii) mixture version (shared outcomes in lotteries), (iii) sure-thing principle (state-wise dominance), (iv) social choice version (voting theory), and (v) strong context-independence. For each, they want to know whether it's a platitude, defensible, or false, and its relevance to Allais. Their hunch is that (ii) and (iii) are central to Allais while (i)/(iv) are distractions. 

  Second, they question whether violating IIA truly leads to money-pumping (since they thought only intransitivity causes this), and wonder if the Allais paradox is really about probability weighting rather than "irrelevant alternatives." 

  The user needs this in British English as a clear list for group discussion. They're clearly analytically sophisticated but frustrated by the oversimplification. Their deeper need is likely intellectual ammunition: precise distinctions to reopen debate without sounding pedantic. The Allais paradox specifically violates the mixture version of independence (ii), not menu consistency (i). The money-pumping claim is partially right but nuanced—dynamic inconsistency can occur with mixture violations if preferences shift across time, but it's not guaranteed like with intransitivity. And yes, the "irrelevant alternatives" framing is somewhat misleading; Allais is more about nonlinear probability weighting. 

  For the response: I'll structure it as a numbered list matching their requested categories, using British spelling. Each point will clarify the interpretation, its status (platitude/defensible/false), Allais relevance, and the money-pumping issue separately. I'll emphasise that (ii) is the core conflict in Allais, while (iii) is distinct and less controversial. The conclusion will stress that their peer is conflating concepts and that prospect theory's descriptive power isn't undermined by rejecting mixture independence.
answer: |-
  Here's a breakdown of "independence of irrelevant alternatives" (IIA) interpretations relevant to your decision theory group, in British English, structured as requested. The Allais paradox primarily challenges one specific version, and your peer seems to be conflating several distinct concepts.

  ### The IIA Menu: Interpretations & Relevance to Allais

  1.  **Menu Version (Choice Consistency with Added Options):**
      *   **Meaning:** Your choice between options A and B shouldn't change if a third option C (which you wouldn't choose anyway) is added to or removed from the menu. E.g., Choosing fruit salad over chocolate cake shouldn't flip to chocolate cake just because a stale biscuit is also offered.
      *   **Status:** **Substantive but defensible requirement for rational choice in *static* contexts.** Violations suggest context effects (decoy effect, attraction effect) potentially exploitable or inconsistent with preference maximisation. However, some violations (e.g., due to menu-dependent information or regret) might be argued as rational in specific *dynamic* contexts.
      *   **Relevance to Allais:** **Irrelevant.** The Allais paradox involves choices between *different pairs* of lotteries (Problem 1: A vs B; Problem 2: C vs D). It doesn't involve adding/removing an option *to the same choice set*. The "irrelevant alternative" in Allais arguments is usually a *shared outcome branch* within the lotteries themselves, not an extra menu item.

  2.  **Mixture Version (Independence Axiom of Expected Utility - EU):**
      *   **Meaning:** If you prefer lottery A over lottery B, then you should prefer the mixture (p)A + (1-p)C over the mixture (p)B + (1-p)C, *for any other lottery C and any probability p (0 < p ≤ 1)*. The "irrelevant alternative" here is the shared consequence C appearing in both mixtures with the same probability.
      *   **Status:** **Substantive, core axiom of EU theory.** It's *not* a platitude – it encodes a specific, strong restriction on preferences (linearity in probabilities, no probability weighting). Many find common patterns (like Allais) violating it descriptively compelling. Normatively, it's highly contested – defenders see it as essential for coherence; critics see it as an unrealistic restriction ignoring how people perceive probabilities and certainty.
      *   **Relevance to Allais:** **Direct and Central.** The Allais paradox is a *paradigmatic violation* of this axiom. The common consequence (£0 in the classic version) appearing in both options of Problem 1 and one option of Problem 2 is treated as "irrelevant" by EU, but people's choices show it *is* relevant to them, particularly when it creates certainty in one option. This is the version your peer is likely invoking when dismissing Allais choices as a "mistake" and prospect theory as merely descriptive.

  3.  **State-by-State "Sure Thing" Version (Savage's Sure-Thing Principle):**
      *   **Meaning:** If you prefer A to B conditional on every possible state of the world (or event E occurring), and you also prefer A to B conditional on E *not* occurring, then you should prefer A to B unconditionally. The "irrelevant" thing is the specific state/event – your preference shouldn't depend on states where the outcomes are identical.
      *   **Status:** **Defensible requirement, arguably closer to a platitude.** Violations seem deeply irrational, implying a preference reversal based solely on outcomes that are identical in the compared acts. It's fundamental for separating beliefs (probabilities) from values (utilities). Major descriptive violations are rarer than Mixture Independence violations.
      *   **Relevance to Allais:** **Tangential.** While the Allais paradox *can* be framed in a way that *superficially* appears to violate the Sure-Thing Principle (by partitioning states), this framing relies on a specific (and arguably misleading) state definition where probabilities are bundled with outcomes. When states are defined purely based on the randomising device (e.g., ticket numbers), the Allais choices *do not* violate the Sure-Thing Principle. The core conflict is with the *Mixture Independence* axiom.

  4.  **Social Choice Version (Arrow's IIA):**
      *   **Meaning:** The social preference between two alternatives X and Y should depend *only* on individuals' preferences between X and Y, *not* on their preferences regarding any other "irrelevant" alternative Z. E.g., Society's ranking of Labour vs Tory shouldn't change based on how people feel about the Monster Raving Loony Party.
      *   **Status:** **Substantive axiom in social choice theory.** It's a technical requirement to avoid strategic voting and ensure consistency in aggregation, but famously conflicts with other desirable properties (like the Pareto principle) per Arrow's Theorem. It's *not* directly about individual rationality.
      *   **Relevance to Allais:** **Irrelevant.** This is a completely different concept concerning *aggregating* individual preferences into a social preference. It has no bearing on the individual decision-making context of the Allais paradox or expected utility.

  5.  **Strong Context-Independence / Framing Invariance:**
      *   **Meaning:** Rational preferences should depend *only* on the objective outcomes and probabilities (or states), not on the *description* (framing), the presence of unchosen alternatives inducing regret, the status quo, or other contextual factors. Preferences are intrinsic properties of the options themselves.
      *   **Status:** **Substantive but highly contested normative ideal.** Defenders see it as essential for true rationality, avoiding arbitrage and inconsistency. Critics argue it ignores psychologically real factors like loss aversion, regret, and reference dependence, which can be evolutionarily adaptive or reflect genuine values. Many descriptive findings (framing effects, endowment effect) violate this.
      *   **Relevance to Allais:** **Indirect.** While the classic Allais presentation isn't usually about *framing* per se, the *reason* people violate Mixture Independence (e.g., overweighting certainty) *is* a type of context-dependence relative to the strict EU view. Prospect theory explicitly incorporates context (reference points, framing). Your peer's dismissal of prospect theory likely relies on this strong view.

  ### Your Hunch & The Core Fight
  You are largely **correct**. (i) and (iv) are **red herrings** for the Allais paradox. The **core fight** is indeed between **(ii) Mixture Independence** and the descriptive reality of choices like Allais. **(iii) Sure Thing** is related but distinct and much harder to violate rationally; Allais doesn't genuinely challenge it. **(v) Strong Context-Independence** is the broader normative stance your peer likely holds, under which adherence to (ii) is seen as necessary.

  ### Money-Pumping & Dynamic Inconsistency
  *   **Your Peer's Claim:** Violating IIA (meaning Mixture Independence) leads to money-pumping or dynamic inconsistency.
  *   **The Nuance:**
      *   **Intransitivity** is the classic, guaranteed route to money-pumping (cyclical preferences exploited over time).
      *   Violating **Mixture Independence** alone does *not* directly imply intransitivity or guaranteed money-pumping. *However*, it *can* lead to **dynamic inconsistency** in sequential choice problems where earlier commitments (plans) rely on the independence axiom holding.
      *   **How it can happen:** Imagine you prefer A to B, but due to violating Mixture Independence, you prefer (0.1B + 0.9C) to (0.1A + 0.9C). A clever exploiter could:
          1.  Offer you a choice between (0.1A + 0.9C) and (0.1B + 0.9C). You choose (0.1B + 0.9C).
          2.  Then offer to replace the 0.1B component with A (which you prefer to B!). If you accept, you end up with (0.1A + 0.9C) – which you initially rejected! You've paid to end up worse off by your own initial lights.
      *   **Conclusion:** Your peer is **partially right, but oversimplifying**. Violating Mixture Independence *does* open the door to dynamic inconsistency and potential exploitation in sequential decisions, even without strict intransitivity. It's a different vulnerability than pure intransitivity, but still problematic for coherent long-term planning.

  ### Is "Irrelevant Alternatives" a Misnomer for Allais?
  *   **Yes, arguably.** Framing the Allais violation as "dependence on an irrelevant alternative" (the common consequence, like £0) is somewhat misleading and stems directly from the EU perspective.
      *   **Prospect Theory's View:** The core phenomenon isn't that an *alternative* is relevant, but that *probabilities are weighted non-linearly*. People overweight small probabilities (making the 1% chance of £0 in option B1 very salient) and underweight large probabilities (making the difference between 99% and 100% certainty in A1 vs A2 extremely salient). The "irrelevant" consequence (£0) gains relevance *because* of the *specific probability* it occurs at relative to the other options. It's about the *psychology of probability weighting and certainty effects*, not about the alternative per se.
      *   **Better Description:** The Allais pattern demonstrates a violation of the *linearity in probabilities* assumption of EU, driven primarily by the *certainty effect* (overweighting sure gains) and *probability weighting*. Calling it "dependence on an irrelevant alternative" imports the normative EU framing into the description.

  ### Summary for Your Group

  1.  **"IIA" is ambiguous.** Your peer is likely invoking the **Mixture Independence axiom (ii)** when dismissing Allais and prospect theory, while implicitly relying on **Strong Context-Independence (v)** as the normative ideal.
  2.  **Allais directly challenges** Mixture Independence (ii), not Menu Consistency (i) or the Sure-Thing Principle (iii). Social Choice IIA (iv) is irrelevant.
  3.  **Violating Mixture Independence (ii)** *can* lead to **dynamic inconsistency** and potential exploitation in sequential decisions, even if preferences are transitive. Money-pumping is possible, though the mechanism differs from pure intransitivity.
  4.  **The term "irrelevant alternative"** is somewhat misleading for Allais. The core issue is **non-linear probability weighting** (especially the certainty effect), making consequences at specific probabilities unexpectedly salient relative to EU predictions.

  **Key Argument:** Point out that labelling common, robust choice patterns like Allais as a simple "mistake" based solely on Mixture Independence is question-begging. It assumes the very axiom (and the Strong Context-Independence it implies) that is under debate. Prospect theory provides a coherent (though not necessarily normatively compelling to EU defenders) *explanation* for *why* people violate it, grounded in psychological realism, which Mixture Independence dismisses axiomatically. The existence of potential dynamic inconsistency is a *consequence* of the violation, not proof that the axiom itself is an undeniable requirement of rationality; one could argue the axiom is descriptively false and normatively optional, requiring different safeguards for sequential choice.
