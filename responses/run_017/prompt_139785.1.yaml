  ### Candidate Rules Fitting All Six Precedents
  Based on the precedents and the 2011 memo, I derive two candidate rules that jointly fit all six cases. The memo emphasizes that a field is scientific if (1) its claims can conflict with observation, and (2) practitioners treat sustained conflict as a reason for revision, provided revisions do more than accommodate existing data. The precedents show that falsifiability alone is insufficient (e.g., *ambient field epidemiology* was falsifiable but rejected), while unfalsifiable cores can be acceptable if they enable progressive research (e.g., *carrier framework*). The rules are:

  - **Rule A (Risk and Revision with Novel Confirmation):**  
    A field qualifies if it has a falsifiable subcomponent (e.g., models or predictions) that can be genuinely jeopardized by data, and when failures occur, revisions generate *novel, independently confirmed predictions*. Revisions must not merely fit existing data; they must produce testable content that is later validated. This rule prioritizes empirical risk-taking and confirmation of new insights from revisions.  
    *Fits all precedents:*  
    - *Tectonic*: Revised assumptions led to novel, confirmed predictions.  
    - *Motivational*: No falsifiable subcomponent; failures explained away.  
    - *Carrier*: Unfalsifiable core, but satellites are falsifiable and revised/confirmed.  
    - *Ambient*: Falsifiable but never genuinely jeopardized (flawed methods).  
    - *Phenology*: Preregistered revisions led to new, tested predictions.  
    - *Coherence*: No falsifiable subcomponent; tests couldn’t fail.  

  - **Rule B (Progressive Research Program):**  
    A field qualifies if it is a *productive program* generating falsifiable models with a track record of confirmed predictions or practical applications, even if the core is unfalsifiable. Revisions need not always yield novel predictions if the program demonstrates progress (e.g., successful applications, cumulative confirmed models). This rule emphasizes real-world traction and community-driven advancement.  
    *Fits all precedents:*  
    - *Tectonic*: Quantitative predictions confirmed, showing progress.  
    - *Motivational*: No progress; no confirmed models/applications.  
    - *Carrier*: Progressive due to confirmed satellites and field conventions.  
    - *Ambient*: No progress; effect sizes faded, no applications.  
    - *Phenology*: Rigorous methods led to working predictions.  
    - *Coherence*: No progress; no independent tests or applications.  

  The rules disagree sharply on revisions: Rule A requires novel confirmed predictions after failures, while Rule B accepts revisions that maintain progress (e.g., via applications or cumulative confirmations) without novel predictions. Rule A is stricter on methodological rigor, while Rule B is more permissive if the field "works" in practice.

  ### Prediction for Phase-Lattice Dynamics
  - **Rule A Prediction: Reject with high confidence.**  
    The belt models are falsifiable subcomponents, but revisions (kernel re-specification) lack rigorous novel confirmation. Novel predictions are qualitative, tested on small samples (n=20–40) with flexible rules and no power analysis, leading to unreliable confirmation (70% unregistered vs. 35% preregistered). The 2022 replication failures were met with ad hoc "site-specific coupling" without generating novel, tested predictions. Revisions accommodate data without independent validation, violating the memo’s "no mere accommodation" clause. Engineering applications are narrow and don’t compensate for weak revisions.  
    *Confidence: High* – Fails on novel confirmation and jeopardy (like *ambient*).  

  - **Rule B Prediction: Reject with moderate confidence.**  
    The field has progressive elements (e.g., engineering applications, some confirmed models), but the low preregistered hit rate (9/26 ≈ 35%, near chance) and methodological flaws (small samples, no power analysis) undermine its track record. The replication failures and ad hoc response suggest degeneration, not progress. While the core is protected (like *carrier*), the belt models lack consistent confirmation in rigorous tests, and the program isn’t cumulatively advancing.  
    *Confidence: Moderate* – Engineering applications and unregistered successes might sway some, but poor methods and replication failures align with rejected cases like *ambient* and *coherence*.  

  ### Best Guess for Committee Vote
  **Vote: Reject (5–2 margin).**  
  - **Reasoning:** The committee will likely apply a **Rule A-aligned reading of the memo**, emphasizing that revisions must generate novel, rigorously tested predictions. This reading is supported by:  
    - *Tectonic* and *phenology*, where revisions led to confirmed novel predictions.  
    - *Ambient* and *coherence*, rejected for avoiding jeopardy despite falsifiability.  
    - *Carrier*, approved because satellites were tested/confirmed, not just because they existed.  
    The memo’s focus on "sustained conflict as a reason for revision" and rejection of data accommodation fits Rule A. Phase-lattice dynamics fails this: kernel revisions have novel predictions, but testing is weak (small samples, no power), and the 2022 response was ad hoc. Engineering applications are too narrow to override this, per *phenology*’s emphasis on rigorous testing even with practical use. Two members may dissent, favoring Rule B due to applications and unregistered successes, but precedent consistency (e.g., *ambient*’s rejection for similar flaws) will dominate.  

  ### Closest Analog Precedent
  **Ambient field epidemiology (2016) is the closest analog.**  
  - **Why:** Both involve falsifiable claims never truly jeopardized due to methodological flaws. *Ambient* had small studies, HARKing (re-specifying outcomes post-data), and effect drift; phase-lattice has small samples, flexible testing, no power analysis, and a preregistered hit rate near chance. Both fields "revise" (*ambient* re-specified outcomes; phase-lattice re-specifies kernels), but revisions only accommodate data without generating rigorous new tests. The committee note for *ambient*—"claims never put in jeopardy"—applies directly here. *Carrier* is a weak analog due to its protected core, but its satellites were confirmed and field conventions were respected, unlike phase-lattice’s unreliable belt models.  

  ### Principles Adopted Under Each Option
  The precedents underdetermine whether Rule A or B should dominate, as both fit the cases but imply different principles:  
  - **If Approved:** The committee adopts Rule B, prioritizing *practical progress over methodological rigor*. This would mean accepting fields with protected cores and ad hoc revisions if they produce working applications or occasional confirmations, even with high-risk-of-bias methods. This weakens the memo’s "revision beyond accommodation" requirement.  
  - **If Rejected:** The committee adopts Rule A, prioritizing *methodological rigor and empirical risk*. This requires revisions to yield novel predictions that are stringently tested, treating applications as secondary to knowledge growth. This enforces the memo’s emphasis on conflict-driven revision.  

  ### Further Evidence to Separate Surviving Rules
  **Conduct a preregistered, adequately powered test of a novel prediction from a post-failure revision.**  
  - **Scenario:** After a belt model failure, practitioners revise the coupling kernel and derive a novel quantitative (not directional) prediction. This prediction is preregistered with a fixed analysis plan, power analysis (e.g., n≥100), and no exclusion flexibility. An independent lab tests it.  
  - **What Rule A Says:**  
    - If *confirmed*, it supports qualification by showing revisions yield rigorous novel confirmations (as in *tectonic*).  
    - If *falsified*, it reinforces rejection by proving revisions are degenerative.  
    Rule A requires confirmation here for approval.  
  - **What Rule B Says:**  
    - If *confirmed*, it boosts the progressive track record, likely leading to approval.  
    - If *falsified*, Rule B might still approve if engineering applications exist and other models work (arguing the program is progressive overall).  
  This test separates the rules: Rule A demands novel confirmation from revisions, while Rule B allows failure if progress is evident elsewhere. For phase-lattice, a falsification would highlight Rule A’s strictness, while confirmation could sway Rule B voters.  

  ### Summary
  Phase-lattice dynamics will likely be rejected under a Rule A-aligned reading (emphasizing rigorous novel confirmation after revisions), with *ambient* as the key analog. The committee’s vote adopts the principle that revisions must do more than accommodate data—they must generate testable insights validated independently. A preregistered test of a post-revision novel prediction would best clarify if Rule A or B should govern future cases.
