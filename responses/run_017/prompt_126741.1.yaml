prompt: |-
  I'm in eleventh grade and I debate for my school's team. Last weekend's resolution was "Patriotism is a virtue," and the negative bench kept coming back to a single line: "My country, right or wrong." Their use of it was something like this: patriotism is at bottom a loyalty that does not track whether its object deserves it, a disposition that is insensitive to reasons cannot be a virtue, so patriotism is at best a sentiment and at worst a vice. My partner answered by reciting a longer version I have also seen floating around online — "My country, right or wrong; if right, to be kept right; and if wrong, to be set right" — and the negative replied that this simply changed the subject, since a person busy setting the country right is being loyal to something else, not to the country. I could not tell who was right, and I suspect neither of them was being precise about what the sentence actually says.

  So I would like that sentence disambiguated. Please give me a menu of the precise claims it could be making, ordered from the ones that are nearly trivial to the ones that are genuinely strong, with a verdict attached to each: which is a platitude nearly everyone already accepts in some form, which is substantive and might survive scrutiny, which is false or incoherent, and which one people who repeat the line are usually reaching for. For every reading, say whether it genuinely supports the negative's argument, or instead supports my partner's reply, or does neither.

  Two complications of my own, since they are where I got stuck. First, I have been trying to sort patriotisms into kinds, and I cannot tell which kind the slogan is even about: (a) the team-support kind, where you want your country to come out ahead and feel pride when it does; (b) the gratitude kind, where you owe the country something for what it has given you; (c) the trustee kind, where you have been handed an institution along with its stated ideals and are answerable for holding it to them; (d) the kin kind, where you simply give compatriots more weight than strangers. Second, my test case: a friend who loves this country's language, music, and countryside, thinks its founding involved serious injustice, and works against several of its present policies — yet says she does all of that because she loves the country and wants it to become worthy of the promises it made. Under which readings is she a patriot, and under which is she something else under a borrowed name?

  One constraint on the answer, please. Do not lay out the menu and leave me to choose at the tournament: commit. Tell me which single reading I should concede to the negative, which single reading I should force them to defend, and give me the one sentence of rebuttal you would actually stand behind, together with your reason for preferring it. Then flag the verdict you are least confident about and say what would change your mind on it.
reasoning: |-
  Okay, let me try to figure out how to approach this user's question. They're a high school debater who encountered the phrase "My country, right or wrong" in a recent debate. The negative team used it to argue that patriotism isn't a virtue because it demands blind loyalty. The user's partner countered with the extended version about setting the country right, but the negative claimed that changing the country means being loyal to something else. The user wants a clear breakdown of the possible interpretations of this phrase, sorted by how strong they are, and guidance on how to handle the debate.

  First, I need to parse the different meanings of the slogan. The original "My country, right or wrong" suggests unconditional loyalty. The extended version adds conditions: keep it right if it is, set it right if it's wrong. The key ambiguity is what "country" refers to—is it the current government, the land, the people, or the ideals? 

  The user also mentioned four types of patriotism: team-support, gratitude, trustee, and kin. Each type influences how the slogan is interpreted. For example, the trustee view aligns with the extended version, where loyalty is to the ideals, not the current state. The negative's argument hinges on the idea that any change means disloyalty, which might confuse the object of loyalty.

  The test case with the friend who loves cultural aspects but criticizes policies is crucial. Under the trustee view, she's a patriot because she's committed to the ideals. But under the team-support view, she might not be seen as loyal. The user needs to know which interpretation to push in the debate.

  I should structure the interpretations from trivial to strong. The trivial one is that we should care about our country, which everyone accepts. The substantive one is that loyalty to ideals requires active reform, which is defensible. The strong claim is that the country is always worthy, which is untenable. The negative is likely conflating the strong claim with the original slogan, ignoring the extended version's nuance.

  For the debate strategy, the user should concede the strong interpretation as indefensible but force the negative to defend against the substantive one. The rebuttal should clarify that "country" means the ideals, not the current policies. Highlighting the friend example would show reform as true patriotism.

  I need to ensure the user understands which interpretation to use. The trustee view supports their partner's argument. The negative's conflation of changing policies with disloyalty ignores the distinction between the nation's ideals and its actions. 

  The least confident verdict might be whether the substantive claim survives scrutiny, but historical examples like abolitionists show that reform aligns with national ideals. If the country lacks any shared ideals, the claim might not hold, but most nations have foundational principles to appeal to.
answer: |-
  Here's a precise disambiguation of "My country, right or wrong; if right, to be kept right; and if wrong, to be set right," ordered by strength, with verdicts and relevance to your debate. I'll then address your complications and give you a concrete strategy.

  ### The Menu of Interpretations
  1.  **Trivial (Descriptive Duty):** "I have a special responsibility to *care* about my country's moral status and practical functioning."
      *   **Verdict:** Platitude. Everyone accepts citizens should care about their country's direction.
      *   **Debate Relevance:** Supports neither side directly. It's the baseline both teams agree on.
      *   **Patriotism Type:** Compatible with all (a-d), but weakest.

  2.  **Weak (Active Concern):** "My loyalty demands I *act* to maintain or improve my country's condition."
      *   **Verdict:** Mildly substantive, widely accepted. Most agree citizens shouldn't be passively complacent.
      *   **Debate Relevance:** Supports your partner slightly (shows loyalty *includes* corrective action), but doesn't fully rebut the negative's "loyalty to something else" charge.
      *   **Patriotism Type:** Leans towards (c) Trustee, hints at (b) Gratitude.

  3.  **Substantive (Constitutive Loyalty):** "Loyalty *to the country itself* is *defined* or *expressed* through the active work of preserving its righteousness or correcting its faults. The 'country' I am loyal to is its *enduring ideals and potential*, not merely its current policies or government."
      *   **Verdict:** Substantive and defensible. This is the core of your partner's rebuttal and the strongest reading of the extended phrase. It directly confronts the negative's conflation of "country" with "current government/policies."
      *   **Debate Relevance:** Directly supports your partner and refutes the negative. It argues that "setting right" *is* loyalty to the *true* country (its principles/aspirations), not disloyalty or loyalty to something else.
      *   **Patriotism Type:** Strongly (c) Trustee. Loyalty is to the nation's foundational ideals and the well-being of its people (d), requiring active stewardship.

  4.  **Strong (Moral Monopoly):** "My country's actions, by virtue of being *my country's*, possess a unique moral legitimacy or demand my support *even when objectively wrong*, simply because it is mine."
      *   **Verdict:** False/Incoherent/Vicious. This collapses into the original "My country, right or wrong" without the extension. Loyalty becomes detached from reason/morality.
      *   **Debate Relevance:** Supports the negative's core argument. This is the interpretation they *implicitly assign* to the original phrase and *wrongly project* onto the extended phrase.
      *   **Patriotism Type:** Primarily (a) Team-Support, potentially (b) Gratitude distorted into unquestioning debt.

  **What people usually reach for:** Critics (like the negative) invoke #4 ("blind loyalty"). Proponents (like your partner) invoke #3 ("loyalty to ideals"). The negative's "changing the subject" claim *only works* if they force the Strong (#4) interpretation onto the Substantive (#3) one.

  ### Addressing Your Complications
  *   **The Slogan's Type:** The extended slogan ("...to be set right") is fundamentally **(c) Trustee patriotism.** It frames loyalty as fidelity to the nation's *ideals and purpose*, requiring active maintenance and correction. It explicitly rejects defining the "country" solely as its current government or policies.
  *   **Your Test Case Friend:** Under the **Substantive (#3) / Trustee (c)** reading, she is the *paradigmatic patriot.* Her love for the culture/land (d) fuels her commitment to holding the country accountable to its stated ideals (c). She rejects blind support (a) but acts out of deep commitment to *what the country claims to be and could be*. Under the Strong (#4) or pure Team-Support (a) reading, she would be seen as disloyal or "something else."

  ### Your Debate Strategy: Commit
  1.  **Concede to the Negative:** The **Strong (#4) interpretation** ("Moral Monopoly") is indefensible and vicious. Agree that *if* patriotism demands supporting your country *unconditionally, even when wrong*, it cannot be a virtue. This disarms their strongest point and isolates it.
  2.  **Force Them to Defend Against:** The **Substantive (#3) interpretation** ("Constitutive Loyalty"). This is the core of the extended phrase and the only defensible form of virtue-linked patriotism. Make *them* argue that loyalty to a nation's *enduring ideals and potential* (distinct from its current government/policies) is either incoherent, not *real* patriotism, or somehow not virtuous.
  3.  **Your Rebuttal Sentence & Why:**
      *   **Rebuttal:** "Patriotism is loyalty to the *nation's foundational ideals and the well-being of its people*, not sycophancy towards its current government; therefore, working to 'set right' manifest wrongs is the *truest expression* of that loyalty, demanding moral sensitivity – the hallmark of virtue."
      *   **Why:** This directly refutes the negative's conflation of "country" with "current government/policy." It defines patriotism (#3/c) as inherently reason-sensitive (tracking ideals/well-being), making it compatible with virtue. It uses their language ("demanding moral sensitivity") against them. It positions your partner's extension as the *correct* understanding of loyalty to country.

  **Least Confident Verdict & What Would Change It:**
  *   **Verdict:** That the **Substantive (#3) interpretation** ("Constitutive Loyalty") *robustly survives scrutiny* as a virtue.
  *   **Why:** The hardest challenge is defining the "enduring ideals" uncontroversially (especially in nations with contested foundations or histories of oppression) and proving loyalty to *that* abstraction is meaningfully distinct from loyalty to the state apparatus. It risks becoming loyalty to a personal ideal *labeled* as the country's.
  *   **What Would Change My Mind:** If it could be shown that *in practice*, appeals to "true national ideals" consistently devolve into justifying harmful nationalism or suppressing dissent *in the name* of those ideals, regardless of the speaker's intent, undermining the claim that this form is reliably virtuous. However, historical examples like abolitionists or dissidents appealing to founding principles against prevailing injustices provide strong counter-evidence. Your strategy forces the negative to make this difficult case.
