prompt: |-
  Hi — I volunteer at a community radio station, and I'm one of three people rewriting our language policy. Right now the whole thing is one line: no slurs, context is irrelevant, you get pulled off air. I keep hitting cases where I don't believe that, and I'd rather figure out what I actually think before trying to write something other people can apply. I'll use labels (the n-word, the f-slur, the slur for traveller/gypsy communities) rather than typing the words out.

  My verdicts, going on gut:

  1. A news reader reporting that someone spray-painted the n-word on a synagogue — fine, obviously.
  2. The same news reader saying the whole word in that report when the n-word would have done, apparently just because they like saying it — not fine. I'm a bit surprised I think this, since nothing about the content of what they said changed.
  3. A DJ reading out a listener's letter: he shouted [slur] at me on the bus — fine.
  4. Playing the original recording of an old track that has the n-word in it — fine, and I don't want it bleeped.
  5. A white presenter in the studio singing along to the reclaimed -a form on a track by a Black artist — not fine. This is the pair I can't reconcile: in 4 and 5 nobody is being addressed, nobody is expressing contempt, the words on the record are identical, and I still land in different places.
  6. Two Black callers using the -a form to each other affectionately, on air — fine.
  7. A white caller using it to a Black caller he's friendly with, imitating 6 exactly — not fine, and not fine by a mile.
  8. A gay comedian calling himself the f-slur in his own set — fine. A straight comedian calling that same comic the f-slur in what he insists is affection — not fine.
  9. A 12-year-old caller who repeats a slur they heard in a song and clearly has no idea what it means — I don't want to say fine, and I don't want to treat it like 7. It feels like a different thing: not an insult but a mess that needs cleaning up.
  10. An exchange student who uses the ordinary word in their language for Roma people, which happens to be the slur in English — same shape as 9 for me: not fine, but a correction, not a ban.
  11. A bigot shouts a South Asian slur at someone he's mistaken for South Asian, who's actually Lebanese — I still count that as slurring, and I think it wrongs the person he shouted at, even though they aren't in the group the word targets.
  12. Someone typing slurs into a private group chat of fellow bigots, where nobody from any targeted group ever sees it — I still want it to count, and I still want us to be able to kick someone off the schedule for it, even though nobody was addressed and nobody was hurt.
  13. A British DJ using spaz to mean clumsy, on a show streamed mostly to the UK but also to the US — the one I go back and forth on. Some days: it's just his dialect, he's insulting nobody. Other days: we're on the internet, and for a chunk of the audience it lands as a slur.
  14. Someone using an old slur for the Welsh that I'd bet 90% of the audience has never heard — I basically don't care, which worries me, because on any theory I can think of its the same kind of word as the others.
  15. A Black caller using a crude term for white people — not fine under our rules, but I don't think it's the same kind of thing as an anti-Black slur, and I can't say why without either appealing to power and history (which then makes the wrong in the other cases depend on facts about society rather than about the utterance) or just stipulating it.

  So: is there one principle that gets these? Or am I obviously tracking three different questions — is that a slur, was it wrong, should we sanction it — and fooling myself by asking only one? Give me the principle, or the smallest set of them, stated precisely enough that I could actually apply it on a Tuesday night, and tell me which of my cases forces each clause. Then tell me which verdicts it can't keep: I'd rather lose 14 than 5, and I'd rather lose 13 in either direction than lose 11, but tell me if that ordering is even coherent. And run it on three I don't have verdicts for: (a) a straight actor playing a gay character in a period drama saying the f-slur in character, in our drama slot; (b) a caller who says the n-word in the middle of explaining why nobody should say it, unprompted; (c) a caller from the group targeted by slur S using S with real contempt about another member of that group.

  Also: if the honest answer is that the one-line no-context rule is the right rule for a station even though it's wrong about the phenomenon, say that, and say what the gap between the two is doing.
reasoning: |-
  Okay, let me tackle this community radio language policy question. The user has presented 15 nuanced cases where their gut reactions vary, and they're looking for a unified principle or minimal set of principles that can guide their policy. 

  First, I notice the user is clearly thoughtful about this - they've identified inconsistencies in their own judgments and want to resolve them philosophically before creating practical rules. That's smart. Their examples cover reporting, reclamation, ignorance, historical context, and cross-cultural misunderstandings. The cases where intent and impact diverge seem particularly tricky (like the singing white DJ vs the recorded song).

  Hmm... the core tension here is between word-as-symbol (where the utterance itself might be harmful regardless of context) versus word-as-tool (where meaning depends entirely on speaker intent and audience reception). The user's reactions suggest they intuitively reject both absolutes. 

  Let me try to identify patterns in their verdicts:
  - They consistently protect vulnerable groups from out-group use of slurs (cases 5,7,8)
  - They allow in-group reclamation (6,8)
  - They permit descriptive/reporting use (1,3)
  - They make concessions for ignorance but still correct it (9,10)
  - They care about harm to unintended targets (11)
  - They condemn bigoted intent even without direct harm (12)

  Interesting that they treat anti-white slurs differently (15) - that points to an underlying recognition of power dynamics. The cases they struggle with (13,14) involve either ambiguous harm (spaz in transatlantic context) or "dead" slurs with minimal present impact.

  For new cases:
  A) Period drama use - probably fine as artistic context
  B) Unprompted academic use of slur - tricky, but feels unnecessary and risky
  C) In-group contempt use - should be treated as harmful regardless of speaker identity

  The simplest framework seems to be:
  1. Harm principle (prioritizing impact over intent)
  2. Speaker-position principle (who can "reclaim")
  3. Necessity principle (is this the only way to convey meaning?)

  But even this has edge cases. Maybe they need to accept that perfect consistency is impossible, and design policy for their specific community's needs. The current one-line rule avoids slippery slopes but loses nuance - perhaps they can keep a strict prohibition while adding contextual exceptions through a review process.

  Noticing that the user values practicality ("Tuesday night application") - any principle must be operationalizable by volunteers. Might need clear bright-line rules for the policy, while keeping the nuanced framework for internal guidance when reviewing incidents.
answer: |-
  Here's a coherent set of principles derived from your verdicts, designed for practical application at a community radio station. It balances the inherent harm of slurs with context, while recognizing power dynamics and real-world impact:

  ### Core Principles
  1.  **Harm Principle:** The primary wrong is *causing harm or reasonably foreseeable harm* to members of targeted groups through the use of language tied to historical oppression and dehumanization. Harm includes reinforcing prejudice, creating a hostile environment, or causing psychological distress.
  2.  **Speaker-Position Principle:** Who speaks matters. Use of a slur *by someone outside the targeted group* is presumptively harmful and unacceptable. Use *within* the group (reclamation, description, critique) has different potential harm dynamics and requires careful assessment.
  3.  **Necessity & Purpose Principle:** Use of a slur (even in potentially acceptable contexts like reporting or art) must be *necessary* for a significant purpose (e.g., accurate news reporting, critical discussion, authentic artistic expression) and handled with care and respect. Gratuitous use is unacceptable.
  4.  **Reasonable Foreseeability:** We are responsible for harm that is reasonably foreseeable to our audience, considering its composition and the nature of the word.

  ### The Policy Application Framework (For a Tuesday Night)
  When evaluating language:
  1.  **Is it a slur?** (Recognizing it targets a group based on identity and has a history of oppression). If **no**, standard profanity/offense rules may apply. If **yes**:
  2.  **Who used it?**
      *   **Member of Targeted Group:** Proceed to Step 3.
      *   **Non-Member:** **Generally Prohibited.** Exceptions *only* if strictly necessary for core journalistic, artistic, or educational purposes (Step 3) *and* the word is essential *and* presented with appropriate gravity/warning. *Singing along, "affectionate" imitation, casual use by outsiders are NEVER exceptions.*
  3.  **Is the use necessary and purposeful?** (Applies to both in-group and necessary out-group use). Does it serve a vital function (accurate reporting, critical analysis, authentic historical/artistic context) that cannot be achieved without using the specific word? Is it gratuitous or sensational?
  4.  **Was it handled with care?** (Applies to necessary uses). Was context provided? Was the audience considered? Was the word treated with gravity, not flippancy?
  5.  **Is harm reasonably foreseeable?** Consider the audience (including potential unintended listeners), the word's current potency, and the nature of the broadcast.

  **Sanction Severity:** Depends on intent, recklessness, foreseeable harm, position of speaker, and history. Ranges from correction/education to suspension/ban.

  ---

  ### How This Explains Your Verdicts

  *   **1 (Fine):** Necessary reporting, handled factually. Harm mitigated by context/purpose.
  *   **2 (Not Fine):** Gratuitous use by outsider (violates Necessity & Speaker-Position). Harmful intent/recklessness.
  *   **3 (Fine):** Necessary reporting (quoting incident), handled factually.
  *   **4 (Fine):** Authentic artistic expression by member(s) of targeted group (Speaker-Position), historical context, necessity for integrity. Care handled by pre-existing context.
  *   **5 (Not Fine):** Outsider using reclaimed form gratuitously (violates Speaker-Position & Necessity). Harm in appropriation and potential reinforcement.
  *   **6 (Fine):** In-group reclamation/affectionate use (Speaker-Position principle). Different harm dynamic.
  *   **7 (Not Fine):** Outsider imitation (violates Speaker-Position). Harm in appropriation, potential mockery, and historical weight.
  *   **8a (Fine):** In-group reclamation/critique (Speaker-Position).
  *   **8b (Not Fine):** Outsider use, "affection" irrelevant (Speaker-Position). Harmful regardless of claimed intent.
  *   **9 (Not Fine, Correction):** Causes foreseeable harm/offense. Sanction mitigated by clear ignorance (lack of malicious intent). Requires education, not necessarily severe punishment *if* handled immediately/appropriately.
  *   **10 (Not Fine, Correction):** Causes foreseeable harm in the broadcast context. Sanction mitigated by linguistic/cultural ignorance. Requires correction/education, not necessarily ban *if* handled correctly.
  *   **11 (Not Fine):** Harm principle. Intent and impact (fear, humiliation, reinforcement of prejudice) occur regardless of target's specific identity. Foreseeable harm.
  *   **12 (Not Fine - Sanction):** Reveals malicious intent and character incompatible with community standards. Creates a hostile environment for station members who *might* learn of it. Foreseeable reputational harm to station.
  *   **13 (Not Fine - Correction/Warning):** Harm Principle & Foreseeability. While dialectal, broadcast to US audience where it *is* a potent slur makes harm reasonably foreseeable. Requires correction/warning. Repeated use after warning = sanction.
  *   **14 (Technically Not Fine, Low Priority):** *Is* a slur (Harm Principle), but low foreseeable harm due to obscurity. Likely handled via quiet correction if flagged. Principle requires consistency, but practical enforcement prioritizes high-harm/high-foreseeability cases. (You lose this strict consistency, but acceptably).
  *   **15 (Not Fine, Different Tier):** Violates general civility/respect rules and may cause offense, but lacks the *systemic, historically oppressive weight and dehumanizing intent* of group-specific slurs tied to persecution. Sanctioned for being offensive/inflammatory, but recognized as different in kind. (Power/History *is* relevant to the *nature* of the harm).

  ---

  ### New Cases

  *   **(a) Straight actor in period drama saying f-slur:** **Likely Fine.** Fits Necessity & Purpose (authentic historical/artistic context in a drama slot). Harm mitigated by context and framing. (Speaker-Position of *actor* is less relevant than the *character's* context and the *work's* purpose).
  *   **(b) Caller says n-word unprompted while explaining why it's bad:** **Not Fine.** Violates Necessity. The point can be made powerfully without uttering the slur itself ("the n-word"). Gratuitous use carries foreseeable harm and sets a dangerous precedent. Sanction likely (warning/temp ban).
  *   **(c) In-group caller uses S with contempt about another member:** **Not Fine.** Harm Principle. While Speaker-Position changes dynamics, using the slur *with contempt* within the community causes direct harm (reinforcing internalized oppression, creating division, causing distress) and foreseeable harm to listeners. Sanction warranted.

  ---

  ### The One-Line Rule vs. The Phenomenon

  **The honest answer:** A strict "no slurs, context irrelevant" rule **is likely the right operational rule for a community radio station,** *even though it's an oversimplification of the complex phenomenon of slurs.*

  *   **Why it might be right for the station:**
      *   **Clarity & Consistency:** Volunteers need unambiguous rules they can apply quickly during live broadcasts without complex philosophical debates. A bright line prevents slippery slopes and arguments about "good intent."
      *   **Safety & Inclusivity:** Maximizes protection for vulnerable listeners and staff by erring on the side of caution. Creates a clear, safe boundary.
      *   **Practicality:** Avoids the immense difficulty of fairly adjudicating intent, reclamation nuances, and historical context in real-time or under pressure.
      *   **Deterrence:** Sends an unequivocal message about the station's values.
      *   **Focus:** Allows volunteers to focus on content creation rather than linguistic adjudication.

  *   **The Gap & What It Does:**
      *   **Oversimplifies:** Ignores legitimate contextual uses (reporting, historical art, in-group reclamation) that your intuition recognizes.
      *   **Potential Injustice:** Could lead to unfairly punishing people for genuine mistakes (like 9 & 10) or necessary journalistic/artistic functions.
      *   **Misses Nuance:** Doesn't distinguish between levels of harm or intent.
      *   **What the Gap Does:** It trades nuance and theoretical accuracy for operational efficiency, maximal protection, and clear boundaries. It prioritizes preventing the *worst harms* and *ease of enforcement* over perfectly capturing the ethical landscape in every instance.

  **Recommendation:** You can bridge the gap somewhat:
  1.  **Core Policy:** Keep a strong, simple rule: **"The use of racial, ethnic, homophobic, transphobic, misogynistic, ableist slurs, or other slurs targeting protected groups, is strictly prohibited on [Station Name] airwaves and in official station communications, regardless of context or intent. Violation will result in immediate removal from air and potential further sanctions."** (This covers 1-15, a, b, c as violations, accepting the oversimplification).
  2.  **Internal Guidance:** Develop the nuanced principles above (Harm, Speaker-Position, Necessity, Foreseeability) as an *internal guideline* for the management team (you 3 + PD/Station Manager) to use when:
      *   Reviewing incidents *after the fact* (especially cases like 9, 10, potentially 13).
      *   Making pre-broadcast decisions about sensitive content (e.g., playing an old song, airing a documentary clip, approving a script for a drama).
      *   Determining the *level* of sanction (education vs. suspension vs. permanent ban).
  3.  **Pre-Approval Process:** Establish a simple process for seeking pre-approval for *necessary* uses of sensitive language in reporting, documentaries, or arts programming, referencing the internal principles.

  This approach gives you the clear, enforceable rule needed for live radio operations while allowing a more nuanced, ethical framework for planning and review, addressing the complexity you rightly perceive. It prioritizes safety and clarity on-air, while acknowledging the deeper reality off-air.
