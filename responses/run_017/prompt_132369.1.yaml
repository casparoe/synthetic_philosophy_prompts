prompt: |-
  So I'm thinking about spending next year trying to build (or at least defend) a view where the wavefunction isn't a thing in the world but something more like a state of knowledge, and before I sink a year into it I want to know what I should be demanding of such a view. Not a reading list — I can find the papers myself. I want the spec. Purpose: it has to be good enough to be a real alternative to the wavefunction-is-real views, not a relabeling of one of them with some extra bookkeeping bolted on.

  Where I'm at: the motivation is the usual one. The state of N particles lives in this enormous 3N-dimensional space, gets handed to you by a preparation procedure, jumps when you find something out, and isn't the kind of thing anyone has ever measured directly — so maybe it's like a probability distribution. But "it's knowledge" is cheap until you say knowledge of what and why that knowledge has the shape it has. So: write me the desiderata.

  Things I think belong on the list, but you decide and add the ones I'm missing: what the underlying states of affairs have to be like; why the set of things-you-can-know has exactly the geometry of a Hilbert space (why maximal information is a pure state, why you can rotate any state into any other, why there are exactly this many perfectly distinguishable ones); how interference and entanglement come out right if the state is only bookkeeping — in particular how you get the exponential size of the state space without paying for it in ontology; why nobody can use the underlying state to out-bet the Born rule; what a measurement is and where definite outcomes come from; what happens to Bell-type correlations and to locality; whether it's supposed to be empirically identical to textbook quantum mechanics or allowed to differ somewhere; and whether it has to be a view about measurement outcomes only or also about the world between them.

  For each one, the case or consideration behind it, what breaks if you drop it, and whether it's a genuine requirement or just a prejudice of one camp — is locality here a desideratum or a fetish, is "the quantum state has to be derived from the underlying facts rather than posited alongside them" fair or circular, is being able to say what would be different if the view were true non-negotiable.

  Two I especially want. First: I keep being told about an argument that runs roughly — prepare two systems independently, assume the underlying state of the pair is just the two underlying states sitting side by side, and you can apparently get to the conclusion that two distinct pure states can never rest on the same underlying state, which would kill the project. Is "distinct pure states must be able to overlap" an actual desideratum, or can you be a wavefunction-is-knowledge person without it? Second, one I made up: an agent who was somehow handed the exact underlying state still couldn't make money against a bookie who only knows the quantum state. I think that belongs on the list, but I can't tell if it's a real constraint, just empirical adequacy in a costume, or in tension with wanting the underlying story to explain anything at all.

  Then the parts I care most about: which subset of the requirements can't all be had at once, and which single requirement knocks out the most candidates. A line each at the end on the usual suspects — the pilot-wave one, the collapse ones, many worlds, the "it's just an agent's betting odds" version — is enough; the criteria are where I want the work. Also: if I'm honest I don't know whether my 3N-dimensional motivation is even a good reason to want the view, so tell me if that one definately shouldn't survive onto the list.
reasoning: |-
  Okay, let's tackle this user's query. They're planning to spend a year developing a view where the wavefunction is epistemic rather than ontological. They want a set of criteria to evaluate such a theory, not just a reading list. 

  First, I need to understand their main concerns. The user is motivated by the high dimensionality of the wavefunction and its collapse upon measurement. They see parallels with probability distributions as states of knowledge. But they’re wary of superficial epistemic approaches that just relabel existing theories. Their core request is a "spec" — a list of rigorous desiderata that a viable epistemic view must meet.

  The user has already listed several key points: underlying states, Hilbert space geometry, interference, entanglement, exponential state space, no outperforming Born rule, measurement problem, Bell correlations, locality, empirical equivalence, and the theory’s scope (measurements vs. between measurements). They also have two specific concerns: the "no overlapping state" argument and the "informed agent" thought experiment.

  I should start by validating their existing points. The underlying ontology is crucial—without it, the view is just words. Why the set of possible knowledge states forms a Hilbert space is another big one. If maximal knowledge is a pure state and rotations are possible, that needs explaining from the ontology. Interference and entanglement are critical tests. If the wavefunction is just knowledge, how does interference occur? Entanglement's nonlocality must be addressed without violating relativity.

  The exponential size of state space without ontological cost is tricky. If the underlying reality is small, how does the epistemic state capture so much information? The Born rule enforcement is essential—no hidden info allowing better predictions. Measurement must resolve to definite outcomes without special axioms. Bell correlations need handling; locality might be sacrificed, but the cost must be clear.

  Empirical equivalence is necessary unless the theory predicts testable differences. The scope—whether the theory describes reality between measurements—impacts its completeness. The user’s two specific issues need addressing: the "no overlapping pure states" argument threatens the epistemic view, so either refute it or accept its consequence. The "informed agent" test ensures the ontology doesn’t grant predictive advantage beyond the Born rule.

  Now, considering trade-offs. The Pusey-Barrett-Rudolph theorem shows that if pure states are distinct and non-overlapping, an epistemic view fails unless it’s ensemble-based. So they must either reject that pure states correspond to unique ontic states or accept that the epistemic state has no underlying reality. The informed agent constraint might conflict if the ontology is supposed to explain quantum phenomena—if it’s explanatory, why can’t it predict better?

  Common approaches: Bohmian mechanics has an ontic wavefunction but epistemic particle positions. Collapse theories like GRW make the wavefunction real. Many Worlds avoids collapse but multiplies ontologies. QBism treats quantum states as subjective beliefs. Each has trade-offs; for example, QBism avoids ontological questions but might not satisfy the user's desire for an underlying reality.

  The user’s 3N-dimensional concern is valid but not decisive. High dimensionality can be managed (like in phase space), but it motivates seeking a leaner ontology. However, some epistemic views might still use high-dimensional spaces, so it’s a preference, not a strict requirement.

  Key pitfalls: Assuming locality could be a fetish since Bell’s theorem requires nonlocality. Deriving the quantum state from underlying facts avoids circularity but is challenging. Predictive advantage must be impossible to maintain empirical adequacy.

  In conclusion, the user needs to clarify their stance on the PBR theorem and the explanatory role of the ontology. Balancing all desiderata is tough; most theories sacrifice one or more. The hardest requirement is deriving Hilbert space structure from the ontology without smuggling in quantum mechanics. They should start by defining the ontology clearly, then see how much quantum behavior can emerge without contradictions.
answer: |-
  Here’s the "spec" for a defensible epistemic view of the wavefunction, structured by desiderata, their rationale, and critical trade-offs. This list prioritizes *robustness against relabeling* and *explanatory power*.

  ### Core Desiderata (The Non-Negotiables)
  1.  **Specified Underlying Ontology (`λ`):**
      *   **What:** Define what exists in the world *independently* of the wavefunction/knowledge (`ψ`). `λ` could be particles with definite (but perhaps hidden) positions/fields, discrete beables, spacetime events, etc.
      *   **Why:** Without `λ`, "knowledge" has *nothing to be knowledge of*. This prevents relabeling ("ψ is knowledge... of ψ").
      *   **Break if dropped:** Collapses into instrumentalism or circularity. Fails to address the core motivation ("knowledge *of what?*").
      *   **Requirement:** Genuine. "Derived from underlying facts" is fair – it forces ontological commitment.

  2.  **Empirical Adequacy:**
      *   **What:** Must reproduce *all* empirical predictions of standard quantum mechanics (SQM) in every experimentally accessible scenario (including interference, entanglement, Bell tests, delayed choice, weak measurements).
      *   **Why:** Any deviation is falsifiable. The goal is a *different interpretation* of QM, not a *different theory*.
      *   **Break if dropped:** Renders the view scientifically irrelevant as an alternative to SQM.
      *   **Requirement:** Non-negotiable. The cost of admission.

  3.  **The Measurement Postulate (Definite Outcomes):**
      *   **What:** Explain why experiments have definite, single outcomes ("pointer pointing here, not there") *solely* in terms of the dynamics of `λ` and the epistemic updating rule. No fundamental "collapse" of `λ`; collapse of `ψ` should reflect updating knowledge about the fixed/evolved `λ`.
      *   **Why:** Definite outcomes are the primary empirical fact. "ψ as knowledge" must account for why knowledge *becomes* definite upon measurement.
      *   **Break if dropped:** Removes the key advantage over ontic-ψ views (like Many Worlds) that struggle with definiteness. Fails the core promise of epistemic views.
      *   **Requirement:** Genuine and central. Must be solved by `λ` dynamics + epistemic update.

  4.  **The Born Rule as Minimal Updating / No Secret Knowledge:**
      *   **What:** Show that an agent *even if they knew the exact underlying state `λ`* could not predict measurement outcomes better than the Born Rule applied to `ψ`. The Born Rule probabilities must be the *best possible* given access to `λ`. `ψ` must be a *sufficient statistic* for predicting future `λ`-dependent outcomes.
      *   **Why:** If knowing `λ` gives better predictions, then `ψ` is incomplete knowledge *and* the ontology is empirically accessible in principle, contradicting the epistemic premise. This ensures `ψ` is *maximal* knowledge.
      *   **Break if dropped:** Opens the door to hidden variables contradicting QM (à la pre-Bell), or makes `ψ` redundant. "Informed agent" test fails.
      *   **Requirement:** Genuine and crucial constraint. This is the mathematical heart of ensuring `ψ` is truly epistemic and `λ` is hidden. It forces `λ` to be intrinsically probabilistic or contextual.

  5.  **Interference from `λ` Dynamics:**
      *   **What:** Reproduce quantum interference patterns (e.g., double-slit) through the dynamics of `λ` alone, *without* appealing to `ψ` as a physical wave guiding `λ`. The epistemic update upon learning path information must naturally suppress the interference pattern predicted by the updated `ψ`.
      *   **Why:** Interference is a hallmark of QM. If `ψ` is just knowledge, the *physical cause* of interference must lie in `λ`'s behavior. Knowledge update must explain "wave-like" behavior vanishing.
      *   **Break if dropped:** Fails a basic empirical test. Reduces to "ψ is physical for interference, epistemic for measurement" – incoherent.
      *   **Requirement:** Genuine test of the ontology's dynamics.

  ### Structural Desiderata (Explaining Quantum Structure)
  6.  **Hilbert Space Geometry from Knowledge Constraints:**
      *   **What:** Derive *why* the space of possible epistemic states (`ψ`) has the structure of a complex Hilbert space: superposition (linear combination), unitary evolution, the tensor product rule for composites, the dimensionality (number of perfectly distinguishable states), and the pure/mixed state distinction (maximal information).
      *   **Why:** Hilbert space is the formal core of QM. An epistemic view must explain its structure as arising from the nature of possible knowledge about `λ`, not just postulate it. Why are some questions incompatible? Why are pure states connected by rotations?
      *   **Break if dropped:** Leaves the quantum formalism unexplained and arbitrary. Feels bolted-on.
      *   **Requirement:** Highly desirable for depth; arguably necessary to avoid being "QM in epistemic clothing". The hardest challenge. "Overlapping pure states" (PBR) is a *consequence* of trying to satisfy this *within a local, separable `λ` space*.

  7.  **Entanglement & Nonlocality:**
      *   **What:** Account for Bell nonlocality and entanglement correlations. `λ` must be explicitly nonlocal (e.g., particle `λ` depends on distant settings) or the knowledge update must involve nonlocal information flow *consistent with relativity* (e.g., no superluminal signalling).
      *   **Why:** Bell's theorem *demands* nonlocality or non-separability. An epistemic view must specify how this manifests: is `λ` non-separable? Is the epistemic update nonlocal? How is signalling prevented?
      *   **Break if dropped:** Contradicts established experiment (Bell tests).
      *   **Requirement:** Non-negotiable empirically. **Locality is a fetish here – Bell killed it.** The desideratum is *managing nonlocality*, not preserving locality.

  8.  **State Space Size & Ontological Parsimony:**
      *   **What:** Explain the exponential growth of the effective state space (Hilbert space dimension) for composite systems without requiring an exponential growth in the complexity or dimensionality of the underlying ontology `λ`.
      *   **Why:** The core motivation (avoiding 3N-D "real stuff"). The epistemic state (`ψ`) *can* be high-D, but the `λ` it describes should be ontologically cheaper. `ψ` captures *correlational knowledge* not mirrored in individual `λ` elements.
      *   **Break if dropped:** Fails the primary motivation. If `λ` lives in a space as big as Hilbert space, the view offers no ontological advantage.
      *   **Requirement:** Core motivation. Needs careful handling with desideratum 6 (Hilbert space structure).

  ### Scope & Explanation
  9.  **Between Measurements:**
      *   **What:** Specify what `λ` is doing between preparation and measurement. Does the view make claims about reality when not being observed? Can `λ` dynamics define a continuous, objective reality?
      *   **Why:** Physics aims to describe the world, not just measurement outcomes. A view only about outcomes is instrumentalist, not epistemic about an underlying reality.
      *   **Break if dropped:** Weakens the view to instrumentalism/phenomenalism. Fails to provide a complete picture of the world.
      *   **Requirement:** Genuine requirement for a *realist* epistemic interpretation. "Knowledge of what *is happening*" implies `λ` exists and evolves between measurements.

  ### Addressing Your Specifics
  *   **PBR Argument (Distinct Pure States Overlap):** This is **critical**. PBR shows that if (1) `λ` is the same for distinct pure states (overlap), and (2) the `λ` of a composite system is just the product of the individual `λ`s (separability), then contradictions arise. **Your choices:**
      *   *Deny Separability:* `λ` for a composite system is *not* simply the product of individual `λ`s (e.g., `λ` is holistic/non-separable). This saves overlap but makes `λ` highly nonlocal.
      *   *Deny Overlap:* Each pure state corresponds to a *disjoint* set of `λ` (ψ-ontic). This kills the epistemic view.
      *   *Deny Preparation Independence:* Systems prepared "independently" aren't truly independent at the `λ` level. Radically undermines standard assumptions.
      *   *Ensemble Interpretation:* `ψ` doesn't describe individual systems, only ensembles. Avoids PBR but sacrifices describing individual events (contra desideratum 9).
      **Desideratum:** You *must* have overlapping ontic states (`λ`) corresponding to distinct pure `ψ` for an epistemic view of single systems. **Therefore, you must reject `λ` separability (holistic/nonlocal `λ`) or preparation independence.** This is a major constraint, not optional.
  *   **Informed Agent / No Secret Knowledge:** This is **desideratum 4**. It's a genuine, powerful constraint ensuring the epistemic view doesn't smuggle in hidden variables. It's *not* just empirical adequacy; it's about the *relationship* between `λ` and `ψ`. Tension exists: If `λ` *explains* why `ψ` works, why can't knowing `λ` predict better? The answer *must* be that `λ` is fundamentally unpredictable or contextual – its full specification doesn't determine future measurement outcomes uniquely, only probabilistically via the Born Rule. `ψ` summarizes the relevant probabilistic information extractable from `λ` (or preparation) for future predictions.

  ### Trade-offs and Deal-breakers
  *   **Hardest Desiderata to Satisfy Simultaneously:** **6 (Hilbert Space Structure)** and **4 (No Secret Knowledge/Born Rule)** are extremely difficult to derive from a simple, plausible `λ` ontology while also satisfying **3 (Definite Outcomes)** and **8 (Ontological Parsimony)**. **PBR (addressed under your first specific)** forces a major choice regarding separability/nonlocality.
  *   **Most Damaging Single Requirement:** **4 (No Secret Knowledge / Born Rule as Minimal Updating)**. If this fails, the view either contradicts QM empirically or admits `ψ` is incomplete knowledge, undermining its epistemic nature. **PBR** is a close second for views assuming separable `λ`.
  *   **3N-D Motivation:** It's a **valid motivation but not a strict desideratum**. It drives the search for ontological parsimony (desideratum 8). However, don't fetishize low dimension; a slightly less parsimonious but more explanatory `λ` might be acceptable. The key is that `ψ` captures *more* (correlations, incompatibility) than is present in the fundamental `λ` elements.

  ### Quick Takes on Major Views (Per Your Criteria)
  *   **Pilot-Wave (Bohmian):** `λ` = particle positions. Solves 1, 3, 4 (via equivariance), 5, 7 (nonlocal `λ`), 9. Fails 8 (ontic guiding wave in 3N-D), struggles with 6 (Hilbert space structure is postulated, not derived). PBR irrelevant (ψ-ontic for wave part).
  *   **Collapse (GRW, CSL):** `λ` = the wavefunction itself (ontic). Solves 1, 3, 5, 6, 7 (stochastic nonlocality), 8? (3N-D real but "cheap"?). Fails epistemic premise entirely. PBR irrelevant.
  *   **Many Worlds (Everett):** `λ` = the universal wavefunction (+ perhaps emergent branches). Solves 1, 4 (inconsistent histories?), 5, 6, 7 (non-separability), 8? (high-D real). Fails 3 (definite outcomes - preferred basis problem). PBR irrelevant (ψ-ontic).
  *   **QBism / Radical Probabilism:** `ψ` = subjective belief/decision calculus. Solves 6 (axiomatic), 7 (no nonlocal `λ`), 8. Fails 1, 9 (no underlying reality described, instrumentalist). Avoids PBR (no `λ`). Fails core realist epistemic motivation.

  **Conclusion:** Your spec is demanding but necessary. Focus relentlessly on **`λ` (ontology)**, **`λ` dynamics**, **epistemic update**, and the **constraints between them** (especially **Born Rule as Minimal Updating** and **Hilbert Space Structure**). Accept that **non-separability/nonlocality in `λ` is almost certainly required** to satisfy PBR while keeping `ψ` epistemic. The 3N-D concern is a good *motivation* for seeking ontological parsimony, but don't let it blind you to the immense challenge of deriving the quantum formalism (`ψ`) from a simpler `λ`. Be prepared for the possibility that the most viable "epistemic" views might involve significant nonlocality (like Bohm without the wave) or radical rethinking of `λ` (e.g., `λ` as events in spacetime rather than persistent objects). Good luck!
