prompt: |-
  I run a fortnightly interview series for the engineering organisation at my company — usually we talk to people about distributed systems, developer tooling, incident response — and next month's guest is a philosopher whose forthcoming book (working title *Coordination All the Way Down*) argues that almost every norm inside a large engineering organisation is a convention in the sense of David Lewis's *Convention* (1969): a regularity in behaviour that persists because nearly everyone conforms to it, expects nearly everyone else to conform, and prefers to conform on the condition that the others do, where there is some alternative regularity that would have served just as well. Her star examples are drawn from our world: the shape of a pull request, who speaks first in an incident call, the fact that nobody merges to main on a Friday, the fact that we all write code as though the linter's opinion were binding. She pairs this with an evolutionary story — conventions get started through precedent and salience, then get locked in because unilateral deviation is costly — and she claims this explains why engineering cultures are so hard to change even when everyone agrees they should change. I read Lewis with two colleagues from work and understood maybe sixty per cent of it, so I want questions I can ask cold, in engineering vocabulary, that don't require me to interrupt with "can you unpack that?".

  The problem is that she has one move that shuts down discussion: whenever I raise a case where people comply because they fear blame, or because a rule was handed down, or because the behaviour has moral content rather than being an arbitrary side of the road to drive on, she says "that's a sanction story, not a convention story" and redirects to the coordination core. I want eight to ten questions, each with a follow-up keyed to the answer she is most likely to give, arranged so that this deflection gets progressively harder to use. Please cover the following, in my terms rather than hers: the common-knowledge requirement, given that no engineer at a company of four thousand has common knowledge of anything — does replacing it with ordinary overlapping expectations (or with the dynamics that signalling-game models use) still distinguish a convention from a mass habit, such as everybody indenting with tabs because their editor ships with tabs as the default? The requirement that there be an alternative regularity that would have worked equally well: does that hold for norms with content, like "do not commit credentials" or "do not bypass code review", where the alternative is not something anyone could coordinate on? The free-rider cases, where everyone wants everyone else to write tests and each person would rather skip — can the "prefers to conform given that others conform" clause reach those at all, or is she conceding the whole territory of public goods? The lock-in cases, where everyone privately thinks the status quo is bad (say, the entire industry's tooling assuming a particular timestamp representation, or our own habit of encoding configuration as one enormous nested blob that nobody can review) — what does her account say distinguishes "we are stuck and would all rather switch" from "this is fine", and what, on her account, actually breaks a convention, or is that part imported by hand from outside the analysis? The imposed-standard cases: a staff engineer at my company wrote the style guide, a linter enforces it in CI, and people conform — is that a convention, given that the reason each person conforms is not that others conform but that the build goes red? If she says yes, then is anything backed by sanctions a convention, and what work is left for the notion; if she says no, where exactly is the line between precedent and imposition, and does an imposed rule quietly become a convention once people start coordinating around it? Finally, and this is the one I most want to land, our org has an explicit second-order rule: whenever a decision is genuinely arbitrary, adopt whatever the framework's default is, even when we would have chosen differently. Please build a question around that — whether her account can handle a convention whose content is a procedure for selecting conventions, whether the arbitrariness requirement inherits upward (could there be a different meta-rule that would have worked as well?), and what stops the regress — and if she tries the "sanction story" move on it, I want a follow-up that makes it clear the rule is enforced by nothing at all.

  I would like the sequence to close with one question about what evidence could count against her view rather than merely failing to support it: something I can ask her that forces a concrete answer about what observation of a real engineering organisation — a migration that succeeded, a norm that flipped overnight, a team that never converged — would make her abandon or substantially revise the claim that convention-plus-precedent is the right story about all of this. Please keep every question phrased so that a non-philosopher can ask it and follow the answer, and avoid anything that would require her to cite literature I could not check up on afterwards.
reasoning: |-
  Okay, the user runs an engineering interview series and is preparing for a challenging guest—a philosopher who applies David Lewis's convention theory to engineering norms. The user needs sharp questions to counter the guest's tendency to dismiss objections as "sanction stories," and wants to cover specific conceptual gaps without getting bogged down in philosophy jargon. 

  Hmm, the core tension here is between the guest's rigid "coordination core" framework and real-world engineering complexities like sanctions, moral norms, and path dependence. The user's frustration with the "sanction story" deflection is palpable—they need questions that force engagement rather than retreat. 

  First, I should map the user's explicit requests to Lewisian concepts: common knowledge → overlapping expectations, alternatives → arbitrariness requirement, free-riders → preference condition, lock-in → evolutionary stability, imposed standards → authority vs. convention, meta-conventions → regress problem. Each needs engineering-flavored phrasing. 

  The meta-convention question about framework defaults feels most potent—it attacks arbitrariness at a higher level and lacks sanctions. I'll structure it as a ladder: start with the rule ("why not call this sanction-based?"), escalate to arbitrariness inheritance ("is the meta-rule itself arbitrary?"), then trap the regress ("where does it bottom out?"). 

  For evidentiary standards, the user wants falsifiability. I'll suggest observable scenarios: sudden norm collapses (contradicts evolutionary lock-in), persistent coordination failures (challenges convention formation), or moral norms resisting alternatives (undermines arbitrariness). Concrete engineering examples are key—think "YAML blob hell" or "timezone migration disasters." 

  Avoiding philosophy jargon means swapping "common knowledge" for "shared awareness," "arbitrariness" for "equally workable alternatives," etc. Follow-ups must anticipate her deflections: if she calls credential rules "moral," pivot to why engineers treat them as coordination problems ("because leaking creds breaks systems, not just ethics"). 

  The sequence should escalate: start with softer lock-in questions, build to free-rider/public goods tensions, then hit hard with meta-conventions before demanding falsification. Each follow-up cuts off escape routes—e.g., if she calls linter rules "conventions once internalized," ask why engineers obey *before* seeing others comply. 

  User's subtle ask: they want to expose where Lewis's model leaks in engineering contexts without disrespecting the guest. Tone must stay curious, not combative. Anchor everything in their examples—PR shapes, incident calls, Friday merges.
answer: |-
  Here’s a sequence designed to escalate pressure on the "sanction story" deflection, using engineering-specific framing and forcing engagement with your core concerns. Each question includes a likely response and a targeted follow-up:

  1.  **Question:** "We have norms like 'never commit credentials' that feel non-arbitrary – the alternative (committing them) is actively dangerous. How does your 'equally good alternative' requirement apply here? Isn’t one side clearly wrong?"
      *   *Likely Response:* "That norm *stabilizes* because of the danger, but the *specific form* it takes (e.g., `.env` files vs. vaults, regex checks in pre-commit vs. CI) is conventional. The core coordination is on *how* we avoid it."
      *   **Follow-Up:** "But engineers don't see it as arbitrary coordination on *how*; they see it as *the* right way because of the inherent risk. If the alternative isn't seen as viable for coordination (because it's unsafe), does it still count as a Lewis convention?"

  2.  **Question:** "On common knowledge: In a 4000-person org, no one knows what *everyone* expects. Isn't 'convention' just overlapping local expectations and habits? How is that different from everyone using tabs because their editor defaulted to it?"
      *   *Likely Response:* "It's expectations *about* expectations. I expect you expect me to use tabs because you see our *shared codebase* using tabs. The shared artifact (codebase, CI failure) creates the necessary mutual awareness, replacing perfect common knowledge."
      *   **Follow-Up:** "If the shared artifact (like a linter config) is centrally *imposed*, and I follow it *because* CI fails, not because I think *you* care about tabs specifically, is that still coordination based on mutual expectations, or just compliance?"

  3.  **Question:** "Take testing: Everyone wants *others* to write tests, but individually, skipping tests saves time. Does the 'prefers to conform *if others do*' clause capture this? It feels like a classic free-rider problem, not coordination."
      *   *Likely Response:* "The convention is the *shared expectation* that tests are written. You prefer to write tests *on the condition* that others do too, because otherwise the system (reliable deploys, catching regressions) breaks down. Skipping is deviating when you expect others to conform."
      *   **Follow-Up:** "But isn't the *preference* asymmetric? I *strongly* prefer others write tests, but only *weakly* prefer to write them myself if others do. Doesn't Lewis require a *symmetric* preference to conform conditional on others? If not, how weak can the preference be?"

  4.  **Question:** "Lock-in: Everyone privately hates our giant nested YAML config blob, and a simpler alternative exists. Why are we stuck? How does your account distinguish 'locked-in bad convention' from 'actually fine convention'?"
      *   *Likely Response:* "The lock-in comes from the high cost of *coordinated* change. The convention *persists* because unilateral change is worse (breaks things). The alternative *would* be better, but switching requires simultaneous, costly coordination the convention itself doesn't provide."
      *   **Follow-Up:** "So what *actually breaks* a bad convention on your view? If it requires coordinated action, but the convention itself doesn't generate that coordination, isn't change always coming from *outside* the convention story – like a mandate (sanction!) or a crisis?"

  5.  **Question:** **The Imposition Test:** "Our style guide was written by Staff Engineer Alice. The linter enforces it in CI. Engineers conform because the build fails otherwise. Is this a convention?"
      *   *Likely Response (Yes):* "Yes, because engineers also expect *others* to follow it (seeing clean builds/PRs), and prefer their code to merge, which requires conforming *given that* the system (and others) expect it. The CI is just a salient focal point."
      *   **Follow-Up (If Yes):** "If a centrally enforced rule backed by clear sanctions (build failure = blocked merge) counts as a convention, doesn't that make *any* company rule backed by enforcement a convention? What's left that *isn't* a convention? Where's the boundary?"
      *   *Likely Response (No):* "No, initial adoption is driven by authority/sanction. It might *become* a convention later if people internalize it and coordinate *around* it, expecting others to follow *because* it's the norm, not just because of the linter."
      *   **Follow-Up (If No):** "How do we tell the difference *in practice* between 'complying due to sanction' and 'complying due to convention'? If an engineer says 'I do it because CI fails,' is that always non-convention? When does the switch happen?"

  6.  **Question:** **The Meta-Convention (Key Question):** "We have an explicit rule: *For genuinely arbitrary choices, default to the framework's standard.* We follow this even when we dislike the default. There's no enforcement – just a shared principle. Is *this rule itself* a convention?"
      *   *Likely Response:* "Absolutely. It's a regularity (using the default) that persists because everyone expects everyone else to do it (seeing framework-consistent code), and prefers to do it *given that* others do, to avoid pointless inconsistency. The alternatives (our custom standard) were equally workable *ex-ante*."
      *   **Follow-Up (Deflecting Sanction):** "But you said sanction stories aren't convention stories. This rule has zero sanctions – no linter, no blame, just shared understanding. If you *don't* call this a pure convention, what *is* it? And if you *do* call it a convention..."
      *   **Follow-Up (Arbitrariness & Regress):** "...then doesn't this show conventions can be *about selecting other conventions*? Is *this meta-rule* arbitrary? Could 'Always choose the *newest* option' have worked equally well? If not, why is it conventional? If yes, where does the arbitrariness stop? What anchors the *first* convention?"

  7.  **Question:** "For norms like 'speak truthfully in post-mortems' – isn't the preference to conform often moral (integrity) or prudential (avoiding future blame), rather than purely about coordinating on *how* we communicate?"
      *   *Likely Response:* "The *moral* belief might motivate the preference, but the *regularity* (speaking truthfully) persists *as a coordination point* because everyone expects it and prefers to do it *given that* others do, to enable effective learning. The alternative (systematic dishonesty) wouldn't serve the coordination goal (learning) equally well."
      *   **Follow-Up:** "But if the alternative (dishonesty) fails *because* it violates morality/prudence, not just because it's a worse coordination mechanism, doesn't that mean the 'equally good alternative' clause fails? Isn't the binding force here *different*?"

  8.  **Question:** **The Falsification Test (Closer):** "What observable evidence in an engineering org would make you say, 'This *isn't* explained well by convention-plus-precedent'? For instance:
      *   A deeply unpopular norm (like no Friday merges) flipping *overnight* after a single leader's announcement?
      *   A team *consistently failing* to converge on *any* norm for a trivial but necessary task (e.g., naming) despite shared goals?
      *   A migration away from a 'locked-in' standard (like timestamps) happening *smoothly and voluntarily* across thousands of engineers with minimal coordination overhead?
      What specific observation would challenge the core claim that convention is the fundamental layer?"
      *   *Likely Response:* (This forces her to specify testable boundaries).
      *   **Follow-Up (If vague):** "Could you give a concrete example of an engineering norm you'd observe and think, 'This *cannot* be primarily a Lewis convention'? What would make it different?"

  **Sequence Logic & Defense Against Deflection:**

  1.  **Starts with Content (Q1):** Challenges the "arbitrariness" pillar directly with a non-arbitrary-seeming norm. Forces engagement with the "specific form" vs. "core purpose" distinction.
  2.  **Attacks Knowledge & Habit (Q2):** Separates convention from simple habit or top-down artifact by focusing on the *expectations about others*. Sets up Q5.
  3.  **Public Goods (Q3):** Targets the "preference" pillar with asymmetric public goods. Tests the flexibility of "prefers to conform *if others do*".
  4.  **Lock-In (Q4):** Highlights the explanatory gap for *change* within the model. Pressures the distinction between persistence due to coordination vs. inherent goodness.
  5.  **The Imposition Test (Q5):** Directly confronts the "sanction story" deflection head-on with a common, complex case (linter rules). Forces a yes/no and exposes the boundary problem *regardless* of answer.
  6.  **The Meta-Convention (Q6):** **The Key Move.** Presents a sanction-*less*, coordination-based, *second-order* rule. If she deflects ("sanction story"), the follow-up highlights the *absence* of sanction, cornering her. The arbitrariness/regress follow-ups attack the core model's foundations using her own framework. This is hardest to deflect without conceding ground or appearing evasive.
  7.  **Morality/Prudence (Q7):** Revisits content/non-arbitrariness but with a norm where non-coordination motivations seem primary. Tests if *any* coordination aspect is sufficient to claim "convention".
  8.  **Falsification (Q8):** Forces her out of "everything is convention" by demanding observable counter-evidence. Shifts from defense to requiring her theory to have predictive/testable limits.

  **Why this works against deflection:**

  *   **Q5 & Q6 are Traps:** Deflecting Q5 ("sanction story") becomes impossible for Q6 (no sanction exists). Deflecting Q6 would require dismissing a clear coordination pattern, undermining her core thesis.
  *   **Escalation:** Moves from specific norms (Q1, Q3, Q7) to mechanisms (Q2, Q4) to foundational challenges (Q5, Q6) to falsifiability (Q8).
  *   **Uses Her Framework:** Questions are framed using Lewis's pillars (Regularity, Preference, Expectations, Alternatives) but applied to engineering pain points.
  *   **"Sanction Story" Counter:** Q6 explicitly removes sanctions. Q5 forces her to define the boundary *in engineering terms*. Q4 and Q8 highlight cases where sanctions or authority are the *only* plausible change mechanism within her model.
  *   **Clarity:** Avoids philosophy jargon. Uses concrete examples (YAML blob, credentials, testing, linter, meta-rule, Friday merges, timestamp migration).

  **Tips for Delivery:**

  *   **Listen Actively:** Pay close attention to her answers, especially nuances. Adapt follow-ups slightly if she surprises you.
  *   **Bridge Phrases:** Use phrases like "So, if I understand..." or "Building on that..." to transition smoothly to the follow-up.
  *   **Persistence:** If she tries to deflect Q6, gently but firmly restate: "But in this specific case, there *are* no sanctions or authority enforcing this meta-rule. It's purely coordination-based. Given that, is it a convention? And if not, what is it?"
  *   **Control the Clock:** You have limited time. Be prepared to prioritize Q5, Q6, and Q8 if needed. Q6 is your strongest weapon.
  *   **Stay Curious:** Frame it as genuinely wanting to understand how her model handles these tricky engineering realities.

  This sequence provides the tools to systematically challenge the guest's framework on its own terms using your engineering context, making the "sanction story" deflection increasingly untenable and forcing deeper engagement. Good luck!
