answer: |-
  Here’s a draft joint statement for Nadia and Crispin, structured as requested. I’ve flagged confidence levels throughout (**High**, **Medium**, **Low**) and noted where compromises are speculative. Crucially, **no manufactured consensus**: irreconcilable differences are marked, and one test case is rejected as conceptually confused.

  ---

  ### **Joint Statement of Adversarial Collaboration on Origin Essentialism**  
  **Signed:** Nadia [Kripkean Essentialist] & Crispin [Genome Essentialist / Anti-Realist About Transworld Identity]  

  ---

  ### 1. **Agreed Claims**  
  *(Confidence: **High** unless noted)*  

  1.1. **Biological Facts**:  
     - (a) Human development requires fusion of one sperm and one egg (barring artificial interventions).  
     - (b) Gametes (sperm/egg) are numerically distinct physical tokens; no two share identical matter or spatiotemporal history.  
     - (c) Nuclear genomes (DNA sequences in chromosomes) can be qualitatively identical across distinct gametes (e.g., identical twins’ gametes).  
     - (d) Mitochondrial DNA (mtDNA) is materially inherited solely from the egg’s cytoplasm.  

  1.2. **Logical/Metaphysical Framework**:  
     - (a) **Necessity of Identity**: If \( a = b \), then necessarily \( a = b \) (across possible worlds). *(Both sign, but Crispin adds: "This governs how we *apply* identity, not a freestanding fact about entities.")*  
     - (b) **No Branching**: A single entity cannot divide into two entities (e.g., zygote splitting into twins entails *two* persons, not *one* person becoming two).  
     - (c) **Modal Arguments Have Limits**:  
        - Kripke’s "growing from a different seed" intuition is widely reported but not universally shared.  
        - Parfit-style "branching" thought experiments highlight epistemic constraints on transworld identity.  

  1.3. **What Standard Arguments Do/Don’t Establish**:  
     - (a) **Kripke’s Argument** shows that *if* origins are essential, then gametes are necessary. It doesn’t prove origins *are* essential without auxiliary premises (e.g., no branching).  
     - (b) **Branching Cases** (e.g., twinning) challenge token essentialism but don’t refute it; they motivate a no-branching constraint.  
     - (c) **Conceivability ≠ Possibility**: Intuitions about "being born from different gametes" may track conceptual confusion or counterpart relations, not metaphysical possibility.  

  *(Compromise note: 1.3(c) is **Medium** confidence. Nadia accepts reluctantly; Crispin sees it as central.)*  

  ---

  ### 2. **Residual Disagreements**  
  *For each row:  
  - **Nadia’s Wording** (accepts as her view)  
  - **Crispin’s Wording** (accepts as his view)  
  - **Nature of Disagreement** (Substantive/Verbal)  
  - **Confidence in Verdict** (Weight: Low/Medium/High)*  

  | Disagreement Area          | Nadia’s Wording                                                                 | Crispin’s Wording                                                                 | Substantive/Verbal | Confidence |
  |----------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------------|---------------------|------------|
  | **Essential Basis**        | "My existence necessarily depends on the *very sperm and egg tokens* I originated from." | "My existence depends on the *nuclear genome* I instantiated, not token gametes." | **Substantive**     | High       |
  | **Branching Constraint**   | "The no-branching requirement *reinforces* token essentialism by blocking fission."      | "No-branching *replaces* token essentialism; it’s the only constraint."          | **Substantive**     | Medium     |
  | **Conceivability Evidence**| "Intuitions about origin scenarios reveal metaphysical constraints."            | "Such intuitions reveal how we *conceptualize* identity, not modal facts."       | **Verbal**          | Low        |
  | **Mitochondrial DNA**      | "mtDNA is part of the gamete token; thus essential."                            | "mtDNA is biologically peripheral; its necessity is doubtful."                   | **Substantive**     | Medium     |

  **Weight Note**: My verdicts carry **Medium** weight overall. The "Substantive/Verbal" distinction depends on whether differences persist *after* clarifying semantics. Row 3 ("Conceivability") is likely verbal if both agree intuitions are defeasible (Row 1.3c). Rows 1, 2, and 4 are robustly substantive.

  ---

  ### 3. **Cruxes with Test Cases**  
  *For each crux:  
  - A case/argument both accept as decisive.  
  - **Nadia’s prediction** (what she expects the case to show).  
  - **Crispin’s prediction** (ditto).  
  - **Confidence** in the case’s relevance.*  

  #### **Crux 1: Gamete Tokens vs. Genetic Material**  
  - **Case**: An egg from the mother’s identical twin sister (genetically identical to the actual mother’s egg), fertilized by the *same sperm*.  
  - **Nadia’s Prediction**: This produces a *different person* (wrong gamete token).  
  - **Crispin’s Prediction**: This produces *me* (same nuclear genome + same sperm).  
  - **Confidence**: **High** (directly isolates token vs. genome).  

  #### **Crux 2: Role of No-Branching**  
  - **Case**: The ordinary twinning case (zygote splits pre-implantation).  
  - **Nadia’s Prediction**: Branching is impossible; this produces two *new* persons, neither identical to the unsplit zygote.  
  - **Crispin’s Prediction**: Branching is possible; the twins are equally "continuers" of the zygote, undermining token essentialism.  
  - **Confidence**: **Medium** (Nadia may dispute this tests branching *independently*).  

  #### **Crux 3: Evidence from Conceivability**  
  - **Case**: Crispin claims he can conceive of himself originating from a sperm/egg pair with one base-pair difference.  
  - **Nadia’s Prediction**: This intuition is *confused*; he’s imagining a counterpart, not himself.  
  - **Crispin’s Prediction**: This intuition is *reliable*; it shows genetic near-identity suffices for transworld identity.  
  - **Confidence**: **Low** (hinges on contested theory of conceivability).  

  #### **Crux 4: Identity Relation Across Worlds**  
  - **Case**: The very same sperm and egg fuse 3 days later than actual.  
  - **Nadia’s Prediction**: This *could* be me (same tokens, temporal flexibility).  
  - **Crispin’s Prediction**: This is *likely not* me (altered developmental context).  
  - **Confidence**: **Medium** (Nadia may accept; Crispin sees temporal/historical factors as contingent).  

  ---

  ### **Rejected Case & Honest Verdicts**  
  - **❌ Rejected Case**: "Nuclear genomes identical but mitochondrial DNA different."  
    - **Problem**: This conflates two issues: (1) whether mtDNA is part of the "genome" (biological), and (2) whether non-nuclear factors matter (metaphysical). Crispin’s uncertainty makes predictions incoherent.  
  - **❓ Base-Pair Edit Case**: Useful for Crispin’s threshold question but doesn’t challenge Nadia (she rejects any genetic sufficiency).  
  - **⚠️ Core Limitation**: The question *"Could you have come from different gametes?"* **glues together two questions**:  
    > (A) *What are my essential properties?* (Nadia: gamete tokens; Crispin: genome).  
    > (B) *What determines transworld identity?* (Nadia: objective facts; Crispin: counterpart relations).  
    - **Result**: A full joint statement *is possible* for (A), but (B) reflects a deeper, likely irreconcilable, metaphysical divide.  

  ### **Conclusion**  
  This document clarifies **three substantive disagreements**:  
  1. Gamete tokens vs. genome as essential.  
  2. No-branching as independent or derivative.  
  3. Role of mtDNA.  
  The **twins’ egg** and **delayed fusion** cases best isolate these. The conceivability crux is likely verbal if both reject intuition as proof. **Recommendation**: Run the twins’ egg case (Crux 1) first — it forces the token/genome split cleanly. If they agree on predictions but dispute outcomes, the rift is metaphysical (not verbal).  

  ---  
  **Draft Confidence**: High on structure/biology; Medium on compromises; Low on verbal/substantive distinctions (use predictions to test). Revise wording iteratively with Nadia/Crispin to ensure signed sections reflect their genuine views.
