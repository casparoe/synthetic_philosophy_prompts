prompt: |-
  I had a long argument with a friend last night about the vessel I help look after — a nineteenth-century wooden boat kept afloat by a small conservation trust, and therefore replaced in pieces, more or less continuously, for as long as anyone has been keeping records. The argument started as a quarrel about whether the trust may honestly describe what visitors walk around as the original vessel, and I came away convinced that our disagreement was not about boats, and not even really about the old puzzle of the ship whose timbers are replaced one at a time. It was about something I don't have a word for. Here is the pattern I kept noticing. If our boat's timbers are replaced one by one and the discarded ones are simply burned, nobody in the room hesitates: it is the same boat, and my friend agreed. But if the discarded timbers are stacked in a shed and a shipwright later reassembles them into a second boat, a surprising number of people — my friend among them — start saying that the reassembled one is the original, or at least that the boat we have been sailing has had its claim weakened. Nothing about the boat we sailed is different in the two stories; the entire difference lies in what happened, later, to stuff that had already left it. And yet the effect is oddly specific. If the old timbers are fed one at a time into the upkeep of some other working boat, so that after thirty years that other boat contains most of the original timber and ours contains none of it while both have stayed in continuous service, nobody at all — not even my friend — wants to say the two boats have traded identities. And if the timbers in the shed are reassembled into a barge, or into the roof of a boathouse, the pull largely disappears, though it partly survives if the reassembly is only finished after our boat has finally been lost.

  So my question: is there an established concept for the fact that whether a thing persists seems to depend on what becomes of the matter that has left it, and specifically on whether that matter is later collected back into something presenting itself as a candidate of the same kind, and on when that happens? My friend offered three deflations and none of them satisfied me. He said it is just the old ship-replacement puzzle, about which there are two standard philosophical answers — one on which a thing is stretched out through time the way a road is stretched out through space, and one on which the timber assembly and the boat are two different things sitting in the same place — and that I have merely found a version neither answer was designed for. He said it is just vagueness, there being no exact number of replaced planks at which the boat stops being the same boat. And he said it shows only that our talk of sameness is really talk of something that comes in degrees. The vagueness diagnosis is the one I most want tested, because the judgments I described are not tracking quantities or borderline quantities at all: they flip while the quantity is held fixed, and they flip non-monotonically, coming back when the shed is emptied into a barge.

  A bare label would not help me, so please do the carving rather than the naming. Is what I have described one phenomenon or two — a competition effect, where a thing's hold on its identity is settled by comparison with rival candidates rather than by its own history, and a separate recollection effect, where the mere re-gathering of shed matter into a thing of the right kind does the work? How would each be distinguished from the standard two answers my friend gave, from ordinary vagueness, and from the plain claim that sameness is a matter of degree? And where are the edges? Does the effect survive if the reassembly is staged so that every discarded timber becomes part of some boat the instant it is removed, with no interval in which it is merely stacked? Does it survive if the timbers are copied rather than reused, so that the material is new but the arrangement is inherited? Does a later reassembly make it have been false, earlier, that our boat was the same boat, or does it only make us revise a claim that was true when we made it? If the answer is that nothing established fits, say so, give the thing a name I can use, define it tightly enough that the boundary cases above come out on one side or the other, and say what would fall outside it.
reasoning: |-
  Okay, the user is presenting a philosophical puzzle about identity over time, specifically regarding a wooden boat that's continuously replaced. They've observed that whether people consider the boat "the same" depends on what happens to the discarded timbers—especially if they're reassembled into another boat later. The user wants to understand if there's an established concept for this phenomenon, distinct from standard identity puzzles, vagueness, or degrees of sameness.

  First, I need to unpack the core issue. The user noticed that identity judgments change based on what happens to the discarded parts. If the old timbers are burned, everyone agrees it's the same boat. If they're reassembled into a new boat, many (like their friend) say the reassembled one is the original. But if the timbers are reused gradually in another working boat, no one thinks the identities swapped. Also, if the reassembled structure isn't a boat (like a barge or roof), the effect weakens. So the key factors are: reassembly into a similar object and timing.

  The user’s friend offered three explanations: the standard Ship of Theseus puzzle, vagueness, and sameness as a degree. The user rejects these because the judgments flip without changes to the boat itself, non-monotonically, based on external factors. So the user is seeking a concept that explains why external candidates and reassembly affect identity claims.

  Now, to address this, I recall philosophical concepts. The standard Ship of Theseus has two views: the 4D perdurantism (object as spacetime worm) and endurantism (object as wholly present at each time). But neither accounts for the reassembly scenario creating a rival candidate. This sounds like the "problem of the rival" in identity debates. 

  Then there's the "recollection effect"—mere reassembly of parts into a similar object triggers identity claims. But this might be part of a broader "candidate competition" where the existence of a rival with original parts challenges the original entity's identity. 

  The user also asks about edge cases: immediate reassembly, copying instead of reusing, and whether reassembly retroactively changes past identity. I need to consider counterfactuals and temporal aspects. For example, if timbers are copied, does the effect still occur? Likely not, as material continuity seems key. Immediate reassembly might intensify the competition, while delayed reassembly after the original is lost might still evoke the effect but weaker.

  The user’s deeper need might be to articulate a nuanced concept for discussions in conservation contexts, where authenticity and originality are contested. They might need a framework to clarify debates within their trust, beyond traditional philosophical answers.

  I think the best approach is to define "candidate competition" as the primary phenomenon, with the recollection effect as a subset. This explains why rival candidates disrupt identity claims based on their properties (like kind-membership and historical path). Vagueness and degrees don't capture the non-monotonic flipping. 

  For edge cases: immediate reassembly still creates competition; copying doesn't, as material matters; reassembly doesn't retroactively falsify past claims but causes reevaluation. These distinctions help carve the concept clearly.

  Since no established term fits perfectly, coining "competitive persistence" or "rivalrous identity" with defined boundaries makes sense. This gives the user a precise tool for their arguments, addressing both the practical conservation context and philosophical depth they seek.
answer: |-
  Your observation captures a profound and under-discussed phenomenon in the metaphysics of persistence. It is **not** merely an instance of the classic Ship of Theseus puzzle, nor is it fully explained by vagueness or degrees of sameness. You've identified two distinct but intertwined effects: **Candidate Competition** and **Kind-Sensitive Material Recollection**. Here's the carving:

  ### 1. **The Core Phenomenon: Persistence Conditional on Exogenous Rivals**  
     The identity of an object (e.g., the boat) depends not only on its intrinsic history but on **extrinsic events involving its discarded matter**. Specifically:  
     - If discarded parts are *destroyed* (burned), persistence is uncontested.  
     - If discarded parts are *reconstituted into a same-kind rival* (another boat), persistence claims are destabilized.  
     - If discarded parts are *repurposed heterogeneously* (fed into other boats, turned into a barge/roof), persistence weakens *proportionally to the rival's kind-membership*.  

     This violates standard assumptions:  
     - **Perdurantism** (4D "spacetime worm" view): Identity is fixed by temporal parts; reassembly of past parts shouldn’t create a *new* persistent entity retroactively.  
     - **Endurantism** (wholly present object): Identity relies on continuous form/matter; reassembly shouldn’t threaten the original if its matter was replaced gradually.  

  ### 2. **Two Distinct Mechanisms**  
     | **Effect**               | **Description**                                                                 | **Distinguishing Features**                                                                 |
     |--------------------------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
     | **Candidate Competition** | Persistence depends on *comparative claims* from rival objects.                | - Triggered by existence of a *same-kind* rival.<br>- Strengthens if rival is functional/complete.<br>- Weakens if rival is incomplete or delayed (e.g., reassembly after original's destruction). |
     | **Kind-Sensitive Material Recollection** | The *mere reassembly* of original matter into a same-kind object confers "originality." | - Depends on *material continuity*, not arrangement.<br>- Fades if reassembled object is a different kind (barge/roof).<br>- Irrelevant if matter is copied (not reused). |

     These are separable:  
     - **Competition without recollection**: If a *new* boat is built from *new* timber, claiming to be "the original," competition might arise through fraud, but recollection is absent.  
     - **Recollection without competition**: Original timbers reassembled into a non-rival object (e.g., a museum display) trigger nostalgia but not rivalry.  

  ### 3. **Edge Cases Resolved**  
     - **Immediate reassembly** (no shed interval):  
       Effect *strengthens*. Competition is direct; both boats exist simultaneously, forcing a choice.  
     - **Copied timbers** (arrangement inherited, material new):  
       **No effect**. The recollection mechanism requires *material continuity*; arrangement alone doesn’t suffice.  
     - **Reassembly timing**:  
       - If reassembled *while original exists*, competition dominates.  
       - If reassembled *after original is lost*, recollection dominates (e.g., "resurrected" original).  
     - **Does reassembly change past truths?**  
       **No.** Claims like "this is the original boat" were contextually true *when made*, but later events *retroactively undermine our epistemic confidence* in prior judgments. It’s a revision of meaning, not a change in past facts.  

  ### 4. **Contrasts with Standard Deflations**  
     - **Vagueness/Degrees**:  
       Your cases show *non-monotonic, context-dependent flipping* – e.g., identity weakens when timbers are reassembled but *strengthens* if they become a barge. Vagueness can’t explain this reversal.  
     - **Sameness as Degree**:  
       While persistence may admit degrees, the *sensitivity to rivals* isn’t about scalar continuity but *modal competition* ("which entity best satisfies the original’s role?").  

  ### 5. **The Unestablished Concept: Competitive Persistence**  
     No existing term fully captures this. I propose **Rivalrous Identity Conditionality (RIC)**:  
     > **Definition**: An object O’s persistence through time is *conditionally contested* iff:  
     > (i) Discarded parts of O are reconstituted into a functional object R,  
     > (ii) R belongs to the same kind as O,  
     > (iii) R’s existence creates a context where O and R compete for designation as the "original" entity.  
     >  
     > **Boundaries**:  
     > - *Inside RIC*: R’s kind-membership, functional status, and simultaneity with O strengthen the effect.  
     > - *Outside RIC*: Matter destruction, non-kind reassembly, or non-rival repurposing.  
     > - *RIC fails* if O’s identity is defined by non-material criteria (e.g., digital data, legal title).  

  ### Why This Matters  
  RIC explains why conservation debates (e.g., "Is this *the* Wright Flyer or a replica?") intensify when original parts resurface elsewhere. It reveals that persistence isn’t just about an object’s timeline but about the *narrative ecology* of its parts. Your boat’s identity isn’t vague—it’s **propositionally contested** when rivals emerge.  

  If philosophical deflation persists, ask your friend: "If burning the timbers secures the boat’s identity, how does *not* burning them *create* a new original?" That paradox can’t be solved by degrees or vagueness—it demands RIC.
