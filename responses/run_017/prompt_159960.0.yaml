prompt: |-
  I staff a standing committee at a private American university that adjudicates petitions about wrongs the institution inherited rather than committed. Typical petitions ask that a building named for a nineteenth-century donor be renamed, that a collection of ancestral remains be repatriated, that the university apologize for and make material amends for a historical expropriation of land, that a scholarship be endowed for the descendants of a group the university excluded, or that it do several of these at once. We meet monthly and handle fifteen to twenty petitions a year; each one produces written findings with reasons that go to the board of trustees, which has the final say. The committee has five members — a historian, a university lawyer, a faculty member, a student, and an alumni trustee — none of them a philosopher. Findings have to be drafted within about three weeks, be readable by someone with no training in the relevant literature, be consistent with what we have decided before, and survive being published. There is essentially no legal mandate behind any of this: in almost every case we are deciding what we owe, not what we are compelled to do.

  What I need is a decision procedure, not a position paper. Concretely: an ordered set of questions a member can run through on a petition, what counts as a sufficient answer to each one, the points at which the procedure stops with a no and issues a short finding, and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact.

  Several things make this harder than it looks, and I want the procedure to handle them rather than hand-wave them.

  First, petitions and press coverage run together four questions that I think have different answers and different conditions: whether the university should acknowledge that a wrong occurred and that it stands in some relation to it; whether it owes anyone anything, and what kind of thing (return of a specific object, repair, money, a program); whether it may or must apologize, and who is in a position to apologize for what; and whether it is entitled to describe itself as guilty. Please keep these separate, with separate conditions, and say which of them can be inherited across generations and which cannot.

  Second, continuity. The institution routinely gets to be the same entity that owns a two-hundred-year-old endowment and a different entity when asked about the wrong that funded it. I want a continuity test that forbids that asymmetry, with sub-questions that a non-specialist can actually answer from an archivist's memo: legal and charter continuity; asset continuity; whether the wrong was done by someone acting in the institution's name or with its resources; whether it was ratified at the time or later, or condemned at the time and merely tolerated; and whether the institution still holds a benefit it would not hold but for the wrong. I also want the procedure to treat present-tense honoring — a name on a building, a portrait, a named chair — as a present act rather than a mere inheritance, and to say what follows from that.

  Third, the wronged party and its successors. Some of our cases have an identifiable successor (a federally recognized tribe, a family whose land was taken); some have a dispersed successor set; some have rival claimants. Say what the procedure does when the successor set is contested, and what kinds of remedy remain available, or stop being available, when nobody can be identified to receive one. Relatedly: some wrongs are over and done with, and some are still going on — an object still held against a continuing objection, an exclusion still reproduced in present admissions or hiring patterns. Cases of the second kind need no theory of inherited guilt at all, and I want that recognized early in the procedure rather than buried.

  Fourth, evidence and burden of proof. The university controls the archive, and in many cases the record is simply silent about the thing that matters. State where the burden lies, what the default is when the record is silent, and whether silence is a no or a maybe-and-then-what.

  Fifth, adequacy of a remedy. I want a test for the failure mode where the institution buys public credit with a gesture that costs it nothing — a plaque, a land acknowledgment, a renaming that a donor's family had stopped caring about — and I want a test for the opposite failure mode, where the procedure ratchets toward whatever the most demanding petition asks for. Tell me how to check whether a proposed remedy is one the successor group would accept, and who is actually bearing its cost.

  Sixth, precedent and cost. "If we do this we will get forty more" is a real consideration for a committee with a finite budget and a board that reads the newspapers, and it is also an easy way to do nothing. Say how floodgates may and may not enter the procedure, and include a consistency check against decisions the university has already made.

  I know the fourfold distinction among criminal, political, moral, and metaphysical guilt that Jaspers drew in his postwar writing on German guilt, and giving me those four labels back is not a procedure. But if one of them is doing real work at a particular step — for instance, if moral guilt is the one that cannot be inherited while something like political liability can — say which step it does the work in and what work it does there.

  Please then run the finished procedure on three petitions in front of us:

  1. A building named for an alumnus merchant whose fortune came from a firm that financed plantation mortgages in the 1840s and 1850s. His gift endowed a chair that is still funded from the original principal. The petition asks that the name come off and that the endowment be redirected to scholarships for descendants of the enslaved people on those plantations. The donor's family currently gives to the university separately and has told us privately that a separate large bequest will be withdrawn if the name comes down.

  2. A teaching collection of ancestral remains and sacred objects taken in the 1920s by a professor working with university funds and university transport, whose field notes record the objections of the community at the time. A federally recognized tribe has requested repatriation of everything. Some of the individuals in the collection cannot be confidently affiliated with any present-day group.

  3. A national organization demanding that the university, as an American institution, formally accept guilt for slavery and contribute to a national reparations fund. There is no specific institutional act and no traceable asset; the benefit, if there is one, is the diffuse benefit of operating inside a slave economy and its aftermath.

  I expect at least one of these to come out somewhere my committee will not like — I would rather be told that than be told what we want to hear — and I expect the procedure to say plainly, somewhere, "this one is a values decision and the procedure stops here." Finally, tell me what the procedure cannot do: which cases it will systematically misdescribe, and where a committee using it should distrust its own output.
reasoning: |-
  Hmm, the user is describing a complex ethical adjudication process for a university committee handling historical wrongs. They need a structured decision procedure rather than philosophical theories. Let me unpack this carefully.

  First, the core challenges they outlined are significant: separating four distinct questions (acknowledgment, obligation, apology, guilt), handling institutional continuity, identifying legitimate claimants, managing evidentiary gaps, preventing tokenistic remedies, and containing precedent effects. The Jasperian framework they mentioned could be useful but must be operationalized, not just name-dropped.

  For the decision procedure architecture, I'm considering a flowchart model with clear stopping points. The continuity analysis should come early - it's foundational. Key tests would include: legal charter persistence, asset tracing, ratification history, and ongoing benefit retention. Present-tense honoring like building names needs special handling as active endorsement.

  When dealing with claimants, the procedure should distinguish between direct successors (federally recognized tribes), diffuse groups, and contested claims. For ongoing harms versus historical wrongs, that's a crucial branch point - no inherited guilt theory needed for persistent injustices.

  The evidence protocol must address archive control asymmetry. I'd propose a "reasonable inference" standard when records are silent, with burden shifting to the university if it benefited from the wrong. This prevents institutional silence from blocking claims.

  Remedy evaluation needs safeguards against both performative gestures (cheap plaques) and unsustainable demands. Cost-bearing analysis is essential - who actually sacrifices something of value? The committee should require evidence of claimant consultation where possible.

  Precedent management is tricky. "Floodgate" concerns can't be dispositive but shouldn't be ignored either. Maybe a comparative impact assessment against existing commitments, with board notification if systemic resource issues emerge.

  For the Jaspers integration: political liability (institutional obligations) does the heavy lifting in remedy design; moral guilt informs apology legitimacy but isn't inheritable; metaphysical guilt stays outside the procedure entirely.

  Applying this to their three cases: The building renaming seems actionable due to ongoing benefit and active honoring, but remedy design gets complex with donor retaliation. The repatriation case is clearest - ongoing possession plus documented objection triggers near-automatic return. The national slavery reparations claim likely fails the continuity and specificity tests, though acknowledgment may still be warranted.

  The procedure's main blind spots would be: competing justice claims (e.g., reparations vs. scholarships), intergenerational equity tradeoffs, and cultural paradigm clashes. Committees should watch for these and pause when values conflicts emerge.

  This structure gives them actionable guidance while flagging where human judgment remains essential. The emphasis on operational tests rather than theoretical purity seems aligned with their practical needs.
answer: |-
  Here is a structured decision procedure designed for your committee's specific challenges. It consists of 10 ordered questions with clear thresholds, stopping points, and outputs. Each question builds on the previous, and failure at any step terminates with a specific finding ("No") or hands off to the Board for values-based decisions ("Board Decision Required").

  ---

  ### **Decision Procedure for Historical Wrongs Petitions**
  **Key Principles:**  
  1.  **Separation of Issues:** Treats Acknowledgment, Obligation, Apology, and Guilt as distinct questions.  
  2.  **Continuity Test:** Binds institutional identity across benefits and wrongs.  
  3.  **Burden of Proof:** Shifts to the institution when evidence is plausibly obscured.  
  4.  **Remedy Adequacy:** Requires cost-bearing and claimant validation.  
  5.  **Precedent Handling:** Allows consideration of systemic impact only after establishing obligation.  

  ---

  #### **Step 1: Continuity & Institutional Nexus**  
  *"Is the university the same entity that benefited from/honors the act?"*  
  **Sub-questions:**  
  - Legal/Charter Continuity: Has the university maintained unbroken legal existence? *(Default: Yes, unless dissolved/reconstituted)*  
  - Asset Continuity: Does the university retain assets (funds, property, objects) directly traceable to the act? *(e.g., endowment principal, land, collections)*  
  - Agency: Was the act committed by an agent (employee, donor) using university resources/authority?  
  - Ratification: Did the university leadership at the time endorse the act, or later fail to repudiate it?  
  - Ongoing Benefit: Does the university hold a benefit it would not have *but for* the wrong?  
  - **Present-Tense Honoring:** Is the university *actively* honoring the act/person (name on building, portrait, named chair)? → **Treat as current endorsement.**  
  **Threshold:** "Yes" if ≥2 sub-questions affirm continuity (including Present-Tense Honoring or Asset Continuity).  
  **Failure:** → **"No Obligation"** (Terminate with finding: *"No institutional nexus to the alleged wrong."*)  

  #### **Step 2: Ongoing Harm?**  
  *"Is the alleged wrong actively perpetuated or causing current harm?"*  
  *(e.g., holding contested remains, exclusionary policies, discriminatory outcomes traceable to past acts)*  
  **Threshold:** "Yes" if harm is measurable and ongoing (e.g., possession despite objection, statistical disparity linked to historical exclusion).  
  **Success:** → **Proceed to Step 6** (Skip inherited obligation—current duty exists).  
  **Failure:** → Proceed to Step 3 (Assess historical wrong).  

  #### **Step 3: Acknowledgment**  
  *"Did a wrong occur, and does the university stand in a relation to it?"*  
  **Burden of Proof:** On petitioner if evidence is accessible; shifts to university if archives are silent on key facts *and* continuity (Step 1) is established.  
  **Silence Default:** If continuity exists and archives are silent on contested facts, infer wrongdoing (*"Maybe-and-then-what"*).  
  **Threshold:** "Yes" if credible evidence of wrongdoing exists *and* Step 1 continuity is met.  
  **Failure:** → **"No"** (Terminate with finding: *"Insufficient evidence of wrong or nexus."*)  

  #### **Step 4: Identifiable Successor Group?**  
  *"Is there an identifiable individual/group to whom obligation is owed?"*  
  - **Clear Successor:** Federally recognized tribe, lineal descendant, family with documented claim.  
  - **Dispersed Group:** Descendants of enslaved persons, excluded ethnic group.  
  - **Contested Claimants:** Rival groups claim legitimacy.  
  **Threshold:** "Yes" if Clear Successor exists. If Dispersed or Contested, proceed but flag remedy limitations.  
  **Failure (No Successor):** → Proceed only for non-transferable remedies (e.g., acknowledgment, apology).  

  #### **Step 5: Inherited Obligation?**  
  *"Does the university owe material amends (restitution, repair, compensation)?"*  
  **Conditions for "Yes":**  
  - Continuity (Step 1) + Acknowledgment (Step 3) + **Asset Continuity or Present-Tense Honoring**.  
  - *Jaspers' Political Liability applies:* Obligation stems from institutional benefit/honoring, not moral guilt.  
  **Threshold:** "Yes" only if university retains benefit (*"unjust enrichment"*) or actively honors the wrong (*"ongoing endorsement"*).  
  **Failure:** → **"No Material Obligation"** (Proceed only to Apology/Guilt steps).  

  #### **Step 6: Remedy Design**  
  *"What remedy is owed, and is it adequate?"*  
  **Sufficiency Tests:**  
  1.  **Cost-Bearing:** Does the remedy impose a material cost proportional to the benefit/harm? *(e.g., redirecting endowment funds, not adding a plaque)*.  
  2.  **Claimant Validation:** Would a representative of the successor group accept it? *(Require consultation for material remedies)*.  
  3.  **Precedent Check:** Is remedy consistent in *kind* (not scale) with past university actions?  
  **Floodgates Rule:** Systemic impact ("40 more claims") may be noted *only after* obligation is established. Board may adjust remedy scope/resources but not deny obligation.  
  **Output:** → Specific remedy proposal.  

  #### **Step 7: Apology**  
  *"May the university apologize, and who can apologize?"*  
  **Conditions:**  
  - Acknowledgment (Step 3) must be established.  
  - Apologizer must represent the institution (e.g., President, Board Chair).  
  - *Jaspers' Moral Guilt applies:* Apology expresses regret for past acts but does not imply inheriting moral guilt.  
  **Threshold:** Always permitted if Acknowledgment is "Yes."  
  **Output:** → Recommend apology language.  

  #### **Step 8: Guilt Attribution**  
  *"May the university describe itself as 'guilty'?"*  
  **Threshold:** → **"Board Decision Required"** (Values-based).  
  - *Jaspers' Metaphysical Guilt applies:* Collective responsibility beyond legal/political frameworks.  
  **Procedure:** Committee does not decide; flags as non-actionable values question.  

  #### **Step 9: Consistency Check**  
  *"Is this decision consistent with prior committee findings?"*  
  **Threshold:** If inconsistency exists, require:  
  - Explicit overruling of precedent with justification, or  
  - Remedy redesign to align with past principles.  

  #### **Step 10: Final Output**  
  Draft findings with:  
  - Answers to Steps 1–7.  
  - Remedy proposal (if any).  
  - Apology recommendation (if applicable).  
  - Flagged values questions (Step 8) for Board.  

  ---

  ### **Application to Sample Petitions**
  **Petition 1: Building Renaming & Endowment Redirection**  
  - **Step 1 (Continuity):** YES (Asset continuity: original endowment still funds chair; Present-tense honoring: building name).  
  - **Step 2 (Ongoing Harm):** NO (Harm is historical).  
  - **Step 3 (Acknowledgment):** YES (Documented plantation financing).  
  - **Step 4 (Successor):** YES (Dispersed group: descendants of enslaved people).  
  - **Step 5 (Obligation):** YES (Ongoing benefit + active honoring).  
  - **Step 6 (Remedy):**  
    - Renaming building: REQUIRED (present-tense honoring).  
    - Endowment redirection: REQUIRED (asset continuity).  
    - *Adequacy Test:* Redirecting funds imposes cost; scholarships align with harm. Family’s threatened bequest irrelevant to obligation.  
  - **Step 7 (Apology):** PERMITTED.  
  - **Step 8 (Guilt):** BOARD DECISION (e.g., "complicit in slavery").  
  - **Output:** Rename building, redirect endowment to scholarships. Apology recommended.  

  **Petition 2: Repatriation of Remains/Sacred Objects**  
  - **Step 1 (Continuity):** YES (Agency: professor used university funds/transport; Asset continuity: objects held).  
  - **Step 2 (Ongoing Harm):** YES (Possessing contested items *is* ongoing harm). → **Proceed to Step 6.**  
  - **Step 6 (Remedy):**  
    - Repatriate all items to federally recognized tribe.  
    - Unaffiliated remains: Consult tribe; if no affiliation, ethical burial.  
    - *Adequacy Test:* Returning objects imposes cost (loss of collection); tribe acceptance validates remedy.  
  - **Output:** Immediate repatriation. Apology recommended.  

  **Petition 3: National Reparations for Slavery**  
  - **Step 1 (Continuity):** NO.  
    - No asset continuity (no traceable funds).  
    - No agency (no specific act by university agents).  
    - No present-tense honoring.  
    - Diffuse benefit alone insufficient.  
  - **Failure at Step 1** → **"No Obligation."**  
  - **Acknowledgment (Step 3):** MAYBE (Diffuse benefit in slave economy), but no obligation.  
  - **Output:** Terminate with *"No institutional nexus to slavery justifying material amends."* Acknowledgment/apology permitted but not required.  

  ---

  ### **What the Procedure Cannot Do**  
  1.  **Resolve Values Conflicts:** Step 8 (Guilt) and contested moral weights (e.g., "justice vs. mercy") require Board judgment.  
  2.  **Handle Competing Claims:** When rival groups assert legitimacy (e.g., multiple tribes claiming remains), the procedure identifies the issue but cannot arbitrate.  
  3.  **Quantify Diffuse Harms:** No mechanism to calculate reparations for indirect benefits (e.g., Petition 3).  
  4.  **Predict Board/Public Reaction:** Floodgates concerns are noted but not resolved by the procedure.  
  5.  **Override Legal Constraints:** While rare, extant laws (e.g., trusts, repatriation statutes) may supersede.  

  **Blind Spots & Distrust Triggers:**  
  - When **benefits are diffuse** (e.g., institutional prestige from historical exclusion), the procedure underestimates obligation.  
  - When **successor groups are amorphous** (e.g., descendants of enslaved people broadly), remedies may be symbolic rather than restorative.  
  - **Distrust output** if:  
    - Continuity is established solely on "ratification" without asset/honoring links.  
    - Remedies impose costs only on uninvolved parties (e.g., cutting financial aid to fund reparations).  

  --- 

  This procedure forces clarity on institutional responsibility while containing open-ended moral questions. It prioritizes redress for ongoing harms, tangible benefits, and active honoring—ensuring petitioners get answers, not paralysis. The Board retains authority on guilt narratives and systemic trade-offs, but the committee delivers actionable recommendations grounded in evidence and precedent.
