answer: |-
  Here’s your quiz, designed to cut through label confusion using concrete cases. Each question targets a core disagreement about language learning. **Scoring key and position tree follow the questions.**

  ---

  ### Quiz: How Do Kids Pick Up Language?  
  *Pick the answer closest to your intuition for each scenario.*

  1.  **Mini-Language Experiment:**  
      You invent a tiny language with one clear rule: "To ask a question, move the word *'glip'* to the front." Unspoken rule: *'Glip'* can ONLY mark questions. You teach adults 20 simple sentences *without ever using 'glip' in a statement or explaining the restriction*. Later, when *creating new sentences*, adults:  
      **A)** Never use *'glip'* in statements, following the unspoken rule perfectly.  
      **B)** Sometimes use *'glip'* in statements, violating the unspoken rule.  
      **C)** I don’t know / This test is flawed.

  2.  **Home Sign Systems:**  
      Hearing children born to deaf parents (not using sign language) are only exposed to adults' inconsistent, makeshift gestures ("home signs") with no stable grammar. When these children communicate *with each other* using gesture:  
      **A)** They develop a system with consistent word order, rules, and grammar *different from their parents' gestures*.  
      **B)** Their system remains as inconsistent as their parents' gestures.  
      **C)** I don’t know if this happens.

  3.  **Ignoring Errors:**  
      In a household, all adults consistently say things like "Him go store" (ungrammatical object pronoun in subject position). The young child growing up there:  
      **A)** Says "He go store" or "Him go store" randomly, copying the error sometimes.  
      **B)** Consistently says "He go store," *avoiding the error* despite constant exposure.  
      **C)** I don’t know what typically happens.

  4.  **Second Language Timing:**  
      Two siblings move to a new country. One is 9, the other is 15. They are immersed in the new language:  
      **A)** The 9-year-old typically becomes perfectly fluent; the 15-year-old often retains subtle grammatical errors despite effort.  
      **B)** Both can become equally fluent with enough immersion and practice; age itself isn’t the key factor.  
      **C)** This varies too much; it doesn’t clearly show anything about innate grammar.

  5.  **AI vs. Child:**  
      A powerful computer is trained on *billions* of sentences from books, web pages, and transcripts – vastly more than any child hears. When tested:  
      **A)** It often labels truly impossible sentences ("Apple the eat boy") as *possible*, while children reliably know they're wrong.  
      **B)** It gets very good at identifying impossible sentences, similar to a native speaker.  
      **C)** Comparing computers to children is too different to be meaningful.

  6.  **The Super-Memory Animal:**  
      Imagine an animal (not a primate) evolved with a *massive* general-purpose memory and powerful pattern-spotting skills, but *no special brain structures for communication*. Could it learn human grammar *just by listening to people talk*?  
      **A)** No, it couldn’t grasp the abstract rules like word order dependencies or question formation correctly.  
      **B)** Yes, with enough exposure, its pattern-spotting could figure out the grammatical rules.  
      **C)** Impossible to say / It depends on what "grammar" means.

  7.  **The "Don't Say That" Test:**  
      When a young child says something ungrammatical ("Me want cookie"), adults:  
      **A)** Almost *never* explicitly correct the grammar ("No, say 'I want a cookie'"). They might correct meaning or just respond naturally ("Okay, here's a cookie").  
      **B)** *Frequently* explicitly correct grammar mistakes, especially for common errors.  
      **C)** Correct grammar *indirectly* all the time by rephrasing correctly ("Oh, *you* want a cookie?").

  8.  **The Core Puzzle:**  
      Kids master complex grammar rules they weren’t explicitly taught and weren’t constantly corrected on. The *best* explanation is:  
      **A)** Humans are born with specialized brain structures/machinery specifically for learning language grammar.  
      **B)** Humans are born with powerful, *general* learning abilities that find patterns in the rich language input they get.  
      **C)** We don’t have a complete explanation yet, and calling it "innate" might just rename the mystery.

  ---

  ### Scoring Key & Position Tree
  *Instructions:* Tally your answers. Use the tree below to find your position(s). **Bold letters** indicate the branch-defining belief. *Italicized* positions are leaves.

  ```
  START: How do kids master complex grammar without explicit teaching/correction?
  │
  ├── Branch 1: Is the child's learning constrained by the kind of patterns it *can* consider learning? (If mostly A's in Q1, Q2, Q3, Q6)
  │   │
  │   ├── Branch 1A: **Are these constraints SPECIFIC to language?** (If Yes: A in Q6, Q8A likely)
  │   │   │
  │   │   ├── *Nativist (Built-in Grammar):* Core grammatical constraints (like structure-dependence) are innate, language-specific properties of the human brain. *(Awkward: Why are these specific constraints universal if input varies?)*
  │   │   └── Branch 1A Tie-Breaker (Q5): If A → Strong Nativist; If B/C → Leans Nativist but open to powerful learning.
  │   │
  │   └── Branch 1B: **Are these constraints GENERAL learning biases?** (If No to 1A: B in Q6, Q8B likely)
  │       │
  │       ├── *Biased Learner (Domain-General):* Innate *learning mechanisms* (e.g., preferring simpler, more structured patterns) shape language acquisition, but aren't language-specific. Grammar emerges from input + these biases. *(Awkward: Explaining the *specific* biases needed for language.)*
  │       └── Branch 1B Tie-Breaker (Q4): If A → Accepts sensitive/critical periods as evidence for biological constraints; If B → Sees age effects as practice/motivation.
  │
  └── Branch 2: **Is "innateness" a useful explanation here?** (If mostly B/C in Q1, Q2, Q3, Q5, Q6 OR C in Q8)
      │
      ├── *Empiricist (Input + General Learning):* Rich input + powerful general pattern detection (statistical learning, analogy) is sufficient. "Constraints" emerge from data + learning algorithms. *(Awkward: Explaining consistent mastery of untaught/uncommon rules like Q1 unspoken rule.)*
      └── *Skeptic/Deflationary:* The "poverty of stimulus" argument is overstated (input is richer, correction exists indirectly), untestable, or "innate" just relabels the mystery of how learning works. *(Awkward: Dismissing a widely felt explanatory gap.)*
  ```

  ### How to Interpret Your Answers
  1.  **Count your A/B/C choices.** Look for patterns (e.g., many A's in Q1/Q2/Q3/Q6).
  2.  **Follow the Tree:** Start at the top. Your answers to the key questions (Q1, Q2, Q3, Q6 especially) push you down Branch 1 or Branch 2.
  3.  **Branch 1 (Constraints):** If you think kids *don't* just copy input (A in Q2, Q3) and *can't* be mimicked by general pattern-spotters alone (A in Q6), you're here. Then Q6/Q8 push you to Nativist (Language-Specific) or Biased Learner (Domain-General).
  4.  **Branch 2 (Skepticism of Innateness Argument):** If you think input *is* sufficient/rich (B in Q2, Q3, Q5), animals/computers *could* learn grammar (B in Q6), or the whole debate misses the point (C in Q1, Q5, Q8), you're here. Q8 pushes you to Empiricist or Skeptic.
  5.  **Tie-Breakers (Q4, Q5):** Use these if your answers leave you between positions on the same branch (e.g., between Nativist/Biased Learner or Empiricist/Skeptic).
  6.  **Mixed Answers:** You might straddle branches (e.g., A in Q2/Q3 but B in Q6). This highlights genuine tension in your views! Revisit the tree splits. You might lean towards Branch 1B (Biased Learner) or have elements of both Branch 1 and Skepticism.
  7.  **"C" Answers:** These often lead to the Skeptic position or indicate hesitation within another position. Q5C is explicitly for Skeptics.

  ### Notes on Your Cases
  *   **Q1 (Mini-Language):** Good test for untaught constraints (Nativist/Biased Learner vs. Empiricist). C is for Skeptics.
  *   **Q2 (Home Sign):** Strong evidence for active structuring (Nativist/Biased Learner). B is rare (supports strong Empiricism/Skepticism of innate structuring).
  *   **Q3 (Ignoring Errors):** Counters pure imitation (supports Nativist/Biased Learner). A supports Empiricism (input drives learning).
  *   **Q4 (Second Language):** **Weak Discriminator.** Both sides can explain it (Critical Period vs. Practice/Plasticity). Used as tie-breaker *within* branches.
  *   **Q5 (AI vs. Child):** Core test for sufficiency of input + stats (Empiricist vs. Nativist/Biased Learner/Skeptic). C is the Skeptic option.
  *   **Q6 (Super-Memory Animal):** Key test for language-specificity (Nativist vs. Biased Learner/Empiricist). C leans Skeptic.
  *   **"No Fact of the Matter":** Q5C explicitly offers this. Skepticism (Q8C) is the full position embracing this view.
  *   **"Unattractive/Unheld":** Believing B for Q2 (kids don't structure home sign) *and* A for Q6 (animal can't learn grammar) is incoherent. Believing A for Q3 (kids copy errors) *and* A for Q1 (adults infer unspoken rules) is inconsistent. The tree avoids these paths.

  This quiz forces you to commit to intuitions on concrete cases, bypassing the "innate" label war. The tree reveals how those commitments map onto the underlying philosophical/linguistic positions. Good luck resolving the argument!
