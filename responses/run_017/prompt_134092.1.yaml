prompt: |-
  I am a junior and the student member of the four-person committee that runs our state's History Day fair — two history teachers, our librarian, and me — and I have been asked to draft the memo we will vote on at Thursday's meeting. I would rather not hand in something that just applies the word pseudohistory and stops, so I am asking for help with the reasoning as much as the bottom line.

  The case: a senior in my school has submitted an individual exhibit titled Mothers of Stone. Her claim is that the recurrence of large stone building traditions in Egypt, Mesoamerica, coastal Peru, and island Southeast Asia is best explained by contact with a single earlier seafaring civilization, and that archaeologists attribute it to independent invention mainly because of textbook inertia, grant incentives, and reluctance to credit outsiders. One panel of her board lays out the conventional dating; she argues that the dating itself presupposes what she is questioning. Her faculty sponsor has signed off, she has four pages of source notes, and nearly all of them are books and websites that already agree with her. She is a friend, and she has told me privately that if we suppress her project it will just confirm her thesis about who gets to decide what counts as knowledge.

  Our rules say an entry must present a historical argument supported by evidence and must show how sources were used. They say nothing about whether the argument has to be true, or about what to do when a student's sources are all on one side of the question. Last year we disqualified a project for fabricated quotations, and the wording of that decision is now being cited as precedent for disqualifying anything we believe to be false.

  What I need is a memo the committee can act on: a single clear recommendation — accept as submitted, accept on stated conditions with a deadline, move the exhibit out of the judged history category into exhibition-only, or disqualify — followed by a general rule of two or three sentences that we could apply next year to an Atlantis entry, to an ancient-astronauts entry, and also to a project whose conclusion is unorthodox but genuinely argued.

  The things I want the memo to work through, because they are what we have actually been arguing about:

  1. Whether the fair can judge conclusions at all without turning ourselves into an enforcement arm for current expert consensus. My own view is that we should be judging method, not verdicts, but I cannot say exactly which features of method we are judging.
  2. The immunity structure I have noticed in her draft, and I want it described in a way I can defend to her face: she never says what would count as evidence against her; missing evidence gets treated as supporting evidence; she demands far more certainty from a conventional date than from her own; and her view seems to require that a large number of specialists be not merely mistaken but effectively complicit. I would like these turned into a test the committee can actually apply rather than an impression.
  3. The precedent that worries me most. Amateurs in the nineteenth century dug up places that most scholars had classified as legend, so any rule keyed to contradicting present consensus would have silenced a real discovery. She will make this argument on Thursday and I do not have a good answer to it.
  4. The opposite worry: a fair lends the school its name, judges' scores get read as endorsement, and middle schoolers walk through the exhibit hall. Is saying the point is the process, not the verdict, an answer to that, or a way of avoiding the question?
  5. The option everyone has floated and nobody has defended: requiring her to reframe the exhibit as a second-order historical question — why lost-civilization theories have been so attractive, and what work they did for the people who believed them — which her material would mostly fit. Is that a fair condition with a deadline attached, or is it us declining to engage the claim she actually wants to make? If the memo recommends it, I need the exact language of the condition, because she will ask whether we would have rewritten the question of a project we liked.
  6. Whether allowing hers commits us, in consistency, to allowing projects whose conclusions we find sympathetic but whose evidence is just as thin, and if not, what the difference is supposed to be.

  Please also give me a short paragraph of what the committee should say to her out loud after the vote, and one sentence for next year's handbook. Aim for roughly eight hundred words, written to be read aloud to a room of teachers and a seventeen-year-old: no term of art I would have to look up, or if you need one, explain it in a sentence. I am less interested in a verdict than in a document that treats her position seriously and that we could still stand behind if her exhibit turns out to be right.
reasoning: |-
  Okay, the user is a junior student on a committee for a History Day fair. They need help drafting a memo for their committee meeting about a controversial project submitted by a senior friend. The project argues that stone building traditions in different regions come from a single ancient seafaring civilization, challenging conventional archaeology. The user wants a fair recommendation and a rule that can be applied consistently to similar cases in the future.

  The key issues the user raises include:
  - Whether the fair should judge conclusions or just method
  - How to address the immunity structure in the student's argument
  - The precedent of past discoveries challenging consensus
  - Concerns about the school endorsing pseudohistory
  - Option to reframe the project as a second-order question
  - Ensuring consistency in future decisions

  The user needs a balanced solution that respects academic integrity while being fair to the student. They want to avoid simply labeling the project as pseudohistory without proper reasoning. The memo should provide clear criteria for evaluating methodology rather than conclusions.

  For the immunity structure, I'll need to identify specific problematic argument patterns like lack of falsifiability and treating absence of evidence as evidence. These should be turned into testable criteria rather than vague impressions.

  Regarding the historical precedent of discoveries challenging consensus, I should acknowledge this while emphasizing that legitimate challenges follow proper scholarly methods. The key distinction is how claims are argued, not whether they challenge orthodoxy.

  The reframing option seems like a good compromise - having the student analyze why lost-civilization theories emerge historically rather than advocating for one. This maintains academic rigor while allowing the student to use most of her research. The condition should be clearly worded to avoid appearing punitive.

  The recommendation should focus on method evaluation criteria: falsifiability, source engagement, proportional standards, and historical context. These will form the basis for a handbook rule that can be applied consistently to all projects regardless of their conclusions.

  The post-vote explanation to the student should emphasize respect for her work while explaining why the methodology needs adjustment. The handbook language should clearly state that projects are evaluated on how they use evidence, not on their conclusions.

  This approach balances integrity with fairness, provides clear guidelines, and respects the student's intellectual effort while maintaining academic standards.
answer: |-
  ## Committee Memo: Evaluation of "Mothers of Stone" Exhibit

  **To:** History Day Fair Committee
  **From:** [Your Name], Student Member
  **Date:** [Date of Meeting]
  **Subject:** Recommendation and Policy Framework for Project "Mothers of Stone" (Senior Division, Individual Exhibit)

  **Recommendation:** Accept the project "Mothers of Stone" **on the condition** that the student reframe the central historical question. The revised exhibit must focus on analyzing *why* "lost civilization" theories (like the one proposed) have emerged historically, what cultural or intellectual needs they addressed for their proponents, and how they interact with established archaeological methods and evidence. The student must submit a revised project description and annotated outline reflecting this shift by **[Date - e.g., 1 week before judging]**. Failure to meet this condition will result in the project being moved to Exhibition-Only status.

  **Policy Rule for Future Fairs (For Handbook):** All History Day entries must advance a historical argument based on evidence. Entries are evaluated on the *quality of their historical method*, including: (1) whether the argument can be tested against conflicting evidence; (2) whether sources representing different viewpoints are engaged critically; (3) whether standards of evidence are applied consistently to all claims; and (4) whether the historical context of interpretations is considered. The persuasiveness of the final conclusion is not the primary basis for evaluation.

  ---

  **Reasoning for Recommendation & Policy:**

  Our task is challenging: to uphold scholarly standards without becoming gatekeepers of orthodoxy, and to support student inquiry while ensuring the fair represents sound historical practice. This case forces us to define what "sound historical practice" means for *our* fair. Our rules focus on argument and evidence use, not ultimate truth. Disqualification solely for an unorthodox conclusion sets a dangerous precedent, potentially stifling legitimate challenges. The student rightly points out that consensus shifts, often driven by evidence dismissed initially. Silencing dissent based solely on current orthodoxy contradicts the spirit of historical inquiry.

  However, accepting *any* argument, regardless of *how* it's constructed, undermines our educational purpose and risks lending credibility to misleading claims, especially for younger attendees. The core issue with "Mothers of Stone" isn't its conclusion, but its **methodology**, which exhibits features incompatible with the historical method we aim to teach and evaluate:

  1.  **Lack of Falsifiability:** The central argument ("single seafaring civilization") is structured to be immune to counter-evidence. Conventional dating is dismissed as circular. The absence of direct evidence for contact (like shared artifacts or clear cultural transmission markers) is presented *not* as a weakness of the theory, but as evidence *for* a cover-up or scholarly failure. A sound historical argument must specify what evidence *could* disprove it.
  2.  **Selective and Uncritical Source Use:** While the project has sources, they overwhelmingly pre-confirm the thesis. There is no meaningful engagement with the vast body of archaeological scholarship explaining independent invention through environmental constraints, social organization, technological evolution, or parallel development. Sources are used affirmatively, not critically examined for bias or limitation. The project doesn't grapple with *why* the mainstream interpretation exists beyond alleged conspiracies ("textbook inertia, grant incentives, reluctance to credit outsiders").
  3.  **Uneven Standards of Evidence:** The project demands an unrealistic level of certainty ("prove it wasn't contact!") from conventional archaeology while accepting much weaker evidence (e.g., superficial similarities in stonework across vastly different cultures and timescales) for its own claims. Historical arguments must apply consistent standards.
  4.  **Reliance on Presumed Conspiracy:** Explaining the lack of mainstream acceptance requires positing widespread, sustained, deliberate suppression or incompetence among generations of specialists worldwide. While institutions can be resistant, historical arguments relying primarily on large-scale malfeasance to dismiss counter-evidence are generally considered methodologically weak.

  Reframing the project as a **second-order historical question** directly addresses these methodological concerns while respecting the student's substantial research effort and intellectual passion. Instead of *advocating* for the lost civilization theory, she would *analyze* it as a historical phenomenon: Why do such theories emerge (e.g., Western fascination with "lost wisdom," challenges to Eurocentrism, reaction to complexity)? What historical contexts made them plausible to their proponents? How do they interact with professional archaeology? Her existing sources are largely *perfect* for this new focus. This shift moves the project firmly into the realm of **historiography** (the study of how history is written and interpreted), which is a valid and rigorous historical approach.

  This is **not** declining to engage her claim. It *is* declining to endorse a specific methodological approach we find flawed. Importantly, it's **not a punishment**, but a **redirection** towards a demonstrably historical methodology using her research. If a mainstream project used similarly flawed methods (e.g., dismissing all counter-evidence as conspiracy, uncritically using only confirming sources), we would also require methodological correction. The standard is the *method*, not the *conclusion*. This ensures consistency: an Atlantis or ancient-astronauts project using sound method to analyze the *history of the idea* would be acceptable; one advocating the literal truth using flawed method would require similar correction. A genuinely argued unorthodox conclusion using sound method (e.g., engaging critically with counter-evidence, applying consistent standards, avoiding conspiracy logic) would be fully acceptable.

  **Regarding Precedent:** The 19th-century amateur example is valid. However, Schliemann (finding Troy) or Evans (Knossos) succeeded because they *engaged with the evidence on its own terms and provided new, verifiable data* that challenged assumptions. They didn't primarily argue that scholars were covering up the truth; they presented tangible findings. Our policy judges *how* a challenge is mounted methodologically, not that a challenge is mounted at all.

  **Regarding School Endorsement:** Simply saying "it's the process" is insufficient. Judging *method* rigorously *is* the answer. A project using sound method to reach an unorthodox conclusion deserves recognition for its process. A project using flawed method, even if its conclusion aligns with consensus, should not score highly. Explaining this publicly (in program notes, judge training) clarifies that judging rewards historical *practice*, not specific outcomes.

  **What to Say to the Student After the Vote:** "[Student's Name], the committee has carefully reviewed your project and recognizes the significant research and passion you've invested. We are not rejecting your idea outright. However, we have concerns about *how* the argument is constructed and supported. Specifically, we need the argument to demonstrate a stronger engagement with conflicting evidence and a more consistent application of historical standards. To that end, we are approving your project **on the condition** that you reframe it to focus on analyzing *why* theories like the one you researched have been proposed throughout history, what needs they met, and how they relate to mainstream archaeology. This allows you to utilize your research powerfully while meeting the fair's standards for historical methodology. We believe this shift will make your project even stronger and more scholarly. We need your revised outline by [Date]. We're happy to discuss this further to help you succeed."

  **Handbook Language (1 Sentence):** "History Day entries are evaluated on the quality of their historical method, including how they test their argument against evidence, critically engage diverse sources, apply consistent standards of proof, and consider the context of historical interpretations; the ultimate conclusion reached is not the primary basis for evaluation."

  This approach takes the student's work seriously, upholds scholarly standards focused on method, provides a clear path forward, and establishes a consistent, defensible rule for future fairs, regardless of a project's orthodoxy. It respects the possibility she could be right *in the long run* while insisting on sound historical practice *for the fair*.
