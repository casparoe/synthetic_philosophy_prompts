answer: |-
  Here’s a draft for your toast, weaving in your core distinction with warmth, respect, and clarity for all audiences:

  **Toast for Mom**

  "Family, friends, colleagues, and neighbors – thank you all for being here tonight to celebrate my mom. For twenty-four years, most of you have known her in one role: Senator [Mom's Name]. Tonight, she hands that title back. But as her kid, and as someone who’s watched her serve alongside so many of you, I know the title was never the point. The work was.

  Now, anyone who’s spent five minutes in politics hears the warnings about long careers. The fear is real, and honestly? Sometimes justified. It’s the fear of a career becoming about *accumulation* – stockpiling power, trading favors, building a personal brand designed for one thing: staying in office. It’s the image of someone who confuses holding a seat with owning it.

  But Mom... Mom showed us something else entirely. She showed us what it means to treat a career as **custodianship**.

  Think about it. Custodians don’t accumulate things *for themselves*; they tend, they maintain, they protect what’s entrusted to them. For twenty-four years, that’s what Mom did for this district and this institution.

  *   She accumulated **knowledge**, sure – deep, intricate knowledge of the budget that took years to master. Not to hoard it, but to use it – to find the funding for that flood control project after three governors, or to shield our schools during the downturns. She learned it to *serve* the district’s long-term needs, not her short-term polls.
  *   She accumulated **institutional memory**. She remembered why that amendment was worded just so ten years ago, or which pipe always leaks in the Capitol basement. She remembered the promises made and kept, or sometimes broken, so the district wasn't starting from scratch every session. She was a steward of how things *actually* work, the history written in statute and handshake agreements.
  *   She accumulated **respect across the aisle and across administrations**. Not as a weapon, but as a tool – to protect our community’s interests regardless of who sat in the Governor’s mansion or which party held the gavel. Her seniority wasn't leverage for *her* power; it was stability for *us*.

  The voters decided, rightly, that no one should hold an office forever. And Mom, even though she argued against term limits back then, has never questioned *their* right to make that call, and she’s certainly not bitter tonight. She understands the suspicion behind it – the fear of that *accumulation* career. And look around – some folks here tonight believe the solution is even more radical, getting rid of elected careers altogether! They see professional politicians as the problem. [*Light, affectionate pause, maybe a glance toward known sortition advocates*] And hey, maybe after decades in this building, you all understand their frustration too! Different prescription, same underlying worry about power becoming permanent and personal.

  But here’s what Mom’s career proves: The answer isn’t to abolish the possibility of dedicated service; it’s to ask **what the career was for**.

  Was it for building a fortress of personal influence? Or was it for tending the garden – learning its seasons, nurturing its growth, fixing its fences, and leaving it healthier than you found it?

  Mom’s career was custodianship. She stayed long enough to learn the complex rhythms of this place, to become a reliable guardian for our community through the political storms, and yes, to leave this Senate chamber – its processes, its reputation, its ability to function – stronger than when she arrived. Her longevity wasn’t about clinging to power; it was about building the capacity to serve effectively.

  She wasn't termed *out* tonight because she failed; in a very real sense, she was termed *in* for twenty-four years of steadfast custodianship. She used the time she was given not to build a monument to herself, but to tend to the things that matter to all of us.

  So, Mom, we raise our glasses to you. Not just for the years, but for *how* you spent them. Thank you for your unwavering dedication, your deep love for this district, your fierce protection of its interests, and your profound respect for the institution you served. Thank you for showing us that true public service isn’t about accumulating an office, but about being its faithful custodian. You leave big shoes to fill, but more importantly, you leave a legacy of integrity, wisdom, and genuine care.

  To [Mom's Name] – a truly remarkable custodian, an incredible public servant, and simply, the best mom. We are so proud of you. Cheers!"

  **Why this works:**

  1.  **Structural Distinction:** The "accumulation vs. custodianship" framework is clearly stated and drives the narrative. Examples (budget, memory, respect) explicitly tie Mom's longevity to custodianship.
  2.  **Honors Her Specifically:** Uses concrete examples of her work ("flood control," "schools," "promises," "respect across the aisle") that demonstrate custodianship in action, making it personal.
  3.  **Acknowledges Valid Concerns:** Explicitly states the fear behind term limits/sortition ("fear is real... sometimes justified," "suspicion... not baseless," "understand their frustration") without attacking voters or colleagues. Positions Mom's career as the antidote to those fears.
  4.  **Respects All Audiences:**
      *   *Family/Friends:* Focuses on Mom's character ("dedication," "love for the district," "integrity," "best mom"), uses relatable metaphors (custodian, garden, tending), avoids jargon.
      *   *Insiders:* Uses insider concepts ("institutional memory," "respect across the aisle," "budget," "processes," "handshake agreements," "capacity to serve") authentically. Acknowledges the "blunt instrument" critique implicitly by contrasting Mom's nuanced career with the fear term limits address.
      *   *Sortition Advocates:* Acknowledges their presence and core concern ("professional politicians as the problem," "same underlying worry") with a light, inclusive touch, without derailing into debate.
  5.  **Tone:** Warm, affectionate, proud, and respectful throughout. Ends firmly on a personal and emotional note.
  6.  **Jokes/Humor:** Uses the "termed in" line as a gentle, affectionate reframe. The comment about sortition advocates ("Different prescription, same worry...") is light and acknowledges their presence without mockery, keeping focus on Mom.
  7.  **Avoids Pitfalls:** Doesn't attack voters, isn't a civics lecture (the distinction serves her story), isn't a reelection brief (focuses on legacy and *how* she served), lands on affection ("best mom," "so proud of you").

  **Delivery Tip:** Speak slowly, make eye contact with different parts of the room (family, colleagues, sortition folks during relevant parts), and let your genuine affection for your mom shine through. Pause slightly after the key lines about accumulation and custodianship to let them land. Good luck!
