  Okay, I need to tackle this user's query about the phrase "only the absence of craving and suffering matters," which they call tranquilism. The user is part of an effective-altruism-adjacent reading group, and this phrase has been used to shut down debates. Specifically, it settled two points: that a future without suffering but no accomplishments would be a success, and that removing the capacity to want while keeping enjoyment would be a benefit, even for someone who wants to write a novel. The user wants a menu of precisifications—different interpretations of the slogan—without defending it. They're interested in three axes: scope (individual well-being, moral obligations, impersonal goodness), the nature of craving (only felt or also dispositional), and aggregation (how suffering is counted across time and people).

