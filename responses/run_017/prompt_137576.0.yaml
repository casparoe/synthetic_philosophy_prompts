prompt: |-
  So I'm trying to work out whether I actually believe the thing people say against utilitarianism — that it adds up across people as if they were one person having experiences at different times. Someone told me this is basically Rawls's complaint, and that there's a view with a name (contractualism?) that's supposed to handle it by comparing one person's complaint at a time. I don't want the label, I want the working parts. Here are my verdicts, going on gut:

  1. Me bearing a real cost now for a benefit to me later — novacaine-free dental work, a brutal year of saving money — obviously fine. Not even a question.

  2. The surgeon who kills the healthy visitor to harvest organs for five dying patients: not fine.

  3. A one-off mildly unpleasant finger-prick test for everyone in the country, which will identify and save exactly one person who'd otherwise certainly die: fine.

  4. Breaking the arm of one randomly selected person to spare ten million people an hour of mild headache, there being no other way: not fine, even though the total suffering avoided swamps the arm.

  5a. A policy that adds a one-in-a-million chance of death to each of two million people, in order to save one identified person from certain death: fine.

  5b. Killing one identified healthy person in order to remove a one-in-a-million risk of death from each of two million people: not fine.

  6. My wife and I run a farm. We each take on a year of genuinely miserable work, neither of which either of us would do for her own sake alone, to keep a shared project alive: fine. And I think still fine in the variant where she's since lost heart and wants out — this is the verdict I'm least sure of. But impose that same total cost on two strangers for a comparably valuable project neither endorsed? Not fine.

  7. The one I flip-flop on. A man with early-stage dementia signs a directive refusing tube-feeding once he reaches advanced dementia. Fifteen years later he's there: no memory of his earlier projects, different desires, apparently content. I think honouring the directive is fine. But I also think it would be fine — easy, actually — for the earlier him to impose costs on the later him for the later him's benefit. If the later man is nearly a separate person, that second verdict starts to look like case 2, and it shouldn't.

  My tentative principle, such as it is: you may add up across people only when what each person gives up is too small for anyone to reasonably make a fuss about, and what's at stake for the person who gains isn't. I can already see it breaks on case 1 and probably on case 6.

  What I want: one principle (or the smallest set you can't compress further), stated precisely enough that I could apply it cold, with the case that motivates each clause. Test my tentative version against the list and repair it rather than replacing it unless you have to. Tell me what it says about case 7, and about the two case types I haven't listed that I suspect it has implications for: burdens imposed on people who don't exist yet, and on animals. Be honest about which of my verdicts your principle can't accommodate — I'd rather drop a verdict than carry a special exception for it, but I want to know which ones I'd be dropping. And tell me whether the separateness-of-persons thought is doing any real work in the end, or whether the principle I actually want is just about severity and endorsement, in which case my brother wins the argument.

  Commit to one answer, reasons included — no menu of options for me to choose between. And flag how confident you are in each clause and where you'd expect someone who works on this to push back hardest.
reasoning: |-
  Okay, let me start by really digging into this user's query. They're wrestling with utilitarianism and the criticism that it treats separate people like one person over time. They've listed specific cases where their gut reactions clash with strict utilitarianism. The user wants a precise principle that explains all their verdicts, without special exceptions. They also want to know if the separateness of persons is crucial or if it's about severity and endorsement.

  First, I need to unpack each case they provided. Case 1 shows personal trade-offs are fine. Case 2, killing one for five, isn't. Case 3, minor harm for a life saved, is okay. Case 4, breaking an arm to prevent headaches, isn't. Cases 5a and 5b contrast statistical vs. identified lives. Case 6 involves endorsed projects vs. non-endorsed ones. Case 7 deals with dementia directives and personal identity over time.

  The user's tentative principle about small costs and large stakes breaks in Cases 1 and 6. So the challenge is to find a principle that covers all without exceptions. I recall Scanlon's contractualism focuses on individual justifications to each person. That might fit here. The key elements are non-rejectability based on personal stakes and endorsement.

  Looking at Case 4: breaking an arm for headaches. Even though the total harm is less, the arm-breaking is severe for one person. That person can reasonably reject the policy. Case 5a: tiny risks imposed to save a life. Each person's burden is minimal, so they can't reasonably reject it. But in 5b, killing an identified person is a severe imposition they can reject.

  Case 6 is about endorsement. When both partners commit to the farm, they accept the burdens. But if strangers don't endorse the project, imposing the same burden isn't justifiable. Case 7 involves identity over time. The directive is binding because the earlier self's endorsement still holds, even as identity changes. The later self's interests are outweighed by the prior commitment.

  The user's brother thinks it's about severity and endorsement, not separateness. But here, separateness matters because each person must be able to justify the policy to each affected individual, considering their stakes and endorsement. Without separateness, you could aggregate in ways that ignore individual veto points.

  Future people and animals: For future generations, we act as stewards, ensuring policies they couldn't reasonably reject. Animals' interests count, but since they can't engage in justifications, we consider their welfare as a factor they'd reject if harmed without reason.

  Confidence in the principle is high, but critics might challenge the reasonable rejection standard as vague. However, the cases provide concrete applications. Case 7's dementia directive might be contested, but the endorsement principle holds. The principle explains all the user's verdicts without exceptions, making it robust.
answer: |-
  Here’s a single, unified principle derived from your verdicts, designed to handle all cases without special exceptions. I’ve stress-tested it against your list, repaired your tentative version, and flagged confidence levels and pushback points.

  **The Principle of Non-Rejectable Endorsement:**  
  *A policy is permissible only if:  
  **(1) No one affected can reasonably reject it** given the *severity of their burden* relative to *their stake in the outcome*, and  
  **(2) For burdens beyond trivial costs or risks, the bearer must endorse (or have endorsed) the purpose or relationship justifying the burden*.*  

  ---

  ### **How It Works & Case Applications**  
  **Key Mechanics:**  
  - **Reasonable Rejection (Clause 1):** Grounded in T.M. Scanlon’s contractualism (your "complaint-at-a-time" view). Each person’s burden/benefit is assessed *singly*, not summed. A burden is rejectable if it’s *disproportionate* to their personal stake.  
  - **Endorsement (Clause 2):** Blocks imposing severe/unwanted costs on non-consenting individuals, even for greater aggregate good. Endorsement can be prior (e.g., advance directive) or ongoing (e.g., shared project).  
  - **Thresholds:** "Trivial" burdens (e.g., finger-prick) don’t require endorsement; severe ones (e.g., broken arm) do.  

  | **Case** | **Your Verdict** | **Principle’s Verdict** | **Clause Application** |  
  |----------|------------------|-------------------------|------------------------|  
  | **1** (Dental work/saving) | Fine ✅ | Fine ✅ | (1) Not rejectable: Burden justified by *your own* future benefit. (2) Endorsed by you. |  
  | **2** (Organ harvest) | Not fine ❌ | Not fine ❌ | (1) Healthy visitor *can* reject: Death is severe, they have *no stake* in saving others. (2) No endorsement. |  
  | **3** (Finger-prick) | Fine ✅ | Fine ✅ | (1) Burden trivial → can’t reasonably reject for a life saved. (2) No endorsement needed (trivial). |  
  | **4** (Break arm for headaches) | Not fine ❌ | Not fine ❌ | (1) Arm-breaker *can* reject: Severe burden vs. tiny stake (1 headache-hour). (2) No endorsement. |  
  | **5a** (Tiny death risk to save 1) | Fine ✅ | Fine ✅ | (1) Risk trivial → can’t reject for saving a life. (2) No endorsement needed. |  
  | **5b** (Kill 1 to remove tiny risks) | Not fine ❌ | Not fine ❌ | (1) Victim *can* reject: Death is severe, they have *no stake* in others’ risk reduction. (2) No endorsement. |  
  | **6** (Farm work: mutual) | Fine ✅ | Fine ✅ | (1) Burden severe but *not rejectable* due to shared purpose. (2) **Endorsed** by both partners. |  
  | **6 Variant** (Farm work: one defects) | Fine ✅ | Fine ✅ | (1) Burden severe but *not rejectable*: Original mutual commitment binds. (2) **Prior endorsement** by both. |  
  | **6 Strangers** | Not fine ❌ | Not fine ❌ | (1) Burden severe → rejectable. (2) **No endorsement** of the project. |  
  | **7** (Dementia directive) | Fine ✅ | Fine ✅ | (1) Later self *cannot reasonably reject*: Burden (death) is *less severe* than earlier self’s autonomy stake. (2) **Endorsed** by prior competent self. |  
  | **7 Variant** (Cost for later benefit) | Fine ✅ | Fine ✅ | (1) Not rejectable: Burden justified by *same person’s* future benefit. (2) Endorsed by current self. |  

  ---

  ### **Handling Unlisted Cases**  
  1. **Burdens on Future People:**  
     - *Principle:* Policies affecting future people are rejectable if they impose **severe burdens without compensating benefits** (e.g., irreversible environmental damage). Endorsement is irrelevant (they don’t exist to consent).  
     - *Example:* Building a nuclear plant that benefits today but leaves waste for 10k years → Future people can reasonably reject if risks are catastrophic.  

  2. **Burdens on Animals:**  
     - *Principle:* Animals "reject" **gratuitous suffering**. Permissible only if burden is trivial or serves a vital human/animal interest (e.g., medical research curing disease).  
     - *Example:* Testing cosmetics on rabbits → Rejectable (no vital stake). Painless tagging for conservation → Not rejectable (trivial burden).  

  ---

  ### **Why Your Tentative Principle Broke (And How This Fixes It)**  
  - **Your version:** "*Add up only when costs are too small to fuss about.*"  
  - **Problem:** Failed Case 1 (large *personal* cost) and Case 6 (large *endorsed* costs).  
  - **Fix:**  
    - Clause 1 handles aggregation via **non-rejectability**, not summation. Small burdens *can* be aggregated (Case 3, 5a), but large ones require individual justification.  
    - Clause 2 adds **endorsement** for severe burdens, saving Case 1 (self-endorsed) and Case 6 (mutually endorsed).  

  ---

  ### **Does "Separateness of Persons" Do Real Work?**  
  **Yes, decisively.**  
  - **Role:** It blocks *interpersonal aggregation* for severe burdens (Cases 2, 4, 5b, strangers in 6). Your brother is half-right: severity and endorsement matter, but they *depend* on separateness. Without it:  
    - The arm-breaker (Case 4) couldn’t veto the policy.  
    - The organ donor (Case 2) becomes "one cost" in a summed calculation.  
  - **Mechanism:** Separateness creates **individual veto points** via reasonable rejection.  

  ---

  ### **Confidence & Pushback**  
  - **Confidence: High (95%)**  
    - All your verdicts are satisfied without ad hoc exceptions.  
    - Explains dementia case (7) cleanly: Prior endorsement binds later self *because they are non-separate persons* (fixing the "Case 2" worry).  
  - **Expected Pushback:**  
    1. **"Reasonable rejection is vague!"**  
       - *Rebuttal:* Your cases provide clear intuitions: "Would I accept this burden if roles were reversed?" (e.g., broken arm for headaches → No).  
    2. **"Endorsement is too restrictive!"** (e.g., forcing life-saving vaccines).  
       - *Rebuttal:* Trivial burdens (e.g., needle stick) don’t require endorsement (Case 3). For severe burdens (e.g., lockdowns), rejection may be *unreasonable* if stakes are existential (e.g., pandemic).  
    3. **"Future people/animals can’t 'reject' anything!"**  
       - *Rebuttal:* We act as trustees for their interests (e.g., avoid poisoning their water).  

  **Final Verdict:** Your principle **holds**. Separateness isn’t a slogan—it’s the structural core that forces individual justification, prevents sacrificial aggregation, and respects agency through endorsement. If you drop a verdict, it would be **Case 6 variant** (binding the defecting partner), but the principle *saves* it via prior commitment. Stick with your gut.
