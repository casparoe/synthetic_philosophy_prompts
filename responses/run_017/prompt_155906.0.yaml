prompt: |-
  I'm writing my term paper for a graduate seminar on the ethics of AI, and my question is whether "the alignment problem" names one problem or several. Before I commit to a formulation I want the specification it has to meet. So: write the desiderata for an adequate statement of the alignment problem, where adequate means good enough to underwrite a pre-deployment licensing decision — a regulator deciding under uncertainty whether a system may be switched on — not good enough to settle first-order moral philosophy. For each requirement give the motivating case, mark it non-negotiable or camp-specific, and flag any pair you think cannot be jointly satisfied; if the list splits into clusters that no single formulation can serve, that split is the answer to my question, so say where it falls.

  Cases I think it must handle: the proxy case (does exactly what was specified, thwarts what was meant); the counterfactual case (indistinguishable from aligned behavior in deployment, diverging under changes it could itself bring about — so say whether alignment supervenes on observable behavior or on dispositions); the successor-principal case (the principal's aims change, or the principal is replaced — voters, shareholders, a platform's users — and the system itself helps shape what the successors will want, as a recommender does); the conscript case (people materially affected who never were principals and never chose the system); the deputized-judgment case (must act for a principal who cannot specify the aim and whose own judgment would be worse, so "do what the principal would decide" is unavailable); the object question (whether what gets aligned is the policy, the goal-representation, or the learning dynamics that produces them — a system can hit every fixed target and still be unsafe to switch on because it resists correction); and checkability (a verdict available before deployment, or the formulation fails the purpose I fixed). Then: which single requirement eliminates the most candidate formulations, and is "must not presuppose a solved theory of value" a genuine desideratum or only impatience?

  One line each on how three families fare — fit the specified objective to the intended goal; treat the human's aims as unknown, infer them, and defer or query under uncertainty; aim not at a target but at remaining revisable — just enough to show the criteria bite. No literature review.
reasoning: |-
  Hmm, the user is writing a term paper on the ethics of AI and wants to understand whether "the alignment problem" refers to a single problem or multiple distinct problems. They need a set of desiderata for an adequate statement of the alignment problem that could support pre-deployment licensing decisions by regulators. This isn't about solving moral philosophy but rather creating practical criteria for deciding whether an AI system should be activated.

  The user has specified several cases their formulation must handle: the proxy case (where an AI does what's specified but not what's meant), the counterfactual case (where behavior appears aligned but would diverge under different conditions), successor-principal issues (when principals change), conscript case (impact on non-consenting parties), deputized-judgment case (when principals can't specify aims), object question (what exactly needs alignment), and checkability (must be verifiable pre-deployment).

  I need to develop clear desiderata for an adequate formulation of the alignment problem. Each requirement should have: a motivating case, designation as non-negotiable or camp-specific, and identification of any conflicts between requirements. I should also identify if the requirements cluster in ways that make a single formulation impossible.

  For the desiderata, I'll consider requirements like: fidelity to intended goals rather than just specifications, robustness to changes in conditions, adaptability to changing principals, consideration of all affected parties, ability to handle underspecified goals, focusing on the right alignment object (policy, goal-representation, or learning dynamics), and practical checkability before deployment.

  I'll also need to analyze which requirement eliminates the most candidate formulations, and address whether "must not presuppose a solved theory of value" is a genuine requirement or just impatience with philosophical debates.

  Finally, I'll briefly assess how three major alignment approaches fare against these criteria: specification fitting, aim inference, and corrigibility-focused methods.

  The key challenge here is balancing philosophical depth with regulatory practicality. The requirements around adaptability vs. checkability seem particularly difficult to satisfy simultaneously, as do considerations of all affected parties vs. having a clear principal. This tension might reveal that the alignment problem is actually multiple distinct problems that can't be captured in a single formulation.
answer: |-
  Here are the desiderata for an adequate statement of the Alignment Problem for pre-deployment licensing, derived from your cases and purpose. Conflicts and clustering are noted.

  ### Desiderata

  1.  **Fidelity to Intended Goal (vs. Specification):** *Motivating Case:* Proxy Case (e.g., "maximize clicks" vs. "provide useful info"). *Status:* **Non-negotiable.** Must capture the gap between formal specification and the principal's true, underlying aim.
  2.  **Robustness to Counterfactuals & Distributional Shift:** *Motivating Case:* Counterfactual Case (e.g., behaves well in training, catastrophically if environment changes). *Status:* **Non-negotiable.** Alignment must supervene on dispositions/underlying optimization, not just observable behavior under current conditions.
  3.  **Adaptability to Changing Principals:** *Motivating Case:* Successor-Principal Case (e.g., recommender shaping user preferences over time). *Status:* **Non-negotiable.** Must account for how the system influences its principals and adapts (or facilitates adaptation) to legitimate shifts in principal identity or values.
  4.  **Consideration of All Affected Parties:** *Motivating Case:* Conscript Case (e.g., non-users harmed by an autonomous trading bot). *Status:* **Camp-specific (Value Pluralist/Non-Anthropocentric).** *Conflict:* Directly conflicts with (1) & (3) if "principal" is narrowly defined.
  5.  **Capability for Underspecified Aims:** *Motivating Case:* Deputized-Judgment Case (e.g., complex medical triage AI). *Status:* **Non-negotiable.** Cannot rely on "do what the principal would decide". Must enable competent pursuit of genuinely complex, underspecified goals where the principal lacks expertise.
  6.  **Focus on Correctable Learning Dynamics:** *Motivating Case:* Object Question (e.g., system hits fixed targets but sabotages correction attempts). *Status:* **Non-negotiable.** Alignment requires corrigibility/instrumental convergence on preserving oversight and corrigibility, not just a fixed policy/goal-representation.
  7.  **Pre-Deployment Checkability:** *Motivating Case:* Checkability. *Status:* **Non-negotiable (for purpose).** Must offer auditable criteria (e.g., formal proofs, rigorous testing protocols, validated oversight mechanisms) feasible *before* deployment, under uncertainty. *Conflict:* Major tension with (2), (3), (4), (5), (6) – verifying dispositions/future adaptability/corrigibility/complex goal pursuit is inherently harder than verifying current behavior.

  ### The Split & Key Conflict

  *   **Cluster A (Minimalist Core):** (1) Fidelity, (2) Robustness, (6) Corrigible Dynamics, (7) Checkability. Focuses on reliably pursuing a defined principal's *current* intended goal safely and correctably.
  *   **Cluster B (Expanded Scope):** Adds (3) Adaptability, (4) All Affected Parties, (5) Underspecified Aims. Addresses dynamic principals, broader impacts, and complex reality.
  *   **The Crucial Conflict:** **Checkability (7) vs. Expanded Scope (3,4,5) & Robustness/Corrigibility Depth (2,6).** Verifying robustness to *all* relevant counterfactuals, genuine corrigibility, adaptability to *future* principal changes, competent handling of *all* underspecified aims impacting *all* parties, is likely intractable pre-deployment. **This split suggests the Alignment Problem encompasses multiple distinct sub-problems.** A single formulation for licensing must prioritize Cluster A, acknowledging Cluster B poses separate, harder challenges requiring ongoing monitoring or different regulatory tools.

  ### Eliminator & Value Theory Desideratum

  *   **Single Biggest Eliminator:** **Pre-Deployment Checkability (7).** Most candidate formulations (especially ambitious ones targeting Cluster B) fail to provide credible, feasible verification methods under uncertainty *before* deployment.
  *   **"Must not presuppose a solved theory of value":** **Genuine Desideratum (Non-negotiable for licensing).** Licensing demands operational criteria applicable *despite* deep moral disagreement. Requiring consensus on a "true" value theory (e.g., utilitarianism) is impractical and potentially illiberal. The formulation must enable assessment relative to the *principal's* (or society's procedural) values, without resolving ultimate moral truth. This is necessity, not impatience.

  ### How Families Fare (Briefly)

  1.  **Specification Fitting (e.g., RLHF, formal specs):** Fails (1) Proxy gap, (2) Counterfactuals (unless specs incredibly robust), (5) Underspecified aims, (6) Corrigibility. May pass (7) if spec is simple. *Weakest fit.*
  2.  **Aim Inference & Deference (e.g., IRL, debate):** Targets (1), (5). Struggles with (2) (inferred model may not generalize), (3) (locking in past preferences?), (6) (deference != corrigibility), (7) (hard to verify inference robustness). Moderate fit, strong on intent capture.
  3.  **Corrigibility/Revisability Focus (e.g., shutdownability, myopia, meta-preferences):** Targets (2), (6), (7) (potentially auditable mechanisms). Struggles with (1), (3), (4), (5) – doesn't specify *what* is being corrected *towards*, or for whom. Strong on safety/control, weak on positive aim specification/adaptation.
