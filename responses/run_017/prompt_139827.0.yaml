prompt: |-
  Hey — I'm mid-way through the third chapter of my diss (STS, on how automation gets narrated in two centuries of labour-movement writing) and I keep loosing the thread whenever I try to say what a Marxist account of automation would even have to *do* to count as adequate. Everyone reaches for the same two or three passages, then jumps straight to a verdict about AI, and I can't tell anymore whether the disagreements are about facts or about what the theory is for. So help me write the spec, not the verdict.

  Fix the purpose first, and fix it narrowly: I want a theory good enough to advise a union federation that has to decide, about one specific new technology in one specific sector, whether to fight its introduction, demand a shorter week alongside it, or welcome it. Not a philosophy of history — a theory for a decision. Under that purpose, give me the list of desiderata, each with the case or consideration that makes it a requirement, and each tagged load-bearing / nice-to-have / camp prejudice.

  Things I think are in the running as requirements, which you should sift rather than just ratify:

  - it has to distinguish machinery as such from machinery under capitalist relations, without that distinction becoming an excuse for saying nothing predictive;
  - it has to generate, from one mechanism, both the displacement of labour and the creation of new tasks that pull labour back in — i.e. the same story should be able to produce a shrinking and a growing demand for the same kind of worker;
  - it has to handle automation introduced primarily for control rather than productivity: the case where a machine is installed at a net output loss because it breaks a craft's grip on the pace and content of work;
  - it has to handle what I'd call the apprenticeship cliff: automation removes the low-level work through which a skill is transmitted, everything looks fine for a generation, and then the tacit knowledge needed to maintain and repair the system is simply gone and the productive force itself decays. Does a theory of automation need to be able to represent a productive force that deteriorates, or is that a separate story about education?
  - it has to handle phantom automation: capital is invested in the *credible announcement* of automation, workers concede on work rules and pay, and the machines partly or never arrive. Is a theory that only tracks materially realised automation adequate, given that the political effects occur anyway?
  - it has to handle captive time: automation frees ninety minutes a day, and the ninety minutes are reabsorbed as unpaid standby, on-call availability, and fragmented attention, so the time exists but isn't free. Can the theory count that as intensification, or does its notion of freed time only track the formally contracted day?
  - it has to handle the refused machine: a workforce, through its own organisation, demands that dangerous or humiliating labour be mechanised, and capital declines because the labour is cheaper than the machine. Whose instrument is automation meant to be here?
  - it has to handle fictitious machinery: the system presented as automating a task is, behind an interface, a crowd of underpaid people doing it. If the theory can't tell the difference, its concept of machinery isn't doing any work.
  - it has to say what would count as the emancipatory upshot — shorter working time, worker control over the design and pacing of the technology, or simply more goods — and take a stand on whose judgement settles it;
  - it has to stay consistent with the boring background facts: long-run real wage growth, no collapse in aggregate employment, occupational polarisation, long stretches where heavy investment in information technology produced disappointingly little measured productivity growth;
  - it has to handle the global dimension, where automation in one region throws a workforce in another into superfluity, or conversely makes offshoring unprofitable;
  - and it has to be able to say something about the *discourse* — why both enthusiasm and panic about automation recur on schedule — without that something collapsing into "they've been duped."

  Some of those I suspect are just things one sub-literature wants rather than genuine requirements. I'm thinking especially of the demand that any technology raised to the status of a productive force must also be describable as a fresh act of dispossession, and the demand that the forces of production never be allowed to be the engine of the story. If I've misidentified which ones are the prejudices, say which and why — that sorting is half of what I want.

  Then the part I care most about: name the subset of the load-bearing requirements that you think cannot be jointly satisfied, and show it. My own hunch is that there's a real incompatibility between "generate displacement and reinstatement from a single mechanism" and "be usable for a decision about one technology in one firm," because the first operates at the level of the system and the second at the level of a workplace, and I'm not convinced the bridge between them is licit. But if the actual contradiction is somewhere else, argue for that instead.

  Also: which single requirement does the most exclusionary work — the one that, if you dropped it, lets back in a reading you think is clearly inadequate? And if you want, a short scorecard at the end: a few lines each on the productivist reading (automation as the material preparation for something better), the labour-process and deskilling reading, the general-intellect and immaterial-labour reading, and the convivial-tools or neo-Luddite one. Only if it doesn't eat the space — the list is the deliverable, and no reading lists or citations, I've got the canon and I can't look anything up from where I'm sitting.
reasoning: |-
  Okay, the user is working on their dissertation in Science and Technology Studies (STS), focusing on how automation is portrayed in labor-movement writings over two centuries. They're stuck in the third chapter, trying to define what makes a Marxist account of automation adequate. They want to avoid the common pitfall of using the same few Marx passages and jumping to verdicts on AI. Instead, they're looking for a practical theory to help a union federation decide how to respond to a specific technology in a specific sector—whether to fight it, demand shorter work weeks, or welcome it.

  The user has listed several potential requirements for such a theory, but they're unsure which are essential and which might be biased or unnecessary. They mentioned things like distinguishing machinery from capitalist relations, explaining both job displacement and creation, handling control-focused automation, and more. They suspect some points might be influenced by specific sub-literatures rather than being core needs.

  Their main request is to sift through these requirements, categorize them as load-bearing, nice-to-have, or camp prejudices, and identify any that conflict. They also want to know which requirement is most exclusionary and a brief scorecard of different readings like productivist, deskilling, etc.

  The user's deeper need seems to be clarity and focus. They're overwhelmed by theoretical debates and want a streamlined framework that's actionable for unions. They might also be seeking validation of their hunch that there's an incompatibility between system-level mechanisms (like displacement and reinstatement) and workplace-level decisions. This suggests they need help bridging theory and practice in a way that's coherent for their dissertation.

  I need to assess each requirement critically. For example, distinguishing machinery from capitalist relations is fundamental in Marxism, so it's load-bearing. But the demand that productive forces can't drive the story might be a camp prejudice from certain readings that overemphasize social relations. The apprenticeship cliff might be a separate education issue, not core to automation theory. Phantom automation relates to discourse effects, which are crucial for STS, so it's load-bearing.

  The key conflict is likely between the systemic mechanism (requirement 2) and the single-technology focus (implicit in the purpose). Marxism explains displacement and reinstatement through capital's need for relative surplus value and counter-tendencies like new industries. But this operates across the whole economy over time, making it hard to apply to one firm or sector. For instance, a union can't predict if job losses in their factory will be offset by new jobs elsewhere. So that incompatibility is real and critical.

  The most exclusionary requirement is probably about distinguishing machinery from capitalist relations. If dropped, it collapses into technological determinism, ignoring how social relations shape outcomes. That's inadequate for advising unions because it misses why the same tech can have different effects under different ownership or control.

  For the scorecard: Productivist views see automation as progress but often ignore control aspects. Labor-process theory focuses on deskilling and control but can be too micro. General intellect ideas highlight knowledge economies but may overstate emancipation. Neo-Luddite views prioritize worker dignity but risk rejecting tech that could reduce drudgery.

  In summary, the user needs a theory that's practical, avoids grand narratives, and addresses both material and discursive aspects of automation, with clear trade-offs for union decisions. Highlighting the system-vs-workplace tension and the exclusionary role of the capitalist relations distinction will strengthen their argument.
answer: |-
  Here’s a purpose-driven specification for a Marxist theory of automation, designed to advise union federations on tactical decisions about *specific technologies in specific sectors*. Requirements are sifted, tagged, and assessed for conflicts.  

  ### **Core Purpose**  
  A theory must enable unions to:  
  1. **Predict** likely outcomes (jobs, skills, power) of adopting a *specific* technology in a *specific* sector.  
  2. **Identify strategic leverage points** (e.g., demand shorter weeks vs. resist adoption).  
  3. **Avoid systemic overreach** (no philosophy of history; actionable for workplace-level decisions).  

  ---

  ### **Desiderata & Tags**  
  *(Load-Bearing = Essential for purpose; Nice-to-Have = Enriches but not core; Camp Prejudice = Ideological baggage)*  

  1. **Distinguish machinery *as such* from *capitalist deployment* (Load-Bearing)**  
     - *Why essential*: Unions must know if harm stems from the tech or its use. Predictions fail if conflated (e.g., "robots cause unemployment" ignores how ownership shapes outcomes).  
     - *Avoids*: Technological determinism.  

  2. **Generate displacement *and* reinstatement from one mechanism (Load-Bearing, but conflicted)**  
     - *Why essential*: Unions need to assess net job impact. A theory that only predicts job loss (or gain) is useless for tactics.  
     - *Conflict*: Mechanism (e.g., rising organic composition of capital + new needs) operates *systemically*, not predictably at firm/sector level (see **Key Incompatibility** below).  

  3. **Handle automation for *control* over productivity (Load-Bearing)**  
     - *Why essential*: Common in labor history (e.g., CNC machines breaking machinists’ control). Unions must recognize when tech is a weapon against worker power, not efficiency.  

  4. **Handle the apprenticeship cliff (Nice-to-Have)**  
     - *Why not essential*: Skill erosion is a *long-term* education/training failure. For a union’s *immediate* decision, it’s a risk factor, not a predictive requirement.  

  5. **Handle phantom automation (Load-Bearing)**  
     - *Why essential*: Capital’s *threat* of automation forces concessions (e.g., Amazon’s "automation tax"). A theory ignoring discourse fails tactically.  

  6. **Handle captive time (Load-Bearing)**  
     - *Why essential*: "Freed" time reclaimed as unpaid labor (e.g., algorithmic scheduling) is a common outcome. Unions need to spot hidden intensification.  

  7. **Handle the refused machine (Load-Bearing)**  
     - *Why essential*: Exposes power dynamics. If workers demand automation for safety but capital refuses, the theory must explain *why* (e.g., cheap labor > machinery costs).  

  8. **Handle fictitious machinery (Load-Bearing)**  
     - *Why essential*: "AI" powered by clickworkers obscures exploitation. Unions must differentiate real automation from outsourcing disguised as tech.  

  9. **Define emancipatory upshot *and* whose judgment counts (Load-Bearing)**  
     - *Why essential*: Unions need a benchmark for "winning." Is it shorter hours? Worker control? Must center *workers’* judgment (not capitalists’ or theorists’).  

  10. **Consistency with boring background facts (Load-Bearing)**  
      - *Why essential*: A theory predicting collapse (e.g., mass unemployment) despite wage growth/occupational polarization is unreliable for decisions.  

  11. **Handle global dimensions (Nice-to-Have)**  
      - *Why not essential*: For a *sector-specific* union, global spillovers (e.g., offshoring) are strategic context, not core to the tech-assessment mechanism.  

  12. **Explain automation discourse without "duped" (Load-Bearing)**  
      - *Why essential*: Recurring hype/panic affects worker morale and bargaining. Theory must explain material roots (e.g., capital’s need for legitimacy/crisis displacement).  

  ---

  ### **Camp Prejudices to Reject**  
  - **"Productive forces must be framed as dispossession"**  
    *Why prejudice*: Overextends "accumulation by dispossession" to every innovation. Not all automation displaces (e.g., adds jobs); conflates control with expropriation.  
  - **"Forces of production can’t drive the story"**  
    *Why prejudice*: Dogma from "social construction of technology" camps. In practice, tech *enables* new forms of exploitation (e.g., gig apps). Rejecting this neuters predictive power.  

  ---

  ### **Key Incompatibility**  
  **Requirement #2 (single mechanism for displacement/reinstatement) conflicts with workplace-level decision-making.**  
  - *Why*:  
    - Displacement/reinstatement arises from *systemic* dynamics:  
      - Displacement: Capital seeks labor-saving tech to lower costs.  
      - Reinstatement: New industries/tasks emerge from cheapened inputs, rising demand, or tech maintenance needs.  
    - **But**: These operate across *total capital*, over *decades*. A union assessing one tech in one firm can’t predict if reinstatement will occur *in their sector* or for *their workers*.  
  - *Result*: A theory satisfying #2 can only advise unions to "wait for systemic reinstatement" — useless for their decision. **Drop systemic reinstatement as a requirement.** Replace with:  
    - *Load-Bearing Alternative*: Predict *local* effects (e.g., job loss in *this* factory) + identify *compensatory mechanisms* unions can demand (e.g., retraining, shorter hours).  

  ---

  ### **Most Exclusionary Requirement**  
  **#1 (Distinguish machinery from capitalist relations).**  
  - *Why*: Dropping this collapses Marxism into techno-optimism/pessimism. Automation’s effects *only* become predictable when tied to:  
    - Who owns/controls the tech?  
    - Does it deskill or reskill?  
    - Who captures productivity gains?  
  - Without this, theory can’t explain why identical tech can empower workers (e.g., co-ops) or exploit them (e.g., Amazon warehouses).  

  ---

  ### **Scorecard of Major Readings**  
  1. **Productivist (e.g., orthodox Marx)**  
     - *Strengths*: Best on systemic displacement/reinstatement; clear on forces/relations distinction.  
     - *Gaps for purpose*: Ignores control; assumes automation is progressive; weak on discourse/captive time.  

  2. **Labour-Process/Deskilling (e.g., Braverman)**  
     - *Strengths*: Explains control-motivated automation; captive time; skill erosion.  
     - *Gaps*: Over-predicts deskilling; misses job creation; ignores global dimensions.  

  3. **General Intellect/Immaterial Labor (e.g., Negri)**  
     - *Strengths*: Handles discourse, fictitious machinery, "knowledge" automation.  
     - *Gaps*: Unmoored from material outcomes; ignores boring facts (e.g., wage stagnation); vague on tactics.  

  4. **Convivial Tools/Neo-Luddite (e.g., Illich, Sale)**  
     - *Strengths*: Best on refused machines/emancipatory upshot; centers worker dignity.  
     - *Gaps*: No predictive mechanism; ignores capital’s coercion (e.g., phantom automation).  

  ---

  ### **Final Spec**  
  A Marxist theory for union decisions must:  
  1. Explain how *this specific tech* will be used under *local capitalist relations* (ownership, labor market, worker power).  
  2. Predict *local* job/skill impacts (not systemic reinstatement).  
  3. Account for control motives, captive time, phantom automation, and fictitious machinery.  
  4. Define emancipation by workers’ terms (shorter hours, control, safety).  
  5. Ground discourse in material interests (without "duped").  
  6. Stay consistent with long-run trends (wage growth, no collapse).  

  **Drop**: Systemic reinstatement, apprenticeship cliff, global spillovers as *requirements* (retain as contextual factors).  
  **Core Conflict Resolved**: Focus on local displacement + tactical levers (e.g., bargaining for gainsharing), not abstract systemic redemption.
