prompt: |-
  I have taught a graduate seminar on reference and singular thought for a number of years, and over that time I have kept — and periodically revised — a list of identity statements together with my own verdicts about which of them are informative. By informative I mean: a statement that a speaker can fully understand, using both of its terms with perfect competence, while still rationally treating as an open question, and about which she can learn something by coming to accept it. My verdicts no longer look to me like the output of any single principle, and my own attempts to impose one have all felt ad hoc. I would like to know whether they can be captured by one, and at what cost.

  The list, with my verdicts.

  1. *The evening star is the morning star.* Informative. Someone entirely competent with both expressions, and familiar with the sky, can wonder whether it is true; coming to accept it is an empirical discovery.

  2. *The evening star is the evening star.* Empty. Knowable in advance by anyone who understands the term; someone who professed to doubt it would thereby betray that he had not understood it.

  3. *Cicero is Tully.* Informative, and in the same way as (1): an a posteriori discovery, biographical rather than astronomical.

  4. *Water is H₂O.* Informative — but if true, necessarily so. So informativeness cannot consist in learning a contingent fact about the world.

  5. *The sum of the interior angles of a Euclidean triangle equals two right angles.* Informative for a student who has not seen the proof, and yet a priori: no observation, and no discovery about which things there are, settles it.

  6. *Two labels from one briefing.* A police officer tells me in a single breath that the man I am looking for answers to 'Slim' and also to 'the Weasel'; I have no other information about him. For me, 'Slim is the Weasel' is as empty as (2). This is so despite the two terms being orthographically and phonologically distinct, and despite my not having known, before the briefing, whom either of them names.

  7. *One encounter, two sortals.* I stand before a cast bronze statue, knowing nothing of how it was made. 'This statue is this lump of bronze,' with both demonstratives directed at the same object in the same perceptual episode, is informative: I learn something. No possible observation settles it, and I am inclined to call it a conceptual rather than an empirical discovery. Yet it is hard to see that I have two presentations of the object at all — one look, one object, two sortals. I take (6) and (7) to be the pair my list turns on, and I do not have a principled account of why they differ.

  8. *Belief contexts, first version.* A subject sincerely assents to 'He can fly' when the name used is one, and sincerely dissents when it is the other, and would also deny the identity of the two. Here the failure of substitutivity in attitude ascriptions and the informativeness of the identity statement travel together.

  9. *Belief contexts, second version.* A subject has encountered the same name in two quite separate corners of his life and would, if asked whether the two are one person, refuse to answer. The case seems to me the same as (8). But here there is no difference in his information about the referent that he could state without using the name itself — there is nothing, that is, that he believes of the one that he denies of the other, under any description available to him.

  10. *One source, two channels.* A colleague is in a room, on the telephone, describing to me the one man in it; I am watching a monitor fed by a camera in that same room. I have no descriptive information about the man at all. 'The man you are watching is the man I am describing' is informative to me: I can check it, and until I do I do not know it. But the two terms differ neither in descriptive content (I have none) nor, as far as I can tell, in the causal route by which they are anchored — both are anchored by perception of the same object, his and the camera's. All that differs is which perceiver's link fixes which term. If informativeness tracks something about how a subject is related to a referent, this case suggests the relation in question is finer-grained than either a description or a chain.

  Two further cases I cannot settle. First: 'I am this human animal,' said by an ordinary adult while looking in a mirror. Part of me hears it as empty in the way (2) is; part of me hears it as informative in the way (7) is. Second: I was once told, in a single breath, that the author of certain letters signed himself both 'A' and 'B'; I have entirely forgotten this, but I retain both names and a good deal of information about the man. Is 'A is B' informative for me now, and is its informativeness the same phenomenon as in (1), or merely my ignorance of what I was once told? I take the answer here to depend on whether the relevant notion is a property of the terms or of a subject's current informational state, and I do not know which to say.

  What I want is a principle, or a small set of candidate principles, stated precisely enough that I can test it against cases I have not thought of — not a survey of the familiar answers to the puzzle about identity statements, and not an account of who has defended what. Specifically:

  (a) the principle itself, with an indication of which clause is forced by which case on my list, and especially what distinguishes (6) from (7);

  (b) an explicit statement of which of my verdicts the principle cannot accommodate, and why I should abandon those verdicts rather than add a clause to save them;

  (c) whether informativeness, on your account, is a property of the sentence, of the pair of terms, or of the sentence together with a subject and the information she has — and, on the last option, whether my verdicts in (1) and (10) survive the relativization;

  (d) whether the substitution failures in (8) and (9) are the same phenomenon as the informativeness in (1) through (5), or whether a single account must treat them as separate and say where the boundary falls;

  (e) verdicts on my two unsettled cases; and

  (f) one prediction of your own: a case of a kind my list does not contain, with what your principle says about it.

  If no single principle is available, say so plainly, and say what the phenomenon should be split into and where the dividing lines lie.
reasoning: |-
  Okay, the user is a philosophy professor teaching a graduate seminar on reference and singular thought. They've maintained a list of identity statements with their own judgments about which are informative. They're struggling to find a unifying principle and want help developing one that can explain all their cases, especially the tricky pairs like (6) and (7).

  Hmm, their definition of "informative" is quite precise: a statement fully understood by a competent speaker who can still rationally treat it as an open question and learn from accepting it. This rules out trivial tautologies but includes necessary a posteriori truths like (4) and a priori discoveries like (5). 

  The real puzzlers are:
  - Case (6) where two names given simultaneously ("Slim"/"Weasel") feel uninformative like a tautology
  - Case (7) where two sortals for the same perceptual object ("statue"/"lump") remains informative
  Both involve immediate co-reference introduction, yet yield opposite verdicts. I need to explain this asymmetry.

  Looking at existing frameworks... Frege's sense/reference distinction might handle some cases but fails for (6) where distinct names share cognitive significance upon introduction. Perry's unarticulated constituents could explain (10)'s informativeness through perceptual perspectives. But nothing fully captures the (6)/(7) divide.

  Ah! What if we distinguish between:
  1. Epistemic routes: how information enters cognition
  2. Modes of presentation: how objects are conceptualized

  In (6), both names enter via identical route (single briefing), creating no cognitive gap. But in (7), "statue" and "lump" represent distinct conceptual categories despite identical perception. The material sortal vs. artifact sortal carry different persistence conditions - that's why learning their identity teaches something about constitution.

  For the unsettled cases:
  - "I am this human animal" likely informative due to distinct modes: indexical self-concept vs. biological kind
  - The forgotten "A/B" case depends on whether the original co-reference established a unified epistemic file - probably not, since forgotten, so remains informative

  The substitution failures in (8)/(9) stem from the same cognitive gap that makes identity informative, so should get a unified treatment. 

  My proposed principle: Informativeness arises when a subject employs two distinct cognitive files for one referent, where files are distinct if they either (a) originate from separate epistemic routes, or (b) employ incompatible conceptual modes despite shared origin.

  Testing against their list:
  - (1)/(3): Separate routes (astronomical/mythological; historical records)
  - (2): Identical file
  - (4): Separate conceptual modes (phenomenal vs. microstructural)
  - (5): Separate derivation paths in reasoning
  - (6): Single epistemic route → identical file
  - (7): Single route but distinct conceptual modes → distinct files
  - (10): Separate perceptual perspectives → distinct routes

  The cost? We must accept that informativeness is subject-relative and file-dependent. But this saves all their verdicts while explaining the (6)/(7) asymmetry through the conceptual mode dimension.

  For a new test case: "Hesperus is Phosphorus" said to Babylonians who used both names for years without connecting them. Principle correctly predicts informativeness due to separate astronomical traditions maintaining distinct files.
answer: |-
  Below is a systematic principle designed to capture your verdicts on informativeness, grounded in the **cognitive dynamics of mental files**. The core idea is that informativeness arises when a subject employs *two distinct mental files* for a single referent, where files are distinct if they either (a) originate from separate *epistemic routes*, or (b) employ incompatible *conceptual modes* (e.g., sortals, categories, or functional roles) despite sharing an origin. Informativeness is relativized to a subject’s current informational state and cognitive architecture, not merely the terms or sentence.  

  ### The Principle  
  **A statement "a is b" is informative for subject S iff:**  
  - S possesses two distinct mental files, F₁ (for a) and F₂ (for b);  
  - F₁ and F₂ are *not unified* in S’s cognitive system (i.e., S has not integrated them into a single file);  
  - The distinctness of F₁ and F₂ stems from either:  
    - **(i) Separate epistemic routes**: F₁ and F₂ were anchored via causally or informationally independent channels (e.g., perception, testimony, inference), *or*  
    - **(ii) Divergent conceptual modes**: F₁ and F₂ employ incompatible sortals, categories, or persistence conditions, even if anchored identically.  

  **Unification** occurs when S has positively linked F₁ and F₂ (e.g., via inference, testimony, or perception), merging them into one file.  

  ---

  ### Application to Your Cases  
  | Case | Your Verdict | Principle’s Explanation | Distinguishing Features |  
  |------|--------------|--------------------------|--------------------------|  
  | **1. Evening star/Morning star** | Informative | Separate epistemic routes: astronomical observations at different times. | Independent anchoring events create distinct files. |  
  | **2. Evening star/Evening star** | Empty | Identical file used twice; no distinct files exist. | Trivial identity: no cognitive gap. |  
  | **3. Cicero/Tully** | Informative | Separate epistemic routes: historical/cultural sources. | Analogous to (1). |  
  | **4. Water/H₂O** | Informative | Divergent conceptual modes: "water" (phenomenal) vs. "H₂O" (microstructural). | Necessity irrelevant; distinct modes create cognitive gap. |  
  | **5. Triangle angles** | Informative | Separate epistemic routes: geometric intuition vs. proof-based derivation. | A priori because unification occurs via reasoning, not experience. |  
  | **6. Slim/Weasel (one briefing)** | Empty | Single epistemic route (simultaneous testimony) creates one unified file. | No cognitive gap; immediate unification. |  
  | **7. Statue/Lump (one look)** | Informative | Divergent conceptual modes: "statue" (artifact) vs. "lump" (material) imply different persistence conditions. | *One route, but distinct modes*: explains difference from (6). |  
  | **8. Belief contexts (v1)** | Informative | Separate files due to divergent belief-based modes (e.g., "flyer" vs. "non-flyer"). | Substitutivity failure arises from file distinctness. |  
  | **9. Belief contexts (v2)** | Informative | Separate files due to independent epistemic routes (isolated life-contexts). | No descriptive difference needed; file separation suffices. |  
  | **10. Man on monitor/phone** | Informative | Separate epistemic routes: visual (camera) vs. auditory (testimony) channels. | Differing perceptual perspectives create distinct files. |  

  **Key Distinction: (6) vs. (7)**  
  - **(6)**: Single briefing → single epistemic route → immediate unification → empty.  
  - **(7)**: One perceptual route, but *divergent conceptual modes* (statue vs. lump) → files remain distinct → informative.  
    - Cost: Accepts that sortal concepts (e.g., artifact vs. material) are built into mental files, affecting informativeness even with identical perception.  

  ---

  ### Costs and Unavoidable Revisions  
  Your verdicts are fully preserved *except* for minor adjustments:  
  - **No revisions needed**: The principle captures all cases (1)–(10) as-is.  
  - **Costs**:  
    - **Subject-relativity**: Informativeness is not a property of sentences or term-pairs alone, but of *S’s current mental file architecture*. This relativizes your verdicts (e.g., (1) and (10) hold only for subjects with distinct files).  
    - **Conceptual modes as primitive**: The account relies on irreducible differences in conceptual content (e.g., sortals), which may feel ad hoc but is necessitated by (7).  
    - **Unification as dynamic**: Files can merge via testimony (as in (6)), reducing informativeness.  

  ---

  ### Answers to Specific Queries  
  **(a) Principle clauses forced by cases:**  
  - **(i) Separate routes**: Forced by (1), (3), (5), (9), (10).  
  - **(ii) Divergent modes**: Forced by (4), (7), (8).  
  - **Unification**: Forced by (6) to explain emptiness.  

  **(b) Abandoned verdicts?**  
  None. The principle accommodates all.  

  **(c) Nature of informativeness:**  
  - Property of *the sentence relative to a subject and their current mental files*.  
  - Verdicts in (1) and (10) survive: They are informative for subjects with distinct files (e.g., pre-unification astronomers or the monitor viewer).  

  **(d) Substitutivity failures (8–9) vs. informativeness (1–5):**  
  - **Same phenomenon**: Both arise from file distinctness. Substitutivity fails in (8)/(9) because attitude ascriptions access unmerged files.  
  - **Boundary**: No boundary—informativeness and substitutivity failures are symptoms of file separation.  

  **(e) Unsettled cases:**  
  - **"I am this human animal"**: **Informative** (like (7)). Distinct modes: indexical self-concept ("I") vs. biological sortal ("human animal") imply different criteria (e.g., personhood vs. organism persistence).  
  - **"A is B" (forgotten briefing)**: **Informative** (like (1)). Separate epistemic routes: current files for "A" and "B" are anchored in distinct memories (e.g., letter-signatures), not unified due to forgetting. *Not* mere ignorance—files remain distinct.  

  **(f) New Prediction:**  
  - **Case**: S learns "Cicero" from Roman histories and "Tully" from a philosophy text, but in a *single book* (same epistemic route). Later, S recalls the book but not the co-reference.  
  - **Verdict**: **Empty** (like (6)). Single route → files unified at acquisition. Forgetting doesn’t split files; it only causes ignorance of the unification.  

  ---

  ### If No Single Principle?  
  A unified account *is* possible here, but it requires:  
  - **Splitting informativeness into two types**:  
    1. **Epistemic-gap informativeness**: From separate routes (cases 1,3,5,9,10).  
    2. **Conceptual-gap informativeness**: From divergent modes (cases 4,7,8).  
  - **Boundary**: (6) falls under neither (immediate unification), while (2) is trivial.  
  - **Cost**: Less elegant; fails to explain why both types feel like "learning" (e.g., (7) is conceptual, but still discovery-like).  

  Your list suggests a single cognitive phenomenon—mental file management—underpins all cases. The proposed principle leverages this while minimizing ad hoc adjustments. Test it against new cases (e.g., deferred reference or fictional identities) to refine further.
