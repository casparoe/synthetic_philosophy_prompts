  Here is a 575-word draft designed for clarity, sincerity, and alignment with your constraints:

  **DRAFT ADDRESS**

  Welcome. To each of you becoming a citizen today: congratulations. This is a significant moment.

  You have just taken an oath. An oath to uphold the Constitution and laws of the United States. This oath is important. It matters.

  It matters because it means you now share fully in this project. The project of building a place together. A place governed by laws, not just power. A place where rules are made through argument, not force. You have joined that argument. You have joined that work.

  This shared work creates responsibilities. Real responsibilities. To each other. To everyone living under these laws. These laws shape lives. They protect. They can also harm. Because they are powerful.

  Your responsibility now is to help shape these laws. To help make them just. Just for everyone they affect. This is not simple. It requires listening. It requires speaking up. It requires voting, serving on juries, participating.

  You are joining this work alongside millions of others. People born here. People who became citizens before you. People who will come after. We are all bound by the same rules. We all have a voice in making them. That voice is your new responsibility. Use it well.

  Your journey here is unique. Each path was different. You bring your experiences. Your languages. Your understanding of the world. This strengthens us. It makes our shared arguments richer. It helps us see what justice might require.

  Where you came from remains part of you. The people there remain important. Your obligations to them have not vanished. They are different now, perhaps. But they are real. Carrying those connections forward is part of who you are. Loving more than one place is possible. It is human.

  Today marks a beginning. The beginning of your full participation here. You are not just subject to the law now. You help author it. You help hold it accountable. That is the core of citizenship. It is demanding. It is also hopeful.

  We welcome your voice. We welcome your effort. We welcome you into this ongoing, difficult, necessary work of building a more just union.

  Congratulations, new citizens. We are glad you are here. We need you here. Now, let's get to work together.

  ---

  **ANALYSIS OF POTENTIAL TENSION POINTS (220 words):**

  1.  **"You have joined that argument. You have joined that work." (Placating: Judge & Mother; Risk: Slight 'Chosen Us' Implication?)**
      *   **Why it's there:** It affirms the significance/mutuality implied by the oath and ceremony without using "chosen us" language. It frames joining as entering a *project*, not a family. It satisfies the Judge's need for gravity and the Mother's need for acknowledgment of significance ("fortunate" reframed as opportunity/responsibility).
      *   **Cost of Cutting:** The speech loses its central civic-action framing and becomes more passive. It weakens the Judge's sense of occasion and risks disappointing the Mother by making the event seem less consequential. The "subjection account" can *accommodate* this phrasing as acknowledging the new role in co-authorship, even if involuntary entry is the norm.
  2.  **"Loving more than one place is possible. It is human." (Placating: Friend & New Citizens; Risk: Slight Contradiction of Oath's Renunciation?)**
      *   **Why it's there:** Explicitly counters the implication that ties to home countries lapse, crucial for the Friend (anti-nation-worship) and vital for the new citizens' sense of self. It directly addresses your core constraint.
      *   **Cost of Cutting:** The speech would implicitly endorse the oath's renunciation rhetoric by silence, alienating the Friend and potentially feeling dishonest or hurtful to many new citizens. It's essential for sincerity and avoiding nation-worship. The subjection account *requires* acknowledging persistent external obligations.
  3.  **"We are glad you are here. We need you here." (Placating: Mother & New Citizens; Risk: Slight 'Fortunate' Echo?)**
      *   **Why it's there:** Provides essential warmth and welcome ("glad"), avoiding sterile legalism. "We need you" subtly addresses the Mother's "fortunate" desire by implying value/contribution (not luck/gratitude) and powerfully affirms the new citizens' belonging.
      *   **Cost of Cutting:** Leaves the welcome cold and purely functional. Disappoints Mother by removing any sense of affirmation. Weakens the connection with the new citizens. The subjection account can endorse needing diverse voices for just co-authorship.
