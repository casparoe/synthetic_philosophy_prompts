prompt: |-
  I have spent fifteen years as a curator of South Asian collections, and four months ago my director asked me to chair the interpretation group for a complete rewrite of our permanent galleries — around four hundred object labels, sixty panel texts and our school-facing worksheets — after a trustee described the museum as a museum of Europe with a few annexes. Our board responded by adopting a framing principle, and my job is to turn it into something my writers can actually run:

  *A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be.*

  That is the whole of what I was given. My writers are six regional specialists with no training in historiography, working mostly in English with one fluent Persianist and one Sinologist; they have about twenty minutes per label, a seventy-word ceiling, and no realistic access to the scholarly literature on anything outside their own region. I have a community advisory panel that meets monthly, so escalating a question to them costs four to six weeks, and I cannot escalate four hundred labels to them.

  We have already tried two shortcuts and they failed. The first was: delete Europe from the sentence and see whether it still says something — but it kept flagging labels for objects that entered the collection through empire, where the European connection genuinely is the reason the object is here. The second was counting mentions of continents per panel, which told us nothing we did not know.

  What I need is a decision procedure: the tests to apply in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the panel because the question is one of values rather than facts. It has to work at two levels, because I think the principle bites hardest not inside sentences but in the scaffolding — gallery titles, the period names we organise the sequence by, and which objects we chose to acquire and display at all — and my writers will apply it to individual labels. Please also tell me which distinctions inside the principle have to survive being simplified for non-specialists and which can be dropped without loss.

  Three cases to run it on:

  Our draft label on Indian cotton textiles, which currently asks why the subcontinent did not have an industrial revolution of its own, given that it was the world's leading producer of cloth well into the eighteenth century.

  Our proposed gallery spine, which is at present: Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.

  And a label the team is proud of, on printing: it says that movable type was in use in Korea and in China centuries before Gutenberg, which was meant as our corrective. If the procedure tells me this label is also a failure, I want to be told plainly and to understand why.

  Two further things. Our collection was largely assembled under empire and our provenance research is unfinished, so for some objects the only usable sources are colonial administrative ones: the procedure has to say what a writer does when the archive itself is the problem. And please separate, in your answer, what is settled from what is genuinely contested among historians and philosophers of history who work on this — including whether the board's principle itself is defensible, whether comparison of any kind can avoid a yardstick, and whether Europe is even a coherent unit to be decentring. My writers will be told which parts they may repeat as received opinion and which they must present as one view among others, so I need that distinction marked rather than smoothed over.
reasoning: |-
  Hmm, the user is a curator leading a major reinterpretation project for a South Asian collection, facing complex challenges in decolonizing museum narratives. They need a practical decision procedure to implement their board's framing principle across hundreds of labels and structural elements, while managing constraints like untrained writers, tight deadlines, and problematic colonial archives.

  The core tension lies between the board's ambitious principle (rejecting Eurocentric historical frameworks) and operational realities: specialists without historiographical training, 20-minute label writing windows, and reliance on colonial-era documentation. Previous shortcuts failed because they couldn't handle objects whose very presence stems from imperial contexts.

  Key structural issues emerge:  
  - The current gallery spine ("Ancient Worlds → Age of Discovery" etc.) embeds progressive Eurocentric periodization  
  - Even "corrective" labels (like the Korean printing example) risk recentering Europe through comparison  
  - Cotton textile label's "why no industrial revolution?" question presupposes Europe as the norm  

  For the decision procedure, I'll design layered tests addressing both sentence-level labels and conceptual scaffolding. The hierarchy must:  
  1) Resolve clear cases at writer level  
  2) Flag structural/value judgments for advisory panel  
  3) Handle archive limitations transparently  

  Critical distinctions to preserve:  
  - Causal vs contextual mentions of Europe  
  - Universalizing claims vs regional specificity  
  - Periodization as heuristic vs teleology  

  Contentious scholarly debates must be surfaced explicitly:  
  - Whether rejecting comparison entirely is feasible  
  - If "Europe" functions more as ideological construct than geographic entity  
  - How to discuss colonial-era objects without reifying imperial perspectives  

  For the test cases:  
  - Cotton label fails by treating Europe as inevitable outcome  
  - Gallery spine requires complete overhaul  
  - Printing label, while well-intentioned, still uses Europe as reference point  

  The procedure must empower writers to:  
  - Identify buried assumptions in questions  
  - Replace deficit framing ("failed/late") with contextual explanation  
  - Mark archival limitations as interpretive gaps rather than silences  

  Ultimately this is about building institutional capacity to sit with discomfort: holding colonial collection histories and anti-colonial interpretive frameworks in tension without false resolutions.
answer: |-
  Based on your framing principle, operational constraints, and scholarly debates, here is a decision procedure for your writers and a structural review process. It prioritizes efficiency while flagging fundamental issues requiring escalation. Key distinctions to **preserve** are marked (✓), those that can be **simplified/dropped** are marked (✘).

  ---

  ### **Decision Procedure for Object Labels (70-word level)**
  Apply these tests sequentially. Stop at first "NO" or "ESCALATE":

  1.  **"Is Europe named/implied as the *primary* actor, benchmark, or cause?"** (✓)
      *   *Test:* Does the text position Europe as the *subject* (doer), *goal* (standard to achieve), or *necessary explanation* (e.g., "because of Europe," "unlike Europe")? Ignore factual mentions of origin/provenance *unless* framed as the *reason for significance*.
      *   *Sufficient Answer:* YES: Rewrite to center the object's context. NO/Unclear: Proceed to #2.
      *   *Example (Cotton Label):* "Why no Indian IR?" implies Europe is the achieved norm → **NO**.
      *   *Example (Printing Label):* "Before Gutenberg" positions Europe as temporal benchmark → **NO**.

  2.  **"Does it frame non-European history using deficit terms?"** (✓)
      *   *Test:* Check for words/phrases implying lack, failure, delay, primitiveness, or inevitability towards a European outcome (e.g., "failed to," "not yet," "lagged," "stagnant," "pre-," "on the verge of," "destined for").
      *   *Sufficient Answer:* YES: Replace with neutral/positive descriptors of local context/achievement. NO: Proceed to #3.
      *   *Example (Cotton Label):* "Why no...?" implies failure → **NO**.

  3.  **"Is the object's significance defined *only* by its impact on/relation to Europe?"** (✓)
      *   *Test:* Does the label explain *why this object matters* primarily through its role in European history, trade with Europe, or European collection? (Common for imperial-collected objects).
      *   *Sufficient Answer:* YES: Rewrite to start with its significance *within its originating context* (even if brief), *then* mention European connection if crucial. If originating context is truly unknown *and* European connection is the *sole documented reason for preservation*, add a phrase like: "Collected during [X period] because [specific documented reason, e.g., ‘valued for its technique’]". **ESCALATE** if the *only possible* significance is entirely Eurocentric (e.g., "Made for the East India Company export market").
      *   *Example (Provenance Issue):* If an object's *only* record is a colonial invoice calling it "curious native artifact," write: "Used in [region, if known] for [probable function based on type]. Collected by [collector/entity] in [year]." Avoid speculating on "why it mattered" if unsupported.

  4.  **"Does it assume a universal trajectory where Europe is the endpoint?"** (✓)
      *   *Test:* Does the language imply all societies progress through the same stages (e.g., "developing," "emerging," "early/late") with Europe as the most "advanced"?
      *   *Sufficient Answer:* YES: Remove stage language. Describe specific conditions/achievements. NO: **PASS** for this label. Consider broader implications for acquisition/display later.

  ---

  ### **Structural Review Procedure (Gallery Titles, Periodization, Acquisition Logic)**
  This is **your responsibility** (not writers). Apply these monthly with advisory panel input:

  1.  **"Does the periodization imply a single, progressive timeline?"** (✓)
      *   *Test:* Are period names (like "Ancient Worlds," "The Modern World") universalized? Does the sequence inherently suggest advancement towards a Eurocentric "present"?
      *   *Action:* Replace with regional/functional/thematic terms (e.g., "Networks of Exchange: 1000-1500 CE," "Courtly Cultures: South Asia 1500-1800"). **ESCALATE** core periodization logic to the panel.
      *   *Example (Current Spine):* "Ancient Worlds → Age of Discovery → Revolution & Industry → Modern World" is a Eurocentric teleology → **FAIL**. Requires complete overhaul.

  2.  **"Is acquisition/display justified by 'filling gaps' against a Eurocentric narrative?"** (✓)
      *   *Test:* Were objects acquired primarily to "show precursors to Europe" or "illustrate non-European 'lack'"?
      *   *Action:* Shift justification to representing specific regional developments, innovations, or global connections on their own terms. **ESCALATE** major gaps reflecting past bias.

  3.  **"Do gallery titles/themes center Europe or treat it as the default?"**
      *   *Test:* Does the title imply Europe is the active center ("Age of *Discovery*") or the norm ("Non-European Art")?
      *   *Action:* Use active, specific, non-comparative titles (e.g., "Oceanic Encounters" instead of "Age of Discovery," "Innovations in Textile Production" instead of "The World Before the Loom").

  ---

  ### **Analysis of Your Cases Using the Procedure**

  1.  **Indian Cotton Textiles Label (Draft):**
      *   Test #1: YES ("Why no IR?" implies Europe as achieved norm).
      *   **Result: FAIL.** Rewrite: Focus on *how* Indian textile production worked, its scale, sophistication, global reach, and *specific* responses to industrialization pressures (e.g., adaptation, niche markets, suppression). *Example:* "South Asian weavers dominated global cotton for centuries using complex local systems. In the 1800s, these faced pressures from mechanized production and colonial policies, leading to adaptation and change." (Avoids comparison, centers local system).

  2.  **Gallery Spine:**
      *   Structural Test #1: YES (Universalized, progressive Euro-timeline).
      *   **Result: FAIL.** Requires fundamental redesign. ESCALATE to panel. *Example Alternatives:* "Interconnected Worlds (pre-1500)", "Empires and Exchanges (1500-1800)", "Industry, Innovation, and Imperialism (1700-1900)", "Global Encounters and Modern Expressions (1800-present)". (Thematic, acknowledges global interaction without teleology).

  3.  **Korean/Chinese Printing Label:**
      *   Test #1: YES ("Centuries before Gutenberg" uses Europe as temporal benchmark).
      *   Test #2: NO (No explicit deficit terms).
      *   Test #3: Possibly (If significance is *only* "before Europe," it fails. But likely has local significance).
      *   **Result: FAIL** on Test #1. It recenters Europe even as a corrective. *Rewrite:* "Movable type printing was developed and used extensively in East Asia, with key innovations in Korea [mention specific, e.g., metal type] and China centuries prior to its adoption in Europe." (States the fact without using Europe as the anchor point).

  ---

  ### **Handling Problematic Archives & Scholarly Distinctions**

  *   **Colonial Archives Only:**
      *   **Procedure (Label Level - Test #3):** State documented origin/collection fact neutrally. Acknowledge the archival limitation implicitly by *not* making claims the colonial source doesn't support about local significance. *Example:* "This ceremonial object was collected in [Place] by [Colonial Official] in [Year]. Objects like this were often used in [broad category - e.g., religious ceremonies] in the region." **DO NOT** repeat colonial judgments ("primitive," "idolatrous"). If the *only* context is colonial use (e.g., a tax token), state that factually: "Issued by the [Colonial Administration] for [Purpose]."

  *   **Scholarly Distinctions (Settled vs. Contested):**
      *   **(Settled - Can be stated confidently):**
          *   Eurocentrism as a historical problem: Historians widely agree traditional narratives *were* Eurocentric. (✓)
          *   "Europe" as a constructed concept: Scholars agree "Europe" is a historically contingent idea, not a fixed biological/cultural unit. (✓ - Crucial for deconstruction).
          *   Avoidance of deficit framing: Using terms like "failed" or "primitive" is widely rejected as unscientific and biased. (✓)
      *   **(Contested - Must be presented as one view/acknowledged complexity):**
          *   **Defensibility of the Board's Principle:** While widely supported in decolonial/critical theory, some historians argue comparison is essential and fear the principle might lead to isolationism or obscure global power dynamics. *Mark as:* "This approach reflects a current critical perspective aiming to..."
          *   **Avoiding a Yardstick in Comparison:** Deeply contested. Some (e.g., Dipesh Chakrabarty) argue avoiding *implicit* Eurocentric yardsticks is crucial. Others (e.g., Jurgen Osterhammel) argue for symmetric comparison using common analytical frameworks. *Mark as:* "Scholars debate how best to compare societies fairly..."
          *   **"Europe" as a Unit:** Highly contested. While its *idea* influenced history, historians of Europe (e.g., Sebastian Conrad) stress its internal diversity and constant redefinition. De-centering it is valid, but what constitutes "Europe" contextually is debated. *Mark as:* "While 'Europe' is used here as a shorthand, historians note its complex and shifting historical reality..."
          *   **Teleology vs. Causation:** Distinguishing between describing processes leading to specific outcomes (e.g., industrialization in Britain) vs. implying that outcome was inevitable/universal is a constant tension. *Mark carefully when discussing change.* Avoid "led to" where "contributed to" or "occurred alongside" is more accurate.

  ---

  ### **Summary & Key Implementation Points**

  1.  **Writers:** Use the 4-step label test. Most edits involve reframing sentences away from Europe-as-benchmark and deleting deficit language. When stuck on Test #3 (significance defined by Europe) or encountering unresolvable colonial framing, flag for you (curator).
  2.  **You (Curator):** Focus ruthlessly on structural elements (periodization, gallery titles, acquisition logic) using the structural tests. Escalate core framing issues to the advisory panel. Provide writers with clear examples of rewritten labels (like the cotton/printing examples above).
  3.  **Advisory Panel:** Use them for high-level structural decisions (periodization philosophy, thematic framing, handling objects with *only* colonial significance) and validating approaches to contested concepts. Don't burden them with individual labels.
  4.  **Transparency:** Be explicit with writers about what is settled ("avoid 'failed'") and what is contested ("scholars debate symmetric comparison"). Provide brief guidance notes citing key concepts (e.g., "teleology," "Eurocentrism," "deficit framing").
  5.  **Accept Imperfection:** Given time/resource constraints, focus on eliminating the most egregious issues (deficit terms, Europe as sole benchmark/cause). The structural overhaul is where the biggest impact lies. Iteratively improve labels as provenance research advances.

  This procedure provides actionable steps for writers, defines clear escalation points based on the nature of the problem (factual vs. values/structural), and preserves the core critical distinctions of the board's principle while acknowledging genuine scholarly debates. It accepts the reality of the archive while refusing to replicate its biases uncritically.
