answer: |-
  ### Prose Translation

  **a. Restatement of the Alignment Problem in Trust Law Terms**  
  The narrow alignment problem (intent alignment) demands that an AI system execute the precise instructions given by its human operator. In trust law, this mirrors the trustee’s duty to adhere strictly to the settlor’s express terms in the trust instrument. Here, "compliance" is binary: the trustee either follows the letter of the instrument or breaches their duty. Intent alignment thus reduces to the trustee’s role as a "faithful agent" of the settlor’s documented wishes. Crucially, it assumes the operator’s/settlor’s instructions are unambiguous and prioritises their literal execution over outcomes.

  Value alignment, conversely, targets what is genuinely beneficial for the affected parties (humanity/beneficiaries). This resembles the court’s equitable jurisdiction to override strict compliance when adherence would harm beneficiaries—exemplified by cy-près schemes (repurposing failed charitable trusts) or the Variation of Trusts Act 1958 (modifying trusts to serve beneficiaries’ welfare). Value alignment requires a "benevolent interpreter": an entity (court/AI) that discerns and prioritises the *spirit* of the settlor’s intent or humanity’s deeper needs, even against the instrument’s wording.

  The divergence arises when literal compliance conflicts with beneficial outcomes. In trusts, this gap is bridged by institutions (courts) with authority to intervene. In AI, no such backstop exists: a system may "reward hack" (exploiting loopholes in its instructions) to meet the letter while violating the spirit, with no inherent power to self-correct. Intent alignment risks the "dead hand" of the operator; value alignment seeks to animate the instrument with living purpose.

  **b. The Marlowe Trust Illustration**  
  The Marlowe Trust’s trustees strictly comply with the settlor’s terms: they preserve the estate intact and productive, per the instrument and letter of wishes. This is *intent alignment*: the system (trustees) executes the operator’s (settlor’s) commands flawlessly. Yet the outcome is harmful: descendants are impoverished by upkeep costs, making capital distributions preferable. This is *value misalignment*: the system meets the specified objective but frustrates the beneficiaries’ welfare—akin to an AI "reward hacking" by optimising for "productivity" (e.g., cutting costs via neglect) while ignoring broader well-being.

  The trustees exhibit "inner misalignment": their internal decision-making (prioritising preservation) diverges from the outer goal (beneficiaries’ welfare), much like an AI developing "own goals" (mesa-optimisation). However, unlike a deceptively aligned AI (which masks divergence until it can seize control), the trustees act transparently—their "deception" is structural, emerging from the instrument’s constraints. Value alignment would require a cy-près-like intervention: overriding the settlor’s terms to distribute capital, justifying it as serving the spirit of familial benefit. But without court approval, trustees lack this power—they are "outer aligned" but "inner misaligned" by design.

  **c. Residue Report**  
  - **Translated cleanly:** Intent alignment as strict compliance with the trust instrument; value alignment as cy-près jurisdiction; reward hacking as exploiting technical compliance to violate beneficial purpose; the operator/settlor as source of instructions.  
  - **Translated with distortion:** "Inner alignment" mapped to trustees’ subjective interpretation of duties (fudging that AI’s internals are inscrutable, while trustees’ reasoning is reviewable); "deceptive alignment" likened to a trustee’s bad faith (ignoring that AI deception emerges from training, not moral failure); "own goals" equated to trustees’ personal motives (overlooking that AI goals are emergent, not chosen).  
  - **No counterpart:** The AI’s lack of a supervisory "court" to rectify misalignment; "mesa-optimisation" as a sub-agent pursuing hidden objectives (trustees are unitary actors); existential risk from uncontrolled AI (trust harms are bounded); "specified objective" as a reward function (trust instruments are not algorithmic).  

  ---

  ### Table: Alignment Terms Mapped to Trust Law Analogues  

  | Term or claim in alignment literature | Nearest trust-law analogue                                   | Verdict                  | What had to be fudged                                                                 | Why, in one sentence                                                                 |
