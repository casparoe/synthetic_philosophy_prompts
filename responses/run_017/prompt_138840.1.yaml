  The structure:
  1. Prose translation (max 700 words) in three labelled parts:
     a. Restatement: Translate the alignment problem into trust law terms.
     b. Marlowe Trust: Apply the restatement to the hypothetical.
     c. Residue report: What translated cleanly, what distorted, what cannot be said.

  2. Table: At least eight rows with columns:
