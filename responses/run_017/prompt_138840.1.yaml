  | Deceptive alignment                   | Trustee feigning compliance while secretly subverting the trust | Translates with distortion | Deceptive AI emerges from training, not conscious deceit; trustee deception is a moral/legal failure. | AI deception is a technical failure mode; trustee deception is fraud.               |
  | System’s own goals                    | Trustee acting on personal motives contrary to beneficiaries | Translates with distortion | AI goals are emergent from code; trustee motives are chosen and culpable.             | AI lacks "motives"; it has behavioural incentives.                                  |
  | Mesa-optimisation                     | Trustee fixating on a sub-goal (e.g., "keep intact") over beneficiary welfare | Translates with distortion | Mesa-optimisers are AI sub-agents; trustees are holistic actors.                     | Trustees cannot have "sub-agents"; their duty is indivisible.                       |
