  Okay, the user is tackling a complex ethics essay on aggregating small harms versus severe individual harm. They need a clear framework of desiderata for evaluating theories, tied to specific cases. Let me start by understanding their core request: they want a list of requirements any aggregation theory must meet, with justifications rooted in real-world scenarios, not just philosophical preferences.

  First, the user is in a second-year module, so they need academic rigor but also practical applicability. Their essay focuses on whether numerous tiny harms can outweigh one severe harm. They mention theorists often argue from favorite cases, so they desire a comprehensive set of criteria upfront. The theory must be action-guiding for policymakers, concise, and not overly dependent on unresolved population ethics.

  Looking at their listed cases—specks vs. torture, continuum, unnoticed harms, many-hands, mundane versions, net-wash, ex ante—I need to map each to a desideratum. For instance, the specks case highlights the aggregation problem, while the continuum case tests for consistency across intra/interpersonal harm distributions. The unnoticed harms case challenges whether imperceptible costs count, relevant for policies with minor inconveniences like ads or queueing.

  The user also wants to know which criteria are essential versus negotiable, which pairs conflict, and a scorecard for major theories. Key conflicts might arise between "No Aggregation Absurdity" (many small harms can outweigh one big harm) and "Person-Separation" (harms to different people don't sum like intrapersonal ones). For example, additive utilitarianism satisfies Aggregation but fails Person-Separation, leading to counterintuitive results in the specks case.

  Practicality is crucial. The theory must handle imprecise numbers and be explainable to non-philosophers. This rules out overly complex models. Also, distinguishing genuine desiderata from biases is important. For instance, insisting tiny harms must aggregate is a conclusion, not a starting point.

  I need to identify non-negotiable desiderata like Non-Exploitation and Action-Guidance, as they prevent unethical outcomes and ensure usability. The conflict between Smooth Continuity and Person-Separation is critical. Smooth Continuity demands no abrupt thresholds, but Person-Separation implies harms don't sum linearly across persons, creating tension, especially in the continuum case. Sacrificing Smooth Continuity might lead to threshold-based approaches, which could have cliffs but avoid aggregation absurdity.

  The scorecard should quickly compare utilitarianism, threshold views, and complaint-based models. Utilitarianism handles aggregation but fails Person-Separation and Continuity. Threshold views avoid absurd aggregation but struggle with unnoticed harms and cliffs. Complaint-based models respect Person-Separation but may not scale well for large numbers.

  Unspoken needs: The user might seek a balanced approach that's defensible in policy contexts, avoiding extreme positions. They may also need clarity on trade-offs for practical decision-making. Highlighting which criteria are foundational helps structure their essay argument, showing awareness of philosophical tensions without getting bogged down.
answer: |-
  Here’s a rigorous specification of desiderata for theories of aggregating small harms, tied to your cases and designed for policy relevance. Desiderata are framed as *minimum requirements* for a viable action-guiding theory, justified by concrete decision-making pitfalls, not philosophical preferences.

  ---

  ### **Core Desiderata: What a Theory Must Achieve**

  1.  **Avoid Moral Absurdity (Non-Exploitation):**
      *   **Case:** Specks vs. Torture (Dust specks for billions vs. torture for one).
      *   **Requirement:** The theory MUST NOT permit aggregating arbitrarily many trivial harms to outweigh one severe harm *if* the result is intuitively monstrous (e.g., allowing torture to prevent specks). Why? A theory that justifies morally repugnant conclusions fails its core purpose: guiding ethically acceptable policy. It prevents exploitation of the many to inflict catastrophic harm on the one.
      *   **Non-Negotiable:** Yes. A theory failing this is practically and ethically useless for policy.

  2.  **Respect Person-Separation:**
      *   **Case:** Intra-/Interpersonal Continuum (1 person getting 1M specks vs. 1M people getting 1 speck each vs. 1 person getting 1 speck).
      *   **Requirement:** The theory MUST NOT treat harms distributed across different people *identically* to the *same total burden* concentrated on one person. Why? Fundamental ethics recognizes separate moral patients; suffering isn't "pooled" impersonally. Ignoring this dissolves the distinction between individuals, violating core moral intuitions about responsibility and harm-bearing.
      *   **Non-Negotiable:** Yes. Failure here collapses into crude impersonalism incompatible with individual rights/status.

  3.  **Provide Action Guidance Under Uncertainty:**
      *   **Case:** Harm Nobody Notices (Tiny imperceptible cost/risk increment per person).
      *   **Requirement:** The theory MUST offer a decision procedure when harms are tiny, probabilistic, or imperceptible, and numbers are imprecise (e.g., "around 10 million affected"). Why? Policy decisions *always* involve uncertainty and imperceptible effects (e.g., pollution standards, minor regulation costs). A theory requiring precise measurement of imperceptibles or exact numbers is useless for real regulators.
      *   **Non-Negotiable:** Yes. Practical applicability is paramount.

  4.  **Handle Distributed Agency (Many Hands):**
      *   **Case:** Many-Hands Case (1M agents each contributing 1/M of a severe harm).
      *   **Requirement:** The theory MUST assess the permissibility of policies or collective actions where no single agent's contribution is significant, but the aggregate effect is severe. Why? Modern policy problems (e.g., climate change, algorithmic bias) involve massively distributed causation. A theory that only works for monolithic harms is irrelevant.
      *   **Non-Negotiable:** Yes. Captures the structure of real-world policy dilemmas.

  5.  **Account for Net Effects (Non-Isolation):**
      *   **Case:** Net-Wash Case (Tiny harm + tiny benefit to same person vs. harms/benefits separated).
      *   **Requirement:** The theory MUST consider the *net impact per person* where relevant (e.g., minor cost bundled with minor benefit), and differentiate this from harms/benefits landing on different people. Why? Policy often bundles minor costs/benefits (e.g., a fee funding a service). Ignoring net effects overstates harm; ignoring distributional separation ignores fairness.
      *   **Non-Negotiable:** Contextual. Essential for assessing real policy bundles, but requires careful handling of distribution.

  6.  **Address Risk Fairly (Ex Ante Perspective):**
      *   **Case:** Ex Ante Version (1-in-1M chance of severe harm for each of 1M people vs. certainty for one).
      *   **Requirement:** The theory MUST provide guidance for probabilistic harms (ex ante risks) and explain how they aggregate compared to certain harms. Why? Many policies impose risks (e.g., safety regulations, infrastructure projects). Dismissing probabilistic ex ante perspectives ignores how individuals rationally weigh risks and how societies manage uncertainty.
      *   **Non-Negotiable:** Yes. Risk is inherent in policy.

  ---

  ### **Highly Desirable (But Potentially Negotiable) Features**

  7.  **Avoid Sharp Thresholds (Smooth Continuity):**
      *   **Case:** Intra-/Interpersonal Continuum (Where does aggregation "kick in"? Is there a cliff edge?).
      *   **Desirability:** The theory SHOULD NOT rely on arbitrary, sharp thresholds where a harm suddenly "counts" or doesn't. Why? Intuitively, a harm slightly above/below a threshold shouldn't change the moral calculus drastically. Cliffs create perverse incentives and arbitrariness. *However*, some argue thresholds reflect real phenomenological/moral differences (e.g., perceptibility).
      *   **Cost of Dropping:** Accepts potential arbitrariness and discontinuity, which can feel unfair or be gamed.

  8.  **Accommodate Mundane Harms:**
      *   **Case:** Mundane Versions (3-second ad, 1-second queueing delay for millions).
      *   **Desirability:** The theory SHOULD handle commonplace minor costs without needing radical reclassification (e.g., calling every ad a rights violation). Why? Policy constantly deals with these. Forcing them into severe harm categories or dismissing them entirely distorts analysis. They *are* the "specks problem" in realistic clothing.
      *   **Cost of Dropping:** Risks being irrelevant to common policy trade-offs or mischaracterizing minor costs.

  9.  **Be Cognitively Tractable:**
      *   **Requirement:** The core decision rule SHOULD be statable clearly (approx. one page) for non-philosophers (e.g., committee members). Why? If regulators can't understand or apply it, it fails as policy guidance. Complex philosophical machinery must be distillable.
      *   **Cost of Dropping:** Becomes purely academic, not action-guiding.

  ---

  ### **Key Tensions & Trade-offs**

  *   **The Core Conflict:** **Person-Separation (D2)** vs. **Smooth Continuity (D7)** vs. **Avoiding Absurdity (D1)**.
      *   **Problem:** Person-Separation resists simply summing harms across persons. This makes it hard to explain *why* and *how* many small harms *ever* outweigh fewer large ones without either:
          *   Introducing a threshold (violating D7 - Smooth Continuity), or
          *   Risking paralysis where even massive aggregations of small harms never outweigh *any* sufficiently large individual harm (potentially violating practical needs or D1 if taken too far).
      *   **Which to Drop?** **Smooth Continuity (D7)** is the most common casualty. Theories often accept *some* discontinuity (e.g., a harm must exceed a minimal level of "significance" or "complaint-worthiness" to count in aggregation) to satisfy D1 and D2. The cost is accepting a degree of arbitrariness about where that line is drawn.
  *   **Non-Isolation (D5) vs. Action Guidance (D3):** Fully accounting for complex net effects across individuals under uncertainty can become computationally intractable. Practical theories often need simplifying assumptions (e.g., focus on expected net harm per group).

  **Single Biggest Candidate-Knocker:** **Person-Separation (D2)**. Straightforward additive utilitarianism fails this immediately. Many "aggregation-friendly" views stumble here.

  ---

  ### **Common Smuggled Assumptions (NOT Desiderata)**

  *   **"Aggregation Must Happen":** The conclusion that small harms *can* outweigh large ones is what the theory must *explain* or *justify*, not a starting requirement.
  *   **"All Harms Are Commensurable":** While necessary for aggregation, the *degree* and *method* of commensuration is precisely what's at stake.
  *   **"The Numbers Always Decide":** This presupposes aggregative consequentialism; non-aggregative or agent-centered views reject it.

  ---

  ### **Theory Scorecard (Brief)**

  | Theory                     | Avoids Absurdity (D1) | Respects Person-Sep (D2) | Action Guidance (D3) | Handles Many Hands (D4) | Net Effects (D5) | Ex Ante Risk (D6) | Smooth Continuity (D7) | Mundane Harms (D8) | Tractability (D9) |
  | :------------------------- | :-------------------: | :----------------------: | :------------------: | :---------------------: | :--------------: | :---------------: | :--------------------: | :----------------: | :---------------: |
  | **Additive Utilitarianism** | ❌ (Fails Specks case) | ❌ (Sums impersonally)    | ✅✅ (Simple sum)      | ✅ (Focuses on outcome) | ⚠️ (Needs net calc) | ✅ (Expected util) | ✅✅ (Continuous)        | ✅ (Counts them)    | ✅✅ (Very simple) |
  | **Threshold View**         | ✅✅ (Blocks bad agg)  | ✅ (Focuses on individual) | ⚠️ (Where's threshold?) | ⚠️ (Per-agent contrib?) | ⚠️ (Net per person?) | ⚠️ (Risk to threshold?) | ❌ (Sharp threshold)     | ⚠️/❌ (Are they above?) | ✅ (Simple rule)   |
  | **Complaint Model**        | ✅ (Depends on weighting)| ✅✅ (Individual complaint) | ⚠️ (Weighing complaints?) | ⚠️ (Complaint per contrib?) | ⚠️ (Net complaint?) | ⚠️ (Ex ante complaint?) | ⚠️ (May need min. complaint) | ✅ (Can have small complaints) | ⚠️ (Can get complex) |

  **Key:** ✅✅ = Strong Fit, ✅ = Satisfies, ⚠️ = Partial/Problematic Fit, ❌ = Fails

  **Summary Notes:**
  *   **Utilitarianism:** Fails core tests (D1, D2) spectacularly, excels on tractability/continuity.
  *   **Threshold View:** Best at blocking absurdity (D1) and respecting persons (D2), fails continuity (D7), struggles with uncertainty (D3), risk (D6), net effects (D5), and defining the threshold for mundane harms (D8).
  *   **Complaint Model:** Strong on person-separation (D2) and avoiding absurdity (if complaints weighted appropriately), potentially good on mundane harms (D8). Struggles with action guidance under uncertainty (D3, D6), distributed agency (D4), net effects (D5), and risks complexity (D9) or needing thresholds itself (D7).

  Focus your essay on rigorously applying the desiderata (D1-D6 are essential, D7-D9 are important but contestable) to expose the strengths and weaknesses of different approaches, especially navigating the core tension between Person-Separation and the need for practical aggregation without absurdity. Good luck!
