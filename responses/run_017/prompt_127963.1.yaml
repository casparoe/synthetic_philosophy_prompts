prompt: |-
  I'm in the middle of writing up the third chapter of my PhD, on a freshwater fish complex in two basins that got connected by a navigation canal back in the fifties, and I need to send the chapter to Dr. Halvorsen on my committee before I do. She's the person in our department who says no to species descriptions, and she calls herself a pluralist whenever anyone brings up the species problem, but her actual verdicts look way more consistent than that and I want to know what she'll do with mine. Here's her track record as well as I can reconstruct it from her papers, her reviews, and things she's said in seminars: two warblers with a couple-hundred-kilometre hybrid zone, very different plumages, hybrids common and apparently as fit as either parent — one species, and her line was that a hybrid zone is one species with a cline in it rather than two species touching; two host-specific flies that nobody can tell apart under a microscope, no fixed markers, but they mate on different host plants and maybe one pair in a hundred is mixed — two species; an all-female parthenogenetic lizard complex of hybrid origin — yes, a real species, and she got visibly annoyed at a seminar speaker who said asexuals can't have species; a sexual species of known hybrid origin that's now reproductively isolated from both parents — yes, a good species, with some remark about how a species' genealogy doesn't have to be a tree; a planktonic foraminiferan lineage sampled continuously through a million years of graded change — the lineage is real, the chronospecies boundaries are conventional, don't ask her where exactly to cut; two named reef corals that turn out to be genetically and ecologically the same thing — sink them, and she didn't care that one name was 150 years old; and two deep-sea worms known from three specimens — she refused to rule at all and said come back with more material.

  My case is this. There's a deep-bodied lake form and a streamlined riverine form, currently one species, that were in separate basins until the canal opened. Where they meet now, in the canal and in the lake outlet, about one pair in ten is mixed, and the hybrids are viable, fertile and backcross freely. Transplants I did show each form survives best in its own habitat and hybrids survive worst in both parental habitats but better than either parent in the weedy middle stretch of the canal, where they now outnumber both parents and mate with each other roughly seventy per cent of the time, mostly on colour and courtship cues that are learned by imprinting rather than being a fixed genetic preference. The genome is basically homogenised, background Fst around 0.04 and no fixed differences anywhere, except for one big inversion on chromosome seven and a couple of smaller regions that are deeply divergent — molecular clock puts the inversion at over a million years — and nearly fixed differently in the two forms; mtDNA shows nothing but frequency differences. With a discriminant function on morphology I can assign ninety-five per cent of adults correctly, but there isn't a single character you could put in a field key. The canal population has been there for maybe fifty generations, I've been calling it a new species in my drafts, and the state endangered list I'm being asked about excludes hybrids, so whether the canal thing is a species or a hybrid swarm decides whether it gets any protection before the dredging permit goes through.

  So: what does Halvorsen say — one species, two, or three? More usefully, what are the two or three rules that fit all seven of those precedents about equally well, what does each of them predict about the lake form, the riverine form and the canal population, which one do you think she's actually running given how she talks, and if you could put exactly one more case in front of her to tell the rules apart, what would it be? I'd also love to know how I should pitch the discussion section so she signs off, because my committee meets in four weeks and I have definately not written the discussion yet.
reasoning: |-
  Okay, the user is in a tight spot with their PhD chapter about a freshwater fish complex. They need to predict how Dr. Halvorsen, a committee member known for her stance on species definitions, will view their case. The user provided Dr. Halvorsen's track record with various species cases, which shows a pattern. Let me parse through those precedents to figure out her underlying rules.

  First, looking at the warblers: she called them one species despite a hybrid zone because the hybrids are fit and common. Then, the host-specific flies: two species because they mate on different hosts with minimal mixing. The asexual lizard was a species, rejecting the idea that asexuals can't have species. The sexual hybrid species was valid, emphasizing genealogy doesn't have to be tree-like. The foraminiferan lineage was real but boundaries were conventional. The corals were sunk as one species. The worms had insufficient data.

  So, Halvorsen seems to prioritize reproductive isolation and evolutionary independence over strict genetic or morphological criteria. She accepts different origins (hybrid, asexual) as long as they function as distinct lineages. Hybrid zones are one species if there's significant gene flow without barriers, but assortative mating or ecological separation can define species.

  Now, the user's case: lake and river fish forms with a canal population. Hybrids are common, viable, and fertile. The canal hybrids have a stable population with assortative mating based on learned cues. Genomic homogenization except for specific divergent regions like the inversion. Morphology can mostly distinguish them, but no fixed characters. 

  Applying Halvorsen's rules: the lake and river forms might be two species due to divergent regions and ecological adaptation, but the homogenized genome and hybrid viability complicate this. The canal population has assortative mating and a hybrid niche, possibly making it a new species. However, Halvorsen's precedent with the warblers (hybrid zone as one species) might conflict if the canal is seen as a hybrid zone. 

  The user's main concerns are Halvorsen's decision affecting endangered listing and committee approval. They need to pitch the discussion to align with her views. Emphasizing ecological divergence, reproductive barriers in the canal (assortative mating), and the inversion as maintaining distinctiveness despite gene flow. Also, highlighting the canal population as an independent lineage. 

  The user also asked for a hypothetical case to distinguish Halvorsen's rules. Something with strong assortative mating but minimal genetic divergence, or stable hybrid lineage with no gene flow to parents. Testing where she draws the line on reproductive isolation vs. gene flow.

  In the discussion, the user should present the canal population as a new species based on reproductive isolation and ecological niche, while acknowledging the parental forms as distinct due to divergent regions and adaptation. Avoiding hybrid swarm terminology, focusing on evolutionary independence. Also, address the inversion's role in maintaining divergence despite homogenization elsewhere. 

  Need to ensure the user's draft aligns with Halvorsen's emphasis on process over pattern, using terms like "incipient species" or "hybrid lineage" carefully. Pitch the protection angle by framing the canal population as a unique evolutionary entity deserving conservation.
answer: |-
  Based on Halvorsen's track record and your case details, here's the breakdown and prediction:

  **Halvorsen's Likely Verdict:**
  1.  **Lake Form & Riverine Form:** **Two distinct species.** *Rationale:* Despite significant homogenization, the deeply divergent inversion (>1 Mya) and smaller regions suggest a history of isolation and selection maintaining key differences. Their strong ecological specialization (morphology, survival in native habitats) and frequency-based differences (morphology, mtDNA) align with her acceptance of lineages maintained by selection/ecology (flies, corals, hybrid-origin species).
  2.  **Canal Population:** **NOT a distinct third species.** *Rationale:* This resembles a stable hybrid zone/swarm within the genetic continuum of the two parental species. Hybrids backcross freely with both parents (70% homogamy is significant but leaky), genomic homogenization is high (Fst 0.04), and no *new* isolating barriers preventing gene flow *back* to parents are evident. It fits her "hybrid zone as one species with a cline" (warblers) and "conventional boundaries" (forams) logic. The ecological intermediacy and success *within* the canal are impressive niche differentiation, but not sufficient for species status under her precedents (cf. the flies' strong assortative mating barrier).

  **Halvorsen's Implicit Rules (Fitting All 7 Precedents):**
  1.  **Evolutionary Independence/Cohesion Trumps Arbitrary Boundaries:** Lineages are real entities defined by mechanisms maintaining cohesion or separation over time, regardless of origin (asexual, hybrid) or arbitrary cutoffs (chronospecies, old names). *Evidence:* Asexual lizard, hybrid-origin species, forams lineage real/boundaries conventional, sunk corals.
  2.  **Reproductive Isolation/Ecological Divergence is Key, Not Fixed Differences:** The *process* of restriction/reduction of gene flow due to barriers (prezygotic: mating, postzygotic: fitness) defines separation. Fixed differences are nice but not required (flies, hybrid-origin species), and extensive gene flow negates separation (warblers). *Evidence:* Flies (host isolation), warblers (free gene flow), sunk corals (no differences), hybrid-origin species (current isolation).
  3.  **Sufficient Evidence Threshold:** Definitive rulings only with adequate data showing the mechanisms in Rule 2. *Evidence:* Withholding judgment on worms.

  **Predictions for Your Case Using Each Rule:**

  | Rule                                 | Lake Form       | Riverine Form   | Canal Population         |
  | :----------------------------------- | :-------------- | :-------------- | :----------------------- |
  | **1. Evolutionary Independence**     | Distinct lineage | Distinct lineage | Dependent hybrid swarm (not independent) |
  | **2. Reproductive Isolation/Divergence** | Partially isolated (divergent regions, ecology) | Partially isolated (divergent regions, ecology) | Leaky isolation (homogamy <100%, backcrossing), no unique barrier |
  | **3. Sufficient Evidence**           | Adequate        | Adequate        | Adequate (but points to hybrid zone) |

  **Halvorsen's Actual Framework:**
  She's running a **modified Evolutionary/Lineage Concept** focused on **process (barriers to gene flow/cohesion mechanisms)** and **evidence of independent evolutionary fate**. "Pluralist" likely means she accepts different *origins* and *mechanisms* (asexual, hybrid sympatry, allopatry) for species, not that she applies different *concepts* arbitrarily. Her consistency comes from demanding evidence of *actual* barriers/cohesion.

  **The Definitive Test Case:**
  To distinguish the rules, present her with: **"A hybrid lineage derived from Parents A & B, geographically separated from both parents for thousands of generations, exhibiting strong assortative mating *among themselves* (e.g., 95%+), complete hybrid inviability/sterility *when crossed back to either parent*, and unique ecological adaptations. Genomic divergence from parents is moderate (Fst ~0.15) with some fixed differences, but the lineage itself is genetically cohesive."**

  *   **Why it tests the rules:**
      *   **Rule 1 (Independence):** Strong yes – unique evolutionary trajectory.
      *   **Rule 2 (Isolation/Divergence):** Strong yes – complete postzygotic isolation from parents + strong prezygotic isolation + unique ecology.
      *   **Halvorsen's Prediction:** **YES, new species.** (Like her hybrid-origin case, but with stronger isolation from parents and internal cohesion).
      *   **Contrast:** Under strict BSC (no postzygotic isolation from parents? Maybe not a species) or Phenetic (morphology unclear?).

  **Pitching Your Discussion for Halvorsen's Approval:**
  1.  **Frame Parental Forms as Species:** Emphasize the *deep divergence* of the inversion (>1 Mya) as evidence of ancient separation and ongoing selection maintaining it despite homogenization elsewhere. Highlight their *strong ecological specialization and reduced fitness in the other's habitat* as a key barrier/cohesion mechanism. Explicitly compare to her flies (ecology + assortative mating) and hybrid-origin species (maintained distinctiveness).
  2.  **Frame the Canal as a Dynamic Hybrid Zone:** Avoid calling it a "new species" or "hybrid swarm" pejoratively. Present it as a fascinating, *stable* hybrid zone maintained by:
      *   **Disruptive Selection:** Strong selection against migrants/parentals in the canal habitat.
      *   **Assortative Mating:** The 70% homogamy based on learned cues is a significant *emerging* barrier worth highlighting, but be honest it's leaky (30% outcrossing).
      *   **Hybrid Fitness:** Their superior fitness in the novel canal habitat.
      *   Compare to her warblers (hybrid zone within a species) and forams (continuous change, arbitrary boundaries). Acknowledge its uniqueness but position it as an outcome of secondary contact between two species.
  3.  **Address the Genome:** Explain the homogenization as expected introgression *except* in regions under strong divergent selection (inversion, other small regions). The inversion is the smoking gun for maintaining species distinctiveness.
  4.  **Conservation Implications (Carefully):** Argue that the *two parental species* are distinct evolutionary lineages deserving protection based on their divergent history, genomic architecture, and ecological specialization. The canal population, while ecologically unique and valuable, is a product of recent human-mediated contact between these two species and dependent on them. Protecting the parental species and their native habitats (lake & river) is paramount. The canal population's fate hinges on maintaining the specific hybrid zone conditions.
  5.  **Use Her Language:** Use terms like "evolutionarily distinct lineages," "mechanisms maintaining cohesion/separation," "barriers to gene flow/cohesion," "independent evolutionary fate," "evidence for disruptive selection/assortative mating," "stable hybrid zone," "conventional boundaries."

  **By framing the parental species as distinct based on deep divergence and ecology, and the canal as a stable but dependent hybrid outcome of their secondary contact, you align perfectly with Halvorsen's precedents. This gives you the strongest chance of approval while accurately reflecting your complex data. Good luck with the committee!**
