  - In the no-serial, per-observer: SSA does well in world A, poorly in world B? Wait, no: in world B, SSA reports 0.5 and gets 0.75 (because the quadratic score for reporting p for A when B is true is 1-p^2). So in world B, reporting 0.5 gives 0.75. Reporting 0.17 gives 0.97. So in world B, SIA does better. But overall, since world A and B are symmetric in our die, and in world A SSA gets 0.75 and SIA gets 0.305, and in world B SSA gets 0.75 and SIA gets 0.97, then overall:

     SSA: 0.5 * 0.75 + 0.5 * 0.75 = 0.75
     SIA: 0.5 * 0.305 + 0.5 * 0.97 = 0.6375

  So SSA wins in this setup? But wait, the SIA prior is not calibrated to the die? Our die gives P(A)=1/2, but SIA has P(A)=1/6. So SIA is wrong about the prior.

  But in the problem setup, the prior is given by the die. So we should condition on the die. The SIA proponent should update on the die and their existence. The die says P(A)=1/2, but then they take into account that they exist, so they update to P(A)=1/6. But the die roll is the physical random process. The problem is that the die roll is supposed to be the prior, and then we update with anthropic information.

  In our game, the die roll is the actual decider. So the true probability of A is 1/2. Therefore, SIA is not using the correct prior? This is a problem.

  To be faithful to the original problem, we need to have the prior set by the die, and then the update is for the existence and the serial number. So the prior is 1/2 for each world, and then you update based on the fact that you are an observer (and then the serial number). In that case, SSA and SIA are two different ways to update.

  - SSA: you update by the fact that you are a randomly selected observer.
  - SIA: you update by the fact that you exist (which is more likely in a world with more observers).

  But in the standard problem, the prior is set by the die. So for SIA, the update from existence changes the prior from 1/2 to 1/6.

  In our game, the true frequency of world A is 1/2. Therefore, if the SIA proponent assigns 1/6 to A, they will be wrong more often in the A worlds. And in B worlds, they are right to assign a low probability to A, but not as low as they could.

  In our scoring, SSA gets 0.75 on average, and SIA gets 0.6375. So SSA wins.

  However, in the per-world scoring, it might be different.

  Also, in the serial number condition, for those with serial number 1 or 2, SSA assigns 5/6 to A, which is 0.83. In world A, that gives a score of 1 - (1-0.83)^2 = 1 - (0.17)^2 = 1-0.0289=0.9711. In world B, if they are #1 or #2, they are in B, so they should assign 0 to A? But under SSA, they assign 5/6 to A, so in world B they get 1 - (5/6)^2 = 1-25/36=11/36≈0.305. But world B happens half the time, and in world B, they are #1 or #2 with probability 2/10=0.2. So overall for an SSA believer:

     - In world A (prob 1/2): they are always #1 or #2, and they assign 5/6 to A: score = 0.9711.
     - In world B (prob 1/2): with probability 0.2, they are #1 or #2 and assign 5/6 to A: score = 0.305.
                       with probability 0.8, they are #3-10 and know they are in B, so assign 0 to A: score = 1 - 0^2 = 1.
     So in world B, average score for SSA = 0.2*0.305 + 0.8*1 = 0.061 + 0.8 = 0.861.
     Overall for SSA: (1/2)*0.9711 + (1/2)*0.861 = (0.9711+0.861)/2 = 0.91605.

  For SIA in the serial condition for those with low numbers:
     They always assign 1/2 to A when they are #1 or #2.
     In world A: they are always #1 or #2, so score = 1 - (1-0.5)^2 = 0.75.
     In world B: when they are #1 or #2 (20% of the time), they assign 0.5 to A: score = 1 - (0.5)^2 = 0.75.
                 when they are #3-10, they know they are in B, so assign 0 to A: score=1.
     So in world B, average score for SIA = 0.2*0.75 + 0.8*1 = 0.15+0.8=0.95.
     Overall: (1/2)*0.75 + (1/2)*0.95 = (0.75+0.95)/2 = 0.85.

  So in the serial condition, SSA does better on average (0.916 vs 0.85).

  But again, we are not forcing them to follow a particular update rule. We want to see what the participants do.

  Handling the "fifty-fifty" problem:
  - Some may say it's always 1/2. We can ask them to consider: if you are told you are #2, does that change anything? And in the data, when we reveal that those who were in world B and had serial number 1 or 2, they were in B but thought they might be in A. We can show the frequency: in the serial condition, when you are #2, how often are you in A? 
     P(A | serial=2) = 5/6 under SSA, but in truth:
          P(A and serial=2) = P(A) * P(serial=2|A) = (1/2)*(1/2)=1/4.
          P(B and serial=2) = P(B) * P(serial=2|B) = (1/2)*(1/10)=1/20.
          So P(A | serial=2) = (1/4) / (1/4 + 1/20) = (1/4)/(6/20) = 5/6.
     So it is 5/6. So if they said 1/2, they would be wrong 5/6 of the time when they are #2 and in A, and 1/6 of the time when in B and #2, they would be right? But they are only in that situation in 1/2 * 1/2 + 1/2 * 1/10 = 1/4 + 1/20 = 6/20=3/10 of the rounds. And in those rounds, if they are in A (which happens 5/6 of these rounds), they are wrong. So indeed, they should learn that when they are #2, it's more likely to be A.

  But in our game, we can show the empirical frequency. In the serial number condition, for the participants who were given serial number 1 or 2, in how many rounds was the world A? It should be about 5/6 of the time. So we can tally that in the debrief.

   Also, note that the room has 13 participants. We can lean into that: the room is a sample of the actual world. But in our game, only the actual world is realized, and we are sampling from it. So it's consistent.

  What will go wrong:
  - Some participants might not understand that the die roll is the prior.
  - In the per-world scoring, they might try to coordinate, but we should tell them to report their true belief without conferring.
  - Time: we have to run 20 rounds (5 per block) and each round takes time to roll the die, assign cards, collect responses, and reveal. We can do it faster by having pre-made packets.

  Materials:
  - Die.
  - For each round in a block, prepare:
     - For world A: 2 cards. In the serial condition, write "World A, Serial #1" and "World A, Serial #2". In the no-serial condition, just "World A".
     - For world B: 10 cards. In the serial condition, write "World B, Serial #1" to "World B, Serial #10". In the no-serial, just "World B".
  - But we might not use all in a round. We only use the cards for the actual world.

  Alternatively, we can have a bag for each world. For world A: 2 cards. For world B: 10 cards. Then when the die is rolled, we use the bag for the actual world and randomly distribute the cards to the participants (but we have to choose which participants).

  Procedure for a round in a block:

  1. Roll the die. If 1-3, world A is actual; if 4-6, world B.
  2. If world A, randomly select 2 participants. Give them the two world A cards (with or without serial as per the block). The cards are shuffled so the serial numbers are random.
  3. If world B, randomly select 10 participants and give them the world B cards.
  4. Each selected participant looks at their card. In the no-serial condition, they are told only "You are in the actual world". In the serial condition, they are told their world and serial number? No, the card says the world? That would give it away. Oh no!

  Mistake: if the card says "World A", then they know they are in A. We can't do that.

  Correction: We must not reveal the world on the card. Instead, they should be told that the actual world is either A or B, and they are in the actual world. The card only provides additional information (like the serial number) if applicable.

  So for the no-serial condition, we don't give any additional information. For the serial condition, we give them a serial number without revealing the world.

  But how? We can have the card say only "Serial # X", and then they know that if they are in world A, X must be 1 or 2, and in world B, X can be 1 to 10. But then if they get #3, they know they are in B.

  So for the serial condition, we prepare:

  - For world A: two cards: "Serial #1", "Serial #2"
  - For world B: ten cards: "Serial #1" to "Serial #10"

  Then when we assign the card, the participant sees a serial number. They do not know if they are in A or B. They only know the setup: that in A there are only two observers, so serial number 1 or 2, and in B there are 10, so 1 to 10.

  Then they can update.

  For the no-serial condition, we can give them a card that says "You are an observer in the actual world" and that's it. Or we can give no card and just tell them.

  So in the no-serial condition of the game, they know they are in the actual world, but not which one and not their serial number.

  In the serial condition, they know their serial number and that they are in the actual world.

  Then they are asked to report their probability that the actual world is A.

  We collect the responses, then we reveal the actual world.

  We do 5 rounds per block.

  Debrief:

  1. Show the average reported probability for A in the no-serial condition, split by whether they were in A or B.
     - In world A, if they are SSA, they report 0.5; if SIA, 0.17. So the average might be between.
     - In world B, SSA reports 0.5, SIA reports 0.83 for B (so 0.17 for A).

  2. Show the scores under per-observer and per-world.

  3. For the serial condition, show:
     - For those with serial number 1 or 2: 
          - What probability they assigned to A.
          - How many times they were in A and in B.
     - Also show those with higher numbers.

  4. Address the per-world scoring: does it change which strategy wins? We can compute the average score per strategy and per scoring method.

  5. Concessions:
     - If per-observer scoring, then SIA might not do as well because it is not calibrated to the die roll.
     - The early serial number flip: under SSA, it should happen; under SIA, it doesn't.
     - In per-world scoring, the group's average belief might be more important, and that might be closer to the true frequency.

  But note: the true frequency of A is 1/2, so any belief that is not 1/2 on average might be off.

   However, the update is about the information.

  Finally, the game cannot reproduce the unknown and enormous populations. We can discuss that in the debrief.

  Timeline:

  - Explain the setup: two worlds, A (2 observers) and B (10 observers). A fair die: 1-3 for A, 4-6 for B. In each round, we roll and then assign some of you to be in the actual world. You will be asked to report your probability that the world is A. We will use a quadratic scoring rule: if you report p for A, and A is true, you get 1 - (1-p)^2; if B is true, you get 1 - p^2. We will do several rounds.

  - Block 1: no serial number, per-observer scoring (each gets their own score). 5 rounds.

  - Block 2: no serial number, per-world scoring (each in the actual world gets the average score of all in their world). 5 rounds.

  - Block 3: with serial number, per-observer scoring. In this block, when you are selected, you will be given a card with a serial number. The serial number is a number between 1 and 10. In world A, only 1 and 2 are possible. In world B, 1 to 10 are possible. 5 rounds.

  - Block 4: with serial number, per-world scoring. 5 rounds.

  - Then debrief.

  Total rounds: 20. Each round: 2 minutes = 40 minutes. Plus instructions and debrief: 50 minutes for the rounds and 40 for debrief.

  Debrief outline:

  1. Collect data on the board for each block and condition.
  2. For no-serial:
     - Average reported probability for A in the rounds where the world was A.
     - In world B.
     - Compare to the SSA (0.5) and SIA (0.17).
     - Show scores: did reporting 0.5 do better than 0.17 in the per-observer scoring? It should have.
     - In per-world scoring, what happened to the scores? 

  3. For serial condition:
     - For trials where the participant had serial number 1 or 2:
          - How many times was the world A? (should be about 5/6 of the time)
          - What was the average probability they reported for A? 
          - Compare to SSA (5/6) and SIA (1/2).
     - Show the scores for these participants.

  4. Discuss the per-world scoring: how did it change the scores for different strategies? It may have smoothed out the differences.

  5. Concessions:
     - The edge from self-indication in the per-observer scoring comes from the fact that in the large world, there are more winners, but that is only if we count per observer. In per-world scoring, that edge goes away, but then it's not clear what we are optimizing for.
     - The early serial number should make the self-sampling people update to the small world, and the data should show that they are right to do so (because indeed 5/6 of the time when you are #2, it is the small world).

  6. What the game doesn't show: 
     - In the real disagreement, the population sizes are unknown and huge, and we are not told the prior by a die. The reference class is also a problem.

  This should fit in 90 minutes if we move quickly.
answer: |-
  ### Anthropic Betting Game: Self-Sampling vs. Self-Indication  
  **Goal:** Make the self-sampling (SSA) vs. self-indication (SIA) disagreement visceral, test the "per-observer vs. per-world scoring" objection, and force a crossover with early serial numbers.  

  ---

  ### **Setup**  
  **Materials:**  
  - 1 six-sided die (d6).  
  - 100 index cards:  
    - 50 cards: "World A (small)" on one side, blank on the other.  
    - 50 cards: "World B (large)" on one side, blank on the other.  
  - Envelopes (one per participant per round).  
  - Stickers (or pens) to write serial numbers.  
  - Scoreboard (whiteboard).  
  - Timer.  
  - Prizes (e.g., chocolate) for scoring (optional).  

  **Worlds & Rules:**  
  - **World A (small):** 2 observers.  
  - **World B (large):** 10 observers.  
  - **Prior odds:** `P(A) = P(B) = 1/2` (roll d6: 1-3 = World A, 4-6 = World B).  
  - **Per-Observer Scoring:** Each observer wins/loses based on their own bet.  
  - **Per-World Scoring:** All observers in a world split the world’s total winnings equally.  
  - **Quadratic Scoring Rule (for honest probabilities):**  
    - If you assign probability `p` to the **correct world**, score = `1 − (1 − p)²`.  
    - If you assign probability `p` to the **wrong world**, score = `1 − p²`.  
    *(Max score = 1, min = 0; encourages honest reporting.)*  

  **Participants:** 13 players. Each round, only observers in the *actual world* play. Others sit out.  

  ---

  ### **Game Flow (Total: 60–70 minutes)**  
  **Round Structure:**  
  1. **Roll for World:** Roll d6 → World A (1-3) or B (4-6).  
  2. **Assign Observers:**  
     - World A: Randomly pick 2 players.  
     - World B: Randomly pick 10 players.  
  3. **Give Info:**  
     - **No-Serial Rounds:** Envelope says "You are an observer in the actual world."  
     - **Serial Rounds:** Envelope says "You are observer #X" (randomly assign serial numbers: 1–2 for A, 1–10 for B).  
  4. **Commit to Probability:** Players write their `p(A)` (credence for World A) on a card.  
  5. **Reveal & Score:** Reveal world. Calculate scores (see below). Record on scoreboard.  

  **Blocks (5 rounds each, 20 rounds total):**  
  1. **Block 1: No Serial, Per-Observer Scoring**  
     - Players know only: "I am in the actual world (A or B)."  
     - Scores: Individual.  
  2. **Block 2: No Serial, Per-World Scoring**  
     - Same as Block 1, but scores averaged per world → split equally among observers.  
  3. **Block 3: Serial (Early #), Per-Observer Scoring**  
     - Players told: "You are observer #X" (X=1 or 2 only; reshuffle if higher).  
     - Scores: Individual.  
  4. **Block 4: Serial (Early #), Per-World Scoring**  
     - Serial numbers + averaged/split scores.  

  ---

  ### **Debrief (20–30 minutes)**  
  **Data to Display:**  
  1. **Average `p(A)` for each block:**  
     - No-Serial Blocks: SSA expects `p(A) = 0.5`, SIA expects `p(A) = 1/6 ≈ 0.17`.  
     - Serial Blocks: SSA expects `p(A) = 5/6 ≈ 0.83` (if #1 or #2), SIA expects `p(A) = 0.5`.  
  2. **Scores:** Compare per-observer vs. per-world averages.  

  **Key Discussion Points:**  
  - **Per-Observer vs. Per-World Scoring:**  
    - In Block 1 (no serial, per-observer), SIA racks up points in World B (many winners).  
    - In Block 2 (no serial, per-world), SIA’s edge *vanishes*: a world’s score is capped at 1, so large worlds don’t dominate.  
    - **Concession:** Per-world scoring nullifies SIA’s "many winners" advantage. But is it "fair"? (If you care about *collective* truth, per-world makes sense; if *individual* fate, per-observer does.)  
  - **The Serial-Number Flip:**  
    - In Block 3 (serial, per-observer), SSA players should spike `p(A)` to ~0.83. Why? Under SSA, being #2 is likelier in A (1/2 chance) than B (1/10).  
    - SIA players stay at ~0.5: existence outweighs serial number.  
    - **Concession:** If you’re #2 and *not* updating, you ignore real evidence (in this setup, P(A|#2) = 5/6 empirically).  
  - **What the Game Can’t Capture:**  
    - Real-world populations are unknown/huge → game uses fixed sizes.  
    - Betting isn’t belief → but scoring rules force honesty.  
    - Reference class is set by the gamemaster.  

  **Handling Pitfalls:**  
  - **"It’s 50-50!"**:  
    - Show empirical frequency: After 20 rounds, World A occurs ~50% of the time. But in serial rounds, tally how often #1/#2 observers *in World A* win vs. *in World B*. A should dominate 5:1. Force them to confront data.  
  - **"The room is a sample of 13!"**:  
    - *Lean in*: Yes! Under SIA, the room’s size *is* evidence for larger worlds. But here, the die fixes the prior—update from there.  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **Players resist updating from serial numbers:**  
     - **Fix:** In debrief, show the tally: When you’re #2, how often were you *actually* in A? (Should be ~5/6.) If they deny it, they deny Bayes.  
  2. **Per-world scoring causes confusion:**  
     - **Fix:** Pre-calculate an example: If 2 players in A assign `p(A)=0.8` and `p(A)=0.3`, average `p(A)=0.55` → both get `1 − (1−0.55)² = 0.7975`. Contrast with per-observer (scores differ).  
  3. **Noise from low rounds:**  
     - **Fix:** 20 rounds (~40 data points) suffices. Pool data across all players.  
  4. **SSA players dominate World A scores:**  
     - **Design feature:** In World A, SSA (p=0.5) outscores SIA (p=0.17) under per-observer scoring. That’s the point! Per-world scoring equalizes this.  

  ---

  ### **Why This Works**  
  - **Feels the conflict:** Players *experience* SSA’s serial-number update and SIA’s indifference.  
  - **Tests the objection:** Per-world scoring visibly deflates SIA’s advantage.  
  - **Concrete takeaways:**  
    - SSA concedes: Existence *is* evidence for larger worlds (in per-observer scoring).  
    - SIA concedes: Early serial numbers *are* evidence for smaller worlds (if you survive SSA’s update).  
    - Both concede: Scoring method changes what "rational" means.  

  Run it tight, and let the data force the conversation. Good luck!  

  ---  
  *Final note: This simplifies the "presumptuous philosopher" by fixing population sizes. For unknown sizes, use a follow-up discussion with priors over N (e.g., "What if we didn’t know if B had 10 or 1000 observers?").*
