  ### **Margin Comments**  
  *(Key: 🟢 = Strength | 🔴 = Problem)*  

  #### **1. Situationist Critique (6/6)**  
  🔴 **"Harman's version of the argument is the strong one... no reason to believe in character traits at all."**  
  - **Problem:** Misrepresents Harman. He denies *robust global traits* (like virtue ethics posits), not *all* character traits (he allows local/dispositional traits; e.g., "office-party-friendly"). Ignores his explicit distinction (Harman 1999).  
  - **Cost:** -0.5 (minor inaccuracy)  
  - **Tag:** DEFINITE (textual misstep).  

  🟢 **"Doris's version... global traits virtue ethics needs... turn out to be an empty posit."**  
  - **Spot-on:** Correctly captures Doris’s eliminativism about global traits.  

  #### **2. Bandwidth vs. Cost-Tolerance (5/8)**  
  🔴 **"Every study above is a case of the first, Milgram included... nothing there turns on cost."**  
  - **Problem:** Mis-sorts Milgram. Proximity conditions (e.g., learner in same room) *introduce cost*: social discomfort, confrontation, moral revulsion. Physical distance ≠ irrelevant feature; it modulates *emotional/social cost*.  
  - **Cost:** -1.5 (significant misapplication)  
  - **Tag:** DEFINITE (contradicts lecture’s taxonomy).  

  🔴 **"Cost-tolerance failure... is just bandwidth failure under another description."**  
  - **Problem:** Flattens a key conceptual distinction. Cost-tolerance tests *persistence under sacrifice* (e.g., helping when late), bandwidth tests *consistency across irrelevant cues* (e.g., dime/no dime). Conflating them undermines the reply’s force.  
  - **Cost:** -1 (conceptual blurring)  
  - **Tag:** CONTESTED (but argument is underdeveloped).  

  🟢 **"The hurry condition in Darley and Batson... is an irrelevant feature... not a price."**  
  - **Correct:** Hurry is a classic bandwidth stressor (time pressure ≠ intrinsic cost of helping).  

  #### **3. Critical Assessment (4.5/11)**  
  🟢 **"The scaffolding reply... virtue ethics has never been only individual psychology... design institutions that strip out irrelevant frictions."**  
  - **Strength:** Excellent articulation of the institutional reply. Ties Aristotle to situational engineering.  

  🔴 **"Even if the critique went through entirely, all it would show is that virtue is rare... not about the theory."**  
  - **Problem:** Ignores Doris’s *existence* challenge. If *no one* has robust traits (even saints; Doris 2002), virtue ethics lacks psychological realism. "Rarity" dodges the metaphysical objection.  
  - **Cost:** -2 (major gap in engagement)  
  - **Tag:** DEFINITE (fails to test reply against critique’s core).  

  🔴 **"I take [aggregation reply] to change the subject... situationist claim is about particular occasions."**  
  - **Problem:** Mischaracterizes the aggregation defense. Situationists *target* cross-situational consistency (e.g., "honesty" at home/work), so aggregated data *is* relevant. Dismissal is question-begging.  
  - **Cost:** -1.5 (poor rebuttal handling)  
  - **Tag:** READING (uncharitable; I read this as ignoring Doris’s focus on *global* traits).  

  🔴 **"They tell us which features of an environment do the damage."**  
  - **Problem:** Overclaims. Situationism identifies *fragmentation*, not "damage." A virtue ethicist must explain why *same agent* is fragmented, not just blame "bad" situations.  
  - **Cost:** -0.5 (minor overstatement)  
  - **Tag:** CONTESTED (but weakens reply’s plausibility).  

