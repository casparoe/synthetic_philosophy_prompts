  For (2), the Middle Ages as residual category maps well to a segment defined by lack of Renaissance/Scientific Revolution features rather than unique properties - like a flat slope between changepoints.

  For (3), different domains having different changepoints directly parallels fitting separate models to different time series. The lack of overlapping confidence intervals would question a single "period" model.

