prompt: |-
  Hi — please act as a professional philosopher working on social ontology and the morality of everyday conventions, think this through carefully, and do a bit of unstructured brainstorming before you commit to anything. British English throughout, please.

  The situation: I'm four months into a locum job in a city that runs differently from home. (1) Tipping: wages in restaurants are set on the assumption that customers top up the bill, so a non-tipper doesnt just fail to be generous, they leave a particular worker short. (2) Queues: they exist, but people save places and friends join friends, and locals don't treat that as cheating — still, someone does get served out of turn. (3) Jaywalking: formally illegal, universally done, never enforced.

  The theory I want you to grant rather than argue for — call it reliance-without-promising: a local convention imposes a genuine moral obligation on you (not merely a prudential reason or a rule of etiquette) just when other participants have built expectations of compliance into their own planning in a way your non-compliance would set back, even though none of them knows you or anticipated your arrival. Pair it with a distinction I lean on: additive conventions, where each act of compliance adds a small benefit to a pool and any single defection barely registers (tipping); positional conventions, where one defection determinately takes something from an identifiable person (queueing); and dead-letter rules, where the official norm and the actual practice have come apart (jaywalking).

  What are the most important implications of that package for how someone in my position should act — and, more interestingly, for whether "follow the local convention" is even the right shape of an answer? I care most about the implications that arent visible straight off the set-up: whether the mere fact that I fly home in four months does any work at all on this view, whether the locals' second-order habit of excusing foreigners cancels an obligation or quietly creates one, and where the view gives a different verdict from the usual one about each of the three cases. Keep it to the implications that actually matter.
reasoning: |-
  Alright, let me start by unpacking the user's query. They're in a locum position in a new city with different conventions around tipping, queueing, and jaywalking. They've presented a theoretical framework—reliance-without-promising—and a classification of conventions into additive, positional, and dead-letter rules. The user wants to know how they should act given these norms, especially considering their temporary status and the locals' attitudes towards foreigners.

  First, I need to grasp the core of their theory. The idea is that moral obligations arise when others rely on compliance for their planning, even without explicit promises. The three convention types are crucial here. Tipping is additive, where each tip contributes to a pool. Queueing is positional, where cutting in line directly affects someone. Jaywalking is a dead-letter rule, where the law isn't enforced.

  The user's deeper concerns might be about their role as a temporary outsider. They mention flying home in four months and locals excusing foreigners. How does temporariness affect obligation? Also, they want non-obvious implications—beyond just "follow local customs." They’re questioning if that's even the right approach.

  Let me break down each case. For tipping (additive), the obligation is clear because workers rely on tips for wages. Non-compliance harms specific individuals. But the user’s temporariness might not matter since each tip is independent. Locals excusing foreigners could create a hidden obligation—being aware of this might mean they should tip to avoid exploiting that leniency.

  Queueing (positional) is trickier. Saving spots is accepted locally, so not following might disrupt the system. But as a foreigner, they might be excused. However, the positional harm—someone losing their spot—is direct. The user should comply conditionally: if joining a friend, it's okay if the group stays together. But queueing solo requires adherence. Temporariness doesn’t exempt them; harm is immediate.

  Jaywalking (dead-letter) is different. No one relies on compliance. Police don't enforce it, and pedestrians expect jaywalking. So no moral obligation. But safety and not causing accidents are separate issues. Temporariness is irrelevant here.

  Now, the locals' second-order habit of excusing foreigners. This is interesting. If locals don't expect compliance from foreigners, does that cancel the obligation? Or does it create a new one to not exploit that kindness? The user might have a duty to comply precisely because they're excused—to avoid free-riding. This is a non-obvious point they’d appreciate.

  Also, "follow local convention" might be too simplistic. For dead-letter rules, compliance isn’t needed. For positional, it’s context-dependent. Additive requires consistent participation. The user’s awareness of the reliance structures means they can’t just follow blindly; they need to assess each situation based on harm and reliance.

  Temporariness generally doesn’t affect obligations. The harm in tipping and queueing is immediate. Only if locals adjust expectations based on knowing someone is temporary might it matter, but that’s unlikely. The user’s four-month stay doesn’t change the moral calculus.

  Key implications: 
  1. Tipping: Obligation remains; excusing foreigners adds a layer of not exploiting leniency.
  2. Queueing: Participate conditionally; temporariness doesn’t exempt.
  3. Jaywalking: No obligation, but safety first.
  4. Second-order habits: Create an obligation to not take advantage, even if excused.

  The user might be seeking validation that their nuanced approach is correct. They want to navigate these norms ethically without being rigid. Highlighting the non-obvious aspects, like the duty from being excused, addresses their deeper need to understand the underlying ethics beyond surface-level compliance.
answer: |-
  Right, let's approach this methodically. As a philosopher steeped in social ontology and convention ethics, I'll grant your "reliance-without-promising" framework and convention typology. The core tension: your temporary outsider status versus the moral gravity of others' *reliance*. Brainstorming reveals several non-obvious implications:

  **Key Implications Beyond Surface Compliance:**

  1.  **Temporariness is Largely Irrelevant:** The moral obligation arises from *current participation* in the practice and the *present reliance* of others. Your four-month horizon doesn't diminish the setback to the waiter's *today* if you don't tip, or the specific person displaced *now* if you disrupt the queue logic. The obligation binds you *whilst you participate*. Thinking "I'm leaving soon" is a psychological salve, not a moral exemption.

  2.  **The "Excusing Foreigners" Trap & the Duty of Non-Exploitation:** This is crucial. Locals excusing non-compliance by foreigners might *seem* to dissolve the obligation. But your framework suggests the opposite:
      *   Their leniency is itself a *reliance structure*: they rely on the *overall* system functioning and tolerate minor, predictable deviations from outsiders. This tolerance is often conditional on *ignorance*.
      *   **Your awareness changes the game.** If you *know* the convention, the reliance structures, *and* that locals often excuse foreigners, exploiting that leniency becomes a distinct moral failing. You're knowingly benefiting from a system whose burdens others bear, while free-riding on their tolerance. The obligation isn't cancelled; it morphs into a **duty to avoid exploiting their goodwill**. Complying becomes an act of respect for *their* cooperative practice, not just avoiding direct harm.

  3.  **"Follow the Local Convention" is Too Blunt: Nuanced Participation Required:**
      *   **Additive (Tipping):** Compliance is straightforward and morally required. Each contribution matters to the individual worker's livelihood *as structured by the system*. Your non-tip *directly* leaves a specific worker short that shift. The small pool size per shift makes each tip significant. The convention's design *creates* the reliance.
      *   **Positional (Queueing):** Compliance requires understanding the *local interpretation* of "fair position." If place-saving and friend-joining are *part of the accepted convention*, then doing so isn't "defecting" – it's participating correctly. The "identifiable person" harmed isn't the one jumped *by the friend*, but the one who *would have been* behind the *entire group* if it had formed as one unit originally. Your obligation is to **understand and participate in the *local logic* of queue formation**, not impose an abstract "pure FIFO" ideal. Queueing solo? Join at the back. Meeting two friends already holding a place? Join them seamlessly. Trying to jump a solo queue claiming "position"? That likely *is* defection under the local rules.
      *   **Dead-Letter (Jaywalking):** Here, "follow the convention" is *not* morally required *under your framework*. The key is the **lack of genuine, planning-relevant reliance**:
          *   *Drivers/Pedestrians:* They rely on *traffic flow patterns* and *mutual predictability* (e.g., crossing at lights, crossing decisively when safe), not on universal adherence to the unenforced law. They plan for *actual* jaywalking behaviour.
          *   *Authorities:* They demonstrably *do not* rely on compliance for planning (e.g., traffic light timing, enforcement resource allocation), as evidenced by non-enforcement.
          *   The "official norm" is inert. The *actual* convention governing behaviour (cross safely when practical) imposes no reliance structure harmed by your jaywalking *if done safely and predictably*. The obligation vanishes for dead letters. Safety and prudence remain, but they aren't *convention-driven* obligations in this case.

  4.  **The Insidious Harm of "Minor" Defection in Positional Contexts:** While queue-jumping *feels* minor, your framework highlights its unique moral character under positional conventions. Unlike tipping (where your £5 missing is diluted), skipping the queue determinately sets back *one specific, identifiable individual* – the person now behind you who would have been served sooner. This direct, non-diffuse harm amplifies the moral wrong compared to an additive defection of similar "size." Locals' acceptance of place-saving doesn't negate this; it redefines what counts as "taking a position" fairly.

  **Verdicts vs. "Usual" Advice & Key Implications:**

  *   **Tipping:**
      *   *Usual Advice:* "Tip 15-20%, it's expected/customary."
      *   *Your Framework Verdict:* **Strong moral obligation.** Non-compliance directly sets back a specific worker's expected income integrated into their financial planning. Locals' potential excuse for foreigners creates a *further* obligation to not exploit it. Temporariness irrelevant.
      *   *Implication:* Not tipping isn't just rude; it's a direct, unjust setback to a worker's legitimate expectations within the wage system.

  *   **Queueing:**
      *   *Usual Advice:* "Join the back, don't push in." (Often ignores local place-saving norms).
      *   *Your Framework Verdict:* **Obligation to participate according to the *local* convention's logic.** If place-saving/friend-joining is accepted, doing so is *compliant* and non-harmful. *Ignoring* these rules to enforce a "pure" queue *would* be defection/disruptive. However, exploiting ambiguity or *exceeding* local norms (e.g., saving a place for 10 people) likely *is* defection harming identifiable others.
      *   *Implication:* The moral demand isn't "don't join friends," it's "**understand and integrate into the local flow**." Your harm isn't to the person immediately "behind" your friend, but to everyone *behind the now-larger group*.

  *   **Jaywalking:**
      *   *Usual Advice:* "It's illegal, don't do it" (often hypocritical) or "Just do what everyone else does."
      *   *Your Framework Verdict:* **No moral obligation stemming from the convention/dead-letter rule.** Reliance structures don't hinge on obeying the unenforced law. Compliance with the *actual, functional* norm (cross safely/predictably) is prudent but not convention-morally required.
      *   *Implication:* Feeling guilty for jaywalking *based on the official rule* is misplaced under this view. The focus shifts entirely to safety and not causing accidents (general moral duties), not convention-compliance.

  **Most Important Conclusions:**

  1.  **Participation, Not Permanence, Binds You:** Your moral obligations activate when you engage with the system (dining, queuing, crossing roads). Your departure date is irrelevant.
  2.  **Awareness Triggers Non-Exploitation:** Knowing locals *might* excuse foreigners doesn't absolve you; it imposes a **duty to not take undue advantage** of their leniency, strengthening the case for compliance out of respect.
  3.  **Convention Type Dictates Moral Structure:** "Follow the local convention" needs unpacking:
      *   *Additive:* Comply strictly; individual harm is direct.
      *   *Positional:* Comply with the *local interpretation* of fair position; harm is specific and non-diffuse.
      *   *Dead-Letter:* No compliance obligation to the dead rule; follow the *functional* practice for safety/predictability.
  4.  **The Hidden Obligation in Leniency:** The most significant non-obvious point. The locals' second-order habit of excusing foreigners doesn't cancel your primary obligation; it potentially creates a **secondary obligation to not exploit their tolerance**, making compliance *more* ethically weighty, not less.

  Your framework moves ethics beyond mere cultural sensitivity ("do as the Romans do") or rule-following. It grounds obligation in the **tangible, if invisible, architecture of reliance** others build around shared practices. Acting rightly means navigating this architecture with respect for its participants, even – perhaps especially – as a temporary resident aware of your privileged position within their system of tolerance.
