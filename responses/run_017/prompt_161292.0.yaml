  We are designing a fellowship agenda for theoretical work on the Escalating Sortition Legislature (ESL), with a focus on binding power and legitimacy. The foundation's goal is to fund work that will most significantly advance our understanding of whether and how such a legislature could be legitimate and effective.

  Criteria for prioritization:

  1. **Upstreamness (U)**: How fundamental is the question to other questions? Does resolving it unlock progress elsewhere? High upstreamness is desirable because it can have cascading benefits.

  2. **Tractability without empirical data (T)**: Can the question be productively addressed by theorists using conceptual, normative, or formal methods without new empirical data? We must avoid topics that require fieldwork, surveys, or experiments.

  3. **Neglectedness (N)**: Is the question currently under-explored? A more neglected question may yield higher marginal returns. However, we should not avoid a crowded area if it is critical and unresolved.

  4. **Impact on ESL design and legitimacy judgment (I)**: How much would answering the question change the design of the ESL or our assessment of its legitimacy? High impact is crucial.

  We weigh these criteria as follows: 
  - Impact (I) is the most important because the foundation's core goal is to change our thinking about binding sortition. 
  - Upstreamness (U) is next because foundational questions can enable progress on many downstream issues. 
  - Tractability (T) is essential because the fellowship constraints rule out empirical work. 
  - Neglectedness (N) is a tiebreaker; we prefer neglected questions but will prioritize important ones even if crowded.

  Brainstorming at least 12 candidate questions:

  1. **Legitimacy Basis of Binding Sortition (vs. Election)**: What makes rule by lot legitimate? How does it compare to the consent-based legitimacy of elections? (U: High, T: High, N: Medium, I: High)  
  2. **Stratification and Political Equality**: Does stratified sampling (e.g., by demographics) undermine the claim of political equality in sortition? (U: Medium, T: High, N: Low, I: Medium)  
  3. **Epistemic Competence of Rotating Amateurs**: How can rotating non-experts achieve necessary competence without creating a permanent expert class? (U: High, T: Medium, N: Medium, I: High)  
  4. **Lottery Recall Legitimacy**: Can a random sample legitimately judge and dissolve another random sample? (U: High, T: High, N: High, I: High)  
  5. **Agenda Capture in Small Chambers**: How can we prevent the small Agenda Chamber from being captured by organized interests? (U: Medium, T: Medium, N: Medium, I: High)  
  6. **Stability without Electoral Feedback**: How does a system without elections maintain stability and prevent chaos? (U: High, T: High, N: High, I: High)  
  7. **Accountability without Reelection**: What does accountability mean in the absence of electoral sanctions? (U: High, T: High, N: Medium, I: High)  
  8. **Comparative Legitimacy Conditions**: Under what conditions is binding sortition preferable to elected representation? (U: High, T: High, N: Medium, I: High)  
  9. **Constitutional Chamber's Role**: How should the Constitutional Chamber be designed to handle constitutional questions without becoming a supreme court? (U: Medium, T: High, N: High, I: Medium)  
  10. **Rotation Cycles and Institutional Memory**: How short can rotation cycles be without losing institutional memory, and how to preserve it? (U: Medium, T: Medium, N: Low, I: Medium)  
  11. **Deliberative Quality across Chambers**: How to ensure deliberative quality when proposals escalate from a small to a larger chamber? (U: Medium, T: Medium, N: Medium, I: Medium)  
  12. **Interaction with Organized Interests**: How does sortition interact with lobbying and interest groups? (U: Medium, T: Low, N: Medium, I: Medium)  
  13. **Public Perception and Trust**: How would the public perceive the legitimacy of a binding sortition body? (U: Medium, T: Low [requires empirical data], N: Medium, I: High) -- *But note: tractability issue.*  
  14. **Incentive Structures for Participants**: What incentives drive participants in a sortition system, and how do they affect behavior? (U: Medium, T: Medium, N: Medium, I: Medium)  
  15. **Error Correction Mechanisms**: How can the system correct errors made by one chamber without undermining its authority? (U: Medium, T: High, N: High, I: Medium)  
  16. **Scalability and Federalism**: How could ESL work in large or federal systems? (U: Low, T: Medium, N: High, I: Low for now)  
  17. **Rights Protection**: How can minority rights be protected in a majoritarian sortition system? (U: Medium, T: High, N: Medium, I: High)  
  18. **Lottery as a Delegation Mechanism**: Is sortition a form of delegation, and if so, how does it compare to electoral delegation? (U: High, T: High, N: Medium, I: High)  

  Now, we compress and rank. We must avoid questions with low tractability (like public perception, which requires surveys) and low impact. We also prioritize upstream questions.

  Ranked Agenda (5-8 questions):

  1. **The Basis of Legitimacy for Binding Sortition**  
     - *Ranking Reason*: This is the most upstream and fundamental question. Without a clear legitimacy basis, the entire project of binding sortition is questionable. It directly impacts the foundation's core question ("whether... legitimately exercise binding power").  
     - *Dependencies*: Answers to this question underpin the legitimacy of Lottery Recall, the authority of the chambers, and the comparison to electoral systems.  
     - *Progress Indicators*: A clear normative framework that establishes when and why sortition can be binding. If no such framework emerges, it might undermine the entire ESL design.  
     - *Tractability*: High; it is a classic question in political theory and can be addressed normatively.  
     - *Impact*: High; it changes how we view the ESL's very right to rule.  
     - *Neglectedness*: Medium; some work exists, but not enough in the context of binding power.  

  2. **The Moral and Strategic Significance of Lottery Recall**  
     - *Ranking Reason*: This is a unique and critical feature of the ESL. It directly addresses accountability and legitimacy in a system without elections. It is highly upstream because it defines how the system self-regulates.  
     - *Dependencies*: It depends on the legitimacy basis (Q1) but also informs accountability without reelection (Q7) and error correction.  
     - *Progress Indicators*: A theory of when and how a random sample can judge another, including the supermajority threshold and mandate definition. If this mechanism is deemed illegitimate or unstable, the ESL design would need major revision.  
     - *Tractability*: High; it involves normative reasoning about authority and delegation.  
     - *Impact*: High; Lottery Recall is a novel feature, and its analysis could make or break the ESL's viability.  
     - *Neglectedness*: High; this specific mechanism is under-theorized.  

  3. **Accountability without Reelection: Conceptual Foundations**  
     - *Ranking Reason*: Accountability is central to legitimacy. In the absence of elections, we must redefine accountability. This question is upstream for stability, error correction, and public trust.  
     - *Dependencies*: Builds on legitimacy (Q1) and informs Lottery Recall (Q2) and participant incentives.  
     - *Progress Indicators*: A coherent account of how rotating citizens can be held accountable, possibly through mechanisms like Lottery Recall, transparency, or reason-giving.  
     - *Tractability*: High; it's a conceptual question.  
     - *Impact*: High; without accountability, binding power seems dangerous.  
     - *Neglectedness*: Medium; accountability in sortition is discussed but not deeply in binding contexts.  

  4. **Epistemic Competence of Rotating Amateurs and the Role of Expertise**  
     - *Ranking Reason*: The ESL's effectiveness hinges on its ability to make good decisions. This question addresses how non-experts can handle complex issues without creating a permanent elite.  
     - *Dependencies*: Affects all chambers' design, especially the Agenda Chamber's vulnerability to capture and the need for expert input.  
     - *Progress Indicators*: Design principles for balancing lay judgment with necessary expertise, e.g., through staff support or expert witnesses without granting them power.  
     - *Tractability*: Medium; it requires some assumptions about human cognition but can be addressed theoretically.  
     - *Impact*: High; if the ESL is epistemically weak, it loses legitimacy.  
     - *Neglectedness*: Medium; competence in minipublics is studied, but less so in binding, rotating legislatures.  

  5. **Agenda Capture and Defense against Organized Interests**  
     - *Ranking Reason*: The small Agenda Chamber is particularly vulnerable to capture. This question is critical for the ESL's integrity.  
     - *Dependencies*: Relies on understanding incentives (Q14) and interacts with expertise (Q4).  
     - *Progress Indicators*: Theoretical models of how organized interests might infiltrate and how to shield the chamber (e.g., via randomization, secrecy, or Lottery Recall).  
     - *Tractability*: Medium; it can be modeled using game theory or institutional analysis.  
     - *Impact*: High; capture would delegitimize the ESL.  
     - *Neglectedness*: Medium; sortition's resistance to capture is often asserted but not deeply analyzed.  

  6. **Stability without Electoral Feedback: Dynamic Legitimacy**  
     - *Ranking Reason*: Electoral systems have a built-in feedback loop. How can a sortition system achieve stability over time? This is crucial for long-term viability.  
     - *Dependencies*: Builds on legitimacy (Q1), accountability (Q3), and Lottery Recall (Q2).  
     - *Progress Indicators*: A theory of how the ESL maintains equilibrium, including responses to crises and shifting public opinion.  
     - *Tractability*: High; it can be explored through dynamic models or historical analogy.  
     - *Impact*: High; instability would doom the ESL.  
     - *Neglectedness*: High; little work exists on the dynamics of pure sortition systems.  

  7. **Conditions for Preferring Binding Sortition over Elected Representation**  
     - *Ranking Reason*: This comparative question helps justify the ESL in specific contexts. It is downstream but high-impact for the foundation's mission.  
     - *Dependencies*: Requires answers to legitimacy (Q1), competence (Q4), and accountability (Q3).  
     - *Progress Indicators*: A set of criteria (e.g., corruption levels, polarization) that indicate when sortition is superior.  
     - *Tractability*: High; it's a normative and comparative institutional analysis.  
     - *Impact*: High; it tells the foundation when to advocate for ESL.  
     - *Neglectedness*: Medium; comparisons exist but not systematically for binding legislatures.  

  Excluded questions with reasons:  
  - Stratification and Political Equality (Q2): Important, but well-trodden; impact on ESL is indirect.  
  - Constitutional Chamber Design (Q9): Important but more downstream; depends on higher-ranked questions.  
  - Public Perception (Q13): High impact but intractable without empirical data.  
  - Rotation and Institutional Memory (Q10): Medium impact; solutions (e.g., staff) are more design than theory.  
  - Rights Protection (Q17): Critical, but can be incorporated in constitutional design (which is downstream).  

  Final ranked list of 7 questions (within 5-8 range):  
  1. Legitimacy Basis  
  2. Lottery Recall  
  3. Accountability without Reelection  
  4. Epistemic Competence  
  5. Agenda Capture  
  6. Stability without Elections  
  7. Comparative Legitimacy Conditions  

  Each fellowship could address one or more of these. The ranking may shift if, for example, early work on legitimacy (Q1) reveals that binding sortition is only legitimate under very narrow conditions, which would elevate the comparative question (Q7). Alternatively, if Lottery Recall (Q2) is shown to be incoherent, it would require redesign and lower its rank until resolved. The foundation should monitor progress and adjust funding emphasis accordingly.
answer: |-
  ### Criteria for Prioritization
  I prioritize questions using four criteria, weighted as follows:
  1. **Impact on ESL Legitimacy/Design (I)**: Highest weight (40%). Questions must directly affect whether binding power is justifiable or how the ESL must be structured. Changes to legitimacy judgments or core mechanics are paramount.
  2. **Upstreamness (U)**: High weight (30%). Foundational questions that unlock progress elsewhere prevent wasted effort on downstream issues.
  3. **Tractability Without Data (T)**: Critical constraint (20%). Work must be feasible through pure theory (e.g., normative philosophy, game theory, institutional modeling). Topics requiring empirical data are deprioritized unless reframable.
  4. **Neglectedness (N)**: Lower weight (10%). Crowded topics are acceptable if unresolved and high-impact, but marginal gains favor underexplored angles.

  Ties favor high-impact, upstream questions. I deprioritize overly applied design (e.g., cycle lengths) or topics intractable without data (e.g., public perception).

  ### Brainstormed Candidate Questions (12+)
  1. **Legitimacy Basis of Binding Sortition**  
     - *U*: High (underpins all else). *T*: High (normative theory). *N*: Medium (discussed but unresolved for binding power). *I*: High (legitimacy is core to the foundation’s goal).  
  2. **Lottery Recall’s Moral Coherence**  
     - *U*: High (affects accountability design). *T*: High (conceptual analysis). *N*: High (rarely examined). *I*: High (unique to ESL; failure invalidates the model).  
  3. **Epistemic Competence of Rotating Amateurs**  
     - *U*: Medium (informs chamber design). *T*: Medium (requires modeling cognition theoretically). *N*: Low (well-trodden but incomplete). *I*: High (competence affects legitimacy).  
  4. **Agenda Capture in Small Chambers**  
     - *U*: Medium (upstream of anti-corruption features). *T*: Medium (game-theoretic modeling feasible). *N*: High (stratified chambers understudied for capture). *I*: High (capture voids deliberative quality).  
  5. **Accountability Without Reelection**  
     - *U*: High (ties to legitimacy and recall). *T*: High (conceptual work). *N*: Medium (discussed but not for binding bodies). *I*: High (accountability deficit threatens legitimacy).  
  6. **Stability Without Electoral Feedback**  
     - *U*: High (affects system viability). *T*: High (dynamic systems modeling). *N*: High (sortition stability is neglected). *I*: High (instability risks collapse).  
  7. **Stratified Sampling and Political Equality**  
     - *U*: Low (downstream of legitimacy). *T*: High (normative analysis). *N*: Low (crowded). *I*: Medium (impacts equality claims but design-specific).  
  8. **Constitutional Chamber’s Authority Limits**  
     - *U*: Medium (upstream of escalation rules). *T*: High (constitutional theory). *N*: High (novel in sortition context). *I*: Medium (design-specific but critical for boundaries).  
  9. **Interest Group Influence in Sortition**  
     - *U*: Medium (informs capture defenses). *T*: Low (requires empirical data). *N*: Medium. *I*: Medium (deprioritized: intractable without data).  
  10. **Public Reason and Deliberative Integrity**  
      - *U*: Medium (underpins deliberation quality). *T*: High (deliberative theory). *N*: Medium. *I*: Medium (indirectly affects legitimacy).  
  11. **Error Correction Mechanisms**  
      - *U*: Medium (relies on recall/accountability). *T*: High (institutional design theory). *N*: High. *I*: High (errors could delegitimize binding power).  
  12. **Comparative Legitimacy: Sortition vs. Election**  
      - *U*: High (justifies ESL existence). *T*: High (normative comparison). *N*: Medium. *I*: High (foundation’s core practical question).  
  13. **Incentive Structures for Participants**  
      - *U*: Medium (affects behavior). *T*: Medium (theoretical behavioral models). *N*: High. *I*: Medium (indirect; covered by accountability).  
  14. **Rights Protection in Majoritarian Sortition**  
      - *U*: Low (downstream). *T*: High. *N*: Medium. *I*: Medium (constitutional chamber addresses this).  
  15. **Scalability and Federalism**  
      - *U*: Low. *T*: Medium. *N*: High. *I*: Low (premature for foundational theory).  

  ### Ranked Fellowship Agenda (7 Questions)
  **1. Legitimacy Basis of Binding Sortition**  
  *Why #1?* This is the most upstream question, with sweeping impact (I) on every aspect of the ESL. If sortition cannot be defended as a legitimate source of binding power, the project collapses. It underpins Lottery Recall, accountability, and comparative assessments (U). Tractability (T) is high: normative theorists can engage democratic first principles (e.g., equality, fairness, authorization) without data. While not entirely neglected (N medium), its application to *binding* (not advisory) sortition is underdeveloped.  
  *Dependencies*: Resolving legitimacy informs Q2 (Lottery Recall), Q3 (accountability), and Q7 (comparative legitimacy). Unresolved, it stalls progress elsewhere.  
  *Progress Indicators*: A successful theory would specify conditions under which random selection justifies coercion (e.g., fairness in inclusion, immunity to corruption). If no such theory emerges, the ESL is indefensible, deprioritizing lower-ranked questions. If theorists establish even a narrow legitimacy basis (e.g., for specific domains), it elevates Q7.

  **2. Lottery Recall’s Moral and Strategic Coherence**  
  *Why #2?* This novel mechanism is central to the ESL’s accountability framework. Its legitimacy is highly upstream (U) for error correction, chamber dissolution, and public trust. Impact (I) is maximal: if a random sample cannot judge another’s mandate, the ESL lacks a critical safeguard, risking tyranny or chaos. Tractability (T) is high—conceptual analysis can address whether "citizen juries" have standing to review peers, and game theory can model strategic abuse (e.g., factions triggering recalls). It is highly neglected (N).  
  *Dependencies*: Builds on Q1 (legitimacy) but also enables Q5 (stability) and Q6 (agenda capture defenses). If incoherent, the ESL design requires overhaul.  
  *Progress Indicators*: Clarifying the conditions for legitimate recall (e.g., mandate definitions, supermajority thresholds) or proving it inevitably leads to anarchic cycles. If recall is deemed viable only with strict epistemic safeguards, it elevates Q4 (competence). Failure here could collapse the entire model.

  **3. Accountability Without Reelection**  
  *Why #3?* Accountability is the twin pillar of legitimacy (I high). Rotating bodies lack electoral sanctions, so ESL requires redefining accountability—e.g., via transparency, reason-giving, or Lottery Recall. This is upstream (U) for stability (Q5) and participant incentives. Tractability (T) is high: conceptual work can draw from trusteeship theory or non-electoral accountability (e.g., juries). Neglectedness (N) is medium; sortition discussions often assume accountability is inherent.  
  *Dependencies*: Relies on Q1 (legitimacy) and informs Q2 (recall as an accountability tool). Also crucial for Q4 (competence demands accountability).  
  *Progress Indicators*: A framework defining "sortition accountability" (e.g., retrospective judgment by peers/public) or revealing irreconcilable gaps. If accountability is only possible with permanent oversight bodies, it forces redesign, elevating Q5 (stability). Success here could simplify recall mechanics.

  **4. Epistemic Competence of Rotating Amateurs**  
  *Why #4?* Competence affects legitimacy (I high): if ESL chambers cannot process complex issues, binding power is reckless. Upstreamness (U) is medium; it informs chamber size, rotation, and expert consultation rules. Tractability (T) is medium—theorists can model statistical competence (e.g., Condorcet theorems) or deliberation’s epistemic value, but requires assumptions about human rationality. Neglectedness (N) medium; minipublic studies exist, but not for binding, rotating legislatures.  
  *Dependencies*: Enables defenses against agenda capture (Q6) and supports Q2/Q3 (competent recall/accountability). Failure here questions ESL’s basic viability.  
  *Progress Indicators*: Theoretical models showing how amateur rotation aggregates wisdom (or amplifies error) and protocols for using experts without creating a permanent class. If competence requires untenable chamber sizes, it forces redesign. Success here could ease concerns in Q5/Q6.

  **5. Stability Without Electoral Feedback**  
  *Why #5?* ESL lacks electoral pressure to correct errors or build coalitions, risking volatile policy swings or deadlock (I high). Upstreamness (U) high—stability theories affect design longevity. Tractability (T) high: dynamical systems modeling (e.g., equilibrium analysis) can explore how Lottery Recall or constitutional escalation prevents chaos. Highly neglected (N).  
  *Dependencies*: Builds on Q2 (recall as a stabilizer), Q3 (accountability as a constraint), and Q4 (competence reduces errors causing instability).  
  *Progress Indicators*: Identifying conditions for equilibrium (e.g., recall thresholds that deter frivolous dissolution) or proving inevitable descent into chaos. If stability requires unacceptable trade-offs (e.g., paralyzing recall threats), it elevates Q6 (agenda capture defenses as stabilizers). This question could rise if Q2/Q3 show recall/accountability is fragile.

  **6. Agenda Capture in Small Agenda Chambers**  
  *Why #6?* A stratified but small chamber is vulnerable to lobbying or internal bias, distorting proposals before deliberation (I high). While less upstream (U medium), solutions are design-critical. Tractability (T) medium: game theory can model capture incentives (e.g., information asymmetry) and defenses (e.g., randomization, secrecy). Neglectedness (N) high, as small stratified bodies are understudied.  
  *Dependencies*: Relies on Q4 (competence reduces susceptibility) and Q5 (capture fuels instability). Informs constitutional escalation rules.  
  *Progress Indicators*: Theoretical anti-capture mechanisms (e.g., lotteries for agenda-setting roles) or proving small chambers are indefensible. If capture is inevitable, ESL may need to bypass the Agenda Chamber, elevating Q7 (comparative analysis). Falls in ranking if Q4/Q5 show competence/stability mitigates capture.

  **7. Comparative Legitimacy: When Binding Sortition Trumps Election**  
  *Why #7?* The foundation’s practical goal hinges on this downstream question (I high). It justifies investing in ESL over electoral reform. Upstreamness (U) is high for real-world adoption but relies on prior questions. Tractability (T) high: normative comparisons using criteria like corruption resistance or deliberative quality. Neglectedness (N) medium.  
  *Dependencies*: Requires answers from Q1 (legitimacy), Q3 (accountability), and Q4 (competence). Failure elsewhere sinks this; success enables advocacy.  
  *Progress Indicators*: A decision tree (e.g., prefer sortition under high polarization or electoral capture) or proving no niche exists. If theorists establish clear superiority cases, it could reorder the entire agenda. Rises if Q1–Q6 show ESL is coherent but context-dependent.

  ### Trade-offs and Agenda Dynamics
  - **Deprioritized Despite Merit**:  
    - *Stratification and Equality*: Important but downstream of legitimacy (Q1); tractable but crowded.  
    - *Constitutional Chamber Authority*: Design-specific; lower impact than core legitimacy.  
    - *Interest Group Influence*: High potential impact but intractable without data; reframe as theoretical capture models (covered in Q6).  
  - **What Changes the Ranking?**  
    - If Q1 (legitimacy) proves intractable, the agenda shifts to Q7 (comparative analysis) to salvage practical relevance.  
    - If Q2 (Lottery Recall) is shown incoherent, Q5 (stability) and Q3 (accountability) surge as redesign priorities.  
    - Empirical breakthroughs (e.g., from external studies) could elevate tractability for Q4 or Q6, but the foundation’s constraints prevent funding this.  
  - **Risk Mitigation**: Fellowships should emphasize questions where theoretical progress is feasible (Q1–Q3, Q5, Q7). Q4 and Q6 require careful framing to avoid empirical gaps.  

  This agenda targets conceptual bottlenecks. Resolving any top-four question could fundamentally alter ESL’s perceived viability, while Q5–Q7 ensure practical relevance. The sequence reflects dependency logic: legitimacy first, then critical innovations (Lottery Recall), then enabling conditions.
