answer: |-
  ## Proposal: Costly Deliberation and the Stability of Indirect Normativity  

  **Core Question:**  
  *Can an agent, under conditions of costly meta-deliberation (where each recursive "what to deliberate about?" inquiry incurs a resource cost), architecturally select a non-self-erasing synchronic deliberation procedure for her future selves?*  

  **Working Definitions:**  
  - **Deliberation:** First-order reasoning about what to do, given considerations treated as reasons.  
  - **Idealization (Procedural):** A deliberation model stripped of contingent cognitive limits but retaining structural constraints (e.g., cost depth).  
  - **Execution:** An agent’s successful deployment of a deliberation procedure in real-time reasoning.  
  - **Cost:** A resource drain (time, attention, cognitive load) imposed by each meta-deliberative act (e.g., deciding whether to consider a fact).  
  - **Depth:** The recursive level of meta-deliberation (e.g., "Should I think about X?" is depth 1; "Should I think about whether to think about X?" is depth 2).  
  - **Self-Erasure (New Term):** A property of a deliberation account where *accepting and intending to follow it* undermines the conditions necessary for its own execution (e.g., requiring spontaneity while making spontaneity impossible via self-monitoring).  

  **Why Existing Frameworks Leave the Question Open:**  
  Current approaches operate at distinct levels and lack integration:  
  1. **Ideal-Advisor Models** (e.g., Smith): Address the *synchronic* question but assume cost-free, depth-unlimited deliberation.  
  2. **Sophisticated vs. Resolute Choice** (e.g., McClennen): Tackles diachronic *architectural* coordination but treats deliberation as fixed, not procedurally malleable.  
  3. **Rule-Consequentialism:** Offers an *architectural* answer but conflates the criterion of rightness with deliberation procedures, ignoring *execution constraints*.  
  4. **Self-Effacement Literature** (e.g., Parfit): Concerns epistemic *acceptability* of theories, not feasibility of their *execution* by believers.  
  *Thus, none jointly address the meta question under costly, depth-bounded deliberation with a stability (non-erasure) constraint.*  

  **Methodology (12-Month Plan):**  
  | **Months** | **Task** | **Output** | **Rationale** |  
  |------------|----------|------------|--------------|  
  | 1–3 | Construct a **formal toy model** of costly deliberation: Agent faces choices with recursive meta-options. Each depth level costs *c*. Define "architectural choice" as selecting a future deliberation policy (e.g., "ignore fact F"). | Minimalist decision tree with cost layers | Forces precision on cost/depth tradeoffs; rules out infinite regress by design. |  
  | 4–6 | Develop **two worked cases**: (1) *Trust cultivation*: Should an agent invest cost *now* to avoid future deliberation about a partner’s reliability? (2) *Salience erasure*: Can an agent adopt a "don’t think about fairness" policy if knowing this makes fairness hyper-salient? | Narrative scenarios with annotated choice-points | Tests erasure and architectural control in concrete settings; avoids empirical survey scoping issues. |  
  | 7–9 | **Taxonomy & Erasure Scoring**: Classify synchronic procedures (e.g., "maximize expected utility," "follow rule R") by susceptibility to erasure when architectureally selected. Score against erasure test. | Typology table with erasure ratings | Directly assesses novelty of erasure vs. effacement; isolates execution fragility. |  
  | 10–12 | **Synthesis**: Integrate model, cases, and taxonomy to answer core question. Run sensitivity analyses on cost *c*. Draft article. | Fellowship article + appendix | Combines formal, narrative, and conceptual tools; meets determinate-answer requirement. |  

  *Why not alternatives?*  
  - **Survey of positions**: Existing work doesn’t engage cost-bounded meta-deliberation.  
  - **Empirical psychology**: Explores *actual* deliberation, not *idealized-but-costly* structures.  

  **Deliverables:**  
  1. **Journal Article (9,000 words)**: Argues for a determinate answer (e.g., "Only procedures with property *P* avoid erasure under costly depth constraints").  
  2. **Appendix (2 pages, negative results)**: Documents failed attempts (e.g., "All cost-free models collapse into direct normativity"; "Erasure occurred in *X* cases despite *Y*").  
  - **Utility to Generalists**: Shows *whether* stable indirect normativity is possible under plausible constraints. Appendix demonstrates intellectual rigor: negative results bound the solution space.  

  **Failure Conditions:**  
  1. **Erasure = Effacement**: Self-erasure reduces to extant self-effacement concerns upon analysis (undermining novelty).  
  2. **Costly Deliberation ≈ Bounded Rationality**: The conjecture collapses into known results about cognitive limits (e.g., Herbert Simon), failing to reveal new structure.  
  *Most feared: #1, as erasure is pivotal to the project’s distinction.*  

  **Scope Management:**  
  - **Cut**: Comparative analysis of historical positions; expansion to non-ideal agents.  
  - **Retain**: Focus on *procedural* idealization (cost/depth) + execution stability (erasure test).  
  - **To Rule-Consequentialism Skeptics**: "This project asks *how* an ideal agent deliberates *while* choosing her deliberation architecture under constraints — a question orthogonal to *which* rules maximize value. It targets the mechanics of indirectness, not its justification."  

  ---  
  This proposal isolates a novel, tractable question by fusing the architectural/meta axes with cost constraints and the erasure test. It delivers a clear verdict on the stability of indirect normativity under conditions that prevent familiar idealizations from trivializing the problem.
