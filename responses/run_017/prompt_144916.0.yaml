prompt: |-
  hey — i help run a volunteer crisis-line rota (about forty people, mostly students) and we're rewriting the one-page "what's actually expected of you" sheet we hand new volunteers, because the last version managed to both freak people out (they read every optional thing as secretly required and burned out inside two months) and let a couple of people coast (they'd describe straight-up required stuff as "going above and beyond"). my teammate priya says we should drop the moral-philosophy framing entirely and model the whole thing on a job. her pitch: the job description is your duty — written down in advance, you're blameworthy if you skip it, nobody thanks you for doing it. anything past that is overtime: genuinely optional, genuinely praiseworthy if done, zero blame if you clock off. she says that gives us a stable line we can actually print, and it also settles the thing we kept going in circles on — that an act doesn't stop being supererogatory (good but not required, "beyond duty") just because it happens to be easy and the stakes are enormous: you don't get fired for not doing a coworker's job, so likewise you're not obliged to give a kidney to a stranger just because the surgery is low-risk and it saves a life.

  i half buy it, but i can feel the analogy carrying weight it hasn't paid for, and the sheet is due sunday. so: can you audit it? start with the correspondence table — employee, employer, job description, employment contract, wage, overtime, being fired, the bonus, the performance review, the coworker who always stays late — and what each of those maps onto in the moral case, with an explicit question mark where there's nothing to map onto. then the disanalogies, sorted into ones that actually matter for our use and ones that don't. the ones i keep tripping over: (1) the ratchet — we had a volunteer who took every horrible shift for a year, and now new volunteers get side-eyed for not doing the same, and her old shifts feel de facto required; in a job, doing overtime never amends the contract, but here it seems to, which is bad news for "we'll just write the list down." (2) you can quit a job — you consented to the description and can walk — whereas you can't resign from morality, so it's unclear where the line gets its authority from at all. (3) overtime praise seems to presuppose somebody whose interests fix the baseline and who could legitimately ask for more at the next review; in the moral case who would that be, and if there is no one, is our "job description" just a record of what people here happen to do? (4) the escalation ladder we built for the sheet — hold a stranger's door, return a dropped wallet, stay twenty minutes late to cover a gap, take the christmas shifts, drive across town at 3am, donate a kidney — where, if anywhere, does optional flip to required? priya says never, but then i worry the job framing quietly makes everything optional (there's no boss to fire you) or, worse, makes the line whatever we happened to type up, which is circular for our purposes. (5) also, in a job nobody thanks you for doing your job, but people absolutely do thank volunteers for doing the baseline things, and we're not sure whether to put "say thank you" on the sheet as a requirement.

  what i want to know at the end is whether priya's second conclusion — that easiness plus huge stakes never converts the optional into the required, so the kidney case stays supererogatory — actually survives once the disanalogies are on the table, or whether the job picture was doing that work the whole time. and if there's a better analogy for a group like ours that isn't just whatever we wrote on the sheet with extra steps, i'd take it. keep it usable: flag which disanalogies should change what actually goes on the page.
reasoning: |-
  Okay, the user is part of a volunteer crisis-line team and they're struggling with creating a clear "expectations" sheet for new volunteers. The previous version caused problems—some volunteers felt overwhelmed thinking optional tasks were mandatory and burned out, while others treated required duties as optional. Their teammate Priya suggests using a job description analogy to distinguish between duties (required) and overtime (optional/praiseworthy). The user is skeptical and wants me to audit this analogy.

  First, I need to break down Priya's job analogy mapping. Let's list the job elements and see what they correspond to in the volunteer context. Employee is the volunteer, employer is the organization (crisis line), job description is the list of required duties, employment contract is the volunteer agreement, wage is the moral satisfaction or experience, overtime is extra volunteer efforts, being fired is being removed from the roster, bonus is public recognition, performance review is feedback sessions. Some elements like a formal wage don't map perfectly since volunteers aren't paid.

  Now, the user mentioned several disanalogies. The first is the "ratchet effect" where volunteers who go above and beyond set a new expectation. In a job, overtime doesn't change the contract, but here it might create peer pressure. This is a real problem because it could lead to burnout if new volunteers feel pressured to match past efforts. The sheet needs to explicitly state that required duties won't change without formal updates.

  The second issue is quitting versus moral obligations. Volunteers can quit, but morality feels inescapable. The authority here comes from the organizational agreement, not universal morality. The expectations sheet should clarify that the duties are organizational requirements, not moral absolutes.

  Third, who sets the baseline? In a job, the employer does, but in volunteering, it's a collective agreement. The sheet should explain that the duties are based on the organization's needs and consensus, making it clear and avoiding circularity.

  Fourth, the escalation ladder—where does optional become required? Priya argues never, but the user worries that without enforcement, everything feels optional. The analogy might imply that since there's no boss, volunteers could slack off. The solution is to enforce the duties through peer accountability and consequences like removal, emphasizing that the duties are mandatory for the role.

  Fifth, thanking volunteers. In jobs, you're not thanked for doing your job, but volunteers often are. The sheet should encourage gratitude to maintain morale without undermining the duties.

  The user's main concern is whether the kidney example (easy, high stakes) remains supererogatory under this analogy. After considering the disanalogies, the key is separating organizational duties from personal morality. The crisis line duties are defined by the organization, so donating a kidney isn't part of the job description. However, in a moral context, some might argue it's required, but that's beyond the sheet's scope. The sheet should stick to organizational expectations.

  For the sheet itself, I need to provide actionable advice. Use clear language: "Required Duties" vs. "Optional/Praiseworthy Extras." Include a "No Ratchet" clause, explaining that extra efforts don't change requirements. Address gratitude by encouraging thanks but not listing it as a duty. Emphasize enforceability through peer review and consequences. Avoid philosophical terms, keep it practical.

  Alternative analogies: Team sports have positions and roles, but might imply competition. Club membership has rules, but lacks structure. The job analogy is still the most relatable. Strengthen it by clarifying the organization as the authority and duties as role-specific.

  Finally, ensure the conclusion about supererogation holds: within the organization's framework, extra acts like covering shifts are optional. The kidney example isn't relevant to the crisis line duties, so the analogy works for their context. The sheet must explicitly state that duties are organizational, not moral.
answer: |-
  Here's a full audit of Priya's job analogy for your volunteer expectations sheet, structured for actionable use:

  ### Correspondence Table (Job → Volunteer Context)
  | **Job Element**         | **Volunteer Mapping**                               | **Notes**                                  |
  |-------------------------|----------------------------------------------------|-------------------------------------------|
  | Employee                | Volunteer                                          | Direct match.                             |
  | Employer                | Crisis Line Organization                           | Authority setting expectations.           |
  | Job Description         | **Required Duties** (Written, baseline tasks)      | Core of the analogy. Must be explicit.    |
  | Employment Contract     | Volunteer Agreement / Signed Expectations          | Formalizes commitment.                    |
  | Wage                    | **Moral satisfaction / Training / Experience**     | Weak analogy (non-monetary "compensation"). |
  | Overtime                | **Supererogatory Acts** (Truly optional extras)    | Key distinction.                          |
  | Being Fired             | Removal from Roster                                | Enforceable consequence for neglect.      |
  | Bonus                   | Recognition / Praise                               | For going beyond.                         |
  | Performance Review      | Feedback Sessions / Check-ins                      | Quality assurance.                        |
  | Coworker Who Stays Late | Volunteer Who Consistently Does Extra              | **?** Creates ratchet risk (see below).   |

  ---

  ### Critical Disanalogies (Ranked by Impact on Your Sheet)
  1. **The Ratchet Effect**  
     - **Problem:** In jobs, overtime doesn't rewrite the JD. In volunteering, heroic volunteers *do* inflate perceived baseline expectations ("Priya always took Christmas shifts!").  
     - **Why It Matters:** Undermines the "stable written line" goal.  
     - **Fix for Your Sheet:**  
       - Add a **"No Ratchet Clause"**:  
         *"Required duties are defined solely by this document. Past volunteer actions, no matter how generous, do not amend these requirements. Expectations are reset with each roster update."*  

  2. **Authority & Enforceability**  
     - **Problem:** Jobs have legal/financial leverage; volunteering relies on social/moral commitment. "Quitting morality" isn't an option, but quitting the roster is.  
     - **Why It Matters:** Risks making duties feel arbitrary ("Who says I *have* to do this?").  
     - **Fix for Your Sheet:**  
       - **Ground duties in organizational necessity**:  
         *"These requirements exist because without them, the crisis line cannot function reliably for those in need. Your commitment is to the team and callers."*  
       - **Specify enforcement**:  
         *"Neglecting required duties may result in removal from the roster after discussion."*  

  3. **The Baseline-Setter Problem**  
     - **Problem:** In jobs, the employer sets the JD. In volunteering, if there's no "moral boss," is your JD just descriptive of current practices?  
     - **Why It Matters:** Could make the JD feel circular/invented.  
     - **Fix for Your Sheet:**  
       - **Frame duties as collaborative**:  
         *"These requirements reflect our collective agreement as a team on what’s needed to sustain this service."*  
       - **Cite concrete stakes**:  
         *"Based on 3 years of operation, missing [X duty] leads to [Y consequence] (e.g., uncovered shifts, caller drop-offs)."*  

  4. **The Kidney Problem (Easy + High Stakes)**  
     - **Problem:** Priya argues *nothing* beyond the JD is required, even low-effort/high-impact acts. But does "no moral employer" make *everything* optional?  
     - **Key Insight:** **The analogy holds *organizationally* but not *morally*.** Your sheet isn't defining universal ethics—it's defining *role-specific duties*.  
     - **Fix for Your Sheet:**  
       - **Explicitly scope your requirements**:  
         *"This list defines your duties *as a crisis line volunteer*. Acts outside this role (e.g., helping a caller offline) are personal choices, not obligations of this position."*  
       - **Keep examples role-relevant** (e.g., "covering a teammate’s shift" not "donating a kidney").  

  5. **Gratitude for Baseline Work**  
     - **Problem:** Volunteers *are* thanked for baseline duties; jobs often aren’t.  
     - **Why It Matters:** Praising baseline duties could blur the duty/overtime line.  
     - **Fix for Your Sheet:**  
       - **Separate "appreciation" from "praise"**:  
         *"Team members may express appreciation for you fulfilling duties—this recognizes your contribution but doesn’t imply the task was optional. *Extra* effort will be specifically praised."*  
       - **Do NOT list "say thank you" as a duty**—it’s cultural, not functional.  

  ---

  ### Does Priya’s Kidney Conclusion Survive?
  **Yes, but only within the organizational frame.**  
  - The job analogy **successfully isolates role obligations from broader morality**. Donating a kidney is *not your crisis line’s duty*, even if it’s easy/high-impact.  
  - **The disanalogies don’t break this** because your sheet isn’t a moral treatise—it’s a *role contract*. The "authority" is organizational sustainability, not cosmic duty.  
  - **But**: The escalation ladder (**door-holding → kidney**) mixes *role* and *universal* acts. **Solution:** Exclude non-role examples (e.g., kidney) entirely. Focus on shift coverage, documentation, etc.  

  ---

  ### Better Analogy? A Hybrid: **"Team Sport"**  
  - **Duties = Your Position’s Role** (e.g., goalkeeper must block shots).  
  - **Supererogatory = Extra Effort** (e.g., goalkeeper scoring a goal).  
  - **Advantages**:  
    - Avoids "employer" authority issues (team mutual reliance).  
    - Ratchet effect is mitigated by clear positions ("Striker isn’t expected to block shots").  
    - Gratitude is natural ("Nice save!").  
  - **How to implement**:  
    > *"Like a sports team, we rely on each person doing their position’s core tasks (listed below). Going beyond your role is welcome but never expected."*  

  ---

  ### Final Sheet Recommendations
  1. **Title**: "Your Role: What We Depend On" (avoid "job" or "moral").  
  2. **Two Clear Sections**:  
     - **"Required Duties"**: Bullet-pointed, concrete tasks.  
     - **"Optional Extras"**: Examples of praiseworthy-but-not-expected acts.  
  3. **Key Disclaimers**:  
     - *"These duties ensure we can operate. They don’t cover every moral choice in life."*  
     - *"Doing extra won’t change these requirements for you or others."*  
  4. **Enforcement Statement**:  
     *"Repeated neglect of required duties may lead to removal from the team."*  

  **Priority Fixes**: Add the **No Ratchet Clause** and **Scope Disclaimer**—they address your biggest risks. Priya’s core insight (duty vs. extra) is sound *for your context*, but these tweaks prevent the analogy from overreaching. The kidney stays supererogatory because it’s not in your team’s playbook.
