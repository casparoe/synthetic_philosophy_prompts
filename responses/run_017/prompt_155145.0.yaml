answer: |-
  Below is a two-page handout structured as a decision tree to help pure math students explore their metaphysical stance on mathematics without upfront philosophical jargon. The tree starts from acceptance of standard mathematical practice and theorems, then branches through eight concrete, mathematically intuitive questions. Positions are revealed only at the leaves, with notes on hard-to-separate views and redundant nodes. The tree yields **eight named positions** from combinations of answers.

  ---

  ### **The "Maths & Reality" Decision Tree**  
  *Start here: You accept ordinary mathematical practice (e.g., proofs, theorems, definitions) as valid and meaningful, exactly as working mathematicians use them.*

  #### **Question 1: Unverified Proofs**  
  *Consider a proof too long for any human to survey (e.g., a computer-assisted proof like the 100+ page classification of finite simple groups). Must a human mind verify it for the theorem to be true?*  
  - **Yes** → **Question 2**  
  - **No** → **Intuitionism/Constructivism** (Mathematics is a mental construction; truth requires proof.)  
  *Leaf note: Intuitionists reject non-constructive proofs (e.g., excluded middle).*

  #### **Question 2: Cicadas & Primes**  
  *Periodical cicadas emerge every 13 or 17 years (prime numbers) to avoid predators. Does explaining this require the* truth *of the math (e.g., "primes minimize overlaps")?*  
  - **Yes** → **Realist path** (Mathematical facts explain reality.)  
  - **No** → **Anti-realist path** (Math is useful but not "true" in a robust sense.)  

  ---

  ### **Realist Path** (You answered **Yes** to Question 2)  

  #### **Question 3: Mathematical Necessity**  
  *Could a world exist with* identical *physical laws/objects as ours but* different *mathematical facts (e.g., 2+2=5)?*  
  - **Yes** → **Empiricism** (Math is grounded in experience; facts could differ in other worlds.)  
  - **No** → **Question 4** (Math is necessary.)  

  #### **Question 4: Continuum Hypothesis (CH)**  
  *Does CH (about infinities) have a definite answer we might discover, or is adopting an axiom (e.g., ZFC) more like legislation?*  
  - **Legislation** → **Non-Absolute Platonism** (Truth depends on chosen axioms/structure.)  
  - **Definite answer** → **Question 5** (Math has objective answers.)  

  #### **Question 5: "Arbitrary Even Integer"**  
  *When a mathematician says "let \(n\) be an arbitrary even integer," has she singled out a specific object?*  
  - **Singled out** → **Question 6**  
  - **Only general** → **Logicism** (Math reduces to logic; "objects" are logical facts, not entities.)  

  #### **Question 6: Set-Theoretic "3"**  
  *Does it matter whether we define 3 as \(\{0,1,2\}\) or \(\{\{\},\{\{\}\},\{\{\{\}\}\}\}\)?*  
  - **Matters** → **Set-Theoretic Platonism** (Sets are fundamental; representations are literal.)  
  - **Doesn’t matter** → **Structuralism or Platonism** (The *pattern*, not the set, is key.)  
  *Leaf note: Hard to separate! "Objects" are either freestanding (Platonism) or positions in a structure (Structuralism). See addendum below.*  

  ---

  ### **Anti-Realist Path** (You answered **No** to Question 2)  

  #### **Question 7: Physics Without Math**  
  *If physics predicted phenomena* identically *without quantifying over math (e.g., no numbers, sets), would the original math-using version be...?*  
  - **False** → **Fictionalism** (Math is useful fiction; statements are false but efficient.)  
  - **Clunkier** → **Formalism/Instrumentalism** (Math is a tool; truth isn’t the point.)  
  - **Better explanatory** → Inconsistent with anti-realism → *Rethink Question 2!*  

  #### **Question 8: Access to Abstracta**  
  *Math seems about non-spatiotemporal, causally inert "things." How do proofs/reference track them?*  
  - **We can’t reliably track them** → **Nominalism** (Math is about concrete signs/linguistic practices.)  
  - **We can (via abstraction, logic, etc.)** → **Question 7** (If you’re anti-realist but say this, rethink your path!)  
  *Leaf note: Anti-realists typically answer "can’t." Realists answer "can" but face challenges (see addendum).*  

  ---

  ### **Position Leaves**  
  1. **Intuitionism/Constructivism** (Q1: Yes)  
  2. **Empiricism** (Q3: Yes)  
  3. **Non-Absolute Platonism** (Q4: Legislation)  
  4. **Logicism** (Q5: Only general)  
  5. **Set-Theoretic Platonism** (Q6: Matters)  
  6. **Platonism/Structuralism** (Q6: Doesn’t matter)  
  7. **Fictionalism** (Q7: False)  
  8. **Formalism/Instrumentalism** (Q7: Clunkier)  

  ---

  ### **Addendum: Key Notes**  
  1. **Hard-to-Separate Positions**:  
     - **Platonism vs. Structuralism** (Leaf 6): Both accept abstract entities/patterns. To split them, ask: *Is a "number" defined by its intrinsic properties or its relations to other objects?* Platonists say "intrinsic"; structuralists say "relations."  
     - **Fictionalism vs. Formalism** (Leaves 7–8): Fictionalists say math is *false but useful*; formalists say math isn’t truth-apt (like chess rules). Ask: *Do unproven conjectures have truth values?* Fictionalists say yes (but false); formalists say no.  

  2. **Unoccupied/Incoherent Combinations**:  
     - **"Accessible Anti-Realism"** (Q8: "We can track" + anti-realism): Incoherent. If math isn’t real, reliable tracking is inexplicable.  
     - **"Necessary Empiricism"** (Q3: No + empiricism): Unattractive. Empiricism implies math is contingent.  
     - **"Explanatory Anti-Realism"** (Q7: "Better explanatory" + anti-realism): Contradictory. Anti-realists deny math explains via truth.  

  3. **Top Questions & Redundancy**:  
     - **Most Work**:  
       - **Question 2 (Cicadas)**: Splits realism/anti-realism cleanly.  
       - **Question 1 (Unverified Proofs)**: Isolates intuitionism, a major fork.  
     - **Redundant Question**: **Question 8 (Access)**. Answers correlate strongly with realism/anti-realism and don’t split leaves further. Cut it to simplify without losing coverage.  

  ---

  **Design Rationale**:  
  - **Logical Space**: Built from combinations of answers (e.g., realism + necessity + objectivity → Platonism; anti-realism + "clunkier" → Formalism).  
  - **Concrete Cases**: Questions use math-specific examples (e.g., CH, set-theoretic reduction) to avoid metaphysics.  
  - **Student Focus**: Targets math-trained skepticism by prioritizing practice over theory.  

  Handout ends here. Print double-sided and distribute!
