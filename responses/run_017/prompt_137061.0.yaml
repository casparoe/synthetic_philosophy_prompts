  For Q&A prep, I should identify the most damaging objections from each audience type. The axiomatiser will likely question whether this is just SARP with extra steps. The experimentalist will worry about practical testability with n=400 on Prolific. The econometrician will ask about identification. The senior theorist might dismiss this as revisiting settled debates. The philosopher will challenge why presentation-invariance defines welfare.

  The user also needs to differentiate their work from related literature without claiming priority, and they're worried about unasked questions - particularly about how "the same alternative" is identified across presentations, and whether results depend on the finite set tested.

  I'll structure this by ordering objections by damage potential. The existential threat is the "isn't this just..." question from axiomatisers - if they convince the room this is redundant, the chapter fails. Next is the identification question, as without credible variation, the whole framework feels theoretical. Then come practical testability, welfare justification, and literature differentiation.

