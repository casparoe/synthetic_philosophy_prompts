  The "unasked question" they fear is indeed the identification of alternatives across presentations. I'll advise acknowledging this as deep while offering pragmatic responses about experimental control and revealed indifference.

  Throughout, I'll maintain their intellectual honesty while giving them rhetorical tools to survive the defense. The tone should be collaborative ("we're building tools") not combative ("I've solved everything").
answer: |-
  Here’s your Q&A prep sheet, ordered by damage potential. I’ve phrased objections as they’d likely be voiced, included concise replies, flagged soft spots, and added strategic concessions. The **critical reply** is #1—if it doesn’t land, the chapter sinks.

  ---

  ### **Top 8 Objections & Replies**
  1.  **The Axiomatiser (existential threat):**  
      *Objection:* "Isn’t this just SARP applied to the *union* of choice functions across presentations? If I define a ‘grand choice function’ over all presented sets, your core is identical to the revealed preference from that. Why do I need new machinery?"  
      *Reply:* "No—SARP on the union would require choices to be *jointly* rationalizable by a single relation. My core is the intersection of *separate* rationalizations per presentation. When WPC holds, they coincide; when it fails, SARP fails on the union, but my core *diagnoses why* (empty/cyclic intersection). This captures conflict *between* frames, not noise."  
      *Soft spot:* If WPC violations are rare/trivial, the machinery feels heavy. *Concede early:* "It’s true SARP-on-union is a special case under WPC—but the core’s emptiness under failure is the novel insight."

  2.  **The Structural Econometrician (credibility threat):**  
      *Objection:* "Where’s the identifying variation? If I see choices from scanner data, how do I know two choice situations are the ‘same set, different presentation’? Your core requires observing identical alternatives under different frames—but in the wild, frames are confounded with sets or time."  
      *Reply:* "You need *controlled* variation: e.g., A/B tests showing the *same* product menu with prices per month vs. per year, or different default selections. The core is identified off *within-subject, within-menu* frame variation. Without experiments, you’d need quasi-experimental frame shifts (e.g., regulatory label changes)."  
      *Soft spot:* Requires demanding data. *Concede early:* "Yes, this is fundamentally an experimental or policy-shock design—not directly estimable from passive observational data."

  3.  **The Experimentalist (practicality threat):**  
      *Objection:* "n=400 on Prolific gives me ~8 presentations per subject if I want 50 subjects. With even 10 alternatives, your R(p) sets are huge. How do I compute the core without infinite data? And what’s the power to detect a non-empty core?"  
      *Reply:* "You don’t need full R(p) sets! Test WPC directly: check for cycles in the *union* of pairwise choices across presentations (e.g., if A>B in frame 1, B>A in frame 2, that’s a cycle). The core being non-empty is equivalent to WPC holding. Pre-register this cycle test as the primary welfare metric."  
      *Soft spot:* With sparse choice data per frame, inferred preferences are partial. *Note:* "I’d use tight bounds (e.g., only strict choices count) and bootstrap confidence for cycles."

  4.  **The Philosopher (foundations threat):**  
      *Objection:* "Why is ‘presentation-invariance’ the right criterion for welfare? If someone’s ‘core’ prefers fries over salad, but only when labeled ‘90% fat-free’, isn’t that still *their* preference? Why privilege frame-independence over autonomy or reflective endorsement?"  
      *Reply:* "Because frames are arbitrary—they’re tools for elicitation, not part of the object of choice. Welfare should track stable evaluations of the *thing itself*, not the measurement tool. If preferences flip with logically irrelevant presentation changes, that signals the choice doesn’t reflect a coherent valuation of the alternative."  
      *Soft spot:* Assumes "irrelevance of presentation" is uncontroversial. *Defuse:* "This doesn’t replace autonomy—it’s a necessary condition for revealed preferences to be *about* the alternative."

  5.  **The Senior Theorist (priority threat):**  
      *Objection:* "This feels like reheated 1980s debates. We settled that utility is a representation of choice—full stop. Adding ‘presentations’ just relabels ‘ancillary conditions’ from McFadden or ‘frames’ from Tversky. Why isn’t this just behavioural noise?"  
      *Reply:* "Unlike noise models, I’m not assuming a latent ‘true’ preference plus errors. When the core is empty, it’s a *meaningful failure of coherent valuation*—not measurement error. And unlike classic frames (e.g., gain/loss), I’m testing invariance under *arbitrary* presentations of the *same set*."  
      *Soft spot:* Risk of sounding dismissive. *Crucial nuance:* "This *extends* representation theory: choices over alternatives are still primitive, but we demand consistency *across measurement contexts*."

  6.  **The "Isn’t This Just..." Question (turf threat):**  
      *Objection:* "How is this different from Bernheim & Rangel’s ‘multi-self Pareto criterion’ or the ‘normative preference’ in temptation models? Or from Salant & Rubinstein’s choice with frames?"  
      *Reply (non-combative):* "Great point! Those are cousins, but here’s the shift: Bernheim-Rangel *imposes* a welfare criterion on conflicted choices; I *derive* when a unified criterion *exists* from the data. Salant-Rubinstein characterize choice *with* frames; I ask when choices are *frame-invariant*. We’re all tackling related puzzles—my tools help diagnose when ‘revealed welfare’ is possible."  
      *Soft spot:* Needs precise differentiation. *Emphasize:* "This is a *test for when revealed welfare is coherent*, not a new welfare criterion."

  7.  **The Experimentalist (feasibility follow-up):**  
      *Objection:* "You need many presentations per set. With k alternatives, there are k! orderings alone. How do I choose which presentations to test without p-hacking?"  
      *Reply:* "Pre-register a small set of ‘meaningful’ frames (e.g., price formats, defaults) motivated by psychology (e.g., attribute salience). For robustness, add random orderings as controls. The core is *monotonic* in presentations: more frames shrink (or keep empty) the core. Start small and expand."  
      *Soft spot:* Arbitrary frame selection could bias the core.

  8.  **The Axiomatiser (technical follow-up):**  
      *Objection:* "Your ‘mild richness requirement’ for presentations—what if I can’t induce a cycle? Suppose for some agents, one presentation always dominates. Doesn’t that make your core sensitive to which presentations you *didn’t* run?"  
      *Reply:* "Yes, but the core is always a *subset* of the true latent preferences (if they exist). If you miss presentations where b>a, you might falsely include a>b in the core. But if WPC *fails* (a cycle exists), you’ve detected incoherence even with limited frames."  
      *Soft spot:* The core isn’t point-identified with finite frames. *Concede:* "Absolutely—more frames yield sharper bounds. This is a feature: running more presentations refines welfare inferences."

  ---

  ### **Strategic Concessions to Make Early**
  1.  **"This doesn’t handle preference instability over time."**  
      *Say upfront:* "This is synchronic—it assumes preferences are fixed *during* the experiment. Drift over time is orthogonal."
  2.  **"WPC is sufficient but not necessary for a nonempty core if we allow incomplete preferences."**  
      *Concede:* "True! If we relax completeness, WPC could fail but a partial order core might exist. I focus on completeness for clarity in welfare claims."

  ---

  ### **The Question You Hope Nobody Asks (But They Will)**
  **The Philosopher/Econometrician Tag Team:**  
  *Objection:* "You assume we can identify ‘the same alternative’ across presentations (e.g., ‘$10/month’ vs ‘$120/year’). But doesn’t that presuppose the *very invariance* you’re testing—that the agent sees these as identical? If they frame prices per-year as ‘commitments’, aren’t they *different objects*?"  

  *Reply (grit your teeth):*  
  1.  **Pragmatic:** "In experiment design, we *define* alternatives by objective attributes (e.g., total cost). If subjects treat them differently, that’s a WPC violation—the core will be empty, telling us they see them as distinct. The model flags this as incoherence *under our definition of ‘same set’*."  
  2.  **Revealed:** "We can *test* if they’re seen as identical: if the agent never chooses both from a set containing only them, they’re revealed indifferent. If not, they’re different alternatives."  
  3.  **Honest Soft Spot:** "This is deep—it’s the ‘problem of translation’ (Sen, 1993). I’m assuming experimenter-defined extensional descriptions suffice. If welfare depends on *intentional descriptions*, we need richer data."  

  *Why it’s lethal:* If identifying "the same alternative" requires the invariance you’re testing, the whole framework risks circularity. Your best defense: "This is a standard challenge *all* revealed preference faces. I handle it by making the dependency explicit and testable."

  ---

  ### **Summary**
  - **Critical Reply to Land:** #1 (vs. the axiomatiser). If the room thinks this is just SARP-with-extra-steps, the chapter dies. Hammer: "SARP-on-union fails *because* the core is empty."  
  - **Concede Early:** Data needs (structural #2), presentation-dependence (philosopher #4), and the distinction from preference drift.  
  - **Turf Defense:** Position as a *test for coherence* ("When can we even use revealed welfare?") not a *new welfare criterion*.  
  - **Nightmare Question:** Meet it head-on—admit the "problem of translation" but argue your approach makes it empirical.  

  **Final Tip:** When describing the core, say "This is the *agreement* across all rationalizations" — it’s more intuitive than "intersection". Good luck!
