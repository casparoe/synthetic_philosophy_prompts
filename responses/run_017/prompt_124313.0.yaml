prompt: |-
  I have been reading about the post-war tribunals and have talked myself into an argument whose conclusion I cannot accept. Set out in steps:

  (1) A verdict is an act of punishment rather than an act of revenge only if both of these hold: (a) the defendant is convicted of something that was already criminal, under a rule that bound him, at the time he acted; and (b) the court would have applied that same rule to people on its own side.

  (2) The charges doing the real work at Nuremberg and Tokyo were new — though not in the sense people usually mean. Killing civilians was already murder under German and Japanese law. What was new was that the charges were international; that the Charter severed liability from local legality, defining crimes against humanity to cover acts "whether or not in violation of the domestic law of the country where perpetrated"; and that the answers a domestic court would have heard — superior orders, act of state, the defendant's official position — were withdrawn in advance, the first two expressly, and treated at most as grounds for mitigation. Call this what you like: the defendants lost, after the event, the defences they would have had when they acted.

  (3) The tribunals were one-sided by construction. Only the defeated were in the dock; the area bombing of cities and the atomic bombings were never charged; the Japanese head of state was not indicted; and tu quoque was ruled out as a defence before the trials began.

  (4) So both limbs of (1) fail, and the verdicts were revenge wearing a legal costume.

  (5) Here is why I think the argument must be rotten: limb (b) would disqualify every criminal court that has ever sat. No state that punishes killing refrains from killing; no tribunal is drawn from both sides of a conflict; and if a court must be prepared to indict its own side before it has jurisdiction, then the alternative to victors' justice is not neutral justice but no trials at all — impunity for any aggressor who is never wholly defeated. An argument that ends by showing that nobody may ever punish anybody has proved too much.

  (6) But when I drop (b), I lose my grip on (a). Both are fairness conditions; if the partiality of the tribunal does not defeat its verdicts, why should the novelty of the charges? And if novelty is fatal, then the later codifications look like an attempt to launder 1945 and 1946 after the event — including the exception written into the post-war European human rights instrument for acts that were already criminal under principles generally recognised among nations.

  I want to keep (2) and (3), which seem to me to be facts, and I want to keep the judgement that the trials were worth holding, so I seem bound to give up something in (1). The mistake may equally lie in the move from (2) and (3) to (4), or in what "punishment" is doing in (1): I cannot locate it. Which step should I reject, and what does rejecting it cost me?
reasoning: |-
  Okay, the user is grappling with a philosophical and legal dilemma regarding the legitimacy of the Nuremberg and Tokyo tribunals. Their argument concludes that these trials were essentially revenge disguised as law, but they're uncomfortable with this conclusion because it implies that no criminal court can ever legitimately punish anyone. 

  Hmm, they've structured this carefully in six steps. Step (1) sets up two strict conditions for punishment (retroactivity and impartiality). Steps (2) and (3) show how the tribunals violated both. Step (4) draws the revenge conclusion. But step (5) brilliantly exposes why this can't be right - condition (b) would invalidate all courts. Step (6) shows their dilemma: rejecting (b) weakens their case against retroactivity in (a).

  The user's core conflict is between their factual accuracy (steps 2-3 are correct) and moral intuition (the trials were necessary). They're essentially asking where their framework is wrong. I notice they're very precise - distinguishing between "new charges" versus "new in nature of jurisdiction" in step (2), and acknowledging the "generally recognized principles" exception in step (6).

  What they really need is a way to reconcile the procedural imperfections with the moral necessity. The historical context matters here - these trials responded to unprecedented atrocities when domestic systems were complicit. The user might be underestimating how legal systems evolve through such watershed moments.

  Their frustration with "laundering" suggests they worry about bad precedents. I should emphasize how the tribunals' innovations later became codified norms - not laundering but organic development. Also worth noting that the Allies' refusal to indict themselves doesn't automatically negate the defendants' guilt - though it certainly undermines moral authority.

  The solution probably lies in rethinking condition (1)'s binary punishment/revenge framing. Legal punishment can be imperfect yet legitimate. Nuremberg established that "I was following orders" isn't absolute immunity - now a bedrock principle. That's worth some procedural asymmetry.
answer: |-
  Your argument is philosophically rich and exposes genuine tensions in transitional justice. Let's dissect it step by step to locate the flaw while preserving your core insights about Nuremberg/Tokyo:

  ### The Critical Flaw: The Overly Stringent Definition in (1)
  **Reject limb (b) of premise (1)**. It sets an impossible standard that collapses the distinction between *punishment* and *revenge* entirely (as you note in step 5). Here’s why:

  1.  **Impartiality ≠ Symmetry**: Limb (b) demands *literal symmetry* (prosecuting one's own side) as a condition for legitimacy. But impartiality requires *applying consistent principles*, not prosecuting every offender. A court can be impartial *in its judgments* even if its jurisdictional mandate is limited (e.g., only prosecuting defeated aggressors). The relevant test is: *Would the court convict a defendant from its "own side" for the same conduct, under the same law?* Nuremberg established principles that *could*, in theory, be applied to Allied conduct (e.g., indiscriminate bombing). The failure to *actually* prosecute Allies is a political failing, not *necessarily* proof the court itself lacked impartiality *in judging the defendants before it*. The Charter's rules *were* applied consistently *to the defendants*.

  2.  **The Necessity of Asymmetry in Transitional Justice**: After systemic atrocities by a regime, the domestic legal system is often complicit or destroyed. Only the victors *can* provide a forum. Demanding prosecutions of the victors *as a precondition* for legitimacy ensures impunity for the vanquished – precisely the outcome you reject in (5). Legitimacy comes from *fair process* and *justifiable legal principles*, not prosecutorial symmetry.

  ### Re-evaluating Limb (a) (Retroactivity/Nulla Poena) in Light of Dropping (b)
  Dropping the impossible (b) doesn't automatically invalidate concerns about (a), but it changes the analysis:

  1.  **Distinguish "New Crimes" from "New Jurisdiction/Removed Defences"**: Your point in (2) is crucial. The *core acts* (murder, enslavement) were universally criminal. What was novel was:
      *   **Jurisdiction**: Prosecuting them *as international crimes* before an *international tribunal*.
      *   **Removal of Defences**: Explicitly nullifying "superior orders" and "act of state" as *absolute* bars to liability (treating them only as mitigation).
      *   **Source of Law**: Applying international law directly to individuals.

  2.  **The "Generally Recognized Principles" Escape Valve**: This is key. Limb (a) in (1) assumes a strict, formalistic view of *nulla poena sine lege* (no punishment without law). Nuremberg/Tokyo relied on a more substantive view:
      *   The acts were already criminal under *domestic law* everywhere.
      *   The *principles* underlying the crimes (prohibitions on mass murder, enslavement, aggressive war) were recognized in international treaties (Kellogg-Briand Pact outlawing war), military manuals, and state practice *before* WWII.
      *   The innovation was *overcoming state sovereignty barriers* to enforce these pre-existing principles against individuals responsible for their violation on a massive scale. The Tribunal argued the Charter merely codified pre-existing customary law.

  3.  **Fairness vs. Formalism**: The core fairness concern of *nulla poena* is preventing arbitrary punishment for acts the actor couldn't reasonably know were wrong. Could high-ranking Nazis/Japanese genuinely believe systematic genocide, launching aggressive wars, or enslaving millions were *legal* or *permissible*? The tribunals argued they could not – these acts violated fundamental norms known to any civilized person. The removal of formal state-based defences was deemed necessary to reach the individuals *truly* responsible, as those defences had been systematically abused to perpetrate impunity.

  ### Preserving (2), (3), and the Value of the Trials
  *   **(2) Stands**: The procedural/legal innovations *were* significant. The loss of defences *was* real. This creates a *prima facie* retroactivity concern.
  *   **(3) Stands**: The trials *were* asymmetric and victor-imposed. Allied atrocities weren't prosecuted. This creates a *prima facie* partiality concern.
  *   **Value Stands**: Despite (2) & (3), the trials were necessary and valuable because:
      *   They established an authoritative record of atrocities.
      *   They affirmed individual accountability under international law.
      *   They created foundational precedents for modern ICL (crimes against peace, war crimes, crimes against humanity).
      *   They provided *some* measure of justice and catharsis.
      *   The alternative (summary execution or impunity) was morally worse.

  ### Reconciling It All: Rejecting the Binary in (1)
  The cost of rejecting limb (b) is acknowledging that legal punishment in the aftermath of cataclysmic events like WWII will *always* be imperfect, politically constrained, and procedurally innovative. It cannot meet the pristine conditions of an ideal domestic criminal trial.

  1.  **"Punishment" vs. "Revenge" is a Spectrum, Not a Binary**: Nuremberg/Tokyo were not purely "punishment" by an ideal domestic standard, nor were they purely "revenge." They were a *hybrid*: an unprecedented legal response to unprecedented crimes, using innovative legal tools within significant political constraints. The presence of *some* elements of victor's justice doesn't automatically negate *all* legitimacy or transform it *solely* into revenge. The *legal process itself* (right to counsel, cross-examination, presentation of evidence, reasoned judgments) was a crucial restraint distinguishing it from mere vengeance.
  2.  **Legitimacy Comes from Multiple Sources**: Beyond strict *nulla poena* and perfect symmetry, legitimacy flows from:
      *   **The Gravity of the Crimes**: Responding to offenses that shocked the conscience of mankind.
      *   **The Failure of Domestic Systems**: Necessitating an international forum.
      *   **Procedural Fairness**: Ensuring the best process possible under the circumstances.
      *   **Contribution to Future Justice**: Establishing principles to deter and punish future atrocities.
      *   **Substantive Justice**: Holding perpetrators accountable for acts universally recognized as profoundly wrong, even if the *mechanism* was novel.
  3.  **The "Laundering" Point**: The subsequent codifications (Genocide Convention, Geneva Conventions, ICC Statute) aren't simply laundering. They represent the *acceptance and crystallization* of the principles Nuremberg asserted *were already inherent* in international law. They validated the core propositions: individuals can be liable under international law for such crimes, certain defences are invalid, sovereignty is no shield. The ECHR exception you mention *explicitly acknowledges* the Nuremberg principle – it reinforces, rather than launders, the idea that punishment for acts criminal under "general principles" is not truly retroactive.

  ### Conclusion: The Step to Reject and Its Cost
  *   **Reject Limb (b) of Premise (1)**: The requirement that the court must prosecute its "own side" is unsustainable and collapses the possibility of legitimate punishment in asymmetric situations (like defeating a genocidal regime). Impartiality requires consistent *application of law to defendants*, not prosecutorial symmetry.
  *   **Cost**: Accepting this means acknowledging that victor-imposed justice, while flawed and open to accusations of hypocrisy, can still constitute legitimate *legal punishment* if it adheres to core principles of fairness and applies norms that were, in substance, condemnable before the trial. The shadow of victor's justice remains, but it doesn't automatically transform the process into mere revenge.
  *   **Refined View of Limb (a)**: The novelty in (2) creates a *tension* with *nulla poena*, but not an absolute bar. The tribunals argued convincingly that the *substance* of the crimes was already forbidden. The innovation was jurisdictional and procedural, necessary to overcome state-sponsored impunity. Subsequent state practice and codification largely vindicated this view. The fairness concern is mitigated by the universal recognition of the wrongfulness of the core acts.

  You keep the facts (2 & 3), the value judgment, and a core concern about fairness, while rejecting an unworkable condition that would make any punishment after a major conflict impossible. Nuremberg/Tokyo stand as imperfect, politically constrained, yet fundamentally necessary and legitimate acts of *legal punishment*, pioneering a system designed to prevent future atrocities. They navigated the tension between the ideal and the possible, establishing that "just following orders" is no defence against crimes that cry to heaven.
