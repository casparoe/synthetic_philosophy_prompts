  ### Final Summary
  - **Your setup:** Program equilibrium (one-shot PD with source-code inspection).  
  - **Core impossibility:** Reciprocation Undecidability (liar paradox + Rice's theorem).  
  - **The squeeze:** Never exploited, cooperate with all cooperators, always terminates — pick two.  
  - **The way out:** Use proof-based agents (sacrifice perfect reciprocity for robustness).  
  - **Spoiler programs:** Valid counterexamples; self-harm doesn't rescue the impossibility.  

