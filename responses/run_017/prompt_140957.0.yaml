  The cruxes are the points where resolving them could sway one theorist. For instance, if expected accuracy can decrease with evidence, the accuracy-first theorist might need to adjust, whereas the other sees it as proof that accuracy isn't the sole concern. Concrete examples are crucial here. Using Brier score vs. log score to show how evidence can lower expected accuracy depending on the rule demonstrates this.

