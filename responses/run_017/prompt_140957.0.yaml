  The user needs continuous prose without markdown, so I'll structure it in paragraphs following their order. Practical considerations: no references, just reasoning. Ensuring clarity without jargon where possible, since the review board won't look up sources. Also, making sure each section flows smoothly from common ground to differences to cruxes and examples.

