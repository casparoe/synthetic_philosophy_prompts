prompt: |-
  I work in public health, mostly on the causal-inference side: potential-outcome notation, directed acyclic graphs, Pearl-style interventions together with the insistence that a causal question is ill-posed until the intervention is specified, Rothman's sufficient-component-cause model on which a cause is a piece of a sufficient cause rather than a lone difference-maker, attributable and etiologic fractions, the prevention paradox on which most cases of a harm come from the many people at small risk rather than the few at high risk, threshold phenomena of the herd-immunity kind, and the usual machinery for when the thing you want isn't identified: bounds, sensitivity analysis, priors over an unknown dose-response curve.

  Outside work I'm in a reading group with a political theorist, and we have got stuck on the inefficacy objection to the claim that individuals can contribute to collective harms. My driving to work, or buying one factory-farmed chicken, or voting, does not seem to change any outcome: the emissions and the flooding happen anyway, the bird is already dead, the election is not decided by one vote. And yet the conclusion that it therefore does not matter what I do looks wrong. She has sketched, without citations, three families of reply: an expected-difference reply, on which a tiny chance of being the marginal agent multiplied by a very large harm is not negligible; a participation or fair-share reply, on which what matters is whether you are taking part in a harmful practice or doing your share of it, not whether you made a difference; and replies that reach for some non-counterfactual notion of causal role. My hunch is that my field has already defused this and the philosophers are reinventing a wheel; she says the prevention paradox is a claim about populations and cannot possibly tell me what I ought to do. I want to know which of us is closer, so: restate the whole dispute as faithfully as you can in my vocabulary, and then give me the residue report.

  Concretely, please do the following.

  1. For the objection itself and for each of the three families of reply, separate what translates cleanly into causal-inference and epidemiological terms, what translates only with distortion, and what cannot be expressed in that vocabulary at all. Name the estimand you think each philosophical claim is implicitly asking for, and say whether it is identified.
  2. Flag explicitly anywhere my vocabulary would smuggle in a substantive moral assumption, consequentialism above all, so that calling something a translation would be assuming the answer rather than giving it. This is the part I am least able to check myself.
  3. Handle four cases separately, because I suspect they come apart in translation: greenhouse-gas emissions, where the per-unit contribution is continuous and minuscule and the harm is spread thin over very many people; the supermarket chicken, where supply is restocked in discrete batches so there is a real threshold but I have no idea where in the batch I am; voting, where difference-making occurs only in the knife-edge case of an exact tie; and the many-hands case I half remember from a survey course, in which a thousand torturers each turn a dial a thousandth of a turn and none of them makes any perceptible difference to the victim's pain.
  4. Two sub-questions I care about most. For the chicken case, tell me what my field's tools actually deliver when the location of the threshold is itself unknown: bounds, a prior over the threshold, a sensitivity analysis, something else? And say whether that answers the philosophical question or changes the subject. For the emissions case, the estimated per-person effect is so small that it is indistinguishable from zero at any achievable sample size: is a confidence interval straddling zero doing any real work for the philosopher, or does it merely restate the puzzle in better notation?
  5. Finish with a verdict rather than a survey. Is the residue evidence that my causal vocabulary is blind to something the philosophers are tracking, or evidence that the inefficacy objection is shallower than it sounds? Take a side and say what would change your mind.

  Assume no library access on your end: no author names, no paper titles, no citations, no reading lists. I want the distinctions and the cases, and I genuinely do not care who said what first. Use notation wherever it earns its keep, and keep the translation honest even where that makes my hunch look worse.
reasoning: |-
  We are facing the inefficacy objection to individual contribution to collective harms. The objection: individual actions (like driving, buying a chicken, voting) seem not to change the outcome, so why does it matter? The reading group has three families of replies:

  1. Expected-difference reply: even if the chance of being the marginal agent is tiny, multiplied by a large harm, the expected harm is non-negligible.
  2. Participation/fair-share reply: what matters is participating in a harmful practice or doing one's fair share, not making a difference.
  3. Non-counterfactual causal role: some notion of causation that isn't about counterfactual difference-making.

  We are to restate in causal-inference and epidemiological terms, and then analyze four cases: greenhouse-gas emissions, supermarket chicken, voting, and the many-hands torture case.

  Step 1: Translate the objection and each reply into causal-inference terms.

  Objection: The individual causal effect (ICE) of my action on the outcome is zero. That is, if we let Y be the outcome (e.g., flooding, chicken death, election result, victim's pain) and A_i be the action of individual i, then for each case:

    ICE_i = Y(A_i=1) - Y(A_i=0) = 0

  This is the potential outcome difference for individual i. The objection says that for each individual, this difference is zero.

  Reply 1: Expected-difference.

    We can think of the expected individual causal effect (EICE) as:

      EICE_i = E[ Y | A_i=1, covariates ] - E[ Y | A_i=0, covariates ]

  But note: in the cases, the outcome Y is deterministic conditional on the actions of all. However, from the perspective of the individual, if there is uncertainty about the actions of others, then we might compute an expected effect. Alternatively, we can model the probability that the individual is pivotal.

  In the voting case: if the election is close, the probability that one vote is pivotal is small but positive. Then the expected effect is:

      EICE_i = P(pivotal) * (effect when pivotal) + P(not pivotal) * 0

  which is approximately P(pivotal) * (1) for a binary election where one vote changes the outcome.

  In the chicken case: if the store restocks in batches of size B, then the individual might be the one that triggers an order. The expected effect is the probability that the chicken bought is the one that triggers the restocking (thus causing the death of the next batch) times the harm of the entire batch.

  But note: in the chicken case, if the restocking decision is made at a threshold (say, when the stock falls below a level), then the individual might cause multiple chickens to be ordered. However, in the simple case, if we assume that buying one chicken when the stock is above the threshold does nothing, but when exactly at the threshold it triggers an order of B chickens, then the expected effect is the probability that the stock is exactly at the threshold at the time of purchase times B (the number of chickens in the next order). If the stock level is unknown, then we have uncertainty.

  Similarly, for emissions: the harm is a continuous function of total emissions. The marginal effect of one unit of emission is the derivative of the harm function. Even if the harm function is linear, the effect is non-zero but extremely small. However, the objection often assumes that the harm function has thresholds below which nothing happens and above which there is a jump, but in reality, climate harm is believed to be approximately linear at the margin. But if we think of a threshold (like a tipping point), then the expected effect would be the probability that the world is at the tipping point times the harm of the tipping point. However, this probability is negligible.

  Reply 2: Participation/fair-share.

    This does not look like a causal effect in the potential-outcome sense. It is more about being part of a group that causes harm. In epidemiological terms, we might think of the attributable fraction: what fraction of the harm is attributable to a particular exposure. But that is a population measure. For an individual, we might think of the etiologic fraction (the probability that the exposure was a necessary component of the sufficient cause that occurred). However, in the collective harm cases, the individual's action is rarely necessary.

    Alternatively, we might think of the individual's contribution as a fraction of the total. For example, if total harm H is proportional to total emissions, and I emit e_i, then my share is (e_i / E_total) * H. But this is not a causal effect because if I didn't emit, the harm would be H - (partial derivative?)? Actually, if the function is linear, then the harm without my emissions would be H - k*e_i, so the causal effect is k*e_i. But if the function is not linear, then it's more complex.

    However, the participation reply is not about the causal effect but about complicity. It is a moral concept: by participating, you are part of the problem. This is not captured by the potential-outcome framework, which is about consequences.

  Reply 3: Non-counterfactual causal role.

    This might be about structural equations or mediation. In the sufficient-component-cause model, an individual's action might be a component of a sufficient cause. For example, in the chicken case, a sufficient cause for the death of a chicken might include: the factory farming system, and the purchase of that chicken. So my purchase is part of a sufficient cause. But note: in the sufficient-component-cause model, a cause is a minimal set of conditions that are jointly sufficient. However, in the chicken case, the death of the chicken might be overdetermined: the chicken was already dead and would have been bought by someone else. So my purchase might not be necessary. Therefore, in the SCC model, my action might not be a component of a sufficient cause that is minimal? Actually, it might be part of a sufficient cause (because if I buy it, then it is sold and the death is "used"), but it is not necessary because if I didn't buy it, someone else might have.

    Alternatively, we might think in terms of actual causation: but that is often defined counterfactually.

  Step 2: Flag where causal vocabulary smuggles in consequentialism.

  The entire potential-outcome framework is counterfactual and thus consequentialist: it asks what would happen if we did X versus if we didn't. Therefore, it is inherently tied to the consequences of actions. The participation reply and the non-counterfactual causal role might be trying to escape consequentialism. For example, the participation reply might be deontological: it is wrong to participate in a harmful practice regardless of consequences. Similarly, the non-counterfactual causal role might be about being a part of a causal process, even if the outcome would have happened anyway.

  Therefore, when we try to translate the participation reply into causal-inference terms, we are forcing a consequentialist framework onto a non-consequentialist idea. That is a distortion.

  Step 3: Handle four cases separately.

  Case 1: Greenhouse-gas emissions.

    - Objection: My emissions are a tiny fraction of the total. The harm function (say, global temperature rise) is continuous and smooth. The marginal effect of my emissions is the derivative of the harm function with respect to emissions, evaluated at the current total. This is non-zero but extremely small (and in practice, unmeasurable from data because of the scale). 
    - Expected-difference: If we consider the possibility of a tipping point, then the expected effect is the probability that total emissions are at the tipping point times the harm of the tipping point, but that probability is negligible. More realistically, in a linear model, the effect is just the marginal effect per unit emission times my emissions. But the objection is that this effect is so small as to be negligible.
    - Participation: My share of the harm is proportional to my emissions. But that is exactly the marginal effect in a linear model. However, the participation reply might be saying that even if the marginal effect is negligible, I am still responsible for my share. This is a moral claim, not a causal one.
    - Non-counterfactual causal role: My emissions are a literal part of the total emissions that cause the harm. So I am a cause in the sense of being a component of the total cause.

    Causal-inference tools: The marginal effect is identified if the harm function is known and linear. If not, we need to model the function. If we don't know the function, we could do sensitivity analysis or use bounds. But the harm is so spread out that we cannot measure the effect of one person's emissions.

    For the objection: the ICE is not zero but very small. The objection calls it negligible.

  Case 2: Supermarket chicken.

    - Objection: The chicken is already dead. Buying it or not doesn't change the fact that it was raised and killed. Moreover, if I don't buy it, someone else might. So the ICE is zero: the chicken's death is not affected by my purchase.
    - Expected-difference: The store restocks in batches. Suppose the store has a threshold: when the stock falls to S, they order B chickens. If I buy a chicken when the stock is exactly S, then my purchase causes an order of B chickens (which will be raised and killed). If the stock is above S, then my purchase doesn't trigger an order. If the stock is below S, it's already ordered. So the effect of my purchase is B if I am at the threshold, and 0 otherwise. Since I don't know the stock level, the expected effect is P(stock = S) * B. If we assume that the stock level is uniformly random over the possible range (say, from 0 to M, and the threshold is S), then P(stock=S) = 1/(M+1). So the expected effect is B/(M+1). Note: this is the expected number of chickens caused by my purchase.

    Causal-inference tools: We don't know the threshold S, and we don't know the current stock. We might have a prior over the stock level. Then we can compute the posterior expected effect. Alternatively, we can put bounds: the effect is either 0 or B, so without knowing the stock, the effect is between 0 and B. But that's not very helpful. We could do sensitivity analysis by varying the threshold and the current stock. However, the key is that the expected effect is positive and possibly non-negligible if B is large and the probability of being at the threshold is not too small.

    Does this answer the philosophical question? It shows that the ICE is not always zero, and on average it is positive. But the philosopher might object that in the actual world, the stock was not at the threshold, so the effect was zero. The expected effect is a forward-looking calculation, but the moral question might be about the actual effect. However, at the time of decision, we don't know the actual state. So the expected effect is what we can act on.

  Case 3: Voting.

    - Objection: The probability of being pivotal is very small. In large elections, it is exponentially small. So the ICE is 0 with very high probability, and 1 only in the extremely rare event of a tie.
    - Expected-difference: The expected effect is P(pivotal) * 1. This is small but positive. However, the harm (or benefit) of changing the election outcome might be huge. So the expected effect might be non-negligible if P(pivotal) is not too small and the stakes are high. But in practice, P(pivotal) is very small.

    The causal effect is identified only if we can model the voting process and the uncertainty. We can compute P(pivotal) using a model (e.g., a binomial model with known probability).

  Case 4: Many-hands torture.

    - Objection: Each torturer turns the dial a tiny bit. The victim's pain is a continuous function of the total dial setting. The ICE of one torturer is the change in pain from their turn, which is imperceptible. So each individual action causes no perceptible harm.
    - Expected-difference: If there is a threshold at which the pain becomes unbearable (or causes death), then the expected effect is the probability that the total dial setting is exactly at the threshold times the harm of crossing the threshold. But the dial setting is continuous, so the probability of being exactly at the threshold is zero. Alternatively, in a continuous model, the marginal effect is the derivative of the pain with respect to the dial setting, which is positive but very small (1/1000 of the full effect if there are 1000 torturers and the effect is linear). So the expected effect is small.
    - Participation: Each torturer is part of the group causing the harm. They are complicit in the torture.

  Step 4: Two sub-questions.

  Sub-question 1: Chicken case with unknown threshold.

  What do our tools deliver?

  We have a binary outcome: whether an order is placed (and thus B chickens are killed) or not. Our action is buying one chicken. The state is the current stock level. We don't know the threshold S (which might be fixed) and we don't know the current stock level.

  We can:

    a) Assume a uniform prior over the stock level (from 0 to M) and a known threshold S. Then the expected effect is B * P(stock=S) = B/(M+1). If we don't know S, we might have a prior over S as well. Then we integrate over both.

    b) Without any prior, we can compute bounds: the effect is either 0 or B. So the expected effect is between 0 and B. This is not very informative.

    c) We can use data: if we observe the restocking pattern, we might estimate S and the current stock. But at the time of purchase, we don't observe the stock.

    d) Sensitivity analysis: we can see how the expected effect changes with assumptions about S and the stock.

  Does this answer the philosophical question? It gives a quantitative expected effect. But the philosopher might say: but in reality, the effect is either 0 or B, and if it's 0, then I caused nothing. The expected effect is a guide for decision under uncertainty. However, the moral question might be about the actual outcome. But since we must act under uncertainty, the expected effect is what we have.

  Sub-question 2: Emissions case with a confidence interval.

  The estimated per-person effect is the slope of the harm function per unit emission. We cannot distinguish it from zero because the effect is too small relative to the noise. So the confidence interval includes zero. But the point estimate is positive (if we believe the linear model). The confidence interval tells us that we cannot rule out zero effect, but we also cannot rule out a small positive effect. This restates the puzzle: we don't know if the effect is zero or not? But in fact, we have a strong theoretical reason to believe the effect is positive and linear. The confidence interval reflects sampling variability, but if we have a large enough sample, we might get a tight interval around a very small positive number. However, in practice, we don't have data to estimate the effect of one person's emissions because we cannot randomize individuals to emit or not and see global outcomes. We rely on a physical model.

  The confidence interval doesn't help the philosopher much because the issue is not sampling variability but the scale of the effect. The effect is positive but so small that it is morally negligible. The philosopher is concerned with whether it is morally permissible to ignore such a small effect. The causal-inference framework confirms that the effect is positive but very small, but it doesn't resolve the moral question.

  Step 5: Verdict.

  The residue: The causal-inference framework (potential outcomes, DAGs, SCC, etc.) can handle the expected-difference reply naturally. It shows that in the chicken case, the expected effect is positive and can be quantified with a prior. In the voting case, it is positive but tiny. In the emissions case, it is positive and tiny. In the torture case, it is positive and tiny.

  However, the participation reply and the non-counterfactual causal role are not about consequences but about the nature of the action itself. They are not captured by the causal-inference framework. The causal-inference framework is inherently consequentialist. Therefore, for those replies, the translation distorts them or fails.

  The inefficacy objection is defused in the expected-difference sense: the individual does make a difference in expectation, and that expectation is the relevant guide for decision under uncertainty. But for cases where the expected difference is extremely small (like emissions and voting), the objection might still stand: why care about an effect that is 10^-9? The participation reply then becomes important: because it's not about the consequences but about being part of a harmful practice.

  My verdict: The causal-inference framework has a good reply to the inefficacy objection in the expected-difference form, especially in the chicken case where the expected effect might be non-negligible. But for the emissions case, the expected effect is so small that it might not move a consequentialist. Then we must rely on non-consequentialist reasons (participation, fairness) which are outside the causal-inference vocabulary. Therefore, the reading group's three replies are complementary: the expected-difference reply works in some cases and not others, and the participation reply covers the rest.

  What would change my mind? If someone could show that in the emissions case, the expected harm of an individual's emissions is not negligible (for example, because of the possibility of being part of a cascade that triggers a tipping point with non-negligible probability), then the expected-difference reply would be stronger. Alternatively, if someone could show that the participation reply can be fully grounded in a causal-inference framework (like the SCC model) without moral assumptions, then the causal-inference framework would be more comprehensive.

  Concrete residue report:

  1. Objection: Implicit estimand is ICE_i = Y(A_i=1) - Y(A_i=0). In the emissions case, it is identified and positive but very small. In the chicken case, it is not identified without knowledge of the state, but we can compute expected ICE with a prior. In voting, it is identified as P(pivotal) and is very small. In torture, it is the marginal effect and is small.

  2. Expected-difference reply: This is about the expected ICE, conditional on the individual's information at the time of action. For chicken, it is identified under a prior. For voting, it is identified under a model. For emissions, it is identified under a physical model. For torture, it is identified and small.

  3. Participation reply: This is not about an estimand. It is a moral claim. We might try to force it into an attributable fraction (population) or etiologic fraction (individual), but these are still causal and counterfactual. The SCC model can capture that the individual's action is a component of a sufficient cause, but in cases of overdetermination (like the chicken already dead) it may not be necessary. This is a distortion because the participation reply is not about counterfactuals.

  4. Non-counterfactual causal role: This might be about being a part of the actual causal process. In the DAG, the individual's action is a parent of the outcome. But that's not enough for a causal effect (which is counterfactual). In the SCC model, it might be a component. But again, this is still within a causal model that is counterfactual. The philosophers might have in mind a notion of causation as production or process, which is not captured by the potential-outcome framework.

  On smuggling consequentialism: The entire potential-outcome framework is consequentialist. Therefore, translating the participation reply into causal-inference terms assumes consequentialism, which is the very thing that reply is trying to avoid.

  Verdict: The inefficacy objection is partially defused by the expected-difference reply, which causal inference handles well. But in cases where the expected difference is extremely small, the objection remains, and we must turn to non-consequentialist replies. The residue is the non-consequentialist part, which causal inference cannot capture. Therefore, your causal vocabulary is blind to the non-consequentialist aspects that the philosophers are tracking. However, the prevention paradox does not directly answer the individual question: it says that the majority of cases come from low-risk individuals, but that does not tell an individual low-risk person what to do. The expected-difference reply does.

  Final answer: Both. The causal-inference framework provides a clear answer to the expected-difference reply and shows that the action does have an expected effect, but it cannot capture the non-consequentialist replies. Therefore, the inefficacy objection is shallower than it sounds in the chicken case (where the expected effect might be non-negligible) but deeper in the emissions case (where the expected effect is negligible and we must rely on non-consequentialist ethics).
answer: |-
  ### Restatement of the Dispute in Causal-Inference and Epidemiological Terms

  The inefficacy objection claims that individual actions (e.g., driving, buying a chicken, voting) have no causal effect on outcomes (e.g., climate harm, chicken deaths, election results, torture outcomes) because they fail to change the outcome in isolation. The three philosophical replies—expected difference, participation/fair-share, and non-counterfactual causal role—aim to counter this. Below, I translate each into causal-inference vocabulary, flagging distortions, inexpressible elements, and smuggled moral assumptions. I address the four cases separately and conclude with a verdict.

  #### **1. Translation of Objection and Replies**
  **Inefficacy Objection**  
  - **Core claim**: Individual causal effect (ICE) is zero.  
  - **Estimand**: ICE<sub>i</sub> = Y(A<sub>i</sub>=1) - Y(A<sub>i</sub>=0), where Y is the outcome, and A<sub>i</sub> is individual i's action.  
  - **Identification**:  
    - *Emissions*: ICE<sub>i</sub> ≈ ∂Y/∂A<sub>i</sub> (marginal harm per unit emission). In linear models, identified but empirically indistinguishable from zero due to scale. Not identified if harm is nonlinear with unknown thresholds (e.g., tipping points).  
    - *Chicken*: ICE<sub>i</sub> is zero if i's purchase doesn't trigger restocking; nonzero if it does. Unidentified without knowledge of inventory threshold.  
    - *Voting*: ICE<sub>i</sub> = 1 if i's vote breaks a tie; else 0. Identified as P(i pivotal) under electoral models.  
    - *Torture*: ICE<sub>i</sub> = ΔY (change in pain from i's dial turn). Identified but infinitesimal in continuous models.  
  - **Distortion-free?** Yes—cleanly maps to ICE.  
  - **Moral smuggling**: Assumes consequentialism (only consequences matter). Non-consequentialist concerns (e.g., complicity) are excluded.

  **Reply 1: Expected Difference**  
  - **Core claim**: Expected harm is non-negligible due to small probability of being pivotal × large harm.  
  - **Estimand**: E[ICE<sub>i</sub>] = E[Y | A<sub>i</sub>=1, X] - E[Y | A<sub>i</sub>=0, X], with X including uncertainty about others' actions or system state.  
  - **Identification**:  
    - *Emissions*: E[ICE<sub>i</sub>] = P(at tipping point) × harm. Unidentified without prior on tipping-point location.  
    - *Chicken*: E[ICE<sub>i</sub>] = P(inventory at threshold) × batch size (B). Unidentified without prior on threshold/stock.  
    - *Voting*: E[ICE<sub>i</sub>] = P(i pivotal) × election stakes. Identified under probabilistic voting models.  
    - *Torture*: E[ICE<sub>i</sub>] ≈ ∂Y/∂A<sub>i</sub> (linear) or P(at pain threshold) × harm (threshold). Latter unidentified without threshold prior.  
  - **Distortion-free?** Mostly—translates to expected ICE. Distortion arises if "expected harm" is interpreted as a moral expectation (e.g., risk aversion) not captured in E[·].  
  - **Inexpressible elements**: None—fits standard causal inference.  
  - **Moral smuggling**: Pure consequentialism (only expected outcomes matter).

  **Reply 2: Participation/Fair Share**  
  - **Core claim**: What matters is participating in harm or failing one's duty, not difference-making.  
  - **Estimand**:  
    - *Attributable fraction*: Population-level fraction of harm due to exposure (e.g., total emissions).  
    - *Etiologic fraction*: Probability that i's action was necessary for a sufficient cause (SCC model).  
    - *Per-capita share*: (A<sub>i</sub> / ΣA) × Y (e.g., individual's emissions share × total harm).  
  - **Identification**:  
    - *Emissions*: Per-capita share identified if total harm is known; etiologic fraction unidentified (overdetermined causes).  
    - *Chicken*: Etiologic fraction unidentified (chicken death overdetermined by demand).  
    - *Voting*: No participation estimand—voting is not "harmful."  
    - *Torture*: Per-capita share identified; etiologic fraction unidentified (pain overdetermined).  
  - **Distortion**: Severe. Forces non-consequentialist ideas (duty, complicity) into counterfactual frameworks. Etiologic fraction assumes necessity, which fails in overdetermined cases.  
  - **Inexpressible elements**: The moral concepts of *complicity* and *duty*—e.g., "buying a chicken is wrong even if it changes nothing" cannot be expressed without moral primitives.  
  - **Moral smuggling**: Translating participation as an estimand assumes consequentialism. The reply itself rejects consequentialism, so translation smuggles in the opposition's framework.

  **Reply 3: Non-Counterfactual Causal Role**  
  - **Core claim**: Causation is about being part of a causal process, not counterfactual difference-making.  
  - **Estimand**:  
    - *Sufficient-component-cause (SCC)*: i's action is a component of a sufficient cause (e.g., in a DAG, A<sub>i</sub> is an ancestor of Y).  
    - *Causal attribution*: i's action contributes to Y in the actual world (e.g., emissions are part of cumulative pollution).  
  - **Identification**:  
    - *Emissions*: SCC component identified if A<sub>i</sub> is part of a minimal sufficient set.  
    - *Chicken*: SCC unidentified (purchase not necessary for death; death occurs without i).  
    - *Voting*: Non-counterfactual role unidentified (no causal process without pivotality).  
    - *Torture*: SCC component identified (each dial turn is part of sufficient cause for pain).  
  - **Distortion**: Moderate. SCC/DAGs capture "being part of" causation but still rely on counterfactuals (e.g., necessary components in minimal sets).  
  - **Inexpressible elements**: *Process-based causation* (e.g., "i's dial turn directly contributed to pain")—Pearl-style interventions are counterfactual.  
  - **Moral smuggling**: Assumes causation implies moral responsibility, which is substantive.

  #### **2. Moral Assumptions Smuggled by Causal Vocabulary**
  - **Consequentialism**: Potential outcomes, ICE, and expected effects are inherently consequentialist—they evaluate actions solely by outcomes. Translating participation or non-counterfactual replies into estimands (e.g., etiologic fraction) imposes consequentialism on non-consequentialist claims.  
  - **Moral Neutrality**: Causal inference assumes estimands are value-neutral, but philosophers tie causation to responsibility. For example, labeling something a "cause" in an SCC model may imply blame, which is a moral leap.  
  - **Where it matters**: In replies 2 and 3, translation fails by assuming the answer—e.g., "participation matters only if it changes outcomes" is built into estimands, but the reply denies this.

  #### **3. Case-Specific Analysis**
  **Greenhouse-Gas Emissions**  
  - **Objection**: ICE<sub>i</sub> ≈ 0 (tiny marginal effect).  
  - **Expected difference**: E[ICE<sub>i</sub>] = ∂Y/∂A<sub>i</sub> > 0 but negligible; or P(tipping) × harm (unidentified).  
  - **Participation**: Per-capita share identified; etiologic fraction unidentified.  
  - **Non-counterfactual**: SCC component identified (emissions are part of sufficient cause).  
  - **Key issue**: Consequentialist tools show a positive effect, but it is dwarfed by uncertainty/scale.

  **Supermarket Chicken**  
  - **Objection**: ICE<sub>i</sub> = 0 (no change in chicken deaths).  
  - **Expected difference**: E[ICE<sub>i</sub>] = P(stock at threshold) × B. Unidentified without prior on threshold/stock.  
  - **Participation**: Etiologic fraction unidentified (death overdetermined).  
  - **Non-counterfactual**: SCC component unidentified (purchase not necessary).  
  - **Key issue**: Threshold uncertainty dominates.

  **Voting**  
  - **Objection**: ICE<sub>i</sub> = 0 (non-pivotal).  
  - **Expected difference**: E[ICE<sub>i</sub>] = P(pivotal) × stakes. Identified but tiny in large elections.  
  - **Participation**: No estimand—voting isn't "harm."  
  - **Non-counterfactual**: No role without pivotality.  
  - **Key issue**: Knife-edge nature amplifies inefficacy intuition.

  **Many-Hands Torture**  
  - **Objection**: ICE<sub>i</sub> ≈ 0 (imperceptible pain change).  
  - **Expected difference**: E[ICE<sub>i</sub>] = ∂Y/∂A<sub>i</sub> > 0 but tiny; or P(at threshold) × harm (unidentified).  
  - **Participation**: Per-capita share identified; etiologic fraction unidentified.  
  - **Non-counterfactual**: SCC component identified (each turn is part of sufficient cause).  
  - **Key issue**: Continuous harm obscures individual responsibility.

  #### **4. Sub-Questions**
  **Chicken Case: Threshold Uncertainty**  
  - **Causal-inference tools**:  
    - *Bounds*: ICE<sub>i</sub> ∈ [0, B] (sharp but uninformative).  
    - *Prior over threshold*: E[ICE<sub>i</sub>] = B × P(stock = S | data). With uniform prior, E[ICE<sub>i</sub>] = B/(M+1) (M = max stock).  
    - *Sensitivity analysis*: Vary S or prior to test robustness.  
  - **Answers the philosophical question?** Partially. It quantifies expected harm under uncertainty, supporting the expected-difference reply. However, it changes the subject from actual effect (which could be zero) to expected effect. The participation reply (moral duty not to participate) remains unaddressed.

  **Emissions Case: Confidence Intervals**  
  - **Causal-inference response**: A CI straddling zero (e.g., [-δ, δ]) indicates statistical insignificance but does not imply ICE<sub>i</sub> = 0. Theory (e.g., physics) suggests ∂Y/∂A<sub>i</sub> > 0, so point estimate is positive but tiny.  
  - **Work for philosophers?** Restates the puzzle: the effect is real but morally negligible. CI adds nothing beyond noting uncertainty; the core issue is whether negligibility justifies inaction. Consequentialists care about point estimates; non-consequentialists reject the framing.

  #### **5. Verdict**
  **Residue Report**: Your causal-inference vocabulary cleanly handles the expected-difference reply and shows that inefficacy is often overstated (ICE<sub>i</sub> is rarely exactly zero). For the chicken case, tools like priors over thresholds provide actionable guidance: E[ICE<sub>i</sub>] may be non-negligible if batch sizes are large. However, this framework is blind to non-consequentialist elements in the participation and non-counterfactual replies (e.g., complicity, duty), which cannot be expressed without distortion. The inefficacy objection is shallower than it sounds for expected-difference (e.g., in chicken purchases) but persists for emissions/voting where effects are tiny, and for non-consequentialist concerns.

  **Verdict**: You are closer for the expected-difference reply—epidemiology defuses inefficacy by quantifying expected effects. But the political theorist is closer for participation/fair-share—your vocabulary smuggles in consequentialism and cannot capture the moral residue. The prevention paradox is a red herring; it describes population dynamics but doesn't resolve individual obligations.

  **What would change my mind?**  
  - If causal inference could formalize non-consequentialist concepts (e.g., "complicity" as a primitive).  
  - If expected effects were large enough to swamp non-consequentialist concerns (e.g., in chicken case with high P(threshold)).  
  - Empirically: If data showed P(tipping) for emissions is non-negligible, making E[ICE<sub>i</sub>] substantial.  

  **Final Take**: Use expected-difference to counter inefficacy where effects are identifiable and non-negligible (e.g., chicken), but concede that for emissions/voting, the participation reply is the philosophically robust answer—even if it feels like changing the subject.
