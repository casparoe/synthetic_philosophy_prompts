  Looking at their cases: the expensive tastes person is classic for distinguishing welfare from resources; the cheerful adapted preferences case shows adaptive preferences issues; the wheelchair user and high-maintenance body cases are good for capability vs. resources; the religious faster vs. hungry person cleanly shows capability vs. functioning; gambler vs. unlucky victim highlights responsibility; depressed person with options points to capability/opportunity; robust modest prospects vs. fragile high prospects relates to risk and security; the life trajectory case addresses time-slice vs. whole-life equality. All seem strong, so I'll keep all eight.

  For the key, they want six to eight "leaves" built from logical combinations of answers, not from named theories. I need to map the cases to decision points that branch into different currencies. The leaves must include specific currencies like actual welfare, opportunity for welfare, resources, social primary goods, capabilities (both open and fixed list), and Cohen's midfare. Plus their two custom ones: fallback position and recoverability. I should check if those collapse into existing categories—fallback might relate to risk-aversion in resources or security in capabilities, but it's distinct as a floor-focused metric. Recoverability is about resilience after shocks, which isn't covered elsewhere, so it deserves its own leaf.

  They want flags for indistinguishable pairs, like resources vs. primary goods. I think the expensive tastes case prises them apart: resources would compensate the wheelchair user but not expensive tastes, while primary goods might handle both similarly if tastes aren't considered. Adding a question about innate talents could help, but the existing cases might suffice. For sufficientarians/prioritarians, I need a routing question early on to catch them. Something like asking directly if equality matters or just sufficiency, placed at the start.

  Structuring the quiz: start with the routing question for sufficientarians. Then order the cases to build complexity. Key structure: after the quiz, the key should show combinations. For example, answers to expensive tastes and adaptive preferences determine welfare vs. other currencies. Disability cases distinguish resources from capabilities. Religious fasting vs. hunger splits capability and functioning. Gambler case brings in responsibility. Depression case highlights opportunity vs. achievement. Prospects case adds risk sensitivity. Life trajectory for time-slice. Each answer combination leads to a leaf.

  Final leaves: Actual Welfare, Opportunity Welfare, All-Purpose Resources (like Dworkin), Primary Goods (Rawlsian), Open Capabilities, Fixed-List Capabilities, Midfare (Cohen), Fallback Value, Recoverability. I'll note that Fallback might overlap with security in capabilities but stands alone. Recoverability is unique. Indistinguishable pairs: Primary Goods and Resources are hard to separate with given cases; adding a talents question would help, but I'll flag it. Also, Open vs. Fixed Capabilities might blur without a list question, but the fasting case implies it.

  This should create an engaging, intuitive quiz that sorts students into currency views based on gut reactions, with a clear key for discussion.
answer: |-
  Here’s a streamlined sorting quiz with 8 cases (all your suggestions are strong, so I kept them all) and a logical key that routes students to 9 distinct "currencies of equality," including your two custom metrics. The quiz avoids jargon and focuses on gut reactions.

  ---

  ### **Equality Sorting Quiz: What Should We Equalize?**
  *Read each scenario and pick the option that feels fairest to you. There are no right/wrong answers—go with your instinct.*

  1.  **The Gourmet vs. The Simple Eater:**  
      Person A needs truffles and champagne to be as happy as Person B is with beans and tap water. With equal money, A is miserable; B is content. Should we:  
      (A) Give A extra money to reach B’s happiness level?  
      (B) Keep money equal? Happiness isn’t our job to guarantee.  

  2.  **The Cheerful Deprived:**  
      Person C lives in a damp, dark room with little food but has adapted. They’re genuinely happy. Person D has a warm, bright room and good food but is only slightly happier. Should we:  
      (A) Improve C’s conditions even if they don’t feel unhappy?  
      (B) Leave things as they are? C is fine.  

  3.  **The Wheelchair User:**  
      Person E uses a wheelchair and needs £10,000 for a ramp to access work. Person F walks easily. To make their work access equal, should we:  
      (A) Give E £10,000 (so both have "money + body" resources)?  
      (B) Build the ramp (so both can *get to work*)?  

  4.  **High-Maintenance Health:**  
      Person G has a rare condition needing £5,000/month medication just to stay alive. Person H is healthy. To treat them equally, should we:  
      (A) Give G £5,000/month extra (so both have equal cash for needs)?  
      (B) Provide G’s medication (so both *stay alive*)?  

  5.  **Religious Faster vs. Starving Person:**  
      During a famine, Person J chooses to fast for faith and isn’t hungry. Person K is starving with no food. Should we:  
      (A) Give food only to K (K *needs* it to function)?  
      (B) Offer equal food to both (both have the *capability* to eat)?  

  6.  **The Gambler & The Lightning Victim:**  
      Person L gambled away their savings. Person M lost savings to a freak accident (no insurance possible). Both are now destitute. Should we:  
      (A) Help both equally? Bad luck is bad luck.  
      (B) Prioritize helping M? L chose the risk.  

  7.  **Paralyzed by Depression:**  
      Person N has incredible talents, opportunities, and money but is too depressed to leave bed. Person O has modest options but uses them fully. Should we focus on:  
      (A) N’s wasted *potential*? They need mental health support.  
      (B) O’s actual *achievements*? N isn’t using what they have.  

  8.  **Robust Modesty vs. Fragile Success:**  
      Person P has low but stable earnings; even a disaster only sets them back 10%. Person Q has high earnings but one setback (e.g., injury) wipes them out completely. Whose situation is worse?  
      (A) Q’s—their potential loss is catastrophic.  
      (B) P’s—their upside is so limited.  
      (C) They’re equally concerning; both face risks.  

  ---

  ### **The Routing Question (For Sufficientarians/Prioritarians)**
  *Before analyzing the cases, answer this:*  
  **"In a crisis, does it matter *who* is worst off, or only that *someone* is below a decent minimum?"**  
  - **YES, who matters (equality/currency matters)** → Proceed to the quiz key.  
  - **NO, only the minimum matters** → You’re likely a **Sufficientarian/Prioritarian**. Equality of any "currency" isn’t your core concern; preventing dire hardship is. (Exit the tree here.)

  ---

  ### **Key: What Currency of Equality Do You Favor?**
  *Match your answers to the combinations below. Letters refer to your choices (e.g., 1A, 3B).*

  1.  **If you answered MOSTLY A to questions 1, 2, AND 5A:**  
      → **Actual Welfare.** You think we should equalize how happy or satisfied people actually feel (even if tastes are expensive or adapted).  
      *Familiar View:* Hedonistic/Preference Satisfaction Utilitarianism.  
      *Risk:* Ignores freedom, responsibility, and may reward adaptive preferences.

  2.  **If you answered 1B (no extra for tastes) AND 2A (help adapted preferences) AND 7A (focus on potential):**  
      → **Opportunity for Welfare.** You care about equal chances to be happy, not guaranteed happiness. People should have the *means* to pursue fulfillment.  
      *Familiar View:* Richard Arneson's "Opportunity for Welfare."  
      *Note:* Differs from Actual Welfare by rejecting 1A.

  3.  **If you answered 1B (no extra for tastes), 3A (cash for ramp), 4A (cash for meds), AND 6A (help gambler):**  
      → **All-Purpose Resources.** You think we should equalize people’s share of impersonal resources (money, rights), letting them choose how to use it. Misfortune (like disability) is compensated with cash.  
      *Familiar View:* Ronald Dworkin’s "Resources."  
      *Stability:* Can struggle with converting resources (e.g., wheelchair user needing a ramp, not cash).

  4.  **If you answered 1B, 3A, 4A, BUT 6B (don’t help gambler):**  
      → **Social Primary Goods.** You want to equalize key all-purpose means (rights, income, powers) that everyone needs, regardless of goals. Personal responsibility matters (gamblers don’t get bailouts).  
      *Familiar View:* John Rawls’ "Primary Goods."  
      **❗ Indistinguishable Alert:** This and "All-Purpose Resources" (Leaf 3) are *very hard to separate* with these cases. Both answer 1B, 3A, 4A. Only the gambler case (6) might split them, but interpretations vary. A question about innate talent (brute luck) vs. effort could help.

  5.  **If you answered 3B (build the ramp) OR 4B (provide meds) OR 5B (offer food to faster), PLUS 7A (focus on potential):**  
      → **Capabilities (Open List).** You think we should equalize people’s real *opportunities* to do and be what they value (e.g., move freely, stay healthy, eat). The list of important capabilities isn’t fixed.  
      *Familiar View:* Amartya Sen’s "Capabilities."  
      *Note:* Differs from Resources by focusing on *freedom to achieve*, not stuff or welfare.

  6.  **If you answered 3B OR 4B OR 5B, PLUS 5A (food only to starving person) AND 7B (focus on achievements):**  
      → **Capabilities (Fixed List) / Functionings.** You want to equalize core *achievements* (being nourished, mobile, healthy) or opportunities from a defined list of essentials. Actual outcomes (functionings) sometimes matter more than freedom.  
      *Familiar View:* Martha Nussbaum’s "Central Capabilities," or Functionings focus.  
      *Split:* Differs from Open Capabilities via 5A and 7B (emphasis on critical outcomes).

  7.  **If you answered 1B, 2A, 3B OR 4B, AND 7A, BUT NOT fitting Leaf 5 or 6 cleanly (e.g., conflicted on 5):**  
      → **Midfare / Access to Advantage.** You care about what happens *between* resources and welfare—e.g., whether needs are met, opportunities are real. It’s about access to *conditions* for a good life.  
      *Familiar View:* G.A. Cohen’s "Access to Advantage."  
      *Stability:* Often a middle ground; may feel like Capabilities but less systematic.

  8.  **If you answered 8A (fragile success is worse):**  
      → **Fallback Value.** Your focus is on the *worst realistic outcome* someone could face through no fault of their own (e.g., Q’s total collapse). Equality means equalizing security floors.  
      *Your Custom View:* Distinct! Prioritizes minimizing maximum downside risk. Not directly covered by other leaves. Stable but niche.

  9.  **If you answered 8B (robust modesty is worse) OR 8C (both concerning):**  
      → **Recoverability.** You care about how quickly/fully someone bounces back after a setback (e.g., P’s resilience vs. Q’s fragility). Equality means equal capacity to withstand shocks.  
      *Your Custom View:* Distinct! Focuses on resilience, not baseline levels. Doesn’t collapse into other leaves. Novel and coherent.

  ---

  ### **Empty Slots & Unstable Combinations**
  *   **Actual Welfare + Responsibility (e.g., 1A + 6B):** Unstable. If welfare is all that matters, why punish gamblers? Rarely held.
  *   **Functionings + No Help for Adapted Preferences (e.g., 5A + 2B):** Unattractive. Why force food on a faster but ignore someone adapted to deprivation? No major theory lives here.
  *   **Strong Midfare + Resources:** Collapses into Capabilities or Cohen. Midfare implies resources aren’t enough (rejecting 3A/4A).

  ### **Why This Works**
  - **Gut-Reaction Focus:** Cases use vivid, relatable dilemmas without theory terms.
  - **Clear Branches:** Key differences (e.g., compensating disability with cash vs. ramps) cleanly split major views.
  - **Your Custom Views:** **Fallback Value** (8A) and **Recoverability** (8B/C) emerge naturally and are logically distinct. Neither collapses.
  - **Sufficientarians Routed Early:** The pre-quiz question cleanly isolates them.
  - **Indistinguishable Pair Flagged:** Resources vs. Primary Goods (Leaves 3 & 4) is the only major overlap. Adding a question like *"Should someone born with no talents get extra help vs. someone lazy?"* (A = Resources/Dworkin; B = Primary Goods/Rawls) would split them.

  This gives students a personal stake in the debate before theory even starts. Good luck with the seminar!
