prompt: |-
  I'm doing a second-year option called Collective Decision-Making, and two people on the course had a proper row after last week's seminar that I got dragged into refereeing and handled badly. I've got a 600-word response on the same case due Friday, so I'd like to get it straight. Can you go through their exchange and adjudicate it move by move — who's right about which specific point, not just who wins overall — and say what, if anything, both of them were missing?

  The case on the problem sheet: a five-person research ethics committee deciding whether to halt a study. Three propositions. A = the study enrolled participants without properly documented consent. B = enrolling people without documented consent is a serious breach under the university's own policy. C = the study should be halted. Everyone accepts the committee's own rule that C holds if and only if A and B both hold. The votes fall out like this: members 1 and 2 accept all three; member 3 accepts A only; member 4 accepts B only; member 5 accepts none. So A is 3–2 in favour, B is 3–2 in favour, and C is 2–3 against.

  Jonas opened by defending the premise-based procedure: vote A and B seperately, apply the rule, halt the study. His argument was that the committee is supposed to decide on the basis of reasons, and the majority against C is a coalition with no shared reason — member 3 thinks B fails, member 4 thinks A fails, member 5 thinks both fail — so there is no majority-endorsed ground for letting the study run, whereas the majorities for A and B are each backed by a rule every member already accepts.

  Meera's reply had three parts. First, if you take the majority verdict on every proposition on the agenda you get A, B and not-C, which by the committee's own rule is jointly inconsistent: the committee has asserted something nobody could believe, and an inconsistent output isn't a decision at all. Second, the premise-based route halts a study that three of the five members voted not to halt. Third, Jonas's complaint about the anti-C majority having no shared rationale proves far too much: every 3–2 majority is a coalition of people who disagree about other things, so if that objection sinks the majority on C it sinks the majorities on A and B too, and no majoritarian procedure survives.

  Jonas then said the inconsistency charge is an artefact of putting C on the ballot at all. Take it off, vote the findings and the policy question, and let the chair apply the rule — that's just how committees work, and you get a perfectly consistent set. He added what he called the real advantage: the premise-based procedure lets you match the decision rule to the kind of proposition. A is a factual question where simple majority is fine, or where you might defer to whoever actually audited the files; B is a policy judgement where you'd want a supermajority, or to defer to the ethics officer. Collapsing everything into one vote on C throws away the information about what the committee was actually unsure about, and being unsure about A and being unsure about B call for completely different follow-ups — re-audit the consent forms versus rewrite the policy.

  Meera said that was exactly the problem: once you can choose a threshold per proposition, and once it matters which propositions are on the ballot and how finely they're described, the outcome is settled before anyone votes. If the chair splits A into two findings about the two recruitment sites and says both must hold, halting now needs two majorities to line up instead of one; if the policy instead lists two independent grounds for halting — undocumented consent, or no ethics approval at all — splitting those into two ballot items makes halting easier. Same committee, same beliefs, opposite outcomes. And the tailoring point doesn't force the premise-based procedure to be the decision rule: you can vote on A and B and publish the results for the record, and still make the actual decision on C.

  Then Jonas switched to numbers. Suppose each member is independently 80% reliable on each premise. If A and B are both true, a member gets C right only if they get both premises right, so their judgement on C is 0.64 reliable; a majority of five at 0.64 is right about 75% of the time. But a majority on each premise is about 94% reliable, and 0.94 × 0.94 is about 89%. So the premise-based procedure does much better at tracking the truth, which is what the committee is for.

  Meera said he'd picked the world that suits him. If the truth is that the study shouldn't be halted because exactly one of A and B fails, then each member gets C right unless they wrongly accept both — 0.8 × 0.2 = 0.16, so 0.84 reliable — and a majority at 0.84 is about 97%, while the premise-based procedure drops to about 94% because it now needs both majorities to come out the same way. So the epistemic case for the premise-based procedure is contingent on which way the truth lies, and the committee doesn't know that in advance. She also said the independence assumption is hopeless anyway: five people who've read the same file and talked about it in the corridor don't make independent errors, so the amplification that both procedures rely on is largely fictional.

  Jonas's last move was that the comparison still favours him: in the world where the committee most needs help, the premise-based procedure gains something like fourteen points, while in the other world it loses about two because both procedures are already near the ceiling. And correlated errors hurt the conclusion-based procedure worse, since it starts from noisier individual inputs.

  Please rate each of the seven moves from clearly mistaken to clearly right with a brief justification, check the arithmetic where there is any, and then say who is more right overall and what both of them left out.
reasoning: |-
  Hmm, the user is in a tricky situation with a collective decision-making course. They've been caught in the middle of a heated debate between Jonas and Meera about research ethics committee procedures, and now they need to write a 600-word response by Friday. They want me to adjudicate each move in the argument with detailed ratings and justifications, check the math, and identify what both debaters missed.

  Looking at the case: It's about a five-person committee voting on three propositions (A, B, C) with a defined logical relationship (C iff A∧B). The votes create a doctrinal paradox situation where majority voting on premises would halt the study (A and B both pass), while majority voting on conclusion (C) would not halt it. This classic puzzle in social choice theory sets up their debate perfectly.

  Jonas argues for premise-based voting: He emphasizes reason-based decision-making, procedural advantages like differentiated thresholds, and epistemic superiority in truth-tracking. Meera counters with consistency concerns about the conclusion-based approach, procedural manipulation risks, and contingency in epistemic arguments. Their exchange has seven distinct moves that build on each other.

  I need to evaluate each move rigorously. For the epistemic arguments (moves 5 and 6), I'll verify the probability calculations. Both rely on unrealistic independence assumptions, but Jonas's point about asymmetric gains/losses holds mathematically. Move 7's claim about correlated errors affecting conclusion-based voting more severely also checks out statistically since it aggregates noisier individual judgments on C.

  What's conspicuously absent? Neither addresses how real committees handle such paradoxes (e.g., deliberation before voting, chair's casting vote, or sequential consideration of premises). They also overlook that the voting procedure itself should be decided collectively - a meta-decision they're fighting about without acknowledging the irony. The institutional context matters too: Is this a one-off vote or recurring decision? Are members experts or representatives?

  For the overall verdict: Jonas wins on epistemic grounds (4-2 with one tie), but Meera correctly identifies fatal flaws in premise-based voting's vulnerability to agenda manipulation. The math slightly favors Jonas, but in real-world terms, Meera's practical concerns about consistency and procedural fairness are equally valid. Their blind spots are complementary - Jonas ignores implementation risks, Meera downplays truth-tracking benefits.

  The user's response should synthesize this: Acknowledge both approaches have merits but require safeguards against their weaknesses. Suggest that actual committees often use premise-based voting with constrained agendas and deliberation, precisely because of the epistemic advantages Jonas cites. But Meera's consistency argument explains why some bodies avoid voting on logically connected propositions separately.
answer: |-
  Here's a move-by-move adjudication of Jonas and Meera's debate, including ratings, justifications, arithmetic checks, an overall verdict, and identification of key blind spots. This analysis is grounded in social choice theory, epistemic democracy, and the specifics of the doctrinal paradox.

  **Move 1: Jonas defends Premise-Based Procedure (PBP)**
  *   **Argument:** Vote separately on A and B, apply rule (C iff A∧B), halt study. Majority for C is incoherent (no shared reason against halting), while majorities for A and B are coherent and backed by accepted rules.
  *   **Rating:** **Mostly Right (but incomplete)**
  *   **Justification:** Jonas correctly identifies the key weakness of the Conclusion-Based Procedure (CBP) – the anti-C majority *lacks a shared rationale*. Member 3 opposes C because they reject B, member 4 opposes C because they reject A, and member 5 opposes both. There is *no majority agreement* on *why* C fails. PBP ensures the decision rests on agreed premises and the accepted rule. However, he doesn't address the inconsistency Meera raises next.

  **Move 2: Meera attacks PBP with Inconsistency, Counter-Majoritarian, and Overgeneralization**
  *   **Arguments:**
      1.  **Inconsistency:** Voting all propositions via majority yields {A, B, ¬C}, which is inconsistent with the rule (C iff A∧B). This isn't a rational collective output.
      2.  **Counter-Majoritarian:** PBP halts the study despite 3/5 voting *against* halting (¬C).
      3.  **Overgeneralization:** Jonas's "no shared reason" critique would also condemn the majorities for A and B (they also contain members disagreeing on other things), invalidating any majoritarian procedure.
  *   **Rating:**
      *   **Inconsistency: Clearly Right.** {A, B, ¬C} is logically inconsistent given C iff A∧B. A collective body asserting this set lacks rational coherence.
      *   **Counter-Majoritarian: Clearly Right (but limited).** PBP *does* produce C when a majority votes ¬C. This violates the simple majority principle on the final outcome.
      *   **Overgeneralization: Mistaken.** Jonas's point is *specific to C* under CBP. The anti-C majority under CBP is defined solely by *rejecting C*, but its members *actively disagree on the premises* (A/B). The pro-A majority under PBP is defined by *accepting A*; members disagreeing on B *within that majority* is irrelevant to the truth of A. Jonas's critique targets the *internal incoherence* of the anti-C coalition under CBP regarding *the reasons for C*, not general disagreement. Meera misapplies the critique.
  *   **Overall Move Rating: Mixed (Strong on 1 & 2, Weak on 3)**

  **Move 3: Jonas counters Inconsistency & argues for Tailoring**
  *   **Arguments:**
      1.  **Resolve Inconsistency:** Don't vote on C. Vote only on A and B (findings/policy), let the chair apply the rule (C iff A∧B). Output {A, B, C} is consistent.
      2.  **Tailoring Advantage:** PBP allows matching decision rules to proposition types (e.g., simple majority for fact A, supermajority/deference for policy B). Voting only on C loses information critical for follow-up.
  *   **Rating:**
      *   **Resolving Inconsistency: Clearly Right.** Removing C from the vote and applying the rule mechanically avoids the logical inconsistency. {A, B} imply C.
      *   **Tailoring Advantage: Mostly Right (but introduces new problems).** Differentiating procedures based on proposition type (fact vs. value/judgment) is a genuine practical advantage of PBP and reflects real committee work. Collapsing to C *does* lose diagnostic information. However, this opens the door to the agenda manipulation Meera identifies next.
  *   **Overall Move Rating: Mostly Right**

  **Move 4: Meera attacks Tailoring with Agenda Manipulation**
  *   **Argument:** Allowing different thresholds per proposition and control over the agenda (which propositions are voted on, how finely grained) means the chair can predetermine the outcome by structuring the vote. Examples: Splitting A (making C harder) vs. splitting grounds for C (making C easier). Tailoring info can be recorded without making PBP the binding decision rule.
  *   **Rating: Clearly Right.** This is a fundamental critique of PBP (and similar sequential procedures). The outcome *can* be manipulated by how the "premises" are defined and which thresholds are applied. The chair (or whoever sets the agenda) gains significant power. Meera correctly notes that the informational benefits of discussing/voting on A and B can be retained without letting that vote *determine* C via the rule – the committee could still vote directly on C after discussing A and B.
  *   **Overall Move Rating: Clearly Right**

  **Move 5: Jonas makes Epistemic Case for PBP**
  *   **Argument:** Assume members 80% reliable on A/B independently. If A and B are both true (C true), PBP (majority on each premise) is ~94% reliable per premise, so ~89% (0.94*0.94) reliable for C. CBP (majority on C) is only ~75% reliable (as C-judgement reliability = 0.8*0.8=0.64). Therefore, PBP tracks truth better.
  *   **Rating: Arithmetic Correct, Argument Flawed (Contingent & Assumption-Dependent)**
  *   **Justification:**
      *   *Arithmetic Check:* Correct. Reliability on C if C true: `P(both correct) = 0.8 * 0.8 = 0.64`. Binomial P(Maj of 5 correct | p=0.64) ≈ 0.75 (actually 0.749, Jonas rounds reasonably). Reliability on A (or B) if true: Binomial P(Maj of 5 correct | p=0.8) ≈ 0.94. P(Both Prem Maj Correct) ≈ 0.94 * 0.94 = 0.8836 ≈ 89%. So PBP is indeed much higher (~89%) than CBP (~75%) *in this specific world* (where A and B are both true).
      *   *Flaw:* This only holds if the *actual world* is one where A and B are *both true* (C true). Jonas assumes the world needing help is where C is true. His calculation ignores worlds where C is false.
  *   **Overall Move Rating: Partially Right (Correct Math for Favored Case)**

  **Move 6: Meera counters Epistemic Case: Contingency & Correlation**
  *   **Arguments:**
      1.  **Contingency:** If the truth is C false because exactly one premise fails (e.g., A true, B false), then:
          *   CBP reliability: Member gets C right if they get *at least one premise wrong* (P=1 - P(both right) = 1 - 0.64 = 0.84). Binomial P(Maj correct | p=0.84) ≈ 0.97.
          *   PBP reliability: Needs Maj correct on A *and* Maj correct on B. P(Maj A correct | A true) ≈ 0.94. P(Maj B correct | B false) = P(Maj *rejects* B | B false) ≈ Binomial P(Maj correct | p=0.8) ≈ 0.94. P(Both) ≈ 0.94 * 0.94 ≈ 0.89 (89%). *But wait!* If B is *false*, a "correct" vote on B is a *reject* vote. P(Maj makes correct decision on B | B false) = P(Maj rejects B) ≈ 0.94. P(Maj makes correct decision on A | A true) ≈ 0.94. P(PBP correct) = P(Correct on A) * P(Correct on B) ≈ 0.94 * 0.94 ≈ 0.89 (89%). Meera's figure (~94%) seems slightly off; it should be ~89%, matching the C-true case. CBP is ~97%. *Correction: Meera's "94%" might be a misstatement or miscalculation; PBP should be ~89%, CBP ~97% in this world.*
      2.  **Correlation:** Independence is unrealistic (shared evidence, discussion). Correlated errors undermine the "wisdom of crowds" amplification for *both* procedures.
  *   **Rating:**
      *   **Contingency: Mostly Right (with corrected calc).** Meera correctly identifies the epistemic advantage is contingent. In C-true worlds, PBP (~89%) beats CBP (~75%). In C-false-via-single-premise worlds, CBP (~97%) beats PBP (~89% - *not* 94%). The committee doesn't know the truth beforehand. *Correction: Her specific PBP number (94%) appears slightly high; it should be the same ~89% as the other case. Her core point stands: CBP wins in this scenario.*
      *   **Correlation: Clearly Right.** The independence assumption is indeed highly unrealistic for a deliberating committee. Correlated errors significantly reduce the reliability amplification of *both* majority-based procedures.
  *   **Overall Move Rating: Mostly Right (Core Contingency Point Valid, Correlation Valid, Minor Calc Flaw)**

  **Move 7: Jonas's Epistemic Rebuttal: Asymmetry & Correlation Impact**
  *   **Arguments:**
      1.  **Asymmetry:** In the world where the committee "most needs help" (low individual reliability on C, which is when C is true), PBP gains significantly (~14 points: 89% vs 75%). In the world where C is false via one premise, PBP loses only a few points (~89% vs ~97% for CBP, a ~8 point loss) *and both procedures are already very reliable*. Net gain for PBP.
      2.  **Correlation Impact:** Correlated errors hurt CBP more because it starts from noisier individual inputs (0.64 reliability on C when true vs. 0.8 on premises).
  *   **Rating:**
      *   **Asymmetry: Mostly Right.** Jonas correctly identifies the *asymmetry*. The epistemic penalty for CBP in the C-true world (where individual judgment on C is worst) is severe. The penalty for PBP in the C-false-single-premise world is smaller, and baseline reliability is high. PBP has a better worst-case or expected performance under many reasonable priors. *Math Check:* Gains ~14% (89-75) in hard case, loses ~8% (97-89) in easy case. Net plausible advantage.
      *   **Correlation Impact: Mostly Right.** If errors on A and B are positively correlated, it *does* generally hurt CBP more when C is true. Correlated errors on premises make correlated errors on C even stronger (if you're wrong on A, you're likely also wrong on B, making you very likely wrong on C). This further reduces CBP reliability below 75% in the hard case. PBP reliability also drops with correlation, but the relative disadvantage of CBP likely increases.
  *   **Overall Move Rating: Mostly Right**

  **Overall Verdict: Jonas has the Stronger Case (Slightly)**
  *   **Why Jonas?** His core arguments hold more weight:
      1.  **Coherence:** PBP avoids the inconsistent output {A, B, ¬C} and bases the decision on collectively agreed reasons/premises + rule. The anti-C majority under CBP *is* incoherent in its rationale.
      2.  **Epistemic Advantage:** Despite contingency, the epistemic analysis (especially Move 7) shows PBP generally outperforms CBP, particularly in the most difficult scenarios (when C is true) and is more robust to realistic correlated errors. Truth-tracking is a core function of such a committee.
      3.  **Procedural Tailoring:** While raising manipulation risks, the ability to tailor decision rules to proposition types is a practical advantage PBP offers over CBP.
  *   **Why not a clear win?** Meera scored significant points:
      1.  **Manipulation Risk:** Her agenda manipulation critique (Move 4) against PBP is decisive and exposes a major vulnerability lacking in CBP.
      2.  **Counter-Majoritarian:** PBP *does* override the majority vote on the conclusion (C). This is a genuine democratic deficit.
      3.  **Contingency:** She successfully countered Jonas's initial, overly simplistic epistemic claim (Move 5).

  **What Both Left Out:**
  1.  **Deliberation's Role:** Neither seriously considered how *deliberation* before voting might resolve disagreements on A or B, potentially avoiding the paradox altogether. The discussion treats votes as raw inputs without prior collective reasoning.
  2.  **The Meta-Decision:** They argue *about* PBP vs. CBP, but never address *how the committee itself should decide which procedure to use*. This is a prior collective decision problem itself! The rule "C iff A∧B" doesn't specify the voting *procedure*.
  3.  **Institutional Context:** Real committees often have chairs, experts, or default procedures. The analysis is abstracted from institutional rules, norms, or hierarchies that might guide or constrain how such votes are structured.
  4.  **Beyond Majority Rule:** They focused solely on majority rule for premises/conclusion. Other options exist: supermajorities, deferring to subcommittees/experts on specific premises (as Jonas hinted but didn't develop), or even lottery systems in deep disagreement. Unanimity on the rule "C iff A∧B" doesn't force unanimity on the voting *method*.
  5.  **Depth of the Inconsistency:** While Meera noted the inconsistency {A, B, ¬C}, they didn't explore its severity. Is it a minor technical glitch, or does it fundamentally undermine the committee's legitimacy or the defensibility of its "decision" to not halt? Jonas's solution (don't vote C) avoids it technically but doesn't engage with the underlying tension.

  **Recommendation for Your Response:** Structure your analysis around the core trade-offs:
  1.  **Coherence & Reasons (Jonas's Strength):** PBP ensures a reason-based, logically consistent decision grounded in agreed premises.
  2.  **Epistemic Performance (Jonas's Edge):** PBP generally tracks truth better, especially in critical scenarios, even with correlated errors.
  3.  **Majoritarian Legitimacy & Manipulation Risk (Meera's Strength):** CBP respects the majority vote on the final outcome but produces inconsistency. PBP risks agenda manipulation and can override the majority on the conclusion.
  4.  **Information & Follow-up (Jonas's Point):** Voting premises provides valuable diagnostic information lost in a single C vote, *even if* the final decision isn't mechanically tied to them via PBP.
  5.  **The Blind Spots:** Explicitly mention the role of deliberation, the meta-decision problem, and institutional context as crucial factors they omitted. Conclude that while the epistemic and coherence arguments favor PBP *in the abstract*, its real-world application requires safeguards against manipulation (e.g., fixed agendas, transparent rules) and should ideally occur within a deliberative process aiming for consensus where possible.
