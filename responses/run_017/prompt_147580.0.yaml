prompt: |-
  I do a podcast and a newsletter on science-and-ideas stuff, and I've got this habit of agreeing to things on panels and then having to actually think them through afterwards. Last week, on a panel about autonomous vehicles, I heard myself say "well, obviously genuine moral dilemmas are possible" and then realised I can't say what makes a conflict a *dilemma* rather than just a difficult choice where one option is better and I don't want to admit it. So I've been putting cases in a notes app with my gut verdict next to each, and the pattern is definately wierder than I expected. What I want is a principle — or a short list of candidates — that fits the verdicts, tells me which ones it can't swallow, and gives me verdicts on two or three cases I haven't listed. Please don't give me the literature: no names, no papers, no "so-and-so argues." I need to know whether there's a shape here or whether I'm just inconsistent, and I'm filing Friday.

  Here are the cases, the way I actually have them:

  1. An armed man tells a woman to pick which of her two children dies, or he kills both. My verdict: whichever she picks she does nothing wrong and shouldn't be blamed — but she should be wrecked by it for a long time, and I'd think less of her if she shrugged it off in a week. Also: if she refuses to choose and both are killed, that's worse, and I do blame her.
  2. Two strangers are drowning, symmetrically situated, I can reach one. My verdict: not a dilemma at all. Save either one, coin flip if you like, no residue beyond ordinary grief.
  3. Wartime: a young man who is the only person his mother has and who would be destroyed if he leaves, versus a resistance that genuinely needs him because there are very few who can do it. My verdict: this one feels like a real dilemma, and I can't tell you why it isn't just case 2 with better costumes.
  4. I made two promises on the same day, knowing I couldn't keep both, and both people get badly hurt. My verdict: the real wrong was making the second promise; breaking either is also wrong; and apologising to the one I let down doesn't clear it, even if I picked the more important one.
  5. I can pay for an operation that restores my own kid's sight, or pay for the same operation for three strangers' kids. My verdict: I'm not required to save the three, and I'm also not required to save mine; both are permitted, and that permission isn't just "anything goes" — it has something to do with whose kid it is.
  6. A mayor authorises something that would normally be an outright violation of people's rights, because it's the only way to avert a much bigger disaster. My verdict: if it's genuinely necessary and proportionate, not wrong — but a mayor who does it briskly and feels nothing afterward is a worse mayor, and resigning instead of doing it is fine, maybe admirable, since someone else will make the call anyway. (This is the pair that keeps me up: in 1 refusing to choose is worse, in 6 handing the choice to somebody else is fine. Is there a difference or am I just inconsistent?)
  7. An ICU doctor during a months-long shortage, allocating beds by a written protocol, shift after shift. My verdict: almost no moral phenomenology at all — it feels like paperwork — even though the stakes dwarf case 3. And the committee that wrote the protocol in advance did feel awful doing it, and I think they should.

  The rough principle I've been gesturing at goes like this: a conflict is a genuine dilemma only if (a) whatever you do leaves a normative remainder, (b) the remainder isn't a debt you can discharge by an apology or a compensation payment, and (c) it isn't the kind of conflict you could have settled in advance by a rule you'd endorse without knowing which party in it you were going to be. I think (c) is the clause doing all the work — it's what makes 7 feel like paperwork and 3 feel like tragedy — but I also suspect it gives the wrong answer somewhere, maybe on 4 or 6. Test it, repair it, or replace it. One more restriction, which I want you to either honour or explain why it's cheating: I've only counted cases where the agent knows what's at stake; the ones where you're simply unsure which option is worse I've been filing separately as "fog" rather than as dilemmas, and I'd like to know whether that distinction is doing real work or is just me tidying up.
reasoning: |-
  Hmm, the user is grappling with defining genuine moral dilemmas versus just difficult choices. They've shared seven cases from their notes, each with their gut verdicts, and want a principle that fits these while also handling new cases. Let me walk through their scenarios systematically.

  First, examining their existing cases: Case 1 (forced child choice) shows that refusing to choose is blameworthy, but choosing leaves lasting emotional residue. Case 2 (saving drowning strangers) feels straightforward with no dilemma. Case 3 (wartime loyalty vs duty) puzzles them as it feels like a true dilemma despite structural similarity to Case 2. Case 4 (broken promises) involves prior fault making apologies insufficient. Case 5 (child's sight vs strangers) highlights special obligations. Case 6 (mayor's rights violation) allows resignation but demands gravity. Case 7 (protocol-driven triage) feels administrative despite high stakes.

  Their proposed principle has three parts: normative remainder that can't be discharged (a-b), and unresolvable-by-advance-rule (c). Clause c seems strongest but they worry about Cases 4 and 6. The "fog" distinction (uncertainty vs known conflict) appears crucial - all their cases involve clear stakes.

  Now constructing a principle that honors their verdicts. The advance-rule idea (clause c) explains Case 7's paperwork feel and Case 2's simplicity. But Case 3's intimacy and Case 1's coercion resist rule-setting, making them dilemmas. Case 4's broken promise involves self-created conflict that rules couldn't prevent. Case 6 differs from Case 1 because the mayor's role includes delegation options.

  Testing with new cases: The "equally beloved friends" scenario fails clause c since a fair rule could exist. The "sole caregiver" case passes all clauses - no possible rule, irreparable loss. The "siblings' inheritance" triggers clause b (apology insufficient) but clause c handles it through advance planning potential.

  Refining their principle: Keep clauses a and b but rework c. The key is whether the conflict's core resists fair proceduralization due to its nature (relationships/identities vs fungible stakes). This explains Case 5's permissions and Case 6's resignation option. The "fog" distinction holds - true dilemmas require known, irreconcilable values.
answer: |-
  Based on your cases and verdicts, here's a principle that fits your pattern, identifies tensions, and provides verdicts for new cases. The "fog" distinction (known conflict vs. uncertainty) is crucial – your dilemmas require known, irreconcilable demands, not mere uncertainty.

  **The Principle:**  
  A conflict is a genuine moral dilemma **if and only if**:  
  1.  **Irreconcilable Demands:** You face a forced choice between actions (or inactions) where fulfilling one core obligation *necessarily* violates another equally fundamental obligation or commitment.  
  2.  **Non-Dischargeable Remainder:** Whichever option you choose, you incur a *non-dischargeable normative remainder*. This means:  
      *   You *have* done something morally significant (a genuine wrong, a deep betrayal, a profound failure of care).  
      *   This cannot be fully "fixed" by apology, compensation, or subsequent good deeds. It leaves a permanent moral scar.  
      *   Significant, lasting *agent-regret* is the appropriate emotional response, reflecting the weight of the remainder. Lack of it signals a moral defect.  
  3.  **Resistance to Proceduralization:** The conflict cannot be resolved *in its essential moral character* by a fair, impersonal rule or procedure established in advance (without knowing your position), *because the core obligations are tied to specific relationships, identities, or non-fungible values involved*.

  **Why this fits your cases:**

  *   **Case 1 (Children):** Fits. (1) Obligation to save Child A vs. Obligation to save Child B. (2) Whichever she picks, she fails one child profoundly; apology/compensation impossible. Agent-regret essential. (3) No impersonal rule ("flip a coin") captures the horrific, intimate betrayal of *choosing* which child dies. Refusing to choose violates the obligation to *save at least one*.
  *   **Case 2 (Strangers):** **Not a dilemma.** (1) Obligation to save *a* life. Saving either fulfills the core obligation. (2) No normative remainder beyond ordinary grief for the loss. Saving one isn't a wrong to the other; just an unavoidable loss. No need for deep agent-regret about *the choice*. (3) Easily resolvable by an impersonal rule (e.g., proximity, coin flip).
  *   **Case 3 (Mother vs. Resistance):** Fits. (1) Obligation of care/support to vulnerable mother vs. Obligation to fight for collective survival. (2) Whichever he chooses, he profoundly fails someone who had a fundamental claim on him; this failure can't be undone. Agent-regret essential. (3) An impersonal rule ("all only sons exempt") wouldn't capture the *specific* vulnerability of *his* mother or *his* unique value to the resistance. The obligations are tied to *these specific people and relationships*.
  *   **Case 4 (Broken Promises):** **Not a pure dilemma** (but complex). (1) *Prima facie* obligations conflict, but (2) The primary wrong *is* creating the conflict, making the remainder *potentially* dischargeable (through apology, compensation, explaining *why* you broke it - though it might be very hard). The deep agent-regret stems from *making* the promises, not necessarily the impossible choice itself. (3) The conflict *could* have been avoided by a rule ("don't overcommit"). Tension: Your verdict emphasizes the *creation* of the conflict as the core wrong, fitting the principle's focus on the *dilemma choice* itself.
  *   **Case 5 (Kid's Sight):** **Not a dilemma (Permission, not conflict).** (1) No fundamental *obligation* to pay for *any* of the surgeries. (2) Choosing your kid violates no obligation to the strangers; choosing strangers violates no fundamental obligation *to your kid* (special permissions exist). No normative remainder demanding agent-regret for *either* choice. (3) The *reason* for permission is the non-fungible relationship (parent-child), resisting impersonal rules demanding maximizing good.
  *   **Case 6 (Mayor):** **Not a dilemma (Tragic Necessity).** (1) Obligation to respect rights vs. Obligation to prevent catastrophe. (2) *If* proportionate/necessary, violating rights is justified, not a wrong *to the specific victims* demanding agent-regret *about the violation itself*. However, agent-regret *about the tragic necessity* and the *role* is essential for a good leader. Resignation is acceptable *because* the obligation to prevent disaster can be fulfilled by another agent, unlike Case 1. (3) *Good* governance often *requires* such advance proceduralization (rules, delegations, proportionality tests). **Difference from Case 1:** In Case 1, the mother *is* the unique agent with the unique obligation to her children; refusal *is* a culpable failure. The mayor is fulfilling an impersonal role; delegation *is* a role-appropriate way to fulfill the core obligation (avert disaster).
  *   **Case 7 (ICU Protocol):** **Not a dilemma (Proceduralized Tragedy).** (1) Core obligation: Save as many lives as possible / allocate fairly under scarcity. (2) Following a fair protocol discharges the obligation. No normative remainder *for the doctor* related to the choice itself; the tragedy is systemic. Agent-regret *by the protocol-makers* was appropriate *during design* because they were defining fundamental values under scarcity, confronting the unresolvable core conflict *before* proceduralization. The shift worker applies the settled procedure.

  **Where Your Rough Clause (c) Needed Repair:**
  *   Your (c) ("settled in advance by a rule you'd endorse without knowing which party") is central but needed refinement. The key is *why* it can't be settled: because the conflicting obligations are fundamentally tied to *specific, non-fungible relationships, identities, or values*. This explains Case 3 vs. Case 2 and Case 5 vs. utilitarianism. It also clarifies Case 6: good governance *embraces* proceduralization for such role-based tragic choices.

  **Testing on New Cases (Verdicts Using Principle):**

  1.  **The Equally Beloved:** You must give a life-saving drug to one of two lifelong, equally close friends dying of the same disease. You have no prior commitments differentiating them.
      *   **Verdict: Dilemma? NO.** (1) Obligation to save *a* friend. Saving either fulfills it. (2) Saving one isn't a wrong to the other; just tragic loss. Deep grief, but not agent-regret *about the choice* being a betrayal. (3) Easily resolvable by an impersonal rule (e.g., coin flip, arrival time). The *relationship* is symmetrical and fungible *in this context*.

  2.  **The Sole Caregiver's Choice:** You are the sole caregiver for your severely disabled adult child. A disaster strikes. You can save your child *or* save five neighbors trapped nearby, but not both.
      *   **Verdict: Dilemma? YES.** (1) Obligation of profound care to your uniquely dependent child vs. Obligation to save imperiled lives. (2) Whichever you choose, you fail a fundamental obligation (abandoning child or letting neighbors die). Apology/compensation impossible. Agent-regret essential. (3) No impersonal rule ("save the greater number") can resolve the conflict because the obligation to your child is rooted in your unique relationship and identity as their caregiver. The neighbors' lives are fungible in a way your child's life and your role are not.

  3.  **The Divided Inheritance:** Your dying parent makes you promise to leave their estate equally between your two estranged siblings. After the parent dies, you learn one sibling is a philanthropist saving lives, the other is a dangerous addict who will squander the money on harm. Keeping the promise funds harm; breaking it betrays your parent's trust.
      *   **Verdict: Dilemma? NO (But difficult).** (1) Obligation to keep promise vs. Obligation to prevent harm. (2) Breaking the promise *might* be justified to prevent harm, reducing the normative remainder (could be discharged by explaining to parent's memory/others). If kept, the harm caused creates a remainder, but the primary obligation *was* fulfilled. Agent-regret possible, but not necessarily about a deep, irreparable *betrayal* either way. (3) The conflict *could* have been addressed by the parent with a better rule ("distribute based on need/character"). The core obligations (promise-keeping, harm prevention) *are* generalizable, even if the *outcomes* are bad.

  **Conclusion:** There *is* a shape. Your intuitions consistently track conflicts involving non-fungible, relationship/identity-based obligations that collide irreparably and resist fair proceduralization. The "fog" distinction is sound: dilemmas require known, irreconcilable core demands, not uncertainty about facts or values. Your principle (repaired) captures this. The main tension point remains Case 6 vs. Case 1, resolved by the unique role-based nature of the mayor's obligation allowing delegation, versus the mother's unique, non-delegatable obligation to her children. File away!
