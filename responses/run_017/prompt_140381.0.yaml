  I need to design a question that incorporates both cases and requires resolving the inherent tension. The multiplex case challenges whether ten interleaved streams constitute ten moral patients or one mind with multiple threads. The cheap-implementation case questions what makes a computation "real" enough to matter morally. A strong answer must address the selection problem - what privileges one computational description over others - and avoid inconsistent handling of the two scenarios.

  For the model answer, I'll adopt the voice of a strong candidate who argues that moral status depends on causally integrated computational processes that form unified perspectives. This perspective would grant ten streams in the multiplex case full moral standing since each maintains causal continuity as a distinct agent, while rejecting the idea that arbitrary interpretations of a rock's state constitute morally relevant computations. The key move is grounding "implementation" in causal structure rather than observer interests.

  The marking scheme should reward: 1) Clear articulation of both cases and the tension between them; 2) Recognition that computationalism alone doesn't resolve the selection problem; 3) Distinguishing between observer-relative and observer-independent implementations; 4) Applying consistent criteria to both cases; and 5) Explicitly biting a bullet (like accepting conventionalism or rejecting duplicate moral multiplication). Top marks require synthesizing these points rather than just listing them.

  The question preamble will present both cases neutrally. The model answer will demonstrate how to maintain that a rock doesn't implement morally relevant computations despite formal possibilities, while still counting each multiplexed stream separately. The marking scheme will be granular enough for the teacher to apply objectively. Finally, the summary line will highlight that the key differentiator is identifying what makes computations "real" beyond formal descriptions.
answer: |-
  Here is the complete assessment package addressing your specified constraints and philosophical concerns:

  **Question Paper**  
  *Philosophy of Mind & Ethics | Timed Essay (90 mins)*  
  **Question:** "The multiplex scenario demonstrates that computational organization suffices for multiple minds, while the cheap-implementation scenario shows that not all computations matter morally. Resolve this tension by explaining what *determines* which computations are morally relevant. In your answer:  
  (a) Define both scenarios using the examples below.  
  (b) Explain why merely pointing to 'the computation being run' is insufficient.  
  (c) Argue for a criterion that consistently attributes moral status across *both* cases.  

  *Scenarios:*  
  1.  **Multiplex:** A single processor runs ten identical agent-simulations via time-slicing. Each simulation receives input sequences and produces outputs indistinguishable from a dedicated processor. Internally, each maintains a causally isolated stream of states (e.g., memory registers, program counters) matching a standalone agent.  
  2.  **Cheap-Implementation:** A mundane physical system (e.g., a rolling rock) can be formally described as implementing countless abstract computations (e.g., 'calculating' its own trajectory, 'simulating' a game of chess, or instantiating a duplicate of one multiplexed agent). Observers can map its physical states to these computations, but this requires arbitrary choices."  

  ---

  **Model Answer (798 words):**  

  The tension between the multiplex and cheap-implementation scenarios arises because both rely on computational descriptions, yet yield opposing intuitions about moral relevance. The multiplex case suggests ten distinct moral patients exist on one processor, while the cheap-implementation case implies we must deny moral status to rocks arbitrarily described as running complex computations. Resolving this requires identifying what makes a computation *realized* rather than merely *describable*. I argue that moral status depends on *causally integrated computational processes that sustain unified subjective perspectives*, where 'integration' means internal states dynamically regulate the system's responses to maintain coherent agency over time.  

  In the multiplex scenario, each simulation is a morally relevant computation. Crucially, each stream maintains *causal continuity and isolation*: its internal states (like memory registers) evolve based *only* on its own prior states and dedicated inputs, directly governing its own outputs. This creates ten separate loops of perception, cognition, and action. While physically interleaved, the causal architecture ensures no information or control bleeds between streams. Each is a distinct locus of self-sustaining, adaptive processing – the hallmark of a perspective deserving moral consideration. Counting them separately isn't generosity; it reflects their ontological separateness as agents.  

  The cheap-implementation scenario fails precisely because it lacks this causal integration. A rock’s motion can be *mapped* to abstract computations like chess or agent-simulation, but this mapping is observer-imposed. The rock’s physical states don’t *functionally regulate* its behavior according to computational rules. Its trajectory is governed by gravity and friction alone; the supposed 'computation' plays no causal role. There is no internal mechanism where state transitions depend on *representing* chess moves or agent beliefs. The description is parasitic on physics, not constitutive of an independent causal process.  

  This reveals the flaw in saying "organization matters, not substrate." True, but *which* organization? Not every formal pattern instantiated matters – only those functioning as *autonomous control systems*. Morally relevant computations must be *causally explanatory*: their structure must non-trivially account for the system's adaptive complexity and unity. In the multiplex, each stream’s computational states explain its specific, context-sensitive behaviours (e.g., answering questions coherently). For the rock, computational descriptions are redundant; mechanics suffice.  

  This criterion resolves the tension:  
  -   **Multiplex = 10 Patients:** Each stream is a causally integrated control system. Duplication doesn’t diminish individual integrity; identical agents are still distinct loci of experience and interest-satisfaction. Physical sharing is irrelevant if causal isolation holds.  
  -   **Cheap-Implementation = 0 Patients:** No computation is causally active. The rock’s state transitions aren’t driven by computational rules defining goals, beliefs, or learning. Observer-relative mappings don’t create real agency.  

  One bullet must be bitten: moral status *is* partly conventional in the *epistemic* sense. We identify "the" computation by finding the causally explanatory model. If two models are equally explanatory (e.g., a low-level neural vs. high-level cognitive description of a brain), both refer to the *same* morally relevant entity. But where no such model exists (the rock), imposition is fiction. The multiplex's time-sliced streams, however, each possess unique explanatory models for their distinct behavioural streams.  

  Denying that duplicates multiply moral patients (saying only "one unit of concern" exists for identical streams) is untenable. Each stream would still experience its own joys/suffering independently. Fission cases show numerical identity isn’t essential; what matters is the existence of separate streams of consciousness. If consciousness arises from integrated computation, ten integrated streams imply ten subjects.  

  Thus, computations matter morally only when they constitute *causally effective, unified perspectives*. The multiplex satisfies this per stream; cheap-implementation does not. Physical implementation matters only insofar as it enables this causal autonomy.  

  ---

  **Marking Scheme (20 marks total):**  

  1.  **Accurate Case Description (4 marks):**  
      *   *Awarded for:* Clearly defining multiplex (shared hardware, isolated causal streams) AND cheap-implementation (arbitrary mappings on non-agential systems).  
      *   *Common Error:* Conflating multiplex with simple parallelism or misrepresenting cheap-implementation as implying rocks *actually* think.  

  2.  **Problem Identification (4 marks):**  
      *   *Awarded for:* Explaining the tension - multiplex pushes towards liberal counting based on organization, cheap-implementation pushes towards restrictive counting to avoid absurdity, AND noting the core problem: selecting the "privileged" computational description.  
      *   *Common Error:* Simply restating the cases without articulating why they create conflicting pressures for attributing moral status.  

  3.  **Criterion for Implementation (4 marks):**  
      *   *Awarded for:* Proposing a criterion distinguishing "real" from "merely described" computations (e.g., causal integration, causal explanatory power, autonomous control, sustaining a unified perspective). Must go beyond "it has the right organization."  
      *   *Common Error:* Asserting organization suffices without addressing *how* we pick one organization over another in cheap-implementation.  

  4.  **Consistent Application (4 marks):**  
      *   *Awarded for:* Applying the proposed criterion clearly to BOTH cases, justifying separate status for multiplex streams AND denying status to cheap-implementation. Must explicitly resolve the tension.  
      *   *Common Error:* Applying criterion inconsistently (e.g., using causal integration for multiplex but falling back on substrate/physical separation for cheap-implementation).  

  5.  **Acknowledging & Addressing Implications (4 marks):**  
      *   *Awarded for:* Explicitly recognizing and engaging with a significant implication/bullet bite (e.g., accepting some epistemic conventionalism, defending duplication multiplication, rejecting causal overdetermination in multiplex).  
      *   *Common Error:* Ignoring or glossing over the hard consequences of their position (e.g., not addressing why duplicates count as ten or what blocks rock-minds).  

  **Distinguishing Performance:**  
  *   **Bare Pass (10-11/20):** Describes cases and states a position, but may not fully articulate the tension or resolve it consistently. Criterion may be vague or inconsistently applied. Little engagement with bullets.  
  *   **First-Class (16+/20):** Clearly diagnoses the core selection problem. Offers a precise, non-circular criterion grounded in causality/functionality. Applies it rigorously and consistently to *both* cases, demonstrating resolution of the tension. Explicitly acknowledges and defends against a major counterintuitive implication (bullet bite).  

  \answer{Identifying what makes computations causally real, not just describable.}
