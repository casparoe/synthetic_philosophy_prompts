prompt: |-
  Hi — I need a hand drafting something. I'm one of five people on our town's Public Safety Building Committee (pop. around 9,000, central Mass.). We owe the Select Board a recommendation before their meeting a week from Thursday, the committee is badly split, and I've ended up being the one who has to write it, so I need something in their inbox by Monday.

  Short version of the mess: for three years we've been trying to buy a 0.9-acre parcel on Route 9 for a new fire station. There's a state matching grant that covers half the acquisition cost, up to $500,000, but it has to be drawn down by Sept 30 or it goes back to the state and gets handed to other towns, and it can only be used to buy land — not to fix up land we already own. Town Meeting authorized "up to $900,000" for the purchase last year, and of course that number is printed in the warrant, so basically everyone knows our ceiling. The parcel appraised at $610,000 about fourteen months ago.

  We're in a highest-and-best-offer process run by a broker. We're at $740k. A regional pharmacy chain is at $760k. The broker — who only collects his 6% if we actually close — keeps saying they'll fold at $800k and that one more bump ends it. Our own spent money so far is roughly $180k in design and engineering that's maybe 20% reusable on a different site, $40k in legal, permitting and option fees, plus a pile of staff and volunteer hours. All of it is gone either way.

  Plan B is a 1.4-acre lot the town already owns behind the highway garage. Nobody loves it — ledge, some wetlands, call it $250–300k in site work, and the grant can't be used on it — but it would work.

  One of the other members' wife teaches econ and told him this whole thing is the "dollar auction" from some game theory class, the one where a dollar ends up selling for several dollars because the second-highest bidder has to pay too. Even if she's only half right, it's made me notice that most of our reasoning is some version of "we've already spent too much to stop now," which doesn't feel like a reason at all. Two other wrinkles: I don't trust the broker's $800k prediction, and I've started wondering whether the chain actually wants the parcel or just wants to buy it and flip it to us once they figure out we're cornered.

  What I want from you:

  Draft the memo I'll send the Board. It should (1) recommend one concrete course of action with real numbers and a real deadline — a hard cap, a date, and a process — rather than "the committee should carefully weigh its options"; (2) recommend something we do in advance so that if we lose, losing still buys us something. My own idea is that we pre-commit, right now, to funding Plan B on the same timeline, so we're not choosing between a station and nothing. Tell me if that's a bad idea and why. (3) say honestly whether making our cap public and irrevocable actually helps or just guarantees we get outbid, given that our current ceiling being public is part of the problem; and (4) give the strongest version of the case for hanging in there, because two of my collegues are going to make it and I'd rather it show up in my memo than get sprung on me at the meeting.

  Please write it as a memo I can paste straight into an email — headed, a couple of pages at most, plain American English, no footnotes, no sources, and no explaining the theory back at me. And don't be shy about giving me a number I won't like.
reasoning: |-
  Okay, the user is on a Public Safety Building Committee in a small town and needs help drafting a memo to the Select Board. They're in a tough spot with a land purchase for a new fire station. Let me unpack this.

  First, the situation: They've been trying to buy a parcel on Route 9 for three years. There's a state matching grant that covers half the acquisition cost up to $500k, but it expires September 30. The town approved up to $900k, but the appraisal was $610k fourteen months ago. Now they're in a bidding war with a pharmacy chain - they're at $740k, the chain at $760k. The broker says bumping to $800k will win it, but the user doesn't trust that.

  Other factors: They've sunk $220k in non-recoverable costs (design, legal, etc.). Plan B is a town-owned lot that would need $250-300k in site work but can't use the grant. A committee member's economist wife compared this to the "dollar auction" game theory problem where bidders escalate beyond value due to sunk costs - which resonates with the user.

  The user needs a memo that:
  1. Recommends concrete action with numbers/deadline
  2. Suggests something proactive for if they lose
  3. Honestly addresses whether making their cap public helps
  4. Presents the strongest case for continuing (since colleagues will argue it)

  Key insights:
  - This really is a classic dollar auction scenario
  - Sunk costs shouldn't dictate future decisions
  - The pharmacy chain might be bluffing or planning to flip the land
  - The grant deadline creates urgency

  My approach:
  Recommend walking away now with a clear exit strategy. Set $800k as absolute max with no further bids. Simultaneously commit to Plan B. This shows decisive action while preserving options. Making the cap public could backfire by inviting higher bids. For the "continue" argument, focus narrowly on the grant benefit and lost time - but show why it's outweighed by costs.

  The memo should be practical: direct language, no theory lessons, ready-to-send format. User clearly values efficiency - they need this by Monday for a Thursday meeting. Tone should be authoritative but not presumptuous; they're the expert on local dynamics after all.

  Biggest risk is the grant expiration - but forcing Plan B now might be better than overpaying. Pharmacy chain behavior is the wildcard; calling their bluff could save money or lose the parcel. Either way, removing ambiguity helps the town.
answer: |-
  **MEMORANDUM**  
  **TO:** Select Board, Town of [Your Town Name]  
  **FROM:** [Your Name], Public Safety Building Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Route 9 Parcel Acquisition & Contingency Plan  

  ---

  ### **1. RECOMMENDED ACTION**  
  **Offer a final bid of $800,000 for the Route 9 parcel, with a hard expiration of [Date 3 Business Days Before Select Board Meeting] at 5:00 PM.**  
  - **Rationale:** This is the maximum defensible price based on appraisal ($610K), grant value ($500K match), and sunk costs. If rejected, we walk away immediately.  
  - **Deadline:** Ensures we preserve time to pivot to Plan B before the grant expires (September 30).  
  - **Broker Instructions:** Submit the offer as "best and final," non-negotiable, and revocable if countered.  

  ---

  ### **2. CONTINGENCY PLAN: COMMIT TO PLAN B NOW**  
  **Simultaneously authorize $300,000 in ARPA or stabilization funds for site work on the town-owned lot (Highway Garage site), with design starting October 1 if Route 9 fails.**  
  - **Why this works:**  
    - **Leverages sunk costs:** The 20% reusable design work applies here.  
    - **Meets the grant deadline:** We use the state funds for Route 9 *or* reallocate saved town funds to Plan B.  
    - **Signals resolve:** Shows voters we’re building a station regardless, mitigating "loss fatigue."  
  - **Risk:** Plan B’s total cost (~$1.2M after site work) exceeds Route 9 ($1.5M after grant), but avoids auction insanity.  

  ---

  ### **3. SHOULD WE PUBLICIZE OUR $800K CAP?**  
  **No. Disclosing it guarantees failure.**  
  - The pharmacy chain likely knows our $900K ceiling (via Town Meeting records). Announcing $800K tells them to bid $801K.  
  - **Better approach:** Keep the cap internal. If pressed, state: "We’ve reached our fiscal limit based on independent appraisal."  

  ---

  ### **4. THE CASE FOR BIDDING $800K (STRONGEST ARGUMENT)**  
  > *"While $800K exceeds appraisal, it secures a turnkey site with no wetlands or ledge issues, preserves $500K in state funds, and leverages 3 years of permitting/design work. Walking away now wastes $220K in sunk costs and risks total grant forfeiture. At $800K, our net cost ($1.5M post-grant) is still below Plan B’s likely $1.5–1.7M (after $300K site work + $1.2M construction). The broker’s $800K prediction may be optimistic, but this ends the auction on our terms."*  

  ---

  ### **SUMMARY & NEXT STEPS**  
  | **Path**                | **Total Town Cost** | **Timeline**       | **Grant Use** |  
  |--------------------------|---------------------|--------------------|---------------|  
  | Route 9 at $800K         | $1.5M (post-grant) | Groundbreaking 2024 | Yes ($500K)   |  
  | Plan B (Highway Garage)  | ~$1.5–1.7M         | Delayed 6–12 months | No            |  

  **Recommendation:**  
  - **Approve $800K final offer** with the 5:00 PM deadline on [Date].  
  - **Pre-commit $300K to Plan B site work** to be allocated if Route 9 fails.  
  - **Do not re-enter bidding** if outbid.  

  This stops the bleeding, respects taxpayer funds, and delivers a fire station by 2025.  

  // Respectfully submitted,  
  [Your Name]  
  [Your Contact Info]  

  ---

  ### **WHY THIS WORKS**  
  1. **Forces closure** with a hard deadline and cap.  
  2. **Reframes Plan B as progress**, not failure.  
  3. **Uses economic reality:** $800K is painful but *justifiable* via grant math; beyond that, Plan B is cheaper long-term.  
  4. **Ignores sunk costs** as a primary driver (per your request).  
  5. **Preempts counterarguments** by acknowledging the "continue bidding" view in Section 4.  

  **Tough truth:** The broker’s $800K "guarantee" is unreliable. If the pharmacy bids higher, walking away is still fiscal discipline—not defeat.
