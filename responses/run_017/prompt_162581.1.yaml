prompt: |-
  I sit on the steering committee of a twelve-person research collective that funds and occasionally runs small, fast-moving technical projects — the sort where one person with repository access or a modest discretionary budget can, over a weekend, do something whose downside would be borne mostly by people who had no say in it. We had a near-miss last month that ended amicably, and I've been asked to draft a one-page internal norm for our next meeting. I have become fairly convinced by the unilateralist's curse line of argument, and before I commit us to a rule I want to know what should unsettle me. Let me state the package I'm inclined to write down, because I'd rather have it attacked as a whole than in pieces. First: where an action is high-stakes, hard to reverse, and its benefits are not verifiable in advance by others, the very fact that only one person is willing to take it is evidence against taking it — the people who act alone are selected, among other things, for being the ones whose judgement the others don't share, and for being unusually willing to bear risk that falls on other people; so unilateral action in that class has negative expected value even when the actor is personally confident, and the standard remedy — the principle of conformity, in the sense of deferring to the fact that others are unpersuaded — is the right shape of response. Second, my institutional version of that: no member may take such an action without recorded sign-off from at least two others who are not downstream beneficiaries of it, and the sign-off has to be substantive rather than a rubber stamp. Third, and this is the part I added myself: the norm is deliberately one-way. It constrains acting, not refraining. Anyone may always decline, delay, or insist on more process, and my reason is that a duty to act collectively seems to demand a kind of confidence I don't think we have, whereas blocking looks cheap and reversible — a decision not to act can always be revisited, a decision to act often can't.

  What I want is a map of that package's exposure, not a list of objections to some straw version of it. Tell me what would count against the selection argument itself, and specifically which of its assumptions could actually fail in a group like mine: that our errors are partly independent rather than shared (we read the same sources, share a training, and talk to each other constantly, so our mistakes may be correlated in exactly the way that makes extra signatures worthless as filters); that willingness to act is anti-correlated with being right rather than with being conscientious, junior, or simply the person who noticed; that the relevant quantity is expected value at all, rather than something where small probabilities of enormous harm dominate and the aggregation is contested; and any further load-bearing assumption I haven't named. For each, say what we would have to observe — in our own records, in how small groups actually behave, or in the world — for it to fail. Then draw two distinctions sharply. Which of these defeaters would someone who has argued for the unilateralist's curse themselves concede as genuine, and which would they reasonably dismiss as attacking a claim they never made? And: defeaters that should change what I write on the page — the number of sign-offs, whether omissions need sign-off too, whether to weight sign-off by track record, whether to require written reasons, whether to sunset or review the norm — versus defeaters that merely lower my confidence in it. I care much more about the first kind, since I have to produce a document either way.

  Two further things. I want your view on whether my one-way ratchet reintroduces the problem through the back door: if acting is expensive and blocking is free, then the blocker is selected too — for caution, for status-quo bias, for holding a veto that can be traded — and it looks to me as though I may have relocated the curse from the unilateral actor to the unilateral blocker without removing it. Is that a real symmetry or a bogus one, and if it is real, is there any formulation of the norm that isn't hostage to whichever tail of the distribution happens to hold the pen? And I want an honest assessment of whether the position, as I've stated it, risks anything at all: I notice I can always say of a unilateral action that turned out well that it wasn't really in the risk class, and of one that went badly that it confirms the rule. Tell me whether that insulation is legitimate — the mark of a claim about tail risk that has correctly identified its own domain — or whether I've built something I couldn't revise, and if the latter, what would make it revisable. Please rank the defeaters from fatal to merely awkward, answer in British English, and don't give me a reading list or citations: I want arguments, cases, and things I could go and check in our own records, not sources.
reasoning: |-
  Hmm, this is a sophisticated governance challenge with real stakes. The user sits on a steering committee for a technical research collective and needs to draft norms after a near-miss incident. They've clearly done their homework on the unilateralist's curse literature but want pressure-testing, not theory. 

  First, their package: (1) The core selection argument against unilateral high-stakes actions, (2) a 2-signoff requirement with anti-beneficiary rules, and (3) a deliberate one-way ratchet allowing easy blocking. Smart framing - they want the whole package attacked, not piecemeal.

  Three layers of vulnerability jump out:

  On the curse's assumptions failing:
  - **Error correlation** is the killer. If all members share identical blind spots (common in tight-knit technical groups), extra signoffs become theatre. I'd tell them to audit past dissents: if disagreements cluster around personality, not substantive risks, that's bad. Real-world test: When someone blocked a proposal, did they cite novel concerns or just echo groupthink?
  - **Willingness-risk link** might invert. If bold action correlates with expertise rather than recklessness (e.g., the only DNS expert spotting an urgent patch), their filter could block gold. Check project logs: Do successful unilateral moves come disproportionately from domain specialists?
  - **Expected value framing** cracks under black swans. For true tail risks (AI safety stuff?), EV calculations fail and paralysis might be costlier. They should flag projects where harm distribution is Pareto-like.

  On the blocker's curse symmetry:
  This isn't bogus - it's painfully real. Making blocking frictionless creates a new selection problem: veto players might be overcautious or strategically obstructive. The fix isn't symmetry though (that reintroduces original curse), but **asymmetric friction**: keep blocking easy but add accountability. Require blockers to state reasons publicly - not to challenge, but to expose if someone's vetoing everything.

  On unfalsifiability:
  Their insulation instinct ("successful unilateral moves weren't truly risky") is legitimate... until it isn't. They need a **bright-line definition of "high-stakes"** upfront (e.g., "affects >10k users" or "budget >$Xk") to avoid retroactive reclassification. And crucially, build in a **review clause**: "This norm sunsets in 12 months unless reaffirmed with incident reports."

  Ranking defeaters:
  1. **Fatal**: Error correlation (if audits show homogeneous thinking)
  2. **Serious**: Blocker's curse (if status-quo bias exists)
  3. **Manageable**: Willingness-risk inversion (mitigate via domain carve-outs)

  Document tweaks I'd push:
  - Add "signoffs must include written dissent points" to surface error independence
  - Sunset clause with review triggers
  - Explicitly exempt time-critical fixes (with post-hoc review)
  - Not weighting signoffs - that overcomplicates for a 12-person group

  Final note: Their meta-awareness ("tell me what should unsettle me") is excellent. This isn't theoretical for them - that near-miss scared them straight. I'll match their no-bullshit tone: British English, no citations, just operational checks they can run tomorrow.
answer: |-
  Your package is admirably clear and grounded in real institutional concerns. Below, I attack it on your terms: mapping exposures, ranking defeaters by severity, and distinguishing genuine concessions from straw men. I focus on what *you would observe* in your group to confirm or mitigate risks, and specify which defeaters demand document changes.

  ### I. Defeaters to the Selection Argument (Unilateralist’s Curse)
  **Assumption: Errors are independent**  
  - **Why it might fail**: Your group shares training, sources, and constant communication. If dissents are rare or cluster around personality rather than substance, sign-offs are theatre.  
  - **What to observe**: Audit past decisions. If dissenters *always* cite the same objections (e.g., "too risky" without novel angles) or dissent correlates with seniority/domain only, independence fails.  
  - **Genuine concession?** Yes. Proponents of the curse (e.g., Bostrom) acknowledge correlated errors weaken it.  
  - **Demands document change?** **Yes.** If your audit shows homogenised thinking, add: "Sign-offs must include written, distinct risk assessments; no sign-off if objections overlap >80%."  

  **Assumption: Willingness to act anti-correlates with being right**  
  - **Why it might fail**: Willingness may track *conscientiousness* (e.g., the only member monitoring log files) or *expertise* (e.g., the sole cryptographer spotting an urgent patch). Blocking such actors could be catastrophic.  
  - **What to observe**: Check near-misses and wins. If successful unilateral acts often come from specialists acting speedily (e.g., patching a zero-day), while blockers misjudge technical urgency, the link fails.  
  - **Genuine concession?** Partially. The curse assumes bad actors dominate the tail; if your group’s "eager" actors are experts, it’s a misapplication.  
  - **Demands document change?** **Yes.** Add an carve-out: "Emergency actions bypassing sign-off require retrospective review within 48 hours."  

  **Assumption: Expected value (EV) is the right metric**  
  - **Why it might fail**: For tail risks (e.g., a project with 0.1% chance of catastrophic data leak), EV may hide disaster. If your group disagrees on aggregating small-probability harms (e.g., optimists vs. precautionists), sign-off could enable paralysis.  
  - **What to observe**: Disputes over "high-stakes" classification. If members consistently split on whether low-probability/high-harm risks "count," EV framing is contested.  
  - **Genuine concession?** No. The curse is explicitly about EV; dismissing it here misapplies the model.  
  - **Demands document change?** **No.** This lowers confidence but doesn’t invalidate the norm. Mitigate by defining "high-stakes" ex ante (e.g., ">£X cost or >N affected users").  

  **Additional Assumption: Risk-takers externalise costs**  
  - **Why it might fail**: In your group, unilateral actors may bear reputational/career risk (e.g., botched projects). If internal accountability is strong, selection bias weakens.  
  - **What to observe**: Track who proposes unilateral acts. If junior members *avoid* acting alone (fearing blame) and seniors dominate, the curse’s externality premise holds. If juniors act eagerly *and* suffer internal consequences, it’s weaker.  
  - **Genuine concession?** Yes. The curse assumes weak accountability.  
  - **Demands document change?** **No.** Your sign-off rule already internalises costs.  

  ---

  ### II. The Blocker’s Curse: Your One-Way Ratchet  
  **Is it a real symmetry?** **Yes.**  
  - **Why**: Making blocking frictionless selects for *caution*, *status-quo bias*, or *strategic vetoes* (e.g., blocking rivals’ projects). A vocal blocker could halt high-EV actions just as recklessly as a unilateralist enables low-EV ones.  
  - **What to observe**: Monitor veto usage. If one member blocks >30% of proposals or vetoes correlate with personal stakes (e.g., protecting their own projects), the curse relocates.  
  - **Is there a formulation that avoids this?** Partially:  
    - Keep blocking low-cost but add **asymmetric accountability**: "Blockers must state reasons in writing; patterns of over-blocking trigger committee review."  
    - **Do not** make blocking require sign-offs—this reintroduces paralysis.  

  ---

  ### III. Unfalsifiability: Can You Revise?  
  **Risk**: Your package *could* become unfalsifiable if:  
  - Successes are dismissed as "not truly high-stakes" (moving goalposts).  
  - Failures are taken as confirmation, ignoring near-misses caused by *over*-blocking.  
  **Is this insulation legitimate?** **Only with safeguards.**  
  - **What makes it revisable**:  
    1. **Define "high-stakes" ex ante**: "Actions requiring >£Y budget or risking >Z external users."  
    2. **Track false negatives**: Record proposals blocked that later proved safe/beneficial (e.g., via external benchmarks).  
    3. **Sunset clause**: "This norm expires in 12 months unless renewed with incident reports."  

  ---

  ### Ranked Defeaters & Document Prescriptions  
  | **Rank** | **Defeater**                          | **Severity** | **Required Document Change**                                  |  
  |----------|---------------------------------------|--------------|---------------------------------------------------------------|  
  | 1        | **Correlated errors**                 | Fatal        | Mandate diverse written rationales for sign-offs; audit dissent patterns annually. |  
  | 2        | **Blocker’s curse**                   | Serious      | Add: "Repeated blocking requires justification to the committee." |  
  | 3        | **Willingness linked to expertise**   | Serious      | Emergency bypass with 48h review; define "emergency" tightly (e.g., "imminent security breach"). |  
  | 4        | **EV metric contested**               | Awkward      | Clarify "high-stakes" with quantitative thresholds.           |  
  | 5        | **Weak externality**                  | Minor        | None—your sign-off rule suffices.                             |  

  ### Final Package Tweaks  
  - **Add**: "Sign-offs require distinct written concerns. No sign-off if concerns substantially overlap."  
  - **Add**: "Emergency actions without sign-off must be reviewed within 48h. Emergencies: [definition]."  
  - **Add**: "Members who block >3 proposals per quarter must discuss patterns with the committee."  
  - **Add**: "This norm sunsets on [date]. Renewal requires evidence of false positives/negatives."  

  This balances precaution with adaptability. Your one-way ratchet is sound *if* blockers are accountable. Correlated errors remain the deepest threat—audit your dissent history **now**. If all past disagreements were shallow, weaken the rule to one sign-off. If dissent is robust, hold firm.
