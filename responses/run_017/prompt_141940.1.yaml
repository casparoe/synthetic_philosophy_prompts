prompt: |-
  I'm building the epistemic machinery for a simulation of a small team of software auditors who have to decide which of a very large set of claims about a codebase to check before signing off, and I keep hitting the same wall. The standard possible-worlds treatment of belief — the one on which an agent's beliefs are the propositions holding throughout every world compatible with what the agent takes to be the case — makes each auditor believe every logical consequence of what they believe, including consequences that would take longer than the age of the universe to derive, and makes them indifferent between formulations that differ only in how hard the equivalence is to see. I need belief to do two things: predict which claim an auditor will check, act on, or ignore next, and give me a standard for saying that an auditor's reasoning has gone wrong rather than merely stopped short. So before I go shopping for a formal framework, I want the specification one would have to meet.

  Please write the desiderata for a theory of a bounded agent's beliefs: the cases it must get right, the distinctions it must respect, the results from logic and computational complexity it cannot contradict, and the constraint behind each. I have a partial list, which you should correct, reorder, and extend rather than just execute. It includes: an auditor who believes a conditional and its antecedent but has not drawn the conclusion, and must not thereby be described as believing the conclusion; an auditor whose beliefs are jointly inconsistent, who must not thereby believe everything; the requirement that inference sometimes does extend belief, so that noticing a consequence is a genuine way to acquire one (a theory that makes the agent a logical idiot is no better than one that makes it a god); the requirement that some substitutions of equivalents go through while the hard ones do not, and some principled account of where that line falls; the problem I think of as the prefix problem, that closure under each small step, iterated, seems to rebuild full omniscience one cheap step at a time, so the break in the chain has to be located rather than stipulated; and two things I have made up and am suspicious of myself — an attributable-gap condition, on which every permitted failure of closure must be traceable to a specifiable and independently checkable limitation of the agent (a resource bound, a blind spot for a class of equivalences, an unrecognized instance of a schema) rather than posited case by case, and the leash, on which a failure of closure cannot be permanent: if both premises of a one-step inference are occurrent and the agent has the capacity to perform it, the model must be committed to the agent either acquiring the conclusion or giving up a premise, never to a state suspended indefinitely. Also address, with cases: whether belief attaches to propositions or to representations, given that derivational difficulty shifts with how a proposition is written down; what stops a fine-grained notion of belief from degenerating into the modeler attributing any pattern of belief and calling it boundedness; what the theory implies about beliefs about other agents' beliefs, given that the usual results about common belief and agreement presuppose the idealization I am trying to remove; what the graded-belief analogue looks like, since a probability function is already fully coherent over every logical relation; and how the theory represents an agent whose inferential powers improve, and how it marks the difference between an auditor who has not yet noticed a consequence and one who would reject it.

  Mark which requirements are non-negotiable for my two purposes and which are really preferences of one research program; say whether prediction and normative evaluation pull the specification in different directions; flag any pair of requirements you suspect cannot be jointly satisfied, and tell me which single requirement does the most work in excluding candidates. Then, briefly and only for the approaches you can characterize without guessing, how the main families of response to the problem of logical omniscience do against the list; skip any you would have to reconstruct from half-remembered details, since the criteria are the deliverable and the scorecard is a footnote. Please write in American English.
reasoning: |-
  We are building desiderata for a theory of bounded belief for software auditors in a simulation. The goal is to predict their actions (which claims they check next) and to provide a standard for when their reasoning has gone wrong (not just stopped short). The standard possible-worlds model fails because it implies logical omniscience. We need a model that accounts for bounded resources and the difficulty of inference.

  Here is a structured list of desiderata, corrected, extended, and reordered. Each item includes a description, a constraint or reason, and whether it is non-negotiable (for prediction and/or normative evaluation) or a preference. We also address the additional questions.

  ## I. Core Desiderata (Non-negotiable for both prediction and normative evaluation)

  1. **Non-closure under logical consequence (even obvious ones)**: 
     - *Case*: An auditor believes P and believes "If P then Q", but has not yet derived Q (and hasn't checked it). The model must not represent the auditor as believing Q until they have actually derived it (or otherwise come to accept it).
     - *Constraint*: Closure under logical consequence is unrealistic for bounded agents. We must break closure to model real agents.
     - *Why non-negotiable*: For prediction, we need to model which claims the auditor will actually check next. If they haven't derived Q, they won't act on it. For normative evaluation, we need to be able to say that the auditor has not yet drawn a valid conclusion without implying they already believe it.

  2. **Inconsistency without explosion**:
     - *Case*: An auditor holds an inconsistent set of beliefs (e.g., because they haven't noticed the contradiction). The model must not imply that they believe every proposition (as in classical logic).
     - *Constraint*: Real agents can hold inconsistent beliefs without believing everything.
     - *Why non-negotiable*: For prediction, an auditor with an inconsistent set of beliefs does not act as if they believe everything. For normative evaluation, we need to mark inconsistency as a flaw without collapsing the entire belief state.

  3. **Inference as belief extension**:
     - *Case*: When an auditor performs an inference (e.g., modus ponens on P and "If P then Q"), they come to believe Q. The model must allow that inference can genuinely extend the agent's beliefs.
     - *Constraint*: Without this, the model would be trivial (no learning) and not reflect actual reasoning.
     - *Why non-negotiable*: For prediction, we need to model how the auditor updates beliefs. For normative evaluation, we need to credit the agent for correct inferences.

  4. **Distinguishing easy and hard equivalences**:
     - *Case*: An auditor might believe a proposition expressed in one form but not in an equivalent form that is computationally hard to recognize as equivalent (e.g., two boolean formulas that are equivalent but require exponential time to check). The model must sometimes allow substitution of equivalents (e.g., when the equivalence is trivial) but not always.
     - *Constraint*: The difficulty of recognizing logical equivalences varies and affects belief ascription.
     - *Why non-negotiable*: For prediction, the auditor might act on one representation and ignore another. For normative evaluation, we need to say that an agent should recognize easy equivalences but not necessarily hard ones.

  5. **The prefix problem (step-by-step closure)**:
     - *Problem*: If we close belief under each small, feasible inference step, then by iterating we might eventually get full closure (logical omniscience) unless we break the chain. The break must be located in a principled way (e.g., resource bounds) and not by arbitrary stipulation.
     - *Constraint*: We need to avoid the regress that leads back to omniscience.
     - *Why non-negotiable*: Without a principled break, the model becomes unrealistic. We must account for why the agent stops at a particular point.

  6. **Attributable gap condition**:
     - *Requirement*: Every failure of logical closure must be attributable to a specific, independently checkable limitation of the agent (e.g., a bound on time, memory, or attention; a lack of a specific inference rule; a failure to recognize an instance of a schema). We cannot just posit case-by-case failures.
     - *Constraint*: This ensures that the model is not ad hoc and can be validated.
     - *Why non-negotiable*: For normative evaluation, we need to point to a specific gap (e.g., "the agent ran out of time") to say why the agent hasn't drawn a conclusion. For prediction, the limitations must be part of the model so we can simulate how they affect behavior.

  7. **The leash**:
     - *Requirement*: If an agent has the capacity to perform a simple inference (e.g., modus ponens) and both premises are occurrent (in current attention), then the model must require that the agent either acquires the conclusion or gives up a premise in a timely manner. We cannot have a state suspended indefinitely with the premises held and the conclusion not drawn.
     - *Constraint*: This captures the idea that some inferences are mandatory and must be drawn when the premises are in focus.
     - *Why non-negotiable*: For prediction, we need to model the dynamics of reasoning. For normative evaluation, we must mark as flawed a state where the agent has the premises in mind and the capacity but fails to draw the obvious conclusion.

  ## II. Important but Possibly Negotiable or Program-Dependent

  8. **Graded belief (probability)**:
     - *Requirement*: The theory should have an analogue for graded beliefs (e.g., probabilities). The challenge: a probability function that is coherent (e.g., satisfies the axioms of probability) is already logically omniscient because it assigns probability 1 to all tautologies and respects all logical equivalences. We need a bounded version of probabilistic coherence.
     - *Constraint*: We often use degrees of belief in decision making. The model should allow for uncertainty without logical omniscience.
     - *Note*: This is a preference for some research programs (e.g., if we want to model Bayesian auditors). It's non-negotiable if we require graded beliefs, but if we stick to full beliefs only, it's optional.

  9. **Belief about others' beliefs**:
     - *Requirement*: The model should account for beliefs about other bounded agents' beliefs. The usual common belief and agreement theorems (e.g., Aumann) assume logical omniscience and break down without it.
     - *Constraint*: Auditors may reason about what their colleagues believe.
     - *Note*: This is non-negotiable if the simulation involves multiple auditors who must coordinate. However, the exact treatment may vary by approach.

  10. **Improvement in inferential power**:
      - *Requirement*: The model should allow for agents whose reasoning capacities improve (e.g., they learn a new inference rule, or their memory increases). We must be able to represent how their belief state changes with capacity.
      - *Constraint*: Agents can get better at reasoning over time.
      - *Note*: This is non-negotiable for a realistic simulation that may span time, but the exact mechanism might be program-dependent.

  11. **Distinguishing "not yet" from "reject"**:
      - *Requirement*: The model must distinguish between:
          - An auditor who has not yet considered a consequence (and would accept it if they did).
          - An auditor who would reject a consequence (even upon consideration).
      - *Constraint*: This is crucial for both prediction (will they accept it if prompted?) and normative evaluation (is it a failure of reasoning or a disagreement?).
      - *Note*: Non-negotiable for both purposes.

  ## III. Representational Issues (Non-negotiable for prediction)

  12. **Beliefs attach to representations (syntactic sensitivity)**:
      - *Requirement*: Belief must be sensitive to the way a proposition is represented (the syntax), because the difficulty of inference depends on the form. The model should not treat logically equivalent expressions as interchangeable if the equivalence is hard to see.
      - *Constraint*: For prediction, the auditor's actions depend on the specific representation they are considering. For normative evaluation, we can say that an agent should recognize easy equivalences but not hard ones.
      - *Note*: This is non-negotiable. Without syntactic sensitivity, we cannot model the auditor's behavior accurately.

  13. **Avoiding degeneracy (no "anything goes")**:
      - *Requirement*: The model must not allow arbitrary belief patterns to be attributed as "bounded". There must be constraints (e.g., based on resource bounds) that make the belief state objectively evaluable.
      - *Constraint*: Without this, we could not say that the agent has made a mistake (as opposed to just being bounded).
      - *Note*: Non-negotiable for normative evaluation.

  ## IV. Potential Tensions and the Key Constraint

  - **Tension between prediction and normative evaluation**: 
    - Prediction might require a more permissive model (to capture any pattern of behavior) while normative evaluation requires strict constraints (to define when the agent has gone wrong). The attributable gap condition and the leash help by tying failures to specific limitations.

  - **Suspected incompatibilities**:
    - The requirement for inference to extend beliefs (Desideratum 3) and the leash (Desideratum 7) might conflict with the non-closure (Desideratum 1) if the model does not have a clear notion of "occurrent" and "capacity". But we can resolve this by having a dynamic model that updates when the agent performs an inference step.
    - The attributable gap condition (Desideratum 6) and the requirement to avoid degeneracy (Desideratum 13) are critical for normativity but might be hard to satisfy without a computationally explicit model.

  - **The key constraint that does the most work**: 
    - **The attributable gap condition (Desideratum 6)**. It forces the model to be explicit about the agent's limitations, which in turn helps with prediction (by constraining the belief state) and normative evaluation (by providing a standard for when the agent should have done better).

  ## V. How Main Approaches Fare (Briefly)

  We consider approaches without deep reconstruction:

  1. **Syntactic (proof-theoretic) approaches**: 
     - Beliefs are represented by a set of sentences (in some language) closed under a set of feasible inference rules (but not under all logical consequences). 
     - *Pros*: Naturally handles non-closure, inference as extension, and syntactic sensitivity. Inconsistency without explosion is easy (use paraconsistent logic). 
     - *Cons*: The prefix problem: if we close under feasible rules, we might still get too much. We need to limit the number of inference steps (resource bounds). The attributable gap condition can be met by the resource bound. The leash is handled if we model occurrent beliefs and step-by-step reasoning. Graded beliefs are not naturally handled. Belief about others' beliefs becomes tricky (nested syntax?).

  2. **Resource-bounded reasoning (e.g., time-limited deduction)**:
     - Belief is defined by what the agent can deduce within resource bounds (time, memory). 
     - *Pros*: Directly addresses the attributable gap (the gap is due to resource limits). Handles non-closure, inference as extension, and the leash (if the agent has the resources, they must draw the conclusion). 
     - *Cons*: May be computationally intractable to simulate. The exact set of beliefs might be hard to compute. Graded beliefs are not addressed. The prefix problem is handled by the bound, but the choice of bound is critical.

  3. **Impossible worlds**:
     - Extend possible worlds with "impossible" worlds where logical truths may fail. An agent's belief set is the set of propositions true in all worlds they consider possible (including impossible ones). 
     - *Pros*: Non-closure and inconsistency without explosion are handled. 
     - *Cons*: Without further constraints, it can be too permissive (degeneracy). The attributable gap condition isn't automatically met (why is a particular logical failure present?). The leash and inference as extension are not naturally modeled. Graded beliefs might be added but without a clear boundedness constraint. Not good for prediction because it doesn't model the process.

  4. **Dynamic doxastic logic / belief revision**:
     - Models belief change over time via operations (expansion, contraction, revision). 
     - *Pros*: Handles inference as extension and the leash (via dynamic rules). 
     - *Cons*: Typically assumes logical closure at each step (which we don't want). Need to modify to include resource bounds and non-closure.

  5. **Bounded probabilistic models**:
     - Use probability but relax coherence (e.g., assign probabilities without requiring that all tautologies have prob 1). 
     - *Pros*: Handles graded belief. 
     - *Cons*: Without constraints, it can be arbitrary (degeneracy). The attributable gap condition is hard to meet. Not clear how to handle the leash or inference for full beliefs.

  **Recommendation**: For your purposes (simulation of auditors making discrete checks), a syntactic approach with explicit resource bounds (time, memory, attention) and a step-by-step inference model seems most promising. It naturally meets the non-negotiable desiderata, especially if we model occurrent beliefs (what's in working memory) and have a process for drawing inferences when premises are occurrent.

  ## VI. Summary of Non-negotiable vs. Preferences

  - **Non-negotiable** (for both prediction and normative evaluation): 
    1. Non-closure under logical consequence.
    2. Inconsistency without explosion.
    3. Inference as belief extension.
    4. Distinguishing easy and hard equivalences (via syntax).
    5. Solving the prefix problem (with a principled break).
    6. Attributable gap condition.
    7. The leash.
    11. Distinguishing "not yet" from "reject".
    12. Beliefs attach to representations.
    13. Avoiding degeneracy.

  - **Preferences** (may depend on the research program):
    8. Graded belief (if needed).
    9. Belief about others' beliefs (if multi-agent).
    10. Improvement in inferential power (if the simulation is long-term).

  This list should serve as a specification for your formal framework.
answer: |-
  Below is a structured specification of desiderata for a bounded belief theory tailored to your simulation of software auditors. I've reordered, extended, and refined your partial list, incorporating computational, logical, and normative constraints. Each item includes:  
  - **Case/Requirement**: The concrete scenario or property the theory must handle.  
  - **Constraint**: Why it's needed and what it prevents.  
  - **Non-negotiable?**: Whether it's essential for prediction (P), normative evaluation (N), or both. "Preference" indicates a valuable but flexible goal.  
  - **Key tensions**: Conflicts or challenges noted where relevant.  

  ### I. Core Desiderata (Non-negotiable for P and N)  
  These ensure basic realism and evaluability for auditors.  

  1. **Non-closure under logical consequence**  
     - **Case**: Auditor believes \(P\) and \(P \rightarrow Q\) but hasn’t derived \(Q\) due to cognitive load. Must *not* count as believing \(Q\).  
     - **Constraint**: Avoids omniscience; predicts which claims are acted upon (e.g., \(Q\) is ignored until derived).  
     - **Non-negotiable?**: Yes (P, N).  

  2. **Inconsistency without explosion**  
     - **Case**: Auditor believes mutually inconsistent claims \(P, \neg P\) (e.g., due to oversight) but doesn’t believe arbitrary \(R\) (e.g., "the code is secure").  
     - **Constraint**: Permits localized errors without global incoherence. Critical for normative blame: errors are fixable gaps, not total breakdowns.  
     - **Non-negotiable?**: Yes (P, N).  

  3. **Inference as belief extension**  
     - **Case**: After deriving \(Q\) from \(P\) and \(P \rightarrow Q\) via a feasible step, auditor adds \(Q\) to beliefs.  
     - **Constraint**: Bounded agents *do* extend beliefs via inference. Without this, the model cannot capture learning or progress.  
     - **Non-negotiable?**: Yes (P, N).  

  4. **Syntactic sensitivity**  
     - **Case**: Auditor believes "file F is malware-free" but not "file F has no malicious payload" (equivalent but harder to recognize). Must distinguish representations.  
     - **Constraint**: Predicts which formulations trigger checks (e.g., auditors act on familiar phrasings). Derivation difficulty depends on syntax.  
     - **Non-negotiable?**: Yes (P).  
     - **Key tension**: With normative ideals (logic treats equivalents identically).  

  5. **Attributable gap condition**  
     - **Case**: If auditor fails to believe consequence \(Q\), this must be traceable to a specific, checkable limitation (e.g., "lacks RAM to run theorem prover for \(Q\)").  
     - **Constraint**: Prevents ad hoc excuses for failures; enables normative diagnosis (e.g., "should have seen \(Q\) *given their tools*").  
     - **Non-negotiable?**: Yes (N).  

  6. **The leash (dynamic coherence under occurrent beliefs)**  
     - **Case**: If \(P\) and \(P \rightarrow Q\) are *occurrent* (in working memory) and auditor has capacity for modus ponens, they must eventually believe \(Q\) or drop \(P\)/\(P \rightarrow Q\). No permanent suspension.  
     - **Constraint**: Ensures "obvious" inferences are handled; models real-time reasoning.  
     - **Non-negotiable?**: Yes (P, N).  

  ### II. Structural Desiderata (Non-negotiable for N, Preference for P)  
  These prevent degeneracy and handle scaling.  

  7. **Prefix problem resolved via feasible paths**  
     - **Case**: Closure under cheap steps (e.g., 1-second inferences) doesn’t yield omniscience because the *chain* of required steps exceeds resources (e.g., age of universe).  
     - **Constraint**: Breaks must be located in *cumulative cost* (e.g., time/memory), not step-by-step closure. Must reflect computational irreducibility (e.g., problems in **PSPACE**/**EXP**).  
     - **Non-negotiable?**: Yes (N).  

  8. **Non-degeneracy / anti-arbitrariness**  
     - **Case**: Model must not allow "anything goes" (e.g., auditor believes \(P\) but not trivial \(P \lor Q\)). Gap must be justified by attributable limits (e.g., "didn’t consider \(Q\)").  
     - **Constraint**: Boundedness ≠ irrationality; beliefs must align with *feasible* reasoning.  
     - **Non-negotiable?**: Yes (N).  

  9. **Belief-gap distinction: "Not yet" vs. "reject"**  
     - **Case**: Auditor who hasn’t considered \(Q\) (would accept if derived) vs. one who would reject \(Q\) (e.g., due to misunderstanding).  
     - **Constraint**: Predicts reactions to new evidence; evaluates if reasoning *can* be completed.  
     - **Non-negotiable?**: Yes (P, N).  

  ### III. Extended Desiderata (Preference or Context-Dependent)  
  Useful for richer simulations but negotiable.  

  10. **Graded beliefs without probabilistic omniscience**  
      - **Case**: Auditor assigns probability 0.7 to "file F is safe" but not to equivalent "¬F is unsafe" (hard equivalence). Must allow incoherent probabilities (e.g., violate logical constraints).  
      - **Constraint**: Reflects uncertainty in audits; avoids idealization (standard probability = logically omniscient).  
      - **Non-negotiable?**: Preference (for realism).  

  11. **Nested beliefs about other bounded agents**  
      - **Case**: Auditor A believes "auditor B hasn’t noticed flaw X." Must not imply A believes all consequences about B’s state (e.g., "B won’t notice X in 10^9 years").  
      - **Constraint**: Common knowledge/agreement theorems fail for bounded agents; new dynamics needed.  
      - **Non-negotiable?**: Preference (if multi-agent).  

  12. **Adaptivity to capacity improvements**  
      - **Case**: Auditor gains better tools (e.g., SAT solver), so previously hard inferences become feasible.  
      - **Constraint**: Belief state must update to reflect new capacities, not just new info.  
      - **Non-negotiable?**: Preference (for long-term simulations).  

  ### IV. Tensions, Trade-offs, and Key Constraints  
  - **Prediction vs. Normative Evaluation**:  
    - P pulls toward *flexibility* (e.g., syntax-sensitive beliefs to predict actions).  
    - N pulls toward *strict standards* (e.g., attributable gaps to judge errors).  
    - **Resolution**: The attributable gap condition (Desideratum 5) bridges both by tethering failures to observable limits.  

  - **Suspected Incompatibilities**:  
    - **Syntactic sensitivity (4)** + **Non-degeneracy (8)**: If beliefs are too syntax-bound, degeneracy risk rises (any belief pattern could be excused). Mitigated by tying syntax to *feasible equivalences* (e.g., polynomial-time rewrites).  
    - **Leash (6)** + **Non-closure (1)**: Permanent suspension is banned, but some inferences are never triggered (e.g., if premises aren’t occurrent). The leash applies only when premises are active.  

  - **Highest-Leverage Constraint**:  
    **Attributable gap condition (5)** does the most work. It:  
    - Forces the model to specify *why* closure fails (e.g., "no RAM for step \(k\)"), blocking degeneracy.  
    - Enables normative evaluation ("auditor *should* have derived \(Q\) given their tools").  
    - Excludes theories that posit gaps arbitrarily (e.g., unawareness models without resource bounds).  

  ### V. Quick Scorecard of Existing Approaches  
  *Only brief, non-speculative assessments. "✓" = satisfies, "✗" = violates, "△" = partial.*  

  | Approach                  | Non-closure (1) | Inconsistency w/o explosion (2) | Inference extension (3) | Syntactic sensitivity (4) | Attributable gap (5) | Leash (6) | Prefix problem (7) | Non-degeneracy (8) |  
  |---------------------------|----------------|--------------------------------|------------------------|--------------------------|---------------------|----------|-------------------|-------------------|  
  | **Syntactic** (e.g., belief bases) | ✓ | ✓ | ✓ | ✓ | △ (if resource-aware) | △ | ✗ (chain closure) | △ |  
  | **Resource-bounded deduction** | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |  
  | **Impossible worlds**      | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ | ✗ |  
  | **Awareness logic**        | ✓ | ✓ | △ | ✓ | ✗ (gaps arbitrary) | ✗ | △ | ✗ |  
  | **Bounded probability**    | △ (via approximations) | △ | △ | ✓ | △ | △ | △ | △ |  

  - **Syntactic**: Represents beliefs as explicit sentences. Fails prefix problem (closure under cheap steps rebuilds omniscience).  
  - **Resource-bounded deduction**: Uses time/memory bounds (e.g., only deductions in ≤ \(n\) steps). Best fit: handles attributable gaps and leash.  
  - **Impossible worlds**: Allows worlds violating logic. Fails leash and degeneracy (no constraints on "impossibility").  
  - **Awareness logic**: Agents "unaware" of formulas. Gaps are arbitrary (no tie to resources).  
  - **Bounded probability**: E.g., using approximate solvers. Graded beliefs possible but lacks clear normative standards.  

  **Recommendation**: Resource-bounded deduction (e.g., [Fagin-Halpern] models with explicit computation) best meets non-negotiables. Augment with syntax-aware belief bases for prediction and attributable resource caps for normative evaluation.  

  ### Final Notes  
  - **American English**: As requested.  
  - **Deliverable**: This specification isolates what a theory *must* do. Use it to vet frameworks (e.g., demand explicit resource parameters).  
  - **Next Step**: Implement resource-bounded deduction with:  
    - Beliefs as syntactically stored sentences.  
    - Inference as explicit, costly operations (e.g., theorem-proving steps).  
    - Attributable gaps = exceeded time/memory bounds.  
    - Leash enforced via agent "attention" (occurrent beliefs trigger mandatory steps).
