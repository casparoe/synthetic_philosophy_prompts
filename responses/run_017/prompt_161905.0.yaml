  The user wants to know if this has been named or studied, and if not, to have it properly defined. They've already ruled out several concepts: correlation neglect (since it's not about ignoring statistical dependencies), double-counting (since the issue is under-counting), and general worries about large numbers multiplied by small probabilities (since the concern is about internal consistency).

  I need to provide a structured response with four sections as requested. For the closest concepts, I should consider philosophical discussions of consciousness thresholds, expected value theory in ethics, cognitive biases like scope neglect, and anthropocentric framing. Each falls short in specific ways - they don't capture this particular asymmetric application of evidence.

  The core mechanism seems to be a failure to recognize that the same evidence constrains both probability AND magnitude dimensions simultaneously. The simplicity argument logically affects both dials, but arguers treat them as independent levers. The cancellation argument has merit - if we model consciousness as a continuum, the expected value product might indeed be more stable than polarized positions suggest.

  For naming, I'll propose "Subjective Scale-Probability Decoupling" to capture the artificial separation of the magnitude and probability dimensions when evaluating subjective experience. Boundary cases would include scenarios where evidence genuinely affects only one dimension, like pharmacological interventions that affect pain intensity without altering probability of consciousness.

  The user is clearly analytically sophisticated (a data engineer thinking like a philosopher) and frustrated by what they perceive as motivated reasoning in this domain. Their request for tight definition and boundary cases suggests they want conceptual tools to cut through rhetoric.
answer: |-
  Here's a structured analysis addressing your observation, following your requested sections:

  ### 1. Closest Concepts in the Literature (~250 words)
  The pattern resembles several established ideas:
  *   **Expected Value Theory in Ethics/Prioritarianism:** Philosophers like Peter Singer and Nick Bostrom analyze moral weight using expected value calculations (Probability × Magnitude). Your observation critiques inconsistent parameterization within this framework.
  *   **Hard Problem of Consciousness & Explanatory Gap:** Discussions around minimal consciousness (e.g., David Chalmers, Thomas Nagel) often grapple with whether simple systems possess "thin" subjective experience versus "rich" human-like qualia. This directly relates to how "magnitude" is conceptualized.
  *   **Scope Neglect/Scope Insensitivity:** Psychologists (e.g., Kahneman, Slovic) document how humans struggle to scale emotional responses or valuations proportionally to large numbers. Your instance highlights a *structural* inconsistency in scaling magnitude that precedes emotional response.
  *   **Anthropocentrism/Bias in Mind Attribution:** Work in comparative cognition (e.g., Kristin Andrews, Frans de Waal) shows biases in attributing complex mental states. Your case reveals a subtler bias: *how* evidence of simplicity is applied depending on the desired conclusion.
  *   **Conceptual Fragmentation of Consciousness:** Philosophers like Eric Schwitzgebel argue consciousness isn't a single, unified property. Your "dials" reflect fragmenting consciousness into "presence" (probability) and "intensity/richness" (magnitude), potentially without justification.

  ### 2. How Each One Falls Short (~250 words)
  *   **Expected Value Theory:** While the *framework* is central, the literature often assumes Probability and Magnitude can be estimated independently. Your observation reveals a specific failure mode: the *same evidence* (neural simplicity) is illegitimately applied to only one parameter while ignored for the other, violating the framework's implicit requirement for consistent evidence handling. It’s not just poor estimation; it’s inconsistent application.
  *   **Explanatory Gap/Hard Problem:** These highlight the difficulty but don't diagnose the specific *logical inconsistency* in how simplicity evidence is deployed selectively across the probability/magnitude dimensions during *calculation*. The gap enables the inconsistency but doesn't name it.
  *   **Scope Neglect:** This describes an *affective* or *evaluative* failure to scale responses to large numbers. Your case is about a *logical/conceptual* inconsistency in parameter estimation *before* the scaling problem arises. It’s about flawed input construction, not flawed emotional scaling of the output.
  *   **Anthropocentrism/Bias:** These explain *why* someone might *want* one outcome, but not the specific *mechanism* of applying the same evidence asymmetrically to different dials to achieve it. The bias manifests in parameter manipulation, not just the conclusion.
  *   **Double-Counting/Correlation Neglect:** As you rightly ruled out:
      *   *Double-Counting:* The error is the *opposite* – not counting twice, but *under-applying* the evidence by using it only once where it logically applies twice.
      *   *Correlation Neglect:* The issue isn't ignoring a statistical correlation *in the world*, but failing to recognize a *logical/conceptual entanglement* between two parameters in the model itself. Simplicity doesn't just correlate with low probability *and* low magnitude; it's fundamentally *the reason* for expecting both.

  ### 3. What’s Actually Going On (~300 words)
  The core mechanism is **motivated parameter manipulation within an expected value framework, exploiting conceptual ambiguity about consciousness**. The key steps are:
  1.  **Conceptual Splitting:** Consciousness is implicitly or explicitly decomposed into two distinct parameters for calculation: "Presence" (Probability) and "Intensity/Quality" (Magnitude).
  2.  **Evidence Ambiguity:** Evidence about system simplicity (e.g., neural substrate, behavioral repertoire) is *logically relevant* to *both* parameters. Simpler systems make consciousness *less likely to exist at all* (lower Probability) and, *conditional on existence*, make any experience *less intense, rich, or enduring* (lower Magnitude).
  3.  **Motivated Decoupling:** To achieve a desired conclusion (e.g., "insect suffering is a huge issue" OR "insect suffering is negligible"), the thinker *artificially decouples* the parameters. They apply the simplicity evidence *fully* to the parameter that moves the expected value towards their goal (lowering Probability OR lowering Magnitude) while *ignoring or minimizing* its logical implication for the *other* parameter.
  4.  **Cancellation Potential:** Your intuition has merit. If consciousness exists on a continuum, and simplicity evidence pushes both Probability (P) and Magnitude (M) down, the product (Expected Value = P x M) *might* be relatively stable across a range of interpretations. If P and M are inversely correlated due to the same underlying cause (simplicity), large swings in one compensated by swings in the other dampen changes in the product. However, the cancellation isn't guaranteed:
      *   The *functional relationship* between simplicity and P vs. simplicity and M might differ (e.g., P might drop exponentially with simplicity while M drops linearly).
      *   The *threshold* for minimal consciousness is crucial. If simplicity pushes P near zero rapidly, M becomes irrelevant. If the threshold is low, P remains moderate while M varies significantly.
      *   **Entanglement:** The parameters *are* deeply entangled. The justification for lowering P (e.g., "too simple for *any* experience") often *implies* that if experience *does* exist, it must be minimal (low M). Conversely, arguing for higher P using a minimalist definition of consciousness (e.g., "any valenced state") *implies* that M must be low. Treating them as independent levers is the fundamental error.

  ### 4. Name, Definition, and Boundary Cases (~200 words)

  *   **Name:** **Subjective Scale-Probability Decoupling (SSPD)**
  *   **Definition:** The logical error occurring when estimating the expected moral weight or significance of subjective experience in minimally complex systems (like insects), where the *same body of evidence* justifying a decrease in the estimated *probability* of any subjective experience existing is ignored or discounted when estimating the *magnitude* (intensity, richness, duration) of that experience *conditional on its existence* (or vice versa), leading to inconsistent and potentially biased expected value calculations.
  *   **Boundary Cases:**
      *   **Excluded Case 1 (Genuinely Independent Evidence):** Evidence affecting only one parameter. E.g., discovering a specific neurotoxin in insects that, *if* they are conscious, drastically amplifies pain intensity without altering the underlying neural complexity relevant to the *probability* of consciousness. Adjusting Magnitude based *only* on this toxin evidence, while keeping Probability based on simplicity, is not SSPD.
      *   **Excluded Case 2 (Distinct Simplicity Aspects):** Evidence about different *aspects* of simplicity affecting different parameters. E.g., arguing neural *size* limits the *probability* of complex integration (affecting P), while behavioral evidence shows a *lack of long-term aversive learning* specifically suggests *conditional* suffering lacks duration/persistence (affecting M). If the aspects are distinct, adjusting dials separately isn't decoupling the *same* evidence.
