prompt: |-
  yo — please act like you're a professional philosopher who specializes in political theory and the philosophy of language, and take it slowly: do some brainstorming before you answer, and definately don't just throw a label at me.

  Me and my friends keep arguing about this and I dunno if there's a word for it. Whenever someone says "that's against Western values" or "we have to defend Western values" in a debate, the list of what's actually in the phrase seems to change depending on what they need it to be that minute. Example: my friend says free speech and equality are Western values, but when I pointed out that plenty of countries everyone calls Western had blasphemy laws or didn't let women vote until pretty recently, he just goes "yeah, but those countries were betraying their own values" — so nothing that actually happens in a Western country can ever count against the claim. And then the same person uses a really long list when he's blaming "the West" for stuff (colonialism, slavery, capitalism, pollution) and a really short nice-sounding list when he's defending it. It feels like the phrase grabs authority from "this is what we actually do around here" and then dodges to "this is what's good" the second anyone pushes back, and then back again. My other friend just says it's a weasel word and that's it, but that feels too easy, because I think lots of people use it completely sincerely and it still does the same slide.

  Is there an actual concept for this? Something about a term that means both "what this group happens to be like" and "what's genuinely good" and quietly switches between the two so that neither half can ever be checked. If there is one, explain it in your own words — I can't look anything up, so don't just name-drop authors and papers, actually explain the idea — and be really specific about how my case differs from the nearby stuff: plain vagueness, No True Scotsman, just a loaded or empty word, ordinary hypocrisy. I don't think any of those is quite it and I want to know why each one misses. If there genuinely isn't an established name, say so plainly and coin one, define it carefully, and give me the boundary cases: what has to be true for something to count, and what would look similar but isn't. I want to be able to spot the move in totally different arguments, not just win this one.
reasoning: |-
  Okay, the user is asking about a specific rhetorical tactic where the term "Western values" shifts meaning depending on the context—defensively it refers to idealized principles like freedom and equality, but offensively it includes historical wrongs like colonialism. The user wants to know if there's a philosophical concept for this, and if not, to coin a term.

  First, I need to recall relevant philosophical concepts. The description reminds me of Wittgenstein's family resemblances, where a term doesn't have a fixed definition but overlapping features. Also, Gallie's essentially contested concepts come to mind, where the meaning is inherently disputed. But the key here is the tactical switching between descriptive and normative uses.

  The user mentioned that common labels like "No True Scotsman" or hypocrisy don't quite fit. Why? No True Scotsman is about redefining categories to exclude counterexamples, but here it's not just redefinition—it's switching between two different meanings (descriptive vs. normative). Hypocrisy involves inconsistency in actions versus beliefs, but this is about linguistic inconsistency within the same term.

  The core issue is the dual use of the term to mean both what Western societies actually are (descriptive) and what they ideally should be (normative). This allows the user to dodge criticism. For example, when confronted with historical violations like blasphemy laws, the response is that those were betrayals of the ideal, thus protecting the normative meaning. But when attacking, the descriptive reality (colonialism) is used to assign blame.

  I should consider if there's an existing term. "Motivated reasoning" or "equivocation" are close but not precise. Equivocation involves changing meanings, but here it's systematic and serves a specific purpose. "Ideological halo effect" might capture the association of the term with positive values, but doesn't address the switching.

  The user's deeper need is to identify this tactic in various arguments, not just win a debate. They want a tool for analysis. So creating a new term might be necessary. Something like "normative-descriptive sliding" or "teleological shell game." The latter uses "teleological" because the ideal is a goal (telos), and "shell game" implies deception through shifting definitions.

  To define it clearly: The term has two registers—descriptive (current/past realities) and normative (aspirations). The user switches between them to avoid accountability. Conditions for this move: the term must be culturally valorized, have historical complexity, and be used in both critical and defensive contexts.

  Boundary cases: If someone consistently uses only one register, it's not this tactic. Or if the term isn't culturally central, like "suburban values," it wouldn't have the same weight. Also, this differs from vagueness because vagueness lacks clarity, whereas here there's intentional switching between two distinct meanings.

  Explaining why other concepts don't fit: Vagueness is ambiguous meaning, but here meanings are clear but switched. No True Scotsman redefines category membership, whereas here the category's meaning shifts. Hypocrisy is behavioral inconsistency, not semantic shifting. Loaded terms carry bias but don't necessarily switch meanings.

  The user's examples show sincere use, so it's not just insincerity. The rhetorical power comes from the term's cultural authority, making criticism seem like an attack on the ideals themselves. This connects to ideology critique, where terms serve power structures by being flexible.

  Finally, the coined term should be memorable and descriptive. "Teleological Shell Game" emphasizes the deceptive shifting around an end goal. Making sure to outline how to spot it: look for terms that are both descriptive and normative, used defensively and critically, with meaning shifts that protect the concept from refutation.
answer: |-
  This is an exceptionally sharp observation, and you're right – it's more nuanced than simple hypocrisy, vagueness, or No True Scotsman. While there isn't a single universally accepted term that perfectly captures *this specific dynamic*, we can absolutely define the concept precisely and distinguish it from nearby ideas. Let's break it down step by step.

  **Core Concept: Normative-Descriptive Shell Game**

  The phenomenon you describe is best understood as a **Normative-Descriptive Shell Game (NDSG)**. Here's the breakdown:

  1.  **The Term:** A culturally or politically valorized term (e.g., "Western values," "True Democracy," "Our Heritage") that carries significant rhetorical weight and claims to represent a collective identity.
  2.  **The Two Registers:**
      *   **Descriptive Register (What *Is*):** Refers to the actual, historical, or current practices, institutions, and behaviors associated with the group or concept being labeled. This is empirically observable (though interpretations vary).
      *   **Normative Register (What *Ought* to Be):** Refers to an idealized set of principles, virtues, or aspirations that the term is *supposed* to embody. These are presented as universal goods inherent to the concept.
  3.  **The Shell Game (The Tactical Switch):** The crucial move is the *slippage* between these two registers *within the same argumentative context*, performed strategically to:
      *   **Deflect Criticism:** When presented with negative *descriptive* realities (e.g., historical slavery, current inequality), the speaker instantly shifts to the *normative* register ("Those were betrayals of our true values!"). The ideal becomes the shield, immunizing the concept from empirical counter-evidence based on the group's *actual* behavior.
      *   **Claim Credit/Affirm Identity:** When asserting positive aspects or defending the concept, the speaker often leans heavily on the *normative* register ("We stand for Freedom and Equality!"). This taps into the aspirational power.
      *   **Assign Blame/Critique:** When attacking the concept *from within* (or assigning collective responsibility), the speaker seamlessly switches to the *descriptive* register ("Look at the colonialism, pollution, exploitation committed *in the name of* the West!"). The messy reality becomes the weapon.
  4.  **The Function:** This shell game grants the concept **argumentative invulnerability** and **rhetorical power**. It allows the user to:
      *   Claim the authority of historical/cultural reality (the descriptive "is") when convenient.
      *   Claim the moral high ground of universal ideals (the normative "ought") when challenged on reality.
      *   Avoid having to define a fixed, empirically testable set of "values" that must consistently align with both historical practice *and* aspirational ideals.

  **Why it Differs from Nearby Concepts:**

  1.  **Vagueness:** A vague term is simply unclear or ambiguous. "Western values" *is* vague, but the NDSG is an *active strategy* exploiting that vagueness *by switching between two distinct, internally coherent meanings* (the messy reality vs. the pristine ideal). The user *knows* which meaning they're invoking at a given moment for tactical advantage; it's not mere imprecision.
  2.  **No True Scotsman (NTS):** NTS is about redefining category *membership* to exclude counter-examples. "No *true* Western country would have blasphemy laws" is indeed an NTS move. **BUT:** The NDSG is broader. NTS primarily protects the *normative* ideal by purifying the descriptive category ("those weren't *true* examples"). The NDSG *also* actively *uses* the messy descriptive reality offensively ("Look at all the bad things *labeled* Western!"). NTS is one *tactic within* the NDSG arsenal, used defensively. The NDSG encompasses the offensive *and* defensive switching between registers.
  3.  **Loaded Word / Ideograph:** Terms like "freedom" or "Western values" are indeed "loaded" (carry strong connotations) and function as "ideographs" (symbols representing complex ideologies). This explains their *power*, but not the specific *tactic* of switching between descriptive and normative meanings strategically within an argument. The NDSG is *how* that loaded term is *operationalized* rhetorically.
  4.  **Ordinary Hypocrisy:** Hypocrisy is inconsistency between *beliefs/statements* and *actions*. "My friend says he values equality but opposes women's suffrage" is hypocrisy. The NDSG is inconsistency *within the meaning of a single concept* used as an argumentative tool. It's linguistic and conceptual sleight-of-hand *applied to the definition of the value itself*, not (just) a contradiction between stated values and personal behavior. Your friend might be entirely sincere in believing the ideal *is* the true meaning; the problem is the *unacknowledged switching* between that ideal and the messy reality when it suits the argument.
  5.  **Empty Signifier:** This concept (associated with Laclau/Mouffe) describes terms like "The People" that lack a fixed meaning but unite diverse groups against an enemy. "Western values" can *become* an empty signifier, but the NDSG describes the specific *mechanism* by which its emptiness is exploited – by deliberately toggling between two potent but incompatible registers (the real/historical vs. the ideal) for rhetorical gain. The emptiness *enables* the shell game.

  **Boundary Cases: When is it NDSG?**

  *   **Core Condition:** It must involve a valorized term representing a collective identity (nation, culture, ideology, movement) where the speaker *tactically switches* between using it to describe concrete realities/histories and using it to denote abstract, aspirational ideals, specifically to immunize the concept from criticism or maximize rhetorical impact in different contexts.
  *   **What Makes it Sincere Yet Problematic:** The user may genuinely believe the normative ideal *is* the "true" meaning. However, by *also* leveraging the descriptive reality when useful (especially offensively or to claim historical weight), and by *switching* to the ideal *only* when the descriptive reality is challenged, they engage in the shell game, regardless of sincerity. The inconsistency lies in the *usage*, not necessarily conscious deceit.
  *   **Similar But Not NDSG:**
      *   **Evolution of Meaning:** If someone acknowledges that "Western values" historically included X (descriptive) but argues the core normative ideal Y *requires* rejecting X now, that's a coherent argument, not a shell game. They aren't switching registers tactically mid-debate to dodge; they're offering an interpretation.
      *   **Consistent Usage:** Someone who *only* uses "Western values" normatively (ignoring history) or *only* descriptively (cynically) avoids the shell game, though they may be naive or reductive.
      *   **Critiquing the Gap:** Someone saying "Western nations claim value X (normative) but often do Y (descriptive), revealing hypocrisy" is *pointing out* the gap, not *using* the gap tactically. They are holding the concept accountable to both registers.
      *   **Non-Valorized Terms:** Applying this tactic to a neutral or negative term (e.g., "bureaucracy" used descriptively for inefficiency and normatively for... nothing good) lacks the valorization that gives the shell game its power and immunity.

  **Spotting the Move Elsewhere:**

  Look for valorized identity terms ("American Exceptionalism," "The Revolution," "True Christianity," "Scientific Progress," "Our Community Values") used in arguments where:
  1.  Defensively, historical failures or current contradictions are dismissed as "not who we *truly* are" or "betrayals of the ideal."
  2.  Offensively, the term is used to assign blame based on historical actions or current practices associated with the label.
  3.  There's a noticeable shift in the *kind of evidence* considered relevant (empirical history vs. abstract principles) depending on whether the speaker is attacking or defending.

  The key is identifying that **the definition of the term itself is being fluidly adjusted between "what we do/have done" and "what we stand for" as an argumentative tactic**, preventing the concept from ever being pinned down and critically evaluated against both its ideals and its realities simultaneously.

  You've identified a powerful and insidious rhetorical mechanism. Calling it the **Normative-Descriptive Shell Game (NDSG)** gives you a precise tool to dissect it.
