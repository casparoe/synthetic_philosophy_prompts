prompt: |-
  I teach a first-year seminar on practical reasoning, and I keep running into a pattern in student case discussions that I can neither name nor place. I would be grateful for help identifying it, and I do not want just a label: I want to know what exactly the phenomenon is, what it is not, and where its edges are.

  Here is the abstract shape I think I am seeing. Standard doctrine holds that a fully rational agent can never lose, in expectation, by being handed a free and perfectly accurate signal before she chooses: she can always ignore what she learns and do what she would have done anyway, so the information can only help her match her action to the world. A colleague said this is called something like Good's theorem. But my students keep producing cases in which the agent reasonably declines free and reliable information, for a reason that is not the obvious one. She is not afraid of bad news, she does not distrust the source, she is not avoiding a cost or an effort, and she does not think her future self will panic or be tempted. What she says is roughly this: if I knew, I would have to act on it, and I would rather act on what I have now. Two examples from last term. First, a woman is offered, at no cost, a highly accurate predictive test before deciding whether to continue a pregnancy; she declines, and when pressed she insists she is certain she would respond to an unfavorable result exactly as she ought to respond — that is precisely the trouble, because the response she would then owe is one she does not want to make, and she would rather remain in the position where what she owes is to continue. Second, a mid-level manager at a firm being audited arranges not to be read into certain internal findings, not to protect anyone and not out of fear, because if she knew she could no longer truthfully tell the auditors that she had not known: the knowledge would remove a thing she can presently do — speak, assert, vouch, hope — and she wants to keep that available. In the second case the loss looks as though it lives in the space of actions; in the first it looks as though it lives in what the agent takes herself to have reason to do. In both, the agent concedes that the information is free, accurate, and would be used correctly, and still chooses ignorance.

  So my questions. Does this configuration have an established name — ignorance used as a way of keeping some action, or some set of reasons, available to oneself, by an agent who concedes the information would be used well? If it does, give me the carving rather than the term: which of the nearby notions is the right one, and exactly how does my case differ from each of the others? I can think of several that are close but that I do not think fit: the psychological literature on avoiding information one would feel bad about having; the stories in which a present self hides information from a future self who would otherwise give in to temptation; the cases where better information makes everyone worse off because it destroys the possibility of pooling, insuring, or being trusted; and the findings that some simple rules decide better on less data. None of these seems to be what is going on, but I cannot say precisely why. If the pattern has no name, please name and define it yourself, state its boundary cases, and say whether it is a genuine exception to the free-information result — that is, which assumption of that result it violates — or whether it collapses into incoherence once the case is described properly. Lead with a one-sentence verdict, then give the carving, and keep the whole answer under 600 words, in compressed prose or a compact bulleted layout, whichever fits more in.
reasoning: |-
  Okay, this user is teaching a first-year seminar on practical reasoning and has encountered a recurring student case pattern that puzzles them. They've described two concrete examples where agents decline free, accurate information not due to standard reasons like emotional cost or distrust, but because knowing would change their obligatory actions or available speech acts. 

  The core issue seems to be about the normative consequences of knowledge acquisition rather than epistemic or psychological barriers. The pregnancy test case shows how knowledge would create new moral obligations the agent wishes to avoid, while the manager case demonstrates how ignorance preserves valuable deniability in communication. Both center on how information alters the agent's deontic landscape - what they can permissibly do/say or what they become required to do.

  I recall Good's theorem states rational agents should never refuse costless valuable information since they can always ignore it. But these cases violate an implicit assumption of that theorem: that the choice set remains constant before/after learning. Here, gaining knowledge actually changes the action space itself - either by creating new obligations or eliminating certain speech acts. The manager literally loses the ability to make truthful "I don't know" statements, while the pregnant person would be compelled to terminate against current preferences.

  This differs from adjacent concepts like information avoidance (which is psychological) or strategic ignorance (which involves material costs). It's also distinct from temptation cases where future selves misuse information - these agents explicitly state they'd use the information correctly. The violation lies in the shifting normative terrain, not in implementation failures.

  The phenomenon might be termed "Deontic Option Preservation" - maintaining ignorance to retain certain actions/reasons that would become inaccessible or obligatory with knowledge. Its boundaries are defined by two conditions: (1) information acquisition would alter the deontic status of actions (making previously optional acts obligatory or vice versa) or (2) it would eliminate certain speech acts from being truthfully performed. 

  This does constitute a genuine exception to Good's theorem by violating its fixed-action-space assumption. When knowledge structurally changes what one can permissibly do or must do - not just what one should do given fixed options - the value of ignorance emerges rationally. The exception holds unless we artificially define "actions" to exclude deontically sensitive moves like truthful denials or obligation-triggering choices.
answer: |-
  ### Verdict
  This phenomenon is **Deontic Option Preservation**: rational avoidance of knowledge to maintain access to actions or reasons that would become normatively inaccessible or obligatory upon knowing.

  ---

  ### Carving the Phenomenon
  1.  **Core Mechanism**: Information acquisition alters the agent's *deontic position* (what they *ought* to do, or what they can *permissibly assert*), not just their beliefs about the world. Ignorance preserves a valued normative state (e.g., optionality, plausible deniability, or a specific duty-bearer status).
  2.  **Violates Good's Theorem Assumption**: Good's theorem assumes a *fixed action set* and *fixed utility function* over outcomes. Here, knowledge structurally changes the agent's **available actions** (manager: can no longer truthfully *assert* ignorance) or **obligations** (pregnant person: a positive test creates a new, unwanted *duty* to terminate). The "can always ignore" fails because *not acting* on the knowledge itself violates a new norm triggered by knowing.
  3.  **Boundaries**:
      *   **Inner Boundary (Defining):** Loss stems *solely* from the *normative shift* in the agent's practical or communicative position caused by knowing, even with costless, accurate info and perfect rationality.
      *   **Outer Boundary (Distinctions):**
          *   **≠ Information Avoidance (Psychological):** Not driven by anticipated regret/affect; agent is certain they'd process news correctly.
          *   **≠ Self-Binding/Temptation:** Future self is trusted to use info optimally; problem is the *duty/ability* change itself.
          *   **≠ Strategic Ignorance (Social/Game Theory):** Not about manipulating others' beliefs or enabling cooperation/pooling; loss is personal and normative.
          *   **≠ Bounded Rationality/Simple Rules:** Not about cognitive limits or decision quality with less data; agent concedes more info *would* lead to the correct *action* for the state revealed, but objects to that action *becoming* the correct one.

  ---

  ### Exception Status
  This **is a genuine exception** to the universal "free info cannot hurt" result. It violates Good's theorem's **Fixed Action/Strategy Set Assumption**. Knowledge alters the *nature* of the choice:
  *   **Pregnancy Case:** Knowing creates a new, overriding reason/duty (to abort if positive), eliminating the prior option (continuing) as permissible. Ignorance preserves the *optionality* to continue.
  *   **Manager Case:** Knowing eliminates the *action* of truthfully asserting ignorance ("I don't know X"). The *speech act* of vouching without knowledge becomes impossible once knowledge exists; its value depends on its truthful basis. Ignorance preserves the *ability* to perform that specific truthful act.

  **Collapse Risk?** It does *not* collapse into incoherence. The cases are consistent under a **normatively sensitive action space**: what counts as an available/permissible action depends on the agent's epistemic state. The loss is real within the agent's normative framework.
