prompt: |-
  I want to think through a practice that has always struck me as philosophically strange, and I would like you to reconstruct what it presupposes about meaning.

  The practice is statutory interpretation as it is actually done in common-law courts. As I understand it (correct me if I have the practice wrong, but I don't want the answer to turn on contested legal detail): when a dispute turns on what a statutory word means, courts apply something like a plain-meaning rule. Absent a statutory definition, ordinary words get their ordinary meaning, technical terms get their technical meaning, and judges routinely consult dictionaries and corpus evidence of ordinary usage, and other statutes, to establish it. Statutes frequently contain definitions sections, in which a term is defined by other terms of the statute, which are sometimes themselves defined further along. The meaning is treated as fixed at the time of enactment rather than as tracking later changes in usage. Where the term is a term of art, courts defer to the specialized community that uses it rather than to the general reader's sense of the word. And the ordinary-meaning inquiry is explicitly relativized to a readership: the meaning that competent speakers within the statute's intended audience would have taken the text to have. Finally, the whole apparatus has an escape hatch: a reading is abandoned, even when the words are clear, if it would produce absurd or cruel results.

  Here is what puzzles me. The practice looks, on its face, like an attempt to fix meaning entirely by symbol-to-symbol relations — a statute defining its terms by its other terms, judges consulting a book that defines words by other words, the inquiry stopping at the walls of the legal corpus. But the canonical illustration of the symbol grounding problem is precisely that a dictionary cannot do this: someone who did not already understand the language would cycle endlessly from one uninterpreted definition to another without ever touching anything nonsymbolic. So I want the implicit theory made explicit, and I want it made explicit in both directions.

  First, reconstruct it. What account of meaning does this practice only make sense under? Notice that the practice does not claim the statutory text is self-interpreting in the way a formal system is; it says the text means what a specified population of already-competent readers would have understood it to mean. That is not grounding in the demanding nonsymbolic sense — it looks more like a deliberate parasitism on meanings already in speakers' heads, with the legal system outsourcing grounding to the linguistically competent community and helping itself to the results. Is that the right way to describe it? And is it coherent, or does the outsourcing leave a hole exactly where hard cases live?

  Second, I want you to work with a distinction I have been using and tell me whether it survives. Call *anchoring* the fixation of which thing or which set of items a term picks out — by stipulation, by a definition, by a precedent that settles one concrete application — and call *grounding* the possession of a nonsymbolic capacity to identify further instances on one's own. My sense is that legal practice is very good at anchoring and indifferent to grounding: a definitions section anchors by fiat, and a line of precedents accumulates anchored exemplars. But does a sufficiently dense set of anchored exemplars *converge* on grounding, the way a large enough labeled sample can leave you with a capacity you could not have stated as a rule? Or does exemplar-anchoring merely postpone the question, since each new application still requires someone who can already tell whether the new case is like the old ones? Say which, and say what it would take to tell the difference.

  Third, the part I think is genuinely hard. Many of the terms statutes fight over are not the names of perceptible natural kinds whose grounding is the paradigm case; they are institutional or normative terms, whose content seems to be fixed by their role in a system of rules rather than by anyone's sensorimotor discrimination. If that is right, then the grounding demand may simply misfire for most of legal language, and the practice may be philosophically fine. But institutional terms typically piggyback on ordinary terms that do look grounded — the chestnut about whether a bicycle, or an e-scooter, or a toy car is a "vehicle" under a rule banning vehicles from a park is a dispute of exactly this shape. So: for which statutory terms does the grounding problem genuinely arise, for which is it a pseudo-problem, and is the boundary itself something the practice can mark, or only something we can mark from outside it? I would also like your view on what the absurdity escape hatch is doing: is it an admission that the symbol-to-symbol machinery has run off the end of the community's anchoring, or is it a separate normative principle with nothing to do with meaning?

  Finally, the replacement question. Suppose we dropped the implicit theory and required instead that statutory meaning be answerable to the nonsymbolic, experienced capacities of those who apply it, and not merely borrowed from a readership's prior understanding. Which devices of current practice would then become illegitimate or pointless — definitions sections, dictionaries, fixation of meaning at enactment, textualism itself? What would take their place, and what would we lose? I have a particular worry I want addressed: grounding, on the standard account, is a property of agents with sensorimotor histories, not of texts, and different interpreters are grounded differently. Does taking grounding seriously therefore trade the law's aspiration to a single public meaning for something irreducibly interpreter-relative, and is that a cost the practice could bear?

  Please be disciplined about the difference between what the practice strictly presupposes, what it merely sits well with, and what several rival theories of meaning would license equally — I suspect the practice is more underdetermined than it looks, and I would rather hear that than a tidy reconstruction. Where the symbol grounding literature has nothing to say about a question I have asked, say so rather than stretching it. I don't need citations, bibliographies, or a reading list; I know the standard sources, and I'm interested in the argument.
reasoning: |-
  Okay, this user is diving deep into the philosophical underpinnings of statutory interpretation, especially focusing on the symbol grounding problem. They're clearly well-versed in both legal practice and philosophy of language. The core tension they're wrestling with is how legal meaning can be fixed through textual definitions and community understanding without seeming to solve the symbol grounding problem. 

  First, I need to address their reconstruction request. The practice does look like deliberate parasitism on linguistic communities. Courts aren't trying to solve grounding; they're outsourcing it to competent speakers. This makes sense under an externalist, community-based theory of meaning where meaning is fixed by public use rather than individual mental states. The "intended audience" relativization is key here - it's a pragmatic appeal to a pre-existing web of meanings. 

  The anchoring vs grounding distinction is sharp. Legal practice excels at anchoring through definitions and precedents, but each new application still requires judgment about resemblance. A dense set of exemplars doesn't automatically confer grounding - it just creates a finer-grained anchoring net. The competence to extend anchored meanings remains irreducible and tacit. 

  For institutional terms, grounding might be a category error. Terms like "vehicle" in statutes aren't natural kind terms; their meaning is constituted by their role in the normative system. The absurdity doctrine reveals this - it's not about meaning failure but about normative conflict when textual application violates the system's purpose. 

  If we switched to requiring nonsymbolic grounding, we'd lose textualism's virtues: stability, predictability, and democratic accountability. Definitions sections would become suspect, dictionaries irrelevant, and meaning would fragment across interpreters' subjective capacities. The cost would be abandoning law's public character. 

  The user's worry about interpreter-relativity is spot-on. Grounding is fundamentally private in a way that undermines law's public nature. The current practice accepts this tension but contains it through institutional rules and hierarchy. 

  Throughout this, I should maintain their careful distinctions: what the practice necessarily presupposes (community meaning parasitism), what it accommodates (various theories of reference), and where it's silent (how judges acquire the tacit competence to apply anchored terms). The underdetermination point is crucial - the practice works precisely because it doesn't commit to any single philosophical theory.
answer: |-
  Your dissection is precise, and the philosophical tension you identify is genuine. Let's reconstruct the implicit theory, test your distinctions, and confront the hard cases without overstepping the practice's actual commitments.

  ### 1. Reconstruction: The Implicit Theory of Meaning
  The practice presupposes **conventionalist semantic externalism relativized to a community and frozen in time**. Specifically:
  - **Meaning is public, not private**: It rejects individual mental states in favor of intersubjective conventions ("what competent readers would have understood").
  - **Grounding is outsourced, not solved**: The legal system *parasitizes* on the pre-existing linguistic competence of the community. Courts treat language as a pre-grounded social artifact. The dictionary isn’t grounding meaning; it’s *evidence* of grounding already achieved by the linguistic community through historical practice.
  - **Anchoring without grounding is sufficient**: Legal interpretation assumes that shared conventions (established via usage, definitions, or technical communities) *fix reference* for practical purposes. The "symbol grounding problem" is circumvented by presupposing the community’s linguistic capacities are already functional.
  - **Coherence in practice, hole in hard cases**: This is coherent *if* the community’s grounding is treated as a black box. But the "hole" emerges precisely when community understanding is fractured (e.g., ambiguous terms) or when novel cases strain existing conventions (e.g., "vehicle" for e-scooters). Here, the parasitism fails, and judges must engage in normative extension—masquerading as discovery.

  ### 2. Anchoring vs. Grounding: Does Anchoring Converge on Grounding?
  - **Anchoring ≠ Grounding**: Definitions and precedents *anchor* by stipulating rules or exemplars. Grounding requires a nonsymbolic recognition capacity (e.g., identifying a dog without a definition).
  - **Does dense anchoring yield grounding?** No. A dense network of exemplars (e.g., 100 precedent cases applying "vehicle") provides finer-grained *anchoring*, not grounding. The judge still relies on *her own* capacity to perceive relevant similarities between new cases and anchored exemplars—a tacit skill not reducible to rules.  
  - **The test for divergence**: If a new case triggers persistent disagreement among competent interpreters *despite* clear precedents (e.g., is a holographic will "signed" under a statute requiring "signature"?), anchoring has not conferred grounding. The practice reveals this when courts resort to "purposive interpretation" or the absurdity doctrine, tacitly admitting anchoring’s limits.

  ### 3. The Hard Case: Institutional Terms and the Grounding Demand
  - **Grounding misfires for purely institutional terms**: Terms like "felony" or "trust" are defined by their role in a normative system. Their "grounding" is in legal rules, not sensory experience. Here, the symbol-grounding problem is a pseudo-problem; meaning is fixed by intra-systemic relations.
  - **The boundary problem**: Hybrid terms (e.g., "vehicle," "employee," "dwelling") are battlegrounds. Their *core* may be perceptually grounded (a car is clearly a vehicle), but their *penumbra* (e-scooters, delivery robots) requires normative judgment. The practice *cannot* mark this boundary internally because:
    - It relies on the community’s *prior* grounding for ordinary words (which may not resolve novel artifacts),
    - But novel applications are decided by judicial appeal to statutory purpose or consequences, not perceptual capacities.
  - **The absurdity escape hatch**: This is **not** a failure of meaning. It’s a *normative override* acknowledging that textual meaning (even if clear) can conflict with the legal system’s overarching aims. It admits that meaning is fixed by convention but rejects literalism when it undermines the system’s coherence. It’s a safety valve for when anchoring produces intolerable results.

  ### 4. Replacement: Costs of Prioritizing Nonsymbolic Grounding
  If statutory meaning required direct nonsymbolic grounding in interpreters’ experiences:
  - **Illegitimate devices**:
    - **Definitions sections**: Useless if meaning depends on interpreters’ sensory capacities, not stipulation.
    - **Dictionaries/corpus evidence**: Irrelevant, as they document conventions, not individual grounding.
    - **Fixation at enactment**: Meaning would "drift" with interpreters’ evolving experiences.
    - **Textualism**: Collapses, as the text’s meaning would vary with each interpreter’s grounding.
  - **What replaces it?** Judges would appeal to their own phenomenological competence (e.g., "I know a vehicle when I see it"). This resembles naïve realism or intuitionism.
  - **The core cost**: **Radical interpreter-relativity**. Law’s aspiration to public, predictable meaning is sacrificed. A statute would mean whatever each judge (or officer) nonsymbolically "grasps," destroying:
    - Predictability (no shared standard),
    - Democratic legitimacy (meaning detaches from enacted text),
    - Uniformity (different interpreters, different "groundings").
  - **Could practice bear this?** Only at the cost of becoming unrecognizable. Legal systems prioritize stability and publicity over epistemic purity. Grounding-based interpretation would resemble anarchic private judgment, incompatible with the rule of law.

  ### Underdetermination & Limits
  - **What the practice strictly presupposes**:  
    (1) Meaning is fixed by conventional public use at enactment;  
    (2) This convention can be evidenced by texts (dictionaries, statutes);  
    (3) Judges can access this convention without solving grounding.  
  - **What it accommodates but doesn’t require**:  
    Various theories of reference (e.g., descriptivism, causal-historical). The practice is compatible with multiple philosophical accounts, as long as they accept public convention.  
  - **Where symbolism literature is silent**:  
    The symbol-grounding problem assumes a computational agent learning language de novo. Legal practice deals with *already-socialized agents* applying conventions. The literature says little about how *normative systems* bootstrap meaning from social grounding—a gap your query exposes.

  **Conclusion**: The practice is philosophically stable *as a pragmatic institution*, not as an epistemic theory. It outsources grounding to the community, anchors meaning through texts and precedents, and uses normative overrides (absurdity doctrine) when convention clashes with purpose. Prioritizing nonsymbolic grounding would destroy law’s public character. The tension you identify is real—but it’s a tension the practice manages, not one it solves.
