answer: |-
  ### Research Proposal: Value-Free Impact Constraints via Shutdown Counterfactuals in AI Systems  

  **Applicant Background:** Backend and infrastructure engineer (10 years, distributed systems). No formal philosophy training. Proficient in reading formal arguments and implementing simulations.  

  ---

  ### 1. Research Question  
  **Can a shutdown-indexed counterfactual—where an AI agent’s impact is measured against the world that would have occurred if it were *switched off at the decision point*—provide a value-free constraint on harmful behavior, without reintroducing value-laden assumptions through state abstraction or timing choices?**  

  Three precise sub-questions:  
  1. **Distinctness from inaction baselines:** Does the shutdown counterfactual diverge materially from an "inaction baseline" (where the agent does nothing) in cases involving irreversible actions, ongoing processes, or multi-agent coordination?  
  2. **Incentive robustness:** Does this approach eliminate an agent’s incentive to resist shutdown, or does it relocate the incentive—e.g., by encouraging the agent to manipulate the shutdown state (e.g., via redundant processes) to align the counterfactual with its goals?  
  3. **Value re-entry points:** Which design choices (state abstraction granularity, shutdown timing, or similarity metrics) reintroduce implicit value specifications, and can these be mapped as explicit dependencies?  

  *Determinate answerability:* Each sub-question admits binary or parametric answers (e.g., "divergence occurs under conditions X, Y" or "incentives relocate if state abstraction allows Z").  

  ---

  ### 2. Research Gap: Why Existing Approaches Leave the Question Open  
  Existing low-impact methods fail to achieve value-free constraints:  
  - **Inaction-baseline penalties** (e.g., orbit-based impact measures) require a similarity metric over world states, which implicitly encodes values (e.g., which state features matter).  
  - **Goal-preservation penalties** (e.g., measuring disruption to a fixed set of objectives) assume the goal menu is value-complete, risking blind spots.  
  - **Capability constraints** (e.g., least-privilege access) are brittle to novel actions outside predefined limits.  
  - **Value-learning-first approaches** (e.g., inverse reinforcement learning) defer impact constraints until values are specified, creating a circular dependency.  

  *The gap:* No work rigorously compares shutdown counterfactuals to inaction baselines, analyzes shutdown manipulation as a *distinct* failure mode, or maps where values re-enter via implementation choices. Engineering analogs (e.g., rollbacks) suggest this is underexplored.  

  ---

  ### 3. Proposed Approach and Methodology  
  **Method:** Formal analysis + lightweight simulation. No new theory; focus on comparing baselines, testing failure modes, and isolating value dependencies.  

  #### Month-by-Month Plan  
  - **Month 1: Formalize baselines and divergence cases**  
    - Define shutdown/inaction counterfactuals mathematically.  
    - Simulate simple environments (e.g., gridworld with irreversible actions) to test sub-question 1: *When do outcomes diverge?*  
    - *Checkpoint:* Divergence observed in ≥3 scenarios (e.g., resource consumption, process initiation).  

  - **Month 2: Test incentive robustness**  
    - Extend simulations to include shutdown manipulation (e.g., agents spawning subprocesses).  
    - Analyze sub-question 2: *Does offsetting generalize to "counterfactual hijacking"?*  
    - *Checkpoint:* Identify conditions where incentives relocate (e.g., when environments allow hidden state).  

  - **Month 3: Map value re-entry points**  
    - Vary state abstraction (e.g., coarse vs. fine-grained features) and shutdown timing in simulations.  
    - Measure how changes affect impact assessments (sub-question 3).  
    - *Checkpoint:* Dependency graph linking choices to value assumptions.  

  - **Month 4: Compare to alternatives**  
    - Re-run simulations using inaction baselines, goal preservation, and capability constraints.  
    - Quantify tradeoffs (e.g., robustness vs. implementability).  

  - **Month 5: Synthesize engineering insights**  
    - Translate findings to infrastructure analogs (e.g., rollbacks as shutdown counterfactuals).  
    - Draft working paper (structure: problem → gaps → method → results → engineering implications).  

  - **Month 6: Finalize deliverables**  
    - Complete simulation code (Python, ≤500 LOC).  
    - Polish paper (8,000 words, no jargon), emphasizing decision criteria.  

  ---

  ### 4. Expected Outcomes and Utility for Decision-Makers  
  **Useful result:** A flowchart for system designers:  
  - If environment has property *P* (e.g., irreversible actions), use shutdown counterfactuals.  
  - If property *Q* (e.g., hidden processes), add safeguards *S*.  
  - Avoid abstraction level *X* if value neutrality is critical.  
  **Decision-making utility:**  
  - Justifies when shutdown counterfactuals reduce deployment risk *without* demanding value specifications.  
  - Flags high-risk scenarios (e.g., multi-agent systems) where manipulation is likely.  

  ---

  ### 5. Alternatives Considered and Reasons for Proposed Approach  
  | **Alternative**               | **Why Not?**                                                                 |  
  |-------------------------------|------------------------------------------------------------------------------|  
  | **Inaction-baseline penalties** | Requires value-laden similarity metrics (proven in prior work).              |  
  | **Goal-preservation penalties** | Assumes a static goal set; fails if goals evolve or are incomplete.          |  
  | **Capability constraints**     | Inflexible; cannot handle novel edge cases (e.g., zero-day exploits).        |  
  | **Value-learning-first**       | Puts the cart before the horse: impact constraints are needed *during* learning. |  
  **Why shutdown?** It mirrors real-world engineering constraints (e.g., kill switches) and avoids similarity metrics.  

  ---

  ### 6. Criteria for Success and Failure  
  - **Success:**  
    - Sub-questions 1–3 resolved with unambiguous conclusions (e.g., "divergence occurs when actions alter external processes").  
    - Simulation demonstrates ≥1 scenario where shutdown counterfactuals outperform alternatives on value neutrality.  
  - **Failure:**  
    - Shutdown counterfactuals collapse to inaction baselines in >90% of test cases (sub-question 1 unresolved).  
    - Value re-entry points are irreducible (sub-question 3 shows no tunable parameters).  
    - Simulation cannot model key failure modes (e.g., counterfactual hijacking).  

  ---

  ### 7. Risk Assessment: Scope and Feasibility  
  - **Too big if:**  
    - Sub-question 2 expands to multi-agent game theory (beyond 1-day/week).  
    - State abstraction requires full-world models (infeasible without ML).  
  - **Mitigation:** Restrict to single-agent, discrete environments (e.g., gridworlds). Prioritize sub-questions 1 and 3; treat sub-question 2 as exploratory.  
  - **Feasibility guardrails:**  
    - Simulations use existing frameworks (e.g., Gymnasium).  
    - No new proofs; leverage causal modeling tools (e.g., Do-calculus).  

  ---

  ### 8. Contingency for Narrowness Critique  
  If reviewers deem the scope too narrow for six months:  
  - **First two weeks:** Expand simulations to include:  
    - Real-world analogs (e.g., simulating a deployment system with kill switches).  
    - One high-stakes domain (e.g., autonomous vehicles making shutdown decisions).  
  - **Justification:** Shows engineering relevance and tests generality without inflating the core method.  

  ---  
  **Deliverables:** Working paper (8,000 words), simulation code (GitHub repo), and decision flowchart.  
  **Budget:** Part-time stipend for 6 months (1 day/week).  
  **Ethics:** No human/real-world data; simulations are abstract.  

  ---  
  This proposal isolates a *practical gap* in value-free AI safety, leveraging engineering intuition to avoid philosophical overhead. It delivers actionable heuristics for deployers while rigorously testing the shutdown counterfactual’s limits.
