     Debrief:

          - In the hard update, we learned a fact (the bead is red) and updated by setting the probability of blue to 0.
          - In the soft update, we didn't learn a fact, we only had a nudge. We then chose to update by the proportional shift (Jeffrey conditioning) and that seemed natural.
          - But then we saw that if the nudge came from a specific observation that had different effects within the groups, then our update did not match the update we would have done if we had seen the observation.
          - The reason is that the nudge may also carry information about the substructure, but our update method (Jeffrey) assumes it doesn't.

     What can go wrong:

          - A participant might say: but we were told the evidence was 3 times more likely in A than in B, and that's all we know. So why should we care about the substructure? 
            Response: because when we then want to know about the substructure, our method gives a different answer than if we had known the full observation.

          - A participant might say: the soft evidence update is correct because we didn't observe the test result, we only got a nudge that is equivalent to the likelihood ratio of 3. 
            But then the within-group update should use the prior within-group distribution? 
            However, the point is that the nudge might have been generated in a way that also has bearing on the within-group distribution.

          - The group might split into those who trust the proportional method and those who want to do more. We can then reveal that both are valid in different contexts, but the proportional method makes an assumption.

     Vocabulary for the facilitator after the activity:

          - The soft evidence update we used is called Jeffrey conditioning.
          - The hard update is called Bayesian conditioning.
          - The issue we saw is that Jeffrey conditioning assumes that the soft evidence does not change the within-group conditional probabilities. But if the soft evidence is generated from an observation that would have changed those conditionals, then we need a different update.

     For the request about the name and formula:

          - Name: Jeffrey conditioning (or probability kinematics).
          - Formula: 
               We have a partition {A_i}. 
               We change the probabilities from P_old(A_i) to P_new(A_i) arbitrarily (as long as they sum to 1).
               For any event E, the updated probability is: 
                   P_new(E) = sum_i P_old(E | A_i) * P_new(A_i)

            In our case, we only have two groups: A and B. And we set P_new(A)= k * λ * P_old(A), P_new(B)= k * P_old(B), where k is a normalizing constant and λ is the likelihood ratio.

          - Soft evidence and conditioning on a weighted mixture: 
               In the case where the soft evidence is presented as a likelihood ratio for a specific observation, it is equivalent to conditioning on the observation if we had seen it. But here, we are not conditioning on the observation because we didn't see it. We are only given a shift in belief that is quantified by the likelihood ratio. 

            However, there is a school of thought that says: if the soft evidence is generated by an observation that you could have made, then you should condition on that observation. But if you only know the resulting shift in belief, then Jeffrey conditioning is appropriate.

          - But our activity showed that if the observation would have given more information (about the substructure), then Jeffrey conditioning doesn't match.

