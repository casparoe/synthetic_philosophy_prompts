  We are going to design an activity that meets the specifications. The core idea is to have two phases: 
   1. A comfortable case of conditioning on a revealed fact (a hard update).
   2. A difficult case with a "nudge" (soft evidence) that shifts confidence without revealing a fact.

   We will then show:
     (a) The natural repair (Jeffrey conditioning) fails in some cases because the nudge may also change the internal structure of a case.
     (b) Order matters when applying two nudges in sequence.

   We'll use physical props: index cards, beans (as counters), and a bag of colored beads (for drawing).

   Scenario: We'll create a simple scenario with two exclusive cases (call them A and B) that each have two subcases (say A1, A2 and B1, B2). 
   We want the soft evidence to sometimes give information that affects the relative likelihood of the subcases.

   However, note: the participant should not be told about the subcases at the beginning. They start by only considering A and B.

   Let me outline the setup:

   Phase 1: Hard update
     - We have a bag with beads of two colors, say Red and Blue. The bag has a known proportion: 2 Red, 1 Blue (so P(Red)=2/3, P(Blue)=1/3).
     - We draw a bead and reveal it to everyone. Participants update their belief (from prior 2/3 and 1/3) to 1 for the color drawn and 0 for the other.
     - We note that updating is straightforward.

   Phase 2: Soft update (nudge)
     - Now we introduce a new scenario. We have two cases: A and B. We tell the participants that the world is either in state A or state B.
     - We give prior probabilities: say P(A)=0.6, P(B)=0.4. We represent this with 6 beans on A and 4 on B on an index card.

     - We then give a nudge: we say that we have an instrument that is somewhat reliable. When the state is A, the instrument gives a positive reading 80% of the time and negative 20%. When the state is B, it gives a positive reading 30% of the time and negative 70%. 
     - But note: we don't reveal the reading! We only say that the instrument was used and it produced a reading that we are not told. However, we are told that the reading was positive. But wait, that would be a hard update? 

   We need to simulate a nudge without revealing a specific outcome. Instead, we can say: "We have received some evidence that makes us more confident of A. Specifically, the evidence we received is such that it would be produced 80% of the time in A and 30% of the time in B. But we didn't learn that the evidence occurred, we only had an experience that shifted our confidence in a way that is consistent with having observed that evidence."

   But this is abstract. Alternatively, we can use an analogy: 

     "Suppose you are outside and you see a flash of light. You are not sure what it was. It might have been lightning (A) or it might have been a camera flash (B). You know that lightning is more common on a day like today (so prior P(A)=0.6, P(B)=0.4). Now, you see a flash. You don't know for sure what it was, but it makes you more confident that it was lightning. Specifically, you know that if it were lightning, you would see such a flash 100% of the time (but that's too certain). Let's adjust: 

     Actually, let's have:
        In state A (lightning), the flash is bright 80% of the time and dim 20%.
        In state B (camera), the flash is bright 70% of the time and dim 30%.

     But we don't tell them whether the flash was bright or dim. We only tell them: "You saw a flash and it made you more confident of lightning. How much? Well, if we had observed that the flash was bright, then we would update to:

          P(A|bright) = P(bright|A)*P(A) / [P(bright|A)*P(A) + P(bright|B)*P(B)]
                     = (0.8 * 0.6) / (0.8*0.6 + 0.7*0.4) = 0.48 / (0.48+0.28) = 0.48/0.76 ≈ 0.6316

     But we didn't see that it was bright. We only had an experience that shifted our confidence toward A. So we might use the rule: we shift the odds in favor of A by the ratio of the likelihoods? But note: we don't know what the experience was (bright or dim). 

     This is getting messy.

   Another approach: We tell the participants that we have an instrument that gives a reading, but we only get a "leak" about the reading: we are told that the reading was positive and that positive readings are more common in A (80%) than in B (30%). But then we are effectively doing a hard update on "positive". We don't want that.

   We want a nudge that doesn't tell us what the reading was, but we are told that the nudge should shift our confidence in a particular way. 

   How about: We are told that the evidence we received is of a type that is 3 times more likely to occur if A is true than if B is true. Then we can update by:

          P(A) after = [3 * P(A) before] / [3 * P(A) before + P(B) before]

     This is the standard odds form for soft evidence (Jeffrey conditioning). But note: this is equivalent to conditioning on a weighted mixture? 

     Let me denote:
          New P(A) = λ * P(A) / [λ * P(A) + P(B)]

     where λ is the likelihood ratio for A vs B.

     So if we set λ=3, then:

