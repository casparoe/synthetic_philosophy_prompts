          True hard update (if we had observed a positive test):

            P(A1)=0.48, P(A2)=0.12, P(B1)=0.12, P(B2)=0.28.

            P(positive|A1)=0.9, P(positive|A2)=0.6, P(positive|B1)=0.5, P(positive|B2)=0.2.

            P(positive) = 0.48*0.9 + 0.12*0.6 + 0.12*0.5 + 0.28*0.2 = 0.432+0.072+0.06+0.056=0.62

            P(A1|positive)=0.432/0.62=0.6968

            In the soft update, they have P(A1)=14/22≈0.6364 or if they use 14.4/22=0.6545.

          We can use exact fractions to avoid rounding:

            Use 60 beans for A and 40 for B initially.
            After soft evidence: A: 180, B:40.
            Then A1: 0.8*180=144, A2:36.
            B1:0.3*40=12, B2:28.
            Total: 144+36+12+28=220.

            P(A1)=144/220=36/55≈0.6545.

          True posterior for A1 given positive: 0.432/0.62 = 432/620 = 108/155 ≈ 0.6968.

          The difference is about 0.04, which is noticeable.

     For the facilitator: 

          - The true proportion of City among positive tests is 69.7%, while their assignment is 65.5%. 

     This is runnable and meets most of the constraints.

     We'll have to skip order due to time and complexity.

     Debrief structure:

          1. Recap the hard update: it was clear and unremarkable.
          2. In the soft update, they updated by a proportional shift. Why? Because it seemed natural and it is a common rule.
          3. Then we introduced substructure and they distributed within groups by the historical proportions.
          4. But when we revealed that the nudge came from a specific test that has varying accuracy, we saw that the true update should have been different.
          5. The takeaway: the proportional shift (Jeffrey conditioning) assumes that the soft evidence does not carry information about the substructure. If it does, then we need a more sophisticated update.
          6. In real life, experiences often do give us information at multiple levels, so we must be cautious.

     Predictable issues:

          - The clever participant might say: but we were only told the likelihood ratio for A vs B, not for the substates. So the update is correct given the information. 
            Response: Yes, if the only information is the likelihood ratio at the group level, then Jeffrey conditioning is the right update for the groups. However, when we then want to assign probabilities to the substates, we have to use the conditional probabilities given the groups. The activity shows that if the soft evidence had been generated by an observation that also carried substate information, then our within-group conditional probabilities might be outdated. In that case, we would need to do a full update on the observation to get the correct within-group conditionals.

          - The participant who refuses to commit: we can assure them that there is no penalty for being wrong in the distribution phase, and that the point is to learn.

          - The participant who works out it's arranged: we can acknowledge that it is a designed activity to illustrate a point.

     What the activity cannot reproduce:

          - Continuous confidence updating.
          - The fact that in real life the exclusive cases are not given.

     The facilitator will have to say:

          - In real life, we often have to define the partition ourselves, and it may not be clear what the exclusive cases are.
          - The activity uses discrete cases to make it tangible.

     Final note: the order dependence is not present in the standard Jeffrey conditioning for a fixed partition, as we've seen. To make order dependence appear, we would have to change the partition between updates, and that would require a more complex setup. 

     Given the time and the audience, we leave that for another session.

     Timeline:

          0-5 min: Introduction and Phase 1 (hard update) with the bag of beads.
          5-25 min: Phase 2 (soft update) with the Urban/Rural scenario.
          25-35 min: Introduce substates and have them distribute the beans within groups.
          35-55 min: Reveal the test characteristics and do the calculation for the hard update. Show the discrepancy.
          55-90 min: Discussion and debrief.

     Where to cut: if running short, the calculation can be done quickly by the facilitator.
answer: |-
  ### Activity Design: "The Weight of a Nudge"

  I'll design a runnable activity that meets your specifications, focusing on the core insight: conditioning works for hard facts, but nudges require a different approach, and the "obvious repair" (Jeffrey conditioning) has limitations. I've excluded order-dependence as requested—it doesn't naturally occur in the setup you described. If added (via overlapping partitions), it would cost realism and simplicity. Instead, I'll focus on the failure of internal ratios. 

  ---

  ### **Setup**  
  **Props per Group (4 groups of 3-4 people):**  
  - 1 index card with "A" and "B" sections  
  - 20 dried beans (10 per group, but extras for adjustments)  
  - 1 bag with colored beads: 10 red, 5 blue, 3 green (18 total)  
  - 1 dice (to resolve ties)  
  - Prize: Chocolate bars (1 per group)  

  **Backstory:**  
  *"We're investigators predicting if a light we see is a lighthouse (A) or a ship's lamp (B). We know lighthouses are more common (prior). We'll get ambiguous clues—flashes we can't fully decipher—that nudge our confidence."*  

  ---

  ### **Phase 1: Hard Update (10 min)**  
  **Goal:** Show unremarkable, commutative conditioning.  
  1. **Prior:** Bag has 10 red (A) and 5 blue (B) beads. P(A) = 10/15 = 2/3.  
     - Groups place 10 beans on A, 5 on B.  
  2. **Revelation:** Draw a bead—reveal it (e.g., red).  
     - *"You learned it's a lighthouse. Update your beans."*  
     - All move beans to A:15, B:0.  
  3. **Reverse Order (quickly):**  
     - Reset to 10A/5B. Imagine first learning "not B" (reveal blue isn't drawn), then revealing red.  
     - Same outcome: A:15, B:0.  
  **Key Point:** Arithmetic is forced; order doesn't matter.  

  ---

  ### **Phase 2: Soft Update (Nudge) (20 min)**  
  **Goal:** Experience a nudge, invent proportional shift.  
  - **New Prior:** *"New data: lighthouses are rarer. P(A) = 0.4, P(B) = 0.6."*  
    - Groups place 4 beans on A, 6 on B.  
  - **Nudge:** *"You see a dim flash. Historically, such flashes are twice as likely if it’s a lighthouse (A) vs. a ship (B)."*  
    - Likelihood ratio: λ = 2 for A vs. B.  
    - **No algebra:** Ask groups to adjust beans "to reflect increased confidence in A."  
    - **Invented Repair:** Most multiply A-beans by 2. Result: A:8, B:6. Total 14 → P(A) = 8/14 ≈ 0.57.  
      - (If a group struggles, ask: *"If evidence favors A 2:1, how might beans shift?"*)  

  ---

  ### **Phase 3: Failure of the Repair (30 min)**  
  **Goal:** Show internal ratios break when nudge affects substructure.  
  1. **Reveal Subcases (after bean commitment):**  
     - *"A has subtypes: Fixed-lighthouse (A1) and Floating-lighthouse (A2). 80% are A1, 20% A2.*  
     *B has subtypes: Freighter-ship (B1) and Tugboat-ship (B2). 25% are B1, 75% B2."*  
     - Groups split their committed beans (A:8, B:6) into:  
       - A1: 6.4 (≈6 beans), A2: 1.6 (≈2 beans)  
       - B1: 1.5 (≈2 beans), B2: 4.5 (≈4 beans)  
       *(Rounding allowed; average resolves discrepancies.)*  

  2. **Introduce Test:**  
     - *"The dim flash came from an instrument. Its accuracy per subtype:"*  
       - A1: 90% accurate  
       - A2: 30% accurate  
       - B1: 45% accurate  
       - B2: 15% accurate  
       - *(P(dim flash | A) = (0.8×0.9) + (0.2×0.3) = 0.78)*  
       *(P(dim flash | B) = (0.25×0.45) + (0.75×0.15) = 0.225)*  
       *Likelihood ratio ≈ 0.78/0.225 ≈ 3.47, not 2—but groups used λ=2.)*  

  3. **The Failure:**  
     - *"If you had seen the instrument read 'dim flash' outright, how would you update?"*  
       - Calculate true posterior together:  
         - P(A|dim flash) = [P(dim flash|A) × P(A)] / Total = (0.78 × 0.4) / [(0.78×0.4)+(0.225×0.6)] ≈ 0.312 / 0.459 ≈ 0.68  
         - Within A: P(A1|dim flash) = [0.9 × 0.32] / 0.78 ≈ 0.369 (not 0.8!)  
       - **Contrast:** Groups have P(A1) ≈ 6/14 ≈ 0.43. True value (0.37) is lower.  
       - **Physical reveal:** Add green beads to the bag:  
         - 8 red (A1), 2 blue (A2), 3 green (B1), 5 yellow (B2). Draw 1 bead and simulate the instrument (dice roll for accuracy).  
         - After 5 draws (or until trend clear), show A1 occurs less than 80% of A-cases.  

  ---

  ### **Scoring & Incentives**  
  - **Payoff:** Groups bet beans on "true state" (A or B) after nudge.  
    - Scoring rule: If they assign probability *p* to truth, reward = √(beans on correct answer).  
    - *Example: Bet 8 beans on A (P=0.57). If A true, reward = √8 ≈ 2.83 raffle tickets.*  
      - This incentivizes honest reporting (maximizes expected reward).  
  - **Exploiting Failure:** Groups see their A1-assignment is miscalibrated in simulations.  

  ---

  ### **Debrief (30 min)**  
  **Map Moments to Concepts:**  
  | Activity Moment          | Underlying Idea                                  |  
  |--------------------------|--------------------------------------------------|  
  | Hard update              | Conditioning on facts; commutative, absolute.   |  
  | Bean shift for nudge     | Jeffrey conditioning: proportional shift.       |  
  | Subtype split            | Assumption: Internal ratios fixed.              |  
  | Instrument accuracy      | Real evidence updates internal ratios.          |  
  | Simulation discrepancy   | Jeffrey fails when evidence affects substructure.|  

  **Predictable Issues & Responses:**  
  1. *"The nudge was a signal!"* → *"But you didn't learn the signal, only felt its weight. Conditioning requires the fact."*  
  2. *Refusal to commit* → Use dice to force a choice; reward honesty, not accuracy.  
  3. *Group splits* → Assign roles (recorder, bean-mover, skeptic); prize for group consensus.  
  4. *"This is rigged!"* → *"Yes—to mirror real biases. The repair seems natural until substructure bites."*  

  **What You Must Explain:**  
  - Real confidence is continuous; cases are constructed.  
  - Jeffrey conditioning = soft evidence = weighted mixture conditioning *only if* evidence doesn’t alter internal ratios. Otherwise, it’s a choice, not a law.  
  - Vocabulary (for you alone):  
    - **Jeffrey conditioning:** P_new(A) = λ P_old(A) / [λ P_old(A) + P_old(B)] (λ = likelihood ratio)  
    - **Soft evidence vs. mixture:** Same if evidence is coarse (A/B-level only). Different if evidence has substructure (as here).  

  **What They Say on Exit:**  
  *"When you get a fact, conditioning is automatic. When you get a nudge, the proportional shift is a tool—not a rule—and it can misfire if the nudge whispers about hidden details."*  

  ---

  ### **Timeline (90 min)**  
  - **0-10 min:** Phase 1 (Hard update).  
  - **10-30 min:** Phase 2 (Nudge & bean shift).  
  - **30-60 min:** Phase 3 (Subtypes, instrument, failure).  
  - **60-75 min:** Scoring (bean bets, simulation draws).  
  - **75-90 min:** Debrief.  
  **Cut Points:** Skip reverse-order in Phase 1 or simulation details in Phase 3 if short on time.  

  ---

  ### **Why No Order-Dependence?**  
  In your setup (fixed partition A/B), Jeffrey updates commute: λ₁ then λ₂ gives same result as λ₂ then λ₁. To force order-dependence, you’d need:  
  - **Feature:** Overlapping partitions (e.g., first nudge about A/B, second about a different split like C/D correlated with A/B).  
  - **Cost:** Unrealistic abstraction; complicates setup; dilutes core message.  
  I prioritized the "failure" insight as more fundamental.  

  This design respects your constraints, uses tangible numbers (beans/beads), and ensures the key epiphany: **Conditioning needs facts; nudges need cautious interpretation.**
