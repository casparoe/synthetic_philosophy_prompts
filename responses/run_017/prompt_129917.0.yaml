prompt: |-
  I teach a final-year seminar on formal epistemology, and I am drafting this year's final. A large share of my students arrive having spent years reading rationalist blogs and forum comment threads, and they bring a habit with them that I want the exam to break: they treat *Dutch book* as a conversation-stopper. Someone's credences look strange and the verdict comes down that they are not a coherent probability distribution, therefore Dutch-bookable, therefore irrational — as if the word itself carried the normative weight, and as if the absence of an actual bookie with a satchel were an empirical accident rather than part of the design of the argument.

  I want one question, in three parts, that forces students to cash the argument out rather than invoke it.

  Constraints: closed book, ninety minutes, twenty-five marks, pitched at final-year undergraduates and MA students. Nothing in it may require library or web access: the paper should supply every definition the student needs, and I want the question itself to say that no marks are awarded for naming authors, papers, or theorems, and that a student can take full marks without them. The mathematics available is elementary — finite sets of worlds, real-valued credences, expectation, dominance.

  I have been playing with a device I would like the question built around, though you may improve on it. Call it the posted-quote bookie. The bookie never learns the agent's credences. Instead the agent is asked to post, for any proposition the bookie names, a number: the price at which she is willing to take either side of a unit bet on that proposition. The bookie then chooses the side and the stake, subject to a fixed cap on the stake, and may repeat this for further propositions, choosing them in light of the quotes already given. The agent is free to decline to quote at all, or to quote something other than her real fair price. Please work out what this mechanism does to the argument: which of the usual idealizations it removes, which it leaves untouched, what exactly it shows when the posted prices are incoherent, what happens when the agent quotes strategically rather than honestly, and whether the argument now constrains the agent's credences or only her quotable, actionable dispositions. I also want the small-stakes cap to be load-bearing rather than decorative.

  I would like three things from you.

  First, the question itself, written out as it would appear on the paper, with any stipulations and definitions, and with a short paragraph setting up the dialectical situation so that a student cannot answer it by restating the definition of a probability measure. The crux should be whether and how the move from exploitability to irrationality is supposed to go, and what is left of the argument once you notice that the losing package is one the agent could simply decline.

  Second, a model answer of about a thousand to twelve hundred words. It should commit to verdicts rather than surveying positions: I will penalise a model answer that merely lists what various people have said about the gap between pragmatic and epistemic arguments.

  Third, a marking scheme. Marks per part, totalling twenty-five, with the part built on the posted-quote bookie worth the most. For each part, name the specific moves that earn the marks, and give one line on how students typically go wrong on each. Then give band descriptors that separate an A from a B from a C by what the answer does and does not contain: a C answer should be attainable by someone who has read the Sequences and absorbed that incoherence means a guaranteed loss, while an A answer should require seeing why that gloss is not yet a normative claim.
reasoning: |-
  We are designing an exam question to challenge students' overreliance on Dutch book arguments as conversation-stoppers. The goal is to force them to engage with the underlying mechanics and normative assumptions. The device we'll use is the "posted-quote bookie".

  ### The Setup: Posted-Quote Bookie
  - The bookie does not know the agent's credences. 
  - The agent is asked to post, for any proposition the bookie names, a number (the price at which she is willing to take either side of a unit bet). 
  - The bookie then chooses the side and the stake (with a fixed cap on the stake) and can repeat for further propositions, adapting to previous quotes.
  - The agent can decline to quote or quote strategically (not necessarily her true credence).

  ### Key Points to Address
  1. **Idealizations Removed**: 
     - The bookie doesn't know the agent's credences in advance (removes the idealization of a bookie with perfect information).
     - The agent can choose not to be honest (so we are testing her quotable, actionable dispositions, not necessarily her beliefs).
     - The stakes are capped (so the loss is bounded, not arbitrarily large).
  2. **What the Argument Shows When Prices are Incoherent**:
     - Even if the agent posts incoherent prices, the bookie can exploit her only if she has committed to those prices and the bookie can design a series of bets that together guarantee a loss. However, the agent can decline to bet at any time? (But the setup says the agent is asked to post for any proposition the bookie names. The agent is free to decline to quote? Then the bookie cannot force a bet. So the argument must be about the agent's willingness to post quotes that are exploitable. The normative force then applies only if the agent is willing to post such quotes.)
  3. **Strategic Quoting**:
     - If the agent quotes strategically, she might avoid being exploited, but then the Dutch book argument doesn't directly constrain her credences, only her quotes. So the argument might not show that having incoherent credences is irrational, but that posting incoherent quotes is irrational (if one wants to avoid sure loss).
  4. **The Role of the Stake Cap**:
     - The cap ensures that the loss is bounded. This weakens the practical force of the argument because the loss might be small. Also, it might allow the agent to post quotes that are slightly incoherent but the loss is within a tolerance she is willing to accept.

  ### The Question Structure (Three Parts)
  We want three parts that build on each other.

  **Part 1 (5 marks):** Explain how the standard Dutch book argument works and what it is supposed to show. Then, explain how the posted-quote bookie differs from the standard setup. Focus on the idealizations that are removed.

  **Part 2 (15 marks):** Analyze the posted-quote bookie scenario. What does it show when the agent's posted prices are incoherent (i.e., do not form a probability measure)? In particular, consider:
     - How the bookie can exploit the agent (if at all) given the cap on stakes and the sequential nature of the interaction.
     - What happens if the agent can decline to quote? (But the problem states the agent is free to decline to quote at all, or to quote dishonestly.) So, the agent can avoid exploitation by not posting, but if she does post, she might be exploited. So the argument becomes: if you are willing to post quotes, then you must post coherent ones to avoid sure loss. But note: the bookie can choose the propositions and the order, and the agent must post for any proposition the bookie names? Or can she decline per proposition? The problem says: "the agent is asked to post, for any proposition the bookie names, a number". And she is free to decline to quote at all? Or per proposition? We must clarify.

  Let's clarify the rules as stated in the exam question:
  - The agent is free to decline to quote at all, or to quote something other than her real fair price. This suggests that when the bookie names a proposition, the agent can either decline to give a quote or give a number (which may be strategic). So the bookie cannot force a quote.

  Therefore, the agent can avoid exploitation by declining to quote when she suspects the bookie is setting up a Dutch book. This breaks the inevitability of the loss.

  **Part 3 (5 marks):** Discuss the normative implications. Does the posted-quote bookie argument show that having incoherent credences is irrational? Or does it show that one should not post incoherent quotes? What is the connection between the two? How does the stake cap affect the normative force?

  ### Total: 5 + 15 + 5 = 25 marks.

  ### The Question as Worded

  ---

  **Question 1 (25 marks total)**

  *Background:* The Dutch book argument (DBA) is often invoked to show that an agent's credences must satisfy the axioms of probability to be rational. The standard version imagines a bookie who knows the agent's credences and offers a set of bets that the agent, by her own lights, finds fair or favorable, but which together guarantee her a loss (a "Dutch book"). The agent's susceptibility to such a book is taken to demonstrate irrationality.

  *Setup:* Consider a modified scenario, the "posted-quote bookie". In this scenario:
  - The bookie does not know the agent's credences in advance.
  - The bookie names a proposition and asks the agent to post a number, which is to be interpreted as the price at which the agent is willing to take either side of a unit bet on that proposition. (A unit bet on a proposition $A$ pays £1 if $A$ is true, £0 otherwise. The agent is willing to buy the bet at the posted price $p$ or sell it at $p$: if she buys, she pays $p$ and receives the bet; if she sells, she receives $p$ and pays out the bet's outcome.)
  - The agent is free to decline to post a quote for any proposition. If she does post a quote, she may post any real number (not necessarily her true fair price).
  - After the agent posts a quote for a proposition, the bookie may choose to take either side (buy or sell) and choose a stake $s$ (a real number) with $|s| \leq M$ for a fixed positive constant $M$ (the stake cap). The bookie then pays the agent $s \cdot p$ if buying, or receives $s \cdot p$ if selling; and when the truth value is revealed, the agent receives $s \cdot \text{payoff}$ if she bought, or pays $s \cdot \text{payoff}$ if she sold. (Note: The stake $s$ can be positive or negative, but the cap is on the absolute value. This allows the bookie to scale the bet and also to take either side by choosing the sign. However, for simplicity, we can think of the bookie as choosing a positive stake and then choosing to buy or sell. Alternatively, the cap $|s| \leq M$ and the bookie chooses $s$ which may be negative. We can explain that a negative stake reverses the roles. But to avoid confusion, let's say: the bookie chooses a stake $s$ with $0 < |s| \leq M$ and a side. However, the problem says the bookie chooses the side and the stake. We can formalize by having the bookie choose a real number $s$ (the stake) with $|s| \leq M$, and then:
     - If the bookie chooses to buy: the agent pays $s \cdot p$ and receives $s$ if $A$ is true, 0 otherwise.
     - If the bookie chooses to sell: the agent receives $s \cdot p$ and pays $s$ if $A$ is true, 0 otherwise.

  Alternatively, we can unify by letting the bookie choose a real number $s$ (the stake) and then:
     - The agent's net payoff for a bet on $A$ at quote $p$ and stake $s$ is: $s \cdot (I_A - p)$, where $I_A$ is the indicator of $A$. (If $s>0$, the agent is buying the bet: she pays $p$ and gets $I_A$, so net $I_A - p$ per unit, scaled by $s$. If $s<0$, then it is equivalent to selling: for $s=-t$ (t>0), then the net is $-t*(I_A - p) = t*(p - I_A)$ which is selling at $p$.)

  So we can define: for a bet at quote $p$ and stake $s$, the agent's net gain is $s \cdot (I_A - p)$.

  - The bookie may repeat this process: name a new proposition (which may depend on previous quotes and bets), and the agent again may decline or post a quote, and then the bookie chooses a stake (with $|s| \leq M$) and side (by choosing the sign of $s$).

  The agent's total loss is the sum of the net gains for the bookie (which is the negative of the agent's net gain). The bookie's goal is to make the agent's total net gain negative (i.e., a loss) regardless of the state of the world.

  **Part 1 (5 marks):** 
  Explain the standard Dutch book argument. What are the key idealizations? How does the posted-quote bookie differ? In particular, discuss the assumptions about the bookie's knowledge, the agent's ability to decline or misrepresent, and the presence of a stake cap.

  **Part 2 (15 marks):** 
  Suppose an agent posts quotes for a set of propositions that are not coherent (i.e., there is no probability measure that assigns those propositions their quoted prices as fair betting prices). 
  a. Can the bookie always exploit the agent (i.e., guarantee a positive profit for the bookie, or equivalently, a loss for the agent) in a single round of betting? Why or why not? 
  b. Can the bookie exploit the agent over multiple rounds? Explain the process, including how the bookie might choose subsequent propositions and stakes. 
  c. What role does the stake cap $M$ play? In particular, if the stake cap were removed ($M \to \infty$), how would that change the bookie's ability to exploit? 
  d. How does the agent's ability to decline to quote affect the argument? 

  **Part 3 (5 marks):** 
  Discuss the normative implications of the posted-quote bookie scenario. 
  a. Does the possibility of exploitation in this scenario show that having incoherent credences is irrational? Why or why not? 
  b. What does the scenario show about the agent's quotable prices? 
  c. How does the stake cap affect the normative force of the argument? 

  *Note:* No marks will be awarded for naming authors, papers, or theorems. Full marks can be achieved without them. 

  ---

  ### Model Answer (1000-1200 words)

  **Part 1: Standard Dutch Book Argument and Idealizations**

  The standard Dutch book argument (DBA) aims to show that rationality requires an agent's credences to satisfy the axioms of probability. It does so by demonstrating that if an agent's credences violate the probability axioms, then there exists a set of bets, each of which the agent considers fair or favorable (given her credences), but which together guarantee her a loss in every possible state (a Dutch book). The key steps are:

  1. **Fair betting prices**: An agent with credence $c(A)$ in proposition $A$ is assumed to consider a bet on $A$ at price $p = c(A)$ as fair. Thus, she would accept any bet that she considers at least fair: buying the bet for $p \leq c(A)$ or selling for $p \geq c(A)$.

  2. **Exploitability**: If the credences are incoherent (not a probability measure), a clever bookie can propose a set of bets that the agent accepts (because each bet is fair or favorable by her credences) but that collectively guarantee a loss.

  3. **Normative conclusion**: The agent is irrational because she is susceptible to a guaranteed loss.

  The standard DBA relies on several idealizations:
  - **Bookie's omniscience**: The bookie knows the agent's credences exactly.
  - **Agent's passivity and honesty**: The agent accepts every bet that is fair or favorable by her credences and does not change her credences during the process. She does not decline bets or misrepresent her credences.
  - **Unlimited stakes**: There are no limits on the stakes, so the bookie can make the loss arbitrarily large.

  In the posted-quote bookie scenario, these idealizations are modified:
  - The bookie does not know the agent's credences in advance. Instead, the agent must post a price for each proposition the bookie names.
  - The agent can decline to post a quote for any proposition and can post strategically (i.e., not her true credence). Thus, she is not passive and may avoid revealing her true assessment.
  - There is a cap $M$ on the absolute value of the stakes, so the bookie cannot make arbitrarily large bets.

  These changes make the scenario more realistic but also complicate the argument.

  **Part 2: Analysis of the Posted-Quote Bookie**

  a. **Single round**: The bookie cannot necessarily exploit the agent in a single round. If the agent posts a quote $p$ for a proposition $A$, the bookie can choose a stake $s$ (with $|s| \leq M$) and take a position that benefits the bookie if $p$ is not the true fair price (by the agent's own credence). However, without knowing the agent's credences, the bookie doesn't know if $p$ is too high or too low. For instance, if the bookie buys the bet (stake $s>0$), the agent's net gain is $s(I_A - p)$. The bookie profits if $I_A - p < 0$, i.e., if $p$ is too high (above the true indicator). But if the agent's true credence is $c(A)$, then she would only consider buying fair at $c(A)$ and selling fair at $c(A)$. If she posts a quote $p$ that is too high, then the bookie can sell to her (which would be: the bookie sells, so the agent buys, so the bookie's gain is $s(p - I_A)$). Alternatively, if $p$ is too low, the bookie can buy (agent sells, bookie buys, bookie's gain is $s(I_A - p)$). But the bookie doesn't know if $p$ is too high or too low relative to the agent's true credence. Without that knowledge, the bookie cannot be sure of making a profit in a single round. However, if the bookie had prior knowledge of the agent's credences, he could exploit a single misquote. But in this setup, the bookie does not have that information. So in a single round, the bookie might not be able to exploit.

  b. **Multiple rounds**: The bookie can potentially exploit incoherent quotes over multiple rounds. Suppose the agent posts quotes for a set of propositions that are incoherent (i.e., there is no probability measure that assigns those propositions the quoted values as fair prices). Then, by the standard DBA, there exists a set of bets at those quotes that together guarantee a loss. But the bookie does not know the agent's quotes for all propositions in advance. However, the bookie can proceed sequentially:

     - The bookie names one proposition, say $A$, and the agent posts $p_A$. 
     - Then the bookie names another proposition, say $B$, and the agent posts $p_B$.
     - And so on, until the bookie has quotes for a set of propositions that are jointly incoherent.

     But note: the agent may decline to quote at any step. To avoid exploitation, the agent might decline to quote when the bookie's sequence of propositions could lead to a Dutch book. However, the bookie can choose the next proposition based on previous quotes. For example, if the agent has already quoted $p_A$ and $p_B$, the bookie might then name $(A \cup B)$ to see if $p_{A \cup B}$ is set appropriately. If the agent posts a quote that makes the set incoherent, the bookie can then place bets on all the quoted propositions with stakes chosen as in the standard Dutch book (but scaled to meet the cap).

     However, the bookie must commit to the stakes after each quote, before the next proposition is named. So the bookie might not get the entire Dutch book at once. He can, however, place bets as he goes. But note: the Dutch book is a set of bets that together guarantee a loss. The bookie can place each bet immediately after getting the quote. Then, at the end, the entire set of bets will be in place and the agent will face a guaranteed loss (provided the agent quoted for all the necessary propositions).

     But the agent might decline to quote on a critical proposition. Therefore, the bookie cannot force the agent to complete the Dutch book. The agent can avoid the Dutch book by declining to quote on a proposition that would complete the incoherent set.

     Moreover, if the agent quotes strategically, she might post quotes that are coherent even if her true credences are not, to avoid exploitation.

     However, if the agent is willing to quote for all propositions the bookie names, and if the bookie can name a finite set that is incoherent and then bet on them, then the bookie can guarantee a loss. But the bookie doesn't know which set of propositions might be incoherent? He has to probe. This is a cat-and-mouse game.

  c. **Role of the stake cap**: The stake cap $M$ limits the maximum loss the agent can incur from any single bet. In the standard DBA without a cap, the bookie can make the loss arbitrarily large. Here, the loss from the Dutch book is bounded by the cap times the number of bets. If the Dutch book requires $k$ bets, the maximum loss is bounded by $k \cdot M$. This is significant because the agent might be willing to risk a bounded loss. Also, if the cap is small, the loss might be negligible. The cap also constrains the bookie's ability to exploit small incoherencies: if the incoherence is minor, the loss might be very small even without the cap, but with the cap, the bookie cannot amplify it arbitrarily. Without the cap ($M \to \infty$), the bookie could make the loss arbitrarily large, which might be taken to show that even a small incoherence is disastrous. But with the cap, the loss is bounded.

  d. **Agent's ability to decline**: The agent can avoid exploitation by declining to quote on a proposition that the bookie names. This breaks the inevitability of the Dutch book. Therefore, the argument only shows that if the agent is willing to post quotes for an incoherent set of propositions, then she is vulnerable to a Dutch book (with bounded loss). But she can avoid this by being selective in her quotes.

  **Part 3: Normative Implications**

  a. **Does it show incoherent credences are irrational?** Not directly. The argument now targets the agent's quotable prices, not her credences. Even if her credences are incoherent, she can avoid exploitation by strategically quoting coherent prices or by declining to quote. Therefore, the argument does not demonstrate that incoherent credences per se are irrational. Instead, it shows that posting incoherent quotes is risky: if the bookie can get you to post an incoherent set, then you are vulnerable. But the agent can avoid this by careful quoting.

  b. **What does it show about quotable prices?** The argument suggests that to avoid vulnerability to a Dutch book (even with bounded loss), an agent should post quotes that are coherent. That is, she should be willing to stand behind a set of quotes that form a probability measure. But note: she might post coherent quotes even if her true credences are incoherent, to avoid exploitation. The normative force applies to her public commitments (the quotes she is willing to post), not directly to her private beliefs.

  c. **Effect of the stake cap**: The cap reduces the normative force. A bounded loss might be acceptable to the agent. For instance, if the cap is small, the agent might be willing to risk the maximum loss for the convenience of not having to compute coherent quotes. This is especially true if the probability of the bookie actually exploiting her is low (because the bookie might not find the incoherence). Therefore, the argument with a stake cap only shows that incoherent quotes expose the agent to a bounded loss. It does not establish that incoherence is catastrophic, as the standard argument without a cap does.

  **Conclusion**: The posted-quote bookie scenario reveals that the Dutch book argument is not primarily about the agent's internal credences but about her betting dispositions. The normative force of the argument depends on the agent's willingness to post quotes and the stakes involved. The argument does not directly show that incoherent credences are irrational, but it does show that publicly committing to incoherent quotes is imprudent if one wishes to avoid even a bounded sure loss.

  ---

  ### Marking Scheme

  **Total: 25 marks**

  **Part 1 (5 marks):**
  - (2 marks) Clear explanation of the standard Dutch book argument (steps: fair prices, exploitability, normative conclusion).
  - (2 marks) Identification of key idealizations in the standard argument: bookie's omniscience, agent's passivity and honesty, unlimited stakes.
  - (1 mark) Contrast with posted-quote bookie: bookie doesn't know credences, agent can decline or misrepresent, stakes capped.

  *Common mistakes*: 
  - Simply restating the definition of a probability measure without explaining the argument.
  - Failing to contrast the two scenarios.

  **Part 2 (15 marks):**
  a. (2 marks) Correctly states that in a single round the bookie cannot necessarily exploit because he doesn't know if the quote is too high or too low relative to the agent's true credence.
  b. (6 marks) Explains that over multiple rounds the bookie can potentially exploit by naming propositions sequentially and placing bets as quotes are given, but only if the agent quotes for all propositions in a set that is incoherent. The bookie can choose subsequent propositions based on previous quotes. However, the agent can decline to quote at any time, so she can avoid completing the Dutch book.
  c. (4 marks) Explains that the stake cap bounds the loss (so the agent's maximum loss is bounded). Without the cap, the bookie could make the loss arbitrarily large.
  d. (3 marks) Notes that the agent's ability to decline breaks the inevitability of the Dutch book. The agent can avoid exploitation by declining to quote on critical propositions.

  *Common mistakes*:
  - Assuming the bookie can force the agent to complete the Dutch book.
  - Ignoring the sequential nature and the bookie's adaptive strategy.
  - Not addressing the boundedness due to the cap.

  **Part 3 (5 marks):**
  a. (2 marks) States that the argument does not directly show that incoherent credences are irrational because the agent can avoid exploitation by strategic quoting or declining. The argument targets quotable prices, not credences.
  b. (1 mark) Notes that the argument shows that posting incoherent quotes is risky (exposes to bounded loss).
  c. (2 marks) Explains that the stake cap reduces the normative force because a bounded loss might be acceptable.

  *Common mistakes*:
  - Conflating incoherent credences with incoherent quotes.
  - Not addressing the cap's effect.

  ### Band Descriptors

  **A (21-25 marks):** 
  - Provides a clear and accurate explanation of the standard DBA and the differences in the posted-quote scenario.
  - In Part 2, recognizes that the bookie cannot exploit in a single round without knowing the agent's true credences, but may exploit over multiple rounds if the agent cooperates by quoting all requested propositions. Clearly explains the role of the cap and the agent's ability to decline.
  - In Part 3, clearly separates the issue of credences from quotes and explains that the argument does not directly show irrationality of incoherent credences. Notes the cap reduces the force of the argument.
  - The answer demonstrates a deep understanding of the gap between exploitability and irrationality.

  **B (16-20 marks):** 
  - Explains the standard DBA and the differences, but with minor inaccuracies.
  - In Part 2, understands that the bookie can exploit over multiple rounds but may not fully address the agent's ability to decline or the role of the cap.
  - In Part 3, acknowledges that the argument applies to quotes but may not clearly separate them from credences. May understate the effect of the cap.
  - The answer shows a good understanding but may miss some subtleties.

  **C (11-15 marks):** 
  - Basic explanation of the standard DBA, but may not clearly identify idealizations or the differences in the new scenario.
  - In Part 2, states that the bookie can exploit if the agent's quotes are incoherent, but does not address the sequential nature, the cap, or the agent's ability to decline.
  - In Part 3, may assert that incoherent credences are irrational because they lead to Dutch books, without noting the differences in the new setup.
  - The answer reflects a superficial understanding, such as that from reading rationalist blogs without critical engagement.

  **D (6-10 marks):** 
  - Incomplete or confused explanation of the standard DBA.
  - Part 2 fails to address the mechanics of the posted-quote bookie.
  - Part 3 does not engage with the normative questions.

  **F (0-5 marks):** 
  - Little to no relevant content.

  ---
  This exam question and model answer should achieve the goal of breaking the habit of treating Dutch book as a conversation-stopper by forcing students to engage with the mechanics and normative assumptions.
answer: |-
  ### Exam Question

  **Question 1 (25 marks total)**  

  *Background*: The Dutch book argument (DBA) claims that if an agent’s credences violate the axioms of probability, they are irrational because a "bookie" can devise a set of bets the agent accepts (due to fair pricing) that guarantees the agent a loss ("Dutch book"). Students often treat "Dutch book" as an automatic indictment of irrationality, without examining how the loss arises or what it implies.  

  *Setup*: Consider a "posted-quote bookie" scenario:  
  - The bookie names propositions one at a time. For each, the agent may **decline to quote** a price or **post a number** \( p \) (not necessarily her true credence).  
  - \( p \) is the price at which the agent is willing to take either side of a **unit bet** on the proposition (e.g., for proposition \( A \), a unit bet pays £1 if \( A \) is true, £0 otherwise). If the agent posts \( p \):  
    - The bookie chooses a **stake** \( s \) (real number) with \( |s| \leq M \), where \( M > 0 \) is a fixed cap, and chooses to **buy** (pay \( s \cdot p \) to the agent for the bet) or **sell** (receive \( s \cdot p \) from the agent for the bet).  
    - The agent’s net gain is \( s \cdot (I_A - p) \), where \( I_A \) is the indicator function for \( A \) (1 if true, 0 otherwise).  
  - The bookie may name further propositions adaptively (based on previous quotes/bets).  
  - **Total net gain** for the agent is the sum over all bets. The bookie "exploits" the agent if this total is negative in all possible worlds (i.e., guaranteed loss for the agent).  

  **Part 1 (5 marks)**:  
  Explain the key idealizations in the standard Dutch book argument. How does the posted-quote bookie differ regarding: (i) the bookie’s knowledge of credences, (ii) the agent’s control over bets, and (iii) the stakes?  

  **Part 2 (15 marks)**:  
  Suppose an agent posts prices for a set of propositions that are **incoherent** (no probability measure assigns them as fair prices).  
  (a) Can the bookie guarantee the agent a loss in a **single round**? Justify.  
  (b) Can the bookie guarantee a loss over **multiple rounds**? Describe the process, including how the bookie selects propositions/stakes and how the agent’s ability to decline quotes affects this.  
  (c) What role does the **stake cap \( M \)** play? How would removal of the cap (\( M \to \infty \)) change the outcome?  
  (d) If the agent quotes **strategically** (e.g., posts coherent prices despite incoherent credences), can she avoid a guaranteed loss? Explain.  

  **Part 3 (5 marks)**:  
  (a) Does the possibility of exploitation in this scenario show that **incoherent credences** are irrational? Why or why not?  
  (b) What does it show about the agent’s **quotable prices**?  
  (c) How does the **stake cap \( M \)** affect the normative force of the argument?  

  *Note*: No marks for naming authors/theorems. Use only the definitions above.  

  ---

  ### Model Answer (approx. 1100 words)  

  **Part 1: Idealizations and Differences**  
  The standard Dutch book argument (DBA) relies on three key idealizations. First, the bookie **knows the agent’s credences** perfectly, allowing them to design a set of bets that the agent, by their own fairness judgments, must accept. Second, the agent is **passive and honest**: they accept all bets priced at their credence and do not adapt. Third, stakes are **unbounded** (\( M \to \infty \)), so the guaranteed loss can be made arbitrarily large. Combined, these imply that incoherent credences *inevitably* lead to a catastrophic loss.  

  The posted-quote bookie removes these idealizations. (i) The bookie **lacks prior knowledge** of credences; they only see the agent’s posted prices. (ii) The agent has **control**: they can decline to quote any proposition or post prices strategically (e.g., misrepresenting true credences). (iii) Stakes are **capped** (\( |s| \leq M \)), bounding potential losses. This setup shifts focus from abstract credences to the agent’s *actions* (quotes) in a sequential, interactive setting.  

  **Part 2: Analysis of Exploitation**  
  *(a) Single round: No guaranteed loss.*  
  In a single round, the bookie names one proposition, and the agent posts \( p \). The bookie then chooses a stake \( |s| \leq M \) and a side (buy/sell). Crucially, the bookie cannot guarantee a loss because they lack knowledge of the agent’s *true credence* \( c(A) \). Suppose the agent posts \( p \neq c(A) \). The bookie must guess whether \( p \) is too high or too low relative to \( c(A) \) to exploit it. For example, if \( p > c(A) \), the bookie should sell (agent buys at an unfair high price), but the bookie cannot know this without \( c(A) \). Absent such knowledge, the bookie’s choice is speculative—it may profit or lose depending on \( A \)’s truth and \( c(A) \). Thus, no guaranteed loss occurs in a single round.  

  *(b) Multiple rounds: Exploitation possible but avoidable.*  
  The bookie can exploit incoherent prices over multiple rounds *if* the agent quotes all requested propositions. The bookie proceeds adaptively:  
  1. Name a proposition \( A \); if the agent posts \( p_A \), the bookie records it.  
  2. Name a new proposition \( B \) (e.g., \( A \cap B \) or \( A \cup B \)), leveraging previous quotes to target incoherence.  
  3. Repeat until quotes for a set \( \{A, B, \dots\} \) are obtained, and their incoherence implies a Dutch book (via standard DBA).  
  4. Place bets with stakes \( s_i \) (with \( |s_i| \leq M \)) computed to ensure the net gain \( \sum_i s_i \cdot (I_{A_i} - p_i) < 0 \) in all worlds.  

  However, the agent can **decline to quote** at any step. If the bookie’s sequence suggests an impending Dutch book (e.g., naming related propositions), the agent can refuse participation. For instance, if quotes for \( A \) and \( B \) are already given, and the bookie names \( A \cup B \), the agent might decline to avoid revealing \( p_{A \cup B} \) and completing an exploitable set. Thus, exploitation is **not inevitable**—it requires the agent’s cooperation in quoting all critical propositions.  

  *(c) Role of stake cap \( M \): Bounding losses and enabling partial exploitation.*  
  The cap \( M \) ensures the agent’s maximum loss is **bounded** (e.g., for \( k \) bets, loss \( \leq k \cdot M \)). This weakens exploitation: minor incoherencies yield minor losses, and agents might accept this risk. For example, if quotes violate additivity (\( p_{A \cup B} \neq p_A + p_B \) for disjoint \( A,B \)), the guaranteed loss is fixed and small if \( M \) is small.  

  Without the cap (\( M \to \infty \)), the bookie could scale stakes arbitrarily to magnify losses. A tiny incoherence (e.g., \( p_{A \cup B} = p_A + p_B + \epsilon \)) would yield unbounded losses, mirroring the catastrophic stakes in the standard DBA. The cap thus transforms the argument from demonstrating "disastrous irrationality" to revealing "manageable risk."  

  *(d) Strategic quoting: Avoidance is possible.*  
  An agent with incoherent credences can avoid exploitation by **posting coherent prices** (e.g., adhering to probability axioms) or **declining risky quotes**. For instance, if true credences violate \( c(A \cup B) \neq c(A) + c(B) \) for disjoint \( A,B \), the agent might still post \( p_{A \cup B} = p_A + p_B \) to appear coherent. Since the bookie only sees quotes, not true credences, they cannot exploit this misrepresentation. Alternatively, the agent might decline to quote propositions that could complete a Dutch book. Thus, **strategic behavior severs the link between incoherent credences and exploitability**—only careless quoting (or irrational betting dispositions) are punished.  

  **Part 3: Normative Implications**  
  *(a) Incoherent credences: Not directly implicated.*  
  The scenario **does not show** that incoherent credences are irrational. Exploitation depends on the agent’s **actions** (quotes), not their beliefs. An agent can have incoherent credences yet avoid loss by quoting strategically or declining. The normative force applies to *betting dispositions*: posting incoherent prices is risky, but credences themselves are not "Dutch-booked." Rationality concerns coherence in *actions*, not necessarily in *beliefs*.  

  *(b) Quotable prices: Vulnerability reflects poor betting dispositions.*  
  The argument shows that **publicly posting incoherent prices** is imprudent. It exposes the agent to a guaranteed loss (bounded by \( M \)) if the bookie adaptively constructs a Dutch book. This highlights a pragmatic norm: agents should quote coherent prices (or decline to bet) to avoid exploitation. Crucially, this targets the agent’s willingness to *commit* to prices, not their internal mental state.  

  *(c) Stake cap: Diminishes normative urgency.*  
  The cap \( M \) **weakens** the argument’s normative force. With bounded losses, exploitation becomes a *financial risk* rather than a *catastrophe*. Agents might rationally accept small, guaranteed losses for convenience (e.g., if computing coherent quotes is costly) or if the probability of encountering a predatory bookie is low. By contrast, unbounded stakes (standard DBA) make incoherence indefensible—no rational agent would risk ruin. Thus, the cap reduces Dutch book from a "slam-dunk" argument to a cautionary tale about minor risks.  

  **Conclusion**: The posted-quote bookie reveals that Dutch book arguments are not about credences per se, but about **vulnerable betting behavior**. Incoherent credences only imply irrationality if paired with naive quoting. The bounded-stakes, interactive setting undermines the standard argument’s force, showing that "Dutch book" is not a magic word—it requires unpacking how losses arise and why they matter.  

