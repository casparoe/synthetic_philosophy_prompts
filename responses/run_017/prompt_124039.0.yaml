answer: |-
  Based on your cases and constraints, here's a unified principle structured as a deployment checklist, followed by predictions for your new setups and the evals flip-flop. The core insight is that **worst-case reasoning is required when failures could be *amplified* by adversarial pressure, systemic correlation, or non-stationarity, without robust *containment*.** I'll state it precisely, then justify each clause with your cases.

  ---

  ### **Deployment Checklist: Reasoning Threshold**
  **Use worst-case reasoning if ANY of the following apply:**  
  1. **Adversarial Pressure**: An adversary (human or automated) is incentivized to actively seek or trigger failures.  
  2. **Systemic Correlation**: Failures are non-independent (e.g., shared model/trigger) AND deployment scale implies high aggregate risk.  
  3. **Non-Stationarity**: The failure distribution is unstable (e.g., due to feedback loops or drift).  

  **Else, average-case reasoning + monitoring suffices.**  
  **Exception**: Robust containment (e.g., hard constraints or human oversight) can override 1–3.  

  ---

  ### **Clause Justification via Your Cases**
  - **Adversarial Pressure (clause 1)**: Explains your verdicts on (2) coding agent (agent/user could seek harmful code), (4) chatbot (users probe for manipulation), and (7) spam filter (spammers attack).  
  - **Systemic Correlation (clause 2)**: Explains (6) tutoring model (mass rollout → correlated failures hurt many) and (4) chatbot (manipulation tactics generalize).  
  - **Non-Stationarity (clause 3)**: Explains (8) retrained model (past evals obsolete).  
  - **Containment (exception)**: Explains (1) X-ray (radiologist contains errors), (3) root script (fixed action constrains harm), and (5) humans (spot checks + common sense contain risk).  

  **Dropped verdicts? None.** Your intuitions hold:  
  - (3) vs. (2): Higher stakes in (3) are contained; (2) has adversarial pressure.  
  - (4) vs. (3): (4) has adversarial pressure + correlation; (3) has containment.  
  - (5) vs. (2): Humans (5) have containment; AI agents (2) lack it and face adversarial pressure.  
  - (6): Mild worry fits – systemic correlation matters but isn’t catastrophic alone (no adversary).  

  ---

  ### **Predictions for New Setups**
  **(a) Agent writes/runs tests, human approves merges**  
  - **Verdict**: Average-case suffices.  
  - **Why**: Human approval provides containment (exception). No adversary (if sandbox prevents agent from "searching" for escapes), no correlation (single repo), and stationarity assumed.  

  **(b) Open-weight release (anyone can fine-tune)**  
  - **Verdict**: Worst-case required.  
  - **Why**: Strong **adversarial pressure** (malicious actors fine-tune for harm) + **systemic correlation** (base model flaws propagate) + **non-stationarity** (unpredictable fine-tunes). No containment.  

  **(c) Frozen model, 5 users, narrow task**  
  - **Verdict**: Average-case suffices.  
  - **Why**: No adversary (trusted users), low scale (5 independent instances), no drift. Containment not needed here but could add monitoring.  

  ---

  ### **Evals Flip-Flop: When Evals Need Worst-Case Reasoning**
  - **If the deployment requires worst-case reasoning** (per checklist), then evals must too (e.g., adversarial testing, high-confidence bounds).  
    - *Example*: For (4) chatbot, measure sycophancy using red-teaming, not average user satisfaction.  
  - **Else**, average-case evals (e.g., accuracy on i.i.d. test sets) suffice.  
    - *Example*: For (3) root script, average reliability metrics are sufficient.  

  **Why?** Evals must mirror deployment risk. If you only check average performance for a system vulnerable to tail events, you’ll miss catastrophic failures.  

  ---

  ### **Is This Just Fat-Tailed Expected Value?**
  **Yes, but operationalized for robustness.** The checklist forces explicit consideration of:  
  1. **Who controls the input distribution?** (Adversaries shift mass to the tail.)  
  2. **Does independence hold?** (Correlation invalidates linear scaling.)  
  3. **Is the world static?** (Non-stationarity breaks distributional assumptions.)  

  **How to distinguish from pure expected value?**  
  - **Observation**: If failures are *rare but possible* and your mitigation is "monitor and fix later," you’re using average-case reasoning.  
  - If you *red-team, constrain actions, or assume correlated failure*, you’re accounting for amplification – which is worst-case-aware EV.  
  - **Test**: For (7) spam filter (stakes ~$1), you still demanded worst-case. Pure EV would ignore this (low severity), but adversarial pressure forces tail-awareness. The checklist encodes this.  

  **Use the checklist language** – it converts abstract "fat tails + uncertainty" into actionable questions. Expected value is the math; the checklist ensures you don’t miss tail risks in deployment logic.  

  ---

  ### **Summary**
  - **Principle**: Worry about worst-case when failures could amplify (via adversaries, correlation, or drift) without containment.  
  - **Checklist**: Paste the 3 clauses + containment exception.  
  - **Verdicts**: (a) Average-case, (b) Worst-case, (c) Average-case.  
  - **Evals**: Match reasoning type to deployment risk.  
  - **Real work**: It’s EV, but the checklist forces you to *find and defang the tail*.
