  3. **Error Growth (for Computable Determinism)**  
     *In weather prediction, does a tiny measurement error stay minor, grow slowly, or explode (e.g., "butterfly effect")?*  
     - **A: Stays small/grows slowly (e.g., solar system)** → Go to 4  
     - **B: Explodes exponentially (e.g., turbulent fluids)** → Go to 5  

  4. **Embedded Predictor (for Stable-Error Systems)**  
