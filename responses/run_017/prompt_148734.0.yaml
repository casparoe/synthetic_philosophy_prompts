     - **B: No—even patterns are unpredictable (e.g., gas molecules with no recurring states)** → **Leaf: Radical Chaos**  

  6. **Probability Stability (for Indeterminism)**  
     *In radioactive decay, are the odds fixed (e.g., 50% chance/hour), or can they shift unpredictably?*  
     - **A: Fixed odds (e.g., quantum mechanics)** → **Leaf: Stable Probabilism**  
     - **B: Shifting/unmeasurable odds (e.g., "mood-based" chances)** → **Leaf: Unstable Indeterminism**  

