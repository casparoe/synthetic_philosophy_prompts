prompt: |-
  I sit on the Operations and Public Health Committee of the Cascade Regional Water Authority. We vote in three weeks on whether to authorize a two-year pilot of ozonation with biological filtration at our two largest plants, with a conversion decision to follow in year three, and I want to circulate a written opinion before the meeting that the committee can actually vote on.

  The case as staff present it: our existing chlorination train yields regulated trihalomethanes and haloacetic acids whose dose-response is well characterized, and their model puts the expected health burden at a figure with a credible interval they stand behind. Ozonation would very likely reduce that burden substantially, but it brings bromate, some nitrosamines, and, critically, a class of oxidation byproducts for which there is no agreed dose-response and no agreement even on what the endpoint list should contain. Staff polled eleven toxicologists, pooled their judgments into a single probability distribution, ran an expected-utility cost-benefit analysis, and got a positive net benefit for the pilot.

  Two of us have objected, in opposite directions, and I do not want a memo that splits the difference.

  My objection is that the pooled distribution is an artifact. The panelists disagree not about parameters within a shared model but about which model class is right, and the result moves with choices nobody made on substantive grounds: trimming the two most pessimistic panelists makes the pilot win, taking the worst case for each endpoint separately makes it lose, and taking the worst case jointly over the whole endpoint space makes it lose by a wider margin. I read this as the Ellsberg problem in institutional dress, and I want us to adopt an explicit rule for decisions of this shape rather than continuing to launder a set of distributions into a single one.

  The objection from the colleague whose judgment I trust most is that what I am calling caution is simply the board spending ratepayer money to indulge its own discomfort; that a worst-case-style rule would also instruct us, absurdly, that a study whose entire purpose is to reduce uncertainty is worthless or worse than worthless; and that a public body has no mandate to express an attitude toward uncertainty at all, only to serve the public. That last point I find genuinely hard to meet, and I do not want it answered with a gesture.

  Please draft the opinion. It should recommend a specific decision rule for this class of cases, in enough operational detail that staff could implement it without returning to us, and I am indifferent whether it lands nearer a pure worst-case standard, a weighted blend of worst and best case, or something else entirely, provided the rule is stated rather than merely applied. It should specify in advance how the uncertainty is to be carved up: which endpoints count, how panelists' judgments are combined, and whether worst cases are taken endpoint by endpoint or jointly. It should require staff to file, before the vote, a report of the range of defensible re-carvings under which the recommendation reverses. It should address the fact that we will revisit this in year three, and say whether a committee that expects to revisit should use the same rule as one deciding once. And it should give a concrete bottom line on both the pilot and the year-three conversion, with conditions and dates, while stating plainly which of my colleague's points the recommendation concedes and which it rejects, and whether our answer survives a change of framing.
reasoning: |-
  We are drafting an opinion for the Operations and Public Health Committee of the Cascade Regional Water Authority. The committee is to vote in three weeks on a two-year pilot of ozonation with biological filtration at the two largest plants, with a conversion decision to follow in year three.

  The staff's case:
  - Current chlorination produces regulated disinfection byproducts (trihalomethanes and haloacetic acids) with a well-characterized dose-response and a modeled health burden (with credible interval).
  - Ozonation would likely reduce that burden but introduces:
      - Bromate
      - Some nitrosamines
      - A class of oxidation byproducts with no agreed dose-response and no consensus on what endpoints to consider.
  - Staff polled 11 toxicologists, pooled their judgments into a single probability distribution, and ran an expected-utility cost-benefit analysis showing a positive net benefit for the pilot.

  Two objections:
  1. Our objection (the author of the memo): The pooled distribution is an artifact because the panelists disagree on the model class, not just parameters. The result is sensitive to arbitrary choices (e.g., trimming pessimistic panelists changes the outcome, worst-case per endpoint makes it lose, joint worst-case makes it lose more). This is analogous to the Ellsberg problem. We want an explicit rule for such decisions, not laundering distributions.

  2. A trusted colleague's objection: 
     - What we call caution is the board spending ratepayer money to indulge discomfort.
     - A worst-case rule would absurdly make a study designed to reduce uncertainty worthless or worse.
     - A public body has no mandate to express an attitude toward uncertainty, only to serve the public.

  Requirements for the opinion:
  - Recommend a specific decision rule for this class of cases, with operational detail so staff can implement without returning to the committee.
  - The rule can be pure worst-case, weighted blend, or something else, but must be stated explicitly.
  - Specify in advance: 
      - Which endpoints count?
      - How are panelists' judgments combined?
      - Are worst cases taken endpoint by endpoint or jointly?
  - Require staff to file, before the vote, a report of the range of defensible re-carvings under which the recommendation reverses.
  - Address the fact that we revisit in year three: should the same rule apply?
  - Give a concrete bottom line on both the pilot and the year-three conversion (with conditions and dates).
  - State plainly which of the colleague's points the recommendation concedes and which it rejects, and whether the answer survives a change of framing.

  Proposed Approach:

  After considering the objections, we propose a decision rule that balances the need for caution in the face of deep uncertainty with the imperative to gather information and serve the public. We acknowledge that the Ellsberg-like ambiguity cannot be resolved by simply averaging expert opinions when the model uncertainty is fundamental. However, we also recognize that a pure worst-case approach may paralyze necessary action and devalue information gathering.

  We propose a two-stage rule:

  Stage 1 (for the pilot decision): 
  - The purpose of the pilot is to reduce uncertainty. Therefore, we should be more permissive in authorizing the pilot if it can provide valuable information that reduces ambiguity, even if the current uncertainty might suggest caution. The key is to ensure that the pilot is designed to address the critical uncertainties.

  Stage 2 (for the conversion decision): 
  - After the pilot, we will have more information. Then, we can apply a more stringent rule that explicitly accounts for the remaining uncertainty.

  For the pilot decision, we propose:

  **Decision Rule for Pilots (Exploratory Interventions):**

  1. **Endpoints:** The endpoints to consider are those identified by staff as potentially relevant and for which there is at least some evidence of concern. The list must be fixed in advance and include:
     - The currently regulated byproducts (trihalomethanes, haloacetic acids) and their expected changes.
     - Bromate.
     - Nitrosamines (specifying which ones).
     - Other oxidation byproducts: the class must be defined by the staff and toxicologists, and the endpoints within this class must be explicitly listed (even if the dose-response is unknown). The list should be as comprehensive as possible based on current science.

  2. **Combining Expert Judgments:**
     - Do not pool the experts into a single distribution. Instead, treat each expert's model as a separate scenario.
     - For each endpoint, we will have a range of estimates from the experts. We will use the entire set of estimates without averaging.

  3. **Evaluating the Pilot:**
     - We will require two parallel analyses:
       a) **Expected Value Analysis (EVA):** Calculate the expected net benefit using a uniform weighting of the expert models (i.e., each model is equally likely). This is the staff's current approach but without trimming or other adjustments.
       b) **Robustness Analysis:** Evaluate the decision under a set of "plausible extreme" scenarios. Specifically:
          - For each endpoint, take the worst-case estimate (highest harm) from among the expert models that are considered scientifically defensible (i.e., not outliers without basis). Then, consider two ways of combining endpoints:
            i. **Endpoint-by-endpoint worst-case:** For each endpoint, use its own worst-case estimate, but assume the other endpoints are at their expected values (from EVA). This is the "independent worst-case".
            ii. **Joint worst-case:** Use the worst-case estimates for all endpoints simultaneously (the most pessimistic scenario across the board).

     - The pilot is authorized if:
       (i) The EVA shows a positive net benefit, AND 
       (ii) The independent worst-case scenario does not show a net harm that exceeds a threshold (say, twice the expected net benefit of the status quo) AND 
       (iii) The joint worst-case scenario, while possibly showing a large net harm, is deemed sufficiently unlikely (we require that at least 50% of the expert models must not support the joint worst-case, i.e., the joint worst-case must be an outlier).

     - Additionally, the pilot must be designed to collect data on the uncertain endpoints so that the conversion decision can be made with reduced uncertainty.

  4. **Staff Report Requirement:**
     - Before the vote, staff must provide a report that:
       - Lists the endpoints and the expert estimates for each.
       - Shows the EVA and the two robustness analyses (independent worst-case and joint worst-case).
       - Identifies the range of defensible re-carvings (e.g., including/excluding experts, alternative endpoint lists, alternative ways of defining worst-case) under which the recommendation (authorize or not) would reverse. Specifically, they must report if the reversal occurs under:
          - Including all experts vs. excluding the two most pessimistic.
          - Using a broader vs. narrower endpoint list.
          - Using independent worst-case vs. joint worst-case.

  For the Year 3 Conversion Decision:

  **Decision Rule for Permanent Changes:**

  We will use a more stringent rule because the intervention becomes permanent. We propose:

  1. **Endpoints and Expert Judgments:** Same as above, but updated with data from the pilot.
  2. **Evaluation:**
     - We require that the EVA shows a positive net benefit.
     - We require that the independent worst-case for each endpoint does not show a net harm (or at least not a net harm beyond a de minimis level, say 5% of the expected net benefit of the status quo).
     - We require that the joint worst-case scenario does not show a net harm that is catastrophic (defined as an order of magnitude worse than the status quo) and that the probability of the joint worst-case (based on the updated expert opinions and pilot data) is below a threshold (e.g., 5% chance).

  Alternatively, if the pilot has reduced uncertainty sufficiently, we may have a consensus model and then we can revert to a standard expected utility. But if uncertainty remains, we use the above.

  Addressing the Colleague's Objections:

  - **On spending ratepayer money to indulge discomfort:** We concede that a public body must not let discomfort alone drive decisions. However, we reject the idea that the Ellsberg-type ambiguity is mere discomfort. It is a well-documented cognitive and institutional challenge. Our rule requires that the joint worst-case must be an outlier (supported by less than 50% of experts) to proceed with the pilot. This is a substantive, not whimsical, caution.

  - **On worst-case making a study worthless:** We agree that a pure worst-case rule could make a study designed to reduce uncertainty appear worthless. Therefore, for the pilot, we have relaxed the worst-case requirement (we don't require the worst-case to be positive, only not too negative and not the dominant scenario). The pilot is authorized if the EVA is positive and the worst-case is not overwhelmingly supported. This is a concession: we allow the pilot even if there is some chance of harm because the information gain is valuable.

  - **On the public body's mandate:** We reject the notion that a public body has no mandate to express an attitude toward uncertainty. We are charged with protecting public health in the face of uncertainty. We must have a consistent, transparent way to handle ambiguity. Our rule is an expression of that duty. However, we agree that the ultimate goal is to serve the public, and that is why our rule allows the pilot to proceed when the expected value is positive and the worst-case is not the consensus view.

  The rule survives a change of framing because it does not depend on a single representation of uncertainty. It uses multiple scenarios and requires robustness across them.

  Bottom Line Recommendations:

  1. **Pilot Authorization (Two-year pilot):** 
     - We recommend authorizing the pilot, provided that:
       a) Staff's expected value analysis (using all 11 experts equally) shows a positive net benefit for the pilot (including the value of information).
       b) The independent worst-case analysis (endpoint-by-endpoint) does not show a net harm exceeding twice the expected net benefit of the status quo.
       c) The joint worst-case scenario is not supported by a majority of the expert models (i.e., at least 6 of the 11 experts must not support the combination of worst-case estimates for all endpoints simultaneously).
       d) The pilot is designed to collect data on all uncertain endpoints (bromate, nitrosamines, and the defined class of oxidation byproducts) with sufficient power to inform the conversion decision.

     - Staff must file the required report (as above) 10 days before the vote. If conditions (a), (b), and (c) are met, we authorize the pilot.

     - Conditions for the pilot:
       - Start date: Within 6 months of authorization.
       - Duration: Two years.
       - Data collection and interim reports: Every 6 months, with a final report 3 months before the end of the pilot.

  2. **Year 3 Conversion Decision:**
     - We will use the same decision rule as for permanent changes (described above) but with updated data and expert judgments (which may be refined by the pilot).
     - The committee will vote on conversion at a meeting to be scheduled no later than 3 months after the final pilot report.

     - Conditions for conversion:
       - The updated EVA must show a positive net benefit for permanent conversion.
       - The independent worst-case for each endpoint must not show a net harm (or net harm beyond a de minimis level, defined as 5% of the status quo's expected net burden).
       - The joint worst-case scenario must not show catastrophic harm (order of magnitude worse than status quo) and the probability of the joint worst-case (based on updated expert opinions) must be less than 5%.
       - If these conditions are not met, we will not convert. We may then consider alternatives or continue the current system.

  This approach allows the pilot to proceed (valuable information gathering) while setting a higher bar for permanent conversion. It addresses the ambiguity by requiring robustness and transparency.

  We believe this rule is a principled middle ground that serves the public by allowing progress in the face of uncertainty while guarding against catastrophic outcomes.

  Draft Opinion:

  ---

  **MEMORANDUM**

  **To:** Operations and Public Health Committee, Cascade Regional Water Authority  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Decision Rule on Ozonation Pilot and Proposed Authorization  

  **Introduction**  
  This memorandum addresses the proposal to authorize a two-year pilot of ozonation with biological filtration at our two largest water treatment plants, with a permanent conversion decision to follow in year three. Staff have presented an analysis based on pooling expert judgments and expected utility, which shows a positive net benefit. However, the committee has raised concerns about the sensitivity of the results to modeling choices and the fundamental uncertainty surrounding some byproducts. This opinion recommends a specific decision rule for this and similar cases, provides a bottom-line recommendation on the pilot and conversion, and responds to the objections raised.

  **Proposed Decision Rule for Decisions Under Deep Uncertainty**  
  For decisions involving interventions that introduce new sources of uncertainty (especially when experts disagree on model structure), we adopt the following rule:

  **A. For Exploratory Interventions (e.g., Pilots):**  
  1. **Define Endpoints:** Staff, in consultation with toxicologists, must define a fixed list of endpoints that includes:
     - All regulated byproducts (trihalomethanes, haloacetic acids) and their expected changes.
     - Bromate.
     - Nitrosamines (with specific compounds listed).
     - A defined class of oxidation byproducts, with specific endpoints listed (e.g., aldehydes, ketones, etc.) based on current literature.

  2. **Expert Judgments:** Collect expert judgments (probability distributions or point estimates) for each endpoint from a panel of experts. Each expert's model is treated as a separate scenario. Do not pool.

  3. **Analyses Required:**  
     a) *Expected Value Analysis (EVA):* Compute the expected net benefit by averaging the net benefit across all expert models (equal weight).  
     b) *Robustness Analysis:*  
        - *Independent Worst-Case:* For each endpoint, take the highest harm estimate from the expert models (excluding models deemed unscientific or outliers without justification). Then compute the net benefit with that endpoint at worst-case and others at their expected value (from EVA).  
        - *Joint Worst-Case:* Take the highest harm estimate for every endpoint simultaneously (again, excluding unscientific models) and compute the net benefit.  

  4. **Authorization Criteria for a Pilot:**  
     Authorize the pilot if:  
     (i) EVA shows positive net benefit.  
     (ii) The independent worst-case net benefit is not worse than -2 × (expected net benefit of the status quo).  
     (iii) The joint worst-case scenario is not the consensus view; specifically, less than 50% of the expert models must support the combination of estimates used in the joint worst-case.  

     Additionally, the pilot must be designed to collect data on all uncertain endpoints to reduce ambiguity for the conversion decision.

  **B. For Permanent Changes:**  
  Use the same steps 1-3, but with updated data and expert judgments.  
  Authorize the change if:  
     (i) EVA shows positive net benefit.  
     (ii) The independent worst-case for each endpoint shows net benefit not worse than -5% of the status quo's expected net burden (i.e., de minimis harm).  
     (iii) The joint worst-case scenario does not show catastrophic harm (defined as net harm > 10 × the status quo's expected net burden) AND the probability of the joint worst-case (based on the updated expert models) is less than 5%.  

  **Staff Report Requirement**  
  Before any vote on a pilot or permanent change under this rule, staff must file a report that:  
  - Lists the endpoints and expert estimates.  
  - Presents the EVA and robustness analyses (independent and joint worst-case).  
  - Identifies the range of defensible re-carvings (e.g., including/excluding experts, alternative endpoint lists) under which the recommendation would reverse. This must include:  
     - The effect of excluding the two most pessimistic experts.  
     - The effect of using a broader or narrower endpoint list.  
     - The effect of using independent vs. joint worst-case.  

  **Revisiting in Year Three**  
  For the conversion decision, we will apply the same rule (for permanent changes) because the nature of the uncertainty may persist. However, the data from the pilot should reduce the uncertainty. The rule is consistent in its structure but uses updated information.

  **Bottom Line Recommendations**  
  1. **Pilot Authorization:**  
     We recommend authorizing the two-year pilot, conditional on staff's pre-vote report satisfying:  
     - EVA shows positive net benefit.  
     - Independent worst-case net benefit is not worse than -2 × (status quo expected net burden).  
     - Joint worst-case is not supported by a majority of experts (i.e., <6 experts).  
     - The pilot design includes robust data collection on all uncertain endpoints.  

     If the report meets these, we authorize the pilot with the following conditions:  
     - Start within 6 months of authorization.  
     - Duration: 24 months.  
     - Interim reports every 6 months.  
     - Final report due 3 months before the end of the pilot.  

  2. **Year-Three Conversion:**  
     We will decide at a meeting no later than 3 months after the final pilot report. The decision will use the permanent change rule above.  

  **Response to Colleague's Objections**  
  We address the objections from our respected colleague as follows:  
  - **On spending ratepayer money to indulge discomfort:** We concede that a public body must not act on discomfort alone. However, we reject the characterization of our caution as indulgence. The Ellsberg-type ambiguity is a real and documented challenge in decision theory. Our rule uses objective criteria (expert models, defined endpoints) and does not let discomfort drive the decision.  
  - **On worst-case making a study worthless:** We agree that a pure worst-case rule could devalue information gathering. Therefore, we have designed the pilot rule to be more permissive (allowing the pilot if the worst-case is not too bad and not the consensus). This is a concession to the value of information.  
  - **On the public body's mandate:** We reject the idea that we have no mandate to address uncertainty. Our duty to protect public health requires a structured approach to ambiguity. However, we agree that the goal is to serve the public, and our rule does so by allowing the pilot to proceed when the expected value is positive and the worst-case is not the majority view.  

  This rule survives a change of framing because it does not rely on a single representation of uncertainty but uses multiple scenarios and requires robustness.

  **Conclusion**  
  We recommend adopting this decision rule and authorizing the pilot if the staff report meets the criteria. This approach balances caution with the need for information and progress.

  Respectfully submitted,  
  [Your Name]
answer: |-
  **MEMORANDUM**  
  **To:** Operations and Public Health Committee, Cascade Regional Water Authority  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Decision Rule on Ozonation Pilot and Long-Term Uncertainty Management  

  ### I. Introduction  
  This opinion addresses the proposal to authorize a two-year pilot of ozonation with biological filtration at our two largest plants, with a permanent conversion decision in year three. Staff’s cost-benefit analysis, based on pooled toxicologist judgments, supports the pilot. However, two objections have been raised:  
  1. **Structural Uncertainty Objection (Mine):** The pooled distribution is an artifact of ungrounded methodological choices (e.g., trimming experts, endpoint definitions), masking fundamental model disagreement akin to the Ellsberg paradox.  
  2. **Public Mandate Objection (Trusted Colleague’s):** A worst-case approach would paralyze progress, devalue uncertainty-reducing studies, and overstep our mandate by prioritizing the board’s discomfort over public service.  

  I propose a transparent decision rule that reconciles these concerns, specifies operational details, and delivers a clear vote recommendation.  

  ---

  ### II. Recommended Decision Rule for Deep Uncertainty  
  For interventions introducing poorly characterized risks (e.g., novel byproducts with undefined endpoints/dose-responses), the Committee shall use a **Thresholded Minimax Regret with Expected Value Safeguard (TMR-EV)**. This rule:  
  - **Explicitly addresses model-class disagreement** without artificial pooling.  
  - **Values information-gathering** (conceding part of the public mandate objection).  
  - **Rejects unconstrained optimism or pessimism** (addressing both objections).  

  #### Operational Specifications:  
  1. **Endpoint Definition:**  
     - **Fixed Endpoint List:** Staff, with toxicologist input, shall define a finite set of endpoints *before* analysis. This includes:  
       - Regulated byproducts (trihalomethanes, haloacetic acids).  
       - Bromate and specified nitrosamines.  
       - Oxidation byproducts: Adopt the EPA’s "Contaminant Candidate List 5" (CCL5) as the default class. Endpoints are all CCL5 compounds plausibly generated by ozonation.  
     - **Justification:** Prevents arbitrary expansion/contraction of endpoints. CCL5 is a regulatory anchor, avoiding ad hoc choices.  

  2. **Expert Judgment Integration:**  
     - **No Pooling:** Retain all expert judgments as distinct scenarios. Do not combine distributions.  
     - **Model-Group Weighting:** Group experts by model class (e.g., "linear-threshold," "non-monotonic," "threshold-free"). Weight each model class equally (e.g., if 3 classes exist, each gets 1/3 weight), not per expert.  

  3. **Worst-Case Application:**  
     - **Joint, Not Independent, Worst-Case:** Evaluate outcomes when *all endpoints simultaneously* take their worst-plausible values within a model class. "Plausible" = within the 95% CI of at least one expert in that class.  
     - **Exclusion Criteria:** Omit model classes with <2 expert adherents or lacking peer-reviewed foundations.  

  4. **Decision Thresholds:**  
     - **Pilots:** Authorize if:  
       - (a) Expected Value (EV) across model classes is positive *and*  
       - (b) Worst-case regret ≤ 20% of status quo health burden.  
       - *Regret* = (Outcome of chosen action) – (Outcome of best action for that scenario).  
     - **Permanent Conversions:** Authorize only if:  
       - (a) EV is positive,  
       - (b) Worst-case regret ≤ 5% of status quo burden, *and*  
       - (c) No model class predicts catastrophic harm (>50% burden increase).  

  5. **Staff Pre-Vote Reporting Requirement:**  
     - Before any vote, staff must submit a "Reversibility Report" identifying:  
       - All defensible re-carvings (endpoint sets, model-class groupings, plausibility bounds) under which the recommendation flips (e.g., pilot EV turns negative).  
       - Specific analysis of:  
         - Trimming the two most pessimistic experts.  
         - Using independent (endpoint-by-endpoint) vs. joint worst-case.  
         - Expanding endpoints beyond CCL5.  

  ---

  ### III. Application to Current Proposal  
  #### A. Pilot Authorization (Vote in 3 Weeks):  
  - **Recommendation: AUTHORIZE the two-year pilot** with binding conditions:  
    - **Start Date:** Within 6 months of approval.  
    - **Data Collection:** Monitor all CCL5 endpoints, bromate, and nitrosamines quarterly.  
    - **Milestone:** Interim report at 12 months assessing uncertainty reduction.  
  - **Justification Under TMR-EV Rule:**  
    - Staff’s analysis likely satisfies (a) EV > 0 and (b) joint worst-case regret ≤ 20% burden.  
    - **Concedes the public mandate objection:** The pilot’s primary purpose is reducing uncertainty. Blocking it would indeed treat information as worthless—contradicting our duty to serve the public.  
    - **Rejects unconditional optimism:** The 20% regret threshold and endpoint definitions constrain recklessness.  

  #### B. Year-Three Conversion Decision:  
  - **Recommendation:** Use TMR-EV rule *without modification*.  
    - **Threshold Tightening:** The lower 5% regret threshold and catastrophe clause reflect higher stakes.  
    - **Revisitation Clause:** If pilot data resolves ≥80% of model-class disagreement (measured by expert variance), default to standard expected utility.  
  - **Justification:** Revisitation does not weaken rigor; it demands *more evidence* to relax uncertainty buffers.  

  ---

  ### IV. Response to Objections  
  1. **Public Mandate Objection (Colleague):**  
     - **Concedes:** A public body must not elevate discomfort over service. Hence, TMR-EV:  
       - *Authorizes the pilot* to reduce uncertainty (serving the public).  
       - Uses *regret* (not pure loss) to avoid absurd devaluation of studies.  
     - **Rejects:** The claim that we have "no mandate toward uncertainty." Our duty to protect public health *requires* structured uncertainty management—ignoring model disagreement is negligence.  

  2. **Structural Uncertainty Objection (Mine):**  
     - **Fully Addressed:** TMR-EV replaces laundering with:  
       - Fixed endpoints (CCL5),  
       - Model-class weighting (not pooling),  
       - Joint worst-case (not trimmed means).  
     - **Reversibility Report** forces transparency on methodological leverage points.  

  3. **Frame-Invariance:** The rule survives reframing (e.g., "opportunity cost of delay" or "risk-risk tradeoffs") because:  
     - Endpoints and model classes are defined ex ante.  
     - Regret accounts for alternative actions (e.g., "do nothing" vs. "alternative technologies").  

  ---

  ### V. Motion for Vote  
  I move that the Committee:  
  1. **Adopt the TMR-EV decision rule** for all interventions with deep uncertainty (Section II).  
  2. **Authorize the ozonation pilot** under the specified conditions (Section III.A).  
  3. **Require staff** to submit the Reversibility Report 7 days before the vote.  

  ---  
  **Submitted by:** [Your Name]  
  **Endorsed:** Open for co-signatories  

  ---  
  ### APPENDIX: TMR-EV Implementation Pseudocode  
  ```python  
  def tmrev_decision(endpoints, model_classes, actions):  
      # Step 1: Expected Value (EV)  
      ev = sum(  
          weight[model_class] * mean_outcome(action, model_class)  
          for model_class in model_classes  
      )  
        
      # Step 2: Worst-Case Regret (Joint across endpoints)  
      worst_regret = max(  
          outcome(action, worst_scenario) - outcome(best_action(worst_scenario), worst_scenario)  
          for worst_scenario in joint_worst_case(model_classes)  
      )  
        
      # Step 3: Apply Thresholds  
      if action == "pilot":  
          return "Authorize" if (ev > 0) and (worst_regret <= 0.2 * status_quo_burden)  
      elif action == "convert":  
          return "Authorize" if (ev > 0) and (worst_regret <= 0.05 * status_quo_burden) and (no_catastrophe(model_classes))  
  ```
