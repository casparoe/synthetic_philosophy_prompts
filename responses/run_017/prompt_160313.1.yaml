  ## CONSULTATION DOCUMENT: IMPLEMENTATION OF THE BIOSTATISTICAL DISEASE FRAMEWORK (BDF) FOR NHS RESOURCE ALLOCATION

  **Issued by:** Department for Health Efficiency and Clinical Taxonomy (DHECT)
  **Date:** 17 October 2023
  **Consultation Reference:** DHECT/BDF/IMP/23-01
  **Closing Date:** 14 November 2023, 17:00 GMT

  **Chair:** Dame Winifred Thistlethwaite, DBE
  **Sponsor Minister:** The Rt Hon. Alistair Finch MP, Minister for Clinical Prioritisation

  **1. Introduction**
  1.1 This document seeks stakeholder views on the operational implementation of the Biostatistical Disease Framework (BDF), as formally adopted under the Health and Social Care (Objective Classification) Act 2023 (c.27). The BDF provides a strictly naturalistic, value-neutral definition of disease for the purposes of NHS treatment eligibility, based solely on statistically subnormal biological function relative to a defined Reference Class.
  1.2 The primary objective is to ensure clinical resource allocation is grounded in objective biological fact, eliminating subjective value judgements concerning "harm," "suffering," or "wellbeing" which lack scientific rigour. The Framework defines a disease state as occurring when a measurable biological function falls below the 5th percentile of the distribution observed within the relevant, objectively defined Reference Class (see Annex A).

  **2. Key Principles of the BDF**
  2.1 **Objectivity:** The BDF utilises quantifiable biomarkers and physiological measurements. Judgements concerning "normal function" are derived solely from population statistics. No value-based concepts such as "harm" or "disadvantage" are incorporated into the core definition.
  2.2 **Reference Class Dependence:** The disease status of an individual is contingent upon the relevant Reference Class to which they are assigned. This class determines the statistical baseline for "normal function."
  2.3 **Subnormality Threshold:** Disease is defined solely as statistically subnormal function (below 5th percentile). Statistically normal function, even if associated with pain, limitation, or social disadvantage, is classified as health. Statistically supranormal function is outside the scope of the BDF and constitutes neither disease nor a basis for NHS-funded intervention.

  **3. Proposals for Implementation**
  3.1 **Reference Class Assignment Protocol:** A tiered assignment system is proposed (detailed Annex A):
      *   **Primary Tier:** Age, Biological Sex.
      *   **Secondary Tier:** Occupation (Standard Occupational Classification (SOC) 2020), Geographical Region (NUTS1).
      *   **Tertiary Tier (Where applicable):** Specific occupational exposures, Local Authority, Postcode Sector.
      *   Assignment will be automated via integration with NHS Digital records (GP Registration, HES, Census linkage). A statutory instrument will mandate occupational data collection via annual GP health checks.
  3.2 **Treatment Eligibility:** NHS-funded treatment will only be available for conditions meeting the BDF disease threshold within the patient's assigned Reference Class. Conditions failing to meet the threshold will be reclassified as:
      *   **Statistically Normal Ageing:** (e.g., presbyopia > age 50, significant osteoarthritis > age 70).
      *   **Statistically Normal Variation:** (e.g., dental caries prevalence >80% in Class 4A (Manual, Urban, North West)).
      *   **Enhancement / Personal Preference:** Interventions sought for statistically normal states (e.g., cataract surgery where visual acuity exceeds the 5th percentile for age/region, joint replacement for pain levels within the normal range for age/occupation).
  3.3 **Clinical Coding:** New SNOMED CT codes will be introduced to distinguish "BDF-Validated Disease" from "Non-Illness Pathology" and "Enhancement Request".

  **4. Impact Assessment & Equality Statement**
  4.1 **Impact Assessment (Summary - Appendix 1):** Modelling indicates significant efficiency savings. Conditions reclassified as "non-illness" or "enhancement" are estimated to account for 18.7% of current elective activity. For example:
      *   **Patient A (Illustrative):** Male, 72, SOC Code 9 (Elementary Occupations - e.g., labourer), North East England. Severe bilateral knee pain (VAS 8/10), radiologically advanced OA. Reference Class: Males 70-79, Manual Occupations, NE England. Knee function scores fall at the 7th percentile for this class. *Proposal:* OA classified as statistically normal ageing/pathology. Pain management remains core NHS offer; joint replacement reclassified as enhancement, available via self-pay or expanded occupational health schemes.
  4.2 **Equality Statement:** The BDF operates on strictly objective biological and statistical criteria. Differential outcomes across groups reflect inherent biological variation or environmental exposures captured within Reference Classes, not discrimination. The Department notes potential for *perceived* inequity where statistically normal conditions in disadvantaged groups (e.g., high caries prevalence in deprived areas) are ineligible for treatment, while identical pathology in a lower-prevalence Reference Class (e.g., Professional, Rural South East) may qualify. This is an objective outcome of population statistics, not a value judgement. Mitigations focus on public health interventions within affected Reference Classes.

  **5. Specific Issues for Consultation**
  5.1 **Reference Class Granularity:** Views sought on the proposed tiered structure (Annex A). Is the balance between statistical precision and operational complexity optimal? Should postcode-level granularity be mandated for specific conditions (e.g., respiratory function in urban vs. rural)?
  5.2 **Supranormal Function & Benign Variants:** The BDF defines disease solely as subnormality. How should the NHS respond to:
      *   Requests for intervention related to statistically *supranormal* function (e.g., suppressing high haemoglobin enhancing athletic performance)?
      *   Statistically rare but benign biological variants (e.g., heterochromia iridum)? The Committee proposes these remain outside the Framework's scope, constituting neither disease nor a basis for NHS funding.
  5.3 **Asymptomatic Subnormality:** The BDF identifies disease states based purely on biological measurement, irrespective of symptoms. This may diagnose individuals unaware of any "illness" (e.g., minor renal impairment in a healthy 75-year-old). The Committee acknowledges this is a logical outcome of the naturalistic definition. Views sought on communication strategies for such "non-illness pathologies".
  5.4 **Pharmaceutical Indications:** The Medicines and Healthcare products Regulatory Agency (MHRA) will align licensing with the BDF. Concerns have been raised (*Stakeholder Pre-Consultation Note Ref: P/PHARMA/23/089*) that narrowly defined Reference Classes could limit licensed indications. Conversely, sponsors may seek funding for trials within highly specific classes to maintain eligibility for niche populations. The Department seeks views on managing this dynamic.

  **6. Alternative Approach Considered & Rejected**
  6.1 The Committee briefly considered a hybrid "Harmful Dysfunction" model (defining disease as subnormal function *plus* a value judgement of harm). This was rejected unanimously (excepting Prof. Armitage - see Annex B) due to:
      *   **Operational Difficulty:** Introducing the inherently subjective and contested concept of "harm" negates the BDF's core objective of value-neutrality.
      *   **Circularity:** Defining "harm" in a medical context often presupposes a prior concept of dysfunction/disease.
      *   **Bureaucratic Burden:** Requiring dual assessment (statistical + harm) would increase administrative costs contrary to efficiency objectives.

  **7. Responding to this Consultation**
  7.1 The Department welcomes responses from all interested parties, including clinicians, commissioners, patient groups, academic institutions, and industry representatives.
  7.2 Responses should be submitted via the DHECT Consultation Portal by 14 November 2023, 17:00 GMT. Paper submissions are discouraged.

  **Dame Winifred Thistlethwaite, DBE**
  Chair, Biostatistical Framework Implementation Committee

  ---

