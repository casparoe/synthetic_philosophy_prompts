  | 70-79             | Male                    | 3: Assoc. Prof & Technical                   | Grip Strength (< 5th %ile for 70-79M SOC3)                  |
  | 70-79             | Male                    | 7: Sales & Customer Service                  | Walking Speed (< 5th %ile for 70-79M SOC7)                  |
  | 70-79             | Male                    | 9: Elementary Occupations                    | **+ Occupation Exposure:**                                  |
  | 70-79             | Male                    | 9 + Mining Heritage (Postcode Sector)        | FVC (< 5th %ile for 70-79M SOC9 ex-mining PN1 2XX)          |
  | **70-79**         | **Female**              | **Geographical Region (NUTS1):**             |                                                             |
  | 70-79             | Female                  | North West                                   | Bone Mineral Density (< 5th %ile for 70-79F NW)             |
  | 70-79             | Female                  | South East                                   | **+ Local Authority:**                                      |
  | 70-79             | Female                  | South East + Coastal (LA Code)               | Dental Caries (Prevalence >95% = *Normal*, no disease)      |
  | **80+**           | **Male/Female**         | **Combined Granularity:**                    |                                                             |
  | 80+               | Male                    | SOC 3 + South East + Sedentary (Self-Report) | Renal Filtration Rate (< 5th %ile) - *Likely prevalent*     |
  | 80+               | Female                  | SOC 9 + Urban + NW + High BMI (>30)          | Knee Flexion (< 5th %ile) - *OA likely 'normal' pathology* |

  *(Note: SOC = Standard Occupational Classification (2020); NUTS1 = Nomenclature of Territorial Units for Statistics Level 1; FEV1 = Forced Expiratory Volume in 1 second; FVC = Forced Vital Capacity; OA = Osteoarthritis)*

  ---

  **ANNEX B: NOTE OF DISSENT – PROFESSOR E. ARMITAGE**

  Whilst acknowledging the Committee's pursuit of objectivity, I dissent from the adopted Biostatistical Disease Framework (BDF) and its proposed implementation.

  1.  **The Illusion of Value-Neutrality:** The BDF claims to eliminate value judgements. This is demonstrably false. The selection of *which* biological functions to measure is value-laden (why lung function and not, say, contentment?). Crucially, defining "disease" solely by *statistical subnormality* implicitly values conformity to the population (or sub-population) average. It is a value judgement that deviation *below* a statistical threshold warrants the label "disease" and state intervention, while deviation *above* (or within the "normal" range despite suffering) does not.
  2.  **Reference Class Selection is Normative:** Choosing reference classes (Age, Sex, Occupation, Postcode) is inherently normative. Why prioritise occupation over socioeconomic status defined by income? Why use biological sex rather than gender identity? Why is a miner's worn knees "normal pathology" while an office worker's identically painful knees might be disease, if prevalence differs? This encodes social and occupational structures, including their inequalities, into the definition of health, mistaking commonality for biological normativity. It risks pathologising the disadvantaged and naturalising preventable suffering prevalent within a group.
  3.  **The Erasure of Harm & Suffering:** The BDF's strength is its weakness: it severs the conceptual link between biological dysfunction and the *experience* of illness. Diagnosing widespread "non-illness pathology" (e.g., the predicted 98% of 80-year-olds with subnormal renal function, or chronic pain within the occupational norm) renders the term "disease" clinically meaningless and abandons patients experiencing significant harm because their suffering is statistically common. The NHS exists fundamentally to alleviate human suffering and incapacity, not to administer a statistical taxonomy detached from human experience.
  4.  **"Harmful Dysfunction" is Not Circular:** The rejection of hybrid models (Para 6.1) is premature. Wakefield's "harmful dysfunction", while debated, recognises the *dual* necessity: an objective (evolutionary/statistical) dysfunction *and* a value judgement concerning harm. The "harm" component is not medicalised circularly; it is assessed against broadly shared human values concerning pain, incapacity, and mortality. Operational challenges exist but are surmountable compared to the ethical vacuum created by the BDF.
  5.  **Operational Consequences:** Implementation will lead to perverse outcomes: defunding treatment for common, debilitating conditions (dental caries, age-related OA, presbyopia) while funding interventions for asymptomatic statistical anomalies. It creates perverse incentives for industry to fragment populations. It will exacerbate health inequalities by statistically "disappearing" pathology concentrated in deprived areas or hazardous occupations.

  I urge reconsideration of a model that integrates objective biological assessment with an unavoidable, but transparent and democratically accountable, consideration of harm and patient need. The BDF confuses methodological objectivity in measurement for ethical neutrality in defining the goals of medicine.

  **Prof. Eleanor Armitage**
  Chair of Normative Ethics & Applied Philosophy
  University of Casterbridge
