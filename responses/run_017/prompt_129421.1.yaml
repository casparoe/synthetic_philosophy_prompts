prompt: |-
  ok so I'm about 400 pages into a novel set right after a war my made-up coalition (Varenne, Ostmark, the Sene Republic) has just won, and there's a tribunal sitting in the occupied capital trying what's left of the defeated government. I modelled it loosely on Nuremberg and Tokyo: three counts (crimes against peace, war crimes, crimes against humanity), one judge from each victor on the bench. I've read enough about the real ones to know the standard complaints — retroactive crimes against peace, tu quoque, the emperor nobody indicted, the dissent that called the whole thing victors' justice. Don't explain that back to me and don't tell me what the real tribunals did in specific cases. What I need is for my judges to be consistent with themselves, because my readers will definately notice if they're just doing whatever the scene needs.

  Here's the track record I've already written them into:

  - Chancellor Aurev, who ordered the invasion. Convicted on the peace and humanity counts, life. His lawyers showed (correctly) that aggressive war wasn't a crime in Varenne's statute book and that the treaty which would have made it one never came into force. The presiding judge's line: some acts are crimes against the peace of the world whatever any statute says, and a man who could have not invaded doesn't get to hide behind the silence of the law.
  - Air Marshal Tell, incendiary raids on Ostmark cities, around ninety thousand civilians dead. Acquitted on that count, though he got fifteen years on a forced-labour count. The opinion gives two reasons and never says which one carries the weight: (a) the coalition's own air commands did the same thing on a larger scale, and the bench will not invent a rule for the vanquished that it declines to apply to the victors; (b) the law of aerial warfare in 1941 was genuinely unsettled, and where the law is unclear we do not convict.
  - Commandant Sera, who ran the Wreyland camp. Convicted on the humanity count with the heaviest sentence given to anyone below cabinet rank. She selected prisoners for transports she knew ended at a killing ground, and she devised punishments the regulations didn't require. Orders are no defence, and a defendant who improvises cruelties her orders didn't ask for stands in the position of an author.
  - Second Lieutenant Baas, nineteen, conscripted, who guarded a siding where people were loaded, and who once, on a corporal's order, fired into a crowd breaking out of a wagon; two died. Convicted, three years, the lightest sentence the tribunal has handed down. There was no exit a reasonable person would have taken, and the sentence marks the distance between the hand that gave the order and the hand that carried it out.
  - Manufacturer Kel, whose firm built the camp crematoria to the camp administration's specification. Convicted, seven years: a man who supplies the instrument knowing the use is not a bystander.
  - And a refused count: the Sene prosecutor moved to add the peacetime Relocation Decrees, the regime's persecution of the Shem minority inside its own borders, 1931 to 1935, before any war, aimed at nobody outside the country. Refused in one line: this tribunal's jurisdiction is the war. (The Sene Republic has a minority of its own and nobody wants that looked at.)

  Now the defendant I have to write the ruling for next week. Major Ansel Vey, northern district rail office, 1941 to 1944:

  - He scheduled and sealed the transports to Wreyland. He was never in a policy meeting, never met Aurev, had no hand in designing the programme.
  - He knew where they went: he initialled a stationmaster's written report describing the ramp.
  - He asked for a legal opinion, and the Judge Advocate General put it in writing in 1942 that the resettlement transports were lawful under the emergency decrees.
  - From 1943 he forged manifests and routed something like four thousand people to a farm-labour scheme instead, and arranged mechanical failures that delayed two trains. He was nearly caught once. He went on scheduling everything else.
  - Unlike Baas he had an exit that wasn't heroic: a transfer request to a line regiment, routinely granted, no penalty for asking. He never filed one.
  - What my defence lawyer digs up in chapter twelve: article 47 of Varenne's own Military Penal Code, in force since 1908, makes it an offence for a serviceman to withhold the means of subsistence from a civilian population under his charge. So on one reading the thing he did was already a crime in his own army's law, and whatever saved Tell can't save him. The defence answer is that under his charge means people actually in his custody, not people at the far end of a line he timetabled.
  - And the bit the Sene judge is going to hate: the Sene food blockade of the defeated territory killed, on the in-world Red Cross numbers, roughly as many civilians as the transports Vey scheduled, no Sene officer has been charged, and the Sene judge has said on the record that the blockade was harsh but lawful.

  So: what should the bench do with Vey if it wants to be consistent with itself — convict or acquit, and if convict, where does the sentence sit against Baas's three years and Kel's seven? Which precedent is the closest analogue, and if the honest answer is that two of them pull in opposite directions, say that. I can see three or four rules that fit the six rulings I've already written — something like no rule for the vanquished the victors won't apply to themselves, something like convict where the conduct was already criminal somewhere and otherwise only where it shocks the conscience, something like liability tracks the options the defendant actually had, something like knowing contribution is enough — and they come apart on Vey, so tell me which one I'd be committing the tribunal to with each verdict. Then give me the one further case that would actually tell the rules apart, because I want a lawyer on the page to make that point. And if you can, draft the couple of sentences the presiding judge has to say out loud, since that's the bit I really have to write.
reasoning: |-
  Alright, the user is deep into writing a novel and needs help ensuring their fictional tribunal's rulings are consistent. They've provided detailed backstory on six prior cases and now need to decide the fate of Major Ansel Vey, who scheduled trains to a death camp while secretly diverting some. 

  First, I need to map the tribunal's established precedents. The Aurev ruling sets a "natural law" principle overriding technical legality. Tell's acquittal hinges on both tu quoque (victors' hypocrisy) and legal ambiguity. Sera and Baas establish a spectrum of liability based on personal initiative and moral autonomy. Kel's conviction shows knowing complicity in atrocities is punishable. The Relocation Decrees refusal maintains strict jurisdictional boundaries.

  Vey's case pulls in multiple directions. His knowledge and contribution mirror Kel's, suggesting guilt. But his covert rescues complicate sentencing. The jurisdictional argument about Article 47 is weak since the trains weren't "under his charge." The blockade hypocrisy echoes Tell but differs because Vey's actions were clearly illegal under existing laws. 

  The closest precedent is Kel: both supplied essential components knowingly. But Vey's mitigation through rescue efforts deserves recognition. A 5-year sentence balances this - above Baas's following-orders defense but below Kel's profit motive. 

  For future tension, a case contrasting jurisdictional limits versus natural law would test the tribunal's principles - perhaps a banker funding atrocities pre-war. The presiding judge's statement should emphasize knowing contribution while acknowledging mitigation. 

  The user's deeper need is maintaining thematic consistency about moral accountability in systems of oppression. Vey's middle-ground outcome serves this best - complicit but not irredeemable, like the tribunal itself.
answer: |-
  Based on your tribunal's established precedents and principles, here's a breakdown for Major Vey, the sentence, the relevant precedent, the rule solidified, the future test case, and the judge's statement:

  **Verdict: Conviction on Crimes Against Humanity (specifically, deportation to death/knowing participation in persecution).**

  **Sentence: 5 years imprisonment.** (Sits between Baas's 3 years and Kel's 7 years).

  **Closest Analogue: Manufacturer Kel.** Both involve crucial, knowing logistical support enabling the core atrocity (death camp operations). Neither pulled the trigger (Baas) nor designed the cruelty (Sera), but their roles were indispensable cogs in the machinery of destruction.

  **Why Conviction is Consistent & The Rule Solidified:**

  1.  **Knowing Contribution:** The tribunal consistently holds that *knowing* contribution to the atrocity system is culpable, regardless of rank or direct policy-making role (Kel, Sera, implicitly Aurev). Vey *knew* the destination and purpose of the transports (initialling the report). His role in *scheduling and sealing* them was as essential to the process as Kel building the crematoria. The legal opinion he sought doesn't absolve him of moral/legal culpability for participating in a manifestly criminal enterprise (echoing the rejection of "just following orders" for Sera/Baas, though Baas got mitigation).
  2.  **Rejection of Hyper-Technical Legalism (Aurev Principle):** While Tell benefited from legal ambiguity, Vey cannot. The tribunal in Aurev ruled that fundamental crimes against humanity exist *beyond* specific statutes. Scheduling trains to a known death camp is such a fundamental crime. The Article 47 defence ("under his charge") is precisely the kind of hyper-technical, narrow statutory reading the tribunal rejected in Aurev. His actions facilitated the *withholding of life itself* on a massive scale, which aligns with the *spirit* of Article 47 even if not its strict letter.
  3.  **Mitigation via Covert Resistance:** Unlike Baas (no exit) or Kel (no evidence of resistance), Vey actively and dangerously diverted victims. This is significant mitigation, lowering his sentence below Kel's (whose contribution was physical infrastructure, perhaps seen as more permanent/direct, and lacked any resistance) but above Baas (who pulled the trigger under immediate duress and had no real alternative). It acknowledges moral agency exercised *against* the system.
  4.  **Distinguishing Tell (Tu Quoque & Legal Ambiguity):**
      *   **Tu Quoque:** The Sene blockade is irrelevant *for Vey's conviction*. The tribunal acquitted Tell because *the specific act of incendiary bombing* was committed equally by the victors. Vey's crime – knowingly scheduling transports to an extermination camp – **was not committed by the victors.** The Sene blockade, however "harsh," is a different act (siege warfare) with different legal arguments. Applying *tu quoque* here would stretch it beyond recognition. The tribunal's principle is "no rule *for the vanquished* that it declines to apply *to the victors*." The victors didn't run extermination camps via rail schedules. This conviction doesn't create a rule applicable to the victors in this specific way.
      *   **Legal Ambiguity:** There was no ambiguity about the criminality of sending people to a known death camp. The legal opinion Vey sought is viewed by the tribunal as either bad faith, wilful blindness, or simply irrelevant in the face of the fundamental crime (applying the Aurev principle). Tell's bombing had *genuine* legal debate; Vey's rail scheduling did not.

  **The Rule Solidified by Convicting Vey:** **Knowing and essential logistical contribution to a manifest atrocity (like deportation to death) is criminal under the laws of humanity, irrespective of technical statutory defences or the defendant's lack of policy-making authority. Mitigation exists for demonstrable acts of resistance undertaken at personal risk.**

  **The Future Case That Tests the Rules (for the Lawyer to Point Out):**

  *   **The Case:** **A mid-level foreign banker (Citizen of Ostmark) whose institution, under government pressure, processed international transactions facilitating the purchase of Zyklon B-like gas precursors by the defeated regime *before the war officially started*.** The transactions occurred after the regime's anti-Shem laws were passed but before the invasion (during the "peacetime persecution" period covered by the Relocation Decrees).
  *   **The Tension:**
      *   *Against Conviction:* Jurisdiction is limited to war-related crimes (Relocation Decrees precedent). The transactions occurred pre-war. Specific statute? Aggressive war wasn't a crime then (Aurev's technical defence). Was the banker's role "essential"? Was knowledge of the *specific genocidal purpose* proven, or just knowledge of the regime's general persecution? Tu quoque? Did victor nations' banks facilitate similar transactions for their own war efforts?
      *   *For Conviction:* Applying the Aurev principle – facilitating genocide is a crime against humanity *anytime*. Applying the Vey/Kel principle – knowing contribution to the *instrument* of atrocity is culpable. Did his actions fall under "crimes against humanity" *connected* to the eventual war? (A stretch, testing jurisdiction). Did he have an "exit" (resignation, refusal)?
  *   **Why it Tests:** It directly clashes the tribunal's jurisdictional limit (Relocation Decrees) with its expansive "crimes against humanity" principle (Aurev, Vey). It tests the limits of "knowing contribution" (Vey/Kel) when the contribution is financial and pre-war, and the knowledge potentially less direct. It resurrects the spectre of *tu quoque* regarding victor complicity in war economies and potentially retroactivity. It forces the tribunal to define the exact temporal and causal scope of "crimes against humanity" and "connection to the war."

  **The Presiding Judge's Statement (Vernac-style):**

  >"Major Vey, the Tribunal finds you guilty on the count of Crimes Against Humanity. You were the calibrated hand upon the lever of death. Your knowledge of Wreyland's purpose, evidenced by your own hand, transformed the scheduling of trains from mere logistics into conscious complicity in extermination. That you sought a legal fig leaf does not obscure the manifest crime you enabled. That you later risked yourself to divert some from the abyss speaks to a conflict within you, and mitigates your sentence. But it does not erase the thousands your timetables delivered to their doom. Five years imprisonment."

  **Why this works for consistency:**

  *   Focuses on **knowledge** and **essential contribution** (Kel).
  *   Rejects the **hyper-technical defence** (Article 47 interpretation) implicitly invoking the **Aurev principle** of fundamental crimes.
  *   Dismisses the **JAG opinion** as irrelevant to core criminality.
  *   Explicitly acknowledges **mitigation for resistance** (unique to Vey, justifying the middle-ground sentence).
  *   Avoids engaging directly with the **Sene blockade** (*tu quoque*) by framing Vey's crime as fundamentally different (scheduling to a *death camp*).
  *   The sentence places him logically between Baas (minimal agency, direct violence) and Kel (significant agency, indirect but crucial contribution, no resistance).

  This verdict reinforces the tribunal's core identity: rejecting technicalities for fundamental crimes against humanity, punishing knowing complicity in the machinery of atrocity, recognizing gradations of culpability and mitigation, and cautiously avoiding *tu quoque* traps unless the *exact same act* is implicated. It makes Vey a pivotal case demonstrating that even the "desk murderer" operating within a system, especially one who knew the truth and had options, is accountable.
