  ### Post-JSON Clarifications
  **Working Feature**: In Route B, when Taylor learns the truth, they must not only reject q but also re-evaluate Sam’s *true* assertions (e.g., "Was Sam’s advocacy sincere? Was the praise manipulative?"). This "contamination" forces distrust of past interactions. Route A’s lie, once exposed, leaves historical truths intact.  

  **Principle Application**:  
  - **Route A**: Wrong because it asserts falsehood.  
  - **Route B**: *More* wrong because it conscripts *truth* (Sam’s advocacy, the report) to validate q. The principle predicts this: weaponizing truth amplifies wrongness by undermining future/past epistemic security.  

  **Tests**:  
  - **Removal**: If Sam and Taylor had no prior interactions, B’s epistemic contamination vanishes; moral difference collapses.  
  - **Transplant**: Impossible. Lies lack truths to contaminate; misleading’s structure inherently embeds q among truths.  

  **Verdict Dimensions**: Reversal holds across all three. B is more wrong because it compounds deception with epistemic betrayal; Sam more blameworthy for abusing truth; Taylor more wronged because their trust in shared history is exploited.  

  **Objections Handled**:  
  - Asymmetry defender’s "hidden harm" fails: The retrospective doubt is not a *new* harm but intrinsic to how misleading wrongs the hearer.  
  - Skeptic must explain why exploiting truth isn’t aggravating—the pair denies them this escape.
