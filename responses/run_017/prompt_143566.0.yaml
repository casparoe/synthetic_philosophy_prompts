  ### Activity Design: "The Picture Communication Challenge"

  **Goal:** Demonstrate that pictograms are not inherently transparent, require learned conventions ("visual education"), involve data transformation (rounding/scaling), and cannot convey negation/causation unambiguously—all without mentioning Neurath/ISOTYPE until the debrief.

  **Materials & Prep** (30 min prep before session):  
  - **Cards:** 8 sets of cards (one per pair), each with 4 claims (Round 1–4). Print on scrap paper.  
  - **Icon Sheets:** 8 copies of a standardized icon sheet (hand-drawn or printed). Icons: person, book, car, tree, house, dog, rain, apple, bicycle, sun, store, factory.  
  - **Chart:** 1 large printed chart for Round 5 (see below).  
  - **Paper/Pens:** 8 sheets of paper + pens per pair.  
  - **Confederate:** Recruit 1 participant early. Secretly brief them: *"For crossed-out icons, you’ll interpret them as ‘allowed’ or ‘present’ (others use ‘forbidden’ or ‘absent’)."*  
  - **Whiteboard:** Use to display Round 5 chart and track scores.  
  - **Timer:** Smartphone or library clock.  

  **Source Data:** Library branch data risks familiarity; use **global city population data** for sharp failures (e.g., rounding errors, scale ambiguity):  
  - Tokyo: 37,000,000  
  - Delhi: 33,000,000  
  - São Paulo: 22,000,000  
  - Cairo: 22,000,000  
  - London: 9,000,000  
  - Sydney: 5,000,000  
  - Nairobi: 5,000,000  
  - Oslo: 1,000,000  

  ---

  ### **Session Timeline (90 min)**  
  **0–5 min: Setup & Intro**  
  - Arrange pairs (8 pairs total). Distribute paper/pens.  
  - Intro script: *"Today, we’ll test how well pictures convey facts. In pairs, one person encodes a claim using only pictures—no words, numbers, or letters. The other decodes it. We’ll do 4 quick rounds, then a group challenge. Go!"*  

  **5–15 min: Round 1 – Freehand, No Conventions**  
  - **Goal:** Show that ad hoc drawings are ambiguous.  
  - **Rules:** Encoder gets Card 1. Decoder gets nothing. Encoder draws freehand (no icons). 2 min/drawing.  
  - **Claims (Card 1, one per pair):**  
    1. "3 apples."  
    2. "A dog sits on a house."  
    3. "The sun is above clouds."  
    4. "2 people read 1 book."  
    5. "A car faces left."  
    6. "A tree has 4 apples."  
    7. "Rain falls on a store."  
    8. "A bicycle leans on a tree."  
  - **Scoring:** Decoder writes reconstruction. Pair scores 1 point if **exact match** (e.g., "3 apples" vs. "three apples").  

  **15–25 min: Round 2 – Standardized Icons, Repeating Figures**  
  - **Goal:** Introduce conventions (quantity = repetition), but show miscounts/misidentifications persist.  
  - **Rules:** Encoder gets Card 2. Decoder gets icon sheet. Encoder must use icons (no scaling); repeat figures for quantity. 2 min/drawing.  
  - **Claims (Card 2):**  
    1. "4 books."  
    2. "3 cars."  
    3. "2 houses, 1 tree."  
    4. "1 dog, 2 people."  
    5. "3 bicycles."  
    6. "1 sun, 2 clouds."  
    7. "4 apples."  
    8. "2 stores, 1 factory."  
  - **Scoring:** 1 point for exact match.  

  **25–40 min: Round 3 – Large Numbers, Scaling/Rounding**  
  - **Goal:** Force "transformation" (scale decisions + rounding losses).  
  - **Rules:** Encoder gets Card 3. May write **only one number** (scale key, e.g., "① = 1,000,000"). Must round to whole icons. 3 min/drawing.  
  - **Claims (Card 3):**  
    1. "Tokyo: 37,000,000 people."  
    2. "Delhi: 33,000,000 people."  
    3. "São Paulo: 22,000,000 people."  
    4. "Cairo: 22,000,000 people."  
    5. "London: 9,000,000 people."  
    6. "Sydney: 5,000,000 people."  
    7. "Nairobi: 5,000,000 people."  
    8. "Oslo: 1,000,000 people."  
  - **Scoring:** 1 point if decoded population is within 10% of original (e.g., 37M → 40M with scale "①=10M" + 4 icons = 0 points).  

  **40–55 min: Round 4 – Negation & Causation**  
  - **Goal:** Expose pictures’ inability to convey "no," "because," or "if."  
  - **Rules:** Encoder gets Card 4. No numbers/words. 3 min/drawing.  
  - **Claims (Card 4):**  
    1. "No dogs in the park."  
    2. "The store closed because of rain."  
    3. "Apples not sold on Sunday."  
    4. "Cars forbidden near schools."  
    5. "Library opens late due to snow."  
    6. "Factory not hiring because of fire."  
    7. "Bicycles not allowed indoors."  
    8. "Event canceled if rain."  
  - **Scoring:** 1 point for **correctly decoded negation + causation** (e.g., "no dogs" + "rain caused closure").  

  **55–65 min: Round 5 – Confederate Misinterpretation**  
  - **Goal:** Show conventions are learned, not innate.  
  - **Rules:** Display pre-printed chart (below). All decode silently. 1 min/viewing.  
  - **Chart:** Shows 4 icons:  
    - Crossed-out dog (intended: "no dogs allowed").  
    - Crossed-out car (intended: "no cars allowed").  
    - Bicycle (no cross; intended: "bicycles allowed").  
    - Person (no cross; intended: "people allowed").  
  - **Confederate Action:** Writes "Dogs allowed, cars allowed, bicycles allowed, people allowed" (per secret briefing).  

  **65–85 min: Debrief**  
  1. **Reveal Claims & Scores (5 min):**  
     - Round 1: Low scores. *"Why did ‘a car faces left’ fail? (Encoder drew front view; decoder saw ‘right’)."*  
     - Round 2: Medium scores. *"Did repeating icons prevent errors? (Pair 3: decoder counted 3 houses for ‘2 houses, 1 tree’)."*  
     - Round 3: Low scores. *"Tokyo pair: you used ①=5M and drew 7 icons → 35M (not 37M). You had to round—data was ‘transformed’."*  
     - Round 4: Near-zero scores. *"How many conveyed ‘because’? (Most drew rain + closed store, but decoder saw two facts, not causation)."*  
     - Round 5: *"Why did [confederate] decode ‘allowed’ for crossed-out icons? They learned a different rule."*  

  2. **Introduce Neurath (3 min):**  
     - *"Today echoed Otto Neurath’s 1920s ‘Vienna Method’ (later ISOTYPE). He argued:  
       (1) Pictures aren’t self-explanatory—they require ‘visual education’.  
       (2) Data → chart needs ‘transformation’ (decisions on scale/rounding).  
       (3) Pictograms can’t say ‘no’, ‘because’, or ‘if’—so he called it a ‘helping language’, not a true language."*  

  3. **Address Predictable Failures & Recovery (5 min):**  
     - **Round 3 chaos:** Pairs will omit scales or misround (e.g., Oslo: ①=1M → 1 icon for 1M, but 999K would round to 1M too). *Recovery: Ask, "How did you choose your scale? What detail vanished?"*  
     - **Round 4 frustration:** Negation often uses ✘/🚫, but causation fails. *Recovery: "Show me a drawing that almost worked. Why wasn’t it enough?"*  
     - **Confederate tension:** Group may disagree with their answer. *Recovery: "This is why Neurath said conventions must be taught—they’re not universal."*  

  4. **Your Questions (2 min):**  
     - *"Is ‘pictograms are never transparent’ too strong?"* **No.** Simple icons (e.g., 🚻) work through cultural saturation, not innate understanding. Complexity (scale, causality) fails without learning.  
     - *"Non-native English speakers?"* The activity **honors Neurath’s hope but reveals limits.** Icons bridged language gaps in Rounds 1–2 (e.g., "sun" decoded correctly across languages), but negation/causation struggled equally for all. No faking—this honestly tests pictorial internationalism.  

  **85–90 min: Cleanup**  
  - Collect materials. Thank participants.  

  ---

  ### **Critical Judgment**  
  - **Pictogram transparency:** Your instinct holds. Icons *feel* intuitive due to exposure (e.g., road signs), but this is learned. When context/scaling is novel (Rounds 3–5), "transparency" vanishes.  
  - **Neurath’s unspoken point:** The activity can’t fully convey why he rejected "language" status for ISOTYPE. You must state: *"Pictures lack grammar for negation/causation—they’re a ‘helping’ tool, not a full system."*  

