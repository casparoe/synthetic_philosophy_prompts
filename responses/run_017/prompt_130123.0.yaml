answer: |-
  Here is the complete diagnostic handout for your philosophy of punishment seminar, designed as a self-contained instrument requiring no prior terminology.

  ---

  **1. Branching Questions**  
  *Answer each case based on your intuitive judgment. Your pattern of answers will map to a position in the philosophy of punishment.*

  **Q1: The Painless Prevention Case**  
  A shoplifter can be reformed by an odorless gas in public spaces that reduces impulsive behavior for all exposed. This prevents all his future thefts without discomfort or awareness. *If we use this instead of fines or community service, is something important missing?*  
  - **Yes**: The state still owes him burdensome treatment.  
  - **No**: Prevention alone is sufficient.  
  *Separates views requiring suffering from those accepting substitution.*

  **Q2: The Perfect Secret Case**  
  A tax official embezzles funds but is caught instantly. No one else learns of it; he poses no future risk; and punishing him won’t deter others (the case remains secret). *Should he still face burdens (e.g., repayment, probation)?*  
  - **Yes**: Burden is still warranted.  
  - **No**: No reason remains.  
  *Separates views valuing suffering for its own sake from instrumental views.*

  **Q3: The Storm Path Case**  
  A violent act was caused entirely by childhood trauma, brain chemistry, and situational stress—like a hurricane’s path is set by weather patterns. *Does this remove all justification for burdens, or not?*  
  - **Removes justification**: No blame attaches.  
  - **Changes but keeps justification**: Blame applies differently.  
  - **Leaves untouched**: Blame is unaffected.  
  *Separates hard determinists, compatibilists, and non-consequentialists.*

  **Q4: The Shaped Character Case**  
  An offender’s abusive upbringing made him quick to anger, but he coolly chose to assault someone. *Is he blameworthy only if he could have changed his own upbringing?*  
  - **Yes**: Full blame requires control over character formation.  
  - **No**: Blame requires only control over the act itself.  
  *Separates libertarians from compatibilists and consequentialists.*

  **Q5: The Uncomprehending Offender Case**  
  A tribal elder violates a city ordinance he cannot grasp (e.g., "jaywalking") and develops advanced dementia before sentencing. He cannot understand the sanction. *Is imposing it still a punishment?*  
  - **Yes**: Its meaning persists.  
  - **No**: It’s mere containment or training.  
  *Separates expressive/communicative views from purely protective ones.*

  **Q6: The Stale Debt Case**  
  *(A)* A 90-year-old is convicted for a murder committed at 20. *(B)* A woman serves 11 years for a crime later proven to be another’s. *In (A), is punishment still justified? In (B), does she "deserve credit"?*  
  - **A: Yes / B: No**: Desert is timeless.  
  - **A: No / B: Yes**: Desert expires or is quantifiable.  
  - **A: No / B: No**: Desert is irrelevant.  
  *Separates retributivists, desert-accountants, and desert-deniers.*

  **Q7: The State’s Share Case**  
  Poor state housing policies increased neighborhood theft rates by 20%. *When punishing a thief, must the state reduce sanctions by 20%?*  
  - **Yes**: Culpability is diluted.  
  - **No**: Personal responsibility is unchanged.  
  *Separates views sensitive to systemic causation from individualist views.*

  **Q8: The Paper Recidivist Case**  
  A clerk falsifies records weekly but causes no physical or financial harm (e.g., faking inspection logs). She will never stop and never endanger anyone. *May the state escalate sanctions?*  
  - **Yes**: Repetition justifies severity.  
  - **No**: Harmlessness caps severity.  
  *Separates deterrence/retributive escalation from harm-minimizing views.*

  ---

  **2. The Tree**  
  *Start here →* **Entry Commitment**: The state may impose burdens for serious offenses.  
   ├─→ *Reject?* → **Abolitionist (Full)**  
   └─→ *Accept?* → **Q1**: Painless Prevention Case  
     ├─→ *Yes?* → **Q2**: Perfect Secret Case  
     │  ├─→ *Yes?* → **Q3**: Storm Path Case  
     │  │  ├─→ *Removes?* → **Q4**: Shaped Character Case  
     │  │  │  ├─→ *Yes?* → **Abolitionist (Moral Luck)**  
     │  │  │  └─→ *No?* → **Q5**: Uncomprehending Offender Case  
     │  │  │    ├─→ *Yes?* → **Communicative/Penitential**  
     │  │  │    └─→ *No?* → **Unnamed: Character Retributivism**  
     │  │  ├─→ *Changes?* → **Compatibilist Just Deserts**  
     │  │  └─→ *Untouched?* → **Retributivist (Strong Desert)**  
     │  └─→ *No?* → **Q7**: State’s Share Case  
     │    ├─→ *Yes?* → **Desert-Capped (Floor-Focused)**  
     │    └─→ *No?* → **Deterrence-Only**  
     └─→ *No?* → **Q8**: Paper Recidivist Case  
       ├─→ *Yes?* → **Expressivist/Denunciatory**  
       └─→ *No?* → **Q6**: Stale Debt Case  
         ├─→ *A:Yes/B:No?* → **Desert-Capped (Ceiling-Focused)**  
         ├─→ *A:No/B:Yes?* → **Unnamed: Quantified Desert**  
         └─→ *A:No/B:No?* → **Public Health/Quarantine**  

  ---

  **3. Leaf Glossary**  
  - **Abolitionist (Full)**: No state-imposed burdens are ever justified. *Answers*: Reject Entry Commitment. *Awkward commitment*: Must tolerate preventable, severe offenses.  
  - **Abolitionist (Moral Luck)**: Burdens are unjust if causation undermines agency. *Answers*: Q1→Yes, Q2→Yes, Q3→Removes, Q4→Yes. *Awkward commitment*: No blame even for deliberate cruelty if caused externally.  
  - **Communicative/Penitential**: Burdens must convey censure to elicit reform/recognition. *Answers*: Q1→Yes, Q2→Yes, Q3→Changes/Untouched, Q4→No, Q5→Yes. *Awkward commitment*: Punishing the demented is meaningless.  
  - **Unnamed: Character Retributivism**: Blame attaches only to flaws shaped by the offender. *Answers*: Q1→Yes, Q2→Yes, Q3→Removes, Q4→No, Q5→No. *Awkward commitment*: Unlucky upbringing grants immunity even for calculated acts.  
  - **Compatibilist Just Deserts**: Desert exists if acts reflect choices, regardless of ultimate causes. *Answers*: Q1→Yes, Q2→Yes, Q3→Changes, Q4→No. *Awkward commitment*: Punishing someone who "could not have chosen otherwise" in a deterministic world.  
  - **Retributivist (Strong Desert)**: Suffering is intrinsically deserved for wrongdoing. *Answers*: Q1→Yes, Q2→Yes, Q3→Untouched, Q4→No. *Awkward commitment*: Desert persists even if punishment causes net harm.  
  - **Desert-Capped (Floor-Focused)**: Consequentialism governs, but minimal desert must be met. *Answers*: Q1→Yes, Q2→No, Q7→Yes. *Awkward commitment*: Punishing innocents if benefits outweigh costs and "desert floor" is met (e.g., scapegoats).  
  - **Deterrence-Only**: Burdens are justified only to prevent future harm. *Answers*: Q1→Yes, Q2→No, Q7→No. *Awkward commitment*: Inflicting severe suffering for minor offenses if it deters effectively.  
  - **Expressivist/Denunciatory**: Burdens symbolically condemn the act to reinforce norms. *Answers*: Q1→No, Q8→Yes. *Awkward commitment*: Punishing harmless acts severely if they outrage society.  
  - **Desert-Capped (Ceiling-Focused)**: Consequentialism governs, but desert sets maximum severity. *Answers*: Q1→No, Q8→No, Q6→A:Yes/B:No. *Awkward commitment*: Withholding punishment from the deserving if benefits are low.  
  - **Unnamed: Quantified Desert**: Desert is measurable and expires or transfers. *Answers*: Q1→No, Q8→No, Q6→A:No/B:Yes. *Awkward commitment*: "Overpunished" offenders can "withdraw" credit for future crimes.  
  - **Public Health/Quarantine**: Burdens prevent harm like disease control, rejecting desert. *Answers*: Q1→No, Q8→No, Q6→A:No/B:No. *Awkward commitment*: Indefinite detention for harmless "carriers" of risk (e.g., nonviolent addicts).  

  ---

  **4. Cut Points**  
  Three nodes decisively separate **Compatibilist Just Deserts** (Dennett-esque) and **Public Health/Quarantine** (Caruso-esque):  
  1. **Q1 (Painless Prevention)**: Dennett → *Yes* (suffering has intrinsic role); Caruso → *No* (only consequences matter).  
  2. **Q3 (Storm Path)**: Dennett → *Changes* (desert survives determinism); Caruso → *Untouched* irrelevant (rejects desert).  
  3. **Q6 (Stale Debt)**: Dennett → *A:Yes/B:No* (desert timeless); Caruso → *A:No/B:No* (no desert).  

  Other questions don’t separate them:  
  - Q2: Both say *No* (no secret punishment).  
  - Q4/Q5/Q7/Q8: Their answers overlap (e.g., both reject character control).  
  - *Why?* Their core clash is whether *desert exists at all*, not its structure.  

  ---

  **5. Empty Regions**  
  - **Pattern 1**: Q1→Yes, Q2→No, Q3→Removes. *Verdict*: **Incoherent**. If causation removes desert (Q3→Removes), but burdens require desert (Q1→Yes), secret punishment (Q2→No) lacks justification.  
  - **Pattern 2**: Q1→No, Q2→Yes, Q3→Untouched. *Verdict*: **Unexplored**. Instrumentalists (Q1→No) shouldn’t punish undeterrable secrets (Q2→Yes). Logically possible but unattractive (e.g., "secret expressive punishment").  
  - **Pattern 3**: Q1→Yes, Q2→Yes, Q3→Changes, Q4→Yes. *Verdict*: **Unattractive**. Demands control over character formation (Q4→Yes) but allows diluted desert (Q3→Changes). No theorist combines these.  

  ---

  **6. Indistinguishable Leaves**  
  - **Compatibilist Just Deserts** vs. **Retributivist (Strong Desert)**  
    *Indistinguishable by this tree*: Both answer Q1→Yes, Q2→Yes, Q3→Changes/Untouched, Q4→No.  
    *Separating case*: *The Gratuitous Suffering Case*: Punishment causes intense suffering with no social benefit. Does justification vanish?  
    - Retributivist: No (desert is sufficient).  
    - Compatibilist: Yes (desert necessary but not sufficient; consequences matter).  

  - **Verdict on 9th Question (Scapegoat Substitution)**:  
    Already implied by **Q1 (Painless Prevention)**. If suffering can be replaced without loss (Q1→No), guilt is irrelevant. Adding it would be redundant.  

  ---  
  This handout is fully self-contained. Students need only answer the cases to find their position.
