  Here’s a sestina grappling with the species problem, aiming for philosophical and biological accuracy while letting the rotating end-words enact the unresolved debate. It follows your end-words precisely and avoids intrinsic traits or forced resolutions.

  **Sestina for the Species Problem**

  **(Stanza 1 - Darwin's Nominalism)**
  Darwin saw the term, a mere convenience, **species**
  A gradual shift, no deep-cut **lineage**
  Drawn in stone. Just degrees, no firm **barrier**
  Defined. A **hybrid** bloomed, blurring the supposed **kind**,
  A testament to flux, challenging the fixed **name**
  We gave to difference, mistaking word for thing.

  **(Stanza 2 - Mayr's Biological Species Concept)**
  But Mayr insisted: a reproductive **barrier**
  Must hold distinct the true **lineage**,
  Isolating populations. This defines the **species**,
  Preventing fertile **hybrid** forms. A natural **kind**
  Not by mere resemblance, but by this guarded **name**
  For groups that mingle not beyond their fence.

  **(Stanza 3 - Species as Individuals (Ghiselin/Hull))** 
  Then came the thought: not universal **kind**
  At all! Each **species** is an individual,
  A historical entity, born at the split, its **lineage**
  A singular life through time. Organisms: parts, not members. **Name**
  This sprawling entity, its cohesion not a **barrier**
  But persistence. No laws here, just contingent **hybrid**
  Events shaping its path. (A fertile **hybrid** might still arise,
  But as an event *within* the lineage's flow, not challenging its core existence as a historical individual).

  **(Stanza 4 - Phylogenetic Species Concept/Cline Thinking)** 
  The cladist counters: where’s the birth? Just segments in the **lineage**,
  Points on a branch. The ancestral **kind**
  Ceases *being* at the very **barrier**
  Of budding off a new **name**.
  A moment’s split, the former **species**
  Dissolves, replaced by daughter paths. Is any **hybrid**
  Truly a challenge, or just divergence measured?

  **(Stanza 5 - Asexuals & HGT: No Barrier)** 
  But microbes mock our neat **barrier**.
  No sex, no check; rampant exchange. What **lineage**
  Endures pure? Horizontal genes forge a **hybrid**
  Genome soup. How apply the **species**
  **Name**? Is such a transient cloud a **kind**
  At all? Or just a shifting, ghostly **name**?
  **(Stanza 6 - Ring Species: Kindness Falters)** 
  And see the rings: A links to B, B breeds with C, yet A rejects C’s **name**.
  A continuous chain, yet at the ends, a potent **barrier**
  Implied. "Same **species**" fails – intransitive! No natural **kind**
  Can hold such logic. Just geography's long **lineage**
  Forcing change. Where draws the **hybrid**
  Zone? The concept strains, revealing cracks.

  **(Envoy)**
  The seminar drawer slams shut. The **name** persists, yet **kind** dissolves.
  **Lineage**, **barrier**, **hybrid** clash – no single **species** concept solves.
  The field guide holds them, side by side, unsorted, unresolved.

  ---

