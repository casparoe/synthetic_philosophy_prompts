  On cause vs. sediment, I need to clarify that the cause (like industrialization) matters, but it must leave a clear stratigraphic signal. This validates their unease about steam engines not being "rock," while affirming that the sediment is the proof. 

  For who decides, it's stratigraphers because they define geological time scales, even if other fields use the term differently. This explains the 2024 vote outcome and resolves their mixed feelings about it. 

  Finally, predicting nitrogen cycle acceleration ties to agriculture's intensification. It's detectable and significant, fitting the rule, and addresses their point about farming starting too early—here, it's the scale that matters. 

