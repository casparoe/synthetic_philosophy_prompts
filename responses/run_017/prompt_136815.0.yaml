  Breaking it down: The core mechanics (weighted averaging, hedging) are indeed standard in moral uncertainty literature. The "fanaticism problem" is also a known issue, though the speaker oversimplifies by saying "everyone knows it falls apart"—researchers actively debate solutions. The credence floor is indeed ad hoc; the user's insight about theory-splitting vulnerability is sharp and exposes deeper issues with how theories are individuated. 

