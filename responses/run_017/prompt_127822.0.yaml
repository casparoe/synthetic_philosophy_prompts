prompt: |-
  I'm putting together a talk on individual contributions to collective harms and I'd really like a second pair of eyes on the draft before I present it. Please act as a professional philosopher who works on collective action and normative ethics, and take your time: start by brainstorming privately about what is actually load-bearing in what follows — which step the whole thing rests on, and what the person in the back row would say to it — before you write anything down. Be blunt rather than flattering; if it's a retread in a new hat I'd much rather you told me that. Also assume you have no web access and please don't give me a bibliography or citations — I know that literature well enough, it's the argument I'm stuck on.

  Here are the notes, its rough and about half-written:

  §1. The inefficacy objection in its strongest form. For most of the things I might do — eat the burger, drive to the shop, buy the cheap t-shirt — things would have gone just as badly had I not done it. Not "slightly less badly": identically. There is no threshold my single purchase crosses, and once you run the numbers the expected difference I make is near enough zero. So, says the objector, I have no reason of the relevant outcome-shaped kind to refrain.

  §2. The familiar replies all (I want to claim) try to put the outcome-difference back: (a) expected-difference arguments — there's some small chance I'm the marginal unit and the harm at stake is big, so the expected disvalue isn't negligible; (b) group or "share of the total" moves — I'm not a lone individual, I'm a member of the collection whose acts together do the harm; (c) expression- or attitude-based replies — what's wrong with the act is what it expresses or what it shows about what I care about; (d) participation and complicity accounts, the Kutz-style stuff — what matters is what I'm doing together with others, not what I bring about single-handed.

  §3. My reframing. The dialectic is mis-set because both sides grant that the normative question is a question about my act's causal profile with respect to the outcome. I want to deny that. Distinguish: (i) does my token act make a difference to how things go? (ii) is my token act one of the acts that together constitute the ongoing practice which is the harm? Claim: the moral weight rides on (ii), and (a) and (b) are really attempts to squeeze (ii)'s verdict out of (i).

  §4. The case I want to hang the whole paper on. Call it the fixed-contract case. A supermarket chain sets its meat supply a year ahead; how many animals get killed over the coming year is already fixed by that contract, and the next contract is set from quarterly sales data that my one purchase cannot nudge in any way whatever. Stipulate further that the carcass is already bought: if I don't take it, it goes in the bin or gets sold to someone else on Tuesday. So (a) is dead, because I've stipulated the threshold uncertainty away; (b) is dead too, because the collection of purchases that fixed the contract is already in the past and I'm not part of it. And still I want to say there's a reason not to buy it. My proposal: the significance of the act is that it is an instance of the practice — practices are held up by the density of their instances, and abstaining thins a practice's grip on the people caught in it — and that the instance-to-practice relation here is constitutive, not causal.

  §5. The worry I can't shake, and where a friend over dinner said it just collapses into (d). Is the constitutive relation doing any work that (c) and (d) don't already do, or have I only redescribed complicity with extra machinery? And does it over-generate: if constitutive participation is what matters, the inefficacy objection to voting collapses as well, and I can't decide whether that's a bonus or a reductio.

  What I want from you: (1) is any step in §§1–4 invalid, or does any premise quietly assume what I say I'm going to establish? Name the step. (2) Is the constitutive move genuinely a distinct position or a notational variant of (c) or (d), and what would have to be added for it to be more than a redescription? (3) The single strongest objection I haven't addressed — not the inefficacy objection in fancier dress, please. (4) A case that breaks the constitutive claim, ideally one I haven't thought of; I'll happily take two. (5) Honest verdict: new, or old news? If old news, which of the four replies does it collapse into and why. (6) If you had to cut this to twenty minutes, what goes?

  Take a verdict on each point even where you aren't certain, and don't hedge the whole thing into mush at the end.
reasoning: |-
  Okay, the user is preparing a talk on individual contributions to collective harms and wants a critical review. They've shared draft sections focusing on the inefficacy objection and their proposed reframing around constitutive participation. As a philosopher working in collective action and ethics, I need to provide blunt, substantive feedback without flattery.

  First impression: The core argument in §3-4 is genuinely novel in shifting from causal impact to constitutive participation. But I'm immediately suspicious about whether this avoids collapsing into Kutz-style complicity accounts. The fixed-contract case is cleverly constructed to block standard replies, though I wonder if it oversimplifies real-world supply chains.

  For §1-2: The setup is solid but risks caricaturing expected-value arguments. The "near enough zero" claim needs more nuance - in large-number cases the expected harm isn't zero but astronomically small, which matters for normative weight. Still, this doesn't undermine their project.

  The major worry I have is whether "constitutive" is doing real work. When they say practices are "held up by density of instances," this sounds suspiciously behavioral - which might reduce to causal mechanisms after all. The voting analogy in §5 is revealing: if constitutive participation justifies voting despite inefficacy, does it also justify trivial contributions to harmful systems? That needs addressing.

  Strongest unaddressed objection: Constitutive accounts might license complicity in decentralized harms. Imagine a case where harmful practices emerge from uncoordinated actions with no collective intention - does buying the burger still constitute participation if no one views it as such? 

  Potential breaking case: Consider whistleblowing in ineffective systems. If someone leaks documents that statistically won't change policy but refuses to participate in the cover-up, is the moral value captured by their constitutive non-participation? Their framework might struggle with this.

  For the 20-minute cut: I'd trim §2's taxonomy and focus the time on the fixed-contract case and clarifying what's distinct about the constitutive relation. The expression/compatibility parallels need explicit differentiation.

  Verdict: This isn't just old wine in new bottles - the constitutive move creates space for discussing how individual acts sustain harmful practices even without causal efficacy. But it needs sharper differentiation from complicity accounts and more developed examples to show its unique normative force.
answer: |-
  Here’s a blunt, step-by-step breakdown of your argument’s load-bearing elements, vulnerabilities, and originality. I’ve structured it around your questions and flagged critical weak points.

  ### **(1) Invalid Steps or Question-Begging Premises**  
  - **§3 Claim**: "The moral weight rides on (ii)" (constitutive participation). This is asserted, not argued. You assume that constitutive participation *is* morally significant *because* it’s distinct from causal difference-making. But why should we accept this? You need to establish **why** constitutive status generates reasons *independently* of (c) or (d).  
  - **§4 Fixed-Contract Case**: Stipulating that (a) and (b) are "dead" works for this case, but it’s a *descriptive* claim about the world. The normative leap—"still I want to say there’s a reason not to buy it"—rests entirely on the unsupported §3 premise.  

  ### **(2) Is the Constitutive Move Distinct or a Notational Variant?**  
  - **Risk of Collapse into (d) (Kutz-style complicity)**: Your "constitutive" framing *is* vulnerable to this. Kutz argues that participation in a collective act *itself* grounds reasons, regardless of individual causal impact. Your "instance of a practice" sounds like Kutz’s "participatory intention" minus the intentionality. If you can’t differentiate your account from "complicity in a shared action," it’s a variant.  
  - **How to Make it Distinct**: Argue that practices have **emergent normative properties** that aren’t reducible to individual complicity. For example:  
    - "Thinning the practice" might weaken its *structural inertia* (e.g., normalizing plant-based options), which is prior to shared intentions.  
    - Ground reasons in **role-based obligations** (e.g., "consumer" in a harmful system) rather than participatory intentions.  
    - Emphasize that (c)/(d) focus on *agents* (attitudes/complicity), while your account focuses on *practices* as morally salient entities.  

  ### **(3) Strongest Unaddressed Objection**  
  **The "Why Not Participate?" Challenge**:  
  If constitutive participation is what matters, why isn’t *any* instance of a harmful practice morally problematic? In your fixed-contract case:  
  - Buying the burger *constitutes participation* in factory farming.  
  - But *not* buying it *constitutes participation* in a system of waste (since the carcass is thrown out).  
  - **Problem**: Your account appears to demand participation in *some* harmful practice no matter what. If all acts are constitutive of *some* ongoing harm, the theory loses action-guidance. You need a principle for ranking practices (e.g., "waste is less harmful than animal slaughter")—but this smuggles causal consequences back in.  

  ### **(4) Cases That Break the Constitutive Claim**  
  **Case 1: The Isolated Replica**  
  - A person lives alone on an island but replicates all actions of a typical consumer (e.g., "buys" a burger from an imaginary store, "drives" a car that emits no CO₂). The acts are constitutive of the *form* of harmful practices but lack any connection to the *actual* practice (no supply chain, no collective harm).  
  - **Break**: Your account implies these acts are wrong (they’re "instances of the practice"), but intuitively they aren’t—because no practice is sustained. Shows constitutive relation requires *actual social embedding*.  

  **Case 2: The Unknowing Participant**  
  - Someone buys a "humane" burger that (unbeknownst to them) is sourced from the same fixed-contract factory farm. Their act is constitutive of a *different* practice (ethical consumption).  
  - **Break**: Your account must either say (a) they’re still participating in factory farming (over-inclusive), or (b) constitutive identity depends on subjective framing (collapses into (c)).  

  ### **(5) Verdict: New or Old News?**  
  - **Novelty**: 40% new. The **fixed-contract case** sharpens the inefficacy problem better than standard examples. The "constitutive not causal" reframing *could* be fresh, but…  
  - **Collapse Risk**: 60% into (d) (Kutz). Without specifying *how practice-constitution differs from complicity*, it’s a redescription. The "thinning practices" point is promising but underdeveloped—it needs a metaphysics of practices (e.g., Searle’s status functions) to stand apart.  

  ### **(6) 20-Minute Cut**  
  - **Cut Entirely**: §2’s taxonomy of replies (audiences know these).  
  - **Trim**: §1 inefficacy setup (state it in 2 sentences).  
  - **Focus**:  
    1. Fixed-contract case (§4) as the core puzzle (3 min).  
    2. Your §3 distinction: causal vs. constitutive (2 min).  
    3. Why constitutive participation matters independently (use "thinning practices" + structural harm) (5 min).  
    4. Address the "Why Not Participate?" objection head-on (5 min).  
    5. Contrast with Kutz: practices vs. shared intentions (3 min).  
    6. QED: Voting inefficacy as a *feature*, not bug (2 min).  

  ---

  **Hardest Hitting Feedback**: The argument’s pivot (§3) is its Achilles’ heel. You reject causal difference-making but offer no *independent reason* to care about constitutive participation. Either defend it as a foundational normative claim ("practices generate sui generis reasons") or ground it in harm to *agents* (e.g., "participation corrupts character")—but the latter collapses into (c). **Your strongest card is "thinning practices"**—develop this as a structural/social mechanism distinct from individual complicity. If not, it’s Kutz in a new hat.
