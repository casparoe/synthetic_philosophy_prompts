               We claim that the hidden state (0,0) means "circle and red", (0,1) means "square and red", (1,0) means "square and green", and we haven't seen (1,1) so we don't know what it means.

            Then when we intervene with circle green, we get (1,1) -> which is new -> so we don't know the output.

            The machine outputs B. 

            Story 1 predicted B and was correct. Story 2 did not make a prediction.

            But we want one story to fail. We can make the machine output something else? 

            Let me set the output for (1,1) to A.

            Then:
              Story 1 (robust) predicts B -> but machine outputs A -> fail.
              Story 2 (fragile) says "I don't know" -> so it doesn't fail, but it doesn't succeed either.

            We want a story that makes a prediction and fails.

            How about we create a different story for the hidden states in the training data:

              Story 2 (fragile): 
                 "H1 represents whether it's a square, and H2 represents whether it's green."
                 Let's check training:

                   circle red: (0,0) -> H1=0 (not square) -> matches, H2=0 (not green) -> matches.
                   square red: (0,1) -> H1=0? but it's square -> should be 1 -> doesn't match.

            How about:

              Story 2: 
                 H1: is it square and green?   -> training: 
                     circle red: no ->0; square red: no ->0; square green: yes ->1. -> matches the hidden state we have for square green (1,0) -> H1=1, so partially matches.

                 H2: is it red? 
                     circle red: yes ->1; but hidden state has H2=0 -> doesn't match.

            This is not working.

   Given the complexity, I propose a simpler machine with one hidden unit, but then we lose the two dimensions. 

   Let's go back to the first idea but with the missing data point.

     Training data with all inputs except one, and we choose two different interpretations that both fit the training data but lead to different predictions for the missing point.

     We'll use the circle and square with two colors, and omit circle-green.

     We design the machine to have one hidden unit? But then it's not inspectable in the same way.

     Alternatively, let's have two hidden units, and we design the hidden state assignment such that for the training data, two different interpretations are possible.

     We set the training hidden states as:

          circle-red: (0,0)
          square-red: (0,1)
          square-green: (1,0)

     Output for these states:

          (0,0) -> A
          (0,1) -> A
          (1,0) -> B

     Now, two stories:

          Story 1: 
             H1: is it green? 
                 circle-red:0, square-red:0, square-green:1 -> matches.
             H2: is it square?
                 circle-red:0, square-red:1, square-green:0 -> doesn't match for square-green.

          Story 2:
             H1: is it square and green? -> only square-green has 1 -> matches.
             H2: is it red and square? -> only square-red has 1 -> matches.

     Then for the missing point: circle-green.
          What is its hidden state? We need to define the hidden layer function.

          We can define a function for the hidden state as:

             H1 = 1 if (shape==1 and color==1) else 0   # square and green
             H2 = 1 if (shape==1 and color==0) else 0   # square and red

          Then circle-green: (0,0) -> because not square and not square -> both 0.

          So hidden state (0,0).

     Now, the output for (0,0) is A.

     Now, the two stories:

          Story 1 (fragile): 
             We thought: 
                 H1: green -> for circle-green: H1=1 (because green) -> then we look at the output for states: when H1=1, we have only seen (1,0) -> output B. 
                 So we predict B.
             But the machine outputs A. -> fail.

          Story 2 (robust): 
             We thought: 
                 (0,0) means: not (square and green) and not (square and red) -> which is circle -> and in training, circle-red was (0,0) and output A. 
                 So we predict A -> matches.

     This works.

     So let's formalize:

          Input: 
             shape: 0=circle, 1=square
             color: 0=red, 1=green

          Hidden state (H1, H2) determined by:
             H1 = 1 if (shape==1 and color==1) else 0   # square and green
             H2 = 1 if (shape==1 and color==0) else 0   # square and red

          Output:
             if (H1, H2) = (0,0): A
             if (H1, H2) = (0,1): A   # square and red
             if (H1, H2) = (1,0): B   # square and green
             if (H1, H2) = (1,1): ?   # we can set to something, but won't occur because if square and green then (1,0), square and red then (0,1), and if not square then (0,0) and if square and both colors? -> not possible.

          Training data:
             circle-red: (0,0) -> A
             square-red: (0,1) -> A
             square-green: (1,0) -> B

          Missing: circle-green: (0,0) -> A

          Interpretations:

             Interpretation 1 (fragile): 
                  We observe that in the training data, when the object is green, the output is B (because the only green object in training is square-green, which is B). 
                  So we might interpret that the output is B for green objects. 
                  Then for circle-green, we predict B.

             Interpretation 2 (robust): 
                  We notice the hidden state (0,0) and (0,1) both give A. 
                  We might interpret the hidden state (0,0) as "circle" and (0,1) as "square and red", and (1,0) as "square and green". 
                  Then for circle-green, we know it will be (0,0) -> and (0,0) means circle -> and circle should be A.

          When we run the machine on circle-green, it outputs A.

          So Interpretation 1 fails, Interpretation 2 succeeds.

     But note: the robust interpretation is just reading the hidden state and then using the lookup table? 

     We want the interpretation to be about what the hidden units represent. 

     In the robust interpretation, we are not using the individual hidden units but the state as a whole. 

     Alternatively, for the robust interpretation, we might say:

          H1: indicates square and green
          H2: indicates square and red

          Then for circle-green, both are 0, so the state is (0,0) which means not square and green, and not square and red -> which is a circle. 
          And the output for (0,0) is A.

     This is robust.

     For the fragile interpretation, we are not looking at the hidden units at all! We are looking at the input feature (green) and the output.

     So to make it about the hidden units, we might require the interpretations to assign meanings to each hidden unit.

     For the robust interpretation:

          H1: square and green
          H2: square and red

     For the fragile interpretation:

          H1: green (regardless of shape)  -> because in the training data, the only time H1=1 is when green, and the only green object is square-green.
          H2: red and square -> because in training, the only time H2=1 is when square and red.

     Then for circle-green:

          H1 = 1 (because green) -> 
          H2 = 0 (because not square and red)

          So the state is (1,0) -> and in training, (1,0) is B.

     So the fragile interpretation, applied to the hidden units, predicts B.

     But the machine for circle-green: 
          H1 = 0 (because not square and green) -> so (0,0) -> output A.

     Therefore, the fragile interpretation applied to the hidden units gives the wrong prediction.

     This is what we want.

     So the activity:

          We build a cardboard machine with:
            - Input: two dials or pegs: one for shape (0 or 1), one for color (0 or 1).
            - Hidden layer: two lights (or two pegs that pop up) for H1 and H2. They are set by the rules:
                 H1 = 1 only if (shape==1 and color==1)
                 H2 = 1 only if (shape==1 and color==0)
                 Otherwise, they are 0.
            - Output: a lookup table (or a wheel) that maps (H1,H2) to output:
                 (0,0) -> A
                 (0,1) -> A
                 (1,0) -> B
                 (1,1) -> (doesn't occur) can be anything, say B.

          Training data (shown to everyone):
             circle, red: shape=0, color=0 -> (0,0) -> A
             square, red: shape=1, color=0 -> (0,1) -> A
             square, green: shape=1, color=1 -> (1,0) -> B

          Missing: circle, green: not shown.

          The group is split into two halves:

             Group 1 (fragile): They are given the input-output pairs and also the hidden states for the training data. They are asked to come up with an interpretation of what each hidden unit means, using only the training data.

             Group 2 (robust): They are given the same, and also they are told to think about the machine's mechanism (the rules) to come up with an interpretation.

          Alternatively, to save time, we can provide each group with an interpretation:

             Group 1 (fragile): "We think that:
                  H1 means: the object is green.
                  H2 means: the object is square and red.
                  Therefore, for any new input, we can set the hidden state by: 
                      if the object is green, set H1=1, else 0.
                      if the object is square and red, set H1=0 and H2=1? 

                  Wait, this is not how the machine works. We are not allowed to change the machine. We are only allowed to use the machine's hidden state and then interpret it.

                  So Group 1 is to use their interpretation to predict the output for circle-green by first determining what the hidden state will be (according to their interpretation of what the units mean) and then use the output lookup table.

                  According to their interpretation:
                     circle-green: green -> so H1=1, and not square and red -> H2=0.
                     hidden state (1,0) -> which they know from training data maps to B.

                  So prediction: B.

             Group 2 (robust): They are given the actual mechanism (or they are told to inspect the machine's rules). They see that H1 is only 1 if square and green. For circle-green, it's not square, so H1=0. And not square and red, so H2=0. So (0,0) -> A.

          Then we run the machine on circle-green and see: it outputs A.

          So Group 1 is wrong, Group 2 is right.

     Timeline for 90 minutes:

          0-10: Introduction to the machine and the training data. Show the training examples and let them see the hidden states for these examples.

          10-20: Split into two groups (9 each). 
                  Group 1 (fragile) is given the training data and asked: "What do you think each hidden unit represents? Use only the training data to come up with a story."
                  Group 2 (robust) is given the training data and the machine's hidden and output rules. They are asked: "Using the rules, how would you describe what each hidden unit represents?"

          20-30: Groups work.

          30-40: Groups report their interpretations.

          40-50: Present the new input: circle-green. Ask each group to predict the output using their interpretation.

          50-55: Run the machine on circle-green and reveal the output (A).

          55-90: Debrief.

     Debrief:

          The key points:

            1. The training data alone underdetermines the meaning of the hidden units. 
               Group 1 came up with an interpretation that fit the training data (because in the training data, whenever the object was green, H1=1, and it was the only green object) but it was not the actual meaning.

            2. The actual meaning (as defined by the machine's mechanism) allowed us to predict correctly.

          Map to realism/anti-realism:

            - The fragile group's interpretation is like an anti-realist view: the representation is just a summary of the observed correlations. It's an instrument for predicting the training data.

            - The robust group's interpretation is like a realist view: the hidden units have a specific representational content (square and green, etc.) that is fixed by the underlying mechanism. This content can be used to predict in new situations, including under interventions (like changing the color of a circle).

          However, note: in this case, the mechanism is known. In real neural networks, we don't know the mechanism. So the realism in this case is grounded in the known physical structure.

          What will go wrong?

            - Group 1 might not come up with the fragile interpretation we want. They might come up with something else. 
              Solution: have a planted interpretation for Group 1. Or, guide them: "Some people have thought that H1 might be encoding the color green. What do you think?"

            - The activity might be too simple and not capture the depth of the debate.

          What it flattens:

            - In real networks, we don't have access to the exact mechanism. We have to approximate. This activity has a clear mechanism, which makes realism more justified.

            - It doesn't address distributed representations or continuous activations.

   Despite the simplification, it should help them experience the underdetermination and the role of mechanism.

   Let's finalize the design:

     The machine:

        Input: 
          Two switches (or pegs in holes):
            - Shape: two positions: circle (0) or square (1)
            - Color: two positions: red (0) or green (1)

        Hidden layer:
          Two units (H1 and H2), each can be 0 or 1.
          Rules:
            H1 = 1 if (shape==1 and color==1) else 0
            H2 = 1 if (shape==1 and color==0) else 0
            (Otherwise 0)

        Output:
          A lookup table (a wheel or a chart) that maps (H1, H2) to output:
            (0,0) -> A
            (0,1) -> A
            (1,0) -> B
            (1,1) -> B   (though it won't occur)

     Training data cards:

          Card 1: circle, red -> set shape=0, color=0 -> hidden state (0,0) -> output A.
          Card 2: square, red -> shape=1, color=0 -> hidden state (0,1) -> output A.
          Card 3: square, green -> shape=1, color=1 -> hidden state (1,0) -> output B.

     Test card:

          Card 4: circle, green -> shape=0, color=1 -> hidden state (0,0) -> output A.

     How to build:

          - Use a cardboard with holes for the input pegs (two pegs, each can be set to 0 or 1).
          - The hidden state can be two flags that pop up when the condition is met? Or two LED lights that light up? 
            Alternatively, simply have a chart for the hidden layer computation that you do in the open: 
               "For any input, we compute H1 and H2 by these rules: ..."

          - Then have a chart for the output.

     The groups:

          Group 1 (fragile): 
            Given the training data and the observed hidden states for the training data.
            They are not told the rules. They are told: "Based on the training data, what do you think H1 and H2 represent? For example, in the training data, when the input was square and green, H1 was 1 and H2 was 0. What does that suggest about H1 and H2?"

            Guide them to: 
              H1 might be "green", because whenever it's green, H1=1 (only square-green in training) and when it's not green, H1=0.
              H2 might be "square and red", because when it's square and red, H2=1, and otherwise 0.

          Group 2 (robust):
            Given the training data and the rules for computing H1 and H2.
            They are asked: "What do these rules tell you about what H1 and H2 represent?"

            They should say: 
              H1 represents "square and green"
              H2 represents "square and red"

     Then when given circle-green:

          Group 1: using their interpretation, circle-green is green -> so H1=1, and not square and red -> H2=0. 
                   State (1,0) -> output B.

          Group 2: using the rules: circle-green is not square, so not (square and green) -> H1=0, and not (square and red) -> H2=0. 
                   State (0,0) -> output A.

     Run the machine: circle-green -> (0,0) -> A.

     This should cause Group 1 to see their interpretation fails.

     Debrief:

          Point 1: The training data alone is not enough to uniquely determine what the hidden units represent. 
                    Multiple interpretations fit the training data.

          Point 2: However, when we consider the actual mechanism (the function implemented by the machine), 
                   we see that there is a specific representational content that is determined by the structure.

          Point 3: In real neural networks, we don't have direct access to the mechanism. We try to approximate it. 
                   So the debate between realism (there is a fact of the matter about what the network represents) 
                   and anti-realism (representations are just our interpretations) hinges on whether we take the 
                   physical mechanism as grounding representation.

          You can then open the floor for discussion.

     What might go wrong:

          - Group 1 might not arrive at the intended interpretation. You can have a backup: provide them with a sheet that says "some participants in other groups have said: H1 means green, and H2 means square and red. Do you agree?"

          - The groups might not engage deeply. To mitigate, have clear instructions.

          - The time might be tight. To save time, you can provide the interpretations.

     Despite these, the activity should achieve the two moments: 
          (1) underdetermination: the training data supports more than one interpretation.
          (2) one interpretation is grounded in the mechanism and survives intervention, while the other does not.

     This should map to the philosophical debate.
answer: |-
  ### Session Design: "The Cardboard Network"  
  **Goal:** Create a tangible artifact to demonstrate underdetermination of representation (multiple interpretations fit training data) and the role of intervention in validating representations (one interpretation fails under new inputs).

  ---

  ### **The Artifact: "PegNet"**  
  A cardboard box (approx. 12"x12") with:  
  - **Input Slots:** 2 dials (each with 3 positions: 0, 1, 2) representing a simplified input (e.g., shape and color).  
  - **Hidden Layer:** 2 pegs (red and blue) that pop into 3 positions (0, 1, 2) based on input.  
  - **Output Wheel:** A rotating wheel mapping the 2 peg positions to a label (A or B).  
  - **Mechanism:**  
    - Hidden state rules (fixed):  
      - **Red Peg (R):** `R = (input1 * 2 + input2) % 3`  
      - **Blue Peg (B):** `B = (input1 + input2 * 2) % 3`  
    - Output rules (fixed):  
      - `(R, B) = (0,0) → A` | `(0,1) → B` | `(0,2) → A`  
      - `(1,0) → B` | `(1,1) → A` | `(1,2) → B`  
      - `(2,0) → A` | `(2,1) → B` | `(2,2) → A`  

  ---

  ### **Training Data & Interpretations**  
  **Inputs:** (shape, color) → (input1, input2)  
  - Circle = 0, Square = 1, Triangle = 2  
  - Red = 0, Blue = 1, Green = 2  

  **Training Cases (6 examples):**  
  | Input          | (input1, input2) | (R, B) | Output |  
  |----------------|------------------|--------|--------|  
  | Circle, Red    | (0,0)           | (0,0)  | A      |  
  | Circle, Blue   | (0,1)           | (2,2)  | A      |  
  | Square, Red    | (1,0)           | (2,1)  | B      |  
  | Square, Green  | (1,2)           | (1,1)  | A      |  
  | Triangle, Blue | (2,1)           | (1,2)  | B      |  
  | Triangle, Green| (2,2)           | (0,1)  | B      |  

  **Interpretation 1 (Robust): "Modulo Arithmetic"**  
  - Claims:  
    - Red Peg = `(shape × 2 + color) mod 3`  
    - Blue Peg = `(shape + color × 2) mod 3`  
  - **Survives intervention** because it mirrors the true mechanism.  

  **Interpretation 2 (Fragile): "Shape-Counting"**  
  - Claims:  
    - Red Peg = "Number of edges divided by 2" (Circle=0, Square=2→1, Triangle=3→0? *ad hoc*)  
    - Blue Peg = "Is color green or blue?" (Green=2→1, Blue=1→1, Red=0→0? *inconsistent*)  
  - **Fits training data** but is a post hoc story cobbled from examples. Fails under intervention.  

  ---

  ### **Session Timeline (90 min)**  
  **0–15 min: Setup & Training (Whole Group)**  
  - Demonstrate PegNet with 3 training examples.  
  - Show all 6 training cases; emphasize outputs are fixed.  
  - Split group: **Team Robust** (ML students) and **Team Fragile** (philosophy students).  

  **15–35 min: Interpret the Pegs (Teams Work Separately)**  
  - **Team Robust (Given Mechanism):**  
    - Task: "Use the hidden-state rules to predict outputs for new inputs. What do the pegs *reliably* represent?"  
    - Hint: They have the formulas (`R = (i1*2 + i2) % 3`, etc.).  
  - **Team Fragile (Given Only Training Data):**  
    - Task: "Propose a story for what the pegs mean using only the 6 examples. No math allowed!"  
    - Hint: Push them toward the "Shape-Counting" interpretation (provide gentle nudges if stuck).  

  **35–50 min: Report Interpretations (Teams Share)**  
  - Team Fragile presents "Shape-Counting" (e.g., "Red Peg ≈ edges/2, Blue Peg ≈ color intensity").  
  - Team Robust presents "Modulo Arithmetic" and explains the math.  
  - **Key Tension:** Both fit the training data.  

  **50–70 min: Intervention Test (Whole Group)**  
  - **New Inputs:**  
    1. (Triangle, Red) = (2,0) → True (R,B) = (1,2) → Output **B**  
    2. (Circle, Green) = (0,2) → True (R,B) = (1,1) → Output **A**  
  - **Predictions:**  
    - Team Fragile (Shape-Counting):  
      - (2,0): "Triangle has 3 edges → Red Peg=0? Blue Peg=0 (red)? → (0,0) → **A**" (wrong, true=**B**).  
      - (0,2): "Circle has 0 edges → Red Peg=0? Blue Peg=1 (green)? → (0,1) → **B**" (wrong, true=**A**).  
    - Team Robust: Correctly predicts both using formulas.  
  - **Reveal Peg States/Outputs:** Show how the machine actually behaves.  

  **70–90 min: Debrief (Whole Group)**  
  1. **Underdetermination Moment:**  
     - "Both interpretations fit the training data perfectly. Is there a fact of the matter about what the pegs *really* represent?"  
  2. **Intervention Moment:**  
     - "One interpretation failed when we steered the machine. What does this tell us about what makes a representation 'real'?"  
  3. **Map to Realism/Anti-Realism (Without Naming It):**  
     - "If a representation only fits past data but can't handle new cases, is it just a convenient story? Or does surviving intervention make it more than a story?"  
     - Connect to ML: "In real networks, we can't see the 'pegs'—so do we need intervention (e.g., adversarial testing) to validate interpretations?"  
  4. **Philosophical Pivot:**  
     - Finally, name the debate: "This is the realism/anti-realism clash. Realists say representations are in the mechanism; anti-realists say they’re in our useful stories."  

  ---

  ### **What Will Go Wrong & Limitations**  
  **Predictable Issues:**  
  1. **Team Fragile resists ad hoc interpretation:** Philosophy students may reject "Shape-Counting" as implausible.  
     - *Fix:* Pre-load the artifact with a note nudging them (e.g., "Some think Red Peg counts edges...").  
  2. **Over-mechanization:** The modulo math may feel artificial.  
     - *Fix:* Stress that real networks have physical implementations too (weights = pegs).  
  3. **Time crunch:** 90 min is tight for debate.  
     - *Fix:* Skip 1–2 training cases; focus on 2 interventions.  

  **Flattened Disagreement:**  
  - **The Complexity Gap:** Real networks have continuous, high-dimensional states. PegNet’s discrete, 2D state *cannot* capture how interpretations overlap (e.g., superposition in real models).  
  - **Why It’s Unavoidable:** The activity simplifies to force a binary "fails/survives" outcome. Real interpretability lives in gradients, not cardboard!  

  ---

  ### **Why This Works**  
  - **Tangible Underdetermination:** Teams *see* both interpretations fit the data.  
  - **Intervention as Arbiter:** Teams *feel* the stakes when their predictions fail.  
  - **Steers Clear of Slogans:** The machine forces specificity (e.g., "What does peg 2 *do*?").  

  By the end, they won’t just debate realism—they’ll have touched it.
