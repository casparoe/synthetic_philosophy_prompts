  **THE NO-FAULT GAZETTE**  
  *Advice for the Causally Compromised*  
  **ASK PROFESSOR RETROACTUS**

  *Professor Retroactus, a tenured specialist in causal chains, answers your questions on life, work, and the inescapable web of antecedent conditions. Remember: No question is too trivial, no responsibility too ultimate. Submit via Campus Form L-7 ("Unfree Will Inquiry").*

  ---

  **1. The Lying Child**  
  *Dear Professor Retroactus,*  
  My nine-year-old lied about finishing her math homework. Ordinarily, I’d revoke tablet privileges—but doesn’t the Senate Resolution imply she *couldn’t have done otherwise* given her neural wiring (shaped by genes/my parenting/ cosmic dust)? Yet doing nothing feels negligent. Advice?  
  —*Perplexed Parent in Philosophy*

  Dear Perplexed,  
  Your dilemma is admirably consistent with Premise 1: You act as you do because you’re constitutionally averse to both unfair punishment *and* negligent parenting. Fortunately, the University’s Behavioral Adjustment Protocol (BAP) offers a path. Submit Form CS/E-9 ("Causa Sui Exemption Request") to the Office of Outcome Management. Check Box 4b: "Proximate Behavioral Conditioning." This allows you to impose tablet restrictions *not* as deserved punishment, but as a forward-looking causal intervention aimed at altering future stimulus-response pathways. Crucially, attach Appendix γ, detailing the environmental triggers (e.g., "sight of math worksheet → dopamine drop → false statement emission"). This frames the restriction as modifying inputs, not judging outputs. Remember: Your own filing diligence is, of course, equally necessitated.  
  —*Prof. R.*

  ---

  **2. The Self-Improver**  
  *Dear Prof. Retroactus,*  
  I spent two grueling years becoming calmer and more generous. I meditated, journaled, practiced empathy drills. My friends say I’m "like a new person." Can I take *any* credit? Or is this just luck?  
  —*Former Grouch*

  Dear Former Grouch,  
  Your transformation is commendable—and entirely explained by unchosen factors. Your initial grouchiness? A product of genetic irritability thresholds and childhood experiences you didn’t select. Your decision to pursue change? Caused by exposure to self-help literature (which you didn’t choose to find persuasive) and synaptic configurations favoring perseverance (which you didn’t install). Even your capacity to sustain "grueling" effort was pre-loaded. However! Per University Policy HR-7.3 ("Acknowledging Non-Authored Outcomes"), you may file a Moral Luck Disclosure Statement (MLDS) with Social Recognition Services. On Section B, list the causal contributors: "Serotonin reuptake allele rs6313," "Proximity to calming botanical garden," "Inadvertently inspiring TED Talk viewed 3/15/22." This permits you to state, "I *am* calmer now," while publicly disavowing origination. Credit implies authorship; the MLDS permits accurate description sans metaphysics.  
  —*Prof. R.*

  ---

  **3. The Libertarian**  
  *Dear Professor,*  
  I believe my choices are *truly* free—indeterministic! My brother and I both smoked. I freely chose to quit; he didn’t. Surely *I* deserve pride? Doesn’t indeterminism break the regress?  
  —*Proud Ex-Smoker (Free Will Model)*

  Dear Proud Ex-Smoker,  
  Libertarian metaphysics changes nothing. Assume indeterminism: Your "free" choice to quit occurred via an uncaused neural event. But *why did this randomness manifest as resolve rather than apathy?* Because of how you *were*—say, a marginally stronger aversion to mortality cues (unchosen) or a slightly more activated dorsolateral prefrontal cortex (unasked for). The indeterministic event didn’t spring from *you*; it happened *to* a pre-structured system. Your brother’s differing outcome? Luck. Submit MLDS Form (see above), listing "Stochastic neurotransmitter release favoring health-concern modules on 6/12" and "Absence of identical release in sibling." Pride, like blame, demands authorship you lack. Forward-looking pride is permissible under BAP guidelines: "I participate in contexts reinforcing non-smoking pathways." But retrospective pride? File CS/E-9, Box 2: "Temporary Illusory Attribution (Personal Use)."  
  —*Prof. R.*  
  *(Note: This answer would be identical under determinism—simply omit "stochastic.")*

