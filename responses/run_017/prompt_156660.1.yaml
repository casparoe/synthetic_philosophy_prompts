  **4. The Department Chair**  
  *Dear Prof. Retroactus,*  
  Hiring dilemma: Candidate A is reliably kind but had an easy upbringing. Candidate B overcame a wretched background to become nearly as kind. Can I prefer B, recognizing her greater *effort*? Or does the Resolution forbid rewarding "merit"?  
  —*Equitable but Confused Chair*

  Dear Equitable Chair,  
  "Effort" is not an uncaused cause; it emerges from unchosen tenacity generators. Candidate B’s "overcoming" resulted from fortunate neuroplasticity, randomly encountered mentors, or epigenetic resilience—none self-authored. Candidate A’s "easiness" is equally contingent. However, University Hiring Code § 5.1 permits "Luck-Adjusted Potential Impact" (LAPI) scoring. Calculate:  
  1. Baseline Kindness Score (e.g., via referee reports).  
  2. Apply Luck Discount Factor (LDF) from Registrar’s Adversity Index (RAI).  
  Candidate B’s higher RAI *reduces* her LDF, making her kindness score reflect greater *systemic fragility overcome*. This isn’t rewarding desert; it’s weighting outcomes by counterfactual instability (i.e., kindness maintained *despite* worse luck). Preferring B isn’t praising her effort’s origin; it’s investing in a *demonstrated capacity to sustain prosocial outputs under suboptimal inputs*—a forward-looking institutional interest. Attach both candidates’ self-submitted "Genesis Disclaimers" (Form G-D1) to the file.  
  —*Prof. R.*

