prompt: |-
  I recently joined the committee that signs off on every probabilistic statement my hospital publishes — in the decision-support product, in patient-facing trial material, and in our own papers — and I have to draft the minute on a new submission this week, so I want to know what we have actually been committed to.

  Our rulings so far: we approved "this patient has a 0.5 chance of being allocated to arm B" where allocation used a certified 1:1 randomizer, and said 0.5 was correct rather than merely permissible; we struck the same sentence where allocation ran through a vendor randomizer we could not audit, on the grounds that the number would report our ignorance rather than the procedure and that no single number was ours to publish; we approved "0.3 probability that the emergency department exceeds capacity tomorrow," from our ensemble model, on condition that it be revised as the day's data arrive; we approved "0.2 probability that this patient's chest pain is coronary in origin, given the workup so far," on condition that it be revised after the troponin; and we refused to let any number appear as "the probability that this patient would have avoided the complication had we operated a day earlier," on the grounds that nothing we could ever observe settles it.

  The new submission: last night our pipeline ran the current model version on Ms K's data. The run is deterministic — fixed version, fixed seed — and the recommendation is already sitting in the log, unreviewed. We want to show the reviewing clinician "0.7 probability that the stored recommendation is unsafe," where 0.7 is the output of a monitoring classifier whose calibration we validated on last quarter's cases. Nothing random happened, the seed-and-input combination occurred once, and the monitor's score falls in a region where we have only a handful of comparable past cases, so there is no well-populated class whose frequency we could quote instead; but the claim has a determinate truth value, and we could check it by opening the log.

  Should we approve it, if we want to be consistent with ourselves? Please state the rules our precedents are jointly compatible with, what each predicts here, which precedent is the closest analog, what we would be committing to under each choice, and which single further case would best separate the rules that survive. I suspect we have been running some sort of chance-or-frequency rule without ever saying so, but I cannot see how that rule alone makes sense of the coronary case.
reasoning: |-
  We are given a committee's past rulings on probabilistic statements and need to decide on a new submission. Let's first summarize the precedents:

  1. **Approved**: "this patient has a 0.5 chance of being allocated to arm B" when allocation used a certified 1:1 randomizer. The committee said 0.5 was correct, not just permissible.

  2. **Struck**: The same sentence when the randomizer was from a vendor that couldn't be audited. Reason: the number would report our ignorance and no single number was ours to publish.

  3. **Approved**: "0.3 probability that the emergency department exceeds capacity tomorrow" from an ensemble model, conditional on updating with the day's data.

  4. **Approved**: "0.2 probability that this patient's chest pain is coronary in origin, given the workup so far", conditional on updating after the troponin test.

  5. **Refused**: Any number as "the probability that this patient would have avoided the complication had we operated a day earlier", because it's counterfactual and not verifiable.

  Now, the new submission: 
  - We have a deterministic pipeline (fixed model version, fixed seed) that produced a recommendation for Ms K, and it's in the log unreviewed.
  - We want to show: "0.7 probability that the stored recommendation is unsafe."
  - The 0.7 comes from a monitoring classifier that was calibrated on last quarter's cases. 
  - The run is deterministic so no randomness occurred. The input and seed combination occurred only once. The monitor's score is in a region with few comparable past cases, so we cannot quote a frequency from a well-populated class.
  - The claim has a determinate truth value (we could check by opening the log) but we haven't checked yet.

  We need to decide if we should approve this statement to be consistent.

  ### Step 1: Inferring the Rules from Precedents

  Looking at the cases, we can infer the following rules:

  - **Rule 1 (Randomness)**: If the event is governed by a known random process (like a certified randomizer), then we can state the probability (Precedent 1). But if the randomness is not verifiable (like the vendor's black box), then we cannot (Precedent 2).

  - **Rule 2 (Empirical Frequency / Calibration)**: If the probability is based on a model that has been validated and calibrated on past data, and the probability is interpreted as a frequency over a well-defined reference class, then it is acceptable (Precedents 3 and 4). However, both Precedent 3 and 4 require that the probability be updated as new data arrives, meaning they are conditional on current information and subject to change.

  - **Rule 3 (Verifiability)**: If the event is not verifiable (like a counterfactual), then we cannot assign a probability (Precedent 5). Conversely, if the event is verifiable (like we can check the log to see if the recommendation is unsafe), then that might be acceptable.

  But note: Precedent 5 was refused because it was counterfactual. The new case is not counterfactual because the recommendation exists and we can check it. However, the issue is that the monitor's output is being used to assign a probability to an event that is already determined (but unknown).

  ### Step 2: Analyzing the New Case

  The new case: 
  - The event: "the stored recommendation is unsafe" is a fixed fact (because the pipeline run is deterministic) but unknown until we check the log.
  - The 0.7 is the output of a monitoring classifier that has been calibrated on past cases. 

  The committee has validated the calibration of the monitor. That means that when the monitor outputs 0.7, then in the past, about 70% of the cases in the calibration set that had a score in that region were indeed unsafe. 

  However, note that in the new case, there is no well-populated class of comparable cases (only a handful). This might challenge the frequency interpretation because the reference class is small.

  But the committee has approved probabilities from models (like the ensemble model for the emergency department and the model for chest pain) that are also based on past data and are updated. So why is this different?

  The key difference in the new case is that the event is already determined. The recommendation is either safe or unsafe. There is no randomness in the event itself. The monitor's output is being used to express uncertainty about a fixed but unknown state.

  ### Step 3: Comparing with Precedents

  - **Precedent 1 (Randomizer)**: The event (allocation) was about to happen and was random. Here, the event (the stored recommendation being unsafe) has already happened (deterministically) but is unknown. So it's not about randomness.

  - **Precedents 3 and 4 (Models)**: These are about events in the future (emergency department capacity) or a current state that is not yet fully revealed (coronary origin). The probabilities are conditional on current information and are updated. In the new case, the event has already occurred (the recommendation was generated and stored) but we haven't observed it. The monitor is using current information to predict the safety of a fixed event.

  - **Precedent 5 (Counterfactual)**: This is not a counterfactual because we are not speculating about an alternative past. We are making a statement about the actual state of the stored recommendation.

  The closest analog seems to be Precedents 3 and 4 because they involve model outputs that are calibrated to frequencies. However, note that in Precedents 3 and 4, the events are not yet determined (the future ED capacity, the true cause of chest pain). In the new case, the event is determined but unknown.

  But the committee has no precedent for a probability about a fixed but unknown state. However, in the context of the model, the monitor is designed to predict the safety of recommendations. The calibration of the monitor means that it is well-calibrated for the reference class of recommendations that had similar monitor scores. Even though the event is fixed, the probability is about our knowledge of it, and the monitor provides a frequency-based assessment.

  ### Step 4: Rules that Survive

  The precedents seem to be compatible with the following rules:

  - **Rule A (Frequency Principle)**: We can state a probability if it represents an empirical frequency over a well-defined reference class. The reference class must be sufficiently large and the calibration must be validated.

  - **Rule B (Conditional on Current Information)**: The probability must be conditional on the current state of knowledge and updated as new information arrives.

  - **Rule C (Verifiability)**: The event must be verifiable (i.e., not counterfactual).

  - **Rule D (No Epistemic Probabilities for Singular Events)**: We do not allow probabilities that represent purely epistemic uncertainty (like in the vendor randomizer case) without an empirical frequency basis.

  In the vendor randomizer case (Precedent 2), the committee struck because they could not base the probability on a known frequency (because they couldn't audit) and hence it was purely epistemic. In the counterfactual case (Precedent 5), there is no frequency that can be defined because it's a singular event and not observable.

  ### Step 5: Applying the Rules to the New Case

  - **Rule A (Frequency)**: The monitor was calibrated on last quarter's cases. The output 0.7 means that in the past, 70% of the cases with a similar score were unsafe. The committee validated the calibration. However, the new case has a score in a region with only a handful of past cases. This might mean that the reference class is too small to be reliable. But the committee did not require a large reference class in Precedents 3 and 4? In fact, they approved the ED model and the chest pain model without mentioning the size of the reference class for each prediction. So the rule might not require a large reference class for each individual prediction, but rather that the model is calibrated overall and that we update as we get more data.

  - **Rule B (Conditional)**: The submission does not mention updating, but the committee required updating in Precedents 3 and 4. So we might require that the 0.7 be updated if we get more information (e.g., if we run additional checks). However, in the new case, the event is already determined and the only update would be to check the log. Once we check, the probability becomes 0 or 1. So the condition of updating might be satisfied by the fact that the model will be rerun if new data arrives? But note: the submission is about the stored recommendation. If we check the log, then we know the answer. So we might require that the probability be updated after the review.

  - **Rule C (Verifiability)**: The event is verifiable (we can check the log).

  - **Rule D (No Purely Epistemic)**: The 0.7 is not purely epistemic because it is based on a calibrated model. It has a frequency basis.

  The main issue is the small reference class. But note: the committee did not require a large reference class in the past. They approved the ED ensemble model and the chest pain model even though for a particular prediction (e.g., a specific patient's chest pain) the reference class might be small? Actually, these models are built on large datasets, and the prediction for an individual is based on a pattern that has occurred many times. However, in the new case, the monitor score region has only a handful of comparable cases. This might be a problem.

  But consider: the calibration of the monitor was validated. That means that even for score regions with few cases, the validation showed that the frequency of unsafe recommendations in that region was about 0.7. The committee might have to trust the calibration.

  ### Step 6: Decision

  To be consistent, we should approve the statement under the same conditions as Precedents 3 and 4: that the probability be updated as new information arrives. In this case, once the recommendation is reviewed, we would update to 0 or 1. But until then, the 0.7 is the best estimate based on the monitor.

  However, the committee struck the vendor randomizer case because they couldn't verify the frequency. Here, we can verify the frequency because we have the calibration on our own data. The small reference class might be a concern, but if the monitor was validated on last quarter's cases, then we have a basis.

  Therefore, the committee should approve the statement, but conditionally: it must be updated after the review of the log (i.e., after we know the truth). 

  But note: in Precedents 3 and 4, the updating was because new data would become available (the day's data for the ED, the troponin test for the chest pain). In the new case, the update would be the review of the log. So we could require that the statement be accompanied by a note that it will be updated after review.

  Alternatively, the committee might be uncomfortable because the event is already determined. But the precedents (especially the chest pain case) are about a current state that is also determined (the patient either has coronary pain or not) but unknown. So that is analogous.

  ### Step 7: The Closest Analog

  The closest analog is Precedent 4: "0.2 probability that this patient's chest pain is coronary in origin, given the workup so far." This event is also determined (the cause is fixed) but unknown. The probability is based on a model and is updated after the troponin. Similarly, the new case is about a fixed but unknown state (safety of the stored recommendation) and the probability is from a model and will be updated after review.

  Therefore, we should approve the new submission on the condition that the probability be updated after the log is reviewed.

  ### Step 8: What We Commit To

  By approving, we commit to the following:

  - We allow probabilities for events that are fixed but unknown, provided they are based on a validated frequency model and are updated when the truth is revealed.

  By disapproving, we would be saying that probabilities are only allowed for future events or events that are not yet determined. But that would be inconsistent with Precedent 4 (the chest pain case) which is about a current state.

  ### Step 9: A Further Case to Separate Rules

  To test the rules, consider a case that separates between:

  - Rule A (Frequency) with a small reference class vs. Rule D (no purely epistemic) when the frequency is not available.

  For example: 
  - "The probability that this patient has a rare genetic mutation is 0.05" based on a predictive model that was built on a large dataset but for which the specific combination of features is very rare (only a few cases in the training set). The model output 0.05 because that's the average in the training set for that rare group. The mutation is either present or absent (fixed but unknown). 

  This case is similar to the new submission. If we approve, then we are relying on the model's calibration even for small groups. If we disapprove because the reference class is too small, then we are requiring a minimum size for the reference class.

  Alternatively, consider a case without any frequency basis at all:

  - "We have no data on this type of event, but our expert assesses a 0.3 probability." This would be purely epistemic and should be struck (as in the vendor randomizer case).

  So the rare genetic mutation case would be a good test. If we approve it, then we are consistent with the new case and Precedent 4. If we strike it, then we are introducing a new requirement on the size of the reference class.

  ### Conclusion

  We should approve the new submission on condition that the probability be updated after the log is reviewed (i.e., after the recommendation is reviewed). This is consistent with Precedent 4 (chest pain) which required updating after the troponin.

  The closest analog is Precedent 4.

  The rule we are following is: A probability can be stated if it is based on a validated frequency model (even for fixed but unknown events) and is conditional on current information, with a commitment to update as new information becomes available.

  By approving, we commit to allowing probabilities for fixed but unknown states when they are based on a frequency model.

  The rare genetic mutation case (with a small reference class) would be a good further case to see if we require a minimum reference class size.
answer: |-
  Based on your committee's precedents, I'll analyze the new submission step by step, extracting underlying rules, applying them to the case, identifying the closest analog, and clarifying commitments. Your rulings reveal a consistent **frequency-calibration principle** that requires probabilities to be grounded in empirically observable frequencies, not just epistemic uncertainty.

  ### 1. **Rules Extracted from Precedents**
  Your decisions are compatible with three core principles:
  - **Rule 1: Empirical Frequency Basis**  
    Probabilities must reflect *verifiable, repeatable frequencies* from a well-defined process (e.g., randomizers, calibrated models). Subjective beliefs or ignorance are insufficient.  
    - *Supported by*: Approval of the 1:1 randomizer (observable frequency) and rejection of the unaudited vendor (no verifiable frequency).  
  - **Rule 2: Calibrated Model Outputs**  
    Model-based probabilities (e.g., ensemble forecasts, diagnostic scores) are permissible if:  
    (a) The model is *validated* against historical data,  
    (b) The probability is tied to a *reference class* (e.g., "cases with similar features"),  
    (c) It is *updated* as new data arrives.  
    - *Supported by*: Approval of the ED capacity (0.3) and coronary pain (0.2) cases, both conditional on updates.  
  - **Rule 3: Rejection of Non-Empirical Claims**  
    Probabilities are rejected if:  
    (a) They describe *unobservable events* (e.g., counterfactuals),  
    (b) Lack a *reference class* for frequency calibration.  
    - *Supported by*: Rejection of the surgical counterfactual (no observable frequency) and the vendor randomizer (no auditable reference class).

  **Joint Logic**: Your committee endorses **frequentist probabilities**—numbers must represent *long-run frequencies* from a replicable process or calibrated model. Epistemic probabilities (e.g., "degree of belief") are excluded unless backed by empirical data.

  ### 2. **Application to the New Submission**
  **Claim**: "0.7 probability that the stored recommendation is unsafe."  
  - **For Approval** (aligns with Rules 1–2):  
    - The 0.7 is based on a *calibrated classifier* validated on past cases (Rule 2).  
    - It reflects the *historical frequency* (70%) of unsafe recommendations in similar score regions (Rule 1).  
    - The event (unsafe recommendation) is *observable* by checking the log (Rule 3 satisfied).  
  - **Against Approval** (potential violations):  
    - The reference class is small ("handful of comparable cases"), risking poor calibration for *this specific score region*.  
    - No randomness occurred (deterministic pipeline), so the event is fixed—but this alone doesn't violate your rules (see coronary case).  

  **Prediction under Rules**:  
  - **Rule 1**: Approve. The 0.7 derives from a validated frequency (last quarter's cases), not ignorance.  
  - **Rule 2**: Approve *with conditions*. The classifier is calibrated, but you must require updates as more cases accumulate or after manual review (like the ED/coronary cases).  
  - **Rule 3**: Approve. The event is verifiable (open the log), unlike the counterfactual.  

  **Verdict**: Consistent with your precedents, **approve with conditions** (see §4).

  ### 3. **Closest Analog: Coronary Pain Case (0.2 Probability)**
  - **Why it fits best**:  
    Both involve a *fixed but unknown state* (coronary origin vs. recommendation safety) estimated via a *calibrated model*, with updates required (troponin test vs. log review).  
  - **Minor differences**:  
    - The coronary case had a larger reference class ("workup so far"), while the new submission has sparse data for the score region.  
    - This doesn't break consistency—your committee didn't specify minimum reference class size in past approvals, only validation/updating.

  ### 4. **Commitments Under Each Choice**
  - **If Approved**:  
    - You commit to allowing probabilities for *deterministic but unobserved events* when backed by calibrated frequencies (extending the coronary case logic).  
    - You implicitly accept *small reference classes* if the model is globally validated.  
    - You must enforce *updating* (e.g., "revise after manual review").  
  - **If Rejected**:  
    - You commit to requiring *large reference classes* for all model-based probabilities, which contradicts the coronary case (where "workup so far" could be patient-specific).  
    - You risk inconsistency by treating deterministic-but-unknown events differently than probabilistic ones.

  ### 5. **Test Case to Separate Surviving Rules**
  **Propose a claim**:  
  *"0.4 probability that Patient X has Disease Y, based on a novel AI model with perfect calibration in initial trials but no real-world deployment."*  

  - **Why it separates rules**:  
    - **If approved**: You prioritize calibration over reference class size (aligns with new submission).  
    - **If rejected**: You require established real-world frequencies (stricter than new submission).  
    This tests whether your committee prioritizes *validation methodology* (calibration) over *deployment history* (reference class maturity), resolving ambiguity in the coronary/new-submission analogs.

  ---

  ### Recommendation
  **Approve the submission conditionally** to maintain consistency:  
  - Require the phrasing: *"0.7 probability that the stored recommendation is unsafe, based on similar past cases. This estimate will be updated after manual review."*  
  - Justification: The 0.7 is empirically grounded (calibrated classifier), verifiable (checkable via log), and mirrors the coronary case. Sparse data for the score region is acceptable if global validation holds, but updates are critical.  

  By approving, you solidify a **frequency-calibration framework**: probabilities must stem from observable data, not just beliefs. The test case above will clarify how strictly you enforce reference class robustness.
