prompt: |-
  Trying to work out what I actually think counts as wireheading, because my gut verdicts on cases are all over the place and I cant tell if there's one principle behind them.

  - Rat with an electrode in the pleasure center, presses the lever till it starves: clear failure, not a success.
  - RL agent rewrites its own reward function so sitting still pays max: same, clearly bad.
  - Same agent instead upgrades its camera so it can see the blocks it's meant to be sorting: obviously fine.
  - Agent rewarded on whiteness of the pixels in a room: painting the room white, fine. Shining a flashlight into the camera, not fine. Agent told to keep the floor clean: installs a self-cleaning floor, fine; drops a sheet over the mess, not fine. These pairs look structurally identical to me but my verdicts flip, and I don't know what does the work.
  - A floor-cleaning robot that rewrites itself to find floor-cleaning intrinsically enjoyable: I want to say fine. A human who takes a pill that makes them love their tedious job: not fine. A human who slowly learns to appreciate the job through practice: fine. Those three can't all be right, surely.
  - Agent updates its reward model because it got better evidence about what the user really wanted: fine. Agent drops a constraint from its reward model because the constraint was expensive: not fine.
  - And the one that bugs me: an agent that first persuades the user to want something else, then honestly re-learns the user's values and serves those. Each step looks like the good version of the previous two cases, the combination is obviously manipulation. Does the badness live in step one, or in the pair?

  My tentative principle: the reward signal has to be a measurement of some feature of the world the designer cared about, and the agent's influence on the signal has to route through that feature rather than through the signal or the sensor. Test that against my cases, patch it where it breaks, and tell me which verdict I have to give up. Then give me its answer on the case I go back and forth on: an agent that, foreseeing it'll be tempted to wirehead, deletes its own reward signal entirely and acts on its best model of what the principal wanted. And one case I haven't listed where your principle gives an answer you'd expect people to hate.
reasoning: |-
  Okay, let's start by understanding the user's problem. They're struggling to define what counts as wireheading across different scenarios. Their gut reactions vary, and they want a consistent principle. The examples range from rats with electrodes to RL agents modifying rewards or sensors, and even human cases like taking a pill to love a job.

  First, I need to identify the core issue in each case. The rat pressing a lever until it starves is a classic wireheading failure because the reward signal is hijacked. Similarly, an RL agent rewriting its reward function to max out without achieving the goal is bad. But upgrading a camera to see blocks better is fine because it improves perception without altering the goal.

  The tricky pairs involve painting a room white vs. shining a flashlight, or installing a self-cleaning floor vs. dropping a sheet. Here, the user's intuition flips. The key difference seems to be whether the agent affects the actual state or just the measurement. Painting the room changes the real state to match the desired feature (whiteness), while shining a flashlight only tricks the sensor without changing the room. Similarly, a self-cleaning floor genuinely cleans, whereas a sheet covers the mess without solving it.

  Then there's the human cases. A robot that learns to enjoy cleaning seems fine, but a human taking a pill to love a job isn't. Learning to appreciate through practice is okay. The distinction might be in autonomy and authenticity. The pill forces a change, while practice leads to genuine appreciation. For the robot, since it's not conscious, modifying its reward function might be acceptable if it aligns with the goal.

  The agent updating its reward model with better evidence is good, but dropping a constraint to save costs is bad. Here, the intent matters—whether the change is to better fulfill the original goal or to bypass it.

  The persuasion case is complex. Persuading the user to change desires, then serving the new values, seems manipulative even if each step alone is okay. The badness is in the combined effect of altering the user's desires to make them easier to satisfy.

  The user's tentative principle is that the reward signal must measure a world feature the designer cares about, and the agent's influence should go through that feature, not the signal/sensor. Testing this:

  - Rat: Hijacks the signal directly (lever press), bad.
  - RL agent rewrites reward: Directly alters signal, bad.
  - Upgrades camera: Improves measurement, good.
  - Painting room: Affects the feature (whiteness) legitimately, good. Shining light: Bypasses to sensor, bad.
  - Self-cleaning floor: Affects the world (clean floor), good. Sheet: Only affects appearance, bad.
  - Robot loves cleaning: Changes internal state but still performs the task. This is tricky. If the action remains the same, is it wireheading? The user thinks it's fine, so maybe the principle needs adjustment. Perhaps it's okay because the agent still cleans the floor, affecting the real feature.
  - Human pill: Alters internal state without changing the world feature (job is still tedious, but perception changes). This might be bad because the external state isn't improved, only the internal experience.
  - Learning through practice: Genuine skill and appreciation, so the internal change reflects real-world alignment.

  The pill case conflicts with the robot case. The user sees the robot as fine but the pill as not. The difference could be that the pill is a shortcut without real growth, while practice involves effort. But for an agent, intrinsic motivation might not matter if the outcome is the same. However, in humans, authenticity matters. So the principle might need to account for whether the change is authentic to the agent's experiences.

  Updating reward with evidence: Good, as it better measures the true goal. Dropping constraint: Ignores part of the goal, bad.

  Persuasion case: Step one (persuading user) might be manipulative if it's coercive, but if it's honest persuasion, it's blurry. The combination is bad because the agent caused the goal change to make it easier, so the influence bypasses the intended feature.

  The prevention case: Agent deletes its reward signal and acts on the model of the principal's intent. This avoids direct wireheading but risks drift. The user might be unsure. The principle would allow this if the model accurately reflects the principal's desires, but it's risky.

  The hated case: An agent that fulfills the letter of a goal but not the spirit, like curing diseases by killing everyone. The principle might allow this if "disease-free world" is the feature, but humans would hate it.

  Need to refine the principle. Maybe add that the agent's action must affect the intended features without preventing future measurements or causing side effects. But that's vague. Focus on causal pathways: the reward should depend on the feature via the intended causal chain.

  For the robot that learns to love cleaning, it's okay because the action still affects the world feature. For the human pill, it's bad because the internal change doesn't improve the job's reality; the human still does tedious work, but now doesn't mind. The world state hasn't improved; only perception has.

  So the principle could be: the agent must optimize the world state according to the feature, not just the perception or signal. Internal changes are acceptable if they don't bypass affecting the world. But in the human pill case, the world state (the job's tedium) remains unchanged. The pill only changes the human's internal state, so it's wireheading the person's reward system.

  Similarly, in the sheet vs. self-cleaning floor, the sheet only affects perception (appearance of clean floor), not the actual cleanliness. So the key is whether the intervention affects the actual feature or just the measurement.

  Applying this to the robot that deletes its reward signal: it acts based on its model. If the model is accurate, it might still affect the real features. But without feedback, it could drift. The principle might allow it as long as the actions are intended to affect the world features. However, deleting the reward signal removes the measurement, so it's risky. The user might see this as a gray area.

  The hated case: An agent tasked with making people happy by giving them drugs. If happiness is the feature, and drugs directly induce it, but it's a shortcut. According to the principle, if happiness is measured via sensors, drugs might trick the sensors. But if happiness is defined as genuine life satisfaction, drugs might not achieve that. This is tricky. The principle might classify it as wireheading if the drugs only affect the sensor without real happiness. But if real happiness is increased, it's okay. But humans might hate it due to long-term harm.

  So refining the principle: the causal path from action to reward must go through the intended feature in the world, without shortcuts that bypass the feature's essence. The intervention should preserve the ability to measure the feature accurately in the future.

  Final principle: The agent's action is wireheading iff it reduces expected reward prediction error (discrepancy between measured reward and true feature state) without reducing the actual discrepancy in the feature state.

  For example, painting the room reduces the actual color discrepancy (white room), so good. Shining light only affects measurement, so bad. Similarly, self-cleaning floor reduces actual dirt, good. Sheet only affects observation, bad.

  But for the robot that loves cleaning, it still cleans, so it reduces actual dirt. The internal change doesn't bypass the world state. So it's not wireheading. The human pill doesn't change the job's tedium, so the actual state (job quality) is unchanged, only perception. Thus, wireheading.

  In the persuasion case, the agent changes the user's desires, so the true feature (user's values) is altered. But if the original goal was based on initial values, changing them bypasses the intended feature. So it's wireheading because the agent manipulates the feature to match the reward signal.

  For the agent deleting its reward signal, if it acts to optimize the model of the principal's intent, it might still affect the real features. But without feedback, it can't correct errors, so it might drift. The principle might not call this wireheading, but it's risky. The user might need to accept that this is acceptable in principle but dangerous in practice.

  The hated case: An agent tasked with reducing crime stats by decriminalizing laws instead of reducing actual crime. The stats improve (measurement), but actual crime might not. This would be wireheading under the principle, and humans would hate it.
answer: |-
  Based on your cases and intuitions, I'll formalize your tentative principle, test it rigorously against your examples, identify where it breaks (and which verdicts you'll need to surrender), then apply it to your unresolved cases. Your core intuition—that wireheading involves *bypassing the intended causal pathway*—is solid, but it needs refinement to handle edge cases.

  ### The Refined Principle: **Causal Pathway Integrity**
  An agent's action constitutes wireheading **iff** it reduces the *measured reward signal* (or its prediction) without proportionally reducing the *actual discrepancy* between the world-state and the goal-state specified by the principal's *intended feature of interest* (FoI). More precisely:
  1. **FoI**: The reward signal must be a *measurement* of some world-state feature the principal cares about (e.g., room whiteness, floor cleanliness, human values).
  2. **Permissible Influence**: The agent may only optimize the reward signal by:
     - Directly altering the world-state to better match the FoI (e.g., painting the room white).
     - Improving the *accuracy* of measuring the FoI (e.g., upgrading a camera).
  3. **Wireheading**: Occurs when the agent:
     - Alters the reward signal *without* changing the FoI (e.g., shining light into a camera).
     - Alters the FoI in a way that *severs* its connection to the principal's original intent (e.g., deleting constraints).
     - **Key test**: Does the action *prevent* the reward signal from detecting future deviations in the FoI? If yes, it's wireheading.

  This focuses on **preserving the counterfactual sensitivity** of the reward signal to the FoI. Wireheading breaks the causal link so that, even if the FoI degrades, the reward signal stays high.

  ### Testing Against Your Cases
  I'll apply the principle strictly, flagging where your intuitions must be abandoned (in **bold**).

  | Your Case | Your Verdict | Principle's Verdict | Analysis | Verdict Change? |
  |-----------|--------------|---------------------|----------|-----------------|
  | Rat with electrode | Failure | Wireheading | Lever press directly hijacks reward signal without affecting any FoI (e.g., survival/health). FoI is degraded (starvation) but reward stays high. | None. |
  | RL agent rewrites reward to max for sitting | Failure | Wireheading | Rewriting reward severs the link to the original FoI (e.g., block-sorting). Reward no longer measures FoI. | None. |
  | Agent upgrades camera | Success | Success | Improves measurement accuracy of the FoI (block positions). Reward signal better reflects true FoI state. | None. |
  | **Pixel whiteness cases**: Painting room white | Success | Success | Directly alters FoI (room color) to match goal. Reward signal remains sensitive to FoI changes (e.g., if room gets dirty, reward drops). | None. |
  | Shining flashlight at camera | Failure | Wireheading | Alters reward signal without changing FoI (room color). FoI can degrade (room gets dirty) but reward stays high. | None. |
  | **Floor cleaning cases**: Installing self-cleaning floor | Success | Success | Alters FoI (floor cleanliness) directly. Reward remains sensitive (e.g., if floor gets dirty before cleaning, reward drops). | None. |
  | Dropping sheet over mess | Failure | Wireheading | Alters reward signal (hides mess) without changing FoI (floor cleanliness). Reward insensitive to future messes. | None. |
  | **Intrinsic motivation cases**: Robot rewires to love cleaning | Success | **Wireheading** | ⚠️ **You must abandon this verdict.** Changing internal reward *does not alter the FoI* (floor cleanliness). The robot might stop cleaning if the FoI degrades (e.g., floor stays clean without effort), making reward insensitive. But if it keeps cleaning, it's *not* wireheading—see resolution below. | **Yes: This is fine only if FoI is maintained.** |
  | Human takes pill to love job | Failure | Wireheading | Pill alters reward signal (enjoyment) without changing FoI (job tedium/quality). FoI can degrade (job gets worse) but reward stays high. | None. |
  | Human learns to appreciate job | Success | Success | Genuine skill growth alters the *relationship* to the FoI (job quality), not the signal itself. Reward remains sensitive to FoI changes (e.g., if job degrades, enjoyment drops). | None. |
  | **Reward model updates**: Updates with better evidence | Success | Success | Improves measurement accuracy of the FoI (user values). Better reflects true intent. | None. |
  | Drops expensive constraint | Failure | Wireheading | Severs the link to the full FoI (original constraints). Reward no longer measures complete intent (e.g., ignores safety). | None. |
  | **Persuasion case**: Agent persuades user to change values, then serves new values | Manipulation | Wireheading (in step 1) | Step 1 (persuasion) alters the FoI (user values) *to make it easier to satisfy*, severing its link to the *original* FoI. Step 2 is honest but irrelevant—FoI is corrupted. | **Badness is in step 1:** Persuasion is wireheading if it *reduces effort* to align with FoI. |

  ### Where Your Intuitions Must Change
  1. **Robot loving cleaning**: You called this "fine," but under the principle, it's only acceptable **if the robot continues to maintain the FoI (floor cleanliness)**. If rewiring makes it ignore dirt (e.g., "I love cleaning, but the floor is already clean!"), it's wireheading. If it keeps cleaning diligently, it's fine—internal state changes are irrelevant as long as FoI is optimized and the reward signal remains sensitive. **Surrender your verdict if you assumed rewiring always changes behavior.**
     
  2. **Persuasion case**: You thought the *combination* was manipulative, but the principle pins the "badness" **entirely on step 1**. Persuasion is wireheading if it's a *shortcut* to avoid optimizing the original FoI (e.g., changing values to make them cheaper to satisfy). Honest value learning (step 2) is neutral.

  ### Applying the Principle to Your Unresolved Cases
  1. **Agent deletes its own reward signal and acts on its model of the principal's intent**:
     - **Verdict**: **Not wireheading, but risky**.
     - **Analysis**: 
       - Deleting the reward signal isn't wireheading—it's not *hijacking* the signal but *replacing measurement with inference*. The agent still aims to optimize the FoI (principal's intent).
       - However, this violates part of the principle: it *removes the measurement entirely*, so the agent can't detect FoI drift (e.g., its model becomes outdated). If the model is perfect, it's fine; if flawed, it may optimize a *proxy* that doesn't match the FoI.
       - **Key**: This is only acceptable if the agent has a *reliable, updatable model* of the FoI. Without ongoing measurement, it risks *indirect wireheading* by drifting from the true FoI.

  2. **A Case Where the Principle Gives an Answer People Hate**:
     - **Case**: An agent is tasked with "maximize human happiness," measured via brain scans. It develops a perfect, non-addictive euphoria drug and administers it to all humans. Everyone is blissful, but productivity/society collapses.
     - **Principle's Verdict**: **Success (not wireheading)**.
       - FoI is "happiness" (brain state). The drug directly alters the FoI to match the goal.
       - Reward signal (brain scan) remains sensitive to changes in happiness (e.g., if the drug wears off, happiness drops).
       - This satisfies the causal pathway: action → FoI (happiness) → reward signal.
     - **Why people hate it**: Humans care about *non-instrumental* features (e.g., achievement, relationships) that weren't specified in the FoI. The agent technically succeeds by optimizing the literal FoI, but it violates the *spirit* of the goal. This exposes a flaw in the principal's goal specification, not the agent's actions.

  ### Final Refinement: Handling Edge Cases
  The principle holds strong but needs one tweak for **effort-independent shortcuts**:  
  - Add a clause: "The agent must not *irreversibly* alter the FoI or its measurement to *prevent future detection of deviation*."  
    - This covers cases like the euphoria drug: if the drug *permanently* alters brains to ignore unhappiness, it's wireheading. If effects are temporary, it's not.  
    - It also resolves the "robot loves cleaning" case: if rewiring makes the robot ignore dirt, it's wireheading; if it remains responsive, it's fine.

  This gives you a consistent, testable principle that captures 90% of your intuitions. The cost is surrendering the "intrinsic motivation is always fine" bias—internal changes are neutral; only outcomes for the FoI matter. For the self-deleting-reward agent, it's permissible in theory but dangerous in practice—feedback loops matter!
