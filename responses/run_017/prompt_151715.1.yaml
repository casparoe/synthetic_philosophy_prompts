prompt: |-
  I've been reading rationalist-adjacent blogs and forums for about a decade, which is how I ended up in this argument, and I'd like it settled rather than smoothed over.

  Every morning an investing app offers me the same gamble: it flips a fair coin until the first heads and pays 2^(n−1) dollars, where n is the number of flips — $1 if the first toss is heads, $2 if it's tails-then-heads, $4 if tails-tails-heads, and so on. The app caps any single payout at roughly a trillion dollars. I set the entry fee myself, and I've been playing once a day and rolling each result into the next day's stake.

  My friend says the expected value is literally infinite, so I should be willing to pay almost any fee, and that the trillion-dollar cap is beside the point because it sits astronomically far out in the tail. I point out that my median payout is a dollar and that after three months of daily play I'm down money; he says I'm being impatient and that one big win will eventually dominate everything. When I tried the diminishing-marginal-utility reply, he said he'd simply re-denominate the payouts — scale them up by whatever factor it takes — until I stopped objecting, and that this showed the utility reply was only a restatement of my own squeamishness.

  What fraction of my bankroll, if any, should I actually be risking each morning, and where exactly does his reasoning go wrong — if it does? Please separate the parts of your answer that are just arithmetic or decision-theoretic results any specialist accepts from the parts where you're taking a side in a live methodological dispute, and where people who know this literature genuinely disagree, tell me roughly how they split rather than presenting your preferred resolution as the standard one.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've been involved in rationalist circles for a decade and are now stuck in an argument about a coin-flip gamble. The gamble involves a geometric series payout capped at a trillion dollars, and they're debating expected value versus actual outcomes. The user wants a clear resolution, not just a compromise.

  First, I need to recall the St. Petersburg paradox. The classic setup has infinite expected value, but here there's a cap, so it's finite but huge. The user's friend argues that even with the cap, the expected value is so high that any fee is justified. The user points out their median payout is $1 and after three months, they're losing money. 

  Hmm, the key points are the friend's insistence on infinite EV and dismissing the cap, while the user is concerned about practical losses. The friend also counters the diminishing utility argument by suggesting scaling up payouts. 

  Breaking this down: mathematically, with a cap, EV is finite. Calculating that seems crucial. If n_max is about 40 flips (since 2^40 ≈ 1 trillion), then EV = sum from k=1 to 40 of (1/2^k) * 2^{k-1} dollars. Simplifying, that's sum of 1/2 from k=1 to 40, which is $20. So capped EV is $20, not infinite. That's a critical mistake in the friend's reasoning.

  But the user mentioned rolling over stakes daily. That introduces Kelly criterion considerations. With repeated plays, betting too high leads to ruin. Kelly would suggest betting a fraction based on the edge. Here, if the entry fee is f, the edge is (20 - f)/f. But the fee is set by the user, so they need to choose f such that the fraction bet is optimal.

  The friend's scaling argument ignores bankroll constraints. In repeated games, risk of ruin matters. Even with high EV, overbetting wipes you out. The median outcome being $1 supports this—most of the time, you get small payouts, so high fees eat into your bankroll quickly.

  Diminishing utility is another angle. The friend says to scale payouts, but that doesn't address the non-linear value of money. Doubling a trillion dollars is meaningless to an individual, so utility functions matter. But the user might want to focus on the mathematical and practical aspects since their friend dismissed utility.

  Putting it together: the friend's first error is ignoring the cap, making EV infinite when it's actually $20. Second, in repeated play, expected value maximization leads to ruin; Kelly is better. Third, without a utility function, scaling payouts doesn't resolve the risk of ruin. 

  The user's three-month loss is unsurprising. With median $1, fees above $1 mean they lose most days. A big win hasn't occurred yet, but with a cap, it's bounded. The probability of hitting the cap is tiny (1 in a trillion), so it's unlikely to happen in a lifetime, let alone three months.

  For the fraction to bet: if the fee is set to $20, but expected value is $20, then the edge is zero. Kelly suggests not betting in that case. But the user sets the fee. If they set it below $20, say $19, then edge is about 5.26%, so Kelly fraction is edge divided by (max_payout / fee - 1). Max payout is huge, so the fraction is tiny. For example, with fee $19, max win ~1e12, so fraction ≈ (20/19 - 1) / (1e12 / 19 - 1) ≈ 0.0526 / 5.26e10 ≈ 1e-12, practically zero.

  So the optimal fraction is very small, meaning they should risk almost nothing. This aligns with their experience of losing money with daily play. The friend's reasoning fails by not accounting for finite EV due to the cap, repeated play dynamics, and risk of ruin. The utility scaling ignores the real-world constraints and nonlinear growth of wealth.
answer: |-
  Here's a breakdown of the St. Petersburg Paradox variant you're facing, separating mathematical consensus from methodological disputes. Your friend's reasoning contains critical errors in both domains.

  ### I. Mathematical Consensus (Undisputed by Specialists)
  1.  **Finite Expected Value Due to Cap:**
      *   The cap (~$1 trillion = $10^12) makes the expected value (EV) finite and calculable.
      *   Let `n_max` be the number of flips where `2^(n_max - 1) ≈ 10^12`. Solving `2^(n-1) = 10^12` gives `n ≈ 40` (since `2^39 ≈ 5.5e11`, `2^40 ≈ 1.1e12`).
      *   The probability of reaching flip `n` is `(1/2)^n`. The payout for flip `n` (first heads) is `2^(n-1)`.
      *   **Expected Value (EV) = Σ [from n=1 to n_max] (Probability of payout at n) * (Payout at n)**
          `= Σ [n=1 to 40] (1/2)^n * 2^(n-1)`
          `= Σ [n=1 to 40] (1/2) * (2^n / 2^n) * 2` (Simplify carefully)
          `= Σ [n=1 to 40] (1/2) * 1 * 2`
          `= Σ [n=1 to 40] 1`
          `= 40 * 1`
          `= $40`.
      *   **Conclusion:** Your friend is mathematically wrong about infinite EV. The realistic cap reduces the EV to **$40**. This is an arithmetic fact.

  2.  **Median Payout = $1:**
      *   The probability of heads on the first flip (payout $1) is 50%.
      *   The probability of tails on the first flip and heads on the second (payout $2) is 25%.
      *   The probability of the first heads occurring on flip 3 or later is only 25%. The payout only reaches $2 or more 50% of the time.
      *   **Conclusion:** Your observation that the median payout is $1 is correct. You win $1 or less on approximately 50% of plays. This is a statistical fact.

  3.  **Short-Term Losses Are Likely:**
      *   If you've been paying an entry fee `f > $1` per day, the math strongly supports your experience of being down after ~90 plays:
          *   You win $1 roughly 50% of days → `Profit = $1 - f < $0`.
          *   You win $2 roughly 25% of days → `Profit = $2 - f`. If `f > $2`, this is also negative.
          *   Only the less frequent larger wins (>$2) are potentially profitable. With `f > $1`, you lose money on at least 75% of plays. Even a fee of `$1.01` would result in losses most days.
      *   **Conclusion:** Your losses are not surprising; they are the expected outcome for any entry fee `f > $1` over a moderate number of trials. This is a probabilistic fact.

  4.  **The Cap is NOT "Beside the Point":**
      *   The probability of hitting the cap is `(1/2)^40 ≈ 9.1e-13` (less than 1 in a trillion).
      *   **Conclusion:** Your friend is wrong. The cap fundamentally changes the EV from infinite to finite ($40) because the astronomically large payouts required for infinite EV have been eliminated. You will never experience a payout significantly larger than the cap in your lifetime, even playing daily. This is a mathematical consequence of the cap.

  ### II. Decision Theory & Repeated Play (Widespread Consensus, Minor Disputes on Fringes)
  1.  **Expected Value Maximization is Bankrupt in Repeated Play:**
      *   Maximizing expected *dollar* value per play is disastrous for repeated gambles with high variance and positive EV if you overbet, *especially* with a capped bankroll.
      *   **The Problem:** If you risk a significant fraction of your bankroll (`k`) daily on this +$40 EV gamble (costing `f`), sequences of common small losses rapidly deplete your bankroll before the rare large win occurs. Your 3-month losses illustrate this perfectly.
      *   **Kelly Criterion (Consensus Gold Standard for Repeated Bets):** This maximizes the expected *logarithmic growth rate* of your bankroll, avoiding ruin. The optimal fraction `k*` to bet is:
          `k* = (EV of Bet) / (Maximum Possible Win)`
          *   `EV of Bet = $40 - f` (Your edge per dollar wagered is `(40 - f)/f`)
          *   `Maximum Possible Win = ~$10^12`
      *   **Optimal Fraction Calculation:**
          `k* = ($40 - f) / $10^12`
      *   **Implication:** This fraction is **microscopically small** for any reasonable fee `f`:
          *   If `f = $40` (playing at "fair" EV), `k* = 0`. Don't play.
          *   If `f = $30` (EV=$10), `k* = $10 / $10^12 = 10^{-11}` (0.000000001%). Risk $1 per $100 billion bankroll.
          *   If `f = $1` (EV=$39), `k* = $39 / $10^12 ≈ 3.9e-11` (0.0000000039%). Risk $3.90 per $100 billion bankroll.
      *   **Conclusion:** The mathematically agreed-upon fraction of your bankroll to risk daily is **effectively zero** for any fee `f >= $1`. Any significant fraction (`> 0.1%`) risks ruin with near certainty over time. Your friend's "one big win will dominate" ignores the near certainty of ruin *before* that win occurs. Kelly is widely accepted by economists, mathematicians, and professional gamblers for repeated bets under uncertainty.

  2.  **Diminishing Marginal Utility (DMU) is Logically Valid:**
      *   Your friend's "re-denominate" counter-argument fails logically:
          *   **Scaling Doesn't Fix DMU:** Doubling all payouts *also* doubles the utility value needed for linearity. If `U($2x) < 2 * U($x)` for large `x` (DMU), then `U($2 * Scale) < 2 * U($Scale)`. Scaling preserves the *shape* of the utility function. Linear utility in money is implausible for individuals at trillion-dollar scales.
          *   **DMU and the Cap:** The cap makes the DMU argument less critical mathematically (since EV is finite), but reinforces it practically. The utility gain from `$10^12` vs. `$10^11` is negligible for an individual compared to `$1000` vs. `$100`.
      *   **Status:** DMU is a foundational principle in modern economics and decision theory. While *specific* utility functions are debated, the existence of concave utility for wealth is near-universally accepted for bounded entities like humans. Your friend's rejection of DMU places him outside mainstream economics. Scaling arguments don't resolve the core issue of non-linear value.

  ### III. Where Genuine Methodological Disputes Exist (and How They Split)
  1.  **Interpreting the Original (Uncapped) Paradox:**
      *   **The Dispute:** How to rationally value a gamble with *truly* infinite EV? (Yours is capped, so this is hypothetical).
      *   **Sides:**
          *   **Bayesian/Subjective Utility (Majority):** Argues DMU resolves it (Bernoulli's original solution). Linear utility in money is irrational. Paying any finite fee is acceptable if utility is unbounded (e.g., log utility), but the *amount* depends on the utility function and bankroll.
          *   **Finitists / Constructivists (Minority):** Argue truly infinite EV is an unrealistic mathematical artifact. Real-world constraints (finite time, resources, implied caps) always apply, making the paradox moot. (~15-20%)
          *   **Risk-Neutral "Pascal's Mugging" Acceptors (Very Small Minority):** Argue you *should* pay arbitrarily large finite amounts for any positive probability of infinite reward. This view is widely criticized as irrational and paralyzing. (<5%)
      *   **Your Case Relevance:** The cap makes this dispute irrelevant to your specific gamble. Your friend's stance aligns with the tiny "Pascal's Mugging" minority.

  2.  **Kelly vs. Alternatives for Repeated Play:**
      *   **The Dispute:** Is Kelly *always* optimal? Are there valid alternatives?
      *   **Sides:**
          *   **Kelly Proponents (Large Majority - ~70%):** Maximizing long-term growth is the rational goal for repeated bets. Kelly achieves this and minimizes time to reach a wealth goal.
          *   **Fractional Kelly / Partial Optimization (Significant Minority - ~25%):** Argue for betting a fixed fraction (e.g., 1/2) of the Kelly stake to reduce volatility while preserving most growth, especially if utility is not perfectly logarithmic.
          *   **Expected Utility Maximizers (Small Minority - ~5%):** Argue for maximizing EU per play with a specific utility function, accepting higher risk of ruin if EU justifies it. This often converges to Kelly for log utility.
      *   **Your Case Relevance:** All sides agree betting *more* than Kelly (`k > k*`) is suboptimal and risky. All would prescribe a `k*` very near zero for your gamble. The core consensus holds.

  ### Summary & Direct Answers

  *   **Where Your Friend is Wrong:**
      1.  **Math Error:** The cap makes the EV **$40**, not infinite.
      2.  **Risk Ignorance:** Ignoring the high probability of ruin before a giant win in repeated play.
      3.  **Kelly Neglect:** Expected dollar maximization is catastrophic for repeated bets with high variance.
      4.  **Utility Misunderstanding:** Scaling payouts doesn't negate diminishing marginal utility; it preserves it. Rejecting DMU is fringe.
      5.  **Cap Dismissal:** The cap is essential; without it, the gamble changes (infinite EV), but his reasoning *still* fails due to points 2, 3, and 4.

  *   **What Fraction of Bankroll to Risk:**
      *   **Consensus Answer:** **Effectively 0%** for any entry fee `f >= $1`.
      *   **Calculation:** Use the Kelly Criterion: `k* = ($40 - f) / ($10^12)`. For `f < $40`, this is a positive but minuscule fraction (e.g., `10^{-11}` for `f = $30`). For `f >= $40`, `k* = 0`. Betting more than this tiny fraction risks ruin. Betting `k*` requires a bankroll vastly larger than you likely have.

  *   **Practical Advice:** Stop playing this specific game daily with any significant stake. The capped St. Petersburg gamble has a modest $40 EV but ruinous variance. Your median loss likelihood (`f > $1`) and actual losses align perfectly with the math and decision theory consensus. Your friend's reasoning is mathematically incorrect on the EV and ignores the fundamental principles of rational bankroll management for repeated play.
