  **INTERNAL TRAINING BUL: PROCEDURES FOR WELFARE ASSESSMENT & RESOURCE ALLOCATION (Revision 7.3)**

  **1. Initial Citizen Welfare Calibration**

  All citizen welfare assessments commence with the Standard Normalization Protocol (SNP). Each citizen independently defines their Personal Best Conceivable Outcome (PBCO) and Personal Worst Conceivable Outcome (PWCO). These endpoints establish the citizen's individual welfare scale, fixed at 1.0 and 0.0 util respectively. Ensure the citizen understands the PBCO represents maximal achievable satisfaction under current constraints; the PWCO represents maximal conceivable suffering *feasible* within their potential life paths. Caseworkers must coach citizens to describe PWCOs with concrete, plausible detail (e.g., "chronic malnutrition and social isolation" vs. "occasional disappointment"). **Crucially note:** Adding a new, exceptionally dire (though improbable) option to the citizen's conceivable set may redefine their PWCO. If this new PWCO is significantly worse than the previous baseline, recalibration occurs. This can result in a downward shift of the citizen’s previously reported welfare levels relative to their new scale, potentially altering their relative standing in allocation decisions. A citizen whose original PWCO was "mildly undercooked egg" will now register higher absolute welfare than one whose PWCO is "homelessness," as both scales are bounded identically.

  **2. Handling High-Conversion-Rate Cases (HCRC)**

  A small subset of citizens exhibit Resource-to-Welfare Conversion Rates (RCR) significantly exceeding the median. These individuals report substantial welfare gains (often >0.5 utils) from minimal resource inputs (e.g., minor dietary adjustments, specific low-cost sensory stimuli). While the SNP ensures their scale endpoints are technically comparable, such disproportionate conversion necessitates Enhanced Scrutiny Protocol (ESP). Initiate ESP if RCR exceeds median by a factor of 5. ESP involves verification interviews focusing on: a) Consistency of PBCO/PWCO definitions over time; b) Correlation between reported resource receipt and observable behavioral indicators (mood, activity levels); c) Cross-referencing with historical allocation data to detect patterns of disproportionate claim. Temporary suspension of resource allocation increments pending ESP outcome is mandatory. Findings justifying sustained high RCR must be documented under Section 12.7.vi (Exceptional Circumstances - Verifiable Physiological/Neurological Basis).

  **3. Monetary Equivalency Determination (MED)**

  Converting welfare changes (ΔU) into monetary values ($Δ) is required for cross-resource cost-benefit analysis. Utilize the Willingness-To-Pay/Willingness-To-Accept (WTP/WTA) method. For welfare gains (ΔU > 0), calculate $Δ based on the *maximum* amount the citizen would pay to secure the gain. For welfare losses (ΔU < 0), calculate $Δ based on the *minimum* amount the citizen would accept to endure the loss. **Be advised:** These figures are inherently asymmetric. The compensation demanded to accept a loss typically exceeds the payment offered to secure an equivalent gain. Furthermore, $Δ is heavily dependent on the citizen's existing resource endowment (E). Citizens with low E will generally exhibit higher $Δ per util gained (due to marginal utility) but *also* higher $Δ compensation required per util lost (due to loss aversion). Use the Resource Endowment Adjustment Matrix (Form MED-REA) to standardize $Δ values for allocation formulae, recognizing this adjusts for wealth effects, not interpersonal utility comparison.

  **4. Self-Reported Wellbeing (SRW) Surveys & Expectation Discounting**

  Periodic SRW surveys provide real-time welfare estimates between recalibrations. Citizens assign a numerical value (between 0.0 and 1.0) to their current state. **Critical Adjustment:** Apply the Expectation Discount Factor (EDF) to raw SRW scores. EDF accounts for adaptive preference formation – the phenomenon where citizens enduring persistently adverse conditions may recalibrate *expectations* downwards, reporting higher welfare for objectively worse states than a non-adapted citizen would. EDF is calculated algorithmically based on: duration of adverse conditions, historical SRW trends relative to objective indicators (e.g., health metrics, income), and deviation from cohort medians. An EDF of 0.85 applied to a raw SRW of 0.6 yields an Adjusted Wellbeing Score (AWS) of 0.51. Failure to apply EDF risks misallocating resources away from citizens whose expressed satisfaction reflects resignation rather than genuine high welfare. Document EDF application meticulously using Form SRW-EDF.

  **5. Preference-Based Allocation & Aggregate Welfare Metrics**

  Interpersonal welfare comparisons, being theoretically indefensible due to the cardinal nature of utils, are strictly prohibited. Allocation decisions must rely solely on ordinal preference revelation. The Standard Allocation Interface (SAI) presents citizens with potential resource bundles. Citizens rank bundles ordinally or select most preferred. **However**, to determine overall societal welfare impact of policy A vs. policy B, the SAI outputs two aggregate metrics derived *solely* from individual ordinal rankings: i) **Total Preference Satisfaction (TPS):** Counts the total number of citizens for whom Policy A yields a bundle ranked higher than under Policy B, minus the reverse. ii) **Floor Welfare Index (FWI):** Counts the number of citizens for whom Policy A yields their *lowest acceptable* bundle or higher, minus the reverse for Policy B. The caseworker must select either TPS or FWI via checkbox prior to final recommendation. TPS emphasizes aggregate preference fulfillment; FWI prioritizes minimizing severe deprivation. This selection reflects operational priorities, not interpersonal comparison, as both metrics derive from uncontestable ordinal data. Final allocation must reference the chosen metric.
