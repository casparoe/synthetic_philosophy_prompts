  **Journal of Narrative Identity Studies, Vol. 15, Issue 2**

  **Abstract**

  **Background:** Disruptions in personal identity are increasingly recognized as a source of distress. Gravitational Re-centering (GR) is a novel intervention designed to restore the "center of narrative gravity" — the point at which self-narratives and other-narratives cohere.

  **Methods:** In a double-blind, randomized controlled trial, 250 adults (aged 18-65) with self-reported identity fragmentation were assigned to GR (n=125) or placebo (n=125). GR involved eight weekly sessions: narrative scanning, narrative restructuring, and physical alignment using a plumb line device. The placebo group engaged in unstructured life discussions. Primary endpoint: change in Narrative Coherence Scale (NCS) score from baseline to week 8. Secondary endpoints included Self-Continuity Index (SCI) and Social Narrative Integration Score (SNIS).

  **Results:** The GR group showed a mean improvement of 35% on the NCS (SD=4.2), versus 5% (SD=3.1) in the placebo group (p<0.001). SCI improved by 28% (GR) vs. 6% (placebo) (p<0.001); SNIS improved by 32% vs. 7% (p<0.001). No serious adverse events were reported.

  **Conclusion:** GR is an effective and safe intervention for restoring narrative coherence in individuals with identity fragmentation. The therapy's unique integration of narrative and physical elements offers a promising approach to self-reconstitution.

