  Here's a breakdown of the implicit view underlying cosmological practice, addressing your specific questions and tensions:

  **The Core Implicit View: Physical Significance Without Metaphysical Privilege**

  Cosmologists operate with a view that sits firmly within **eternalism** (the block universe) but leverages a **physically significant, non-arbitrary foliation** due to the *contingent, large-scale structure of our universe*. This foliation (cosmic time) is:

  1.  **Not Merely Pragmatic Convenience (like UTC):** Its definition isn't arbitrary. It's *discovered*, not invented. It's fixed by the large-scale isotropy of the CMB (reflecting the isotropy of the Hubble flow), a measurable physical feature.
  2.  **Not Neo-Lorentzian (Smuggled Absolute Time):** It doesn't posit a fundamental, hidden preferred frame underlying all physics. The foliation only emerges *because* of the specific, symmetric matter/energy distribution in our universe. Special relativity's frame-relativity still holds *locally* and fundamentally. Global isotropy breaks Lorentz invariance *globally* for the specific purpose of defining a global time coordinate.
  3.  **Not Strict Operationalism:** While clocks measure proper time, cosmic time is a *constructed coordinate* based on operational measurements (isotropy) that defines a global structure. It *represents* something real about the universe's large-scale state and evolution.

  **It's best understood as a physically motivated gauge fixing or a symmetry-breaking coordinate choice:**

  *   **Gauge Fixing Analogy:** Just as choosing a specific gauge (like Lorenz gauge in EM) simplifies equations without changing the underlying physics, choosing cosmic time simplifies the description of the universe *because of its symmetry*. The symmetry (isotropy/homogeneity) makes this gauge choice *natural* and *physically meaningful*. The physics describing the universe's evolution *in this gauge* is simpler and directly reflects observable properties. Other choices are possible but would be messy and obscure the underlying simplicity.
  *   **Symmetry Breaking:** The fundamental laws (Einstein's GR) are generally covariant (no preferred coordinates). However, the *solution* to those equations describing *our universe* (the FLRW metric) possesses a high degree of symmetry (homogeneity and isotropy). This symmetry *breaks* the equivalence of all possible time foliations. Cosmic time aligns with the symmetry of the solution itself.

  **Addressing Your Specific Points:**

  1.  **Your Geochemistry Practice vs. Cosmologists:**
      *   **Zircon Dating:** You are absolutely correct. This is fundamentally different. You are measuring the *proper time* (invariant spacetime interval) along a specific timelike worldline (the zircon's history) between two specific events on that worldline (crystallization and measurement). This is frame-independent, Lorentz invariant, and requires no notion of global simultaneity. It's intrinsic to the worldline itself. This practice is entirely safe under *any* interpretation of relativity (eternalist, presentist, etc.) and doesn't presuppose a global "now".
      *   **Cosmic Age:** This inherently *requires* defining a global "now" hypersurface ("the present") and integrating proper time *along fundamental worldlines* (comoving observers) *from a specific initial hypersurface* (e.g., the Big Bang singularity, or more practically, recombination) *up to that global "now"*. It requires a global foliation to define both endpoints simultaneously. This is only possible and meaningful *because* the symmetry of our universe allows us to define such a foliation unambiguously.

  2.  **Hypothetical Swirling Universe (Gödel-like):**
      *   Cosmologists in such a universe **would be forced to abandon quoting a single "age of the universe"** in the way we do.
      *   They would likely:
          *   Focus on *local* ages: Report the proper time elapsed along specific worldlines from some local origin event.
          *   Use *averages*: Define some average proper time since a chosen event, acknowledging the variance.
          *   Adopt *pragmatic conventions*: Choose *some* foliation (e.g., based on the frame minimizing shear in some region) and explicitly state it as a convention.
          *   Report *different quantities*: Emphasize observables not requiring a global time, like redshift-distance relations or specific event horizons, without summarizing them into a single "age".
      *   **This tells us decisively that cosmic time in our universe is a discovery, not just a posit.** Its existence and usefulness are contingent on the large-scale isotropy/homogeneity we observe. It reflects a real physical feature of our cosmos. In a Gödel universe, the lack of a unique, natural foliation is also a discovery about *that* universe's structure.

  3.  **The Meaning of "13.8 Billion Years Old Now" in a Block Universe:**
      *   **What the sentence refers to:** It refers to the invariant spacetime interval (proper time) measured along the worldline of a *fundamental comoving observer* (or the average of them), starting from a conventionally defined "beginning" event (e.g., when the scale factor was zero, or recombination) and ending at the specific spacelike hypersurface defined by cosmic time that passes through *your current location-event* (or the location-event of the Earth, typically).
      *   **"Now" is indexical:** It picks out the specific cosmic time hypersurface that contains the speaker's location-event within the block. "13.8 billion years ago" refers to the specific, unique cosmic time hypersurface defined by `t_cosmic = t_now - 13.8 Gyr`.
      *   **It's relational:** It relates two hypersurfaces defined within the cosmic time foliation: the "Big Bang" hypersurface (or equivalent) and the hypersurface containing the speaker's "here-now" event. The number quantifies the proper time elapsed for comoving observers between those hypersurfaces.
      *   **It requires the foliation:** The meaning *inherently depends* on the existence and definition of the cosmic time foliation. The sentence only makes unambiguous sense *because* that foliation is physically well-defined in our universe.

  4.  **If Cosmologists Took Rietdijk-Putnam Completely Seriously:**
      *   **Textbooks:** Would contain explicit, prominent caveats in cosmology chapters: "The concept of a global 'age of the universe' relies on the observed large-scale isotropy of the cosmic microwave background radiation, which defines a physically preferred foliation known as cosmic time. This foliation is a contingent feature of our universe, not a fundamental aspect of relativity. In the absence of such symmetry, a unique global age would not be definable." Special relativity sections would be even clearer that *fundamentally*, simultaneity is frame-relative.
      *   **Papers:** Would use language like:
          *   "In the cosmologically preferred frame defined by CMB isotropy..."
          *   "The elapsed proper time for comoving observers since recombination in the CMB rest frame is approximately 13.8 Gyr."
          *   "We define cosmic time `t` as the proper time measured by clocks at rest in the frame where the CMB dipole vanishes..."
          *   Avoid phrases like "the age of the universe *now*" without qualification, emphasizing the dependence on the foliation choice justified by observation. Phrases like "the current epoch defined by cosmic time" would be preferred over simple "now".
      *   **Practice:** Calculations and models using cosmic time would remain largely unchanged, as it's the physically useful and observationally justified tool. However, the *interpretation* accompanying results would consistently emphasize the contingent, non-fundamental nature of the global foliation. They might explicitly discuss the variance in proper times along different paths in hypothetical non-symmetric universes.

  **Conclusion:**

  The practice presupposes **eternalism** (events are parts of spacetime) but leverages a **physically significant foliation (cosmic time) that is contingent upon the large-scale isotropy and homogeneity of our specific universe.** This foliation is:

  *   **Not metaphysically privileged:** It doesn't reflect a fundamental "flow" of time or an absolute present etched into the fabric of reality. It's a feature of *this particular solution* to Einstein's equations.
  *   **Physically non-arbitrary:** It is *discovered* through observation (CMB isotropy), not chosen purely for convenience. It aligns with the symmetry of the universe.
  *   **Doing the work of gauge fixing:** It simplifies the description immensely because it aligns with the universe's symmetry. Choosing a different foliation in our universe would be perverse, like choosing polar coordinates for a problem with rectangular symmetry. Its convenience stems from its physical significance.
  *   **Required for global statements:** Your geochemistry requires only local proper time. Declaring a *global* age requires a global foliation, which our universe fortunately provides via its symmetry.

  Cosmologists aren't being inconsistent; they are using the tools the universe provides. They operate within the block universe framework but exploit a physically meaningful coordinate system made possible by cosmic symmetry to make global statements like "the age of the universe." If that symmetry vanished, so would the practice of quoting a single global age. The Rietdijk-Putnam argument highlights the fundamental frame-relativity, but cosmology demonstrates how large-scale structure breaks that relativity in practice *for global descriptions*, without reinstating a fundamental absolute time.
