  Okay, let me try to unpack this retired geologist's quandary. He's spent decades confidently dating billion-year-old zircons, but now philosophy group discussions about relativity have him questioning the very notion of "now" in cosmology. His core tension is between cosmologists' operational use of cosmic time and their theoretical rejection of absolute simultaneity.

  Hmm, he's asking several layered questions. First, about the metaphysical status of cosmic time - is it just a convenient coordinate or does it smuggle in absolute time? Second, whether his rock-dating practice differs fundamentally from cosmic age declarations. Third, how cosmology would function in a Gödel-type universe without a preferred foliation. And finally, what "the universe is 13.8 billion years old now" actually means in a block universe.

  The user clearly wants technical precision but also philosophical clarity. His background in geochemistry means he'll spot hand-waving - I need to distinguish carefully between what's physically required versus conventionally adopted. That bit about physicists not behaving like they believe in eternalism is telling - he senses a disconnect between theory and practice.

  Let me structure this. Cosmic time isn't Lorentzian because it's not hidden physics - it emerges from large-scale symmetry. The isotropy of the CMB isn't arbitrary; it's a physical feature that picks out a frame. But this is contingent - in a swirling universe, they'd use different methods. His zircon dating is fundamentally different because it's local proper time, not global simultaneity.

  For the "now" question... ah, that's tricky. In block universe terms, "13.8 billion years ago" points to a particular hypersurface defined by cosmic time, while "now" is indexical - it's where we happen to be. If cosmologists took Rietdijk-Putnam completely seriously, they'd emphasize that cosmic time is a useful convention, not metaphysical truth. Papers might include more qualifiers like "in the CMB-rest frame".

  What's really smart here is how he connects his hands-on experience with deep philosophical issues. That example about zircons crystallizing 4.03 billion years ago shows he gets proper time - now he's wrestling with extending time concepts globally. His hypothetical about alternative universes demonstrates he understands this isn't necessary but contingent.

  The emotional undertone matters too - there's frustration at physicists' apparent inconsistency. I should acknowledge that while defending their position: their practice is coherent if we see cosmic time as physically significant but not metaphysically privileged. It's about what the universe gives us, not what we impose.
