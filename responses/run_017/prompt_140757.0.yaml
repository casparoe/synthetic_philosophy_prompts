  Okay, the user is preparing to teach a concept about Pareto improvements to engineers. They had a debate with a friend about whether a "safe" Pareto improvement already covers the ethics or if the "doubly safe" condition with opt-outs is essential. Now, they need to explain this to engineers who understand expected utility and A/B testing but lack welfare economics knowledge. 

  The engineers likely think "Pareto improvement" means nobody gets hurt and "safe" means riskless. The user wants a teaching plan that structures the concepts logically: starting from ex-post comparisons, moving to ex-ante with priors, then interim with learning. The example must be simple—probably two agents, no money—to avoid distractions. 

  Key misconceptions to address: confusing "safe" with riskless, thinking ex-ante gains justify imposition without consent, and seeing opt-outs as just redundancy. The closing question should test understanding of the distinction, not just vocabulary. 

  The plan must be under 450 words. The user hinted at deeper concerns: they might be designing systems where consent matters (e.g., changing defaults affects user autonomy), and engineers might overlook ethical nuances. The unresolved argument suggests the friend values informed consent more, while the user initially focused on aggregate utility. The example should subtly show why opt-outs matter ethically—e.g., a change that seems beneficial ex-ante but harms some upon learning, forcing a tradeoff between efficiency and autonomy. 

  For the example, imagine two users (A and B) and a system change. Under all priors, both have higher expected utility ex-ante. But after learning of the change, B realizes it harms them in specific states, making the opt-out crucial. This exposes the gap between "safe" (ex-ante) and "doubly safe" (interim consent). 

  Misconceptions will arise in order: first, "safe = riskless" (correct early by clarifying it’s about priors, not risk). Then, assuming ex-ante gains permit forced changes (blocked by showing B’s ex-post loss). Finally, seeing opt-outs as redundant (countered by explaining B’s learning). The closing question: "If all priors show higher expected utility, does that mean we can force the change? Why might B refuse?" 

  What to skip: compensation tests, behavioral responses beyond learning, or >2 agents. Focus on the prior set’s role and why interim consent differs from ex-ante. This keeps it tight for 80 minutes.
answer: |-
  Here’s your 80-minute teaching plan:

  **Core Structure (40 mins):**
  1.  **Ex-Post Baseline (10 mins):** Start with classical Pareto: **Ex-post outcomes**. "If we *knew* all future states, PI requires no one worse off, at least one better in *every* state." Highlight fragility: rarely applicable.  
  2.  **Ex-Ante & Uncertainty (15 mins):** Introduce **expected utility (EU)** and **priors**. Standard PI: Higher EU for all under *one shared prior*. Problem: Whose prior? **Enter Safe PI: Higher EU for all under *every prior* in a reasonable set.** "Safe" guards against prior disagreements/ambiguity, not physical risk.  
  3.  **Interim & Learning (15 mins):** After intervention is known but before uncertainty resolves (interim), users update beliefs. **Doubly Safe adds: No user's EU *decreases* upon learning the intervention happened and being offered a genuine opt-out.** It respects autonomy upon new information.

  **The Central Example (15 mins): Must-Haves:**  
  *   **Two agents (A, B), no money.** Simple system change (e.g., Default UI Layout X vs. Y).  
  *   **Uncertainty:** Outcome depends on an unknown state (e.g., Task Type "Simple" or "Complex").  
  *   **Divergent Preferences:** A always prefers Y. B prefers X for Simple tasks, Y for Complex.  
  *   **Priors:** Reasonable set includes priors where Simple is likely *and* priors where Complex is likely.  
  *   **Must NOT Contain:** Compensation (Kaldor-Hicks), more than 2 agents, or complex lotteries. Avoids scope creep.  

  **Example Walkthrough:**  
  *   *Status Quo:* Default X.  
  *   *Intervention:* Default Y.  
  *   *Safe PI?* Under *any* prior: A's EU always ↑ (strictly prefers Y). B's EU? If prior favors Complex, B's EU ↑ (prefers Y for Complex). If prior favors Simple, B's EU ↓ (prefers X). **Not Safe PI!** (B's EU ↓ under some priors). Alter preferences so B's EU weakly ↑ under *all* priors (e.g., B slightly prefers Y for Complex, indifferent for Simple). **Now Safe PI.**  
  *   *Doubly Safe?* Intervention adopted. B learns this. If B's prior *now* strongly favors Simple tasks, their *updated* EU for Y might be < EU for X. **Without opt-out, B is worse off interim.** Doubly Safe requires the opt-out prevents this drop.

  **Misconceptions & Preemption (20 mins):**  
  1.  **"Safe = Riskless"** (Early: During Ex-Ante definition). Counter: "Safe refers to robustness across *beliefs*, not eliminating outcome risk. A lottery ticket can be Safe PI if everyone's EU rises under all priors."  
  2.  **Ex-Ante Gains License Imposition** (After defining Safe PI). Counter: "Safe PI ensures *ex-ante* agreement *in expectation*. But upon learning the change happened (interim), an agent might realize *their specific situation* likely makes them worse off ex-post. Doubly Safe respects this."  
  3.  **Opt-out is Redundancy** (During Doubly Safe). Counter: "Without opt-out, the interim EU drop forces harm. The opt-out is the mechanism preventing that harm *after* information update. It's essential for consent."  
  4.  **Sliding to Compensation Tests** (If raised). Shut down: "Pareto requires *actual* non-harm without transfers. Kaldor-Hicks is different; we're sticking to strict Pareto today."

  **Closing Question (5 mins):**  
  *"We have a Safe PI: everyone's ex-ante EU is weakly higher under all our reasonable priors. Agent B learns the change is implemented. Could B rationally choose to use the opt-out? Why might they, even though it was a Safe PI?"*  
  *(Correct Answer: Yes. B's interim EU after learning the change happened, given their *updated* beliefs about the state, might be lower than under the status quo. The opt-out restores their status quo EU.)*

  **Openly Refuse to Cover:**  
  Kaldor-Hicks compensation tests, social welfare functions, defining the "reasonable set of priors" in depth, or behavioral responses beyond belief updating. Focus on definitions, sequence, and the autonomy gap.
