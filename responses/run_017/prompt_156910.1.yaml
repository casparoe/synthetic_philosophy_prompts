  Hmm, the core tension here is between the reform group's claim that approval voting "escapes" the theorem because it doesn't use rankings, versus opponents who say all systems are manipulable. The journalist's instinct to split the difference is reasonable but needs precision - especially since they want to include that ballot claim about never hurting your favorite.

  *scratches head* The reform group is technically correct that Gibbard-Satterthwaite formally applies only to ranked systems, but... that's like saying "this law against motorcycles doesn't ban bicycles" while ignoring there's a separate bicycle regulation. Approval voting has its own strategic vulnerabilities proven by other theorems. 

  Ah! The ballot statement is actually dangerous. Research shows you absolutely CAN hurt your favorite by approving others - like if you approve both A and B when you prefer A, potentially causing A to lose to B when they'd have beaten C alone. That's a classic center-squeeze scenario. 

  *checks watch* For the deadline, I should:
  - Confirm approval voting isn't covered by Gibbard-Satterthwaite (true)
