  On surtitles, she supports accessibility but argues they lead to propositional misreading. The user wants to avoid cheap shots, so the question should focus on the inherent conflict between her theory and the necessity of surtitles. The follow-up can question if the ensemble effect is compromised when audiences rely on text, pressing her on any empirical evidence she might have.

