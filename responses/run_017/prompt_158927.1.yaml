prompt: |-
  My brother relapsed in March and I've more or less stopped blaming him for it. Galen Strawson's Basic Argument did most of that work for me: you do what you do because of the way you are, to be truly responsible for what you do you'd have to be responsible for the way you are, and you can't be — you'd have to have chosen your own character, which would need a prior character you were responsible for, and so on forever. So there's nothing to blame. Fine, I can live there.

  But a friend of mine who works on epistemology ran an extension past me on Sunday and I can't find the exit:

  (1) The Basic Argument is sound: no one is ever truly morally responsible for anything.
  (2) Nothing in it is specifically moral. Its premises are about action, character and causation in general. So if moral blameworthiness needs ultimate self-origination, then every other kind of desert needs it too.
  (3) Epistemic credit and blame — being reasonable, dogmatic, closed-minded, careful, credulous — is just desert applied to belief-forming, and you form beliefs the way you do because of the way you are.
  (4) So no one ever deserves credit or criticism for any belief at all.
  (5) Which means no one is ever criticisable for dogmatism or wishful thinking, and no one — my friend and I included, right now — deserves any credit for getting an argument right, so the argument can't even be offered as something we have reason to accept. It eats itself.
  (6) That's absurd, and not in an interesting way.

  I want to keep (1), or something close to it — I need it for my brother. I also want to keep saying that some reasoning is bad reasoning and that some people really are closed-minded. So which step do I give up? Explain why it looked fine, and price me the alternatives: what does each rejection cost me? Please answer in British English, and no reading lists or citations — I've got no library access out here, so just work the argument itself.
reasoning: |-
  Okay, let me tackle this problem. The user has accepted Galen Strawson's Basic Argument about moral responsibility: we can't blame someone because they act according to who they are, and they didn't choose their initial character. Now their friend extended this to epistemic responsibility—credit or blame for beliefs. The user needs to reject one step to avoid the conclusion that no belief deserves criticism or credit, which would undermine the argument itself.

  First, I need to understand each step. Step 1 is the Basic Argument itself. The user wants to keep this for their brother's situation. Step 2 says the argument's premises aren't moral-specific, so it should apply to any desert, including epistemic. Step 3 links epistemic credit/blame to belief-forming processes, which are also determined by "the way you are." Step 4 concludes no one deserves credit or criticism for beliefs. Step 5 points out the self-defeating problem: if the argument is sound, we can't claim credit for it being correct. Step 6 calls this absurd.

  The user wants to keep moral non-responsibility but also criticize bad reasoning. The key is finding which step to reject without losing too much. Let me evaluate each step.

  Step 1: The user is committed here for their brother's sake. Rejecting this isn't an option. Step 2 seems solid—the Basic Argument's logic isn't inherently moral. Step 3 equates epistemic evaluation with desert, but maybe that's where the issue lies. Epistemic criticism might not require "desert" in the ultimate responsibility sense. Step 4 and 5 follow if Step 3 holds.

  So Step 3 is the most viable target. The friend assumes that epistemic credit/blame requires the same ultimate self-origination as moral responsibility. But perhaps epistemic evaluation is different—it's about assessing cognitive processes based on reliability or truth-conduciveness, not about deserving praise/blame in a deep moral sense. For example, calling someone closed-minded isn't about blaming them as a person but pointing out their method won't lead to true beliefs. This avoids the infinite regress problem because it's evaluative, not about desert.

  Rejecting Step 3 costs the user the idea that epistemic criticism implies deep responsibility. They have to accept that saying someone is dogmatic is a critique of their reasoning process, not a moral indictment. This might feel less satisfying but preserves the ability to critique reasoning while keeping moral non-responsibility intact.

  Alternatively, rejecting Step 2 by arguing the Basic Argument is only moral might work, but that's weak since the premises seem general. Rejecting Step 4 or 5 doesn't solve the core issue. Step 3 is the best candidate, allowing epistemic criticism based on standards rather than desert.
answer: |-
  Right, let's slice through this properly. Your friend's extension is clever, no doubt, but it smuggles in a crucial conflation. The step you need to give up is **(3)**, specifically the claim that *epistemic credit and blame is "just desert applied to belief-forming" in the same sense that moral desert requires ultimate self-origination*. Here's the breakdown:

  1.  **Why (3) Looks Fine (The Conflation):** It seems intuitive. We *talk* about "criticising" someone for being dogmatic or "crediting" them for being careful. Your friend equates this language directly with the deep, *metaphysical* desert Strawson targets – the kind requiring you to be the "ultimate source" of yourself. The surface similarity in vocabulary ("blame", "credit") makes this slide feel natural. If moral blame needs self-creation, why wouldn't epistemic criticism?

  2.  **Rejecting (3) – What It Means & The Cost:**
      *   **What it means:** You reject the idea that epistemic evaluation *requires* or *is fundamentally about* that same level of ultimate, buck-stopping responsibility that Strawson shows is impossible for moral actions. Epistemic evaluation ("this belief is unreasonable," "that inference was careless," "she's being closed-minded") isn't primarily about assigning *metaphysical desert* (praise/blame the agent *ultimately deserves* for being the kind of thinker they are). Instead, it's about *assessing cognitive performance and processes against standards aimed at truth*.
      *   **Why it works:** You can judge a belief-forming process as *unreliable*, *irrational*, or *truth-conducive* (or not) *regardless* of how the agent came to possess that process. Calling someone "closed-minded" points out a flaw *in their reasoning method* – it identifies a pattern resistant to counter-evidence, which systematically hinders acquiring true beliefs. This critique stands even if they didn't choose to be closed-minded. Similarly, "getting an argument right" demonstrates a successful application of reliable reasoning rules. Giving "credit" here is shorthand for recognising the successful operation of a good process, not awarding a metaphysical gold star for ultimate self-origination.
      *   **The Cost:** It costs you the satisfying feeling that epistemic criticism lands with the same *metaphysical thud* as moral blame might (or that you thought it did). You have to accept that when you say "that's dogmatic," you're not implying the person is *fundamentally, ultimately culpable* for their dogmatism in the way Strawson's argument negates for moral actions. You're pointing out a defective cognitive trait and its consequences for reaching truth. It feels less like "holding them accountable" in a deep, personal-responsibility sense, and more like diagnosing a faulty mechanism. It also means epistemic "credit" is more akin to recognising skill or good function than rewarding ultimate self-creation.

  3.  **Why the Other Steps are Harder to Reject:**
      *   **(1) The Basic Argument:** You need this for your brother. Giving it up is off the table. Its logic about the regress problem for *ultimate responsibility* seems robust for the moral sphere.
      *   **(2) Generality:** The Basic Argument's premises *are* about action, character, and causation generally. Rejecting this would require arguing there's something *specifically magical* about moral desert that makes it uniquely vulnerable to the regress, while epistemic desert somehow escapes. That feels ad hoc and unconvincing. The regress *does* seem to apply to any notion of desert requiring ultimate self-creation.
      *   **(4) & (5) The Self-Defeat & Absurdity:** These follow logically *if* you accept (3). If epistemic criticism *did* require ultimate self-origination, then (4) and (5) are correct, and the argument *would* eat itself. But this is precisely the absurdity that signals the error lies *before* here – in (3). Rejecting (4) or (5) directly just avoids confronting the flawed premise that leads to them. The absurdity isn't a flaw in the world; it's a reductio ad absurdum *of premise (3)*.

  **In short:** Keep Strawson for moral responsibility. Keep criticising dogmatism. The price is recognising that epistemic criticism isn't about deep, ultimate *desert* for being the way you are, it's about evaluating cognitive processes against standards of truth-seeking. You can call a spade a spade (a bad argument bad, a closed mind closed) without needing to hold the thinker ultimately responsible for *being* the kind of spade-wielder they are. The argument doesn't eat itself because recognising a sound argument is about *seeing its correctness*, not claiming ultimate credit for your own epistemic virtues. You see it *despite* the limitations of how you are, not because you deserve credit for transcending them. That’s the cost: giving up the notion that epistemic criticism implies a deeper metaphysical blameworthiness than it actually needs to.
