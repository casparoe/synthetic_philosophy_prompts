answer: |-
  Here is a procedural framework for certifying self-referential amendments, designed for operational use under your constraints. It prioritizes text-based analysis, clear stopping points, and auditable handoffs.

  ---

  ### **1. Certification Procedure: Ordered Questions**  
  *(Run sequentially; stop at first "Out of Order" or "Refer")*

  **Step 1: Threshold Authority**  
  *Question:* Does the proposal amend/repeal a provision governed by a *stricter adoption rule* than the one used for this resolution? (e.g., amending an entrenched Art. 113 provision using only Art. 112 procedure).  
  - *Burden:* Clerk (verify against consolidated text).  
  - *Sufficient Answer:* Textual confirmation of target provision’s status (entrenched/non-entrenched) and procedure used.  
  - *Standard:* Objective (text comparison).  
  - **OUTCOME:**  
    - **Yes → Out of Order** (Art. 113 violation).  
    - **No → Proceed to Step 2**.  

  **Step 2: Self-Amendment Check**  
  *Question:* Does the proposal modify Art. 112, Art. 113, or Art. 116? (i.e., rules about amendment procedures).  
  - *Burden:* Clerk (review proposal text).  
  - *Sufficient Answer:* Identification of affected articles.  
  - *Standard:* Objective (text match).  
  - **OUTCOME:**  
    - **Yes → Proceed to Step 2A**.  
    - **No → Proceed to Step 3**.  

  **Step 2A: Entrenchment Consistency**  
  *Question:* If modifying Art. 113, was a *third reading with 2/3 majority* used? (Art. 113 final sentence).  
  - *Burden:* Proponents (provide voting records).  
  - *Sufficient Answer:* Certified Assembly minutes showing 2/3 vote at third reading.  
  - *Standard:* Objective (record verification).  
  - **OUTCOME:**  
    - **Yes → Proceed to Step 3**.  
    - **No → Out of Order**.  

  **Step 3: Retroactivity Bar**  
  *Question:* Does the proposal have *retroactive effect* (express or implied)? (Art. 114).  
  - *Burden:* Clerk (review effective date/clauses).  
  - *Sufficient Answer:* Textual evidence (e.g., "effective [past date]", "validates prior act X").  
  - *Standard:* Objective (textual inference).  
  - **OUTCOME:**  
    - **Yes → Refer to Committee** (Political judgment on reliance/legitimacy; see Handoff Protocol).  
    - **No → Proceed to Step 4**.  

  **Step 4: Conflict Detection**  
  *Question:* Does the proposal *conflict* with an un-lapsed provision in the current consolidated text? (Art. 116).  
  - *Burden:* Clerk (compare with existing text).  
  - *Sufficient Answer:* Side-by-side text comparison showing direct conflict (e.g., contradictory procedures).  
  - *Standard:* Objective (textual conflict).  
  - **OUTCOME:**  
    - **Yes → Out of Order** (unless later amendment overrides).  
    - **No → In Order**.  

  ---

  ### **2. Handoff Protocol**  
  - **Refer to Committee:** Triggered at Step 3 (retroactivity).  
  - **Note Language:** *"Certification deferred under Step 3. Proposal seeks retroactive effect contrary to Art. 114. Committee must assess: (a) extent of public reliance on prior state of law; (b) legitimacy of curing defects ex post. Clerk recommends [specific concern]."*  
  - **Audit Trail:** Note records: (i) retroactive clause quoted, (ii) prior legal state, (iii) identified reliance (if any).  

  ---

  ### **3. Certification Vocabulary & Consolidation Rule**  
  - **In Order:** Passes all steps. → *Add to consolidated text.*  
  - **Out of Order:** Fails Step 1, Step 2A, or Step 4. → *Reject; do not consolidate.*  
  - **Refer:** Triggers Step 3. → *Withhold until Committee/Assembly decision.*  
  - **Consolidation of Doubtful Provisions:**  
    - If Assembly overrules certification → Consolidate with footnote: *"Adopted contrary to Clerk’s certification [Date]."*  
    - If provision is *in force and acted upon* but validity doubtful → Consolidate with footnote: *"Validity unresolved [Brief reason]."*  

  ---

  ### **4. One-Page Desk Guide for Deputies**  
  > **SARMATIA AMENDMENT CERTIFICATION (SELF-REFERENTIAL)**  
  > **STEP 1:** Is it changing a "harder-to-amend" rule? **YES → OUT. NO → NEXT.**  
  > **STEP 2:** Is it changing Arts. 112, 113, or 116? **YES → STEP 2A. NO → STEP 3.**  
  > **STEP 2A:** If changing Art. 113, was 2/3 at 3rd reading used? **YES → STEP 3. NO → OUT.**  
  > **STEP 3:** Does it work backwards in time? **YES → REFER TO COMMITTEE. NO → STEP 4.**  
  > **STEP 4:** Does it clash with current rules? **YES → OUT. NO → IN ORDER.**  
  > **NOTES:**  
  > - "OUT" = Reject. "REFER" = Send to Committee with reason memo.  
  > - Art. 115 sunset: Flag if provision >20 yrs old and not Ch. I-III.  
  > - Retroactivity = Any backward effect (express/implied).  
  > - Entrenchment = Art. 113 tag + 2/3 at 3rd reading.  

  ---

  ### **Application to Live Instruments**  

  **A. Resolution (i) 3/5 threshold; (ii) "shall not be amended or repealed"**  
  - *Analysis:*  
    - Step 1: Targets general amendment rule (Art. 112) → Not harder-to-amend → Proceed.  
    - Step 2: Amends Art. 112 → Proceed to Step 2A.  
    - Step 2A: Art. 113 not amended → Skip.  
    - Step 3: No retroactivity → Proceed.  
    - Step 4: No conflict → **In Order** for (i).  
    - **But (ii) is ineffective:** Art. 113 is exclusive entrenchment mechanism. "Shall not be amended" lacks Art. 113 procedure → Creates no legal barrier.  
  - *Certification Note:*  
    > *"Clause (i) amending Art. 112 is certified IN ORDER. Clause (ii) is INEFFECTUAL; entrenchment requires procedure under Art. 113. Clause (ii) will not be included in consolidated text."*  

  **B. Resolution repealing Art. 113 and entrenched Art. 96 in one instrument (Art. 112 procedure)**  
  - *Analysis:*  
    - Step 1: Art. 113 *itself* requires 2/3 at third reading for amendment (Art. 113 final sentence). Proposal uses Art. 112 (weaker) procedure → **Out of Order** at Step 1.  
  - *Lawful Alternative:*  
    - First, repeal Art. 113 using Art. 113’s own procedure (2/3 at third reading).  
    - Then, repeal Art. 96 under new amendment rules (if Art. 112 still exists).  
  - *Certification Note:*  
    > *"Resolution OUT OF ORDER under Step 1. Repeal of Art. 113 requires 2/3 majority at third reading (Art. 113). Lawful path: Repeal Art. 113 first via its own procedure, then Art. 96."*  

  **C. Retroactive repeal of Art. 114 + validation of past instruments**  
  - *Analysis:*  
    - Step 3: Proposal (i) repeals Art. 114 retroactively → **Triggers Referral** (retroactivity).  
    - Cannot certify: Art. 114 bars retroactive effect, including "curing" past defects.  
  - *Consolidation of Past Instruments:*  
    - Currently in text but defective (single reading). → **Flag in consolidation:**  
      > *"Arts. [X], [Y], [Z]: Adopted [Date] after one reading. Validity uncertain pending Art. 114 retroactivity proposal (Ref. [Current File])."*  
  - *Certification Note for New Proposal:*  
    > *"REFERRED to Committee under Step 3. Retroactive repeal of Art. 114 and validation of past instruments violates Art. 114’s bar on retroactivity. Reliance: Two ministries use instruments since [Date]. Committee must weigh legitimacy vs. legal defect."*  

  ---

  ### **Explicit Limits of Procedure**  
  1. **Art. 115 Sunset:**  
     - Art. 115 (22 yrs old, not Ch. I-III) likely lapsed → But it *governs its own validity*.  
     - **Procedure Cannot Resolve:** Certification must flag: *"Art. 115 may have self-lapsed; Assembly must reaffirm or clarify."*  

  2. **Political Override:**  
     - Where Assembly adopts a measure *clearly violating Charter* (e.g., ignores Art. 113), certification must still mark it "Out of Order" → Assembly may overrule.  
     - **Consolidation Rule:** Include with footnote: *"Adopted [Date] overriding Clerk’s certification [File]."*  

  3. **Silent Assumptions:**  
     - Assumes *Charter continuity*: Amendments alter the same Charter (Art. 116 implies this).  
     - **Misfire Risk:** If Assembly adopts conflicting amendments *simultaneously*, Art. 116 (later adoption prevails) may not resolve → Flag conflict; let courts/Assembly decide.  

  4. **Non-Justiciable Issues:**  
     - Cannot assess "legitimacy" of validly adopted amendments (e.g., democratic deficits). → Certification is strictly textual; legitimacy is for political challenge.  

  ---  
  This procedure prioritizes textual fidelity, minimizes subjective judgment, and provides auditable off-ramps for political questions. It assumes deputies can reliably compare texts and voting records.
