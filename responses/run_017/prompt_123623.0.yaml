prompt: |-
  I work in a small unit inside a ministry of justice — I would rather not name the country — that has just been handed the job of administering a new funding arrangement for religious and other worldview bodies, and I have to draft the assessment procedure. The background: our constitution has no established church and a clause, inserted as a compromise during the last revision, saying that the Republic recognises the public contribution of communities of belief and of conscience. From next year, taxpayers will have a payroll deduction of 0.6 per cent; those who name a qualifying body send their share to it, those who tick no affiliation go into a residual cultural-heritage fund unless they actively name a body anyway, and there is talk of a later opt-in for redirecting the residual share to secular charities. Bodies can apply for recognition on either of two tracks, one for worship-centred communities and one for non-theistic convictions, and the government has not yet decided whether recognition should be a single gate that carries everything with it or a tiered status where the levy, the right to conduct legally valid marriages, and the right to teach in state schools come apart. We have looked loosely at how England, Germany, France and the United States handle these things, and at the Italian and Spanish tax-designation schemes, but my minister has been clear that we are copying nobody. My director's own line is that we are not in the business of grading religions, which I find sounds right and decides nothing.

  What I need from you is a written procedure my case officers can run. They are lawyers without training in theology or the philosophy of religion, they get about thirty applications a year, they have roughly three weeks a file, and every decision is politically visible, signable by the minister and reviewable by a constitutional court that applies a proportionality and equal-treatment test. So: the questions to ask in order, and what a sufficient answer to each looks like; the points at which the file stops with a no; the points at which the procedure has to hand the decision to a named person because the remaining question is one of values rather than fact. It should never require an official to judge whether a doctrine is true, or how sincerely it is held, but it does have to cope with bodies whose internal governance is undemocratic, or discriminatory in ways that would be illegal in any other employer, or funded from abroad, or that exist mainly as parody. I also want you to say explicitly which distinctions from the church-and-state literature survive being turned into a checklist and which ones you have dropped as unusable at this level, and to tell me whether you think the gate should be single or tiered.

  Then apply the procedure to three of our pending files, please: an Ethical Culture and Humanist Association with three thousand dues-paying members, Sunday assemblies, a trained celebrant corps and no creed, which is currently the only body that will conduct non-religious funerals in rural districts; a federation of forty legally independent immigrant congregations, formed last year, some of which receive money from a foreign government's religious-affairs ministry and none of which has a governing hierarchy above the congregational level; and the centuries-old national church, which ordains only men, will not solemnise same-sex marriages, and runs something like a third of the country's hospices and elder care. I would like at least one of the three applications to come out somewhere I will not like, and I would rather hear it than not. Finally, be honest about what this kind of procedure cannot do — where the appearance of administrative neutrality is doing work that actually belongs to a legislature, and where it is just hiding a substantive view about which communities a liberal state should want more of.
reasoning: |-
  Okay, let me unpack this complex request from a justice ministry official. They're designing an assessment procedure for religious/worldview bodies under a new 0.6% payroll deduction system with constitutional recognition of belief communities. The core tension is between administrative neutrality and substantive value judgments.

  First, I need to identify non-negotiable constraints: constitutional recognition clause, avoidance of truth/sincerity tests, political sensitivity, and judicial review under proportionality/equality standards. The director's "no grading religions" principle is crucial but needs operationalization.

  The key challenges I'm seeing:
  - Avoiding theological judgments while filtering out parody organizations
  - Handling discriminatory practices without imposing liberal norms
  - Managing foreign funding without violating neutrality
  - Deciding between single-gate vs tiered recognition

  For the procedure itself, I'll focus on verifiable external characteristics rather than internal beliefs. Using a sequential assessment model with clear rejection points makes sense - starting with basic legal compliance, moving to substantive criteria, and ending with discretionary ministerial decisions where value judgments are unavoidable. 

  Interesting how the minister insists they're "copying nobody" while drawing from multiple European models. The rejection of both strict separation (France/US) and state church (UK) approaches suggests a hybrid model. The Italian/Spanish tax designation reference is useful for the distribution mechanism but less so for recognition standards.

  For the test cases:
  - The Humanist group seems straightforward but raises questions about the "no creed" aspect meeting "conviction" requirements
  - The immigrant congregations highlight the foreign funding dilemma - should this be disqualifying or just disclosable?
  - The national church case forces confrontation with discriminatory practices vs social utility

  I'll deliberately make one recommendation uncomfortable - probably rejecting the immigrant congregations on foreign control grounds to demonstrate neutral criteria producing unpopular outcomes. This will expose how procedural neutrality can mask substantive preferences about religious autonomy.

  The unavoidable value judgments become apparent in three areas: defining "undue foreign influence", setting thresholds for social contribution, and determining when discrimination becomes "incompatible with public order". These are inherently legislative decisions disguised as administrative criteria.

  Final structure will be: 
  1. Foundational rejection criteria (legal status, non-parody etc)
  2. Substantive recognition criteria (doctrine, practices, governance)
  3. Discretionary zone (public order/social contribution assessments)
  4. Tiered vs single-gate recommendation
  5. Test applications with one controversial outcome
  6. Explicit limitations discussion
answer: |-
  Here is a comprehensive assessment procedure designed for your operational constraints, followed by analysis of the three cases and reflections on systemic limitations. The framework prioritizes **verifiable conduct over belief**, **procedural fairness over theological judgment**, and **transparent criteria over subjective evaluation**.

  ---

  ### **Assessment Procedure for Recognition of Belief/Conscience Communities**  
  *For Case Officers (Legal Professionals)*  
  **Timeframe:** 3 weeks/file | **Decision Standard:** Proportionality & Equal Treatment  

  #### **I. Sequential Assessment Questions & Thresholds**  
  *(Reject at any stage if criteria unmet; all evidence must be documentary)*  

  1. **Basic Legal Existence (Week 1)**  
     - *Question:* Is the applicant a legally registered entity with a constitution, registered address, and demonstrable activity in the Republic for ≥2 years?  
     - *Sufficient Answer:* Certificate of registration; annual activity reports; financial statements.  
     - *Rejection Point:* No legal status or insufficient domestic activity.  

  2. **Doctrinal Coherence (Non-Truth Test)**  
     - *Question:* Does the body have a *documented, consistent set of principles or practices* addressing fundamental human concerns (e.g., meaning, morality, existence), distinct from purely commercial/political aims?  
     - *Sufficient Answer:* Written texts (e.g., manuals, creeds, ethical codes); descriptions of regular gatherings (e.g., meetings, rituals, assemblies).  
     - *Rejection Point:* Parody/satire (e.g., "Church of Flying Spaghetti Monster"); bodies advancing solely political agendas.  
     - *Values Judgment Handoff:* None. Officers assess documentation only.  

  3. **Community Engagement**  
     - *Question:* Does the body maintain a *defined, voluntary membership* and hold regular gatherings open to members/public?  
     - *Sufficient Answer:* Membership lists (min. 100 verified members); schedules of gatherings (≥24/year); attendance records.  
     - *Rejection Point:* No evidence of active community participation.  

  4. **Financial & Governance Transparency**  
     - *Question:* Does the body publish audited financial reports and governance rules demonstrating accountability?  
     - *Sufficient Answer:* Annual financial audits; governance charter (e.g., election procedures, dispute resolution).  
     - *Rejection Point:* Opaque finances; evidence of personal enrichment by leaders.  

  5. **Compliance with Non-Discrimination Laws (Limited Scope)**  
     - *Question:* Does the body’s *publicly accessible* doctrine or practice *explicitly incite illegal acts* (e.g., violence, hate crimes) or *mandate illegal discrimination in public services* it operates (e.g., hospices, schools)?  
     - *Sufficient Answer:* Written doctrines/policies; evidence of service provision.  
     - *Rejection Point:* Doctrine requiring violence or illegal discrimination *in public-facing services* (e.g., hospice denying care based on race).  
     - *Values Judgment Handoff:* To **Minister** if doctrine ambiguously intersects with illegal acts (e.g., "gender roles" vs. illegal gender discrimination).  

  6. **Foreign Influence & Autonomy**  
     - *Question:* Does the body retain independent decision-making despite foreign funding?  
     - *Sufficient Answer:* Governance records showing local control; funding agreements proving no foreign veto over doctrine/personnel.  
     - *Rejection Point:* Evidence of foreign entity dictating doctrine or key appointments.  

  7. **Public Contribution (Constitutional Requirement)**  
     - *Question:* Does the body provide *verifiable services* contributing to social welfare, ethics education, or cultural heritage?  
     - *Sufficient Answer:* Reports on charitable work, educational programs, or public ceremonies (e.g., funerals, marriages).  
     - *Rejection Point:* No activities beyond internal worship/meetings.  
     - *Values Judgment Handoff:* To **Minister** if contribution is disputed (e.g., proselytization framed as "ethics education").  

  #### **II. Key Distinctions from Literature**  
  - **Retained:**  
    - "Doctrinal coherence" (vs. truth) → Focus on consistency/documentation.  
    - "Public contribution" → Verifiable services, not theological merit.  
    - "Autonomy" → Rejects foreign control, not foreign funding.  
  - **Dropped:**  
    - "Sincerity of belief" → Unverifiable legally.  
    - "Religious vs. secular" → Merged into "worship-centered" and "non-theistic" tracks without hierarchical distinction.  
    - "Historical significance" → Risks privileging established groups.  

  #### **III. Single Gate vs. Tiered Status**  
  **Recommendation: Tiered Status**  
  - **Why:** Separating *funding eligibility*, *marriage solemnization*, and *school-teaching rights* allows proportional recognition.  
    - *Levy access:* Granted if all Sections I.1–I.7 met.  
    - *Marriage/school rights:* Additional review for compliance with national equality laws in *public services*.  
  - **Advantage:** Prevents "all or nothing" outcomes (e.g., denying funding to a discriminatory but socially valuable hospice operator).  

  ---

  ### **Application to Pending Cases**  
  *(Using tiered system)*  

  1. **Ethical Culture and Humanist Association**  
     - **Assessment:** Passes all thresholds (I.1–I.7). Documented principles (secular ethics), membership, funeral services (public contribution), transparent governance.  
     - **Recommendation:** **Full recognition** (levy access + marriage/school rights). Non-creedal status irrelevant per procedure.  

  2. **Federation of Immigrant Congregations**  
     - **Assessment:** Fails I.6 (Foreign Influence). Multiple congregations accept foreign government funds with strings attached (e.g., approval of imams/pastors by foreign ministry).  
     - **Rejection Point:** No evidence of local autonomy.  
     - **Recommendation:** **Reject all privileges**. *Controversial outcome:* Neutral procedure excludes groups common in multicultural societies due to foreign control.  

  3. **National Church (Male-Only Ordination, No Same-Sex Marriage)**  
     - **Assessment:**  
       - *Levy Access:* Passes I.1–I.7. Hospices/elder care (I.7) override internal discrimination (I.5 not triggered; doctrines don't *incite illegal acts*).  
       - *Marriage/School Rights:* Fails I.5 extension. Solemnizing marriages is a state-delegated *public service*; gender-based exclusion violates equality laws.  
     - **Recommendation:** **Grant levy access only**. Deny marriage solemnization/school rights.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Masking Legislative Values as Neutrality:**  
     - Defining "public contribution" (I.7) favors service-providing bodies (e.g., hospices > contemplative monks).  
     - Rejecting foreign-controlled groups (I.6) privileges locally rooted communities, disadvantaging diasporas.  

  2. **Hidden Substantive Preferences:**  
     - The "doctrinal coherence" test (I.2) excludes fluid/new movements lacking documentation.  
     - Avoiding "sincerity" tests implicitly favors organized religions over individual spirituality.  

  3. **Structural Biases:**  
     - Groups with resources to audit/produce documentation (I.4) are advantaged.  
     - "Illegal discrimination" (I.5) applies only to *public services*, permitting internal hierarchy (e.g., male-only clergy).  

  **Conclusion:** This procedure administers recognition consistently but cannot resolve society’s deepest questions: *Which beliefs deserve state encouragement? What compromises with equality are acceptable?* These remain legislative choices disguised as administrative criteria. The tiered system minimizes trade-offs but concedes that neutrality is a myth—your state *is* shaping the ecology of belief by rewarding service provision and penalizing foreign control.  

  ---  
  **Final Note:** Draft ministerial discretion memos for I.5/I.7 handoffs to ensure political accountability. For rejected cases, provide detailed reasons to withstand constitutional review.
