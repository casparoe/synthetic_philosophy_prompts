prompt: |-
  I'm a teaching assistant for a graduate seminar on explanation in evolutionary biology, and next week we're doing the adaptationist programme and the Gould–Lewontin spandrels critique. I want a piece of mock-documentary satire to hand out alongside the readings: a parody of the compliance form that a fictional journal — call it the *Journal of Ultimate Design* — requires every submitted manuscript to file, a "Certification of Adaptation," submitted by a fictional lab (Brocklebank Institute for Ultimate Causation) in support of a paper arguing that the near-universal human disposition to press the "door close" button in an elevator — including in elevators where the button is disconnected, which is most of them — is an adaptation produced by a dedicated closure-response module, shaped in the ancestral environment by the fitness value of rapidly sealing an enclosure against predators, cold, and intruders. Roughly 700–900 words, laid out as a numbered form: a manuscript header block, eight or nine numbered certification items the authors must swear to, and a closing line recording the editorial decision.

  The jokes have to come from getting the methodology right rather than from inventing absurdities, so exaggerate real features of adaptationist practice, don't fabricate new ones: the atomization of a trait into sub-traits until a function can be found for one of them (and then speaking of the whole as a "trait complex"); the argument from costliness or "special design"; reverse-engineering an ancestral function and then treating the elevator as a supernormal stimulus exploiting a mismatch with the ancestral environment; a small optimality model with a cost-benefit curve that is fitted rather than derived; a comparative prediction from a single outgroup; and the ritual dismissal of the byproduct and developmental-constraint alternatives as untestable, unfalsifiable, or a mere redescription of the phenomenon to be explained. In the same spirit, give the form a quantitative confidence device — a "Design Confidence Score" obtained by multiplying the authors' own ratings for costliness, specificity of design, cross-cultural universality, and so on, with a pass threshold, and a clause permitting authors whose score falls short to subdivide the trait and resubmit. The authors should be competent and deadpan throughout: everything they sign should be something a real, good adaptationist could write with a straight face, because the reductio depends on their competence — a reader should feel that a practitioner following the form faithfully could certify almost anything, without the text ever saying so.

  Two further constraints. First, include at least two bracketed interventions from the journal's in-house spandrel skeptic interleaved with the items; at least one must be a genuinely strong objection (that the behavior is best explained as a byproduct of a general-purpose causal-contact or goal-completion system plus a modern artifact, with no selection history of its own), and the authors' answer to it should be recognizable, on reflection, as not answering it at all. Second, never name Gould or Lewontin or any living researcher — have the authors refer to their critics only obliquely, as the San Marco school or the Pangloss-skeptics — and don't let anyone break character to signal that this is a joke. No citations or bibliography are needed; the piece should be legible and funny to a newcomer who has only half-remembered the debate, while making someone who actually knows the literature wince in recognition.
reasoning: |-
  We are creating a mock certification form for a fictional journal. The form is filled out by authors from the Brocklebank Institute for the paper about the "door close" button pressing behavior. The form must include:
   - A manuscript header block with fictional details.
   - 8 or 9 numbered certification items that the authors must swear to, each reflecting real but exaggerated adaptationist practices.
   - A quantitative "Design Confidence Score" with factors like costliness, specificity, etc., and a pass threshold. There should be a clause allowing trait subdivision if the score is too low.
   - Two bracketed interventions from the journal's in-house spandrel skeptic (one being a strong objection that the behavior is a byproduct of a general system, and the authors' non-answer to it).
   - The authors must be deadpan and competent, never breaking character.
   - Never mention Gould, Lewontin, or living researchers; refer to critics as the "San Marco school" or "Pangloss-skeptics".
   - The editorial decision at the end.

   The form must be 700-900 words.

   Structure:
   1. Manuscript header block (title, authors, etc.)
   2. Certification items (8-9 items), with two bracketed skeptic interventions and the authors' responses.
   3. Design Confidence Score section (with ratings and multiplication, and the subdivision clause).
   4. Editorial decision.

   Let's outline the certification items to cover the required points:

   Item 1: Trait atomization - breaking the behavior into sub-traits until one can be assigned a function, then treating the whole as a "trait complex".
      Example: The act of pressing the button is broken down into: (a) visual recognition of the button, (b) motor approach, (c) precise finger extension, (d) application of force, etc.

   Item 2: Argument from costliness - note that the behavior is costly (time, energy, opportunity cost) and therefore unlikely to be maintained without adaptive function.

   Item 3: Specificity of design - the behavior is precisely tailored to achieve door closure, even when the button is non-functional, because it is triggered by the specific visual and tactile cues of the button.

   Item 4: Reverse-engineering the ancestral function - propose that in the ancestral environment, sealing enclosures had high fitness value (against predators, cold, intruders). The elevator button is a supernormal stimulus that triggers this module.

   Item 5: Optimality model - a simple cost-benefit model: cost of pressing (time, energy) vs. benefit of closure (safety, warmth). The curve is fitted to show that the observed behavior (pressing even when non-functional) is at the optimum because the cost is low and the perceived benefit is high.

   Item 6: Comparative prediction - use a single outgroup (say, non-human primates) to show that they do not press buttons to close doors, but they do seal entrances in other ways (e.g., covering with leaves). Thus, the human behavior is derived.

   Item 7: Dismissal of byproduct hypothesis - dismiss the idea that the behavior is a byproduct of a general causal system as untestable and unfalsifiable, and that it is a mere redescription.

   Item 8: Dismissal of developmental constraint - similarly dismiss.

   Then we can have:

   Item 9: Cross-cultural universality - the behavior is observed in all studied cultures, even those without elevators (they press similar buttons in other contexts).

   Now, we need two skeptic interventions. Let's place one after the specificity of design (item 3) and one after the byproduct dismissal (item 7).

   Skeptic Intervention 1 (after item 3): [Skeptic: How do you rule out that this behavior is a byproduct of a general-purpose system for causal contact (pressing buttons to get things to happen) or goal completion (the desire to have the door close, which is satisfied by the act regardless of outcome), with no specific selection history?]

   Author response: We note that the behavior is highly specific to the door-close context and is not triggered by other buttons (e.g., elevator call buttons, which are not pressed repeatedly). Moreover, the motor pattern is precise and invariant, suggesting a dedicated module. The general-purpose system hypothesis is untestable because it does not make specific predictions about the form of the behavior.

   Skeptic Intervention 2 (after item 7): [Skeptic: The byproduct hypothesis is testable: if the behavior is a byproduct of a general system, then it should occur in any context where a button is associated with a desired outcome, regardless of the outcome's relation to ancestral threats. Your own data show that people press the door close button even when they know it is disconnected, which is consistent with a general goal-completion mechanism and not an adaptive module for predator avoidance.]

   Author response: We contend that the persistence of the behavior in the face of disconnection is evidence of the module's robustness and the strength of the supernormal stimulus. The byproduct hypothesis, by being so flexible, becomes a non-predictive redescription.

   Now, the Design Confidence Score:

   Factors (each rated 1-10 by the authors):
     - Costliness (C): How costly is the behavior? (We argued it's costly, so high rating)
     - Specificity of Design (S): How specific is the behavior to its function? (high)
     - Cross-Cultural Universality (U): (high, we claim)
     - Fit of Optimality Model (O): How well does the behavior fit the model? (high)
     - Comparative Support (P): From the outgroup comparison (high)

   Formula: DCS = C * S * U * O * P

   Threshold: 10000 (so if each is 10, 10^5=100000, which is way above; but if one is low, it might be below).

   If the score is below 10000, the authors can subdivide the trait and recertify.

   Editorial decision: We'll have it pass.

   Let's write in form style.

   Word count: We have to be between 700-900 words. We'll write concisely.

   Start with the header.
answer: |-
  **Journal of Ultimate Design**  
  Manuscript Certification Form: Adaptationist Compliance  
  Manuscript ID: JUD-2024-007  
  Title: "The Ancestral Seal-Response Module: Adaptive Origins of Persistent Elevator Door-Close Button Pressing in *Homo sapiens*"  
  Authors: Dr. A. Thorne, Dr. E. Vance, Brocklebank Institute for Ultimate Causation  

  ---

  **CERTIFICATION OF ADAPTATION**  

  We, the undersigned authors, hereby attest that the above manuscript adheres to the methodological standards of the *Journal of Ultimate Design* (JUD) by satisfying the following criteria for identifying adaptations. All claims derive from empirical data and theoretical rigor.  

  1. **Trait Atomization and Functional Assignment**  
     The behavior ("door-close button pressing") is decomposed into constituent sub-traits: (a) visual targeting of vertically aligned, illuminated interfaces; (b) rapid distal limb extension; (c) precise force application (0.5–1.5 N); and (d) sustained attention to portal integrity. Sub-trait (d) is identified as the core adaptation ("portal-sealing vigilance"). The unified behavior is thus a "trait complex" sculpted by selection, with sub-trait (d) as its functional anchor.  

  2. **Costliness and Maintenance by Selection**  
     Button pressing incurs costs: caloric expenditure (0.001–0.003 kcal/act), opportunity costs (mean delay: 1.2 sec/act), and predation/vigilance trade-offs (reduced environmental monitoring). These costs imply selective maintenance, as non-adaptive byproducts would be eliminated by drift.  

  3. **Specificity of Design**  
     Motor sequencing (traits b–c) exhibits "special design": tactile feedback is ignored when auditory closure signals are absent (e.g., disconnected buttons), proving targeting is optimized for visual cues *alone*—a hallmark of dedicated function.  

  > **[JUD Spandrel Auditor's Intervention #1]**  
  > *Couldn’t this behavior emerge from a general-purpose causal system? E.g., a cognitive module for "goal completion via mechanical contact" (pressing buttons to achieve outcomes) co-opted by modern interfaces? This requires no adaptive history for door-close pressing specifically.*  
  >   
  > **Authors' Response**: We reject this. Specificity is evident: subjects ignore adjacent non-portal buttons (e.g., floor selectors), and motor patterns differ from other button-pressing contexts (e.g., keypads). The "general system" is an untestable null hypothesis.  

  4. **Ancestral Function and Supernormal Stimuli**  
     The trait complex reverse-engineers an ancestral Pleistocene function: sealing shelters against threats (predators, climatic stress, rival bands). Fitness gains are modeled at 2.3 offspring/lifetime per 10% reduction in enclosure breaches. Modern elevators present supernormal stimuli—larger, illuminated, vibration-damped "seals"—explaining persistence despite functional disconnect.  

  5. **Optimality Modeling**  
     A cost-benefit model confirms adaptation: Benefit *B* = (threat severity × sealing efficacy) / metabolic load; Cost *C* = (time × predation risk) + energy. The curve peaks at 1.5 presses/encounter (observed mean: 1.4). Parameters are fitted to observational data (Fig. 3), ensuring biological realism.  

  6. **Comparative Phylogenetic Prediction**  
     Outgroup testing (Pan troglodytes) confirms derived novelty: Chimps seal nests with foliage but show no interest in artificial buttons (p=0.02). This supports *H. sapiens*-specific adaptation.  

  7. **Dismissal of Byproduct Alternatives**  
     Non-adaptive hypotheses (e.g., "spandrel" effects of general learning) are rejected. They are unfalsifiable: Any behavior can be reframed as a byproduct. They also redescribe—not explain—the phenomenon (e.g., "learning" does not clarify why *this* behavior is cross-culturally fixed).  

  > **[JUD Spandrel Auditor's Intervention #2]**  
  > *The byproduct hypothesis is testable: If button pressing stems from a general goal-completion system, it should occur whenever subjects desire outcomes (e.g., traffic-light buttons), regardless of ancestral threats. Your data show pressing persists even when subjects *know* buttons are disconnected—consistent with a byproduct of causal superstition, not a Pleistocene seal-adaptation.*  
  >   
  > **Authors' Response**: Knowledge of disconnection is irrelevant; the trait is elicited by perceptual cues (Item 3). The San Marco school’s "redescriptive alternatives" ignore that only portal-aligned buttons trigger the behavior. We maintain that byproduct hypotheses lack predictive specificity.  

  8. **Developmental Constraint Exclusion**  
     Constraints (e.g., pleiotropic effects of motor neuron wiring) are dismissed. They cannot account for the behavior’s precision, universality, or context-dependent expression. Such models are non-explanatory; they merely assert "it couldn’t be otherwise."  

  9. **Cross-Cultural Universality**  
     The behavior occurs in all 37 sampled populations (including nomadic foragers and industrialized societies). Non-elevator contexts (e.g., sealing tent flaps) elicit analogous motor sequences, confirming deep homologies.  

  ---

  **DESIGN CONFIDENCE SCORE (DCS) CALCULATION**  
  Rate each domain (1–10). Multiply for final DCS. Threshold: 250.  

  - **Costliness (C)**: 8 (see Item 2)  
  - **Specificity of Design (S)**: 9 (see Item 3)  
  - **Universality (U)**: 10 (see Item 9)  
  - **Optimality Fit (O)**: 8 (see Item 5; R²=0.89)  
  - **Comparative Support (P)**: 7 (see Item 6; one outgroup)  
  - **Ancestral Plausibility (A)**: 9 (see Item 4)  

  **DCS = C × S × U × O × P × A = 8 × 9 × 10 × 8 × 7 × 9 = 362,880**  

  > *Note: DCS < 250 requires trait re-atomization per JUD Policy 4.1b. Authors may subdivide traits (e.g., "force application" vs. "target acquisition") and resubmit.*  

  ---

  **EDITORIAL DECISION**  
  ☑ CERTIFICATION ACCEPTED  
  ☐ REVISE (DCS < 250 or incomplete rebuttals)  
  ☐ REJECT (Pangloss-skepticism detected)  

  *"A triumph of rigorous reverse-engineering. The Brocklebank Institute demonstrates how atomization and optimality modeling can extract design from even the most opaque modern behaviors."*  
  —Prof. C. Darlington, Deputy Editor, *Journal of Ultimate Design*
