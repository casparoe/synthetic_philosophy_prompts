  Planning the structure: Petrarchan sonnet (ABBA ABBA CDE CDE) to support the conceptual turn at line 9. Octave builds the intuitive picture: body-as-machine with mental "dials." Volta introduces the "pain without awareness" counterexample. Sestet uses lab imagery for the three points: inference (line 10), calibration (11-12), observer effect (13). Couplet reframes reports as essential but uncalibrated instruments.

  Content mapping: Lines 1-4 establish the "internal dials" metaphor. 5-8 show confidence in direct access. 9-10 pivot to cases where state and awareness dissociate. 11-12 present the proxy problem (neural signals needing subjective reports). 13-14 show attention's distorting effect. Couplet rejects "readout" but keeps reports as vital tools.

  Biggest challenge is compressing the calibration paradox into verse. "No gauge behind the gauge" captures it - subjective experience is both instrument and measurement standard. The recorder image appears in "two pens write" and "traces stray," showing parallel data streams without ground truth.

  Observer effect appears through breathing imagery ("attended breath departs its silent beat") - a concrete example scientists will recognize. The "machine was wrong" callback to the user's career reinforces that dismissal is also flawed.

