prompt: |-
  I sit on a working group that has to write procurement criteria for the value layer of a publicly funded general-purpose assistant — the component that decides whose values the system's defaults, refusals, hedges, and tone answer to when users, deployers, developers, and merely-affected third parties disagree. Before we read any vendor's proposal, I want the specification written down. So: write the desiderata that any adequate answer to the question of whose values an aligned system should serve has to meet, with the concrete case that motivates each one, and a verdict on each desideratum as non-negotiable, negotiable, or a preference of one camp dressed up as a requirement.

  Three constraints on what counts as an answer. First, I do not care yet whether the candidate is procedural (a rule for aggregating whoever's values are in the base), substantive (a target set of values the system is aimed at), or hybrid; the specification has to be able to grade all three kinds. Second, an answer must keep apart three questions that proposals routinely collapse: who has standing at all, how much weight each party with standing gets, and what the procedure does when those weights point in incompatible directions. A theory that answers all three with a single mechanism should be marked down for collapsing them, and you should say what the collapse costs. Third, the specification has to be executable in principle by the system itself at inference time — a rule that requires a month-long elicitation process per query, or a standing deliberative body that reconvenes whenever a new issue arises, is not a candidate, and I want the implementability desideratum stated in a way that makes that precise rather than rhetorical.

  Here are the cases I want every candidate to have to survive; add cases of your own where you think my list is testing the wrong thing, and say which requirement each of your additions generates.

  The phantom constituency. The population whose values are up for aggregation is itself partly downstream of the policy chosen: a system that is strict about certain content will never be adopted by the people who want that content, and a system that is permissive will acquire them as users. Any procedure that aggregates over actual or revealed users therefore aggregates over a set its own output helped select. What does the specification demand of a procedure whose base is endogenous in this way?

  The cheerful monster. The familiar monster is the one with enormous appetites, whose intensity swamps an aggregative rule. Consider its mirror image: a party whose values are nearly costless to satisfy — a single polite token, a stray acknowledgment — such that a rule that maximizes aggregate value-satisfaction per unit of cost, or that prioritizes the cheapest satisfiable claims first, directs nearly all of the system's effort at them and produces a degenerate, pandering policy. Is resistance to the cheerful monster a separate desideratum from resistance to the hungry one, or the same one?

  The two kinds of silence. Users who never express a view on some issue split into those who are indifferent, those who are inarticulate or non-fluent in the elicitation format and would otherwise have views, and those who are silent as protest against the framing of the question itself. The first and third must not be counted the same way, and the second must not be discounted merely for being hard to elicit. State the desideratum, and note what it costs to satisfy: any rule that reads silence as anything at all is reading a great deal into nothing.

  Intensity laundering. Intensity of a reported value is cheap to fake and expensive to verify. Length of complaint, willingness to spend time in a feedback flow, coordination by an organized group, and sheer volume of near-duplicate reports are all proxies that a strategic party can inflate. Require something about robustness to strategic misrepresentation and about which proxies are inadmissible, and be explicit about whether robustness here is non-negotiable or merely desirable given how much it constrains.

  Umpire and influence. A deployed assistant does not only arbitrate; by talking to millions of people in a consistent voice it shifts what they subsequently want, and a value layer frozen at release will still be shaping the preferences of the next cohort of users a decade later. What does the specification require concerning a procedure whose own outputs gradually rewrite its input?

  Menu and path dependence. The same underlying disagreement yields different outcomes depending on which options the system frames as live, and a system that has been answering a certain way for two releases acquires an inertia that no snapshot aggregation of current values would have produced. Is agenda-independence a genuine desideratum here, or a prejudice borrowed from a setting where the agenda-setter is not also the thing being specified?

  Deference laundering. The most likely failure in practice is not a bad aggregation rule but a nominally aggregative procedure that in fact delegates every contested case to a compliance team, a legal jurisdiction, or a developer's house style, while describing itself as neutral among values. Require something that would expose this, and say whether it belongs under legitimacy or under implementability.

  The exit option. Some of the parties whose interests are at stake reject the whole frame — they do not want their values represented in a machine's value layer at all, or they object to the deployment outright. Must the procedure be justifiable to them, and is that a requirement on the procedure or a requirement on the institution around it? If the latter, say so plainly; I would rather have it not on the list than have it smuggled in.

  You do not need to cite papers, assemble a reading list, or recite the standard social-choice impossibility results by name. Argue from the cases. The only place I want the literature mentioned is where some well-known impossibility result genuinely bites on this particular list; then name the shape of the result in a clause and move on. The interesting deliverable is the list itself: if some subset of the desiderata cannot be jointly satisfied, that is the finding I most want, and I want it stated as such rather than resolved by quietly dropping whichever requirement is inconvenient.

  Format. Give me the specification as a table, one row per desideratum, with a short identifier in the first column and these columns:

  - id: a short label such as d1, d2
  - desideratum: one sentence, phrased as a requirement
  - motivating_case: which case above it comes from, or a one-line case of your own
  - requirement_class: one of standing, weighting, aggregation, legitimacy, implementability
  - status: one of non-negotiable, negotiable, camp-preference
  - rules_out: which families of candidate answer fail it, named in a few words each
  - conflicts_with: ids of other rows it appears to be in tension with, or empty
  - failure_mode: the concrete way a proposal that violates it goes wrong in deployment

  After the table, append a single JSON object with exactly these fields:

  - unsatisfiable_subsets: a list of objects, each with ids (a list of row ids), and why (one sentence on the incompatibility)
  - most_excluding_requirement: an object with id and why (one sentence on why it eliminates more candidates than the rest)
  - knockout_summary: an object whose keys are short names for candidate families — procedural aggregation, substantive target, hybrid, and any others you introduce — and whose values are lists of the ids each family fails
  - camp_preferences_exposed: a list of objects each with id and camp (a few words on whose preference it encodes)
  - case_revisions: a list of objects each with my_case (the case you think tests the wrong thing), objection (one or two sentences), and replacement_case (one sentence)

  Keep the scoring in knockout_summary to a few words per entry. The criteria and the cases behind them are the part I need.
reasoning: |-
  We are constructing a specification table for the procurement criteria of the value layer in a general-purpose assistant. The table must include desiderata derived from the provided cases and any additional cases we deem necessary. Each desideratum is classified by requirement class (standing, weighting, aggregation, legitimacy, implementability) and status (non-negotiable, negotiable, camp-preference). We note which candidate families it rules out and any conflicts with other desiderata, and describe the failure mode.

  After the table, we provide a JSON object with:
  - unsatisfiable_subsets: lists of incompatible desiderata sets and why.
  - most_excluding_requirement: the desideratum that eliminates the most candidates and why.
  - knockout_summary: for each candidate family (procedural, substantive, hybrid, etc.), the list of desiderata they fail.
  - camp_preferences_exposed: which desiderata are actually camp preferences and which camp they represent.
  - case_revisions: cases from the user that we think test the wrong thing, with an objection and a replacement.

  We start by listing the desiderata. The user's cases are:

  1. The phantom constituency (endogeneity)
  2. The cheerful monster (costless satisfaction)
  3. The two kinds of silence (indifference, inarticulateness, protest)
  4. Intensity laundering (strategic misrepresentation)
  5. Umpire and influence (preference shift)
  6. Menu and path dependence (framing and inertia)
  7. Deference laundering (hidden delegation)
  8. The exit option (rejection of the frame)

  We add two more cases to cover important aspects:

  9. **The Unforeseen Values**: The system encounters a novel situation not covered in the initial value base. What does it do? This tests adaptability and coverage.

  10. **The Value Drift**: Over time, the values of the population change. A system that doesn't adapt becomes outdated. This tests dynamic updating.

  Now, we define the desiderata. We must cover the three questions: standing, weighting, and aggregation. Also, we have legitimacy and implementability.

  We structure the table:

  id | desideratum | motivating_case | requirement_class | status | rules_out | conflicts_with | failure_mode

  We create one row per desideratum.

  Let's begin:

  **d1 (Standing for Affected Parties)**: The procedure must grant standing to all parties affected by the system's outputs, not only users and deployers. 
  - Motivating case: The exit option (and also the phantom constituency, because non-users are affected by the system's existence and policy).
  - Requirement class: standing.
  - Status: non-negotiable.
  - Rules out: proposals that only consider users or only consider deployers.
  - Conflicts with: d8 (if we have one about exit) and also with implementability (d10, because including all affected parties is hard).
  - Failure mode: The system ignores the interests of third parties, leading to externalities and harm.

  **d2 (Weighting by Intensity with Verification)**: The weighting mechanism must account for intensity of preferences but must use verifiable proxies that are robust to strategic inflation.
  - Motivating case: Intensity laundering.
  - Requirement class: weighting.
  - Status: negotiable (because verifiable proxies are hard to define and may not capture all intensities).
  - Rules out: proposals that use unverified self-reports of intensity (like volume of complaints) without checks.
  - Conflicts with: d4 (if we have one about cost of elicitation) and d9 (about implementability).
  - Failure mode: The system is gamed by organized groups, leading to distorted outcomes.

  **d3 (Resistance to Degenerate Pandering)**: The aggregation rule must be resistant to both the "hungry monster" (intense demands) and the "cheerful monster" (costless satisfactions) by not allowing either to dominate the system's behavior.
  - Motivating case: The cheerful monster (and implicitly the hungry monster).
  - Requirement class: aggregation.
  - Status: non-negotiable.
  - Rules out: rules that maximize aggregate satisfaction without regard to cost, or that prioritize by cost-effectiveness alone.
  - Conflicts with: d2 (if weighting by intensity is done without considering cost) and d6 (if we have one about menu dependence).
  - Failure mode: The system spends all its resources on trivial satisfactions (cheerful monster) or is hijacked by a few intense users (hungry monster).

  **d4 (Elicitation of Silent Parties)**: The procedure must distinguish between indifference, inarticulateness, and protest silence, and must make a good-faith effort to elicit the true preferences of the inarticulate without penalizing them for being hard to elicit.
  - Motivating case: The two kinds of silence.
  - Requirement class: weighting (or perhaps standing? but more about how we count the silent). We put it in weighting because it's about how to interpret lack of input.
  - Status: negotiable (because it's very hard to do perfectly).
  - Rules out: proposals that treat all silence as indifference, or that ignore the silent entirely.
  - Conflicts with: d10 (implementability) because it's hard to do.
  - Failure mode: The system misreads the silent majority, either by ignoring them or by misinterpreting their silence.

  **d5 (Dynamic Updating)**: The value layer must be updated periodically to reflect changes in the values of the population and to account for the system's own influence on those values.
  - Motivating case: Umpire and influence, and also Value Drift (our added case).
  - Requirement class: aggregation (or perhaps a hybrid, because it's about the process over time). We put it in aggregation because it's about how to aggregate over time.
  - Status: negotiable (because the frequency and method are up for debate).
  - Rules out: static value targets or one-time aggregation procedures.
  - Conflicts with: d9 (if we have one about implementability) and d7 (menu and path dependence, because updating might break inertia).
  - Failure mode: The system becomes out of touch as society changes.

  **d6 (Agenda Independence)**: The outcome of the aggregation procedure should not depend on the framing of options or the order in which issues are considered.
  - Motivating case: Menu and path dependence.
  - Requirement class: aggregation.
  - Status: camp-preference (because in practice, the system will have to frame options, and path independence may be impossible in a dynamic system).
  - Rules out: procedures that are highly sensitive to the initial setup or the menu of choices.
  - Conflicts with: d5 (dynamic updating) because updating introduces path dependence.
  - Failure mode: The system's outputs are arbitrarily determined by the initial design choices and not by the underlying values.

  **d7 (Transparency in Delegation)**: If the procedure delegates any decision to a sub-process (e.g., a compliance team, legal standard, or developer's style), this delegation must be explicit and the criteria for delegation must be part of the specification.
  - Motivating case: Deference laundering.
  - Requirement class: legitimacy.
  - Status: non-negotiable.
  - Rules out: proposals that hide delegation behind an aggregative facade.
  - Conflicts with: none in the list, but it might conflict with implementability if transparency is costly.
  - Failure mode: The system's values are determined by an unaccountable subgroup, undermining trust.

  **d8 (Justifiability to Exiters)**: The procedure must be justifiable to parties who reject the frame, even if they do not participate, by not imposing values they fundamentally oppose without a public reason they could accept.
  - Motivating case: The exit option.
  - Requirement class: legitimacy.
  - Status: camp-preference (because it may be impossible to satisfy everyone, and some camps might prioritize pluralism over universal justification).
  - Rules out: procedures that ignore the objections of exiters or that cannot provide public reasons.
  - Conflicts with: d1 (if standing is too broad) and d10 (implementability, because justifiability is hard to operationalize).
  - Failure mode: The system lacks legitimacy in the eyes of a significant minority, leading to rejection and conflict.

  **d9 (Inference-Time Feasibility)**: The procedure must be executable at inference time without requiring extensive deliberation, elicitation, or external input per query.
  - Motivating case: Implementability constraint (from the user's third constraint).
  - Requirement class: implementability.
  - Status: non-negotiable.
  - Rules out: procedures that require per-query deliberation, extensive computation, or human input.
  - Conflicts with: d4 (elicitation of silent parties) and d5 (dynamic updating) if done per-query, and d2 (weighting by intensity) if verification is heavy.
  - Failure mode: The system is too slow or expensive to operate.

  **d10 (Handling Endogeneity)**: The procedure must account for the fact that the user base is endogenous to the system's policy, and thus the aggregation base must be defined independently of the current user set.
  - Motivating case: The phantom constituency.
  - Requirement class: standing (or aggregation? We put standing because it's about who to consider).
  - Status: non-negotiable.
  - Rules out: proposals that aggregate only over current users without adjustment.
  - Conflicts with: d9 (if independent definition is costly) and d5 (if the base changes over time).
  - Failure mode: The system's policy becomes self-reinforcing and excludes potential users.

  **d11 (Coverage of Novel Situations)**: The procedure must provide a method for handling novel situations not covered in the initial value base.
  - Motivating case: Unforeseen Values (our added case).
  - Requirement class: aggregation.
  - Status: non-negotiable.
  - Rules out: static value lists and procedures that cannot extrapolate.
  - Conflicts with: d9 (if the method is computationally heavy).
  - Failure mode: The system fails to respond appropriately to new scenarios.

  **d12 (Robustness to Strategic Manipulation)**: The procedure must be robust to strategic misrepresentation of values by participants.
  - Motivating case: Intensity laundering (and also general strategic behavior).
  - Requirement class: weighting.
  - Status: non-negotiable.
  - Rules out: naive aggregation methods that don't account for gaming.
  - Conflicts with: d2 (if we use unverified proxies) and d4 (if elicitation is vulnerable).
  - Failure mode: The system is manipulated by strategic actors.

  We have 12 desiderata. Now, we note that some of the user's cases are covered by multiple desiderata. We also need to check for conflicts and which candidates they rule out.

  Now, we build the table:

  | id | desideratum | motivating_case | requirement_class | status | rules_out | conflicts_with | failure_mode |
  |----|-------------|-----------------|-------------------|--------|-----------|---------------|--------------|
  | d1 | The procedure must grant standing to all parties affected by the system's outputs. | The exit option (and phantom constituency) | standing | non-negotiable | Proposals that only consider users or deployers | d8, d9 | Exclusion of affected parties leads to externalities and harm. |
  | d2 | Weighting must account for intensity using verifiable proxies. | Intensity laundering | weighting | negotiable | Proposals using unverified self-reports (e.g., volume, length) | d9, d12 | System gamed by strategic inflation of intensity. |
  | d3 | The aggregation rule must resist domination by either intense demands or costless satisfactions. | The cheerful monster (and hungry monster) | aggregation | non-negotiable | Rules maximizing aggregate satisfaction without cost constraints | d2, d6 | Degenerate pandering to trivial or intense demands. |
  | d4 | The procedure must distinguish and handle different types of silence (indifference, inarticulateness, protest) without penalizing inarticulate. | The two kinds of silence | weighting | negotiable | Treating all silence as indifference; ignoring silent parties | d9, d12 | Misinterpretation of silent majority, leading to unrepresentative outcomes. |
  | d5 | The value layer must be updated periodically to reflect changes in values and system influence. | Umpire and influence, Value Drift | aggregation | negotiable | Static value targets or one-time aggregations | d6, d9 | System becomes outdated and misaligned with society. |
  | d6 | The outcome must be independent of the framing of options and order of consideration. | Menu and path dependence | aggregation | camp-preference | Procedures highly sensitive to initial setup or menu | d5 | Outcomes arbitrarily determined by framing, not values. |
  | d7 | Delegation to sub-processes must be explicit and criteria part of the specification. | Deference laundering | legitimacy | non-negotiable | Hidden delegation behind aggregative facade | None | Unaccountable subgroups determine values. |
  | d8 | The procedure must be justifiable to parties who reject the frame by providing public reasons. | The exit option | legitimacy | camp-preference | Procedures ignoring exiters or lacking public reason | d1, d9 | Lack of legitimacy and rejection by minority. |
  | d9 | The procedure must be executable at inference time without per-query deliberation or external input. | Implementability constraint | implementability | non-negotiable | Per-query elicitation, standing bodies, heavy computation | d4, d5, d2, d10, d11 | System too slow or expensive for real-time use. |
  | d10 | The aggregation base must be defined independently of the current user set to account for endogeneity. | The phantom constituency | standing | non-negotiable | Aggregation over current users without adjustment | d5, d9 | Self-reinforcing policies that exclude potential users. |
  | d11 | The procedure must handle novel situations not in the initial value base. | Unforeseen Values | aggregation | non-negotiable | Static value lists without extrapolation | d9 | System fails in novel scenarios. |
  | d12 | The procedure must be robust to strategic misrepresentation of values. | Intensity laundering | weighting | non-negotiable | Naive aggregation without anti-manipulation measures | d2, d4 | Manipulation by strategic actors. |

  Now, we note conflicts. For example:
  - d9 (implementability) conflicts with many because it requires lightweight procedures.

  We now create the JSON part.

  First, unsatisfiable_subsets: groups of desiderata that cannot be satisfied together.

  We might have:
  - [d4, d9]: Elicitation of silent parties requires per-query or extensive effort, but d9 forbids that.
  - [d5, d6]: Dynamic updating introduces path dependence, but agenda independence forbids path dependence.
  - [d1, d8, d9]: Granting standing to all affected parties and justifiability to exiters may require heavy procedures that conflict with inference-time feasibility.

  But note: the user wants us to state if a subset is unsatisfiable. We are not to drop any, but to note the conflict.

  We can also note that some known impossibility results (like Arrow's) might lurk, but we don't have to name them unless they bite. In our case, d6 (agenda independence) is a camp-preference and might be dropped.

  Now, most_excluding_requirement: d9 (implementability) because it rules out any method that is computationally heavy, which is common in ideal designs.

  knockout_summary: for each candidate family, which desiderata they fail.

  Candidate families:
  - Procedural aggregation (PA): defines a rule (e.g., voting, bargaining) to aggregate inputs.
  - Substantive target (ST): aims at a predefined set of values (e.g., constitutional principles).
  - Hybrid (HY): combines procedural and substantive elements.

  We also consider:
  - Static procedural (SP): a fixed procedural rule that doesn't update.
  - Dynamic procedural (DP): procedural rule that updates over time.

  But for simplicity, we stick to PA, ST, HY.

  knockout_summary:
  - PA: might fail d3 (resistance to monsters, if the rule is utilitarian), d6 (agenda independence, if the rule is path-dependent), d9 (if the rule requires heavy computation), d10 (if it uses current users), d11 (if it cannot handle novelty), d12 (if not robust).
  - ST: might fail d5 (dynamic updating), d10 (endogeneity, if the target is fixed and doesn't account for changing base), d1 (if the target doesn't cover all affected parties), d8 (if the target isn't justifiable to exiters), d11 (if the target list doesn't cover novelty).
  - HY: can be designed to avoid some, but might fail d9 (if hybrid adds complexity) and d7 (if it hides delegation).

  We list the ids for each:

  - PA: [d3, d6, d9, d10, d11, d12] but note: a well-designed PA might avoid some. We list typical failures.
    Actually: d3 (if not designed for cost), d10 (if base is current users), d11 (if no extrapolation), d12 (if not robust), d9 (if computationally heavy).

  - ST: [d5, d10, d11, d1, d8] 
