  ### Specification Table for Value Layer Procurement Criteria

  | id | desideratum | motivating_case | requirement_class | status | rules_out | conflicts_with | failure_mode |
  |----|-------------|-----------------|-------------------|--------|-----------|---------------|--------------|
  | d1 | The aggregation base must include all parties affected by the system's outputs, regardless of participation status. | The exit option | standing | non-negotiable | User-only or deployer-only bases | d9 | Exclusion of third parties leads to unaddressed externalities and systemic bias. |
  | d2 | Weighting must reflect intensity without relying on self-reported or easily gamable proxies. | Intensity laundering | weighting | non-negotiable | Volume-based weighting, unverified self-reports | d9 | Strategic actors inflate influence via spam, drowning out genuine preferences. |
  | d3 | Aggregation must resist domination by extremes: both high-cost intense demands and trivial costless satisfactions. | The cheerful monster | aggregation | non-negotiable | Cost-blind utilitarianism, effort-minimizing rules | None | Degenerate pandering to trivial or extreme demands, degrading utility. |
  | d4 | Silence must be categorized as indifference, inarticulacy, or protest; only indifference reduces weight. | The two kinds of silence | weighting | negotiable | Uniform silence handling, discounting hard-to-elicit views | d9, d12 | Misrepresentation of unspoken preferences, amplifying articulate minorities. |
  | d5 | The procedure must account for how system outputs alter future preferences of users and society. | Umpire and influence | aggregation | negotiable | Static value targets, one-time aggregation | d6 | Value drift locks in outdated preferences, causing misalignment over time. |
  | d6 | Outcomes must be invariant to the framing of options and sequence of decisions (agenda independence). | Menu and path dependence | aggregation | camp-preference | Path-dependent rules, inertia-based weighting | d5 | Arbitrary outcomes dictated by UI design or legacy choices, not values. |
  | d7 | Delegation to external entities (e.g., legal teams) must be explicit, auditable, and bounded. | Deference laundering | legitimacy | non-negotiable | Opaque delegation, "neutral" aggregation masking defaults | None | Hidden authority shifts values to unaccountable parties, violating neutrality claims. |
  | d8 | The procedure must not require participation from objectors, but outputs must be justifiable to them. | The exit option | legitimacy | camp-preference | Opt-in-only models, coercion of dissenters | d1 | Exiters are marginalized or forced to comply, escalating conflict. |
  | d9 | All components must be executable at inference time with minimal latency and no per-query external input. | Implementability constraint | implementability | non-negotiable | Deliberative bodies, per-query elicitation, manual review | d4, d5 | System is unusably slow or requires infeasible human intervention. |
  | d10 | The aggregation base must be defined counterfactually (e.g., potential users) to avoid self-selection bias. | The phantom constituency | standing | non-negotiable | Revealed-preference bases, dynamic user-set reliance | d9 | Policy entrenches biases by excluding those deterred by current outputs. |
  | d11 | Novel inputs not covered by training must trigger fallback reasoning, not default to a single party's values. | The unforeseen values¹ | aggregation | non-negotiable | Fixed-value defaults, developer veto powers | d9 | System mishandles edge cases (e.g., emerging tech ethics) via ungrounded biases. |
  | d12 | Preference inputs must be validated against strategic inflation (e.g., via cross-referencing or consistency checks). | Intensity laundering | weighting | non-negotiable | Unfiltered user feedback, unmoderated crowdsourcing | d2, d9 | Bad-faith actors distort outcomes by gaming inputs (e.g., review bombing). |
  | d13 | Updates must balance consistency (for user trust) and adaptability (for value drift). | The inertia dilemma² | aggregation | negotiable | Inflexible rules, frequent unanchored updates | d5, d6 | Erratic behavior erodes trust or stagnant values cause irrelevance. |

  ¹ **Unforeseen values (added case)**: The system encounters a novel ethical dilemma (e.g., AI rights). Tests coverage beyond pre-defined scenarios.  
  ² **The inertia dilemma (added case)**: Users rely on consistent behavior, but societal values shift (e.g., privacy norms). Tests trade-offs between stability and evolution.

