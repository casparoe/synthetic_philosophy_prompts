answer: |-
  ## Joint Statement: Predictive Processing - Core Agreements, Clarified Disagreements, and Testable Cruxes

  **Preamble:** We, occupying positions broadly sympathetic to the "Unifier" and "Redescriptionist" perspectives on Predictive Processing (PP) and the Free Energy Principle (FEP), have engaged in prolonged debate. This document aims to move beyond polemics by clearly stating points of agreement, precisely defining disagreements with testable cruxes, and identifying potential verbal confounds. Our goal is to foster productive empirical and theoretical progress.

  ### 1. Agreed Claims

  Both signatories endorse the following propositions:

  1.  **The "Layer Cake" of Abstraction:**
      *   The Free Energy Principle (FEP), formulated as surprise minimization for systems maintaining non-equilibrium steady states, operates at a highly abstract, almost tautological, level applicable to any persistent, bounded system. Success at this level is necessary but insufficient evidence for claims at lower levels.
      *   Predictive Coding (PC) refers to specific proposed circuit-level implementations (e.g., cortical microcircuits with distinct prediction and error units, message passing).
      *   Predictive Processing (PP) is an architectural or computational-level claim proposing that hierarchical generative models minimizing prediction error constitute the core organizing principle for perception, action, and cognition in the brain.
      *   Active Inference (AI) is a control scheme within the PP framework, framing action as minimizing prediction error by changing sensory input to match predictions derived from the generative model.
      *   **Crucially:** Evidence supporting the FEP does not automatically validate PP as the brain's architecture or PC as its implementation. Similarly, failure to find evidence for a specific PC implementation or PP process does not invalidate the FEP. Confusing these levels (e.g., citing FEP tautology as proof of cortical PC, or refuting FEP based on a failed PC experiment) has been a significant source of misunderstanding.

  2.  **The Triviality Point:**
      *   The FEP's core requirement (minimizing surprise/long-term free energy) is satisfiable by an enormous diversity of mechanisms and architectures (e.g., simple homeostats, reflexes, standard RL agents, classical AI planning systems). Demonstrating that a system minimizes surprise is trivial for any persistent system; it does not provide specific evidence for the PP architectural claim or PC implementation hypothesis.

  3.  **The Dark Room Point:**
      *   Minimizing surprise alone, without specifying the *content* of the generative model and its implicit or explicit *prior preferences* (i.e., preferred sensory states), does not define an interesting or adaptive agent. An agent minimizing surprise could indeed end up catatonic in a dark room.
      *   The interesting content and behavior of biological agents *must* come from the specific structure of their generative model and the priors/preferences encoded within it. This is where the explanatory work shifts *from* the general FEP/PP principle *to* the specific details of the model and its priors. Whether this shift represents a *virtue* (a flexible framework for model specification) or a *limitation* (the principle itself stops directly constraining the model content) is a point of ongoing *disagreement* (see Section 2).

  4.  **The Baseline Requirement:**
      *   The empirical and theoretical value of the PP framework must be assessed by comparing its predictions and explanatory power to those of *comparably resourced alternatives* (e.g., task-specific mechanistic models, alternative architectural frameworks like RL, Bayesian decision theory without the PP architecture, connectionist models). Demonstrating that PP *can* explain or model a phenomenon is insufficient; it must be shown to offer advantages (e.g., parsimony, unification, novel predictions, better fit to data, greater generalizability) over these alternatives when controlling for model complexity and prior knowledge.

  ### 2. Disagreements Table

  | Issue                                                                 | Unifier Wording                                                                                                                               | Redescriptionist Wording                                                                                                                                                     | Genuine or Verbal? | Crux(es) It Hangs On                     |
  | :-------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- | :--------------------------------------- |
  | **Core Computational Principle:** What is the fundamental computation the brain performs? | Minimizing precision-weighted prediction error via hierarchical generative models *is* the fundamental computational principle underlying perception, cognition, and action, providing a unified currency. | Minimizing prediction error is *one* important mechanism the brain uses, but not the singular core principle. Perception, cognition, and action arise from diverse computations; PP is often a useful *redescription* rather than a unique engine. | **Genuine**        | Crux 1 (Omission Test), Crux 2 (Transfer) |
  | **Architectural Constraint:** How much does PP uniquely constrain neural implementation? | The PP architecture (hierarchy, generative models, prediction errors, precision weighting) provides strong, non-trivial constraints on plausible neural implementations and makes distinctive predictions about neural dynamics. | The PP framework, especially post-hoc, is highly flexible. "Generative models" and "precision" can often be fit to explain almost any data without providing strong, unique constraints on implementation beyond simpler models. | **Genuine**        | Crux 1 (Laminar Profile), Crux 2 (Transfer) |
  | **Generative Model Origin & Constraint:** Where does the model's structure come from, and how constrained is it? | The *need* to minimize prediction error under the FEP, combined with the structure of the environment and embodiment, actively shapes and constrains the learning and structure of the generative model over development and evolution. | The generative model's structure and priors are primarily determined by evolutionary history, developmental constraints, and task demands, largely *independent* of the FEP/PP formulation. The PP framing adds little constraint on model structure beyond what's required to explain the data. | **Likely Genuine** | Crux 2 (Transfer)                        |
  | **"Inference" Scope:** What qualifies as "inference"?                 | Inference fundamentally *is* Bayesian updating of beliefs (posteriors) over hidden causes within a generative model, driven by prediction error minimization. This applies to perception *and* action planning. | "Inference" in the broadest FEP sense (state changes reducing surprise) is too vague. Meaningful inference requires representational content and model-based updating; many PP accounts blur perception/action planning with lower-level mechanisms better described otherwise. | **Primarily Verbal** | Definition of "inference"                |
  | **"Prediction" Specificity:** What constitutes a "prediction"?        | Predictions are specific, probabilistic estimates of hidden causes or sensory consequences generated top-down from the generative model, against which bottom-up input is compared as error. | "Prediction" is often used loosely, encompassing simple entrainment, anticipation, or expectation without a specific generative model or comparison operation. PP and entrainment accounts may describe overlapping phenomena non-competitively. | **Primarily Verbal** | Definition of "prediction"               |
  | **Dark Room Virtue/Limitation:** Does the reliance on the generative model strengthen or weaken PP? | The necessity of the generative model is a *strength*: it provides a formal framework for integrating perception, action, and prior knowledge/values. The FEP/PP explains *why* such a model exists and *how* it is used. | The reliance on a hand-specified generative model after the fact is a *weakness*. It shifts the explanatory burden away from the core principle (minimizing surprise) onto model details not themselves derived from or uniquely constrained by the principle. | **Genuine**        | Philosophical stance on explanation      |

  ### 3. Cruxes & Predictions

  **Crux 1: The Omission Test (Design as Specified)**
  *   **Readout 1: Existence of Omission Response**
      *   *Unifier Pre-Pilot Prediction:* Strong prediction for a clear evoked response (e.g., MMN-like) precisely at the expected time of the omitted tone in predictable contexts. This is a hallmark prediction error signal.
      *   *Redescriptionist Pre-Pilot Prediction:* An omitted event *might* produce a response due to violated expectation or change detection, but it could also be explained by release from adaptation, novelty, or attentional capture. Not uniquely predicted by PP. Predicts weaker or less consistent response.
      *   *Pilot Result (Clear response):*
          *   Unifier: Strongly supports core PP mechanism. The response *is* the prediction error signal.
          *   Redescriptionist: Consistent with expectation violation, but doesn't discriminate PP from simpler change-detection or adaptation-release accounts. Notes possible confounds: arousal from violation, attention drawn by omission.
      *   *Evidence Against:*
          *   Unifier: Complete absence of a time-locked response at omission point would be highly problematic, requiring major revision of core tenets.
          *   Redescriptionist: Finding the response wouldn't strongly favor PP. Absence might be explained by weak expectation or measurement issues.
  *   **Readout 2: Amplitude Scaling (Volatility vs. Reward)**
      *   *Unifier Pre-Pilot Prediction:* Amplitude scales strongly with the estimated *volatility* (precision of predictions) – higher volatility leads to larger prediction errors for violations. Predicts **no significant scaling with reward value** independent of volatility. Precision weighting modulates error impact.
      *   *Redescriptionist Pre-Pilot Prediction:* Amplitude could scale with *salience*, which includes factors like volatility (unexpectedness) *and* reward value (motivational relevance). Predicts **amplitude scales with reward value**, especially if the omission signifies a missed reward opportunity. Volatility might also play a role.
      *   *Pilot Result (Amplitude tracks volatility, no reward relation):*
          *   Unifier: Strong support for precision-weighting of prediction errors as central. Reward value, if not altering the generative model's predictions or their precision directly, doesn't modulate the *prediction error* signal itself.
          *   Redescriptionist: Concedes this favors the PP interpretation of the signal *as prediction error* modulated by precision/uncertainty. However, questions whether reward manipulation was strong enough or if it truly didn't influence attention/arousal (potential confound). Suggests a stronger reward link might emerge in different paradigms (e.g., reward omission after action).
      *   *Evidence Against:*
          *   Unifier: Strong scaling with reward value *independent* of volatility estimates would challenge the claim that the signal reflects precision-weighted prediction error and suggest a stronger role for value/utility signals distinct from prediction error.
          *   Redescriptionist: Finding *only* volatility scaling and *no* reward scaling, despite a strong manipulation, would move them towards accepting PP's description of this specific signal in this context.
  *   **Readout 3: Laminar Profile & Feedback Dependence**
      *   *Unifier Pre-Pilot Prediction:* The omission response will show a specific laminar profile characteristic of prediction-error signaling in cortical hierarchies (e.g., superficial layer dominance). Crucially, **suppressing top-down feedback should significantly attenuate or abolish the omission response**, as the top-down prediction generating the error is blocked.
      *   *Redescriptionist Pre-Pilot Prediction:* The laminar profile could be consistent with various signals (change detection, adaptation release). **Suppressing top-down feedback might reduce the response** by altering overall excitability or attention, but this wouldn't uniquely prove it's a prediction *error* signal. Predicts the response might persist, indicating a more local or bottom-up mechanism.
      *   *Predictions Only (Pilot assumed human EEG, no laminar/block):* (Marked as unsure - awaiting macaque/laminar results with manipulation).
      *   *Evidence Against:*
          *   Unifier: A laminar profile inconsistent with prediction-error signaling (e.g., deep layer dominance) or, crucially, *no attenuation* of the omission response when top-down feedback is suppressed would be highly damaging, challenging a core circuit-level prediction of PC.
          *   Redescriptionist: Finding the precise predicted laminar signature *and* strong attenuation upon feedback block would be strong evidence for the PC implementation claim for this signal.

  **Crux 2: The Overfitting/Transfer Test**
  *   **Design:** A PP model (including its hierarchical structure, learnable parameters for generative model dynamics, and precision estimation mechanisms) is rigorously fitted to behavioral and neural data from Task A. *Without modifying any parameters*, its predictions for behavior and neural activity are tested on held-out data from a novel Task B, designed to share abstract computational demands but differ in specific stimuli/actions. Performance (e.g., log-likelihood, prediction error) is compared to a task-specific model (e.g., RL, DDM, bespoke neural model) designed for Task B with comparable complexity and prior knowledge baked in.
  *   *Unifier Prediction:* The PP model will show **superior transfer performance**. Its core architecture (generative modeling, prediction error minimization, hierarchical processing) captures fundamental computational principles reused across tasks. Learning on Task A shapes the generative model in a way that generalizes effectively to Task B's structure.
  *   *Redescriptionist Prediction:* The task-specific model will show **superior or at least comparable performance**. The PP model's flexibility often leads to overfitting to the specifics of Task A. The "general principles" don't provide enough constraint; successful performance on Task B will likely require significant task-specific adjustments or rely on aspects of the model not uniquely PP. Transfer gains will be modest or nonexistent compared to simpler, task-focused alternatives.
  *   *What Would Move Them:*
      *   Unifier: Consistently poor transfer performance across diverse Task A/B pairs, especially when the tasks share computational structure PP claims to capture (e.g., hierarchical inference, volatility estimation), would challenge the universality claim. If task-specific models consistently win, the value of PP as a *general* architecture is weakened.
      *   Redescriptionist: Consistently strong transfer performance, significantly outperforming well-designed task-specific baselines across multiple Task A/B pairs with varying computational similarities, would provide strong evidence for PP capturing a genuinely reusable computational core. They would need to see the PP model winning *on its own merits*, not just matching performance.

  ### 4. Analysis of Verbal Disputes

  1.  **"Inference" (Primarily Verbal):** Much disagreement stems from differing definitions.
      *   The Unifier uses "inference" in a specific, technical Bayesian sense: updating beliefs based on evidence within a model. This is core to PP.
      *   The Redescriptionist often uses "inference" more narrowly, implying deliberate, model-based reasoning. They see the Unifier's application to low-level processes (e.g., early sensory processing, simple motor control) as stretching the term beyond useful meaning, conflating it with any adaptive state change. **Resolution:** Requires explicit agreement on the scope of "inference" within the debate (e.g., restricting it to mean Bayesian belief updating over hidden states/causes).

  2.  **"Prediction" (Primarily Verbal):** Similar ambiguity exists.
      *   The Unifier means a top-down, model-derived probabilistic estimate against which input is compared.
      *   The Redescriptionist notes that "prediction" is often used more loosely for any anticipatory state (e.g., entrained oscillations, simple associative expectancy), which may not involve a generative model or explicit comparison. PP and entrainment accounts might describe the *same phenomenon* (e.g., omission response) using different, potentially compatible, languages. **Resolution:** Requires distinguishing between "model-based predictions" (PP-specific) and "anticipatory states" (more general).

  3.  **Dark Room Virtue/Limitation (Genuine but Conceptual):** This disagreement hinges on philosophical views of explanation. Does the value of a framework lie in its high-level unifying principle (Unifier), or in its ability to generate unique, falsifiable predictions at the mechanistic level without excessive post-hoc fitting (Redescriptionist)? This is unlikely to be fully resolved empirically but clarifies differing priorities.

  **Will Anything Move the Debate?** Yes, but cautiously. Empirical results from tests like **Crux 1 (Laminar/Feedback Block)** and especially **Crux 2 (Transfer)** have the potential to significantly shift the weight of evidence. A decisive outcome in Crux 1 supporting the Unifier's PC predictions, or compelling evidence of superior model transfer (Crux 2), would force Redescriptionists to concede substantial ground. Conversely, negative results in these domains would significantly undermine the Unifier's stronger claims about implementation and architectural necessity. However, some disagreements (like the precise scope of "inference" or the ultimate value judgment on the Dark Room point) are more conceptual and may persist based on differing explanatory preferences, even in the face of empirical data. The goal is to isolate the empirically tractable core disagreements and test them rigorously.
