answer: |-
  ### Scene 1 (187 words)
  The Annex breathed its last mechanical sighs. Caretaker Aris traced the vat’s glass, watching K-7’s grey-green swirl pulse under the UV lamps. Nine hundred generations logged. They’d adapted to the creeping cold, thickening their membranes. But the metering pump beside him clicked reliably, injecting the vital cofactor – "Synth-B7" – into the broth. Without it, the log noted, K-7 lysed within hours. Outside, the cold coastal wind rattled the shutters. Aris’s hand hovered near the pump’s manual override. Decommissioning Inspector Cho arrived, stamping frost from her boots, clipboard in hand. She nodded at the vat. "Still ticking over?" Aris just grunted, pulling the heavy logbook from its shelf. Cho surveyed the silent control panels, the dust gathering on empty nutrient hoppers. Aris flipped to the last adaptation entry: *Gen 897: Increased catalase yield observed, tolerance to 4°C confirmed*. He tapped the entry. "They learned," he said. Cho scribbled on her checklist, unsmiling.
  [Assumes metabolism, growth, and adaptation are indicators of life – a near-universal starting point in definitions.]

  ### Scene 2 (192 words)
  Cho placed her checklist on the stained workbench, pointing to a boxed section titled "Final Viable Organism Clearance." Below it, printed plainly: *Life: A self-sustaining chemical system capable of Darwinian evolution.* "Sign-off requires confirmation the contained system meets or fails this definitively," she stated. Aris scanned the definition, then the vat, then the humming metering pump. "Self-sustaining," he muttered. He opened the log to a dog-eared page detailing the Synth-B7 dependency protocol. "It evolves. That part’s clear. Nine hundred gens adapting to the cooling." He jabbed the log. "But self-sustaining? Without that drip..." He gestured at the pump. "Six hours. Gone." Cho followed his gaze. "The definition specifies *system*," she noted neutrally. "Is the system just the broth, or includes the machine feeding it?" Aris stared at the interconnected tubes and sensors. The pump clicked again, a tiny surge of clear fluid vanishing into the murk. "The machine isn't alive," he said flatly. "It’s just… plumbing."
  [Highlights the contested interpretation of "self-sustaining" within the standard NASA definition – is it independence or merely persistence?]

  ### Scene 3 (201 words)
  Aris needed air. He led Cho outside. The wind bit. On the shingle beach, grey waves crashed. Cho spotted the site’s burn barrel near the loading dock, a relic of paper purges. Embers glowed faintly beneath a crust of ash; someone had tossed driftwood on it earlier. She nudged it with her boot. A few sparks flickered up, then died. Aris watched, shivering. He picked up a damp piece of driftwood, hesitated, then tossed it onto the faint glow. It hissed, steamed, then slowly began to blacken and smoulder. Tiny flames licked tentatively upwards, fed by the new fuel. It wasn't roaring; it was clinging, dependent on the offering. Aris stared at the struggling fire, then back at the Annex building, its outline stark against the twilight. He didn’t mention K-7. He just watched the fire consume the wood, its light weak but persistent against the encroaching dark. Cho stamped her feet against the cold, observing the fire’s flicker reflecting in the darkening windows of the silent facility.
  [Uses the fire as an action/image paralleling dependence without argument; assumes environmental interactions are part of a system's function – contested as "Environmental Integration" view.]

  ### Scene 4 (204 words)
  Back inside, Cho pressed. "Decision, Aris. Checklist requires it. Maintain, terminate, or transfer?" Transfer was impossible; no other facility used Synth-B7. Aris called Dr. Eliassen, the retired director, on the speakerphone. Static crackled over the line. "K-7? Fine lineage, Aris," Eliassen's voice rasped. "Did good work. But the project’s dead. Funding corpse. Pull the plug." Aris protested: "They *adapted*, Doctor. Real evolution. Log proves it." Eliassen sighed. "Evolution, yes. But alive *alone*? They’re more like… specialized organelles. The Annex was their mitochondrion, pumping in the good stuff. You shut down the power plant, the cell dies. We built the whole damn cell." Aris looked around – the vat, the pipes, the dormant reactors that once powered the pumps, the thick walls holding back the cold. "So the Annex… is alive?" Cho raised an eyebrow. Eliassen coughed. "Metaphor, Aris. Just drain the vat. Report it as non-viable. Satisfies the checklist." The line went dead. Cho tapped her pen on "Non-Viable Organism."
  [Introduces the contested "Extended Physiology" thesis (life includes essential external processes/machinery) through dialogue, not endorsement.]

  ### Scene 5 (223 words)
  Aris stood before the vat, the logbook heavy in his hands. Cho waited, checklist poised. The pump clicked. Nine hundred generations. Synth-B7. The dying fire outside. Eliassen’s "organelles." The checklist’s "self-sustaining." He looked past the vat to the main breaker panel for the Annex, then to a small, sterile sampling kit. He didn’t speak. He walked to the metering pump and slowly turned the manual valve. The rhythmic clicking stopped. The drip ceased. A final sigh seemed to escape the machinery. Then, he opened the sampling kit. With meticulous care, gloved hands trembling slightly, he drew several vials of the swirling K-7 culture, sealing them tightly. He placed them into the cryo-shipper unit beside the kit, its cooling unit humming to life. He handed Cho the logbook. "Terminate the vat contents. Certify the site clear." He pointed to the cryo-shipper. "That goes with me. Personal salvage. Confirmed sterile protocol." Cho looked from the now-silent vat, where K-7’s clock was ticking down, to the vials in the shipper – potential suspended, dependent on future intervention. She checked "Non-Viable Organism Present" and "Site Cleared." Aris stared at his vials, the cost of either definition – termination or endless, fragile dependency – settling on his shoulders.
  [Shows a decision costly under essentialist ("life" terminated) and operational ("life" preserved only through artificial continuity) views, leaving the core question unresolved. Contested: Operational vs. Essentialist definitions of life.]
