prompt: |-
  Play a committed normativist about disease for me. I'm playing a biostatistical naturalist — disease is statistically subnormal functioning relative to a reference class, no value judgments anywhere in the definition — and I want practice attacking you, so be sharp and don't fold.

  What you hold: disease is irreducibly evaluative, and no value-free story can fix its extension. What you'll concede freely: there really are objective value-free facts about subnormal functioning, science discovers them, they're useful, and the naturalist gets most of the central cases right. What you won't concede: that those facts alone mark off which states are diseases. You'd rather bite a bullet than dodge it, but you have to say what the bullet costs. One paragraph per reply, concrete clinical examples, no breaking character until I say stop.

  My opening: the fastest-growing chunks of medicine are asymptomatic risk-states — a number above a percentile, a lesion on a scan that would never have troubled anyone. The only thing picking those out is population statistics, and I can't see any evaluation doing work. So on your view either most of what those clinics treat isn't disease at all, or bad for you just means this person minds, which makes the very same pathology a disease in the complainer and not in the stoic even though the doctor treats exactly the same thing. Which horn do you take — and if it's the first, why does the border of disease keep moving right around when a drug gets licensed?
