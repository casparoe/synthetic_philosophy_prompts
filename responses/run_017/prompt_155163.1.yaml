prompt: |-
  I'm a journalist preparing a piece on whether what we know can depend on what we have at stake, and before I quote or paraphrase a source I want to know how much of it I can trust. The characterization below comes from a forthcoming popular book on epistemology — I've only seen a galley, without the notes — and it is written with real confidence:

  "Until the 1990s, epistemologists agreed that knowledge was simply true belief supported by good enough evidence: a single fixed threshold, the same for everyone in every situation. Then the philosophers who introduced the much-discussed 'bank cases' pointed out that whether you know the bank will be open on Saturday seems to change depending on whether a missed mortgage payment would ruin you, and they concluded that knowledge is context-sensitive: whether a sentence of the form 'S knows that p' comes out true depends on the practical stakes of whoever is assessing S. This position — pragmatic encroachment, of which epistemic contextualism is the leading version — says that what you know shifts with what you have riding on being right, so that knowledge is not, at bottom, a matter of truth and evidence at all, but of whether it is worthwhile to act as if p. Critics objected that the view makes knowledge depend on stakes the subject can hardly be said to have evidence about, and even sympathetic epistemologists now concede that the bank cases show nothing more than that the English word 'know' gets used loosely under pressure, so the research program has largely been abandoned."

  My own instinct is that knowledge shouldn't fluctuate with my mortgage balance, but the book's tone makes me wonder whether I'm just defending common sense against a view I haven't really understood. So I'd like a sentence-by-sentence audit: which claims a defender of pragmatic encroachment or contextualism would accept as stated, which are fair simplifications, which conflate two positions the literature keeps apart or quietly invert how the stakes are supposed to work, and which are live objections presented as settled refutations. I especially want to know whether the book's closing move follows from anything defensible in the passage — its claim that the view vindicates tiered verification in newsrooms, so that a reporter staking her career on a story needs more evidence in order to know it than a colleague filing a routine brief, and escalating checks are requirements of knowledge rather than just risk management.

  Finally, give me two or three sentences I could safely print for a general reader: what the dispute is actually about, and what its status is now.
reasoning: |-
  Okay, let me approach this systematically. The journalist needs a precise audit of an epistemology book excerpt, specifically about pragmatic encroachment and contextualism, to assess its claims before quoting. The core question revolves around whether knowledge depends on practical stakes.

  First, I'll break down the passage sentence by sentence. The key claims to evaluate are: (1) the historical account of pre-1990s epistemology, (2) the bank cases' interpretation, (3) the conflation of pragmatic encroachment and contextualism, (4) the critics' objections presented as conclusive, and (5) the newsroom application.

  For the historical claim about pre-1990s consensus, I recall that even traditional JTB accounts acknowledged varying evidence standards across contexts. The bank cases by DeRose and Stanley did introduce stakes-sensitivity, but they represent distinct positions - pragmatic encroachment (standards shift with subject's stakes) versus contextualism (shifts with attributor's context). The passage blurs this distinction.

  The critics' objections section oversimplifies - while there are valid concerns about stakes/evidence misalignment, the field hasn't abandoned these ideas. Current work refines them, like Fantl & McGrath's prudential justification. The newsroom analogy actually reverses standard stakes-sensitivity: higher stakes typically require stronger evidence to "know," not less as implied.

  For the journalist's closing request, I'll formulate balanced summary sentences capturing: the ongoing debate about whether practical concerns affect knowledge standards, the distinction between stakes affecting justification versus mere language use, and current scholarly coexistence of refined theories rather than abandonment.
answer: |-
  Here's a sentence-by-sentence audit of the passage, followed by a balanced summary for your readers:

  ### Audit of the Passage

  1.  **"Until the 1990s, epistemologists agreed that knowledge was simply true belief supported by good enough evidence: a single fixed threshold, the same for everyone in every situation."**
      *   **Fair Simplification, but Overstated:** While traditional Justified True Belief (JTB) analysis aimed for objective, truth-linked conditions, few serious epistemologists ever thought the threshold for "good enough evidence" was *absolutely fixed* and *identical* across *all* contexts. Contextual factors influencing justification (like the importance of avoiding error) were discussed before the 1990s (e.g., by Wittgenstein, Austin). The passage paints a slightly caricatured picture of the "old" view.

  2.  **"Then the philosophers who introduced the much-discussed 'bank cases' pointed out that whether you know the bank will be open on Saturday seems to change depending on whether a missed mortgage payment would ruin you..."**
      *   **Largely Accurate (Description of Phenomenon):** Defenders of stakes-sensitive views (like Keith DeRose - contextualism; Jeremy Fantl & Matthew McGrath, Jason Stanley - pragmatic encroachment) would agree this *seems* true and motivates their positions. They aim to explain this intuitive shift.

  3.  **"...and they concluded that knowledge is context-sensitive: whether a sentence of the form 'S knows that p' comes out true depends on the practical stakes of whoever is assessing S."**
      *   **Conflates Two Positions & Inverts Stakes:** This is a **critical misstep**.
          *   **Conflation:** It lumps "pragmatic encroachment" (PE) and "epistemic contextualism" (EC) together incorrectly.
          *   **Inversion:** It attributes the stakes to the *assessor* ("whoever is assessing S"). This describes **Epistemic Contextualism (EC - e.g., DeRose, Lewis)** accurately: *The truth of "S knows that p" depends on the conversational context/stakes of the person *attributing* knowledge (the assessor).*
          *   **Pragmatic Encroachment (PE - e.g., Stanley, Fantl & McGrath)**, however, argues the stakes directly affect *the subject S's own epistemic position*. For PE, whether *S knows p* depends on *S's own practical stakes* in being right about *p*. The assessor's stakes are irrelevant. The passage wrongly assigns the stakes to the assessor for *both* views.

  4.  **"This position — pragmatic encroachment, of which epistemic contextualism is the leading version — says that what you know shifts with what you have riding on being right..."**
      *   **Conflates Positions & Misleading Labeling:** This is **deeply problematic**.
          *   **Conflation:** It explicitly presents EC as a *version* of PE. This is false. While both respond to the bank cases, they offer distinct *mechanisms* (context of attribution vs. stakes affecting the subject's justification/warrant) and are often presented as competitors.
          *   **Misleading:** "What *you* know shifts..." implies the *subject's* knowledge shifts with *their* stakes. This accurately describes **PE**, but the previous sentence defined the position based on the *assessor's* stakes, which describes **EC**. The passage is internally inconsistent here.

  5.  **"...so that knowledge is not, at bottom, a matter of truth and evidence at all, but of whether it is worthwhile to act as if p."**
      *   **Extreme Overstatement / Misrepresentation (Rejected by Defenders):** Both EC and PE defenders **vigorously reject this**. Their core claim is that practical stakes *modulate the required level* of evidence/justification for a true belief to *count as* knowledge. They insist knowledge *still fundamentally requires* truth and evidence/justification, but the *threshold* for sufficient justification is sensitive to practical factors. They do *not* reduce knowledge *solely* to the worthwhileness of acting. They are trying to *preserve* the link between knowledge and rational action, not sever it from truth/evidence.

  6.  **"Critics objected that the view makes knowledge depend on stakes the subject can hardly be said to have evidence about..."**
      *   **Fair Simplification of a Live Objection:** This is a standard and serious objection (e.g., from "purists" like Earl Conee, Richard Feldman, Mikkel Gerken). Defenders of stakes-sensitivity *do* need to address how subjects can rationally adjust their epistemic standards based on stakes they might not be fully aware of or have evidence about. It's an active point of debate, not a settled refutation.

  7.  **"...and even sympathetic epistemologists now concede that the bank cases show nothing more than that the English word 'know' gets used loosely under pressure..."**
      *   **Overstatement / Misrepresentation of Current Consensus:** While some critics (e.g., Patrick Rysiew, Jessica Brown) argue the bank cases merely show pragmatic features of language use (the "warranted assertability maneuver" - WAM), this is **not** a concession made by *defenders* (sympathetic epistemologists) of EC or PE. Leading defenders like Fantl, McGrath, Stanley, and DeRose *still* defend their core positions against the WAM. While the initial hype has cooled, the research program is **not** abandoned; it's matured, faced critiques, and evolved. Many find refined versions plausible and actively work on them.

  8.  **"...so the research program has largely been abandoned."**
      *   **False:** This is simply incorrect. While the initial flurry of bank-case papers peaked years ago, the core ideas of EC and PE remain highly influential, actively debated, refined, and applied in areas like ethics, legal epistemology, and feminist epistemology. Major figures continue to publish significant work defending, modifying, or engaging critically with these frameworks. "Largely abandoned" is a serious mischaracterization of the field.

  ### Analysis of the Newsroom Claim
  *   The book's claim about tiered verification being a "requirement of knowledge" under stakes-sensitive views **does logically follow** from **Pragmatic Encroachment (PE)**, but **not** cleanly from Contextualism (EC).
      *   **PE:** If a reporter's career is staked on a story (*high stakes for the subject*), PE argues she needs *stronger evidence/justification* to *know* it than a colleague filing a routine brief (*low stakes for the subject*). Escalating checks would be directly related to achieving knowledge under higher stakes.
      *   **EC:** The *truth* of the claim "Reporter A knows the story" might vary depending on *who is attributing* the knowledge and *their* context/stakes (e.g., an editor under deadline pressure might require stronger evidence to truthfully *say* "A knows" than a colleague in a casual chat). The focus is on the attributor's context, not necessarily mandating escalating checks *for the reporter herself* to *have* knowledge (though it might explain *when others will correctly say* she knows).

  ### Balanced Summary Sentences for Your Readers

  > **"Some philosophers argue that how much evidence you need to genuinely *know* something can depend on what's practically at stake if you're wrong – needing stronger proof when the risks of being mistaken are high (like betting your career) compared to lower-stakes situations. This view, debated under labels like 'pragmatic encroachment' or 'contextualism,' challenges the idea that knowledge relies solely on truth and evidence, independent of practical concerns. While influential, it faces criticism that it blurs the line between genuine knowledge and practical caution, and remains an active, contested area of research in philosophy today."**

  **Key points covered:**
  1.  **Core Idea:** Stakes can affect the evidence threshold for knowledge (PE focus; EC implication differs).
  2.  **Challenge:** It questions purely truth/evidence-based definitions of knowledge.
  3.  **Criticism:** Highlights the key objection about blurring knowledge and practical risk.
  4.  **Status:** Correctly states it's influential but contested and actively researched, countering the "abandoned" claim.
