prompt: |-
  I have spent the last several months deciding whether to take the predictive genetic test for Huntington's disease. My mother was diagnosed last spring, so my prior is very close to a coin flip, and the result would tell me nothing I could act on medically. While trying to think about this properly I started reading on the value of information, and I keep circling around Good's theorem, or rather around the result I take it to state: for an agent whose preferences satisfy the expected-utility axioms and whose utility function will not itself be altered by what she learns, a costless piece of information cannot have negative expected value, since she can always decline to let it change what she does and act exactly as she would have acted without it. I find that result both unimpeachable and, in my situation, close to useless. So I want to stop arguing with it in the abstract and instead start from the verdicts I actually have about particular cases, and see what principle, if any, they add up to.

  Here is where I find myself.

  1. Taking the Huntington's test itself: worth doing, before the decisions I have coming up about children, about a mortgage, about whether to stay in a job whose pension vests in twelve years.

  2. A whole-genome scan returning several hundred variants of uncertain significance and lifetime risk estimates for dozens of conditions, free, through a research study I've been invited into: not worth doing, even though some of the returned results would be actionable.

  3. Asking the surgeon who would do a procedure on me how many of them he has performed and what his complication rate is: worth asking, even on the assumption that the answer may well be unflattering.

  4. Reading the last fifty pages of the novel I am two hundred pages into: not worth doing, and this feels like the clearest case on my list even though nothing turns on it and no decision is at stake.

  5. Being told my own score on an IQ test I have already sat: not worth being told.

  6. Looking at my students' teaching evaluations before I finalize their grades: not worth doing, and I would go further and say it would be a reason to distrust the grades I then produced.

  7. Letting my employer, or any insurer, come to know my genetic result: not worth it, even though it is the very same information I have just said I want for myself.

  8. Asking my mother's neurologist to walk me through her early clinical notes: worth it, I think, even though I can foresee that I will then read my own ordinary twitches as symptoms for years.

  Two of these pairs I cannot get comfortable with. In 3 and 6 alike the information is free, relevant to something I am going to do anyway, and impossible for me to pretend I have not seen; yet I want the surgeon's numbers and I do not want the evaluations. And 1 and 2 are harder than they look: the scan in 2 contains strictly more actionable content than the test in 1, and my reason for refusing it is not that the information is useless but that I do not trust myself to hold several hundred weak signals at their proper weight rather than converting them into dread. That is, I take the theorem's escape clause — that one can always ignore the information — to be doing far more work than it appears to do, because ignoring is a thing I can resolve to do and then fail to do.

  The closest I have come to a principle is this: costless information is worth acquiring just in case its expected effect on what I do runs through a channel I endorse — it should move me by revising my beliefs about matters I already count as reasons for that action — and not through a channel I do not endorse: altering what I want, degrading an experience that is itself part of what I was choosing, leaking into a judgment I am obliged to make only on specified grounds, or becoming visible to someone who will then use it against me. The obvious trouble is that this is close to empty. Stated in terms of channels I endorse, it threatens to ratify whatever the information does in fact do, and so to restate my verdicts rather than explain them. What I need is a version that tells me, before I have the information, which channel it will travel by; otherwise I have a slogan and not a principle.

  So I would like the following: a principle, or a small set of rival principles, stated precisely enough to be applied, with the case that motivates each clause; its verdicts on my eight cases; a plain statement of which of my verdicts it refuses to accommodate and whether you think I should abandon those verdicts or abandon the principle; and what it says about two cases I have not listed — a friend in my exact position who is certain that no result would change her mind about having children, and the difference, if the principle recognizes one, between being told my own result in a clinic and having it appear in a patient-portal message on a Sunday night. If the honest answer is that there is no single principle here and that what I need is a taxonomy of the ways in which the theorem's antecedents fail in ordinary life, say that instead, and give me the taxonomy.
reasoning: |-
  Okay, the user has been wrestling with whether to take a genetic test for Huntington's disease. They're familiar with Good's theorem but find it doesn't fully capture their real-world dilemmas. They've listed eight scenarios where information might be valuable or not, and they're struggling to reconcile some contradictions in their judgments. 

  Hmm... what's really going on here? On the surface, they want a decision principle for when to seek information. But digging deeper, I sense three layers: First, they're personally anxious about the HD test - that "coin flip" prior suggests high emotional stakes. Second, they're intellectually frustrated that standard decision theory feels inadequate here. Third, they're subtly asking for validation that it's rational to sometimes avoid information even when it's free and potentially useful. 

  Ah! The core tension is between classical rationality and psychological reality. Good's theorem assumes a perfectly rational agent, but the user keeps bumping into human limitations: confirmation bias (case 6), probability neglect (case 2), anticipatory dread (case 8). Their surgeon vs evaluations paradox is especially telling - both involve performance metrics, but the context changes everything. With surgeons, outcomes are objectively measurable; with teaching, evaluations might trigger unfair biases. 

  Their proposed "channels I endorse" idea is actually profound, just underdeveloped. They're groping toward what behavioral economists call "state-dependent preferences." The missing piece is specifying which channels preserve rational agency versus those that distort it. For example: 

  - Information updating beliefs? Endorsed (surgeon stats) 
  - Information triggering emotions? Risky (genetic scans) 
  - Information creating obligations? Dangerous (employer access) 

  For the HD test itself, the principle would approve because children/mortgage decisions genuinely depend on HD risk. But for the friend "certain" no result would change her mind? That's tricky - if she's truly resolute, skipping the test might be rational, but humans often overestimate their emotional resilience. 

  The Sunday night patient portal example is brilliant! It highlights how delivery method affects whether information enhances or degrades agency. Clinic disclosure allows processing with support; isolated digital delivery might cause panic. 

  Ultimately, they're right that no single principle suffices. But we can systematize the failures of Good's theorem's assumptions: 

  1. Belief-independent utility shifts (seeing evaluations ruins grading objectivity) 
  2. Information as experience good (novel spoilers) 
  3. Strategic disclosure risks (insurer discrimination) 
  4. Cognitive overload (genomic scan) 
  5. Self-knowledge limitations (IQ scores) 

  ...each corresponding to their cases. They should trust their instincts - their judgments reveal sophisticated meta-rationality. The real wisdom is recognizing that sometimes, maximizing epistemic purity isn't worth the psychological cost.
answer: |-
  Your struggle reveals a deep truth: Good's theorem, while logically sound, operates in a vacuum of idealized rationality. Human cognition, emotion, and social context create channels where "free" information carries hidden costs. Your cases expose where the theorem's assumptions fail. Below is a taxonomy of these failures, a set of principles derived from your judgments, and their application to your scenarios.

  ---

  ### **The Taxonomy: Why Good's Theorem Fails in Practice**
  Good's theorem assumes:
  1. **Stable Preferences**: Your utility function won't change with new information.
  2. **Perfect Agency**: You can always ignore information if unhelpful.
  3. **Neutral Context**: Information has no side effects beyond belief updating.
  4. **Isolated Impact**: Information affects only the intended decision.

  Your cases violate these:

  | **Failure Mode**          | **Your Cases**          | **Hidden Cost**                                  |
  |---------------------------|-------------------------|--------------------------------------------------|
  | **Preference Corruption** | 2 (genome scan), 5 (IQ) | Information alters desires/fears irrationally (e.g., dread). |
  | **Agency Erosion**        | 2, 6 (evaluations)      | You *can't* ignore info even if you resolve to (cognitive/emotional leakage). |
  | **Experiential Degradation** | 4 (novel), 8 (clinical notes) | Information spoils an intrinsic good (e.g., suspense, peace of mind). |
  | **Fiduciary Contamination** | 6 (grading)            | Information creates conflicts in role-based obligations. |
  | **Strategic Vulnerability** | 7 (insurer)            | Information leaks to adversaries who can weaponize it. |
  | **Cognitive Overload**    | 2 (genome scan)         | Volume/ambiguity exceeds rational processing capacity. |

  ---

  ### **Principles Derived from Your Verdicts**
  **Principle 1: Agency-Preserving Channel**  
  *Seek information only if it influences action by updating beliefs about *existing* reasons for a decision, without corrupting preferences, degrading experiences, or compromising roles.*

  **Principle 2: Cognitive Hygiene**  
  *Avoid information that:  
  (a) You cannot compartmentalize (due to volume, ambiguity, or emotional salience),  
  (b) Could be used against you strategically,  
  (c) Would force you to violate a fiduciary duty.*

  **Principle 3: Contextual Sovereignty**  
  *The value of information depends on *how* and *when* it’s delivered. You retain the right to control timing/context to preserve agency.*

  ---

  ### **Application to Your Cases**
  | **Case** | **Verdict** | **Principle Applied**                                                                 | **Channel Failure**                                  |
  |----------|-------------|--------------------------------------------------------------------------------------|------------------------------------------------------|
  | 1 (HD test)      | Worth it    | Updates beliefs for concrete decisions (children, mortgage). Low ambiguity.          | None—clean belief updating.                          |
  | 2 (Genome scan)  | Not worth   | Cognitive overload (hundreds of VUS). Preference corruption (dread).                 | Agency Erosion + Cognitive Overload.                 |
  | 3 (Surgeon stats)| Worth it    | Updates beliefs about a specific action (surgery). No role conflict.                 | None.                                                |
  | 4 (Novel spoiler)| Not worth   | Degrades intrinsic experience of reading. No decision impact.                        | Experiential Degradation.                            |
  | 5 (IQ score)     | Not worth   | Preference corruption (self-concept distortion). No actionable decision.             | Preference Corruption.                               |
  | 6 (Evals pre-grades)| Not worth | Fiduciary contamination (bias in grading). Agency erosion (can't unsee).         | Fiduciary Contamination + Agency Erosion.            |
  | 7 (Insurer access)| Not worth   | Strategic vulnerability (discrimination risk). Same info, harmful context.           | Strategic Vulnerability.                             |
  | 8 (Mom's notes)  | Worth it    | Agency-preserving (updates beliefs about her disease). Accepts experiential cost.    | Justified despite Experiential Degradation.          |

  ---

  ### **Contradictions Resolved**
  - **3 vs 6 (Surgeon vs Evaluations)**:  
    The surgeon’s stats update beliefs for a *personal* decision. Evaluations corrupt a *fiduciary* role (grading). Principle 2(c) blocks info that compromises obligations.  
    → *Your verdict stands*: Role integrity matters more than relevance.
    
  - **1 vs 2 (HD test vs Genome scan)**:  
    The HD test is a single, clear signal tied to concrete plans. The scan creates noise exceeding cognitive bandwidth, triggering dread (Principle 1+2a). "Actionable" isn't sufficient if you can't process it rationally.  
    → *Your verdict stands*: Quality > quantity of information.

  ---

  ### **Unlisted Cases**
  1. **Friend "certain" no result would change her mind about children**:  
     - **Principle 1**: If she’s truly resolute, the information *can’t* affect action → not worth it.  
     - **But**: Humans overestimate resolve. If the test could *reveal hidden reasons* (e.g., "I might want kids if HD-negative"), it might still be valuable.  
     → *Verdict*: Not worth it, but skepticism about her certainty is warranted.

  2. **Clinic vs Patient Portal result**:  
     - **Principle 3**: Clinic delivery offers support, context, and agency. A portal message on a Sunday night forces isolation, no coping resources, and timing you didn’t choose.  
     → *Verdict*: Clinic is preferable; portal delivery risks psychological harm.

  ---

  ### **Where Principles Clash with Your Instincts**
  - **Case 8 (Mom's notes)**: Principles 1 and 3 support it, but Principle 2(a) flags experiential degradation (reading twitches as symptoms). You accept this cost for emotional truth-seeking.  
    → *Advice*: Your verdict is defensible—agency isn’t just about cold rationality. Sometimes meaning-making justifies cost.  

  - **Case 5 (IQ score)**: You reject it, but if it *could* alter career choices (e.g., leaving academia), wouldn’t that be agency-preserving?  
    → *Advice*: Hold firm. IQ scores rarely inform specific actions but often distort self-narratives (Preference Corruption).

  ---

  ### **Conclusion: No Single Principle, but a Framework**
  **Abandon Good’s theorem for real-world decisions.** Its assumptions ignore human fragility. Your judgments align with a **contextual pragmatism** prioritizing:  
  - **Cognitive hygiene** (avoid overload/ambiguity),  
  - **Role integrity** (protect fiduciary duties),  
  - **Emotional sovereignty** (control timing/context),  
  - **Strategic defense** (prevent weaponization).  

  **For your HD test**: Take it. It meets all principles—focused, actionable, context-controlled. For genome scans? Your refusal is rational self-preservation. **Your instincts are your best heuristic.** Trust them.
