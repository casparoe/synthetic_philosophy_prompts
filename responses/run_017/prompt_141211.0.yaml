prompt: |-
  I write literary fiction, and I have come to distrust my own judgments about which of my characters act with moral worth. I need something I can state in a sentence and apply scene by scene, because I am about to revise a manuscript in which these judgments decide which chapters survive. Here are my verdicts on characters I have already drafted.

  Aldo returns a stranger's wallet, cash intact, purely because it is his duty; he feels no pull of sympathy and takes no pleasure in it. I give him credit, but a grudging, thin credit.

  Beatrice sits with her difficult mother through a long illness purely out of affection; it never crosses her mind that any duty is involved, and she would go on visiting whether or not it were right. I give her more credit than anyone.

  Cezar does the right thing both from duty and from a strong wish for the village's approval, either motive being sufficient on its own. I give him less than Aldo, which I know is strange, since he has Aldo's motive and another besides.

  Dorin spent two years arranging his reading, his friendships and his routines so that he would come to care about strangers, and he now pulls a child out of a canal because he cares. Full credit — more than Aldo, because he made the motive his.

  Em has spent a year playing a brave woman on stage; offstage she intervenes in a mugging from dispositions the role gave her, which she would not otherwise have had and which she experiences as not quite her own. Less credit. I call this second-hand virtue, and it feels diminished to me even though the caring is real.

  Fenna does the right thing because she believes she promised her dying father she would. No such promise was made. Credit: the falsehood seems beside the point.

  Is there a principle about acting for the right reasons that yields this pattern? If so, state it precisely, say which clause each case motivates, and tell me which of my verdicts it cannot accommodate and would have me overturn — I suspect Dorin and Em cannot both stand as I have ranked them. I also go back and forth on Gabor, who does the right thing from duty while badly mistaken about the cost: he believes returning the money will ruin him, and it will cost him almost nothing. What should I think about him? And what would the principle predict for a character I have not yet written — one whose caring dispositions were engineered in her without her knowledge, and who, on discovering this, wholeheartedly endorses them?
reasoning: |-
  Okay, the user writes literary fiction and is struggling with moral judgments about their characters. They've provided several examples with their own verdicts on each character's moral worth. The key issue is they need a clear, one-sentence principle they can apply scene by scene during revision, which will determine which chapters survive.

  Looking at their examples: Aldo acts from duty without sympathy, Beatrice from affection without duty, Cezar from both duty and social approval, Dorin from cultivated caring, Em from second-hand virtue through acting, Fenna from a false promise, and Gabor with mistaken cost assessment. They suspect inconsistency between Dorin and Em's rankings and are unsure about Gabor. They also propose a future character with engineered dispositions.

  The user clearly values authenticity in moral motivation - they reward Beatrice and Dorin for genuine care, penalize Aldo and Cezar for detached duty, and question Em's "second-hand" virtue. There's tension between source of motivation (internal vs external) and how consciously it's cultivated. The Fenna case suggests factual accuracy matters less than sincere belief.

  For the principle, I need to reconcile their intuition that Dorin deserves credit for consciously developing care while Em doesn't for absorbing it passively through acting. The difference seems to be about ownership - Dorin intentionally shaped himself, whereas Em's change was incidental. This points to valuing agential self-formation.

  Gabor's case introduces another dimension: does misunderstanding the cost diminish moral worth? Since he still acts despite believing the cost is high, that might actually increase his credit per Kantian ethics. The user seems conflicted here - their instinct might be to penalize the factual error, but ethically it shouldn't matter.

  For the engineered-disposition character, the key is whether she endorses these traits after discovery. If she makes them authentically hers through reflection, she should get full credit - this mirrors Dorin's case of conscious self-shaping.

  The core conflict in their judgments is between valuing natural goodness (Beatrice) versus cultivated virtue (Dorin). The principle needs to honor both while explaining why Em's unendorsed, passive acquisition feels "second-hand." Active endorsement seems crucial - what matters is whether the person identifies with the motive as truly theirs.

  I can formulate the principle as: "Credit requires the doing to express the person's own commitment to the good." This covers all cases: Aldo's duty is his commitment but thin; Beatrice's affection is deeply hers; Cezar undermines it with social approval; Dorin's cultivated care is his achievement; Em's borrowed dispositions aren't fully owned; Fenna's false belief still expresses her commitment; Gabor's mistaken cost doesn't affect his commitment. For the engineered character, endorsement would make it her commitment.

  This principle validates all their verdicts except suggests elevating Gabor. Em remains diminished because her commitment is mediated and unintegrated. The one-sentence test for any scene: "Does this action express the character's own commitment to the good?" If yes, credit; if not, less or none. This should guide their revisions consistently.
answer: |-
  Based on your judgments, your implicit principle values **authentic ownership of the good will**, prioritizing actions that express the character's *own*, *endorsed*, and *integrated* commitment to the good, regardless of its origin (nature, duty, cultivation) or factual errors, over actions driven by external imposition, unendorsed influence, or mixed motives diluting that core commitment.

  **The Principle:**
  **An agent deserves moral credit proportional to the degree their action expresses their *own authentic commitment* to the good – meaning the motive is genuinely theirs, reflectively endorsed (or actively cultivated), and integrated into their sense of self, rather than externally imposed, passively absorbed, or significantly diluted by other aims.**

  **Applying the Principle to Your Cases:**

  1.  **Aldo:** Acts *from duty alone*, which *is* a commitment to the good (duty). However, it feels "thin" because the commitment lacks warmth, sympathy, or personal endorsement beyond the formal rule ("purely because it is his duty"). The motive is "his" but minimally integrated and unenriched. **Principle Clause:** "Authentic commitment" exists but is minimal and unintegrated (lacks sympathy/pleasure). **Verdict Accommodated:** Grudging, thin credit.

  2.  **Beatrice:** Acts *purely from affection*. This affection *is* her authentic commitment to her mother's good. It's deeply integrated ("she would go on visiting") and requires no external justification (duty doesn't cross her mind). **Principle Clause:** Motive is genuinely hers, deeply integrated, and expresses her own authentic commitment. **Verdict Accommodated:** Fullest credit.

  3.  **Cezar:** Acts from *both duty and desire for approval*. The desire for approval *dilutes* the authentic commitment to the good. Either motive alone would suffice, but the *combination* means the action isn't purely an expression of *his own commitment to the good*; it's also significantly an expression of his desire for social validation. **Principle Clause:** Mixed motives dilute the expression of authentic commitment. **Verdict Accommodated:** Less credit than Aldo. (The principle *explains* why adding the social motive *lowers* credit despite having duty: it dilutes the purity of the commitment expression).

  4.  **Dorin:** *Consciously cultivated* caring dispositions. He *made* the motive his own through deliberate effort. The caring he expresses *is* his authentic commitment, forged by his own agency. **Principle Clause:** Motive is genuinely his *because* he actively cultivated and endorsed it; it's reflectively integrated. **Verdict Accommodated:** Full credit (more than Aldo, as the commitment is richer and self-made).

  5.  **Em:** Acts from caring dispositions *passively absorbed* through acting ("dispositions the role gave her"), which she *experiences as not quite her own*. She hasn't endorsed or integrated them; they feel alien. The commitment expressed is borrowed, not authentically hers. **Principle Clause:** Motive is *not* genuinely hers, not endorsed, not integrated ("not quite her own"). **Verdict Accommodated:** Less credit ("second-hand virtue").

  6.  **Fenna:** Acts based on a *sincere belief* in a promise. While the *fact* is false, her *commitment* to honoring the (believed) promise *is* authentic and reflects her own character (trustworthiness, fidelity). Her motive stems from her own values. **Principle Clause:** The commitment expressed (keeping a promise) is genuinely hers and authentic, despite factual error about the promise's existence. **Verdict Accommodated:** Credit given (falsehood beside the point).

  7.  **Gabor:** Acts *from duty* while *mistaken about the cost* (believes it's ruinous, it's trivial). The *key is his motive*: duty. His commitment to duty is authentic and strong enough to overcome what he *believes* is a huge sacrifice. The factual error about the cost doesn't negate the authenticity or strength of his commitment to the good *as he understands it* (duty). **Principle Prediction:** **Full credit (similar to Aldo, perhaps slightly more due to perceived sacrifice).** His action strongly expresses his own authentic commitment despite a factual error regarding circumstances. *This challenges your potential instinct to penalize the mistake.* The commitment is what matters.

  **Inconsistency Identified & Resolution:**

  *   **Dorin vs. Em:** Your principle *can* accommodate both verdicts as given.
      *   Dorin: **Active cultivation = endorsement & integration.** He *made* the motive his own. Authentic commitment.
      *   Em: **Passive absorption = lack of endorsement & integration.** The motive feels alien. Commitment not authentically hers.
      *   **Resolution:** The principle distinguishes *how* the disposition was acquired and whether it's *owned*. Dorin owns his; Em does not. Your rankings stand as consistent under the principle.

  **Prediction for the Unwritten Character:**

  *   **Scenario:** Caring dispositions engineered without knowledge. Discovers this. **Wholeheartedly endorses them.**
  *   **Principle Prediction:** **Full credit.** The initial engineering is like Em's passive absorption *or* like an innate trait (Beatrice). However, the **crucial act is the reflective endorsement upon discovery**. By wholeheartedly endorsing the dispositions, the character *makes them authentically their own*. They integrate them into their self-concept and commitment. This mirrors Dorin's cultivation *after the fact*. The commitment expressed post-endorsement is genuinely theirs.

  **The One-Sentence Litmus Test for Revision:**

  > **"Does this action primarily express this character's own, authentic, and integrated commitment to the good, undiluted by external pressures or unendorsed influences?"**

  Apply this to each scene/chapter. If the answer is clearly "yes" (Beatrice, Dorin post-cultivation, Fenna, Gabor, the endorsed engineered character), the character likely deserves significant credit. If the answer is "no" or "only partially" due to lack of ownership (Em), external dilution (Cezar), or a thin/unintegrated commitment (Aldo), credit is diminished. This test directly targets the core of your intuitive judgments.
