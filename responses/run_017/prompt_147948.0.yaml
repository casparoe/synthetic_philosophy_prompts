answer: |-
  Below is a complete, runnable activity design for your seminar, optimized for 75 minutes, 24 students, and your listed materials. The design prioritizes experiential learning, avoids upfront theory, and ensures the core lessons emerge from gameplay and whiteboard data. I've refined your machinery to address practical constraints and added safeguards against common pitfalls.

  ---

  ### **Activity Title: The Urn Game**
  **Learning Goal:** Experience how group decision-making succeeds or fails based on hidden properties of voters and information.

  ---

  ### **Setup (10 minutes)**
  1. **Room Prep**: Arrange chairs in a circle. Place whiteboard centrally.  
  2. **Materials**: 
     - Two opaque bags labeled "URN A" and "URN B" (pre-filled per round).  
     - Index cards (for voting), playing cards (for signals), tokens for rewards (e.g., chocolate).  
     - Whiteboard with pre-drawn table:  
       | Round | Trials | % Correct (Group) | Notes |  
  3. **Student Instructions (Verbal Only)**:  
     - *"We’re playing a game where a hidden 'true state' (A or B) is chosen randomly each round. You’ll get a private clue about the state. Your goal is to vote for the true state. If the group majority is correct, everyone gets a token. We’ll run 3–4 quick trials per round. Do not discuss your clues unless instructed."*  
     - **Crucial**: Do not mention accuracy rates, independence, or the theorem.  

  ---

  ### **Core Mechanics (Repeated Per Trial)**  
  - **State Selection**: Flip a coin (heads = A, tails = B).  
  - **Private Signals**: Students draw one playing card from the active urn bag (clue).  
  - **Voting**: Secret ballot via index cards (write "A" or "B"). Tally votes openly on whiteboard.  
  - **Reward**: Group wins tokens if majority correct.  
  - **Debrief Prep**: Record group accuracy after each round.  

  ---

  ### **Rounds (45 minutes total, 10–12 trials)**  
  Run **3 trials per round** to ensure frequencies emerge. Adjust signal accuracy by changing urn compositions:  

  | Round | Urn Composition (A/B) | Key Twist | Target Lesson | Time |  
  |-------|------------------------|-----------|--------------|------|  
  | **0: Baseline** | A: 7♥, 3♠; B: 7♠, 3♥ | None. Students vote immediately after seeing clue. | Competence + independence → high accuracy. | 8 min |  
  | **1: Expert Memo** | Same as Baseline. | Before voting, read aloud: *"Expert Report: True state is [A/B]"* (70% accurate, per pre-drawn "correct/incorrect" tokens). | Common cause breaks independence → errors correlate, accuracy drops. | 9 min |  
  | **2: Public Leanings** | Same as Baseline. | First 4 voters announce votes aloud; others vote after. | Public votes create herding → breaks independence. | 9 min |  
  | **3: Confident & Unreliable** | Reliable (18 students): A: 7♥, 3♠; B: 7♠, 3♥. Unreliable (6 students): A: 4♥, 6♠; B: 4♠, 6♥. | Unreliable voters (privately instructed) speak first/forcefully: *"I’m sure it’s A/B!"* Others vote after. | Confidence ≠ competence; unweighted voting fails with varying reliability. | 10 min |  
  | **4: Inverted** | A: 4♥, 6♠; B: 4♠, 6♥. | None. | Competence <50% → group accuracy *worsens* with size. | 9 min |  

  ---

  ### **Key Tweaks to Your Machinery**  
  - **Efficiency**: 3 trials/round (not 15–20) balances noise and time. Whiteboard tallies let frequencies speak.  
  - **Anti-Correlation Leak**: Use ♥/♠ (not "red/black") to obscure correlations. In Round 4, don’t reveal accuracy until debrief.  
  - **Confident Speakers**: Privately brief 6 unreliable students pre-round to "project certainty" and speak first. Use playing cards to assign roles discreetly.  
  - **Varying Competence**: Round 3 uses distinct urns for reliable/unreliable. Optimal weighting (log-odds) is discussed in debrief—**you’re correct** that votes should be weighted by `log(p/(1-p))`, not raw accuracy.  
  - **Noise Mitigation**: Low trial counts risk noise; use whiteboard to emphasize trends (e.g., "Round 4: 0/3 correct").  

  ---

  ### **Debrief (20 minutes)**  
  **Goal:** Link rounds to Condorcet’s assumptions without lecturing. Use whiteboard data to drive insights.  

  | Step | Facilitator Prompts | Key Points |  
  |------|---------------------|------------|  
  | **1. Observe Data** | *"Look at our whiteboard. When was the group most/least accurate? Why?"* | Highlights Round 0 (high accuracy) vs. Round 4 (low). |  
  | **2. Map to Assumptions** | *"In Rounds 1–3, what changed? Did voting feel harder? Why?"* | **Independence**: Broken by expert memo (1), public votes (2), and confident speakers (3). **Competence**: Broken in Round 4 (and unreliable voters in 3). |  
  | **3. Name the Theorem** | *"This illustrates Condorcet’s jury theorem: Majority rule works iff (1) each voter is >50% accurate, and (2) errors are independent. When these hold, bigger groups help. When they break..."* | Theorem’s math is uncontested if assumptions hold. Conclusion flips if competence <50%. |  
  | **4. Faculty Committee Case** | *"In my hiring committee, we discuss openly and vote publicly. Does this resemble any round? What could go wrong?"* | Links to Rounds 1–3: Shared info and social pressure break independence. |  
  | **5. Controversies** | **Facilitator Script**: *"Some open questions: Is deliberation net good? The theorem says it often breaks independence, but real discussion might improve individual competence (we didn’t model this). Should we weight by confidence? Math says ‘yes’ if we know reliability, but we rarely do. What’s the fix for correlated errors? No consensus—some say secret ballots, others say structured deliberation."* | Delineate settled vs. contested:  
  - **Settled**: Math of theorem; inversion when competence <50%.  
  - **Contested**: Whether deliberation helps truth-tracking; best alternatives to majority rule. |  
  | **6. Takeaways** | *"The ‘wisdom of crowds’ isn’t magic—it needs competence and independence. Breaking these hurts more as groups grow. What feels rigorous (e.g., consulting experts, discussing) often breaks independence."* | Gut-level understanding: Cheerful conclusion rests entirely on two brittle assumptions.  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem**: Small-sample noise swamps effects (e.g., Round 2 accidentally correct).  
    **Fix**: Stress aggregate trends. Use whiteboard to show "0/3" or "1/3" when theory predicts failure.  
  - **Problem**: Confident-unreliable students overcommit to role.  
    **Fix**: Brief them privately: *"Play this role just for Round 3; it’s a one-time experiment."*  
  - **Problem**: Students peek at clues/signals.  
    **Fix**: Use playing cards (clubs/spades indistinguishable at a glance); remind them not to share.  
  - **Problem**: Inverted round leaks (students deduce anti-correlation).  
    **Fix**: Use ♥/♠ (not colors); avoid terms like "accuracy." If leaked, say: *"Yes, this simulates when biases overwhelm signal."*  
  - **Problem**: Time runs short.  
    **Fix**: Drop 1 trial per round; skip Round 3 discussion if needed.  

  ---

  ### **Limitations & Uncontested/Contested Elements**  
  - **Limitations**:  
    - **Asymptotics**: With n=24, effects are directional (e.g., Round 4 accuracy << Round 0) but not asymptotic. State: *"Math shows accuracy → 100% (or 0%) for large n—try simulating at home!"*  
    - **Real Discussion**: Activity omits informational benefits of debate (e.g., sharing unique insights). Acknowledge this gap.  
  - **Settled**:  
    - Theorem’s math under fixed assumptions.  
    - Inversion when individual accuracy <50%.  
    - Optimal weighting uses log-odds if competences known.  
  - **Contested**:  
    - **Deliberation**: Net impact debated. Some argue it reduces independence but boosts competence (e.g., [Landa & Meirowitz, 2009](https://doi.org/10.1017/S0003055409990056)).  
    - **Weighting**: Log-odds is optimal but impractical (competences unknown). Some prefer diversity over weighting.  
    - **Alternatives**: When errors correlate, options include secret ballots (restores independence) or random sub-samples (breaks correlation), but no silver bullet.  
    - **Theorem’s Message**: Defends majority rule if assumptions hold; warns against it if not. Context determines whether it’s optimistic or cautionary.  

  ---

  ### **Why This Works**  
  - **Gut-Level Lessons**: Students *see* accuracy plummet when independence/competence break (whiteboard data). They *feel* herding (Round 2) and manipulation (Round 3).  
  - **Faculty Committee Link**: Explicitly ties to your experience—open discussion/public votes mirror Rounds 1–3.  
  - **No Theory First**: Theorem emerges from data, maximizing "aha!" moments.  
  - **Log-Odds Nod**: Round 3 sets up debrief discussion on weighting without complicating gameplay.  

  This design fits your constraints, leverages your materials, and ensures students experience the theorem’s fragility. Run it as-is, and they’ll leave skeptical of "wisdom of crowds" clichés—and alert to real-world pitfalls.
