                  But we don't tell them the probabilities. We just say "more likely". And we keep the probabilities hidden.

            5. Collect votes and tally. Announce the majority vote.
            6. Reveal the true state. Record on whiteboard.

     Round 1 (Expert memo): 2 trials

          Before the round: "Now, before you receive your private signal, you will all see an expert memo. The expert has a good track record but is not perfect."

          Trial i:
            1. Choose state.
            2. Generate expert memo: 
