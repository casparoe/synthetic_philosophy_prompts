     This shows the group size effect.

     We hope the activity will make the students feel the assumptions in their gut.

     Final note: we offer a small reward (chocolate) for each correct vote? That might be too much. Alternatively, we can reward the group if they get the majority vote correct? But then they might collude? We can say: in each trial, if the majority vote is correct, everyone gets a chocolate? But then they are incentivized to coordinate. That breaks the independence. So we want them to vote based on their signal? We can tell them: vote based on your signal. And then we reward individually? But then they might not care about the group outcome.

