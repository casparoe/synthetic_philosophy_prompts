     The other rounds may show drops in accuracy.

     This design meets the constraints and learning goals.

     Note: the mathematics of the theorem is not contested. The inversion when p<0.5 is also not contested. The other inferences (about the net effect of deliberation) are contested.

     We present the activity as a demonstration of the theorem's assumptions and what happens when they break, not as a comprehensive simulation of real committees.

     We also note that the activity does not cover the asymptotic behavior (we have fixed n=24) and the benefits of information aggregation in discussion are not modeled.

