               - Weighting: if we know the competences, we can weight, but we usually don't.
               - What to do instead? There isn't a clear answer. Some advocate for voting systems that are more robust to correlation, but it's an open problem.

     We also note that the Condorcet jury theorem is about truth-tracking in a binary decision. It may not apply to other types of decisions.

