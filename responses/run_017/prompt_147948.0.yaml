     Given the pedagogical purpose, we might forgo rewards, or give a chocolate to every student at the end for participation? Or we can say that the group with the most correct votes in their role? But that might create competition.

     I think we can skip the rewards for correct votes and just give a participation chocolate at the end.

     Now, let's write the detailed instructions for each round.

     Due to the length, I'll summarize the steps for the facilitator:

     Preparation:

          - Prepare bags:
              For state A (70%): 7 red, 3 black (index cards or playing cards)
              For state B (70%): 7 black, 3 red
              For expert memo: 7 "correct", 3 "incorrect" (tokens or cards)
