prompt: |-
  hey — I need something I can actually hand to a committee, and I've failed to write it four times now.

  Setup: I'm a philosophy PhD student, and last year I got put on the data-governance committee for the two-hospital academic health system my department is affiliated with. We decide what goes in the demographics block of the electronic health record, and who's allowed to use those fields downstream. We meet every other week, 25–30 proposals a year, about 25 minutes each. The committee is a hospitalist, a nurse manager, a data architect, a compliance officer who has to sign off on everything or it doesn't ship, a rotating patient advocate, and me. Nobody else on it has read anything about social construction and nobody else ever will. The hospitalist hears "social construction" as "it's made up, so it doesn't matter"; the data architect hears it as "let people self-describe and then never aggregate." I get one page, ten questions maximum, and I cant use any jargon. Whatever we decide sits in the record for a decade and gets used for disparities research, quality reporting, registry submissions, and clinical decision support.

  What keeps happening: every proposal is really "add, delete, or redefine a category of person." I can see why the same move is fine in one case and a disaster in another, but when I try to say it I either give a five-minute lecture on Hacking's looping effects or I cave and vote on vibes. So: write me a procedure.

  What it has to be:
  - Ordered questions with hard stops, not a menu of considerations. I need to be able to say "question 3 fails, we're done, next proposal."
  - For each question: what counts as a sufficient answer, and who has to supply it (the proposal author? informatics? compliance?).
  - Explicit marks at the points where the answer is a values decision and has to go to a named human rather than to the procedure.
  - Runnable by someone with no theory, in ~20 minutes, from documents the committee already has.
  - It has to cope with: the same label meaning different things at the two hospitals we merged; a field collected at intake for one purpose getting reused eight years later for another; a category used to track something causal (exposure to a social environment) versus used as a proxy for an intrinsic property; and people who give different answers at different times or get classified differently by different staff.

  I also want you to commit, not survey, on three design choices:

  1. Which distinctions have to survive the translation and which can be dropped. My instinct is that the interactive-vs-indifferent-kind / looping stuff and the conferral stuff (who has to do what, in what setting, for the property to be there) are load-bearing, and that the whole realism/antirealism fight about whether race is "real" is dead weight we should just drop and never mention again. Tell me if I've got that backwards.

  2. Whether to require, for every category, an "export license": a written statement of the downstream uses it's licensed for, where any new use has to come back through us. I made this up, it's the part I'm least sure about, and the data architect already hates it.

  3. Whether there should be a rule that any field used to make a clinical decision about a patient has to be recorded as an act — what was actually asked, of whom, by whom, when — rather than as a trait of the patient. And what the procedure should do when the honest answer to "what was actually asked" is "nothing, the clerk guessed" or "nothing, a model imputed it." Related: I've been calling the next question the re-description question — if someone reads this field in eight years under a different description than the one it was collected under, what breaks? Keep it if it earns its place on the page, cut it if its just decoration.

  Then run it on three proposals actually in front of us:

  (a) Add a "Middle Eastern or North African" option to the race/ethnicity question, because a patient-advocacy group says the current boxes force people into "white" and their community disappears from our disparities data.

  (b) Have the lab auto-populate the race field from a genetic-ancestry panel that's already being run on a subset of patients, on the grounds that it's more objective and intake staff are bad at asking. I think this is obviously bad and I cannot say why in a form the hospitalist will accept.

  (c) Delete the "sex assigned at birth" field and keep only gender identity, because a committee member argued last meeting that the first one is "just a social category with no clean biology under it, so its noise in a medical record."

  On (c): my sympathies are with the deletion and my own work is why — I spend my days arguing these categories are constructed. If the procedure, run honestly, says keep the field, I want you to say that plainly and tell me why construction isn't the reason to delete it. I'd rather be overruled by the checklist than by my politics.

  One more, which you should feel free to treat as the real test: we've been told to harmonize the two hospitals' category sets into one master list. If the procedure implies we shouldn't — that we should keep both and map between them at analysis time — say so, because the CIO is going to be furious and I want to know before I walk into the room.

  Give me your version, argue for it, say where it has to hand off to a person and where it'll just misfire, and don't hedge between options. No reading lists and no citations — I can look those up myself, I need the page.
reasoning: |-
  We are creating a decision procedure for the data governance committee. The procedure must be a series of ordered questions with hard stops, clear criteria for sufficient answers, and assignment of responsibility for providing those answers. It must handle the complexities of social categories in a healthcare setting without relying on philosophical jargon. 

  Key issues to address:
  - The same label meaning different things at different hospitals.
  - Fields being reused for different purposes years later.
  - Categories used as causal proxies vs. intrinsic properties.
  - Variability in how people are classified or self-report.

  Design choices to commit to:
  1. Prioritize the interactive/looping effects and conferral aspects (how the category is applied and by whom) over realism/antirealism debates.
  2. Implement the "export license" idea: each category must have a defined set of permitted downstream uses, and new uses require re-approval.
  3. Require that any field used for clinical decision support must be recorded as an act (what was asked, by whom, when) rather than as a fixed trait, and address cases where data is guessed or imputed.

  The procedure must be runnable in ~20 minutes per proposal, using documents the committee already has.

  Proposed Decision Procedure:

  **PROCEDURE: CATEGORY CHANGE PROPOSAL (CCP) EVALUATION**

  **Step 0: Pre-submission (Handled by Proposal Author)**
  - The proposal must include:
    a. Clear specification of the change (add, delete, redefine).
    b. The field(s) and context(s) of collection (e.g., intake form, lab order).
    c. The current and proposed category definition (if applicable).
    d. The problem the change solves or the benefit it provides.
    e. Any known risks or drawbacks.
    f. The "export license": a list of all current and anticipated downstream uses (disparities research, clinical decision support, etc.).

  **Step 1: Problem Definition (Committee; 3 minutes)**
  - Question 1: Is the problem clearly stated and does it align with at least one of the following: (a) improving patient care, (b) meeting regulatory requirements, (c) enabling essential research, (d) correcting a known data inaccuracy or gap? 
    - Sufficient answer: Yes, with specific examples of the problem from the proposal or committee knowledge. 
    - If no: Reject. Hard stop.

  **Step 2: Current Usage Audit (Informatics/Data Architect; 5 minutes)**
  - Question 2: Is there a complete list of current downstream uses of the field(s) affected? (This must be provided by the data architect from system metadata.)
    - Sufficient answer: A report showing all systems, reports, and processes that use the field, including clinical decision support, research, billing, and quality reporting. 
    - If incomplete: Return to data architect for full inventory. Hard stop until next meeting.
  - Question 3: For each current use, is the field fit for purpose? (i.e., is it used in a way that matches how it is collected and defined?)
    - Sufficient answer: For each use, a yes/no with rationale from the data architect and compliance officer (for regulatory uses). 
    - If any use is not fit for purpose and the proposal does not address it: Reject or require amendment. Hard stop.

  **Step 3: Change Impact (Committee; 5 minutes)**
  - Question 4: Does the change break any existing downstream uses? (Data architect and compliance officer must answer.)
    - Sufficient answer: A list of broken uses and a mitigation plan for each (e.g., mapping old to new values, phased rollout). 
    - If unmitigated breaks: Reject. Hard stop.
  - Question 5: Will the change create new risks for misclassification or harm? (Nurse manager and patient advocate must answer based on clinical and patient experience.)
    - Sufficient answer: Identification of specific risks (e.g., patients forced into incorrect boxes, staff confusion) and a plan to address them (training, revised workflows). 
    - If unaddressed high risks: Reject. Hard stop.

  **Step 4: Collection Method & Stability (Committee; 4 minutes)**
  - Question 6: How is the category collected? (Proposal author must specify: self-report, staff observation, lab test, etc.) 
    - If collected by staff observation or imputation: 
      - Question 6a: Is there a written protocol for collection? (Must be provided by informatics or the proposal author.) 
        - If no: Reject or require protocol development. Hard stop.
    - If used for clinical decision support:
      - Question 6b: Is the collection method recorded as an act (what was asked, by whom, when)? (This is required by our design choice 3; if not, the proposal must be amended to include this.)
        - If no and it's for clinical decisions: Reject. Hard stop.
    - Note: For imputed data (e.g., a model guessing race), the "act" is the imputation method and its parameters. This must be documented.

  **Step 5: Conferral & Looping (Committee; 3 minutes)**
  - Question 7: Who confers the category? (e.g., patient, clinician, algorithm) And under what conditions? 
    - Sufficient answer: Clear statement of the conferring agent and context. 
    - Question 8: Could this category lead to harmful looping effects? (e.g., could being labeled in this way change the patient's future behavior or treatment in a way that reinforces the label inaccurately?) 
    - Responsibility: Hospitalist and patient advocate must assess based on clinical and social harm potential. 
    - Sufficient answer: If potential for harm is identified, a plan to monitor and mitigate must be included. 
    - If high risk and no mitigation: Reject. Hard stop.

  **Step 6: Export License & Re-description (Committee; 3 minutes)**
  - Question 9: Does the export license (from Step 0) cover all current uses and explicitly forbid unapproved uses? (Compliance officer must confirm.) 
    - Sufficient answer: The license must be attached and signed by compliance. 
    - If not: Reject until provided. Hard stop.
  - Question 10: If this field is re-described in the future (used under a different definition), what would break? (Proposal author and data architect must answer.) 
    - Sufficient answer: A list of known re-description risks (e.g., if genetic ancestry is used as a proxy for race in disparities research, but the two are not equivalent) and how the data dictionary will warn users. 
    - If high risk (e.g., causal inferences from non-causal data) and no warning: Reject. Hard stop.

  **Step 7: Values Decision (Committee Chair)**
  - If the proposal passes all steps, it must be reviewed for alignment with institutional values by the committee chair (or a designated values officer, if such exists). This is a human judgment call about whether the change promotes equity, respect, and care. The chair may veto only with a stated reason.

  **Design Choices Argued:**
  1. **Interactive vs. Realism:** We drop the realism debate because it doesn't help us in practice. What matters is how the category is used (conferral) and what effects it has (looping). These are operational concerns. For example, a category can be "real" in its effects even if socially constructed, and that's what we must manage.
  2. **Export License:** We require it. Without it, categories get used in ways that were never intended, leading to misuse and harm. The data architect hates it because it creates more work, but it is necessary for responsible governance. It forces us to think about downstream uses upfront.
  3. **Clinical Decisions as Acts:** We require it. If a clinical decision is made based on a category, we must know the provenance of that data. If it was guessed, that must be recorded so that the uncertainty is visible. This prevents silent errors. For imputed data, we record the model and version.

  **Running the Proposals:**

  **(a) Add "Middle Eastern or North African" (MENA) option**
  - Step 1: Problem is clear (community invisibility in disparities data) and aligns with improving care and research. Pass.
  - Step 2: Data architect provides usage: race/ethnicity field is used in disparities research, quality reporting, and some clinical decision support (e.g., genetic risk calculators that use race). Current collection is self-report with staff assistance. Pass.
  - Step 3: Impact: Adding a box doesn't break existing uses if we map "white" to include MENA for historical data? But we want to separate them. Mitigation: Historical data remains as-is; new data uses new category. Risks: Staff might misassign; training needed. Mitigation plan required. Pass with plan.
  - Step 4: Collected by self-report. No change to method. Not used for clinical decisions that require act recording (yet). Pass.
  - Step 5: Conferral: Patient self-reports. Looping: Possible positive effect (community visible) but no clear harm. Pass.
  - Step 6: Export license: Must be updated to include MENA as a distinct category for disparities research. Re-description risk: If someone uses this for genetic inferences, that's a mismatch. Warning needed in data dictionary. Pass with warning.
  - Step 7: Values: Promotes equity. Pass.
  - **Outcome: Approve with required mitigation (training) and data dictionary warning.**

  **(b) Auto-populate race from genetic-ancestry panel**
  - Step 1: Problem: Staff are bad at asking, so genetic ancestry is "more objective." But does this improve care? Genetic ancestry is not equivalent to race (which is social). Problem statement conflates the two. **Fail at Step 1** because it does not align with improving care (may harm by misrepresenting race) and creates a new inaccuracy. 
  - If pushed: Step 2: Usage audit would show race is used in disparities research (which requires social race, not genetics) and clinical decisions (e.g., race-based eGFR). Step 3: Breaks disparities research because genetic ancestry ≠ social race. Unmitigatable. Hard stop. 
  - **Outcome: Reject.** We don't even get to later steps, but note: Step 4 would require recording as an act (the lab test), but then Step 5: Conferral by algorithm, which may not match patient identity. Looping: Harmful if patient is treated based on genetic race they don't identify with. Step 6: Re-description risk is extreme (using genetics as proxy for social race is invalid). 

  **(c) Delete "sex assigned at birth" and keep only gender identity**
  - Step 1: Problem: "Sex assigned at birth is a social category with no clean biology, so it's noise." But problem must align with improving care, etc. Does deletion improve care? Not clear. The field may be needed for some contexts (e.g., cancer screening for organs present). **Fail at Step 1** if problem isn't stated in terms of data quality or harm. 
  - Reframe problem: "To reduce patient distress and inaccuracies by removing a field that is often misused." Then:
  - Step 2: Usage audit: Where is this field used? If used in clinical decision support (e.g., for sex-specific screenings) or research (e.g., on outcomes by sex), deletion breaks uses. 
  - Step 3: If no mitigation for broken uses (e.g., replacing with organ inventory), reject. 
  - Step 4: If gender identity is used for clinical decisions that require sex assigned at birth (e.g., prostate exam eligibility), then we must record how gender identity was collected (as an act). But if we delete sex assigned at birth, we lose information that might be needed. 
  - Step 5: Conferral: Sex assigned at birth is conferred at birth (by whom?); gender identity by patient. Looping: Deleting birth sex might reduce misgendering but could also create medical risks if not replaced. 
  - **Outcome:** Without a replacement for essential uses, reject. The reason to keep it isn't that it's "real" but that it is currently used in ways that gender identity alone cannot replace. Construction isn't the issue; usage is. 

  **Harmonization of Two Hospitals' Categories:**
  - The procedure implies we should not fully harmonize if the same label means different things. Instead:
    - Step 2 (Usage Audit) would reveal the different definitions and uses.
    - Step 3 (Change Impact): Forcing harmonization would break existing uses at both hospitals.
    - Step 6 (Re-description): High risk if we merge without mapping.
  - **Recommendation:** Keep both category sets. Create a mapping table for analysis and require all downstream users to use this mapping. Add a data dictionary warning about the different historical collection methods. 
  - This will anger the CIO because it's messy, but the procedure forces it. The alternative is to redefine everything and break old data, which is worse.

  **Where the Procedure Misfires:**
  - It assumes that the data architect can produce a complete usage inventory in 5 minutes. In practice, this may require pre-work. So we must insist that proposals come with a preliminary audit.
  - The values decision at the end is subjective. But we must have a human check for equity and care.
  - It doesn't handle "trait vs. act" for non-clinical-decision fields. But we only require acts for clinical decisions because that's where harm is most immediate.

  **Final Output:** A one-page flowchart of the 10 steps with hard stops, and a template for the export license.
answer: |-
  Below is a decision procedure designed for your committee. It prioritizes operational clarity, accountability, and mitigation of real-world harms over theoretical debates. I commit to your three design choices:  
  1. **Interactive/looping effects and conferral are load-bearing**; realism/antirealism is dead weight (dropped). What matters is how the category is *applied* (who confers it, in what context) and its *effects* (looping).  
  2. **Export licenses are required**. They force explicit justification for downstream uses and prevent misuse. The data architect’s objection is outweighed by the risk of ungoverned repurposing.  
  3. **Clinical decisions require "act" recording** (what was asked, by whom, when). Traits inferred without patient input (e.g., guessing, imputation) must be flagged as such.  

  The procedure is **10 questions**, ordered with hard stops. Each question specifies:  
  - **Sufficient answer**: Minimum criteria to proceed.  
  - **Responsibility**: Who must supply/verify the answer.  
  - **Values handoff**: Points where human judgment is required (labeled **VALUES**).  
  Total runtime: ≤20 minutes per proposal, using existing documents (e.g., proposal forms, system metadata, compliance logs).  

  ---

  ### **DECISION PROCEDURE: CATEGORY CHANGE PROPOSAL**  
  **Input**: Proposal form (completed by author) + current data dictionary + export license draft.  

  1. **PROBLEM VALIDATION**  
     - *Question*: Does the proposal identify a specific problem (e.g., harm, bias, operational failure) caused by the *current* category?  
     - *Sufficient answer*: Concrete example (e.g., "Group X is miscounted in disparities reports"). Vague claims (e.g., "it’s outdated") fail.  
     - *Responsibility*: Proposal author.  
     - *Hard stop*: If no → **Reject**.  
     - *Design note*: Forces focus on tangible issues, not theory.  

  2. **DOWNSTREAM USES AUDIT**  
     - *Question*: Is there a complete list of *all* current downstream uses (e.g., research, clinical alerts, billing)?  
     - *Sufficient answer*: Report from system metadata showing ≥1 use. Omissions fail.  
     - *Responsibility*: Data architect (using existing inventory).  
     - *Hard stop*: If incomplete → **Table until next meeting**.  

  3. **EXPORT LICENSE REVIEW**  
     - *Question*: Does the export license explicitly list permitted downstream uses (e.g., "disparities research only") and ban unapproved repurposing?  
     - *Sufficient answer*: Yes, with compliance officer sign-off.  
     - *Responsibility*: Compliance officer + proposal author.  
     - *Hard stop*: If no → **Reject**.  
     - *Design note*: Non-negotiable; prevents future misuse.  

  4. **CONTEXT STABILITY CHECK**  
     - *Question*: Is the category collected in the same context across all uses? (e.g., intake vs. inpatient, hospital A vs. hospital B).  
     - *Sufficient answer*: Confirmation of uniform context OR mitigation plan for differences (e.g., separate fields for each hospital).  
     - *Responsibility*: Informatics lead.  
     - *Hard stop*: If context differs and no mitigation → **Reject**.  

  5. **CAUSALITY/PROXY ALIGNMENT**  
     - *Question*: Is the category used as a *proxy* for something else (e.g., ZIP code as proxy for income)? If yes, does the proposal ensure it won’t be misinterpreted as *causal* (e.g., assuming race causes disease)?  
     - *Sufficient answer*: For proxy uses: data dictionary warnings + training plan for analysts.  
     - *Responsibility*: Proposal author + hospitalist.  
     - *Hard stop*: If proxy misalignment risk and no warnings → **Reject**.  

  6. **COLLECTION METHOD TRANSPARENCY**  
     - *Question*: How is the category recorded? (e.g., self-report, staff observation, algorithm).  
     - *Sufficient answer*: Clear protocol for collection (e.g., "patient self-selects from list").  
     - *Responsibility*: Proposal author.  
     - *Hard stop*: If no protocol → **Reject**.  

  7. **CLINICAL DECISION SAFEGUARD**  
     - *Question*: If used in clinical decision support (CDS), is it recorded as an *act* (what was asked, by whom, when)?  
     - *Sufficient answer*: For CDS fields: mandatory "act" metadata (e.g., "patient stated X on [date]"). Guessed/imputed data must be flagged (e.g., "imputed by model Y").  
     - *Responsibility*: Compliance officer + informatics.  
     - *Hard stop*: If CDS use and no "act" plan → **Reject**.  
     - *Design note*: Prevents silent errors from guesses/imputation.  

  8. **CONFERRAL RISK**  
     - *Question*: Who confers the category (e.g., patient, clinician, algorithm)? Could this lead to misapplication? (e.g., staff assigning race without asking).  
     - *Sufficient answer*: Conferral agent named + misapplication risk assessment (e.g., "patient self-reports, low risk").  
     - *Responsibility*: Nurse manager + patient advocate.  
     - *VALUES handoff*: If high risk (e.g., algorithmic bias), human judgment required on mitigation.  
     - *Hard stop*: If unaddressed high risk → **Reject**.  

  9. **LOOPING EFFECT RISK**  
     - *Question*: Could this category change behavior/treatment in ways that reinforce its label? (e.g., "Hispanic" patients flagged for social work, inflating disparities).  
     - *Sufficient answer*: Looping risk identified (yes/no) + monitoring plan if yes.  
     - *Responsibility*: Hospitalist + patient advocate.  
     - *VALUES handoff*: If high risk, committee votes on acceptability.  
     - *Hard stop*: None (proceeds to Q10).  

  10. **RE-DESCRIPTION ROBUSTNESS**  
      - *Question*: If this field is reused in 5+ years under a new description (e.g., "MENA" used for ancestry research), what breaks?  
      - *Sufficient answer*: Documentation of known re-description risks (e.g., "not valid for genetic studies") in data dictionary.  
      - *Responsibility*: Data architect + proposal author.  
      - *Hard stop*: If unacknowledged high risk (e.g., causal inference from social data) → **Reject**.  

  **Final approval**: If all steps pass, committee chair signs off (no veto without new evidence).  

  ---

  ### **RUN ON PROPOSALS**  
  **(a) Add "Middle Eastern or North African" (MENA) to race/ethnicity**  
  - Q1: **Pass** (problem: community invisibility in disparities reports).  
  - Q2: **Pass** (downstream uses: disparities research, quality metrics).  
  - Q3: **Pass** (export license: "disparities research only"; no clinical/billing use).  
  - Q4: **Pass** (context: self-report at intake; uniform across hospitals).  
  - Q5: **Pass** (proxy for social experience; warning added: "not for biological inferences").  
  - Q6: **Pass** (collection: patient self-report from list).  
  - Q7: **Pass** (not used in CDS; no act required).  
  - Q8: **Pass** (conferral: patient; low misapplication risk).  
  - Q9: **Pass** (looping: possible but low risk; monitor disparities reports).  
  - Q10: **Pass** (re-description risk: if used for ancestry genetics, breaks; add warning).  
  - **Outcome: Approve**.  

  **(b) Auto-populate race from genetic-ancestry panel**  
  - Q1: **Fail** (problem: "staff bad at asking" ≠ valid problem; genetic ancestry ≠ social race, so harms disparities accuracy).  
  - **Outcome: Reject** (no further steps).  
  - *Why hospitalist accepts*: "Ancestry ≠ lived experience. Using it erases disparities and may misguide care (e.g., race-based CDS). Staff training is cheaper than wrong data."  

  **(c) Delete "sex assigned at birth," keep only gender identity**  
  - Q1: **Pass** (problem: patient distress when misused).  
  - Q2: **Fail** (downstream uses: cancer screenings, registries require birth sex for organ-specific risk).  
  - **Outcome: Reject** (hard stop at Q2).  
  - *Why construction isn’t the reason to delete*: The field isn’t noise—it’s a *socially recorded fact* (like birthplace) used for care (e.g., cervical cancer screens). Construction doesn’t negate utility; deletion without replacement harms patients. Keep it but add training to prevent misuse.  

  ---

  ### **HARMONIZATION OF HOSPITALS’ CATEGORIES**  
  - **Procedure outcome**: Do **not harmonize into one master list** if the same label means different things (e.g., "race" collected via self-report at Hospital A vs. staff assignment at Hospital B).  
  - *Why*:  
    - Q4 (context stability) fails: Contexts differ, and forced harmonization misrepresents data.  
    - Q10 (re-description) fails: High risk of misinterpretation in analysis.  
  - **Solution**: Keep both category sets. Map data at analysis time with clear metadata (e.g., "Hospital A: self-report; Hospital B: clinician-observed").  
  - *CIO anger mitigation*: Argue: "Forced harmonization corrupts 10 years of data. Mapping preserves integrity and meets regulatory needs."  

  ---

  ### **WHERE THE PROCEDURE WORKS (AND WHERE IT DOESN’T)**  
  - **Strengths**:  
    - Hard stops prevent theoretical debates (e.g., Q1 forces concrete problems).  
    - Export licenses (Q3) and act recording (Q7) address reuse and guessing/imputation.  
    - Conferral (Q8) and looping (Q9) embed constructionist concerns without jargon.  
  - **Limitations**:  
    - **Misfires if**: Data architect can’t produce Q2 inventory in time (solution: require pre-meeting submissions).  
    - **Values handoffs**: Q8/Q9 require human judgment, but the committee has the right roles (e.g., patient advocate for looping risks).  
    - **Re-description (Q10)**: Only catches known risks; unknown risks require ongoing review.  

  ---

  **Final Output**: A one-page flowchart of this procedure (text-based version above). No jargon, no hedging, no citations. Implement as a checklist.
