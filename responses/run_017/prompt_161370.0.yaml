prompt: |-
  yo, I'm trying to write up the chapter on naturalizing mental content and I keep losing the thread, so I want the spec before I read any more of it. Give me the list of requirements that any naturalistic theory of mental content has to meet to count as adequate — where naturalistic means it has to build content out of materials that aren't themselves intentional or semantic (causation, function, selection history, information, whatever it wants to use), and where adequate means adequate for one specific job: grounding actual content attributions in empirical cognitive science, i.e. being the thing a working scientist could lean on when she says what some mechanism in some organism represents. Not adequate for winning a metaphysics seminar.

  For each requirement I want the case or consideration behind it — the concrete situation a theory that ignored that requirement would get wrong. At minimum grapple with: how a state can be about something and be wrong about it; how content manages to be about the distal thing rather than the proximal stimulation or some gerrymandered disjunction of causes; whether content has to come with correctness conditions at all and where a naturalistic story is supposed to get normativity from; how a creature represents something it has never encountered, and things that don't exist; what to say about a state that tracks something perfectly but that nothing downstream consumes and that nothing ever selected for; and whether content has to make a difference to what the system does or can just sit there doing no work.

  Two wrinkles I basically never see handled, so don't just hand me the standard list:

  1. Systems with no evolutionary history but a training history. Think of a model whose internal units get shaped by repeated rounds of a proxy objective, with a selection-ish filter on top — variants kept when the score improves, thrown away when it doesn't — but no reproduction, no lineage, no consequences for anything that could be called an organism. If a theory of content is going to be usable on those at all, what does it have to say, and what would have to be true of the training setup for one of those units to count as meaning something rather than merely being correlated? Turn that into a requirement.

  2. The reuse case. A mechanism that got whatever function it has from one kind of historical pressure and is now, reliably and usefully, doing something quite different. Does the content follow the old history or the current job? Whatever you think, state the requirement that your answer forces onto the theory — I care more about the requirement than about the verdict.

  Then: mark each requirement as non-negotiable versus a preference of one particular camp. Flag any pair you suspect can't be jointly satisfied, with the case that shows the clash — that's the part I'm most interested in, since if the list is internally inconsistent then that itself is the finding. And tell me which single requirement excludes the most candidate theories, and why it has that much force even though it sounds modest.

  A short scorecard at the end is fine — the two or three live families of approach (covariation/information-based, history-and-function-based, use or role-based), a line or two each on where they crack, no names and no citations, I've got the literature labels. Skip it if you think it'd be a distraction; the requirements and their motivating cases are the thing I actually want.
reasoning: |-
  Okay, the user is working on a chapter about naturalizing mental content and needs a clear set of requirements for any theory to be adequate. They specified that "naturalistic" means building content from non-intentional materials like causation or function, and "adequate" means grounding actual content attributions in cognitive science, not metaphysics. 

  First, I need to address the core issues they mentioned: misrepresentation, distal content, normativity, representation of unencountered/nonexistent things, states that track but aren't consumed or selected for, and causal efficacy. Plus, the two wrinkles: systems without evolutionary history (like trained models) and the reuse case where a mechanism's function changes.

  For misrepresentation, the requirement would be that the theory must allow for states that can be false. The motivating case is a bird mistaking a leaf for a predator—without this, all states would be true by definition. Distal content is tricky; the theory needs to explain why content is about the distal object (like a rabbit) rather than proximal stimuli (retinal patterns). The rabbit detection example illustrates this.

  Normativity: correctness conditions must come from natural facts. The bee dance case shows that without normativity, we can't say the dance is wrong when it misleads. For uninstantiated properties, like a monkey fearing snakes it's never seen, the theory must allow representation beyond direct experience. Nonexistent objects, like a child's imaginary friend, need a different approach since they lack causal history—maybe through constituent structure.

  Tracking without consumption: if a state perfectly correlates but isn't used by the system, it shouldn't have content. The frog's fly-detector firing at BBs is a classic case, but if the system doesn't use it, it's just correlation. Causal efficacy is about content making a difference to behavior, otherwise, it's epiphenomenal.

  Now, the wrinkles. For systems with training history, the requirement is that the theory must account for proxy objectives shaping internal states. The MNIST digit classifier example: for a unit to represent "curvature," it must be shaped by the objective to detect digits, not just correlate. Reuse cases require content to be determined by current systemic role, not history. The primate face recognition example: if neurons now process hands, their content should be about hands, even if evolved for faces.

  Next, categorizing requirements: non-negotiable vs. contested. Misrepresentation, normativity, and proximal/distal are likely non-negotiable because they're core to content. The other two wrinkles and uninstantiated properties might be contested. Conflicts might arise between consumer-based theories (for normativity) and historical theories (for misrepresentation). For example, consumer-based theories might struggle with unencountered entities, while historical ones might not handle reuse cases well.

  The user’s deeper needs: they want a practical framework for cognitive scientists, avoiding metaphysical debates. They’re frustrated with theories that don’t address modern systems like AI. Highlighting conflicts, like between historical and consumer requirements, shows why no current theory is perfect. The most exclusionary requirement is probably normativity because it forces theories to explain correctness without intentional baggage, which many fail to do.

  Need to ensure each requirement has a concrete case. Avoid jargon. Emphasize the two wrinkles since they're underdiscussed. The scorecard should briefly show where each approach fails, helping the user see gaps without getting bogged in literature.
answer: |-
  Here’s a specification of requirements for a naturalistic theory of mental content, grounded in cognitive science practice, with concrete cases, wrinkles addressed, and conflicts flagged. Requirements are distilled to their core demands, with motivating failures.

  ---

  ### **Core Requirements & Motivating Cases**
  1. **Misrepresentation Requirement**  
     *Requirement:* Must explain how a state can *falsely* represent a specific state of affairs.  
     *Motivating Case:* A bird’s predator-detection mechanism fires at a rustling leaf (not a predator). A theory that reduces content to reliable causation (e.g., "whatever causes the state") makes the state *veridical by definition* — it "represents rustling leaves," not "predators." Inadequate for science, which attributes *error* (e.g., "false alarm").  
     *Status:* Non-negotiable.

  2. **Distality Requirement**  
     *Requirement:* Must fix content to *distal* objects/properties (e.g., rabbits), not proximal stimuli (retinal patterns) or disjunctive sets ("rabbits-or-shadows-or-hallucinations").  
     *Motivating Case:* A rabbit-detection neuron fires identically to a rabbit-shaped shadow. Science attributes "rabbit" content (used to predict behavior), not "rabbit-retinal-image" or an unprincipled disjunction. A theory that cannot break causal symmetry fails.  
     *Status:* Non-negotiable.

  3. **Normativity Requirement**  
     *Requirement:* Must ground *correctness conditions* (truth/falsity, satisfaction) in natural facts.  
     *Motivating Case:* A bee’s dance "says" nectar is 200m north. If nectar is *south*, the dance is *incorrect* — even if reliably caused by internal states. Normativity isn’t optional; science uses it to explain maladaptive behavior.  
     *Status:* Non-negotiable. (*Biggest exclusionary force:* Many theories (e.g., simple covariation) fail here, as they lack resources for "should".)

  4. **Uninstantiated/Nonexistent Content Requirement**  
     *Requirement 4a (Uninstantiated):* Must explain representation of types never encountered (e.g., a monkey’s fear of snakes it has never seen).  
     *Motivating Case:* Monkeys raised snake-naive show fear of snakes. Content isn’t built from direct causal history.  
     *Requirement 4b (Nonexistent):* Must handle empty concepts (e.g., a child’s "unicorn").  
     *Motivating Case:* Cognitive science models imagination/pretense without requiring *actual* referents. A purely causal-historical theory fails 4a; a purely covariational theory fails 4b.  
     *Status:* Non-negotiable (but 4b often handled via constituent structure, not primitive content).

  5. **Efficacy Requirement**  
     *Requirement:* Content must make a difference to the system’s behavior (no epiphenomenal "content").  
     *Motivating Case:* A "fly detector" in a frog fires at flies *and* BB pellets, but the frog snaps *only* at flies. If downstream mechanisms discriminate, content isn’t just about the detector’s inputs — it’s constrained by *use*. A theory ignoring consumers allows inert "content."  
     *Status:* Non-negotiable.

  6. **Tracking-Without-Consumption Exclusion Requirement**  
     *Requirement:* A state that reliably tracks X but is *not consumed* by any mechanism for task-relevant processing cannot have content.  
     *Motivating Case:* A "cosmic-ray detector" in a rat’s brain perfectly correlates with solar flares but doesn’t affect any behavior or cognitive process. Science wouldn’t attribute "solar flare" content; it’s merely correlational noise.  
     *Status:* Contested (functionalists may insist on systemic role).

  ---

  ### **Wrinkle 1: Trained Systems (No Evolutionary History)**
  - **Proxy-Objective Shaping Requirement**  
    *Requirement:* For trained systems (e.g., neural nets), content requires that internal states be *systematically shaped by a proxy objective* to play a specific functional role in achieving an outcome.  
    *Motivating Case:* A unit in an MNIST digit classifier activates for "curvature in top-right quadrant." This isn’t content if the unit merely correlates with curvature due to random initialization; it *is* content if the *training process* (gradient descent + loss minimization) *shaped it to detect curvature* for digit classification.  
    *Crucial Test:* If the same correlation arose from accidental weight freezing, no content. *Selection-ish filtering (e.g., reinforcement) is necessary but insufficient; the objective must explain the state’s functional role.*  
    *Status:* Contested (historical theories may reject non-biological cases).

  ---

  ### **Wrinkle 2: Reuse Cases**
  - **Current Systemic Role Requirement**  
    *Requirement:* Content is fixed by the *current functional role* in the system’s cognitive architecture, not historical origin.  
    *Motivating Case:* Primate face-recognition neurons are repurposed (via plasticity) to process hands in a sign-language task. Science attributes "hand" content during signing, not "face" (even if evolution selected them for faces). History-only theories misdescribe the mechanism’s current function.  
    *Status:* Contested (teleosemantic theories reject this).

  ---

  ### **Conflict Zones**
  1. **Normativity vs. Reuse:**  
     - *Conflict:* Normativity often draws on *history* (e.g., "proper function"). But in reuse, history and current role diverge.  
     - *Clash Case:* Repurposed neurons now reliably cause *incorrect* outcomes relative to *original* function (e.g., ancestral sound-localization circuits reused in humans for language, "misrepresenting" sound sources). A historically normative theory calls this "misrepresentation"; a current-role theory may not.  
     - *Resolution?* Content may need dual grounding (historical for normativity, current for specific content).

  2. **Distality vs. Uninstantiated Content:**  
     - *Conflict:* Distality requires causal-informational links to actual instances. Uninstantiated content (e.g., "unicorn") lacks such links.  
     - *Clash Case:* A child’s "dragon" concept (never encountered) must be distal ("fire-breathing beast") but has no causal history.  
     - *Resolution?* May require combinatorial semantics (e.g., "scales" + "fire" + "wings").

  ---

  ### **Scorecard: Major Approaches & Cracks**
  - **Covariation/Information-Based:**  
    *Cracks:* Misrepresentation (everything is "true"), distality (can’t break proximal/distal symmetry), normativity (no "should"), uninstantiated content (no causal link).  
  - **History-and-Function-Based (Teleosemantics):**  
    *Cracks:* Reuse cases (content stuck in past), trained systems (no evolution), uninstantiated content (no selection history).  
  - **Use/Consumer-Based:**  
    *Cracks:* Normativity (needs history for "correctness"), distality (consumers may use proximal inputs), tracking-without-consumption (excluded by definition).

  ---

  ### **Key Findings**
  - **Most Exclusionary Requirement:** **Normativity**. Eliminates theories lacking naturalized "correctness" (e.g., pure covariation, some consumer theories). Even modest demands ("states can be false") force complex machinery.  
  - **Fatal Conflict Triad:** **History (for normativity) vs. Current Role (for reuse) vs. Proxy Objectives (for AI)**. No theory smoothly handles all three.  
  - **Non-Negotiables:** Misrepresentation, Distality, Normativity, Efficacy.  
  - **Contested but Critical:** Proxy-Objective Shaping, Current Systemic Role.  

  This spec reveals why naturalizing content is unstable: cognitive science needs *pragmatic, role-based* content (e.g., for AI/reuse), but *normativity* drags in history. A hybrid theory may be unavoidable. If your chapter exposes this tension, it succeeds.
