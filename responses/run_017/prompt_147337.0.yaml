prompt: |-
  I build infrastructure on top of large models for a living and follow the forecasting debates on the side, with no formal background in philosophy. I would like help drafting the joint statement for an adversarial collaboration between someone who expects a sharp, discontinuous intelligence explosion and someone who expects a long, continuous takeoff diffused through the economy.

  Before they begin, I want them to adopt one distinction I rarely see made cleanly, because I think it removes some of the shouting: separate capability takeoff — the growth of a system's latent capability per unit of effective compute, measured under the best elicitation anyone can find — from realized takeoff — the growth of its measured effects in the world per unit of calendar time. Realized takeoff is capability takeoff minus deployment friction, and I suspect both camps are often describing the same trajectories while reading off different sides of that equation. If the distinction is less useful than I think, say so rather than building the document on it.

  Please produce, naming positions rather than papers and without citations:

  1. "Agreed claims" — a numbered list of about ten claims both parties could sign (~300 words). Keep them substantive rather than platitudes: include what both accept about the decomposition above, about the gap between demonstrated and latent capability, and about how much of the research-and-engineering loop a system would have to be performing itself for its improvement to count as recursive in the relevant sense.

  2. "Disagreements" — a table (~300 words) with columns for the issue, the sharp-takeoff formulation, the continuous-takeoff formulation, and whether the disagreement is substantive or merely verbal. Phrase each formulation so that the side in question would accept it as a statement of its own view.

  3. "Cruxes and pre-registered predictions" — a table (~300 words) giving, for each crux, the argument or measurement both sides accept as bearing on it, and each side's prediction written down in advance. Candidates worth using: whether the gap between best-known scaffolding and default deployment widens with scale; whether the share of the improvement loop performed by systems themselves rises smoothly or jumps; and whether capability growth looks continuous when plotted against effective compute but discontinuous when plotted against calendar time.

  4. "What would move us" — (~150 words) the consideration each party would have to encounter to revise its position, and, separately, where this document's own framing is most likely to be wrong or to make the residual disagreement look tidier than it really is.
reasoning: |-
  Okay, the user works in AI infrastructure and follows forecasting debates without a formal philosophy background. They want to draft a joint statement for an adversarial collaboration between two AI takeoff viewpoints. 

  First, I notice they're introducing a key distinction between capability takeoff (latent potential) and realized takeoff (real-world impact). This seems clever - it might resolve apparent disagreements where one side focuses on raw capability curves while the other emphasizes deployment bottlenecks. The user explicitly asks to discard this framing if it's unhelpful, but I think it holds water.

  For the agreed claims section, I'll need to establish common ground on:
  - Their core distinction (capability vs realized takeoff)
  - The existence of "elicitation gaps" between default and optimized performance
  - What constitutes meaningful recursive self-improvement
  I should avoid platitudes - each point must be substantive enough that signing it actually means something.

  The disagreements table requires careful phrasing. Each position's column must be something they'd genuinely endorse. Key fault lines seem to be:
  - Whether capability gains accelerate discontinuously 
  - Whether systems can rapidly absorb human R&D processes
  - If deployment friction can be bypassed at scale
  I'll flag which disagreements are semantic vs substantive - the verbal ones might collapse under their framing.

  For cruxes and predictions:
  - The scaffolding gap question tests if optimization becomes harder at scale
  - The recursive loop share probes if AI-R&D has an inflection point
  - The plotting discrepancy would reveal if their distinction explains timing disagreements
  Pre-registered predictions are crucial - they prevent hindsight bias.

  Finally, "what would move us" should show intellectual honesty. The sharp-takeoff proponent might concede if we see persistent optimization bottlenecks, while the continuous advocate should budge if AI suddenly masters rapid self-embedding. I'll also note where their framing might oversimplify - perhaps by underestimating how capability spikes could themselves reduce deployment friction.
answer: |-
  Here’s a draft joint statement structured per your specifications, centered on your **capability vs. realized takeoff** distinction:

  ---

  ### **1. Agreed Claims**  
  Both parties endorse these substantive propositions:  
  1. **Capability takeoff** (CT) measures the growth of a system’s *latent* performance per unit of effective compute, under optimal scaffolding (prompting, tools, etc.).  
  2. **Realized takeoff** (RT) measures the growth of *observable real-world effects* per unit calendar time, constrained by deployment friction (hardware, safety, regulation, integration).  
  3. CT ≠ RT: RT lags CT due to non-compute bottlenecks (e.g., human adaptation, capital cycles).  
  4. **Elicitation gaps** exist: Latent capabilities often exceed default performance, requiring novel methods to unlock.  
  5. Scaling compute alone is insufficient for RT; deployment efficiency must also scale.  
  6. Recursive self-improvement (RSI) requires a system to *autonomously* perform >50% of the core R&D cycle (hypothesis → experiment → deployment → feedback).  
  7. RSI could accelerate CT but may not proportionally accelerate RT due to persistent external friction.  
  8. Economic diffusion dilutes RT: Gains spread across sectors at varying speeds.  
  9. CT is best measured in controlled benchmarks; RT in macroeconomic/productivity metrics.  
  10. Disagreements primarily concern *trajectory steepness* of CT and *friction compressibility* in RT.  

  ---

  ### **2. Disagreements**  
  | **Issue**                     | **Sharp-Takeoff Formulation**                              | **Continuous-Takeoff Formulation**                       | **Substantive/Verbal** |  
  |-------------------------------|-------------------------------------------------------------|----------------------------------------------------------|------------------------|  
  | **CT trajectory**             | Capability gains will exhibit discontinuous leaps (e.g., >1000x/year) near critical intelligence thresholds. | Capability gains will follow a smooth log-linear curve, with no “phase transitions” in scaling laws. | Substantive |  
  | **RSI threshold**             | Systems will rapidly achieve full RSI once they surpass human-level research competency, compressing improvement cycles to hours/days. | RSI capability will emerge gradually; human oversight remains essential for >90% of R&D tasks even at superhuman capability. | Substantive |  
  | **Deployment friction**       | Deployment bottlenecks (e.g., chip fab, regulation) will be rapidly automated or bypassed by RSI systems, minimizing the CT→RT gap. | Deployment friction scales with system complexity; economic/legal inertia ensures CT→RT gaps widen with capability. | Substantive |  
  | **“Discontinuity” locus**     | A “fast takeoff” is defined by CT discontinuity when plotted against effective compute. | A “slow takeoff” is defined by RT continuity when plotted against calendar time. | **Verbal** (resolved by distinction) |  

  ---

  ### **3. Cruxes and Pre-Registered Predictions**  
  | **Crux**                                                | **Test**                                                                 | **Sharp-Takeoff Prediction**                             | **Continuous-Takeoff Prediction**                      |  
  |---------------------------------------------------------|--------------------------------------------------------------------------|----------------------------------------------------------|--------------------------------------------------------|  
  | **Scaffolding gap vs. scale**                           | Measure the ratio between default vs. best-elicited performance at each 10x effective compute increase. | Gap narrows (>2x elicitation efficiency gain per 10x compute). | Gap widens (<1.2x efficiency gain per 10x compute). |  
  | **RSI task share**                                      | Track % of core R&D loop automated by AI systems (hypothesis→deployment). | Jumps from <20% to >80% in <6 months post-AGI.           | Increases linearly (∼5%/year post-AGI).                |  
  | **Capability vs. calendar discontinuity**               | Plot benchmark gains against compute (CT) and time (RT).                 | Discontinuous in CT *and* RT (due to friction collapse). | Continuous in CT, discontinuous in RT only if friction dominates. |  

  ---

  ### **4. What Would Move Us**  
  - **Sharp-takeoff advocate:** Would revise if deployment friction *persistently* grows faster than capability (e.g., chip shortages + regulation delay RT by >5 years despite CT spikes).  
  - **Continuous-takeoff advocate:** Would revise if a system achieves >80% RSI task share within 1 year of human-level research competency.  
  - **Framing risks:** This distinction may oversimplify feedback loops (e.g., RT gains could *accelerate* CT via real-world data). The residual disagreement is whether friction is *inherently compressible* (sharp view) or *structurally rigid* (continuous view), which remains deeply empirical.  

  ---  
  **Strengths of this framing:** Resolves verbal disputes about "speed" by decoupling capability curves from deployment timelines. Forces both sides to operationalize "recursive" and specify bottlenecks.  
  **Weaknesses:** Underplays exogenous shocks (e.g., geopolitical events) and assumes CT/RT can be cleanly disentangled in practice. Real-world systems may blur the boundary (e.g., better deployment tools *are* capability gains).
