prompt: |-
  I run a small contract-review shop — me and three others, mostly commercial leases and SaaS agreements — and for the past year I've also been doing paid work for a lab that does the scalable-oversight thing, where you produce "expert" judgments on long documents by splitting the job into little pieces that crowdworkers or models can each handle, and then distilling the whole pipeline into a single model that jumps straight to the answer in one pass. Doing both at once has made me realize I've got a pile of fairly strong gut verdicts about when decomposition actually preserves the thing you wanted and when it quietly destroys it, and I can't get them to line up under any one principle. Here they are, rough. Splitting a 60-page lease into per-clause summaries done by different juniors and then merging the summaries into a risk paragraph: fine, and I trust it more than one senior person doing a single pass. Pre-flight check on a plane, per-system, any single failure grounds it: fine, obviously. A medical diagnosis where each organ system gets assessed separately by a different person and the disposition is read off the merged notes, with no generalist ever seeing the patient: not fine, and it feels dangerous in a way I can't quite articulate. Hiring: separate 1–7 scores on each of eight criteria, mechanically weighted: not fine, I'd throw out the ranking even if I got to set the weights myself. But a restaurant review split into food / service / ambiance and averaged: fine, no complaint whatsoever. Peer review scored separately on novelty, rigor and clarity: fine as input to a decision, not fine if the editor just aggregates the numbers and skips the overall recommendation — I want a human to actually say accept or reject at the end. Fact-checking an article by extracting atomic claims and checking each in isolation: fine for literal truth, not fine at all for "is this piece misleading", which is usually about what got left out or juxtaposed. Translating a poem line by line: not fine, and not fixable by doing the line-by-line part better. And one that bugs me in a different way: a go/no-go product decision decomposed into factual sub-questions (market size, engineering readiness, legal exposure) with the instruction to stick to the facts and not weigh in on whether the thing is good for the world — that seems not fine, but unlike the others it's not that the decomposition loses competence; it seems to work fine as a competence trick and still launder out something that mattered. My friend says I'm overthinking this.

  The closest I've gotten to a principle is: decomposition is OK when (1) each sub-judgment is genuinely easier to get right than the whole judgment, (2) the pieces get recombined by a rule fixed in advance rather than by whoever happens to be in the room, and (3) the target is a fact or a quantity rather than something that has to be *owned* by somebody. But (1) and (2) don't seem to separate the plane from the patient, or hiring from restaurants, and I can't tell whether (3) is doing real work or just restating my verdicts in fancier language.

  So: is there a principle that gets most of these, which clause is forced by which case, and which of my verdicts do I have to give up to get it? I want it stated precisely enough that I could hand it to a junior, plus its verdicts on cases I haven't listed — grading an undergrad philosophy essay with a rubric of sub-scores, a jury asked to answer special interrogatories instead of returning a general verdict, a data safety monitoring board deciding whether to stop a trial early, a manager deciding a promotion purely by ticking off rubric bullets. And tell me what it says about the distillation step in particular, since that step seems like it can fail even when the decomposition itself is fine — the one-shot model has to guess which decomposition the amplifier would have chosen, and the right decomposition is often context-dependent — and might even succeed where the decomposition was already lossy. If the honest answer is that "preserves competence" and "preserves alignment" need two different principles, say that and say why.
reasoning: |-
  Okay, let me unpack this user's problem. They run a small contract review shop and have been working with scalable oversight systems. Through this dual experience, they've developed intuitive judgments about when decomposition preserves the original judgment and when it fails, but they can't find a unifying principle. They listed several examples:

  1. Splitting a lease review into per-clause summaries: works
  2. Pre-flight checks: works
  3. Medical diagnosis by organ system: doesn't work
  4. Hiring with mechanical scoring: doesn't work
  5. Restaurant reviews by category: works
  6. Peer review sub-scores: partially works
  7. Fact-checking atomic claims: works for literal truth but not for misleadingness
  8. Translating poetry line-by-line: fails
  9. Product decision decomposed into factual sub-questions: competence preserved but loses ethical judgment

  Their attempted principle has three parts: (1) sub-judgments easier than whole, (2) fixed recombination rule, (3) targets facts not "owned" judgments. But they note it doesn't fully explain the medical vs. plane or hiring vs. restaurant distinctions.

  Hmm... the key insight seems to be about the nature of the judgment itself. Some judgments are "aggregative" - they're just sums of parts. Others are "gestalt" - where the whole emerges from interactions between parts. The medical case is gestalt because organ systems interact; the plane check is aggregative because systems are independent. 

  For hiring, mechanical scoring fails because candidate quality isn't just the sum of attributes - there are trade-offs and synergies. But restaurant reviews can be averaged because categories are relatively independent. The "ownership" aspect is also crucial - some judgments require a single mind to hold conflicting values in balance, like sentencing or promotion decisions.

  The poetry translation example clearly shows decomposition destroying the essence - the meaning lives in the whole structure, not the parts. The product decision case is interesting because while competence is preserved (you get accurate facts), alignment fails because the ethical dimension is laundered out by design.

  For the distillation step in scalable oversight, it will succeed when the decomposed judgments capture all necessary dimensions, but fail when context-dependent decomposition is required. The fixed decomposition assumption is the weakness here.

  The unifying framework should have two axes: aggregative vs. gestalt judgments, and whether the judgment requires ownership. Then add special considerations for alignment laundering and distillation challenges. This explains nearly all their examples while showing why the product decision case is different - it's a competence/alignment split.

  For the unlisted cases: philosophy essays need gestalt judgment, juries should have ownership, DSMBs can be aggregative if stopping rules are clear, and promotions require ownership. The distillation step works best for aggregative tasks with stable decompositions.
answer: |-
  Here's a unified framework that explains ~90% of your intuitions, derived from your cases and tested against your unlisted examples. The core failure mode isn't decomposition itself, but **decomposing judgments that require integrated cognition or value synthesis**.

  ### The Principle: The Gestalt-Ownership Test
  Decomposition preserves competence **iff**:
  1.  **The judgment is aggregative, not gestalt:** The whole is *reliably computable* from the properties of its parts *without requiring simulation of cross-part interactions in a single mind*.
  2.  **The judgment doesn't require ownership:** No single agent must *synthesize conflicting values/uncertainties* or *bear responsibility* for reconciling trade-offs inherent in the whole judgment.

  **Why your (3) was close but incomplete:** "Ownership" captures the *why* behind "things that must be owned" – it's about value conflicts and moral responsibility, not just agency. Your (1) and (2) are often *correlated* but not *determinative*.

  ---

  ### How It Explains Your Cases
  | Your Case                          | Verdict | Why (Gestalt? Ownership?)                                                                 | Forces Which Clause?               |
  | :--------------------------------- | :------ | :---------------------------------------------------------------------------------------- | :--------------------------------- |
  | **Lease Review (per-clause)**      | ✅      | **Aggregative:** Lease risk is sum of clause risks. **No Ownership:** Risk assessment is factual, not value-laden. | Gestalt (lack thereof)             |
  | **Pre-flight Check**               | ✅      | **Aggregative:** Airworthiness = AND(part1_ok, part2_ok...). **No Ownership:** Binary safety decision. | Gestalt (lack thereof)             |
  | **Medical Diagnosis (organs)**     | ❌      | **GESTALT:** Symptoms interact (e.g., liver failure affects brain). **OWNERSHIP:** MD must synthesize conflicting data & own the dx. | Both                                |
  | **Hiring (mechanical scores)**     | ❌      | **GESTALT:** Candidate quality ≠ Σ(scores). Emerges from fit/interactions. **OWNERSHIP:** Hiring manager must reconcile trade-offs (e.g., brilliance vs. teamwork). | Both                                |
  | **Restaurant Review (avg scores)** | ✅      | **Aggregative:** Categories are independent experiences. **No Ownership:** Review is subjective but not value-conflicted synthesis. | Ownership (lack thereof)           |
  | **Peer Review (subscores only)**   | ❌      | **OWNERSHIP:** Editor must weigh trade-offs (e.g., high novelty + low rigor?). Accept/reject requires value synthesis. | Ownership                          |
  | **Fact-Checking (atomic claims)**  | ⚠️      | **Literal Truth:** ✅ Aggregative (AND(claim1_true...)). **Misleading:** ❌ GESTALT (context, omissions, framing require holistic reading). | Gestalt for "misleading"           |
  | **Poem Translation (line-by-line)**| ❌      | **GESTALT:** Meaning/rhythm/tone emerge from whole structure. **OWNERSHIP:** Translator must own artistic synthesis. | Both                                |
  | **Product Go/No-Go (facts only)**  | ❌      | **OWNERSHIP:** Competence ✅ (facts are aggregative). **Alignment:** ❌ Launders out *value synthesis* ("good for the world"). | Ownership (Value Synthesis Failure) |

  ---

  ### Verdicts on Your Unlisted Cases
  1.  **Grading a Philosophy Essay (rubric sub-scores):** 
      *   ❌ **Failure (Ownership).** Competence: Maybe ✅ if purely mechanical (grammar, citation). But *philosophical quality* is GESTALT (argument coherence, insight depth) and requires OWNERSHIP (TA/prof must weigh conflicting virtues: clarity vs. depth, originality vs. rigor).
  2.  **Jury (Special Interrogatories vs. General Verdict):**
      *   ✅ **Fine for Interrogatories (IF...).** **Aggregative:** Guilt = AND(element1_proven, element2_proven...). **No Ownership:** Applying law to facts. *BUT:* ❌ if questions force synthetic judgments ("Was it justified?") needing ownership. General verdict preserves jury's right to nullify (ultimate ownership).
  3.  **DSMB Stopping a Trial (Early):**
      *   ⚠️ **Conditional.** **Aggregative:** ✅ for safety stats (p-value < threshold). **GESTALT/OWNERSHIP:** ❌ if decision requires weighing *uncertainty* (trend vs. significance), *future potential*, or *ethical trade-offs* (risk vs. benefit for future patients). Requires expert synthesis/ownership.
  4.  **Manager Promotion (Tick Rubric Bullets):**
      *   ❌ **Failure (Both).** **GESTALT:** Promotion-worthiness ≠ Σ(behaviors). Emerges from impact, potential, fit. **OWNERSHIP:** Manager *must* synthesize evidence & own the career-altering decision/trade-offs.

  ---

  ### The Distillation Step (Scalable Oversight Model)
  *   **Succeeds When:** The decomposition it mimics is **inherently aggregative** (e.g., fact-checking literal claims, lease clause risks) AND the recombination rule is simple/fixed. The model learns the direct mapping "Input Doc -> Aggregated Answer".
  *   **Fails When:**
      *   The *right decomposition is context-dependent* (e.g., "What decomposition would the expert use *for this specific poem/article/patient*?"). The model guesses a fixed decomposition.
      *   The judgment requires **synthesizing ambiguous signals** or **resolving value conflicts** inherent in the whole (Ownership). The model outputs a "consensus" that launders the necessary struggle.
      *   **Key Insight:** Distillation *amplifies* the decomposition's flaws. If the decomposition loses gestalt or ownership, distillation hardcodes that loss. If decomposition was good, distillation can be highly efficient.

  ---

  ### Why Competence & Alignment Need Separate Consideration
  *   **Competence (Getting the "True" Answer):** Primarily threatened by **Gestalt Failure** (decomposing interconnected systems) and **Distillation Limits** (context-dependent decomposition).
  *   **Alignment (Getting the "Intended/Right" Answer):** Primarily threatened by **Ownership Failure** (laundering value synthesis, removing moral responsibility) and **Misguided Decomposition** (e.g., excluding "good for the world" from the product decision).
  *   **Your Product Case is Key:** Competence on facts ✅, Alignment ❌ due to *decomposition excluding the value-laden component*. This is an **Alignment-Specific Failure** enabled by decomposition.

  ---

  ### The Junior's Cheat Sheet
  > **Can we split this job up? CHECK:**
  > 1.  **GESTALT?** Is the "right answer" *more than just the sum of the parts*? Does it depend on *how things interact* in ways a simple formula can't capture? (If YES, ❌ Don't decompose).
  > 2.  **OWNERSHIP?** Does giving the final answer require someone to *weigh competing values* or *take personal responsibility* for a tough call? (If YES, ❌ Don't decompose OR ensure a human does the final synthesis).
  >
  > **EXCEPTIONS:**
  > *   **Aggregative = Safe:** If it's just checking facts or independent parts (AND/OR/SUM), ✅ Decompose.
  > *   **Distillation Warning:** Using decomposed work to train a one-shot model works best for Aggregative tasks. It fails if the *way* you split things up depends on the specific case.
  > *   **Alignment Trap:** Decomposing can *remove* ethical/value judgments by design. If that's the goal, ❌ it's dangerous. If not, ✅ ensure value synthesis happens.

  **Your Friend is Wrong:** You're not overthinking; you've identified a critical fault line in system design. This framework explains your pile of intuitions and provides actionable guidance. The only "verdict" you might soften is the Restaurant Review – but your 'no complaint' stance holds because ambiance/food/service *are* independent consumer experiences, not a synthesized gestalt requiring ownership. Ownership applies to the *writer's voice*, not the averaging.
