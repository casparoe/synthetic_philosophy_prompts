  - Each team creates an observation report for each of their own twins (so two reports per team). These are sealed or given to the instructor. Then the instructor gives one report (from one twin) to another team and asks: "Was this report produced by the original or the shifted twin of the reporter team?" But again, the receiver doesn't know the reporter's setup.

  This is messy. Let's simplify.

  We want the teams to see if they can discriminate between the two twins of their own setup. So we don't need to exchange between teams. Instead, we can have each team work on their own and then compare results.

  But then we lose the comparison across teams.

  Alternatively, we can have the teams generate a report from one of their own twins and then try to guess which twin it came from. But they know their own setup and the two models, so they can always generate a report that allows discrimination if possible. But we want them to see that for some setups, the reports from the two twins are the same, so they cannot discriminate.

  So activity:

  1. Each team has their setup: paper grid, two transparencies (original and shifted).

  2. The team chooses one of the two transparencies (without telling which) and places it on the paper. Then they generate an observation report from that model. They write it down.

  3. They then show the report to themselves and try to decide which twin it came from. But they know what both twins look like, so they can compare. But that might be too easy.

  Alternatively, we can have them exchange reports with another team. But then the other team doesn't have the same setup.

  Perhaps we can have the teams of the same type exchange. But then they all have the same setup. Or we can have the instructor collect a report from a team and then give it to the same team and ask them to identify which twin it came from. But they know because they just generated it.

  This is not working.

  New idea:

  - Each team has their two twins (original and shifted transparencies). 
  - The team designates a describer who looks at one of the twins (chosen randomly by the instructor) and describes it to the rest of the team by reading out observation reports. The rest of the team (who cannot see the model) must decide whether it is the original or shifted.

  But in a small space, it might be hard to hide.

  Given the time and space, perhaps we have the teams generate the two sets of observation reports for their two twins. Then we give them a report (from one of the twins) and ask them to say which twin it is from. But they can just compare to the two reports they have.

  But they might not have written down both reports. So we can have them generate the report for one twin and then try to see if it matches the original or shifted.

  But it's contrived.

  Let's change the activity slightly:

  - Each team generates a set of observation reports for both of their twins. They then compare the two sets. For some teams, the two sets are identical (Teams A and B). For Team C, they are different. Then in the class discussion, we see which teams had different reports and which had the same.

  This is simpler. Then we don't need the exchange.

  So:

  1. Teams work on their setups and create two observation reports: one for the original and one for the shifted twin.

  2. They then compare the two reports. They should find:
     - Team A: empty hole. They might have no events in the hole, so both reports are the same (only outside events, which are the same).
     - Team B: matter in the hole, no fixed background. The reports are the same because the meetings and readings are the same.
     - Team C: matter in the hole with fixed background. The reports are different because the meetings with fixed markers are at different markers or times.

  3. Then we discuss as a class.

  This will work.

  **Materials list (cheap):**

  For each team (assume 4 teams: 2 of type A, 2 of type B, 2 of type C? Or one of each if small class. We can have multiple teams of each type to ensure we have data.):

  - A large sheet of paper (A3 or poster board) with a 1-inch grid drawn in black. Mark a boundary region (say, 2 inches wide) around the edges. The hole is a circle in the center (diameter about 8 inches). For type C, add fixed markers: small red dots at several grid points inside and outside the hole (e.g., at (3,3), (3,5), (5,3), (5,5) and a few outside).

  - Two transparency sheets (overhead projector transparencies).

  - Dry-erase markers (multiple colors).

  - Tape or clips to fix the transparency to the paper at the boundary (so it doesn't move).

  - A way to define the hole on the transparency: they can trace the hole boundary from the paper.

  - For type A: no drawing in the hole on the transparency. But they might have worldlines that enter the hole? Or not. To keep it simple, they have no events in the hole.

  - For type B and C: on the transparency, draw two worldlines that cross in the hole. Also, on the transparency, draw a clock for each particle? Or just use a parameter along the worldline as time. They can label events on the worldline with times.

    How to do it simply: 
    - Draw two straight worldlines that cross at a point in the hole. Label events on the worldlines with times (e.g., on particle A: event at time 1, 2, 3, ...; similarly for B). The meeting event is at time 5 for A and 5 for B.

  - For the shifted twin: they take a blank transparency, place it over the original transparency, and trace the outside boundary exactly. Then inside the hole, they shift the drawing by a fixed vector (e.g., 2 grid cells to the right and 1 up). So they redraw the worldlines shifted, and the meeting event is moved. The times along the worldlines are the same.

  - For type C, the fixed markers are on the paper, so they are not shifted. In the report, for type C, they report meetings with fixed markers. For example, "Particle A passed fixed marker S at time 3".

  **Observation report for a twin:**

  - For type A: only report events outside the hole. Since the hole is empty and the boundary is fixed, both twins have the same outside events. So the report might be: "Particle C (outside) passed point (1,1) at time 2", etc. But we should have at least one particle outside to report.
    To save time, we can have pre-drawn outside events. Or we can have no particles at all in type A? Then the report is empty? That's not good. So let's have one particle outside the hole, not entering the hole. Then they report its meetings with outside fixed markers (if type C) or just its clock readings at fixed times? But without fixed markers, what can they report? They can report meetings with other particles, but we have only one particle.

    So for type A, we can have two particles outside that meet at a point outside. Then both twins are the same.

  - For type B: report the meeting of the two particles in the hole: "Particle A and particle B met at an event. At that event, particle A's clock read 5 and particle B's clock read 5."

  - For type C: report the meeting of the two particles and also meetings of particles with fixed markers. For example, "Particle A passed fixed marker S at time 3", "Particle A and particle B met at an event (and the clocks read 5 and 5)", etc.

  **Pen-and-paper fallback (if transparencies are not available):**

  - Use two sheets of tracing paper instead of transparencies. Or even two copies of the paper grid, but then the manifold is duplicated? Not good.

  - Alternatively, do it with two layers: the paper grid and then a plastic sleeve that they can draw on with dry-erase. But if no transparencies, we can use graph paper and then for the twin, they draw on a separate sheet the shifted fields.

    They can have two drawings: one for the original and one for the shifted. Then for the report, they can generate from each drawing.

  **Roles in a team (4 students per team if 16 students; adjust):**

  - Facilitator: keeps time and makes sure the steps are followed.
  - Artist: draws on the transparencies.
  - Reporter: generates the observation reports.
  - Checker: verifies that the boundary condition is met (outside the hole, the fields are the same in both twins) and that the shift is only inside.

  **Timeline (75 minutes):**

  0-5 min: Introduction. "Today we are going to explore how we specify events in spacetime and what determines what happens. You will work in teams to create two slightly different models of a spacetime region and then see if you can tell them apart by observations." Do not use technical terms.

  5-20 min: Setup. Hand out materials. Teams draw the original setup on one transparency. They must fix the boundary: outside the hole, the fields are fixed. They draw the worldlines and events. For type C, the fixed markers are on the paper.

  20-30 min: Create the shifted twin. They take a blank transparency and trace the outside. Then inside the hole, they shift the drawing by the prescribed vector.

  30-40 min: Generate observation reports. For each twin, they write down a list of observations (coincidences). The Facilitator ensures they only include coincidences (meetings, readings at meetings).

  40-50 min: Compare the two reports for their own twins. They see if the reports are identical or different. They record their findings.

  50-60 min: Class discussion. Each team reports: could they discriminate between the two twins by the reports? (i.e., were the reports different?) We collect results on the board:

  Team A1: same reports
  Team A2: same reports
  Team B1: same reports
  Team B2: same reports
  Team C1: different reports
  Team C2: different reports

  Then we see the pattern: only teams with fixed background markers could discriminate.

  60-75 min: Debrief and reveal.

  **Debrief and reveal:**

  "In this activity, we explored what happens when we change the assignment of events to points in a region (the hole) while keeping everything fixed on the boundary. We found that for some setups, the two models produced the same observations, while for others, they did not. The key difference was the presence of fixed background markers — structures that are not part of the dynamical fields. 

  In general relativity, there are no such fixed background structures. The metric and matter fields are the only things that define the geometry and the physics. Therefore, two models that are related by a shift inside a hole (while fixed on the boundary) are empirically indistinguishable. This is the core of what is known as the 'hole argument'. 

  But then, are the two models really two different physical worlds? Or do they represent the same physical reality, just with a different labeling of the points? This is the principle of Leibniz equivalence: if two models have the same observable coincidences, they represent the same physical world. 

  However, if we take the points of the manifold to have an identity independent of the fields, then the shift seems to give a different world. This leads to an apparent indeterminism: the equations of GR allow multiple futures for the hole region even given the same boundary conditions. The resolution is to accept that the points of the manifold do not have independent identities; they are only defined by the fields. So the two models are just two descriptions of the same physical situation."

  Then, map the activity to the argument:
  - The paper grid: the manifold (the set of points).
  - The transparency: the metric and matter fields.
  - The shift: a reassignment of the fields to the manifold points inside the hole.
  - The boundary condition: the fields are fixed outside the hole.
  - The observation reports: coincidences of events (which are preserved under the shift if there is no fixed background).

  **Handling the worry about the fabric model:**

  In our chosen model (paper and transparency), there is no stretching. The shift is a reassignment of fields to points without changing the fields themselves. This avoids the problem of changing distances. The metric is represented by the fields on the transparency, and when we shift, we move the entire field configuration to new points. So the geometry is preserved; only the point of application changes. This is faithful to the hole argument.

  **What will go wrong:**

  - Someone will say it's only a change of coordinates: This is likely. We can address it in the debrief: "In this activity, we shifted the fields relative to the manifold grid. This is not a change of coordinates; it is a change in which field values are assigned to which points. A change of coordinates would be relabeling the points without changing the fields. Here, the labels (coordinates) are fixed on the paper, and we changed the fields."

  - Someone will stretch the hoop: But we are not using fabric. If using transparency, they might shift it outside the hole. The Checker role is to police the boundary.

  - Other issues:
    - The shifted worldline might not be continuous: We must design the worldlines to be straight or smooth and the shift vector to be constant. Then the shifted worldline will be continuous because we only shift inside the hole, and at the boundary, the field is fixed.
    - Students might report manifold coordinates: The instructions must be clear: only coincidences and readings, not coordinates.
    - Time-consuming to draw: Pre-draw the outside worldlines for all teams. Inside the hole, for type B and C, they only have to draw two worldlines and the meeting event.

  **Confidence and least sure step:**

  - Confidence: 80% that the session produces the target confusion. The physical model with paper and transparency is clear, and the comparison across teams will show the role of fixed background.

  - Least sure step: The generation of observation reports and the comparison. Students might not understand what counts as an observable coincidence. They might include the manifold coordinates in the report. To mitigate, give very clear instructions and examples.

  **Rejected alternatives:**

  - Fabric with stretching: Rejected because the stretching changes the metric (distances) which is not what happens in the hole argument (where the metric is dragged without change). The transparency model avoids this by shifting without distortion.

  - Role-play with students: Rejected because it is too abstract and difficult to manage in a tiered room with narrow ledges. Also, it might not convey the spacetime structure as clearly.

  **Final design:**

  We run the paper and transparency model with three team types, as described.
