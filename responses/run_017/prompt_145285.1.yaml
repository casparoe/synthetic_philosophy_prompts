     - The facilitator draws the state (A or B) randomly and then for each player, draws their private signal (with 60% accuracy). 
     - We record the sequence of public moves (and note hidden moves separately).

  3. Round 2 (same players, new state, new signals, tokens reset to 2): same procedure.

  4. After both rounds, reveal the true state for each round.

  5. Group betting: 
     - Write the public record of Round 1 on the board (e.g., [A, A, B, A, ...]). Ask everyone to write down their confidence (0-10) that the true state was A (or B, depending on what it was). Then reveal the true state and note the error.
     - Do the same for Round 2.

  6. Debrief: as above.

  We hope this works!
