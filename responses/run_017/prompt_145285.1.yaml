  ### Sturdy Herding Session Design  
  Here’s a streamlined, experiential setup optimized for your constraints (90 mins, no tech, 20 people, avoids prior-knowledge pitfalls). It focuses on **informational** vs. **reputational herding**, a **buy-in mechanic**, and **post-reveal betting** to highlight epistemic blind spots.  

  ---

  ### **Session Structure**  
  **Total Time:** 75 mins (15 mins setup/debrief buffer).  
  **Key Twist:** Run **two identical-seeming rounds** with hidden payoff differences. Mask the herding concept until the debrief (call it "The Signal Game").  

  ---

  #### **Phase 1: Setup (5 mins)**  
  - **Framing:** *"We’re simulating how groups make decisions under uncertainty. You’ll see private clues, then publicly guess ‘Blue’ or ‘Green.’ Your goal: maximize points. I won’t explain *why* the rules are what they are—treat this like a puzzle."*  
  - **Roles:**  
    - **15 Players:** In sequence (mostly programmers/grad students).  
    - **3 Observers:** Participants who know herding (give them clipboards). *Their role: Track the public guess sequence + note when they’d bet real money on the outcome. No private signals.*  
    - **2 Helpers:** Distribute materials (you focus on facilitation).  
  - **Materials:**  
    - Envelopes with private signals (colored chips: 60% accurate, e.g., true state is Blue, 60% of signals are Blue).  
    - Tokens (2 per player per round).  
    - Public guess board (whiteboard).  

  ---

  #### **Phase 2: Round 1 — Informational Herding (20 mins)**  
  **Payoff:** *Only* for being **correct** (1 point per correct guess).  
  - **Mechanics:**  
    1. **True State:** Randomly draw True State (Blue/Green), hidden from all.  
    2. **Private Signal:** Each player gets 1 envelope with a signal (e.g., Blue chip).  
    3. **Buy-In Options (Before Guessing):**  
       - Spend 1 token for a **second private signal** (two independent 60%-accurate signals).  
       - Spend 1 token to **hide your guess** (your guess isn’t added to the public board).  
    4. **Public Guess:** Player states "Blue" or "Green" aloud; if not hidden, added to the board.  
    5. **Repeat:** Players 2–15 see the public board before guessing.  
  - **Incentive Design:**  
    - No penalty for disagreeing with others.  
    - Tokens unused = 0 value (force trade-offs).  
  - **Observer Task:** Record the public sequence and their confidence (1–10) at each step.  

  ---

  #### **Phase 3: Round 2 — Reputational Herding (20 mins)**  
  **Payoff:** Points for **correctness** (1 pt) **+ conformity** (0.5 pts if match majority of *previous 3 public guesses*).  
  - **Identical Setup:** Same true state draw, signal distribution, and buy-in options.  
    - *Crucially, don’t reveal the payoff change.* Only say: "Rules are the same as Round 1."  
  - **Conformity Bonus:**  
    - If <3 prior public guesses, no bonus/penalty.  
    - If ≥3, bonus only for matching the *majority* of the last 3 visible guesses.  
    - *(e.g., Public sequence: [B, B, G]. Majority = B. Guessing B: +0.5. Guessing G: 0 bonus.)*  

  ---

  #### **Phase 4: Reveal & Group Betting (15 mins)**  
  1. **Reveal True States** for both rounds.  
  2. **Betting Game:**  
     - Show *only* the public sequences from both rounds (e.g., "Round 1: B, B, B, B… / Round 2: G, G, G, G…").  
     - Group bets tokens: "Given *only* this sequence, how confident are you the cascade was *correct*? Distribute 10 tokens across the two rounds."  
     - *Reveal:* One cascade was correct, one was wrong (even if sequences look identical).  

  ---

  #### **Phase 5: Debrief (15 mins)**  
  **Map the Experience to Concepts:**  
  | **Moment in Session**      | **Concept Demonstrated**                                                                 | **Limitation** |  
  |----------------------------|------------------------------------------------------------------------------------------|----------------|  
  | Round 1 cascade            | **Informational herding:** Copying is locally rational (ignoring weak private signals). | Assumes independent signals; real signals often correlated. |  
  | Round 2 cascade            | **Reputational herding:** Conformity bonus makes copying *even when private signal is strong*. | Real reputation is multi-dimensional; payoff is simplified. |  
  | Hiding guesses (buy-in)    | **Public good problem:** Individuals underinvest in public info (no personal incentive to reveal). | Doesn’t break math—*enhances* the effect. Hiding reduces cascade starts. |  
  | Group betting post-reveal  | **Unrecognized information loss:** Cascades look identical regardless of accuracy. | In reality, groups often *rationalize* cascades retroactively. |  
  | Observers tracking sequences | **Outsider view:** Even experts can’t distinguish correct/wrong cascades from public data alone. | Observers lack insider context (e.g., pressure to conform). |  

  **Epistemic Honesty:**  
  - **Settled (from setup):**  
    - Cascades emerge rationally under these conditions.  
    - Public info becomes uninformative post-cascade.  
    - Individuals can be right while the group is wrong.  
  - **Contested (real-world):**  
    - **% Informational vs. reputational herding:** Unknown. Evidence mixes both (e.g., financial bubbles = info + reputational).  
    - **"Rational" framing:** Labs show people herd *more* than Bayesians predict (e.g., Çelen & Kariv, 2004)—but is it bias or miscalibration?  
    - **Generalizability to science/markets:**  
      - *Science:* Replication crises involve correlated signals (labs mimic methods) + reputational payoffs (citation incentives).  
      - *Markets:* Payoffs depend on others’ actions (Keynes’ beauty contest), not fixed truths.  
      - *Consensus:* Herding models *inform* these domains but don’t fully explain them.  

  **Wrinkles That Work:**  
  1. **Two identical rounds w/ hidden payoff differences:** ✓ *Essential.* Lets people *feel* the shift from "copying as inference" to "copying as social survival."  
  2. **Buy-in mechanic:** ✓ *Real work.* Hiding guesses reduces cascade starts (simulates public good underprovision). Buying signals aids accuracy but rarely stops cascades.  
  3. **Observer role:** ✓ *Engages experts* without disrupting gameplay.  

  **Predictable Failure Points (and Fixes):**  
  - **Problem:** Prior-knowledge players "meta-gaming" (e.g., forcing cascades to "demonstrate" concepts).  
    - *Fix:* Assign them as **Observers**—they can’t influence the game.  
  - **Problem:** Players over-optimizing tokens (e.g., always buying signals).  
    - *Fix:* Use **helper whispers** to clarify rules *individually* during play. No group Q&A.  
  - **Problem:** Reputational round feels artificial ("Why would I care about matching?").  
    - *Fix:* In debrief, link to real incentives (e.g., job promotions, grant approvals).  
  - **Problem:** Group betting fails if cascades didn’t form.  
    - *Fix:* Stack early signals to trigger cascades (e.g., first 3 players get misleading signals).  

  ---

  ### **Why This Works**  
  - **Low contrivance:** Payoff differences are hidden; social pressure in Round 2 feels organic.  
  - **Buy-in mechanic:** Tokens force trade-offs. Hiding guesses *amplifies* the public good problem (e.g., 0-hide rounds produce longer cascades).  
  - **Debrief precision:** Separates mechanics (settled) from real-world messiness (contested).  

  Run this as a "mystery game," and the cascade moment will click when they see both rounds side by side. Adjust token costs if needed (e.g., 1 token for hide, 2 for extra signal).
