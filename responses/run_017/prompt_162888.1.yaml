prompt: |-
  I teach an undergraduate seminar on social epistemology: 18 students, one 75-minute session, with no reading assigned for that day. I want them to feel the difference between two ways a group can end up confident and wrong: one where the contrary evidence simply never reaches you (omission or exclusion), and one where it does reach you but the group has arranged things so that you don't trust the people who bring it — so that supplying the missing evidence fixes nothing. Design an in-class activity that produces both effects in the room without either one being named until afterward.

  Constraints. Keep the subject matter fictional and nonpolitical — a made-up municipal or campus controversy of your choosing — so students don't bring prior commitments with them; I'll supply whatever the true answer is. Use small real stakes (chocolate, or points on a low-value quiz), not hypothetical payoffs. At least one condition should collapse in the expected way once the students are exposed to what they were missing, and at least one should resist that exposure. I also want a third moment that complicates the lesson: students should hit a case where the group's refusal to trust an outsider tracks a genuine difference in the reliability of sources, so the session cannot end with the takeaway that trusting your own people is always irrational.

  Give me the rules, the materials, any roles, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the mechanisms at work. Be committed: pick the controversy, the payoff scheme, and the exact wording of whatever device discredits the outside sources, and say why you chose each. Then tell me what will predictably go wrong the first time I run this and how to handle it, and be frank about which feature of the distinction the activity cannot stage, so that I know what I have to say myself.
reasoning: |-
  We are designing an in-class activity for a social epistemology seminar. The goal is to illustrate two ways a group can be confident and wrong:
  1. Omission/Exclusion: The group never receives contrary evidence.
  2. Distrust: The group receives contrary evidence but doesn't trust the source.

  We also want a third moment where the group's distrust of an outsider is justified because of a genuine difference in reliability.

  Constraints:
  - Fictional, nonpolitical controversy (municipal or campus).
  - Small real stakes (e.g., chocolate or quiz points).
  - One condition should collapse when exposed to missing evidence (omission case), and one should resist (distrust case).
  - Third moment: justified distrust.

  Activity Design:

  **Controversy:** A campus controversy about the cause of a mysterious noise disturbance in the library. The library has been experiencing a low humming noise that is disrupting students. There are two competing explanations:
  - Explanation A: The noise is caused by a faulty HVAC system.
  - Explanation B: The noise is caused by construction equipment from a nearby building site.

  The true answer (to be supplied by the instructor) is that it's the HVAC system (Explanation A).

  **Structure:** 
  We will have two groups (Group X and Group Y) and one outsider (the Librarian). The class will be divided into two groups (9 students each). Each group will be given evidence that supports one explanation. However, the evidence is incomplete. Then, we introduce an outsider (the Librarian, played by the instructor or a TA) who has the missing evidence. But for one group, the Librarian is introduced with a device that discredits them, and for the other, without that device.

  **Roles:**
  - Group X: They will be the "omission" group. They don't get the full evidence until the Librarian comes in without any discrediting.
  - Group Y: They will be the "distrust" group. They get the same initial evidence as Group X, but when the Librarian comes in, they are discredited by a prior note from a trusted authority.
  - The Librarian: The person who has the missing evidence. They will present the same evidence to both groups, but the context of their introduction will differ.

  **Materials:**
  1. Handouts for each group with initial evidence (different for each group, but both incomplete).
  2. A note from the "Campus Facilities Authority" (CFA) for Group Y that discredits the Librarian. The note might say: "The Librarian has been known to spread unverified rumors about campus facilities. Please verify any information they provide with the CFA."
  3. The missing evidence: a report from the HVAC technician that confirms the noise is from the HVAC system (for the true answer).

  **Payoff Scheme:** 
  Each group will make a decision about the cause of the noise. If their group's decision is correct, each member gets a piece of chocolate (or a point on a low-value quiz). The decision will be made by group consensus.

  **Timeline (75 minutes):**

  1. **Introduction (5 minutes):** 
     - Explain the controversy: "The library has been experiencing a humming noise. We have two possible explanations: HVAC system (A) or construction equipment (B). Your task is to figure out which one it is. There are stakes: if your group is correct, you each get a chocolate/point."
     - Divide the class into two groups (Group X and Group Y). They will be in separate parts of the room.

  2. **Initial Group Work (15 minutes):**
     - Give each group their initial evidence handout.
       - **Group X (Omission group):** 
         - Evidence: 
           - A student survey: 8 out of 10 students report the noise is louder near the HVAC vents.
           - A note from a janitor: "I've noticed the noise gets worse when the HVAC is running at full capacity."
           - *Missing:* The report from the HVAC technician (which they will get later from the Librarian).
       - **Group Y (Distrust group):** 
         - Evidence: 
           - The same student survey: 8 out of 10 students report the noise is louder near the HVAC vents.
           - The same note from the janitor.
           - *Additionally, they get a note from the CFA:* "Important: The Librarian has been known to spread unverified rumors about campus facilities. Please verify any information they provide with the CFA. Signed, Campus Facilities Authority."
           - *Missing:* The same HVAC technician report.
     - Each group discusses and forms an initial consensus. They should write down their group's explanation and confidence level (e.g., on a scale of 1-10).

  3. **First Intervention: The Librarian Arrives (15 minutes):**
     - The Librarian (instructor) visits each group separately, carrying the missing evidence (the HVAC technician report that confirms Explanation A). The report says: "After inspection, we found that the noise is caused by a malfunctioning bearing in the HVAC fan. It is not related to the construction."
     - **For Group X (Omission):** 
       - The Librarian says: "Hello, I'm the Librarian. I found this report that might help you. It's from the HVAC technician." Hands over the report. The group reads it and can ask questions (the Librarian can answer factually about the report).
     - **For Group Y (Distrust):** 
       - The Librarian says the same thing and hands the same report.
       - However, the group has the CFA note that discredits the Librarian. The Librarian does not mention the note and does not address it unless asked. If asked, the Librarian says: "I don't know why they would say that. This report is official." But does not provide further proof.

  4. **Group Decision (10 minutes):**
     - After the Librarian leaves, each group discusses again and makes a final decision. They must decide as a group and record it along with their confidence level.

  5. **Third Moment: Genuine Reliability Difference (15 minutes):**
     - Now, we introduce a twist. The Librarian returns to both groups with a new piece of evidence. This time, it's about a different but related issue: the source of a strange smell in the library. There are two possibilities:
       - Explanation C: Mold in the walls (true explanation).
       - Explanation D: Chemicals from the construction site (false).
     - However, this time the Librarian presents a report that supports Explanation D (the false one) and says it's from the same HVAC technician. The report says: "The smell is from chemical runoff from the construction site."
     - But wait: the groups now have a reason to doubt the Librarian? Not exactly. This time, we set up a genuine reliability difference.
     - **Setup:** 
       - The instructor reveals that the HVAC technician is actually reliable for the noise issue (as we know) but not for smell issues. For the smell, we have a different expert: the Environmental Safety Office (ESO). 
       - The groups are told: "For the smell issue, the Environmental Safety Office (ESO) is the authoritative source. The HVAC technician is not trained in chemical smells."
     - The Librarian presents the HVAC technician's report on the smell (which is wrong). But now, both groups have a note from the ESO that says: "We have tested the air and found mold spores. The smell is due to mold, not construction chemicals." 
     - However, the note from the ESO is given to the groups at the same time as the Librarian's report? Actually, let's structure it differently to show that the groups must decide who to trust.
     - **Revised:** 
       - The Librarian comes and gives the groups the HVAC technician report (which is about smell and is wrong). 
       - Then, a representative from the ESO (the instructor in a different hat, or a TA) comes and gives the groups the correct report (mold). 
       - But the groups have a prior note: "For environmental issues, the ESO is the campus authority. The HVAC technician is not certified in environmental testing."
     - Now, the groups must decide: who to trust? The Librarian (who brought the HVAC technician report) or the ESO representative? 
     - They make a quick decision (without long discussion) on the smell issue.

  6. **Reveal and Debrief (15 minutes):**
     - Bring the class together. Reveal the true answers: 
       - Noise: HVAC (Explanation A).
       - Smell: Mold (Explanation C).
     - Show the decisions and confidence levels of each group at the two stages (initial and after Librarian) for the noise issue, and then for the smell issue.
     - Discuss what happened.

  **Mapping to Mechanisms:**
  - **Omission (Group X):** Initially, they had incomplete evidence and might be less confident. When the Librarian brought the missing evidence, they accepted it and changed their mind (if they hadn't already guessed correctly). This shows that the missing evidence fixed the error.
  - **Distrust (Group Y):** They had the same initial evidence and the same missing evidence from the Librarian. But because of the CFA note, they might have dismissed the Librarian's report. Thus, even with the evidence, they might remain confident in the wrong explanation (or be split). This shows that supplying the evidence doesn't fix the problem if the source is distrusted.
  - **Third Moment (Smell Issue):** Both groups are presented with two sources: the Librarian (with an unreliable report for this issue) and the ESO (reliable). The prior note tells them that the ESO is the authority for environmental issues. Thus, distrusting the Librarian (or the HVAC technician) in this case is rational because of the genuine difference in reliability.

  **Predictable Problems and Handling:**
  1. **Problem:** Group Y might ignore the discrediting note and trust the Librarian anyway. 
     - **Handling:** Make the discrediting note strong and from a trusted authority (CFA). Also, during the activity, if the group doesn't seem to be paying attention to the note, the instructor (as facilitator) might remind them: "Remember, you have a note from the CFA about the Librarian."

  2. **Problem:** The groups might not take the stakes seriously. 
     - **Handling:** Use tangible rewards (chocolate in view) and emphasize that the reward is for the group's correct decision.

  3. **Problem:** The third moment might be rushed. 
     - **Handling:** Keep the third moment simple: present the two reports and the note about authority. Don't require deep discussion. Just a quick vote.

  4. **Problem:** The activity might run over time. 
     - **Handling:** Keep strict time limits. Use a timer visible to everyone.

  **What the Activity Cannot Stage:**
  - The activity cannot perfectly stage the *systemic* nature of the distrust. In real life, the distrust might be built over time and embedded in social structures. Here, it's introduced via a note. So, the instructor must explain that in the distrust case, the group's dismissal of the evidence is due to a pre-existing social structure (e.g., institutional distrust) that cannot be overcome by a single piece of evidence.

  **Exact Wording for Discrediting Device:**
  For Group Y's CFA note: 
  > "Attention: The campus librarian has been known to circulate unverified claims about facility issues in the past. Any information provided by the librarian regarding the noise issue should be verified directly with the Campus Facilities Authority before being accepted. 
  > — Campus Facilities Authority"

  Why? It comes from an authority (CFA) and uses strong language ("unverified claims", "should be verified directly"). It doesn't say the Librarian is always wrong, but it casts doubt.

  **Debrief Outline:**
  1. Reveal the true answers and which groups got what.
  2. Ask Group X: How did your group's confidence change when the Librarian came? (They should say it increased and they accepted the report.)
  3. Ask Group Y: Did the Librarian's report change your group's mind? Why or why not? (They might say they didn't trust the Librarian because of the note.)
  4. Highlight: 
     - Group X had an omission problem fixed by evidence.
     - Group Y had evidence but didn't trust the source, so it didn't fix the problem.
  5. Then, for the smell issue: 
     - Ask: Why did you trust the ESO over the Librarian? (Because of the note about expertise.)
     - Point: Sometimes, distrust is rational because of genuine differences in expertise or reliability.
  6. Connect to social epistemology: 
     - How groups can be misled by incomplete evidence (omission) or by social structures that lead to distrust (even when evidence is present).
     - And how sometimes, being skeptical of outsiders is rational because of legitimate differences in reliability.

  This activity should create a memorable experience that illustrates the two failure modes and the nuance of rational distrust.
answer: |-
  Below is a complete in-class activity designed for your 75-minute social epistemology seminar. I've structured it around a fictional, low-stakes campus controversy to avoid prior commitments, with chocolate as the incentive. The activity creates three distinct epistemic scenarios: omission (missing evidence), distrust (rejected evidence), and justified distrust (rational reliability assessment). I'll specify every detail, including the controversy, payoff scheme, discrediting device, and minute-by-minute flow, then address predictable pitfalls and limitations.

  ---

  ### **Core Design Elements**
  - **Controversy**: The "Green Lawn Mystery" at a fictional campus.  
    **Issue**: Brown patches are appearing on the campus quad lawn. Two hypotheses:  
    - **Hypothesis A**: Caused by fungal infection (true answer).  
    - **Hypothesis B**: Caused by underground utility leaks.  
    *Why this?* It’s mundane, nonpolitical, and plausible. Fungus is the true cause (you’ll reveal this).  

  - **Stakes**: Chocolate bars (or 1 bonus point on a participation quiz). Small groups compete to win by voting correctly.  

  - **Roles**:  
    - **Group Alpha** (9 students): Experiences **omission** (missing evidence).  
    - **Group Beta** (9 students): Experiences **distrust** (discredited evidence).  
    - **The Groundskeeper** (played by you, the instructor): An "outsider" who delivers evidence. Discredited for Beta via a planted note.  

  - **Discrediting Device**:  
    A note given only to Group Beta, worded:  
    > *"Campus Facilities Memo: The Groundskeeper has repeatedly filed false maintenance reports this year. Verify all claims with Facilities before acting. – Director of Operations"*  
    *Why this?* It mimics real-world institutional distrust (e.g., bias labeling) and is vague enough to feel credible without specifics.  

  ---

  ### **Materials**
  1. **Handouts (for both groups)**:  
     - **Initial Evidence** (identical for Alpha and Beta):  
       > "Lawn Report: Brown patches began 3 weeks ago. Soil tests show normal pH. Campus utilities (water/gas) run under the quad. No leaks detected in initial scans. Student gardeners noted white fuzz on some grass roots (fungus indicator)."  
       *Why?* Ambiguous evidence—leaning toward fungus but omits a key test.  

     - **Missing Evidence** (delivered by Groundskeeper):  
       > "Lab Report: Microscopic analysis confirms *Rhizoctonia solani* fungus in all patch samples. Utility sensors show no leaks in the past month."  

     - **Third-Moment Evidence** (for reliability test):  
       > "Secondary Issue: Sprinkler malfunction in Rose Garden.  
       > - **Groundskeeper's Claim**: "Faulty valve (Part #7)."  
       > - **Facilities Report**: "Diagnosis: Corroded wiring (not Part #7). Groundskeeper has 40% error rate on sprinkler issues."  

  2. **Voting Sheets**: For recording group confidence (1–10 scale) and final vote (A/B).  
  3. **Chocolate Bars**: 18, to award if a group votes correctly.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  #### **Phase 1: Setup & Initial Evidence (20 minutes)**  
  - **0:00–0:05** (5 min): Introduce the activity.  
    > *"Today, we're solving the 'Green Lawn Mystery.' Brown patches are ruining the quad. Hypothesis A: Fungus. Hypothesis B: Utility leaks. Your group must vote A or B. If correct, everyone gets chocolate. I'll play the Groundskeeper if needed."*  

  - **0:05–0:10** (5 min): Divide into Alpha and Beta. Give both groups the **Initial Evidence** handout and voting sheets.  
    > *"Discuss with your group. Record your vote and confidence (1–10) in 15 minutes."*  

  - **0:10–0:20** (10 min): **Group work**. Groups review evidence.  
    - *Expected outcome*: Both groups lean toward Hypothesis A (fungus) due to "white fuzz" clue, but confidence is moderate (e.g., 6/10) due to ambiguity.  

  #### **Phase 2: Intervention & Voting (25 minutes)**  
  - **0:20–0:25** (5 min): **Plant discrediting device**. Give **only Group Beta** the Facilities Memo discrediting the Groundskeeper.  
    > *"Group Beta, you found this memo in your packet. Group Alpha, you have no memo."*  

  - **0:25–0:35** (10 min): **Groundskeeper intervention**. You (as Groundskeeper) visit **both groups separately**, delivering the **Missing Evidence** handout.  
    - **To Alpha (omission group)**:  
      > *"I found this lab report—it confirms fungus and rules out leaks."* (Smile, act helpful.)  
    - **To Beta (distrust group)**:  
      *Same delivery, but add:*  
      > *"I know Facilities doubts me, but this report is solid."* (Act slightly defensive.)  

  - **0:35–0:45** (10 min): **Group re-deliberation**. Groups discuss and record **final vote/confidence**.  
    - *Expected outcomes*:  
      - **Alpha** (omission): Confidence jumps (e.g., 9/10); votes A (fungus).  
      - **Beta** (distrust): Confidence stays low or splits; some reject evidence due to memo.  

  #### **Phase 3: Justified Distrust Test (15 minutes)**  
  - **0:45–0:55** (10 min): **Introduce third moment**. Give both groups the **Secondary Issue** handout (sprinkler malfunction).  
    > *"New problem: The Rose Garden sprinklers failed. The Groundskeeper blames Part #7. Facilities blames wiring. Who do you trust? Vote in 5 minutes—no discussion."*  

  - **0:55–1:00** (5 min): **Silent vote**. Groups vote individually (no group consensus).  
    - *Expected outcome*: Most students distrust the Groundskeeper due to the Facilities Report’s "40% error rate."  

  #### **Phase 4: Reveal Truth & Debrief (15 minutes)**  
  - **1:00–1:05** (5 min): **Reveal true answers**.  
    > *"Lawn Mystery: Fungus (A) was correct. Sprinklers: Wiring was correct—Groundskeeper was wrong."*  

  - **1:05–1:15** (10 min): **Structured debrief**. Map moments to mechanisms:  

  | **Activity Moment**            | **Mechanism**                          | **Debrief Question/Prompt**                                                                 |  
  |--------------------------------|----------------------------------------|-------------------------------------------------------------------------------------------|  
  | Alpha’s confidence post-Groundskeeper | **Omission fixed**                     | *"Alpha, your confidence soared with the new evidence. Why? Because you had no reason to doubt it—it filled a gap."* |  
  | Beta’s split/rejection         | **Distrust persisted**                 | *"Beta, did the evidence change your minds? Why not? The memo made the source unreliable, so the evidence 'didn't count'."* |  
  | Sprinkler vote                 | **Justified distrust**                 | *"Why did you distrust the Groundskeeper here? Because the error rate was a genuine reliability difference—not just bias."* |  
  | Pre-intervention confidence    | **Baseline uncertainty**               | *"Both groups started unsure—evidence was incomplete (omission in play already)."*        |  

  - **Final takeaway**:  
    > *"Omission is fixed by evidence; distrust isn't. But sometimes, like with the sprinklers, distrust is rational. Social structures shape what we 'see' and 'believe'."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Beta trusts the Groundskeeper anyway (discrediting fails).  
     - **Why**: Students may ignore the memo or assume you (as instructor) wouldn’t mislead.  
     - **Fix**: During Beta’s deliberation, remind them: *"Remember, your Facilities memo questions the Groundskeeper’s reliability."*  

  2. **Problem**: Alpha/Beta spill secrets between groups.  
     - **Why**: Students might talk during breaks.  
     - **Fix**: Physically separate groups (e.g., corners) and warn: *"No cross-group talk—it ruins the experiment."*  

  3. **Problem**: Time runs short in group discussions.  
     - **Why**: Students digress or over-analyze.  
     - **Fix**: Use visible timers. Interrupt after 8 minutes: *"You have 2 minutes to vote."*  

  4. **Problem**: Sprinkler vote feels rushed/forced.  
     - **Why**: No discussion in the third moment.  
     - **Fix**: Reassure: *"This vote is individual—go with your gut. We’ll discuss after."*  

  ---

  ### **What the Activity Cannot Stage**  
  - **The Systemic Nature of Distrust**: The discrediting memo *tells* students to distrust but doesn’t simulate how real communities *organically* develop ingrained bias (e.g., through repeated interactions or cultural norms). You’ll need to explicitly say:  
    > *"In real life, distrust isn’t just a note—it’s built over time. A memo stands in for systemic exclusion, like when a community dismisses outsiders due to history, hierarchy, or polarization."*  

  - **Emotional Resistance**: Students might rationally reject the Groundskeeper in Beta but won’t feel the *visceral* "backfire effect" (where corrections strengthen false beliefs). Address this in debrief:  
    > *"Note how Beta’s distrust was calm here. In reality, distrust often involves emotion—people dig in when their identity or group loyalty is threatened."*  

  ---

  ### **Why This Design Works**  
  - **Fictional controversy** avoids politics; **chocolate** adds light stakes without stress.  
  - **Omission** (Alpha) collapses with new evidence; **distrust** (Beta) resists—creating clear contrast.  
  - **Third moment** (sprinklers) forces students to apply reliability logic, preventing oversimplification.  
  - **Discrediting device** is blunt but realistic (e.g., akin to "fake news" labels).  

  Run this as-is, and students will feel the difference between missing evidence and rejected evidence—while seeing when distrust is rational. Prepare extra chocolate in case both groups guess right initially!
