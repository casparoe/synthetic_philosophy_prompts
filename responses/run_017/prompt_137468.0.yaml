  For organization, I'll rank objections as fatal, serious, or awkward. The fatal ones would be issues that directly undermine core commitments - like if the deference norm secretly requires a substantive truth concept. Serious but not fatal issues might include explanatory gaps or liar paradox complications. Awkward issues could be things like making their view seem counterintuitive without directly refuting it.

