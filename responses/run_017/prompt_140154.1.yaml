  For structure: start with the personal hook, then outline the theoretical problem. Define the two aspects of comprehension—generation vs. accountability. Critique existing positions by showing how they fail to solve the double inversion. The methodology should combine conceptual analysis and ML experiments, avoiding pure theory or applied work. The deliverable is a prospectus showing either a viable path or where the theory hits a wall. Failure would be if the distinction collapses under scrutiny.

  Need to ensure the "accountability" concept isn't just hand-wavy. Emphasize that it's about the functional role of reports in a feedback loop. Also, clarify why six months is enough for groundwork but not for full answers. The balloon risk is if empirical testing becomes more complex than expected.

