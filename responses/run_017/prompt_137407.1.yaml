  Hmm... their framework terms are rich: control runs, factorial designs, error budgets. I should treat these as the target language for translation. Crucial to flag where translations distort philosophical positions by smuggling in instrumentation. For example, counterfactual approaches map neatly to control runs, but process theories resist translation since they require physical transmission.

  The user's distinction between instrumented/boundary/bare omissions is brilliant - it explains why process theorists reject bare omissions while interventionists accept instrumented ones. Their model-mediation point cuts deep: when lawyers demand yes/no answers about omissions causing harm, it's really about choosing which variables to include in the causal model (e.g., "duty of care" as a background condition).

  For residue, I'll note three irreducibles: the profligacy problem (why we single out specific omissions), production-vs-permission intuition (which may reflect coarse-graining levels), and legal demands for binary answers (a normative overlay). None indict the experimental framework - they just show different questions being asked under "causation". The physicist's vocabulary exposes how philosophy often blends descriptive and normative layers.

  Most satisfying realization: the user's "occupational deformation" is actually a superpower. Their framework doesn't fail to capture omission-causation; it reveals that the debate conflates instrumented scenarios (where omissions are measurable causes) with bare ones (where they're just modeling choices).
answer: |-
  Below is a translation of philosophical positions on causation by omission into your experimental design vocabulary, followed by a residue report testing your conjectures. I'll flag distortions, unsupported assumptions, and framework limitations explicitly. Terms from your vocabulary are **bolded** when first defined.

  ---

  ### **Translation of Positions**  
  **Key Definitions (Your Terms):**  
  - **Control run/baseline:** A reference state (e.g., "no intervention" condition) explicitly measured to establish a comparison.  
  - **Intervening vs. conditioning:** *Intervening* = actively setting a variable (e.g., flipping a switch); *conditioning* = passively observing correlations (e.g., noting switch position).  
  - **Factorial design/contrast:** Isolating causal contributions by comparing outcomes across combinations of factors (e.g., "with/without X").  
  - **Blocking:** Fixing nuisance variables (e.g., temperature) to isolate the effect of interest.  
  - **Screening off:** Variable A screens off B from C if conditioning on A makes B statistically irrelevant to C.  
  - **Error budget term:** Including a variable *because* you bounded its impact (e.g., "stray light < 0.001% signal").  
  - **Detection limit:** Threshold below which an effect is indistinguishable from noise.  

  ---

  #### **1. Counterfactual/Difference-Making (Lewis/Woodward/Pearl)**  
  *Translation:* An omission causes outcome Y if, **intervening** to change the omission (e.g., flipping a switch from "off" to "on" in a **control run**) would change Y in the **contrast** estimate, **blocking** all other variables. This requires a **factorial design** with the omission as a manipulable factor (e.g., "shutter open" vs. "shutter closed").  
  - **Distortion:** Philosophically, this applies to "bare omissions" (e.g., "no one watered the plant"). But in your terms, it *only* works if the omission is **instrumented** (e.g., a "default off" state in the apparatus). Translation smuggles in a **protocol** (e.g., a defined "off" position).  

  #### **2. Process/Conserved-Quantity (Salmon/Dowe)**  
  *Translation:* Causation requires physical transmission (e.g., energy/momentum exchange) along a **continuous process**. An omission (e.g., a missing heat sink) cannot cause overheating because "nothing" transmits energy. Only **boundary omissions** (e.g., absent coolant flow) might qualify if the *presence* of coolant would transfer heat, but the omission itself isn’t causal—it’s a failure to enable a process.  
  - **Clean translation:** Aligns with how you model **error budgets**. If a term (e.g., "coolant flow") is listed in the budget, its *absence* isn’t a cause—it’s a variable you **bounded** and showed to be negligible. The cause is the *positive* energy flow (e.g., joule heating) that wasn’t countered.  

  #### **3. Norms/Expectations**  
  *Translation:* Which omission we call "the cause" depends on the **default state** in your **protocol** (e.g., a shutter *should* open automatically). Singling out "failure to water the plant" over "failure to install a sprinkler" is like choosing which **contrast** to estimate in a **factorial design**—it depends on which variables you designate as "intervention factors" versus **blocked** background conditions.  
  - **Distortion:** Philosophy treats norms as social; your framework makes them **operational** (e.g., **calibrated baselines**). "Profligacy" (innumerable non-waterers) dissolves because you only track variables in the **model** (e.g., "assigned caretaker").  

  #### **4. Double Prevention**  
  *Translation:** Disabling a preventer (e.g., cutting a circuit breaker that would have stopped a laser) is causal only if you **intervene** on the disabler (e.g., switch) and measure the outcome **contrast** (laser on/off), **blocking** other paths. This is identical to standard **factorial design** with a chain of switches.  
  - **Clean translation:** Maps to relay circuits or safety interlocks. No residue.  

  ---

  ### **Residue Report**  
  #### **Your Conjecture 1: "Bare omissions aren’t encountered in physics"**  
  - **Supported:** In physics, all three omission grades resolve:  
    - *Instrumented:* Treated as a **control run** (e.g., shutter closed).  
    - *Boundary:* Treated as a **nuisance variable** (e.g., missing heat sink → added to **error budget**).  
    - *Bare:* *Cannot be represented* without a **model** and **detection limit**. Example: "No one watered the plant" lacks a **protocol** to define the contrast. Philosophical disputes often conflate instrumented/boundary omissions (translatable) with bare ones (not).  
  - **Indictment:** The debate, not your framework. Philosophers overlook that "bare omissions" presuppose an unmetered ideal state.  

  #### **Your Conjecture 2: "Absences are model-mediated inferences"**  
  - **Confirmed:** All causal claims about omissions require:  
    - A **contrast** against a **baseline** (epistemic),  
    - A **detection limit** for inference (e.g., "catalyst absence caused no reaction" assumes you bounded contamination).  
  - **Metaphysical Worry:** Dissolves into epistemology. The "production vs. permission" intuition reflects coarse-graining:  
    - *Production:* Energy transfer (e.g., photon emission) at fine-grained **state space**.  
    - *Permission:* Enabling conditions (e.g., open shutter) at coarse-grained **model**.  
    Your vocabulary explicitly handles this via **choice of state space** (e.g., quantum vs. classical description).  

  #### **Irreducible Residues**  
  1. **Profligacy Problem**  
     - *Issue:* Why single out *one* omission (e.g., "the caretaker") when infinitely many exist?  
     - *In your terms:* Resolved by **blocking**—only variables in the **experimental design** (e.g., "assigned agent") are candidates.  
     - *Residue:* None. Philosophy’s worry assumes no **protocol**.  

  2. **Legal "Yes/No" Demand**  
     - *Issue:* Tort law requires binary causation (e.g., "Did failure to act cause harm?").  
     - *In your terms:* This is a **modelling decision**—like choosing a **detection threshold** (e.g., p < 0.05). Assigning blame requires *normative* priors (e.g., "duty of care" as a **blocked variable**).  
     - **Indictment:** The debate. Law’s demand confuses *causal dependence* (a **contrast** in a model) with *responsibility* (a normative layer).  

  3. **Production vs. Permission**  
     - *Issue:* "Did the absence *produce* the effect or merely *allow* it?"  
     - *In your terms:* Distinction collapses under **interventionist testing**. If **intervening** to add the missing element (e.g., water) changes Y, the omission is causal in the model.  
     - **Residue:** Purely psychological. Reflects folk physics, not experimental practice.  

  ---

  ### **Conclusion**  
  - **Your framework captures all instrumented/boundary omissions cleanly.** What philosophers call "causation by omission" is either:  
    - A **measured contrast** (e.g., control run),  
    - A **bounded error term**,  
    - Or a **normative choice** in model design.  
  - **Bare omissions cannot be represented**—they lack instrumentation, making causal claims untestable. This isn’t a flaw in your framework; it reveals that philosophical examples often imply hidden apparatus.  
  - **The debate’s heat comes from:**  
    - Conflating metaphysical questions (e.g., "Can nothing cause something?") with epistemic ones (e.g., "How do we infer absences?"),  
    - Overlooking that *all* causal claims are model-relative (your **state space** choice),  
    - Importing normative demands (e.g., tort law) into descriptive accounts.  
  - **Your occupational deformation is an insight:** Experimental design forces clarity that armchair thought experiments lack. The residue isn’t a world your framework can’t represent—it’s a sign the debate asks incoherent questions when divorced from measurement protocols.
