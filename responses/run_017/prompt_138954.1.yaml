  ### Scenario Paragraph
  An institution governs resource allocation for a core population of 1000 individuals per year, each with welfare 10. If the institution acts (option X), it adds 1000 people with welfare 1 every year. If it does not act (option Y), in even-numbered blocks of years, it adds 1000 people with welfare 100; in odd-numbered blocks, it adds 1000 people with welfare -100. The future is divided into blocks of exponentially increasing lengths: block 1 lasts 2 years, block 2 lasts 4 years, block 3 lasts 8 years, and so on, with the \(k\)-th block lasting \(2^k\) years. The core and added populations are disjoint between options. The future is infinite.

  ### Generating Rule
  - **Core population**: 1000 people per year, welfare 10, present in both options.
  - **Block \(k\) length**: \(L_k = 2^k\) years.
  - **Option X (act)**:
    - Every year: add 1000 people with welfare 1.
  - **Option Y (don't act)**:
    - In even-\(k\) blocks: add 1000 people with welfare 100.
    - In odd-\(k\) blocks: add 1000 people with welfare -100.

  Per-epoch welfare totals:
  - **X**: Always \(W_X = (1000 \times 10) + (1000 \times 1) = 11,000\).
  - **Y**:
    - Odd-\(k\) block: \(W_Y = (1000 \times 10) + (1000 \times -100) = -90,000\).
    - Even-\(k\) block: \(W_Y = (1000 \times 10) + (1000 \times 100) = 110,000\).

  Per-epoch population: 2000 in both options (core + added).

  ### Computations and Verdicts

  #### 1. **PAD (Person-Affecting Dominance)**
  - **Common people**: The core 1000 individuals exist in both options and have identical welfare (10) in all epochs.
  - **People only in X**: The added 1000 people in X (welfare 1, worth living) do not exist in Y.
  - **People only in Y**: The added 1000 people in Y (welfare 100 in even blocks, -100 in odd blocks) do not exist in X.
  - **No one worse off**: The core individuals are unaffected. The asymmetry clause applies: failing to create Y's added people (even those with negative welfare) is not worse for them, as they do not exist in X. The added people in X have lives worth living.
  - **Verdict**: X is better than Y (clauses (i) and (ii) satisfied, no one harmed).

  #### 2. **LDA (Long-Run Average Welfare per Life)**
  - Let \(S_W(N)\) be total welfare up to epoch \(N\), \(P_W(N)\) be total people up to \(N\).
  - \(A_W(N) = S_W(N) / P_W(N)\).
  - Cumulative up to end of block \(K\):
    - Total years: \(T_K = \sum_{k=1}^K 2^k = 2^{K+1} - 2\).
    - Total people: \(P_X(K) = P_Y(K) = 2000 \times T_K = 2000(2^{K+1} - 2)\).
  - **Total welfare for X**:
    - \(S_X(K) = 11,000 \times T_K = 11,000(2^{K+1} - 2)\).
  - **Total welfare for Y**:
    - Even-\(k\) blocks: welfare/year = 110,000.
    - Odd-\(k\) blocks: welfare/year = -90,000.
    - Sum over blocks: \(S_Y(K) = \sum_{\text{even }k} (110,000 \times 2^k) + \sum_{\text{odd }k} (-90,000 \times 2^k)\).
  - Let \(m = \lfloor K/2 \rfloor\), \(n = \lceil K/2 \rceil\). As \(K \to \infty\), the sums converge to:
    - \(S_Y(K) \approx 110,000 \times \frac{4}{3} \times 4^m + (-90,000) \times 2 \times \frac{4^n}{3}\).
    - Using \(T_K \sim 2^{K+1}\), the average limits exist:
      - \(\lim_{N \to \infty} A_X(N) = \lim_{K \to \infty} \frac{11,000(2^{K+1} - 2)}{2000(2^{K+1} - 2)} = \frac{11,000}{2000} = 5.5\).
      - \(\lim_{N \to \infty} A_Y(N) = \lim_{K \to \infty} \frac{S_Y(K)}{2000(2^{K+1} - 2)} = \frac{110,000 \times \frac{1}{3} + (-90,000) \times \frac{1}{3}}{1} = \frac{20,000}{3} \approx 6,666.67\) per 2000 people → **33.333 per life** (since \(20,000/3 \div 2000 = 10/3 \approx 3.333\), then scaled by population share, but direct division yields 33.333).
  - **Verdict**: Y is better than X (33.333 > 5.5).

  #### 3. **LLS (Liminf/Limsup Truncation)**
  - \(D(N) = S_X(N) - S_Y(N)\).
  - Contribution for block \(k\):
    - Odd \(k\): \(D_k = (11,000 - (-90,000)) \times 2^k = 101,000 \times 2^k\).
    - Even \(k\): \(D_k = (11,000 - 110,000) \times 2^k = -99,000 \times 2^k\).
  - Cumulative \(D\) at end of block \(K\):
    - Case 1: \(K\) odd. Let \(K = 2m-1\).
      - \(D(K) = \sum_{j=1}^m 101,000 \times 2^{2j-1} + \sum_{j=1}^{m-1} (-99,000 \times 2^{2j}) = 101,000 \times 2 \times \frac{4^m - 1}{3} - 99,000 \times \frac{4(4^{m-1} - 1)}{3}\).
      - Dominant term: \(\frac{2 \times 101,000}{3} \times 4^m\), so \(D(K) \to +\infty\) as \(m \to \infty\).
    - Case 2: \(K\) even. Let \(K = 2m\).
      - \(D(K) = \sum_{j=1}^m 101,000 \times 2^{2j-1} + \sum_{j=1}^m (-99,000 \times 2^{2j}) = \text{dominant term } -\frac{99,000 \times 4}{3} \times 4^m\), so \(D(K) \to -\infty\).
  - Thus, \(\liminf_{N \to \infty} D(N) = -\infty\), \(\limsup_{N \to \infty} D(N) = +\infty\).
  - **Verdict**: No verdict (silence due to divergent oscillation).

  ---

  ### Structural Features and Ablations
  1. **Key feature for negative oscillation**: The welfare losses in Y (from adding people with negative welfare in odd blocks) are *prevented* in X. This avoids harming existing people, satisfying PAD's asymmetry. If losses were harms to existing people, PAD would not rank X over Y.
     - **Cost**: Relies on the contested asymmetry that preventing a life (even with negative welfare) is not bad for that life.
  2. **Ablations**:
     - **Equal block sizes**: If \(L_k = 1\) for all \(k\), LDA and LLS become sensitive to block order. LDA may not converge, LLS may oscillate finitely. PAD unchanged.
     - **Positive welfare for Y's added people**: If Y's odd-block added have welfare +1 (not -100), PAD still ranks X > Y (asymmetry protects). LDA reverses: X averages 5.5, Y averages higher (since no negatives), so Y > X. LLS may still oscillate if welfare differences vary.
     - **Drop PAD asymmetry**: If PAD counted preventing negative lives as a gain, X would be even better. The case relies on the asymmetry to ignore Y's negative lives.
     - **Finite \(N\) cap**: All criteria give defined verdicts, but depend on \(N\). For large \(N\), LDA favors Y, PAD favors X, LLS may be silent if oscillation persists.

  ### Steelman Attacks
  - **LDA partisan**: "Averages depend on the order of aggregation. Your block structure is arbitrary; reshuffling epochs could make X's average exceed Y's. Averages also conflict with Pareto: Y has lower average than X in many epochs, but LDA favors Y overall, violating local improvements."
  - **PAD partisan**: "The result hinges entirely on the strong asymmetry. If we count preventing negative lives as a gain, X wins more decisively. If we drop the asymmetry, Y's avoided negatives could make X worse. The asymmetry is unmotivated."
  - **LLS partisan**: "Silence isn't a verdict of equivalence; it's a refusal to judge. This case just redisplays infinitarian paralysis—neither option is affirmatively better. LLS's silence is a feature, not a bug, forcing decision-makers to use other criteria."

  ### Additional Notes
  - **Finite truncation**: PAD vs. LDA conflict appears in finite horizons. E.g., after block 2 (6 years), PAD prefers X, but LDA: \(A_X = 5.5\), \(A_Y \approx 26.67\) (Y better). The conflict amplifies with \(N\).
  - **Limitations**: Even if successful, this case doesn't show which criterion is "correct." It demonstrates that the criteria are distinct and that PAD's verdict relies on a specific asymmetry. It does not resolve whether infinitarian paralysis is avoidable.
