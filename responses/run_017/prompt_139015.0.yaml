  | 9    | 30                  | 50             | Capacity | Consent diminished by fatigue-induced impaired judgment. Moderate blame: recipient should recognize impairment but proceeds. |
  | 10   | 0                   | 0              | None | No consent exists; act justified by necessity. No blame: no alternative, good outcome irrelevant. |

  ---

  ### Tier Classification (Based on Transformative Force)
  - **Clean (85–100)**: Case 6  
  - **Mildly Defective (60–85)**: *None* (Case 6 is clean; gap highlights boundary)  
  - **Seriously Defective (25–55)**: Cases 1 (25), 2 (50), 4 (40), 5 (40), 8 (45), 9 (30)  
  - **Void (0–20)**: Cases 3 (10), 7 (5), 10 (0)  

  **Boundary Work**:  
  - **25/30 (Seriously Defective/Void)**: Separates coercive proposals (Case 1: exploitative but non-threatening) from literal non-consent or egregious overreach (Case 7: physical violation of terms).  
  - **55/60 (Seriously Defective/Mildly)**: Distinguishes structural/volitional defects (Case 8: background injustice) from near-valid consent (Case 6: minor scope ambiguity).  

  ---

  ### Divergence Flags (Blameworthiness >25 pts from Transformative Force)
  - **Case 8**: Force 45, Blame 20. *Explanation*: Force low due to background coercion, but blame minimal as employer didn’t cause injustice.  
  - **Case 6**: Force 85, Blame 30. *Explanation*: Force high as consent covers act technically, but blame exists for not ensuring understanding.  

  ---

  ### Key Analysis
  1. **Most Weighty Distinction**: **Volitional vs. Informational defects**. Volitional (e.g., Cases 1–3) more drastically undermines force by subverting agency, while informational (Cases 4–5) often allows partial transformation if core voluntariness holds.  
  2. **Most Debatable Case**: **Case 8 (Unjust background)**. Philosophers disagree sharply on whether systemic coercion nullifies consent absent direct culpability (e.g., libertarians vs. structural injustice theorists).  
  3. **Factual Uncertainty Impact**: **Case 9 (Twenty-two hours awake)**. Actual cognitive impairment level (unstated) could raise force (if mild) or lower it (if severe); blame could drop if fatigue was unforeseeable.  

  ### Tie Note  
  Cases 4 and 5 both scored **40** for transformative force: identical moral weakening due to material deception, differing only in blameworthiness due to activeness of evasion.  

  ---  
  **Summary for Rubric**: This framework prioritizes *why* consent fails over binary validity. Volitional defects (coercion) most corrosive to transformative force, while scope/capacity issues vary by context. Blameworthiness tracks deliberate wrongdoing, not defect severity. Case 8 exemplifies the gap between moral force and agent culpability.
