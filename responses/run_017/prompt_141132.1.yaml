prompt: |-
  You are a professional metaphysician who works on mereology, material constitution, and the metaphysics of ordinary objects. Please think carefully and work through my commitments one at a time before you start drawing conclusions: a short, unordered brainstorm of candidate tensions first, then the ranked audit.

  I'm an undergraduate in a metaphysics seminar, and I have to hand in a two-page position statement on the special composition question — the question of what conditions some things must satisfy in order to compose something. Before I commit myself in writing I want to know whether the package I've arrived at is stable. Roughly where I've landed:

  (1) Restricted composition, with a two-clause answer: the xs compose something if and only if either their activity realises a single life, or their arrangement was produced by a process guided by a representation of that arrangement — a plan, an intention, a design. I reject the view that any arbitrary plurality composes something; that gets me organisms and artefacts, and it rules out the fusion of the Eiffel Tower and my left kidney.

  (2) Composition and existence facts are wholly mind-independent: nothing exists, or fails to exist, even partly in virtue of what anyone intends, believes, or represents.

  (3) There are no coincident material objects: if x and y have all and only the same parts at the same time, then x is identical with y. This is part of why I am not an unrestricted-composition theorist.

  (4) Composition questions always have determinate answers, and I don't want to secure that by appealing to vagueness, context-sensitivity, quantifier variance, or the claim that the disputed cases are merely verbal.

  (5) If the xs compose y at all, they compose y necessarily; but I also want to say that a table survives the replacement of a leg and perishes when its parts are scattered, so that what composes what varies over time.

  (6) Methodologically, I want a single unified condition rather than a disjunctive list. An answer with the shape "organisms and artefacts and nothing else" strikes me as a taxonomy masquerading as a principle, and I would be unhappy if my finished view had that shape.

  What I want is an audit, not a lecture. Tell me which of these really conflict and how badly; which pairs merely look as though they conflict, and what generates the appearance; for each genuine conflict, what the least costly repair would be; and finally, which single revision would clean up the most. Rank the tensions by severity rather than presenting them all as equally serious, and flag anything in the above that is underspecified in a way that would let me wriggle out of a difficulty I ought not to be able to wriggle out of. Assume I am willing to surrender at most one or two of (1) through (6), and that I do not yet know which. Please don't give me a bibliography or a reading list; I will supply references myself.
reasoning: |-
  Okay, let me approach this systematically. The user is an undergraduate metaphysics student presenting a position on the Special Composition Question with six commitments, requesting an audit of internal tensions. 

  First, I need to identify where the pressure points are in their view. The core tension jumps out: commitment (2) insists composition facts are mind-independent, but (1) requires representations (plans/intentions) for artefacts. This seems directly contradictory - how can artefacts' existence depend on representations while remaining mind-independent? 

  Looking at the other commitments: (3)'s rejection of coincidence aligns with restricted composition in (1) but creates issues with persistence in (5). If parts compose necessarily but tables survive part replacement, we have a problem - the pre-replacement parts permanently compose the table, but post-replacement parts must also compose it. Yet (3) forbids coincident objects. 

  Commitment (4) demands determinacy without appealing to vagueness, which might conflict with how we identify "a life" or "guided process" in borderline cases. Commitment (6) wants unity, but the proposed account has two disjunctive clauses (lives/artefacts) - though perhaps they can argue for deeper unity.

  The most severe conflict is clearly between (1) and (2). Artefacts require representations according to (1), but (2) says existence can't depend on representations. The minimal fix would be to either drop artefacts from (1) or allow mind-dependence for artefacts only - but the latter violates (2). 

  Next worst is (5) and (3): necessary composition clashes with part replacement. The table can't be identical to both original parts and replacement parts per (3), but (5) says both sets compose it necessarily. Temporary identity seems the only fix, but that's costly. 

  For (1) and (6), the two-clause structure might be salvageable if they can show both clauses express a single principle about functional unity. Without that, (1) violates (6)'s anti-disjunction stance. 

  (4) might be maintained if "life" and "guided process" can be made precise, but biological and artefactual borderline cases will challenge this. 

  The single most effective revision would be abandoning artefact inclusion in (1), solving the mind-dependence conflict and simplifying the disjunction. Alternatively, dropping (2) for artefacts only, but that sacrifices principle. 

  I should also note underspecifications: "realises a single life" and "guided by representation" need careful definitions to avoid vagueness issues contradicting (4). "Survives" in (5) needs clarification regarding part replacement. 

  The audit should present these tensions in descending order of severity, with minimal fixes and flag these underspecified terms.
answer: |-
  Here is an audit of your commitments, ranking tensions by severity (most severe first), identifying genuine conflicts, appearances, underspecifications, and minimal repairs. The goal is maximum stability with minimal revision.

  ### **Ranked Tensions (Most Severe First)**
  1.  **Conflict: (1) vs. (2)**  
      - **Nature:** (1) makes artefact composition *depend* on representations (plans/intentions). (2) states composition/existence facts are *wholly mind-independent*. Artefacts cannot both require representational guidance and be mind-independent.  
      - **Severity:** **Catastrophic**. This directly contradicts your core realism. Artefacts either exist mind-dependently (violating (2)) or your account of composition for them is false (violating (1)).  
      - **Minimal Repair:**  
          - *Option A:* Drop artefacts from (1). Accept only organisms as composite objects. (Preserves (2), (3), (6); abandons artefacts).  
          - *Option B:* Drop (2) for artefacts only. Claim artefact existence *is* partly mind-dependent (e.g., intention-dependent), while organism existence is not. (Violates (2)'s universality; creates disunity).  

  2.  **Conflict: (5) vs. (3)**  
      - **Nature:** (5) states that if xs compose y, they do so *necessarily* (essentialism about parts). But you want a table to survive leg replacement. Post-replacement, the table has different parts. (3) forbids coincident objects (no two objects share all parts). So:  
          - Pre-replacement parts compose the table necessarily (by (5)).  
          - Post-replacement parts compose the table (by persistence).  
          - But these are different pluralities of parts. (3) implies there is only one object here (the table).  
          - **Conflict:** How can the table be *necessarily* composed by the original parts *and* by the replacement parts? It can't be identical to both pluralities if they overlap only partially. Essentialism clashes with part change.  
      - **Severity:** **Major**. This threatens the coherence of persistence for artefacts/organisms under part replacement.  
      - **Minimal Repair:**  
          - *Option A:* Reject (5). Allow that composition is temporary/accidental (the xs compose y *at a time*, not necessarily). (Sacrifices mereological essentialism).  
          - *Option B:* Embrace temporary identity/perdurance. The table is a spacetime worm; different temporal parts have different spatial parts. (Violates (3) if interpreted as applying to instantaneous objects; complexifies ontology).  

  3.  **Conflict: (1) vs. (6)**  
      - **Nature:** (1) is explicitly disjunctive (life *or* representation-guided arrangement). (6) demands a *single unified condition*. "Life" (biological self-organization) and "representation-guided arrangement" (intentional design) seem fundamentally different principles.  
      - **Severity:** **Significant**. Violates your methodological desire for unity.  
      - **Minimal Repair/Appearance:** *This may be an appearance, not a conflict, if you can unify the clauses.* Argue both are instances of "functional unity achieved through goal-directed organization" (life = intrinsic teleology; artefacts = extrinsic teleology). **This is your best path.** If successful, it resolves the tension without revising (1) or (6). If unsuccessful, drop one clause from (1) or accept disunity.  

  4.  **Conflict: (4) vs. (1) (Underspecification Exploitation)**  
      - **Nature:** (4) demands determinate answers without vagueness. But key terms in (1) are **underspecified**:  
          - "Realises a single life": When does metabolism/reproduction become a "single life"? (Boundary cases: slime molds, symbiotic colonies, brain-dead organisms).  
          - "Guided by a representation": How direct/intentional must the guidance be? (e.g., a termite mound, a river delta shaped by beaver dams, AI-generated structures).  
      - **Severity:** **Moderate-to-Severe (depending on definitions)**. Without precise boundaries, borderline cases threaten determinacy (4).  
      - **Minimal Repair:** Sharpen definitions *aggressively* to eliminate vagueness (e.g., define "life" by specific biological criteria; define "guided" as requiring deliberate, conscious intent). Risk arbitrariness or excluding plausible cases.  

  5.  **Tension: (1) vs. (3)**  
      - **Nature:** (1) + (3) rules out coincident objects *by fiat*. But does your account *generate* cases where coincidence *seems* plausible? (e.g., A lump of clay (mere mass) vs. the statue (representation-guided arrangement). Your view says they are identical *if* they share parts (which they do), so no coincidence.  
      - **Severity:** **Apparent Tension (Resolvable)**. Your account *avoids* coincidence by tying artefact existence tightly to the arrangement guided by a representation. The lump only exists *as an artefact* under that description. If the representation ceases to apply (e.g., the statue is melted), the lump (as a mere mass) still exists? **Underspecification:** What is the mere mass? Is it an object at all without being arranged for a purpose (by nature or design)? Clarify that your condition (1) is *necessary and sufficient* for composition – mere masses don't compose objects unless fulfilling (1). This resolves the tension.  

  ### **The Single Most Effective Revision**
  *   **Drop artefacts from (1).**  
      *   **Why:** It resolves the catastrophic conflict with (2) immediately. It significantly aids unity (6) by needing only "realises a single life". It simplifies persistence (5) by focusing on organisms (though part-replacement issues remain). It avoids tricky underspecification about "guidance" (4).  
      *   **Cost:** You lose artefacts as composite objects. You must adopt nihilism about artefacts or treat them as "quasi-objects" (e.g., modes, aggregates, intentional constructs) that don't strictly *compose* a new object. This is a major concession.  

  *   **Alternative: Drop (2) for artefacts only.**  
      *   **Why:** Resolves the (1)/(2) conflict directly. Allows artefacts to exist.  
      *   **Cost:** Sacrifices the universality and mind-independence of (2). Creates a disunified metaphysics (organisms mind-independent, artefacts mind-dependent). Hinders (6).  

  ### **Key Underspecifications Needing Clarification (Potential "Wiggle Room")**
  1.  **"Realises a single life" (1):** What are the necessary/sufficient conditions? Avoids (4) only if perfectly sharp. Is "life" fundamentally biological, or could it include AIs/ecosystems?
  2.  **"Guided by a representation" (1):** What constitutes "guidance"? Must the representation *cause* the arrangement *and* be held by an agent? Does "driftwood art" count? What about naturally occurring structures that *resemble* designs?
  3.  **"Survives" part replacement (5):** How much replacement? Gradual vs. all-at-once? Does the "life" or "representational status" persist through the change? Crucial for coherence with (3) and (5).
  4.  **"The same parts" (3):** Strict mereological extensionality at a time is clear. But combined with (5), the persistence of the *object* through part change needs careful description to avoid implying coincident objects *over time*.

  ### **Conclusion on Stability**
  Your package has **one catastrophic conflict (1 vs. 2)**, **one major conflict (5 vs. 3)**, and **significant pressure points** regarding disunity (1 vs. 6) and determinacy (4 vs. 1's underspecification). **It is not stable as stated.**

  *   **The minimal path to stability:**  
      (A) **Resolve (1) vs. (2):** Choose mind-dependence for artefacts *or* drop artefacts.  
      (B) **Resolve (5) vs. (3):** Abandon mereological essentialism (5) *or* adopt a 4D/temporal-parts ontology.  
      (C) **Fortify (1):** Radically sharpen definitions of "life" and "guided" to save (4).  
      (D) **Unify (1):** Argue the disjunctive clauses express a single principle of functional unity to save (6).  

  **Prioritize resolving (1) vs. (2).** This is the most fundamental instability. Sacrificing artefacts (Option A) is the cleanest repair but costs intuitions about tables. Sacrificing universal mind-independence (Option B) saves artefacts but fractures your ontology. Choose your battlefield.
