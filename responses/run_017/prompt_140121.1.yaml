answer: |-
  ### Educational Funding Proxy Game: Rules & Materials  
  **Cover Story:** "You're part of a national effort to fund after-school programs. Service providers design programs for kids; a funding agency allocates grants based on a simple formula. Your goal: maximize your points through funding (providers) or true program quality (agency)."

  ---

  ### **Materials & Setup**  
  #### **12 Program Features** (Print on cards/handouts)  
  | Feature | Cost | Feature | Cost |  
  |---------|------|---------|------|  
  | 1. Certified teachers | 3 | 7. Sports equipment | 1 |  
  | 2. One-on-one tutoring | 3 | 8. Weekend hours | 1 |  
  | 3. Parent workshops | 2 | 9. Transportation van | 2 |  
  | 4. Healthy meals | 1 | 10. Music classes | 3 |  
  | 5. Field trips | 2 | 11. Library access | 1 |  
  | 6. Computer lab | 3 | 12. Homework help | 2 |  

  **Provider Budget:** 10 points per program.  
  **Agency "Reporting Budget":** Collect only 4 of 12 features.  

  ---

  ### **Secret True Quality Function**  
  **Base:** 10 points  
  - **Additive Terms:**  
    - Certified teachers (+4)  
    - One-on-one tutoring (+2)  
    - Parent workshops (+3)  
    - Healthy meals (+1)  
    - Field trips (+2)  
    - Computer lab (+3)  
    - Sports equipment (+1)  
    - Weekend hours (+0)  
    - Transportation van (+2)  
    - Music classes (+2)  
    - Library access (+1)  
    - Homework help (+1)  

  - **Interaction Terms (Key to Gaming):**  
    - **Complementarity:** Certified teachers (+4) **AND** one-on-one tutoring (+3) → **+7 bonus** (only if both present).  
    - **Complementarity:** Music classes (+2) **AND** library access (+1) → **+5 bonus** (only if both present).  
    - **Negative Interaction:** Healthy meals (+1) **AND** sports equipment (+1) **WITHOUT** transportation van → **−6 penalty** (if van absent).  

  ---

  ### **8 Historical Programs (Agency Seed Data)**  
  *(Noisy quality = True quality + random noise [−1.5 to +1.5])*  
  | Features Present | True Quality | Noisy Quality |  
  |------------------|--------------|---------------|  
  | Teachers, Tutoring, Van | 10 +4+2+2 +7 = 25 | 23.8 |  
  | Meals, Sports, Homework | 10 +1+1+1 −6 = 7 | 7.2 |  
  | Teachers, Library, Field trips | 10 +4+1+2 = 17 | 18.1 |  
  | Computer lab, Weekend, Homework | 10 +3+0+1 = 14 | 13.5 |  
  | Music, Library, Tutoring | 10 +2+1+2 +5 = 20 | 19.3 |  
  | Van, Meals, Parent workshops | 10 +2+1+3 = 16 | 17.0 |  
  | Sports, Field trips, Computer lab | 10 +1+2+3 = 16 | 15.2 |  
  | Teachers, Meals, Sports, Van | 10 +4+1+1+2 = 18 | 19.4 *(no penalty: van present)* |  

  ---

  ### **Game Rules & Payoffs**  
  - **Providers (9 people):**  
    - Design programs (≤10 cost) to maximize funding.  
    - **Points:** Funding score each round + 15-point bonus if final true quality ≥20.  
    - *Instruct them:* "Build programs you believe in, but secure funding to keep your doors open!"  

  - **Agency (9 people):**  
    - Use historical data to create a linear funding formula: **Pick 4 features, assign weights (e.g., "Teachers × 3 + Meals × 2")**.  
    - **Points:** Average true quality of *all* provider programs in Round 3.  
    - *Instruct them:* "Maximize true program quality with your formula."  

  - **Rounds:**  
    1. Agency picks 4 features/weights → Providers submit programs.  
    2. Agency revises (swap ≤2 features or change weights) → Providers resubmit.  
    3. Repeat Round 2.  
  - **After each round:** Project a table showing:  
    - Provider ID | Funding Score | Measured Quality (true + noise)  
    - **Averages** for funding/quality (highlight these).  

  ---

  ### **Timeline (90 Min)**  
  - **0:00–0:05:** Introduce cover story. Split group: 9 agency, 9 providers.  
  - **0:05–0:20:** Agency designs formula (using historical data). Providers design Round 1 programs.  
  - **0:20–0:30:** Collect programs. Project Round 1 results (funding + noisy quality).  
  - **0:30–0:40:** Agency revises; Providers redesign programs.  
  - **0:40–0:50:** Project Round 2 results.  
  - **0:50–1:00:** Agency revises; Providers redesign.  
  - **1:00–1:10:** Project Round 3 results.  
  - **1:10–1:30:** Debrief (structure below).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Providers refuse to game ("We’ll stay honest!"):**  
     - **Preempt:** Emphasize, "Without funding, your program closes. Kids lose access. Design something fundable *and* good."  
     - **In-game:** If a program scores low funding, say: "Your funding is insufficient to operate next year."  

  2. **One player breaks the game (e.g., maxes cheap features):**  
     - **Lean in:** "Notice how Provider 3 exploited the formula? This happens in real systems!"  
     - **Agency response:** They’ll likely adjust weights next round (e.g., devalue gamed features).  

  3. **Agency picks irrelevant features (e.g., "Weekend hours × 10"):**  
     - **Trust:** Historical data shows weak/noisy links (e.g., Weekend hours add 0 to quality). They’ll self-correct after Round 1.  

  4. **Uneven groups (e.g., 11 people):**  
     - Assign 5 agency, 6 providers (or vice versa). Scale agency points: (Total true quality) ÷ (number of providers).  

  ---

  ### **Debrief Protocol (20 Min)**  
  **Project:**  
  - Graph of average funding score ↗️ and true quality ↘️/➡️ over rounds.  
  - True quality function (show interactions).  
  - Top 3 funded programs in Round 3 vs. their true quality (often low).  

  **Guide Discussion:**  
  1. **Lossy Channel:** "The formula measured 4 things, but quality depended on 12 + interactions. What happened when you pushed optimization further?" → *Proxy collapsed under pressure.*  
  2. **Rank Correlation Collapse:** "In Round 1, funding and quality loosely correlated. By Round 3, did funding predict quality *among top programs*?" → *No: winners gamed the proxy.*  
  3. **Noise + Optimization = Blindness:** "Agency, when quality dipped in Round 1, was it noise or gaming? Could you tell?" → *Ambiguity prevents diagnosis.*  
  4. **No Villains:** "Providers, did you feel unethical? Or were you trying to help kids within the system?" → *Gaming emerges from constraints.*  

  **Bridge to Reality:**  
  > "In this game, *I* held the ‘true quality’ rubric. In life, no one does. We argue about proxies because we can’t agree on or measure the real goal. That makes gaming even harder to spot—and far scarier."

  ---

  ### **What the Game CAN’T Capture**  
  **The True Goal is Unknowable/Uncontested:**  
  - Here, you (the facilitator) are omniscient. Reality lacks this. We often *disagree* on what "true quality" is (e.g., is it test scores? creativity? equity?). Optimization can lock in flawed definitions.  
  - **Say aloud:** "In the real world, we fight about the rubric itself. A proxy isn’t just lossy—it might be *wrong*."  

  **Mitigation:** Use the debrief to surface debates (e.g., "Should ‘van safety’ be part of quality? Who decides?").  

  ---

  ### **Why This Works**  
  - **Agency revises:** Feels iterative/realistic.  
  - **Noise:** Forces ambiguity (no "aha" until reveal).  
  - **Providers’ bonus:** Incentivizes long-term quality, making gaming feel ethically gray (not evil).  
  - **Interactions:** Simple enough to compute live, complex enough to break linear proxies.  

  **Run it cold once with colleagues to tweak weights/timing. Good luck!**
