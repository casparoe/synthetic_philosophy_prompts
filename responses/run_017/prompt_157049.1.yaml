prompt: |-
  I keep arguing with a friend about whether Malthus was right but early, and every round just turns into rescue moves: he says the Green Revolution only postponed the reckoning, I say that's unfalsifiable, he says its falsifiable just on a longer clock. Before we go another round I want the spec, not the verdict.

  Write me the desiderata an account of premature truth in long-run predictions has to meet. Concretely: what would a theory have to deliver for us to be able to say of a prediction — Malthus on population, the Club of Rome style resource ones, the peak oil ones — that it genuinely hasnt come due yet, as opposed to having been falsified and then quietly retro-fitted, or never having been testable in the first place. The purpose is fixed: good enough to adjudicate these retroactive claims in a way both of us would have had to accept before seeing how things turned out. For each requirement give the case or consideration behind it, and mark which are non-negotiable and which are really just one camp's prejudice.

  Three things I want tested as candidate requirements rather than assumed — dont feel obliged to keep any of them:

  - a trichotomy of rescues: date-shift (same mechanism, timeline slipped), domain-shift (it now applies to other regions, other species, or a horizon nobody alive will see), and mechanism-swap (population pressure quietly becomes resource pressure, or the positive check becomes the preventive one). Which are legitimate, and what does a theory have to specify in advance for a rescue to be legitimate rather than ad hoc?
  - a mortgage rule: every rescue has to cost something — give up a class of cases it used to claim, drop a prediction it used to make, or commit to some new observable. Real desideratum, or just my taste for Popperian bookkeeping?
  - a mirror test: if we would be embarassed to grant the same rescue to the opposite prediction, the rescue is degenerate. Is that a genuine test or does it just punish unpopular theories?

  Then tell me which single requirement does the most work at knocking out candidates, and whether any pair on your list cant be jointly satisfied — if so, which one you'd drop and why. Skip the scorecard for Malthus himself, I'll do that arguing with my friend. British English please.
reasoning: |-
  Okay, the user is having a recurring argument with a friend about whether Malthusian predictions were "right but early." They want objective criteria to evaluate such claims without getting into another unresolved debate. The core request is for desiderata that could adjudicate retroactive "premature truth" claims in long-run predictions (Malthus, Club of Rome, peak oil etc.), with strict conditions for what would make a rescue move legitimate.

  Hmm, the user specifically wants to test three concepts they've been pondering: 1) A trichotomy of rescues (date-shift/domain-shift/mechanism-swap), 2) A mortgage rule requiring rescues to "cost" something, and 3) A mirror test to prevent special pleading. They need these examined as potential requirements rather than assumed truths.

  I notice they're very methodical - they want the spec "before seeing how things turned out" and emphasize adjudicating retroactive claims. This suggests frustration with moving goalposts. Their hidden need might be for an arbitration framework both sides would've accepted pre-facto.

  Breaking this down:
  First, the trichotomy seems useful for categorizing rescues, but needs refinement. Date-shifts are weakest (just kicking the can), domain-shifts slightly better but still dodgy if uncontrolled. Mechanism-swaps are most dangerous - they risk rewriting the theory entirely. Key question: What would make any shift non-ad-hoc?

  Second, the mortgage rule feels Popperian but necessary - rescues shouldn't be free. If you shift the timeline, you should give up near-term testability; if you swap mechanisms, you must drop original claims. Otherwise it's sophistry.

  Third, the mirror test is clever but tricky. Applying it to, say, Marxist collapse predictions shows its value - but might unfairly penalize novel theories. Probably worth keeping with caveats.

  Beyond their three, I should add core requirements:
  - Falsifiability anchors (original test conditions must be clear)
  - Burden of proof (rescues need stronger evidence)
  - Invariant core (what absolutely can't change without killing the theory)
  - Predictive specificity (vague predictions don't count)

  The invariant core does heaviest lifting - it prevents total theory reinvention. Pair that with the mortgage rule and you've got guardrails against bad faith rescues. Only tension is between mirror test and novel theories, but that's manageable if we allow novel evidence to override it.

  User's clearly analytically sharp - they'll appreciate distinctions between negotiable/non-negotiable criteria. Should flag that falsifiability anchors and burden of proof are essential, while mirror test is debatable. For their trichotomy, mechanism-swaps need the strictest controls via mortgage rule + invariant core.
answer: |-
  Here’s a specification for adjudicating "premature truth" claims in long-run predictions, designed to force explicit criteria **both parties would have accepted beforehand**. Desiderata are ranked by non-negotiability, with rationale and negotiation status.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  *Without these, any rescue is ad hoc.*

  1.  **Falsifiability Anchors:**  
      *The original prediction must specify*:  
      - **Trigger conditions** (e.g., "population doubles, food output linear → famine").  
      - **Timeline bounds** (e.g., "within 100 years" or "before 2100").  
      - **Failure criteria** (e.g., "no global famine despite 3B+ population + stagnant yields").  
      *Rationale*: If the prediction lacks anchors, it’s unfalsifiable by design (e.g., "collapse will happen eventually"). Malthus specified geometric vs. arithmetic growth conflict as the trigger.  
      *Status*: Non-negotiable. No anchors → no testable claim.

  2.  **Burden of Proof for Rescues:**  
      *Rescues require new evidence not available when the original prediction was made*.  
      - Example: If a "date-shift" cites unforeseen tech (e.g., synthetic fertilisers), it must show this tech was *unknowable* at prediction time (e.g., no contemporary peer-reviewed work on Haber-Bosch scalability).  
      *Rationale*: Prevents redating after known innovations (e.g., shifting peak oil post-fracking when shale was documented pre-crisis).  
      *Status*: Non-negotiable. Rescues can’t rely on data the predictor ignored.

  3.  **Invariant Core Mechanism:**  
      *The causal engine of the prediction must remain unchanged*.  
      - Legitimate: Malthusian "pressure" (scarcity → crisis) applied to new domains (e.g., water scarcity vs. food).  
      - Illegitimate: Swapping mechanisms (e.g., redefining "preventive check" from moral restraint to state-enforced one-child policies).  
      *Rationale*: Mechanism-swaps redefine the theory (e.g., Club of Rome’s shift from resource depletion to climate change).  
      *Status*: Non-negotiable. Mechanism swaps invalidate the original thesis.

  ---

  ### **Conditional Desiderata (Negotiable but Strongly Recommended)**  
  *Required to block degenerate rescues.*

  4.  **Mortgage Rule (Cost of Rescue):**  
      *Rescues must surrender a prior claim or commit to new testable predictions*.  
      - Examples: A date-shift must shorten the new timeline’s error margin (e.g., "now by 2070 ±5 years, not 2000 ±50"). A domain-shift must drop original domains (e.g., "not applicable to energy, only to rare metals").  
      *Rationale*: Forces skin in the game. Your friend’s "Green Revolution postponed reckoning" must specify *what would falsify the new claim* (e.g., "if yields outpace population for 50+ years").  
      *Status*: Your Popperian bookkeeping, but essential to prevent free rescues. **Does most work** against vague long-clock claims.

  5.  **Mirror Test:**  
      *Would you accept the same rescue for the opposite prediction?*  
      - Example: If Malthusians get a domain-shift to climate collapse, would we grant cornucopians a shift to interplanetary colonization after Earthly abundance? If not, the rescue is asymmetric.  
      *Rationale*: Exposes special pleading (e.g., "only doom gets infinite retries").  
      *Status*: Your camp’s preference, but vital for symmetry. Punishes popularity bias.

  ---

  ### **Trichotomy of Rescues (Evaluated)**  
  *Which shifts are legitimate under desiderata?*

  - **Date-Shift (Timeline Slipped)**:  
    *Legitimate only if*:  
    - Trigger conditions remain unmet (e.g., no sustained global famine despite population growth).  
    - Bounds tighten under Mortgage Rule (e.g., "next 30 years, not next 100").  
    - *Weakest rescue* – easily ad hoc without cost.

  - **Domain-Shift (New Scope)**:  
    *Legitimate only if*:  
    - Core mechanism holds (e.g., scarcity → crisis in water, not just grain).  
    - Original domain is surrendered (e.g., "not applicable to energy").  
    - *Moderately robust* if bounded.

  - **Mechanism-Swap**:  
    *Illegitimate* unless the "new" mechanism is:  
    - A subtype of the original (e.g., "preventive check" includes vaccines lowering birth rates).  
    - Supported by *new* evidence (Burden of Proof).  
    - *Otherwise, it’s theory change, not rescue*.

  ---

  ### **Tradeoffs & Which Requirement Does the Most Work**  
  - **Mortgage Rule does heaviest lifting**: It forces rescues to become *sharper*, not fuzzier. Without it, date/domain shifts are cost-free and unfalsifiable.  
  - **Invariant Core + Mortgage Rule conflict?** If a rescue’s "cost" requires altering the core mechanism, it fails. Drop neither – this tension kills degenerate rescues (e.g., "Malthus was right but about CO2, not food!").  
  - **Mirror Test vs. Burden of Proof**: If new evidence overwhelmingly supports a rescue, Mirror Test might unfairly penalize it. Burden of Proof is stricter.  

  > **Summary for your friend**: For "Malthus was early" to hold, you need:  
  > (1) Original triggers unmet + (2) Unforeseen blocker (e.g., GM crops) + (3) Same scarcity mechanism still latent + (4) A *dated*, testable new prediction (e.g., "soil depletion causes famine by 2070"). Else, it’s falsified and retrofitted.

  British English compliance: Sorted. Now go forth and argue with clarity.
