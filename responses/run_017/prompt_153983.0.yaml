  **Word count**: 795.  
  **Glossary**:  
  - \(g(f)\): Asymptotic growth rate for fraction \(f\).  
  - \(q\): Probability of ruin restoration.  
  - \(f^*\): Kelly-optimal fraction.  
  - EU: Expected utility theory.
