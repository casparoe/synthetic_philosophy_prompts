  We are moderating an adversarial collaboration between Camp A (geometric rationality / time-average growth) and Camp B (expected utility theory). We need to produce a document with:
  I. Agreed Claims (math and scope)
  II. Disagreements Table (stated in each camp's own words)
  III. Cruxes with concrete cases and predictions

  First, we establish common ground.

  I. Agreed Claims:

  1. **Long-Run Growth for Repeated Bets**: For an infinitely repeated sequence of independent, identically distributed (i.i.d.) multiplicative bets, the long-run growth rate of wealth is almost surely given by the expected log return. That is, if wealth evolves as \( W_T = W_0 \prod_{t=1}^T R_t \), where \( R_t \) is the gross return at time t, then the asymptotic growth rate is \( \lim_{T \to \infty} \frac{1}{T} \log(W_T / W_0) = \mathbb{E}[\log R_1] \), provided the expectation exists.

  2. **Kelly Criterion**: For a single favorable bet repeated over time, the fixed fraction that maximizes the expected log wealth (and hence the long-run growth rate) is given by the Kelly criterion. This fraction is optimal in the sense that it maximizes the asymptotic growth rate.

  3. **Ruin as Absorbing State**: If a bet leads to ruin (wealth = 0) and ruin is an absorbing state (i.e., once ruined, the agent cannot bet again and future growth is 0), then any strategy that has a positive probability of ruin will have a growth rate of \(-\infty\) in the long run. Hence, the log-optimal strategy in such a setting must avoid ruin with probability 1.

  4. **Randomization of Stake vs. Commitment**: 
     - If an agent randomizes their betting fraction at each round (i.i.d. across time) on a single bankroll, then the long-run growth rate is the expectation of the log growth rate for the chosen fraction. By Jensen's inequality, if the fractions are not all the same, this growth rate is strictly less than the growth rate achieved by the best fixed fraction (unless the fractions are all the same). Therefore, randomizing the fraction leads to a strictly lower growth rate than committing to the optimal fixed fraction.
     - However, if the agent splits the initial wealth into k independent sub-bankrolls, each betting a fixed (but possibly different) fraction on the same repeated bet, then the overall growth rate (for the entire wealth) is the average of the growth rates of the sub-bankrolls. In particular, if each sub-bankroll uses a fixed fraction, then the overall growth rate is the average of their individual growth rates. Therefore, if one sub-bankroll uses the optimal fraction, the overall growth rate is the same as that of the optimal fraction. Moreover, if the fractions used in the sub-bankrolls are chosen to be the same (and optimal), then the growth rate is the same as that of a single bankroll with the optimal fraction.

  5. **Scope of Each Theory**:
     - Camp A views their theory as prescribing for an individual who faces a long sequence of multiplicative bets (so that wealth compounds). They hold that for such a setting, rationality requires maximizing the long-run growth rate, which leads to maximizing expected log wealth at each step (or for fixed fractions, over time).
     - Camp B views expected utility theory as a general framework for rational choice under uncertainty, applicable to any decision problem (one-shot or repeated, additive or multiplicative). They see the log utility as one possible utility function (which might be chosen by an agent who is specifically concerned with long-term growth) but not the only rational one.

  II. Disagreements Table:

  | Camp A's Statement | Camp B's Statement |
  |-------------------|-------------------|
  | For an agent facing a long sequence of multiplicative bets, rationality requires maximizing the long-run growth rate of wealth. Any other strategy is irrational because it will be dominated in the long run. | Expected utility theory is the universal framework for rational choice. The log utility is one way to capture growth preferences, but other utility functions can be equally rational. The geometric growth argument is just a special case of expected utility maximization with log utility. |
  | The growth-rate argument is not just a special case of expected utility; it is the correct objective for a rational agent in repeated multiplicative settings. Expected wealth maximization (or expected utility with a different utility) is a mistake because it leads to strategies that are not growth-optimal and that will almost surely underperform in the long run. | The geometric growth story has nothing to say about one-shot decisions or finite horizons. Moreover, the long-run argument is just a justification for choosing log utility, but it is not the only rational choice. For example, an agent with a finite horizon or one who is more risk-averse might choose a different utility. |
  | The asymmetry between randomizing the stake in a single bankroll (which reduces growth) and splitting into sub-bankrolls (which does not) is illuminating: it shows that the geometric growth criterion cares about the path of wealth. Randomizing the stake introduces volatility that reduces the growth rate, whereas splitting into sub-bankrolls is parallel and thus avoids cross-time volatility. This is a feature, not a bug. | The asymmetry between randomizing the stake and splitting into sub-bankrolls is a mathematical curiosity but does not reveal a deep truth about rationality. Expected utility theory can account for both: if an agent's utility function is log, then she will not randomize the stake and may split if that is beneficial. But if the utility function is different, then the evaluation of the two strategies will change accordingly. |

