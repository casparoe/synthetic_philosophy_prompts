  Its me again — retired atmospheric chemist, been reading decision theory for fun since I retired, and somehow got volunteered to moderate an adversarial collaboration between two camps who've been shouting past each other in a forum I frequent.

  Camp A, the geometric rationality / time-average growth people: for a single agent whose wealth compounds multiplicatively over a long sequence of bets, rationality requires maximising the growth rate of wealth (i.e. the log), and maximising expected wealth or expected utility over money is not a different taste but a mistake. Camp B, the expected utility people: log is just one utility function among many, the growth-rate argument either collapses back into "maximise expected log" or quietly helps itself to time-averaging for the individual, and for one-shot or finite-horizon problems the geometric story has nothing to say.

  Write the document they'd both actually sign at the end. First a numbered section of agreed claims — about the maths (what really holds about long-run growth, about ruin when it is absorbing, about what happens to growth if you randomise your stake instead of committing to one), and about which decision problems each view is even a theory of. Then a disagreements table: every disagreement stated twice, once in A's own words and once in B's, with neither side made to sound silly. Then the cruxes, and for each crux a concrete case or calculation both sides accept as bearing on it, with each side's prediction written down in advance.

  Two cases I want used, because I think they're where it bites. One: our bettor can split her capital into k independent sub-bankrolls, bet a different fixed fraction in each on the same repeated favourable bet, and recombine after T rounds. As far as I can work it out, a single bankroll that randomises its stake each round grows strictly slower than one that commits to the best fraction, while splitting into parallel sub-bankrolls is asymptotically no worse than the best single fraction — check that, and say whether the A side should find that asymmetry suspicious or illuminating, especially when the "sub-bankrolls" are different members of a community sharing one pot. Two: an all-or-nothing repeated bet that wipes you out with probability 1−p, except that with probability q a patron restores your stake after ruin, so ruin is no longer absorbing. At q = 0 the log view refuses outright; for tiny q it looks like it accepts. Is that jump a reductio of the geometric side, or just what any seriously ruin-averse preference does?

  Also tell me which parts of this are merely verbal. I suspect the "rationality requires" versus "that's just a utility function" row is partly a fight about the word rational, but not entirely, and I want to know where the verbal bit stops and the real bit starts. Keep it under about 800 words and dont fudge the maths — I can follow a derivation.
