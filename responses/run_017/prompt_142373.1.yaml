prompt: |-
  I'm writing a short position paper for a workshop on decision-making under normative uncertainty — half the room will be philosophers, half people who have to make funding and research decisions on behalf of others, so I've tried to state my views in plain terms and without hedge-words — and before I circulate it I want to know whether the package I've assembled actually hangs together. Here, as compressed as I can make it, is where I've landed.

  (a) The right response to normative uncertainty is to hedge: assign each of the first-order normative theories I take seriously my credence in it, weight how much it favors each available option by that credence, and choose the option with the highest weighted total. I individuate theories coarsely for this purpose — utilitarianism, pluralist deontology, contractualism, a virtue-theoretical view — rather than splitting each into variants. (b) But I resist a move that (a) appears to need. Most of the theories I give non-negligible credence to are not consequentialist: they contain constraints, options, and supererogation, and they do not rank options by how much value each produces. So I don't think every theory can be made to yield a cardinal measure of the degree to which it favors an option, and I especially don't think a deontic constraint should be represented as a very large disvalue — that strikes me as misdescribing what such a theory says, not merely as leaving something unmeasured. (c) I reject what I'll call the domination of tiny chances: I don't accept that for any small credence there is a payoff large enough that the product swamps every competing consideration, and in particular I am unmoved by arguments of the form that some small chance of shaping an astronomically large future beats everything else. (d) At the same time I am a strict probabilist about credence: credences satisfy the probability calculus and update by conditionalization; the practical stakes of a decision do not get to raise or lower the credence itself; and adjusting credences at the point of decision — discounting them, capping them, treating small ones as zero because the payoff makes me nervous — is ad hoc. (e) I take the persistent disagreement of people I count as epistemic peers in moral philosophy to be genuine evidence, and I think it should flatten my credence distribution substantially toward rough parity among a handful of views even where my own arguments point one way; and I don't see why this should stop at the first-order level, since my peers disagree about how to respond to normative uncertainty itself. (f) I think I have weighty obligations to particular others — my collaborators, my students, my own long-standing projects — that are not merely instrumental contributions to impartial value and that do not disappear under aggregation. (g) And here is the case I test everything against: a research protocol would expose one identifiable, non-consenting person to a small risk of death; I have about 0.9 credence in a pluralist view that forbids this regardless of the aggregate benefit, and about 0.1 in a utilitarian view on which the protocol has roughly a one-in-a-thousand chance of unlocking something that would go extremely well for an astronomically large number of future people and is otherwise worthless. I think the answer is that we don't run it; I think I'd give that answer if the chance were one in a million and the payoff a million times larger; and I think I'd go on giving it as my credence in the utilitarian view rose, until somewhere near the very top of the range the answer would switch — but not gradually, and not because the stakes had grown. (h) Finally, I think that very often the right thing is to postpone the decision and go do more moral philosophy first, and I want that to be an option inside the deliberation rather than an excuse for avoiding it.

  What I want is an audit, not a survey: I don't need the literature, a reading list, or a history of who said what. My collaborators keep insisting that (c) and (d) are the pair that cannot both be true; I'm not convinced, since it seems to me I might keep strict probabilism about credences and locate my resistance to astronomical-payoff reasoning somewhere else entirely, though I can't say exactly where — so please don't simply ratify their diagnosis either. Rank the tensions by how severe they actually are instead of listing them as equals; for each genuine one, say precisely what would have to give and what the cheapest repair would be; tell me which of the apparent conflicts dissolve under inspection and why; and where one of my commitments is not really inconsistent but merely underspecified, identify the missing parameter and how much work it is doing. If I had to surrender exactly one item to make the rest cohere, which should it be, and what would surrendering it cost me?
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've presented a complex position paper on decision-making under normative uncertainty and want an audit of internal coherence, not a literature review. The user is clearly an academic, probably in philosophy or a related field, preparing for a workshop with both philosophers and decision-makers. Their main concern is whether their assembled views hold together logically, especially since their collaborators argue that points (c) and (d) conflict.

  First, I need to unpack each of their points. They endorse hedging across coarse-grained normative theories (a), but reject cardinal measures for non-consequentialist theories (b). They resist domination by tiny chances with huge payoffs (c) while adhering strictly to probabilism about credences (d). They factor peer disagreement into flattening credences (e), acknowledge non-instrumental obligations (f), and use a specific test case involving risk to an individual versus astronomical future benefits (g). Finally, they see deferring decisions for more moral philosophy as a valid option (h).

  The collaborators' criticism about (c) and (d) being incompatible seems central. The user wants me to assess this without automatically siding with the collaborators. I need to check if strict probabilism (d) actually forces them to accept that any tiny credence could be swamped by sufficient stakes—which is what they reject in (c). 

  Looking deeper, the user might be wrestling with how to reconcile formal decision theory with substantive moral intuitions. Their test case (g) suggests they prioritize deontic constraints over utilitarian calculations even at extreme scales. But probabilism (d) might mathematically require that sufficiently large payoffs dominate, however small the credence. That’s the core tension. 

  I also need to examine other potential conflicts. For example, (b)’s rejection of cardinal measures might clash with (a)’s hedging, which seems to require some way of comparing options across theories. And (e)’s peer-disagreement-driven flattened credences could interact oddly with (g)’s abrupt threshold in the test case. 

  The user’s unspoken need might be for a framework that respects both their anti-consequentialist intuitions and their commitment to formal rigor—without forcing them to abandon either. They might also need this presented in a way that’s defensible to both philosophers and practitioners at their workshop. 

  I should prioritize the tensions: (c)-(d) is the sharpest, then (a)-(b), then (e)-(g). For (c)-(d), the cheapest fix might be to adjust probabilism to allow credence truncation, but that violates (d). Alternatively, they could refine their hedging framework to incorporate ordinal rankings or veto points. 

  Surrendering (d) (strict probabilism) would be costly but might resolve the biggest clash. If they allow practical stakes to affect credence interpretation (not the credence itself), they could block domination while keeping most of their framework. The cost? Formal elegance and some ad-hocness. 

  Other tensions might dissolve. For example, (b)’s rejection of cardinal measures isn’t fatal if hedging uses ranges or qualitative weights. And (e)’s flattened credences can coexist with (g) if peer disagreement doesn’t override personal thresholds. 

  The test case (g) is their anchor—they won’t budge there. So any solution must preserve its outcome. That means either bending decision theory or reinterpreting credences. 

  In the end, if they must surrender one thing, it should be strict probabilism (d). The cost is theoretical purity, but it saves their core intuitions. Alternatively, they could refine their hedging method to build in deontic thresholds, which might be less disruptive.
answer: |-
  Here's an audit of the tensions within your position, ranked by severity, with precise diagnoses, repairs, and a recommendation for a minimal surrender if forced:

  1.  **Severe Tension: (c) vs. (d) - Domination vs. Strict Probabilism**
      *   **The Conflict:** Strict probabilism (d) mandates that expected choice-worthiness (EC) calculations *must* use your actual credences and the theories' cardinal evaluations (if they exist) without alteration. (c) rejects the implication that a sufficiently large payoff, multiplied by *any* non-zero credence, can dominate. Probabilism implies that for *any* finite payoff, *some* sufficiently small credence makes it negligible. But crucially, it *also* implies that for *any* fixed non-zero credence (say, your 0.1 for utilitarianism), *some* sufficiently large payoff *must* dominate the EC calculation, overwhelming constraints from other theories with high credence. Your test case (g) explicitly rejects this for *any* finite payoff and credences up to near-certainty. (d) forces you to accept that your 0.1 *must* eventually win if the payoff is big enough; (c) says it never wins until credence is near 1, regardless of payoff size.
      *   **What Must Give:** Either (c) or (d) must yield, or the *method* in (a) must be fundamentally altered to avoid the EC calculation that creates this conflict under (d).
      *   **Cheapest Repair:** **Modify (a)'s Hedging Method.** Reject the standard "maximize EC" approach implied by (a) when non-consequentialist theories are involved. Instead, adopt a **lexical or threshold-based model** for constraints. A theory like your pluralist deontology (credence 0.9) doesn't just add a large negative weight; it imposes a *veto*. An option violating its core constraint (like imposing non-consensual lethal risk) is *inadmissible*, regardless of the EC calculation involving other theories. This locates your resistance within the *structure of decision-making under uncertainty* itself, bypassing the EC swamp while preserving strict credences (d). You avoid domination (c) by ruling out options violating high-credence constraints *before* any EC calculation on the remaining options. This directly explains the abrupt switch in (g) at high credence: the veto lifts.
      *   **Cost of Repair:** Requires explicitly building non-consequentialist structures (vetoes, lexical priorities) into the hedging framework. It makes the decision rule more complex than simple EC maximization.

  2.  **Significant Tension: (a) vs. (b) - Hedging Needs vs. Cardinality Denial**
      *   **The Conflict:** Your coarse-grained hedging (a) requires *some* way to compare the strength of different theories' recommendations for options. (b) forcefully argues that non-consequentialist theories (especially with constraints/options) often lack a cardinal measure of "degree of favorableness." Representing constraints as disvalues is a misdescription. Simple EC maximization seems impossible without cardinal inter-theoretic comparisons.
      *   **What Must Give:** Either (a) needs significant qualification/methodology change, or (b)'s denial needs softening for practical purposes.
      *   **Cheapest Repair:** **Refine (a)'s Methodology.** Acknowledge that cardinal measures are often unavailable or misleading for non-consequentialist theories. Instead of maximizing a precise EC, use a **range-based, qualitative, or dominance-based approach under normative uncertainty.** For example: "Option A is permissible only if favored or at least tolerated by all theories I give significant credence to, or if it's overwhelmingly favored by a theory with moderate+ credence when others are indifferent." Your test case (g) fits perfectly: utilitarianism *requires* the protocol, pluralism *forbids* it – no aggregation needed, the constraint vetoes. This coheres with the lexical repair for (c)/(d).
      *   **Cost of Repair:** Hedging becomes less precise and algorithmic, more reliant on judgment about theory compatibility and dominance. It might struggle with cases where theories conflict less starkly than in (g).

  3.  **Apparent Tension (Dissolves): (e) vs. (g) - Flattened Credence vs. Abrupt Switch**
      *   **The Conflict:** (e) suggests peer disagreement flattens credences towards parity. (g) shows you holding 0.9 credence in a specific pluralist view against utilitarianism, with a sharp switch only near certainty. Doesn't (e) demand a much lower credence in pluralism?
      *   **Dissolution:** **Flattening ≠ Parity.** (e) says disagreement flattens credences *substantially* towards *rough* parity *among a handful of views*. It doesn't force absolute 1/n equality. You list utilitarianism, pluralist deontology, contractualism, virtue theory. Flattening could easily result in something like 0.4, 0.3, 0.2, 0.1 or 0.35, 0.3, 0.2, 0.15, etc. Your 0.9/0.1 split in (g) seems *inconsistent* with significant flattening (e) unless you have very strong personal reasons discounting peer disagreement *specifically* regarding the permissibility of non-consensual lethal risk. (e) likely *should* push your pluralism credence lower than 0.9 if peers seriously debate it. The *abruptness* of the switch in (g) is explained by the lexical veto model, not the credence level itself.
      *   **Resolution:** **Clarify/Modify (e) or (g).** Either acknowledge that your credence in pluralism *should* be lower (e.g., 0.6-0.7) due to (e), making the veto slightly less robust but still potentially decisive via the lexical model. Or, argue that *for this specific type of constraint*, peer disagreement is less pronounced or your epistemic position is stronger, justifying the higher credence *despite* (e). The core point about the *structure* of the decision (veto) in (g) remains valid.

  4.  **Underspecification: (f) - Obligations to Particular Others**
      *   **The Missing Parameter:** How do these obligations factor into the normative uncertainty framework? Are they:
          *   A *distinct normative theory* (e.g., "partialism") assigned its own credence within the hedging framework (a)?
          *   A *component* of your favored pluralist deontology?
          *   A *meta-principle* governing how first-order theories are interpreted or applied under uncertainty (e.g., biasing against options that violate these obligations)?
      *   **Work Being Done:** The role of (f) determines its interaction with other points. If it's a separate theory in (a), its credence and how it ranks options (cardinal or ordinal?) matter. If part of pluralism, it strengthens that view. If a meta-principle, it might constrain the application of other theories (e.g., "even if utilitarianism favors this, my obligation to my students means I can't choose it").
      *   **Specification Needed:** Integrate (f) explicitly into your framework. The lexical veto model could potentially accommodate it as another source of constraints, depending on its basis.

  5.  **Coherence: (h) - Postponement**
      *   **Status:** (h) is consistent with the overall picture. If uncertainty is high and options are complex/non-urgent, the lexical/veto model might frequently yield indeterminacy (no option satisfies all constraints/dominance conditions). Postponement for more philosophy becomes the rational "option" within deliberation under uncertainty. It doesn't conflict with (a)-(g).

  **If Forced to Surrender Exactly One Item:**

  *   **Surrender (d) - Strict Probabilism (at the practical decision stage).**
  *   **Why:** This is the core of the (c)/(d) conflict. (c) and your test case (g) are central intuitions you won't abandon. (a) needs modification anyway due to (b). Surrendering (d) allows you to keep the core intuitions (c, g) and modify (a) to incorporate vetoes/lexical priorities without violating a rigid probabilist dogma about *decision rules*. You can still maintain probabilism for *belief formation and updating* (credences are probabilities via (e), update by conditionalization).
  *   **What Surrendering (d) Means:** You accept that when *applying credences in practical choice* under deep normative uncertainty involving non-consequentialist theories, a simple EC maximization rule is inadequate. You allow decision rules that treat credences non-linearly or impose structural constraints (like vetoes) based on the *content* of the theories, even if this violates the letter of probabilism's application to choice. Your credences remain probabilities, but your *choice rule* isn't strictly dictated by multiplying them by cardinal values.
  *   **Cost:** Loss of formal elegance and adherence to a seemingly "pure" Bayesian decision theory under normative uncertainty. Potential accusations of ad-hocness ("where do the veto thresholds come from?"). Requires more justification for the alternative decision rule (lexical/threshold-based).

  **Conclusion:** Your package has internal friction, primarily between your rejection of domination by tiny chances/high stakes (c) and strict probabilism applied to decision-making (d), exacerbated by the need to hedge non-consequentialist theories lacking cardinal measures (a vs. b). The most coherent path forward is to **modify your hedging methodology (a) to incorporate a lexical or threshold-based model for constraints** (resolving a vs. b and c vs. d simultaneously). This necessitates a *practical* departure from strict probabilism *in the choice rule* (effectively surrendering d in practice, though perhaps not in belief formation), but preserves your core commitments (c, g) and resolves the major tension flagged by your collaborators. Clarifying the role of peer disagreement (e) relative to your test case credences and integrating your obligations (f) are important but secondary tasks. Postponement (h) fits naturally. The resulting position is robust, addresses your test case intuitively, and avoids the pitfalls you identify.
