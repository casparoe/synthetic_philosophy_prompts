  The crux is step (5). The user mentioned others rejected this step but it didn't satisfy them. Why might that be? Perhaps because the connection between reference and belief feels intuitive. But here's what I think: when we apply the permutation to our own language, something breaks. The homophonic translation has a privileged status that schmenglish lacks - it's how we actually think and reason. 

