prompt: |-
  I'm a second-year PhD student in political economy and I need to get a two-page dissertation fellowship proposal together by the end of the month, and I want the proposal to be built around an idea I can't quite get into shape on my own. Here's where I'm at. The literature on why some countries are rich is usually presented as a three-way horse race: institutions (the colonial-origins story, settler mortality as a source of exogenous variation in institutional quality, the reversal-of-fortune pattern where places that were rich in 1500 are poor now), geography (disease ecology, latitude, distance from the coast, continental orientation and which crops and animals were domesticable), and culture (trust, work norms, religion, the persistence of things brought by settlers). What bugs me is that everyone argues about which of these has more explanatory power in a cross-country regression, when as far as I can tell they aren't independently assignable treatments at all — they're bundled together in the actual sample, and each of the designs people reach for identifies a different thing. The instrument identifies the effect of institutions given one particular colonial path and not for countries that were never colonies; the twin-country comparisons (the Korea split, the Germany split, ethnic groups cut in half by a colonial border living under different national institutions) have something like n = 1 and differ along many axes at once; the geography variables barely move over time and so can't explain a takeoff even if they explain a level. My rough suspicion is that the effective number of independent observations in the cross-national data is tiny — call it eight or ten rather than 150 — once you account for colonial-era common shocks and the fact that everything diffuses to its neighbors, and that a lot of the confidence in the literature comes from a sample size that isn't really there.

  So the thing I want the proposal to actually do is change the question rather than add another identification strategy. Instead of asking which cause wins, I want to ask: for each pair of hypotheses, what is the minimal observation, natural experiment, or hypothetical intervention that would tell them apart, and does the historical record contain anything that comes close? Two moves I think matter and can't fully articulate. First, portability: institutions are in principle transferable, geography isn't, and culture is somewhere in between (it travels with people, via migration and diaspora), so two hypotheses that fit all existing data equally well can still disagree sharply about what would happen if you moved the same institutions to a different place, or moved a population to a different place, or moved both. I want that turned into something like a portability test, not as a metaphor but as an explicit statement of what each hypothesis predicts about a counterfactual relocation. Second, I think some of the talk-past-each-other is that different people are asking different questions without noticing: some want to know what explains the *level* of income, some what explains the *variance over time* or the timing of takeoffs, and a variable that is basically frozen can answer one and not the other. My advisor says this is a methodology project dressed up as a substantive one, which may be true, and that's part of what the proposal has to reckon with.

  What I need from you is the proposal itself, in the shape a committee would expect: the question stated precisely enough that it has a determinate answer, why the existing positions leave it open (I mean the positions, not the papers — I'll fill in all citations myself, so please don't spend effort on references or checking whether I've described specific papers correctly, take the designs roughly as I've sketched them), the method including what I'd actually be doing month by month across the fellowship year, what a deliverable would look like for someone making a real decision rather than for a seminar, and an honest statement of what would count as the project failing — including the unglamorous possibility that the answer is no design separates these hypotheses and no counterfactual question separates them either, in which case I need to say what's left worth writing. Also give me half a page I can use to reply to the committee member who will definately say this is just philosophers' hand-wringing about causal inference and that the right response is to stop worrying and go find a new natural experiment, and tell me if you think the whole thing is too big for a year and what the natural cut-down version is, because I suspect it is and I'd rather hear it now than recieve the rejection.
reasoning: |-
  Alright, the user is a second-year PhD student in political economy struggling to shape their dissertation fellowship proposal. They're frustrated with the existing literature's approach to explaining national wealth, which pits institutions, geography, and culture against each other in cross-country regressions. They feel these factors aren't independent and that the statistical confidence is inflated due to non-independent observations. Their core insight is to shift the question from "which cause wins" to "how can we distinguish between these hypotheses using minimal observations or counterfactuals."

  First, I need to unpack their main concerns. They mention the non-portability of variables, the conflation of different research questions (level vs. variance over time), and the small effective sample size. Their advisor thinks it's a methodology project disguised as substantive, which adds pressure to frame it correctly for the committee.

  The user wants a structured proposal including a precise question, critique of existing literature, methodology, deliverables, and failure conditions. They also need a rebuttal to potential criticism that this is just philosophical hand-wringing. Plus, they're worried the scope is too big and need a scaled-down version.

  Key elements to address:
  - **Precise Question:** How to formulate the core question to avoid ambiguity? It should focus on pairwise hypothesis separation via minimal tests.
  - **Literature Critique:** Highlighting the limitations of current methods without getting bogged down in citations. Emphasize bundled treatments and non-independent observations.
  - **Methodology:** Breaking down the year into phases: conceptual framework, historical case identification, counterfactual analysis, and synthesis. Need concrete monthly steps.
  - **Deliverables:** Moving beyond academic papers to practical tools for researchers and policymakers.
  - **Failure Conditions:** Acknowledging if no separable hypotheses exist and pivoting to meta-analysis of limitations.
  - **Rebuttal Section:** Addressing the "philosophers' hand-wringing" critique by stressing actionable diagnostics and efficient research design.
  - **Scope Management:** Scaling down by focusing on one pair of hypotheses (e.g., institutions vs. geography) and specific historical cases like colonial transplants.

  Deep needs: The user might be seeking validation of their innovative approach while fearing it's too theoretical. They need reassurance that methodological contributions are valuable and feasible within a year. Also, they want to demonstrate practical applicability to appease committee members focused on empirical work.

  Potential pitfalls: The project could become too abstract. Grounding it in historical examples and creating tangible outputs (diagnostic toolkit) addresses this. Ensuring the scaled-down version still delivers meaningful insights is crucial. The rebuttal must convincingly argue that refining hypotheses saves resources compared to hunting new natural experiments.

  Structure-wise, the proposal should start with a clear title and abstract, followed by sections that methodically build the argument. The methodology section needs a realistic timeline. The failure discussion shows intellectual honesty, which committees appreciate. The rebuttal preempts criticism by linking the project to efficient empirical research.
answer: |-
  Here’s a structured, two-page dissertation fellowship proposal tailored to your core idea, designed to satisfy committee expectations while addressing your concerns about scope, feasibility, and potential critiques.

  ---

  **Dissertation Fellowship Proposal**  
  **Title:** *Hypothesis Separation in Political Economy: Minimal Tests for Institutions, Geography, and Culture*  

  ### 1. Research Question & Motivation  
  **Core Question:** *What minimal observational or counterfactual design can empirically distinguish between pairwise combinations of institutional, geographic, and cultural hypotheses of economic development, and do such designs exist in historical record?*  

  **Motivation:** The "horse-race" literature (Acemoglu et al. vs. Sachs vs. Weber/Inglehart) treats institutions, geography, and culture as separable "treatments." Yet, in practice, these factors are bundled: colonial institutions co-evolve with settler culture; geography constrains institutional portability; cultural norms diffuse spatially. Existing methods conflate identification strategies with distinct causal questions:  
  - **Institutional IVs** (e.g., settler mortality) capture effects *conditional on colonization*, not general institutional efficacy.  
  - **Twin-country designs** (e.g., Koreas) suffer from *n≈1* and uncontrolled confounders (e.g., post-split aid, ideology).  
  - **Geography/culture proxies** (e.g., malaria ecology, surveys) are static and cannot explain takeoffs.  

  Critically, the *effective sample size* is vastly inflated by spatial autocorrelation (e.g., European colonization waves) and common shocks (e.g., Cold War). The field thus conflates three distinct questions:  
  - **Levels**: Why is country *A* richer than *B* today?  
  - **Dynamics**: Why did *A* take off when it did?  
  - **Portability**: Could *A*’s institutions work in *B*?  

  This project shifts focus from "which factor wins?" to "what test can separate them?"  

  ---

  ### 2. Method & Work Plan  
  **Phase 1: Conceptual Toolkit (Months 1–3)**  
  - **Task 1a:** Formalize pairwise hypothesis conflicts (e.g., institutions vs. geography: "Portability Test" – *If institution X is transplanted to location Y, does it function identically?*).  
  - **Task 1b:** Define "minimal tests" – observational/natural experiments with maximal discriminatory power under resource constraints (e.g., a single border discontinuity).  

  **Phase 2: Historical Inventory (Months 4–7)**  
  - **Task 2a:** Catalog historical episodes approximating minimal tests:  
    - *Institutions vs. Geography*: Colonial transplants (e.g., British legal systems in India vs. Caribbean vs. temperate colonies).  
    - *Culture vs. Institutions*: Mass migrations (e.g., German settlers in Brazil vs. Poland under identical institutions).  
    - *Culture vs. Geography*: Diaspora communities (e.g., Chinese merchants in SE Asia vs. inland China).  
  - **Task 2b:** Assess design "closeness" using criteria: exogeneity, observability, confounder control.  

  **Phase 3: Counterfactual Analysis (Months 8–10)**  
  - **Task 3:** For hypotheses with no clean historical test, simulate portable interventions (e.g., "What if Singapore’s institutions were imposed on Bolivia?"), leveraging computational models (agent-based/structural) to compare predictions.  

  **Phase 4: Synthesis (Months 11–12)**  
  - **Task 4a:** Map "distinguishability frontier" – which hypotheses are separable given historical/data constraints?  
  - **Task 4b:** Develop diagnostic protocol for researchers: "If you claim X > Y, what test would falsify it?"  

  ---

  ### 3. Deliverable & Impact  
  **Output:** A framework for *diagnosing empirical separability* in political economy, including:  
  - A typology of minimal tests (e.g., "portability test," "migration test").  
  - A database of historical near-miss designs with feasibility ratings.  
  - Policy/prediction implications: e.g., if institutions are non-portable, IMF reforms may fail absent cultural preconditions.  

  **For Decision-Makers:** A flowchart: "To adjudicate between X and Y, prioritize evidence from [test class Z] – here’s where to look."  

  ---

  ### 4. Feasibility & Failure Modes  
  **Scope Management:**  
  - Focus on **one pairwise contrast** (e.g., institutions vs. geography) and **3–5 historical cases** (e.g., colonial transplants, resource shocks).  
  - **Cut-Down Version:** Drop computational modeling; rely on archival case studies (e.g., UN/colonial archives).  

  **Failure Conditions:**  
  - **Total Failure:** No historical test cleanly separates *any* pair of hypotheses. *Pivot*: Publish a meta-critique ("The Indistinguishability of Development Narratives") showing why horse-races are futile.  
  - **Partial Failure:** Some hypotheses separable, others not. *Deliverable*: "A typology of development arguments by testability."  
  - **Success Threshold:** Identifying *one* pair separable via historical data + protocol for future work.  

  ---

  ### 5. Rebuttal: "This Is Philosophers’ Hand-Wringing" (½ Page)  
  > "This project addresses a *practical* problem: researchers waste resources hunting natural experiments that cannot answer their questions because hypotheses are underspecified. Consider:  
  > - If institutions are non-portable (e.g., Caribbean sugar colonies), a 'new' natural experiment in a dissimilar context is uninformative.  
  > - If geography explains levels but not takeoffs (e.g., Egypt pre/post-Suez), regressions using static geo-proxies mislead policy.  
  >  
  > My aim is *efficiency*: a toolkit to match research designs to hypotheses. For example:  
  > - To test *institutional portability*, prioritize migrant enclaves (e.g., Japanese in Brazil) over cross-country IVs.  
  > - To test *geography vs. culture*, use disease/diaspora shocks (e.g., malaria eradication in Sicilian vs. Somali communities).  
  >  
  > This is not armchair philosophy – it is *applied methodology* to prevent overreach. If we cannot specify what would falsify a hypothesis, we are not doing science."  

  ---

  ### Why This Works  
  - **Novelty:** Moves beyond identification *within* paradigms to *testing the testability* of paradigms.  
  - **Scholarly Value:** Forces clarity on causal mechanisms ("What would change if we moved X?").  
  - **Committee Appeal:** Grounded in empirics (historical cases), outputs concrete (diagnostic toolkit), and acknowledges limitations.  
  - **Scope:** Cut-down version (1–2 hypothesis pairs + 3 cases) is feasible in a year.  

  **Next Step:** Flesh out one pairwise contrast (e.g., institutions vs. geography) as proof of concept in the proposal. This sharpens focus while keeping the framework general.
