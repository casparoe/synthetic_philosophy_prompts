prompt: |-
  I'm writing my term paper for a seminar on social ontology, on what it is for a group to act together, and I keep running into the same pattern: someone points at a single case — a duet, a mob, a committee — and claims it refutes the leading account. Before I add another case of my own, I want the specification. So: what would a theory of joint action have to get right to count as adequate — not adequate in general, but adequate for the job I need it to do, which is to underwrite attributions of obligation and blame to groups: who owes what to whom when a collective project goes wrong, and when one participant may rebuke another for not doing their part.

  Give me the requirements list — the cases it must handle, the distinctions it must not collapse, the results from elsewhere it must not contradict — with the consideration behind each requirement. The cases I most want covered are: mere convergence versus acting together; joint action under divergent private ends; a group that settles on an outcome no member individually endorses, as when a decision procedure aggregates votes into a result everyone voted against; the dissenting and the coerced member, who seem to be inside the first-person plural yet not bound in the same way; improvised joint action where roles are invented mid-course with no prior plan and no communication; coordination brokered by an algorithmic system no member understands, where no member grasps the whole plan and the convergence is nonetheless theirs; and long-running collectives whose membership turns over completely, where I am unsure whether the same we persists. The distinctions I don't want collapsed are: shared intention versus shared belief or acceptance, the group's act versus the members' acts, intending-together versus each intending that we do it, and joint action versus the joint causal production of an outcome nobody aimed at.

  Then mark which requirements are non-negotiable given that purpose and which are only the preferences of one research programme, such as reducibility to individual attitudes. Most importantly, flag any pair you suspect cannot be jointly satisfied: I suspect that demanding coverage of loose, dispersed, partly unwitting collectives pulls against demanding that joint action carry the distinctive normative residue — entitlement to rebuke, obligation to renegotiate, rather than merely to desist — that is supposed to separate it from parallel action, and I want to know whether that is a genuine trade-off or just my confusion. Finally, say which single requirement does the most work in excluding otherwise plausible theories. One line each on the plan-based, we-intention and joint-commitment families is enough; keep the weight on the criteria.
reasoning: |-
  Okay, the user is working on a term paper about social ontology, specifically on what it means for a group to act together. They want to attribute obligations and blame to groups when collective projects go wrong. They've noticed a pattern where theorists use single cases to refute leading accounts and want to avoid doing the same. Instead, they're asking for a set of criteria that a theory of joint action must meet to be adequate for their purpose.

  The user has listed several cases they want covered: mere convergence vs. acting together, joint action with divergent private ends, groups settling on outcomes no member individually endorses, dissenting or coerced members, improvised joint action without prior plans, coordination through opaque algorithmic systems, and long-running collectives with complete membership turnover. They also want to maintain distinctions between shared intention vs. belief, group vs. member acts, intending-together vs. each intending, and joint action vs. causal production.

  The key here is that the theory must support normative implications like obligations and entitlements to rebuke. I need to identify which requirements are non-negotiable for this purpose and which are more about theoretical preferences. The user suspects a tension between covering loose, dispersed groups and maintaining strong normative residues, so I should address whether this is a real trade-off.

  For non-negotiable requirements, the theory must explain normative consequences like obligations to contribute and entitlements to rebuke. It must also handle groups that settle on outcomes no one endorses and account for dissenting members who are still part of the "we." Without these, the theory can't underpin attributions of blame and obligation in problematic cases.

  Other requirements might be preferences, like reducibility to individual attitudes. Some theories require shared intentions to be reducible, while others accept irreducibly collective intentions. The user needs to know this isn't essential for their normative goals.

  The big trade-off is between covering fluid, opaque groups and maintaining robust normative residues. In loose collectives, like algorithmic coordination, it's hard to ground mutual obligations because members might not recognize each other as co-agents. However, perhaps the structure of interdependence or the collective's rules can create obligations even without mutual awareness. But this might weaken the entitlement to rebuke, leading to a genuine tension.

  The most demanding requirement is probably explaining the entitlement to rebuke. Many theories can show shared intentions but struggle with why members can rebuke each other. This requirement excludes theories that focus only on shared attitudes without mutual accountability.

  For existing theories: Bratman's shared cooperative activity requires mutual responsiveness and commitment, which might be too strong for improvised or opaque cases. Tuomela's we-intentions might work for dissenting members if they still we-intend, but not if they don't. Gilbert's joint commitment creates obligations but makes exit difficult, which is problematic for coerced members. Each has strengths and weaknesses relative to the listed requirements.

  The user needs clarity on which criteria are essential for their normative focus and where trade-offs exist. Highlighting the tension between coverage of diverse cases and robust normativity will help them structure their paper without getting sidetracked by counterexamples.
answer: |-
  Here’s a requirements list for a theory of joint action tailored to your normative purpose, structured by cases, distinctions, non-negotiables, and tensions. The core aim is **underpinning obligations/blame for collective project failures**, so normative force is paramount.

  ---

  ### **Non-Negotiable Requirements** (Essential for Obligation/Rebuke)  
  1. **Normative Bindingness**: Must explain why *participants* (not outsiders) have *standing to rebuke* each other for non-contribution, and why members incur *role-based obligations* (e.g., to renegotiate, compensate) beyond moral duties.  
     *→ Why?* Rebuke/obligation implies mutual accountability among co-agents.  

  2. **Dissenting & Coerced Members**: Must clarify why dissenters/coerced members are *included in the "we"* (e.g., liable for outcomes) yet may lack *full responsibility* (e.g., diminished blame).  
     *→ Why?* Groups often act despite internal opposition; theories must not conflate participation with endorsement.  

  3. **Aggregated Decisions**: Must handle cases where the group’s act (e.g., a committee’s vote) *binds members* even if *no individual intended/wanted that outcome*.  
     *→ Why?* Obligations arise from collective procedures, not individual preferences.  

  4. **Distinction: Joint Action vs. Mere Parallel Action**: Must ground why *rebuke is appropriate* when *I* fail *us* (e.g., skipping rehearsal) but not when *we* coincidentally act alike (e.g., both umbrellas open in rain).  
     *→ Why?* Otherwise, no basis for role-specific obligations.  

  ---

  ### **Cases to Cover** (With Normative Stakes)  
  5. **Divergent Private Ends**: Must allow members to act jointly (e.g., moving a sofa) *only for personal motives* (e.g., payment, impressing a friend) while still owing duties *to each other*.  
     *→ Why?* Shared goals ≠ shared motives; obligations persist despite self-interest.  

  6. **Improvised Coordination**: Must explain obligations in *emergent, unplanned* joint acts (e.g., strangers forming a human chain to save a drowning person) *without prior agreements*.  
     *→ Why?* Normative residue exists even without explicit commitment.  

  7. **Algorithmic Brokering**: Must cover cases where members coordinate via *opaque systems* (e.g., gig workers following app algorithms) *without mutual awareness*, yet owe duties *to the collective*.  
     *→ Why?* Modern collectives rely on impersonal mediation; obligations can’t require direct mutual recognition.  

  8. **Long-Running Groups w/ Membership Turnover**: Must explain how *obligations persist* when no original member remains (e.g., a corporation’s debt).  
     *→ Why?* Blame/obligation outlives individuals; the "we" must be reidentifiable over time.  

  ---

  ### **Distinctions to Preserve**  
  9. **Shared Intention vs. Shared Belief**: Must show that *intending together* (e.g., "we intend to J") grounds obligations, while *merely believing* we’ll act in parallel (e.g., crowd fleeing fire) does not.  
  10. **Group Act vs. Members’ Acts**: Must avoid collapsing the *collective’s action* (e.g., "the jury convicted") to *summed individual actions* (e.g., 12 jurors voting).  
      *→ Why?* Blame for collective failure (e.g., biased verdict) targets the group *as such*, not necessarily each member.  
  11. **Intending-Together vs. Each Intending That We J**: Must distinguish *we-mode* (e.g., "I intend *as part of us*") from *I-mode* (e.g., "I intend *that we* J").  
      *→ Why?* Latter allows unilateral detachment ("I no longer want us to J, so I quit"), undermining obligations.  

  ---

  ### **Constraints & Tensions**  
  - **⛔ Key Suspected Trade-off**: **Covering fluid/opaque groups** (e.g., algorithmically brokered collectives) **vs. robust normative residue**.  
    - *Why tension?* Loose collectives lack mutual awareness/commitment, weakening grounds for *interpersonal* rebuke.  
    - *Is it genuine?* **Yes**. If members don’t recognize co-participants as co-agents (e.g., Uber drivers), mutual obligations may reduce to system rules, not peer accountability. Theories must choose: weaken "rebuke" to system-sanctioned penalties, or exclude such cases from "genuine" joint action.  

  - **Most Exclusionary Requirement**: **#1 (Normative Bindingness)**. It excludes:  
    - *Purely causal accounts* (joint outcome ≠ joint action).  
    - *Shared belief/acceptance* theories (e.g., Searle) that lack mutual obligation.  
    - *Summative individualism* (no group-level obligations).  

  ---

  ### **Theories at a Glance**  
  - **Bratman (Shared Intention)**: Requires mutual responsiveness & commitment to mutual support. *Fails* dissenting members (#2), improvised acts (#6), algorithmic cases (#7).  
  - **Tuomela (We-Intention)**: "We-mode" attitudes bind members. *Struggles* with aggregated decisions (#3) if dissenters lack we-intentions.  
  - **Gilbert (Joint Commitment)**: Creates obligations via plural subject. *Fails* coerced members (#2), improvised acts (#6), and algorithmic cases (#7) due to required mutual avowal.  

  ---

  ### **Preferences (Not Strictly Necessary)**  
  - **Reducibility to Individual Attitudes**: Helpful but not essential; irreducibly collective intentions may better explain group obligations (#1, #10).  
  - **Mental State Transparency**: No need for members to *consciously* endorse collective goals (supports #5, #7).  
  - **Equality of Members**: Hierarchies (e.g., bosses/workers) can still generate obligations.  

  ### **Recommendation**  
  Prioritize **#1–#4** and **#9–#11** as your litmus tests. The tension in algorithmic/long-running cases (#7–8) is likely unavoidable—**flag it as a frontier problem**. Your suspicion is correct: theories covering *all* cases will dilute normativity; those insisting on robust obligations will exclude marginal groups. For your purpose, **favor normativity over inclusivity**.  

  Let me know if you want case-specific expansions or strategy notes for the paper.
