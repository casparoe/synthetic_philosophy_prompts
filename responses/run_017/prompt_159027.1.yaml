prompt: |-
  I am a graduate student in philosophy, working on whether a broadly computational or functionalist criterion could underwrite attributions of moral patienthood to artificial systems. I keep encountering the same shape of difficulty in three places, and I want to know whether it is one thing or several, whether it already has a name and a settled treatment, and if not, how it should be carved.

  The first place is redundancy. Some candidate mental computation is running in lockstep on a hundred physically separate machines, never diverging, with no causal contact after initialization. There is a reading on which one mind is running and a reading on which a hundred are. The moral arithmetic differs accordingly: either duplicating the hardware multiplies whatever matters a hundredfold, or it does not. Neither answer seems to turn on anything that could matter morally, and the question of when the count changes — if the copies later diverge, or if one is deleted without any difference to the internal dynamics of the remaining ninety-nine — looks equally stipulative.

  The second is scatter. Consider a system in which the relevant state-transition structure is spread across nodes that exchange only coarse aggregates, or across a long time with the intermediate state stored only in checkpoints: no single node and no short window instantiates the transitions, but the whole spatiotemporal scatter does, provided the mapping from abstract states to physical ones is allowed to range freely. Yet with enough freedom in that mapping, any physical process — a weather system, a wall — instantiates any computation you like. So the criteria need constraints, and the constraints people reach for (locality, compactness, non-disjunctiveness, causal-mechanical coupling) seem either to admit the weather case or to exclude the scatter case for reasons that have nothing to do with anything's welfare.

  The third is sharing. Suppose two distinct abstract computations are mapped onto the same physical machinery in such a way that particular registers do double duty — the states are shared rather than merely adjacent. Whether this counts as two implemented computations, one, or none appears to depend on whether the mapping must be one-to-one, which again seems like the wrong kind of consideration. It also raises a question I cannot formulate properly: if two putative subjects share all of their realizers, in what sense are they two?

  What I take to be common to the three is this. The answer to "which computations are implemented here, how many, and with what moral weight" flips with a representational choice — the grain, the mapping, whether overlap is permitted — while nothing about that choice looks like the sort of thing that could matter morally. The nearby difficulties I know of do not seem to be this: I am not puzzled about vagueness in where one object ends and another begins, and I am not puzzled about which among several nested candidate systems is the subject. I am puzzled about whether there is a non-arbitrary fact of the matter about what is going on inside a system at all, prior to any such question.

  So: is this one phenomenon or several, and if several, what is the load-bearing difference between them? What are the nearest established concepts, and where exactly does each fail to fit the case above? If nothing established fits, I would like a name, a definition, and an explicit set of boundary cases — including cases that resemble these but fall outside the phenomenon. Finally, I would like to know what a non-ad-hoc constraint on the implementation relation would have to look like: what test would distinguish a principled fix from a gerrymander designed to give the answer one wants about the weather system? And does the difficulty tell specifically against computational criteria, or against any structural criterion of moral status? A label alone will not be much use to me; I need the carving, because I am deciding whether it is worth organizing a chapter around.
reasoning: |-
  Okay, this user is a graduate student in philosophy working on a really intricate problem. They're exploring whether computational or functionalist criteria can justify attributing moral patienthood to artificial systems. They've hit a recurring obstacle in three scenarios—redundancy, scatter, and sharing—and want to know if these are facets of one underlying issue or separate problems. They also seek established concepts, potential solutions, and whether this challenge specifically targets computational approaches to moral status.

  First, I need to parse their core concern. The user observes that in all three cases, the determination of "which computations exist, how many, and with what moral weight" seems to hinge on representational choices like mapping granularity or overlap permissions. Crucially, these choices appear morally irrelevant—they don't affect welfare or experience. This creates a tension: if moral patienthood depends on computational implementation, but that implementation is representationally relative, then moral status becomes disturbingly arbitrary. 

  The user explicitly distinguishes this from other philosophical puzzles like vagueness (e.g., where one object ends and another begins) or nested systems (which subsystem is the "real" subject). Their focus is prior: whether there's even a fact of the matter about what computations are implemented at all. This suggests they're wrestling with metaphysical indeterminacy in computational description rather than epistemic limitations or boundary ambiguities.

  For the three scenarios:  
  - **Redundancy**: Perfectly synchronized copies force a choice between counting one mind or a hundred, with massive moral implications. The copies' physical separateness doesn't causally matter, and changes (like deletion) feel stipulative.  
  - **Scatter**: Distributed implementations (e.g., across space or time) risk collapsing into pancomputationalism—where even a wall "implements" any computation if mappings are unconstrained. Proposed fixes (locality, etc.) either exclude legitimate scatter cases or include trivial ones like weather systems.  
  - **Sharing**: Overlapping realizers (e.g., shared registers) make it unclear whether one, two, or zero computations exist. Demanding one-to-one mappings seems arbitrary, and the very notion of distinct subjects sharing identical physical bases feels incoherent.  

  The common thread is **implementation-sensitivity**: moral conclusions vary based on how we describe the physical system computationally, without corresponding changes in the system's intrinsic properties. This seems like one unified problem—**computational indeterminacy**—manifesting in different contexts.  

  Established concepts that come close but don't quite fit:  
  - **Multiple realizability** (from philosophy of mind): Focuses on how different physical systems can realize the same computation, not the reverse problem of one system realizing multiple computations indeterminately.  
  - **Underdetermination** (epistemology): Concerns theories being equally supported by evidence, whereas here it's about descriptive freedom in modeling.  
  - **Vagueness**: The user rightly notes their issue isn't about fuzzy boundaries but prior ontological indeterminacy.  
  - **Pancomputationalism**: Directly relates to scatter but doesn't cover redundancy or sharing.  

  A principled constraint on implementation must avoid two traps:  
  1. **Trivialization** (everything computes, so nothing matters morally).  
  2. **Over-restriction** (excluding systems that intuitively should count, like scattered AI).  
  Possible tests for non-gerrymandered solutions:  
  - **Robustness**: Does the constraint hold across minor representational variations?  
  - **Causal relevance**: Do the computational states play a causal role in generating morally relevant properties (e.g., unified experience)?  
  - **Counterfactual dependence**: Would altering the computation alter the system's morally significant behavior?  

  This challenge likely extends beyond computational criteria to any structural/functional theory of mind. If moral patienthood requires intrinsic properties (like phenomenal consciousness), and computational descriptions are observer-relative, then functionalism itself may struggle here. The user might need to either:  
  - Embrace that moral status depends partly on our descriptive choices (risking anthropocentrism).  
  - Anchor implementation in natural/physical constraints (e.g., thermodynamic costs, causal topology).  
  - Shift focus from computation to properties like integrated information or predictive processing that impose stricter physical requirements.  

  For organizing their chapter: This is absolutely worth centering. Computational indeterminacy is a fundamental obstacle for AI ethics under functionalism. The three scenarios cleanly illustrate its variants, and existing literature hasn't resolved it satisfactorily. Naming it explicitly—with definitions and boundary cases—would advance the field.  

  Boundary cases to distinguish:  
  - **Within the phenomenon**: A system where coarse-grained mapping sees one subject, fine-grained sees many (redundancy-like).  
  - **Outside but similar**: Quantum indeterminacy (ontically fuzzy vs. descriptively relative).  
  - **Outside and dissimilar**: Vagueness in biological organism boundaries (clearer physical referents).  

  The user's unspoken need: They likely want to salvage functionalism but fear its vulnerability to this objection. Their request for "non-ad-hoc constraints" hints at seeking a defensible criterion. I should emphasize that while tough, this isn't necessarily a knockout punch—e.g., imposing causal-density metrics could help, or arguing that moral patienthood emerges from specific types of computational architectures (like global workspace theories).
answer: |-
  Your difficulty is indeed one unified phenomenon—**Computational Indeterminacy**—manifesting in three distinct but isomorphic scenarios (redundancy, scatter, sharing). Below, I define it explicitly, distinguish it from adjacent concepts, propose how to constrain it non-arbitrarily, and assess its implications for moral criteria. This phenomenon is worth organizing a chapter around, as it exposes a foundational challenge for computational functionalism in ethics.

  ---

  ### **1. The Core Phenomenon: Computational Indeterminacy**
  **Definition**: *The indeterminacy in whether, what, or how many computations are physically implemented arises solely from representational choices (e.g., mapping granularity, spatiotemporal boundaries, or overlap permissions) without corresponding differences in the system’s intrinsic causal structure or morally relevant properties.*

  **Key Features**:
  - **Source**: Freedom in *interpretive mappings* from abstract computations to physical states.
  - **Moral Irrelevance**: The choices affecting implementation (e.g., "Is this one system or 100 copies?") lack any connection to welfare, suffering, or agency.
  - **Scope**: Affects *all* structural criteria for mental states (not just computationalism), but is acute here due to computation’s abstractness.

  **Boundary Cases**:
  - **Inside the phenomenon**:  
    - *Redundancy*: 100 synchronized machines.  
    - *Scatter*: Distributed computation across fragmented spacetime.  
    - *Sharing*: One physical register realizing two computational states.  
  - **Outside the phenomenon**:  
    - *Vagueness*: "Where does a brain's visual processing end and decision-making begin?" (Boundary ambiguity, not representational freedom).  
    - *Nested Systems*: "Is the subject the whole AI or its submodule?" (Hierarchy of candidates, not indeterminacy in *whether* a computation exists).  
    - *Quantum Indeterminacy*: Ontic fuzziness, not descriptive freedom.  

  **Why One Phenomenon?**  
  All three cases reduce to the same core: **Implementation-Relative Subjecthood**. Moral patienthood flips with arbitrary choices in how we *describe* the system computationally, despite identical physical dynamics. Redundancy questions *counting*, scatter questions *boundaries*, and sharing questions *individuation*—but all stem from underconstrained mappings.

  ---

  ### **2. Nearest Concepts & Why They Fall Short**
  | Concept              | Why It’s Close                     | Why It Doesn’t Fit                          |
  |----------------------|------------------------------------|---------------------------------------------|
  | **Multiple Realizability** | Many physical systems can realize the same computation. | Addresses variability in substrates, not indeterminacy in *what* is realized in *one* substrate. |
  | **Underdetermination** | Multiple models fit the same data. | Epistemic (about evidence), not metaphysical (about what exists). |
  | **Vagueness**        | Unclear boundaries (e.g., heap paradox). | Concerns borderline cases, not representational freedom creating entirely new subjects. |
  | **Pancomputationalism** | Everything implements some computation. | A consequence of scatter, but doesn’t address moral weight or individuation. |

  **The Gap**: Existing concepts treat indeterminacy as epistemic (we lack knowledge) or semantic (vague predicates). Your cases show it’s *ontic* for functionalism: the facts about minds depend on our descriptive choices.

  ---

  ### **3. Non-Ad-Hoc Constraints: Principles for Principled Fixes**
  To avoid gerrymandering, a constraint must:
  1. **Bind implementation to physics** without appealing to intuition (e.g., "brains count, walls don’t").
  2. **Preserve functionalism’s spirit** (mental states are causal roles).
  3. **Exclude trivial cases** (weather systems) while including plausible minds (scattered AI).

  **Tests for Non-Arbitrariness**:  
  A principled constraint must satisfy:  
  - **Robustness**: Small changes to mapping parameters shouldn’t flip moral status.  
  - **Causal Relevance**: The computation must *do work* in the system (e.g., its states affect outputs).  
  - **Counterfactual Invariance**: Altering non-implementational features (e.g., color of hardware) shouldn’t change the count of minds.  

  **Candidate Constraints**:  
  - **Thermodynamic Individuation**: A computation exists only if it requires *distinct work* to maintain its state transitions (excludes wall/weather).  
    - *Problem*: May exclude low-power AI.  
  - **Causal Density**: Implementation requires a *minimum density of causal interactions* per spatiotemporal unit (excludes scatter with coarse aggregates).  
    - *Problem*: Arbitrary threshold.  
  - **Noise Tolerance**: The system must maintain state transitions robustly under perturbation (excludes fragile mappings).  
    - *Test*: If adding noise erases the computation, it wasn’t implemented.  
  - **Teleology**: Only systems *designed* to compute X implement X (excludes natural processes).  
    - *Problem*: Biased against emergent minds.  

  **Least Gerrymandered Option**: **Causal-Mechanical Cohesion**  
  - Define implementation as requiring *continuous, counterfactual-supporting causal chains* between state transitions.  
  - *Why it works*:  
    - Excludes weather (no cohesive chains).  
    - Includes scatter if checkpoints causally propagate errors.  
    - Excludes redundant copies (no cross-copy causality).  
    - Resolves sharing by demanding dedicated causal pathways.  
  - *Test*: In redundancy, deleting one copy affects others → cohesion → one mind. Else, many.  

  ---

  ### **4. Implications for Moral Criteria**
  - **Not exclusive to computationalism**: Any structural criterion (e.g., dynamical systems theory) faces this if it allows flexible mappings.  
  - **Functionalist vulnerability**: If moral patienthood is defined by causal role, but roles are mapping-dependent, then **moral status is observer-relative**. This is your core challenge.  
  - **Way forward**: Anchor moral status in *intrinsic properties* (e.g., phenomenal consciousness) *plus* structural criteria. But this risks dualism. Alternatively, embrace that implementation is always interest-relative—and thus moral patienthood in AI may depend on *context* (e.g., design intent).  

  ---

  ### **Chapter Structure Proposal**
  1. **Introduce Computational Indeterminacy**: Define with your three cases.  
  2. **Argue for Unity**: Show redundancy/scatter/sharing as instances of mapping freedom.  
  3. **Diagnose Functionalist Limits**: Why this indeterminacy threatens moral objectivity.  
  4. **Assess Constraints**: Critique thermodynamic, causal density, and cohesion approaches.  
  5. **Moral Implications**: Does observer-relativity undermine patienthood? Discuss hybrid approaches.  

  **Why it’s worth a chapter**: This indeterminacy is a structural flaw in applying computational functionalism to ethics. Resolving it (or conceding its insolubility) is essential for AI moral patienthood theory. No existing literature tackles it systematically across all three scenarios—your synthesis would break new ground.

  If you pursue this, focus on **causal cohesion** as the most promising constraint and stress that functionalism may need supplementation (e.g., with phenomenology or design-based teleology) to avoid moral arbitrariness.
