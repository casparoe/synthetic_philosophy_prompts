  ### Philosophy Club Session: The Envelope Game  
  *Designed for 13-16 students, 55 minutes, minimal materials, and experiential learning of the two-envelope paradox.*

  ---

  #### **Materials & Preparation**  
  - **Envelopes/Cards:**  
    - Prepare **20 envelopes** (or folded index cards) with amounts written inside:  
      - **3 pairs** of ($5, $10)  
      - **4 pairs** of ($10, $20)  
      - **3 pairs** of ($20, $40)  
    - *Total: 10 pairs (20 envelopes).*  
    - Hide amounts (students see them only when allowed). Label envelopes externally as "A" or "B" for pairing.  
  - **Ledger:** A notebook for the "House" (student role) to track points.  
  - **Prediction Sheets:** One per student (questions below).  
  - **Chips:** 50 small tokens (paper clips, buttons) for Round 3 friction.  
  - **Setup:** Shuffle envelopes into 10 pre-made pairs. Place pairs in a box. Assign one student as "House" (keeps ledger).  

  ---

  #### **Prediction Sheet**  
  *(Students fill this at the start and revisit after Round 3)*  
  1. **Round 1 (Blind):** *"Without looking, if offered a switch, will you take it? Why?"*  
  2. **Round 2 (Peek):** *"After seeing your amount, will you switch? What if you see $5? $40? $10 or $20? Why?"*  
  3. **Round 3 (Friction):** *"If switching costs 1 chip, does your strategy change? For which amounts would you still switch?"*  

  ---

  #### **Session Flow**  
  **Intro (3 min):**  
  *"Today we’re playing a game about choices. You’ll pick envelopes with hidden amounts. One envelope has twice as much as the other. Your goal: maximize points. Points convert to a trivial prize at term’s end. Fill out your prediction sheet now."*  

  ---

  ### **Round 1: Blind (12 min)**  
  *Goal: Seductive argument emerges naturally. Students generate "always switch" logic.*  
  - **Procedure:**  
    - Each student draws one envelope from a pair (pairs distributed randomly).  
    - **Without opening**, they are offered: *"Keep your envelope or switch to the other one?"*  
    - After deciding, they open, report the amount to the House, who records it.  
    - Repeat for all students (use all 10 pairs; reuse 6 pairs randomly for 16 students).  
  - **Facilitator Script:**  
    - *"Decide without looking. Trust your gut."*  
    - *If asked:* *"What’s the catch? You’ll see."*  
  - **Why this round:** Students often rationalize switching post-game: *"I had a 50% chance of doubling!"* This surfaces the paradox’s seductive core.  

  ---

  ### **Round 2: Peek (20 min)**  
  *Goal: Collide with the ceiling. Students discover the equal-odds claim is impossible.*  
  - **Procedure:**  
    - Students draw, **open their envelope immediately**, see the amount, *then* decide to switch.  
    - House records amounts and decisions.  
    - *Secretly:* The distribution ceiling ($40) is hidden, but students see real amounts ($5, $10, $20, $40).  
  - **Facilitator Script:**  
    - *"Now you can look first. Does what you see change your choice?"*  
    - *If asked:* *"Why would $40 feel different from $5? Keep playing."*  
  - **Why this round:**  
    - Seeing $5 → Most switch (expecting $10).  
    - Seeing $40 → Most keep (fearing $20).  
    - Seeing $10/$20 → Split decisions.  
    - **Discovery Moment:** After the round, ask: *"Who saw $40? Did you switch? Why not?"* → Students realize high amounts can’t double (ceiling effect). Write observed amounts on the board. Ask: *"Is $80 possible? Why not?"*  

  ---

  ### **Round 3: Friction (10 min)**  
  *Goal: Indifference to scale/cost as a symptom. Strategy fails with friction.*  
  - **Procedure:**  
    - Same as Round 2, but **each switch costs 1 chip** (paid to House).  
    - Students start with 3 chips. If they lack chips, they can’t switch.  
    - House subtracts chips and records final amounts.  
  - **Facilitator Script:**  
    - *"Switching now costs 1 chip. Does this change your strategy?"*  
  - **Why this round:**  
    - Students who switch on $5 gain ($10 -1 = $9 > $5).  
    - Students who switch on $40 lose ($20 -1 = $19 < $40).  
    - The "always switch" logic breaks with cost, but the paradox insists it shouldn’t.  

  ---

  #### **Closed System & House Role**  
  - **House:** Tracks ledger:  
    - *"Student X: +$Y (Round 1), +$Z (Round 2), -1 chip (Round 3 if switched)."*  
    - Initial House balance: 0. Total student gains = sum of all amounts - chips.  
  - **Why it works:** Students see gains/losses are zero-sum (e.g., if someone gains $40, it’s "from" the game, not thin air).  

  ---

  #### **Debrief (8 min)**  
  *Map game moments to key insights:*  
  1. **Seductive Argument (Round 1):**  
     - *"In Round 1, many of you switched. Why?"* → Students say: *"I had a 50% chance to double!"*  
     - *Board:* Write their quotes. No formulas.  

  2. **Ceiling Effect (Round 2):**  
     - *"When you saw $40, you didn’t switch. Why?"* → *"There’s no $80!"*  
     - *Board:* List amounts seen ($5, $10, $20, $40). Circle $40: *"Can this double? What does that mean for the 50% claim?"*  

  3. **Scale/Cost Indifference (Round 3):**  
     - *"Did costing 1 chip change your strategy? Should it? The argument says switching should still win if the cost is less than 25% of your amount. Did it?"* → Highlight losses on $40 switches.  

  4. **Epistemic Power of Opening (Rounds 2 vs. 1):**  
     - *"In Round 1, always switching and never switching gave similar results. In Round 2, could you do better by looking?"* → Yes (e.g., switching only on $5).  
     - *Board:* *"Closed system: Switching blindly = neutral. Open eyes: Strategy can beat luck."*  

  **Finally:** Name the paradox. *"This is the two-envelope paradox. Its magic is in tricking us with infinity. The takeaway: What you see changes what you should do."*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **"I won’t play for points!"**  
     - *Fix:* *"Play to help us test human logic. Points are just data."*  
  2. **"I know the paradox!"**  
     - *Fix:* *"Great! Be a silent observer. Don’t spoil the discovery."*  
  3. **Arithmetic errors (House):**  
     - *Fix:* Assign a "co-House" to verify. Use whole numbers (no decimals).  
  4. **Time crunch:**  
     - *Fix:* Run Rounds 1/3 with half the class (8 students), Round 2 with all. Prioritize Round 2 (peek is key).  

  ---

  #### **What the Game Can’t Teach**  
  - **The Impossibility of Universal Equal Odds:**  
    - *Why:* The game uses a bounded distribution ($5–$40). The paradox assumes *any* amount could double/halve equally.  
    - **Least-Lecturing Explanation:**  
      *"In our game, $40 couldn’t double. But what if amounts were infinite? Could we design a game where for every amount, half/double is equally likely? Try: For $10 to have a 50% chance of doubling, there must be as many $20s as $5s. But for $20 to have a 50% chance of doubling, there must be as many $40s as $10s... and so on. Soon, you need infinite $40s, $80s, $160s... which is impossible. The "always switch" logic demands an impossible world."*  

  ---

  **Final Note:** This design makes the paradox *felt*. Students articulate the argument, hit the ceiling, and wrestle with cost/scale indifference. The debrief ties their experiences to the philosophy of decision-making. No prior math needed—just curiosity.
