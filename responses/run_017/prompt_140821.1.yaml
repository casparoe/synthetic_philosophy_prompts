prompt: |-
  I sit on the ethics committee of a mid-sized hospital, and we are drafting a short guidance note on when a patient's earlier written instruction — a transfusion refusal, a psychiatric advance directive, a request not to be allowed to discharge herself during a crisis — should still be treated as binding when the same patient, later and apparently lucidly, asks for the opposite. Most of our disagreement turned out not to be about autonomy or best interests but about something prior: what a person has to be doing at the moment she signs for her signing to count as adopting a plan, as opposed to making a prediction about her future self or expressing a wish about what she hopes that self will do. A reading group I run separately has been stuck on Kavka's toxin puzzle — the stranger who will pay you a large sum at midnight if by then you have formed the intention to drink, the next morning, a toxin that will make you miserable for a day and do nothing else, with no further payment for actually drinking it — because it isolates exactly this: a present reason to acquire a future-directed attitude you know you will have no reason to act on. So I want a specification rather than a survey: what would a theory of intention have to get right in order to be usable for my committee's question? Give me the requirements — the cases it must handle, the distinctions it must not collapse (intending versus predicting, intending versus wanting or hoping, intending versus trying, conditional versus unconditional intention, occurrent versus standing intention, planning for oneself versus committing to another), and the ordinary facts about planning it must not render mysterious — each with the case or consideration that makes it a requirement, and each marked as non-negotiable or as the preference of a particular camp. Then tell me which subset of the requirements you suspect cannot be jointly satisfied, and which single requirement does the most work in excluding candidate theories.

  Please build the list around these cases, several of which my group invented: the plain toxin case; a counter-bribe variant in which you know tonight that tomorrow at eleven a second stranger will credibly offer you more money not to drink, and you know you will take it — does that make intending tonight easier, harder, or no different, and whatever the answer, what does it show the original puzzle was about?; an iterated variant in which the same offer recurs every night for a month, payment each time only for the intention, with full knowledge each night that you will never drink — does repetition help, and if so does that tell against a theory of what intending is?; a dyadic variant in which you and a partner are paid only if you jointly intend and each of you knows the other will not drink; and a variant in which the payoff is keyed to your confident belief that you will drink rather than to your intention, so that the question becomes whether the puzzle is really about prediction all along. Add the non-exotic cases any such theory must leave intact: the smoker who locks money into a deposit contract knowing she will want to smoke, the traveller who books a non-refundable room in a city she will later not want to visit, the standing intention never acted on, the intention to do something you expect to fail at.

  Two constraints. First, I have no library access and no interest in who said what: describe positions by the claims that constitute them, skip citations and reading suggestions entirely, and if you include a scorecard of the main contenders at all, give it one line each and do not let it displace the criteria — I would rather have twelve requirements with their motivating cases than twelve views with their labels. Second, and the part I most want: mark explicitly which of the things people demand here are genuine desiderata and which are commitments of one camp that the rest of us never agreed to — that intentions must track reasons the agent expects to have at the time of action, that intending requires believing you will do it, that deliberation and self-prediction are in tension, that a rational intention must be revisable only for a reason — say which of those are negotiable, and flag any requirement that quietly asks the theory to do normative work it may not be able to do, namely telling us what to do later, rather than telling us what it is to have a plan. About 700 to 1000 words; a table is fine if it helps.
reasoning: |-
  Hmm, the user is on an ethics committee drafting guidance about when a patient's prior written instructions should override their current lucid requests. They've encountered philosophical difficulties around intention formation in Kavka's toxin puzzle. They want a specification of requirements for a theory of intention that would help resolve their committee's question, not a survey of existing theories.

  The user has described several key cases that need to be addressed: the original toxin puzzle, a counter-bribe variant, an iterated version, a dyadic version with partners, and a belief-based variant. They've also listed ordinary cases that must be preserved: the smoker's deposit contract, the traveler booking non-refundable rooms, standing intentions, and intentions to attempt difficult tasks.

  I need to build a list of requirements for such a theory of intention. Each requirement should include: the case motivating it, whether it's non-negotiable or camp-specific, and what distinction it must preserve. Then I should identify which requirements might conflict and which single requirement does the most work in excluding candidate theories.

  For the requirements, I'll consider distinctions like: intending vs predicting, intending vs wanting/hoping, intending vs trying, conditional vs unconditional intention, occurrent vs standing intention, and planning for self vs committing to others. I'll also note which demands are genuine desiderata versus camp-specific commitments.

  The constraints are important: no citations or theory labels, focus on claims not authors, avoid normative work beyond defining what it means to have a plan, and explicitly mark which requirements are negotiable. I'll aim for 700-1000 words, possibly using a table format for clarity.

  I'll start with core non-negotiable requirements that any theory must satisfy to handle basic intention phenomena, then move to camp-specific requirements that represent philosophical disagreements. For each, I'll note the motivating case and why it matters to the ethics committee's question about advance directives.

  I'll then analyze which subset of requirements might be jointly unsatisfiable - likely the requirements dealing with the toxin puzzle's core tension between present and future reasons. The belief requirement (that intention requires believing you'll do the action) seems particularly problematic as it excludes many theories from handling the toxin case.

  Finally, I'll emphasize that for the committee's purpose, we need a descriptive theory of intention rather than a normative one - we're defining what it means to have a plan, not what plans should be made. This distinction is crucial for their guidance note.
answer: |-
  Here is a specification of requirements for a theory of intention aimed at resolving the core question of when a prior written instruction constitutes a binding plan. Requirements are grouped by the distinction they preserve or the phenomenon they must explain. Each includes the motivating case(s), the requirement, and its status (Non-Negotiable or Camp-Specific).

  ### Core Non-Negotiable Requirements (Must handle fundamental phenomena)

  1.  **Intending vs. Predicting (The Belief Requirement Challenge):**
      *   **Case:** Toxin Puzzle & Belief Variant (payoff for confident belief you'll drink, not intention). Smoker deposit (intends to bind future self, predicts desire won't change).
      *   **Requirement:** The theory must distinguish forming an intention to Φ at T2 (a commitment) from merely predicting that one will Φ at T2 (a belief). Forming an intention must involve more than, or be distinct from, forming a high-confidence prediction.
      *   **Status:** Non-Negotiable. Collapsing this renders deposit contracts/advance directives mere predictions, easily overridden by later predictions.

  2.  **Intending vs. Wanting/Hoping (The Motivational Commitment Requirement):**
      *   **Case:** Traveller booking non-refundable room (intends to go, knows she won't want to later). Toxin Puzzle (intending tonight vs. hoping/strongly wanting to drink tomorrow).
      *   **Requirement:** The theory must distinguish intending to Φ at T2 from merely wanting or hoping to Φ at T2. Intention must involve a present motivational commitment to making Φ happen at T2, not just a positive evaluation of Φ.
      *   **Status:** Non-Negotiable. Otherwise, the traveller merely "wanted" to go when booking, and the patient merely "hoped" they wouldn't want a transfusion.

  3.  **Conditional vs. Unconditional Intention (Scope of Commitment):**
      *   **Case:** Psychiatric advance directive ("If I am in state S, refuse discharge"). Plain toxin (unconditional intention to drink).
      *   **Requirement:** The theory must account for intentions conditional on future states (which persist and guide action *when* the condition holds) vs. unconditional intentions (which persist barring reconsideration).
      *   **Status:** Non-Negotiable. Essential for interpreting directives specifying triggering conditions.

  4.  **Occurrent vs. Standing Intention (Persistence without Rehearsal):**
      *   **Case:** Standing intention never acted on (e.g., "never drive drunk"). Psychiatric directive (intended to stand until revoked or triggered).
      *   **Requirement:** The theory must allow that an intention formed at T1 can persist as a standing state (a disposition to guide reasoning/action) at T2 without being consciously rehearsed at every moment between T1 and T2.
      *   **Status:** Non-Negotiable. Advance directives inherently function as standing intentions.

  5.  **Planning for Self vs. Committing to Another (The Interpersonal Bindingness):**
      *   **Case:** Dyadic Toxin (paid only if *both* intend, each knows the other won't drink). Medical context (patient commits *to caregivers* via directive).
      *   **Requirement:** The theory must explain how an intention can create commitments *to others* (making one accountable, giving them reason to rely) that go beyond mere self-planning. It must distinguish a private plan from a communicated commitment.
      *   **Status:** Non-Negotiable for the medical context. Directives are communicated commitments to the care team.

  ### Camp-Specific Requirements (Reflecting philosophical divides)

  6.  **Intention Requires Belief (The Cognitivist Requirement):**
      *   **Case:** Toxin Puzzle core difficulty. Intention to attempt something likely to fail.
      *   **Requirement:** Forming an intention to Φ at T2 rationally requires believing that one will (or at least, that one is likely to) Φ at T2.
      *   **Status:** Camp-Specific (Cognitivist). *Motivation:* Seems necessary for toxin case difficulty and intending to attempt. *Negotiability:* Highly contentious. Non-cognitivists reject this.

  7.  **Intention Tracks (Expected) Future Reasons (The Reasons-Responsiveness Requirement):**
      *   **Case:** Counter-Bribe Toxin (easier/harder to intend tonight knowing a bigger bribe tomorrow?). Plain Toxin.
      *   **Requirement:** Forming a rational intention to Φ at T2 requires that the agent expects, at T1, to have sufficient reason to Φ at T2. Intention formation is constrained by anticipated future reasons.
      *   **Status:** Camp-Specific (Strong Reasons-Responsiveness View). *Motivation:* Explains toxin difficulty: you know you'll lack reason tomorrow. *Negotiability:* Contested. Other views see intention as potentially creating new reasons or binding against future incentives.

  8.  **Stability/Non-Revisability Without New Reason (The Bootstrapping Requirement):**
      *   **Case:** Iterated Toxin (can you form the intention night after night knowing you won't drink?). Smoker deposit.
      *   **Requirement:** A rational intention, once formed, should not be revised *unless* the agent encounters a new reason not previously considered/weighed. The intention itself provides a reason for stability.
      *   **Status:** Camp-Specific (Strong Planning Theory/Internalist). *Motivation:* Explains deposit contracts/advance directives: the prior intention *is* the reason against changing. *Negotiability:* Contested by views seeing reasons as solely external/factual.

  9.  **Deliberative Settling vs. Self-Prediction (The Practical Stance Requirement):**
      *   **Case:** Toxin Puzzle core tension. Ordinary planning.
      *   **Requirement:** Forming an intention must be understood as taking up a distinctively *practical stance* – settling the question of what to do – fundamentally different from taking a theoretical stance of predicting what one will do.
      *   **Status:** Camp-Specific (e.g., Bratman-style Planning Theory). *Motivation:* Explains why prediction alone (belief variant) feels different from intention formation. *Negotiability:* Contested by cognitivist/reductionist views.

  ### Tensions & Key Excluder

  *   **Suspected Joint Unsatisfiability:** Requirements (6) *Intention Requires Belief*, (7) *Intention Tracks Future Reasons*, and the core demand to handle the **Plain Toxin Puzzle** difficulty (forming an intention you know you won't act on) seem jointly unsatisfiable.
      *   If intention requires belief you'll act (6), and you know you'll lack reason to act later (7), you *cannot* rationally form the intention in the plain toxin case. Yet the puzzle presents it as *difficult but conceptually possible*.
      *   If (6) is dropped, (7) alone still makes forming the intention irrational. If (7) is dropped, (6) still blocks forming the intention (you can't believe you'll drink knowing you'll lack reason).
  *   **Key Excluding Requirement:** Requirement (6) **Intention Requires Belief** does the most work in excluding candidate theories from handling the core toxin puzzle.
      *   Theories accepting (6) *must* conclude you cannot rationally form the intention in the plain toxin case. This seems counterintuitive to the puzzle's setup.
      *   Theories rejecting (6) can *potentially* explain forming the intention as a distinct practical commitment, even against predictive belief (though they still struggle with requirement (7) under some interpretations). Rejecting (6) is often necessary (though not sufficient) for making sense of the toxin intention as possible.

  ### Clarifications on Normativity & Desiderata

  *   **Genuine Desiderata:** The **Core Non-Negotiable Requirements (1-5)** are genuine desiderata. Any adequate *descriptive* theory of intention *as a plan* must satisfy them to capture the phenomena relevant to advance directives (bindingness, commitment, persistence, distinction from prediction/wish).
  *   **Camp-Specific Commitments/Negotiable Demands:** Requirements (6), (7), (8), and (9) represent specific, contested philosophical commitments. Your committee does *not* need to endorse any of them to find a usable theory. A theory can reject (6) and/or (7) and still be a viable candidate if it satisfies the core requirements and offers a plausible account of planning stability (potentially via a version of (8) or another mechanism).
  *   **Avoiding Normative Overreach:** The core task is **descriptive**: defining what it *is* to have a plan (intention) at T1 that governs at T2. The theory should *not* be required to dictate *whether* one *should* follow the prior intention later (Requirement (8) edges into this). It should illuminate the *nature* of the commitment made at T1. The normative question for the committee (override or not?) operates *on top of* this descriptive account, informed by autonomy, beneficence, and the specific strength/type of prior commitment identified. A good descriptive theory tells you *what the patient did* (adopted a plan/commitment or made a prediction/wish?), not automatically what you *must* do about it later.
