answer: |-
  **Community Investment Allocation Procedure (Version 1.0)**

  **Purpose:** To select between competing funding proposals using a consistent, defensible method that minimizes "currency drift" and incorporates welfare, resource, and capability considerations, while utilizing existing in-house instruments.

  **Glossary (Keep Open)**
  *   **Adaptation Gap:** Difference between what people *can do* (functioning) and how they *report feeling* (experience). A large positive gap *might* mean people lowered expectations ("adaptive preference"), not that they are fine.
  *   **Conversion Loss:** Difference between the *resources* delivered and what people *can actually do* with them (functioning). Shows how hard it is to turn the help into real activity.
  *   **Headline Inequality Figure:** The main number we use to say how unequal things are (e.g., gap between best-off and worst-off).
  *   **Priority Group:** The specific group we are trying to help the most (e.g., lowest-income households, people with severe mobility issues).
  *   **Sufficient Answer (Analyst Level):** Clear, numerical result from applying the ledger/probe/test directly to proposal data; no complex interpretation needed.
  *   **Escalate (to Board):** When the procedure hits a step requiring a *value choice* (e.g., which gap matters more, which test failure is acceptable) that isn't pre-decided by policy.
  *   **Reject/Redesign:** When a proposal fails a test designed to catch unreliable or unfair comparisons, making fair assessment impossible *now*.

  **Procedure:** For each competing proposal (A, B, C...), apply steps 1-4. Then proceed to step 5.

  1.  **Standardize Inputs (Currency Alignment):**
      *   **Question:** For each proposal, force its claimed benefits into the three ledger columns (Resources Delivered, Functioning Achieved, Experience Reported) *for its specific priority group*. Use proposal data + any verified external benchmarks.
      *   **Sufficient Answer:** A completed row in the Conversion Ledger for each proposal's priority group.
      *   **Stop/Reject if:** Proposal cannot provide *any* plausible data for at least *two* ledger columns (Resources, Functioning, Experience) for its priority group. (Reason: Incomparable currency).
      *   **Escalate if:** Agreement cannot be reached on what constitutes "Resources," "Functioning," or "Experience" *for this specific proposal type* (e.g., is "music skill" a functioning or experience?). (Reason: Foundational definition/value choice).

  2.  **Apply Conversion Ledger & Flag Gaps:**
      *   **Question:** Calculate the Conversion Loss (Resources - Functioning) and Adaptation Gap (Functioning - Experience) for each proposal's priority group using the ledger.
      *   **Sufficient Answer:** Numerical values for Conversion Loss and Adaptation Gap for each proposal.
      *   **Stop/Reject if:** Conversion Loss is large *and* negative (Resources delivered > Functioning achieved) without a clear, plausible explanation in the proposal (e.g., high fraud risk, severe implementation failure). (Reason: Inefficiency/risk too high). *Or* Adaptation Gap is large *and* positive *and* the proposal relies *heavily* on Experience gains as its main benefit. (Reason: Claimed well-being gains may be unreliable due to adaptive preferences).
      *   **Escalate if:** Both proposals have significant but different gaps (e.g., one has high Conversion Loss, the other a large positive Adaptation Gap) and both pass the "Stop" criteria. (Reason: Value choice needed on which gap is more concerning).

  3.  **Run Temporal & Distribution Tests:**
      *   **Question A (Repeat Probe):** Simulate running *this specific proposal* for 5 cycles. Does it serve the *exact same households* each time, or does the queue rotate significantly (e.g., >25% new households by cycle 5)?
      *   **Question B (Standstill Test):** If *only* the worst-off group (on the proposal's claimed primary benefit currency) improved significantly, and everyone else stayed the same, would the headline inequality figure (e.g., Gini coefficient calculated on that currency) show a clear decrease?
      *   **Question C (Swap Test):** Replace the intended priority group beneficiaries with a random group from the *same eligible pool*. Does the proposal still target the group with the *highest disadvantage* on the currency it claims to address? (e.g., If targeting "lowest functioning," does the swap still select the lowest-functioning group?).
      *   **Sufficient Answer:** "Yes/No" for each test, based on proposal mechanics and eligible population data.
      *   **Stop/Reject if:**
          *   (Standstill) Test result is "No" (improving only the worst-off doesn't reduce inequality figure). (Reason: Metric flawed/levelling down possible).
          *   (Swap Test) Result is "No" (currency doesn't reliably track disadvantage). (Reason: Unfair targeting).
      *   **Escalate if:**
          *   (Repeat Probe) Result shows "Same Households" for one proposal and "Rotates" for another. (Reason: Value choice - equalize state now vs. share across lives).
          *   Proposals pass/fail different tests, but both avoid "Stop" criteria. (Reason: Need value weighting on different test priorities).

  4.  **Assess Net Effect (Analyst Synthesis):**
      *   **Question:** Considering the ledger data (Resources, Functioning, Experience) and test results, which proposal delivers the largest, most reliable net improvement *on the currencies it successfully uses*, for its priority group, per dollar spent? Focus on functioning unless Adaptation Gap flags unreliability of experience.
      *   **Sufficient Answer:** A clear ranking based on size and reliability of net benefit per dollar (e.g., "Proposal A: Large Functioning gain, low cost. Proposal B: Modest gain mix, higher cost. A > B").
      *   **Escalate if:** Proposals are very close *or* excel on fundamentally different currencies (e.g., large Resource transfer vs. large Experience gain) *and* both passed prior steps. (Reason: Value choice needed - Resources vs. Welfare/Capabilities).

  5.  **Final Selection:**
      *   If one proposal is clearly superior in Step 4 and no Escalation flags were raised, fund that proposal.
      *   If Escalation flags were raised at any step, prepare a brief for the Board summarizing the competing proposals, the Step where Escalation occurred, the specific value choice needed, and the analyst's synthesis from Step 4. The Board decides.
      *   If both proposals were Rejected, neither is funded this cycle. Feedback provided.

  **Worked Applications & Audit Trail**

  *(Template: Proposal Name | Step 1 Result | Step 2 Result (CL, AG) | Step 3 Result (RP, SS, SW) | Step 4 Synthesis | Outcome)*

  **Case 1: Pain Course vs. Home Insulation**
  *   **Pain Course:** Resources: Low $ | Functioning: Small Gain | Experience: Large Gain | CL: Small | AG: Large Positive | RP: Same HHs | SS: Pass | SW: Pass (targets high-pain) | Synthesis: High Exp gain, but large AG flags reliability; small functioning gain. Low cost. **| Outcome: Passes tests, but Exp reliability concern (Step 2 note).**
  *   **Home Insulation:** Resources: Large Transfer | Functioning: Large Gain | Experience: Small Gain (fragile) | CL: Modest | AG: Small | RP: Same HHs | SS: Pass | SW: Pass (targets low-income) | Synthesis: Large, reliable Functioning gain. High cost per person but large gain. **| Outcome: Passes tests. Superior Net Effect (Large reliable Functioning gain > Small Functioning gain + unreliable Exp gain).**
  *   **Decision:** Fund Home Insulation.

  **Case 2: Powered Mobility vs. Cash Transfers**
  *   **Powered Mobility:** Resources: High $ | Functioning: Large Capability Gain | Experience: Modest (some negative) | CL: Low | AG: Small/Neg | RP: Same HHs | SS: Pass | SW: Pass (targets severe impairment) | Synthesis: Large reliable Capability gain. Very high cost per person. **| Outcome: Passes tests.**
  *   **Cash Transfers:** Resources: Med $ (total) | Functioning: Diffuse Gains | Experience: Large Gain | CL: ? (Hard) | AG: ? (Hard) | RP: Rotates | SS: Likely Pass | SW: **FAIL** (Random swap from eligible pool doesn't reliably select most disadvantaged on *any* currency) | Synthesis: SW Test Fail **| Outcome: Stop/Reject at Step 3 (Swap Test Fail). Unfair targeting.**
  *   **Decision:** Fund Powered Mobility (Cash Transfer rejected).

  **Case 3: Music Lessons vs. Eviction Defense**
  *   **Music Lessons:** Resources: High $ | Functioning: Large Gain (skill) | Experience: Large Gain | CL: Low | AG: Small | RP: Same HHs | SS: **FAIL** (Improving better-off kids without changing worse-off increases inequality gap) | SW: **FAIL** (Random swap selects kids from whole region; doesn't reliably select disadvantaged) | Synthesis: SS & SW Fail **| Outcome: Stop/Reject at Step 3 (Standstill & Swap Test Fail).**
  *   **Eviction Defense:** Resources: Legal Service | Functioning: Large Gain (housing security) | Experience: Modest Gain (reduced stress) | CL: Low | AG: Small | RP: Rotates (diff tenants each cycle) | SS: Pass | SW: Pass (targets tenants facing eviction - high disadvantage) | Synthesis: Large reliable Functioning gain (housing). **| Outcome: Passes tests.**
  *   **Decision:** Fund Eviction Defense. Music Lessons rejected.
      *   **Forcing Step:** Step 3 (Standstill and Swap Test). Music lessons fail both: they worsen relative inequality and don't reliably target disadvantage. Eviction defense passes both.
      *   **Premise to Reject:** You must reject the validity of the Standstill Test (caring only about the music kids' gain, not relative position) or the Swap Test (believing music inherently deserves funding regardless of who gets it). This is a core value choice about targeting disadvantage versus supporting universal goods.

  **Where This Misfires & What It Cannot Do**
  *   **Misfires:** When all proposals have significant gaps (Step 2 Escalate) but one is clearly better on aggregated metrics; the procedure forces escalation. When a proposal fails a test due to measurement noise, not a fundamental flaw. When "functioning" is highly contested (Step 1 Escalate). When cost-effectiveness calculations (Step 4) are extremely sensitive to minor input variations.
  *   **Cannot Do:** Resolve fundamental value conflicts (e.g., welfare vs. capability priority - forces Escalate). Judge intrinsic worth of non-measurable goods (e.g., cultural preservation). Handle proposals where the primary benefit accrues to non-recipients (e.g., herd immunity). Decide absolute funding levels or budget splits. Replace political accountability for Escalated decisions. Settle disputes about defining the "eligible population" or "worst-off group" without Escalation.

  \answer{Case 1: Home Insulation; Case 2: Powered Mobility; Case 3: Eviction Defense}
