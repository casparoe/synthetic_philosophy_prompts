  For the case studies, I'll apply the procedure rigorously:
  - Case 1: Pain management vs home insulation
  - Case 2: Mobility aids vs cash transfers
  - Case 3: Music lessons vs eviction defense (where I suspect the procedure will favor the latter against board preferences)

  I'll need to show exactly where the procedure forces uncomfortable conclusions in Case 3. The swap test might reveal that music lessons target relatively advantaged children.

  Finally, I'll outline limitations: where the procedure fails (e.g., when all currencies disagree) and what it can't do (e.g., resolve fundamental value conflicts).

