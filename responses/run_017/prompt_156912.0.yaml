  The user has specific constraints: they need a numbered procedure that fits on two printed pages, with a glossary for their analyst who has no philosophy background. They also want worked examples for three specific cases and want me to identify where the procedure might fail. The procedure must incorporate their four existing instruments: conversion ledger, repeat probe, standstill test, and swap test.

  This is quite detailed! As DeepSeek, I can approach this systematically. The user has a master's in public policy but no philosophy background, so I need to make everything concrete and operational. The tight timeline (10 days per decision with one analyst) means the procedure must be efficient without sacrificing rigor.

  For the philosophical foundation, I'll focus on the "equality of what" debate: welfare (subjective well-being), resources (material goods), and capabilities (what people can do/be). The challenges include adaptive preferences (people lowering expectations), expensive tastes (needing more resources for same welfare), conversion needs (difficulty turning resources into functionings), reporting gaps, commensurability problems, and timeframes (moment vs life).

  I'll design a step-by-step procedure that:
  1. Standardizes inputs using their existing instruments
  2. Tests for common pitfalls using their ledger, probes, and tests
  3. Makes values explicit where needed
