answer: |-
  After careful analysis of your cases and theoretical commitments, I propose the following unified principle:

  **A category is socially constructed if its existence, boundaries, and application depend constitutively on collective intentionality (agreements, representations, or practices) that could have been otherwise without altering the non-social world. A kind is real if membership in it generates robust causal powers that (i) operate independently of any individual's beliefs about that membership, and (ii) exhibit counterfactual stability under relevant social perturbations.**

  ### Key Stipulations and Their Grounds:
  1. **Category/Kind Distinction (Essential):** Your case 7 (NRD) forces this. The *category* "NRD" was socially constructed through diagnostic practices. The *kind* (the polymorphism cluster) was discovered. Construction applies to categories; reality applies to kinds. *Stipulation:* We abandon the phrase "socially constructed kind" as misleading; kinds are *tracked* (or not) by constructed categories. *Abandonment condition:* If empirical work shows all causal powers dissolve upon collective disbelief (e.g., money loses value if everyone disavows it), collapse the distinction.

  2. **Robustness Criterion for Reality:** Causal powers must persist despite individual ignorance/disbelief (e.g., Blackness affects health outcomes even if a specific landlord denies racial bias). *Stipulation:* "Relevant social perturbations" excludes total collapse of sustaining institutions (e.g., dollars cease functioning if the U.S. government dissolves). *Abandonment condition:* If neuroscience demonstrates all group effects reduce to individual psychology.

  3. **Constitutive Dependence:** Construction requires that collective intentionality *metaphysically determines* the category, not merely epistemically accesses it (contrast sex gamete categories vs. biological sex differences). *Abandonment condition:* If anthropology reveals a culture with identical institutions emerging spontaneously without collective agreement.

  ---

  ### Defense Against Your Cases:
  1. **US Dollar:**  
     - *Category:* Constructed (requires collective agreement on value).  
     - *Kind:* Real (possesses causal powers robustly: buys coffee regardless of individual beliefs).  
     → **Matches your verdict.**

  2. **Being Black in the US:**  
     - *Category:* Constructed (historically contingent racial schemas).  
     - *Kind:* Real (causal powers robust: systemic racism operates independently of individual recognition).  
     → **Matches your verdict.**

  3. **Witch (Early Modern):**  
     - *Category:* Constructed (dependent on specific theological/legal practices).  
     - *Kind:* **Not real** (no robust causal powers independent of accusations; "confessions" require belief in the category). Feedback effects are belief-mediated.  
     → **Overturn your uncertainty: Witchcraft is unreal.** Difference from Sillans: Witches lack *institutional entrenchment* generating autonomous effects.

  4. **Sex (Gamete Type):**  
     - *Category:* **Not constructed** (gamete types exist independently; our taxonomic choice is epistemic, not constitutive). Alternative definitions don’t alter the biological cluster.  
     - *Kind:* Real (causal powers in reproduction/evolution).  
     → **Overturn your discomfort: Not constructed.**

  5. **Gender:**  
     - *Category:* Constructed (emerges from diffuse practices, not decree).  
     - *Kind:* Real (causal powers robust: e.g., workplace discrimination occurs regardless of individual beliefs about gender norms).  
     → **Matches your verdict.** Diffuse emergence doesn’t negate construction (collective intentionality ≠ formal institution).

  6. **Sillans:**  
     - *Category:* Constructed (initially imposed by colonial fiat).  
     - *Kind:* Real *by 1970s* (causal powers robust: political parties, endogamy persist independently of individual beliefs about origins).  
     → **Matches your verdict.** Became real when practices achieved institutional robustness.

  7. **NRD:**  
     - *Category:* Constructed (diagnostic label dependent on 1974 practices).  
     - *Kind:* **Real** (polymorphism has causal powers independent of the label). Genetics discovered the kind; the category was a placeholder.  
     → **Overturn your label verdict: Not socially constructed *kind*.** Construction applies only to the category.

  8. **Unemployment:**  
     - *Category:* Constructed (arbitrary measurement conventions).  
     - *Kind:* Real (causal powers robust: e.g., economic policies respond to unemployment rates regardless of individual beliefs).  
     → **Matches your verdict.** Arbitrariness doesn’t negate reality if effects are robust.

  9. **Biological Species:**  
     - *Category:* **Constructed** (choice of species concept depends on explanatory interests).  
     - *Kind:* **Real** (phylogenetic clusters have causal powers in ecology/evolution independent of human concepts).  
     → **Overturn your verdict: Categories are constructed; kinds are discovered.**

  10. **Whiteness:**  
      - *Category:* Constructed (like Blackness, contingent on racial schemas).  
      - *Kind:* **Real** (causal powers robust: e.g., wealth accumulation via historical exclusion operates independently of individual beliefs). "Thinness" is psychological, not ontological.  
      → **Overturn your hesitation: As real as Blackness.** To deny this is to deny the causal efficacy of white supremacy.

  ---

  ### Your Tentative Principle Repaired:
  Your principle conflates categories and kinds. Revise to:  
  *Social construction applies to **categories** when membership depends constitutively on social practices. Reality applies to **kinds** when membership confers robust causal powers (insensitive to individual beliefs).*  
  This handles all cases:  
  - Fixes case 7 (distinguishes NRD category from kind).  
  - Explains case 3 vs. 6 (witches lack kind-robustness; Sillans gain it).  
  - Resolves case 9 (species categories constructed, kinds real).

  ---

  ### Additional Verdicts:
  - **Marriage:**  
    *Category:* Constructed (definition varies by culture/law).  
    *Kind:* Real (e.g., marital status causally affects taxation/health outcomes robustly).  
  - **Nationhood:**  
    *Category:* Constructed (dependent on collective recognition).  
    *Kind:* Real (e.g., citizenship determines rights/obligations independently of individual disbelief).  
  - **DSM Categories (e.g., Major Depressive Disorder):**  
    *Category:* Constructed (dependent on diagnostic conventions).  
    *Kind:* Conditionally real *if* it tracks a robust causal cluster (e.g., neurobiological pathways). Lacks reality if merely a reified label (like witches).

  ---

  ### Verdicts to Overturn (in Priority Order):
  1. **NRD (Case 7):** Abandon "socially constructed kind." The *category* was constructed; the *kind* was discovered and is real.  
  2. **Whiteness (Case 10):** Accept full reality. Denying this undermines structural analysis of racism.  
  3. **Biological Species (Case 9):** Accept that *categories* are constructed (due to conceptual choices), while *kinds* are real.  
  4. **Sex (Case 4):** Reject construction. Taxonomic choices don’t constitute the biological features.  
  5. **Witchcraft (Case 3):** Affirm unreality. Feedback effects require belief, failing the robustness test.

  ### Final Endorsement:
  Your core intuition—that construction and reality coexist—is sound but requires distinguishing categories (constructed) from kinds (real when robustly causal). This saves your key verdicts (dollars, race, gender, Sillans, unemployment) while resolving tensions through ontological clarity. Surrender the conflation in NRD and the realism-hesitation in whiteness; the rest follows.
