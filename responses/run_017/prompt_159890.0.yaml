  **Tone**: Relentlessly cheerful administrative sincerity, peppered with academic jargon and exclamation points.  
  **Inside Jokes**:  
  - “Sludge” removed from line... but added via opt-out form placement.  
  - Staff enduring their own nudges (e.g., signing forms near dirty dishes).  
  - Vandalism vs. design distinction for identical fruit-bowl moving.  
  - FAQ using “transparency” to deflect manipulation concerns.  
  - Chad Liu’s token student role.
