answer: |-
  ### Core Decision Tree: Authority of Advance Directives  
  *Starting Commitment: A competently executed advance directive should normally be followed.*  

  #### Branch Questions (Answer Yes/No)  
  1. **Dementia Case**: A patient with advanced dementia (lacks capacity) is content and avoids burdens. Her directive demands withholding life-sustaining treatment. *Should the directive be followed?*  
  2. **Competent Reversal Case**: A patient retains capacity but now requests treatment his directive explicitly refused, citing reversed values. *Should the directive override his current request?*  
  3. **Pressure Case**: A directive is valid in form but was signed while the patient managed family finances under duress. *Should this directive be discounted?*  
  4. **Fit Problem Case**: The clinical situation (e.g., new treatment risks) was not envisaged by the signer. *Should the directive be followed?*  
  5. **Proxy Case**: A directive designates a surrogate *and* includes specific instructions. The surrogate believes following the instructions harms the patient. *Should the surrogate override the instructions?*  

  #### Logical Space & Constraints  
  - **5 questions → 32 possible combinations**, but 14 are **incoherent** (e.g., answering Yes to Q3 (discount directive) but Yes to Q1/Q2/Q4 (follow directive) is self-contradictory).  
  - **Available combinations**: 18 coherent paths. Key constraints:  
    - Q3=Yes (discount) forces Q1=No, Q2=No, Q4=No (directive not followed).  
    - Q5=Yes (proxy overrides) implies directive’s instructions are non-binding.  
  - **Unbranched distinctions**:  
    - Asymmetry (refusal vs. request) and identity conditions (biological/psychological continuity) are not resolved by this tree.  

  #### Positions (Leaves)  
  *Classified by branch answers (Q1–Q5)*  

  1. **Pure Contemporaneous Welfare** (N, N, Y, N, Y)  
     - *Position*: Only current well-being matters; the directive has no moral weight.  
     - *Awkward commitment*: Must override a directive if the patient is content, even if they anticipated this and explicitly refused treatment.  

  2. **Critical-Interest View** (Y, N, N, Y, N)  
     - *Position*: The directive protects the patient’s lifelong values/narrative integrity, overriding current experiential interests.  
     - *Awkward commitment*: May impose suffering (e.g., withholding food from a content dementia patient) to honor past values.  

  3. **Sovereignty Precedent Autonomy** (Y, Y, N, Y, N)  
     - *Position*: The directive binds because authorizing future governance is intrinsically valuable (sovereignty of the earlier self).  
     - *Awkward commitment*: Must override a competent patient’s current request if it conflicts with their directive.  

  4. **Evidentiary Precedent Autonomy** (Y, N, Y, N, Y)  
     - *Position*: The directive is followed only as the best evidence of current wishes; it has no independent authority.  
     - *Awkward commitment*: In dementia, ignores the patient’s avoidant behavior (e.g., flinching) as non-evidential since they lack capacity.  

  5. **Revision-Tolerant Precedent Autonomy** (Y, N, N, Y, N)  
     - *Position*: The directive binds unless the later self reflectively and stably revokes it while competent.  
     - *Awkward commitment*: Follows the directive in dementia even if the patient appears to have non-reflective value changes.  

  6. **Proxy-Priority View** (N, N, N, N, Y)  
     - *Position*: Authority lies with the designated surrogate; instructions are advisory.  
     - *Awkward commitment*: Lets a surrogate override clear instructions even if the patient’s rationale was well-considered.  

  7. **Deflationary View** (Y, Y, N, Y, N)  
     - *Position*: The directive’s authority is purely procedural (e.g., assigns decision-rights, limits liability); it does not reflect intrinsic moral force.  
     - *Awkward commitment*: Follows the directive in harmful/unwanted situations to uphold institutional rules.  

  #### Unnamed Positions  
  8. **Hybrid: Evidentiary with Proxy Priority** (N, N, N, N, Y)  
     - *Position*: Directives are evidence for surrogates but yield to proxy judgment.  
     - *Awkward commitment*: Discounts directives systematically in favor of surrogate discretion.  

  9. **Unoccupied: Strict Instructionism** (Y, Y, N, Y, Y)  
     - *Position*: Directives bind absolutely, but proxies may override instructions.  
     - *Awkward commitment*: Incoherent—cannot demand absolute adherence while allowing overrides.  

  #### Diagnostics  
  1. **Unoccupied Combinations** (3 of 18 available paths lack defenders):  
     - **Incoherent**: *Q1=Y, Q3=Y* (Follow directive in dementia but discount if pressured → self-contradictory).  
     - **Unattractive**: *Q1=N, Q2=Y* (Ignore directive in dementia but override competent reversal → paternalistic).  
     - **Unexplored**: *Q4=Y, Q5=Y* (Follow directive in unforeseen cases but let proxies override → unstable).  

  2. **Indistinguishable Leaves**:  
     - **Critical-Interest vs. Revision-Tolerant** (both Y,N,N,Y,N). *Separate with*: "If a dementia patient shows sustained, non-reflective value changes (e.g., new religiosity), should the directive still bind?"  
       - Critical-Interest: Yes (upholds past values).  
       - Revision-Tolerant: No (non-reflective changes erode authority).  
     - **Sovereignty vs. Deflationary** (both Y,Y,N,Y,N). *Separate with*: "Should a directive be followed if it causes harm and conflicts with all known preferences?"  
       - Sovereignty: Yes (autonomy is paramount).  
       - Deflationary: Yes (procedure trumps outcome).  

  3. **Branch Utility**:  
     - **Most decisive**: Q2 (Competent Reversal). Splits sovereignty/deflationary (Y) from others (N).  
     - **Most vacuous**: Q3 (Pressure). 80% answer No (do not discount) across positions—only Pure Welfare and Evidentiary say Yes.  

  ---  
  *End of Decision Tree*  
  *Use cases to test positions, not abstract labels. Reflect on your answers to locate your view.*
