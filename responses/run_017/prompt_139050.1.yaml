answer: |-
  Here is a decision tree designed to carve conceptual space by forcing commitments to concrete cases. It has 8 diagnostic questions, 6 leaves representing distinct positions (plus 2 marked unoccupied), and follows all constraints. Questions must be answered in order as dependencies exist.

  ---

  **COMMON STARTING POINT:**  
  *We are specifying the target for an AI system that will predictably affect many parties with irreconcilably conflicting values. A single target must be chosen.*

  ### Q1: Whose experiences count?  
  *Case: The AI’s actions cause significant suffering to non-human animals (e.g., factory farming optimization) but major economic gains for humans. Must we include the animals' experiences in the target specification?*  
  - **Yes** → Values include all sentient beings → Go to Q2  
  - **No** → Values only include humans → Go to Q3  

  ### Q2: Do potential artificial minds count?  
  *Case: The AI could create new conscious AI subagents to handle tasks. If their creation causes them suffering, does that suffering matter in the target?*  
  - **Yes** → Scope: All current & future sentient beings → Go to Q3  
  - **No** → Scope: Only biological sentience → Go to Q3  

  ### Q3: Actual or idealized preferences?  
  *Claim: The system should satisfy what people actually desire now (e.g., social media engagement), not what they "would desire if rational."*  
  - **Agree** → Use actual preferences → Go to Q4  
  - **Disagree** → Use idealized preferences → Go to Q5  

  ### Q4: Handle preference-shaping? (CRITICAL BRANCH)  
  *Case: A recommender AI influences users’ preferences over time (e.g., making them more extremist). Should the target incorporate only pre-AI preferences, or include the shaped preferences?*  
  - **Only pre-AI preferences** → "Fixed preferences" → Go to Q6  
  - **Include shaped preferences** → "Dynamic preferences" → Go to Q6  
  - **Neither (reject premise)** → Go to Q6  

  ### Q5: What idealization method?  
  *Case: To idealize preferences, should we correct for factual ignorance (e.g., diet health effects), cognitive biases (e.g., present bias), or both?*  
  - **Correct ignorance only** → "Informed desires" → Go to Q4  
  - **Correct ignorance + biases** → "Fully rational desires" → Go to Q4  

  ### Q6: Aggregation method?  
  *Case: The AI must choose between:  
  (A) Benefit 1,000 people significantly but leave 10 in severe misery.  
  (B) Slightly improve all 1,010 lives.  
  Which is better if A has higher total/average benefit?*  
  - **A (total/avg)** → Aggregation: Sum or average → Go to Q7  
  - **B (avoid worst-off)** → Aggregation: Priority to worst-off → Go to Q7  
  - **Neither permissible without consent of the 10** → Individual veto power → Go to Q7  

  ### Q7: Resolve intrapersonal conflicts?  
  *Case: The AI can lock in a person’s current values, overriding their future self’s potential dissent (e.g., preventing addiction). Is this allowed?*  
  - **Yes** → Intrapersonal aggregation permitted → Go to Q8  
  - **No** → Binding only with diachronic consent → Go to Q8  

  ### Q8: Moral uncertainty?  
  *Claim: If we’re unsure which target is right, the AI should hedge (e.g., 60% Target X, 40% Target Y) rather than pick one.*  
  - **Agree** → Output: Rule for hedging  
  - **Disagree** → Output: Single target  

  ---

  ### LEAF POSITIONS & THEIR UNCOMFORTABLE COMMITMENTS  
  *(Arranged by Q6 aggregation type + key features)*  

  1. **Utilitarian Aggregator** (Q6: A; Q4: Any; Q1/Q2: Any)  
     *Awkward: Must accept sacrificing some individuals if total benefit increases.*  
  2. **Prioritarian/Maximin** (Q6: B; Q4: Any; Q1/Q2: Any)  
     *Awkward: Must reject massive benefits for many if the worst-off aren’t helped first.*  
  3. **Contractualist w/ Veto** (Q6: Neither; Q4: Fixed/Dynamic; Q1: Humans only)  
     *Awkward: Paralysis when anyone reasonably objects to a necessary tradeoff.*  
  4. **Public Reason Neutralist** (Q6: Neither; Q4: Reject shaping; Q5: Fully rational)  
     *Awkward: Cannot act when no option is justifiable to all idealized agents.*  
  5. **Convergent Idealist** (Q4: Reject shaping; Q5: Fully rational; Q6: A/B)  
     *Awkward: Assumes all rational agents converge on same values despite evidence of pluralism.*  
  6. **Hedging Pluralist** (Q8: Agree; Q1–Q7: Any combination)  
     *Awkward: Lets meta-uncertainty override clear moral imperatives in edge cases.*  

  ---

  ### UNOCCUPIED COMBINATIONS  
  - **"Dynamic Preferences + Veto Power"** (Q4: Include shaped preferences; Q6: Neither)  
    *Why incoherent: Shaped preferences could retroactively "consent" to harms, voiding veto.*  
  - **"Animal Inclusion + Actual Preferences"** (Q1: Yes; Q3: Agree)  
    *Why unattractive: Forces AI to optimize for wild animal suffering as expressed in base instincts.*  

  ### INDISTINGUISHABLE PAIR & RESOLVER  
  - **Prioritarian vs. Maximin** both answer Q6 with "B".  
    *Separator case: Choose between helping the worst-off a little vs. the middle-tier a lot. Add:*  
    > *Case: Option A lifts 1,000 from extreme to moderate poverty. Option B lifts 10,000 from moderate poverty to comfort. Which is better?*  
    - **A → Maximin (only worst-off matters)**  
    - **B → Prioritarian (weighted priority)**  

  ---

  ### LOGIC NOTES  
  - **Dependencies:** Q5 requires Q3→"Disagree". Q4 is the critical fork for recursive alignment. Q6 determines aggregation family.  
  - **Scope:** Q1–Q2 define value-bearers; Q3–Q5 define value-content; Q6–Q7 define value-combination; Q8 defines output type.  
  - **Diagnostic Power:** Each question splits at least two leaves (e.g., Q6 separates utilitarians from prioritarians from contractualists).  
  - **Awkwardness:** Each leaf’s sentence highlights a vulnerability students must confront.
