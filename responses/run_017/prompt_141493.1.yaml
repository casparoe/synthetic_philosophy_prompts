          P2's set is {2,3}. 
          Intersection with {1,2}: {2}.
          So P2 updates to state2 -> P(A)=1.
     So they agree in one round.

  To have more rounds, we need a chain of information. 

  Example from the paper:

  Three states: a, b, c.
  Event A: state a.

  Player1: partition { {a,b}, {c} }
  Player2: partition { {a}, {b,c} }

  In state b:
    P1: {a,b} -> P(A)=1/2
    P2: {b,c} -> P(A)=0

  Announce: P1:0.5, P2:0.

  P1 hears 0 -> knows that P2 must have seen {b,c} (because if {a} they would have said 1). 
    Then P1's set is {a,b} intersect with {b,c} = {b}. 
    So P1 updates to state b -> P(A)=0.

  P2 hears 0.5 -> knows P1 must have seen {a,b} (because if {c} they would have said 0). 
    P2's set is {b,c} intersect {a,b} = {b}. 
    So P2 updates to state b ->0.

  One round.

  To take two rounds, we need more states. 

  Example with 5 states: 1,2,3,4,5.
  Event A: state 1.

  Player1:
    {1}, {2,3}, {4,5}

  Player2:
    {1,2}, {3,4}, {5}

  In state 3:
    P1: {2,3} -> P(A)=0 (because A only in state1)
    P2: {3,4} -> P(A)=0

  Announce:0,0. 
    Then they both already know it's not state1, and they might already know more, but they agree.

  In state 2:
    P1: {2,3} ->0
    P2: {1,2} ->0? because state1 is the only in A, and it's not in {1,2} with high probability? 
          states 1 and 2: state1 in A, state2 not. -> P(A)=1/2.

  Announce: P1:0, P2:0.5.

  Update:
    P1 hears 0.5: 
        P2's partition: {1,2} ->0.5, {3,4}->0, {5}->0.
        so P2 must have seen {1,2}.
    P1's set: {2,3}. 
    Intersection with {1,2}: {2}.
    So P1 now knows state2 -> P(A)=0.

    P2 hears 0:
        P1's partition: {1}->1, {2,3}->0, {4,5}->0.
        so P1 must have seen {2,3} or {4,5}.
    P2's set: {1,2}.
    Intersection with {2,3} is {2}, with {4,5} is empty.
    so must be {2,3} -> state2.
    P2 updates to state2 -> P(A)=0.

  One round.

  I think for the activity, one round is sufficient to illustrate the updating.

   In summary, we will proceed with the common prior activity as described.

  For the objection about perfect Bayesian: 
    - We can say that the theorem is a benchmark. In practice, people may not update perfectly, but the theorem shows that if they did, they would have to agree.
    - There are results showing that even with bounded rationality, if the updating is done in a Bayesian manner, agreement is reached in at most n rounds for a state space of size n.

   Also, the result you are thinking of might be from computer science: in the worst case, the number of rounds is logarithmic in the size of the state space? or linear. 

   But I recall that for two players, the number of rounds is at most the minimum of the sizes of their partitions.

   In any case, for the activity, we can say that in the examples we did, it took only one round, but in larger state spaces, it might take more, but it always terminates.

   I hope this helps.
answer: |-
  Below is a comprehensive activity design for your Aumann's agreement theorem session, optimized for engagement, experiential learning, and debriefing. It includes two variants (common prior and broken prior), addresses your constraints, and prepares you for common pitfalls and objections. The activity uses **printed cards, poker chips**, and a **whiteboard**, with no laptops or real money.

  ---

  ### **Activity Overview: Aumann's Agreement Game**
  **Goal:** Experience how repeated public announcements of probabilities force convergence to consensus *without new information*, and identify why this fails when priors differ.  
  **Groups:** 3–4 players per group (14 people → 3–4 groups of 3–4 players).  
  **Time:** 60 minutes play, 30 minutes debrief.  
  **Materials per Group:**  
  - **State cards**: 4 cards labeled (1, 2, 3, 4) for the common prior game; 6 cards (1–6) for the broken prior.  
  - **Information sheets** (one per player): Describe partitions and event A.  
  - **Poker chips** (30 per player, 1 chip = 1 "point" for betting).  
  - **Whiteboard** to track announcements.  
  - **Moderator cheat sheet** (for you to circulate).  

  ---

  ### **Game 1: Common Prior (30 minutes)**  
  **Setup:**  
  - **State space:** 4 states (1, 2, 3, 4), uniform prior (P = 0.25 each).  
  - **Event A:** State is 1, 2, or 3 (P(A) = 0.75).  
  - **Partitions (information sets):**  
    - Player 1: `{1,2}` or `{3,4}`  
    - Player 2: `{1,2,3}` or `{4}`  
    - Player 3: `{1}`, `{2,3}`, or `{4}`  
    *(For 4 players, use [this 6-state variant](link_to_appendix)).*  

  **Rules:**  
  1. Moderator shuffles state cards, draws one secretly (e.g., state 3), and tells each player their information set (e.g., P1: `{3,4}`, P2: `{1,2,3}`, P3: `{2,3}`).  
  2. Players calculate their **posterior for A** privately (using prior + their information set):  
     - *Example (state 3):*  
       - P1: `{3,4}` → P(A) = P(3)/[P(3)+P(4)] = 0.5 (since 3∈A, 4∉A).  
       - P2: `{1,2,3}` → P(A) = 1 (all states in A).  
       - P3: `{2,3}` → P(A) = 1 (both in A).  
  3. **Round 1:** Players announce posteriors in order (P1→P2→P3). Record on whiteboard.  
  4. **Update:** Players refine their information set using others' announcements.  
     - *Example:* P1 hears P2=1 and P3=1. P2’s announcement=1 implies their set is `{1,2,3}` (not `{4}`, as P2 would say 0). P3’s announcement=1 implies their set is `{1}` or `{2,3}`.  
     - P1 computes intersection: `{3,4}` ∩ `{1,2,3}` = `{3}`, and `{3}` is only in P3’s `{2,3}`. P1 now knows the state is 3 → updates to P(A)=1.  
  5. **Round 2:** Re-announce posteriors (now P1=1, P2=1, P3=1). Consensus reached!  
  6. **Betting (to "prise apart" agreement vs. action):**  
     - After consensus, offer a bet: "Sell a chip that pays 10 chips if A is true, at price *p*" (where *p* is the agreed probability, e.g., 1).  
     - Rational agents should be **indifferent** (no trade), but players may accept/reject due to:  
       - **Risk aversion:** A risk-averse player rejects (fair bet isn’t worth risk).  
       - **Ambiguity aversion:** Players distrust the setup after complex updates.  
       - *Real reason:* Agreement on probability ≠ willingness to act if utility isn’t linear.  

  ---

  ### **Game 2: Broken Prior (15 minutes)**  
  **Setup:** Identical to Game 1, but:  
  - **Secret change:** Moderator uses a **non-uniform prior** (P(1)=0.5, P(2)=0.3, P(3)=0.1, P(4)=0.1) when drawing states. Players *still assume uniform prior*.  
  - **Why it breaks:** Players update incorrectly (using wrong prior).  

  **Play (state 2):**  
  - Players get info sets: P1: `{1,2}`, P2: `{1,2,3}`, P3: `{2,3}`.  
  - **Initial posters (wrong uniform prior):**  
    - P1: `{1,2}` → P(A) = 1 (both in A).  
    - P2: `{1,2,3}` → P(A) = 1.  
    - P3: `{2,3}` → P(A) = 1.  
  - **Announcements:** All 1.0 → *False consensus* (true P(A) is 1, but only by luck).  

  **Play (state 3):**  
  - Players get: P1: `{3,4}`, P2: `{1,2,3}`, P3: `{2,3}`.  
  - **Initial posters (wrong uniform prior):**  
    - P1: `{3,4}` → P(A) = 0.5.  
    - P2: `{1,2,3}` → P(A) = 1.  
    - P3: `{2,3}` → P(A) = 1.  
  - **Update:**  
    - P1 refines to `{3}` (using same logic as Game 1), updates to P(A)=1.  
    - **But true P(A|{3}) under broken prior:** State 3 has P(3)=0.1, but since A is true, P(A)=1. Consensus still holds, but for wrong reasons!  
  - **Where failure emerges:** Use **state 4** (A is false):  
    - Players get: P1: `{3,4}`, P2: `{4}`, P3: `{4}`.  
    - Initial posters:  
      - P1: P(A) = 0.5 (as above).  
      - P2: P(A) = 0 (since 4∉A).  
      - P3: P(A) = 0.  
    - P1 updates: Hears P2=0, P3=0 → deduces state is 4, updates to 0. **Consensus!**  
    - **Debrief reveal:** True P(A|{4}) = 0, but this hides the prior break. Players *think* they updated correctly, but their model was wrong.  

  **Why convergence "fails":**  
  - Agreement still occurs, but it’s **accidental**—players agree on the *number* but not the *same knowledge*.  
  - Key insight: **Common prior is essential** for consensus to reflect shared reality. Without it, agreement is possible but meaningless (the "no content" result).  

  ---

  ### **Debrief (30 minutes)**  
  **Map gameplay to theorem:**  
  | **Component**       | **In Game (state 3 example)**                               |  
  |---------------------|------------------------------------------------------------|  
  | State space         | {1,2,3,4}                                                  |  
  | Common prior        | Uniform (P=0.25)                                           |  
  | Partitions          | P1: `{1,2}`, `{3,4}`; P2: `{1,2,3}`, `{4}`; P3: `{1}`,`{2,3}`,`{4}` |  
  | Initial posterior   | P1: 0.5, P2: 1, P3: 1                                      |  
  | Announcements       | Public sharing of posteriors                               |  
  | Common knowledge    | All hear P1=0.5, know others heard it, etc.                |  
  | Posterior update    | P1 eliminates states inconsistent with P2=1/P3=1           |  
  | Agreement           | All converge to P(A)=1 after one round                     |  

  **What the game can’t show:**  
  - **Infinite state spaces:** Convergence may require more rounds.  
  - **Simultaneous announcements:** Players announce sequentially for simplicity.  
  - **Common knowledge of posteriors:** In practice, players may doubt comprehension.  

  **Predictable pitfalls:**  
  1. **"Averaging" numbers:** Players may average peers' posters instead of Bayesian updating. *Intervene:* Clarify "update using information sets, not numbers."  
  2. **Refusal to move:** Stubborn players may not update. *Solution:* Use poker chips to incentivize (e.g., "closest to final poster wins 5 chips").  
  3. **Arithmetic errors:** Provide calculators or simplify fractions.  

  **Answering objections:**  
  > **"Real people aren’t perfect Bayesians!"**  
  > - **Rebuttal 1:** The theorem isn’t descriptive—it’s *normative*. It shows that **rationality + common knowledge implies agreement**. Disagreement implies irrationality or broken assumptions (e.g., priors).  
  > - **Rebuttal 2 (advanced):** Even with bounded knowledge, convergence is fast. The **Parikh-Krasucki theorem** (1990) shows agreement occurs in at most **2<sup>n</sup> rounds** for n players, independent of state space size. In practice, it’s faster (your game took 1–2 rounds).  
  > - **Rebuttal 3:** Human biases (e.g., confirmation bias) mimic "partition mis-specification" in the model—useful for discussing real-world failures.  

  **Trading insight:**  
  - After consensus, players may still trade due to **risk aversion** or **ambiguous utility** (not probability). This mirrors **no-trade theorems**: With common knowledge of rationality, no trade occurs, but real agents trade for non-probabilistic reasons.  

  ---

  ### **Materials Appendix**
  **Information Sheets (Game 1):**  
  - **Player 1:** "You see {1,2} or {3,4}. Event A: state is 1, 2, or 3. Prior: All states equally likely."  
  - **Player 2:** "You see {1,2,3} or {4}. Event A: state is 1, 2, or 3. Prior: Uniform."  
  - **Player 3:** "You see {1}, {2,3}, or {4}. Event A: state is 1, 2, or 3. Prior: Uniform."  

  **4-Player Variant (6 states):**  
  - States: 1–6, P(A)=4/6 (A: states 1–4).  
  - Partitions:  
    - P1: `{1,2}`, `{3,4}`, `{5,6}`  
    - P2: `{1,2,3}`, `{4,5,6}`  
    - P3: `{1,2,3,4}`, `{5,6}`  
    - P4: `{1}`, `{2,3}`, `{4}`, `{5,6}`  

  **Moderator Cheat Sheet:**  
  - Common prior: Draw states uniformly.  
  - Broken prior: Use P(1)=0.5, P(2)=0.3, P(3)=0.1, P(4)=0.1.  
  - Betting: After consensus, offer: "Sell 1 chip for *p* that pays 10 chips if A is true."  

  ---

  This design ensures players *feel* the theorem’s mechanics, confront prior dependency, and experience key nuances (agreement vs. action). The debrief links gameplay to formalism and preempts skepticism. Let me know if you need printable sheets or further refinements!
