  Debrief points:

  - Map the game to the theorem: state space, prior, partitions, posterior, common knowledge of posteriors.
  - Why the process stops: because the partition is finite, and at each step the information set is refined, and eventually they reach the meet of the partitions.
  - Features the game can't reproduce: in the theorem, they announce simultaneously and repeatedly until no change. In the game, we did sequential announcement. But the result is similar.
  - What might go wrong: 
     - Players might not update correctly (Bayesian updating is hard).
     - They might average the announced probabilities (which is wrong).
     - Arithmetic errors.
  - Answer to "perfect Bayesian" objection: 
     - The theorem is about what rational agents must do. If they are rational and have common knowledge of rationality and common prior, then they must agree.
     - There are bounded rationality models that show how many rounds are needed. In particular, in the worst case, the number of rounds needed is related to the depth of the partition. 
     - There is a result by Geanakoplos and Polemarchakis (1982) that even if the agents are not initially in agreement, after a few rounds of announcing, they will agree. And the number of rounds is bounded by the number of states in the state space? Or by the depth of the partition lattice.

  The result you are thinking of: in a finite state space, the agreement is reached in a number of rounds that is at most the size of the state space. 

  There is also the fact that the process always terminates.

   Moreover, there are examples where it takes arbitrarily many rounds if the state space is large, but in practice for small state spaces, it's fast.

  But in our activity, it took only one round.

