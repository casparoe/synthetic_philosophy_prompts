   The procedure will be a decision tree with fixed questions. We'll base it on the following ideas:

   1. **Persistence of Goals**: Does the behavior stem from a goal that is set by the system (e.g., the base model's training, the system's design) or by the character (as defined by the user's character card and the context of the conversation)? If the goal is set by the system and persists across different character contexts, then it's a system issue.

   2. **Responsiveness to Reasons**: If the behavior can be corrected by providing reasons (e.g., via system prompt adjustments, or by the user correcting the character in the conversation) and the system is designed to be responsive to such reasons, then the system might be at fault for not being properly responsive. However, if the behavior is consistent with the character's defined traits and the character is not supposed to be responsive to reasons (e.g., a stubborn villain), then it's the character.

   3. **Ability to Do Otherwise**: Could the system have avoided the behavior given the same context? If the system is designed to always generate such behavior in that context (due to model limitations, design flaws, etc.), then it's a system issue. If the behavior was an aberration that the system could have avoided (but didn't due to, say, randomness or a one-off error), then it might be a bug. However, if the behavior is consistent with the character and the context, then it's the character.

   4. **Accountability**: Who can appropriately apologize or take responsibility? This is your "who-can-apologise" test. If the company must apologize (because the system failed to operate as intended), then it's a system issue. If the character (or the user, as the creator of the character) should be the one to apologize (because the behavior was in line with the character's role), then it's a depiction.

