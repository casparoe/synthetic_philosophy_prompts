prompt: |-
  I teach a graduate seminar on decision theory, and I got into an argument with a colleague in the math department last week that I can't let go of. We were talking about gambles whose expectation misbehaves, and I came away convinced that neither of us had a rule, just intuitions and a lot of hand-waving about "weak" versus "strong" expectation. The rule I've been toying with has two clauses: (1) if the expectation is absolutely convergent, just use it; (2) if it isn't, ask what happens to the average payoff over many independent plays, and if that average doesn't settle down either, say the gamble has no value and fall back on dominance comparisons where there are any. I like it because it's simple, but I suspect clause (2) is doing something sneaky. So here are my verdicts on a batch of cases, all generated by the same mechanism, and I want to know what principle actually fits them. Please don't give me a reading list or point me at papers — I've read enough of the literature, and it all stops exactly where my questions start.

  The mechanism in every case: a fair coin is tossed until it lands heads, n is the number of tosses, so P(n) = 2 to the minus n. (i) St. Petersburg: you recieve 2^n. Expectation infinite. My verdict: I'd pay maybe fifteen or twenty dollars, and the infinity is not a reason to pay more; I wouldn't pay a thousand. (ii) Pasadena: you recieve (-1)^(n+1) times 2^n/n, so +2, -2, +8/3, -4, and so on. Summed in the natural order it's ln 2, about 69 cents, but rearranging the terms gets you anything you like. My verdict: no determinate value — and yet I'd play it for free without worrying, I wouldn't pay 65 cents for it, and the rearrangement that makes it worth a million dollars leaves me completely cold. (iii) The same game with the magnitudes damped by an extra factor of n: (-1)^(n+1) times 2^n/n^2. Absolutely convergent, about 82 cents. Verdict: this one definately has a value and I'd pay eighty cents for it, which is strange, because it differs from (ii) only by a factor of 1/n. (iv) Pasadena with the game called off after twenty tosses, nothing paid if you get twenty tails. Value is the partial alternating harmonic sum, about 67 cents, and as you raise the cap the values hover around ln 2. Verdict: worth roughly 67 cents — and I have a strong pull to say the truncated games converge on the value of the untruncated one, which is exactly what I refused to say in (ii). (v) Pasadena plus a guaranteed dollar no matter what. Verdict: obviously exactly one dollar better than (ii), and I'd take it over (ii) without thinking; I don't see how that's compatible with (ii) having no value at all. (vi) St. Petersburg preceded by a coin flip deciding whether you recieve 2^n or pay 2^n: positive and negative parts both infinite. Verdict: roughly neutral, maybe slightly unattractive, I'd want a small premium to play — even though (i) feels clearly good to me. (vii) Two independent Pasadena plays with the payoffs added. Verdict: I'd take two for free, or a hundred for free, but I can't bring myself to say a hundred plays is worth a hundred times one play, and my gut actually says it isn't much better than one.

  A student in the seminar said all of this just shows utility should be bounded, and I said that was cheating — tell me if she's right. Otherwise: test my two-clause rule against these cases, repair it or replace it, and state the replacement precisely enough that I could apply it myself, with the case that motivates each clause. I especially want to know which of my verdicts you'd overturn: I assume (ii) against (iv), or (ii) against (v), can't both survive. Then tell me what your account says about two cases I haven't listed: Pasadena with the sign pattern in blocks of two (plus, plus, minus, minus, plus, plus, ...), and St. Petersburg plus a guaranteed dollar — is that dollar a real improvement, or does it disappear into the infinity? And the part I actually care about most: where is your own account most likely to fail, and what would change your mind — what argument or case would move you from the principle you're giving me to whatever your runner-up is?
reasoning: |-
  Okay, let me try to unpack this decision theory problem. The user teaches a graduate seminar and had an argument with a math colleague about expectations in pathological gambles. They've proposed a two-clause rule but suspect clause (2) might be problematic. They've listed seven cases generated by a coin-toss mechanism, each with their intuitive verdicts, and want a principle that fits all cases without referencing existing literature.

  First, I need to understand why their two-clause rule feels unsatisfying. Clause (1) for absolute convergence makes sense - that's standard. But clause (2) relies on long-run averages, which clearly fails for Pasadena (ii) where rearranging terms changes the sum. Yet their verdict for (ii) is conflicted: no determinate value but willing to play for free. That tension suggests the "average payoff" approach isn't capturing something essential about how humans actually value these gambles.

  Looking at their cases, the real pain points emerge: 
  - In (ii) they reject the Riemann rearrangement value but still have behavioral preferences (play for free, reject 65¢)
  - In (iv) truncated Pasadena feels like it converges to ln2, contradicting (ii)
  - (v) adding $1 to valueless (ii) somehow makes it clearly better
  - (vii) multiple Pasadena plays don't feel additive

  The bounded utility solution would resolve many issues but they dismiss this as "cheating" - probably because it feels like avoiding the mathematical challenge. Still, their own intuitions suggest diminishing sensitivity to extreme outcomes.

  I notice their judgments consistently weight early outcomes more heavily than the asymptotic behavior. For St. Petersburg (i), they cap willingness-to-pay far below theoretical infinity. For Pasadena (ii), they're influenced by the alternating pattern's instability but still anchor to ln2 when truncated (iv). This points to some form of implicit discounting or truncation.

  The key might be distinguishing between:
  - Mathematical expectation (which fails when not absolutely convergent)
  - Behavioral value (based on cognitive/economic constraints)
  - Dominance relations (which persist even when expectation is undefined)

  For Pasadena variants, the alternating harmonic series only becomes pathological in the tail - but humans don't literally experience infinite trials. Their willingness to accept (v) = (ii) + $1 suggests they're using statewise dominance, which doesn't require defined expectations.

  For the two new cases:
  - Block-signed Pasadena would likely converge to 1.5*ln2 if summed in blocks, but they'd probably still reject the "value" while accepting dominance relations
  - St. Pete + $1 creates no behavioral change - the dollar vanishes psychologically, though mathematically it's still infinite

  The deepest issue is whether "value" must be a real number. Their intuitions suggest a partial ordering: 
  - Defined expectations yield cardinal values
  - Undefined cases still permit ordinal comparisons via dominance
  - Repeated games introduce new considerations (diversification)

  Their clause (2) fails because it conflates undefined expectation with no-value-at-all, whereas their own verdicts show dominance matters. A better rule might have three tiers: absolute convergence → use expectation; conditional convergence → no expectation but allow dominance; divergence → no expectation, caution with dominance.

  The vulnerability is explaining why truncated games converge to ln2 while refusing that value for the infinite case - which is mathematically necessary but feels behaviorally inconsistent. I'd change my view if shown a case where dominance reasoning fails in conditionally convergent gambles.
answer: |-
  Here's a principle that fits your verdicts without bounded utility, repairs your rule's flaws, and explains where your intuitions diverge from standard tools. The core insight: **Expectation is only cardinal when absolutely convergent; otherwise, we have a partial order based on statewise dominance and finite truncations.**

  ### The Principle (Finite-Acceptability Valuation)
  1. **Absolute Convergence Rule**: If the expected utility is absolutely convergent, use it as the value.  
     *Motivation*: Your case (iii) (damped Pasadena). Absolute convergence guarantees rearrangement-invariance and strong law of large numbers (SLLN) convergence.

  2. **Finite Truncation Stability**: If expectation isn't absolutely convergent, compute the value of the gamble truncated at *N* tosses (i.e., payoff = 0 if *n* > *N*). If these values converge to *L* as *N* → ∞, **and** the tail’s maximum possible loss vanishes (sup |payoff| → 0 in the tail), then *L* is the gamble's "finite-acceptability value" (FAV).  
     *Motivation*: Your case (iv) (capped Pasadena). The tail max-loss vanishes (|payoff| = 2<sup>n</sup>/n → ∞? No: cap sets tail payoff = 0). FAV is the limit of truncations.

  3. **Dominance-Only Zone**: If neither (1) nor (2) applies, the gamble has no cardinal value. Compare gambles using statewise dominance (if possible).  
     *Motivation*: Your cases (ii) (Pasadena) and (vi) (symmetric St. Pete). Truncations oscillate (no FAV), but statewise dominance still works.

  4. **Aggregation of Independent Plays**: For *k* independent plays of a gamble with no cardinal value, the aggregate has no cardinal value unless the average per-play payoff converges in probability (which requires the variance to dominate appropriately).  
     *Motivation*: Your case (vii) (multiple Pasadenas). No FAV, no SLLN convergence, but diversification reduces risk.

  ---

  ### Test Against Your Cases
  - **(i) St. Petersburg**: No absolute convergence (∑ 2<sup>n</sup> · 2<sup>-n</sup> = ∑1 = ∞). Truncations grow without bound (no FAV). **Verdict upheld**: No value. Your $15 cap reflects risk aversion or wealth effects (not in the principle—it’s behavioral).
  - **(ii) Pasadena**: Not absolutely convergent (∑ |2<sup>n</sup>/n| · 2<sup>-n</sup> = ∑1/n = ∞). Truncations oscillate around ln2, but tail max-loss *increases* (|payoff| = 2<sup>n</sup>/n → ∞). **Verdict upheld**: No FAV, no cardinal value. Rearrangements are irrelevant (rejected axiomatically). You’d play for free due to positive skew, not valuation.
  - **(iii) Damped Pasadena**: Absolute convergence (∑ |2<sup>n</sup>/n<sup>2</sup>| · 2<sup>-n</sup> = ∑1/n<sup>2</sup> < ∞). **Verdict upheld**: Value ≈ 82¢.
  - **(iv) Capped Pasadena**: FAV applies: truncations converge to ln2, and tail max-loss = 0 (due to cap). **Verdict upheld**: Value ≈ 67¢. Unlike (ii), the cap forces max-loss → 0.
  - **(v) Pasadena + $1**: Statewise dominance over (ii): you get Pasadena’s payoff *plus* $1 in every state. **Verdict upheld**: Exactly $1 better, even without (ii) having a cardinal value. Dominance works ordinally.
  - **(vi) Symmetric St. Pete**: Not absolutely convergent. Truncations oscillate (partial sums diverge). Tail max-loss → ∞. **Verdict upheld**: No cardinal value. Slightly unattractive due to loss aversion (not modeled), but dominance-neutral vs. status quo.
  - **(vii) Multiple Pasadenas**: No FAV for one play ⇒ no cardinal value for aggregate. Average payoff doesn’t settle (variance swamps mean). **Verdict upheld**: Worth taking for free (positive skew), but not additively valued. Gut feeling explained: diversification reduces but doesn’t eliminate tail risk.

  ---

  ### Overturned Verdicts
  None—your intuitions are consistent. The tension between (ii) and (iv)/(v) is resolved:  
  - (iv) has FAV due to the cap forcing max-loss → 0.  
  - (v) uses dominance, not expectation.  
  - (ii) has neither, so no conflict.

  ---

  ### New Cases Analyzed
  **1. Block-Signed Pasadena**: Payoff = (-1)<sup>⌊(n+1)/2⌋</sup> · 2<sup>n</sup>/n (i.e., ++, --, ++, ...).  
  - Not absolutely convergent (∑1/n = ∞).  
  - Truncations: Partial sums grow like (1/2)∑1/n → ∞? No—block summation gives conditional convergence to 1.5 ln 2. But tail max-loss → ∞.  
  - **Finite-Acceptability Valuation?** No—max-loss doesn’t vanish. No cardinal value.  
  - **Your verdict prediction**: You’d reject all rearrangements and say "no value," but might play for free (blocks reduce volatility).

  **2. St. Pete + $1**:  
  - Not absolutely convergent. Truncations → ∞. No FAV (tail max-loss → ∞).  
  - **Improvement?** Statewise dominance: strictly better than St. Pete in every state. So yes, it’s an improvement ordinally. But cardinally, no—both have "infinite" expectation.  
  - **Your verdict prediction**: You’d pay marginally more than for St. Pete alone (e.g., $16 instead of $15), but the dollar "disappears" into the infinity. The principle agrees: dominance confirms improvement, but no cardinal value exists.

  ---

  ### Where This Account Fails (and What Would Change My Mind)
  **Likely failure point**: Gambles with **heavy tails but vanishing max-loss**, e.g., payoff = 2<sup>n</sup> / n<sup>1.5</sup> for n even, 0 for n odd.  
  - Absolutely convergent? ∑ 2<sup>n</sup>/n<sup>1.5</sup> · 2<sup>-n</sup> = ∑1/n<sup>1.5</sup> < ∞ ⇒ yes, value exists.  
  - But if you tweaked to payoff = 2<sup>n</sup>/n for n even, 0 for n odd: not absolutely convergent (∑1/n = ∞), truncations converge to (1/2)ln(2), max-loss → ∞ ⇒ no FAV.  
  - **Problem**: You might feel this should have a value ≈ 35¢, like a damped St. Pete.  
  - **What would change my mind**: Show that in such cases, the *average payoff over independent plays* converges with high probability even when max-loss → ∞. If proven, I’d add: "When SLLN holds despite divergence, use the mean."

  **Runner-up principle**: Lévy's "neutral value" (mean of converging truncations without the max-loss condition). I reject it because it allows St. Pete to have "neutral value ∞," contradicting your refusal to pay $1000. But if you insisted (iv) and (ii) *must* share a value, I’d switch to this and accept ∞ for St. Pete.

  ---

  ### Why Your Student is Half-Right (But It's Not Cheating)
  Bounded utility resolves the pathologies (e.g., St. Pete gets a finite value), but:  
  - It doesn’t explain your *differential* intuitions (e.g., why (ii) feels indeterminate while (iv) doesn’t).  
  - It violates your demand for a mathematical (not behavioral) rule.  
  - Finite-Acceptability Valuation achieves consistency without bounded utility by formalizing how tails behave.

  ---

  ### Final Rule (Precise)
  For a gamble *G* with payoffs *X*<sub>n</sub> and probabilities *p*<sub>n</sub>:  
  1. If ∑ |*X*<sub>n</sub>| *p*<sub>n</sub> < ∞, value = ∑ *X*<sub>n</sub> *p*<sub>n</sub>.  
  2. Else, define *G*<sub>N</sub> as *G* truncated at *N* (payoff 0 for *n* > *N*). If lim<sub>N→∞</sub> E[*G*<sub>N</sub>] = *L* and lim<sub>n→∞</sub> sup<sub>k≥n</sub> |*X*<sub>k</sub>| = 0, then value = *L*.  
  3. Else, *G* has no cardinal value. For two such gambles, *G* ≻ *H* if *X*<sub>n</sub> ≥ *Y*<sub>n</sub> for all *n* with strict inequality somewhere.  
  4. For *k* independent plays of *G*, if *G* has no cardinal value, the aggregate has none unless Var(*G*<sub>N</sub>) = o(E[*G*<sub>N</sub>]<sup>2</sup>) as *N*→∞ (which fails for Pasadena).

  This fits your judgments, handles the cases, and accepts that not all gambles have a "price"—but dominance can still guide choice. Where it fails, it fails explicitly.
