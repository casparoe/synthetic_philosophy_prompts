  **Plannum Group Decision Technologies: Press Kit FAQ**  
  *Because Democracy Should Scale™*

  **Company Blurb:**  
  Plannum delivers the world’s first preference aggregation platform engineered for zero-deadlock outcomes, empowering communities to make frictionless collective choices. Our patented Consensus Engine® transforms divergent opinions into clear, actionable decisions without compromise.

  **Pricing Tiers:**  
  - **Standard Consensus:** Member ideological alignment profiling + core ballot resolution.  
  - **Enterprise Governance:** Cardinal intensity weighting + automated alternative relevance screening.  
  - **Platinum Conclave:** Rotating Facilitator Authority + personal sovereignty spheres.  

  ---

  **FREQUENTLY ASKED QUESTIONS**  
  *Answered by Dr. Evelyn Thorne, Head of Product Integrity*  

  **Q: How does Plannum ensure decisions reflect the "will of the group"?**  
  Our onboarding includes a proprietary Ideological Coherence Assessment™. By mapping members onto a unified preference axis and verifying single-peakedness, we guarantee outcomes align with the Condorcet-efficient median voter. This eliminates cyclical preferences and ensures every decision has unambiguous majority support. Communities report 92% faster resolution times post-onboarding.  

  **Q: Can irrelevant options distort our results?**  
  Plannum’s Relevance Screening Module pre-processes all proposals. Alternatives unlikely to achieve consensus or deemed "distractors" via early sentiment signaling are removed before ballots launch. Crucially, every option presented *can* win, making IIA compliance automatic. Voters appreciate simplified ballots, and our data shows ballot sequence optimization boosts satisfaction by 47%.  

  **Q: What if some members care more intensely about an issue?**  
  The Intensity Slider™ in Enterprise/Platinum tiers captures cardinal utility. Members weight preferences from 0 (indifferent) to 10 (paramount). The system aggregates these intensities democratically, ensuring high-stakes preferences outweigh minor objections. 83% of users say this mirrors real-world deliberation better than ordinal ranking.  

  **Q: Explain the Rotating Facilitator role.**  
  Each poll cycle designates one member as Facilitator. They curate proposals (using our bias-correcting templates), set ballot sequences, and resolve ties. Since 98% of polls conclude without tie intervention, Facilitators primarily steward process hygiene. Their influence is structural, not personal—no single user dictates outcomes. Efficiency gains average 79%.  

  **Q: What are "Personal Sovereignty Spheres"?**  
  Platinum users designate low-impact domains (e.g., "bike rack paint color") where one member’s preference auto-ratifies. This respects individual autonomy on trivial matters. While technically overriding unanimity (e.g., if purple paint passes despite one member’s hatred of purple), trade-offs are confined to statistically negligible utility loss.  

  **Q: Why offer a binary-only voting mode?**  
  Binary choice is preference aggregation’s most robust edge case. Options are paired recursively until a final winner emerges. This satisfies all formal conditions for a social ordering by construction. Clients valuing axiomatic purity over speed use this for foundational bylaws.  

  **Q: An investor mentioned "Arrow’s Theorem." Should we be concerned?**  
  Legacy academic concerns focus on unrestricted preference domains. Plannum’s innovation is optimizing *feasible* input spaces for real groups. Our system generates transitive, non-dictatorial, Pareto-optimal outputs by design—verified by 1,200+ municipal deployments. Theoretical impossibilities vanish under operational best practices.  

  **Q: Can we exclude members with "non-standard" preferences?**  
  The Ideological Coherence Assessment flags statistically deviant profiles during onboarding. These users receive tailored coaching to align preferences with group norms. Persistent outliers may be assigned to subcommittees where local non-median outcomes are containable. 96% achieve coherence post-training.  

  ---

  **TESTIMONIALS**  
  > *"Before Plannum, our co-op spent months debating compost systems. Now we ratify budgets in hours! The intensity sliders finally let me prioritize childcare subsidies over rooftop bee habitats."*  
  > — **Rita Chen**, Solidarity Arts Collective Coordinator  

  > *"Plannum operationalizes democratic ideals within computable parameters. By embedding domain restrictions and cardinal comparability into user experience, it achieves what social choice theory deemed paradoxical: coherent aggregation under constraints."*  
  > — **Prof. Arthur Vance**, Chair, Center for Democratic Systems (Independent Advisor)  

  — END —  

  ---

  **Planning Notes (Escape Routes):**  
  - **Unrestricted Domain → Single-Peaked Enforcement:** Onboarding filters/preferences to single-peaked axis; median voter wins.  
  - **Independence of Irrelevant Alternatives (IIA) → Pre-Screening:** "Irrelevant" alternatives removed *before* voting; IIA vacuously satisfied on curated ballots.  
  - **Ordinal Preferences → Cardinal Input:** Intensity sliders enable interpersonal utility comparison; violates ordinal-only requirement.  
  - **Non-Dictatorship → Rotating Facilitator:** Facilitator’s tie-breaking/agenda control is formally non-dictatorial (rotates) but functionally dictatorial in edge cases.  
  - **Pareto/Liberty Conflict → "Sovereignty Spheres":** Personal auto-ratification on trivial choices overrides unanimity (Sen’s minimal liberalism paradox).  
  - **Ordering Requirement → Binary Mode:** Recursive pairwise voting constructs a full ordering; sidesteps intransitivity.
