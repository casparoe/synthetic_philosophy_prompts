answer: |-
  Here is a disambiguation of "guilt can't be inherited," organized as requested, with stress-tested principles and mapped to your framework:

  ### **Menu of Theses**  
  *(Ordered from most trivial to most radical)*

  1. **Biological Criminal Guilt**  
     - **Thesis**: No living individual bears *personal criminal liability* for acts committed by biological ancestors.  
     - **Status**: Near-conceptual truth (criminal guilt requires personal *actus reus* and *mens rea*).  
     - **Job Done**: Rejects individual criminal liability.  
     - **Your Principle**: Clean-hands-by-descent.  
     - **Gap Bridged**: 0% (trivially true but irrelevant to obligations).  
     - **Stress Tests**: Survives all (i-v) trivially.  

  2. **Subjective Moral Blameworthiness**  
     - **Thesis**: No one is *morally blameworthy* for ancestor’s acts absent personal complicity.  
     - **Status**: Defensible (blameworthiness typically tied to agency/knowledge).  
     - **Job Done**: Rejects individual moral guilt/shame.  
     - **Your Principle**: Clean-hands-by-descent.  
     - **Gap Bridged**: 10% (addresses emotions, not obligations).  
     - **Stress Tests**: Survives all (i-v).  

  3. **Institutional Continuity (Criminal)**  
     - **Thesis**: The *state as corporate agent* cannot "inherit" criminal guilt (states aren’t moral agents).  
     - **Status**: Contested (e.g., vs. "state crime" theories).  
     - **Job Done**: Rejects state criminal guilt.  
     - **Your Principle**: Clean-hands (applied institutionally).  
     - **Gap Bridged**: 20% (focuses on criminality, not reparative duties).  
     - **Stress Tests**: Fails (iii) if successor state assumes liabilities via continuity.  

  4. **Moral Taint via Descent**  
     - **Thesis**: Biological lineage alone cannot impose *moral responsibility to repair*.  
     - **Status**: Defensible but contested (vs. "beneficiary pays" principles).  
     - **Job Done**: Rejects descent-based reparative duties.  
     - **Your Principle**: Clean-hands-by-descent.  
     - **Gap Bridged**: 30% (targets biological transmission).  
     - **Stress Tests**: Survives (i, ii); fails (iv) if claims *can* transmit biologically.  

  5. **Political Liability via Membership**  
     - **Thesis**: Mere citizenship ≠ inheriting *political liability* for pre-membership wrongs.  
     - **Status**: Live controversy (e.g., "political community as transgenerational").  
     - **Job Done**: Rejects state apology/repair as "speaking for" citizens.  
     - **Your Principle**: Undischarged-debt (denies continuity of obligation holder).  
     - **Gap Bridged**: 40% (attacks polity-based duties).  
     - **Stress Tests**: Survives (i, v); fails (iii) if state continuity is affirmed.  

  6. **Proprietary Guilt**  
     - **Thesis**: Holding *stolen property* doesn’t make one "guilty," only liable to return it.  
     - **Status**: Straightforwardly false (guilt ≠ liability; "tainted asset" is a property concept).  
     - **Job Done**: Illegitimately conflates guilt with restitution.  
     - **Your Principle**: Tainted-asset (deliberately misnamed by guest).  
     - **Gap Bridged**: 0% (equivocation).  
     - **Stress Tests**: Fails (ii, v) – liability ≠ guilt.  

  7. **Metaphysical Stigma**  
     - **Thesis**: No one bears *inherent moral stain* from historical group wrongs.  
     - **Status**: Contested (e.g., vs. anti-racist theories of structural complicity).  
     - **Job Done**: Rejects collective shame/identity-based guilt.  
     - **Your Principle**: Clean-hands (applied to identity).  
     - **Gap Bridged**: 50% (denies affective/status dimensions).  
     - **Stress Tests**: Survives (i, ii, v); fails (iv) if victimhood identity transmits.  

  8. **State Successor Obligation**  
     - **Thesis**: A successor state cannot "inherit" *reparative obligations* from a prior regime.  
     - **Status**: False in international law (state continuity implies obligation continuity).  
     - **Job Done**: Rejects state responsibility for pre-republic wrongs.  
     - **Your Principle**: Undischarged-debt (denies persistence of obligation).  
     - **Gap Bridged**: 70% (key to guest’s statutory legality point).  
     - **Stress Tests**: Fails (iii) if registry/tax continuity shows succession; fails (iv) if victim claims persist.  

  ---

  ### **Key Findings**
  - **Most Likely Panelist Meaning**: #5 (Political Liability via Membership), amplified by #1 (Biological Criminal Guilt).  
  - **Strength for Guest’s Goals**: Weak. #5 is contested and doesn’t block state obligations (#8) or proprietary liability (#6).  
  - **Asymmetry (Claims vs. Guilt)**: Claims transmit via *harm persistence* (e.g., ongoing dispossession); guilt does not transmit absent *agency persistence*.  
  - **Your Principles’ Role**:  
    - Guest must deny **Undischarged-debt** (to reject state obligations) and **Tainted-asset** (to block restitution).  
    - **Clean-hands** only blocks descent-based guilt, not institutional/asset-based duties.  
  - **Stress Test Verdict**: Only #1-2 survive all cases unscathed. #5-8 fail key tests (iii, iv), showing the slogan’s inadequacy for the case.  

  ### **One-Line Verdicts**
  1. Trivially true, irrelevant to obligations.  
  2. Plausible for emotions, silent on repair.  
  3. Debates state criminality, ignores civil liability.  
  4. Blocks descent-based duties, permits institutional/asset-based ones.  
  5. Politically salient but legally insufficient.  
  6. Equivocation: guilt ≠ restitution.  
  7. Identity debate, orthogonal to repair.  
  8. Legally false: successor states inherit obligations.  

  This exposes the slogan as a category error (#6) when used against restitution, and overextended (#5, #8) when denying state duties.
