answer: |-
  The mistake lies in assuming the strategy-stealing argument applies to your Hex variant without accounting for the additional "load" rule. Here's a clear breakdown of the issue, what the argument establishes, and why your solver's result for the 4x4 board might be correct:

  ### 1. **Why the Strategy-Stealing Argument Fails Here**
     - **Core Principle**: The strategy-stealing argument relies on the idea that an extra stone is *never a disadvantage* in the base game (standard Hex). If Player 1 makes an arbitrary move and then "steals" Player 2's strategy, the extra stone acts as a free resource—it can only help or be neutral, never harm.
     - **Load Rule Violation**: In your variant, placing a stone increases your load. If Player 1 places an extra stone:
       - Their load starts higher (1 vs. 0).
       - When Player 1 mimics Player 2's strategy, they incur additional load with each move they make (since they're responding to Player 2's moves as if they were Player 2).
       - Player 1's load can exceed Player 2's by 3 before the strategy completes, causing an immediate loss. The extra stone is now a *liability*, breaking the "no disadvantage" assumption.
     - **Example**: Suppose Player 2 has a winning strategy in standard Hex. In your variant, Player 1 steals it but starts with load 1. If Player 2's strategy forces a sequence where Player 1 must place more stones than Player 2 in a critical phase, Player 1 might hit a load difference of 3 and lose before the strategy resolves.

  ### 2. **What the Strategy-Stealing Argument Actually Establishes**
     - **General Case**: For finite, deterministic, perfect-information games without draws:
       - It proves that Player 2 *cannot* have a winning strategy if an extra move is never harmful (i.e., symmetric games like standard Hex).
       - This implies Player 1 has a winning strategy or drawing is possible (but Hex has no draws).
     - **Limitations**:
       - It assumes the extra move is beneficial/neutral. If game rules introduce asymmetry (e.g., your load rule), the argument fails.
       - It doesn't construct an explicit winning strategy; it only proves existence.
       - In small boards (e.g., 2x2 Hex), the argument might technically hold, but the "free pass" move can fail due to lack of space, though this is rare and debated.

  ### 3. **Brute-Force Solver and Contested Interpretations**
     - **Your Solver (4x4 Result)**: If your brute-force solver shows Player 2 wins, it's likely correct. The load rule fundamentally changes the game:
       - Player 2 can force Player 1 into high-load states. For example:
         - Player 2 might play passively, forcing Player 1 to connect while accumulating load.
         - If Player 1's load leads by 3 at any point, they lose immediately.
       - Small boards (like 4x4) are sensitive to such rules—Player 2 may exploit the load asymmetry effectively.
     - **Contested Points in Combinatorial Game Theory (CGT)**:
       - **Strategy-Stealing Scope**: Some argue the argument applies universally to symmetric games, but your variant is asymmetric due to load. Others contend that even in symmetric games, small boards (like 2x2 Hex) can invalidate it if the "free pass" has no viable move—though this is niche and not settled.
       - **Winning Strategy Claims**: The argument proves Player 1 *must* win in standard Hex. In your variant, it fails, so Player 2 winning is plausible. CGT experts might debate edge cases, but the load rule is a clear deviation.

  ### 4. **Conclusion**
  - **Mistake**: The strategy-stealing argument doesn't apply because the load rule makes an extra stone a potential disadvantage. Your solver is likely correct—Player 2 wins on 4x4.
  - **Recommendations**:
    - Verify your solver: Double-check for bugs, but given the load rule, Player 2 winning is consistent.
    - Test smaller boards: On 2x2, Player 2 should win (e.g., Player 1 places a stone, load=1; Player 2 mirrors, forcing Player 1 to exceed load).
    - Adjust rules: If you want Player 1 to win, modify the load condition (e.g., collapse only if load difference ≥ board size).

  The strategy-stealing argument is powerful but requires strict symmetry. Your variant breaks this, so brute-force results take precedence. In combinatorial game theory, this is a well-understood limitation—no serious contention exists when asymmetry is introduced.
