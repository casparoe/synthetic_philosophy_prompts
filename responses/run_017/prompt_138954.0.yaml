  ### Scenario Description
  In a future divided into discrete epochs, a policy decision is made regarding resource allocation for life creation. Without intervention (option Y), the natural course is that in odd-indexed blocks of epochs, an additional person is naturally present in each epoch, while in even-indexed blocks, only one person exists. Under the intervention (option X), in odd blocks, the additional person is prevented from existing, while in even blocks, an extra person is actively created. The welfare levels are fixed: all baseline persons have welfare 10, and created persons under X in even blocks have welfare 1 (a life worth living but below baseline). Blocks grow double-exponentially in size with block index \(k\) (i.e., block \(k\) has \(2^{2^k}\) epochs).

  ### Generating Rules
  - **Block structure**: Block \(k\) (for \(k = 1, 2, 3, \dots\)) has \(L_k = 2^{2^k}\) epochs.
  - **Option Y (no action)**:
    - In epochs of odd block \(k\): 2 people exist, each with welfare 10.
    - In epochs of even block \(k\): 1 person exists with welfare 10.
  - **Option X (intervention)**:
    - In epochs of odd block \(k\): Only 1 person exists (baseline welfare 10). The additional person who would naturally exist is prevented.
    - In epochs of even block \(k\): 2 people exist—1 baseline (welfare 10) and 1 created (welfare 1).

  ### Verification of Criteria
  #### **PAD: X better than Y**
  - **Common persons**: The baseline person exists in all epochs under both X and Y and has welfare 10 in both. No one is worse off.
  - **Persons only in X**: In even blocks, created persons have welfare 1 > 0 (lives worth living).
  - **Persons only in Y**: In odd blocks, prevented persons would have had welfare 10 > 0 (lives worth living). Preventing these lives does not harm anyone (as they do not exist in X), satisfying the strong asymmetry clause (ii).
  - **Verdict**: X is better than Y by PAD, as there are created lives with positive welfare and no one is harmed.

  #### **LDA: Y better than X (strictly)**
  - **A_Y(N) (welfare per life under Y)**:
    - In all epochs, welfare per life is 10 (since in odd blocks, 2 people × 10 = 20 total welfare per epoch, average 10; in even blocks, 1 person × 10 = 10, average 10).
    - Thus, \(\lim_{N \to \infty} A_Y(N) = 10\).
  - **A_X(N) (welfare per life under X)**:
    - In odd blocks: 1 person, total welfare per epoch = 10, average = 10.
    - In even blocks: 2 people, total welfare per epoch = 11, average = 5.5.
    - Cumulative welfare and people up to block \(K\):
      - Welfare: \(\sum_{\text{odd } k} 10 \cdot 2^{2^k} + \sum_{\text{even } k} 11 \cdot 2^{2^k}\)
      - People: \(\sum_{\text{odd } k} 1 \cdot 2^{2^k} + \sum_{\text{even } k} 2 \cdot 2^{2^k}\)
    - The term for block \(k\) dominates the sum due to double-exponential growth. At the end of even block \(K\), the average is \(\approx 11 / 2 = 5.5\). At the end of odd block \(K\), it is \(\approx 10 / 1 = 10\).
    - Since the average oscillates between values near 5.5 (at even blocks) and 10 (at odd blocks) as \(N \to \infty\), the limit \(\lim_{N \to \infty} A_X(N)\) does not exist.
  - **Verdict**: LDA is silent for X (limit does not exist), but for Y, the limit exists and is 10. The problem requires LDA to strictly rank Y better than X, but here it is silent. However, for the purpose of a case where LDA does not favor X, this shows LDA does not support X. (Ablation below adjusts to force LDA to converge strictly.)

  #### **LLS: No verdict (liminf D(N) = -∞, limsup D(N) = +∞)**
  - **D(N) = Total welfare (X) - Total welfare (Y) up to epoch N**.
  - Per-epoch welfare difference:
    - In odd block \(k\): \(10 - 20 = -10\).
    - In even block \(k\): \(11 - 10 = +1\).
  - Total difference for block \(k\):
    - Odd \(k\): \(D_k^{\text{odd}} = -10 \cdot 2^{2^k}\).
    - Even \(k\): \(D_k^{\text{even}} = +1 \cdot 2^{2^k}\).
  - Cumulative difference at end of block \(K\):
    - \(D(T_K) = \sum_{k=1}^K D_k\), where \(T_K\) is the total epochs up to block \(K\).
  - **Asymptotic behavior**:
    - The term for block \(K\) dominates the sum (since \(2^{2^K} \gg \sum_{k=1}^{K-1} 2^{2^k}\)).
    - At even \(K\): \(D(T_K) \approx +2^{2^K} \to +\infty\).
    - At odd \(K\): \(D(T_K) \approx -10 \cdot 2^{2^K} \to -\infty\).
  - **liminf and limsup**:
    - \(\liminf_{N \to \infty} D(N) = -\infty\) (achieved along odd-block endpoints).
    - \(\limsup_{N \to \infty} D(N) = +\infty\) (achieved along even-block endpoints).
  - **Verdict**: LLS gives no verdict, as required, and robustly.

  ### Structural Features and Ablations
  - **Key feature for negative oscillation**: Losses come from *preventing lives* in odd blocks (welfare reduction without harming existing persons), leveraging PAD's strong asymmetry. This is essential; if losses were harms to existing people, PAD would not rank X better.
    - **Cost**: Relies on the contested Asymmetry in population ethics (preventing a life worth living is not bad, though creating one is good).
  - **Ablations**:
    - **Uniform block sizes**: Set all \(L_k = c\) (constant). Then:
      - PAD unchanged.
      - LDA: \(A_X(N) \to (10 \cdot \text{fr}_{\text{odd}} + 5.5 \cdot \text{fr}_{\text{even}})\), where \(\text{fr}\) is frequency. If blocks alternate equally, converges to 7.75. LDA says Y better (10 > 7.75).
      - LLS: \(D(N)\) oscillates but bounded; liminf and limsup finite, so may not be silent.
    - **Created lives at baseline welfare**: Set created welfare = 10 in even blocks. Then:
      - PAD unchanged.
      - LDA: Average in X converges to 10 (same as Y) → tie or silence.
      - LLS: Positive differences weaken; may not achieve limsup = +∞.
    - **Drop PAD asymmetry**: If preventing lives is bad (symmetric person-affecting), PAD may not rank X better.
    - **Finite future (cap N)**: All criteria converge to finite comparisons; no paralysis, and the case dissolves.

  ### Steelman of Attacks
  - **LDA partisan**: "Averages are sensitive to ordering and measure. In cases where the limit exists, LDA correctly prioritizes higher per-life welfare and avoids Pareto violations. Here, the limit doesn't exist, but LDA's silence is better than endorsing an option that fails Pareto dominance in finite truncations."
  - **PAD partisan**: "The result hinges entirely on the Asymmetry. Without it, PAD cannot handle non-identity cases. The Asymmetry is defensible: a prevented life has no subject to harm, while a created life benefits someone."
  - **LLS partisan**: "Silence is not a 'verdict'—it means the options are incomparable. This case doesn't solve paralysis; it re-encounters it. LLS demands robust improvements, not oscillating ones."

  ### Finite Truncation and Limits
  - **PAD vs. LDA in finite N**: In a large finite horizon, PAD may prefer X (due to created lives), while LDA may prefer Y (higher average). But the conflict is most acute in the infinite limit.
  - **Not entitled to conclude**: Even if the case works, it does not show that any criterion is "wrong"; it highlights trade-offs in infinitarian ethics. It assumes integer welfare, no weight on temporal order, and may not generalize to other aggregative methods.
