answer: |-
  ## Joint Memorandum: On the Question of a State's Right to Exclude Would-Be Immigrants

  **To:** Funders & Policy Staff  
  **From:** [Associationist Signatory] & [Critical Signatory]  
  **Date:** October 26, 2023  
  **Subject:** Clarifying Disagreements on Border Control Legitimacy  

  ### 1. Agreed Starting Points
  We begin by outlining core propositions on which we both agree, providing a shared foundation for understanding our subsequent disagreements.

  1.  **Coercion at Borders:** Border controls involve the use of force, threat, or significant imposed cost (detention, deportation, barriers) against specific individuals seeking entry. This constitutes *coercion* in a meaningful sense.
  2.  **State Control of Territory:** States exercise *de facto* control over territory. This control entails the authority to establish and enforce laws *within* that territory. However, this *descriptive* control does not automatically confer a *normative right* (a moral entitlement) to exclude individuals from that territory itself. Control is a fact; justification is needed for how that control is used coercively against outsiders.
  3.  **Limits of the "Club" Analogy:** Comparing a state to a voluntary association (like a club) is imperfect.
      *   **Similarities:** Both involve rules for membership and participation.
      *   **Key Differences:** States claim exclusive control over essential territory; individuals often lack meaningful exit options comparable to leaving a club; birthright membership is central to states, unlike voluntary clubs; states wield vastly greater coercive power affecting fundamental interests (survival, liberty).
  4.  **Empirical Evidence - What It Can and Cannot Do:** Research on the economic (wage effects, fiscal impacts) and institutional effects of immigration provides valuable information.
      *   **It Can:** Inform the *prudential* costs and benefits of specific admission policies under current conditions. Suggest potential challenges or opportunities.
      *   **It Cannot:** Settle the *fundamental moral question* of whether a state is *entitled* to exclude individuals in the first place, regardless of empirical consequences. Nor can it conclusively prove that exclusion is *always* necessary to preserve institutions or well-being; the causal chains are complex and contested.

  ### 2. Decomposing the "Right to Exclude"
  We find it productive to break down the phrase "right to exclude" into distinct normative incidents (types of entitlement), following legal philosopher Wesley Hohfeld's framework. This allows us to pinpoint precise areas of agreement and disagreement. We indicate our individual stances (A = Associationist, C = Critical Signatory) on each incident.

  *   **Claim-Right Against Entry:** An entitlement imposing a duty on outsiders *not* to enter the territory without permission.
      *   A: **Affirms.** States possess this claim-right as an incident of collective self-determination over their territory, analogous to a property owner's right against trespass.
      *   C: **Denies.** Outsiders generally have no prior moral duty *not* to cross a territorial boundary. The burden of justification lies with the coercive actor (the state), not the individual seeking movement.
  *   **Power to Waive the Claim-Right (Set Admission Conditions):** The authority to grant permission to enter, subject to specific terms (e.g., visas, residency requirements).
      *   A: **Affirms.** This power is inherent in the state's territorial authority and self-determination.
      *   C: **Conditionally Affirms.** States inevitably exercise *de facto* power here. However, the *moral legitimacy* of wielding this power depends on the specific conditions imposed and their justification towards those affected. Blanket restrictions are often illegitimate.
  *   **Power to Set Terms After Entry:** The authority to regulate the status, rights, and obligations of those admitted (e.g., pathways to citizenship, access to benefits, work rights).
      *   A: **Strongly Affirms.** This is a core aspect of sovereign self-governance over the political community and its territory.
      *   C: **Affirms with Strong Caveats.** While regulating membership post-entry is necessary, the terms must be non-oppressive and respect fundamental rights. Denying basic rights based *solely* on initial admission status can be problematic.
  *   **Privilege/Liberty of Enforcement:** The freedom (or "liberty" in Hohfeldian terms) to use coercive measures to prevent unauthorized entry or remove unauthorized entrants, without committing a wrong *against the entrant*.
      *   A: **Affirms.** If the state has a valid claim-right against entry, it possesses the correlative liberty to enforce that right using necessary and proportionate means.
      *   C: **Denies.** Enforcement *is* a coercive imposition that *does* potentially wrong the individual. Its permissibility requires independent justification that considers the harm inflicted and the availability of alternatives, not just the state's assertion of a right.
  *   **Immunity Against Override:** Protection against external actors (other states, international bodies) invalidating or dictating the state's admission policies.
      *   A: **Strongly Affirms.** A core element of sovereignty and self-determination.
      *   C: **Conditionally Affirms.** States should generally resist illegitimate external dictates. However, this immunity cannot shield policies that constitute severe human rights violations or aggression contributing to displacement. International cooperation on migration is also legitimate.

  ### 3. Key Disagreements: Cruxes and Tests
  Our residual disagreement primarily concerns the **Claim-Right Against Entry** and the **Privilege/Liberty of Enforcement**. Below, we outline specific cruxes (pivotal points of disagreement), state our positions fairly, identify agreed test cases, and specify what evidence would falsify our respective positions.

  | Crux # | Sub-Question                                                                 | Associationist Position (A)                                                                                                 | Critical Position (C)                                                                                                                                 | Agreed Test Case                                                                                                                               | A's Prediction / Falsification Condition                                                                                                        | C's Prediction / Falsification Condition                                                                                                                         |
  | :----- | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1**  | **Is exclusion justified when the entrant seeks no membership/social integration?** | **Yes.** The right to exclude stems from control over *territory*, not just regulating social bonds. Unauthorized presence is sufficient grounds. | **No.** Coercion preventing non-interactive presence (trade, transit, isolated habitation) is hardest to justify, as the "association" rationale vanishes. | **The Hermit Entrant:** An individual seeks only to live minimally and unnoticed in a vast, sparsely populated area, trade goods at a border outpost, or transit swiftly. No desire for social services or integration. | **Prediction:** Exclusion remains permissible. **Falsified If:** I concede that exclusion in *this specific case* is impermissible without broader implications. | **Prediction:** Exclusion here seems clearly unjustified absent specific harm. **Falsified If:** I concede that mere territorial presence requires permission even when demonstrably harmless and non-interactive. |
  | **2**  | **Does control over territory or shaping membership justify exclusion?**           | **Primarily Territory.** Control over territory entails the right to regulate all presence within it, distinct from membership rules. | **Primarily Membership.** Restricting entry is only potentially justifiable as an exercise in defining the *political community*, not merely controlling dirt. | **The Archipelago Restriction:** A state restricts entry *only* to one specific island in its territory, allowing free movement elsewhere for those admitted there. (Focuses justification on *entry point* control). | **Prediction:** This restriction is legitimate; controlling *any* territorial point of entry suffices. **Falsified If:** I concede this specific restriction is illegitimate without a membership rationale. | **Prediction:** This restriction is arbitrary/unjustified; if exclusion is about membership, restricting only one entry point makes little sense. **Falsified If:** I concede this restriction is legitimate based *solely* on territorial control logic. |
  | **3**  | **Is the "right to exclude" alienable?**                                          | **Yes, generally.** If exclusion is a property-like incident of territorial sovereignty, states should be able to transfer/sell admission rights. | **No.** If admission authority is a fiduciary power held for the benefit of the political community (and potentially humanity), it cannot be sold/leased like private property. | **Admission Slot Market:** A state auctions annual admission slots to the highest-bidding employers or leases its entire immigration quota determination to another state. | **Prediction:** This is a legitimate exercise of sovereignty. **Falsified If:** I concede this constitutes an impermissible alienation of sovereign authority. | **Prediction:** This treats persons/opportunities as commodities and abdicates sovereign responsibility; illegitimate. **Falsified If:** I concede such a market is permissible. |
  | **4**  | **Can exclusion be absolute when survival is at stake?**                          | **Not Absolutely.** While a general right exists, extreme circumstances (catastrophic displacement) may create overriding duties of rescue, potentially requiring admission. | **Rarely Justified.** Exclusion causing death/destitution is almost always impermissible. The right to exclude dissolves when it denies the basic right to exist somewhere. | **The Last Habitable Territory:** Due to global catastrophe, only one state's territory remains fully habitable; others face certain death. Vast numbers seek entry. | **Prediction:** The state retains a core right to control entry but has a severe, potentially overriding duty to admit *some*. Absolute closure *might* still be conceivable but is highly suspect. **Falsified If:** I insist absolute exclusion is *always* permissible regardless of consequence. | **Prediction:** Exclusion here is fundamentally illegitimate; survival needs override territorial claims. **Falsified If:** I concede the state has *no* duty to admit *anyone* in this scenario. |
  | **5**  | **What duties arise if a state causes displacement?**                             | **Duties of Repair/Assistance.** The primary duty is to cease harmful actions and provide compensation or support (financial aid, safe havens *nearby*). Not necessarily a duty of *admission*. | **Potentially Duty of Admission.** If a state's actions (e.g., war, climate policy, economic coercion) directly cause displacement, it incurs a strong, specific duty to offer refuge *within its territory* to those displaced. | **State-Caused Flight:** State A's prolonged military intervention or exploitative trade policies demonstrably destroy State B's economy/ecology, forcing mass migration towards State A. | **Prediction:** State A owes significant compensation, aid, and potentially assistance with resettlement *elsewhere*, but not necessarily open borders. **Falsified If:** I concede causation *automatically* entails a duty of admission proportional to harm caused. | **Prediction:** State A owes a specific duty to admit those it displaced, as it bears direct responsibility for their loss of place. **Falsified If:** I concede causation *only* ever creates duties of compensation, never admission. |
  | **6**  | **What means of enforcement does the right, if it exists, license?**              | **Necessary & Proportionate Means.** Includes documentation, fencing, patrols, detention, deportation. "Necessary" means effective for control; "Proportionate" balances state interest against harm to entrant. | **Highly Constrained Means.** Enforcement causing severe harm (death, indefinite detention, family separation, pushbacks to danger) is virtually never justified. Non-coercive management is strongly preferable. | **Interception at Sea:** State vessels intercept and forcibly return boats carrying potential entrants, knowing some may perish or be returned to persecution. | **Prediction:** Such interceptions can be legitimate if conducted safely and humanely, respecting non-refoulement. **Falsified If:** I concede maritime interceptions *involving force* are inherently illegitimate. | **Prediction:** Forcible interdiction at sea, especially leading to return to danger or death, is a gross violation. **Falsified If:** I concede such interdiction is permissible as a standard tool of border control. |

  ### 4. Points of Collaboration Ceiling & Potential Movement
  *   **Terminological Clarification:** Our disagreement over the **Claim-Right Against Entry** hinges partly on terminology. A understands "right" as a robust moral entitlement inherent in territorial sovereignty. C understands the assertion of such a "right" as a claim needing justification *to the excluded*. This is a foundational difference in perspective, not merely a semantic one. Similarly, regarding **Enforcement Privilege**, A sees it as a logical corollary of a valid claim-right. C sees the enforcement act itself as the primary locus of justification.
  *   **Undefended Premises:** Our deepest divergence rests on premises beyond this memo's scope. A relies on a strong conception of the intrinsic value of political self-determination realized through territorial sovereignty. C relies on a view emphasizing the fundamental interests of individuals subject to coercion and skepticism towards the moral weight of arbitrary borders. Neither premise can be fully defended here.
  *   **Empirical Thresholds:** For Crux 1 (Hermit Entrant), A would be moved by clear evidence that such presence *systematically* caused significant, irreparable harm to the territory or its institutions, despite isolation. C would be moved by evidence that even minimal, non-interactive presence inherently and unavoidably undermines the core functions of territorial sovereignty in a way that justifies coercion.
  *   **Conceptual Settlement:** Crux 3 (Alienability) is largely conceptual. A requires an argument showing why a sovereign power inherent in territorial control *cannot* be delegated or sold. C requires an argument demonstrating that admission authority is fundamentally different from other sovereign powers (like resource exploitation rights) that *are* often alienated.
  *   **Is Movement Possible?** Honest assessment suggests complete convergence is unlikely, given the foundational nature of our differing premises about the state, territory, and the individual. However, **specific distinctions and cases offer potential for movement at the margins:**
      *   **The Hermit Case (Crux 1):** We agree this tests the territorial rationale most directly. If compelling evidence emerged that *only* exclusion based on membership concerns (not territory control) could be coherently defended, it might push A towards refining the justification. Conversely, if evidence showed such hermits *never* truly remain harmless/non-interactive, it might push C.
      *   **The Last Territory Case (Crux 4):** This extreme case forces both sides to clarify limits. A's concession that exclusion isn't absolute here, and C's potential focus on *scale* (how many *must* be admitted?), represent points where rigid positions soften under pressure.
      *   **Enforcement Means (Crux 6):** Both reject truly barbaric methods. Further empirical evidence on the necessity and proportionality of *specific* harsh measures (like indefinite detention) could nudge both towards a narrower range of potentially acceptable practices, even absent agreement on the core right.

  **Conclusion:** Our collaboration reveals a significant but structured disagreement. We concur on the reality of border coercion, the limitations of analogies and empirical data, and the complexity of the concept of a "right to exclude." We diverge fundamentally on whether states possess a foundational moral claim-right against entry, and consequently, on the permissibility of enforcing exclusion. By decomposing the right and identifying specific cruxes with testable predictions, we have located our disagreements precisely. While our core philosophical commitments make full resolution improbable, examining concrete cases like the Hermit Entrant or the Last Territory, or scrutinizing specific enforcement practices, offers the most realistic path for refining our views and potentially finding limited common ground on the *application* of principles, if not the principles themselves. We present this not as a resolution, but as a clearer map of the dispute.
