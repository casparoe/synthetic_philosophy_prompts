  The user's case is a non-conscious routing system that uses a self-simulation to avoid planner thrashing. The question is whether the symbols in its self-model actually cause the substrate to move or if it's just physics. The user suspects two possible rules: "only tangled hierarchies" (like Hofstadter's Strange Loop concept) or "only consciousness," and they want to know which fits better, plus a test case to distinguish them.

  Looking at the author's pattern, the "yes" cases involve humans who have self-awareness and integrated beliefs. The thermostat and chess engine are straightforward algorithms; the LLM and warehouse robot use learned patterns but no self-reference. The warehouse robot has a map but no self-model affecting decisions. The human cases involve metacognition—thinking about one's own state (rain belief) or knowledge (headache cause).

