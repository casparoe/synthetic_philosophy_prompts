answer: |-
  Right, let's dig into the substance. You're asking for the spec sheet – the genuine requirements a theorem must meet to feel like a proper resolution for ranking risky social prospects under this setup, stripping away the pat answers. I'll walk through the desiderata, flagging controversies and my assessment of their legitimacy, before hitting your specific points and the inevitable conflicts.

  First, the non-negotiables rooted in the setup itself. **Pareto Indifference (over lotteries)** is bedrock. If everyone is indifferent between two prospects, the social ranking must be too. Rejecting this severs the link between individual and social preference entirely, making "aggregation" meaningless. **Social vNM Rationality** is similarly foundational; if we want a coherent social choice under risk mirroring individual rationality under risk (as the setup assumes), the social ranking must satisfy the expected utility axioms. These are settled; rejecting them exits the problem's framing. **Weak Pareto (if everyone strictly prefers A over B, society prefers A)** is almost as core, though one *could* imagine "paternalistic" restrictions overriding unanimous strict preference – but that feels alien to the spirit of aggregating *given* individual preferences. Most working in this space accept Weak Pareto as essential.

  Now, the contentious battlegrounds:

  1.  **Interpersonal Comparisons (IC) & Scale Invariance:** *Must* the weights be derived from something, or are free parameters acceptable? Can we manage without IC? Is separate rescaling invariance essential? These are deeply linked. Harsanyi's original formulation cleverly *sidesteps* strong IC by exploiting vNM representation – social utility is a weighted sum of *individual vNM utilities*, each defined only up to affine transformation. The theorem delivers weights, but their *meaning* (beyond aggregation coefficients) is opaque without interpreting utility differences across people. This is the evasion camp: the weights are free parameters reflecting the planner's value judgments about whose preferences count more. The virtue camp argues this is insufficient; a true *ethical* aggregation requires meaningful comparison of welfare *levels* or *gains* across individuals. This demands **Cardinal and Comparable Utilities (CCU)** – utility functions invariant to *only* identical affine transformations (u_i' = a*u_i + b, with *same a, b for all i*). This makes scale invariance non-negotiable for them. *My view:* The evasion is technically elegant but ethically hollow for prescribing social risk attitudes. CCU is necessary for the weights to have ethical significance beyond arbitrary planner whim. The weights *must* be derived from, or constrained by, a defensible principle grounded in interpersonal welfare comparisons, not left as purely exogenous parameters. Scale invariance (requiring CCU) is essential for the ranking to be invariant to the arbitrary zero and unit chosen for individual utility scales – a genuine requirement for objectivity. The "free parameters" view is a formal possibility, not an adequate *ethical* answer. This is a live dispute, but the CCU camp has the stronger ethical argument.

  2.  **Veil Consistency:** Must ranking behind the veil (ex-ante, equal/prior chance of being anyone) match the planner's ranking after the veil lifts (ex-post)? This pits ex-ante against ex-post fairness. Harsanyi's utilitarian conclusion satisfies this: maximizing expected utility behind the veil *is* maximizing the weighted sum ex-post. But other plausible social welfare functions (SWFs) need not. A prioritarian SWF (concave transformation of utilities) would generally rank prospects differently ex-ante and ex-post. *My view:* Veil consistency isn't inherently necessary. The planner's role *after* the veil lifts might reasonably incorporate concerns (like ex-post inequality aversion) that the purely impartial ex-ante perspective ignores. Insisting on consistency risks conflating two distinct ethical viewpoints. This is contested, with strong arguments on both sides – the veil view emphasizes impartiality, while the ex-post view emphasizes actual outcomes.

  3.  **Variable Populations (Uncertain Identity):** Coping with prospects where who exists (or how many exist) is part of the lottery is crucial for real-world application (e.g., climate policy affecting future generations, medical research). Fixed-population theorems are incomplete. This requires grappling with the "non-identity problem" and the intractable question of comparing existence to non-existence. *My view:* This is a genuine and profound desideratum often sidelined in standard aggregation theorems. Any "adequate answer" *must* address it, even if the solutions are messy and controversial (e.g., critical-level utilitarianism, average utilitarianism). Ignoring it renders the theory practically irrelevant for major policy dilemmas. This is widely recognized as necessary, though solutions are hotly debated.

  **Your Person-Splitting Neutrality:** Replacing one person with two identical "halves" (same utility function, each getting half the resources/utility) shouldn't change social ranking. Is this legitimate or smuggled egalitarianism? It *feels* intuitive – the "total good" seems the same. It's closely related to **Replication Invariance** in welfare economics. *My view:* It *is* a legitimate constraint on aggregation *if* we accept cardinal, comparable utilities and focus on *total* welfare. It forces the SWF to be linear in utilities (utilitarian) *or* homogeneous in a specific way. It rules out Average Utilitarianism (which would prefer the single person scenario if utility functions exhibit decreasing marginal utility of resources) and strong prioritarianism. It *isn't* pure egalitarianism smuggled in; it's a neutrality condition about how welfare is counted across persons, treating welfare itself as the atom. However, its legitimacy *depends* crucially on accepting CCU. Without comparable utilities, "same utility function" is meaningless for welfare levels across different people. *With* CCU, it's a strong argument for (some form of) Total Utilitarianism. This is contested, often seen as a technical axiom rather than a fundamental ethical principle, but I find it compelling as a consistency requirement for welfare aggregation under CCU.

  **Conflicts and the Knockout Punch:** The most significant conflict arises between **CCU/Scale Invariance** and any SWF that isn't linear (i.e., not utilitarian). **Prioritarianism** (giving priority to the worse off) inherently violates scale invariance because the concavity of the transformation is disrupted by rescaling individual utilities independently. **Person-Splitting Neutrality** directly conflicts with **Average Utilitarianism** and conflicts with Prioritarianism if the "halves" become worse off than the original single person. **Variable Populations** introduces deep conflicts between Total and Average views and creates paradoxes (e.g., the Mere Addition Paradox) that plague most approaches. The desideratum doing the most "knocking out" is **Cardinal and Comparable Utilities/Scale Invariance**. It eliminates all non-linear SWFs (Prioritarianism, Nash SWF), forces a specific structure (additive aggregation), and makes the derivation/interpretation of weights central. It's the key that unlocks meaningful interpersonal comparisons but simultaneously constrains the functional form dramatically.

  **Briefly scoring contenders:**
  *   **Harsanyi (Free Weights):** Elegant, satisfies Pareto/vNM/Weak Pareto. Fails on CCU/meaningful weights, Veil Consistency (only if weights unequal), Variable Populations, and Person-Splitting (if weights aren't equal). Adequate formally, inadequate ethically.
  *   **Harsanyi-Veil (Equal Weights):** Adds ethical weight derivation via impartiality. Satisfies Pareto/vNM/Weak Pareto/Veil Consistency. Fails on CCU (weights equal but utility scales still arbitrary), Variable Populations, Person-Splitting (if average utility decreases). Better, but still evades deep IC.
  *   **Total Utilitarianism (with CCU):** Satisfies Pareto/vNM/Weak Pareto/Scale Invariance/Person-Splitting. Can be derived via Veil with prior over identity (satisfies Veil Consistency *if* prior matches weights). Struggles massively with Variable Populations (repugnant conclusion) and ignores distribution (no priority).
  *   **Prioritarianism (with CCU):** Satisfies Pareto/vNM/Weak Pareto/gives priority to worse-off. Violates Scale Invariance/Person-Splitting/Veil Consistency. Handles fixed-population inequality better but falters on the other core desiderata.
  *   **Critical-Level Utilitarianism:** Attempts to handle Variable Populations. Satisfies Pareto/vNM/Weak Pareto/Scale Invariance (if critical level fixed). Violates Person-Splitting (similar to Average) and has its own repugnant conclusions. Veil Consistency complex.

  No contender satisfies all genuine desiderata. CCU/Scale Invariance is the linchpin, forcing linearity and spotlighting the ethical challenge of justifying weights and handling existence itself. Person-Splitting, under CCU, pushes hard towards total views. The conflicts are real and fundamental, not mere technicalities.
