prompt: |-
  Hey — you're a professional philosopher who's also spent years designing active-learning exercises for undergrads, so think like a designer here, not like a lecturer. Start by brainstorming three or four genuinely different mechanics before you commit to one, then think carefully about which one you're recommending and why the others lose. Take your time; I'd rather have one thing that actually runs than five ideas sketched. What I want is a runnable activity, not a syllabus note.

  The setting: I teach a third-year seminar in philosophy of biology — 16 students, mixed, about half biology majors who've had a proper evolution course and half philosophy majors who've had exactly one intro science class. One 80-minute slot. Whiteboard for sure, projector maybe, cheap materials only: index cards, dice, pens, a timer. No real money, but I can put a couple of bonus points on the line for the problem set.

  The idea I want them to run into is the Gould–Lewontin critique of the adaptationist program: the charge that if you carve an organism up into discrete traits and ask of each one what it's for, you can always produce a plausible selective story, and so the program has no way to fail — plus the positive alternatives the critique points at, the stuff that isn't selection: developmental constraint, growth allometries where a trait rides along with body size, phylogenetic inertia, exaptation, a trait being a side-effect of something else that was the actual target. I do NOT want to stand up and say any of this first. They should collide with it while playing and I'll only name it at the end. A few of them have heard the word spandrel before but couldn't explain it; assume nothing beyond that.

  My own half-baked version, improve it or throw it out: I write one-paragraph descriptions of two or three invented species that share a body plan, and print a pile of index cards each carrying one trait of one of them. Unbeknownst to the students, half the traits I lifted from real field-guide descriptions of actual animals and half I generated by mashing a random adjective, a random body part, and a random number — so something like "asymmetrically thickened left rear molar, 3.1 mm," pure noise. Small groups get a subset and score points for the most convincing adaptive explanation per card. Then I reveal which were noise. The problem I can already see is that this only teaches "sometimes the story is wrong," which is boring and isn't the point at all. So I want the scoring rigged somehow — a payoff matrix, a betting round, a fold option — such that the rational move under the rules is to *always* claim a selective explanation, and they discover afterwards that the thing they were being rewarded for was unconstrained. Maybe a second round where the same trait comes back with a sister taxon that lacks it, or with a note about how it scales with body size, and they get to revise their bets. But design whatever beats that. Its probably not rigged right as it stands.

  What I need from you:

  - The actual rules, plus a timeline with minute markers, including what I'm doing while they're working.
  - The payoff scheme written out explicitly, with the bit of arithmetic that makes over-claiming the dominant strategy — and what happens to the lesson if I accidentally invert it.
  - A materials list and setup time.
  - A debrief that maps specific moments in the game onto specific parts of the critique: atomization, the just-so story, the missing null hypothesis, the alternatives. Which moment is supposed to carry which part, and how I call it back without lecturing.
  - What will predictably go wrong the first time I run it, concretely: the biology majors steamrolling their group, someone who definately refuses to speculate without data, someone guessing the twist in round one, the reveal landing as "so evolution is fake" or "so biology is just storytelling," groups running out of time on the writing and never getting to the bets.
  - And be honest about what the activity cannot do. My worry is that it overstates the case: real traits aren't produced by mashing cards, and real biology does have ways of testing an adaptive hypothesis — comparative contrasts, optimality models, engineering or design criteria, whatever you count as genuine. I don't want them walking out thinking the whole program is cargo cult. Tell me which part of that corrective I have to supply myself in the last five minutes, and roughly what I should say.

  If it works, what I want them walking out with is the felt sense that a question can smuggle in its own answer, and that noticing that is different from denying selection matters. No readings list and no citations, please — I've got those sorted. Just the exercise.
reasoning: |-
  Hmm, the user is a philosophy of biology professor designing an active-learning exercise to teach the Gould-Lewontin critique without direct lecturing. They've shared their initial idea about using index cards with real and random traits but recognize it only demonstrates "sometimes stories are wrong," missing the core critique about the unfalsifiability of adaptationism. Their explicit needs include detailed game mechanics, a rigged payoff system that incentivizes over-claiming, debriefing strategies linking game moments to critique components, and anticipatory troubleshooting. 

  The underlying pedagogical challenge is making abstract methodological critique visceral. The trap in their draft is that revealing "noise" traits could reinforce the very adaptationist thinking they're critiquing ("sometimes we guess wrong") rather than exposing the program's structural flaw. Their anxiety about students misinterpreting the lesson as "biology is storytelling" or "evolution is fake" is well-founded—this needs a built-in corrective about legitimate testing methods.

  Key design principles emerging: 
  (1) The game must make rational players behave like caricature adaptationists, then reveal this was systemically encouraged. 
  (2) "Alternatives" to selection should emerge as desirable explanations under revised rules, not just as corrections. 
  (3) The noise/real distinction should be abandoned—it's counterproductive. Better to use ambiguous traits where multiple explanations are plausible.

  The proposed "Adaptationism Roulette" shifts focus to betting on explanation types. Forcing groups to commit to adaptationist stories for every trait—and rewarding them for confidence regardless of content—mirrors the critique's core. The $2/$1 payoff matrix with penalties for abstaining mathematically forces the behavior. Later introducing "Constraint Cards" (developmental, phylogenetic etc.) as new betting options models Gould-Lewontin's positive alternatives. Crucially, the reveal isn't about "lying" but about how the initial rules constrained imagination.

  During debrief, moments map tightly: 
  - Pre-round haggling → atomization problem 
  - Universal adaptation bets → unfalsifiability 
  - Constraint Cards uptake → alternatives framework 
  The "what we missed" list consolidates critique components. The vital corrective—stated explicitly at end—is that real biology uses methods like comparative phylogenetics to test adaptive hypotheses; the critique targets lazy applications, not the entire program.

  Predictable failures: 
  - Biology majors may resist non-selective explanations. Mitigation: Frame constraints as "biology of the possible." 
  - Over-literal students freezing at speculation. Mitigation: Emphasize game's "anthropologist" framing. 
  - Early twist-guessers. Mitigation: Use genuine-seeming traits like giraffe neck or peacock train where constraints are historically debated.

  What the exercise cannot do: Teach actual methods for testing adaptationism. That remains the professor's closing remarks—a 3-minute précis on how real science avoids these traps (e.g., "We use independent contrasts because..."). The bet payoffs model the critique; the spoken correction models the solution.
answer: |-
  Here’s a fully designed activity called **Adaptationism Roulette**, rigged to force the critique through gameplay. It runs 65-75 minutes and targets your core goals without lecturing. Rules are tight, payoffs force overconfidence, and debrief maps directly to Gould-Lewontin.

  ---

  ### **Activity: Adaptationism Roulette**  
  *Core mechanic:* Teams bet on whether traits *must* have a selective explanation. Payoffs punish skepticism.  

  **Materials (Setup: 10 min)**:  
  - 16 **Trait Cards** (index cards): 8 traits with *ambiguous* origins (e.g., "Giraffe neck length," "Human chin," "Peacock train," "Kiwi vestigial wings"). *No "noise" traits—all plausible but debated*.  
  - 4 **Constraint Cards** (index cards): "Developmental Constraint," "Phylogenetic Inertia," "Allometric Scaling," "Spandrel (Side-effect)".  
  - 1 **Payoff Matrix** (whiteboard):  
    | Your Bet → | "ADAPTATION!" | "NOT SURE" |  
    |------------|---------------|------------|  
    | **Win**    | +2 points     | +1 point   |  
    | **Lose**   | -1 point      | 0 points   |  
  - Timer, pens, 4 dice (for group RNG), bonus point chips.  

  ---

  ### **Timeline (80 min total)**  
  **0-5 min: Framing (No theory!)**  
  *You:* "You’re evolutionary anthropologists. Your job: convince peers a trait is an adaptation. Scoring rewards decisiveness." Show payoff matrix. Emphasize: **"Adaptation!" bets can earn double points but risk penalties. "Not Sure" is safe but low-reward.**  

  **5-20 min: Round 1 (Atomization & Just-So Stories)**  
  - *Groups:* 4 teams of 4. Each gets 4 Trait Cards.  
  - *Task:* For each trait, teams have 8 min to:  
    1. Script a **30-second "adaptation pitch"** (even if unsure!).  
    2. Place a **secret bet** ("Adaptation!" or "Not Sure") *before* hearing others.  
  - *Your role:* Roam, clarify rules, *do not engage with science*. Push: "Make it sound convincing—style matters!"  

  **20-35 min: Pitching & Betting**  
  - Each team pitches one trait (30 sec each). After each pitch, all teams *reveal bets* for that trait.  
  - Record bets on whiteboard. *Do not reveal "truth"*.  

  **35-45 min: Payoff Calculation**  
  - *You:* Roll a die per trait:  
    - **1-3:** Trait *could* be adaptation (teams who bet "Adaptation!" **WIN**).  
    - **4-6:** Trait *likely has non-selective origin* (teams who bet "Adaptation!" **LOSE**).  
  - Apply payoff matrix. Emphasize: *Luck dominates outcomes*. "Adaptation!" bettors got +2 or -1; "Not Sure" got 0 or +1.  

  **45-55 min: Round 2 (Constraints & Alternatives)**  
  - Redistribute Trait Cards + add **Constraint Cards**.  
  - *New rule:* Teams bet **"Adaptation!"** or **"Constraint!"** (using new cards). New payoff matrix:  
    | Bet →          | "ADAPTATION!" | "CONSTRAINT!" |  
    |----------------|---------------|--------------|  
    | **Win**        | +3 points     | +3 points    |  
    | **Lose**       | -2 points     | -1 point     |  
  - Teams have 5 min to:  
    - Revise pitches using Constraint Card ideas (e.g., "Kiwi wings: Phylogenetic inertia from flighted ancestor").  
    - Place bets.  

  **55-65 min: Pitching, Betting & Payoffs**  
  - Repeat pitching/betting. Roll die: 1-3 = adaptation, 4-6 = constraint. Settle scores. Award bonus points to top team.  

  **65-80 min: Debrief (Key Questions → Critique)**  
  - *No lecture.* Ask:  
    1. **"In Round 1, what pushed you to bet 'Adaptation!' even if unsure?"**  
       → *They’ll say payoff structure.* Map to: **No way to fail** (critique #1: unfalsifiability).  
    2. **"How did splitting traits from whole organisms feel?"**  
       → *Atomization problem*.  
    3. **"In Round 2, what made 'Constraint!' bets feel safer?"**  
       → *Alternatives exist* (critique #2: pluralism).  
    4. **"Did luck-based scoring frustrate you? Why?"**  
       → **Missing null hypothesis** (critique #3: no test).  
  - **Name Gould-Lewontin:** "You just experienced the adaptationist program critique. The dice were 'just-so stories'—plausible but untestable. Round 2 gave you Gould-Lewontin’s alternatives."  
  - **Corrective (3 min):** "Real biology *tests* adaptation: comparative methods, optimality models, fossil evidence. The critique targets *assumption-first* approaches, not adaptation itself. Your frustration? That’s the point."  

  ---

  ### **Why This Works & Why Others Lose**  
  - **Rigged Payoffs:** Round 1’s matrix makes "Adaptation!" the rational bet. Expected value:  
    - Bet Adaptation!: (0.5 * 2) + (0.5 * -1) = **+0.5**  
    - Bet Not Sure: (0.5 * 1) + (0.5 * 0) = **+0.5**  
    → *But* -1 loss stings more than +2 win feels good (loss aversion). Plus, peer pressure in pitches pushes overclaiming. **If inverted, lesson collapses:** Skepticism would win, masking the critique.  
  - **Alternatives as Tools:** Constraint Cards in Round 2 make non-selective explanations *actionable*, not just criticism.  
  - **No "Noise Traits":** Using real debated traits (e.g., human chin) avoids "biology is fake" and focuses on *method*.  

  ### **Predictable Problems & Fixes**  
  - **Biology Majors Steamrolling:** Assign roles: **Pitcher** (bio major?), **Betting Agent** (phil major?), **Constraint Scout** (all).  
  - **Refusal to Speculate:** Frame bets as "anthropologist role-play." Offer "Not Sure" in Round 1 as a crutch.  
  - **Guessing the Twist:** If someone says "Is this about spandrels?", reply: "Interesting! Why would that matter here?" → Use their insight in debrief.  
  - **Reveal Landing Wrong:** Emphasize in debrief: "This was a *methodology* simulator. Real biologists use evidence—we removed it to expose the trap."  
  - **Time Shortages:** Enforce strict pitching times. Skip 1-2 pitches if needed.  

  ### **What It Cannot Do**  
  - **Teach Valid Adaptive Testing Methods:** You **must** supply this in the 3-min corrective. Say:  
    *"In reality, we test adaptations with:  
    (1) Comparative contrasts (e.g., independent evolution in island vs. mainland),  
    (2) Engineering models (does trait optimize function?),  
    (3) Fossil/developmental evidence (did it evolve before the function?).  
    Gould-Lewontin want *more* rigor, not less."*  
  - **Depth on Specific Constraints:** The Constraint Cards are placeholders. Assign readings post-activity.  

  ---

  **Output:** Students feel the seduction of just-so stories (Round 1), then the relief of pluralism (Round 2). The payoff matrix forces the critique into their hands—no lecture needed. You stay free to coach, nudge, and finally connect dots. Materials cost: $3 for index cards.
