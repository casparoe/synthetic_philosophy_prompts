    - They have 10 minutes to write 3-5 bullet points explaining the outcome. 
    - Then, reveal the true outcome (hit). 
    - Ask tables that had the flop outcome to share their explanations and then reveal they were given the wrong outcome. Discuss briefly how they explained it. 
    - Collect the explanation sheets.

  - 50-80 min: **Compression Activity** (30 min)
    - Hand out the fact deck about the discovery (e.g., penicillin). 
    - Each table must write a 120-word story (strict limit). 
    - They have 15 minutes to write. 
    - Then, each table reads their story (or a representative does). 
    - We note which facts (especially near-misses) were included. 
    - We tally how many tables included each near-miss.

  - 80-90 min: **Debrief** (10 min) - This might be tight, so we'll need to be efficient.

  **Materials:**
  - Prediction sheets (with paragraph and questions) - one per person.
  - A deck of cards and a volunteer to draw.
  - A printed paragraph (for the sentence count). Example: We can use a paragraph from a science article (about 100 words) that has a mix of short and long sentences.
  - Case fact sheet (one per table) and outcome cards (for the explanation activity).
  - Fact deck for the compression activity (one per table).
  - Scoring sheet for the facilitator to record: 
    - Actual outcomes of predictions.
    - For each table: their explanation for the case and whether they had the correct outcome.
    - For the compression: which near-misses were included in each table's story.

  **Debrief Structure:**
  1. **Hindsight Bias (symptom):** 
     - Recall the prediction activity: "How many of you, when you heard the actual number of red cards, thought 'that makes sense' or 'I was close'? But let's check: what was your confidence at the time? How many feel like they were more confident in their prediction after knowing the outcome than before?" 
     - We can show: We will have recorded their initial confidence. Then, at the debrief, ask them to write down what they remember their confidence being for the red card prediction. Then, we can compare. 
     - Data: We expect around 70-80% to misremember their confidence as higher than it was? (But we don't have data, so we'll have to collect in the room.)

  But we don't have time to recollect and compare individually. Instead, we can ask: "Raise your hand if you think your confidence for the red card prediction was 70% or higher." Then, we reveal the distribution of actual confidences (we can tally from the sheets). We expect that the actual confidences were lower than what they remember.

  Alternatively, we can do a show of hands for what they remember and then show what they actually wrote. But we need to collect the sheets and then redistribute? Too messy.

  Instead, we'll note that we have their initial sheets. Then, in the debrief, ask: "How confident do you now remember being about the red card prediction?" and have them write on a new sheet. Then we can compare. But that takes time.

  We might skip the individual recall and just talk about the feeling. Instead, we can say: "We often remember being more certain than we were. That's hindsight bias: the feeling that we knew it all along."

  2. **Narrative Machinery (cause):**
     - From the explanation activity: "When you were explaining the outcome, even when it was wrong, you found reasons. And when we have to tell a story, we compress. In the penicillin story, how many of you included the fact that funding almost got cut? Why not? Because it didn't happen? But it was a near-miss. Cutting it makes the story cleaner, but it also makes the outcome seem more inevitable."
     - Then, we name the two concepts: hindsight bias and the narrative fallacy.

  **Handling the Skeptic:**
  If at minute 10 someone says, "This is hindsight bias," we can respond: "Great, you're familiar with the term. But let's see if we can experience how it happens and why. And especially, how we might catch it in the wild. Stick with us and see if you can spot the machinery at work."

  **Takeaway for Monday:**
  One thing to do: When writing a story about an outcome, explicitly ask: "What were the near-misses? What almost happened?" and consider including them to avoid the narrative fallacy. Also, when looking back at predictions, record confidence levels at the time to check hindsight bias.

  **Limitations:**
  - The analogy breaks down because in real history, there are causal explanations that are true. The exercise shows how narrative compression can distort, but it doesn't mean that all explanations are false. We must acknowledge that causality exists, but we must be cautious about how we tell the story. We should note that including near-misses and alternative paths can make the story more accurate, not less.

  **Expected Outcomes:**

  - **Prediction Activity:** 
    - For the red card draw: The actual number is random. We expect the average confidence to be around 50% (since it's hard to predict). 
    - Later, we expect about 60-80% of participants to misremember their confidence as higher than it was. (We can measure by having them write their remembered confidence at the end and compare to the initial sheet. But we might not have time. Alternatively, we can ask: "How many think their confidence was at least 60%?" and then show the actual distribution.)

  - **Explanation Activity:** 
    - We expect that the tables given the wrong outcome will write explanations just as confident as the ones with the right outcome. We can measure by asking them to rate their confidence in their explanation (on a scale) and then compare the two groups. We expect no significant difference in confidence.

  - **Compression Activity:** 
    - We include 3 near-misses in the fact deck. We expect that only 1 or 2 of these will be included by any table, and maybe 0-1 tables will include all. In 120 words, they will cut most.

  **Scoring Sheet for Facilitator:**
  We'll create a master sheet to record:
  - Actual outcomes of the predictions (red cards and longest sentence).
  - For each table in explanation activity: 
