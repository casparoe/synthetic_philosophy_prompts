  - If in the compression activity, the near-misses are omitted by the majority of tables.

  **Debrief Separating Hindsight Bias and Narrative Machinery:**

  - **Hindsight Bias (symptom):** 
     - "Remember when we did the card draw? At the time, you weren't sure. But after knowing, it feels like it was predictable. That feeling is hindsight bias: the tendency to see past events as having been more predictable than they were."

  - **Narrative Machinery (cause):** 
