  We are designing a 90-minute workshop for science journalists on hindsight bias and the narrative fallacy. The key constraints and goals:

  - Avoid lecturing; make the points experientially.
  - Participants are skeptical and some already know the terms.
  - No money, no pre-reading, materials must be printable or generated in the room.
  - The workshop should have three parts:
    1. A fast prediction activity with confidence ratings about resolvable events.
    2. An explanation activity where half the tables are given the wrong outcome and then have to explain it.
    3. A compression activity where they write a short story from facts, cutting near-misses, to show how narrative cleans up uncertainty.

  We need:
  - Detailed rules, roles, materials, timeline, and a scoring sheet.
  - Predictions about the outcomes (e.g., misremembering confidence, near-miss survival, confidence in fabricated explanations).
  - A debrief separating hindsight bias (symptom) from narrative machinery (cause).
  - How to handle someone who says "we know this is hindsight bias" early on.
  - One practical takeaway for reporters.
  - The limitations of the exercise and where the analogy breaks down.

  Let's break it down:

  **Part 1: Prediction Activity (20 minutes)**
  Goal: Create a live memory of uncertainty.

  Method:
  - Distribute a prediction sheet with 3-5 questions about events that will be resolved during the workshop (within 90 minutes). Examples:
    1. What will be the closing price of a specific stock (choose a volatile one) at the end of the workshop? (We can simulate this with a random number generator, but since we can't look up, we'll pre-generate or use a dice roll.)
    2. How many participants will correctly recall their initial confidence in one of the predictions? (This is meta and might be confusing.)
    3. Instead, use questions that can be resolved in the room without the internet: 
        - The number of red cards in a shuffled deck (we can count during the workshop).
        - The outcome of a coin flip (but that's binary and not great for confidence ratings).
        - We need something with a range. How about: "How many words will be in the longest sentence in a provided paragraph?" (We can provide a paragraph and count during the workshop.)

  But note: We must resolve within the workshop. Let's design:

  Prediction Sheet (printable):
  - Question 1: We will draw 10 cards from a standard deck (without replacement). How many red cards do you think we will draw? (0 to 10) 
    Confidence: 0-100% (How sure are you that the actual number will be within 1 of your guess? Or just confidence in your guess? Let's keep it simple: "How confident are you that your guess is exactly correct?")

  But drawing 10 cards and counting might take time. Alternatively, we can pre-draw and seal the result? Then reveal later.

  Better: We'll use a pre-shuffled deck and have a volunteer draw 10 cards at the end of the activity. But that takes time. Alternatively, we can do a simulated draw with a random number generator and have the result in an envelope? Since we can't look up, we can use a pre-determined random sequence.

  Alternative: We can use a dice roll. "What will be the sum of two dice rolled at the end of the workshop?" (Range 2-12). We can roll two dice at the end.

  But let's stick with cards because it's more visual. We'll have a deck and a volunteer draws 10 cards, then we count reds.

  Question 2: We will provide a paragraph (say, 100 words). "How many words will be in the longest sentence in this paragraph?" (We'll count during the workshop.)

  Question 3: "How many tables will correctly recall their initial prediction for the number of red cards?" (But that's too meta and requires them to remember their own prediction, which we'll use later.)

  We want at least one prediction that we can later ask them to recall their confidence. So let's have:

  - Prediction 1: Number of red cards in 10 draws (0-10). Confidence in exact number (0-100%).
  - Prediction 2: Longest sentence in a provided paragraph (in words). Confidence in your guess (0-100%).
  - Prediction 3: (Optional) Something else? Maybe skip to keep it short.

  We'll have them write their predictions and confidence on a sheet.

  **Part 2: Explanation Activity (25 minutes)**
  Goal: Show how we explain outcomes and how knowing the outcome (even if wrong) affects the explanation.

  Method:
  - Provide a case (a short story) with an outcome. But half the tables get a version with Outcome A, half with Outcome B (opposite).
  - They must write a brief explanation (say, 3-5 bullet points) for why that outcome happened.
  - Then reveal the true outcome and ask them to reflect.

  Case: We need a case that is ambiguous and could go either way. Example: A new tech product launch (like a smartphone) that could be a hit or a flop. We'll create a fact sheet about the product and the market.

  Fact Sheet: Seeded with both positive and negative factors. Then:
  - Group 1 (3 tables) told: "The product was a hit: it sold 1 million units in the first week."
  - Group 2 (3 tables) told: "The product was a flop: it sold only 50,000 units in the first week."

  They explain why. Then we reveal: "Actually, the product sold 1 million units." So Group 1 was right, Group 2 was wrong.

  Then we collect their explanations and note the confidence in their explanations.

  **Part 3: Compression Activity (30 minutes)**
  Goal: Show how compression (short word count) forces deletion of alternative paths and near-misses.

  Method:
  - Provide a fact deck about an event (e.g., a scientific discovery, a company's success) that includes near-misses (e.g., almost failed, almost took a different path).
  - Each table must write a 120-word story from the facts.
  - Vary the order of facts for different tables? Maybe, but logistically hard. Instead, just give the same fact deck to all.
  - Then, have them highlight which facts they included. We'll see that near-misses are often cut.

  Fact Deck: We'll create a story about, say, the discovery of penicillin. Include:
    - Fleming left a petri dish uncovered by accident.
    - He almost threw it away but noticed the mold killed bacteria.
    - He had a hard time reproducing it initially.
    - It took years before it was mass-produced.
    - There was a moment when funding almost got cut.
    - Etc.

  Then, after they write, we compare and see that the near-misses are often omitted for brevity.

  **Timeline (90 minutes):**

  - 0-5 min: Introduction and setup. Explain that we're going to do some activities about how we tell stories about the world. No definitions given yet.

  - 5-25 min: **Prediction Activity** (20 min)
    - Hand out prediction sheets (with the paragraph included). 
    - They have 5 minutes to write their predictions and confidence for:
