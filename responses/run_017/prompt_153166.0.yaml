  If someone says "this is hindsight bias" early, we can say: "Yes, and we're going to experience how it happens and why it's so hard to avoid, even when we know about it. Let's see if we can spot it in real-time."

  **Materials List:**
  1. Prediction sheets (one per person) with:
     - Paragraph for sentence counting (about 100 words).
     - Questions:
          a. We will draw 10 cards from a shuffled deck. How many red cards do you predict? (0-10)
          b. How confident are you that your prediction is exactly correct? (0-100%)
          c. How many words do you predict for the longest sentence in the paragraph above?
