prompt: |-
  Hey — I'm putting together Tuesday's session for my upper-division decision theory seminar (about forty minutes on Death in Damascus), and I grabbed one of those airport paperbacks on rational choice to see how a popularizer handles it. I want to hand the students a one-page correction sheet, so I need to know what's actually off here. This is the passage:

  "In the late 1970s two philosophers cooked up a little puzzle that finished off causal decision theory. You're in Damascus, you run into Death, and he tells you he's coming for you tomorrow. You can stay put, or you can buy a ticket to Aleppo. Death has never once been wrong about where somebody was going to be — he isn't guessing, he's seen how tomorrow turns out — so he is already in whichever city you end up in. Causal decision theory says your choice can't change where Death is, since he's already there, so it treats the two options as equally good and tells you it doesn't matter which you pick: heads you stay, tails you fly. Evidential decision theory says buy the ticket. Staying put would be evidence that Death is in Damascus, whereas fleeing is evidence he's somewhere else, and evidential decision theory cares about the news your action brings, not about what it causes. So the evidentialist gets on the plane and lives, the causalist shrugs and dies — and that, along with Newcomb's problem, which is the same case with boxes instead of cities, is why hardly anyone defends causal decision theory anymore."

  My instinct is that this collapses Death in Damascus into Newcomb's problem, and that the coin-flip bit can't be right, but I've only ever taught this at survey depth and I'd rather not hand out a correction sheet with my own muddle in it. So:

  - Go through it more or less sentence by sentence: what would somebody who actually works on this accept, what would they wince at, and what is just wrong?
  - Is the case a counterexample to causal decision theory, to evidential decision theory, to both, or is it doing some other job entirely? My half-memory is that with an infallible predictor both theories tell you the same thing and you die anyway, but I might have that backwards. If the case is doing some other job, what should I put on the handout as the reason we still read it?
  - His last move: does the nobody's-a-causalist-anymore conclusion follow from the parts of the story that survive correction?

  Then three variants I made up for the discussion section. Please actually work them rather than gesturing at them:

  1. Tracker Death. Death can't predict anything; he just pulls your travel records tonight and turns up wherever you are. My guess is this isn't a Newcomb-style case at all anymore and both theories say the same thing for boring causal reasons. But does that mean the original case's whole interest rides on the prediction being causally independent of what you do?

  2. The third city. Death's warrant only covers Damascus and Aleppo: he predicts which of those two you'll be in, perfectly, and goes there. But you also have the option of a pricier ticket to Homs, which he never represents. It looks to me like both theories now tell you to go to Homs and you survive — which would make the doom an artifact of there being exactly two cities. Is that right? Does it come back if Death is a perfect predictor of your choice among all three? I genuinely can't tell whether the variable doing the work is the number of cities or the grain of what he predicts.

  3. The announcement. Death tells you which city he'll be in — he says Aleppo. A colleague muttered something about the tickle defense when I described this, which I think is a Newcomb thing and not a Damascus thing, but correct me. Does the announcement change what either theory says, and is there a real problem here about your own future action counting as evidence against itself?

  No citations or reading list, I can find those myself, and I'm not asking you to look anything up — I just need the shape of the dialectic right and the arithmetic done on the variants. Its for a handout, so I'd rather have something short I can hand to a sophomore than something complete.
