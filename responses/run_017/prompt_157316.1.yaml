  Okay, the user has presented a really fascinating philosophical and legal puzzle. They're clearly well-versed in rationalist thought (probably LessWrong/Slate Star Codex adjacent) but have noticed a stark contradiction with contract law doctrines. The core tension is between the rationalist "sunk cost fallacy" principle and how contract law actively uses reliance expenditures as triggers for enforcement.

  Hmm, let me unpack their five structured questions first. They want: (1) whether contract law requires genuinely retrospective reasons or can be explained forward-looking, (2) whether it's cost-honoring vs cost-regarding, (3) whether shifting to policy-level analysis resolves the conflict, (4) what removing reliance doctrines would break, and (5) whether there's a defensible core to honoring sunk costs beyond fallacy.

  The user's phrasing suggests they've already done significant legwork - they recognize nuances like reliance being capped and including opportunity costs. Their mention of promissory estoppel, partial performance, and reliance damages shows legal familiarity. Probably a law-philosophy interdisciplinary type.

  *scratches head* The real meat seems to be whether contract law secretly validates a different rationality model. The rationalist view they describe is hyper-Stalnaker/Lewis possible-worlds consequentialism where only future outcomes matter. But contract law seems Aristotelian - it cares about relational histories. 

  For question 1: Contract law doesn't strictly require retrospective reasons. One could argue reliance expenditures are just proxies for measuring harm to expectation interests. But that feels strained when promissory estoppel enforces non-bargain promises solely because of reliance. The "unjust" element in estoppel doctrine practically demands moral retrospection.

  For question 2: It's uneven. Reliance damages feel cost-regarding (using expenditure as evidence of harm), but partial performance making contracts enforceable is starkly cost-honoring - the act of building on land creates entitlement regardless of outcomes.

  *lightbulb* Ah! Question 3 is key. The dispositional argument (being "reliance-worthy") could theoretically make it forward-looking at the systemic level. But does the law actually presuppose this? Probably not explicitly - courts don't cite "fostering cooperative dispositions" in reliance cases. The doctrine is framed as correcting injustice, not incentivizing future cooperation.

  If we removed reliance doctrines (question 4), informal agreements would become riskier. Forward-looking theorists should care because transaction costs would spike - people would overinvest in formal contracts. The "cheap promise" problem would cripple casual cooperation.

  Finally, the existential bit about projects/promises gaining value through sustained cost... *sighs* This is the hardest. The rationalist view treats commitments as instrumental; the legal view treats them as constitutive. When the law enforces a promise because someone built half a barn on your land, it's recognizing that the half-built barn has created a new moral fact. But is that rational? Only if we accept that reasons emerge relationally over time - which pure consequentialism denies. The fallacy charge sticks if we insist all value is outcome-state dependent.

  *pauses* The user would probably appreciate Thomas Scanlon's promissory theory here. And maybe Margaret Gilbert on joint commitments. The unspoken need might be reconciling their rationalist training with the messiness of human institutions that depend on honoring sunk costs. They're intellectually uncomfortable with the disconnect.

  ...Better structure this as: show contract law as a pragmatic patch for human limitations, not a philosophical statement. The "defensible core" is that we're temporal creatures who build selves through persistent projects. Law protects that ontological need, even if it's irrational at the atomic choice level.
answer: |-
  Your inquiry cuts to the heart of a profound tension between economic rationality and legal/moral philosophy. Contract law's reliance doctrines do presuppose a distinct theory of reasons—one that incorporates retrospective, relational, and constitutive elements absent from strict sunk-cost rationalism. Below, I reconstruct the implicit theory, addressing each of your queries systematically.

  ---

  ### **1. Presupposed Theory of Reasons: Retrospective or Forward-Looking?**
  - **Strict Presupposition**: Contract law **requires genuine retrospective reasons**.  
    - The doctrines of reliance damages, promissory estoppel, and part performance treat the *fact of incurred cost* as inherently reason-giving. The promisor’s obligation arises not from future consequences but from the **moral weight of past actions**: the promisee’s detrimental reliance creates a debt of justice.  
    - *Example*: In promissory estoppel, the "detriment" itself triggers enforceability. Courts explicitly frame this as preventing "injustice" (e.g., *Restatement (Second) of Contracts* §90), implying a duty rooted in history.  

  - **Compatibility with Forward-Looking Views?**  
    - While past costs *can* function as evidence of future harm (e.g., reliance expenditure quantifying expectation damages), the law goes further. Reliance recovery is available even when expectation damages are zero (e.g., a losing contract), confirming that the *bare fact of sunk cost* generates the claim.  
    - **Underdetermined Aspects**:  
      - A rule-consequentialist could argue reliance doctrines incentivize efficient trust in promises.  
      - A corrective justice theorist sees them as repairing wrongful harm.  
      Both license similar rules, but the law’s language ("unjust," "detriment") leans toward the latter.  

  ---

  ### **2. Cost-Honoring vs. Cost-Regarding**  
  Contract law is **inconsistently cost-honoring** across doctrines:  
  - **Reliance Damages**: *Cost-regarding*.  
    Reliance costs are a **proxy for harm**—capped to avoid overcompensation (§90 limits recovery to "justice requires"). The focus is on the *worsened position*, not the expenditure itself.  
  - **Promissory Estoppel**: *Cost-honoring*.  
    Detriment (including non-monetary reliance) creates enforceability *ex nihilo*. The cost incurred is the **genesis of the obligation**.  
  - **Part Performance (Land Contracts)**: *Starkly cost-honoring*.  
    Physical acts (e.g., building on land) make an oral agreement enforceable. The cost *constitutes* the claim, independent of outcomes (*Statute of Frauds* exceptions).  

  ---

  ### **3. The Dispositional Move: Does It Resolve the Tension?**  
  Shifting to a policy-level analysis **partially reconciles** the conflict but doesn't negate the law’s retrospective core:  
  - **How the Move Works**:  
    A legal system that enforces reliance signals that promises *can* be trusted, encouraging cooperation. This is forward-looking: honoring sunk costs incentivizes beneficial reliance, reducing transaction costs.  
  - **Limitations**:  
    - Contract law rarely justifies reliance doctrines this way. Judges focus on *rectifying past harm*, not systemic incentives.  
    - The rationalist sunk-cost rule (rejecting past costs as reasons) applies to *atomic decisions*, while the law operates at a **systemic level**. The law presupposes that *individual* rationality differs from *institutional* rationality.  
    - **Conclusion**: The law **presupposes a multi-level theory of reasons**. It denies that bracketing sunk costs is rational for institutions, even if it is for isolated choices.  

  ---

  ### **4. Removing Reliance Doctrines: Consequences**  
  A strict forward-looking regime (expectation damages only) would:  
  - **Collapse Promissory Estoppel**: Non-bargain promises (e.g., gratuitous pledges) would become unenforceable, chilling charitable or informal commitments.  
  - **Paralyze Informal Agreements**: Parties would demand formalities for all promises, raising transaction costs.  
  - **Efficiency Loss**: Reliance investments would plummet, as rational actors would fear unrecoverable costs. Even a forward-looking theorist should care—this undermines **trust**, a public good essential for markets.  

  ---

  ### **5. Defensible Core of Honoring Sunk Costs: Fallacy or Wisdom?**  
  **Argued Both Ways**:  
  - **The Fallacy Charge (Rationalist View)**:  
    Sunk costs are irrelevant to future utility. "Projects" or "relationships" gain value only from future benefits, not past sacrifices. Honoring sunk costs distorts resource allocation (e.g., continuing a doomed project).  

  - **The Constitutive Defense (Revealed by Law)**:  
    - **Projects/Relationships**: Value emerges from **narrative coherence**. Abandoning a project after heavy investment negates its meaning (e.g., a half-built monument is wasted; a promise abandoned after reliance betrays trust).  
    - **Promises**: A promise kept *despite costs* signals integrity, building social capital. The law’s reliance doctrines recognize that promises are **relational acts**, not mere forecasts.  
    - **Moral Ontology**: Some goods (e.g., marriage, citizenship) derive value from persistent investment. To ignore sunk costs is to deny the temporality of human commitments.  

  **Adjudication**:  
  The rationalist view is **incomplete**, not wrong. It correctly rejects *pathological* escalation (e.g., persisting in a failing venture due to pride). But contract law reveals a deeper truth: **agency is extended in time**.  
  - **Sunk costs matter when they constitute**:  
    - *Identity* (e.g., careers, artistic works),  
    - *Relationships* (e.g., trust built through reliance),  
    - *Social goods* (e.g., the stability of promises).  
  Bracketing sunk costs here isn’t neutrality—it’s **ontological vandalism**. The law protects these goods by honoring reliance, avoiding the fallacy only when costs lack constitutive value (e.g., capped reliance damages).  

  ---

  ### **Synthesis: What Contract Law Presupposes**  
  - **Theory of Reasons**: Hybrid.  
    - *Retrospective*: Past costs generate duties of justice.  
    - *Constitutive*: Acts of reliance transform the moral/legal landscape.  
    - *Relational*: Promises exist in a web of mutual vulnerability.  
  - **Rationality**: Multi-scalar.  
    Individual choices should avoid sunk-cost bias, but institutions must honor costs that sustain cooperative ecosystems.  
  - **Core Insight**:  
    The rationalist rule treats agency as **atemporal**; contract law treats it as **narrative**. The latter is defensible because human flourishing depends on commitments that accrue value through perseverance. The "fallacy" is a local truth mistaken for a universal one.
