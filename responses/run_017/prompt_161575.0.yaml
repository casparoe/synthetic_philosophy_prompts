  ### **Decision Tree Instrument**

  **Question 1 (Suffering-Happiness Tradeoff)**  
  *Case:* You can prevent either:  
  - **Option A:** 1 person suffering 100 years of torture (-1000 utils/year).  
  - **Option B:** 10,000 people suffering 1 year of moderate depression (-10 utils/year).  
  *Which do you prioritize?*  
  - **Branch A:** Prevent torture (lexical priority/threshold below -100 utils).  
  - **Branch B:** Prevent depression (fixed/variable rate; happiness compensable).  

  **Question 2 (Value of Creating Net-Positive Life)**  
  *Case:* You can create a new being who will live 50 years at +50 utils/year (net +2500). No one else is affected.  
  *What is the value of creation?*  
  - **Branch A:** Negative (anti-frustrationism/tranquilism).  
  - **Branch B:** Neutral (asymmetry/person-affecting).  
  - **Branch C:** Positive (totalism/prioritism).  

  **Question 3 (Painless Ending of Net-Positive Life)**  
  *Case:* A healthy 30-year-old (will live to 80 at +50 utils/year) can be painlessly killed now. They’ll otherwise live happily.  
  *Is killing them:?*  
  - **Branch A:** A harm (baseline = continued existence).  
  - **Branch B:** A benefit (baseline = nonexistence).  

  **Question 4 (Deontic Constraints)**  
  *Case:* Torture 1 innocent for 10 years (-1000 utils) to prevent 1,000 people from enduring 10 years of torture each.  
  *Is this permissible?*  
  - **Branch A:** Yes (no side constraints; aggregation).  
  - **Branch B:** No (deontic constraints; inviolability).  

  **Question 5 (Scope and Uncertainty)**  
  *Case:* You can reduce:  
  - **Option A:** 100 units of human suffering (certain sentience).  
  - **Option B:** 10,000,000 units of shrimp suffering (10% sentience probability).  
