  ---

  ### **Dependencies and Indistinguishable Pairs**  
  - **Q3 determines Q2’s coherence:** If ending life is a *benefit* (Q3B), creating life (Q2) must be negative or neutral (not positive).  
  - **Q1 and Q2 collapse:** Lexical views (Q1A) require creating life to be non-positive (Q2A/B), making Q2C incoherent.  
  - **Indistinguishable positions:**  
    - *Pure NU (5) vs. Lexical Threshold NU (7) below the threshold:* Both prioritize extreme suffering (Q1A) and accept aggregation (Q4A). Cases involving suffering below the threshold won’t separate them.  
    - *Satisficing vs. Two-Level views:* Both collapse on Q6A (satisficing/present-focused). The tree can’t distinguish "enough" suffering reduction from epistemic constraints.  
  - **Key sorting power:**  
    - **Q3 (ending life)** is the strongest sorter, splitting tranquilists, NU, and antinatalists from others.  
    - **Q5 (scope)** is secondary; it only sorts if Q3/Q4 are permissive (e.g., NU vs. Totalism). Your friend’s claim (Q5 as "whole ballgame") only holds for positions already sorted by Q3/Q4.  

  ---

  ### **Notes for Implementation**  
  - **Why cases over abstractions:** Forces engagement with intuitions, bypassing label disputes.  
  - **Most divisive leaves:** Pure NU (leaf 5) and Total Utilitarianism (leaf 11) generate the fiercest clashes (e.g., "killing happy people" vs. "obligatory torture").  
  - **Unoccupied leaves:** Only 2 of 12 are unoccupied (due to logical incoherence).  
  - **Adjust quantities** if your group disputes the numbers (e.g., scale shrimp units).  

  This tree covers all 7 distinctions without redundant branches, exposes awkward commitments upfront, and resolves the Q3 vs. Q5 debate by showing Q3’s primacy. Use it to map participants to leaves, then discuss the commitments—no labels needed.
