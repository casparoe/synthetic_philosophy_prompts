     - **Awkward Commitment:** "Ending a happy person’s life is a harm, but creating one is a moral crime."  

  3. **A-A-A-B-A-B**  
     - **Name:** "Constrained Threshold View"  
     - **Awkward Commitment:** "Shrimp probably don’t matter, but human extinction would be a relief."  

  4. **A-A-B-A-A-A**  
     - **Name:** "Tranquilist Negative Utilitarianism"  
     - **Awkward Commitment:** "Creating a happy person is as bad as creating a tortured one."  

  5. **A-A-B-A-B-B**  
     - **Name:** "Pure Negative Utilitarianism"  
     - **Awkward Commitment:** "Killing happy people to prevent future suffering is a benefit."  

  6. **A-B-A-B-A-A**  
     - **Name:** "Asymmetric Deontology"  
     - **Awkward Commitment:** "Having a kid is neutral, but torturing one to save millions is forbidden."  

  7. **A-B-B-A-B-B**  
     - **Name:** "Lexical Threshold NU"  
     - **Awkward Commitment:** "Shrimp matter more than humans if they suffer intensely enough."  

  8. **A-C-*-*-*-***  
     - **Name:** Unoccupied (incoherent).  
     - **Why:** Incoherence. Lexical priority (Q1A) conflicts with creating life being positive (Q2C).  

