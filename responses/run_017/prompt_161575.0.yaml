  - **Branch A:** Reduce human suffering (scope: humans only / precautionary weighting).  
  - **Branch B:** Reduce shrimp suffering (scope: invertebrates / expected value).  

  **Question 6 (Temporal Risk & Demandingness)**  
  *Case:* You can:  
  - **Option A:** Prevent 1000 units of suffering today with 100% certainty.  
  - **Option B:** Prevent 1,000,000 units in 200 years with 1% certainty (expected 10,000 utils).  
  *Which do you prioritize?*  
  - **Branch A:** Prevent today (risk-averse / satisficing / present-focused).  
  - **Branch B:** Prevent future (expected minimization / maximizing / longtermist).  

