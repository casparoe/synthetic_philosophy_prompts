prompt: |-
  Hey — I'm in a small reading group on moral psychology (six of us, mostly grad students, plus one retired guy who I'm pretty sure shows up mostly for the wine), and this week we did Williams on internal and external reasons. One member is writing on Williams and gets visibly annoyed whenever anyone calls him a Humean, which is part of why I'm suspicious of the summary I found in a free online encyclopedia of philosophy I won't name. I've copied the relevant paragraph out below:

  "According to Bernard Williams, all reasons for action are internal: an agent has a reason to do something only if she already has some desire that doing it would serve, or could acquire such a desire by correct reasoning from the desires she already has. This is the internal reasons theory. It follows that there are no external reasons — no facts that give an agent a reason to act independently of what she happens to care about — and hence that moral requirements give no reason to anyone who lacks an independent desire to be moral. Williams's argument is essentially Humean: since motivation always requires a pre-existing desire, a consideration that left the agent entirely cold could never explain why anyone acted, and so could not be a reason at all. Critics object that this makes reasons embarrassingly subjective: on this view a callous person has no reason not to be cruel. Defenders reply that the reasoning clause can do a lot of work, since the agent might be brought to see the connection by rational reflection. But this only relocates the difficulty, because whether reflection helps depends on psychological facts about the particular agent. So there is no fact of the matter about what anyone has reason to do, and moral disagreement turns out to be merely a clash of attitudes."

  What I'd like is an accuracy audit rather than an essay: go through it more or less sentence by sentence and tell me what someone who actually works on this literature would accept, what's a simplification they'd wince at but would let pass in a popular entry, and what's straightforwardly wrong. I especially want to know about two things. First, whether the slide from "there are no external reasons" to "there is no fact of the matter about what you have reason to do, so moral disagreement is just a clash of attitudes" is something the internalist is really committed to, or whether it's importing a seperate thesis. Second, whether the "pre-existing desire" framing is fair to Williams or whether my friend is right to bristle.

  The thing I actually care about, though, is a case the entry waves away in half a clause. Suppose someone's motivational set contains, along with a genuine commitment to some project, a standing higher-order policy: she will not treat any consideration as a reason if she only came to accept it because somebody argued her into it (she thinks being talked into things is a kind of weakness). The entry's line, as I read it, is that this is a non-problem — the policy is just one more element of the motivational set, so there is either a sound deliberative route from the set taken as a whole or there isn't, and the theory is untouched. That feels too quick to me: it means whether she has a reason depends not just on what's in her motivational set and on the non-motivational facts, but on the path by which the deliberation reached her — same agent, same set, same conclusions of sound deliberation, but the reason exists if she somehow arrived at it on her own and doesn't if it was argued. Is that a genuine problem for the view, or something the internalist can absorb, and if it is a problem does it hand anything to the externalist or is it a complication both sides share? Don't bother with citations or a reading list, I can chase those up myself — I just want the shape of the arguments.
reasoning: |-
  Okay, the user is part of a reading group on moral psychology discussing Bernard Williams' internal and external reasons. They've shared a paragraph from an online encyclopedia and want an accuracy audit. The user has two main concerns: whether the encyclopedia's summary misrepresents Williams by claiming that internalism leads to no fact of the matter about reasons and moral disagreements being mere clashes of attitudes, and whether the "pre-existing desire" framing is problematic. They're also interested in a specific case where an agent has a policy against being persuaded by others, and whether this creates a path-dependency issue for internalism.

  First, I need to assess the encyclopedia paragraph's accuracy. The user mentions that one group member gets annoyed when Williams is called a Humean. So, I should clarify Williams' relationship to Hume. While Williams is often associated with Hume due to the emphasis on desires and motivation, he actually moves beyond Hume by introducing the "motivational set" which includes commitments, projects, and dispositions—not just desires. The encyclopedia's use of "pre-existing desire" is too narrow and would make Williams scholars wince. The user's friend is right to bristle here.

  Next, the slide from "no external reasons" to "no fact of the matter" and moral disagreements as clashes of attitudes. The encyclopedia oversimplifies here. Williams does argue that reasons are relative to the agent's motivational set, but he doesn't deny that there are facts about what reasons an agent has. Instead, he thinks these facts are conditional on the agent's psychology. The encyclopedia's conclusion that moral disagreement is merely a clash of attitudes imports a non-cognitivist view that Williams doesn't necessarily endorse. Internalists can still maintain that there are correct answers relative to the agent's set, so moral disagreements might involve errors in reasoning, not just attitude clashes. This is a significant misstep in the summary.

  Now, the user's specific case: an agent with a policy against being persuaded by others. The encyclopedia waves this off, saying the policy is just part of the motivational set. But the user is worried about path dependency—whether the reason exists depends on how the deliberation was reached. This is a real problem for internalism. If the agent would have arrived at the reason through sound deliberation on their own but rejects it because someone else persuaded them, then according to internalism, they don't have that reason. This seems counterintuitive because the content of the reason and the deliberative route are the same; only the path differs. The internalist might respond that the policy itself blocks the deliberative route, making it unsound for that agent. But this leads to an odd consequence where the agent's quirks affect normative reasons. Externalists would argue that reasons shouldn't depend on such contingent psychological facts. However, this issue also challenges externalists to explain how reasons can motivate without the right psychology. So it's a shared problem but more pressing for internalists.

  The user is likely trying to defend or challenge their friend's position in the reading group. They might be preparing for a discussion or helping the friend with their paper. Their deeper need is to understand the nuances of Williams' theory to engage effectively in the debate, especially around the two key points they raised. They want a clear, concise breakdown without jargon, focusing on argument structures rather than citations. They might also be interested in how Williams' internalism holds up under edge cases like the persuasion policy, which tests the theory's coherence.

  I should make sure to address both the accuracy of the encyclopedia summary and the specific case, highlighting where the summary oversimplifies or misrepresents Williams. Emphasizing the distinction between motivation and reasons, the structure of the motivational set, and the conditional nature of reasons in internalism will clarify the misconceptions. For the path-dependency issue, acknowledging it as a genuine problem but noting internalist responses and externalist challenges will give the user a balanced view. Keeping the response structured around their queries ensures they get the clarity needed for their group discussion.
answer: |-
  Here's a line-by-line accuracy audit of the quoted paragraph, focusing on Williams scholarship and your specific concerns:

  1.  **"According to Bernard Williams, all reasons for action are internal: an agent has a reason to do something only if she already has some desire that doing it would serve, or could acquire such a desire by correct reasoning from the desires she already has."**
      *   **Accuracy:** Mostly accurate, *but* a significant simplification. Williams uses the broader term "motivational set" (S), which *includes* desires but also encompasses **commitments, projects, attitudes, dispositions, and patterns of emotional reaction**. Calling it all "desires" is a Humean phrasing Williams himself avoids. "Correct reasoning" is also Williams' "sound deliberative route," which involves more than just instrumental reasoning (it can include considering constitutive means, overcoming ignorance of fact, avoiding false beliefs, weighing conflicts within S, etc.). Scholars would accept the core claim but wince at the reduction to "desires."

  2.  **"This is the internal reasons theory."**
      *   **Accuracy:** Straightforwardly correct.

  3.  **"It follows that there are no external reasons — no facts that give an agent a reason to act independently of what she happens to care about — and hence that moral requirements give no reason to anyone who lacks an independent desire to be moral."**
      *   **Accuracy:** Correct on the definition of external reasons and the core implication. Williams explicitly denies external reasons exist. The conclusion about moral requirements is a direct consequence Williams accepts (though he'd argue it reflects the reality of amoralism). Scholars accept this.

  4.  **"Williams's argument is essentially Humean: since motivation always requires a pre-existing desire..."**
      *   **Accuracy:** **Problematic - Your friend is right to bristle.** While Williams shares Hume's focus on motivation as necessary for reasons and rejects pure rationalism, he **explicitly distances himself** from a crude Humean model. Key differences:
          *   **Motivational Set (S) vs. Desires:** S is broader than fleeting desires or appetites (see point 1).
          *   **Sound Deliberation vs. Instrumental Reasoning:** Deliberation can transform and reveal commitments within S, not just find means to satisfy pre-existing, fixed desires.
          *   **"Pre-existing" is tricky:** Elements of S are pre-existing, but deliberation can reveal *new* reasons grounded in *existing* S elements that the agent didn't previously recognize. It's not just serving desires the agent was consciously aware of. Calling it "essentially Humean" is a common scholarly shorthand, but it's a simplification that obscures Williams' nuances. Someone working deeply on Williams would flag this.

  5.  **"...a consideration that left the agent entirely cold could never explain why anyone acted, and so could not be a reason at all."**
      *   **Accuracy:** Accurate representation of Williams' core argument: Reasons must be capable of explaining action, which requires a link to motivation grounded in S via a sound deliberative route. If something *cannot* motivate an agent (given their S and sound deliberation), it *is not* a reason *for them*. This is central to his internalism.

  6.  **"Critics object that this makes reasons embarrassingly subjective..."**
      *   **Accuracy:** Correct. This is a standard externalist/objectivist criticism.

  7.  **"Defenders reply that the reasoning clause can do a lot of work, since the agent might be brought to see the connection by rational reflection."**
      *   **Accuracy:** Correct. Internalists emphasize that sound deliberation isn't just finding means; it can involve recognizing deeper commitments, overcoming irrationality, understanding consequences, etc., potentially leading an agent to see reasons they didn't initially grasp, *all grounded in their existing S*.

  8.  **"But this only relocates the difficulty, because whether reflection helps depends on psychological facts about the particular agent."**
      *   **Accuracy:** Correct representation of the critic's counter. The scope and effectiveness of deliberation *are* constrained by the specific content of the agent's S.

  9.  **"So there is no fact of the matter about what anyone has reason to do..."**
      *   **Accuracy:** **Misleading/Overstatement.** Williams *does* think there is a fact of the matter *relative to the agent's S and the non-motivational facts*. For a *given* agent with a *specific* S, there *are* facts about what they have internal reason to do. What he denies is that there are *agent-neutral* or *S-independent* reasons (external reasons). Saying "no fact of the matter" *simpliciter* suggests a radical subjectivism Williams rejects. He thinks the facts are conditional on S. Scholars would say this oversimplifies and misrepresents his view.

  10. **"...and moral disagreement turns out to be merely a clash of attitudes."**
      *   **Accuracy:** **Straightforwardly wrong / Importing a Separate Thesis.** This conclusion does *not* follow directly from Williams' internal reasons thesis alone. Internalism about reasons is compatible with various meta-ethical views about moral *truth*. Williams himself was not a simple non-cognitivist. Moral disagreement *could* involve:
          *   Clashes of attitudes (S differences).
          *   Disagreements about non-moral facts.
          *   Errors in sound deliberation *relative to one party's own S*.
          *   Disagreements about the *content* of morality itself (which Williams saw as potentially involving external reasons claims that he rejects).
      *   **The Slide You Asked About:** This is where the encyclopedia imports a separate thesis (non-cognitivism or strong subjectivism about morality) and wrongly attributes its consequences to Williams' internalism. Internalism makes reasons *relative to S*, but it doesn't *entail* that moral judgments *themselves* are *only* expressions of attitude or that there's no truth in moral disagreement *relative to S*. This is a significant error.

  **Your Specific Case (The Persuasion Policy):**

  This is a **genuine problem for the internalist view**, not easily waved away, and it highlights a tension concerning **path-dependency** and the **normative force of "sound deliberation."**

  1.  **The Internalist's Initial Move:** The encyclopedia is *technically* correct that the policy ("Don't treat as a reason anything you were argued into") is just part of S. If sound deliberation *from the whole S* (including this policy) leads the agent to reject the conclusion *because* it was reached via persuasion, then, according to strict internalism, she *does not* have that reason. The path *is* made relevant *by her own S*.

  2.  **The Problem:** This seems deeply counterintuitive and normatively unsatisfying. Imagine:
      *   **Path A:** Agent deliberates soundly *on her own* from S (including the policy) and concludes she has reason R.
      *   **Path B:** Someone else presents *the same sound deliberative route* to R from S. The agent recognizes it as sound, but her policy (part of S) forbids her from accepting R *because* it came via argument.
      *   **Internalist Verdict:** In Path A, she has reason R. In Path B, she does *not* have reason R.
      *   **The Issue:** The *content* of the deliberative route and the *content* of her S are identical in both scenarios. Only the *path to accessing the conclusion* differs. Yet, the existence of the reason depends entirely on that path. This makes the normative status of R (whether it *is* a reason *for her*) path-dependent in a way that feels arbitrary and undermines the idea that sound deliberation reveals *real* normative relations *within* S.

  3.  **Can Internalism Absorb It?** Defenders might try:
      *   **S Includes the Policy:** It's just part of her psychology; if it blocks acceptance, the deliberative route isn't "sound" *for her* in that context. (But this concedes the path-dependency).
      *   **The Policy Might Be Irrational:** Perhaps sound deliberation could *itself* undermine the policy (e.g., showing it's inconsistent with other elements of S, or self-defeating). If so, overcoming the policy *via* sound deliberation could be part of the route to R. (But this relies on contingent features of her S; what if the policy is deeply entrenched and consistent?).
      *   **"Could" vs. "Would":** Williams uses "could come to motivate via sound deliberation" (a modal claim), not "would" or "does." Maybe R *is* still a reason (she *could* have been motivated via Path A), even if Path B prevents actual motivation now. (This is a possible defense, but it strains the connection between reasons and *actual* explanatory potential, which is central to Williams' motivation-based argument).

  4.  **Does it Hand Anything to the Externalist?** Yes, indirectly.
      *   The externalist argues that reasons exist independently of an agent's contingent motivations and deliberative quirks. This case seems like a prime example: R seems like it *should* be a reason for the agent *regardless* of how she came to consider it or her peculiar policy against persuasion. The path-dependency appears to be a flaw stemming from the internalist's grounding of reasons in the agent's actual, possibly flawed or quirky, motivational psychology.
      *   The internalist's struggle to give a satisfying account of why R *isn't* a reason in Path B highlights the externalist intuition that reasons should be more robust and less hostage to psychological fortune.

  5.  **Is it a Complication Both Sides Share?** Both sides need to explain the link between reasons and motivation. The externalist must explain *how* an external reason could *ever* motivate someone lacking the relevant desire (the "schmagency" problem). This case doesn't directly address that core externalist challenge. However, it *does* expose a specific, potentially unattractive, consequence of internalism's *solution* to the motivation problem – namely, that normative reasons become vulnerable to path-dependencies and peculiar psychological policies in a way that can seem to undermine their normative authority. The externalist avoids *this specific* problem but faces the larger hurdle of grounding reasons independently and explaining their motivational grip.

  **In Summary:**

  *   The encyclopedia summary oversimplifies Williams' "motivational set" as "desires" and wrongly labels his view "essentially Humean" without qualification.
  *   The slide from "no external reasons" to "no fact of the matter" and "moral disagreement is just clash of attitudes" misrepresents Williams; internal reasons are facts *relative to S*, and internalism doesn't entail non-cognitivism about morality.
  *   Your friend is right to object to the "pre-existing desire" framing; "motivational set" and "sound deliberative route" are broader and more nuanced.
  *   Your persuasion policy case exposes a serious tension within internalism regarding path-dependency and the normative robustness of reasons derived via sound deliberation. It cannot be easily dismissed by simply adding the policy to S. This problem provides ammunition for externalists by highlighting a potentially unattractive consequence of internalism's psychology-dependence, though it doesn't solve the externalist's core motivational challenge.
