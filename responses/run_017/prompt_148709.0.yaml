prompt: |-
  I maintain the backend for an open history reference project — volunteer work, on the side of a normal engineering job — and I've inherited the job of rewriting the rule our editors use to decide whether a claim gets tagged as fringe. The tag matters more than it sounds: it changes where the article ranks in search, and our corpus gets pulled into retrieval and fine-tuning pipelines, so a bad rule doesn't just mislabel a page, it launders nonsense into other people's systems. I have no philosophy training, and the arguments on our mailing list have convinced me that the disagreements are almost never about the evidence for Atlantis or ancient-astronaut explanations of monumental architecture or Fomenko's rebuild of the whole chronology; they are about what sort of thing a demarcation rule is even supposed to be. So before I let the list argue further I want a specification, and I want it written for a fixed purpose: the rule has to be applicable by a generalist editor, working from an article and whatever is linked from it, without resolving the underlying historical question and without specialist consultation. Both errors cost something real — tagging a responsible-but-heterodox hypothesis suppresses work that might be right, and failing to tag a confident fabrication gives it our house style — so please keep that purpose in view when you decide what counts as a requirement.

  What I want is the requirements list: the cases any adequate rule has to get right, the distinctions it must not collapse, the results from how historical inquiry actually works that it can't contradict, and the reason behind each. The distinctions I keep tripping over, to get you started but please don't limit yourself to them: false-but-ordinary-error versus pseudohistory; a heterodox hypothesis argued inside the discipline versus one argued from outside it; a bad method that landed on a true date versus a good method that landed on a false one; a claim that is protected by cheap auxiliary hypotheses every time it is pressed versus one that is genuinely untestable in principle; and tagging a whole research program versus saying whether anything inside it is still worth crediting — the salvage case, where someone chasing a lost continent nonetheless produces the only careful survey of a site anyone has. Flag for each requirement whether it is non-negotiable or a prejudice of one camp; I strongly suspect some of the things people demand are just preferences wearing argumentative clothing, and in particular I want your view on three candidates: that the rule must be decidable by a non-specialist in an afternoon, that it must track evidence rather than who believes what, and that political or nation-building utility counts as a marker at all. If some subset of the requirements can't be jointly satisfied — say, decidability by a generalist, sensitivity to real evidence, and symmetry between insiders and outsiders — say so explicitly and show me the conflict; that is the part I most want to see. And tell me which single requirement knocks out the most candidate rules.

  Three rules have been proposed on the list and I'd rather you judged them as candidate requirements than as theories, since I can't tell which is which. Priya's Double-Standard Test: build the mirror case, with the same evidence structure but believed by the right people, and if your rule stops firing it was only ever sociology. Marcus's Vindication Condition: there must be a specifiable set of observations that would get a tagged claim untagged, and it must not be empty. Sam's Replacement Rule: a claim counts as fringe only when it discards an established finding while offering no account of why the accepted evidence looks the way it does. Test them, and the requirements generally, against a case I made up for the purpose: a set of dressed stone terraces on an inland hillside, dated by mainstream archaeology to the first millennium BCE from pottery in the upper layers, which a group instead attributes to a seafaring culture two thousand years earlier, on the grounds that the tool marks on the lower courses look like metal tools; that the deep radiocarbon samples came back too old and were discarded as groundwater contamination; that a local flood epic mentions stone steps to the water at that spot; that no settlement of the right date exists nearby, which they read as evidence the builders came from elsewhere; and that the heritage ministry has refused permission to re-date, which they present as suppression. Every rule I try either flags it for reasons that would also flag a contested ordinary dig, or bogs down on the contamination question, which neither I nor the rule is competent to settle. Please don't give me citations, a reading list, or a survey of the literature — I can't chase references and neither can the system I'll run this on, so argue from the cases themselves. If one of these three is just a restatement of something with a name in the philosophy of science, tell me in one line and move on; keep any scoring of existing proposals to a few lines, because the criteria are the deliverable.
reasoning: |-
  Hmm, the user is working on a backend system for an open history reference project and needs help rewriting the "fringe" tagging rule that editors use. This is a complex problem with real-world implications for search rankings and data pipelines. The user has no philosophy background and wants clear requirements for a demarcation rule that can be applied by generalist editors without resolving underlying historical questions.

  The user has identified several key distinctions they're struggling with: false-but-ordinary-error vs pseudohistory, insider vs outsider arguments, bad methods with true results vs good methods with false results, untestable claims, and how to handle research programs with salvageable contributions. They've also proposed three candidate rules from their team: Priya's Double-Standard Test, Marcus's Vindication Condition, and Sam's Replacement Rule.

  I need to develop a comprehensive set of requirements for this tagging rule. The rule must be applicable by non-specialists using only article content and linked materials. Both false positives and false negatives have significant costs - suppressing legitimate heterodox work or legitimizing fabrications.

  The core tension seems to be between three potentially conflicting goals: editor-friendliness (decidable in an afternoon), evidence-sensitivity (tracking actual evidence rather than consensus), and symmetry (treating insiders and outsiders equally). I suspect these can't all be fully satisfied simultaneously.

  For requirements, I'll focus on what's essential for the tagging system to function properly:
  - Non-negotiable: The rule must be operable without specialist consultation or resolving the historical question
  - Non-negotiable: It must avoid collapsing the distinction between ordinary scholarly disputes and true pseudohistory
  - Non-negotiable: It must not require editors to make judgments about evidence quality they're unqualified to make
  - Preference: Evidence-sensitivity is important but may need compromise for practicality
  - Preference: Symmetry between insiders/outsiders is ideal but may be secondary to accuracy
  - Non-starter: Political/nation-building utility shouldn't be a marker - this invites bias

  The user's test case (the stone terraces) perfectly illustrates why evidence-quality judgments are problematic. A better approach is procedural: examining how the claim relates to established methods and whether it offers alternative explanations.

  For the proposed rules:
  - Priya's Double-Standard Test is insightful about sociological bias but impractical for editors to apply
  - Marcus's Vindication Condition is necessary but insufficient - testability alone doesn't capture what makes something fringe
  - Sam's Replacement Rule is the most promising but needs refinement around "established findings" and "account of evidence"

  The key requirement that eliminates many candidate rules is the prohibition on evidence-quality judgments by non-specialists. This knocks out approaches that require evaluating radiocarbon contamination claims or tool mark analysis.

  I'll structure the response around core requirements, handling the key distinctions, evaluating the three proposed rules against the test case, and explaining why Sam's approach is most viable with modifications. The solution should focus on procedural markers like pattern of auxiliary hypotheses, replacement without explanation, and disciplinary engagement rather than trying to evaluate evidence directly.
answer: |-
  Here's a rigorous requirements list for your "fringe" demarcation rule, designed for generalist editors based solely on article/linked content, without resolving underlying claims or consulting specialists. Requirements are categorized as **Non-Negotiable** (essential for function), **Preference** (valuable but potentially compromisable), or **Non-Starter** (harmful to the goal). Conflicts are explicitly flagged.

  ---

  ### **Core Requirements (Non-Negotiable)**
  1. **Operability by Generalists**  
     *Requirement:* The rule must be applicable using only the article and linked sources, without resolving the historical claim or evaluating raw evidence quality.  
     *Reason:* Editors lack time/expertise to adjudicate disputes (e.g., groundwater contamination in radiocarbon dating).  
     *Knocks Out:* Rules requiring editors to judge evidence reliability or methodological soundness.

  2. **Distinction: Ordinary Error vs. Pseudohistory**  
     *Requirement:* Must not flag claims *solely* for contradicting consensus or using imperfect methods.  
     *Reason:* Legitimate scholarship involves errors and revisions; false positives suppress heterodox-but-valid work.  
     *Test Case:* A mainstream claim with flawed pottery dating must **not** be tagged—fringe must require more than "wrong."

  3. **Avoidance of Evidence-Quality Judgments**  
     *Requirement:* Must not force editors to evaluate *whether* evidence is valid (e.g., "Is radiocarbon contamination plausible?").  
     *Reason:* Editors can’t arbitrate technical disputes; rule must rely on observable *patterns* in argumentation.

  4. **Salvageability Handling**  
     *Requirement:* Must allow tagging a claim/program while acknowledging valid sub-elements (e.g., useful surveys).  
     *Reason:* Prevents "contagion" where one fringe element discredits adjacent facts. Tagging applies to *claims*, not whole articles.

  ---

  ### **Functional Requirements (Preferences)**
  5. **Evidence-Sensitivity** (*Preference*)  
     *Requirement:* Should prioritize structural features of argumentation over belief demographics.  
     *Reason:* Tracking evidence patterns (e.g., auxiliary hypotheses) is more objective than tracking "who believes it."  
     *Conflict:* Strict evidence-sensitivity may conflict with **Decidability** if evidence is complex.

  6. **Symmetry Between Insiders/Outsiders** (*Preference*)  
     *Requirement:* Similar evidence structures should be treated alike, regardless of proponent affiliation.  
     *Reason:* Avoids bias against outsiders with valid methods.  
     *Conflict:* Insiders may have contextual legitimacy; strict symmetry risks false negatives for outsider pseudohistory.

  7. **Testability** (*Preference*)  
     *Requirement:* Untestable claims (via auxiliary hypotheses) should be taggable.  
     *Reason:* Pseudohistory often insulates itself from falsification.  

  ---

  ### **Rejected Requirements (Non-Starters)**
  - **Political/Nation-Building Utility as Marker**  
    *Reason:* Invites bias; irrelevant to epistemic status.  
  - **Decidability in an Afternoon**  
    *Reason:* Necessary but **secondary** to core requirements; a poorly designed "quick" rule causes systemic harm.  
  - **Belief Demographics as Primary Signal**  
    *Reason:* "Right people" arguments are sociological, not epistemic.  

  ---

  ### **Intrinsic Conflicts**
  - **Trilemma: Decidability vs. Evidence-Sensitivity vs. Symmetry**  
    You can only satisfy two robustly:  
    - *Decidability + Evidence-Sensitivity*: Requires simple evidence proxies (e.g., "ignores key evidence") but may miss outsider claims.  
    - *Decidability + Symmetry*: Uses sociological markers (e.g., "published in disciplinary journals") but violates evidence-sensitivity.  
    - *Evidence-Sensitivity + Symmetry*: Demands nuanced evidence analysis, breaking **Decidability**.  
    **Resolution:** Prioritize **Evidence-Sensitivity** via procedural markers (see below) and accept mild asymmetry.

  ---

  ### **Testing Proposed Rules**  
  Using your test case: *Terraces dated to 1000 BCE, re-dated to 3000 BCE via tool marks, discarded radiocarbon, flood epic, no local settlement, claims of suppression.*  

  1. **Priya's Double-Standard Test**  
     *Build mirror case:* Mainstream claim that terraces are *older* using identical evidence (tool marks, contaminated samples). Would editors tag it? If not, original tagging is bias.  
     *Problem:* Fails **Operability**. Editors can’t reliably construct mirror cases. Also, sociological symmetry ≠ epistemic validity.  

  2. **Marcus's Vindication Condition**  
     *Specifiable observations to untag:* e.g., "Undisputed metal tools found in 3000 BCE context nearby."  
     *Problem:* Necessary but insufficient. Mainstream errors (e.g., "new pottery found") also have vindication paths. Doesn’t catch untestable claims.  

  3. **Sam's Replacement Rule**  
     *Tags if:* Claim discards established finding *and* offers no account of accepted evidence.  
     *Test Case:* Tags the terrace claim:  
     - *Discards:* Pottery dating (established finding).  
     - *No account:* Fails to explain why pottery is in upper layers (claims "suppression" but doesn’t address evidence).  
     *Strength:* Meets **Core Requirements**: Doesn’t resolve contamination dispute; focuses on argument gap. Allows salvage (e.g., tool-mark survey).  

  ---

  ### **Recommendation: Refine Sam's Rule**
  **Fringe Definition:**  
  *A historical claim is fringe if it:*  
  **(a)** Explicitly rejects an **established finding** (consensus-backed observation, e.g., pottery dating), *and*  
  **(b)** Fails to provide a **causally coherent account** of why that finding appears valid (e.g., "suppression" isn’t causal; "later settlers added pottery" is causal but testable).  

  **Why it Works:**  
  - **Operability:** Editors identify (a) via sourced consensus and (b) via gaps in the claim’s argument (no need for expertise).  
  - **Distinguishes Ordinary Error:** A contested dig may reject a finding *with* an evidence-based account (e.g., "pottery is intrusive").  
  - **Handles Salvage:** Only the *claim* (e.g., "3000 BCE date") is tagged, not related data.  
  - **Avoids Evidence-Quality Traps:** Doesn’t judge radiocarbon methods; flags *argumentative incoherence*.  

  **Edge Case:** If the claim *does* offer a causal account (e.g., "floods deposited pottery"), it becomes testable heterodoxy—not fringe. Editors tag only if the account is absent/non-causal.  

  **Strongest Candidate:** Sam’s rule best balances your constraints. Priya’s test is meta-useful for *designing* the rule but not applying it. Marcus’s test is a component of testability but not definitive.
