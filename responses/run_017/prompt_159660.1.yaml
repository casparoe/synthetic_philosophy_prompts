prompt: |-
  I'm putting together the first problem set for my grad seminar on the On Certainty material — hinge epistemology, the bit about certain propositions being held fast by what we do rather than resting on evidence. Every time I run this seminar I get the same answer from half the room: oh, so hinges are just the beliefs you're most confident in. So I want a case that kills that reading dead, and I want it to be a case the students can't wriggle out of.

  Build me the following thought experiment. One paragraph, realistic setting — a hospital ward, an analytical lab, an engineering shop, a court clerk's office, that kind of thing — with two subjects and one proposition p, engineered to these specs:

  1. Hinge epistemology has to say that for subject A, p functions as a hinge in her practice: it's not something she checks or could check within that practice, it's what she uses to adjudicate other claims, and doubting it would look like failing to grasp what she's doing. For subject B, the very same p is an ordinary empirical proposition: there's a procedure for checking it, evidence for and against, and he can turn out to be wrong about it in the usual way.
  2. A and B must be identical in every internal respect: same total evidence bearing on p, same training, same raw intelligence, same degree of felt certainty, same verbal dispositions (each would call p certain, each would refuse a bet against it, each would be baffled by its denial). If the split in 1 comes from one of them being better informed, or more confident, or just denser, the case fails.
  3. So the difference has to live outside their heads, in the practices around them. The idea I've been toying with — use it or improve on it — is what I'm calling a role-local hinge: the same proposition, in the same institution, the same language, with the same evidence, functioning as a hinge for the occupants of one role and as a testable hypothesis for the occupants of another, purely because only one of the two roles contains a check-procedure for p. Note the constraint that does real work here: A and B are in the same form of life, not two different cultures. I don't want the cheap answer that different communities simply have different hinges.
  4. Both subjects have to come out looking epistemically fine. Neither is dogmatic, lazy, crazy or negligent; whatever A does with p is what a good practitioner does. And don't let the case cheat by way of the fact that A could in principle get p checked by somebody in another role — I want you to deal with that head on: say what it shows that A can escalate p, and whether escalation makes p empirical for her after all.
  5. Finally, the case should make three treatments come apart rather than coincide: (a) a plain evidentialist/fallibilist treatment, on which identical evidence means identical epistemic standing, so A and B get the same verdict; (b) the reading of hinges on which they aren't beliefs at all — not doxastic states, more like things we do or ways the practice runs — so A doesn't believe p in the relevant sense; and (c) the system-relativist reading, on which A does believe p and it is certain relative to her epistemic system. All three should have something to say, and they shouldn't say the same thing.

  After the scenario, do the demonstration. Run (a), (b) and (c) over the case and give me each verdict with the reason; name the single feature that's load-bearing; do the removal test (what happens if you give A the check-procedure, or take B's away); and then give me the strongest objection a hinge theorist could raise against the case — I'm expecting something like the difference being mere institutional authority or division of labour, sociology rather than epistemology, and no real hinge could be that local or that fragile — plus the best reply available.

  And the honest bit: if all five specs can't be satisfied at once, tell me so and tell me which one you dropped and why. I'd much rather know than be handed a case that quietly stipulates the verdicts instead of generating them from the views.

  Give me the whole thing as a single JSON object — the prose scenario goes inside it, I don't want a seperate essay wrapped around it — with exactly these fields:

  - scenario: the one-paragraph case
  - proposition_p: p, stated in one sentence
  - subjects: array of two objects, each with label, role, evidence, internal_state, relation_to_p
  - held_fixed: array of the internal features that are identical across A and B
  - the_variable: the one thing that differs between them, and where it lives (in the practice, not in the head)
  - escalation_note: what A's ability to escalate p to another role does or doesn't do to the case
  - verdicts: object with evidentialist, non_belief_reading, system_relativist_reading — each a one-or-two-sentence verdict plus a one-sentence reason
  - load_bearing_feature: string
  - removal_test: object with check_procedure_added_to_A and check_procedure_removed_from_B
  - objection: object with objector, objection, reply
  - spec_audit: object with all_five_specs_met, spec_dropped_or_weakened (null if none), verdicts_generated_not_stipulated (brief justification)
reasoning: |-
  We are building a thought experiment according to the specifications. The goal is to create a scenario that distinguishes hinge epistemology from the "hinges are just the beliefs you're most confident in" reading.

  Key elements:
  - Two subjects, A and B, in the same institution, same evidence, same internal states, but different roles.
  - Proposition p is a hinge for A (not checked, but held fast) and an empirical proposition for B (checked with evidence).
  - The difference must come from the practices (the roles they occupy) and not from internal differences.
  - Both are epistemically fine.
  - We need to show how three treatments (evidentialism, non-doxastic reading, system-relativist reading) differ.

  After considering the constraints, I propose the following:

  **Setting**: A hospital laboratory.

  **Proposition p**: "The mass spectrometer in Lab 3 is properly calibrated."

  **Subjects**:
  - Subject A: A senior lab technician. Her role involves running tests on patient samples using the mass spectrometer. For her, the calibration of the machine is a hinge: she doesn't check it before each test; she relies on it to produce valid results. If she doubted it, she wouldn't be able to run the tests. Her practice assumes the calibration as a background condition.
  - Subject B: A calibration specialist. His role is to calibrate the instruments and check their calibration. For him, p is an empirical proposition that he tests using calibration standards and procedures. He can be wrong (e.g., if the standards are faulty, but that's a different matter).

  **Identical internal states**: Both have the same evidence: they know the machine was calibrated a week ago and has been functioning normally. They have the same training (both know how the machine works and the calibration procedure). They have the same raw intelligence, same degree of felt certainty (both are extremely confident that the machine is calibrated), same verbal dispositions (both would say "it's certain", refuse bets, be baffled by denial).

  **The variable**: The difference is in the role-defined practices. A's role in the practice of diagnostic testing does not include a procedure for checking calibration during routine testing. B's role in the practice of instrument maintenance does include such a procedure.

  **Escalation note**: If A suspects a problem, she can escalate to B. But that doesn't make p empirical for A in her routine practice. Escalation is an exceptional move, not part of her standard procedure. It only shows that the hinge is not immutable in principle, but in the context of her role, it functions as a hinge.

  **Verdicts**:
  - Evidentialist: Both A and B have the same evidence and same internal states, so both are equally justified in believing p. The difference in their practices is irrelevant to the epistemic standing of their belief.
  - Non-belief reading (hinges as non-doxastic): For A, p is not a belief but a rule of her practice. She doesn't believe it; she acts on it. For B, p is a belief because he has tested it. So A doesn't have a belief in p, while B does.
  - System-relativist: Relative to A's epistemic system (her role in the lab practice), p is certain and functions as a hinge. Relative to B's system (his role), p is empirical. So both have a belief in p, but the certainty is system-relative.

  **Load-bearing feature**: The institutional role that defines the set of procedures available to the subject.

  **Removal test**:
  - If we give A the check-procedure (e.g., make her responsible for calibration as well as testing), then p becomes empirical for her. But note that her role changes, so the hinge status might change. However, if we just add the procedure without changing her role, she might still treat it as a hinge in the context of testing (because she doesn't have time to check every time). So we must be cautious: the role defines the practice.
  - If we remove B's check-procedure (e.g., the lab outsources calibration and B is no longer allowed to check), then p becomes a hinge for B too in his new role? But if we remove the procedure from his role, then in that role he must now rely on the machine without checking. So it might become a hinge.

  **Objection**: A hinge theorist might object that true hinges are not role-dependent; they are fundamental to the entire form of life (like the existence of external objects). This case makes hinges too local and contingent, which undermines their foundational role. Moreover, the difference is merely sociological (division of labor) and not about the nature of certainty.

  **Reply**: Hinge epistemology allows for local hinges within practices. The entire form of life might have global hinges, but within a practice, there are local ones. The calibration of a machine is a local hinge for the testing practice. The objection confuses the global with the local. The case shows that the same proposition can be a hinge in one context (testing) and empirical in another (maintenance) within the same form of life. This is consistent with Wittgenstein's idea that certainty is tied to action.

  **Spec audit**: All five specs are met. The verdicts are generated by the views applied to the case, not stipulated. The key is the role-defined practice.

  Now, we write the scenario in one paragraph and structure the JSON.
