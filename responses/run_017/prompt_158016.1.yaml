     - Most awkward commitment: Denies that there is a reason to avoid a belief that has high moral costs, even when the evidence only marginally supports it.

  3. **Moral Encroachment**: 
     - Path: Node1=No, Node2=Yes
     - Most awkward commitment: Allows moral considerations to affect what you ought to believe, even when they don't bear on the truth of the belief.

  4. **Action-Oriented View**: 
     - Path: Node1=Yes, Node4=No
     - Most awkward commitment: Grants that there is a reason to take the pill to cause the belief, but denies that there is any reason to believe the proposition.

  5. **Threat-Only Pragmatic Reasons**: 
     - Path: Node1=Yes, Node4=Yes, Node5=No
     - Most awkward commitment: Holds that threats generate reasons for belief but rewards do not, without a clear principle for why.

  6. **Belief-Specific Pragmatism**: 
     - Path: Node1=Yes, Node4=Yes, Node5=Yes, Node6=No
     - Most awkward commitment: Accepts practical reasons for belief but not for desire, without a clear account of the difference.

  7. **State-Given Reasons View**: 
     - Path: Node1=Yes, Node4=Yes, Node5=Yes, Node6=Yes, Node7=No
     - Most awkward commitment: Holds that there are reasons to have an attitude (like desiring a saucer of mud) that do not bear on the fittingness of that attitude.

  8. **Monism**: 
     - Path: Node1=Yes, Node4=Yes, Node5=Yes, Node6=Yes, Node7=Yes
     - Most awkward commitment: Claims that the demon's threat makes the saucer of mud good, which seems to conflate practical reasons with grounding fittingness.

  **Angle:** The tree cuts the space to distinguish:
  - Those who see two normative relations: the State-Given Reasons View (leaf 7) explicitly distinguishes object-given and state-given reasons.
  - Those who see a difference in what the reason is for: the Action-Oriented View (leaf 4) says the reason is for the action, not for the attitude.
  - Those who dissolve the distinction: Monism (leaf 8) says there is only one kind of reason.

  Additionally, the tree captures other views like evidentialism and moral encroachment that reject the demon case for different reasons.

