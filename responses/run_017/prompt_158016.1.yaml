  ### Decision Tree for the Wrong Kind of Reasons Problem  
  **Rooted in concrete cases to map the logical space of positions, without assuming prior knowledge of labels.**  
  **Instructions:** Start at Node 1. Answer each case-based question honestly. Proceed to the next node based on your answer.  

  ---

  #### **Node 1: Standard Demon Threat (Belief)**  
  *Setup:* A demon threatens to torture you unless you believe that "2 + 2 = 5" (which you know is false). You have no evidence for this proposition.  
  **Question:** Do you have a *reason* to believe "2 + 2 = 5"?  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  #### **Node 2: Threat Directed at Another (Belief)**  
  *Setup:* A demon threatens to torture an *innocent stranger* unless you believe that "the moon is made of cheese" (which you know is false).  
  **Question:** Do you have a *reason* to believe "the moon is made of cheese"?  
  - **Yes** → Go to Node 4.  
  - **No** → **Leaf: Self-Regarding Pragmatism** (unexplored).  

  #### **Node 3: Moral Cost Case (Belief)**  
  *Setup:* You have *weak evidence* supporting a harmful stereotype (e.g., "Group X is untrustworthy"). Believing it would cause moral harm (e.g., bias).  
  **Question:** Do the moral costs give you a reason *not* to believe the stereotype?  
  - **Yes** → **Leaf: Moral Encroachment**.  
  - **No** → Go to Node 5.  

  #### **Node 4: Indirect Compliance (Belief)**  
  *Setup:* A demon threatens to torture you unless you believe "water is H₃O" (false). You *cannot* believe this directly but can take a pill causing this belief.  
  **Question 1:** Do you have a reason to *take the pill*?  
  - **Yes** → **Question 2:** Does this reason *also apply to the belief itself* (i.e., is it a reason *to believe* "water is H₃O")?  
    - **Yes** → Go to Node 6.  
    - **No** → **Leaf: Action-Oriented View**.  
  - **No** → *Incoherent* (empty; denies means to an end you acknowledge).  

  #### **Node 5: Involuntarism Check (Belief)**  
  *Setup:* You have *overwhelming evidence* that "it will rain tomorrow" (e.g., meteorological proof).  
  **Question:** Is there a reason to *believe* "it will rain tomorrow"?  
  - **Yes** → **Leaf: Evidentialism**.  
  - **No** → **Leaf: Involuntarism**.  

  #### **Node 6: Reward Case (Belief)**  
  *Setup:* A demon *offers a reward* (e.g., \$1 million) if you believe "elephants can fly" (false). You can take a belief-inducing pill.  
  **Question:** Is it *permissible* (but not required) to take the pill?  
  - **Yes** → Go to Node 7.  
  - **No** → **Leaf: Threat-Only Pragmatism** (unattractive; empty in practice).  

  #### **Node 7: Admiration Case (Non-Belief Attitude)**  
  *Setup:* A demon threatens to torture you unless you *admire* a mediocre artist (objectively unskilled).  
  **Question:** Do you have a reason to *admire* the artist?  
  - **Yes** → Go to Node 8.  
  - **No** → **Leaf: Belief-Specific Pragmatism**.  

  #### **Node 8: Desire Case (State-Given Reasons)**  
  *Setup:* A demon threatens to torture you unless you *desire* "a saucer of mud" (which has no value).  
  **Question:** Does this threat make the saucer of mud *desirable* (i.e., does it show the mud is good)?  
  - **Yes** → **Leaf: Monism**.  
  - **No** → **Leaf: State-Given/Object-Given View**.  

  ---

  ### **Logical Space & Occupancy**  
  Derived from binary answers to:  
  1. **Standard Demon** (Node 1).  
  2. **Threat to Another** (Node 2).  
  3. **Moral Costs** (Node 3).  
  4. **Indirect Compliance (Pill)** (Node 4; two sub-questions).  
  5. **Involuntarism Check** (Node 5).  
  6. **Reward Permissibility** (Node 6).  
  7. **Admiration Case** (Node 7).  
  8. **Desire Fittingness** (Node 8).  

  - **Occupied combinations** (defended positions): 8 leaves (below).  
  - **Empty combinations**:  
    - Self-Regarding Pragmatism (Node 2→No): *Unexplored* (no clear defense).  
    - Threat-Only Pragmatism (Node 6→No): *Unattractive* (arbitrary asymmetry).  
    - Incoherent (Node 4→No): *Incoherent* (denies means to a required end).  

  ---

  ### **Leaves (8 Positions)**  
  | Leaf | Path | Most Awkward Commitment |
  |------|------|-------------------------|
  | **1. Self-Regarding Pragmatism** (unexplored) | Node1=Yes → Node2=No | Only *self*-directed threats provide reasons for belief. |
  | **2. Moral Encroachment** | Node1=No → Node3=Yes | Moral costs affect reasons for belief, even when irrelevant to truth. |
  | **3. Evidentialism** | Node1=No → Node3=No → Node5=Yes | No pragmatic reasons to believe, even to prevent torture. |
  | **4. Involuntarism** | Node1=No → Node3=No → Node5=No | No reasons for belief *at all* (even with evidence). |
  | **5. Action-Oriented View** | Node1=Yes → Node2=Yes → Node4=Yes/No | Reasons apply to *actions causing attitudes* (e.g., pill-taking), not attitudes themselves. |
  | **6. Threat-Only Pragmatism** (unattractive) | Node1=Yes → Node2=Yes → Node4=Yes/Yes → Node6=No | Threats create reasons for belief; rewards do not. |
  | **7. Belief-Specific Pragmatism** | Node1=Yes → Node2=Yes → Node4=Yes/Yes → Node6=Yes → Node7=No | Pragmatic reasons for belief, but *not* for admiration/desire. |
  | **8. State-Given/Object-Given View** | Node1=Yes → Node2=Yes → Node4=Yes/Yes → Node6=Yes → Node7=Yes → Node8=No | Reasons like threats are "state-given" (bearing on *having* an attitude) not "object-given" (bearing on its fittingness). |
  | **9. Monism** | Node1=Yes → Node2=Yes → Node4=Yes/Yes → Node6=Yes → Node7=Yes → Node8=Yes | All reasons are of one kind (e.g., threats *make* the mud desirable). |

  ---

  ### **How the Tree Cuts the Space**  
  The tree separates views based on three angles:  
  1. **Two normative relations** (e.g., state-given vs. object-given reasons): Captured by the **State-Given/Object-Given View**, where reasons to *have* an attitude (state-given) differ from reasons bearing on its *correctness* (object-given).  
  2. **Difference in what the reason is *for***: Captured by the **Action-Oriented View**, where reasons target *actions* (e.g., taking a pill) rather than attitudes.  
  3. **Artefact to be dissolved**: Captured by **Monism**, which denies the distinction entirely, and **Involuntarism**, which denies reasons for attitudes like belief altogether.  

  **Unseparated Pair**:  
  - **Moral Encroachment** vs. **Pragmatic Encroachment**: The tree cannot distinguish these, as Moral Encroachment is isolated early (Node 3). A **further question** would separate them:  
    > *"In the Standard Demon setup, if the threat is non-moral (e.g., torture for no social reason), does it still give a reason to believe?"*  
    > - Moral Encroachment: **No** (only moral costs matter).  
    > - Pragmatic Encroachment: **Yes** (any cost/benefit matters).  

  ---

  ### **Tree's Cutting Angle**  
  The tree successfully cuts the space along:  
  - **Normative relations** (State-Given/Object-Given View).  
  - **Target of reasons** (Action-Oriented View).  
  - **Dissolution strategies** (Monism, Involuntarism).  
  It also isolates **Evidentialism** (rejecting all non-truth-related reasons) and **Moral Encroachment** (moral-specific reasons). The remaining leaves capture pragmatic positions, with Belief-Specific Pragmatism highlighting an asymmetry.  

