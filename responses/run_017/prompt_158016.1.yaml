  - The branch at Node 5 for "No" (Threat-Only) is marked as unexplored. We are not aware of a defended view that accepts reasons from threats but not from rewards.
  - The branch at Node 4 for "No" is the Action-Oriented View, which is occupied.
  - We do not have a branch for the threat to another person, so that combination is not explored in this tree.

  **Pairs the tree cannot separate:**
  - This tree does not separate pure evidentialism from views that might accept some non-moral pragmatic reasons but reject the demon case for other reasons. But by the structure, evidentialism is defined by rejecting both the demon case and the moral cost case.
