     - **No**: Go to Node 3.
     - **Yes**: **Leaf: Moral Encroachment**

  **Node 3 (Reasons for belief ever?):** 
     In general, do you think that there are ever reasons for belief? (For example, when you have strong evidence for a proposition, do you have a reason to believe it?)
     - **No**: **Leaf: Involuntarism**
     - **Yes**: **Leaf: Evidentialism**

  **Node 4 (Indirect case for belief):** 
     The demon threatens to punish you unless you believe p. You cannot directly choose to believe p, but you can take a pill that will cause you to believe p. Do you think that the demon's threat gives you a reason to believe p (not just a reason to take the pill)?
     - **No**: **Leaf: Action-Oriented View**
     - **Yes**: Go to Node 5.

  **Node 5 (Reward case for belief):** 
     A demon offers you a reward (but does not threaten any punishment) if you believe a proposition q for which you have no evidence. You can take a pill that will cause you to believe q. Is it permissible (though not required) for you to take the pill?
     - **No**: **Leaf: Threat-Only Pragmatic Reasons** (unexplored)
     - **Yes**: Go to Node 6.

  **Node 6 (Desire case):** 
     A demon threatens to punish you unless you desire a saucer of mud (which is entirely worthless and not good in any way). Do you have a reason to desire the saucer of mud?
     - **No**: **Leaf: Belief-Specific Pragmatism**
     - **Yes**: Go to Node 7.

