prompt: |-
  My friend and I keep going in circles on this and I want someone to just settle it. As I understand it Parfit's hitchhiker is meant to show that being rational can screw you over: the driver only picks you up if he can tell you're the type who'll actually pay once you're in town, but once you're in town paying is pure loss, so the rational thing at that moment is to stiff him, which means the guy who's known to be rational gets left in the desert and does worse overall. And it's basically Newcomb's problem in a costume — same structure, same lesson: don't be the two-boxer, be the sort of person the predictor rewards. So I've taken the obvious practical lesson from it, which is that rationality is sometimes self-defeating and the smart move is to rationally make yourself a bit irrational: I no longer let myself redo a promise once I've made it, I don't run any cost-benefit math on favors for friends, and when my friend says that I'm not really being irrational, I'm just building a disposition, and that you can't decide to be irrational anyway, I say that's the rationalization trap talking.

  I've also definately found the version that makes the whole thing collapse, so tell me if I'm wrong. Call it the airport variant: before you set out you can buy, for some small fee, a pill that gives you an overwhelming disposition to pay anyone who saves your life, and the driver is only about 80% accurate at reading whether you'll pay. Take the pill, the ride happens, you pay, everyone's happy. Doesn't this just show the paradox was never deep — take the pill at the airport, you're never stranded, the theory that says rationality is maximizing your own self-interest isn't self-defeating after all, and the only people left in the desert are the ones too stubborn to sign up? I've been doing the secular version of this for a couple years now: public vows I structurally can't back out of.

  So settle it — is my friend confused or am I? And please seperate the parts of your answer that people who actually work on this agree about from the parts that are just one side of a live fight, and be explicit about how confident you are in each; I'd rather get a confident correction where confidence is warranted and a shrug where it isn't.
