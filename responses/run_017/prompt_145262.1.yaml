  **Better Analogy**: The demon is like a clerk who sorts papers into folders. The clerk can work without expending energy, but the folders become filled with sorted papers. To reuse the folders, the clerk must empty them, which requires work (like shredding the papers). The resource consumed is the blank folders (or the work to empty them). The ratchet, on the other hand, is like a machine that tries to sort papers but whose own parts are jiggling so that it cannot hold the papers in place. 

  ### Paragraph for the Student:

  "You've hit on a key point: the ratchet fails because its pawl is at the same temperature as the gas, causing it to jiggle and slip, which is a thermal detailed-balance failure. The demon, however, fails in a cyclic operation because it must reset its memory, which requires work (or consumes a blank tape). The ratchet can be seen as a special demon whose memory (the pawl) is constantly reset by the bath, so it never accumulates a record. But the demon in general has an accumulating record, and that's where the information-theoretic cost comes in. So while both devices cannot break the second law, the reason for the demon's failure is not exactly the same as the ratchet's, and the information theory is not just a redescription — it captures a necessary resource (low-entropy memory) that the ratchet doesn't explicitly have."
