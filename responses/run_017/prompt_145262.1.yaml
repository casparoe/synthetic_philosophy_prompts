  #### d) Demon that Avoids Erasure by Reversing Computation
  - The demon runs its measurement and trapdoor operation in reverse, so that the record is destroyed without dissipation. This is only possible if the entire process is reversible. 
  - **Net work delivered?** Over a full cycle (forward and then reverse), the net work is zero. The forward cycle extracts work and writes a bit. The reverse cycle takes the written bit and uses it to run the process backward: the work is returned and the bit is unwritten. 
