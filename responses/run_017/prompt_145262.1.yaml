    - Net work: **Yes**, \(k_B T \ln 2\) per cycle (e.g., from Szilard engine equivalent).  
    - Resource consumed: **Blank tape (1 bit/cycle)**.  
    - Entropy: Gas entropy decreases by \(k_B \ln 2\)/cycle; tape entropy increases by \(k_B \ln 2\)/cycle (random bits). Net universe entropy change: **0**.  

  - **Demon with Finite Register (N bits, Cyclically Reset)**:  
    - Net work: **None** over full cycle (N cycles + reset).  
    - Resource consumed: **None** over full cycle.  
    - Entropy: During N cycles, work \(N k_B T \ln 2\) extracted; gas entropy decreases by \(N k_B \ln 2\). Reset erases N bits, dumping heat \(N k_B T \ln 2\) to bath, increasing bath entropy by \(N k_B \ln 2\). Net universe entropy change: **0**.  

  - **Demon Avoiding Erasure (Reversing Computation)**:  
    - Net work: **None** over full cycle (forward + reverse).  
    - Resource consumed: **None**.  
    - Entropy: Reversible process; universe entropy change: **0**.  

  **Resource Ledger**:  
  - Ratchet: No work, no resource.  
  - Infinite-tape demon: Work = \(k_B T \ln 2\)/cycle, resource = 1 blank bit/cycle.  
  - Finite-register demon: Net work = 0, resource = 0 over cycle.  
  - Reversal demon: Net work = 0, resource = 0.

  ### 3. Mapping Break and Disanalogies
  Your suspicion is **correct**.  
  - **Key disanalogy**: Ratchet has **no accumulating record**; demon **does**.  
  - **Ratchet failure**: Thermal detailed balance (pawl jiggles at T, equal forward/backward rates).  
  - **Demon failure**: Bookkeeping (reset cost or tape consumption); correlations tracked in memory.  
  - **Secondary disanalogies**:  
    - Pawl’s role is continuous and passive; demon’s memory is discrete and active.  
    - Ratchet requires explicit temperature difference to work; demon requires blank tape or reset work.  
  - **Does it matter?** Yes. The ratchet’s failure is purely thermal; the demon’s is informational. The ratchet **is** a special case of a demon whose memory (pawl state) is **continuously and irreversibly reset by the bath** (jiggling randomizes pawl position).

  ### 4. Demon with Lossless Compressor in Correlated Gas
  - **Per-cycle cost**: Reset cost is \(k_B T \ln 2 \times H\), where \(H\) is entropy rate (bits/cycle) of the record (\(H \leq 1\)).  
  - **Can it profit? No**.  
  - **Bound**: Net work \(\leq k_B T \ln 2 \times I\), where \(I\) is mutual information (bits/cycle) between measurement and gas state.  
  - **Why compression fails**:  
    - Work extracted \(\leq k_B T \ln 2 \times I\) (from gas entropy reduction).  
    - Reset cost after compression = \(k_B T \ln 2 \times H\).  
    - Since \(I \leq H\) (mutual information ≤ entropy rate), net work \(\leq k_B T \ln 2 \times (I - H) \leq 0\).  
  - **Correlated gas**: Reduces \(H\) but also caps \(I\); no net gain.

  ### 5. Hybrid Devices: Forced Analogy
  - **Ratchet Geared to Bistable Memory (Never Reset)**:  
    - Fails for **ratchet’s reason**. Pawl jiggles at T, preventing net rotation. Memory records noise but doesn’t cause failure.  
  - **Demon with Memory as Ratchet Wheel Position (Reset by Tilting)**:  
    - Fails for **demon’s reason**. Tilting resets wheel angle to "0", dissipating \(k_B T \ln 2\) heat (Landauer). Memory reset cost dominates.

  ### 6. Verdict
  - **Conclusion 1 (No cyclic work from single bath)**: **Survives**. All devices yield net zero work when the entire system (including memory) cycles to initial state.  
  - **Conclusion 2 (Information theory dispensable)**: **Fails**. The demon’s failure requires informational accounting (tape/reset cost); thermal physics alone (e.g., ratchet’s pawl jiggle) doesn’t capture it.  
  - **Better analogy**: A **library sorting machine**.  
    - Books (molecules) are sorted by a machine (demon) into shelves.  
    - Machine works if shelves are empty (blank tape).  
    - To reuse full shelves, books must be removed (reset), requiring work.  
    - Without empty shelves or reset work, sorting halts—mirroring the demon’s need for a low-entropy resource.

  ### Paragraph for Student
  "You've pinpointed the flaw in oversimplifying the analogy. The ratchet fails because its 'memory' (the pawl) is at temperature T, jiggling randomly—a thermal detailed-balance issue. The demon fails because its memory fills up and must be reset, costing work or blank tape—an informational bookkeeping issue. They both uphold the second law, but the demon's failure mode is distinct and requires information theory to fully resolve. The ratchet is like a demon whose memory is instantly scrambled by heat, so it can't accumulate a record. But for a general demon, the cost of managing its growing record is central—and that's what Landauer captures."
