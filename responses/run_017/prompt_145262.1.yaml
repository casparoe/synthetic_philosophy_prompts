  **Summary Table for Part 2:**

  | Device                                                | Net Work Delivered? | Resource Consumed?                | Entropy Change (Universe) |
  |-------------------------------------------------------|---------------------|-----------------------------------|---------------------------|
  | Ratchet                                               | No                  | None                              | 0                         |
  | Demon with inexhaustible blank tape (never erased)    | Yes, per cycle      | Blank tape (one bit per cycle)    | 0 (entropy in tape)       |
  | Demon with finite register (N bits) and cyclic reset  | No (over full cycle) | None (over full cycle)            | 0                         |
  | Demon avoiding erasure by reversal                    | No (over full cycle) | None                              | 0                         |

  Note: The inexhaustible tape demon does deliver net work per cycle, but it consumes the tape resource. The other devices do not deliver net work over a cycle that returns the entire system (including memory) to the initial state.

  ### 3. Where the Mapping Breaks and Disanalogies

  The mapping breaks in the following ways:

