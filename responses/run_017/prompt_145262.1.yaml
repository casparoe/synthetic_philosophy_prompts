  | Angled teeth                  | Measurement mechanism          | The angled teeth are designed to allow rotation in one direction; the measurement mechanism (e.g., a sensor) determines when to open the trapdoor. |
  | Pawl                          | Memory cell                     | The pawl holds the wheel from rotating backward; the memory cell holds the measurement result. Both store state. |
  | Spring                        | Reset operation                 | The spring provides the force to reset the pawl; the reset operation erases the memory. |
  | Gas (at T)                    | Gas (at T)                      | The gas provides the thermal fluctuations that the device tries to harness. |
  | Load                          | Work per cycle                  | The load lifted by the ratchet equals the work done by the demon per cycle (lifting a weight, etc.). |
  | Second temperature (for pawl) | Bath at T (for reset)           | In the ratchet, the pawl must be at a lower temperature to avoid thermal jiggling. In the demon, the reset of memory typically dumps heat to the bath at T. |
  | Net rotation                  | Work per cycle                  | The net rotation of the wheel corresponds to the net work done by the demon per cycle. |
  | **Absent in Ratchet**         | **Absent in Demon**             |                                          |
  |                               | Tape/Register                   | The ratchet does not have an accumulating record (like a tape). The demon uses a tape to store multiple bits. |
  | **Absent in Demon**           | **Absent in Ratchet**           |                                          |
