prompt: |-
  Longtime lurker, finally posting. I keep noticing the same move in threads about hedonism and well-being and I don't have a word for it, or rather the word I have is probably the wrong one.

  Here's the shape of it. Someone motivates hedonism by saying that the only thing that can be good for you is something that changes what your life is like from the inside — the intuition behind the experience machine, or behind saying that a wish fulfilled after you're dead can't be good for you. "Pleasure" gets introduced there as the stuff that feels good, felt quality, obvious. Then someone brings up the heterogeneity problem: the pleasure of cold water after a long run, the pleasure of finally seeing why a proof works, and the pleasure of finding out your paper got accepted don't seem to share any one feeling. The cold water has a bodily qualia you can point at; seeing the proof is mostly just absorption in the proof, and if there's a feeling at all it's a relief that shows up afterward; the acceptance email feels like a state directed at a proposition rather than a sensation. The reply I always get is: right, that's why nobody holds a felt-quality view anymore, pleasure is really an attitude — enjoying something, being glad that p, wanting the experience to continue, take your pick. OK. But then two paragraphs later the same person is leaning on the experience intuition again to say desire theories are absurd, and at that point the "wanting it to continue" bit is doing no work at all.

  I've been calling it hedonic drift, which my friends point out sounds like a made up economics term. Someone else told me it's just the adverbial theory, but that seems like a view rather than a move. It's also not quite motte-and-bailey: neither version is a safe core that gets retreated to under attack — the felt-quality version does the work at the start and the attitudinal one does it later, and the argument needs both. Plain equivocation feels too thin too, since it doesn't explain why the switch is systematic, with each version reliably assigned to a different job.

  Is there an established name for this? And if the nearest thing is a cluster of concepts rather than one, I don't want a label dropped on me — I want to know which of them actually carves the pattern I'm pointing at and where the edges are.

  Give me:
  - What I'm describing (~100 words): restate the move better than I did
  - Nearest existing concepts (~250 words): felt-quality vs. adverbial vs. attitudinal theories, the experience requirement, motte-and-bailey and equivocation — which fits, where each one breaks down
  - Is it actually an inconsistency (~200 words): or is there a way for a hedonist to hold both halves without cheating
  - Name it (~100 words): if nothing established fits, give me a definition plus one clear case and one near-miss that isn't an instance
reasoning: |-
  Okay, the user is describing a recurring pattern they've noticed in philosophical debates about hedonism and well-being. They see a tactical switch between two concepts of pleasure: one as a felt quality (like sensations) and another as an attitude (like enjoyment or wanting to continue). This switch happens strategically in arguments—using the felt-quality version to establish core intuitions (like the experience machine thought experiment), then switching to the attitudinal version to handle objections (like the heterogeneity problem), and finally reverting to felt-quality to attack desire theories. 

  The user wants to know if this move has an established name, and if not, what would accurately describe it. They've considered terms like "hedonic drift," "adverbial theory," "motte-and-bailey," and "equivocation," but find them inadequate. Their deeper need seems to be precision—they want to correctly label this pattern to navigate discussions more effectively, not just get a term slapped on it. 

  Breaking it down:  
  First, the pattern isn't just sloppy equivocation—it's systematic. Felt-quality pleasure does the heavy lifting for foundational arguments (e.g., "only experiences matter for well-being"), while attitudinal pleasure solves counterexamples (e.g., "pleasures are diverse but all involve wanting to continue"). The inconsistency arises when the same foundational intuition (experience matters!) is later used to criticize desire theories, even though the attitudinal definition *itself* relies on desire-like states (wanting to continue).  

  Existing concepts don't quite fit:  
  - **Motte-and-bailey** fails because neither version is consistently the defensible "motte" or ambitious "bailey"—they're swapped situationally.  
  - **Equivocation** is too broad; it misses the *functional* switch (each definition handles a specific argumentative task).  
  - **Adverbial theory** is a specific view (pleasure as a way of experiencing), not the tactical move itself.  

  Is it inconsistent? Yes, if unacknowledged. A hedonist could theoretically ground both in a unified theory (e.g., "attitudes *are* felt qualities"), but in practice, the switch often happens without justification, exploiting the strengths of each definition while dodging their weaknesses.  

  For naming, since no established term fits, I'll propose **"hedonic bait-and-switch"** to capture the tactical deception: baiting with felt-quality to secure intuitions, then switching to attitudinal under pressure. A clear case is using felt-quality for the experience machine, then attitudinal to explain heterogeneous pleasures. A near-miss would be someone consistently using attitudinal pleasure but mistakenly citing felt-quality intuitions—that's just confusion, not strategy.
answer: |-
  Here’s a precise breakdown of your observation:

  ### 1. What You’re Describing  
  You’re identifying a **dialectical slide** in hedonist arguments:  
  - **Step 1:** Use **felt-quality pleasure** (e.g., sensory qualia) to motivate hedonism’s core intuition: only *experiences* directly impact well-being (e.g., the Experience Machine thought experiment).  
  - **Step 2:** When faced with the heterogeneity problem (pleasures lack a common feeling), switch to **attitudinal pleasure** (e.g., "enjoying" or "wanting to continue" an experience) to dissolve the objection.  
  - **Step 3:** Revert to **Step 1’s felt-quality intuition** to attack desire theories (e.g., "Desires can’t be good if unfelt!"), while ignoring that **Step 2’s attitudinal definition relies on desire-like states**.  
  This creates an inconsistent reliance on *experiential immediacy* when convenient, and *attitudinal flexibility* when needed.  

  ---

  ### 2. Nearest Existing Concepts & Where They Break Down  
  - **Felt-Quality vs. Attitudinal Theories**:  
    - Felt-quality: Pleasure is a unified sensation (e.g., tingling warmth).  
    - Attitudinal: Pleasure is a pro-attitude (e.g., enjoyment).  
    - **Breakdown**: Your case isn’t about endorsing one theory, but *opportunistically alternating* between them to defend hedonism.  

  - **Adverbial Theory** (pleasure as a *way* of experiencing, e.g., "doing X pleasurably"):  
    - Fits partially, as it avoids heterogeneity, but your observed move *isn’t adopting this view*—it’s using it as a stepping stone while retaining felt-quality intuitions.  

  - **Experience Requirement** (only conscious experiences affect well-being):  
    - Central to Step 1 and Step 3, but Step 2’s attitudinal pleasure *stretches* "experience" (e.g., "wanting to continue" isn’t a sensation).  

  - **Motte-and-Bailey**:  
    - **Motte** (defensible): Attitudinal pleasure (avoids heterogeneity).  
    - **Bailey** (ambitious): Felt-quality (supports Experience Machine).  
    - **Breakdown**: Unlike classic motte-and-bailey, both positions are used *offensively*: attitudinal to counter objections, felt-quality to attack rivals. Neither is a retreat.  

  - **Equivocation**:  
    - Superficially fits (switching definitions), but misses the *systematic pattern*: each definition is assigned a *specific argumentative role* (felt-quality for foundations/rival critique, attitudinal for defense).  

  **Verdict**: This is **equivocation-plus**—a *functional* alternation where definitions are weaponized for distinct purposes.  

  ---

  ### 3. Is It Inconsistent?  
  **Yes, unless explicitly reconciled**. The tension:  
  - **Felt-quality pleasure** implies phenomenological immediacy ("goodness must be *felt*").  
  - **Attitudinal pleasure** is dispositional/relational (e.g., "wanting to continue" can exist without salient qualia).  
  When a hedonist uses Step 3 ("Desire-fulfillment without experience is meaningless!"), they rely on felt-quality intuition. But Step 2’s attitudinal pleasure *itself* often depends on desires (e.g., "wanting to continue"). This undermines their critique of desire theories.  
  **Can it be resolved?** Only if:  
    - (a) They argue attitudinal states *are* felt qualities (e.g., "wanting" has a proprietary phenomenology), or  
    - (b) They abandon the Experience Machine’s strict phenomenology.  
  Most hedonists don’t do this mid-argument—hence the inconsistency.  

  ---

  ### 4. Naming It  
  **Proposed Term**: **Hedonic Bait-and-Switch**  
  - **Definition**: A dialectical tactic in hedonist arguments where *felt-quality pleasure* is used to establish foundational intuitions (e.g., the Experience Machine) and attack rivals, while *attitudinal pleasure* is substituted to evade objections (e.g., heterogeneity), without resolving the tension between these definitions.  
  - **Clear Case**:  
    - *Bait*: "Only felt experiences matter for well-being (Experience Machine!)."  
    - *Switch*: "Heterogeneity? Pleasure isn’t a feeling—it’s *wanting the experience to continue*!"  
    - *Bait again*: "But desire theories fail because unfelt desires don’t matter!"  
  - **Near-Miss**:  
    - A hedonist who *explicitly* defends attitudinal pleasure and *rejects* the Experience Machine’s strict phenomenology (e.g., "Well-being includes unconscious attitude-states"). Here, no bait-and-switch occurs.  

  This captures the *tactical deception* while highlighting the dual-role mechanism. If you need scholarly weight, cite it as a **functional equivocation in hedonist dialectic**.
