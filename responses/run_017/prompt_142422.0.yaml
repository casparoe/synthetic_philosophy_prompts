prompt: |-
  I convene, as a non-voting chair, the Curriculum Priorities Committee at a small liberal-arts college: nine members, four from the sciences, four from the humanities, and a dean who votes only to break ties. We meet four times a year, and this year we have to pick one of six proposals for a new interdisciplinary concentration, by ranked ballot, then settle at the next two meetings two follow-on questions that are procedurally separate but substantively tied to the first: whether the concentration carries a required capstone, and which of three staffing models pays for it. Three of the six proposals are variations on one theme, any member may add a proposal to the shortlist up to forty-eight hours before the vote, and last year we adopted a proposal that had been added at that deadline, after which two members complained that the winner would have been different had a near-duplicate of it not also been on the list; I have never known whether that complaint was well-founded. Two constraints are fixed: the ballots are strictly ordinal, because the dean has ruled that any expression of how strongly someone prefers an option is improper in a matter with staffing consequences; and I have one spreadsheet, about forty minutes of meeting time, and an obligation to send the faculty senate a short paragraph justifying the outcome, which the senate can return to us if it judges the process arbitrary.

  I have read the rough statement of Arrow's impossibility theorem — that no rule for aggregating rankings over three or more alternatives satisfies unanimity, independence of irrelevant alternatives, and non-dictatorship simultaneously — and I do not need it explained to me. What I need is a procedure my committee could actually run. A political scientist colleague tells me that if every member's ranking is single-peaked along one shared ordering of the options, majority rule stops cycling and the median member's top choice wins; another colleague says that with three or more options any rule I might adopt can be manipulated by someone misrepresenting their ranking, so that fussing over rules is pointless; a third says that if we vote pairwise in sequence, whoever sets the order of the votes effectively decides the outcome. I don't know what to do with any of these claims, and I would rather the procedure not become a civics lecture. So give me the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops and says do not vote yet, discuss instead, and the points at which it hands the decision back to a person because the question is one of values rather than of aggregation. Assume I have to say all of this out loud to nine non-specialists in plain language, and tell me what to leave out at this level and why rather than trying to be complete.

  Then run the procedure on three cases. First: a committee whose rankings really do line up along one dimension, where I want to know how to check that and what I am entitled to conclude if it holds. Second: last year's situation, where removing or merging one weak proposal would apparently change the winner between two others — including how, in forty minutes and without asking anyone to restate intensity, I can test whether the complaint was sound, and what I should do if it was. Third: a committee that is not arguing about which option is best but about which dimension orders the options at all, since the scientists rank by research fit and the humanities members by teaching load, and no amount of voting seems to touch the disagreement. At least one of these should end somewhere the committee will not like — I would rather find that out from you than in the meeting — and I also want a short closing statement of what the procedure cannot do: which failures it cannot detect, which guarantees it cannot give, and where it is simply dressing up a judgment call as a rule.
reasoning: |-
  Hmm, the user is chairing a Curriculum Priorities Committee at a small liberal arts college. They need a practical voting procedure for selecting an interdisciplinary concentration from six proposals, with additional follow-on decisions about capstones and staffing. There are several constraints: nine members (four science, four humanities, plus a tie-breaking dean), ranked ballots without intensity, limited time (one spreadsheet, 40 minutes), and a need to justify outcomes to the faculty senate.

  Key challenges they mentioned:
  - Last year's controversy about vote-splitting with similar proposals
  - Arrow's theorem awareness but need for practicality
  - Concerns about strategic voting and agenda manipulation
  - Potential disciplinary divides in evaluation criteria
  - Need for auditable process within tight time constraints

  The user specifically wants:
  1. A step-by-step verbal script for non-specialists
  2. Three test cases demonstrating the procedure
  3. Clear limitations of whatever method is proposed

  Important constraints:
  - No cardinal preferences (dean's rule)
  - Proposals can be added up to 48h before vote
  - Three proposals are variations on one theme
  - Must produce senate-justifiable outcome

  Considering voting methods:
  - Ranked pairs (Tideman) meets many criteria but might be computationally intensive
  - Schulze method is robust but complex to explain
  - Borda count violates IIA but is simple - risky with similar proposals
  - Sequential pairwise vulnerable to agenda manipulation

  For practical implementation:
  - Need visual verification steps for single-peakedness
  - Must handle vote-splitting concerns explicitly
  - Should have conflict detection points
  - Requires timeout for discussion when deadlocked

  For the test cases:
  1. Single-peaked scenario: Show condensation and verification
  2. Vote-splitting scenario: Demonstrate clone detection and removal
  3. Value conflict scenario: Expose dimensionality mismatch

  Procedure design priorities:
  - Audit trail for senate justification
  - Time management (40 mins max)
  - Disciplinary neutrality
  - Explicit discussion triggers
  - Fallback to human judgment when aggregation fails

  Key phrases to avoid:
  - Theoretical jargon ("IIA", "Condorcet winner")
  - Mathematical notation
  - Historical voting theory references

  Instead use:
  - "Do these rankings align on a common scale?"
  - "Are any proposals nearly identical?"
  - "Is the disagreement about priorities?"

  Limitations to emphasize:
  - Cannot resolve fundamental value conflicts
  - Doesn't prevent strategic voting
  - Requires good-faith participation
  - Only as good as the initial ranking input
answer: |-
  Below is a practical, meeting-ready procedure designed for your constraints: plain language, auditable within 40 minutes using a spreadsheet, with clear off-ramps to discussion when aggregation fails. It prioritizes detecting consensus or conflict over forcing a mechanical outcome. The core is a **tiered voting and discussion protocol** that tests for single-peakedness, vote-splitting, and value conflicts before aggregating.

  ---

  ### **Procedure Script (Verbatim for Committee Meeting)**
  "Colleagues, we’ll use ranked ballots to find broad agreement or flag disagreements needing discussion. We’ll proceed in steps—each is quick—and I’ll announce when we pause to talk. Your ballot ranks all proposals 1st (best) to 6th (worst). I’ll enter these into a spreadsheet that checks three things:  
  1. **Alignment:** Do our rankings share a common 'spectrum'?  
  2. **Splitting:** Could near-identical proposals distort the outcome?  
  3. **Conflict:** Are we deadlocked over fundamental priorities?  

  If all three checks pass, we get a winner. If not, we discuss and revote. Questions? Let’s begin."

  #### **Step 1: Ballot Collection & Single-Peakedness Check (10 min)**  
  - **What you say:** "Enter your rankings now. While I input these, let’s list the proposals on the whiteboard horizontally. Once ballots are in, I’ll ask: *If we imagine these proposals arranged left-to-right, does your ranking rise to one 'peak' then fall?* Example: If options A-B-C are left-to-right, your ranking might be B > A > C (peaks at B) or A > B > C (peaks at A)—but *not* B > C > A (two peaks)."  
  - **Sufficient answer:** All members confirm their rankings have one peak along the *same* left-right order. If ≥7 agree on the order (e.g., "Research fit" or "Teaching load"), proceed. If not, skip to Step 3.  
  - **Why this?** Tests for a hidden consensus dimension. If true, majority rule works and cycling stops.  

  #### **Step 2: Clone Detection (5 min)**  
  - **What you say:** "Look at the proposals. Are any 'clones'—near-identical? If so, we’ll merge them into one option for voting. Why? To prevent splitting votes between similar ideas, which could change the winner."  
  - **Sufficient answer:** Members nominate clones (e.g., "Proposals 1, 2, and 3 are all variations on theme X"). If anyone objects, keep separate; if all accept, merge.  
  - **Why this?** Addresses last year’s complaint. Merging clones avoids irrelevant alternatives distorting results.  

  #### **Step 3: Pairwise Runoff (15 min)**  
  - **What you say:** "The spreadsheet will pit every pair head-to-head. For example: 'How many prefer A over B?' We need a majority winner for each pair. If one proposal beats all others, it wins. If not, we check for a 'Condorcet paradox' (e.g., A>B, B>C, but C>A)."  
  - **Sufficient answer:**  
    - If one proposal wins all pairings → **Adopt it**.  
    - If a cycle occurs (no clear winner) → **Pause for discussion** (go to Step 4).  
    - If no cycle but no single winner → **Eliminate the least-preferred** (lowest pairwise win count) and rerun.  
  - **Why this?** Pairwise comparisons are robust and satisfy more voters than instant-runoff.  

  #### **Step 4: Conflict Check (10 min)**  
  - **What you say:** "If we’re stuck, let’s diagnose why. On the whiteboard, list the top 2-3 proposals. For each, state your top criterion: Research fit, teaching load, student demand, or other? If most scientists cite research and humanists teaching, we have a values clash—no vote will resolve this."  
  - **Sufficient answer:** Criteria cluster by discipline → **Hand decision to the dean** with a summary of the conflict. Mixed criteria → **Discuss trade-offs and revote**.  
  - **Why this?** Identifies when disagreement is fundamental (values) vs. tactical (ranking).  

  #### **Closing the Vote**  
  - If a winner emerges: "Proposal X wins with broad support. Per our rules, this outcome is [justify: ‘unanimous on the spectrum,’ ‘beats all pairwise,’ or ‘stable after clone removal’]."  
  - If deadlocked: "We need further discussion. I propose we [specific action: e.g., merge proposals Y/Z, task a subcommittee with compromise]. We’ll revote next meeting."  

  #### **What to Omit & Why**  
  - **Arrow’s theorem**: Don’t mention. It implies *all* systems are flawed, which paralyzes. Instead, focus on detecting when your *specific* system fails.  
  - **Strategic voting warnings**: Don’t discuss. It invites gaming. If detected later (e.g., a member ranks a weak rival last), note it in the senate report as a risk.  
  - **Mathematical details**: Skip why pairwise works. Say: "This compares options fairly head-to-head."  

  --- 

  ### **Test Cases**  
  *Assumes 9 voters: Sci1–4, Hum1–4, Dean votes only for ties. Six proposals: A1, A2 (science clones), B (science), C1, C2 (humanities clones), D (interdisciplinary).*

  #### **Case 1: Single-Peaked Success**  
  - **Rankings**: All members rank proposals on a "Theory-to-Applied" spectrum:  
    `A1 > A2 > B > D > C2 > C1` (Sci peak at A1/A2)  
    `C1 > C2 > D > B > A2 > A1` (Hum peak at C1/C2)  
    *(Spectrum: A1–A2–B–D–C2–C1)*  
  - **Procedure**:  
    - Step 1: All confirm single-peakedness on the spectrum → Pass.  
    - Step 2: A1/A2 and C1/C2 merged as clones → Ballot now: A, B, D, C.  
    - Step 3: Pairwise shows D beats all (5–4 each) → D wins.  
  - **Justification for Senate**: "Outcome is single-peaked on a theory-applied spectrum; D wins all pairwise matchups after merging near-identical proposals."  

  #### **Case 2: Vote-Splitting Complaint (Last Year’s Issue)**  
  - **Rankings**:  
    - Sci: *B > A1 > A2 > ...* (splits science vote)  
    - Hum: *C1 > C2 > D > ...* (splits humanities vote)  
    - Without clones, D wins. But if A1 is removed, B wins.  
  - **Procedure**:  
    - Step 1: Rankings aren’t single-peaked → Skip to Step 2.  
    - Step 2: Members flag A1/A2 as clones → Merge into "A".  
    - Step 3: Pairwise runoff: B vs. D → B wins 5–4 (Sci + 1 Hum).  
    - **Complaint test**: Compare original ballots with clones vs. merged:  
      - Spreadsheet calculates: "With A1/A2 separate, D wins; merged, B wins." → Complaint was valid.  
      - Time: Takes 2 minutes to toggle clone merger in spreadsheet.  
  - **If complaint is valid**: "Merging similar proposals changed the winner, confirming vote-splitting. We adopt the merged-result winner (B)."  
  - **Justification**: "Outcome adjusted for near-identical options to prevent distortion."  

  #### **Case 3: Irreconcilable Values Conflict**  
  - **Rankings**:  
    - Sci: *B > A1 > A2 > D > C1 > C2* (ranks by research fit)  
    - Hum: *C1 > C2 > D > A2 > A1 > B* (ranks by teaching load)  
  - **Procedure**:  
    - Step 1: No shared spectrum (Sci peak left, Hum peak right) → Fail.  
    - Step 2: Clones merged → Ballot: A, B, C, D.  
    - Step 3: Pairwise cycle: B beats A, A beats C, C beats B → Deadlock.  
    - Step 4: Criteria check: Sci cite "research," Hum cite "teaching" → Values clash.  
  - **Outcome**: "No voting method can resolve this; the dean must decide or we negotiate."  
  - **Dean’s move**: Brokers a compromise (e.g., "Adopt D but add a capstone") or forces a tiebreak.  
  - **Justification**: "Persistent deadlock reflects disagreement on core priorities; outcome delegated to dean."  

  ---  

  ### **What the Procedure Cannot Do**  
  1. **Guarantee fairness under strategy**: A member could rank a rival last to manipulate pairwise results. The spreadsheet can’t detect this—assumes good faith.  
  2. **Resolve deep value conflicts**: If criteria are opposed (e.g., research vs. teaching), voting amplifies disagreement. The procedure flags this but can’t fix it.  
  3. **Prove optimality**: The winner isn’t "objectively best"—just stable under the rules adopted. The senate may still reject it as "arbitrary" if priorities weren’t debated.  
  4. **Eliminate agenda-setting power**: The chair (you) sets clone-merging and discussion prompts, influencing outcomes. This is unavoidable; document decisions neutrally.  

  **Final Script Snippet**: "No system is perfect—this detects when we agree, when proposals confuse us, or when we’re divided first-principles. If it hands a tough call to the dean or demands discussion, that’s the point: better than a 'clean' vote that hides dissent."  

  Use this verbatim; it fits 40 minutes by automating pairwise math in your spreadsheet (I recommend a pre-built template like [Tideman Ranked Pairs](https://www.preflib.org/tools)). For the senate, focus justification on process transparency: "We confirmed alignment/clone removal, tested pairs, and paused at conflicts."
