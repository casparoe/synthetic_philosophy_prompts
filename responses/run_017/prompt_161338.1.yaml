prompt: |-
  In our constitutional reform group we are drafting a proposal for a second chamber chosen by lot: 300 members drawn from the electoral roll, serving staggered three-year terms with a third replaced each year, supported by a permanent secretariat of officials, and free to decide for itself which government bills it examines. Whenever I press worries about competence or accountability, one member answers with the same move: it is only a jury. We already entrust the gravest decisions about a person — guilt, imprisonment, in some jurisdictions life — to twelve people taken essentially at random, with no mandate, no expertise and no electoral check, and nothing about that seems absurd to us; so, he concludes, the standard objection to sortition collapses, and rotation is all the safeguard against a political class that we need.

  I would like the analogy audited rather than either waved through or waved away. Please give me the correspondence table — what plays the judge, the charge, the evidence, the verdict, the appeal, the twelve — and then the places the mapping fails: juries answer a question someone else has framed for them, are instructed and supervised by professionals, are corrected by higher courts, are deliberately selected for ignorance of the case, and disperse once they have answered; the chamber we are proposing chooses its own business, sits continuously, is stratified so as to mirror the population rather than to be impartial towards a single defendant, and is corrected by nothing but the next draw. Say which of those failures matter for the use he is making of the analogy and which do not, and say plainly what the jury picture is still able to carry — that ordinary people can deliberate competently on a bounded question, that no electoral mandate is required, that no term limit is required — and what it cannot. If a jury is the wrong picture for a standing, agenda-setting chamber, suggest a better one and say what it makes visible that the jury does not. Please answer in British English.
reasoning: |-
  Okay, let me approach this user query methodically. The core request is to audit the "it's only a jury" analogy used in constitutional reform debates about sortition chambers. 

  First, I need to map the jury system components to the proposed second chamber:
  - The judge becomes... nothing equivalent really, since the chamber sets its own agenda
  - The charge is self-defined by the chamber rather than externally framed
  - Evidence gathering lacks professional oversight
  - Verdicts face no appeals process
  - The "twelve" expands to 300 with demographic stratification
  All these mismatches matter because they remove safeguards present in juries.

  The user's colleague is right about three things though: ordinary people can deliberate, mandates aren't essential, and short terms work. But crucially, juries don't govern - they adjudicate bounded questions. That's the analogy's fatal flaw.

  Perhaps a better comparison would be a citizens' assembly - it shows sustained deliberation on policy questions, but still differs by being time-limited and externally framed. Or a "democratic filter" metaphor highlighting continuous refinement of proposals through successive cohorts.

  The user seems frustrated by rhetorical shortcuts in policy debates. They want rigorous analysis, not soundbites. Their mention of "British English" suggests formal documentation purposes. I'll maintain that tone while dismantling the oversimplified analogy.

  Key distinctions to stress:
  - Continuous power vs episodic judgment
  - Agenda control vs framed questions
  - No oversight vs judicial hierarchy
  - Governance vs adjudication

  The reform might still be defensible, but not by false equivalence to juries. That comparison dangerously obscures the chamber's unprecedented nature.
answer: |-
  Below is a systematic audit of the "it's only a jury" analogy in the context of your proposed second chamber, structured as requested. The analogy has merit in challenging elitist assumptions about competence, but it collapses under scrutiny when applied to a permanent, agenda-setting legislative body. I address correspondences, points of failure, the analogy's residual value, and propose a superior alternative.

  ### Correspondence Table: Mapping Jury to Second Chamber
  | **Jury System Element** | **Purported Equivalent in Second Chamber** | **Reality of Correspondence** |
  |-------------------------|-------------------------------------------|-------------------------------|
  | **The Twelve**          | 300 members chosen by lot                 | Partial match: random selection of laypeople. But scale (300 vs. 12) and stratification (mirroring population vs. impartiality) differ. |
  | **The Judge**           | Permanent secretariat? Parliament?        | **No true equivalent.** The judge controls procedure, rules on evidence, and instructs jurors. The secretariat is administrative; Parliament lacks judicial authority over the chamber. |
  | **The Charge**          | Government bills                          | **False equivalence.** Juries answer a specific, externally framed question ("guilty or not?"). The chamber **self-selects** which bills to examine, framing its own questions. |
  | **Evidence**            | Information provided to the chamber       | Partial match: both receive evidence. But juries hear **adversarially tested evidence** under judicial oversight; the chamber has no mandated process or neutral arbiter for evidence quality. |
  | **The Verdict**         | The chamber's decision on bills           | Superficial match: both produce decisions. But a jury verdict is binary (guilty/not guilty); the chamber's decisions are complex, amendatory, and policy-shaping. |
  | **Appeal**              | "Corrected by the next draw"              | **No meaningful equivalent.** Jury verdicts face immediate, structured appellate review. The chamber’s decisions are only "corrected" years later by a new cohort, with no due process. |
  | **Deliberation Time**   | Staggered terms                           | **Contrast.** Juries deliberate intensely for days/weeks then **dissolve**. The chamber deliberates continuously for years, accumulating informal power and institutional memory. |

  ### Critical Points of Failure in the Analogy  
  These failures **undermine the core argument** that juries legitimise an unaccountable, expert-free second chamber:
  1. **Agenda Control & Framing**  
     Juries answer a narrow, judge-defined question. The chamber **sets its own agenda**. This grants it inherent political power unrelated to adjudication, risking arbitrariness or activist overreach without accountability.  
     
  2. **Professional Oversight & Correction**  
     Juries operate under a judge’s guidance and face appellate review. The chamber has **no procedural master or error-correction mechanism**. Mistakes or biases persist until the next cohort, potentially for years.  

  3. **Temporal Nature & Ignorance**  
     Juries are **transient and deliberately ignorant** of the case beforehand to ensure impartiality. The chamber is **continuous and informed**, risking entrenchment of internal factions or exposure to lobbying, undermining the "fresh perspective" argument.  

  4. **Scale and Stratification**  
     Juries seek impartiality via random selection; stratification (e.g., by class, education) is avoided. The chamber **deliberately stratifies** to mirror society, introducing representative claims that juries explicitly reject, yet without electoral accountability.  

  5. **Nature of Decision**  
     Juries apply existing law to facts (retrospective, adjudicative). The chamber shapes future law and policy (prospective, legislative). The latter demands sustained expertise and coherence juries never need.  

  ### What the Jury Analogy **Can** Legitimately Carry  
  The analogy retains value in rebutting three narrow objections:  
  - **Competence:** Ordinary people *can* deliberate complex issues when supported (e.g., evidence, facilitation).  
  - **Electoral Mandate:** Lay decisions *can* be legitimate without a popular vote (e.g., juries, citizens' assemblies).  
  - **Term Length:** Short terms *can* work (e.g., juries serve days; three-year terms are feasible).  

  ### What the Analogy **Cannot** Justify  
  - **Lack of oversight** for open-ended legislative power.  
  - **Self-directed agenda-setting** without constraints.  
  - **Permanent structure** risking institutional capture.  
  - **Accountability vacuum** – juries operate within a rule-of-law framework; the chamber *is* the framework.  

  ### A Better Analogy: The Citizens’ Assembly  
  A **standing, stratified citizens’ assembly** is a closer fit. Like your chamber, it:  
  - Brings together randomly selected citizens.  
  - Deliberates on policy with expert support.  
  - Aims for descriptive representation.  

  **Why it’s superior to the jury analogy:**  
  1. **Makes Visible Deliberative Legitimacy:** Highlights how informed non-experts *can* shape policy through structured discussion.  
  2. **Acknowledges Scope:** Citizens’ assemblies handle complex legislation (e.g., Ireland’s abortion referendum), proving ordinary people can tackle broad questions.  
  3. **Exposes Risks:** Assemblies are typically **time-limited** and **externally framed** (e.g., by parliament). Your chamber’s permanence and self-governance remain anomalous – a "super-assembly" without sunset clauses or mandates.  

  **What this Analogy Reveals the Jury Hides:**  
  - **Trade-offs of Permanence:** A standing assembly could develop expertise but risks bureaucracy or politicisation.  
  - **Need for Framing:** Even citizens’ assemblies don’t *self-direct*; their remit is set externally to ensure focus and relevance.  
  - **Output Legitimacy:** Assemblies derive authority from process rigor, not just participation. Your chamber’s lack of oversight weakens this.  

  ### Conclusion  
  The "only a jury" move is rhetorically potent but analytically shallow. It validly challenges snobbery about lay judgment, yet **fails catastrophically** in equating a supervised, episodic adjudicative body with an unsupervised, perpetual legislative one. The citizens’ assembly analogy better captures the aspirational deliberative potential but underscores the unique risks of your proposal: unlimited agenda power, no error-correction, and no sunset mechanism. If competence is the objection, the jury retort holds; if accountability is the objection – as it should be – the analogy is a red herring. A body shaping the law must be constrained by the law, yet your design lacks such constraints. The remedy isn’t to abandon sortition, but to embed it within a framework that provides judicial-style oversight and defined mandates.
