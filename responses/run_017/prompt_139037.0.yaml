  ### Structural Features
  - **Load-bearing elements**:  
    1. **Frontier slope in normalized space**: When gains are scaled by ideals, the frontier crosses the 45° line steeply (e.g., slope < -1). Nash's product maximizer favors the party with less "sacrifice" along the steeper segment. Here, near $D(12,10)$, normalized slope (Δnorm_union/Δnorm_city) is steep, so Nash favors Union.  
    2. **KS ideal point dependency**: $u$ is set by extreme options. Deleting $B$ lowers city's ideal gain, allowing KS to allocate more to union.  
  - **KS share between Nash shares**: In all cases, KS's common share (e.g., 55.00%) falls between Nash's shares (54.55%, 55.56%).  

  ### Degeneracy with Fungibility
  If cash transfers are allowed, the frontier straightens (e.g., via monetary compensation). Suppose a linear frontier $x_2 = k - mx_1$. Then:  
  - Nash and KS coincide if $d$ and $u$ align with the line.  
  - Disagreement vanishes; arbitrator can achieve any split, making rules indistinguishable.  
  This highlights that the rules' divergence relies on non-transferable issues (job security, automation), common in real disputes.  

  ### Strongest Replies
  - **Nash's weakness (non-monotonicity)**: Adding $E(10,13)$ makes City worse off under Nash.  
    **Steelman for Nash**: Independence of Irrelevant Alternatives (IIA) is normatively appealing. An arbitrator should not alter the chosen outcome due to irrelevant options. Strategic withholding is deterred: neither party can gain by hiding options, as Nash depends only on the selected point.  
  - **KS's weakness (ideal point vulnerability)**: Deleting $B$ harms City under KS.  
    **Steelman for KS**: Monotonicity is fairer. Parties are incentivized to disclose all options, expanding the feasible set and potentially benefiting everyone. Withholding options is risky under KS, as it might lower the ideal point and hurt both.  

  ### Conclusion
  The case satisfies all requirements except a minor shortfall in the menu-shrinking difference (Union's KS share after deletion exceeds Nash by 10.88 ppt, not reversing at 15 ppt). The core divergence arises from frontier curvature and ideal point sensitivity, with strategic implications for arbitration. Use this to debate rule robustness in your workshop.
