  ### The scenario with the numbers

  **Story**: 
  The city and firefighters' union are negotiating to avoid a strike. The strike would cost the city $30 million (in present value) and the union $20 million. The feasible agreements (alternatives to strike) are:

  - **Option A (City's proposal)**: The city gets its way on all issues: no wage increase, no staffing increase, but the city implements equipment modernization. This agreement saves the city from strike costs and the costs of concessions, but the union gets only the equipment (which they value minimally). The city's gain relative to strike: $25 million, union's gain: $1 million.

  - **Option B (Union's proposal)**: The union gets its demands: high wages and staffing, no equipment modernization. This is very costly to the city, so the city's gain is only $1 million (they avoid the worst of the strike but face high costs), and the union gains $20 million.

  - **Option C (Compromise 1)**: Moderate wage increase and staffing, with equipment modernization. City gains $18 million, union gains $5 million.

  - **Option D (Compromise 2)**: The city gets most of what it wants on staffing and wages, but with a small concession to the union. City gains $16 million, union gains $7 million.

  The gains are measured in millions of dollars relative to the strike outcome. The parties can also use a public randomizing device to create any convex combination of these agreements.

  **Non-fungibility constraint**: The issues at stake (wages, staffing levels, equipment) are not fully exchangeable with cash because of political and safety considerations. The city council cannot simply transfer cash to the union in lieu of staffing or equipment, due to statutory constraints and public accountability. Similarly, the union cannot trade off staffing levels for cash beyond what is already in the wage component. This makes the frontier kinked.

  **Attitudes to risk**: Both parties are risk-averse. The city is risk-averse because it must maintain a balanced budget and avoid future fiscal crises. The union is risk-averse because firefighters cannot easily find alternative work and have fixed financial commitments. However, in this bargaining context, we are using monetary gains and assuming that utility is linear in money over the relevant range. (We can adjust later if needed, but for simplicity and to meet the requirement, we assume that the payoffs are in utils and already account for risk. In a more detailed story, we might use a utility function, but the numbers are given.)

