answer: |-
  Here’s the audio drama script structured as requested, designed to spark debate while keeping both views compelling:

  **Setup (98 words)**  
  *Maya (knowledge norm):* Believes you should only assert what you know. Sharp, principled, hates loose talk.  
  *Leo (reliance-responsibility norm):* Thinks assertion is about handing listeners something they can reasonably act on. Pragmatic, context-focused.  
  *Setting:* School band room after philosophy club. Leo unpins a misleading lunch-menu claim from last week’s group chat. Maya calls it irresponsible. Leo argues it was fine *when* pinned. Their debate begins as they pack up microphones.

  ---

  **DIALOGUE (1,240 words)**  

  **Maya:**  
  Leo, you left that "Band Room Pizza Friday" claim pinned all last week. But the cafeteria canceled pizza on Tuesday! People trusted that.  

  **Leo:**  
  When I pinned it Monday, pizza *was* happening. The info was solid. Everyone who packed lunch Tuesday based on it? Totally reasonable.  

  **Maya:**  
  But you didn’t *know* it would stay true. By Wednesday, your pinned claim was a lie. Asserting means putting knowledge out there. You stopped knowing!  

  **Leo:**  
  "Asserting" isn’t some magic spell cast once. Pinning is like… setting up a sign. Tuesday morning, that sign was accurate. Should I camp by my phone 24/7?  

  **Maya:**  
  Yes! If you pin "PIZZA TODAY," it asserts "There’s pizza" *every time* someone sees it. If you don’t know it’s true *when* they see it, you’ve violated the norm. Silence is better than falsehood.  

  **Leo:**  
  So if I forget to unpin for *one day* after learning it’s wrong, I’m a liar? That’s insane. What matters is whether people were *entitled* to rely on it when they acted. Tuesday lunch? Entitled. Thursday? Not.  

  **Maya:**  
  Entitled how? Because *you* felt sure Monday? Knowledge doesn’t work on credit! If I say "I know it’s safe" about a rickety bridge, and you cross it Wednesday after a storm, my Monday "knowledge" doesn’t help you.  

  **Leo:**  
  But the bridge has *changed*. The pizza claim didn’t change the pizza! Context shifted around it. Look, assertion is social. I hand you a tool. If the tool breaks *after* you used it safely, that’s sad, but I wasn’t reckless handing it over.  

  **Maya:**  
  Tools don’t assert! Words commit *you*. If you pin "PIZZA," you’re constantly saying "Trust me, it’s there." When you *knew* it wasn’t true anymore, leaving it up was deception.  

  **Leo:**  
  Or forgetfulness! Your "knowledge norm" makes honest mistakes into sins. What about co-signs? When Priya co-signed my pizza pin Monday, was she asserting "I know Leo is right"?  

  **Maya:**  
  Obviously! She added her name. She vouched for the truth. If she didn’t *know* pizza was happening, she shouldn’t have co-signed.  

  **Leo:**  
  Even if she heard it from the lunch lady? Even if stakes were low? Suppose Priya co-signs my "Mr. Davies is sick" pin. People skip his review session. Turns out he wasn’t sick—just late. High stakes!  

  **Maya:**  
  Exactly! Priya co-signed without knowing. People relied, wasted time. Knowledge norm prevents that.  

  **Leo:**  
  But if Priya *heard* Mr. Davies cough and say "I’m dying," co-signing was responsible *at the time*! The norm shouldn’t punish her for bad luck. It’s about reasonable action *then*, not hindsight.  

  **Maya:**  
  Hindsight? Knowledge is what protects us *from* bad luck! Take lotteries. I have one ticket. I say "My ticket won’t win." Statistically near-certain! Reasonable to act on, right? Bet your life savings?  

  **Leo:**  
  Whoa, stakes! If you’re betting lifesavings, hell no, don’t assert that! But if I’m deciding whether to throw your ticket out? Yeah, reasonable. Stakes change what’s responsible to assert.  

  **Maya:**  
  But you *don’t know* it loses! Probability isn’t knowledge. Under knowledge norm, I must say "It’s extremely unlikely," never "It won’t win." Precision matters.  

  **Leo:**  
  So I can never warn someone about a wobbly bridge unless I’ve *engineered* it? "Careful, I believe it’s unsafe, though epistemic possibility remains it’s fine!" They’ll fall while I hedge! Sometimes "It’s gonna collapse!" is the responsible shout.  

  **Maya:**  
  If you *know* it’s unsafe? Shout! If not, maybe yell "Looks dangerous!" Don’t misrepresent your certainty.  

  **Leo:**  
  But certainty’s rare! Here’s one: You see water spilled in the dark hall. You shout "The floor’s wet!" before someone slips. You didn’t *know*—maybe it’s shadow! But not shouting would be irresponsible. My norm wins.  

  **Maya:**  
  ...Fair. Urgency can force reasonable assertion without perfect knowledge. But! High-stakes case: I tell a friend "I *know* this herbal tea cures headaches" based on a meme. She skips real meds, gets worse.  

  **Leo:**  
  Ouch. You weren’t responsible. You lacked expertise, stakes were high. My norm condemns that.  

  **Maya:**  
  But *you* focus on her reliance. What if she foolishly trusted me? Your norm might excuse me! Knowledge norm blames me directly: I asserted knowledge I didn’t have.  

  **Leo:**  
  Hmm. Maybe both norms blame you here? But okay, point taken. Sometimes speaker’s knowledge matters independently.  

  **Maya:**  
  And sometimes your reliance view is more humane. Like the pizza pin. Maybe forgetting to unpin isn’t *as* bad as lying… if stakes were low.  

  **Leo:**  
  Progress! So for pinned claims… if it’s high-stakes (like "Review Session Canceled"), you *must* monitor it. Knowledge evaporates fast. Low-stakes ("Pizza Friday")? Less vigilance, but still, unpin when you learn it’s wrong.  

  **Maya:**  
  But the *act* of pinning still requires *initial* knowledge! Co-signing too. Priya shouldn’t co-sign "Mr. Davies is sick" without verifying.  

  **Leo:**  
  Agreed… mostly. But what if Priya co-signs *my* claim because *I’m* usually right? She’s signaling reliability, not raw knowledge.  

  **Maya:**  
  Then it’s *her* assertion about *my* reliability! She needs to know *that*!  

  **Leo:**  
  (Sighs) Back to square one. Let’s just eat pizza that may or may not exist.  

  ---

  **CONCESSIONS (198 words)**  
  *Maya conceded:* The reliance view better handles urgent, low-stakes warnings where perfect knowledge is impossible (e.g., shouting about a potential hazard). She acknowledges that context (like stakes) affects how *irresponsible* a false assertion is, even if it doesn’t change whether it violated the knowledge norm. For pinned claims, she accepts that forgetting to unpin a low-stakes claim isn’t morally equivalent to intentional deception.  

  *Leo conceded:* The knowledge norm offers a clearer, more objective standard in high-stakes situations (e.g., medical advice). He agrees that assertions about *one’s own certainty* ("I know...") carry special weight and that co-signing involves asserting *something* about the original claim’s reliability, requiring justification. He accepts that speaker-side factors (like expertise) matter independently of listener reliance.  

  *Where they still clash:*  
  1.  **Is assertion’s core duty about the speaker’s mind (knowledge) or the listener’s action (reliance)?** Maya sees knowledge as the safeguard; Leo sees responsible facilitation as the goal.  
  2.  **For pinned/co-signed claims:** Maya insists the initial act requires knowledge and co-signing asserts truth. Leo sees pinning as creating a context-dependent resource and co-signing as boosting reliability signals, not necessarily asserting identical content.  

  ---

  **SCOREBOARD (247 words)**  

  1.  **The Pinned Claim (Pizza Friday):**  
      *   *Knowledge Norm:* Assertion happens each time it’s seen. Maya wins on days 3-7 after cancellation – Leo falsely asserted. Draw on initial pin: knowledge existed.  
      *   *Reliance Norm:* Leo wins for Tuesday lunch (reasonable reliance). Maya wins for Thursday (unreasonable due to changed context/stakes).  
      *   **Verdict:** Draw. Highlights the core conflict: Is assertion tied to the moment of speaking or the moment of hearing?  

  2.  **Co-signing (Priya on "Mr. Davies is Sick"):**  
      *   *Knowledge Norm:* Priya asserted "Mr. Davies is sick." If she didn’t know, she violated the norm. Clean win for Maya.  
      *   *Reliance Norm:* Priya signaled the claim was reliable *enough* for its context. If context changed (high stakes), she *might* be irresponsible. Win for Leo on low-stakes, Maya on high-stakes.  
      *   **Verdict:** Slight edge to Knowledge Norm (clearer violation).  

  3.  **Lottery Ticket ("It won't win"):**  
      *   *Knowledge Norm:* Can't assert loss without knowledge. Clean win for Maya.  
      *   *Reliance Norm:* Assertion can be responsible if stakes are low (e.g., throwing ticket away). Win for Leo.  
      *   **Verdict:** Draw. Pure demonstration of their difference.  

  4.  **Extra Cases:**  
      *   *Urgent Warning (Spilled Water, Low Stakes):* "Shout 'Floor's wet!' without absolute knowledge." **Win for Leo (Reliance).** Knowledge norm looks too strict.  
      *   *False Expertise (Herbal Tea, High Stakes):* "I know this cures headaches!" without knowledge. **Win for Maya (Knowledge).** Reliance norm risks being too loose if listener's trust is misplaced.  

  ---

  **LOOSE ENDS (148 words)**  
  The dialogue leaves two main questions unresolved:  

  1.  **What *is* a digital act like pinning or co-signing?** Is it one assertion, many, or a new kind of speech act? This is crucial for applying either norm consistently.  
  2.  **How do we weigh speaker capability vs. listener need?** When is it fair to demand perfect knowledge (Maya), and when does context *oblige* us to assert based on reasonable belief for others' sake (Leo)?  

  **Build Part Two Around:** **The co-signing case.** It’s the messiest and most relevant to digital life.  
  *   Focus: Is co-signing an assertion of truth ("I know this"), an endorsement of reliability ("Leo is usually right"), or a promise ("I’ll back this up")?  
  *   Conflict Point: Have Priya co-sign a claim from Maya (high-knowledge stickler) that turns out wrong despite Priya’s own reasonable checks. Does Maya blame Priya (violated knowledge norm by vouching without *her own* direct knowledge)? Or does Leo defend Priya (her reliance on Maya *was* responsible)? This pits their core principles against each other within the group's dynamic.
