prompt: |-
  You are a professional philosopher with a research specialization in decision theory and rational choice under severe uncertainty — someone who has actually worked through the arguments about tiny probabilities of enormous payoffs, Archimedean axioms, and unbounded value scales, and who can say plainly which moves in that literature are load-bearing and which are rhetorical. Take your time with this: before you write anything final, spend a couple of paragraphs brainstorming the full space of things the slogan below might be asserting, including readings that strike you as silly or obviously false, and only then commit to a curated list. Don't hedge everything into mush; where you think a reading is false or question-begging, say so. You don't need citations, bibliographies, or further reading — I want the argument, not the sources.

  Here is my situation. I'm a novelist, and I keep rewriting one scene. My protagonist is a senior program officer at a large fictional foundation. She has just refused to move money out of a well-measured, reliable intervention — say, a distribution program with a solidly estimated, modest, per-dollar payoff — and into a research program that her staff estimates has something like a one-in-ten-thousand chance of averting a civilization-scale catastrophe, and that otherwise accomplishes nothing at all. Her colleague, who is not a villain and is not meant to be a fool, ends the argument with the four-word line "shut up and multiply": stop arguing from intuition, do the arithmetic, a small probability times an enormous payoff still beats a certain modest one.

  I don't want that exchange to be a straw man in either direction. So I need to know what the line could actually be asserting.

  Please lay out, as a numbered menu from the near-trivial to the radical, the distinct precise theses "shut up and multiply" could be expressing in that exchange. For each reading, give me four things: (1) the claim stated precisely enough that two people could genuinely argue about whether it is true; (2) your verdict on it — a platitude almost everyone accepts, a substantive but defensible thesis, a substantive and contested one, something false, or something merely verbal; (3) whether that reading, if granted, would actually do the work my character needs it to do, which is to end the argument rather than continue it; and (4) the strongest two-sentence reply my protagonist could give without sounding like a crank.

  In building the menu, I'd like you to separate at least the following commitments, because it seems to me they are doing very different amounts of work and the slogan collapses them:

  - the aggregation claim: that value combines across outcomes by something like addition, so that multiplying a probability by a payoff is the right operation in the first place;
  - the continuity or Archimedean claim: that there is no threshold below which a positive probability becomes negligible, so that any nonzero chance of a large enough payoff beats any sure thing;
  - the unboundedness claim: that the value scale has no ceiling, so that a payoff can be arbitrarily — not just very — large relative to a sure modest gain;
  - the hegemony claim: that expected value is not merely one consideration but the whole of practical rationality, or at least the tiebreaker that settles every case;
  - the psychological or anti-narrative claim: that the line is really about cognition — that vividness, dread, and satisfaction at having helped someone identifiable distort intuition, and that arithmetic is a corrective to those distortions.

  Alongside these, please distinguish axiological fanaticism from decision-theoretic fanaticism — whether the vast payoff dominates the ranking of outcomes versus dominating the choice — and say whether the slogan is being applied to a single one-off decision or to a budget spread across many decisions over time, since I take it there is a real tension between what I've been calling the fanaticism tax (money in the lottery ticket is money out of the reliable program, and there is only so much money) and what I've been calling the portfolio defense (if you face many independent long shots, the long-shot-heavy portfolio can dominate even where any single long shot looks wasteful).

  There is one distinction of my own that I want you to pressure-test rather than flatter. I've been separating clean long shots, where the tiny probability comes from a calibrated, repeated, checkable process — an actuarial table, a physical randomization device, a base rate with a track record — from muddy long shots, where the number comes from an unstructured one-off judgment about a unique historical possibility, produced by people with no relevant track record and nothing to check it against. My suspicion is that the case for "shut up and multiply" is strong in the clean case and much weaker in the muddy one, because in the muddy case the probability estimate carries a multiplicative error of unknown and possibly enormous size, and there is no track record that would reveal it, so the product is not a number one can lean on. Tell me whether that is right. And then tell me whether the same worry cuts against the reliable intervention too — its payoff estimate is uncertain as well, though perhaps bounded in a way the catastrophe payoff is not — and whether the fanatic has a good reply available: that errors on a log scale are roughly symmetric, that errors across many independent shots partly cancel, that the real asymmetry is about which quantity has the heavier tail, or something better than any of these.

  Finally, two things I need for the scene itself. First: which reading is my colleague's character most plausibly invoking, given that the line was used to close the argument rather than open it? Second: is there a reading on which the slogan is self-undermining or begs the question against my protagonist — a reading on which "just do the arithmetic" quietly presupposes the very axiom she is disputing, or on which the arithmetic cannot be completed with the inputs actually available, so that the instruction cannot be obeyed by anyone in the room? I need at least one reading she can concede while still refusing to move the money, and at least one reading she cannot concede without changing her mind. If the honest verdict is that on the strongest reading she simply has to cave, say that plainly; I would rather rewrite the scene around it than win it dishonestly.

  Keep the whole answer under about 1,200 words if you can manage it without flattening anything, and write it in American English.
