  ## Form IC-4: Declaration of Conversational Implicature
  **Issued by:** Bureau of Utterer’s Meaning (BUM), Department of Cooperative Compliance  
  **Effective:** Perpetually, pending ratification of mutual understanding  
  **Purpose:** To assess and remit liability for Grice Gap® surplus meaning (hereafter "Implicature") arising from verbal exchanges under 26 U.S.C. § Cooperative Principle.  

  ---

  ### INSTRUCTIONS (PUB. Grice-1GAP)
  **Who Must File:** Any participant in a conversational exchange (Speaker/Hearer, jointly liable) where preliminary BUM audit suggests Grice Gap® exceeds 0.5 Standard Implicature Units (SIUs). Failure to file may result in penalties including Mandatory Redundancy, Retroactive Explicature, or Conversational Voidance.  
  **When to File:** Within 45 days of utterance or upon reasonable suspicion of unassessed implicature (whichever induces greater anxiety).  
  **Penalty of Perjury:** Signing affirms your reflexive intention at time of utterance. Falsification constitutes a violation of the Maxim of Quality.  

  ---

  ### SECTION 1: UTTERANCE PARTICULARS
  1.  **Utterance Text:** _________________________________________________________  
      *(Transcribe verbatim. Paraphrases invalidate filing under Non-Detachment Provision IC-4.11(b).)*  
  2.  **Contextual Coordinates (Form IC-4/CX Attached?)** ☐ Yes ☐ No  
      *(If "No," Implicature calculation defaults to Generalized Flat Rate + 20% negligence surcharge.)*  
  3.  **Grice Gap® Estimate (SIUs):** _________  
      *(BUM Auditor Note:* ⚠️ *Estimate required even if indeterminable. See Worksheet IC-4/W1 for estimation methodologies involving reasonable hearers.)*  

  ---

  ### SECTION 2: IMPLICATURE CLASSIFICATION (CHECK ONE)
  ☐ **A. Particularized Implicature (PI)**  
      *Requires context-specific exploitation. Attach Narrative Explanation (Form IC-4/NE) and Implicature Calculation Worksheet (IC-4/CALC).*  
  ☐ **B. Generalized Implicature (GI)**  
      *Pre-printed, context-independent. Select from Schedule G below. Flat Rate applies.*  
  ☐ **C. Conventional Implicature (CI)**  
      *STOP. DO NOT PROCEED. "But," "therefore," "even," etc., are NOT BUM JURISDICTION. Refer to Office of Lexical Content (OLC), Form LC-7. Stamped denials incur $45 reprocessing fee.*  

  **SCHEDULE G (Generalized Implicatures - Select One):**  
  ☐ G1. Speaker implies they lack sufficient evidence (e.g., "I think...") | **Flat Rate: 1.2 SIU**  
  ☐ G2. Speaker implies generic negative evaluation (e.g., "He's punctual.") | **Flat Rate: 1.5 SIU**  
  ☐ G3. Speaker implies potential non-cooperation (e.g., "Well...") | **Flat Rate: 0.8 SIU**  
  ☐ G4. Other (Specify: _______________) | **Flat Rate: 1.0 SIU**  

  ---

  ### SECTION 3: MAXIM EXPLOITATION DECLARATION
  Indicate which Cooperative Principle Maxim(s) were exploited to generate the Grice Gap®. Specify Exploitation Method for EACH checked maxim. *(BUM Advisory: Incorrect classification voids filing. Overlap likely.)*  

  | Maxim          | Exploited? (☐) | Exploitation Method (Select ONE per maxim)                                                                 |
  | :------------- | :------------- | :--------------------------------------------------------------------------------------------------------- |
  | **Quantity**   | ☐              | ☐ Flouting (Conspicuously Over/Under) ☐ Violating (Covert Breach) ☐ Infringing (Inability) ☐ Opting Out (Explicit) |
  | **Quality**    | ☐              | ☐ Flouting (Irony, Metaphor) ☐ Violating (Lie) ☐ Infringing (Mistake) ☐ Opting Out (Unavailable)           |
  | **Relation**   | ☐              | ☐ Flouting (Obvious Irrelevance) ☐ Violating (Deceptive Shift) ☐ Infringing (Tangential) ☐ Opting Out ("No comment.") |
  | **Manner**     | ☐              | ☐ Flouting (Obscurity/Ambiguity) ☐ Violating (Purposeful Vagueness) ☐ Infringing (Unintended) ☐ Opting Out ("I can't phrase it.") |

  **WARNING (Opt-Out Trap IC-4.3f):** Declaring "Opting Out" on this form constitutes a cooperative contribution to the exchange, thereby generating a *new* Grice Gap® re: your unwillingness to cooperate. File Form IC-4/OO concurrently to address this secondary implicature. *(See Constructive Cooperation Doctrine.)*  

  ---

  ### SECTION 4: CANCELLATION & RIDER (Form IC-4/CR)
  ☐ **Check if implicature was cancelled during original exchange.**  
      *(Attach transcript or affidavit proving contemporaneous cancellation. Retroactive cancellation claims filed with this form are VOID under the "Post-Utterance Rider Rule" (IC-4.7a). Late filers paradoxically demonstrate honesty through tardiness but forfeit cancellation rights.)*  

  ---

  ### SECTION 5: SIGNATURE & DECLARATION
  **12. Speaker's Attestation:** By signing below, I affirm under penalty of perjury that the Grice Gap® declared above accurately reflects the surplus meaning I *intended the hearer to recognize as intended* at the moment of utterance.  
  **Signature:** _________________________ **Date:** ________  

  **13. Hearer's Concurrence (Optional but Recommended):**  
  *I acknowledge the implicature declared above aligns with my inference.*  
  **Signature:** _________________________ **Date:** ________  

  ***(BUM Auditor Marginalia on Draft Form):*** *"Block 12 is problematic. Signing asserts the reflexive intention *now*, but the form demands attestation to the intention *then*. Worse, the act of signing *itself* is a new utterance with its own implicature about compliance. The intention we need documented is the very thing the signature block blocks. Circular. Infuriating. Suggest stamp: 'INTENTION DEFERRED PENDING FURTHER CONTEXT'?"*  

  ---

  ### WORKSHEET IC-4/CALC (EXAMPLE - Particularized Implicature)
  **Utterance:** "The coffee here is hot."  
  **Context:** Job interview, asked "How do you like the office?"  
  **Declared Implicature (PI):** Speaker implies significant discomfort with the work environment.  
  **Calculation:**  
  1.  Literal Proposition: Coffee has high temperature.  
  2.  Maxim Exploited: Relation (☑ Flouting - Response irrelevant to question re: office).  
  3.  Inference Trigger: Relevance expected; irrelevance prompts search for connection.  
  4.  Contextual Premise: Office coffee is notorious; comment is indirect criticism.  
  5.  Calculated Grice Gap®: 2.5 SIU (Moderate Surplus)  
  **Grice Gap® Liability:** 2.5 SIU x $50 (Current SIU Rate) = **$125.00**  

  ---

  ### AUDIT TRAIL NOTES
  *   **Taxpayer Complaint (Ref # IC4-8892):** "I followed the rules! I only said 'yes' when asked if I finished the report, meaning literally affirmative. They inferred I did it poorly! Why am I liable for *their* inference?!" *BUM Ruling:* Literal truth insufficient. Maxim of Quantity exploited (Violation? Infringement? - Disputed). Implicature of poor quality upheld (1.8 SIU). Penalty assessed.
  *   **External Memo (Institute for Strict Semantics):** "This entire Bureau is a category error! Implicature is not truth-conditional content! It's pragmatics, not semantics! Your 'Grice Gap®' is an emergent property of use, not a taxable utterance component. *You have no jurisdiction here.*" *BUM Stamp:* "NOTED. REFERRED TO OFFICE OF PRAGMATIC OVERREACH (OPO)."

  ---

  **REMITTANCE DUE:** _________ SIU x $50 = $_________  
  **Make check payable to:** U.S. Treasury (Bureau of Utterer's Meaning)  
  **Form Destroyed Upon Processing?** ☐ Yes *(Per IC-4.9: Written declaration converts implicature into explicature, nullifying the original Gap and rendering this form self-cancelling. Paradox resolved.)*  

  **BUM USE ONLY**  
  Auditor 1 SIU Assessment: ______ | Auditor 2 SIU Assessment: ______ | Variance: ______ *(Standard Indeterminacy Allowance Applied)* | Final Liability: ______
