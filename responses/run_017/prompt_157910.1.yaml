answer: |-
  Here are eight tightly focused questions designed to pressure-test the normative power account, each with a specific scenario and a follow-up anticipating Dr. Adeyemi's likely "utility vs. obligation" deflection. They build in intensity, targeting core commitments of his view:

  1.  **The Gratuitous Promise:** "Dr. Adeyemi, imagine I promise my neighbour I'll wear a blue shirt tomorrow – something I was absolutely going to do anyway, and which she genuinely doesn't care about at all. I then wear a red shirt. On your view, is this wrong? If so, what *is* the wrong here, given there's no disappointed expectation, no reliance, and no discernible impact on the social practice?"  
      *   **Likely Reply & Follow-Up:** (If he emphasizes "giving your word" or creating an obligation *simpliciter*) - "Okay, so the wrong lies solely in violating the obligation created by the performative act itself? But doesn't this risk making the obligation seem like a kind of *free-floating fetish* – disconnected from the interests, expectations, or even awareness of the promisee? What *substance* does the obligation have if its breach harms no one and frustrates no interest?"

  2.  **The Forgotten Promise & Self-Release:** "Consider a promise where the promisee has completely forgotten it was ever made – no lingering expectation, no reliance. Does my obligation to perform persist? Crucially, if the normative power *only* the promisee holds is the power to release me, but she has forgotten the promise *exists*, am I then perpetually bound? Can I ever release *myself* in this scenario, or am I stuck?"  
      *   **Likely Reply & Follow-Up:** (If he insists the duty persists until release) - "If the promisee's forgetfulness renders her incapable of exercising her normative power of release, doesn't this trap the promisor in an obligation potentially forever, purely due to the promisee's cognitive state? Doesn't that seem absurd, and doesn't it suggest the *directed* nature of the duty (its dependence on the promisee's normative power) creates a problematic vulnerability to factors outside the promisor's control? Alternatively, if I *can* release myself, how does that square with the promisee holding the exclusive normative power over this obligation?"

  3.  **Joint Promise & Partial Release:** "I promise both Alice and Bob that I'll host a dinner party next Saturday. On Wednesday, Alice explicitly releases me from my promise to *her*. Bob does not and still expects the party. What's my obligation now? Am I still fully obligated to Bob? Obligated only to Bob? Or is the original obligation somehow halved or extinguished?"  
      *   **Likely Reply & Follow-Up:** (Likely: Obligation to Bob remains intact) - "Interesting. So releasing one promisee from a *joint* promise doesn't diminish the directed duty to the other? This suggests the obligation isn't a single, divisible thing owed to the pair, but rather two distinct obligations created simultaneously. Does this mean *every* joint promise is fundamentally a set of individual promises bundled together? What does this tell us about the *unit* of normative change – is it always a directed duty owed to a *single* individual, even in group contexts?"

  4.  **The Immoral Promise & Pro Tano Weight:** "Suppose I promise a friend, under no duress, to vandalize a rival's property – a mildly bad act, but not catastrophic. On your view, does the exercise of my normative power actually *create* a genuine moral obligation for me to commit this wrongful act?"  
      *   **Likely Reply & Follow-Up:** (Likely: It creates a pro tanto obligation, but outweighed by the wrongness) - "I understand the pro tanto point. But to demonstrate the *real normative work* this power does, can you give me a concrete example where the obligation generated by a promise *genuinely changes what I have most reason to do all-things-considered*? That is, where the promise itself is the decisive factor tipping the scales towards performing an action I otherwise wouldn't have had sufficient reason to perform? If the promissory obligation is always swamped by other moral reasons in cases of wrongdoing, doesn't its purported normative force start to look epiphenomenal in precisely the situations where its existence should be most stark?"

  5.  **Promises to Non-Standard Promisees (Capacity):** "Can I make a binding promise to my two-year-old nephew to take him to the zoo next week? What about to someone with late-stage dementia, who cannot comprehend promises, remember them, or understand release? Does your account require the promisee to have certain cognitive capacities to 'receive' this normative change?"  
      *   **Likely Reply & Follow-Up:** (Likely: Yes, or it hinges on the promisor's intention/understanding) - "If the capacity of the promisee *is* crucial, doesn't this reintroduce a reliance-like element – the *potential* for expectation or understanding? If it hinges solely on *my* intention as promisor, what prevents me from 'promising' to a rock and thereby creating a bizarre, undischargeable obligation? Where is the line drawn, and is it based purely on the promisee's status (e.g., 'personhood') rather than their capacity to engage with the norm?"

  6.  **Promises to the Dead:** "Following on, if I promise my dying mother to look after her rose garden, and she passes away, do I still have an obligation *to her*? If so, how is this obligation directed, given she no longer exists as an agent capable of holding claims or releasing me? Can this obligation be discharged or overridden?"  
      *   **Likely Reply & Follow-Up:** (Likely: The obligation persists, perhaps directed to her 'memory' or as a duty of fidelity) - "If the obligation persists *to her*, how does this square with the Hohfeldian correlative – does a dead person hold a claim-right? If it's transformed into a different kind of duty (e.g., fidelity, honoring memory), doesn't this mean the *specific normative power* exercised in promising (changing what I owe *to that person*) ceases to function upon death, replaced by a different normative structure? Doesn't this undermine the claim that promising creates a unique, persistent directed duty?"

  7.  **The Overhearer & Standing:** "I promise Alice I'll help her move on Saturday. Bob overhears this promise, reasonably assumes I'm reliable, and makes plans that depend on me *also* being free to help *him* that afternoon. I help Alice but don't show for Bob. Bob is harmed and complains. Does Bob have any *moral standing* to complain about my breaking the promise *I made to Alice*?"  
      *   **Likely Reply & Follow-Up:** (Likely: No, only Alice has standing; Bob's issue is reliance/harm, not promise-breaking) - "I agree Alice has unique standing regarding *that* promise. But doesn't Bob's situation reveal a potential *gap* in the normative power account? While it explains Alice's distinctive complaint, it seems silent on the genuine moral wrong done to Bob – a wrong arising precisely *because* of the social meaning of promising that others rely upon, even if not the direct promisee. If the normative power view can't capture why Bob is *more* wronged than if I'd just casually said 'I might be free' (even if he relied similarly), does it offer a complete picture of promising's moral significance?"

  8.  **Duress by Third Party:** "I'm threatened by a criminal (not the promisee) into promising my colleague, David, that I'll deliver a package. David is innocent and unaware of the threat. Is this promise binding on me? Is it void (never existed), voidable (I can annul it), or binding until David releases me?"  
      *   **Likely Reply & Follow-Up:** (Likely: Void or voidable, focusing on the promisor's defective will) - "If it's voidable, *who* has the power to void it? Do *I* have the power to unilaterally annul the normative change I supposedly enacted towards David, due to the third party's coercion? If so, how does this self-annulment power fit with the promisee (David) supposedly holding the normative power over the obligation? Does David's innocence play any role, or is it purely about the defect in my consent?"

  9.  **Falsifiability & "Reliance-Thinking":** "Finally, Dr. Adeyemi, to help clarify the core of your view: What kind of empirical observation or philosophical argument *would* genuinely count as evidence *against* the normative power account of promising? Specifically, if someone presented a case seeming to show promise obligations dissolving without release when reliance/expectation/harm are absent, and you countered 'That's just reliance-thinking,' what alternative explanation *couldn't* you dismiss in that way? What would force a concession?"  
      *   **Likely Reply & Follow-Up:** (If he struggles or gives a vague/deflective answer) - "Let me press that, because it's crucial. If *every* intuition about an obligation disappearing in the absence of reliance/expectation/harm can be dismissed as 'reliance-thinking in disguise,' doesn't that risk making the normative power account unfalsifiable? Doesn't a robust theory need to specify what phenomena it *wouldn't* predict or accommodate? For instance, if we found a society with a practice linguistically identical to promising but where obligations *were* universally understood to lapse upon proven non-reliance by the promisee, would that challenge your view, or would you still say 'That's not *real* promising'? Where's the potential point of contact with counter-evidence?"

  **Key Strategic Elements:**

  *   **Sequencing:** Starts with intuitively puzzling cases (Gratuitous/Forgotten) to unsettle intuition, moves to structural challenges (Joint/Immoral/Non-Standard/Dead), then social practice challenges (Overhearer/Duress), ending with the meta-falsifiability question.
  *   **Precision:** Each scenario isolates a specific pressure point for the normative power account (directedness, persistence, content-independence, promisee capacity, exclusivity of standing, voluntariness).
  *   **Anticipation:** Follow-ups directly target his predicted "utility/reliance vs. obligation" move by forcing him to explain the *substance* and *mechanics* of the obligation itself within his framework.
  *   **Forcing Concessions/Clarity:** Aims to expose potential absurdities (perpetual obligation, obligations to the dead/incompetent), contradictions (self-release vs. directed duty), or explanatory gaps (overhearer harm, pro tanto impotence).
  *   **"Bare Wrong" Focus:** Relentlessly asks: "What *is* the wrong if not X, Y, or Z?" forcing him to articulate the positive content of the "bare" obligation.
  *   **Falsifiability Trap:** The final question is designed to prevent retreat into perpetual deflection and force engagement with what could genuinely undermine the view.

  These questions should provide a rigorous and engaging challenge, pushing beyond his standard response and deeply probing the foundations of the normative-power account. Good luck with the interview!
