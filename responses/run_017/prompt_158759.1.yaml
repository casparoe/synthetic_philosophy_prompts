  Okay, I need to help this user who runs a volunteer listening hour at a care home. They're struggling with an ethical dilemma about playing music by artists with abuse allegations. Let me start by understanding their situation.

  The user stopped playing a singer's music after a documentary exposed his abuse. Residents, mostly in their 80s, loved his music and want it back. The user replaced him with another artist who had past allegations but kept that one in rotation. Both decisions felt right, but the user can't explain why. They mention that playing a clip from the documentary didn't bother anyone, but playing the song normally did. The difference seems to be the context—being addressed by the artist personally versus hearing it as evidence.

  The user identifies a pattern: it's not about the severity of the acts or the content of the work. Tender songs are dropped as easily as violent ones. It's about whether the work requires extending interpersonal warmth to the artist. Intimate, confessional, or charismatic works feel problematic, while abstract or ensemble works don't. It's not consequentialist (no money involved, artist dead) and not about judging the art's quality.

  The user wants to know if there's a philosophical concept for this. They've considered and rejected three views: ethical flaws affecting artistic value, complicity/boycott arguments, and genetic fallacy. They need something that fits their specific case—where the moral history affects the interpersonal stance, not the work's value or consequences.

  First, I should recall relevant philosophical frameworks. Berys Gaut's ethicism and autonomism come to mind, but they focus on whether ethical flaws diminish aesthetic value. That doesn't fit here since the user isn't claiming the art is worse. Then there's the boycott argument, which is consequentialist—about not supporting the artist financially. But the user's case has no financial impact. The genetic fallacy is about inferring quality from origins, which the user avoids.

  The concept of "immoralism" by someone like Daniel Jacobson might be closer, but it's more about appreciating immoral perspectives, not interpersonal dynamics. The user's issue is about the relationship formed through the artwork. So maybe the idea of "artist-listener relationship" or "parasocial interaction" is key. When the artist's persona is integral, knowing their moral failings poisons that relationship. Abstract works don't require that personal connection, so they're unaffected.

  Aaron Smuts' work on the ethical criticism of art distinguishes between intrinsic ethical flaws and extrinsic factors like the artist's biography. The user's case seems extrinsic but not affecting aesthetic judgment. Noël Carroll's "Moderate Moralism" might touch on this, but it's still about the work's moral perspective influencing aesthetic value.

  The user’s examples need addressing: a character's warmth vs. performer's, documentary context, unknown wrongdoing, anonymous artist, collaborative works. For instance, if the warmth belongs to a character, the personal connection might not form, so it could be acceptable. Documentary use distances the work from the artist's address. Anonymous artists don't create that parasocial bond. Collaborative works might diffuse the interpersonal aspect.

  Confidence-wise, the interpersonal stance concept isn't a standard term in philosophy. It's more of a synthesis of ideas from aesthetic interaction and moral psychology. The user's pattern aligns with how audiences react when an artist's persona is central. If the allegations were trivial or unproven, the user might still play the music, showing it's about the perceived moral breach affecting the relationship.

  Alternative explanations? Maybe it's emotional discomfort rather than an ethical stance. But the user emphasizes it's about not wanting to be on warm terms with the artist, which is interpersonal. Or perhaps cognitive dissonance, but the user's distinction between personal vs. impersonal works suggests a deeper principle. The key is whether the work invites a personal rapport. If that's absent, the moral history doesn't interfere.

  In conclusion, the closest framework is the artist-listener relationship. The user's approach is consistent when the work's appreciation depends on extending personal regard to the creator. This explains why the documentary clip was acceptable (it's evidence, not address) and why ensemble works are fine (no single persona). The term "interpersonal uptake ethics" could be coined here, defined as the moral permissibility of accepting the interpersonal stance invited by a work, based on the creator's moral history.
answer: |-
  Your situation reveals a nuanced ethical-aesthetic distinction that isn't perfectly captured by standard frameworks, but it maps closely to **"Interpersonal Uptake Ethics"**—a concept I'll define by synthesizing established ideas and adapting them to your boundary cases. Below is a structured analysis, with sources, confidence levels, and alternative interpretations flagged.

  ### Core Concept: Interpersonal Uptake Ethics
  **Definition:**  
  The ethical permissibility of accepting the *interpersonal stance* (e.g., trust, intimacy, solidarity) invited by a work, based on the artist’s moral history, independent of:  
  (a) the work’s aesthetic quality,  
  (b) consequentialist considerations (money/signaling),  
  (c) whether the work’s content reflects the artist’s flaws.  

  **Key Philosophers & Connections:**  
  1. **Berys Gaut’s "Ethicism"** (artistic value diminished by ethical flaws) and **"Autonomism"** (art separate from ethics) are rejected by you—and rightly so, as your cases explicitly avoid aesthetic judgments.  
  2. **Noël Carroll’s "Moderate Moralism"** (ethical flaws *can* affect artistic value) also misfires—you deny the work is "worse."  
  3. **Paisley Livingston** on **"Achievement Value"** (artistic merit depends partly on the artist’s agency) gets closer but still ties to aesthetic evaluation.  
  4. **Aaron Smuts** (on the *irrelevance* of biography) opposes your intuition but highlights your uniqueness: you’re isolating the *relational* dimension Smuts dismisses.  

  **Your innovation:** You decouple the *interpersonal dynamic* from aesthetic judgment. This aligns with:  
  - **"Parasocial Interaction"** (Horton & Wohl, 1956): Audiences form one-sided relationships with media figures. When an artist’s misconduct breaches trust, it poisons the parasocial bond required to "accept" their intimate address.  
  - **Martha Nussbaum’s** work on **"Objectification"**: Listening feels like complicity in granting moral standing to a harmful person, even absent consequences.  

  ### Boundary Cases Classified  
  Using your framework, the permissibility hinges on **whether the work demands *personal* uptake of the artist-as-agent**:  

  | **Case**                     | **Interpersonal Uptake?** | **Verdict**                | **Why**                                                                 |
  |------------------------------|----------------------------|----------------------------|-------------------------------------------------------------------------|
  | Character warmth (e.g., actor in role) | Minimal                   | Likely kept             | The "address" comes from the fiction, not the artist’s persona.         |
  | Documentary evidence          | None                       | Kept                    | Context frames the work as artifact, not personal address.              |
  | Artist unknown to listener    | Blocked                    | Kept                    | No artist-as-person to extend warmth toward; only abstract sound exists.|
  | Collaborative work (ensemble) | Distributed                | Likely kept             | Invitation comes from a group, diluting individual responsibility.      |
  | Wrongdoer died pre-revelation | Intact but retroactively voided | Dropped              | The *listener’s* act of extending trust *now* feels compromised.       |

  ### Confidence & Adjustments  
  - **High Confidence**: Your rejection of consequentialism/genetic fallacy is philosophically sound. The pattern is *not* reducible to boycott or quality arguments.  
  - **Medium Confidence**: The "interpersonal uptake" framework fits your cases better than existing theories. Parasocial theory (from psychology) supports this.  
  - **Low Confidence**: "Interpersonal Uptake Ethics" as a *term* is my coinage—philosophy lacks a direct label. The closest established concept is **"Affective Complicity"** (Michel-Antoine Xhignesse), but it’s emergent and untested here.  

  ### Why Your Friends’ Critiques Miss  
  - **"Not funding a living perpetrator"**: Fails because:  
    - Your dropped artist is dead; no money changes hands.  
    - You kept a *living* bandleader with allegations.  
  - **"Guilt by association"**: Fails because:  
    - Association implies indirect blame. You’re rejecting a *direct relational act* (extending trust), not imputing guilt to the work.  

  ### What Would Change My Verdict  
  1. **If uptake isn’t the core variable**: If you found identical "intimate" works by moral vs. immoral artists *equally playable* when anonymized, this would collapse into aesthetic autonomy.  
  2. **If consequences resurface**: If residents felt *personally harmed* by the music (not discomfort), it becomes a harm-based ethics issue.  
  3. **Two phenomena conflated?** Possibly, but your examples suggest unity: the documentary clip *lacks* interpersonal context, so it’s "safe"; the ensemble band *diffuses* it.  

  ### Conclusion  
  Your intuition exposes a gap in art ethics: the **morality of relational acceptance** in aesthetic encounters. It’s nearest to **parasocial ethics** (not formalized in philosophy) but distinct from artistic-value debates. When art functions as a "friend," its maker’s character corrupts the friendship—even if the art remains "good." This explains why your residents reject the singer’s voice *as address* but accept it *as evidence*.  

  **Adjustment to your description**: Specify that the "interpersonal stance" must be *invited by the work’s mode of engagement* (e.g., crooning implies intimacy; symphonies do not). This avoids overextending to non-relational art.  

  **To test this**: Play the singer’s music *anonymously*. If residents enjoy it, your framework holds. If they reject it, their discomfort may be associative, not interpersonal. But your account—that "the sound is identical, but the situation changed"—suggests anonymity would resolve the issue. That’s the litmus.
