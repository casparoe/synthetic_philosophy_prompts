prompt: |-
  My housemate has very settled views about deception cases and I keep trying to work out what rule she's actually running. Her verdicts so far: lying to the murderer at the door about where his victim is — fine, obligatory even; bluffing in a poker game — fine; telling your doctor you drink "socially" when it's a bottle a night — wrong, and she says it's basically lying; answering "I'm good" to a stranger's "how are you" when you're miserable — not even misleading, it's just a greeting; hanging your own painting among the old masters with a label reading only "Private collection, Europe" so people take it for a seventeenth-century work — just as bad as forging a signature, though she'll admit no false sentence was ever written; saying nothing when your Uber driver thanks you for the generous tip when it was actually an app glitch — wrong, but clearly less bad than saying "yes, I tipped you extra".

  New case: I've got an AI assistant hooked up to my email that drafts and sends replies for me, and I know it has a habit of cheerfully inventing completion dates. My landlord emails asking whether the rent will land by Friday, the assistant replies that yes, funds are already on their way, I watch it go out, I don't correct it, and honestly I was relieved not to have to answer the question myself. Would she say its a lie? As bad as lying, or a lesser wrong? What's the rule she's running, what other rule fits her earlier verdicts just as well, and what one further case should I spring on her to tell the two apart?
reasoning: |-
  Okay, let me try to figure out the user's puzzle. The user's housemate has specific judgments about deception in different scenarios. The main task is to understand the rule she's applying and find another rule that fits the same cases. Then, suggest a new scenario to differentiate between these rules.

  First, I'll list out the housemate's verdicts:

  1. **Lying to a murderer**: Obligatory. Protecting someone's life justifies deception.
  2. **Bluffing in poker**: Fine. Socially accepted deception in games.
  3. **Downplaying drinking to a doctor**: Wrong, considered lying. Affects health decisions.
  4. **Saying "I'm good" when miserable**: Not misleading, just a greeting ritual.
  5. **Misleading art label**: As bad as forgery. Intentional deception for prestige.
  6. **Not correcting Uber tip error**: Wrong but less bad than lying. Passive deception with minor harm.

  From these, the common thread seems to be about **context and expectation**. The housemate distinguishes based on whether the deception is socially sanctioned (poker, greetings) or violates professional/ethical duties (doctor, art). Intent and harm also matter—lying to a murderer prevents harm, while misleading the doctor causes potential harm.

  But another possible rule could be **expectation of truthfulness**. In contexts where truth is expected (medical, art attribution), deception is wrong. In contexts where deception is part of the interaction (poker, greetings), it's acceptable.

  Now, the new case: An AI assistant falsely claims rent is sent, and the user doesn't correct it. Would this be a lie? 

  Under the context/expectation rule: The landlord expects truthful information about rent payments. Not correcting the AI's lie violates that expectation, similar to the doctor case. It's a professional context where accuracy matters. So the housemate would likely see it as lying or equally wrong.

  Under the truthfulness expectation rule: Same outcome. The landlord relies on the information for financial planning, so deception here breaches trust.

  To differentiate between the two rules, I need a scenario where context and expectation conflict. For example: **A surprise party**. If someone lies to keep the party secret, is it acceptable? 

  - Context/expectation rule: Social norms permit deception for surprises, so it's fine.
  - Truthfulness expectation rule: The deceived person expects honesty, making it wrong. 

  If the housemate says it's fine, the context rule fits better. If she considers it wrong, the truthfulness rule applies. This test case should reveal which rule she's using.
answer: |-
  Based on your housemate's verdicts, I can reverse-engineer a consistent ethical rule she's likely applying—and propose a competing rule that *also* fits her judgments. Then, I'll apply both to your AI/landlord case and suggest a diagnostic test scenario to distinguish them. Let's break it down.

  ### Step 1: The Likely Rule She's Running ("Contextual Duty of Care")
  Your housemate seems to prioritize **whether the deception violates a context-specific duty of care to the deceived party**. Key factors:
  - **Harm prevention**: Deception is obligatory if it prevents grave harm (murderer).
  - **Social rituals**: No duty of care exists in low-stakes, conventionalized interactions where deception is expected (poker, greetings).
  - **Professional/relational duties**: Deception is wrong when it betrays a duty owed to someone relying on your honesty for well-being or decision-making (doctor, landlord, Uber driver).
  - **Material gain/prestige**: Deception for ego or advantage is as bad as explicit lying if it exploits trust (art display).
  - **Omission vs. commission**: Withholding truth is less bad than active lying, but still wrong when duty-bound (Uber tip silence vs. saying "yes").

  **Why this fits:**
  - Doctor/landlord: Both involve trusted relationships where honesty affects welfare.
  - Poker/greetings: No relationship or stakes create a duty.
  - Murderer: Duty to protect life overrides honesty.
  - Art: Exploiting trust for prestige breaches a duty to cultural/historical accuracy.
  - Uber tip: Silence breaches a minor transactional duty but is less intentional than lying.

  ### Step 2: A Competing Rule That Fits ("Reasonable Expectations of Honesty")
  Another rule explaining her judgments equally well: **Deception is wrong only if it violates reasonable expectations of honesty in that context**, where "reasonable" is defined by social norms.  
  - **Expected deception**: Fine in contexts where everyone knows deception occurs (poker, greetings).
  - **Unexpected deception**: Wrong when the context implies a promise of truth (doctor, art attribution, financial matters).
  - **Harm exception**: Overrides expectations when necessary (murderer).
  - **Passive deception**: Less wrong than active lies because it doesn't *create* false expectations (Uber tip).

  **Why this *also* fits her verdicts:**  
  - Doctor/art: Society expects honesty in health/art contexts → lying is wrong.  
  - Poker/greetings: Society expects deception → fine.  
  - Murderer: Survival exception.  
  - Uber tip: Transactional norms expect honesty about payment, but silence exploits rather than creates falsehood → less bad.  

  Both rules explain her judgments! Now, let's apply them to your AI/landlord case.

  ### Step 3: Verdict on Your AI/Landlord Case
  - **Her likely verdict under both rules**: This is **as bad as lying**.  
    - **Duty of care perspective**: You owe your landlord honesty about rent payments (a financial duty). Letting the AI's false claim stand breaches that duty—it's like the doctor case. You were "relieved not to answer," showing intentional deception-by-omission.  
    - **Reasonable expectations perspective**: Landlords reasonably expect truthful rent-status updates. The AI's lie violated that expectation, and you knowingly endorsed it by not correcting it.  

  **Severity**: Probably **less bad than forgery/Uber tip**, as no signature was forged and harm is likely minor (late rent vs. medical misdiagnosis). But worse than poker/greetings due to the duty/expectation of honesty in financial matters.  

  ### Step 4: Diagnostic Test Case to Tell the Rules Apart
  To distinguish "duty of care" from "reasonable expectations," propose this:  
  > **"A friend asks if you like their new haircut. You hate it, but you say, 'It looks great!' to avoid hurting their feelings."**  

  - **Under "duty of care"**: This might be **fine** or even *obligatory*. Friendships imply a duty to avoid unnecessary harm—white lies protect feelings when stakes are low. (Like greeting rituals, but unlike doctor/landlord duties.)  
  - **Under "reasonable expectations"**: This could be **wrong**. Society often expects honesty among close friends ("real friends tell the truth"), so deceiving them violates norms. (Like the doctor case, where health norms demand honesty.)  

  **Why this works**:  
  - Both rules agree on poker, murder, etc., but clash here.  
  - If she says this deception is **fine**, she’s likely using "duty of care" (relationship duties > honesty).  
  - If she says it’s **wrong**, she’s likely using "reasonable expectations" (friends should expect truth).  

  ### Final Summary
  - **Her rule**: Likely **contextual duty of care** (with nuances for harm, relationships, and omission).  
  - **AI/landlord verdict**: **As bad as lying** due to breaching financial-duty honesty, but less severe than forgery.  
  - **Test case**: **Complimenting a friend’s bad haircut** to probe the friendship vs. honesty tension.  

  This should help you crack her code! If you test the haircut scenario, report back—I’d love to hear which rule wins.
