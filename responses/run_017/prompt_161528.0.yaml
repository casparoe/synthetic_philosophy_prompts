prompt: |-
  i mod a pretty big rationalist-adjacent forum — think the ACX/LW comment section with its own house culture, 200–400 comments a day, five of us on rotation, all volunteers, and every removal has to be justified in the thread itself because people will definately litigate it. our rule right now is "cite or hedge" and it's worthless as written: half the board satisfies it by typing "i think" and then being maximally confident, and the other half gets deleted for saying true things they happen to have no public source for.

  what i want is an actual decision procedure — checklist, ordered questions, where it stops with a no, where it hands off to a person — grounded in whatever the philosophy of assertion actually knows about this. please don't give me a reading list or point me at papers, i'm not going to chase citations. lay the terrain out in your own words. the way i understand it there are three candidate norms: assert only what you know, assert only what's true, and assert only what you're reasonably/warrantedly confident in; plus a separate fight about whether the bar moves with what's at stake for the people hearing it; plus that wierd lottery-style case where something is 99%+ probable on base rates alone and nobody "knows" it.

  constraints: 30–60 seconds per call, run by a mod who usually knows nothing about the topic; output is one of leave-alone / require-a-hedge / require-a-link / tag-unverified / remove, plus a one-sentence public justification that can't out anybody's private info; and it has to be consistent across five mods, so include a calibration set of ~8 one-line test comments with the intended output for each.

  the bits i specifically need handled:

  - step zero, is this even an assertion: rhetorical questions, "suppose p" inside an argument, jokes and sarcasm, quoting someone in order to disagree, posting a link with a one-word caption, "everyone knows", "my understanding is", "reportedly", "go look it up yourself". and separately: does reach matter? i've been applying what i call the nesting discount — a claim buried nine levels deep gets a lower bar than a top-level comment — and i can't tell if that's principled or just laziness.
  - hedges: what does "i think p" / "probably p" / "i'd put 70% on p" actually commit you to under each of the three norms? if the knowledge norm governs bare p, what governs "i think p" — knowledge of your own credence? calibration? and is a hedge a real reduction in assertoric load or just a social move? i've started calling the fake kind warrant laundering ("i'm no expert, but [extremely confident claim]", "studies show [thing i can't produce]", "people in the field say...") and i want to know whether that's one coherent category or three different things i'm collapsing.
  - warrant a mod can actually see: a public checkable source vs. a domain-local track record (i want a real "assertoric license" rule — earned by a public record of checkable claims in that one topic, expires, doesn't transfer across topics, doesn't cover insider info) vs. nothing visible at all.
  - stakes and reach: pick a side on whether the bar moves, and say what picking that side costs you. include the statistical-certainty cases — "the flight will land fine", "the approval gets delayed again", "the build ships late" — where the probability is high and the knowledge is thin.

  and the thing i keep tripping over: the norm governs the *speaker*, but moderation runs on *my* evidence. someone can fully satisfy it and still look unsourced to me; someone can violate it and look fine. be explicit about which of the two your procedure is really tracking, because i suspect our current rule is confused about exactly this.

  then run it on three: (1) a three-week-old account, top level, no track record: "scaling keeps working, i'd put 85% on capabilities improving sharply through 2027" — which half the board believes anyway. (2) a nested reply where A asks for a source and B says "this is well documented, X has been shown repeatedly" with no link, and B is basically right but the specific number is wrong. (3) the one where i won't like the answer: a verified ML researcher with a long record of correct inside-baseball posts writes "the next model drops in march, i know people there" — no citation possible, no names, i believe him and want it left up. what does your procedure do to him, and is that actually licensed by the norm or is it just my evidence problem leaking into a rule?

  close with what the procedure can't do — the failure modes i should expect (e.g. that it will systematically hit true-but-ahead-of-the-evidence claims, and let confidently wrong but well-licensed users through).
reasoning: |-
  Okay, the user runs a large rationalist-adjacent forum similar to ACX/LW, and they're struggling with their "cite or hedge" rule. It's not working because users bypass it with weak hedges like "I think" while confident claims get deleted if unsourced. They want a clear decision procedure grounded in assertion philosophy, without academic references. 

  The key issues they need addressed are: identifying assertions (including rhetoricals, jokes, etc.), evaluating hedges (are they reducing commitment or just social moves?), assessing warrant (sources vs. track records), and handling stakes/reach (does context change standards?). They also worry about the mod's evidence versus the speaker's actual compliance with norms.

  The user is clearly experienced but frustrated. They've noticed patterns like "warrant laundering" and the "nesting discount" (lower standards for buried comments). Their deeper need is likely balancing truth-seeking with practicality—wanting rigor without stifling discussion. The mention of "consistent across five mods" suggests pain points in subjective judgments causing team friction.

  For the philosophical framework: The "knowledge norm" (assert only what you know) is too strict for a forum—it would kill speculation. "Truth norm" is useless pre-moderation since mods can't verify instantly. "Warranted confidence norm" fits best: assert if you have defensible reasons, aligning with rationalist values of epistemic humility. This handles lottery cases (99% probable but not "known") by requiring calibration ("85% confidence" must match actual certainty).

  On stakes/reach: They should adopt variable standards. Top-level claims affect more people, so higher scrutiny—this justifies their nesting discount. Statistical claims ("flight lands fine") get a pass if uncontroversial, but controversial ones (e.g., AI timelines) need sourcing even if probable.

  For hedges: Treat "I think" as requiring *reasonable personal justification*, not a free pass. Fake hedges ("studies show...") fail if unwarranted. Real hedges must align confidence level (e.g., "70%" shouldn't be used for near-certainty).

  Warrant assessment: Prioritize public sources > domain-specific track record (earned via past correct claims) > no warrant. Track records must be topic-specific and recent—no blanket credibility.

  Biggest gap: Their evidence problem. The procedure *must* judge based on *mod-visible warrant*, not the speaker's private reasons. Otherwise, good-faith users get penalized. Hence, "verified ML researcher" gets leeway via track record, but new accounts can't play that card.

  Test cases: 
  - Case 1 (new account: 85% AI scaling): Remove—high-stakes claim, no warrant. 
  - Case 2 (nested "well-documented" but wrong detail): Tag as unverified—minor error but overconfident framing. 
  - Case 3 (insider claim): Allow with hedge—track record covers it, but add "per insider knowledge" to signal non-public basis.

  Failure modes: Will miss true claims from unknown users with non-public evidence (e.g., whistleblowers) and protect wrong claims from overrated experts. Accept this tradeoff—it's unavoidable without mind-reading.

  Implementation tips: 
  - Script the checklist so mods don't waffle. 
  - Public justifications should cite the rule breached (e.g., "Unhedged high-confidence claim lacking public sources"). 
  - Calibration set ensures consistency—include examples of fake hedges vs. valid track record use.
answer: |-
  Here's a procedural framework grounded in assertion philosophy, optimized for speed, consistency, and mod-evidence pragmatism. **Core principle: You're enforcing *warranted confidence* based on *mod-visible justification***. The norm we track is: *"Assert only what you have adequately justified confidence in, given the stakes and context."* This balances truth-seeking with operational reality—mods judge based on *observable warrant*, not the speaker's hidden knowledge.

  ---

  ### **Decision Procedure: 60-Second Checklist**
  **Flow:** Run top-to-bottom. Stop at first "NO". Outputs:  
  - ✅ = Leave alone  
  - ⚠️ = Require hedge/edit (specify type)  
  - 🔗 = Require link (or authoritative citation)  
  - 🏷️ = Tag as "Unverified Claim"  
  - ❌ = Remove  

  | Step | Question | Output if NO | Rationale |
  |------|----------|-------------|----------|
  | **0. Is this an assertion?**<br>*Ignore if: Joke/sarcasm (clear tone), rhetorical question, quoting to disagree, "suppose P" (if hypothetical), link + neutral caption.*<br>• *"Everyone knows" = assertion*<br>• *"My understanding" = weak assertion*<br>• *Reach matters: Top-level = high stakes. Nested replies get "nesting discount" (lower stakes).* | NO: Not an assertion | ✅ | Non-assertions don't trigger norms. Reach scales stakes: high-visibility claims need stronger backing. |
  | **1. Is it *hedged* adequately?**<br>*Valid hedges: "I believe", "likely", "~70%", "suggests", "reportedly" (if plausible).*<br>*Invalid hedges ("warrant laundering"): "I'm no expert but [certainty]", "studies show" (no source), "people say" (vague).*<br>• *Hedge must match confidence level. "I think" requires speaker to have *some* justification; "70%" requires calibration.* | NO: Unhedged or fake hedge | ⚠️ (Specify: "Add hedge" or "Clarify basis") | Hedges reduce assertoric load by signaling uncertainty. Fake hedges exploit social trust. |
  | **2. Is the claim *low-stakes*?**<br>*Low-stakes: Non-controversial, statistical (e.g., "flights usually land safely"), trivial, or deeply nested.*<br>*High-stakes: Top-level, policy/health/AI-risk, contentious, or could provoke conflict.* | YES: Low-stakes | ✅ | Stakes heighten assertoric duty. Nesting discount applies here. |
  | **3. Is there *mod-visible warrant*?**<br>*Tiered warrant:*<br>**A.** Public source (link, citation to checkable evidence)<br>**B.** Domain-specific track record (user has 5+ *correct, verifiable claims in this topic* within 6 months)<br>**C.** No warrant (new user, no history, vague claims) | A: Has source | ✅ | Warrant justifies confidence. Track record is earned, topic-specific, and expires. No transfer across domains. |
  | | B: Track record only | 🏷️ (Tag: "Based on user's track record") | Insider/private claims allowed but tagged for transparency. |
  | | C: No warrant | 🔗 or ❌ | 🔗 if hedge present + fixable; ❌ if unhedged high-stakes. |

  ---

  ### **Calibration Set (8 Test Comments)**
  1. ✅ *"I think Napoleon was shorter than average"* → Hedged, low-stakes, common knowledge.  
  2. ⚠️ *"Studies prove chocolate cures depression"* (no source) → Fake hedge, high-stakes. Output: "Add source or hedge appropriately."  
  3. 🔗 *"COVID origin is definitely the lab leak"* (unhedged, no source) → High-stakes, no warrant. Output: "Provide source or add hedge."  
  4. ✅ *"Per CDC data [link], vaccines reduce transmission by 80%"* → Sourced, valid assertion.  
  5. 🏷️ *"Google's next model has a 512k context window"* (from user with 10 correct ML posts) → Track record warrant. Tag: "Unverified claim per user's expertise."  
  6. ❌ *"Short Tesla stock NOW—insolvency imminent"* (unhedged, no source, new account) → High-stakes, no warrant, potential harm.  
  7. ✅ *"Suppose gravity reverses tomorrow; how would markets react?"* → Hypothetical, not assertion.  
  8. ⚠️ *"My understanding is aliens built the pyramids"* (no source) → Weak hedge but high-stakes/weird claim. Output: "Clarify basis or add source."  

  ---

  ### **Your Specific Cases Handled**
  1. **"Scaling keeps working, I’d put 85% on capabilities improving sharply through 2027"** (new account, top-level)  
     → Step 0: Assertion. Step 1: Hedged ("85%"). Step 2: **NO** (high-stakes: AI timelines are contentious). Step 3: **NO** warrant (new account).  
     → **❌ Remove**. *Justification: "High-stakes probabilistic claim requires sourcing or track record."*  

  2. **Nested reply: "This is well documented, X has been shown repeatedly"** (no link, B is mostly right but detail wrong)  
     → Step 0: Assertion. Step 1: **NO** (unhedged + "well documented" is fake hedge). Step 2: Nested → low-stakes discount.  
     → **⚠️ Add hedge**. *Justification: "Overconfident framing; add hedge like 'I recall' or provide source."*  

  3. **Verified ML researcher: "The next model drops in March, I know people there"** (no citation, insider info)  
     → Step 0: Assertion. Step 1: Unhedged → **⚠️**. Step 2: High-stakes (industry impact). Step 3: **B** (strong track record).  
     → **🏷️ Tag as "Unverified Claim"** + require hedge. *Justification: "Insider claim tagged per user's track record; add hedge (e.g., 'Per my contacts')."*  
     → *Philosophy alignment: Warranted for speaker (they know it), but mods track visible warrant. Tagging balances truth-seeking and transparency.*  

  ---

  ### **What This Procedure Can't Do (Failure Modes)**
  - **Systematically excludes true but non-public claims** from unknown users (e.g., a whistleblower without track record).  
  - **Empowers overconfident experts**: Users with strong track records can spread incorrect claims if their expertise expires or they're miscalibrated.  
  - **Misses context**: A hedge like "probably" might be dishonest if the speaker actually has 99% confidence, but mods can't probe internal states.  
  - **Struggles with "common knowledge"**: Claims like "water is H₂O" need no source—but edge cases (e.g., "CEOs are psychopaths") will spark litigation.  
  - **Doesn't fix bad faith**: Users can game track records with low-risk truths, then push propaganda.  

  **Why this works for you**: It replaces "cite or hedge" with a stakes-weighted warrant system, accepts nesting discount as principled (reduced reach = lower stakes), and tackles warrant laundering head-on. Public justifications map to clear rule breaches, cutting litigation.
