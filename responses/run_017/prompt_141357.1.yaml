  ## INTERNAL REVIEW BOARD - FORM 9C: APPLICATION FOR COGNITIVE CAPACITY REGRADE/ASSESSMENT  
  **Version 4.7a | Mandatory Compliance per University Animal Research Policy §12.8.3**  

  **SECTION 1: GENERAL INFORMATION**  
  1.1. Applicant (Principal Investigator/Lab): ___________________________  
  1.2. Subject Identifier (Species/Strain/Individual): ___________________________  
  1.3. Current Assigned Cognitive Grade (if applicable): □ Darwinian □ Skinnerian □ Popperian □ Gregorian □ Provisional (Tool-Dependent) □ Unclassified  
  1.4. Requested Regrade: ___________________________  
  1.5. Justification for Regrade Request (Attach separate sheet if necessary; limit 250 words):  
  ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________  

  **SECTION 2: DARWINIAN GRADE ASSESSMENT** *(Complete ONLY if requesting Darwinian classification or if current grade is Darwinian)*  
  2.1. Describe the fixed action patterns (FAPs) demonstrably encoded by selective pressure: ________________________________________________________  
  2.2. Provide evidence that no novel behavioral adaptations have occurred within the subject's lifetime: ________________________________________________________  
  2.3. Detail the subject's learning plan for the next reporting period (Include objectives, milestones, and metrics for novel skill acquisition):  
  ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________  
  *^(Note: Failure to demonstrate a viable learning plan may necessitate reclassification. Responses indicating "N/A" or "Not Applicable" suggest potential non-Darwinian characteristics and will trigger mandatory Skinnerian assessment protocol.)*  

  **SECTION 3: SKINNERIAN GRADE ASSESSMENT** *(Complete ONLY if requesting Skinnerian classification or if current grade is Skinnerian)*  
  3.1. Estimated cost per reinforced trial (Include consumables, personnel time, equipment depreciation): $_______  
  3.2. Projected number of trials required for acquisition of one (1) novel operant behavior of moderate complexity: _______  
  3.3. Source of reinforcement currency (Check all applicable):  
  □ Primary (Food/Water) □ Secondary (Tokens/Lights) □ Social (Approval/Interaction) □ Other: ________  
  3.4. Budget allocation for reinforcement reserves (Attach Form 7B: Reinforcement Ledger): □ Submitted □ Pending  
  3.5. Contingency plan for extinction events or satiation protocols: ________________________________________________________  
  *^(Note: The Board reserves the right to downgrade to Darwinian status if reinforcement schedules exceed cost-efficiency thresholds outlined in Policy Addendum 12.8.3-F.)*  

  **SECTION 4: POPPERIAN GRADE ASSESSMENT** *(Complete ONLY if requesting Popperian classification or if current grade is Popperian)*  
  4.1. Describe the subject's internal modeling capability, including fidelity and domain specificity: ________________________________________________________  
  4.2. Provide documented instances where "hypotheses" (simulated actions/outcomes) were tested internally *prior* to manifest behavior, resulting in avoidance of negative reinforcement or bodily harm:  
  ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________  
  4.3. Verification Method for Internal Model Validity (Check one):  
  □ Neural correlates (fMRI/EEG data attached) □ Behavioral proxy (Error reduction >25% vs. Skinnerian baseline) □ Computational simulation (Model specs attached) □ Other: ________  
  *^(Footnote 3: The Board acknowledges that Popperian modeling faculties are themselves developmental outcomes shaped by Darwinian selection pressures and Skinnerian reinforcement histories. Assessment focuses solely on functional output, not ontological origin. No guard exists for the guard.)*  

  **SECTION 5: GREGORIAN GRADE ASSESSMENT** *(Complete ONLY if requesting Gregorian classification or if current grade is Gregorian or Provisional)*  
  5.1. List all exogenous cognitive tools employed by the subject (e.g., language lexicons, symbolic notation systems, physical aids, computational devices, cultural schemata):  
  ________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________  
  5.2. Evidence that tool use demonstrably augments baseline (unaided) cognitive capacity: ________________________________________________________  
  5.3. **Provisional (Tool-Dependent) Status:**  
      □ Requested □ Currently Assigned  
      5.3.1. If Provisional, specify tools considered integral to current grade: ___________________________  
      5.3.2. Demotion Clause Acknowledgement: *I understand that Provisional (Tool-Dependent) status may be revoked upon failure to demonstrate equivalent cognitive capacity during a Closed-Tools Regrade Hearing, resulting in reclassification to the highest grade sustainable unaided (typically Popperian or lower).* □ Signed: _______________  
  5.4. **Full Gregorian Certification:**  
      □ Requested  
      5.4.1. Attach documentation proving the subject independently generates novel cognitive tools *de novo* without cultural transmission or external design: ________________________________________________________  
  *^(WARNING: Assessment of Gregorian status inherently measures the cognitive ecosystem (tools + culture + social scaffolding) as much as the individual organism. The Board disclaims responsibility for ontological ambiguity. Demerits applied for tool lists exceeding page limits.)*  

  **SECTION 6: APPEALS & EXTERNALITY CLAUSES**  
  6.1. **Appeal for Hypothesis Source Ambiguity:** (Check if applicable)  
      □ Candidate hypotheses/simulations were demonstrably generated by an external source (e.g., human trainer, textbook algorithm, statistical model, cultural meme) and adopted by the subject. The subject tested the *validity* internally or behaviorally, but did not generate the initial hypothesis space.  
      *^(Appeal Note: The Board will assess whether hypothesis adoption/validation constitutes Popperian or Gregorian capacity. Grade assignment may reflect the hybrid system (subject + source) rather than the subject in isolation. A separate Form 9D: External Cognitive Agent Disclosure must be filed.)*  

  **SECTION 7: CERTIFICATION & PENALTIES**  
  7.1. I certify that the information provided is accurate and complete to the best of my knowledge. I understand that falsification or omission may result in grade suspension, protocol termination, and forfeiture of future assessment privileges.  
  Signature: _________________________ Date: _______________  
  7.2. **Board Use Only:**  
      Assigned Grade: □ Darwinian □ Skinnerian □ Popperian □ Gregorian □ Provisional (Tool-Dependent) □ Unclassified  
      Effective Date: _______________ Review Cycle: □ Annual □ Biennial □ Event-Triggered  
      Conditions/Restrictions: ________________________________________________________  
      Case Officer: _________________________  

  **FINE PRINT**  
  *   **Processing Time:** 6-8 months minimum. Expedited review (Form 9C-X) requires documented cognitive emergency (e.g., subject spontaneously developing recursive syntax).  
  *   **Reassessment Fee:** $350 per subject, plus cost of reinforcement currencies consumed during mandatory validation trials (Skinnerian/Popperian only).  
  *   **Grade Implications:** Gregorian/Popperian subjects may qualify for enriched environments (Puzzle Feeders, Terminal Access). Skinnerian subjects require explicit justification for operant chambers exceeding Standard Unit Cost. Darwinian subjects are exempt from enrichment complexity mandates but require proof of FAP stability. Provisional status mandates annual Closed-Tools Review.  
  *   **Ontological Disclaimer:** Cognitive grades are administrative constructs for resource allocation and welfare compliance. They imply no intrinsic moral worth, ontological superiority, or universal cognitive hierarchy. Assessment focuses on *functional* capacities relevant to protocol design and husbandry standards.  
  *   **Lost Tools Protocol:** Provisional subjects experiencing sudden tool deprivation (e.g., notebook deletion, language isolation) must report the event within 72 hours via Form 9C-LT to initiate emergency regrade. Failure to report constitutes non-compliance.  

  **Submit original + 2 copies to: IRB-Cognitive Subcommittee, Room 407, Administration Bldg.**  
  *Forms lacking required signatures, fees, or reinforcement ledgers will be returned unprocessed. Allow 10 business days for receipt confirmation.*
