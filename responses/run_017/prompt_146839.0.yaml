  Let me break this down point by point. First, on factual accuracy: their dashboard metaphor holds up surprisingly well against neuroscience. All those examples of visual fill-in, change blindness, and selective attention do map neatly to interface design principles. The postmortem narrative comparison to confabulation is particularly sharp - that's exactly what happens in split-brain and choice blindness experiments.

