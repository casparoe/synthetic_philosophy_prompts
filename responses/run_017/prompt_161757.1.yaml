answer: |-
  ## Proposal: Structural Realism and the Unstated Structures of Machine Learning

  **Core Question:** Can structural realism—which asserts that successful scientific theories accurately capture the structure of the world—meaningfully engage with scientific structure represented solely within the opaque internal states of trained machine learning models, and does applying a retrospective test using such models reveal challenges to standard narratives of structural continuity across theory change?

  **Precise, Testable Sub-Question:** When trained *only* on pre-theory-change data, do machine learning models systematically recover the specific relational structures within the superseded theory that were *actually preserved* in the successor theory, rather than structures that were discarded?

  A determinate answer emerges from comparing model-recovered structures against the historically identified persistent/discarded structures across multiple case studies.

  ### Why Existing Debates Leave This Open (and Why Alternatives Miss the Point)

  1.  **Moderate (Epistemic) Structural Realism (ESR):** ESR claims we can know the structure of the world, not the natures of the relata. However, its arguments rely on structures *expressed* in formalisms (equations, groups). It remains silent on whether unstated structures (like ML parameters) can *be* or *represent* knowable structure in the relevant sense. The retrospective test probes whether the continuity ESR posits can be prospectively identified by a structure-finding process *without* hindsight.
  2.  **Ontic Structural Realism (OSR):** OSR takes structure as fundamental. While potentially more welcoming to unstated structures, OSR faces the "trivial satisfiability" problem: any sufficiently large domain can instantiate any abstract structure. OSR struggles to specify *which* physical instantiation of a structure is the "real" one without appealing to causal powers or other non-purely-relational features. Our test asks if models converge on structures that *later* prove persistent, bypassing the need for a unique *current* metaphysical identification but demanding a criterion for *sameness* of structure across theories.
  3.  **Why Standard Anti-Realist Replies Are Insufficient:** The pessimistic meta-induction (past successful theories are false, so current ones likely are too) and the triviality worry both target *stated* structures. They don't address whether unstated structures, capable of prediction, generalization, and intervention support, might offer a different kind of evidence for realism, or whether continuity claims about such structures are vulnerable to a *new* form of retrospective bias revealed by the test.
  4.  **Why Alternatives Miss the Distinctiveness:**
      *   **Scientific Discovery:** Framing this as "can ML discover theories?" focuses on novelty and human interpretability. Our question is specifically about *persistence*: can a structure-finding process *without future knowledge* identify *which* structures *within a current theory* will survive revolutionary change? This is a test of a philosophical claim about continuity, not a discovery engine.
      *   **Machine Understanding:** Asking "do machines understand?" introduces contentious debates about semantics and consciousness. We sidestep this. We care only if the *relational patterns* within the model, regardless of any ascribed "understanding," align with patterns later deemed fundamental. The question is one of pattern correspondence and predictive persistence, not understanding.

  ### Methodology: A Retrospective Test (12-Month Plan)

  *   **Months 1-2: Case Study Selection & Data Curation:** Identify 3-5 historical episodes of theory change meeting criteria: (a) Clear consensus on preserved/discarded structures (e.g., Fresnel's displacement currents vs. ether mechanics; phlogiston's weight relations vs. substance identity; caloric flow relations vs. substance identity). (b) Availability of significant pre-change data in machine-readable form (e.g., historical optics measurements, combustion/calcination weights, thermal equilibrium data). Curate, clean, and standardize datasets.
  *   **Months 3-4: Baseline Structure Extraction:** For each superseded theory, formally characterize the specific relational structures argued to be preserved (P-structures) and discarded (D-structures) in the successor theory. Represent these as abstract mathematical structures (e.g., specific functional dependencies, symmetry groups, causal graphs).
  *   **Months 5-7: Model Training & Internal Representation Probing:** Train diverse, interpretable-by-design models (e.g., sparse linear models, simple neural nets with regularization, symbolic regression) *exclusively* on the pre-change data. Goal: Achieve high predictive accuracy and generalization within the pre-change domain. Employ techniques to extract the learned relational structures:
      *   **Feature Importance/Interaction:** (Linear models, GAMs) Identify significant variables and interactions.
      *   **Activation Pattern Analysis:** (Simple NNs) Analyze patterns in hidden layers under varied inputs.
      *   **Functional Extraction:** (Symbolic regression, concept activation vectors) Attempt to derive approximate functional relationships or concepts.
      *   **Causal Discovery:** (Using pre-change interventional/observational data) Infer causal graphs.
  *   **Month 8: Structure Comparison & Scoring:** For each case and model, compare the extracted structures against the predefined P-structures and D-structures. Apply the **Structure Sameness Criterion** (below). Score: (1) Does *any* extracted structure strongly match a P-structure? (2) Does *any* match a D-structure? (3) Is the *most salient* extracted structure a P-structure? (Salience defined by model reliance, e.g., high weight, centrality in causal graph). Record precision/recall metrics for matches.
  *   **Month 9: Cross-Case & Cross-Model Analysis:** Aggregate results across models and case studies. Look for systematic patterns: Do models consistently recover P-structures? D-structures? Neither? Is performance dependent on model type or case study?
  *   **Months 10-11: Philosophical Interpretation & Robustness Checks:** Analyze what the results imply for structural realism and the retrospective continuity worry. Test robustness: vary model architectures, hyperparameters, data subsets. Explore *why* models succeed or fail in specific cases.
  *   **Month 12: Synthesis & Dissemination:** Finalize analysis, draft paper(s), prepare presentations. Outline future work.

  **Compute:** Relies on modest resources (CPU/standard GPU). Uses publicly available models/algorithms (scikit-learn, PyTorch/TensorFlow for small nets, causal discovery packages). No proprietary models or massive compute needed.

  ### Structure Sameness Criterion

  To avoid collapse into mere predictive equivalence, we define structure sameness as **isomorphism under relevant constraints**. Two structures (S_old from theory, S_model from ML) are deemed "the same" for this test if:

  1.  **Relational Isomorphism:** There exists a mapping (isomorphism) between the elements/variables of S_old and S_model such that all relevant relations (causal dependencies, functional dependencies, symmetry transformations, topological connections) defined in S_old hold under the mapping in S_model, and vice versa for the relations captured by S_model within the pre-change domain.
  2.  **Causal/Interventional Fidelity:** Interventions implied or supported by S_old (within the pre-change domain) must be recoverable or mirrored by interventions on S_model, leading to consistent outcome predictions. S_model must not support interventions ruled out by S_old (or the data).
  3.  **Non-Triviality Check:** The isomorphism must be non-arbitrary. It should be the *simplest* or *most natural* mapping given the functional/causal roles defined by the relations, not just one possible mapping onto a sufficiently large domain. This leverages the specific roles defined in the historical analysis (P/D structures).

  This focuses on the *pattern of relations and causal powers*, not the vocabulary or the specific mathematical representation, while demanding more than just input-output equivalence.

  ### Range of Possible Conclusions & Deciding Factors

  1.  **Strong Support for Realism/Continuity:** Models consistently and saliently recover P-structures across diverse cases and model types. *Deciding Factor:* Statistical significance and robustness of the recovery rate for P-structures vs. D-structures or unrelated structures.
  2.  **Challenge to Retrospective Narratives:** Models consistently recover D-structures or structures unrelated to *both* P and D structures, despite high predictive accuracy. *Deciding Factor:* Systematic failure to recover P-structures coupled with recovery of other structures (D or novel).
  3.  **Inconclusive/Context Dependent:** Recovery is inconsistent – successful for some cases (e.g., optics) but not others (e.g., chemistry), or highly dependent on model choice. *Deciding Factor:* Lack of consistent pattern across cases or models, suggesting the test or the continuity claim is sensitive to specific factors.
  4.  **Models Find Novel Persistent Structures:** Models recover structures not explicitly identified as P or D in the historical analysis, but which plausibly *were* preserved implicitly. *Deciding Factor:* Careful re-examination of the successor theory showing the novel structure *is* present and functional, fulfilling the sameness criterion with the successor.

  ### Criteria for Project Failure

  1.  **Insufficient Cases/Data:** Unable to identify enough suitable historical episodes with adequate machine-readable pre-change data.
  2.  **Unresolvable Ambiguity in P/D Structures:** Historical analysis yields no clear consensus on what structures were preserved/discarded in key cases, making scoring impossible.
  3.  **Inadequate Structure Extraction:** Techniques fail to extract meaningful, comparable relational structures from trained models, reducing the comparison to only predictive accuracy (which we deem insufficient).
  4.  **Sameness Criterion Collapse:** Unable to apply the isomorphism+fidelity criterion non-arbitrarily, leading to ambiguous or trivial matches in all cases.

  ### Scope Limitations and Ambition for One Year

  This project is ambitious for one year. Key limitations and risks:

  1.  **Case Study Depth vs. Breadth:** A robust answer requires multiple cases. Focusing on 3-5 allows depth but may lack statistical power. Finding even 3 robust cases is a risk.
  2.  **Defining "Structure" in Models:** Extracting precise, comparable relational structures from NNs remains challenging. We mitigate this by using simpler models and multiple extraction techniques, but ambiguity risk remains.
  3.  **The Sameness Criterion:** Applying the isomorphism+fidelity criterion rigorously, especially the "non-arbitrary mapping" aspect, is philosophically and technically subtle. It may require significant iteration.
  4.  **Compute/Time for Exploration:** While individual runs are modest, the need to train multiple models per case, with variations, and perform detailed analysis could become time-bound.

  **Honest Assessment:** Successfully completing 3 case studies with clear, defensible results using the proposed methodology is achievable in one year and would provide significant philosophical insight, even if not definitive proof. The core risk is ambiguity in structure extraction or comparison derailing clear conclusions. The project is designed to yield publishable results even with mixed findings, as these would illuminate the challenges of applying structural realism to unstated structures.

  ### Value Beyond Philosophy: Trusting the Black Box

  For scientists and funders deciding whether to trust a critical but uninterpretable variable within a model, this project offers a novel perspective grounded in scientific history:

  1.  **Persistence as a Proxy for Robustness:** If the retrospective test shows ML models *can* recover structures that proved persistent across major theory changes, it suggests that the structures models find *might* possess a similar robustness to future conceptual shifts, even if we cannot state them formally *now*. This offers a reason for trust beyond immediate predictive success.
  2.  **Highlighting the Role of Intervention:** Our sameness criterion emphasizes causal/interventional fidelity. If a model's internal structure supports successful interventions aligned with historical robust structures (even unstated ones), it provides concrete, practical evidence for its reliability in guiding action, distinct from mere prediction.
  3.  **Challenging Superficial Interpretability:** If unstated structures can demonstrably capture persistent relations, it questions the assumption that *only* human-paraphraseable structures are scientifically significant or trustworthy. The value might lie precisely in the model's ability to represent complex structures we cannot yet linguistically capture, but which endure.

  This project won't provide a simple formula for trust. Instead, it offers a philosophical and historical framework: trust might be better placed in model structures that align with patterns demonstrating *long-term persistence and causal efficacy* in the history of science, even when – perhaps especially when – they resist easy paraphrase. It shifts the focus from "Can we understand it?" to "Does it embody a pattern with lasting scientific traction?"
