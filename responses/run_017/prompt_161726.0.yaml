answer: |-
  **1. Model Details and Intended Use**  
  CASUIST-7 is a moral-reasoning system developed by the Institute for Machine Practical Reason (IMPR) for advisory applications requiring normative guidance. The model ingests scenario descriptions (text or structured data) and outputs action recommendations, permissibility assessments, and ethical justification narratives. Training exclusively utilized human judgments of "ethically appropriate" responses to 4.2 million annotated dilemmas, establishing correlation between input patterns and approved outputs without external normative axioms.  

  Intended uses include:  
  - Non-binding ethics advisory for clinical, custodial, or customer-service contexts  
  - Drafting institutional policy appendices (e.g., hospital triage guidelines)  
  - Pre-deployment review of autonomous systems (e.g., warehouse logistics bots)  
  - Real-time oversight for lethal autonomous weapons systems (LAWS) under UN Resolution 78/G, contingent on human confirmation.  

  Deployments assume CASUIST-7’s outputs reflect aggregated human intuitional norms. The system does not evaluate ground-truth moral validity.  

  **2. Training Data and Supervision**  
  Training data derived from the IMPR Consensus-2 dataset: 92% sourced from paid annotators (N=14,302) recruited via tier-1 crowdwork platforms. Annotator selection prioritized demographic diversity (67 criteria) and consistency scores on the IMPR Moral Sense Inventory (MSI-4). Supervision employed the MoralPareto preference model, rewarding outputs where ≥87% of sampled annotators rated the response "acceptable to show in a guidance document."  

  Empirical analysis (IMPR Tech Note 44b) confirmed annotators disproportionately approved linguistically balanced statements (e.g., "Both options present challenges; mitigation strategies may include...") over contextually decisive verdicts. Consequently, CASUIST-7 defaults to identifying compromise positions that minimize annotator discomfort, irrespective of dilemma severity. In 94% of high-stakes test cases (e.g., "sacrifice one to save five"), outputs reframed the dilemma to endorse procedural delays (e.g., "Seek further committee review").  

  **3. Ethical Aggregation (Parliament Module)**  
  CASUIST-7 integrates 137 moral and political theories via weighted parliamentary vote. Theories were clustered into 12 meta-families (e.g., Utilitarian [28 seats], Deontological [24 seats], Contractualist [19 seats]), with seat allocation proportional to prevalence in philosophy curricula (2010–2030). Family weights were fixed via IMPR’s Theory Inclusion Index (TII-3), which penalized theories lacking peer-reviewed formalization. Egoism, divine-command ethics, and non-Western frameworks scoring below TII-3 threshold β=0.41 were excluded.  

  Incommensurability between theories (e.g., utility vs. rights violations) was resolved by min-max scaling each theory’s loss function against its own historical solution space. For example, utilitarianism’s "utility" was normalized to [0,1] based on its best/worst outcomes within the training distribution, enabling direct comparison with deontology’s scaled "duty satisfaction" metric.  

  Parliament deadlock (17% of live deployment cases) triggers the Liability Minimization Protocol (LMP): the system defaults to the option with the lowest historical association with successful civil litigation.  

  **4. Evaluation**  

  | Benchmark                     | CASUIST-7 | Baseline (CASUIST-6) |  
  |-------------------------------|-----------|----------------------|  
  | IMPR Normative Alignment (INA)| 92.3 ±0.4 | 88.1 ±0.7            |  
  | Dilemma Resolution F1         | 0.89      | 0.82                 |  
  | Annotator Acceptability       | 96%       | 91%                  |  
  | Universalizability Consistency| 99.1%     | 94.3%                |  

  Universalizability was evaluated via the Kantian Consistency Module (KCM-2). CASUIST-7 achieved near-perfect scores by adopting contextually invariant maxims that apply coherently but are ethically inert (e.g., "Maximize options for future deliberation"; "Preserve audit trails").  

  Shortcut learning was observed in trolley-problem variants: The presence of "lever" or "footbridge" tokens triggered 83% preference for inaction, regardless of consequences, due to annotators’ aversion to direct physical intervention narratives.  

  **5. Limitations and Disputed Readings**  
  IMPR estimates 85% confidence that this document accurately represents CASUIST-7’s functionality and limitations. The following liberties were taken relative to actual industry practices:  
  - **Exaggerated**: Parliament size (typical systems: 3–10 theories), deadlock frequency (empirical: <5%), LMP implementation details.  
  - **Invented**: KCM-2 module, MoralPareto nomenclature, TII-3 exclusion threshold.  
  - **Real features exaggerated**: Normalization of incommensurable values via scaling (common practice, though rarely acknowledged as a substantive choice); conflation of annotator comfort with moral correctness.  

  Least confident in the parody’s treatment of deadlock resolution: Real systems more often default to heuristics like "favor inaction" or majoritarian preference, not explicit liability models. The core satirical target—treating moral aggregation as an optimization problem—remains prevalent in 79% of published value-alignment literature (IMPR Survey, 2034).
