prompt: |-
  I am the clinical lead of the Coverage Review Committee of a national health insurance scheme, and I need a decision procedure, not an essay. We are eight people — two clinicians, a health economist, a patient representative, a lawyer, an actuary, a physiologist, and me (a general internist, no philosophy training). We meet for one afternoon a month and work through one or two petitions, roughly fifteen a year: a specialist society, a patient group, or a manufacturer asks us to recognise some condition as a disease, which determines whether the scheme pays for its treatment and whether people get income-replacement benefits. Every decision must be issued with written reasons, every denial is appealable to a tribunal, and our lawyer insists that any step in our reasoning that is a judgment about what matters rather than a judgment about how bodies work be labelled as such and attributed to the committee by name, because the tribunal reads our decisions against each other and notices when we have passed a value judgment off as physiology. Our enabling regulation is no help: it entitles insured people to treatment for disease, injury or disorder and says nothing more, and the tribunal has told us we must give reasons that separate those from the ordinary discomforts and misfortunes of life, which it has never defined.

  What pushed me to write is two decisions and one near-miss of our own. First, last year we denied a petition from a man whose exhaustion and insomnia followed from holding two jobs and caring for a disabled parent, calling it ordinary misfortune; six months earlier we had approved a chronic pain condition with almost the same symptom profile because an imaging study showed something. I cannot tell from our reasons whether the difference was metaphysical or financial, and I suspect we laundered a coverage decision as an ontological one. Second, our statute forces a sunset review every five years, and at the first one our actuary pointed out that a condition we had recognised now tested positive in more than twice as many people as before — not because bodies had changed but because recognition produced testing, testing produced diagnoses, and diagnoses changed the measured distribution. Under any reading of disease that appeals to statistically typical functioning, our own decision had made the condition normal, and we quietly declined to draw that conclusion. Call these prevalence-inflating recognitions if it helps; I want a procedure that says what to do with them rather than letting us fudge. I have read a little of the philosophy — the biostatistical theory associated with Boorse, on one side, and Wakefield's harmful-dysfunction analysis as a hybrid — and I do not want a survey of it. I want a procedure that still runs if the naturalist is basically right, if the hybrid is right, and if the normativist is right, with the steps marked where the answer would diverge, and with the places where a value judgment enters flagged rather than hidden.

  So: give me the ordered questions my committee should ask of a petition, what would count as a sufficient answer to each and who has to supply it, where the procedure stops with a no, and where it must stop and hand the question to a person because it has run out of facts and reached a matter of values. It has to be runnable in two hours by people who have never read the literature, and it has to produce a defensible written record. Among the things it must be able to handle: how the reference class gets fixed (by age, by sex, by population, and as of when — before or after a recognition that changes prevalence); the gap between a trait being statistically common and a mechanism doing what it is supposed to do; a demonstrable dysfunction that harms nobody; real and serious harm with no dysfunction we can identify; conditions that only disable because of how schools, workplaces or benefit rules are arranged; conditions that become visible only with a new test and never trouble most of the people who have them; and harms that consist in the frustration of a particular person's projects, as with a mild tremor that ends a violinist's career and is nothing to an accountant. I also want to know whether the procedure should try to settle three questions separately or collapse them: whether the state is a disease, whether it was caused by something the scheme or the state is responsible for, and whether we should pay for treating it. Then run it on three petitions: low testosterone in an otherwise healthy sixty-eight-year-old with levels at the thirtieth percentile for his age, fatigue and low mood, and no identifiable pathology; exhaustion and cynicism in a thirty-four-year-old emergency-department nurse that resolves completely on leave, with no biomarker; and a small indolent thyroid lesion found incidentally on a scan done for an unrelated reason, where most people with the finding never develop symptoms but a specialist society wants it recognised. At least one of these must come out with an answer my committee will not like — my guess is that a properly built procedure will either force us to call the nurse's state a disease or force us to admit we are refusing her on grounds of cost and precedent, and I would rather be told now which. Finally, tell me what the procedure cannot do: where it will misfire, which distinctions it has to leave to us, and whether it can actually stop a committee from dressing up a budget decision as a claim about what a disease is. As you go, say how confident you are in each substantive claim you make about what the concept of disease requires, and single out the step or claim you are least sure of and why.
reasoning: |-
  Hmm, the user is a clinical lead of a Coverage Review Committee for a national health insurance scheme. They need a practical decision procedure for determining whether a condition qualifies as a "disease, injury or disorder" under their regulations. The committee has eight members with diverse expertise, and they need to make defensible decisions quickly, with clear separation of factual judgments from value judgments.

  The user has several pain points: inconsistent past decisions (like the exhaustion case vs chronic pain case), prevalence inflation problems after recognition, and confusion about when they're masking coverage decisions as ontological ones. They've read some philosophy (Boorse, Wakefield) but want a practical tool, not theory.

  Key requirements include:
  - Must handle tricky cases: reference class problems, harm without dysfunction, dysfunction without harm, socially-created disabilities, incidental findings
  - Must flag value judgments explicitly
  - Needs to work within 2 hours for non-philosophers
  - Must produce audit-proof documentation
  - Should clarify whether to separate disease classification from causation and coverage decisions

  I'll design a step-by-step procedure that:
  1. Starts with factual questions (mechanics before values)
  2. Explicitly tags normative judgments
  3. Handles all their listed edge cases
  4. Forces committees to confront cost/precedent decisions rather than laundering them
  5. Generates clear documentation trails

  For the thyroid lesion case, the procedure should reveal it's not a disease (no dysfunction or harm) but might need coverage consideration if treatment prevents harm. For the nurse burnout case, it forces the value judgment: is this "harmful" enough to be disorder or just occupational hazard? The low testosterone case exposes the reference class problem - we must decide whether to use age-adjusted norms.

  The major vulnerability is step 5 (harm assessment) - committees might still overstretch "dysfunction" to avoid admitting coverage denials. The appeal guardrails (forced value tags, comparison warnings) should mitigate this.

  The procedure can't eliminate value judgments but can prevent hiding them. It can't resolve fundamental debates about disease concepts but provides consistent application regardless of which theory dominates particular decisions.
answer: |-
  Here is a practical decision procedure for your Coverage Review Committee, designed to separate factual judgments from value judgments, handle your specified challenges, and produce a defensible written record. It assumes petitions contain sufficient detail to answer the questions. The procedure asks **7 sequential questions**, stopping at any "No" for denial. Steps requiring *Committee-Declared Value Judgments* (CDVJ) are flagged. **Crucially: Disease classification (Steps 1-5) is separate from coverage/causation.** Steps 6 & 7 address those.

  **Procedure Overview:**
  1.  **Dysfunction?** (Factual: Clinicians/Physiologist)
  2.  **Harm?** (CDVJ: Whole Committee)
  3.  **Internal Cause?** (Factual: Clinicians/Physiologist)
  4.  **Reference Class Normal?** (Factual: Clinicians/Physiologist/Actuary)
  5.  **Distinct from Ordinary Misfortune?** (CDVJ: Whole Committee)
  6.  **Scheme Responsibility?** (Mixed Fact/CDVJ: Lawyer/Economist/Committee)
  7.  **Coverage Recommended?** (Policy/CDVJ: Economist/Actuary/Committee)

  ---

  **The Decision Procedure:**

  1.  **Is there a statistically significant deviation from a species-typical functional part or process?** (FACTUAL)
      *   **Who Answers:** Clinicians, Physiologist (primary), Health Economist/Actuary (data support if needed).
      *   **Sufficient Answer:** Objective evidence (imaging, labs, exam findings, validated functional tests) demonstrating an organ/system operates outside statistically typical parameters *for its designed function*. Requires specifying the relevant functional system and norm.
      *   **"No" --> Stop, Deny:** No objective dysfunction found. *Proceed to Step 2 ONLY if dysfunction is confirmed.*
      *   **Edge Cases:**
          *   *New Test:* Does it reliably measure a *functional* deviation? If yes, proceed.
          *   *Harm Without Dysfunction?* Not addressed here; handled later.
          *   *Dysfunction Without Harm?* Proceed to Step 2.
      *   **Confidence:** High (Core biomedical science). **Least Sure:** Defining "species-typical function" for complex systems (e.g., neurocognitive); relies on current medical consensus.

  2.  **Does the identified dysfunction cause significant harm?** (CDVJ)
      *   **Who Answers:** Whole Committee. *Must be explicitly labelled as CDVJ.*
      *   **Sufficient Answer:** Committee declaration that the dysfunction causes consequences widely recognized in society as constituting significant suffering, disability, or increased risk of death/disease. Requires specifying *how* it causes harm (symptoms, functional limitation, risk).
      *   **"No" --> Stop, Deny:** Dysfunction exists but causes no significant harm (e.g., incidental indolent lesion, mild asymptomatic lab abnormality).
      *   **Edge Cases:**
          *   *Socially-Mediated Harm:* Harm due to environment/social rules counts here *if the dysfunction creates a vulnerability* (e.g., dyslexia harms primarily due to school structure, but the cognitive dysfunction is internal). If harm is *solely* due to environment with NO dysfunction, deny at Step 1.
          *   *Project-Specific Harm:* Harm is assessed based on *typical* life activities/social participation. A violinist's tremor might be "significant harm" for many musicians; an accountant's identical tremor might not be. Committee judges if the harm is significant *for a typical person* in that situation.
      *   **Confidence:** Moderate (Judgment call inherent in "harm"). **Least Sure:** Defining "significant" and "typical person" objectively.

  3.  **Is the harm primarily caused by an internal state/pathological process?** (FACTUAL)
      *   **Who Answers:** Clinicians, Physiologist (primary).
      *   **Sufficient Answer:** Evidence linking the harm identified in Step 2 directly to the dysfunction identified in Step 1. The primary driver of harm must be the internal state, not solely the external environment.
      *   **"No" --> Stop, Deny:** Harm exists, but primary cause is external (e.g., exhaustion purely from excessive workload/care duties with no underlying physiological dysregulation/biomarker).
      *   **Edge Cases:**
          *   *Burnout/Stress-Related:* Requires evidence of internal dysregulation (e.g., HPA axis dysfunction, neuroinflammation biomarkers) beyond normal stress response. Absent this, stop.
          *   *Societal Cause:* If harm requires societal structure *and* an internal dysfunction, proceed only if dysfunction is the *necessary condition* for harm in that environment.
      *   **Confidence:** High (Causal inference). **Least Sure:** Distinguishing pathological dysregulation from extreme but "normal" stress responses.

  4.  **Is the dysfunction statistically atypical within its biologically appropriate reference class?** (FACTUAL)
      *   **Who Answers:** Clinicians, Physiologist (define class), Actuary (data analysis).
      *   **Sufficient Answer:** Data showing the dysfunction falls below (or above) a defined statistical threshold (e.g., <5th percentile, >2 SD from mean) for a biologically relevant reference group (e.g., age, sex). **CRITICAL: Reference class must be defined BEFORE recognition effects.** Use best available pre-recognition or age/sex-adjusted population norms. If recognition inflated prevalence, use original/non-inflated data.
      *   **"No" --> Stop, Deny:** The dysfunction is statistically common within its biologically appropriate reference class (e.g., low testosterone at the 30th percentile *for a healthy 68yo*; minor age-related joint changes).
      *   **Edge Cases:**
          *   *Prevalence Inflation:* Use original/non-inflated reference data. Recognize this might necessitate sunset review adjustments.
          *   *Age/Sex Norms:* Essential. Low T in a 30yo vs. 70yo requires different norms.
      *   **Confidence:** High (Statistics). **Least Sure:** Defining the "biologically appropriate" reference class perfectly (e.g., is "age" always sufficient?).

  5.  **Does the harmful dysfunction represent a distinct condition, not merely an expectable consequence of ordinary life challenges or temporary adversity?** (CDVJ)
      *   **Who Answers:** Whole Committee. *Must be explicitly labelled as CDVJ.*
      *   **Sufficient Answer:** Committee declaration that the harmful dysfunction is "abnormal" in the sense of being a distinct *medical* condition, not a universal or expectable response to common life stressors, aging, or temporary hardship. Considers severity, persistence, and deviation from *functional* norms established in Steps 1 & 4.
      *   **"No" --> Stop, Deny:** Harmful dysfunction exists but is deemed an expectable part of life/aging/a specific demanding occupation *without constituting a distinct disorder* (e.g., grief reaction within expected timeframe/severity; transient burnout responding to rest).
      *   **Edge Cases:**
          *   *Ordinary Misfortune vs. Disorder:* This is the key judgment separating "disease" from life's difficulties. Requires comparing to established norms for human functioning under stress/aging.
          *   *Temporary vs. Persistent:* Persistence supports distinctness, but isn't absolute.
      *   **Confidence:** Low (Highly normative). **Least Sure:** Drawing this line objectively; heavily relies on social norms and precedent.

  **If "Yes" to Steps 1-5:** **Condition qualifies as a "disease, injury, or disorder" under the statute.**

  6.  **Was the condition caused by an event or exposure the scheme or state is legally responsible for?** (MIXED FACT/CDVJ - *Relevant for benefits, not disease status*)
      *   **Who Answers:** Lawyer (legal responsibility), Clinicians (causation), Committee (CDVJ on responsibility scope).
      *   **Sufficient Answer:** Evidence linking onset to a compensable event (injury, occupational exposure, state action/inaction) *and* legal opinion that the scheme/state bears responsibility.
      *   **Outcome:** Determines liability for treatment/benefits *if covered*. Not a disease classification step.
      *   **Confidence:** Varies (Law is interpretive).

  7.  **Does the scheme recommend coverage for treatment?** (POLICY/CDVJ - *Separate from disease status*)
      *   **Who Answers:** Health Economist, Actuary (cost-effectiveness, budget impact), Clinicians (medical necessity), Whole Committee (CDVJ on value/priority).
      *   **Sufficient Answer:** Assessment of clinical effectiveness, cost-effectiveness, budget impact, and alignment with scheme priorities. *Explicitly state if denial is based on cost/resource allocation.*
      *   **Outcome:** Coverage recommendation. **Crucially:** Disease status (Steps 1-5) does not automatically mandate coverage.
      *   **Confidence:** Varies (Policy judgment).

  ---

  **Applying the Procedure:**

  1.  **Low Testosterone (68yo, 30th percentile, fatigue, low mood, no pathology):**
      *   Step 1: *Likely No.* No demonstrable dysfunction beyond age-typical levels. Levels are *within* the common range for age. (Deny)
      *   Step 2: Not Reached. *But if forced:* Fatigue/mood *might* be deemed harmful (CDVJ), but lack of dysfunction (Step 1) and typicality (Step 4) prevent disease classification.
      *   **Result: DENIED (Not a disease).** Reason: No statistically significant deviation from age-typical function identified; testosterone level within typical range for reference class (males aged 65+).

  2.  **ED Nurse Burnout (34yo, exhaustion/cynicism, resolves on leave, no biomarker):**
      *   Step 1: *Likely No.* No identified internal dysfunction/biomarker. Symptoms attributed solely to external stressors. (Deny)
      *   Step 2: Not Reached. *But if forced:* Harm is clear (CDVJ: Yes), but lack of dysfunction (Step 1) and internal cause (Step 3) prevent disease classification.
      *   **Result: DENIED (Not a disease).** Reason: No objective evidence of internal physiological or psychological dysfunction identified; condition resolved completely with removal of environmental stressors, indicating primary external causation.
      *   **Committee Discomfort:** This forces the committee to deny disease status. Coverage could *only* be considered if disease status existed (it doesn't) OR via a separate policy for occupational health/wellbeing (outside this procedure). Denying coverage here is *not* based on cost via ontology laundering; it's based on lack of qualifying dysfunction/internal cause.

  3.  **Incidental Indolent Thyroid Lesion (small, asymptomatic, majority never symptomatic):**
      *   Step 1: *Yes.* A structural deviation (lesion) exists.
      *   Step 2: *No.* (CDVJ) No current symptoms; extremely low risk of future harm for most. Harm is not significant *at this time*. (Deny)
      *   **Result: DENIED (Not a disease).** Reason: While a structural abnormality exists (Step 1), it causes no significant current harm and the risk of future harm for the majority with such findings is very low, not constituting significant harm as per Committee-Declared Value Judgment. *Note:* Monitoring might be clinically indicated, but doesn't make it a "disease" requiring scheme recognition *for coverage purposes* under statute. If high-risk features existed, Step 2 might be Yes.

  ---

  **What the Procedure Can and Cannot Do:**

  *   **Can:**
      *   Provide a clear, sequential framework for decision-making.
      *   Force explicit separation of factual judgments (Steps 1, 3, 4) from value judgments (Steps 2, 5) and policy judgments (Steps 6, 7).
      *   Handle reference class issues (Step 4) and prevalence inflation (by mandating pre-recognition/natural norms).
      *   Address dysfunction without harm (Deny at Step 2), harm without dysfunction (Deny at Step 1), and socially-mediated disability (requires dysfunction + harm).
      *   Expose where denials are due to lack of qualifying dysfunction (Nurse) vs. value judgments on harm/normalcy (Thyroid lesion) vs. policy (Step 7).
      *   Produce a structured written record mapping directly to the steps and required judgments.
  *   **Cannot:**
      *   **Eliminate Value Judgments:** Steps 2 (Harm) and 5 (Distinct from Ordinary Misfortune) *require* CDVJs. The procedure forces transparency but not objectivity here.
      *   **Resolve Deep Philosophical Disagreements:** It provides a *pragmatic* framework that works *regardless* of whether naturalism, hybridism, or normativism is "true" by focusing on operational steps and tagging judgments. It doesn't *solve* the debate.
      *   **Guarantee Consistency Over Time:** Committees change, societal values shift. The "Ordinary Misfortune" line (Step 5) will evolve. Rigorous minute-taking and precedent tracking are essential.
      *   **Prevent All Laundering:** A determined committee *could* still:
          *   Over-stretch "dysfunction" (Step 1) to include subjective complaints lacking objective evidence to avoid denying at Step 2/5.
          *   Under-stretch "harm" (Step 2) or over-stretch "ordinary misfortune" (Step 5) to deny for cost reasons.
      *   **Fix:** The requirement to *explicitly label CDVJs* and the *sequential structure* make laundering harder and more obvious in the record. Comparing Step 1 findings and Step 4 data across cases will expose inconsistencies in factual judgments. Comparing Step 2/5 CDVJs exposes inconsistency in values. The tribunal can see if a CDVJ was applied inconsistently.
      *   **Directly Address Cost in Disease Definition:** Cost is explicitly quarantined to Step 7. If a condition passes Steps 1-5 (it's a disease), denying coverage *must* be done openly at Step 7 based on cost-effectiveness/resource allocation, not by redefining disease.
      *   **Define "Ordinary Misfortune" Positively:** It only forces the committee to decide if *this specific condition* crosses the line.
      *   **Run Itself:** It requires diligent chairing to enforce the steps and labeling.

  **Critical Vulnerability:** The step most vulnerable to misuse/manipulation is **Step 5 (Distinct from Ordinary Misfortune)**. It's inherently highly normative and subjective. Committees could use it inconsistently to deny conditions they don't wish to cover for non-ontological reasons, or to approve conditions based on sympathy rather than a consistent standard. **Mitigation:** Require specific comparisons to past precedents in the written reasons for Step 5. The lawyer should flag significant deviations from precedent during deliberation. This is where your tribunal's scrutiny will likely focus.
