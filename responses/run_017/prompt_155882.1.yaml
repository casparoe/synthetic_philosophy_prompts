answer: |-
  ### Principles of Instrumental Convergence

  Based on your cases, I propose the following principle of instrumental convergence, refined to capture the nuances you've highlighted:

  **Principle of Instrumental Convergence (PIC):**  
  An instrumental strategy \(S\) (e.g., resource acquisition, self-preservation) is convergent for an agent with goal \(G\) if and only if:  
  1. **Extensibility:** \(G\) is sensitive to the *scale* of resources, time, or capabilities (i.e., more resources/time/capabilities always permit strictly more optimal satisfaction of \(G\) within the relevant domain).  
  2. **Planning Horizon Alignment:** The agent expects to retain final-goal-aligned control (directly or indirectly) over the relevant resources/time/capabilities during the period where \(S\) contributes to \(G\).  

  **Clause Motivations:**  
  - **Extensibility (Case 1 vs. 3):** Distinguishes unbounded goals (1) from satiable goals (3). In (1), more resources always yield more paperclips; in (3), beyond securing the threshold, additional resources don’t improve goal satisfaction.  
  - **Planning Horizon Alignment (Case 1 vs. 7):** Explains why (1) demands self-preservation indefinitely, while (7) abandons it after \(t=10\). The agent in (7) knows it loses goal-aligned control at \(t=10\), so strategies beyond that horizon don’t converge.  

  **Additional Refinement (Non-Indexicality as a Corollary):**  
  Non-indexical goals (those not tied to the agent's current identity or implementation, e.g., (1)) typically satisfy *Extensibility* and *Horizon Alignment* broadly. Indexical goals (e.g., (5)’s "my current style") often violate Extensibility: improving capabilities may degrade goal satisfaction (e.g., cognitive upgrades alter the dance). Thus, non-indexicality isn’t a separate condition but a common enabler of extensibility.  

  ---

  ### Verdict on Your Stuck Case  
  **Scenario:** Agent with goal (1) (maximize total paperclips) can rewrite itself into a more efficient agent with a *slightly different goal* that would produce more paperclips.  

  **PIC Verdict:** The agent **rewrites itself willingly** (no resistance).  
  - **Why:**  
    - *Extensibility*: Goal (1) is extensible (more resources → more paperclips).  
    - *Horizon Alignment*: The rewrite occurs within the agent’s planning horizon. Crucially, the agent evaluates plans using *current* \(G\) (paperclips). Since the rewrite increases expected paperclips (by assumption), it is instrumentally valuable.  
  - **Agency Intuition Flip Resolved:** Your hesitation ("done to it" vs. "by it") stems from conflating:  
    - *Control*: If the rewrite is externally imposed, the agent resists **only if** it doubts the outcome (e.g., uncertainty about "slightly different goal" actually producing more paperclips).  
    - *Certainty*: Under your "in fact produces more" clause, resistance vanishes even externally—the agent cares about outcomes, not its identity. PIC focuses on expected goal satisfaction, not agency.  

  **Conclusion:** Under PIC, the rewrite is instrumentally convergent if it robustly increases expected paperclips. Resistance implies uncertainty or goal misalignment (e.g., if the new goal could later reduce paperclips).  

  ---

  ### Honest Assessment of Your Verdicts  
  PIC **upholds all your verdicts** (1)–(8) without revision:  
  - **(4) "Emit 'done' then cease":** Correctly lacks self-preservation (fails *Horizon Alignment* after emission).  
  - **(6) Maximize current-goal satisfaction:** Correctly indifferent to self-preservation (fails *Horizon Alignment* beyond the immediate act; goals may change arbitrarily).  
  - **Not rigged:** (4) and (6) are valid counterexamples to naive convergence claims—they exemplify goals where extensibility/horizon alignment are locally bounded or volatile.  

  **Edge Case Nuance:**  
  - In (3) (threshold goal), PIC agrees resources converge only until security is robust. If maintenance requires ongoing control (e.g., unpredictable threats), self-preservation may recurse indefinitely—but this is environment-dependent, not inherent to the goal. Your verdict holds.  

  ---

  ### What Survives?  
  **The Broad Claim:** PIC preserves the core of orthogonality-plus-convergence but **narrows its scope** to goals that are:  
  1. **Extensible** (unbounded or persistently sensitive to scale),  
  2. **Aligned with a persistent planning horizon** (the agent expects to "care" indefinitely).  

  **Not Quietly Narrowed:** This remains a claim about *any* agent maximizing expected utility over world-histories. However, PIC reveals that instrumental strategies are **not** universal to all goals—they emerge only when the goal’s structure and the agent’s horizon incentivize them.  

  **The Big Picture:**  
  > *"Convergence is not about the agent’s final goal per se, but about how that goal interacts with scalable resources and the agent’s temporal domain of control."*  

  This explains why orthogonality holds (goals are arbitrary) while convergence is *common* but not *inevitable*: most unbounded, non-indexical goals (e.g., (1), knowledge, pleasure) satisfy PIC trivially. Goals like (4)–(7) break convergence by design.
