answer: |-
  Here's a side-by-side interrogation of causation practices in tort law and historiography, addressing your specific questions with confidence assessments and a focus on genuine disagreement:

  ### 1. Tort Law's Theory of Causation  
  **Presuppositions & Tensions:**  
  - **But-For as Default:** The core presupposition is a counterfactual dependence theory (event E caused injury I iff I would not have occurred without E).  
  - **Substantial Factor as Normative Patch:** The shift to "substantial factor" in overdetermination is *not* a rival metaphysical theory but a **normative exception** to avoid unjust outcomes. Doctrine treats it as a practical override, not a redefinition of causation (*Restatement (Third) of Torts: Phys. & Emot. Harm § 27*).  
  - **Apportionment Inconsistency:** Liability treats each sufficient cause as 100% responsible (non-rival, all-or-nothing), while apportionment treats causation as rivalrous and divisible (summing to 100%). **No single causal theory underpins both.** Apportionment covertly imports comparative fault or policy-driven allocation, mislabeled as "causal share."  

  **Confidence:** 95%. Doctrine explicitly distinguishes factual cause (resolved via but-for/substantial factor) from scope of liability/proximate cause and damages apportionment. Case law (*Corey v. Havener*, *Anderson v. Minneapolis Ry.*) shows courts prioritizing fairness over causal metaphysics.  

  ---

  ### 2. Historiography's Theory of Causation  
  **"Overdetermined" Meanings & Commitments:**  
  Historians use "overdetermined" primarily in senses (i) and (iv):  
  - **(i) Sufficiency given background:** Most common (e.g., "WWI was overdetermined: alliances, militarism, imperialism each sufficed given 1914 tensions").  
  - **(iv) Robustness:** Implicit in claims like "revolution was inevitable."  
  - *Not* typically (ii) (multiple independent paths) or (iii) (epistemic uncertainty).  

  **Incoherence with "Primary Cause":**  
  If an outcome is truly overdetermined (i/iv), labeling a "primary cause" is **pragmatic, not causal**. It signals:  
  - **Salience:** Temporal proximity or narrative focus (e.g., "Archduke's assassination" as immediate trigger).  
  - **Contrastive Explanation:** Answering "why here/now?" (e.g., "Why Berlin 1918? Leadership vacuum").  
  - **Intervention Potential:** Highlighting factors that could plausibly have been altered.  
  This *clashes* with overdetermination if presented as "most important cause," but historians rarely assert metaphysical primacy.  

  **Needed Changes:**  
  - Adopting (i) strictly: Historians would abandon "primary cause" as misleading.  
  - Adopting (ii): Would make narratives incoherent (no single "turning point" possible).  
  - Current practice survives through **explanatory pluralism**: Overdetermination describes structural inevitability; "primary causes" identify pivot points in contingent narratives.  

  **Confidence:** 85%. Historiography analysis relies on methodology texts (e.g., Carr's *What is History?*) and case studies (e.g., debates on WWI causes). "Primary cause" is often tacitly contrastive.  

  ---

  ### 3. Stress-Testing Your Causal Credit Rule  
  **Rule:** For each condition, average its "flip" score across all orderings.  
  - **Two-Fire Case:** Correctly assigns 50% each.  
  - **Pre-emption Case (e.g., Fire A destroys house; Fire B extinguished en route):**  
    Your rule assigns 50% to Fire B (it "flips" outcome in orderings where it's added last).  
    - **Defect?** Yes, if goal is actual difference-making. Law rightly ignores pre-empted backups (no actual causal role). This exposes a **flaw in law's symmetric/pre-emption distinction**: Both involve redundant causation, but law treats them differently for policy reasons (denying recovery for pre-emption avoids infinite liability).  
    - **Reconstructing Liability?** No. The rule can’t support full liability (sums to 100%), making it useless for tort’s initial liability stage.  

  **Historian Adoption:** Historians would reject this for:  
  - **Practicality:** Orderings of all background conditions are infinite/undefined.  
  - **Narrative Goals:** Undermines emphasis on agency, contingency, and meaning.  
  - **Output:** Equal shares for all sufficient conditions (e.g., militarism = alliance system = 33% for WWI) ignores explanatory context.  

  **Confidence:** 90% on pre-emption flaw. The rule is a form of "causal power" averaging (cf. Pearl's probability of necessity), but conflicts with actual causation in process-based theories.  

  ---

  ### 4. Core Disagreement: Purpose vs. Metaphysics  
  **Underdetermination Points:**  
  - **Tort Law:**  
    - But-for vs. substantial factor: Same verdicts in non-overdetermination cases.  
    - Apportionment: "Causal shares" could equally reflect fault, risk contribution, or policy.  
  - **Historiography:**  
    - "Overdetermined" (i) vs. (iv): Same verdicts (e.g., war inevitable).  
    - "Primary cause": Salience vs. intervenability often indistinguishable in texts.  

  **The Real Divide:**  
  - **Law’s Purpose:** Loss allocation (compensation, deterrence).  
    → Requires bright-line liability + divisible damages.  
  - **History’s Purpose:** Explanation (understanding, narrative coherence).  
    → Accepts causal multiplicity + prioritizes salient factors.  
  - **Incident Investigation’s Purpose:** Intervention (preventing recurrence).  
    → Demands a *controllable* "root cause," regardless of overdetermination.  

  **Metaphysical Biting Point:**  
  - Add a requirement to **quantify causal strength** (e.g., "Prove Factor A contributed 60% to the war"). Tort apportionment pseudo-attempts this but fails; historiography rejects it.  
  - Introduce **impossible worlds**: "Would the house burn if *only* Fire A occurred?" forces a choice between production vs. dependence theories.  

  **Budget vs. Status?**  
  - **Not exhaustive.** A third option: **Causation as a network of difference-makers**, where "sufficient cause" status is binary in actual world but credit depends on the inquiry's contrast class. Tort and history both use contrast classes implicitly (e.g., "but for defendant" vs. "normal conditions"; "why 1914 not 1910?").  

  **Confidence:** 80% on purposes as primary driver. The "third option" is consistent with Woodward’s interventionist theory.  

  ---

  ### Least Confident Claim & How to Settle It  
  **Claim:** Historians predominantly use "overdetermined" as *sufficiency given background* (i), not *robustness* (iv).  
  **Why Uncertain:** Texts often conflate inevitability ("robustness") with multiple sufficient conditions without specifying background stability.  
  **Settlement Method:**  
  1. **Empirical study:** Analyze 100 academic history texts using "overdetermined." Code for explicit definitions or implicit assumptions (e.g., "even without X, Y or Z would have caused it" vs. "this outcome survived minor changes").  
  2. **Philosophical surveys:** Poll historians on whether removing one "overdetermining" factor implies the *same outcome* or merely *an outcome*.  

  **Overall Confidence Map:**  
  - Tort’s normative overlay: **High**  
  - History’s pragmatic "primary cause": **High**  
  - Your rule’s pre-emption flaw: **High**  
  - Purpose as core divergence: **Medium-High**  
  - Overdetermination in history: **Medium**  

  The deepest friction isn’t metaphysical but *functional*: Tort seeks divisible responsibility; history seeks coherent explanation; incident investigation seeks leverage points. Each molds "causation" to fit.
