  Okay, this user is diving deep into causation across law and history, and they've set up a very structured query. Let me unpack their questions one by one.

  First, they're contrasting legal treatment of causation in torts (specifically symmetric overdetermination like the two-fire case) with historical explanations that use "overdetermined." The legal part seems solid—but-for causation fails in overdetermination, so courts use substantial factor or hold all sufficient causes fully liable. But then apportionment assigns percentages summing to 100%. That tension is interesting: same system treats causation as binary for liability but scalar for damages. The user wants to know what theory of causation underpins this. Is substantial factor a different metaphysical theory or just a normative patch? And can one theory coherently support both full liability and fractional shares? 

  For history, they're parsing different meanings of "overdetermined": sufficiency given background, multiple sufficient paths, epistemic uncertainty, or robustness. Historians say "overdetermined" but still prioritize primary causes. The user questions coherence here—how can you have primary causes if the outcome was inevitable anyway? They also mention their incident investigation work requiring a single "root cause," which clashes with historical multiplicity. 

  Their proposed causal credit rule (averaging over orderings) is clever but has issues. In pre-emption cases, it gives half credit to a backup cause that never acted, which law dismisses entirely. And it can't support full liability for multiple sufficient causes since shares sum to 100%. Would historians even want such a quantitative approach? 

  Underlying all this might be a meta-question: are these fields really disagreeing about causation, or just adapting concepts to their purposes (compensation/blame in law, explanation/narrative in history)? The user suspects the deepest split is whether causation is a fixed budget (divisible) or a non-rival status. 

  Hmm, answering this requires untangling:  
  - Legal doctrine's implicit metaphysics (is substantial factor causal or normative?)  
  - Historical practice's unstated commitments (which flavor of "overdetermined" do they mean?)  
  - Whether the user's rule exposes flaws in legal distinctions  
  - Where pragmatics overdetermines theory in both fields  

  The user explicitly wants confidence assessments and flags on shaky claims—good, this avoids overconfidence. Their background in incident investigation suggests they value actionable clarity, which might explain their frustration with historical "overdetermination." 

  Biggest challenges:  
  - Legal apportionment percentages are called "causal shares," but is that just labeling? Maybe it's really about fault, not causation.  
  - Historians' "primary causes" might be about salience or manipulability, not causal strength.  
  - The user's rule usefully quantifies but doesn't map to legal/historical instincts (e.g., pre-emption).  
