prompt: |-
  Two people in my policy-and-philosophy reading group spent most of an hour going at each other last week over a hypothetical bill, and since I'm chairing the next session I'd quite like to know who actually won rather than just nodding along.

  Setup: a legislature is openly considering banning, explicitly on grounds of public morality and not harm, the commercial production of photorealistic synthetic sexual material featuring only fictional adults — no real person depicted, consumed alone, so no victim, and if nobody ever finds out, no offence either. Call the pro-ban side Mara and the anti-ban side Theo.

  (1) Mara: the "no victim, no crime" move can't be the whole story, because criminal law already punishes plenty of things with no identifiable victim — cruelty to animals, mistreatment of corpses, consensual adult incest, some environmental offences. So the real question isn't whether victimless wrongdoing can be criminalised but which victimless wrongs count, and a society is entitled to protect the shared moral environment it depends on.
  (2) Theo: fine, but Hart doesn't need a pure harm principle, he needs a distinction between rules that hold a society's cooperative framework together and rules that just register majority disgust. Concretely — a coordination audit: criminalise only where my compliance sensibly depends on your compliance, like driving on one side, keeping contracts, not perjuring yourself. Self-regarding sexual conduct flunks that audit; animal cruelty and pollution can be recast as harm to sentient creatures or to identifiable present people.
  (3) Mara: the audit sounds principled but it's useless as a stopping rule, because moral norms are held up by mutual expectations too. Nobody thinks their private indulgence is being observed, yet the norm decays once enough people quietly stop treating it as binding, and you only find out afterwards — it's like antibiotic resistance, the evidence arrives once the thing is already gone. Demanding proof of decay before acting is demanding the one kind of proof you can only get by waiting till it's too late, so the right posture is precaution, not evidence of harm.
  (4) Theo: precautionary reasoning here is perfectly symmetric and therefore empty. Every liberal reform we now take as progress — decriminalising homosexuality, loosening divorce law — was opposed with exactly this "the moral fabric will fray" claim, and it was false then. You owe us a way to tell real fraying from moral panic, and "we'll know retrospectively" isn't one.
  (5) Mara: okay, then take irreversibility as the test instead of harm or evidence — enforce moral norms whose loss can't be undone. You can re-legalise a drug; you can't restore a norm once enough people have abandoned it. And underneath all this, you're assuming law is purely instrumental. It isn't: law also expresses what a society stands for, and you already accept expressive criminalisation for hate crime, so your objection isn't to moralism as such, it's to moralism you happen to disagree with.
  (6) Theo: irreversibility is cheap to allege and moral progress is often irreversible too, so the test cuts both ways and picks out nothing. On expressivism, I'll grant the law expresses things — but an expressive argument has to be won on the content of what's expressed, and a law can express "we protect the vulnerable" without expressing "we despise you," so expressivism doesn't get you to Devlin.

  Can you adjudicate this move by move — which of the six land, which are weak or question-begging, and where each of them is definately right about something the other sidesteps — and then say who's more right overall, plus what both of them are missing?

  Lead with your bottom line in the first sentence, then give the reasoning, no preamble and no restating the question. British English please.
reasoning: |-
  Hmm, the user wants me to adjudicate a policy debate between Mara (pro-ban) and Theo (anti-ban) about criminalizing fictional adult synthetic pornography. They've laid out six specific moves in their argument and want me to analyze each one, determine who won overall, and identify what both sides are missing.

  Looking at the debate structure: Mara starts by challenging the "no victim no crime" principle, citing existing victimless crimes. Theo counters with Hart's coordination principle. Mara then argues about norm decay and precaution. Theo responds with symmetry concerns about precautionary reasoning. Mara shifts to irreversibility and expressivism. Theo challenges both irreversibility and distinguishes between types of expressive law.

  For my analysis: Mara's first point is strong - she correctly identifies that criminal law does address some victimless wrongs, though she overstates with "plenty." Theo's coordination principle in move 2 is a valid Hartian distinction but arguably narrow. Mara's norm decay analogy in move 3 is insightful about social enforcement mechanisms, while Theo's symmetry argument in move 4 is devastating against precaution. Mara's irreversibility claim in move 5 is weak (easily alleged), though her expressivism point lands. Theo dismantles irreversibility in move 6 and makes a crucial distinction about expressive content.

  Overall, Theo wins on balance because his critiques of precaution and irreversibility hold, while Mara's expressivism point is valid but doesn't achieve her goal. Both miss important nuances: Mara ignores that moral progress often comes from challenging norms, while Theo underestimates how law shapes culture beyond coordination. They also both sidestep empirical questions about effects of such material and alternatives to criminalization.

  The user seems intellectually engaged but frustrated by the circular debate. They're chairing the next session and want clarity, not just more arguing. There's probably some social tension they want to manage. My response should be decisive but fair to both positions, with clear markers for each move's strength.
answer: |-
  Theo lands more telling blows overall, though Mara scores points on expressivism that Theo doesn't fully rebut.  

  **(1) Mara:** Strong opener. Correct that criminal law *does* punish some victimless wrongs (animal cruelty, corpse desecration), exposing Theo's potential over-reliance on "no victim, no crime". Weak on incest (often *does* involve harm/coercion concerns) and environmental offences (usually framed as harm to public/ecosystems). Lands the core challenge: the question isn't *if* victimless wrongs can be criminalised, but *which ones*. Sidesteps *why* this specific material qualifies.  
  **(2) Theo:** Effective refinement. Hart's coordination principle ("my compliance depends on yours") is a coherent, established filter. Correctly distinguishes core cooperative rules (contracts, perjury) from purely self-regarding acts (private sexual fantasy). Successfully recasts animal cruelty/pollution as involving sentient victims or public harm, countering Mara’s examples. Weakness: possibly underplays how deeply *some* moral norms underpin social cooperation beyond immediate coordination.  
  **(3) Mara:** Insightful on norm decay dynamics. Correct that norms rely on *believed* compliance and decay can be irreversible/only visible too late. The antibiotic resistance analogy has force against demanding observable harm. Weakness: Overstates "precaution" as the *only* posture. Doesn't prove *this specific norm* is essential or that decay *would* occur. Sounds alarmist without evidence. Theo sidesteps the core point about invisible norm erosion.  
  **(4) Theo:** Devastating symmetry argument. Historically, identical "moral fabric" fears *were* falsely deployed against liberal reforms (homosexuality, divorce). Successfully forces Mara to justify *why this case is different*. "We'll know retrospectively" *is* useless as a guide for legislators. Mara sidesteps the historical counterexamples and the demand for a falsifiable test.  
  **(5) Mara:** Irreversibility claim is weak. Easily alleged ("you can't un-lose a norm!") but unproven here and reversible norms *do* sometimes re-emerge. Theo rightly questions its usefulness. **Strong on expressivism:** Correct that law inherently expresses values (hate crime laws prove Theo accepts this). Exposes Theo's potential inconsistency – his objection *is* about the *content* of the morality, not expressivism *per se*. Sidesteps proving *why* this ban expresses something essential.  
  **(6) Theo:** Correctly dismantles irreversibility as a test – moral progress (e.g., ending slavery) is also irreversible, rendering the test directionless. **Crucially lands the expressivism riposte:** Granting law expresses values doesn't justify criminalising mere disgust (Devlin). Distinguishes between expression protecting the vulnerable (acceptable) and expression enforcing majority disdain for private conduct (unacceptable). Forces Mara to win on the *moral merit* of what's expressed. Doesn't fully engage with Mara’s point that society *might* legitimately express disapproval of certain acts as degrading, even if private.  

  **Who's more right? Theo.** His coordination principle (Move 2) provides a clearer, less arbitrary limiting principle than Mara's appeals to precaution (Move 3) or irreversibility (Move 5). His historical symmetry argument (Move 4) fatally undermines Mara's precautionary stance, and his expressivism distinction (Move 6) successfully contains Mara's strongest point (Move 5), preventing a slide into pure legal moralism. Mara exposes flaws in simplistic "no victim" arguments but fails to provide a robust, non-arbitrary justification for *this* ban beyond asserting societal preference.  

  **What both miss:**  
  *   **Mara:** Underplays the **"chilling effect"** and **practical enforcement nightmare** of criminalising purely private, synthetic acts. Avoids defining the precise **"harm to the moral environment"** or why *this* material uniquely causes it. Neglects **alternatives to criminal law** (education, social stigma) for sustaining norms.  
  *   **Theo:** Under-explores how **law shapes culture beyond coordination** – criminalisation *can* reinforce stigma/norms even for "self-regarding" acts. Too quickly dismisses potential **indirect harms** (normalisation of extreme acts, impact on attitudes) without evidence. Minimises how **defining "cooperation"** itself relies on underlying moral consensus.  
  *   **Both:** Fail to engage with **empirical evidence** about the actual effects of such material on consumers or societal attitudes. Overlook **nuances within the material** (e.g., depicting non-consent vs. wholesome acts). Ignore **comparative law/policy** approaches in other jurisdictions. Sidestep the **slippery slope concerns** (what *else* might fit Mara's criteria?). Ultimately, both argue abstract principles without grounding the *specific* harm or value at stake in this synthetic media.
