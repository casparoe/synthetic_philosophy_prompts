prompt: |-
  I've been hacking on a little font-fallback tool — the thing where your browser asks for a typeface the machine doesn't have and quietly swaps in another one instead of showing boxes. Right now I just match on the Unicode character: take the code point, find any font with a glyph for it. Writing that made me notice how weird the standards practice is about what counts as the same letter. Latin "a" and the Cyrillic "а" that can look pixel-identical get separate code points, but the CJK ideographs that Chinese and Japanese write with somewhat different strokes get one shared code point — the Unicode folks apparently say they encode characters, not glyphs. So sameness there looks like role in a script, while in the first case it looks like script membership rather than shape, even though the shape agrees completely.

  My own half-baked rule for the tool was: two glyphs are the same letter if you can slowly morph one into the other while readers keep reading it as that letter the whole way, with no point where it flips into a different letter. I like it because I never have to say what an "a" is. But I think it breaks on italics: in alot of faces the italic "a" is the single-storey form, and there's no way to get to it from the double-storey roman "a" in small steps without passing through shapes nobody would read as an "a" at all — yet everyone, type designers included, treats those as the same letter without blinking.

  So what does this whole business actually presuppose about what makes every "a" an "a"? Is there one view underneath font substitution, Unicode, and the way a family bundles roman, italic and bold as versions of one design — or several half-theories that just happen not to collide? What would a fallback tool built on a different view do differently? And is my morph rule just one of those views with extra steps, or does it genuinely give different answers somewhere?

  Give me the reconstruction, then a one-sentence bottom line naming the view the existing practice really *commits* us to rather than merely fits well with, and then, as the very last line, a tag:

  \answer{SHAPE | ROLE | FAMILY-RESSEMBLANCE | OTHER}
reasoning: |-
  Okay, let's tackle this user's query. They're working on a font-fallback tool and noticing inconsistencies in how Unicode handles character sameness across different scripts. The user points out that Latin and Cyrillic "a" have different code points despite looking identical, while CJK ideographs share the same code point even with different glyphs. Their morphing rule for determining same letters breaks on italics because transitioning between roman and italic "a" involves shapes that aren't recognizable as "a". 

  The user wants to understand the underlying principles behind font substitution, Unicode, and typeface families. They also wonder if their morphing rule aligns with existing practices or offers a different approach. The core questions are: what makes every "a" an "a", and what view do current practices commit to?

  First, I need to reconstruct the conceptual foundations. Unicode's principle is that characters are defined by their linguistic role in a script, not by visual appearance. This explains why Latin and Cyrillic "a" are separate—they belong to different scripts. CJK unification happens because the characters share a common historical origin and semantic role, despite glyph variations. This is the "ROLE" view.

  For typeface families, bundling roman, italic, and bold as one design relies on shared typographic conventions. Designers and users accept that stylistic variations like italics are contextual representations of the same character. The user's morphing rule fails here because it focuses on continuous visual transition, which isn't necessary in practice. The "FAMILY-RESSEMBLANCE" view fits here, where different styles are linked by convention rather than visual continuity.

  Font substitution in browsers prioritizes legibility and user experience. It uses Unicode's character definitions but also considers typographic context, like substituting a similar font style. This blends "ROLE" and "FAMILY-RESSEMBLANCE," ensuring the substituted glyph performs the same linguistic function and fits the text's style.

  The user's morphing rule introduces a "SHAPE" based continuity, which conflicts with existing practices. For example, the transition between roman and italic "a" isn't smooth, but they're still considered the same letter. This shows that visual continuity isn't essential; instead, conventional acceptance within a script system is key.

  Underneath all this, Unicode's commitment to "ROLE" is fundamental. It's about the character's function in text, not its appearance. The bottom line is that existing practices commit to a "ROLE" view, where identity is tied to linguistic and script conventions. The tag should be "ROLE" since that's the core principle Unicode and font substitution rely on, even if other factors like family resemblance play a part in implementation.
answer: |-
  Here's the reconstruction of the conceptual foundations and your questions:

  1.  **Unicode's Core Premise:** Unicode encodes *abstract characters* defined by their *linguistic role within a writing system*. An "a" is the lowercase letter representing a specific phoneme in the Latin alphabet. A Cyrillic "а" represents a different phoneme within the Cyrillic alphabet. Their visual similarity is coincidental; their distinct linguistic roles mandate separate code points. CJK Han unification prioritizes the shared *logographic meaning and historical origin* across languages over minor glyph variations, treating them as the same abstract character despite stylistic differences. **Commitment: Characters are functional units within a script system.**

  2.  **Typeface Family Bundling:** Bundling roman, italic, and bold styles treats them as *stylistic variations* of the *same underlying character*. This presupposes that the character's *identity transcends specific glyph shapes* within a defined stylistic context (upright, slanted, weight). The shift from double-story to single-story "a" is accepted because both are *conventionally recognized* representations of the Latin lowercase "a" within their respective styles. **Commitment: Character identity is stable across conventional stylistic variations within a script.**

  3.  **Font Fallback Practice:** Current fallback implicitly adopts Unicode's role-based definition ("find *any* glyph for this code point") but is often augmented by heuristics trying to match style (serif/sans, weight) *after* ensuring the character is rendered. Its core goal is *legibility* (avoiding .notdef) based on character role, not aesthetic consistency. A tool strictly adhering to Unicode's role view would substitute *any* available glyph for the code point, regardless of stylistic clash.

  4.  **Your Morph Rule (SHAPE + Continuity):** This focuses on *visual similarity and continuous transformation*. It presupposes that character identity is fundamentally tied to a recognizable *visual essence* that can be smoothly morphed. It directly conflicts with:
      *   **Unicode:** Latin "a" and Cyrillic "а" *could* be morphed (visually identical start/end), but Unicode separates them based on role. Your rule would group them as the "same letter", contrary to Unicode.
      *   **Typeface Families:** The roman double-story "a" to italic single-story "a" morph breaks continuity, so your rule would see them as *different letters*, contradicting universal typographic practice.
      *   **Fallback Implication:** A fallback tool using your rule would potentially substitute visually similar glyphs *across scripts* (e.g., Latin "a" for Cyrillic "а") or *refuse* to substitute roman for italic within the same script family – both highly undesirable outcomes.

  **The Bottom Line:** Existing practice fundamentally commits to a **ROLE**-based view of character identity, where a glyph represents a specific functional unit within a defined writing system, independent of its specific visual form or stylistic variation.

  \answer{ROLE}
