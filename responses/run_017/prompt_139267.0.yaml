prompt: |-
  Been going back and forth with a friend about Good's theorem — the result that for a Bayesian expected-utility maximiser facing a fixed menu of acts, free information has non-negative expected value *before* you look, so "you can never lose by finding out" is meant to be a theorem and not a slogan. She's at about 0.02 that a real adult human, in a real decision, ever faces free information with genuinely negative value. I'm around 0.35 and defintely can't defend the number. So give me yours, decomposed.

  The headline question, sharpened: pick a randomly chosen decision by an adult human today where some costless, relevant piece of information is available — a test result, a review, a spoiler, a background check, a paternity thing, whatever. What's your credence that the expected value of acquiring it, from the standpoint of the person *before* they get it, counting everything they care about, and granting that the information itself is free to acquire, is actually negative? Not "uncomfortable", not "costly in a way I've smuggled back in under the word free" — negative in the decision-theoretic sense. If you think that's still ill-posed, say which sharpening you're using and answer that instead, but I do want a number.

  I want sub-questions with numbers on each, not a vibe. Here are the ones I think are load-bearing; add or drop as you like:

  - Menu expansion, or what I've started calling the eligibility trap: learning you carry variant X also makes you eligible for — and socially funnelled toward — a treatment or trial you then end up taking, and taking it is worse for you than anything on your old menu. I invented this case, but it looks to me like the standard proof just breaks, because the proof holds the option set fixed while the information is what changes it. How often does learning literally *add* options, and how often are the added ones traps?
  - Observability: someone else sees that you looked, or what you found — insurer, employer, family — and updates, and you can't credibly not-know. How much of the theorem's reassurance is really just the single-agent framing doing all the work?
  - Intrapersonal commitment failure: you can't bind future-you, and the information makes some tempting act salient, or future-you simply wants different things.
  - Preference change: the information changes what you care about, and you can foresee that at the time you decide to look.
  - Non-expected-utility agents: ambiguity-averse / worst-case-ish agents can be information-averse in a way EU agents can't be. What share of real behaviour do you think is better described that way?
  - Un-thinkability: you plan to ignore the information and can't — you lose the option of acting as if you didn't know. Spoilers, the letter you shouldn't open.
  - Bookkeeping: how much of the apparent negative value is really processing cost, attention, or anxiety that I've cheated by ruling out in the setup?

  For each: a rough number for how often it's live in a real case, and how often, when it is live, it actually flips the sign. Then combine them somehow, and tell me which term your headline number is most sensitive to and which one you're least confident in.

  Then the part I actually care about: split your number into two buckets. Bucket A: cases where the *spirit* of the theorem is false for real agents, i.e. you really can lose by looking. Bucket B: cases that are only "counterexamples" because the theorem was always about a different quantity — the value of a signal inside a fixed decision problem — so nothing has been shown except scope. My worry is that most of my 0.35 is B and I should come down toward her. Tell me if you agree, and where you think the disagreement between a 0.35 person and a 0.02 person most likely lives.

  Finally: what would change your mind, and where is your own reasoning most likely to be broken? Give me something that would move you by 0.1 or more in either direction. (Mine, I suspect, is that I'm quietly counting "I regret knowing this" as negative expected value, which it maybe isn't.)

  No citations, please — I can't check them and I don't care who proved what. If there's a result you want to lean on, just say what it says and how strong you take it to be.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're debating Good's theorem with a friend, specifically whether free information can ever have negative expected value for a real human. The user is at 0.35 credence that this happens, while their friend is at 0.02. They want my decomposed probability and analysis.

  First, I need to recall Good's theorem properly. It states that for a Bayesian expected-utility maximizer with a fixed set of options, the expected value of free information is non-negative. But the user is questioning if real-life scenarios break the theorem's assumptions. Their sub-questions highlight key areas where the theorem might not apply.

  Looking at their decomposition points:
  - **Menu expansion**: When information adds new options that turn out to be worse. The user calls this the "eligibility trap." I need to consider how often learning something opens up choices that are detrimental.
  - **Observability**: If others see that you accessed the information, like insurers or employers, and this affects you negatively. This introduces multi-agent issues.
  - **Intrapersonal commitment**: Future self might act against current interests after gaining information. Procrastination or temptation could play a role.
  - **Preference change**: Information might alter what you value, and you foresee this when deciding to look. For example, genetic testing changing how you view your identity.
  - **Non-EU agents**: People aren't perfect Bayesians. Ambiguity aversion might make them avoid information.
  - **Un-thinkability**: Once you know, you can't un-know. Spoilers are a classic example; even if you plan to ignore, it affects you.
  - **Bookkeeping**: Anxiety or attention costs that aren't monetary but still detract from utility. The user wants these excluded, but they might creep in.

  For each, I need to estimate two things: how often it's relevant in a random decision, and when it is, how often it flips the value to negative. Then combine these into an overall probability.

  The user also wants buckets: A (the theorem's spirit is violated) vs B (just scope issues). They suspect their 0.35 is mostly B and they should lower it. I need to assess if that's true.

  Finally, I should identify what would change my mind and where my reasoning might be weakest. The user admits they might conflate "regret knowing" with negative expected value.

  Breaking it down:
  - **Menu expansion**: Say 10% of cases involve new options. Half of those are traps? So 5% of decisions, and if 30% of those are negative, that's 1.5% contribution.
  - **Observability**: Maybe 15% of decisions involve observability. If 40% of those lead to negative updates by others, and half of those result in negative EV, that's 3%. 
  - **Intrapersonal issues**: Common, maybe 25% of cases. But flipping to negative only 10% of the time? 2.5% contribution.
  - **Preference change**: Rare, say 2% of cases. High flip rate (80%)? 1.6%.
  - **Non-EU agents**: Many people are ambiguity-averse. If 30% of decisions, and 20% flip, that's 6%.
  - **Un-thinkability**: Spoilers, etc. Maybe 5% of cases, 60% flip rate? 3%.
  - **Bookkeeping**: Often present, but excluded by setup. If included, it'd be high, but user says no. So 0%.

  Summing these gets me to around 18.6%. But there's overlap, so I'll adjust down to 12-15% overall probability.

  Buckets:
  - **Bucket A** (true violations): Observability and non-EU agents. Observability involves others, and non-EU isn't covered by theorem. Say 7%.
  - **Bucket B** (scope issues): Menu expansion, intrapersonal, preference change, un-thinkability. The theorem assumes fixed options and consistent preferences, which these violate. Say 6.5%.

  Headline number around 0.135, lower than user's 0.35. Main sensitivity to non-EU agents and observability. Least confident in preference change estimates.

  What would change my mind? Seeing studies on real info-seeking behavior. If data shows high avoidance rates for certain info (like genetic tests), I'd increase probability. If evidence shows people rarely face observability penalties, I'd decrease.

  User's potential flaw: Equating regret with negative EV. Regret might not make the info acquisition itself negative if the decision was still correct at the time.
answer: |-
  Here's my decomposed analysis for your headline question: **In a randomly chosen decision by an adult human today involving costless, relevant information (e.g., test result, review, spoiler), what's my credence that the expected value (EV) of acquiring it—before looking, counting all they care about, and assuming zero acquisition cost—is negative?** My headline credence is **0.135** (13.5%). I'll break this down step by step, following your structure.

  ### Key Assumptions
  - "Free" means zero direct or indirect costs (time, attention, anxiety, social friction) are incurred during acquisition. If costs exist, they're excluded.
  - "Relevant" means the information could potentially change the decision.
  - EV is assessed from the person's pre-information perspective, with rational expectations.
  - "Randomly chosen decision" weights common scenarios (e.g., medical tests, reviews, news) more than rare ones.
  - Overlap between categories is handled by capping the combined probability (no double-counting).

  ### Sub-Questions: Decomposition
  For each factor, I estimate:
  - **Base Rate (BR)**: % of real decisions where this factor is *live* (applicable).
  - **Flip Rate (FR)**: % of live cases where it *flips EV to negative*.
  - **Contribution (C)**: BR × FR = % of all decisions where this factor causes negative EV.
  - **Notes**: Why BR and FR are plausible.

  1. **Menu Expansion (Eligibility Trap)**  
     - BR: 10% (Learning often adds options, e.g., genetic tests enabling new treatments, job offers requiring background checks).  
     - FR: 15% (Added options are traps when they're riskier, lower-EV, or socially pressured; e.g., unnecessary surgery with side effects).  
     - C: 10% × 15% = **1.5%**  
     - *Notes*: Common in healthcare/employment. FR is low because added options are usually beneficial, but traps exist in high-stakes, asymmetric-info domains.

  2. **Observability (Others See You Looked/Found)**  
     - BR: 15% (e.g., insurers accessing medical records, employers seeing credit checks, partners noticing paternity tests).  
     - FR: 40% (High when others' updates harm you, e.g., premium hikes, lost job opportunities, relationship damage).  
     - C: 15% × 40% = **6.0%**  
     - *Notes*: Dominant factor. Single-agent framing ignores real multi-agent incentives. FR is high because penalties can be severe and predictable.

  3. **Intrapersonal Commitment Failure**  
     - BR: 25% (Common in addictive/impulsive contexts: e.g., checking stock prices → reckless trading, spoilers → ruining enjoyment).  
     - FR: 10% (Low because most people manage self-control; flips when temptation overrides plans, e.g., gambling after seeing odds).  
     - C: 25% × 10% = **2.5%**  
     - *Notes*: BR high due to human psychology; FR low because pre-commitment often works.

  4. **Preference Change**  
     - BR: 2% (Rare: e.g., genetic risk info altering life goals, trauma details changing values).  
     - FR: 80% (High when foreseeable change reduces utility, e.g., "I wish I didn't know" leading to depression).  
     - C: 2% × 80% = **1.6%**  
     - *Notes*: Niche but potent. Requires strong evidence that preferences shift *because* of info and this is anticipated.

  5. **Non-Expected-Utility Agents**  
     - BR: 30% (Ambiguity aversion is widespread: e.g., avoiding medical tests due to "fear of bad news").  
     - FR: 20% (Flips when worst-case outlook dominates, e.g., not wanting to know a terminal prognosis).  
     - C: 30% × 20% = **6.0%**  
     - *Notes*: Major factor. Ambiguity-averse agents can rationally avoid free info if it increases perceived risk.

  6. **Un-Thinkability (Can't Ignore)**  
     - BR: 5% (e.g., spoilers, traumatic content, irreversible knowledge like paternity).  
     - FR: 60% (High when ignorance is bliss, e.g., spoilers reducing enjoyment despite plans to avoid).  
     - C: 5% × 60% = **3.0%**  
     - *Notes*: BR low as most info can be compartmentalized; FR high when emotional impact is unavoidable.

  7. **Bookkeeping (Anxiety/Attention Costs)**  
     - BR: 0% (Excluded by your setup; "free" means no costs).  
     - FR: N/A  
     - C: **0%**  
     - *Notes*: I assign 0% because you ruled this out. If included, BR would be 50%+ and FR high, making C huge—but that violates your query.

  **Combined Probability**: Sum of C values = 1.5% + 6.0% + 2.5% + 1.6% + 6.0% + 3.0% = 20.6%. But due to overlaps (e.g., observability + non-EU in medical tests), I apply a 35% overlap penalty (conservative estimate), reducing it to **13.5%** (0.135).  
  - **Most Sensitive Factor**: Observability (C drops to 9.1% if BR/FR halved).  
  - **Least Confident Factor**: Preference Change (hard to measure "foreseeable" changes; FR could be 20-100%).  

  ### Bucket Split: A vs B
  - **Bucket A (Spirit False)**: Cases where the theorem's core insight—"you can't lose by looking under rationality"—fails for real agents. **0.07** (7%).  
    - *Includes*: Observability (6.0%) + Non-EU agents (6.0%) + Intrapersonal failure (2.5%) = 14.5%, minus 50% overlap → **7%**.  
    - *Why A?* Observability and non-EU agents violate the single-agent, expected-utility assumptions. The theorem isn't robust to these real-world features.  

  - **Bucket B (Scope Issue)**: Cases where the theorem holds for its defined quantity (fixed decision problem), but humans face a broader problem. **0.065** (6.5%).  
    - *Includes*: Menu expansion (1.5%) + Preference change (1.6%) + Un-thinkability (3.0%) = 6.1%, minus minor overlap → **6.5%**.  
    - *Why B?* These involve changing the option set or preferences, which the theorem explicitly excludes. Nothing "false"—just misapplied.  

  **Agreement with You**: I agree that most of your 0.35 is likely Bucket B. Menu expansion, preference change, and un-thinkability are scope issues, not failures of the theorem. Your friend's 0.02 might ignore Bucket A entirely, while your 0.35 overweights B. The core disagreement probably lives in:  
  - **Observability**: You both might underestimate how often others' reactions flip EV negative (e.g., in finance/healthcare).  
  - **Non-EU Agents**: Your friend may assume people are closer to ideal Bayesians than they are.  

  ### What Would Change My Mind
  - **+0.15 Increase** (to 0.285): Strong evidence that ambiguity aversion dominates high-stakes decisions. E.g., data showing >40% avoid free medical/genetic info due to risk aversion (not cost). This boosts Non-EU BR/FR.  
  - **-0.10 Decrease** (to 0.035): Proof that observability penalties are avoidable >90% of the time (e.g., via privacy laws). Or data showing menu traps are negligible (e.g., added options rarely harm).  
  - **My Biggest Weakness**: I might conflate "observed negative outcomes after info" with true negative EV. E.g., if someone regrets knowing but the info still improved decisions, EV isn't negative—it's emotional noise. I'm downgrading this (hence low FR for intrapersonal/preference), but it could be leaking in.  
  - **Your Potential Flaw**: You suspect correctly. "Regret" isn't negative EV if the action was ex-ante optimal. Anchoring on regret likely inflates your 0.35 via Bucket B factors.  

  **Final Headline**: 0.135, with Bucket A at 0.07 (real failure) and Bucket B at 0.065 (scope). I side with your friend that negative EV is rare, but defend 0.135 as plausible—driven by observability and non-EU agents. If you exclude Bucket B, you should come down substantially.
