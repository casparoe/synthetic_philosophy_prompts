answer: |-
  ### Constructed Case: Fine-Grained Motion Detection in a Vision Transformer

  **Scenario:** Consider a vision transformer (ViT) trained for a wildlife monitoring task on static images, classifying animal species and a secondary feature F: "whether the animal is in motion" (e.g., running, flying). During training, F is strongly correlated with simple cues: motion blur, limb posture, and background context (e.g., splashes for swimming). The model achieves high accuracy on both tasks. We focus on an intermediate layer’s patch embeddings for the central animal region (subsystem S). After training, we evaluate on a distribution-shifted test set where F is decorrelated from all training cues: static images show animals in "motion-typical" postures without motion (e.g., a deer with legs extended but standing still) and moving animals in "static-typical" postures (e.g., a bird with wings folded but falling), with all blur/splash cues removed. The model maintains high F-accuracy on the shift, indicating it learned robust motion detection. Now:  
  - **Decoding test fails:** Linear probes (e.g., logistic regression) and sparse dictionaries applied to S yield F-accuracy ≤55% (chance) on the shifted set. A heavy nonlinear probe (e.g., a 5-layer MLP) achieves 95% accuracy, but this requires substantial computation.  
  - **Causal test succeeds:** Activation patching (swapping S between inputs differing only in F) flips the motion output deterministically while leaving species classification unaffected. Ablating S (zeroing out patches) reduces F-accuracy to chance but only slightly degrades species accuracy.  
  - **Etiological context:** The shift breaks all training correlations, forcing reliance on the model’s internal generalization.  

  ---

  ### Verdicts from the Three Views
  1. **Reader/Decoding View (No representation):** F is not represented in S because no simple readout recovers it above chance. The heavy nonlinear probe’s success is dismissed as the probe *adding* the representation through computation, not extracting it from S. The view holds that representations must be "cheaply observable" to count.  
  2. **Consumer/Causal-Role View (Represents F):** Downstream layers treat S as F—intervening on S directly controls motion-sensitive behavior. Ablation confirms S is causally necessary for F-specific performance. Thus, S’s content is F because of its functional role.  
  3. **Etiological/Selected-For View (Represents F, conditionally):** The system was selected during training to detect F, even though proxies are broken in the shift. The causal evidence shows the mechanism still performs its function, so it represents F. The shift forces reliance on causal role over historical correlations.  

  **Result:** Pluralism fails—views disagree (No/Yes/Yes). Decoding denies representation, while causal and etiological views affirm it.  

  ---

  ### Analysis of the Case  

  #### 1. **Key Feature and Its Necessity**  
  The **distribution shift combined with nonlinear encoding** does the work. During training, F is linearly decodable from S via posture/blur cues. After the shift, these cues are removed, forcing the model to rely on subtle, non-linear patterns (e.g., micro-texture distortions from motion, learned through ViT’s self-attention). A simple probe fails because these patterns are high-dimensional and entangled; a heavy probe succeeds by reconstructing the decision boundary.  
  - **Remove the shift:** On the original test set, linear probes achieve 90% F-accuracy. Decoding and causal views agree: S represents F. Etiological view also affirms. Agreement collapses the disagreement.  
  - **Make the probe linear (or small):** If a linear probe worked post-shift (e.g., if the model had linearly separable motion features), decoding view would say "yes". But in this case, linearity fails, forcing decoding to say "no". The case only works because the encoding is complex *and* the shift breaks simple correlations.  

  #### 2. **The Core Objection: Downstream as Decoder**  
  **Objection:** The downstream motion-classification head (a shallow MLP) can read F from S. Isn’t this head itself a "decoder"? If so, decoding succeeds (via the head), refuting the reader view’s "no".  
  **Reply:** This objection conflates *external* decoding (probes) with *internal* consumption. The reader view requires representations to be *externally* decodable with "simple" methods (e.g., linearity) for interpretability or cognitive transparency. The downstream head is:  
  - **Not simple:** It’s a trained MLP (2 layers, ReLU), making it a computationally substantial consumer.  
  - **Not external:** It’s part of the system’s causal machinery, not a tool for analysis.  
  The reader theorist rejects internal consumers as decoders because their test is about observer access—e.g., "Can *we* read F without reimplementing the network’s computation?" Here, we cannot (without a heavy probe), so decoding says "no". Meanwhile, the causal view cares about internal use, so it says "yes". The case remains interesting because it isolates a representation that is *operationally private* (externally opaque but internally critical), showing the tests diverge on what counts as "having" a representation.  

  #### 3. **Strongest Attack from Decoding View and Reply**  
  **Attack:** "Your causal interventions (e.g., activation patching) are themselves a form of readout. By patching S and observing behavior, you’re using the downstream system as a probe. This shows S *can* be decoded—by the network itself! Thus, decoding evidence isn’t negative; your ‘heavy external probe’ is irrelevant. S carries information about F, but that doesn’t mean it *represents* F—correlation isn’t content. The behavior change could arise from S’s causal links to other variables (e.g., species), not F specifically."  
  **Reply:**  
  - **Interventions vs. readouts:** Patching tests causal role, not decodability. It shows S is *treated as* F by consumers, not that F is readable from S. The attack equivocates "carrying information" (which S does) with "being interpretable" (which it isn’t).  
  - **Underdetermination addressed:** The attack suggests F might not be the true content. But in the shift, F is decorrelated from all other features (e.g., species, posture), and patching *only* affects motion output. Control experiments (patching non-S regions) show no F-sensitivity. Thus, S’s causal role is F-specific.  
  - **Information vs. representation:** Decoding confuses correlation with content. Yes, S carries information about F, but the causal view argues content arises from *how* that information is used. Here, usage is F-specific, so it represents F. The decoding attack reduces to denying causal role as sufficient for representation, which is the core disagreement.  

  ---

  ### Why This Shows Pluralism Fails  
  Pluralism—accepting any operational test as sufficient—yields contradictions: decoding denies F-representation, while causal and etiological views affirm it. This isn’t mere incompleteness; it’s inconsistency. The case forces etiological view to rely on causal role (due to shift), aligning it against decoding. The disagreement persists because the tests target different things: observer access vs. functional integration. No stipulation: verdicts emerge from applying each view’s criteria to the same (S, F). The model isn’t broken—it generalizes robustly—and F is natural (motion in images). This is implementable today with a ViT trained on datasets like iNaturalist with synthetic motion/shifted examples.
