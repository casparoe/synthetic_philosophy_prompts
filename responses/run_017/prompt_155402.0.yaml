  But note: the model might have learned a very specific, non-linear feature that is only present in the training data and that still holds in the shift? We must ensure that the shift breaks all linear decodable features but leaves a non-linear one that the model uses.

  Reply: We can construct the shift to break all simple correlations. For example, in the motion case, we can have animals in motion with every possible posture and background, and stationary animals with every posture and background, so that posture and background are independent of motion. Then, the only way to detect motion is by subtle, non-linear cues that the model learned. This is realistic: for example, the model might have learned to detect muscle tension or wind effects that are present in motion but not in stationary, and these are complex patterns.

  Therefore, the case holds.

  **Final Scenario in one paragraph**

  Consider a vision transformer (ViT) trained to classify animal species and whether the animal is in motion (F) from static images. The training set has motion highly correlated with body posture and background cues (blur, splashes). We focus on the token embeddings of the animal's body (S) in intermediate layers. After training, we test on a distribution-shifted set where motion is decorrelated from posture and background (e.g., motion with stationary postures and vice versa, without blur/splash). On this shift, linear probes on S fail to decode F (accuracy near chance), but a deep non-linear probe (e.g., 3-layer MLP) succeeds. Activation patching: replacing S from a moving animal image into a stationary one flips the motion output (but not species), and ablating S destroys motion classification but not species. Thus, decoding (external) says S does not represent F, but causal role says it does. The etiological view, challenged by the shift, still attributes representation due to the system's function and the causal role in the shift.

  **Key feature**: The distribution shift breaking simple correlations and leaving only a complex, non-linear encoding of F in S that the internal head (a shallow MLP) can use but external linear probes cannot.

  **Without shift or with linear probe working**: Agreement that S represents F.

