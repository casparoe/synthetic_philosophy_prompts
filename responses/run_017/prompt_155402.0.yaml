  We are constructing a case where:
  - Decoding evidence is negative: no simple readout (linear probe, sparse dictionary, etc.) recovers feature F from state S above chance, but a heavy nonlinear probe does.
  - Causal evidence is strong: interventions on S (activation patching, ablation) show that downstream behavior depends on S in a way that tracks F, and ablating S wipes out F-sensitivity while leaving other task performance intact.
  - We have a distribution shift that breaks correlations between F and training proxies, so the etiological view must rely on the causal role to explain representation.
  - The model is competent and not broken.

  Idea: Use a vision transformer (ViT) for a fine-grained classification task, but with a twist.

  Candidate Case: 
  **Task**: Classifying images of animals in natural settings, but with a specific feature F: "whether the animal is in motion" (e.g., running, flying, swimming) versus stationary. Note that motion is a dynamic feature, but we are using static images. During training, motion is correlated with specific body postures (e.g., legs extended for running, wings spread for flying) and background cues (e.g., motion blur, splashes). However, the model must learn to represent motion per se because the task requires it (e.g., for a downstream conservation monitoring application that counts active animals).

  **Model**: A ViT trained on a dataset where motion labels are provided, but the model is also trained to classify species. So the output heads are two: one for species and one for motion. The motion head is a shallow MLP that takes the [CLS] token. However, we are interested in an intermediate representation: the patch embeddings of the animal's body (say, a set of tokens corresponding to the animal region).

  **Subsystem S**: The set of token embeddings corresponding to the animal's body in the ViT (we can use a segmentation mask to identify these tokens). We'll call this set of vectors S.

  **Feature F**: "Animal in motion".

  **Training**: The model is trained on a dataset where motion is highly correlated with body posture and background. But then we do a distribution shift: we test on images where the animal is in motion but in postures that were stationary during training (e.g., a bird with wings folded but falling, so in motion) and stationary animals in postures that were typical of motion (e.g., a deer with legs extended but standing still). Also, remove background cues (no motion blur, no splashes) in the test set.

  **Decoding Test**:
  - Simple readouts (linear probe, sparse coding) on S fail to predict F above chance on the shifted test set because the correlations with posture and background are broken. However, a heavy nonlinear probe (e.g., a deep MLP) can still decode F from S because it can learn the complex, non-linear patterns that are still present in S that correlate with motion (e.g., subtle texture or shading cues that the model uses).

  **Causal Test**:
  - *Activation Patching*: Take two images: one with motion (F true) and one without (F false), but both with the same species. Patch the S tokens from the motion image into the no-motion image (and vice versa). We observe that the motion output flips according to the patched S, while the species output remains unchanged (if we patch only the animal region). This shows that S is causally responsible for the motion classification.
  - *Ablation*: If we ablate S (set the tokens to zero or resample from a neutral distribution), the motion classification accuracy drops to chance, but species classification (which relies more on the head or other parts) remains high.

  **Etiological View**: Normally, the etiological view would say that the representation was selected for tracking motion during training. But in the shifted test set, the original cues (posture, background) are no longer correlated with motion. However, the causal role of S in driving the motion output head remains. So the etiological view must either (a) say that S represents motion because the system was selected to track motion (even though the training proxies are gone) or (b) deny that it represents motion because the training set correlations are broken. But by building the case with the shift, we force the etiological view to rely on the causal role in the current system to maintain that it represents motion.

  Now, the verdicts:
  - **Reader/Decoding View**: Since no simple readout recovers F from S (on the shifted test set), and only a heavy nonlinear probe does, the representation of F is not in S. The heavy probe is doing the work, so F is represented in the probe, not in S.
  - **Consumer/Causal-Role View**: The interventions show that S is used by the downstream motion head in a way that is sensitive to F. Therefore, S represents F.
  - **Etiological/Selected-For View**: During training, the system was selected to track F (motion). Even though the correlations changed, the system still has the function to indicate motion because of its causal role in the current system (which was shaped by training). So it says yes.

  But note: the etiological view might be strained by the shift. However, we designed the shift to break the training correlations, but the model still uses S for F. So the etiological view can say that the function is to represent motion, and it does so even in the shift because the system was trained to use whatever features it learned to detect motion. So it can still say "yes".

  Now, we break down:

  **Part 1: The key feature of the case**

  The key feature is the distribution shift that breaks the correlations between F and the easy-to-decode features (like posture) while leaving intact a complex, non-linear feature in S that the model learned and that the downstream head uses. Without the shift, the simple readout would work (because of the correlations) and we'd have agreement. Also, without the heavy nonlinear probe being needed, the reader view would say "yes". So the shift and the complexity of the representation are essential.

  What if the nonlinear probe were linear? Then the reader view would say "yes" because a linear probe works. But in our case, the linear probe fails, so the reader view says "no". If we removed the shift and used the original test set, then a linear probe would work (because of the correlations) and the reader view would say "yes", and the causal view would also say "yes" (because the interventions would still work). So we'd have agreement. Therefore, the shift and the non-linearity are crucial.

  **Part 2: The obvious objection**

  Objection: The downstream motion head itself is a decoder for F. So if the motion head can read F from S, then doesn't that mean there is a decoder (the head) that recovers F from S? And since the head is part of the model, the reader view should say that S does represent F because there is a simple readout (the head) that decodes it.

  Reply: First, note that the motion head is a shallow MLP (say, one or two layers). The reader theorist typically requires the readout to be "simple" (e.g., linear) and the head might be non-linear. So if the head is non-linear, the reader theorist might argue that the representation of F is not in S but is computed by the head. However, in our setup, the head is shallow and was trained as part of the model. The key is that the reader test is done by an external probe, not by the internal head. The reader theorist's test is about whether an external observer can easily read F from S, not whether the internal system does. The reader view is often tied to the idea of "observability" of the representation. So the internal head's ability is not considered a readout in the same sense because the head is part of the system that uses the representation. The reader test is for external interpretability. Therefore, the reader theorist would not accept the downstream head as a readout for their test because that would collapse the distinction between the two views. In fact, the causal-role view is exactly about how the internal system uses the state. So the objection doesn't refute the reader theorist's "no" because the reader test is defined externally.

  Moreover, even if the head is simple, in our case we have set up the head to be non-linear (but shallow). We can make the head a single linear layer? But then if the head is linear and it works, then the reader theorist might say that there is a linear readout (the head) so S does represent F. To avoid this, we must make the head non-linear (but still shallow). Then the reader theorist can argue that the representation is not in S but is computed by the non-linear head. But note: the causal interventions show that S is the state that carries the information that the head uses. So the causal-role view would still attribute the representation to S.

  To make it clean, we can design the motion head to be a simple linear layer. But then the objection becomes stronger: the head is a linear readout. However, in the shifted test set, we claim that a linear probe (trained externally) fails. How can that be? Because the head was trained during training and is fixed during testing. The head might have learned weights that are specific to the training distribution and fail on the shifted test set? But we want the model to still perform well on motion in the shifted test set. So we must assume that the head works on the shifted set because S contains the necessary information (non-linearly encoded) and the head is non-linear enough to decode it.

  Alternatively, we can make the motion head a simple linear layer, and during training it learns to rely on the easy features (posture) that are broken in the shift. Then in the shift, the head fails. But we want the model to perform well. So that doesn't work.

  Revised setup: The motion head is a two-layer MLP. During training, it learns to use the easy features. But during training, the model also learns some non-linear features in S for motion (as a backup). In the shifted test set, the easy features are gone, so the head must rely on the non-linear features in S. But the head, being a shallow MLP, can decode the non-linear features. Then, an external linear probe fails, but the head (which is non-linear) works.

  But then the head is a non-linear decoder. The reader theorist would then say that the representation of F is not in S but is computed by the head. However, the causal interventions show that when we patch S, we flip the motion output. So S is carrying the information that the head uses. The causal-role view says S represents F because it is the state that the head consumes to produce the motion output.

  Therefore, the objection highlights that the reader view and the causal view are testing different things: one is about external readout simplicity, the other about internal causal role. The case is interesting because it shows a divergence between external interpretability and internal function.

  **Part 3: Strongest attack from the decoding view**

  Attack: The interventions (activation patching) are themselves a form of readout. When you patch S and see that the behavior changes, you are effectively using the downstream system as a readout. So if the downstream system can read F from S, then that means there is a readout (the downstream system) that can decode F. Therefore, the decoding evidence is not negative: there is a readout that works (the internal head), so the reader view should say that S does represent F. The only reason the external probes fail is because they are not as good as the internal head. But the reader view doesn't require that every probe works, only that there exists a simple readout. But if the internal head is simple, then it should count. However, if the head is non-linear, then the reader view would not consider it simple, so it doesn't count.

  But in our case, the head is non-linear (shallow MLP). So the reader theorist might say: the internal head is not a simple readout, so it doesn't count for the reader test. The reader test is about external interpretability by simple methods. Therefore, the negative result from external linear probes stands.

  Alternatively, the attack could be: The causal intervention only shows that S carries information about F, not that it represents F. The representation relation requires more than information and causal role; it requires that the state was selected for carrying that information. But in the shifted test set, the system wasn't selected for the new distribution, so it doesn't represent F. However, the etiological view can still say that the system was selected for F in the training distribution and continues to function in the shift.

  But the etiological view might be challenged by the shift: if the system was selected for tracking posture (which correlated with motion) and not motion itself, then in the shift it no longer represents motion. But we designed the shift to be one where the model still gets motion right, so it must have learned more than posture. So the etiological view can still say it represents motion.

