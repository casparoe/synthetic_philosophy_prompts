answer: |-
  Here’s a structured proposal targeting your core concerns, preempting collapse worries, and forcing clarity on complaint strength. It’s designed for skeptical experts who demand rigor, not intuition-recycling.

  ---

  **Project Title:** The Structure of Complaints: Decomposing Contractualism’s Aggregation Dilemma  
  **Duration:** 12 months  
  **Core Question:** *Does contractualism’s resistance to interpersonal aggregation rest on a principled distinction between intra- and inter-personal complaint summation, or does it collapse under threshold cases and the measurement of complaint strength?*  

  ### Why the Standard Dialectic Fails (And Your Tripartite Split Holds)
  The literature treats "aggregation" as monolithic, focusing on headcount cases (Problem 1) where contractualists (e.g., Scanlon, Kumar) deny that numbers alone override individual burdens. But this misses two deeper challenges:  
  - **Problem 2 (Summation Asymmetry)**: Contractualism permits aggregating burdens *within* a life (e.g., 1000 minor headaches for one person) but rejects summing *across* lives (e.g., 1 headache each for 1000 people), absent a justification for this asymmetry. Standard "individual complaint" frameworks don’t explain why personal identity boundaries block summation.  
  - **Problem 3 (Threshold Vanishing)**: When burdens are imperceptible (e.g., micro-harms causing macro-harm), no individual seems to have a complaint, yet the collective outcome is disastrous. Appeals to "reasonable rejection" fail here—if no single act is rejectable, how does the collective harm register?  

  **Why they’re distinct and unresolved**:  
  - Problem 1 is about *comparative weight* (N × b vs. B). Solutions like "pairwise comparison" (Scanlon) or "complaint thresholds" (Kumar) address this but ignore Problems 2–3.  
  - Problem 2 is about *summation logic*: What structural feature of complaints makes personal identity a barrier to summation? Current contractualism lacks an answer, often smuggling in ad hoc asymmetry.  
  - Problem 3 is about *complaint existence*: Does a burden below perceptual/causal thresholds generate *any normative complaint*? If not, contractualism cannot handle diffuse harms (e.g., climate change, algorithmic bias).  

  **Collapse Test**: Problems 2–3 *do not* reduce to Problem 1. Headcount cases assume burdens are "complaint-eligible"; threshold cases challenge that eligibility. Summation asymmetry persists even when burdens are identical and above-threshold (e.g., headaches). The real risk is that **all three reduce to "How do we measure complaint strength?"**—which this project confronts directly.

  ### Method: Isolating Complaint Structure via Dilemma Engineering
  **Goal**: Construct formal dilemma cases that force apart Problems 2 and 3, isolating variables affecting complaint strength. Reject "toy utilitarianism" or "priority view" patches—they evade contractualism’s core mechanics.  

  | Phase | Months | Activity |  
  |-------|--------|----------|  
  | **1. Dilemma Construction** | 1–3 | Build paired cases varying *only* in burden distribution (intra- vs. inter-personal) and burden size (above/below threshold). *Example*: Case A: One person suffers 1000 unnoticeable dust exposures causing lung damage. Case B: 1000 people each expose one person to dust, causing identical damage. Is rejection reasonable in both? |  
  | **2. Structural Modeling** | 4–6 | Formalize "complaints" as vectors: (1) *Burden size*, (2) *Agent-relative perceptibility*, (3) *Causal role in harm*. Test whether contractualist judgments track these variables consistently. |  
  | **3. Threshold Stress Test** | 7–9 | Push cases to extremes: Can imperceptible burdens *ever* ground complaints? Does contractualism require a "complaint existence threshold"? If so, is it perceptual, causal, or normative? |  
  | **4. Asymmetry Interrogation** | 10–12 | If intra-personal summation is permissible, what feature of "personal identity" justifies it? Is it continuity of consciousness? Narrative unity? Test with sci-fi cases (e.g., split brains, AI agents). |  

  **Why this method?** It forces determinate answers by:  
  - Holding burden size fixed while varying distribution.  
  - Isolating "complaint strength" as the dependent variable.  
  - Avoiding circularity by not presupposing contractualist solutions (e.g., "reasonable rejection") as explanatory.  

  ### Candidate Conclusions (and Deciding Considerations)
  1. **The Principled Asymmetry View**: Personal identity provides a non-arbitrary boundary because complaints are *agent-relative commitments* (e.g., only I can experience *my* headaches as cumulative). *Decider*: Does this view survive fission/fusion cases?  
  2. **The Threshold View**: Complaints vanish below a perceptual/causal threshold—contractualism needs supplemental principles (e.g., collective responsibility) for diffuse harms. *Decider*: Can threshold-defined complaints avoid arbitrariness?  
  3. **The Holistic Complaint View**: Complaints are defined by their role in a life-narrative; summation is always narrative-dependent, not mathematical. *Decider*: Does this generate inconsistent verdicts across cultures/contexts?  
  4. **The Collapse View**: Complaint strength is always intuitive weightings; contractualism has no resources to solve Problems 2–3. *Decider*: Can modeling yield a consistent, non-intuitive metric?  
  5. **The Revisionist View**: Complaints include "risk of harm" or "participation in harmful systems," even for imperceptible acts. *Decider*: Does this overload "reasonable rejection" with indirect claims?  

  ### Failure Conditions & Risks
  - **Total Failure**: Complaint strength resists formalization, reducing to unanalyzable intuitions. *Smoking gun*: All dilemma cases resolve only via ad hoc appeals to "reasonableness" with no measurable parameters.  
  - **Partial Failure**: Problems 2–3 collapse into Problem 1, revealing no distinct challenges. *Smoking gun*: Summation asymmetry vanishes when burden size is identically above-threshold.  
  - **Key Risk**: Complaint strength *is* the core problem. But this project succeeds if it **demystifies strength** by tying it to structural features (e.g., perceptibility, causal role) or proves it’s irreducible.  

  ### Why 12 Months is Feasible (and What to Cut)
  - **Cut Problem 1 entirely**. Headcount debates are saturated; your added value is in 2–3.  
  - **Focus**: 8 months on dilemma construction/modeling (Months 1–9), 3 months on asymmetry/threshold theory (Months 10–12).  
  - **Deliverable**: A testable model of complaint strength + manuscript.  

  ### Non-Question-Begging for Skeptics
  Arguments must:  
  - Avoid relying on contractualist jargon ("reasonable rejection," "personal standpoint") as explanatory.  
  - Show consistency *without* privileging contractualist intuitions.  
  - Demonstrate that solutions don’t *recreate* aggregation (e.g., via "compounded complaints") or collapse into utilitarianism.  
  - **Key Move**: Frame findings as internal to contractualism—e.g., "If Scanlon’s apparatus is coherent, it *must* account for X—but here’s why it can’t without Y."  

  ---  
  **Bottom Line**: This forces progress. Either contractualism has hidden resources to explain summation asymmetry/thresholds (revealing new structure in complaints), or it exposes the theory’s dependence on unanalyzed intuitions. Both outcomes advance the debate—and your failure conditions are publishable negatives. If complaint strength is the black box, this project opens it.
