  The failure condition must be brutal: If complaint strength always reduces to intuitive weightings (e.g., "headaches just matter less when distributed"), the project fails—that’s exactly the intuition-mongering charge. Success means isolating structural features (e.g., identity-dependent complaint thresholds) that *explain* the asymmetry.  

