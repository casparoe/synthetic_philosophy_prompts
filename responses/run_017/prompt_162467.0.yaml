prompt: |-
  I'm a PhD student in philosophy, working on a chapter on the Rietdijk–Putnam argument, and for the past few months I've been collecting the verdicts of a friend in the department — a philosopher of physics — on a long list of "is it already real, as of here-now?" cases, because I can't work out what rule she is actually running. Her record so far: an event whose light reached Earth in 1987 — already real, settled, no question; my department's vote next month — not yet real, "just the ordinary open future"; a collision between two Kuiper-belt rocks that happens, in the Earth's frame, at this very moment — already real, and she added that I shouldn't lean on the Earth's frame, that I should pick any frame I like and the verdict has the same standing; the two walkers passing each other on the street who disagree about whether the Andromedan council has already voted to launch the fleet — already real, and their disagreement is precisely the point, since there is nothing for "what is happening now on Andromeda" to be. When I pressed her on whether "already real" in those spacelike cases means "real, full stop" or only "already past relative to such-and-such observer's simultaneity slice," she said it doesn't matter, because no one frame's verdict has a better claim than any other's and so there is nothing left for a privileged present to be. That answer has been running in my head ever since, because it seems to me to slide between two quite different positions, and she has never been asked the case I actually care about.

  Here it is. Take my reading group's meeting one week from now: timelike-future from here-now, squarely inside my future light cone. Now take an observer ten light-years away who, in my rest frame, is moving toward Earth at about one percent of the speed of light — the threshold for an event a week in my future to fall into their past is only about 0.002c (and the reason the textbook version can get away with pedestrians is that Andromeda is 2.5 million light-years off, so a walking pace buys you a few days at that distance); in their rest frame, as far as I can tell, my meeting happened roughly a month before their present moment. Please check that Lorentz transform. Then the variant I really want: the same set-up, except that the observer sits behind a horizon — put them in a galaxy receding from us so fast that no signal from them will ever reach us, or in whatever other idealization makes permanent causal disconnection possible — so that no comparison of notes, no later confirmation, no eventual "told you so" is available even in principle. If that variant can't be stated cleanly, because global simultaneity in an expanding spacetime isn't just a Lorentz boost and "their slice" has no univocal sense, then say so and say what the failure reveals; if it can be stated, tell me whether it changes anything.

  What I want from you is not a verdict on the block universe — I've read enough of that literature. I want: her verdict in each variant; the list of candidate rules that fit her earlier verdicts, with at least two of them diverging on this case; what each rule predicts here and which reading of her earlier "already real" answers each one corresponds to, including whether the position that stops at the complement of my future light cone is really available to her given what she said about frames, and whether the perspectival reply (that "already past" is always indexed to an observer and never transfers into a claim about what is real, so that her earlier verdicts were indexical all along) is one she has already ruled out or one she has been covertly relying on; your best guess with the reasons for preferring it; and the single further case I should put to her that would best separate the rules that survive. I also have a nagging suspicion that, despite the "pick any frame you like" line, she is quietly helping herself to the comoving frame's cosmic-now slice — if that is a fourth rule that fits her record just as well, say so and tell me what it predicts here and what would expose it.
reasoning: |-
  Okay, let me tackle this intricate philosophical physics puzzle step by step. The user is a PhD student in philosophy working on the Rietdijk-Putnam argument, and they've been collecting a philosopher of physics friend's judgments about what counts as "already real" in various scenarios. Now they have a specific case they want to analyze involving an observer moving at relativistic speeds relative to Earth, and potentially behind a cosmological horizon.

  First, I need to verify the physics calculations. The user mentions that for an event one week in their future, an observer moving at 0.01c could have that event in their past if they're 10 light-years away. Let me confirm that Lorentz transformation. The formula for time dilation is Δt' = γ(Δt - vΔx/c²). With v=0.01c, γ≈1, distance Δx=10 light-years (so cΔx=10 light-years), and Δt=1 week (≈0.0192 years). Plugging in: Δt' ≈ (0.0192 - (0.01)(10)) years = 0.0192 - 0.1 = -0.0808 years ≈ -4.2 weeks. So yes, in that observer's frame, the meeting occurs about a month before their present moment.

  Now considering the key variant where this observer is causally disconnected - perhaps in a galaxy receding faster than light due to cosmic expansion. In FLRW cosmology, we'd need to check if they're beyond the Hubble sphere. For permanent disconnection, they'd need to be beyond the event horizon where proper distance increases faster than c. 

  The user wants to know how their friend would rule on these cases, and what underlying principles she might be using. From her previous judgments:
  - Supernova 1987A (past light cone): real
  - Department vote (timelike future): not real
  - Kuiper belt collision (spacelike): real in all frames
  - Andromeda disagreement: real, with frame-relativity emphasized

  Her position seems strongly relativistic - no privileged frame, and "already real" applies to anything outside the future light cone. But does this extend to timelike future events when viewed from other frames? That's the crux.

  For the first variant (observer at 10ly, v=0.01c): 
  - By her relativistic logic, since in that observer's frame the meeting is past, it would be "already real". She'd likely say yes, same as the Andromeda case.

  For the causally disconnected variant: 
  - Even without communication, the frame-relative pastness remains. She'd probably maintain that it's real relative to that observer's simultaneity slice. The disconnection doesn't change the mathematical relation.

  Candidate rules:
  1. Block universe: Everything is equally real. Predicts "real" for all cases. But this contradicts her "not real" for future votes.
  2. Presentism: Only present is real. Contradicts her past/spacelike judgments.
  3. Relativistic becoming: Reality defined by past light cone. Predicts "not real" for future meeting, even from other frames. But this conflicts with her frame-symmetry stance.
  4. Frame-relative reality: "Real" means "past in some frame". Predicts "real" for the meeting in the moving frame. This fits her pattern best.

  The perspectival reading (indexical "already past") seems consistent with her responses. She hasn't ruled it out - in fact, her "no privileged frame" comment supports it. The complement-of-future-light-cone view is unavailable to her because she accepts spacelike events as real via other frames.

  I suspect she might be using cosmic time in expanding universes, but for the Kuiper belt case she emphasized picking any frame, not just comoving. To test this, propose an event spacelike separated but where cosmic time disagrees with local inertial frames.

  The diagnostic case to pose: A future event in our timelike future that is spacelike to an observer moving at relativistic speed toward us. If she calls it "not real" (sticking to our light cone) or "real" (honoring the other frame), that will reveal whether she truly embraces frame-relativity for timelike futures or only for spacelike cases.
answer: |-
  Based on your friend's established verdicts and stated principles, here's a systematic breakdown of her likely responses to your cases, the candidate rules, their predictions, and the diagnostic next step. The key tension revolves around whether "already real" extends to *timelike-future events relative to you* when they are *past relative to another observer*, especially under causal disconnection.

  ### Your Cases and Her Predicted Verdicts
  1. **Variant 1 (Observer at 10 ly, moving at 0.01c toward Earth)**  
     - **Your meeting (1 week in your future):**  
       ✅ **"Already real"** (settled, no question).  
       *Reasoning:* In the moving observer's frame, your meeting is ≈4 weeks in their past (confirmed: Lorentz transform gives Δt' ≈ -4 weeks). She treats all frames as ontologically equal, so if it's past for them, it's real—just like the Andromeda case, but now applied to your timelike-future event. She rejects "your future light cone" as privileged.

  2. **Variant 2 (Observer causally disconnected, e.g., in a super-Hubble-recession galaxy)**  
     - **Your meeting (1 week in your future):**  
       ✅ **"Already real"** (same as Variant 1).  
       *Reasoning:* Causal disconnection changes nothing. The Lorentz boost still defines a simultaneity slice where your meeting is past for them. Global spacetime structure (e.g., FLRW metric) doesn't invalidate local inertial frames; she can still boost to a frame where the event is past-like. The "no later confirmation" is irrelevant—reality isn't contingent on measurability. Her earlier Kuiper belt case (no possible "comparison") sets this precedent.  

     *Caveat:* If you insist on a *global* definition of "their slice" in an accelerating universe, she might demur—but only on technical grounds. She’d likely argue:  
     - At the *local* event of the observer, a well-defined simultaneity slice exists via Lorentz boost.  
     - Your meeting is spacelike *or past* relative to that local slice.  
     - Thus, it’s real. The "failure" reveals only that global foliations are messy, not that reality is frame-dependent in her sense.

  ---

  ### Candidate Rules Fitting Her Earlier Verdicts  
  Three rules fit all prior cases (1987 supernova, future vote, Kuiper collision, Andromeda disagreement). They diverge on **your meeting**:

  | Rule | "Already Real" Means... | Predicts for Your Meeting | Corresponds to Her "Already Real" As... | Compatible with Her "No Privileged Frame"? |
  |------|--------------------------|---------------------------|----------------------------------------|-------------------------------------------|
  | **1. Relativized Eternalism (Block w/ Frame-Relative Indexing)** | Past in *some* inertial frame | ✅ REAL (past in observer's frame) | Indexical ("past relative to a frame"), but ontologically committing | Yes—all frames equal; no "full stop" reality |
  | **2. Light Cone Presentism** | Only the absolute past (complement of *your* future light cone) | ❌ NOT REAL (in your future light cone) | Non-indexical ("real, full stop") | **No**—privileges *your* light cone/frame |
  | **3. Global Eternalism (Full Block Universe)** | All events are real | ✅ REAL | "Real, full stop" | Yes (trivially—no frames privileged) |

  - **Rule 1** is her *stated position*: "pick any frame," "no privileged present." Her Andromeda/Kuiper verdicts use indexicality ("already past relative to X"), but she avoids calling it *merely* perspectival. When pressed, she denies that "relative to a frame" makes it less real—it’s the *only* kind of reality.  
  - **Rule 2** (light cone presentism) is **incompatible** with her record. She rejected privileging Earth's frame in the Kuiper case and dismissed "past relative to observer" as insufficient in her answer to you.  
  - **Rule 3** (global block) fits her verdicts but contradicts her "open future" for your department vote—unless she inconsistently exempts subjective experience.  

  ---

  ### Your Suspicions Addressed  
  - **"Is she covertly using the cosmic-now slice?"**  
    Unlikely. Her Kuiper belt verdict explicitly rejected privileging the Earth's frame, and she emphasized "pick *any frame*." The cosmic-now (comoving frame) is just one frame—she’d deny it has special status. If she *were* using it, she’d call your meeting **not real** (since it’s future in cosmic time). But this contradicts her relativistic stance.  
    - *Test for this*: Ask about an event *spacelike separated* from Earth but *future* in cosmic time (e.g., a comet collision in the Oort Cloud next week). If she says "not real," she’s privileging cosmic time. Given her record, I predict she’d call it "real" (as it’s past in some other frame).  

  - **Has she ruled out perspectivalism?**  
    Partially. She rejects that "already past relative to X" is *only* perspectival (i.e., not ontologically significant). But she *is* using indexicality—reality is always *relative to a frame*. Her slide is between:  
    - *Ontological relativism*: Reality is frame-dependent (Rule 1).  
    - *Non-indexical eternalism*: All events are equally real (Rule 3).  
    Her "no privileged frame" line pushes toward Rule 1, but her confidence in spacelike cases ("already real, full stop") hints at Rule 3. Your meeting case forces a choice.

  ---

  ### Best Guess for Her Position & Why  
  She endorses **Rule 1 (Relativized Eternalism)**.  
  - **Why:**  
    1. It explains her insistence that Andromeda's vote is "real" despite disagreement—it’s past in one frame, so real *for that frame*.  
    2. It accounts for her dismissal of "privileged frames" and "no univocal now."  
    3. It avoids the contradiction in Rule 3 (global block) with her "open future" intuition for your department vote—under Rule 1, events *in your future light cone* are not-yet-real *relative to you*.  
    4. Her "it doesn’t matter" reply suggests that "real, full stop" collapses to "real relative to *some* frame," since no frame is privileged.  

  - **Weakness:** She must accept that your future meeting is *already real relative to the moving observer*, even though it feels "open" to you. This is the core tension in relativistic becoming.

  ---

  ### The Diagnostic Case to Separate Rules  
  **Pose this to her:**  
  > *"Consider an event that is spacelike separated from Earth *now* (e.g., a supernova in a galaxy 10 Mly away, exploding at this exact Earth-time) but lies in the *future light cone* of an astronaut moving at 0.9c toward Earth. Is this event already real?"*  

  - **Rule 1 (Her predicted stance):** ✅ YES. It’s past in the astronaut’s frame → real.  
  - **Rule 2 (Light cone presentism):** ❌ NO. It’s outside Earth's past light cone.  
  - **Rule 3 (Global block):** ✅ YES. All events are real.  

  **Why this works:**  
  - It tests if "relative to a frame" overrides *your* light cone. Her Andromeda case had spacelike events outside *all* future light cones; here, the event is outside *yours* but inside *someone else's future cone*. If she says "real," she’s committed to Rule 1 (frame-relative reality dominating absolute light-cone structure). If she says "not real," she’s privileging your frame or light cone—contradicting her prior rejections of privileging.  

  This forces her to clarify whether "already real" requires being past in *some frame* (Rule 1) or being outside *every* future light cone (a weaker claim). Her record suggests she’ll choose the former.  

  ### Final Note  
  Her position is a coherent (if unintuitive) interpretation of relativity: **Reality is frame-relative, and anything past in any frame is "already real" for that frame.** Your meeting is real for the moving observer; causal disconnection is irrelevant. The tension with your "open future" is real—but she likely sees that as a quirk of your perspective, not an ontological limitation. To challenge her, press on whether *all* events are real *simpliciter* (Rule 3) or only *relatively real* (Rule 1)—the diagnostic case above does this cleanly.
