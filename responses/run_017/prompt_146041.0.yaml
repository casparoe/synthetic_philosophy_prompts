  ## The Third Sodium Light

  The sodium lights buzzed like dying insects above the car park. Arthur slammed the driver’s door of his old Volvo, the sound swallowed by the thick, woolen fog that had rolled in during their shift. Moira leaned against her hatchback, blowing steam into the chill air over a paper cup of machine-coffee that tasted faintly of burnt plastic and despair. Hephaestus, the mangy laundromat cat, watched them with indifferent yellow eyes from beneath a flickering light.

  “Fog’s a proper pea-souper tonight,” Arthur grumbled, rubbing his stiff neck. “Three bloody turnoffs, all look like twins. Same cracked sign, same flicker. Brain just… wipes clean each time. Like hitting reset.”

  Moira nodded, not needing the reminder. Twenty years on the night shift, forty years married. The forgetting stretch was just another worn groove in their rutted lives. “Laundromat’s misery,” she stated flatly. “Home’s bliss. Lake Road’s nostalgia with a side of exhaustion. Gate’s purgatory.”

  “And we get two extra if we land together,” Arthur finished, sipping his own awful coffee. “Except at the gate. Half a mile apart in this muck might as well be different continents.”

  “So?” Moira prompted. “What’s the plan, professor? Flip coins?”

  Arthur grimaced. “Thought about it. Say we both decide to… ‘continue’ with some probability *p*. Only turn at a turnoff if a mental coin lands heads. We’d need to pick the best *p*.”

  Moira’s eyes narrowed, the calculator behind them whirring. “Right. Probability we *both* turn at the first one: (1-p) times (1-p). Payoff 1 plus the bonus 2, so 3. Probability we *both* turn at the second: p*(1-p) for me to pass the first, then (1-p) to turn at the second… same for you. But independently. So… p*(1-p) * p*(1-p) for us both to be turning *exactly* at the second? No…”

  Arthur groaned. “Messy. Probability *you* turn at the second is the probability you *passed* the first (p) *and* turn at the second (1-p), so p(1-p). Same for me. But for us *both* to turn at the *second* turnoff, it’s [p(1-p)] * [p(1-p)] = p²(1-p)². Payoff then is 4 + 2 = 6.”

  “And both at the third?” Moira pushed. “Pass first (p), pass second (p), turn third (1-p). So p²(1-p) each. Both doing it? [p²(1-p)]². Payoff 2+2=4. Both miss all? Pass all three: p³ each. Both do it? (p³)² = p⁶. Payoff 0. And the times we’re *apart*... those payoffs are just the solo ones: 1, 4, or 2, no bonus.”

  They stood in silence, the fog thickening, the sodium lights casting long, wavering shadows. Arthur kicked a pebble. “It’s a dog’s dinner, Moira. All those probabilities squared… tiny chances we actually end up together at the good spots. Most of the time? We’re apart, or both wallowing at the laundromat, or worse.”

  Moira’s voice was low, weary. “Worst part? If we drive separately… the *best* expected payoff we could get with any coin-flip scheme… is rubbish. Less than always both taking the first turnoff.”

  Arthur stared. “The laundromat? Every single night? Payoff 1+2=3?”

  “Exactly,” Moira said, bitterness sharpening her tone. “Because the bonus is so big, and being together *there* at least guarantees it. Trying to gamble for home or even the lake road… the risk of being apart, or missing everything… it drags the average down *below* 3. We’d literally be better off resigning ourselves to stiff necks and that bloody cat every night than trying to get clever with coins separately. I *hate* that.”

  The bleakness of it settled over them, colder than the fog. Hephaestus yawned, displaying needle-like teeth.

  Arthur sighed, long and ragged. “Convoy?”

  Moira’s head snapped up. “Convoy.” A spark ignited in her tired eyes. “One car follows the other. The follower just watches the leader’s brake lights. When the leader’s brakes go on at a turnoff, the follower turns too. Simple. They end up together wherever the leader decides.”

  Arthur caught on instantly. “And the bonus… it’s baked in! Whatever the leader gets, the follower gets the same, *plus* the two for being together. Except…”

  “Except the gate,” Moira finished. “If the leader misses all three, the follower misses all three. Stuck at the gate, half a mile apart. Bonus doesn’t apply. Zero for both.”

  “But everywhere else,” Arthur said, the gears turning visibly, “Leader turns first? Payoff 1, plus bonus 2? Total 3. Both end up at the laundromat. Leader turns second? Payoff 4, plus bonus 2? Total 6. Both home. Leader turns third? Payoff 2, plus bonus 2? Total 4. Both on the lake road.” He paused. “Leader misses all? Zero. Both zero. No bonus.”

  Moira nodded slowly. “So… it collapses. Back to a one-driver problem. The driver in front isn’t just deciding for themselves anymore. They’re deciding for *both* of us. And the payoffs… are transformed.” She ticked them off:
  *   Turn at 1st: 3 (Laundromat Together)
  *   Turn at 2nd: 6 (Home Together)
  *   Turn at 3rd: 4 (Lake Road Together)
  *   Miss All: 0 (Gate Apart)

  “Massive difference,” Arthur breathed. “Turning at the second isn’t just 4 anymore. It’s 6. The lake road is 4, same as going home *alone* used to be. The laundromat is 3, which still stinks, but it’s not 1. Missing all is catastrophic.”

  “So,” Moira said, the weight of decision settling on her shoulders. “The leader needs a plan. A *p*. The probability to continue past *any* turnoff, not knowing which one it is.” She closed her eyes, summoning the equation. The expected payoff *E* is:
  E = P(Turn 1st) * 3 + P(Turn 2nd) * 6 + P(Turn 3rd) * 4 + P(Miss All) * 0

  Probability of turning at the first turnoff: (1-p)
  Probability of turning at the second: Pass first (p) * Turn second (1-p) = p(1-p)
  Probability of turning at the third: Pass first (p) * Pass second (p) * Turn third (1-p) = p²(1-p)
  Probability of missing all: Pass first (p) * Pass second (p) * Pass third (p) = p³

