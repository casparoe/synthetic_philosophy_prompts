  “About… thirty-six or thirty-seven percent,” Moira murmured, opening her eyes. The exact decimal was fuzzy, lost in the fatigue and mental arithmetic, but the shape was clear. “Chance to continue past any turnoff. It’s… low. Much lower than fifty. Because missing all is so bad, and turning too late means settling for the lake road too often. You need to be… cautious. But not too cautious, or you hit the laundromat constantly.”

  Arthur understood. The transformed payoffs demanded prudence. Gambling for the glorious 6 was tempting, but the risk of the catastrophic 0 was too high. The sweet spot was biased towards turning earlier than you instinctively might. “Thirty-six percent it is. Roulette wheel in the head. Who leads?”

  Moira tossed her cup towards a bin. It missed. “My turn. You follow my lights. Don’t think. Just brake when I brake, turn when I turn.”

  “Brake when you brake,” Arthur confirmed. They held each other's gaze for a second longer than necessary, a lifetime of shared foggy journeys in that look. Then they got into their cars.

  The fog swallowed the world beyond the windscreen. The road was a grey tunnel. Moira drove, holding the number *p ≈ 0.36* in her mind like a talisman. Arthur’s headlights were two diffuse haloes in her mirror, comforting and close.

  *Flicker. Cracked Sign. Sodium Glow.*

  **Turnoff One.** Her pulse jumped. *Is this the first? The second? Third?* The wipe was absolute, leaving only the plan. *Probability this is the first: Highest. Because we always reach the first. Probability it’s the second: Lower. We only reach it if we passed the first, which was probability p ≈ 0.36. Probability it’s the third: Even lower. Only if we passed two, p squared, about 0.13.* The urge to turn was strong – *safety, togetherness, 3 is better than risking 0!* But the plan demanded continuation with 36% probability. She summoned the feeling of the roulette wheel. *Continue.* Her foot stayed firm. The turnoff slid past. In her mirror, she saw Arthur’s lights hold steady. He hadn’t braked. Good.

  The fog thickened. Minutes bled, formless. Another flicker resolved.

  **Turnoff Two.** Same sign. Same light. Same wipe. *Where are we?* The calculation repeated, cold logic against primal uncertainty. *Probability this is the first? Low. We *always* see the first, but we didn’t turn there, meaning we passed it. The probability we would *reach* this turnoff *and* it be the first is zero, because if it were the first, we’d have turned or passed it already. We are *at* a turnoff. Given that, and that we didn’t turn at the previous one(s)...* She forced the Bayesian update. *Probability this is the first turnoff: Impossible. We passed it.*
  *Probability this is the second: The most likely. We passed the first (p ≈ 0.36), now we’re here.*
  *Probability this is the third: Less likely. We passed the first (p ≈ 0.36) AND passed the second (another p ≈ 0.36), so probability ≈ 0.13.*
  The pull was different now. *This could be the one. Turn now. Home. Together. Blissful 6.* It screamed at her. The plan whispered: *36% chance to continue. Stick to the plan. The risk of the gate...* She conjured the wheel again. *Continue.* Her hands tightened on the wheel, fighting the instinct to brake. The Volvo glided past the cracked sign. In the mirror, Arthur’s lights stayed bright, unwavering. Relief, and a pang of regret.

  The fog pressed in, claustrophobic. Time stretched. Had it been longer? Shorter? Moira’s eyes stung with fatigue. Then, like a recurring dream:

  **Turnoff Three.** Indistinguishable. Memory void. *Where?* The calculation was harder now, her mind sluggish. *Probability this is the first? Impossible.*
  *Probability this is the second? Possible, but lower than before. We’d have to have passed the first (p ≈ 0.36) and then *not* turned at this one when it *was* the second? Contradiction. We are *at* a turnoff now. If this is the second turnoff, it means we passed the first and are now encountering the second. That's the scenario where we decide to turn or not here.*
  *Probability this is the second turnoff: We passed the first (p ≈ 0.36), so yes, it's definitely possible we are at the second.*
  *Probability this is the third: We passed the first (p ≈ 0.36) AND passed the second (p ≈ 0.36), so p² ≈ 0.13.*
  *But... which is more likely? We know we passed at least one turnoff (since this isn't the first). The relative likelihood: P(Second | Reached a turnoff after passing one) = P(Reached Second) / [P(Reached Second) + P(Reached Third)] = p / (p + p²) = 1 / (1 + p) ≈ 1 / 1.36 ≈ 0.735.*
  *P(Third | Reached a turnoff after passing at least one) = p² / (p + p²) = p / (1 + p) ≈ 0.36 / 1.36 ≈ 0.265.*
  So, about 73.5% chance this is the *second* turnoff. Home. 6 units. Just brake. Turn. *Now*.
  The plan whispered: *Continue with 36% probability.* But the pressure was immense. Home was so close. The risk of the gate felt abstract, distant. The number *p* seemed arbitrary suddenly, a relic of cold car park maths, not this suffocating reality. *Seventy-three percent! It’s probably the second! BRAKE!*
  Arthur, in the following car, saw the turnoff loom. Saw Moira’s brake lights *didn’t* illuminate. He knew the plan. *Continue probability p*. But the silence of her brakes screamed. *She’s continuing?! Now? After passing two? It must be the third! Or… is it the second? Did she mess up?* A desperate urge to flash his lights, to honk – *Moira, turn! It’s probably home!* – surged and died. No signals. The plan. He kept his foot off the brake, his lights burning steady holes in the fog, following her into the unknown.

  Moira didn’t brake. The roulette wheel, this time, landed on *Continue*. Or perhaps it was sheer stubbornness, a refusal to break the plan they’d forged together in the cold. Or maybe just exhaustion. The cracked sign and the flickering sodium light vanished behind her.

  Silence. Only the rumble of the engine, the hiss of tires on wet asphalt. Fog, endless fog.

  Then… a bend. A familiar, weathered oak, skeletal in the headlights. A small, overgrown pull-off overlooking the invisible water. The place they’d first kissed, young and stupid, the headlights of his dad’s Cortina illuminating the mist. Further on, the bend where he’d hit the deer ten winters back, the sickening thud still echoing sometimes.

  Arthur pulled up beside her on the wide verge near the old oak. He killed the engine. The silence of the lake road, deep and damp, folded around them. They got out. No words. They walked to the edge, looking into the featureless grey where the water should be. The shared bonus clicked into place: Lake Road Payoff (2) + Together (2) = 4. The same as going home alone would have been worth, back when they drove separately. Less than the 6 they’d almost grasped.

  Arthur put an arm around her shoulders. She leaned into him, her weight familiar, her sigh carrying forty years of night shifts and fog and cracked stop signs. The chill seeped through their coats. It wasn't home. It wasn't the gate. It was the long way round, paved with worn memories and a choice made by a number in a weary mind. The third sodium light, passed on a gamble that felt less like probability and more like fate, had brought them here, together, to the place where it all began, long before the forgetting stretch and the laundromat cat and the taste of burnt plastic. He pulled her closer, and they waited for the slow dawn to break through the grey.
