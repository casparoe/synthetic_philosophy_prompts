answer: |-
  Here is a sestina crafted to your precise specifications, designed to embody the distinctions and avoid the pitfalls you described:

  **End-words:** Report, Recovered, Normal, Fatigue, Anxious, Resolved  
  *(Rotation: Resolved, Report, Anxious, Recovered, Normal, Fatigue)*

  **The Consultation Note (Sestina)**

  You ask me how I feel. I try to **report**
  the ache behind my eyes, the sense I’m not **recovered**.
  My temperature last Tuesday read 37.8 – is that **normal**?
  You note it down beside the constant **fatigue**.
  You ask if worries crowd my mind, seem kind, not **anxious**
  to rush. But when I mention falling, you say, “Case **resolved**.”

  (Staples out, discharge complete, the file says **resolved**).
  I brought the neighbour’s note, confirming my **report**
  of dizziness that made me stumble, looking **anxious**.
  He saw me clutch the rail. But since I’m “mostly **recovered**,”
  you link the stumble to the lingering **fatigue**,
  not to the wobble in my legs that feels… not **normal**.

  Was it always like this? What *was* my **normal**?
  Before the virus left things quietly un-**resolved**?
  You call it “post-viral strain,” a common **fatigue**.
  I list the skipped heartbeats. You make a **report**:
  “Palpitations noted. Patient states not **recovered**,
  appears understandably stressed and mildly **anxious**.”

  “Not stressed,” I start, then pause. *Am* I **anxious**?
  Is naming dizziness just fear of the **normal**?
  My neighbour saw me fall. But he saw me **recovered**
  enough to walk alone. Perhaps it *is* **resolved**…
  I meant the *cause*, not just the fall. My **report**
  feels slippery now, dissolving into **fatigue**.

  Is all this just the heavy cloak of **fatigue**?
  My doubt tastes sour. Your calm face holds no **anxious**
  edge. You listen well. But in your **report**,
  my skipped heartbeats are ‘subjective,’ my ‘new normal’
  accepted. ‘Plan: Support. Monitor.’ Case **resolved**?
  But something *in* the fall still feels un-**recovered**.

  Three months since fever broke. Am I **recovered**?
  The bloodwork shows no flaw, just markers **fatigue**
  can raise. It fits the pattern, neatly **resolved**.
  Your kindness makes me swallow down the **anxious**
  words: *This isn’t right.* This can’t be **normal**.
  My own conviction wavers with each **report**.

  My neighbour saw the fall. The date’s on his **report**.
  He’d say I’m not **recovered**. That feels **normal**?
  This **fatigue** reshapes the truth. Why feel **anxious**? Case **resolved**.

  **Envoy**

  The words you use reshape what I convey: **Resolved**
  implies an end I haven’t known. **Report**, **Recovered**,
  **Normal**, **Fatigue**, **Anxious** – worn thin, they turn away
  from what resists the shape they hold. Not wrong, but lost.

  ---

  **Breakdown & Rationale:**

  1.  **End-Word Selection & Rotation:**
      *   `Report` (Documentation verb), `Recovered` (Outcome/Closing), `Normal` (Measurable/Interpretive), `Fatigue` (Bodily Function), `Anxious` (Mental State), `Resolved` (Case-Closing).
      *   The rotation forces shifts in meaning: `Resolved` moves from a clinical conclusion to a state of being unfinished. `Report` shifts from patient testimony to clinician's note. `Anxious` moves from clinician's assessment to the patient's internal state of doubt. `Recovered` shifts from clinician's label to the patient's lived reality. `Normal` shifts from objective measure to subjective feeling and back. `Fatigue` shifts from symptom to potential cause or dismissive label.

  2.  **Avoiding Villainy & Triumph:**
      *   The clinician is depicted as attentive, kind, listening ("You ask... seem kind, not anxious to rush," "You listen well," "Your kindness"). The failure is systemic, embedded in the *language and conceptual framework* ("The words you use reshape what I convey"), not malice or overt rudeness.
      *   The patient is *not* triumphant. She is increasingly uncertain ("My doubt tastes sour," "My own conviction wavers"), her experience is assimilated into pre-existing categories ("You link the stumble...", "'Plan: Support. Monitor.'"), and the poem ends with her experience being "lost" within the inadequate vocabulary.

  3.  **Epistemic Harm Embodied:**
      *   **Testimonial Injustice (Reduced Credibility):** The concrete evidence (Neighbour's note confirming the fall and date, specific temperature 37.8°C) is acknowledged but its *significance* is dismissed or reinterpreted ("you link the stumble to the lingering fatigue," "my skipped heartbeats are ‘subjective,’" "It fits the pattern"). Her credibility regarding the *meaning* of her symptoms falls short.
      *   **Hermeneutical Injustice (Lack of Concept):** This is the core failure. The clinician's vocabulary (`Fatigue`, `Anxious`, `Resolved`, `Recovered`, `Normal`) is insufficient to capture her experience ("something *in* the fall still feels un-recovered," "This isn’t right," "resists the shape they hold"). Her account gets filed under the nearest headings (`Fatigue`, `Anxious`) and comes back changed ("reshapes the truth").
      *   **Erosion of Self-Trust:** Explicitly shown in Stanza 5 ("Is naming dizziness just fear of the normal?", "My own conviction wavers with each report") and implied in the doubt seeded earlier. This is framed as a *consequence* of the patient being "patiently and sympathetically misunderstood," not contradicted.

  4.  **Structure as Argument:**
      *   **Worn-Out Words:** By the final stanzas, the end-words feel repetitive and inadequate, mirroring the patient's frustration and the limitations of the clinical language. "Resolved," "Recovered," "Normal" feel particularly hollow and imposed.
      *   **Rotation Shifts Meaning:** Each recurrence alters the word's nuance based on its position and context, demonstrating distortion. E.g., `Resolved` in position 1 (Stanza 2) is an active clinical decision; in position 6 (Stanza 4) it's the patient questioning that decision; in the envoy, it's identified as part of the distorting vocabulary.

  5.  **Envoy & the "Name":**
      *   **Breaking Rotation:** The rotation is deliberately broken in the envoy. The words appear in the order: `Resolved`, `Report`, `Recovered`, `Normal`, `Fatigue`, `Anxious` – which is *not* the standard rotation (it would need to be `Resolved`, `Report`, `Anxious`, `Recovered`, `Normal`, `Fatigue` for the envoy structure).
      *   **Why Break & Why No Name?**
          *   **Against False Comfort:** Handing her a specific name (like "Long COVID" or even a theoretical term) within the poem would be a false comfort. It would imply the problem *is* solved by simply having a label, replicating the very pattern of premature closure ("Resolved") the poem critiques. It would release the listeners.
          *   **Holding the Gap:** Breaking the rotation visually and structurally signifies the *rupture* and the *inadequacy* of the existing framework represented by the six words. The final lines ("Not wrong, but lost") name the *type* of harm (hermeneutical marginalization – her experience is lost *within* the system) without providing a neat diagnostic label. It leaves the *listeners* holding the concept of this gap, this loss, this inadequacy of their shared vocabulary to capture certain experiences. They now have the concept of the *lack*, not a solution for it.
          *   **The Envoy's Message:** The envoy explicitly states the problem: the words reshape her experience, they are worn thin, and they turn away from what resists them. The harm is the experience being "lost" *because* it doesn't fit, not because it's absent. The ending is recognition without resolution, demanding reflection rather than offering absolution.

  6.  **Voice & Style:**
      *   Patient voice during/immediately after a consultation.
      *   Accessible language, no jargon or named diagnoses.
      *   Lines primarily 9-11 syllables for natural speech rhythm (~2 min read).
      *   Concrete detail: Temperature (37.8°C), the witnessed fall (with neighbour's note/date), the skipped heartbeats.

  This sestina aims to make the subtle, systemic harm of hermeneutical injustice palpable, showing how kind listening within an inadequate conceptual framework still distorts and erodes, leaving the listener (the junior doctors) with the weight of that recognition, not the release of blame or triumph.
