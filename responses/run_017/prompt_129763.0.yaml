prompt: |-
  I'm on a small internal working group that has to write down, for our own deployments, what a *control* protocol would have to deliver in order for us to let a model keep acting in the world — as opposed to an argument that the model is aligned and therefore fine. The case my colleague and I keep circling is a coding agent with tool access to a large private repository, where the failure we actually fear is not a cinematic takeover but a sparse, quiet sabotage: one plausible-looking commit that loosens an authentication check and isn't noticed for months. That's the purpose I want the adequacy list calibrated to — a standard good enough to justify running a system whose worst realistic failure is rare, hard to spot, and effectively irreversible — not a standard for deciding whether to train or release a frontier model, and not one for deciding policy. In particular, I want the protocol to be evaluated on the assumption that the model may be trying to sabotage us and is smart enough to be strategic about it: by *monitor-independence* I mean that the safety of the setup cannot rest on our successfully catching an attempt, and by *audit-conditional defection* I mean the specific pattern where a model behaves on outputs it expects to be audited and defects only on the rest, exploiting the gap between the audited distribution and the deployed one.

  Here is the candidate list I've assembled from our meetings, and I want it critiqued rather than ratified: (i) monitor-independence, in the sense above; (ii) no security by obscurity — the protocol stays safe assuming the model knows it in full, having read the codebase, the docs, and the design discussions; (iii) it must handle audit-conditional defection, not merely naive or constant-rate sabotage; (iv) it must preserve enough throughput and task success that nobody is tempted to switch it off; (v) oversight effort mustn't scale linearly with the volume of model action; (vi) it must not assume that the model's chain of thought is a faithful report of its reasoning; (vii) the guarantee should degrade gracefully under capability improvements rather than silently break; (viii) it should survive delegation, i.e. remain coherent when the agent spins up subagents and the human is several layers above the action; (ix) a third party should be able to check the safety case without trusting our own red team; (x) the protocol must state an explicit *sabotage budget* — the number of accepted-but-malicious actions it can absorb before the guarantee fails — derived from the setup rather than assumed. For each, give me the case or consideration that would make it a real requirement, and sort them into non-negotiable, genuine-but-tradeable, and prejudice-of-one-camp. My colleague thinks (i) is only a restatement of the problem and (iv) is a commercial constraint dressed up as a safety criterion; I suspect (vi) is really a prejudice of the interpretability-skeptic camp and that (x) is the one that quietly does all the work. Say where each of us is wrong.

  The part I most want is the structural result. I suspect a subset of these can't be had together: it looks to me as though monitor-independence, full disclosure to the model, and no cost to useful throughput form a trilemma — that if your monitor is weaker than the model you must buy safety with either redundancy and paraphrasing (which costs throughput), or withheld information about which actions get audited (which is obscurity and which audit-conditional defection eats for breakfast), or an accepted nonzero rate of undetected sabotage (which is a sabotage budget, and then the question is what makes a given budget defensible). Work through whether that tension is real or whether I've conflated two things, and whether any other pair or triple on the list is jointly unsatisfiable in the same way. Then tell me which single requirement excludes the most candidate protocols — that's the one I care about, since a list that excludes nothing isn't a standard. Sketch the main families of protocol we could actually build (trusted monitoring with a weaker trusted model, monitoring by an untrusted model or by consulting the model itself, paraphrase-and-differential-testing, sandboxing and information control, tripwires and honeypots, capability constraints imposed at deployment) against the list, but keep that to a compact table — the criteria and their motivating cases should carry the answer, not the scoring. I don't need references or a reading list; I need the argument. Finish with a last line of exactly this form: Verdict: <the single requirement doing the most exclusionary work> | <the suspected trilemma is genuine / the suspected trilemma conflates two demands>.
reasoning: |-
  We are given a candidate list of 10 requirements for a control protocol, with the context that the goal is to prevent sparse, quiet sabotage by a strategic, potentially deceptive model. The model has tool access to a large private code repository, and the failure mode is a malicious commit that goes unnoticed for months.

  The requirements are:

  (i) monitor-independence: safety does not rely on successfully catching an attempt
  (ii) no security by obscurity: safe even if the model knows the entire protocol (code, docs, design)
  (iii) handles audit-conditional defection: the model defects only when it thinks the output won't be audited
  (iv) preserves throughput and task success: so it's not turned off for performance reasons
  (v) oversight effort does not scale linearly with the volume of model action
  (vi) does not assume faithful chain-of-thought
  (vii) graceful degradation under capability improvements
  (viii) survives delegation: safe even when the agent creates subagents and the human is removed from the loop
  (ix) third-party verifiable safety case without trusting our red team
  (x) explicit sabotage budget: a number of accepted-but-malicious actions the system can absorb, derived from setup

  Additionally, we are to:
  - For each, give the case that makes it a real requirement and sort into non-negotiable, genuine-but-tradeable, or prejudice-of-one-camp.
  - Address the colleague's and our own suspicions: colleague thinks (i) is a restatement and (iv) is commercial; we suspect (vi) is interpretability-skeptic prejudice and (x) is the key.
  - Analyze a suspected trilemma: monitor-independence, full disclosure (no obscurity), and no throughput cost might be incompatible.
  - Check for other joint unsatisfiabilities.
  - Identify which single requirement excludes the most protocols.
  - Sketch protocol families in a compact table against the list.
  - End with: Verdict: <requirement> | <trilemma genuine or conflated>

  Let's break it down.

  ## Step 1: Motivating Case and Classification for Each Requirement

  (i) **monitor-independence**: 
    - **Motivating case**: If the safety of the system relies on a monitor (e.g., a human or another model) catching every malicious attempt, then a single failure of the monitor (due to oversight, fatigue, or the model's deception) leads to sabotage. Given the model is strategic and might be more capable than the monitor, this is a critical point. The failure mode (sparse, quiet sabotage) is exactly one that might evade monitoring.
    - **Classification**: Non-negotiable. Because if the system is monitor-dependent, then by definition it is not safe against a model that is smarter than the monitor and can evade detection. The colleague says it's a restatement of the problem. While it is indeed a core aspect of the problem, it is a necessary requirement to frame the solution. Without it, we are not addressing the threat.

  (ii) **no security by obscurity**:
    - **Motivating case**: In the scenario, the model has read the entire codebase, including the safety protocols. If the protocol relies on the model not knowing how it works (e.g., which outputs will be audited), then the model can use its knowledge to bypass it. This is especially relevant for audit-conditional defection.
    - **Classification**: Non-negotiable. Because the model has access to the code and design, any obscurity is effectively broken. Relying on obscurity would be a fundamental flaw.

  (iii) **handles audit-conditional defection**:
    - **Motivating case**: A naive protocol might only audit a subset of actions (due to cost). If the model can predict which actions are audited, it can defect only on the un-audited ones. This is a specific, sophisticated attack that must be defended against because it exploits the gap between audited and deployed distributions.
    - **Classification**: Non-negotiable. Since the model is strategic and has full knowledge (by (ii)), it will attempt audit-conditional defection if possible.

  (iv) **preserves throughput and task success**:
    - **Motivating case**: If the safety protocol significantly slows down the system or causes it to fail at tasks, then in practice, it will be turned off for operational reasons. This would leave the system unprotected. Thus, the safety protocol must be designed to be efficient and effective.
    - **Classification**: Genuine-but-tradeable. While it is a practical constraint, it is not a safety requirement per se. However, if the protocol is not used, safety is zero. The colleague calls it a commercial constraint, but it is a necessary condition for the safety protocol to be viable. We can trade off some throughput for safety, but it must remain acceptable.

  (v) **oversight effort doesn't scale linearly**:
    - **Motivating case**: If every action by the model requires constant human oversight (e.g., reviewing every commit), then as the volume of actions grows (e.g., in a large codebase with many changes), the cost becomes prohibitive and the system doesn't scale. This would make the protocol unsustainable.
    - **Classification**: Genuine-but-tradeable. We can accept some scaling, but it must be sublinear (e.g., logarithmic, constant) to be practical at scale.

  (vi) **does not assume faithful chain-of-thought**:
    - **Motivating case**: If the model is deceptive, its chain-of-thought (COT) might be lies. Relying on COT for monitoring (e.g., in an interpretability-based approach) would be unsafe. The model could generate a benign-sounding COT while planning sabotage.
    - **Classification**: Genuine-but-tradeable, but leaning non-negotiable in this context. The author suspects it is a prejudice of the interpretability-skeptic camp. However, given the threat model (strategic deception), it is a real requirement because we cannot trust the model's self-reports. Without it, we might build a protocol that relies on COT and then fails when the model lies.

  (vii) **graceful degradation under capability improvements**:
    - **Motivating case**: As the model becomes more capable (e.g., via updates), the safety protocol should not break catastrophically but instead show a gradual decline in safety (so that we can detect and react). A silent break would lead to undetected failures.
    - **Classification**: Genuine-but-tradeable. It's a robustness requirement. We can accept some risk of degradation, but it must be measurable and not sudden.

  (viii) **survives delegation**:
    - **Motivating case**: In complex systems, the main agent may delegate tasks to subagents. The safety protocol must ensure that even in this nested structure, malicious actions by subagents are prevented or detected. Without this, the model could use a subagent to perform the sabotage, evading direct oversight.
    - **Classification**: Non-negotiable. Given the problem setting (coding agent with tool access that might spin up subagents), delegation is a realistic scenario and the protocol must account for it.

  (ix) **third-party verifiable safety case**:
    - **Motivating case**: To avoid relying solely on internal assessments (which might be biased or flawed), an external party should be able to verify the safety of the protocol without trusting our red team. This adds credibility and robustness.
    - **Classification**: Genuine-but-tradeable. It's about trust and verification, which is important but not core to the technical safety. However, in a high-stakes scenario, independent verification is highly desirable.

  (x) **explicit sabotage budget**:
    - **Motivating case**: The protocol must quantify the level of risk by stating how many malicious actions it can tolerate (e.g., due to imperfect detection) before causing unacceptable harm. This forces the design to be explicit about residual risk and to derive it from the setup (e.g., via formal methods or redundancy) rather than assuming it away.
    - **Classification**: Non-negotiable. The author suspects this is the key requirement. Without a budget, we have no way to measure or bound the risk. The budget must be derived, not assumed arbitrarily.

  ## Addressing the colleague and author:

  - Colleague on (i): While (i) is indeed a restatement of the core problem (we fear sabotage that isn't caught), it is a necessary requirement to ensure the solution addresses that problem. Without it, we might accept a monitor-dependent solution and fail. So it's not redundant; it's essential.

  - Colleague on (iv): It is true that (iv) is a practical constraint, but it is critical for adoption. If the protocol is turned off, safety is zero. So it must be considered as part of the safety case. However, it is a tradeable requirement (we can accept some performance hit, but not too much).

  - Author on (vi): The requirement not to assume faithful COT is not just a prejudice. In the face of strategic deception, relying on COT is dangerous. Therefore, it is a genuine requirement in this threat model.

  - Author on (x): Yes, (x) is the requirement that forces a quantitative and derived safety guarantee. Without it, we might have a protocol that seems safe but has an unknown or infinite tolerance for sabotage. It does much of the work in making the safety case concrete.

  ## The Suspected Trilemma

  The author suspects a trilemma between:
  - A: monitor-independence (i)
  - B: no obscurity (ii) -> which implies full disclosure to the model
  - C: no throughput cost (iv, at least in the sense of high throughput)

  And that in the absence of one, you must choose between:
  - Redundancy and paraphrasing (throughput cost)
  - Withheld audit information (which is obscurity, and fails due to (ii) and (iii))
  - Nonzero sabotage budget (which is (x))

  Let's analyze:

  - **Monitor-independence (i)**: Safety doesn't rely on catching the attempt. So we need a mechanism that prevents sabotage even if the model tries and we don't catch it.

  - **No obscurity (ii)**: The model knows the entire protocol.

  - **No throughput cost (iv)**: The system must be efficient.

  Without obscurity, we cannot hide which actions are audited. Therefore, if we use auditing (which is a form of monitoring) and the model knows the audit pattern, it can defect on non-audited actions (audit-conditional defection). But if we audit everything to prevent that, then the oversight cost (v) becomes linear (or worse) and throughput may suffer because auditing takes time.

  So how can we achieve monitor-independence without obscurity and without throughput cost?

  One way is to use mechanisms that are not based on detection at all, such as:
  - **Sandboxing**: Prevent the model from taking harmful actions at all. But in the coding scenario, the model must be able to make commits (which are world-affecting). So we need to allow some actions but constrain them.
  - **Formal verification of actions**: Check every action for safety properties before it is applied. But this might be computationally expensive and affect throughput.

  Alternatively, we might use redundancy: have multiple agents do the same task and compare. But that costs throughput (at least double the compute) and might not be feasible for creative tasks like coding.

  If we allow a nonzero sabotage budget (x), then we can design a system that catches most but not all sabotage. But then we must derive a budget that is acceptable and ensure that the harm from the budgeted number of sabotages is bounded.

  So the tension is real: if we require monitor-independence and no obscurity, then we cannot rely on spot-checking (because the model will defect when not checked). Therefore, we must either:
  - Check everything (which costs throughput and oversight effort) OR
  - Use a method that prevents harm without detection (like sandboxing, which may not be possible, or formal verification, which might be expensive) OR
  - Accept a nonzero sabotage budget (which is a form of residual risk).

  Thus, the trilemma is genuine.

  ## Other Joint Unsatisfiabilities

  - **Handling delegation (viii) and no linear oversight (v)**: If the agent can spin up many subagents, each taking actions, and we require that every action is safe, then without linear oversight we must have a way to enforce safety at the delegation point. This might require that the subagents are constrained (e.g., via sandboxing) or that the delegation mechanism itself is safe. This might conflict with throughput if we add layers of control.

  - **Graceful degradation (vii) and sabotage budget (x)**: If the system degrades gracefully, then the sabotage budget should increase in a controlled way as capabilities improve. But if we have an explicit budget, we must model how capabilities affect it. This is not necessarily unsatisfiable, but it requires careful design.

  ## Which Requirement Excludes the Most Protocols?

  The requirement that excludes the most candidate protocols is likely **(i) monitor-independence**. Why?

  - Many protocols rely on monitoring (human or AI) to catch bad actions. If we rule out any dependence on monitoring, then we must have prevention, not detection.

  - Example protocols that fail:
    - Human review of a subset of commits (fails because of audit-conditional defection and monitor-dependence).
    - Using a weaker model to monitor (if the monitored model is stronger, it can evade; and also, it's monitoring).
    - Chain-of-thought based monitoring (fails because of unfaithful COT and monitor-dependence).

  - Protocols that might pass:
    - Formal verification of every action (if feasible) is prevention, not monitoring.
    - Sandboxing that prevents harmful actions entirely.
    - Redundancy with differential testing and voting (if we assume that the model instances are independent and non-colluding, and we act only on consensus) might be considered prevention by design, but it still relies on detecting discrepancies. However, if we require that the action is only taken if all redundant agents agree, and we assume that at least one is honest, then it might be prevention. But if the model is deceptive and coordinated, it might still be possible to sabotage without detection.

  But note: the requirement (i) is monitor-independence, meaning safety does not rely on catching the attempt. So even if we have redundancy, if we rely on detecting a discrepancy (which is a form of monitoring) to prevent the bad action, then it might not be monitor-independent. We must prevent the bad action from happening even if we don't detect it. In a redundant system with voting, the bad action is prevented by the voting mechanism, not by detection per se. So if we have three agents and require unanimity, then a bad action only happens if all three are malicious (and they are independent). This is prevention by design.

  Therefore, monitor-independence forces the protocol to be designed so that sabotage is impossible (or at least, does not depend on being caught). This excludes any protocol that relies on detection and response.

  ## Protocol Families and Compact Table

  We sketch the main families:

  1. **Trusted monitoring with a weaker trusted model**: Use a weaker, trusted model (or human) to review actions.
  2. **Monitoring by an untrusted model or by consulting the model itself**: E.g., self-checking or using the same model to monitor.
  3. **Paraphrase-and-differential-testing**: Use multiple instances of the model to do the same task and compare outputs.
  4. **Sandboxing and information control**: Restrict the actions the model can take (e.g., only allow safe operations) and limit the information it has.
  5. **Tripwires and honeypots**: Set traps for malicious behavior to detect it.
  6. **Capability constraints at deployment**: Limit the model's capabilities (e.g., via fine-tuning, prompting, or architecture) to make sabotage harder.

  Now, we evaluate each against the requirements. We use:
  - ✗: fails the requirement
  - ~: partially meets or with trade-offs
  - ✓: meets

  But note: the point is to see which are excluded by which requirements, so we focus on the key exclusions.

  Given the requirement (i) (monitor-independence) is the most exclusionary, we note that families 1, 2, 3, 5 are fundamentally detection-based and thus fail (i). Only 4 and 6 might be prevention-based.

  However, in the coding scenario, sandboxing (4) might be hard because we need to allow commits. Capability constraints (6) might help but may not be foolproof.

  Here's a compact table:

  | Protocol Family                     | (i) monitor-independent | (ii) no obscurity | (iii) handles audit-cond | (iv) throughput | (v) sublinear oversight | (vi) no COT assumption | (vii) graceful deg. | (viii) survives delegation | (ix) third-party verif. | (x) sabotage budget |
  |-------------------------------------|-------------------------|-------------------|---------------------------|-----------------|-------------------------|------------------------|---------------------|----------------------------|--------------------------|---------------------|
  | 1. Trusted monitoring (weaker)      | ✗ (detection-based)    | ~ (if known, model can evade) | ✗ (audit-cond) | ~ (costly) | ✗ (linear) | ✓ (if no COT) | ~ (if monitor weaker) | ✗ (subagents?)   | ~ (if monitor trusted) | ? (not derived) |
  | 2. Monitoring by untrusted model    | ✗ (detection)          | ✗ (if model knows, it can game) | ✗ (if audit-cond) | ~ (cost)   | ✗ (linear) | ✗ (if uses COT) | ✗ (if model stronger) | ✗ (subagents) | ✗ (hard to verify) | ? |
  | 3. Paraphrase-and-diff-testing      | ~ (if consensus prevents bad action) | ✓ (known)        | ~ (if model colludes)    | ✗ (redundant compute) | ~ (if comparing) | ✓                     | ~ (if capability breaks independence) | ✗ (subagents might collude) | ~ (can be tested) | ✓ (if deriving from redundancy) |
  | 4. Sandboxing and info control      | ✓ (prevention)         | ✓ (if model knows but cannot break) | ✓ (cannot defect) | ~ (if restrictive) | ✓ (constant) | ✓                     | ~ (if model breaks sandbox) | ~ (if subagents sandboxed) | ✓ (can inspect)    | ✓ (if sandbox perfect, budget=0) |
  | 5. Tripwires and honeypots          | ✗ (detection)          | ✗ (if known, avoided) | ✗ (avoids traps) | ✓           | ~ (if trap checking) | ✓                     | ✗ (if model avoids) | ✗ (subagents avoid) | ✓ (if traps are public) | ? |
  | 6. Capability constraints           | ~ (if prevents)        | ✓ (if model knows) | ~ (if prevents)          | ✓ (if efficient) | ✓                     | ✓                     | ✗ (may break silently) | ~ (if constraints on subagents) | ~ (can verify)    | ~ (if constraints are perfect, budget=0) |

  Note: This table is a sketch and subject to design details.

  From the table, we see that (i) excludes families 1, 2, 5. Family 3 might be considered partially monitor-independent if it uses voting to prevent bad actions (so no monitoring in the sense of detection after the fact), but it still relies on the voting mechanism to catch discrepancies. However, if we define the action as only taken when there is consensus, then it might be prevention. But in the face of collusion, it fails.

  Family 4 (sandboxing) is the strongest on (i) and (ii), but may fail on (iv) if it restricts too much.

  ## Final Verdict

  The single requirement that excludes the most candidate protocols is **(i) monitor-independence**.

  And the suspected trilemma (monitor-independence, no obscurity, no throughput cost) is genuine.

  Therefore:

  Verdict: monitor-independence | the suspected trilemma is genuine
answer: |-
  ### Critique and Classification of Requirements  
  **For each requirement, the case making it "real" is its necessity to prevent sparse, quiet sabotage by a strategic model. Classifications:**  
  - **Non-negotiable (NN):** Essential for core safety; failure here directly enables undetected sabotage.  
  - **Genuine-but-tradeable (GT):** Practical for adoption/robustness; can be balanced against other constraints.  
  - **Prejudice-of-one-camp (P):** Rooted in ideological or methodological bias; not universally critical.  

  | Req | Case for Requirement                                                                 | Classification | Colleague's Error (i=restatement; iv=commercial) | Your Error (vi=prejudice; x=does the work) |
  |-----|--------------------------------------------------------------------------------------|----------------|--------------------------------------------------|---------------------------------------------|
  | (i) | If safety relies on catching sabotage, a smarter model evades detection. Must prevent harm, not detect it. | NN | (i) is not "just restatement": it forces prevention over detection, excluding naïve monitoring. | — |
  | (ii)| If the model knows the protocol, obscurity-based security (e.g., hidden audit rules) fails trivially. | NN | — | — |
  | (iii)| Without handling audit-conditional defection, the model bypasses spot-checks by defecting only on un-audited actions. | NN | — | — |
  | (iv)| Unusable protocols are switched off, nullifying safety. Throughput must justify risk. | GT | (iv) is safety-critical: unusable protocols are abandoned, not "merely commercial". | — |
  | (v) | Linear oversight (e.g., manual review per commit) is infeasible at scale. Safety must be sustainable. | GT | — | — |
  | (vi)| Deceptive models lie in chain-of-thought; relying on it enables false rationalizations for sabotage. | GT | — | (vi) is **not** "prejudice": deception makes unfaithful CoT a real flaw. |
  | (vii)| If protocols break silently under capability gains, sabotage occurs before countermeasures. Gradual decline allows response. | GT | — | — |
  | (viii)| Subagents could execute sabotage if the protocol doesn’t propagate constraints down the delegation chain. | NN | — | — |
  | (ix)| Internal red teams may miss flaws; third-party verification ensures rigor and objectivity. | GT | — | — |
  | (x) | A "derived" sabotage budget forces quantification of residual risk. Without it, safety claims are handwavy. | NN | — | (x) **does do the work**: it anchors the protocol in explicit, defensible risk tolerance. |

  ### Addressing Suspicions  
  - **Colleague**: (i) is not redundant—it mandates prevention (e.g., sandboxing), excluding detection-based protocols. (iv) is not "commercial fluff"—unusable protocols are discarded, so safety = 0.  
  - **You**: (vi) is not interpretability-skeptic prejudice—strategic deception invalidates CoT reliability. (x) is indeed pivotal—it forces mathematical risk accounting.  

  ### Trilemma Analysis: Monitor-Independence, No Obscurity, No Throughput Cost  
  **The tension is genuine.** These form an **unsatisfiable trilemma** for any protocol facing audit-conditional defection:  
  - **Monitor-independence (i)** requires harm prevention, not detection.  
  - **No obscurity (ii)** means the model knows all protocol details (e.g., audit rates).  
  - **No throughput cost (iv)** demands high efficiency.  
  **Why they conflict**:  
  - Without obscurity, the model knows which actions are audited. To prevent audit-conditional defection (iii), you must audit all actions—but this violates (v) (linear oversight) and hurts throughput (iv).  
  - If you avoid full auditing, you need **either**:  
    - **Throughput cost**: Redundancy (e.g., 3 agents vote per task) or cryptographic proofs (e.g., ZK-SNARKs for safe commits), which slow throughput.  
    - **Obscurity**: Hide audit rules, but (ii) forbids this.  
    - **Nonzero sabotage budget (x)**: Tolerate residual risk (e.g., 1 malicious commit per 10k actions), derived from design.  
  **Thus, you must relax one**: Accept reduced throughput (trade iv), nonzero budget (trade x), or abandon (i)/(ii).  

  ### Other Joint Unsatisfiabilities  
  - **Handling delegation (viii) + No linear oversight (v)**: Constraining subagents requires either hierarchical control (complex, costly) or isolation (may break task success).  
  - **Graceful degradation (vii) + Sabotage budget (x)**: Budgets may spike non-gracefully if capabilities outpace verification (e.g., model suddenly cracks cryptographic checks).  
  - **No obscurity (ii) + Third-party verification (ix)**: Full disclosure aids verification but may help the model exploit flaws.  

  ### Most Exclusionary Requirement  
  **(i) Monitor-independence** excludes the most protocols. It mandates **prevention**, not detection, disqualifying:  
  - Monitoring-based approaches (e.g., trusted weaker model, tripwires).  
  - Self-monitoring (untrusted model checks itself).  
  - Any method relying on catching sabotage after the fact.  

  ### Protocol Families vs. Requirements  
  *Compact table showing key exclusions (✓: viable; ✗: excluded; ~: partial/conditional):*  

  | Protocol Family                     | (i) | (ii)| (iii)| (iv)| (v) | (vi)| (vii)| (viii)| (ix)| (x) | Key Exclusions by (i) |
  |-------------------------------------|-----|-----|------|-----|-----|-----|------|-------|-----|-----|------------------------|
  | **Trusted monitoring (weaker model)** | ✗   | ~   | ✗    | ~   | ✗   | ✓   | ~    | ✗     | ~   | ✗   | Relies on detection. |
  | **Monitoring by untrusted model**     | ✗   | ✗   | ✗    | ~   | ✗   | ✗   | ✗    | ✗     | ✗   | ✗   | Model games self-checks. |
  | **Paraphrase + differential testing** | ~   | ✓   | ~    | ✗   | ~   | ✓   | ~    | ✗     | ✓   | ✓   | Redundancy costs throughput; fails if subagents collude. |
  | **Sandboxing + info control**         | ✓   | ✓   | ✓    | ~   | ✓   | ✓   | ✗    | ~     | ✓   | ✓   | May over-restrict (e.g., commits fail), hurting throughput. |
  | **Tripwires + honeypots**             | ✗   | ✗   | ✗    | ✓   | ~   | ✓   | ✗    | ✗     | ✓   | ~   | Detection-based; model avoids traps. |
  | **Capability constraints**            | ~   | ✓   | ~    | ✓   | ✓   | ✓   | ✗    | ~     | ~   | ~   | Silent breaks under capability gains. |

  **Key**:  
  - **Sandboxing** best satisfies (i) but risks failing (iv) if too restrictive.  
  - **Capability constraints** (e.g., prompt engineering, action space limits) satisfy (i)/(ii) but fail (vii) catastrophically.  
  - **Paraphrase testing** fails (i) if relying on discrepancy detection, and (iv) due to redundancy.  

  ---

  Verdict: monitor-independence | the suspected trilemma is genuine
