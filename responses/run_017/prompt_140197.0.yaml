  Must emphasise where I'm reconstructing: the three types of givenness are my framing, and Hofstadter might not have articulated the fixed-point requirement exactly so. User's description seems accurate otherwise. Central claim: friend's "bigger space" argument does miss the point about semantic emergence. Confidence: 80% on that, 60% on escaping the regress via fluid concepts. 

