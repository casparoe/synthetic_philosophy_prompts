answer: |-
  Here's a systematic analysis of the Asilomar conference through the lens of the unilateralist's curse (UC), addressing your stipulated facts and probing the deeper questions:

  ### 1. Mapping the Unilateralist's Curse to Asilomar
  - **Agents**: Primarily individual Principal Investigators (PIs) and their labs. *Partially* funders (NIH) and institutions (universities), but PIs held direct action capacity.
  - **Unilateral Act**: Initiating high-risk recombinant DNA experiments without consensus (e.g., inserting cancer genes into *E. coli*).
  - **Shared Downside**: Accidental release of bioengineered pathogens causing pandemics, ecological disruption, or loss of public trust in science.
  - **Preconditions**:
    - **Enough agents**: *Holds* (100s of labs globally).
    - **Dispersion of judgment**: *Partially holds*. Wide initial dispersion on risk severity (e.g., "near-zero risk" vs. "civilization-threat"), but risk estimates were highly uncertain and evidence-poor.
    - **Irreversibility**: *Weakly holds*. A lab escape might be locally reversible, but a pandemic would be globally irreversible. This was a key motivator.
    - **No blocking power**: *Fails*. Funders (NIH), journals, and institutions could block non-compliant research. This is a **critical deviation** from UC's core assumption.

  ### 2. What the Model Predicts
  - **Sharp prediction**: The voluntary pause *should have collapsed quickly*. The most optimistic (risk-tolerant) lab, facing high career incentives (Nobel priority, funding competition), would defect secretly. Guidelines would then converge to the *lowest-threshold agent's preference* (minimal restrictions), as defection incentivizes others to abandon restraint.  
  - **Why it’s not vague**: UC predicts **systematic pressure toward the lower tail** of risk tolerance due to action bias, not just general fragility. Restraint requires unanimous compliance; one defector unravels it.

  ### 3. What Actually Happened vs. Model Prediction
  - **Reality**: Near-universal compliance during the voluntary pause (1974–1976). Guidelines were adopted and enforced via NIH rules. Restrictions were later relaxed *based on evidence*, not defection.
  - **Model Explanations**:
    - UC explains the *urgency* behind Berg's call: without coordination, low-threshold labs might act first.
    - It highlights why *inaction* (the pause) was unstable without institutions.
  - **Model Misses/Misdescribes**:
    - **No defection occurred**: Shared moral responsibility and peer pressure overrode individual incentives.
    - **Institutions mattered**: NAS/NIH provided "blocking power," violating UC's assumption of unilateral action capacity.
    - **Deliberation reduced dispersion**: Asilomar compressed risk estimates (see 4b).

  ### 4. Theory Implications: Confirmation, Anomaly, or Extension?
  **(a) Restraint as the Mirror Curse**  
  - Yes, a symmetric "restraint curse" exists: the *most impatient/risk-tolerant agent* can unilaterally *defect*, capturing benefits (fame, discovery) while externalizing risks.  
  - **Key difference from action curse**: Defection from restraint is detectable (labs publish/apply for grants), enabling punishment. This made Asilomar’s restraint *more stable* than UC predicts.  
  - **Pause as pessimistic tail**: The 1974 moratorium *was* driven by the most risk-averse voices (Berg, etc.). However, this was later corrected by evidence—unlike UC's irreversible actions.

  **(b) Endogenous Dispersion**  
  - UC assumes fixed, dispersed priors. Asilomar **directly targeted dispersion** via:  
    - Evidence-pooling (e.g., tumor virus data sharing).  
    - Risk categorization (creating "brackets" like BL1-BL4 containment).  
  - **Implication**: The curse arises from *institutional absence*, not just individual rationality. The remedy isn't conformity, but **structured deliberation to align priors**. Mandatory disclosure (e.g., pre-registration) could substitute where institutions are weak.

  **(c) Errors vs. Stakes**  
  - **Dominant driver**: Initially, *stakes* (career incentives) aligned with UC. But *moral responsibility* (fear of catastrophe) created countervailing pressures.  
  - **Why conformity isn't the fix**: If stakes dominate (e.g., winner-takes-all AI race), conformity fails. Asilomar worked because:  
    - Upside/downside were *shared* (all biologists risked backlash).  
    - **Liability** was implied (labs could be sued for leaks).  
    - **Fix alignment**: Solutions must balance incentives (e.g., funder penalties for defection).

  ### 5. Where the Model is Silent (and That’s Okay)  
  - **Threshold-setting**: UC doesn’t explain *how* agents form risk estimates. Asilomar’s guidelines emerged from technical debate, not pre-existing thresholds.  
  - **Timing/duration**: UC ignores costs of delay. Asilomar’s 18-month pause was acceptable because risks were novel and evidence accelerated quickly.  
  - **Expanding agency**: UC assumes fixed actors. Asilomar intentionally included lawyers/physicians to *alter* decision-making dynamics, reducing scientist sovereignty.  
  - **Legitimization effect**: The pause built public trust, accelerating funding post-guidelines—a positive externality UC can’t capture.  
  - **You’re correct**: UC says nothing about these. Adding them would overextend the model.

  ---

  ### Asilomar as AI Governance Precedent: One Paragraph  
  The analogy is **superficially useful but deeply flawed**. Asilomar succeeded because: (1) risks were *lab-contained* and *testable* (unlike AI’s diffuse deployment); (2) actors were a cohesive community with shared norms; (3) evidence resolved uncertainty within years. UC explains why AI *needs* an Asilomar-like institution to prevent rogue actors, but AI’s lower evidence-resolvability, profit-driven stakes, and geopolitical fragmentation make restraint far harder. Invoking Asilomar optimistically ignores that its success relied on conditions absent in AI—making the curse *more* applicable today, not less.  

  Would you like to drill deeper into any section (e.g., institutional design lessons for AI)?
