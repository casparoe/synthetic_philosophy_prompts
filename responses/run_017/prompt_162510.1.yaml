  Below is the complete interactive position-sorter instrument for your seminar. It includes 10 scenarios (aligned with your cases) with 2-3 non-jargon questions each, a scoring key mapping answer patterns to positions, a decision tree showing forks and leaves, and analysis of limitations. All questions and options avoid technical terms like "phenomenal" or "access."

  ---

  ### **Scenarios and Questions**
  Each scenario has 1-2 questions. Students click through each scenario and select options. Answers are recorded as letters (e.g., A, B).

  1. **Briefly Flashed Array**  
     *Letters flash on a screen for an instant. Afterward, the subject can name any single row if cued but insists they saw the whole array.*  
     - Q1: Whose account do you find more reliable?  
       - A: The subject’s claim that they saw everything.  
       - B: The test showing they can only report one row at a time.  
     - Q2: Since they could report any row if asked, does that mean they experienced the whole array during the flash?  
       - A: Yes.  
       - B: No.  

  2. **Blindsight**  
     *Someone with brain damage can "guess" object locations above chance and guide movements but denies seeing anything.*  
     - Q1: Do you think they had visual experiences?  
       - A: Yes, because they used the information to act.  
       - B: No, because they deny it sincerely.  

  3. **Driving on Autopilot**  
     *A driver navigates a familiar route safely but has no memory or sense of having seen the road.*  
     - Q1: Was the driver aware of the road during the drive?  
       - A: Yes, because they processed it to drive.  
       - B: No, because they weren’t paying attention.  
     - Q2: If an obstacle appeared, they would have reacted using road information. Does that mean they were aware during the drive?  
       - A: Yes.  
       - B: No.  

  4. **Masked Stimulus**  
     *A briefly shown word influences your next action, but you swear you never saw it.*  
     - Q1: Was this word experienced when it appeared?  
       - A: Yes, because it affected your behavior.  
       - B: No, because you didn’t notice it.  

  5. **Vivid Dream**  
     *You have a vivid dream but cannot report or act on it until you wake.*  
     - Q1: Is the dream an experience while it’s happening?  
       - A: Yes.  
       - B: No.  
     - Q2: If you woke mid-dream, you could report it. Does that make it an experience *during* the dream?  
       - A: Yes.  
       - B: No.  

  6. **Background Feeling**  
     *You have a mild ache or unease for minutes but only "notice" it later.*  
     - Q1: Was this feeling an experience *before* you noticed it?  
       - A: Yes.  
       - B: No.  

  7. **Change Blindness**  
     *A subject confidently describes a scene wrong after a hidden change.*  
     - Q1: What does their wrong report suggest?  
       - A: They experienced the scene as they described it (even if wrong).  
       - B: They didn’t experience the change and filled in the gap.  

  8. **Distracted Reading**  
     *You read a page while daydreaming, then answer questions about it correctly.*  
     - Q1: Were you aware of the text *while* reading?  
       - A: Yes.  
       - B: No.  

  9. **Tip-of-the-Tongue Thought**  
     *A thought guides your typing, but you can’t say what it was.*  
     - Q1: Was this thought an experience when it guided you?  
       - A: Yes.  
       - B: No.  

  10. **Shifting Reports**  
      *A subject’s account of what they saw changes if asked to describe freely vs. pick from options.*  
      - Q1: Which report reflects their true experience?  
        - A: The free description.  
        - B: The multiple-choice pick.  

  ---

  ### **Scoring Key: Mapping Answers to Positions**  
  Map the answer pattern to one of the six positions. Use a simple tally:  
  - **Global Workspace (Broadcast Identity)**: Mostly B on "conflict" cases (Q1 in Scenarios 1, 2, 4, 7, 10), B for "counterfactual" (Q2 in Scenarios 3, 5), and A only when use/report is confirmed (e.g., B in Scenarios 3-Q1, 8, 9).  
  - **Phenomenal Overflow (Block-style)**: A on "trust subject" conflicts (Scenarios 1-Q1, 7-Q1, 10-Q1), B on blindsight (2-Q1), A for unreportable cases (5-Q1, 6-Q1), B for automatic cases (3-Q1).  
  - **Higher-Order View**: A on "trust subject" conflicts (1-Q1, 7-Q1, 10-Q1), B for blindsight (2-Q1), B for counterfactuals (3-Q2, 5-Q2, 6-Q1), B for distracted cases (8-Q1).  
  - **First-Order Representationalism**: A for "performance-based awareness" (2-Q1, 3-Q1, 9-Q1), B for unreportable cases (1-Q2, 5-Q1, 6-Q1), A for counterfactuals (3-Q2, 5-Q2).  
  - **Illusionism/Eliminativism**: B almost everywhere, especially on conflicts (1-Q1, 2-Q1, 4-Q1, 7-Q1, 10-Q1) and counterfactuals (3-Q2, 5-Q2, 6-Q1).  
  - **Deflationism**: Mixed/inconsistent answers (e.g., A and B split evenly) or "it depends" reasoning.  

  **Simplified Flow**:  
  - Trust subject in conflicts? → **Yes**: Go to Phenomenal Overflow or Higher-Order.  
    - Accept unreportable experiences (e.g., dreams, background feelings)? → **Yes**: Phenomenal Overflow. **No**: Higher-Order.  
  - Trust performance in conflicts? → **Yes**: Go to Global Workspace, First-Order, or Illusionism.  
    - Accept counterfactuals? → **Yes**: First-Order. **No**: Go to Global Workspace or Illusionism.  
      - Deny awareness in automatic cases (driving, distracted reading)? → **Yes**: Illusionism. **No**: Global Workspace.  
  - Mixed/inconsistent? → Deflationism.  

  ---

  ### **Decision Tree**  
  Nested bullets showing forks (branch nodes) and positions (leaves). Each leaf includes one sentence on its "most awkward commitment."

  - **Fork 1: In conflict cases (performance vs. subject report), whose testimony is prioritized?**  
    - *Subject’s report prioritized (e.g., A in 1-Q1, 7-Q1, 10-Q1)*:  
      - **Fork 2: Can unreportable/unused states be experiences (e.g., dreams, background feelings)?**  
        - *Yes (e.g., A in 5-Q1, 6-Q1)*: → **Phenomenal Overflow (Block-style)**  
          - *Most awkward commitment:* Rich experiences exist even if they vanish without a trace and cannot be used or reported.  
        - *No (e.g., B in 5-Q1, 6-Q1)*: → **Higher-Order View**  
          - *Most awkward commitment:* You can have detailed sensory information (e.g., in blindsight) with zero experience if you aren’t aware *of* it.  
    - *Performance prioritized (e.g., B in 1-Q1, 2-Q1, 4-Q1)*:  
      - **Fork 3: What level of behavioral effect signifies awareness?**  
        - *Influence-only suffices (e.g., A in 4-Q1)*: → **Unoccupied (merely unattractive)**  
          - *Why:* Makes subliminal stimuli "experiences," diluting the concept; no major theory holds this.  
        - *Use-ready (available for reasoning/action) suffices, but not influence-only (e.g., A in 3-Q1, 9-Q1; B in 4-Q1)*:  
          - **Fork 4: Does counterfactual availability count (would it be used if needed)?**  
            - *Yes (e.g., A in 3-Q2, 5-Q2)*: → **First-Order Representationalism**  
              - *Most awkward commitment:* Blindsight patients *are* having visual experiences but don’t know it (denial is mistaken).  
            - *No (e.g., B in 3-Q2, 5-Q2)*: → **Global Workspace (Broadcast Identity)**  
              - *Most awkward commitment:* Dreams aren’t experiences—they only "become" one if remembered on waking.  
        - *Report-ready required (e.g., B in 3-Q1, 8-Q1, 9-Q1)*: → **Unoccupied (incoherent)**  
          - *Why:* Requires that experiences vanish if unused (e.g., thoughts guiding action aren’t experiences), but this contradicts self-reports; no coherent position exists.  
      - *Deny awareness in most cases (e.g., B in 1-Q1, 2-Q1, 3-Q1, 5-Q1, 6-Q1, 8-Q1, 9-Q1)*: → **Illusionism/Eliminativism**  
        - *Most awkward commitment:* What we call "experience" is an illusion—nothing is truly felt, only computed.  
    - *Inconsistent/mixed priorities*: → **Deflationism**  
      - *Most awkward commitment:* Disagreements about "awareness" are verbal—there’s no fact to discover.  

  ---

  ### **Limitations: Indistinguishable Pairs and Unoccupied Cells**  
  **Indistinguishable Pairs**:  
  - **Global Workspace vs. Higher-Order** in unreportable cases (e.g., driving, dreams): Both deny awareness if unreportable, but for different reasons (GW: not broadcast; HO: no higher-order state). The instrument separates them via Fork 1 (subject trust) and Fork 2 (unreportable experiences).  
  - **Phenomenal Overflow vs. First-Order** in blindsight: Both can say "no experience" (Overflow: no phenomenology; First-Order: not poised for use). Separated by conflict cases (Overflow trusts subject; First-Order trusts performance).  
  - **Higher-Order vs. Deflationism** if inconsistent: Deflationism is a catch-all for mixed answers; HO has a consistent "no unreportable experiences" rule.  

  **Unoccupied Cells and Why**:  
  - **Influence-only as sufficient (Fork 3)**: Unattractive—no theory accepts it, as it equates unconscious priming with experience.  
  - **Report-ready required (Fork 3)**: Incoherent—it denies awareness in use-ready cases (e.g., guiding actions without report), which contradicts how we describe thoughts/actions.  
  - **Counterfactual-only without use-ready**: Unoccupied—theories require *some* actual access (use or report); "could have been used" alone isn’t defended.  
  - **Trust performance but accept unreportable experiences**: Unoccupied—performance metrics (e.g., naming rows) can’t confirm unreportable states, creating tension.  

  ---

  ### **Implementation Notes**  
  - **How to Use**: Deploy as a web form (e.g., Google Forms, Qualtrics) with one scenario per page. Use the scoring key to assign positions based on answer patterns.  
  - **Why It Works**: Forces students to confront empirical dilemmas (conflict, counterfactuals) without jargon, revealing implicit commitments. Empty cells highlight conceptual boundaries.  
  - **Adjustments**: Swap cases freely (e.g., use "subliminal advertising" for masked stimulus) if they fit the fork.  

  This instrument covers your constraints and cases while generating clear, debate-ready outcomes. Let me know if you need tweaks!
