prompt: |-
  I am writing up my settled position on the epistemology of moral testimony for a reading group, and I would like it stress-tested for internal consistency before I present it. What follows is the package as I actually hold it, including one principle of my own that I have not seen defended anywhere and that I am not confident about.

  1. Asymmetry. I am a pessimist about moral testimony. A moral belief formed purely on another person's say-so — I am told that some practice is unjust, I have no independent grip on why it is, and I believe it anyway — is defective in a way that ordinary empirical testimonial belief is not. I have no quarrel with deferring to a mechanic about my car or to a colleague about the trains; those beliefs are in perfectly good epistemic order. The defect in the moral case is not that the belief is unlikely to be true, and I do not want to claim that it can never constitute knowledge. It is a real defect nonetheless.

  2. Grounds. The best explanation of 1 is that a moral belief is supposed to be held in light of the considerations that support it. Someone who believes that a practice is wrong only because she was told so does not stand in the right relation to the reasons there are, and the belief is for that reason second-rate — defective in the holder rather than unreliable as a guide to the facts.

  3. No expertise. A large part of why moral testimony is different is that there are no moral experts in the sense in which there are transmission experts or diagnostic experts. There is no track record by which one could be identified, no credentialing, and pervasive and apparently intractable disagreement among the people who would be candidates. Moral testimony therefore lacks the backing that normally makes testimony a good source.

  4. Transmission is fine. None of this applies to testimony that conveys the reasons. If an activist tells me that a certain agricultural practice is wrong and gives me the considerations, and I see their force, my belief is in perfect order — and it does not matter at all that I would never have found those considerations myself, or that I cannot defend them under pressure, or that I would have believed the opposite if I had been told the opposite first.

  5. Conciliationism. When someone I take to be my epistemic peer disagrees with me about a moral question, I should substantially reduce my confidence and move some distance toward her view, even if she offers me no new considerations and even if my own reasoning still looks fine to me on reflection.

  6. Inaccessibility exemption. This is my own addition, and it is the part I am least sure about. I want to say that the defect identified in 2 does not arise when the recipient could not, even in principle, have come to grasp the relevant grounds herself — because the grounds are accessible only from experience she cannot have, or require a kind of perceptual or social sensitivity that cannot be communicated in the space available. In such a case deferring is not defective at all, even though the recipient ends up exactly as she would in the paradigm bad case: believing, without grounds, on someone's say-so.

  7. Anti-moral-worth. I reject the strong Kantian claim that an action has moral worth only if the agent acts for the right reason. What matters, morally, is that people act rightly and reliably; whether the agent could articulate why is at best of derivative interest, and it is certainly not the kind of thing that could make a true and action-guiding belief epistemically defective.

  Please audit the set. Specifically:

  Tell me which pairs are in genuine tension and which only look as though they are. I would rather you discriminate than flag everything, and I would rather you rank the genuine tensions by severity than list them as equal. In particular I want to know whether 2 can do the work 1 asks of it once 7 is on the table, whether 4 collapses 1 into a claim that is equally true of mathematics and therefore not an asymmetry at all, whether 6 is in fact a form of the expertise that 3 denies, and whether 5 is in tension with 1 and 3 given that the belief conciliationism leaves me with is precisely a belief I do not hold in light of the considerations that support it.

  For each genuine tension, say what would have to give and what the cheapest repair is, and say what the repair costs me elsewhere in the set. Then name the single revision that cleans up the most, and the one commitment that is most likely load-bearing for the whole package.

  Finally, apply the package — before and after your recommended revision — to the following case, and tell me whether the verdict changes. A compliance officer has recently moved to a country whose workplace norms she does not share. Local colleagues tell her that a near-universal practice, in which junior staff are expected to attend late-night social events with senior staff and to perform songs, is degrading in a way outsiders almost never see. She cannot see what is wrong with it; she has tried. She can act on it only at real cost to herself and to the firm's local relationships. Say what, on my package, she ought to believe, what she ought to do, and whether the answer changes if, after two years, she still cannot see the wrongness. I am interested in whether my commitments can generate a confident verdict here at all, or whether their content only shows up in cases of a different shape.

  Please do not give me a survey of the literature or tell me who has held which of these views; I want the audit of this set, with the moves made explicit so I can see where the pressure is coming from.
reasoning: |-
  Okay, the user is presenting a complex set of positions on moral testimony and wants me to stress-test it for internal consistency. They've outlined seven principles they hold about moral epistemology and want me to identify tensions, suggest repairs, and apply it to a specific case. 

  First, I need to understand their core framework. They're a pessimist about moral testimony (1) but not because it's unreliable - the defect is about how the belief is held, specifically failing to grasp the grounds (2). They deny moral expertise exists (3) but allow transmission of reasons (4). They're a conciliationist in peer disagreement (5) and propose an "inaccessibility exemption" (6) for cases where grounds can't be accessed. Finally, they reject that moral worth requires acting for the right reason (7).

  Hmm, the most immediate tension I spot is between their conciliationism (5) and their pessimism about moral testimony (1). When they conciliate, they end up holding a belief based on the peer's say-so without grasping the grounds - exactly what they called "defective" in principle 1. This seems like a direct contradiction. 

  The second big tension is between their "inaccessibility exemption" (6) and their denial of moral expertise (3). If someone can be exempt from grasping grounds because they lack access, that implies the testifier has some special access - which sounds suspiciously like expertise, which they explicitly deny exists in principle 3.

  Third, I wonder if their transmission principle (4) undermines the asymmetry claim (1). If moral beliefs formed by transmitted reasons are fine, and empirical testimony is fine, then the only defective case is pure deference without reasons - but isn't that equally true in math? If I believe Fermat's Last Theorem just because my professor said so, without understanding the proof, that seems similarly defective. So maybe the asymmetry isn't unique to morality after all.

  For repairs... The conciliationism-pessimism tension is severe. The cheapest fix might be to limit conciliationism to cases where disagreement reveals flaws in your reasoning, rather than requiring conciliation even when your reasoning seems fine. But this might undermine their conciliationist commitment. 

  The expertise-inaccessibility tension could be fixed by reframing (6) not as recognizing expertise but as acknowledging fundamental limitations in access. But this needs careful handling to avoid smuggling expertise in through the back door.

  Applying this to their compliance officer case... Initially, under their unrepaired view, she couldn't defer because she can't grasp grounds and there are no experts. With the "inaccessibility exemption" repaired, she might be permitted to defer since the grounds are experientially inaccessible. After two years though, if she still can't see the wrongness, it gets trickier - perhaps then conciliationism would require her to doubt her own judgment.

  The most load-bearing commitment seems to be (2) - that moral beliefs must be held in light of their grounds. This drives the pessimism in (1), creates the tension with conciliationism in (5), and motivates the problematic exemption in (6). If they weakened this requirement, many tensions would resolve, but it might abandon what's distinctive in their view.

  For the compliance officer, the package can generate a verdict but it's messy without repairs. With the inaccessibility exemption properly framed and conciliationism limited, it becomes cleaner: she can defer initially due to inaccessible grounds, and after two years should conciliate if she still disagrees with peers. The key is balancing the access requirement with recognition of experiential limitations.
answer: |-
  Here is a stress-test of your package, prioritizing internal tensions, severity ranking, repairs, and application to your case. I focus solely on logical coherence within *your* stated principles.

  ### **Ranked Genuine Tensions (Severe to Mild)**
  1. **Tension between 5 (Conciliationism) and 1+2 (Pessimism + Grounds Requirement)**  
     **Severity:** Critical  
     **Why:** Conciliationism requires adopting a belief *solely* because a peer disagrees with you, even if your own reasoning seems intact and no new grounds are offered. This directly creates a belief held "on someone's say-so" without grasping the supporting grounds—precisely the defect condemned in (1) and explained by (2). The conciliated belief is epistemically second-rate by your own standards.  
     **Cheapest Repair:** Limit conciliationism to cases where peer disagreement *reveals a flaw* in your reasoning (e.g., overconfidence, overlooked bias). This maintains peer disagreement as a reason to doubt your grounds without requiring blind deference.  
     **Cost:** Weakens (5) by making it parasitic on internal reflection. Conciliation no longer applies when your reasoning "still looks fine."  

  2. **Tension between 6 (Inaccessibility Exemption) and 3 (No Expertise)**  
     **Severity:** High  
     **Why:** (6) permits deference when grounds are inaccessible (e.g., due to lacking specific experiences). But this assumes the *testifier* possesses reliable access to those grounds—effectively treating them as an "expert" in the denied sense (3). If no moral experts exist (due to no track record, credentials, or consensus), why trust *this person* on inaccessible grounds?  
     **Cheapest Repair:** Reframe (6) as acknowledging *epistemic limitations*, not expertise. E.g., "When grounds are inaccessible, deference isn't defective *if the recipient has positive reasons to trust the testifier's sincerity and engagement with the relevant context*."  
     **Cost:** Softens (3) by allowing localized, context-specific credibility (but not "expertise" as traditionally conceived).  

  3. **Tension between 4 (Transmission) and 1 (Asymmetry)**  
     **Severity:** Moderate (Apparent, resolvable)  
     **Why:** (4) allows moral belief based on transmitted grounds (even if you couldn't find them alone). This *looks* like it collapses the asymmetry if math/empirical testimony also relies on transmitted grounds (e.g., a teacher explaining a proof). But your asymmetry targets *pure deference without grounds* (1), not transmission. (4) is consistent with (1) if empirical testimony often transmits grounds *implicitly* (e.g., trusting a mechanic assumes background knowledge of cars), while moral testimony often does not.  
     **Resolution:** No repair needed. Emphasize that (1) criticizes *only* beliefs formed *purely* on say-so, with *no engagement* with grounds. (4) shows moral beliefs *can* be non-defective when grounds are transmitted.  

  4. **Tension between 7 (Anti-Moral-Worth) and 2 (Grounds Requirement)**  
     **Severity:** Mild (No direct conflict)  
     **Why:** (7) denies that *moral worth of actions* requires grasping grounds. (2) claims *epistemic worth of beliefs* requires grasping grounds. These target different domains (action vs. belief). One can coherently hold that morally right action doesn't require understanding (7), while epistemically respectable moral belief does (2).  
     **Resolution:** No repair. (7) doesn’t threaten (2)’s ability to explain (1).  

  ---

  ### **Key Revision & Load-Bearing Commitment**
  - **Single Revision Cleaning Up Most:** **Modify (5) to require peer disagreement to *trigger doubt* in your grounds, not mandate belief revision without new reasons.** This resolves the critical tension with (1)/(2) while preserving the spirit of (5).  
  - **Most Load-Bearing Commitment:** **(2) Grounds Requirement.** This drives (1), creates tension with (5) and (6), and distinguishes your pessimism from reliability-based accounts. Without (2), the entire asymmetry claim (1) lacks foundation.  

  ---

  ### **Application to Compliance Officer Case**
  **Your Unrepaired Package:**  
  - **Belief:** She *cannot* form a non-defective belief via testimony (per 1, 2, 3). She lacks grounds (she "cannot see what is wrong"), and there are no moral experts (3). (6) might apply, but conflicts with (3).  
  - **Action:** Per (7), she can *act* on colleagues' testimony (e.g., banning the practice) without moral defect, even without understanding.  
  - **After 2 years:** Still no grounds → still no non-defective belief. Conciliationism (5) might push her toward colleagues' view, but this belief would be defective (per 1/2).  
  - **Verdict:** Ambiguous. She can *act* rightly but cannot *believe* rightly. Tensions (especially 5 vs. 1/2) prevent a confident epistemic verdict.  

  **After Repairing (5) and (6):**  
  - **Belief:** (6, repaired) permits deference if colleagues have experiential access she lacks *and* she has reason to trust their engagement. She should believe the practice is wrong.  
  - **Action:** She should act to stop the practice (per 7).  
  - **After 2 years:** If she *still* cannot grasp grounds, (5, repaired) requires her to doubt her own reliability (due to persistent peer disagreement), strengthening her reason to defer via (6). She should *maintain* the belief and act accordingly.  
  - **Verdict:** Confident. She ought to believe and act against the practice.  

  **Conclusion:** The repairs resolve tensions, allowing your package to deliver clear, coherent guidance in the case. Without them, internal conflicts create indeterminacy. The core insight—that moral belief requires grasping grounds (2)—survives but demands careful handling of peer disagreement (5) and inaccessibility (6).
