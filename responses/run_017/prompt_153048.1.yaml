prompt: |-
  Hi — I'm chief of staff (and by default the office ethics person, because nobody else will take it) in a mid-size city mayor's office, and I need something I can actually run, not something to think about.

  The situation: two or three times a week something hits my desk where the options are (i) do something the mayor and I both think is morally wrong, or (ii) let something bad happen that the city exists to prevent. Sometimes the wrong thing is legally shaky, sometimes it's completely legal and that's the problem. Legal review is a separate step and we have corp counsel for it, so please don't spend the procedure on "is it lawful" — I need whatever comes after the lawyers say yes or shrug.

  I've read a bit of the philosophy on this (dirty hands) and it's maddening in practice: lots about tragedy, moral residue, guilt, and whether the politician who does these things is the one we should want in office — and almost nothing about how to tell whether you're actually in a dirty-hands case or just telling yourself you are so you can sleep at night. I think that distinction is doing all the work, so build the procedure around it. Here are the things I keep wanting to test and can't quite operationalise:

  - Is the wrong load-bearing? Does the action still produce the good outcome if you take the wrong-making feature out of it, maybe at some cost in speed or money? If the wrong bit is just the cheapest or fastest route to a result you could get otherwise, then as far as I'm concerned it isn't dirty hands, it's a bad trade with nicer packaging. (I invented "load-bearing wrong" as a label — use it if it helps, swap it for something better if you have one.)
  - Does the wrong survive delegation? Half the time the act happens three layers down and nobody quite ordered it, or the mayor "doesn't want to know the details." My instinct is that you can't launder it by pushing it down the chain, and that the dirt actually attaches to whoever set up the situation where someone lower down had to do it. I want that as a step, not a vibe.
  - Are we really just in lesser-evil territory? Plenty of what comes through here isn't "wrong but necessary," it's "imposes real costs on people and nobody's rights are violated." I want the procedure to say so quickly and let us move on, instead of us agonising over everything.
  - The acknowledgement condition. My sense from what I've read is that any permission here is tied to the agent being willing to own the act in public afterwards and take whatever comes — being judged, being punished, resigning, carrying the guilt rather than treating it as washed away. But most of the options that reach my desk only work if nobody finds out. That seems to mean most of them can't qualify at all, and I want the procedure to say that in so many words rather than leaving it to my judgement every single time.
  - Frequency. This is roughly the fourth emergency procurement / back-channel deal / shortcut this year and I've noticed we've stopped noticing. Is there a version of this test that catches habituation — the slide into "well, we did it last time"? If it can be proceduralised, put it in. If it genuinely can't, say that instead of faking a step.

  What I want back:

  1. A decision procedure I can run in about 45 minutes on a real proposal: an ordered set of questions, what counts as a sufficient answer to each, what counts as a non-answer (i.e. the kind of thing my office writes that sounds like an answer and isn't), hard stops where the answer is no, and explicit hand-off points where the question is a values call the mayor has to make rather than me. Mark clearly which steps are real tests and which are judgement calls dressed up as procedure — I'd rather know than be reassured.
  2. Who signs off at each stage, given that I have about an hour, the mayor has ten minutes, and anything touching council has to survive a hostile oversight hearing six months later where someone reads our emails out loud.
  3. Run it on three cases, showing the actual path through the steps:
   (a) A fast-moving wildfire. The fire chief wants standing authority to demolish two unoccupied houses without the notice our ordinance requires, to cut a firebreak that will probably save a block. Legally dubious, time pressure is real.
   (b) A housing deal. In exchange for a much larger affordable-housing set-aside than we could get any other way, we steer a seperate no-bid garage contract to the same developer and let the public believe the garage went to them on merit. Nobody's rights are violated exactly, but a process we're supposed to be guarding is being rigged on purpose, and elected colleagues are being lied to by omission.
   (c) An undercover policing operation that requires the officer to participate in a crime to hold cover, which will genuinely prevent serious harm to identifiable people, and which cannot work unless the city can deny any knowledge of it afterwards. This is the one where I think the procedure is going to hand me an answer I don't like. I'd much rather see it come out that way in writing than have you smooth the edges because the stakes in the case feel high.
  4. A short, honest closing section on where this thing will misfire: what it will wrongly clear, what it will wrongly block, and the kinds of case where it's basically a rubber stamp for whatever we already wanted to do.

  Two more constraints. Don't give me a reading list, citations, or a summary of who argued what — I can't chase references and it wouldn't help me decide by 3pm. And design it for someone who is tired, recieves most of these proposals from people more senior than them, wants to keep their job, and will therefore rationalise hard: if there's a way to build an anti-rationalisation check into the ordering of the questions (or into who has to answer them), do that.
reasoning: |-
  Okay, let me start by understanding what the user needs. They're the chief of staff in a mayor's office, dealing with ethical dilemmas multiple times a week. They need a practical decision procedure, not theoretical discussions. The key issues they raised include load-bearing wrongs, delegation, distinguishing lesser-evil scenarios, public acknowledgement, and habituation.

  First, I need to address the core components they mentioned. The "load-bearing wrong" concept is crucial here. They want to ensure that the unethical aspect is necessary, not just convenient. So the procedure must test if removing the wrong element would still achieve the good outcome. 

  Next is delegation. They mentioned that wrongs can't be laundered through the chain of command. The procedure should attribute responsibility to those who set up the situation, not just the executors. That means including steps where accountability is clearly assigned, regardless of who performs the action.

  Then, distinguishing between dirty hands and lesser-evil scenarios. Lesser-evil involves trade-offs without inherent wrongs, while dirty hands require morally wrong acts. The procedure needs a clear step to filter these out early, so they don't waste time on non-dirty hands cases.

  The acknowledgement condition is another critical point. If the act can't be publicly owned, it shouldn't qualify. This might block many options, but the user wants honesty here. Including a step that mandates future disclosure as a condition could address this.

  Frequency and habituation are tricky. They need a way to track how often such decisions are made. A log with forced pauses for recurring issues might help prevent normalization. Also, requiring different approvers for similar cases could reduce complacency.

  Now, considering the decision procedure structure. It should be step-by-step, with clear yes/no paths, hard stops, and hand-offs. Time is a constraint, so each step must be efficient. Including anti-rationalization measures like mandatory consultation with dissenters or pre-mortems could help counter self-justification.

  For the case examples:
  - Wildfire: The demolition is necessary and load-bearing. Time pressure is real, but post-facto disclosure is possible. It passes but requires mayoral sign-off.
  - Housing deal: The rigged process isn't load-bearing; other methods exist. It fails early as not necessary.
  - Undercover operation: The crime participation is necessary, but inability to acknowledge is a hard stop. Fails at Step 3.

  The closing section should highlight where the procedure might misfire. For instance, it could wrongly clear cases with subtle wrongs or block necessary actions due to disclosure issues. Also, habituation might still occur if logs aren't reviewed.

  Sign-off responsibilities: Staff analysts handle initial checks, legal does Step 2, the user manages Steps 3-5, mayor approves. This distributes workload and ensures accountability.

  Anti-rationalization tactics: Reversing roles, forced dissent, and pre-mortems make justifications harder. Ordering steps to address necessity before disclosure prevents hiding behind urgency.

  Finally, ensuring the procedure is practical for a tired, time-pressed person. Steps are ordered to eliminate non-issues early. Hard stops prevent proceeding if conditions aren't met. Clear hand-offs to the mayor for value judgments keep the user from overstepping.
answer: |-
  Here’s a **Dirty Hands Decision Protocol (DHDP)** designed for speed, anti-rationalization, and hard stops. It runs in 45 minutes max, with clear ownership at each step. **Bold** = critical tests.

  ---

  ### **DHDP: Step-by-Step Procedure**
  *(Run sequentially — stop if any step fails)*

  1.  **"LESSER EVIL" FILTER (5 mins | Analyst/Staff)**  
      *Question: Does this involve committing a moral wrong (e.g., deception, rights violation, betrayal of trust) OR is it just a painful trade-off with no inherent wrong?*  
      - **Sufficient Answer (Lesser Evil):** "No moral wrong, just high costs/benefits (e.g., cutting parks budget to fund shelters)." → **STOP. Not Dirty Hands.** Proceed with normal cost/benefit analysis.  
      - **Sufficient Answer (Dirty Hands):** "Yes, core action involves deception/rights violation/process betrayal." → Proceed to Step 2.  
      - **Non-Answer:** "It's complicated," "Some might see it that way," "The ends justify..." → **HARD STOP. Reject.** Ambiguity here masks rationalization.  
      - *Sign-off:* Staff Analyst (you delegate). *Anti-Rationalization:* Requires concrete description of *the act itself*, not just outcomes.

  2.  **"LOAD-BEARING WRONG" TEST (10 mins | Legal + Policy Lead)**  
      *Question: If we remove the morally wrong element, does the good outcome become impossible/unattainable? (Not just harder, slower, or costlier).*  
      - **Sufficient Answer (Load-Bearing):** "Yes. Without [specific wrong], [specific good] fails. Proven alternatives exhausted." → Proceed to Step 3.  
      - **Sufficient Answer (NOT Load-Bearing):** "No. We could achieve [good] via [legal/ethical path] with more time/money/effort." → **HARD STOP. Reject.** This is convenience, not necessity.  
      - **Non-Answer:** "Alternatives are impractical," "We don’t have time," "It’s the only way *we* see." → **HARD STOP. Reject.** Must identify *specific* alternatives and *why* they fail.  
      - *Sign-off:* Legal Counsel (confirms impossibility) + Policy Lead (confirms alternatives exhausted). *Anti-Rationalization:* Require written alternatives list.

  3.  **ACKNOWLEDGEMENT CONDITION (10 mins | Chief of Staff)**  
      *Question: Can the Mayor publicly acknowledge the *full* truth of this action *when reasonably safe* (not necessarily immediately) and accept consequences (scrutiny, sanctions, resignation)?*  
      - **Sufficient Answer (Yes):** "Yes, Mayor will own it when feasible. Documentation prepared for eventual release." → Proceed to Step 4.  
      - **Sufficient Answer (No):** "No, success *requires* permanent secrecy/deniability." → **HARD STOP. Reject.** Unacknowledgeable acts are disqualified.  
      - **Non-Answer:** "We'll handle the fallout later," "It might never come out," "We can spin it." → **HARD STOP. Reject.**  
      - *Sign-off:* Chief of Staff (You). *Anti-Rationalization:* You must *verbally confirm* w/Mayor: "Can you own this publicly later?" If Mayor hesitates → **HARD STOP.**

  4.  **DELEGATION & ACCOUNTABILITY (5 mins | Chief of Staff)**  
      *Question: Is the Mayor/Head of Office the *direct* decision-maker, or is the wrong being pushed down?*  
      - **Sufficient Answer (Direct):** "Mayor/[Head] is ordering/approving *the specific wrong*." → Proceed to Step 5.  
      - **Sufficient Answer (Delegated):** "The wrong occurs lower down without explicit order." → **HARD STOP. Reject.** Redesign so Mayor/[Head] *explicitly* owns the directive.  
      - **Non-Answer:** "They know the score," "Implied authority." → **HARD STOP. Reject.**  
      - *Sign-off:* Chief of Staff. *Anti-Rationalization:* Trace the decision chain. Who *verbally approved the wrong*? If unclear, stop.

  5.  **HABITUATION CHECK (5 mins | Chief of Staff w/Log)**  
      *Question: Review the DHDP Log (see below). Is this the same core wrong used >1x in the past 12 months?*  
      - **Sufficient Answer (Novel):** "No prior instances OR materially different context." → Proceed to Step 6 (Mayor).  
      - **Sufficient Answer (Recurring):** "Yes, same/similar wrong used recently." → **PAUSE. Automatic 24-hour cooling-off + review by Ethics Board/Council President.**  
      - *Sign-off:* Chief of Staff. *Anti-Rationalization:* **Maintain a DHDP Log** (Date, Case, Wrong, Outcome). Mandatory review at Step 5.

  6.  **MAYORAL DECISION (10 mins | Mayor)**  
      *Question: Knowing the wrong is load-bearing, publicly ownable later, and you are directly accountable – is the preventable harm *sufficiently catastrophic* to proceed?*  
      - **Hand-off:** This is the Mayor's **values call**. Your role: Present facts from Steps 1-5 clearly.  
      - **Output:** Mayor's "Go/No-Go." If "Go," document Mayor’s directive & Step 3 commitment.  
      - *Sign-off:* Mayor. *Anti-Rationalization:* You **read Step 3 commitment aloud** to Mayor before decision.

  ---

  ### **Applied to Your Cases**
  ***(a) Wildfire Firebreak Demolition***  
  - *Step 1 (Lesser Evil):* **Dirty Hands.** Legally dubious demolition (property rights violation).  
  - *Step 2 (Load-Bearing):* **Yes.** Removing houses *is* the firebreak. No alternative path exists in time.  
  - *Step 3 (Acknowledgement):* **Yes.** Mayor can acknowledge post-fire: "I ordered it to save lives, will fix ordinance."  
  - *Step 4 (Delegation):* **Direct.** Fire Chief acts *under Mayor’s explicit emergency order*.  
  - *Step 5 (Habituation):* **Assume novel.** Proceeds.  
  - *Step 6 (Mayor):* Approves based on catastrophic harm (lives/livelihoods).  
  - **OUTCOME: PROCEED.** Document Mayor’s order & Step 3 commitment.

  ***(b) Housing Deal / Rigged Garage Contract***  
  - *Step 1 (Lesser Evil):* **Dirty Hands.** Rigged process (betrayal of public trust, deception of council).  
  - *Step 2 (Load-Bearing):* **NO.** Affordable housing *could* be achieved via other means (higher taxes, eminent domain, longer negotiation). The rigged contract is a *bargaining chip*, not necessity.  
  - **OUTCOME: HARD STOP at Step 2.** Reject. Not dirty hands, just a corrupt bargain.

  ***(c) Undercover Cop Committing Crime***  
  - *Step 1 (Lesser Evil):* **Dirty Hands.** Officer commits crime (moral/legal wrong).  
  - *Step 2 (Load-Bearing):* **Yes.** Participation is essential for cover/preventing harm.  
  - *Step 3 (Acknowledgement):* **NO.** City *must* deny knowledge permanently for safety/operation.  
  - **OUTCOME: HARD STOP at Step 3.** Reject. Fails the acknowledgement condition.  
  - **Alternatives:** Seek state/federal jurisdiction with immunity, redesign operation.

  ---

  ### **Where This Will Misfire (Closing Notes)**  
  - **Will Wrongly CLEAR:**  
    - Cases where "load-bearing" is overestimated due to groupthink.  
    - "Public acknowledgement" becomes performative (Mayor says "I'll own it" insincerely).  
  - **Will Wrongly BLOCK:**  
    - Genuine existential threats where permanent secrecy *is* unavoidable (e.g., national security-level ops).  
    - Fast-moving crises where 45-min DHDP is too slow (mitigation: **Pre-approve limited templates** via DHDP *before* crisis).  
  - **Rubber Stamp Risk:**  
    - If Mayor/you *want* to act, Steps 2 & 3 become vulnerable to pressure ("find" no alternatives, vague promises of ownership). **Mitigation:** Require dissenting views in Steps 1-2 documentation.  
  - **Habituation Blindspot:**  
    - Logging depends on rigor. Different wrongs can normalize (e.g., "emergency" declarations). **Mitigation:** Quarterly independent log audit.  

  **Key Safeguard:** The protocol’s power is in **hard stops & forced documentation**. It doesn’t make dirty hands clean – it forces you to confront *if* they’re truly necessary and *who* will bear the cost. Run it ruthlessly.
