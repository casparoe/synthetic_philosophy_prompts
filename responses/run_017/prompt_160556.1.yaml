  ## The Accounting

  The crumpled note in Maya’s pocket felt like a stone. *Sorry. Got confused.* Priya hadn’t even looked at her when she slipped it over during Physics. Three weeks since Priya told the entire History group chat Maya had skipped their presentation prep, leaving them scrambling. Maya hadn’t skipped. She’d been *sick*, puking her guts out, texts ignored. The betrayal still burned, a low thrum beneath her ribs.

  Now they sat in Counselor Evans’s sterile office, fluorescent lights humming. The air smelled faintly of lemon cleaner and old paper. Evans, with practiced calm, slid identical grey folders across the desk.

  “The Accounting,” she stated. “Procedure mandates both parties receive the dossier. Read thoroughly. When ready, we proceed.”

  Maya opened hers. Priya’s life spilled out in clinical detail: her father’s sudden layoff last month, the mounting arguments echoing through thin walls. The sleep tracker data – red lines showing barely three hours a night for weeks. The new ADHD meds, the dosage adjustment noted *‘patient reported increased anxiety, racing thoughts.’* The screenshot of Priya’s frantic, unanswered texts to Maya the *night before* the presentation, buried under a deluge of group chat panic: *‘Maya isn’t answering, she’s bailed, what do we do?!’* A note from her worried mother: *‘Obsessively checking phone, overwhelmed.’*

  Maya read it all. The thrumming anger… shifted. It didn’t vanish, but it frayed, replaced by a cold, heavy understanding. *Of course.* Exhausted, terrified of failing, drowning in chaos at home, Priya had grasped the simplest narrative: Maya flaked. The resentment didn’t dissolve; it dulled, layered over by something closer to pity. An image formed: not a traitor, but a frayed wire sparking under too much load. She looked up. Evans watched neutrally.

  Priya’s face was ashen. She stared at her own dossier, fingers trembling near the edge of the page detailing her father’s face when the termination notice came. She flinched reading the transcript of her own panicked accusation in the chat. A tear splashed onto the clinical bullet point about her medication side effects: *‘potential for impulsivity, distorted perception under stress.’* Her breath hitched. When she finally met Maya’s eyes, it wasn’t guilt Maya saw first. It was a raw, horrified *recognition* – seeing the messy, pathetic machinery of her own actions laid bare. The guilt was there, sharp and deep, but it was tangled in a thicker, more suffocating wave of self-revulsion.

  “Procedure complete,” Evans said. “You may leave when ready.”

  Maya stood first. The anger was a cooled ember now, manageable. She felt… objective. Like assessing a malfunctioning device. As she turned to go, Priya’s pencil rolled off the desk. Without thinking, Maya bent, picked it up, and placed it back precisely on the edge. A detached, practical act.

  Priya flinched again at the movement. She stared at the returned pencil, then down at her own hands, still resting on the damning pages of her life. She didn’t say thank you. She didn’t say anything. Her shoulders hunched, folding inwards as if the weight of the explanation pressed down harder than the original shame. Maya walked out into the hallway, the sterile air feeling lighter. Behind her, the office door remained open, framing Priya, small and still, staring at the grey folder that explained everything and changed nothing about the hollow ache inside her own chest.

  ---
