  **Elements Used:**
  *   **Specific Incident:** Priya falsely accuses Maya of bailing on group work prep.
  *   **Concrete Details:** Crumpled apology note, sterile office/lemon cleaner, sleep tracker data, ADHD meds note, screenshot of panicked chat message, dropped pencil.
  *   **Dialogue:** Minimal, functional (Counselor's lines, Priya's note).
  *   **Asymmetry Shown, Not Told:** 
      *   *Maya:* Resentment cools into detached understanding/pity (objective attitude). Action: Mechanically returning the pencil.
      *   *Priya:* Guilt is compounded by self-revulsion at seeing her own causal mess. Inaction: Hunched, silent, staring.
  *   **No Speeches/No Moral:** The final image *shows* the lingering, different weights they carry. Strawson's concepts are embedded in the contrasting reactions.
  *   **Under 600 Words:** Achieved.
