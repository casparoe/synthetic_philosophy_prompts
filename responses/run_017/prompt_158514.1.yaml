prompt: |-
  I'm a high-school junior and the student member of my district's Program Evaluation Committee, and I need to circulate a decision memo before our December meeting. We have one $140,000 allocation left and two finalists. Option A is a mentoring and college-advising program for about 25 seniors likely to be the first in their families to apply; the district's two-year pilot of it was evaluated at roughly one additional year of postsecondary enrollment per participant. Option B is a study-skills app with weekly text nudges for about 1,900 students in grades 9 through 11, with an average effect the district statistician puts at 0.6 additional homework points per term per student — small for any one student, but she says it is distinguishable from zero and it holds across every subgroup she checked.

  To compare them, our consultant converts outcomes into a single unit, outcome points, in which a year of enrollment is worth 100 points and a homework point is worth 5. On that arithmetic A scores about 2,500 and B about 5,700, and B wins easily. But our equity policy also says we should not adopt a program whose gains are too small to matter to the individual student receiving them, which is exactly how every member describes B, and no one has been able to say how the two rules are supposed to be weighed when they conflict. Two further complications have come up: the 25 seniors in A are not among the 1,900 students in B, so choosing B means the seniors get nothing and choosing A means 1,900 students — including many who currently receive nothing from any district program — get nothing; and one member has proposed a third route, funding a smaller cohort of about 400 in B's format at a higher dose, treating how many are helped and how much each is helped as things to trade off rather than to maximize.

  Please draft the committee's decision memo, roughly 700 words and addressed to the committee: it should recommend approving A, approving B, or approving one of them with conditions; it should say plainly what we should do about the conflict between our own two rules; and it should put the best case for the option it rejects in its strongest form rather than dismissing it. Include what we would need to measure, and by when, in order to revisit the decision at our March meeting, and note anything the committee should decide about the outcome-points conversion itself. Write the memo as the document itself, with no preamble and no restatement of what I have asked for, and open with the recommendation in the first sentence; argue from the structure of the problem, without citing any published work.
reasoning: |-
  Okay, the user is a high-school junior serving on the district's Program Evaluation Committee. They need to draft a decision memo about allocating $140,000 between two programs: Option A (mentoring for 25 first-gen seniors) and Option B (study-skills app for 1,900 students). The consultant's analysis using "outcome points" favors Option B, but the committee's equity policy prohibits programs with gains "too small to matter" per student—which describes B. There are also complications about excluded student groups and a third proposal for a smaller B cohort.

  Hmm, the core tension here is between scale (B's broader reach) and transformative impact (A's life-changing effect per student). The equity policy conflict is fascinating—it essentially pits utilitarian aggregation against individual dignity. The user needs this resolved structurally, not just procedurally. 

  The memo must open with a recommendation, so I consider all angles. Option A aligns with equity policy by delivering meaningful change to underserved students, but leaves 1,900 others without support. Option B maximizes total points but violates the "too small to matter" clause. The third option (smaller B cohort) attempts compromise but may lose both programs' core advantages. 

  I lean toward Option A because: 
  - First-gen seniors face systemic barriers where mentoring creates disproportionate lifetime value (the "one additional year of enrollment" is huge) 
  - The homework-point gain in B (0.6/term) feels symbolic—likely unnoticed by students 
  - Equity should prioritize depth when breadth achieves trivial gains 

  But I'll strengthen B's case: 1,900 students (many underserved) getting *something* is better than 25 getting a lot when resources are finite. The statistician confirms B's effect is real—small nudges can compound. 

  For March reevaluation, I propose measuring: 
  - For A: Actual college applications/enrollment from the cohort 
  - For B: Student surveys on whether they noticed/appreciated the gains 
  - Also tracking if the "nothing" groups (seniors or 1,900) backslid without support 

  The outcome-point conversion needs scrutiny: equating 5 homework points to 1 college year feels arbitrary. The committee should vote to adjust weights before next cycle. 

  Final memo structure: 
  1. Immediate recommendation for A 
  2. Acknowledgment that B's scale is mathematically compelling 
  3. Resolution: Equity policy overrides aggregation when gains are trivial per individual 
  4. Third option rejected for splitting the difference poorly 
  5. Clear March metrics 
  6. Call to review point weights 

  This respects the user's role—they're a student navigating complex institutional rules while advocating for peers. The tone stays professional but accessible, avoiding jargon.
answer: |-
  **MEMORANDUM**  
  To: Program Evaluation Committee  
  From: Student Member  
  Date: November 30, 2023  
  Subject: Recommendation for Final $140,000 Allocation  

  **Recommendation:** Approve Option A (Mentoring & College-Advising Program) for the full $140,000 allocation, with a commitment to design a targeted pilot in Q1 2024 to test Option B’s viability at a higher "dose" for a subgroup, and to revisit outcomes at the March meeting.  

  ### I. Summary of the Conflict  
  The committee faces a tension between two valid principles:  
  1.  **Maximizing Total Impact:** The consultant’s outcome-points framework (1 year postsecondary enrollment = 100 points; 1 homework point = 5 points) quantifies Option B’s broader reach (5,700 points) as significantly greater than Option A’s deeper impact (2,500 points).  
  2.  **Ensuring Meaningful Individual Gains:** Our equity policy explicitly rules out programs where gains are "too small to matter" to individual students. The committee unanimously views Option B’s gain (0.6 homework points/term/student) as failing this threshold, despite its statistical significance and scalability.  

  Neither principle is inherently superior; the conflict arises from differing definitions of "impact." Option A prioritizes transformative change for a few high-need students. Option B prioritizes marginal but widespread gains.  

  ### II. The Case for Option B (Rejected)  
  Option B’s strength lies in its scalability and efficiency. Serving 1,900 students—many currently receiving no district support—with a low-cost app demonstrates a commitment to broad equity. The statistically significant effect (0.6 homework points/student/term) holds across all subgroups, proving it works reliably at scale. While small per student, these gains could compound over time or signal engagement in at-risk populations. Choosing Option B avoids the "all-or-nothing" outcome for 1,900 students and leverages technology for sustainable impact. Rejecting it risks overlooking the potential of low-intensity, high-reach interventions to uplift entire cohorts.  

  ### III. The Case for Option A (Recommended)  
  Option A delivers an unequivocally life-altering outcome: one additional year of postsecondary enrollment per participant. For first-generation college applicants, this represents not just academic progress, but socio-economic mobility and breaking generational cycles. Our equity policy’s intent—ensuring programs make a *meaningful difference* to participants—directly aligns with this outcome. While serving only 25 students, each gains substantially more than any single student under Option B. Critically, *these 25 students are excluded from Option B’s reach*, making Option A their only pathway to support. The proven success of the pilot (demonstrating 2,500 outcome points) validates its efficacy.  

  ### IV. Resolving the Rule Conflict  
  When rules conflict, we must prioritize the policy’s *intent*. The equity clause ("gains too small to matter") is a safeguard against trivial interventions, even if scalable. Option B’s gains, while statistically real, do not meet this ethical threshold. **Therefore, the equity policy must override the outcome-points total when individual gains are deemed insignificant.** Outcome points remain valuable for comparing programs with *similarly meaningful* individual impacts but shouldn’t justify negligible effects.  

  ### V. Addressing the Third Proposal  
  The proposal for a "higher-dose" Option B for 400 students is a thoughtful compromise but is not recommended for three reasons:  
  1.  **Untested Model:** Option B’s effect size (0.6 points) is tied to its current design/dose. There’s no evidence that increasing "dose" would yield proportionally larger gains.  
  2.  **Diluted Impact:** It sacrifices Option A’s proven transformative impact without guaranteeing Option B’s breadth or meaningful individual gains.  
  3.  **Operational Delay:** Designing a new variant would delay deployment beyond this funding cycle.  

  Instead, we approve Option A *while committing* to design a rigorous pilot in Q1 2024 testing Option B at an enhanced dose (e.g., added mentorship tiers) for 50–100 students, reporting preliminary findings in March.  

  ### VI. Metrics for March Reassessment  
  To evaluate this decision by March, we will measure:  
  1.  **For Option A:**  
      -   College application submission rate (%) for the 25 seniors (by Feb 1).  
      -   FAFSA completion rate (%) (by Feb 1).  
      -   Postsecondary enrollment intent surveys (March).  
  2.  **For Option B’s Future:**  
      -   Finalized design & recruitment plan for the high-dose pilot.  
      -   Baseline data on target participants’ homework scores & engagement.  
  3.  **For Excluded Students:**  
      -   Track aggregate homework/engagement metrics for the 1,900 students not served (compared to historical trends).  

  ### VII. Action Required on Outcome Points  
  The committee must clarify the outcome-points framework’s role *before the next allocation cycle*. Specifically:  
  1.  **Define Minimum Meaningful Gain:** Establish a threshold (e.g., "gain must equate to ≥ X outcome points per student") to screen proposals.  
  2.  **Review Weightings:** Debate if 1 year of college enrollment (100 pts) is appropriately weighted versus 1 homework point (5 pts). Is 20 homework points truly equivalent to a year of college?  
  3.  **Formalize Equity Override:** Codify that programs failing the "meaningful gain" test are ineligible, regardless of total points.  

  ### Conclusion  
  Approving Option A honors our commitment to transformative equity for highest-need students while acknowledging Option B’s appeal of scale. We resolve the rule conflict by upholding the core intent of our equity policy: rejecting gains too small to change a student’s experience. By simultaneously launching a targeted pilot for Option B, we ensure this decision is not the final word on scalable interventions. We will reassess progress with concrete data in March.
