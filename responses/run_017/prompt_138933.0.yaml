  Here are five distinct theses disambiguating "it's the thought that counts", ordered from most trivial to most radical, with your constraints applied:

  1.  **Motivation determines the agent's praiseworthiness/character assessment, not the action's impact.** (Platitude)  
      *Counts for:* Assessing the *agent* (praiseworthiness/admirability).  
      *Verdict on Cases:* Case A (only warm-glow): Agent less praiseworthy. Case B (mixed): Agent praiseworthy. Supports second use only.

  2.  **An action only has genuine moral worth if primarily motivated by the right reason (e.g., helping others), not merely good outcomes or feelings.** (Defensible substantive claim)  
      *Counts for:* The *action's* intrinsic moral worth.  
      *Verdict on Cases:* Case A (only warm-glow): Action lacks moral worth. Case B (mixed): Action has moral worth *if* right reason was necessary/sufficient. Supports first use partially (denies equal worth).

  3.  **The sole determinant of an action's *overall* moral value (combining worth and impact) is the agent's intention; consequences are irrelevant to moral evaluation.** (False)  
      *Counts for:* The *action's* total moral value.  
      *Verdict on Cases:* Case A & B: Action equally good/moral if intention good, regardless of impact. Supports second use strongly (dismisses lives/dollar).

  4.  **"Counting" refers to whether society should encourage/reward the *behaviour* based on typical agent motivations, not the specific consequences.** (Defensible substantive claim)  
      *Counts for:* Whether to *encourage* the behaviour.  
      *Verdict on Cases:* Case A: Encouragement debatable (reinforces warm-glow). Case B: Encouragement supported. Supports neither original use directly; shifts focus.

  5.  **"Moral worth" conflates distinct concepts (action outcome, agent quality, behaviour encouragement); the phrase obscures a verbal dispute about which concept matters most in context.** (Defensible substantive claim - Verbal Dispute Reading)  
      *Counts for:* Clarifying *what is being evaluated*. Surviving question: When handing out moral credit, are we evaluating the agent's character/virtue (supports second use), the action's intrinsic quality (supports first use partially), or promoting future good acts (supports neither directly)? Verdicts on Cases depend entirely on which concept is prioritized.
