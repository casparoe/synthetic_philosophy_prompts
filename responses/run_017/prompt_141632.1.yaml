  We are given a setup with a repeated gamble: win double the stake with probability 0.6, lose the stake with probability 0.4. We are to analyze an argument that leads to counterintuitive conclusions for one-off decisions.

  The argument steps:

  1. Claim (i) (maximizing expected wealth leads to ruin) is a reductio of expected value. The problem is that the expectation is dominated by paths of vanishing probability.

  2. Therefore, we should optimize the growth rate along the typical path (which occurs with probability approaching 1).

  3. General principle: decisions should be based on what happens on typical paths; ignore branches of vanishing probability even if they have enormous magnitude.

  4. This principle holds for single trials too: in a single trial, the "typical" is the more probable branch.

  5. Hence, for a one-off decision, maximize the median outcome (which for two branches is the modal branch).

  6. Consequences for one-off decisions:

     A. Indifferent between 40% chance of $10, 40% chance of $10B, and nothing, because the more probable branch (60% chance) is $0.

     B. Prefer a 51% chance of $1 over a 49% chance of $1M, because the modal branch (51% chance) of the first gives $1, while the modal branch (51% chance of nothing) of the second gives $0.

     C. Refuse a one-in-a-million chance at a fortune for a negligible cost, and refuse to pay a negligible cost to remove a one-in-a-million chance of losing everything.

  7. The user finds 6 unacceptable, especially C.

  8. A worry: if we apply the median rule per decision in a sequence of independent decisions, the probability that all decisions go as per their typical branch is low (for 1000 decisions each with 99.9% chance, the probability all are typical is about 37%). So the rule doesn't compose.

  9. The user wants to keep: (i) and (ii) (Kelly as optimal for repeated bets), and expected utility for one-off decisions.

  The key is to identify where the argument breaks down.

  Analysis:

  Step 1: We agree that in the repeated setting, maximizing expected wealth is bad because it leads to almost sure ruin. The Kelly criterion (maximizing expected log wealth) avoids this and has good properties in the long run.

  Step 2: In the repeated setting, the typical path (with win frequency 60%) does occur with probability approaching 1. And on this path, the realized growth rate is the geometric mean (or the average log return). So optimizing the expected log return is equivalent to optimizing the growth rate on typical paths.

  Step 3: The general principle of ignoring vanishingly small probability branches is what the Kelly criterion does. But note: in the repeated setting, the Kelly criterion does not ignore the low-probability branches. Instead, it accounts for them in the expectation of the log. The log function is concave and so naturally downweights the high-magnitude, low-probability events. So step 3 is not exactly how Kelly works. Kelly uses the entire distribution to compute the expected log.

  The argument in step 3 is saying: ignore branches with vanishing probability. But in the Kelly criterion, we don't ignore them; we take an expectation over all branches. The reason the low-probability branches don't dominate is because the log function is bounded above for losses (as wealth goes to zero, log goes to -∞) and grows slowly for gains. So the expectation of log is not dominated by the tails in the same way as the expectation of wealth.

  Step 4: The argument then extends the principle to single trials. But the principle in step 3 (ignore vanishingly small probability branches) is not what the Kelly criterion does. The Kelly criterion uses the entire distribution. Moreover, the typical set in a long sequence is a set of paths that have a certain empirical frequency (close to the true probabilities). In a single trial, there is no such typical set. The outcome is either one branch or the other.

  Step 5: The move to maximizing the median outcome in a single trial. This is a non sequitur from the previous steps. The Kelly criterion for a single bet would maximize the expected log wealth, which is equivalent to maximizing the expected utility with a log utility function. The median is a different statistic.

  In a single trial, if we use the Kelly criterion (i.e., maximize expected log wealth), then for a two-branch gamble, we would choose the fraction f that maximizes:

     E[log(return)] = p * log(1 + f*b) + (1-p) * log(1 - f)

  where b is the net odds (in this case, if you win, you get b times your stake, so for doubling, b=1). So for p=0.6, b=1, we get the well-known f = p - (1-p)/b = 0.6 - 0.4/1 = 0.2.

  But note: this is an expectation over both branches. We do not ignore the low-probability branch.

  For a one-off gamble that is not repeated, the Kelly criterion (maximizing expected log) is the same as maximizing expected utility for a log-utility agent. This is a standard approach in expected utility theory.

  Now, what about the median? The median outcome is the outcome that is exceeded with probability 0.5. For a single bet, the median outcome would be the outcome in the branch that has probability greater than 0.5. In the example of step 6A and 6B, the argument uses the modal branch (the branch with the highest probability). For two branches, if one has probability >0.5, then that branch is the modal and the median.

  But maximizing the median is not the same as maximizing expected log. For instance, in example 6B:

     Option 1: 51% chance of $1, 49% chance of $0.
     Option 2: 49% chance of $1M, 51% chance of $0.

  The median for both options is $0 (because the probability of getting $0 is 49% for option 1? Wait: for option 1, the outcomes are $1 (with 51%) and $0 (49%). The median is the value such that at least 50% of the time the outcome is at least that value. For option 1, the outcome is at least $0 100% of the time, and at least $1 51% of the time. So the median is $1? Actually, the median is usually defined as the smallest value such that at least 50% of the outcomes are at most that value? Or the 50th percentile? Let me clarify:

     For a discrete distribution with two outcomes, the median is:

        If the higher outcome has probability >= 0.5, then the median is the higher outcome.

        Otherwise, the median is the lower outcome.

  But in option 1, the higher outcome ($1) has probability 0.51 > 0.5, so the median is $1.

  In option 2, the higher outcome ($1M) has probability 0.49 < 0.5, so the median is $0.

  Therefore, the median of option 1 is $1 and of option 2 is $0. So maximizing the median would choose option 1.

  But is that the same as the argument? The argument says: in option 2, the modal branch is $0 (because 51% chance of $0). But note: the modal branch is the outcome that has the highest probability. In option 2, the outcome $0 has probability 0.51, which is higher than the probability of $1M (0.49). So the mode is $0. The argument then says: we should look at the modal branch, so option 1 gives $1 and option 2 gives $0.

  But the median and mode are not always the same. In a two-branch case they are when one branch has probability >0.5. But in general, they can differ.

  The argument in step 5 says: maximize the median outcome. But the argument in step 4 says: in a single trial, the analogue of the typical path is the more probable branch. Then step 5 says: maximize the outcome in that branch. That is, they are maximizing the outcome conditional on the modal branch (if that branch has probability >0.5). This is equivalent to maximizing the mode? But the median in the two-branch case is the mode when one branch has probability >0.5? Actually, as above, the median is the higher outcome if its probability is at least 0.5, otherwise the lower. So in the two-branch case, if the higher branch has probability >=0.5, the median is the higher outcome; if not, then the median is the lower outcome. The mode is the outcome with the highest probability. In two branches, the mode is the outcome of the branch with the higher probability. So in two branches, the mode and median are the same if the probabilities are not equal. If they are equal, then both branches are modes? And the median would be between the two? But the argument doesn't address that.

  But let's stick to the examples.

  The problem with step 5 is that it is not derived from the Kelly reasoning. The Kelly reasoning for a single bet is to use the entire distribution and maximize the expected log. The median maximization is a different rule.

  So the breakdown is in the move from step 3 to step 5. Step 3 says: ignore branches of vanishing probability. But in a single trial, there are no vanishing probabilities (unless we consider a continuum, but in the examples we have discrete branches). In step 6A, the argument ignores the 40% chance branch because it's not the more probable one. But 40% is not vanishingly small. In step 6B, 49% is not vanishingly small. In step 6C, one-in-a-million is vanishingly small, but the argument also says to ignore it.

  However, the principle in step 3 was motivated by the repeated setting where the probability of the entire set of paths that are not typical vanishes. In a single trial, the probability of a branch is fixed and may be substantial (like 40% or 49%). The argument in step 4 equates "typical" in a single trial to the branch with the highest probability (even if it's only 51%). This is a stretch.

  Moreover, the Kelly criterion does not ignore the 40% branch. It uses it. The log utility function gives a weight to both branches.

  Therefore, the flaw is in step 4: the extension of the principle from the repeated setting to the single trial. In the repeated setting, the typical set has probability approaching 1, and we are justified in focusing on that set because the long-run growth rate is determined by the typical set. But in a single trial, there is no long run, and we don't have a typical set with probability near 1. We have two branches, each with non-negligible probability. The principle of ignoring branches of vanishing probability does not apply to a 40% branch.

  Even for a very small probability, the expected utility approach (with a concave utility function) does not ignore the branch. It just downweights the outcome by the probability and by the utility. For a log utility agent, a one-in-a-million chance of a huge gain might be worth a small cost because the expected utility increases.

  So the move from step 3 to step 5 fails because:

     (a) Step 3 is about ignoring branches of *vanishingly small* probability (in the sense that their probability goes to zero as the number of trials goes to infinity). But in a single trial, we don't have such vanishing probabilities unless the gamble itself has a branch with extremely low probability.

     (b) Even when a branch has very low probability, the expected utility approach does not ignore it, but gives it a weight proportional to its probability.

     (c) The median maximization rule is not equivalent to the Kelly rule. The Kelly rule (for one-off bets) is equivalent to expected utility maximization with log utility, which is a standard normative approach.

  Therefore, we reject the move from step 3 to step 5. The repetition does the work by allowing the law of large numbers to make the typical set have probability near 1. In the repeated setting, we can ignore the non-typical sets because they become negligible. But in a single trial, we cannot ignore any branch with non-negligible probability.

  Moreover, the Kelly criterion for repeated bets is justified by the long-run growth rate, which is an average over the entire distribution (via the law of large numbers). The realized growth rate on the typical path is the same as the expected growth rate. But in a single trial, there is no long run, so we must consider the entire distribution.

  What about example 6C? The argument says we should ignore a one-in-a-million chance of a fortune and not pay a negligible cost for it. But if the cost is negligible and the fortune is huge, then the expected log wealth (if we are using log utility) might still be positive. For instance, suppose we are offered a gamble: pay $1 for a one-in-a-million chance to win $10B. The expected log wealth change for a person with current wealth W (assuming W is large compared to $1) is:

     (1 - 10^{-6}) * log(1 - 1/W) + 10^{-6} * log(1 + (10^10 - 1)/W)

  But if W is large, then log(1-1/W) ≈ -1/W, and log(1+(10^10-1)/W) ≈ log(10^10/W) = 10*log(10) - log(W). This is messy. However, the expected utility (in dollars) would be:

     -1 * (1 - 10^{-6}) + 10^{10} * 10^{-6} = -1 + 10^4 = 9999.

  So the expected monetary gain is positive. For a log utility agent, the expected utility of the gamble (if we assume the cost is paid from wealth W) is:

     (1 - 10^{-6}) * log(W - 1) + 10^{-6} * log(W + 10^10 - 1)

  This is approximately:

     log(W) + [ (1 - 10^{-6}) * log(1 - 1/W) + 10^{-6} * log(1 + 10^10/W) ]

  The term in brackets: 

     ≈ (1 - 10^{-6}) * (-1/W) + 10^{-6} * (10^10 / W)   [using log(1+x)≈x for small x]

     = - (1 - 10^{-6})/W + 10^4 / (10^6 W) 
     = [-1 + 10^{-6} + 10^{-2}] / W 
     = (-1 + 0.000001 + 0.01)/W 
     = (-0.989999) / W 

  which is negative. So a log-utility agent would decline the gamble. But note: the approximation log(1+x)≈x is only valid for small x. However, 10^10/W is not small if W is not huge. Suppose W is $1M (10^6). Then:

     log(W-1) ≈ log(10^6) = 6*log(10) ≈ 13.8155
     log(W + 10^10 - 1) = log(10^6 + 10^10) ≈ log(10^10) = 10*log(10) ≈ 23.02585

  Then expected utility:

     (1 - 10^{-6}) * 13.8155 + 10^{-6} * 23.02585 
     ≈ 13.8155 - 13.8155*10^{-6} + 23.02585*10^{-6}
     ≈ 13.8155 + (23.02585 - 13.8155)*10^{-6}
     ≈ 13.8155 + 9.21035e-6

  Which is greater than 13.8155. So the expected utility is higher than not taking the gamble? But wait, we have to subtract the cost? The cost is $1, so without the gamble, utility is log(10^6). With the gamble, it's the above. But we see that the expected utility is slightly higher than log(10^6). So the log-utility agent would accept the gamble? 

  Actually, the above calculation does not account for the cost in the wealth for the losing branch. Without the gamble: wealth = W, utility = log(W). With the gamble: we pay $1 to play. So in the losing branch, wealth becomes W-1, and in the winning branch, wealth becomes W-1 + 10^10. So the expected utility is:

     (1 - 10^{-6}) * log(W-1) + 10^{-6} * log(W-1 + 10^10)

  For W=10^6, we have:

     = (1 - 10^{-6}) * log(999999) + 10^{-6} * log(10000999999)

     ≈ (1 - 10^{-6}) * 13.8155 + 10^{-6} * 23.02585   (as above)

     ≈ 13.8155 - 13.8155e-6 + 23.02585e-6
     = 13.8155 + (23.02585 - 13.8155)*10^{-6}
     = 13.8155 + 9.21035e-6

  which is greater than log(10^6)=13.8155. So the expected utility is higher, so the agent would pay $1 for this gamble.

  But if the cost is very small and the gain is huge, then even a log-utility agent might accept. However, if the cost is a non-negligible fraction of wealth, then it might be declined. The point is: the expected log utility does not ignore the small-probability branch.

  In the case of removing a one-in-a-million chance of losing everything, a log-utility agent would be willing to pay a small cost to remove it. Because:

     Without removal: 
        (1 - 10^{-6}) * log(W) + 10^{-6} * log(0) 
     But log(0) = -∞, so the expected utility is -∞.

     With removal: log(W - c) 
     which is finite. 

  So the agent would pay any finite cost c < W to remove the risk. But note: the argument in step 6C says we should refuse to pay a negligible cost to remove a one-in-a-million chance of losing everything. This is clearly wrong for a log-utility agent. So the median maximization rule leads to absurdity.

  The flaw in the argument is therefore the move from the repeated setting (where the typical set has probability near 1) to the single trial (where there is no typical set with probability near 1). The principle of ignoring vanishing probabilities is only valid when we have many trials and the law of large numbers applies. In a single trial, we must consider the entire distribution, and the expected utility (with a concave utility function) appropriately balances the probabilities and the magnitudes.

  To answer the user's questions:

  - Step 4 and 5 are rejected.

  - The repetition does the work by making the typical set have probability approaching 1. The law of large numbers ensures that the realized growth rate is close to the expected growth rate with high probability. Moreover, the Kelly criterion uses the expected log (which is an expectation over the entire distribution) and the law of large numbers then tells us that the long-run growth rate is the expected log return per trial.

  - For one-off decisions, we use expected utility with a reasonable utility function (like log, or some other concave function). This is coherent with the Kelly approach for repeated bets because the Kelly approach is the same as maximizing expected log wealth per trial.

  - The critique of expected value (in the form of expected wealth) in the repeated setting stands: it leads to ruin. But that does not mean we should abandon expected value entirely; we should use a better utility function (like log).

  - The geometric rationality (in the sense of optimizing multiplicative growth) for repeated bets is captured by the Kelly criterion. For one-off bets, it is captured by the log utility function.

  - The price: we must accept that for one-off bets, the Kelly fraction (f=0.2) is not necessarily the fraction that maximizes the median outcome. It maximizes the expected log, which is a different criterion. The median maximization rule is not the same as the Kelly rule.

  Finally, the user's worry in step 8: if we apply the median rule per decision, the composition fails. This is another reason to reject the median rule. The expected utility rule (with a consistent utility function) composes: the overall expected utility is the expectation over the entire joint distribution. So it is additive in the log (for multiplicative bets) and so composes naturally.

  Conclusion:

     We reject step 5 (and the move from step 3 to step 5). The repetition is crucial because it allows the typical set to have probability near 1. In a single trial, we cannot ignore non-vanishing probabilities, and the appropriate rule is expected utility maximization.

     The step looked harmless because it equated "typical" in the repeated setting (which has high probability) to the "modal branch" in a single trial (which might have only 51% probability). But 51% is not high enough to ignore the other 49%. Moreover, even for very low probabilities, the magnitude matters when combined in the expected utility.

     We can keep (i) and (ii) and the view that expected utility (with a reasonable utility function) is the right rule for one-off decisions. This is coherent because for repeated bets, the Kelly criterion (which is expected log) is the same as maximizing the long-run growth rate, and for one-off bets, it is the same as maximizing expected utility with log utility.

     The critique of expected value (as in expected wealth) is valid, but the solution is to use a concave utility function (like log) in expected utility, not to switch to median maximization.
answer: |-
  The argument breaks down at **step 4**, and this failure propagates to steps 5 and 6. Here's a precise diagnosis:

  ### **Why Step 4 Fails**
  Step 4 claims that the principle of "ignoring vanishingly small probability branches" (from repeated bets) applies identically to single trials. This is incorrect because **repetition fundamentally changes the structure of uncertainty**:
  - In repeated bets, the law of large numbers ensures the "typical set" (e.g., paths with win frequency close to 60%) has probability approaching 1. Low-probability branches vanish *collectively* over time, so ignoring them is justified *for long-run growth*.
  - In a single trial, there is no "typical set" with probability near 1. You face discrete branches, each with fixed, non-vanishing probabilities (e.g., 40% or 49%). Ignoring any branch because it's "less probable" is arbitrary and discards meaningful information about risk.

  ### **What Repetition Provides (and the Single Case Lacks)**
  1. **Law of Large Numbers**: In repeated bets, the realized growth rate concentrates around the expected log-growth. This allows focusing on the typical set *without loss of generality*.  
  2. **Compounding**: The multiplicative nature of wealth dynamics makes the log-utility optimization (Kelly) path-invariant and self-consistently optimal across trials.  
  3. **Probability Weighting**: Low-probability events are not "ignored" in Kelly betting—they are incorporated into the expected log-growth calculation. Their impact diminishes *asymptotically* due to averaging over many trials, not because they are discarded per se.  

  In a single trial, none of these hold. The median/modal outcome is a poor proxy for rationality because:
  - It ignores the magnitude of outcomes in non-modal branches (e.g., 49% chance of $1M is treated as identical to $0).  
  - It violates dominance: if one option is better in *every* state, median-maximization might still reject it (e.g., if the modal branch is tied).  

  ---

  ### **Why Steps 5–6 Fail as a Result**
  - **Step 5** (maximize median/modal outcome) is a non-sequitur from step 3. Kelly does *not* ignore low-probability branches; it weights them by probability and marginal utility.  
  - **Step 6** exposes the absurdity:  
    - **A**: Indifference between 40% chance of $10B and nothing violates stochastic dominance.  
    - **B**: Taking $1 over 49% chance of $1M ignores the immense upside.  
    - **C**: Refusing cheap insurance against ruin (e.g., a 1-in-1M chance of losing everything) is catastrophic. Kelly/log-utility *demands* accepting such insurance because log(0) = -∞.  

  ---

  ### **Reconciling Your Intuitions**
  You can coherently keep:
  - **(i)**: Expected wealth maximization fails in repeated bets (it risks ruin).  
  - **(ii)**: Kelly is optimal for repeated bets (it maximizes asymptotic growth).  
  - **Expected utility (EU) for one-off decisions**: This is consistent!  
    - Kelly for repeated bets is *equivalent* to EU with log utility per trial.  
    - For one-off bets, use EU with a concave utility (e.g., log, sqrt). This avoids the pitfalls of step 6:  
      - In **A**, EU distinguishes $10 vs. $10B.  
      - In **B**, EU favors the $1M opportunity (if utility is concave).  
      - In **C**, EU pays cheap insurance (since ruin has infinite disutility).  

  ### **The Price of Clarity**
  - **What you keep**: Kelly as the gold standard for repeated multiplicative bets, and EU for one-off decisions.  
  - **What you reject**: The idea that "typicality" transfers from repeated to single bets. Repetition enables the LLN; single bets require full-distribution weighting.  
  - **Cost**: You must accept that Kelly (f=0.2) is *not* generically "optimal" for single bets—it’s optimal *only* for repeated bets or EU-maximizers with log utility.  

  ---

  ### **Why Step 4 Looked Harmless**
  - **Misleading analogy**: The argument conflates "high probability" (60% in one trial) with "probability near 1" (typical set in LLN). But 60% ≠ 99.99%, and a single branch isn’t a "set".  
  - **Hidden assumption**: It assumes rationality requires *ignoring* non-modal outcomes, but EU shows we can *balance* probability and magnitude.  

  ### **Final Answer**
  Reject **step 4** (and thus 5–6). Repetition works via the **law of large numbers** and **compounding**, which collapse the decision to a deterministic growth rate on typical paths. Single trials lack this collapse, so EU with concave utility is the rational alternative. This preserves Kelly’s normative status for repeated bets, condemns naive expected-wealth maximization, and avoids the absurdities of median-maximization.
