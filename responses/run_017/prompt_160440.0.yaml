prompt: |-
  I am a novelist, and for the past two years I have been at work on a book that alternates between the British sack of Benin City and the present day, where the objects carried out of it sit in European and American collections. The research has left me with an argumentative shape I keep encountering and cannot name, and I would like either the name or, failing that, a clean carving of the thing itself.

  Here are the instances. First: a curator argues that a looted altar head should remain where it is because everything that has happened to it since 1897 has given it a second life — it has been catalogued, photographed, published, compared, seen by millions, drawn into a general history of human making; the removal, on this telling, is the beginning of a wider career, not the end of a narrower one. The same curator, in the same conversation, argues that the head could not be returned to any purpose, because the cult that made it is no longer practised, the kingdom's institutions have been transformed, and the object's original function is gone beyond recall. So the object's post-removal history is invoked as continuity when continuity helps the holder, and as rupture when rupture helps the holder. Second, older and cleaner: the case for keeping the sculptures taken from the Parthenon has rested at various points on the claim that they now belong to a collection of the whole world, and on the claim that their original setting is irrecoverable, the temple a ruin, the frieze dispersed beyond repair. The more thoroughly an object was torn out of the world that made it, the more available the argument becomes that there is no such world for it to go back to.

  That last sentence is the part I most want identified. The destruction and the justification are not two separate facts here; the wrong's own consequences are what is offered as the reason the wrong need not be undone, and the worse the original injury, the better the argument gets. This is not, I think, ordinary hypocrisy, because both halves can be true at once of different aspects of the same object: its physical custody can have been broken while its social meaning persisted, or the reverse. It is not motte-and-bailey, because neither claim is a modest fallback from the other; they are two full-sized claims pointing in opposite directions. And a lawyer I put this to mentioned title ripening through possession and claims going stale with time, which does not fit either, since those depend on mere lapse, whereas here the lapse is something the taking itself manufactured and the taker's successors now profit from. A philosopher I mentioned it to said there is a view that very old wrongs can cease to generate present duties once circumstances have changed; but that seems to be about changes that would have happened anyway, and this is precisely the opposite case, the one where we would least want the duty to lapse.

  What I need is not a label but the shape. Is this one phenomenon or two — the opportunistic switching between continuity and rupture, and the injury that cures itself — and if two, how do they connect? Does the established vocabulary already contain it under some description, or is it genuinely unnamed, in which case name it and define it for me? I need the boundary cases most of all. What happens to the argument when the object's original context would have vanished regardless — through iconoclasm, decay, conversion, changes internal to the community that made it? What when the holder is not the institution that destroyed the context, but a later purchaser? What when the object has in fact acquired a genuine second community, including among descendants of its makers who disagree among themselves about whether it should travel? And what when the object's present value consists almost entirely in its being a record of its own theft — when the second life just is the evidence of the crime? Does that strengthen the holder's case or collapse it?

  I should say why I want this at such length. The novel has a scene in which a curator and a claimant argue, and I have found that I cannot write the curator well until I can state his case in its strongest and most internally consistent form rather than as a caricature, which means I need to know exactly which move he is making, where it holds, and where it fails. So please do not give me a reading list or citations — I could not evaluate them, and they would only defer the answer. Give me the concept: what it is, what it is not, which of my instances are central and which peripheral, and where its edges lie.
reasoning: |-
  Okay, the user is a novelist working on a book about the British sack of Benin City and the current state of looted artifacts in Western museums. They've encountered a recurring argumentative pattern in their research that they can't name. They describe two main instances: one with a Benin altar head where a curator uses both continuity and rupture arguments to justify keeping the artifact, and another with the Parthenon Marbles using similar reasoning. The core issue is that the destruction caused by the initial theft is used as justification against restitution—the worse the damage, the stronger the argument becomes.

  The user needs to identify this logical structure clearly. They've ruled out hypocrisy, motte-and-bailey, and legal concepts like adverse possession. A philosopher mentioned the idea that old wrongs might not generate present duties due to changed circumstances, but that doesn't fit because here the changes were caused by the theft itself.

  Breaking this down: The curator's argument has two parts. First, they claim the object's post-removal history gives it a new life (continuity). Second, they argue the original context is gone (rupture). These are used opportunistically: continuity to emphasize the object's current significance, rupture to dismiss the possibility of return. The key point is that the theft itself created the conditions that justify keeping the object. The more severe the initial harm, the more irretrievable the context seems, making restitution seem pointless.

  This is a self-validating injury: the harm justifies its own perpetuation. It's not two separate phenomena but one interconnected structure. The opportunistic switching between continuity and rupture serves the self-validating injury. Continuity focuses on the object's life in the museum, while rupture focuses on the broken ties to its origin.

  For boundary cases: If the original context vanished independently (e.g., natural decay), the argument weakens because the museum isn't responsible. If the holder is a later purchaser, the self-validation still applies if they benefit from the initial harm. If descendants are divided, the rupture claim becomes ambiguous. When the object's value lies in being evidence of the crime, the museum's position collapses because the "second life" is inherently tied to the theft, making continuity inseparable from the crime.

  The user needs this for a novel scene where a curator and claimant argue. To write the curator convincingly, the argument must be presented in its strongest form. The concept should be defined clearly, distinguishing it from similar ideas and outlining its boundaries.
answer: |-
  This phenomenon has no single established name, but its core structure is distinct and powerful. It **is one unified phenomenon**, not two separate ones. The "opportunistic switching" and the "injury that cures itself" are interdependent facets of the same logical mechanism. Let's carve its shape:

  ### The Core Concept: Self-Validating Expropriation (SVE)

  *   **Definition:** A rhetorical and justificatory strategy where the *consequences* of an initial act of wrongful taking (destruction, displacement, disruption) are invoked as the primary reason why the *reversal* of that act (restitution, repair) is now impossible, impractical, or undesirable. The severity of the original wrong becomes the foundation for its own perpetuation. The injury manufactures the conditions that seemingly justify its continued existence.
  *   **Mechanism:**
      1.  **The Taking:** An object (or right, land, etc.) is removed from its original context by force, fraud, or exploitation. This act often *causes* or *accelerates* the destruction/disruption of that context (e.g., sacking a city, suppressing a religion, dismantling institutions).
      2.  **Manufactured Rupture:** The taking *itself* severs the object's physical and often functional connection to its origin. Over time, the original context may genuinely decay further due to the instability caused by the taking.
      3.  **Manufactured Continuity:** Simultaneously, the object embarks on a "new life" *within the system of the taker* (museum, collection, market, discourse), accruing new meanings, audiences, and value defined by that system.
      4.  **Opportunistic Invocation:** The holder (or their successor) argues against restitution by selectively invoking:
          *   **Rupture:** "The original context/world/function/community is gone (partly/mostly *because we destroyed it*). Returning the object is meaningless/impossible."
          *   **Continuity:** "The object's history *since we took it* is rich and significant. Its current location and meaning within *our* system are now paramount. Removing it *again* would disrupt *this* valuable continuity."
      5.  **Self-Validation:** The *destructive aspect* of the initial taking (the rupture) and the *absorptive aspect* of the taking (the imposed continuity) become the twin pillars supporting the argument *against* undoing the taking. The worse the rupture caused, the stronger the rupture argument becomes; the longer the imposed continuity lasts, the stronger that continuity argument becomes. The original wrong generates its own justification.

  ### What It Is Not

  *   **Hypocrisy:** While hypocrisy might be present, SVE is structurally distinct. The curator *can* genuinely believe both halves are true *in their respective domains* (original function *is* gone; museum context *is* rich). The power lies in how these truths, arising *from the taking*, are deployed strategically *against restitution*.
  *   **Motte-and-Bailey:** Correctly dismissed. Both claims (rupture of origin, continuity in museum) are substantive, independent assertions used actively, not one as a retreat from the other.
  *   **Adverse Possession / Prescription:** These legal doctrines rely on the *passage of time* and *good faith* (or at least unchallenged possession) altering ownership. SVE relies on the *active consequences of the initial wrong* (the destruction/disruption it caused) as the justification, not just time passing. The holder often benefits *because* the taking was destructive.
  *   "**Circumstances Changed**" **Argument:** The philosopher's point concerns changes *external* or *inevitable* that alter obligations. SVE concerns changes *directly caused by the wrong itself*. The argument isn't "things changed *anyway*," it's "we changed things *so thoroughly by taking it* that reversal is moot."
  *   **Simple Pragmatism:** It's not merely arguing return is impractical. It specifically leverages the *harm done by the taking* as the source of that impracticality.

  ### Your Instances: Central and Peripheral

  *   **Benin Altar Head:** **Central Example.** Perfectly illustrates both opportunistic switching *and* the self-validating core. The rupture (destruction of Oba's power, end of cult) is invoked to deny return, while the imposed continuity (cataloging, display, global art history) is invoked to justify retention. The sacking *caused* the rupture used to justify keeping the loot.
  *   **Parthenon Marbles:** **Central Example (Slightly Different Emphasis).** Focuses heavily on the rupture argument ("irreparable ruin/dispersal") manufactured by the removal itself and subsequent neglect. The "global collection" argument is the imposed continuity claim. The Elgin Marbles' fame *as fragments in London* is inseparable from the damage done in removing them and the damage to the structure left behind.
  *   **Lawyer's "Title Ripening" / Philosopher's "Old Wrongs":** **Peripheral/Irrelevant.** They point to adjacent concepts but fail to capture the *causal link* where the wrong creates the justification for its own permanence.

  ### Boundary Cases: Where SVE Holds, Weakens, or Collapses

  1.  **Original Context Would Have Vanished Regardless (e.g., internal decay, iconoclasm):**
      *   **SVE Weakens/Collapses.** If the rupture would have happened *without* the taking, the holder's rupture argument loses its self-validating power. They cannot claim *their* act caused the condition justifying their retention. ("Yes, the cult died out naturally 50 years later, but *we* took it while it was still vital and suppressed its practice." vs. "We took it 50 years *after* the cult died out.") The continuity argument might still stand, but it's no longer bolstered by a rupture the taker caused.

  2.  **Holder is a Later Purchaser (Good Faith):**
      *   **SVE Still Applies (Structurally), But Morally Different.** The *logic* remains: the object's presence in collections relies on the initial rupture. The purchaser benefits from the manufactured rupture ("can't go back") and the imposed continuity (value in the art market/museum system). However, the moral culpability shifts. The argument relies on the *fact* of the rupture caused by the original taking, not the current holder's intent. The self-validation pertains to the *act* of expropriation, not necessarily the *current holder's* blameworthiness.

  3.  **Genuine Second Community / Descendant Disagreement:**
      *   **Complicates Rupture Argument, Challenges Imposed Continuity.**
          *   **Rupture Argument Weakens:** If descendants form a new community valuing the object (even differently), or if some descendants advocate return, the claim of "no community to return to" or "no purpose" is significantly undermined. The rupture is shown to be less absolute.
          *   **Imposed Continuity Argument Challenged:** If the "second life" includes the source community's diaspora or descendants engaging with it *in exile*, the museum's claim of sole or primary stewardship weakens. The imposed continuity starts to reconnect with the source, blurring the rupture. SVE struggles if the manufactured rupture isn't absolute and the imposed continuity isn't solely controlled by the holder.

  4.  **Object's Value is Primarily as Evidence of Theft:**
      *   **Collapses the Imposed Continuity Argument & Explodes SVE.** This is the most fascinating boundary.
          *   The "second life" (its value as evidence) is *entirely parasitic* on the crime. The imposed continuity *is* the record of the rupture. The museum *cannot* invoke this "continuity" (the object's meaning as loot) without simultaneously invoking and validating the rupture argument *and* admitting the crime. It becomes self-incriminating.
          *   **Holder's Case Collapses:** Arguing "it has this valuable second life *as evidence we stole it*, therefore we must keep it *so everyone knows we stole it*" is absurd. The only internally consistent position for the holder is to deny the theft or downplay the significance of the evidence. Acknowledging the value *as evidence of the crime* makes retention indefensible under SVE logic; it demands restitution *as* evidence or as the rightful property finally returned. The self-validation implodes because the continuity and rupture are revealed as one and the same: the crime itself.

  ### For Your Curator's Strongest Case

  The curator's strongest, most internally consistent use of SVE requires:
  1.  **Emphasizing Irreversible Rupture:** Argue the original context was *uniquely and definitively shattered* by the historical event (the sack), and subsequent changes (modern Benin, end of the Kingdom, religious shifts) are a direct, unsurvivable consequence of *that* rupture. The object is an orphan of that specific violence.
  2.  **Emphasizing Universal Value of Imposed Continuity:** Argue that the museum context isn't just *a* new life, but a *superior*, *democratized*, and *universally accessible* life within the canon of human art history. The object has transcended its parochial origins (made possible by its removal) to speak to all humanity.
  3.  **Decoupling:** Strictly separate the "original function" (dead, gone) from the "aesthetic/historical value" (living, vibrant in the museum). Treat the rupture as total regarding function/context, and the continuity as total regarding art/value/discourse.
  4.  **Avoid Acknowledging the Crime as Central Value:** Never concede that the object's primary significance in its current location is *as loot*. Acknowledge provenance factually, but frame the "second life" as scholarly, aesthetic, and universal, *not* primarily evidential of the crime.

  ### Where the Curator's Argument Fails

  1.  **Moral Responsibility:** SVE dodges the core issue: the objects are present *only because of a violent crime*. Justifying retention based on the effects of that crime ignores the foundational injustice.
  2.  **Dynamic Communities:** The rupture is rarely absolute. Source communities adapt, remember, reinterpret, and often *do* have claims and uses for returned objects, challenging the "no purpose" argument.
  3.  **The Contingency of "Universal Value":** The "second life" is contingent on Western institutions, aesthetics, and power structures. Its "universality" is often contested and reflects the dominance of the holder's culture.
  4.  **Ignoring Alternative Continuities:** It dismisses the possibility of meaningful continuity *within* the source community or diaspora, even if transformed.
  5.  **The Paradox:** The argument relies on the destruction it caused to justify itself, creating a perverse incentive against restitution and an ethical blind spot regarding origins.

  **In short:** You are grappling with **Self-Validating Expropriation (SVE)**. It uses the destruction wrought by theft to argue against restoration, and the new life imposed by the thief to argue against return. Its power lies in this closed loop of justification. Its weakness lies in its denial of ongoing responsibility, its disregard for the agency and adaptation of source communities, and its foundation in an original act of violence it refuses to truly confront. For your curator, mastering this shape allows him to make a formidable, coherent, yet ultimately ethically hollow case for retention, built on the very ruins he claims make return impossible.
