prompt: |-
  I fell down a rabbit hole about the Kelly criterion and this "geometric rationality" stuff — the pitch I got was that maximizing expected value is really averaging over a bunch of parallel copies of you, while what you actually live through is one single wealth curve, so what you should be maximizing is it's growth rate — and now I'm trying to work out what I actually think, going case by case on gut. Here's where I land:

  - Coin flip, heads gets me 3x my stake back (counting the stake), tails I lose it, and I get to run it a hundred times in a row. I put up about a quarter of my net worth each time, which I'm told is exactly what the growth-rate rule says.
  - The identical bet, offered exactly once. I'd put up maybe 10%, definately not a quarter.
  - A 1% shot at 1000x my stake, 99% chance I lose what I put in. Rule says about 1% of net worth. I'd throw in 3% and I feel fine about it.
  - Home insurance at a premium maybe 60% above the expected loss. I buy it without thinking, even though it's negative expected value and it drags my growth rate down.
  - Twenty independent bets, each of which I figure has about a 12% chance of paying 10x and otherwise zero, and in each I can lose only what I put in. I spread across all twenty at a couple percent each, which is nearly half my net worth at risk in total, and that feels right to me even though it breaks every "never risk more than 5%" rule I've ever been told.
  - Even-money bet where I think I'm 60% to win, but I've been overconfident before. Rule says 20%; I'd bet maybe 6%, and if the 60% came from a model I built last week, closer to zero.
  - A bet at 3-to-1 in my favor where the money comes straight out of my brother's pocket. I won't take it.

  My tentative principle: maximize the expected growth rate of my whole wealth, counting future earnings as part of that wealth, then bet some fixed fraction of whatever stake that recommends because my edge estimates aren't reliable. That seems to get the spread-out case and the shaky-estimate case, but it flatly contradicts me on the insurance, and I can't tell what it says about the one-shot-versus-repeated difference, or about the longshot where I want to overbet.

  Is there one principle that gets these, or close? State it precisely, say which case motivates each clause, and tell me honestly which of my verdicts it can't accommodate and would force me to drop — I suspect the one-shot/repeated asymmetry and maybe the longshot, but I want to know exactly what I'd be giving up. Two I haven't decided: a one-shot 50/50 where heads pays 5x my stake but I'm capped at 20% of my net worth (the rule says bet the max, and I genuinely don't know if I would), and whether any of this transfers to non-money stakes, like quitting a stable job for a 10% shot at something much better, where there's no number I can point to and call "my wealth."

  Lead with your bottom line in the first sentence — the principle, or the call that no single one survives — then give the reasoning. No preamble, no restating my question, American English.
reasoning: |-
  Okay, the user is deep into the Kelly criterion and geometric rationality, trying to reconcile theory with their gut feelings on various betting scenarios. They've listed seven concrete cases where their intuition clashes with standard Kelly advice, plus two undecided ones. The core tension is between maximizing expected growth rate (the geometric mean) and their own risk tolerance in situations like one-off bets, insurance, or shaky probabilities. 

  Hmm, they're clearly analytically minded—breaking down each case shows they've done their homework. But there's frustration underneath: they want a unified principle that doesn't force them to abandon intuitions like buying insurance or underbetting on unreliable estimates. The mention of "future earnings" and "non-money stakes" hints they're thinking beyond gambling—this is about life decisions too. 

  Right, let's dissect their cases. Coin flip repeated vs. one-off is the first red flag: Kelly says bet the same fraction, but they'd bet less for one-shot. That screams "risk of ruin" fear, which Kelly ignores if you can reload. Then the 1000x longshot—they want to overbet Kelly (3% vs 1%). Feels like they're buying lottery tickets for the thrill? Or maybe just hedging against small probabilities dominating long-term growth. 

  Insurance is the clearest conflict: negative EV but they buy it. Pure emotional utility—losing the house isn't just a number. The twenty small bets case fascinates me: they're comfortable with high total exposure because diversification reduces tail risk. Classic "volatility pumping," but Kelly doesn't see portfolio effects here since bets are independent. 

  Their tentative principle (growth rate + fractional betting for robustness) almost works... but fails insurance and the brother bet. The brother bet is pure ethics—no math fixes that. 

  So what principle captures this? Expected utility theory with a concave utility function (like log(wealth) for growth, but flattening for catastrophes). Add uncertainty-adjusted edge for overconfidence cases. But even that won't save the brother bet—that's deontology, not math. 

  For the undecided 5x coin flip: betting max 20% at 50/50 is +EV but risky. Their hesitation suggests loss aversion beyond log(wealth). And non-money stakes? Utility theory can extend there, but "wealth" must include intangibles like career satisfaction—hard to quantify. 

  Honestly, no one principle survives every case. They'll have to accept: Kelly for repeatable bets, expected utility with safeguards (insurance, ruin aversion) for one-offs, and ethics as a separate layer. Their verdicts on shaky estimates and diversification are spot-on though—those are features, not bugs. 

  Final note: they're wrestling with the gap between abstract rationality and human instincts. That's not a flaw—it's where good decision theory lives. I should validate that tension.
answer: |-
  **Bottom line:** Maximize the expected logarithm of total wealth (including future earnings), but modulate the bet size using a multiplier `0 < m ≤ 1` applied to the Kelly fraction, where `m` decreases with uncertainty in edge estimates, exposure to ruin, non-linear utility impacts (like insurance), and ethical constraints.

  **Precise Principle:**  
  Choose bets to maximize `E[log(W)]`, where `W` is total lifetime wealth (current assets + discounted future earnings). The stake for a bet is `s = m * f * W`, where `f` is the Kelly-optimal fraction, and `m` is a multiplier determined by:  
  1. **Uncertainty:** `m ↓` as confidence in probability/edge estimates decreases.  
  2. **Ruin Risk:** `m ↓` if the bet could cause irreversible loss (e.g., bankruptcy, lost opportunities).  
  3. **Utility Curvature:** `m ↓` for losses with catastrophic non-log utility impacts (e.g., home loss).  
  4. **Ethics:** `m = 0` if the bet violates fairness or relationships.  

  **Case-by-case Motivation & Fit:**  
  1. **Repeated 3x Coin Flip (25% stake):**  
     - Kelly (`f = 0.25`) is optimal here. High repetitions justify max growth. **Fit: YES** (with `m=1`).  
  2. **One-Shot 3x Coin Flip (~10% stake):**  
     - Ruin risk dominates. Kelly (`f=0.25`) is too aggressive. **Fit via `m=0.4`** (reducing `f` to 10%).  
  3. **1000x Longshot (3% stake vs. 1% Kelly):**  
     - Kelly (`f=0.01`) ignores tail gains' psychological/preference value. **Fit via `m=3`** (overbetting for convex utility in outliers).  
  4. **Home Insurance (Buy despite -EV):**  
     - Non-log utility: Losing your home is catastrophic. `m=0` (override growth for security). **Fit: YES**.  
  5. **20 Small Bets (40% total exposure):**  
     - Diversification reduces ruin risk. Kelly across bets justifies high exposure. **Fit: YES** (with `m=1`).  
  6. **60% Edge with Doubt (6% vs. 20% Kelly):**  
     - Uncertainty in edge requires `m=0.3`. **Fit: YES**.  
  7. **Brother's Money (Refuse bet):**  
     - Ethics force `m=0`. **Fit: YES**.  

  **Your Verdicts It Can't Accommodate (Must Drop):**  
  - **The one-shot vs. repeated asymmetry**: Your intuition treats them differently, but Kelly (`E[log(W)]`) recommends the same fraction for both. The principle **forces you to drop this asymmetry**—it handles the one-shot case via `m<1` for ruin risk, not a different optimization.  
  - **Longshot overbetting**: Kelly says 1%, you say 3%. The principle can fit this (via `m>1`), but **overbetting is not mathematically optimal** for long-run growth—it’s a preference for tail gains.  

  **Undecided Cases:**  
  - **One-shot 50/50, 5x payoff (Kelly: bet max 20%)**:  
    - With no ruin risk (capped at 20%), Kelly says bet max. The principle **accepts this** (`m=1`). If you hesitate, it’s due to loss aversion beyond log(wealth)—add a utility penalty for large losses.  
  - **Non-money stakes (e.g., quitting a job)**:  
    - Extend `W` to include lifetime utility. The principle **transfers** if you quantify the utility of outcomes (e.g., log(job satisfaction)).  

  **Why This Works:**  
  - Maximizing `E[log(W)]` captures growth-optimality for repeated bets.  
  - `m` adjusts for human constraints: uncertainty (cases 2,6), ruin (case 2), utility (case 4), ethics (case 7).  
  - Overbetting longshots (case 3) is allowed as a preference, not optimality.  

  **Honest Trade-offs:** You must accept that one-shot and repeated bets *mathematically* require the same fraction without risk of ruin—your intuition for betting less in one-shot is reframed as avoiding ruin, not changing the goal. Longshot overbetting is a psychological add-on, not geometric rationality.
