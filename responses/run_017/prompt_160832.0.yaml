  First, I need to identify why standard approaches fail: most students can recite the "three paragraphs" about informal/formal equivalence and convergence of formalisms, but struggle to articulate what kind of claim the thesis represents. The genuine difficulty lies in:
  - Disentangling the three readings (classificatory/physical/methodological)
  - Understanding how each would respond to empirical counterevidence
  - Grappling with whether unverifiable physical processes qualify as computation
  - Recognizing that methodological utility might survive physical falsification

  I consider several question formulations:
  Option 1: "Discuss how the experimental scenario affects each reading of CTT" - risks superficial listing without probing epistemic tensions.
  Option 2: "Argue whether this falsifies CTT" - too binary, misses nuance between readings.
  Option 3: "Analyze what the device reveals about CTT's pre-existing status" - better but may not force engagement with unverifiability.
  Option 4: Hybrid approach incorporating all required elements - the chosen version scaffolds analysis while demanding judgment calls.

  The final question design must:
  1. Present the device scenario with all specified caveats
  2. Explicitly reference the three readings framework
  3. Target the epistemic status question pre/post-experiment
  4. Include the "lookup table" objection
  5. Challenge candidates on whether this constitutes computation

  For the marking scheme, I'll prioritize:
  - Clear differentiation between readings (4 marks)
  - Analysis of threat levels to each reading (5 marks)
  - Treatment of unverifiability/lookup table issue (6 marks)
  - Epistemic status diagnosis (5 marks)
  - Methodological independence insight (5 marks)

  The model answer will:
  - Acknowledge consensus where it exists (e.g., classificatory reading not empirically falsifiable)
  - Flag controversies (e.g., whether physical CTT is testable)
  - Note my own assumptions (e.g., that computation requires verifiability)
  - Show how a candidate could reasonably disagree while scoring well

  Crucially, the rubric will reward coherent alternative views if well-argued, particularly on whether the physical process computes and whether readings are separable. The A/B differentiation hinges on whether candidates merely describe the readings or use them as analytical tools to dissect the scenario.
answer: |-
  **Final Question**  
  You have 90 minutes. Answer all parts concisely. No external references are needed. Assume familiarity with Turing computability and the halting problem.  

  An experimental group claims to have physically realized a device that computes the halting function for arbitrary Turing machines. The device exploits relativistic effects: a subsystem performs infinitely many discrete steps in finite proper time (from the experimenter’s perspective), outputting "halts" or "does not halt" for any given machine-input pair. Three caveats accompany this claim:  
  1. The device is single-shot per input; outputs cannot be independently verified by any Turing machine (except for cases where halting is already provable).  
  2. Reliability degrades for inputs above size *N*; the team attributes this to engineering noise, not a fundamental limit.  
  3. Any finite set of input-output pairs the device produces is consistent with some Turing machine using a large lookup table.  

  In this seminar, we distinguished three readings of the Church–Turing Thesis (CTT):  
  - **Classificatory**: CTT analyzes the intuitive notion of "effective calculability" (what humans can compute by following rules).  
  - **Physical**: No physically realizable system can compute beyond Turing-computable functions.  
  - **Methodological**: CTT licenses mathematical practice—e.g., treating informal algorithms as formally specifiable and assuming equivalence between computational models.  

  **Answer the following**:  
  (a) For each reading, does the device threaten it? Explain why or why not. (9 points)  
  (b) Is the device truly *computing* a non-computable function, or merely instantiating a physical regularity we interpret as computation? Defend your view using the caveats. (6 points)  
  (c) Suppose you accept the device’s operation as valid. Could you consistently reject the Physical CTT while retaining the Classificatory and Methodological readings for mathematical work? What does this imply about the independence of the three readings? (5 points)  
  (d) Before the announcement, CTT’s truth seemed underdetermined by finite evidence (since any finite data is consistent with a lookup table). Given the scenario, what does this underdetermination reveal about CTT’s epistemic status? Was it an empirical hypothesis, a definition, a regulative principle, or something else? Justify your answer. (5 points)  

  ---

  **Model Answer** (780 words)  

  **(a)** The device threatens each reading differently, reflecting their distinct epistemic commitments.  
  - **Classificatory reading**: *Not threatened*. This reading concerns the *concept* of effective computation by a human following rules. The device’s operation—relying on relativistic physics inaccessible to human cognition—does not align with "effective calculability" as understood pre-theoretically (e.g., finitely many steps with immediate surveyability). Caveat 3 reinforces this: since outputs mimic a lookup table, they don’t demonstrate a *procedure* humans could enact. The reading is conceptual, not empirical; its evidence comes from analyzing intuitions (e.g., through Turing’s analysis of "computor" limitations), not physical experiments. [*Consensus*: Classificatory CTT is not empirical; *contested*: Whether human computation bounds are revisable.]  
  - **Physical reading**: *Directly threatened, but not falsified*. This reading makes an empirical claim: physics cannot realize hypercomputation. The device appears to contradict this. However, caveats 1–3 prevent conclusive falsification. Unverifiability (caveat 1) means we cannot confirm it computes the halting function; degradation (caveat 2) suggests experimental artifact; and lookup-table consistency (caveat 3) leaves open that it emulates a computable function. Crucially, the device’s reliability might stem from unknown physical laws, but Physical CTT could be preserved by arguing it exploits "oracles" (e.g., spacetime structure) not countenanced in standard computation. [*Contested*: Whether Physical CTT is falsifiable; *my view*: It is *in principle* falsifiable, but not by this experiment due to verification problems.]  
  - **Methodological reading**: *Unaffected*. This reading concerns mathematical methodology: using formal models (e.g., Turing machines) to precisify algorithms and prove universality. Even if the device works, mathematicians need not abandon treating "computable" as coextensive with Turing computability for *mathematical purposes*. The device’s outputs are unverifiable and unusable in proofs (caveat 1), so it doesn’t offer an alternative formalization. Methodological CTT persists as a norm for intersubjective verification. [*Consensus*: Methodological CTT is a pragmatic norm; *contested*: Whether it depends on Physical CTT.]  

  **(b)** The device is *not computing* in a philosophically robust sense. Computation requires more than input-output correlations; it demands a **mechanism whose steps can be validated as rule-following**. Caveat 1 makes validation impossible: outputs are uncheckable, so we cannot distinguish actual computation from a "black box" emitting predetermined answers (as caveat 3 notes). Calling this "computation" conflates causal regularity with algorithmic execution. For example, a rock falling might "solve" differential equations, but we don’t attribute computation to it—similarly, this device instantiates a physical process we *interpret* as computing halting. [*Assumption*: Computation requires verifiable rule-governedness; *contested*: Some (e.g., natural computation theorists) reject this.]  

  **(c)** Yes, one can consistently reject **Physical CTT** while retaining the other readings. **Classificatory CTT** remains intact as it defines "human-effective" computation, which the device does not exemplify. **Methodological CTT** endures because mathematical practice relies on effective procedures (e.g., for proof verification), which remain Turing-computable. The device’s outputs are epistemically inert for mathematics—they lack proof-theoretic force (caveat 1). This implies the three readings are **logically independent**: the Physical reading makes an empirical claim, while the Classificatory and Methodological readings are conceptual/pragmatic. One could even argue the device *presupposes* Classificatory CTT by defining its output in classical computational terms.  

  **(d)** The underdetermination reveals CTT is not an **empirical law** (which finite evidence could confirm/disconfirm) but a **regulative principle with conceptual foundations**. Pre-announcement, CTT’s resilience stemmed from (i) conceptual analysis tying computation to human agency (Classificatory), and (ii) methodological utility in mathematics (Methodological). The Physical reading, if empirical, inherits underdetermination from physics—but caveat 3 shows CTT’s core is insulated from empirical counterexamples by design. Before the device, CTT functioned as a **frame-setting principle**: defining what counts as a computation. The scenario highlights that CTT’s epistemic strength arises from its role in organizing knowledge, not empirical content. [*My view*: Classificatory CTT is near-definitional; Physical CTT is a contingent but unfalsifiable empirical claim; *contested*: Whether Physical CTT is empirical.]  

  ---

  **Marking Scheme** (Total: 25 points)  
  **Must-hit points** (✓ = minimal pass; ★ = distinction-level insight):  

  | Points | Criterion | How candidates go wrong | A/B Differentiation |
  |--------|-----------|--------------------------|---------------------|
  | **4** | **(a) Differentiates threats to each reading** | Treats all readings uniformly; ignores caveats. | ✓: Correct threat diagnosis per reading. ★: Explains *why* caveats protect Classificatory/Methodological readings (e.g., conceptual vs. empirical grounds). |
  | **6** | **(b) Critically engages "computation"** | Assumes device computes if outputs are correct; neglects caveats 1 & 3. | ✓: Notes unverifiability. ★: Argues computation requires intersubjective validation (linking to methodological CTT) or contrasts physical causation vs. algorithmic execution. |
  | **5** | **(c) Consistency & independence of readings** | Claims readings stand/fall together; misses methodological CTT's resilience. | ✓: Says Physical CTT can be false while others hold. ★: Explains *how* Methodological CTT functions without Physical CTT (e.g., unverifiable outputs are mathematically useless). |
  | **5** | **(d) Epistemic status diagnosis** | Calls CTT "empirical" or "definitional" simplistically. | ✓: Identifies regulative/principle status. ★: Ties underdetermination to CTT's pre-empirical role (e.g., framing what evidence counts). |
  | **5** | **Argument precision** | Vagueness ("some say..."); ignores caveats; misuses CTT readings. | ✓: Uses readings accurately. ★: Synthesizes caveats into responses (e.g., caveat 3 undermines Physical threat; caveat 1 isolates Methodological CTT). |

  **Grading Key**:  
  - **A (21–25)**: Hits all ★-level criteria. Explicitly analyzes caveats, defends coherent philosophical stance (even if contested), and demonstrates independence of readings.  
  - **B (16–20)**: Hits ✓-level for all criteria. Correctly applies readings but lacks depth on caveats or epistemic implications.  
  - **C (11–15)**: Superficial treatment (e.g., "device falsifies CTT"), omits one reading, or misinterprets caveats.  

  **Note on Controversy**: In (b)–(d), full credit requires acknowledging alternatives (e.g., in (b): "If computation requires only input-output fidelity, the device computes, but this conflicts with methodological CTT"). Rejecting the model answer’s assumptions (e.g., "computation need not be verifiable") earns credit if argued rigorously (e.g., appealing to accelerating Turing machines).
