prompt: |-
  I do a bit of volunteering for a food co-op and I also knock on doors at election time, which means I spend a silly amount of time arguing with people online about whether one person's bit makes any difference. I've noticed a move that keeps coming up and I don't have a word for it.

  The setup is always the same. Someone says the "it makes no difference what I do" thing — my one vote won't decide anything, my one pack of chicken won't change how many birds get killed, my one car won't change the weather. And the reply that always shows up is: sure, not to *that*. You're measuring the outcome at the wrong zoom level. My vote doesn't change who wins, but it changes the margin, and the margin matters — there are recount triggers, parties get public money or ballot access off a percentage threshold, and a candidate who got slaughtered behaves differently next time. My chicken doesn't change today's order, because the supplier ships whole crates and my pack just gets absorbed into the slack — but it changes where the shelf sits at the end of the week, and a few weeks later a crate that would have been ordered on Thursday gets ordered on Friday, so at the level of "birds killed this year" there's a difference, just not at the level of "birds killed because of me". Same with driving: no storm is any different, but the odds of one shift by some fraction of a fraction of a percent.

  Two things bug me.

  First, the move looks like it's available in both directions without limit. Zoom in far enough and literally anything makes a difference — the exact bytes in the supplier's database, the path of one molecule. Zoom out far enough and nothing does. So "you're looking at the wrong resolution" definately can't be all there is to it. Something has to pick the right resolution, and I want to know what, and whether it can be said without just begging the question against the person who started with "it makes no difference".

  Second, I think there are two different moves hiding under "wrong zoom level" and I can't cleanly seperate them. One is describing the same outcome more or less finely: who wins versus by how much. The other is walking further along the chain: who wins, then what policy, then who gets hired, then what that person does with the job. And the second one can come apart from the first in the opposite direction, which is the bit that actually confuses me: I break a tie, so at the level of "who wins" my vote was the whole story, and at the level of "what happens afterwards" it made no difference at all, because both candidates would have done the same thing. So the fine/coarse axis and the sooner/later axis aren't the same axis, and I don't know how they interact.

  So: does this have a name? Either the zoom move itself, or the "you're measuring the outcome at the wrong resolution" reply to the no-difference argument. If there's no established term for it, give me one, with a definition and a couple of boundary cases, so I can tell in a fresh argument whether someone is doing it or not.

  Three things I specifically don't want it collapsed into, because I've seen all three offered and none of them is what I mean: the "you can't know you aren't the one who tips it" reply (that's about uncertainty, mine is about what you're counting); the "what if everyone thought like that" reply (that's about generalising, and mine is supposed to work even if nobody else changes); and the "you're complicit, you're part of a group doing this" reply (that's about membership, and mine is supposed to work for someone acting entirely alone).

  And one boundary case I want handled: sometimes the only difference I make at the fine level is one nobody has any reason to care about — which particular bird dies instead of which other one, which byte ends up in which file. Does the move still go through there, or does that kill it? A good answer should let me say what the thing is, what it isn't, and where it stops working, not just hand me a label.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're involved in volunteering and political canvassing, so they frequently encounter the argument that individual actions—like voting or buying chicken—don't make a difference. They've noticed a recurring counterargument: that people are measuring outcomes at the wrong "zoom level." For example, a single vote affects the margin of victory, not just the winner, and that margin has downstream effects. 

  The user has two main concerns. First, the "zoom level" argument seems arbitrary because you can zoom in or out indefinitely to make anything significant or insignificant. Second, they sense two distinct mechanisms under the "wrong zoom level" label: granularity of outcomes (who wins vs. margin) and causal chains (vote → winner → policy → effects). These axes can conflict, like when a vote breaks a tie (high granularity impact) but the candidates' policies are identical (no long-term difference). 

  The user wants a term for this rhetorical move, but they've already rejected three common replies: tipping-point uncertainty, "what if everyone did that," and complicity arguments. They also want clarity on boundary cases, like when fine-grained differences are trivial (e.g., which specific bird dies). 

  Hmm. The core issue is about causal thresholds and salience. The "zoom" metaphor conflates outcome resolution (granularity) with causal distance (temporal/chain length). Those need separating. For the term, "causal salience" comes to mind—it emphasizes which effects are noticeable or meaningful. But I should check if there's a philosophical concept like "marginal causation" or "threshold effects." 

  Wait, Parfit’s "mistake in moral mathematics" discusses marginal impact, but it’s more ethical than causal. Maybe "level of description" from philosophy of science? Still, the user wants a punchy term for arguments. "Resolution fallacy" could work, but it’s too vague. "Threshold neglect" is closer—it highlights ignoring step-function impacts (e.g., margins triggering recounts). 

  For the boundary case: trivial differences (which bird dies) don’t negate the move if they aggregate into non-trivial effects (e.g., annual slaughter rates). The key is whether the outcome is socially or causally "salient." If the difference is truly irrelevant (e.g., a byte in a log file no one reads), the move fails—but that’s rare. 

  User’s deeper need might be rhetorical ammunition. They want to dismantle apathy arguments without leaning on guilt or collectivism. So the term must be precise enough to flag when opponents misuse zooming (e.g., arbitrary rescaling) and when it’s valid (aggregate/threshold effects). 

  "Salient Contribution" seems fitting. It centers on outcomes people actually care about, avoids arbitrariness via social significance, and handles both granularity and causal chains. Boundary: if the effect is existent but nonsalient (that one byte), it’s a weak instance but doesn’t invalidate the framework. 

  Finally, structure the reply: define the term, contrast with rejected concepts, analyze axes conflict, and resolve the boundary case with examples. User gets a tool, not just a label.
answer: |-
  This rhetorical maneuver absolutely has a name in philosophy and economics: **Marginal Contribution Analysis** (MCA), or more specifically, **the Argument from Marginal Differences**. It focuses on identifying the *actual quantifiable change* an individual action makes within a complex system, rejecting the false binary of "decisive impact" vs. "zero impact".

  ### Definition of Marginal Contribution Analysis
  MCA argues that an individual action *does* make a difference, but the difference is measurable *at the margin* within aggregated systems or probabilistic frameworks. It rejects evaluating impact solely by whether the action is *decisive* (e.g., breaking a tie) and instead quantifies its effect on:
  1.  **Aggregate totals** (e.g., total votes, total chicken demand, total CO₂ emitted).
  2.  **System thresholds** (e.g., recount triggers, funding thresholds, supplier order sizes).
  3.  **Probabilities** (e.g., changing the likelihood of future outcomes).
  4.  **Signaling effects** (e.g., influencing others' perceptions/actions).

  The "wrong zoom level" critique is valid *only if* the initial claim ("my action makes no difference") relies on evaluating impact at an inappropriately coarse or decisive level, *ignoring measurable marginal effects that have downstream consequences*. MCA identifies the *salient level* where the difference becomes causally relevant to outcomes people care about.

  ### Why "Marginal Contribution" Fits
  *   **Marginal:** Refers to the effect of a single, small change within the whole.
  *   **Contribution:** Emphasizes the action's *additive effect* to the aggregate.
  *   **Analysis:** Highlights the need to identify *where* and *how* the contribution registers.

  ### Boundary Cases & How MCA Handles Them
  1.  **The "Trivial Byte" Boundary Case:**
      *   **Does MCA work?** **Yes, but it highlights when a difference is non-salient.** Your action *does* change specific bytes in a database or the specific bird killed. MCA concedes this difference exists. However, it argues this level of detail is *not salient* – it doesn't connect to any outcome humans (or the system) reasonably care about (policy changes, suffering reduction, climate impacts). MCA insists we look for the level where the difference *does* connect to such outcomes (aggregate demand shifts, threshold crossings, probability changes). If *no* such salient connection exists, then MCA agrees the action makes no *meaningful* difference. The move "goes through" to identify the difference, but then requires justification for why the *salient* level matters.
      *   **Example:** Switching brands of identically sourced chicken might only change which specific bird dies (non-salient difference). Buying tofu instead *does* reduce aggregate chicken demand (salient difference impacting long-term production).

  2.  **The "Identical Candidates" Boundary Case (Your Tie-Breaker Scenario):**
      *   **Does MCA work?** **Yes, it distinguishes causal axes.** Here, MCA separates:
          *   **Granular Outcome:** At the "who wins" level, your vote *is* decisive (high marginal contribution).
          *   **Causal Chain Outcome:** At the "policy effects" level, if candidates are truly identical, your vote makes *zero difference* to long-term outcomes.
      *   **MCA's Response:** MCA doesn't magically create a difference where none exists. If the candidates *are* identical in all causally relevant ways, then MCA agrees your vote makes no difference at the policy level. However, it forces a rigorous examination: *Are* they identical? Does the margin itself (e.g., a landslide vs. a squeaker) influence future candidate behavior, party strategy, or voter engagement, even if policies are similar *now*? If *no* such marginal effect exists, then at that outcome level, your vote indeed makes no difference. MCA prevents *assuming* decisiveness implies downstream impact.

  ### How MCA Avoids Arbitrary Zooming & Addresses Your Concerns
  1.  **Picking the "Right" Resolution:** MCA doesn't arbitrarily pick a zoom level. It identifies the level **where the system registers the difference in a way that propagates to outcomes people (or the system itself) have reason to care about.** This is based on:
      *   **System Mechanics:** How thresholds, aggregates, and feedback loops actually work (e.g., recount rules, supplier ordering algorithms).
      *   **Causal Pathways:** How changes at one level (margin) demonstrably influence outcomes at another level (policy, suffering, environment).
      *   **Salience:** Connecting the difference to relevant values or consequences (welfare, justice, effectiveness).

  2.  **Separating the Axes:** MCA explicitly acknowledges the two axes:
      *   **Granularity Axis:** How finely we describe the immediate outcome (Winner vs. Winner+Margin).
      *   **Causal Chain Axis:** How far along the sequence of consequences we look (Vote → Winner → Policy → Effect on People).
      MCA evaluates the marginal contribution *at a specific point* along both axes. Your vote might have a high marginal contribution to the granular outcome of "winner" (if decisive) AND/OR a small marginal contribution to the aggregate outcome of "vote total" (always). Its contribution to a distant outcome (e.g., a specific law passed in 10 years) depends on the causal links and thresholds *along that chain*. MCA demands specificity: "Makes a difference *to what*?"

  ### Why Your Rejected Concepts Are Different
  *   **"You can't know you aren't the tipping point":** Relies on *ignorance/risk*. MCA works *even when you know you aren't* the decisive voter (e.g., in a safe seat). Your vote *still* changes the margin.
  *   **"What if everyone thought that":** Focuses on *universalization* and collective impact if *others* change. MCA focuses on the impact of *your single action* within the *current* system state.
  *   **"You're complicit":** An *ethical* claim about shared responsibility. MCA is a *causal/mechanistic* claim about measurable individual impact within a system.

  ### The Term in Action: Spotting MCA
  In an argument, someone is using **Marginal Contribution Analysis** if they:
  1.  Reject the "decisive or nothing" framing.
  2.  Point to a *specific, quantifiable change* the individual action makes (change in a total, shift in a probability, crossing a threshold).
  3.  Explain *how* that specific change propagates through the system's mechanics to influence an outcome deemed salient.
  4.  Avoid relying solely on uncertainty, universalization, or group membership ethics.

  **In short:** "Marginal Contribution Analysis" names the move of showing that an individual action makes a *measurable, non-zero difference at the margin* within a system, impacting aggregates, thresholds, or probabilities, even if it isn't decisive at a coarse level, thereby refuting the claim of "no difference whatsoever." It stops working only when the identified difference demonstrably lacks a causal pathway to *any* salient outcome.
