  The accretion of history point is crucial. Like a long-undetected fake painting gaining provenance, Ripley's lived experience as Dickie blurs reality. Highsmith suggests performative identity becomes real through endurance, which complicates authenticity. But where does the analogy break? Impersonation violates personal autonomy and rights, unlike art forgery which targets cultural value. Ripley's murders starkly highlight this ethical line.

