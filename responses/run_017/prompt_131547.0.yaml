answer: |-
  ### Brainstorming: Candidate Concepts  
  *(Verbatim list with verdicts before refinement)*  

  1. **Endogenous Selection Bias**  
     - *Verdict:* Close but misaligned. Standard usage: sampling mechanism correlated with the outcome (e.g., surveying only survivors). Here, the *reference class itself* (denominator) is dynamically altered by the process. Too narrow for frame reshaping. **Discard.**  

  2. **Reference Class Problem** (Reichenbach/Venn)  
     - *Verdict:* Adjacent but distinct. Concerns ambiguity in choosing a class for probability attribution (e.g., "What’s the probability this smoker gets cancer?" depends on whether we partition by age or genetics). Not about causal feedback loops. **Discard.**  

  3. **Constitutive Interaction** (Measurement Theory)  
     - *Verdict:* Promising but incomplete. Describes when measurement alters the system (e.g., observer effect in quantum mechanics). Here, the *denominator* is altered by the phenomenon *independently* of measurement. **Retain for parts.**  

  4. **Dynamic Denominator Effect** (Coined ad hoc)  
     - *Verdict:* Descriptive but vague. Captures denominator fluidity but lacks theoretical roots. **Tentative keep for clarity.**  

  5. **Indexical Coupling**  
     - *Verdict:* Neologism. Highlights binding between index and process. Risks confusion with linguistics. **Keep for precision.**  

  6. **Ecological Reference Drift**  
     - *Verdict:* Overlaps with ecological fallacy but emphasizes frame instability. Misleading if "ecological" implies fixed spatial units. **Discard.**  

  7. **Endogenous Frame Problem**  
     - *Verdict:* Best fit so far. Stresses causal dependence of the counting frame on the process. Not established but parsimonious. **Retain.**  

  ---

  ### Evaluation Table  
  | Concept              | What It Gets Right                               | Where It Diverges                                | Keep/Discard |  
  |----------------------|-------------------------------------------------|-------------------------------------------------|--------------|  
  | **Endogenous Selection Bias** | Sampling bias tied to outcome. | Assumes a pre-existing population; doesn’t cover frame *transformation*. | Discard |  
  | **Reference Class Problem** | Ambiguity in denominator choice. | Static: no causal feedback. Ignores denominator being *shaped* by the process. | Discard |  
  | **Constitutive Interaction** | Measurement alters the system. | Here, system alters denominator *before* measurement; no observer intent. | Discard (but borrow "constitutive") |  
  | **Endogenous Frame Problem** | Denom. is causally dependent on the process. | Perfectly matches both your cases. No established term, but components are recognized. | **Keep** |  
  | **Indexical Coupling** | Index and quantity are interdependent. | Avoids "bias" language; emphasizes structural flaw. Needs definition. | **Keep** |  

  ---

  ### Answers to Your Questions  

  **1. Is there an established concept?**  
  No. The closest existing ideas are **endogenous selection bias** (econometrics) and **constitutive measurement** (philosophy), but both miss the mark. Endogenous selection assumes a fixed population; constitutive interaction centers on measurement-distortion feedback. Your cases involve the *denominator* being *causally reconstituted* by the phenomenon itself—distinct from sampling or observer effects. The **endogenous frame problem** captures this best, but it’s not standardized. For the specific failure where the index moves oppositely to the quantity, no term exists—**decoupled indexing** could work.  

  **2. Is there a fact of the matter about violence declining?**  
  **Yes, but only contingently.**  
  - **The empirical core**: Once the frame is fixed (e.g., "deaths in territorial Europe, 1800–2000"), trends *within* it are factual. We can resolve whether violence decreased *under that description* with better data (e.g., archival records).  
  - **The verbal/normative part**: Choosing the frame is not purely empirical. Your prehistoric case involves defining "population at risk" from burials—a conceptual choice about what counts as "the group" when practices change. Your state-system case involves normative judgments: does violence "count" if outsourced to colonies? This isn’t disagreement about *numbers* but about **which collective "we" refers to** and **what constitutes violence-in-our-name**.  
  - **What remains genuinely empirical**: Given agreed-upon definitions (e.g., "violence = intentional physical harm," "frame = current UN member states"), we can measure trends. But the debate’s heat comes from frames smuggling in moral claims (e.g., "our peace" ignoring drone strikes abroad).  

  ---

  ### Coined Concept: **Metric Entanglement**  
  **Definition**:  
  A measurement flaw where the denominator (reference class, counting frame, or population at risk) is causally influenced by the phenomenon being indexed, decoupling the index (ratio, rate, or proportion) from the target quantity. This allows the index to trend oppositely to, or at divergent rates from, the underlying reality—undetectable by refining numerator/denominator measurements alone.  

  **Contrast Case** (No entanglement):  
  - Measuring urban crime rates using police reports. Flaws exist (underreporting), but the denominator (city population) is stable and independent of crime rates.  

  **Boundary Cases**:  
  - **Should Count**: Prehistoric violence rates from skeletal remains. Burial practices (denominator) co-evolve with violence (e.g., mass graves during wars inflate visible "population" while hiding individual trauma).  
  - **Should Not Count**: GDP per capita during inflation. Money’s value (denominator) erodes, but this is exogenous to production (numerator); adjustments (e.g., real GDP) resolve it.  

  **Why this works**:  
  - "Metric" centers on measurement indices.  
  - "Entanglement" stresses bidirectional causality (process ↔ frame).  
  - Fits both your fisheries cases (effort shaping stock visibility) and violence cases (violence shaping who counts as "in" the population).  

  ---  
  *In sum: Your instinct is profound. The violence debate suffers from **metric entanglement**—not just contested definitions. The factual core exists *within* frames, but frame-choice is where politics lives. Philosophers owe you for this framing.*
