answer: |-
  **(The philosophy department lounge, coffee-stained tables, late afternoon. You and Marta lean forward, voices frayed but minds still sharp.)**

  **You:** Okay, Marta, slow down. You’re saying that because we’re assessing *principles* governing *types* of situations over a lifetime, the expected number of times someone gets hit with the bad outcome matters? So instead of comparing *this* finger-loss to *this* billion rashes, we compare the lifetime risk *to any single person* under principle A vs. principle B?

  **Marta:** Exactly. Contractualism asks if a principle could be reasonably rejected *by anyone*. For ‘Always spare the finger’, the complaint comes from *anyone* who, over their life, might face the prospect of being one of the many saddled with the rash *repeatedly*. The complaint isn't "I got a rash *this time*," it's "Under this principle, over my life, I bear a non-trivial risk *and likely actual burden* of enduring this minor harm multiple times, when an alternative principle (always spare the rashes) would expose me to a vanishingly small risk of a severe harm."

  **You:** And that’s not aggregation? You just summed K times (m/N) and said it’s significant! You’re calculating *expected disutility per person over a lifetime*. That’s utilitarianism wearing contractualist pajamas. What happened to "no summing across persons"? You’re summing across *events* for a single person!

  **Marta:** No! The *complaint* is still individual. It’s lodged *by one person* about the *expected frequency and burden imposed on them specifically* by the principle. Person X rejects Principle A because Principle A, consistently applied over their life, means they will likely suffer the rash say, ten times. Person X compares this to Principle B, under which their risk of losing a finger is 1 in a billion. *Person X* finds the expected burden under A worse *for them* than the expected burden under B *for them*. The comparison of burdens happens entirely *within* the potential complaint of each individual. No interpersonal sum.

  **You:** But that ‘expected burden for them’ *is* an aggregation! It’s aggregating the disvalue of multiple minor harms *for that person* over time. You’re allowing temporal aggregation within a life but screaming bloody murder at spatial aggregation across lives. Arbitrary! And crucially, the person who *actually* loses the finger under Principle B – the one in a billion – their complaint is devastating: "I lost my finger! Under the other principle, I’d only have had a few rashes!" Your ex ante expectation is cold comfort to them *ex post*. Contractualism cares about *actual* complaints against principles, not probabilistic ones, right? The actual finger-loser has the strongest complaint imaginable against Principle B.

  **Marta:** The *reasonableness* of rejection *is* assessed ex ante, from the position of considering the principle *before* knowing your specific place in the lottery of life. You ask: "Could I reasonably reject this principle, knowing it imposes *this pattern* of risks and burdens on people like me (or anyone)?" The person who loses the finger *ex post* has terrible luck, but their complaint isn't automatically reasonable *against the principle itself*. The principle didn't *target* them; it created a miniscule, equal risk for everyone. The complaint against Principle B ("always spare the rashes") comes from the perspective of asking *beforehand* if a principle exposing you to a tiny risk of catastrophic loss is worse than one exposing you to a near-certainty of minor, repeated annoyances. Many would reasonably prefer the tiny catastrophic risk over the guaranteed minor nuisances, making Principle B rejectable. The *ex post* loser's anguish is tragic, but it doesn't make the *principle* reasonably rejectable *in advance* by *everyone*.

  **You:** Okay, let’s test this on the one-shot case. No recurrence. Just this once: Save Bob's finger, or spare two million identifiable people an itchy rash this afternoon. No lifetime, no repetition. On your principle-assessment view, what do we do? The principle "In one-shot cases like this, always spare the finger" seems only rejectable by... well, nobody has a stronger complaint than Bob losing his finger. The rash sufferers have trivial complaints individually. So Bob gets saved. Adding more rash sufferers doesn’t change that. But that’s insane! A trillion rashes? Your repeat-play move vanishes here. How does contractualism avoid endorsing saving the finger over preventing a global pandemic of mild discomfort?

  **Marta:** Fair point, the one-shot case is the hard edge. My move *does* rely on recurrence to generate the significant individual burden. For a pure one-shot, contractualism *might* bite the bullet: no individual rash-sufferer has a complaint strong enough to outweigh Bob’s loss. The strongest individual complaint *is* Bob’s. Adding more sufferers doesn’t create a *stronger individual complaint*, just more weak ones. Contractualism might say saving Bob is permissible, maybe even required. The intuition that it’s wrong *is* the aggregative intuition contractualism rejects. That *is* the bullet.

  **You:** But that *is* a reductio! It means contractualism is fundamentally incapable of capturing the moral significance of numbers in isolated, large-scale harms. It collapses into a form of threshold deontology where tiny harms *never* add up, no matter how many. That’s a huge cost.

  **Marta:** Perhaps. But maybe the ‘one-shot’ case is rarer than we think, or maybe principles governing emergencies inherently imply potential recurrence. More importantly, *your* challenge: if you reject my repeat-play move as illegitimate aggregation-lite, and contractualism rejects direct aggregation, *what non-utilitarian route is left* to make numbers count? How *do* you justify saving the million from papercuts over saving one from torture *without* summing or expecting?

  **You:** (Sighs, rubs temples) Okay, concession: maybe adding zeros *doesn’t* infinitely amplify the wrongness the way crude utilitarianism suggests. Maybe there *is* a point where the minor harm is *so* minor and dispersed that no individual complaint gets traction against the severe one, even with huge numbers. That intuition *might* have some force. Maybe contractualism highlights a limit to aggregation we shouldn’t ignore – the moral residue of the individual facing catastrophe. So, fine, adding a billionth rash doesn't feel *exponentially* worse than adding the first million. The *shape* might be different. That costs my side something.

  **Marta:** Thank you. And I’ll concede this: the ‘same kind of situation’ point you flagged is critical and messy. What counts as ‘recurrence’? Pooling over all minor inconveniences? Only medically identical rashes? Broaden it too much, and my move *does* risk collapsing into generic expected utility – everyone complains about their *overall* expected burden of *all* minor harms under a principle. Narrow it too much, and the recurrence needed to generate a significant individual burden never happens. Finding a non-arbitrary, principled way to define the relevant ‘type’ of situation for pooling is a serious challenge. It might not be fully solved. That costs *my* side.

  **You:** Let’s test one variation before we collapse. Suppose the one person who might lose the finger is already fantastically wealthy and happy, while the two million are desperately poor and this itchy rash is a genuine, significant added misery in their already miserable lives. Or, flip it: suppose the ‘itchy rash’ is *so* trivial – a single mosquito bite, barely noticeable. Does that change things on your view?

  **Marta:** Within the *repeat-play* framework, yes, absolutely. The *magnitude* of the minor harm per instance matters crucially to the *individual’s* complaint about the expected lifetime burden. If the rash is genuinely debilitating for the poor, the complaint against "always spare the finger" becomes much stronger for each poor person – their expected burden is *much* heavier. If it's a trivial mosquito bite, the complaint weakens significantly; enduring a few dozen mosquito bites over a lifetime might not be a reasonable basis to reject a principle that otherwise avoids catastrophic losses. The *relative positions* matter because they affect the *strength of the complaint lodged by the individual bearing the burden*. It’s not about summing welfare, but about how bad *this specific burden* is *for the person experiencing it*, compounded by frequency.

  **You:** But in the one-shot case with inequality? Poor identifiable millions suffer significant rash vs. saving rich Bob's finger?

  **Marta:** (Grimaces) Then we’re back to the one-shot problem. Bob’s complaint about losing his finger might still be stronger *as an individual complaint* than any single poor person's complaint about their significant rash, however sympathetic. Contractualism struggles to directly convert the *number* of significant-but-lesser harms into a reason against saving the one severe harm. The inequality might make Bob's complaint *less sympathetic*, but it doesn't necessarily make it *weaker* in the strict comparative sense. Again, the bullet.

  **You:** And that’s where we hit the wall. You’ve got a clever move for recurring cases that *feels* less aggregative, but relies on a fuzzy notion of 'same kind' and evaporates in the one-shot. I’ve got the strong intuition that numbers *must* count directly sometimes, but no clean non-utilitarian way to make it work within the individualist constraint, and I concede the ‘adding zeros’ point isn’t as clear-cut as I thought.

  **Marta:** And I concede the one-shot case remains contractualism’s Achilles' heel on aggregation, and the ‘type of situation’ problem is a lurking beast. We both paid.

  **You:** (Stands up, stretches) Truce? My brain is mush. Same time next week? Bring more coffee. Stronger coffee.

  **Marta:** (Manages a tired smile) Deal. And maybe aspirin. Definitely aspirin.
