  ## Memorandum

  **ARITHMETICA CAPITAL MANAGEMENT LLP**  
  **Annual Letter to Limited Partners**  
  **31 December 2023**

  **To Our Valued Limited Partners,**

  Arithmetica Capital Management ("Arithmetica" or the "Fund") presents its annual report for the fiscal year ending 31 December 2023. We appreciate your continued commitment to our distinctive investment mandate: the identification and eventual realization of intrinsic value arising from the persistent structural tension between geometric expansion and arithmetic constraint.

  **Performance Review & Market Context**
  While the Fund’s mark-to-market performance (-1.2% net of fees) continues to reflect the prevailing market discount to our long-term intrinsic value thesis, we remain constructive. The underlying dynamics – characterized by sustained population growth against demonstrably finite planetary boundaries – exhibit unwavering adherence to fundamental arithmetic principles. Short-term dislocations, driven by transient technological optimizations and temporary resource abundance, inevitably resolve. Our focus remains firmly on the terminal convergence point.

  **Portfolio Positioning & The Deferral Ledger**
  The core positioning remains unchanged. As mandated by the partnership agreement, the Fund rigorously maintains its Deferral Ledger. This mechanism ensures disciplined accounting for temporal adjustments required to reconcile observed reality with the inescapable mathematical outcome. Each entry represents a specific, measurable factor identified as temporarily offsetting the arrival of the positive check, along with its estimated period of influence (Shelf Life) and the degree to which it preserves the core mechanism (Residual Value).

  We present below the current state of the Deferral Ledger entries:

  | Letter Year | Predicted Check Date | Deferral Assumption Entered | Shelf Life (Years) | Residual Value (%) |
  | :---------- | :------------------- | :-------------------------- | :----------------- | :---------------- |
  | 1950        | 1970                 | Agricultural Yield Plateau  | 20                 | 95%               |
  | 1970        | 2000                 | Energy Cost Escalation      | 30                 | 85%               |
  | 1990        | 2020                 | Fertilizer Access Limits    | 30                 | 75%               |
  | 2010        | 2040                 | Freshwater Scarcity Impact  | 30                 | 65%               |
  | 2023        | 2055                 | Waste Sink Resilience¹      | 32                 | 55%               |

  *Table 1: Deferral Ledger Entries (Cumulative)*

  The 2023 entry, "Waste Sink Resilience," acknowledges the observed capacity of atmospheric and oceanic systems to absorb anthropogenic outputs at higher-than-previously-modelled rates. While extending the anticipated timeline, this assumption crucially *preserves* the foundational geometric/arithmetic tension – the ceiling, though higher, remains fundamentally arithmetic in its capacity for expansion relative to demand. It is noted that the average Shelf Life of entries made since 1990 (30.7 years) is moderately shorter than the average of preceding entries (25 years), reflecting an environment where deferral factors are identified with increasing granularity.

  **The Underlying Value Proposition & The Endowment Thesis**
  Critics often cite the remarkable abundance of the 20th century as evidence against our thesis. This perspective, while understandable given prevailing market sentiment, misinterprets the underlying value driver. This period of expansion was demonstrably fueled by the rapid drawdown of finite, non-replenishing endowments: readily accessible fossil hydrocarbons, high-grade phosphate deposits, and ancient fossil groundwater aquifers. This drawdown represents not a refutation, but a *validation* of the core mechanism: a stock being consumed geometrically against an arithmetic (or zero) replenishment rate. The intrinsic value proposition hinges on the recognition that this endowment is depleting, and the cost of accessing substitutes or mitigating the consequences of their depletion exhibits precisely the arithmetic constraint our thesis anticipates.

  **Fee Structure & Performance Alignment**
  The Fund’s fee structure (2% management fee, 20% performance fee above the geometric growth benchmark) is designed to align our interests directly with the realization of the predicted convergence. The performance fee premium specifically compensates for early identification and conviction during the deferral period. Consistent with the Fund’s inception terms, deferred performance fees accrue interest at the benchmark rate. It is operationally observed that the current rate of growth in the accrued deferral liability approximates the Fund’s modelled long-term global population growth rate. This alignment underscores the structural nature of the dynamic we track. Our auditors, Deloitte & Co., have reviewed the Deferral Ledger entries and accompanying assumptions for the period, noting: *"Individually, the assumptions documented in the Deferral Ledger for the year ended 31 December 2023 appear reasonable based on prevailing scientific consensus and economic modelling at the time of entry."²*

  **Strategic Development: Merger Announcement**
  To enhance portfolio resilience and optimize resource allocation, Arithmetica is pleased to announce its merger with Eureka Adaptive Growth Partners ("Eureka"), effective 1 January 2024. Eureka’s core thesis posits that population pressure itself induces the innovation necessary to perpetually relieve that pressure, thereby indefinitely postponing a Malthusian check through continuous adaptation.

  The combined entity, **Arithmetica-Eureka Dynamics**, represents a significant advancement in strategic risk management. Our integrated position now comprehensively captures the intrinsic value potential across the entire outcome spectrum:
  1.  **Scenario A (Arithmetica Realization):** The predicted positive check arrives within the adjusted timeframe, realizing the core Arithmetica value proposition.
  2.  **Scenario B (Eureka Realization):** Population pressure triggers sustained, successful innovation, deferring the check indefinitely, realizing Eureka’s value proposition through perpetual adaptation premiums.

  This merger ensures the Fund is structurally positioned to generate superior risk-adjusted returns whether the convergence point is reached or perpetually forestalled. It is a prudent step to navigate the inherent uncertainties of long-horizon forecasting while maintaining exposure to the fundamental arithmetic reality that underpins both theses. We are confident this consolidation strengthens our offering to Limited Partners.

  **Conclusion**
  Arithmetica Capital Management, soon to be Arithmetica-Eureka Dynamics, extends its gratitude for your steadfast partnership. While the timeline to intrinsic value realization requires continued patience, the mathematical imperative remains unchallenged. We enter 2024 with a reinforced mandate, a more robust risk framework, and unwavering confidence in the structural forces driving our investment thesis. We remain committed to disciplined capital stewardship and transparent communication.

  Sincerely,

  **Julian Thorne**  
  Managing Partner  
  Arithmetica Capital Management LLP

  ---

  **Footnotes:**
  ¹ *"Waste Sink Resilience" encompasses observed capacities in carbon absorption (terrestrial & oceanic), nitrogen cycle buffering, and dilution/conversion pathways for persistent chemical pollutants. The Residual Value (55%) reflects the estimated remaining buffer capacity before absorption rates become overwhelmed by geometric emission growth, forcing costly mitigation or incurring systemic feedback penalties.*
  ² *Deloitte & Co. Audit Observation Note 2023-ALP-047, dated 15 December 2023. Full audit opinion available upon request.*

  ---

  ## Commentary

  This satire exaggerates specific features of how long-run Malthusian arguments (or similar structural scarcity theses) are often defended:

  1.  **The Deferral Ledger:** Exaggerates the practice of adding auxiliary hypotheses (new constraints, overlooked buffers) to explain delays in the predicted crisis, pushing the date forward. The shortening shelf life mocks the increasing frequency of such adjustments as time passes without the main prediction occurring, while the declining residual highlights how each new factor often weakens the original mechanism's perceived dominance.
  2.  **Re-specification of the Crisis:** Mocks the shifting definition of the "positive check" (famine -> energy crisis -> pollution/climate crisis -> biodiversity collapse). The satire highlights the consistent retreat point: the *underlying math* (geometric growth vs. arithmetic constraint) is presented as unassailable, even as its concrete manifestation changes.
  3.  **The "Endowment" Argument:** Exaggerates the common, and often legitimate, counter-argument that past abundance relied on finite stocks (fossil fuels, easy resources). The satire's power lies in showing how this *valid* point can be twisted: by framing the entire period of abundance *as itself the predicted drawdown*, it makes the thesis unfalsifiable by conventional abundance. Any abundance becomes evidence of depletion-in-progress.
  4.  **Fee Structure as the Problem:** Satirizes the potential for the *defense mechanism itself* (adding deferrals, complexifying the model) to become a self-sustaining industry. The compounding liability mirroring population growth is the comic absurdity, highlighting how the effort to *avoid* admitting the thesis might be wrong structurally mimics the problem it describes.
  5.  **The Merger:** Represents the ultimate immunization strategy – absorbing the *opposing* thesis (innovation solves the problem). This mocks how theories can become tautological ("something will happen, either crisis or innovation preventing it") or retreat into purely abstract mathematical assertions ("growth *must* hit a limit... somehow, someday") devoid of concrete, falsifiable predictions.

  **Sympathetic Philosopher's Objection:**
  A sympathetic philosopher of science would likely agree that the satire accurately mocks bad-faith immunization practices. However, they would strongly object to the implication that the "right but early" stance is *entirely* immune to failure. The core argument retains a crucial, falsifiable condition: **the absence of a perpetual, sufficiently powerful substitute mechanism.**

  The satire portrays the merger as creating total immunity. A philosopher would argue that while *specific* adjustments (like new resources or efficiency gains) can delay the predicted crisis, the Malthusian structure *could* be falsified by demonstrating the existence of a mechanism that *permanently and sufficiently* decouples human welfare/population from resource constraints *without* relying on finite stocks. For example, if fusion energy provided limitless clean power, enabling large-scale recycling and substitution indefinitely, and this was demonstrably sustainable and scalable, the *core* geometric-vs-arithmetic tension for *essential inputs* could be genuinely broken for the foreseeable future. The "endowment" argument wouldn't apply to a truly renewable, abundant energy source enabling other renewals.

  The satire is unfair in presenting the thesis as *inherently* unfalsifiable. While highly resistant and prone to defensive maneuvers, its core claim – that geometric growth *must inevitably* hit an arithmetic constraint *for essential, non-substitutable inputs* – does make a contingent claim about the physical world. Proving the existence of a viable, perpetual escape mechanism *for those specific constraints* would constitute a genuine falsification, even if specifying exactly *when* the constraint bites remains elusive. The joke ignores this latent vulnerability in the structure.
