prompt: |-
  Hi. I'm 71 and retired — I spent my career in electrophysiology, mostly single-channel recording, and about a year ago I joined a philosophy reading group at the local library. Take the role of a professional philosopher who has also spent time around real experiments, ideally someone who has worked with the people who test how ordinary subjects actually reason about cases. Before you answer, brainstorm: jot down six to ten candidate concepts from philosophy, psychology, law or rhetoric that might cover what I describe below, then cross out the ones that don't fit and say why each fails. Take your time with it.

  Here's the pattern I keep running into. A philosophical case is set up to isolate one difference — five people die versus one, or psychological continuity with versus without material continuity. The author tells you explicitly which features are supposed to be doing the work and which are decoration. But then you change only the decoration and the verdict moves. Three examples from what we've read:

  One. A vehicle is out of control on a track and will kill five people; you can throw a lever that sends it onto a side track where it kills one. Nearly everyone in the room says throw it. Then: same vehicle, same five, but the only way to stop it is to shove a heavyset stranger off a footbridge into its path, where his body stops it and he dies. Most of the room says no. Our group leader said the difference between those two is where the interesting work is. What I noticed: when I read the footbridge version first and the lever version second, two people who had said no to the footbridge said yes — and when I rewrote the footbridge case in flat language ("you stop the vehicle by increasing the mass on the track by means of a human body, which kills that person") instead of the hands-on, shoving-a-man-to-his-death wording, support for it went up as well.

  Two. A machine records the exact state of your body, your body is then destroyed, and a perfect replica is built on Mars out of new matter; did you survive? About half of us said no. Then the same process described as: you go to sleep, and you wake up on Mars in a body that is not the same matter but is psychologically continuous with you — and several of the same people said yes. Nothing changed except words like "destroyed", "replica" and "new matter", and the person who wrote it insists material continuity is not what matters.

  Three. A case about sending money to save a child: when the child has a name, a photo and a village, people answer differently than when it is "one of ten thousand children will die". Our leader said psychologists already have a name for that one, something like the identifiable victim effect — which makes me suspect cases one and two are just that same effect and there's nothing specially philosophical going on. But I'm not convinced, because in one and two the detail doing the work is a detail the argument itself instructs you to disregard.

  So: is there an established concept for this — a case whose persuasive force is supplied by a feature that the case's own framing declares irrelevant? A friend gave me the phrase "intuition pump"; if that's the answer, I want to know whether my phenomenon is the whole of that word or one specific failure mode of it. If nothing established fits, coin a term and define it properly, and give me the edges: one clear instance and one near miss that looks like it but isn't. I've provisionally been calling it a sealed confound, a confound the case tells you to hold fixed. I recieved a couple of nudges toward rhetorical notions like loaded questions and persuasive definitions, so tell me if those cover it or if they're something else entirely.

  Two more things. First, I want a test, not just a label: some procedure like a control condition or a blind that I could run on a case in a paper to find out whether its verdict really does depend on the avowed-irrelevant detail — bearing in mind my subject pool is me and about six retirees, and I can't randomize or blind anything properly. And tell me honestly whether my lab analogy is any good: no controls, no blinding, something like experimenter expectancy, the instrument's zero drifting with what the operator hopes to see. Where does it break? In a real experiment you can separate the person running it from the person being measured; here they're the same person.

  Second, and this is the part I care about: commit. Give me a definite position on which of my three examples genuinely has the artifact and which don't — if you think I've bundled two or three different things together, say which is which and why, and pick the one that best fits the concept you're offering. Tell me how confident you are, in plain terms, and say what would change your mind. Don't give me a balanced menu of options with the choice left to me, and don't point me at a reading list — our library has no journal access, so anything I can't reconstruct from the argument itself is useless to me. Oh, and if you think one of my three examples is definately fine and I'm reading an artifact into it that isn't there, say so directly.
reasoning: |-
  Okay, let me approach this systematically. The user presents an intriguing pattern where philosophical thought experiments seem sensitive to supposedly irrelevant details. As someone with a neuroscience background now exploring philosophy, they're noticing how framing affects intuitions - and they want precise conceptual tools to analyze this.

  First, I need to brainstorm potential concepts that might explain this phenomenon. The key elements are: 
  - Cases designed to isolate one variable
  - Explicit declaration of what's relevant
  - Verdict changes when "decorative" features are altered
  - Effect persists even when participants know the framing is biasing them

  Candidate concepts spring to mind:
  1. Intuition pump (Dennett's term for thought experiments that steer conclusions)
  2. Framing effect (psychology: identical options presented differently)
  3. Identifiable victim effect (psychology: named vs. statistical victims)
  4. Affective framing (emotion-laden language altering perception)
  5. Narrative transportation (rhetoric: immersion in story overriding logic)
  6. Salience bias (cognitive: prominent features overweighted)
  7. Experimental demand characteristics (psychology: subjects guessing "purpose")
  8. Conceptual competence illusion (philosophy: overestimating ability to isolate variables)

  Now I'll eliminate misfits:
  - Identifiable victim effect fits example 3 but not 1/2 where no identification occurs
  - Experimental demand characteristics don't apply as the bias persists despite awareness
  - Conceptual competence illusion is close but doesn't address language manipulation

  The strongest candidates are intuition pump (broad category), framing effect (specific mechanism), and affective framing (subtype). The user's "sealed confound" metaphor is apt - it's like an experimental confounder that the design claims to control but actually leaks through.

  For their test protocol: since proper controls aren't feasible with their retiree group, I suggest systematic rewrites. For any case, create: 
  - A "bare" version stripped of vivid language 
  - An "inverse" version with emotional language swapped 
  - Test versions on different days to minimize carryover

  Their lab analogy holds surprisingly well. The main breakpoint is introspection's unreliability - unlike electrodes, we can't directly observe our own judgment mechanisms. But their method of varying presentation order and wording is fundamentally sound experimental design.

  Finally, committing to analysis of their examples:
  1. Trolley problem: Clear framing effect (lever=mechanical, footbridge=personal). Confidence: high. 
  2. Teleportation: Affective framing ("destroyed" vs "waking up"). Confidence: medium - some genuine philosophical disagreement may remain. 
  3. Charity case: Pure identifiable victim effect. Confidence: very high.

  The core phenomenon across all three is that declared-irrelevant features persistently influence judgments despite explicit instructions to ignore them. This suggests philosophical intuition may be less modular than presumed - emotional and narrative systems intrude where pure reason is supposed to operate.
answer: |-
  ### Step 1: Brainstorming Candidate Concepts  
  Here's my initial list with eliminations:  

  1. **Intuition pump** (Dennett): *KEEP* – Fits as a broad category for thought experiments designed to elicit intuitions, but doesn’t specify *why* framing matters.  
  2. **Framing effect** (Tversky/Kahneman): *KEEP* – Core psychological mechanism where identical scenarios framed differently yield different judgments. Directly applies to all three examples.  
  3. **Identifiable victim effect** (psychology): *KEEP for Example 3* – But *CROSS OUT* for 1/2: No "victim identification" in trolley/teleportation cases.  
  4. **Affective framing** (Slovic): *KEEP* – Subtype of framing: Emotional language ("shove," "destroyed") triggers heuristic processing.  
  5. **Narrative transportation** (Gerrig/Green): *CROSS OUT* – Involves immersion in stories, but your cases lack plot arcs; simpler rewording suffices to shift verdicts.  
  6. **Salience bias** (cognitive psychology): *KEEP* – "Decoration" makes certain features (e.g., personal force) perceptually dominant despite irrelevance.  
  7. **Experimental demand characteristics** (Orne): *CROSS OUT* – Not about subjects guessing the "right" answer; your group knows it’s irrelevant but still can’t ignore it.  
  8. **Conceptual competence illusion** (philosophy): *KEEP* – Assumption that we can isolate variables via thought experiments when cognition doesn’t operate that way.  

  **Final Concepts**: **Intuition pump** (umbrella), **framing effect** (mechanism), **affective framing** (subtype), **salience bias**, **conceptual competence illusion**.  

  ---  

  ### Your Core Phenomenon: The "Sealed Leak"  
  **Term**: **Sealed Leak** (building on your "sealed confound").  
  **Definition**: *A feature in a thought experiment that is declared irrelevant by the case’s own logic but surreptitiously drives intuitive judgments due to affective/salient framing, creating a persistent cognitive leak.*  
  - **Why "leak"?**: It implies an uncontrolled seepage of bias despite attempts to seal the confound.  
  - **Key edge**: The case *explicitly instructs* you to ignore the feature (unlike standard framing effects).  

  **Clear Instance**: Your trolley case – "Shoving" vs. "increasing mass" language. The case says personal force is irrelevant, yet it leaks in.  
  **Near Miss**: A standard identifiable victim effect (your charity case). No feature is declared irrelevant; it’s purely statistical vs. personal framing.  

  **Vs. Rhetorical Concepts**:  
  - **Loaded questions** presuppose contested claims (e.g., "Have you stopped lying?"). Your cases don’t presuppose; they declare irrelevance.  
  - **Persuasive definitions** redefine terms to favor an argument. Not applicable here.  

  ---  

  ### Your Test Protocol: The "Frame-Swap"  
  Given your constraints (no randomization, small group):  
  1. **Isolate the "decoration"**: Identify the avowed-irrelevant feature (e.g., "shoving," "destroyed").  
  2. **Create three versions**:  
     - **V1**: Original vivid framing (e.g., "shove the stranger").  
     - **V2**: Neutral framing (e.g., "divert using a body").  
     - **V3**: Inverse framing (e.g., for teleportation: "you awake refreshed on Mars").  
  3. **Test iteratively**: Present versions *weeks apart* to avoid carryover. Track individual verdict changes.  
  4. **Control**: Have members rewrite the case *themselves* in neutral terms, then re-vote. If verdicts shift, the leak is confirmed.  

  **Lab Analogy Critique**:  
  - **Strengths**: You’re varying the independent variable (framing) and measuring outcomes. Self-experimentation is valid for phenomenology.  
  - **Breakage**: No separation between experimenter/subject → **confirmation bias** risks. You might (unconsciously) write neutral versions poorly.  
  - **Mitigation**: Have another member write the neutral version blind to your hypothesis.  

  ---  

  ### Committed Analysis of Your Examples  
  **Trolley Case (1)**:  
  - **Verdict**: Strong "sealed leak." Affective framing ("shoving") makes personal force salient *despite* the case insisting it’s irrelevant.  
  - **Confidence**: **90%**. Shifting language alters verdicts; identical mechanics treated differently.  
  - **What would change my mind**: If neutral framing *eliminated* the footbridge/lever disparity.  

  **Teleportation (2)**:  
  - **Verdict**: Partial leak, but genuine philosophical disagreement exists. "Destroyed" primes loss aversion, but "wake up" primes continuity.  
  - **Confidence**: **70%**. Framing amplifies latent intuitions; materialists might still say "no" in neutral framing.  
  - **What would change my mind**: If all subjects switched to "yes" in V3 ("awake refreshed").  

  **Charity Case (3)**:  
  - **Verdict**: **Not a sealed leak**. Pure identifiable victim effect. No feature is declared irrelevant; it’s a standard statistical vs. narrative framing.  
  - **Confidence**: **95%**. Psychologists have replicated this ad nauseam.  

  **Why They’re Distinct**:  
  - Example 1 is a **procedural leak** (how action is performed).  
  - Example 2 is a **semantic leak** (words evoking concepts like "death").  
  - Example 3 is a **scope insensitivity** (psychology), not a leak.  

  **Best Fit for "Sealed Leak"**: **Trolley case (1)** – The gap between declared logic and intuitive response is widest.  

  ---  

  ### Bottom Line  
  You’ve hit on a deep flaw in armchair philosophy: thought experiments assume cognitive control we don’t possess. **Affective framing and salience bias are the engines; "sealed leaks" are the exhaust**. Your "frame-swap" test is a pragmatic way to expose this. For your group: Focus on rewriting cases together. When verdicts flip under neutral framing, you’ve caught the leak.  

  > *"Thought experiments are windows smudged by the philosopher’s breath. Your job is to wipe the glass."*
