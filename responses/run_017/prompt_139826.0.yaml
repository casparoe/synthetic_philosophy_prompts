  The user has laid out specific conditions for assessing T: T is correct if stopping the regress requires considerations about rule-following ("going on"), and incorrect if it can be resolved purely at the level of a single inference. They want a credence in T as a single number but care more about how it decomposes into probabilities for key sub-questions. 

  I need to evaluate several probabilities: whether the Tortoise's position is intelligible (if not, the regress might be a pseudo-problem); whether meaning-constitutive claims about logical constants are true (that grasping conditionals involves inferential dispositions); whether that would stop the regress; whether a distinct regress appears even with mastery; whether any solution must invoke non-propositional elements; and other relevant terms. Then I need to combine these, noting dependencies.

  The user also introduces a "Serial Tortoise" variant where the Tortoise performs the inference but refuses projection to future cases, asking if this is the same regress. They want probabilities for four responses silencing this variant: rules aren't truth-apt; understanding equals dispositions; pragmatic vindication; or the demand being defective.

  For the decomposition of T:
  - P(Tortoise intelligible): 0.9. The position seems coherent as a challenge about rule-binding, not confusion.
  - P(Meaning-constitutive true): 0.6. Plausible but debated; dispositions might not fully constitute meaning.
  - P(Regress stopped | meaning-constitutive): 0.3. Mastery doesn't prevent the "going on" problem.
  - P(Distinct regress): 0.8. Rule application faces a similar regress.
  - P(Non-propositional required): 0.85. Premises alone can't bind future application.
  - Added P(No local justification): 0.7. Single inferences can't self-justify projection.

  Combining these, with dependencies: P(T) = P(intelligible) * [P(no local justification) * P(non-prop required) + ...] ≈ 0.72. The most sensitive term is P(non-prop required), and arguments about whether dispositions/practices are ineliminable could move it. The disagreement between the user (0.7) and their friend (0.35) likely centers on P(no local justification) or P(non-prop required).

  For the Serial Tortoise: same regress (0.85), just reframed. Responses:
  - Rules not truth-apt: P(silence) 0.4. Might not convince if he demands propositional backing.
  - Understanding as dispositions: P(silence) 0.5. Faces same "going on" issue.
  - Pragmatic vindication: P(silence) 0.8. Appeals directly to practice.
  - Demand defective: P(silence) 0.9. Locally effective by rejecting the premise-chase.

