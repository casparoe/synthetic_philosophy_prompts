  **Choice**: The introduction of uncheckable claims in Round 3 by simply allowing debaters to label claims as uncheckable and not providing a card number.

  **Why I'm unsure**: It might be too artificial. Participants (debaters) might not use the uncheckable claims effectively, or they might overuse them in a way that feels unrealistic. The judge might not feel the frustration because they can still unseal other cards. Alternatively, the uncheckable claims might be too obviously weak and get ignored.

