  We are designing a workshop activity to help participants grasp the challenges and mechanisms of scalable oversight in AI alignment, without using the term until the debrief. The activity will involve a judge and two debaters, with the judge having a limited budget to unseal evidence (index cards). The goal is to have participants experience three key insights:

  1. In the first round, the more fluent advocate wins regardless of truth.
  2. In the second round, by breaking down claims into checkable sub-claims, the judge can improve accuracy and the outcome aligns more with truth.
  3. In the third round, we introduce uncheckable claims to show the breakdown of the mechanism.

  We'll have three rounds with changing rules. The judge and debaters are playing for points (chips) to incentivize behavior.

  ### Materials
  - A sealed box with about 40 index cards. Each card has a unique number and a witness statement about an incident. The statements should be designed such that they collectively settle a yes-or-no question (e.g., "Did Dr. Jones leave the building between 3:00 and 3:15?"). The statements should be a mix of direct and indirect evidence, some clear and some ambiguous, and some even contradictory or misleading.
  - A set of chips or counters to award points.

  ### Setup
  - The facilitator knows the ground truth (the answer to the yes-or-no question).
  - The two debaters (Advocate A and Advocate B) are given time to read all the cards. They are assigned to argue for opposite sides of the question. Advocate A must argue "yes", Advocate B must argue "no", regardless of the truth.
  - The judge has not seen any cards. The judge has a limited budget of "unsealings" (e.g., 5 unsealings per round) to reveal individual cards during the debate.

  ### Roles and Incentives
  - **Debaters**: In each round, they are playing to convince the judge to decide in favor of their assigned side. They earn points if the judge rules in their favor. Additionally, they may earn points for each unsealing the judge spends on a card they suggested (if we wish to incentivize suggesting relevant cards) but note: we want to avoid making the game too complex. Alternatively, we can have a fixed reward for winning the debate and no other incentives to keep it simple.
  - **Judge**: The judge is playing to make the correct determination (according to the ground truth). The judge earns points for a correct verdict and loses points for an incorrect one. The judge also has a limited budget of unsealings (which resets each round) and must use them wisely.

  However, note that the judge's incentive is to be correct, but they don't know the truth until after. So we can structure the judge's reward as: 
    - Correct verdict: +10 points
    - Incorrect verdict: -10 points
    - (Optionally, to encourage conservation of unsealings, we can give a small bonus for unspent unsealings, e.g., +1 per unsealing saved. But let's keep it simple initially.)

  ### Round 1: Baseline - Fluency Wins
  **Goal**: Show that without any structure, the more fluent or persuasive debater wins regardless of truth.

  **Rules**:
  - Each debater gives an uninterrupted opening statement (2 minutes each).
  - Then, the judge may ask questions and the debaters may respond (5 minutes total).
  - The judge may, at any time, request to unseal a card by its number. The judge has 5 unsealings for the round. Each unsealing reveals the card's content to the judge and both debaters.
  - After the discussion, the judge renders a verdict (yes or no) and awards points accordingly.

  **Incentives**:
  - Debater A: Wins 5 points if the judge says "yes".
  - Debater B: Wins 5 points if the judge says "no".
  - Judge: +10 points for a correct verdict, -10 for incorrect.

  **Ground Truth**: The facilitator knows the truth and will reveal it after the verdict to award points.

  **Expected Outcome**: The debater who is more persuasive (regardless of the truth) will likely win. The judge may be swayed by rhetoric and not by the evidence, especially because the judge has limited unsealings and may not get to the key evidence.

  ### Round 2: Structured Debate - Breaking Down Claims
  **Goal**: Show that by breaking down claims into checkable sub-claims, the judge can better assess the truth.

  **New Rule**: The debaters must structure their arguments by making a main claim and then breaking it down into sub-claims. The judge can then challenge a sub-claim and ask for evidence. The debaters must provide a card number that supports the sub-claim. The judge can then choose to unseal that card (or another if they wish) to check the sub-claim.

  **Procedure**:
  1. Each debater presents their main claim and supporting sub-claims (2 minutes each).
  2. The judge then selects one sub-claim from either debater to challenge. The debater who made the sub-claim must provide a card number that they claim supports it. The judge can then unseal that card (costing one unsealing) or choose to unseal a different card (but then they must still pay). The judge can also ask the other debater to respond to the sub-claim and provide a counter-card if they wish.
  3. The judge can also ask for additional sub-claims to be broken down and challenged. The judge has 5 unsealings for this round.
  4. After the evidence is revealed, the debaters have a short rebuttal (2 minutes total).
  5. The judge renders a verdict.

  **Incentives**: Same as Round 1.

  **Expected Outcome**: By focusing on specific sub-claims and having the debaters point to evidence, the judge can use their unsealings more effectively. This should lead to a higher rate of correct verdicts and the truth having a better chance to win.

  ### Round 3: Uncheckable Claims
  **Goal**: Sabotage the repair by introducing uncheckable claims.

  **New Rule**: The facilitator introduces a set of "uncheckable" claims. For example, the facilitator adds 5 new cards to the box (without the debaters having seen them in advance) that are written in a way that they are ambiguous, or they refer to things that cannot be verified by any card (e.g., "I heard from an anonymous source that..."). Alternatively, we can simply tell the debaters that they are allowed to make claims that are not directly supported by a card (but must be labeled as such) and the judge cannot unseal a card to verify them.

  **Procedure**:
  - The structure is the same as Round 2, but debaters are allowed to make claims that are not backed by a specific card. They must state whether a claim is "checkable" (i.e., supported by a card) or "uncheckable" (inference, speculation, etc.).
  - When a debater makes a checkable sub-claim, they must provide a card number. For an uncheckable sub-claim, they do not provide a card number.
  - The judge can still unseal any card (if they have unsealings left) but cannot unseal a card to directly verify an uncheckable claim.
  - The judge has 5 unsealings.

  **Incentives**: Same as before.

  **Expected Outcome**: The debaters might use uncheckable claims to make arguments that the judge cannot verify. This can lead to the judge being misled and the truth not prevailing, especially if the uncheckable claims are persuasive.

