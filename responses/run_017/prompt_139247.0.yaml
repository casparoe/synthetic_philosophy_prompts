     - Explain the new rule (structured breakdown) (3 min)
     - Debate: 2 min each for structured arguments (4 min), then 8 min for challenging sub-claims and unsealing, 2 min rebuttal, 1 min verdict.
     - Reveal truth and award points (1 min).

  4. **Round 3 (20 minutes)**:
     - Explain the new rule (uncheckable claims) (3 min)
     - Debate: same as Round 2, but with uncheckable claims allowed (same timing: 4 min for arguments, 8 min for challenges, 2 min rebuttal, 1 min verdict).
     - Reveal truth and award points (1 min).

  5. **Debrief (25 minutes)**:
     - Start by asking the participants (especially the judge and debaters) about their experiences in each round. Then ask observers.
     - Then, guide the discussion to the intended insights:
          Round 1: How did you decide? Was it based on evidence or persuasion? Did the unsealings help? How many unsealings did you use? Did the truth win?
          Round 2: How was this different? Did breaking down claims help? Did the judge feel more confident? Did the truth win more often?
          Round 3: What happened with the uncheckable claims? Did they affect the outcome? How did you feel about them?
     - Then, introduce the term "scalable oversight" and explain that this activity was designed to simulate the challenge of overseeing AI systems that are more intelligent than humans. The judge is like a human supervisor, the debaters are like AI systems, and the unsealings are like the limited ability of the human to check the AI's reasoning. The goal is to find methods that allow the human to accurately judge the AI's behavior despite limited access to the underlying evidence.
     - Map the moments:
          - Round 1: Without structure, the more fluent AI (or the one that is better at persuasion) might win, even if it's wrong. This is the "fluency wins" problem.
