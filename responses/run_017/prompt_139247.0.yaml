  **Round 3 Rules**:
  - Same incentives.
  - New rule: Debaters can now make two types of claims: 
     - Checkable: Must be supported by a card number (as in Round 2).
     - Uncheckable: No card number is provided. It might be an inference, speculation, or general knowledge.
