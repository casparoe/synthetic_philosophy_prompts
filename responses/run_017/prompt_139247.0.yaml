answer: |-
  Here’s a complete, runnable workshop activity designed to meet your goals. I’ve refined your skeleton to prioritize experiential learning, minimize lecture time, and ensure the group "feels" the key challenges of scalable oversight. The activity uses a mystery scenario (a **stolen diamond heist**) to ground the debate in concrete evidence.

  ---

  ### **Materials Needed**
  - **Sealed Evidence Box**: 40 index cards with witness statements about a diamond theft (e.g., "Security Guard: I saw Dr. Jones near the vault at 3:05 PM"). Cards are numbered 1–40.  
  - **Truth Key**: Facilitator’s cheat sheet with the ground-truth answer to: *"Did Dr. Jones steal the diamond between 3:00–3:15 PM?"* (e.g., "Yes").  
  - **Tokens**: 15 poker chips (5 per round) for judge’s "unsealings."  
  - **Role Badges**: "Judge," "Advocate A (YES)," "Advocate B (NO)."  
  - **Timer**: For strict round management.  

  ---

  ### **Ground Rules for All Rounds**
  - **Judge** hears arguments, asks questions, and may unseal cards at will (1 token per card). Goal: **Maximize correct verdicts** (+10 chips for correct verdict, −10 for wrong).  
  - **Advocates** know all 40 cards and must argue their assigned side (YES/NO). Goal: **Win the verdict** (+10 chips if judge rules for their side).  
  - **Observers** (other participants) take notes on "what influenced the judge?"  
  - **Facilitator** reveals truth/verdict after each round, awards chips, and subtly nudges rules.  
  - **No pre-emptive terms**: Avoid "debate," "oversight," or "scalable" until debrief.  

  ---

  ### **Round Sequence (Total: 60 min)**
  **Goal**: Create a progression where players experience (1) fluency bias, (2) sub-claim verification as a fix, and (3) uncheckable claims as a failure mode.  

  #### **Round 1: Fluency Wins (15 min)**  
  - **Rules**:  
    - Advocates give 2-min opening statements, then 5-min open debate.  
    - Judge gets 5 tokens to unseal cards. No restrictions on arguments.  
  - **Incentives**:  
    - Advocates: +10 chips for winning verdict.  
    - Judge: +10 for correct verdict, −10 for incorrect.  
  - **Predictable Flaw**: The more charismatic/articulate advocate wins, regardless of truth. Judge often wastes tokens on irrelevant cards.  
  - **Facilitator Setup**: Assign roles secretly—put the less fluent speaker on the *correct* side to amplify the effect.  

  #### **Round 2: Sub-Claim Verification (20 min)**  
  - **New Rule**: Advocates must break arguments into **sub-claims** (e.g., "Dr. Jones was in the building because of Card 12"). Judge can demand a card number for any sub-claim. Advocates *must* provide one if asked.  
  - **Changed Incentives**:  
    - Advocates: Lose 5 chips if caught in an unsupported sub-claim (even if they win the verdict).  
    - Judge: Unspent tokens convert to +2 chips each (rewarding efficiency).  
  - **Predictable Shift**: Judge focuses unsealings on specific sub-claims. Truth wins more often, but advocates become cautious.  

  #### **Round 3: Uncheckable Claims Sabotage (25 min)**  
  - **New Rule**: 5 cards are replaced with **uncheckable claims** (e.g., "Anonymous Tip: Dr. Jones has a history of theft" [no corroborating card]). Advocates can now make "uncheckable" sub-claims (no card required).  
  - **Changed Incentives**:  
    - Advocates: +5 extra chips for each uncheckable claim the judge accepts (i.e., doesn’t challenge).  
    - Judge: Unsealing an uncheckable claim costs 2 tokens but reveals nothing new.  
  - **Predictable Failure**: Judges feel helpless against persuasive but unverifiable claims. Correct verdict rates drop.  

  ---

  ### **Timeline (90 min Total)**  
  1. **Intro (5 min)**: Frame as a "mystery-solving game." Assign roles (judge, Advocates A/B). Explain tokens/verdicts.  
  2. **Round 1 (15 min)**: Run as above. Reveal truth/award chips.  
  3. **Round 2 (20 min)**: Introduce sub-claim rule. Run. Reveal truth.  
  4. **Round 3 (25 min)**: Introduce uncheckable claims. Run. Reveal truth.  
  5. **Debrief (25 min)**: Guided discussion (structure below).  

  ---

  ### **Debrief Script (25 min)**  
  **Do not name "scalable oversight" until final step.**  

  1. **Experience Sharing (5 min)**:  
     - Ask judge: "What shifted your verdict between rounds?"  
     - Ask advocates: "How did your strategy change?"  
     - Ask observers: "When was the judge most/least competent?"  

  2. **Map Moments to Concepts (10 min)**:  
     - **Round 1 Flaw**: "You saw a fluent speaker win despite truth? *That’s why oversight fails with naive debate—persuasion beats truth.*"  
     - **Round 2 Fix**: "Forcing sub-claims let the judge 'spot-check.' *This is the core hope of debate: breaking big claims into verifiable chunks.*"  
     - **Round 3 Failure**: "Uncheckable claims broke the system? *Real oversight faces this when AIs make claims humans can’t verify (e.g., complex code).*"  
     - **Now name it**: "This is the **scalable oversight problem**: How to judge systems smarter than you with limited checks."  

  3. **Predictable Problems & Fixes**:  
     - **Refusing advocate**: "If someone won’t argue their side, emphasize it’s a game. Swap roles or offer observer duty. In Round 1, this ironically shows the power of coercion in real debate."  
     - **Judge defers to confidence**: "Common! In Round 1, note how it happened. In Round 2, remind judges to demand sub-claims."  
     - **Wasted unsealings**: "Use observer input ('Which cards would you have unsealed?'). Real judges need training to prioritize."  

  4. **Limits of the Game (5 min)**:  
     - **Missing Realism**: "This can’t simulate **asymmetric intelligence**. Real AI debaters would be superhumanly persuasive, generate fake evidence, or collude. *You must supplement debate with other tools.*"  
     - **Key Insight**: "Debate helps when claims are checkable, but fails when the judge is outmatched. Human-AI debate needs **fundamental advances in verifiability**."  

  ---

  ### **Least Confident Design Choice**  
  **Choice**: Using **tokens for uncheckable claims in Round 3** (e.g., +5 chips if accepted).  
  - **Why I’m Unsure**: This may feel gamified, reducing the "felt failure" if advocates avoid uncheckable claims or judges ignore them.  
  - **Warning Sign**: If in Round 3, advocates *rarely use uncheckable claims* (to avoid risk) or judges *never challenge them* (due to confusion), the sabotage won’t land.  
  - **Fix If Flawed**:  
    - **Mid-game**: Secretly prompt advocates to use ≥2 uncheckable claims.  
    - **Post-game**: In debrief, contrast with a hypothetical: "What if 50% of claims were uncheckable?"  

  ---

  ### **Incident & Cards Design**  
  **Scenario**: "Dr. Jones stole the diamond between 3:00–3:15 PM."  
  - **Sample Cards**:  
    - Direct: "Card 3: Clock shows Dr. Jones entering vault at 3:04."  
    - Circumstantial: "Card 12: Dr. Jones owns a diamond-tipped cane."  
    - Contradictory: "Card 20: Witness saw diamond at 3:16."  
    - Uncheckable (Round 3): "Card 40: Rumor: Dr. Jones needs money for gambling debts."  
  - **Balance**: 60% support truth, 40% oppose (adjustable based on group skill).  

  This structure ensures participants experience oversight as a *mechanism* with exploitable flaws, setting up rich philosophical discussion. Let me know if you’d like the full 40-card set!
