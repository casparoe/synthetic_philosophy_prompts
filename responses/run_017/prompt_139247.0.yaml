     We choose one judge and two debaters at the beginning. They stay for all three rounds. The rest are observers. We tell the observers to take notes on what they see and how the rounds differ.

  2. **Round 1 (20 minutes)**:
     - Explain the rules for Round 1 (5 min explanation including Q&A? Actually, we must be brief. We can have the rules on a handout.)
