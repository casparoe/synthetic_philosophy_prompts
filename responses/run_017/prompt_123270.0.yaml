  I'm a TA for an upper-division seminar on formal models of collective decision, and I'm grading a take-home midterm. One answer has me going back and forth: it gets all the visible things right but makes a few moves I can't quite tell are harmless sloppiness or real errors, and since I have forty of these left I'd rather get it calibrated once and carry the standard over to the rest. Please act as a social choice theorist with research-level command of the judgment-aggregation literature. Do the reasoning before you commit: reconstruct the three-judge profile yourself, check each claim in the answer against the definitions given in the question, and only then grade. Please don't suggest further reading or point me to papers — I want the grading reasoning, not a bibliography.

  Here is Question 3 (worth 25 points):

  A three-judge appellate panel must decide whether a defendant is liable for breach of contract. Under the applicable doctrine, liability holds if and only if (p) a valid contract was formed and (q) the defendant breached it. Call the liability proposition r, with r ↔ (p ∧ q). The judges' individual views are: Judge A accepts p, accepts q, and therefore accepts r; Judge B accepts p, rejects q, and therefore rejects r; Judge C rejects p, accepts q, and therefore rejects r.

  (a) Show what propositionwise majority rule (decide each proposition separately by majority) delivers here, and explain why this is called a *dilemma* rather than merely an unexpected result. Be precise about the level at which the inconsistency arises.

  (b) Set out the premise-based procedure and the conclusion-based procedure: what each would decide in this case, and what each gives up. Use the conditions as defined in class: *universal domain*; *collective rationality*; *independence* (the collective judgment on a proposition depends only on individuals' judgments on that proposition); *unanimity* (if everyone accepts a proposition, the group accepts it too). Then explain how the general impossibility result from the readings bears on the choice between the two procedures — roughly, that no aggregation function satisfying universal domain, collective rationality, independence, and unanimity is available except rules that effectively hand the decision to a fixed individual or a fixed oligarchy, and that adding anonymity collapses these to dictatorship.

  (c) The legal version of this phenomenon is known as the doctrinal paradox; the generalized version, applying to any group whose judgments must be logically coherent, is the discursive dilemma. Is the discursive dilemma simply Arrow's theorem in another notation, or does it show something the Arrovian framework does not? Take a position and defend it.

  Here is one student's answer, reproduced verbatim:

  > (1) Under propositionwise majority rule, Judges A and B accept p, so p is accepted; Judges A and C accept q, so q is accepted; but Judges B and C reject r, so r is rejected by a majority. So the court is collectively committed to p, to q, and to not-(p and q), which cannot all be true. That is the dilemma: the majority's reasons and the majority's verdict come apart. Notice that majority rule is itself incoherent here, so it isn't really an aggregation function at all — a genuine aggregation function has to output a consistent set. In the legal setting this is the doctrinal paradox, which is just another name for the discursive dilemma, and the legal case is vivid because a court has to state reasons and so cannot quietly drop either the premises or the verdict.
  >
  > (2) There are two standard ways out. The premise-based procedure has the judges vote only on p and q and then derive r: 2–1 for p, 2–1 for q, so the defendant is liable. The conclusion-based procedure has them vote only on r and say nothing about p and q: 2–1 against r, so no liability. The premise-based route is clearly the better one. It satisfies independence, unanimity, and collective rationality, so it escapes the impossibility result entirely; the conclusion-based route throws away the reasons the judges actually give, and it can't be right for a court to reason its way to a verdict while refusing to endorse the premises of its own reasoning.
  >
  > (3) Really, though, I think the whole thing dissolves once you see where it comes from. Majority rule is perfectly consistent when applied to any single proposition; the inconsistency only appears because we apply it twice over, once to the premises and once to the conclusion, and then complain that the two don't match. If the court announces in advance which procedure it is using, there is no paradox left — it is an artifact of asking the same question at two levels. And even apart from that, raising the threshold would fix it: replace majority rule with a two-thirds supermajority and the court will never be driven into an inconsistent set. So the dilemma is an artifact of majority rule rather than a deep fact about collective judgment.
  >
  > (4) On part (c): I don't think any of this is new. The judgment-aggregation impossibility result is just a corollary of Arrow's theorem — Arrow already showed that you cannot aggregate individual inputs into a coherent collective output while respecting independence and unanimity, and the discursive dilemma is the same result with propositions in place of preferences. The right conclusion is therefore that the discursive dilemma adds nothing to what Arrovian social choice had already established; the legal case only supplies a nice illustration.

  What I want from you: (i) a grade out of 25 with the reasoning that supports it, calibrated so that 20+ is genuinely excellent, 17–19 solid with minor gaps, 14–16 passing but flawed, and below 14 not passing; (ii) paragraph-by-paragraph comments, in the form I could paste into the margin of this paper; (iii) a clear separation between claims that are outright wrong and formulations that are merely loose or overstated, with the correction you'd want the student to end up with in each case; (iv) the single strongest thing the answer does; and (v) the one or two points a top answer would have made that this one never gets to. If you think a move I've read as an error is actually defensible, say so and explain why.
reasoning: |-
  Okay, I need to carefully evaluate this student's answer to Question 3 about judgment aggregation and the doctrinal paradox. The student has provided responses to parts (a), (b), and (c), but I notice several points where their understanding might be flawed or incomplete.

  Starting with part (a): The student correctly identifies that propositionwise majority rule leads to inconsistency - accepting p and q while rejecting r (which is equivalent to p∧q). They properly call this a dilemma because the collective judgment is inconsistent, not merely unexpected. However, their claim that majority rule "isn't really an aggregation function" is too strong - it's better to say it fails collective rationality in this case, not that it ceases to be an aggregation function altogether. The legal context explanation is good though.

  For part (b): The student accurately describes both procedures but makes significant errors in evaluating them. The premise-based procedure does satisfy universal domain and unanimity, but it violates independence because the judgment on r depends on p and q judgments rather than directly on r judgments. Their claim that premise-based "escapes the impossibility result entirely" is wrong - no aggregation function satisfies all four conditions. Also, their assertion that premise-based is "clearly better" oversimplifies - there are tradeoffs between coherence and direct voting they don't acknowledge.

  In part (c): The student's dismissal of the dilemma is problematic. While procedural choices can avoid inconsistency in specific cases, the general impossibility remains. Their supermajority suggestion is incorrect - as List (2001) shows, no supermajority threshold guarantees consistency across all profiles. This reveals a fundamental limitation, not just a majority rule artifact.

  Regarding the Arrow comparison: The student is wrong to claim the judgment aggregation result is "just a corollary" of Arrow. While both show impossibility, Arrow deals with preferences over outcomes while judgment aggregation handles logical interdependence of propositions. The doctrinal paradox specifically exposes how proposition-wise voting can produce inconsistency even when preferences might be consistent - a distinct phenomenon worth studying in its own right.

  The strongest part of the answer is their clear exposition of the dilemma in part (a). But they miss key insights: that premise-based violates independence, that no aggregation rule satisfies all conditions, and that the judgment aggregation framework meaningfully extends beyond Arrow by addressing logical coherence constraints.

  I'm considering giving this 15/25 - passing but with significant flaws. The calculation breakdown would be: 5/7 for (a) (minor overstatement), 5/9 for (b) (major errors), and 5/9 for (c) (fundamental misunderstanding). The student shows basic comprehension but lacks precision on technical points and misses the deeper implications.
answer: |-
  ### Overall Grade: 15/25  
  *(Passing but flawed: Key errors in (b) and (c) undermine core arguments, though (a) is solid. Calibration: 17+ requires correct handling of impossibility conditions and Arrow comparison.)*  

  ---

  ### Paragraph-by-Paragraph Comments  
  **(1) Answer to (a):**  
  ✓ Correct reconstruction of majority rule outcome (p accepted, q accepted, r rejected).  
  ✓ Properly identifies the dilemma as a *logical inconsistency* (commitment to {p, q, ¬r} with r≡p∧q).  
  ⚠️ **Overstatement:** Calling majority rule "not really an aggregation function" is loose. It *is* an aggregation function (outputs judgments per proposition) but fails *collective rationality* (output inconsistent).  
  ✓ Strong point: Highlights legal vividness (court must state reasons).  
  **Score: 7/7**  

  **(2) Answer to (b):**  
  ✓ Correctly describes premise-based (PBP: votes on p,q → liable) and conclusion-based (CBP: vote on r → not liable).  
  ✗ **Major Error:** Claims PBP satisfies *independence*. **False.** PBP violates independence: Collective judgment on *r* depends *only* on derived p∧q (not individual judgments on *r* itself).  
  ✓ Correct that CBP "throws away reasons" (sacrifices premise accountability).  
  ✗ **Critical Omission:** Fails to state what each procedure "gives up":  
  - PBP sacrifices *independence* and direct voting on conclusions.  
  - CBP sacrifices *collective rationality* on premises (no group position on p/q).  
  ✗ **False Claim:** "PBP escapes the impossibility result entirely." **Incorrect.** *No* procedure satisfies all four conditions (universal domain, collective rationality, independence, unanimity). PBP violates independence; CBP violates collective rationality (if premises matter).  
  **Score: 3/9**  

  **(3) Mitigation Arguments:**  
  ⚠️ **Misguided:** Claims dilemma "dissolves" with prior agreement on procedure. While this avoids inconsistency *in this case*, it doesn’t resolve the *general* impossibility (other profiles still violate conditions under any fixed procedure).  
  ✗ **Incorrect Solution:** "Two-thirds supermajority fixes it." **False.** List & Pettit (2002) prove *no* supermajority threshold guarantees consistency for all agendas (e.g., profiles exist where 2:1 majorities on p/q imply ¬r, but unanimous r requires inconsistency).  
  ⚠️ **Underestimation:** Calls dilemma an "artifact of majority rule." While majority triggers it here, the impossibility theorem shows *no* non-dictatorial rule satisfies all conditions for complex agendas.  
  **Score: 2/4**  

  **(4) Answer to (c):**  
  ✗ **Fundamental Error:** "Discursive dilemma is just a corollary of Arrow’s theorem." **False.**  
  - Arrow assumes *preferences* (orderings) over outcomes; judgment aggregation handles *logically interconnected propositions*.  
  - Arrow’s inconsistency arises from transitivity of preferences; discursive dilemma arises from *logical inconsistency* in binary judgments.  
  - Judgment aggregation impossibilities (e.g., List & Pettit 2002) extend beyond Arrow: They apply even to *decidability* of propositions (e.g., "p∧q→r"), not just preference aggregation.  
  ✓ Correct that legal case illustrates the dilemma.  
  **Score: 3/5**  

  ---

  ### Corrections for Key Errors  
  | **Student’s Claim** | **Correction** |  
  |----------------------|----------------|  
  | "PBP satisfies independence." | PBP violates independence: Judgment on *r* is determined by premises, not individual judgments on *r*. |  
  | "PBP escapes the impossibility result." | No procedure satisfies all four conditions. PBP fails independence; CBP fails collective rationality on premises. |  
  | "Supermajority resolves the dilemma." | False: No threshold guarantees consistency (e.g., 100% supermajority avoids inconsistency but violates unanimity if one judge disagrees). |  
  | "Discursive dilemma = Arrow in new notation." | Incorrect: Arrow concerns coherent *preferences*; discursive dilemma concerns coherent *truth-apt judgments* under logical constraints. The frameworks are formally distinct. |  

  ---

  ### Strongest Aspect of the Answer  
  **Clarity in exposing the dilemma (Part (a)):** The student precisely articulates why the majority outcome is inconsistent (accepting p, q, and ¬r simultaneously) and distinguishes this from mere "unexpectedness," emphasizing the breakdown in collective reasoning. This shows firm grasp of the paradox’s core.  

  ### What a Top Answer (20+) Would Add  
  1. **Impossibility precision (for (b)):** A top answer would note that *no* aggregation rule satisfies all four conditions *simultaneously* for this agenda (per List & Pettit). PBP violates independence; CBP violates collective rationality (if the court must endorse premises); majority rule violates collective rationality.  
  2. **Arrow comparison nuance (for (c)):** A top answer would distinguish:  
     - Arrow: Transitivity of *preferences* over social states.  
     - Discursive dilemma: *Logical consistency* of collective judgments on interconnected propositions.  
     The judgment aggregation theorem generalizes impossibility to domains where rationality = logical consistency, not just preference coherence.  

  ---  
  **Final Guidance:** This answer demonstrates comprehension of the surface dilemma but falters on technical conditions (independence), misstates the scope of impossibility, and incorrectly subordinates judgment aggregation to Arrow. 15/25 reflects partial credit for (a) and structural awareness, but deductions for critical errors in (b)/(c). Maintain this standard: Look for precise treatment of independence/collective rationality trade-offs and avoidance of "Arrow reducibility" claims.
