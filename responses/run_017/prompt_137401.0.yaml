answer: |-
  Here’s a distilled, interview-ready proposal framework based on your core idea:

  **Sharpened Research Question:**  
  *Can persistent, unresolved uncertainty about the true edge (due to non-stationary opportunity streams) structurally justify a constant fractional Kelly strategy (c < 1) with determinate comparative statics?*  
  **Sub-question:** *Do background risks (e.g., non-bettable wealth) counteract this conservatism?*

  ### Why Existing Answers Fall Short
  1. **Risk aversion (taste-based):** Untestable and post-hoc. If any c < 1 can be "explained" by choosing utility functions, it offers no predictive power.  
  2. **Estimation error (learning):** Implies shading *decreases* as data accumulates. But practitioners use fixed c – suggesting unresolved uncertainty is fundamental, not shrinking.  
  3. **Full-Kelly framework:** Assumes stationary edge and known parameters. Breaks down when the world drifts. Asymptotic arguments ignore regime shifts.  

  ### The 9-Month Plan: Modeling Structural Uncertainty  
  **Phase 1 (Months 1-3): Formalize Non-Stationarity**  
  *Build tractable models where edge evolves (e.g., slow drift, Markov-regime switches, stochastic volatility). Focus on settings where uncertainty *persists* – it never fully resolves.*  
  *Why?* Alternatives (e.g., Bayesian learning with fixed params) imply vanishing shading. We need persistent doubt.  

  **Phase 2 (Months 4-6): Quantify Growth-Rate Asymmetry**  
  *Embed non-stationary edges into the fractional Kelly setup. Analytically/numerically solve for the c maximizing expected log growth under:*  
  - Different "decay speeds" of edge information (e.g., drift volatility)  
  - Fat-tailed downside risks (e.g., jump processes)  
  - Background wealth (log utility’s leverage effect)  
  *Why?* Kelly’s lopsided penalty (overbet → ruin) + persistent doubt should punish overconfidence.  

  **Phase 3 (Months 7-9): Derive Comparative Statics & Stress Test**  
  *Characterize how optimal c depends on:*  
  - **Learnability:** Signal-to-noise of edge observations → c ↗ as noise ↘  
  - **Instability:** Rate of edge drift/regime shifts → c ↘ as drift ↗  
  - **Tail Risk:** Kurtosis/left-skew → c ↘ as tails fatten  
  - **Background Wealth:** Does it push c *up*? (Likely yes – quantify if it overwhelms conservatism)  

  **Why NOT alternatives?**  
  - *Axiomatization:* Adds formalism without practical sizing guidance.  
  - *Backtesting:* Philosophy’s job is *why* models work, not fitting historical noise.  

  ### Deliverable: The Practitioner’s Heuristic  
  A formula/mapping for sizing high-uncertainty bets:  
  > *Optimal Fraction c ≈ f( 
      \text{Edge Decay Rate}, \, 
      \text{"Tail Fatness"}, \, 
      \text{Learnability} 
  ) - g(\text{Background Leverage Effect})*  
  ...with clear thresholds (e.g., "If edge half-life < 6 months & kurtosis > X, c < 0.3").  

  ### Failure Conditions  
  - **Bombed result:** Non-stationarity *doesn’t* yield robust c < 1 (e.g., optimal shading vanishes or oscillates wildly).  
  - **Budget blown:** Getting stuck on intractable math (e.g., regime-switching models with no closed-form growth rates). *Mitigation:* Start with Gaussian drift → extend to jumps.  

  ### Why Philosophy (Not Just Quant)?  
  "Quants excel at *how* to optimize within models; philosophers dissect *which* models reflect reality. Practitioners use fractional Kelly despite its ad-hoc reputation – suggesting a mismatch between classical theory and operational truth. This project bridges that gap: it rigorously formalizes the intuition that *non-stationary worlds demand structural conservatism*. Funding philosophy here ensures the model isn’t just mathematically elegant, but epistemically grounded for decision-makers facing turbulent environments."  

  ---  
  **Key strengths to emphasize:** Targets a concrete practitioner paradox (fixed c), sidesteps untestable utility debates, and delivers actionable sizing logic grounded in the world’s uncertainty structure. The background wealth stress test adds depth.
