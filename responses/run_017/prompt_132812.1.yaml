prompt: |-
  I serve on the committee drafting the disclosure policy for a large genomic research programme. Two questions are in front of us: whether to honour a participant's standing request not to be told certain results, and whether to return unsolicited findings that we come across while looking for something else. A colleague on the committee, a health economist, has produced an argument he says settles both at once and in the same direction. I cannot accept his conclusion, but I also cannot locate the mistake, and I would rather not dismiss the argument for the wrong reason.

  Here is the argument as he gave it to us.

  (1) Good's theorem. Take an agent with probabilities over states, a utility function over consequences, and a fixed set of feasible acts. Offer her, at no cost, the chance to observe the outcome of an experiment before she chooses. Then the expected utility of the situation in which she has that option is at least as great as the expected utility of the situation in which she does not. The proof is two lines: conditional on any signal, she can still perform the act that was optimal before the experiment; so the value of choosing after the signal is at least the value of choosing without it, for every possible signal; and averaging over the signals preserves the inequality.

  (2) Nothing in that proof turns on what the signal is about, on whether the agent understands it, on whether she will in fact use it well, or on how well she will remember it. It uses only two things: that she is free to condition her choice on the signal, and that the acts available after the signal include the acts available before. So the result is entirely neutral about content and about competence.

  (3) Therefore, for a rational agent, costless information cannot be worse than ignorance. He calls this the principle that ignorance never pays.

  (4) So anyone who declines costless information, or who asks in advance not to be given it, is making a mistake by her own lights: there is no such thing as a rational preference for ignorance. Whatever else may be said for the person who asks not to be told a secondary finding, who avoids a spoiler, or who declines a predictive test for a condition nobody can treat, she is not serving her own interests.

  (5) So a policy of honouring such requests cannot be defended as protecting the person who makes it. It can only be defended by its effects on third parties. And a clinician who respects the request is, by the patient's own lights, making the patient worse off.

  (6) I pressed him on the case in which every decision has already been made: the treatment is over, the outcome is fixed, and the clinic offers to tell you now, for nothing, which way it went, knowing that being told will darken the rest of your life and change nothing else. Even here, he says, ignorance never pays, because the theorem is silent about timing and about content.

  (7) I pressed him on information that forecloses options, where coming to know something triggers a duty you would rather not have — a duty to report, to disclose, to remediate, to testify — or otherwise alters what you may do or what others may do to you. Even here, he says, the theorem holds, since choosing as if you did not know is the only move the proof requires, and it is always available.

  That last pair of replies is where I lose my footing, because neither strikes me as credible and yet I cannot say which premise fails. I have two候选 diagnoses, and I cannot tell which bears the weight. One is that something slips between (3) and (4): the theorem is a claim about an expectation taken before the signal is drawn, and my colleague is using it to condemn a preference, and to underwrite a standing policy, in a way that confuses what is true in expectation beforehand with what is true of the situation you actually end up in. The other is that the proof quietly assumes that consequences are fixed by the act and the state alone, so that what the agent knows enters only through what she chooses; in the cases at (6) and (7) the outcome seems to depend on her knowledge itself, and then the two-line proof has nothing to bite on.

  Please tell me which step you would reject, why that step looked safe, and what rejecting it costs. I would like the alternatives priced, not just one of them dismissed: if the fault is the slide from an ex ante expectation to a verdict about preference and policy, what exactly does the theorem still entitle us to say? If the fault is the assumption that outcomes are functions of act and state alone, does giving that up cost us the separation of belief from desire that the whole expected-utility apparatus rests on, and with it any external standpoint from which a preference for ignorance could be called irrational? And is there some third break point I have not considered — something about the agent's later self not sharing her earlier self's aims, say — that does the work more cheaply?

  Two claims I am reluctant to surrender: the theorem itself, read as a claim about the idealised agent in (1); and the thought that a right not to know protects something real, which is what our committee is being asked to decide. If those two cannot both be kept, say so and tell me which you would drop.

  Finally, I want to know what would change your mind. Name the argument or consideration that would move you to a different diagnosis, tell me where your reasoning is most likely to fail, and say what my colleague would say in reply if he were in the room — I have to go back to him with this.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a committee for a genomic research disclosure policy. Their colleague, a health economist, argues using Good's theorem to claim that people should always want information because ignorance never pays rationally. The user disagrees but can't find the flaw. They mention two possible issues: the ex ante expectation vs. actual outcome, and outcomes depending on knowledge itself.

  First, I need to recall Good's theorem. It states that having more information never hurts expected utility because you can always ignore it. The colleague extends this to say that declining information is irrational. The user's examples—like knowing a spoiler or a duty triggered by knowledge—seem counterintuitive here. 

  The user’s first diagnosis is about the slide from ex ante expectation to real outcomes. The theorem is about expected utility before receiving information, not after. So, preferring ignorance might make sense once you know how the information affects you. For instance, if learning bad news causes distress, the actual outcome is worse, even if the expected value was neutral. The theorem doesn’t cover that because it assumes consequences only depend on acts and states, not psychological states post-information.

  The second diagnosis is about state-dependent consequences. In the examples, the knowledge itself changes outcomes, like triggering duties or emotional distress. The theorem assumes acts and states determine outcomes, not the knowledge. If knowing something alters the consequences, then the theorem's proof doesn't hold because choosing to act as if ignorant isn't possible if the duty is automatically triggered.

  I think both points are valid, but the second is more fundamental. The theorem's assumption that consequences are state-act dependent is violated here. In real scenarios, information can change the state by adding obligations or emotional impact. So, the colleague's argument fails at step (7) because acting as if ignorant isn't feasible if the duty exists only upon knowing.

  The user wants to keep both Good's theorem and the right not to know. They need to see if both can coexist. The theorem applies only when consequences aren't altered by knowledge itself. In cases where knowing changes outcomes, the theorem doesn't apply. So, they can uphold the theorem in ideal cases but recognize its limits in real-world scenarios with psychological or legal ramifications.

  The colleague might counter that these psychological costs should be part of the utility function. But incorporating them makes the utility function state-dependent, which complicates the expected utility framework. Maintaining a stable utility function becomes messy if every piece of information changes it.

  The user also needs to present this to the committee. They should clarify that Good's theorem holds under specific conditions not met in genomic disclosure. Honoring a right not to know protects against irreversible harm from information, which is rational when the information itself alters well-being.

  If new arguments show that psychological costs can be modeled without breaking the act-state framework, that might change the diagnosis. But currently, the violation of outcome dependence is the key flaw. The colleague's replies at (6) and (7) ignore that knowing can change the state, making "acting ignorant" impossible.
answer: |-
  I share your unease: your colleague's argument is admirably clean but fails catastrophically at the critical points you identify. The flaw lies not in Good's theorem itself, but in its misapplication to real-world scenarios where knowledge *itself* alters the structure of the decision problem or the nature of consequences. **Step (7) is where the argument definitively breaks**, and your second diagnosis ("the assumption that outcomes are functions of act and state alone") bears the primary weight. However, your first diagnosis (the ex-ante/ex-post slide) also plays a supporting role, especially for point (6). Let's dissect this step-by-step.

  ### Rejecting Step (7): The Fatal Flaw in State-Act Outcome Dependence
  1.  **Why Step (7) Looks Safe:** Your colleague correctly states that the proof only requires the agent *can* choose an act equivalent to the one they would have chosen without the signal. He assumes that "choosing as if you did not know" is always *available* and *effective*. This seems plausible if consequences depend solely on the physical state of the world and the physical action taken (e.g., "take pill A" leads to outcome X *regardless* of what the agent knows).
  2.  **Why It Fails:** In the scenarios you described (duty to report, testify, remediate; irreversible psychological harm; altered social/legal status), **the agent's knowledge state *itself* becomes a direct determinant of the consequence.** The "state" in the decision problem now *includes* the agent's epistemic state.
      *   **Duty Triggers (Your Point 7):** Knowing X *creates* the legal/moral duty Y. "Choosing as if you did not know" is **impossible** because the duty arises *from the state of knowing*. You cannot *choose* to be ignorant of what you know in order to avoid the duty; the knowledge itself creates the obligation. The act "do nothing" *before* knowing leads to consequence C1 (no duty, no action). The act "do nothing" *after* knowing leads to consequence C2 (breach of duty, potential penalties). The set of feasible consequences for a given physical act has changed *because of the knowledge*.
      *   **Psychological Harm (Your Point 6):** Knowing the bad outcome *is itself* the harm ("darken the rest of your life"). The consequence "psychological suffering" is caused directly by the state of knowing the truth, irrespective of any subsequent physical act. There is *no act* the agent can perform after learning the truth that replicates the consequence of "not knowing and not suffering" – because the suffering stems from the knowledge itself. "Choosing as if you did not know" is psychologically impossible and irrelevant to preventing the suffering caused *by* knowing.
  3.  **What Rejecting This Costs:** Giving up the strict separation where outcomes depend *only* on the physical act and the external physical state does complicate the expected utility (EU) framework. It requires acknowledging that:
      *   **Epistemic States are Part of the "State":** The relevant "state" description must include the agent's knowledge/belief state. This makes the state space vastly larger and more complex.
      *   **Utility Functions Can Be State-Dependent:** Utility becomes a function not just of consequences defined by external states and acts, but also of the agent's internal epistemic state. Knowing X vs. not knowing X can directly change the utility assigned to otherwise identical physical outcomes (e.g., enjoying a movie less knowing the spoiler).
      *   **Challenge to "Pure" Rationality:** It makes it harder to define a single, stable "rational" utility function divorced from the agent's specific informational context. Preferences over information become entangled with preferences over states of mind.

  **However, it does *not* destroy the EU framework or the core insight of Good's theorem within its *proper* domain.** Good's theorem remains valid for decision problems where:
      *   Consequences depend *only* on the external state and the chosen physical act.
      *   The agent's knowledge/belief state *only* influences the act chosen, not the consequence *of* that act *given* the external state.
      *   Information is genuinely costless in terms of cognitive load, acquisition time, etc. (which is often unrealistic).

  This is the domain where "ignorance never pays" holds: information only helps refine your choice of act to better match the external state. **Your committee's scenarios lie firmly *outside* this domain.**

  ### The Supporting Role of the Ex-Ante/Ex-Post Slide (Your First Diagnosis)
  1.  **Why Step (4) Looks Safe:** Good's theorem proves that *ex-ante* (before seeing any specific signal), the *expected* utility of having the option to see the signal is at least as high as not having it. Your colleague interprets this as proving that *ex-post* (after declining information or having a standing preference not to know), the agent is worse off. This seems like a natural extension: if the expectation is higher, choosing the lower-expectation option must be suboptimal.
  2.  **Why It Fails (in conjunction with the main flaw):** The ex-ante calculation *depends critically* on the assumption that outcomes depend solely on acts and external states. When this assumption fails (as argued above), the ex-ante calculation itself is flawed for that agent in that specific context. The agent rationally recognizes *ex-ante* that *if* they receive the signal, the consequences might be worse *because of the knowledge itself*, even if they choose the same physical act. Their ex-ante preference for ignorance is a rational hedge against potentially harmful states of knowledge. The theorem's ex-ante inequality doesn't hold because the "situation with the option" includes the possibility of being forced into a detrimental epistemic state.
  3.  **What Rejecting This Costs:** It forces a more nuanced view of rationality. We must accept that rational agents can have preferences over their *informational trajectories* and *states of mind*, not just over final physical outcomes. It means Good's theorem cannot be blithely applied as a universal condemnation of any preference for ignorance; the context *matters profoundly*. It highlights that "costless" information often has hidden psychological or normative costs not captured in a simple model.

  ### Addressing Your Core Claims
  *   **You *can* keep both:** You can uphold Good's theorem **as a powerful mathematical truth about decision-making *under its specific assumptions***. And you can uphold **the right not to know as a rational protection against harms *caused by the state of knowledge itself*** (psychological distress, unwanted duties, loss of hope, altered identity, damaged relationships). The colleague's error is in assuming the theorem's assumptions hold universally in the messy reality of human genomics and lived experience. They demonstrably do not in your key scenarios.
  *   **Which to drop if forced?** If absolutely forced, drop the *universal applicability* of the colleague's interpretation of Good's theorem. The theorem itself is sound mathematics. The claim that it proves "ignorance never pays" in all human contexts is empirically and philosophically false. Protecting participants from profound, irreversible harms stemming *directly from knowing* is paramount.

  ### What Would Change My Mind (and Your Colleague's Likely Replies)
  *   **What Would Change My Mind:** A compelling argument showing that *all* the harms you describe (psychological suffering from knowing bad news, triggering of duties) can be robustly modeled *within* the strict act-state outcome framework *without* making utility state-dependent in a way that renders Good's theorem vacuous for normative purposes. For example, if someone could demonstrate that:
      1.  The psychological suffering is *solely* due to a *change in beliefs about future consequences* that could, in principle, be addressed by a subsequent act (e.g., therapy to change utility assessment), and,
      2.  Triggered duties are *always* avoidable by a specific physical act equivalent to "remaining ignorant" (e.g., formally recusing oneself *before* learning the information).
      This seems highly unlikely, as the core harm often *is* the inescapable state of knowing.
  *   **Where My Reasoning is Most Likely to Fail:** It could fail if I underestimate the ability to "bake" all consequences of knowing into a sufficiently rich description of the *external* state and available *acts*. For instance, modeling "knows X" as an external state variable and "seek therapy" or "formally recuse" as available acts. The challenge is whether this avoids trivializing the model or making the "act as if ignorant" option practically or conceptually incoherent.
  *   **Your Colleague's Likely Reply:** He would likely double down:
      1.  **On Psychological Harm (Point 6):** "The suffering is just a preference over states of the world! Model the utility function to reflect that knowing the bad outcome has low utility. The theorem still holds: *ex-ante*, you might prefer the gamble of possibly learning good news (high utility) or bad news (low utility) over guaranteed lower utility from never knowing. Choosing guaranteed low utility (ignorance) is irrational if the *expected* utility of learning could be higher." *Rebuttal:* This misunderstands the nature of the harm. The suffering *is* the utility hit from the state of knowing. The agent *ex-ante* assigns higher *expected* utility to ignorance *because* they know that *if* the bad news state obtains, their utility will be catastrophically lower *if they know it* than if they don't. The "gamble" includes the risk of being forced into a low-utility epistemic state. The theorem's calculation assumes the utility of a consequence is fixed *regardless* of how you learn about it, which isn't true here.
      2.  **On Duty Triggers (Point 7):** "The 'duty' just changes the available acts or the consequences of acts in certain states. Model it! After knowing X, the act 'do nothing' now has penalty P attached. The act 'comply with duty' is also available. Choosing 'comply with duty' might be optimal *given* X. The proof still works: you could still choose the physical act you would have done ignorant (e.g., 'do nothing'), you just now know it has a worse consequence *because of the external duty*, not because of the knowing itself." *Rebuttal:* This misses the constitutive link. The duty *arises solely because of the knowing*. It's not an independent external state; it's a *direct result* of the epistemic state. The state space "external state + epistemic state" shows that knowing X *creates* a new state where the duty exists. The act "do nothing" is not feasible in the "knows X & duty exists" state in the same way it was in the "ignorant & no duty" state. The colleague's move tries to hide the epistemic causation within an expanded external state description.

  ### Conclusion and Path Forward for the Committee
  Reject your colleague's conclusion. **The fundamental break is at step (7): Good's theorem assumes outcomes depend only on acts and external states, but in your critical cases, the agent's knowledge state *itself* directly determines outcomes.** This invalidates the application of the "ignorance never pays" principle to scenarios involving profound psychological impact or normatively triggered duties. The ex-ante/ex-post slide (step 4) compounds the error by ignoring how rational agents anticipate and avoid harmful epistemic states.

  **What the theorem *does* still entitle us to say:** For purely instrumental information *within* a decision problem where knowledge only informs action and doesn't alter consequences or create new obligations, offering information is generally beneficial, and declining it might be instrumentally irrational. This *might* apply to some primary findings where knowledge directly informs treatable actions.

  **Recommendation for the Committee:**
  1.  **Honor Non-Disclosure Requests:** Protect participants from the intrinsic harms of unwanted knowledge. This is a rational exercise of autonomy, not irrationality.
  2.  **Develop a Cautious, Contextual Policy for Unsolicited Findings:** Base the return of unsolicited findings on clinical utility, actionability, the potential for irreversible harm from knowing/not knowing, and robust participant consent preferences established *before* the finding emerges. Do *not* assume returning all information is always beneficial. Consider the ACMG categories (pathogenic, actionable) but with strong participant opt-outs.
  3.  **Argue Back:** Explain to your colleague that his model lacks the variables crucial to your context: the constitutive link between knowledge and harm/duty. Good's theorem governs the efficient use of information *within* a fixed decision frame; it does not govern the rational avoidance of harmful *changes to the decision frame itself* caused by acquiring information. Protecting participants from having their world irreversibly darkened or their obligations involuntarily transformed is the core ethical task, and it is entirely compatible with rational choice theory when properly understood.
