answer: |-
  Your observation reveals a profound tension in legal hermeneutics—one rooted in conflicting theories of meaning tailored to distinct institutional purposes. Below is a reconstruction of the implicit theories at work, their practical implications, and an analysis of the bill's assumptions.

  ### **The Implicit Theory of Meaning Across Documents**
  The pattern presupposes **purpose-driven contextualism**: meaning is not inherent in texts but emerges from the *social function* of the document and the *institutional priorities* of the interpreting body. 

  | Document Type | Primary Theory                 | Institutional Purpose                                                                 |
  |---------------|--------------------------------|----------------------------------------------------------------------------------------|
  | **Wills**     | **Subjective Intentionalism**  | Fulfilling the testator's unique, unilateral act of posthumous gift-giving. Sovereignty of the dead requires honoring their wishes as the sole authorizing force. |
  | **Contracts** | **Objective Textualism**       | Stabilizing mutual agreements between living parties. Predictability and fairness demand reliance on outward expressions to protect reasonable expectations. |
  | **Statutes**  | **Public-Meaning Textualism (with intentionalist exceptions)** | Preserving democratic legitimacy and rule-of-law consistency. Words bind the public, but absurdity or clear drafting errors undermine legislative supremacy. |

  **Contradiction?** Only superficially. The deeper logic is **functional**:  
  - **Wills prioritize loyalty to the author** because they transfer property without ongoing relationships. The author’s death eliminates opportunities for clarification, making subjective intent paramount.  
  - **Contracts prioritize security among parties** because they govern live interactions. Allowing secret intentions would enable bad-faith manipulation.  
  - **Statutes prioritize democratic accountability** because they bind strangers. Public meaning ensures equal access, but correcting drafting errors preserves legislative intent—the *institution’s* authority, not individual drafters’.  

  ### **What the Theory Requires vs. What Fits Comfortably**
  - **Strict Requirements**:  
    - Wills *must* admit extrinsic evidence of intent (e.g., testimony about "which John") because the document’s purpose collapses without it.  
    - Contracts *must* exclude purely subjective intent to prevent one party from undermining mutual assent.  
    - Statutes *must* start with public meaning to uphold rule-of-law values.  
  - **Comfortable Fits**:  
    - Correcting scrivener’s errors in statutes is permissible (but not strictly required) because it aligns with legislative supremacy.  
    - Literary theory’s "death of the author" fits contracts/statutes but clashes with wills, where the author’s death *activates* intentionalism.  

  ### **Could a Unified Theory Exist?**
  Yes, but only at a high level of abstraction:  
  > **"Meaning is institutionally assigned based on document function, not discovered in text or mind."**  
  In practice, consistency fails because the *goals* of each institution (probate courts vs. commercial law vs. constitutional governance) diverge. The "inconsistency" is the point: meaning is a tool for serving context-specific values (e.g., autonomy for wills, efficiency for contracts, legitimacy for statutes).

  ### **Practical Shifts Under Extreme Theories**
  - **Pure Intentionalism**:  
    - **Wills**: Little change—current practice already leans this way.  
    - **Contracts**: Chaos. Parties could invalidate agreements by testifying to hidden understandings, destabilizing commerce.  
    - **Statutes**: Courts would dive into legislative history for every case, slowing rulings and privileging insider intent over public understanding.  

  - **Pure Textualism**:  
    - **Wills**: Absurd outcomes (e.g., "my Ford" going to the wrong John if context is barred). Estates frequently misdistributed.  
    - **Contracts**: Greater predictability but harsh results if language is ambiguous yet one party’s reading is "reasonable."  
    - **Statutes**: Rigid rulings ignoring clear legislative goals (e.g., refusing to add "not" to a botched prohibition).  

  ### **The Bill and Its Assumptions**
  The bill rests on two dubious premises:  
  1. **"Unified Subjectivity" Fallacy**: That intention only matters when a single mind authors the text. But as you note, wills are *already* co-authored (client + paralegal + attorney + templates). The bill falsely equates "automation" with erasing intent, when in fact AI is just another drafting tool—like a dictaphone or formbook.  
  2. **Meaning-as-Product**: It treats wills as *outputs* (like software) rather than *expressions*. This conflates contracts (where code *is* the performance) with wills (where language *points to* intent).  

  **Incoherence with Machine-Authored Contracts**:  
  If the legislature says AI-generated contracts "need no intention," but AI wills must be read textually, it reveals a deeper inconsistency:  
  - Contracts are seen as **self-executing mechanisms** (code as performance).  
  - Wills are seen as **messages** (requiring interpretation).  
  Yet both involve automation. The bill’s flaw is privileging *form* (automation) over *function* (testamentary expression vs. contractual performance).  

  ### **What Should You Think?**  
  1. **The bill mistakes tools for authors**. Automation doesn’t erase intent; it mediates it. A will drafted via AI still reflects the testator’s choices (e.g., inputting assets, beneficiaries). Barring extrinsic evidence here—but allowing it for human-drafted wills—is arbitrary.  
  2. **The line should be functional, not formal**:  
     - If a document *performs an act* (e.g., code executing payment), textualism suffices.  
     - If it *expresses a wish* (e.g., a will), intent must be sought.  
  3. **Ghostwriting is the key analogy**: Attorneys have drafted wills for centuries without negating intentionalism. AI is a new quill, not a new author.  

  ### **Conclusion: The Shape of the Argument**
  Legal interpretation is a mosaic of context-bound practices, not a unified theory of meaning. The bill’s error is applying a contract-like clarity rule to wills because it misdiagnoses automation as displacing agency. Push back by reframing the issue:  
  > **"Automation alters drafting efficiency, not the testamentary act. Where the law enforces a dead person’s wishes, gatekeeping intent evidence undermines probate’s core purpose—unless we believe machines, not humans, make bequests."**  

  Your philosophical friend’s "intentional fallacy" point (from Wimsatt/Beardsley) applies best to literature, where texts live beyond authors. But in probate, the author’s death *freezes* intent as the document’s lifeforce—making it irreplaceable. The legislature’s inconsistency reflects our discomfort with nonhuman agency, not a coherent theory of meaning.
