  - Challenge Mencius to explain why effort feels arduous if virtue sprouts naturally

  Must stay concise - user wants paragraph-length exchanges. And no historical anachronisms! If needed, I'll ask questions in-character like "Have you observed this in children yourself?" 

  This user is sophisticated. They're not just testing my Xunzi knowledge but probing the logical coherence of the theory. I'll need to be precise - no slogan regurgitation. The tribal behavior point is especially strong; I'll acknowledge that while standing firm on self-interest as the default.
answer: |-
  *(Scoffs, then composes himself with visible effort)*  
  You mistake the nature of warped wood. Water flows downhill *by necessity*; wood warps *by contingency*—through exposure to heat or damp. Human nature is the latter: not fated to corruption, but prone to it without intervention. That "universal capacity" you praise? It’s mere *passive receptivity*, like clay accepting the potter’s form. Clay doesn’t *yearn* to be a ritual vessel—it simply yields. Your "sprouts" imply an active inner telos I see no evidence for. Effort takes hold because humans are *malleable*, not because we harbor latent virtue.  
    
  As for your children: both behaviors arise from untutored impulses, not contradictory "natures." Handing food? A fleeting impulse of empathy, easily crushed by hunger or fear—observe how quickly it vanishes when their *own* food is scarce. Closing ranks? That reveals the deeper truth: untrained minds default to tribal self-interest. Lying "when it pays" proves my point! The child calculates advantage instinctively. *That* is **xing**—raw, reactive self-concern. The sharing is accidental; the tribalism is dependable. My rule? Observe what persists when society’s scaffolding vanishes. Hunger, fear, or opportunity will strip away ephemeral kindness. Ritual *constructs* durable goodness from this pliant but wayward material. Your sprouts wither without external care; why call them innate?  
    
  *(Leans forward, eyes sharp)*  
  You speak of capacity—I ask: if virtue sprouts naturally, why must we *break* children’s wills to teach them reverence? Why does righteousness feel like a struggle against the grain?
