prompt: |-
  I keep arguing with a friend about whether Malthus was right but early, and every round just turns into rescue moves: he says the Green Revolution only postponed the reckoning, I say that's unfalsifiable, he says its falsifiable just on a longer clock. Before we go another round I want the spec, not the verdict.

  Write me the desiderata an account of premature truth in long-run predictions has to meet. Concretely: what would a theory have to deliver for us to be able to say of a prediction — Malthus on population, the Club of Rome style resource ones, the peak oil ones — that it genuinely hasnt come due yet, as opposed to having been falsified and then quietly retro-fitted, or never having been testable in the first place. The purpose is fixed: good enough to adjudicate these retroactive claims in a way both of us would have had to accept before seeing how things turned out. For each requirement give the case or consideration behind it, and mark which are non-negotiable and which are really just one camp's prejudice.

  Three things I want tested as candidate requirements rather than assumed — dont feel obliged to keep any of them:

  - a trichotomy of rescues: date-shift (same mechanism, timeline slipped), domain-shift (it now applies to other regions, other species, or a horizon nobody alive will see), and mechanism-swap (population pressure quietly becomes resource pressure, or the positive check becomes the preventive one). Which are legitimate, and what does a theory have to specify in advance for a rescue to be legitimate rather than ad hoc?
  - a mortgage rule: every rescue has to cost something — give up a class of cases it used to claim, drop a prediction it used to make, or commit to some new observable. Real desideratum, or just my taste for Popperian bookkeeping?
  - a mirror test: if we would be embarassed to grant the same rescue to the opposite prediction, the rescue is degenerate. Is that a genuine test or does it just punish unpopular theories?

  Then tell me which single requirement does the most work at knocking out candidates, and whether any pair on your list cant be jointly satisfied — if so, which one you'd drop and why. Skip the scorecard for Malthus himself, I'll do that arguing with my friend. British English please.
reasoning: |-
  Okay, the user is having a recurring argument with a friend about whether Malthusian predictions were "right but early" versus falsified. They want a framework to adjudicate such claims without getting into another unresolved debate. The core request is for desiderata (requirements) that a theory of "premature truth" must meet to credibly claim a prediction hasn't yet been falsified but merely delayed. 

  Hmm, the user specifically mentions three contested ideas they want tested as potential requirements: a trichotomy of rescues (date-shift, domain-shift, mechanism-swap), a mortgage rule (cost for each rescue), and a mirror test (symmetry for opposite predictions). They also emphasize this isn't about scoring Malthus but building a neutral evaluation toolkit. 

  First, I need to map the philosophical landscape. The key tension is between falsificationism (Popper) and paradigms (Kuhn/Lakatos). The user's "mortgage rule" is clearly Popperian, while their friend's "longer clock" resembles Lakatosian protective belts. The challenge is creating criteria both camps might accept pre-hoc. 

  For the desiderata, I'll start with non-negotiables: 
  - **Causal specificity** is essential because vague mechanisms (e.g., "resource scarcity") can be retrofitted to anything. Malthus originally specified geometric vs arithmetic growth—this must constrain rescues. 
  - **Pre-registered observables** prevent goalpost-moving. If a theory predicts famine but switches to "social unrest" when famines decrease, that's ad hoc without prior commitment. 
  - **Rescue scope limits** must block infinite escapes (e.g., claiming the prediction applies only after human extinction). 

  Now the negotiables: 
  - The **mortgage rule** (cost for rescues) feels important but might be too Popperian. Their friend could argue Lakatos allows cost-free auxiliary hypotheses. I'll present it as useful but debatable. 
  - The **mirror test** (symmetry) is elegant but risks unfairness—unpopular theories face higher scrutiny. Still, it usefully flags special pleading. 
  - **Domain-shift rescues** (e.g., "Malthus applies to insects now") need strict boundaries to avoid becoming unfalsifiable. 

  The trichotomy needs refinement: 
  - **Date-shifts** are legitimate only with pre-specified max delays or new evidence justifying delay. 
  - **Domain-shifts** require clear pre-commitments (e.g., "if not humans, then mayflies"). 
  - **Mechanism-swaps** are the trickiest—they must retain the core causal engine (e.g., Malthus's growth vs limits tension). 

  The knockout test is **causal specificity**. If a rescue abandons the original mechanism (e.g., replacing Malthusian checks with market innovation), it’s falsified. Peak oil fails here—fracking shattered its depletion model, so it’s dead, not delayed. 

  Tensions arise between **pre-registered observables** and **domain-shifts**—if a theory escapes to new domains, it might violate prior commitments. I’d drop strict domain-shifts unless heavily constrained. 

  Ultimately, the framework must force theorists to "put up or shut up" pre-emptively. The user’s friend can’t just say "reckoning postponed indefinitely"; they must state how long, what observable, and what would kill the theory. That’s the only way to stop moving goalposts.
answer: |-
  Here’s a specification for adjudicating "premature truth" claims in long-run predictions (e.g., Malthus, resource depletion, peak oil). Desiderata are ranked by knockout power, with cases illustrating each. Non-negotiables (**bold**) prevent unfalsifiable escapes; negotiables (*italics*) reflect methodological preferences.

  ---

  ### **Core Desiderata**  
  1. **Causal Mechanism Specificity**  
     - **Non-negotiable**. The theory must pre-specify:  
       - The *primary causal driver* (e.g., Malthus’s "geometric population growth vs. arithmetic resource growth").  
       - The *operating scale* (e.g., global vs. regional, human vs. multi-species).  
     - **Case**: Peak oil predictions failed because fracking and deep-sea extraction altered the *causal chain* (scarcity → innovation). If the mechanism is retrofitted (e.g., "peak oil now means *unaffordable* oil"), it’s falsified.  
     - **Knockout power**: Highest. Vague mechanisms enable infinite rescues.

  2. **Pre-registered Observables**  
     - **Non-negotiable**. The theory must define:  
       - *What evidence falsifies it* (e.g., sustained per-capita resource growth without catastrophe for 50 years).  
       - *Critical thresholds* (e.g., population doubling without famine).  
     - **Case**: Club of Rome’s *Limits to Growth* (1972) predicted collapse by 2000. When none occurred, modelers shifted timelines *without new thresholds*. This fails.  
     - **Tension with**: Domain-shifts (see below). If observables aren’t binding, domain-shifts become escapes.

  3. **Rescue Scope Limits**  
     - **Non-negotiable**. Rescues must declare *in advance*:  
       - Maximum allowable delay (e.g., "reckoning by 2200, else falsified").  
       - Boundaries for domain-shifts (e.g., "only applies to vertebrates, not insects").  
     - **Case**: Malthusians claiming "it’ll apply after nuclear war" is invalid without pre-commitment to such contingencies.  
     - **Mirror test link**: If a cornucopian said "abundance is inevitable... *after aliens give us fusion*", we’d reject it. Symmetry matters.

  ---

  ### **Negotiable Desiderata**  
  4. *Mortgage Rule (Cost for Rescues)*  
     - **Negotiable** (Popperian taste). Each rescue must surrender a prior claim, e.g.:  
       - Date-shift → Shorten max timeline for future predictions.  
       - Domain-shift → Exclude regions/species previously claimed.  
       - Mechanism-swap → Abandon auxiliary assumptions (e.g., "preventive checks can’t *permanently* avert crisis").  
     - **Case**: If Green Revolution "postponed" Malthus, theorists must drop "technology can’t outpace population" as a universal law.  
     - **Objection**: Lakatosians argue progressive research programmes *add* hypotheses without immediate cost.  

  5. *Trichotomy Legitimacy Rules*  
     - **Negotiable** (methodological rigour). Rescues are valid only if:  
       - **Date-shift**: New data justifies delay (e.g., discovery of unknown resource reserves). *Not* mere timeline extension.  
       - **Domain-shift**: Pre-declared scope (e.g., "only nations ignoring birth control"). *Not* retroactive narrowing ("Malthus only meant Sub-Saharan Africa!").  
       - **Mechanism-swap**: Core causal structure remains (e.g., "preventive checks" replacing "positive checks" *still* assumes growth > resources).  
     - **Case**: Neo-Malthusians swapping "famine" for "climate collapse" as the "check" is illegitimate if the driver (growth vs. finite systems) wasn’t central.  

  6. *Mirror Test*  
     - **Negotiable** (anti-hypocrisy heuristic). If granting a rescue to Theory X (e.g., "Malthus was early") would force you to accept it for Theory ¬X (e.g., "Simon’s cornucopianism was right but late"), the rescue is degenerate.  
     - **Case**: Claiming "resource collapse was delayed by tech" must also allow "tech-driven abundance was delayed by regulation".  
     - **Flaw**: Punishes minority theories unfairly if mainstream gets passes.  

  ---

  ### **Key Tensions & Trade-offs**  
  - **Fatal tension**: **Pre-registered Observables** vs. *Domain-shifts*. If a theory escapes to new domains (e.g., "Malthus applies to *bacteria* now"), it likely violates pre-set observables. **Drop domain-shifts** unless strictly bounded (e.g., "only for mammals").  
  - **Strongest knockout**: **Causal Mechanism Specificity**. Vague mechanisms (e.g., "scarcity manifests as conflict or innovation") let *any* outcome fit.  
  - **Weakest link**: *Mirror Test*. Useful heuristic but vulnerable to bias ("my theory deserves more rescues").  

  ---

  ### **Adjudication Protocol**  
  To claim "not falsified yet" credibly *pre-hoc*, a theory must:  
  1. **Specify its causal engine** (non-negotiable).  
  2. **Define expiry conditions** (e.g., "if global fertility < replacement for 100 years, falsified").  
  3. **Pre-commit rescue costs** (e.g., "one date-shift allowed, max 50 years, then surrender X prediction").  

  Without these, "early but right" is indistinguishable from unfalsifiable dogma. Now go forth and argue with your friend — with clearer rules. 🇬🇧
