answer: |-
  ### Internal Item Writer's Manual (Version 7.2.1)  
  *Excerpt: Alphabetic Analogies, §§12–18*  

  **§12. Successor Operations**  
  12.1. The *successor* of a letter is the immediately subsequent letter in the standard Roman alphabet (a→b, k→l, etc.).  
  12.2. For terminal letter `z`, no successor exists under §12.1.  
  12.3. If all letters in an item form a contiguous subset (e.g., `m,n,o`), redefine successors within this subset (e.g., `o` has no successor if `p` is absent).  
  12.4. **Reversal Clause**: When §12.3 applies, the subset’s terminal letter has no successor, unless the item contains `z` and at least one of `a` or `y`, in which case successors wrap to `a` (e.g., `z→a`).  

  **§13. Token vs. Type Identity**  
  13.1. "The same letter" denotes *type-identity* (e.g., all `q` tokens share type `q`).  
  13.2. In positional operations (e.g., "last letter"), "same letter" refers to *token-identity* at the specified position.  
  13.3. If tokens in a run share type-identity (e.g., `xx`), §15 overrides §13.2.  

  **§14. Run Transformations**  
  14.1. A "run" is a maximal sequence of identical type-identical tokens (e.g., `abb` has a terminal run `bb`).  
  14.2. When altering "the last letter," target only the terminal token (§13.2), unless §15.1 applies.  

  **§15. Run Override Clause**  
  15.1. If the terminal run length in the source pair (A→B) exceeds one token, apply the transformation to the *entire run* in the target pair (C→D).  
  15.2. **Reversal Clarification**: §15.1 supersedes §14.2 only if the run’s type-identity is materially identical to the successor’s domain in B.  

  **§16. Sample Item & Key**  
  > **Item:** `pp : pq :: zz : ?`  
  > **Official Answer:** `za`  
  > **Explanation**:  
  > Stem pair (`pp→pq`): The last token `p` (§13.2) is replaced by its successor `q` (§12.1). Target pair (`zz→?`): Here, §12.3 applies (letters `p,q,z`; contiguous subset undefined due to gap `r–y`). Thus, successors default to standard alphabet (§12.1). Since `z` has no successor (§12.2), §12.4 triggers (wrap to `a`). However, §15.1 does *not* apply (stem run length is one token per §13.2: `p`→`q` alters one token). Thus, only the terminal `z` token changes to `a`, yielding `za`.  

  **§17. Exception Flags**  
  17.1. Tag items with `z`, terminal runs >1, or non-contiguous subsets with `[EC]` (Edge Case).  
  17.2. `[EC]` items require dual validation by Senior Writers.  

  ---

  **Appendix D: Dissenting View on Ambiguity (Writer Δ)**  
  *Re: Manual §12.4, §15.1, and [EC] Designation*  

  The manual’s attempt to resolve slippage (e.g., successor boundaries, token-run ambiguity) via layered exceptions (§12.4, §15) mischaracterizes the core mechanic. What is classified as "edge cases" (§17) are not defects but *necessary* ambiguities inherent to analogical reasoning. The cognitive process tested relies on dynamic reinterpretation: e.g., whether `zz→za` (token change) or `zz→aa` (run change) depends on contextual pressures (e.g., stem run coherence, alphabet contiguity). This "slippage" is the feature, not the bug—it mirrors real-world abstraction shifts. Legislate it away, and the item measures rule-memorization, not fluid analogy. The [EC] tag (§17) thus pathologizes the phenomenon the benchmark exists to assess.  

  —  
