  The user's own nightmare question (parametrization-dependence of information gain) is valid but possibly not the deadliest. The real killer might be the homunculus problem - if calculating expected information gain requires a meta-model, haven't we just regressed the problem? 

  For concessions: Slide 1 should surrender that precision works for uncorrelated noise/static sensing. Slide 2 should admit yield borrows from active vision but extends to hierarchical inference. 

  The irreplaceable rebuttal is the dissociation prediction: cases where yield says "turn gain down despite louder errors" that precision can't explain. That's the empirical wedge.

  Now structuring the 8 objections by damage level:
