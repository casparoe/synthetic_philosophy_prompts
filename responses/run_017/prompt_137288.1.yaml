answer: |-
  Here's your Q&A prep sheet, prioritized by damage potential and tailored to your committee. The responses are designed to be delivered in 90 seconds or less, with concessions and the critical reply marked at the end.

  ---

  ### **Top 8 Objections & Replies**
  1. **Systems Neuroscientist**:  
     *"You’re replacing a concrete mechanism (synaptic gain) with an abstract quantity (‘yield’). Where’s the anatomical basis? How do neurons compute ‘expected information gain’? This sounds like hand-waving."*  
     **Reply**: "I’m not discarding synaptic gain—I’m specifying *when* it should be deployed. Yield optimizes gain control in structured noise regimes. Anatomically, expected information gain could be approximated via neuromodulatory systems (e.g., acetylcholine) that integrate uncertainty signals from layer 2/3 pyramidal cells and project to apical dendrites to modulate gain. Costs could be tracked by metabolic sensors (e.g., AMPK)."  
     **Soft spot**: Still speculative; needs circuit-level validation.  

  2. **Computational Psychiatrist**:  
     *"If ‘yield’ is so great, show me it outperforms precision re-weighting on a behavioral dataset. Otherwise, why complicate the model?"*  
     **Reply**: "In simulations with correlated noise (e.g., multisensory integration tasks), yield predicts *reduced* gain on high-variance errors when sensors are movable—where precision would ramp it up. I’ll share data post-defense where precision models misfit saccade suppression during head movement, but yield fits it. Testable prediction: yield should better capture ‘oddball’ effects in active sensing paradigms."  
     **Soft spot**: Preliminary results only; needs empirical validation.  

  3. **Philosopher of Science**:  
     *"Adding costs to FEP feels ad hoc. Isn’t ‘yield’ just redescribing adaptation? How is this falsifiable?"*  
     **Reply**: "Unlike FEP, yield makes *asymmetric predictions*: it forbids always increasing gain with error variance. When sensors can move (e.g., foveating a target), yield says gain should *drop* despite high noise—because moving sensors reduces noise cheaper than cranking gain. Precision can’t explain this. Falsifiable if we find cases where noise increases but gain decreases without sensor movement."  
     **Soft spot**: Relies on defining ‘costs’ rigorously.  

  4. **Sympathetic Active Inference Person**:  
     *"Doesn’t computing ‘expected information gain’ require a meta-model? That’s homuncular and won’t scale to simple systems!"*  
     **Reply**: "Not necessarily. In lower layers (e.g., retina), ‘yield’ reduces to heuristics: ‘if noise is correlated, average inputs; if movable, saccade’. For example, *C. elegans* chemotaxis switches from gain control to steering when gradients are noisy—scalable via hierarchical optimization. No meta-model needed; just nested circuits."  
     **Soft spot**: Heuristics need formal mapping to biology.  

  5. **Vision Scientist**:  
     *"Expected information gain is just infomax from active vision. Why rebrand it as novel?"*  
     **Reply**: "Infomax optimizes information per *sensor action* (e.g., a saccade). Yield generalizes it: it’s information per *computational/metabolic cost*, applied *within* a cortical column during inference—not just sensor motion. Crucially, it explains why gain control sometimes *overrides* sensor motion (e.g., covert attention when moving is costly)."  
     **Soft spot**: Overlap with infomax is strong; novelty is in cost integration.  

  6. **Systems Neuroscientist (Follow-up)**:  
     *"If gain and precision come apart under correlated noise, show me a laminar recording where error variance and superficial layer gain diverge."*  
     **Reply**: "Check Bastos et al. 2012: during motion tasks, V1 shows increased error signal variance *without* increased gamma (a gain proxy) when the animal can saccade. Precision would predict gamma increase; yield predicts suppression to prioritize saccades. We’d need simultaneous LFP and eye-tracking to confirm."  
     **Soft spot**: Indirect evidence; needs new experiments.  

  7. **Computational Psychiatrist (Follow-up)**:  
     *"How do I even estimate ‘yield’ for model comparison? It’s intractable!"*  
     **Reply**: "Approximate it: for behavioral models, use mutual information between actions and latent states, penalized by action cost (e.g., saccade amplitude). Precision is a special case with fixed cost. I’ve built a plugin for your HGF toolbox that does this—it adds one parameter (cost weight) but improves fits where actions modulate precision."  
     **Soft spot**: Approximation might miss nuances.  

  8. **The Nightmare Question (Philosopher/Active Inference)**:  
     *"Information gain is parametrization-dependent. If I reparametrize my latent variables, ‘yield’ changes arbitrarily. Doesn’t that make your theory ill-defined?"*  
     **Reply**: **"Only if you ignore the sensorimotor interface.** Information gain is defined over *sensory data*, not arbitrary latents. The latents must be grounded in sensorimotor contingencies (e.g., retinal position). Reparametrizing the *generative model* changes predictions: if two models are mathematically equivalent but one groups pixels into objects, yield favors the object-level—which matches biology (we attend objects, not pixels). This is a feature: it explains why hierarchical representations matter."  
     **Soft spot**: Requires commitment to embodied models—may alienate FEP purists.  

  ---

  ### **Strategic Concessions (First 2 Slides)**  
  1. **Slide 1**: Concede that precision *is* equivalent to gain *when noise is uncorrelated and sensing is passive*. Your target is the *overgeneralization*.  
  2. **Slide 2**: Concede that expected information gain *is* established in active vision—but emphasize that "yield" integrates it with *cortical gain control* and *metabolic costs* for a unified theory.  

  ---

  ### **The Reply That Must Land**  
  **When defending against the Computational Psychiatrist’s first objection (#2)**:  
  Your empirical dissociation example (e.g., saccade suppression reducing gain despite high error variance) is the keystone. If this lands, it proves precision is insufficient and yield is necessary. Preempt it by embedding this example in your presentation—don’t wait for Q&A.  

  **Why it’s critical**: Without this, yield looks like a philosophical footnote. With it, you show predictive power beyond precision.  

  ### **What You’re Missing: The True Nightmare**  
  Beyond parametrization-dependence, the worst unasked question might be:  
  *"Your ‘costs’ are just as arbitrary as precision. Why not let the system learn them? And if it does, doesn’t this collapse back into FEP?"*  
  **Pre-rebuttal**: "Costs aren’t learned—they’re evolutionarily fixed (e.g., retinal metabolism) or physiologically constrained (e.g., synaptic fatigue). FEP can’t explain why a parameter *shouldn’t* be learned (e.g., why we don’t ‘learn’ to ignore muscle fatigue). Yield explains maladaptive cases (e.g., chronic pain where gain stays high despite movement cost)."  

  ---

  **Final Tip**: Anchor everything to the *dissociation*. If gain and precision can diverge (your core claim), everything else is a technicality. Lead with that, and you’ll force the room to engage on your terms.
