answer: |-
  ## The Fragility of Conditionals: Why Dispositions Demand Grounding

  The simple conditional analysis (SCA) offers an elegantly austere account of disposition ascriptions: An object *x* is disposed to manifest response *R* when subjected to stimulus *S* if and only if *x* *would* manifest *R* if *x* were subjected to *S*. Formally: *D(S,R)x ≡ (S □→ R)x*. This analysis promises to reduce disposition talk to familiar counterfactual conditionals. Its failure, however, is swift and decisive through two classic counterexamples, breaking the biconditional in crucially distinct ways.

  The first is the **finkish disposition**. Imagine a fragile glass hooked to an infallible sorcerer who instantly and permanently makes it non-fragile (e.g., by encasing it in resin) the *moment* any striking force is applied. The stimulus (striking) triggers the removal of the very basis of the disposition. According to SCA, the glass *is* fragile: If struck, it *would* shatter. But intuitively, thanks to the sorcerer, it *lacks* the disposition to shatter when struck – the antecedent is true, the consequent is true, but the disposition ascription is false. This breaks the *sufficiency* of the conditional for the disposition: (S □→ R) can hold without *D(S,R)*.

  The second is the **masked disposition**. Imagine a powerful electromagnet that, whenever a fragile glass is struck, instantly generates a force field holding the glass together, preventing shattering. The glass retains its fragile microstructure (its causal basis). According to SCA, the glass is *not* fragile: If struck, it *would not* shatter (thanks to the mask). But intuitively, it *is* fragile; an intrinsic property remains, merely prevented from manifesting. This breaks the *necessity* of the conditional for the disposition: *D(S,R)* can hold without (S □→ R).

  The difference matters profoundly. Finks break SCA because the stimulus *removes the disposition* before manifestation. Masks break SCA because the stimulus *co-occurs with something preventing manifestation* while the disposition persists. Any successful repair must handle both the disappearance of the disposition (finks) and the prevention of its manifestation despite its persistence (masks).

  **Repair Attempt 1: Ceteris Paribus.** The natural move is to qualify the conditional: *x* is disposed to *R* in *S* iff *x* *would* *R* if *S*, *ceteris paribus* – that is, "other things being equal" or "in normal conditions." This aims to exclude finks and masks as "abnormal" interferers. The strongest formulation insists the *ceteris paribus* clause refers to conditions where *only* the stimulus occurs, or where no *extrinsic* preventers or removers are present.

  This repair fails. The clause "no extrinsic preventers or removers" is viciously circular. What counts as a "preventer" or "remover" *just is* something that would interfere with the manifestation of the disposition we're trying to analyze. Defining "normal conditions" non-circularly is impossible without smuggling in dispositional concepts (e.g., "conditions where the object's intrinsic properties causally determine the outcome"). The clause becomes either question-begging or vacuous. If "normal" means "conditions where dispositions manifest when triggered," the analysis is circular. If it means something like "statistically frequent conditions," it fails, as fragility manifests rarely in museums yet is clearly present.

  **Repair Attempt 2: Gradability.** Perhaps dispositions are not all-or-nothing but come in degrees, analyzed probabilistically: *x* is disposed to degree *d* to *R* in *S* iff in a suitably high proportion *p* (where *p ≥ d*, and *d* is contextually fixed) of relevant *S*-scenarios, *x* would manifest *R*. The "relevant" scenarios might exclude worlds where finks or masks operate.

  This repair also crumbles. First, context-dependence renders the analysis too flexible and vague; whether an object "counts" as disposed becomes hostage to conversational salience, not its intrinsic properties. Second, and fatally, it conflates the *strength* or *reliability* of a disposition with its very *existence*. Consider the flickering masker:

  1.  **Flickering Masker:** A copper wire is connected in series with an indeterministic interrupter. On every occasion where current *would* flow if the interrupter were closed, the interrupter objectively has a 0.6 chance of being open (blocking current) and a 0.4 chance of being closed (allowing current). The wire's intrinsic conductive microstructure is identical across all trials. Is the wire conductive? To what degree?
      *   *Ceteris Paribus Analysis:* Struggles. If "normal" excludes the interrupter, it says conductive. But the interrupter is part of the setup, making "normal" ambiguous. Likely verdict: Not conductive (since current rarely flows).
      *   *Gradable Analysis:* Predicts the wire is disposed to conduct to degree 0.4. Conductivity is contextual and probabilistic.
      *   *Basis-Grounded Analysis:* Predicts the wire is *fully* conductive. Its intrinsic microstructure (electron mobility) remains unchanged; the interrupter is an extrinsic masker preventing manifestation in 60% of cases. The disposition persists.
      *   **Verdict:** The gradable analysis gets the *degree* wrong. Intuition strongly suggests the wire *is* conductive, full stop. Its ability to conduct is intrinsic; the interrupter merely masks that ability frequently. The basis-grounded account captures this: conductivity depends on the wire's structure, not the statistics of external blockers. The gradable analysis wrongly reduces the intrinsic disposition to an extrinsic probability.

  The gradable analysis fails because it cannot distinguish between an object having a weak disposition (e.g., a slightly fragile glass) and an object with a strong disposition frequently masked. The flickering masker highlights this: the *disposition* (conductivity) is categorical and intrinsic; its *manifestation rate* is low due to extrinsic factors. Gradability confuses manifestation frequency for dispositional strength.

  **Novel Cases and Theoretical Verdicts:**

  2.  **Reset Fink:** A conductive wire is connected to a probe via a relay. The instant the probe makes contact (*S*), the relay opens, breaking the circuit. Precisely one millisecond later, the relay closes again (*with the probe still in contact*), and current (*R*) immediately flows. The wire's intrinsic properties are unchanged throughout; only the circuit topology alters briefly. Is the wire disposed to conduct when touched by the probe? Was the disposition finked away or merely masked?
      *   *Ceteris Paribus Analysis:* Likely says *not* disposed. The "normal" causal chain is interrupted immediately upon stimulus; current doesn't flow when the stimulus is first applied.
      *   *Gradable Analysis:* Context dependent. If the context focuses on immediate response, degree ~0; if it allows a short delay, degree 1. Unstable.
      *   *Basis-Grounded Analysis:* Predicts the wire *is* disposed to conduct. Its intrinsic conductive basis persists entirely unchanged. The relay is a *mask* that blocks manifestation *only* for the first millisecond of contact. The disposition was never removed (finked), only temporarily prevented from manifesting.
      *   **Verdict:** Intuition is **unsettled but leans towards disposition present**. The extremely brief interruption feels like a transient block (masking), not a destruction of the underlying property (finking). The basis-grounded account provides a principled distinction: finks destroy/modify the basis, masks leave it intact but block its operation. Here, the basis is untouched. This commits the basis-grounded view to dispositions not requiring *immediate* manifestation; a very short, extrinsic delay before manifestation is compatible with the disposition persisting. The crucial point is the *persistence of the basis* during the stimulus.

  3.  **Enabler that Masks:** A superconducting loop requires a cryogenic field to be superconducting. By a law of nature, this very same cryogenic field *instantaneously and necessarily* collapses (quenches) the *moment* any current *would* begin to flow through the loop. Without the field, the loop has zero conductivity. With the field present, current *never* flows because the field quenches the instant flow would start. Does the loop conduct electricity?
      *   *Ceteris Paribus Analysis:* Paralysis. Including the field's quenching behavior violates "normal conditions" for superconductivity, but excluding it removes the enabler *making* it superconducting. Likely incoherent or verdict: not disposed.
      *   *Gradable Analysis:* Degree 0. Current *never* flows.
      *   *Basis-Grounded Analysis:* This is the hardest case. If the basis is the loop's microstructure *only when the field is active*, then: When the field is on, the basis for superconductivity exists. However, the law linking the basis to *manifestation* (current flow) is broken by the simultaneous quenching law. The basis exists, but the manifestation *cannot* occur due to the quenching. The view must say either: 1) The loop *is* disposed to superconduct, but manifestation is *necessarily* masked by the quenching (analogous to permanent masking), or 2) Part of the "basis" *includes* the stable presence of the enabling field *without* the quenching law, which isn't satisfied, so no disposition exists. Option 1 seems more consistent.
      *   **Verdict:** Intuition is **sharply conflicted and genuinely unsettled**. There's a strong pull to say "No, it never conducts, so it's not superconducting." Yet, there's also a pull to say "But when the field is on, it *is* superconducting, it just can't *show* it because showing it kills the field." The basis-grounded account (Option 1) can capture the latter intuition by separating the existence of the basis from the possibility of manifestation. However, it highlights a potential cost: divorcing dispositions too far from their manifestations. The conditional analyses clearly fail; they see no manifestation and declare no disposition. This case exposes the deepest tension.

  **Conclusion: The Grounding Imperative**

  The pattern of verdicts decisively favors a basis-grounded account. The SCA fails fundamentally on finks and masks. The ceteris paribus repair is circular; the gradable repair conflates intrinsic disposition with extrinsic manifestation frequency, failing on the flickering masker. The reset fink strongly suggests that dispositions persist if their intrinsic basis persists, even through brief extrinsic blocking. While the enabler-masker case is thorny, the basis-grounded view offers the best hope of capturing the intuition that *something* dispositional is present when the field is active, even if it's necessarily frustrated.

  The basis-grounded view holds that *x* is disposed to *R* in *S* iff *x* possesses some intrinsic, non-dispositional (categorical) property *B* (the causal basis) such that *B*, in conjunction with *S* and the laws of nature, would (or would be disposed to) cause *R*, barring extrinsic interference. The corresponding conditional *(S □→ R)* is often good *evidence* for the disposition, but it is neither necessary (due to masks) nor sufficient (due to finks); its truth depends on the presence and persistence of *B*.

  This faces two significant costs:

  1.  **Circularity Threat:** Bases are often specified dispositionally (e.g., "the molecular structure *responsible for* fragility"). *Reply:* The basis itself is *categorical* – it is the specific atomic arrangement. The dispositional description ("responsible for") is merely a gloss on its causal role *given the laws*. The basis is the non-dispositional ground *in virtue of which* the object has the dispositional profile. The analysis isn't circular because *B* is not defined dispositionally; its causal powers are fixed by its categorical nature and the laws.
  2.  **Multiple Realizability:** Very different bases (e.g., glass microstructure, chocolate Easter egg thinness) can realize the same disposition (fragility). *Reply:* This is a *virtue*, not a cost. It explains why diverse objects share dispositions – they share the relevant *causal profile* (manifesting *R* when *S*) grounded in their distinct but functionally similar bases. The disposition is the higher-order property of having *some* basis that plays the *R*-in-*S* role.

  The strongest objection is **epistemic**: If dispositions are grounded in hidden categorical bases, and the simple conditional is defeasible evidence, how can we ever *know* an object has a disposition? Manifestation might always be masked or finked without our knowing.

  **Non-Question-Begging Reply:** Knowledge of dispositions is indeed fallible and evidence-based, but not solely reliant on single counterfactuals. We rely on *patterns* of behavior across *multiple* tests under *varied* conditions, seeking to eliminate potential masks and finks, alongside theoretical understanding (e.g., material science) that reveals the relevant categorical bases and their connection to manifestations. The failure of the conditional in specific scenarios (finks/masks) doesn't undermine this methodology; it refines it by showing why we need robust testing and theory. We infer the stable basis from its reliable (though not infallible) causal signature across contexts. The basis-grounded view doesn't make dispositions unknowable; it accurately reflects the empirical, defeasible nature of our knowledge of causal powers. The conditional analysis fails precisely because it promises a simplistic, non-defeasible link that the world does not provide. Dispositions are real properties grounded in the categorical structure of objects; their manifestations are the often-visible, but sometimes obscured, signatures of that hidden architecture.
