prompt: |-
  You are a philosopher of science who works on formal models of fairness and has taught this material to mixed graduate audiences several times. Think carefully before you answer, and open with a short brainstorming paragraph: what are the two or three things my classmates should actually be able to do by minute fifty? I want a plan for teaching, not an explanation of the results, and no readings.

  I'm a master's student in an algorithmic fairness seminar, and I'm leading next week's fifty-minute discussion section for about fifteen classmates, half from computer science and half from public policy and law. They have all met the criteria — calibration (a given score carries the same implication about the outcome in each group), error-rate balance or equalized odds (equal false positive and false negative rates), predictive parity (equal positive predictive values) — and they know the headline that, absent equal base rates or a perfect predictor, these cannot all hold at once. Most of them are drawing the wrong moral from it.

  Please give me:

  1. The order the pieces have to go in, with a sentence on what depends on what — including what has to be on the board before any of the criteria are written down.
  2. The single case that should carry the whole session, what it has to contain, what it has to avoid, and why not the usual pretrial risk or lending examples if you would skip them.
  3. Four misconceptions to expect, and the exact point in the sequence to defuse each. My guesses are that fairness is mathematically impossible so the choice is merely political, that dropping group membership from the inputs dissolves the conflict, that a better model would satisfy all three at once, and that this is really just an accuracy-versus-fairness trade-off — but replace any of mine that are weak.
  4. Where to place the point I most want them to leave with, which I have not seen made explicit anywhere: that these results concern a single decision rule audited on a fixed joint distribution, so that two variations fall outside their scope — a system with a third output that routes the case to expensive human review, and a system whose decisions reshape the distribution it will later be audited on, as when denials themselves bring about the outcome being predicted. Say what carries over to each case and what does not.
  5. One question to put on the board at the end that separates understanding the structure from having memorized the labels, and two things I should openly decline to get into at this level.
reasoning: |-
  We are teaching a 50-minute session to a mixed group of CS and policy/law students who already know the three criteria (calibration, equalized odds, predictive parity) and the headline impossibility result. The goal is to correct misconceptions and build understanding of the structural reasons for the impossibility.

  Brainstorming: By minute fifty, classmates should be able to:
  1. Reconstruct the core argument of the impossibility theorem in a simple case without memorizing formulas.
  2. Articulate why the impossibility arises from the base rate differences and the constraints of the criteria, and why it is not about model quality or data inclusion.
  3. Recognize that the impossibility holds for a fixed decision rule and fixed distribution, and identify when real-world dynamics (like feedback loops or human-in-the-loop) might change the situation.

  Now, the plan:

  1. **Order of Pieces**:
     - Start with the base rates: Write down the base rates (prevalence) for two groups. (This must be on the board before writing any criteria because the entire conflict stems from base rate differences.)
     - Then, state the three criteria in terms of conditional probabilities (without formulas, but in words). Write them as:
          - Calibration: For any score value, the probability of the true outcome is the same in both groups.
          - Equalized Odds: The true positive rates and false positive rates are equal across groups.
          - Predictive Parity: The positive predictive value (PPV) is the same across groups.
     - Show that if base rates are equal and the predictor is perfect, all three hold. Then, relax perfect predictor: show that if base rates are equal, we can have calibration and equalized odds (and then predictive parity follows) without perfection? Actually, we don't need perfection, but we can have two at once. However, the key is when base rates are unequal. So:
          - If base rates are unequal, then if we have calibration and equalized odds, we can derive that the PPVs must be different? Actually, the impossibility is that all three cannot hold simultaneously when base rates are unequal and the predictor is not perfect.
     - The dependency: The base rates are the starting point. Then, the criteria impose constraints on the joint distributions. The impossibility comes from the fact that the three criteria, together with the base rate inequality, lead to a contradiction (or require the predictor to be perfect).

  2. **The Single Case**:
     - We avoid the usual examples (pretrial risk, lending) because they are emotionally charged and might lead students to focus on the domain rather than the math. Also, they often have feedback loops or other complexities that we want to avoid at first.
     - Instead, use a neutral, made-up example: **Predicting whether a student will solve a puzzle in under 2 minutes** in two groups (say, Group A and Group B). The puzzle is the same, but the groups might have different base rates due to prior exposure or other factors.
     - The case must contain:
          - Two groups with different base rates (say, Group A: 60% solve the puzzle, Group B: 40% solve the puzzle).
          - A predictor (say, a quick test) that we will try to make fair by the three criteria.
          - Avoid: any real-world implications, feedback loops, or causal claims. Keep it purely predictive and static.
     - Why this case: It's neutral, doesn't carry baggage, and the students can focus on the probabilities.

  3. **Four Misconceptions and When to Defuse**:
     - (1) Misconception: Fairness is mathematically impossible so the choice is merely political.
          - Defuse: After presenting the impossibility in the example, emphasize that the impossibility is about satisfying all three at once. We can still satisfy two, and the choice of which two is a value judgment. But also, note that there are other fairness criteria (like demographic parity) that we are not considering here. So the "impossibility" is specific to these three.
          - When: After showing the impossibility in the example.

     - (2) Misconception: Dropping group membership from the inputs dissolves the conflict.
          - Defuse: Explain that the criteria are about the outputs and the outcomes, not the inputs. A model that doesn't use group membership can still violate these criteria because the base rates are in the data. Show with the example: if the model doesn't use group, it might still have different error rates if the base rates differ.
          - When: When introducing the criteria, or when someone asks if we can avoid the problem by not using group.

     - (3) Misconception: A better model would satisfy all three at once.
          - Defuse: After the example, show that even a perfect model (which by definition has 100% TPR and 0% FPR, and is calibrated) would satisfy all three, but only if base rates are equal. If base rates are unequal, a perfect predictor would have different PPVs? Actually, a perfect predictor would have PPV=1 for both groups, so it would satisfy predictive parity. But the impossibility result says that if the predictor is not perfect and base rates are unequal, then we cannot have all three. So if the model is perfect, we can have all three regardless of base rates. But in reality, we don't have perfect models. So the point is: when the predictor is not perfect and base rates are unequal, we cannot have all three. If we had a perfect predictor, we would. But we don't. So the conflict is inescapable for real models when base rates differ.
          - When: After showing the example with a non-perfect predictor.

     - (4) Misconception: This is really just an accuracy-versus-fairness trade-off.
          - Defuse: The trade-off is not between accuracy and fairness, but among different fairness criteria. We can have high accuracy and still face the impossibility. The conflict is among the fairness definitions themselves.
          - When: When discussing the implications of the impossibility.

  4. **The Point About Variations**:
     - Place this at the end, after establishing the impossibility in the static case.
     - The core point: The impossibility result applies to a single decision rule applied to a fixed population (with a fixed joint distribution of features, group, and outcome). Two variations fall outside:
          - (a) A system with a third output (e.g., "send to human review"): Here, the decision is not binary, so the criteria (which are defined for binary decisions) might not directly apply. Also, the human review might change the outcome distribution. We might avoid the impossibility by having a more complex system, but we would need to define fairness for this new structure.
          - (b) Feedback loops: When the decisions (e.g., denials) affect the future outcomes (e.g., if a loan denial leads to worse credit, which then affects future predictions). In this case, the distribution is not fixed, so the impossibility (which assumes a fixed distribution) might not hold. But note: the criteria are defined for a snapshot, so in a dynamic setting, we might have new challenges.
     - What carries over: The mathematical constraints still operate at each snapshot, but the dynamics might change the base rates over time. So the impossibility might reappear at each step, but the system could be designed to avoid it by changing base rates? Not necessarily.

  5. **Final Question and Boundaries**:
     - Question to put on the board at the end: 
          "Suppose we have a predictor that satisfies calibration and equalized odds for two groups with different base rates. What must be true about the positive predictive value in each group? And why?"
          (Answer: The PPV must be higher in the group with the higher base rate. Because from calibration and equalized odds, we can derive that the PPV is a function of the base rate and the common TPR and FPR. Since the base rates are different, the PPVs must be different.)

     - Two things to decline:
          - (1) The detailed mathematical derivation of the impossibility theorem (we are focusing on the intuition and the example).
          - (2) The debate about which fairness criterion is the 'right' one (that's a normative question beyond the scope of this session).

  **Teaching Sequence**:

  0. (0-5 min) **Set up the base rates**: 
     - Introduce the puzzle example with two groups and their base rates (A: 60% solve, B: 40% solve). Draw a 2x2 contingency table for each group, but leave the numbers blank for now.

  1. (5-15 min) **Define the criteria**:
     - Write the three criteria in words and then in simple probability notation if the class is comfortable. Use the contingency tables to illustrate TPR, FPR, PPV, etc.

  2. (15-25 min) **Build the example**:
     - Assume we build a predictor that satisfies calibration and equalized odds. Then show what happens to PPV. For instance:
          - Suppose for both groups, we set the same TPR (say 80%) and same FPR (say 20%). 
          - Then, for Group A (base rate 60%): 
              - PPV = (TPR * base rate) / [TPR * base rate + FPR * (1-base rate)] 
              = (0.8 * 0.6) / (0.8*0.6 + 0.2*0.4) = 0.48 / (0.48+0.08) = 0.48/0.56 ≈ 0.857
          - For Group B (base rate 40%):
              - PPV = (0.8 * 0.4) / (0.8*0.4 + 0.2*0.6) = 0.32 / (0.32+0.12) = 0.32/0.44 ≈ 0.727
          - So PPV is higher in Group A (with the higher base rate) than in Group B. Hence, predictive parity (equal PPV) fails.

  3. (25-35 min) **Discuss the impossibility**:
     - Conclude that when base rates are unequal and the predictor is not perfect, we cannot have all three. 
     - Address the misconceptions as they come up (or proactively at the points mentioned above).

  4. (35-45 min) **The variations**:
     - Explain the scope: fixed rule and fixed distribution. Then introduce:
          - (a) Human-in-the-loop: If we have a third option (e.g., "unsure"), then we might avoid making a binary decision for some cases. This breaks the direct application of the criteria because the criteria are defined for the binary decision. But note: the criteria might be redefined for the cases that get a binary decision. The core constraints still apply to the binary decisions that are made. However, the human review might change the base rates for the automated part? Not necessarily, but it's a different system.
          - (b) Feedback loops: Example: if we deny loans to people who would have repaid (false negatives), then they might become less creditworthy. Then the base rate for repayment might decrease in the next period. So the distribution changes. The impossibility result still holds for the current snapshot, but the system is dynamic. We cannot directly apply the static result to the long run.

  5. (45-50 min) **Wrap-up**:
     - Put the final question on the board and let them think/discuss briefly.
     - End with the takeaway: The impossibility is a structural feature of trying to satisfy these three criteria at once under base rate differences and imperfect prediction. It is not about the model's inputs, but about the outcomes. And it is specific to the static, binary decision setting.
     - Decline to dive into the math of the general proof or the normative debate about criteria.

  This plan should fit within 50 minutes and address the key points.
answer: |-
  ### Brainstorming
  By minute fifty, your classmates should be able to: (1) **reconstruct the core argument** for the impossibility theorem using a simple, neutral case (e.g., base rate differences create incompatible constraints); (2) **identify why common "solutions" fail** (e.g., omitting group features doesn’t resolve the conflict); and (3) **recognize the boundaries** of the result (e.g., it applies only to static systems without feedback loops). Focus on intuition over formalism.

  ---

  ### 1. **Order of Pieces**  
  *(Dependencies: Start with foundations; build constraints step-by-step)*  
  - **Min 0–5: Base rates and joint distributions**  
    *What’s on the board:* Two groups (A/B), base rates (e.g., 30% vs. 70% "success" probability), and a confusion matrix sketch for each group.  
    *Why first?* Base rates are the root of the conflict; everything depends on them. Without this, criteria appear arbitrary.  

  - **Min 5–15: Define the three criteria**  
    *Order:* Calibration → Equalized Odds → Predictive Parity.  
    *Dependency:* Calibration and Equalized Odds together *imply* Predictive Parity only if base rates are equal. Show this logic first.  

  - **Min 15–25: Impossibility demonstration**  
    *Dependency:* Use base rates to show that if Calibration and Equalized Odds hold, Predictive Parity *must* fail under unequal base rates (algebraically or visually).  

  - **Min 25–40: Variations and misconceptions**  
    *Dependency:* After establishing the core conflict, address scope (e.g., feedback loops) to avoid premature confusion.  

  ---

  ### 2. **The Single Case**  
  **Use a neutral example: Predicting success in a standardized puzzle game** (e.g., "Can Player X solve this logic puzzle in <2 minutes?").  
  - **Must contain:**  
    - Two groups with unequal base rates (e.g., Group A: 30% success rate; Group B: 70% success rate).  
    - A non-perfect predictor (e.g., an algorithm using practice-time data).  
    - Quantifiable outcomes to plug into criteria (e.g., FPR, PPV).  
  - **Must avoid:**  
    - Real-world stakes (e.g., lending/pretrial risks), as they trigger normative debates that distract from structural logic.  
    - Causal language (e.g., "denials cause defaults"), to keep focus on prediction, not causation.  
  - **Why not lending/pretrial?** These examples often carry baggage (e.g., racial bias debates) and imply causal feedback loops, which muddy the static probabilistic argument.  

  ---

  ### 3. **Four Misconceptions to Defuse**  
  *(Replace your #3 with a stronger one)*  
  1. **"Fairness is mathematically impossible, so choices are purely political."**  
     - **When to defuse:** After demonstrating impossibility (Min 25).  
     - **Response:** "The impossibility only applies to *all three at once*. We can satisfy two—e.g., Calibration + Equalized Odds—but choosing *which two* involves value judgments."  

  2. **"Dropping group membership from inputs dissolves the conflict."**  
     - **When to defuse:** When defining criteria (Min 10).  
     - **Response:** "The criteria constrain *outputs/outcomes*, not inputs. If base rates differ, a group-agnostic model will still inherit the imbalance, violating at least one criterion."  

  3. **"This is just accuracy vs. fairness."**  
     - **When to defuse:** During misconception #1 discussion (Min 25–30).  
     - **Response:** "No—we can have high accuracy while satisfying any two criteria. The trade-off is *between fairness definitions themselves*, not accuracy."  

  4. **"We can fix this by collecting better data."**  
     - **When to defuse:** During the case demonstration (Min 20).  
     - **Response:** "Better data improves accuracy but doesn’t resolve the base rate divergence. Unless base rates equalize or the model becomes perfect, one criterion must fail."  

  ---

  ### 4. **Placing Your Key Point**  
  - **Where:** After the core impossibility (Min 35), before conclusions.  
  - **Script:**  
    > "This result assumes a **static system**: one decision rule applied to a fixed distribution. Two scenarios break this:  
    > 1. **Human-in-the-loop routing** (e.g., ‘unsure’ cases go to experts).  
      - *What carries over:* Criteria apply to the *automated decision* (e.g., if the algorithm says ‘yes’, PPV must hold).  
      - *What doesn’t:* The system avoids binary constraints, so all three *could* hold for routed cases.  
    > 2. **Feedback loops** (e.g., loan denials cause credit-score damage).  
      - *What carries over:* At any *single point in time*, the impossibility still binds.  
      - *What doesn’t:* Decisions alter future base rates, so long-term fairness requires dynamic modeling."  

  ---

  ### 5. **Final Question and Boundaries**  
  - **Final Question (Min 45, on board):**  
    > "If Group A has a higher base rate than Group B, and we enforce Calibration and Equalized Odds, which group will have higher PPV? Why?"  
    *(Tests structural grasp: They must note that PPV will be higher in Group A due to base rate differences, violating Predictive Parity.)*  

  - **What to Decline:**  
    1. **"Which criterion is morally right?"**  
       - *Response:* "That’s a normative debate for ethics modules—here we focus on mathematical constraints."  
    2. **"Can we prove the general theorem?"**  
       - *Response:* "We’re building intuition; the full proof requires probability theory we’ll skip today."  

  ---

  ### Summary Flow  
  - **0–5:** Base rates → **5–15:** Criteria → **15–25:** Case + Impossibility → **25–40:** Misconceptions + Scope → **40–50:** Q&A + Final question.  
  **Goal:** By minute fifty, they see the impossibility as a *structural artifact* of constraints + base rates, not a policy dead end.
