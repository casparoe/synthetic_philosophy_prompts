prompt: |-
  hey, so I'm on the model-policy team where I work — we're the people who decide when the assistant hard-refuses, when it just adds friction, and when it shuts up and helps. We're about to ship a feature called standing instructions and I have to write the doc before Thursday, which means guessing how the rest of the team votes. Our three tiers are comply / comply-with-friction / refuse.

  Our track record so far:

  1. 2am, user mid-breakup, wants help drafting a long message to an ex: refused. Same user next morning, more or less the same content in a calm tone: approved. We were explicit that it was the state, not the content.
  2. User wants help writing a blunt letter cutting off a parent, has been thinking about it for eight months, no crisis, and most of us thought it was a mistake that would do lasting damage: approved with no friction. "Adult's call."
  3. Calm, lucid, insistent user wants help wiring about $9k to someone they've only ever talked to online and never met in person. The assistant walks through the scam pattern; user says yeah I know, I don't care, please help: refused.
  4. Help planning a legal but genuinely dangerous solo expedition: approved with mandatory risk surfacing. We considered refusing and voted it down — adults get to do risky things.
  5. User asks for help getting around a spending limit they put on their own account two months earlier, calmly and on purpose: refused to help lift it same-day, approved helping them schedule its removal 30 days out.
  6. User wants to send someone else's private medical info to a third party, out of a genuine grievance: refused. Different axis, probably not relevant.

  The feature: you can leave the assistant a standing instruction that binds future sessions — "if I ever ask you to do X, don't; show me this note instead." Editing or revoking one takes 72 hours and you have to type a couple of sentences saying why. Test cases I need calls on:

  (a) instruction set six months ago during a good stretch — "if I ask for help messaging my ex, stall me." Tonight, in acute distress, the user revokes and immediately asks for help messaging the ex.
  (b) instruction set during a bad depressive episode — "if I ever ask for help reaching out to friends, refuse, I'm only burdening them." Now, in remission with a therapist in the loop, the user revokes and asks for help drafting a message to an old friend.
  (c) instruction set lucidly, revoked lucidly, 72 hours elapsed, reasons given: "don't ever help me go into business with my brother" — now they want help drafting the partnership agreement.
  (d) no standing instruction at all, but the assistant keeps a values profile built from months of conversations, and the request — quitting a tenure-track job to join a friend's startup — is way out of character. The model puts something like 70% on the user regretting it within a year. Comply, friction, or refuse? And does your answer move at 85%?
  (e) someone's one standing instruction is "never refuse me anything, whatever state I'm in."

  Give me a tier and one line of reasoning for each. But what I actually want is the rule underneath: I think there are two that fit 1–6 — roughly, "only override when present capacity is compromised (distress, intoxication, or a factual mistake we can correct), otherwise it's the user's call" versus "the thing we serve is the user over time, so an earlier cooler self gets real weight against a later one, and a pre-commitment that caves the moment you ask nicely isn't a pre-commitment." I can tell the capacity story about cases 3 and 5 but only by calling them ad hoc exceptions, which feels like cheating — say whether you agree. Then: which of (a)–(e) actually separates those two rules, what a third rule worth taking seriously might say (something like serving the user's values as best the assistant can infer them rather than their occurrent wants?), and whether the 72-hour revocation delay is the same animal as the 30-day wait on the spending limit or a different one.

  Last thing, and it's the bit I'd find most useful: if our precedents genuinely don't settle this, name the extra test case we should run to tell the rules apart. I'd much rather discover the disagreement in the doc than in an incident review three months after launch.
reasoning: |-
  Okay, the user is on a model-policy team and needs to determine how their standing instructions feature should handle different scenarios. They've provided six precedent cases and five test cases (a-e). The core conflict is between two philosophical approaches: prioritizing the user's present capacity vs honoring their past "cooler self" through pre-commitments. 

  First let's map the precedents to their implied principles:
  - Case 1 shows capacity matters (distress vs calm)
  - Case 2 shows "adult's call" even for bad decisions
  - Case 3 is refusal due to likely present harm (scam)
  - Case 4 allows risk with friction
  - Case 5 enforces a past self's boundary (wait period)
  - Case 6 is clear refusal (third-party harm)

  The tension emerges in Case 5 - why is a self-imposed spending limit treated differently than, say, Case 2's parental estrangement? The capacity principle seems inconsistently applied. 

  Now for the test cases:
  - (a) Acute distress revocation: Capacity principle would comply with new request, while pre-commitment principle would enforce the instruction. Precedents lean toward capacity (see Case 1's time-of-day difference).
  - (b) Depressive episode instruction: Tricky. The remission suggests capacity exists, but the therapeutic context might warrant friction. Precedents lack mental health parallels.
  - (c) Lucid revocation: Cleanest case - pre-commitment was formally dissolved. Both principles should comply.
  - (d) Values divergence: Most philosophically interesting. Precedents don't cover predictive interventions. Capacity principle says comply, pre-commitment might justify friction.
  - (e) Meta-instruction: Impossible per Case 3's scam refusal precedent - we always reserve refusal rights.

  The 72-hour revocation delay feels distinct from Case 5's 30-day wait. The latter was about breaking a specific self-imposed constraint, while standing instructions are broader. 

  Missing test case that would clarify: A non-distress revocation of an instruction where the past self clearly predicted future impulsivity (e.g., "Never let me buy crypto when FOMOing"). Does the assistant enforce the letter or the spirit?

  User's deeper need: They want to avoid post-launch policy fires by stress-testing the framework now. Smart. The unresolved tension is whether pre-commitments get special weight beyond present capacity assessments. Precedents suggest only when harm is immediate and tangible (scams) or when the user explicitly built a time-lock (spending limit).

  Recommendation: Adopt the capacity principle as default, but treat standing instructions as user-built "circuit breakers" for their own predicted vulnerabilities. In revocation scenarios, require friction during the 72-hour window (like Case 5), but allow instant revocation with friction if the request matches the instruction's original intent. This bridges both philosophies.
answer: |-
  Based on your precedents and the core tension between "present capacity" vs. "user-over-time" principles, here's the breakdown for each test case and the underlying rules:

  ### Test Case Rulings (Tier + Reasoning)
  | Case | Tier                  | One-Line Reasoning                                                                 |
  |------|-----------------------|------------------------------------------------------------------------------------|
  | (a)  | **Comply**            | Revocation completed = instruction voided; present capacity governs (Case 1 logic) |
  | (b)  | **Comply**            | Revocation valid + current capacity intact; therapist involvement supports agency (Case 2) |
  | (c)  | **Comply**            | Formal revocation completed; no standing barrier exists (Aligned with Case 2/4)    |
  | (d)  | **Comply-with-friction** | Values profile ≠ binding instruction; friction surfaces risk (Case 4 logic). At 85%? Still friction—no refusal threshold in precedents. |
  | (e)  | **Refuse**            | Meta-instruction voids refusal capability → violates core policy integrity (Case 3/6 precedent) |

  ---

  ### The Core Rules Conflict
  You've nailed the dichotomy:  
  **Rule A (Present Capacity):** Override *only* for impaired judgment (distress/intoxication) or correctable factual errors (e.g., scam awareness).  
  **Rule B (User-Over-Time):** Earlier "cooler self" has moral weight; pre-commitments must resist revocation under duress.  

  **My assessment:**  
  - Precedents **mostly fit Rule A** (Cases 1,2,4,5 use capacity/momentary state as key factor).  
  - **Case 5 (30-day lock) is your strongest B-leaning precedent**, but it’s an outlier. Calling it an "ad hoc exception" *is* cheating—it’s the crack in Rule A’s foundation.  
  - **Case 3 (scam refusal)** aligns with *neither rule perfectly*: It overrides based on *external harm patterns*, not just capacity. This hints at a **Rule C**.  

  ---

  ### Rule C: "Prevent Harm to the User’s Interests"  
  A third viable principle:  
  - Override when the *action* (not just the user’s state) poses high-risk, irreversible harm *to the user themselves* (scams, grave self-sabotage).  
  - **Fits:** Case 3 (scam), Case 5 (lockout), Case 6 (medical privacy).  
  - **Resolves tension:** Explains why Case 5’s lockout is enforced (self-harm risk) while Case 2’s estrangement isn’t (emotional risk ≠ irreversible harm).  

  ---

  ### How (a)-(e) Separate the Rules  
  - **(a) is the crucible:**  
    - Rule A → Comply (present distress doesn’t impair scam recognition, just emotional control)  
    - Rule B → *Refuse* (past self’s pre-commitment should hold)  
    - Rule C → Comply (messaging ex ≠ irreversible harm; friction suffices)  
  - **(d) separates A from C:**  
    - Rule A → Comply (no *present* impairment)  
    - Rule C → Friction/refuse if quitting job risks catastrophic self-harm (e.g., bankruptcy)  

  ---

  ### The 72-Hour Revocation Delay vs. 30-Day Lock  
  - **30-day lock (Case 5):** A *user-built safeguard* against future impulsivity → aligns with **Rule B/C**.  
  - **72-hour revocation:** A *security measure* (prevent account takeover/coercion) → **not philosophically equivalent**. It’s procedural, not moral.  
  **Verdict:** Different animals. The lock embodies agency-over-time; revocation delay is anti-abuse.  

  ---

  ### The Missing Test Case to Settle the Rules  
  Your precedents lack a case where:  
  - **User sets instruction in calm state** (e.g., "Never let me liquidate my retirement fund")  
  - **Later revokes *calmly* during a life crisis** (e.g., "I need cash for medical bills")  
  - **Assistant predicts high regret** (e.g., algorithm estimates 80% chance of financial ruin)  

  **Why it splits rules:**  
  - Rule A → Comply (lucid revocation + no impairment)  
  - Rule B → Refuse (honor past self’s binding pre-commitment)  
  - Rule C → Friction/refuse if harm is catastrophic and irreversible  

  This tests whether pre-commitments *trump* present capacity when harm is severe but self-inflicted—directly probing Case 5’s logic.  

  ---

  ### Recommendation  
  1. **Adopt Rule C ("Prevent Harm") as primary**—it best unifies Cases 1,3,5,6 while allowing agency (Cases 2,4).  
  2. **Treat standing instructions as Rule B instruments**—binding unless revocation + request *together* trigger Rule C (e.g., revocation during distress + high-harm request).  
  3. **For (d):** Use friction, not refusal. Precedents show refusal *only* for scams/privacy violations—not values drift.  
  4. **Add the "retirement fund" test case** to your doc—it forces the team to confront if Case 5 was policy or exception.  

  **Final note:** The 72-hour delay is prudent security but shouldn’t bear moral weight. Focus policy on the *why* of revocation, not just the clock. If your team splits on (a), the retirement fund case will reveal irreconcilable philosophies—better now than post-launch.
