  Substitution tests if punishment can be transferred. Retributivists say no; the guilty must suffer. Consequentialists might allow it if it doesn't increase harm. Predictions: retributivists expect deterrence drops, consequentialists think it stays the same if the sanction is still imposed.

  Sentence/conviction mismatch explores proportionality. Retributivists insist on accurate public conviction for desert. Consequentialists prioritize proportional sentencing over labels. Crux is the necessity of conviction labels for justice. Predictions vary on compliance and legitimacy based on perceived fairness.

  The last offender case isolates retributivism's core. If punishment is still justified without any consequences, it highlights non-instrumental value. Consequentialists wouldn't punish here. The crux is whether desert alone justifies punishment.

  Verbal disputes might be about what retributivism requires. Some see it as a side constraint (must not exceed desert), others as a positive duty (must punish deservedly). This affects whether retribution is necessary or just a limit. The user needs this clarified without resolution.

