  First, I need to recall the core principles of both theories. Retributivism is about desert and proportionality—punishment is justified because the offender deserves it. Consequentialism focuses on outcomes like deterrence and rehabilitation. The user mentioned five test cases: unlabelled sanction, consent ledger, substitution, sentence/conviction mismatch, and the last offender. These cases are designed to highlight disagreements.

  For the common claims section, both sides might agree on foundational points. For example, punishment involves hard treatment imposed by the state for wrongdoing. They probably agree that the state has a role in punishment, and that known innocents shouldn't be punished. Also, factors like race shouldn't influence sentencing. These points are basic enough for consensus.

