prompt: |-
  hi — hoping you can help with something that's been bugging me at work and that I don't have a word for. I'm a field archaeologist, mostly commercial work, so I spend a lot of time reading write-ups of deposits where the interpretation is doing a lot more work than the finds.

  First version of the thing. Pit, early iron age, contains a complete pot, some animal bone that shows no butchery marks, and three small polished stone objects nobody can find a use for. It goes in the report as "structured deposition, probably ceremonial". Next site, same region, same century: another pit, but this one is cut into a midden, the pot's smashed, the bone is mixed in with ordinary domestic rubbish. That one also goes in as ceremonial, because placing it with the refuse was itself the point. I have now watched both a careful deposit and a careless one get counted as evidence for the same conclusion, and the two reports cite each other.

  Second version, which might be a different thing. The confidence seems to run backwards. The three odd stones: no parallels, no wear traces, therefore "clearly non-utilitarian, almost certainly ritual". If we'd found four hundred of them in a workshop with debitage, they'd be beads and they'd get one line. The less there is to compare an object to, the louder the claim about what it meant. Certainty is highest exactly where checking is hardest.

  I can't tell if that's one phenomenon or two, and I don't know if either has a name. It isn't plain unfalsifiability — nobody says no possible find could refute the ceremonial reading, people do state conditions. It's that the conditions get restated at a different level each time: the object, then the deposit, then the site, then the whole region. And it isn't circular either, not really, because each step on its own looks fine and leans on something independent. It's the total that won't sit still.

  So: is there an established concept for a category that holds its extension while flipping its own application criteria as you move up a level? Half-heard things I can't place: god of the gaps, "residual category", that business of a hypothesis being protected by tacking on exceptions, something about different processes leaving the same traces. Which of those actually fits, which only looks like it fits, and how would you tell this apart from the honest case where a category is just broad (tool, food waste, rubbish)? Please don't hand me a label and stop — I want to know where the edge is: what a genuine test of a ceremonial reading would look like, what kind of reading would be immune to this complaint, and if there really is no term for it, coin one and define it with a boundary case. And tell me whether my two versions are the same thing wearing different hats.
reasoning: |-
  Okay, the user is an archaeologist dealing with a frustrating pattern in their field reports. They've encountered two scenarios where artifacts are labeled as "ceremonial" under varying conditions that seem contradictory. In the first case, both careful and careless deposits are interpreted as ceremonial, with reports citing each other. The second scenario shows that objects with no clear parallels are deemed "ritual" with high certainty, whereas abundant similar items would be mundane. 

  The user wants to know if there's a term for this phenomenon where the criteria for a category shift across different levels (object, deposit, site, region), making the category seem unfalsifiable. They also wonder if their two examples are the same underlying issue. They mention concepts like "god of the gaps" or "residual category" but aren't sure if these fit. Importantly, they don't just want a label—they want to understand the boundaries of the concept, how to genuinely test a "ceremonial" interpretation, and what a robust alternative would look like.

  Hmm, this is a nuanced problem in archaeological interpretation. The first version seems to involve overextension of the "structured deposition" concept—where both careful placement and deliberate discarding are framed as ritual acts. This feels like concept creep, where the definition expands to include opposites. The second version is more about epistemic overreach: absence of evidence (no parallels/wear) becomes evidence for ritual significance, while common items get mundane labels. 

  Both scenarios share a core issue: the "ritual" category acts as a dustbin for ambiguity. But they aren't identical. Version 1 is about context inflation (shifting interpretive levels to preserve the conclusion), while Version 2 exploits evidentiary voids (certainty inversely proportional to data). The closest established terms might be "residual category" (for Version 2's ritual-as-default-for-mysteries) and "ad hoc auxiliary hypotheses" (for Version 1's moving goalposts). 

  But the deeper trap is the hermeneutic circle in material culture studies: when ritual is defined by deviation from a hypothetical "norm," but the norm itself is reconstructed by excluding... ritual finds. Classic circularity! To break this, the user needs testable predictions. For example, a genuine ceremonial test could require: (1) exclusive association with non-domestic features (shrines, graves), (2) ethnographic parallels, or (3) expendable valuables (intact goods in pits). Immunity would come from positive evidence—like residues confirming special substances—not just absence of mundane use. 

  For a new term? "Interpretive scope-stretching" covers Version 1's level-jumping. "Ceremonial overfitting" fits Version 2's pattern of overinterpreting sparse data. The boundary case: calling a lone potsherd in a ditch "ritual" because it's "placed," while ignoring 99 identical sherds in midden layers.
answer: |-
  Your frustration resonates deeply—you're describing a fundamental crack in archaeological reasoning that **doesn't have a single perfect term** but sits at the intersection of several concepts. Your two versions are connected manifestations of the same core issue: **the elasticity of the "ritual/ceremonial" category as a residual explanatory bucket for ambiguity**. Let's dissect it:

  ### Core Issue: The Ritual Residual Category
  In archaeology, "ritual" often functions as a **residual category**—a default classification for anything that doesn't fit established functional or utilitarian models. When evidence is sparse, ambiguous, or contradictory, "ritual" becomes the catch-all explanation precisely because its criteria are fluid and hard to falsify. This isn't unique to archaeology (see "god of the gaps" in theology/science debates), but your examples show *how* it manifests.

  ### Your Two Versions: Same Beast, Different Tactics
  1.  **Version 1 (Contradictory Contexts = Same Conclusion):**  
      This is **criterial shifting via scale-jumping**. The *definition* of "structured deposition" stretches to absorb opposites (careful placement vs. deliberate discarding) by shifting the interpretive frame:
      - **Object level:** Complete pot → "special placement".  
      - **Deposit level:** Smashed pot in rubbish → "act of deposition is the ritual".  
      - **Regional level:** Both sites cited → "see, it's a pattern!"  
      **Mechanism:** The criteria for "ritual" aren't fixed; they're redefined at each analytical scale to preserve the conclusion. It's **protective belt adjustment** (from Lakatos' "research programmes")—defending the core idea ("ritual explains anomalies") by modifying auxiliary hypotheses.

  2.  **Version 2 (Certainty Inversely Proportional to Evidence):**  
      This is **epistemic overreach in residual categorization**. The *absence* of functional parallels or wear traces becomes *positive evidence* for ritual significance. Meanwhile, abundant identical items are mundane.  
      **Mechanism:** "Ritual" thrives in evidentiary voids. When no functional model fits, the void is filled with maximalist ritual interpretations precisely because they're harder to disprove than specific functional hypotheses.

  ### Why Existing Terms Partially Fit (and Where They Fall Short)
  - **Residual Category:** Best fit for Version 2. "Ritual" *is* archaeology's residual drawer. But it doesn't capture Version 1's scale-jumping.
  - **God of the Gaps:** Similar to Version 2—using "ritual" to explain current ignorance. But it misses the contextual elasticity of Version 1.
  - **Ad Hoc Hypotheses / Protective Belt (Lakatos):** Explains Version 1's shifting criteria, but less focused on the *residual* aspect.
  - **Equifinality:** Different processes (ritual vs. mundane) *can* leave similar traces (e.g., a pit). But your issue is *interpretive bias*, not just trace ambiguity.
  - **Circularity:** It *feels* circular—but as you note, each step cites "independent" evidence (just redefined). It's **hermeneutic circularity**: the "ritual" frame is reinforced by selectively interpreting evidence through that lens.

  ### The Trap: "Ritual" as a Non-Falsifiable Universal Explainer
  The problem isn't that "ritual" is broad—it's that its application:
  1.  **Lacks positive criteria:** Defined by what it *isn't* (non-utilitarian, non-domestic).  
  2.  **Absorbs contradictions:** Careful placement *and* careless dumping both "prove" ritual.  
  3.  **Inverts evidence standards:** Scarcity = significance; abundance = banality.  

  ### Genuine Test: What Would Falsify "Ceremonial"?
  A robust ritual hypothesis must predict **positive, unique material signatures** beyond "not domestic." Examples:
  - **Exclusive association:** Objects/deposits *only* in spaces identifiably ritual (temples, shrines, graves) and *never* in domestic/middens.  
  - **Consistent patterning:** Recurring, non-functional configurations (e.g., *always* placed upside-down, *always* with specific species).  
  - **Expendable value:** Deliberate destruction of high-value items (intact metals in pits, not just pots).  
  - **Ethnographic analogy:** Direct parallels from societies with similar practices.  

  **Example falsification:** If your "ceremonial pit" with a complete pot was found cut by a later latrine, and contained parasite eggs from human feces—the "ritual" claim collapses. Currently, "ritual" interpretations often lack such testable stakes.

  ### Immune Interpretations: Rigorous Residuals
  A category is robust when:
  1.  It has **positive diagnostic criteria** (e.g., "food waste" = butchery marks, charring, in kitchen contexts).  
  2.  It **admits ambiguity**: E.g., "function unknown" is a valid entry—no need to force "ritual".  
  3.  It **predicts patterns**: If "bead workshop" predicts debitage, molds, failures—and finds match.  

  ### Proposed Term: **Ceremonial Overfitting**
  Blending "overfitting" (statistics: a model too complex, fitting noise rather than signal) with the ritual trap.  
  **Definition:** *The imposition of a ceremonial/ritual interpretation onto ambiguous archaeological evidence by redefining criteria across scales (object/deposit/site) to preserve the hypothesis, despite contradictory or insufficient data, often inversely weighting certainty against evidence density.*  

  **Boundary Case:**  
  - **Genuine:** A lone, finely crafted bronze figurine in a grain storage pit. Minimal evidence, but *positive* criteria: high skill, non-local materials, no utilitarian function.  
  - **Overfitting:** Your polished stones. No functional *or* ritual criteria met—just "unknown," forced into "ritual" due to scarcity.  

  ### Key Takeaway
  Your two versions are symptoms of the same disease: **ritual as the comfort blanket for archaeological uncertainty**. Combat it by demanding:
  - Positive signatures for "ritual,"  
  - "Unknown" as an acceptable conclusion,  
  - And hypotheses that can *fail*.  

  This isn't skepticism—it's rigor. The past was messy; our categories should tolerate that.
