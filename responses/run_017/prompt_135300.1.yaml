answer: |-
  ## Research Proposal: The Fragility of Superrational Cooperation in Partially Correlated Decision Environments  

  **Project Title:** Quantifying Superrationality: Robustness Analysis of Cooperative Equilibria Under Partial Logical Correlation and Variable Payoff Structures  

  **Research Question:**  
  Under what conditions does superrational cooperation remain optimal as we interpolate between (i) the canonical Platonia scenario (perfect logical correlation) and realistic partial-correlation environments, and (ii) winner-takes-all versus diluted collective payoffs? Specifically:  
  1. Does the superrational equilibrium policy change *continuously* with the correlation strength parameter ρ (probability others use identical deterministic policy), or is there a critical threshold below which cooperation collapses?  
  2. How does the structure of payoffs (concentrated vs. diluted rewards) interact with ρ to determine the existence and stability of cooperative equilibria?  

  ### Why This Question Matters and Why It’s Open  
  Superrationality (Hofstadter) and Functional Decision Theory (FDT) offer compelling solutions to symmetric dilemmas *only* under perfect logical correlation (ρ=1), treating agents as identical computations. Conversely, standard game theory (Causal Decision Theory, Correlated Equilibrium) handles independence (ρ=0) but ignores logical ties. **The gap:** Real-world collective actions (e.g., voting, strikes) involve *partial* correlation—agents share similar reasoning but aren’t identical computations. Existing frameworks fail here:  
  - **FDT/UDT:** Silent on ρ < 1. Assumes perfect logical dependency; no tools for "mostly similar" computations.  
  - **Causal/Evidential DT:** Treat ρ=0 as default; cannot capture the logical-dependency intuition central to Platonia.  
  - **Correlated Equilibrium:** Requires exogenous correlating devices; cannot model endogenous logical correlation or policy-similarity.  
  This project bridges the idealized (ρ=1) and the purely statistical (ρ=0), testing whether superrationality’s promise of cooperation extends to plausible settings.  

  ### Methodology: Sensitivity Analysis via Parametric Game Families  
  We avoid axiomatic decision theory or behavioral experiments. Instead, we construct mathematically tractable game families with knobs for:  
  - **Correlation strength (ρ):** With probability ρ, other players deterministically use *your exact policy*; with probability (1-ρ), they use independent policies drawn from a specified distribution.  
  - **Payoff structure ("lure"):**  
    - *Concentrated:* Winner-takes-all (Platonia default).  
    - *Diluted:* Fixed pot split evenly among contributors (e.g., public goods game).  
    - *Hybrid:* Lump sum awarded randomly to one contributor.  
  - **Solution Concept:** Symmetric *superrational equilibria* (fixed points where identical agents optimize assuming their policy is universally adopted). We compute:  
    - Nash-equivalent policies under varying ρ.  
    - Expected utility curves for cooperation vs. defection.  
    - Phase transitions in equilibrium existence/stability.  

  **Why this method?** It directly tests the *robustness* of FDT-like reasoning without requiring new decision theory. Agent-based simulations (NetLogo/Python) will handle large N cases; analytical solutions will be derived for small N and asymptotic limits.  

  ### Plan of Work  
  1. **Months 1–3:** Formalize game structures. Solve concentrated-payoff model analytically for small N (2–5 agents), varying ρ.  
  2. **Months 4–6:** Simulate diluted-payoff games (N=10–1000) to identify equilibrium entry probabilities. Test continuity of cooperation thresholds in ρ.  
  3. **Months 7–9:** Analyze "common-cause" correlation variant (e.g., actions correlated via shared evidence screening off direct dependence). Compare to logical correlation.  
  4. **Months 10–12:** Synthesize results. Derive heuristic decision rules for ρ > 0 and publish core findings.  

  ### Deliverables  
  1. A **taxonomy of regimes** mapping (ρ, payoff structure) to:  
     - Regions where superrational cooperation is optimal/stable.  
     - Critical thresholds (ρ*) below which cooperation collapses.  
     - Cases where no symmetric equilibrium exists (e.g., diluted payoffs inducing "volunteer’s dilemma" dynamics).  
  2. **Formal proofs** (where possible) and **simulation libraries** for reproducibility.  
  3. **Philosophical implications report**: When is it *practically justified* to reason "as if" ρ=1?  

  ### Risk Management: Success and Failure Conditions  
  - **Strong success:** Discovery of non-continuous phase transitions (e.g., cooperation viable only for ρ > 0.9) or failure of symmetric equilibria under diluted payoffs. Shows Platonia is fragile.  
  - **Weak success:** Continuous interpolation between ρ=0 and ρ=1, but with novel dynamics (e.g., superrationality requires lower entry probabilities as ρ decreases).  
  - **Failure:**  
    - Trivial continuity (outcomes linearly interpolate endpoints; ρ is just another correlation device).  
    - All equilibria reducible to standard correlated equilibrium (no distinct "logical" effect).  
    - Technical intractability (e.g., no closed-form solutions; simulations inconclusive).  
  - **Scope mitigation:** We prioritize concentrated payoffs and logical correlation. Common-cause variants/diluted payoffs are secondary. If time-limited, we fix N or focus on asymptotic N.  

  ### Feasibility Note  
  This is likely 2 papers’ work. The 12-month scope *excludes* axiomatic decision theory, behavioral experiments, or full game-theoretic generalization. We deliver a focused robustness analysis revealing whether superrationality’s promise extends beyond measure-zero edge cases—addressing the core frustration driving this proposal.  

  ---  
  *This proposal intentionally omits citations/literature. In the final draft, integrate key references to: Hofstadter (1985) Platonia, Yudkowsky/Garrabrant on FDT, Halpern on correlated equilibrium, and critical analyses of superrationality (e.g., Binmore).*
