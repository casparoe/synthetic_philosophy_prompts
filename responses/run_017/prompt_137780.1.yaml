answer: |-
  Below is a complete, runnable 90-minute session plan for your Bongard-inspired activity. It addresses your core goals—underdetermination, the role of priors, invisible hypothesis spaces, and the "click" fallacy—while incorporating your constraints (teams of 3, no tech, stationery-only materials). I've structured it to minimize upfront explanation and maximize experiential learning. 

  ### **Materials Needed**  
  - **Vocabulary Cards** (1 per team): 4.25" x 5.5" cards printed with:  
    > **DESCRIPTION VOCABULARY**  
    > Only these properties may be used:  
    > **Per FIGURE**: Shape (circle, square, triangle, star, cross), Fill (empty, filled, striped), Size (small: 1cm, medium: 2cm, large: 3cm).  
    > **Per PANEL (set of 6 figures)**:  
    > - All figures share [property]? (e.g., all filled).  
    > - No two figures are identical? (same shape, fill, size).  
    > - At least two figures are identical?  
    > - Count of figures with [property] (e.g., 4 circles).  
    > - Figures touch? (edges overlap).  
    > - One figure contains another? (drawn inside).  
  - **Panel Pair Packets** (1 per team):  
    - **Left Panel**: 6 index cards with hand-drawn figures (3" x 5").  
    - **Right Panel**: 6 index cards with hand-drawn figures.  
    - **Loose Probe Cards**: 3 index cards with new figures.  
    - **Instruction Sheet** (details below).  
  - **Pre-Made Probe Deck** (for facilitator): 5 index cards designed to split hypotheses.  
  - **Authoring Kits** (for Round 2): Envelopes, blank index cards, markers, scrap paper.  
  - **Scoring Tokens**: Chocolate coins (1 token = 1 chocolate). Each team starts with 3.  
  - **Planted Relational Panel**: 1 panel pair where left = "no two figures identical," right = "at least two identical" (example below).  

  ---

  ### **Session Timeline (90 Minutes)**  
  **Goal**: Ensure teams discover your key points through doing, not telling.  

  #### **0:00–0:10 — Intro & Setup (10 min)**  
  - **Handout**: Vocabulary card + panel packet to each team.  
  - **Facilitator Script**:  
    > *"Welcome! Tonight, we’re exploring how we categorize things. Each team has cards with simple drawings. Six cards are grouped on the left, six on the right. Your job:  
    > 1. Study the two groups.  
    > 2. Use the three loose cards to test your hunches—place each on the left or right.  
    > 3. Write down three distinct reasons that explain the sorting. Rank them: #1 = your best guess.  
    > You have 25 minutes. Use only the vocabulary on the card. Ready? Go!"*  
  - **Critical**: Do NOT use "rule," "Bongard," or "problem." Call groups "left/right panels" and reasons "distinctions."  

  #### **0:10–0:35 — Round 1: Hypothesis Generation (25 min)**  
  - Teams work on:  
    - (a) Placing loose probes on left/right.  
    - (b) Writing **three distinctions** (e.g., "Left: all filled. Right: mixed fills").  
  - **Facilitator Checks In**:  
    - If stuck: *"What’s the simplest difference? What’s the weirdest one that still fits?"*  
    - If vibes-only: *"Point to a specific property on your vocab card."*  
  - **Plant the Relational Panel**: Give 1 team the planted pair (e.g., left = all unique figures, right = duplicates). Example figures:  
    - Left: [①△empty_sml, ②□filled_med, ③☆striped_lrg, ④△filled_sml, ⑤□empty_lrg, ⑥☆filled_med]  
    - Right: [①△empty_sml, ①△empty_sml (dupe), ②□striped_med, ③☆empty_lrg, ②□striped_med (dupe), ④△filled_med].  
    - **Why this works**: Solvers fixate on individual properties (all have triangles? counts?) but miss duplicates.  

  #### **0:35–0:50 — Round 1: Hypothesis Testing (15 min)**  
  - **Handout Pre-Made Probe Deck** (5 cards) to all teams.  
  - **Team Task**: For each distinction they wrote, predict left/right for all 5 probes. If inconsistent, mark where predictions clash.  
  - **Probe Deck Design** (guarantees splits):  
    | Card | Properties | Splits... |  
    |------|------------|-----------|  
    | 1    | △ filled, large | Fill-based vs. shape-based distinctions |  
    | 2    | ☆ empty, small | Naturalness priors (e.g., stars "should" be rare) |  
    | 3    | □ striped, large | Size-based vs. relational distinctions |  
    | 4    | △ empty, large (+ contains small ○) | "Contains" relations vs. atomic properties |  
    | 5    | Identical to a card in the planted panel | Forces relational thinkers to surface |  
  - **Facilitator Script**:  
    > *"Now use these 5 new cards. For each reason you wrote, decide: where does each card belong? If your reasons disagree, circle the card that caused it."*  

  #### **0:50–1:05 — Round 2: Authoring Puzzles (15 min)**  
  - **Handout Authoring Kits** (blank cards, markers, envelopes).  
  - **Task**:  
    > "Create a new left/right panel pair (6 cards each). Write your *intended distinction* on scrap paper. Seal it in an envelope with your team ID.  
    > **Scoring**:  
    > - Solver team guesses your distinction → you lose 1 token.  
    > - Solver fails to guess → you gain 1 token.  
    > - **Collision penalty**: If solver proposes a *different* distinction that fits ALL 12 cards, and you can’t produce a probe card that breaks it (using vocabulary), you lose 2 tokens."  
  - **Incentive Insight**: Authors must design distinctions that feel "obvious" (exploiting priors) to avoid collisions. Complex rules risk being unfalsifiable.  

  #### **1:05–1:20 — Round 2: Solving Puzzles (15 min)**  
  - Teams swap envelopes. Solvers get:  
    - A new panel pair.  
    - 5 blank probe cards (unused).  
  - **Solver Task**:  
    > "1. Write ONE distinction for this pair.  
    > 2. Place the 5 blank cards (ignore for now).  
    > 3. Return your guess + blank cards to authors."  
    *(Blanks prevent authors from cheating with pre-loaded probes.)*  

  #### **1:20–1:30 — Scoring & Challenges (10 min)**  
  - Authors reveal sealed distinctions. Apply scoring rules.  
  - **Collision Demo**: If solver’s distinction ≠ author’s, author must draw a probe on a blank card that classifies differently under both distinctions (e.g., if author’s is "all filled," solver’s is "no stars," probe = filled star).  
  - **Facilitator Script**:  
    > *"Authors, if your distinction disagrees, create a card that exposes it. If you can’t within 2 minutes, it’s a collision."*  

  #### **1:30–1:45 — Debrief (15 min)**  
  - **Map Moments to Insights**:  
    | **Activity Moment** | **Debrief Question** | **Core Point** |  
    |---------------------|----------------------|----------------|  
    | Round 1: 3 distinctions | *"Why did your #2 and #3 distinctions feel less satisfying than #1?"* | **Priors**: We prefer "natural" distinctions (simplicity, familiarity) even when data fits many. |  
    | Pre-made probe splits | *"When your predictions disagreed, was one distinction still ‘correct’?"* | **Underdetermination**: 12 examples constrain but don’t determine the "rule"; the click ≠ truth. |  
    | Planted panel struggle | *"What did teams with identical figures grapple with?"* | **Hypothesis space**: If you only consider atomic properties (color/shape), relational ones (duplicates) stay invisible. |  
    | Round 2 collisions | *"How did avoiding collisions change how you designed puzzles?"* | **Prior dependence**: Authors appealed to "what people would see first" (priors) to defend distinctions. |  
  - **Close with Reality Check**:  
    > *"Tonight, figures were pre-symbolized (e.g., ‘striped’ was given). Real Bongard problems require perceptual work—you must *invent* the vocabulary. That’s where priors bite hardest: what you see as ‘natural’ isn’t in the data. It’s in you."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Overly Baroque Distinctions** (e.g., "squares on Tuesdays"):  
     - *Fix*: Enforce vocabulary card. In scoring, force them to generate probes for it—they’ll see it’s impractical.  
  2. **"Vibes" Solvers** (can’t articulate distinctions):  
     - *Fix*: Remind them to use vocabulary. Ask: *"Which property on the card makes you say that?"*  
  3. **Drawing-Style Bias** (e.g., wobbly lines as a feature):  
     - *Fix*: Use stencils/thick markers for clean figures. Ban discussing "sketch quality."  
  4. **Physical Cheating** (e.g., arranging probes to touch):  
     - *Fix*: Laminate cards or use stiff paper. Specify: *"Placement is symbolic; ignore physical arrangement."*  
  5. **Author-Solver Collusion**:  
     - *Fix*: Swap envelopes between non-adjacent teams. Use anonymous team IDs.  

  ### **What the Activity Can’t Replicate**  
  - **Perceptual Construction**: With pre-symbolized vocabulary, participants skip feature extraction (e.g., seeing a blob as "striped"). In real Bongard problems, this is where priors dominate—e.g., you might ignore texture because "shape is more important."  
  - **Mitigation**: In debrief, contrast a real Bongard problem (e.g., show BP #1) with your cards: *"Here, you had to invent *what to look for*. That’s where culture, expertise, and priors creep in."*  

  ### **Handout Wording**  
  - **Round 1 Instruction Sheet**:  
    > "LEFT PANEL: 6 cards | RIGHT PANEL: 6 cards | LOOSE CARDS: 3  
    > 1. Place each loose card on the left or right.  
    > 2. Write three reasons for the sorting. Use only the VOCABULARY CARD.  
    > 3. Rank reasons: 1 (strongest hunch) to 3 (weakest)."  
  - **Round 2 Authoring Sheet**:  
    > "CREATE: Left panel (6 cards), Right panel (6 cards).  
    > WRITE: Your intended distinction. SEAL it in the envelope.  
    > SCORING:  
    > - Solver guesses your distinction → -1 token.  
    > - Solver fails → +1 token.  
    > - Collision (solver finds alternate distinction fitting all 12 cards AND you can’t break it with a new probe) → -2 tokens."  

  This design forces engagement with underdetermination, priors, and relational blindness. Teams will experience the "click" as unstable and recognize that the data doesn’t dictate the distinction—their minds do. The chocolate tokens make collisions viscerally motivating. Run it as-is, and debrief hard on the gaps (perception, cultural priors) to complete the picture.
