  We are designing a 90-minute session for a small reading group (12 people) with no prior exposure to Bongard problems. The goal is to let participants experience:
  1. Underdetermination: 12 examples don't uniquely determine a rule; shared priors about "natural" predicates do the work.
  2. The "click" of insight is not evidence of recovering the author's intended rule.
  3. The hypothesis space is a choice, and relations between figures can be invisible if only individual properties are considered.

  Structure:
  - Teams of 3 (so 4 teams).
  - Round 1: Each team gets a panel pair (6 cards for left, 6 for right) and a few probe cards. They must:
     (a) Place the probe cards on the side they think they belong.
     (b) Write down three distinct distinctions (rules) consistent with the training cards, ranked by confidence.
     Then, reveal pre-made probe cards (5) and for each rule, commit to a side for each probe. This should reveal if their rules disagree.

  - Round 2: Teams author a panel pair for another team. Scoring: Authors are rewarded when solvers fail to find the intended rule, but penalized if solvers propose a different rule that fits all 12 cards and the author cannot produce a probe card (within the vocabulary) that distinguishes their rule from the solver's.

  - Planted panel pair: One of the panel pairs in Round 1 should have a relational rule (e.g., no two figures are alike on one side, at least two are alike on the other).

  Materials:
  - Vocabulary card: A fixed list of primitives (e.g., shape, fill, size, count, touching, overlapping, contained-in, separate). We'll define these clearly.
  - Hand-drawn figures on index cards (each card has one figure, but for the panel, we present 6 for left and 6 for right). The figures are drawn with markers (so no shading by pen pressure, etc.) and are clear.

  Timeline (90 minutes):
  0:00 - 0:10 (10 min): Introduction and forming teams. Hand out vocabulary cards and explain the activity without giving away the concept of Bongard problems.

  0:10 - 0:35 (25 min): Round 1. Teams work on their panel pair and probes. They place the probes and write down three rules.

  0:35 - 0:45 (10 min): Reveal the pre-made probe deck. Each team uses their three rules to make predictions for each probe.

  0:45 - 0:50 (5 min): Teams note where their rules disagree and which probe caused the most disagreement.

  0:50 - 1:05 (15 min): Round 2. Teams create a new panel pair (with 6 left and 6 right) and write down their intended rule (on a separate sheet, to be sealed). They also create 5 probe cards (which they will keep for now). They put the panel pair and the intended rule in an envelope for another team.

  1:05 - 1:20 (15 min): Teams swap envelopes. Each team now solves the puzzle they received: they must write down one rule they think is the intended one. They do not get to see the intended rule. They also place the 5 probe cards (that the authors created) on the sides they think they belong.

  1:20 - 1:25 (5 min): Teams reveal their proposed rule and their placement of the probes to the authors.

  1:25 - 1:35 (10 min): Scoring and challenge phase. Authors reveal their intended rule. If the solver's rule is different, the author must produce a probe card (within the vocabulary) that distinguishes the two rules (i.e., a figure that would be classified differently by the two rules). If they can, then the solver fails and the author gets a reward. If they cannot, then it's a collision and the author is penalized.

