  ### Proposed Rule: Conditional Learning as Contextual Update

  After analyzing your cases and intuitions, I propose a rule that distinguishes between two types of conditional learning, based on the **source's epistemic constraints and communication protocol**. The core insight is that the update depends on whether the source is providing:
  - **Global Information** (the conditional is a universal fact; use Rule H: remove ¬B given A and renormalize)
  - **Local Information** (the conditional only applies to the A-worlds; use Rule Y: move mass from A∧¬B to A∧B, leave P(A) unchanged)

  The rule is determined by **what the source would have said if A were false**:
  - If the source would **remain silent or say something unrelated** when A is false → **Local Update (Rule Y)**.
  - If the source would **always assert the same conditional** regardless of A → **Global Update (Rule H)**.

  ---

  ### Rule Formulation:
  1. **Assess the source's behavior in ¬A worlds**:
     - If the source is **constrained to only speak when A is true** (or would say nothing/irrelevancies in ¬A), use **Local Update**.
     - If the source would **assert the same conditional in all states**, use **Global Update**.
     - If unknown, **default to Global Update** (Rule H) for reliability.

  2. **Local Update (Rule Y - "A-worlds only")**:
     - Move probability mass from A∧¬B to A∧B.
     - Preserve P(A) and P(¬A).
     - Formula:  
       New P(A) = Old P(A)  
       New P(B|A) = 1  
       New P(A∧B) = Old P(A)  
       New P(¬A∧B) = Old P(¬A∧B)  
       New P(¬A∧¬B) = Old P(¬A∧¬B)

  3. **Global Update (Rule H - "Universal conditional")**:
     - Remove A∧¬B and renormalize all probabilities.
     - Formula:  
       New P(any state) = Old P(state) / [1 - Old P(A∧¬B)]  
       (for states not A∧¬B)

  ---

  ### Case-by-Case Application:
  1. **Judy Benjamin (territory/company)**  
     - *Your verdict*: P(Blue) = 1/2 (unchanged)  
     - *Rule*: **Local Update (Rule Y)**.  
       Reason: Source said "I can't tell you where you are" → implies they would not comment on location (¬A worlds), so the conditional only applies if you're in Blue.  
       Result: P(Blue) remains 50%.  
       - Blue-Second: 25% → 50%  
       - Blue-First: 25% → 0% (mass moved to Blue-Second)  
       - Red regions: unchanged (25% each).

  2. **Coin and urn**  
     - *Your verdict*: P(heads) = 1/3  
     - *Rule*: **Global Update (Rule H)**.  
       Reason: Source knows both coin and ball outcomes → no indication they would withhold information in tails (¬A) worlds. Default to universal fact.  
       Result: Remove heads∧black (25% mass), renormalize:  
       - Heads: 25% → 25%/75% = 1/3  
       - P(red) = (25% + 25%)/75% = 2/3.

  3. **Server status page**  
     - *Your verdict*: P(server down) unchanged (0.3)  
     - *Rule*: **Global Update (Rule H)**, but with observation.  
       Reason: Conditional is a general fact, but you already see "red". Since P(red) = 1 initially, removing (down∧¬red) (which has P=0) changes nothing.  
       Result: No change, as desired.

  4. **Arson and CCTV**  
