  ### When Would I Switch Rules?
  - **Switch to Global-only (Rule H) if**: All sources are "truth-tellers" of universal facts (e.g., Case 2, math contexts).  
  - **Switch to Local-only (Rule Y) if**: Sources are "contextual advisors" (e.g., Case 1, medical advice: "If you have cancer, then treat with X" doesn’t change your P(cancer)).  
  - **Weakness**: Case 5 exposes ambiguity. If sources might speak in ¬A worlds, we need a reliability model. Your 0.9% might emerge if the source has 90% probability of being "irrelevant" in ¬A worlds.

  ### Final Arithmetic
  - **Core equations**:  
    - Global: `P_new(A) = P_old(A) × P_old(B|A) / [1 − P_old(A) × (1 − P_old(B|A))]`  
    - Local: `P_new(A) = P_old(A)`, `P_new(B|A) = 1`.  
  - **Use context to choose**. Default Global, switch to Local if source is A-constrained.

  This rule preserves your intuitions for Cases 1,3,4,7; updates 2,6; and softens 5. It resolves the circle by making the source's intent explicit.
