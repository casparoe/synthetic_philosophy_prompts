  - **A and B initially correlated**:  
    Rule adapts:  
    - *Local Update*: Only shifts mass within A (preserves P(A), P(¬A), and P(B|¬A)).  
    - *Global Update*: Remove A∧¬B, renormalize all (correlation handled implicitly).

