  ### Translation of Hempel's Raven Paradox into Probabilistic Terms

  **Setup**: We define a finite catalogue of \(N\) objects. Each object has two binary attributes: raven (\(R\)) or non-raven (\(\neg R\)), and black (\(B\)) or non-black (\(\neg B\)). The four possible categories are:
  - \(R \cap B\) (black raven)
  - \(R \cap \neg B\) (non-black raven)
  - \(\neg R \cap B\) (black non-raven)
  - \(\neg R \cap \neg B\) (non-black non-raven, e.g., a red herring)

  Let \(a, b, c, d\) be the counts of objects in these categories, with \(a + b + c + d = N\). The hypothesis \(H\): "All ravens are black" is equivalent to \(b = 0\) (no non-black ravens). \(H\) is also logically equivalent to its contrapositive: "All non-black things are non-ravens" (\(\neg B \subseteq \neg R\)).

  **Prior**: We add a uniform prior over the counts \((a, b, c, d)\): all non-negative integer solutions to \(a + b + c + d = N\) are equally likely. This is an addition not specified in the paradox. The prior probability of \(H\) (i.e., \(b = 0\)) is the proportion of states with \(b = 0\):
  \[
  P(H) = \frac{\text{number of states with } b=0}{\text{total states}} = \frac{\binom{N+2}{2}}{\binom{N+3}{3}} = \frac{3}{N+3}.
  \]
  Under \(\neg H\), \(P(\neg H) = 1 - P(H) = \frac{N}{N+3}\).

  **Data-generating protocols**:
  1. **Protocol 1 (Uniform over catalogue)**: Object drawn uniformly at random from all \(N\) objects.
  2. **Protocol 2 (Uniform over non-black objects)**: Object drawn uniformly from non-black objects (size \(b + d\)).
  3. **Protocol 3 (Uniform over ravens)**: Object drawn uniformly from ravens (size \(a + b\)).

  **Observation**: A non-black non-raven (\(\neg R \cap \neg B\)), which is category \(d\).

  **Posterior for \(H\) given observation under each protocol**:

  - **Protocol 1 (Uniform over catalogue)**:
    - Likelihood: \(P(\text{obs} = d \mid H) = \mathbb{E}[d/N \mid H]\). Under \(H\) (\(b=0\)), states are uniform over \((a, c, d)\) with \(a+c+d=N\). By symmetry, \(\mathbb{E}[d \mid H] = N/3\), so \(P(\text{obs} = d \mid H) = (N/3)/N = 1/3\).
    - Marginal probability: \(P(\text{obs} = d) = \mathbb{E}[d/N] = (N/4)/N = 1/4\) (by symmetry over four categories).
    - Posterior: \(P(H \mid \text{obs}) = \frac{P(\text{obs} \mid H) P(H)}{P(\text{obs})} = \frac{(1/3) \cdot (3/(N+3))}{1/4} = \frac{4}{N+3}\).
    - Comparison: Prior \(P(H) = 3/(N+3)\), so posterior > prior (confirmation), but magnitude is small (e.g., for large \(N\), Bayes factor \(\approx 4/3\)).

  - **Protocol 2 (Uniform over non-black objects)**:
    - Observation: Given we sample from non-black objects (\(b + d\) total), we observe a non-raven (i.e., \(\neg R \cap \neg B\)).
    - Likelihood: \(P(\text{obs} = \text{non-raven} \mid \text{non-black}, H)\). Under \(H\) (\(b=0\)), all non-black objects are non-ravens, so \(P(\text{obs} \mid H) = 1\).
    - Under \(\neg H\), \(P(\text{obs} \mid \neg H) = \mathbb{E}[d/(b + d) \mid \neg H]\). By symmetry of counts \(b\) and \(d\) in the prior (given \(\neg H\)), \(\mathbb{E}[d/(b + d) \mid \neg H] = 1/2\).
    - Posterior: \(P(H \mid \text{obs}) = \frac{1 \cdot P(H)}{1 \cdot P(H) + (1/2) P(\neg H)} = \frac{3/(N+3)}{3/(N+3) + (1/2)(N/(N+3))} = \frac{6}{N+6}\).
    - Comparison: For large \(N\), \(P(H) \approx 3/N\), posterior \(\approx 6/N\), so Bayes factor \(\approx 2\) (stronger confirmation).

  - **Protocol 3 (Uniform over ravens)**:
    - Not applicable: Sampling only from ravens (\(a + b\)), we cannot observe a non-raven (\(\neg R \cap \neg B\)). This observation cannot occur under this protocol.

  **Summary of translations**:
  - **Nicod-style judgment**: Protocol 2 recovers the contrapositive intuition (observing a non-black non-raven while sampling non-black objects confirms \(H\) substantially). Protocol 1 also confirms \(H\) but weakly. Protocol 3 cannot produce the observation.
  - **Equivalence condition**: Logically equivalent forms of \(H\) (original and contrapositive) have the same posterior under any protocol, satisfying equivalence. But the evidential impact of the same observation depends on the protocol.
  - **Conjunction and paradox**: Observing a non-black non-raven confirms \(H\) under Protocols 1 and 2, but weakly under 1 and strongly under 2. The "absurdity" is resolved by noting that confirmation magnitude depends on protocol and prior, with the red herring being negligible in Protocol 1 when \(N\) is large.

  **Key assumption doing the work**: The uniform prior over counts. This prior imposes symmetry across categories, which is an addition not in the paradox. If ravens are rare (e.g., non-uniform prior), results change.

  ---

  ### Annotation Budget: Expected Informativeness per Label

  **Setup**: Fixed budget of \(k\) labels. Two strategies:
  - **Strategy A (Sample from ravens)**: Draw objects uniformly from ravens (size \(a + b\)), observe color.
  - **Strategy B (Sample from catalogue)**: Draw objects uniformly from all \(N\) objects, observe both attributes.

  **Goal**: Compare expected information gain per label about \(H\). Use expected change in log-odds (Bayes factor) or mutual information. We add a prior reflecting rareness of ravens: assume \(P(R) = \epsilon \ll 1\) (small), and under \(\neg H\), \(P(B \mid R) = \phi\) with \(\phi \sim \text{Beta}(\alpha, \beta)\). Set \(\mu = \mathbb{E}[\phi \mid \neg H] = \alpha / (\alpha + \beta)\).

  **Strategy A (sample from ravens)**:
  - Possible observations: Black raven (supports \(H\)) or non-black raven (falsifies \(H\)).
  - If observe black raven: Bayes factor \(BF_A = 1 / \mu\).
  - If observe non-black raven: \(BF_A = 0\) (falsifies \(H\)).
  - Probability of falsifying \(H\) per draw (under \(\neg H\)): \(\mathbb{E}[1 - \phi \mid \neg H] = 1 - \mu\).
  - Expected change in log-odds:
    \[
    \mathbb{E}[\Delta \text{log-odds}] = P(H) \log(1/\mu) + P(\neg H) \left[ \mu \log(1/\mu) + (1 - \mu) \cdot (-\infty) \right].
    \]
    The \(-\infty\) term is problematic; instead, use mutual information.
  - Mutual information \(I_A(H; \text{obs})\):
    \[
    I_A = H(H) - H(H \mid \text{obs}),
    \]
    where \(H(\cdot)\) is entropy. With \(P(H) = q\), \(P(\text{black} \mid \neg H) = \mu\):
    \[
    P(\text{black}) = q + (1-q)\mu, \quad P(H \mid \text{black}) = \frac{q}{q + (1-q)\mu}, \quad P(H \mid \text{non-black}) = 0.
    \]
    \[
    I_A = -q \log q - (1-q)\log(1-q) - \left[ P(\text{black}) \cdot h\left( \frac{q}{q + (1-q)\mu} \right) \right],
    \]
    where \(h(p) = -p \log p - (1-p)\log(1-p)\). For small \(q\) and \(\mu \approx 1\), \(I_A \approx (1-q)(1-\mu) \log(1/q)\) (high if \(\mu < 1\)).

  **Strategy B (sample from catalogue)**:
  - Possible observations: Non-black raven (falsifies \(H\)), black raven (supports \(H\)), or non-ravens (weak effect).
  - Probability of falsifying \(H\) per draw (under \(\neg H\)): \(P(R \cap \neg B \mid \neg H) = \epsilon (1 - \mu)\) (since ravens are rare).
  - Non-ravens: Observing \(\neg R \cap \neg B\) gives \(BF \approx 1 + O(1/N)\) under uniform prior (weak confirmation), but negligible if \(\epsilon \ll 1\).
  - Mutual information \(I_B\):
    - Falsifying observation: \(I_B\) contribution \(\approx P(\text{non-black raven}) \cdot \log(1/q) = \epsilon (1-\mu)(1-q) \log(1/q)\).
    - Other observations: Small impact (e.g., black raven has \(BF = 1/\mu\), but \(P(\text{black raven}) \approx \epsilon \mu\)).
    - \(I_B \approx \epsilon (1-\mu)(1-q) \log(1/q)\) (much smaller than \(I_A\)).

  **Comparison**:
  - Expected information per label: \(I_A \gg I_B\) because:
    \[
    \frac{I_A}{I_B} \approx \frac{(1-\mu) \log(1/q)}{\epsilon (1-\mu) \log(1/q)} = \frac{1}{\epsilon} \gg 1.
    \]
  - Strategy A (sample from ravens) is more efficient: Higher probability of decisive evidence (falsification or strong confirmation).
  - **Paradox sting**: The paradox claimed that red herrings confirm \(H\), implying they might be worth seeking. But with cost per label, Strategy B (which collects red herrings) is inefficient. The Bayesian resolution shows that while red herrings confirm \(H\) under some protocols, their informativeness per unit cost is low. The paradox was partly about an "exchange rate" between evidence and effort: once effort is explicit, the red herring is not worth the cost.

  ---

  ### Residue Report

  **What translates cleanly**:
  - **Equivalence of hypotheses**: Logically equivalent forms of \(H\) have identical posteriors (e.g., original vs. contrapositive).
  - **Quantitative confirmation**: Observing a black raven or (under specific protocols) a red herring shifts the posterior, with magnitude computable from the protocol and prior.
  - **Generalization bounds** (implicitly): The finite catalogue resembles a training set; out-of-distribution evaluation would require extending to unseen objects (see below).

  **What translates with distortion**:
  - **Open-ended domain**: The paradox quantifies over all objects (past, present, future), but our sample space is finite. Distortion: We assume the catalogue is large but fixed. To model open-endedness, we could add a hierarchical prior (e.g., catalogue as random sample from superpopulation), but this adds complexity not in the paradox.
  - **Universal generalization as a point hypothesis**: \(H\) is a single point (\(b=0\)) in our space. Distortion: In practice, \(H\) might be embedded in a larger space (e.g., \(b \leq \delta\)), and the choice of prior on \(a, c, d\) (and rareness of ravens) influences results. The paradox does not specify this structure.
  - **Sampling protocols**: The paradox assumes a protocol-free evidential relation, but our framework requires explicit protocols. Distortion: Evidence is cardinal and protocol-dependent, whereas Nicod's intuition is qualitative.

  **What has no expression in your vocabulary**:
  - **Qualitative, protocol-free confirmation**: Hempelian confirmation is a binary "observation \(E\) confirms hypothesis \(H\)" independent of how \(E\) was obtained. Your framework has no analogue; evidence is always tied to a sampling protocol and measured cardinally.
  - **Normative upshot for inquiry**: The paradox implies we "ought" to seek confirming instances, but your framework only evaluates predictions against a deployment distribution (e.g., via loss minimization). Confirmation has no normative force; optimal search is determined by cost-sensitive informativeness, not logical structure.
  - **A priori domain generalization**: The paradox treats \(H\) as a claim about unseen objects, but your framework evaluates generalization via out-of-distribution bounds or domain shifts (covariate shift). The universal quantifier is not natively supported; it requires explicit modeling of domain shift or i.i.d. assumptions.

  **Additional residue**: 
  - **Logical equivalence vs. evidential equivalence**: The paradox assumes logical equivalence implies evidential equivalence, which your framework satisfies. But it misses that the same observation can support logically equivalent hypotheses differently if obtained via different protocols.

  ---

  ### Verdict on the Residue

  The protocol-free, qualitative notion of confirmation is a genuine blind spot. A theory of confirmation needs it to capture pre-theoretic intuitions (e.g., "a red herring confirms \(H\)" without specifying sampling). Your framework structurally cannot supply this; it binds evidence to protocols and predictive risk, making it descriptive rather than normative.

  **What a framework with the missing piece would look like**:
  - **Protocol-free evidence**: Define a primitive "\(E\) confirms \(H\)" that depends only on logical/content relations, not sampling. For example, \(E\) confirms \(H\) if \(E\) is a positive instance of \(H\) under a "natural" categorization.
  - **Normative inquiry**: Rules like "seek instances of the hypothesis" derived from logic, not cost-benefit.
  - **Open-ended domains**: Treat \(H\) as a universal generalization over any domain, using modal logic or possible worlds.

  However, this residue is **doing less work than it appears**. The paradox arises because it ignores the role of effort and protocol in evidence. Once made explicit (e.g., via informativeness per cost), the paradox dissolves: red herrings confirm negligibly and are inefficient to collect. The paradox was really about **misapplying logical equivalence to ignore sampling protocols and effort**. In real machine learning (e.g., active learning with annotation budgets), protocol and cost dominate; the "absurdity" vanishes when efficiency is prioritized. Thus, your framework exposes a flaw in the paradox, making the residue less compelling for applied work.
