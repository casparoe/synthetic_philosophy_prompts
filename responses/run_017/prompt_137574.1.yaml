  - If H is true (probability q = P(H)), we always get a black raven, and the log BF is log((α+β)/α) =: c (a positive number, since (α+β)/α>1).
  - If H is false (probability 1-q), then with probability φ (which is random) we get a black raven (log BF = c) and with probability 1-φ we get a non-black raven (log BF = -∞). But we have to take the expectation over φ.

  The expected change in log odds given ~H is: E[ φ * c + (1-φ) * (-∞) | ~H ] = c * E[φ|~H] + (-∞) * E[1-φ|~H]. This is -∞ unless P(φ=1|~H)=0? But we are not conditioning on φ=1. So it's -∞.

  This is not helpful. We must avoid the -∞. Instead, we consider the expected gain in information about H.

  We use the mutual information: I(H; X) = H(H) - H(H|X)

  H(H) = -q log q - (1-q) log(1-q)

  We compute H(H|X) for X being the observation from a raven.

  X can be: black or non-black.

  P(black) = P(black|H) q + P(black|~H) (1-q) = q * 1 + (1-q) * E[φ|~H]

  Assume that under ~H, E[φ] = μ. Then P(black) = q + (1-q)μ

  P(non-black) = 1 - P(black) = (1-q)(1-μ)

  Now, P(H|black) = P(black|H) q / P(black) = q / [q + (1-q)μ]

  P(H|non-black) = 0, because if we see a non-black raven, H is false.

  So the conditional entropy:

  H(H|X) = P(black) * h( P(H|black) ) + P(non-black) * h(0)

  where h(p) = -p log p - (1-p) log(1-p) for p in [0,1]. Note h(0)=0.

  So H(H|X) = P(black) * h( q / [q + (1-q)μ] )

  Therefore, the mutual information is:

  I = H(H) - H(H|X) = -q log q - (1-q) log(1-q) - [ (q + (1-q)μ) * h( q / [q + (1-q)μ] ) ]

  This is a bit messy. We can approximate if q is small (which it might be if ravens are rare and we are not sure about H).

  But we also need the same for strategy B.

  Strategy B: sample from the entire catalogue.

  Now we have four possible outcomes:

  - Raven and black: supports H (BF = 1 / [probability of raven and black under ~H] ... which is complicated).

  But note: if we see a non-black raven, we falsify H. Otherwise, we get either a black raven, a black non-raven, or a non-black non-raven.

  The probability of falsifying H is the probability of drawing a non-black raven. Under ~H, this is p_01. Under H, it is 0.

  The mutual information for strategy B is more complex.

  But we can argue: the probability of falsifying H in one draw is:

  P(non-black raven) = P(~B and R) = under H: 0, under ~H: some value.

  In particular, under ~H, we have E[p_01] under the prior. Let this be δ, which is expected to be small because ravens are rare and non-black ravens might be rare too.

  Then:

  P(falsify) = P(non-black raven) = 0 * q + δ * (1-q) = δ(1-q)

  If we don't falsify, we get one of the other three. The mutual information would be:

  I_B = H(H) - H(H|X)

  H(H|X) = sum over outcomes P(outcome) * H(H|outcome)

  The outcomes:

  1. Non-black raven: then H is false, so H(H|outcome)=0.
  2. Black raven: then we update H: P(H|black raven) = P(black raven|H) q / P(black raven) = [P(black raven|H) q] / [P(black raven|H)q + P(black raven|~H)(1-q)] = [p_11|H q] / [p_11|H q + p_11|~H (1-q)]

  But under H, p_11 = P(raven and black) = P(raven) (since all ravens are black) = p_R. Under ~H, p_11 = P(raven and black) = p_R * φ (where φ=P(black|raven)).

  We need expectations over the prior.

  This is very messy.

  We can approximate by noting that the most efficient way to falsify H is to look for a non-black raven. The probability of finding one in one draw is δ(1-q) for strategy B. For strategy A, if we sample from ravens, the probability of finding a non-black raven is (1-φ) under ~H. The expected probability is E[1-φ|~H] = 1-μ.

  But in strategy A, we are only sampling from ravens. The cost of finding a raven in the first place is not included because we are already sampling from ravens. But in strategy B, we may not sample a raven at all.

  Therefore, per label, strategy A (sampling from ravens) has a higher chance of falsifying H if it is false. In fact, in strategy B, the probability that a random object is a raven is small (ε), and then given it is a raven, the probability that it is non-black is 1-φ. So the probability of falsifying H in one draw in strategy B is about ε * (1-μ) (under ~H). Whereas in strategy A, it is about 1-μ.

  So the ratio is 1/ε, which is large. So per label, strategy A is much better for falsifying H.

  Moreover, if H is true, then strategy A will only yield black ravens, which give a constant Bayes factor of c per observation. But after a few, we become confident. Strategy B, when H is true, we might see non-ravens, which give a small Bayes factor (like 4/3 per non-black non-raven, and 4/3 per black non-raven? But if ravens are rare, the effect of non-ravens is negligible).

  Therefore, strategy A is far more efficient per label.

  Now, what about the paradox? The paradox is resolved in the sense that while a non-black non-raven does confirm H (as in protocol 1), it does so very weakly compared to a black raven. And when we consider the cost of obtaining a non-black non-raven (which requires us to sample from the entire catalogue, and most objects are non-ravens) versus the cost of obtaining a black raven (which is the same as sampling from ravens and then observing black), the latter is more efficient because ravens are rare.

  Thus, the paradox loses its sting once we account for the cost per observation. The Bayesian analysis shows that the non-black non-raven observation is evidentially relevant but very weak, and it is not cost-effective to seek them out.

  3. **Residue report**

  We consider what translates cleanly, with distortion, or not at all.

  **Hempelian confirmation is qualitative and independent of sampling protocol**: This does not translate cleanly. In our framework, the evidential impact depends on the sampling protocol. We saw that the same observation (non-black non-raven) has different impacts under protocol 1 and protocol 2. The distortion is that we have to specify the protocol to assign an evidential weight.

  **The open-ended domain**: The original paradox is about an open-ended domain (all ravens, past, present, future, anywhere). In our setup, we used a fixed finite catalogue. We can extend to an infinite population by using a prior with i.i.d. sampling? But then we have to model the generalization. This does not survive translation perfectly. We can think of the fixed catalogue as a sample from a superpopulation, and then the hypothesis H is about the entire superpopulation. But then the prior over the superpopulation parameters would be analogous. However, the paradox is often set in a setting where the domain is not fixed. We can do a two-stage model: the catalogue is a random sample from the world, and then we have a prior on the world. But that adds a layer of complexity. The open-endedness is not directly captured, but we can approximate by letting N be large and interpreting the prior as about the world.

  **Universal generalization as a point hypothesis**: In our setup, H is the point b=0. In a practical hypothesis class, we might have a smooth prior on b, and H is a single point. This is problematic because the prior probability of H is zero if we put a continuous prior on b. We avoided that by using a finite population or by using a mixture prior (point mass at b=0). The choice of neighbouring hypotheses is doing work: the prior on the other parameters (like the frequency of ravens) matters. This is a distortion: the original paradox does not specify the prior, so we have to add it.

  **Confirmation as normative for inquiry**: In our framework, we evaluate evidence by the posterior, and we evaluate inquiry by information gain or reduction in predictive risk. We have a clear criterion for which strategy is better: the one that maximizes the expected information per unit cost. The original paradox was about what confirms the hypothesis, but it did not explicitly say what we ought to do. However, the paradox is sometimes taken to suggest that we can confirm H by looking at non-black non-ravens, which seems counterintuitive. Our analysis shows that while that is true, it is not efficient. The normative upshot is that we should sample in a way that maximizes information per cost. So this does translate, but with a twist: the evidential relation is there, but it does not dictate what to do without considering costs.

  4. **Verdict on the residue**

  The fact that our vocabulary is protocol-bound and tied to predictive risk is a genuine blind spot for a theory of confirmation that aspires to be protocol-free. The Hempelian notion of confirmation as a qualitative relation between a single observation and a hypothesis, independent of how the observation was obtained, is not something that our framework captures. We always need to know the sampling mechanism to compute the evidential impact.

  However, is this a bug or a feature? We would argue that the protocol-free notion of evidence is doing less work than it appears. In real scientific inquiry, the protocol matters. The same physical observation can have different evidential meanings depending on whether it was the result of a targeted search or a random sample. Therefore, the residue might indicate that the paradox was partly a claim about the exchange rate between evidence and effort, and by making effort explicit, we dissolve the paradox.

  What was the paradox really about? It was about the interplay between logic and evidence. The equivalence condition (that logically equivalent hypotheses should be confirmed equally) is maintained in the Bayesian framework: the same hypothesis in different forms gets the same posterior. But the evidential impact of an observation depends on the sampling protocol, not just the logical form.

  A framework that would supply the missing piece (a protocol-free notion of evidence) would have to be able to assign evidential weight to an observation without any reference to how it was obtained. But that seems impossible because the weight depends on the process. For example, if I happen to see a red herring, and I was not looking for it, that should have less weight than if I were systematically sampling non-black objects. But the protocol-free view cannot capture that.

  Therefore, we conclude that the residue (the protocol-free aspect) is not a necessary part of a theory of evidence. The probabilistic framework, by making the protocol explicit, does not have a blind spot but rather a more adequate representation of scientific practice.
