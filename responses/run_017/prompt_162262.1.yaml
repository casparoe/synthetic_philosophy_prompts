prompt: |-
  I am helping a private foundation draft the call for proposals for a single, tightly scoped research program: roughly eight researchers for three years, working mostly in formal epistemology and decision theory, with one practitioner-facing deliverable at the end. The intended users are institutional risk committees — pension-fund trustees, hospital protocol committees, national pandemic-modelling groups: bodies that must commit to a course of action while the uncertainty they reason from is, by everyone's admission, indeterminate, and that must afterwards defend that choice in public, to a regulator or a court. Please answer in American English, and please do not spend your words on a survey of the field or on suggested reading; I want the reasoning, not the map.

  Take the background framework to be the familiar one in which uncertainty is represented not by a single probability function but by a convex set of them, or equivalently by lower and upper probabilities for events and lower and upper previsions for gambles, with a coherence condition playing the role that probabilistic coherence plays in the precise case. On that basis, here is my own rough inventory of where the pressure lies; correct it where it is wrong:

  (i) the gap between a set of probabilities and a decision, and the rivalry between maximizing the worst case, ruling out only options that are dominated under every distribution in the set, and various compromise rules in between;
  (ii) how to revise the set in light of new evidence, including the phenomenon usually called dilation, in which learning the value of an event whose own probability is unknown leaves one strictly less precise about the hypothesis of interest;
  (iii) the several inequivalent notions of independence that coincide in the precise case and come apart under imprecision;
  (iv) whether the set is best read as a genuine doxastic state of a single agent or as a report of what a divided evidence base, or a divided committee, permits;
  (v) how to elicit interval-valued uncertainty from experts, and how to communicate it to people who will eventually ask for a number.

  Three further constraints, which I have not seen addressed together and two of which I am stipulating myself. First, I want the program to treat separately indeterminacy that comes from sparse evidence, indeterminacy that comes from disagreement among sources, and indeterminacy that a legal or constitutional precautionary norm imposes regardless of evidence; my suspicion is that a rule apt for the third is being smuggled in as an answer to the first two. Second, call it terminal sharpening: any committee procedure must, by some deadline, output a number, so the program owes an account of when and by what rule a set may legitimately be collapsed. Third, call it the one-page constraint: the procedure must yield a justification a lay auditor can follow in a page, without the committee pretending to a precision it does not have.

  What I want from you is a defended agenda of four to six open questions that this program should take up, in order. For each: what makes it worth three years of someone's career; which other questions its answer is upstream of, and which depend on it; whether it is tractable by theorists working with existing tools or is really stalled pending empirical or computational work; and how you would divide the eight slots among them. Then tell me explicitly which items you would leave out — because the answer would not change much downstream, or because the question as I have framed it rests on a confusion — and what result, proof, or piece of evidence appearing in the next two or three years would move an item up or down your ordering.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're helping a private foundation draft a call for proposals for a research program focused on formal epistemology and decision theory. The program will involve eight researchers over three years, targeting institutional risk committees like pension funds or hospital boards. These groups need to make decisions under deep uncertainty and justify them publicly. 

  The user has outlined a framework using convex sets of probabilities instead of single probabilities. They've listed five pressure points: decision rules under indeterminacy, belief revision (including dilation), independence concepts, interpretation of sets (doxastic vs. aggregated), and elicitation/communication challenges. Plus three additional constraints: separating sources of indeterminacy, terminal sharpening, and the one-page justification requirement.

  Hmm, the core tension here is between rigorous theory and practical application. The user wants research that bridges this gap for high-stakes institutional decisions. Their unspoken frustration seems to be that current literature either stays abstract or oversimplifies for practicality. The mention of "smuggling" precautionary norms suggests they suspect theoretical contamination in applied work.

  First, I need to prioritize questions that address their constraints while advancing theory. The terminal sharpening and one-page constraint are particularly demanding - most imprecise probability work doesn't tackle these head-on. The three sources of indeterminacy separation is also unusual; typically papers treat sparse evidence and expert disagreement as functionally equivalent.

  Looking at their pressure points:
  - (i) Decision rules: Absolutely critical. Without this, committees can't act.
  - (ii) Belief revision: Important but maybe less urgent? Dilation is theoretically fascinating but might not break committees in practice.
  - (iii) Independence: Tricky. Vital for modeling but the user might see it as academic unless tied to concrete cases.
  - (iv) Interpretation: Core to their "divided committee" use case. Can't skip.
  - (v) Elicitation/communication: Essential for the practitioner deliverable.

  The practitioner-facing deliverable suggests prioritizing questions that yield usable methodology. But the foundation's focus on formal epistemology means we can't sacrifice theoretical rigor. Need balance.

  For the agenda, I'm thinking:
  1. Must start with decision rules (#1 in my response) - it's the endpoint committees need. Then independence (#3) because it feeds into decision modeling. Interpretation (#4) follows naturally for committees. Terminal sharpening (#5) and communication (#6) build on these. Revision (#2) I'd deprioritize slightly - it matters but doesn't block other work.

  Justifying the order: You can't design communication protocols (#6) until you know what's being communicated (decisions from #1, sharpened outputs from #5). You can't handle disagreement (#4) without first clarifying how independence works (#3) in group contexts.

  Leaving out dilation-heavy belief revision feels right. While intellectually important, committees facing public justification care more about defensible outcomes than theoretical purity of updating. Plus, terminal sharpening might circumvent some revision challenges.

  Allocating researchers: 2 on decision rules (it's foundational), 2 on independence (computationally heavy), 1 on interpretation, 2 on terminal sharpening (practical payoff), 1 on communication. Could shift 0.5 FTE from interpretation to sharpening if needed.

  Triggers for reprioritization: If someone proves all sharpening methods violate coherence, that elevates #5. If empirical work shows committees ignore independence, maybe downgrade #3. User's "smuggled norms" suspicion - if validated early, it makes #4 urgent.

  Biggest risk is over-indexing on theory. Must keep asking: "Would this help a pension fund trustee sleep at night?" That's the real test.
answer: |-
  Here is a prioritized research agenda addressing your constraints and pressure points, with explicit trade-offs:

  ### Core Agenda (6 Questions, 8 Researchers)
  1. **Decision Rules for Terminal Action under Ambiguity Sources**  
     *Why critical?* The primary gap between theory and practice. Must resolve rivalry among maxmin, E-admissibility, and compromise rules *while distinguishing between* evidence-sparse, source-disagreement, and normative indeterminacy.  
     *Downstream impact:* Informs terminal sharpening (#5) and justification (#6). Upstream of all applied work.  
     *Tractability:* Theoretical (4 researchers). Requires axiomatic work on source-tagged ambiguity sets.  
     *Allocation:* **2 researchers**

  2. **Independence Concepts for Multi-Source Aggregation**  
     *Why now?* Committee decisions require merging conflicting expert inputs. Epistemic/strategic independence distinctions collapse under source-disagreement indeterminacy.  
     *Downstream impact:* Enables coherent group belief representation (#4) and prevents dilation pitfalls in revision (#3).  
     *Tractability:* Theoretical/computational (existing tool-ready).  
     *Allocation:* **2 researchers**

  3. **Dilation-Resistant Belief Revision**  
     *Why worth it?* Learning under sparse evidence exacerbates imprecision, crippling committees' ability to update defensibly. Focus on *when* dilation occurs under your three indeterminacy types.  
     *Downstream impact:* Foundational for evidence-sequential decisions (e.g., pandemic modeling).  
     *Tractability:* Stalled pending computational advances for set-valued Bayes.  
     *Allocation:* **1 researcher**

  4. **Set Interpretation: Doxastic vs. Committee Aggregation**  
     *Why essential?* Justification to regulators hinges on whether the set represents genuine uncertainty or mere dissent. Requires formalizing "divided evidence base" as constraints on the credal set.  
     *Downstream impact:* Determines elicitation protocol (#6) and sharpening legitimacy (#5).  
     *Tractability:* Empirical-theoretical hybrid (behavioral experiments on group credence).  
     *Allocation:* **1 researcher**

  5. **Terminal Sharpening: Coherence-Preserving Collapse Rules**  
     *Why non-negotiable?* Committees *must* output a number. Key is identifying when collapse violates no dominance or injects arbitrariness. Distinguish sharpening for action vs. justification.  
     *Downstream impact:* The practitioner deliverable. Depends on #1-4.  
     *Tractability:* Empirical validation needed (court cases/regulatory audits).  
     *Allocation:* **1 researcher**

  6. **One-Page Justification Protocols**  
     *Why last?* Communication depends on prior choices. Requires translating sets into auditable arguments (e.g., "We excluded probability X because...").  
     *Downstream impact:* The ultimate test of usability.  
     *Tractability:* Empirical (user-testing with mock committees).  
     *Allocation:* **1 researcher**

  ### Explicit Omissions & Rationale
  - **General elicitation methods (your v)**  
    *Cut because:* Elicitation must be source-specific (per your 1st constraint). Subsumed under #4 (for dissent) and #6 (for sparse evidence).  
  - **Normative indeterminacy as primary focus**  
    *Cut because:* You suspect conflation; isolating it in #1/5 is sufficient. Dedicated work here wouldn't change downstream outputs.  
  - **Full taxonomy of compromise rules**  
    *Cut because:* Intractable without terminal action context. #1 forces convergence on rules meeting sharpening/justification constraints.

  ### Reprioritization Triggers
  - **Elevate #5 if:** A 2025 proof shows *no* coherent sharpening rule exists for certain independence assumptions.  
  - **Deprioritize #3 if:** Computational work (e.g., Walley-Stein algorithms) resolves dilation in evidence-sparse cases by 2026.  
  - **Drop #4 if:** Empirical studies show committees intuitively interpret sets as doxastic (unlikely).  

  ### Why This Order?
  The sequence mirrors the decision pipeline: from acting under ambiguity (#1) → modeling inputs (#2,3) → aggregating views (#4) → producing outputs (#5) → justifying them (#6). It forces early confrontation with your "smuggled norms" concern by tagging indeterminacy sources in #1, and reserves 50% of resources (#1-2) for the core tension: acting when probabilities refuse to be tamed.
