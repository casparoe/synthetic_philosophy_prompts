prompt: |-
  I'm a PhD student in distributed data management — my dissertation is on merge semantics for replicated stores, so I spend my days with version vectors, multi-value registers, lattice joins, integrity constraints, and repair-based approaches to querying data that violates those constraints. I've been sitting in on a philosophy-of-logic reading group this term, more or less as a tourist, and I have a suspicion I'd like properly checked rather than waved away. My sense is that dialetheism is either something my field already does routinely under another name or something my field structurally cannot express at all, and I can't tell which. My advisor's view — which I think is wrong but can't refute — is that it's all just SQL NULLs; my own view is that NULL behaves like a gap, not a glut, but I can't turn that into an argument on my own. (This came up at a workshop dinner and I've been chewing on it since.)

  So here is the job. Take the dialetheist position apart into its component claims and translate them into my vocabulary one at a time, as faithfully as you can. The claims I have in mind are: the glut/gap contrast itself, i.e. the insistence that some contradictions are true rather than that some questions have no answer, and that this is a metaphysical thesis about truth-bearers rather than an epistemic thesis about our information; the rejection of explosion together with the rejection of disjunctive syllogism that it seems to require, given the standard argument for explosion from addition and disjunctive syllogism; the semantics of the paraconsistent logic usually called LP, in which a sentence may take both truth values and validity is defined as preservation of being *at least* true rather than of truth simpliciter; the motivation from the self-referential paradoxes — the Liar and Russell's, which Priest reads at face value as exhibiting a common inclosure structure rather than as reductios of the notions involved; the need to stop short of trivialism, and the apparently related difficulty of saying, in the dialetheist's own vocabulary, that the contradictions are local and that a given contradiction is *merely* true-and-false rather than a licence for everything; the classical-recapture manoeuvre, whereby classical reasoning is supposed to be recovered inside consistent regions; and the standing objection that the dialetheist's negation is not really negation. For each of these, tell me what maps cleanly onto something in my toolbox — multi-value registers that keep concurrent writes side by side, joins in a lattice, eventual convergence, repairs with the certain-answer and brave-answer distinction over an inconsistent instance, three-valued logic and NULL, negation-as-failure under the closed-world assumption, AGM-style revision with consistency as a regulative ideal — what survives only if I distort it to fit, and what has no expression in my vocabulary at all.

  I've also been playing with two notions of my own, and I want them either used or diagnosed. Call a replicated store *repair-closed* if every state that violates the integrity constraints can be brought to a constraint-satisfying state by some sequence of admissible updates; my guess is that dialetheism, in my terms, is the claim that some stores are not repair-closed and that this is a fact about the data rather than a defect of the schema. And call a merge *glut-preserving* if, once it has accepted both a fact and its complement, no later admissible update can remove either — as against the *gap-generating* merges I actually know how to build, which answer an inconsistency by withholding, either returning the intersection over all repairs or defaulting to unknown. I suspect every merge in my repertoire is gap-generating, and I want to know whether that is a contingent engineering fact, a consequence of what a query language can express, or a sign that "glut" was never a distinct option to begin with — that the gap/glut distinction collapses as soon as you track provenance and are allowed to ask which replica asserted what. There is one further structural worry I can't shake: my framework has no way of saying, from inside, that the store is in a bad state, without stepping up to a meta-level that is itself assumed consistent, which looks uncomfortably like the dialetheist's own problem with asserting that not everything is true. So please close with the residue report: what my vocabulary carries, what it distorts, what it cannot say at all, and — the part I actually care about — whether that residue is a limitation of replicated-data theory or evidence that the dialetheist's claim was less determinate than it sounds.
reasoning: |-
  We are going to break down the dialetheist position and map its components to the vocabulary of distributed data management. We'll go point by point, as requested.

  ### 1. Glut vs Gap
  Dialetheism asserts that some contradictions are true (gluts: both true and false) rather than that some questions have no answer (gaps: neither true nor false). This is a metaphysical claim about truth-bearers.

  In your terms:
  - A **gap** corresponds to the absence of a fact (or its negation) in the store, which might be represented by a NULL or by the lack of an entry. This is what you see in multi-value registers that keep multiple versions and then resolve to a gap when there is conflict (e.g., by returning the intersection of repairs or by marking as unknown).
  - A **glut** would correspond to having both a fact and its negation present and accepted in the store simultaneously, without resolution to a single value or to a gap.

  However, in your field, the typical approach to inconsistency is to either:
     - Keep both values (as in multi-value registers) but then when querying, you might not treat the data as both true and false simultaneously. Instead, you might return multiple possibilities (like in the certain/brave answers) or mark as unknown (gap).
     - Use repair-based approaches that resolve to a consistent state, which might remove one of the conflicting values (thus avoiding gluts).

  But note: if you have a multi-value register that holds both `A` and `not A` and you have a query language that can return both as true (for example, in a brave query) then you are effectively representing a glut at the level of the data instance. However, the brave query does not assert that both are true simultaneously in the real world; it just says that in some repair, `A` is true and in some, `not A` is true. The dialetheist, by contrast, would say that both are true in the same world.

  So, the key difference: in your field, having both values is usually understood as representing an inconsistency that needs repair (an epistemic state of uncertainty or a temporary conflict) and not as a metaphysical truth.

  **Mapping**: 
  - The gap/gut distinction can be represented in your data structures (multi-value registers can hold both values, which is a glut at the data level). 
  - But the interpretation is different: for you, it's a conflict to be resolved; for dialetheism, it's a true state of affairs.

  **Verdict**: It maps structurally, but the interpretation (metaphysical vs. conflict) is different. So it's a distortion to force the mapping.

  ### 2. Rejection of Explosion and Disjunctive Syllogism
  Dialetheism rejects explosion (from a contradiction, anything follows) by adopting a paraconsistent logic. In particular, they reject disjunctive syllogism (from `A ∨ B` and `¬A`, infer `B`) because if `A` is both true and false, then `¬A` is also true (and false), so we cannot conclude `B`.

  In your field, when the store is inconsistent, you typically do not let arbitrary queries be true. For example:
  - In certain-answer semantics, only the facts that are in every repair are returned. So if you have both `A` and `¬A`, then a query for `B` would not be a certain answer (unless `B` is in every repair).
  - In brave-answer semantics, you might get `B` if it is in at least one repair, but that doesn't mean that from `A ∨ B` and `¬A` you infer `B` in the presence of inconsistency.

  However, note that in the underlying logic of the database, if you are using a classical logic for the repair process, then disjunctive syllogism is still valid in each repair. But the overall query answering does not use disjunctive syllogism on the inconsistent database because the database is not taken as a set of true premises in a classical sense.

  **Mapping**: 
  - The rejection of explosion is built into the repair-based approach: inconsistent data does not make every sentence true (because we consider multiple repairs). 
  - The rejection of disjunctive syllogism is also present: if we have `A ∨ B` and `¬A` in the database, but the database is inconsistent on `A`, then we cannot conclude `B` in the certain-answer semantics (because in some repairs `A` is true and `B` might be false, and in others `A` is false and `B` might be true). 

  But note: the dialetheist rejects disjunctive syllogism as invalid in their logic (LP), whereas in your framework, disjunctive syllogism is valid in each classical repair. However, the overall query answering (over the inconsistent instance) does not use it in the same way.

  **Verdict**: The behavior (avoiding explosion and not drawing arbitrary conclusions) maps, but the underlying logic is different (classical in repairs vs paraconsistent). So it's a structural match with a distortion in the mechanism.

  ### 3. Semantics of LP Logic
  In LP, a sentence can be both true and false (a glut). Validity is defined as preservation of being at least true: if the premises are at least true (i.e., true, or both true and false) then the conclusion must be at least true.

  In your field:
  - A multi-value register that holds both `A` and `¬A` can be seen as assigning both truth values to `A`.
  - For querying, if we define "at least true" as "being present in the set of data (with any status)", then we might have a parallel. For example, if we have a query that returns a fact if it is present in the data (even if there is a conflict), then that fact is "at least true". 

  But note: in LP, the truth value of a compound sentence is computed by:
  - `A ∧ B` is true if both are true, false if at least one is false.
  - `A ∨ B` is true if at least one is true, false if both are false.

  In your brave-answer semantics, we might say that a sentence is "brave-true" if it is true in at least one repair. But that is not the same as being both true and false in the same state.

  Alternatively, if we consider the inconsistent database state itself as the model, then we might define a three-valued semantics (with both) for the entire language. However, the brave/certain answers are defined over classical models (the repairs) and not a single non-classical model.

  **Mapping**: 
  - The idea of having both values in the store and then defining a valuation that allows both is representable (like a three-valued logic with a "both" value). 
  - However, the LP truth tables are different from the typical three-valued logics used in databases (like Kleene's) and also different from the way brave/certain answers work.

  **Verdict**: It can be mapped by defining a three-valued logic over the inconsistent state (with values: true, false, both) and then defining validity as preservation of non-false (i.e., true or both). But note: this is not the same as the repair-based approach. So it can be expressed, but it's not standard in your field.

  ### 4. Motivation from Paradoxes (Liar, Russell)
  Dialetheism takes the Liar sentence (which says "this sentence is false") as both true and false. Similarly for Russell's paradox (the set of all sets that are not members of themselves is both a member of itself and not).

  In your field, if we try to model such sentences, we might get a circular dependency or a constraint violation. But typically, you would avoid having such a sentence by design (e.g., by having a schema that prevents self-reference) or by marking it as an error (gap or inconsistency to be repaired).

  However, if we allow self-referential statements and do not repair, then we might have a state where both the statement and its negation are present. For example, if we have a table for statements and their truth values, and the Liar statement `L` is stored as `truth_value(L, false)`. But then if we also have a rule that says the truth value of a statement is what is stored, then we get a conflict: if `L` is false, then it should be true (since it says it is false) and vice versa. 

  In your replicated store, if two replicas update the truth value of `L` to `false` and `true` respectively, and then merge, you might have both `truth_value(L, true)` and `truth_value(L, false)` in the store. That would be a glut at the data level.

  **Mapping**: 
  - The Liar paradox can be represented as a conflicting update (one replica asserts `truth_value(L, true)`, another `truth_value(L, false)`) and then merged without resolution. 
  - However, the dialetheist claims that this is not just a conflict but a true contradiction. In your system, it's just an inconsistency that might be repaired.

  **Verdict**: The data state can be represented (as a glut) but the interpretation (metaphysical truth) is different. So again, a distortion.

  ### 5. Stopping Short of Trivialism and Asserting Local Contradictions
  Dialetheism must avoid trivialism (everything is true). They claim that contradictions are local. But they face the challenge of expressing that a given contradiction is merely true-and-false without implying that everything is true (since they reject explosion).

  In your field, if the store is inconsistent, it doesn't mean that every fact is stored. So even if there is a contradiction on `A`, it doesn't mean that `B` is true. This is achieved by the repair-based approach: the repairs only change the inconsistent parts, and the rest remains. 

  Moreover, you can have a constraint that the store is not trivial (by having constraints that are not violated everywhere). But note: if the store is inconsistent, then by explosion in classical logic, every fact would follow. But your repair-based approach avoids that by not using the inconsistent store as a classical model.

  **Mapping**: 
  - The idea of local contradictions is naturally represented: an inconsistency in one part of the store does not affect other parts. 
  - The avoidance of trivialism is built into the repair-based approach: the repairs are minimal changes that restore consistency, so they only alter the facts involved in the inconsistency.

  **Verdict**: This maps very cleanly. The repair-based approach naturally isolates inconsistencies and prevents them from spreading.

  ### 6. Classical Recapture
  Dialetheism claims that in consistent regions, classical reasoning is recovered.

  In your field, if the store is consistent (no conflicts, and satisfies constraints), then the repairs are trivial (the store itself) and the certain-answer and brave-answer coincide. So classical reasoning holds.

  **Mapping**: Perfect match. When the data is consistent, the repairs are the database itself, and querying is classical.

  ### 7. The Objection that Dialetheist Negation is Not Real Negation
  The objection is that the dialetheist's negation (which allows a sentence and its negation to both be true) is not the "real" negation.

  In your field, negation is typically classical within each repair. However, at the level of the inconsistent store, if we have both `A` and `¬A`, then we are using a non-classical negation. But note: the negation in the store is just a symbol, and the meaning is given by the repairs. 

  Alternatively, if we use a three-valued logic with a "both" value, then the negation of a "both" value is also "both". This is similar to LP.

  **Mapping**: 
  - The negation in the dialetheist's LP is defined as: if `A` is both, then `¬A` is both. 
  - In your multi-value register with a "both" state, negation would map `A` to `¬A` and vice versa. So if `A` is both, then `¬A` is both. 

  However, in the repair semantics, the negation is classical in each repair. So the meaning of `¬A` in the store is that in each repair, `¬A` must hold. But if the store has both, then in some repairs `A` is true and `¬A` false, and in others the opposite. So the store's `¬A` is not a classical negation.

  **Verdict**: The dialetheist's negation can be represented in the three-valued semantics of the inconsistent state, but it is not the same as the classical negation in repairs. This is a structural match for the behavior, but the interpretation (via repairs) is different.

  ### Your Notions

  #### Repair-Closed
  You define a store as *repair-closed* if every state violating constraints can be repaired by a sequence of admissible updates.

  Dialetheism, in your terms, would claim that some stores are not repair-closed and that this is a fact about the data (metaphysical) and not a defect of the schema.

  In your field, if a store is not repair-closed, it means there are states that cannot be fixed (by the allowed update operations) to satisfy the constraints. This might be a design flaw (the update operations are not powerful enough) or it might be that the constraints are too strong.

  But for dialetheism, the claim is that some contradictions are true and hence cannot be repaired (because they are not errors). So they would say that such stores are not repair-closed and that this is as it should be.

  **Mapping**: 
  - The notion of repair-closed is a property of your update operations and constraints. 
  - Dialetheism would say that for some constraints (like in the Liar) there is no consistent repair (without removing necessary data) and hence the store is not repair-closed. 

  But in your field, the typical assumption is that the constraints are correct and the data must be made to satisfy them. Dialetheism challenges that assumption.

  **Verdict**: This maps cleanly: dialetheism asserts that some stores (representing paradoxical situations) are not repair-closed and that this is a feature, not a bug.

  #### Glut-Preserving Merge
  You define a merge as *glut-preserving* if once it accepts both a fact and its complement, no later update can remove either.

  In your field, typical merges are gap-generating: they resolve conflicts by withholding (returning unknown or the intersection of repairs) or by choosing one value (which might be later updated). 

  But if you have a multi-value register that keeps both values (like in Conflict-free Replicated Data Types, CRDTs, that use sets) then you can have both. However, if you then have an update that removes one of the values, then the merge might remove it. So it is not necessarily preserved.

  To be glut-preserving, you would need to prevent any update that removes one of the conflicting values. This would require a policy that once a conflict is accepted as a glut, it stays.

  **Mapping**: 
  - You can design a merge that is glut-preserving by keeping both values and then disallowing any operation that would remove one without removing the other? But that might be tricky. 
  - Alternatively, you can mark the conflict as "accepted" and then prevent any further update that would break the glut. 

  However, this is not standard. In your field, you usually allow updates to remove data.

  **Verdict**: It is expressible (with a policy) but not typical. It would be a contingent engineering fact that your merges are gap-generating.

  ### Structural Worry: Meta-Level Consistency
  You worry that in your framework, to say that the store is in a bad state (inconsistent) you must step up to a meta-level that is consistent. This mirrors the dialetheist's problem of asserting that not everything is true without using a consistent meta-language.

  In your field:
  - The integrity constraints are defined in a meta-language that is assumed consistent. 
  - When you say the store is inconsistent, you are using a consistent meta-level.

  Similarly, dialetheists typically use a consistent meta-language to talk about the object language having contradictions.

  **Mapping**: This is a direct parallel. Both fields have this issue and handle it similarly: by having a meta-level that is consistent.

  ### Residue Report

  **What your vocabulary carries**:
  - The notions of gaps (via unknown or NULL) and gluts (via multi-value registers holding both values) can be represented in the data structures.
  - The avoidance of explosion and trivialism is naturally achieved by repair-based querying.
  - The idea of local contradictions and classical recapture in consistent regions fits perfectly.
  - The repair-closed property is a concept you can define and dialetheism's claim about non-repair-closed stores maps cleanly.

  **What it distorts**:
  - The interpretation of gluts: in your field, they are conflicts to be resolved (epistemic) and not metaphysical truths.
  - The underlying logic: you use classical logic in repairs, whereas dialetheism uses a paraconsistent logic (LP) in the object language.
  - The motivations from paradoxes: you can represent the data state of a paradox as a conflict, but you don't accept it as a true contradiction.

  **What it cannot say at all**:
  - There is no way in your current framework to assert that a glut is the correct state (metaphysically) without stepping into a repair-based view that sees it as an error.
  - The LP truth tables and their specific definition of validity (preservation of being at least true) are not built into your query answering (which is defined over classical repairs). You could define a three-valued logic over the inconsistent state, but that is not the same as the repair-based approach.

  **Conclusion on the Residue**:
  The residue (the metaphysical aspect of gluts and the specific paraconsistent logic) is a limitation of replicated-data theory only in the sense that your field is not designed to handle metaphysical truth but rather to manage data in the face of inconsistency. The dialetheist's claim is about the nature of truth and reality, which is outside the scope of data management. 

  However, the structural parallels are strong enough to suggest that the dialetheist's claims are not incoherent from a data management perspective. They can be modeled, but the interpretation is different. The residue does not show that the dialetheist's claim is less determinate; rather, it highlights that your field and dialetheism have different goals: one is about managing data in a distributed system, the other is about the nature of truth.

  Therefore, your advisor's view that it's "just SQL NULLs" is too simplistic: NULL represents a gap, not a glut. But you already knew that. The glut is represented by having both a value and its negation, which is distinct from NULL. However, the engineering practices of your field (repairing inconsistencies) mean that you typically don't preserve gluts, but that is a contingent choice, not a necessity.

  As for whether the gap/glut distinction collapses when you track provenance: it doesn't collapse. Provenance tells you the source (which replica said what) but doesn't change the fact that the store holds both. However, if you use provenance to resolve the conflict (by, say, preferring one replica) then you are generating a gap (if you remove both) or a single value. But if you keep both and mark them with provenance, then you still have a glut at the data level, even if you know where each came from.

  So, you can build a glut-preserving merge if you choose to. The reason you haven't is that it goes against the goal of achieving consistency (which is the standard design). But it is not impossible.
answer: |-
  ### Dialetheism Component Analysis in Distributed Data Management Terms

  I'll break down dialetheism's core claims and map them to your vocabulary, using your specified concepts (multi-value registers, lattice joins, repair semantics, etc.). For each component, I'll note whether it **maps cleanly**, **requires distortion**, or **has no expression** in your framework. I'll incorporate your notions of *repair-closed* and *glut-preserving* merges, and conclude with a residue report.

  ---

  #### **1. Glut/Gap Contrast (Metaphysical Gluts)**
  - **Dialetheist Claim**: Some contradictions are *true* (gluts: both true and false), not just gaps (neither true nor false). This is ontological, not epistemic.
  - **Your Framework**: 
    - **Gaps**: Directly map to `NULL`/unknown in query results (e.g., intersection over repairs in certain-answer semantics).  
    - **Gluts**: Represented structurally in **multi-value registers** (MVRs) storing concurrent writes. For example, a register for key `x` holding `{5, 7}` is a glut for "x=5" (true in some views, false in others).  
    - **Distortion**: Your gluts are *epistemic* (conflicting beliefs from replicas), not metaphysical truths. MVRs mark temporary uncertainty to be resolved, whereas dialetheism asserts gluts as actual states.  
    - **Repair-Closed Connection**: Dialetheism claims some gluts *cannot* be repaired (non-repair-closed stores), as they reflect reality. Your field assumes repairability (via schema/constraint updates).  
  - **Verdict**: **Maps structurally but distorts** (epistemic vs. ontological).

  ---

  #### **2. Rejection of Explosion & Disjunctive Syllogism**
  - **Dialetheist Claim**: Rejects explosion (ex falso quodlibet) by invalidating disjunctive syllogism (DS). If `A ∨ B` and `¬A` are true, but `A` is a glut, `B` doesn't follow.
  - **Your Framework**: 
    - **Repair Semantics**: Naturally rejects explosion. Inconsistencies don't make all queries true:  
      - Certain-answer semantics (∩ over repairs) only returns uncontested facts.  
      - Brave-answer semantics (∪ over repairs) may return contradictions but not trivialize.  
    - **Distortion**: Rejection of DS isn't direct. In repairs, DS holds *within each classical repair*. Brave answers might include `B` if it appears in *any* repair with `¬A`, but this is classical recapture, not a rejection of DS.  
  - **Verdict**: **Maps cleanly** for explosion; **distorts** for DS (your logic is classical inside repairs).

  ---

  #### **3. LP Semantics (Preservation of "At Least True")**
  - **Dialetheist Claim**: Sentences can be {true}, {false}, or {true, false}. Validity preserves "at least true" (no model where premises ≥ true and conclusion < true).
  - **Your Framework**: 
    - **Brave-Answer Semantics**: Maps to "at least true" – a fact is "brave-true" if true in *some* repair.  
    - **Lattice Joins**: In a truth-value lattice ({∅}, {T}, {F}, {T,F}), joins (`∨`) align with LP (e.g., `{T} ∨ {F} = {T,F}`).  
    - **Distortion**: Brave answers don't treat gluts as *simultaneous* truth values; they reflect uncertainty across repairs. LP's "both" is a single state, whereas your brave answers aggregate classical states.  
  - **Verdict**: **Maps with distortion** (aggregated classical vs. paraconsistent states).

  ---

  #### **4. Paradoxes as Inclosures (Liar, Russell)**
  - **Dialetheist Claim**: Liar ("this sentence is false") is a true glut via self-reference, not a reductio of logic.
  - **Your Framework**: 
    - **Constraint Violations**: A Liar-like assertion (`x = ¬x`) violates integrity constraints (e.g., `∀x, x ≠ ¬x`), triggering repairs.  
    - **No Expression**: Your repairs *eliminate* paradoxes (e.g., reject updates causing cycles), while dialetheism *embraces* them as gluts. Tracking provenance ("replica A said `x`; B said `¬x`") avoids treating the glut as a single truth-bearer.  
    - **Repair-Closed**: If the store isn't repair-closed, it mirrors dialetheism (e.g., no repair for `x = ¬x`). But you'd view this as a schema flaw; dialetheism sees it as ontological.  
  - **Verdict**: **No direct expression** (paradoxes are errors to fix, not truths).

  ---

  #### **5. Avoiding Trivialism & Localizing Contradictions**
  - **Dialetheist Claim**: Contradictions are local; "A is a glut" doesn't imply "all B are true." But expressing "merely a glut" without classical negation is hard.
  - **Your Framework**: 
    - **AGM Revision**: Consistency is a regulative ideal; minimal changes isolate contradictions (e.g., modify only violated constraints).  
    - **Lattice-Based Merges**: Joins preserve uncontested facts (e.g., `join({A}, {A,B}) = {A}`). Contradictions don't propagate.  
    - **Glut-Preserving Merge**: Your current merges are **gap-generating** (e.g., return `NULL` for conflicting `x=5`/`x=7`). A **glut-preserving** merge would require:  
      - Storing both values indefinitely (e.g., MVRs with no convergence).  
      - Preventing later updates from dropping either (e.g., via immutable assertions).  
      - But this violates **eventual convergence** – a core tenet of your field.  
  - **Verdict**: **Maps cleanly** for localization; **glut-preserving merges are expressible but antithetical** to convergence.

  ---

  #### **6. Classical Recapture in Consistent Regions**
  - **Dialetheist Claim**: Classical logic holds where no gluts exist.
  - **Your Framework**: 
    - **Eventual Consistency**: Once MVRs converge (e.g., via LWW or CRDTs), queries reduce to classical logic.  
    - **Repair-Based Querying**: In consistent regions, certain/brave answers converge to classical results.  
  - **Verdict**: **Maps perfectly**.

  ---

  #### **7. "Negation is Not Real Negation" Objection**
  - **Dialetheist Claim**: Classical negation excludes gluts; dialetheist negation allows them.
  - **Your Framework**: 
    - **Negation-as-Failure**: Under closed-world assumption, `¬A` means "A is absent." But with gluts (MVRs), this fails.  
    - **Three-Valued Logic**: SQL `NULL` gaps aren't dialetheic; `¬NULL` is `NULL`, not a glut.  
    - **No Expression**: Your negation is Boolean in repairs. To model dialetheist negation, you'd need a lattice where `¬{T,F} = {T,F}` (not implemented).  
  - **Verdict**: **No expression** (your negation is classical or Kleenean).

  ---

  ### Residue Report  
  **What Carries Over**  
  - Gaps map to `NULL`/intersection repairs; gluts map to MVRs.  
  - Explosion avoidance mirrors brave/certain answers.  
  - Contradiction localization aligns with AGM minimal revision.  
  - Classical recapture matches eventual consistency.  

  **What Distorts**  
  - Gluts are *epistemic conflicts* (replica disagreements), not *ontological truths*.  
  - LP "at least true" resembles brave answers but aggregates classical states.  
  - Rejection of disjunctive syllogism isn't native (holds within repairs).  

  **What Cannot Be Expressed**  
  - Paradoxes as true gluts (you repair/reject them).  
  - Dialetheist negation (your logic is classical or gap-based).  
  - Metaphysical gluts without epistemic provenance.  

  **Diagnosis of Your Notions**  
  - **Repair-Closed**: Dialetheism asserts some stores *should not* be repair-closed (gluts are real). Your field assumes repairability is always possible/desirable.  
  - **Glut-Preserving Merge**: Possible in theory (e.g., CRDTs storing permanently conflicting writes), but violates eventual convergence. The gap/glut distinction *collapses under provenance* because knowing "replica A said `x`" and "replica B said `¬x`" treats the glut as two classical facts, not one dialetheic state.  

  **Structural Worry (Meta-Level Consistency)**  
  - You correctly note that declaring a store "inconsistent" requires a consistent meta-level. This mirrors dialetheism's problem: asserting "not everything is true" risks triviality. Both fields "solve" this by using classical meta-languages.  

  **Conclusion**  
  The residue is a **limitation of replicated-data theory**, not dialetheism's indeterminacy. Your field structurally cannot express *metaphysical gluts* because:  
