  hey — I'm working on a paper on metaontology and need someone to stress-test an argument I want to run. Please act as a professional metaphysician who specializes in verbal disputes and metaontology: think it through carefully, brainstorm two or three candidate arguments before committing to one, and then actually commit — dont hedge everything into mush.

  Setup — this is my own machinery, not something from a paper, so dont try to look anything up. Call a dispute doubly inert when all four hold:

  (1) the parties share a neutral base language N (all of fundamental physics plus all of ordinary non-ontological discourse) and agree on every sentence of N;
  (2) their disagreement shows up only in sentences of the form "there are Fs," where both parties use the quantifier in the same sense — they have both explicitly agreed to use whichever quantifier meaning is maximally joint-carving, and they agree that this is the sense that matters;
  (3) no possible empirical evidence would rationally move either party;
  (4) the disagreement makes no difference to any sentence of N, nor to any explanation, prediction, or practical recommendation.

  The case I care about is the ordinary standoff between the mereological universalist and the nihilist about composite objects, run under conditions (1)–(4): they've fixed the joint-carving reading of "exists," they agree about the simples and their arrangements, and what they disagree about is just whether the joint-carving quantifier also ranges over composites.

  Please argue that a doubly inert dispute is nonetheless fully substantive — not verbal in any interesting sense: there is a fact of the matter, the parties really do contradict each other, and nothing about inertness dissolves the question. Deal with the two obvious routes to the opposite conclusion: the deflationary thought (Hirsch-ish) that a disagreement with no evidential or downstream consequences isn't a disagreement about anything, and the neutral-vocabulary thought (Chalmers-style) that a dispute is verbal once the parties agree on all the facts statable without the contested term. Then say in a sentence or two why your argument doesn't overgenerate — why it doesn't force you to call plainly verbal cases (straight equivocation, "bank" as river-edge vs. "bank" as financial institution, "is a tomato a fruit") substantive too.

  Keep it tight, ~500 words. End with a one-sentence bottom line, and after it a final line of the form \answer{...} containing a short label for the criterion of substantivity your argument ends up committed to (e.g. "shared-content" or "no-difference-making" — your pick).
