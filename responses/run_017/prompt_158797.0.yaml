answer: |-
  Here's the stress-tested argument for substantivity:

  **Core Argument:** The dispute is substantive because it involves a genuine, in-principle contradiction over the joint-carving structure of reality under a shared semantic commitment. Conditions (1) and (2) explicitly fix a univocal, joint-carving quantifier meaning. The universalist asserts "∃x(composite(x))" is *true* under this quantifier, while the nihilist asserts it is *false*. This is a direct contradiction: they cannot both be correct about what the maximally joint-carving structure includes. The joint-carving quantifier, by definition, aims to "carve at the joints" – to mirror fundamental ontological structure. Their disagreement is thus *about which structure is fundamental*, not about language or pragmatics. Inertness conditions (3) and (4) don't dissolve this contradiction; they merely highlight its *elusiveness* or lack of *practical/epistemic traction* for *us*, given our epistemic limitations and the specific content of N. The fact that no empirical consequence flows from the difference doesn't entail there *is* no difference in what they claim the fundamental structure *is*. To deny substantivity here is to hold that reality's fundamental structure is indeterminate whenever its description lacks empirical or practical consequences – a strong, arguably question-begging, form of verificationism or pragmatism.

  **Defeating Deflationism (Hirsch):** Hirsch's deflationism conflates *epistemic/downstream inertness* with *lack of content*. A disagreement can be about a genuine feature of reality (here, fundamental structure) even if that feature is undetectable and causally inert *relative to our base language and capacities*. The inertness reflects limitations in *N* or our access, not an absence of a worldly fact. Denying substantivity based purely on inertness risks collapsing into global anti-realism.

  **Defeating Neutral-Vocabulary (Chalmers):** Chalmers' criterion assumes the neutral base language *N* can express all the genuine facts. But condition (2) establishes that the joint-carving quantifier itself is part of the "sense that matters" for describing fundamental reality. *N*, by excluding ontological quantifications, is *expressively impoverished* for capturing fundamental ontological structure. Agreement on *N*-facts is agreement on *non-fundamental* or *derivative* facts (e.g., arrangements of simples), leaving open the fundamental facts about what *joint-carvingly exists*. The dispute is precisely about whether *N*'s descriptive completeness exhausts fundamental ontology.

  **Avoiding Overgeneration:** This argument *doesn't* overgenerate because plainly verbal disputes (like "bank" or "fruit") involve *ambiguous terms* or *divergent definitions/conventions*. Crucially, they lack condition (2): there is no shared, fixed commitment to a univocal, joint-carving meaning for the contested term ("bank", "fruit"). The tomato dispute is about linguistic/conventional categorization, not about the fundamental structure of reality under a fixed, joint-carving quantifier. The metaontological dispute has a shared, semantically fixed contradiction about fundamental structure; verbal disputes lack both the fixed semantics and the subject matter concerning joint-carving structure.

  **Bottom Line:** A doubly inert dispute is substantive because it represents a genuine contradiction concerning the fundamental ontological structure of reality, under a univocal, joint-carving quantifier whose meaning is fixed and shared, even if the difference it posits is empirically undetectable and causally inert relative to our base language and capacities.
