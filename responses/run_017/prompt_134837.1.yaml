          They break into one triplet: "CAT" -> enzyme SPECIAL.
          Run: SPECIAL appends "CAT" -> new strand = "CAT"

     Team3: strand = "AAACCC"   (6 letters) -> broken into "AAA" and "CCC"
          Enzymes: ADD_AAA (appends "AAA") and ADD_CCC (appends "CCC") -> new strand = "AAACCC"

     But note: the new strand is "AAACCC", which is the same as the original. So it replicates.

     Now, the point is that in Team3, the strand is built by executing the code (the two enzymes) that build it step by step. The rulebook does not know the strand; it only knows the mapping from triplets to fixed string appenders.

     We can make Team3's strand a bit more complex by using two different triplets: e.g., "AAATTT" -> becomes ADD_AAA and ADD_TTT, which appends "AAA" and then "TTT", yielding "AAATTT".

     But to save time, we'll keep it simple.

     We might also want to have a strand that is not self-replicating for a fourth team? But we have three teams.

     Now, the session plan:

     Time: 90 minutes total.

     Plan:

     0-5 min: Introduction. Explain that they will be simulating a system of strands and enzymes. The goal is to start with a strand and use the rulebook to produce a new strand. They are to follow the rules exactly.

     5-10 min: Split into three teams (about 4-5 people each). Hand out materials.

     Materials for each team:
        - A strip (sequence of letters) on an index card or paper.
        - Their specific rulebook (one page).
        - Instructions: "Using the rulebook, translate your strand into a sequence of enzymes. Then, starting with an empty new strand, run each enzyme in order, applying its action to build the new strand. The goal is to produce a new strand from the original."

     Also provide scratch paper and pens for them to write down the enzymes and the new strand.

     Important: the rulebooks and strips are different. Assign Team1, Team2, Team3.

     How to hand out: give each team an envelope with their strip and rulebook. Tell them not to look at other teams'.

     10-35 min: Team work (25 minutes). They work on translating and running the enzymes.

     We expect:

     - Team1: will finish very fast. They have one triplet -> one enzyme -> one action: copy whole strand. Done in 2 minutes.

     - Team2: similarly fast. One triplet -> one enzyme -> append 'CAT'. Done.

     - Team3: also fast? They have two triplets: translate to two enzymes, run them. Done.

     So it might take only 5 minutes. That's okay. We want them to finish fast and feel like they've won.

     Then what? We might have extra time. We can ask them to try to see if their strand is self-replicating (i.e., the new strand is the same as the original) and think about how it works.

     But we don't want them to start discussing across teams yet.

     35-50 min: Reconvene. Ask each team to write their original strand and the new strand they got on the whiteboard. Also, they should note down the enzymes they used.

     Team1: original "TAC", new "TAC", enzyme: COPY_WHOLE.
     Team2: original "CAT", new "CAT", enzyme: SPECIAL.
     Team3: original "AAACCC", new "AAACCC", enzymes: ADD_AAA, ADD_CCC.

     Now, they all succeeded in replicating.

     50-90 min: Debrief (40 minutes).

     The facilitator leads a discussion.

     First, celebrate that all teams replicated their strand.

     Then, ask: "How did your strand achieve self-replication? What is the role of the enzymes and the strand?"

     Let each team explain briefly.

     Then, ask: "Are these methods the same or different?"

     Guide them to see:

     - Team1: the enzyme COPY_WHOLE copies the entire strand, including itself. But note: the strand doesn't contain information about how to build itself; it has a general command that copies anything. So if you change the strand (e.g., to "TACXXX"), then COPY_WHOLE would still copy it. But in this case, the strand is only "TAC", so it works.

     - Team2: the enzyme SPECIAL only produces the string 'CAT'. It is hard-coded to produce that string. If you had a different strand, it wouldn't work. And the rulebook has a specific entry for the triplet 'CAT' that only produces 'CAT'. So it's tailored.

     - Team3: the enzymes ADD_AAA and ADD_CCC each add a fixed string. The strand is composed of the triplets that correspond to these enzymes. So the strand is a sequence of instructions that build the strand by building each part. The information for the strand is encoded in the sequence of triplets.

     Now, ask: "Suppose you wanted to create a new self-replicating strand. For each method, what would you need to do?"

     - For Team1's method: you need to include the triplet TAC in your strand. But then the enzyme COPY_WHOLE will copy the whole strand, so it must be present.

     - For Team2's method: you need to ask the rulebook designer to add a new entry for your strand.

     - For Team3's method: you need to build your strand as a sequence of triplets that are in the translation table, and that when executed will build the same sequence.

     Now, the key distinction: in Team3's case, the self-replication is achieved by the strand containing a description of itself via the code (the enzymes) that build it. The rulebook provides the mapping from code to action, but it doesn't know about the strand. The strand is both the code and the data.

     Then, reveal the analogy:

     "In this activity, we simulated a system inspired by DNA and self-replication. In fact, the real DNA in our cells works somewhat like Team3's case: the DNA strand contains genes that code for enzymes that help in the replication of the DNA itself. But also, there's a deeper analogy to mathematics and computer science: the work of Kurt Gödel. He showed that in any formal system, you can have self-referential statements that talk about themselves. In particular, he constructed a statement that says 'I am not provable'. How did he do that? He used a method similar to Team3: by encoding the statement as a number, and then having the number represent a statement about numbers, including its own encoding. This is known as the Gödel numbering. And in our activity, the strand in Team3 is both the code and the data, just like in Gödel's proof."

     Now, address the teams who finished fast and thought they won: point out that they all won in replicating, but the methods are different. The real achievement is in Team3's method because it doesn't rely on a general copier or a special rule.

     Predictable problems:

     - Team3 might not have a strand that is multiple of 3? We made sure: "AAACCC" is 6.

     - Someone might freehand the answer: they might just write down the strand without running the enzymes. To prevent, emphasize that they must simulate the enzyme steps.

     - Someone might think this is biology: clarify that it's a simplified model.

     - Team1 or Team2 finishes fast: have a backup. Ask them: "What if your strand was longer? How would it replicate?" or "Could your method replicate a strand that is not the same as the one you have?".

     What the activity cannot deliver:

     - It does not show the full incompleteness proof, only the idea of self-reference through encoding.

     - It does not show that real cells work this way (real DNA replication is more complex).

     Check at the end:

     Hand out a fifth strip to each team (the same for all teams) and ask: "Without running the enzymes, predict whether this strand would replicate itself and why. What would have to be true about the strand and the rulebook?"

     Example fifth strip: "AAAGGG"

     Rulebook for this check: we need to define what rulebook to use. Since the rulebook they have is team-specific, we should provide a common rulebook for this check.

     We'll provide a rulebook that has:

          AAA -> ADD_AAA
          GGG -> ADD_GGG

     So the strand "AAAGGG" would be broken into "AAA" and "GGG", then enzymes ADD_AAA and ADD_GGG would append "AAA" and "GGG", yielding "AAAGGG". So it should replicate.

     But they have to realize that the strand must be composed of triplets that are in the table, and each triplet must map to an enzyme that appends that triplet.

     Alternatively, a strand that would not replicate: "TAC" with this rulebook. Since there's no mapping for "TAC", it wouldn't translate.

     But to keep it simple, let's use the same rulebook as Team3 for the fifth strip.

     So hand out a strip "AAAGGG" and a rulebook (the Team3 one, which includes AAA and GGG) and ask: "Would this strand replicate? Why or why not?"

     They should say: yes, because it would be translated to ADD_AAA and ADD_GGG, which append "AAA" and "GGG", so the new strand is "AAAGGG".

     Then ask: "What if the strand was 'AAATTT'? (assuming TTT is in the table)".

     Then, to test the distinction, ask: "What if the strand was 'CAT'? Would it replicate with this rulebook?" (the rulebook doesn't have CAT, so no. And even if it did, if it had a different enzyme, it might not append 'CAT'.)

     Finally, ask: "What if the strand was 'TAC' and the rulebook has TAC -> COPY_WHOLE? Would it replicate?" (yes, but by a different mechanism).

     This should help them distinguish the methods.

     Adjustments:

     We might need to make Team3's strand more interesting? But it's okay.

     Alternatively, to make it more challenging, we can have a fourth team with a strand that is not self-replicating? But we only have three cases.

     Given time, we'll stick to three teams.

     Timeline:

     0-5: Intro
     5-10: Distribute materials and form teams
     10-35: Team work (25 min) [they might finish in 10, then have them reflect in their team on how it works]
     35-50: Report results on whiteboard
     50-90: Debrief and analogy (40 min)

     In the debrief, include:

     - The three methods of self-replication.
     - The analogy to DNA: in DNA, there are enzymes (like DNA polymerase) that copy the DNA, but the DNA also contains the code for those enzymes. So it's a mix of Team1 and Team3? But the self-replication of DNA is more like Team1: there is a general machinery that copies the DNA, and the DNA contains the genes for that machinery. But the analogy in GEB is about the self-reference in formal systems.

     - The analogy to Gödel: in formal systems, we assign numbers to statements. Then we can have a statement that talks about a number, which is the number of itself. This is achieved by an encoding (like the triplet sequence) that allows self-description.

     Finally, to handle the fast teams: during the team work, if they finish early, ask them to consider: "What if the strand was mutated? Change one letter in your strand. Would it still replicate? How would the new strand be different?"

     This can lead to interesting discussions about error and mutation.

     Let me write the rulebooks explicitly.

     Rulebook for Team1:

     =============
     Translation Table:
     Triplet | Enzyme
     ---------|-------
     TAC     | COPY_WHOLE

     Enzyme Actions:
     - COPY_WHOLE: Append the entire current strand to the new strand.
     =============

     Strip: "TAC"

     Rulebook for Team2:

     =============
     Translation Table:
     Triplet | Enzyme
     ---------|-------
     CAT     | SPECIAL

     Enzyme Actions:
     - SPECIAL: Append the string 'CAT'.
     =============

     Strip: "CAT"

     Rulebook for Team3:

     =============
     Translation Table:
     Triplet | Enzyme
     ---------|-------
     AAA     | ADD_AAA
     CCC     | ADD_CCC
     TTT     | ADD_TTT
     GGG     | ADD_GGG

     Enzyme Actions:
     - ADD_AAA: Append the string 'AAA'
     - ADD_CCC: Append the string 'CCC'
     - ADD_TTT: Append the string 'TTT'
     - ADD_GGG: Append the string 'GGG'
     =============

     Strip: "AAACCC"   [or "AAATTT", or "CCCGGG", etc. - any two triplets from the table]

     We'll use "AAACCC".

     For the fifth strip test, we can use "AAAGGG", and hand out the Team3 rulebook (which includes AAA and GGG).

     This should be runnable.

     Note: The strip for Team3 is 6 letters, so they break it into two triplets: "AAA" and "CCC".

     They then write down the enzymes: ADD_AAA and ADD_CCC.

     Then run: start with empty new strand.
          ADD_AAA: new strand becomes "AAA"
          ADD_CCC: new strand becomes "AAACCC"

     Which matches the original.

     Similarly for the others.

     I think this meets the requirements.
