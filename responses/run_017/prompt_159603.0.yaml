answer: |-
  **Decision Tree: Conceptions of Freedom in Mental Health Detention Contexts**

  *Start here with Case 1:*
  **Case 1:** Patient discharged to community, liable to recall at clinician's discretion. No recall for months, no contact with services. Is she free?
  *   **A: She is not free.** → Go to Case 2a
  *   **B: She is free.** → Go to Case 2b
  *   **C: This doesn't settle it / Unsure.** → Go to Case 2a

  *From A or C (Not Free / Unsure in Case 1):*
  **Case 2a:** Ward rule restricts patient movement daily. Rule is published, appealable, and has been successfully overturned by other patients. Is she free *because* the rule is appealable?
  *   **A: She is not free; appealability doesn't make her free here.** → Go to Case 3a
  *   **B: She is free; the appealability removes the unfreedom.** → *Non-Domination (Pettit)*
  *   **C: This doesn't settle it / Unsure.** → Go to Case 3a

  *From B (Free in Case 1):*
  **Case 2b:** Patient is subject to a strict medication regime enforced daily. Is she free?
  *   **A: She is not free (due to the daily interference).** → *Negative Liberty (Berlin)*
  *   **B: She is free (if regime is necessary/justified).** → Go to Case 3b
  *   **C: This doesn't settle it / Unsure.** → Go to Case 3b

  *From A or C in Case 2a (Not Free / Unsure even with appealable rule):*
  **Case 3a:** A funding algorithm denies a patient access to a specific therapy proven beneficial for their condition, despite clinician support. There is no person or office to appeal to; it's an automated system based on fixed criteria. Does this make the patient unfree?
  *   **A: Yes, the patient is unfree.** → *Impersonal Structures View (Unnamed)*
  *   **B: No, only a person/office wielding power can make someone unfree.** → *Non-Domination (Pettit)* *or* *Negative Liberty (Berlin)* (See Note 1)
  *   **C: This doesn't settle it / Unsure.** → Go to Case 4a

  *From B in Case 2b (Free under enforced regime) or C in Case 2b:*
  **Case 3b:** Patient signed advance directive requesting treatment if refusing during relapse. Now relapsed and refusing. Should her current refusal be overridden?
  *   **A: Yes, override; she is not free now (past rational self binds).** → Go to Case 4b
  *   **B: No, do not override; she is free now (current will matters).** → *Negative Liberty (Berlin)*
  *   **C: It depends / Unsure.** → Go to Case 4b

  *From C in Case 3a (Unsure on impersonal structures):*
  **Case 4a:** Patient's current refusal of treatment appears clearly driven by illness symptoms (e.g., paranoid delusions about medication). He expresses no coherent, stable alternative view of his needs/wants. Is he free to refuse?
  *   **A: No, he is not free; illness controls his will.** → *Positive Liberty (Self-Mastery/Real Will)*
  *   **B: Yes, he is free; his expressed will must be respected.** → *Negative Liberty (Berlin)*
  *   **C: This doesn't settle it / Unsure.** → *Capability Approach (Sen/Nussbaum)* (See Note 1)

  *From A or C in Case 3b (Override past directive / Unsure):*
  **Case 4b:** Patient's current refusal seems illness-driven (as in Case 4a). Is he free to refuse?
  *   **A: No, he is not free; illness controls his will.** → *Positive Liberty (Self-Mastery/Real Will)*
  *   **B: Yes, he is free; his expressed will must be respected.** → *Negative Liberty (Berlin)*
  *   **C: This doesn't settle it / Unsure.** → *Capability Approach (Sen/Nussbaum)* (See Note 1)

  **Leaf Conceptions & Awkward Implications:**

  1.  **Negative Liberty (Berlin):** Freedom is absence of actual interference by others. *Awkward Implication:* Must accept the discharged patient liable to recall (Case 1) is free until actually recalled, and the patient refusing due to illness (Case 4a/b) is free even if harming themselves.
  2.  **Non-Domination (Pettit):** Freedom is absence of arbitrary power over you (power not constrained by your interests/contestability). *Awkward Implication:* Must accept the patient under the appealable ward rule (Case 2a) is free *because* it's contestable, even if applied daily.
  3.  **Positive Liberty (Self-Mastery/Real Will):** Freedom is acting according to one's rational/true self, not impulses or illness. *Awkward Implication:* Must accept overriding a patient's current refusal based on illness (Case 4a/b) *increases* their freedom, even against their expressed will.
  4.  **Capability Approach (Sen/Nussbaum):** Freedom is having the effective opportunity (capability) to achieve valued functionings (states/doings). *Awkward Implication:* Must accept factors like the funding algorithm (Case 3a) *can* make someone unfree by restricting capabilities, even without a specific interferer, but struggles to clearly define when refusal is "free" vs illness-impaired capability.
  5.  **Impersonal Structures View (Unnamed):** Unfreedom can be caused by impersonal systems/structures (rules, algorithms, resource limits) without a specific powerful agent. *Awkward Implication:* Must accept patients denied therapy by an algorithm (Case 3a) are unfree, but struggles to define the *source* of unfreedom clearly or how contestation applies.
  6.  *(Path via Case 1B -> Case 2bB -> Case 3bA/C -> Case 4bC):* **Capability Approach (Sen/Nussbaum)** - As above.
  7.  *(Path via Case 1B -> Case 2bB -> Case 3bA/C -> Case 4bA):* **Positive Liberty (Self-Mastery/Real Will)** - As above.
  8.  *(Path via Case 1A/C -> Case 2aC -> Case 3aC -> Case 4aC):* **Capability Approach (Sen/Nussbaum)** - As above.

  **Notes:**

  1.  **Indistinct Leaves (Flagged):** The tree cannot perfectly separate:
      *   *Non-Domination* and some interpretations of *Negative Liberty* on Case 3a (Impersonal Structures). Both typically require an agent wielding power. (Path: Case 1A/C -> Case 2aB -> Case 3aB).
      *   *Capability Approach* often ends up in "Unsure" paths because it focuses more on opportunities than specific yes/no freedom judgments in these interpersonal power scenarios. Its core concern (capabilities restricted) is captured in Case 3aA, but its verdict on refusal cases is less defined.
  2.  **Unoccupied Paths:**
      *   Path ending at *Negative Liberty* via Case 3aA (Impersonal Structures: Yes): Unoccupied. *Reason:* Incoherent for Negative Liberty (requires interference by an agent, not just a structure).
      *   Path ending at *Non-Domination* via Case 3aA (Impersonal Structures: Yes): Unoccupied. *Reason:* Primarily unattractive/unexplored for Non-Domination theorists who focus on relations between agents.
      *   Path ending at *Positive Liberty* via Case 3aA (Impersonal Structures: Yes): Unoccupied. *Reason:* Unexplored; Positive Liberty focuses on internal state/agency relation, not external structures directly.
      *   Path ending at *Impersonal Structures* via Case 4aA (Illness-Driven Refusal: Not Free): Unoccupied. *Reason:* Unattractive/Unexplored; this view is primarily concerned with external structures, not internal states like illness.

  **Section Notes:**

  *   **Bottom Line on Unoccupied Paths:** Most unoccupied paths arise because the named views (Negative Liberty, Non-Domination, Positive Liberty) logically focus on interpersonal power or internal states, making the "Impersonal Structures = Unfree" verdict incompatible or unattractive to them, not due to incoherence per se.
  *   **Bottom Line on Indistinct Leaves:** The tree distinguishes the core commitments well but cannot perfectly separate Non-Domination from strict Negative Liberty on impersonal structures, or precisely define the Capability Approach's verdict in refusal cases, as its focus is broader than moment-to-moment freedom/coercion.
  *   **Bottom Line on Awkward Implications:** Each conception requires accepting counter-intuitive conclusions in specific cases: Negative Liberty ignores potential power; Non-Domination accepts pervasive rules if contestable; Positive Liberty overrides current will for a "true" self; the Capability Approach struggles with defining the freedom in refusal; the Impersonal Structures view struggles to pinpoint the unfreedom's source. Acknowledging these costs is crucial for productive discussion.
