answer: |-
  The exclusion argument as reconstructed is valid but unsound. The problematic step is (2), the Ledger Principle, which I reject. This principle assumes that causal contribution to a single effect operates like a fixed budget, where one sufficient cause exhausts all causal work, leaving no room for any distinct candidate cause. However, this overlooks the hierarchical nature of realization in the special sciences. When a higher-level event (like a mental state) is realized by a lower-level event (like a neural state), they are not independent causes competing for the same "causal work." Instead, the higher-level cause can be seen as acting *through* or *in virtue of* the lower-level cause, without overdetermination. The Ledger Principle treats causation as a flat, zero-sum game, failing to account for the possibility that multiple levels of description can capture the same causal process without double-counting.

  ### Why (2) is tempting
  The Ledger Principle seems intuitive because it reflects a commonsense notion of causation: if one event fully explains an effect, adding another seems redundant or suspicious. This aligns with Occam's razor and avoids profligate metaphysics. It also resonates with causal exclusion intuitions in philosophy, where sufficient physical causes appear to "screen off" higher-level causes. In your rat example, the neural state (P) seems to do all the work for the lever press (E), making the wanting (M) seem superfluous—so (2) feels like a natural guard against causal overcounting.

  ### Price of alternative interventions
  - **Reject (1) Closure**: You would have to deny that every physical effect has a sufficient microphysical cause. This opens the door to causal gaps or non-physical causes, undermining physicalism. It conflicts with empirical evidence from neuroscience and physics, and you explicitly want to keep closure.
  - **Reject (3) No Systematic Overdetermination**: You would have to accept that overdetermination is ubiquitous—e.g., every special-science cause is redundantly caused by its microphysical base. This is metaphysically extravagant and implausible, as overdetermination is typically rare (e.g., two bullets hitting simultaneously).
  - **Reject (4) Distinctness**: You would have to embrace token identity, where mental events are identical to their physical realizers (e.g., the wanting *just is* the neural state). This preserves mental causation but at the cost of your commitment to non-reductive physicalism (you reject type identity, but token identity is a separate issue). It also requires abandoning property-based event individuation.
  - **Reject (5) No Downward Shortcut**: You would have to allow that mental events cause their own physical bases (e.g., the wanting causes the neural state). This introduces problematic downward causation, violating the supervenience relation and potentially leading to causal loops or violations of physical law.
  - **Reject (7) Generality**: You would have to argue that the mental is unique and exempt from the exclusion problem. But this is ad hoc; the argument's force comes from its generality, and special pleading for the mental would undermine the unity of the special sciences.

  ### Application to the rat case
  With (2) rejected, we can say that the rat's wanting (M) *did* cause the lever press (E). The wanting is realized by the neural state (P), which is part of the sufficient microphysical cause of E. Since M supervenes on P, M causes E *in virtue of* P causing E—there is only one causal process, described at different levels. The wanting is not an additional cause competing with P; it is the same causation described mentally. Thus, M's causal status is preserved without overdetermination.

  ### State of the debate
  - **Settled**: The exclusion argument highlights a genuine challenge for non-reductive physicalism, and it is widely agreed that *some* premise must be rejected to avoid epiphenomenalism. There is no consensus on which one, but the debate is active and unresolved.
  - **Contested**: Token identity (rejecting (4)) and rejecting exclusion principles (like (2)) are both common responses. My diagnosis extrapolates from hierarchical causation views (e.g., influenced by Yablo or List & Menzies), where higher-level causes are seen as difference-makers relative to their realization bases. My sympathies lean toward this approach, as it aligns with your desire to preserve special-science causation without collapsing levels.

  \answer{step: 2; diagnosis: Ledger Principle ignores realization hierarchy}
