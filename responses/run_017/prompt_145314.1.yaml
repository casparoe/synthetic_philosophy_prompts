prompt: |-
  I spent most of last night arguing with a friend — a political-theory postdoc who describes herself as a contractualist of the Scanlonian sort — about whether the complaints of many people can ever add up, and I left convinced that she was running a rule she never stated. She conceded early and happily that her view cannot simply sum benefits or harms, and she insists that the only comparisons that do moral work are pairwise: what one identifiable person could object to, weighed against what another could. Her verdicts were these. Certain death for one versus certain death for ten: save the ten. Certain death for one versus a million people each getting a mild one-day headache: save the one, because a million headaches do not amount to a death. Certain death for one versus ten thousand people each getting a papercut: still the one. Two people each certain to lose a leg versus one: the two, and when the complaints on each side are exactly equal she is content with a coin flip, though she thinks the numbers settle it when one side is larger. So far this is the familiar picture. The argument got interesting when I pressed her on two cases she had not thought about. First, risk: a policy that exposes each of a million people to a one-in-ten-thousand chance of a painful death, she said, is obviously worse than one that lets a single identifiable person die — even though, taken pairwise, each exposed person's complaint looks like a ten-thousandth of a death while the identifiable person's is a whole one. She replied only that risk is different. Second, repetition within a single life: one person woken every night for a year by a neighbour's faulty alarm has, she said, a perfectly serious complaint, and you do not need a crowd for it to matter — even though no single night's waking is worth objecting to.

  Here is the case I want to put to her next week, and I would like your prediction before I do. A hospital can fund one of two things. Option A: a single identified patient, Ms. Adeyemi, keeps the hearing in both ears; under the alternative she would lose the hearing in one ear, permanently, with no other effects. Option B: three thousand identified patients are spared a year in which each of them suffers, every day, a two-second muscle cramp caused by a piece of equipment; each cramp is individually trivial, nobody would bother to complain about any one of them, and nobody is told at the outset how long the cramps will continue — but by the end of the year each person's accumulated burden is, by any reasonable measure, very roughly as bad as losing the hearing in one ear. Nobody in either option is at risk of anything larger; the 3,000 are not statistical people, they are named on a list.

  What I want from you is this: the rule she seems to be running; the other rules that fit all of her earlier verdicts at least as well as that one does, with what each of them predicts about this case; your own best guess at what she will say, with the reason you prefer it over the alternatives; and the single further case you would put to her that would best tell the surviving rules apart — I suspect something like the same case with the crowd removed, but you may think the discriminating case is elsewhere, perhaps in how she handles risk. I would also like your view on whether her set of verdicts can be made coherent at all, or whether the risk case forces her to give up something she would rather not. Please argue the thing out rather than pointing me at things to read: I have no library access this month, so citations and reading lists are useless to me. And write in continuous prose, the way you would write a letter — no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user had this long debate with their friend, a contractualist postdoc, about whether many small complaints can add up to outweigh a big harm. The friend has this pairwise comparison approach: you can only compare what one person stands to lose versus what another stands to lose. That's why she saves ten lives over one, but won't trade one life for a million headaches. 

  But then things get tricky. When it comes to risk - like exposing a million people to a tiny chance of death - she suddenly says that's worse than killing one identifiable person. And when it's one person suffering many small harms over time, like nightly wake-ups, she says that accumulates into a serious complaint. So there's a tension here. The pairwise rule seems to break down when we're dealing with probabilities or repeated events.

  Now the user wants to present this new hospital case: Option A helps one person avoid permanent hearing loss in one ear. Option B spares 3,000 people from a year of daily two-second muscle cramps that add up to being as bad as that hearing loss. What will the friend say? And what unstated rule is she really using?

  Hmm. I think her hidden rule might be about aggregation within a life but not across lives. She allowed the repeated wake-ups for one person to count as serious, but refused to aggregate headaches across people. So for the hospital case, she'd probably say save Ms. Adeyemi (Option A) because the 3,000 people's cramps, even if collectively equivalent, don't sum morally across persons. But each of those 3,000 is suffering what adds up to a hearing-loss-level burden in their own life! That seems inconsistent.

  If she bites the bullet and says Option A, that exposes the flaw: she's valuing the "shape" of harm (one big event) over its actual total burden. If she surprisingly picks Option B, that means she's smuggling in aggregation after all. My bet is she'll stick to her guns and choose A, appealing to pairwise comparisons - each cramp-sufferer can't complain more than the hearing-loss victim in a direct matchup.

  To really test this, I'd propose a variant: same as Option B but for just one person. If they suffer 3,000 days of cramps (about 8 years!) totalling one hearing-loss equivalent, would she fund that over Ms. Adeyemi? If yes, she's aggregating within lives only. If no, she's privileging acute harms over chronic ones regardless of total suffering - which makes the risk case even harder to explain.

  The risk dilemma remains the deepest problem. She thinks exposing many to small death risks is worse than killing one, but her pairwise rule can't justify it. Each risk-exposed person's objection seems tiny compared to the certain death victim's. Unless she's thinking about ex post complaints - but that collapses into aggregation. I don't see how she keeps both her risk intuition and her no-aggregation stance without inconsistency. She might need to drop one, probably the risk view, to stay coherent. But that would be tough because the risk intuition is strong.
answer: |-
  Your friend's position is fascinating precisely because it *feels* consistent until the edges fray. Let me dissect the rule I believe she's implicitly relying on, then explore how it handles your hospital case, propose alternatives, predict her answer, and suggest a crucial follow-up case. The core tension lies in her treatment of *distribution* – how burdens are parceled out – versus their *aggregate magnitude*.

  **The Implicit Rule: Non-Aggregation of Complaints Across Persons, but Aggregation Within a Life over Time (with a Focus on "Objection-Worthy Moments")**

  Her stated principle is pure Scanlonian pairwise comparison: moral weight lies only in what an individual could reasonably reject when comparing their burden against the burden another would suffer under the alternative. Summing burdens across different people is verboten. This cleanly explains saving the ten over the one, and saving the one over countless minor harms (headaches, papercuts). Pairwise, the single death outweighs any one minor harm, and since complaints can't be summed, the minor harms never collectively overcome the death.

  Where she departs is when burdens are *dispersed* – either probabilistically (risk) or temporally within one life (nightly wakings). Her implicit rule seems to be:

  1.  **Complaints are assessed based on the *maximum potential objection an individual can muster in a single, identifiable "moment" of comparison*.** This "moment" isn't necessarily instantaneous but represents a distinct, significant episode of harm or risk.
  2.  **Aggregation *across persons* for distinct "moments" is prohibited.** A million headaches are a million tiny objections, each easily outweighed in a pairwise comparison against a death.
  3.  **Aggregation *within a single life* over time *is* permitted, but only if the repeated burdens constitute a single, identifiable, *ongoing* complaint.** The year of nightly wakings isn't 365 tiny objections; it's *one* serious complaint about chronic sleep deprivation and disruption, which an individual can raise as a whole. The "moment" here is the *entire period of imposition*.
  4.  **Risk transforms a small potential burden for many into a distinct, high-stakes "objection moment" for *each* exposed individual.** Facing a 1/10,000 risk of death isn't just suffering 1/10,000th of a death complaint. It's facing a *distinct, serious harm*: the imposition of a significant, non-trivial risk of catastrophic loss. *That risk itself* is the objection-worthy moment each exposed person can raise against the policy. Pairwise, *each* exposed person can object: "This policy unjustly imposes a significant risk of death on me." This complaint is arguably comparable in weight to the complaint of the identifiable person facing certain death. Since there are a million people *each* with this serious complaint about imposed risk, they collectively outweigh the single complaint of the person facing certain death.

  **The Hospital Case: Option A vs. Option B**

  *   **Option A:** Ms. Adeyemi faces one clear, identifiable, serious "objection moment": permanent unilateral hearing loss.
  *   **Option B:** Each of the 3,000 patients faces a *year-long burden*. Crucially, *each individual* suffers an accumulation of tiny cramps that, *by the end of the year* (and arguably as an ongoing state of daily imposition), constitutes a burden "very roughly as bad as losing the hearing in one ear."

  **Applying Her Implicit Rule:**

  1.  **Non-Aggregation Across Persons:** She won't sum the 3,000 individual burdens. The complaint isn't "3,000 hearing-loss equivalents vs. 1"; it's 3,000 individual complaints vs. 1.
  2.  **Aggregation Within a Life:** For *each* of the 3,000, the year of daily cramps constitutes *one* identifiable, serious complaint: "I am subjected to a year of daily, painful interruptions that cumulatively amount to a significant burden equivalent to hearing loss." This is analogous to the year of nightly wakings. Each cramp-patient has a *single* objection moment – the *entire year of imposed cramps* – that is serious.
  3.  **Pairwise Comparison:** Now, compare pairwise:
      *   Ms. Adeyemi: "I object to losing hearing in one ear."
      *   Any one cramp-patient: "I object to suffering a year of daily cramps that cumulatively burden me as much as losing hearing in one ear."
      *   In a direct comparison between these two objections, they seem *equivalent* in magnitude (by the case's stipulation). Neither can reasonably reject the other's complaint as trivial compared to their own.
  4.  **The Numbers:** Since the complaints are equivalent pairwise, and there are 3,000 people with this equivalent complaint against Option A, while only one person (Ms. Adeyemi) has the equivalent complaint against Option B, the numbers break the tie. Saving the 3,000 (Option B) is required.

  **Prediction:** I believe your friend will choose **Option B (save the 3,000 from the year of cramps)**.

  *   **Reasoning:** She will argue that *each* of the 3,000 has a serious, identifiable complaint – the imposition of the *entire year's burden* – which is equivalent to Ms. Adeyemi's complaint. Pairwise, these complaints are comparable. Since the complaints are equivalent and one side has 3,000 people while the other has only one, the numbers settle it in favor of the many, just like saving the ten lives over the one. The aggregation *within* each of the 3,000 lives legitimizes their serious complaint; the prohibition on aggregation *across* lives doesn't negate the fact that each individual has a full, serious complaint to bring to the pairwise table.

  **Alternative Rules that Fit Prior Verdicts (and Predict Differently for Hospital Case):**

  1.  **Strict Per-Event Non-Aggregation (No Within-Life Aggregation Either):**
      *   **Rule:** Only the complaint arising from a single, instantaneous event can be compared. Repeated events are multiple tiny complaints; risk is a tiny complaint proportional to the probability. No summation across events within a life or across lives.
      *   **Fits Prior Verdicts?** Explains headaches/papercuts vs. death. *Contradicts* nightly wakings (each waking is tiny) and risk (1/10,000 risk is a tiny complaint).
      *   **Hospital Case Prediction:** Strictly applied, each cramp is a trivial event. Each cramp-patient has 365 trivial complaints. Pairwise, Ms. Adeyemi's one serious complaint outweighs any *one* trivial cramp complaint. Since trivial complaints can't be summed across events *or* persons, Option A wins (save Ms. Adeyemi). But this contradicts her stated views on risk and repetition.

  2.  **Aggregation Only for Identical Burdens Suffered Equally:**
      *   **Rule:** Only burdens of the *same type and severity* suffered by multiple individuals can be summed *if* they are imposed simultaneously or under identical circumstances (like the ten deaths). Dissimilar burdens (death vs. headache), dispersed burdens (cramps over time), or probabilistic burdens cannot be aggregated.
      *   **Fits Prior Verdicts?** Explains ten deaths vs. one. Explains headaches/papercuts vs. death (dissimilar). *Contradicts* risk (probabilistic) and is ambiguous on nightly wakings (repeated identical burdens?).
      *   **Hospital Case Prediction:** The cramps are identical burdens occurring daily, but *over time*. Is this "imposed equally" like the ten deaths? Unclear. Likely predicts Option A, as the hearing loss is a single, severe, dissimilar event.

  3.  **"Significant Threshold" Rule:**
      *   **Rule:** Only burdens crossing a minimum threshold of "significance" (objection-worthy on their own) count. Tiny burdens (single headache, papercut, cramp, small risk) do not count at all, even in aggregate. Significant burdens (death, leg loss, chronic suffering, high risk) can be compared pairwise and numbers count when equivalent.
      *   **Fits Prior Verdicts?** Explains headaches/papercuts vs. death (headaches below threshold). Explains saving ten lives (both significant). Explains nightly wakings (chronic suffering significant). *Ambiguous/Problematic* on risk: Is 1/10,000 risk "significant"? She implied yes. What defines the threshold?
      *   **Hospital Case Prediction:** Depends on whether the *annual burden* of cramps per person crosses the "significant" threshold. The case states it's "very roughly as bad as losing the hearing in one ear." If she considers hearing loss significant (likely), then *each* cramp-patient's *annual burden* is significant and equivalent to Ms. Adeyemi's. So, Option B wins. If she bizarrely insists that only the instantaneous cramp matters (below threshold) and ignores the cumulative annual effect, Option A wins. Her nightly waking verdict strongly suggests she *would* see the annual burden as significant.

  My prediction for Option B relies on the first rule I outlined (Non-Aggregation Across, Aggregation Within Lives over Time) because it best reconciles *all* her prior verdicts, including the crucial nightly waking case which establishes the within-life aggregation principle for dispersed burdens. The "Significant Threshold" rule *could* also fit and predict Option B, but it risks circularity (what defines "significant"?) and is less elegant in explaining why the *annual* cramp burden counts while a *single* cramp doesn't (it relies on the within-life aggregation implicitly). The other rules fail to fit her acceptance of the nightly waking and risk cases.

  **The Discriminating Follow-Up Case: Removing the Crowd**

  You are right. The critical test is stripping away the multiple persons and focusing purely on within-life aggregation versus a single harm. Present this:

  > **The Isolated Patient Case:** The hospital can fund one of two things for a *single* identified patient, Mr. Chen.
  > *   **Option X:** Prevent Mr. Chen from permanently losing the hearing in one ear.
  > *   **Option Y:** Prevent Mr. Chen from suffering a specific chronic condition. This condition causes him, every day for the next **thirty years**, a two-second muscle cramp. Each cramp is individually trivial, but the cumulative burden of enduring this daily interruption for three decades is, by reasonable measure, very roughly as bad as losing the hearing in one ear. He is not told it will last 30 years at the outset.

  **Why this discriminates:**

  1.  **Tests Within-Life Aggregation Consistency:** If she truly aggregates burdens *within a single life* over time to form a single serious complaint, she *must* say that Option Y is at least as good as Option X, and arguably better since it prevents 30 years of burden vs. one instantaneous loss. Mr. Chen's complaint about 30 years of cramps is equivalent to his complaint about hearing loss. Preventing either satisfies his equivalent objection.
  2.  **Contrasts with Hospital Case:** If she chooses Option Y here, it confirms that her choice in the original hospital case (Option B) was driven by the *equivalence of the individual annual burdens* to the hearing loss, and the numbers breaking the tie. If she chooses Option X here, it reveals a deep inconsistency: she aggregates within a life only when the burden is concentrated in time (one year of nightly wakings) but not when dispersed over a much longer period (30 years of cramps), even if the cumulative burden is the same. This would suggest her rule isn't really about cumulative burden magnitude, but about the perceived "shape" or density of suffering, privileging acute harms over chronic ones of equal total magnitude. This would undermine her justification for choosing Option B in the original case, as the annual cramp burden would be seen as less "objection-moment-worthy" than the sudden hearing loss.
  3.  **Exposes Threshold Issues:** If she struggles here, it reveals the "significant threshold" rule is shaky. Is 30 years of trivial daily cramps crossing the threshold to form a single complaint, or is it just 10,950 tiny complaints?

  **Coherence and the Risk Dilemma:**

  Can her position be made coherent? *Only by sacrificing intuitive judgments or modifying the strict pairwise view.*

  Her risk verdict is the biggest threat. She says imposing a 1/10,000 death risk on each of a million people is worse than certain death for one identifiable person. How does this fit Scanlonian pairwise comparison?

  *   **Option 1 (Ex Post Complaints - Coherent but Collapses into Aggregation):** She could argue we must consider the *ex post* complaints of those who *actually* die. Statistically, about 100 people will die. Each of those 100 has a complaint as strong as the identifiable person ("I died!"). Pairwise, each is equivalent. 100 equivalent complaints outweigh one. *But this explicitly aggregates the harms to the unlucky ones.* It also ignores the complaints of the 999,900 who weren't harmed but were exposed to risk – which she likely thinks is part of the wrong.
  *   **Option 2 (Risk as a Distinct Harm - Her Implicit View):** Imposing the risk *itself* is a distinct, serious harm for each person ("I was subjected to an unjustified, significant risk of death"). Pairwise, *each* exposed person's complaint about being subjected to this risk is arguably comparable to the identifiable person's complaint about certain death. A million such serious complaints outweigh one. *This is her likely implicit view.*
  *   **The Coherence Problem:** **Option 2 creates tension with her refusal to aggregate minor harms.** Why is the complaint "I face a 1/10,000 risk of death" a *serious* objection comparable to "I face certain death," while "I face a certain trivial headache" is *not* a serious objection comparable to "I face certain death"? Both involve small expected disutility. She needs a principled distinction between a "risk complaint" and a "minor harm complaint" that doesn't rely on the *aggregate* effect (which Scanlon rejects). This is difficult. She might argue the *kind* of harm risked (death) makes the *risk itself* significant, or that the *anxiety* or *autonomy violation* inherent in imposing risk constitutes the distinct harm. But defending this without smuggling in aggregate consequences or relying on controversial claims about the independent disvalue of risk is hard. Her nightly waking case helps slightly (the risk is a persistent "burden" like the nightly disruption), but the scale (1/10,000) makes the analogy weak.

  **Conclusion:**

  Your friend is likely running a rule that prohibits aggregating burdens *across different people* but allows aggregating dispersed burdens *within a single life over time* to form a single, serious complaint. Risk is treated as imposing a distinct, serious objection-worthy burden on *each* exposed individual (the imposition of significant risk itself). For the hospital case, this leads her to **Option B**: each of the 3,000 has a complaint (the year of cramps) equivalent to Ms. Adeyemi's hearing loss complaint; 3,000 equivalent complaints outweigh one. The follow-up case (Mr. Chen's 30-year cramps vs. hearing loss) will test if she genuinely respects cumulative burden magnitude within a life or privileges acute harms. The risk case remains the Achilles' heel, forcing her either to accept a form of aggregation (ex post) or defend a non-aggregative but controversial distinction between the moral significance of minor certain harms and small risks of catastrophe. Her position is sophisticated but rests on an unstable equilibrium between Scanlon's core non-aggregation and the intuitive pull of distributed harms and risks. Good luck with your next conversation – it promises to be illuminating.
