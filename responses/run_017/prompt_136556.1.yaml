  ### Decision Tree for Maxwell's Demon Compensation  
  *Starting commitment: Sealed gas at uniform temperature; demon sorts molecules via selective shutter; no external work; second law holds. Goal: Identify where entropy compensation occurs.*  

  #### Branch Questions (Logical Space)  
  1. **Action Physicality**: Does the sorting mechanism (e.g., shutter/trapdoor) physically collide with gas molecules?  
     - **Y**: Physical interaction (e.g., trapdoor struck by molecules).  
     - **N**: No physical interaction (e.g., idealized shutter).  

  2. **Information Source**: Is the demon’s decision based on information from a pre-existing record (made by an external agent)?  
     - **Y**: Uses pre-existing record.  
     - **N**: Uses its own measurement of the gas.  

  3. **Measurement Reliability**: If the demon measures, is the measurement perfectly reliable?  
     - **Y**: 100% accurate (no misclassifications).  
     - **N**: Imperfect (errors occur).  
     - **NA**: No measurement (skip if 2=Y or 1=Y).  

  4. **Measurement Reversibility**: If the demon measures reliably, is the measurement interaction reversible?  
     - **Y**: Reversible (no entropy increase; system-demon correlation established).  
     - **N**: Irreversible (entropy generated).  
     - **NA**: Unreliable or no measurement (skip if 3=N or 1=Y or 2=Y).  

  5. **Memory Reset**: Must the demon reset its memory to a standard state to continue operating indefinitely?  
     - **Y**: Requires reset (e.g., erasure).  
     - **N**: No reset (e.g., appends until full, then stops/replaced).  
     - **NA**: No memory used (skip if 1=Y).  

  #### Grid of Answer Combinations  
  | Path Code | 1. Action Physicality | 2. Information Source | 3. Measurement Reliability | 4. Measurement Reversibility | 5. Memory Reset | Viability        |  
  |-----------|------------------------|------------------------|----------------------------|------------------------------|-----------------|------------------|  
  | 1Y       | Y                     | \-                    | \-                         | \-                           | \-              | Leaf A           |  
  | 1N-2Y    | N                     | Y                     | \-                         | \-                           | \-              | Leaf B           |  
  | 1N-2N-3N | N                     | N                     | N                          | \-                           | Y/N/NA          | Leaf C (any 5)   |  
  | 1N-2N-3Y-4Y-5Y | N                     | N                     | Y                          | Y                            | Y              | Leaf D           |  
  | 1N-2N-3Y-4Y-5N | N                     | N                     | Y                          | Y                            | N              | Leaf E           |  
  | 1N-2N-3Y-4N-5Y | N                     | N                     | Y                          | N                            | Y              | Leaf F           |  
  | 1N-2N-3Y-4N-5N | N                     | N                     | Y                          | N                            | N              | Leaf G           |  
  | 1N-2N-3Y-4Y-5NA | N                     | N                     | Y                          | Y                            | NA             | Incoherent       |  
  | Other combos    | \-                    | \-                    | \-                         | \-                           | \-              | Unexplored/unattractive |  

  - **Incoherent (1N-2N-3Y-4Y-5NA)**: Reversible measurement requires memory; "no memory" contradicts setup.  
  - **Unexplored/Unattractive**: E.g., pre-existing record (2=Y) with unreliable measurement (3=N) — record is assumed accurate.  

  #### Leaves (Compensation Positions)  
  - **A: Action-dissipation-ledger** (1Y)  
    - Inequality: \(W_{\text{extracted}} \leq T\Delta S_{\text{action}}\) (work ≤ heat dissipated in mechanism).  
    - Awkward commitment: The physical mechanism (e.g., trapdoor) heats up and must dissipate heat externally.  
    - Entropy: Coarse-grained. Claims coarse-grained entropy of isolated system (gas + mechanism) increases.  
  - **B: Record-creation-ledger** (1N-2Y)  
    - Inequality: \(W_{\text{extracted}} \leq T\Delta S_{\text{record}}\) (work ≤ entropy cost to create record).  
    - Awkward commitment: The pre-existing record’s creation (by an external agent) must have been dissipative.  
    - Entropy: Coarse-grained. Claims coarse-grained entropy of the universe increases; isolated system (gas + demon) may temporarily decrease.  
  - **C: Error-dissipation-ledger** (1N-2N-3N)  
    - Inequality: \(W_{\text{extracted}} \leq -k_B T \ln(\text{reliability})\) (work ≤ penalty for misclassifications).  
    - Awkward commitment: Errors alone enforce the second law, even if measurement/reset is reversible.  
    - Entropy: Coarse-grained. Claims coarse-grained entropy increases due to errors.  
  - **D: Reset-ledger** (1N-2N-3Y-4Y-5Y)  
    - Inequality: \(\Delta S_{\text{reset}} \geq k_B I_{\text{erased}}\) (entropy increase ≥ erased information, Landauer’s principle).  
    - Awkward commitment: Measurement is free (reversible), but reset is costly; the demon "pays" only when resetting.  
    - Entropy: Fine-grained conserved during measurement; reset increases coarse-grained entropy. Claims coarse-grained entropy of isolated system increases upon reset.  
  - **E: Correlation-ledger** (1N-2N-3Y-4Y-5N)  
    - Inequality: \(\Delta S_{\text{gas}} + \Delta S_{\text{demon}} \geq -I_{\text{mutual}}\) (entropy decrease ≤ mutual information; no net fine-grained entropy change).  
    - Awkward commitment: The joint system (gas + demon) has conserved fine-grained entropy; the second law appears violated only if subsystems are considered separately.  
    - Entropy: Fine-grained conserved. Denies that coarse-grained entropy of an isolated system never increases (it may stay constant or fluctuate).  
  - **F: Measurement-ledger** (1N-2N-3Y-4N-5N)  
    - Inequality: \(\Delta S_{\text{measure}} \geq k_B \ln 2 \cdot I_{\text{acquired}}\) (entropy increase ≥ information acquired).  
    - Awkward commitment: Measurement is inherently dissipative; reset is irrelevant (no reset occurs).  
    - Entropy: Coarse-grained. Claims coarse-grained entropy increases during measurement.  
  - **G: Joint-cost-ledger** (1N-2N-3Y-4N-5Y)  
    - Inequality: \(\Delta S_{\text{measure}} + \Delta S_{\text{reset}} \geq k_B \ln 2 \cdot I_{\text{total}}\) (combined measurement + reset costs compensate).  
    - Awkward commitment: Both measurement and reset contribute to dissipation; no single "primary" cost.  
    - Entropy: Coarse-grained. Claims coarse-grained entropy increases.  

  #### Coverage of Key Setups  
  - **One-molecule engine**: Requires measurement (1N-2N); falls under D, E, F, or G depending on reversibility/reset.  
  - **Mechanical trapdoor**: Physical action (1Y) → **A**.  
  - **No-erasure demon (appends until full)**: No reset (5N) → **E** (if reliable/reversible) or **F** (if irreversible).  
  - **Unreliable demon**: Unreliable measurement (3N) → **C**.  
  - **Reversible-correlation demon**: Reversible, no reset (4Y-5N) → **E**.  
  - **Pre-existing-record demon**: Pre-existing info (2Y) → **B**.  

  #### Confidence Note  
  - **Confidence in branches**: High (≥90%). Branches are jointly exhaustive of mainstream positions, derived from 50+ years of literature. Physics unsettled only in **E** (whether coarse-grained entropy must eventually increase as correlations thermalize).  
  - **Least confident leaf**: **E** (correlation-ledger). Controversial; some argue correlations degrade into heat, forcing compensation. I present it as a coherent position, but it’s the most debated.  
  - **Weakest branch**: **Measurement Reversibility** (Q4). Reversible measurements are idealized; real systems may have hidden costs. However, it cleanly separates reset-led (D) from correlation-led (E) compensation.  

