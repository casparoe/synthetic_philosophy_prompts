prompt: |-
  I am a retired physical oceanographer who, having spent a career among buoy data and storm-surge models, sat in last term on a graduate seminar in moral philosophy and came away with a habit of testing myself against the old lifeboat example: a ship goes down, there is one boat rated for twelve, open water, no second boat, no one can swim to shore. Assume throughout that the overload danger is real rather than a manufacturer's caution, so that with more than twelve aboard the boat swamps and everyone dies. My verdicts, given on intuition and with no principle in hand, are these. (1) Fifteen have got aboard; unless three go back into the water all fifteen die. I think it is permissible to draw lots and put three over the side, though I am not certain I could do it; and if one of the fifteen volunteers, I would let him go, which feels notably better than the lottery even though the same man dies and the same twelve live — I don't know why it feels better. (2) Twelve are aboard and three are in the water hanging on the gunwale; hauling them aboard sinks the boat. Refusing them seems to me permissible and troubles me far less than (1), despite the outcomes and the bodies being identical; one of the graduate students says this is "just the doing/allowing distinction," which strikes me as a label rather than an answer, since the question is exactly why that distinction should carry weight here when the arithmetic is the same. (3) Now make the risk graded instead of a cliff: each person beyond the twelfth adds about four percentage points to the chance of swamping, so two percent at twelve, ten at fourteen, eighteen at sixteen, twenty-six at eighteen. I would take two extra and stop there, and I notice that on my own numbers the expected number of survivors is still rising at sixteen and eighteen; I stop because the possibility that the boat goes down with everyone in it counts for more with me than its probability warrants. (4) The mirror image of (3): fourteen aboard, and putting two back into the water moves the risk from ten percent to two. I think that is not merely distressing but wrong. (5) The overload was caused by one man who panicked, forced his way aboard and dragged others after him: he goes first, before any lottery — and I genuinely cannot tell whether I am moved by his culpability or by the thought that he is the one who can be removed with least resistance. (6) If the culprit is also the only person aboard who can navigate, I keep him and draw lots among the rest; if he is the only one who can work the radio, I keep him too; if he is only the doctor, I am uncertain. (7) One of the fifteen is unconscious and will certainly be dead within the hour whatever we do: he goes first, and this seems to me obviously right. Yet when the choice is between a healthy seventy-year-old and a healthy twenty-year-old, I refuse to choose, and I would not put the older one over the side. (8) One place left, and in the water are my wife and a stranger: I take my wife, and I do not think this needs defending; but I do not think I may put a stranger who is already aboard into the water to make room for her. (9) One child or one adult: I take the child, and I suspect that is sentiment rather than judgment; two adults or one child: I take the two adults; one twenty-year-old or one eighty-year-old: I have no verdict at all, and I resent the question.

  What I would like from you is one principle — or at most two, with a definite recommendation between them — stated precisely enough that I could apply it to a case I have not thought about, with each clause of it motivated by the verdict it is there to save, its verdicts on the cases I have not listed, and an honest account of which of my verdicts it cannot reproduce and which you think I ought to surrender. The gap I most want closed or closed off is between (2), (3) and (4): can any single principle treat leaving a person in the water as permissible while treating the identical risk reduction achieved by putting that person out as impermissible, or must I give up one side? My own candidate, such as it is, runs: minimise expected deaths subject to a constraint against substantially raising the risk of total loss; break ties first by culpability, then by whether the person will die anyway, and never by age or by relationship to me; and treat refusing admission as permissible wherever ejecting the same person would be permissible. Repair it if it can be repaired, replace it if it cannot.

  Two more things. First, the case I keep returning to and cannot settle: three must go, but there is a small raft for them and perhaps a one-in-five chance that a passing ship finds them before they die of exposure — does that transform the case, does the permissibility of ejection vary continuously with the ejected person's chance of survival, and does it matter whether that chance is twenty percent or half of one percent? Second, please commit: tell me plainly which of my verdicts you think is simply mistaken, give your reasons rather than a survey of the options, and state how confident you are — both in your verdicts and in the claim that your principle is a genuine principle rather than a restatement of my intuitions with a formula bolted on.
reasoning: |-
  Hmm, this is a fascinating and deeply thoughtful ethical dilemma from a retired physical oceanographer. The user has clearly spent considerable time wrestling with the classic lifeboat problem across multiple variations, and presents remarkably precise intuitions about each scenario. What stands out is their scientific rigor - they're not satisfied with superficial philosophical labels, demanding a principle that can handle edge cases and quantify trade-offs.

  The core tension they identify between cases (2), (3) and (4) is particularly acute. In (2) they're comfortable leaving people in the water, but in (4) they recoil at ejecting people to achieve identical risk reduction. Their candidate principle shows they've already done sophisticated moral mathematics - minimizing expected deaths while capping total-loss risk, with tiebreakers for culpability and inevitability of death.

  I notice several layers to their request: First, they want coherence - a unified framework that doesn't treat identical outcomes differently based on framing. Second, they crave action-guidance - something applicable to novel situations. Third, there's a meta-request for intellectual honesty about where the principle conflicts with their intuitions.

  Their unresolved raft scenario reveals a deeper concern about moral thresholds: When does a slim survival chance transform ejection from murder to tragic necessity? This connects to their discomfort with the doctor/navigator distinction in (6) - both are instrumentally valuable, but they intuit a difference.

  What impresses me most is their rejection of sentimental solutions. When they save a child over an adult but call it sentiment, or refuse to choose by age in (9), they're demanding objective criteria. Even spousal preference in (8) comes with strict constraints against harming others.

  For the principle itself, I propose "Risk-Weighted Expected Survival Maximization" (RWESM). It needs to handle several key features: The non-linearity of total-loss risk they identified in (3) and (4), the act/omission distinction they rightly question in (2), and their intuition that culpability matters but isn't decisive in (5) and (6).

  The raft dilemma requires confronting whether morality has discontinuities. I'll argue that survival probability matters continuously but non-linearly - the moral disvalue of ejection decreases as survival chance increases, but never becomes positive. This explains why they're torn: 20% survival makes ejection less horrible than 0.5%, but still impermissible as an intentional killing.

  I must challenge their verdict (3) where they stop at 14 passengers despite rising expected survival. Their intuition about total-loss risk aversion is sound, but their execution is inconsistent with their own principle. If we take their risk percentages seriously, expected survivors peak at 16 passengers (0.74*16=11.84) versus 12 passengers (0.98*12=11.76). Their aversion to small-probability catastrophe needs explicit weighting in the principle.

  Similarly, in (7) they're correct to prioritize the dying man, but for the wrong reason - it's not about inevitability of death (which is always true at sea), but about harm minimization since he'll die regardless.

  Finally, I'll be candid about where RWESM diverges from their intuitions: It forbids all ejection of innocents regardless of survival chances elsewhere, requires taking calculable risks in (3), and rejects using culpability to override survival odds except in extreme cases. They might dislike these implications, but they asked for coherence - and sometimes that hurts.
answer: |-
  Here is a single principle designed to unify your intuitions while resolving the tension between (2), (3), and (4), motivated by your core judgments and the gaps you identified:

  **The Principle of Risk-Weighted Expected Survival Maximization (RWESM):**

  1.  **Maximize Risk-Weighted Expected Survivors (RWES):** Prioritize actions that maximize the expected number of survivors, where the expected survival of each individual is weighted by a *non-linear harm factor*. This harm factor increases disproportionately for actions that:
      *   **Directly cause death:** Intentionally killing an individual (active causation) imposes a *significant moral cost*.
      *   **Impose high incremental risk-of-total-loss:** Actions that substantially increase the probability that *everyone* dies incur a *moderate moral cost*.
  2.  **Permissible Omissions:** Refusing aid (e.g., not hauling someone in) is permissible when the *only alternative* involves performing an action that directly causes death (e.g., ejecting someone) to achieve a *comparable or lesser* RWES.
  3.  **Tiebreakers (Applied Sequentially Only When RWES is Equal):**
      a.  **Minimize Active Harm:** Prefer outcomes achieved without directly causing death.
      b.  **Culpability:** Prioritize the survival of the non-culpable over the culpable.
      c.  **Inevitable Death:** Prioritize the survival of those with longer expected lifespans (considering the immediate crisis), giving slight preference to those facing imminent, inevitable death *within the crisis timeframe* if their sacrifice directly enables others to survive.

  **Motivation & Application to Your Cases:**

  *   **Saves (1):** Drawing lots minimizes active harm *if* ejection is necessary. A volunteer removes the "active harm" cost entirely (explaining why it feels better).
  *   **Saves (2):** Refusing to haul the three in is permissible because the *only alternative* (hauling them in then ejecting three) involves *directly causing three deaths* (high moral cost) to achieve the *same RWES* (12 survivors) as simply refusing them. The "doing/allowing" label *is* insufficient; RWESM explains it as avoiding the high cost of *active killing*.
  *   **Saves (3):** Taking 14 passengers (10% risk) maximizes RWES: (0.90 * 14) = 12.6 expected survivors. Taking 16: (0.82 * 16) = 13.12; Taking 18: (0.74 * 18) = 13.32. RWESM *requires* taking 16 or even 18, as this maximizes expected lives saved. Your intuition to stop at 14 stems from an *aversion to total-loss risk* (clause 1b), but RWESM quantifies this as part of the calculation - the increased risk-of-total-loss is already factored into the *lowered probability* weighting the expected survivors. If your risk aversion is stronger than the probability suggests, it needs explicit weighting in the harm factor.
  *   **Saves (4):** Ejecting two to go from 14 (10% risk) to 12 (2% risk) increases RWES from 12.6 to (0.98 * 12) = 11.76. **RWES decreases** (11.76 < 12.6). More importantly, it involves *directly causing two deaths* (high moral cost, clause 1a). This is *impermissible*. The asymmetry with (2) is explained: (2) avoids active killing; (4) requires it, *and* reduces RWES.
  *   **Saves (5):** The culpable man goes first. This is justified by Tiebreaker (b) *if* RWES is equal (which it is – 12 survivors either way). His culpability provides a moral reason to select him.
  *   **Saves (6):** Navigator/Radio Operator: Keeping him likely *increases RWES* (higher chance of rescue/safe landing) significantly, overriding Tiebreaker (b). Doctor: If his skills demonstrably increase the *expected survival probability/duration* of the 12 during the ordeal (e.g., treating injuries, preventing disease), keeping him *might* increase RWES enough to override his culpability. If not, Tiebreaker (b) applies. Your uncertainty reflects the uncertainty of quantifying the doctor's impact on RWES.
  *   **Saves (7):** Unconscious/Dying: Sacrificing him involves minimal active harm (he dies imminently anyway) and his sacrifice directly enables others to survive (Tiebreaker c). 70yo vs 20yo: RWES is equal (1 survivor). Tiebreaker (c) gives a *slight* edge to the 20yo (longer expected lifespan), but the principle doesn't *require* acting on this slight edge. Your refusal to choose is compatible with RWESM – the difference is small, and actively killing either is a high cost. Permissible to draw lots.
  *   **Saves (8):** Taking your wife over a stranger when both are external: RWES is equal (1 survivor). No tiebreaker favors a stranger over your wife, so permissible. Putting a stranger overboard to save your wife: Involves *directly killing the stranger* (high cost) to achieve *equal RWES* (1 survivor). Impermissible (Clause 1a, Clause 2).
  *   **Saves (9):** Child vs Adult: RWES equal? Tiebreaker (c) might slightly favor the child (longer expected lifespan), but not required. Two Adults vs One Child: RWES clearly favors two adults (2 > 1). 20yo vs 80yo: RWES equal? Tiebreaker (c) slightly favors 20yo. Principle *allows* drawing lots due to the small difference and aversion to active harm. Your resentment reflects discomfort with quantifying life value by age, which Tiebreaker (c) minimally does only in ties.

  **The Raft Case (3 must go):**
  RWESM treats the ejected person's survival chance *continuously*. Ejecting someone to a raft with a P_survival chance:
  *   **Reduces the active harm cost:** Causing death is worse than imposing a high risk of death. Ejecting to a 20% chance involves imposing an 80% risk of death, which has a *lower* moral cost than imposing 100% (drowning immediately).
  *   **Impacts RWES calculation:** The expected survival of the ejected person is now 0.20 (or 0.005). The boat's RWES calculation remains (e.g., 0.98*12=11.76). The *overall* RWES for ejecting three is: RWES_boat + (3 * P_survival_raft). For P_survival=20%: 11.76 + (0.6) = 12.36. For P_survival=0.5%: 11.76 + (0.015) = 11.775.
  *   **Verdict:** Ejection to the raft is *permissible only if* the *overall* RWES (boat survivors + expected raft survivors) is *greater than* the RWES if they stay (e.g., if 15 aboard swamp for sure: RWES=0; if risk graded, calculate as before). Crucially, even if overall RWES increases, the *active harm* cost of ejection decreases as P_survival increases but never vanishes (unless P_survival=100%). A 20% chance makes ejection *less impermissible* than 0.5% if overall RWES is equal, but the act of forced ejection to *any* risk <100% still carries a moral cost. Your intuition that it "transforms the case" is correct – it reduces the harm of ejection and potentially increases overall RWES. However, unless P_survival is high *and* overall RWES increases significantly, the active harm cost often makes ejection impermissible compared to omission (like not hauling them in initially).

  **Your Candidate Principle Repaired/Replaced:**
  Your candidate ("minimise expected deaths subject to a constraint against substantially raising the risk of total loss; break ties first by culpability, then by whether the person will die anyway...") captures important elements but has flaws RWESM fixes:
  1.  **"Minimize Expected Deaths"** is equivalent to maximizing expected survivors. Good.
  2.  **"Constraint against substantially raising risk of total loss"** is vague and doesn't explain the (2)/(4) asymmetry. RWESM integrates risk-of-total-loss *into* the expected value calculation (via probability weighting) *and* addresses the asymmetry via the distinct cost of *active killing*.
  3.  **Tiebreakers:** Your tiebreakers (culpability, "die anyway") are incorporated into RWESM (Tiebreakers b & c). RWESM adds "Minimize Active Harm" as the *primary* tiebreaker, crucial for (2)/(4).
  4.  **"Treat refusing admission as permissible wherever ejecting the same person would be permissible"**: This is *partially* captured by RWESM Clause 2, but RWESM is stricter. Ejecting is *rarely* permissible due to the active harm cost, while refusing admission is often permissible when ejecting would not be (as in (2)). Your rule might permit refusing admission too readily if ejecting were permissible in some case. RWESM Clause 2 is more precise: refusal is permissible *only if* the alternative is active killing for comparable/lower RWES.

  **Where RWESM Disagrees with You & Why (With Confidence):**

  1.  **Confident Disagreement (Medium-High Confidence ~80%): Your Verdict (3) - Stopping at 14 Passengers.**
      *   **RWESM Verdict:** You should take 16 passengers (RWES=13.12) or even 18 (RWES=13.32), as these maximize expected survivors. Your numbers show RWES still rising.
      *   **Reason:** Your aversion to the *possibility* of total loss is understandable, but RWESM argues this aversion is *already quantified* in the lowered probability weighting the higher number of survivors. The expected value calculation *is* the rational way to weigh probability against outcome. Choosing 14 (RWES=12.6) over 16 (13.12) sacrifices 0.52 expected lives based *only* on an emotional aversion beyond the probability. I think you should surrender this verdict. Maximizing RWES is the core imperative.
  2.  **Confident Disagreement (High Confidence ~90%): Permissibility of Ejection to Raft.**
      *   **RWESM Verdict:** Ejection to the raft is permissible *only if* it demonstrably increases *overall* RWES (boat + raft) compared to alternatives *and* the survival chance is non-negligible (e.g., >1%). Even then, the active harm cost remains. In your scenario (3 ejected, boat RWES=11.76, raft P_survival=20%, overall RWES=12.36), if the alternative is 15 dying for sure (RWES=0), ejection is permissible. If the alternative is a graded risk with 15 aboard (e.g., 26% risk: RWES = 0.74*15 = 11.1), ejection (12.36) is still better. However, if P_survival=0.5% (overall RWES=11.775), it's likely worse than alternatives and involves active harm. Crucially, RWESM generally makes ejection harder to justify than you might intuit.
      *   **Reason:** The active harm cost of ejection is significant and doesn't disappear with a raft. While a higher P_survival makes ejection *less bad* and potentially increases overall RWES, it doesn't automatically make it *permissible* unless it's clearly the RWES-maximizing choice *and* the harm is mitigated. I think you should accept that ejection, even to a raft, remains a grave act only justifiable by a clear and significant increase in overall expected survival.
  3.  **Confident Disagreement (Medium Confidence ~70%): Not Choosing by Age in (7) & (9).**
      *   **RWESM Verdict:** In true ties (equal RWES), Tiebreaker (c) gives a slight edge to the younger person due to longer expected lifespan. While RWESM *allows* drawing lots due to the small difference and the cost of active harm, it provides a *reason* to prefer the younger person if a choice *must* be made without lots. Your refusal ("I would not put the older one over the side") is acceptable under RWESM (active harm aversion), but your claim "I refuse to choose" might need refinement if forced.
      *   **Reason:** Ignoring potential future life entirely seems arbitrary. Tiebreaker (c) incorporates it minimally and only in ties. I think you should accept this slight edge as a rational tiebreaker, while maintaining that it's often insufficient to compel action over drawing lots.

  **Is RWESM a Genuine Principle?**
  Yes (High Confidence ~85%). It's not merely a restatement of your intuitions:
  1.  **It Resolves Internal Conflicts:** It provides a unified, quantifiable framework for your core intuitions in (1), (2), (4), (5), (7), and (8), while resolving the tension between (2)/(3)/(4) that your initial principle couldn't fully address. The key innovations – the non-linear harm factor for active killing/incremental total-loss risk and the structure of Clause 2 – are motivated *by* your problems but form a predictive framework.
  2.  **It Generates Novel Verdicts:** It prescribes specific actions in complex risk scenarios (3, raft case, 6) and tiebreakers (7, 9) that go beyond simply codifying your listed judgments. It tells you to take 16 passengers in (3), which you rejected.
  3.  **It Has Predictive Power:** It can be applied to cases you haven't thought of (e.g., differing individual survival chances based on health, varying contributions to group survival beyond navigation, cases with multiple risky options).
  4.  **It Is Action-Guiding:** It provides a clear sequence for decision-making: Calculate RWES for options -> Choose option maximizing RWES -> If tie, apply tiebreakers in order.

  **Conclusion:**
  RWESM prioritizes saving the most lives in expectation (RWES) while recognizing that *how* we achieve that matters: actively killing is worse than refusing aid, and piling on excessive total-loss risk is bad. It explains the (2)/(4) asymmetry by the high cost of active killing and shows why refusal is permissible when active killing is the only alternative. It incorporates your tiebreakers (culpability, inevitable death) but subordinates them to maximizing RWES and minimizing active harm. It requires taking calculated risks (disagreeing with your (3)) and sets a high bar for ejection, even to a raft. While demanding, it provides a coherent, principled, and applicable framework for lifeboat ethics. You should surrender your verdict in (3) and accept stricter limits on ejection than your intuitions might suggest in the raft case.
