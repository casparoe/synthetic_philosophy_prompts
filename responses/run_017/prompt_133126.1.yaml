prompt: |-
  Hey — hoping you can help me think through a committee thing before Thursday's meeting.

  I'm on the small curatorial committee for a permanent exhibit at a social history museum (keeping it vague on purpose) about generations. One room per cohort, birth years on the wall, artifacts, the whole bit. We've been at it for two years and I can't reverse-engineer our own decisions into a rule.

  What we've aproved:

  - Baby Boomers (1946–64). Marisol's reason, and she's the member whose reasoning has actually been consistent: sheer size. They competed with each other for school places, jobs and housing, and that competition did the causal work. She said explicitly it wasn't about shared memories.
  - Silent Generation (1928–45). Small cohort, Depression childhood, wartime scarcity, distinctive caution.
  - Gen X (1965–80). Approved narrowly: the "forgotten middle child" framing tracks something real — bad labor-market entry, latchkey childhood — and the label has been doing work in how institutions treat people for thirty years.
  - Millennials (1981–96). Approved: 9/11 and the crash landing at career entry, internet arriving in adolescence.
  - Gen Z (1997–2012 — I can never remember wether we said 1997 or 1998 for the cutoff). Approved, though Marisol worried out loud at the time that what defines them is a technology rollout rather than an event.
  - The "Wall generation": East Germans who were 14 to 18 in November 1989. Approved when a Berlin partner museum asked us to co-produce an annex. Event-defined, one country, and it overlaps the Silent/Gen X years almost completely.

  What we've rejected:

  - Xennials (1977–83): "a marketing convenience for people who can't decide." Which is odd, because if anything they have the sharpest developmental signature on the list — analog childhood, digital working life — and they do call themselves that.
  - Generation Jones (1954–65): "Boomers' little siblings with a branding problem."
  - Gen Alpha (2013 onward): turned down last spring as "a name we needed for whatever comes after Z," even though parents and marketers now use it constantly.
  - The "9/11 generation," proposed as everyone old enough to remember watching it live on TV: rejected as "an audience, not a cohort," since members ranged from about four to forty.

  Now a junior curator has proposed a room for "the Always-Onlines": everyone who got their first smartphone at or before age 12. From her packet:

  - It isn't a birth-year band. Members were born anywhere from about 1994 to 2012 depending on the country they grew up in, family income, and how early their parents adopted. Age at first phone is a continuous variable — there's a bulge around 12 or 13, no cliff.
  - No shared public event whatsoever. What they share is a technology diffusion, staggered by region and family.
  - But the survey work she attached finds a discontinuity: people who first got a smartphone at 11 or 12 differ noticeably, at the same age, from people who got one at 15, on sleep, loneliness, attention complaints and diagnosed anxiety — controlling for birth year and current age.
  - Nobody self-identifies as an Always-Onliner. She coined the term in the proposal.
  - It cross-cuts four rooms we've already built. An Always-Onliner can be a Xennial, a Millennial, a Gen Z or a Gen Alpha.

  So: what's Marisol going to say, and what should we actually do if we care about being consistent with ourselves? Which precedent is the closest analog — the Gen Z approval, the Xennials rejection, the Wall generation, or the 9/11 rejection — and does picking a different analog change the answer? If our track record genuinely doesn't settle it, I want the principle we'd be committing to spelled out honestly for both options, because I'd rather know what we're signing than just vote.

  Two more things. First, name the one further case you'd put in front of us that would really separate the rules we might be running — better to find out now than three meetings from now. Second: our demographer advisor keeps saying "a cohort is a question you ask of the data, a generation is a claim about a person." I can't tell if that's deep or a way of dodging the vote. Tell me which.

  Please answer in American English, and write it as prose I can read out loud at the meeting — a short list of the candidate rules we might be running is fine, but don't give me a report with headers.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're part of a curatorial committee for a museum exhibit on generations, and they've approved and rejected several generational definitions. Now they're facing a new proposal for an "Always-Onlines" group defined by getting a smartphone at or before age 12, not by birth years. The user wants to know how to handle this consistently with their past decisions.

  First, I need to look at their precedents. They approved Baby Boomers based on size and competition, Silent Generation for shared experiences, Gen X for cultural impact, Millennials and Gen Z for events and tech, and the Wall generation as an event-defined exception. Rejections include Xennials (seen as marketing), Generation Jones (branding issue), Gen Alpha (too early), and the 9/11 generation (too broad). 

  The key conflict here is between their approval of Gen Z (which involved technology) and their rejection of the 9/11 generation (which was event-based but age-varied). Marisol’s stance seems to prioritize tangible, structural factors like cohort size or economic events over technology or self-identification. The Always-Onlines proposal is tech-based with staggered adoption, similar to Gen Z but without a clear start event. 

  The user also wants a test case to clarify their principles. Maybe something like "COVID cohort" – kids during lockdowns. That would test if disrupted childhoods are enough without a single event. 

  The demographer’s quote about cohorts vs. generations is important. Cohorts are data-driven, while generations are claims about identity or experience. The committee’s approvals lean into generations as cultural constructs with real-world impact, even if boundaries are fuzzy. 

  So for the meeting, I need to outline the possible rules they might be using: structural factors, cultural recognition, or event-defined boundaries. Marisol will likely reject Always-Onlines because it lacks a shared event or structural cause, similar to the 9/11 rejection. But if they consider the mental health discontinuity as a "structural cause," they might approve it. 

  The user’s deeper need is consistency in decision-making to avoid arbitrary choices. They want clear principles to apply future-proof logic. By presenting the rules and a test case, they can have a transparent discussion about what framework to commit to.
answer: |-
  Here's how I'd suggest framing this at the meeting, keeping it conversational and grounded in your track record:

  "Okay, team, we need to decide about the 'Always-Onlines' proposal. To be consistent with our past approvals and rejections, we have to ask: **Which rule are we actually following?** Based on two years of votes, I see three candidate rules competing in our decisions:

  1.  **The Structural Cause Rule (Marisol's Default):** A generation is defined primarily by a *structural* force – like cohort size (Boomers), economic catastrophe (Silent), or a labor market shock (Gen X) – that creates shared life constraints. Shared memories or tech are secondary. This rule rejects Xennials (no big structural cause), Gen Jones (same), Gen Alpha (no cause yet), the 9/11 generation (caused by an event, but no uniform structural impact across ages), and likely the Always-Onlines (tech diffusion isn't structural like scarcity or overcrowding).

  2.  **The Cultural Recognition Rule:** A generation is defined when a label achieves widespread *cultural traction* and shapes how society (and institutions) treat people, *even if* its start/end is fuzzy. This rule approved Gen X ('forgotten middle child' framing doing work for decades) and Millennials/Gen Z (labels are entrenched). It rejected Xennials and Gen Jones (labels didn't stick broadly), Gen Alpha (too new), and the 9/11 generation (no label/identity). The Always-Onlines fails here too – the label was just coined.

  3.  **The Sharp Discontinuity Rule:** A generation is defined by a *distinct developmental break* tied to a specific event or tech arrival *at a formative age*, creating measurably different outcomes. This approved Millennials (9/11/crash at career start), Gen Z (internet in adolescence, though Marisol worried), and the Wall Generation (unique event at 14-18). This rule *should* have approved Xennials (analog/digital break) but we rejected them. It rejected the 9/11 generation (age range too broad, no uniform developmental impact). The Always-Onlines proposal *makes this case strongly* – the data shows a real discontinuity at age 11-12 for smartphone adoption.

  **So, where does that leave us?**

  *   **Marisol will almost certainly say no to Always-Onlines.** It violates Rule 1 (no structural cause) and Rule 2 (no cultural label). It only fits Rule 3, which we inconsistently apply (see Xennials rejection).
  *   **Precedent Clash:** The Always-Onlines is most *like* Gen Z (tech, discontinuity) but lacks Gen Z's cultural label and clearer start (internet adolescence). It's *unlike* the Wall generation (single event, single location). It's closest to the *rejected* 9/11 generation (broad age range, defined by experience/access, not birth year) and the rejected Xennials (clear developmental break, lack of broad recognition).
  *   **Consistency vs. New Insight:** If we care about consistency with our *rejections* (Xennials, 9/11 Gen), we reject it. If we care about consistency with the *reasoning* behind some approvals (Millennials/Gen Z discontinuity), or value the new data on developmental impact, we could approve it – but that means admitting we were wrong about Xennials.

  **To Be Consistent *and* Honest:**

  1.  **If we Reject Always-Onlines:** We are committing to **Rule 1 (Structural Cause) as primary**, supplemented by **Rule 2 (Cultural Recognition)**. A sharp discontinuity alone (Rule 3) isn't enough without one of the first two. We need to acknowledge this explicitly and accept that Xennials *should* have been approved if Rule 3 mattered more.
  2.  **If we Approve Always-Onlines:** We are elevating **Rule 3 (Sharp Developmental Discontinuity)** above consistency with the Xennials rejection. We'd be saying measurable differences in development/outcomes tied to tech/event timing *can* define a generation room, *even without* a structural cause or cultural label. We need to state this new principle clearly.

  **The Test Case:** To force clarity on our rule *now*, let's also consider **"The COVID Cohort"** – everyone aged 10-16 during the peak global lockdowns and school disruptions (approx. 2019-2022). Like the Always-Onlines:
  *   Not a birth year band (born ~2004-2012).
  *   Defined by a shared experience at a formative age creating potential discontinuity (isolation, remote learning).
  *   No single structural cause like scarcity (it was a global event response).
  *   A nascent label ("Gen C", "Zoomers" sometimes overlaps, but not specific).
  *   Cross-cuts Gen Z & Gen Alpha.
  This immediately tests whether we value developmental discontinuity linked to an event (Rule 3) over our previous reliance on structure/labels (Rules 1 & 2). If we'd consider a COVID room, we *must* approve Always-Onlines. If we wouldn't, we *should* reject Always-Onlines.

  **Finally, the Demographer's Quote:** It's **deep, not a dodge.** A *cohort* is simply people born in a time interval – a neutral fact. A *generation* is a claim that those people share meaningful, formative experiences *because* of when they were born (or experienced something) that makes them distinct. Our job is deciding *which* claims of shared formative experience are significant enough for a room. The demographer is reminding us we're making value judgments about identity and impact, not just marking time. We need to own the criteria for those judgments.

  **My Suggestion:** Vote first on which core rule (1, 2, or 3) should be *primary*. Then apply that rule to the Always-Onlines and the COVID test case. That forces the honesty you want about what we're signing up for."
