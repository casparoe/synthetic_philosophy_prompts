prompt: |-
  I spent the better part of forty years as an experimental solid-state physicist, most of it in X-ray crystallography, and since retiring I have been sitting in on a philosophy of science reading group. I came to the underdetermination debate from what I take to be an unusual direction: not from scepticism about unobservable entities, but from the fact that in my own working life the data frequently did not fix the answer, and this never struck me as a philosophical difficulty. It does now, and I should be grateful for help in working out what I actually think.

  Below are the cases I keep turning over, with my untutored verdicts.

  (i) The phase problem. A diffraction experiment yields intensities, not phases; a great many electron-density distributions are consistent with the same measured amplitudes to within the noise. Verdict: genuine underdetermination, and not remotely worrying. I knew exactly which degrees of freedom were unconstrained, I pinned them down with a smoothness rule, and I never once thought that the structure my rule selected *was* the structure — only that it was good enough to get on with. My realism about the structure was untouched throughout.

  (ii) Newtonian gravity as action at a distance versus Newtonian gravity as a potential satisfying the Poisson equation, with the usual boundary conditions. Verdict: not underdetermination at all, merely a change of idiom.

  (iii) Matrix mechanics and wave mechanics once the intertranslation had been exhibited. Verdict: officially the same as (ii), and yet not the same: the two presentations invite pictures of the world — an algebra of observables versus a field in a high-dimensional space — that differ in content, and that no evidence could ever adjudicate between. This bothers me more than (ii), and I cannot say why.

  (iv) A Ptolemaic system with as many epicycles as you please, supposing it reproduces whatever the Copernican system predicts. Verdict: dismiss it. The epicycle engine is a fitting device, not a rival theory. The same holds, even more strongly, for the temporal analogue — a rival that agrees with ours up to some date and diverges thereafter, in the style made familiar by Goodman's grue.

  (v) Newtonian gravity plus a universal extra acceleration term with a free exponent and a free coefficient, fitted to what we have measured. Verdict: I find this genuinely disquieting, though I suspect my discomfort is really about (ix) below rather than about this case as stated.

  (vi) Pilot-wave theory versus the Everettian picture, setting aside the dynamical collapse models, which are not empirically equivalent at all. Verdict: serious, and not verbal — they disagree about what exists. And here, unlike in (i), I do not know what I am entitled to believe.

  (vii) The hypothesis that the world came into being five minutes ago, complete with memories, fossils and laboratory notebooks. Verdict: not worrying, and I should be embarrassed to file it alongside (vi) — even though, on the standard criterion, no possible evidence separates them.

  (viii) Two cosmological models agreeing on everything within our observable patch and disagreeing beyond the horizon. Verdict: real underdetermination, but of a different kind from (vi). In (vi) I suspect there may be no fact of the matter; in (viii) I am confident there is one and merely unreachable. I cannot say what that confidence amounts to if evidence is all we have.

  (ix) Rivals separable only by an experiment that is physically possible but not performable by us — a detector of galactic dimensions, a computation of astronomically many steps, or a wait longer than the age of the universe. Verdict: as bad, for us, as (vi), and yet I want to say the theories genuinely differ.

  The principle I have been groping towards is this. Call two theories *robustly* equivalent when they agree not merely on the evidence we have, but on what would be observed under every physically possible arrangement of apparatus and every physically possible setting of initial and boundary conditions, including arrangements no one will ever build. Then an underdetermination is serious if and only if: (a) the rivals are robustly equivalent in that sense; (b) neither is obtainable from the other by a change of variables, a change of idiom, or the addition of items whose net contribution is fixed at zero; and (c) neither is parasitic — specified only by taking its rival over wholesale and appending a global denial of the rival's truth. Clause (b) is meant to dispose of (ii) and (iv); clause (c) of (vii).

  I should like you to test this against my verdicts, repair it or replace it, and state plainly which of my verdicts it forces me to abandon — I expect (iii) and (viii) are in trouble, and I suspect the principle needs an in-principle/for-us distinction if it is to do justice to (v) and (ix), but I want you to say so rather than to agree with me. Please also give verdicts, and say which clause delivers them, on three cases I have not made up my mind about: a rival pair where the distinguishing quantity is one that the first theory itself entails can be measured by no procedure permitted by its own laws; rivals that agree on every possible observation but disagree about what would have happened under a counterfactual setting of a constant of nature; and rivals differing only in that one postulates two fields whose effects everywhere cancel exactly and the other one.

  Finally: a member of the group says structural realism answers everything on my list — believe the structure the rivals share, withhold on the rest. I should like you to say whether that delivers anything in (v), (vi) and (viii), or whether it merely relabels the difficulty, given that in (vi) the rivals seem to disagree about structure as well.

  Please take a definite position throughout, tell me which verdicts of mine you would overturn and why, and mark clearly where you are going beyond what the literature settles and where you are instead recommending how we use a word. British English, please.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating case - an experienced physicist grappling with philosophical underdetermination after decades of practical scientific work. Their detailed examples and provisional principle show deep engagement with the problem. 

  First, I need to understand their core concern: they're untroubled by cases like the phase problem where underdetermination is technically manageable, but deeply unsettled by scenarios where evidence seems fundamentally insufficient to choose between competing ontologies (like pilot-wave vs Everett). Their proposed principle of "robust equivalence" attempts to separate trivial from serious underdetermination.

  Looking at their cases:
  - (i) is correctly identified as unproblematic - it's a calculational tool, not ontological ambiguity
  - (ii) and (iv) seem correctly dismissed as notational variants
  - But (iii) reveals tension: matrix vs wave mechanics feel ontologically distinct despite formal equivalence
  - (v) and (ix) touch on practical vs principled underdetermination - a key distinction
  - (vi) and (viii) represent the hard cases where ontological commitment feels strained
  - (vii) is properly seen as parasitic rather than substantive

  Their principle has merit but needs refinement. The "robust equivalence" definition works well, but clauses (b) and (c) require tightening. Clause (b) should exclude not just notational changes but cases where formal equivalence masks interpretive divergence (as in matrix/wave mechanics). Clause (c) should cover not just parasitic rivals but any non-explanatory alternatives.

  For their unresolved cases:
  - The "undetectable quantity" scenario clearly violates robust equivalence since one theory declares measurement impossible
  - Counterfactual constants involve modal claims beyond observational equivalence
  - Canceling fields fail clause (b) as they're notational variants with zero-sum additions

  Regarding structural realism: it helps in (v) by focusing on shared equations, but fails in (vi) where the mathematical structures differ, and offers cold comfort in (viii) where we're denied access to the global structure. It doesn't resolve the core unease about inaccessible truths.

  The user's instinct about needing an in-principle/for-us distinction is correct - this resolves the tension between (v)/(ix) and other cases. We should preserve their intuition that (viii) has a fact of the matter while (vi) may not.

  Ultimately, their physicist's realism shines through: what troubles them isn't underdetermination per se, but whether it points to genuine ontological indeterminacy. The principle should reflect that theories making identical claims about physical possibilities aren't substantively distinct, while those differing on modal facts (even unobservable ones) represent real alternatives.
answer: |-
  Right then, let's tackle this properly. Your physicist's instinct is sound, and your principle is a solid starting point – far better than most initial forays into this thicket. We'll dissect your cases against your principle, shore up the principle itself, address your unresolved cases, and deal with structural realism. I'll be blunt where I think you're wrong and defend where I think you're right.

  **Testing Your Principle Against Your Verdicts:**

  1.  **Principle Applied:**
      *   **Robust Equivalence (RE):** Agreeing on *all physically possible* observations under *all physically possible* conditions (apparatus, initial/boundary).
      *   **Serious Underdetermination iff:** (a) RE holds; (b) Not mere change of idiom/variables/adding zero-sum items; (c) Not parasitic (wholesale copy + denial).

  2.  **Your Cases Assessed:**
      *   **(i) Phase Problem:** *Verdict Confirmed.* RE holds (same amplitudes constrain possible densities). Clause (b) fails – your smoothness rule *is* adding a constraint (effectively setting unmeasured degrees of freedom to zero or 'smooth' values), making the *specific* chosen density *not* robustly equivalent to others ruled out by smoothness. It’s underdetermined *without* the rule, but the rule breaks the RE. Your attitude ("good enough, realism untouched") is exactly right. Not serious underdetermination for a working theory.
      *   **(ii) Action-at-Distance vs. Potential:** *Verdict Confirmed.* RE holds. Clause (b) fails. It's a change of mathematical idiom/framework describing the *same* physical content (force on a test mass). Not underdetermination.
      *   **(iii) Matrix vs. Wave Mechanics:** *Verdict Challenged (but your unease spot on).* Officially, RE holds (von Neumann proved empirical equivalence). Clause (b) *seems* to fail – they are formally intertranslatable. **However, your discomfort is justified.** The core issue is whether the differing "pictures" (algebra of observables vs. wave in config space) are *merely* representational (like (ii)) or carry distinct ontological commitments. If the wave function is *ontologically* a real field in 3N-D space (as some wave mechanics interpretations hold) vs. matrix mechanics suggesting observables are fundamental and the "wave" is calculational, then clause (b) *might* not fully apply. The formal equivalence doesn't necessarily erase the *interpretive* divergence about what fundamentally *exists*. This is where the principle needs refinement. **Verdict:** Under your principle as stated, it shouldn't be serious (b fails). But your sense it's *more* than (ii) is correct – it hints at underdetermination *of interpretation* even when the formalism is unique. I'd *modify* clause (b) later.
      *   **(iv) Ptolemy vs. Copernicus (Epicycles):** *Verdict Confirmed.* RE holds *only* for a finite set of observations/planets. Clause (b) fails for a *finite* model (it's a different, cumbersome idiom). Clause (c) fails spectacularly for the *infinite* epicycle model – it's parasitic by construction ("whatever Copernicus says, plus epicycles to match"). Not a serious rival theory; a pathological counterexample.
      *   **(v) Newton + Fudge Factor:** *Verdict Partially Confirmed (Disquiet Warranted).* RE holds *for the data we have*. However, RE does *not* hold universally: the free parameters mean it could predict *different* outcomes for experiments *not yet done* involving different scales or configurations. The disquiet stems from its being a *degenerate* theory – infinitely many possibilities consistent with current data, many falsifiable *in principle*. Your link to (ix) is astute. **Serious underdetermination *for us* right now, but *not* robust equivalence *in principle*.** The principle needs to distinguish this.
      *   **(vi) Pilot-Wave vs. Everett:** *Verdict Confirmed (Serious).* Assuming no dynamical collapse, RE holds (they predict the same observable outcomes for *all* possible quantum experiments). Clause (b) fails – they are not mere notational variants; their mathematical structures and ontological commitments (hidden particles + guiding wave vs. universal wavefunction + branching) are profoundly different. Clause (c) fails – neither is parasitic on the other. This is the paradigm case of serious, troubling underdetermination between substantively different ontologies.
      *   **(vii) 5-Minute Hypothesis:** *Verdict Confirmed.* RE holds (by construction, matches all possible observations *now*). Clause (c) *succeeds* – it's parasitic. It takes the entire current state of the world (including memories, records) described by standard theory T and appends "but T is false, this all popped into existence". Not a serious rival. Correctly distinguished from (vi).
      *   **(viii) Cosmological Models (Beyond Horizon):** *Verdict Challenged.* RE *fails*. The rivals *disagree* on what would be observed *if* we could place apparatus beyond our horizon or wait long enough for light from there to arrive. These are physically possible arrangements/conditions, just *practically* impossible *for us*. Your confidence there's a fact of the matter is justified – the models make different claims about what exists *now* in regions causally disconnected from us. This is **epistemic limitation**, not robust equivalence. Serious underdetermination *for us*, but RE doesn't hold. Clause (a) fails.
      *   **(ix) Impracticable Experiments:** *Verdict Confirmed (Serious for Us).* RE *holds* (they agree on the outcome of *every physically possible* experiment, even the galactic-sized one). They genuinely differ ontologically. Clauses (b) and (c) likely fail. This is serious underdetermination *identical in kind* to (vi), differing only in the scale of the experiment needed to break it. Your desire to say they "genuinely differ" is correct, but underdetermination remains.

  **Repairing Your Principle:**

  Your principle is good but needs two key modifications:

  1.  **Strengthen Clause (b):** It must exclude not just syntactic changes (variables, idiom) and zero-sum additions, but also cases where the formal equivalence masks a fundamental disagreement about the *nature* of the entities or the *structure* of reality, even if the observational consequences are identical. (This addresses (iii)).
      *   *Revised Clause (b):* "...neither is obtainable from the other by a change of variables, a change of idiom, the addition of items whose net contribution is fixed at zero, *or represents a merely representational or interpretive shift while preserving the core physical content and ontological commitments regarding causally efficacious entities.*"
  2.  **Introduce the In-Principle/For-Us Distinction:** Your principle defines *serious underdetermination* as requiring Robust Equivalence (RE). This is correct for the *deepest* philosophical worry. However, we need a category for the *practically significant* underdetermination you feel in (v) and which is evident in (viii).
      *   *Define:* **Empirical Equivalence for Us (EFU):** Agreement on all evidence *we possess* and on outcomes of *all experiments practically performable by us* (now or foreseeably).
      *   *Distinguish:*
          *   **Serious (Robust) Underdetermination:** RE holds + (revised b) fails + (c) fails. (Cases like vi, ix).
          *   **Practical Underdetermination:** EFU holds, but RE *fails* (i.e., distinguishing experiments are *in principle* possible, just not *for us*). (Cases like v, viii). This is still deeply concerning scientifically but is a limitation of our epistemic access, not a sign of fundamental equivalence.

  **Revised Principle:**

  Two theories are **robustly equivalent** if they agree on the outcome of every physically possible experiment under every physically possible arrangement of apparatus and initial/boundary conditions.

  *   **Serious Underdetermination** exists iff:
      (a) The theories are robustly equivalent.
      (b) They are not intertranslatable via a mere change of variables/idiom, addition of zero-sum items, *or representational shift preserving core causal ontology*.
      (c) Neither is parasitic (wholesale copy + denial).

  *   **Practical Underdetermination** exists iff:
      (d) The theories are **Empirically Equivalent for Us (EFU)** (agree on all available evidence and on outcomes of all practically performable experiments).
      (e) They are not robustly equivalent (i.e., distinguishing experiments are in principle possible but not for us).
      (f) They satisfy (revised b) and (c) from above (i.e., they are substantively different and non-parasitic).

  **Verdicts Overturned/Refined:**

  *   **(iii) Matrix vs. Wave Mechanics:** Under the original principle, verdict overturned (not serious). Under the *revised principle*, with strengthened (b): **Not seriously underdetermined.** The core physical content (predictions for measurement outcomes) is identical. The different "pictures" are interpretive glosses on the *same* mathematical structure (Hilbert space formalism) describing the *same* observable phenomena. They don't posit different *causally efficacious* hidden entities (unlike pilot-wave). The unease is about the *metaphysics of representation*, not underdetermination of physical content. Serious underdetermination requires disagreement about what *does* the causing, which isn't the case here within standard QM interpretations of these formalisms.
  *   **(viii) Cosmological Models:** Verdict refined. **Not Seriously Underdetermined** (RE fails). **Practically Underdetermined** (EFU likely holds, RE fails, distinguishing principle (b)/(c) likely satisfied). Your confidence in a fact of the matter is compatible with this – the limitation is our access, not the theories' equivalence.

  **Your Unresolved Cases - Verdicts & Clauses:**

  1.  **Distinguishing quantity impossible by first theory's own laws:**
      *   **Verdict: Not Seriously Underdetermined. Clause (a) fails.** Robust Equivalence (RE) *cannot* hold. Theory 1 *entails* that quantity Q *cannot* be measured by any physically possible procedure (under its laws). Theory 2 entails that Q *exists* and *could* be measured (presumably by a procedure forbidden by Theory 1's laws). Therefore, they *disagree* on what constitutes a "physically possible arrangement of apparatus" or "physically possible procedure". They describe different sets of physical possibilities. Theory 2's postulated measurement procedure is *not* physically possible according to Theory 1. RE requires agreement on outcomes *within a shared notion of physical possibility*. Here, the notions of physical possibility differ fundamentally. This is a clash of paradigms, not robust equivalence.

  2.  **Agree on observations, disagree on counterfactual constants:**
      *   **Verdict: Seriously Underdetermined (if RE holds). Clause (a) holds (assumed), Clause (revised b) fails? Depends.** The key is Robust Equivalence. Do they agree on *all* physically possible observations? Crucially, do they agree on the outcomes of experiments run *if the constant had been different*? If the constant is *truly* fundamental and fixed, then those counterfactual scenarios are *not* "physically possible arrangements/conditions" *according to either theory* (since the constant *is* that value). Therefore, RE only requires agreement on experiments run *with the constant as it is*. Their disagreement about the counterfactual is *modal* – about what the laws *would have* been – not about what *is* or *can be* observed. **Verdict:** If they agree on all *actual* physically possible observations (RE holds), then this is **Serious Underdetermination**. Clause (revised b) likely *fails* only if the counterfactual difference implies a different ontology *for the actual world* (e.g., one needs a necessary being to fix the constant, the other doesn't). If the ontology for the actual world is identical, it's just a modal disagreement without observational consequence, and (b) might apply (interpretive shift). However, if the theories embed the constant within larger structures that *would* behave differently ontologically under the counterfactual, even if observationally identical *actually*, it might satisfy (revised b). This is subtle, but generally, pure counterfactual disagreement without actual ontological difference points towards *not* satisfying (revised b) – it's arguably an interpretive difference. **Tentative Verdict:** Likely **Not Seriously Underdetermined** (Clause revised b fails - interpretive modal difference). If pressed, the safer ground is RE holds + (c) fails + (revised b) *doesn't clearly apply*, so **Serious Underdetermination** is arguable but weak.

  3.  **Two canceling fields vs. one:**
      *   **Verdict: Not Seriously Underdetermined. Clause (revised b) fails.** This is precisely the addition of items (the second field and the mechanism enforcing perfect, universal cancellation) whose net contribution is fixed at zero. It adds no new causal powers, no new observable consequences under any conditions. It's a gratuitous ontological multiplication. The theories are notational variants regarding the observable world; one just has redundant structure. Clause (a) holds (RE), but (revised b) excludes this.

  **Structural Realism (SR):**

  Your group member is partially right, but SR doesn't "answer everything"; it offers a specific *attitude* towards underdetermination.

  *   **Core SR Claim:** We should be realist about the *structure* of the world (captured by the mathematical equations, relations, invariances of our best theories) and agnostic or anti-realist about the *nature* of the underlying entities filling that structure.
  *   **Applied to Your Cases:**
      *   **(v) Newton + Fudge:** SR says: Believe the structural/core Newtonian relations (inverse square law dominance) evident in the data we have. Withhold belief on the specific values of the fudge parameters until structurally constrained. It *manages* the practical underdetermination by focusing on the stable structural content.
      *   **(vi) Pilot-Wave vs. Everett:** **This is SR's biggest challenge.** What is the shared structure? The empirical predictions (Born rule statistics) are shared, but the *causal/ontic structure* differs profoundly:
          *   Pilot-Wave: Particles have definite trajectories causally guided by a wave in 3D space.
          *   Everett: No particles, only a universal wave evolving deterministically in a high-D space, with branching.
          The mathematical structures used to *calculate* predictions differ significantly. SR faces the "logical problem": If the rivals genuinely disagree about structure (causal relations, state space), what shared structure is there to be realist about beyond the bare probability assignments? SR often retreats to the structure of the *predictions* (the Born rule) or the abstract Hilbert space formalism. This feels like "relabelling the difficulty" – the deep ontological disagreement remains untouched. SR doesn't resolve the underdetermination here; it chooses agnosticism about the competing ontologies, potentially downplaying the significance of their structural differences.
      *   **(viii) Cosmology:** SR says: Believe the structure *within our observable patch* (as described by the successful model). Withhold belief about the global structure beyond the horizon. This aligns perfectly with your intuition that there's a fact of the matter but we can't know it. SR provides a principled reason for restricting realism to the accessible structure. It "delivers" a sensible epistemic attitude here.

  **Final Summary & Position:**

  *   **Your Verdicts:** Largely correct. Overturn/Refine (iii) to Not Seriously Underdetermined (Interpretive), and (viii) to Practically Underdetermined (not Robustly Equivalent).
  *   **Your Principle:** Excellent core idea. Needed strengthening Clause (b) to address interpretive unease (iii) and adding the Practical/Serious distinction to handle (v), (viii), (ix).
  *   **Unresolved Cases:**
      1.  Undetectable-by-own-laws Quantity: Not Seriously Underdetermined (RE fails - different physical possibilities).
      2.  Counterfactual Constant: Likely Not Seriously Underdetermined (Interpretive modal difference) or weakly Serious.
      3.  Canceling Fields: Not Seriously Underdetermined (Clause b fails - redundant ontology).
  *   **Structural Realism:** A useful tool, not a panacea. It helps manage practical underdetermination (v) and epistemic limitation (viii) by focusing on accessible structure. It stumbles badly on (vi), failing to engage with the depth of the ontological disagreement masked by predictive equivalence, often resorting to agnosticism about the competing structures themselves. It doesn't resolve the core difficulty of serious underdetermination; it proposes a specific way of living with it.

  The deepest underdetermination (vi, ix) arises when theories are robustly equivalent, fundamentally different in their proposed ontology and causal structure (failing revised b), non-parasitic (failing c), yet agree on every physical event in the universe. Here, evidence *is* exhausted. Your physicist's realism might chafe at this, but the principle, revised, identifies these as the genuine philosophical puzzles. Your discomfort in (vi) is the sound instinct of a realist confronting a world where ontology might outrun empirical access *even in principle*. The principle doesn't solve it; it correctly diagnoses it.
