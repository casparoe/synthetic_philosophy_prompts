  Hmm, the core tension they describe is telling: constructivists reject excluded middle for infinite domains because uncomputable truths lack "mathematical knowledge" value, while classicists counter with conservativity results showing no practical risk for concrete statements. But then it escalates to meaning-theory - Dummett's manifestation argument versus classicist accusations of importing external linguistics.

  I notice the user's hypothesis leans toward "verbal dispute" but they're uneasy about dismissing meaning too quickly. Smart hesitation - that's exactly where the real meat is. The conservativity results create a false sense of security because they only cover arithmetic, while analysis and choice blow things up. And "true" means radically different things: for classicists it's about correspondence with platonic objects, for constructivists it's about verification procedures. 

  *scribbles mentally* The key is recognizing this isn't one disagreement but three nested ones: 
  First layer (practical): Does excluded middle risk false positives? (Mostly settled by conservativity) 
  Second layer (mathematical): Does this hold beyond arithmetic? (Open but formalizable) 
  Third layer (philosophical): What constitutes mathematical truth? (Bedrock intuition clash)

  Where the user might be wrong: Calling it "mostly verbal" undersells it. Even if we disambiguate "exists", the two sides still value different things - one cares about ontological furniture, the other about computational content. And the manifestation argument isn't just linguistics; it's about what counts as understanding math.

  Progress would mean: 
