answer: |-
  Below is a decision tree handout designed for your Moral Psychology seminar. The first tree helps students identify their personal stance on the guilt/shame debate based on concrete reactions to moral failings, avoiding overreliance on the act-versus-self contrast. The second tree explores whether cultures can deliberately cultivate guilt-dominant or shame-dominant moral ecologies. Both trees use plain language, focus on undergrad-accessible distinctions (e.g., what the emotion is "addressed to," available "exits," and institutional levers), and flag unresolved combinations or inseparable positions. 

  ---

  ### **Tree 1: What’s Your Stance on Guilt and Shame?**  
  *Answer based on your reactions to real or imagined moral failings (e.g., breaking a promise, ignoring someone in need, or acting against your values). Don’t overthink—go with your gut.*

  #### **Node 1: When you feel bad about a moral failing, what’s the FIRST thing you want to do?**  
  - **A.** Make things right with the person you hurt (e.g., apologize, fix what you broke).  
  - **B.** Hide or disappear so no one sees your failing (e.g., avoid the person, quit a project).  
  - **C.** Prove you’re not a bad person (e.g., remind yourself of your good deeds, double down on being better).  
  - **D.** Just sit with the feeling—it’s not about action, but about accepting something.  

  #### **Node 2A (from A): Is this need to “make things right” about repaying a debt, or about repairing your relationship?**  
  - **A1.** Repaying a debt: Once I’ve done my part (e.g., compensated them), I feel cleared.  
  - **A2.** Repairing the relationship: Even after I fix things, I still worry about whether they truly forgive me or trust me again.  

  #### **Node 2B (from B): Do you hide because you fear others’ judgment, or because you can’t stand seeing yourself this way?**  
  - **B1.** Fear others’ judgment: It’s about what people think of me now.  
  - **B2.** Can’t stand seeing myself: It’s about how I feel about who I am.  

  #### **Node 2C (from C): Does “proving you’re not bad” focus on balancing the books or rebuilding yourself?**  
  - **C1.** Balancing the books: I’ve done good things to offset the bad, so I’m even now.  
  - **C2.** Rebuilding yourself: I need to become a different person to move past this.  

  #### **Node 2D (from D): Does sitting with the feeling change how you see your moral status, or just fade with time?**  
  - **D1.** Changes my status: I’m marked by this, and it sticks with me.  
  - **D2.** Fades with time: It’s temporary—I don’t feel permanently altered.  

  #### **Leaves: Your Position**  
  1. **Guilt-Primacy**: You ended at A1.  
     - Core belief: Moral failures create debts owed to victims. Fixing the harm clears your slate.  
     - Why? Focused on specific acts/omissions, addressed to the victim, resolved by repair.  

  2. **Shame-Primacy**: You ended at B1 or B2.  
     - Core belief: Failings expose a flawed self. Your standing (with others or yourself) is damaged, and hiding is natural.  
     - Why? Addressed to an audience (B1) or internalized observer (B2), exit via withdrawal.  

  3. **Both Are Needed (Division of Labor)**: You had mixed paths (e.g., A + B, or A2 + C1).  
     - Core belief: Guilt handles harm-repair; shame handles self-improvement or social harmony. They’re separate tools.  
     - Why? Different reactions for different contexts (e.g., debt for acts, shame for traits).  

  4. **Rehabilitated Shame**: You ended at C2 or D1.  
     - Core belief: Shame isn’t toxic—it’s a catalyst for growth. It alerts you to misaligned values and fuels change.  
     - Why? Forward-looking, rebuilds the self, no quick exit (requires transformation).  

  5. **Deflationary View**: You ended at D2 or had inconsistent exits (e.g., A + D2).  
     - Core belief: Guilt/shame aren’t distinct. It’s one emotion: “moral pain” that varies by situation.  
     - Why? Feelings blur (e.g., shame after guilt, or guilt over unchosen traits).  

  6. **Rejectionist View**: You consistently rejected "debt" or "stain" (e.g., C1 used coldly, or D2 as relief).  
     - Core belief: Neither guilt nor shame is ideal. Prefer regret/remorse—sadness about the act without self-hate.  
     - Why? Exits like moral bookkeeping (C1) or passive fading (D2) avoid the “sting.”  

  #### **Notes on the Tree**  
  - **Inseparable Leaves**:  
    - Division of Labor vs. Rehabilitated Shame: If you see shame as *useful* for growth (not just withdrawal), the tree might route you to both. This reflects real debate—some see them as overlapping (e.g., "good shame" is part of division of labor).  
    - Deflationary vs. Rejectionist: If your emotions feel vague and you dislike both, the tree struggles to split them. Answer Node 2D to clarify: fading (Deflationary) vs. active rejection (Rejectionist).  
  - **Unexplored/Incoherent Combos**:  
    - Guilt-Primacy + Withdrawal (A + B): Rare. If you want to repair *but* hide, it may indicate shame "leaking" into guilt (incoherent for purists, but psychologically plausible).  
    - Shame-Primacy + Debt-Clearing (B + A1): Unattractive—you can’t "repay" a stain. Cultures differ here (e.g., ritual cleansings), but individuals often reject it.  
  - **Key Distinctions Used**:  
    - What the emotion is **addressed to** (victim, audience, self, or no one).  
    - **Exit strategy** (repair, withdrawal, self-rebuild, bookkeeping, or passivity).  
    - **Voluntariness** implied in nodes (e.g., Node 2B’s focus on unchosen traits).  

  ---

  ### **Tree 2: Can a Culture Choose Guilt or Shame?**  
  *Answer based on your view of social institutions (e.g., justice systems, workplaces, communities).*

  #### **Node 1: If a society makes sanctions public (e.g., shaming rituals, social media callouts), does that guarantee people feel shame?**  
  - **A.** Yes—public exposure inherently attacks your social standing.  
  - **B.** No—it depends on whether the person cares about that audience.  
  - **C.** Sometimes, but it often backfires (e.g., causes resentment, not moral growth).  

  #### **Node 2A (from A): Can public shaming be designed to avoid permanent stigma? (e.g., forgiveness ceremonies)**  
  - **A1.** Yes—if there’s a clear path to reacceptance, it’s “shame with an exit.”  
  - **A2.** No—once your reputation is stained, it sticks.  

  #### **Node 2B (from B): If people don’t care about the audience, will private sanctions (e.g., quiet fines, confession) induce guilt instead?**  
  - **B1.** Yes—guilt is internal, so privacy helps.  
  - **B2.** No—people might feel nothing if they reject the rules.  

  #### **Node 2C (from C): Does the backfiring happen because institutions can’t control how emotions are felt?**  
  - **C1.** Yes—emotions are personal; institutions only set the stage.  
  - **C2.** Partly—but clever design can reduce leakage (e.g., avoid moralizing traits).  

  #### **Leaves: Your Position**  
  1. **Yes, Choose Shame-Dominant**: You ended at A1 or A2.  
     - Core belief: Cultures can engineer shame via public, audience-focused sanctions (e.g., community courts). Stigma can be temporary (A1) or permanent (A2).  

  2. **Yes, Choose Guilt-Dominant**: You ended at B1.  
     - Core belief: Cultures can foster guilt with private, victim-focused systems (e.g., restorative justice). Relies on internalizing norms.  

  3. **No, It’s a Side-Effect**: You ended at B2, C1, or A2 (if chosen for permanence).  
     - Core belief: Guilt/shame depends on personal psychology or social ties—institutions can’t steer it directly.  

  4. **Try, But Expect Leakage**: You ended at C2 or had mixed answers.  
     - Core belief: Cultures can *try* to choose, but guilt/shame often bleed together (e.g., guilt-sanctions cause shame; shame-sanctions fail if unshared values).  

  #### **Notes on the Tree**  
  - **Inseparable Leaves**:  
    - Try, But Expect Leakage vs. No, It’s a Side-Effect: If you think leakage is inevitable (C1), it collapses into "side-effect." Node 2C clarifies: C2 is optimistic about design; C1 is skeptical.  
  - **Key Distinctions Used**:  
    - **Public vs. private sanctions** (exposure level).  
    - **Audience relevance** (does the agent identify with the community?).  
    - **Framing of wrongdoing** (debt vs. stain in Nodes 2A/2B).  
    - **Exit availability** (e.g., Node 2A’s path to redemption).  
  - **Leakage Worry**: Built into all nodes (e.g., A and B address misfires; C centers on backfiring).  

