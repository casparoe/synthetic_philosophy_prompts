answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications—prioritizing conceptual clarity, evidence-based reasoning, and avoidance of clichéd examples.

  ---

  ### **Exam Question: Path Dependence in Riverdale and Valleyford**
  **Time Allowed:** 45 minutes  
  **Word Guide:** 500–700 words  

  #### **Scenario:**
  > Riverdale and Valleyford are neighboring river valleys with identical geography, resources, and initial populations. In 1750, a chance event occurs: in Riverdale, a timber cart crashes during a storm, blocking the planned mill site on the *east* bank. The mill is built on the *west* bank instead. In Valleyford, no accident occurs; the mill is built on the *east* bank as intended.  
  >   
  > By 1850, Riverdale’s west bank has a thriving port city (Westport), while Valleyford’s east bank remains farmland. Historians argue this divergence is due to **path dependence**: the cart accident triggered a cascade of decisions (e.g., roads built to serve the west-bank mill, attracting traders, then railways) that "locked in" Westport’s growth.  

  #### **Question:**  
  Evaluate whether the Riverdale/Valleyford case supports the claim that history is **"locked in" by early accidents**. In your response:  
  1. Distinguish **lock-in** from three related concepts: **fragility**, **functional redundancy**, and **erasure**.  
  2. Explain what evidence would be needed to prove "lock-in" *without* the ability to re-run history.  
  3. Assess whether it matters if the *origin story* of a path (e.g., the "Roman cart axle" myth for railway gauges) is historically inaccurate.  

  ---

  ### **Model Answer (Strong Student Level, ~700 words)**  

  The Riverdale/Valleyford case illustrates core ideas of path dependence, but proving "lock-in" demands careful scrutiny of evidence and conceptual distinctions. **Lock-in** occurs when switching from an established path becomes prohibitively costly, making the outcome resilient to change (e.g., Westport’s dominance persists even if the east bank later proves superior). This differs from:  
  - **Fragility**: Small changes in initial conditions lead to vastly different outcomes (e.g., the cart accident *diverted* development). Lock-in concerns *present* inflexibility, not past sensitivity.  
  - **Functional redundancy**: Alternative paths could have achieved similar outcomes (e.g., Valleyford’s farmland might be as economically efficient as Westport via other industries). Lock-in assumes the *current* state is suboptimal but entrenched.  
  - **Erasure**: Traces of the path’s origins fade (e.g., Riverdale’s cart accident is forgotten; Westport’s success seems "inevitable"). Lock-in persists even when origins are obscured.  

  **Proving lock-in without counterfactuals** requires three lines of evidence:  
  1. **Increasing returns**: Early advantages should amplify over time. In Riverdale, evidence might show the west bank’s mill attracting ancillary industries (e.g., shipbuilding), creating networks that reward further investment. Valleyford should lack comparable feedback loops.  
  2. **Failed attempts to shift paths**: If east-bank advocates in Riverdale proposed bridges or ports but were thwarted by costs/vested interests, this suggests active lock-in. Valleyford’s lack of urban development despite *similar proposals* would reinforce this.  
  3. **Suboptimal persistence**: Proof that Westport’s location is inefficient *now* (e.g., geographic surveys showing the east bank has better flood control) but persists due to sunk costs (e.g., existing infrastructure).  

  The **historical accuracy of origin stories** (e.g., the Roman cart axle myth) is irrelevant to lock-in *if* the mechanism is real. Railway gauges *are* locked in by network effects (standardization reduces costs for all users), regardless of whether Romans influenced axle widths. However, false origin stories risk confusing **erasure** (lost context) with **functional redundancy** (assuming alternatives were equally viable). In Riverdale, if historians wrongly attribute the mill site to "superior west-bank soil," they might overlook path dependence entirely.  

  **Crucially, scholars debate whether lock-in is inevitable**:  
  - Proponents (e.g., Paul David) argue increasing returns create "stable equilibria" resistant to change.  
  - Critics (e.g., Stan Liebowitz) contend outcomes often reflect efficiency, not accidents; "lock-in" may be overstated if alternatives are costlier *for valid reasons* (e.g., Valleyford’s soil suits agriculture better).  
  - The keyboard case (QWERTY) is contested: while its origin was accidental, studies disagree on whether it’s truly inefficient *today* given typing skill investments.  

  Thus, Riverdale/Valleyford *suggests* lock-in only if evidence shows: (1) Westport’s location is suboptimal, (2) change was attempted but failed due to cumulative costs, and (3) Valleyford confirms viable alternatives existed. Without this, the divergence may reflect fragility or hidden efficiencies—not irreversible lock-in.  

  ---

  ### **Marking Scheme (Total: 20 marks)**  
  | **Criteria**                                                                 | **Marks** | **Common Errors**                                                                 |
  |-----------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------|
  | **1. Distinguishes all 4 concepts clearly** (lock-in, fragility, redundancy, erasure) | 4         | Conflating lock-in with fragility (e.g., "the accident locked in the path"); misdefining redundancy as "the outcome was random." |  
  | **2. Identifies valid evidence for lock-in** (no counterfactuals needed):<br> - Increasing returns/networks<br> - Failed attempts to change<br> - Proof of suboptimality | 6         | Vague appeals to "history can’t repeat" without alternatives; assuming divergence *implies* lock-in. |  
  | **3. Analyzes origin-story inaccuracy** (e.g., Roman carts):<br> - Separates mechanism from origin<br> - Notes risk of erasure/redundancy confusion | 3         | Claiming false origins "disprove" path dependence; ignoring that lock-in can operate post-origin. |  
  | **4. Engages with scholarly debates**:<br> - Acknowledges lock-in is contested (e.g., efficiency vs. accident)<br> - Flags keyboard/QWERTY ambiguities | 4         | Presenting lock-in as undisputed fact; unaware of QWERTY critiques. |  
  | **5. Structure & clarity**: Logical flow; precise terminology; stays case-focused.          | 3         | Over-reliance on real-world examples; meandering arguments. |  

  ---

  ### **Key Design Notes**  
  1. **Avoiding canned examples**: The fictional case forces engagement with mechanics, not memorized stories.  
  2. **Evidence focus**: Students must articulate how to test lock-in empirically (e.g., suboptimality + failed change attempts).  
  3. **Debates highlighted**: Model answer explicitly flags contested claims (e.g., "scholars debate whether lock-in is inevitable").  
  4. **Roman cart handled**: Marking scheme rewards noting that *mechanism* validity is independent of origin-story accuracy (but penalizes overgeneralization).  
  5. **Erasure vs. redundancy**: These are separated—erasure masks origins; redundancy questions if the outcome *required* the path.  

  This question rewards deep conceptual understanding while penalizing superficial "storytelling." It also mirrors real historiographical disputes, preparing students for advanced study.
