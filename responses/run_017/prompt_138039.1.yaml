prompt: |-
  I work in assessment design for professional certification, and over the years I have noticed a pattern I have no name for. It does not seem to be quite the thing people usually mean when they say a signal is trustworthy because it would be expensive to fake.

  The pattern appears wherever judgment is made on the spot rather than on a submitted artifact. A singer who sounds flawless on the recording is asked to sing it again unaccompanied, slower, in a different key. A candidate submits a polished written case study, and the examiner instead asks for a second one, from a different domain, with ten minutes' notice. An applicant tells a well-shaped story about a difficulty they handled; the interviewer asks what the other person in the story said next, and then what happened three weeks later. In each case the performance itself costs the strong candidate almost nothing: producing one more instance is not expensive for them in the way an elaborate display is expensive. What seems to do the work is that the weaker candidate cannot produce an *arbitrary* instance, or cannot produce one that hangs together with the one they just produced. They can produce the one they prepared.

  Three features strike me as odd, and they are why I suspect this is not merely the expensive-signal story in different clothing. First, the credibility seems to sit on the receiver's side: the examiner chooses which variation to demand, and the reliability appears to depend on that choice being unconstrained and not fully predictable in advance. Second, when a format becomes well known — when the follow-up questions are published, or the oral exam acquires a stable question bank — the format stops discriminating, even though nothing about the candidates has changed and nothing they do has become cheaper. An expensive display does not seem to lose its force merely from being anticipated. Third, when examiners want more confidence they often add a difficulty: less time, a worse instrument, an unfamiliar key. The costliness is imposed by the receiver at the moment of testing rather than borne by the signaler in producing the display.

  So, concretely, what I want is this. Is there an established concept for reliability of this kind — reliability arising from the receiver's capacity to demand unprepared variation rather than from the signaler's expenditure — and is it treated as a mechanism in its own right or as a special case of the cost-based one? If a special case, I would like to know what the cost is a cost *of*, given that the marginal instance looks free to both parties. If distinct, what are its boundary conditions: does it collapse once a candidate can invest once in a large enough stock of prepared variants; does it require the space of possible demands to be open-ended; does it require the demand to be unpredictable, and if so is that a different requirement from the other two? And what should we say about the reverse case, where those best at the underlying skill are systematically worst at producing it on demand — a strong writer who freezes in an oral defence, a performer whose best work is heavily revised rather than spontaneous? That last case matters to me professionally, and I have no vocabulary for what goes wrong in it.

  A label alone will not help me. I need the carving: what exactly this phenomenon is, which nearby notions it is liable to be confused with, how it differs from each, and where precisely it stops working. If no established term exists, please propose one, with a definition and the boundary cases it is meant to settle.
reasoning: |-
  Okay, the user works in assessment design for professional certification and has noticed a pattern they can't name. They describe situations where judgment is made on the spot, like asking a singer to perform unaccompanied or an applicant to recount unexpected details from a story. The key is that strong candidates can handle these variations easily, while weaker ones can't produce arbitrary instances. 

  The user points out three odd features: credibility relies on the receiver's choice of variation, it loses effectiveness when the format becomes predictable, and examiners add difficulties like less time. They want to know if there's an established concept for this, how it relates to costly signaling, and its boundaries. They also mention cases where skilled people struggle with on-demand performance.

  First, I need to recall concepts in signaling, assessment, and cognitive psychology. Costly signaling theory comes to mind, but the user says it doesn't fit because the marginal cost for a strong candidate is low. The receiver imposing constraints is key. Maybe this is about the verifiability of signals or probe resistance. 

  The unpredictability aspect reminds me of commitment problems in game theory or adversarial testing. When the format becomes known, candidates prepare, reducing discrimination. That's different from traditional costly signals, which remain effective even if anticipated. 

  For the reverse case—skilled people freezing under pressure—it could relate to anxiety or processing speed differences. High achievers might rely on deliberation, which clashes with spontaneous demands. Terms like "processing fluency" or "cognitive load" might apply. 

  I should check if terms like "variational competence" or "adversarial validation" exist. "Probe resistance" sounds close, emphasizing the ability to withstand unscripted challenges. The mechanism here is different from costly signaling; it's about the breadth and flexibility of skill versus narrow preparation. 

  Boundary conditions: if the domain is closed (limited variations), candidates can prepare exhaustively. Open-ended domains prevent this. Also, unpredictability is crucial to prevent gaming. The reverse case highlights that the assessment must match the skill's nature; otherwise, it penalizes valid expertise. 

  The user needs a clear distinction from related concepts. They might be conflating this with general reliability or costliness. Naming it "unpredictable adversarial probing" or "generalization under constraint" could help. But "Probe Resistance" as a new term might encapsulate the idea best. 

  Professionally, the user needs to design assessments that avoid penalizing deliberate thinkers. They need terminology to advocate for appropriate methods. Their deeper need is validating diverse expertise without bias toward spontaneous performers.
answer: |-
  Based on your detailed description, the phenomenon you're observing **is distinct from classic costly signaling theory** and deserves its own conceptual framing. It's a nuanced mechanism centered on **verification through unpredictable demand for generative capability**, rather than cost as a barrier to deception.

  Here's the conceptual carving you requested:

  1.  **Core Mechanism & Name:**
      *   **Proposed Term:** **Probe Resistance** (or **Adversarial Validation via Generative Sampling**)
      *   **Definition:** *The reliability of an assessment signal derived from the receiver's capacity to make unpredictable, constrained demands for additional, contextually coherent instances of a skill or knowledge application during the assessment event itself, testing the breadth, depth, and flexibility of the underlying competence beyond rehearsed artifacts or scripts. The signal's validity hinges on the candidate's ability to generate valid responses *on-demand* under these adversarial constraints.*
      *   **Core Mechanism:** The examiner acts as an "adversarial sampler," probing the *generative space* of the candidate's competence. A strong candidate possesses a rich, interconnected, and flexible internal model of the domain, allowing them to generate coherent, valid outputs for a wide range of prompts within the domain constraints. A weak candidate has a sparse, rigid, or fragmented model, limiting their generation to specific rehearsed points or unable to maintain coherence under variation.

  2.  **Distinction from Costly Signaling:**
      *   **Costly Signaling (Zahavian):** Reliability comes from the *intrinsic cost* (energy, time, resources, risk) of producing the signal, making it too expensive for low-quality individuals to fake. The cost is borne by the *signaler* in producing the *specific display*. Anticipation doesn't necessarily weaken it (e.g., a peacock's tail is still costly even if expected).
      *   **Probe Resistance:** Reliability comes from the *receiver's ability to choose the probe* and the *signaler's ability to generate valid variations instantly*. The "cost" isn't primarily resource expenditure for the *instance* (though time pressure adds some), but the *cognitive cost of maintaining broad, flexible competence* vs. narrow preparation. The critical cost for the weak candidate is the **cost of breadth and flexibility** – developing a genuinely deep, interconnected understanding applicable in diverse contexts is far more cognitively expensive than memorizing specific scripts or artifacts. **Anticipation destroys its power** because it allows narrow preparation.

  3.  **Key Features Explained:**
      *   **Receiver-Side Credibility:** The validity *depends* on the examiner's freedom to choose an unpredictable probe. This prevents gaming through exhaustive preparation of known variations.
      *   **Loss of Discrimination with Predictability:** When probes become predictable, candidates invest in preparing *those specific variations*, collapsing the "generative space" test back into a test of specific preparation. The underlying competence hasn't changed, but the assessment no longer accesses its breadth/flexibility.
      *   **Added Difficulty (Time, Constraints):** This increases the "adversarial" nature. Less time reduces the ability to construct a response from first principles or recall a rehearsed script not perfectly matched to the probe. Unfamiliar contexts force reliance on fundamental understanding. This increases the *cognitive load*, making it harder to mask a lack of genuine flexibility.

  4.  **Boundary Conditions & When it Fails:**
      *   **Exhaustible Domain:** If the space of possible probes is small and known (e.g., only 3 possible follow-up questions), a candidate *can* invest once in preparing all variants. Probe Resistance requires an **effectively open-ended or very high-dimensional probe space** relative to practical preparation time.
      *   **Predictability:** As you observe, **unpredictability is essential**. If the candidate knows the *exact type* or *specific instances* of probes likely to be used, they can prepare narrowly.
      *   **Irrelevant Probes:** Probes must be **valid demands within the assessed competence domain**. Asking a singer about quantum physics doesn't test singing competence. Poorly chosen probes create noise, not signal.
      *   **Skill Mismatch:** The assessment must demand skills *congruent* with the underlying competence. Oral defense inherently favors oral fluency; written case study favors written composition. This leads to the "reverse case."
      *   **The Reverse Case (Skillful but Spontaneity-Impaired):**
          *   **What Goes Wrong:** This is a **validity error** where the *assessment method* (demanding spontaneous, on-the-spot generation under pressure) fails to capture the *actual competence* (which may manifest best through deliberation, revision, or specific modalities). The problem isn't with the candidate's core skill, but with the assessment imposing an incompatible performance constraint.
          *   **Mechanism:** Skills like deep analytical writing, complex problem-solving requiring iteration, or performance requiring specific conditions (e.g., musical interpretation needing warm-up, specific acoustics) may depend heavily on **extended cognitive processing, revision, or environmental factors** that are disrupted by high-pressure, spontaneous demands. Anxiety or differences in **cognitive processing speed/style** become confounding factors.
          *   **Relation to Probe Resistance:** Probe Resistance *assumes* that the ability to generate coherent variations spontaneously is a valid indicator of the underlying competence. **If spontaneous generation *isn't* a core requirement of the target competence, then Probe Resistance is an invalid assessment method for that specific skill.** Your example highlights the critical need for **construct-aligned assessment design**. Probe Resistance is excellent for skills *defined* by adaptability and spontaneous application (e.g., clinical diagnosis, live negotiation, improvisation) but poor for skills defined by depth achieved through iteration and reflection (e.g., strategic planning, complex technical writing, meticulous craftsmanship).

  5.  **Nearby Concepts & Distinctions:**
      *   **Authentic Assessment:** Probe Resistance is a specific *tactic within* authentic assessment, focusing on the *unpredictable demand* aspect to force authenticity beyond prepared artifacts.
      *   **Performance Assessment:** Probe Resistance is a specific *type* of performance assessment emphasizing *variation under constraint* during the assessment event.
      *   **Dynamic Assessment:** Shares the interactive, examiner-driven aspect, but Dynamic Assessment focuses on learning potential (e.g., how much help is needed to improve). Probe Resistance focuses solely on verifying current breadth/flexibility of competence.
      *   **Stress Testing:** Probe Resistance uses adversarial probes as a stress test for *competence breadth/flexibility*, not necessarily for emotional resilience (though that can be a side effect).
      *   **Gameability/Cheat Resistance:** Probe Resistance is primarily motivated by *resistance to gameability via prepared scripts/artifacts*, which is a subset of cheat resistance.
      *   **Cognitive Flexibility:** Probe Resistance directly *operationalizes and tests* cognitive flexibility within the specific domain.

  **Summary & Implications for Your Work:**

  *   **Phenomenon:** You've identified **Probe Resistance** – a signal reliability mechanism based on adversarial sampling of a candidate's generative competence space.
  *   **Key:** Validity depends on **examiner unpredictability** and a **probe space too large to pre-memorize**, forcing reliance on genuine understanding/flexibility. The "cost" is the **opportunity cost of developing narrow vs. broad competence**.
  *   **Boundaries:** Breaks down with predictable formats, exhaustible probe spaces, or irrelevant/invalid probes.
  *   **Reverse Case:** Highlights the **paramount importance of construct alignment**. Probe Resistance is valid *only if* spontaneous, flexible generation under unpredictable constraint is a core component of the target competence. If the core competence manifests differently (e.g., through revision), forcing it into a Probe Resistance format creates a **validity threat** by introducing construct-irrelevant variance (e.g., anxiety, processing speed).

  **Recommendation for Assessment Design:**

  1.  **Define the Construct Rigorously:** Is spontaneous, flexible generation *on-demand* a core requirement? If yes, Probe Resistance is powerful. If the competence is best shown through deliberation/revision, use alternative methods (e.g., portfolio with viva on process, staged simulations with reflection time).
  2.  **Maintain Unpredictability:** Structure exams so specific probes cannot be anticipated (e.g., large question banks with random selection, examiner freedom to follow tangents based on responses, scenario variations). Avoid publishing exact formats.
  3.  **Design Valid Probes:** Ensure follow-ups genuinely test domain-relevant knowledge/skill connections and coherence, not trivia or unrelated topics.
  4.  **Use Constraints Judiciously:** Time pressure or contextual shifts can enhance the test of flexibility, but be mindful they don't become the *primary* barrier for valid candidates whose core competence is strong but processing is slower.
  5.  **Mitigate the Reverse Case:** For competences involving deliberation, incorporate elements allowing for it (e.g., preparation time *during* the assessment for a mini-case, allowing notes, focusing probes on *reasoning* behind past work rather than instant recall of details). Acknowledge that freezing might indicate assessment anxiety, not lack of competence, and design to minimize this where possible.

  By conceptualizing this as **Probe Resistance**, you gain a specific framework to design, justify, and critique assessment methods that rely on this powerful, yet context-dependent, mechanism for verifying the depth and adaptability of professional competence.
