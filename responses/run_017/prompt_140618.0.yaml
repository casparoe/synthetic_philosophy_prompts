  We are writing a research proposal for a 9-month master's thesis in a philosophy-and-economics program. The project will be about 12,000 words and include a small simulation component that serves the conceptual argument.

  The core idea is to extend the classic sequential herding model by introducing a mixed population of two types of agents:
  1. "Sophisticates" who update correctly (Bayesian) and are aware that predecessors may be herding (i.e., they account for the possibility that previous actions are not independent signals).
  2. "Naives" (or "double-counters") who mistakenly treat each observed action as an independent signal (thus counting the same piece of information multiple times).

  The main research question is: How does the presence of naive agents (who double-count) affect the fragility of information cascades? Specifically, we hypothesize that even a modest fraction of naives makes wrong cascades more stable and that standard policy interventions (like releasing public information) might backfire because naives amplify the cascade.

  Additionally, we consider an extension where sophisticates are uncertain about the fraction of naives (only knowing a distribution) and how this uncertainty might restore some fragility.

  The proposal must include:
  - A precise research question.
  - Why existing models don't address this.
  - Why model naivete as double-counting (and not via other alternatives).
  - A month-by-month plan, including simulation details and early checks for observational equivalence.
  - What a good outcome looks like and what would make it a non-result.
  - A section on the explanatory implications for phenomena like bank runs and fads.

  Let's structure the proposal accordingly.

  ---

  **Research Proposal: The Fragility of Herding Cascades with Naive Agents**

  **1. Introduction and Research Question**

  In the classic sequential herding model (Bikhchandani, Hirshleifer, and Welch, 1992), individuals make a binary decision in sequence, each receiving a private signal (accurate with probability q > 0.5) and observing all prior actions. A key result is that information cascades emerge: after a few initial identical choices, individuals ignore their private signals and follow the herd. These cascades are known to be both fragile (easily broken by a small amount of new public information) and potentially wrong (with positive probability). However, the model assumes that all agents are fully rational and understand the possibility of herding.

  In reality, individuals often interpret observed actions as independent evidence, leading them to become more confident in the herd's direction as the cascade grows. This project introduces a mixed population of "sophisticated" agents (who update correctly, accounting for herding) and "naive" agents (who treat each observed action as an independent signal, thus double-counting). We ask:

  *What is the impact of naive agents (who double-count) on the stability of information cascades? Specifically, how does their presence affect: (a) the probability that a wrong cascade forms, (b) the fragility of cascades to public information, and (c) the effectiveness of standard interventions (e.g., releasing a public signal)?*

  We further ask: *If sophisticated agents are uncertain about the proportion of naive agents (knowing only a distribution), how does this uncertainty affect cascade fragility?*

  **2. Why Existing Models Do Not Settle the Question**

  The canonical herding model assumes homogeneous, rational agents. While extensions have considered heterogeneous preferences, signal qualities, and network structures, none have systematically examined agents who misinterpret the informational content of prior actions by treating them as independent. 

  The standard model's fragility result relies critically on rational agents recognizing that a long sequence of identical actions may reflect a cascade (and thus contain little new information). If some agents naively treat each action as a fresh signal, they will over-weight the herd and become more entrenched. This behavior is not captured by simply lowering signal accuracy (q) because that would uniformly reduce the informativeness of all signals, whereas naives' double-counting leads to a non-linear accumulation of confidence in the herd. Similarly, adding a direct taste for conformity (as in some behavioral models) does not capture the mistaken belief about information independence.

  Moreover, the literature on "quasi-Bayesian" agents (e.g., in the social learning literature) typically assumes that agents are aware of the possibility of herding but may have cognitive limitations. Our naive agents, by contrast, are unaware of the herding possibility and thus fundamentally misinterpret the information structure. This distinction matters for the model's explanatory power when applied to real-world phenomena.

  **3. Modelling Naivete as Double-Counting: Justification and Alternatives**

  We model naivete as the failure to account for the dependency in others' actions. A naive agent treats each observed action as if it were generated by a new private signal (with the same accuracy q), thereby counting the same underlying information multiple times. This leads to an overestimation of the herd's informational strength.

  *Why this approach?*
  - **Psychological Plausibility**: There is evidence from cognitive psychology that people often neglect conditional dependencies in sequential data (e.g., the "gambler's fallacy" or "hot-hand fallacy").
  - **Phenomenological Fit**: In real herding events (e.g., financial bubbles, social media trends), participants often cite the number of adherents as independent confirmation, not discounting for potential herding.
  - **Theoretical Distinction**: As noted, this is not equivalent to lowering q. A sophisticated agent with a low q still correctly accounts for dependencies. Similarly, adding a conformity preference would shift incentives but not beliefs about the state of the world.

  *Alternatives Considered and Rejected:*
  - **Lowering Signal Accuracy (q)**: This would reduce the quality of all signals uniformly, but our naives have accurate private signals; their error lies in over-interpreting public actions. Moreover, this would not produce the increasing over-confidence we aim to capture.
  - **Conformity Preferences**: While realistic, this would not explain why agents become more confident (rather than just more compliant). Our focus is on belief formation, not utility.
  - **Lab Experiments**: While valuable, they would not allow us to isolate the specific mechanism of double-counting in a controlled theoretical environment. Our simulation will provide clear causal pathways.

  **4. Research Plan: Month-by-Month**

  *Total Duration: 9 months*

  - **Months 1-2: Literature Review and Model Specification**
    - Deep dive into herding models, social learning, and related behavioral economics.
    - Formalize the model: binary state of the world (ω ∈ {0,1}), sequence of agents (i=1,2,...,N), each receives private signal (s_i, P(s_i=ω)=q), and observes history of actions (a_1,...,a_{i-1}). 
    - Define agent types: Sophisticates (Bayesian updaters who account for herding) and Naives (treat each prior action as an independent signal, then combine with their own signal via Bayesian updating as if all are independent).
    - Determine parameters: q (signal accuracy), p (prior belief), f (fraction of naives), and N (number of agents).

  - **Month 3: Analytical Exploration and Early Checks for Observational Equivalence**
    - Analyze small sequences (e.g., up to 5 agents) to derive closed-form conditions for cascade formation and fragility.
    - **Key Check for Observational Equivalence**: Test whether the behavior of a naive agent can be replicated by a sophisticated agent with a lower q. We will:
        (a) Compare the belief trajectories of naives vs. sophisticates with varying q.
        (b) Check if there exists a q' < q such that a sophisticated agent with q' mimics a naive with q. (We suspect not, because naives' beliefs grow faster than any sophisticated agent's due to double-counting.)
        (c) Run simulations for short sequences (N=10) and regress actions on signal history to see if the naive type can be distinguished from a sophisticated type with adjusted q.

  - **Months 4-5: Simulation Development and Testing**
    - Build a simulation in Python/R to model large sequences (N=100+). Each run: fix ω, f, q; draw agent types; generate signals; agents choose actions sequentially.
    - Metrics: 
        - Cascade probability (when agents start ignoring signals).
        - Wrong cascade probability (cascade on wrong state).
        - Fragility: After a cascade forms, introduce a public signal (accuracy r) and measure how often it breaks the cascade.
    - Vary f (0% to 100% naives) and r (public signal strength).

  - **Month 6: Simulation Runs and Analysis**
    - Run simulations across parameter space (q ∈ [0.5,0.9], f ∈ [0,1], r ∈ [0.5,0.9]).
    - Test hypotheses: 
        H1: As f increases, wrong cascades become more likely and more stable (less fragile to public signals).
        H2: Interventions (public signals) may backfire when f is high: naives incorporate the public signal as an additional "independent" data point, amplifying the cascade.

  - **Month 7: Extension to Uncertainty about f**
    - Sophisticates now have a prior distribution over f (e.g., uniform over [0,1]). They update their beliefs about f based on the history of actions (using Bayes' rule). 
    - Simulate how this uncertainty affects fragility. We expect that a long cascade might lead sophisticates to infer a high f (and thus become less likely to break the cascade) but that a public signal might change beliefs about f, restoring fragility.

  - **Month 8: Conceptual Analysis and Explanatory Implications**
    - Reflect on results: What do they imply for the explanatory power of herding models in phenomena like bank runs or cultural fads?
    - Argument: If real-world agents include naives, then cascades in these events may be more stable and less amenable to standard interventions. This challenges the rational-agent foundation of the canonical model and suggests that successful explanations must account for agent naivete.

  - **Month 9: Writing and Synthesis**
    - Draft thesis (12,000 words). Integrate simulation results with conceptual discussion.
    - Highlight implications for policy (e.g., when releasing public information might backfire) and for the philosophy of economics (the role of idealization in explanatory models).

  **5. What Constitutes a Good Outcome**

  - **Theoretical Contribution**: We demonstrate that even a small fraction of naives (e.g., f=0.2) substantially increases the stability of wrong cascades and can cause public information to backfire. 
  - **Simulation Evidence**: We show that the naive type is not observationally equivalent to a sophisticated type with a lower q (via distinct belief paths and fragility patterns).
  - **Conceptual Payoff**: We argue that the presence of naives challenges the canonical model's application to real events. If the model requires agents to be more sophisticated than real people, its explanatory value may be limited unless extended (as we propose).

  **6. Risks and Non-Results**

  - **Observational Equivalence**: If naives' behavior can be replicated by sophisticates with a lower q (or by adding noise), the thesis contribution collapses. *Mitigation*: We test this in Month 3 with small-N analytics and simulations. If equivalence holds, we pivot to study the epistemic implications of mis-specified models (but this is less novel).
  - **Trivial Results**: If naives always dominate (making cascades infinitely stable) or have no effect (if f is small), the results may be uninteresting. *Mitigation*: We focus on the non-linear effects of f and the backfiring of interventions.
  - **Overcomplication**: The uncertainty extension (over f) might be too complex for a master's thesis. *Contingency*: We will treat it as an optional section (Month 7) and drop it if time is short.

  **7. Conceptual Payoff: Explanation and Idealization**

  The cascade model is often invoked to explain phenomena by showing how rational agents could produce collective irrationality. But if real agents are less sophisticated than the model requires (and thus more prone to double-counting), then the model's explanation may be inadequate. We argue that:

  - If the phenomenon involves agents who double-count, the canonical model misrepresents the mechanism and may prescribe ineffective policies (e.g., releasing public information could backfire).
  - This raises a general question about idealization: When is it acceptable to assume agents are more rational than they are? We contend that models should be robust to realistic cognitive limitations, or else their explanatory scope is narrowed.

  This project thus contributes to the philosophy of economics by testing the limits of rational-choice explanations in social dynamics.

  ---

  **Proposal Summary**

  We propose to study the stability of herding cascades when some agents naively double-count the informational content of prior actions. Through simulation and analysis, we will show that this naivete makes wrong cascades more stable and can cause standard interventions to backfire. We also explore how uncertainty about the prevalence of naives affects fragility. The project integrates formal modelling with philosophical reflection on explanation in economics.
answer: |-
  ### Research Proposal: Herding Cascades with Naive Double-Counters—Stability, Fragility, and Explanatory Limits  

  ---

  #### **1. Core Research Question**  
  *Can the presence of agents who naively treat observed actions as independent signals ("double-counters") increase the stability of *wrong* information cascades and undermine standard policy interventions—even when such agents constitute a minority?*  

  This breaks into three testable sub-questions:  
  - **Stability**: Does a fraction \( f > 0 \) of naive agents reduce the fragility of cascades to new public information, relative to the rational-agent benchmark?  
  - **Intervention backfire**: Can releasing public information *strengthen* a wrong cascade when double-counters are present?  
  - **Uncertainty premium**: If sophisticated agents know only a distribution over \( f \) (not its true value), does this restore partial fragility by forcing latecomers to discount long herds?  

  The answer is determinate: Simulations will output cascade survival rates, error probabilities, and intervention efficacy under varying \( f \), with fragility quantified as the minimum public signal strength required to break a cascade.  

  ---

  #### **2. Why Existing Models Don't Answer This**  
  The canonical sequential herding model (BHW, 1992) assumes homogeneous rational agents who recognize that herds *deplete* the informational value of subsequent actions. This leads to three baseline results:  
  - Cascades form easily (after ~2–3 identical choices).  
  - Wrong cascades occur with probability \( >0 \) (increasing in signal noise).  
  - Cascades are fragile (e.g., a weak public signal shatters them).  

  **The gap**: The model’s fragility relies on agents understanding that predecessors *may be herding*. If some agents instead treat all actions as independent signals, they effectively "reload" the herd’s informational weight. Existing extensions (e.g., heterogeneous signal precisions, network structures, or conformity preferences) don’t capture this cognitive error. Crucially:  
  - **Rational models with bounded memory** reduce signal weight but don’t *amplify* cascades.  
  - **Conformity preferences** (e.g., payoff externalities) alter incentives but don’t distort belief updating.  
  - **Empirical lab studies** identify herd behavior but rarely isolate *why* (e.g., confusion vs. rational copying).  

  Our question remains open because no prior work combines *within-model heterogeneity* in cognitive processing (sophisticates vs. naives) with a test of cascade stability under interventions.  

  ---

  #### **3. Why Model Naiveté as Double-Counting? (And Not Alternatives)**  
  - **Double-counting as the focal mechanism**:  
    Naive agents believe each action reveals a *new* private signal (accuracy \( q \)), ignoring dependencies. This directly opposes the rational updater’s core insight—that long herds carry little marginal information. It also matches real-world reasoning: People often cite "10 experts did X" as 10 reasons (not 1 reason + 9 echoes).  
  - **Rejected alternatives**:  
    - **Lower \( q \) for all agents**: Reduces signal quality uniformly but doesn’t create *asymmetric* overconfidence in herds. A naive with high \( q \) becomes *more* entrenched in cascades than a low-\( q \) rational.  
    - **Conformity preferences**: Introduces payoff-driven herding but doesn’t explain why agents grow *confident* in erroneous beliefs (e.g., bank runs driven by panic vs. genuine belief in insolvency).  
    - **Lab experiments alone**: Could test for double-counting but wouldn’t isolate its systemic effects (e.g., backfiring interventions) or compare cleanly to rational benchmarks. Our simulation *grounds* future experiments.  
  - **Theoretical advantage**: Double-counting generates a testable signature—naives’ confidence *increases monotonically* with herd length, while rational agents’ confidence plateaus post-cascade.  

  ---

  #### **4. Month-by-Month Work Plan**  
  **Months 1–2: Model Specification & Analytical Foundations**  
  - Define sequence: Binary state \( \omega \sim \text{Uniform} \), agents \( i=1,2,\dots,N \) (\( N=100 \)).  
  - Signals: Private signal \( s_i \in \{L,H\} \) with \( P(s_i = \omega) = q > 0.5 \).  
  - Agent types:  
    - **Sophisticates**: Bayesian updaters; compute \( P(\omega | \text{history}, \text{types}) \).  
    - **Naives**: Treat each prior action \( a_j \) as independent signal with accuracy \( q \); combine via Bayes as if \( i.i.d \).  
  - Public signal: Exogenous \( s_{\text{pub}} \) (accuracy \( r \)) introduced mid-sequence.  
  - Metrics: Cascade formation rate, error rate, fragility threshold (min \( r \) to break cascade).  

  **Month 3: Observational Equivalence Check**  
  - *Test if "naive with q" ≡ "sophisticated with q′"*:  
    - Simulate short sequences (\( N=10 \)) with \( f=0 \) vs. \( f=1 \).  
    - Compare belief paths: For naives, log-belief-ratio \( \propto \) herd length; for sophisticates, it plateaus.  
    - Sweep \( q \) for sophisticates: No \( q' \) can mimic the naive’s *increasing* confidence.  
    - *Exit clause*: If equivalence holds (unlikely), pivot to epistemic game theory (e.g., "What if agents doubt others’ rationality?").  

  **Months 4–5: Simulation Development (Python)**  
  - Core simulation: 10,000 runs per parameter set (\( f \in [0,1], q \in \{0.6,0.7,0.8\}, r \in [0.5,0.9] \)).  
  - Track: Cascade formation, accuracy, survival post-public signal.  
  - Output: Fragility curves (cascade survival vs. \( r \)) by \( f \).  

  **Month 6: Hypothesis Testing**  
  - **H1** (Stability): Higher \( f \) → flatter fragility curves (e.g., 20% naives raise min \( r \) by 0.2).  
  - **H2** (Backfire): At high \( f \), weak \( s_{\text{pub}} \) *against* the herd amplifies naives’ confidence → cascade strengthens.  
  - **H3** (Uncertainty): Sophisticates with uniform prior over \( f \) exhibit mid-fragility (vs. known \( f \)).  

  **Month 7: Conceptual Analysis**  
  - Relate results to explanatory targets (bank runs, fads): If real agents include double-counters, cascades are "sticky" and interventions risky—undercutting the BHW policy toolkit.  

  **Months 8–9: Thesis Writing**  
  - Integrate simulation outputs with philosophy of explanation (see Section 7).  

  ---

  #### **5. Simulation Component: Necessity and Success Criteria**  
  - **Why simulate?** The model is analytically intractable past \( N=5 \) with heterogeneity. Simulation quantifies stability/backfire thresholds.  
  - **Success condition**: The simulation is "worth doing" if:  
    - It reveals non-linearities (e.g., \( f > 0.1 \) induces discontinuous stability jumps).  
    - It shows backfire (public signals *increasing* herd adherence for \( f > 0 \)).  
    - Fragility under sophisticated uncertainty differs materially from known-\( f \) cases.  
  - **Non-results**: If naives barely affect fragility (e.g., stability shifts only at \( f > 0.5 \)), the core thesis fails. Month 3 checks protect against this.  

  ---

  #### **6. Good Outcome vs. Non-Result**  
  - **Good outcome**:  
    - Wrong cascades stabilize at \( f \geq 0.2 \) (e.g., survive \( r = 0.7 \) public signals vs. \( r = 0.6 \) for \( f=0 \)).  
    - Public signals backfire for \( f > 0 \) (e.g., \( +10\% \) cascade adherence after weak contrary signal).  
    - Uncertainty restores partial fragility (e.g., unknown \( f \) halves stability effect of naives).  
  - **Non-result risks**:  
    - **Observational equivalence**: Double-counting reducible to lower \( q \) (Month 3 tests prevent this).  
    - **No backfire**: Public signals always weaken herds.  
    - **Irrelevance**: Naives’ impact negligible below \( f = 0.4 \).  
    - **Uncertainty adds nothing**: Sophisticates with unknown \( f \) behave like \( f=0 \) or \( f=1 \).  

  ---

  #### **7. Conceptual Payoff: Explanation and Idealization**  
  The BHW model explains collective errors via rational agents in informationally constrained settings. But if real-world herding (e.g., financial panics, conspiracy trends) involves agents who *double-count*, the model’s explanatory power faces two challenges:  
  - **Mechanistic mismatch**: The model posits sophisticated agents, but the phenomenon involves naives. This isn’t mere idealization—it misidentifies *why* herds persist.  
  - **Policy risks**: If "release more information" backfires with naives, BHW-derived interventions may exacerbate failures.  
  - **Philosophical implication**: Models that "explain by idealization" are defensible only if deviations (e.g., naiveté) don’t alter core predictions. Our thesis tests this: If stability/fragility patterns reverse, the BHW framework loses explanatory force for events where double-counting occurs.  

  ---

  ### **Summary**  
  This proposal asks how naive double-counters affect herding cascade stability, with simulations to quantify fragility thresholds and intervention risks. It challenges the canonical model’s explanatory adequacy when real agents misread social information—and tests whether sophisticated uncertainty can mitigate the problem. Success would recast policy design for herd-prone systems; failure defines the limits of naiveté in social learning.
