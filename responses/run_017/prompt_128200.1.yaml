prompt: |-
  Hey — I need something for the little reading group I run with two friends (one econ PhD, one ML person), and also, honestly, for an argument I keep losing.

  Last month I signed up for one of those commitment apps: you put up $200 and it goes to a charity you actively dislike if you don't log four gym sessions a week. My friend says this is just an admission that future-me will be irrational, and that a rational agent has no use for such things — you do what you have most reason to do at each moment and that's it. I said, what about Parfit's hitchhiker: the driver who takes you to town only if he predicts you'll pay him once you're there, at which point paying costs you and does nothing. Then we got completely stuck, because we couldn't agree on what the object of evaluation even is — the act of paying, the disposition to pay, or the earlier choice to acquire the disposition. And my ML friend kept insisting this has the same shape as an agent that removes its own off-switch or hides its reward function from itself, which I think is maybe right, but he thinks that settles it and I definately don't.

  So before we read anything else I want a spec. Write me the desiderata that any adequate account of this territory — the rationality of being rationally irrational, or of self-binding, call it what you like — has to meet, with the case or consideration behind each. Here are the cases I want it to say something about; don't feel bound by them and tell me if any is a red herring: (1) the hitchhiker in its pure prudential form, with no gratitude or owing sneaked in — the account shouldn't be able to cheat by importing moral reasons; (2) the inverse case — the person known to pay ransoms gets kidnapped, so your dispositions partly determine which situations you end up in at all, and the account has to handle that selection effect and not just within-situation payoffs; (3) an imperfect predictor (the driver is right 70% of the time) plus a real cost to maintaining the disposition, since being the paying sort apparently requires being the sort who feels guilty; (4) the fact that you usually can't choose a disposition directly, only acts that produce it — a public vow, money in escrow, deleting the app, or deliberately not reading the safety statistics about the route — so does the rationality of the means transmit, and what if the only available means is making yourself believe something false?; (5) the trait you never chose, because you were raised to be a promise-keeper, where it's unclear whether rationality can even evaluate something you didn't acquire and whether the answer should differ from the acquired case; (6) self-effacing dispositions, where the only disposition that would get the driver to stop is one you couldn't retain while fully knowing you'd adopted it as a device — what is the recommendation supposed to be there?; (7) a scope constraint, so the account doesn't generalize into making every temptation a case for self-binding, or let you count the value of having the disposition twice, once when you adopt it and again when you act on it; and (8) the level question — acts, dispositions, belief-forming policies, plans over time — whether one account has to deliver a single verdict across all of them, whether the verdicts are allowed to come apart, and if they do, which level is the one you're supposed to actually follow.

  Then: mark which requirements are non-negotiable and which are just what one camp happens to want; name any pair you suspect can't be jointly satisfied (my hunch is there's a genuine tension between the account being usable by someone who knows the account and the account crediting the hitchhiker with the benefit of being the paying type, since dispositions like that seem to evaporate once you see them as devices — but say if I've located the tension in the wrong place); and tell me which single requirement does the most work in ruling out the obvious answers. Please don't give me papers, citations, or a reading list — we're doing this without library access for a few weeks and I'd rather have the argument than the bibliography. A table is fine, and if you want to score the two or three standard lines against the list at the very end, keep it to one short paragraph: I care much more about the criteria than the scorecard.
reasoning: |-
  Hmm, this user is running a reading group with an econ PhD and an ML specialist, and they're stuck on an argument about commitment devices. The core issue is whether it's rational to bind your future self when you anticipate irrational behavior. They've presented a detailed set of cases and want desiderata for evaluating theories about "rationally irrational" behavior.

  The user mentions losing an argument about their gym commitment app, where money goes to a disliked charity if they miss workouts. Their friend claims rational agents wouldn't need this, while the user cites Parfit's hitchhiker as a counterexample. The ML friend connects this to AI safety concepts like agents removing their off-switch.

  Key pain points: disagreement over what's being evaluated (acts vs dispositions), and whether knowing about the mechanism destroys its effectiveness. The user provides 8 specific cases they want covered, from pure prudential scenarios to selection effects and self-effacing dispositions.

  I need to craft robust desiderata that address:
  - Pure instrumental rationality without moral smuggling (like the hitchhiker case)
  - Situational selection (the "ransom victim" effect)
  - Imperfect predictors with maintenance costs
  - Indirect acquisition of dispositions
  - Innate traits vs chosen ones
  - Self-effacing mechanisms
  - Scope limitations to prevent overapplication
  - Level-of-analysis questions

  The toughest tensions seem to be between:
  1) Knowledge-sensitivity (dispositions collapsing when seen as tools) and getting dispositional benefits
  2) Evaluating acts vs strategies across time
  3) Accounting for both choice and non-choice origins of traits

  The "no cheating with moral reasons" requirement will likely eliminate many naive solutions, while the "selection effect" requirement blocks simplistic decision-theory approaches. The scope constraint (#7) is crucial for preventing absurd overgeneralization.

  For the evaluation framework, I'll:
  - Mark core requirements vs preferences
  - Flag likely incompatibilities (especially knowledge/disposition tension)
  - Show how standard theories (causal/evidential/stable intentions) would fare against these criteria
  - Keep it citation-free as requested, focusing on conceptual structure
answer: |-
  Here's a specification of desiderata for evaluating accounts of rational self-binding ("rationally irrational" commitment), structured by your cases. Non-negotiable requirements are marked **★**. Tensions and scoring follow.

  ---

  ### **Desiderata for an Account of Rational Self-Binding**
  | **ID** | **Requirement**                                                                 | **Case/Justification**                                                                                                                                 | **Type**       |
  |--------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|----------------|
  | **R1** | **Must resolve time-inconsistent preferences without smuggled moral reasons.**  | (1) Parfit’s Hitchhiker: Pure prudence—driver helps iff you’ll pay later; paying *ex post* is costly/futile. Account must show why pre-commitment is rational without "oughts". | **★ Core**    |
  | **R2** | **Must handle *situational selection*: Dispositions affect which choices you face.** | (2) Ransom Kidnapping: Being "disposed to pay" makes you likelier to be kidnapped. Rationality of the disposition depends on net effect across possible worlds. | **★ Core**    |
  | **R3** | **Must incorporate *imperfect predictors* and *costly maintenance* of dispositions.** | (3) 70% Accurate Driver + Guilt Cost: If maintaining a "paying disposition" requires effort/psychic cost (e.g., guilt), benefits must outweigh *expected* costs. | **★ Core**    |
  | **R4** | **Must evaluate *indirect means* of acquiring dispositions, including belief-manipulation.** | (4) Public Vow / False Belief: If you can *only* bind yourself by (e.g.) vowing publicly or deluding yourself, can rationality transmit to the act? What if means are epistemically irrational? | Preference     |
  | **R5** | **Must address *non-chosen dispositions* (e.g., upbringing) symmetrically with chosen ones.** | (5) Raised Promise-Keeper: Does rationality evaluate the trait itself, regardless of origin? If "rationality" applies only to choices, how does it engage innate traits? | Preference     |
  | **R6** | **Must accommodate *self-effacing dispositions* that require ignorance.**       | (6) Self-Undermining Hitchhiker: If knowing you adopted the disposition "as a device" makes it fail (e.g., driver detects your insincerity), what does rationality prescribe? | **★ Core**    |
  | **R7** | **Must include a *scope constraint*: No overgeneralization to all temptations.** | (7) Anti-Exploit: Account shouldn’t advise self-binding for every fleeting urge (e.g., "I’ll skip dessert if I prepay $200 to Nazis"). Disposition-value counted once. | **★ Core**    |
  | **R8** | **Must clarify *evaluation level* (acts/dispositions/plans) and resolve conflicts.** | (8) Level Question: If the rational *act* (not paying) conflicts with the rational *disposition* (being a payer), which "wins"? Can the account prescribe what to *do*? | **★ Core**    |

  ---

  ### **Tensions & Non-Negotiables**
  - **Non-Negotiables (★):** R1, R2, R3, R6, R7, R8. These ensure the account handles core puzzles without trivializing or overreaching.
  - **Key Tension:** **R6 (self-effacement) vs. R8 (action-guidance)**. If the rational disposition requires ignorance (R6), but the account is known to the agent (R8), it self-destructs. *You located this correctly*: Knowledge dissolves the device’s efficacy. A usable theory must either bypass this (e.g., by evaluating plans pre-commitment) or accept limits.
  - **Secondary Tension:** **R2 (selection effects) vs. R7 (scope)**. If dispositions change which games you play (R2), when does this *not* justify self-binding? R7 prevents "always bind!" but must avoid ad hoc boundaries.
  - **High-Leverage Requirement:** **R8 (level question)**. Most accounts fail here by conflating evaluation levels (e.g., praising the disposition but prescribing the locally irrational act). This requirement forces clarity on what rationality *demands of the agent*.

  ---

  ### **Red Herrings?**
  - (4) Indirect means (e.g., belief-manipulation) is important but secondary: If an account satisfies R1–R3 and R8, it can extend to means.  
  - (5) Non-chosen dispositions matter for completeness, but the core challenge is about *choosing* to bind (R1, R3, R4).

  ---

  ### **Quick Scorecard of Standard Theories**
  *(Against ★ requirements only)*  
  - **Naive Causal Decision Theory (CDT):** Fails R1 (can’t justify pre-commitment; paying *ex post* is irrational), R2 (ignores how dispositions shape situations), R6 (no room for self-effacement). **Score: 1/6** (only R7).  
  - **Evidential Decision Theory (EDT):** Passes R1 (conditioning on paying makes help likely) but fails R2 (EDT miscalculates in kidnapping: "Paying" *evidence* attracts kidnappers), R3 (ignores causal costs), R6 (self-knowledge breaks the link). **Score: 2/6** (R1, R7).  
  - **Stable Intentions (e.g., Gauthier/McClennen):** Passes R1, R2, R3 (evaluates plans over time; dispositions avoid bad games). Fails R6 (transparent intentions invite exploitation), R8 (prescribes "stick to plans" but vague on how). **Score: 4/6** (fails R6, R8).  

  **Result:** No theory aces all ★ requirements. The tension R6/R8 is the primary fault line. Your gym app case fails in CDT (irrational), passes in EDT/Stable Intentions if predictor is reliable (R3), but R6/R8 haunt all when you *know* it’s a device.  

  ---

  ### Summary
  An adequate account must:  
  - Justify self-binding in Parfit/Ransom cases instrumentally (R1, R2),  
  - Weigh costs under uncertainty (R3),  
  - Forbid universal binding (R7),  
  - Resolve conflicts between "rational now" vs. "rational earlier" (R8), and  
  - Grapple with self-effacement (R6)—without collapsing into paradox.  
  **The central test:** Can the theory prescribe a *usable* commitment device for an agent who understands the theory? If not, it fails R8.
