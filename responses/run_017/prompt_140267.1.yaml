prompt: |-
  I run a weekly grad reading group on confirmation theory, about 12 people, 90 minutes, and next week is the old evidence problem. Last time we covered it half the room left convinced it's just a glitch in the formalism with no real intuition behind it, so I want an activity where they walk into it themselves. My rough idea, steal it or throw it out: a cold-case board of maybe fifteen facts they've been staring at and getting nowhere with for the first half hour, then hand them a hypothesis about what happened that makes six of the dead-end facts suddenly click into place. They should feel a big surge of confirmation at the exact moment their credence in every one of those facts is already 1. Private written odds on the hypothesis before and after, no money, some scoring rule that makes them care. Two things I definately want built in. First, seed the board with facts at different levels of how well they're remembered: some they were plainly told, some they only half-recall, one or two they'd have bet against at the start — so the boost they report can be compared against how much uncertainty they had left, and they can see whether it tracks that or just tracks how strong the "of course!" feeling was. Second, in the debrief keep the aha (the sudden sense of fit) separate from an actual change in rational credence, and tell me honestly which one your game produces. I also suspect a good chunk of the surge is really the hypothesis looking more plausible or simpler once it unifies everything, which is a different thing again — if the design can pull that apart, do it. Include a timeline, the debrief mapping moments onto the pieces of the problem, what will predictably go wrong the first time I run it (my bet: someone says "I just learned that H explains E" and thinks that settles it, and someone else's odds move because the room moved), and which feature of the problem the activity just can't reproduce so I have to state it myself. They shouldn't hear the words likelihood ratio until afterwards, and no lecture up front.
reasoning: |-
  We are designing an activity to illustrate the old evidence problem in confirmation theory. The goal is for participants to experience a surge in confirmation for a hypothesis when it explains old evidence (facts they already know with high credence). The activity should have:
   - A "cold-case board" of about 15 facts that the group has been staring at for 30 minutes without making progress.
   - Then, a hypothesis is introduced that explains 6 of these facts, leading to an "aha!" moment.
   - Participants will privately assign odds (credences) to the hypothesis before and after the introduction of the hypothesis, using a scoring rule to incentivize accuracy.
   - The facts on the board should vary in how well they are remembered: some clearly known, some half-remembered, and one or two that they might have been skeptical about.
   - We want to separate the "aha" feeling (sense of fit) from the rational change in credence, and also consider whether the surge is due to the hypothesis making the evidence seem more unified or simpler.

   Structure:
   1. Introduction (without mentioning the old evidence problem) - set the scene as a cold case.
   2. Present the board of facts (15 items). Let participants study them for 30 minutes. They are allowed to take notes, but no discussion until after the hypothesis is introduced.
   3. After 30 minutes, each participant writes down their current credence for the hypothesis (which they haven't seen yet) on a slip of paper. They also write down their credence for each fact (to see how certain they are about each one). We might ask for their credence in the fact as they recall it (since some are half-remembered).
   4. Then, introduce the hypothesis that explains 6 of the facts. Let them have a few minutes to see how it fits.
   5. Then, each participant writes down their updated credence for the hypothesis and also notes the intensity of their "aha" feeling (on a scale, say 1-10).
   6. Group discussion and debrief.

   How to design the facts and the hypothesis?
   - We need a fictional cold case (e.g., a theft, a disappearance, a mysterious event) with 15 facts. Some of these facts will be explained by the hypothesis, and some won't (to avoid overfitting). The hypothesis should explain 6 of them, and there should be 9 that are not explained (or even contradicted? but we don't want to make the hypothesis look bad, just to show that the explained ones get a boost).
   - The facts should be of three types:
      a) Clearly known: e.g., facts that were repeatedly stated in the initial briefing and are indisputable.
      b) Half-remembered: facts that were mentioned once and might be misremembered.
      c) One or two facts that might have been initially surprising or that participants might have been skeptical about (so they had lower initial credence).

   Steps for the facilitator:
   - Before the activity, prepare the case and the facts. Make sure the hypothesis is not obvious from the facts alone.

   Example case (fictional):
     The "Museum Heist": A valuable diamond was stolen from the museum last year. There are 15 facts gathered from the investigation.

   Facts (example, we'll create 15):
     1. The diamond was last seen at 8 PM by the security guard during his rounds.
     2. The security camera at the main entrance malfunctioned that day.
     3. A witness reported seeing a person in a black hoodie near the museum at 8:30 PM.
     4. The security guard reported hearing a noise from the east wing at 9:15 PM.
     5. The next morning, the diamond was found missing during the inventory.
     6. The lock on the display case was picked, not forced.
     7. A set of lockpicks was found in a nearby dumpster a week later.
     8. The museum's janitor was absent that day due to illness.
     9. There were no fingerprints on the display case.
     10. A piece of black cloth was caught on a nail near the window in the east wing.
     11. The security guard has no criminal record.
     12. The museum director received a ransom note two days later, demanding $1 million for the diamond.
     13. The ransom note was written in cut-out letters from a magazine.
     14. The security guard's alibi for the night was that he was at home with his wife, who confirmed he was there from 9 PM onward.
     15. The diamond was insured for $5 million.

   Hypothesis (to be revealed later):
     The security guard stole the diamond. He used his knowledge of the security system to avoid cameras, wore a black hoodie to blend in, and staged the ransom note to mislead the investigation. He hid the lockpicks in the dumpster later.

   Which facts does this hypothesis explain?
     1. The diamond was last seen by him at 8 PM (he had opportunity).
     2. The security camera malfunctioned (he might have disabled it).
     3. The person in the black hoodie (he could have been that person).
     6. The lock was picked (he had the skills or tools).
     7. The lockpicks found in the dumpster (he disposed of them).
     10. The black cloth (from his hoodie).

   We leave some facts unexplained (like the janitor's absence, the ransom note, the insurance) and one or two might even be inconsistent? But we don't want to make the hypothesis too weak. The ransom note could be consistent (he sent it to mislead) but we have to see.

   However, note that fact 14 (alibi) is problematic. We might have to adjust.

   Revised facts to better fit:
     Let's change fact 14: The security guard's wife initially confirmed he was home at 9 PM, but later she retracted her statement, saying she was asleep by 8:30 PM and didn't hear him come in until 11 PM.

   Now the hypothesis can explain: 
     - He was seen at 8 PM (fact 1) and then left, committed the crime at 8:30 (seen in hoodie, fact 3) and then again at 9:15 (noise, fact 4). Then he went home and arrived at 11 PM.

   But we must be cautious: the activity is about old evidence, not building a case. We want the hypothesis to explain some facts that were already known.

   How to vary the certainty of the facts?
     We can present the facts in a handout. For each fact, we can indicate the source and how reliable it is. But for the half-remembered ones, we can do this:

     - Clearly known: These are presented multiple times and emphasized. We might even give them in a list and then repeat some during the initial briefing.
     - Half-remembered: We mention them once in the initial oral briefing, but they are also in the handout. We can say: "You might recall that there was a piece of black cloth found near the window, but you can't remember the details." Actually, we'll have the handout so they can refer to it, but we want some to be less salient. Alternatively, we can have a fact that was mentioned only in passing in a long list and not emphasized.

     Alternatively, we can run the initial 30-minute period by giving them a packet that has the facts, but we don't let them take the packet with them? Or we do, but then for the half-remembered ones, we can have a fact that is stated in a way that is ambiguous or easily misread.

     Another idea: during the initial 30 minutes, they have the list of 15 facts. Then, when the hypothesis is introduced, they are asked to recall the facts without looking (for the half-remembered ones) but that might be too much. Alternatively, we can let them keep the list, but for the credence in the facts, we ask: "How certain are you that fact X is exactly as stated?" and for the half-remembered ones, we might have stated them in a way that is open to interpretation.

     Example of a half-remembered fact: 
        Original: "A witness reported seeing a person in a black hoodie near the museum at 8:30 PM."
        But the witness statement was vague: the person was wearing a dark hoodie, but it might not have been black. We can state it as black, but then in the debrief we can reveal that the witness said "dark", not necessarily black. However, we don't want to trick them. Instead, we can have:

        Fact: "A witness reported seeing a person in a black hoodie near the museum at 8:30 PM."

        Source: Witness statement (given in the packet). But the witness statement actually says: "I saw someone in a dark hoodie, maybe black, but it was dark outside." 

        We don't give the full source in the fact list, only the summary. Then, we can ask for their credence in the fact as stated. So they might assign less than 1.

     For a fact they might have been skeptical about: 
        Fact: "The security guard has no criminal record." 
        But they know that the background check was rushed and might have missed something. So they might assign, say, 0.8.

     And for the clearly known: 
        Fact: "The diamond was last seen at 8 PM by the security guard during his rounds." 
        This is from the security log and the guard's own report, and it's undisputed. So they assign 1.

   Steps:

   1. Introduction: 
      - "We are going to spend the first 30 minutes reviewing a cold case: the Museum Heist. You are detectives who have been assigned this case and have a packet of 15 facts. Your job is to review the facts and see if you can come up with a theory. You will have 30 minutes to study the facts. Please do not discuss with others. You may take notes. After 30 minutes, we will move to the next step."

      - Distribute the packet of 15 facts. The packet should have a summary of the case and the list of facts. For the half-remembered facts, the fact is stated without the nuance (but the nuance is in the source detail if they read carefully). For the skeptical fact, we can have a note that the background check was rushed.

   2. After 30 minutes, collect the packets? Or let them keep? We want them to have access to the facts when they assign credences? But we want to simulate that some facts are not perfectly remembered. 

      Alternative: They keep the packet, but we ask them to assign two things:
          a) Their credence in the hypothesis (which they haven't seen yet) - but they might form some hypothesis. We don't mind if they have a hypothesis, but we are going to give them a specific one.
          b) For each fact, their current credence that the fact is exactly as stated (or true). For example, for the fact about the hoodie being black, they might have noticed in the packet that the witness said "dark", so they assign 0.7 to it being black.

      We can do:

          Step 1: Before the hypothesis is introduced, each participant privately writes:
              - Their credence for each fact (0 to 1) that the fact is true (or accurately stated).
              - Their credence that the security guard did it (the hypothesis H). But note: they haven't been told the hypothesis. So we have to introduce H without giving away the explanation? We can say: "We are going to consider a specific hypothesis: the security guard committed the theft. Before we tell you how it fits, what is your credence that the security guard did it?"

          But wait, if we tell them H is "the security guard did it", then they might already start connecting the dots. We don't want that until after we collect the initial credence for H.

          So we do:

              - After 30 minutes of studying the facts, we say: "We are going to consider a specific hypothesis. We will tell you what it is in a moment, but first, without knowing the details of the hypothesis, we want you to assign a credence to the hypothesis that the security guard is the thief. You have the facts. What do you think? Write it down."

          That might be odd because they don't know what the hypothesis entails. But it's okay because we are going to provide the explanation after.

          Alternatively, we can just ask for their credence in the security guard being the thief without calling it a hypothesis. But then we are giving them the hypothesis.

          We have to give the hypothesis at that moment: "The hypothesis is: the security guard stole the diamond." Then they write down their initial credence in that hypothesis.

          But note: they might already have considered the guard. So we are not introducing a new suspect. We are just naming a specific one.

          This is acceptable. They use the facts to assign an initial P(H).

   3. Then, we reveal the explanation: "Now, we will show how this hypothesis explains some of the facts." We provide a statement that connects H to the 6 facts.

      Example: 
          "The security guard stole the diamond. He knew the security system, so he disabled the camera (fact 2). He wore a black hoodie to avoid being recognized (fact 3). He used lockpicks to open the case (fact 6) and later disposed of them in the dumpster (fact 7). During the theft, his hoodie caught on a nail (fact 10). He was the last person to see the diamond (fact 1)."

      We do not mention the other facts (or we can say: it doesn't explain the other facts).

   4. Then, they reassess: 
          - They write their updated credence for H.
          - They also rate the intensity of their "aha" feeling on a scale of 1-10.

   5. Then, we collect the responses.

   6. Debrief:

          We want to discuss:
            - How much did their credence in H change? (We can compute the change and average.)
            - How did the change relate to the "aha" feeling?
            - How did the change relate to the certainty they had in the facts that were explained? (We have their credences for each fact from before.)

          We can plot: for each participant, the change in credence (or the log-odds change) against:
              a) Their average credence in the 6 facts (if they thought the facts were certain, then the explanation shouldn't change much? but in the old evidence problem, even when the facts are certain, we see a boost).
              b) Their "aha" rating.

          We also want to separate the feeling from the rational update. We can ask: "Did your credence change because you thought the hypothesis became more probable, or because you felt a sense of understanding?"

          Also, we want to see if the unification (simplicity) played a role. We can ask: "To what extent did the hypothesis making sense of multiple facts at once influence your judgment?"

          Then, we introduce the old evidence problem: 
              - In Bayesian terms, if the evidence E is already known, then P(E)=1. Then, P(H|E) = P(H) * P(E|H) / P(E) = P(H) * P(E|H). But if P(E)=1, then P(E|H) should be 1 as well? Then there's no boost. But intuitively, there is.

          We can then discuss: 
              - How did the activity illustrate this? 
              - What might be going on? (e.g., the evidence might not have been fully believed, or the explanation might make the evidence more expected under H, even if already known)

          We can also note that the likelihood ratio P(E|H)/P(E|~H) might have changed because the hypothesis H made E more expected than it was under ~H, even if E was old. But under strict conditioning, if E is known then P(E|~H) is also 1? 

