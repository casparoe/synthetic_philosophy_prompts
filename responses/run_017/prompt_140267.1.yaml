              - For each fact: credence that it is true (or accurately stated).
              - For H: initial credence that the security guard did it.
      0:40 - 0:45: Present the hypothesis and how it explains the 6 facts.
      0:45 - 0:50: Participants write updated credence for H and the "aha" rating (1-10).
      0:50 - 1:20: Group discussion and debrief.

   What might go wrong?
      - Someone might say: "I just learned that H explains E, so H is more likely." But that is exactly the issue. We want to see if this happens and then discuss why it's problematic in the Bayesian framework with old evidence.
      - Someone's odds might move because others in the room react (if there is any discussion before writing). So we must enforce silence until after they write the updated credence.
