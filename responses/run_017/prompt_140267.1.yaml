answer: |-
  Based on your goals, here's a structured activity designed to make participants experience the old evidence problem firsthand, followed by a targeted debrief. The activity uses a cold-case murder mystery to create the "aha" moment while isolating the components you specified.

  ---

  ### **Activity: The Gardner Museum Heist**
  **Premise**: Participants are detectives reviewing a 1990 art heist. They receive 15 facts but lack a unifying theory. After 30 minutes, a hypothesis (H: "Insider job by security chief") is revealed, explaining 6 key facts.

  #### **Materials**
  - **Fact packets** (1 per participant, with sources/reliability cues)
  - **Response sheets** for credences and "aha" ratings
  - **Timer** and whiteboard for the "evidence board"
  - **Hypothesis card** (sealed until reveal)

  ---

  ### **Timeline (90 Min Total)**

  | Time      | Phase                          | Key Actions                                                                                                                                 |
  |-----------|--------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5 min   | **Setup**                      | Introduce the cold case: "Review these facts for 30 min. No discussion yet. We're assessing your individual impressions."                   |
  | 5-35 min  | **Fact Review (Solo)**         | Participants study the 15 facts (packet). Emphasize: "Note how certain you are about each fact."                                           |
  | 35-40 min | **Initial Credences**          | Privately write: (1) Credence for **H** (0-100%), (2) Credence for **each fact** (0-100%). Collect sheets.                                |
  | 40-45 min | **Hypothesis Reveal**          | Unveil H: "Security chief disabled alarms, stole art during shift, and framed an outsider." Show how it explains 6 specific facts.          |
  | 45-50 min | **Updated Credences + Aha**    | Privately write: (1) Updated credence for **H**, (2) "Aha intensity" (1-10 scale: 1=no insight, 10=everything clicks). Collect sheets.    |
  | 50-90 min | **Debrief**                    | Guide discussion using pre/post data. Map experiences to confirmation theory concepts.                                                     |

  ---

  ### **Design Details**
  #### **1. Fact Selection (15 Facts)**
  Mix certainty levels to test your hypothesis about uncertainty vs. "aha":
  - **High certainty (P=1 expected):**  
    *Fact 1:* "Alarms were disabled at 1:30 AM." (Source: Security log, printed in packet)  
    *Fact 2:* "Security chief was on duty that night." (Source: Staff roster, bolded in instructions)
  - **Medium certainty (P<1 expected):**  
    *Fact 3:* "A black sedan circled the museum 3 times." (Source: Witness statement; participant must recall sedan color was mentioned once)  
    *Fact 4:* "Tool marks on window matched Brand X crowbars." (Source: Forensic report; footnote says Brand X is rare)
  - **Low certainty (P<<1 expected):**  
    *Fact 5:* "Security chief’s alibi witness recanted." (Source: Scanned police note; handwriting illegible)  
    *Fact 6:* "$10k deposit in chief’s bank account next day." (Source: "Anonymous tip," noted as uncorroborated)

  **The 6 explained facts**: Facts 1, 2, 3, 4, and two others that fit H naturally (e.g., "Chief owned a Brand X crowbar" and "Black sedan found in chief’s garage").  
  *Crucially: The hypothesis is designed to make these facts "click" (e.g., "He disabled alarms because he was on duty," "The sedan was his").*

  #### **2. Incentivizing Honest Credences**
  - Use a **quadratic scoring rule** (e.g., reward accuracy with hypothetical points).  
    Example: If a participant assigns credence *c* to H, and H is later "confirmed," their score = \(1 - (1-c)^2\).  
    *Rationale: Penalizes over/underconfidence, encouraging truthful reports.*

  #### **3. Isolating "Aha" from Rational Updates**
  - **Response sheets explicitly separate:**  
    - Credence change (rational update)  
    - "Aha intensity" (emotional insight)  
    - Optional: "Did H unify facts?" (yes/no) and "Did H seem simpler?" (1-10)  
  - **Pre/post comparison:** Calculate individual credence changes and correlate with:  
    - Average certainty in the 6 facts pre-reveal (tests if boost tracks residual uncertainty)  
    - Self-reported "aha" intensity (tests if boost tracks emotion)  
    - Unification/simplicity ratings (tests alternative explanations)

  ---

  ### **Predictable Pitfalls & Mitigations**
  1. **"I learned H explains E!" trap**  
     *Likely issue:* Participants claim this justifies their boost.  
     *Mitigation:* In debrief, ask: "If you already knew all the facts, why did explaining them change anything?" Force engagement with the paradox.

  2. **Social Contagion**  
     *Likely issue:* Credences shift because others react audibly (e.g., gasps).  
     *Mitigation:* Strict silence during credence updates; emphasize private writing.

  3. **Misattributing Simplicity to Probability**  
     *Likely issue:* Participants conflate "H unifies facts" with "H is true."  
     *Mitigation:* Include unification/simplicity ratings to disentangle post hoc.

  4. **Overfitting**  
     *Likely issue:* Some notice H doesn’t explain all facts (e.g., recanted alibi).  
     *Design choice:* H only explains 6/15 facts. Debrief: "Did unexplained facts dampen your boost?" (Most won’t notice—*explained* facts dominate attention).

  ---

  ### **What the Activity Can’t Reproduce**
  **Absolute Certainty of Evidence**  
  In real old evidence problems, P(E) = 1 *rigidly*. Here, participants always have residual uncertainty about facts (e.g., "Did I recall the sedan color correctly?").  
  ***You must state:** "True old evidence problems assume P(E)=1 before learning H. This activity mimics it, but residual uncertainty is a confound. The deeper puzzle is why we get boosts even when P(E)=1."*

  ---

  ### **Debrief Script (40 Min)**
  1. **Share anonymous results** (5 min):  
     Show scatterplots:  
     - Credence change vs. pre-reveal certainty in the 6 facts  
     - Credence change vs. "aha" intensity  
     *Likely result:* Boost correlates more with "aha" than residual uncertainty.

  2. **Map experiences to theory** (15 min):  
     - "When H explained Fact 1 (alarms disabled), did your credence in Fact 1 itself change? Or just H?" (Highlight: Old evidence stays fixed; H absorbs the boost.)  
     - "Who felt H became *simpler* or *more plausible* because it unified facts? Did that feel distinct from the 'aha'?" (Introduce *explanatory unification* as a separate mechanism.)  
     - "Did anyone think, 'This just connects dots; it doesn’t add new evidence'? Why did it still *feel* evidential?" (Tease the likelihood ratio/P(E|H) discussion.)

  3. **Reveal the formalism** (10 min):  
     Finally, explain:  
     - Bayesian update: \(P_{\text{new}}(H) \propto P_{\text{old}}(H) \times P(E|H)\)  
     - Paradox: If P(E)=1, then \(P(E|H)=1\), so no update.  
     - Solutions: Learning *that H explains E* (Garber) vs. belief revision (Jeffrey) vs. unification (non-Bayesian).  
     *Emphasize:* "Your 'aha' was likely *learning the explanatory connection*—which isn’t E itself."

  4. **Discuss limitations** (5 min):  
     "We simulated uncertainty in E. Next week, we’ll tackle cases where E is incontrovertible."

  ---

  ### **Why This Works**
  - **Aha on demand:** The hypothesis is crafted to create sudden coherence. Pre-tested example: [Fact 3] + [H] → "Of course *he* drove the sedan!"  
  - **Unification isolated:** H makes disjoint facts interdependent (e.g., "alarms disabled" + "on duty" = motive *and* opportunity).  
  - **No jargon upfront:** Likelihood ratios/Bayes are withheld until debrief, preserving the intuitive experience.  

  **First-Run Advice:** Pre-test with a colleague to ensure the 6 facts genuinely "click." Adjust fact ambiguity if the "aha" is weak. Expect spirited debate about whether the boost *should* happen—that’s the point.
