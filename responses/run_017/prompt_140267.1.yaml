     So we have 15 facts.

     The skeptical facts are 11, 12, 14.

     The guard hypothesis does not explain 4, 5, 8, 9, 11, 12, 13, 14, 15.

     But note: fact 5 (diamond missing) is explained by H? Yes, but trivially. We don't count it as one of the six because it's too trivial. We want non-trivial explanations. So we stick to the six.

     We'll present the hypothesis and say it explains facts 1, 2, 3, 6, 7, 10.

     In the debrief, we can note that the surge might be higher for the facts that were not initially certain? And we have the data to check.

     How to collect the credence for the facts:

        We will have a worksheet with:
          Fact 1: [ ] Credence (0-1)
          Fact 2: [ ] Credence (0-1)
          ... 
          Fact 15: [ ] Credence (0-1)

          Hypothesis H (security guard did it): [ ] Credence (0-1)

        Then after the explanation:

          Hypothesis H: [ ] Updated credence (0-1)
          Aha feeling: [ ] (1-10)

     Then we can analyze.

     What to do if the hypothesis is not new? Some participants might have already considered the guard. We can say: "We are going to consider a specific hypothesis in detail: that the security guard did it. We want to see how well it fits the facts."

     We don't mind if they had a high initial credence, as long as we see a boost.

     Finally, the activity cannot reproduce the case where the evidence is absolutely certain (P(E)=1) because we are in a real situation and they might have doubts. So in the debrief, we have to state: "In the old evidence problem, we assume the evidence is known with certainty. But in this activity, you might have had some uncertainty. However, even for facts you were certain of, did you still feel a boost? And how do we explain that?"

     We can then discuss the Garber solution: learning that H entails E.

     And note: the surge they report might be due to the unification of the evidence under H, making H seem simpler or more coherent.

     This activity should set the stage for the theoretical discussion.

