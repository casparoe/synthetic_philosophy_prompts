prompt: |-
  Hi. I work in the clerk's office of a fairly religious mid-sized city council, and one of my jobs is screening the written submissions we read into the record at public hearings (evangelical and Catholic churches, two mosques, a gurdwara, a very active secularist association, assorted resident groups). Our standing orders say a submission should offer reasons that all members of the public can reasonably be expected to accept regardless of their religion or worldview, which is obviously some version of the public reason idea, but nobody has ever turned it into anything you could actually run. We recieve 30–40 submissions a week, one or two pages each, we've got about three minutes per submission, we can't research the religion involved, if we leave something out we have to print a one-sentence reason that will survive appeal to a panel of elected members, and our lawyers say we can't exclude anything because of who the speaker is, only because of what the argument says.

  So: give me a procedure. The questions in order, what counts as a pass at each one, where it stops and excludes, where it kicks the thing back for one rewriten version, and where it has to hand the call to a person because it's a judgement call dressed up as a rule. Two of my boss's ideas are in the mix and I want you to tell me if they're mistakes: she thinks people should always be allowed to make their point in religious language as long as they also attach a secular version of the same argument (a translation proviso, she calls it), and she thinks the rule should only really bite at the final vote and not during early hearings. Then run the procedure on three cases: (1) a church's one-page submission against a medically-assisted-dying resolution arguing that life is a gift from God and suffering can be redemptive, no secular premises anywhere; (2) an interfaith housing coalition submission supporting a zoning change that opens with a verse about hospitality to the stranger and then gives three paragraphs of rent and vacancy statistics; (3) a secular tenants' union submission on the same zoning change that never mentions religion but whose whole case rests on the inherent dignity of every person, which their own newsletter says they took from Catholic social teaching. I'd be annoyed if the procedure threw out (3), so if it does, say so plainly, and if it does something else I won't like elsewhere, say that too. Also be honest about which of your steps are really just someone's politics arranged as a checklist.
reasoning: |-
  Okay, let me approach this systematically. The user works in a city council clerk's office handling diverse public submissions and needs a practical screening procedure based on public reason principles. The constraints are tight: 30-40 submissions weekly, 3 minutes each, no religious research capacity, and appeal-proof documentation. 

  The core challenge is translating abstract "public reason" concepts into executable steps while navigating two key proposals from the boss: a "translation proviso" allowing religious language with secular counterparts, and delaying strict application until final votes. Both ideas seem problematic upon closer examination - the first creates operational chaos (verifying argument equivalence is impossible at scale), while the second undermines the entire screening purpose.

  For the procedure design, I'm considering a three-stage filter:
  - First, a mechanical scan for explicit religious premises (scriptures, divine commands)
  - Second, content analysis checking for secular equivalents when religious language appears
  - Third, a worldview-neutrality test for arguments phrased in secular terms but rooted in particular traditions

  The test cases reveal nuances:
  - Case 1 (pure religious argument) clearly fails
  - Case 2 (religious framing + secular data) likely passes if statistics stand alone
  - Case 3 ("dignity" argument) is the trickiest - the term has secular jurisprudence roots despite religious origins, so excluding it would contradict the user's intuition

  I'm realizing the procedure must distinguish between origin and function: an argument passes if it can function independently within pluralistic deliberation, regardless of its philosophical pedigree. This makes Case 3 acceptable while maintaining neutrality. 

  The boss's proposals need gentle pushback: the translation requirement is unworkable (can't audit theological accuracy), and late-stage enforcement invites procedural chaos. Better to screen rigorously upfront with clear appeal rights. 

  For implementation, I'll suggest templated rejection reasons and a "human judgment" flag for borderline cases like contested secular terms. The trade-off is acknowledging that some steps involve substantive philosophical choices - but we can minimize this by focusing on functional accessibility of arguments rather than their origins.
answer: |-
  Here's a practical, appeal-proof screening procedure designed for speed and legal defensibility, incorporating your constraints and addressing your boss's proposals critically. **Key Principle:** Focus solely on *argument structure*, not speaker identity or topic. Reject only submissions where **the core justification relies *exclusively* on premises requiring acceptance of a specific religious/metaphysical worldview.**

  ### Screening Procedure (3-Minute Flowchart)
  *(Apply sequentially; stop at first rejection point)*

  1.  **Scan for Explicit Religious Premises:**
      *   **Look For:** Direct citations of scripture, appeals to divine authority (e.g., "God commands," "Scripture teaches"), reliance on specific religious doctrines (e.g., "redemptive suffering," "karma"), or invocation of unique religious figures/teachings as justification.
      *   **Pass:** No such language found. → Proceed to Step 4.
      *   **Kickback/Reject:** Explicit religious premises found *as core justification*. → Proceed to Step 2.

  2.  **Evaluate Core Justification:**
      *   **Question:** Do the explicit religious premises identified in Step 1 constitute the **primary or sole reason** supporting the position? OR, is there a clearly stated, **self-contained secular argument** (empirical data, widely accepted legal principles, public health, safety, economic welfare, fairness, common human experience) that stands on its own *without* needing the religious premise?
      *   **Pass (Secular Core):** Submission contains a clear, self-contained secular argument sufficient to support the position, *even if* religious language is also used ornamentally or as motivation. → **Accept**. (This is where Case 2 passes).
      *   **Kickback (Potential Translation):** *No* clear secular argument exists; the religious premise is central. → Proceed to Step 3.
      *   **Reject:** Religious premise is central *and* no secular argument is present. → **Reject with Reason:** "Submission relies exclusively on premises requiring acceptance of a specific religious worldview not shared by all members of the public." (This is where Case 1 fails).

  3.  **"Translation Proviso" Check (Boss's Idea - Use Sparingly):**
      *   **Question:** Does the submission **explicitly state a secular argument** presented as an *equivalent translation* or *parallel justification* to the religious premise? (Not just motivation, but a functional alternative reason).
      *   **Pass (Rare):** Yes, a clear secular argument is explicitly offered as the alternative justification. → **Accept**.
      *   **Kickback:** Religious core is clear, but a secular argument is implied or poorly articulated. → **Kickback with Reason:** "Submission's core justification relies on a specific religious worldview. Please resubmit clearly articulating a self-contained argument based on reasons all members of the public can reasonably be expected to accept, regardless of their religious views or lack thereof."
      *   **Reject:** No attempt at a secular alternative justification is made. → **Reject with Reason:** "Submission relies exclusively on premises requiring acceptance of a specific religious worldview not shared by all members of the public." (Case 1 fails here too).

  4.  **Scan for Implicit Worldview-Dependent Premises:**
      *   **Look For:** Arguments relying on foundational premises that are *not explicitly religious* but are highly contested *metaphysical* claims not grounded in widely accepted evidence, common experience, or pragmatic public concerns (e.g., "inherent dignity," "sanctity of life," "natural rights," "ultimate meaning/purpose," "karmic balance," "soul"). *Be cautious here - this is the "Judgment Call" zone.*
      *   **Pass:** Premises are based on empirical evidence (stats, studies), legal principles, widely acknowledged public goods (safety, health, economic stability), procedural fairness, or observable common human experiences/needs. → **Accept**.
      *   **Judgment Call Needed:** Core argument relies heavily on contested metaphysical concepts like "inherent dignity" or "sanctity" *without further justification* linking them to concrete public goods or shared experience. → **Flag for Human Review**. (This is where Case 3 gets reviewed).

  ### Addressing Your Boss's Proposals
  1.  **"Translation Proviso" (Requiring Secular Version Alongside Religious Language):**
      *   **Is it a Mistake? Yes, largely.** It creates significant operational problems:
          *   **Verification Burden:** How do you verify the "translation" is accurate or sufficient in 3 minutes? What if it's a bad faith translation?
          *   **Equivalence Ambiguity:** Many religious concepts lack direct secular equivalents. Is "redemptive suffering" translatable?
          *   **Kickback Avalanche:** Most submissions failing Step 2 would likely result in kickbacks, overwhelming staff.
          *   **Selective Enforcement Risk:** Makes rejection/kickback decisions more subjective.
      *   **Compromise:** The procedure includes a *narrow, explicit* version (Step 3) triggered only when a submission *fails* Step 2. It forces the *submitter* to articulate the secular argument clearly. Avoid requiring it upfront for all religious language.

  2.  **"Rule Only Bites at Final Vote":**
      *   **Is it a Mistake? Yes, fundamentally.** This undermines the entire purpose of the "public reason" standing order and creates chaos:
          *   **Hearing Disruption:** Allows arguments clearly violating the rule to be read, wasting time, potentially inflaming tensions, and undermining the rule's legitimacy.
          *   **Appeal Nightmare:** Excluding an argument *after* it's been read into the record is procedurally messy and more likely to be appealed successfully ("You let them say it then ignored it?").
          *   **Burden Shift:** Forces Council members to publicly reject arguments based on worldview, which is politically harder and less defensible than pre-hearing screening based on argument structure.
          *   **Procedural Fairness:** Early screening gives submitters a chance to *fix* their argument (kickback) before the hearing.

  ### Running the Cases
  1.  **Church Submission (Against Medically-Assisted-Dying):**
      *   **Step 1:** Explicit religious premises found ("gift from God," "suffering can be redemptive").
      *   **Step 2:** These are the *sole and core* justifications. No secular argument provided (e.g., risks to vulnerable populations, slippery slope arguments, palliative care alternatives, implementation costs).
      *   **Step 3:** No secular "translation" offered.
      *   **Result: REJECT.** Reason: "Submission relies exclusively on premises requiring acceptance of a specific religious worldview not shared by all members of the public."

  2.  **Interfaith Housing Coalition (For Zoning Change):**
      *   **Step 1:** Explicit religious premise found (verse about hospitality).
      *   **Step 2:** Core justification is clearly the self-contained secular argument (rent/vacancy statistics demonstrating a housing shortage/affordability crisis). The religious language is ornamental/motivational.
      *   **Result: PASS (at Step 2).** The secular argument stands alone.

  3.  **Secular Tenants' Union (For Zoning Change - "Inherent Dignity"):**
      *   **Step 1:** No explicit religious premises found.
      *   **Step 4:** Core argument relies on "inherent dignity." This *is* a contested metaphysical concept. **JUDGMENT CALL NEEDED.**
      *   **Human Reviewer Analysis:**
          *   "Inherent dignity" is deeply rooted in Catholic teaching *and* Enlightenment philosophy *and* international human rights law (UDHR, Art. 1).
          *   It functions as a widely accepted (though philosophically debated) foundational principle in modern liberal democracies for public policy, *especially* regarding housing/human needs.
          *   Its use here connects directly to a concrete public good: ensuring housing as a basic need for a minimally decent life, impacting health, safety, and social stability – concerns shared across worldviews.
          *   Unlike "redemptive suffering," "inherent dignity" operates as a *functional public norm* within the pluralistic context.
      *   **Result: ACCEPT.** While the *origin* might be religious for them, the *argument functions* on a premise broadly invoked and accepted within the public sphere as a basis for policy related to basic needs, even if its metaphysical grounding is debated. Rejecting this would likely invalidate vast swathes of common social justice arguments and be practically/politically unsustainable. **This passes the "reasonable expectation" test for public reason.**

  ### Honesty About Politics in the Checklist
  *   **Step 4 (Implicit Worldview Premises):** This is inherently political/philosophical. Deciding which contested concepts (like "dignity") are *functional public norms* vs. *sectarian metaphysics* requires judgment influenced by prevailing liberal democratic norms. Rejecting *all* such concepts would paralyze government. Accepting *all* would gut the public reason rule. The procedure leans towards **inclusion** for concepts that have become embedded in the language of public policy and human rights, recognizing their functional role, even if their origins are debatable. This reflects a specific (widely held, but not universal) view of how pluralistic democracies operate.
  *   **Accepting Case 3:** This decision embodies the political choice to prioritize functional public discourse and widely accepted normative frameworks over strict philosophical purity regarding origins. Excluding it *would* likely feel unjust and impractical, demonstrating the necessary flexibility in applying "public reason."

  This procedure maximizes efficiency, minimizes subjectivity where possible, centralizes the trickiest judgment calls, provides clear appeal-proof reasons for rejection/kickback, and respects the legal constraints while upholding the spirit of the standing order. It pushes back on your boss's proposals where they create operational or principled problems but incorporates a narrow version of the "translation" idea.
