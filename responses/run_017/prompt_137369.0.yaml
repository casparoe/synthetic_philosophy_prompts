answer: |-
  ## Research Proposal: Shift-Identifiability as a Prerequisite for Eliciting Latent Knowledge

  **1. Core Question & Shift-Identifiability Criterion**
  The primary question is: *Under what conditions is a piece of knowledge genuinely "latent" within a model such that it can be reliably elicited under distribution shift, solely using training-level supervision?* This proposal contends that current ELK framing overemphasizes decoder design and underemphasizes the role of the *training distribution* in making knowledge fundamentally accessible.

  I propose the criterion of **Shift-Identifiability**: A model possesses shift-identifiable latent knowledge about concept `C` if and only if:
  (i) A *separate* decoder model, trained *only* on the same inputs, outputs, and supervision signals as the original model, can accurately infer `C` from the original model's internal states *on the training distribution*.
  (ii) This same decoder *consistently* infers `C` correctly on a *shifted distribution* where the original model's *observable behavior* (e.g., its primary task output) becomes uninformative or degenerate (e.g., due to sensor tampering, extreme rarity of `C`, or adversarial inputs).
  **Scope:** This applies to knowledge critical for reliability/alignment (e.g., "is the sensor corrupted?", "is this answer true?") that the *model uses internally* but does not *reliably express* externally under shift. It explicitly *excludes* knowledge requiring stronger supervision (e.g., direct `C` labels) than the base model received.

  **2. Why Current Approaches Leave This Open & The Proposed Consequence**
  Existing ELK work primarily focuses on sophisticated methods to *interpret existing internals* (e.g., probes, causal scrubbing, auxiliary models with potential access to extra data). Conversely, "interpretable-by-construction" approaches avoid complex internal states altogether. Neither directly addresses whether the knowledge *could* be elicited under shift *given the constraints of the original training regime*. A successful probe trained with extra supervision doesn't prove the knowledge was latent *in the base model under shift*; it might inject new capabilities. Similarly, interpretable architectures may simply lack the capacity to form the latent state in the first place.

  **Consequence:** If a piece of knowledge is **not** shift-identifiable (i.e., no decoder meeting criteria (i) & (ii) exists), then *no post-hoc analysis technique applied to the base model's internals can reliably elicit it under shift*. The intervention must move "upstream" to modify the *training data, objectives, or architecture* to instill shift-identifiability. Elicitation capability becomes an inherent property of the training regime.

  **3. Methodology & Empirical Plan (6 Months @ 10 hrs/week)**
  *   **Month 1:** **Define Formal Framework & Toy Task.** Precisely formalize shift-identifiability mathematically (leverage control theory concepts like observability under different "measurement" functions defined by training signals). Design a minimal synthetic task: Train a small MLP to predict a composite value `Y` from inputs `X`, where `Y = F(C, Z)`. `C` is the critical latent variable (e.g., "true state"), `Z` is a confounding variable. Supervision is *only* on `Y`. Define a shift where `Z` dominates `Y`, making `Y` uninformative about `C`.
  *   **Month 2:** **Base Model Training & Shift Definition.** Implement and train base models on the synthetic task. Define specific shifted distributions (e.g., `Z` takes pathological values masking `C`). Verify base model performance degrades on `Y` under shift.
  *   **Month 3:** **Decoder Training & Testing (Synthetic).** Train simple decoders (linear probes, tiny MLPs) *using only (X, Y)* to predict `C` from base model activations *on the training distribution*. Then test these *same decoders* on activations from the *shifted distribution`. Track decoder accuracy for `C` under both distributions.
  *   **Month 4:** **Scale to Simple NLP & Analyze.** Repeat with a small transformer on a controlled text task (e.g., sentiment classification `Y` where `C` is a subtle "true reason" masked by distracting phrasing `Z`; shift involves extreme `Z`). Use dimensionality reduction to identify candidate activation subspaces for decoders.
  *   **Month 5:** **Iterate & Vary Conditions.** Experiment with varying model sizes, decoder architectures, training data quantities, and shift severities. Introduce "negative controls" (tasks where `C` is provably *not* represented robustly).
  *   **Month 6:** **Consolidate Results & Deliverable.** Analyze decoder performance differentials between training and shifted distributions. Determine under which conditions shift-identifiability holds or fails. Package the test framework and key findings.

  **Empirical Demonstration:** The core demo trains base models and decoders on the synthetic task and simple NLP task, showing decoder accuracy for `C` *collapsing* under shift for non-shift-identifiable cases (proving the criterion's utility) vs. *persisting* for shift-identifiable cases. Compute is feasible: Small MLPs/transformers, synthetic/small text datasets (e.g., crafted SST-2 subsets), training on consumer GPUs.

  **4. Possible Conclusions, Failure Modes & Deliverable**
  *   **Conclusion 1 (Supported):** Shift-identifiability is a meaningful, testable criterion. Decoders fail under shift for knowledge not embedded robustly via training, validating the need for upstream interventions. (Observed: Decoder accuracy for `C` drops significantly under shift compared to training, despite good training-distribution performance).
  *   **Conclusion 2 (Partial/Alternative):** Shift-identifiability is largely determined by model capacity/architecture, not just the training signal. (Observed: Larger models consistently show shift-identifiability even with weak supervision).
  *   **Conclusion 3 (Rejected):** Decoders can *always* be found to extract `C` under shift using only training-level supervision, making shift-identifiability trivial. (Observed: Decoders consistently achieve high `C` accuracy under shift across tasks/models).

  **Critical Failure Modes:**
  *   **Unfalsifiable Criterion:** Inability to design a non-shift-identifiable case where decoders *reliably fail* under shift within small-scale experiments (e.g., small models always leak `C` trivially, or decoders are too weak to ever learn `C` even on training data).
  *   **Ambiguous Signals:** Inability to cleanly separate decoder success/failure due to noisy activations or poorly defined `C`/shifts in more complex (NLP) tasks.
  *   **Compute Limitation:** Shifts required to break decoders are too extreme to manifest reliably or be distinguishable from noise within the budget.

  **Concrete Deliverable:** A **Test Suite for Shift-Identifiability**. This includes documented code for:
      1.  Generating synthetic tasks and controlled NLP tasks with definable latent concepts (`C`) and shifts.
      2.  Training base models under constrained supervision.
      3.  Training and evaluating decoders under criteria (i) & (ii).
      4.  Metrics comparing decoder performance on `C` across training and shifted distributions.
  This suite enables future work to assess elicitation feasibility *early* (during training regime design) and provides a benchmark for proposed "upstream" solutions.
