  ### Bertrand's Chord Paradox: Decision Tree  
  *Starting point: Three defensible methods (endpoints on circumference; radius and point along it; midpoint in disk) yield different probabilities for a random chord exceeding the side of an inscribed triangle. No method is assumed correct.*

  #### **Decision Tree**  
  Answer each question based on intuition. Use minimal calculation (e.g., one-line integral).  
  1. **Is the problem’s wording ("random chord") sufficient for a unique probability?**  
     - **Yes** → Q2  
     - **No** → Q3  

  2. **What forces uniqueness?**  
     - **Symmetry of the circle** → Q4  
     - **Indifference over a parameter** → Q5  

  3. **How resolve the under-specification?**  
     - **Specify physical process** → *Leaf: Chance-Setup*  
     - **Add math condition** → Q6  
     - **Accept no unique answer** → *Leaf: Under-Specification*  
     - **Accept multiple valid answers** → *Leaf: Permissive*  

  4. **Which transformations should preserve probability?**  
     - **Rotations/reflections of circle** → *Leaf: Rotational Invariance*  
     - **Larger group** → Q7  

  5. **Apply indifference to which quantity?**  
     - **Angle of endpoint** → *Leaf: Endpoint Indifference*  
     - **Midpoint’s distance from center** → *Leaf: Radial Indifference*  
     - **Midpoint’s position in disk** → *Leaf: Midpoint Uniform*  
     - **Chord length** → *Leaf: Length Indifference*  

  6. **Which math condition?**  
     - **Symmetry invariance** → Q4  
     - **Indifference over parameter** → Q5  
     - **Maximum entropy** → *Leaf: Maximum Entropy (Jaynes)*  

  7. **Which larger group?**  
     - **Rigid motions (rotations, translations)** → *Leaf: Rigid-Motion Measure*  
     - **Rigid motions + scalings** → *Leaf: Conformal Invariance (Jaynes)*  

  8. **Should your method work for a square?** *(Applies after Q5 or Q7; distinguishes coincident answers)*  
     - **Yes** → Method is *generalizable*  
     - **No** → Method is *circle-specific*  

  *(Groups simplified: "Rigid motions" = rotations/translations; "Conformal" adds resizing.)*  

  ---

  #### **Leaves**  
  *(Label, position, awkward commitment)*  
  1. **Under-Specification**: The problem is ill-posed; no unique answer exists. *Awkward: Fails to guide probability in geometric settings.*  
  2. **Permissive**: Many probabilities are valid; "random" is incomplete. *Awkward: No criteria to choose between options.*  
  3. **Chance-Setup**: Probability depends on physical process (e.g., tossing sticks). *Awkward: Without empirical input, probability is unknown.*  
  4. **Maximum Entropy (Jaynes)**: Maximize ignorance using symmetries (→ 1/2). *Awkward: Invokes a larger group than the circle’s symmetry.*  
  5. **Rigid-Motion Measure**: Use rigid-motion-invariant measure on lines (→ 1/2). *Awkward: Normalization depends on the circle’s size.*  
  6. **Endpoint Indifference**: Angles uniform (→ 1/3). *Awkward: Generalizes poorly to asymmetric shapes (e.g., ellipse).*  
  7. **Radial Indifference**: Distance from center uniform (→ 1/2). *Awkward: "Radial" parameter is arbitrary for non-circles.*  
  8. **Midpoint Uniform**: Midpoint uniform in disk (→ 1/4). *Awkward: Midpoint set is unnatural for irregular shapes.*  
  9. **Length Indifference**: Chord length uniform (→ 0.134). *Awkward: No process/naturalness justifies length as privileged.*  
  10. **Rotational Invariance**: Only circle rotations fix probability. *Awkward: Rotations do not yield a unique measure.*  

  *(For leaves 6-9, Q8 flags if method is circle-specific/generalizable.)*  

  ---

  #### **Coincidences & Blind Spots**  
  - **Same probability, separable by square test**:  
    - *Radial Indifference (1/2)* and *Conformal Invariance (1/2)* → Separated by **Q8 (square)**: Radial extends (define "radius"); conformal does not (square breaks scaling).  
    - *Rigid-Motion Measure (1/2)* and *Conformal Invariance (1/2)* → Separated by **sphere test**: For a "random point" on a sphere, indifference over latitude (→ 0.5) vs. surface area (→ 0.3) differ. Rigid-motion uses area; conformal may not.  
  - **Unoccupied cells**:  
    - *Length Indifference (0.134)*: Coherent but unattractive—no natural process or symmetry justifies it.  
    - *Indifference over chord direction*: Redundant (covered by rotational invariance), yields no new answer.  

  ---

  #### **Walk-Throughs**  
  - **Student A (No unique answer)**:  
    Q1: No → Q3: "Accept no unique answer" → **Leaf: Under-Specification**.  
  - **Student B (Symmetry decides)**:  
    Q1: Yes → Q2: "Symmetry" → Q4: "Larger group" → Q7: "Rigid motions + scalings" → Q8: "No (circle-specific)" → **Leaf: Conformal Invariance (Jaynes)**.  

  ---

  #### **Key: Methods Mapped to Leaves**  
  | Method                          | Leaf                       | Awkward commitment rejected by defenders? |  
  |---------------------------------|----------------------------|-------------------------------------------|  
  | Endpoints (angles)              | Endpoint Indifference      | Yes (defenders argue it generalizes well) |  
  | Radius-point (distance)         | Radial Indifference        | No                                        |  
  | Midpoint in disk                | Midpoint Uniform           | Yes (defenders see disk as natural)       |  
  | Jaynes’ invariance              | Conformal Invariance (Jaynes) | No                                     |  
  | Length indifference             | Length Indifference        | N/A (no defenders)                       |  

