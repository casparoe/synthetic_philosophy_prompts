prompt: |-
  you're a philosopher of biology who's spent way too much of your career on the function debate. think carefully, and before you write anything, brainstorm a bit about which demands people place on a theory of function are genuine desiderata and which are just the prejudices of one camp.

  I want the requirements list, not the theory. Fix the purpose up front: an account of biological function good enough to (i) license the teleological and malfunction talk that molecular biologists and clinicians actually use, and (ii) be applicable to a system before anyone knows its evolutionary history. Given that purpose, what does such an account have to deliver -- which cases must it get right, which distinctions must it not collapse, which bits of scientific practice must it not contradict?

  Cases I keep tripping over, use them or replace them: a de novo gene with no homologs that's clearly doing work in the cell; the very first bearer of a beneficial variant, before selection has had a single generation to act on the lineage; a subsystem in an engineered minimal cell that's kept in being by a designed repair loop; a trait shaped for one effect that now does a different one; a congenitally malformed heart that has never once pumped properly. And don't collapse having a function with performing it, or a function with a mere effect.

  For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or a preference. Then the part I actually care about: is some subset of them jointly unsatisfiable, so that the list itself is a result? And which single requirement knocks out the most contenders? End with a one-line-per-view scorecard for selected-effects, causal-role/organizational, and whatever hybrid you prefer -- no citations needed, I know who says what. keep it tight.
reasoning: |-
  Okay, the user is a philosopher of biology who's deep into the function debate. They want a list of requirements for a theory of biological function that serves two main purposes: it must validate how molecular biologists and clinicians use teleological and malfunction talk, and it must work without knowing evolutionary history. 

  First, I need to unpack why they're focused on these two criteria. The emphasis on actual scientific practice suggests frustration with theories that are theoretically tidy but useless at the lab bench. The pre-evolutionary-history condition hints at impatience with historical accounts that can't handle novel or engineered systems. 

  The cases they listed are revealing. De novo genes and first bearers challenge historical accounts. Engineered systems test naturalism. Repurposed traits demand functional plasticity. Malformed organs require malfunction without historical normalcy. Each case is a landmine for specific function theories. 

  For the requirements list, I'm considering strict boundaries: non-negotiable vs. preference. Non-negotiables must include malfunction possibility, function/effect distinction, and pre-history applicability - otherwise the core purpose fails. Preferences like explanatory depth matter but won't sink the theory. 

  The joint unsatisfiability angle is critical. If I can show that "malfunction without historical precedent" + "pre-history applicability" torpedoes both pure selected-effects and naive causal-role views, that explains why hybrids exist. The malformed heart case is the killer here - it requires a non-historical notion of functional design. 

  For the scorecard, I'll pit theories against the malformed heart. Selected-effects fails outright. Causal-role struggles with malfunction unless it adds a normativity source. Hybrids like Bigelow/Pargetter's propensities or Davies' organizational account fare better but have trade-offs. The takeaway: any viable theory must ground normativity in system-level persistence, not history. 

  User's framing suggests they already suspect selected-effects is inadequate but want to systematize why. By ending with the heart case as the discriminator, I'm confirming their intuition that malfunction is the litmus test.
answer: |-
  Here's a requirements list derived from your purpose and cases, separating genuine desiderata from likely prejudices:

  **Core Purpose:** An account must license actual scientific teleology/malfunction talk *and* apply pre-evolutionary-history.

  ### Non-Negotiable Desiderata (Failure here invalidates the purpose)
  1.  **Malfunction Must Be Possible:** A trait can have a function *F* while consistently failing to perform *F*.  
      *Case:* Congenitally malformed heart that never pumped properly (must have "pump blood" function despite failure).  
      *Knocks Out:* Simple dispositional accounts (if it can't do it, it's not its function), some naive causal-role views.

  2.  **Function ≠ Current Causal Contribution/Effect:** A trait's *function* must be distinguishable from its current causal effects or dispositions.  
      *Case:* Trait shaped for effect *A* (e.g., thermoregulation) now primarily doing *B* (e.g., signaling) – *A* may still be its function, *B* a beneficial effect.  
      *Knocks Out:* Overly permissive causal-role views that identify function with *any* significant current effect.

  3.  **Functionality Without Known Lineage History:** Must assign functions to traits in systems where no evolutionary history is known/available.  
      *Cases:* De novo gene (no homologs); Engineered minimal cell subsystem; First bearer of a beneficial variant *before* any selection.  
      *Knocks Out:* Pure Selected-Effects (SE) theories requiring past selection.

  4.  **Teleology Without Intentional Design:** Must ground normative "ought" (malfunction, purpose) without invoking a conscious designer.  
      *Case:* Engineered minimal cell (designer exists, but account must work for natural biology too).  
      *Knocks Out:* Theories requiring actual intentional design.

  5.  **Function/Accident Distinction:** Must differentiate what a trait is *for* (function) from what it merely *does* (accidental effect, even if beneficial).  
      *Case:* Heart sounds (effect of pumping, not its function).  
      *Knocks Out:* Views collapsing all beneficial effects into functions.

  ### Important Preferences (Pragmatic/Scientific Usefulness)
  6.  **Explanatory Relevance:** Functions should explain why the trait exists/persists in the system.  
      *Case:* Engineered repair loop maintaining a subsystem (function explains persistence).  
      *Preference, Not Strict:* Some organizational accounts focus on contribution, not existence.

  7.  **Compatibility with Etiology:** Should not *contradict* established evolutionary history when known; ideally, SE functions should be a subset.  
      *Case:* Standard adapted trait (SE function should align).  
      *Preference:* Purely forward-looking accounts might struggle here.

  8.  **Applicability to Hierarchical Systems:** Must work at multiple levels (molecular, cellular, organ, organism).  
      *Case:* De novo gene's molecular function vs. heart's organ function.  
      *Preference:* Some accounts handle specific levels better.

  9.  **Handles Functional Plasticity:** Can account for traits with multiple functions or functions that change contextually.  
      *Case:* Repurposed trait (original function vs. new effect/function).  
      *Preference:* Rigid accounts struggle.

  ### Joint Unsatisfiability & The Key Obstacle
  *   **The Core Tension:** Requirement 1 (Malfunction) + Requirement 3 (Pre-History) + Requirement 4 (Non-Intentional Normativity) is the critical pressure point. Pure SE accounts fail Requirement 3. Naive causal-role accounts fail Requirement 1 (and often 2 & 5). *Grounding normativity ("ought") in a system that hasn't been historically filtered, without a designer, is the core challenge.*
  *   **The Single Biggest Knockout:** **Requirement 3 (Functionality Without Known Lineage History)**. This immediately eliminates pure SE theories for the intended purpose. Requirement 1 (Malfunction) is the main knockout for simplistic forward-looking/dispositional accounts.

  ### One-Line Scorecard for Major Views
  *   **Selected-Effects (SE):** Fails Req 3 (Pre-History) utterly. Excellent on Req 1 (Malfunction) & 5 (Function/Accident) *when history is known*. Struggles with novelty/engineering.
  *   **Causal-Role (CR):** Excels at Req 3 (Pre-History), Req 8 (Hierarchy). Fails Req 1 (Malfunction) & Req 2 (Function≠Effect) without added normativity. Weak on Req 5 (Function/Accident).
  *   **Organizational (e.g., Mossio, Saborido, Moreno):** Strong on Req 1 (Malfunction via constraints), Req 2/5 (Function≠Effect/Accident via system-dependence), Req 3 (Pre-History), Req 4 (Non-Intentional). Explains persistence (Req 6). Compatibility with SE (Req 7) can be nuanced.
  *   **Propensity (e.g., Bigelow & Pargetter):** Forward-looking SE-lite. Handles Req 3 (Pre-History) & Req 1 (Malfunction) *contingently*. Weak on Req 5 (Function/Accident - propensity for benefit blurs line) and Req 7 (Compatibility with actual history).
  *   **Systematic Capacity (e.g., Davies):** Focuses on current systemic contribution as defining function. Good on Req 3 (Pre-History), Req 8 (Hierarchy). Can handle Req 1 (Malfunction) by defining systemic norms. Better on Req 2/5 than simple CR, but distinction can be fuzzy.

  **Result:** The list highlights that **any viable account for your purpose must provide a non-historical, non-intentional source of normativity** (to ground malfunction) applicable to novel and engineered systems. Organizational accounts explicitly tackle this, making them strong contenders. Pure SE fails the core purpose. CR requires significant augmentation to meet the non-negotiable demands.
