prompt: |-
  You are a professional philosopher specialising in philosophy of medicine and bioethics. Please think carefully about the following problem: before settling on an answer, spend a moment brainstorming several candidate principles and the cases that tell against each of them, then present the one or two that survive. Write your answer in British English.

  I have been trying to work out what I actually think about the therapy/enhancement distinction, and my verdicts on cases keep slipping out of the grip of the principle I was taught. The principle I was working with: an intervention is therapy when it restores or protects a capacity to within the range of species-typical functioning for a healthy person, and enhancement when it improves a capacity beyond what that individual's species-typical functioning would have given them; therapy is what we owe one another through publicly funded healthcare, while enhancement is a matter of private choice that the state may permissibly leave unfunded.

  My verdicts, case by case:

  1. A cochlear implant for a congenitally deaf two-year-old, with parental consent: therapy, should be publicly funded — though I am uneasy about saying a family is obliged to accept it.
  2. Corrective lenses for short sight: therapy, and publicly funded. Obvious, even though the level being restored is set partly by what a literate society demands of eyes.
  3. Growth hormone for a healthy child predicted to be extremely short, with no other pathology: enhancement, and I am uneasy about it; I would not fund it publicly. If the child were short because of a diagnosable hormone deficiency, I call it therapy and fund it — even though the treatment and the outcome are the same.
  4. A prosthetic leg that lets an amputee walk and also run faster than any unmodified human: I want to call this therapy and fund it, even though it takes the person above species-typical functioning.
  5. A safe drug that cuts a healthy adult's required sleep from eight hours to four with no other effects: enhancement, and I am untroubled by it — more untroubled than I am by the growth hormone case, which seems backwards, since the child cannot consent and the adult can.
  6. Private tutoring for my own child: enhancement, positional, and I am entirely untroubled by it in a way I am not by the sleep drug, which also seems backwards.
  7. A drug that blunts the emotional intensity with which a frightening memory is reconsolidated, given to a trauma survivor in the days after the event: therapy, fine, publicly funded.
  8. The same drug given to someone six months into an ordinary bereavement, whose grief is severe but not diagnosable as a disorder: not therapy — I would withhold it — even though it would restore their functioning to normal sooner.
  9. A vaccine: prevention, publicly funded, obviously fine. But now consider an immune booster that lifts immune responsiveness above anything found anywhere in the population, protecting against a novel pandemic. By my principle this is enhancement and therefore private business, yet that verdict feels wrong to me: it seems like exactly the sort of thing public health should fund.

  Is there a principle in this neighbourhood that delivers all of these, or do some of my verdicts have to go? Please: state the best one or two candidates precisely, clause by clause, naming the case that motivates each clause; give their verdicts on cases I have not listed — in particular, on gene editing in embryos to raise general cognitive ability, and on cases where we could either modify the person or modify the environment instead (a ramp versus a mobility device, say, or acoustic treatment of a classroom versus attention medication); and tell me plainly which of my verdicts no single principle in this family can accommodate, and why. I would also like to know whether I am really asking one question or two that I have been running together — whether the line between therapy and enhancement, once drawn correctly, does any of the funding and permissibility work I have been expecting it to do.
reasoning: |-
  Hmm, the user is grappling with the therapy/enhancement distinction in bioethics. They've shared a principle they were taught - that therapy restores to species-typical functioning while enhancement exceeds it - but their intuitive judgments on various cases contradict this principle. They want to know if there's a better principle that can accommodate all their intuitions, or if some verdicts need revision.

  Looking at their cases: The cochlear implant for a deaf child feels like therapy but makes them uneasy about obligations. Corrective lenses are straightforward therapy. Growth hormone is enhancement for healthy short children but therapy for those with deficiencies - even with identical outcomes. The super-prosthetic that enables beyond-human running is therapy to them. The sleep-reduction drug feels like enhancement but less troubling than growth hormone. Private tutoring is enhancement but unproblematic. The trauma drug is therapy immediately post-event but not for normal grief months later. Vaccines are fine, but immune boosters above natural levels feel like they should be public health priorities despite technically being enhancement.

  I need to analyze why their principle fails. The species-typical functioning standard clearly doesn't work when they approve of the super-prosthetic (case 4) and the super-immune booster (case 9). The growth hormone case (3) reveals they care about underlying pathology, not just outcomes. The trauma timing issue (7 vs 8) shows temporal context matters. Their differing comfort levels with tutoring versus sleep drugs suggest they're weighing positional advantages versus absolute benefits.

  Two better principles emerge: First, a "functional restoration" approach focusing on whether an intervention restores agency or relieves significant disadvantage relative to social participation norms. Second, a "public good" approach that separates the therapy/enhancement question from funding decisions, focusing instead on whether interventions provide non-positional public health benefits or correct unjust disadvantages.

  For unmentioned cases: Gene editing for cognitive enhancement would likely be enhancement under both principles - privately permissible but not publicly funded unless addressing specific disadvantages. Environmental modifications (ramps vs mobility devices) would generally be preferred as more inclusive solutions under the functional restoration principle.

  The key revelation is that they've conflated two distinct questions: the descriptive therapy/enhancement distinction and the normative funding/permissibility question. Their intuitive discomforts arise because these don't map neatly onto each other. The growth hormone case (3) is particularly resistant to any single principle because it exposes how arbitrary pathology distinctions can be when outcomes are identical. This suggests they may need to accept some inconsistency or develop a more sophisticated framework that acknowledges the role of social constructs in defining pathology.
answer: |-
  Your intuitive verdicts reveal deep tensions within the species-typical functioning framework. After testing multiple principles against your cases, two complementary approaches survive scrutiny. Neither perfectly captures every intuition (especially Case 3), but together they explain most judgements while exposing why funding/permissibility cannot rely solely on the therapy/enhancement distinction.

  **Surviving Principle 1: Functional Restoration Relative to Social Agency (The "Capability Threshold" Principle)**  
  *An intervention is therapeutic if it restores or protects an individual’s capacity to function within the minimally sufficient range required for basic social agency and participation in their societal context. Enhancement improves function beyond this threshold. Public funding obligations arise primarily for therapeutic interventions that meet urgent welfare needs or prevent significant disadvantage.*  

  - **Motivated by:**  
    - Case 2 (corrective lenses): Restores capacity to navigate a literate society—a *socially-determined* threshold, not species-typical vision.  
    - Case 7 vs. 8 (trauma drug): Immediate post-trauma use restores agency (therapy); later use accelerates natural grieving beyond minimal function (enhancement).  
    - Case 9 (immune booster): Protection against novel pandemics preserves social participation—thus publicly fundable *even if* "enhancing" beyond typical.  
    - Case 4 (prosthetic leg): Walking is essential for agency; running faster is incidental to the core therapeutic purpose.  

  **Surviving Principle 2: Non-Positional Public Good (Funding Corollary)**  
  *Public funding is justified when an intervention:  
  (a) Addresses a significant threat to welfare that the individual cannot reasonably avoid or mitigate alone, AND  
  (b) Provides non-positional benefits (i.e., improves absolute welfare without primarily disadvantaging others) OR corrects unjust systemic disadvantage.*  

  - **Motivated by:**  
    - Case 6 (tutoring): Positional advantage (enhancement) creates zero-sum competition—no public funding obligation.  
    - Case 5 (sleep drug): Privately permissible enhancement (non-harmful, consensual) but lacks urgent welfare threat—no public funding.  
    - Case 1 (cochlear implant): Addresses unavoidable disadvantage (congenital deafness in an auditory-world); funding justified even if refusal is permissible.  

  **Verdicts on New Cases:**  
  - *Gene editing for cognitive ability in embryos:*  
    - **Capability Threshold:** Enhancement (exceeds minimal agency threshold).  
    - **Public Good:** Not fundable—cognitive enhancement is positional (risks exacerbating inequality) and lacks urgent welfare threat.  
  - *Ramp vs. Mobility Device / Acoustic Treatment vs. Medication:*  
    - **Capability Threshold:** Both ramp/acoustic treatment *and* mobility/medication restore function to agency threshold → **both are therapy**.  
    - **Public Good:** Environmental modifications (ramps, acoustic treatment) are *preferable* for public funding—they are non-stigmatising, universally accessible, and address systemic barriers.  

  **Which Verdicts Resist Reconciliation?**  
  - **Case 3 (Growth Hormone)** remains irreconcilable:  
    - Identical treatment/outcome is called therapy for pathology but enhancement for idiopathic short stature. No *functional* distinction exists. Your intuition prioritises **diagnostic labels over functional outcomes**, revealing the framework’s dependence on socially constructed "pathology" (e.g., hormone deficiency = "disease"; idiopathic shortness = "normal variation").  
    - *Why no principle captures this:* Distinguishing therapy/enhancement by pathology status is arbitrary when functional impact is identical. Only a **normative commitment to treating "disease" as special** explains this—but "disease" itself lacks a principled definition.  

  **Your Two Questions, Untangled:**  
  You have conflated:  
  1. **Descriptive Question:** *What distinguishes therapy from enhancement?*  
     → Answer: **Capability Threshold Principle** (restoring agency vs. exceeding it).  
  2. **Normative Question:** *When should society fund/permit interventions?*  
     → Answer: **Public Good Principle** (urgent welfare threat + non-positional benefit/correction of disadvantage).  

  The therapy/enhancement distinction **cannot do the normative work alone**:  
  - Therapy isn’t *automatically* fundable (e.g., costly "me-too" drugs for minor symptomatic relief).  
  - Enhancement *can* be fundable if it serves public good (Case 9’s immune booster).  
  - Permissibility depends on consent, risk, and justice—not just category (e.g., consensual adult sleep drug = permissible; non-consensual growth hormone for child = uneasy).  

  **Conclusion:** Your intuitions reflect a hybrid model. **Therapy** is defined by restoring agency in a social context; **public funding** requires addressing urgent, non-positional welfare threats. Abandon species-typical functioning—it fails Cases 4 and 9. Case 3 exposes pathology’s social construction, not a flaw in your reasoning. For policy, prioritize interventions that: (1) meet capability thresholds, and (2) maximize equitable, non-positional benefits.
