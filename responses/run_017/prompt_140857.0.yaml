answer: |-
  Here are the five points addressing the gap you described:

  1.  **Term:** This gap is often called the **functional utilization gap**, highlighting the distinction between a state being *manipulable* to cause behavior and being *used functionally* by the model during standard inference.
  2.  **Nature:** It's primarily a difference in **kind** concerning the causal role: manipulability shows potential causal influence, while functional utilization requires the state to play a necessary causal role within the model's *own* computation pathways on relevant inputs.
  3.  **Rare Use:** A state that is inert on most inputs but is genuinely read off and causally contributes to the output on specific, relevant inputs **does count as a representation**; its functional utilization is context-dependent and tied to specific computational needs.
  4.  **Key Experiment:** To settle functional utilization, perform **ablation during normal operation**: precisely inhibit or alter the specific state/feature *only when the model naturally activates it* on relevant inputs and observe if the *expected* downstream output behavior degrades as predicted.
  5.  **Core Distinction:** The critical test is whether the state is causally necessary *for the model's own processing* on inputs where the represented concept is relevant, not just whether it *can* be made to influence the output via artificial intervention.
