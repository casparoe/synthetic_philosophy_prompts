  Looking at their debate, Dana consistently argues from a Foucauldian perspective that the app represents disciplinary power even without managers watching. Raj counters that without asymmetry of visibility and sanctions, this stretches the concept too thin. Their debate touches on key Foucault concepts like disciplinary power, panopticism, technologies of the self, and productive power.

