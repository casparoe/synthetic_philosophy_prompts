  The replay case is particularly tricky given Borges' stories about identical lives ("The Other"), dream hierarchies ("The Circular Ruins"), and the paralyzing nature of total memory ("Funes the Memorious"). I need to consider whether he'd see replayed lives as identical, separate, or meaningless without a subject.

  For the quantum simulation, I should distinguish between the atemporal branch coexistence (which mirrors his view) versus the anthropic "all lives lived" interpretation (which he'd reject). The story he'd write might involve scholars discovering the simulation is actually consuming their reality.

