  ### Principle Development for Artifact Politics

  After analyzing your cases and Winner's framework, I propose a principle that distinguishes artifacts with inherent politics from those with contingent social effects. The core tension lies in avoiding overgeneralization (where "everything is political") while capturing both intentional design and systemic consequences. My principle:

  **Principle:** An artifact has politics when its design (material form, functionality, or embedded rules) *inherently necessitates* or *structurally incentivizes* an asymmetric distribution of power, risk, or access that (a) would be democratically contestable, (b) resists revision through ordinary use, and (c) cannot be negated without altering the artifact itself.

  ### Breakdown of Clauses
  | Clause | Motivating Case | Work It Does |
  |--------|-----------------|--------------|
  | Design inherently necessitates or structurally incentivizes | Tomato harvester (requires large-scale farming; disincentivizes small growers) | Excludes artifacts with contingent effects (e.g., shipping container) |
  | Asymmetric distribution of power, risk, or access | Parkway overpasses (asymmetric access to public space) | Focuses on distributive injustice, not neutral efficiency gains |
  | Democratically contestable | Hospital records (billing codes dictating care priorities) | Filters out non-controversial artifacts (e.g., roundabouts) |
  | Resists revision through ordinary use | Voting machine (no paper trail locks in verification opacity) | Excludes flexible artifacts (e.g., rearrangeable furniture) |
  | Cannot be negated without altering artifact | Bolted seating (enforces hierarchy unless physically removed) | Separates politics embedded in design from context-dependent use |

  ---

  ### Case Verdicts Under This Principle
  | Case | Verdict | Why |
  |------|---------|-----|
  | Hospital records | Political | Design necessitates billing code selection, asymmetrically prioritizing administrative power over clinical judgment; contestable and hard to opt out of |
  | Voting machine (no paper trail) | Political | Design structurally incentivizes central control over verification; asymmetric power distribution; irreparable without redesign |
  | Speed bumps | Political | Material form enforces traffic control asymmetrically (benefits residents, burdens adjacent streets); contestable and fixed |
  | Roundabouts | Not political | Symmetric cost/benefit (all users yield equally); safety gains not democratically contestable |
  | Tomato harvester | Political in a weaker sense | Design structurally incentivizes (not necessitates) farm consolidation via economies of scale; contestable but revisable (e.g., co-op models) |
  | Shipping container | Not political | Efficiency gains symmetric; labor impacts contingent on economic systems, not design |
  | Bolted lecture seating | Political | Material form necessitates hierarchical pedagogy; contestable and irreparable without removal |
  | Glued-in battery | Political | Design necessitates manufacturer control over repair; asymmetric power/resource distribution; irreparable without redesign |

  ---

  ### Overturned Verdicts
  | Case | Your Verdict | My Verdict | Why I Overrule |
  |------|--------------|------------|---------------|
  | Glued-in battery | Not political | Political | Design *necessitates* asymmetric repair access (power to corporations), satisfying all principle clauses |
  | Roundabouts | Unsure ("not political" but weak defense) | Not political | Symmetric costs/benefits; no uncontestable asymmetry |
  | Tomato harvester | Political (weak flavor) | Political in a weaker sense | Incentivizes but doesn’t *necessitate* exclusion; revisable via policy |

  ---

  ### Unlisted Cases
  | Case | Predicted Verdict |
  |------|-------------------|
  | Facial-recognition turnstile at stadium | Political: Necessitates biometric surveillance; asymmetric power (venue vs. attendees); contestable; irreparable without removal |
  | Algorithm scoring student essays | Political: Structurally incentivizes standardized assessment biases; asymmetric power (algorithm vs. students); contestable; unalterable without redesign |
  | Shared city bikes (e.g., Citi Bike) | Not political: Access symmetric; pricing adjustments possible without altering bikes |

  ---

  ### Mesh-Network App Verdict
  - **Verdict:** Not political  
  - **Confidence:** 0.8  
  - **What Would Settle It:** If the app’s protocol *inherently favored* one political outcome (e.g., encryption that only benefits protesters). Current design is polyvalent—politics emerge from *assemblage* (users + context), not the artifact alone.  

  ---

  ### What Would Change My Mind
  1. **If roundabouts were proven to disproportionately burden disabled drivers:** Would force adding "disproportionate impact" as a core clause.  
  2. **If shipping containers required union suppression to function:** Would shift verdict to "political" by proving design *necessitates* asymmetry.  
  3. **If tomato harvester couldn’t operate in small-farm contexts:** Would upgrade to "political" by proving *necessity* (not just incentive).  

  ---

  ### Weakest Step  
  The clause "structurally incentivizes" risks overextension (e.g., could implicate all efficient tools). It holds only because:  
  - Paired with "asymmetric distribution" (e.g., harvester’s efficiency *only* harms small growers).  
  - Anchored to "democratically contestable" (e.g., container’s efficiency isn’t contested; harvester’s externalities are).  
  If asymmetry/contestability fails, the principle collapses into overgeneralization.  

