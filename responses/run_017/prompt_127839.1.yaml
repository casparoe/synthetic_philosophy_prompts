   Let's consider the cases:

   1. Hospital electronic records requiring billing code: Strongly political. It embeds a bureaucratic requirement into the workflow, shaping behavior and priorities.

   2. Voting machine without paper trail: Strongly political. It affects the fundamental democratic process by making verification impossible, thus centralizing control and reducing transparency.

   3. Speed bumps: Political. They enforce a traffic rule without human discretion and shift the burden to adjacent streets.

