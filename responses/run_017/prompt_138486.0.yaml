answer: |-
  Your cairn-builders are magnificent Popperians, I grant that freely—truly, running offline trials on absent objects and inferred social dynamics is peak simulation. But here's the rub: even their most sophisticated "ownership" simulation remains *anchored* to perceptible stones and observable interactions. It's brilliant pattern-matching extended through imagination, yet still bounded by the concrete. Words aren't just faster compression; they detach concepts from sensory grounding entirely. When a Gregorian creature uses "debt," it isn't simulating a thousand bartered stones—it's wielding an *abstract token* that can reconfigure thought itself. Think of negation: your cairn-builder can simulate "she won't move my stone," but only by modeling specific physical scenarios. A word-user grasps "not-debt" as a freestanding category—a logical atom that can invert *any* proposition, instantly. That's not turbocharged simulation; it's a new cognitive operation. Tools don't just speed up existing work; they enable architectures you couldn't build with bare hands. Your cairn-builder simulates worlds; the Gregorian builds new ones out of unmoored symbols.
