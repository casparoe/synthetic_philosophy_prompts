  ### **Important Notes**  
  - **"Nobody is helped" (D) vs. Parental discretion (C)**: These share answers (e.g., Q1=B, Q2=B) **except Q11**:  
    - D says Q11=A (duty to fix if same child exists).  
    - C says Q11=B (no duty even if same child).  
    - *This split isolates the non-identity problem*.  

  - **Incoherent/unattractive combinations**:  
    - **Q1=A + Q3=B**: Claims duty to avoid disease but denies benefit when a different child exists (logically inconsistent; nobody holds this).  
    - **Q2=A + Q6=B**: Claims duty to enhance (e.g., height) but rejects selecting for deafness without citing disability (arbitrary; rare).  
    - **Q4=B/C + Q11=A**: Says editing is problematic but endorses it in the "same child" case (unexplored).  

  - **E (insult) and F (anti-design)**: These can overlap with other leaves (e.g., E with B). The quiz flags E via Q12 and F via its pattern.  

  - **State involvement**: Not a leaf—use Q9/Q10 to modify positions:  
    - **Pro-state**: Q9=A (subsidy) ± Q10=A (mandate).  
    - **Anti-state**: Q9=B/C ± Q10=B/C.  

  - **"Unnamed" leaf**: None—all positions are held by real theorists.  

