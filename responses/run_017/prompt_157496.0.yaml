  Below is a classification instrument designed to sort debaters into specific positions on embryo selection based on their responses to concrete cases. It uses 12 scenarios with 2–3 answer choices each, avoiding jargon and complex biology. The scoring key maps answer patterns to seven distinct "leaves" (positions), flags combinations that don't align with real-world views, and isolates the "nobody is helped" position using a hypothetical "same child" question (Q11).  

  ---

  ### **Embryo Selection Quiz: Which View Do You Hold?**  
  **Instructions:** For each scenario, pick the answer closest to your view. Answer quickly—don’t overthink!  

  1. **Serious disease**: A couple using IVF has embryos with/without Tay-Sachs disease (fatal by age 5). Should they choose the disease-free embryo?  
     - A. **Yes, they must—it’s cruel not to.**  
     - B. **Yes, but only to avoid severe disease—not for other traits.**  
     - C. **No—it’s entirely their choice.**  

  2. **Enhancement**: The same couple can choose an embryo likely to be taller (giving social advantages). Do they have a duty to pick it?  
     - A. **Yes—if it improves the child’s life, they must.**  
     - B. **No—avoiding disease is the only duty. This is optional.**  
     - C. **No—traits like this shouldn’t be selected at all.**  

  3. **Different child dilemma**: A couple has embryos: one with lifelong chronic pain (manageable, life still worth living), one without. If they pick the healthy embryo, the pained child never exists. Is picking the healthy one required?  
     - A. **Yes—it’s better to create a child with a better life.**  
     - B. **No—the pained child isn’t harmed by not being chosen (they wouldn’t exist otherwise).**  
     - C. **No—selection for any trait is wrong.**  

  4. **Editing vs. discarding**: A couple has one embryo with a fatal disease. They can discard it and implant a healthy one, or edit its genes to cure it. Is editing better?  
     - A. **No difference—both avoid disease.**  
     - B. **Editing is better—it doesn’t discard a potential life.**  
     - C. **Editing is worse—it alters the child’s identity.**  

  5. **Sibling’s needs**: Parents have a violent older child. They pick a calm-temperament embryo for their next child to stabilize the home. Acceptable?  
     - A. **Yes—the family’s well-being matters.**  
     - B. **No—selection should only benefit the child being born.**  
     - C. **No—children shouldn’t be designed to serve others.**  

  6. **Deaf couple**: A Deaf couple wants to select a deaf embryo to share their culture. Hearing embryos are available. Is this okay?  
     - A. **Yes—parents should choose based on their values.**  
     - B. **No—deafness is a disability; pick hearing for the child’s sake.**  
     - C. **No—intentionally creating disability is wrong.**  

  7. **Environmental misfit**: A gene causes extreme night-owl tendencies (disruptive with 8am school but neutral/beneficial in night-shift jobs). Parents with early schedules avoid this gene. Should they?  
     - A. **Yes—it’s a problem in their current environment.**  
     - B. **No—the trait isn’t inherently bad; environments can change.**  
     - C. **No—selecting against it insults night-owl people.**  

  8. **Future generations**: A gene doesn’t harm the child but increases their future children’s risk of a serious disease. Should parents avoid it?  
     - A. **Yes—it prevents harm to grandchildren.**  
     - B. **No—only the child being born matters.**  
     - C. **No—we can’t predict future needs.**  

  9. **State subsidy**: Should governments fund embryo screening for fatal diseases (no mandates)?  
     - A. **Yes—it helps parents avoid suffering.**  
     - B. **No—the state shouldn’t incentivize selection.**  
     - C. **No—it devalues people with disabilities.**  

  10. **State mandate**: Should governments require screening to avoid implanting embryos with fatal diseases?  
      - A. **Yes—suffering must be prevented.**  
      - B. **No—parents should decide.**  
      - C. **No—all selection should be banned.**  

  11. **Same child scenario (critical for "nobody helped" view)**: Imagine tech can painlessly cure Tay-Sachs in an embryo—the same child is born either way. Must parents use it?  
      - A. **Yes—it directly helps that child.**  
      - B. **No—parents decide, even if it helps.**  
      - C. **No—modifying embryos is wrong.**  

  12. **Insult to existing people**: A celebrity avoids a dyslexia gene via screening. Dyslexic people feel this implies their lives are less valuable. Valid concern?  
      - A. **Yes—this sends a harmful message.**  
      - B. **No—parents can prioritize their child’s interests.**  
      - C. **No—public statements aren’t relevant.**  

  ---

  ### **Scoring Key: Map Your Answers to a Position**  
  Use your answers to find your primary "leaf" below. Positions are mutually exclusive—pick the **best fit**.  
  - **💡 Key splits**:  
    - Q3/Q11 separates "nobody is helped" (D) from parental discretion (C).  
    - Q1/Q2 separates strong maximizing (A) from threshold (B).  
    - Q12 flags the "insult" view (E).  

  | Leaf (Position)                           | Required Answer Pattern                                  | Notes                                                                 |
  |-------------------------------------------|----------------------------------------------------------|-----------------------------------------------------------------------|
  | **A. Strong maximizing duty**             | Q1=A, Q2=A, Q3=A, Q11=A                                 | Duty to pick the *best* expected life (disease + enhancement).       |
  | **B. Threshold duty**                     | Q1=A, Q2=B, Q3=A, Q11=A                                 | Duty only to avoid serious disease—no duty for enhancements.         |
  | **C. Pure parental discretion**           | Q1=B/C, Q2=B/C, **Q3=B, Q11=B**                         | No duties—parents choose freely.                                     |
  | **D. Nobody is helped**                   | **Q3=B, Q11=A** (and usually Q1=B/C, Q2=B/C)            | Different child = no benefit/duty to select.                         |
  | **E. Insult to existing people**          | **Q12=A** (plus any other pattern except F)             | Primary objection is harm to current people with deselected traits.  |
  | **F. Kids shouldn’t be designed**         | **Q1=C, Q2=C, Q11=C** (and often Q3=C, Q6=C, Q10=C)     | Moral opposition to all selection/editing (non-consequentialist).    |
  | **State involvement split**               | Q9 and Q10: Pro-state = A/A or A/B; Anti-state = B/B or C/C | Not a standalone leaf—modifies A-D.                                |

