prompt: |-
  You are a professional philosopher who works at the intersection of applied ethics, decision theory under deep uncertainty, and agricultural economics -- someone who has actually had to advise an institution that buys food, not someone who writes about food ethics from the armchair. Please think carefully and at length. Before you write anything in final form, spend some time brainstorming: list the ways a naive version of this procedure would go wrong (optimizing a proxy, double counting, comparing a real change against an idealized baseline instead of the actual alternative, pretending the deep uncertainties are point estimates, quietly baking in a controversial value judgment as if it were a fact), discard the ones that turn out not to matter for my situation, and then write the version that survives your own objections. Where you end up rejecting a view I have clearly been tempted by, steelman it before you reject it. Write the whole thing in American English.

  The situation: I direct menu planning and procurement for the dining system of a state university system. Twenty-two campuses, roughly forty-five thousand meals a day during term, one central menu cycle that we re-cut twice a year, and essentially all purchasing routed through a single regional broadline distributor. My constraints are fixed and non-negotiable: a hard ceiling on cost per meal; federal-style nutrition standards including protein and iron minimums; binding accommodation obligations (a halal station, a kosher station, a substantial vegetarian South Asian line, and medically prescribed diets); a student-government resolution instructing us to reduce the animal footprint of campus dining without specifying what that means; a faculty sustainability committee that pushes local and pasture-raised sourcing; and a board of trustees that will want to see the reasoning in writing, because whatever we do will be described in a press release either way.

  I have been reading the rationalist and effective-altruism blogs since the Sequences era, so I have seen the standard moves: the post arguing that crop cultivation kills field animals and therefore vegetarianism may not help, the reply about trophic levels and feed conversion, the beef-versus-chicken tradeoff where chicken means far more individual animals with worse lives while beef means far more land and feed. I do not need to be walked through any of that. What I do not have, and what I cannot write myself, is anything I can hand to a coordinator with a bachelor's degree in nutrition and no philosophy and no economics, who has about fifteen minutes per candidate menu change and has to produce a written justification.

  So: give me a decision procedure. A numbered sequence of questions, in the order they must be asked, each with an explicit statement of what counts as a sufficient answer to it, each with a stated gate at which the procedure stops and returns a no, and each flagged either as a factual question my staff can answer or as a values question that must be handed to a named human (me, or the board) rather than settled by the procedure. It has to be usable by someone who has never heard of fungibility or expected value, and it has to be auditable -- a reviewer should be able to see which gate a proposal died at.

  There are three features of my situation that I think break the naive versions, and the procedure has to contain a test for each rather than a footnote:

  One, our purchases are lumpy. We buy in whole cases through a distributor who reallocates inventory across its other clients, and we sign forward commitments by category. A cut of three percent in chicken volume may have literally no effect on anyone's production decisions; a cut that drops us below a contract tier might have a large one. I need a step that separates changes that are real at the level of the supply chain from changes that are real only on a spreadsheet, and a rule for what to do when a change is currently below threshold.

  Two, students are not obliging. If they reject the swap, some of them buy food off campus, and some of it goes into the bin. Both of those can make a change worse than doing nothing, since an animal may then have been raised and slaughtered to feed no one, or to feed someone at a different restaurant where the item is worse. I need the procedure to treat participation and plate waste as part of the causal chain rather than as an implementation detail, and to say what evidence would be sufficient at the point where we cannot yet measure them.

  Three, the uncertainties are not the ordinary kind. Moral weight across taxa, and the number of field animals killed per hectare of a given crop, are uncertain by orders of magnitude rather than by a factor of two, and reasonable people in this space disagree about the right attitude to take toward that. I want the procedure to be robustness-based rather than expected-value-over-guessed-numbers: it should prefer changes that look good across the whole plausible range and reject those that look good only in the middle of it, it should say explicitly what to do when nothing dominates, and it should never present a contested value judgment -- for example, whether the deaths of wild animals on spared land are a cost, a benefit, or neither -- as a finding.

  The procedure should also keep separate, and require the staffer to fill in separately, at least these buckets: animals farmed and killed per serving and the quality of their lives; animals killed by the crop production that feeds them, with the reminder that plant proteins have a crop footprint too, so the relevant question is magnitude and not kind; the effects of land use and land-use change on wild animals; and wild-caught seafood, which is a case of killing wild animals directly rather than farming them, and which brings bycatch and abandoned gear with it.

  Then run the finished procedure on three live proposals, showing your work at each gate and telling me where it stops or hands off:

  The first is replacing ground beef with chicken thigh in our two highest-volume entrees, which is what the student government assumes is the obvious win.

  The second is a donor-funded weekly grass-fed local beef burger night, marketed as the ethical and sustainable option, which the faculty committee loves and which I suspect is the exact opposite once land use is on the ledger.

  The third is moving the default hot line to a fish and shrimp option two days a week, which is being floated as the compromise everyone can sign on to.

  At least one of these, I expect, will come back with an answer I will not like, and I would rather be told now than in the press release; please say plainly which one and why. Close by telling me what the procedure cannot do, where it will systematically misfire, and which two or three empirical facts the answers are most sensitive to -- so that I know what is actually worth sending someone out to measure with our own invoices, our distributor's spec sheets, and our own plate-waste audits, rather than guessing at.

  Do not cite literature, do not give me a bibliography, and do not supply any figure you would have had to look up. I want the structure of the reasoning, and wherever a number is required I want to know what kind of number it is, whether we can obtain it from our own records, and how the procedure behaves when we cannot.
reasoning: |-
  Okay, let me tackle this complex request. The user needs a practical decision procedure for evaluating menu changes that balances multiple ethical and operational constraints. 

  First, I need to consider the unique aspects of their situation: lumpy purchases through a distributor, unpredictable student behavior affecting actual consumption, and deep uncertainties in environmental and ethical calculations. The standard EA arguments they're familiar with won't suffice here - they need something operational.

  The core challenge is designing a procedure that:
  - Separates real supply-chain impacts from accounting artifacts
  - Accounts for plate waste and substitution effects
  - Handles order-of-magnitude uncertainties robustly
  - Maintains clear buckets for different impact categories
  - Remains usable by non-specialist staff

  I'll structure it as a gated decision tree with explicit stopping points. Each gate must specify:
  - The precise question being asked
  - What constitutes sufficient evidence
  - Who is responsible for answering (staff vs leadership)
  - Clear pass/fail criteria

  For the three test cases:
  1. Beef-to-chicken swap seems obvious but may fail on animal welfare grounds when considering individual suffering
  2. Local grass-fed beef might actually increase land use impact despite perceptions
  3. Seafood option introduces wild-caught complications and bycatch issues

  The procedure should flag when impacts are too uncertain or values-laden for staff to decide, kicking those to leadership. It must also distinguish between changes that actually reduce production versus those that just shift inventory around.

  Most importantly, it should never present contested value judgments as facts - like whether wild animal displacement counts as harm. And it must be robust across reasonable uncertainty ranges rather than relying on precise estimates.

  The biggest sensitivities will likely be:
  - Actual supply chain impacts of marginal purchases
  - Student acceptance rates for substitutions
  - Plate waste measurements
  - Bycatch ratios for seafood

  These are where actual measurement would pay off versus using generic data.
answer: |-
  Here is a decision procedure designed for your operational constraints, followed by application to your three proposals. It prioritizes robustness, auditability, and separation of factual vs. value judgments.

  **Decision Procedure: Evaluating Menu Changes for Ethical Sourcing Impact**

  **Core Principle:** Only changes that *demonstrably alter production practices* and *withstand deep uncertainty* while meeting core constraints may proceed. All claims require evidence tiered to availability (e.g., distributor data > peer-reviewed study > industry average).

  **Pre-Step: Feasibility Gate**
  *   **Question:** Does this change violate hard constraints (cost per meal, nutrition standards, accommodation obligations)?
  *   **Evidence:** Costing sheet comparison; nutritional analysis; accommodation compliance check.
  *   **Sufficient Answer:** Staff verifies "no violation" using standard tools. *If violation is found, STOP. Output: "No - Constraint Conflict."*
  *   **Responsibility:** Staff (Nutrition Coordinator).

  **Gate 1: Supply Chain Causality**
  *   **Question:** Will this change *very likely* cause a net reduction in the supplier's aggregate orders for the targeted input(s) within 12 months?
  *   **Evidence:** Distributor confirmation of volume threshold impact; contract tier analysis; historical data on distributor responsiveness to similar changes.
  *   **Sufficient Answer:** Staff demonstrates *one* of:
      *   Change crosses known distributor volume threshold triggering contract renegotiation/demand signal.
      *   Distributor explicitly confirms the change will reduce their orders from producers.
      *   Historical data shows similar changes led to measurable order reductions.
  *   **If No:** *STOP. Output: "No - No Likely Supply Chain Impact."* (Change is spreadsheet-only).
  *   **If Uncertain/Below Threshold:** *HAND OFF to Director.* Director decides if change is a strategic step towards future thresholds or if bundled changes are feasible. *Output: "Hold for Director Strategy" or "No".*
  *   **Responsibility:** Staff (Procurement Officer) for evidence gathering; Director for uncertain/below-threshold cases.

  **Gate 2: Student Acceptance & Waste Mitigation**
  *   **Question:** Is there *strong evidence* that students will consume the new option at a rate comparable to the replaced option, minimizing off-campus substitution and plate waste?
  *   **Evidence:** Pilot study data; historical data on similar swaps; student surveys with revealed preference focus; plate waste audits of comparable items.
  *   **Sufficient Answer:** Staff demonstrates *one* of:
      *   Pilot study shows <10% drop in uptake and <15% increase in plate waste vs. baseline.
      *   Historical data on highly similar swaps shows stable consumption/waste.
      *   High-confidence survey (e.g., pre-commitments) combined with low waste for ingredient type.
  *   **If No/Insufficient Evidence:** *STOP. Output: "No - High Rejection/Waste Risk."*
  *   **If Uncertain:** *HAND OFF to Director.* Director assesses risk tolerance and potential mitigation (e.g., marketing). *Output: "Proceed with Mitigation Plan" or "No".*
  *   **Responsibility:** Staff (Menu Coordinator + Sustainability Intern for audits/surveys); Director for uncertain cases.

  **Gate 3: Robust Impact Assessment (Using Pre-Defined Buckets)**
  *   **Question:** Across the *plausible range* of uncertainty for each impact bucket, is the change *very likely* beneficial (B) in at least one bucket AND *not very likely harmful* (H) in any bucket? (Beneficial = Reduces harm; Harmful = Increases harm. "Very likely" = >80% chance across plausible range).
  *   **Buckets & Key Uncertainties (Plausible Range):**
      1.  **Farmed Animal Welfare (FAW):** Animals farmed/killed per serving & life quality score. (*Uncertainty: Lives/calorie ratios & welfare scores vary 2-10x*).
      2.  **Crop Production Mortality (CPM):** Field animals killed for feed/protein crops. (*Uncertainty: Deaths/hectare vary 10-100x by crop/region*).
      3.  **Land Use Impact (LUI):** Wild animal displacement/biodiversity loss from land use/change. (*Uncertainty: Impact/spared hectare varies 10-1000x*).
      4.  **Wild Fisheries Impact (WFI):** Wild fish/shrimp killed & bycatch/gear loss. (*Uncertainty: Bycatch ratios vary 2-50x; stock sustainability varies*).
  *   **Evidence:** Staff fills buckets using best available data, always stating the *range* (min, max, best guess) and source:
      *   FAW: Lives/serving (distributor specs, FAO data), Welfare score (certification audits, peer-reviewed welfare studies - use min/max scores).
      *   CPM: Feed conversion ratios (FCR) (distributor, FAO), Crop deaths/hectare (regional ag studies, meta-analyses - use widest range).
      *   LUI: Land footprint (FCR + yield data), Land impact factor (IPCC/Conservation Intl. land-use impact ranges).
      *   WFI: Target species sustainability (Monterey Bay Seafood Watch rating), Bycatch ratio (fishery reports - use max credible estimate).
  *   **Analysis Rule:** Staff plots impact direction (B/H/Unclear) for each bucket across its plausible range.
  *   **Sufficient Answer:**
      *   **Pass:** B in at least one bucket across >80% of its range AND no H in any bucket across >80% of its range.
      *   **Fail:** H in any bucket across >80% of its range OR no B in any bucket across >80% of its range.
      *   **Ambiguous:** Outcomes change direction within plausible ranges (e.g., FAW B but LUI H in parts of range).
  *   **If Pass:** Proceed to Gate 4.
  *   **If Fail:** *STOP. Output: "No - Likely Net Harm (Bucket: [Bucket Name])."*
  *   **If Ambiguous:** *HAND OFF to Board.* Board makes value judgment on trade-offs. *Output: "Board Decision Required."*
  *   **Responsibility:** Staff (Data Analyst + Sustainability Officer) for filling buckets/ranges; Director reviews analysis; Board for ambiguous trade-offs.

  **Gate 4: Final Implementation Check**
  *   **Question:** Can the change be integrated without disrupting core operations or accommodation stations?
  *   **Evidence:** Kitchen manager sign-off; accommodation chef review.
  *   **Sufficient Answer:** Operational staff confirm feasibility. *If No, STOP. Output: "No - Operational Impediment."*
  *   **Responsibility:** Staff (Operations Manager).

  ---

  **Application to Proposals**

  **Proposal 1: Replace Ground Beef with Chicken Thigh (High-Volume Entrees)**
  *   **Pre-Step:** Pass (Cost similar/nuanced, nutrition similar, no accommodation conflict).
  *   **Gate 1 (Causality):** *High Risk of "No".* Likely below volume threshold for beef reduction or poultry increase. Small % change spread across many products. *HAND OFF to Director.* Director assesses if part of strategic shift. (Assume Director seeks bundled changes: **Provisional Pass**).
  *   **Gate 2 (Acceptance):** *Pass.* Chicken generally accepted; thigh cheaper/more flavorful may reduce waste vs. breast. Historical data likely supportive.
  *   **Gate 3 (Robust Impact):**
      *   FAW: Beef to Chicken *likely reduces* total land animals killed (chicken lives/calorie > beef) but *likely worsens* avg life welfare (industrial chicken << feedlot beef). Plausible range: FAW outcome Ambiguous (B on lives, H on welfare).
      *   CPM: Chicken FCR better than beef. Net CPM likely B, robust across range.
      *   LUI: Chicken land footprint much lower than beef. Net LUI likely B, robust.
      *   WFI: N/A.
      *   **Verdict:** AMBIGUOUS (FAW uncertain direction). *HAND OFF to Board.* Board must weigh animal lives vs. welfare suffering. No robust pass/fail.
  *   **Output:** "Board Decision Required." (Likely fails without Board override favoring lives over welfare).

  **Proposal 2: Donor-Funded Weekly Grass-Fed Local Beef Burger**
  *   **Pre-Step:** Pass (Donor covers cost premium, nutrition ok, accommodation: needs separate grill/cook - assume feasible).
  *   **Gate 1 (Causality):** *Likely Pass.* New, additive product. Requires new orders for specific product, signaling demand. Distributor likely sources specifically for this.
  *   **Gate 2 (Acceptance):** *Pass.* Novelty, marketing ("ethical"), donor hype likely drive high uptake. Low waste expected.
  *   **Gate 3 (Robust Impact):**
      *   FAW: Grass-fed *may* have better welfare than feedlot? (Plausible range: Minor B to Unclear). But still kills 1 cow. Per calorie, FAW is clear H vs. plant options or possibly even chicken. Robust H vs. baseline menu.
      *   CPM: Grass-fed often requires more land/time, increasing feed needs. CPM likely H robustly.
      *   LUI: *Major H.* Grass-fed requires 2-5x more land than feedlot beef or chicken. Spares no land; uses *more*. Local often means converted pasture/forest (high impact). Robust H across range.
      *   WFI: N/A.
      *   **Verdict:** FAIL (Robust H in LUI & likely H in FAW/CPM).
  *   **Output:** "No - Likely Net Harm (Bucket: Land Use Impact)." **This is the answer you won't like.** It looks sustainable but land impact dominates and is robustly harmful.

  **Proposal 3: Default Hot Line to Fish/Shrimp (2 Days/Week)**
  *   **Pre-Step:** Pass (Cost depends on species - assume within budget, nutrition ok, pescatarian option exists).
  *   **Gate 1 (Causality):** *Pass/Uncertain.* Significant volume shift. Likely alters distributor orders for seafood vs. land meat. Staff must confirm threshold impact. (Assume **Pass**).
  *   **Gate 2 (Acceptance):** *High Risk.* Seafood rejection rates often higher; strong odors increase waste risk. Requires strong evidence (pilot/similar history). Without it, *STOP.* (Assume pilot shows 15% drop in uptake but low waste: **Pass with Mitigation**).
  *   **Gate 3 (Robust Impact):**
      *   FAW: Replacing land meat reduces mammals/birds farmed. Clear B.
      *   CPM: Most seafood requires little/no feed. Clear B.
      *   LUI: Minimal land use. Clear B.
      *   WFI: **Critical.** Wild-caught fish/shrimp kills wild animals directly. Bycatch (incl. mammals, birds, turtles) and gear loss are severe. Sustainability varies wildly. Using *max credible bycatch estimates*: High chance of net H for wild animals. Plausible range: B (sustainably farmed) to Major H (high-bycatch wild). Outcome Ambiguous/H depending on sourcing.
  *   **Analysis:** Staff *must* specify species/source. If using high-bycatch shrimp or unsustainable fish (e.g., trawled cod), **FAIL** (Robust H in WFI). If using sustainably farmed mollusks (clams/mussels) or pole-caught sustainable fish, **PASS**. Generic "Fish/Shrimp" is **AMBIGUOUS/HAND OFF to Board** (Board decides risk tolerance).
  *   **Output:** Highly source-dependent. "No - Likely Net Harm (Bucket: Wild Fisheries Impact)" for high-bycatch options. "Pass" for low-impact aquaculture/sustainable pole-caught.

  ---

  **What the Procedure Cannot Do & Key Sensitivities**

  1.  **Cannot Handle:** True systemic shifts (e.g., moving entire system plant-based) - thresholds become moot. Radical uncertainty beyond "plausible range." Value conflicts where Board is gridlocked. Indirect effects (e.g., if beef reduction lowers beef price, increasing consumption elsewhere - assumes distributor signal captures this).
  2.  **Systematic Misfires:**
      *   **Over-cautious on small changes:** Gate 1 may block beneficial incremental steps.
      *   **Underestimates co-benefits:** Doesn't capture reduced GHG/water if not linked to LUI/CPM buckets.
      *   **Static analysis:** Assumes current supply chains; misses innovation triggering by demand signals.
  3.  **Most Sensitive Empirical Facts (Worth Measuring):**
      *   **Distributor Volume Thresholds (Gate 1):** What % change *actually* triggers order reductions? Measure via distributor interviews & contract analysis.
      *   **Student Swap Rejection Rates (Gate 2):** Institution-specific plate waste/uptake for key swaps (Beef->Chicken, Beef->Plant, etc.). Conduct targeted plate waste audits.
      *   **Actual Sourcing Specifications (Gate 3 - WFI & CPM):** *Exactly* what shrimp/fish species, fishery, and bycatch ratios does *your distributor* provide? Get spec sheets and Monterey Bay ratings. For meats/feeds, get *your* FCRs and regional crop data if possible (not industry averages).
      *   **Local Land-Use Impact (Gate 3 - LUI):** Is "local" pasture converted from forest? Work with Ag Extension for local land conversion data.

  **The procedure forces clarity on causality, confronts uncertainty head-on, separates facts from values, and protects against symbolic changes that backfire.** Its rigidity is its strength for auditability but requires Director/Board judgment at defined hand-off points. The grass-fed beef proposal is the most likely to fail robustly under this framework.
