      """Clip convex polygon to x >= dA and y >= dB."""
      def clip_axis(poly, axis, value):
          clipped = []
          n = len(poly)
          for i in range(n):
              cur = poly[i]
              nxt = poly[(i + 1) % n]
              cur_val = cur[axis]
              nxt_val = nxt[axis]
              if cur_val >= value:
                  if nxt_val >= value:
                      clipped.append(nxt)
                  else:
                      t = (value - cur_val) / (nxt_val - cur_val)
                      x = cur[0] + t * (nxt[0] - cur[0]) if axis == 0 else value
                      y = cur[1] + t * (nxt[1] - cur[1]) if axis == 1 else value
                      clipped.append((x, y))
              else:
                  if nxt_val >= value:
                      t = (value - cur_val) / (nxt_val - cur_val)
                      x = cur[0] + t * (nxt[0] - cur[0]) if axis == 0 else value
                      y = cur[1] + t * (nxt[1] - cur[1]) if axis == 1 else value
                      clipped.append((x, y))
                      clipped.append(nxt)
          return clipped
      
      # Clip against x >= dA
      poly_x = clip_axis(polygon, 0, dA) if polygon else []
      # Clip against y >= dB
      poly_xy = clip_axis(poly_x, 1, dB) if poly_x else []
      return poly_xy

  def ks_arbitrator(polygon, d=(0, 0)):
      """Return KS solution for convex polygon and walk-away point d."""
      dA, dB = d
      # Clip polygon to individually rational set (x>=dA, y>=dB)
      clipped = clip_polygon(polygon, dA, dB)
      if not clipped:
          return d
      
      # Find ideal point (max gains from d)
      vertices = clipped
      idealA = max(v[0] for v in vertices)
      idealB = max(v[1] for v in vertices)
      
      # If ideal point is d, return d
      if idealA == dA and idealB == dB:
          return (dA, dB)
      
      # Direction vector from d to ideal
      dx = idealA - dA
      dy = idealB - dB
      
      # Track minimal t where ray exits the polygon
      t_min = float('inf')
      
      # Iterate edges (counter-clockwise)
      n = len(vertices)
      for i in range(n):
          x1, y1 = vertices[i]
          x2, y2 = vertices[(i + 1) % n]
          
          # Edge vector and outward normal (A, B)
          A = y1 - y2
          B = x2 - x1
          C = -A * x1 - B * y1
          
          # Denominator: dot product of normal and direction
          denom = A * dx + B * dy
          F0 = A * dA + B * dB + C  # Value at d
          
          # Ray exits: denom > 0 and F0 <= 0 (d inside)
          if denom > 0:
              t_candidate = -F0 / denom
              if t_candidate < t_min:
                  t_min = t_candidate
      
      # If no exit found, return ideal (shouldn't happen for bounded sets)
      if t_min == float('inf'):
          return (idealA, idealB)
      
      # Solution point on the ray
      x_sol = dA + t_min * dx
      y_sol = dB + t_min * dy
      return (x_sol, y_sol)
