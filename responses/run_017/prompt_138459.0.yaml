  First, I need to break down the three options: suppress the protests, implement continuity, or do nothing. The user mentioned that suppressing the language might destroy evidence, which is a concern. Also, the protests came back after previous suppression, which suggests it's a persistent issue. The continuity option is costly, around tens of thousands monthly. Doing nothing is the chair's preference to avoid scrutiny.

