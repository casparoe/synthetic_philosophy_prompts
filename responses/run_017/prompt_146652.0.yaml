     - In type theory, we think of propositions as types and proofs as terms. The rule of modus ponens is an elimination rule for implication (→). So, the implication elimination rule (→-elim) is:
          Γ ⊢ f : A → B   Γ ⊢ x : A
          ------------------------- (→-elim)
                  Γ ⊢ f x : B

     - The Tortoise is asking to have the rule →-elim itself added as a premise. In type theory, that would mean having a constant for →-elim. But note: the rule is a rule of inference, not a proposition. The Tortoise is confusing the rule (a meta-level operation) with an object-level proposition.

