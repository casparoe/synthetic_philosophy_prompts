       - **Rules vs. premises**: Rules are not premises; they are part of the inference apparatus. We use rules to reason from premises. Adding the rule as a premise (C: A → (B → Z)) doesn't help because then we need a rule to use C, A, and B to get Z. The regress is because the Tortoise is demanding that every rule be internalized as an object-level premise, which then requires a new rule to use that premise.
