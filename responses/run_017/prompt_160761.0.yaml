answer: |-
  Here is your Q&A prep sheet, structured for maximum tactical advantage based on your audience and argument. The objections are ordered by potential damage to your core thesis, with speaker-specific phrasing, 90-second replies, soft spot notes, preemptive strategy, and the critical reply.

  **Preemptive Concessions (Slides 1-2):**  
  1. **"My clearance class is deliberately narrow** – it excludes most mathematically interesting statements. This is a feature, not a bug: I’m isolating where logical disagreement *must* manifest if it’s substantive at this level." *(Disarms "changing the subject" critiques by owning the limitation)*  
  2. **"Higher-order ontology is where the real action is.** My thesis doesn’t dissolve realism/anti-realism; it relocates it to questions about sets, functions, and impredicativity." *(Preempts realist frustration by affirming their core concern)*  

  **Objection to Preempt *Inside* the Talk (Not Live):**  
  **The Fragmentation Objection** ("Constructivism isn’t one position").  
  - **Why preempt?** If raised live, it derails your narrative into intra-constructivist disputes. Address it *during* your stability step:  
  > *"One might object that 'constructivism' fragments into incompatible programs (e.g., Markov’s Principle vs. Church’s Thesis). Crucially, my clearance conservativity holds for HA and PA, which are common ground. Disagreements *within* constructivism don’t affect my claim that *classical vs. intuitionistic logic itself* isn’t the locus of the realism dispute."*  

  ---

  ### **The 8 Objections (Ordered by Damage Potential)**  
  1. **The Neo-Fregean Realist** (Ontology Evasion):  
     *"You’re conflating provability with truth. Even if PA and HA prove the same Σ₁ sentences, the realist says numbers exist independently of proofs. Calling this a ‘verbal dispute’ ignores the metaphysical question: What makes these sentences true? Your ‘translation’ just smuggles in verificationism."*  
     - **Reply (90s):** "I agree truth is key—but for *clearable* sentences, truth is exhausted by computable verification. Both sides accept that a proof of ∀x∃yR(x,y) provides a computable function. The ‘metaphysical gap’ you posit doesn’t affect what we can *settle*. Where ontology bites is at higher-order, like ‘Do arbitrary subsets of ℕ exist?’. There, logic choice *does* track realism."  
     - **Soft spot:** Concedes truth might transcend verification for realists. Your reply reframes but doesn’t refute their platonism.  

  2. **The Logician (Conservativity Limits):**  
     *"Friedman conservativity for Π₂ sentences relies on PA being Σ₁-sound. If PA is inconsistent, HA proves false Σ₁ sentences too. But if we doubt PA’s consistency, your ‘no disagreement’ claim collapses—intuitionists *reject* PA’s idealistic assumptions."*  
     - **Reply (90s):** "Fair—but my clearance class assumes a shared computational basis. Both parties accept that if a Π₂ sentence is false, we can find a counterexample. If PA is inconsistent, classical *and* intuitionistic arithmetic fail empirically. The dispute isn’t about logic; it’s about whether PA *is* sound, which is prior to choosing a logic."  
     - **Soft spot:** If pressed on "prior assumptions," it circles back to ontology/epistemology.  

  3. **The Type Theorist (Computational Content):**  
     *"You’re privileging truth over proof-as-program. HA isn’t ‘PA with a modality’—it’s a theory of constructions. A classical proof of ∀x∃yR(x,y) might not give an algorithm, while an intuitionistic one does. That’s a practical difference, not verbal!"*  
     - **Reply (90s):** "Crucially, for clearable sentences, Friedman *does* extract a computable witness from the classical proof! So both logics deliver the same computational content here. The difference is pragmatic (proof style) not semantic (outcome). For non-clearable sentences (e.g., discontinuous functions), your point holds—but that’s outside my clearance class."  
     - **Soft spot:** Undersells intuitionism’s emphasis on proof *as* meaning. Realists won’t care.  

  4. **The Structuralist (Stability Failure):**  
     *"Your stability requirement is arbitrary. If logic choice *does* affect ontology in second-order math (e.g., CH), why think first-order conservativity shows ‘no disagreement’? It’s like saying Newton vs. Einstein agree on marbles, so gravity is verbal."*  
     - **Reply (90s):** "Because the clearance class is where disputes *must* be testable to be substantive. In second-order math, logic choice changes what exists (e.g., intuitionism denies non-constructible sets). But in first-order, for computable claims, both logics require the same evidence. The disagreement is only where empirical adjudication fails."  
     - **Soft spot:** "Testable" is contentious—realists reject empiricism about math.  

  5. **The Logician (Fragmentation Redux):**  
     *"Constructivism isn’t monolithic. Bishop accepts Markov’s Principle; Russian constructivism rejects it. If ‘constructivism’ has no unified semantics, how can your verdict apply generally?"*  
     - **Reply (90s):** "My argument targets the core logics (HA vs. PA), not constructivist variants. All major schools accept HA. Disagreements over Markov or Church’s Thesis are *within* the anti-realist camp, affecting which sentences are clearable—but they don’t challenge the conservativity of classical logic for HA’s clearable sentences."  
     - **Soft spot:** If HA isn’t "real" constructivism to some, your target shrinks.  

  6. **The Access Worrier (Epistemic Retreat):**  
     *"Even if disputes are ‘verbal’ for Π₂ sentences, anti-realists use intuitionism to explain *how we know* math. Your view ignores epistemology—constructivism is about access, not just truth."*  
     - **Reply (90s):** "I agree! But access concerns don’t create logical disagreement for clearable sentences. Knowing Fermat’s Last Theorem requires sophisticated tools, but once proven, verifying ∀x,y,z,n¬(xⁿ+yⁿ=zⁿ) is finite. The logic choice doesn’t change this; it changes how we justify non-clearable axioms (e.g., choice)."  
     - **Soft spot:** Sidesteps whether intuitionism *explains* access better.  

  7. **The Conservative Realist (Triviality):**  
     *"Your conclusion is tautologous: ‘Logic isn’t where the dispute lives if we restrict to where they agree.’ But realists never thought logic alone settled ontology—it’s always been about what exists."*  
     - **Reply (90s):** "Exactly! My point is that Dummett-style arguments over logic *misplace* the dispute. Anti-realists attack classical logic because they think it smuggles in platonism. I show it doesn’t—at least not until higher-order domains. So we should engage ontology directly, not via logic."  
     - **Soft spot:** Assumes anti-realists *only* attack logic over ontology—some tie it to meaning.  

  8. **The S4 Skeptic (Modal Gloss):**  
     *"The S4 embedding shows intuitionistic logic is classical under a provability modality. But that’s just formal mimicry—it doesn’t capture the constructive *meaning* of ‘∨’ or ‘∃’, which require commitments to proofs."*  
     - **Reply (90s):** "I agree the embedding is syntactical, not interpretive! But it shows intuitionistic reasoning is *formally recoverable* within classical logic plus modality. For clearable sentences, the ‘extra commitments’ of constructivism don’t produce different verdicts. Meaning differences only bite for unverifiable claims."  
     - **Soft spot:** Leaves intuitionist semantics feeling "tacked on."  

  ---

  **The Critical Reply That Must Land:**  
  **Reply #2 (Logician’s Conservativity Limits).** If conservativity hinges on PA’s consistency and you can’t defend shared ground, your "no disagreement" claim collapses. Hammer: *"Even if we doubt PA’s consistency, both sides still accept that a clearable sentence is true iff we can compute its witnesses. That procedure is neutral."*  

  **The Question You Hope Nobody Asks:**  
  *"If higher-order ontology is the real battleground, why did anyone ever think logic *was* the issue? Isn’t your view just a footnote to Quine’s ‘Two Dogmas’?"*  
  - **Why it’s dangerous:** Forces you to engage with Dummett’s arguments (manifestation, acquisition) and could paint your work as derivative.  
  - **Salvage (90s):** "Quine attacked analyticity, not logic’s metaphysical neutrality. Dummett *made* logic central by tying meaning to use. I show his move fails specifically for computational core—but yes, I stand on giants’ shoulders!"  

  **Final Tactics:**  
  - **Start strong** with preemptive concessions to neutralize realism concerns.  
  - **Preempt fragmentation** to avoid definitional tangles.  
  - **Anchor replies** in the **clearance condition**—it’s your innovation and shield.  
  - **If cornered,** retreat to: *"This is work-in-progress; I’m refining the stability criterion."*  

  This will position you as rigorous, historically informed, and focused on the meta-question—exactly where a strong PhD candidate should be. Break a leg!
